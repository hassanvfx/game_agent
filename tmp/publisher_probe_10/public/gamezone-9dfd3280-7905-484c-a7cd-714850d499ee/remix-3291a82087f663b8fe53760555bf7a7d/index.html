<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Momcore Brainrot Bouquet: Meme Reply Arcade</title>
  <!-- [agent-note][stage3] resolved-font: titles -> Bangers | ui -> Rajdhani from catalogs/fonts.json -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #180735;
      --bg-mid: #4e1f88;
      --bg-bottom: #ff67aa;
      --panel: rgba(31, 13, 76, 0.86);
      --panel-strong: rgba(48, 18, 100, 0.96);
      --stroke: #160b35;
      --cyan: #74f6ff;
      --pink: #ff8dc6;
      --hot-pink: #ff4fa3;
      --gold: #ffe37b;
      --peach: #ffe6db;
      --card: #fff6fc;
      --text: #fffafc;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(116, 246, 255, 0.18), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(255, 227, 123, 0.14), transparent 26%),
        linear-gradient(180deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: var(--text);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1.5px, transparent 2px) 0 0 / 44px 44px,
        repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,0.12) 22px 24px);
      mix-blend-mode: screen;
    }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .hidden { display: none !important; }
    .inset-0 { inset: 0; }
    .top-2 { top: 0.5rem; }
    .left-2 { left: 0.5rem; }
    .right-2 { right: 0.5rem; }
    .left-3 { left: 0.75rem; }
    .right-3 { right: 0.75rem; }
    .bottom-3 { bottom: 0.75rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { width: 100%; height: 100%; }
    .max-w-xs { max-width: 20rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .flex { display: flex; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: minmax(0, 1fr); }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.95rem; }
    .text-2xl { font-size: 1.5rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .leading-snug { line-height: 1.35; }
    .rounded-xl { border-radius: 0.75rem; }
    .text-white { color: #fff; }
    .panel {
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 227, 123, 0.18), transparent 34%),
        linear-gradient(180deg, rgba(50, 20, 104, 0.97), rgba(24, 13, 56, 0.95));
      border: 3px solid rgba(116, 246, 255, 0.88);
      box-shadow:
        0 10px 0 rgba(22, 11, 53, 0.42),
        0 16px 30px rgba(6, 5, 22, 0.36),
        inset 0 0 0 2px rgba(255, 141, 198, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.22);
      border-radius: 20px;
      color: var(--text);
      font-family: 'Rajdhani', system-ui, sans-serif;
      backdrop-filter: blur(7px);
    }
    .hud-pill {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.86), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 221, 239, 0.94));
      border: 2px solid rgba(22, 11, 53, 0.92);
      box-shadow: 0 4px 0 rgba(22, 11, 53, 0.92), 0 0 18px rgba(116, 246, 255, 0.22);
      border-radius: 999px;
      color: #24104f;
      font-weight: 700;
      font-family: 'Rajdhani', system-ui, sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .choice-btn {
      min-height: 54px;
      border: 2px solid rgba(22, 11, 53, 0.95);
      box-shadow:
        0 5px 0 rgba(22, 11, 53, 0.95),
        0 0 22px rgba(255, 141, 198, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.75);
      border-radius: 16px;
      font-weight: 700;
      color: #24104f;
      background:
        radial-gradient(circle at 13% 18%, rgba(255,255,255,0.95), transparent 22%),
        linear-gradient(180deg, #fff9ff, #ffc7e4 62%, #ff9bcc);
      font-family: 'Rajdhani', system-ui, sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .choice-btn:hover,
    .choice-btn:focus-visible {
      filter: brightness(1.04);
      outline: none;
    }
    h2, #restart-btn {
      font-family: 'Bangers', system-ui, sans-serif;
      letter-spacing: 0.05em;
    }
    h2 {
      margin: 0;
      color: var(--gold);
      text-shadow: 0 3px 0 var(--stroke), 0 0 18px rgba(255, 141, 198, 0.45);
    }
    #hud {
      pointer-events: none;
    }
    #promptLabel {
      border-color: rgba(255, 141, 198, 0.92);
      position: relative;
      overflow: hidden;
      text-shadow: 0 1px 0 rgba(22, 11, 53, 0.8);
    }
    #promptLabel::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 227, 123, 0.18), transparent 26%),
        linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 45%, transparent 100%);
      pointer-events: none;
    }
    #levelBadge {
      align-self: center;
      max-width: min(88vw, 24rem);
      text-align: center;
      transform: rotate(-1deg);
      font-size: 0.82rem;
      padding-inline: 0.9rem;
      background: linear-gradient(180deg, #ffe37b, #ffb7df);
    }
    #choice-panel {
      /* [agent-note][stage2] preserve: control-zone | reason: already mobile-safe */
      padding-bottom: max(0px, env(safe-area-inset-bottom));
    }
    #restart-btn {
      background: linear-gradient(180deg, #ff68b8, #ff4a8b);
      border: 3px solid rgba(22, 11, 53, 0.96);
      box-shadow: 0 4px 0 rgba(22, 11, 53, 0.96), 0 0 18px rgba(255, 141, 198, 0.3);
    }
    #restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(22, 11, 53, 0.96);
    }
    .choice-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(22, 11, 53, 0.96); }
    #feedback-gifs {
      pointer-events: none;
      inset: auto 0 calc(5.5rem + env(safe-area-inset-bottom)) 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 0 0.75rem;
    }
    .feedback-gif {
      width: min(26vw, 92px);
      max-height: 92px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 20px rgba(7, 5, 24, 0.28);
      opacity: 0;
      transform: translateY(10px) scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      background: rgba(255,255,255,0.08);
    }
    .feedback-gif.show {
      opacity: 0.95;
      transform: translateY(0) scale(1);
    }
    .feedback-gif.fail {
      border-color: rgba(255, 110, 160, 0.8);
    }
    .feedback-gif.win {
      border-color: rgba(255, 227, 123, 0.88);
    }
    .shake { animation: kshake 180ms linear; }
    @keyframes kshake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-3px, 1px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>
</head>

  <script id="game-config" type="application/x-game-config">
  {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 12 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff5fa2" }
  }
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const hud = document.getElementById('hud');
    const choicePanel = document.getElementById('choice-panel');
    const choiceA = document.getElementById('choiceA');
    const choiceB = document.getElementById('choiceB');
    const promptLabel = document.getElementById('promptLabel');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('finalScore');
    const scoreLabel = document.getElementById('scoreLabel');
    const hpLabel = document.getElementById('hpLabel');
    const levelBadge = document.getElementById('levelBadge');
    const restartBtn = document.getElementById('restart-btn');
    const bgm = document.getElementById('bgm_main');
    const successGif = document.getElementById('gif-success');
    if (bgm) bgm.volume = 0.2;
    const failGif = document.getElementById('gif-fail');

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
    window.updateGameConfig = (key, val) => {
      if (!window.gameConfigDefs[key]) return;
      const def = window.gameConfigDefs[key];
      if (def.type === 'number') {
        const n = Number(val);
        if (Number.isFinite(n)) window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
      } else if (def.type === 'color') {
        if (/^#[0-9a-fA-F]{6}$/.test(String(val))) {
          window.gameConfig[key] = String(val);
          if (choiceA) choiceA.style.borderColor = '#2e1b62';
          if (choiceB) choiceB.style.borderColor = '#2e1b62';
        }
      }
      document.title = 'Momcore Brainrot Bouquet: Meme Reply Arcade';
    };

    let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
    let initialized = false;
    let gameState = 'PLAYING';
    let lastTime = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let pulseTimer = 0;
    let score = 0;
    let lives = 3;
    let pointer = { x: 0, y: 0, down: false };
    let hero = null;
    const particles = [];
    const petals = [];
    let storyIndex = 0;
    let choiceCooldown = 0;
    let starsOffsetA = 0;
    let starsOffsetB = 0;
    let gifTimer = 0;
    let activeGif = null;

    const storyNodes = [
      { prompt: "Kitchen Card Warmup: Mom opens your handmade meme card. Choose the reply that makes it wholesome.", options: ["“You’re the legend behind every good vibe, Mom.”", "Post only “ratio” and dodge the hug."], good: 0 },
      { prompt: "Bouquet Meme Drop: the flowers arrive chaotic and glitter-coded. Keep the bouquet mom-approved.", options: ["“These blooms are loud because our love is louder.”", "Complain that the roses ruined your drip."], good: 0 },
      { prompt: "Family Group Chat Arena: the chat spams nonsense. Pin the one reply that respects Mom.", options: ["“Everyone pause and appreciate Mom’s undefeated lore.”", "Roast the family chat for easy clout."], good: 0 },
      { prompt: "Mall Kiosk Gift Rush: neon deals scream for attention. Don’t fumble the gift speech.", options: ["“The real gift is showing up with love and thanks.”", "Brag that the sale sticker matters most."], good: 0 },
      { prompt: "Momday Meme Throne Finale: deliver the final legendary reply for the crowned Momday ceremony.", options: ["“Mom, you’re canon, crowned, and loved beyond the meme.”", "Stay frosty and skip the appreciation arc."], good: 0 }
    ];
    const storyBeatNames = [
      'Kitchen Card Warmup',
      'Bouquet Meme Drop',
      'Family Group Chat Arena',
      'Mall Kiosk Gift Rush',
      'Momday Throne Finale'
    ];

    const audioManager = {
      ctx: null,
      unlocked: false,
      buffers: {},
      initDone: false,
      async init() {
        if (this.initDone) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = AC ? new AC() : null;
        const sfxEls = [
          document.getElementById('sfx_collect'),
          document.getElementById('sfx_hit'),
          document.getElementById('sfx_ui'),
          document.getElementById('sfx_gameover')
        ].filter(Boolean);
        for (const el of sfxEls) {
          try {
            const audioUrl = new URL(el.src, window.location.href);
            // [agent-note][stage4] repair: avoid CORS-noisy WebAudio fetches for optional remote SFX; synth fallback preserves action feedback.
            if (audioUrl.origin !== window.location.origin) continue;
            const res = await fetch(el.src);
            const arr = await res.arrayBuffer();
            if (this.ctx) this.buffers[el.id] = await this.ctx.decodeAudioData(arr.slice(0));
          } catch (_) {}
        }
        this.initDone = true;
      },
      unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        try { this.ctx && this.ctx.resume(); } catch (_) {}
        if (bgm) bgm.play().catch(() => {});
      },
      playSfx(id) {
        const synthType = id === 'sfx_hit' || id === 'sfx_gameover' ? 'hit' : id === 'sfx_ui' ? 'ui' : 'collect';
        if (!this.ctx) return this.synth(synthType);
        const b = this.buffers[id];
        if (b) {
          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          gain.gain.value = id === 'sfx_gameover' ? 0.18 : id === 'sfx_hit' ? 0.2 : id === 'sfx_ui' ? 0.12 : 0.16;
          src.buffer = b;
          src.connect(gain).connect(this.ctx.destination);
          src.start(0);
        } else this.synth(synthType);
      },
      synth(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type === 'hit' ? 'square' : type === 'ui' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(type === 'hit' ? 160 : type === 'ui' ? 480 : 640, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'hit' ? 90 : type === 'ui' ? 720 : 910, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(type === 'ui' ? 0.07 : 0.11, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    };

    function vibrate(style) {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style }
      });
    }

    function setState(next) {
      gameState = next;
      if (gameState === 'PLAYING') {
        hud.classList.remove('hidden');
        choicePanel.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
      } else {
        hud.classList.add('hidden');
        choicePanel.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
      }
    }

    function buildPetals() {
      petals.length = 0;
      for (let i = 0; i < 20; i++) {
        petals.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          s: 4 + Math.random() * 8,
          vy: 16 + Math.random() * 20,
          vx: -12 + Math.random() * 24,
          rot: Math.random() * Math.PI * 2
        });
      }
    }

    function updateStoryText() {
      const node = storyNodes[storyIndex] || storyNodes[storyNodes.length - 1];
      promptLabel.textContent = node.prompt;
      choiceA.textContent = node.options[0];
      choiceB.textContent = node.options[1];
    }

    function showFeedbackGif(kind) {
      gifTimer = 0.85;
      activeGif = kind;
      if (successGif) successGif.classList.toggle('show', kind === 'success');
      if (failGif) failGif.classList.toggle('show', kind === 'fail');
    }

    function hideFeedbackGifs() {
      activeGif = null;
      gifTimer = 0;
      if (successGif) successGif.classList.remove('show');
      if (failGif) failGif.classList.remove('show');
    }

    function initGame() {
      score = 0;
      lives = 3;
      flashTimer = 0;
      shakeTimer = 0;
      pulseTimer = 0;
      storyIndex = 0;
      choiceCooldown = 0;
      hideFeedbackGifs();
      pointer.x = cw * 0.5;
      pointer.y = ch * 0.82;
      pointer.down = false;
      hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      particles.length = 0;
      buildPetals();
      updateStoryText();
      updateHUD();
    }

    function restartGame() {
      audioManager.playSfx('sfx_ui');
      initGame();
      setState('PLAYING');
      if (bgm) bgm.play().catch(() => {});
    }

    function updateHUD() {
      scoreLabel.textContent = `Mom Hype: ${score}`;
      hpLabel.textContent = `Family Chill: ${lives}`;
      if (levelBadge) levelBadge.textContent = storyBeatNames[storyIndex] || storyBeatNames[storyBeatNames.length - 1];
    }

    function emitParticles(x, y, good) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() * 2 - 1) * (good ? 110 : 140),
          vy: -30 - Math.random() * 130,
          life: 0.35 + Math.random() * 0.35,
          t: 0,
          good
        });
      }
    }

    function applyChoice(choiceIndex) {
      if (choiceCooldown > 0 || gameState !== 'PLAYING') return;
      const node = storyNodes[storyIndex];
      if (!node) return;
      choiceCooldown = 0.25;
      const good = choiceIndex === node.good;
      if (good) {
        score += 20;
        pulseTimer = 0.16;
        flashTimer = 0.08;
        audioManager.playSfx('sfx_collect');
        showFeedbackGif('success');
        vibrate('light');
        emitParticles(cw * 0.5, ch * 0.58, true);
      } else {
        lives -= 1;
        shakeTimer = 0.16;
        flashTimer = 0.16;
        audioManager.playSfx('sfx_hit');
        showFeedbackGif('fail');
        vibrate(lives <= 0 ? 'heavy' : 'medium');
        emitParticles(cw * 0.5, ch * 0.58, false);
      }
      storyIndex = Math.min(storyNodes.length - 1, storyIndex + 1);
      updateStoryText();
      updateHUD();
      if (lives <= 0) {
        audioManager.playSfx('sfx_gameover');
        setState('GAMEOVER');
        finalScore.textContent = `Mom Hype secured: ${score}`;
      }
    }

    function handleGameInput(e, type) {
      const px = typeof e.clientX === 'number' ? e.clientX : pointer.x;
      const py = typeof e.clientY === 'number' ? e.clientY : pointer.y;
      if (type === 'pointerdown') pointer.down = true;
      if (type === 'pointerup' || type === 'pointercancel') pointer.down = false;
      pointer.x = Math.max(0, Math.min(cw, px));
      pointer.y = Math.max(0, Math.min(ch, py));
      if (hero) {
        hero.targetX = pointer.x;
        hero.targetY = ch * 0.82;
      }
    }

    function handleGlobalInput(e) {
      unlockAudio();
      const t = e && e.type ? e.type : 'pointerdown';

      if (e && e.currentTarget === restartBtn) {
        if (gameState === 'GAMEOVER') restartGame();
        return;
      }
      if (e && e.currentTarget === choiceA) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(0);
        }
        return;
      }
      if (e && e.currentTarget === choiceB) {
        if (gameState === 'PLAYING') {
          audioManager.playSfx('sfx_ui');
          applyChoice(1);
        }
        return;
      }

      if (e && e.currentTarget !== canvas) return;
      if (e && e.cancelable && t !== 'pointermove') e.preventDefault();

      if (gameState === 'GAMEOVER') {
        if (t === 'pointerdown') restartGame();
        return;
      }
      if (gameState === 'PLAYING') handleGameInput(e, t);
    }

    function unlockAudio() {
      audioManager.unlock();
      if (bgm) bgm.play().catch(() => {});
    }

    function resize(width, height) {
      cw = width;
      ch = height;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      if (hero) {
        hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
        hero.targetX = Math.max(hero.r, Math.min(cw - hero.r, hero.targetX));
        hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));
        hero.targetY = Math.max(hero.r, Math.min(ch - hero.r, hero.targetY));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function traceHeart(x, y, s) {
      ctx.moveTo(x, y + s * 0.48);
      ctx.bezierCurveTo(x - s * 1.05, y - s * 0.12, x - s * 0.72, y - s * 0.86, x - s * 0.24, y - s * 0.58);
      ctx.bezierCurveTo(x, y - s * 0.94, x + s * 0.72, y - s * 0.86, x + s * 0.72, y - s * 0.18);
      ctx.bezierCurveTo(x + s * 0.72, y + s * 0.22, x + s * 0.34, y + s * 0.44, x, y + s * 0.88);
    }

    function drawStickerHeart(x, y, s, fill = '#ff5fa2', alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = 'rgba(255, 141, 198, 0.34)';
      ctx.shadowBlur = s * 0.38;
      ctx.fillStyle = fill;
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = Math.max(2, s * 0.1);
      ctx.beginPath();
      traceHeart(x, y, s);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(x - s * 0.22, y - s * 0.2, s * 0.18, s * 0.09, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawCrown(x, y, s, fill = '#ffe37b') {
      ctx.save();
      ctx.fillStyle = fill;
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = Math.max(2, s * 0.08);
      ctx.beginPath();
      ctx.moveTo(x - s, y + s * 0.42);
      ctx.lineTo(x - s * 0.76, y - s * 0.56);
      ctx.lineTo(x - s * 0.28, y + s * 0.12);
      ctx.lineTo(x, y - s * 0.72);
      ctx.lineTo(x + s * 0.28, y + s * 0.12);
      ctx.lineTo(x + s * 0.76, y - s * 0.56);
      ctx.lineTo(x + s, y + s * 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.48)';
      ctx.fillRect(x - s * 0.62, y + s * 0.24, s * 1.24, s * 0.12);
      ctx.restore();
    }

    function drawGiftBox(x, y, s, alpha = 0.86) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffe37b';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = Math.max(2, s * 0.08);
      ctx.beginPath();
      ctx.roundRect(x - s, y - s * 0.72, s * 2, s * 1.44, s * 0.2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ff4fa3';
      ctx.fillRect(x - s * 0.15, y - s * 0.72, s * 0.3, s * 1.44);
      ctx.fillRect(x - s, y - s * 0.12, s * 2, s * 0.28);
      ctx.restore();
    }

    function drawChatBubble(x, y, w, h, fill, alpha = 0.82) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = fill;
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - w * 0.5, y - h * 0.5, w, h, h * 0.32);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - w * 0.18, y + h * 0.42);
      ctx.lineTo(x - w * 0.04, y + h * 0.68);
      ctx.lineTo(x + w * 0.02, y + h * 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.beginPath();
      ctx.arc(x - w * 0.22, y, h * 0.08, 0, Math.PI * 2);
      ctx.arc(x, y, h * 0.08, 0, Math.PI * 2);
      ctx.arc(x + w * 0.22, y, h * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBouquet(x, y, s, alpha = 0.9) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = Math.max(2, s * 0.08);
      const colors = ['#ff8dc6', '#ffe37b', '#74f6ff', '#ff5fa2', '#fff6fc'];
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = colors[i];
        const px = x + (i - 2) * s * 0.38;
        const py = y - s * (0.36 + (i % 2) * 0.22);
        ctx.beginPath();
        ctx.arc(px, py, s * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = '#75f0b2';
      ctx.beginPath();
      ctx.moveTo(x - s * 0.85, y + s * 0.02);
      ctx.lineTo(x, y + s * 1.12);
      ctx.lineTo(x + s * 0.85, y + s * 0.02);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ff4fa3';
      ctx.beginPath();
      ctx.ellipse(x, y + s * 0.44, s * 0.52, s * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBackground(dt) {
      const beat = storyIndex;
      const t = performance.now() * 0.001;
      const g = ctx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, beat >= 4 ? '#281046' : '#180735');
      g.addColorStop(0.42, beat >= 2 ? '#53218c' : '#34166c');
      g.addColorStop(1, beat === 3 ? '#ff7c5f' : '#ff67aa');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);

      const glowA = ctx.createRadialGradient(cw * 0.2, ch * 0.18, 0, cw * 0.2, ch * 0.18, cw * 0.45);
      glowA.addColorStop(0, 'rgba(116,246,255,0.28)');
      glowA.addColorStop(1, 'rgba(116,246,255,0)');
      ctx.fillStyle = glowA;
      ctx.fillRect(0, 0, cw, ch);

      const glowB = ctx.createRadialGradient(cw * 0.78, ch * 0.22, 0, cw * 0.78, ch * 0.22, cw * 0.42);
      glowB.addColorStop(0, beat >= 4 ? 'rgba(255,227,123,0.32)' : 'rgba(255,141,198,0.26)');
      glowB.addColorStop(1, 'rgba(255,141,198,0)');
      ctx.fillStyle = glowB;
      ctx.fillRect(0, 0, cw, ch);

      starsOffsetA += dt * 10;
      starsOffsetB += dt * 16;

      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = 1;
      for (let y = 70; y < ch * 0.58; y += 42) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(t + y) * 4);
        ctx.lineTo(cw, y + Math.cos(t + y) * 4);
        ctx.stroke();
      }
      ctx.restore();

      for (let i = 0; i < 28; i++) {
        const x = (i * 47 + starsOffsetB * (1 + i * 0.02)) % (cw + 60) - 30;
        const y = ((i * 71) % Math.floor(ch * 0.56 + 40)) - 20;
        const r = i % 3 === 0 ? 2.2 : 1.2;
        ctx.fillStyle = i % 4 === 0 ? 'rgba(255,227,123,0.86)' : 'rgba(255,255,255,0.72)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(0, Math.sin(t * 0.8) * 3);
      for (let i = 0; i < 5; i++) {
        const x = (i * 112 + starsOffsetA * (0.42 + i * 0.03)) % (cw + 150) - 70;
        const y = ch * (0.31 + (i % 2) * 0.08);
        if (beat === 0) {
          ctx.fillStyle = 'rgba(255,246,252,0.22)';
          ctx.strokeStyle = 'rgba(22,11,53,0.34)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(x, y, 64, 42, 8); ctx.fill(); ctx.stroke();
          drawStickerHeart(x + 32, y + 17, 10, '#ff8dc6', 0.42);
        } else if (beat === 1) {
          drawBouquet(x + 30, y + 20, 18, 0.34);
        } else if (beat === 2) {
          drawChatBubble(x + 38, y + 20, 72, 34, i % 2 ? '#ff8dc6' : '#74f6ff', 0.34);
        } else if (beat === 3) {
          drawGiftBox(x + 34, y + 24, 22, 0.36);
        } else {
          drawCrown(x + 36, y + 20, 23, '#ffe37b');
        }
      }
      ctx.restore();

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.y += p.vy * dt;
        p.x += p.vx * dt + Math.sin(t + i) * 0.24;
        p.rot += dt * 1.2;
        if (p.y > ch + 20) { p.y = -20; p.x = Math.random() * cw; }
        if (p.x < -20) p.x = cw + 20;
        if (p.x > cw + 20) p.x = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = i % 4 === 0 ? 'rgba(255,227,123,0.48)' : i % 3 === 0 ? 'rgba(116,246,255,0.42)' : 'rgba(255,232,245,0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = 'rgba(17,10,40,0.32)';
      for (let i = 0; i < 8; i++) {
        const w = 66 + i * 12;
        const h = 80 + i * 12;
        const x = (i * 82 + starsOffsetA * (0.8 + i * 0.04)) % (cw + 120) - 60;
        ctx.beginPath();
        ctx.roundRect(x, ch * 0.58, w, h, 13);
        ctx.fill();
        ctx.fillStyle = i % 2 ? 'rgba(255,141,198,0.13)' : 'rgba(116,246,255,0.14)';
        ctx.fillRect(x + 8, ch * 0.58 + 12, 7, Math.max(16, h * 0.32));
        ctx.fillStyle = 'rgba(17,10,40,0.32)';
      }
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(0, ch * 0.54, cw, 2);

      // [agent-note][world-design-superprompt] authored-bg: procedural Momday motifs replace boardroom ownership while preserving render/input architecture.
      ctx.save();
      ctx.translate(cw * 0.5, ch * 0.36 + Math.sin(t * 2) * 3);
      ctx.globalAlpha = 0.9;
      if (beat === 0) {
        ctx.fillStyle = '#fff6fc';
        ctx.strokeStyle = '#160b35';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-66, -38, 132, 76, 14); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,227,123,0.6)';
        ctx.fillRect(-52, -24, 104, 8);
        drawStickerHeart(0, 4, 25, '#ff5fa2', 1);
      } else if (beat === 1) {
        drawBouquet(0, -4, 31, 1);
      } else if (beat === 2) {
        drawChatBubble(-22, -10, 118, 48, '#fff6fc', 1);
        drawChatBubble(32, 28, 96, 38, '#74f6ff', 0.88);
        drawStickerHeart(18, -9, 12, '#ff5fa2', 1);
      } else if (beat === 3) {
        drawGiftBox(0, 0, 42, 1);
        ctx.fillStyle = '#74f6ff';
        ctx.font = '700 14px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('MOM SALE', 0, -48);
      } else {
        ctx.shadowColor = 'rgba(255,227,123,0.45)';
        ctx.shadowBlur = 20;
        drawCrown(0, -10, 45, '#ffe37b');
        ctx.shadowBlur = 0;
        drawStickerHeart(0, 44, 32, '#ff8dc6', 1);
      }
      ctx.restore();

      const carpet = ctx.createLinearGradient(0, ch * 0.54, 0, ch);
      carpet.addColorStop(0, 'rgba(255,141,198,0.08)');
      carpet.addColorStop(1, 'rgba(22,11,53,0.42)');
      ctx.fillStyle = carpet;
      ctx.fillRect(0, ch * 0.54, cw, ch * 0.46);
    }

    function drawCharacters() {
      const y = ch * 0.47;
      const r = Math.max(24, cw * 0.09);
      const bob = Math.sin(performance.now() * 0.0035) * 2.5;

      // protagonist: meme kid sticker energy
      ctx.save();
      ctx.translate(cw * 0.3, y + bob);
      ctx.shadowColor = 'rgba(255,141,198,0.45)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffe8df';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7a4a54';
      ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.72, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8dc6';
      ctx.beginPath(); ctx.moveTo(-r * 0.8, -r * 0.15); ctx.quadraticCurveTo(0, -r * 0.95, r * 0.8, -r * 0.15); ctx.lineTo(0, -r * 0.42); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -2, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = window.gameConfig.themeColor;
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.arc(0, r * 0.16, r * 0.34, 0.25, Math.PI - 0.25); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.12, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3d215f';
      ctx.beginPath(); ctx.roundRect(-r * 0.7, r * 0.98, r * 1.4, r * 1.5, 12); ctx.fill();
      ctx.fillStyle = '#74f6ff';
      ctx.fillRect(-r * 0.12, r * 1.08, r * 0.24, r * 1.3);
      ctx.restore();

      // Momday host: crowned Mom celebration silhouette
      ctx.save();
      ctx.translate(cw * 0.7, y - 6 - bob * 0.8);
      ctx.shadowColor = 'rgba(116,246,255,0.38)';
      ctx.shadowBlur = 16;
      drawBouquet(0, -r * 0.7, r * 0.42, 0.75);
      ctx.fillStyle = '#fff1e9';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#6d3556';
      ctx.beginPath();
      ctx.moveTo(-r, -r * 0.08); ctx.quadraticCurveTo(-r * 0.4, -r * 1.08, r * 0.92, -r * 0.28); ctx.lineTo(r * 0.86, -r * 0.58);
      ctx.quadraticCurveTo(0, -r * 1.25, -r, -r * 0.5); ctx.closePath(); ctx.fill();
      drawCrown(0, -r * 1.02, r * 0.42, '#ffe37b');
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.28, -1, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#74f6ff'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.31, 0.4, Math.PI - 0.4); ctx.stroke();
      ctx.fillStyle = '#ff8dc6';
      ctx.beginPath(); ctx.ellipse(-r * 0.48, r * 0.15, r * 0.13, r * 0.08, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.48, r * 0.15, r * 0.13, r * 0.08, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,246,252,0.96)';
      ctx.beginPath(); ctx.roundRect(-r * 0.95, r * 1.0, r * 1.9, r * 1.95, 12); ctx.fill();
      ctx.strokeStyle = '#160b35'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#ff8dc6';
      ctx.beginPath();
      ctx.moveTo(0, r * 1.05); ctx.lineTo(-r * 0.26, r * 1.65); ctx.lineTo(0, r * 2.28); ctx.lineTo(r * 0.26, r * 1.65); ctx.closePath();
      ctx.fill();
      drawStickerHeart(0, r * 1.65, r * 0.22, '#ff4fa3', 0.92);
      ctx.restore();
    }

    function drawHero() {
      if (!hero) return;
      const x = hero.x;
      const y = hero.y + Math.sin(performance.now() * 0.006) * 2;
      const r = Math.max(0, hero.r);
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = 'rgba(116,246,255,0.55)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff4fb';
      ctx.strokeStyle = '#160b35';
      ctx.lineWidth = 3;
      ctx.beginPath();
      traceHeart(0, -r * 0.1, r * 0.98);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = window.gameConfig.themeColor;
      ctx.beginPath();
      ctx.arc(-r * 0.28, -r * 0.1, r * 0.2, 0, Math.PI * 2);
      ctx.arc(r * 0.28, -r * 0.1, r * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#160b35';
      ctx.beginPath(); ctx.arc(-r * 0.15, r * 0.14, r * 0.07, 0, Math.PI * 2); ctx.arc(r * 0.15, r * 0.14, r * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#74f6ff';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0, r * 0.25, r * 0.25, 0.18, Math.PI - 0.18); ctx.stroke();
      ctx.strokeStyle = '#ffe37b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r * 0.48, -r * 0.72);
      ctx.lineTo(r * 0.8, -r * 0.98);
      ctx.lineTo(r * 0.68, -r * 0.6);
      ctx.stroke();
      ctx.restore();
    }

    function update(dt) {
      if (!hero || !Number.isFinite(hero.x) || !Number.isFinite(hero.y)) {
        hero = { x: cw * 0.3, y: ch * 0.82, r: Math.max(14, Math.min(22, cw * 0.048)), targetX: cw * 0.3, targetY: ch * 0.82, alive: true };
      }

      const moveFactor = Math.max(0, Math.min(1, dt * (window.gameConfig.heroSpeed * 1.6)));
      hero.x += (hero.targetX - hero.x) * moveFactor;
      hero.y += (hero.targetY - hero.y) * Math.max(0, Math.min(1, dt * 9));
      hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
      hero.y = Math.max(hero.r, Math.min(ch - hero.r, hero.y));

      if (choiceCooldown > 0) choiceCooldown -= dt;
      if (flashTimer > 0) flashTimer -= dt;
      if (shakeTimer > 0) shakeTimer -= dt;
      if (pulseTimer > 0) pulseTimer -= dt;
      if (gifTimer > 0) {
        gifTimer -= dt;
        if (gifTimer <= 0) hideFeedbackGifs();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 210 * dt;
        if (p.t >= p.life) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, cw, ch);
      drawBackground(Math.min(0.05, (performance.now() - lastTime) / 1000 || 0.016));

      if (shakeTimer > 0) gameContainer.classList.add('shake');
      else gameContainer.classList.remove('shake');

      ctx.save();
      if (pulseTimer > 0 && hero) {
        const s = 1 + pulseTimer * 0.08;
        ctx.translate(hero.x, hero.y);
        ctx.scale(s, s);
        ctx.translate(-hero.x, -hero.y);
      }
      drawCharacters();
      drawHero();

      for (const p of particles) {
        const a = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.good ? `rgba(255,250,120,${a})` : `rgba(255,90,120,${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, 2 + a * 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (flashTimer > 0) {
        const red = shakeTimer > 0 ? 'rgba(255,50,75,0.22)' : 'rgba(255,255,255,0.10)';
        ctx.fillStyle = red;
        ctx.fillRect(0, 0, cw, ch);
      }
    }

    function loop(ts) {
      try {
        const dt = Math.min(0.05, Math.max(0.001, (ts - (lastTime || ts)) / 1000));
        lastTime = ts;
        if (gameState === 'PLAYING') update(dt);
        render();
      } catch (_) {}
      requestAnimationFrame(loop);
    }

    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        resize(entry.contentRect.width, entry.contentRect.height);
      }
      if (!initialized) {
        initGame();
        setState('PLAYING');
        if (bgm) bgm.play().catch(() => {});
        audioManager.init().then(() => {}).catch(() => {});
        initialized = true;
        requestAnimationFrame(loop);
      }
    });
    ro.observe(canvas);

    ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach((ev) => {
      canvas.addEventListener(ev, handleGlobalInput, { passive: false });
    });

    if (choiceA) choiceA.addEventListener('click', handleGlobalInput, { passive: false });
    if (choiceB) choiceB.addEventListener('click', handleGlobalInput, { passive: false });
    if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive: false });
  });
  </script>
</body>
