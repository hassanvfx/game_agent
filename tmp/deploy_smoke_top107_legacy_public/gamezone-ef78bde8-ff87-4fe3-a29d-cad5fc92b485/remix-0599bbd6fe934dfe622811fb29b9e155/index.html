<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Turbo Panic: Meme Express</title>
    <!-- [agent-note][stage3] resolved-font: title -> Bangers, ui/hud -> Exo 2 from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --panel-border: rgba(125, 211, 252, 0.9);
            --panel-highlight: rgba(255, 255, 255, 0.14);
            --text-dark: #e2e8f0;
            --text-soft: #bfd4e6;
            --track-green-a: #16a34a;
            --track-green-b: #15803d;
            --gold: #facc15;
            --gold-soft: #fde68a;
            --cyan: #67e8f9;
            --blue: #2563eb;
            --hot-pink: #f472b6;
            --teal-overlay: rgba(8, 47, 73, 0.82);
            --danger-overlay: rgba(76, 5, 25, 0.82);
            --shadow: rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.2), transparent 38%),
                linear-gradient(180deg, #0f172a 0%, #111827 52%, #020617 100%);
            color: var(--text-dark);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .inset-0 { inset: 0; }
        .full-size { width: 100%; height: 100%; }
        .overflow-hidden { overflow: hidden; }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,0.22), transparent 35%),
                linear-gradient(180deg, #38bdf8 0%, #7dd3fc 46%, #86efac 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            padding: 16px;
        }

        .start-overlay {
            background: var(--teal-overlay);
            backdrop-filter: blur(8px);
        }

        .gameover-overlay {
            background: var(--danger-overlay);
            backdrop-filter: blur(10px);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), transparent 30%),
                var(--panel-bg);
            border: 3px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 0 0 1px rgba(15, 23, 42, 0.26),
                0 12px 32px var(--shadow);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            width: min(100%, 420px);
            padding: 32px 28px;
            text-align: center;
        }

        .title-text {
            margin: 0;
            font-family: 'Bangers', 'Exo 2', sans-serif;
            color: #ecfeff;
            text-shadow: 0 0 14px rgba(103, 232, 249, 0.9), 0 0 34px rgba(59, 130, 246, 0.5);
            line-height: 0.92;
            letter-spacing: 0.04em;
            font-size: clamp(2.6rem, 9vw, 4.1rem);
            font-weight: 400;
            text-transform: uppercase;
        }

        .title-highlight {
            display: inline-block;
            color: #facc15;
            font-size: 0.78em;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.65);
        }

        .divider {
            height: 4px;
            width: 128px;
            margin: 16px auto;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
            border-radius: 999px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--text-soft);
            font-size: 1.02rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.28em;
        }

        .action-button {
            width: 100%;
            border: 2px solid rgba(255,255,255,0.26);
            border-radius: 999px;
            padding: 18px 24px;
            font-family: 'Bangers', 'Exo 2', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.08em;
            color: #fff;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.26);
        }

        .action-button:active {
            transform: translateY(2px);
        }

        .start-button {
            background: linear-gradient(180deg, #22d3ee, #2563eb);
            border-bottom: 8px solid #1d4ed8;
        }

        .restart-button {
            background: linear-gradient(180deg, #fb7185, #e11d48);
            color: #fff7ed;
            border-bottom: 4px solid #9f1239;
        }

        .info-grid {
            margin-top: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            background: rgba(15, 23, 42, 0.46);
            padding: 16px;
            border-radius: 18px;
            color: var(--text-soft);
            font-size: 0.88rem;
            font-weight: 700;
            border: 1px solid rgba(103, 232, 249, 0.18);
        }

        .info-grid strong {
            color: #f8fafc;
            font-weight: 700;
        }

        .info-banner {
            grid-column: 1 / -1;
            text-align: center;
            color: #67e8f9;
            margin-top: 4px;
        }

        .results-title {
            margin: 0 0 10px;
            font-family: 'Bangers', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 7vw, 3rem);
            color: #fda4af;
            text-shadow: 0 0 18px rgba(244, 114, 182, 0.4);
        }

        .results-score {
            margin: 0 0 24px;
            color: #e2e8f0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .results-score span {
            color: #67e8f9;
            font-size: 1.9rem;
        }

        #controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: auto;
            touch-action: none;
        }

        #stick-base {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.14), transparent 45%),
                rgba(15, 23, 42, 0.36);
            border: 3px solid rgba(125, 211, 252, 0.6);
            backdrop-filter: blur(4px);
            box-shadow: inset 0 0 24px rgba(0,0,0,0.25), 0 0 18px rgba(103, 232, 249, 0.18);
        }

        #stick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ecfeff, #38bdf8 45%, #2563eb 100%);
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            pointer-events: none;
            border: 2px solid rgba(255,255,255,0.9);
        }

        .action-btn-group {
            position: absolute;
            bottom: 40px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .game-btn {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', 'Exo 2', sans-serif;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.06em;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 10px 10px rgba(0,0,0,0.3), 0 0 18px rgba(255,255,255,0.16);
            transition: transform 0.05s, box-shadow 0.05s;
            position: relative;
            overflow: hidden;
        }

        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2), 0 4px 4px rgba(0,0,0,0.3);
        }

        .game-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        #jump-btn {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #facc15, #fb7185);
            font-size: 18px;
            z-index: 10;
        }

        #boost-btn {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #67e8f9, #2563eb);
            font-size: 11px;
            margin-right: 24px;
        }

        #spindash-btn {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #fb7185, #be123c);
            font-size: 11px;
            margin-right: 24px;
        }

        @keyframes lockon {
            0% { transform: scale(2.0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .reticle {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 4px solid #67e8f9;
            border-radius: 50%;
            box-shadow: 0 0 15px #67e8f9, inset 0 0 10px #67e8f9;
            pointer-events: none;
            display: none;
            z-index: 20;
            animation: lockon 0.15s ease-out forwards;
        }

        .reticle::before, .reticle::after {
            content: '';
            position: absolute;
            background: #67e8f9;
        }

        .reticle::before {
            top: 50%;
            left: -10%;
            width: 120%;
            height: 2px;
            transform: translateY(-50%);
        }

        .reticle::after {
            left: 50%;
            top: -10%;
            height: 120%;
            width: 2px;
            transform: translateX(-50%);
        }

        #hud {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .hud-score-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-badge {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 3px solid #facc15;
            background: linear-gradient(180deg, #fef08a, #f59e0b);
            box-shadow: 0 8px 18px rgba(0,0,0,0.25), 0 0 18px rgba(250, 204, 21, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-badge-core {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            background: radial-gradient(circle, #fff7ed 0%, #fde047 65%, #f59e0b 100%);
        }

        #score {
            font-family: 'Bangers', 'Exo 2', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3rem);
            font-weight: 400;
            color: #fde047;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.48), 2px 2px 0 rgba(0,0,0,0.6);
            letter-spacing: 0.02em;
        }

        .hud-pill {
            width: max-content;
            max-width: min(82vw, 280px);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0,0,0,0.45);
            background: rgba(15,23,42,0.52);
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(103,232,249,0.28);
            backdrop-filter: blur(5px);
        }

        .speedometer {
            width: 160px;
            height: 16px;
            background: rgba(15,23,42,0.52);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
            border: 2px solid rgba(103,232,249,0.32);
            backdrop-filter: blur(5px);
            position: relative;
            box-shadow: 0 0 16px rgba(37,99,235,0.16);
        }

        .speed-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            opacity: 0.3;
        }

        .speed-grid div {
            border-right: 1px solid #fff;
        }

        #speed-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(to right, #60a5fa, #67e8f9);
            transition: width 0.075s ease-out;
            position: relative;
            z-index: 1;
        }

        .feedback-gif {
            position: absolute;
            z-index: 35;
            width: clamp(88px, 24vw, 132px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.65);
            box-shadow: 0 14px 26px rgba(2, 6, 23, 0.32);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.45);
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: scale(1);
        }

        #combo-gif {
            top: max(84px, calc(env(safe-area-inset-top) + 70px));
            right: 14px;
        }

        #crash-gif {
            bottom: calc(max(126px, env(safe-area-inset-bottom) + 110px));
            left: 14px;
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 24px 20px;
                width: min(100%, 360px);
            }

            .info-grid {
                grid-template-columns: 1fr;
                font-size: 0.75rem;
            }

            .info-banner {
                margin-top: 0;
            }

            #hud {
                left: 14px;
                top: max(10px, env(safe-area-inset-top));
            }

            #stick-base {
                left: 16px;
                bottom: max(18px, env(safe-area-inset-bottom));
                width: 116px;
                height: 116px;
            }

            .action-btn-group {
                right: 16px;
                bottom: max(18px, env(safe-area-inset-bottom));
                gap: 12px;
            }

            #jump-btn {
                width: 88px;
                height: 88px;
                font-size: 18px;
            }

            #boost-btn,
            #spindash-btn {
                width: 68px;
                height: 68px;
                margin-right: 18px;
            }

            .hud-pill {
                max-width: 72vw;
                font-size: 0.72rem;
                letter-spacing: 0.12em;
            }

            .feedback-gif {
                width: 84px;
                border-radius: 16px;
            }

            #combo-gif {
                top: max(72px, calc(env(safe-area-inset-top) + 62px));
                right: 10px;
            }

            #crash-gif {
                bottom: calc(max(112px, env(safe-area-inset-bottom) + 100px));
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/collect/crash/boost/jump via catalogs/audios.json -->
    <audio id="bgm-track" loop preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3"></audio>
    <audio id="sfx-jump" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3"></audio>
    <audio id="sfx-collect" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"></audio>
    <audio id="sfx-boost" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3"></audio>
    <audio id="sfx-spin" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3"></audio>
    <audio id="sfx-enemy" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3"></audio>
    <audio id="sfx-crash" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"></audio>
    <audio id="sfx-start" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"></audio>
    <audio id="sfx-restart" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"></audio>

    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="homing-reticle" class="reticle"></div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-screen start-overlay">
                <div class="glass-panel">
                    <h1 class="title-text">TURBO<br><span class="title-highlight">PANIC</span></h1>
                    <div class="divider"></div>
                    <p class="subtitle">Meme Express</p>

                    <button id="start-btn" class="action-button start-button">START RUN</button>

                    <div class="info-grid">
                        <div>⬆️ Stick UP: <strong>Build speed</strong></div>
                        <div>⬅️ Stick L/R: <strong>Stay on line</strong></div>
                        <div>🟡 Jump: <strong>Hop / lock on</strong></div>
                        <div>🔴 Spin: <strong>Plow through</strong></div>
                        <div class="info-banner">✨ Collect every reaction coin and dodge the rare cringe trap. ✨</div>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="overlay-screen gameover-overlay hidden">
                <div class="glass-panel" style="max-width: 320px;">
                    <h2 class="results-title">POST CRASH!</h2>
                    <p class="results-score">REACTION SCORE: <span id="finalScore">0</span></p>
                    <button id="restart-btn" class="action-button restart-button">RUN IT BACK</button>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: combo/hit + crash/fail overlays via catalogs/gifs.json -->
            <img id="combo-gif" class="feedback-gif" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Turbo combo reaction" aria-hidden="true">
            <img id="crash-gif" class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Crash reaction" aria-hidden="true">

            <div id="hud" class="hidden">
                <div class="hud-score-row">
                    <div class="hud-badge">
                        <div class="hud-badge-core"></div>
                    </div>
                    <span id="score">0</span>
                </div>
                <div class="hud-pill">
                    FEED DEPTH: <span id="zone-display">0m</span>
                </div>
                <div class="speedometer">
                    <div class="speed-grid">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div style="border-right: none;"></div>
                    </div>
                    <div id="speed-bar"></div>
                </div>
            </div>

            <div id="controls-layer" class="hidden">
                <div id="stick-base">
                    <div id="stick-knob"></div>
                </div>

                <div class="action-btn-group">
                    <div id="spindash-btn" class="game-btn">CLEAR</div>
                    <div id="boost-btn" class="game-btn">HYPE</div>
                    <div id="jump-btn" class="game-btn">JUMP</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const bgm = document.getElementById('bgm-track');
        const comboGif = document.getElementById('combo-gif');
        const crashGif = document.getElementById('crash-gif');
        bgm.volume = 0.2;

        const mediaState = {
            armed: false,
            gifTimers: new Map(),
            sfxCooldowns: new Map(),
            activeGameLoop: false
        };

        const SFX = {
            jump: document.getElementById('sfx-jump'),
            collect: document.getElementById('sfx-collect'),
            boost: document.getElementById('sfx-boost'),
            spin: document.getElementById('sfx-spin'),
            enemy: document.getElementById('sfx-enemy'),
            crash: document.getElementById('sfx-crash'),
            start: document.getElementById('sfx-start'),
            restart: document.getElementById('sfx-restart')
        };

        Object.values(SFX).forEach(audio => {
            audio.volume = 0.6;
        });
        SFX.crash.volume = 0.52;
        SFX.collect.volume = 0.42;
        SFX.enemy.volume = 0.5;
        SFX.start.volume = 0.48;
        SFX.restart.volume = 0.44;

        function primeAudio() {
            if (mediaState.armed) return;
            mediaState.armed = true;
            const audioNodes = [bgm, ...Object.values(SFX)];
            audioNodes.forEach(audio => {
                audio.load();
                const playAttempt = audio.play();
                if (playAttempt && typeof playAttempt.then === 'function') {
                    playAttempt
                        .then(() => {
                            audio.pause();
                            audio.currentTime = 0;
                        })
                        .catch(() => {
                            audio.pause();
                            audio.currentTime = 0;
                        });
                }
            });
        }

        function playSfx(name, options = {}) {
            const audio = SFX[name];
            if (!audio) return;

            const now = performance.now();
            const minGap = options.minGap ?? 80;
            const lastPlayed = mediaState.sfxCooldowns.get(name) || 0;
            if (now - lastPlayed < minGap) return;
            mediaState.sfxCooldowns.set(name, now);

            try {
                audio.pause();
                audio.currentTime = 0;
                if (options.volume != null) audio.volume = options.volume;
                audio.play().catch(() => {});
            } catch (_) {}
        }

        function startBgm() {
            try {
                bgm.currentTime = 0;
                bgm.play().catch(() => {});
            } catch (_) {}
        }

        function stopBgm() {
            try {
                bgm.pause();
                bgm.currentTime = 0;
            } catch (_) {}
        }

        function flashGif(node, duration = 1100) {
            if (!node) return;
            const timer = mediaState.gifTimers.get(node.id);
            if (timer) clearTimeout(timer);
            node.classList.add('active');
            mediaState.gifTimers.set(node.id, setTimeout(() => {
                node.classList.remove('active');
                mediaState.gifTimers.delete(node.id);
            }, duration));
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let worldZ = 0;
        let spawnAccumulator = 0;
        let currentSpeedZ = 0;

        const FOV = 320;
        const CAMERA_Y = -180;
        const RENDER_DISTANCE = 3500;
        const TRACK_WIDTH = 550;
        const TRACK_LIMIT = TRACK_WIDTH / 2;

        let curveX = 0;
        let curveY = 0;
        let targetCurveX = 0;
        let targetCurveY = 0;
        let curveTimer = 0;

        const MAX_SPEED = 70;
        const BOOST_SPEED = 130;
        const GRAVITY = 1.4;
        const JUMP_FORCE = -24;

        const PLAYER = {
            x: 0, y: 0, z: 100,
            vy: 0,
            state: 'RUN',
            boostTime: 0,
            spinTime: 0,
            target: null
        };

        let objects = [];
        let particles = [];

        const stickBase = document.getElementById('stick-base');
        const stickKnob = document.getElementById('stick-knob');
        const jumpBtn = document.getElementById('jump-btn');
        const boostBtn = document.getElementById('boost-btn');
        const spindashBtn = document.getElementById('spindash-btn');

        let stickInput = { x: 0, y: 0 };
        let stickActive = false;
        let stickOrigin = { x: 0, y: 0 };

        function handleStickStart(e) {
            e.preventDefault();
            const touch = e.changedTouches ? e.changedTouches[0] : e;
            stickActive = true;
            const rect = stickBase.getBoundingClientRect();
            stickOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateStick(touch.clientX, touch.clientY);
        }

        function handleStickMove(e) {
            if (!stickActive) return;
            e.preventDefault();
            const touch = e.changedTouches ? e.changedTouches[0] : e;
            updateStick(touch.clientX, touch.clientY);
        }

        function handleStickEnd(e) {
            e.preventDefault();
            stickActive = false;
            stickInput = { x: 0, y: 0 };
            stickKnob.style.transform = 'translate(-50%, -50%)';
        }

        function updateStick(clientX, clientY) {
            const maxDist = 45;
            let dx = clientX - stickOrigin.x;
            let dy = clientY - stickOrigin.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxDist;
                dy = Math.sin(angle) * maxDist;
            }

            stickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            stickInput.x = dx / maxDist;
            stickInput.y = dy / maxDist;
        }

        stickBase.addEventListener('touchstart', handleStickStart, { passive: false });
        stickBase.addEventListener('touchmove', handleStickMove, { passive: false });
        stickBase.addEventListener('touchend', handleStickEnd, { passive: false });
        stickBase.addEventListener('mousedown', handleStickStart);
        window.addEventListener('mousemove', handleStickMove);
        window.addEventListener('mouseup', handleStickEnd);

        function handleJump(e) {
            if (e) e.preventDefault();
            if (!gameActive) return;

            if (PLAYER.y === 0) {
                PLAYER.vy = JUMP_FORCE;
                PLAYER.state = 'JUMP';
                playSfx('jump', { minGap: 120 });
            } else if (PLAYER.state === 'JUMP' && PLAYER.target) {
                PLAYER.state = 'HOMING';
                playSfx('spin', { volume: 0.46, minGap: 90 });
                flashGif(comboGif, 900);
                createExplosion(PLAYER.x, PLAYER.y, PLAYER.z, '#00FFFF', 12);
            }
        }
        jumpBtn.addEventListener('touchstart', handleJump, { passive: false });
        jumpBtn.addEventListener('mousedown', handleJump);

        function handleBoost(e) {
            if (e) e.preventDefault();
            if (!gameActive) return;
            if (PLAYER.boostTime <= 0) {
                PLAYER.boostTime = 150;
                playSfx('boost', { minGap: 220 });
                flashGif(comboGif, 1000);
                createExplosion(PLAYER.x, PLAYER.y, PLAYER.z, '#0088FF', 25);
            }
        }
        boostBtn.addEventListener('touchstart', handleBoost, { passive: false });
        boostBtn.addEventListener('mousedown', handleBoost);

        function handleSpindash(e) {
            if (e) e.preventDefault();
            if (!gameActive) return;
            PLAYER.state = 'SPIN';
            PLAYER.spinTime = 40;
            currentSpeedZ = Math.max(currentSpeedZ, MAX_SPEED);
            playSfx('spin', { minGap: 140 });
            flashGif(comboGif, 850);
            createExplosion(PLAYER.x, PLAYER.y, PLAYER.z, '#FF4444', 15);
        }
        spindashBtn.addEventListener('touchstart', handleSpindash, { passive: false });
        spindashBtn.addEventListener('mousedown', handleSpindash);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function updateCurves() {
            curveX += (targetCurveX - curveX) * 0.01;
            curveY += (targetCurveY - curveY) * 0.01;

            curveTimer++;
            if (curveTimer > 300) {
                curveTimer = 0;
                const rand = Math.random();
                if (Math.abs(targetCurveX) > 0.0001) {
                    targetCurveX = 0;
                    targetCurveY = 0;
                } else {
                    if (rand < 0.3) targetCurveX = 0.0002;
                    else if (rand < 0.6) targetCurveX = -0.0002;
                    else if (rand < 0.8) targetCurveY = -0.0001;
                    else targetCurveY = 0.0001;
                }
            }
        }

        function project(x, y, z) {
            const zDepth = z - 0;
            const xOffset = curveX * Math.pow(zDepth, 2);
            const yOffset = curveY * Math.pow(zDepth, 2);

            const effectiveX = (x + xOffset) - (PLAYER.x * 0.6);
            const effectiveY = (y + yOffset) - CAMERA_Y;

            if (z < 1) z = 1;
            const scale = FOV / (z + FOV);
            const x2d = (effectiveX * scale) + (width / 2);
            const y2d = (effectiveY * scale) + (height / 2);
            return { x: x2d, y: y2d, scale: scale };
        }

        function spawnObject(offsetZ = 0) {
            const lanes = [-160, 0, 160];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];

            const r = Math.random();
            let type = 'ring';

            if (r > 0.985) type = 'badnick';
            else if (r > 0.97) type = 'spike';

            let y = 0;
            if (type === 'badnick' && Math.random() > 0.6) y = -130;

            const spawnZ = RENDER_DISTANCE + offsetZ;

            objects.push({
                x: lane, y: y, z: spawnZ,
                type: type, active: true, angle: 0
            });

            if (type === 'ring') {
                const trailLength = 4 + Math.floor(Math.random() * 5);
                for (let i = 1; i < trailLength; i++) {
                    objects.push({
                        x: lane, y: y, z: spawnZ + (i * 90),
                        type: 'ring', active: true, angle: 0
                    });
                }
            }
        }

        function createExplosion(x, y, z, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, z,
                    vx: (Math.random() - 0.5) * 80,
                    vy: (Math.random() - 1) * 80,
                    vz: (Math.random() - 0.5) * 40,
                    life: 1.0,
                    color
                });
            }
        }

        function initGame() {
            score = 0;
            worldZ = 0;
            spawnAccumulator = 0;
            objects = [];
            particles = [];
            curveX = 0;
            curveY = 0;
            targetCurveX = 0;
            targetCurveY = 0;

            PLAYER.x = 0;
            PLAYER.y = 0;
            PLAYER.vy = 0;
            PLAYER.state = 'RUN';
            PLAYER.target = null;
            PLAYER.boostTime = 0;
            PLAYER.spinTime = 0;
            currentSpeedZ = 0;

            document.getElementById('score').innerText = score;
            stickInput = { x: 0, y: 0 };

            for (let i = 0; i < 8; i++) {
                objects.push({ x: 0, y: 0, z: 500 + i * 120, type: 'ring', active: true, angle: 0 });
            }
        }

        function updatePlayer() {
            let forwardInput = Math.max(0, -stickInput.y);
            if (forwardInput < 0.1) forwardInput = 0;

            let targetSpeed = forwardInput * MAX_SPEED;

            if (PLAYER.boostTime > 0) {
                targetSpeed = BOOST_SPEED;
                PLAYER.boostTime--;
            }
            if (PLAYER.spinTime > 0) {
                PLAYER.spinTime--;
                if (currentSpeedZ < MAX_SPEED) currentSpeedZ = MAX_SPEED;
            } else if (PLAYER.state === 'SPIN' && PLAYER.y === 0) {
                PLAYER.state = 'RUN';
            }

            if (currentSpeedZ < targetSpeed) currentSpeedZ += 1.0;
            else if (currentSpeedZ > targetSpeed) currentSpeedZ -= 0.5;

            const moveSpeedX = 28;
            PLAYER.x += stickInput.x * moveSpeedX;
            PLAYER.x -= curveX * currentSpeedZ * 5000;

            if (PLAYER.x < -TRACK_LIMIT + 30) PLAYER.x = -TRACK_LIMIT + 30;
            if (PLAYER.x > TRACK_LIMIT - 30) PLAYER.x = TRACK_LIMIT - 30;

            if (PLAYER.y < 0 || PLAYER.state === 'JUMP' || PLAYER.state === 'HOMING') {
                if (PLAYER.state !== 'HOMING') PLAYER.vy += GRAVITY;
                PLAYER.y += PLAYER.vy;

                if (PLAYER.y >= 0) {
                    PLAYER.y = 0;
                    PLAYER.vy = 0;
                    if (PLAYER.state !== 'SPIN') PLAYER.state = 'RUN';
                    PLAYER.target = null;
                }
            }

            if (PLAYER.state === 'HOMING' && PLAYER.target) {
                const t = PLAYER.target;
                const dx = t.x - PLAYER.x;
                const dy = t.y - PLAYER.y;
                const dz = t.z - PLAYER.z;

                PLAYER.x += dx * 0.25;
                PLAYER.y += dy * 0.25;

                if (Math.abs(dx) < 50 && Math.abs(dz) < 100) {
                    destroyBadnick(t);
                }
            } else if (PLAYER.state === 'JUMP') {
                findHomingTarget();
            } else {
                PLAYER.target = null;
            }

            const speedPct = Math.min(100, (currentSpeedZ / BOOST_SPEED) * 100);
            const bar = document.getElementById('speed-bar');
            bar.style.width = speedPct + '%';
            if (PLAYER.boostTime > 0) {
                bar.style.background = 'linear-gradient(to right, #ef4444, #facc15)';
                bar.style.boxShadow = '0 0 15px #f00';
            } else {
                bar.style.background = 'linear-gradient(to right, #60a5fa, #67e8f9)';
                bar.style.boxShadow = 'none';
            }
        }

        function findHomingTarget() {
            let bestDist = Infinity;
            let bestObj = null;

            objects.forEach(obj => {
                if (obj.type === 'badnick' && obj.active) {
                    const dz = obj.z - PLAYER.z;
                    const dx = Math.abs(obj.x - PLAYER.x);
                    const dy = Math.abs(obj.y - PLAYER.y);

                    if (dz > 0 && dz < 700 && dx < 350 && dy < 350) {
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        if (dist < bestDist) {
                            bestDist = dist;
                            bestObj = obj;
                        }
                    }
                }
            });
            PLAYER.target = bestObj;
        }

        function destroyBadnick(obj) {
            obj.active = false;
            playSfx('enemy', { minGap: 120 });
            flashGif(comboGif, 1200);
            createExplosion(obj.x, obj.y, obj.z, '#FF4400', 25);

            PLAYER.vy = JUMP_FORCE * 0.6;
            PLAYER.state = 'JUMP';
            PLAYER.target = null;

            score += 500;
            document.getElementById('score').innerText = score;
        }

        function drawFloor(ctx) {
            const segmentSize = 120;
            const offsetZ = worldZ % (segmentSize * 2);

            const gradSky = ctx.createLinearGradient(0, 0, 0, height);
            gradSky.addColorStop(0, '#0ea5e9');
            gradSky.addColorStop(0.45, '#67e8f9');
            gradSky.addColorStop(1, '#86efac');
            ctx.fillStyle = gradSky;
            ctx.fillRect(0, 0, width, height);

            for (let z = RENDER_DISTANCE; z >= 100; z -= segmentSize) {
                const zStart = z - offsetZ;
                if (zStart < 50) continue;
                const zEnd = zStart + segmentSize;

                const p1 = project(-TRACK_LIMIT, 0, zStart);
                const p2 = project(TRACK_LIMIT, 0, zStart);
                const p3 = project(TRACK_LIMIT, 0, zEnd);
                const p4 = project(-TRACK_LIMIT, 0, zEnd);

                let row = Math.floor((worldZ + zStart) / segmentSize);
                let colorFlip = (row % 2 === 0);

                ctx.fillStyle = colorFlip ? '#14532d' : '#166534';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.fill();

                const subDivs = 6;
                const subW = (TRACK_LIMIT * 2) / subDivs;
                for (let i = 0; i < subDivs; i++) {
                    const xL = -TRACK_LIMIT + (i * subW);
                    const xR = xL + subW;

                    if ((i + (colorFlip ? 1 : 0)) % 2 === 0) {
                        const sp1 = project(xL, 0, zStart);
                        const sp2 = project(xR, 0, zStart);
                        const sp3 = project(xR, 0, zEnd);
                        const sp4 = project(xL, 0, zEnd);

                        ctx.fillStyle = '#22c55e';
                        if (i === 0 || i === subDivs - 1) ctx.fillStyle = '#fb7185';

                        ctx.beginPath();
                        ctx.moveTo(sp1.x, sp1.y);
                        ctx.lineTo(sp2.x, sp2.y);
                        ctx.lineTo(sp3.x, sp3.y);
                        ctx.lineTo(sp4.x, sp4.y);
                        ctx.fill();
                    }
                }

                const wallHeight = -150;
                const lBase1 = project(-TRACK_LIMIT, 0, zStart);
                const lBase2 = project(-TRACK_LIMIT, 0, zEnd);
                const lTop1 = project(-TRACK_LIMIT, wallHeight, zStart);
                const lTop2 = project(-TRACK_LIMIT, wallHeight, zEnd);

                ctx.fillStyle = colorFlip ? '#312e81' : '#1d4ed8';
                ctx.beginPath();
                ctx.moveTo(lBase1.x, lBase1.y);
                ctx.lineTo(lBase2.x, lBase2.y);
                ctx.lineTo(lTop2.x, lTop2.y);
                ctx.lineTo(lTop1.x, lTop1.y);
                ctx.fill();

                const rBase1 = project(TRACK_LIMIT, 0, zStart);
                const rBase2 = project(TRACK_LIMIT, 0, zEnd);
                const rTop1 = project(TRACK_LIMIT, wallHeight, zStart);
                const rTop2 = project(TRACK_LIMIT, wallHeight, zEnd);

                ctx.beginPath();
                ctx.moveTo(rBase1.x, rBase1.y);
                ctx.lineTo(rBase2.x, rBase2.y);
                ctx.lineTo(rTop2.x, rTop2.y);
                ctx.lineTo(rTop1.x, rTop1.y);
                ctx.fill();
            }
        }

        function drawReticle() {
            const reticle = document.getElementById('homing-reticle');
            if (PLAYER.target && PLAYER.state === 'JUMP') {
                const p = project(PLAYER.target.x, PLAYER.target.y, PLAYER.target.z);
                reticle.style.display = 'block';
                reticle.style.left = p.x + 'px';
                reticle.style.top = p.y + 'px';
                const size = 70 * p.scale;
                reticle.style.width = size + 'px';
                reticle.style.height = size + 'px';
            } else {
                reticle.style.display = 'none';
            }
        }

        function gameLoop() {
            if (!gameActive) {
                mediaState.activeGameLoop = false;
                return;
            }

            updateCurves();
            updatePlayer();

            worldZ += currentSpeedZ;

            spawnAccumulator += currentSpeedZ;
            if (spawnAccumulator > 280) {
                spawnObject();
                spawnAccumulator = 0;
            }

            document.getElementById('zone-display').innerText = Math.floor(worldZ / 100) + 'm';

            ctx.clearRect(0, 0, width, height);
            drawFloor(ctx);

            objects.sort((a, b) => b.z - a.z);

            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                if (!obj.active) continue;

                obj.z -= currentSpeedZ;

                if (obj.z < -200 || obj.z > RENDER_DISTANCE + 500) {
                    objects.splice(i, 1);
                    continue;
                }

                if (Math.abs(obj.z - PLAYER.z) < 60) {
                    const dx = Math.abs(obj.x - PLAYER.x);

                    if (dx < 60) {
                        let hit = false;
                        if (obj.y === 0) {
                            if (PLAYER.y > -30) hit = true;
                        } else {
                            if (Math.abs(PLAYER.y - obj.y) < 50) hit = true;
                        }

                        if (hit) {
                            if (obj.type === 'ring') {
                                score += 10;
                                document.getElementById('score').innerText = score;
                                playSfx('collect', { minGap: 65, volume: 0.42 });
                                createExplosion(obj.x, obj.y - 20, obj.z, '#FFD700', 4);
                                obj.active = false;
                            } else if (obj.type === 'spike') {
                                if (PLAYER.boostTime > 0 || PLAYER.state === 'SPIN') {
                                    obj.active = false;
                                    createExplosion(obj.x, obj.y, obj.z, '#999', 15);
                                    playSfx('enemy', { minGap: 120, volume: 0.5 });
                                } else {
                                    gameOver();
                                    return;
                                }
                            } else if (obj.type === 'badnick') {
                                if (PLAYER.state === 'HOMING' || PLAYER.state === 'JUMP' || PLAYER.state === 'SPIN' || PLAYER.boostTime > 0) {
                                    destroyBadnick(obj);
                                } else {
                                    gameOver();
                                    return;
                                }
                            }
                        }
                    }
                }

                const p = project(obj.x, obj.y, obj.z);
                const s = p.scale;

                if (obj.type === 'ring') {
                    obj.angle += 0.15;
                    ctx.save();
                    ctx.translate(p.x, p.y - 35 * s);
                    ctx.scale(Math.cos(obj.angle), 1);
                    ctx.beginPath();
                    ctx.arc(0, 0, 30 * s, 0, Math.PI * 2);
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 8 * s;
                    ctx.stroke();
                    ctx.strokeStyle = '#FFF';
                    ctx.lineWidth = 2 * s;
                    ctx.stroke();
                    ctx.restore();
                } else if (obj.type === 'spike') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.fillStyle = '#6b7280';
                    ctx.beginPath();
                    ctx.moveTo(0, -60 * s);
                    ctx.lineTo(45 * s, 0);
                    ctx.lineTo(-45 * s, 0);
                    ctx.fill();
                    ctx.fillStyle = '#e5e7eb';
                    ctx.beginPath();
                    ctx.moveTo(0, -60 * s);
                    ctx.lineTo(15 * s, 0);
                    ctx.lineTo(-10 * s, 0);
                    ctx.fill();
                    ctx.restore();
                } else if (obj.type === 'badnick') {
                    ctx.save();
                    ctx.translate(p.x, p.y - 30 * s);
                    ctx.fillStyle = '#be123c';
                    ctx.beginPath();
                    ctx.arc(0, 0, 35 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-12 * s, -8 * s, 10 * s, 0, Math.PI * 2);
                    ctx.arc(12 * s, -8 * s, 10 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(-12 * s, -8 * s, 4 * s, 0, Math.PI * 2);
                    ctx.arc(12 * s, -8 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    if (obj.y < 0) {
                        const flap = Math.sin(frameCount * 0.8) * 25 * s;
                        ctx.fillStyle = '#d1d5db';
                        ctx.beginPath();
                        ctx.moveTo(-30 * s, -10 * s);
                        ctx.lineTo(-70 * s, -20 * s + flap);
                        ctx.lineTo(-30 * s, 10 * s);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(30 * s, -10 * s);
                        ctx.lineTo(70 * s, -20 * s + flap);
                        ctx.lineTo(30 * s, 10 * s);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            const pp = project(PLAYER.x, PLAYER.y, PLAYER.z);
            const ps = pp.scale;

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            const shadowP = project(PLAYER.x, 0, PLAYER.z);
            ctx.ellipse(shadowP.x, shadowP.y, 35 * ps, 12 * ps, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(pp.x, pp.y - 25 * ps);

            if (PLAYER.boostTime > 0) {
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#00FFFF';
                ctx.beginPath();
                ctx.arc(0, 0, 45 * ps + Math.random() * 10 * ps, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            if (PLAYER.state === 'JUMP' || PLAYER.state === 'HOMING' || PLAYER.state === 'SPIN') {
                ctx.rotate(frameCount * 0.8);
                const grad = ctx.createRadialGradient(-10 * ps, -10 * ps, 5 * ps, 0, 0, 32 * ps);
                grad.addColorStop(0, '#67e8f9');
                grad.addColorStop(0.55, '#2563eb');
                grad.addColorStop(1, '#172554');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 30 * ps, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 5 * ps;
                ctx.beginPath();
                ctx.arc(0, 0, 24 * ps, 0, Math.PI * 1.5);
                ctx.stroke();
            } else {
                const grad = ctx.createRadialGradient(-8 * ps, -12 * ps, 5 * ps, 0, 0, 34 * ps);
                grad.addColorStop(0, '#a5f3fc');
                grad.addColorStop(0.4, '#38bdf8');
                grad.addColorStop(1, '#1d4ed8');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 30 * ps, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fda4af';
                ctx.beginPath();
                ctx.moveTo(-22 * ps, -10 * ps);
                ctx.lineTo(-34 * ps, -34 * ps);
                ctx.lineTo(-7 * ps, -22 * ps);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(22 * ps, -10 * ps);
                ctx.lineTo(34 * ps, -34 * ps);
                ctx.lineTo(7 * ps, -22 * ps);
                ctx.fill();

                ctx.fillStyle = '#fef3c7';
                ctx.beginPath();
                ctx.arc(0, 5 * ps, 14 * ps, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.ellipse(6 * ps, -10 * ps, 9 * ps, 12 * ps, -0.2, 0, Math.PI * 2);
                ctx.ellipse(-6 * ps, -10 * ps, 9 * ps, 12 * ps, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#082f49';
                ctx.beginPath();
                ctx.arc(7 * ps, -10 * ps, 3 * ps, 0, Math.PI * 2);
                ctx.arc(-5 * ps, -10 * ps, 3 * ps, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ecfeff';
                ctx.lineWidth = 2.5 * ps;
                ctx.beginPath();
                ctx.arc(0, 3 * ps, 8 * ps, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();

                if (currentSpeedZ > 5) {
                    const legOffset = Math.sin(frameCount * 0.8) * 15 * ps;
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(-18 * ps, 25 * ps + legOffset, 12 * ps, 12 * ps);
                    ctx.fillRect(6 * ps, 25 * ps - legOffset, 12 * ps, 12 * ps);
                } else {
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(-18 * ps, 25 * ps, 12 * ps, 12 * ps);
                    ctx.fillRect(6 * ps, 25 * ps, 12 * ps, 12 * ps);
                }
            }
            ctx.restore();

            drawReticle();

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.z += pt.vz;
                pt.vy += 3;
                pt.life -= 0.04;

                if (pt.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                const ppp = project(pt.x, pt.y, pt.z);
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life;
                ctx.beginPath();
                ctx.arc(ppp.x, ppp.y, (Math.random() * 6 + 3) * ppp.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            playSfx('crash', { minGap: 180, volume: 0.52 });
            flashGif(crashGif, 1500);
            stopBgm();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls-layer').classList.add('hidden');
            document.getElementById('homing-reticle').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function startRun(e) {
            if (e) e.preventDefault();
            primeAudio();
            playSfx('start', { minGap: 200, volume: 0.48 });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');
            crashGif.classList.remove('active');

            startBgm();

            gameActive = true;
            initGame();
            if (!mediaState.activeGameLoop) {
                mediaState.activeGameLoop = true;
                gameLoop();
            }
        }

        function restartRun(e) {
            if (e) e.preventDefault();
            primeAudio();
            playSfx('restart', { minGap: 200, volume: 0.44 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');
            crashGif.classList.remove('active');

            startBgm();

            gameActive = true;
            initGame();
            if (!mediaState.activeGameLoop) {
                mediaState.activeGameLoop = true;
                gameLoop();
            }
        }

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        startBtn.addEventListener('click', startRun);
        restartBtn.addEventListener('click', restartRun);
        startBtn.addEventListener('touchend', startRun, { passive: false });
        restartBtn.addEventListener('touchend', restartRun, { passive: false });
    });
    </script>
</body>
</html>
