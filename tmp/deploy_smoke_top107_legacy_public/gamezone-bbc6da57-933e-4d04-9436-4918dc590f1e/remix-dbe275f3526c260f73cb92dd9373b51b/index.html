<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Aisle Sprint</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-sky: #07111f;
            --bg-deep: #020611;
            --panel-bg: rgba(9, 18, 35, 0.84);
            --panel-border: rgba(106, 227, 255, 0.32);
            --panel-shine: rgba(255, 255, 255, 0.14);
            --shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
            --cyan: #6ae3ff;
            --cyan-strong: #2bbcff;
            --blue-dark: #91b6ff;
            --green: #52f0af;
            --green-dark: #21c781;
            --red: #ff5f77;
            --gold: #ffd95a;
            --text-main: #eef8ff;
            --text-soft: #a9c0da;
            --floor: #15243d;
            --floor-line: rgba(255, 255, 255, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(50, 114, 255, 0.18), transparent 34%),
                linear-gradient(180deg, var(--bg-sky), var(--bg-deep));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font-family: inherit;
            border: 0;
            cursor: pointer;
        }

        .game-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .game-shell::before,
        .game-shell::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(106, 227, 255, 0.18), transparent 16%),
                radial-gradient(circle at 80% 18%, rgba(255, 217, 90, 0.12), transparent 18%),
                radial-gradient(circle at 50% 78%, rgba(82, 240, 175, 0.1), transparent 22%);
            opacity: 0.95;
        }

        .game-shell::after {
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent 0 34px,
                    rgba(255, 255, 255, 0.03) 34px 35px
                );
            mix-blend-mode: screen;
            opacity: 0.24;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(21, 37, 67, 0.97), rgba(7, 14, 29, 0.94));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            width: min(92vw, 400px);
            margin: 16px;
            padding: 38px 28px;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--panel-shine), transparent 42%);
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .hero-icon {
            position: relative;
            z-index: 1;
            display: inline-grid;
            place-items: center;
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
            border-radius: 24px;
            font-size: 3.65rem;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.34), transparent 30%),
                linear-gradient(180deg, rgba(106, 227, 255, 0.34), rgba(43, 188, 255, 0.1));
            border: 1px solid rgba(106, 227, 255, 0.34);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 26px rgba(43, 188, 255, 0.22);
            animation: bounce-slow 3s infinite ease-in-out;
        }

        .game-title {
            position: relative;
            z-index: 1;
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.3rem, 6.3vw, 3.55rem);
            line-height: 0.98;
            letter-spacing: 0.08em;
            color: var(--text-main);
            text-shadow:
                0 0 12px rgba(106, 227, 255, 0.3),
                0 0 30px rgba(43, 188, 255, 0.24);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            margin: 0 0 24px;
            color: var(--text-soft);
            font-size: 1.05rem;
            line-height: 1.2;
            font-weight: 600;
        }

        .action-button {
            position: relative;
            z-index: 1;
            width: 100%;
            color: #04111d;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.08em;
            padding: 15px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.26);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .action-button:hover {
            transform: translateY(-1px) scale(1.01);
            filter: brightness(1.06);
        }

        .action-button:active {
            transform: scale(0.97);
        }

        .button-start {
            background: linear-gradient(180deg, #8ef9ff, var(--cyan-strong));
            box-shadow: 0 10px 24px rgba(43, 188, 255, 0.28);
        }

        .button-restart {
            background: linear-gradient(180deg, #89ffc6, var(--green));
            box-shadow: 0 10px 24px rgba(34, 197, 94, 0.24);
        }

        .game-over-title {
            position: relative;
            z-index: 1;
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
            line-height: 1;
            letter-spacing: 0.05em;
            color: #ff9fb0;
            text-shadow: 0 0 14px rgba(255, 95, 119, 0.22);
        }

        .body-copy {
            position: relative;
            z-index: 1;
            margin: 0 0 18px;
            color: var(--text-soft);
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.18;
        }

        .score-line {
            position: relative;
            z-index: 1;
            margin: 0 0 24px;
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .hud {
            position: absolute;
            top: 24px;
            left: 24px;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(14, 29, 56, 0.94), rgba(8, 16, 30, 0.9));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
        }

        .hud-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(255, 217, 90, 0.3));
        }

        .hud-score {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1.15rem;
            color: var(--blue-dark);
            letter-spacing: 0.06em;
        }

        .feedback-strip {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: min(28vw, 128px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif {
            width: 100%;
            max-width: 128px;
            aspect-ratio: 1;
            border-radius: 18px;
            border: 1px solid rgba(106, 227, 255, 0.28);
            background: rgba(5, 13, 26, 0.62);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
            object-fit: cover;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            padding: 8px 12px;
            max-width: 140px;
            border-radius: 14px;
            border: 1px solid rgba(106, 227, 255, 0.22);
            background: rgba(7, 14, 29, 0.82);
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-align: right;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }

        @media (max-width: 640px) {
            .panel {
                padding: 32px 22px;
            }

            .hero-icon {
                width: 82px;
                height: 82px;
                font-size: 3rem;
                margin-bottom: 12px;
            }

            .subtitle,
            .body-copy {
                font-size: 0.98rem;
            }

            .score-line {
                font-size: 1.3rem;
            }

            .action-button {
                font-size: 0.92rem;
                padding: 14px 18px;
            }

            .hud {
                top: 16px;
                left: 16px;
            }

            .hud-pill {
                padding: 8px 14px;
            }

            .hud-icon {
                font-size: 1.2rem;
            }

            .hud-score {
                font-size: 1rem;
            }

            .feedback-strip {
                right: 12px;
                bottom: 12px;
                width: min(24vw, 88px);
                gap: 8px;
            }

            .feedback-caption {
                max-width: 110px;
                font-size: 0.68rem;
                padding: 6px 9px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel">
                <div class="hero-icon">🛒</div>
                <h1 class="game-title">AISLE<br>SPRINT</h1>
                <p class="subtitle">Tap to jump.<br>Grab groceries, dodge hazard signs.</p>
                <button id="start-btn" class="action-button button-start">START RUN</button>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <h2 class="game-over-title">CHECKOUT HALTED!</h2>
                <p class="body-copy">Your cart slammed into a caution sign.</p>
                <div class="score-line">Bagged: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-button button-restart">TRY AGAIN</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-pill">
                    <span class="hud-icon">🍎</span>
                    <span class="hud-score" id="score">0</span>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: pickup/fail feedback -> catalogs/gifs.json | compact lower-right overlay keeps controls clear -->
        <div class="feedback-strip" aria-hidden="true">
            <div id="feedback-caption" class="feedback-caption">Aisle vibes</div>
            <img
                id="pickup-gif"
                class="feedback-gif"
                alt="Celebration feedback"
                src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            >
            <img
                id="fail-gif"
                class="feedback-gif"
                alt="Fail reaction feedback"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            >
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;
                this.sfx = {};
                this.lastPlayed = {};
                this.cooldowns = {
                    jump: 140,
                    land: 140,
                    pickup: 110,
                    bonus: 170,
                    warning: 650,
                    fail: 700,
                    start: 320
                };

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(audio => audio.load());
            }

            playBGM() {
                if (!this.ready) this.unlock();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.7) {
                const source = this.sfx[key];
                if (!source) return;

                const now = performance.now();
                const cooldown = this.cooldowns[key] ?? 120;
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
                this.lastPlayed[key] = now;

                const clone = source.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const pickupGif = document.getElementById('pickup-gif');
        const failGif = document.getElementById('fail-gif');
        const feedbackCaption = document.getElementById('feedback-caption');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;
        let warningArmed = true;
        let lastGroundedState = true;
        let feedbackTimer = null;
        let lastMenuActionAt = 0;

        let cart = {
            x: 50,
            y: 0,
            width: 60,
            height: 50,
            vy: 0,
            jumpStrength: -12,
            gravity: 0.6,
            grounded: true,
            rotation: 0
        };

        let obstacles = [];
        let items = [];
        let particles = [];
        let bgOffset = 0;

        function showFeedback(type, caption, duration = 1100) {
            clearTimeout(feedbackTimer);
            pickupGif.classList.remove('visible');
            failGif.classList.remove('visible');
            feedbackCaption.textContent = caption;
            feedbackCaption.classList.add('visible');

            if (type === 'pickup') {
                pickupGif.classList.add('visible');
            } else if (type === 'fail') {
                failGif.classList.add('visible');
            }

            feedbackTimer = setTimeout(() => {
                pickupGif.classList.remove('visible');
                failGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, duration);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (gameActive) cart.y = height - 150;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            warningArmed = true;
            obstacles = [];
            items = [];
            particles = [];
            bgOffset = 0;
            cart.y = height - 150;
            cart.vy = 0;
            cart.grounded = true;
            cart.rotation = 0;
            lastGroundedState = true;
            scoreEl.innerText = score;
            pickupGif.classList.remove('visible');
            failGif.classList.remove('visible');
            feedbackCaption.classList.remove('visible');
        }

        function spawnObstacle() {
            obstacles.push({
                x: width,
                y: height - 160,
                width: 40,
                height: 60,
                type: 'sign'
            });
        }

        function spawnItem() {
            const itemTypes = ['apple', 'banana', 'milk'];
            const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
            const yPos = height - 150 - (Math.random() * 150 + 50);

            items.push({
                x: width,
                y: yPos,
                width: 30,
                height: 30,
                type,
                oscillation: Math.random() * Math.PI
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        function update() {
            gameSpeed += 0.001;

            cart.vy += cart.gravity;
            cart.y += cart.vy;

            const groundLevel = height - 100;
            if (cart.y + cart.height > groundLevel) {
                cart.y = groundLevel - cart.height;
                cart.vy = 0;
                cart.grounded = true;
                cart.rotation = 0;
            } else {
                cart.grounded = false;
                cart.rotation = Math.min(Math.PI / 6, cart.vy * 0.05);
            }

            if (cart.grounded && !lastGroundedState) {
                audio.playSFX('land', 0.42);
            }
            lastGroundedState = cart.grounded;

            const obstacleInterval = Math.floor(1800 / gameSpeed);
            const itemInterval = Math.floor(1200 / gameSpeed);

            if (frameCount > 0 && frameCount % obstacleInterval === 0) {
                if (Math.random() > 0.3) spawnObstacle();
            }
            if (frameCount > 0 && frameCount % itemInterval === 0) {
                spawnItem();
            }

            const nearestObstacle = obstacles.find(obs => obs.x + obs.width >= cart.x);
            if (nearestObstacle && nearestObstacle.x - (cart.x + cart.width) < 165 && cart.grounded && warningArmed) {
                audio.playSFX('warning', 0.35);
                warningArmed = false;
            }
            if (!nearestObstacle || nearestObstacle.x - (cart.x + cart.width) > 220) {
                warningArmed = true;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    cart.x < obs.x + obs.width &&
                    cart.x + cart.width > obs.x &&
                    cart.y < obs.y + obs.height &&
                    cart.y + cart.height > obs.y
                ) {
                    gameOver();
                }

                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.x -= gameSpeed;
                item.oscillation += 0.1;
                item.y += Math.sin(item.oscillation) * 0.5;

                if (
                    cart.x < item.x + item.width &&
                    cart.x + cart.width > item.x &&
                    cart.y < item.y + item.height &&
                    cart.y + cart.height > item.y
                ) {
                    score += 10;
                    scoreEl.innerText = score;
                    audio.playSFX('pickup', 0.62);
                    if (score % 50 === 0) {
                        audio.playSFX('bonus', 0.56);
                        showFeedback('pickup', 'Combo bagged!', 1200);
                    } else {
                        showFeedback('pickup', 'Fresh pickup!', 820);
                    }
                    createParticles(item.x + item.width / 2, item.y + item.height / 2, '#FFD700');
                    items.splice(i, 1);
                } else if (item.x + item.width < 0) {
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            bgOffset += gameSpeed * 0.5;
            frameCount++;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#081322');
            sky.addColorStop(0.55, '#0d1d34');
            sky.addColorStop(1, '#040914');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 18; i++) {
                const starX = ((i * 173) + bgOffset * 0.12) % (width + 80) - 40;
                const starY = 28 + (i % 6) * 42;
                const radius = 1.5 + (i % 3);
                ctx.fillStyle = i % 4 === 0 ? 'rgba(255, 217, 90, 0.8)' : 'rgba(106, 227, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(starX, starY, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const shelfWidth = 200;
            const shelfHeight = height * 0.6;
            const numShelves = Math.ceil(width / shelfWidth) + 2;
            const offset = (bgOffset * 0.5) % shelfWidth;

            for (let i = 0; i < numShelves; i++) {
                const x = (i * shelfWidth) - offset;

                const aisleGlow = ctx.createLinearGradient(x, 90, x + shelfWidth, 90 + shelfHeight);
                aisleGlow.addColorStop(0, 'rgba(50, 114, 255, 0.08)');
                aisleGlow.addColorStop(1, 'rgba(106, 227, 255, 0.04)');
                ctx.fillStyle = aisleGlow;
                ctx.fillRect(x, 90, shelfWidth, shelfHeight + 10);

                ctx.fillStyle = '#22324d';
                ctx.fillRect(x, 100, 12, shelfHeight);

                for (let j = 0; j < 5; j++) {
                    const shelfY = 150 + (j * 80);
                    ctx.fillStyle = '#2f466f';
                    ctx.fillRect(x, shelfY, shelfWidth, 6);

                    ctx.fillStyle = `hsl(${190 + ((i * 26 + j * 21) % 120)}, 78%, 62%)`;
                    ctx.fillRect(x + 20, shelfY - 22, 30, 22);
                    ctx.fillRect(x + 60, shelfY - 26, 20, 26);

                    ctx.fillStyle = '#ffd95a';
                    ctx.fillRect(x + 98, shelfY - 18, 16, 18);

                    ctx.fillStyle = '#52f0af';
                    ctx.fillRect(x + 128, shelfY - 24, 24, 24);
                }
            }

            const groundY = height - 100;
            const floorGradient = ctx.createLinearGradient(0, groundY, 0, height);
            floorGradient.addColorStop(0, '#1c2c47');
            floorGradient.addColorStop(1, '#0c1527');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, groundY, width, 100);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 2;
            const tileOffset = (bgOffset * 1.5) % 100;
            ctx.beginPath();
            for (let i = 0; i < width / 100 + 2; i++) {
                const x = (i * 100) - tileOffset;
                ctx.moveTo(x, groundY);
                ctx.lineTo(x - 50, height);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(106, 227, 255, 0.16)';
            ctx.beginPath();
            ctx.moveTo(0, groundY + 10);
            ctx.lineTo(width, groundY + 10);
            ctx.stroke();

            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);

                ctx.fillStyle = '#ffce3a';
                ctx.beginPath();
                ctx.moveTo(0, -obs.height / 2);
                ctx.lineTo(obs.width / 2, obs.height / 2);
                ctx.lineTo(-obs.width / 2, obs.height / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#7a3b00';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#3a1a00';
                ctx.font = 'bold 20px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('!', 0, 10);

                ctx.restore();
            });

            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x + item.width / 2, item.y + item.height / 2);

                if (item.type === 'apple') {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.ellipse(5, -12, 6, 3, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (item.type === 'banana') {
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-10, -15, 20, 30);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-10, -15, 20, 30);
                }

                ctx.restore();
            });

            ctx.save();
            ctx.translate(cart.x + cart.width / 2, cart.y + cart.height / 2);
            ctx.rotate(cart.rotation);

            ctx.fillStyle = '#0b1322';
            ctx.beginPath();
            ctx.arc(-20, 20, 8, 0, Math.PI * 2);
            ctx.arc(20, 20, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#7eeaff';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-25, 20);
            ctx.lineTo(-25, -10);
            ctx.lineTo(25, -10);
            ctx.lineTo(20, 20);
            ctx.lineTo(-25, 20);
            ctx.moveTo(-10, -10); ctx.lineTo(-10, 20);
            ctx.moveTo(5, -10); ctx.lineTo(5, 20);
            ctx.moveTo(-25, 5); ctx.lineTo(22, 5);
            ctx.stroke();

            ctx.strokeStyle = '#1f3d63';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-22, 16);
            ctx.lineTo(17, 16);
            ctx.stroke();

            ctx.strokeStyle = '#c6f8ff';
            ctx.beginPath();
            ctx.moveTo(-25, -5);
            ctx.lineTo(-35, -20);
            ctx.lineTo(-40, -20);
            ctx.stroke();

            ctx.fillStyle = '#ffd95a';
            ctx.beginPath();
            ctx.arc(12, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0.72);
            showFeedback('fail', 'Cart wipeout!', 1600);
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = score;
        }

        function beginRun() {
            lastMenuActionAt = performance.now();
            audio.unlock();
            audio.playSFX('start', 0.6);
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        function jump() {
            if (performance.now() - lastMenuActionAt < 250) return;
            if (gameActive && cart.grounded) {
                cart.vy = cart.jumpStrength;
                cart.grounded = false;
                audio.playSFX('jump', 0.5);
            }
        }

        document.getElementById('start-btn').addEventListener('click', beginRun);

        document.getElementById('restart-btn').addEventListener('click', () => {
            beginRun();
        });

        window.addEventListener('pointerdown', () => {
            audio.unlock();
        }, { once: true });

        window.addEventListener('mousedown', jump);
        // [agent-note][stage4] repaired: mobile-tap-path | element: window touchstart handler | action: removed global preventDefault so menu CTAs keep native tap -> click flow
        window.addEventListener('touchstart', (e) => {
            audio.unlock();
            if (!gameActive) return;
            if (e.target && typeof e.target.closest === 'function' && e.target.closest('button')) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            audio.unlock();
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });
    </script>
</body>
</html>
