    <script>
        /* 
         * =========================================
         * ENGINE & MATH
         * =========================================
         */
        const Engine = {
            project: (x, y, z, cx, cy) => {
                const scale = 500 / (500 + z);
                return {
                    x: cx + x * scale,
                    y: cy + y * scale,
                    s: scale,
                    z: z
                };
            },
            rotateY: (x, z, angle) => {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return {
                    x: x * cos - z * sin,
                    z: x * sin + z * cos
                };
            },
            adjustColor: (hex, amt) => {
                let usePound = false;
                if (hex[0] == "#") { hex = hex.slice(1); usePound = true; }
                let num = parseInt(hex,16);
                let r = (num >> 16) + amt;
                if (r > 255) r = 255; else if (r < 0) r = 0;
                let b = ((num >> 8) & 0x00FF) + amt;
                if (b > 255) b = 255; else if (b < 0) b = 0;
                let g = (num & 0x0000FF) + amt;
                if (g > 255) g = 255; else if (g < 0) g = 0;
                return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16).padStart(6,'0');
            }
        };

        class Cube {
            constructor(x, y, z, w, h, d, color, pattern = null) {
                this.x = x; this.y = y; this.z = z;
                this.w = w; this.h = h; this.d = d;
                this.color = color;
                this.pattern = pattern;
                this._sortZ = 0;
            }
            
            // Returns transformed vertices
            getTransformed(angle, camX, camY, camZ) {
                const hw = this.w/2, hh = this.h/2, hd = this.d/2;
                // Local relative to object center
                const verts = [
                    {x:-hw,y:-hh,z:-hd}, {x:hw,y:-hh,z:-hd}, {x:hw,y:hh,z:-hd}, {x:-hw,y:hh,z:-hd},
                    {x:-hw,y:-hh,z:hd}, {x:hw,y:-hh,z:hd}, {x:hw,y:hh,z:hd}, {x:-hw,y:hh,z:hd}
                ];
                
                // 1. Rotate object (if needed internally) - Skipping local rotation for now, assuming axis aligned
                // 2. Translate to World Pos
                // 3. Translate relative to Camera
                // 4. Rotate World around Camera Center (Y-axis only for this game)
                
                // Simplified: We rotate the world around the camera pivot (or rotate object around 0,0 then translate)
                // Actually: Game Logic -> Object World Pos.
                // Render Logic -> (ObjPos - CamPos) -> Rotate by CamAngle -> Project.
                
                // Since we want "Orbit" in editor and "Follow" in game:
                // Editor: Cam is fixed at 0,0,-Dist. Object rotates.
                // Gameplay: Cam follows player.
                
                // Unified approach:
                // Apply 'angle' (Camera Rotation around Y).
                // Apply (x,y,z) offset relative to rotated frame.
                
                return verts.map(v => {
                    // World Space Position of Vertex
                    let wx = v.x + this.x;
                    let wy = v.y + this.y;
                    let wz = v.z + this.z;

                    // Relative to Camera
                    let rx = wx - camX;
                    let ry = wy - camY;
                    let rz = wz - camZ;

                    // Rotate around Camera Origin (0,0)
                    const r = Engine.rotateY(rx, rz, angle);
                    
                    return { x: r.x, y: ry, z: r.z };
                });
            }
        }

        /* 
         * =========================================
         * DATA & CONFIG
         * =========================================
         */
        const CONFIG = {
            categories: [
                { id: 'skin', label: 'Skin', icon: '🙂' },
                { id: 'hair', label: 'Hair', icon: '💇' },
                { id: 'shirt', label: 'Shirt', icon: '👕' },
                { id: 'pants', label: 'Pants', icon: '👖' },
                { id: 'hat', label: 'Hat', icon: '🧢' },
                { id: 'glasses', label: 'Glasses', icon: '👓' }
            ],
            palettes: {
                skin: ['#ffdbac', '#f1c27d', '#e0ac69', '#8d5524', '#5d4037'],
                hair: ['#1a1a1a', '#593212', '#a65e2e', '#e6be8a', '#9b1c31', '#ffffff'],
                clothes: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899', '#ffffff', '#1f2937']
            },
            patterns: {
                shirt: ['Plain', 'Stripes', 'Checks', 'Pattern', 'Pocket'],
                pants: ['Plain', 'Jeans', 'Ripped', 'Shorts', 'Cargo'],
                hat: ['Plain', 'Logo', 'Camo'],
                hair: ['Bald', 'Short', 'Bangs', 'Ponytail', 'Mohawk'],
                glasses: ['None', 'Black', 'Nerd', 'Sport']
            }
        };

        /* 
         * =========================================
         * GAME STATE
         * =========================================
         */
        const State = {
            mode: 'start', // start, editor, map_select, gameplay
            avatar: {
                skinColor: CONFIG.palettes.skin[1],
                hairColor: CONFIG.palettes.hair[1],
                hairStyle: 'Short',
                shirtColor: CONFIG.palettes.clothes[4],
                shirtPattern: 'Plain',
                pantsColor: CONFIG.palettes.clothes[9],
                pantsPattern: 'Jeans',
                hatType: 'None',
                hatColor: CONFIG.palettes.clothes[0],
                hatPattern: 'Plain',
                glassesType: 'None'
            },
            editor: {
                cat: 'skin',
                rot: -0.5
            },
            game: {
                mapId: 'cafe',
                x: 0, z: 0, rot: 0,
                camX: 0, camZ: 0,
                joystick: { active: false, dx: 0, dy: 0, originX: 0, originY: 0 },
                walkAnim: 0
            }
        };

        /* 
         * =========================================
         * WORLD BUILDER
         * =========================================
         */
        const World = {
            getMapCubes: (mapId) => {
                const cubes = [];
                const floorColor = {
                    cafe: '#5d3fd3', gunung: '#2f7a68', taman: '#ffb341', rumah: '#f06ea9'
                }[mapId];
                
                // Floor (Large base)
                cubes.push(new Cube(0, 100, 0, 1000, 20, 1000, floorColor));

                if (mapId === 'cafe') {
                    // Tables
                    const tableC = '#7cf8ff';
                    [[-100, -100], [100, 100], [-100, 100], [100, -100]].forEach(([x, z]) => {
                        cubes.push(new Cube(x, 60, z, 60, 10, 60, '#ffd76e')); // Top
                        cubes.push(new Cube(x, 80, z, 10, 40, 10, tableC)); // Leg
                        // Chairs
                        cubes.push(new Cube(x, 85, z-50, 30, 30, 30, tableC));
                    });
                    // Counter
                    cubes.push(new Cube(0, 50, -250, 300, 60, 40, '#ff6fd8'));
                }
                else if (mapId === 'gunung') {
                    // Trees
                    const treePos = [[-150, -150], [150, -100], [-100, 150], [200, 200], [-200, 50]];
                    treePos.forEach(([x, z]) => {
                        cubes.push(new Cube(x, 50, z, 30, 100, 30, '#5b3f98')); // Trunk
                        cubes.push(new Cube(x, -20, z, 80, 80, 80, '#49c8ff')); // Leaves
                        cubes.push(new Cube(x, -70, z, 60, 60, 60, '#73f6a7')); // Top Leaves
                    });
                    // Rocks
                    cubes.push(new Cube(100, 90, 50, 40, 20, 40, '#d7eeff'));
                }
                else if (mapId === 'taman') {
                    // Slide
                    cubes.push(new Cube(-100, 50, -100, 20, 100, 20, '#ff6fd8')); // Ladder
                    cubes.push(new Cube(-60, 20, -100, 80, 10, 20, '#49c8ff')); // Slide part
                    cubes.push(new Cube(-20, 70, -100, 20, 40, 20, '#ff6fd8')); // End
                    // Swing
                    cubes.push(new Cube(100, 0, 100, 10, 200, 10, '#7cf8ff'));
                    cubes.push(new Cube(200, 0, 100, 10, 200, 10, '#7cf8ff'));
                    cubes.push(new Cube(150, -90, 100, 110, 10, 10, '#ffd76e'));
                }
                else if (mapId === 'rumah') {
                    // Walls
                    cubes.push(new Cube(0, 0, -300, 600, 200, 20, '#ffe59f')); // Back Wall
                    // Sofa
                    cubes.push(new Cube(0, 70, -200, 160, 40, 60, '#ff6fd8'));
                    cubes.push(new Cube(-90, 60, -200, 20, 60, 60, '#ff6fd8')); // Arm
                    cubes.push(new Cube(90, 60, -200, 20, 60, 60, '#ff6fd8')); // Arm
                    // TV
                    cubes.push(new Cube(0, 50, 100, 120, 10, 40, '#7cf8ff')); // Stand
                    cubes.push(new Cube(0, 10, 100, 100, 60, 10, '#11163a')); // Screen
                }

                return cubes;
            },
            
            getAvatarCubes: (s, x, y, z, rot, walkTime) => {
                const cubes = [];
                const bob = Math.sin(walkTime * 0.5) * 2;
                const legL = Math.sin(walkTime) * 20;
                const legR = Math.sin(walkTime + Math.PI) * 20;
                
                // Helper to add relative cube
                const add = (cx, cy, cz, w, h, d, col, pat=null) => {
                    // Rotate point around 0,0 (Avatar center)
                    const r = Engine.rotateY(cx, cz, rot);
                    cubes.push(new Cube(x + r.x, y + cy + bob, z + r.z, w, h, d, col, pat));
                };
                
                // Helper for limbs (pivot rotation)
                const addLimb = (cx, cy, cz, w, h, d, col, swing, pat=null) => {
                    // Simple swing translation for low-poly look
                    const swingZ = swing;
                    const swingY = Math.abs(swing) * 0.2; // Lift a bit
                    const r = Engine.rotateY(cx, cz + swingZ, rot);
                    cubes.push(new Cube(x + r.x, y + cy + swingY + bob, z + r.z, w, h, d, col, pat));
                };

                // Dimensions
                const headS = 50;
                const bodyW = 60, bodyH = 70, bodyD = 30;
                
                // 1. Head
                add(0, -110, 0, headS, headS, headS, s.skinColor);
                add(0, -98, -25, 20, 4, 2, '#ff6fd8');
                
                // Hair
                if (s.hairStyle !== 'Bald') {
                    const hc = s.hairColor;
                    add(0, -140, 0, headS+4, 15, headS+4, hc); // Top
                    if (s.hairStyle === 'Ponytail' || s.hairStyle === 'Short') add(0, -120, 20, headS+4, 30, 10, hc); // Back
                    if (s.hairStyle === 'Bangs') add(0, -130, -26, headS, 15, 5, hc); // Bangs
                    if (s.hairStyle === 'Mohawk') add(0, -150, 0, 10, 30, 40, hc);
                }

                // Eyes
                add(-12, -110, -26, 6, 6, 2, '#11163a');
                add(12, -110, -26, 6, 6, 2, '#11163a');

                // Glasses
                if (s.glassesType !== 'None') {
                    const gc = s.glassesType === 'Black' ? '#111' : '#b91c1c';
                    add(0, -110, -28, 44, 12, 4, gc);
                }

                // Hat
                if (s.hatType !== 'None') {
                    const htc = s.hatColor;
                    if (s.hatType === 'Plain' || s.hatType === 'Logo') {
                        add(0, -142, 0, headS+6, 12, headS+6, htc);
                        add(0, -138, -35, 40, 4, 25, htc); // Brim
                        if(s.hatType === 'Logo') add(0, -150, -20, 10, 10, 2, '#fff');
                    } else if (s.hatType === 'Camo') {
                        add(0, -145, 0, headS+2, 20, headS+2, '#3f6212'); // Army green
                    }
                }

                // 2. Body
                add(0, -40, 0, bodyW, bodyH, bodyD, s.shirtColor, s.shirtPattern);

                // 3. Arms
                addLimb(-45, -40, 0, 18, 60, 18, s.skinColor, legR); // Opposite to leg
                addLimb(-45, -60, 0, 20, 20, 20, s.shirtColor, legR); // Sleeve
                addLimb(45, -40, 0, 18, 60, 18, s.skinColor, legL);
                addLimb(45, -60, 0, 20, 20, 20, s.shirtColor, legL);

                // 4. Legs
                const pantsH = s.pantsPattern === 'Shorts' ? 25 : 60;
                // Left
                addLimb(-18, 30, 0, 22, 60, 22, s.skinColor, legL);
                addLimb(-18, 30 - (60-pantsH)/2, 0, 24, pantsH, 24, s.pantsColor, legL);
                // Right
                addLimb(18, 30, 0, 22, 60, 22, s.skinColor, legR);
                addLimb(18, 30 - (60-pantsH)/2, 0, 24, pantsH, 24, s.pantsColor, legR);

                return cubes;
            }
        };

        /* 
         * =========================================
         * MAIN GAME LOGIC
         * =========================================
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const AudioSys = {
            ctx: null,
            enabled: true,
            init: function() {
                if(!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.bgm = document.getElementById('bgm_main');
                    this.sounds = {
                        ui: document.getElementById('sfx_ui'),
                        confirm: document.getElementById('sfx_confirm'),
                        map: document.getElementById('sfx_map'),
                        move: document.getElementById('sfx_move')
                    };
                    if (this.bgm) this.bgm.volume = 0.2;
                    Object.values(this.sounds).forEach(audio => {
                        if (audio) audio.volume = audio.id === 'sfx_move' ? 0.28 : 0.45;
                    });
                    this.lastPlayedAt = {};
                }
                if(this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
            },
            playBgm: function() {
                if (this.enabled && this.bgm) this.bgm.play().catch(()=>{});
            },
            stopBgm: function() {
                if (this.bgm) this.bgm.pause();
            },
            play: function(name, cooldown = 0) {
                if (!this.enabled || !this.sounds || !this.sounds[name]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[name] && now - this.lastPlayedAt[name] < cooldown) return;
                this.lastPlayedAt[name] = now;
                const sound = this.sounds[name];
                sound.currentTime = 0;
                sound.play().catch(()=>{});
            },
            toggle: function() {
                this.enabled = !this.enabled;
                const muted = !this.enabled;
                if(this.bgm) this.bgm.muted = muted;
                Object.values(this.sounds || {}).forEach(audio => {
                    if (audio) audio.muted = muted;
                });
            }
        };

        const Feedback = {
            gif: null,
            label: null,
            timer: null,
            init: function() {
                this.gif = document.getElementById('feedback-gif');
                this.label = document.getElementById('feedback-label');
            },
            show: function(src, text) {
                if (!this.gif || !this.label) return;
                clearTimeout(this.timer);
                this.gif.src = src;
                this.label.textContent = text;
                this.gif.classList.add('show');
                this.label.classList.add('show');
                this.timer = setTimeout(() => {
                    this.gif.classList.remove('show');
                    this.label.classList.remove('show');
                }, 1800);
            }
        };

        const Game = {
            init: function() {
                this.resize();
                Feedback.init();
                window.addEventListener('resize', () => this.resize());
                this.loop();
                
                // Input Bindings
                document.getElementById('start-btn').onclick = () => {
                    AudioSys.init();
                    AudioSys.play('confirm', 80);
                    AudioSys.playBgm();
                    document.getElementById('start-screen').classList.add('opacity-0');
                    setTimeout(() => {
                        document.getElementById('start-screen').classList.add('hidden');
                        this.setMode('editor');
                    }, 500);
                };

                document.getElementById('finish-btn').onclick = () => {
                    AudioSys.play('map', 80);
                    Feedback.show('https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp', 'Map portal ready');
                    this.setMode('map_select');
                };

                document.getElementById('mute-btn').onclick = () => AudioSys.toggle();

                document.querySelectorAll('.map-card').forEach(btn => {
                    btn.addEventListener('pointerenter', () => AudioSys.play('ui', 140));
                });

                // Editor Rotate
                canvas.addEventListener('pointerdown', e => {
                    if(State.mode === 'editor') {
                        State.editor.dragging = true;
                        State.editor.lastX = e.clientX;
                    }
                });
                window.addEventListener('pointermove', e => {
                    if(State.mode === 'editor' && State.editor.dragging) {
                        const dx = e.clientX - State.editor.lastX;
                        State.editor.rot += dx * 0.01;
                        State.editor.lastX = e.clientX;
                    }
                });
                window.addEventListener('pointerup', () => State.editor.dragging = false);

                // Joystick Input
                const joy = document.getElementById('joystick-zone');
                joy.addEventListener('pointerdown', e => {
                    if(State.mode !== 'gameplay') return;
                    State.game.joystick.active = true;
                    State.game.joystick.originX = e.clientX;
                    State.game.joystick.originY = e.clientY;
                    State.game.joystick.dx = 0;
                    State.game.joystick.dy = 0;
                });
                window.addEventListener('pointermove', e => {
                    if(State.game.joystick.active) {
                        const maxDist = 50;
                        let dx = e.clientX - State.game.joystick.originX;
                        let dy = e.clientY - State.game.joystick.originY;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist > maxDist) {
                            dx = (dx/dist)*maxDist;
                            dy = (dy/dist)*maxDist;
                        }
                        State.game.joystick.dx = dx / maxDist;
                        State.game.joystick.dy = dy / maxDist;
                    }
                });
                const endJoy = () => {
                    State.game.joystick.active = false;
                    State.game.joystick.dx = 0;
                    State.game.joystick.dy = 0;
                };
                window.addEventListener('pointerup', endJoy);
                window.addEventListener('pointercancel', endJoy);
            },

            resize: function() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            },

            setMode: function(mode) {
                State.mode = mode;
                document.getElementById('editor-ui').classList.toggle('translate-y-full', mode !== 'editor');
                document.getElementById('map-screen').classList.toggle('hidden', mode !== 'map_select');
                document.getElementById('gameplay-ui').classList.toggle('hidden', mode !== 'gameplay');
                
                if(mode === 'editor') {
                    UI.buildEditor();
                    State.game.rot = -0.5; // Reset view
                } else if (mode === 'map_select') {
                    AudioSys.play('map', 120);
                } else if (mode === 'gameplay') {
                    // Reset position for map
                    State.game.x = 0;
                    State.game.z = 0;
                    State.game.rot = 0;
                    State.game.camX = 0;
                    State.game.camZ = 200; // Offset camera back
                    Feedback.show('https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp', 'Free roam live');
                    AudioSys.playBgm();
                }
            },

            setMap: function(mapId) {
                State.game.mapId = mapId;
                AudioSys.play('confirm', 90);
                Feedback.show('https://i.giphy.com/lQCWKamnWogIppnoob.webp', `${mapId} loaded`);
                this.setMode('gameplay');
            },

            update: function() {
                if(State.mode === 'gameplay') {
                    const j = State.game.joystick;
                    if(j.dx !== 0 || j.dy !== 0) {
                        const speed = 4;
                        // Move relative to camera angle (which is 0 in world space, i.e., Z is forward)
                        // Actually, we want direct control. Up (dy < 0) = Z decrease.
                        State.game.x += j.dx * speed;
                        State.game.z += j.dy * speed;
                        
                        // Rotate player to face movement
                        State.game.rot = Math.atan2(j.dx, j.dy) + Math.PI; // Face direction
                        
                        State.game.walkAnim += 0.2;
                        AudioSys.play('move', 320);
                    } else {
                        State.game.walkAnim = 0;
                    }

                    // Camera Follow (Smooth Lerp)
                    const targetCamX = State.game.x;
                    const targetCamZ = State.game.z + 250; // Camera is behind/south
                    State.game.camX += (targetCamX - State.game.camX) * 0.1;
                    State.game.camZ += (targetCamZ - State.game.camZ) * 0.1;
                }
            },

            draw: function() {
                // Background
                const bgColors = {
                    start: '#120c2d',
                    editor: '#120c2d',
                    gameplay: State.game.mapId === 'gunung' ? '#152347' : (State.game.mapId === 'cafe' ? '#2b1944' : '#16173d')
                };
                ctx.fillStyle = bgColors[State.mode] || '#120c2d';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;

                let cubes = [];
                let renderRot = 0;
                let camX = 0, camY = 0, camZ = 0;

                if(State.mode === 'editor') {
                    cubes = World.getAvatarCubes(State.avatar, 0, 0, 0, 0, 0);
                    renderRot = State.editor.rot;
                    camY = 0;
                    camZ = 0; // In editor, we rotate the object, camera is static
                } else if (State.mode === 'gameplay') {
                    // 1. Map Cubes
                    const mapCubes = World.getMapCubes(State.game.mapId);
                    // 2. Avatar Cubes
                    const avCubes = World.getAvatarCubes(State.avatar, State.game.x, 0, State.game.z, State.game.rot, State.game.walkAnim);
                    
                    cubes = [...mapCubes, ...avCubes];
                    renderRot = 0; // Camera angle is fixed
                    camX = State.game.camX;
                    camY = -100; // Camera height offset
                    camZ = State.game.camZ;
                } else {
                    return; // Don't render 3D in menus
                }

                // Transform & Sort
                cubes.forEach(c => {
                    c._tVerts = c.getTransformed(renderRot, camX, camY, camZ);
                    // Calculate avg Z for sorting
                    let sumZ = 0;
                    c._tVerts.forEach(v => sumZ += v.z);
                    c._avgZ = sumZ / 8;
                });

                cubes.sort((a, b) => b._avgZ - a._avgZ);

                // Draw
                cubes.forEach(c => {
                    const verts = c._tVerts.map(v => Engine.project(v.x, v.y, v.z, cx, cy));
                    
                    // Faces: Front, Right, Back, Left, Top, Bottom
                    // Indices based on cube definition
                    const faces = [
                        {i:[0,1,2,3], n:0}, {i:[1,5,6,2], n:1}, {i:[5,4,7,6], n:2}, 
                        {i:[4,0,3,7], n:3}, {i:[3,2,6,7], n:4}, {i:[4,5,1,0], n:5}
                    ];

                    // Simple lighting based on face normal index (fake)
                    const shades = [1.0, 0.8, 0.6, 0.8, 1.1, 0.4];

                    faces.forEach(f => {
                        // Backface culling: Check winding order or Z normal
                        // Simple 2D cross product of edges
                        const v0 = verts[f.i[0]];
                        const v1 = verts[f.i[1]];
                        const v2 = verts[f.i[2]];
                        
                        // (v1.x - v0.x)(v2.y - v0.y) - (v1.y - v0.y)(v2.x - v0.x)
                        // If result > 0, face is visible (clockwise)
                        const cross = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);
                        
                        if (cross > 0) {
                            ctx.beginPath();
                            ctx.moveTo(v0.x, v0.y);
                            for(let j=1; j<4; j++) ctx.lineTo(verts[f.i[j]].x, verts[f.i[j]].y);
                            ctx.closePath();
                            
                            // Color
                            let baseColor = c.color;
                            let shade = shades[f.n];
                            
                            // Apply pattern if front face of shirt/pants
                            if(c.pattern && c.pattern !== 'Plain' && f.n === 0) {
                                // Draw base
                                ctx.fillStyle = Engine.adjustColor(baseColor, (shade-1)*50);
                                ctx.fill();
                                // Draw pattern overlay
                                ctx.save();
                                ctx.clip();
                                ctx.fillStyle = "rgba(255,255,255,0.3)";
                                if(c.pattern === 'Stripes') {
                                    for(let k=0; k<10; k++) ctx.fillRect(v0.x+k*10, v0.y, 5, 100);
                                } else if (c.pattern === 'Checks' || c.pattern === 'Pattern') {
                                    for(let k=0; k<5; k++) for(let l=0; l<5; l++) ctx.fillRect(v0.x+k*15, v0.y+l*15, 8, 8);
                                } else if (c.pattern === 'Logo') {
                                    ctx.fillStyle = "rgba(255,255,0,0.8)";
                                    ctx.font = "16px Arial";
                                    ctx.fillText("★", v0.x+10, v0.y+20);
                                } else if (c.pattern === 'Jeans') {
                                    ctx.fillStyle = "rgba(0,0,50,0.2)";
                                    ctx.fillRect(v0.x, v0.y, 100, 100); // Darken
                                }
                                ctx.restore();
                            } else {
                                ctx.fillStyle = Engine.adjustColor(baseColor, (shade-1)*50);
                                ctx.fill();
                            }
                            
                            ctx.lineWidth = 0.5;
                            ctx.strokeStyle = "rgba(0,0,0,0.1)";
                            ctx.stroke();
                        }
                    });
                });
            },

            loop: function() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        /* 
         * =========================================
         * UI BUILDER
         * =========================================
         */
        const UI = {
            buildEditor: function() {
                const tabs = document.getElementById('category-tabs');
                const opts = document.getElementById('options-container');
                
                // Tabs
                tabs.innerHTML = '';
                CONFIG.categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `flex-shrink-0 px-4 py-3 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${State.editor.cat === cat.id ? 'bg-cyan-600 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`;
                    btn.innerHTML = `<span>${cat.icon}</span> ${cat.label}`;
                        btn.onclick = () => {
                            State.editor.cat = cat.id;
                            AudioSys.play('ui', 120);
                            this.buildEditor();
                        };
                    tabs.appendChild(btn);
                });

                // Options
                opts.innerHTML = '';
                const cat = State.editor.cat;

                // 1. Color Section
                let palette = null;
                let targetColor = null;
                
                if(cat === 'skin') { palette = CONFIG.palettes.skin; targetColor = 'skinColor'; }
                else if(cat === 'hair') { palette = CONFIG.palettes.hair; targetColor = 'hairColor'; }
                else if(cat === 'shirt') { palette = CONFIG.palettes.clothes; targetColor = 'shirtColor'; }
                else if(cat === 'pants') { palette = CONFIG.palettes.clothes; targetColor = 'pantsColor'; }
                else if(cat === 'hat') { palette = CONFIG.palettes.clothes; targetColor = 'hatColor'; }

                if(palette) {
                    const sec = document.createElement('div');
                    sec.innerHTML = `<h3 class="text-xs font-bold text-gray-400 uppercase mb-3 title-font" style="font-size:0.82rem;">Color</h3>`;
                    const row = document.createElement('div');
                    row.className = "flex flex-wrap gap-3";
                    palette.forEach(c => {
                        const d = document.createElement('button');
                        d.className = `color-opt ${State.avatar[targetColor] === c ? 'active' : ''}`;
                        d.style.backgroundColor = c;
                        d.onclick = () => {
                            State.avatar[targetColor] = c;
                            AudioSys.play('ui', 120);
                            Feedback.show('https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp', 'Style glow up');
                            this.buildEditor();
                        };
                        row.appendChild(d);
                    });
                    sec.appendChild(row);
                    opts.appendChild(sec);
                }

                // 2. Pattern/Type Section
                let patterns = null;
                let targetPattern = null;
                let label = "Style";

                if(cat === 'hair') { patterns = CONFIG.patterns.hair; targetPattern = 'hairStyle'; }
                else if(cat === 'shirt') { patterns = CONFIG.patterns.shirt; targetPattern = 'shirtPattern'; label = "Print / Pattern"; }
                else if(cat === 'pants') { patterns = CONFIG.patterns.pants; targetPattern = 'pantsPattern'; label = "Print / Pattern"; }
                else if(cat === 'hat') { patterns = CONFIG.patterns.hat; targetPattern = 'hatType'; label = "Type / Style"; }
                else if(cat === 'glasses') { patterns = CONFIG.patterns.glasses; targetPattern = 'glassesType'; }

                if(patterns) {
                    const sec = document.createElement('div');
                    sec.innerHTML = `<h3 class="text-xs font-bold text-gray-400 uppercase mb-3 title-font" style="font-size:0.82rem;">${label}</h3>`;
                    const row = document.createElement('div');
                    row.className = "flex flex-wrap gap-3";
                    patterns.forEach(p => {
                        const btn = document.createElement('button');
                        btn.className = `pattern-opt px-4 w-auto ${State.avatar[targetPattern] === p ? 'active' : ''}`;
                        btn.innerHTML = `<span class="text-xs font-bold text-gray-600">${p}</span>`;
                        btn.onclick = () => {
                            State.avatar[targetPattern] = p;
                            AudioSys.play('ui', 120);
                            Feedback.show('https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp', 'Pattern locked');
                            this.buildEditor();
                        };
                        row.appendChild(btn);
                    });
                    sec.appendChild(row);
                    opts.appendChild(sec);
                }
            }
        };

        // Start
        Game.init();

    </script>
</body>
</html>
