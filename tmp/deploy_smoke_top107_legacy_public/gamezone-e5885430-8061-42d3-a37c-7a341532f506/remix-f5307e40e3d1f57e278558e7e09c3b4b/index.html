<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Arcade Snack Rush</title>
<script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-deep: #170f33;
        --bg-mid: #2d1d61;
        --panel: rgba(34, 20, 73, 0.82);
        --panel-border: #8ef4ff;
        --panel-shadow: #12091f;
        --accent-hot: #ff7a18;
        --accent-gold: #ffd85e;
        --accent-lime: #b8ff72;
        --danger: #ff5a7d;
        --text-main: #f7f6ff;
        --text-dark: #23153f;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, #4b2ba3 0%, rgba(75, 43, 163, 0.35) 22%, transparent 42%),
            linear-gradient(180deg, #24114a 0%, #180e35 48%, #120927 100%);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 0.03em;
        user-select: none;
        -webkit-user-select: none;
        color: var(--text-main);
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 18%, rgba(255, 216, 94, 0.18), transparent 18%),
            radial-gradient(circle at 80% 12%, rgba(142, 244, 255, 0.16), transparent 16%),
            linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.22) 100%);
        opacity: 0.95;
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .glass {
        background: linear-gradient(180deg, rgba(46, 27, 92, 0.92), rgba(23, 12, 48, 0.92));
        backdrop-filter: blur(12px);
        border: 3px solid var(--panel-border);
        box-shadow: 0 10px 0 var(--panel-shadow), 0 0 18px rgba(142, 244, 255, 0.18);
        border-radius: 18px;
    }
    .hud-pill {
        position: relative;
        overflow: hidden;
    }
    .hud-pill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 48%);
        pointer-events: none;
    }
    .hud-stat {
        min-width: 98px;
        color: var(--text-main);
        text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }
    .hud-label,
    .hint-chip {
        font-family: 'Bangers', cursive;
        letter-spacing: 0.08em;
    }
    .hud-label {
        display: block;
        font-size: 0.58rem;
        color: #9befff;
        margin-bottom: 0.4rem;
    }
    .hud-value {
        display: block;
        font-size: clamp(1rem, 2.6vw, 1.65rem);
        font-weight: 600;
        line-height: 1;
    }
    .hint-card {
        max-width: min(42vw, 360px);
        color: #e8e5ff;
        line-height: 1.15;
    }
    .hint-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.58rem;
        color: var(--accent-gold);
        margin-bottom: 0.55rem;
    }
    .hint-copy {
        font-size: clamp(0.8rem, 1.95vw, 1rem);
        font-weight: 600;
    }
    .btn-retro {
        background: linear-gradient(180deg, #ff9340, var(--accent-hot));
        color: white;
        border: 3px solid #fff2c8;
        box-shadow: 0 6px 0 #7c2500, 0 0 18px rgba(255, 122, 24, 0.34);
        transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        font-family: 'Bangers', cursive;
        letter-spacing: 0.06em;
    }
    .btn-retro:active { transform: translate(2px, 2px); box-shadow: 0 3px 0 #7c2500, 0 0 10px rgba(255, 122, 24, 0.34); filter: brightness(1.05); }
    #ui-layer { pointer-events: none; }
    #hud,
    #reaction-stack,
    #success-reaction,
    #fail-reaction,
    #game-over-screen,
    #restart-btn { pointer-events: auto; }
    .hidden { display: none !important; }
    .marquee-title {
        font-family: 'Bangers', cursive;
        color: var(--accent-gold);
        text-shadow: 0 0 12px rgba(255, 216, 94, 0.35), 0 3px 0 rgba(0,0,0,0.4);
    }
    .game-over-panel {
        max-height: min(90vh, 520px);
    }
    @media (max-width: 720px) {
        #ui-layer { padding: 0.75rem; }
        #hud { gap: 0.5rem; align-items: stretch; }
        .hud-stat { min-width: 0; padding: 0.7rem 0.8rem; }
        .hint-card { max-width: none; padding: 0.7rem 0.8rem; }
        .hint-copy { font-size: 0.76rem; }
    }
    @media (max-width: 560px) {
        #hud {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-areas:
                "score lives"
                "hint hint";
        }
        #score-card { grid-area: score; }
        #lives-card { grid-area: lives; }
        #hint-card { grid-area: hint; }
        .hud-label { font-size: 0.5rem; }
        .hud-value { font-size: 0.92rem; }
        .hint-chip { font-size: 0.5rem; }
        .hint-copy { font-size: 0.72rem; }
    }
</style>
</head>
<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: gameplay/ui/results mapped via catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
    <audio id="bgm_gameover" data-editable="audio" data-label="Game Over Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="Collect Sound" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_correct" data-editable="audio" data-label="Correct Input" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_wrong" data-editable="audio" data-label="Wrong Input" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Warning Sound" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
    <audio id="sfx_gameover" data-editable="audio" data-label="Game Over Stinger" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="Restart Sound" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Game Speed", "value": 1.0, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#FFD700" }
}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4">
        <!-- [agent-note][stage3] resolved-gif: success/fail reactions use compact catalog overlays off the main play lane -->
        <div id="reaction-stack" class="absolute right-3 top-24 z-40 flex flex-col items-end gap-2 pointer-events-none">
            <div id="success-reaction" class="glass hidden overflow-hidden rounded-2xl p-1">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Success reaction" class="block h-20 w-20 sm:h-24 sm:w-24 object-cover rounded-xl">
            </div>
            <div id="fail-reaction" class="glass hidden overflow-hidden rounded-2xl p-1">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction" class="block h-20 w-20 sm:h-24 sm:w-24 object-cover rounded-xl">
            </div>
        </div>
        <!-- HUD -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled without moving core hierarchy -->
        <div id="hud" class="flex justify-between items-start w-full gap-3">
            <div id="score-card" class="glass hud-pill hud-stat px-4 py-3">
                <span class="hud-label">TICKETS</span>
                <span id="score-display" class="hud-value">0</span>
            </div>
            <div id="hint-card" class="glass hint-card px-4 py-3 text-center">
                <div class="hint-chip"><span>★</span><span>SNACK RUSH</span></div>
                <div class="hint-copy">Tap the front snack icon before the queue melts down.</div>
            </div>
            <div id="lives-card" class="glass hud-pill hud-stat px-4 py-3 text-right">
                <span class="hud-label">STRIKES</span>
                <span id="lives-display" class="hud-value" style="color: var(--danger);">3</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center bg-black/50 hidden">
            <div class="glass game-over-panel p-6 text-center max-w-sm w-full animate-bounce-in">
                <div class="hint-chip justify-center mb-3"><span>✦</span><span>SHIFT COMPLETE</span></div>
                <h1 class="marquee-title text-2xl sm:text-3xl mb-3">ARCADE SHIFT OVER!</h1>
                <p class="text-lg mb-6 text-white/90 font-semibold">You cleared <span id="final-score">0</span> snack tickets</p>
                <button id="restart-btn" class="btn-retro px-6 py-4 text-base w-full rounded-xl">RUN IT BACK</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- §0 System Invariants & Globals ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let lastTime = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let score = 0;
let lives = 3;
let gameTime = 0;

// Config
let gameConfig = { baseSpeed: 1.0, themeColor: "#FFD700" };

// Audio System
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
const audioEls = {};
const bgmEl = document.getElementById('bgm_main');
const bgmGameOverEl = document.getElementById('bgm_gameover');
const successReactionEl = document.getElementById('success-reaction');
const failReactionEl = document.getElementById('fail-reaction');
let audioUnlocked = false;
let lastWarningAt = 0;
let reactionTimer = null;

// Entities
let customers = [];
let particles = [];
let buttons = [];
const FOOD_TYPES = ['BURGER', 'CHIPS', 'SLUSHIE', 'FRIEDRICH'];
const FOOD_COLORS = { 'BURGER': '#FF8B5C', 'CHIPS': '#FFD85E', 'SLUSHIE': '#6BE7FF', 'FRIEDRICH': '#C78645' };
const FOOD_EMOJIS = { 'BURGER': '🍔', 'CHIPS': '🍟', 'SLUSHIE': '🥤', 'FRIEDRICH': '🍗' };

// --- §1 Initialization & Lifecycle ---

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            const defs = JSON.parse(el.textContent);
            Object.keys(defs).forEach(k => gameConfig[k] = defs[k].value);
        } catch(e) { console.error("Config parse error", e); }
    }
}

async function initAudio() {
    ['bgm_main', 'bgm_gameover', 'sfx_collect', 'sfx_correct', 'sfx_wrong', 'sfx_warning', 'sfx_gameover', 'sfx_restart']
        .forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            audioEls[id] = el;
            if (id.startsWith('bgm_')) {
                el.volume = 0.2;
            } else if (id === 'sfx_warning') {
                el.volume = 0.35;
            } else if (id === 'sfx_gameover') {
                el.volume = 0.45;
            } else {
                el.volume = 0.4;
            }
        });

    if (!audioCtx) return;

    const loadBuffer = async (id) => {
        const el = audioEls[id];
        if (!el || !el.src) return;
        try {
            const res = await fetch(el.src);
            const arrayBuffer = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch(e) { console.warn(`Failed to load audio ${id}`, e); }
    };

    await Promise.all(['sfx_collect', 'sfx_correct', 'sfx_wrong', 'sfx_warning', 'sfx_gameover', 'sfx_restart'].map(loadBuffer));
}

function initGame() {
    score = 0;
    lives = 3;
    gameTime = 0;
    customers = [];
    particles = [];
    
    updateHUD();
    
    // Spawn initial customers
    for(let i=0; i<3; i++) {
        spawnCustomer(-i * 120 - 100);
    }

    // Create Buttons
    const btnH = 100;
    const pad = 10;
    const btnW = (cw - (pad * 5)) / 4;
    const y = ch - btnH - 40;
    
    buttons = FOOD_TYPES.map((type, i) => ({
        type,
        x: pad + i * (btnW + pad),
        y: y,
        w: btnW,
        h: btnH,
        color: FOOD_COLORS[type],
        pressed: 0
    }));

    setState('PLAYING');
}

function resize(width, height) {
    cw = width;
    ch = height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (initialized) {
        // Re-layout buttons
        const btnH = Math.min(100, ch * 0.15);
        const pad = 10;
        const btnW = (cw - (pad * 5)) / 4;
        const y = ch - btnH - 40;
        buttons.forEach((b, i) => {
            b.x = pad + i * (btnW + pad);
            b.y = y;
            b.w = btnW;
            b.h = btnH;
        });
    }
}

// --- §2 Core Logic ---

function spawnCustomer(yOffset = 0) {
    const type = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
    customers.push({
        type,
        x: cw / 2,
        y: -100 + yOffset,
        targetY: 150 + (customers.length * 90), // Stack them
        vx: 0,
        vy: 0,
        scale: 0,
        state: 'ENTERING', // ENTERING, WAITING, LEAVING
        patience: 100
    });
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    gameTime += dt;
    
    // Difficulty ramp
    const speedMult = 1 + Math.min(score / 50, 1.5) * gameConfig.baseSpeed;
    
    // Update Customers
    // Queue logic: customers move towards target positions
    customers.forEach((c, i) => {
        // Target Y is based on index in queue
        const targetY = 150 + (i * 100);
        
        // Move towards target
        const dy = targetY - c.y;
        c.y += dy * 5 * dt;
        
        // Horizontal sway
        c.x = cw/2 + Math.sin(gameTime * 2 + i) * 10;
        
        // Scale in
        if (c.scale < 1) c.scale += 5 * dt;
        
        // Patience decay only for the front customer
        if (i === 0 && c.y > 100) {
            c.patience -= 15 * dt * speedMult;
            if (c.patience <= 0) {
                handleMiss('timeout');
                // Remove this customer
                customers.shift();
                playSfx('sfx_wrong');
                spawnCustomer(-100);
            }
        }
    });
    
    // Ensure queue is full
    if (customers.length < 5) {
        spawnCustomer(-100);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Button animations
    buttons.forEach(b => {
        if (b.pressed > 0) b.pressed -= dt * 5;
    });
}

function handleInput(type) {
    if (gameState !== 'PLAYING') return;
    
    // Find button to animate
    const btn = buttons.find(b => b.type === type);
    if (btn) btn.pressed = 1;

    const frontCustomer = customers[0];
    if (!frontCustomer) return;

    if (frontCustomer.type === type) {
        // Correct!
        score += 10;
        updateHUD();
        playSfx('sfx_collect');
        playSfx('sfx_correct');
        vibrate('light');
        createParticles(frontCustomer.x, frontCustomer.y, FOOD_COLORS[type]);
        showReaction('success');
        
        // Remove customer
        customers.shift();
        spawnCustomer(-100);
    } else {
        // Wrong!
        handleMiss('wrong');
    }
}

function handleMiss(reason = 'wrong') {
    lives--;
    updateHUD();
    vibrate('heavy');
    shakeScreen();
    playSfx(reason === 'timeout' ? 'sfx_warning' : 'sfx_wrong');
    showReaction('fail');

    if (lives <= 0) {
        setState('GAMEOVER');
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 1.0,
            size: Math.random() * 5 + 2
        });
    }
}

// --- §3 Rendering ---

function draw() {
    // Clear
    const backdrop = ctx.createLinearGradient(0, 0, 0, ch);
    backdrop.addColorStop(0, '#2a1660');
    backdrop.addColorStop(0.5, '#1b103f');
    backdrop.addColorStop(1, '#120927');
    ctx.fillStyle = backdrop;
    ctx.fillRect(0, 0, cw, ch);

    // Neon canopy glow
    const canopyGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.12, 10, cw * 0.5, ch * 0.12, cw * 0.75);
    canopyGlow.addColorStop(0, 'rgba(255, 216, 94, 0.26)');
    canopyGlow.addColorStop(0.4, 'rgba(105, 68, 255, 0.18)');
    canopyGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = canopyGlow;
    ctx.fillRect(0, 0, cw, ch);

    // Background Pattern (Arcade tiles)
    ctx.save();
    ctx.globalAlpha = 0.14;
    const tileSize = 42;
    const offset = (gameTime * 20) % tileSize;
    for(let x=0; x<cw + tileSize; x+=tileSize) {
        for(let y=-tileSize; y<ch + tileSize; y+=tileSize) {
            const isLit = (Math.floor(x/tileSize) + Math.floor((y+offset)/tileSize)) % 2 === 0;
            ctx.fillStyle = isLit ? 'rgba(255,255,255,0.14)' : 'rgba(110, 231, 255, 0.07)';
            ctx.fillRect(x, y + offset, tileSize - 2, tileSize - 2);
        }
    }
    ctx.restore();

    // Snack lane
    const laneGradient = ctx.createLinearGradient(cw * 0.25, 0, cw * 0.75, 0);
    laneGradient.addColorStop(0, 'rgba(255,255,255,0)');
    laneGradient.addColorStop(0.5, 'rgba(150, 246, 255, 0.34)');
    laneGradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.moveTo(cw/2, 0);
    ctx.lineTo(cw/2, ch - 150);
    ctx.strokeStyle = laneGradient;
    ctx.lineWidth = 108;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cw/2, 0);
    ctx.lineTo(cw/2, ch - 150);
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 10;
    ctx.setLineDash([18, 16]);
    ctx.lineDashOffset = -(gameTime * 120);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Customers
    // Draw in reverse order so front is on top
    for(let i=customers.length-1; i>=0; i--) {
        drawCustomer(customers[i], i===0);
    }

    // Draw Buttons
    buttons.forEach(drawButton);

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function drawCustomer(c, isFront) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    
    const haloColor = FOOD_COLORS[c.type];
    const halo = ctx.createRadialGradient(0, 0, 10, 0, 0, 55);
    halo.addColorStop(0, 'rgba(255,255,255,0.95)');
    halo.addColorStop(0.55, `${haloColor}cc`);
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, 56, 0, Math.PI*2);
    ctx.fill();

    const bubbleGradient = ctx.createLinearGradient(-20, -38, 20, 42);
    bubbleGradient.addColorStop(0, '#fffefc');
    bubbleGradient.addColorStop(1, '#ffe7b3');
    ctx.fillStyle = bubbleGradient;
    ctx.strokeStyle = '#2c1854';
    ctx.lineWidth = 4;

    // Shake if patience low
    if (isFront && c.patience < 30) {
        ctx.translate(Math.random()*4-2, Math.random()*4-2);
        ctx.fillStyle = '#ffe3ea';
    }

    // Draw Bubble Shape
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath();
    ctx.arc(-12, -12, 10, 0, Math.PI*2);
    ctx.fill();

    drawFoodIcon(0, 1, 25, c.type);

        ctx.font = '24px "Bangers"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FOOD_EMOJIS[c.type], 0, -56);

    // Patience Bar
    if (isFront) {
        ctx.fillStyle = '#261444';
        ctx.fillRect(-32, 52, 64, 10);
        const patienceColor = c.patience > 50 ? '#9eff75' : '#ff5a7d';
        const patienceFill = ctx.createLinearGradient(-31, 0, 31, 0);
        patienceFill.addColorStop(0, '#fff0a0');
        patienceFill.addColorStop(1, patienceColor);
        ctx.fillStyle = patienceFill;
        ctx.fillRect(-31, 53, 62 * (c.patience/100), 8);
    }
    
    ctx.restore();
}

function drawFoodIcon(x, y, r, type) {
    ctx.save();
    ctx.translate(x, y);
    const color = FOOD_COLORS[type];
    ctx.fillStyle = color;
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    
    if (type === 'BURGER') {
        // Bun Top
        ctx.beginPath(); ctx.arc(0, -5, r, Math.PI, 0); ctx.fill(); ctx.stroke();
        // Meat
        ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.roundRect(-r, -2, r*2, 8, 4); ctx.fill(); ctx.stroke();
        // Bun Bottom
        ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-r, 8, r*2, 6, 4); ctx.fill(); ctx.stroke();
    } else if (type === 'CHIPS') {
        // Container
        ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(10, 20); ctx.lineTo(15, 0); ctx.lineTo(-15, 0); ctx.fill(); ctx.stroke();
        // Fries
        ctx.fillStyle = '#FFD700';
        for(let i=-2; i<=2; i++) {
            ctx.fillRect(i*4, -15 + Math.abs(i)*2, 3, 20);
            ctx.strokeRect(i*4, -15 + Math.abs(i)*2, 3, 20);
        }
    } else if (type === 'SLUSHIE') {
        // Cup
        ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(10, 20); ctx.lineTo(12, -5); ctx.lineTo(-12, -5); ctx.fill(); ctx.stroke();
        // Dome
        ctx.fillStyle = '#00BFFF'; ctx.beginPath(); ctx.arc(0, -5, 12, Math.PI, 0); ctx.fill(); ctx.stroke();
        // Straw
        ctx.strokeStyle = '#FF00FF'; ctx.beginPath(); ctx.moveTo(5, -15); ctx.lineTo(10, -25); ctx.stroke();
    } else if (type === 'FRIEDRICH') {
        // Chicken Leg
        ctx.fillStyle = '#CD853F';
        ctx.beginPath();
        ctx.ellipse(0, 5, 10, 15, Math.PI/6, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        // Bone
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(-8, -10, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(-4, -12, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
}

function drawButton(b) {
    ctx.save();
    const press = b.pressed ? 4 : 0;
    
    // Shadow
    ctx.fillStyle = 'rgba(10, 4, 20, 0.55)';
    ctx.beginPath();
    ctx.roundRect(b.x + 4, b.y + 7, b.w, b.h, 16);
    ctx.fill();

    // Body
    const buttonGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    buttonGradient.addColorStop(0, '#fff2b0');
    buttonGradient.addColorStop(0.18, b.color);
    buttonGradient.addColorStop(1, '#34185f');
    ctx.fillStyle = buttonGradient;
    ctx.translate(press, press);
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 16);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff4cf';
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.roundRect(b.x + 6, b.y + 6, b.w - 12, 18, 12);
    ctx.fill();

    // Label/Icon
    drawFoodIcon(b.x + b.w/2, b.y + b.h/2 - 12, 20, b.type);

    ctx.font = '20px "Bangers"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FOOD_EMOJIS[b.type], b.x + b.w/2, b.y + 18);

    // Text
    ctx.fillStyle = '#FFF';
    ctx.font = '11px "Orbitron"';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#2c1854';
    ctx.lineWidth = 4;
    ctx.strokeText(b.type === 'FRIEDRICH' ? 'CHICKEN' : b.type, b.x + b.w/2, b.y + b.h - 16);
    ctx.fillText(b.type === 'FRIEDRICH' ? 'CHICKEN' : b.type, b.x + b.w/2, b.y + b.h - 16);
    
    ctx.restore();
}

// --- §4 System Core ---

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }
    
    requestAnimationFrame(loop);
}

function handleGlobalInput(e) {
    if (e.cancelable) e.preventDefault();
    unlockAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (gameState === 'GAMEOVER') return; // Handled by DOM button

    // Check buttons
    buttons.forEach(b => {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            handleInput(b.type);
        }
    });
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const goScreen = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        goScreen.classList.add('hidden');
        stopLoop('bgm_gameover');
        playLoop('bgm_main');
    } else if (newState === 'GAMEOVER') {
        document.getElementById('final-score').innerText = score;
        goScreen.classList.remove('hidden');
        stopLoop('bgm_main');
        playSfx('sfx_gameover');
        playLoop('bgm_gameover');
    }
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = '♥'.repeat(Math.max(0, lives));
}

function restartGame() {
    initGame();
}

function shakeScreen() {
    canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
    setTimeout(() => {
        canvas.style.transform = 'none';
    }, 200);
}

// Audio Helpers
function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    playLoop(gameState === 'GAMEOVER' ? 'bgm_gameover' : 'bgm_main');
}

function playLoop(id) {
    if (!audioUnlocked) return;
    const el = audioEls[id];
    if (!el) return;
    try {
        el.currentTime = el.currentTime || 0;
        el.play().catch(() => {});
    } catch (e) {
        console.warn(`Loop playback failed for ${id}`, e);
    }
}

function stopLoop(id) {
    const el = audioEls[id];
    if (!el) return;
    try {
        el.pause();
        el.currentTime = 0;
    } catch (e) {
        console.warn(`Loop stop failed for ${id}`, e);
    }
}

function playSfx(id) {
    if (!audioUnlocked) return;
    const el = audioEls[id];

    if (audioCtx && audioBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = el?.volume ?? 0.4;
        source.buffer = audioBuffers[id];
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
        return;
    }

    if (el) {
        try {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => {});
            return;
        } catch (e) {
            console.warn(`Element SFX playback failed for ${id}`, e);
        }
    }

    synthesizeSfx(id === 'sfx_collect' || id === 'sfx_correct' || id === 'sfx_restart' ? 'chime' : 'noise');
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'chime') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.24);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function showReaction(type) {
    if (reactionTimer) clearTimeout(reactionTimer);
    successReactionEl.classList.add('hidden');
    failReactionEl.classList.add('hidden');

    const target = type === 'success' ? successReactionEl : failReactionEl;
    target.classList.remove('hidden');
    reactionTimer = setTimeout(() => {
        target.classList.add('hidden');
    }, 900);
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style }
    });
}

// Setup
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    initAudio();
    
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        resize(entry.contentRect.width, entry.contentRect.height);
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
        }
    });
    
    ro.observe(canvas);
    
    // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: scoped gesture prevention to canvas so overlay buttons keep native tap/click behavior
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_restart');
        restartGame();
    });
});
</script>
