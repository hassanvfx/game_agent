<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Rival Rush</title>
    <script src="assets/cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap');
        
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { 
            margin: 0; overflow: hidden; 
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.16) 0%, rgba(34, 211, 238, 0) 32%),
                radial-gradient(circle at 80% 18%, rgba(255, 58, 122, 0.18) 0%, rgba(255, 58, 122, 0) 28%),
                linear-gradient(180deg, #080312 0%, #120722 45%, #04010a 100%);
            font-family: 'Exo 2', Arial, sans-serif; user-select: none; 
            -webkit-user-select: none; touch-action: manipulation;
            color: #fff;
        }
        button { font: inherit; }
        .hidden { display: none !important; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none !important; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-6 { gap: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .italic { font-style: italic; }
        .leading-none { line-height: 1; }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-full { border-radius: 9999px; }
        .overflow-y-auto { overflow-y: auto; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .transition-all { transition: all 0.2s; }
        .aspect-square { aspect-ratio: 1 / 1; }
        .grid { display: grid; }
        .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .pt-10 { padding-top: 2.5rem; }
        .pt-2 { padding-top: 0.5rem; }
        .pb-4 { padding-bottom: 1rem; }
        .pb-8 { padding-bottom: 2rem; }
        .pl-1 { padding-left: 0.25rem; }
        .pr-1 { padding-right: 0.25rem; }
        .px-1 { padding-left: 0.25rem; padding-right: 0.25rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .w-\[42\%\] { width: 42%; }
        .w-\[85\%\] { width: 85%; }
        .w-\[90\%\] { width: 90%; }
        .w-\[95\%\] { width: 95%; }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }
        .h-\[90\%\] { height: 90%; }
        .h-\[240px\] { height: 240px; }
        .max-w-sm { max-width: 24rem; }
        .text-5xl { font-size: 3rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-lg { font-size: 1.125rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-\[10px\] { font-size: 10px; }
        .text-\[9px\] { font-size: 9px; }
        .text-\[7px\] { font-size: 7px; }
        .text-transparent { color: transparent; }
        .text-white { color: #fff; }
        .text-white\/90 { color: rgba(255,255,255,0.9); }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-cyan-200 { color: #a5f3fc; }
        .text-cyan-400 { color: #22d3ee; }
        .text-cyan-500 { color: #06b6d4; }
        .text-red-400 { color: #f87171; }
        .text-red-500 { color: #ef4444; }
        .text-red-600 { color: #dc2626; }
        .text-yellow-400 { color: #facc15; }
        .tracking-\[0\.4em\] { letter-spacing: 0.4em; }
        .tracking-wide { letter-spacing: 0.05em; }
        .tracking-wider { letter-spacing: 0.1em; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .opacity-50 { opacity: 0.5; }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-white\/10 { border-color: rgba(255,255,255,0.1); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .border-t { border-top-width: 1px; border-top-style: solid; }
        .bg-black\/60 { background: rgba(0,0,0,0.6); }
        .bg-white\/10 { background: rgba(255,255,255,0.1); }
        .bg-gradient-to-b { background-image: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .bg-gradient-to-r { background-image: linear-gradient(90deg, #22d3ee 0%, #ffffff 50%, #ec4899 100%); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .drop-shadow-\[0_0_10px_rgba\(255\,255\,255\,0\.5\)\] { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #canvas-wrapper,
        #joystick-area,
        .action-btn {
            touch-action: none;
        }
        
        /* UI Elements */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(10, 16, 36, 0.9), rgba(8, 10, 24, 0.94)),
                radial-gradient(circle at top, rgba(0, 255, 255, 0.08), transparent 45%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(130, 237, 255, 0.22);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 16px 44px rgba(0, 0, 0, 0.75),
                0 0 28px rgba(0, 221, 255, 0.12);
            border-radius: 18px;
        }
        h1, h2, h3, .action-btn, .btn-cyber, #timer, #result-title { font-family: 'Orbitron', 'Trebuchet MS', sans-serif; }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 16%, transparent 84%, rgba(0,0,0,0.15)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.035) 0px,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px,
                    transparent 4px
                );
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        #hud {
            position: relative;
            z-index: 2;
        }

        #hud::after {
            content: "";
            position: absolute;
            inset: 0.35rem 0.5rem auto;
            height: 54px;
            border-radius: 18px;
            background: linear-gradient(90deg, rgba(10,16,36,0.9), rgba(23,15,52,0.88));
            border: 1px solid rgba(129, 243, 255, 0.16);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
            z-index: -1;
        }
        
        /* Health Bars */
        .hp-container {
            width: 100%; height: 12px; background: rgba(8, 10, 18, 0.92);
            border: 1px solid rgba(255,255,255,0.18); transform: skewX(-20deg);
            overflow: hidden; margin-top: 4px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 12px rgba(255,255,255,0.05);
        }
        .hp-fill { height: 100%; transition: width 0.2s ease-out; }
        .p1-hp { background: linear-gradient(90deg, #ffe45c, #ff7a18 55%, #ff315f 100%); float: right; box-shadow: 0 0 14px rgba(255, 140, 60, 0.45); }
        .p2-hp { background: linear-gradient(90deg, #5dfdff, #3f7bff 55%, #843dff 100%); box-shadow: 0 0 14px rgba(93, 253, 255, 0.38); }

        /* Buttons */
        .btn-cyber {
            background: linear-gradient(180deg, #ff5b9b, #b21969);
            border: 2px solid rgba(255, 186, 220, 0.72); color: white; text-transform: uppercase;
            box-shadow: 0 0 22px rgba(255, 0, 123, 0.34), inset 0 1px 0 rgba(255,255,255,0.24);
            text-shadow: 0 2px 0 rgba(86, 11, 42, 0.95);
            transition: transform 0.1s, filter 0.1s, box-shadow 0.2s ease;
            letter-spacing: 0.14em;
        }
        .btn-cyber:active { transform: scale(0.96); filter: brightness(1.2); }
        .btn-cyber:hover { box-shadow: 0 0 28px rgba(255, 0, 123, 0.5), inset 0 1px 0 rgba(255,255,255,0.32); }
        
        /* Character Select Grid */
        .char-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.12);
            transition: all 0.2s; cursor: pointer; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .char-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 52%);
            opacity: 0.55;
            pointer-events: none;
        }
        .char-btn.hero { border-bottom: 2px solid #5dfdff; }
        .char-btn.villain { border-bottom: 2px solid #ff5f86; background: linear-gradient(180deg, rgba(70,0,22,0.44), rgba(20,0,10,0.28)); }
        
        .char-btn.selected { 
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(89, 214, 255, 0.14)); 
            border-color: #dffcff; 
            box-shadow: 0 0 20px rgba(93, 253, 255, 0.28); 
            z-index: 10;
            transform: translateY(-2px);
        }

        /* Joystick & Controls */
        #joystick-area {
            position: absolute; bottom: 40px; left: 30px;
            width: 140px; height: 140px;
            touch-action: none;
        }
        #joystick-base {
            position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(143, 250, 255, 0.18), rgba(255, 255, 255, 0.03));
            border: 2px solid rgba(131, 238, 255, 0.24);
            box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(93, 253, 255, 0.12);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 60px; height: 60px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #77dfff 38%, #2f3f91 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(119, 223, 255, 0.28);
            pointer-events: none;
        }

        .action-btn {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.22);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px; color: white;
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.28), 0 0 18px rgba(255,255,255,0.08);
            transition: transform 0.1s, background 0.1s, box-shadow 0.2s ease;
            text-shadow: 0 1px 0 rgba(0,0,0,0.65);
        }
        .action-btn:active { transform: translateY(4px); box-shadow: none; background: rgba(255,255,255,0.2); }
        
        .btn-punch { background: radial-gradient(circle at 30% 30%, rgba(255, 154, 154, 0.42), rgba(255, 50, 50, 0.18)); border-color: rgba(255, 119, 119, 0.55); }
        .btn-kick { background: radial-gradient(circle at 30% 30%, rgba(134, 178, 255, 0.42), rgba(50, 100, 255, 0.18)); border-color: rgba(98, 190, 255, 0.55); }
        .btn-jump { width: 55px; height: 55px; font-size: 14px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.28), rgba(255, 255, 255, 0.1)); }

        #video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at center, rgba(0, 255, 255, 0.12), rgba(0, 0, 0, 0.92) 70%);
            z-index: 50; display: none;
            pointer-events: none;
        }
        #reaction-layer {
            position: absolute;
            inset: 0;
            z-index: 18;
            pointer-events: none;
            overflow: hidden;
        }
        .reaction-badge {
            position: absolute;
            right: 14px;
            top: 84px;
            width: min(24vw, 92px);
            height: min(24vw, 92px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(6, 12, 28, 0.58);
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(-8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            overflow: hidden;
        }
        .reaction-badge.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        .reaction-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .reaction-badge.result {
            top: auto;
            bottom: 24px;
            left: 50%;
            right: auto;
            transform: translate(-50%, 12px) scale(0.92);
            width: min(30vw, 128px);
            height: min(30vw, 128px);
            border-radius: 22px;
        }
        .reaction-badge.result.visible {
            transform: translate(-50%, 0) scale(1);
        }
        .reaction-caption {
            position: absolute;
            inset: auto 0 0 0;
            padding: 0.3rem 0.45rem;
            font-size: 9px;
            letter-spacing: 0.18em;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.88));
            color: #fff;
        }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }

        @media (max-width: 640px) {
            #hud {
                padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
            }
            #hud::after {
                inset: calc(env(safe-area-inset-top, 0px) + 0.15rem) 0.35rem auto;
                height: 48px;
            }
            #controls {
                height: 190px;
                padding-left: max(1rem, env(safe-area-inset-left, 0px));
                padding-right: max(1rem, env(safe-area-inset-right, 0px));
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.9rem);
            }
            #joystick-area {
                left: 14px;
                bottom: 16px;
                width: 112px;
                height: 112px;
            }
            .action-btn {
                width: 64px;
                height: 64px;
                font-size: 17px;
            }
            .btn-jump {
                width: 50px;
                height: 50px;
                font-size: 12px;
            }
            .reaction-badge {
                top: 92px;
                right: 10px;
                width: 72px;
                height: 72px;
            }
            .reaction-badge.result {
                bottom: 18px;
                width: 96px;
                height: 96px;
            }
        }
        
        /* Scrollbar hide */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        #start-screen h1,
        #result-title {
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #sel-preview {
            position: relative;
            overflow: hidden;
        }

        #sel-preview::after {
            content: "";
            position: absolute;
            inset: 18% 22%;
            border-radius: 999px 999px 42% 42%;
            background: rgba(255,255,255,0.42);
            box-shadow:
                0 12px 0 -4px rgba(255,255,255,0.22),
                0 -10px 0 -7px rgba(255,255,255,0.26);
            opacity: 0.75;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 3D Canvas -->
    <div id="canvas-wrapper" class="absolute inset-0 z-0"></div>

    <!-- UI Layer -->
    <div id="reaction-layer" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: hit/result-feedback -> catalogs/gifs.json -->
        <div id="hit-reaction" class="reaction-badge">
            <img id="hit-reaction-img" alt="Impact reaction effect">
            <div class="reaction-caption">IMPACT</div>
        </div>
        <div id="result-reaction" class="reaction-badge result">
            <img id="result-reaction-img" alt="Result reaction effect">
            <div id="result-reaction-caption" class="reaction-caption">RESULT</div>
        </div>
    </div>
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between">
        
        <!-- HUD -->
        <div id="hud" class="w-full p-2 pt-10 flex justify-between items-start bg-gradient-to-b from-black/80 to-transparent hidden">
            <div class="w-[42%]">
                <div class="text-yellow-400 text-[10px] font-bold truncate tracking-widest" id="p1-name">HERO</div>
                <div class="hp-container"><div id="p1-health" class="hp-fill p1-hp" style="width: 100%"></div></div>
            </div>
            <div class="text-white text-3xl font-black mt-1 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]" id="timer">99</div>
            <div class="w-[42%] text-right">
                <div class="text-red-400 text-[10px] font-bold truncate tracking-widest" id="p2-name">VILLAIN</div>
                <div class="hp-container"><div id="p2-health" class="hp-fill p2-hp" style="width: 100%"></div></div>
            </div>
        </div>

        <!-- Screens -->
        <div id="screens" class="absolute inset-0 flex items-center justify-center pointer-events-auto z-20">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 text-center w-[90%] max-w-sm flex flex-col gap-6">
                <div>
                    <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r leading-none" style="filter: drop-shadow(0 0 15px rgba(0,255,255,0.5));">NEON<br>RIVAL RUSH</h1>
                    <p class="text-cyan-200 text-[10px] tracking-[0.4em] mt-3 font-bold">STREET CIRCUIT SHOWDOWN</p>
                </div>
                <div class="text-xs text-gray-400">
                    <p>PICK A RUNNER • OUTLAST THE CLOCK</p>
                    <p>STRIKE FIRST • STAY ON YOUR FEET</p>
                </div>
                <button id="start-btn" class="btn-cyber py-4 text-xl font-bold rounded w-full tracking-widest">START RUN</button>
            </div>

            <!-- Character Select -->
            <div id="char-select" class="glass-panel p-4 text-center w-[95%] h-[90%] flex flex-col hidden">
                <h2 class="text-xl text-white font-bold mb-2 tracking-wide">SELECT RUNNER</h2>
                
                <div class="flex-1 overflow-y-auto custom-scroll pr-1">
                    <div class="text-left text-[10px] text-cyan-500 font-bold mb-1 pl-1">CHALLENGERS</div>
                    <div id="hero-grid" class="grid grid-cols-4 gap-2 pb-4">
                        <!-- Heroes Generated via JS -->
                    </div>
                    
                    <div class="text-left text-[10px] text-red-500 font-bold mb-1 pl-1 border-t border-white/10 pt-2">RIVALS</div>
                    <div id="villain-grid" class="grid grid-cols-4 gap-2 pb-4">
                        <!-- Villains Generated via JS -->
                    </div>
                </div>

                <div class="mt-2 bg-black/60 p-3 rounded-lg border border-white/10">
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-left">
                            <h3 id="sel-name" class="text-xl text-cyan-400 font-black tracking-tighter">---</h3>
                            <div class="text-[10px] text-gray-300" id="sel-desc">LOADOUT: ---</div>
                            <div class="flex gap-2 text-[9px] text-gray-400 mt-1">
                                <span class="bg-white/10 px-1 rounded">DRIVE: <span id="sel-pwr" class="text-white">-</span></span>
                                <span class="bg-white/10 px-1 rounded">PACE: <span id="sel-spd" class="text-white">-</span></span>
                            </div>
                        </div>
                        <div id="sel-preview" class="w-10 h-10 rounded-full border-2 border-white/20 shadow-[0_0_15px_currentColor]"></div>
                    </div>
                    <button id="fight-btn" class="btn-cyber py-3 w-full text-lg font-bold opacity-50 transition-all" disabled>ENTER MATCH</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="glass-panel p-8 text-center w-[85%] hidden relative z-50">
                <h2 id="result-title" class="text-5xl font-black mb-2 text-white italic">WIN</h2>
                <p id="result-msg" class="text-sm text-cyan-200 mb-8 font-bold tracking-wide">CIRCUIT POINTS SECURED</p>
                <button id="restart-btn" class="btn-cyber py-4 px-8 w-full font-bold">RUN IT BACK</button>
            </div>
        </div>

        <!-- Controls (Bottom) -->
        <div id="controls" class="w-full h-[240px] px-6 pb-8 flex justify-between items-end pointer-events-auto hidden z-10">
            <!-- Joystick -->
            <div id="joystick-area">
                <div id="joystick-base"></div>
                <div id="joystick-stick"></div>
            </div>
            
            <!-- Buttons -->
            <div class="flex flex-col items-end gap-3 mb-2">
                <div class="action-btn btn-jump" id="btn-jump">JUMP</div>
                <div class="flex gap-3">
                    <div class="action-btn btn-punch" id="btn-punch">ATK</div>
                    <div class="action-btn btn-kick" id="btn-kick">KICK</div>
                </div>
            </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    /* --- 1. CONFIG & DATA --- */
    const ASSETS = {

    // Expanded Roster: Heroes & Villains with visual traits
    const FIGHTERS = [
        // HEROES
        { name: "MANUEL", type: 'hero', color: 0x00aaff, power: 88, speed: 88, hair: 'spiky', weapon: 'sword', outfit: 'armor' },
        { name: "SCORPION", type: 'hero', color: 0xffff00, power: 90, speed: 70, hair: 'bald', weapon: 'spear', outfit: 'ninja' },
        { name: "SUB-ZERO", type: 'hero', color: 0x0088ff, power: 75, speed: 85, hair: 'ninja', weapon: 'dagger', outfit: 'ninja' },
        { name: "REPTILE", type: 'hero', color: 0x00ff00, power: 70, speed: 90, hair: 'bald', weapon: 'claws', outfit: 'ninja' },

        // VILLAINS (New)
        { name: "KANE", type: 'villain', color: 0xaa0000, power: 95, speed: 50, hair: 'bald', weapon: 'hammer', outfit: 'heavy' },
        { name: "VIPER", type: 'villain', color: 0x00ffaa, power: 60, speed: 98, hair: 'mohawk', weapon: 'dagger', outfit: 'light' },

        { name: "JINX", type: 'villain', color: 0xff00ff, power: 78, speed: 88, hair: 'long', weapon: 'staff', outfit: 'light' },
        { name: "VOID", type: 'villain', color: 0x110011, power: 99, speed: 40, hair: 'hood', weapon: 'scythe', outfit: 'robe' },
        { name: "RAZE", type: 'villain', color: 0xff3300, power: 85, speed: 80, hair: 'spiky', weapon: 'dual', outfit: 'armor' },
        { name: "GRIM", type: 'villain', color: 0x333333, power: 80, speed: 70, hair: 'hood', weapon: 'scythe', outfit: 'robe' },

    ];

    /* --- 2. AUDIO SYSTEM --- */
    const reactionFX = {
        hitTimer: null,
        resultTimer: null,
        hitEl: document.getElementById('hit-reaction'),
        hitImg: document.getElementById('hit-reaction-img'),
        resultEl: document.getElementById('result-reaction'),
        resultImg: document.getElementById('result-reaction-img'),
        resultCaption: document.getElementById('result-reaction-caption'),
        showHit() {
            if (!this.hitEl || !this.hitImg) return;

        showResult(isWin) {

            this.resultImg.src = isWin ? ASSETS.gifs.resultWin : ASSETS.gifs.resultLose;
            this.resultCaption.textContent = isWin ? 'CLUTCH WIN' : 'ROUND LOST';

            clearTimeout(this.resultTimer);
            this.resultTimer = setTimeout(() => this.resultEl.classList.remove('visible'), 3200);
        },
        resetResult() {
            if (!this.resultEl) return;

            clearTimeout(this.resultTimer);
        }
    };

    const audio = {
        unlocked: false,
        bgm: new Audio(ASSETS.bgm),
        victoryLoop: new Audio(ASSETS.stingers.victoryLoop),
        defeatLoop: new Audio(ASSETS.stingers.defeatLoop),
        sfx: {},
        sfxCooldowns: {},
        init: function() {
            [this.bgm, this.victoryLoop, this.defeatLoop].forEach(track => {
                track.loop = true;
                track.preload = 'auto';
            });
            this.bgm.volume = 0.2;
            this.victoryLoop.volume = 0.2;
            this.defeatLoop.volume = 0.18;
            for (const [k, v] of Object.entries(ASSETS.sfx)) {
                const sample = new Audio(v);
                sample.preload = 'auto';
                sample.volume = k === 'hit' ? 0.48 : 0.58;
                this.sfx[k] = sample;
            }
        },
        unlock: function() {
            if (this.unlocked) return;
            this.unlocked = true;
            const primer = new Audio();
            primer.play().catch(() => {});
        },
        stopAllLoops: function() {
            [this.bgm, this.victoryLoop, this.defeatLoop].forEach(track => {
                track.pause();
                track.currentTime = 0;
            });
        },
        playBGM: function() {
            this.stopAllLoops();
            this.bgm.play().catch(()=>{});
        },
        playResultLoop: function(isWin) {
            const track = isWin ? this.victoryLoop : this.defeatLoop;
            track.currentTime = 0;
            track.play().catch(()=>{});
        },
        stopBGM: function() {
            this.stopAllLoops();
        },
        playSFX: function(k, cooldown = 0) {
            const now = performance.now();
            if (cooldown && this.sfxCooldowns[k] && now - this.sfxCooldowns[k] < cooldown) return;
            if(this.sfx[k]) {
                this.sfxCooldowns[k] = now;
                const s = this.sfx[k].cloneNode();
                s.volume = this.sfx[k].volume;
                s.play().catch(()=>{});
            }
        }
    };
    audio.init();

    /* --- 3. INPUT SYSTEM (JOYSTICK) --- */
    const input = { x: 0, y: 0, jump: false, punch: false, kick: false };

    class VirtualJoystick {
        constructor() {
            this.area = document.getElementById('joystick-area');
            this.stick = document.getElementById('joystick-stick');
            this.active = false;
            this.origin = { x: 0, y: 0 };
            this.radius = 40;

            const start = (e) => {
                e.preventDefault();
                this.active = true;
                const pt = e.touches ? e.touches[0] : e;
                const rect = this.area.getBoundingClientRect();
                this.origin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                this.update(pt.clientX, pt.clientY);
            };
            const move = (e) => {
                if (!this.active) return;
                const pt = e.touches ? e.touches[0] : e;
                this.update(pt.clientX, pt.clientY);
            };
            const end = () => {
                this.active = false;
                this.stick.style.transform = `translate(-50%, -50%)`;
                input.x = 0; input.y = 0;
            };

            this.area.addEventListener('touchstart', start);
            this.area.addEventListener('touchmove', move);
            this.area.addEventListener('touchend', end);
            this.area.addEventListener('mousedown', start);
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', end);
        }
        update(cx, cy) {
            let dx = cx - this.origin.x;
            let dy = cy - this.origin.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > this.radius) {
                const ratio = this.radius / dist;
                dx *= ratio; dy *= ratio;
            }
            this.stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            input.x = dx / this.radius;
            input.y = -(dy / this.radius);
        }
    }
    new VirtualJoystick();

    function setupBtn(id, key) {
        const el = document.getElementById(id);
        const trigger = (s) => { if (key === 'jump' && s) input.jump = true; else input[key] = s; };
        el.addEventListener('touchstart', (e) => { e.preventDefault(); trigger(true); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); trigger(false); });
        el.addEventListener('mousedown', () => trigger(true));
        el.addEventListener('mouseup', () => trigger(false));
    }
    setupBtn('btn-jump', 'jump');
    setupBtn('btn-punch', 'punch');
    setupBtn('btn-kick', 'kick');

    /* --- 4. THREE.JS ENGINE --- */
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0022, 0.03);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6, 22);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x404040, 2); 
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // City Background
    function createCity() {
        const g = new THREE.Group();
        const geo = new THREE.BoxGeometry(1, 1, 1);
        for (let i = 0; i < 50; i++) {
            const h = 5 + Math.random() * 20;
            const w = 2 + Math.random() * 4;
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x110022, roughness: 0.2, metalness: 0.8,
                emissive: 0x330066, emissiveIntensity: 0.1
            });
            const m = new THREE.Mesh(geo, mat);
            m.scale.set(w, h, w);
            m.position.set((Math.random()-0.5)*70, h/2 - 5, -15 - Math.random()*30);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: Math.random()>0.5?0x00ffff:0xff00ff, transparent:true, opacity:0.2 }));
            line.scale.copy(m.scale);
            line.position.copy(m.position);
            g.add(m); g.add(line);
        }
        scene.add(g);
    }
    createCity();

    // Floor
    const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.1, metalness: 0.6 })
    );
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    scene.add(plane);
    const grid = new THREE.GridHelper(100, 40, 0xff00ff, 0x220044);
    grid.position.y = 0.02;
    scene.add(grid);

    /* --- 5. VISUAL GENERATORS --- */
    function createHair(type, color) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: color, roughness:0.5 });
        if (type === 'spiky') {
            const geo = new THREE.ConeGeometry(0.1, 0.4, 4);
            for(let i=0; i<5; i++) {
                const m = new THREE.Mesh(geo, mat);
                m.position.set((Math.random()-0.5)*0.3, 0.3, (Math.random()-0.5)*0.3);
                m.rotation.x = (Math.random()-0.5);
                g.add(m);
            }
        } else if (type === 'mohawk') {
            const geo = new THREE.BoxGeometry(0.1, 0.4, 0.5);
            const m = new THREE.Mesh(geo, mat);
            m.position.y = 0.3;
            g.add(m);
        } else if (type === 'long') {
            const geo = new THREE.BoxGeometry(0.55, 0.8, 0.2);
            const m = new THREE.Mesh(geo, mat);
            m.position.set(0, -0.2, -0.3);
            g.add(m);
        } else if (type === 'bun') {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.25), mat);
            m.position.set(0, 0.2, -0.25);
            g.add(m);
        } else if (type === 'hood' || type === 'helmet') {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.6), mat);
            m.position.y = 0;
            g.add(m);
        } else if (type === 'ponytail') {
             const m = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 0.6), mat);
             m.position.set(0, 0, -0.4);
             m.rotation.x = -0.5;
             g.add(m);
        }
        return g;
    }

    function createWeapon(type) {
        const g = new THREE.Group();
        const steel = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.2 });
        const handle = new THREE.MeshStandardMaterial({ color: 0x553311 });
        const glow = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent:true, opacity:0.5 });

        if (type === 'sword' || type === 'katana') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), handle);
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.0, 0.05), steel);
            b.position.y = 1.3;
            g.add(h); g.add(b);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.3, 0.5);
        } else if (type === 'hammer' || type === 'mace') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.5), handle);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.4), steel);
            head.position.y = 0.75;
            g.add(h); g.add(head);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.3, 0.5);
        } else if (type === 'axe') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4), handle);
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.1), steel);
            b.position.set(0.2, 0.6, 0);
            g.add(h); g.add(b);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.3, 0.5);
        } else if (type === 'spear' || type === 'staff') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.5), handle);
            g.add(h);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.3, 0);
        } else if (type === 'scythe') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5), handle);
            const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.4), steel); // Blade
            b.position.set(0.5, 1.2, 0);
            b.rotation.z = 0.3;
            g.add(h); g.add(b);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.3, 0.5);
        } else if (type === 'dagger') {
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3), handle);
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.02), steel);
            b.position.y = 0.45;
            g.add(h); g.add(b);
            g.rotation.x = -Math.PI/2;
            g.position.set(0, -0.1, 0.3);
        }
        return g;
    }

    /* --- 6. ENTITIES --- */
    class Fighter3D {
        constructor(data, isPlayer, startX) {
            this.data = data;
            this.isPlayer = isPlayer;
            this.hp = 100;
            this.mesh = new THREE.Group();
            this.action = 'idle';
            this.frame = 0;
            this.facing = isPlayer ? 1 : -1; 
            this.velocity = { x: 0, y: 0 };
            this.isGrounded = true;
            this.attackCooldown = 0;

            // Materials
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const suitMat = new THREE.MeshStandardMaterial({ 
                color: data.color, roughness: 0.4, metalness: 0.5, 
                emissive: data.color, emissiveIntensity: 0.3 
            });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // Torso
            const torsoGeo = new THREE.BoxGeometry(1, 1.5, 0.6);
            this.torso = new THREE.Mesh(torsoGeo, suitMat);
            this.torso.position.y = 2.25;
            this.torso.castShadow = true;
            this.mesh.add(this.torso);

            // Armor/Outfit
            if (data.outfit === 'armor' || data.outfit === 'heavy') {
                const armor = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.8, 0.7), darkMat);
                armor.position.y = 0.2;
                this.torso.add(armor);
            } else if (data.outfit === 'robe') {
                const robe = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.7), suitMat);
                this.torso.add(robe);
            }

            // Head
            const headGeo = new THREE.BoxGeometry(0.5, 0.6, 0.5);
            this.head = new THREE.Mesh(headGeo, skinMat);
            this.head.position.y = 3.4;
            this.mesh.add(this.head);
            
            // Mask
            if (data.hair !== 'helmet') {
                const mask = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.25, 0.52), suitMat);
                mask.position.y = -0.1;
                this.head.add(mask);
            }

            // Hair/Hat
            const hair = createHair(data.hair, data.color);
            hair.position.y = 0.3;
            this.head.add(hair);

            // Arms
            const armGeo = new THREE.BoxGeometry(0.3, 1.2, 0.3);
            this.lArm = new THREE.Mesh(armGeo, skinMat);
            this.lArm.position.set(0.8, 2.5, 0);
            this.mesh.add(this.lArm);
            
            this.rArm = new THREE.Mesh(armGeo, skinMat);
            this.rArm.position.set(-0.8, 2.5, 0);
            this.mesh.add(this.rArm);

            // Weapon (Right Hand)
            if (data.weapon && data.weapon !== 'none') {
                const w = createWeapon(data.weapon);
                w.position.y = -0.5; // Hold at bottom of arm
                this.rArm.add(w);
            }
            if (data.weapon === 'dual' || data.weapon === 'gauntlets') {
                const w2 = createWeapon(data.weapon === 'dual' ? 'dagger' : 'gauntlets'); // Simple fallback for dual
                w2.position.y = -0.5;
                this.lArm.add(w2);
            }

            // Legs
            const legGeo = new THREE.BoxGeometry(0.35, 1.5, 0.35);
            this.lLeg = new THREE.Mesh(legGeo, darkMat);
            this.lLeg.position.set(0.3, 0.75, 0);
            this.mesh.add(this.lLeg);
            this.rLeg = new THREE.Mesh(legGeo, darkMat);
            this.rLeg.position.set(-0.3, 0.75, 0);
            this.mesh.add(this.rLeg);

            this.mesh.position.set(startX, 0, 0);
            this.mesh.rotation.y = isPlayer ? Math.PI / 2 : -Math.PI / 2;
            scene.add(this.mesh);
        }

        update(dt, opponent) {
            this.frame += dt * 5;

            // Physics
            if (!this.isGrounded) {
                this.velocity.y -= 30 * dt;
                this.mesh.position.y += this.velocity.y * dt;
                if (this.mesh.position.y <= 0) {
                    this.mesh.position.y = 0;
                    this.velocity.y = 0;
                    this.isGrounded = true;
                }
            }
            this.mesh.position.x += this.velocity.x * dt;
            this.velocity.x *= 0.9; 

            // Bounds
            if (this.mesh.position.x < -12) this.mesh.position.x = -12;
            if (this.mesh.position.x > 12) this.mesh.position.x = 12;

            if (this.attackCooldown > 0) this.attackCooldown -= dt;

            // Idle Anim
            if (this.action === 'idle') {
                const bounce = Math.sin(this.frame) * 0.05;
                this.torso.position.y = 2.25 + bounce;
                this.head.position.y = 3.4 + bounce;
                this.lArm.rotation.z = Math.sin(this.frame) * 0.1;
                this.rArm.rotation.z = -Math.sin(this.frame) * 0.1;
                this.lLeg.rotation.x = 0;
                this.rLeg.rotation.x = 0;
            }

            // Face opponent
            const dx = opponent.mesh.position.x - this.mesh.position.x;
            this.facing = dx > 0 ? 1 : -1;
            this.mesh.rotation.y = this.facing === 1 ? Math.PI / 2 : -Math.PI / 2;
        }

        jump() {
            if (this.isGrounded && this.action !== 'hit') {
                this.velocity.y = 12;
                this.isGrounded = false;
                audio.playSFX('jump', 120);
            }
        }

        move(dir) {
            if (this.action === 'hit') return;
            const speed = (this.data.speed / 100) * 12;
            this.velocity.x = dir * speed;
            if(this.isGrounded) {
                this.lLeg.rotation.x = Math.sin(this.frame * 4) * 0.6;
                this.rLeg.rotation.x = -Math.sin(this.frame * 4) * 0.6;
            }
        }

        attack(type, opponent) {
            if (this.attackCooldown > 0 || this.action === 'hit') return;
            this.action = type; 
            this.attackCooldown = 0.5;

            // Attack Anim
            if (type === 'punch') {
                // Weapon Swing
                const arm = this.facing === 1 ? this.rArm : this.lArm; // Use right arm for weapon usually
                let t = 0;
                const anim = setInterval(() => {
                    t += 0.15;
                    // Swing down
                    arm.rotation.x = -Math.PI * Math.sin(t * Math.PI * 0.8);
                    if (t >= 1) {
                        clearInterval(anim);
                        arm.rotation.x = 0;
                        if(this.action === type) this.action = 'idle';
                    }
                }, 16);
            } else {
                // Kick
                const leg = this.facing === 1 ? this.rLeg : this.lLeg;
                let t = 0;
                const anim = setInterval(() => {
                    t += 0.15;
                    leg.rotation.x = -Math.PI/2 * Math.sin(t * Math.PI);
                    this.mesh.position.x += this.facing * 0.1;
                    if (t >= 1) {
                        clearInterval(anim);
                        leg.rotation.x = 0;
                        if(this.action === type) this.action = 'idle';
                    }
                }, 16);
            }

            // Hit Detection
            setTimeout(() => {
                const dist = Math.abs(this.mesh.position.x - opponent.mesh.position.x);
                const yDist = Math.abs(this.mesh.position.y - opponent.mesh.position.y);
                const range = (this.data.weapon && this.data.weapon !== 'none') ? 3.5 : 2.5; // Weapon range bonus
                
                if (dist < range && yDist < 3.0) {
                    const dmg = type === 'punch' ? 8 : 10;
                    opponent.takeDamage(dmg * (this.data.power / 80));
                }
            }, 150);
        }

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp < 0) this.hp = 0;
            this.action = 'hit';
            this.velocity.x = -this.facing * 5;
            this.velocity.y = 4; 
            this.isGrounded = false;

            this.torso.material.emissive.setHex(0xffffff);
            setTimeout(() => {
                this.torso.material.emissive.setHex(this.data.color);
                this.action = 'idle';
            }, 200);

            audio.playSFX('hit', 120);
            reactionFX.showHit();
            updateHUD();
        }

        dispose() {
            scene.remove(this.mesh);
        }
    }

    /* --- 7. LOGIC --- */
    let p1, p2;
    let selectedFighterIndex = -1;
    let gameState = { active: false, timer: 99, timerInterval: null };

    function initCharSelect() {
        const heroGrid = document.getElementById('hero-grid');
        const villainGrid = document.getElementById('villain-grid');
        heroGrid.innerHTML = '';
        villainGrid.innerHTML = '';

        FIGHTERS.forEach((f, i) => {
            const btn = document.createElement('div');
            btn.className = `char-btn rounded aspect-square ${f.type}`;
            
            const initial = document.createElement('div');
            initial.className = 'text-xl font-black text-white/90';
            initial.innerText = f.name[0];
            
            const name = document.createElement('div');
            name.className = 'text-[7px] font-bold mt-1 tracking-wider text-center w-full truncate';
            name.innerText = f.name;
            name.style.color = '#' + f.color.toString(16).padStart(6, '0');

            btn.appendChild(initial);
            btn.appendChild(name);
            
            btn.onclick = () => {
                document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedFighterIndex = i;
                
                const cHex = '#' + f.color.toString(16).padStart(6, '0');
                const selName = document.getElementById('sel-name');
                selName.innerText = f.name;
                selName.style.color = cHex;
                
                document.getElementById('sel-desc').innerText = `LOADOUT: ${f.weapon.toUpperCase()}`;
                document.getElementById('sel-pwr').innerText = f.power;
                document.getElementById('sel-spd').innerText = f.speed;
                
                const prev = document.getElementById('sel-preview');
                prev.style.backgroundColor = cHex;
                prev.style.boxShadow = `0 0 20px ${cHex}`;
                
                const fb = document.getElementById('fight-btn');
                fb.disabled = false;
                fb.classList.remove('opacity-50');
                fb.style.boxShadow = "0 0 25px rgba(255, 0, 85, 0.6)";
                audio.playSFX('confirm', 80);
            };

            if (f.type === 'hero') heroGrid.appendChild(btn);
            else villainGrid.appendChild(btn);
        });
    }

    function startGame(pIndex) {
        if (p1) p1.dispose();
        if (p2) p2.dispose();

        const pData = FIGHTERS[pIndex];
        // Pick random opponent, prefer different type if possible
        let eIndex;
        let attempts = 0;
        do {
            eIndex = Math.floor(Math.random() * FIGHTERS.length);
            attempts++;
        } while (eIndex === pIndex && attempts < 10);
        
        const eData = FIGHTERS[eIndex];

        p1 = new Fighter3D(pData, true, -5);
        p2 = new Fighter3D(eData, false, 5);

        gameState.timer = 99;
        gameState.active = true;

        document.getElementById('p1-name').innerText = pData.name;
        document.getElementById('p2-name').innerText = eData.name;
        document.getElementById('char-select').classList.add('hidden');
        document.getElementById('screens').classList.add('pointer-events-none');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('video-overlay').style.display = 'none';
        reactionFX.resetResult();
        
        updateHUD();

        if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        gameState.timerInterval = setInterval(() => {
            if (!gameState.active) return;
            gameState.timer--;
            document.getElementById('timer').innerText = gameState.timer;
            if (gameState.timer <= 0) endGame();
        }, 1000);
    }

    function updateHUD() {
        if (!p1 || !p2) return;
        document.getElementById('p1-health').style.width = p1.hp + '%';
        document.getElementById('p2-health').style.width = p2.hp + '%';
        if (p1.hp <= 0 || p2.hp <= 0) endGame();
    }

    function endGame() {
        gameState.active = false;
        clearInterval(gameState.timerInterval);
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('controls').classList.add('hidden');
        document.getElementById('screens').classList.remove('pointer-events-none');
        
        const isWin = p1.hp > p2.hp;
        
        audio.stopBGM();
        reactionFX.showResult(isWin);
        
        if (isWin) {
            audio.playSFX('win');
            audio.playResultLoop(true);
            document.getElementById('result-title').innerText = "QUALIFIED";
            document.getElementById('result-title').className = "text-5xl font-black mb-2 text-cyan-400 italic";
            document.getElementById('result-msg').innerText = `${p1.data.name} OWNS THIS ROUND`;
            
            const vidOverlay = document.getElementById('video-overlay');
            vidOverlay.style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('result-screen').classList.remove('hidden');
            }, 1000);
        } else {
            audio.playSFX('lose');
            audio.playResultLoop(false);
            document.getElementById('result-title').innerText = "ELIMINATED";
            document.getElementById('result-title').className = "text-5xl font-black mb-2 text-red-600 italic";
            document.getElementById('result-msg').innerText = "THE RIVAL TAKES THE ROUND";
            document.getElementById('result-screen').classList.remove('hidden');
        }
    }

    /* --- 8. LOOP --- */
    function updateAI(dt) {
        if (!p2 || !p1 || !gameState.active) return;
        const dist = Math.abs(p2.mesh.position.x - p1.mesh.position.x);
        
        // Simple AI
        if (dist > 3.0) {
            const dir = p1.mesh.position.x > p2.mesh.position.x ? 1 : -1;
            p2.move(dir);
        } else {
            // Attack more aggressively if villain
            const aggro = p2.data.type === 'villain' ? 0.04 : 0.02;
            if (Math.random() < aggro) p2.attack('punch', p1);
            else if (Math.random() < aggro) p2.attack('kick', p1);
        }
        if (Math.random() < 0.005) p2.jump();
    }

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        if (gameState.active && p1 && p2) {
            if (Math.abs(input.x) > 0.1) p1.move(input.x);
            if (input.y > 0.5 && !input.jumpLocked) { p1.jump(); input.jumpLocked = true; } 
            else if (input.y < 0.5) input.jumpLocked = false;

            if (input.jump) { p1.jump(); input.jump = false; }
            if (input.punch) { p1.attack('punch', p2); input.punch = false; }
            if (input.kick) { p1.attack('kick', p2); input.kick = false; }

            updateAI(dt);
            p1.update(dt, p2);
            p2.update(dt, p1);

            const midX = (p1.mesh.position.x + p2.mesh.position.x) / 2;
            camera.position.x += (midX - camera.position.x) * 0.1;
            camera.lookAt(midX, 2, 0);
        }

        renderer.render(scene, camera);
    }

    /* --- 9. UI BINDINGS --- */
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('start');
        audio.playBGM();
        initCharSelect();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('char-select').classList.remove('hidden');
    });

    document.getElementById('fight-btn').addEventListener('click', () => {
        if(selectedFighterIndex > -1) {
            audio.playSFX('menu');
            startGame(selectedFighterIndex);
        }
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('video-overlay').style.display = 'none';
        document.getElementById('char-select').classList.remove('hidden');
        document.getElementById('screens').classList.remove('pointer-events-none');
        reactionFX.resetResult();
        audio.playSFX('menu');
        audio.playBGM();
        camera.position.set(0, 6, 22);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
});
</script>
</body>
