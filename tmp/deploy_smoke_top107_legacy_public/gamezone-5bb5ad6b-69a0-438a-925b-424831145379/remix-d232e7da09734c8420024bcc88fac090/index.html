<!-- [agent-note][stage4] catalog-fonts: display -> Bangers | ui-body -> Rajdhani from catalogs/fonts.json -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
<style>
    :root {
        --bg-top: #130f23;
        --bg-bottom: #24163f;
        --grid-line: rgba(119, 85, 255, 0.18);
        --counter-top: #5236a6;
        --counter-front: #25153d;
        --counter-edge: #8c66ff;
        --panel-bg: rgba(19, 15, 35, 0.66);
        --panel-border: rgba(133, 243, 255, 0.36);
        --panel-glow: rgba(65, 208, 255, 0.24);
        --ui-text: #f8f7ff;
        --subtle-text: rgba(230, 238, 255, 0.72);
        --accent-cyan: #85f3ff;
        --accent-blue: #52a8ff;
        --accent-pink: #ff5fd2;
        --accent-gold: #ffe277;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle at top, #39245e 0%, var(--bg-top) 34%, #0b0915 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
        touch-action: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #game-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        background:
            radial-gradient(circle at 50% -5%, rgba(133, 243, 255, 0.14), transparent 35%),
            radial-gradient(circle at 50% 115%, rgba(255, 95, 210, 0.12), transparent 30%);
    }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .glass {
        background: linear-gradient(180deg, rgba(32, 20, 58, 0.92), rgba(18, 13, 35, 0.9));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 24px var(--panel-glow);
    }
    #ui-layer { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; pointer-events: none; box-sizing: border-box; }
    #hud { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; padding-top: 0.5rem; pointer-events: none; }
    .score-pill {
        color: var(--ui-text);
        font-family: 'Bangers', cursive;
        font-size: clamp(1.2rem, 4vw, 1.95rem);
        letter-spacing: 0.08em;
        text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        background: linear-gradient(180deg, rgba(28, 22, 48, 0.86), rgba(12, 9, 24, 0.82));
        padding: 0.42rem 1rem;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(133, 243, 255, 0.32);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 20px rgba(82, 168, 255, 0.18);
    }
    #controls-hint { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 1.5rem; opacity: 0.3; pointer-events: none; transition: opacity 1s; }
    .hint-ring {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(133, 243, 255, 0.2);
        border-radius: 999px;
        box-shadow: inset 0 0 30px rgba(133, 243, 255, 0.06);
    }
    .hint-ring.move { width: 9rem; height: 9rem; }
    .hint-ring.action { width: 7rem; height: 7rem; background: rgba(255,255,255,0.05); }
    .hint-label {
        color: rgba(229, 243, 255, 0.44);
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: 0.82rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
    }
    .overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top, rgba(41, 28, 74, 0.78), rgba(4, 4, 10, 0.92));
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
    }
    .hidden { display: none !important; }
    .results-card { padding: 2rem; border-radius: 1.5rem; text-align: center; max-width: 22rem; width: calc(100% - 3rem); margin: 0 1.5rem; transform: translateZ(0); transition: all 0.2s ease; border: 1px solid var(--panel-border); box-shadow: 0 20px 48px rgba(0,0,0,0.55), 0 0 28px rgba(82, 168, 255, 0.18); }
    .results-title { margin: 0 0 0.25rem; color: #fff; font-family: 'Bangers', cursive; font-size: clamp(2.25rem, 8vw, 3.25rem); letter-spacing: 0.06em; }
    .results-subtitle { margin: 0 0 2rem; color: var(--subtle-text); font-size: 0.9rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; }
    .results-score { margin: 0 0 2.5rem; color: var(--accent-gold); font-family: 'Bangers', cursive; font-size: clamp(3rem, 11vw, 4.75rem); text-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 18px rgba(255, 226, 119, 0.22); }
    .primary-btn { width: 100%; border: 0; background: linear-gradient(90deg, var(--accent-pink), var(--accent-blue)); color: #fff; font-family: 'Bangers', cursive; font-size: clamp(1.25rem, 4vw, 1.8rem); letter-spacing: 0.08em; padding: 1rem 1.25rem; border-radius: 1.25rem; box-shadow: 0 12px 24px rgba(0,0,0,0.3), 0 0 24px rgba(82, 168, 255, 0.22); transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
    .primary-btn:hover { filter: brightness(1.05); }
    .primary-btn:active { transform: scale(0.97); box-shadow: inset 0 3px 10px rgba(0,0,0,0.25); }
    .feedback-badge {
        position: absolute;
        top: 5.75rem;
        right: 1rem;
        min-width: 8.5rem;
        max-width: min(42vw, 10rem);
        padding: 0.55rem 0.8rem;
        border-radius: 1rem;
        color: #fff;
        font-family: 'Bangers', cursive;
        font-size: clamp(0.95rem, 3vw, 1.2rem);
        letter-spacing: 0.04em;
        text-align: center;
        background: linear-gradient(135deg, rgba(255,95,210,0.92), rgba(82,168,255,0.92));
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        opacity: 0;
        transform: translateY(-0.5rem) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .feedback-badge.show { opacity: 1; transform: translateY(0) scale(1); }
    .feedback-gif {
        position: absolute;
        right: 1rem;
        bottom: 7rem;
        width: min(30vw, 7rem);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(12, 9, 24, 0.45);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        opacity: 0;
        transform: scale(0.88);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
    }
    .feedback-gif.show { opacity: 0.94; transform: scale(1); }
    .feedback-gif.fail {
        left: 1rem;
        right: auto;
        bottom: 8.25rem;
        width: min(28vw, 6.5rem);
    }
    @media (max-width: 520px) {
        .feedback-badge {
            top: 5.25rem;
            right: 0.75rem;
            min-width: 7.25rem;
            padding: 0.5rem 0.7rem;
        }
        .feedback-gif {
            right: 0.75rem;
            bottom: 6.5rem;
            width: min(28vw, 5.8rem);
        }
        .feedback-gif.fail {
            left: 0.75rem;
            bottom: 7.5rem;
            width: min(26vw, 5.4rem);
        }
    }
</style>

<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
             <div class="score-pill">
                <span id="score-display">$0</span>

             <div id="feedback-badge" class="feedback-badge hidden" aria-live="polite"></div>
        </div>

        <img id="fail-gif" class="feedback-gif fail hidden" alt="Missed order reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        <div id="game-over-screen" class="overlay hidden">

<script>
/** 
 * MIDNIGHT COUNTER DASH
 * Mobile-first ingredient delivery sprint with minimal narrative reskin.
 */

// --- CONFIGURATION ---
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = {};
for(let k in gameConfigDefs) gameConfig[k] = gameConfigDefs[k].value;

// --- STATE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let gameState = 'INIT'; 
let initialized = false;
let lastTime = 0;
let score = 0;
let timeAccumulator = 0;
let shakeAmount = 0;

// Layout Constants (Relative to Height)
const LAYOUT = {
    customerY: 0.23,    // Moved down from 0.16
    counterY: 0.30,     // Moved down from 0.26
    gridY: 0.35,        // Moved down from 0.30
    joyY: 0.55
};

// Entities
let cursor = { x: 0, y: 0, holding: null, radius: 20 };
let joystick = { active: false, originX: 0, originY: 0, dx: 0, dy: 0, angle: 0, mag: 0 };
let actionBtn = { pressed: false, x: 0, y: 0, r: 0 };
let customers = [];
let particles = [];
let ingredients = [];
let floatingTexts = [];

// Data
const INGREDIENT_TYPES = [
    { id: 'soup', color: '#8D6E63', label: 'Soup', shape: 'bowl' },
    { id: 'meat', color: '#D32F2F', label: 'Steak', shape: 'rect' },
    { id: 'broccoli', color: '#43A047', label: 'Veggie', shape: 'tree' },
    { id: 'pepsi', color: '#1E88E5', label: 'Soda', shape: 'can' },
    { id: 'coke', color: '#B71C1C', label: 'Cola', shape: 'can' },
    { id: 'fanta', color: '#FB8C00', label: 'Orange', shape: 'can' },
    { id: 'ham', color: '#F48FB1', label: 'Ham', shape: 'rect' },
    { id: 'bread', color: '#FFB74D', label: 'Toast', shape: 'rect' },
    { id: 'ketchup', color: '#E53935', label: 'Sauce', shape: 'bottle' }
];

const CUSTOMER_TYPES = [
    { id: 'cap_guy', color: '#FFCC80', hat: '#8DFF98', outfit: '#46d6ff', mood: '#85f3ff' },
    { id: 'pink_girl', color: '#F8BBD0', hair: '#ff5fd2', outfit: '#7a5cff', mood: '#ffd670' },
    { id: 'purple_guy', color: '#9C27B0', skin: '#E1BEE7', outfit: '#85f3ff', mood: '#ff8df4' },
    { id: 'red_guy', color: '#F44336', skin: '#FFCDD2', outfit: '#ffbf69', mood: '#ff857d' },
    { id: 'blue_girl', color: '#2196F3', hair: '#BBDEFB', outfit: '#8DFF98', mood: '#85f3ff' }
];

// --- AUDIO SYSTEM (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sfxBuffers = {};
let activeBgm = null;
let activeFeedbackTimer = null;
let activeGifTimer = null;
let lastSfxAt = 0;
const feedbackBadge = document.getElementById('feedback-badge');
const serveGif = document.getElementById('serve-gif');
const failGif = document.getElementById('fail-gif');

async function initAudio() {
    const loadBuffer = async (id) => {
        const el = document.getElementById(id);
        if(!el || !el.src) return;
        try {
            const res = await fetch(el.src);
            const arrayBuffer = await res.arrayBuffer();
            sfxBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch(e) { console.warn('Audio load failed', id); }
    };
    await Promise.all(['sfx_pickup', 'sfx_serve', 'sfx_arrive', 'sfx_wrong', 'sfx_restart'].map(loadBuffer));
}

function showFeedback(message, tone = 'serve') {
    if (!feedbackBadge) return;
    feedbackBadge.textContent = message;
    feedbackBadge.classList.remove('hidden');
    feedbackBadge.style.background = tone === 'fail'
        ? 'linear-gradient(135deg, rgba(255,115,115,0.94), rgba(255,95,210,0.94))'
        : 'linear-gradient(135deg, rgba(255,95,210,0.94), rgba(82,168,255,0.94))';
    requestAnimationFrame(() => feedbackBadge.classList.add('show'));
    if (activeFeedbackTimer) clearTimeout(activeFeedbackTimer);
    activeFeedbackTimer = setTimeout(() => {
        feedbackBadge.classList.remove('show');
        feedbackBadge.classList.add('hidden');
    }, 1200);
}

function showReactionGif(type) {
    const target = type === 'fail' ? failGif : serveGif;
    const other = type === 'fail' ? serveGif : failGif;
    if (!target) return;
    other?.classList.remove('show');
    other?.classList.add('hidden');
    target.classList.remove('hidden');
    requestAnimationFrame(() => target.classList.add('show'));
    if (activeGifTimer) clearTimeout(activeGifTimer);
    activeGifTimer = setTimeout(() => {
        target.classList.remove('show');
        target.classList.add('hidden');
    }, 1350);
}

function unlockAudio() {
    if(audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => playBgm());
    } else {
        playBgm();
    }
}

function playSfx(id) {
    const nowMs = performance.now();
    if ((id === 'sfx_arrive' || id === 'sfx_wrong') && nowMs - lastSfxAt < 90) return;
    lastSfxAt = nowMs;

    if(sfxBuffers[id]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = sfxBuffers[id];
        gain.gain.value = id === 'sfx_wrong' ? 0.35 : id === 'sfx_arrive' ? 0.26 : 0.32;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        // Fallback Synth
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        if (id === 'sfx_serve') {
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.1);
            osc.type = 'sine';
        } else if (id === 'sfx_arrive') {
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            osc.type = 'sine';
        } else if (id === 'sfx_wrong') {
            osc.frequency.setValueAtTime(150, now);
            osc.type = 'sawtooth';
        } else {
            osc.frequency.setValueAtTime(200, now);
            osc.type = 'triangle';
        }
        
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }
}

function playBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    activeBgm = bgm;
    if (bgm.paused) {
        bgm.volume = 0.2;
        bgm.play().catch(()=>{});
    }
}

function stopBgm() {
    if (activeBgm && !activeBgm.paused) {
        activeBgm.pause();
        activeBgm.currentTime = 0;
    }
}

function vibrate(type) {
    if(window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
            params: { style: type }
        });
    } else if(navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

// --- LIFECYCLE ---
function initGame() {
    if(initialized) return;
    
    cursor.x = cw / 2;
    cursor.y = ch / 2;
    
    layoutIngredients();

    setState('PLAYING');
    initialized = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function layoutIngredients() {
    ingredients = [];
    const cols = 3;
    const margin = cw * 0.04;
    const gridW = cw - margin * 2;
    const cellW = gridW / cols;
    const startY = ch * LAYOUT.gridY; 
    
    INGREDIENT_TYPES.forEach((type, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        ingredients.push({
            ...type,
            x: margin + col * cellW + cellW/2,
            y: startY + row * cellW + cellW/2,
            w: cellW * 0.9,
            h: cellW * 0.9
        });
    });
}

function setState(newState) {
    gameState = newState;
    const gameOver = document.getElementById('game-over-screen');
    const controls = document.getElementById('controls-hint');
    const scoreEl = document.getElementById('score-display');

    if (newState === 'PLAYING') {
        score = 0;
        showFeedback('Orders Up!', 'serve');
        showReactionGif('serve');
        scoreEl.textContent = '$0';
        customers = [];
        particles = [];
        cursor.holding = null;
        gameOver.classList.add('hidden');
        controls.style.opacity = '0.4';
        playSfx('sfx_restart');
        unlockAudio();
        // Initial spawn sequence
        setTimeout(() => { spawnCustomer(); }, 500);
        setTimeout(() => { spawnCustomer(); }, 1500);
    } else if (newState === 'GAMEOVER') {
        document.getElementById('final-score').textContent = '$' + score;
        gameOver.classList.remove('hidden');
        controls.style.opacity = '0';
        stopBgm();
        showFeedback('Shift Over', 'fail');
        showReactionGif('fail');
        vibrate('heavy');
    }
}

function restartGame() {
    setState('PLAYING');
}

function spawnCustomer() {
    if(customers.length >= 2) return;
    
    const slot0Occupied = customers.some(c => c.slot === 0);
    const slot1Occupied = customers.some(c => c.slot === 1);
    
    let slot = -1;
    if (!slot0Occupied) slot = 0;
    else if (!slot1Occupied) slot = 1;
    else return;

    const type = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
    const want = INGREDIENT_TYPES[Math.floor(Math.random() * INGREDIENT_TYPES.length)];
    
    // Positions: 35% and 65% of width
    const slotX = slot === 0 ? cw * 0.35 : cw * 0.65;

    customers.push({
        ...type,
        slot: slot,
        x: slotX,
        y: ch * LAYOUT.customerY, // Use new lower position
        want: want.id,
        wantLabel: want.label,
        wantObj: want,
        state: 'waiting',
        animTime: 0,
        spawnAnim: 0
    });
    
    playSfx('sfx_arrive');
    showFeedback('New Order!', 'serve');
}

// --- INPUT ---
function handleGlobalInput(e) {
    unlockAudio();
    if(gameState === 'GAMEOVER') return;
    if(gameState === 'PLAYING') handleGameInput(e);
}

function handleGameInput(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const joyZoneY = ch * LAYOUT.joyY;
    const joyRadius = cw * 0.18;
    
    const btnCenterX = cw * 0.75;
    const btnCenterY = ch * 0.82;
    const btnRadius = cw * 0.14;

    if(e.type === 'pointerdown') {
        const dBtn = Math.hypot(x - btnCenterX, y - btnCenterY);
        if(dBtn < btnRadius * 1.5) {
            actionBtn.pressed = true;
            tryInteract();
            return;
        }

        if(x < cw * 0.6 && y > joyZoneY) {
            joystick.active = true;
            joystick.originX = x;
            joystick.originY = y;
            joystick.dx = 0;
            joystick.dy = 0;
        }
    } else if(e.type === 'pointermove') {
        if(joystick.active) {
            let dx = x - joystick.originX;
            let dy = y - joystick.originY;
            const dist = Math.hypot(dx, dy);
            const maxDist = joyRadius;
            
            if(dist > maxDist) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxDist;
                dy = Math.sin(angle) * maxDist;
            }
            joystick.dx = dx / maxDist;
            joystick.dy = dy / maxDist;
            joystick.mag = Math.min(dist / maxDist, 1);
        }
    } else if(e.type === 'pointerup' || e.type === 'pointercancel') {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        actionBtn.pressed = false;
    }
}

function tryInteract() {
    if(cursor.holding) {
        for(let i = customers.length - 1; i >= 0; i--) {
            const c = customers[i];
            const dist = Math.hypot(cursor.x - c.x, cursor.y - c.y);
            if(dist < cw * 0.2) {
                if(c.want === cursor.holding.id) {
                    score += 10;
                    document.getElementById('score-display').textContent = '$' + score;
                    createParticles(c.x, c.y, '#FFD700', 16);
                    createFloatingText(c.x, c.y, '+$10');
                    playSfx('sfx_serve');
                    showFeedback('Perfect Serve!', 'serve');
                    showReactionGif('serve');
                    vibrate('light');
                    customers.splice(i, 1);
                    cursor.holding = null;
                } else {
                    vibrate('medium');
                    playSfx('sfx_wrong');
                    showFeedback('Wrong Tray!', 'fail');
                    showReactionGif('fail');
                    createFloatingText(c.x, c.y, 'Wrong!', '#FF0000');
                    shakeAmount = 6;
                }
                return;
            }
        }
    }

    for(let ing of ingredients) {
        const dist = Math.hypot(cursor.x - ing.x, cursor.y - ing.y);
        if(dist < ing.w/1.8) {
            cursor.holding = ing;
            playSfx('sfx_pickup');
            showFeedback('Picked Up', 'serve');
            vibrate('light');
            createParticles(ing.x, ing.y, ing.color, 8);
            return;
        }
    }
}

// --- LOGIC ---
function update(dt) {
    if(gameState !== 'PLAYING') return;

    if(shakeAmount > 0) shakeAmount = Math.max(0, shakeAmount - dt * 20);

    if(joystick.active || (joystick.dx !== 0 || joystick.dy !== 0)) {
        const speed = gameConfig.cursorSpeed * dt;
        cursor.x += joystick.dx * speed;
        cursor.y += joystick.dy * speed;
        cursor.x = Math.max(0, Math.min(cw, cursor.x));
        cursor.y = Math.max(0, Math.min(ch, cursor.y));
    }

    timeAccumulator += dt;
    if(timeAccumulator > gameConfig.spawnRate) {
        spawnCustomer();
        timeAccumulator = 0;
    }

    customers.forEach(c => {
        c.animTime += dt;
        if(c.spawnAnim < 1) c.spawnAnim = Math.min(1, c.spawnAnim + dt * 5);
    });
    
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.alpha = p.life / p.maxLife;
    });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(t => {
        t.y -= 40 * dt;
        t.life -= dt;
    });
    floatingTexts = floatingTexts.filter(t => t.life > 0);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 300 + 100;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 0.6,
            maxLife: 0.6,
            size: Math.random() * 8 + 3
        });
    }
}

function createFloatingText(x, y, text, color='#FFF') {
    floatingTexts.push({ x, y, text, color, life: 1.0 });
}

// --- DRAWING ---
function draw() {
    let sx = 0, sy = 0;
    if(shakeAmount > 0) {
        sx = (Math.random() - 0.5) * shakeAmount;
        sy = (Math.random() - 0.5) * shakeAmount;
    }

    ctx.save();
    ctx.translate(sx, sy);

    // Background
    ctx.fillStyle = '#212121';
    ctx.fillRect(0, 0, cw, ch);

    // Floor Tiles
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    const tileSize = cw / 6;
    ctx.beginPath();
    for(let x=0; x<cw; x+=tileSize) { ctx.moveTo(x,0); ctx.lineTo(x,ch); }
    for(let y=0; y<ch; y+=tileSize) { ctx.moveTo(0,y); ctx.lineTo(cw,y); }
    ctx.stroke();

    // Customer Counter (Visual Divider)
    const counterY = ch * LAYOUT.counterY;
    ctx.fillStyle = '#37474F';
    ctx.fillRect(0, counterY, cw, ch - counterY);
    ctx.fillStyle = '#455A64';
    ctx.fillRect(0, counterY, cw, 16);

    // Placemats
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    const placematY = counterY + cw * 0.12;
    ctx.beginPath();
    ctx.ellipse(cw * 0.35, placematY, cw * 0.18, cw * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cw * 0.65, placematY, cw * 0.18, cw * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ingredients
    ingredients.forEach(ing => {
        drawIngredient(ing.x, ing.y, ing.w, ing.h, ing);
    });

    // Customers
    customers.forEach(c => {
        drawCustomer(c);
    });

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Floating Text
    ctx.font = '700 30px Bangers';
    ctx.textAlign = 'center';
    floatingTexts.forEach(t => {
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillStyle = t.color;
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 5;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
    });

    drawControls();
    drawCursor();

    ctx.restore();
}

function drawIngredient(x, y, w, h, type, noLabel = false) {
    ctx.save();
    ctx.translate(x, y);
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, h/2.5, w/2.5, h/8, 0, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = type.color;
    if(type.shape === 'can') {
        ctx.fillRect(-w/4, -h/3, w/2, h/1.5);
        ctx.fillStyle = '#EEE'; 
        ctx.fillRect(-w/4, -h/3, w/2, 6);
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(0, 0, w/6, 0, Math.PI*2); ctx.fill();
    } else if(type.shape === 'bowl') {
        ctx.beginPath();
        ctx.arc(0, 0, w/2.5, 0, Math.PI, false);
        ctx.fill();
        ctx.fillStyle = '#FFF'; 
        ctx.beginPath(); ctx.ellipse(0, 0, w/2.5, h/8, 0, 0, Math.PI*2); ctx.fill();
    } else if(type.shape === 'bottle') {
        ctx.fillRect(-w/6, -h/3, w/3, h/1.5);
        ctx.fillStyle = '#FFF'; 
        ctx.fillRect(-w/6, -h/6, w/3, h/3);
    } else {
        ctx.fillRect(-w/2.5, -h/4, w/0.8, h/2);
    }
    
    if(!noLabel) {
        ctx.fillStyle = '#F4F2FF';
        ctx.font = '600 13px Rajdhani';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 4;
        ctx.fillText(type.label, 0, h/2 + 20);
    }

    ctx.restore();
}

function drawCustomer(c) {
    const x = c.x;
    const y = c.y;
    const size = cw * 0.11;

    ctx.save();
    ctx.translate(x, y);

    const scale = c.spawnAnim || 1;
    ctx.scale(scale, scale);

    const bobHead = Math.sin(c.animTime * 3.4) * (size * 0.04);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(0, size * 1.12, size * 0.92, size * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(0, bobHead);

    ctx.fillStyle = c.outfit || '#46d6ff';
    ctx.beginPath();
    ctx.roundRect?.(-size * 0.72, size * 0.38, size * 1.44, size * 0.95, size * 0.3);
    if (!ctx.roundRect) ctx.rect(-size * 0.72, size * 0.38, size * 1.44, size * 0.95);
    ctx.fill();

    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = Math.max(2, size * 0.08);
    ctx.beginPath();
    ctx.arc(-size * 0.22, -size * 0.2, size * 0.28, Math.PI * 1.15, Math.PI * 1.9);
    ctx.stroke();

    if(c.hat) {
        ctx.fillStyle = c.hat;
        ctx.fillRect(-size, -size*1.18, size*2, size*0.34);
        ctx.fillRect(-size * 0.88, -size*1.18, size*1.16, size*0.8);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-size * 0.82, -size * 1.1, size * 0.5, size * 0.14);
    }

    if(c.hair) {
        ctx.fillStyle = c.hair;
        ctx.beginPath();
        ctx.arc(0, -size * 0.3, size * 0.96, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = '#140e28';
    ctx.beginPath(); ctx.arc(-size/3, -size/6, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size/3, -size/6, 5, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = '#140e28';
    ctx.lineWidth = Math.max(2, size * 0.06);
    ctx.beginPath();
    ctx.arc(0, size * 0.08, size * 0.24, 0.15, Math.PI - 0.15);
    ctx.stroke();

    ctx.fillStyle = c.mood || '#85f3ff';
    ctx.beginPath();
    ctx.arc(size * 0.74, -size * 0.72, size * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = c.mood || '#85f3ff';
    ctx.shadowBlur = 12;
    ctx.fillRect(size * 0.5, -size * 0.8, size * 0.3, size * 0.08);
    ctx.shadowBlur = 0;

    // SPEECH BUBBLE
    ctx.translate(0, -size * 1.42 - 10);
    const bob = Math.sin(c.animTime * 4) * 6;
    ctx.translate(0, bob);

    ctx.fillStyle = 'rgba(250, 248, 255, 0.96)';
    ctx.strokeStyle = 'rgba(133, 243, 255, 0.45)';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(0,0,0,0.24)';
    ctx.shadowBlur = 10;

    ctx.beginPath();
    if(ctx.roundRect) {
        ctx.roundRect(-52, -62, 104, 54, 14);
    } else {
        ctx.rect(-52, -62, 104, 54);
    }

    ctx.moveTo(0, -8);
    ctx.lineTo(-8, 2);
    ctx.lineTo(8, 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    if(c.wantObj) {
        drawIngredient(0, -37, 35, 35, c.wantObj, true);
    }

    ctx.restore();
}

function drawCursor() {
    ctx.save();
    ctx.translate(cursor.x, cursor.y);

    ctx.shadowColor = 'rgba(82, 168, 255, 0.28)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#fdfcff';
    ctx.strokeStyle = '#20133b';
    ctx.lineWidth = 3;

    ctx.scale(1.3, 1.3);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(10, 28);
    ctx.lineTo(0, 24);
    ctx.lineTo(-10, 28);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ff5fd2';
    ctx.beginPath();
    ctx.arc(0, 17, 3.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if(cursor.holding) {
        ctx.translate(15, 15);
        ctx.scale(0.8, 0.8);
        drawIngredient(0, 0, 45, 45, cursor.holding, true);
    }

    ctx.restore();
}

function drawControls() {
    const joyCenterX = cw * 0.25;
    const joyCenterY = ch * 0.82;
    const joyRadius = cw * 0.18;
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(joyCenterX, joyCenterY, joyRadius, 0, Math.PI*2);
    const joyGlow = ctx.createRadialGradient(joyCenterX, joyCenterY, joyRadius * 0.1, joyCenterX, joyCenterY, joyRadius);
    joyGlow.addColorStop(0, 'rgba(133, 243, 255, 0.16)');
    joyGlow.addColorStop(1, 'rgba(133, 243, 255, 0.02)');
    ctx.fillStyle = joyGlow;
    ctx.fill();
    ctx.strokeStyle = 'rgba(133,243,255,0.26)';
    ctx.lineWidth = 6;
    ctx.stroke();
    
    let stickX = joyCenterX;
    let stickY = joyCenterY;
    if(joystick.active) {
        stickX += joystick.dx * joyRadius * 0.5;
        stickY += joystick.dy * joyRadius * 0.5;
    }
    ctx.beginPath();
    ctx.arc(stickX, stickY, joyRadius * 0.4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,95,210,0.35)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();

    const btnCenterX = cw * 0.75;
    const btnCenterY = ch * 0.82;
    const btnRadius = cw * 0.14;
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(btnCenterX, btnCenterY, btnRadius, 0, Math.PI*2);
    const actionGlow = ctx.createRadialGradient(btnCenterX, btnCenterY, btnRadius * 0.1, btnCenterX, btnCenterY, btnRadius);
    actionGlow.addColorStop(0, actionBtn.pressed ? 'rgba(255, 226, 119, 0.95)' : 'rgba(255, 95, 210, 0.32)');
    actionGlow.addColorStop(1, actionBtn.pressed ? 'rgba(255, 95, 210, 0.85)' : 'rgba(82, 168, 255, 0.16)');
    ctx.fillStyle = actionGlow;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.fillStyle = '#FFF';
    ctx.font = '400 18px Bangers';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('SERVE', btnCenterX, btnCenterY);
    ctx.restore();
}

function loop(timestamp) {
    if(!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch(e) {
        console.error(e);
    }
    
    requestAnimationFrame(loop);
}

// --- INITIALIZATION ---
const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    const { width, height } = entry.contentRect;
    
    if (width === 0 || height === 0) return;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    
    cw = width;
    ch = height;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if(!initialized) {
        initGame();
        initAudio();
    } else {
        // Re-layout on resize
        layoutIngredients();
        cursor.x = Math.min(cw, cursor.x);
        cursor.y = Math.min(ch, cursor.y);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
    
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGlobalInput, { passive: false });
    window.addEventListener('pointerup', handleGlobalInput, { passive: false });
    window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        restartGame();
        handleGlobalInput(e);
    });
});
</script>
