<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hype Loop Infinite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08111f;
            --bg-deep: #050913;
            --panel: rgba(8, 17, 31, 0.72);
            --panel-strong: rgba(17, 29, 51, 0.92);
            --accent: #6af7d6;
            --accent-soft: rgba(106, 247, 214, 0.14);
            --accent-hot: #46c7ff;
            --gold: #ffd166;
            --text: #f8fbff;
            --muted: rgba(220, 243, 255, 0.82);
            --subtle: #b7c7df;
            --border: rgba(129, 219, 255, 0.22);
            --danger: #ff5d8f;
            --glow: 0 0 30px rgba(70, 199, 255, 0.2);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text);
        }

        body {
            position: relative;
            background:
                radial-gradient(circle at top, rgba(70, 199, 255, 0.14), transparent 32%),
                radial-gradient(circle at bottom, rgba(106, 247, 214, 0.12), transparent 38%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        }
        canvas { display: block; touch-action: none; }

        .glass {
            background: linear-gradient(180deg, rgba(14, 24, 41, 0.9), rgba(9, 16, 29, 0.76));
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            box-shadow: var(--glow);
        }

        .btn-press:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }

        #hud-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .display-font {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #score-display {
            margin: 0;
            font-size: clamp(2.8rem, 10vw, 4.8rem);
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 18px rgba(106, 247, 214, 0.4), 0 4px 10px rgba(0,0,0,0.8);
            filter: drop-shadow(0 0 10px rgba(70, 199, 255, 0.15));
        }

        #cps-display {
            margin: 0.35rem 0 0;
            font-size: 0.95rem;
            color: var(--muted);
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #click-zone {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #main-btn {
            width: min(48vw, 12rem);
            height: min(48vw, 12rem);
            min-width: 9.5rem;
            min-height: 9.5rem;
            border-radius: 34% 34% 42% 42%;
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 18%, transparent 20%),
                radial-gradient(circle at 68% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 18%, transparent 20%),
                linear-gradient(180deg, #7af8da 0%, #46c7ff 50%, #2a7dff 100%);
            box-shadow: 0 0 50px rgba(70, 199, 255, 0.3), inset 0 -12px 24px rgba(7, 26, 54, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3.5rem, 9vw, 4.5rem);
            cursor: pointer;
            border: 4px solid rgba(214, 251, 255, 0.9);
            position: relative;
            overflow: hidden;
            pointer-events: auto;
            transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
        }

        #main-btn::before,
        #main-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #main-btn::before {
            inset: 18% 16% auto;
            height: 32%;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 34%, #071321 0 8%, transparent 9%),
                radial-gradient(circle at 65% 34%, #071321 0 8%, transparent 9%),
                radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.95), rgba(255,255,255,0) 38%);
            opacity: 0.92;
        }

        #main-btn::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.22), transparent 48%),
                radial-gradient(circle at 50% 120%, rgba(255,255,255,0.22), transparent 36%);
            opacity: 0.9;
        }

        #main-btn:hover::after {
            opacity: 1;
            transform: translateY(-2px);
        }

        #main-btn:hover {
            filter: saturate(1.08) brightness(1.03);
            box-shadow: 0 0 55px rgba(70, 199, 255, 0.45), inset 0 -12px 24px rgba(7, 26, 54, 0.35);
        }

        #upgrades {
            z-index: 30;
            pointer-events: auto;
            width: 100%;
            max-width: 32rem;
            margin: 0 auto 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .upgrade-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            color: var(--text);
            cursor: pointer;
            background: linear-gradient(180deg, rgba(16, 28, 49, 0.92), rgba(9, 18, 33, 0.88));
            transition: background-color 0.2s ease, transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        }

        .upgrade-btn:hover {
            background-color: rgba(255,255,255,0.1);
            box-shadow: 0 14px 28px rgba(0,0,0,0.24);
        }
        .upgrade-left { display: flex; align-items: center; gap: 0.75rem; }
        .upgrade-icon { font-size: 2rem; }
        .upgrade-copy, .upgrade-price { text-align: left; }
        .upgrade-price { text-align: right; }
        .label-strong { font-weight: 700; color: #a6fff0; }
        .label-meta { font-size: 0.82rem; color: var(--subtle); }
        .label-cost { font-weight: 700; color: var(--gold); }
        .label-buy { font-size: 0.78rem; color: #9db3d0; letter-spacing: 0.12em; }

        #start-screen,
        #meme-modal {
            position: absolute;
            inset: 0;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }

        #start-screen {
            z-index: 50;
            background:
                radial-gradient(circle at top, rgba(70, 199, 255, 0.22), transparent 38%),
                linear-gradient(180deg, rgba(8, 17, 31, 0.82), rgba(5, 9, 19, 0.94));
        }
        #meme-modal {
            z-index: 40;
            background: rgba(0,0,0,0.8);
        }

        .hero-title,
        .modal-title {
            margin: 0;
            color: var(--accent);
            text-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 20px rgba(70, 199, 255, 0.24);
        }

        .hero-title {
            font-size: clamp(3rem, 13vw, 5.4rem);
            margin-bottom: 0.35rem;
        }

        .hero-copy {
            font-size: clamp(1.05rem, 4vw, 1.4rem);
            margin: 0 0 2rem;
            color: #dfeefe;
            max-width: 28rem;
            line-height: 1.45;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            border-radius: 999px;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hot) 100%);
            color: #04131b;
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            box-shadow: 0 0 30px rgba(70, 199, 255, 0.42);
            animation: pulse 1.8s infinite;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #a9fff4 0%, #6fdcff 100%);
            transform: scale(1.05);
        }

        .modal-title {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            color: var(--gold);
            margin-bottom: 1rem;
            animation: bounce 1.5s infinite;
        }

        .meme-frame {
            position: relative;
            padding: 0.5rem;
            background: linear-gradient(45deg, var(--gold), var(--accent-hot), var(--accent));
            border-radius: 0.75rem;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 0 28px rgba(255, 209, 102, 0.28);
        }

        #meme-display {
            display: block;
            max-width: 100%;
            max-height: 60vh;
            border-radius: 0.35rem;
            border: 4px solid #000;
        }

        .modal-copy {
            margin: 1.5rem 0 0;
            color: #d1d5db;
            font-size: 1.1rem;
        }

        .secondary-btn {
            margin-top: 2rem;
            padding: 0.9rem 2rem;
            background: #f8fbff;
            color: #071321;
            font-size: 1rem;
            box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        }

        .secondary-btn:hover { background: #dff6ff; }

        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 14px rgba(255, 209, 102, 0.34);
            font-size: 1.9rem;
            color: #fde047;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: clamp(5rem, 20vw, 8rem);
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow: 0 14px 28px rgba(0,0,0,0.25);
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(0.5rem) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            z-index: 25;
        }

        #combo-gif {
            top: 6rem;
        }

        #upgrade-gif {
            bottom: 8.5rem;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translateY(0); }
            40%, 43% { transform: translateY(-12px); }
            70% { transform: translateY(-6px); }
            90% { transform: translateY(-2px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 24px rgba(74,222,128,0.45); }
            50% { box-shadow: 0 0 42px rgba(74,222,128,0.75); }
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 1rem; }
            #upgrades { margin-bottom: 0.5rem; }
            .upgrade-btn { padding: 0.9rem; }
            .upgrade-icon { font-size: 1.7rem; }
            .label-strong { font-size: 1rem; }
            .label-meta, .label-buy { font-size: 0.75rem; }
            .modal-copy { font-size: 1rem; }
            .feedback-gif {
                width: 4.8rem;
                right: 0.75rem;
            }
            #combo-gif {
                top: 5.25rem;
            }
            #upgrade-gif {
                bottom: 9.5rem;
            }
            #main-btn {
                min-width: 9rem;
                min-height: 9rem;
            }
        }
    </style>
</head>

    <!-- [agent-note][stage3] resolved-gif: combo + milestone reactions -> catalogs/gifs.json -->

    <script>
    // §3 Editable Protocol
    window.gameConfigDefs = {
        "clickBase": { "type": "number", "label": "Base Click Value", "value": 1, "min": 1, "max": 100 },
        "themeColor": { "type": "color", "label": "Accent Color", "value": "#4ade80" },
        "gameTitle": { "type": "text", "label": "Game Title", "value": "Hype Loop" }
    };

    window.gameConfig = {
        clickBase: 1,
        themeColor: "#4ade80",
        gameTitle: "Hype Loop"
    };

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') document.getElementById('score-display').style.color = val;
            if (key === 'gameTitle') document.title = `${val} Infinite`;
        }
    };

    // §2 Technical Contract: Audio Manager
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {};
                this.unlocked = false;
                this.lastPlayedAt = {};
                this.soundGains = {
                    bgm_main: 0.2,
                    sfx_coin: 0.55,
                    sfx_upgrade: 0.55,
                    sfx_blocked: 0.45,
                    sfx_start: 0.5,
                    sfx_hype: 0.65
                };
            }

            async loadSound(id, src) {
                try {
                    const res = await fetch(src, { mode: 'cors' });
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn(`Audio load failed for ${id}:`, e);
                    this.buffers[id] = 'error';
                }
            }

            async preload(ids) {
                await Promise.all(ids.map(({ id, src }) => this.loadSound(id, src)));
            }

            async unlock() {
                if (!this.unlocked) {
                    try {
                        await this.ctx.resume();
                    } catch (e) {
                        console.warn('Audio context resume failed', e);
                    }
                    this.unlocked = this.ctx.state === 'running';
                }

                if (this.unlocked) {
                    const bgmEl = document.getElementById('bgm_main');
                    if (bgmEl) {
                        bgmEl.volume = this.soundGains.bgm_main;
                        bgmEl.play().catch(e => console.log('BGM autoplay blocked', e));
                    }
                }
            }

            playSfx(id, fallbackType = 'beep', cooldown = 0) {
                if (!this.unlocked || this.ctx.state !== 'running') return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
                this.lastPlayedAt[id] = now;

                if (this.buffers[id] && this.buffers[id] !== 'error') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = this.buffers[id];
                    gain.gain.value = this.soundGains[id] ?? 0.45;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                    return;
                }

                const mediaEl = document.getElementById(id);
                if (mediaEl instanceof HTMLMediaElement) {
                    const sfxEl = mediaEl.cloneNode(true);
                    sfxEl.volume = this.soundGains[id] ?? 0.45;
                    sfxEl.loop = false;
                    sfxEl.currentTime = 0;
                    sfxEl.play().catch(() => this.synthesize(fallbackType));
                    sfxEl.addEventListener('ended', () => sfxEl.remove(), { once: true });
                    document.body.appendChild(sfxEl);
                    return;
                }

                this.synthesize(fallbackType);
            }

            pauseLoop() {
                const bgmEl = document.getElementById('bgm_main');
                if (bgmEl) bgmEl.pause();
            }

            resumeLoop() {
                const bgmEl = document.getElementById('bgm_main');
                if (bgmEl && this.unlocked) {
                    bgmEl.volume = this.soundGains.bgm_main;
                    bgmEl.play().catch(() => {});
                }
            }

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(2000, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } else if (type === 'upgrade') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.4);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(240, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                }
            }
        }

    // Game Logic
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioSys = new AudioManager();

        // Game State
        let state = {
            money: 0,
            clickValue: window.gameConfig.clickBase,
            autoRate: 0,
            clickCost: 15,
            autoCost: 50,
            memeUnlocked: false,
            lastTime: 0
        };

        // DOM Elements
        const elScore = document.getElementById('score-display');
        const elCps = document.getElementById('cps-display');
        const elClickBtn = document.getElementById('main-btn');
        const elStartScreen = document.getElementById('start-screen');
        const elMemeModal = document.getElementById('meme-modal');
        const elMemeImg = document.getElementById('meme-display');
        const elComboGif = document.getElementById('combo-gif');
        const elUpgradeGif = document.getElementById('upgrade-gif');

        // Upgrade UI
        const elValClick = document.getElementById('val-click');
        const elCostClick = document.getElementById('cost-click');
        const elValAuto = document.getElementById('val-auto');
        const elCostAuto = document.getElementById('cost-auto');
        const btnUpClick = document.getElementById('btn-upgrade-click');
        const btnUpAuto = document.getElementById('btn-upgrade-auto');

        // Particles
        const particles = [];
        let comboTimer = null;
        let upgradeTimer = null;

        // Resize Handling
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle System
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = -Math.random() * 10 - 5;
                this.gravity = 0.5;
                this.rot = Math.random() * Math.PI;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
                this.life = 1.0;
                this.color = type === 'coin' ? '#fbbf24' : '#86efac';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rot += this.rotSpeed;
                this.life -= 0.015;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.globalAlpha = Math.max(0, this.life);
                if (this.type === 'coin') {
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-10, -5, 20, 10);
                }
                ctx.restore();
            }
        }

        function spawnParticles(x, y, count, type) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, type));
            }
        }

        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerText = text;
            document.getElementById('game-container').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function flashFeedback(el, src, timerKey) {
            if (!el || !src) return;
            el.src = src;
            el.classList.add('is-visible');
            clearTimeout(timerKey === 'combo' ? comboTimer : upgradeTimer);
            const hideTimer = setTimeout(() => el.classList.remove('is-visible'), 1400);
            if (timerKey === 'combo') comboTimer = hideTimer;
            if (timerKey === 'upgrade') upgradeTimer = hideTimer;
        }

        // Core Functions
        function addMoney(amount, x, y, isAuto = false) {
            state.money += amount;
            updateUI();

            if (!isAuto) {
                spawnParticles(x, y, Math.min(5, Math.ceil(amount / 5)) + 2, amount > 10 ? 'bill' : 'coin');
                spawnFloatingText(x, y, `+$${Math.floor(amount)}`);
                audioSys.playSfx('sfx_coin', 'coin', 70);

                if (state.money > 0 && Math.floor(state.money) % 25 === 0) {
                    flashFeedback(elComboGif, document.getElementById('asset_combo').src, 'combo');
                    audioSys.playSfx('sfx_hype', 'upgrade', 300);
                }
            }

            // Milestone Check
            if (state.money >= 100 && !state.memeUnlocked) {
                triggerMeme();
            }
        }

        function triggerMeme() {
            state.memeUnlocked = true;
            const imgAsset = document.getElementById('asset_meme');
            if (imgAsset && imgAsset.src) {
                elMemeImg.src = imgAsset.src;
                elMemeModal.classList.remove('hidden');
                flashFeedback(elUpgradeGif, document.getElementById('asset_upgrade').src, 'upgrade');
                audioSys.playSfx('sfx_hype', 'upgrade', 0);
                audioSys.pauseLoop();
            }
        }

        function updateUI() {
            elScore.innerText = `$${Math.floor(state.money)}`;
            elCps.innerText = `+$${state.autoRate.toFixed(1)} / sec`;

            const canAffordClick = state.money >= state.clickCost;
            btnUpClick.style.opacity = canAffordClick ? 1 : 0.5;
            btnUpClick.style.borderColor = canAffordClick ? '#fbbf24' : 'transparent';

            const canAffordAuto = state.money >= state.autoCost;
            btnUpAuto.style.opacity = canAffordAuto ? 1 : 0.5;
            btnUpAuto.style.borderColor = canAffordAuto ? '#fbbf24' : 'transparent';
        }

        // Input Handling
        elClickBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = elClickBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const spawnX = centerX + (Math.random() - 0.5) * 50;
            const spawnY = centerY + (Math.random() - 0.5) * 50;

            addMoney(state.clickValue, spawnX, spawnY);

            elClickBtn.style.transform = 'scale(0.9)';
            setTimeout(() => elClickBtn.style.transform = 'scale(1)', 50);
        });

        btnUpClick.addEventListener('click', () => {
            if (state.money >= state.clickCost) {
                state.money -= state.clickCost;
                state.clickValue += 1;
                state.clickCost = Math.floor(state.clickCost * 1.5);

                elValClick.innerText = state.clickValue;
                elCostClick.innerText = state.clickCost;
                flashFeedback(elUpgradeGif, document.getElementById('asset_upgrade').src, 'upgrade');
                audioSys.playSfx('sfx_upgrade', 'upgrade', 120);
                updateUI();
            } else {
                audioSys.playSfx('sfx_blocked', 'beep', 180);
            }
        });

        btnUpAuto.addEventListener('click', () => {
            if (state.money >= state.autoCost) {
                state.money -= state.autoCost;
                state.autoRate += 2;
                state.autoCost = Math.floor(state.autoCost * 1.4);

                elValAuto.innerText = state.autoRate;
                elCostAuto.innerText = state.autoCost;
                flashFeedback(elUpgradeGif, document.getElementById('asset_upgrade').src, 'upgrade');
                audioSys.playSfx('sfx_upgrade', 'upgrade', 120);
                updateUI();
            } else {
                audioSys.playSfx('sfx_blocked', 'beep', 180);
            }
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            await audioSys.unlock();

            await audioSys.preload([
                { id: 'sfx_coin', src: document.getElementById('sfx_coin').src },
                { id: 'sfx_upgrade', src: document.getElementById('sfx_upgrade').src },
                { id: 'sfx_blocked', src: document.getElementById('sfx_blocked').src },
                { id: 'sfx_start', src: document.getElementById('sfx_start').src },
                { id: 'sfx_hype', src: document.getElementById('sfx_hype').src }
            ]);

            audioSys.playSfx('sfx_start', 'upgrade', 0);
            elStartScreen.classList.add('hidden');
            requestAnimationFrame(gameLoop);
        });

        document.getElementById('close-meme').addEventListener('click', () => {
            elMemeModal.classList.add('hidden');
            audioSys.resumeLoop();
        });

        let autoAccumulator = 0;

        function gameLoop(timestamp) {
            const dt = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;

            if (state.autoRate > 0) {
                autoAccumulator += state.autoRate * dt;
                if (autoAccumulator >= 1) {
                    const gain = Math.floor(autoAccumulator);
                    state.money += gain;
                    autoAccumulator -= gain;
                    updateUI();
                }
            }

            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#0a1630');
            skyGradient.addColorStop(0.52, '#08111f');
            skyGradient.addColorStop(1, '#050913');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width * 0.5, height * 0.32, 20, width * 0.5, height * 0.32, Math.max(width, height) * 0.42);
            halo.addColorStop(0, 'rgba(70, 199, 255, 0.16)');
            halo.addColorStop(1, 'rgba(70, 199, 255, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(106, 247, 214, 0.07)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            const offset = (timestamp * 0.02) % gridSize;

            ctx.beginPath();
            for (let x = 0; x < width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = offset; y < height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 209, 102, 0.08)';
            ctx.beginPath();
            for (let i = -1; i < 3; i++) {
                const waveY = height * (0.68 + i * 0.09);
                ctx.moveTo(0, waveY);
                for (let x = 0; x <= width; x += 24) {
                    ctx.lineTo(x, waveY + Math.sin((x + timestamp * 0.08) / 42) * 8);
                }
            }
            ctx.stroke();

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
    });
    </script>
</body>
</html>
