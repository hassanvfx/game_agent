<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Arcane Survivor: 60 Seconds</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --font-ui: 'Exo 2', system-ui, sans-serif;
            --font-title: 'Cinzel', Georgia, serif;
            --font-hud: 'Press Start 2P', 'Courier New', monospace;
            --bg-top: #080b1c;
            --bg-bottom: #140f28;
            --panel: rgba(11, 16, 34, 0.72);
            --panel-border: rgba(146, 229, 255, 0.42);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --aura-cyan: #80f2ff;
            --aura-gold: #ffe082;
            --aura-magenta: #ff72c8;
            --hazard: #ff5a7b;
            --text-main: #f7f5ff;
            --text-muted: #aab4d6;
        }

        /* Mobile Optimization & Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 22%, rgba(128, 242, 255, 0.16), transparent 26%),
                radial-gradient(circle at 20% 85%, rgba(255, 114, 200, 0.12), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-ui);
            color: var(--text-main);
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            background:
                linear-gradient(rgba(128, 242, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 242, 255, 0.06) 1px, transparent 1px);
            background-size: 54px 54px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.78), transparent 92%);
            opacity: 0.55;
        }
        body::after {
            background:
                radial-gradient(circle at 30% 28%, rgba(255, 224, 130, 0.2), transparent 8%),
                radial-gradient(circle at 70% 16%, rgba(128, 242, 255, 0.16), transparent 7%),
                radial-gradient(circle at 78% 76%, rgba(255, 114, 200, 0.14), transparent 9%);
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            touch-action: none; /* [agent-note][stage4] keep gesture suppression on gameplay surface only so menu buttons still tap on mobile */
        }

        button,
        .ui-button {
            touch-action: manipulation;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }
        .hud {
            padding: 14px 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-shadow: 0 2px 8px rgba(0,0,0,0.85);
        }
        .hud-cluster {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 28px var(--panel-shadow), inset 0 0 18px rgba(128, 242, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 10px 12px;
        }
        .center-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            z-index: 10;
            max-width: min(92vw, 420px);
            max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 24px);
            overflow-y: auto;
            padding-top: max(env(safe-area-inset-top, 0px), 8px);
            padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
        }
        .screen-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(10, 16, 35, 0.92), rgba(20, 14, 41, 0.9));
            border: 1px solid rgba(128, 242, 255, 0.34);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 0 28px rgba(128, 242, 255, 0.08);
            border-radius: 28px;
            padding: 24px 20px 22px;
        }
        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(255, 224, 130, 0.18), transparent 34%),
                linear-gradient(135deg, rgba(128, 242, 255, 0.14), transparent 55%);
            pointer-events: none;
        }
        .screen-card > * {
            position: relative;
            z-index: 1;
        }
        .title-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.4rem;
            height: 3.4rem;
            margin-bottom: 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(128, 242, 255, 0.5);
            background: radial-gradient(circle at 35% 35%, rgba(255, 224, 130, 0.95), rgba(255, 114, 200, 0.6) 55%, rgba(128, 242, 255, 0.25));
            box-shadow: 0 0 24px rgba(128, 242, 255, 0.28);
            font-size: 1.85rem;
        }
        .spell-line {
            display: inline-block;
            padding: 0.28rem 0.85rem;
            border-radius: 999px;
            background: rgba(128, 242, 255, 0.1);
            border: 1px solid rgba(128, 242, 255, 0.24);
            color: var(--aura-cyan);
            font-size: 0.82rem;
            letter-spacing: 0.22em;
        }
        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(0.97); }
        }
        .btn-start {
            background: linear-gradient(135deg, #ff5a7b, #8e2de2);
            border: 2px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 10px 25px rgba(0,0,0,0.45), 0 0 24px rgba(255, 114, 200, 0.34);
            animation: pulse 2s infinite;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-1 { gap: 0.25rem; }
        .w-full { width: 100%; }
        .w-32 { width: 8rem; }
        .h-4 { height: 1rem; }
        .h-full { height: 100%; }
        .overflow-hidden { overflow: hidden; }
        .relative { position: relative; }
        .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; border-style: solid; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-gray-600 { border-color: #4b5563; }
        .border-gray-300 { border-color: #d1d5db; }
        .bg-gray-800 { background-color: #1f2937; }
        .bg-red-500 { background-color: #ef4444; }
        .bg-white { background-color: #ffffff; }
        .text-white { color: #ffffff; }
        .text-gray-900 { color: #111827; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-yellow-400 { color: #facc15; }
        .text-red-500 { color: #ef4444; }
        .text-red-600 { color: #dc2626; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .font-mono { font-family: var(--font-hud); }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-tighter { letter-spacing: -0.04em; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .uppercase { text-transform: uppercase; }
        .cursor-pointer { cursor: pointer; }
        .drop-shadow-lg { filter: drop-shadow(0 10px 8px rgba(0,0,0,0.35)); }
        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4), 0 8px 10px -6px rgba(0,0,0,0.4); }
        .transition-all { transition: all 0.2s ease; }
        .transition-transform { transition: transform 0.15s ease; }

        .ui-title,
        #go-title {
            font-family: var(--font-title);
        }

        .ui-copy,
        .ui-button,
        .hud-label {
            font-family: var(--font-ui);
        }

        .hud-label,
        #timer {
            text-transform: uppercase;
        }

        .ui-copy {
            color: var(--text-muted);
        }

        .ui-button {
            letter-spacing: 0.16em;
        }

        .glow-text {
            text-shadow: 0 0 18px rgba(128, 242, 255, 0.3), 0 6px 18px rgba(0, 0, 0, 0.38);
        }

        .hud-value {
            text-shadow: 0 0 18px rgba(255, 224, 130, 0.28);
        }

        .status-copy {
            max-width: 22rem;
            margin-inline: auto;
        }

        .feedback-gif-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(80px, 18vw, 126px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(128, 242, 255, 0.45);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
            background: rgba(12, 15, 34, 0.45);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 0.2s ease, transform 0.2s ease;
            mix-blend-mode: screen;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: scale(1);
        }

        .feedback-gif--hit {
            left: 12px;
            bottom: 108px;
        }

        .feedback-gif--result {
            right: 12px;
            top: 96px;
        }

        @media (max-width: 640px) {
            .hud {
                padding: max(env(safe-area-inset-top, 0px), 10px) 10px 0;
                gap: 8px;
            }

            .hud-cluster {
                padding: 8px 10px;
                border-radius: 14px;
            }

            .screen-card {
                padding: 20px 16px 18px;
                border-radius: 22px;
            }

            .feedback-gif--hit {
                left: 8px;
                bottom: 132px;
            }

            .feedback-gif--result {
                right: 8px;
                top: 84px;
            }

            .title-mark {
                width: 3rem;
                height: 3rem;
                font-size: 1.55rem;
            }

            .text-5xl {
                font-size: 2.2rem;
                line-height: 0.95;
            }

            .text-4xl {
                font-size: 2rem;
                line-height: 1;
            }

            .text-2xl {
                font-size: 1.3rem;
                line-height: 1.7rem;
            }

            .text-xl {
                font-size: 1.1rem;
                line-height: 1.55rem;
            }

            .text-lg {
                font-size: 1rem;
                line-height: 1.45rem;
            }

            .px-10 {
                padding-left: 1.65rem;
                padding-right: 1.65rem;
            }

            .py-4 {
                padding-top: 0.8rem;
                padding-bottom: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <!-- [agent-note][stage3] resolved-gif: combat-hit + end-state overlays -> catalogs/gifs.json -->
        <div class="feedback-gif-layer" aria-hidden="true">
            <img
                id="hit-gif"
                class="feedback-gif feedback-gif--hit"
                alt=""
                src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp"
            />
            <img
                id="result-gif"
                class="feedback-gif feedback-gif--result"
                alt=""
                src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            />
        </div>
        <!-- HUD -->
        <div id="hud" class="hud hidden">
            <div class="flex flex-col gap-1 hud-cluster">
                <div class="w-32 h-4 bg-gray-800 rounded-full border border-gray-600 overflow-hidden relative">
                    <div id="hp-bar" class="h-full bg-red-500 transition-all" style="width: 100%;"></div>
                </div>
                <span class="text-white text-xs font-bold tracking-wider hud-label">WARD</span>
            </div>
            <div class="text-right hud-cluster">
                <div id="timer" class="text-4xl font-black text-yellow-400 font-mono">60</div>
                <div class="text-white text-xs font-bold tracking-wider hud-label">HOLD</div>
            </div>
        </div>

        <!-- Screens -->
        <div id="start-screen" class="center-screen w-full px-4">
            <div class="screen-card">
                <div class="title-mark" aria-hidden="true">🪄</div>
                <div class="spell-line mb-2">AETHER WARD</div>
                <h1 class="ui-title glow-text text-5xl font-black text-white mb-2 drop-shadow-lg tracking-tighter">ARCANE<br><span class="text-red-500">SURVIVOR</span></h1>
                <p class="ui-copy status-copy mb-8 text-lg font-medium">Hold the breach for 60 seconds.<br>Drag to move. Auto-strike nearby fiends.</p>
                <button id="btn-play" class="ui-button btn-start px-10 py-4 text-2xl font-bold text-white rounded-full uppercase tracking-widest cursor-pointer transition-transform">
                    ENTER
                </button>
            </div>
        </div>

        <div id="game-over-screen" class="center-screen hidden w-full px-4">
            <div class="screen-card">
                <div class="title-mark" aria-hidden="true">💥</div>
                <h1 id="go-title" class="ui-title glow-text text-5xl font-black text-white mb-2 drop-shadow-lg">RITUAL BROKEN</h1>
                <p id="go-msg" class="ui-copy status-copy text-gray-300 mb-8 text-xl">The fiends broke through your ward.</p>
                <button id="btn-restart" class="ui-button bg-white text-gray-900 border-4 border-gray-300 px-8 py-3 text-xl font-bold rounded-full shadow-xl transition-transform cursor-pointer">
                    TRY AGAIN
                </button>
            </div>
        </div>
    </div>

<script>
/**
 * AUDIO SYSTEM (Catalog-backed)
 * Uses approved catalog URLs with safe, gesture-triggered playback.
 */
const AudioSys = {
    unlocked: false,
    sfx: {},
    loop: null,
    lastPlayedAt: {},
    init() {
        if (this.unlocked) return;
        this.unlocked = true;
        this.sfx = {
            start: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3'),
            sword: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3'),
            hit: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3'),
            hurt: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3'),
            kill: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3'),
            warning: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3'),
            win: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3'),
            lose: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3'),
            click: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3')
        };
        Object.values(this.sfx).forEach(audio => {
            audio.preload = 'auto';
            audio.volume = 0.4;
        });
        this.sfx.start.volume = 0.45;
        this.sfx.sword.volume = 0.2;
        this.sfx.hit.volume = 0.22;
        this.sfx.hurt.volume = 0.28;
        this.sfx.kill.volume = 0.32;
        this.sfx.warning.volume = 0.18;
        this.sfx.win.volume = 0.42;
        this.sfx.lose.volume = 0.42;
        this.sfx.click.volume = 0.2;

        this.loop = new Audio('https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3');
        this.loop.loop = true;
        this.loop.preload = 'auto';
        this.loop.volume = 0.18;
    },
    play(name, cooldown = 0) {
        const audio = this.sfx[name];
        if (!audio || !this.unlocked) return;
        const now = performance.now();
        if (cooldown && this.lastPlayedAt[name] && now - this.lastPlayedAt[name] < cooldown) return;
        this.lastPlayedAt[name] = now;
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    },
    startLoop() {
        if (!this.loop || !this.unlocked) return;
        try {
            this.loop.currentTime = 0;
            this.loop.play().catch(() => {});
        } catch (_) {}
    },
    stopLoop() {
        if (!this.loop) return;
        try {
            this.loop.pause();
            this.loop.currentTime = 0;
        } catch (_) {}
    },
    pauseLoop() {
        if (!this.loop) return;
        try {
            this.loop.pause();
        } catch (_) {}
    }
};
// <!-- [agent-note][stage3] resolved-audio: start/combat/hurt/win/lose + action loop -> catalogs/audios.json -->

/**
 * GAME CONSTANTS & CONFIG
 */
const CONFIG = {
    playerSpeed: 4,
    playerRadius: 15,
    swordRange: 70,
    swordCooldown: 30, // frames
    enemySpeed: 1.5,
    enemyRadius: 12,
    spawnRateInitial: 60, // frames
    gameDuration: 60 // seconds
};

/**
 * MAIN GAME LOGIC
 */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let animationId;
let hitGifTimer = 0;
let resultGifTimer = 0;

// State
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let lastTime = 0;
let frameCount = 0;
let timeLeft = CONFIG.gameDuration;
let score = 0;

// Entities
let player = { x: 0, y: 0, hp: 100, maxHp: 100, angle: 0, cooldown: 0 };
let enemies = [];
let particles = [];
let damageNumbers = [];
let swordSwing = { active: false, angle: 0, progress: 0 };

// Input
let joystick = { active: false, originX: 0, originY: 0, curX: 0, curY: 0, vecX: 0, vecY: 0 };
const hitGif = document.getElementById('hit-gif');
const resultGif = document.getElementById('result-gif');

// Resize handling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/**
 * INPUT HANDLING (Touch Joystick)
 */
function handleStart(x, y) {
    if (gameState !== 'PLAYING') return;
    joystick.active = true;
    joystick.originX = x;
    joystick.originY = y;
    joystick.curX = x;
    joystick.curY = y;
    joystick.vecX = 0;
    joystick.vecY = 0;
}

function handleMove(x, y) {
    if (!joystick.active) return;
    joystick.curX = x;
    joystick.curY = y;
    
    const dx = x - joystick.originX;
    const dy = y - joystick.originY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 50; // Joystick radius
    
    // Normalize
    if (dist > 0) {
        const clampedDist = Math.min(dist, maxDist);
        joystick.vecX = (dx / dist) * (clampedDist / maxDist);
        joystick.vecY = (dy / dist) * (clampedDist / maxDist);
    } else {
        joystick.vecX = 0;
        joystick.vecY = 0;
    }
}

function handleEnd() {
    joystick.active = false;
    joystick.vecX = 0;
    joystick.vecY = 0;
}

// Touch Events
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    handleEnd();
});

// Mouse fallback for testing
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
window.addEventListener('mouseup', handleEnd);

/**
 * GAME LOOP
 */
function setGifVisible(element, visible, src) {
    if (!element) return;
    if (src && element.getAttribute('src') !== src) {
        element.src = src;
    }
    element.classList.toggle('is-visible', visible);
}

function triggerHitGif() {
    hitGifTimer = 18;
    setGifVisible(hitGif, true, 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp');
}

function triggerResultGif(win) {
    resultGifTimer = 240;
    const src = win
        ? 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
        : 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
    setGifVisible(resultGif, true, src);
}

function startGame() {
    AudioSys.init();
    AudioSys.play('start', 120);
    AudioSys.startLoop();
    setGifVisible(resultGif, false);
    gameState = 'PLAYING';
    
    // Reset State
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.hp = 100;
    player.cooldown = 0;
    timeLeft = CONFIG.gameDuration;
    enemies = [];
    particles = [];
    damageNumbers = [];
    score = 0;
    hitGifTimer = 0;
    resultGifTimer = 0;
    setGifVisible(hitGif, false);
    
    // UI
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateHUD();
    
    lastTime = performance.now();
    cancelAnimationFrame(animationId);
    loop();
}

function gameOver(win) {
    gameState = 'GAMEOVER';
    AudioSys.stopLoop();
    triggerResultGif(win);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    
    const title = document.getElementById('go-title');
    const msg = document.getElementById('go-msg');
    
    if (win) {
        title.innerText = "BREACH HELD";
        title.className = "ui-title text-5xl font-black text-yellow-400 mb-2 drop-shadow-lg";
        msg.innerText = "Your ward held until dawn.";
        AudioSys.play('win', 200);
    } else {
        title.innerText = "WARD SHATTERED";
        title.className = "ui-title text-5xl font-black text-red-600 mb-2 drop-shadow-lg";
        msg.innerText = "The fiends overran the breach.";
        AudioSys.play('lose', 200);
        if(navigator.vibrate) navigator.vibrate(500);
    }
}

function loop(now) {
    if (gameState !== 'PLAYING') return;
    animationId = requestAnimationFrame(loop);
    
    // Time delta
    // const dt = (now - lastTime) / 1000; 
    lastTime = now;
    frameCount++;

    update();
    draw();
}

/**
 * UPDATE LOGIC
 */
function update() {
    if (hitGifTimer > 0) {
        hitGifTimer--;
        if (hitGifTimer === 0) setGifVisible(hitGif, false);
    }
    if (resultGifTimer > 0) {
        resultGifTimer--;
        if (resultGifTimer === 0 && gameState === 'PLAYING') setGifVisible(resultGif, false);
    }

    // 1. Timer
    if (frameCount % 60 === 0) {
        timeLeft--;
        updateHUD();
        if (timeLeft <= 0) {
            gameOver(true);
            return;
        }
    }

    // 2. Player Movement
    player.x += joystick.vecX * CONFIG.playerSpeed;
    player.y += joystick.vecY * CONFIG.playerSpeed;
    
    // Bounds
    player.x = Math.max(CONFIG.playerRadius, Math.min(canvas.width - CONFIG.playerRadius, player.x));
    player.y = Math.max(CONFIG.playerRadius, Math.min(canvas.height - CONFIG.playerRadius, player.y));
    
    // Face movement direction if moving
    if (Math.abs(joystick.vecX) > 0.1 || Math.abs(joystick.vecY) > 0.1) {
        player.angle = Math.atan2(joystick.vecY, joystick.vecX);
    }

    // 3. Spawning Enemies
    // Spawn rate increases as time decreases
    const currentSpawnRate = Math.max(10, Math.floor(CONFIG.spawnRateInitial * (timeLeft / 60)));
    if (frameCount % currentSpawnRate === 0) {
        spawnEnemy();
    }

    // 4. Enemy Logic
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        
        // Move towards player
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            e.x += (dx / dist) * CONFIG.enemySpeed;
            e.y += (dy / dist) * CONFIG.enemySpeed;
        }
        
        // Collision with Player
        if (dist < CONFIG.playerRadius + CONFIG.enemyRadius) {
            player.hp -= 1; // Damage
            createParticle(player.x, player.y, '#ff0000', 5);
            if (frameCount % 10 === 0) {
                AudioSys.play('hurt', 180);
                if (player.hp <= 25) {
                    AudioSys.play('warning', 800);
                }
                if(navigator.vibrate) navigator.vibrate(20);
                updateHUD();
            }
            if (player.hp <= 0) {
                gameOver(false);
                return;
            }
        }
    }

    // 5. Combat / Sword Logic
    if (player.cooldown > 0) player.cooldown--;
    
    // Sword Animation
    if (swordSwing.active) {
        swordSwing.progress += 0.15; // Swing speed
        if (swordSwing.progress >= 1) {
            swordSwing.active = false;
        }
    } else {
        // Try to attack nearest enemy
        if (player.cooldown <= 0) {
            const nearest = getNearestEnemy();
            if (nearest && nearest.dist < CONFIG.swordRange) {
                // ATTACK!
                player.cooldown = CONFIG.swordCooldown;
                swordSwing.active = true;
                swordSwing.progress = 0;
                // Aim sword at enemy
                swordSwing.angle = Math.atan2(nearest.enemy.y - player.y, nearest.enemy.x - player.x);
                AudioSys.play('sword', 90);
                
                // Deal damage immediately in arc
                checkSwordCollisions(swordSwing.angle);
            }
        }
    }

    // 6. Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // 7. Damage Numbers
    for (let i = damageNumbers.length - 1; i >= 0; i--) {
        const d = damageNumbers[i];
        d.y -= 1;
        d.life -= 0.02;
        if (d.life <= 0) damageNumbers.splice(i, 1);
    }
}

function spawnEnemy() {
    // Spawn at edge
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
    }
    enemies.push({ x, y, hp: 20 });
}

function getNearestEnemy() {
    let nearest = null;
    let minDist = Infinity;
    for (let e of enemies) {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist) {
            minDist = dist;
            nearest = e;
        }
    }
    return nearest ? { enemy: nearest, dist: minDist } : null;
}

function checkSwordCollisions(angle) {
    // Simple hitbox: circle in front of player
    const hitX = player.x + Math.cos(angle) * 40;
    const hitY = player.y + Math.sin(angle) * 40;
    const hitRadius = 50;

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.x - hitX;
        const dy = e.y - hitY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < hitRadius + CONFIG.enemyRadius) {
            // HIT
            e.hp -= 10;
            createParticle(e.x, e.y, '#ffffff', 3);
            AudioSys.play('hit', 70);
            triggerHitGif();
            
            // Knockback
            const kx = Math.cos(angle);
            const ky = Math.sin(angle);
            e.x += kx * 20;
            e.y += ky * 20;

            if (e.hp <= 0) {
                enemies.splice(i, 1);
                createExplosion(e.x, e.y);
                score += 10;
                addDamageNumber(e.x, e.y, "KILL");
                AudioSys.play('kill', 90);
                if (navigator.vibrate) navigator.vibrate(5);
            } else {
                addDamageNumber(e.x, e.y, "10");
            }
        }
    }
}

/**
 * RENDER LOGIC
 */
function draw() {
    // Clear
    const arenaGlow = ctx.createRadialGradient(player.x, player.y, 20, player.x, player.y, Math.max(canvas.width, canvas.height) * 0.75);
    arenaGlow.addColorStop(0, 'rgba(128, 242, 255, 0.16)');
    arenaGlow.addColorStop(0.35, 'rgba(54, 94, 194, 0.08)');
    arenaGlow.addColorStop(1, 'rgba(6, 10, 22, 0)');
    const floorGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    floorGradient.addColorStop(0, '#090d1d');
    floorGradient.addColorStop(1, '#170f2e');
    ctx.fillStyle = floorGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = arenaGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid (ground texture)
    ctx.strokeStyle = 'rgba(109, 196, 255, 0.12)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    
    // Draw relative grid for motion sickness reduction/reference
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for (let y = 0; y <= canvas.height; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 224, 130, 0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 86, 0, Math.PI * 2);
    ctx.stroke();

    // Draw Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Draw Enemies
    for (let e of enemies) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.ellipse(e.x, e.y + 10, 10, 5, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 90, 123, 0.14)';
        ctx.beginPath();
        ctx.arc(e.x, e.y, 17, 0, Math.PI * 2);
        ctx.fill();
        
        // Body (Red Demon)
        ctx.font = "24px var(--font-title)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("👹", e.x, e.y);
        ctx.fillStyle = 'rgba(255, 224, 130, 0.9)';
        ctx.font = "11px var(--font-hud)";
        ctx.fillText("✦", e.x, e.y - 16);
    }

    // Draw Player
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + 12, 12, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Hero
    ctx.fillStyle = 'rgba(128, 242, 255, 0.16)';
    ctx.beginPath();
    ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 224, 130, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 26, 0, Math.PI * 2);
    ctx.stroke();

    ctx.font = "32px var(--font-title)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // Flip sprite based on movement x
    ctx.save();
    ctx.translate(player.x, player.y);
    if (joystick.vecX < 0) ctx.scale(-1, 1);
    ctx.fillText("🧙‍♂️", 0, 0);
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 224, 130, 0.9)';
    ctx.font = "12px var(--font-hud)";
    ctx.fillText("WARD", player.x, player.y - 26);

    // Draw Sword Swing
    if (swordSwing.active) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(swordSwing.angle);
        
        // Swing arc visual
        const swingArc = Math.PI; // 180 degrees
        const currentRot = (swordSwing.progress - 0.5) * swingArc;
        
        ctx.rotate(currentRot);
        ctx.translate(30, 0); // Distance from player
        
        // Sword Sprite
        ctx.font = "30px var(--font-title)";
        ctx.rotate(Math.PI / 4); // Angle sword nicely
        ctx.fillText("🗡️", 0, 0);
        
        // Slash trail
        ctx.restore();
        
        // White slash effect
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(swordSwing.angle);
        ctx.strokeStyle = `rgba(128, 242, 255, ${1 - swordSwing.progress})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, 40, -Math.PI/2, Math.PI/2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255, 224, 130, ${0.75 - (swordSwing.progress * 0.5)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 48, -Math.PI/2, Math.PI/2);
        ctx.stroke();
        ctx.restore();
    }

    // Joystick UI (on top of game world)
    if (joystick.active) {
        ctx.strokeStyle = 'rgba(128, 242, 255, 0.38)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(joystick.originX, joystick.originY, 50, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(255, 114, 200, 0.32)';
        ctx.beginPath();
        ctx.arc(joystick.originX, joystick.originY, 34, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.beginPath();
        ctx.arc(joystick.curX, joystick.curY, 20, 0, Math.PI*2);
        ctx.fill();
    }

    // Damage Numbers
    for (let d of damageNumbers) {
        ctx.fillStyle = `rgba(255, 255, 0, ${d.life})`;
        ctx.font = "bold 20px var(--font-hud)";
        ctx.fillText(d.text, d.x, d.y);
    }
}

/**
 * UTILS & EFFECTS
 */
function createParticle(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function createExplosion(x, y) {
    createParticle(x, y, '#ffaa00', 10);
    createParticle(x, y, '#ff0000', 5);
}

function addDamageNumber(x, y, text) {
    damageNumbers.push({
        x: x, y: y - 20,
        text: text,
        life: 1.0
    });
}

function updateHUD() {
    const hpBar = document.getElementById('hp-bar');
    const timer = document.getElementById('timer');
    
    hpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    timer.innerText = timeLeft;
    
    if (timeLeft <= 10) {
        timer.classList.add('text-red-500');
        timer.classList.remove('text-yellow-400');
    }
}

// UI Bindings
document.getElementById('btn-play').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.play('click', 60);
    startGame();
});
document.getElementById('btn-restart').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.play('click', 60);
    startGame();
});
