<script>
/**
 * §1 Technical Core
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// Config
window.gameConfig = { steamSpeed: 70, modernSpeed: 130, trackCost: 15, steamCost: 120, modernCost: 200 };
window.gameConfigDefs = {
    steamSpeed: { type: "number", label: "Steam Speed", value: 70, min: 30, max: 200 },
    modernSpeed: { type: "number", label: "Bullet Speed", value: 130, min: 50, "max": 300 },
    trackCost: { type: "number", label: "Track Cost", value: 15, min: 0, max: 50 },
    steamCost: { type: "number", label: "Steam Cost", value: 120, min: 50, max: 500 },
    modernCost: { type: "number", label: "Bullet Cost", value: 200, min: 100, max: 1000 }
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if(key === 'steamCost') document.getElementById('cost-steam-display').textContent = '$' + val;
        if(key === 'modernCost') document.getElementById('cost-modern-display').textContent = '$' + val;
    }
};

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {};
const soundCooldowns = new Map();
let audioEnabled = false;
let toastTimer = null;
let gifTimer = null;

function loadSound(id) {
    const el = document.getElementById(id);
    if (!el || !el.src) return;

    const srcUrl = new URL(el.src, window.location.href);
    const isSameOrigin = srcUrl.origin === window.location.origin;
    const isLocalSafeScheme = srcUrl.protocol === 'data:' || srcUrl.protocol === 'blob:';

    if (!isSameOrigin && !isLocalSafeScheme) {
        return;
    }

    fetch(srcUrl.href)
        .then(r => r.arrayBuffer())
        .then(b => audioCtx.decodeAudioData(b))
        .then(d => sounds[id] = d)
        .catch(() => {});
}

function unlockAudio() {
    audioEnabled = true;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function playSound(id, fallbackType = 'beep', cooldownMs = 0) {
    if (!audioEnabled) return;
    const nowMs = performance.now();
    const lastPlayed = soundCooldowns.get(id) || 0;
    if (cooldownMs > 0 && nowMs - lastPlayed < cooldownMs) return;
    soundCooldowns.set(id, nowMs);

    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    if (sounds[id]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = sounds[id];
        gain.gain.value = id === 'bgm_main' ? 0.2 : id === 'sfx_fail' ? 0.3 : 0.35;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (fallbackType === 'coin') {
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.exponentialRampToValueAtTime(1500, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
        } else if (fallbackType === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.6);
        } else if (fallbackType === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(120, now + 0.18);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.05);
        }
        osc.start();
        osc.stop(now + 0.6);
    }
}

function playBgm() {
    if (!audioEnabled) return;
    const el = document.getElementById('bgm_main');
    if (el) {
        el.volume = 0.2;
        el.play().catch(() => {});
    }
}

function showFeedbackGif(id, duration = 1800) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(gifTimer);
    document.getElementById('gif-win')?.classList.add('hidden');
    document.getElementById('gif-fail')?.classList.add('hidden');
    el.classList.remove('hidden');
    gifTimer = setTimeout(() => el.classList.add('hidden'), duration);
}

/**
 * §2 Game Logic
 */
const TYPE_DEPOT = 0;
const TYPE_CITY = 1;
const TYPE_FARM = 2;
const TYPE_FACTORY = 3;

const LEVELS = [
    { target: 300,  farms: 2, cities: 1, factories: 0 },
    { target: 800,  farms: 3, cities: 2, factories: 0 },
    { target: 2000, farms: 4, cities: 2, factories: 1 },
    { target: 4000, farms: 5, cities: 3, factories: 2 },
    { target: 8000, farms: 6, cities: 4, factories: 3 }
];

let gameState = {
    money: 0,
    levelIndex: 0,
    isPlaying: false,
    nodes: [],
    edges: [],
    trains: [],
    particles: [],
    popups: [],
    bgClouds: []
};

let dragStartNode = null;
let dragCurrentPoint = null;

class Node {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.r = type === TYPE_CITY ? 30 : 25;
        this.cargo = 0;
        this.maxCargo = 8;
        this.timer = Math.random() * 2;
        this.connected = [];
        this.localTick = Math.random() * 100;
        this.cars = [];
        if (type === TYPE_CITY) {
            for(let i=0; i<3; i++) this.cars.push({x: Math.random()*40-20, spd: (Math.random()>0.5?1:-1)*(10+Math.random()*20), color: ['#FFEB3B','#FF5252','#E040FB'][Math.floor(Math.random()*3)]});
        }
    }
    update(dt) {
        this.localTick += dt;
        if (this.type === TYPE_FARM || this.type === TYPE_FACTORY) {
            this.timer += dt;
            if (this.timer > 2.5) {
                this.timer = 0;
                if (this.cargo < this.maxCargo) this.cargo++;
            }
        }
        if (this.type === TYPE_FACTORY && Math.random() < dt * 3) {
            gameState.particles.push(new Particle(this.x + 12, this.y - 25, 'soot'));
        }
        if (this.type === TYPE_CITY) {
            for(let car of this.cars) {
                car.x += car.spd * dt;
                if(Math.abs(car.x) > 22) car.spd *= -1;
            }
        }
    }
}

class Edge {
    constructor(n1, n2) {
        this.n1 = n1;
        this.n2 = n2;
        this.length = Math.hypot(n2.x - n1.x, n2.y - n1.y);
    }
}

class Train {
    constructor(startNode, type = 'steam') {
        this.currentNode = startNode;
        this.type = type; 
        this.path = [];
        this.progress = 0;
        this.cargoType = null;
        this.state = 'IDLE';
        this.currentEdge = null;
        this.reverse = false;
        this.angle = 0;
        this.img = document.getElementById(type === 'modern' ? 'asset_train_modern' : 'asset_train');
    }

    update(dt) {
        if (this.state === 'IDLE') {
            this.findTask();
        } else if (this.state === 'MOVING') {
            const spd = this.type === 'modern' ? window.gameConfig.modernSpeed : window.gameConfig.steamSpeed;
            this.progress += spd * dt;
            
            if (this.currentEdge) {
                const p1 = this.reverse ? this.currentEdge.n2 : this.currentEdge.n1;
                const p2 = this.reverse ? this.currentEdge.n1 : this.currentEdge.n2;
                this.angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            }

            if (this.type === 'steam' && Math.random() < dt * 10) {
                const pos = this.getPos();
                const leadX = Math.cos(this.angle) * 15;
                const leadY = Math.sin(this.angle) * 15;
                gameState.particles.push(new Particle(pos.x + leadX, pos.y + leadY, 'smoke'));
            } else if (this.type === 'modern' && Math.random() < dt * 2) {
                const pos = this.getPos();
                gameState.particles.push(new Particle(pos.x, pos.y, 'spark_blue'));
            }

            if (this.progress >= this.currentEdge.length) {
                this.currentNode = this.reverse ? this.currentEdge.n1 : this.currentEdge.n2;
                this.path.shift();
                if (this.path.length > 0) {
                    this.setupMove(this.path[0]);
                } else {
                    this.arrive();
                }
            }
        }
    }
    
    getPos() {
        if (this.state !== 'MOVING' || !this.currentEdge) return {x: this.currentNode.x, y: this.currentNode.y};
        const t = this.progress / this.currentEdge.length;
        const p1 = this.reverse ? this.currentEdge.n2 : this.currentEdge.n1;
        const p2 = this.reverse ? this.currentEdge.n1 : this.currentEdge.n2;
        return {
            x: p1.x + (p2.x - p1.x) * t,
            y: p1.y + (p2.y - p1.y) * t
        };
    }

    findTask() {
        let targetTypes = this.cargoType ? [TYPE_CITY] : [TYPE_FARM, TYPE_FACTORY];
        let targets = gameState.nodes.filter(n => targetTypes.includes(n.type));
        if (!this.cargoType) targets = targets.filter(n => n.cargo > 0);
        if (targets.length === 0 && !this.cargoType) targets = gameState.nodes.filter(n => n !== this.currentNode);

        const path = this.bfs(targets);
        if (path) {
            this.path = path;
            this.setupMove(this.path[0]);
            this.state = 'MOVING';
        }
    }

    bfs(targets) {
        let queue = [[this.currentNode]];
        let visited = new Set([this.currentNode]);
        while (queue.length > 0) {
            let path = queue.shift();
            let node = path[path.length - 1];
            if (targets.includes(node) && node !== this.currentNode) return path.slice(1);
            for (let neighbor of node.connected) {
                if (!visited.has(neighbor)) {
                    visited.add(neighbor);
                    queue.push([...path, neighbor]);
                }
            }
        }
        return null;
    }

    setupMove(nextNode) {
        const edge = gameState.edges.find(e => (e.n1 === this.currentNode && e.n2 === nextNode) || (e.n2 === this.currentNode && e.n1 === nextNode));
        if (edge) {
            this.currentEdge = edge;
            this.reverse = (edge.n2 === this.currentNode);
            this.progress = 0;
        }
    }

    arrive() {
        this.state = 'IDLE';
        const node = this.currentNode;
        if (this.cargoType && node.type === TYPE_CITY) {
            const baseEarn = 50 + (gameState.levelIndex * 10);
            const earn = this.type === 'modern' ? Math.floor(baseEarn * 1.2) : baseEarn;
            addMoney(earn);
            this.cargoType = null;
            playSound('sfx_money', 'coin', 140);
            gameState.popups.push(new Popup(node.x, node.y - 30, "+$" + earn));
            // Spawn Money Objects (Coins)
            for(let i=0; i<6; i++) {
                gameState.particles.push(new Particle(node.x, node.y, 'coin'));
            }
            for(let i=0; i<8; i++) gameState.particles.push(new Particle(node.x, node.y, 'spark'));
        } else if (!this.cargoType && (node.type === TYPE_FARM || node.type === TYPE_FACTORY) && node.cargo > 0) {
            node.cargo--;
            this.cargoType = node.type === TYPE_FARM ? 'food' : 'goods';
            playSound('sfx_build', 'beep', 110);
        }
    }

    draw(ctx) {
        const pos = this.getPos();
        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(this.state === 'MOVING' ? this.angle - Math.PI/2 : -Math.PI/2);

        if (this.img && this.img.complete && this.img.naturalWidth > 0) {
            if (this.type === 'modern') {
                ctx.globalCompositeOperation = 'screen'; 
            } else {
                ctx.globalCompositeOperation = 'multiply';
            }
            const w = 30; const h = 60;
            ctx.drawImage(this.img, -w/2, -h/2, w, h);
            ctx.globalCompositeOperation = 'source-over';
        } else {
            ctx.fillStyle = this.type === 'modern' ? '#7E57C2' : '#FB8C00';
            ctx.fillRect(-10, -20, 20, 40);
        }

        if (this.cargoType) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.life = 1.0;
        const angle = Math.random() * 6.28;
        const speed = Math.random() * 30 + 10;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        if (type === 'smoke') {
            this.vx *= 0.3; this.vy = -15 - Math.random() * 10;
            this.life = 0.6 + Math.random() * 0.4;
        } else if (type === 'soot') {
            this.vx = (Math.random()-0.5)*10; this.vy = -20 - Math.random() * 20;
            this.life = 1.5 + Math.random();
        } else if (type === 'spark_blue') {
            this.life = 0.4;
        } else if (type === 'coin') {
            this.vy = -60 - Math.random()*40; // Pop up
            this.vx = (Math.random()-0.5)*40;
            this.life = 1.2;
            this.gravity = 200;
        }
    }
    update(dt) {
        if (this.type === 'coin') this.vy += this.gravity * dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }
}

class Popup {
    constructor(x, y, text) {
        this.x = x; this.y = y; this.text = text;
        this.life = 1.2; this.vy = -40;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt;
    }
}

function initBackground() {
    gameState.bgClouds = [];
    for(let i=0; i<15; i++) {
        gameState.bgClouds.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: 30 + Math.random() * 80,
            speed: 5 + Math.random() * 10
        });
    }
}
function drawBackground(dt) {
    ctx.fillStyle = '#81C784';
    ctx.fillRect(0,0, canvas.width, canvas.height);
    
    // Parallax Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for(let c of gameState.bgClouds) {
        c.x += c.speed * dt;
        if(c.x - c.r > canvas.width / dpr) c.x = -c.r;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fill();
    }
}

function initLevel(idx) {
    gameState.levelIndex = idx;
    gameState.money = 250; 
    gameState.nodes = [];
    gameState.edges = [];
    gameState.trains = [];
    gameState.particles = [];
    gameState.popups = [];
    
    const config = LEVELS[idx % LEVELS.length];
    const w = window.innerWidth;
    const h = window.innerHeight;
    
    // Centralized Spawning Logic
    // We want nodes to be "more to the center" but still scattered.
    // Let's define a safe area that is 80% of width/height, centered.
    const safeW = w * 0.75;
    const safeH = h * 0.75;
    const offsetX = (w - safeW) / 2;
    const offsetY = (h - safeH) / 2;

    let toPlace = [TYPE_DEPOT];
    for(let i=0; i<config.cities; i++) toPlace.push(TYPE_CITY);
    for(let i=0; i<config.farms; i++) toPlace.push(TYPE_FARM);
    for(let i=0; i<config.factories; i++) toPlace.push(TYPE_FACTORY);
    
    for (let t of toPlace) {
        let placed = false, attempts = 0;
        while (!placed && attempts < 200) {
            // Generate within the central box
            const nx = offsetX + Math.random() * safeW;
            const ny = offsetY + Math.random() * safeH;
            
            let ok = true;
            // Check distance from other nodes
            for(let n of gameState.nodes) if(Math.hypot(n.x - nx, n.y - ny) < 100) ok = false;
            
            // Check distance from UI areas (Right side train shop)
            if (nx > w - 100) ok = false; 

            if(ok) {
                gameState.nodes.push(new Node(t, nx, ny));
                placed = true;
            }
            attempts++;
        }
    }
    
    const depot = gameState.nodes.find(n => n.type === TYPE_DEPOT);
    if(depot) gameState.trains.push(new Train(depot, 'steam'));
    
    updateUI();
}

function addMoney(amount) {
    gameState.money += amount;
    checkWin();
    updateUI();
}

function checkWin() {
    const target = LEVELS[gameState.levelIndex % LEVELS.length].target;
    if (gameState.money >= target && gameState.isPlaying) {
        gameState.isPlaying = false;
        playSound('sfx_win', 'win', 400);
        showFeedbackGif('gif-win', 2600);
        document.getElementById('level-complete-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        for(let i=0; i<50; i++) {
            gameState.particles.push(new Particle(window.innerWidth/2, window.innerHeight/2, 'spark'));
        }
    }
}

function updateUI() {
    const target = LEVELS[gameState.levelIndex % LEVELS.length].target;
    document.getElementById('score-display').textContent = gameState.money;
    document.getElementById('target-display').textContent = target;
    document.getElementById('level-display').textContent = (gameState.levelIndex + 1);
    document.getElementById('train-count').textContent = gameState.trains.length;
    
    const pct = Math.min(100, (gameState.money / target) * 100);
    document.getElementById('goal-bar').style.width = pct + '%';
}

function showToast(msg) {
    const t = document.getElementById('msg-toast');
    t.textContent = msg;
    t.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.style.opacity = 0, 1500);
}

function drawNode(ctx, n) {
    ctx.save();
    ctx.translate(n.x, n.y);

    if (n.type === TYPE_FARM) {
        // Ground
        ctx.fillStyle = '#C8E6C9';
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
        
        // Crops
        ctx.fillStyle = '#FDD835';
        ctx.fillRect(-25, 5, 15, 10);
        ctx.fillRect(-5, 5, 15, 10);
        ctx.fillRect(15, 5, 10, 10);

        // Barn
        ctx.fillStyle = '#D84315';
        ctx.fillRect(-15, -15, 30, 20);
        ctx.fillStyle = '#5D4037';
        ctx.beginPath();
        ctx.moveTo(-18, -15);
        ctx.lineTo(0, -28);
        ctx.lineTo(18, -15);
        ctx.fill();
        
        // Tractor
        const angle = n.localTick * 1.5;
        const tx = Math.cos(angle) * 25;
        const ty = Math.sin(angle) * 25;
        ctx.fillStyle = '#43A047';
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(angle + Math.PI/2);
        ctx.fillRect(-4, -6, 8, 12);
        ctx.fillStyle = 'black';
        ctx.fillRect(-5, -4, 2, 4);
        ctx.fillRect(3, -4, 2, 4);
        ctx.restore();

    } else if (n.type === TYPE_FACTORY) {
        ctx.fillStyle = '#CFD8DC';
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#546E7A';
        ctx.fillRect(-20, -10, 40, 20);
        ctx.fillStyle = '#B0BEC5';
        ctx.fillRect(-15, -5, 8, 8);
        ctx.fillRect(-2, -5, 8, 8);
        ctx.fillStyle = '#37474F';
        ctx.fillRect(8, -25, 8, 20);
        ctx.fillStyle = '#263238';
        ctx.fillRect(7, -27, 10, 3);

    } else if (n.type === TYPE_CITY) {
        ctx.fillStyle = '#E1F5FE';
        ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0288D1';
        ctx.fillRect(-20, -25, 12, 35);
        ctx.fillStyle = '#0277BD';
        ctx.fillRect(-5, -35, 15, 45);
        ctx.fillStyle = '#039BE5';
        ctx.fillRect(12, -20, 10, 30);
        ctx.fillStyle = '#B3E5FC';
        ctx.fillRect(-3, -30, 3, 3);
        ctx.fillRect(3, -30, 3, 3);
        ctx.fillRect(-3, -20, 3, 3);
        ctx.fillRect(3, -20, 3, 3);

        for(let c of n.cars) {
            ctx.fillStyle = c.color;
            ctx.fillRect(c.x, 15, 6, 4);
        }

    } else if (n.type === TYPE_DEPOT) {
        ctx.fillStyle = '#FFCDD2';
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#C62828';
        ctx.fillRect(-20, -15, 40, 30);
        ctx.beginPath();
        ctx.moveTo(-25, -15);
        ctx.lineTo(0, -30);
        ctx.lineTo(25, -15);
        ctx.fillStyle = '#3E2723';
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(0, -10, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.fillRect(-0.5, -10, 1, 4);
    }

    // Cargo Badge
    if ((n.type === TYPE_FARM || n.type === TYPE_FACTORY) && n.cargo > 0) {
        const s = 1 + Math.sin(n.localTick * 5) * 0.1;
        ctx.save();
        ctx.scale(s, s);
        ctx.fillStyle = '#221a38';
        ctx.beginPath(); ctx.arc(15, -15, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Rajdhani';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n.cargo, 15, -14);
        ctx.restore();
    }
    
    ctx.restore();
}

let lastTime = 0;
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground(dt);

    // Edges
    ctx.lineCap = 'round';
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#8D6E63'; // Gravel
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let e of gameState.edges) { ctx.moveTo(e.n1.x, e.n1.y); ctx.lineTo(e.n2.x, e.n2.y); }
    ctx.stroke();
    
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#5D4037'; // Rails
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let e of gameState.edges) { ctx.moveTo(e.n1.x, e.n1.y); ctx.lineTo(e.n2.x, e.n2.y); }
    ctx.stroke();
    
    // Ties
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#3E2723';
    ctx.setLineDash([2, 12]);
    ctx.beginPath();
    for (let e of gameState.edges) { ctx.moveTo(e.n1.x, e.n1.y); ctx.lineTo(e.n2.x, e.n2.y); }
    ctx.stroke();
    ctx.setLineDash([]);

    // Drag Line
    if (dragStartNode && dragCurrentPoint) {
        ctx.beginPath();
        ctx.moveTo(dragStartNode.x, dragStartNode.y);
        ctx.lineTo(dragCurrentPoint.x, dragCurrentPoint.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Nodes
    for (let n of gameState.nodes) {
        drawNode(ctx, n);
    }

    // Entities
    if (gameState.isPlaying || gameState.money >= LEVELS[gameState.levelIndex % LEVELS.length].target) {
        for (let t of gameState.trains) {
            if(gameState.isPlaying) t.update(dt);
            t.draw(ctx);
        }
        for(let n of gameState.nodes) if(gameState.isPlaying) n.update(dt);
    }

    // Particles
    for (let i = gameState.particles.length - 1; i >= 0; i--) {
        let p = gameState.particles[i];
        p.update(dt);
        ctx.globalAlpha = p.life;
        if (p.type === 'coin') {
            // Draw Coin
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 1; ctx.strokeStyle = '#DAA520'; ctx.stroke();
            ctx.fillStyle = '#B8860B'; ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
            ctx.restore();
        } else if (p.type === 'smoke') {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
        } else if (p.type === 'soot') {
            ctx.fillStyle = 'rgba(50,50,50,0.5)';
            ctx.beginPath(); ctx.arc(p.x, p.y, 4 + (1.5-p.life)*4, 0, Math.PI*2); ctx.fill();
        } else if (p.type === 'spark_blue') {
            ctx.fillStyle = '#00E5FF';
            ctx.fillRect(p.x, p.y, 3, 3);
        } else {
            ctx.fillStyle = '#FFD54F';
            ctx.fillRect(p.x, p.y, 4, 4);
        }
        ctx.globalAlpha = 1;
        if (p.life <= 0) gameState.particles.splice(i, 1);
    }

    // Popups
    ctx.font = 'bold 20px Rajdhani';
    ctx.fillStyle = '#89ffba';
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    for (let i = gameState.popups.length - 1; i >= 0; i--) {
        let p = gameState.popups[i];
        p.update(dt);
        ctx.globalAlpha = Math.min(1, p.life);
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
        if (p.life <= 0) gameState.popups.splice(i, 1);
    }

    requestAnimationFrame(loop);
}

function handleInput(e) {
    if (!gameState.isPlaying) return;
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        const clickedNode = gameState.nodes.find(n => Math.hypot(n.x - x, n.y - y) < 40);
        if (clickedNode) {
            dragStartNode = clickedNode;
            dragCurrentPoint = {x, y};
        }
    } else if (e.type === 'pointermove') {
        if (dragStartNode) dragCurrentPoint = {x, y};
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        if (dragStartNode) {
            const endNode = gameState.nodes.find(n => Math.hypot(n.x - x, n.y - y) < 40);
            if (endNode && endNode !== dragStartNode) {
                if (!dragStartNode.connected.includes(endNode)) {
                    const cost = window.gameConfig.trackCost;
                    if (gameState.money >= cost) {
                        gameState.money -= cost;
                        dragStartNode.connected.push(endNode);
                        endNode.connected.push(dragStartNode);
                        gameState.edges.push(new Edge(dragStartNode, endNode));
                        playSound('sfx_build', 'beep', 110);
                        for(let i=0; i<5; i++) gameState.particles.push(new Particle((dragStartNode.x+endNode.x)/2, (dragStartNode.y+endNode.y)/2, 'dust'));
                        updateUI();
                    } else {
                        playSound('sfx_fail', 'fail', 240);
                        showFeedbackGif('gif-fail', 1400);
                        showToast("Need treasury: $" + cost);
                    }
                }
            }
            dragStartNode = null;
            dragCurrentPoint = null;
        }
    }
}

function buyTrain(type) {
    const cost = type === 'modern' ? window.gameConfig.modernCost : window.gameConfig.steamCost;
    if (gameState.money >= cost) {
        gameState.money -= cost;
        const depot = gameState.nodes.find(n => n.type === TYPE_DEPOT);
        if(depot) {
            gameState.trains.push(new Train(depot, type));
            playSound('sfx_build', 'beep', 110);
            updateUI();
        }
    } else {
        playSound('sfx_fail', 'fail', 240);
        showFeedbackGif('gif-fail', 1400);
        showToast("Need treasury: $" + cost);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    resize();
    loadSound('bgm_main');
    loadSound('sfx_money');
    loadSound('sfx_build');
    loadSound('sfx_win');
    loadSound('sfx_fail');
    loadSound('sfx_start');
    initBackground();
    
    const startGame = () => {
        unlockAudio();
        playSound('sfx_start', 'beep', 250);
        playBgm();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initLevel(0);
        gameState.isPlaying = true;
    };

    const nextLevel = () => {
        unlockAudio();
        playBgm();
        document.getElementById('level-complete-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initLevel(gameState.levelIndex + 1);
        gameState.isPlaying = true;
    };

    document.getElementById('btn-start').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startGame();
    });
    document.getElementById('btn-start').addEventListener('click', startGame);

    document.getElementById('btn-next-level').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        nextLevel();
    });
    document.getElementById('btn-next-level').addEventListener('click', nextLevel);

    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', handleInput, { passive: false });
    window.addEventListener('pointerup', handleInput, { passive: false });
    window.addEventListener('pointercancel', handleInput, { passive: false });

    document.getElementById('btn-buy-steam').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        buyTrain('steam');
    });

    document.getElementById('btn-buy-modern').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        buyTrain('modern');
    });

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
