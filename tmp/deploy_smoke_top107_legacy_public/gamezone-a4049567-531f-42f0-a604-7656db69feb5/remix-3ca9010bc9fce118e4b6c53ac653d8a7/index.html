<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Matchstick Mysteries</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&family=Exo+2:wght@400;600&display=swap');

  :root {
    --bg-night: #120914;
    --bg-ember: #241018;
    --panel-glass: rgba(32, 17, 30, 0.58);
    --panel-edge: rgba(255, 208, 117, 0.28);
    --title-glow: #ffe1a8;
    --text-main: #fff4d6;
    --text-sub: #ffc57d;
    --ember: #ff9052;
    --rose: #ff5d7a;
    --cyan: #7bf6ff;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at top, rgba(255, 180, 104, 0.18), transparent 32%),
      linear-gradient(180deg, var(--bg-ember), var(--bg-night));
    color: var(--text-main);
  }

  body {
    font-family: 'Exo 2', system-ui, sans-serif;
  }

  #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #game-container::before,
  #game-container::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #game-container::before {
    background:
      radial-gradient(circle at 20% 18%, rgba(255, 224, 156, 0.18), transparent 18%),
      radial-gradient(circle at 82% 12%, rgba(123, 246, 255, 0.14), transparent 18%),
      radial-gradient(circle at 50% 88%, rgba(255, 93, 122, 0.12), transparent 20%);
    opacity: 0.95;
  }
  #game-container::after {
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
    mix-blend-mode: screen;
    opacity: 0.32;
  }

  canvas { display: block; touch-action: none; width: 100%; height: 100%; }
  .select-none { user-select: none; -webkit-user-select: none; }
  .absolute { position: absolute; }
  .inset-0 { inset: 0; }
  .z-50 { z-index: 50; }
  .pointer-events-none { pointer-events: none; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .justify-between { justify-content: space-between; }
  .p-8 { padding: clamp(1rem, 4vw, 2rem); }
  .text-center { text-align: center; }
  .mt-8 { margin-top: clamp(0.6rem, 4vw, 2rem); }
  .mb-12 { margin-bottom: clamp(1rem, 7vw, 3rem); }
  .text-3xl { font-size: clamp(1.4rem, 3vw + 0.8rem, 2rem); }
  .text-xl { font-size: clamp(0.82rem, 0.9vw + 0.76rem, 1.08rem); }
  .tracking-widest { letter-spacing: 0.22em; }
  .tracking-wide { letter-spacing: 0.1em; }
  .uppercase { text-transform: uppercase; }
  .drop-shadow-\[0_4px_4px_rgba\(0\,0\,0\,0\.9\)\] { filter: drop-shadow(0 4px 4px rgba(0,0,0,0.9)); }
  .text-\[\#faedcd\] { color: var(--text-main); }
  .text-\[\#d4a373\] { color: var(--text-sub); }
  .font-noir { font-family: 'Press Start 2P', cursive; line-height: 1.5; }

  .feedback-stack {
    position: absolute;
    right: clamp(0.75rem, 3vw, 1.4rem);
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(0.75rem, 3vw, 1.4rem));
    z-index: 55;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.7rem;
    pointer-events: none;
  }

  .feedback-card {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    min-width: min(72vw, 18rem);
    max-width: min(78vw, 19rem);
    padding: 0.5rem 0.75rem;
    border-radius: 1rem;
    border: 1px solid rgba(255, 225, 168, 0.28);
    background: rgba(15, 8, 20, 0.82);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    transition: opacity 180ms ease, transform 180ms ease;
    overflow: hidden;
  }

  .feedback-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .feedback-card--success {
    border-color: rgba(123, 246, 255, 0.34);
  }

  .feedback-card--fail {
    border-color: rgba(255, 93, 122, 0.34);
  }

  .feedback-gif {
    width: clamp(3.4rem, 14vw, 4.8rem);
    height: clamp(3.4rem, 14vw, 4.8rem);
    object-fit: cover;
    border-radius: 0.85rem;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.05);
  }

  .feedback-copy {
    min-width: 0;
  }

  .feedback-label {
    display: block;
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(0.52rem, 1.8vw, 0.62rem);
    line-height: 1.5;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--title-glow);
  }

  .feedback-subtext {
    display: block;
    margin-top: 0.28rem;
    font-size: clamp(0.78rem, 2.6vw, 0.95rem);
    line-height: 1.25;
    color: var(--text-sub);
  }

  #ui-layer {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .hud-badge,
  .instruction-card {
    position: relative;
    margin-inline: auto;
    pointer-events: none;
    border: 1px solid var(--panel-edge);
    background:
      linear-gradient(180deg, rgba(54, 25, 40, 0.8), rgba(18, 8, 17, 0.7)),
      var(--panel-glass);
    backdrop-filter: blur(8px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 14px 32px rgba(0,0,0,0.34),
      0 0 18px rgba(255, 144, 82, 0.14);
  }

  .hud-badge {
    max-width: min(82vw, 20rem);
    padding: 0.7rem 1rem 0.65rem;
    border-radius: 999px;
  }

  .instruction-card {
    max-width: min(90vw, 28rem);
    padding: 0.8rem 1rem;
    border-radius: 1rem;
  }

  .title-overline {
    display: block;
    margin-bottom: 0.55rem;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--cyan);
    text-transform: uppercase;
    opacity: 0.82;
  }

  #level-text {
    margin: 0;
    color: var(--title-glow);
    text-shadow:
      0 0 12px rgba(255, 200, 112, 0.35),
      0 2px 0 rgba(69, 25, 10, 0.9);
  }

  .instruction-card p {
    margin: 0;
    line-height: 1.45;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }

  /* [agent-note][stage4] repaired: font-policy | action: body copy moved to approved catalog UI font while preserving title/hud roles */

  .instruction-accent {
    color: var(--ember);
  }

  .instruction-highlight {
    color: var(--cyan);
  }
</style>
</head>
<body>
<div id="game-container" class="select-none">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-8">
    <div class="text-center mt-8">
      <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
      <div class="hud-badge">
        <span class="title-overline">Case File</span>
        <h1 id="level-text" class="text-3xl text-[#faedcd] font-noir tracking-widest uppercase drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)]">Round 01</h1>
      </div>
    </div>
    <div class="text-center mb-12">
      <div class="instruction-card">
        <p class="text-xl text-[#d4a373] tracking-wide drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)]"><span class="instruction-accent">🔥 Slide</span> <span class="instruction-highlight">1 stick</span> to clear the puzzle</p>
      </div>
    </div>
  </div>
</div>

<div class="feedback-stack" aria-live="polite">
  <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->
  <div id="success-feedback" class="feedback-card feedback-card--success" role="status" aria-hidden="true">
    <img class="feedback-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction">
    <div class="feedback-copy">
      <span class="feedback-label">Case Solved</span>
      <span class="feedback-subtext">The evidence clicks into place.</span>
    </div>
  </div>
  <div id="fail-feedback" class="feedback-card feedback-card--fail" role="status" aria-hidden="true">
    <img class="feedback-gif" src="https://i.giphy.com/HdMNmMm7tHd1bs4VeQ.webp" alt="Confused reaction">
    <div class="feedback-copy">
      <span class="feedback-label">False Lead</span>
      <span class="feedback-subtext">Reset the scene and try a new move.</span>
    </div>
  </div>
</div>

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/sfx -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="none" loop></audio>
<audio id="sfx_pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="none"></audio>
<audio id="sfx_drop" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="none"></audio>
<audio id="sfx_error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="none"></audio>
<audio id="sfx_success" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="none"></audio>

<script>
/** 
 * ARCADE SPARK SHIFT
 * L0 System Compliant Implementation
 */

// --- System Variables ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let audioUnlocked = false;
let bgm = document.getElementById('bgm_main');
const successFeedback = document.getElementById('success-feedback');
const failFeedback = document.getElementById('fail-feedback');
const audioBank = {
  pickup: document.getElementById('sfx_pickup'),
  drop: document.getElementById('sfx_drop'),
  error: document.getElementById('sfx_error'),
  success: document.getElementById('sfx_success')
};
const sfxLastPlayedAt = {};
let feedbackTimers = { success: null, fail: null };

// --- Game Variables ---
let gameState = 'PLAYING'; // PLAYING, TRANSITION
let lastTime = 0;
let screenShake = 0;
let flashAlpha = 0;
let flashColor = 'white';

// Levels: Initial equation string. Max moves is always 1.
const levels = [
  "6+4=4", // Sol: 0+4=4
  "5+7=2", // Sol: 9-7=2
  "8-4=4", // Sol: 0+4=4
  "6+4=3", // Sol: 5+4=9
  "1-2=9"  // Sol: 1+2=3
];
let levelIdx = 0;
let movesMade = 0;

// Geometry & State
let slotGeom = []; // Array of 25 slots
let sticks = [];   // Array of active sticks
let dragStick = null;
let bgCanvas = null;

// --- Logic Maps ---
const digitMap = {
  '0': [0,1,2,3,4,5], '1': [1,2], '2': [0,1,6,4,3], '3': [0,1,6,2,3],
  '4': [5,6,1,2], '5': [0,5,6,2,3], '6': [0,5,4,3,2,6], '7': [0,1,2],
  '8': [0,1,2,3,4,5,6], '9': [0,5,6,1,2,3]
};
const opMap = { '+': [0,1], '-': [0], '=': [0,1] };
const offsets = [0, 7, 9, 16, 18];

function getBitmask(arr) {
  return arr.reduce((acc, val) => acc | (1 << val), 0);
}
const revMap = {};
for(let k in digitMap) revMap[getBitmask(digitMap[k])] = k;

function strToSlots(str) {
  let slots = [];
  for(let i=0; i<5; i++) {
    let char = str[i];
    let map = (i%2===0) ? digitMap[char] : opMap[char];
    if(map) map.forEach(s => slots.push(offsets[i] + s));
  }
  return slots;
}

function evaluateSticks(activeSticks) {
  let active = activeSticks.map(s => s.slotId);
  let groups = [[], [], [], [], []];
  
  active.forEach(s => {
    if (s >= 18) groups[4].push(s - 18);
    else if (s >= 16) groups[3].push(s - 16);
    else if (s >= 9) groups[2].push(s - 9);
    else if (s >= 7) groups[1].push(s - 7);
    else groups[0].push(s);
  });
  
  let d1 = revMap[getBitmask(groups[0])];
  let o1 = groups[1].length === 2 ? '+' : (groups[1].length === 1 && groups[1][0]===0 ? '-' : null);
  let d2 = revMap[getBitmask(groups[2])];
  let o2 = groups[3].length === 2 ? '=' : null;
  let d3 = revMap[getBitmask(groups[4])];
  
  if(!d1 || !o1 || !d2 || !o2 || !d3) return false;
  
  let left = o1 === '+' ? parseInt(d1) + parseInt(d2) : parseInt(d1) - parseInt(d2);
  return left === parseInt(d3);
}

// --- Initialization & Resize ---
function updateSlotGeom() {
  slotGeom = [];
  let L = cw * 0.12;
  let T = Math.max(4, L * 0.15);
  let spacing = cw * 0.18;
  let startX = cw/2 - 2*spacing;
  
  for(let i=0; i<5; i++) {
    let cx = startX + i*spacing;
    let cy = ch/2;
    let count = (i%2===0) ? 7 : 2;
    
    for(let j=0; j<count; j++) {
      let isHoriz = false, x = 0, y = 0;
      if (i%2===0) {
        if(j===0) { isHoriz=true; x=cx; y=cy-L; }
        if(j===1) { isHoriz=false; x=cx+L/2; y=cy-L/2; }
        if(j===2) { isHoriz=false; x=cx+L/2; y=cy+L/2; }
        if(j===3) { isHoriz=true; x=cx; y=cy+L; }
        if(j===4) { isHoriz=false; x=cx-L/2; y=cy+L/2; }
        if(j===5) { isHoriz=false; x=cx-L/2; y=cy-L/2; }
        if(j===6) { isHoriz=true; x=cx; y=cy; }
      } else if (i===1) {
        if(j===0) { isHoriz=true; x=cx; y=cy; }
        if(j===1) { isHoriz=false; x=cx; y=cy; }
      } else if (i===3) {
        if(j===0) { isHoriz=true; x=cx; y=cy-L/4; }
        if(j===1) { isHoriz=true; x=cx; y=cy+L/4; }
      }
      slotGeom.push({ id: slotGeom.length, x, y, isHoriz, w: isHoriz?L:T, h: isHoriz?T:L });
    }
  }
}

function createBg() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = cw; bgCanvas.height = ch;
  let bCtx = bgCanvas.getContext('2d');

  let grad = bCtx.createRadialGradient(cw * 0.5, ch * 0.45, 0, cw * 0.5, ch * 0.5, Math.max(cw, ch));
  grad.addColorStop(0, '#4d1f28');
  grad.addColorStop(0.45, '#241018');
  grad.addColorStop(1, '#0a0710');
  bCtx.fillStyle = grad;
  bCtx.fillRect(0, 0, cw, ch);

  let topGlow = bCtx.createLinearGradient(0, 0, 0, ch * 0.55);
  topGlow.addColorStop(0, 'rgba(255, 205, 122, 0.16)');
  topGlow.addColorStop(1, 'rgba(255, 205, 122, 0)');
  bCtx.fillStyle = topGlow;
  bCtx.fillRect(0, 0, cw, ch * 0.55);

  bCtx.strokeStyle = 'rgba(255,255,255,0.035)';
  bCtx.lineWidth = 1;
  let gridSize = Math.max(24, Math.min(42, cw * 0.06));
  for (let x = gridSize * 0.5; x < cw; x += gridSize) {
    bCtx.beginPath();
    bCtx.moveTo(x, 0);
    bCtx.lineTo(x, ch);
    bCtx.stroke();
  }
  for (let y = gridSize * 0.5; y < ch; y += gridSize) {
    bCtx.beginPath();
    bCtx.moveTo(0, y);
    bCtx.lineTo(cw, y);
    bCtx.stroke();
  }

  for (let i = 0; i < 26; i++) {
    let x = Math.random() * cw;
    let y = Math.random() * ch;
    let radius = Math.random() * Math.max(18, cw * 0.03) + 8;
    let spark = bCtx.createRadialGradient(x, y, 0, x, y, radius);
    spark.addColorStop(0, i % 2 === 0 ? 'rgba(255, 192, 118, 0.22)' : 'rgba(123, 246, 255, 0.18)');
    spark.addColorStop(1, 'rgba(0,0,0,0)');
    bCtx.fillStyle = spark;
    bCtx.beginPath();
    bCtx.arc(x, y, radius, 0, Math.PI * 2);
    bCtx.fill();
  }

  bCtx.fillStyle = 'rgba(255,255,255,0.045)';
  for(let i = 0; i < cw * ch * 0.002; i++) {
    bCtx.fillRect(Math.random() * cw, Math.random() * ch, 1.4, 1.4);
  }
}

function initLevel() {
  let str = levels[levelIdx];
  let initialSlots = strToSlots(str);
  sticks = initialSlots.map(id => ({
    slotId: id,
    originSlotId: id,
    x: slotGeom[id].x,
    y: slotGeom[id].y
  }));
  movesMade = 0;
  dragStick = null;
  gameState = 'PLAYING';
  document.getElementById('level-text').innerText = `Round 0${levelIdx + 1}`;
}

function initGame() {
  updateSlotGeom();
  createBg();
  initLevel();
  requestAnimationFrame(loop);
}

const ro = new ResizeObserver(entries => {
  for (let entry of entries) {
    cw = entry.contentRect.width;
    ch = entry.contentRect.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
      initialized = true;
      initGame();
    } else {
      updateSlotGeom();
      createBg();
      // Snap sticks to new geom
      sticks.forEach(s => {
        if(s !== dragStick) {
          s.x = slotGeom[s.slotId].x;
          s.y = slotGeom[s.slotId].y;
        }
      });
    }
  }
});

// --- Audio, Feedback & Vibrate ---
function safePlayMedia(el, { loop = false, volume = 1, restart = true } = {}) {
  if (!el) return;
  try {
    el.loop = loop;
    el.volume = volume;
    if (restart) el.currentTime = 0;
    const playPromise = el.play();
    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
  } catch (_) {}
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  safePlayMedia(bgm, { loop: true, volume: 0.2, restart: false });
}

function playSfx(type) {
  const el = audioBank[type];
  if (!el || !audioUnlocked) return;
  const now = performance.now();
  const cooldown = type === 'pickup' ? 70 : 120;
  if (sfxLastPlayedAt[type] && now - sfxLastPlayedAt[type] < cooldown) return;
  sfxLastPlayedAt[type] = now;
  safePlayMedia(el, { volume: type === 'success' ? 0.45 : 0.42 });
}

function showFeedback(type) {
  const card = type === 'success' ? successFeedback : failFeedback;
  if (!card) return;
  card.classList.add('show');
  card.setAttribute('aria-hidden', 'false');
  clearTimeout(feedbackTimers[type]);
  feedbackTimers[type] = setTimeout(() => {
    card.classList.remove('show');
    card.setAttribute('aria-hidden', 'true');
  }, type === 'success' ? 1500 : 900);
}

function vibrate(style) {
  window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
    params: { style }
  });
}

// --- Input Handling ---
function handlePointerDown(e) {
  if (gameState !== 'PLAYING') return;
  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  
  let L = cw * 0.12;
  for(let i=sticks.length-1; i>=0; i--) {
    let s = sticks[i];
    let geom = slotGeom[s.slotId];
    if (Math.abs(mx - s.x) < geom.w/2 + 15 && Math.abs(my - s.y) < geom.h/2 + 15) {
      dragStick = s;
      sticks.splice(i, 1);
      sticks.push(dragStick);
      playSfx('pickup');
      vibrate('light');
      break;
    }
  }
}

function handlePointerMove(e) {
  if (!dragStick) return;
  let rect = canvas.getBoundingClientRect();
  dragStick.x = e.clientX - rect.left;
  dragStick.y = e.clientY - rect.top;
}

function handlePointerUp(e) {
  if (!dragStick) return;
  
  let bestSlot = -1;
  let minDist = Infinity;
  let L = cw * 0.12;
  
  for(let i=0; i<slotGeom.length; i++) {
    if (sticks.some(s => s !== dragStick && s.slotId === i)) continue;
    let geom = slotGeom[i];
    let dist = Math.hypot(dragStick.x - geom.x, dragStick.y - geom.y);
    if (dist < L * 0.8 && dist < minDist) {
      minDist = dist;
      bestSlot = i;
    }
  }
  
  if (bestSlot !== -1) {
    dragStick.slotId = bestSlot;
    playSfx('drop');
    vibrate('medium');
    
    if (bestSlot !== dragStick.originSlotId) {
      movesMade++;
      checkWinCondition();
    }
  } else {
    dragStick.slotId = dragStick.originSlotId;
    playSfx('error');
  }
  
  dragStick = null;
}

function checkWinCondition() {
  if (evaluateSticks(sticks)) {
    gameState = 'TRANSITION';
    flashColor = 'white';
    flashAlpha = 1;
    playSfx('success');
    showFeedback('success');
    vibrate('heavy');
    setTimeout(() => {
      levelIdx = (levelIdx + 1) % levels.length;
      initLevel();
    }, 1500);
  } else if (movesMade >= 1) {
    gameState = 'TRANSITION';
    flashColor = 'red';
    flashAlpha = 0.5;
    screenShake = 12;
    playSfx('error');
    showFeedback('fail');
    vibrate('heavy');
    setTimeout(() => {
      initLevel();
    }, 600);
  }
}

function handleGlobalInput(e) {
  unlockAudio();
  if(e.type === 'pointerdown') handlePointerDown(e);
  if(e.type === 'pointermove') handlePointerMove(e);
  if(e.type === 'pointerup' || e.type === 'pointercancel') handlePointerUp(e);
}

// --- Main Loop & Rendering ---
function drawStick(ctx, x, y, isHoriz, L, T, isGhost, isDragging) {
  ctx.save();
  ctx.translate(x, y);
  if (isGhost) {
    ctx.fillStyle = 'rgba(19, 10, 24, 0.45)';
    ctx.strokeStyle = 'rgba(255, 231, 181, 0.08)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect(isHoriz ? -L/2 : -T/2, isHoriz ? -T/2 : -L/2, isHoriz ? L : T, isHoriz ? T : L, T/2);
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.shadowColor = isDragging ? 'rgba(123, 246, 255, 0.34)' : 'rgba(0,0,0,0.78)';
    ctx.shadowBlur = isDragging ? 24 : 10;
    ctx.shadowOffsetX = isDragging ? 0 : 4;
    ctx.shadowOffsetY = isDragging ? 0 : 5;

    let grad = ctx.createLinearGradient(isHoriz ? -L/2 : 0, isHoriz ? 0 : -L/2, isHoriz ? L/2 : 0, isHoriz ? 0 : L/2);
    grad.addColorStop(0, '#6f3621');
    grad.addColorStop(0.12, '#b25d34');
    grad.addColorStop(0.55, '#ffd39b');
    grad.addColorStop(0.88, '#a14a2a');
    grad.addColorStop(1, '#582110');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.roundRect(isHoriz ? -L/2 : -T/2, isHoriz ? -T/2 : -L/2, isHoriz ? L : T, isHoriz ? T : L, T/2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 250, 230, 0.34)';
    ctx.lineWidth = Math.max(1, T * 0.1);
    ctx.stroke();

    ctx.shadowColor = 'transparent';
    ctx.fillStyle = isDragging ? '#ff6b7c' : '#ff8458';
    ctx.beginPath();
    if (isHoriz) ctx.arc(-L/2 + T/2, 0, T * 0.82, 0, Math.PI * 2);
    else ctx.arc(0, -L/2 + T/2, T * 0.82, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 249, 226, 0.52)';
    ctx.beginPath();
    if (isHoriz) ctx.arc(-L/2 + T * 0.33, -T * 0.12, T * 0.22, 0, Math.PI * 2);
    else ctx.arc(-T * 0.12, -L/2 + T * 0.33, T * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function update(dt) {
  sticks.forEach(s => {
    if (s !== dragStick) {
      let target = slotGeom[s.slotId];
      if(target) {
        s.x += (target.x - s.x) * 15 * dt;
        s.y += (target.y - s.y) * 15 * dt;
      }
    }
  });
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    screenShake *= 0.8;
    if (screenShake < 0.5) screenShake = 0;
  }
  
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
  
  let L = cw * 0.12;
  let T = Math.max(4, L * 0.15);
  
  // Draw empty slots
  slotGeom.forEach(g => drawStick(ctx, g.x, g.y, g.isHoriz, L, T, true, false));
  
  // Draw placed sticks
  sticks.forEach(s => {
    if (s !== dragStick && isFinite(s.x) && isFinite(s.y)) {
      let g = slotGeom[s.slotId];
      drawStick(ctx, s.x, s.y, g.isHoriz, L, T, false, false);
    }
  });
  
  // Draw dragging stick
  if (dragStick && isFinite(dragStick.x) && isFinite(dragStick.y)) {
    let g = slotGeom[dragStick.slotId];
    drawStick(ctx, dragStick.x, dragStick.y, g.isHoriz, L, T, false, true);
  }
  
  ctx.restore();
  
  // Flash
  if (flashAlpha > 0) {
    ctx.fillStyle = flashColor === 'white' ? `rgba(255,255,255,${flashAlpha})` : `rgba(255,0,0,${flashAlpha})`;
    ctx.fillRect(0, 0, cw, ch);
    flashAlpha -= 0.03;
  }
}

function loop(timestamp) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  dt = Math.min(dt, 0.05);
  
  try {
    update(dt);
    draw();
  } catch(e) {
    console.error("Loop error isolated:", e);
  }
}

// --- Boot ---
document.addEventListener('DOMContentLoaded', () => {
  window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
  window.addEventListener('pointermove', handleGlobalInput, { passive: false });
  window.addEventListener('pointerup', handleGlobalInput, { passive: false });
  window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      try { bgm.pause(); } catch (_) {}
    } else if (audioUnlocked) {
      safePlayMedia(bgm, { loop: true, volume: 0.2, restart: false });
    }
  });
  
  // Prevent default touch actions on canvas
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  
  ro.observe(canvas);
});
</script>
