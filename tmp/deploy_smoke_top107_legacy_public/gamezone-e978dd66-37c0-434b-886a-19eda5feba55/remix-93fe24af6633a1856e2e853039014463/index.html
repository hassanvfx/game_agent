<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pet Cart Sort: Arcade Rush</title>
    <!-- [agent-note][stage3] resolved-font: display=Russo One | ui=Rajdhani via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #130f28;
            --bg-mid: #241752;
            --bg-glow: #3d2d7a;
            --panel: rgba(19, 15, 40, 0.82);
            --panel-strong: rgba(31, 23, 68, 0.95);
            --panel-border: rgba(146, 216, 255, 0.55);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #f8f5ff;
            --text-soft: #c6d6ff;
            --accent-calm: #5ab6ff;
            --accent-fast: #ff6b8f;
            --accent-gold: #ffd76a;
            --danger: #ff6b8f;
            --success: #75f2b4;
            --font-display: "Russo One", system-ui, sans-serif;
            --font-ui: "Rajdhani", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #4b3791 0%, var(--bg-mid) 30%, var(--bg-deep) 72%),
                linear-gradient(180deg, #1a1237 0%, #0e0a1f 100%);
            color: var(--text-main);
            font-family: var(--font-ui);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(122, 233, 255, 0.18), transparent 20%),
                radial-gradient(circle at 80% 12%, rgba(255, 107, 143, 0.16), transparent 18%),
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%);
        }

        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        .ui-layer { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .inset-0 { inset: 0; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .w-full { width: 100%; }
        .w-fit { width: fit-content; }
        .max-w-sm { max-width: 24rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .inline-block { display: inline-block; }
        .text-sm { font-size: 0.875rem; line-height: 1.2rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.6rem; }
        .text-2xl { font-size: 1.5rem; line-height: 1.8rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.15rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.45rem; }
        .text-white { color: #ffffff; }
        .ui-screen { display: flex; align-items: center; justify-content: center; }
        .font-display { font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; }
        .font-ui { font-family: var(--font-ui); }

        .bg-black-50 {
            background:
                radial-gradient(circle at center, rgba(18, 12, 44, 0.48), rgba(7, 5, 19, 0.82)),
                rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
        }

        .neo-panel {
            position: relative;
            background: linear-gradient(180deg, rgba(38, 28, 83, 0.92), rgba(18, 13, 42, 0.94));
            border: 2px solid var(--panel-border);
            box-shadow:
                0 18px 35px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 0 20px rgba(90, 182, 255, 0.12);
            border-radius: 20px;
            color: var(--text-main);
        }

        .neo-panel::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 18px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .hud-chip {
            min-width: 6.75rem;
            backdrop-filter: blur(8px);
        }

        .hud-label {
            font-size: 0.7rem;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-soft);
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .hud-value {
            font-family: var(--font-display);
            font-size: 1.1rem;
            line-height: 1.1;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(122, 233, 255, 0.28);
        }

        .lives-value { color: #ffd6df; }

        .level-badge {
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: linear-gradient(135deg, rgba(90, 182, 255, 0.25), rgba(117, 242, 180, 0.22));
        }

        .title-panel {
            overflow: hidden;
        }

        .title-panel::before,
        .modal-panel::before {
            content: "";
            position: absolute;
            inset: auto -10% 60% auto;
            width: 10rem;
            height: 10rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(122, 233, 255, 0.24), transparent 70%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--text-soft);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-mascots {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .hero-mascot {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 16px rgba(0,0,0,0.22);
            animation: mascotFloat 3s ease-in-out infinite;
        }

        .hero-mascot:nth-child(2) { animation-delay: 0.2s; }
        .hero-mascot:nth-child(3) { animation-delay: 0.4s; }
        .hero-mascot:nth-child(4) { animation-delay: 0.6s; }

        .screen-title {
            margin: 0;
            color: #fff7d6;
            text-shadow: 0 0 18px rgba(255, 215, 106, 0.2);
        }

        .screen-subtitle {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.98rem;
            line-height: 1.45;
            font-weight: 600;
        }

        .mode-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.9rem;
        }

        .neo-btn {
            position: relative;
            overflow: hidden;
            color: white;
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow:
                0 12px 22px rgba(0,0,0,0.28),
                inset 0 1px 0 rgba(255,255,255,0.16);
            border-radius: 16px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            font-family: var(--font-display);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: auto;
        }

        .neo-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 48%);
            pointer-events: none;
        }

        .neo-btn:active {
            transform: translateY(2px) scale(0.985);
            box-shadow:
                0 6px 12px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.12);
            filter: brightness(1.06);
        }

        .neo-btn-slow { background: linear-gradient(135deg, #49aaff, #3277ff); }
        .neo-btn-fast { background: linear-gradient(135deg, #ff6b8f, #ff824b); }
        .neo-btn-secondary { background: linear-gradient(135deg, #7b5cff, #a44bff); }

        .btn-meta {
            display: block;
            margin-top: 0.3rem;
            font-family: var(--font-ui);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: none;
            color: rgba(255,255,255,0.82);
        }

        .modal-panel {
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-copy {
            overflow-y: auto;
            width: 100%;
        }

        .modal-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .spark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(4.25rem, 18vw, 6.5rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.18);
            background: rgba(14, 10, 31, 0.45);
            box-shadow: 0 14px 28px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.88);
            transition: opacity 160ms ease, transform 160ms ease;
            will-change: opacity, transform;
        }

        .feedback-gif.show {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif-success {
            right: 0.8rem;
            bottom: 6rem;
        }

        .feedback-gif-fail {
            left: 0.8rem;
            top: 7rem;
        }

        .spark {
            position: absolute;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            box-shadow: 0 0 12px rgba(122, 233, 255, 0.65);
            animation: sparkFloat 2.2s ease-in-out infinite;
        }

        .spark:nth-child(1) { left: 12%; top: 14%; }
        .spark:nth-child(2) { left: 82%; top: 20%; animation-delay: 0.35s; }
        .spark:nth-child(3) { left: 18%; top: 76%; animation-delay: 0.7s; }
        .spark:nth-child(4) { left: 76%; top: 72%; animation-delay: 1.05s; }

        .tip-row {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tip-pill {
            padding: 0.38rem 0.68rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-soft);
            font-size: 0.78rem;
            font-weight: 600;
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.22; }
            50% { transform: translateY(-12px) scale(1.15); opacity: 0.9; }
        }

        @keyframes mascotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (max-width: 640px) {
            .p-8 { padding: 1.35rem; }
            .text-4xl { font-size: 1.9rem; line-height: 2.05rem; }
            .text-3xl { font-size: 1.6rem; line-height: 1.95rem; }
            .text-2xl { font-size: 1.1rem; line-height: 1.45rem; }
            .screen-subtitle { font-size: 0.9rem; }
            #ui-layer { padding: 0.8rem; }
            .hud-chip { min-width: 5.8rem; }
            .hud-value { font-size: 0.95rem; }
            .hero-mascot {
                width: 2.4rem;
                height: 2.4rem;
                font-size: 1.25rem;
            }
            .neo-btn { border-radius: 14px; }
            .feedback-gif-success {
                right: 0.55rem;
                bottom: 5.5rem;
            }
            .feedback-gif-fail {
                left: 0.55rem;
                top: 6.25rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="spark-layer" aria-hidden="true">
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
        </div>
        <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json | keep off playfield -->
        <div class="feedback-gif-layer" aria-hidden="true">
            <img id="success-gif" class="feedback-gif feedback-gif-success" alt="" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
            <img id="fail-gif" class="feedback-gif feedback-gif-fail" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
        <div id="ui-layer" class="ui-layer absolute inset-0 z-50 flex flex-col justify-between p-4">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe two-corner composition -->
            <div id="hud" class="flex justify-between items-start hidden">
                <div class="flex flex-col gap-2">
                    <div class="neo-panel hud-chip px-4 py-2">
                        <div class="hud-label font-ui">Sorted</div>
                        <div class="hud-value"><span id="score-display">0</span></div>
                    </div>
                    <div id="level-badge" class="neo-panel level-badge px-3 py-1 inline-block w-fit">
                        Calm Shift
                    </div>
                </div>
                <div class="neo-panel hud-chip px-4 py-2">
                    <div class="hud-label font-ui">Misses</div>
                    <div class="hud-value lives-value"><span id="lives-display">❤️❤️❤️</span></div>
                </div>
            </div>

            <div id="level-select-screen" class="absolute inset-0 ui-screen pointer-events-auto z-50">
                <div class="neo-panel title-panel p-8 text-center flex flex-col items-center gap-6 max-w-sm w-full mx-4">
                    <div class="hero-badge font-ui">🐾 Neon kennel sorting shift</div>
                    <div class="hero-mascots" aria-hidden="true">
                        <span class="hero-mascot">🐶</span>
                        <span class="hero-mascot">🐱</span>
                        <span class="hero-mascot">🐰</span>
                        <span class="hero-mascot">🦊</span>
                    </div>
                    <h1 class="screen-title text-3xl font-display mb-2">Pet Cart Sort</h1>
                    <p class="screen-subtitle font-ui">Guide each glowing pet orb into the cart with the matching number before the shift gets too crowded.</p>
                    <div class="mode-grid">
                        <button id="slow-btn" class="neo-btn neo-btn-slow text-2xl px-8 py-4 w-full">
                            Calm Shift
                            <span class="btn-meta">Easy pace · steady drops</span>
                        </button>
                        <button id="fast-btn" class="neo-btn neo-btn-fast text-2xl px-8 py-4 w-full">
                            Rush Hour
                            <span class="btn-meta">Quick pace · rapid drops</span>
                        </button>
                    </div>
                    <div class="tip-row">
                        <span class="tip-pill">Drag pet orb</span>
                        <span class="tip-pill">Match the number</span>
                        <span class="tip-pill">Protect all 3 hearts</span>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="hidden absolute inset-0 ui-screen bg-black-50 pointer-events-auto z-40">
                <div class="neo-panel modal-panel p-8 text-center flex flex-col items-center gap-4 max-w-sm w-full mx-4">
                    <div class="modal-copy flex flex-col items-center gap-4">
                        <div class="hero-badge font-ui">🌙 Shift complete</div>
                        <h1 class="screen-title text-4xl font-display mb-2">Shift Over</h1>
                        <p class="screen-subtitle font-ui">Pets sorted this round</p>
                        <p class="hud-value" style="font-size:1.8rem;"><span id="final-score">0</span></p>
                    </div>
                    <div class="modal-actions">
                        <button id="restart-btn" class="neo-btn neo-btn-slow text-xl px-6 py-3 w-full">Run Again</button>
                        <button id="change-level-btn" class="neo-btn neo-btn-secondary text-xl px-6 py-3 w-full">Change Shift</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assets -->
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/sort/fail/warning/gameover from catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_ui_click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
    <audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_success" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
    <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

    <script>
        // --- System & Config ---
        const LEVEL_CONFIG = {
            slow: { baseFallSpeed: 60, spawnInterval: 2000, color: '#5ab6ff', label: 'CALM SHIFT' },
            fast: { baseFallSpeed: 180, spawnInterval: 700, color: '#ff6b8f', label: 'RUSH HOUR' }
        };

        const ENABLE_ANIMATIONS = true;

        let gameConfig = { baseFallSpeed: 60, spawnInterval: 2000 };
        let currentLevel = 'slow';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let lastTime = 0;
        let audioCtx = null;
        let bgmUnlocked = false;
        let gameplayStarted = false;
        let lastWarningAt = 0;
        let gifTimers = { success: null, fail: null };
        const sfxCooldowns = new Map();

        // --- Game State ---
        let gameState = 'LEVEL_SELECT'; // LEVEL_SELECT, PLAYING, GAMEOVER
        let score = 0;
        let lives = 3;
        let carts = [];
        let balls = [];
        let particles = [];
        let draggedBall = null;
        let timeSinceLastSpawn = 0;
        let screenShake = 0;

        const CART_COLORS = [
            '#ff7b8f', '#ff9f56', '#ffd85e', '#78f0ba', '#68ddff',
            '#6f9dff', '#9b7dff', '#d37fff', '#ff79d7', '#ff8baf'
        ];
        const ANIMALS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯'];

        function getDisplayFont(size) {
            return `700 ${Math.max(10, size)}px "Russo One", system-ui, sans-serif`;
        }

        function getUiFont(size, weight = 700) {
            return `${weight} ${Math.max(10, size)}px "Rajdhani", system-ui, sans-serif`;
        }

        function roundedRectPath(x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
        }

        function drawBadge(x, y, w, h, radius, fillA, fillB, stroke, shadow) {
            ctx.save();
            ctx.shadowColor = shadow;
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 8;
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, fillA);
            grad.addColorStop(1, fillB);
            ctx.fillStyle = grad;
            roundedRectPath(x, y, w, h, radius);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 2;
            roundedRectPath(x, y, w, h, radius);
            ctx.stroke();
            ctx.restore();
        }

        // --- Audio System ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function unlockAudio() {
            initAudio();
            if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
            bgmUnlocked = true;
        }

        function playMedia(id, volume = 0.45, { restart = true, cooldown = 0 } = {}) {
            if (!bgmUnlocked) return;
            const now = performance.now();
            const lastPlayed = sfxCooldowns.get(id) || 0;
            if (cooldown && now - lastPlayed < cooldown) return;

            const media = document.getElementById(id);
            if (!media) return;

            try {
                if (restart) media.currentTime = 0;
                media.volume = volume;
                media.play().catch(() => {});
                sfxCooldowns.set(id, now);
            } catch (e) {}
        }

        function syncBgmForState() {
            const bgm = document.getElementById('bgm_main');
            if (!bgm) return;

            bgm.volume = gameState === 'GAMEOVER' ? 0.18 : 0.34;

            if (!bgmUnlocked || gameState === 'LEVEL_SELECT') {
                bgm.pause();
                return;
            }

            bgm.play().catch(() => {});
        }

        function showReactionGif(type) {
            const el = document.getElementById(type === 'success' ? 'success-gif' : 'fail-gif');
            if (!el) return;

            el.classList.add('show');
            if (gifTimers[type]) clearTimeout(gifTimers[type]);
            gifTimers[type] = setTimeout(() => {
                el.classList.remove('show');
            }, type === 'success' ? 900 : 1100);
        }

        function vibrate(type) {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                    params: { style: type }
                });
            } catch (e) {}
        }

        // --- UI System ---
        function setState(newState) {
            gameState = newState;

            document.getElementById('level-select-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');

            if (gameState === 'LEVEL_SELECT') {
                document.getElementById('level-select-screen').classList.remove('hidden');
            } else if (gameState === 'PLAYING') {
                document.getElementById('hud').classList.remove('hidden');
                updateLevelBadge();
            } else if (gameState === 'GAMEOVER') {
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                playMedia('sfx_game_over', 0.42, { cooldown: 1600 });
                showReactionGif('fail');
            }
            syncBgmForState();
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('lives-display').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function updateLevelBadge() {
            const badge = document.getElementById('level-badge');
            const config = LEVEL_CONFIG[currentLevel];
            badge.innerText = config.label;
            badge.style.background = currentLevel === 'fast'
                ? 'linear-gradient(135deg, rgba(255,107,143,0.34), rgba(255,130,75,0.25))'
                : 'linear-gradient(135deg, rgba(90,182,255,0.34), rgba(117,242,180,0.24))';
            badge.style.borderColor = config.color;
        }

        // --- Game Logic ---
        function startLevel(level) {
            currentLevel = level;
            const config = LEVEL_CONFIG[level];
            gameConfig.baseFallSpeed = config.baseFallSpeed;
            gameConfig.spawnInterval = config.spawnInterval;
            initGame();
        }

        function initGame() {
            score = 0;
            lives = 3;
            balls = [];
            particles = [];
            draggedBall = null;
            timeSinceLastSpawn = gameConfig.spawnInterval;
            screenShake = 0;
            lastWarningAt = 0;

            carts = [];
            const cartAreaHeight = ch * 0.30;
            const cartStartY = ch * 0.55;
            const cartW = cw / 5;
            const cartH = cartAreaHeight / 2;

            for (let i = 0; i < 10; i++) {
                const row = Math.floor(i / 5);
                const col = i % 5;
                carts.push({
                    id: i,
                    number: i,
                    color: CART_COLORS[i],
                    animal: ANIMALS[i],
                    count: 0,
                    x: col * cartW,
                    y: cartStartY + row * cartH,
                    w: cartW,
                    h: cartH,
                    scale: 1
                });
            }

            setState('PLAYING');
            unlockAudio();
            syncBgmForState();
        }

        function spawnBall() {
            const radius = Math.min(cw, ch) * 0.06;
            const targetCart = carts[Math.floor(Math.random() * carts.length)];
            const levelMultiplier = currentLevel === 'fast' ? 3 : 1.5;
            balls.push({
                id: Date.now() + Math.random(),
                targetId: targetCart.id,
                color: targetCart.color,
                animal: targetCart.animal,
                x: radius + Math.random() * (cw - radius * 2),
                y: -radius,
                r: radius,
                vx: 0,
                vy: gameConfig.baseFallSpeed + (score * levelMultiplier),
                scale: 1,
                wobble: Math.random() * Math.PI * 2,
                isDragged: false
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 0.5) * 300,
                    life: 1,
                    color: color,
                    size: Math.random() * 10 + 4
                });
            }
        }

        function handleHit(ball, cart) {
            if (ball.targetId === cart.id) {
                score += 10;
                cart.count++;
                cart.scale = 1.3;
                playMedia('sfx_collect', 0.38, { cooldown: 70 });
                playMedia('sfx_success', 0.28, { cooldown: 120 });
                showReactionGif('success');
                vibrate('light');
                createParticles(cart.x + cart.w / 2, cart.y + cart.h / 2, cart.color);
            } else {
                lives--;
                playMedia('sfx_fail', 0.4, { cooldown: 140 });
                if (lives === 1) {
                    playMedia('sfx_warning', 0.34, { cooldown: 800 });
                }
                showReactionGif('fail');
                vibrate('heavy');
                screenShake = 15;
                createParticles(cart.x + cart.w / 2, cart.y + cart.h / 2, '#2b1437');
                if (lives <= 0) setState('GAMEOVER');
            }
            updateHUD();
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;
            dt = Math.min(dt, 0.05);

            if (screenShake > 0) screenShake -= dt * 40;
            if (screenShake < 0) screenShake = 0;

            timeSinceLastSpawn += dt * 1000;
            const currentInterval = Math.max(400, gameConfig.spawnInterval - score * (currentLevel === 'fast' ? 5 : 2));
            if (timeSinceLastSpawn > currentInterval) {
                spawnBall();
                timeSinceLastSpawn = 0;
            }

            carts.forEach(c => {
                if (c.scale > 1) c.scale -= dt * 3;
                if (c.scale < 1) c.scale = 1;
            });

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (!isFinite(b.x) || !isFinite(b.y)) {
                    balls.splice(i, 1);
                    continue;
                }

                if (!b.isDragged) {
                    b.y += b.vy * dt;
                    b.scale = 1;
                    b.wobble += dt * 4;

                    if (b.y - b.r > ch) {
                        lives--;
                        playMedia('sfx_fail', 0.4, { cooldown: 140 });
                        if (lives <= 1 && performance.now() - lastWarningAt > 900) {
                            playMedia('sfx_warning', 0.34, { cooldown: 800 });
                            lastWarningAt = performance.now();
                        }
                        showReactionGif('fail');
                        vibrate('heavy');
                        screenShake = 15;
                        updateHUD();
                        balls.splice(i, 1);
                        if (lives <= 0) setState('GAMEOVER');
                    }
                } else {
                    b.scale = 1.2;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2.5;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawBackground() {
            const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
            bgGrad.addColorStop(0, '#33216d');
            bgGrad.addColorStop(0.5, '#1a123f');
            bgGrad.addColorStop(1, '#0d0a20');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, cw, ch);

            const glowA = ctx.createRadialGradient(cw * 0.2, ch * 0.15, 0, cw * 0.2, ch * 0.15, cw * 0.38);
            glowA.addColorStop(0, 'rgba(104, 221, 255, 0.22)');
            glowA.addColorStop(1, 'rgba(104, 221, 255, 0)');
            ctx.fillStyle = glowA;
            ctx.fillRect(0, 0, cw, ch);

            const glowB = ctx.createRadialGradient(cw * 0.82, ch * 0.1, 0, cw * 0.82, ch * 0.1, cw * 0.28);
            glowB.addColorStop(0, 'rgba(255, 107, 143, 0.18)');
            glowB.addColorStop(1, 'rgba(255, 107, 143, 0)');
            ctx.fillStyle = glowB;
            ctx.fillRect(0, 0, cw, ch);

            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.055)';
            ctx.lineWidth = 1;
            const grid = Math.max(26, Math.min(42, Math.floor(cw / 12)));
            for (let i = 0; i <= cw; i += grid) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, ch);
                ctx.stroke();
            }
            for (let j = 0; j <= ch; j += grid) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(cw, j);
                ctx.stroke();
            }
            ctx.restore();

            const trackY = ch * 0.53;
            const trackGrad = ctx.createLinearGradient(0, trackY, 0, ch);
            trackGrad.addColorStop(0, 'rgba(117, 82, 255, 0.12)');
            trackGrad.addColorStop(1, 'rgba(8, 8, 16, 0.55)');
            ctx.fillStyle = trackGrad;
            ctx.fillRect(0, trackY, cw, ch - trackY);
        }

        function drawCart(c) {
            ctx.save();
            ctx.translate(c.x + c.w / 2, c.y + c.h / 2);
            ctx.scale(c.scale, c.scale);

            const pad = 5;
            const innerW = c.w - pad * 2;
            const innerH = c.h - pad * 2;

            const x = -innerW / 2;
            const y = -innerH / 2;
            drawBadge(x, y + 4, innerW, innerH - 2, 16, 'rgba(8,8,14,0.65)', 'rgba(8,8,14,0.8)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0.12)');
            drawBadge(x, y, innerW, innerH, 16, c.color, 'rgba(22,16,42,0.95)', 'rgba(255,255,255,0.18)', 'rgba(104,221,255,0.08)');

            const shelfY = y + innerH * 0.58;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            roundedRectPath(x + innerW * 0.12, shelfY, innerW * 0.76, innerH * 0.12, 999);
            ctx.fill();

            ctx.shadowColor = 'rgba(255,255,255,0.25)';
            ctx.shadowBlur = 12;
            ctx.font = getUiFont(innerH * 0.34, 700);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff8e8';
            ctx.fillText(c.animal, 0, y + innerH * 0.3);
            ctx.shadowBlur = 0;

            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(23, 13, 45, 0.95)';
            ctx.fillStyle = '#ffffff';
            ctx.font = getDisplayFont(innerH * 0.28);
            ctx.strokeText(String(c.number), -innerW * 0.24, y + innerH * 0.74);
            ctx.fillText(String(c.number), -innerW * 0.24, y + innerH * 0.74);

            ctx.fillStyle = 'rgba(240, 246, 255, 0.92)';
            ctx.font = getUiFont(innerH * 0.17, 700);
            ctx.fillText(`x${c.count}`, innerW * 0.24, y + innerH * 0.75);

            ctx.restore();
        }

        function drawBall(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.scale(b.scale, b.scale);

            const r = Math.max(0, b.r);
            const pulse = ENABLE_ANIMATIONS ? Math.sin(b.wobble) * r * 0.04 : 0;

            ctx.shadowColor = `${b.color}88`;
            ctx.shadowBlur = 18;
            ctx.fillStyle = `${b.color}44`;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.28 + pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(8,10,20,0.45)';
            ctx.beginPath();
            ctx.ellipse(r * 0.08, r * 0.14, r * 1.02, r * 0.98, 0, 0, Math.PI * 2);
            ctx.fill();

            const ballGrad = ctx.createRadialGradient(-r * 0.32, -r * 0.38, r * 0.1, 0, 0, r);
            ballGrad.addColorStop(0, '#ffffff');
            ballGrad.addColorStop(0.18, b.color);
            ballGrad.addColorStop(1, '#1d1838');
            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.38)';
            ctx.beginPath();
            ctx.arc(-r * 0.28, -r * 0.34, r * 0.28, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = getUiFont(r * 0.75, 700);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fffef8';
            ctx.fillText(b.animal || ANIMALS[b.targetId], 0, r * 0.04);

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function draw() {
            drawBackground();

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            carts.forEach(drawCart);
            drawParticles();
            balls.forEach(drawBall);

            ctx.restore();
        }

        function gameLoop(timestamp) {
            try {
                if (!lastTime) lastTime = timestamp;
                const dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                update(dt);
                draw();
            } catch (e) {
                console.error('Loop error:', e);
            }
            requestAnimationFrame(gameLoop);
        }

        // --- Input Handling ---
        function startSelectedLevel(level) {
            unlockAudio();
            playMedia('sfx_ui_click', 0.3, { cooldown: 80 });
            playMedia('sfx_start', 0.36, { cooldown: 160 });
            gameplayStarted = true;
            startLevel(level);
        }

        function restartCurrentLevel() {
            unlockAudio();
            playMedia('sfx_ui_click', 0.3, { cooldown: 80 });
            initGame();
        }

        function returnToLevelSelect() {
            unlockAudio();
            playMedia('sfx_ui_click', 0.3, { cooldown: 80 });
            gameplayStarted = false;
            setState('LEVEL_SELECT');
        }

        function handleGameplayPointer(e) {
            if (gameState !== 'PLAYING') return;

            unlockAudio();
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (e.type === 'pointerdown') {
                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i];
                    const dx = x - b.x;
                    const dy = y - b.y;
                    if (dx * dx + dy * dy <= (b.r * 2) * (b.r * 2)) {
                        b.isDragged = true;
                        draggedBall = b;
                        balls.splice(i, 1);
                        balls.push(b);
                        break;
                    }
                }
            } else if (e.type === 'pointermove') {
                if (draggedBall) {
                    draggedBall.x = x;
                    draggedBall.y = y;
                }
            } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
                if (draggedBall) {
                    draggedBall.isDragged = false;

                    let droppedOnCart = null;
                    for (const c of carts) {
                        if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
                            droppedOnCart = c;
                            break;
                        }
                    }

                    if (droppedOnCart) {
                        handleHit(draggedBall, droppedOnCart);
                        const idx = balls.indexOf(draggedBall);
                        if (idx > -1) balls.splice(idx, 1);
                    }

                    draggedBall = null;
                }
            }
        }

        canvas.addEventListener('pointerdown', handleGameplayPointer, { passive: false });
        window.addEventListener('pointermove', handleGameplayPointer, { passive: false });
        window.addEventListener('pointerup', handleGameplayPointer, { passive: false });
        window.addEventListener('pointercancel', handleGameplayPointer, { passive: false });

        // --- Initialization & Resize ---
        function resize(width, height) {
            cw = width;
            ch = height;
            canvas.width = Math.floor(cw * dpr);
            canvas.height = Math.floor(ch * dpr);
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (!initialized) {
                setState('LEVEL_SELECT');
                initialized = true;
                requestAnimationFrame(gameLoop);
            } else {
                const cartAreaHeight = ch * 0.30;
                const cartStartY = ch * 0.55;
                const cartW = cw / 5;
                const cartH = cartAreaHeight / 2;
                carts.forEach(c => {
                    const row = Math.floor(c.id / 5);
                    const col = c.id % 5;
                    c.x = col * cartW;
                    c.y = cartStartY + row * cartH;
                    c.w = cartW;
                    c.h = cartH;
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('slow-btn').addEventListener('click', () => startSelectedLevel('slow'));
            document.getElementById('fast-btn').addEventListener('click', () => startSelectedLevel('fast'));
            document.getElementById('restart-btn').addEventListener('click', restartCurrentLevel);
            document.getElementById('change-level-btn').addEventListener('click', returnToLevelSelect);

            const ro = new ResizeObserver(entries => {
                for (const entry of entries) {
                    if (entry.target === canvas) {
                        resize(entry.contentRect.width, entry.contentRect.height);
                    }
                }
            });
            ro.observe(canvas);
        });
    </script>
</body>
</html>
