<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Night City Sniper</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #04040a;
            --bg-bottom: #130f2f;
            --panel: rgba(12, 18, 35, 0.82);
            --panel-border: rgba(111, 255, 214, 0.28);
            --panel-glow: rgba(34, 211, 238, 0.18);
            --teal: #79ffe1;
            --cyan: #72d8ff;
            --green: #7cff8d;
            --red: #ff587e;
            --amber: #ffc86b;
            --text: #ebf7ff;
            --muted: #9bb3c7;
            --shadow: rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(82, 230, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            cursor: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 1em;
            border: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 15%, rgba(114, 216, 255, 0.1), transparent 38%),
                linear-gradient(180deg, rgba(5, 10, 22, 0.3), rgba(1, 2, 9, 0.65));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0, rgba(121, 255, 225, 0.05) 50%, transparent 100%);
            background-size: 240px 100%;
            opacity: 0.2;
            mix-blend-mode: screen;
        }

        #game-container::after {
            background:
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04), transparent 16%, transparent 84%, rgba(0, 0, 0, 0.2)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
            opacity: 0.22;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
        }

        .screen-card {
            position: relative;
            width: min(92vw, 420px);
            padding: 20px 18px;
            border-radius: 22px;
            text-align: center;
            pointer-events: auto;
            z-index: 50;
            background:
                linear-gradient(180deg, rgba(13, 24, 45, 0.92), rgba(8, 12, 24, 0.9));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 44px var(--shadow),
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 0 26px var(--panel-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(114, 216, 255, 0.14), transparent 28%),
                radial-gradient(circle at 80% 10%, rgba(124, 255, 141, 0.12), transparent 24%);
            pointer-events: none;
        }

        .screen-card.hidden,
        #hud.hidden {
            display: none;
        }

        .title-font {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .hero-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 76px;
            margin-bottom: 12px;
            border-radius: 50%;
            border: 2px solid rgba(121, 255, 225, 0.55);
            background:
                radial-gradient(circle at 35% 30%, rgba(121, 255, 225, 0.95), rgba(64, 219, 255, 0.3) 55%, rgba(0,0,0,0) 58%),
                linear-gradient(180deg, rgba(17, 24, 39, 0.95), rgba(4, 8, 16, 0.9));
            box-shadow:
                0 0 24px rgba(121, 255, 225, 0.22),
                inset 0 0 22px rgba(114, 216, 255, 0.2);
            color: #03161f;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: 30px;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255,255,255,0.45);
            animation: pulseHalo 2.2s ease-in-out infinite;
        }

        .hero-mark::after {
            content: "◉";
            transform: translateY(-1px);
        }

        .main-title {
            margin: 0 0 8px;
            font-size: clamp(28px, 7vw, 48px);
            color: var(--teal);
            text-shadow: 0 0 14px rgba(114, 216, 255, 0.4);
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: clamp(20px, 4.6vw, 28px);
            line-height: 1.15;
            color: var(--muted);
        }

        .enemy-text {
            color: var(--red);
        }

        .ally-text {
            color: var(--green);
        }

        .intel-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 18px;
            font-size: 20px;
            color: #d2e7f7;
        }

        .intel-chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(114, 216, 255, 0.24);
            background: rgba(7, 16, 30, 0.72);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        .arcade-btn {
            min-width: 190px;
            padding: 12px 20px;
            border-radius: 14px;
            color: #071018;
            background:
                linear-gradient(180deg, var(--green), #53e2c4);
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.28),
                0 0 22px rgba(121, 255, 141, 0.22);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.04);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.32),
                0 0 28px rgba(121, 255, 141, 0.34);
            outline: none;
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: scale(0.97);
            filter: brightness(0.98);
        }

        .arcade-btn.secondary {
            background: linear-gradient(180deg, #eff6ff, #cbd5e1);
            color: #111827;
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.24),
                0 0 20px rgba(255, 255, 255, 0.12);
        }

        .result-title {
            margin: 0 0 10px;
            font-size: clamp(28px, 7vw, 42px);
            color: var(--red);
            text-shadow: 0 0 14px rgba(255, 88, 126, 0.4);
        }

        .score-line {
            margin: 0 0 6px;
            font-size: clamp(22px, 5vw, 30px);
            color: var(--text);
        }

        .score-value {
            color: var(--green);
        }

        .reason-line {
            margin: 0 0 18px;
            font-size: 20px;
            color: var(--muted);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hud-corner {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 14px;
            background: rgba(7, 16, 30, 0.68);
            border: 1px solid rgba(121, 255, 225, 0.18);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.22),
                inset 0 0 0 1px rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-left {
            top: 12px;
            left: 12px;
        }

        .hud-right {
            top: 12px;
            right: 12px;
        }

        .hud-bottom {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 6px 10px;
            border-radius: 12px;
            background: rgba(5, 10, 20, 0.52);
            border: 1px solid rgba(114, 216, 255, 0.14);
            color: rgba(219, 234, 254, 0.72);
            font-size: clamp(18px, 3.4vw, 20px);
            letter-spacing: 0.08em;
        }

        .hud-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.08);
        }

        .hud-icon.score {
            background: radial-gradient(circle, rgba(121,255,141,0.95), rgba(121,255,141,0.24));
            color: #072112;
        }

        .hud-icon.alert {
            background: radial-gradient(circle, rgba(255,88,126,0.95), rgba(255,88,126,0.24));
            color: #2b0612;
        }

        .hud-label {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(14px, 2.8vw, 16px);
            color: #b6cbdd;
            letter-spacing: 0.14em;
        }

        .hud-value {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(22px, 5vw, 30px);
            line-height: 1;
        }

        .hud-value.score {
            color: var(--green);
            text-shadow: 0 0 12px rgba(121, 255, 141, 0.25);
        }

        .hud-value.alert {
            color: var(--red);
            text-shadow: 0 0 12px rgba(255, 88, 126, 0.22);
        }

        .status-strip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 34px;
            margin-top: 4px;
            color: #a6bdd2;
            font-size: 18px;
            letter-spacing: 0.08em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px rgba(121, 255, 141, 0.7);
            animation: pulseDot 1.1s ease-in-out infinite alternate;
        }

        @keyframes pulseHalo {
            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 0 24px rgba(121, 255, 225, 0.22),
                    inset 0 0 22px rgba(114, 216, 255, 0.2);
            }
            50% {
                transform: scale(1.04);
                box-shadow:
                    0 0 30px rgba(121, 255, 225, 0.34),
                    inset 0 0 26px rgba(114, 216, 255, 0.28);
            }
        }

        @keyframes pulseDot {
            from { opacity: 0.5; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1.08); }
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            bottom: 58px;
            width: min(26vw, 120px);
            border-radius: 16px;
            border: 1px solid rgba(121, 255, 225, 0.28);
            background: rgba(5, 10, 20, 0.58);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 25;
            object-fit: cover;
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            right: auto;
            left: 12px;
            bottom: 64px;
            width: min(28vw, 128px);
        }

        @media (max-width: 600px) {
            #ui-layer {
                padding: 12px;
            }

            .screen-card {
                width: min(94vw, 380px);
                padding: 18px 14px;
                border-radius: 18px;
            }

            .hero-mark {
                width: 64px;
                height: 64px;
                margin-bottom: 10px;
                font-size: 26px;
            }

            .intel-row {
                gap: 8px;
                margin-bottom: 16px;
                font-size: 18px;
            }

            .intel-chip {
                padding: 5px 9px;
            }

            .arcade-btn {
                width: 100%;
                min-width: 0;
                padding: 12px 16px;
                border-radius: 12px;
            }

            .hud-corner {
                gap: 7px;
                padding: 7px 10px;
                border-radius: 12px;
            }

            .hud-icon {
                width: 22px;
                height: 22px;
                font-size: 13px;
            }

            .feedback-gif {
                width: min(30vw, 96px);
                right: 10px;
                bottom: 52px;
            }

            .feedback-gif.fail {
                left: 10px;
                bottom: 58px;
                width: min(32vw, 104px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="start-screen" class="screen-card">
                <div class="hero-mark" aria-hidden="true"></div>
                <h1 class="main-title title-font">Night Watch</h1>
                <p class="subtitle">Tag <span class="enemy-text">RED</span> intruders. Protect <span class="ally-text">GREEN</span> residents.</p>
                <div class="intel-row" aria-hidden="true">
                    <span class="intel-chip">◈ Neon Scope</span>
                    <span class="intel-chip">⬢ Rooftop Watch</span>
                </div>
                <div class="status-strip"><span class="status-dot"></span><span>Sector lock established</span></div>
                <button id="start-btn" class="arcade-btn title-font">Start Watch</button>
            </div>

            <div id="game-over-screen" class="screen-card hidden">
                <div class="hero-mark" aria-hidden="true"></div>
                <h2 class="result-title title-font">Watch Breached</h2>
                <div class="score-line">Intruders Tagged: <span id="finalScore" class="score-value">0</span></div>
                <div class="reason-line" id="fail-reason">An intruder slipped away</div>
                <button id="restart-btn" class="arcade-btn secondary title-font">Restart Watch</button>
            </div>

            <div id="hud" class="hidden">
                <!-- [agent-note][stage3] resolved-gif: hit/fail feedback -> catalogs/gifs.json -->
                <img id="hit-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Hit feedback animation" aria-hidden="true">
                <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail feedback animation" aria-hidden="true">
                <div class="hud-corner hud-left">
                    <span class="hud-icon score" aria-hidden="true">✦</span>
                    <div>
                        <div class="hud-label">Tags</div>
                        <div id="score" class="hud-value score">0</div>
                    </div>
                </div>
                <div class="hud-corner hud-right">
                    <span class="hud-icon alert" aria-hidden="true">!</span>
                    <div>
                        <div class="hud-label">Alerts</div>
                        <div id="lives" class="hud-value alert">3</div>
                    </div>
                </div>
                <div class="hud-bottom">WIND: 2.4 m/s NW | ELEV: 140m</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                shot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                alert: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.sfxVolume = {
                    shot: 0.45,
                    score: 0.62,
                    fail: 0.62,
                    alert: 0.42,
                    ui: 0.38
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            prime() {
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minInterval = 90) {
                if (!this.sfx[key]) return;
                const now = performance.now();
                if ((this.lastPlayedAt[key] || 0) + minInterval > now) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolume[key] ?? 0.55;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const hitGif = document.getElementById('hit-gif');
        const failGif = document.getElementById('fail-gif');
        const actionButtons = document.querySelectorAll('.arcade-btn');

        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let spawnTimer = 0;
        let spawnInterval = 120;
        let difficultyMultiplier = 1;

        let mouseX = 0;
        let mouseY = 0;
        let recoilY = 0;

        let buildings = [];
        let targets = [];
        let hitGifTimer = null;
        let failGifTimer = null;

        const scopeRadius = 150;

        actionButtons.forEach(button => {
            button.addEventListener('pointerdown', () => {
                button.classList.add('is-pressed');
                audio.prime();
                audio.playSFX('ui', 0);
            });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(eventName => {
                button.addEventListener(eventName, () => button.classList.remove('is-pressed'));
            });
        });

        function pulseGif(element, timerName, duration = 900) {
            if (!element) return;
            element.classList.add('active');
            clearTimeout(timerName === 'hit' ? hitGifTimer : failGifTimer);
            const timeoutId = window.setTimeout(() => element.classList.remove('active'), duration);
            if (timerName === 'hit') {
                hitGifTimer = timeoutId;
            } else {
                failGifTimer = timeoutId;
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateCity();
        }
        window.addEventListener('resize', resize);

        function generateCity() {
            buildings = [];
            let currentX = 0;
            while (currentX < width) {
                const bWidth = 100 + Math.random() * 150;
                const bHeight = height * 0.4 + Math.random() * height * 0.4;
                const building = {
                    x: currentX,
                    y: height - bHeight,
                    w: bWidth,
                    h: bHeight,
                    windows: [],
                    color: `hsl(${220 + Math.random() * 28}, ${28 + Math.random() * 20}%, ${11 + Math.random() * 10}%)`
                };

                const cols = Math.floor(bWidth / 40);
                const rows = Math.floor(bHeight / 60);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (Math.random() > 0.3) {
                            building.windows.push({
                                x: building.x + 10 + c * 35,
                                y: building.y + 10 + r * 50,
                                w: 20,
                                h: 35,
                                occupied: false
                            });
                        }
                    }
                }
                buildings.push(building);
                currentX += bWidth - 20;
            }
        }

        function initGame() {
            score = 0;
            lives = 3;
            spawnInterval = 120;
            difficultyMultiplier = 1;
            targets = [];
            recoilY = 0;

            buildings.forEach(b => b.windows.forEach(w => w.occupied = false));

            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;

            mouseX = width / 2;
            mouseY = height / 2;
        }

        function spawnTarget() {
            const emptyWindows = [];
            buildings.forEach((b, bIdx) => {
                b.windows.forEach((w, wIdx) => {
                    if (!w.occupied) {
                        emptyWindows.push({ bIdx, wIdx, win: w });
                    }
                });
            });

            if (emptyWindows.length === 0) return;

            const spot = emptyWindows[Math.floor(Math.random() * emptyWindows.length)];
            const isEnemy = Math.random() > 0.3;

            buildings[spot.bIdx].windows[spot.wIdx].occupied = true;

            targets.push({
                x: spot.win.x + spot.win.w / 2,
                y: spot.win.y + spot.win.h / 2,
                w: spot.win.w,
                h: spot.win.h,
                type: isEnemy ? 'enemy' : 'civilian',
                timer: 0,
                maxTimer: isEnemy ? (180 - score * 2) : 200,
                bIdx: spot.bIdx,
                wIdx: spot.wIdx,
                state: 'pop-up'
            });

            if (spawnInterval > 40) spawnInterval -= 1;
        }

        function update() {
            spawnTimer++;
            if (spawnTimer > spawnInterval) {
                spawnTarget();
                spawnTimer = 0;
            }

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                t.timer++;

                if (t.timer >= Math.max(60, t.maxTimer)) {
                    buildings[t.bIdx].windows[t.wIdx].occupied = false;
                    targets.splice(i, 1);

                    if (t.type === 'enemy') {
                        lives--;
                        audio.playSFX('alert', 240);
                        audio.playSFX('fail', 240);
                        pulseGif(failGif, 'fail', 1100);
                        document.getElementById('lives').innerText = lives;
                        if (lives <= 0) gameOver("Too many intruders slipped through.");
                    }
                }
            }

            if (recoilY > 0) recoilY *= 0.8;
        }

        function draw() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#04040a');
            grad.addColorStop(0.45, '#11162f');
            grad.addColorStop(1, '#1e1246');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const moonGlow = ctx.createRadialGradient(width * 0.74, height * 0.18, 20, width * 0.74, height * 0.18, 140);
            moonGlow.addColorStop(0, 'rgba(121, 255, 225, 0.2)');
            moonGlow.addColorStop(0.4, 'rgba(114, 216, 255, 0.1)');
            moonGlow.addColorStop(1, 'rgba(114, 216, 255, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(width * 0.74, height * 0.18, 140, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 24; i++) {
                const starX = (i * 173) % width;
                const starY = 30 + ((i * 97) % Math.max(120, Math.floor(height * 0.42)));
                ctx.fillStyle = i % 3 === 0 ? 'rgba(121, 255, 225, 0.9)' : 'rgba(255,255,255,0.7)';
                ctx.fillRect(starX, starY, 2, 2);
            }

            ctx.save();
            ctx.translate((width / 2 - mouseX) * 0.05, (height / 2 - mouseY) * 0.05);

            buildings.forEach((b, buildingIndex) => {
                const bodyGradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
                bodyGradient.addColorStop(0, b.color);
                bodyGradient.addColorStop(1, 'rgba(5, 8, 18, 0.98)');
                ctx.fillStyle = bodyGradient;
                ctx.fillRect(b.x, b.y, b.w, b.h);

                ctx.fillStyle = 'rgba(114, 216, 255, 0.12)';
                ctx.fillRect(b.x + 4, b.y + 8, Math.max(2, b.w * 0.05), Math.max(10, b.h * 0.5));

                if (buildingIndex % 2 === 0) {
                    ctx.strokeStyle = 'rgba(121, 255, 225, 0.08)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y + 14);
                    ctx.lineTo(b.x + b.w, b.y + 8);
                    ctx.stroke();
                }

                b.windows.forEach(w => {
                    const frameGradient = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
                    frameGradient.addColorStop(0, '#040812');
                    frameGradient.addColorStop(1, '#02050a');
                    ctx.fillStyle = frameGradient;
                    ctx.fillRect(w.x, w.y, w.w, w.h);

                    ctx.fillStyle = 'rgba(114, 216, 255, 0.1)';
                    ctx.fillRect(w.x + 2, w.y + 2, w.w - 4, Math.max(4, w.h * 0.35));

                    ctx.strokeStyle = 'rgba(121, 255, 225, 0.08)';
                    ctx.strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
                });
            });

            targets.forEach(t => {
                const isEnemy = t.type === 'enemy';
                const coreColor = isEnemy ? '#ff587e' : '#7cff8d';
                const glowColor = isEnemy ? 'rgba(255, 88, 126, 0.28)' : 'rgba(124, 255, 141, 0.24)';

                let drawHeight = t.h;
                if (t.timer < 10) drawHeight = t.h * (t.timer / 10);

                const figureY = t.y + t.h / 2 - drawHeight;

                ctx.save();
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 14;

                ctx.fillStyle = coreColor;
                ctx.beginPath();
                ctx.arc(t.x, figureY + 8, 6.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(t.x - 7, figureY + 15);
                ctx.lineTo(t.x + 7, figureY + 15);
                ctx.lineTo(t.x + 10, figureY + 31);
                ctx.lineTo(t.x - 10, figureY + 31);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isEnemy ? 'rgba(255, 200, 220, 0.95)' : 'rgba(210, 255, 220, 0.95)';
                ctx.fillRect(t.x - 1, figureY + 18, 2, 9);

                if (isEnemy) {
                    ctx.fillStyle = 'rgba(255, 240, 120, 0.9)';
                    ctx.fillRect(t.x - 8, figureY + 4, 3, 2);
                    ctx.fillRect(t.x + 5, figureY + 4, 3, 2);
                } else {
                    ctx.fillStyle = 'rgba(114, 216, 255, 0.9)';
                    ctx.beginPath();
                    ctx.arc(t.x, figureY + 5, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                if (isEnemy && t.timer > t.maxTimer - 60) {
                    if (Math.floor(Date.now() / 100) % 2 === 0) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(t.x - 12, t.y - 16, 24, 38);
                    }
                }
            });
            ctx.restore();

            const scopeX = mouseX;
            const scopeY = mouseY - recoilY;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.beginPath();
            ctx.rect(0, 0, width, height);
            ctx.arc(scopeX, scopeY, scopeRadius, 0, Math.PI * 2, true);
            ctx.fill();

            const lensGradient = ctx.createRadialGradient(scopeX, scopeY, 12, scopeX, scopeY, scopeRadius);
            lensGradient.addColorStop(0, 'rgba(121, 255, 225, 0.08)');
            lensGradient.addColorStop(0.7, 'rgba(121, 255, 225, 0.04)');
            lensGradient.addColorStop(1, 'rgba(121, 255, 225, 0)');
            ctx.fillStyle = lensGradient;
            ctx.beginPath();
            ctx.arc(scopeX, scopeY, scopeRadius - 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(121, 255, 225, 0.84)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, scopeY);
            ctx.lineTo(width, scopeY);
            ctx.moveTo(scopeX, 0);
            ctx.lineTo(scopeX, height);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(scopeX, scopeY, scopeRadius, 0, Math.PI * 2);
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(scopeX, scopeY, scopeRadius - 2, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(114, 216, 255, 0.4)';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(121, 255, 225, 0.55)';
            ctx.beginPath();
            ctx.arc(scopeX, scopeY, 26, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ff6b83';
            ctx.beginPath();
            ctx.arc(scopeX, scopeY, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(121, 255, 225, 0.7)';
            for (let i = 1; i < 4; i++) {
                ctx.fillRect(scopeX - 10, scopeY + i * 30, 20, 1.5);
            }
            for (let i = 1; i < 4; i++) {
                ctx.fillRect(scopeX + i * 30, scopeY - 10, 1.5, 20);
                ctx.fillRect(scopeX - i * 30, scopeY - 10, 1.5, 20);
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, width, height);
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver(reason) {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0);
            pulseGif(failGif, 'fail', 1400);
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('fail-reason').innerText = reason;
            canvas.style.cursor = 'default';
        }

        function shoot() {
            if (!gameActive) return;

            audio.playSFX('shot');
            recoilY = 30;

            const parallaxX = (width / 2 - mouseX) * 0.05;
            const parallaxY = (height / 2 - mouseY) * 0.05;

            const aimX = mouseX - parallaxX;
            const aimY = mouseY - parallaxY;

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const dx = aimX - t.x;
                const dy = aimY - (t.y + 5);

                if (Math.sqrt(dx * dx + dy * dy) < 25) {
                    buildings[t.bIdx].windows[t.wIdx].occupied = false;
                    targets.splice(i, 1);

                    if (t.type === 'enemy') {
                        score += 100;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('score', 70);
                        pulseGif(hitGif, 'hit', 700);
                        if (score % 500 === 0) {
                            lives = Math.min(lives + 1, 5);
                            audio.playSFX('alert', 0);
                        }
                    } else {
                        audio.playSFX('fail', 0);
                        pulseGif(failGif, 'fail', 1400);
                        gameOver("Resident tagged. Watch ended.");
                    }
                    break;
                }
            }
        }

        window.addEventListener('mousemove', e => {
            if (!gameActive) return;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // [agent-note][stage4] repaired: mobile-tap-actionability | scope: canvas-only touch handlers | reason: preserve native taps for start/restart buttons
        canvas.addEventListener('touchmove', e => {
            if (!gameActive) return;
            e.preventDefault();
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('mousedown', () => {
            if (gameActive) shoot();
        });

        canvas.addEventListener('touchstart', e => {
            if (gameActive) {
                e.preventDefault();
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                shoot();
            }
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.playSFX('ui', 0);
            audio.playBGM();
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            canvas.style.cursor = 'none';
            resize();
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.playSFX('ui', 0);
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            canvas.style.cursor = 'none';
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        resize();
    });
    </script>
</body>
