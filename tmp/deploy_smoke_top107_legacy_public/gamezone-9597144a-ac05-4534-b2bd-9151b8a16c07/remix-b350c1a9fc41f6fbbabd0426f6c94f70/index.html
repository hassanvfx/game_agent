<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>100 Clicks Cat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --pink-50: #fff7fb;
            --pink-100: #ffe3f0;
            --pink-200: #ffc7dd;
            --pink-400: #ff76af;
            --pink-500: #ff4e96;
            --pink-600: #eb2c7f;
            --pink-700: #c81b63;
            --purple-500: #8c66ff;
            --purple-600: #6841e3;
            --cream-100: #fff9f3;
            --ink-900: #301b36;
            --white-glass: rgba(255, 255, 255, 0.5);
            --white-glass-strong: rgba(255, 255, 255, 0.72);
            --white-border: rgba(255, 255, 255, 0.78);
            --shadow-pink: rgba(255, 78, 150, 0.28);
            --shadow-deep: rgba(92, 47, 123, 0.28);
            --gold-300: #ffd66e;
            --gold-500: #ffb703;
            --green-300: #8af1ba;
            --green-400: #47dc88;
            --green-600: #149f5a;
            --sparkle: rgba(255, 255, 255, 0.65);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.85), transparent 35%),
                linear-gradient(180deg, #ffcce2 0%, #ffb3d7 48%, #ff9ccc 100%);
            color: var(--ink-900);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.5), transparent 18%),
                radial-gradient(circle at 80% 15%, rgba(255, 255, 255, 0.38), transparent 16%),
                linear-gradient(180deg, #ffd8ea 0%, #ffbbd9 100%);
            user-select: none;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            inset: auto;
            width: 11rem;
            height: 11rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            filter: blur(6px);
        }

        .game-container::before {
            top: -2rem;
            left: -2rem;
        }

        .game-container::after {
            right: -3rem;
            bottom: 12%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 241, 248, 0.72));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--white-border);
            box-shadow:
                0 16px 36px 0 var(--shadow-pink),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            border-radius: 24px;
        }

        .card {
            pointer-events: auto;
            transition: 0.3s ease;
            max-width: 22rem;
            width: calc(100% - 2rem);
            margin: 1rem;
            padding: 1.75rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0.6rem;
            border-radius: 18px;
            border: 1px dashed rgba(255, 117, 175, 0.35);
            pointer-events: none;
        }

        .title-icon {
            font-size: 3.75rem;
            margin-bottom: 1rem;
            width: 4.75rem;
            height: 4.75rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fffdfd, #ffd3e5 70%, #ffb3d1 100%);
            box-shadow:
                0 10px 22px rgba(255, 91, 154, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: clamp(2.6rem, 8vw, 3.4rem);
            line-height: 0.9;
            color: var(--pink-500);
            letter-spacing: 0.06em;
            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white,
                0 6px 12px rgba(255, 255, 255, 0.25);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--pink-600);
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 16rem;
        }

        .instruction-box {
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 236, 245, 0.88));
            color: var(--pink-700);
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 131, 181, 0.3);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .instruction-box p {
            margin: 0;
        }

        .instruction-box p + p {
            margin-top: 0.35rem;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .btn {
            border: 0;
            color: white;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, border-bottom-width 120ms ease;
            box-shadow: 0 10px 20px rgba(93, 47, 123, 0.2);
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            border-bottom-width: 0;
        }

        .btn-primary {
            background: linear-gradient(180deg, #ff83bb, var(--pink-500));
            border-bottom: 4px solid var(--pink-700);
            padding: 1rem 3rem;
            border-radius: 999px;
            font-size: 1.8rem;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-success {
            background: linear-gradient(180deg, #6df0a1, var(--green-400));
            border-bottom: 4px solid var(--green-600);
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: 1.5rem;
        }

        .btn-success:hover {
            filter: brightness(1.05);
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        .hud-block {
            display: flex;
            flex-direction: column;
        }

        .hud-block.end {
            align-items: flex-end;
        }

        .hud-label {
            width: fit-content;
            margin-bottom: 0.25rem;
            padding: 0.28rem 0.6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 12px rgba(93, 47, 123, 0.08);
        }

        .hud-label.progress {
            color: var(--pink-500);
        }

        .hud-label.time {
            color: var(--purple-500);
        }

        .hud-value {
            margin: 0;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            line-height: 1;
            text-shadow:
                -1px -1px 0 white,
                1px -1px 0 white,
                -1px 1px 0 white,
                1px 1px 0 white;
        }

        .hud-value.progress {
            font-size: clamp(2.3rem, 7vw, 3.2rem);
            color: var(--pink-500);
        }

        .hud-value.time {
            font-size: clamp(2rem, 6vw, 2.7rem);
            color: var(--purple-500);
        }

        .victory-time {
            margin: 0 0 0.5rem;
            color: var(--pink-600);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .victory-time span {
            color: var(--purple-600);
            font-size: 2.3rem;
            font-family: 'Bangers', 'Rajdhani', sans-serif;
        }

        .victory-copy {
            margin: 0 0 2rem;
            color: var(--pink-500);
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce-icon {
            0%, 100% { transform: translateY(-10%); }
            50% { transform: translateY(0); }
        }

        .animate-pulse-scale {
            animation: pulse-scale 1.5s infinite ease-in-out;
        }

        .animate-bounce {
            animation: bounce-icon 1s infinite;
        }

        .reaction-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-badge,
        .reaction-gif {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            will-change: transform, opacity;
        }

        .reaction-badge {
            left: 50%;
            top: 6.5rem;
            transform: translate(-50%, -0.35rem) scale(0.92);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 8px 18px rgba(93, 47, 123, 0.16);
            color: var(--pink-700);
            font-family: 'Bangers', 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .reaction-badge.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .reaction-gif {
            width: clamp(5.5rem, 18vw, 7.25rem);
            height: clamp(5.5rem, 18vw, 7.25rem);
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 12px 24px rgba(93, 47, 123, 0.18);
            background: rgba(255, 255, 255, 0.32);
            transform: scale(0.82);
        }

        .reaction-gif.show {
            opacity: 0.94;
            transform: scale(1);
        }

        .reaction-gif.hit {
            right: 1rem;
            bottom: 5.75rem;
        }

        .reaction-gif.win {
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) scale(0.82);
        }

        .reaction-gif.win.show {
            transform: translateX(-50%) scale(1);
        }

        /* [agent-note][stage4] repaired: font-remap | source: removed non-catalog title display refs | replacement: Bangers + Rajdhani from catalogs/fonts.json */
        /* [agent-note][stage3] resolved-gif: hit + win overlays -> catalogs/gifs.json */
        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */

        @media (max-width: 480px) {
            .card {
                padding: 1.35rem;
            }

            .title-icon {
                width: 4rem;
                height: 4rem;
                font-size: 3rem;
            }

            .title {
                font-size: clamp(2.2rem, 11vw, 3rem);
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn-primary,
            .btn-success {
                width: 100%;
                max-width: 16rem;
                padding-inline: 1.25rem;
            }

            .reaction-badge {
                top: 5.6rem;
                max-width: calc(100vw - 2rem);
                text-overflow: ellipsis;
                overflow: hidden;
            }

            .reaction-gif.hit {
                right: 0.75rem;
                bottom: 5rem;
            }

            .reaction-gif.win {
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel card">
                <div class="title-icon animate-pulse-scale">🐱</div>
                <h1 class="title">100 CLICKS<br>CAT</h1>
                <p class="subtitle">Catch the cat 100 times!</p>
                <div class="instruction-box">
                    <p>Tap the cat as fast as you can.</p>
                    <p>It moves every time you touch it!</p>
                </div>
                <button id="start-btn" class="btn btn-primary">Start Meow</button>
            </div>

            <div id="victory-screen" class="panel card hidden">
                <div class="title-icon animate-bounce">😻</div>
                <h2 class="title" style="color: var(--purple-500);">Purr-fect!</h2>
                <p class="victory-time">Time: <span id="finalTime">0.0s</span></p>
                <p class="victory-copy">You clicked that cat 100 times!</p>
                <button id="restart-btn" class="btn btn-success">Play Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label progress">Progress</span>
                    <p class="hud-value progress"><span id="score">0</span>/100</p>
                </div>
                <div class="hud-block end">
                    <span class="hud-label time">Time</span>
                    <p id="timer" class="hud-value time">0.0s</p>
                </div>
            </div>

            <div class="reaction-layer" aria-hidden="true">
                <div id="reaction-badge" class="reaction-badge">Combo purr!</div>
                <img id="hit-gif" class="reaction-gif hit" alt="Hit reaction effect">
                <img id="win-gif" class="reaction-gif win" alt="Victory reaction effect">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & CONFIG */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                victory: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp",
                win: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            }
        };

        const COLORS = {
            bgTop: '#FFE6F1',
            bgBot: '#FFAFD4',
            star: 'rgba(255, 255, 255, 0.55)',
            cloud: 'rgba(255, 244, 250, 0.78)',
            catBody: '#FFC857',
            catBodyShade: '#F7A531',
            catEars: '#F28F3B',
            catInnerEar: '#FFCEE0',
            catWhite: '#FFFDFB',
            catEyes: '#2B2136',
            catCape: '#9B5DE5',
            catCapeDark: '#6E3EC8',
            catCheek: '#FF8DB4',
            catNose: '#FF8B94'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.sfxLimitAt = 0;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.victoryLoop = this.createLoop(ASSETS.victoryLoop, 0.24);
                this.sfx = {
                    tap: this.createOneShot(ASSETS.sfx.tap, 0.42),
                    start: this.createOneShot(ASSETS.sfx.start, 0.5),
                    victory: this.createOneShot(ASSETS.sfx.victory, 0.55),
                    restart: this.createOneShot(ASSETS.sfx.restart, 0.45)
                };
            }

            createLoop(src, volume) {
                const audio = new Audio(src);
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            createOneShot(src, volume) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                return audio;
            }

            unlock() {
                this.enabled = true;
            }

            playLoop(target) {
                if (!this.enabled || !target) return;
                target.play().catch(() => {});
            }

            stopLoop(target, reset = true) {
                if (!target) return;
                target.pause();
                if (reset) target.currentTime = 0;
            }

            playBGM() {
                this.stopLoop(this.victoryLoop);
                this.playLoop(this.bgm);
            }

            playVictoryLoop() {
                this.stopLoop(this.bgm);
                this.playLoop(this.victoryLoop);
            }

            stopAllLoops() {
                this.stopLoop(this.bgm);
                this.stopLoop(this.victoryLoop);
            }

            playTap() {
                const now = performance.now();
                if (!this.enabled || now - this.sfxLimitAt < 55) return;
                this.sfxLimitAt = now;
                const clone = this.sfx.tap.cloneNode();
                clone.volume = this.sfx.tap.volume;
                clone.playbackRate = 0.94 + Math.random() * 0.18;
                clone.play().catch(() => {});
            }

            playCue(name) {
                if (!this.enabled || !this.sfx[name]) return;
                const cue = this.sfx[name];
                cue.currentTime = 0;
                cue.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionBadge = document.getElementById('reaction-badge');
        const hitGif = document.getElementById('hit-gif');
        const winGif = document.getElementById('win-gif');
        hitGif.src = ASSETS.gifs.hit;
        winGif.src = ASSETS.gifs.win;

        let width, height;
        let gameActive = false;
        let score = 0;
        const TARGET_SCORE = 100;
        let startTime = 0;
        let particles = [];
        let badgeTimeout = 0;
        let hitGifTimeout = 0;
        let winGifTimeout = 0;

        let cat = {
            x: 0,
            y: 0,
            radius: 50,
            scale: 1,
            targetScale: 1,
            rotation: 0,
            faceColor: COLORS.catBody
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (cat.x > width || cat.y > height) moveCat();
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. VISUALS */
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.bgTop);
            grad.addColorStop(1, COLORS.bgBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.18, 20, width * 0.5, height * 0.18, width * 0.5);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            const timeOffset = Date.now() * 0.0009;
            for (let i = 0; i < 9; i++) {
                const puffX = (i / 8) * width + Math.sin(timeOffset + i) * 18;
                const puffY = height * (0.12 + (i % 3) * 0.08);
                ctx.fillStyle = COLORS.cloud;
                ctx.beginPath();
                ctx.arc(puffX, puffY, 26, 0, Math.PI * 2);
                ctx.arc(puffX + 24, puffY + 4, 22, 0, Math.PI * 2);
                ctx.arc(puffX - 24, puffY + 8, 18, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < 24; i++) {
                const twinkle = (Date.now() * 0.002 + i) % (Math.PI * 2);
                const x = (i * 83) % width;
                const y = 40 + ((i * 57) % Math.max(height - 80, 80));
                const radius = 1.5 + (Math.sin(twinkle) + 1) * 1.4;
                ctx.fillStyle = COLORS.star;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCat(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.scale(c.scale, c.scale);
            ctx.rotate(c.rotation);

            const bob = Math.sin(Date.now() * 0.012) * 2.5;
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(155, 93, 229, 0.22)';
            ctx.beginPath();
            ctx.ellipse(0, 74, 42, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCape;
            ctx.beginPath();
            ctx.moveTo(-38, 0);
            ctx.quadraticCurveTo(0, 64, 38, 0);
            ctx.quadraticCurveTo(10, 16, -38, 0);
            ctx.fill();

            ctx.fillStyle = COLORS.catCapeDark;
            ctx.beginPath();
            ctx.moveTo(-18, 10);
            ctx.quadraticCurveTo(0, 48, 18, 10);
            ctx.quadraticCurveTo(0, 24, -18, 10);
            ctx.fill();

            ctx.fillStyle = COLORS.catEars;
            ctx.beginPath();
            ctx.moveTo(-35, -26);
            ctx.lineTo(-50, -58);
            ctx.lineTo(-15, -44);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(35, -26);
            ctx.lineTo(50, -58);
            ctx.lineTo(15, -44);
            ctx.fill();

            ctx.fillStyle = COLORS.catInnerEar;
            ctx.beginPath();
            ctx.moveTo(-32, -31);
            ctx.lineTo(-40, -48);
            ctx.lineTo(-21, -40);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(32, -31);
            ctx.lineTo(40, -48);
            ctx.lineTo(21, -40);
            ctx.fill();

            const furGradient = ctx.createRadialGradient(-8, -16, 16, 0, 0, 56);
            furGradient.addColorStop(0, '#FFE6A8');
            furGradient.addColorStop(0.6, c.faceColor);
            furGradient.addColorStop(1, COLORS.catBodyShade);
            ctx.fillStyle = furGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 10, 12, -0.12, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 10, 12, 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catEyes;
            ctx.beginPath();
            ctx.ellipse(-20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(20, -8, 4.4, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-18, -11, 1.4, 0, Math.PI * 2);
            ctx.arc(22, -11, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catCheek;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.ellipse(-25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.ellipse(25, 12, 9, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = COLORS.catWhite;
            ctx.beginPath();
            ctx.ellipse(0, 18, 18, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.catNose;
            ctx.beginPath();
            ctx.moveTo(-5, 8);
            ctx.lineTo(5, 8);
            ctx.lineTo(0, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 15);
            ctx.lineTo(-6, 21);
            ctx.moveTo(0, 15);
            ctx.lineTo(6, 21);
            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = '#6A432B';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-30, 7); ctx.lineTo(-60, 2);
            ctx.moveTo(-30, 12); ctx.lineTo(-60, 12);
            ctx.moveTo(-30, 17); ctx.lineTo(-60, 22);
            ctx.moveTo(30, 7); ctx.lineTo(60, 2);
            ctx.moveTo(30, 12); ctx.lineTo(60, 12);
            ctx.moveTo(30, 17); ctx.lineTo(60, 22);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.ellipse(-12, -24, 10, 6, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function flashBadge(message, tone = 'default') {
            reactionBadge.textContent = message;
            reactionBadge.style.color = tone === 'victory' ? 'var(--green-600)' : 'var(--pink-700)';
            reactionBadge.classList.add('show');
            clearTimeout(badgeTimeout);
            badgeTimeout = setTimeout(() => reactionBadge.classList.remove('show'), 900);
        }

        function flashGif(element, timeoutRefName, duration = 1100) {
            element.classList.add('show');
            clearTimeout(timeoutRefName === 'hit' ? hitGifTimeout : winGifTimeout);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (timeoutRefName === 'hit') {
                hitGifTimeout = timer;
            } else {
                winGifTimeout = timer;
            }
        }

        function createParticles(x, y) {
            const colors = ['#FFF', '#FFEB3B', '#FF4081', '#00BCD4'];
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 4,
                    life: 1.0,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.size *= 0.95;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /** 5. GAME LOGIC */
        function moveCat() {
            const padding = 80;
            cat.x = padding + Math.random() * (width - padding * 2);
            cat.y = padding + Math.random() * (height - padding * 2);

            cat.scale = 0.5;
            cat.targetScale = 1.0;
            cat.rotation = (Math.random() - 0.5) * 0.5;
        }

        function initGame() {
            score = 0;
            updateHUD();
            particles = [];
            moveCat();
            cat.x = width / 2;
            cat.y = height / 2;
            reactionBadge.classList.remove('show');
            hitGif.classList.remove('show');
            winGif.classList.remove('show');

            startTime = Date.now();
            gameActive = true;
            audio.playBGM();

            requestAnimationFrame(gameLoop);
        }

        function checkClick(inputX, inputY) {
            if (!gameActive) return;

            const dx = inputX - cat.x;
            const dy = inputY - cat.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cat.radius * 1.5) {
                score++;
                audio.playTap();
                createParticles(cat.x, cat.y);

                if (score === 1) {
                    flashBadge('Cat spotted!');
                } else if (score % 25 === 0) {
                    flashBadge(`Paw combo ${score}!`);
                    flashGif(hitGif, 'hit', 950);
                }

                if (score >= TARGET_SCORE) {
                    winGame();
                } else {
                    moveCat();
                }
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
        }

        function updateTimer() {
            if (!gameActive) return;
            const now = Date.now();
            const diff = (now - startTime) / 1000;
            document.getElementById('timer').innerText = diff.toFixed(1) + "s";
        }

        function winGame() {
            gameActive = false;
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('finalTime').innerText = finalTime + "s";

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            flashBadge('Purr-fect clear!', 'victory');
            flashGif(winGif, 'win', 2200);
            audio.playCue('victory');
            audio.playVictoryLoop();

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createParticles(width / 2 + (Math.random() - 0.5) * 200, height / 2 + (Math.random() - 0.5) * 200);
                }, i * 100);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (gameActive) {
                cat.scale += (cat.targetScale - cat.scale) * 0.2;
                drawCat(cat);
                updateTimer();
            }

            drawParticles();

            if (gameActive || particles.length > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        /** 6. INPUTS */
        function handleInput(e) {
            e.preventDefault();
            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            checkClick(x, y);
        }

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playCue('restart');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
    });
    </script>
</body>
</html>
