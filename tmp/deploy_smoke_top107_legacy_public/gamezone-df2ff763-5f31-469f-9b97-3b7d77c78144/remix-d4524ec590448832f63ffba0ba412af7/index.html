<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Style Showcase</title>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide, ui=Rajdhani via catalogs/fonts.json -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap');

        :root {
            --pink-500: #ec4899;
            --pink-400: #f472b6;
            --pink-300: #f9a8d4;
            --blue-300: #93c5fd;
            --purple-300: #d8b4fe;
            --purple-500: #a855f7;
            --orange-200: #fed7aa;
            --red-300: #fca5a5;
            --red-400: #f87171;
            --yellow-300: #fde047;
            --yellow-400: #facc15;
            --white: #ffffff;
            --gray-600: #4b5563;
            --ink-900: #2f163a;
            --ink-700: #5f2a73;
            --sky-100: #fff9ff;
            --panel-glow: rgba(255, 255, 255, 0.75);
            --sparkle: rgba(255, 255, 255, 0.68);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 32%),
                linear-gradient(180deg, #ffe0f2 0%, #ffd5e7 42%, #f8c5ff 100%);
            color: var(--ink-900);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }

        .display-font {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .text-white { color: var(--white); }
        .text-gray-600 { color: var(--gray-600); }
        .text-pink-400 { color: var(--pink-400); }
        .text-pink-500 { color: var(--pink-500); }
        .text-yellow-400 { color: var(--yellow-400); }
        .text-transparent { color: transparent; }

        .text-lg { font-size: clamp(1rem, 1.8vw, 1.25rem); }
        .text-xl { font-size: clamp(1.1rem, 2vw, 1.5rem); }
        .text-2xl { font-size: clamp(1.25rem, 2.4vw, 1.75rem); }
        .text-4xl { font-size: clamp(2rem, 5vw, 2.75rem); }
        .text-6xl { font-size: clamp(2.5rem, 8vw, 4.5rem); }
        .text-8xl { font-size: clamp(3.5rem, 12vw, 6rem); }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .bottom-10 { bottom: 2.5rem; }
        .bottom-32 { bottom: 8rem; }
        .right-6 { right: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { width: 100%; height: 100%; }
        .max-w-md { max-width: 28rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .my-6 { margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-8 { padding: 2rem; }
        .p-10 { padding: 2.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }

        .flex { display: flex; }
        .hidden { display: none !important; }
        .inline-block { display: inline-block; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }

        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }

        .rounded-2xl { border-radius: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .border-2 { border: 2px solid rgba(255, 255, 255, 0.95); }
        .border-4 { border: 4px solid; }
        .border-white { border-color: rgba(255, 255, 255, 0.95); }
        .border-pink-300 { border-color: var(--pink-300); }

        .shadow-md { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); }
        .shadow-lg { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18); }
        .shadow-xl { box-shadow: 0 18px 40px rgba(255, 105, 180, 0.2); }
        .hover\:shadow-2xl:hover { box-shadow: 0 22px 48px rgba(255, 105, 180, 0.28); }
        .drop-shadow-sm { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12)); }
        .drop-shadow-md { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.16)); }

        .transition { transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, opacity 0.25s ease; }
        .duration-500 { transition-duration: 0.5s; }
        .transform { transform-origin: center; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:scale-110:hover { transform: scale(1.1); }
        .hover\:bg-pink-600:hover { background-color: #db2777; }

        .bg-white { background-color: rgba(255, 255, 255, 0.95); }
        .bg-pink-300 { background-color: var(--pink-300); }
        .bg-pink-400 { background-color: var(--pink-400); }
        .bg-blue-300 { background-color: var(--blue-300); }
        .bg-purple-300 { background-color: var(--purple-300); }
        .bg-purple-500 { background-color: var(--purple-500); }
        .bg-orange-200 { background-color: var(--orange-200); }
        .bg-red-300 { background-color: var(--red-300); }
        .bg-red-400 { background-color: var(--red-400); }
        .bg-yellow-300 { background-color: var(--yellow-300); }

        .bg-clip-text {
            -webkit-background-clip: text;
            background-clip: text;
        }

        .bg-gradient-to-r {
            background-image: linear-gradient(90deg, var(--pink-500), var(--purple-500));
        }

        .glass-panel {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 241, 250, 0.72));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 16px 36px rgba(161, 55, 138, 0.18);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, var(--panel-glow), transparent 24%),
                radial-gradient(circle at 85% 10%, rgba(255, 200, 233, 0.72), transparent 22%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.22), transparent 55%);
            pointer-events: none;
        }

        .btn-pink {
            background: linear-gradient(135deg, #ff7ecb 0%, #ff4ea3 48%, #bd62ff 100%);
            color: white;
            text-shadow: 0 2px 5px rgba(77, 10, 68, 0.35);
            box-shadow: 0 12px 22px rgba(236, 72, 153, 0.28);
        }

        .btn-pink:active,
        .style-option:active,
        #next-btn:active {
            transform: scale(0.97);
        }

        .sparkle-shell {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkle-shell span {
            position: absolute;
            color: var(--sparkle);
            font-size: clamp(1rem, 2vw, 1.5rem);
            animation: drift 4.8s ease-in-out infinite;
        }

        .sparkle-shell span:nth-child(1) { top: 10%; left: 12%; }
        .sparkle-shell span:nth-child(2) { top: 18%; right: 14%; animation-delay: -1.3s; }
        .sparkle-shell span:nth-child(3) { bottom: 16%; left: 18%; animation-delay: -2.1s; }
        .sparkle-shell span:nth-child(4) { bottom: 12%; right: 16%; animation-delay: -3.2s; }

        .stage-badge {
            min-width: min(88vw, 18rem);
        }

        .style-option {
            min-width: min(28vw, 8.5rem);
            position: relative;
            overflow: hidden;
        }

        .style-option::after {
            content: "✦";
            position: absolute;
            top: 0.35rem;
            right: 0.6rem;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .next-chip {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255, 237, 248, 0.95));
        }

        .reaction-gif {
            position: absolute;
            z-index: 3;
            width: clamp(88px, 18vw, 148px);
            height: clamp(88px, 18vw, 148px);
            border-radius: 1.25rem;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 16px 32px rgba(120, 0, 90, 0.18);
            opacity: 0;
            transform: scale(0.92) translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            background: rgba(255,255,255,0.25);
        }

        .reaction-gif.visible {
            opacity: 0.96;
            transform: scale(1) translateY(0);
        }

        #choice-gif {
            right: 1rem;
            top: 5.5rem;
        }

        #result-gif {
            left: 1rem;
            bottom: 7rem;
        }

        .reaction-caption {
            position: absolute;
            z-index: 4;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--ink-700);
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 18px rgba(94, 34, 86, 0.16);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .reaction-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #choice-caption {
            right: 1rem;
            top: calc(5.5rem + clamp(92px, 18vw, 152px));
        }

        #result-caption {
            left: 1rem;
            bottom: 5.4rem;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0px) scale(0.96); opacity: 0.4; }
            50% { transform: translateY(-8px) scale(1.06); opacity: 1; }
        }

        @media (max-width: 700px) {
            #start-screen,
            #rating-screen {
                width: min(92vw, 28rem);
                padding: 1.5rem;
            }

            #controls {
                flex-wrap: wrap;
                padding: 0 1rem;
                bottom: 1.5rem;
            }

            #next-container {
                bottom: 7rem;
                right: 1rem;
            }

            #hud {
                top: 1rem;
                padding: 0 0.5rem;
            }

            #choice-gif {
                top: 4.8rem;
                right: 0.75rem;
                width: clamp(76px, 24vw, 112px);
                height: clamp(76px, 24vw, 112px);
            }

            #choice-caption {
                top: calc(4.8rem + clamp(80px, 24vw, 116px));
                right: 0.75rem;
                max-width: 40vw;
                text-align: center;
            }

            #result-gif {
                left: 0.75rem;
                bottom: 8.3rem;
                width: clamp(76px, 24vw, 112px);
                height: clamp(76px, 24vw, 112px);
            }

            #result-caption {
                left: 0.75rem;
                bottom: 6.6rem;
                max-width: 42vw;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: choice-feedback + final-reveal from catalogs/gifs.json -->
        <img id="choice-gif" class="reaction-gif" alt="Choice reaction animation">
        <div id="choice-caption" class="reaction-caption display-font">Perfect Pick!</div>

        <img id="result-gif" class="reaction-gif" alt="Final reveal animation">
        <div id="result-caption" class="reaction-caption display-font">Runway Ready!</div>
        
        <!-- UI Overlay -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto hover:scale-105 transition duration-500">
                <div class="sparkle-shell" aria-hidden="true"><span>✨</span><span>💖</span><span>👗</span><span>🌟</span></div>
                <h1 class="text-6xl font-bold text-pink-500 mb-4 drop-shadow-sm display-font">Style Showcase</h1>
                <p class="text-pink-400 text-xl mb-2 font-semibold">Build a dreamy runway persona in three quick taps.</p>
                <p class="text-gray-600 text-lg mb-8">Each makeover layer boosts the star-powered reveal without changing the game flow.</p>
                <button id="start-btn" class="btn-pink font-bold py-4 px-12 rounded-full shadow-xl hover:shadow-2xl hover:scale-110 transition text-2xl display-font">START</button>
            </div>

            <!-- Rating Screen -->
            <div id="rating-screen" class="hidden glass-panel p-8 rounded-3xl text-center pointer-events-auto max-w-md w-full mx-4">
                <h2 class="text-4xl font-bold text-pink-500 mb-2 display-font">Final Rating</h2>
                <div class="my-6">
                    <p class="text-gray-600 text-lg mb-2">The style panel gives this look:</p>
                    <div class="text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r drop-shadow-sm" id="score-display">10/10</div>
                </div>
                <div id="stars-container" class="text-4xl mb-8 flex justify-center gap-2 text-yellow-400 drop-shadow-md">
                    ★★★★★
                </div>
                <button id="restart-btn" class="btn-pink font-bold py-3 px-10 rounded-full shadow-lg hover:bg-pink-600 transition text-xl display-font">Style Again</button>
            </div>
            
            <!-- HUD (Stage Info) -->
            <div id="hud" class="absolute top-6 w-full text-center pointer-events-none hidden">
                <div class="inline-block glass-panel px-8 py-3 rounded-full stage-badge">
                    <span id="stage-text" class="text-2xl font-bold text-pink-500">Look 1: Outfit</span>
                </div>
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls" class="absolute bottom-10 w-full flex justify-center gap-4 pointer-events-auto hidden">
                <!-- Buttons generated by JS -->
            </div>
            
            <!-- Next Button -->
            <div id="next-container" class="absolute bottom-32 right-6 pointer-events-auto hidden">
                <button id="next-btn" class="next-chip bg-white text-pink-500 border-4 border-pink-300 font-bold py-3 px-6 rounded-full shadow-lg hover:scale-110 transition display-font">
                    Next ➔
                </button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // [agent-note][stage4] repaired: mobile-actionability | element: start/restart/next buttons | action: removed global touch suppression from body and scoped it to canvas
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",
            resultLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                pick: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                next: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
            },
            gifs: {
                choice: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                result: "https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.resultLoop = this.createLoop(ASSETS.resultLoop, 0.2);
                this.buffers = {};
                this.lastPlayed = {};
                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    this.buffers[key] = audio;
                }
            }

            createLoop(src, volume) {
                const loop = new Audio(src);
                loop.loop = true;
                loop.volume = volume;
                loop.preload = 'auto';
                return loop;
            }

            unlock() {
                this.enabled = true;
            }

            safePlay(audio, resetTime = false) {
                if (!this.enabled || !audio) return;
                if (resetTime) {
                    audio.currentTime = 0;
                }
                audio.play().catch(() => {});
            }

            stop(audio) {
                if (!audio) return;
                audio.pause();
                audio.currentTime = 0;
            }

            startGameplayLoop() {
                if (!this.enabled) return;
                this.stop(this.resultLoop);
                this.safePlay(this.bgm);
            }

            startResultLoop() {
                if (!this.enabled) return;
                this.stop(this.bgm);
                this.safePlay(this.resultLoop);
            }

            playSFX(key, volume = 0.62, minGap = 90) {
                if (!this.enabled || !this.buffers[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < minGap) return;
                this.lastPlayed[key] = now;

                const clone = this.buffers[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const choiceGif = document.getElementById('choice-gif');
        const resultGif = document.getElementById('result-gif');
        const choiceCaption = document.getElementById('choice-caption');
        const resultCaption = document.getElementById('result-caption');

        let width, height;
        let gameActive = false;
        let choiceGifTimer = null;
        let resultGifTimer = null;
        
        // State
        let currentStage = 0; // 0:Intro, 1:Outfit, 2:Makeup, 3:Accessory, 4:Result
        let choices = {
            dress: 0, // 0: None, 1: Pink, 2: Blue, 3: Purple
            makeup: 0, // 0: None, 1: Natural, 2: Rosy, 3: Glam
            accessory: 0 // 0: None, 1: Bow, 2: Tiara, 3: Flowers
        };

        // Particles
        let particles = [];
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 15 + 5;
                this.speed = Math.random() * 2 + 1;
                this.type = Math.random() > 0.5 ? '❤️' : '✨';
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.type, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (particles.length === 0) {
                for (let i = 0; i < 30; i++) particles.push(new Particle());
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function hideChoiceReaction() {
            choiceGif.classList.remove('visible');
            choiceCaption.classList.remove('visible');
        }

        function showChoiceReaction(text = 'Perfect Pick!') {
            choiceGif.src = ASSETS.gifs.choice;
            choiceGif.classList.add('visible');
            choiceCaption.textContent = text;
            choiceCaption.classList.add('visible');
            window.clearTimeout(choiceGifTimer);
            choiceGifTimer = window.setTimeout(() => {
                hideChoiceReaction();
            }, 1450);
        }

        function hideResultReaction() {
            resultGif.classList.remove('visible');
            resultCaption.classList.remove('visible');
        }

        function showResultReaction(text = 'Runway Ready!') {
            resultGif.src = ASSETS.gifs.result;
            resultGif.classList.add('visible');
            resultCaption.textContent = text;
            resultCaption.classList.add('visible');
            window.clearTimeout(resultGifTimer);
            resultGifTimer = window.setTimeout(() => {
                hideResultReaction();
            }, 2600);
        }

        /** 4. DRAWING FUNCTIONS (Procedural Avatar) */
        function drawAvatar(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const bob = Math.sin(Date.now() / 260) * 3;
            ctx.translate(0, bob);

            const skinTone = "#ffe0bd";
            const hairColor = "#40212f";
            const eyeColor = "#5d2f5d";

            // -- BODY --
            ctx.fillStyle = skinTone;
            ctx.fillRect(-15, -60, 30, 42);
            ctx.beginPath();
            ctx.roundRect(-45, -30, 90, 140, 24);
            ctx.fill();
            ctx.fillRect(-35, 100, 25, 120);
            ctx.fillRect(10, 100, 25, 120);

            // -- HEAD --
            ctx.beginPath();
            ctx.arc(0, -90, 60, 0, Math.PI * 2);
            ctx.fill();

            // -- FACE --
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.arc(-20, -90, 8, 0, Math.PI * 2);
            ctx.arc(20, -90, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(-18, -92, 2.5, 0, Math.PI * 2);
            ctx.arc(22, -92, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -78, 16, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.lineWidth = 3;
            ctx.strokeStyle = eyeColor;
            ctx.stroke();
            ctx.fillStyle = "rgba(255, 110, 170, 0.18)";
            ctx.beginPath(); ctx.arc(-34, -80, 10, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(34, -80, 10, 0, Math.PI * 2); ctx.fill();

            // -- MAKEUP --
            if (choices.makeup === 1) {
                ctx.fillStyle = "rgba(255, 105, 180, 0.2)";
                ctx.beginPath(); ctx.arc(-35, -80, 10, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(35, -80, 10, 0, Math.PI * 2); ctx.fill();
            } else if (choices.makeup === 2) {
                ctx.fillStyle = "rgba(255, 20, 147, 0.4)";
                ctx.beginPath(); ctx.arc(-35, -80, 12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(35, -80, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#ff7ebb";
                ctx.beginPath(); ctx.arc(0, -75, 5, 0, Math.PI * 2); ctx.fill();
            } else if (choices.makeup === 3) {
                ctx.fillStyle = "#a020f0";
                ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(-20, -95, 10, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, -95, 10, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
                ctx.beginPath(); ctx.arc(-35, -80, 12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(35, -80, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#d50000";
                ctx.beginPath(); ctx.ellipse(0, -72, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
            }

            // -- HAIR (Back) --
            ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = hairColor;
            ctx.beginPath();
            ctx.arc(0, -96, 72, Math.PI, 0);
            ctx.rect(-72, -94, 144, 158);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 161, 218, 0.22)";
            ctx.beginPath();
            ctx.ellipse(-26, -112, 18, 10, -0.6, 0, Math.PI * 2);
            ctx.ellipse(28, -120, 16, 9, 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // -- CLOTHES --
            if (choices.dress === 0) {
                ctx.fillStyle = "#fff";
                ctx.fillRect(-35, -30, 70, 60);
            } else {
                let color = "#ff8cc6";
                if (choices.dress === 2) color = "#8ed8ff";
                if (choices.dress === 3) color = "#c7a5ff";
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(-35, -30);
                ctx.lineTo(35, -30);
                ctx.lineTo(45, 40);
                ctx.lineTo(-45, 40);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-45, 40);
                ctx.lineTo(45, 40);
                ctx.lineTo(80, 150);
                ctx.quadraticCurveTo(0, 170, -80, 150);
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,0.6)";
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-45, 40); ctx.lineTo(45, 40); ctx.stroke();

                ctx.fillStyle = "rgba(255,255,255,0.28)";
                ctx.beginPath();
                ctx.moveTo(-24, 8);
                ctx.quadraticCurveTo(0, 18, 24, 8);
                ctx.quadraticCurveTo(0, 44, -24, 8);
                ctx.fill();
            }

            // -- ACCESSORIES --
            if (choices.accessory === 1) {
                ctx.fillStyle = "#ff4a87";
                ctx.beginPath();
                ctx.arc(0, -140, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, -140); ctx.lineTo(-30, -160); ctx.lineTo(-30, -120); ctx.fill();
                ctx.moveTo(0, -140); ctx.lineTo(30, -160); ctx.lineTo(30, -120); ctx.fill();
            } else if (choices.accessory === 2) {
                ctx.fillStyle = "#ffd95c";
                ctx.beginPath();
                ctx.moveTo(-30, -130);
                ctx.lineTo(-15, -150);
                ctx.lineTo(0, -135);
                ctx.lineTo(15, -150);
                ctx.lineTo(30, -130);
                ctx.lineTo(30, -120);
                ctx.lineTo(-30, -120);
                ctx.fill();
            } else if (choices.accessory === 3) {
                ctx.fillStyle = "#ff69b4";
                ctx.beginPath(); ctx.arc(-30, -130, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.beginPath(); ctx.arc(-30, -130, 4, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = "#ff69b4";
                ctx.beginPath(); ctx.arc(30, -130, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.beginPath(); ctx.arc(30, -130, 4, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, "#ffd8ee");
            grad.addColorStop(0.55, "#ffdff7");
            grad.addColorStop(1, "#edd5ff");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const spotlight = ctx.createRadialGradient(width * 0.5, height * 0.32, 50, width * 0.5, height * 0.32, height * 0.75);
            spotlight.addColorStop(0, "rgba(255,255,255,0.45)");
            spotlight.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = spotlight;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "rgba(255,255,255,0.22)";
            for (let i = 0; i < 5; i++) {
                const offset = (Date.now() / 38 + i * 90) % (width + 220);
                ctx.beginPath();
                ctx.ellipse(offset - 110, height * 0.82, 140, 22, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            
            ctx.clearRect(0, 0, width, height);
            drawBackground();
            drawAvatar(width / 2, height / 2 + 50, Math.min(width, height) / 500);

            requestAnimationFrame(gameLoop);
        }

        /** 5. UI & LOGIC */
        const options = {
            1: [
                { id: 1, label: "Soft Pink", type: "dress", val: 1, color: "bg-pink-300", reaction: "Pink Spark!" },
                { id: 2, label: "Sky Blue", type: "dress", val: 2, color: "bg-blue-300", reaction: "Cool Couture!" },
                { id: 3, label: "Lavender", type: "dress", val: 3, color: "bg-purple-300", reaction: "Dreamy Fit!" }
            ],
            2: [
                { id: 1, label: "Natural", type: "makeup", val: 1, color: "bg-orange-200", reaction: "Glow Up!" },
                { id: 2, label: "Rosy", type: "makeup", val: 2, color: "bg-red-300", reaction: "Blush Boost!" },
                { id: 3, label: "Glam", type: "makeup", val: 3, color: "bg-purple-500", reaction: "Star Glam!" }
            ],
            3: [
                { id: 1, label: "Cute Bow", type: "accessory", val: 1, color: "bg-red-400", reaction: "Bow Bonus!" },
                { id: 2, label: "Tiara", type: "accessory", val: 2, color: "bg-yellow-300", reaction: "Crown Moment!" },
                { id: 3, label: "Flowers", type: "accessory", val: 3, color: "bg-pink-400", reaction: "Bloom Pop!" }
            ]
        };

        function setupStageUI(stageNum) {
            const controls = document.getElementById('controls');
            controls.innerHTML = '';
            
            const hudText = document.getElementById('stage-text');
            if (stageNum === 1) hudText.innerText = "Look 1: Choose an Outfit";
            if (stageNum === 2) hudText.innerText = "Look 2: Add Makeup";
            if (stageNum === 3) hudText.innerText = "Look 3: Pick an Accessory";

            options[stageNum].forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `style-option ${opt.color} text-white font-bold py-4 px-6 rounded-2xl shadow-md hover:scale-110 transition transform border-2 border-white`;
                btn.innerText = opt.label;
                btn.onclick = () => {
                    audio.playSFX('uiClick', 0.42, 80);
                    audio.playSFX('pick', 0.54, 120);
                    choices[opt.type] = opt.val;
                    showChoiceReaction(opt.reaction);
                    document.getElementById('next-container').classList.remove('hidden');
                };
                controls.appendChild(btn);
            });
            
            controls.classList.remove('hidden');
            document.getElementById('next-container').classList.add('hidden');
        }

        function finishGame() {
            currentStage = 4;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('next-container').classList.add('hidden');
            
            const scores = ["8.5/10", "9/10", "9.5/10", "10/10", "100/10!!"];
            const finalScore = scores[Math.floor(Math.random() * scores.length)];
            
            document.getElementById('score-display').innerText = finalScore;
            document.getElementById('rating-screen').classList.remove('hidden');
            hideChoiceReaction();
            showResultReaction(finalScore === "100/10!!" ? "Iconic Reveal!" : "Runway Ready!");
            
            audio.playSFX('win', 0.66, 150);
            audio.startResultLoop();
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.6, 150);
            audio.startGameplayLoop();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            hideResultReaction();
            gameActive = true;
            currentStage = 1;
            setupStageUI(1);
            gameLoop();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            audio.playSFX('next', 0.58, 100);
            currentStage++;
            if (currentStage > 3) {
                finishGame();
            } else {
                setupStageUI(currentStage);
            }
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('rating-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            choices = { dress: 0, makeup: 0, accessory: 0 };
            currentStage = 1;
            setupStageUI(1);
            hideResultReaction();
            audio.playSFX('uiClick', 0.45, 90);
            audio.startGameplayLoop();
        });
        
    });
    </script>
</body>
</html>
