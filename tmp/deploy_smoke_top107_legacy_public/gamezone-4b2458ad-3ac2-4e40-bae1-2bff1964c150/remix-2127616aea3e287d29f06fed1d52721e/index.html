<script>
/**
 * AUDIO MANAGER (Strict Protocol)
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.connect(this.ctx.destination);
        this.buffers = {};
        this.isUnlocked = false;
        this.lastPlayedAt = {};
        
        // Level 1: Try autoplay (allowed to fail)
        this.tryAutoPlay();

        // Level 2: Unlock on interaction
        const unlock = () => {
            if (this.isUnlocked) return;
            this.ctx.resume().then(() => {
                this.isUnlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            });
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));
    }

    tryAutoPlay() {
        // Attempt to play silence or BGM if browser allows
        if (this.ctx.state === 'running') {
            this.isUnlocked = true;
            this.playBgm();
        }
    }

    async loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback ${fallbackType}`);
            this.buffers[id] = fallbackType;
        }
    }

    playBgm() {
        const id = 'bgm_main';
        // Only play if we have buffer and ctx is running
        if (this.ctx.state !== 'running') return;
        
        if (this.buffers[id] && typeof this.buffers[id] !== 'string') {
            // Stop existing if any (simple singleton)
            if (this.bgmSource) try { this.bgmSource.stop(); } catch(e){}
            
            const src = this.ctx.createBufferSource();
            src.buffer = this.buffers[id];
            src.loop = true;
            const gain = this.ctx.createGain();
            gain.gain.value = 0.2;
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);
            this.bgmSource = src;
        }
    }

    playSfx(id) {
        if (this.ctx.state !== 'running') return;
        const nowMs = performance.now();
        if (this.lastPlayedAt[id] && nowMs - this.lastPlayedAt[id] < 80) return;
        this.lastPlayedAt[id] = nowMs;
        const buffer = this.buffers[id];
        if (buffer && typeof buffer !== 'string') {
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.value = 0.6;
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);
        } else {
            this.synthesize(buffer || 'beep');
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        const now = this.ctx.currentTime;
        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else {
            // Coin/Beep
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }
}

    themeColor: { type: "color", label: "Theme Color", value: "#22d3ee" }
};
window.updateGameConfig = (k, v) => {
    if(window.gameConfigDefs[k]) {
        gameConfig[k] = v;
        if(k === 'themeColor') window.game.drawBackground(); // Trigger redraw
    }
};

/**
 * GAME LOGIC
 */
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();
        
        this.state = 'START'; 
        this.width = 0;
        this.height = 0;
        
        // Economy
        this.cash = 0;
        this.day = 1;
        this.dailyCost = 0;
        this.properties = {};
        this.bet = 50;
        
        // Game Objects
        this.deck = [];
        this.playerHand = [];
        this.dealerHand = [];
        this.particles = [];
        this.floatingTexts = [];
        
        // Animation
        this.shake = 0;
        this.lastTime = 0;
        this.bgOffset = 0;

        // Init
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindEvents();
        this.initEconomy();
        
        // Load assets
        this.audio.loadSound('bgm_main', 'beep');
        this.audio.loadSound('sfx_win', 'beep');
        this.audio.loadSound('sfx_lose', 'explosion');
        this.audio.loadSound('sfx_ui', 'beep');
        this.audio.loadSound('sfx_deal', 'beep');
        this.audio.loadSound('sfx_collect', 'beep');
        
        requestAnimationFrame(t => this.loop(t));
    }

    initEconomy() {
        this.cash = gameConfig.startingCash;
        this.dailyCost = gameConfig.dailyCostBase;
        this.day = 1;
        PROPERTIES.forEach(p => this.properties[p.id] = 0);
        this.updateHUD();
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    bindEvents() {
        const startHandler = () => {
            if (this.state === 'START') {
                this.state = 'BETTING';
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('bet-panel').classList.remove('hidden');
                this.audio.playSfx('sfx_ui');
            }
        };
        
        window.addEventListener('pointerdown', (e) => {
            if (this.state === 'START') startHandler();
        });
        window.addEventListener('keydown', (e) => {
            if (this.state === 'START') startHandler();
        });

        document.getElementById('btn-deal').onclick = () => this.deal();
        document.getElementById('btn-hit').onclick = () => this.hit();
        document.getElementById('btn-stand').onclick = () => this.stand();
        document.getElementById('btn-shop-open').onclick = () => this.openShop();
        document.getElementById('btn-next-day').onclick = () => this.nextDay();
        document.getElementById('restart-btn').onclick = () => this.restart();

        ['btn-deal', 'btn-hit', 'btn-stand', 'btn-shop-open', 'btn-next-day', 'restart-btn'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', () => this.audio.playSfx('sfx_ui'));
        });
        
        document.getElementById('shop-list').addEventListener('click', (e) => {
            const btn = e.target.closest('.buy-btn');
            if (btn) this.buyProperty(btn.dataset.id);
        });
    }

    restart() {
        this.initEconomy();
        this.state = 'BETTING';
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('bet-panel').classList.remove('hidden');
        this.resetHands();
    }

    createDeck() {
        this.deck = [];
        for(let s of SUITS) {
            for(let r of RANKS) {
                this.deck.push({ suit: s, rank: r, val: VALUES[r] });
            }
        }
        for (let i = this.deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
        }
    }

    resetHands() {
        this.playerHand = [];
        this.dealerHand = [];
        this.createDeck();
    }

    deal() {
        if (this.cash < this.bet) {
            this.addFloatingText("Not enough cash!", this.width/2, this.height/2, '#ef4444');
            this.audio.playSfx('sfx_lose');
            this.showReaction('NOT ENOUGH CASH', 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 'danger');
            return;
        }
        
        this.cash -= this.bet;
        this.updateHUD();
        this.resetHands();
        this.audio.playSfx('sfx_deal');
        
        this.state = 'PLAYER_TURN';
        document.getElementById('bet-panel').classList.add('hidden');
        document.getElementById('action-panel').classList.remove('hidden');
        document.getElementById('action-panel').style.opacity = '1';

        this.drawCardTo(this.playerHand, false);
        setTimeout(() => this.drawCardTo(this.dealerHand, false), 200);
        setTimeout(() => this.drawCardTo(this.playerHand, false), 400);
        setTimeout(() => {
            this.drawCardTo(this.dealerHand, true);
            this.checkBlackjack();
        }, 600);
    }

    drawCardTo(hand, hidden) {
        const card = this.deck.pop();
        card.x = this.width / 2;
        card.y = -100;
        card.targetX = 0;
        card.targetY = 0;
        card.hidden = hidden;
        card.flip = 0;
        hand.push(card);
    }

    getHandValue(hand) {
        let val = 0;
        let aces = 0;
        for(let c of hand) {
            if(c.hidden) continue;
            val += c.val;
            if(c.rank === 'A') aces++;
        }
        while(val > 21 && aces > 0) {
            val -= 10;
            aces--;
        }
        return val;
    }

    hit() {
        this.drawCardTo(this.playerHand, false);
        setTimeout(() => {
            const val = this.getHandValue(this.playerHand);
            if (val > 21) {
                this.endRound('BUST');
            } else if (val === 21) {
                // FORCE WIN CONDITION
                this.endRound('WIN');
            }
        }, 300);
    }

    stand() {
        this.state = 'DEALER_TURN';
        document.getElementById('action-panel').style.opacity = '0';
        setTimeout(() => document.getElementById('action-panel').classList.add('hidden'), 300);
        
        this.dealerHand.forEach(c => c.hidden = false);
        this.dealerPlay();
    }

    dealerPlay() {
        const val = this.getHandValue(this.dealerHand);
        if (val < 17) {
            setTimeout(() => {
                this.drawCardTo(this.dealerHand, false);
                this.dealerPlay();
            }, 800);
        } else {
            setTimeout(() => this.determineWinner(), 800);
        }
    }

    checkBlackjack() {
        const pVal = this.getHandValue(this.playerHand);
        if (pVal === 21) {
            this.endRound('BLACKJACK');
        }
    }

    determineWinner() {
        const pVal = this.getHandValue(this.playerHand);
        const dVal = this.getHandValue(this.dealerHand);
        
        if (dVal > 21) this.endRound('WIN');
        else if (pVal > dVal) this.endRound('WIN');
        else if (pVal < dVal) this.endRound('LOSE');
        else this.endRound('PUSH');
    }

    endRound(result) {
        this.state = 'RESULT';
        document.getElementById('action-panel').classList.add('hidden');
        
        let msg = "";
        let color = "#fff";
        let payout = 0;

        if (result === 'BUST') {
            msg = "TABLE BUST!";
            color = "#ef4444";
            this.audio.playSfx('sfx_lose');
            this.showReaction('TABLE TILT', 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 'danger');
            this.shake = 20;
        } else if (result === 'LOSE') {
            msg = "HOUSE EDGE";
            color = "#ef4444";
            this.audio.playSfx('sfx_lose');
            this.showReaction('HOUSE EDGE', 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 'danger');
        } else if (result === 'WIN') {
            msg = "TABLE CLEARED!";
            color = "#22d3ee";
            payout = this.bet * 2;
            this.audio.playSfx('sfx_win');
            this.showReaction('BIG WIN', 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp', 'success');
            this.spawnParticles(this.width/2, this.height/2, 30, '#22d3ee');
        } else if (result === 'BLACKJACK') {
            msg = "PERFECT 21!";
            color = "#ffd700";
            payout = this.bet * 2.5;
            this.audio.playSfx('sfx_win');
            this.showReaction('BLACKJACK', 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp', 'success');
            this.spawnParticles(this.width/2, this.height/2, 50, '#ffd700');
        } else if (result === 'PUSH') {
            msg = "STANDOFF";
            color = "#94a3b8";
            payout = this.bet;
        }

        this.cash += payout;
        this.addFloatingText(msg, this.width/2, this.height/2 - 50, color, 60);
        if (payout > 0) this.addFloatingText(`+$${payout}`, this.width/2, this.height/2 + 50, '#4ade80', 40);
        
        this.updateHUD();

        setTimeout(() => {
            if (this.state !== 'SHOP' && this.state !== 'GAMEOVER') {
                this.state = 'BETTING';
                document.getElementById('bet-panel').classList.remove('hidden');
            }
        }, 2000);
    }

    openShop() {
        this.state = 'SHOP';
        let income = 0;
        for(let pid in this.properties) {
            const p = PROPERTIES.find(x => x.id === pid);
            income += p.income * this.properties[pid];
        }
        
        this.cash += income;
        this.cash -= this.dailyCost;
        
        document.getElementById('shop-day').innerText = this.day;
        document.getElementById('shop-expenses').innerText = this.dailyCost;
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('bet-panel').classList.add('hidden');
        
        const list = document.getElementById('shop-list');
        list.innerHTML = '';
        PROPERTIES.forEach(p => {
            const count = this.properties[p.id];
            const div = document.createElement('div');
            div.className = "flex items-center justify-between bg-white/10 p-3 rounded-lg border border-white/5";
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="text-3xl">${p.icon}</div>
                    <div>
                        <div class="font-bold text-cyan-300 font-display text-xl leading-none">${p.name}</div>
                        <div class="text-xs text-gray-400">Owned: ${count} | +$${p.income}/night</div>
                    </div>
                </div>
                <button class="buy-btn btn bg-green-600 px-4 py-2 rounded text-sm font-bold" data-id="${p.id}">
                    $${p.cost}
                </button>
            `;
            list.appendChild(div);
        });

        document.getElementById('shop-modal').classList.add('open');
        this.audio.playSfx('sfx_ui');
        this.updateHUD();
        
        if (this.cash < 0) {
            setTimeout(() => this.gameOver(), 500);
        }
    }

    buyProperty(id) {
        const p = PROPERTIES.find(x => x.id === id);
        if (this.cash >= p.cost) {
            this.cash -= p.cost;
            this.properties[id]++;
            this.audio.playSfx('sfx_collect');
            this.showReaction('EXPANSION BOUGHT', 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp', 'success');
            this.openShop(); 
        } else {
            this.audio.playSfx('sfx_lose');
        }
    }

    nextDay() {
        if (this.cash < 0) return;
        
        this.day++;
        this.dailyCost = Math.floor(this.dailyCost * 1.1); // Inflation
        this.hideReaction();
        document.getElementById('shop-modal').classList.remove('open');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('bet-panel').classList.remove('hidden');
        this.state = 'BETTING';
        this.resetHands();
        this.updateHUD();
    }

    gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('shop-modal').classList.remove('open');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-days').innerText = this.day;
        this.audio.playSfx('sfx_lose');
        this.showReaction('EMPIRE BUSTED', 'https://i.giphy.com/Une1GNCQCawQEfxtJJ.webp', 'danger');
    }

    updateHUD() {
        let income = 0;
        for(let pid in this.properties) {
            const p = PROPERTIES.find(x => x.id === pid);
            income += p.income * this.properties[pid];
        }
        document.getElementById('hud-cash').innerText = Math.floor(this.cash);
        document.getElementById('hud-day').innerText = this.day;
        document.getElementById('hud-cost').innerText = this.dailyCost;
        document.getElementById('hud-income').innerText = income;
    }

    spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0,
                color: color
            });
        }
    }

    addFloatingText(text, x, y, color, size=24) {
        this.floatingTexts.push({ text, x, y, color, size, life: 1.0, dy: 0 });
    }

    showReaction(caption, src, tone = 'success') {
        const overlay = document.getElementById('reaction-overlay');
        const gif = document.getElementById('reaction-gif');
        const text = document.getElementById('reaction-caption');
        const card = document.getElementById('reaction-card');
        if (!overlay || !gif || !text || !card) return;
        gif.src = src;
        text.textContent = caption;
        card.style.borderColor = tone === 'danger' ? 'rgba(255,109,125,0.45)' : 'rgba(109,255,183,0.38)';
        overlay.classList.remove('hidden');
        clearTimeout(this.reactionTimer);
        this.reactionTimer = setTimeout(() => this.hideReaction(), 1800);
    }

    hideReaction() {
        const overlay = document.getElementById('reaction-overlay');
        if (overlay) overlay.classList.add('hidden');
    }

    loop(t) {
        const dt = Math.min((t - this.lastTime) / 1000, 0.1);
        this.lastTime = t;

        this.update(dt);
        this.draw();

        requestAnimationFrame(t => this.loop(t));
    }

    update(dt) {
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;

        this.bgOffset += dt * 20; // Scroll speed

        const targetYBase = this.height * 0.7;
        const dealerYBase = this.height * 0.2;
        
        this.playerHand.forEach((c, i) => {
            const tx = this.width/2 + (i - (this.playerHand.length-1)/2) * 40;
            const ty = targetYBase;
            c.x += (tx - c.x) * 10 * dt;
            c.y += (ty - c.y) * 10 * dt;
        });

        this.dealerHand.forEach((c, i) => {
            const tx = this.width/2 + (i - (this.dealerHand.length-1)/2) * 40;
            const ty = dealerYBase;
            c.x += (tx - c.x) * 10 * dt;
            c.y += (ty - c.y) * 10 * dt;
        });

        for(let i = this.particles.length-1; i>=0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life -= dt * 2;
            if(p.life <= 0) this.particles.splice(i, 1);
        }

        for(let i = this.floatingTexts.length-1; i>=0; i--) {
            let ft = this.floatingTexts[i];
            ft.dy -= 100 * dt;
            ft.life -= dt;
            if(ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
    }

    draw() {
        this.ctx.fillStyle = '#0f172a';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();
        if(this.shake > 0) {
            this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        }

        this.drawBackground();
        this.drawTable();

        this.dealerHand.forEach(c => this.drawCard(c));
        this.playerHand.forEach(c => this.drawCard(c));

        this.ctx.globalCompositeOperation = 'lighter';
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalCompositeOperation = 'source-over';
        this.ctx.globalAlpha = 1;

        this.floatingTexts.forEach(ft => {
            this.ctx.font = `bold ${ft.size}px Orbitron`;
            this.ctx.fillStyle = ft.color;
            this.ctx.textAlign = 'center';
            this.ctx.globalAlpha = ft.life;
            this.ctx.shadowColor = 'black';
            this.ctx.shadowBlur = 4;
            this.ctx.fillText(ft.text, ft.x, ft.y + ft.dy);
            this.ctx.shadowBlur = 0;
        });
        this.ctx.globalAlpha = 1;

        this.ctx.restore();
    }

    drawBackground() {
        // Layer 1: Sky Gradient
        const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, '#020617');
        grad.addColorStop(1, '#1e1b4b');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Layer 2: Distant Skyline (Slow)
        this.ctx.fillStyle = '#0f172a';
        const w = this.width;
        const h = this.height;
        const offset1 = (this.bgOffset * 0.5) % w;
        
        this.ctx.beginPath();
        this.ctx.moveTo(0, h);
        for(let x = -1; x <= 1; x++) {
            const baseX = x * w - offset1;
            for(let i=0; i<=10; i++) {
                const hB = 80 + Math.sin(i * 132 + 1) * 40;
                this.ctx.lineTo(baseX + i * (w/10), h - hB - 150);
                this.ctx.lineTo(baseX + (i+1) * (w/10), h - hB - 150);
            }
        }
        this.ctx.lineTo(w, h);
        this.ctx.fill();

        // Layer 3: Closer City (Fast)
        this.ctx.fillStyle = '#1e293b';
        const offset2 = (this.bgOffset * 1.5) % w;
        this.ctx.beginPath();
        this.ctx.moveTo(0, h);
        for(let x = -1; x <= 1; x++) {
            const baseX = x * w - offset2;
            for(let i=0; i<=8; i++) {
                const hB = 40 + Math.cos(i * 55) * 30;
                this.ctx.lineTo(baseX + i * (w/8), h - hB - 50);
                this.ctx.lineTo(baseX + (i+1) * (w/8), h - hB - 50);
            }
        }
        this.ctx.lineTo(w, h);
        this.ctx.fill();

        // Neon Lights on Layer 3
        this.ctx.fillStyle = gameConfig.themeColor;
        for(let i=0; i<15; i++) {
            const lightX = ((i * 100 - offset2) % w + w) % w;
            const lightY = h - 80 - (Math.sin(i)*20);
            this.ctx.globalAlpha = 0.5 + Math.sin(this.bgOffset*0.1 + i)*0.5;
            this.ctx.fillRect(lightX, lightY, 3, 3);
        }
        this.ctx.globalAlpha = 1;
    }

    drawTable() {
        // Felt
        this.ctx.fillStyle = '#064e3b';
        this.ctx.beginPath();
        this.ctx.ellipse(this.width/2, this.height * 1.3, this.width * 1.2, this.height * 0.9, 0, 0, Math.PI*2);
        this.ctx.fill();
        
        // Neon Border
        this.ctx.strokeStyle = gameConfig.themeColor;
        this.ctx.lineWidth = 4;
        this.ctx.shadowColor = gameConfig.themeColor;
        this.ctx.shadowBlur = 15;
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;

        // Deck Placeholder
        this.ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(this.width/2 - 35, -110, 70, 100);
    }

    drawCard(card) {
        const w = 70;
        const h = 100;
        const r = 6;
        
        this.ctx.save();
        this.ctx.translate(card.x, card.y);
        
        // Shadow
        this.ctx.shadowColor = 'rgba(0,0,0,0.5)';
        this.ctx.shadowBlur = 10;
        this.ctx.shadowOffsetY = 5;

        if (card.hidden) {
            // Card Back
            this.ctx.fillStyle = '#b91c1c';
            this.ctx.beginPath();
            this.ctx.roundRect(-w/2, -h/2, w, h, r);
            this.ctx.fill();
            
            this.ctx.strokeStyle = '#7f1d1d';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.moveTo(-w/2+5, -h/2+5); this.ctx.lineTo(w/2-5, h/2-5);
            this.ctx.moveTo(w/2-5, -h/2+5); this.ctx.lineTo(-w/2+5, h/2-5);
            this.ctx.stroke();
            
            this.ctx.strokeStyle = '#fff';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(-w/2+5, -h/2+5, w-10, h-10);
        } else {
            // Card Front
            this.ctx.fillStyle = '#fff';
            this.ctx.beginPath();
            this.ctx.roundRect(-w/2, -h/2, w, h, r);
            this.ctx.fill();
            
            this.ctx.shadowColor = 'transparent';
            
            const isRed = card.suit === '♥' || card.suit === '♦';
            this.ctx.fillStyle = isRed ? '#ef4444' : '#000';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            
            // Corner
            this.ctx.font = 'bold 20px Exo 2';
            this.ctx.fillText(card.rank, -w/2 + 14, -h/2 + 18);
            this.ctx.font = '16px Arial';
            this.ctx.fillText(card.suit, -w/2 + 14, -h/2 + 38);

            // Center
            this.ctx.font = '42px Arial';
            this.ctx.fillText(card.suit, 0, 5);
        }
        
        this.ctx.restore();
    }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    try {
        const confEl = document.getElementById('game-config');
        if(confEl) {
            const usrConf = JSON.parse(confEl.textContent);
            Object.keys(usrConf).forEach(k => {
                if(gameConfig.hasOwnProperty(k)) gameConfig[k] = usrConf[k].value;
            });
        }
    } catch(e) {}

    window.game = new Game();
});
</script>
