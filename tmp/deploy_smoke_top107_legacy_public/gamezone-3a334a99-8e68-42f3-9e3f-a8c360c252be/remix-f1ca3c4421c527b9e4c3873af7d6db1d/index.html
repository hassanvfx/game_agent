<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Avatar Remix Studio</title>
    <!-- [agent-note][stage3] resolved-font: title/display -> Audiowide | ui/body -> Exo 2 | icons -> Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1022;
            --bg-deep: #090b18;
            --grid: rgba(82, 219, 255, 0.16);
            --panel: rgba(17, 23, 45, 0.78);
            --panel-solid: rgba(20, 28, 58, 0.96);
            --text-dark: #eef7ff;
            --text-mid: #9ed6ff;
            --text-soft: #7b96c9;
            --accent: #4df6ff;
            --accent-dark: #00bfd6;
            --accent-soft: rgba(77, 246, 255, 0.14);
            --accent-secondary: #ff5fd2;
            --warning: #ffd166;
            --button-soft: rgba(255, 255, 255, 0.08);
            --shadow-lg: 0 18px 36px rgba(0, 0, 0, 0.34);
            --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.28);
            --radius-xl: 18px;
            --radius-2xl: 24px;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 95, 210, 0.18), transparent 32%),
                radial-gradient(circle at bottom, rgba(77, 246, 255, 0.18), transparent 36%),
                linear-gradient(180deg, #171a33 0%, var(--bg) 46%, var(--bg-deep) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-dark);
            background-color: var(--bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            border: none;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .glass {
            background:
                linear-gradient(180deg, rgba(21, 29, 58, 0.94), rgba(12, 17, 36, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 225, 255, 0.28);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
        }
        .btn-press {
            transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-press:active { transform: scale(0.95); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .screen {
            position: absolute;
            inset: 0;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .full-size { width: 100%; height: 100%; }
        .select-none { user-select: none; }

        #game-container { position: relative; width: 100%; height: 100%; }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .title-pill {
            padding: 10px 16px;
            border-radius: var(--radius-xl);
        }

        .ui-title {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dark);
            text-shadow: 0 0 18px rgba(77, 246, 255, 0.35);
        }

        .icon-button {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: var(--panel-solid);
            box-shadow: var(--shadow-md);
            color: var(--accent);
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 26px;
            line-height: 1;
        }

        #editor-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        #category-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .cat-btn {
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-mid);
            box-shadow: inset 0 0 0 1px rgba(158, 214, 255, 0.18);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
            color: #08101e;
            box-shadow: 0 0 18px rgba(77, 246, 255, 0.25);
        }

        .option-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px;
            border-radius: var(--radius-2xl);
            background:
                linear-gradient(180deg, rgba(17, 23, 45, 0.95), rgba(12, 17, 36, 0.98));
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(158, 214, 255, 0.16);
        }

        .option-nav {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--button-soft);
            color: var(--text-dark);
            font-size: 1.5rem;
            font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .option-copy {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .option-label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-soft);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .option-value {
            display: block;
            margin-top: 4px;
            font-size: clamp(1.15rem, 3vw, 1.4rem);
            color: var(--text-dark);
            font-weight: 700;
            text-shadow: 0 0 12px rgba(77, 246, 255, 0.18);
        }

        .finish-button,
        .primary-button,
        .secondary-button {
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .finish-button,
        .primary-button {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
            color: #08101e;
        }

        .finish-button:hover,
        .primary-button:hover {
            filter: brightness(1.06);
        }

        .finish-button {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-2xl);
            font-size: 1.2rem;
            letter-spacing: 0.08em;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .start-emoji {
            margin-bottom: 16px;
            font-size: 4rem;
            animation: bounce 1.6s ease-in-out infinite;
        }

        .overlay-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--text-dark);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .overlay-subtitle {
            margin: 0 0 28px;
            color: var(--text-mid);
            font-size: clamp(1rem, 3vw, 1.2rem);
            max-width: 440px;
        }

        .primary-button {
            padding: 16px 40px;
            border-radius: 999px;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
        }

        .showcase-screen {
            background:
                linear-gradient(180deg, rgba(13, 18, 38, 0.95), rgba(8, 11, 24, 0.98));
        }

        .showcase-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-wrap {
            margin-bottom: 24px;
            text-align: center;
        }

        .score-label {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .score-value {
            margin: 4px 0 0;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 700;
            color: var(--text-dark);
        }

        .showcase-actions {
            display: flex;
            gap: 16px;
        }

        .feedback-gif {
            width: min(42vw, 180px);
            max-width: 180px;
            border-radius: 18px;
            border: 1px solid rgba(158, 214, 255, 0.28);
            box-shadow: var(--shadow-md);
            object-fit: cover;
            pointer-events: none;
            align-self: center;
            margin-bottom: 14px;
            background: rgba(8, 11, 24, 0.72);
        }

        .feedback-gif-top {
            position: absolute;
            top: 88px;
            right: 16px;
            z-index: 55;
            width: min(34vw, 132px);
            margin-bottom: 0;
            opacity: 0.92;
        }

        .secondary-button {
            padding: 12px 32px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dark);
            border: 1px solid rgba(158, 214, 255, 0.18);
        }

        /* [agent-note][stage4] repaired: touch-action scope | element: #gameCanvas | action: keep drag gestures on canvas without suppressing UI taps */
        #gameCanvas {
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 95, 210, 0.08), transparent 20%),
                linear-gradient(180deg, #171a33 0%, #11152c 45%, #090b18 100%);
            touch-action: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 640px) {
            #ui-layer { padding: 12px; }
            .option-panel { padding: 14px; }
            .option-nav { width: 52px; height: 52px; }
            .finish-button { font-size: 1.05rem; }
            .overlay { padding: 20px; }
            .showcase-actions { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "rotationSpeed": { "type": "number", "label": "Spin Speed", "value": 0.5, "min": 0, "max": 5 },
    "bgGridColor": { "type": "color", "label": "Grid Color", "value": "#B2EBF2" },
    "gameTitle": { "type": "text", "label": "Studio Name", "value": "Avatar Remix Studio" }
}
</script>

<!-- Assets -->
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/success/fail -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Studio" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_click" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_change" data-editable="audio" data-label="SFX Option Change" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
    <audio id="sfx_finish" data-editable="audio" data-label="SFX Finish" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <audio id="sfx_back" data-editable="audio" data-label="SFX Back" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>

<div id="game-container" class="relative full-size select-none">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="pointer-events-none">
        <div class="header-row pointer-events-auto">
            <div class="glass title-pill">
                <h1 id="ui-title" class="ui-title">Avatar Remix Studio</h1>
            </div>
            <button id="btn-random" class="glass icon-button btn-press" aria-label="Randomize look">
                <span class="material-symbols-rounded" aria-hidden="true">shuffle</span>
            </button>
        </div>

        <div id="editor-controls" class="pointer-events-auto">
            <div id="category-list" class="hide-scroll"></div>

            <div class="glass option-panel">
                <button id="btn-prev" class="option-nav btn-press" aria-label="Previous option"><</button>
                <div class="option-copy">
                    <span id="current-part-name" class="option-label">SKIN</span>
                    <span id="current-option-name" class="option-value">Classic Yellow</span>
                </div>
                <button id="btn-next" class="option-nav btn-press" aria-label="Next option">></button>
            </div>

            <button id="btn-finish" class="finish-button btn-press">
                PRESENT AVATAR
            </button>
        </div>
    </div>

    <img id="status-gif" class="feedback-gif feedback-gif-top hidden" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Reaction feedback" loading="lazy">
    <div id="start-screen" class="overlay glass pointer-events-auto">
        <div class="start-emoji">🎨</div>
        <h1 class="overlay-title">Avatar Remix Studio</h1>
        <p class="overlay-subtitle">Build a fresh look, spin your avatar, and lock in a final style.</p>
        <button id="start-btn" class="primary-button btn-press">
            START MIXING
        </button>
    </div>

    <div id="showcase-screen" class="overlay glass showcase-screen hidden pointer-events-auto">
        <!-- [agent-note][stage3] resolved-gif: fail reaction -> confused player reaction puzzle fail game gif | showcase celebration -> victory dance win celebration game gif -->
        <img id="showcase-gif" class="feedback-gif hidden" src="https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp" alt="Celebration reaction" loading="lazy">
        <h2 class="showcase-title">STYLE LOCKED!</h2>
        <div class="score-wrap">
            <p class="score-label">Remix Score</p>
            <p id="style-score" class="score-value">99/100</p>
        </div>
        <div class="showcase-actions">
            <button id="btn-back" class="secondary-button btn-press">
                TUNE IT AGAIN
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Config
    window.gameConfigDefs = {
        "rotationSpeed": { "type": "number", "label": "Spin Speed", "value": 0.5, "min": 0, "max": 5 },
        "bgGridColor": { "type": "color", "label": "Grid Color", "value": "#B2EBF2" },
        "gameTitle": { "type": "text", "label": "Studio Name", "value": "Avatar Remix Studio" }
    };
    window.gameConfig = {
        rotationSpeed: 0.5,
        bgGridColor: "#B2EBF2",
        gameTitle: "Avatar Remix Studio"
    };
    window.updateGameConfig = (key, val) => {
        if(window.gameConfig.hasOwnProperty(key)) window.gameConfig[key] = val;
        if(key === 'gameTitle') {
            const el = document.getElementById('ui-title');
            if(el) el.innerText = val;
        }
    };

    // --- Audio + Feedback System ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtx ? new AudioCtx() : null;
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        click: document.getElementById('sfx_click'),
        change: document.getElementById('sfx_change'),
        start: document.getElementById('sfx_start'),
        finish: document.getElementById('sfx_finish'),
        back: document.getElementById('sfx_back')
    };
    const statusGif = document.getElementById('status-gif');
    const showcaseGif = document.getElementById('showcase-gif');
    const soundVolumes = {
        bgm: 0.2,
        click: 0.45,
        change: 0.4,
        start: 0.5,
        finish: 0.55,
        back: 0.4
    };
    const soundCooldowns = {
        click: 90,
        change: 80,
        start: 250,
        finish: 500,
        back: 250
    };
    let audioReady = false;
    let bgmStarted = false;
    let bgmMode = 'idle';
    let feedbackTimer = null;
    const lastSoundAt = {};

    const ensureAudioReady = () => {
        audioReady = true;
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        if (bgmMode === 'edit') {
            startBgm();
        }
    };

    const playFallbackTone = (mode = 'soft') => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = mode === 'celebrate' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(mode === 'celebrate' ? 420 : 280, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(mode === 'celebrate' ? 820 : 180, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
    };

    const startBgm = () => {
        const bgm = sounds.bgm;
        if (!bgm || !audioReady) return;
        bgm.volume = soundVolumes.bgm;
        if (bgmStarted && !bgm.paused) return;
        bgm.currentTime = bgm.currentTime || 0;
        bgm.play().then(() => {
            bgmStarted = true;
        }).catch(() => {
            bgmStarted = false;
        });
    };

    const pauseBgm = () => {
        const bgm = sounds.bgm;
        if (!bgm) return;
        bgm.pause();
        bgmStarted = false;
    };

    const setBgmMode = (mode) => {
        bgmMode = mode;
        if (mode === 'edit') {
            startBgm();
        } else {
            pauseBgm();
        }
    };

    const playSound = (id, options = {}) => {
        const el = sounds[id];
        const now = performance.now();
        const cooldown = options.cooldown ?? soundCooldowns[id] ?? 0;
        if (cooldown && lastSoundAt[id] && now - lastSoundAt[id] < cooldown) return;
        lastSoundAt[id] = now;
        ensureAudioReady();
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.volume = options.volume ?? soundVolumes[id] ?? 0.45;
            el.play().catch(() => {
                playFallbackTone(options.fallbackMode);
            });
        } else {
            playFallbackTone(options.fallbackMode);
        }
    };

    const showStatusGif = (kind) => {
        if (!statusGif) return;
        clearTimeout(feedbackTimer);
        if (kind === 'edit') {
            statusGif.src = 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp';
            statusGif.alt = 'Confused reaction';
            statusGif.classList.remove('hidden');
            feedbackTimer = setTimeout(() => {
                statusGif.classList.add('hidden');
            }, 1200);
        } else {
            statusGif.classList.add('hidden');
        }
    };

    const updateShowcaseGif = (visible) => {
        if (!showcaseGif) return;
        showcaseGif.classList.toggle('hidden', !visible);
    };

    document.addEventListener('pointerdown', ensureAudioReady, { once: true });
    document.addEventListener('keydown', ensureAudioReady, { once: true });

    // --- Game State ---
    let gameState = 'START'; // START, EDIT, SHOWCASE
    let time = 0;
    let particles = [];
    let confetti = [];
    let sparkles = [];
    
    // Avatar Data
    const categories = ['skin', 'face', 'shirt', 'pants', 'hat'];
    const categoryLabels = { skin: 'Skin Tone', face: 'Expression', shirt: 'Top Layer', pants: 'Bottom Layer', hat: 'Head Gear' };
    
    let avatar = {
        skin: 0,
        face: 0,
        shirt: 0,
        pants: 0,
        hat: 0
    };

    let currentCategoryIndex = 0;
    
    // Asset Definitions (Procedural Data)
    const db = {
        skin: [
            { name: "Classic Yellow", val: "#FFD54F" },
            { name: "Warm Beige", val: "#F5D0BA" },
            { name: "Cool Pale", val: "#FFE0BD" },
            { name: "Deep Bronze", val: "#8D5524" },
            { name: "Espresso", val: "#3E2723" },
            { name: "Alien Green", val: "#C6FF00" },
            { name: "Cyber Blue", val: "#00E5FF" },
            { name: "Ghost White", val: "#F5F5F5" }
        ],
        face: [
            { name: "Default Smile", type: 0 },
            { name: "Chill", type: 1 },
            { name: "Surprised", type: 2 },
            { name: "Cool Shades", type: 3 },
            { name: "Determined", type: 4 },
            { name: "Wink", type: 5 }
        ],
        shirt: [
            { name: "Basic Grey", val: "#9E9E9E" },
            { name: "Red Hoodie", val: "#F44336" },
            { name: "Blue Tee", val: "#2196F3" },
            { name: "Green Flannel", val: "#4CAF50" },
            { name: "Tuxedo Black", val: "#212121" },
            { name: "Purple Stripe", val: "#9C27B0" },
            { name: "Orange Vest", val: "#FF9800" }
        ],
        pants: [
            { name: "Blue Jeans", val: "#1565C0" },
            { name: "Black Slacks", val: "#212121" },
            { name: "Khakis", val: "#D7CCC8" },
            { name: "Shorts Green", val: "#81C784" },
            { name: "White Joggers", val: "#ECEFF1" }
        ],
        hat: [
            { name: "None", type: -1 },
            { name: "Baseball Cap", type: 0, color: "#D32F2F" },
            { name: "Top Hat", type: 1, color: "#212121" },
            { name: "Beanie", type: 2, color: "#FF5722" },
            { name: "Headphones", type: 3, color: "#3F51B5" },
            { name: "Crown", type: 4, color: "#FFD700" }
        ]
    };

    // --- Input Handling ---
    let pointerDown = false;
    let lastX = 0;
    let rotation = 0;
    let targetRotation = 0;
    let bounceY = 0;

    const handleInput = (e) => {
        if(gameState !== 'EDIT' && gameState !== 'SHOWCASE') return;
        if(e.target.tagName !== 'CANVAS') return;
        
        pointerDown = true;
        lastX = e.clientX;
    };

    const handleMove = (e) => {
        if (!pointerDown) return;
        const delta = e.clientX - lastX;
        targetRotation += delta * 0.01;
        lastX = e.clientX;
    };

    const handleEnd = () => {
        pointerDown = false;
    };

    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', handleMove, { passive: false });
    window.addEventListener('pointerup', handleEnd);
    window.addEventListener('pointercancel', handleEnd);

    // --- UI Logic ---
    const initUI = () => {
        const catList = document.getElementById('category-list');
        catList.innerHTML = '';
        categories.forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn btn-press${idx === 0 ? ' active' : ''}`;
            btn.innerText = categoryLabels[cat];
            btn.onclick = () => selectCategory(idx);
            catList.appendChild(btn);
        });
        updateUI();
    };

    const selectCategory = (idx) => {
        currentCategoryIndex = idx;
        
        const btns = document.querySelectorAll('.cat-btn');
        btns.forEach((b, i) => {
            b.classList.toggle('active', i === idx);
        });
        updateUI();
        playSound('click', { fallbackMode: 'soft' });
    };

    const changeOption = (dir) => {
        const cat = categories[currentCategoryIndex];
        const len = db[cat].length;
        let val = avatar[cat] + dir;
        if (val < 0) val = len - 1;
        if (val >= len) val = 0;
        avatar[cat] = val;
        
        bounceY = 15;
        spawnParticles(0, -50, 10, db[cat][val].val || '#FFD700');
        
        updateUI();
        playSound('change', { fallbackMode: 'soft' });
    };

    const updateUI = () => {
        const cat = categories[currentCategoryIndex];
        const optIndex = avatar[cat];
        const optData = db[cat][optIndex];
        
        document.getElementById('current-part-name').innerText = categoryLabels[cat];
        document.getElementById('current-option-name').innerText = optData.name;
    };

    const randomizeAvatar = () => {
        categories.forEach(cat => {
            const len = db[cat].length;
            avatar[cat] = Math.floor(Math.random() * len);
        });
        bounceY = 20;
        spawnParticles(0, -50, 30, '#FFFFFF');
        playSound('change', { fallbackMode: 'soft' });
        updateUI();
    };

    document.getElementById('btn-prev').onclick = () => changeOption(-1);
    document.getElementById('btn-next').onclick = () => changeOption(1);
    document.getElementById('btn-random').onclick = randomizeAvatar;
    
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('pointer-events-none');
        gameState = 'EDIT';
        setBgmMode('edit');
        playSound('start', { fallbackMode: 'soft' });
        showStatusGif('hide');
        initUI();
    };

    document.getElementById('btn-finish').onclick = () => {
        gameState = 'SHOWCASE';
        document.getElementById('editor-controls').classList.add('hidden');
        document.getElementById('showcase-screen').classList.remove('hidden');
        document.getElementById('btn-random').classList.add('hidden');
        
        const score = Math.floor(80 + Math.random() * 20);
        document.getElementById('style-score').innerText = score + "/100";
        
        setBgmMode('idle');
        updateShowcaseGif(true);
        showStatusGif('hide');
        playSound('finish', { fallbackMode: 'celebrate' });
        for(let i=0; i<50; i++) {
            confetti.push({
                x: 0, y: 0,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 1) * 20 - 10,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 100
            });
        }
    };

    document.getElementById('btn-back').onclick = () => {
        gameState = 'EDIT';
        document.getElementById('showcase-screen').classList.add('hidden');
        document.getElementById('editor-controls').classList.remove('hidden');
        document.getElementById('btn-random').classList.remove('hidden');
        updateShowcaseGif(false);
        showStatusGif('edit');
        setBgmMode('edit');
        playSound('back', { fallbackMode: 'soft' });
    };

    // --- Rendering ---
    const drawRoundedRect = (ctx, x, y, w, h, r, color, stroke=true) => {
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.arcTo(x+w, y, x+w, y+h, r);
        ctx.arcTo(x+w, y+h, x, y+h, r);
        ctx.arcTo(x, y+h, x, y, r);
        ctx.arcTo(x, y, x+w, y, r);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        if(stroke) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.stroke();
        }
    };

    const glowCircle = (ctx, x, y, radius, color, alpha = 0.3) => {
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, color.replace('ALPHA', alpha));
        gradient.addColorStop(1, color.replace('ALPHA', 0));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    };

    const drawAvatar = (ctx, scale) => {
        const skinColor = db.skin[avatar.skin].val;
        const shirtColor = db.shirt[avatar.shirt].val;
        const pantsColor = db.pants[avatar.pants].val;
        
        const headSize = 50;
        const torsoW = 50, torsoH = 50;
        const limbW = 20, limbH = 50;
        
        const bounce = Math.sin(time * 3) * 3 + bounceY;
        
        ctx.save();
        ctx.translate(0, -bounce);

        glowCircle(ctx, 0, -15, 92, 'rgba(77, 246, 255, ALPHA)', 0.18);
        glowCircle(ctx, 0, -72, 58, 'rgba(255, 95, 210, ALPHA)', 0.18);

        drawRoundedRect(ctx, -25, 30, limbW, limbH, 5, pantsColor);
        drawRoundedRect(ctx, 5, 30, limbW, limbH, 5, pantsColor);
        
        drawRoundedRect(ctx, -25, -20, torsoW, torsoH, 5, shirtColor);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.arc(0, 5, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(-13, -10, 26, 6);

        const armAngle = Math.sin(time * 2) * 0.1;
        
        ctx.save();
        ctx.translate(-25, -15);
        ctx.rotate(armAngle);
        drawRoundedRect(ctx, -limbW, 0, limbW, limbH, 5, skinColor);
        drawRoundedRect(ctx, -limbW, 0, limbW, 15, 2, shirtColor, false);
        ctx.restore();

        ctx.save();
        ctx.translate(25, -15);
        ctx.rotate(-armAngle);
        drawRoundedRect(ctx, 0, 0, limbW, limbH, 5, skinColor);
        drawRoundedRect(ctx, 0, 0, limbW, 15, 2, shirtColor, false);
        ctx.restore();

        drawRoundedRect(ctx, -25, -75, headSize, headSize, 8, skinColor);
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(-8, -66, 10, 0, Math.PI * 2);
        ctx.fill();
        
        const faceType = db.face[avatar.face].type;
        ctx.strokeStyle = '#07111a';
        ctx.lineWidth = 3;
        ctx.fillStyle = '#07111a';
        
        if (faceType === 0) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -45, 8, 0, Math.PI, false); ctx.stroke();
        } else if (faceType === 1) {
            ctx.fillRect(-15, -55, 10, 3);
            ctx.fillRect(5, -55, 10, 3);
            ctx.beginPath(); ctx.moveTo(-5, -45); ctx.lineTo(5, -45); ctx.stroke();
        } else if (faceType === 2) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -40, 6, 0, Math.PI*2); ctx.fill();
        } else if (faceType === 3) {
            ctx.fillStyle = '#111';
            ctx.fillRect(-20, -60, 40, 10);
            ctx.beginPath(); ctx.moveTo(-5, -45); ctx.lineTo(5, -45); ctx.stroke();
        } else if (faceType === 4) {
            ctx.beginPath(); ctx.moveTo(-15, -60); ctx.lineTo(-5, -55); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(15, -60); ctx.lineTo(5, -55); ctx.stroke();
            ctx.beginPath(); ctx.arc(-10, -52, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -52, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5, -40); ctx.lineTo(5, -40); ctx.stroke();
        } else if (faceType === 5) {
            ctx.beginPath(); ctx.arc(-10, -55, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(5, -55); ctx.lineTo(15, -55); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, -45, 8, 0, Math.PI, false); ctx.stroke();
        }

        const hatData = db.hat[avatar.hat];
        if (hatData.type !== -1) {
            ctx.fillStyle = hatData.color;
            if (hatData.type === 0) {
                ctx.fillRect(-26, -80, 52, 15);
                ctx.fillRect(-26, -80, 60, 5);
            } else if (hatData.type === 1) {
                ctx.fillRect(-35, -75, 70, 5);
                ctx.fillRect(-20, -115, 40, 40);
            } else if (hatData.type === 2) {
                ctx.beginPath();
                ctx.arc(0, -75, 26, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(-26, -75, 52, 10);
            } else if (hatData.type === 3) {
                ctx.lineWidth = 4;
                ctx.strokeStyle = hatData.color;
                ctx.beginPath(); ctx.arc(0, -75, 30, Math.PI, 0); ctx.stroke();
                ctx.fillRect(-35, -75, 10, 20);
                ctx.fillRect(25, -75, 10, 20);
            } else if (hatData.type === 4) {
                ctx.beginPath();
                ctx.moveTo(-25, -75);
                ctx.lineTo(-25, -95);
                ctx.lineTo(-12, -85);
                ctx.lineTo(0, -100);
                ctx.lineTo(12, -85);
                ctx.lineTo(25, -95);
                ctx.lineTo(25, -75);
                ctx.fill();
            }
        }

        ctx.restore();
    };

    const spawnParticles = (x, y, count, color) => {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    };

    const drawParticles = (ctx) => {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            
            if(p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    };

    const drawSparkles = (ctx, w, h) => {
        if (sparkles.length < 24 && Math.random() > 0.8) {
            sparkles.push({
                x: Math.random() * w,
                y: Math.random() * h * 0.72,
                size: 1 + Math.random() * 3,
                life: 0.4 + Math.random() * 0.6,
                drift: 0.2 + Math.random() * 0.8
            });
        }

        for (let i = sparkles.length - 1; i >= 0; i--) {
            const s = sparkles[i];
            s.y += s.drift;
            s.life -= 0.01;
            if (s.life <= 0) {
                sparkles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#8be9ff';
            ctx.fillRect(s.x, s.y, s.size, s.size);
            ctx.globalAlpha = 1;
        }
    };

    const drawConfetti = (ctx) => {
        for(let i=confetti.length-1; i>=0; i--) {
            let p = confetti[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life--;
            
            if(p.life <= 0) {
                confetti.splice(i, 1);
                continue;
            }
            
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 8, 8);
        }
    };

    const drawGrid = (ctx, w, h) => {
        ctx.strokeStyle = window.gameConfig.bgGridColor;
        ctx.lineWidth = 1;
        const spacing = 40;
        const offset = (time * 20) % spacing;
        
        ctx.beginPath();
        for(let x = 0; x <= w; x += spacing) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        for(let y = offset; y <= h; y += spacing) {
            ctx.moveTo(0, y); ctx.lineTo(w, y);
        }
        ctx.stroke();
    };

    // --- Main Loop ---
    const loop = () => {
        requestAnimationFrame(loop);
        
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        const w = rect.width;
        const h = rect.height;

        time += 0.016;
        if (bounceY > 0) bounceY *= 0.8;
        
        if (gameState === 'SHOWCASE') {
            targetRotation += 0.01;
        } else {
            targetRotation += window.gameConfig.rotationSpeed * 0.01;
        }
        
        rotation += (targetRotation - rotation) * 0.1;

        const backgroundGradient = ctx.createLinearGradient(0, 0, 0, h);
        backgroundGradient.addColorStop(0, '#171a33');
        backgroundGradient.addColorStop(0.48, '#11152c');
        backgroundGradient.addColorStop(1, '#090b18');
        ctx.fillStyle = backgroundGradient;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(255,95,210,0.08)';
        ctx.beginPath();
        ctx.arc(w * 0.25, h * 0.18, Math.min(w, h) * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(77,246,255,0.08)';
        ctx.beginPath();
        ctx.arc(w * 0.76, h * 0.24, Math.min(w, h) * 0.22, 0, Math.PI * 2);
        ctx.fill();

        drawGrid(ctx, w, h);
        drawSparkles(ctx, w, h);

        try {
            ctx.save();
            ctx.translate(w/2, h/2 + 50);
            
            ctx.save();
            ctx.scale(1, 0.3);
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath(); ctx.arc(0, 200, 120, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(77,246,255,0.2)';
            ctx.beginPath(); ctx.arc(0, 210, 120, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.scale(2, 2);
            drawAvatar(ctx, 1);
            drawParticles(ctx);
            drawConfetti(ctx);

            ctx.restore();

        } catch (e) {
            console.error(e);
        }
    };

    loop();
});
</script>
