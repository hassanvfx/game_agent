<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block City RP: Live</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #06162d;
        --sky-bottom: #0f4f7a;
        --panel-bg: rgba(8, 21, 43, 0.74);
        --panel-border: rgba(124, 229, 255, 0.64);
        --panel-highlight: rgba(255, 255, 255, 0.14);
        --accent: #52e3ff;
        --accent-strong: #1bb8ff;
        --accent-warm: #ffd85d;
        --danger: #ff6b81;
        --text-main: #ecf7ff;
        --text-soft: #9ed7ef;
        --shadow-deep: rgba(0, 8, 20, 0.45);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(82, 227, 255, 0.28), transparent 30%),
            linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 52%, #45b5db 100%);
        font-family: 'Rajdhani', sans-serif;
        color: var(--text-main);
        -webkit-user-select: none;
        user-select: none;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.06), transparent 25%),
            radial-gradient(circle at 15% 20%, rgba(255,255,255,0.2), transparent 12%),
            radial-gradient(circle at 82% 14%, rgba(255,216,93,0.16), transparent 10%),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 90px);
        opacity: 0.9;
    }
    canvas { display: block; touch-action: none; outline: none; }
    .glass {
        background: linear-gradient(180deg, rgba(14, 31, 59, 0.84), rgba(10, 20, 39, 0.88));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 12px 32px var(--shadow-deep),
            inset 0 1px 0 var(--panel-highlight),
            0 0 24px rgba(82, 227, 255, 0.12);
    }
    .btn-action { transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; }
    .btn-action:active { transform: scale(0.94); filter: brightness(1.06); }
    .hidden { display: none !important; }
    .ui-title, #btn-interact, #btn-play, #btn-menu { font-family: 'Orbitron', sans-serif; letter-spacing: 0.08em; }
    .ui-subtitle, .ui-copy, #hud, #inp-chat, #inp-name { font-family: 'Rajdhani', sans-serif; }
    .city-avatar {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 35% 30%, #fff8c4 0 14%, #ffd85d 14% 56%, #ffab40 57% 100%);
        box-shadow:
            0 10px 24px rgba(0,0,0,0.2),
            0 0 28px rgba(255, 216, 93, 0.45);
    }
    .city-avatar::before,
    .city-avatar::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        background: #13213d;
        top: 32%;
        width: 8px;
        height: 12px;
    }
    .city-avatar::before { left: 26px; }
    .city-avatar::after { right: 26px; }
    .city-avatar .avatar-mouth {
        position: absolute;
        left: 50%;
        bottom: 20px;
        width: 28px;
        height: 14px;
        transform: translateX(-50%);
        border-bottom: 4px solid #13213d;
        border-radius: 0 0 20px 20px;
    }
    .city-avatar .avatar-headset {
        position: absolute;
        inset: 10px;
        border-radius: 999px;
        border: 4px solid rgba(19, 33, 61, 0.9);
        clip-path: inset(0 0 52% 0);
    }
    .city-avatar .avatar-headset::before,
    .city-avatar .avatar-headset::after {
        content: "";
        position: absolute;
        bottom: 14px;
        width: 10px;
        height: 18px;
        border-radius: 10px;
        background: #13213d;
    }
    .city-avatar .avatar-headset::before { left: -1px; }
    .city-avatar .avatar-headset::after { right: -1px; }
    #screen-login {
        background:
            radial-gradient(circle at 50% 18%, rgba(82, 227, 255, 0.34), transparent 22%),
            linear-gradient(180deg, #06162d 0%, #0d3255 48%, #1d7eb2 100%);
    }
    #screen-login .glass { max-width: min(20rem, calc(100vw - 2rem)); }
    #btn-play {
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: #031521;
        box-shadow: 0 10px 20px rgba(27, 184, 255, 0.32);
    }
    #btn-play:hover { filter: brightness(1.05); }
    #btn-menu, #btn-jump {
        color: var(--text-main);
        background: linear-gradient(180deg, rgba(19, 41, 77, 0.96), rgba(10, 21, 43, 0.95));
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 22px rgba(0, 8, 20, 0.36);
    }
    #btn-interact {
        background: linear-gradient(180deg, rgba(255, 216, 93, 0.98), rgba(255, 171, 64, 0.98));
        border: 2px solid rgba(255,255,255,0.75);
        color: #2b1800;
        box-shadow: 0 10px 24px rgba(255, 171, 64, 0.35);
        text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    }
    #interaction-zone { filter: drop-shadow(0 12px 18px rgba(0,0,0,0.25)); }
    #joystick-zone {
        background:
            radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), rgba(255,255,255,0.08) 35%, rgba(7, 19, 39, 0.65) 70%),
            linear-gradient(180deg, rgba(20, 42, 76, 0.72), rgba(7, 17, 35, 0.82));
        border: 2px solid rgba(149, 234, 255, 0.4);
        box-shadow: 0 10px 24px rgba(0, 6, 20, 0.34), inset 0 2px 10px rgba(255,255,255,0.08);
        mix-blend-mode: normal;
    }
    #stick {
        background: radial-gradient(circle at 35% 30%, #ffffff, #78efff 45%, #00a8f3 100%);
        box-shadow: 0 8px 18px rgba(0, 12, 22, 0.35);
    }
    #chat-box {
        color: var(--text-main);
        text-shadow: 0 2px 8px rgba(0,0,0,0.45);
        background: linear-gradient(180deg, rgba(5, 12, 28, 0.22), rgba(5, 12, 28, 0));
        border-radius: 1rem;
    }
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: rgba(120,239,255,0.4); border-radius: 4px; }
    #inp-chat, #inp-name {
        background: rgba(240, 252, 255, 0.95);
        color: #10243e;
        font-weight: 700;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
    }
    #inp-chat::placeholder, #inp-name::placeholder { color: rgba(16, 36, 62, 0.65); }
    #server-status { color: #9ef0ae; text-shadow: 0 0 12px rgba(158, 240, 174, 0.3); }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 rgba(82, 227, 255, 0.2); } 50% { box-shadow: 0 0 22px rgba(82, 227, 255, 0.28); } }
    .animate-float { animation: float 2s ease-in-out infinite; }
    .pulse-glow { animation: pulseGlow 2.2s ease-in-out infinite; }
    .feedback-gif {
        position: absolute;
        right: 1rem;
        width: 96px;
        height: 96px;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 12px 24px rgba(0,0,0,0.28);
        opacity: 0;
        transform: translateY(12px) scale(0.94);
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
        z-index: 35;
        background: rgba(8, 21, 43, 0.85);
    }
    .feedback-gif.show {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }
    #gif-claim { top: 5.5rem; }
    #gif-drive { top: 12.5rem; }
    @media (max-width: 640px) {
        .feedback-gif {
            width: 72px;
            height: 72px;
            right: 0.75rem;
        }
        #gif-claim { top: 5rem; }
        #gif-drive { top: 10.25rem; }
    }
</style>

<div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
    
    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="absolute inset-0 flex flex-col items-center justify-center bg-[#81D4FA] pointer-events-auto z-50">
        <div class="glass p-6 rounded-3xl text-center shadow-xl w-80 flex flex-col items-center">

            </div>
            <h1 class="ui-title text-3xl font-extrabold text-cyan-100 mb-1">BLOCK CITY LIVE</h1>
            <p class="ui-subtitle text-sm text-cyan-100/70 mb-6 font-semibold tracking-[0.25em] uppercase">Neon Social Sandbox</p>
            
            <input type="text" id="inp-name" class="w-full p-3 rounded-xl border-2 border-cyan-100/50 mb-2 text-center text-lg font-bold outline-none focus:border-[#52e3ff]" placeholder="Enter Username" maxlength="12">

<script>
/**
 * BLOCK CITY RP ENGINE
 * A simulated multiplayer voxel sandbox.
 */

// --- CONFIG & STATE ---
const CONFIG = {
    colors: {
        grass: '#2f8f72',
        road: '#2d3f52',
        roadLine: '#c1ecff',
        skin: '#FFCC80',
        sky: '#0b2b4f',
        towerGlow: '#52e3ff',
        plotAccent: '#ffd85d'
    },
    names: ["CoolKid99", "RP_Queen", "DriftKing", "NoobMaster", "CityGirl", "RichGuy", "Cop_Mike", "BuilderBob"],
    chats: [
        "ABC for mom", "Anyone wanna trade?", "Party at my house!", "Where is the bank?", 
        "Nice car!", "Can I live with you?", "Selling pizza", "Im new here", "lol", "sub to my channel"
    ]
};

let gameConfig = { heroSpeed: 5, carSpeed: 12, themeColor: "#00E5FF", gameTitle: "Brookhaven City 1" };
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let audioCtx = null;
let bgmStarted = false;
let gifTimeouts = {};

// --- INPUT ---
const input = {
    x: 0, y: 0, active: false,
    keys: {},
    interact: false,
    jump: false
};

// --- WORLD ---
const world = {
    camX: 0, camY: 0, camZ: 0,
    targetCamX: 0, targetCamY: 0,
    entities: [],
    particles: [],
    plots: [],
    cars: [],
    myPlayer: null
};

// --- AUDIO SYSTEM ---
const AudioMan = {
    init: () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        AudioMan.startLoop();
    },
    startLoop: () => {
        const bgm = document.getElementById('bgm_city');
        if (!bgm || bgmStarted) return;
        bgm.volume = 0.2;
        bgmStarted = true;
        bgm.play().catch(() => {
            bgmStarted = false;
        });
    },
    pauseLoop: () => {
        const bgm = document.getElementById('bgm_city');
        if (!bgm) return;
        bgm.pause();
        bgmStarted = false;
    },
    play: (id, volume = 0.5) => {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            el.play().catch(() => {});
        } catch (_) {}
    },
    playUi: () => AudioMan.play('sfx_ui', 0.45),
    playStart: () => AudioMan.play('sfx_start', 0.55),
    playClaim: () => AudioMan.play('sfx_claim', 0.55),
    playDrive: () => AudioMan.play('sfx_drive', 0.45),
    playExit: () => AudioMan.play('sfx_exit', 0.42),
    playChat: () => AudioMan.play('sfx_chat', 0.35)
};

// --- ISOMETRIC MATH ---
const ISO = {
    scale: 30,
    project: (x, y, z) => ({
        x: (x - y) * ISO.scale,
        y: (x + y) * (ISO.scale * 0.5) - z * ISO.scale
    })
};

// --- ENTITIES ---
class Entity {
    constructor(x, y, z) {
        this.x = x; this.y = y; this.z = z;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.w = 0.5; this.h = 0.5; this.d = 0.5;
        this.color = '#fff';
        this.rotation = 0;
        this.type = 'prop';
    }
    update(dt) {}
    draw(ctx, cx, cy) {}
}

class Player extends Entity {
    constructor(x, y, name, isBot = false) {
        super(x, y, 0);
        this.type = 'player';
        this.name = name;
        this.isBot = isBot;
        this.shirtColor = isBot ? ['#EF5350', '#42A5F5', '#FFA726', '#AB47BC'][Math.floor(Math.random()*4)] : '#00E5FF';
        this.pantsColor = '#37474F';
        this.state = 'idle'; // idle, walk, drive
        this.car = null;
        this.animTimer = 0;
        this.chatTimer = isBot ? Math.random() * 500 + 200 : 0;
        
        // Bot AI
        this.targetX = x;
        this.targetY = y;
        this.botWait = 0;
    }

    update(dt) {
        this.animTimer += dt;

        if (this.state === 'drive' && this.car) {
            this.x = this.car.x;
            this.y = this.car.y;
            this.z = this.car.z + 0.5;
            this.rotation = this.car.rotation;
            return; // Car controls movement
        }

        if (this.isBot) this.updateBot(dt);

        // Physics
        this.x += this.vx * (dt/16);
        this.y += this.vy * (dt/16);
        
        // Ground Clamp
        if (this.z > 0) {
            this.vz -= 0.02 * (dt/16);
            this.z += this.vz * (dt/16);
        } else {
            this.z = 0;
            this.vz = 0;
        }

        // Walk Anim
        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (speed > 0.01) {
            this.rotation = Math.atan2(this.vy, this.vx);
        }
    }

    updateBot(dt) {
        if (this.botWait > 0) {
            this.botWait -= dt;
            this.vx = 0; this.vy = 0;
            return;
        }

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 1) {
            // New target
            this.targetX = (Math.random() * 40) - 20;
            this.targetY = (Math.random() * 40) - 20;
            this.botWait = 100 + Math.random() * 200;
        } else {
            this.vx = (dx/dist) * (gameConfig.heroSpeed * 0.05);
            this.vy = (dy/dist) * (gameConfig.heroSpeed * 0.05);
        }

        // Random Chat
        this.chatTimer -= dt;
        if (this.chatTimer <= 0) {
            const msg = CONFIG.chats[Math.floor(Math.random() * CONFIG.chats.length)];
            spawnChat(this, msg);
            this.chatTimer = 500 + Math.random() * 1000;
        }
    }

    draw(ctx, cx, cy) {
        if (this.state === 'drive') return; // Hidden inside car

        const bob = Math.abs(Math.sin(this.animTimer * 0.2)) * 0.1;
        const z = this.z + bob;
        
        // Draw Blocky Character with stronger silhouette
        drawCube(ctx, cx, cy, this.x, this.y, z, 0.2, 0.2, 0.42, this.pantsColor);
        drawCube(ctx, cx, cy, this.x, this.y, z, -0.2, -0.2, 0.42, this.pantsColor);
        drawCube(ctx, cx, cy, this.x, this.y, z + 0.4, 0.62, 0.34, 0.54, this.shirtColor);
        drawCube(ctx, cx, cy, this.x, this.y, z + 0.78, 0.78, 0.14, 0.12, '#ffe082');
        drawCube(ctx, cx, cy, this.x - 0.22, this.y + 0.18, z + 0.72, 0.12, 0.12, 0.36, adjustColor(this.shirtColor, 18));
        drawCube(ctx, cx, cy, this.x + 0.22, this.y - 0.18, z + 0.72, 0.12, 0.12, 0.36, adjustColor(this.shirtColor, 18));
        drawCube(ctx, cx, cy, this.x, this.y, z + 0.96, 0.34, 0.34, 0.34, CONFIG.colors.skin);
        drawCube(ctx, cx, cy, this.x, this.y, z + 1.12, 0.4, 0.08, 0.08, '#13213d');
        drawCube(ctx, cx, cy, this.x - 0.09, this.y + 0.04, z + 1.04, 0.06, 0.06, 0.06, '#ffffff');
        drawCube(ctx, cx, cy, this.x + 0.09, this.y - 0.04, z + 1.04, 0.06, 0.06, 0.06, '#ffffff');
        drawCube(ctx, cx, cy, this.x - 0.09, this.y + 0.04, z + 1.05, 0.025, 0.025, 0.025, '#13213d');
        drawCube(ctx, cx, cy, this.x + 0.09, this.y - 0.04, z + 1.05, 0.025, 0.025, 0.025, '#13213d');
        drawCube(ctx, cx, cy, this.x, this.y + 0.01, z + 0.96, 0.08, 0.18, 0.02, '#ff7043');
        
        // Name Tag
        const pos = ISO.project(this.x - world.camX, this.y - world.camY, z + 1.5);
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.roundRect(cx + pos.x - 30, cy + pos.y - 10, 60, 14, 4);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 10px 'Rajdhani'";
        ctx.textAlign = "center";
        ctx.fillText(this.name, cx + pos.x, cy + pos.y);
    }
}

class Car extends Entity {
    constructor(x, y, color) {
        super(x, y, 0);
        this.type = 'car';
        this.color = color;
        this.driver = null;
        this.rotation = 0;
        this.speed = 0;
    }

    update(dt) {
        if (this.driver) {
            // Driver controls
            if (this.driver === world.myPlayer) {
                // Player input
                let turn = 0;
                let accel = 0;
                
                if (input.x !== 0 || input.y !== 0) {
                    // Joystick driving
                    const targetAngle = Math.atan2(input.y, input.x) - Math.PI/4;
                    // Simple turning logic
                    const diff = targetAngle - this.rotation;
                    // Normalize angle
                    let d = Math.atan2(Math.sin(diff), Math.cos(diff));
                    turn = d * 0.1;
                    accel = Math.min(1, Math.sqrt(input.x*input.x + input.y*input.y));
                }
                
                this.rotation += turn;
                this.speed += (accel * gameConfig.carSpeed * 0.01 - this.speed * 0.05); // Accel + Friction
                
                this.vx = Math.cos(this.rotation) * this.speed;
                this.vy = Math.sin(this.rotation) * this.speed;
            } else {
                // Bot driving logic (simple loops)
                this.rotation += 0.02;
                this.speed = 5;
                this.vx = Math.cos(this.rotation) * this.speed * 0.05;
                this.vy = Math.sin(this.rotation) * this.speed * 0.05;
            }
        } else {
            this.speed *= 0.9;
            this.vx *= 0.9;
            this.vy *= 0.9;
        }

        this.x += this.vx * (dt/16);
        this.y += this.vy * (dt/16);
    }

    draw(ctx, cx, cy) {
        drawCube(ctx, cx, cy, this.x, this.y, this.z + 0.12, 1.28, 0.68, 0.14, '#111827', this.rotation);
        drawCube(ctx, cx, cy, this.x, this.y, this.z + 0.26, 1.2, 0.62, 0.34, this.color, this.rotation);
        drawCube(ctx, cx, cy, this.x + 0.18, this.y, this.z + 0.66, 0.34, 0.44, 0.24, '#d7f1ff', this.rotation);
        drawCube(ctx, cx, cy, this.x - 0.2, this.y, this.z + 0.46, 0.22, 0.54, 0.18, '#ffd85d', this.rotation);
    }
}

class HousePlot extends Entity {
    constructor(x, y) {
        super(x, y, 0);
        this.type = 'plot';
        this.owner = null;
        this.houseType = 0;
    }
    
    draw(ctx, cx, cy) {
        if (this.owner) {
            // Draw House
            const col = this.owner === world.myPlayer ? CONFIG.colors.towerGlow : '#ff8a65';
            drawCube(ctx, cx, cy, this.x, this.y, 0, 4, 4, 0.12, '#2e7d68');
            drawCube(ctx, cx, cy, this.x, this.y, 0, 4, 4, 3, '#f5fbff');
            drawCube(ctx, cx, cy, this.x, this.y, 3, 4.2, 4.2, 0.38, col);
            drawCube(ctx, cx, cy, this.x + 2, this.y, 0, 0.24, 1, 2, '#5D4037');
            drawCube(ctx, cx, cy, this.x - 1.1, this.y + 1.2, 1.15, 0.7, 0.1, 0.72, '#d7f1ff');
            drawCube(ctx, cx, cy, this.x - 1.1, this.y - 1.2, 1.15, 0.7, 0.1, 0.72, '#d7f1ff');
            
            // Sign
            const pos = ISO.project(this.x - world.camX, this.y - world.camY + 3, 2);
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.roundRect(cx + pos.x - 30, cy + pos.y - 15, 60, 20, 5);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "600 10px 'Rajdhani'";
            ctx.textAlign = "center";
            ctx.fillText(this.owner.name + "'s", cx + pos.x, cy + pos.y - 2);
            ctx.fillText("House", cx + pos.x, cy + pos.y + 8);
        } else {
            // Empty Plot Sign
            drawCube(ctx, cx, cy, this.x, this.y, 0, 4, 4, 0.12, '#2e7d68'); // Grass pad
            drawCube(ctx, cx, cy, this.x, this.y, 0, 0.2, 0.2, 1.5, '#8D6E63'); // Post
            drawCube(ctx, cx, cy, this.x, this.y, 1.5, 0.12, 1.58, 1, '#f8fdff'); // Sign board
            
            const pos = ISO.project(this.x - world.camX, this.y - world.camY, 2);
            ctx.fillStyle = "#2E7D32";
            ctx.font = "700 12px 'Orbitron'";
            ctx.textAlign = "center";
            ctx.fillText("FOR SALE", cx + pos.x, cy + pos.y);
        }
    }
}

// --- RENDERER HELPER ---
function drawCube(ctx, cx, cy, x, y, z, w, l, h, color, rot = 0) {
    // Simple painter's algo approximation for cubes
    // Calculate vertices
    const hw = w/2, hl = l/2;
    
    // Rotate corners
    const corners = [
        {x: -hw, y: -hl}, {x: hw, y: -hl}, {x: hw, y: hl}, {x: -hw, y: hl}
    ];
    
    if (rot !== 0) {
        const c = Math.cos(rot), s = Math.sin(rot);
        corners.forEach(p => {
            const nx = p.x * c - p.y * s;
            const ny = p.x * s + p.y * c;
            p.x = nx; p.y = ny;
        });
    }

    // Project top face
    const pTop = corners.map(p => ISO.project(x + p.x - world.camX, y + p.y - world.camY, z + h));
    // Project bottom face (for height)
    const pBot = corners.map(p => ISO.project(x + p.x - world.camX, y + p.y - world.camY, z));

    // Draw Sides (Simple lighting: Left=Dark, Right=Mid, Top=Light)
    // We only draw visible sides based on isometric view (Front-Right and Front-Left)
    
    // Left Face (p3 -> p0)
    ctx.fillStyle = adjustColor(color, -40);
    ctx.beginPath();
    ctx.moveTo(cx + pTop[3].x, cy + pTop[3].y);
    ctx.lineTo(cx + pTop[0].x, cy + pTop[0].y);
    ctx.lineTo(cx + pBot[0].x, cy + pBot[0].y);
    ctx.lineTo(cx + pBot[3].x, cy + pBot[3].y);
    ctx.fill();

    // Right Face (p0 -> p1)
    ctx.fillStyle = adjustColor(color, -20);
    ctx.beginPath();
    ctx.moveTo(cx + pTop[0].x, cy + pTop[0].y);
    ctx.lineTo(cx + pTop[1].x, cy + pTop[1].y);
    ctx.lineTo(cx + pBot[1].x, cy + pBot[1].y);
    ctx.lineTo(cx + pBot[0].x, cy + pBot[0].y);
    ctx.fill();

    // Top Face
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx + pTop[0].x, cy + pTop[0].y);
    ctx.lineTo(cx + pTop[1].x, cy + pTop[1].y);
    ctx.lineTo(cx + pTop[2].x, cy + pTop[2].y);
    ctx.lineTo(cx + pTop[3].x, cy + pTop[3].y);
    ctx.fill();
}

function adjustColor(color, amount) {
    let usePound = false;
    if (color[0] == "#") { color = color.slice(1); usePound = true; }
    let num = parseInt(color, 16);
    let r = (num >> 16) + amount;
    let b = ((num >> 8) & 0x00FF) + amount;
    let g = (num & 0x0000FF) + amount;
    if (r > 255) r = 255; else if (r < 0) r = 0;
    if (b > 255) b = 255; else if (b < 0) b = 0;
    if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16);
}

// --- GAME LOGIC ---
function triggerFeedbackGif(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    clearTimeout(gifTimeouts[id]);
    gifTimeouts[id] = setTimeout(() => el.classList.remove('show'), 1800);
}

function initGame(playerName, shirtColor) {
    // Generate World
    // Roads
    world.entities = [];
    world.plots = [];
    world.cars = [];
    
    // Player
    world.myPlayer = new Player(0, 0, playerName);
    world.myPlayer.shirtColor = shirtColor;
    world.entities.push(world.myPlayer);
    
    // Bots
    for(let i=0; i<8; i++) {
        const bot = new Player((Math.random()*20)-10, (Math.random()*20)-10, CONFIG.names[i], true);
        world.entities.push(bot);
    }
    
    // Cars
    const carColors = ['#F44336', '#2196F3', '#FFEB3B', '#000000'];
    for(let i=0; i<4; i++) {
        const c = new Car((Math.random()*30)-15, (Math.random()*30)-15, carColors[i]);
        world.entities.push(c);
        world.cars.push(c);
    }
    
    // Plots
    const plotLocs = [{x:-10, y:-10}, {x:10, y:-10}, {x:-10, y:10}, {x:10, y:10}];
    plotLocs.forEach(p => {
        const plot = new HousePlot(p.x, p.y);
        world.entities.push(plot);
        world.plots.push(plot);
    });
    
    // Assign one bot a car
    world.cars[0].driver = world.entities[1]; // First bot drives
    world.entities[1].state = 'drive';
    world.entities[1].car = world.cars[0];
    
    // UI
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    AudioMan.init();
    AudioMan.playStart();
    gameLoop();
}

function checkInteraction() {
    const p = world.myPlayer;
    const btn = document.getElementById('interaction-zone');
    const btnInner = document.getElementById('btn-interact');
    
    // Check Cars
    let nearCar = world.cars.find(c => Math.hypot(c.x - p.x, c.y - p.y) < 2);
    if (nearCar) {
        btn.classList.remove('hidden');
        if (p.state === 'drive') {
            btnInner.innerText = "LEAVE RIDE";
            btnInner.onclick = () => {
                p.state = 'idle';
                p.car.driver = null;
                p.car = null;
                p.x += 1.5; // Exit offset
                AudioMan.playExit();
                triggerFeedbackGif('gif-drive');
            };
        } else if (!nearCar.driver) {
            btnInner.innerText = "TAKE WHEEL";
            btnInner.onclick = () => {
                p.state = 'drive';
                p.car = nearCar;
                nearCar.driver = p;
                AudioMan.playDrive();
                triggerFeedbackGif('gif-drive');
            };
        }
        return;
    }
    
    // Check Plots
    let nearPlot = world.plots.find(pl => Math.hypot(pl.x - p.x, pl.y - p.y) < 3);
    if (nearPlot && !nearPlot.owner) {
        btn.classList.remove('hidden');
        btnInner.innerText = "CLAIM PLOT";
        btnInner.onclick = () => {
            nearPlot.owner = p;
            AudioMan.playClaim();
            triggerFeedbackGif('gif-claim');
            spawnChat(p, "Plot secured!");
        };
        return;
    }
    
    btn.classList.add('hidden');
}

function spawnChat(entity, text) {
    const chatBox = document.getElementById('chat-box');
    const line = document.createElement('div');
    line.innerHTML = `<span style="color:${entity.isBot ? '#ffdca8' : '#52e3ff'}">${entity.name}:</span> ${text}`;
    chatBox.appendChild(line);
    chatBox.scrollTop = chatBox.scrollHeight;
    
    // Floating text in world (simplified as just HUD log for now, can add bubble later)
}

function gameLoop() {
    requestAnimationFrame(gameLoop);
    const dt = 16.67;
    
    // Input Handling for Player
    const p = world.myPlayer;
    if (p.state === 'idle') {
        if (input.active) {
            // Joystick -> Velocity
            const angle = Math.atan2(input.y, input.x) - Math.PI/4;
            const mag = Math.min(1, Math.sqrt(input.x*input.x + input.y*input.y));
            p.vx = Math.cos(angle) * mag * gameConfig.heroSpeed;
            p.vy = Math.sin(angle) * mag * gameConfig.heroSpeed;
        } else if (!input.keys) {
            p.vx = 0; p.vy = 0;
        }
        
        // Keyboard fallback
        if (input.keys['w']) { p.vx = -gameConfig.heroSpeed; p.vy = -gameConfig.heroSpeed; }
        if (input.keys['s']) { p.vx = gameConfig.heroSpeed; p.vy = gameConfig.heroSpeed; }
    }
    
    // Update Entities
    world.entities.forEach(e => e.update(dt));
    
    // Camera
    if (p) {
        world.targetCamX = p.x;
        world.targetCamY = p.y;
    }
    world.camX += (world.targetCamX - world.camX) * 0.1;
    world.camY += (world.targetCamY - world.camY) * 0.1;
    
    checkInteraction();
    
    // Render
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    
    // Draw Ground Grid (Roads)
    drawCube(ctx, cx, cy, 0, 0, -0.22, 66, 66, 0.2, '#163651');
    drawCube(ctx, cx, cy, 0, 0, -0.1, 60, 60, 0.1, CONFIG.colors.grass);
    drawCube(ctx, cx, cy, -18, -18, 0.05, 3.2, 3.2, 6.5, '#184f7a');
    drawCube(ctx, cx, cy, 16, -20, 0.05, 3.6, 3.6, 8.5, '#1d5f91');
    drawCube(ctx, cx, cy, -20, 18, 0.05, 4.2, 4.2, 7.2, '#226fa2');
    drawCube(ctx, cx, cy, 20, 20, 0.05, 3.4, 3.4, 9, '#184f7a');
    
    // Roads
    drawCube(ctx, cx, cy, 0, 0, 0, 60, 6, 0.05, CONFIG.colors.road); // Horizontal
    drawCube(ctx, cx, cy, 0, 0, 0, 6, 60, 0.05, CONFIG.colors.road); // Vertical
    drawCube(ctx, cx, cy, 0, 0, 0.07, 60, 0.35, 0.03, CONFIG.colors.roadLine);
    drawCube(ctx, cx, cy, 0, 0, 0.07, 0.35, 60, 0.03, CONFIG.colors.roadLine);
    
    // Sort Depth
    world.entities.sort((a,b) => {
        // Simple depth sort
        const da = (a.x - a.y);
        const db = (b.x - b.y);
        // Adjust for height?
        return (a.x + a.y) - (b.x + b.y);
    });
    
    world.entities.forEach(e => e.draw(ctx, cx, cy));
}

// --- UI EVENTS ---
let selectedColor = '#00E5FF';
window.setAvatarColor = (c) => { selectedColor = c; AudioMan.playUi(); };

document.getElementById('btn-play').addEventListener('click', () => {
    const name = document.getElementById('inp-name').value.trim() || "Guest";
    initGame(name, selectedColor);
});
document.getElementById('btn-menu').addEventListener('click', () => {
    AudioMan.init();
    AudioMan.playUi();
});

// Joystick
const joy = document.getElementById('joystick-zone');
const stick = document.getElementById('stick');
joy.addEventListener('pointerdown', e => {
    input.active = true;
    input.originX = e.clientX;
    input.originY = e.clientY;
    stick.style.transition = 'none';
});
window.addEventListener('pointermove', e => {
    if (!input.active) return;
    const max = 40;
    let dx = e.clientX - input.originX;
    let dy = e.clientY - input.originY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
    input.x = dx / max;
    input.y = dy / max;
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});
const endJoy = () => {
    input.active = false; input.x = 0; input.y = 0;
    stick.style.transition = 'transform 0.2s';
    stick.style.transform = `translate(-50%, -50%)`;
};
window.addEventListener('pointerup', endJoy);
window.addEventListener('pointercancel', endJoy);

// Chat
document.getElementById('inp-chat').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const txt = e.target.value.trim();
        if (txt) {
            AudioMan.init();
            AudioMan.playChat();
            spawnChat(world.myPlayer, txt);
            e.target.value = '';
        }
    }
});

// Init
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
window.addEventListener('DOMContentLoaded', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Parse Config
    const cfgEl = document.getElementById('game-config');
    if (cfgEl) {
        try {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            Object.keys(defs).forEach(k => gameConfig[k] = defs[k].value);
            document.querySelector('h1').innerText = gameConfig.gameTitle.toUpperCase();
        } catch(e) {}
    }

    ['pointerdown', 'keydown'].forEach(evt => {
        window.addEventListener(evt, () => AudioMan.init(), { once: true });
    });
});

window.updateGameConfig = (k, v) => {
    if (gameConfig[k] !== undefined) gameConfig[k] = v;
    if (k === 'gameTitle') document.querySelector('h1').innerText = v.toUpperCase();
};
