<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Skyline Sprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #07111f;
            --bg-bottom: #102443;
            --panel: rgba(7, 14, 31, 0.8);
            --panel-border: rgba(133, 236, 255, 0.9);
            --panel-shadow: rgba(0, 0, 0, 0.45);
            --text-main: #f4fbff;
            --text-soft: #b5d8ff;
            --accent: #7ef3ff;
            --accent-strong: #00c2ff;
            --sunset: #ffae57;
            --danger: #ff5c7a;
            --boost: #ffe56c;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(28, 84, 153, 0.35), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-main);
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Keep gameplay gestures on the play surface without blocking menu taps */
            background:
                radial-gradient(circle at 20% 15%, rgba(126, 243, 255, 0.14), transparent 20%),
                radial-gradient(circle at 80% 10%, rgba(255, 174, 87, 0.14), transparent 22%);
        }
        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        #game-container::before {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(0,0,0,0.2)),
                repeating-linear-gradient(
                    90deg,
                    rgba(126, 243, 255, 0.05) 0 2px,
                    transparent 2px 68px
                );
            opacity: 0.6;
        }
        #game-container::after {
            background:
                radial-gradient(circle at center, transparent 55%, rgba(2, 8, 22, 0.38) 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
            padding: 16px;
            box-sizing: border-box;
        }
        .screen {
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(14, 26, 49, 0.88), rgba(7, 14, 31, 0.92));
            padding: 18px 18px 20px;
            border-radius: 18px;
            color: var(--text-main);
            width: min(100%, 340px);
            max-width: 80%;
            border: 2px solid var(--panel-border);
            box-shadow:
                0 14px 40px var(--panel-shadow),
                0 0 24px rgba(126, 243, 255, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.12);
            backdrop-filter: blur(6px);
        }
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling only */
        /* [agent-note][stage4] repaired: mobile-action-path | element: start/restart buttons | action: native taps kept separate from gameplay touch suppression */
        /* [agent-note][stage4] remap-font: title/hud/buttons -> Orbitron, ui/body -> Exo 2 via catalogs/fonts.json */
        h1 {
            margin: 0 0 10px 0;
            font-size: clamp(1.7rem, 5vw, 2.2rem);
            font-family: 'Orbitron', Impact, sans-serif;
            color: var(--boost);
            text-shadow: 0 0 12px rgba(255, 229, 108, 0.4), 0 2px 0 rgba(0,0,0,0.65);
            letter-spacing: 1.6px;
            line-height: 1.05;
        }
        p {
            margin: 10px 0;
            font-size: clamp(1rem, 4vw, 1.08rem);
            color: var(--text-soft);
            line-height: 1.4;
            font-family: 'Exo 2', Arial, sans-serif;
            font-weight: 600;
        }
        button {
            background: linear-gradient(180deg, var(--sunset), #ff7c4d);
            color: #09111f;
            border: none;
            padding: 14px 22px;
            font-size: clamp(1rem, 4vw, 1.05rem);
            font-family: 'Orbitron', Impact, sans-serif;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow:
                0 5px 0 #c95e37,
                0 10px 20px rgba(0,0,0,0.24),
                0 0 20px rgba(255, 174, 87, 0.25);
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
        }
        button:active {
            transform: translateY(4px);
            box-shadow:
                0 1px 0 #c95e37,
                0 5px 10px rgba(0,0,0,0.2),
                0 0 12px rgba(255, 174, 87, 0.18);
            filter: brightness(1.02);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: clamp(1.5rem, 7vw, 2.4rem);
            font-weight: 700;
            font-family: 'Exo 2', Arial, sans-serif;
            color: var(--text-main);
            text-shadow: 0 0 14px rgba(126, 243, 255, 0.45), 0 2px 0 rgba(0,0,0,0.9);
            display: none;
            z-index: 10;
            letter-spacing: 2px;
        }
        #mute-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: linear-gradient(180deg, rgba(12, 25, 46, 0.85), rgba(6, 15, 30, 0.95));
            border: 2px solid rgba(126, 243, 255, 0.78);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 0 18px rgba(126, 243, 255, 0.16);
        }
        #feedback-overlay {
            position: absolute;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: min(82vw, 260px);
            max-width: min(86vw, 320px);
            padding: 10px 14px;
            border-radius: 18px;
            background: rgba(4, 12, 24, 0.78);
            border: 1px solid rgba(126, 243, 255, 0.42);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
        }
        #feedback-overlay.active {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }
        #feedback-overlay.fail {
            border-color: rgba(255, 92, 122, 0.65);
        }
        #feedback-overlay img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 12px;
            flex: 0 0 auto;
            background: rgba(255,255,255,0.06);
        }
        #feedback-text {
            font-family: 'Orbitron', Impact, sans-serif;
            font-size: clamp(0.78rem, 2.8vw, 0.98rem);
            line-height: 1.15;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .hidden { display: none !important; }
        @media (max-width: 480px) {
            .screen {
                padding: 16px 14px 18px;
                border-radius: 16px;
                width: min(100%, 300px);
            }
            #hud {
                top: 16px;
            }
            #feedback-overlay {
                bottom: 74px;
                min-width: min(88vw, 240px);
                gap: 8px;
                padding: 8px 10px;
            }
            #feedback-overlay img {
                width: 54px;
                height: 54px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">0</div>
    
    <div id="mute-btn">🔊</div>

    <!-- [agent-note][stage3] resolved-gif: pickup/fail feedback overlay -> catalogs/gifs.json -->
    <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
    <div id="feedback-overlay" aria-hidden="true">
        <img id="feedback-gif" alt="Run feedback animation">
        <div id="feedback-text"></div>
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <h1>SKYLINE SPRINT</h1>
            <p>Guide the courier through tight city gaps.</p>
            <p>Tap or press Space to boost and grab bonus coins.</p>
            <button id="start-btn">START RUN</button>
        </div>
        
        <div id="game-over-screen" class="screen hidden">
            <h1>RUN OVER</h1>
            <p>Delivery Score: <span id="final-score">0</span></p>
            <button id="restart-btn">RUN AGAIN</button>
        </div>
    </div>
</div>

<script>
/**
 * 1. ASSET CONFIGURATION & MANAGEMENT
 */
const ASSETS_CONFIG = {
    player: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png",
    obstacle: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png",
    collectible: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png",
    bg: "https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png"
};

const MEDIA_CONFIG = {
    audio: {
        flap: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
        pass: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
        collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
        crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
        start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
        click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
        loop: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3"
    },
    gifs: {
        collect: "https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp",
        fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
    }
};

const images = {};
let assetsLoaded = 0;
const totalAssets = Object.keys(ASSETS_CONFIG).length;

function preloadAssets(callback) {
    for (const [key, url] of Object.entries(ASSETS_CONFIG)) {
        const img = new Image();
        img.src = url;
        img.onload = () => {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) callback();
        };
        img.onerror = () => {
            console.warn(`Failed to load ${key}, using fallback.`);
            assetsLoaded++;
            if (assetsLoaded === totalAssets) callback();
        };
        images[key] = img;
    }
}

/**
 * 2. AUDIO MANAGER
 * Catalog-backed one-shots + a gameplay loop, all gesture-safe and failure tolerant.
 */
const AudioManager = {
    isMuted: false,
    initialized: false,
    loopTrack: null,
    sfx: {},
    
    init() {
        if (this.initialized) {
            this.resumeLoop();
            return;
        }

        this.initialized = true;
        const createAudio = (src, volume, loop = false) => {
            const audio = new Audio(src);
            audio.preload = 'auto';
            audio.volume = volume;
            audio.loop = loop;
            audio.playsInline = true;
            return audio;
        };

        this.sfx = {
            flap: createAudio(MEDIA_CONFIG.audio.flap, 0.26),
            pass: createAudio(MEDIA_CONFIG.audio.pass, 0.24),
            collect: createAudio(MEDIA_CONFIG.audio.collect, 0.26),
            crash: createAudio(MEDIA_CONFIG.audio.crash, 0.34),
            start: createAudio(MEDIA_CONFIG.audio.start, 0.3),
            click: createAudio(MEDIA_CONFIG.audio.click, 0.22)
        };

        this.loopTrack = createAudio(MEDIA_CONFIG.audio.loop, 0.18, true);
        this.resumeLoop();
    },

    playSfx(name) {
        if (this.isMuted || !this.initialized) return;
        const source = this.sfx[name];
        if (!source) return;

        try {
            const clone = source.cloneNode();
            clone.volume = source.volume;
            clone.playsInline = true;
            const playPromise = clone.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (err) {
            // Audio failure must not affect controls or loop.
        }
    },

    resumeLoop() {
        if (this.isMuted || !this.loopTrack) return;
        const playPromise = this.loopTrack.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    },

    pauseLoop() {
        if (this.loopTrack) {
            this.loopTrack.pause();
        }
    },

    toggleMute() {
        this.isMuted = !this.isMuted;
        const btn = document.getElementById('mute-btn');
        btn.textContent = this.isMuted ? '🔇' : '🔊';

        if (this.loopTrack) {
            this.loopTrack.muted = this.isMuted;
        }

        if (this.isMuted) this.pauseLoop();
        else this.resumeLoop();
    }
};

/**
 * 3. GIF FEEDBACK
 */
const feedbackOverlay = document.getElementById('feedback-overlay');
const feedbackGif = document.getElementById('feedback-gif');
const feedbackText = document.getElementById('feedback-text');
let feedbackTimer = null;

function showFeedback(type, text) {
    const src = MEDIA_CONFIG.gifs[type];
    if (!src) return;

    feedbackGif.src = src;
    feedbackText.textContent = text;
    feedbackOverlay.classList.toggle('fail', type === 'fail');
    feedbackOverlay.classList.add('active');

    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        feedbackOverlay.classList.remove('active', 'fail');
    }, type === 'fail' ? 1700 : 1100);
}

/**
 * 4. GAME LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let gameState = 'START'; // START, PLAYING, GAMEOVER
let frames = 0;
let score = 0;
let speed = 3;
let startGraceFrames = 0;

// Physics Constants
const GRAVITY = 0.25;
const FLAP_STRENGTH = -5.5;

// Entities
const player = {
    x: 50,
    y: 150,
    width: 40,
    height: 40,
    velocity: 0,
    rotation: 0,
    
    reset() {
        this.x = canvas.width * 0.2;
        this.y = canvas.height / 2;
        this.velocity = 0;
        this.rotation = 0;
    },
    
    flap() {
        this.velocity = FLAP_STRENGTH;
        AudioManager.playSfx('flap');
    },
    
    update() {
        this.velocity += GRAVITY;
        this.y += this.velocity;
        
        if (this.velocity < 0) this.rotation = -25 * Math.PI / 180;
        else if (this.velocity > 0) {
            this.rotation += 2 * Math.PI / 180;
            if (this.rotation > 90 * Math.PI / 180) this.rotation = 90 * Math.PI / 180;
        }

        if (this.y + this.height >= canvas.height) {
            this.y = canvas.height - this.height;
            if (startGraceFrames <= 0) {
                gameOver();
            } else {
                this.velocity = Math.min(this.velocity, 0);
            }
        }
        if (this.y < 0) {
            this.y = 0;
            this.velocity = 0;
        }
    },
    
    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.rotation);
        
        if (images.player && images.player.complete && images.player.naturalWidth !== 0) {
            ctx.shadowColor = 'rgba(126, 243, 255, 0.55)';
            ctx.shadowBlur = 16;
            ctx.drawImage(images.player, -this.width/2, -this.height/2, this.width, this.height);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(126, 243, 255, 0.18)';
            ctx.beginPath();
            ctx.ellipse(-this.width * 0.12, 0, this.width * 0.42, this.height * 0.26, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const bodyGrad = ctx.createLinearGradient(-this.width/2, -this.height/2, this.width/2, this.height/2);
            bodyGrad.addColorStop(0, '#ffe56c');
            bodyGrad.addColorStop(1, '#ff8f5a');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, 12);
            ctx.fill();
            ctx.fillStyle = '#0b1730';
            ctx.beginPath();
            ctx.arc(this.width * 0.1, -this.height * 0.1, this.width * 0.11, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(126, 243, 255, 0.85)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillRect(-this.width * 0.34, -this.height * 0.08, this.width * 0.16, this.height * 0.1);
        }
        ctx.restore();
    }
};

const obstacles = {
    list: [],
    spawnTimer: 0,
    gap: 160,
    width: 60,
    
    reset() {
        this.list = [];
        this.spawnTimer = 0;
    },
    
    update() {
        if (frames % 120 === 0) {
            const minHeight = 50;
            const maxHeight = canvas.height - this.gap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
            
            this.list.push({
                x: canvas.width,
                y: 0,
                width: this.width,
                height: topHeight,
                passed: false,
                type: 'top'
            });
            
            this.list.push({
                x: canvas.width,
                y: topHeight + this.gap,
                width: this.width,
                height: canvas.height - topHeight - this.gap,
                type: 'bottom'
            });
            
            if (Math.random() > 0.5) {
                collectibles.spawn(canvas.width + this.width/2, topHeight + this.gap/2);
            }
        }
        
        for (let i = 0; i < this.list.length; i++) {
            let p = this.list[i];
            p.x -= speed;
            
            if (
                player.x < p.x + p.width &&
                player.x + player.width > p.x &&
                player.y < p.y + p.height &&
                player.y + player.height > p.y
            ) {
                gameOver();
            }
            
            if (p.type === 'top' && !p.passed && player.x > p.x + p.width) {
                p.passed = true;
                score++;
                speed += 0.05;
                updateScore();
                AudioManager.playSfx('pass');
            }
        }
        
        if (this.list.length > 0 && this.list[0].x < -this.width) {
            this.list.shift();
        }
    },
    
    draw() {
        for (let p of this.list) {
            if (images.obstacle && images.obstacle.complete && images.obstacle.naturalWidth !== 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(255, 92, 122, 0.35)';
                ctx.shadowBlur = 10;
                ctx.drawImage(images.obstacle, p.x, p.y, p.width, p.height);
                ctx.restore();
            } else {
                const pipeGrad = ctx.createLinearGradient(p.x, p.y, p.x + p.width, p.y);
                pipeGrad.addColorStop(0, '#371847');
                pipeGrad.addColorStop(0.5, '#5a2d73');
                pipeGrad.addColorStop(1, '#120818');
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = 'rgba(255, 92, 122, 0.18)';
                ctx.fillRect(p.x + 6, p.y, 8, p.height);
                ctx.strokeStyle = '#ff5c7a';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            }
        }
    }
};

const collectibles = {
    list: [],
    
    spawn(x, y) {
        this.list.push({ x: x, y: y, size: 30, collected: false });
    },
    
    reset() {
        this.list = [];
    },
    
    update() {
        for (let i = 0; i < this.list.length; i++) {
            let c = this.list[i];
            c.x -= speed;
            
            const dx = (player.x + player.width/2) - c.x;
            const dy = (player.y + player.height/2) - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < c.size + player.width/2) {
                c.collected = true;
                score += 5;
                updateScore();
                AudioManager.playSfx('collect');
                showFeedback('collect', '+5 bonus');
            }
        }
        this.list = this.list.filter(c => !c.collected && c.x > -50);
    },
    
    draw() {
        for (let c of this.list) {
            if (images.collectible && images.collectible.complete && images.collectible.naturalWidth !== 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(255, 229, 108, 0.55)';
                ctx.shadowBlur = 14;
                ctx.drawImage(images.collectible, c.x - c.size/2, c.y - c.size/2, c.size, c.size);
                ctx.restore();
            } else {
                const coinGrad = ctx.createRadialGradient(c.x - 4, c.y - 4, 2, c.x, c.y, c.size/2);
                coinGrad.addColorStop(0, '#fff4a8');
                coinGrad.addColorStop(0.65, '#ffe56c');
                coinGrad.addColorStop(1, '#ff9b54');
                ctx.fillStyle = coinGrad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size/2, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }
};

let bgX = 0;
function drawBackground() {
    if (images.bg && images.bg.complete && images.bg.naturalWidth !== 0) {
        ctx.drawImage(images.bg, bgX, 0, canvas.width, canvas.height);
        ctx.drawImage(images.bg, bgX + canvas.width, 0, canvas.width, canvas.height);
        
        if (gameState === 'PLAYING') {
            bgX -= speed * 0.2;
            if (bgX <= -canvas.width) bgX = 0;
        }
    } else {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#16365f');
        grad.addColorStop(0.55, '#102443');
        grad.addColorStop(1, '#07111f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(126, 243, 255, 0.08)';
        for (let i = 0; i < 7; i++) {
            const width = canvas.width * 0.08;
            const x = (i * canvas.width) / 6.5 - bgX * 0.15;
            const height = canvas.height * (0.28 + (i % 3) * 0.12);
            ctx.fillRect(x % (canvas.width + width) - width, canvas.height - height, width, height);
        }

        ctx.fillStyle = 'rgba(255, 174, 87, 0.13)';
        ctx.fillRect(0, canvas.height * 0.84, canvas.width, canvas.height * 0.16);
    }
}

/**
 * 5. GAME LOOP & CONTROL
 */
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    player.reset();
}

function startGame() {
    AudioManager.init();
    AudioManager.playSfx('start');
    gameState = 'PLAYING';
    score = 0;
    speed = 3;
    frames = 0;
    bgX = 0;
    startGraceFrames = 45;
    
    player.reset();
    player.velocity = FLAP_STRENGTH;
    obstacles.reset();
    collectibles.reset();
    
    updateScore();
    feedbackOverlay.classList.remove('active', 'fail');
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').style.display = 'block';
    
    loop();
}

function gameOver() {
    if (gameState === 'GAMEOVER') return;
    gameState = 'GAMEOVER';
    AudioManager.playSfx('crash');
    AudioManager.pauseLoop();
    showFeedback('fail', 'traffic wipeout');
    
    document.getElementById('hud').style.display = 'none';
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
}

function updateScore() {
    document.getElementById('hud').innerText = score;
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    
    if (gameState === 'PLAYING') {
        frames++;
        if (startGraceFrames > 0) startGraceFrames--;
        player.update();
        obstacles.update();
        collectibles.update();
    }
    
    obstacles.draw();
    collectibles.draw();
    player.draw();
    
    if (gameState === 'PLAYING') {
        requestAnimationFrame(loop);
    }
}

function handleInput(e) {
    if (e.type === 'touchstart') e.preventDefault();
    
    if (gameState === 'PLAYING') {
        player.flap();
    }
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', handleInput, { passive: false });
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleInput(e);
});

document.getElementById('start-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    AudioManager.init();
    AudioManager.playSfx('click');
    startGame();
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    AudioManager.init();
    AudioManager.playSfx('click');
    startGame();
});

document.getElementById('mute-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    AudioManager.toggleMute();
});

window.addEventListener('blur', () => {
    AudioManager.pauseLoop();
});

window.addEventListener('focus', () => {
    if (gameState === 'PLAYING' && !AudioManager.isMuted) {
        AudioManager.resumeLoop();
    }
});

resize();
preloadAssets(() => {
    drawBackground();
    player.draw();
});
</script>
</body>
</html>
