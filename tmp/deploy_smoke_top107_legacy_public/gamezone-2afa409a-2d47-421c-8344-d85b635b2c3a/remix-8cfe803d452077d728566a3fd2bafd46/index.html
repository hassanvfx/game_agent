<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Star Survivor: Orbital Sweep</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Rajdhani from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #7af5ff;
            --bg-main: #07111f;
            --bg-grid: #11233f;
            --glass-bg: rgba(10, 28, 52, 0.62);
            --glass-border: rgba(122, 245, 255, 0.3);
            --panel-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
            --danger: #ff5d8f;
            --success: #ffe66d;
            --sky-glow: #7af5ff;
            --pilot-trim: #8b5cf6;
            --panel-fill: rgba(13, 24, 44, 0.88);
            --text-main: #f4fbff;
            --text-soft: #b8d9ff;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(122, 245, 255, 0.16), transparent 36%),
                linear-gradient(180deg, #091120 0%, #050b15 100%);
            background-color: var(--bg-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 16%, rgba(122, 245, 255, 0.22), transparent 18%),
                radial-gradient(circle at 80% 22%, rgba(139, 92, 246, 0.16), transparent 20%),
                radial-gradient(circle at 50% 78%, rgba(255, 93, 143, 0.12), transparent 24%);
            opacity: 0.95;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .hidden { display: none !important; }

        .glass {
            background:
                linear-gradient(180deg, rgba(20, 41, 70, 0.94), rgba(9, 18, 34, 0.9));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--panel-shadow);
        }

        .neon-text {
            text-shadow: 0 0 12px rgba(122, 245, 255, 0.65), 0 0 28px rgba(122, 245, 255, 0.3);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center, transparent 42%, rgba(2, 8, 18, 0.3) 100%),
                linear-gradient(180deg, rgba(122, 245, 255, 0.04), rgba(255, 255, 255, 0));
            z-index: 1;
        }

        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.2;
            background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 100% 4px;
            mix-blend-mode: soft-light;
            z-index: 2;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
            color: white;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            background:
                linear-gradient(180deg, rgba(15, 32, 54, 0.92), rgba(7, 16, 29, 0.84));
            border: 1px solid rgba(122, 245, 255, 0.28);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 18px rgba(122, 245, 255, 0.12);
        }

        .hud-icon-diamond {
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #fff5a6, var(--success));
            transform: rotate(45deg);
            border-radius: 2px;
            flex: 0 0 auto;
            box-shadow: 0 0 12px rgba(255, 230, 109, 0.72);
        }

        .hud-icon-core {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 35% 35%, #ffd0dc, var(--danger));
            border-radius: 999px;
            flex: 0 0 auto;
            box-shadow: 0 0 12px rgba(255, 93, 143, 0.7);
        }

        .panel {
            width: min(92vw, 420px);
            padding: 32px 28px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            background:
                radial-gradient(circle at top, rgba(122, 245, 255, 0.12), transparent 35%),
                linear-gradient(180deg, rgba(16, 33, 58, 0.96), rgba(7, 15, 28, 0.94));
            border: 1px solid rgba(122, 245, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.08), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.18), transparent 24%);
        }

        .panel > * {
            position: relative;
            z-index: 1;
        }

        #start-screen {
            transition: transform 0.3s ease;
        }

        #start-screen:hover {
            transform: scale(1.03);
        }

        .title {
            margin: 0 0 8px;
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.4rem, 9vw, 4rem);
            font-weight: 700;
            line-height: 0.92;
            letter-spacing: 0.02em;
        }

        .title-accent {
            color: var(--danger);
            display: inline-block;
            text-shadow: 0 0 16px rgba(255, 93, 143, 0.4);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-soft);
            border: 1px solid rgba(122, 245, 255, 0.24);
            background: rgba(8, 19, 37, 0.72);
        }

        .pilot-emoji {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px rgba(122, 245, 255, 0.45));
        }

        .subtitle {
            margin: 0 0 10px;
            color: #b6f3ff;
            font-size: clamp(1rem, 4vw, 1.32rem);
            animation: float 3s ease-in-out infinite;
            font-weight: 600;
        }

        .instruction-copy {
            margin: 0 0 24px;
            color: rgba(255, 255, 255, 0.84);
            font-size: 1rem;
            line-height: 1.35;
        }

        #feedback-gifs {
            position: absolute;
            right: 14px;
            bottom: 18px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            width: min(28vw, 120px);
            pointer-events: none;
        }

        .feedback-gif {
            width: 100%;
            max-width: 110px;
            border-radius: 16px;
            border: 1px solid rgba(122, 245, 255, 0.35);
            background: rgba(4, 12, 24, 0.7);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .feedback-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .action-btn {
            border: 0;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
            transform: translateZ(0);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent 46%);
            pointer-events: none;
        }

        .action-btn:hover { filter: brightness(1.08); }
        .action-btn:active {
            transform: scale(0.96);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        #start-btn {
            padding: 18px 34px;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            background: linear-gradient(90deg, #06b6d4, #2563eb);
        }

        #restart-btn {
            padding: 14px 28px;
            font-size: 1.15rem;
            background: linear-gradient(90deg, #ec4899, #dc2626);
        }

        .gameover-title {
            margin: 0 0 10px;
            color: var(--danger);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2rem, 7vw, 3.1rem);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .results-copy {
            margin: 0 0 24px;
            font-size: 1.2rem;
            color: white;
        }

        .results-value {
            color: var(--success);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 230, 109, 0.28);
        }

        @media (max-width: 640px) {
            #hud {
                top: 12px;
                left: 12px;
                gap: 8px;
            }

            .hud-pill {
                padding: 8px 12px;
                font-size: 0.9rem;
            }

            .panel {
                padding: 24px 20px;
                width: min(94vw, 360px);
            }

            #feedback-gifs {
                right: 10px;
                bottom: 14px;
                width: min(24vw, 88px);
            }

            .feedback-gif {
                max-width: 84px;
                border-radius: 12px;
            }

            .results-copy {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<script>
/**
 * STAR SURVIVOR ENGINE
 *
 * Core Philosophy:
 * - High Energy: Fast movement, snappy shooting.
 * - Juice: Screen shake, particles, flash effects.
 * - Input: One-thumb mobile optimized.
 */

// --- Global Config & State ---
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 3, "max": 12 },
    "fireRate": { "type": "number", "label": "Fire Rate (ms)", "value": 300, "min": 100, "max": 1000 },
    "enemySpawnRate": { "type": "number", "label": "Spawn Rate (frames)", "value": 60, "min": 20, "max": 120 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#00fff5" }
};
window.gameConfig = {
    heroSpeed: 6,
    fireRate: 300,
    enemySpawnRate: 60,
    themeColor: "#00fff5"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--theme-color', val);
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.isMuted = false;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.initialized = true;

        // Unlock audio context on interaction
        const unlock = () => {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);

        this.loadAssets();
    }

    async loadAssets() {
        this.buffers = {};
    }

    playBgm() {
        if (!this.initialized) this.init();
        const bgm = document.getElementById('bgm_battle');
        if (bgm) {
            bgm.volume = 0.2;
            bgm.play().catch(e => console.log("Autoplay blocked", e));
        }
    }

    stopBgm() {
        const bgm = document.getElementById('bgm_battle');
        if (bgm) {
            bgm.pause();
            bgm.currentTime = 0;
        }
    }

    playSfx(id, fallbackType = 'beep') {
        if (!this.initialized || this.isMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const mediaEl = document.getElementById(id);
        if (mediaEl && mediaEl.src) {
            const shot = mediaEl.cloneNode();
            shot.volume = 0.5;
            shot.play().catch(() => this.synthesize(fallbackType));
            return;
        }

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            source.buffer = this.buffers[id];
            source.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(fallbackType);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }
    }
}

// --- Game Engine ---
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();
        this.hitGifEl = document.getElementById('hit-gif');
        this.failGifEl = document.getElementById('fail-gif');
        this.gifTimers = new Map();
        this.lowHealthCueActive = false;

        this.state = 'MENU'; // MENU, PLAYING, GAMEOVER
        this.width = 0;
        this.height = 0;

        // Game Entities
        this.hero = { x: 0, y: 0, r: 20, angle: 0, hp: 100, lastShot: 0 };
        this.enemies = [];
        this.bullets = [];
        this.gems = [];
        this.particles = [];
        this.texts = [];

        // Input
        this.pointer = { x: 0, y: 0, active: false };

        // Systems
        this.camera = { x: 0, y: 0, shake: 0 };
        this.score = 0;
        this.frameCount = 0;

        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindInput();

        // UI Bindings
        document.getElementById('start-btn').addEventListener('click', () => this.start());
        document.getElementById('restart-btn').addEventListener('click', () => this.start());

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (this.state === 'MENU') {
            this.hero.x = this.width / 2;
            this.hero.y = this.height / 2;
        }
    }

    bindInput() {
        const onDown = (e) => {
            this.pointer.active = true;
            this.pointer.x = e.clientX;
            this.pointer.y = e.clientY;
            if (this.state === 'MENU' && !e.target.closest('button')) {
                // Optional: Click to start
            }
        };
        const onMove = (e) => {
            if (this.pointer.active) {
                this.pointer.x = e.clientX;
                this.pointer.y = e.clientY;
            }
        };
        const onUp = () => {
            this.pointer.active = false;
        };

        this.canvas.addEventListener('pointerdown', onDown, { passive: false });
        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
    }

    start() {
        this.state = 'PLAYING';
        this.score = 0;
        this.hero.hp = 100;
        this.hero.x = this.width / 2;
        this.hero.y = this.height / 2;
        this.enemies = [];
        this.bullets = [];
        this.gems = [];
        this.particles = [];
        this.texts = [];
        this.frameCount = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.lowHealthCueActive = false;
        this.updateHUD();

        this.audio.playSfx('sfx_start', 'shoot', 120);
        this.audio.playBgm();
    }

    gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').innerText = this.score;
        this.showGif('fail', 1400);
        this.audio.stopBgm();
        this.audio.playSfx('sfx_die', 'explosion', 120);
    }

    updateHUD() {
        document.getElementById('score').innerText = this.score;
        document.getElementById('health').innerText = Math.ceil(this.hero.hp);
    }

    spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        const pad = 50;
        if (side === 0) { x = Math.random() * this.width; y = -pad; } // Top
        else if (side === 1) { x = this.width + pad; y = Math.random() * this.height; } // Right
        else if (side === 2) { x = Math.random() * this.width; y = this.height + pad; } // Bottom
        else { x = -pad; y = Math.random() * this.height; } // Left

        // Enemy Types
        const type = Math.random() > 0.8 ? 'TANK' : 'RUNNER';
        const r = type === 'TANK' ? 25 : 15;
        const hp = type === 'TANK' ? 50 : 10;
        const speed = type === 'TANK' ? 1.5 : 3;
        const color = type === 'TANK' ? '#ff2e63' : '#ff9999';

        this.enemies.push({ x, y, r, hp, maxHp: hp, speed, type, color, vx: 0, vy: 0 });
    }

    createExplosion(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    createFloatingText(x, y, text, color) {
        this.texts.push({ x, y, text, color, life: 1.0, vy: -1 });
    }

    showGif(type, duration = 900) {
        const el = type === 'hit' ? this.hitGifEl : this.failGifEl;
        if (!el) return;
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('active'));
        clearTimeout(this.gifTimers.get(type));
        const timer = setTimeout(() => {
            el.classList.remove('active');
            setTimeout(() => el.classList.add('hidden'), 180);
        }, duration);
        this.gifTimers.set(type, timer);
    }

    update(dt) {
        if (this.state !== 'PLAYING') return;
        this.frameCount++;

        // --- Hero Movement ---
        if (this.pointer.active) {
            const dx = this.pointer.x - this.hero.x;
            const dy = this.pointer.y - this.hero.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 5) {
                const speed = window.gameConfig.heroSpeed;
                const moveDist = Math.min(dist, speed); // No overshoot
                const angle = Math.atan2(dy, dx);
                this.hero.x += Math.cos(angle) * moveDist;
                this.hero.y += Math.sin(angle) * moveDist;

                // Dust particles
                if (this.frameCount % 5 === 0) {
                    this.particles.push({
                        x: this.hero.x, y: this.hero.y + 10,
                        vx: (Math.random() - 0.5), vy: (Math.random() - 0.5),
                        life: 0.5, color: '#ffffff55', size: 3
                    });
                }
            }
        }

        // Clamp Hero
        this.hero.x = Math.max(this.hero.r, Math.min(this.width - this.hero.r, this.hero.x));
        this.hero.y = Math.max(this.hero.r, Math.min(this.height - this.hero.r, this.hero.y));

        // --- Auto Aim & Shoot ---
        let nearest = null;
        let minDst = 400; // Range

        for (const e of this.enemies) {
            const d = Math.hypot(e.x - this.hero.x, e.y - this.hero.y);
            if (d < minDst) {
                minDst = d;
                nearest = e;
            }
        }

        if (nearest) {
            this.hero.angle = Math.atan2(nearest.y - this.hero.y, nearest.x - this.hero.x);
            const now = Date.now();
            if (now - this.hero.lastShot > window.gameConfig.fireRate) {
                this.hero.lastShot = now;
                // Shoot
                const bx = this.hero.x + Math.cos(this.hero.angle) * 30;
                const by = this.hero.y + Math.sin(this.hero.angle) * 30;
                this.bullets.push({
                    x: bx, y: by,
                    vx: Math.cos(this.hero.angle) * 12,
                    vy: Math.sin(this.hero.angle) * 12,
                    life: 60
                });
                this.camera.shake = 3;
                this.audio.playSfx('sfx_shoot', 'shoot', 70);
            }
        } else if (this.pointer.active) {
            // Face movement direction if no enemies
             const dx = this.pointer.x - this.hero.x;
             const dy = this.pointer.y - this.hero.y;
             if (Math.hypot(dx, dy) > 10) this.hero.angle = Math.atan2(dy, dx);
        }

        // --- Enemies ---
        if (this.frameCount % window.gameConfig.enemySpawnRate === 0) {
            this.spawnEnemy();
        }

        this.enemies.forEach(e => {
            const dx = this.hero.x - e.x;
            const dy = this.hero.y - e.y;
            const angle = Math.atan2(dy, dx);
            e.vx = Math.cos(angle) * e.speed;
            e.vy = Math.sin(angle) * e.speed;

            // Separation (boids-lite)
            this.enemies.forEach(other => {
                if (e === other) return;
                const d = Math.hypot(e.x - other.x, e.y - other.y);
                if (d < e.r + other.r) {
                    const pushAngle = Math.atan2(e.y - other.y, e.x - other.x);
                    e.vx += Math.cos(pushAngle) * 0.5;
                    e.vy += Math.sin(pushAngle) * 0.5;
                }
            });

            e.x += e.vx;
            e.y += e.vy;

            // Collision with Hero
            const dist = Math.hypot(dx, dy);
            if (dist < e.r + this.hero.r) {
                this.hero.hp -= 0.5;
                this.camera.shake = 5;
                this.audio.playSfx('sfx_damage', 'explosion', 220);
                this.showGif('fail', 700);
                this.updateHUD();
                if (this.hero.hp <= 0) this.gameOver();
            }
        });

        // --- Bullets ---
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            // Collision
            let hit = false;
            for (let j = this.enemies.length - 1; j >= 0; j--) {
                const e = this.enemies[j];
                if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 10) {
                    e.hp -= 10;
                    hit = true;
                    this.createExplosion(b.x, b.y, '#ffff00', 3);
                    this.createFloatingText(e.x, e.y - 20, "10", "#fff");
                    this.audio.playSfx('sfx_hit', 'explosion', 90);
                    this.showGif('hit', 520);

                    if (e.hp <= 0) {
                        this.enemies.splice(j, 1);
                        this.createExplosion(e.x, e.y, e.color, 15);
                        // Drop Star Shard
                        this.gems.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4});
                    }
                    break;
                }
            }

            if (hit || b.life <= 0) this.bullets.splice(i, 1);
        }

        // --- Star Shards ---
        for (let i = this.gems.length - 1; i >= 0; i--) {
            const g = this.gems[i];
            // Magnet
            const dx = this.hero.x - g.x;
            const dy = this.hero.y - g.y;
            const dist = Math.hypot(dx, dy);

            // Friction
            g.vx *= 0.9;
            g.vy *= 0.9;
            g.x += g.vx;
            g.y += g.vy;

            if (dist < 150) {
                g.x += (dx / dist) * 8;
                g.y += (dy / dist) * 8;
            }

            if (dist < this.hero.r + 10) {
                this.score++;
                this.updateHUD();
                this.audio.playSfx('sfx_collect', 'shoot', 80);
                this.showGif('hit', 620);
                this.createFloatingText(this.hero.x, this.hero.y - 30, "+1", "#00ff00");
                this.gems.splice(i, 1);
            }
        }

        // --- Particles ---
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // --- Floating Texts ---
        for (let i = this.texts.length - 1; i >= 0; i--) {
            const t = this.texts[i];
            t.y += t.vy;
            t.life -= 0.02;
            if (t.life <= 0) this.texts.splice(i, 1);
        }

        if (this.hero.hp <= 35 && !this.lowHealthCueActive) {
            this.lowHealthCueActive = true;
            this.audio.playSfx('sfx_damage', 'explosion', 400);
            this.showGif('fail', 900);
        } else if (this.hero.hp > 35) {
            this.lowHealthCueActive = false;
        }

        // --- Camera Shake Decay ---
        if (this.camera.shake > 0) this.camera.shake *= 0.9;
        if (this.camera.shake < 0.5) this.camera.shake = 0;
    }

    draw() {
        // Clear
        const skyGradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGradient.addColorStop(0, '#07111f');
        skyGradient.addColorStop(0.55, '#091a30');
        skyGradient.addColorStop(1, '#040811');
        this.ctx.fillStyle = skyGradient;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const nebulaGradient = this.ctx.createRadialGradient(this.width * 0.5, this.height * 0.3, 10, this.width * 0.5, this.height * 0.3, this.width * 0.6);
        nebulaGradient.addColorStop(0, 'rgba(122, 245, 255, 0.13)');
        nebulaGradient.addColorStop(0.45, 'rgba(139, 92, 246, 0.08)');
        nebulaGradient.addColorStop(1, 'rgba(4, 8, 17, 0)');
        this.ctx.fillStyle = nebulaGradient;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Grid
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(40, 92, 150, 0.42)';
        this.ctx.lineWidth = 1.5;
        const gridSize = 50;

        this.ctx.translate(Math.random() * this.camera.shake, Math.random() * this.camera.shake);

        for (let x = 0; x < this.width; x += gridSize) {
            this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.height); this.ctx.stroke();
        }
        for (let y = 0; y < this.height; y += gridSize) {
            this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y); this.ctx.stroke();
        }

        for (let i = 0; i < 42; i++) {
            const sx = (i * 137) % this.width;
            const sy = (i * 89 + this.frameCount * 0.15) % this.height;
            const size = (i % 3) + 1;
            this.ctx.fillStyle = i % 5 === 0 ? 'rgba(255,255,255,0.9)' : 'rgba(122, 245, 255, 0.6)';
            this.ctx.fillRect(sx, sy, size, size);
        }

        // Draw Star Shards
        this.gems.forEach(g => {
            this.ctx.save();
            this.ctx.translate(g.x, g.y);
            this.ctx.rotate(this.frameCount * 0.03);
            this.ctx.shadowBlur = 14;
            this.ctx.shadowColor = '#ffe66d';
            this.ctx.fillStyle = '#ffe66d';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -10);
            this.ctx.lineTo(4, -4);
            this.ctx.lineTo(10, 0);
            this.ctx.lineTo(4, 4);
            this.ctx.lineTo(0, 10);
            this.ctx.lineTo(-4, 4);
            this.ctx.lineTo(-10, 0);
            this.ctx.lineTo(-4, -4);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.restore();
        });

        // Draw Enemies
        this.enemies.forEach(e => {
            this.ctx.save();
            this.ctx.translate(e.x, e.y);

            // Shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
            this.ctx.beginPath();
            this.ctx.ellipse(0, e.r/2, e.r, e.r/2, 0, 0, Math.PI*2);
            this.ctx.fill();

            // Body
            const enemyGradient = this.ctx.createRadialGradient(-e.r * 0.35, -e.r * 0.35, 2, 0, 0, e.r * 1.3);
            enemyGradient.addColorStop(0, e.type === 'TANK' ? '#ffb0c5' : '#ffd7de');
            enemyGradient.addColorStop(1, e.color);
            this.ctx.fillStyle = enemyGradient;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, e.r, 0, Math.PI * 2);
            this.ctx.fill();

            // Outline
            this.ctx.lineWidth = 3;
            this.ctx.strokeStyle = '#590d22';
            this.ctx.stroke();

            // Eyes (Angry)
            this.ctx.fillStyle = '#fff';
            this.ctx.beginPath();
            this.ctx.arc(-e.r/3, -e.r/4, e.r/4, 0, Math.PI*2);
            this.ctx.arc(e.r/3, -e.r/4, e.r/4, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#000';
            this.ctx.beginPath();
            this.ctx.arc(-e.r/3, -e.r/4, e.r/8, 0, Math.PI*2);
            this.ctx.arc(e.r/3, -e.r/4, e.r/8, 0, Math.PI*2);
            this.ctx.fill();

            this.ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(0, -e.r * 0.1, e.r * 0.62, Math.PI * 1.08, Math.PI * 1.92);
            this.ctx.stroke();

            // Health Bar
            const hpPct = e.hp / e.maxHp;
            this.ctx.fillStyle = '#555';
            this.ctx.fillRect(-e.r, -e.r - 10, e.r*2, 5);
            this.ctx.fillStyle = '#0f0';
            this.ctx.fillRect(-e.r, -e.r - 10, e.r*2*hpPct, 5);

            this.ctx.restore();
        });

        // Draw Hero
        this.ctx.save();
        this.ctx.translate(this.hero.x, this.hero.y);

        // Shadow
        this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 18, 26, 11, 0, 0, Math.PI*2);
        this.ctx.fill();

        // Aura ring
        this.ctx.strokeStyle = 'rgba(122, 245, 255, 0.25)';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, this.hero.r + 10 + Math.sin(this.frameCount * 0.08) * 2, 0, Math.PI * 2);
        this.ctx.stroke();

        // Gun
        this.ctx.save();
        this.ctx.rotate(this.hero.angle);
        const cannonGradient = this.ctx.createLinearGradient(0, 0, 36, 0);
        cannonGradient.addColorStop(0, '#f7fbff');
        cannonGradient.addColorStop(0.35, '#7af5ff');
        cannonGradient.addColorStop(1, '#5b4bff');
        this.ctx.fillStyle = cannonGradient;
        this.ctx.fillRect(2, -7, 34, 14);
        this.ctx.fillStyle = '#ffe66d';
        this.ctx.fillRect(28, -3, 11, 6);
        this.ctx.restore();

        // Body
        const heroGradient = this.ctx.createRadialGradient(-8, -10, 4, 0, 0, this.hero.r * 1.3);
        heroGradient.addColorStop(0, '#f4fbff');
        heroGradient.addColorStop(0.38, window.gameConfig.themeColor);
        heroGradient.addColorStop(1, '#336dff');
        this.ctx.fillStyle = heroGradient;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, this.hero.r, 0, Math.PI * 2);
        this.ctx.fill();

        // Cockpit stripe
        this.ctx.fillStyle = 'rgba(14, 23, 39, 0.88)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 1, 11, 14, 0, 0, Math.PI * 2);
        this.ctx.fill();

        // Pilot face visor
        this.ctx.fillStyle = '#ffe66d';
        this.ctx.beginPath();
        this.ctx.arc(-4, -1, 2.8, 0, Math.PI * 2);
        this.ctx.arc(4, -1, 2.8, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.strokeStyle = 'rgba(255, 230, 109, 0.55)';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.arc(0, 6, 8, 0.15 * Math.PI, 0.85 * Math.PI);
        this.ctx.stroke();

        // Fins
        this.ctx.fillStyle = '#8b5cf6';
        this.ctx.beginPath();
        this.ctx.moveTo(-18, 4);
        this.ctx.lineTo(-30, 10);
        this.ctx.lineTo(-16, 14);
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.beginPath();
        this.ctx.moveTo(18, 4);
        this.ctx.lineTo(30, 10);
        this.ctx.lineTo(16, 14);
        this.ctx.closePath();
        this.ctx.fill();

        // Highlight
        this.ctx.fillStyle = 'rgba(255,255,255,0.55)';
        this.ctx.beginPath();
        this.ctx.ellipse(-6, -8, 10, 6, -0.45, 0, Math.PI*2);
        this.ctx.fill();

        // Outline
        this.ctx.lineWidth = 3;
        this.ctx.strokeStyle = '#0e6985';
        this.ctx.stroke();

        this.ctx.restore();

        // Draw Bullets
        this.bullets.forEach(b => {
            this.ctx.save();
            this.ctx.shadowBlur = 12;
            this.ctx.shadowColor = '#ffe66d';
            this.ctx.fillStyle = '#ffe66d';
            this.ctx.beginPath();
            this.ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        });

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;

        // Draw Texts
        this.ctx.font = "700 20px Rajdhani, system-ui, sans-serif";
        this.ctx.textAlign = "center";
        this.texts.forEach(t => {
            this.ctx.globalAlpha = t.life;
            this.ctx.fillStyle = t.color;
            this.ctx.fillText(t.text, t.x, t.y);
            // Stroke for readability
            this.ctx.strokeStyle = 'black';
            this.ctx.lineWidth = 2;
            this.ctx.strokeText(t.text, t.x, t.y);
        });
        this.ctx.globalAlpha = 1;

        this.ctx.restore();
    }

    loop() {
        try {
            const now = performance.now();
            const dt = 16; // Fixed step for simplicity

            this.update(dt);
            this.draw();

            requestAnimationFrame(this.loop);
        } catch (e) {
            console.error("Game Loop Error:", e);
        }
    }
}

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});

</script>
