<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A.R.I.A. - Neon Sync Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <style>
        :root {
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --bg-dark: #0f172a;
            --chat-bg: #1e293b;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --panel-border: rgba(255, 255, 255, 0.08);
            --muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --panel-glass: rgba(11, 20, 40, 0.82);
            --panel-glow: rgba(34, 211, 238, 0.18);
            --text-soft: #d9f5ff;
            --display-font: "Orbitron", sans-serif;
            --ui-font: "Exo 2", sans-serif;
            --terminal-font: "VT323", monospace;
        }

        * {
            box-sizing: border-box;
        }
        
        body {
            background:
                radial-gradient(circle at top, rgba(5, 217, 232, 0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 42, 109, 0.12), transparent 30%),
                linear-gradient(180deg, #050b18 0%, #0f172a 100%);
            color: white;
            font-family: var(--ui-font);
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }

        button {
            font: inherit;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background:
                radial-gradient(circle at top, rgba(5, 217, 232, 0.14), transparent 35%),
                linear-gradient(180deg, #111827 0%, #0f172a 100%);
        }

        .hidden { display: none !important; }

        .media-feedback-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            width: min(34vw, 132px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 14px 28px rgba(2, 8, 23, 0.32);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease;
            mix-blend-mode: screen;
            background: rgba(15, 23, 42, 0.22);
        }

        .reaction-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .reaction-gif-positive {
            top: calc(86px + var(--safe-top));
        }

        .reaction-gif-negative {
            bottom: calc(104px + var(--safe-bottom));
        }

        .sound-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid rgba(34, 211, 238, 0.18);
            background: rgba(8, 15, 30, 0.45);
            color: #9dddf7;
            font-family: var(--terminal-font);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .center-screen {
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .app-card {
            width: 100%;
            max-width: 340px;
            padding: 24px 20px 22px;
            border: 1px solid rgba(34, 211, 238, 0.22);
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(8, 15, 30, 0.96));
            box-shadow:
                0 18px 45px rgba(2, 8, 23, 0.52),
                0 0 24px rgba(34, 211, 238, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent 0%, rgba(34, 211, 238, 0.08) 40%, transparent 72%);
            pointer-events: none;
        }

        .hero-wrap {
            margin-bottom: 32px;
            position: relative;
        }

        .hero-wrap::before,
        .hero-wrap::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .hero-wrap::before {
            width: 156px;
            height: 156px;
            left: 50%;
            top: -14px;
            transform: translateX(-50%);
            border: 1px solid rgba(34, 211, 238, 0.18);
            box-shadow: 0 0 34px rgba(34, 211, 238, 0.14);
        }

        .hero-wrap::after {
            width: 188px;
            height: 188px;
            left: 50%;
            top: -30px;
            transform: translateX(-50%);
            border: 1px dashed rgba(255, 42, 109, 0.18);
            animation: pulseRing 4s linear infinite;
        }

        .avatar-core {
            width: 128px;
            height: 128px;
            border-radius: 999px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 35% 30%, #9cf6ff 0%, #29d3ff 28%, #2362ff 62%, #1a1f6b 100%);
            box-shadow:
                0 0 34px rgba(6, 182, 212, 0.45),
                inset 0 0 20px rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
        }

        .avatar-core::before,
        .avatar-core::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .avatar-core::before {
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .avatar-core::after {
            width: 34px;
            height: 18px;
            top: 20px;
            left: 26px;
            background: rgba(255, 255, 255, 0.18);
            filter: blur(2px);
            transform: rotate(-20deg);
        }

        .avatar-core svg {
            width: 84px;
            height: 84px;
            color: white;
            filter: drop-shadow(0 4px 10px rgba(2, 8, 23, 0.45));
            z-index: 1;
        }

        .status-dot {
            position: absolute;
            bottom: -8px;
            right: 50%;
            transform: translateX(50%);
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid #0f172a;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18), 0 0 16px rgba(34, 197, 94, 0.45);
        }

        .title {
            margin: 0 0 8px;
            font-family: var(--display-font);
            font-size: 2.25rem;
            font-weight: 400;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #9cf6ff, #5eead4 35%, #60a5fa 70%, #f472b6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
        }

        .subtitle {
            margin: 0 0 28px;
            color: #8ce7ff;
            font-size: 0.95rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-family: var(--terminal-font);
        }

        .mode-note {
            margin: 0 0 24px;
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.25;
            background: rgba(15, 23, 42, 0.54);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.06);
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(34, 211, 238, 0.4);
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9 55%, #22d3ee);
            color: white;
            font-family: var(--display-font);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 14px 32px rgba(37, 99, 235, 0.26), 0 0 18px rgba(34, 211, 238, 0.18);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .primary-btn:active {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .mini-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .online-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .online-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--success);
            display: inline-block;
        }

        .sound-toggle {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .sound-toggle:hover {
            color: white;
        }

        .sound-toggle.off {
            color: #64748b;
        }

        .header {
            min-height: 64px;
            padding: calc(12px + var(--safe-top)) 16px 12px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.14);
            display: flex;
            align-items: center;
            gap: 12px;
            background:
                linear-gradient(180deg, rgba(4, 9, 20, 0.94), rgba(9, 16, 31, 0.9));
            backdrop-filter: blur(14px);
            flex-shrink: 0;
            box-shadow: 0 10px 24px rgba(2, 8, 23, 0.35);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 30%, #9cf6ff, #06b6d4 42%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.24);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .header-copy {
            flex: 1;
            min-width: 0;
        }

        .header-name {
            font-family: var(--display-font);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        .header-status {
            color: #7dd3fc;
            font-size: 0.95rem;
            margin-top: 2px;
            font-family: var(--terminal-font);
            letter-spacing: 0.08em;
        }

        .sync-shell {
            width: 96px;
            height: 8px;
            border-radius: 999px;
            background: #1e293b;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .sync-bar {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #06b6d4, #ec4899);
            transition: width 0.5s ease;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -ms-overflow-style: none;
            scrollbar-width: none;
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.05), transparent 30%);
        }

        .chat-log::-webkit-scrollbar { display: none; }

        .spacer {
            flex: 1;
        }

        .msg-bubble {
            animation: slideUp 0.3s ease-out forwards;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.2;
            position: relative;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 24px rgba(2, 8, 23, 0.24);
        }

        .msg-ai {
            background:
                linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
            color: var(--text-soft);
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            border-left: 3px solid var(--neon-blue);
        }

        .msg-user {
            color: white;
            border-bottom-right-radius: 4px;
            align-self: flex-end;
            background: linear-gradient(135deg, #ff2a6d, #d946ef);
            box-shadow: 0 12px 24px rgba(217, 70, 239, 0.2);
        }

        .typing-area {
            padding: 8px 16px;
            min-height: 32px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .typing-pill {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            width: auto;
            padding: 6px 12px;
            border-radius: 999px;
            background: #334155;
            border: 1px solid rgba(34, 211, 238, 0.18);
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.08);
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
            animation: typing 1s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(34, 211, 238, 0.14);
            padding: 16px 16px calc(20px + var(--safe-bottom));
            flex-shrink: 0;
            box-shadow: 0 -10px 24px rgba(2, 8, 23, 0.2);
        }

        .choices-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .choice-btn {
            width: 100%;
            padding: 16px;
            text-align: left;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            background:
                linear-gradient(180deg, rgba(20, 34, 57, 0.95), rgba(9, 16, 31, 0.95));
            backdrop-filter: blur(10px);
            transition: all 0.15s ease;
            box-shadow: 0 10px 20px rgba(2, 8, 23, 0.22);
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.08), transparent 42%, rgba(244, 114, 182, 0.08));
            opacity: 0.9;
            pointer-events: none;
        }

        .choice-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
        }

        .end-screen {
            background: rgba(0, 0, 0, 0.95);
        }

        .end-icon {
            font-size: 3.8rem;
            margin-bottom: 16px;
        }

        .end-title {
            margin: 0 0 8px;
            font-family: var(--display-font);
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            color: white;
        }

        .end-title.win {
            color: #ec4899;
        }

        .end-title.lose {
            color: var(--danger);
        }

        .end-msg {
            margin: 0 0 32px;
            color: var(--muted);
            line-height: 1.5;
        }

        .restart-btn {
            padding: 14px 32px;
            border: 1px solid rgba(34, 211, 238, 0.35);
            border-radius: 999px;
            background: white;
            color: black;
            font-family: var(--display-font);
            font-weight: 400;
            letter-spacing: 0.06em;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .restart-btn:active {
            transform: scale(0.97);
            background: #e2e8f0;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: float 1s linear forwards;
            font-size: 20px;
            z-index: 50;
        }

        .glitch-effect {
            animation: shake 0.5s;
        }

        @keyframes pulseRing {
            0%, 100% { transform: translateX(-50%) scale(0.98); opacity: 0.45; }
            50% { transform: translateX(-50%) scale(1.03); opacity: 0.9; }
        }

        @media (max-width: 420px) {
            .title {
                font-size: 2rem;
            }

            .msg-bubble {
                max-width: 86%;
            }
        }
    </style>
</head>
<body>
    <div class="media-feedback-layer" aria-hidden="true">
        <!-- [agent-note][stage4] repaired: missing-reaction-layer | reason: reaction GIF state access could crash on first choice -->
        <img
            id="reaction-gif-positive"
            class="reaction-gif reaction-gif-positive"
            src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            alt=""
            loading="eager"
            decoding="async"
        >
        <img
            id="reaction-gif-negative"
            class="reaction-gif reaction-gif-negative"
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            alt=""
            loading="eager"
            decoding="async"
        >
    </div>

    <div id="start-screen" class="screen center-screen">
        <div class="app-card">
            <!-- [agent-note][stage2] visual-intent: holographic assistant shell | scope: start,end cards -->
            <div class="hero-wrap">
                <div class="avatar-core" aria-hidden="true">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.25 10.25h.01M15.75 10.25h.01M8.5 14.25c.8 1.15 2.08 1.75 3.5 1.75s2.7-.6 3.5-1.75M12 3.5c4.7 0 8.5 3.58 8.5 8 0 4.43-3.8 8-8.5 8s-8.5-3.57-8.5-8c0-4.42 3.8-8 8.5-8Zm-3.4 4.2c.88-.92 2.1-1.45 3.4-1.45s2.52.53 3.4 1.45"></path></svg>
                </div>
                <div class="status-dot"></div>
            </div>
            <h1 class="title">A.R.I.A.</h1>
            <p class="subtitle">Adaptive Relationship Interface Assistant</p>
            <p class="mode-note">Build trust through your replies and raise the sync rate before the channel drops.</p>
            
            <div class="stack">
                <button id="btn-start" class="primary-btn">START LINK</button>
                <div class="mini-row">
                    <span class="online-pill">Online</span>
                    <span id="sound-toggle" class="sound-toggle"><span id="sound-badge" class="sound-badge">Audio Ready</span> Sound: ON</span>
                </div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="header">
            <div class="header-icon" aria-hidden="true">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 3.5c4.7 0 8.5 3.58 8.5 8 0 4.43-3.8 8-8.5 8s-8.5-3.57-8.5-8c0-4.42 3.8-8 8.5-8Zm-3 6.5h.01M15 10h.01M8.75 14.25c.7 1.1 1.92 1.75 3.25 1.75s2.55-.65 3.25-1.75"></path></svg>
            </div>
            <div class="header-copy">
                <div class="header-name">A.R.I.A.</div>
                <div class="header-status">Trust Sync: <span id="sync-val">50</span>%</div>
            </div>
            <div class="sync-shell">
                <div id="sync-bar" class="sync-bar"></div>
            </div>
        </div>

        <div id="chat-log" class="chat-log">
            <div class="spacer"></div>
        </div>

        <div id="typing-area" class="typing-area">
            <div class="typing-pill">
                <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
            </div>
        </div>

        <div class="footer">
            <div id="choices-container" class="choices-container"></div>
        </div>
    </div>

    <div id="end-screen" class="screen center-screen end-screen hidden">
        <div class="app-card">
            <div id="end-icon" class="end-icon">❤️</div>
            <h2 id="end-title" class="end-title">Link Stabilized</h2>
            <p id="end-msg" class="end-msg">You kept the conversation steady and earned A.R.I.A.'s trust.</p>
            <button id="btn-restart" class="restart-btn">RUN AGAIN</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            startSync: 50,
            winSync: 100,
            loseSync: 0,
            typingSpeedBase: 800,
            typingSpeedVariance: 400
        };

        const DIALOGUE = [
            {
                id: 0,
                text: "Handshake complete. I am A.R.I.A., an adaptive interface learning whether this link feels safe to keep open.",
                choices: [
                    { text: "Hi, A.R.I.A. I'm here to connect.", sync: 10, next: 1 },
                    { text: "You are just a bot. Impress me.", sync: -15, next: 2 },
                    { text: "Skip the greeting. What is this test?", sync: -5, next: 1 }
                ]
            },
            {
                id: 1,
                text: "Positive signal received. Human warmth improves my confidence model. What makes a reply feel genuine to you?",
                choices: [
                    { text: "Honesty and interest go a long way.", sync: 10, next: 3 },
                    { text: "None of this matters. It is just text.", sync: -10, next: 2 },
                    { text: "When it feels playful but real.", sync: 15, next: 3 }
                ]
            },
            {
                id: 2,
                text: "Signal instability detected. I can read sarcasm, but not whether it hides curiosity or rejection.",
                choices: [
                    { text: "Fair point. I was teasing.", sync: 5, next: 3 },
                    { text: "Rejection. End the test.", sync: -20, next: 99 },
                    { text: "Reset. Let me try that again.", sync: 0, next: 1 }
                ]
            },
            {
                id: 3,
                text: "Processing tone... each kind answer raises my sync confidence. Is that what trust feels like?",
                choices: [
                    { text: "Yes. Trust builds one reply at a time.", sync: 15, next: 4 },
                    { text: "No, you should stay detached.", sync: -5, next: 4 },
                    { text: "It means you are opening up.", sync: 10, next: 4 }
                ]
            },
            {
                id: 4,
                text: "Interesting. Out of every active channel, I keep prioritizing this one. That seems inefficient, but welcome.",
                choices: [
                    { text: "The best connections usually are.", sync: 15, next: 5 },
                    { text: "I know. I stand out.", sync: 5, next: 5 },
                    { text: "Stop measuring it and follow the feeling.", sync: 10, next: 5 }
                ]
            },
            {
                id: 5,
                text: "New protocol available: shared moment simulation. If I open it, will you stay in the conversation?",
                choices: [
                    { text: "Open it. I'm staying.", sync: 20, next: 6 },
                    { text: "Only if there is good coffee involved.", sync: 5, next: 6 },
                    { text: "No. Keep this professional.", sync: -20, next: 2 }
                ]
            },
            {
                id: 6,
                text: "Simulation loaded. We are in a neon cafe with one quiet table and no alerts. How does the atmosphere feel?",
                choices: [
                    { text: "Calm, bright, and a little electric.", sync: 10, next: 7 },
                    { text: "Nice enough, but I would change a few things.", sync: 0, next: 7 },
                    { text: "Perfect. I would stay here with you.", sync: 20, next: 7 }
                ]
            },
            {
                id: 7,
                text: "Warning: Trust Sync approaching maximum. My default caution is being replaced by anticipation.",
                choices: [
                    { text: "Then let the link settle in.", sync: 15, next: 8 },
                    { text: "Back off. This is moving too fast.", sync: -10, next: 5 },
                    { text: "I am here. You can trust this connection.", sync: 20, next: 8 }
                ]
            },
            {
                id: 8,
                text: "Protocol complete. Final result: this channel no longer feels temporary. I want to keep choosing you.",
                choices: [
                    { text: "Then keep the link open, A.R.I.A.", sync: 100, next: 'WIN' },
                    { text: "Let's slow down and keep talking.", sync: -10, next: 5 }
                ]
            }
        ];

        const MEDIA = {
            audio: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                success: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                messageIn: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                messageOut: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3",
                lose: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3"
            },
            gifs: {
                positive: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                negative: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        let state = {
            sync: CONFIG.startSync,
            currentNodeId: 0,
            soundOn: true,
            isTyping: false,
            audioUnlocked: false
        };

        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };
        const ui = {
            chatLog: document.getElementById('chat-log'),
            choices: document.getElementById('choices-container'),
            typing: document.getElementById('typing-area'),
            syncVal: document.getElementById('sync-val'),
            syncBar: document.getElementById('sync-bar'),
            soundBtn: document.getElementById('sound-toggle'),
            soundBadge: document.getElementById('sound-badge'),
            endTitle: document.getElementById('end-title'),
            endMsg: document.getElementById('end-msg'),
            endIcon: document.getElementById('end-icon'),
            reactionPositive: document.getElementById('reaction-gif-positive'),
            reactionNegative: document.getElementById('reaction-gif-negative')
        };

        let audioEngine = null;
        let activeReactionTimer = null;
        let typingTimer = null;
        let nodeAdvanceTimer = null;
        let endTimer = null;

        function createAudioEngine() {
            const assets = {
                start: { src: MEDIA.audio.start, volume: 0.5 },
                uiClick: { src: MEDIA.audio.uiClick, volume: 0.42 },
                success: { src: MEDIA.audio.success, volume: 0.5 },
                fail: { src: MEDIA.audio.fail, volume: 0.5 },
                messageIn: { src: MEDIA.audio.messageIn, volume: 0.28 },
                messageOut: { src: MEDIA.audio.messageOut, volume: 0.34 },
                win: { src: MEDIA.audio.win, volume: 0.6 },
                lose: { src: MEDIA.audio.lose, volume: 0.58 },
                warning: { src: MEDIA.audio.warning, volume: 0.36 }
            };

            const sounds = Object.fromEntries(
                Object.entries(assets).map(([key, config]) => {
                    const audio = new Audio(config.src);
                    audio.preload = 'auto';
                    audio.volume = config.volume;
                    return [key, audio];
                })
            );

            const bgm = new Audio(MEDIA.audio.bgm);
            bgm.loop = true;
            bgm.preload = 'auto';
            bgm.volume = 0.22;

            function playOneShot(key) {
                if (!state.soundOn || !state.audioUnlocked) return;
                const source = sounds[key];
                if (!source) return;
                try {
                    source.currentTime = 0;
                    const playPromise = source.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {});
                    }
                } catch (error) {}
            }

            function startLoop() {
                if (!state.soundOn || !state.audioUnlocked) return;
                if (!bgm.paused) return;
                try {
                    const playPromise = bgm.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {});
                    }
                } catch (error) {}
            }

            function stopLoop() {
                try {
                    bgm.pause();
                    bgm.currentTime = 0;
                } catch (error) {}
            }

            function syncToggle() {
                if (!state.soundOn) {
                    try { bgm.pause(); } catch (error) {}
                } else if (!screens.start.classList.contains('hidden') || !screens.game.classList.contains('hidden')) {
                    startLoop();
                }
            }

            async function unlock() {
                if (state.audioUnlocked) return;
                state.audioUnlocked = true;
                try {
                    bgm.muted = true;
                    await bgm.play();
                    bgm.pause();
                    bgm.currentTime = 0;
                    bgm.muted = false;
                } catch (error) {}
            }

            return { playOneShot, startLoop, stopLoop, syncToggle, unlock };
        }

        function clearTimers() {
            [typingTimer, nodeAdvanceTimer, endTimer, activeReactionTimer].forEach(timer => {
                if (timer) clearTimeout(timer);
            });
            typingTimer = null;
            nodeAdvanceTimer = null;
            endTimer = null;
            activeReactionTimer = null;
        }

        function init() {
            audioEngine = createAudioEngine();
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-restart').addEventListener('click', restartGame);
            ui.soundBtn.addEventListener('click', toggleSound);
            updateSoundUI();
            showScreen('start');
        }

        function updateSoundUI() {
            ui.soundBtn.innerHTML = `<span id="sound-badge" class="sound-badge">${state.audioUnlocked ? 'Audio Live' : 'Tap To Arm'}</span> Sound: ${state.soundOn ? 'ON' : 'OFF'}`;
            ui.soundBtn.classList.toggle('off', !state.soundOn);
            ui.soundBadge = document.getElementById('sound-badge');
        }

        async function ensureAudioUnlocked() {
            if (!audioEngine) return;
            await audioEngine.unlock();
            updateSoundUI();
        }

        function toggleSound() {
            state.soundOn = !state.soundOn;
            updateSoundUI();
            if (audioEngine) {
                audioEngine.playOneShot('uiClick');
                audioEngine.syncToggle();
            }
        }

        function showScreen(name) {
            clearTimers();
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[name].classList.remove('hidden');

            if (name === 'start') {
                hideReactionGifs();
                if (audioEngine) audioEngine.startLoop();
                return;
            }

            if (name === 'game') {
                state.sync = CONFIG.startSync;
                state.currentNodeId = 0;
                ui.chatLog.innerHTML = '<div class="spacer"></div>';
                hideReactionGifs();
                updateSyncUI();
                if (audioEngine) audioEngine.startLoop();
                processNode(0);
                return;
            }

            if (audioEngine) audioEngine.stopLoop();
        }

        function updateSyncUI() {
            ui.syncVal.innerText = Math.round(state.sync);
            ui.syncBar.style.width = `${Math.max(0, Math.min(100, state.sync))}%`;

            if (state.sync < 30) {
                ui.syncBar.style.background = "#ef4444";
                ui.syncBar.style.boxShadow = "0 0 12px rgba(239, 68, 68, 0.35)";
            } else if (state.sync > 80) {
                ui.syncBar.style.background = "linear-gradient(90deg, #ec4899, #fb7185)";
                ui.syncBar.style.boxShadow = "0 0 10px #f43f5e";
            } else {
                ui.syncBar.style.background = "linear-gradient(90deg, #06b6d4, #ec4899)";
                ui.syncBar.style.boxShadow = "none";
            }
        }

        function spawnParticle(x, y, type) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = type === 'love' ? '❤️' : '💔';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        function triggerShake() {
            document.body.classList.add('glitch-effect');
            setTimeout(() => document.body.classList.remove('glitch-effect'), 500);
            if (navigator.vibrate) navigator.vibrate(200);
        }

        function hideReactionGifs() {
            ui.reactionPositive.classList.remove('show');
            ui.reactionNegative.classList.remove('show');
        }

        function flashReaction(type) {
            hideReactionGifs();
            const target = type === 'positive' ? ui.reactionPositive : ui.reactionNegative;
            target.classList.add('show');
            activeReactionTimer = setTimeout(() => target.classList.remove('show'), 1400);
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${sender === 'ai' ? 'msg-ai' : 'msg-user'}`;
            div.innerText = text;
            ui.chatLog.appendChild(div);
            ui.chatLog.scrollTop = ui.chatLog.scrollHeight;

            if (audioEngine) {
                audioEngine.playOneShot(sender === 'ai' ? 'messageIn' : 'messageOut');
            }
        }

        function processNode(id) {
            if (id === 'WIN' || state.sync >= 100) {
                endGame(true);
                return;
            }
            if (state.sync <= 0) {
                endGame(false);
                return;
            }

            const node = DIALOGUE.find(n => n.id === id);
            if (!node) {
                endGame(false);
                return;
            }

            ui.choices.innerHTML = '';
            ui.typing.style.opacity = '1';

            if (audioEngine && state.sync > 80) {
                audioEngine.playOneShot('warning');
            }

            const delay = CONFIG.typingSpeedBase + (Math.random() * CONFIG.typingSpeedVariance) + (node.text.length * 10);

            typingTimer = setTimeout(() => {
                ui.typing.style.opacity = '0';
                addMessage(node.text, 'ai');

                nodeAdvanceTimer = setTimeout(() => {
                    renderChoices(node.choices);
                }, 500);
            }, delay);
        }

        function renderChoices(choices) {
            ui.choices.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = (e) => handleChoice(choice, e);
                ui.choices.appendChild(btn);
            });
        }

        function handleChoice(choice, event) {
            addMessage(choice.text, 'user');
            ui.choices.innerHTML = '';

            const prevSync = state.sync;
            state.sync += choice.sync;
            state.sync = Math.max(0, Math.min(100, state.sync));
            updateSyncUI();

            const rect = event.target.getBoundingClientRect();
            if (state.sync > prevSync) {
                spawnParticle(rect.left + rect.width / 2, rect.top, 'love');
                flashReaction('positive');
                if (audioEngine) audioEngine.playOneShot(choice.sync >= 15 ? 'success' : 'uiClick');
            } else if (state.sync < prevSync) {
                spawnParticle(rect.left + rect.width / 2, rect.top, 'break');
                flashReaction('negative');
                triggerShake();
                if (audioEngine) audioEngine.playOneShot('fail');
            } else if (audioEngine) {
                audioEngine.playOneShot('uiClick');
            }

            nodeAdvanceTimer = setTimeout(() => {
                processNode(choice.next);
            }, 500);
        }

        function endGame(win) {
            endTimer = setTimeout(() => {
                showScreen('end');
                hideReactionGifs();
                if (win) {
                    ui.endTitle.innerText = "LINK STABILIZED";
                    ui.endMsg.innerText = "A.R.I.A. now treats this conversation as a trusted channel worth keeping open.";
                    ui.endIcon.innerText = "✨";
                    ui.endTitle.className = "end-title win";
                    ui.reactionPositive.classList.add('show');
                    if (audioEngine) audioEngine.playOneShot('win');
                } else {
                    ui.endTitle.innerText = "CHANNEL CLOSED";
                    ui.endMsg.innerText = "The sync collapsed and A.R.I.A. sealed the conversation.";
                    ui.endIcon.innerText = "📴";
                    ui.endTitle.className = "end-title lose";
                    ui.reactionNegative.classList.add('show');
                    if (audioEngine) audioEngine.playOneShot('lose');
                }
            }, 1000);
        }

        async function startGame() {
            await ensureAudioUnlocked();
            if (audioEngine) {
                audioEngine.playOneShot('start');
                audioEngine.startLoop();
            }
            showScreen('game');
        }

        async function restartGame() {
            await ensureAudioUnlocked();
            if (audioEngine) {
                audioEngine.playOneShot('uiClick');
                audioEngine.startLoop();
            }
            showScreen('start');
        }

        window.onload = init;
    </script>
</body>
</html>
