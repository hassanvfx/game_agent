<![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Pixel Relic Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&family=Press+Start+2P&family=Cinzel:wght@400;700&display=swap');

        :root {
            --font-display: 'Audiowide', 'Cinzel', serif;
            --font-ui: 'Rajdhani', 'Press Start 2P', sans-serif;
            --bg-top: #140b26;
            --bg-bottom: #050814;
            --panel-top: rgba(33, 25, 68, 0.94);
            --panel-bottom: rgba(12, 16, 40, 0.96);
            --panel-border: #89f0ff;
            --panel-shadow: rgba(0, 0, 0, 0.58);
            --hud-bg: rgba(12, 18, 46, 0.78);
            --hud-border: rgba(143, 247, 255, 0.78);
            --text-main: #f8f8ff;
            --text-dim: #c6d4ff;
            --accent-cyan: #8cf5ff;
            --accent-gold: #ffd36f;
            --accent-rose: #ff7c99;
            --danger: #ff6b88;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: var(--font-ui);
            background:
                radial-gradient(circle at top, rgba(94, 61, 196, 0.32), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
            background:
                radial-gradient(circle at 50% 20%, rgba(120, 243, 255, 0.16), transparent 22%),
                linear-gradient(180deg, #30245c 0%, #160f35 36%, #0a1025 100%);
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 211, 111, 0.22), transparent 12%),
                radial-gradient(circle at 82% 16%, rgba(140, 245, 255, 0.14), transparent 10%),
                radial-gradient(circle at 64% 30%, rgba(255, 124, 153, 0.1), transparent 12%);
            opacity: 0.95;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 14%),
                linear-gradient(0deg, rgba(4, 8, 18, 0.8), transparent 24%);
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            position: relative;
            z-index: 0;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }

        .mc-panel {
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            border: 3px solid var(--panel-border);
            box-shadow:
                0 0 0 3px rgba(6, 11, 27, 0.88),
                0 18px 38px var(--panel-shadow),
                0 0 26px rgba(140, 245, 255, 0.18);
            color: var(--text-main);
            image-rendering: pixelated;
            padding: 1.6rem;
            max-width: 26rem;
            width: min(90%, 26rem);
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 0.95rem;
            box-sizing: border-box;
            border-radius: 1.1rem;
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
        }

        .mc-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(140deg, rgba(255,255,255,0.12), transparent 32%),
                radial-gradient(circle at 50% 0%, rgba(140, 245, 255, 0.12), transparent 48%);
            pointer-events: none;
        }

        .mc-panel > * {
            position: relative;
            z-index: 1;
        }

        .mc-btn {
            background: linear-gradient(180deg, #2f5a8d, #1a274f);
            border: 3px solid rgba(158, 241, 255, 0.92);
            color: #fefeff;
            text-shadow: 0 2px 0 rgba(2, 7, 22, 0.85);
            cursor: pointer;
            position: relative;
            font-family: inherit;
            border-radius: 999px;
            box-shadow: 0 8px 18px rgba(2, 6, 18, 0.45);
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
        }

        .mc-btn:hover {
            filter: brightness(1.08);
        }

        .mc-btn:active {
            transform: translateY(1px) scale(0.985);
            box-shadow: 0 4px 10px rgba(2, 6, 18, 0.36);
            filter: brightness(0.96);
        }

        .pixel-text {
            text-shadow: 0 2px 0 rgba(4, 8, 22, 0.86);
        }

        .title-text {
            font-family: var(--font-display);
            text-shadow: 0 4px 18px rgba(140, 245, 255, 0.18);
            color: #fff7d2;
            letter-spacing: 0.14em;
        }

        .scanlines {
            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0),
                    rgba(255,255,255,0) 50%,
                    rgba(3,8,18,0.18) 50%,
                    rgba(3,8,18,0.18)
                );
            background-size: 100% 4px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.42;
            mix-blend-mode: soft-light;
        }

        .hidden {
            display: none !important;
        }

        .start-title {
            font-size: clamp(2.35rem, 8vw, 3.7rem);
            margin: 0 0 0.4rem;
            line-height: 0.98;
            letter-spacing: 0.16em;
        }

        .callout {
            font-size: clamp(0.9rem, 2.3vw, 1.05rem);
            color: var(--text-main);
            margin-bottom: 0.3rem;
            font-weight: 600;
            font-family: var(--font-ui);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: linear-gradient(180deg, rgba(255, 211, 111, 0.2), rgba(255, 124, 153, 0.18));
            padding: 0.85rem 0.95rem;
            border: 2px solid rgba(255, 211, 111, 0.56);
            line-height: 1.5;
            border-radius: 0.9rem;
            box-shadow: inset 0 0 14px rgba(255,255,255,0.05);
        }

        .instruction-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            text-align: left;
            font-size: clamp(0.84rem, 2.1vw, 0.96rem);
            font-family: var(--font-ui);
            color: var(--text-dim);
            padding: 0 0.55rem;
            line-height: 1.55;
        }

        .instruction-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.38rem 0.5rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(140, 245, 255, 0.12);
            border-radius: 0.75rem;
        }

        .swatch {
            width: 1rem;
            height: 1rem;
            flex: 0 0 1rem;
            border-radius: 999px;
            box-shadow: 0 0 10px currentColor;
        }

        .btn-primary {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            padding: 1rem 1.5rem;
            width: 100%;
            margin-top: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        .btn-secondary {
            font-size: clamp(0.8rem, 2vw, 1rem);
            padding: 0.8rem 1rem;
            width: 100%;
            font-weight: 700;
        }

        .btn-muted {
            background: linear-gradient(180deg, #61344d, #311b2f);
            border-color: rgba(255, 166, 192, 0.72);
        }

        .game-over-title {
            font-size: clamp(2rem, 7vw, 3rem);
            color: var(--danger);
            margin: 0 0 0.35rem;
        }

        .score-summary {
            font-size: clamp(0.92rem, 2.4vw, 1.16rem);
            color: var(--text-dim);
            margin-bottom: 0.35rem;
            line-height: 1.5;
        }

        .score-summary span {
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 0);
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            padding-top: 1rem;
            z-index: 30;
        }

        .hud-score {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 0.8rem;
            background: var(--hud-bg);
            border: 2px solid var(--hud-border);
            border-radius: 999px;
            box-shadow: 0 10px 18px rgba(1, 6, 20, 0.34);
            backdrop-filter: blur(6px);
        }

        .diamond-icon {
            width: 2rem;
            height: 2rem;
            position: relative;
            animation: pulse 1.4s infinite ease-in-out;
        }

        .diamond-icon::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #9cf7ff, #48d6ff);
            border: 2px solid #d9fdff;
            transform: rotate(45deg) scale(0.75);
            box-sizing: border-box;
            box-shadow: 0 0 14px rgba(140, 245, 255, 0.7);
        }

        #score {
            font-size: clamp(1.2rem, 3.5vw, 2rem);
            color: white;
        }

        #sound-btn {
            pointer-events: auto;
            width: 3rem;
            height: 3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            padding: 0;
            background: linear-gradient(180deg, rgba(34, 76, 122, 0.95), rgba(12, 24, 52, 0.95));
            border-radius: 999px;
            box-shadow: 0 10px 18px rgba(1, 6, 20, 0.34);
        }

        .feedback-gif {
            position: absolute;
            right: 0.8rem;
            width: clamp(4.4rem, 16vw, 7rem);
            opacity: 0;
            transform: translateY(0.4rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 25;
            filter: drop-shadow(0 10px 18px rgba(1, 6, 20, 0.4));
        }

        .feedback-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #pickup-gif {
            top: calc(env(safe-area-inset-top, 0) + 4.8rem);
        }

        #fail-gif {
            bottom: 1rem;
            width: clamp(5rem, 18vw, 7.6rem);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @media (max-width: 640px) {
            .mc-panel {
                padding: 1.25rem;
                gap: 0.85rem;
            }

            .instruction-list {
                padding: 0 0.35rem;
            }

            #hud {
                left: 0.75rem;
                right: 0.75rem;
                padding-top: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: pickup/fail feedback -> catalogs/gifs.json -->
            <img id="pickup-gif" class="feedback-gif" src="https://i.giphy.com/Da3QKzDMWZFIaXxEYQ.webp" alt="Relic pickup celebration effect">
            <img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Run failed reaction effect">
            <div id="start-screen" class="mc-panel">
                <h1 class="start-title title-text">PIXEL<br>RELIC RUN</h1>
                <div class="callout">
                    RELIC KNIGHT // TAP TO LEAP
                </div>
                <div class="instruction-list">
                    <div class="instruction-row"><div class="swatch" style="background:#00AA00;"></div> Avoid patrol drones</div>
                    <div class="instruction-row"><div class="swatch" style="background:#00AAAA;"></div> Avoid sentries</div>
                    <div class="instruction-row"><div class="swatch" style="background:#CCC;"></div> Avoid scouts</div>
                    <div class="instruction-row"><div class="swatch" style="background:#00FFFF;"></div> Collect relic shards</div>
                </div>
                <button id="start-btn" class="mc-btn btn-primary">START</button>
            </div>

            <div id="game-over-screen" class="hidden mc-panel">
                <h2 class="game-over-title title-text">RUN ENDED</h2>
                <div class="score-summary">Relic score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="mc-btn btn-primary">TRY AGAIN</button>
                <button id="menu-btn" class="mc-btn btn-secondary btn-muted">MAIN MENU</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-score">
                    <div class="diamond-icon"></div>
                    <span id="score" class="pixel-text">0</span>
                </div>
                <button id="sound-btn" class="mc-btn">🔊</button>
            </div>
        </div>
    </div>

    <script type="module">
        /**
         * GAME CONFIGURATION & STATE
         */
        const CONFIG = {
            gravity: 0.6,
            jumpPower: -13,
            groundHeightRatio: 0.25,
            startSpeed: 6,
            speedIncrement: 0.001,
            maxSpeed: 12
        };

        const STATE = {
            active: false,
            score: 0,
            frameCount: 0,
            speed: CONFIG.startSpeed,
            width: 0,
            height: 0,
            groundY: 0,
            soundOn: true
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/Da3QKzDMWZFIaXxEYQ.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        // Audio System
        const audioCtx = {
            bgm: new Audio(ASSETS.bgm),
            sfx: {},
            unlocked: false,
            init: () => {
                audioCtx.bgm.loop = true;
                audioCtx.bgm.volume = 0.2;
                audioCtx.bgm.preload = 'auto';
                for (let k in ASSETS.sfx) {
                    const sound = new Audio(ASSETS.sfx[k]);
                    sound.preload = 'auto';
                    audioCtx.sfx[k] = sound;
                }
            },
            unlock: () => {
                if (audioCtx.unlocked) return;
                audioCtx.unlocked = true;
                audioCtx.bgm.load();
                Object.values(audioCtx.sfx).forEach((sound) => sound.load());
            },
            playBGM: () => {
                if (STATE.soundOn && audioCtx.unlocked) {
                    audioCtx.bgm.play().catch(() => {});
                }
            },
            stopBGM: () => {
                audioCtx.bgm.pause();
                audioCtx.bgm.currentTime = 0;
            },
            playSFX: (k, volume = 0.6) => {
                if (!STATE.soundOn || !audioCtx.unlocked || !audioCtx.sfx[k]) return;
                const s = audioCtx.sfx[k].cloneNode();
                s.volume = volume;
                s.play().catch(() => {});
            },
            toggle: () => {
                audioCtx.unlock();
                STATE.soundOn = !STATE.soundOn;
                if (STATE.soundOn && STATE.active) audioCtx.bgm.play().catch(() => {});
                else audioCtx.bgm.pause();
                return STATE.soundOn;
            }
        };
        audioCtx.init();

        const feedbackTimers = {};
        let lastLandState = true;

        function showGif(key, duration = 900) {
            const element = document.getElementById(`${key}-gif`);
            if (!element) return;
            element.classList.add('visible');
            window.clearTimeout(feedbackTimers[key]);
            feedbackTimers[key] = window.setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // Entities
        let player = {
            x: 50, y: 0, w: 32, h: 64, dy: 0, grounded: false,
            legAngle: 0
        };

        let obstacles = [];
        let particles = [];
        let scenery = [];

        function resize() {
            STATE.width = window.innerWidth;
            STATE.height = window.innerHeight;
            canvas.width = STATE.width;
            canvas.height = STATE.height;
            STATE.groundY = STATE.height - (STATE.height * CONFIG.groundHeightRatio);

            if (player.grounded) player.y = STATE.groundY - player.h;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * GENERATORS
         */
        function spawnObstacle() {
            const typeRoll = Math.random();
            let type = 'creeper';
            let w = 32, h = 64;

            if (typeRoll < 0.25) {
                type = 'diamond';
                w = 32; h = 32;
            } else if (typeRoll < 0.5) {
                type = 'zombie';
            } else if (typeRoll < 0.75) {
                type = 'skeleton';
            } else {
                type = 'creeper';
            }

            obstacles.push({
                x: STATE.width + 50,
                y: type === 'diamond' ? STATE.groundY - 100 - (Math.random() * 40) : STATE.groundY - h,
                w: w,
                h: h,
                type: type,
                active: true,
                animOffset: Math.random() * 10
            });
        }

        function spawnTree() {
            scenery.push({
                x: STATE.width + 100,
                y: STATE.groundY,
                w: 40 + Math.random() * 40,
                h: 100 + Math.random() * 80,
                type: 'tree',
                speedFactor: 0.5
            });
        }

        function spawnCloud() {
            scenery.push({
                x: STATE.width + 100,
                y: Math.random() * (STATE.height / 3),
                w: 80 + Math.random() * 60,
                h: 30 + Math.random() * 20,
                type: 'cloud',
                speedFactor: 0.2
            });
        }

        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 40,
                    color: color,
                    size: 4 + Math.random() * 4
                });
            }
        }

        /**
         * UPDATE LOOP
         */
        function update() {
            player.dy += CONFIG.gravity;
            player.y += player.dy;

            if (player.y + player.h >= STATE.groundY) {
                player.y = STATE.groundY - player.h;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (!lastLandState && player.grounded) {
                audioCtx.playSFX('land', 0.32);
            }
            lastLandState = player.grounded;

            if (player.grounded) {
                player.legAngle = Math.sin(STATE.frameCount * 0.3) * 0.5;
            } else {
                player.legAngle = 0.5;
            }

            STATE.speed = Math.min(STATE.speed + CONFIG.speedIncrement, CONFIG.maxSpeed);
            STATE.frameCount++;

            const spawnRate = Math.floor(1200 / STATE.speed);
            if (STATE.frameCount % spawnRate === 0) spawnObstacle();

            if (Math.random() < 0.01) spawnTree();
            if (Math.random() < 0.005) spawnCloud();

            for (let i = scenery.length - 1; i >= 0; i--) {
                let s = scenery[i];
                s.x -= STATE.speed * s.speedFactor;
                if (s.x + s.w < -100) scenery.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= STATE.speed;

                const pad = 8;
                if (obs.active &&
                    player.x + pad < obs.x + obs.w - pad &&
                    player.x + player.w - pad > obs.x + pad &&
                    player.y + pad < obs.y + obs.h - pad &&
                    player.y + player.h - pad > obs.y + pad) {

                    if (obs.type === 'diamond') {
                        obs.active = false;
                        STATE.score += 100;
                        document.getElementById('score').innerText = STATE.score;
                        audioCtx.playSFX('score', 0.5);
                        showGif('pickup', 820);
                        createParticles(obs.x + obs.w / 2, obs.y + obs.h / 2, '#00FFFF');
                    } else {
                        gameOver();
                        return;
                    }
                }

                if (obs.x + obs.w < -50) {
                    obstacles.splice(i, 1);
                    if (obs.active && obs.type !== 'diamond') {
                        STATE.score += 10;
                        document.getElementById('score').innerText = STATE.score;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        /**
         * DRAWING HELPERS
         */
        function fillRect(x, y, w, h, c) {
            ctx.fillStyle = c;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function drawHumanoid(x, y, w, h, skinColor, shirtColor, pantsColor, isZombie = false, isSkeleton = false, legAngle = 0) {
            const headSize = 24;
            const bodyH = 24;
            const legH = 24;
            const cx = x + w / 2;
            const cloakColor = isSkeleton ? "#adb8d7" : (isZombie ? "#4f8d68" : "#7f56d9");

            fillRect(cx - headSize / 2, y, headSize, headSize, skinColor);
            fillRect(cx - headSize / 2 + 2, y + 2, headSize - 4, 5, isSkeleton ? "#f6fbff" : "#ffe0c8");

            ctx.fillStyle = isSkeleton ? "#344052" : (isZombie ? "#142d1d" : "#25133d");
            fillRect(cx - 8, y + 8, 4, 4, ctx.fillStyle);
            fillRect(cx + 4, y + 8, 4, 4, ctx.fillStyle);

            fillRect(cx - 10, y + headSize - 2, 20, bodyH + 2, shirtColor);
            fillRect(cx - 12, y + headSize + bodyH - 2, 24, 12, cloakColor);
            fillRect(cx - 8, y + headSize + bodyH, 8, legH, pantsColor);
            fillRect(cx, y + headSize + bodyH, 8, legH, pantsColor);

            if (isZombie || isSkeleton) {
                fillRect(cx - 8, y + headSize + 4, 8, 24, skinColor);
                fillRect(cx + 8, y + headSize + 4, 8, 24, skinColor);
                fillRect(cx - 20, y + headSize + 4, 20, 8, shirtColor);
            } else {
                fillRect(cx - 14, y + headSize + 2, 8, 22, skinColor);
                fillRect(cx + 6, y + headSize + 2, 8, 22, skinColor);
                fillRect(cx - 6, y + headSize + 8, 12, 6, "#fff2ad");
            }

            if (isSkeleton) {
                ctx.strokeStyle = "#68748d";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx - 20, y + headSize + 8, 12, 1.5, 4.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 20, y + headSize - 4);
                ctx.lineTo(cx - 20, y + headSize + 20);
                ctx.stroke();
            }
        }

        function drawCreeper(x, y, w, h) {
            const headSize = 24;
            const cx = x + w / 2;
            fillRect(cx - headSize / 2, y, headSize, headSize, "#1dbf62");
            fillRect(cx - headSize / 2 + 2, y + 2, headSize - 4, 5, "#7cffb0");

            ctx.fillStyle = "#08160d";
            fillRect(cx - 6, y + 6, 4, 4, "#08160d");
            fillRect(cx + 2, y + 6, 4, 4, "#08160d");
            fillRect(cx - 2, y + 12, 4, 6, "#08160d");
            fillRect(cx - 6, y + 16, 4, 4, "#08160d");
            fillRect(cx + 2, y + 16, 4, 4, "#08160d");

            fillRect(cx - 10, y + headSize, 20, 24, "#139d52");
            fillRect(cx - 12, y + headSize + 22, 24, 6, "#0d6e39");

            const legW = 6;
            const legH = 12;
            const anim = Math.sin(STATE.frameCount * 0.2) * 5;
            fillRect(cx - 10 + anim, y + headSize + 24, legW, legH, "#1dbf62");
            fillRect(cx + 4 - anim, y + headSize + 24, legW, legH, "#1dbf62");
        }

        function draw() {
            const sky = ctx.createLinearGradient(0, 0, 0, STATE.height);
            sky.addColorStop(0, "#352b72");
            sky.addColorStop(0.45, "#1f2556");
            sky.addColorStop(1, "#081120");
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, STATE.width, STATE.height);
            fillRect(STATE.width - 82, 36, 56, 56, "#ffd36f");
            fillRect(STATE.width - 74, 44, 40, 40, "#fff3b0");

            scenery.forEach(s => {
                if (s.type === 'cloud') {
                    fillRect(s.x, s.y, s.w, s.h, "rgba(241,245,255,0.72)");
                } else if (s.type === 'tree') {
                    fillRect(s.x + s.w * 0.3, s.y - s.h, s.w * 0.4, s.h, "#3a2747");
                    fillRect(s.x, s.y - s.h - s.w, s.w, s.w, "#1bb985");
                    fillRect(s.x + s.w * 0.15, s.y - s.h - s.w * 0.6, s.w * 0.7, s.w * 0.25, "#8cf5ff");
                }
            });

            fillRect(0, STATE.groundY, STATE.width, STATE.height - STATE.groundY, "#241634");
            fillRect(0, STATE.groundY, STATE.width, 16, "#20c07b");

            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            ctx.lineWidth = 2;
            const gridOffset = (STATE.frameCount * STATE.speed) % 40;
            for (let gx = -gridOffset; gx < STATE.width; gx += 40) {
                ctx.strokeRect(gx, STATE.groundY, 40, 40);
            }

            drawHumanoid(player.x, player.y, player.w, player.h,
                '#ffd4b3', '#33d7ff', '#1738a6', false, false, player.legAngle);

            obstacles.forEach(obs => {
                if (!obs.active) return;

                if (obs.type === 'diamond') {
                    const cy = obs.y + obs.h / 2 + Math.sin(STATE.frameCount * 0.1) * 5;
                    const cx = obs.x + obs.w / 2;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(Math.sin(STATE.frameCount * 0.1) * 0.2);

                    ctx.fillStyle = "#00FFFF";
                    ctx.beginPath();
                    ctx.moveTo(0, -16);
                    ctx.lineTo(16, 0);
                    ctx.lineTo(0, 16);
                    ctx.lineTo(-16, 0);
                    ctx.fill();

                    ctx.fillStyle = "rgba(255,255,255,0.5)";
                    ctx.fillRect(-6, -6, 6, 6);

                    ctx.restore();
                } else if (obs.type === 'creeper') {
                    drawCreeper(obs.x, obs.y, obs.w, obs.h);
                } else if (obs.type === 'zombie') {
                    drawHumanoid(obs.x, obs.y, obs.w, obs.h,
                        '#00AA00', '#00AAAA', '#0000AA', true, false, Math.sin(STATE.frameCount * 0.2 + obs.animOffset));
                } else if (obs.type === 'skeleton') {
                    drawHumanoid(obs.x, obs.y, obs.w, obs.h,
                        '#DDD', '#DDD', '#DDD', false, true, Math.sin(STATE.frameCount * 0.2 + obs.animOffset));
                }
            });

            particles.forEach(p => {
                fillRect(p.x, p.y, p.size, p.size, p.color);
            });
        }

        function gameLoop() {
            if (!STATE.active) return;
            ctx.clearRect(0, 0, STATE.width, STATE.height);
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        /**
         * GAME LOGIC
         */
        function initGame() {
            STATE.score = 0;
            STATE.speed = CONFIG.startSpeed;
            STATE.frameCount = 0;
            player.y = STATE.groundY - player.h;
            player.dy = 0;
            player.grounded = true;
            lastLandState = true;
            obstacles = [];
            particles = [];
            scenery = [];

            for (let i = 0; i < 5; i++) {
                let s = {
                    x: Math.random() * STATE.width,
                    y: STATE.groundY,
                    w: 40 + Math.random() * 40,
                    h: 100 + Math.random() * 80,
                    type: 'tree',
                    speedFactor: 0.5
                };
                scenery.push(s);
            }

            document.getElementById('score').innerText = 0;
        }

        function gameOver() {
            STATE.active = false;
            audioCtx.stopBGM();
            audioCtx.playSFX('fail', 0.5);
            showGif('fail', 1500);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = STATE.score;
        }

        function jump() {
            if (STATE.active && player.grounded) {
                player.dy = CONFIG.jumpPower;
                player.grounded = false;
                audioCtx.playSFX('jump', 0.38);
            } else if (STATE.active && !player.grounded && player.dy > -5 && player.dy < 5) {
                player.dy = CONFIG.jumpPower * 0.8;
            }
        }

        /**
         * INPUTS
         */
        const gameContainer = document.getElementById('game-container');

        // [agent-note][stage4] repaired: mobile-button-taps | scope: gameplay touch suppression stays on game surface
        gameContainer.addEventListener('touchstart', (e) => {
            audioCtx.unlock();
            if (STATE.active) audioCtx.playBGM();
            document.getElementById('pickup-gif').src = ASSETS.gifs.pickup;
            document.getElementById('fail-gif').src = ASSETS.gifs.fail;
            document.getElementById('pickup-gif').loading = 'eager';
            document.getElementById('fail-gif').loading = 'eager';
            document.getElementById('pickup-gif').decoding = 'async';
            document.getElementById('fail-gif').decoding = 'async';

            if (e.target.closest('button')) {
                return;
            }

            e.preventDefault();
            jump();
        }, { passive: false });

        gameContainer.addEventListener('mousedown', (e) => {
            audioCtx.unlock();
            if (STATE.active) audioCtx.playBGM();
            if (e.target.tagName !== 'BUTTON') {
                jump();
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audioCtx.unlock();
            audioCtx.playSFX('ui', 0.36);
            audioCtx.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            STATE.active = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audioCtx.unlock();
            audioCtx.playSFX('ui', 0.36);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audioCtx.playBGM();
            STATE.active = true;
            initGame();
            gameLoop();
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            audioCtx.playSFX('ui', 0.3);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        document.getElementById('sound-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const isOn = audioCtx.toggle();
            document.getElementById('sound-btn').innerText = isOn ? '🔊' : '🔇';
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                audioCtx.unlock();
                jump();
            }
        });
    </script>
</body>
</html>
