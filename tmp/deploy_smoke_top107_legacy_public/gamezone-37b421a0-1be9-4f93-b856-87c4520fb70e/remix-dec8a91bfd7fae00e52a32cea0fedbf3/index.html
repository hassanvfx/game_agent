<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bounce Parade</title>
    <!-- [agent-note][stage4] remapped-font: title/buttons -> Audiowide | ui/body -> Exo 2 via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme: #ff5b87;
            --theme-dark: #c62f5d;
            --theme-soft: #ffd3e1;
            --sky-top: #4b2d86;
            --sky-bottom: #120e29;
            --field: #1b6f62;
            --field-shade: #0f4e4b;
            --glass: rgba(19, 15, 44, 0.7);
            --glass-border: rgba(178, 236, 255, 0.42);
            --text-main: #f8fbff;
            --glow: rgba(140, 239, 255, 0.34);
            --hero-gold: #ffd56a;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 136, 183, 0.28), transparent 38%),
                linear-gradient(180deg, var(--sky-top) 0%, #25134d 35%, #1a3d57 60%, var(--field) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 214, 114, 0.18), transparent 18%),
                radial-gradient(circle at 80% 20%, rgba(140, 239, 255, 0.12), transparent 20%),
                radial-gradient(circle at 50% 82%, rgba(255, 91, 135, 0.12), transparent 22%);
        }
        body::after {
            background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.24;
            mix-blend-mode: soft-light;
        }
        canvas { display: block; touch-action: none; }

        #ui-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }
        .glass {
            background: linear-gradient(180deg, rgba(25, 19, 58, 0.78), rgba(12, 10, 32, 0.84));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            box-shadow: 0 8px 28px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(255, 214, 106, 0.12), transparent 30%),
                linear-gradient(180deg, rgba(8, 8, 20, 0.2), rgba(8, 8, 20, 0.82));
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .title {
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.6rem, 10vw, 5.4rem);
            letter-spacing: 0.08em;
            color: #fff6db;
            margin: 0;
            text-shadow: 0 0 14px rgba(255, 214, 106, 0.3), 0 6px 0 var(--theme-dark), 0 16px 30px rgba(0,0,0,0.45);
            animation: float 3s ease-in-out infinite;
        }
        .title-accent {
            display: inline-block;
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(12, 10, 32, 0.5);
            box-shadow: 0 0 20px rgba(140, 239, 255, 0.14);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .btn-main {
            margin-top: 28px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.12em;
            color: #fff;
            padding: 16px 36px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff7aa3, var(--theme));
            border: 3px solid rgba(255,255,255,0.92);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255,91,135,0.4), 0 0 20px rgba(140, 239, 255, 0.16);
            font-weight: 700;
            transition: transform 0.1s, filter 0.1s;
            animation: pulse 2s infinite;
        }
        .btn-main:active { transform: scale(0.95); filter: brightness(1.08); }
        .intro-copy {
            max-width: 340px;
            margin-top: 18px;
            line-height: 1.35;
            font-size: 0.98rem;
            font-weight: 600;
            color: rgba(248, 251, 255, 0.92);
            text-shadow: 0 2px 12px rgba(0,0,0,0.36);
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            top: 80px;
            width: clamp(82px, 18vw, 132px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid rgba(255,255,255,0.24);
            background: rgba(10, 8, 24, 0.55);
            box-shadow: 0 12px 28px rgba(0,0,0,0.26);
            opacity: 0;
            transform: translateY(-8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 35;
        }
        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.collect {
            top: 148px;
            right: 20px;
            width: clamp(70px, 16vw, 116px);
            border-radius: 20px;
        }

        /* HUD */
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud { padding: 16px; display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; align-items: flex-start; }
        .pill {
            padding: 8px 18px;
            border-radius: 999px;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 0.06em;
        }
        .hud-icon {
            display: inline-flex;
            width: 24px;
            height: 24px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(180deg, #ffe791, var(--hero-gold));
            color: #6b3900;
            box-shadow: 0 0 12px rgba(255, 214, 106, 0.3);
        }

        /* Controls */
        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        #controls-area { position: absolute; bottom: 20px; left: 0; width: 100%; height: 180px; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }

        /* Joystick */
        #joystick-zone { width: 140px; height: 140px; position: relative; pointer-events: auto; }
        #joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.05) 45%, rgba(8, 8, 24, 0.62) 100%);
            border: 3px solid rgba(178, 236, 255, 0.34);
            box-sizing: border-box;
            box-shadow: inset 0 0 30px rgba(140, 239, 255, 0.08), 0 10px 24px rgba(0,0,0,0.22);
        }
        #joystick-knob {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #fff6db, #ffb1cb 62%, #ff6c97 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 16px rgba(0,0,0,0.28), 0 0 12px rgba(255,255,255,0.18);
            pointer-events: none;
        }

        /* Action Button */
        #btn-action {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(180deg, #fff2b0, #ffd56a);
            border: 6px solid rgba(255,255,255,0.92);
            color: #7c3500;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 rgba(124,53,0,0.22), 0 0 22px rgba(255, 214, 106, 0.22);
            pointer-events: auto;
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
        }
        #btn-action:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(124,53,0,0.22), 0 0 18px rgba(255, 214, 106, 0.18); background: linear-gradient(180deg, #fff7cf, #ffd56a); }

        @media (max-width: 520px) {
            #hud { padding: 12px; }
            .pill { font-size: 0.82rem; padding: 7px 14px; }
            #btn-sound { width: 46px !important; height: 46px !important; font-size: 1.2rem !important; }
            #controls-area { padding: 0 18px; bottom: 14px; height: 164px; }

            .feedback-gif { top: 74px; right: 10px; width: 88px; }
            .feedback-gif.collect { top: 136px; right: 14px; width: 78px; }
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>

<script>
/**
 * LEGENDARY CASUAL ENGINE v3.0
 * Feature: Explicit Multi-touch Controls
 */
const CONFIG = {
    heroSpeed: 12,
    themeColor: '#ff0055',
    gameTitle: 'Bounce Parade'
};

/* --- 1. CONFIG PROTOCOL --- */
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 12, "min": 5, "max": 25 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff0055" },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "Bounce Parade" }
};
window.gameConfig = CONFIG;
window.updateGameConfig = (key, val) => {
    if(CONFIG[key] !== undefined) CONFIG[key] = val;
    if(key === 'themeColor') {
        document.documentElement.style.setProperty('--theme', val);
    }
    if(key === 'gameTitle') {
        document.getElementById('ui-title').innerText = val;
        document.title = val;
    }
};

/* --- 2. AUDIO SYSTEM --- */
class AudioController {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.muted = false;
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.bgm = document.getElementById('bgm_main');
        this.soundBtn = document.getElementById('btn-sound');
        
        this.soundBtn.onclick = (e) => {
            e.stopPropagation();
            this.toggleMute();
        };
    }

    ensureContext() {
        if(!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if(Ctx) this.ctx = new Ctx();
        }
        return this.ctx;
    }

    toggleMute() {
        this.muted = !this.muted;
        this.soundBtn.innerText = this.muted ? '🔇' : '🔊';
        if(this.bgm) {
            this.bgm.muted = this.muted;
            if(this.muted) {
                this.bgm.pause();
            } else if(this.unlocked) {
                this.startLoop();
            }
        }
        if(this.unlocked) this.play('sfx_ui', 1, 0.35, 80);
    }

    async unlock() {
        const ctx = this.ensureContext();
        if(ctx && ctx.state === 'suspended') {
            try { await ctx.resume(); } catch(e) {}
        }
        this.unlocked = true;
        this.startLoop();
        ['sfx_dash', 'sfx_hit', 'sfx_collect', 'sfx_start', 'sfx_ui'].forEach(id => this.load(id));
    }

    startLoop() {
        if(this.bgm && !this.muted) {
            this.bgm.volume = 0.2;
            this.bgm.play().catch(() => {});
        }
    }

    stopLoop() {
        if(this.bgm) {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }
    }

    async load(id) {
        const ctx = this.ensureContext();
        const el = document.getElementById(id);
        if(!ctx || !el || !el.src || this.buffers[id]) return;
        try {
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await ctx.decodeAudioData(buf.slice(0));
        } catch(e) {}
    }

    play(id, pitch=1, vol=1, cooldown=0) {
        if(this.muted || !this.unlocked) return;
        const now = performance.now();
        if(cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const ctx = this.ensureContext();
        if(ctx && this.buffers[id]) {
            const src = ctx.createBufferSource();
            src.buffer = this.buffers[id];
            src.playbackRate.value = pitch;
            const gain = ctx.createGain();
            gain.gain.value = vol;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
        }

        if(ctx) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g);
            g.connect(ctx.destination);
            osc.frequency.setValueAtTime(220 * pitch, ctx.currentTime);
            g.gain.setValueAtTime(Math.min(vol * 0.08, 0.12), ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.16);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        }
    }
}

/* --- 3. INPUT SYSTEM (Fixed Joystick + Button) --- */
class InputSystem {
    constructor(game) {
        this.game = game;
        this.vector = {x:0, y:0};
        this.keys = {};
        
        // Elements
        this.joyZone = document.getElementById('joystick-zone');
        this.joyKnob = document.getElementById('joystick-knob');
        this.btnAction = document.getElementById('btn-action');
        
        // State
        this.stickId = null;
        this.stickCenter = {x:0, y:0};
        
        this.setup();
    }

    setup() {
        // Keyboard
        window.addEventListener('keydown', e => {
            this.keys[e.key] = true;
            if(e.code === 'Space') this.game.dash();
        });
        window.addEventListener('keyup', e => this.keys[e.key] = false);

        // Joystick Logic
        const updateKnob = (x, y) => {
            const maxR = 40; // Max radius within 140px box
            let dx = x - this.stickCenter.x;
            let dy = y - this.stickCenter.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist > maxR) {
                dx = (dx/dist) * maxR;
                dy = (dy/dist) * maxR;
            }
            
            this.joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            this.vector = { x: dx/maxR, y: dy/maxR };
        };

        const resetKnob = () => {
            this.joyKnob.style.transform = `translate(-50%, -50%)`;
            this.vector = {x:0, y:0};
            this.stickId = null;
        };

        // Joystick Events
        this.joyZone.addEventListener('pointerdown', e => {
            e.preventDefault();
            if(this.stickId !== null) return;
            this.stickId = e.pointerId;
            const rect = this.joyZone.getBoundingClientRect();
            this.stickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateKnob(e.clientX, e.clientY);
            this.joyZone.setPointerCapture(e.pointerId);
        });

        this.joyZone.addEventListener('pointermove', e => {
            if(e.pointerId !== this.stickId) return;
            e.preventDefault();
            updateKnob(e.clientX, e.clientY);
        });

        const endStick = e => {
            if(e.pointerId === this.stickId) resetKnob();
        };
        this.joyZone.addEventListener('pointerup', endStick);
        this.joyZone.addEventListener('pointercancel', endStick);

        // Action Button
        this.btnAction.addEventListener('pointerdown', e => {
            e.preventDefault();
            this.game.dash();
            // Visual feedback handled by CSS :active
        });
    }

    getMovement() {
        let vx = 0, vy = 0;
        if(this.keys['w'] || this.keys['ArrowUp']) vy = -1;
        if(this.keys['s'] || this.keys['ArrowDown']) vy = 1;
        if(this.keys['a'] || this.keys['ArrowLeft']) vx = -1;
        if(this.keys['d'] || this.keys['ArrowRight']) vx = 1;

        if(vx !== 0 || vy !== 0) {
            const len = Math.sqrt(vx*vx + vy*vy);
            return { x: vx/len, y: vy/len };
        }
        
        return this.vector;
    }
}

/* --- 4. GAME ENGINE --- */
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', {alpha: false});
        this.audio = new AudioController();
        this.input = new InputSystem(this);
        
        this.hero = { x:0, y:0, vx:0, vy:0, scaleX:1, scaleY:1, angle: 0, bob: 0 };
        this.cam = { x:0, y:0 };
        this.entities = [];
        this.particles = [];
        this.score = 0;
        this.running = false;
        
        this.initWorld();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        document.getElementById('btn-start').onclick = () => this.start();
        this.feedbackTimers = { hit: 0, collect: 0 };
        this.lastHitAt = 0;
        this.lastScoreAt = 0;
        document.addEventListener('visibilitychange', () => {
            if(document.hidden) {
                this.audio.stopLoop();
            } else if(this.running && !this.audio.muted) {
                this.audio.startLoop();
            }
        });
        
        this.loop = this.loop.bind(this);
        this.lastTime = performance.now();
        requestAnimationFrame(this.loop);
    }

    initWorld() {
        // Create NPCs
        for(let i=0; i<50; i++) {
            this.entities.push({
                x: (Math.random()-0.5)*2500,
                y: (Math.random()-0.5)*2500,
                r: 15 + Math.random()*15,
                color: `hsl(${Math.random()*60 + 40}, 85%, 60%)`,
                vx: 0, vy: 0
            });
        }
    }

    async start() {
        if(this.running) return;
        this.running = true;
        await this.audio.unlock();
        this.audio.play('sfx_start', 1, 0.55, 50);
        document.getElementById('start-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('start-screen').style.display = 'none', 300);
    }

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    showGif(type) {
        const el = document.getElementById(type === 'hit' ? 'gif-hit' : 'gif-collect');
        if(!el) return;
        el.classList.add('active');
        this.feedbackTimers[type] = 0.95;
    }

    dash() {
        if(!this.running) return;
        
        // Dash juice
        const move = this.input.getMovement();
        const dx = (move.x === 0 && move.y === 0) ? 1 : move.x;
        const dy = (move.x === 0 && move.y === 0) ? 0 : move.y;
        
        // Normalize
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = dx/len;
        const ny = dy/len;

        // Apply force
        const force = 800;
        this.hero.vx += nx * force;
        this.hero.vy += ny * force;
        
        // Squash
        this.hero.scaleX = 1.5;
        this.hero.scaleY = 0.6;
        this.hero.angle = Math.atan2(ny, nx);
        
        // SFX
        this.audio.play('sfx_dash', 1.08, 0.55, 120);

        // Particles
        for(let i=0; i<10; i++) {
            this.particles.push({
                x: this.hero.x, y: this.hero.y,
                vx: -nx * Math.random() * 200 + (Math.random()-0.5)*100,
                vy: -ny * Math.random() * 200 + (Math.random()-0.5)*100,
                life: 0.5, size: 5 + Math.random()*5,
                color: '#fff'
            });
        }
    }

    update(dt) {
        if(!this.running) return;

        this.feedbackTimers.hit = Math.max(0, this.feedbackTimers.hit - dt);
        this.feedbackTimers.collect = Math.max(0, this.feedbackTimers.collect - dt);
        const hitGif = document.getElementById('gif-hit');
        const collectGif = document.getElementById('gif-collect');
        if(hitGif) hitGif.classList.toggle('active', this.feedbackTimers.hit > 0);
        if(collectGif) collectGif.classList.toggle('active', this.feedbackTimers.collect > 0);

        // Hero Movement
        const move = this.input.getMovement();
        const speed = CONFIG.heroSpeed * 60;
        
        this.hero.vx += move.x * speed * dt * 4;
        this.hero.vy += move.y * speed * dt * 4;
        
        // Friction
        this.hero.vx *= 0.92;
        this.hero.vy *= 0.92;
        
        const vel = Math.sqrt(this.hero.vx**2 + this.hero.vy**2);
        this.hero.x += this.hero.vx * dt;
        this.hero.y += this.hero.vy * dt;
        this.hero.bob += dt * (4 + vel * 0.01);

        // Recovery Juice
        this.hero.scaleX += (1 - this.hero.scaleX) * 10 * dt;
        this.hero.scaleY += (1 - this.hero.scaleY) * 10 * dt;
        if(Math.abs(this.hero.scaleX - 1) < 0.01) this.hero.angle = 0;

        // Dust
        if(vel > 100 && Math.random() < 0.3) {
            this.particles.push({
                x: this.hero.x, y: this.hero.y + 15,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                life: 0.8, size: Math.random()*6, color: 'rgba(255,255,255,0.6)'
            });
        }

        // Camera
        this.cam.x += (this.hero.x - this.width/2 - this.cam.x) * 4 * dt;
        this.cam.y += (this.hero.y - this.height/2 - this.cam.y) * 4 * dt;

        // Entities
        this.entities.forEach(e => {
            // Wander
            if(Math.random() < 0.02) {
                e.vx += (Math.random()-0.5)*20;
                e.vy += (Math.random()-0.5)*20;
            }
            e.x += e.vx * dt * 5;
            e.y += e.vy * dt * 5;
            e.vx *= 0.95; e.vy *= 0.95;

            // Collision
            const dx = e.x - this.hero.x;
            const dy = e.y - this.hero.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = e.r + 25;
            
            if(dist < minDist) {
                const ang = Math.atan2(dy, dx);
                const force = 300;
                e.vx += Math.cos(ang) * force;
                e.vy += Math.sin(ang) * force;
                this.hero.vx -= Math.cos(ang) * force * 0.8;
                this.hero.vy -= Math.sin(ang) * force * 0.8;

                const now = performance.now();
                if(now - this.lastHitAt > 140) {
                    this.lastHitAt = now;
                    this.audio.play('sfx_hit', 1 + Math.random()*0.18, 0.4, 90);
                    this.showGif('hit');
                }
                
                // Score
                if(vel > 200 && now - this.lastScoreAt > 180) {
                    this.lastScoreAt = now;
                    this.score++;
                    document.getElementById('score').innerText = this.score;
                    this.audio.play('sfx_collect', 1.04 + Math.random()*0.12, 0.48, 120);
                    this.showGif('collect');
                    // Hit particles
                    for(let k=0; k<5; k++) {
                        this.particles.push({
                            x: (e.x+this.hero.x)/2, y: (e.y+this.hero.y)/2,
                            vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
                            life: 0.4, size: 4, color: '#fff'
                        });
                    }
                }
            }
        });

        // Particles Update
        for(let i=this.particles.length-1; i>=0; i--) {
            let p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 1.5;
            if(p.life <= 0) this.particles.splice(i, 1);
        }
    }

    draw() {
        const cx = this.cam.x;
        const cy = this.cam.y;

        // Clear
        const skyGradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGradient.addColorStop(0, '#4b2d86');
        skyGradient.addColorStop(0.42, '#2f4d8d');
        skyGradient.addColorStop(1, '#1b6f62');
        this.ctx.fillStyle = skyGradient;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for(let i = 0; i < 18; i++) {
            const starX = (i * 137) % this.width;
            const starY = ((i * 97) % Math.max(this.height * 0.55, 1));
            this.ctx.beginPath();
            this.ctx.arc(starX, starY, (i % 3) + 1.5, 0, Math.PI * 2);
            this.ctx.fill();
        }

        // --- LAYER 1: Ground ---
        this.ctx.save();
        this.ctx.translate(-cx, -cy);
        
        const gridSize = 200;
        const startX = Math.floor(cx / gridSize) * gridSize;
        const startY = Math.floor(cy / gridSize) * gridSize;
        
        this.ctx.fillStyle = 'rgba(255,226,160,0.12)';
        for(let x = startX - gridSize; x < cx + this.width + gridSize; x += gridSize) {
            for(let y = startY - gridSize; y < cy + this.height + gridSize; y += gridSize) {
                if((x+y) % (gridSize*2) === 0) {
                    this.ctx.beginPath();
                    for(let i=0; i<6; i++) {
                        const a = (i/6)*Math.PI*2;
                        this.ctx.arc(x + Math.cos(a)*15, y + Math.sin(a)*15, 10, 0, Math.PI*2);
                    }
                    this.ctx.fill();
                } else {
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 6, 0, Math.PI*2);
                    this.ctx.fill();
                }
            }
        }

        // --- ENTITIES ---
        const drawList = [...this.entities, { ...this.hero, isHero: true }];
        drawList.sort((a,b) => a.y - b.y);

        drawList.forEach(e => {
            this.ctx.save();
            this.ctx.translate(e.x, e.y);
            
            // Shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
            this.ctx.beginPath();
            this.ctx.ellipse(0, 18, (e.r||25), (e.r||25)*0.4, 0, 0, Math.PI*2);
            this.ctx.fill();

            if(e.isHero) {
                this.ctx.rotate(e.angle);
                this.ctx.scale(e.scaleX, e.scaleY);
                const bob = Math.sin(this.hero.bob || 0) * 2.5;
                this.ctx.save();
                this.ctx.translate(0, bob);
                this.ctx.fillStyle = 'rgba(255, 214, 106, 0.26)';
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 34, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();

                const img = document.getElementById('asset_hero');
                this.ctx.drawImage(img, -28, -28, 56, 56);

                this.ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 31, 0, Math.PI * 2);
                this.ctx.stroke();

                this.ctx.fillStyle = '#fff3cf';
                this.ctx.beginPath();
                this.ctx.moveTo(18, -18);
                this.ctx.lineTo(24, -28);
                this.ctx.lineTo(30, -18);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.fillStyle = '#ff6c97';
                this.ctx.beginPath();
                this.ctx.arc(-18, -12, 5, 0, Math.PI * 2);
                this.ctx.arc(18, -12, 5, 0, Math.PI * 2);
                this.ctx.fill();
            } else {
                this.ctx.fillStyle = e.color;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, e.r, 0, Math.PI*2);
                this.ctx.fill();

                this.ctx.fillStyle = 'rgba(255,255,255,0.18)';
                this.ctx.beginPath();
                this.ctx.arc(-e.r * 0.25, -e.r * 0.3, e.r * 0.35, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.strokeStyle = '#fff4df';
                this.ctx.lineWidth = 4;
                this.ctx.stroke();

                this.ctx.strokeStyle = 'rgba(76, 33, 26, 0.7)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(0, 2, e.r * 0.4, 0.2, Math.PI - 0.2);
                this.ctx.stroke();

                this.ctx.fillStyle = '#2c2434';
                this.ctx.beginPath();
                this.ctx.arc(-6, -4, 3, 0, Math.PI*2);
                this.ctx.arc(6, -4, 3, 0, Math.PI*2);
                this.ctx.fill();
            }
            this.ctx.restore();
        });

        // Particles
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color || '#fff';
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;
        this.ctx.restore();

        // --- LAYER 2: Clouds ---
        this.ctx.save();
        const parallax = 0.6;
        const cloudOffX = -cx * parallax;
        const cloudOffY = -cy * parallax;
        
        this.ctx.fillStyle = 'rgba(255, 235, 195, 0.18)';
        const cSpace = 500;
        const cStartX = Math.floor(cloudOffX / cSpace) * cSpace;
        const cStartY = Math.floor(cloudOffY / cSpace) * cSpace;

        for(let x = cStartX; x < cloudOffX + this.width + cSpace; x += cSpace) {
            for(let y = cStartY; y < cloudOffY + this.height + cSpace; y += cSpace) {
                if((Math.abs(x*y) % 11) < 3) { 
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 80, 0, Math.PI*2);
                    this.ctx.arc(x+50, y+30, 60, 0, Math.PI*2);
                    this.ctx.fill();
                }
            }
        }
        this.ctx.restore();
    }

    loop(t) {
        const dt = Math.min((t - this.lastTime) / 1000, 0.1);
        this.lastTime = t;
        try {
            this.update(dt);
            this.draw();
        } catch(e) { console.error(e); }
        requestAnimationFrame(this.loop);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});
</script>
