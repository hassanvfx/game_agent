<script>
/**

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let audioCtx = null;
let audioUnlocked = false;
let reactionTimer = null;
let activeReactionKey = 'idle';

const AUDIO_LEVELS = {
  bgm_prep: 0.2,
  bgm_date: 0.2,
  sfx_ui_click: 0.34,
  sfx_equip: 0.38,
  sfx_success: 0.42,
  sfx_fail: 0.38,

};

const AUDIO_MAP = {

  bad: 'sfx_fail',
  start: 'sfx_start'
};

const REACTION_GIFS = {
  idle: {
    src: 'https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp',
    caption: 'Room energy'
  },
  success: {
    src: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
    caption: 'Chemistry boost!'
  },
  fail: {
    src: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
    caption: 'Awkward moment...'
  }
};

// Config
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
for (let k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;
window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

// State Machine
let gameState = 'INIT'; // INIT -> PREP -> DATE -> GAMEOVER
let lastTime = 0;
let pointer = { x: -1000, y: -1000, isDown: false };

// Game Data
const stateObj = {
  player: {
    x: 0, y: 0, scale: 1, bounce: 0,
    hair: 0, top: 0, bottom: 0, makeup: 0
  },
  bf: {

  },

const DRESSUP_DATA = {

    { id: 1, name: 'Long', color: '#e2f0cb', icon: '👱‍♀️' },

const DIALOGUE_TREE = [
  {
    text: "Sharp look. Ready to see how your vibe lands in tonight's chemistry test?",

    choices: [

    choices: [

      { text: "It's been a week. I'm just glad I made it.", score: 0, next: 3 }
    ]
  }
];

/**
 * Audio System (L1 & L2)
 */
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
}

function primeAudioElements() {
  Object.entries(AUDIO_LEVELS).forEach(([id, volume]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.volume = volume;
    el.muted = false;
    el.playsInline = true;
  });
}

function unlockAudio() {
  if (audioUnlocked) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
  primeAudioElements();
  playBgmForState();
}

function safePause(el) {
  if (!el) return;
  el.pause();
  try { el.currentTime = 0; } catch (_) {}
}

function safePlay(el) {
  if (!el) return;
  const maybePromise = el.play();
  if (maybePromise && typeof maybePromise.catch === 'function') {
    maybePromise.catch(() => {});
  }
}

function updateStatus(text, targetId) {
  const el = document.getElementById(targetId);
  if (el) el.textContent = text;
}

function setReaction(type = 'idle', persistMs = 1800) {
  activeReactionKey = type;
  const overlay = document.getElementById('reaction-overlay');
  const image = document.getElementById('reaction-gif');
  const caption = document.getElementById('reaction-caption');
  const reaction = REACTION_GIFS[type] || REACTION_GIFS.idle;
  if (!overlay || !image || !caption) return;

  image.src = reaction.src;
  caption.textContent = reaction.caption;
  overlay.classList.add('visible');

  if (reactionTimer) clearTimeout(reactionTimer);
  if (type !== 'idle') {
    reactionTimer = setTimeout(() => {
      activeReactionKey = 'idle';
      setReaction('idle', 0);
    }, persistMs);
  }
}

function playBgmForState() {
  if (!audioUnlocked) return;
  const prep = document.getElementById('bgm_prep');
  const date = document.getElementById('bgm_date');

  if (gameState === 'PREP') {
    safePause(date);
    safePlay(prep);
    updateStatus('Wardrobe playlist ready — tap to wake the room mix.', 'prep-status');
  } else if (gameState === 'DATE') {
    safePause(prep);
    safePlay(date);
    updateStatus('Chemistry in session — follow the vibe.', 'date-status');
  } else {
    safePause(prep);
    safePause(date);
  }
}

function playSfx(type) {
  if (!audioUnlocked) return;
  const mappedId = AUDIO_MAP[type];
  const el = mappedId ? document.getElementById(mappedId) : null;
  if (!el) return;
  try { el.currentTime = 0; } catch (_) {}
  safePlay(el);
}

function vibrate(style = 'light') {
  window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
    params: { style }
  });
}

/**
 * Core Lifecycle & Resize
 */
const ro = new ResizeObserver(entries => {
  for (let entry of entries) {
    const cr = entry.contentRect;
    cw = cr.width;
    ch = cr.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
      initGame();
    } else {
      repositionEntities();
    }
  }
});

function initGame() {
  initialized = true;
  repositionEntities();
  setState('PREP');
  requestAnimationFrame(loop);
}

function repositionEntities() {
  stateObj.player.y = ch * 0.6;
  stateObj.bf.y = ch * 0.55;
  
  if (gameState === 'PREP') {
    stateObj.player.x = cw * 0.5;
    stateObj.player.scale = Math.min(cw, ch) * 0.003;
  } else if (gameState === 'DATE') {
    stateObj.player.x = cw * 0.3;
    stateObj.player.scale = Math.min(cw, ch) * 0.002;
    stateObj.bf.x = cw * 0.7;
    stateObj.bf.scale = Math.min(cw, ch) * 0.0022;
  }
}

function restartGame() {
  stateObj.romanceScore = 0;
  stateObj.dialogueNode = 0;
  stateObj.bf.opacity = 0;
  setReaction('idle', 0);
  repositionEntities();
  setState('PREP');
}

/**
 * State Management & UI Single Driver
 */
function setState(newState) {
  gameState = newState;
  
  document.getElementById('ui-prep').classList.add('hidden');
  document.getElementById('ui-date').classList.add('hidden');
  document.getElementById('ui-gameover').classList.add('hidden');
  
  if (gameState === 'PREP') {
    document.getElementById('ui-prep').classList.remove('hidden');
    buildPrepUI();
    repositionEntities();
    setReaction('idle', 0);
  } else if (gameState === 'DATE') {
    document.getElementById('ui-date').classList.remove('hidden');
    repositionEntities();
    showDialogue();
    setReaction('idle', 0);
  } else if (gameState === 'GAMEOVER') {
    document.getElementById('ui-gameover').classList.remove('hidden');
    showResult();
  }
  
  playBgmForState();
}

/**
 * UI Builders
 */
function buildPrepUI() {
  const container = document.getElementById('item-container');
  container.innerHTML = '';
  const items = DRESSUP_DATA[stateObj.activeTab];
  
  items.forEach((item, idx) => {
    const isSelected = stateObj.player[stateObj.activeTab] === idx;
    const btn = document.createElement('button');
    btn.className = `btn-choice flex flex-col items-center justify-center min-w-[80px] h-[80px] rounded-2xl flex-shrink-0 ${isSelected ? 'selected' : ''}`;
    btn.setAttribute('data-action', 'equip');
    btn.setAttribute('data-idx', idx);
    btn.innerHTML = `<span class="text-3xl mb-1">${item.icon}</span><span class="text-xs font-bold">${item.name}</span>`;
    container.appendChild(btn);
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-val') === stateObj.activeTab);
  });
}

function showDialogue() {
  const node = DIALOGUE_TREE[stateObj.dialogueNode];
  if (!node) {
    setState('GAMEOVER');
    return;
  }
  
  document.getElementById('dialogue-text').innerText = node.text;
  const container = document.getElementById('choice-container');
  container.innerHTML = '';
  
  node.choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice py-3 px-4 rounded-xl text-left font-semibold shadow-sm';
    btn.setAttribute('data-action', 'choice');
    btn.setAttribute('data-idx', idx);
    btn.innerText = choice.text;
    container.appendChild(btn);
  });
}

function showResult() {
  const title = document.getElementById('result-title');
  const desc = document.getElementById('result-desc');
  if (stateObj.romanceScore >= 3) {
    title.innerText = "Perfect Chemistry! ♥";
    title.className = "title-font text-3xl font-bold text-pink-500 mb-2";
    desc.innerText = "Every choice landed. The night clicked from first impression to final spark.";
    spawnParticles(cw/2, ch/2, 50, '#ff8da1');
    setReaction('success', 2800);
  } else if (stateObj.romanceScore > 0) {
    title.innerText = "Good Energy!";
    title.className = "title-font text-3xl font-bold text-blue-500 mb-2";
    desc.innerText = "The connection built steadily. Not flawless, but the spark is real.";
    setReaction('success', 2400);
  } else {
    title.innerText = "Missed Signal...";
    title.className = "title-font text-3xl font-bold text-gray-500 mb-2";
    desc.innerText = "The vibe never fully synced. Reset the look and try a different read next round.";
    setReaction('fail', 2600);
  }
}

/**
 * Input Routing (Single Entry)
 */
function handleGlobalInput(e) {
  unlockAudio();
  
  // Handle UI clicks
  let target = e.target;
  if (e.type === 'click' || e.type === 'pointerdown') {
    const actionBtn = target.closest('[data-action]');
    if (actionBtn) {
      const action = actionBtn.getAttribute('data-action');
      
      if (action === 'tab') {
        stateObj.activeTab = actionBtn.getAttribute('data-val');
        playSfx('click');
        vibrate('light');
        updateStatus('Switching racks — mix and match the mood.', 'prep-status');
        buildPrepUI();
      } else if (action === 'equip') {
        const idx = parseInt(actionBtn.getAttribute('data-idx'));
        stateObj.player[stateObj.activeTab] = idx;
        stateObj.player.bounce = 1;
        playSfx('equip');
        vibrate('light');
        updateStatus('Look locked — the chemistry meter likes confidence.', 'prep-status');
        spawnParticles(stateObj.player.x, stateObj.player.y - 100, 10, window.gameConfig.accentColor);
        setReaction('success', 1200);
        buildPrepUI();
      } else if (action === 'start-date') {
        playSfx('start');
        vibrate('medium');
        setState('DATE');
      } else if (action === 'choice') {
        const idx = parseInt(actionBtn.getAttribute('data-idx'));
        const node = DIALOGUE_TREE[stateObj.dialogueNode];
        const choice = node.choices[idx];
        stateObj.romanceScore += choice.score;
        
        if (choice.score > 0) {
          playSfx('chime'); vibrate('medium');
          updateStatus('That answer landed — keep the warmth going.', 'date-status');
          spawnParticles(stateObj.bf.x, stateObj.bf.y - 150, 20, '#ff8da1');
          setReaction('success', 1800);
        } else {
          playSfx('bad'); vibrate('light');
          updateStatus('A little awkward — recover with the next choice.', 'date-status');
          setReaction('fail', 1800);
        }
        
        stateObj.dialogueNode = choice.next;
        stateObj.player.bounce = 1;
        stateObj.bf.bounce = 1;
        showDialogue();
      } else if (action === 'restart') {
        playSfx('click');
        vibrate('light');
        restartGame();
      }
      return;
    }
  }

  // Pointer tracking for parallax
  if (e.type === 'pointerdown' || e.type === 'pointermove') {
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.isDown = e.type === 'pointerdown' ? true : pointer.isDown;
  }
  if (e.type === 'pointerup' || e.type === 'pointercancel') {
    pointer.isDown = false;
  }
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
window.addEventListener('click', handleGlobalInput); // Catch stray UI clicks

/**
 * Rendering & Logic
 */
function spawnParticles(x, y, count, color) {
  for(let i=0; i<count; i++) {
    stateObj.particles.push({
      x: x + (Math.random()-0.5)*50,
      y: y + (Math.random()-0.5)*50,
      vx: (Math.random()-0.5)*200,
      vy: (Math.random()-1)*200,
      life: 1,
      color: color
    });
  }
}

function updateLogic(dt) {
  // Bounces
  stateObj.player.bounce = Math.max(0, stateObj.player.bounce - dt * 5);
  stateObj.bf.bounce = Math.max(0, stateObj.bf.bounce - dt * 5);
  
  // BF fade in
  if (gameState === 'DATE') {
    stateObj.bf.opacity = Math.min(1, stateObj.bf.opacity + dt);
  }

  // Particles
  for (let i = stateObj.particles.length - 1; i >= 0; i--) {
    let p = stateObj.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt; // gravity
    p.life -= dt;
    if (p.life <= 0) stateObj.particles.splice(i, 1);
  }
}

function drawStylizedCharacter(ctx, x, y, scale, bounce, isPlayer) {
  ctx.save();
  const glamourPulse = 0.5 + Math.sin(performance.now() * 0.004 + (isPlayer ? 0 : 1.8)) * 0.5;
  
  // Parallax / Breathing offset
  const time = performance.now() * 0.002;
  const breathY = Math.sin(time + (isPlayer?0:Math.PI)) * 5;
  const pX = (pointer.x - cw/2) * (isPlayer ? 0.02 : 0.03);
  
  ctx.translate(x + pX, y + breathY);
  
  // Bounce scale
  const bScale = 1 + Math.sin(bounce * Math.PI) * 0.1;
  ctx.scale(scale * bScale, scale * (2 - bScale)); // Squash & stretch

  // Shadow (faux 3D)
  ctx.fillStyle = 'rgba(26,7,40,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 60, 15, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = `rgba(255, 239, 177, ${0.1 + glamourPulse * 0.12})`;
  ctx.beginPath();
  ctx.ellipse(0, -72, 78, 120, 0, 0, Math.PI * 2);
  ctx.fill();

  if (isPlayer) {
    const hair = DRESSUP_DATA.hair[stateObj.player.hair];
    const top = DRESSUP_DATA.top[stateObj.player.top];
    const bottom = DRESSUP_DATA.bottom[stateObj.player.bottom];
    const makeup = DRESSUP_DATA.makeup[stateObj.player.makeup];

    // Back Hair
    ctx.fillStyle = hair.color;
    if (stateObj.player.hair === 1) { // Long
      ctx.beginPath(); ctx.roundRect(-40, -120, 80, 180, 20); ctx.fill();
    } else if (stateObj.player.hair === 2) { // Pony
      ctx.beginPath(); ctx.ellipse(-40, -100, 30, 60, Math.PI/4, 0, Math.PI*2); ctx.fill();
    }

    // Body Base (Legs)
    ctx.fillStyle = '#ffe0d2'; // Skin
    ctx.beginPath(); ctx.roundRect(-20, -40, 15, 60, 10); ctx.fill(); // L Leg
    ctx.beginPath(); ctx.roundRect(5, -40, 15, 60, 10); ctx.fill(); // R Leg

    // Bottoms
    if (top.type !== 'dress') {
      ctx.fillStyle = bottom.color;
      if (stateObj.player.bottom === 0) { // Jeans
        ctx.beginPath(); ctx.roundRect(-22, -40, 19, 50, 5); ctx.fill();
        ctx.beginPath(); ctx.roundRect(3, -40, 19, 50, 5); ctx.fill();
      } else if (stateObj.player.bottom === 1) { // Skirt
        ctx.beginPath(); ctx.moveTo(-35, -40); ctx.lineTo(35, -40); ctx.lineTo(45, 0); ctx.lineTo(-45, 0); ctx.fill();
      } else { // Shorts
        ctx.beginPath(); ctx.roundRect(-22, -40, 19, 20, 5); ctx.fill();
        ctx.beginPath(); ctx.roundRect(3, -40, 19, 20, 5); ctx.fill();
      }
    }

    // Torso / Top
    ctx.fillStyle = top.color;
    if (top.type === 'dress') {
      ctx.beginPath(); ctx.moveTo(-25, -100); ctx.lineTo(25, -100); ctx.lineTo(40, -10); ctx.lineTo(-40, -10); ctx.fill();
    } else {
      ctx.beginPath(); ctx.roundRect(-25, -100, 50, 65, 15); ctx.fill();
    }

    // Arms
    ctx.fillStyle = '#ffe0d2';
    ctx.beginPath(); ctx.roundRect(-40, -95, 15, 50, 10); ctx.fill();
    ctx.beginPath(); ctx.roundRect(25, -95, 15, 50, 10); ctx.fill();

    // Head
    ctx.fillStyle = '#ffe0d2';
    ctx.beginPath(); ctx.circle(0, -130, 35); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -130, 39, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();

    // Makeup (Blush & Eyes)
    ctx.fillStyle = `rgba(255, 100, 100, ${makeup.blush})`;
    ctx.beginPath(); ctx.circle(-15, -120, 8); ctx.circle(15, -120, 8); ctx.fill();
    
    ctx.fillStyle = '#333';
    if (makeup.eye === 'round') {
      ctx.beginPath(); ctx.circle(-12, -135, 4); ctx.circle(12, -135, 4); ctx.fill();
    } else if (makeup.eye === 'sharp') {
      ctx.beginPath(); ctx.ellipse(-12, -135, 5, 2, 0, 0, Math.PI*2); ctx.ellipse(12, -135, 5, 2, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.circle(-12, -135, 3); ctx.circle(12, -135, 3); ctx.fill();
    }

    // Front Hair
    ctx.fillStyle = hair.color;
    ctx.beginPath(); ctx.arc(0, -140, 38, Math.PI, 0); ctx.fill(); // Bangs
    if (stateObj.player.hair === 0) { // Bob
      ctx.beginPath(); ctx.roundRect(-42, -140, 20, 50, 10); ctx.roundRect(22, -140, 20, 50, 10); ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.beginPath(); ctx.ellipse(-10, -149, 12, 6, -0.4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#ff6fa8';
    ctx.beginPath(); ctx.arc(0, -112, 8, 0, Math.PI); ctx.fill();

  } else {
    // BF Rendering (Static stylish look)
    ctx.globalAlpha = stateObj.bf.opacity;
    
    // Legs
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.roundRect(-20, -40, 16, 65, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(4, -40, 16, 65, 5); ctx.fill();
    
    // Torso (Jacket)
    ctx.fillStyle = '#34495e';
    ctx.beginPath(); ctx.roundRect(-30, -110, 60, 75, 10); ctx.fill();
    
    // Shirt inner
    ctx.fillStyle = '#ecf0f1';
    ctx.beginPath(); ctx.moveTo(-10, -110); ctx.lineTo(10, -110); ctx.lineTo(0, -60); ctx.fill();

    // Head
    ctx.fillStyle = '#f1c27d';
    ctx.beginPath(); ctx.circle(0, -140, 35); ctx.fill();
    
    // Hair
    ctx.fillStyle = '#4a2311';
    ctx.beginPath(); ctx.arc(0, -145, 38, Math.PI*0.8, Math.PI*2.2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-35, -145); ctx.lineTo(0, -170); ctx.lineTo(35, -145); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(10, -155, 11, 5, 0.1, 0, Math.PI * 2); ctx.fill();

    // Eyes
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.circle(-12, -145, 3); ctx.circle(12, -145, 3); ctx.fill();
    
    // Smile
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -130, 10, 0, Math.PI); ctx.stroke();

    ctx.globalAlpha = 1.0;
  }

  ctx.restore();
}

// Helper for circles
CanvasRenderingContext2D.prototype.circle = function(x, y, r) {
  this.moveTo(x + r, y);
  this.arc(x, y, Math.max(0, r), 0, 2 * Math.PI);
}

function drawBackground(ctx) {
  const c1 = window.gameConfig.themeColor1;
  const c2 = window.gameConfig.themeColor2;
  const grad = ctx.createLinearGradient(0, 0, 0, ch);
  grad.addColorStop(0, c1);
  grad.addColorStop(0.55, '#f7add7');
  grad.addColorStop(1, c2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, cw, ch);

  const glow = ctx.createRadialGradient(cw * 0.5, ch * 0.22, 20, cw * 0.5, ch * 0.22, ch * 0.72);
  glow.addColorStop(0, 'rgba(255, 252, 224, 0.35)');
  glow.addColorStop(1, 'rgba(255, 252, 224, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, cw, ch);

  const t = performance.now() * 0.001;

  // Decorative floating lights
  for (let i = 0; i < 5; i++) {
    const x = (Math.sin(t * 0.5 + i) * 0.5 + 0.5) * cw;
    const y = (Math.cos(t * 0.3 + i) * 0.5 + 0.5) * ch;
    const pX = (pointer.x - cw / 2) * 0.05 * (i % 2 === 0 ? 1 : -1);
    const orb = ctx.createRadialGradient(x + pX, y, 0, x + pX, y, 30 + i * 12);
    orb.addColorStop(0, 'rgba(255,255,255,0.28)');
    orb.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = orb;
    ctx.beginPath(); ctx.circle(x + pX, y, 30 + i * 12); ctx.fill();
  }

  // Stage floor
  const floorGrad = ctx.createLinearGradient(0, ch * 0.68, 0, ch);
  floorGrad.addColorStop(0, 'rgba(152, 73, 143, 0)');
  floorGrad.addColorStop(1, 'rgba(83, 25, 94, 0.34)');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, ch * 0.68, cw, ch * 0.32);

  ctx.strokeStyle = 'rgba(255, 240, 186, 0.22)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const y = ch * (0.72 + i * 0.06);
    ctx.beginPath();
    ctx.moveTo(cw * 0.18, y);
    ctx.quadraticCurveTo(cw * 0.5, y + 10, cw * 0.82, y);
    ctx.stroke();
  }
}

function render() {
  drawBackground(ctx);

  if (gameState === 'PREP') {
    drawStylizedCharacter(ctx, stateObj.player.x, stateObj.player.y, stateObj.player.scale, stateObj.player.bounce, true);
  } else if (gameState === 'DATE' || gameState === 'GAMEOVER') {
    drawStylizedCharacter(ctx, stateObj.player.x, stateObj.player.y, stateObj.player.scale, stateObj.player.bounce, true);
    drawStylizedCharacter(ctx, stateObj.bf.x, stateObj.bf.y, stateObj.bf.scale, stateObj.bf.bounce, false);
  }

  // Particles
  stateObj.particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath(); ctx.circle(p.x, p.y, 5); ctx.fill();
  });
  ctx.globalAlpha = 1.0;
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  dt = Math.min(dt, 0.05);

  try {
    updateLogic(dt);
    render();
  } catch (e) {
    console.error("Loop error:", e); // L0 Resilience
  }

  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    safePause(document.getElementById('bgm_prep'));
    safePause(document.getElementById('bgm_date'));
  } else {
    playBgmForState();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  primeAudioElements();
  setReaction('idle', 0);
  ro.observe(canvas);
});

</script>
