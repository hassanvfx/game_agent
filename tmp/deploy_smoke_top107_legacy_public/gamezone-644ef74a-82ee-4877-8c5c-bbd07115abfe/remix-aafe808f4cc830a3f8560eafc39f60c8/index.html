<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Card Kicks: Keeper Clash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap');

        :root {
            color-scheme: dark;
            --bg-top: #08111f;
            --bg-bottom: #123a63;
            --panel-bg: linear-gradient(180deg, rgba(9, 20, 40, 0.82), rgba(17, 46, 83, 0.72));
            --panel-border: rgba(132, 235, 255, 0.42);
            --panel-highlight: rgba(255, 255, 255, 0.18);
            --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.42);
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.28);
            --text-main: #f5fbff;
            --text-soft: rgba(235, 247, 255, 0.9);
            --gold: #ffd76a;
            --amber: #ff9d3a;
            --red: #ff6565;
            --green: #41d48f;
            --cyan: #84ebff;
            --cyan-strong: #36b9ff;
            --navy: #10213a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(134, 238, 255, 0.15), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: saturate(1.05) contrast(1.02);
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .relative {
            position: relative;
        }

        .absolute {
            position: absolute;
        }

        .inset-0 {
            inset: 0;
        }

        .top-0 {
            top: 0;
        }

        .w-full {
            width: 100%;
        }

        .h-full {
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            pointer-events: auto;
            position: relative;
            width: min(92vw, 420px);
            padding: 2rem;
            text-align: center;
            border-radius: 28px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid var(--panel-highlight);
            pointer-events: none;
        }

        .panel::after {
            content: "⚽";
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            font-size: 1.2rem;
            opacity: 0.7;
            pointer-events: none;
        }

        .panel:hover {
            transform: translateY(-2px) scale(1.01);
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-lg);
        }

        .game-title,
        .screen-title,
        .hud-label,
        .action-btn {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .game-title {
            margin: 0 0 0.35rem;
            color: var(--gold);
            font-size: clamp(2.5rem, 10vw, 3.4rem);
            line-height: 1;
            text-shadow: 0 0 24px rgba(255, 215, 106, 0.3), 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .subtitle {
            margin: 0 0 1.4rem;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--cyan);
        }

        .instruction-box {
            margin-bottom: 1.5rem;
            padding: 1rem 1rem 0.9rem;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(4, 15, 28, 0.62), rgba(6, 24, 48, 0.44));
            text-align: left;
            color: var(--text-soft);
            font-size: 1rem;
            line-height: 1.35;
            border: 1px solid rgba(132, 235, 255, 0.16);
        }

        .instruction-box p {
            margin: 0.35rem 0;
        }

        .accent-gold {
            color: #fde047;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3.25rem;
            padding: 0.95rem 2.25rem;
            border-radius: 999px;
            color: #fff;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .action-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.32);
            filter: brightness(1.05);
        }

        .action-btn--start {
            background: linear-gradient(90deg, #2bd4ff, #1f7cff 58%, #ffd76a);
        }

        .action-btn--restart {
            background: linear-gradient(90deg, #ffffff, #d9fbff);
            color: #0f3a59;
        }

        .overlay-card {
            z-index: 50;
        }

        .screen-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2.1rem, 8vw, 3.2rem);
            color: #ff8a7b;
            text-shadow: 0 0 22px rgba(255, 101, 101, 0.32), 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .final-line {
            margin: 0 0 1.4rem;
            font-size: 1.7rem;
            font-weight: 700;
            color: #fff;
        }

        .final-score {
            color: var(--gold);
            font-size: 2.5rem;
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            pointer-events: none;
        }

        .hud-stack,
        .message-box {
            background: linear-gradient(180deg, rgba(10, 22, 42, 0.82), rgba(16, 33, 58, 0.66));
            border: 1px solid rgba(132, 235, 255, 0.28);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.35rem;
            padding: 0.55rem 0.8rem;
            border-radius: 18px;
        }

        .hud-label {
            font-size: clamp(0.95rem, 3.7vw, 1.35rem);
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
        }

        .hud-score {
            color: var(--gold);
        }

        .hud-lives {
            color: #f87171;
        }

        .message-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.5rem;
            max-width: min(48vw, 240px);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
        }

        #reaction-strip {
            position: absolute;
            right: 0.85rem;
            bottom: max(0.85rem, env(safe-area-inset-bottom));
            z-index: 35;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            pointer-events: none;
            align-items: flex-end;
        }

        .reaction-gif {
            width: clamp(72px, 18vw, 118px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(4, 12, 28, 0.45);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .reaction-gif.is-visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .text-shadow {
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 520px) {
            .panel {
                padding: 1.5rem 1.1rem;
                border-radius: 22px;
            }

            .instruction-box {
                font-size: 0.95rem;
            }

            .action-btn {
                width: 100%;
            }

            .final-line {
                font-size: 1.4rem;
            }

            .message-box {
                max-width: 48vw;
                font-size: 0.85rem;
            }

            #reaction-strip {
                right: 0.5rem;
                bottom: max(0.5rem, env(safe-area-inset-bottom));
            }

            .reaction-gif {
                width: clamp(62px, 21vw, 86px);
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage4] repaired-font: title/hud -> Audiowide, ui/body -> Exo 2 via catalogs/fonts.json -->
            <!-- [agent-note][stage3] resolved-gif: goal/fail feedback overlays use approved catalog gif webp refs -->
            <div id="start-screen" class="panel overlay-card">
                <h1 class="game-title">Card Kicks</h1>
                <p class="subtitle">Neon Keeper Clash</p>
                <div class="instruction-box">
                    <p>⚽ Choose a shot card to strike on goal.</p>
                    <p>🔥 <span class="accent-gold">Gold cards</span> trigger wild match moments.</p>
                    <p>🥅 Beat the keeper before your chances run out.</p>
                </div>
                <button id="start-btn" class="action-btn action-btn--start">Start Match</button>
            </div>

            <div id="game-over-screen" class="hidden panel overlay-card">
                <h2 class="screen-title">Full Time</h2>
                <div class="final-line">Goals Landed: <span id="finalScore" class="final-score">0</span></div>
                <button id="restart-btn" class="action-btn action-btn--restart">Play Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-stack">
                    <div class="hud-label">Goals: <span id="score" class="hud-score">0</span></div>
                    <div class="hud-label">Chances: <span id="lives" class="hud-lives">❤❤❤</span></div>
                </div>
                <div id="message-box" class="message-box hidden"></div>
            </div>

            <div id="reaction-strip" class="hidden" aria-live="polite">
                <img id="goal-gif" class="reaction-gif hidden" alt="Goal celebration reaction">
                <img id="miss-gif" class="reaction-gif hidden" alt="Keeper save reaction">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                select: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                shot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3",
                goal: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                miss: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                heal: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                goal: "https://i.giphy.com/kyLtgO9r5ZUaAHWgTH.webp",
                miss: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxVolumes = {
                    start: 0.65,
                    select: 0.5,
                    shot: 0.55,
                    goal: 0.72,
                    miss: 0.62,
                    heal: 0.7,
                    gameOver: 0.8
                };
                this.cooldowns = {
                    select: 90,
                    shot: 120,
                    goal: 180,
                    miss: 180,
                    heal: 180,
                    start: 220,
                    gameOver: 250
                };
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }
            unlock() {
                this.ready = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach((sound) => sound.load());
                } catch (_) {}
            }
            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = this.cooldowns[key] ?? 100;
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.65;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        const goalGif = document.getElementById('goal-gif');
        const missGif = document.getElementById('miss-gif');
        const reactionStrip = document.getElementById('reaction-strip');
        goalGif.src = ASSETS.gifs.goal;
        missGif.src = ASSETS.gifs.miss;
        let reactionTimer = null;

        function triggerReaction(type) {
            const gif = type === 'goal' ? goalGif : missGif;
            if (!gif) return;
            reactionStrip.classList.remove('hidden');
            gif.classList.remove('hidden');
            requestAnimationFrame(() => gif.classList.add('is-visible'));
            clearTimeout(reactionTimer);
            reactionTimer = setTimeout(() => {
                gif.classList.remove('is-visible');
                setTimeout(() => {
                    gif.classList.add('hidden');
                    if (!goalGif.classList.contains('is-visible') && !missGif.classList.contains('is-visible')) {
                        reactionStrip.classList.add('hidden');
                    }
                }, 180);
            }, 1400);
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let turnPhase = 'input';

        // Entities
        let cards = [];
        let particles = [];
        let goalkeeper = { x: 0, y: 0, width: 60, height: 60, targetX: 0, speed: 0 };
        let ball = { x: 0, y: 0, radius: 15, vx: 0, vy: 0, state: 'idle' };

        // Parallax Clouds
        let clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * 1000,
                y: Math.random() * 200,
                size: 30 + Math.random() * 50,
                speed: 0.2 + Math.random() * 0.5
            });
        }

        // Card Types
        const CARD_TYPES = [
            { name: "Power Kick", type: "normal", valueRange: [5, 9], color: "#ef4444" },
            { name: "Curve Ball", type: "normal", valueRange: [4, 8], color: "#3b82f6" },
            { name: "Chip Shot", type: "normal", valueRange: [3, 7], color: "#10b981" },
            { name: "FIREBALL", type: "special", effect: "autogoal", color: "#f59e0b" },
            { name: "LUCKY 7", type: "special", effect: "heal", color: "#8b5cf6" },
            { name: "SLIP", type: "special", effect: "fail", color: "#6b7280" }
        ];

        /** 4. RESIZE & UTILS */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            resetCardsPosition();
        }
        window.addEventListener('resize', resize);

        function showMessage(text, color = 'white') {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            msgBox.style.color = color;
            msgBox.classList.remove('hidden');
            setTimeout(() => msgBox.classList.add('hidden'), 2000);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            lives = 3;
            updateHUD();
            dealCards();
            resetBall();
            goalkeeper.x = width / 2;
            goalkeeper.y = height * 0.25;
            turnPhase = 'input';
            particles = [];
        }

        function dealCards() {
            cards = [];
            const cardWidth = Math.min(width * 0.25, 120);
            const cardHeight = cardWidth * 1.4;
            const startX = (width - (3 * cardWidth + 40)) / 2;

            for (let i = 0; i < 3; i++) {
                const rand = Math.random();
                let template;
                if (rand < 0.15) template = CARD_TYPES.find(c => c.type === 'special');
                else template = CARD_TYPES[Math.floor(Math.random() * 3)];

                if (!template) template = CARD_TYPES[0];

                let value = 0;
                if (template.type === 'normal') {
                    value = Math.floor(Math.random() * (template.valueRange[1] - template.valueRange[0] + 1)) + template.valueRange[0];
                }

                cards.push({
                    ...template,
                    value,
                    x: startX + i * (cardWidth + 20),
                    y: height - cardHeight - 20,
                    w: cardWidth,
                    h: cardHeight,
                    targetY: height - cardHeight - 20,
                    isHovered: false,
                    selected: false
                });
            }
        }

        function resetCardsPosition() {
            const cardWidth = Math.min(width * 0.25, 120);
            const cardHeight = cardWidth * 1.4;
            const startX = (width - (cards.length * cardWidth + (cards.length - 1) * 20)) / 2;
            cards.forEach((c, i) => {
                c.w = cardWidth;
                c.h = cardHeight;
                c.x = startX + i * (cardWidth + 20);
                c.y = height - cardHeight - 20;
                c.targetY = c.y;
            });
        }

        function resetBall() {
            ball.x = width / 2;
            ball.y = height * 0.8;
            ball.radius = 15;
            ball.vx = 0;
            ball.vy = 0;
            ball.state = 'idle';
        }

        function playCard(cardIndex) {
            if (turnPhase !== 'input') return;

            const card = cards[cardIndex];
            audio.playSFX('select');

            turnPhase = 'animation';
            cards.splice(cardIndex, 1);

            let outcome = 'pending';
            let defense = Math.floor(Math.random() * 8) + 2;

            if (card.type === 'special') {
                if (card.effect === 'autogoal') { outcome = 'goal'; defense = 0; }
                else if (card.effect === 'fail') { outcome = 'miss'; defense = 99; }
                else if (card.effect === 'heal') {
                    lives = Math.min(lives + 1, 5);
                    outcome = 'goal';
                    showMessage("EXTRA CHANCE!", "#4ade80");
                    audio.playSFX('heal');
                }
            } else {
                if (card.value > defense) outcome = 'goal';
                else if (card.value === defense) outcome = Math.random() > 0.5 ? 'goal' : 'miss';
                else outcome = 'miss';
            }

            ball.state = 'shooting';
            const targetX = (width / 2) + (Math.random() - 0.5) * 200;
            const targetY = height * 0.22;

            const dx = targetX - ball.x;
            const dy = targetY - ball.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const speed = 25;

            ball.vx = (dx / dist) * speed;
            ball.vy = (dy / dist) * speed;
            audio.playSFX('shot');

            goalkeeper.targetX = outcome === 'goal' ? (targetX > width / 2 ? targetX - 60 : targetX + 60) : targetX;

            setTimeout(() => {
                resolveRound(outcome, defense);
            }, 600);
        }

        function resolveRound(outcome, defenseVal) {
            ball.vx = 0;
            ball.vy = 0;

            if (outcome === 'goal') {
                score++;
                audio.playSFX('goal');
                showMessage(`GOAL! Keeper ${defenseVal}`, "#fbbf24");
                createParticles(ball.x, ball.y, '#fbbf24');
                triggerReaction('goal');
                ball.state = 'goal';
            } else {
                lives--;
                audio.playSFX('miss');
                showMessage(`SAVED! Keeper ${defenseVal}`, "#ef4444");
                createParticles(ball.x, ball.y, '#ef4444');
                triggerReaction('miss');
                ball.state = 'missed';
            }

            updateHUD();

            if (lives <= 0) {
                setTimeout(gameOver, 1000);
            } else {
                setTimeout(() => {
                    resetBall();
                    dealCards();
                    turnPhase = 'input';
                }, 1500);
            }
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤";
            document.getElementById('lives').innerText = hearts;
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver');
            triggerReaction('miss');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. RENDER LOOP */
        function drawField() {
            const stripeHeight = height / 10;
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#1faa63' : '#169552';
                ctx.fillRect(0, i * stripeHeight, width, stripeHeight);
            }

            const skyGlow = ctx.createLinearGradient(0, 0, 0, height * 0.35);
            skyGlow.addColorStop(0, 'rgba(25, 112, 193, 0.42)');
            skyGlow.addColorStop(1, 'rgba(25, 112, 193, 0)');
            ctx.fillStyle = skyGlow;
            ctx.fillRect(0, 0, width, height * 0.35);

            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            for (let i = 1; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * stripeHeight);
                ctx.lineTo(width, i * stripeHeight);
                ctx.stroke();
            }

            ctx.fillStyle = "rgba(6, 28, 52, 0.35)";
            ctx.fillRect(width / 2 - 150, height * 0.15, 300, height * 0.1);
            ctx.strokeStyle = "#f8fbff";
            ctx.lineWidth = 5;
            ctx.strokeRect(width / 2 - 150, height * 0.15, 300, height * 0.1);

            ctx.beginPath();
            ctx.moveTo(width / 2 - 150, height * 0.15);
            ctx.lineTo(width / 2 - 150, height * 0.15 - 60);
            ctx.lineTo(width / 2 + 150, height * 0.15 - 60);
            ctx.lineTo(width / 2 + 150, height * 0.15);
            ctx.strokeStyle = "#d9f4ff";
            ctx.lineWidth = 8;
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = "rgba(132, 235, 255, 0.12)";
            ctx.rect(width / 2 - 145, height * 0.15 - 55, 290, 55);
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(width / 2, height * 0.6, Math.min(width * 0.14, 120), 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawClouds() {
            ctx.fillStyle = "rgba(220, 245, 255, 0.52)";
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > width + c.size) c.x = -c.size;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGoalkeeper() {
            goalkeeper.x += (goalkeeper.targetX - goalkeeper.x) * 0.1;

            const bodyGradient = ctx.createLinearGradient(goalkeeper.x, goalkeeper.y - 30, goalkeeper.x, goalkeeper.y + 30);
            bodyGradient.addColorStop(0, "#18b6ff");
            bodyGradient.addColorStop(1, "#0f3b6b");
            ctx.fillStyle = bodyGradient;
            ctx.fillRect(goalkeeper.x - 20, goalkeeper.y - 30, 40, 60);

            ctx.fillStyle = "#ffd0b5";
            ctx.beginPath();
            ctx.arc(goalkeeper.x, goalkeeper.y - 40, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#08243d";
            ctx.fillRect(goalkeeper.x - 18, goalkeeper.y - 28, 36, 10);

            ctx.strokeStyle = "#0b2644";
            ctx.lineWidth = 8;
            ctx.beginPath();
            if (turnPhase === 'animation') {
                ctx.moveTo(goalkeeper.x - 20, goalkeeper.y - 20);
                ctx.lineTo(goalkeeper.x - 40, goalkeeper.y - 40);
                ctx.moveTo(goalkeeper.x + 20, goalkeeper.y - 20);
                ctx.lineTo(goalkeeper.x + 40, goalkeeper.y - 40);
            } else {
                ctx.moveTo(goalkeeper.x - 20, goalkeeper.y - 20);
                ctx.lineTo(goalkeeper.x - 20, goalkeeper.y + 10);
                ctx.moveTo(goalkeeper.x + 20, goalkeeper.y - 20);
                ctx.lineTo(goalkeeper.x + 20, goalkeeper.y + 10);
            }
            ctx.stroke();
        }

        function drawBall() {
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y + ball.radius, ball.radius, ball.radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();

            const ballGradient = ctx.createRadialGradient(ball.x - 4, ball.y - 5, 2, ball.x, ball.y, ball.radius);
            ballGradient.addColorStop(0, "#ffffff");
            ballGradient.addColorStop(0.7, "#f7fbff");
            ballGradient.addColorStop(1, "#d6e8f5");
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#0a2238";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.52, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#0a2238";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius / 2.6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCards() {
            cards.forEach(card => {
                const y = card.isHovered ? card.y - 20 : card.y;

                const cardGradient = ctx.createLinearGradient(card.x, y, card.x, y + card.h);
                cardGradient.addColorStop(0, "#fefefe");
                cardGradient.addColorStop(1, "#d9f1ff");
                ctx.fillStyle = cardGradient;
                ctx.beginPath();
                ctx.roundRect(card.x, y, card.w, card.h, 10);
                ctx.fill();

                ctx.strokeStyle = card.color;
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = card.color;
                ctx.beginPath();
                ctx.roundRect(card.x + 4, y + 4, card.w - 8, 40, 5);
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,0.55)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(card.x + 8, y + 8, card.w - 16, card.h - 16, 8);
                ctx.stroke();

                ctx.fillStyle = "white";
                ctx.font = "bold 14px 'Audiowide'";
                ctx.textAlign = "center";
                ctx.fillText(card.name.split(" ")[0], card.x + card.w / 2, y + 28);

                ctx.fillStyle = "#18314c";
                ctx.font = "bold 40px 'Audiowide'";
                if (card.type === 'normal') {
                    ctx.fillText(card.value, card.x + card.w / 2, y + card.h / 2 + 20);
                    ctx.font = "bold 12px 'Exo 2'";
                    ctx.fillText("SHOT", card.x + card.w / 2, y + card.h - 15);
                } else {
                    ctx.fillText("★", card.x + card.w / 2, y + card.h / 2 + 20);
                    ctx.font = "bold 11px 'Exo 2'";
                    ctx.fillText("MOMENT", card.x + card.w / 2, y + card.h - 15);
                }
            });
        }

        function drawParticles() {
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.vy += 0.5;

                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            drawClouds();
            drawField();
            drawGoalkeeper();

            if (ball.state === 'shooting') {
                ball.x += ball.vx;
                ball.y += ball.vy;
                if (ball.radius > 8) ball.radius -= 0.1;
            }

            drawBall();
            drawParticles();

            if (turnPhase === 'input') {
                drawCards();
            }

            requestAnimationFrame(gameLoop);
        }

        /** 7. INPUT HANDLERS */
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.clientX || evt.touches[0].clientX;
            const clientY = evt.clientY || evt.touches[0].clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousemove', (e) => {
            if (turnPhase !== 'input') return;
            const pos = getMousePos(e);
            let hovering = false;
            cards.forEach(c => {
                if (pos.x >= c.x && pos.x <= c.x + c.w && pos.y >= c.y && pos.y <= c.y + c.h) {
                    c.isHovered = true;
                    hovering = true;
                    canvas.style.cursor = 'pointer';
                } else {
                    c.isHovered = false;
                }
            });
            if (!hovering) canvas.style.cursor = 'default';
        });

        canvas.addEventListener('click', (e) => {
            if (turnPhase !== 'input') return;
            const pos = getMousePos(e);
            cards.forEach((c, i) => {
                if (pos.x >= c.x && pos.x <= c.x + c.w && pos.y >= c.y && pos.y <= c.y + c.h) {
                    playCard(i);
                }
            });
        });

        // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: scoped touch suppression to gameplay taps only
        canvas.addEventListener('touchstart', (e) => {
            if (turnPhase !== 'input' || !gameActive) return;
            const pos = getMousePos(e);
            let tappedCard = false;
            cards.forEach((c, i) => {
                if (pos.x >= c.x && pos.x <= c.x + c.w && pos.y >= c.y && pos.y <= c.y + c.h) {
                    tappedCard = true;
                    playCard(i);
                }
            });
            if (tappedCard) {
                e.preventDefault();
            }
        }, { passive: false });

        /** CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        resize();
    });
    </script>
</body>
</html>
