<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>FNAF 1 Roleplay</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #050505;
            --bg-soft: rgba(9, 10, 15, 0.92);
            --panel: rgba(13, 16, 23, 0.86);
            --panel-strong: rgba(17, 20, 28, 0.94);
            --panel-edge: rgba(116, 231, 255, 0.18);
            --panel-glow: rgba(82, 235, 255, 0.22);
            --danger: #ff5252;
            --danger-soft: #b3152c;
            --accent: #6df5ff;
            --accent-strong: #b7fbff;
            --text: #ecf7ff;
            --text-dim: rgba(220, 235, 255, 0.72);
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background:
                radial-gradient(circle at top, rgba(106, 12, 27, 0.22), transparent 28%),
                radial-gradient(circle at bottom, rgba(0, 142, 173, 0.15), transparent 34%),
                #050505;
            color: var(--text);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 14%, rgba(255, 90, 90, 0.08), transparent 18%),
                linear-gradient(180deg, rgba(255,255,255,0.015), transparent 28%);
            mix-blend-mode: screen;
            z-index: 0;
        }

        button {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 1rem;
            border: 0;
            cursor: pointer;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .hidden { display: none !important; }

        .fnaf-font {
            font-family: 'Creepster', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(24, 29, 38, 0.9), rgba(8, 10, 15, 0.92));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 0 0 1px rgba(255,255,255,0.03),
                0 8px 24px rgba(0, 0, 0, 0.52),
                0 0 28px rgba(80, 224, 255, 0.08);
        }

        .screen {
            position: absolute;
            inset: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
                linear-gradient(90deg, rgba(255, 0, 76, 0.05), rgba(0, 255, 255, 0.025), rgba(0, 102, 255, 0.05));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.72;
        }

        .noise-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12) 0 1px, transparent 1px),
                radial-gradient(circle at 75% 35%, rgba(255,255,255,0.09) 0 1px, transparent 1px),
                radial-gradient(circle at 45% 80%, rgba(255,255,255,0.11) 0 1px, transparent 1px);
            background-size: 120px 120px, 160px 160px, 180px 180px;
            mix-blend-mode: screen;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            z-index: 20;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)) 20px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 25%, rgba(255, 62, 62, 0.18), transparent 24%),
                linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.92));
            pointer-events: auto;
            z-index: 50;
        }

        .hero-marquee {
            position: relative;
            margin-bottom: 12px;
            padding: 18px 20px 14px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(18, 14, 22, 0.92), rgba(5, 6, 10, 0.94));
            border: 1px solid rgba(255, 82, 82, 0.34);
            box-shadow:
                var(--shadow),
                0 0 28px rgba(255, 79, 79, 0.18),
                inset 0 0 32px rgba(255,255,255,0.03);
        }

        .hero-marquee::before,
        .hero-marquee::after {
            content: "👁️";
            position: absolute;
            top: 12px;
            font-size: 20px;
            opacity: 0.74;
            filter: drop-shadow(0 0 10px rgba(255, 95, 95, 0.45));
        }

        .hero-marquee::before { left: 14px; }
        .hero-marquee::after { right: 14px; }

        .title-main {
            margin: 0;
            font-size: clamp(2.5rem, 11vw, 4.5rem);
            line-height: 0.88;
            color: #ff5454;
            text-shadow:
                0 0 10px rgba(255, 87, 87, 0.35),
                0 0 30px rgba(255, 42, 42, 0.25),
                2px 3px 0 #140303;
            animation: titlePulse 2s ease-in-out infinite;
        }

        .title-sub {
            display: block;
            margin-top: 8px;
            color: var(--accent-strong);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.15rem, 5vw, 2rem);
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .start-tagline {
            margin: 0 0 22px;
            max-width: 30rem;
            color: var(--text-dim);
            font-size: clamp(0.92rem, 3.5vw, 1.05rem);
            line-height: 1.5;
        }

        .role-preview {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 440px;
            margin: 0 0 24px;
        }

        .role-chip {
            padding: 7px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: rgba(236, 247, 255, 0.82);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .primary-cta {
            min-width: min(78vw, 280px);
            padding: 16px 28px;
            border-radius: 18px;
            color: #071015;
            background: linear-gradient(180deg, #dbfeff, #68efff 58%, #27cfe6);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.18em;
            box-shadow:
                0 10px 26px rgba(23, 193, 223, 0.24),
                0 0 0 1px rgba(255,255,255,0.35) inset;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .primary-cta:hover,
        .primary-cta:focus-visible {
            filter: brightness(1.06);
            box-shadow:
                0 12px 30px rgba(23, 193, 223, 0.28),
                0 0 0 1px rgba(255,255,255,0.48) inset;
        }

        .primary-cta:active {
            transform: scale(0.97);
        }

        #hud {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .hud-topbar {
            position: absolute;
            top: max(8px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-toggle {
            padding: 10px 14px;
            border-radius: 14px;
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .status-cluster {
            min-width: 94px;
            padding: 8px 10px;
            border-radius: 14px;
            color: rgba(236, 247, 255, 0.74);
            text-align: right;
            font-size: 0.76rem;
            line-height: 1.3;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #clock {
            color: var(--accent-strong);
            font-weight: 700;
            font-size: 0.82rem;
        }

        #morph-menu {
            position: absolute;
            top: calc(max(8px, env(safe-area-inset-top)) + 54px);
            left: 12px;
            bottom: calc(max(20px, env(safe-area-inset-bottom)) + 72px);
            width: min(260px, calc(100vw - 24px));
            padding: 10px;
            border-radius: 18px;
            overflow-y: auto;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-title {
            margin: 0 0 4px;
            padding: 4px 0 10px;
            position: sticky;
            top: 0;
            z-index: 2;
            text-align: center;
            color: var(--accent-strong);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            background: linear-gradient(180deg, rgba(5,7,10,0.97), rgba(5,7,10,0.84));
            backdrop-filter: blur(10px);
        }

        #action-bar {
            position: absolute;
            right: 14px;
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 6px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }

        #joystick-zone {
            position: absolute;
            left: 14px;
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 6px);
            width: 132px;
            height: 132px;
            border-radius: 50%;
            border: 2px solid rgba(141, 238, 255, 0.16);
            background:
                radial-gradient(circle at 50% 50%, rgba(109, 245, 255, 0.12), rgba(4, 8, 12, 0.3) 58%, rgba(0,0,0,0.15) 100%);
            box-shadow:
                inset 0 0 24px rgba(109, 245, 255, 0.08),
                0 0 18px rgba(109, 245, 255, 0.08);
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-zone::before {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.12);
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), rgba(255,255,255,0.08) 28%),
                linear-gradient(180deg, rgba(188, 246, 255, 0.34), rgba(24, 41, 56, 0.6));
            backdrop-filter: blur(8px);
            box-shadow:
                0 10px 18px rgba(0,0,0,0.28),
                inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .btn-morph {
            width: 100%;
            padding: 11px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            color: var(--text);
            text-align: left;
            background:
                linear-gradient(180deg, rgba(43, 50, 63, 0.92), rgba(13, 17, 24, 0.96));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .btn-morph:hover,
        .btn-morph:focus-visible {
            border-color: rgba(113, 240, 255, 0.28);
            box-shadow: 0 0 0 1px rgba(113, 240, 255, 0.12), 0 10px 18px rgba(0,0,0,0.2);
        }

        .btn-morph:active {
            transform: scale(0.98);
        }

        .btn-morph.selected {
            border-color: rgba(119, 255, 173, 0.88);
            box-shadow:
                0 0 0 1px rgba(119, 255, 173, 0.24),
                0 0 22px rgba(119, 255, 173, 0.12);
        }

        .btn-morph-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex: 0 0 auto;
        }

        .btn-action {
            min-width: 108px;
            padding: 12px 16px;
            border-radius: 14px;
            color: var(--text);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            background:
                linear-gradient(180deg, rgba(35, 46, 61, 0.96), rgba(12, 17, 24, 0.98));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04),
                0 10px 18px rgba(0,0,0,0.22);
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
            overflow: hidden;
        }

        .reaction-banner {
            position: absolute;
            top: calc(max(72px, env(safe-area-inset-top)) + 4px);
            right: 12px;
            width: min(32vw, 112px);
            aspect-ratio: 1;
            border-radius: 18px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow:
                0 12px 24px rgba(0,0,0,0.35),
                0 0 18px rgba(255, 82, 82, 0.18);
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .reaction-banner.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .reaction-flash {
            position: absolute;
            left: 50%;
            bottom: calc(max(108px, env(safe-area-inset-bottom)) + 44px);
            width: min(42vw, 150px);
            aspect-ratio: 1;
            transform: translateX(-50%) scale(0.85);
            opacity: 0;
            object-fit: cover;
            filter: drop-shadow(0 0 14px rgba(255, 99, 99, 0.4));
            transition: opacity 140ms ease, transform 140ms ease;
        }

        .reaction-flash.show {
            opacity: 0.84;
            transform: translateX(-50%) scale(1);
        }

        .feedback-text {
            position: absolute;
            left: 50%;
            top: calc(max(22px, env(safe-area-inset-top)) + 18px);
            transform: translateX(-50%) translateY(-8px);
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(6, 10, 14, 0.88);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--accent-strong);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.28);
            opacity: 0;
            transition: opacity 150ms ease, transform 150ms ease;
            white-space: nowrap;
        }

        .feedback-text.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.08); }
        }

        @media (max-width: 700px) {
            .start-tagline {
                max-width: 21rem;
            }

            #morph-menu {
                width: min(220px, calc(100vw - 24px));
            }

            .reaction-banner {
                width: min(30vw, 92px);
            }

            .reaction-flash {
                width: min(34vw, 120px);
                bottom: calc(max(114px, env(safe-area-inset-bottom)) + 28px);
            }

            .feedback-text {
                font-size: 0.78rem;
                max-width: calc(100vw - 36px);
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="screen scanlines"></div>
        <div class="screen noise-overlay"></div>

        <div id="ui-layer">
            <div id="start-screen">
                <div class="hero-marquee">
                    <h1 class="title-main fnaf-font">Night Shift<span class="title-sub">Free Roam</span></h1>
                </div>
                <p class="start-tagline">Stalk the neon-dark pizzeria, swap roles on the fly, and unleash each character’s eerie stage presence without changing the rules of the night.</p>
                <div class="role-preview" aria-hidden="true">
                    <span class="role-chip">🐻 Freddy</span>
                    <span class="role-chip">🐰 Bonnie</span>
                    <span class="role-chip">🐤 Chica</span>
                    <span class="role-chip">🦊 Foxy</span>
                    <span class="role-chip">👮 Guard</span>
                </div>
                <button id="start-btn" class="primary-cta">Start Shift</button>
            </div>

            <div id="hud" class="hidden">
                <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe corner placement -->
                <div class="hud-topbar">
                    <button id="toggle-morphs" class="glass-panel hud-toggle ui-pulse">Switch Role</button>
                    <div class="glass-panel status-cluster">
                        <div id="clock">12:00 AM</div>
                        <div>Night 1</div>
                    </div>
                </div>

                <div id="morph-menu" class="hidden glass-panel">
                    <h3 class="menu-title">Roles</h3>
                </div>

                <div id="action-bar"></div>

                <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
                <div id="joystick-zone">
                    <div id="joystick-knob"></div>
                </div>
            </div>
        </div>

        <div id="feedback-layer" aria-hidden="true">
            <div id="feedback-text" class="feedback-text"></div>
            <img id="reaction-banner" class="reaction-banner" alt="Mood reaction overlay">
            <img id="reaction-flash" class="reaction-flash" alt="Action flash overlay">
        </div>
    </div>

        <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            fonts: {
                title: 'Creepster',
                ui: 'Exo 2'
            },
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                menuOpen: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                menuClose: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3",
                morph: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                scream: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                toggle: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3"
            },
            gifs: {
                banner: "https://i.giphy.com/12GxI1Eqg7S6f6.webp",
                flash: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {};
                this.cooldowns = new Map();
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(url, { volume: key === 'scream' ? 0.68 : 0.62 });
                }
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = !!options.loop;
                audio.volume = options.volume ?? 0.7;
                return audio;
            }

            unlock() {
                this.ready = true;
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldownMs = 120) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const until = this.cooldowns.get(key) || 0;
                if (now < until) return;
                this.cooldowns.set(key, now + cooldownMs);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const feedbackText = document.getElementById('feedback-text');
        const reactionBanner = document.getElementById('reaction-banner');
        const reactionFlash = document.getElementById('reaction-flash');
        reactionBanner.src = ASSETS.gifs.banner;
        reactionFlash.src = ASSETS.gifs.flash;

        let width, height;
        let gameActive = false;
        let lastMoveAt = 0;

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0, currentX: 0, currentY: 0 };

        const MORPHS = {
            FREDDY: { name: 'Freddy', color: '#7b513f', accent: '#c99f76', type: 'animatronic', actions: ['perform', 'eyes', 'scream'] },
            BONNIE: { name: 'Bonnie', color: '#6956d8', accent: '#baa4ff', type: 'animatronic', actions: ['perform', 'scream'] },
            CHICA: { name: 'Chica', color: '#ffcf44', accent: '#fff0aa', type: 'animatronic', actions: ['perform', 'scream'] },
            FOXY: { name: 'Foxy', color: '#cf3f44', accent: '#ffb0a0', type: 'animatronic', speedMod: 1.5, actions: ['scream'] },
            GOLDEN: { name: 'Golden Freddy', color: '#f0bf41', accent: '#fff1a8', type: 'animatronic', actions: ['sit', 'scream'] },
            TOY_FREDDY: { name: 'Toy Freddy', color: '#966f64', accent: '#f2cdc5', type: 'animatronic', actions: ['perform', 'scream'] },
            GUARD: { name: 'Nightguard', color: '#39a8ff', accent: '#ddf7ff', type: 'human', actions: ['flashlight'] },
            KID: { name: 'Crying Child', color: '#2a2c38', accent: '#abb7d4', type: 'human', scale: 0.7, actions: [] }
        };

        let player = {
            x: 0, y: 0,
            radius: 20,
            speed: 4,
            morph: 'GUARD',
            angle: 0,
            isPerforming: false,
            isSitting: false,
            darkEyes: false,
            flashlight: false,
            screamTimer: 0
        };

        const MAP_WALLS = [
            { x: -500, y: -600, w: 1000, h: 50 },
            { x: -500, y: 600, w: 1000, h: 50 },
            { x: -500, y: -600, w: 50, h: 1250 },
            { x: 450, y: -600, w: 50, h: 1250 },
            { x: -100, y: 400, w: 10, h: 200 },
            { x: 90, y: 400, w: 10, h: 200 },
            { x: -100, y: 400, w: 200, h: 10 },
            { x: -150, y: -550, w: 300, h: 100 },
            { x: -400, y: -300, w: 150, h: 150 },
            { x: -200, y: -100, w: 50, h: 300 },
            { x: 150, y: -100, w: 50, h: 300 }
        ];

        const ROOMS = [
            { name: "Show Stage", x: -150, y: -550, w: 300, h: 100, color: "#1a1a1a" },
            { name: "Dining Area", x: -300, y: -450, w: 600, h: 400, color: "#222", floor: "checkered" },
            { name: "Pirate Cove", x: -450, y: -300, w: 150, h: 150, color: "#150015", curtain: true },
            { name: "West Hall", x: -450, y: 0, w: 250, h: 400, color: "#111" },
            { name: "East Hall", x: 200, y: 0, w: 250, h: 400, color: "#111" },
            { name: "Office", x: -80, y: 420, w: 160, h: 160, color: "#1a1a1a" }
        ];

        /** 4. RESIZE & INIT */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function showBanner() {
            reactionBanner.classList.remove('show');
            void reactionBanner.offsetWidth;
            reactionBanner.classList.add('show');
            clearTimeout(showBanner.timer);
            showBanner.timer = setTimeout(() => reactionBanner.classList.remove('show'), 900);
        }

        function pulseFlash() {
            reactionFlash.classList.remove('show');
            void reactionFlash.offsetWidth;
            reactionFlash.classList.add('show');
            clearTimeout(pulseFlash.timer);
            pulseFlash.timer = setTimeout(() => reactionFlash.classList.remove('show'), 260);
        }

        function announce(text) {
            feedbackText.textContent = text;
            feedbackText.classList.remove('show');
            void feedbackText.offsetWidth;
            feedbackText.classList.add('show');
            clearTimeout(announce.timer);
            announce.timer = setTimeout(() => feedbackText.classList.remove('show'), 900);
        }

        function triggerFeedback(text, { banner = false, flash = false } = {}) {
            announce(text);
            if (banner) showBanner();
            if (flash) pulseFlash();
        }

        function resetPlayer() {
            player.x = 0;
            player.y = 500;
            player.morph = 'GUARD';
            player.isPerforming = false;
            player.isSitting = false;
            player.darkEyes = false;
            player.flashlight = false;
            player.screamTimer = 0;
            updateActionButtons();
            syncMorphSelection();
        }

        /** 5. INPUT HANDLING */
        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystick.active = true;
            joystick.originX = touch.clientX;
            joystick.originY = touch.clientY;
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;
        }, { passive: false });

        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!joystick.active) return;
            const touch = e.changedTouches[0];
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;

            let diffX = joystick.currentX - joystick.originX;
            let diffY = joystick.currentY - joystick.originY;
            const dist = Math.sqrt(diffX * diffX + diffY * diffY);
            const maxDist = 40;

            if (dist > maxDist) {
                diffX = (diffX / dist) * maxDist;
                diffY = (diffY / dist) * maxDist;
            }

            joystick.dx = diffX / maxDist;
            joystick.dy = diffY / maxDist;

            joyKnob.style.transform = `translate(calc(-50% + ${diffX}px), calc(-50% + ${diffY}px))`;
        }, { passive: false });

        const endJoystick = (e) => {
            e.preventDefault();
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            joyKnob.style.transform = 'translate(-50%, -50%)';
        };
        joyZone.addEventListener('touchend', endJoystick);
        joyZone.addEventListener('touchcancel', endJoystick);

        /** 6. UI LOGIC */
        const morphMenu = document.getElementById('morph-menu');
        const actionBar = document.getElementById('action-bar');

        document.getElementById('toggle-morphs').addEventListener('click', () => {
            morphMenu.classList.toggle('hidden');
            const open = !morphMenu.classList.contains('hidden');
            audio.playSFX(open ? 'menuOpen' : 'menuClose', 120);
            triggerFeedback(open ? 'Role menu' : 'Role locked', { banner: open });
        });

        function generateMorphButtons() {
            morphMenu.innerHTML = '<h3 class="menu-title">Roles</h3>';
            for (const [key, data] of Object.entries(MORPHS)) {
                const btn = document.createElement('button');
                btn.className = 'btn-morph';
                btn.dataset.morph = key;
                btn.innerHTML = `<span class="btn-morph-dot" style="background:${data.color}; color:${data.color}"></span><span>${data.name}</span>`;
                btn.onclick = () => {
                    setMorph(key);
                    audio.playSFX('morph', 90);
                    morphMenu.classList.add('hidden');
                    triggerFeedback(`${data.name} active`, { banner: true });
                };
                morphMenu.appendChild(btn);
            }
            syncMorphSelection();
        }

        function syncMorphSelection() {
            morphMenu.querySelectorAll('.btn-morph').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.morph === player.morph);
            });
        }

        function setMorph(key) {
            player.morph = key;
            player.isPerforming = false;
            player.isSitting = false;
            player.darkEyes = false;
            player.flashlight = false;
            updateActionButtons();
            syncMorphSelection();
        }

        function updateActionButtons() {
            actionBar.innerHTML = '';
            const data = MORPHS[player.morph];

            if (data.actions.length === 0) {
                const btn = document.createElement('button');
                btn.className = 'btn-action';
                btn.innerText = 'No Act';
                btn.onclick = () => {
                    audio.playSFX('blocked', 150);
                    triggerFeedback('No action', { flash: true });
                };
                actionBar.appendChild(btn);
                return;
            }

            data.actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'btn-action';

                if (action === 'scream') {
                    btn.innerText = 'Scream';
                    btn.onclick = () => {
                        audio.playSFX('scream', 220);
                        player.screamTimer = 20;
                        triggerFeedback('Stage scare', { banner: true, flash: true });
                    };
                } else if (action === 'perform') {
                    btn.innerText = 'Rock';
                    btn.onclick = () => {
                        player.isPerforming = !player.isPerforming;
                        audio.playSFX('toggle', 120);
                        triggerFeedback(player.isPerforming ? 'Showtime' : 'Encore off', { flash: true });
                    };
                } else if (action === 'sit') {
                    btn.innerText = 'Sit';
                    btn.onclick = () => {
                        player.isSitting = !player.isSitting;
                        audio.playSFX(player.isSitting ? 'toggle' : 'menuClose', 140);
                        triggerFeedback(player.isSitting ? 'Pose locked' : 'Pose off', { flash: true });
                    };
                } else if (action === 'eyes') {
                    btn.innerText = 'Eyes';
                    btn.onclick = () => {
                        player.darkEyes = !player.darkEyes;
                        audio.playSFX('toggle', 110);
                        triggerFeedback(player.darkEyes ? 'Blackout stare' : 'Light stare', { banner: true });
                    };
                } else if (action === 'flashlight') {
                    btn.innerText = 'Light';
                    btn.onclick = () => {
                        player.flashlight = !player.flashlight;
                        audio.playSFX(player.flashlight ? 'toggle' : 'menuClose', 120);
                        triggerFeedback(player.flashlight ? 'Flashlight on' : 'Flashlight off', { flash: true });
                    };
                }

                actionBar.appendChild(btn);
            });
        }

        /** 7. GAME LOOP */
        function checkCollision(newX, newY) {
            const pSize = player.radius;
            for (let w of MAP_WALLS) {
                if (newX + pSize > w.x && newX - pSize < w.x + w.w &&
                    newY + pSize > w.y && newY - pSize < w.y + w.h) {
                    return true;
                }
            }
            return false;
        }

        function update() {
            if (!gameActive) return;

            let dx = 0;
            let dy = 0;

            if (keys.w || keys.ArrowUp) dy = -1;
            if (keys.s || keys.ArrowDown) dy = 1;
            if (keys.a || keys.ArrowLeft) dx = -1;
            if (keys.d || keys.ArrowRight) dx = 1;

            if (joystick.active) {
                dx = joystick.dx;
                dy = joystick.dy;
            }

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len > 1 && !joystick.active) {
                    dx /= len;
                    dy /= len;
                }
                player.angle = Math.atan2(dy, dx);
            }

            const morphData = MORPHS[player.morph];
            let speed = player.speed * (morphData.speedMod || 1);
            if (player.isSitting) speed = 0;

            if (dx !== 0 || dy !== 0) {
                if (!checkCollision(player.x + dx * speed, player.y)) player.x += dx * speed;
                if (!checkCollision(player.x, player.y + dy * speed)) player.y += dy * speed;
                if (performance.now() - lastMoveAt > 1600) {
                    lastMoveAt = performance.now();
                    audio.playSFX('menuOpen', 80);
                }
            }

            if (player.screamTimer > 0) player.screamTimer--;
        }

        function drawNeonTile(x, y, size, hueShift) {
            ctx.fillStyle = `hsla(${hueShift}, 100%, 60%, 0.05)`;
            ctx.fillRect(x, y, size, size);
            ctx.strokeStyle = `hsla(${hueShift}, 100%, 70%, 0.035)`;
            ctx.strokeRect(x + 1, y + 1, size - 2, size - 2);
        }

        function drawMap(cameraX, cameraY) {
            ctx.fillStyle = '#040507';
            ctx.fillRect(0, 0, width, height);

            const floorGlow = ctx.createLinearGradient(0, 0, 0, height);
            floorGlow.addColorStop(0, 'rgba(18, 22, 30, 0.08)');
            floorGlow.addColorStop(1, 'rgba(0, 0, 0, 0.28)');
            ctx.fillStyle = floorGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width / 2 - cameraX, height / 2 - cameraY);

            ROOMS.forEach((room, roomIndex) => {
                const roomGrad = ctx.createLinearGradient(room.x, room.y, room.x, room.y + room.h);
                roomGrad.addColorStop(0, room.color);
                roomGrad.addColorStop(1, '#090b10');
                ctx.fillStyle = roomGrad;
                ctx.fillRect(room.x, room.y, room.w, room.h);

                ctx.strokeStyle = 'rgba(109, 245, 255, 0.08)';
                ctx.lineWidth = 2;
                ctx.strokeRect(room.x + 1, room.y + 1, room.w - 2, room.h - 2);

                if (room.floor === 'checkered') {
                    const size = 40;
                    for (let fx = room.x; fx < room.x + room.w; fx += size) {
                        for (let fy = room.y; fy < room.y + room.h; fy += size) {
                            if (((fx - room.x) / size + (fy - room.y) / size) % 2 === 0) {
                                drawNeonTile(fx, fy, size, roomIndex % 2 === 0 ? 190 : 355);
                            }
                        }
                    }
                }

                if (room.curtain) {
                    for (let i = 0; i < room.w; i += 20) {
                        ctx.fillStyle = i % 40 === 0 ? '#7a1d58' : '#4a0d38';
                        ctx.beginPath();
                        ctx.arc(room.x + i + 10, room.y + room.h, 10, Math.PI, 0);
                        ctx.fill();
                    }
                }

                ctx.fillStyle = 'rgba(236,247,255,0.22)';
                ctx.font = '600 16px "Exo 2"';
                ctx.textAlign = 'center';
                ctx.fillText(room.name.toUpperCase(), room.x + room.w / 2, room.y + 24);
            });

            ctx.fillStyle = '#040404';
            MAP_WALLS.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = 'rgba(109, 245, 255, 0.08)';
                ctx.strokeRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
            });

            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = '#3f4247';
                ctx.beginPath();
                ctx.arc(-200 + i * 100, -250, 30, 0, Math.PI * 2);
                ctx.arc(-200 + i * 100, -100, 30, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = i % 2 === 0 ? '#ff6363' : '#57d9ff';
                ctx.beginPath();
                ctx.moveTo(-200 + i * 100, -250);
                ctx.lineTo(-205 + i * 100, -240);
                ctx.lineTo(-195 + i * 100, -240);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-200 + i * 100, -100);
                ctx.lineTo(-205 + i * 100, -90);
                ctx.lineTo(-195 + i * 100, -90);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawPlayer() {
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.save();
            ctx.translate(centerX, centerY);

            if (player.screamTimer > 0) {
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            }

            const data = MORPHS[player.morph];
            const scale = data.scale || 1;
            const bob = gameActive ? Math.sin(performance.now() / 220) * 1.2 : 0;
            const accent = data.accent || '#fff';
            ctx.scale(scale, scale);
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 16, 26, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = accent;
            ctx.fillStyle = data.color;
            ctx.beginPath();
            if (player.isSitting) {
                ctx.roundRect(-20, -2, 40, 28, 16);
            } else {
                ctx.roundRect(-18, 6, 36, 30, 14);
            }
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.fillStyle = data.color;
            ctx.beginPath();
            ctx.arc(0, player.isSitting ? -4 : -10, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.28)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            if (data.type === 'animatronic' && player.morph !== 'CHICA') {
                ctx.fillStyle = data.color;
                ctx.beginPath();
                if (player.morph === 'BONNIE') {
                    ctx.roundRect(-20, -42, 11, 24, 8);
                    ctx.roundRect(9, -42, 11, 24, 8);
                } else if (player.morph === 'FOXY') {
                    ctx.moveTo(-16, -18);
                    ctx.lineTo(-24, -38);
                    ctx.lineTo(-8, -26);
                    ctx.closePath();
                    ctx.moveTo(16, -18);
                    ctx.lineTo(24, -38);
                    ctx.lineTo(8, -26);
                    ctx.closePath();
                } else {
                    ctx.arc(-15, -24, 8, 0, Math.PI * 2);
                    ctx.arc(15, -24, 8, 0, Math.PI * 2);
                }
                ctx.fill();
            }

            if (player.morph === 'FREDDY' || player.morph === 'TOY_FREDDY' || player.morph === 'GOLDEN') {
                ctx.fillStyle = '#050505';
                ctx.fillRect(-11, -36, 22, 15);
                ctx.fillRect(-17, -22, 34, 5);
            }
            if (player.morph === 'CHICA') {
                ctx.fillStyle = '#ff9d27';
                ctx.beginPath();
                ctx.moveTo(-6, -2);
                ctx.lineTo(6, -2);
                ctx.lineTo(0, 12);
                ctx.fill();

                ctx.fillStyle = data.color;
                ctx.beginPath();
                ctx.moveTo(0, -28);
                ctx.lineTo(-6, -38);
                ctx.lineTo(6, -38);
                ctx.fill();
            }
            if (player.morph === 'TOY_FREDDY') {
                ctx.fillStyle = '#ff7f7f';
                ctx.beginPath(); ctx.arc(-13, -2, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(13, -2, 4, 0, Math.PI * 2); ctx.fill();
            }
            if (player.morph === 'FOXY') {
                ctx.fillStyle = '#3b0a0a';
                ctx.fillRect(10, 10, 12, 4);
                ctx.beginPath();
                ctx.arc(22, 12, 5, -Math.PI / 2, Math.PI / 2);
                ctx.strokeStyle = '#a0b5c7';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            if (player.morph === 'GUARD') {
                ctx.fillStyle = '#193f60';
                ctx.fillRect(-14, -33, 28, 10);
                ctx.fillStyle = '#53beff';
                ctx.fillRect(-8, -29, 16, 3);
            }
            if (player.morph === 'KID') {
                ctx.fillStyle = '#6ca7ff';
                ctx.fillRect(-16, 12, 32, 8);
                ctx.fillStyle = '#d9ecff';
                ctx.fillRect(-12, 20, 24, 4);
            }

            if (player.darkEyes) {
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-8, -11, 7, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -11, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-8, -11, 1.3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -11, 1.3, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = '#f9ffff';
                ctx.beginPath(); ctx.arc(-8, -11, 7, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -11, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = player.morph === 'FOXY' ? '#ffdf86' : '#000';
                ctx.beginPath(); ctx.arc(-8, -11, 2.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(8, -11, 2.1, 0, Math.PI * 2); ctx.fill();
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0.2, Math.PI - 0.2);
            ctx.stroke();

            if (player.isPerforming) {
                if (player.morph === 'BONNIE') {
                    ctx.save();
                    ctx.rotate(Math.PI / 4);
                    ctx.fillStyle = '#c72b3b';
                    ctx.roundRect(9, -10, 32, 12, 6);
                    ctx.fill();
                    ctx.fillStyle = '#d7e1ea';
                    ctx.fillRect(-2, -6, 42, 4);
                    ctx.restore();
                } else if (player.morph === 'FREDDY' || player.morph === 'TOY_FREDDY') {
                    ctx.fillStyle = '#9aa5b3';
                    ctx.fillRect(11, 8, 4, 16);
                    ctx.fillStyle = '#222';
                    ctx.beginPath(); ctx.arc(13, 8, 6, 0, Math.PI * 2); ctx.fill();
                } else if (player.morph === 'CHICA') {
                    ctx.fillStyle = '#ff99c2';
                    ctx.fillRect(15, 3, 12, 12);
                    ctx.fillStyle = '#6b3b2a';
                    ctx.fillRect(15, 15, 12, 5);
                    ctx.fillStyle = '#ffe45c';
                    ctx.fillRect(20, -2, 2, 6);
                }
            }

            if (player.morph === 'GUARD' && player.flashlight) {
                ctx.save();
                ctx.rotate(player.angle);
                const beam = ctx.createLinearGradient(0, 0, 220, 0);
                beam.addColorStop(0, 'rgba(255,255,220,0.55)');
                beam.addColorStop(1, 'rgba(255,255,220,0)');
                ctx.fillStyle = beam;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(220, -56);
                ctx.lineTo(220, 56);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();
        }

        function drawVignette() {
            const grad = ctx.createRadialGradient(width / 2, height / 2, 100, width / 2, height / 2, width);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.66, 'rgba(0,0,0,0.56)');
            grad.addColorStop(1, 'rgba(0,0,0,0.95)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            if (Math.random() > 0.9) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.045})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            update();
            drawMap(player.x, player.y);
            drawPlayer();
            drawVignette();

            requestAnimationFrame(gameLoop);
        }

        /** 8. START */
        const startGame = () => {
            if (gameActive) return;
            audio.unlock();
            audio.playSFX('start', 80);
            audio.playBGM();
            triggerFeedback('Shift started', { banner: true, flash: true });
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            generateMorphButtons();
            resetPlayer();
            updateActionButtons();
            gameLoop();
        };

        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', startGame);
        // [agent-note][stage4] repaired: mobile-cta-risk | element: #start-btn | action: native tap kept with explicit pointer/touch activation
        startBtn.addEventListener('pointerup', startGame);
        startBtn.addEventListener('touchend', startGame, { passive: true });
    });
    </script>
</body>
