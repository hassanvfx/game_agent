<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space Creator</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    /* SPACE CREATOR THEME */
    :root {
        --bg-core: #050508;
        --bg-deep: #070b1f;
        --panel-fill: rgba(11, 18, 41, 0.68);
        --panel-line: rgba(109, 194, 255, 0.22);
        --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.34);
        --hud-cyan: #82e7ff;
        --hud-mint: #73f0bb;
        --hud-gold: #ffd76a;
        --text-main: #f7fbff;
        --text-soft: rgba(214, 232, 255, 0.78);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(73, 117, 255, 0.16), transparent 38%),
            radial-gradient(circle at 20% 80%, rgba(18, 240, 196, 0.12), transparent 30%),
            linear-gradient(180deg, var(--bg-deep), var(--bg-core) 60%);
        font-family: 'Rajdhani', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        color: var(--text-main);
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 50% 15%, rgba(139, 208, 255, 0.08), transparent 25%),
            linear-gradient(180deg, rgba(255,255,255,0.04), transparent 35%);
        opacity: 0.95;
    }

canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    h1, button, .type-btn, #obj-count, #habitable-count, #status-banner {
        font-family: 'Orbitron', sans-serif;
    }

    /* UI Glassmorphism */
    .glass-panel {
        background:
            linear-gradient(180deg, rgba(22, 30, 68, 0.8), rgba(7, 11, 27, 0.74)),
            var(--panel-fill);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(109, 194, 255, 0.22);
        box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .glass-btn {
        background: linear-gradient(180deg, rgba(122, 228, 255, 0.14), rgba(80, 130, 255, 0.1));
        border: 1px solid rgba(140, 210, 255, 0.26);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .glass-btn:hover {
        filter: brightness(1.08);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 0 16px rgba(110, 212, 255, 0.18);
    }

    .glass-btn:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.2);
    }

    /* Type Selector */
    .type-btn {
        transition: all 0.2s;
        opacity: 0.5;
        transform: scale(0.9);
    }

    .type-btn.active {
        opacity: 1;
        transform: scale(1);
        background: linear-gradient(180deg, rgba(130, 231, 255, 0.18), rgba(85, 121, 255, 0.12));
        border-color: rgba(130, 231, 255, 0.6);
        box-shadow: 0 0 18px rgba(130, 231, 255, 0.18);
    }

    /* Color Picker */
    .color-wrapper {
        position: relative;
        overflow: hidden;
        border-radius: 50%;
    }

    .color-wrapper input[type="color"] {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        opacity: 0;
        cursor: pointer;
    }

    /* Animations */
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    .anim-float { animation: float 6s ease-in-out infinite; }

    @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0; }
    }

    .anim-pulse::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid currentColor;
        animation: pulse-ring 2s infinite;
    }

    @keyframes orbitSpin {
        to { transform: rotate(360deg); }
    }

    /* Utilities */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-t { padding-top: max(16px, env(safe-area-inset-top)); }
    .safe-b { padding-bottom: max(24px, env(safe-area-inset-bottom)); }

    .hud-chip {
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .title-kicker {
        color: var(--hud-cyan);
        letter-spacing: 0.28em;
        text-shadow: 0 0 12px rgba(130, 231, 255, 0.28);
    }

    .title-gradient {
        background-image: linear-gradient(90deg, #7edbff 10%, #7cf5c9 55%, #ffd76a 100%);
    }

    .planet-guide {
        border: 1px solid rgba(157, 214, 255, 0.14);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 34px rgba(0, 0, 0, 0.22);
    }

    .planet-guide p {
        color: var(--text-soft);
        font-size: 0.82rem;
        line-height: 1.2rem;
    }

    .launch-pill {
        background: linear-gradient(90deg, rgba(130, 231, 255, 0.16), rgba(115, 240, 187, 0.12));
        border: 1px solid rgba(130, 231, 255, 0.18);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
    }

    .hero-orbit {
        position: relative;
        width: 8.5rem;
        height: 8.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        background:
            radial-gradient(circle at 35% 35%, #fff3ae, #ffb957 35%, #ff7f32 62%, rgba(255,127,50,0.18) 63%, transparent 74%),
            radial-gradient(circle at center, rgba(130, 231, 255, 0.16), transparent 65%);
        box-shadow:
            0 0 30px rgba(255, 203, 89, 0.3),
            0 0 80px rgba(87, 178, 255, 0.14);
    }

    .hero-orbit::before,
    .hero-orbit::after {
        content: "";
        position: absolute;
        inset: -0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(130, 231, 255, 0.18);
    }

    .hero-orbit::after {
        inset: 1.15rem;
        border-color: rgba(115, 240, 187, 0.2);
        border-style: dashed;
        animation: orbitSpin 14s linear infinite;
    }

    .orbit-moon {
        position: absolute;
        top: 15%;
        right: 7%;
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, #ffffff, #8fe3ff 42%, #52b8ff 100%);
        box-shadow: 0 0 14px rgba(130, 231, 255, 0.55);
    }

    .feedback-gif {
        position: absolute;
        right: 1rem;
        width: 5.25rem;
        height: 5.25rem;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(130, 231, 255, 0.24);
        background: rgba(7, 11, 27, 0.62);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.26);
        opacity: 0;
        transform: translateY(12px) scale(0.94);
        transition: opacity 0.28s ease, transform 0.28s ease;
        pointer-events: none;
    }

    .feedback-gif.show {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }

    #gif-success {
        bottom: 7.5rem;
    }

    #gif-impact {
        top: 5.75rem;
    }

    #status-banner {
        position: absolute;
        left: 50%;
        top: max(5rem, env(safe-area-inset-top) + 3.5rem);
        transform: translateX(-50%) translateY(-10px);
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(130, 231, 255, 0.24);
        background: linear-gradient(180deg, rgba(11, 18, 41, 0.92), rgba(7, 11, 27, 0.9));
        color: var(--text-main);
        box-shadow: var(--shadow-soft);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 30;
        white-space: nowrap;
    }

    #status-banner.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
        .feedback-gif {
            width: 4rem;
            height: 4rem;
            right: 0.75rem;
        }

        #gif-success {
            bottom: 8.75rem;
        }

        #gif-impact {
            top: 5.25rem;
        }

        #status-banner {
            font-size: 0.62rem;
            max-width: calc(100vw - 2rem);
            overflow: hidden;
            text-overflow: ellipsis;
        }
    }
</style>
</head>
<body>

<!-- Game Container -->
<div id="game-root" class="relative w-full h-full overflow-hidden bg-[#050508]">
    <canvas id="world"></canvas>

        <!-- Controls Row -->
        <div class="glass-panel mx-4 mb-2 p-2 rounded-2xl flex items-center justify-between pointer-events-auto gap-2">
            
            <!-- Type Selector -->
            <div class="flex-1 overflow-x-auto no-scrollbar flex gap-2" id="type-list">
                <!-- JS Generated -->
            </div>

            <!-- Separator -->
            <div class="w-px h-10 bg-white/10"></div>

            <!-- Color Picker -->
            <div class="relative group">
                <div class="color-wrapper w-10 h-10 border-2 border-white/20 shadow-lg flex items-center justify-center bg-white/5 transition-transform active:scale-90">
                    <input type="color" id="color-input" value="#4ade80">

    <!-- Start Screen -->

            <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-purple-600/20 rounded-full blur-[80px]"></div>

        <div class="relative z-10 anim-float">
            <div class="hero-orbit" aria-hidden="true">

            <h1 class="text-6xl font-black tracking-tighter text-white mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                ORBIT<br><span class="text-transparent bg-clip-text title-gradient">GARDEN</span>

            <p class="title-kicker text-sm font-medium uppercase mb-8">

        <div class="space-y-6 max-w-xs mx-auto mb-12 relative z-10">

                    <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]"></div>

            Start Planting
        </button>
    </div>

<script>
/**
 * ORBIT GARDEN
 * A gravity sandbox about tending stable life-ready orbits.
 */

// --- CONFIGURATION ---
const CONFIG = {
    G: 0.4,             // Gravity constant
    dt: 0.016,          // Timestep
    subSteps: 4,        // Physics accuracy
    maxBodies: 150,
    dragPower: 0.06,
    
    // Habitable Zone logic (multipliers of star radius)
    zoneMin: 5.5,       // Too hot boundary
    zoneMax: 14.0,      // Too cold boundary
    
    types: {
        star: {
            id: 'star', label: 'STAR', mass: 4000, radius: 25, 
            color: '#fbbf24', glow: 60, isStar: true
        },
        planet: {
            id: 'planet', label: 'PLANET', mass: 150, radius: 8, 
            color: '#94a3b8', glow: 5, isPlanet: true
        },
        giant: {
            id: 'giant', label: 'GIANT', mass: 800, radius: 16, 
            color: '#d97706', glow: 10, isPlanet: false
        },
        blackhole: {
            id: 'blackhole', label: 'VOID', mass: 8000, radius: 12, 
            color: '#a855f7', glow: 40, isStar: false
        }
    }
};

// --- STATE ---
const state = {
    bodies: [],
    particles: [],
    selectedType: 'planet',
    customColor: null, // If set, overrides default type color
    running: false,
    paused: false,
    dragging: false,
    dragStart: { x: 0, y: 0 },
    dragCurr: { x: 0, y: 0 },
    lastTime: 0,
    habitableCount: 0,
    feedbackTimers: {},
    lastCollisionAt: 0
};

// --- APPROVED MEDIA MAPS ---
const MEDIA = {
    audio: {
        spawn: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
        collision: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
        habitable: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3',
        clear: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        pause: 'https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3',
        resume: 'https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        loop: 'https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3'
    },
    gifs: {
        impact: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
        success: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp'
    }
};

// --- AUDIO (Catalog-backed, gesture-safe) ---
// [agent-note][stage3] resolved-audio: spawn/collision/habitable/ui/loop -> catalogs/audios.json
// [agent-note][stage3] resolved-gif: impact/success feedback -> catalogs/gifs.json
// [agent-note][stage4] resolved-font-remap: title/hud=Orbitron ui=Rajdhani -> catalogs/fonts.json
const AudioSys = {
    enabled: false,
    loopAudio: null,
    sfxPool: new Map(),
    lastPlayed: {},
    init() {
        if (this.enabled) return;
        this.enabled = true;
        this.prime('spawn', MEDIA.audio.spawn, 4, 0.42);
        this.prime('collision', MEDIA.audio.collision, 4, 0.4);
        this.prime('habitable', MEDIA.audio.habitable, 3, 0.48);
        this.prime('clear', MEDIA.audio.clear, 2, 0.45);
        this.prime('uiClick', MEDIA.audio.uiClick, 3, 0.35);
        this.prime('pause', MEDIA.audio.pause, 2, 0.38);
        this.prime('resume', MEDIA.audio.resume, 2, 0.38);
        this.prime('start', MEDIA.audio.start, 2, 0.45);
        this.loopAudio = new Audio(MEDIA.audio.loop);
        this.loopAudio.loop = true;
        this.loopAudio.volume = 0.2;
        this.loopAudio.preload = 'auto';
    },
    prime(name, src, copies = 3, volume = 0.45) {
        const pool = [];
        for (let i = 0; i < copies; i++) {
            const a = new Audio(src);
            a.preload = 'auto';
            a.volume = volume;
            pool.push(a);
        }
        this.sfxPool.set(name, pool);
    },
    play(name, cooldown = 0) {
        if (!this.enabled) return;
        const now = performance.now();
        if (cooldown && this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return;
        this.lastPlayed[name] = now;
        const pool = this.sfxPool.get(name);
        if (!pool || !pool.length) return;
        const audio = pool.find((item) => item.paused || item.ended) || pool[0].cloneNode();
        try {
            audio.currentTime = 0;
            audio.volume = pool[0].volume;
            const maybePromise = audio.play();
            if (maybePromise && typeof maybePromise.catch === 'function') maybePromise.catch(() => {});
        } catch (_) {}
    },
    startLoop() {
        if (!this.enabled || !this.loopAudio) return;
        try {
            const maybePromise = this.loopAudio.play();
            if (maybePromise && typeof maybePromise.catch === 'function') maybePromise.catch(() => {});
        } catch (_) {}
    },
    pauseLoop() {
        if (this.loopAudio) this.loopAudio.pause();
    },
    spawn(mass) {
        this.play('spawn', 70);
    },
    collision() {
        this.play('collision', 90);
    },
    life() {
        this.play('habitable', 180);
    },
    ui() {
        this.play('uiClick', 60);
    },
    startGame() {
        this.play('start', 100);
        this.startLoop();
    },
    clear() {
        this.play('clear', 120);
    },
    setPaused(paused) {
        this.play(paused ? 'pause' : 'resume', 80);
        if (paused) this.pauseLoop();
        else this.startLoop();
    }
};

// --- PHYSICS & ENTITIES ---
class Body {
    constructor(x, y, typeKey, color, vx = 0, vy = 0) {
        const t = CONFIG.types[typeKey];
        this.pos = { x, y };
        this.vel = { x: vx, y: vy };
        this.type = typeKey;
        this.mass = t.mass;
        this.radius = t.radius;
        this.baseColor = color || t.color; // The color picked by user
        this.currColor = this.baseColor;   // The displayed color (changes with temp)
        this.glow = t.glow;
        this.isStar = !!t.isStar;
        this.isPlanet = !!t.isPlanet;
        
        // Planet State: 0=Frozen, 1=Habitable, 2=Scorched
        this.tempState = 0; 
        this.history = [];
        this.histTimer = 0;
    }

    update(dt) {
        // Trail logic
        this.histTimer++;
        if (this.histTimer % 4 === 0) {
            this.history.push({ x: this.pos.x, y: this.pos.y });
            if (this.history.length > 20) this.history.shift();
        }
    }
}

class Particle {
    constructor(x, y, color, speed = 1) {
        this.pos = { x, y };
        const angle = Math.random() * Math.PI * 2;
        const v = Math.random() * speed + 0.2;
        this.vel = { x: Math.cos(angle) * v, y: Math.sin(angle) * v };
        this.life = 1.0;
        this.color = color;
        this.decay = 0.02 + Math.random() * 0.03;
    }
    update() {
        this.pos.x += this.vel.x;
        this.pos.y += this.vel.y;
        this.life -= this.decay;
    }
}

function updatePhysics(dt) {
    if (state.paused) return;
    const steps = CONFIG.subSteps;
    const subDt = dt / steps;
    
    // Find stars for temp calculation
    const stars = state.bodies.filter(b => b.isStar);
    let currentHabitable = 0;

    for (let s = 0; s < steps; s++) {
        for (let i = 0; i < state.bodies.length; i++) {
            const a = state.bodies[i];
            
            // Temperature Logic (only once per frame effectively)
            if (s === 0 && a.isPlanet) {
                let closestDist = Infinity;
                let nearestStar = null;

                stars.forEach(star => {
                    const dx = star.pos.x - a.pos.x;
                    const dy = star.pos.y - a.pos.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < closestDist) {
                        closestDist = d;
                        nearestStar = star;
                    }
                });

                if (nearestStar) {
                    const r = nearestStar.radius;
                    if (closestDist < r * CONFIG.zoneMin) {
                        // Scorched
                        a.tempState = 2;
                        a.currColor = '#ef4444'; // Red
                    } else if (closestDist > r * CONFIG.zoneMax) {
                        // Frozen
                        a.tempState = 0;
                        a.currColor = '#bae6fd'; // Ice Blue
                    } else {
                        // Habitable
                        if (a.tempState !== 1) {
                            // Just became habitable
                            spawnExplosion(a.pos.x, a.pos.y, '#4ade80', 5);
                            AudioSys.life();
                            showGif('gif-success', 1500);
                            showStatus('Habitable orbit achieved', 1500);
                        }
                        a.tempState = 1;
                        a.currColor = '#4ade80'; // Green
                        currentHabitable++;
                    }
                } else {
                    // No star = Frozen
                    a.tempState = 0;
                    a.currColor = '#bae6fd';
                }
            }

            // Gravity & Collision
            for (let j = i + 1; j < state.bodies.length; j++) {
                const b = state.bodies[j];
                const dx = b.pos.x - a.pos.x;
                const dy = b.pos.y - a.pos.y;
                const distSq = dx*dx + dy*dy;
                const dist = Math.sqrt(distSq);
                const minDist = (a.radius + b.radius) * 0.75;

                if (dist < minDist) {
                    // Merge
                    const totalMass = a.mass + b.mass;
                    const bBig = b.mass > a.mass;
                    
                    a.vel.x = (a.vel.x * a.mass + b.vel.x * b.mass) / totalMass;
                    a.vel.y = (a.vel.y * a.mass + b.vel.y * b.mass) / totalMass;
                    a.pos.x = (a.pos.x * a.mass + b.pos.x * b.mass) / totalMass;
                    a.pos.y = (a.pos.y * a.mass + b.pos.y * b.mass) / totalMass;
                    
                    a.mass = totalMass;
                    a.radius = Math.pow(a.radius**3 + b.radius**3, 1/3);
                    
                    // If merging with a star, become a star
                    if (b.isStar || (bBig && b.isStar)) {
                        a.isStar = true;
                        a.isPlanet = false;
                        a.glow = Math.max(a.glow, b.glow) + 5;
                    }
                    
                    if (bBig) {
                        a.type = b.type;
                        if (!a.isPlanet) a.currColor = b.currColor; // Keep planet dynamic color logic separate
                    }

                    spawnExplosion(a.pos.x, a.pos.y, a.currColor, 10);
                    AudioSys.collision();
                    showGif('gif-impact', 1100);
                    showStatus('Collision surge detected', 1100);
                    state.bodies.splice(j, 1);
                    j--;
                    continue;
                }

                if (dist > minDist) {
                    const f = (CONFIG.G * a.mass * b.mass) / distSq;
                    const fx = (dx/dist) * f;
                    const fy = (dy/dist) * f;
                    a.vel.x += (fx/a.mass) * subDt;
                    a.vel.y += (fy/a.mass) * subDt;
                    b.vel.x -= (fx/b.mass) * subDt;
                    b.vel.y -= (fy/b.mass) * subDt;
                }
            }
            
            if (s === steps - 1) a.update(dt);
            else {
                a.pos.x += a.vel.x * subDt;
                a.pos.y += a.vel.y * subDt;
            }
        }
    }

    state.habitableCount = currentHabitable;
    
    // Cull far objects
    for (let i = state.bodies.length - 1; i >= 0; i--) {
        const b = state.bodies[i];
        if (Math.abs(b.pos.x) > 4000 || Math.abs(b.pos.y) > 4000) {
            state.bodies.splice(i, 1);
        }
    }
}

function showGif(id, duration = 1400) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    clearTimeout(state.feedbackTimers[id]);
    state.feedbackTimers[id] = setTimeout(() => el.classList.remove('show'), duration);
}

function showStatus(text, duration = 1400) {
    const el = document.getElementById('status-banner');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(state.feedbackTimers.status);
    state.feedbackTimers.status = setTimeout(() => el.classList.remove('show'), duration);
}

function spawnExplosion(x, y, color, count = 8) {
    for(let i=0; i<count; i++) state.particles.push(new Particle(x, y, color, 2));
}

function spawnBody(x, y, typeKey, color, vx, vy) {
    if (state.bodies.length >= CONFIG.maxBodies) return;
    const b = new Body(x, y, typeKey, color, vx, vy);
    state.bodies.push(b);
    AudioSys.spawn(b.mass);
    showStatus(`${CONFIG.types[typeKey].label} launched`, 900);
}

// --- RENDER ---
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d', { alpha: false });

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function render() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // Background
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, w, h);

    // Draw Habitable Zones (Rings around stars)
    state.bodies.forEach(b => {
        if (b.isStar) {
            // Goldilocks zone
            const minR = b.radius * CONFIG.zoneMin;
            const maxR = b.radius * CONFIG.zoneMax;
            
            ctx.beginPath();
            ctx.arc(b.pos.x, b.pos.y, (minR + maxR) / 2, 0, Math.PI*2);
            ctx.lineWidth = maxR - minR;
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)'; // Very faint green
            ctx.stroke();
            
            // Thin border lines for clarity
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.1)';
            ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, minR, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, maxR, 0, Math.PI*2); ctx.stroke();
        }
    });

    // Trails
    ctx.lineWidth = 1.5;
    state.bodies.forEach(b => {
        if (b.history.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = b.isPlanet ? b.currColor : b.baseColor;
        ctx.globalAlpha = 0.3;
        for (let i=0; i<b.history.length-1; i++) {
            ctx.moveTo(b.history[i].x, b.history[i].y);
            ctx.lineTo(b.history[i+1].x, b.history[i+1].y);
        }
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;

    // Bodies
    state.bodies.forEach(b => {
        const color = b.isPlanet ? b.currColor : b.baseColor;

        // Glow
        if (b.glow > 0) {
            const g = ctx.createRadialGradient(b.pos.x, b.pos.y, b.radius, b.pos.x, b.pos.y, b.radius + b.glow);
            g.addColorStop(0, color);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(b.pos.x, b.pos.y, b.radius + b.glow, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        // Main Body
        ctx.beginPath();
        ctx.arc(b.pos.x, b.pos.y, b.radius, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();

        // Details
        if (b.type === 'blackhole') {
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        } else if (b.isPlanet && b.tempState === 1) {
            // Draw "continents" or life indicators for habitable planets
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(b.pos.x - b.radius*0.3, b.pos.y - b.radius*0.3, b.radius*0.4, 0, Math.PI*2);
            ctx.fill();
        } else {
            // Simple shine
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(b.pos.x - b.radius*0.3, b.pos.y - b.radius*0.3, b.radius*0.3, 0, Math.PI*2);
            ctx.fill();
        }
    });

    // Particles
    state.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.pos.x, p.pos.y, 1.5, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Drag Line
    if (state.dragging) {
        const start = state.dragStart;
        const curr = state.dragCurr;
        
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(curr.x, curr.y);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Ghost
        const t = CONFIG.types[state.selectedType];
        ctx.beginPath();
        ctx.arc(start.x, start.y, t.radius, 0, Math.PI*2);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function loop(timestamp) {
    if (!state.lastTime) state.lastTime = timestamp;
    const dt = (timestamp - state.lastTime) / 1000;
    state.lastTime = timestamp;

    if (state.running) {
        updatePhysics(Math.min(dt, 0.1));
        for (let i = state.particles.length - 1; i >= 0; i--) {
            state.particles[i].update();
            if (state.particles[i].life <= 0) state.particles.splice(i, 1);
        }
    }
    render();
    
    // UI Updates
    document.getElementById('obj-count').innerText = state.bodies.length;
    document.getElementById('habitable-count').innerText = state.habitableCount;
    
    requestAnimationFrame(loop);
}

// --- UI & INPUT ---
function setType(key) {
    state.selectedType = key;
    state.customColor = null; // Reset custom color on type change
    
    const t = CONFIG.types[key];
    
    // Update UI
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${key}`).classList.add('active');
    
    // Reset picker
    const picker = document.getElementById('color-input');
    picker.value = t.color;
    document.getElementById('color-preview').style.backgroundColor = t.color;
    document.getElementById('color-preview').style.boxShadow = `0 0 10px ${t.color}`;
}

function setupUI() {
    const list = document.getElementById('type-list');
    Object.values(CONFIG.types).forEach(t => {
        const btn = document.createElement('button');
        btn.id = `btn-${t.id}`;
        btn.className = `type-btn flex-shrink-0 w-16 h-14 rounded-xl flex flex-col items-center justify-center gap-1 bg-white/5 border border-white/10`;
        btn.innerHTML = `
            <div class="w-3 h-3 rounded-full" style="background:${t.color}; box-shadow: 0 0 5px ${t.color}"></div>
            <span class="text-[9px] font-bold text-gray-300 tracking-wider">${t.label}</span>
        `;
        btn.onclick = (e) => { e.stopPropagation(); AudioSys.ui(); setType(t.id); };
        list.appendChild(btn);
    });

    const picker = document.getElementById('color-input');
    picker.addEventListener('input', (e) => {
        AudioSys.ui();
        state.customColor = e.target.value;
        const p = document.getElementById('color-preview');
        p.style.backgroundColor = e.target.value;
        p.style.boxShadow = `0 0 10px ${e.target.value}`;
    });

    document.getElementById('btn-start').onclick = () => {
        AudioSys.init();
        AudioSys.startGame();
        const s = document.getElementById('start-screen');
        s.style.opacity = '0';
        s.style.transition = 'opacity 0.5s';
        setTimeout(() => {
            s.style.display = 'none';
            state.running = true;
            showStatus('Garden core online', 1400);
            
            // Initial System
            const cx = window.innerWidth/2, cy = window.innerHeight/2;
            spawnBody(cx, cy, 'star', '#fbbf24', 0, 0);
            
            // Spawn a habitable planet
            spawnBody(cx + 200, cy, 'planet', null, 0, 2.8);
        }, 500);
    };

    document.getElementById('btn-clear').onclick = (e) => {
        e.stopPropagation();
        AudioSys.ui();
        AudioSys.clear();
        state.bodies = [];
        state.particles = [];
        showStatus('Sky garden reset', 1100);
    };
    
    document.getElementById('btn-pause').onclick = (e) => {
        e.stopPropagation();
        AudioSys.ui();
        state.paused = !state.paused;
        AudioSys.setPaused(state.paused);
        showStatus(state.paused ? 'Orbit sim paused' : 'Orbit sim resumed', 1000);
        document.getElementById('icon-pause').classList.toggle('hidden');
        document.getElementById('icon-play').classList.toggle('hidden');
    };

    setType('planet');
}

function setupInput() {
    const el = document.getElementById('game-root');
    const getPos = (e) => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
    };

    const start = (e) => {
        if (!state.running || state.paused) return;
        if (e.target.closest('button') || e.target.closest('.color-wrapper')) return;
        
        state.dragging = true;
        const p = getPos(e);
        state.dragStart = p;
        state.dragCurr = p;
    };

    const move = (e) => {
        if (!state.dragging) return;
        if (e.cancelable) e.preventDefault();
        state.dragCurr = getPos(e);
    };

    const end = (e) => {
        if (!state.dragging) return;
        state.dragging = false;
        
        const dx = state.dragStart.x - state.dragCurr.x;
        const dy = state.dragStart.y - state.dragCurr.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        let vx = 0, vy = 0;
        if (dist > 10) {
            vx = dx * CONFIG.dragPower;
            vy = dy * CONFIG.dragPower;
        }
        
        const type = CONFIG.types[state.selectedType];
        // Use custom color if set, else type default, else null (for planet dynamic logic)
        const color = state.customColor || (type.id === 'planet' ? null : type.color);
        
        spawnBody(state.dragStart.x, state.dragStart.y, state.selectedType, color, vx, vy);
    };

    el.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchmove', move, { passive: false });
    el.addEventListener('touchend', end);
}

window.onload = () => {
    document.getElementById('gif-impact').src = MEDIA.gifs.impact;
    document.getElementById('gif-success').src = MEDIA.gifs.success;
    window.addEventListener('resize', resize);
    resize();
    setupUI();
    setupInput();
    requestAnimationFrame(loop);
};
</script>
</body>
