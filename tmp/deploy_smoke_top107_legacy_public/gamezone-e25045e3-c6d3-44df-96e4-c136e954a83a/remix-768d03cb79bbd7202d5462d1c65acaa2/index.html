<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Corner Stand Tycoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-primary: #FBC02D;
            --theme-bg: #FFF9C4;
            --theme-accent: #F57F17;
            --theme-ink: #2f1d12;
            --theme-panel: rgba(255, 250, 235, 0.96);
            --theme-glow: rgba(245, 127, 23, 0.35);
            --theme-spark: rgba(255, 255, 255, 0.65);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.7), transparent 36%),
                linear-gradient(180deg, color-mix(in srgb, var(--theme-primary) 18%, white 82%), var(--theme-bg) 38%, color-mix(in srgb, var(--theme-accent) 12%, var(--theme-bg) 88%));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--theme-ink);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.5s ease;
        }

        body {
            position: relative;
        }

        #app-root {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #hud-area {
            flex: 0 0 auto;
            padding: calc(env(safe-area-inset-top) + 10px) 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 18%;
            box-sizing: border-box;
        }

        #game-area {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            transition: background-color 75ms ease;
            touch-action: none; /* keep gameplay taps scoped to the active surface */
        }

        #game-area:active {
            background: rgba(255, 255, 255, 0.10);
        }

        #upgrade-panel {
            flex: 0 0 auto;
            height: 52%;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        #view-upgrades,
        #view-franchise {
            box-sizing: border-box;
        }

        #view-franchise {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0;
        }

        #view-franchise.hidden,
        #view-upgrades.hidden {
            display: none;
        }

        #btn-start,
        #tab-upgrades,
        #tab-franchise,
        #btn-rebirth,
        .upgrade-item {
            cursor: pointer;
            touch-action: manipulation;
        }

        .hidden {
            display: none !important;
        }

        /* Background Gradient */
        .bg-gradient-radial {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.8), transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Particles Canvas */
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* Typography */
        .font-header { font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif; letter-spacing: 0.04em; }
        .text-shadow { text-shadow: 0px 2px 0px rgba(0,0,0,0.1); }
        .arcade-badge {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,245,218,0.95));
            border: 2px solid rgba(255,255,255,0.7);
            box-shadow: 0 10px 24px rgba(88, 40, 10, 0.14), 0 0 0 4px rgba(255,255,255,0.16);
            backdrop-filter: blur(10px);
        }

        /* Main Game Area */
        #game-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Icon (Product) */
        #main-icon-container {
            cursor: pointer;
            filter: drop-shadow(0 18px 18px rgba(74, 36, 9, 0.18));
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
            z-index: 10;
            position: relative;
            width: min(52vw, 220px);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
        }
        #main-icon-container::before {
            content: "";
            position: absolute;
            inset: 2%;
            border-radius: 999px;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.92), rgba(255,255,255,0.18) 30%, transparent 31%),
                linear-gradient(180deg, color-mix(in srgb, var(--theme-primary) 82%, white 18%), color-mix(in srgb, var(--theme-accent) 24%, var(--theme-primary) 76%));
            box-shadow:
                inset 0 -10px 0 rgba(0,0,0,0.08),
                inset 0 8px 12px rgba(255,255,255,0.35),
                0 16px 30px rgba(117, 54, 12, 0.18),
                0 0 0 8px rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.58);
        }
        #main-icon-container::after {
            content: "";
            position: absolute;
            inset: 14%;
            border-radius: 999px;
            border: 2px dashed rgba(255,255,255,0.46);
            opacity: 0.9;
        }
        #main-icon-emoji {
            font-size: clamp(84px, 22vw, 128px);
            line-height: 1;
            display: block;
            position: relative;
            z-index: 1;
            transform: translateY(-2px);
            filter: drop-shadow(0 5px 0 rgba(255,255,255,0.3));
        }

        /* Mascot */
        #mascot-container {
            position: absolute;
            right: -40px;
            bottom: -20px;
            z-index: 11;
            transform-origin: bottom center;
            transition: transform 0.1s ease;
            pointer-events: none; /* Let clicks pass to main area usually, but visuals matter */
        }
        #mascot-emoji {
            font-size: clamp(56px, 14vw, 78px);
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.14));
        }

        /* Speech Bubble */
        #speech-bubble {
            position: absolute;
            top: -60px;
            right: -20px;
            background: linear-gradient(180deg, #fffef8, #fff2ca);
            padding: 8px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 10px 18px rgba(111, 52, 11, 0.16);
            border: 2px solid rgba(255,255,255,0.76);
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            color: #53351f;
            font-size: 14px;
            opacity: 0;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
            z-index: 20;
        }
        #speech-bubble.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #feedback-gifs {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
        }
        .feedback-gif {
            position: absolute;
            width: min(28vw, 120px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 3px solid rgba(255,255,255,0.75);
            box-shadow: 0 12px 30px rgba(60, 23, 6, 0.18);
            opacity: 0;
            transform: scale(0.7) translateY(12px);
            transition: opacity 0.2s ease, transform 0.22s ease;
            background: rgba(255,255,255,0.4);
        }
        .feedback-gif.show {
            opacity: 0.95;
            transform: scale(1) translateY(0);
        }
        #gif-serve {
            right: 12px;
            top: 14px;
        }
        #gif-hype {
            left: 12px;
            bottom: 14px;
        }

        /* UI Panels */
        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 252, 244, 0.97), rgba(255, 247, 225, 0.98));
            box-shadow: 0px -10px 34px rgba(69, 31, 8, 0.12);
            border-top: 1px solid rgba(255,255,255,0.72);
            border-radius: 2rem 2rem 0 0;
        }

        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        /* Interactive Elements */
        .btn-press {
            transition: transform 0.05s, filter 0.1s;
        }
        .btn-press:active:not(:disabled) {
            transform: scale(0.96);
            filter: brightness(0.95);
        }
        
        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }
        
        @keyframes bounce-mascot {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.05); }
        }
        .mascot-idle { animation: bounce-mascot 2s ease-in-out infinite; }

        /* Upgrade Item Styles */
        .upgrade-item {
            transition: background-color 0.2s, opacity 0.2s, transform 0.18s ease, box-shadow 0.18s ease;
        }
        .upgrade-item:active {
            transform: scale(0.985);
        }
        .upgrade-ad {
            border-left: 4px solid #818cf8; 
            background: linear-gradient(90deg, #f5f3ff 0%, #ffffff 100%);
        }
        .upgrade-click {
            border-left: 4px solid #f97316;
            background: linear-gradient(90deg, #fff7ed 0%, #ffffff 100%);
        }
        .upgrade-auto {
            border-left: 4px solid #22c55e;
            background: linear-gradient(90deg, #f0fdf4 0%, #ffffff 100%);
        }

        /* Start Screen */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.4), transparent 30%),
                linear-gradient(135deg, color-mix(in srgb, var(--theme-primary) 72%, white 28%), var(--theme-accent));
        }
    </style>
</head>
<body>

<!-- Audio -->
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" loop preload="auto"></audio>
<audio id="sfx_tap" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>

<!-- Main Layout Container -->

    <!-- FOOTER: Upgrade Panel -->
    <footer id="upgrade-panel" class="flex-none h-[52%] glass-panel flex flex-col z-20">

        <div class="flex border-b border-gray-100/50 flex-none">

            <button id="tab-franchise" class="flex-1 py-4 font-header text-gray-400 border-b-4 border-transparent bg-gray-50/50 rounded-tr-2xl transition-colors">EMPIRE</button>

        <!-- Content Area -->

                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl">

                </button>
            </div>
        </div>
    </footer>
</div>

<!-- Start Screen -->
<div id="start-screen" class="absolute inset-0 z-[100] flex flex-col items-center justify-center p-8 text-center transition-opacity duration-500">
    <div class="w-40 h-40 bg-white/95 rounded-full flex items-center justify-center shadow-2xl mb-8 animate-bounce relative border-4 border-white/50">

</div>

    "Next order!", "Fresh batch!", "Keep it moving!", "Nice sale!", "More cups!",
    "Quick squeeze!", "Serve hot!", "Big combo!", "Rush hour!", "Chain growth!"
];

const state = {

    clickPower: 1,

    franchiseIndex: 0,
    upgrades: [],

};

// --- Audio System ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {};
let audioReady = false;
let bgmStarted = false;
let tapCooldown = 0;
let activeGifTimer = null;
const GIFS = {
    serve: document.getElementById('gif-serve'),
    hype: document.getElementById('gif-hype')
};

function initAudio() {
    ['bgm', 'sfx_tap', 'sfx_buy', 'sfx_win'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.preload = 'auto';
            sounds[id] = el;
        }
    });
}

function unlockAudio() {
    audioReady = true;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function ensureBgm() {
    if (!audioReady || bgmStarted) return;
    const bgm = sounds.bgm;
    if (!bgm) return;
    bgm.volume = 0.2;
    bgm.currentTime = 0;
    bgm.play().then(() => {
        bgmStarted = true;
    }).catch(() => {});
}

function playSound(id) {
    if (!audioReady) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const s = sounds[id];
    if (!s) return;

    if (id === 'bgm') {
        ensureBgm();
        return;
    }

    const now = performance.now();
    if (id === 'sfx_tap' && now - tapCooldown < 75) return;
    if (id === 'sfx_tap') tapCooldown = now;

    try {
        s.pause();
        s.currentTime = 0;
        s.volume = id === 'sfx_tap' ? 0.18 : id === 'sfx_buy' ? 0.32 : 0.42;
        s.play().catch(() => {});
    } catch (err) {}
}

function showFeedbackGif(type, duration = 900) {
    const gif = GIFS[type];
    if (!gif) return;
    gif.classList.add('show');
    clearTimeout(activeGifTimer);
    activeGifTimer = setTimeout(() => {
        gif.classList.remove('show');
    }, duration);
}

// --- Logic ---
function formatMoney(n) {
    if (n < 0) n = 0;
    if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
    if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'k';
    return '$' + Math.floor(n);
}

function calcStats() {
    let mps = 0;
    let click = 1;
    state.upgrades.forEach(u => {
        if (u.type === 'auto' || u.type === 'ad') {
            mps += u.val * u.count;
        } else if (u.type === 'click') {
            click += u.val * u.count;
        }
    });
    state.mps = mps * state.multiplier;
    state.clickPower = click * state.multiplier;
}

function loadFranchise(idx) {
    state.franchiseIndex = idx;
    const f = FRANCHISES[idx];

    // Apply Theme
    const root = document.documentElement;
    root.style.setProperty('--theme-bg', f.theme.bg);
    root.style.setProperty('--theme-primary', f.theme.primary);
    root.style.setProperty('--theme-accent', f.theme.accent);

    document.getElementById('franchise-name').textContent = f.name;
    document.getElementById('franchise-name').style.color = f.theme.accent;
    document.getElementById('main-icon-emoji').textContent = f.icon;
    document.getElementById('mascot-emoji').textContent = f.mascot;

    // Reset Upgrades with new list
    state.upgrades = f.items.map(i => ({ ...i, count: 0, currentCost: i.cost }));
    
    renderUpgrades();
    calcStats();
}

function renderUpgrades() {
    const list = document.getElementById('view-upgrades');
    list.innerHTML = '';
    
    state.upgrades.forEach((u, i) => {
        const el = document.createElement('div');
        
        let styleClass = 'upgrade-item flex justify-between items-center p-4 border-b border-gray-100 active:bg-gray-100/50 cursor-pointer select-none ';
        
        if (u.type === 'ad') styleClass += 'upgrade-ad';
        else if (u.type === 'click') styleClass += 'upgrade-click';
        else styleClass += 'upgrade-auto';
        
        el.className = styleClass;
        el.id = `upg-${i}`;
        el.onclick = (e) => {
            e.stopPropagation();
            buyUpgrade(i);
        };
        
        // Labels
        let typeLabel = '';
        let typeColor = '';
        if (u.type === 'click') {
            typeLabel = `+${u.val} Click`;
            typeColor = 'text-orange-500';
        } else if (u.type === 'ad') {
            typeLabel = `+${u.val}/s (Ad)`;
            typeColor = 'text-indigo-500';
        } else {
            typeLabel = `+${u.val}/s`;
            typeColor = 'text-green-600';
        }

        el.innerHTML = `
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center text-2xl shadow-sm border border-gray-100">
                    ${u.icon}
                </div>
                <div>
                    <div class="font-header text-gray-800 text-lg leading-tight">${u.name}</div>
                    <div class="text-xs ${typeColor} font-bold mt-0.5 uppercase tracking-wider">
                        ${typeLabel}
                    </div>
                </div>
            </div>
            <div class="text-right">
                <div class="font-bold text-gray-400 transition-colors" id="cost-${i}">$${formatMoney(u.currentCost)}</div>
                <div class="inline-block bg-gray-200 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold mt-1 min-w-[20px] text-center" id="count-${i}">0</div>
            </div>
        `;
        list.appendChild(el);
    });
}

function buyUpgrade(i) {
    const u = state.upgrades[i];
    if (state.money >= u.currentCost) {
        state.money -= u.currentCost;
        u.count++;
        u.currentCost = Math.floor(u.currentCost * 1.25);
        playSound('sfx_buy');
        showFeedbackGif('serve', 850);
        calcStats();
        updateUI();
        
        // Visual feedback
        const el = document.getElementById(`upg-${i}`);
        const originalBg = el.style.backgroundColor;
        el.style.backgroundColor = 'rgba(0,0,0,0.05)';
        setTimeout(() => el.style.backgroundColor = originalBg, 100);
    } else {
        playSound('sfx_tap');
    }
}

function attemptRebirth() {
    const f = FRANCHISES[state.franchiseIndex];
    if (state.money >= f.baseRebirth) {
        if (state.franchiseIndex < FRANCHISES.length - 1) {
            state.franchiseIndex++;
        }
        state.money = 0;
        state.multiplier *= 3;
        loadFranchise(state.franchiseIndex);
        playSound('sfx_win');
        showFeedbackGif('hype', 1600);
        
        // Reset Tabs
        document.getElementById('tab-upgrades').click();
        
        // Big Explosion
        spawnParticles(window.innerWidth/2, window.innerHeight/2, 50);
    }
}

// --- Canvas & Particles ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let floaters = [];

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
}

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 4 + 2;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 1.0;
        this.color = FRANCHISES[state.franchiseIndex].theme.accent;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Floater {
    constructor(x, y, txt) {
        this.x = x;
        this.y = y;
        this.txt = txt;
        this.life = 1.0;
        this.vy = -3;
    }
    update() {
        this.y += this.vy;
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = '600 28px "Rajdhani", system-ui, sans-serif';
        ctx.fillStyle = '#4CAF50';
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.strokeText(this.txt, this.x, this.y);
        ctx.fillText(this.txt, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(x, y, count=8) {
    for(let i=0; i<count; i++) particles.push(new Particle(x, y));
}

function spawnFloater(x, y, txt) {
    floaters.push(new Floater(x, y, txt));
}

function gameLoop() {
    const now = Date.now();
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    
    if (dt > 0 && dt < 1) {
        state.money += state.mps * dt;
    }
    
    // Render Particles
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(); p.draw(ctx); });
    
    floaters = floaters.filter(f => f.life > 0);
    floaters.forEach(f => { f.update(); f.draw(ctx); });
    
    updateUI();
    requestAnimationFrame(gameLoop);
}

function updateUI() {
    document.getElementById('score-display').textContent = formatMoney(state.money);
    document.getElementById('mps-display').textContent = formatMoney(state.mps).replace('$','');
    document.getElementById('click-display').textContent = formatMoney(state.clickPower).replace('$','');
    document.getElementById('multiplier-display').textContent = state.multiplier;
    
    // Upgrades
    state.upgrades.forEach((u, i) => {
        const costEl = document.getElementById(`cost-${i}`);
        const countEl = document.getElementById(`count-${i}`);
        const row = document.getElementById(`upg-${i}`);
        
        if (costEl) {
            costEl.textContent = '$' + formatMoney(u.currentCost).replace('$','');
            countEl.textContent = u.count;
            
            if (state.money >= u.currentCost) {
                costEl.classList.remove('text-gray-400');
                costEl.classList.add('text-green-600');
                row.style.opacity = '1';
            } else {
                costEl.classList.remove('text-green-600');
                costEl.classList.add('text-gray-400');
                row.style.opacity = '0.7';
            }
            
            if (u.count > 0) {
                countEl.className = "inline-block text-white text-[10px] px-2 py-0.5 rounded-full font-bold mt-1 min-w-[20px] text-center";
                countEl.style.backgroundColor = FRANCHISES[state.franchiseIndex].theme.accent;
            }
        }
    });

    // Rebirth
    const f = FRANCHISES[state.franchiseIndex];
    const btn = document.getElementById('btn-rebirth');
    document.getElementById('rebirth-cost').textContent = formatMoney(f.baseRebirth);
    document.getElementById('rebirth-current').textContent = state.multiplier;
    document.getElementById('rebirth-next').textContent = state.multiplier * 3;
    
    if (state.money >= f.baseRebirth) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'shadow-none');
    } else {
        btn.disabled = true;
        btn.classList.add('opacity-50', 'shadow-none');
    }
}

// --- Interaction ---
const gameArea = document.getElementById('game-area');
const speechBubble = document.getElementById('speech-bubble');
let speechTimeout;

function triggerMascotSpeech() {
    if (Math.random() > 0.3) return; // 30% chance
    
    const phrase = MASCOT_PHRASES[Math.floor(Math.random() * MASCOT_PHRASES.length)];
    speechBubble.textContent = phrase;
    speechBubble.classList.add('show');
    
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => {
        speechBubble.classList.remove('show');
    }, 1000);
}

gameArea.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    unlockAudio();
    ensureBgm();

    state.money += state.clickPower;
    playSound('sfx_tap');
    
    // Animate Main Icon
    const icon = document.getElementById('main-icon-container');
    const mascot = document.getElementById('mascot-container');
    
    icon.style.transform = 'scale(0.9)';
    mascot.style.transform = 'translateY(-15px) scale(1.1)'; // Jump
    
    setTimeout(() => {
        icon.style.transform = 'scale(1)';
        mascot.style.transform = 'translateY(0) scale(1)';
    }, 100);
    
    triggerMascotSpeech();
    if (Math.random() > 0.55) showFeedbackGif('serve', 700);
    spawnParticles(e.clientX, e.clientY);
    spawnFloater(e.clientX + (Math.random()*40-20), e.clientY - 40, '+' + formatMoney(state.clickPower));
});

// Tabs
const tabUpgrades = document.getElementById('tab-upgrades');
const tabFranchise = document.getElementById('tab-franchise');
const viewUpgrades = document.getElementById('view-upgrades');
const viewFranchise = document.getElementById('view-franchise');

tabUpgrades.onclick = () => {
    viewUpgrades.classList.remove('hidden');
    viewFranchise.classList.add('hidden');
    tabUpgrades.className = "flex-1 py-4 font-header text-gray-800 border-b-4 border-yellow-500 bg-white/50 rounded-tl-2xl transition-colors";
    tabFranchise.className = "flex-1 py-4 font-header text-gray-400 border-b-4 border-transparent bg-gray-50/50 rounded-tr-2xl transition-colors";
};

tabFranchise.onclick = () => {
    viewUpgrades.classList.add('hidden');
    viewFranchise.classList.remove('hidden');
    tabFranchise.className = "flex-1 py-4 font-header text-indigo-900 border-b-4 border-indigo-500 bg-indigo-50/50 rounded-tr-2xl transition-colors";
    tabUpgrades.className = "flex-1 py-4 font-header text-gray-400 border-b-4 border-transparent bg-gray-50/50 rounded-tl-2xl transition-colors";
};

document.getElementById('btn-rebirth').onclick = attemptRebirth;

document.getElementById('btn-rebirth').addEventListener('pointerdown', unlockAudio, { passive: true });
tabUpgrades.addEventListener('pointerdown', () => playSound('sfx_buy'), { passive: true });
tabFranchise.addEventListener('pointerdown', () => playSound('sfx_buy'), { passive: true });

// Start
document.getElementById('btn-start').onclick = () => {
    unlockAudio();
    const ss = document.getElementById('start-screen');
    ss.style.opacity = '0';
    setTimeout(() => ss.style.display = 'none', 500);
    
    playSound('sfx_win');
    ensureBgm();
    state.lastTick = Date.now();
    gameLoop();
};

window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    initAudio();
    resize();
    loadFranchise(0);
});

</script>
