<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcade Diner Rush</title>
    <!-- [agent-note][stage4] resolved-font: title/button -> Audiowide, ui/hud -> Orbitron from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #180f2d;
            --bg-deep: #090611;
            --sky-top: #31215e;
            --sky-bottom: #151022;
            --panel-bg: rgba(16, 12, 35, 0.82);
            --panel-border: rgba(142, 232, 255, 0.34);
            --panel-shadow: 0 20px 50px rgba(1, 2, 10, 0.52);
            --text: #f8f6ff;
            --muted: rgba(232, 239, 255, 0.82);
            --accent: #ffd75e;
            --accent-strong: #ff9e4f;
            --cyan: #7ef9ff;
            --cyan-soft: rgba(126, 249, 255, 0.18);
            --danger: #ff5f7a;
            --button-green-top: #53f0ab;
            --button-green-bottom: #0f9e73;
            --counter-top: #9f5524;
            --counter-front: #5d2814;
            --hud-bg: rgba(11, 10, 25, 0.62);
            --hud-border: rgba(255, 215, 94, 0.34);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(125, 94, 255, 0.3), transparent 32%),
                linear-gradient(180deg, var(--sky-top), var(--bg-deep));
            color: var(--text);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at top, rgba(255, 214, 94, 0.1), transparent 22%),
                linear-gradient(180deg, var(--bg), #0b0814 68%);
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(126, 249, 255, 0.05) 50%, transparent 100%);
            background-size: 220px 100%;
            opacity: 0.75;
            animation: lightSweep 9s linear infinite;
        }

        .game-container::after {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 159, 79, 0.16), transparent 16%),
                radial-gradient(circle at 80% 18%, rgba(126, 249, 255, 0.12), transparent 20%),
                radial-gradient(circle at 50% 75%, rgba(255, 255, 255, 0.05), transparent 28%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(36, 27, 74, 0.94), rgba(15, 10, 31, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            position: relative;
            z-index: 50;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 30%),
                linear-gradient(180deg, transparent, rgba(126, 249, 255, 0.08));
            pointer-events: none;
        }

        .start-screen {
            padding: 2.25rem 2rem 2rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: min(92vw, 470px);
        }

        .start-screen:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 58px rgba(1, 2, 10, 0.6);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.9rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(126, 249, 255, 0.12);
            border: 1px solid rgba(126, 249, 255, 0.28);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cyan);
        }

        .chef-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 0.9rem;
            border-radius: 24px;
            display: grid;
            place-items: center;
            font-size: 2.5rem;
            background:
                radial-gradient(circle at 35% 30%, #fff7d6, #ffcf66 52%, #ff9252 100%);
            box-shadow:
                0 0 0 6px rgba(255, 255, 255, 0.08),
                0 12px 24px rgba(0, 0, 0, 0.3),
                0 0 24px rgba(255, 215, 94, 0.3);
            position: relative;
            z-index: 1;
        }

        .title {
            margin: 0 0 0.45rem;
            color: #fff4bf;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.4rem, 8vw, 4.25rem);
            line-height: 0.98;
            letter-spacing: 0.08em;
            text-shadow:
                0 0 0 rgba(0, 0, 0, 0),
                0 4px 0 rgba(73, 34, 9, 0.95),
                0 0 18px rgba(255, 215, 94, 0.28);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 600;
            color: var(--muted);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.42);
        }

        .food-row {
            display: flex;
            gap: 0.9rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .food-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 84px;
            padding: 0.65rem 0.55rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .food-dot {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            margin-bottom: 0.5rem;
            position: relative;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.2);
        }

        .food-dot::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.22);
        }

        .food-burger { background: linear-gradient(180deg, #ff7c73, #dc3e4c); }
        .food-fries { background: linear-gradient(180deg, #ffe373, #f2a122); }
        .food-soda { background: linear-gradient(180deg, #79caff, #3667ff); }

        .food-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .shift-note {
            margin: 0 0 1.4rem;
            padding: 0.8rem 0.95rem;
            border-radius: 16px;
            background: rgba(255, 215, 94, 0.1);
            border: 1px solid rgba(255, 215, 94, 0.18);
            color: rgba(255, 247, 215, 0.92);
            font-size: 0.92rem;
            line-height: 1.35;
        }

        .action-btn {
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.08em;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.18s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
        }

        .action-btn:hover {
            filter: brightness(1.06);
        }

        .action-btn:active {
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
            transform: translateY(5px);
        }

        .start-btn {
            padding: 1rem 2.5rem;
            font-size: clamp(1rem, 3vw, 1.35rem);
            color: #0b1020;
            background: linear-gradient(to bottom, var(--button-green-top), var(--button-green-bottom));
        }

        .game-over-screen {
            display: none;
            padding: 2rem 1.5rem 1.7rem;
            width: min(92vw, 420px);
        }

        .game-over-screen.show {
            display: block;
        }

        .game-over-title {
            margin: 0 0 0.35rem;
            color: #ffd3dc;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.1rem, 7vw, 3.4rem);
            letter-spacing: 0.06em;
            text-shadow: 0 0 16px rgba(255, 95, 122, 0.25);
        }

        .game-over-copy {
            margin: 0 0 0.9rem;
            color: rgba(255, 255, 255, 0.88);
            font-size: 1.08rem;
            font-weight: 600;
        }

        .final-score {
            margin: 0 0 1.5rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.4rem, 7vw, 4rem);
            color: var(--accent);
            text-shadow: 0 0 16px rgba(255, 215, 94, 0.25);
        }

        .restart-btn {
            padding: 0.85rem 2rem;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(180deg, #ff827c, #d73c58);
        }

        .restart-btn:hover {
            background: linear-gradient(180deg, #ff8f88, #d73c58);
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: none;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hud.show {
            display: flex;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .score-display {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.6rem 0.9rem;
            border-radius: 18px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
             font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.9rem, 3.1vw, 1.2rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .score-icon {
            font-size: 1.1em;
            filter: drop-shadow(0 0 10px rgba(255, 215, 94, 0.4));
        }

        .score-value {
            color: var(--accent);
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 7.5rem;
            width: min(26vw, 120px);
            aspect-ratio: 1;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(13, 10, 25, 0.72);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            opacity: 0;
            transform: scale(0.88) translateY(10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 20;
        }

        .feedback-gif.show {
            opacity: 0.96;
            transform: scale(1) translateY(0);
        }

        .feedback-gif.fail {
            left: 1rem;
            right: auto;
            bottom: 8rem;
            width: min(24vw, 108px);
        }

        .hidden {
            display: none !important;
        }

        @keyframes lightSweep {
            from { transform: translateX(-12%); }
            to { transform: translateX(12%); }
        }

        @media (max-width: 640px) {
            .start-screen,
            .game-over-screen {
                width: min(92vw, 420px);
                padding: 1.4rem 1.1rem 1.25rem;
                border-radius: 20px;
            }

            .chef-icon {
                width: 62px;
                height: 62px;
                border-radius: 20px;
                font-size: 2.15rem;
            }

            .food-row {
                gap: 0.65rem;
                margin-bottom: 1.2rem;
            }

            .food-item {
                min-width: 76px;
                padding: 0.55rem 0.45rem;
            }

            .food-dot {
                width: 46px;
                height: 46px;
                border-radius: 14px;
            }

            .hud {
                padding: 0.8rem;
            }

            .score-display {
                padding: 0.5rem 0.75rem;
                border-radius: 16px;
            }

            .feedback-gif {
                bottom: 6.7rem;
                width: min(28vw, 96px);
            }

            .feedback-gif.fail {
                bottom: 7.1rem;
                width: min(26vw, 88px);
            }

            .shift-note {
                font-size: 0.86rem;
                margin-bottom: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json | keep off playfield -->
            <img id="success-gif" class="feedback-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction" aria-hidden="true">
            <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction" aria-hidden="true">
            <div id="start-screen" class="panel start-screen">
                <div class="hero-badge">⭐ Neon Grill Hero</div>
                <div class="chef-icon" aria-hidden="true">🧑‍🍳</div>
                <h1 class="title">ARCADE DINER RUSH</h1>
                <p class="subtitle">Tap the matching snack before the counter backs up.</p>
                <div class="food-row">
                    <div class="food-item"><div class="food-dot food-burger"></div><span class="food-label">Burger</span></div>
                    <div class="food-item"><div class="food-dot food-fries"></div><span class="food-label">Fries</span></div>
                    <div class="food-item"><div class="food-dot food-soda"></div><span class="food-label">Soda</span></div>
                </div>
                <p class="shift-note">Serve fast, keep the mascot smiling, and don't let the neon lunch line melt down.</p>
                <button id="start-btn" class="action-btn start-btn">START SHIFT</button>
            </div>

            <div id="game-over-screen" class="panel game-over-screen">
                <div class="hero-badge">⚡ Rush Report</div>
                <h2 class="game-over-title">SHIFT OVER</h2>
                <p class="game-over-copy">Orders cleared</p>
                <div class="final-score"><span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-btn restart-btn">Run It Back</button>
            </div>

            <div id="hud" class="hud">
                <div class="score-display">
                    <span class="score-icon" aria-hidden="true">🍽️</span>
                    <span>Orders:</span>
                    <span id="score" class="score-value">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                serve: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                combo: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                wrong: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayTimes = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = "auto";
                this.sfx = {};
                this.sfxVolumes = {
                    start: 0.55,
                    serve: 0.48,
                    combo: 0.52,
                    wrong: 0.56,
                    warning: 0.4,
                    gameOver: 0.62
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = "auto";
                }
            }
            unlock() {
                this.unlocked = true;
            }
            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, cooldown = 0) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < cooldown) {
                    return;
                }
                this.lastPlayTimes[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolumes[key] ?? 0.5;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let lastTime = 0;
        let shake = 0;

        // Game Entities
        let customer = null;
        let particles = [];
        let buttons = [];
        const successGif = document.getElementById("success-gif");
        const failGif = document.getElementById("fail-gif");

        // Difficulty
        let currentLevelPatience = 3000;
        let warningPlayed = false;
        let feedbackTimer = 0;

        const ENABLE_ANIMATIONS = true;

        // Colors
        const COLORS = {
            burger: '#EF4444',
            fries: '#FBBF24',
            soda: '#3B82F6',
            counter: '#78350f'
        };

        const CHARACTER_STYLE = {
            body: '#fff3dc',
            apron: '#62e0ba',
            outline: '#2a1f49',
            glow: '#ffd75e',
            blush: '#ff7f9b'
        };

        const ORDERS = ['burger', 'fries', 'soda'];

        /** 4. RESIZE HANDLER */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            setupButtons();
        }
        window.addEventListener('resize', resize);

        function setupButtons() {
            const btnSize = Math.min(width / 4, 100);
            const yPos = height - btnSize - 40;
            const gap = 20;
            const totalWidth = (btnSize * 3) + (gap * 2);
            const startX = (width - totalWidth) / 2;

            buttons = [
                { type: 'burger', x: startX, y: yPos, w: btnSize, h: btnSize, color: COLORS.burger, label: '🍔' },
                { type: 'fries', x: startX + btnSize + gap, y: yPos, w: btnSize, h: btnSize, color: COLORS.fries, label: '🍟' },
                { type: 'soda', x: startX + (btnSize + gap) * 2, y: yPos, w: btnSize, h: btnSize, color: COLORS.soda, label: '🥤' }
            ];
        }

        /** 5. GAME LOGIC */
        class Customer {
            constructor() {
                this.type = ORDERS[Math.floor(Math.random() * ORDERS.length)];
                this.x = width + 100;
                this.targetX = width / 2;
                this.y = height / 2;
                this.state = 'entering';
                this.patienceMax = Math.max(1000, currentLevelPatience - (score * 50));
                this.patience = this.patienceMax;
                this.face = '😐';
                this.bobSeed = Math.random() * Math.PI * 2;
            }

            update(dt) {
                if (this.state === 'entering') {
                    this.x += (this.targetX - this.x) * 0.1;
                    if (Math.abs(this.x - this.targetX) < 5) {
                        this.x = this.targetX;
                        this.state = 'waiting';
                    }
                } else if (this.state === 'waiting') {
                    this.patience -= dt;
                    this.y = (height / 2) + Math.sin(Date.now() / 200 + this.bobSeed) * 5;

                    if (this.patience <= 0) {
                        this.state = 'leaving_angry';
                        this.face = '😡';
                        audio.playSFX("gameOver", 300);
                        showFeedback("fail");
                        shake = 20;
                        gameOver();
                    } else if (this.patience < this.patienceMax * 0.3) {
                        this.face = 'kc';
                        if (!warningPlayed) {
                            audio.playSFX("warning", 1200);
                            warningPlayed = true;
                        }
                    }
                } else if (this.state === 'leaving_happy') {
                    this.x -= 20;
                    if (this.x < -100) return true;
                } else if (this.state === 'leaving_angry') {
                    this.y += 10;
                }
                return false;
            }

            draw(ctx) {
                const worried = this.face === 'kc' ? '😰' : this.face;
                const pulse = ENABLE_ANIMATIONS ? (Math.sin(Date.now() / 180 + this.bobSeed) * 0.04) : 0;

                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.fillStyle = 'rgba(24, 8, 34, 0.24)';
                ctx.beginPath();
                ctx.ellipse(0, 92, 52, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'rgba(255, 215, 94, 0.25)';
                ctx.shadowBlur = 20;

                ctx.fillStyle = CHARACTER_STYLE.outline;
                roundRect(ctx, -40, -8, 80, 92, 24);
                ctx.fill();

                ctx.fillStyle = CHARACTER_STYLE.apron;
                roundRect(ctx, -34, -2, 68, 82, 20);
                ctx.fill();

                ctx.fillStyle = CHARACTER_STYLE.body;
                ctx.beginPath();
                ctx.arc(0, -12, 42 + pulse * 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-18, -42, 14, 0, Math.PI * 2);
                ctx.arc(0, -51, 17, 0, Math.PI * 2);
                ctx.arc(20, -42, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = CHARACTER_STYLE.outline;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-18, 22);
                ctx.lineTo(-32, 38);
                ctx.moveTo(18, 22);
                ctx.lineTo(32, 38);
                ctx.moveTo(-14, 84);
                ctx.lineTo(-18, 102);
                ctx.moveTo(14, 84);
                ctx.lineTo(18, 102);
                ctx.stroke();

                ctx.fillStyle = CHARACTER_STYLE.blush;
                ctx.globalAlpha = 0.35;
                ctx.beginPath();
                ctx.arc(-22, -2, 7, 0, Math.PI * 2);
                ctx.arc(22, -2, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.font = "38px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(worried, 0, -6);

                if (this.state === 'waiting' || this.state === 'entering') {
                    const bubbleY = -96;
                    ctx.fillStyle = 'rgba(255,255,255,0.96)';
                    roundRect(ctx, 26, bubbleY - 20, 78, 60, 24);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.96)';
                    ctx.beginPath();
                    ctx.moveTo(40, bubbleY + 32);
                    ctx.lineTo(26, bubbleY + 48);
                    ctx.lineTo(48, bubbleY + 40);
                    ctx.closePath();
                    ctx.fill();

                    ctx.font = "30px Arial";
                    if (this.type === 'burger') ctx.fillText('🍔', 66, bubbleY + 10);
                    if (this.type === 'fries') ctx.fillText('🍟', 66, bubbleY + 10);
                    if (this.type === 'soda') ctx.fillText('🥤', 66, bubbleY + 10);
                }

                if (this.state === 'waiting') {
                    const barW = 104;
                    const barH = 12;
                    const pct = this.patience / this.patienceMax;
                    roundRect(ctx, -barW / 2, -86, barW, barH, 10);
                    ctx.fillStyle = 'rgba(30, 24, 49, 0.8)';
                    ctx.fill();

                    const fillW = Math.max(0, barW * pct);
                    roundRect(ctx, -barW / 2, -86, fillW, barH, 10);
                    ctx.fillStyle = pct > 0.5 ? '#4ade80' : (pct > 0.2 ? '#facc15' : '#ef4444');
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10 - 5;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function drawBackdrop() {
            const neonGradient = ctx.createLinearGradient(0, 0, 0, height);
            neonGradient.addColorStop(0, '#35206f');
            neonGradient.addColorStop(0.45, '#1e143d');
            neonGradient.addColorStop(1, '#0b0814');
            ctx.fillStyle = neonGradient;
            ctx.fillRect(0, 0, width, height);

            const glowGradient = ctx.createRadialGradient(width * 0.5, height * 0.16, 10, width * 0.5, height * 0.16, width * 0.55);
            glowGradient.addColorStop(0, 'rgba(255, 214, 94, 0.28)');
            glowGradient.addColorStop(1, 'rgba(255, 214, 94, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 5; i++) {
                const laneY = 36 + i * 28;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(126, 249, 255, 0.08)' : 'rgba(255, 159, 79, 0.08)';
                ctx.fillRect(0, laneY, width, 10);
            }

            ctx.fillStyle = '#f7d9aa';
            ctx.fillRect(0, 0, width, height / 2);

            for (let i = 0; i < 9; i++) {
                const signX = 26 + (i * (width / 8));
                ctx.fillStyle = i % 2 === 0 ? 'rgba(126,249,255,0.22)' : 'rgba(255,159,79,0.2)';
                roundRect(ctx, signX, 28, 44, 18, 8);
                ctx.fill();
            }

            ctx.fillStyle = '#eadfd4';
            ctx.fillRect(0, height / 2, width, height / 2);

            const tileSize = 40;
            const offset = (Date.now() / 50) % tileSize;
            ctx.fillStyle = '#c9c1bc';
            for (let y = height / 2; y < height; y += tileSize) {
                for (let x = -tileSize; x < width; x += tileSize * 2) {
                    const shift = (Math.floor((y - height / 2) / tileSize) % 2 === 0) ? 0 : tileSize;
                    ctx.fillRect(x + shift - offset, y, tileSize, tileSize);
                }
            }

            ctx.fillStyle = '#ffefb3';
            ctx.fillRect(0, height / 2 + 80, width, 12);
            ctx.fillStyle = '#9f5524';
            ctx.fillRect(0, height / 2 + 92, width, 30);
            ctx.fillStyle = '#5d2814';
            ctx.fillRect(0, height / 2 + 122, width, height);

            const stripeW = 44;
            for (let x = 0; x < width; x += stripeW) {
                ctx.fillStyle = x / stripeW % 2 === 0 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)';
                ctx.fillRect(x, height / 2 + 122, stripeW, height);
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function initGame() {
            score = 0;
            shake = 0;
            particles = [];
            warningPlayed = false;
            hideFeedback();
            customer = new Customer();
            document.getElementById("score").innerText = score;
            resize();
        }

        function showFeedback(type) {
            feedbackTimer += 1;
            const currentToken = feedbackTimer;
            const target = type === "success" ? successGif : failGif;
            target.classList.add("show");
            setTimeout(() => {
                if (feedbackTimer === currentToken) {
                    target.classList.remove("show");
                }
            }, 1200);
        }

        function hideFeedback() {
            successGif.classList.remove("show");
            failGif.classList.remove("show");
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, width, height);

            ctx.save();
            if (shake > 0) {
                const dx = (Math.random() - 0.5) * shake;
                const dy = (Math.random() - 0.5) * shake;
                ctx.translate(dx, dy);
                shake *= 0.9;
                if (shake < 0.5) shake = 0;
            }

            drawBackdrop();

            if (customer) {
                const remove = customer.update(dt);
                customer.draw(ctx);
                if (remove) {
                    warningPlayed = false;
                    customer = new Customer();
                }
            }

            particles.forEach((p, i) => {
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            });

            buttons.forEach(btn => {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 6;

                const grad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
                grad.addColorStop(0, 'rgba(255,255,255,0.18)');
                grad.addColorStop(0.16, btn.color);
                grad.addColorStop(1, 'rgba(10,8,20,0.35)');
                ctx.fillStyle = grad;
                roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 18);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 2;
                roundRect(ctx, btn.x + 1, btn.y + 1, btn.w - 2, btn.h - 2, 17);
                ctx.stroke();

                ctx.shadowColor = 'transparent';
                ctx.fillStyle = 'white';
                ctx.font = `${btn.w * 0.48}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
            });

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        function handleInput(x, y) {
            if (!gameActive || !customer || customer.state !== 'waiting') return;

            buttons.forEach(btn => {
                if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                    if (btn.type === customer.type) {
                        audio.playSFX("serve", 80);
                        audio.playSFX("combo", 140);
                        score++;
                        document.getElementById("score").innerText = score;
                        customer.state = 'leaving_happy';
                        customer.face = '😋';
                        warningPlayed = false;
                        showFeedback("success");
                        spawnParticles(customer.x, customer.y, btn.color);
                    } else {
                        audio.playSFX("wrong", 180);
                        shake = 20;
                        customer.patience -= 500;
                        customer.face = '😖';
                        showFeedback("fail");
                        spawnParticles(width / 2, height / 2, '#555');
                    }
                }
            });
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            document.getElementById('hud').classList.remove('show');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('show');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        canvas.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            handleInput(touch.clientX, touch.clientY);
        }, { passive: false });

        document.getElementById("start-btn").addEventListener("click", () => {
            audio.unlock();
            audio.playSFX("start", 200);
            audio.playBGM();
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            document.getElementById("hud").classList.add("show");
            gameActive = true;
            resize();
            initGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        document.getElementById("restart-btn").addEventListener("click", () => {
            audio.unlock();
            audio.playSFX("start", 200);
            document.getElementById("game-over-screen").classList.remove("show");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            document.getElementById("hud").classList.add("show");
            audio.playBGM();
            gameActive = true;
            initGame();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        resize();
    });
    </script>
</body>
