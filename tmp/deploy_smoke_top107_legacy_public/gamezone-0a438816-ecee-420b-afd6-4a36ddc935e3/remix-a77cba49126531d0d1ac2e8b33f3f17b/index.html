<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Beat Bug Blitz</title>
    <!-- [agent-note][stage4] repaired: approved-font-links | source: catalogs/fonts.json | roles: display=Bangers ui=Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070b1a;
            --bg-mid: #101a3a;
            --panel: rgba(9, 17, 41, 0.8);
            --panel-strong: rgba(15, 27, 63, 0.92);
            --cyan: #67e8f9;
            --cyan-strong: #22d3ee;
            --violet: #8b5cf6;
            --violet-deep: #312e81;
            --magenta: #f472b6;
            --gold: #fde047;
            --danger: #fb7185;
            --text-main: #f8fbff;
            --text-soft: #dbeafe;
            --shadow: rgba(2, 8, 23, 0.6);
            --font-primary: 'Bangers', 'Trebuchet MS', sans-serif;
            --font-secondary: 'Rajdhani', 'Arial Narrow', Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            background:
                radial-gradient(circle at 50% 20%, rgba(103, 232, 249, 0.12), transparent 28%),
                radial-gradient(circle at 20% 20%, rgba(244, 114, 182, 0.1), transparent 24%),
                linear-gradient(180deg, #050816 0%, #0b1430 45%, #090d1b 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-secondary);
            color: var(--text-main);
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(125, 211, 252, 0.12), transparent 30%),
                radial-gradient(circle at center, #1d4ed8 0%, #0f172a 48%, #050816 100%);
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none;
        }

        /* UI Layer */
        .ui-panel {
            pointer-events: none;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hud-top {
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .vibe-container {
            background: linear-gradient(180deg, rgba(10, 20, 48, 0.92), rgba(6, 11, 28, 0.88));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(103, 232, 249, 0.7);
            padding: 12px 18px;
            border-radius: 18px;
            width: 85%;
            max-width: 400px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 14px 30px rgba(2, 8, 23, 0.42),
                0 0 18px rgba(34, 211, 238, 0.2);
            transform: skewX(-4deg);
        }

        .vibe-label {
            display: flex;
            justify-content: space-between;
            color: var(--cyan);
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 700;
            font-family: var(--font-primary);
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(103, 232, 249, 0.45);
        }

        .bar-bg {
            width: 100%;
            height: 16px;
            background: rgba(14, 24, 52, 0.95);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 2px 8px rgba(2, 8, 23, 0.65);
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--magenta), var(--gold), var(--cyan));
            box-shadow: 0 0 18px rgba(103, 232, 249, 0.38);
            transition: width 0.1s linear;
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 15%, rgba(103, 232, 249, 0.09), transparent 26%),
                rgba(3, 8, 22, 0.9);
            backdrop-filter: blur(12px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-card {
            background:
                linear-gradient(180deg, rgba(14, 27, 61, 0.96), rgba(7, 14, 30, 0.96));
            border: 1px solid rgba(103, 232, 249, 0.72);
            padding: 30px 24px;
            border-radius: 28px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 18px 40px rgba(2, 8, 23, 0.58),
                0 0 28px rgba(34, 211, 238, 0.14);
            max-width: 90%;
            width: 340px;
            transform: rotate(-1deg);
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--text-main);
            font-family: var(--font-primary);
            font-size: clamp(2rem, 8vw, 3rem);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 10px rgba(103, 232, 249, 0.35),
                0 0 28px rgba(139, 92, 246, 0.22);
        }

        p {
            color: var(--text-soft);
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .btn-funk {
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6 54%, #f472b6);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: white;
            font-family: var(--font-primary);
            font-size: 1rem;
            padding: 15px 18px;
            border-radius: 999px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            touch-action: manipulation;
            box-shadow:
                0 8px 0 #312e81,
                0 18px 24px rgba(0,0,0,0.34),
                0 0 18px rgba(103, 232, 249, 0.22);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        }
        .btn-funk:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #312e81;
            filter: brightness(1.08);
        }

        /* Disco overlay */
        .disco-lights {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(103, 232, 249, 0.15), transparent 54%),
                radial-gradient(circle at 50% 100%, rgba(244, 114, 182, 0.08), transparent 58%);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 5;
            animation: pulse-light 2.4s infinite alternate;
        }

        @keyframes pulse-light {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #flash-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent, rgba(248, 113, 113, 0.52));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 20;
            mix-blend-mode: color-dodge;
        }

        .menu-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(103, 232, 249, 0.12), transparent 35%),
                linear-gradient(315deg, rgba(244, 114, 182, 0.1), transparent 38%);
            pointer-events: none;
        }

        .hero-bug {
            font-size: 3.8rem;
            line-height: 1;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(103, 232, 249, 0.4));
            animation: hero-bob 1.9s ease-in-out infinite;
        }

        .sub-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            margin-bottom: 16px;
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.45);
            background: rgba(7, 14, 30, 0.7);
            color: var(--cyan);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: var(--font-primary);
        }

        @keyframes hero-bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .reaction-stack {
            position: absolute;
            right: 12px;
            bottom: calc(env(safe-area-inset-bottom) + 12px);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
        }

        .reaction-card {
            width: min(34vw, 132px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(103, 232, 249, 0.42);
            background: rgba(8, 15, 31, 0.66);
            box-shadow: 0 12px 24px rgba(2, 8, 23, 0.32);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            backdrop-filter: blur(10px);
        }

        .reaction-card.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .reaction-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .reaction-tag {
            padding: 6px 10px 7px;
            color: var(--text-main);
            font-family: var(--font-secondary);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(90deg, rgba(14, 27, 61, 0.94), rgba(29, 78, 216, 0.72));
        }

        @media (max-width: 480px) {
            .hud-top {
                padding-top: 14px;
            }

            .vibe-container {
                width: calc(100% - 24px);
                padding: 10px 14px;
            }

            .menu-card {
                width: min(100%, 320px);
                padding: 26px 18px;
            }

            .btn-funk {
                font-size: 0.92rem;
                padding: 14px 16px;
            }

            .reaction-stack {
                right: 8px;
                bottom: calc(env(safe-area-inset-bottom) + 8px);
            }

            .reaction-card {
                width: min(30vw, 108px);
            }

            .reaction-tag {
                font-size: 0.64rem;
                padding: 5px 8px 6px;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="gameCanvas"></canvas>
        <div class="disco-lights"></div>
        <div id="flash-overlay"></div>

        <div class="ui-panel">
            <div class="hud-top">
                <div class="vibe-container" id="hud">
                    <div class="vibe-label">
                        <span>Stage Pulse</span>
                        <span id="score-display">0 CLEARS</span>
                    </div>
                    <div class="bar-bg">
                        <div id="health-bar" class="bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: clear/fail reactions -> catalogs/gifs.json -->
        <div class="reaction-stack" aria-hidden="true">
            <div id="clear-reaction" class="reaction-card">
                <img src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="">
                <div class="reaction-tag">Bug tossed!</div>
            </div>
            <div id="danger-reaction" class="reaction-card">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="">
                <div class="reaction-tag">Stage crashing</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="menu-card">
                <div class="hero-bug" aria-hidden="true">🪲⚡</div>
                <div class="sub-tag">Neon Scrub Squad</div>
                <h1>BEAT BUG<br>BLITZ</h1>
                <div style="height: 6px; width: 88px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); margin: 10px auto 20px auto; transform: skewX(-20deg); box-shadow: 0 0 12px rgba(103, 232, 249, 0.4);"></div>
                <p>
                    Drag each glitch bug off the stage.<br>
                    Clear them fast to keep the pulse alive.
                </p>
                <button id="btn-start" class="btn-funk">START SET</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <div class="menu-card" style="border-color: #ef4444;">
                <h1 style="color: #ef4444; text-shadow: 2px 2px 0 #500;">SET CRASH</h1>
                <p>The stage pulse flatlined.<br>Too many glitch bugs got through.</p>
                <p id="final-score" style="color: #f8cb2e; font-size: 1.5rem;">Clears: 0</p>
                <button id="btn-restart" class="btn-funk" style="background: linear-gradient(to right, #ef4444, #b91c1c);">RUN IT BACK</button>
            </div>
        </div>
    </div>

    <script type="module">
        /*
         * Beat Bug Blitz - catalog-guided media pass.
         * [agent-note][stage3] resolved-font: title/body -> catalogs/fonts.json (Bangers, Rajdhani)
         * [agent-note][stage3] resolved-audio: ui/collect/damage/fail/bgm -> catalogs/audios.json
         */

        const MEDIA = {
            audio: {
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                grab: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
                clear: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
                warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
                fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3'
            }
        };

        const FunkAudio = {
            ctx: null,
            masterGain: null,
            initialized: false,
            loopGain: null,
            sfxGain: null,
            bgmSource: null,
            buffers: new Map(),
            lastPlayTimes: new Map(),
            htmlAudioPool: [],
            warnedLowHealth: false,

            async init() {
                if (this.initialized) {
                    if (this.ctx?.state === 'suspended') {
                        await this.ctx.resume().catch(() => {});
                    }
                    return;
                }

                const CtxClass = window.AudioContext || window.webkitAudioContext;
                if (!CtxClass) return;

                this.ctx = new CtxClass();
                this.masterGain = this.ctx.createGain();
                this.loopGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();

                this.masterGain.gain.value = 0.82;
                this.loopGain.gain.value = 0.2;
                this.sfxGain.gain.value = 0.7;

                this.loopGain.connect(this.masterGain);
                this.sfxGain.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);

                this.initialized = true;
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume().catch(() => {});
                }
            },

            async getBuffer(url) {
                if (!this.ctx) return null;
                if (this.buffers.has(url)) return this.buffers.get(url);

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`Audio request failed: ${response.status}`);
                    }
                    const arrayBuffer = await response.arrayBuffer();
                    const buffer = await this.ctx.decodeAudioData(arrayBuffer);
                    this.buffers.set(url, buffer);
                    return buffer;
                } catch {
                    return null;
                }
            },

            playHtmlAudio(url, options = {}) {
                const { loop = false, volume = 1 } = options;
                const audio = new Audio(url);
                audio.crossOrigin = 'anonymous';
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = Math.min(1, Math.max(0, volume * (loop ? 0.2 : 1)));
                audio.playsInline = true;

                const forgetAudio = () => {
                    this.htmlAudioPool = this.htmlAudioPool.filter((entry) => entry !== audio);
                };

                if (!loop) {
                    audio.addEventListener('ended', forgetAudio, { once: true });
                }

                audio.play().catch(() => {
                    forgetAudio();
                });
                this.htmlAudioPool.push(audio);
                return { source: audio, fallback: true };
            },

            async playBuffer(url, targetNode, options = {}) {
                await this.init();

                const { loop = false, volume = 1, cooldown = 0 } = options;
                const nowMs = performance.now();
                const previousMs = this.lastPlayTimes.get(url) || 0;
                if (cooldown && nowMs - previousMs < cooldown) return null;
                this.lastPlayTimes.set(url, nowMs);

                if (!this.ctx || !targetNode) {
                    return this.playHtmlAudio(url, { loop, volume });
                }

                const buffer = await this.getBuffer(url);
                if (!buffer) {
                    return this.playHtmlAudio(url, { loop, volume });
                }

                try {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    gain.gain.value = volume;
                    source.buffer = buffer;
                    source.loop = loop;
                    source.connect(gain);
                    gain.connect(targetNode);
                    source.start();
                    return { source, gain };
                } catch {
                    return this.playHtmlAudio(url, { loop, volume });
                }
            },

            async startLoop() {
                if (this.bgmSource) return;
                const result = await this.playBuffer(MEDIA.audio.bgm, this.loopGain, {
                    loop: true,
                    volume: 1
                });
                this.bgmSource = result?.source || null;
            },

            stopLoop() {
                if (!this.bgmSource) return;
                try {
                    if (typeof this.bgmSource.pause === 'function') {
                        this.bgmSource.pause();
                        this.bgmSource.currentTime = 0;
                    } else {
                        this.bgmSource.stop();
                    }
                } catch {}
                this.bgmSource.disconnect?.();
                this.bgmSource = null;
            },

            async playSFX(type) {
                const audioMap = {
                    start: MEDIA.audio.start,
                    ui: MEDIA.audio.ui,
                    grab: MEDIA.audio.grab,
                    clear: MEDIA.audio.clear,
                    warning: MEDIA.audio.warning,
                    fail: MEDIA.audio.fail
                };
                const cooldownMap = {
                    start: 200,
                    ui: 140,
                    grab: 90,
                    clear: 120,
                    warning: 1400,
                    fail: 250
                };
                const volumeMap = {
                    start: 0.7,
                    ui: 0.42,
                    grab: 0.48,
                    clear: 0.62,
                    warning: 0.55,
                    fail: 0.72
                };

                const url = audioMap[type];
                if (!url) return;
                await this.playBuffer(url, this.sfxGain, {
                    cooldown: cooldownMap[type] || 0,
                    volume: volumeMap[type] || 0.6
                });
            },

            async shutdown() {
                this.stopLoop();
                this.htmlAudioPool.forEach((audio) => {
                    try {
                        audio.pause();
                        audio.currentTime = 0;
                    } catch {}
                });
                this.htmlAudioPool = [];
                this.warnedLowHealth = false;
            }
        };

        const ReactionFX = {
            timers: new Map(),

            show(id, duration = 900) {
                const el = document.getElementById(id);
                if (!el) return;
                window.clearTimeout(this.timers.get(id));
                el.classList.add('show');
                const timer = window.setTimeout(() => el.classList.remove('show'), duration);
                this.timers.set(id, timer);
            }
        };

        // --- Graphics Utilities ---
        const GFX = {
            skinPattern: null,
            createSkinTexture(ctx) {
                const size = 256;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const c = canvas.getContext('2d');
                c.fillStyle = '#eac096';
                c.fillRect(0,0,size,size);
                
                const id = c.getImageData(0,0,size,size);
                const d = id.data;
                for(let i=0; i<d.length; i+=4) {
                    const grain = (Math.random() - 0.5) * 15;
                    d[i] = Math.max(0, Math.min(255, d[i] + grain));
                    d[i+1] = Math.max(0, Math.min(255, d[i+1] + grain));
                    d[i+2] = Math.max(0, Math.min(255, d[i+2] + grain));
                }
                c.putImageData(id, 0, 0);
                this.skinPattern = ctx.createPattern(canvas, 'repeat');
            },
            drawShadow(ctx, x, y, r, blur, opacity) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, 0.4); 
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = '#2e0249'; // Funky dark purple shadow
                ctx.shadowColor = '#2e0249';
                ctx.shadowBlur = blur;
                ctx.globalAlpha = opacity;
                ctx.fill();
                ctx.restore();
            }
        };

        // --- Game State ---
        const State = {
            active: false,
            width: 0,
            height: 0,
            health: 100,
            score: 0,
            lastTime: 0,
            spawnTimer: 0,
            difficulty: 1,
            entities: [],
            particles: [],
            drag: {
                active: false,
                target: null,
                startPos: {x:0, y:0},
                currentPos: {x:0, y:0},
                z: 0
            }
        };

        const Canvas = document.getElementById('gameCanvas');
        const Ctx = Canvas.getContext('2d', { alpha: false });

        // --- Entities ---
        class Bug {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.originX = x;
                this.originY = y;
                this.radius = 18;
                this.angle = Math.random() * Math.PI * 2;
                this.age = 0;
                this.isDragged = false;
                this.remove = false;
                this.colorBase = Math.random() > 0.5 ? '#7c3aed' : '#1d4ed8';
                this.shellGlow = Math.random() > 0.5 ? '#67e8f9' : '#f472b6';
            }

            update(dt) {
                this.age += dt;
                if (this.isDragged) {
                    const dx = this.x - this.originX;
                    const dy = this.y - this.originY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    this.z = Math.min(60, dist * 0.4);
                    this.angle = Math.atan2(dy, dx) + Math.PI/2;
                } else {
                    this.z = 0;
                    // Bounce to the beat roughly (2Hz approx 120bpm)
                    this.angle += Math.sin(this.age * 0.01) * 0.05;
                    const beatPulse = Math.sin(this.age * 0.02) * 2;
                    
                    if (this.age > 2000) {
                        State.health -= 0.05 * State.difficulty;
                        triggerDamageFX(true);
                    } else {
                        triggerDamageFX(false);
                    }
                }
            }

            draw(ctx) {
                const scale = 1 + (this.z * 0.015);
                const shadowOff = this.z * 0.5;
                GFX.drawShadow(ctx, this.x, this.y + shadowOff + 12, this.radius * scale, 10 + this.z, 0.5 - (this.z*0.005));

                ctx.save();
                ctx.translate(this.x, this.y - this.z);
                ctx.scale(scale, scale);
                ctx.rotate(this.angle);

                // Legs
                ctx.strokeStyle = '#2e0249';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                const legWiggle = this.isDragged ? 5 : Math.sin(this.age * 0.02) * 3;
                
                for(let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-4, i * 6);
                    ctx.quadraticCurveTo(-18, (i*9), -26, (i*12) + (i===0?0:legWiggle));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(4, i * 6);
                    ctx.quadraticCurveTo(18, (i*9), 26, (i*12) - (i===0?0:legWiggle));
                    ctx.stroke();
                }

                // Body (Neon glitch beetle shell)
                const grad = ctx.createRadialGradient(-4, -6, 2, 0, 0, 20);
                grad.addColorStop(0, '#f8fbff');
                grad.addColorStop(0.16, this.shellGlow);
                grad.addColorStop(0.55, this.colorBase);
                grad.addColorStop(1, '#050816');
                
                ctx.shadowColor = this.shellGlow;
                ctx.shadowBlur = this.isDragged ? 22 : 12;
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(0, -13);
                ctx.lineTo(0, 13);
                ctx.stroke();

                // Specular
                ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
                ctx.beginPath();
                ctx.ellipse(-4, -5, 4, 6, 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Head
                ctx.fillStyle = '#050816';
                ctx.beginPath();
                ctx.arc(0, -14, 6, 0, Math.PI * 2);
                ctx.fill();

                // Horns
                ctx.strokeStyle = this.shellGlow;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(-2, -18);
                ctx.quadraticCurveTo(-6, -24, -9, -24);
                ctx.moveTo(2, -18);
                ctx.quadraticCurveTo(6, -24, 9, -24);
                ctx.stroke();

                // Eyes (Glowing cyan)
                ctx.fillStyle = '#fde047';
                ctx.shadowColor = '#67e8f9';
                ctx.shadowBlur = 7;
                ctx.beginPath();
                ctx.arc(-2, -15, 1.5, 0, Math.PI * 2);
                ctx.arc(2, -15, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 6 + 3;
                this.gravity = 0.4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= 0.02;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- Core Logic ---

        function resize() {
            State.width = window.innerWidth;
            State.height = window.innerHeight;
            Canvas.width = State.width;
            Canvas.height = State.height;
            GFX.createSkinTexture(Ctx);
        }
        window.addEventListener('resize', resize);

        function spawnEntity() {
            const cx = State.width / 2;
            const cy = State.height / 2 + 50;
            const w = State.width * 0.35;
            const h = State.height * 0.3;
            let x, y, valid = false, attempts = 0;
            
            while(!valid && attempts < 10) {
                x = cx + (Math.random() - 0.5) * 2 * w;
                y = cy + (Math.random() - 0.5) * 2 * h;
                const dx = (x - cx) / w;
                const dy = (y - cy) / h;
                if (dx*dx + dy*dy <= 1) valid = true;
                attempts++;
            }
            if(valid) State.entities.push(new Bug(x, y));
        }

        function triggerDamageFX(active) {
            const overlay = document.getElementById('flash-overlay');
            if (active && State.health < 30) {
                overlay.style.opacity = (Math.sin(Date.now() / 100) * 0.5 + 0.5).toFixed(2);
                ReactionFX.show('danger-reaction', 1200);
                if (!FunkAudio.warnedLowHealth) {
                    FunkAudio.warnedLowHealth = true;
                    FunkAudio.playSFX('warning');
                }
            } else {
                overlay.style.opacity = '0';
                if (State.health >= 30) {
                    FunkAudio.warnedLowHealth = false;
                }
            }
        }

        function updateUI() {
            const bar = document.getElementById('health-bar');
            const score = document.getElementById('score-display');
            const displayHealth = Math.max(0, Math.min(100, State.health));
            bar.style.width = `${displayHealth}%`;
            score.innerText = `${Math.floor(State.score)} CLEARS`;
        }

        function drawFoot(ctx) {
            const cx = State.width / 2;
            const cy = State.height / 2 + 50;
            const w = State.width * 0.8; 
            const h = State.height * 0.7;

            ctx.save();
            ctx.translate(cx, cy);

            // Funky Shadow
            ctx.shadowColor = 'rgba(87, 10, 87, 0.6)';
            ctx.shadowBlur = 60;
            ctx.shadowOffsetY = 30;
            
            ctx.beginPath();
            ctx.arc(0, h * 0.4, w * 0.25, 0, Math.PI, false);
            ctx.bezierCurveTo(-w*0.4, h*0.2, -w*0.5, -h*0.2, -w*0.35, -h*0.4);
            ctx.bezierCurveTo(-w*0.1, -h*0.55, w*0.1, -h*0.55, w*0.35, -h*0.4);
            ctx.bezierCurveTo(w*0.2, -h*0.1, w*0.05, h*0.1, w*0.25, h*0.4);
            ctx.closePath();

            // Skin with slight purple tint for atmosphere
            const skinGrad = ctx.createRadialGradient(-50, -100, 20, 0, 0, h*0.6);
            skinGrad.addColorStop(0, '#ffe0bd');
            skinGrad.addColorStop(0.5, '#eac096');
            skinGrad.addColorStop(1, '#a97c9b'); // Purple-ish shadow
            
            ctx.fillStyle = skinGrad;
            ctx.fill();
            ctx.shadowColor = 'transparent';

            if (GFX.skinPattern) {
                ctx.globalAlpha = 0.15;
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = GFX.skinPattern;
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
            }

            // Arch shadow
            ctx.beginPath();
            ctx.ellipse(w*0.15, 0, w*0.1, h*0.15, 0.2, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(87, 10, 87, 0.15)';
            ctx.filter = 'blur(20px)';
            ctx.fill();
            ctx.filter = 'none';

            // Toes
            const toeY = -h * 0.42;
            const toeXBase = -w * 0.25;
            const toeSizes = [28, 22, 18, 16, 14];
            
            for(let i=0; i<5; i++) {
                const tx = toeXBase + (i * w * 0.14);
                const ty = toeY + Math.abs(i-2)*10;
                const tr = toeSizes[i];

                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.arc(tx, ty + 5, tr, 0, Math.PI*2);
                ctx.fill();

                const tGrad = ctx.createRadialGradient(tx - 5, ty - 5, 2, tx, ty, tr);
                tGrad.addColorStop(0, '#fff0e5');
                tGrad.addColorStop(1, '#c49a75');
                ctx.fillStyle = tGrad;
                ctx.beginPath();
                ctx.arc(tx, ty, tr, 0, Math.PI*2);
                ctx.fill();

                // Nail (Gold tint for funk)
                ctx.fillStyle = 'rgba(248, 203, 46, 0.2)';
                ctx.beginPath();
                ctx.ellipse(tx, ty - 5, tr * 0.5, tr * 0.4, 0, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.restore();
            
            // Bug signal rings
            State.entities.forEach(e => {
                if(!e.isDragged) {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    const pulse = Math.sin(Date.now() * 0.015) * 0.2 + 1;
                    ctx.fillStyle = 'rgba(103, 232, 249, 0.16)';
                    ctx.strokeStyle = 'rgba(244, 114, 182, 0.45)';
                    ctx.lineWidth = 2;
                    ctx.filter = 'blur(8px)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 24 * pulse, 0, Math.PI*2);
                    ctx.fill();
                    ctx.filter = 'none';
                    ctx.beginPath();
                    ctx.arc(0, 0, 18 * pulse, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        function drawTweezers(ctx) {
            if (!State.drag.active) return;
            const x = State.drag.currentPos.x;
            const y = State.drag.currentPos.y;
            const grabbing = State.drag.target !== null;
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-Math.PI / 8);
            
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 10;
            
            // Gold Tweezers!
            const metal = ctx.createLinearGradient(0, -100, 0, 0);
            metal.addColorStop(0, '#fef08a');
            metal.addColorStop(0.5, '#eab308');
            metal.addColorStop(1, '#a16207');

            ctx.fillStyle = metal;
            ctx.strokeStyle = '#854d0e';
            ctx.lineWidth = 1;

            const gap = grabbing ? 0 : 8;
            ctx.beginPath();
            ctx.moveTo(-gap, 0);
            ctx.lineTo(-10, -80);
            ctx.lineTo(-20, -80);
            ctx.lineTo(-gap-2, 0);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(gap, 0);
            ctx.lineTo(10, -80);
            ctx.lineTo(20, -80);
            ctx.lineTo(gap+2, 0);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function loop(timestamp) {
            if (!State.active) return;
            const dt = timestamp - State.lastTime;
            State.lastTime = timestamp;

            Ctx.clearRect(0, 0, State.width, State.height);

            // Spawn logic
            State.spawnTimer += dt;
            const spawnRate = Math.max(800, 2000 - (State.difficulty * 100));
            if (State.spawnTimer > spawnRate) {
                spawnEntity();
                State.spawnTimer = 0;
            }
            State.difficulty += 0.0002;

            drawFoot(Ctx);

            State.entities.sort((a, b) => a.y - b.y);
            for (let i = State.entities.length - 1; i >= 0; i--) {
                let e = State.entities[i];
                e.update(dt);
                e.draw(Ctx);
                if (e.remove) State.entities.splice(i, 1);
            }

            for (let i = State.particles.length - 1; i >= 0; i--) {
                let p = State.particles[i];
                p.update();
                p.draw(Ctx);
                if (p.life <= 0) State.particles.splice(i, 1);
            }

            drawTweezers(Ctx);

            if (State.health <= 0) {
                State.health = 0;
                endGame();
            }

            updateUI();
            requestAnimationFrame(loop);
        }

        // --- Input ---
        function getPos(e) {
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX, y: t.clientY };
        }

        function handleStart(e) {
            if (!State.active) return;
            e.preventDefault();
            const pos = getPos(e);
            
            State.drag.active = true;
            State.drag.currentPos = pos;
            
            for (let i = State.entities.length - 1; i >= 0; i--) {
                let ent = State.entities[i];
                const dx = pos.x - ent.x;
                const dy = pos.y - ent.y;
                if (dx*dx + dy*dy < 1600) {
                    State.drag.target = ent;
                    ent.isDragged = true;
                    State.drag.startPos = { x: ent.x, y: ent.y };
                    FunkAudio.playSFX('grab');
                    if(navigator.vibrate) navigator.vibrate(10);
                    break;
                }
            }
        }

        function handleMove(e) {
            if (!State.active || !State.drag.active) return;
            e.preventDefault();
            const pos = getPos(e);
            State.drag.currentPos = pos;
            if (State.drag.target) {
                State.drag.target.x = pos.x;
                State.drag.target.y = pos.y;
            }
        }

        function handleEnd(e) {
            if (!State.active) return;
            e.preventDefault();
            if (State.drag.target) {
                const ent = State.drag.target;
                const dx = ent.x - ent.originX;
                const dy = ent.y - ent.originY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 100) {
                    ent.remove = true;
                    State.health = Math.min(100, State.health + 15); 
                    State.score += 100;
                    FunkAudio.playSFX('clear');
                    ReactionFX.show('clear-reaction', 850);
                    if(navigator.vibrate) navigator.vibrate([30, 30, 30]);

                    // Funky confetti
                    for(let i=0; i<20; i++) {
                        State.particles.push(new Particle(ent.x, ent.y, '#f8cb2e')); // Gold
                        State.particles.push(new Particle(ent.x, ent.y, '#d946ef')); // Pink
                        State.particles.push(new Particle(ent.x, ent.y, '#22c55e')); // Green
                    }
                } else {
                    ent.x = ent.originX;
                    ent.y = ent.originY;
                    ent.isDragged = false;
                }
            }
            State.drag.active = false;
            State.drag.target = null;
        }

        async function startGame() {
            await FunkAudio.init();
            FunkAudio.playSFX('start');
            FunkAudio.startLoop();

            State.active = true;
            State.health = 100;
            State.score = 0;
            State.entities = [];
            State.particles = [];
            State.difficulty = 1;
            State.lastTime = performance.now();

            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-over-screen').classList.remove('active');

            resize();
            requestAnimationFrame(loop);
        }

        function endGame() {
            State.active = false;
            FunkAudio.shutdown();
            FunkAudio.playSFX('fail');
            ReactionFX.show('danger-reaction', 1600);
            document.getElementById('final-score').innerText = `Clears: ${Math.floor(State.score)}`;
            document.getElementById('game-over-screen').classList.add('active');
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            FunkAudio.playSFX('ui');
            startGame();
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            FunkAudio.playSFX('ui');
            startGame();
        });
        
        Canvas.addEventListener('touchstart', handleStart, {passive: false});
        Canvas.addEventListener('touchmove', handleMove, {passive: false});
        Canvas.addEventListener('touchend', handleEnd, {passive: false});
        Canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

    </script>
</body>
</html>
