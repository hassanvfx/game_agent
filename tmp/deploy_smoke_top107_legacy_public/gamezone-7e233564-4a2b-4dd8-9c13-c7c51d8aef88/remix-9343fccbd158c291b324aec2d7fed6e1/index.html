<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Puzzle Sprint</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- [agent-note][stage4] remapped-font: title->Audiowide, ui/body->Rajdhani from catalogs/fonts.json -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12091f;
      --bg-deep: #07030f;
      --panel: rgba(26, 15, 47, 0.82);
      --panel-strong: rgba(44, 24, 79, 0.92);
      --line: #75f5ff;
      --line-soft: rgba(117, 245, 255, 0.34);
      --accent: #ff7a18;
      --accent-soft: #ffd166;
      --danger: #ff5470;
      --text: #f8f6ff;
      --text-dim: #d7cff6;
      --given: #ffdc73;
      --placed: #8ce8ff;
      --ok: #6df7bd;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #2f1450 0%, rgba(47, 20, 80, 0.2) 28%, transparent 48%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--text);
    }
    body {
      font-family: "Rajdhani", sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 122, 24, 0.14), transparent 20%),
        linear-gradient(180deg, rgba(117, 245, 255, 0.06), rgba(255, 122, 24, 0.04) 45%, transparent 70%);
    }
    #game-container::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 28px, 28px 100%;
      opacity: 0.45;
      mix-blend-mode: screen;
    }
    #game-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(117, 245, 255, 0.18), transparent 10%),
        radial-gradient(circle at 82% 26%, rgba(255, 122, 24, 0.18), transparent 12%),
        radial-gradient(circle at 50% 84%, rgba(255, 209, 102, 0.12), transparent 14%);
      filter: blur(10px);
      opacity: 0.95;
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 1; }
    .font-display { font-family: "Audiowide", sans-serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .font-ui { font-family: "Rajdhani", sans-serif; }

    .hud-pill {
      background: linear-gradient(180deg, rgba(16, 10, 31, 0.92), rgba(34, 18, 61, 0.92));
      border: 2px solid var(--line);
      box-shadow: 0 0 0 2px rgba(6, 4, 16, 0.6), 0 10px 24px rgba(0, 0, 0, 0.34), inset 0 0 16px rgba(117, 245, 255, 0.12);
      border-radius: 16px;
      padding: 7px 12px;
      color: var(--text);
      min-width: 76px;
      backdrop-filter: blur(4px);
    }
    .game-over-panel {
      background: linear-gradient(180deg, rgba(16, 10, 31, 0.98), rgba(39, 20, 67, 0.98));
      border: 2px solid var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(117, 245, 255, 0.25), 0 18px 48px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(255, 122, 24, 0.12);
      border-radius: 22px;
      padding: 24px 22px;
      width: min(90vw, 360px);
      text-align: center;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }
    .btn-pop {
      background: linear-gradient(180deg, var(--accent-soft), var(--accent));
      border: 2px solid #fff1b8;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(255, 122, 24, 0.3), inset 0 1px 0 rgba(255,255,255,0.38);
      padding: 12px 20px;
      font-weight: 700;
      color: #1d102d;
      min-width: 44px;
      min-height: 44px;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
      cursor: pointer;
      letter-spacing: 0.06em;
    }
    .btn-pop:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 5px 12px rgba(255, 122, 24, 0.25), inset 0 1px 0 rgba(255,255,255,0.25);
      filter: brightness(0.98);
    }
    .hidden { display: none !important; }

    #keypad-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 2px);
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }
    .keypad-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 400px;
      width: 100%;
      pointer-events: auto;
    }
    .key-btn {
      background: linear-gradient(180deg, rgba(19, 12, 34, 0.96), rgba(40, 21, 72, 0.96));
      border: 2px solid rgba(117, 245, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 8px 18px rgba(0,0,0,0.32), inset 0 0 16px rgba(117, 245, 255, 0.1);
      border-radius: 16px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Rajdhani", sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.05s, background 0.15s;
      text-shadow: 0 0 12px rgba(117, 245, 255, 0.2);
    }
    .key-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 12px rgba(117, 245, 255, 0.18);
    }
    .key-btn.active {
      background: linear-gradient(180deg, rgba(255, 209, 102, 0.98), rgba(255, 122, 24, 0.98));
      color: #1b0d2c;
      border-color: #fff0b3;
      transform: translateY(2px);
      box-shadow: 0 5px 12px rgba(255, 122, 24, 0.34), inset 0 1px 0 rgba(255,255,255,0.35);
      text-shadow: none;
    }
    .feedback-banner {
      position: absolute;
      left: 50%;
      top: 78px;
      transform: translateX(-50%) translateY(-10px);
      min-width: min(72vw, 280px);
      max-width: min(84vw, 320px);
      padding: 10px 14px;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(12, 8, 28, 0.84);
      color: var(--text);
      text-align: center;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.26);
    }
    .feedback-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .feedback-banner.success {
      border-color: rgba(109, 247, 189, 0.75);
      box-shadow: 0 0 0 1px rgba(109, 247, 189, 0.2), 0 10px 28px rgba(0,0,0,0.26);
    }
    .feedback-banner.fail {
      border-color: rgba(255, 84, 112, 0.72);
      box-shadow: 0 0 0 1px rgba(255, 84, 112, 0.22), 0 10px 28px rgba(0,0,0,0.26);
    }
    .feedback-kicker {
      display: block;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .feedback-text {
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .reaction-gif {
      position: absolute;
      right: 12px;
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(8, 3, 15, 0.72);
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(12px) scale(0.92);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
      z-index: 3;
    }
    .reaction-gif.show {
      opacity: 0.96;
      transform: translateY(0) scale(1);
    }
    #celebration-gif {
      top: 92px;
    }
    #fail-gif {
      top: 190px;
    }
    .panel-gif {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      margin: 12px auto 0;
      display: block;
    }
    @media (max-width: 640px) {
      .reaction-gif {
        width: 68px;
        height: 68px;
        right: 10px;
      }
      #celebration-gif {
        top: 108px;
      }
      #fail-gif {
        top: 184px;
      }
      .feedback-banner {
        top: 74px;
        min-width: min(78vw, 250px);
        padding: 9px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="game-container" class="select-none">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
      <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
      <div id="hud" class="absolute top-4 left-0 right-0 px-4 flex items-center justify-between pointer-events-auto">
        <div class="hud-pill font-ui text-sm uppercase tracking-[0.18em]">Score: <span id="scoreText">0</span></div>
        <div class="text-center px-2">
          <div class="font-display text-[24px] sm:text-2xl text-cyan-100 drop-shadow-[0_0_12px_rgba(117,245,255,0.35)]">NEON GRID</div>
          <div class="font-ui text-[10px] tracking-[0.28em] uppercase text-violet-100/80">Lock the digits. Clear the sprint.</div>
        </div>
        <div class="hud-pill font-ui text-sm uppercase tracking-[0.18em]">Combo: <span id="comboText">0</span></div>
      </div>

      <div id="feedback-banner" class="feedback-banner font-ui" aria-live="polite">
        <span id="feedback-kicker" class="feedback-kicker">Signal</span>
        <span id="feedback-text" class="feedback-text">Grid online</span>
      </div>

      <!-- [agent-note][stage3] resolved-gif: success/fail reactions from catalogs/gifs.json | caution: keep-gif-off-playfield -->
      <img id="celebration-gif" class="reaction-gif" alt="celebration reaction" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
      <img id="fail-gif" class="reaction-gif" alt="fail reaction" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp">

      <div id="keypad-container">
        <div id="keypad" class="keypad-inner pointer-events-auto">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key="0" style="font-size: 14px;">CLR</button>
        </div>
      </div>

      <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-[#08030f]/80 backdrop-blur-[3px] pointer-events-auto">
        <div id="game-over-panel" class="game-over-panel">
          <div class="font-display text-4xl text-amber-200 drop-shadow-[0_0_14px_rgba(255,209,102,0.28)]">GRID CLEARED!</div>
          <div class="mt-4 font-ui text-violet-50 text-xl uppercase tracking-[0.16em]">Final Score: <span id="finalScoreText">0</span></div>
          <img class="panel-gif" alt="victory dance reaction" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
          <button id="restart-btn" class="btn-pop mt-6 font-ui text-lg w-full uppercase">New Run</button>
        </div>
      </div>
    </div>

    <!-- [agent-note][stage3] resolved-audio: bgm/ui/success/fail/blocked -> catalogs/audios.json -->
    <audio id="bgm-loop" preload="none" loop crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3"></audio>
    <audio id="sfx-ui" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"></audio>
    <audio id="sfx-success" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3"></audio>
    <audio id="sfx-fail" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"></audio>
    <audio id="sfx-blocked" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3"></audio>
    <audio id="sfx-win" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"></audio>

    <script id="game-config" type="application/x-game-config">
    {
      "themeColor": { "type": "color", "label": "Theme Color", "value": "#000000" },
      "difficulty": { "type": "number", "label": "Clue Density", "value": 0.3, "min": 0.0, "max": 0.6 }
    }
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreText = document.getElementById('scoreText');
      const comboText = document.getElementById('comboText');
      const finalScoreText = document.getElementById('finalScoreText');
      const gameOverScreen = document.getElementById('game-over-screen');
      const restartBtn = document.getElementById('restart-btn');
      const keypad = document.getElementById('keypad');
      const keyButtons = Array.from(keypad.querySelectorAll('.key-btn'));
      const feedbackBanner = document.getElementById('feedback-banner');
      const feedbackKicker = document.getElementById('feedback-kicker');
      const feedbackText = document.getElementById('feedback-text');
      const celebrationGif = document.getElementById('celebration-gif');
      const failGif = document.getElementById('fail-gif');
      const bgmLoop = document.getElementById('bgm-loop');
      const sfxUi = document.getElementById('sfx-ui');
      const sfxSuccess = document.getElementById('sfx-success');
      const sfxFail = document.getElementById('sfx-fail');
      const sfxBlocked = document.getElementById('sfx-blocked');
      const sfxWin = document.getElementById('sfx-win');

      let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
      let initialized = false;
      let gameState = 'PLAYING';

      const mediaState = {
        unlocked: false,
        activeFeedbackTimer: 0,
        gifTimers: new Map(),
        sfxCooldowns: new Map()
      };

      // Config Sync
      const configEl = document.getElementById('game-config');
      const defs = JSON.parse(configEl.textContent);
      window.gameConfig = Object.keys(defs).reduce((acc, k) => ({...acc, [k]: defs[k].value}), {});

      const palette = {
        given: '#ffdc73',
        placed: '#8ce8ff',
        invalid: '#ff5470',
        boardEdge: '#75f5ff',
        boardGlow: 'rgba(117, 245, 255, 0.24)',
        lineSoft: 'rgba(117, 245, 255, 0.18)',
        panelShadow: '#060410',
        cellFill: 'rgba(13, 9, 28, 0.96)',
        cellAlt: 'rgba(24, 14, 42, 0.96)',
        blockTint: 'rgba(255, 122, 24, 0.08)',
        particleA: '#ffcf5a',
        particleB: '#75f5ff'
      };

      const state = {
        board: [],
        rows: 9,
        cols: 9,
        cell: 0,
        offsetX: 0,
        offsetY: 0,
        activeNumber: 1,
        score: 0,
        combo: 0,
        particles: [],
        shake: 0,
        cellAnims: Array.from({length: 81}, () => ({ scale: 1 }))
      };

      const audioSettings = {
        bgm: 0.2,
        ui: 0.45,
        success: 0.45,
        fail: 0.42,
        blocked: 0.35,
        win: 0.5
      };

      function primeAudio() {
        if (mediaState.unlocked) return;
        mediaState.unlocked = true;
        bgmLoop.volume = audioSettings.bgm;
        sfxUi.volume = audioSettings.ui;
        sfxSuccess.volume = audioSettings.success;
        sfxFail.volume = audioSettings.fail;
        sfxBlocked.volume = audioSettings.blocked;
        sfxWin.volume = audioSettings.win;
        startBgm();
      }

      async function safePlay(audioEl, key, cooldown = 0) {
        if (!mediaState.unlocked || !audioEl) return;
        const now = performance.now();
        const last = mediaState.sfxCooldowns.get(key) || 0;
        if (cooldown && now - last < cooldown) return;
        mediaState.sfxCooldowns.set(key, now);
        try {
          audioEl.pause();
          audioEl.currentTime = 0;
          await audioEl.play();
        } catch (e) {}
      }

      async function startBgm() {
        if (!mediaState.unlocked || gameState !== 'PLAYING') return;
        try {
          if (bgmLoop.paused) {
            bgmLoop.currentTime = 0;
            await bgmLoop.play();
          }
        } catch (e) {}
      }

      function stopBgm() {
        try {
          bgmLoop.pause();
        } catch (e) {}
      }

      function showFeedback(kind, kicker, text, duration = 900) {
        clearTimeout(mediaState.activeFeedbackTimer);
        feedbackBanner.classList.remove('success', 'fail', 'show');
        feedbackBanner.classList.add(kind);
        feedbackKicker.textContent = kicker;
        feedbackText.textContent = text;
        feedbackBanner.classList.add('show');
        mediaState.activeFeedbackTimer = setTimeout(() => {
          feedbackBanner.classList.remove('show');
        }, duration);
      }

      function flashGif(el, duration = 900) {
        clearTimeout(mediaState.gifTimers.get(el));
        el.classList.add('show');
        const timer = setTimeout(() => el.classList.remove('show'), duration);
        mediaState.gifTimers.set(el, timer);
      }

      function vibrate(style) {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
          action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
          params: { style }
        });
        if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 15);
      }

      function setState(s) {
        gameState = s;
        gameOverScreen.classList.toggle('hidden', s === 'PLAYING');
        if (s === 'GAMEOVER') {
          finalScoreText.textContent = state.score;
          stopBgm();
          vibrate('heavy');
          safePlay(sfxWin, 'win-fanfare', 250);
          flashGif(celebrationGif, 1800);
          showFeedback('success', 'Victory', 'Puzzle cleared', 1600);
        } else if (s === 'PLAYING') {
          startBgm();
          failGif.classList.remove('show');
          celebrationGif.classList.remove('show');
        }
      }

      function resize() {
        cw = window.innerWidth;
        ch = window.innerHeight;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const boardSize = Math.min(cw * 0.95, ch * 0.55, 500);
        state.cell = boardSize / 9;
        state.offsetX = (cw - boardSize) / 2;
        state.offsetY = Math.max(80, ch * 0.15);
      }

      function generatePuzzle() {
        let tempBoard = Array(9).fill().map(() => Array(9).fill(0));

        function isValidTemp(board, r, c, n) {
          for (let i = 0; i < 9; i++) {
            if (board[r][i] === n) return false;
            if (board[i][c] === n) return false;
          }
          let br = Math.floor(r / 3) * 3;
          let bc = Math.floor(c / 3) * 3;
          for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
              if (board[br + i][bc + j] === n) return false;
            }
          }
          return true;
        }

        function fill(board) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (board[r][c] === 0) {
                let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                for (let n of nums) {
                  if (isValidTemp(board, r, c, n)) {
                    board[r][c] = n;
                    if (fill(board)) return true;
                    board[r][c] = 0;
                  }
                }
                return false;
              }
            }
          }
          return true;
        }

        fill(tempBoard);

        let density = Math.max(0, Math.min(0.6, window.gameConfig.difficulty || 0.3));
        let cluesToKeep = Math.floor(25 + (density / 0.6) * 30);
        let cellsToRemove = 81 - cluesToKeep;

        let removed = 0;
        while(removed < cellsToRemove) {
          let r = Math.floor(Math.random() * 9);
          let c = Math.floor(Math.random() * 9);
          if (tempBoard[r][c] !== 0) {
            tempBoard[r][c] = 0;
            removed++;
          }
        }

        state.board = [];
        for (let r = 0; r < 9; r++) {
          let row = [];
          for (let c = 0; c < 9; c++) {
            row.push({
              value: tempBoard[r][c],
              given: tempBoard[r][c] !== 0
            });
          }
          state.board.push(row);
        }
      }

      function isPlacementValid(r, c, n) {
        if (n === 0) return true;
        for (let i = 0; i < 9; i++) {
          if (i !== c && state.board[r][i].value === n) return false;
          if (i !== r && state.board[i][c].value === n) return false;
        }
        const br = Math.floor(r / 3) * 3;
        const bc = Math.floor(c / 3) * 3;
        for (let i = br; i < br + 3; i++) {
          for (let j = bc; j < bc + 3; j++) {
            if ((i !== r || j !== c) && state.board[i][j].value === n) return false;
          }
        }
        return true;
      }

      function initGame() {
        state.score = 0;
        state.combo = 0;
        state.particles = [];
        state.shake = 0;
        state.cellAnims.forEach(a => a.scale = 1);
        generatePuzzle();
        updateHUD();
        updateKeypad();
        showFeedback('success', 'Ready', 'Tap a tile to start', 1200);
      }

      function updateHUD() {
        scoreText.textContent = state.score;
        comboText.textContent = state.combo;
      }

      function updateKeypad() {
        keyButtons.forEach(btn => {
          const k = parseInt(btn.dataset.key);
          btn.classList.toggle('active', k === state.activeNumber);
        });
      }

      function spawnParticles(x, y) {
        for (let i = 0; i < 12; i++) {
          state.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 1.0,
            size: Math.random() * 4 + 2,
            color: i % 2 === 0 ? palette.particleA : palette.particleB
          });
        }
      }

      function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const c = Math.floor((x - state.offsetX) / state.cell);
        const r = Math.floor((y - state.offsetY) / state.cell);

        if (r >= 0 && r < 9 && c >= 0 && c < 9) {
          const cell = state.board[r][c];

          if (cell.given) {
            state.shake = 3;
            vibrate('light');
            safePlay(sfxBlocked, 'blocked', 120);
            showFeedback('fail', 'Locked', 'That digit is fixed', 700);
            flashGif(failGif, 700);
            return;
          }

          const val = state.activeNumber;

          if (val === 0) {
            if (cell.value !== 0) {
              cell.value = 0;
              vibrate('light');
              safePlay(sfxUi, 'clear', 80);
              state.cellAnims[r * 9 + c].scale = 0.5;
              showFeedback('success', 'Clear', 'Cell reset', 650);
            }
            return;
          }

          if (cell.value === val) return;

          const isValid = isPlacementValid(r, c, val);
          cell.value = val;
          state.cellAnims[r * 9 + c].scale = 1.4;

          if (isValid) {
            state.score += 10 + (state.combo * 5);
            state.combo++;
            spawnParticles(state.offsetX + (c + 0.5) * state.cell, state.offsetY + (r + 0.5) * state.cell);
            vibrate('light');
            safePlay(state.combo > 2 ? sfxSuccess : sfxUi, 'correct', 80);
            if (state.combo > 1) {
              showFeedback('success', 'Combo', `Chain x${state.combo}`, 800);
            } else {
              showFeedback('success', 'Locked In', `Placed ${val}`, 650);
            }
            if (state.combo >= 3) {
              flashGif(celebrationGif, 900);
            }
          } else {
            state.combo = 0;
            state.shake = 10;
            vibrate('medium');
            safePlay(sfxFail, 'fail', 120);
            showFeedback('fail', 'Conflict', 'Digit clashes with the grid', 900);
            flashGif(failGif, 900);
          }
          updateHUD();
          checkWin();
        }
      }

      function checkWin() {
        let full = true;
        let valid = true;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (state.board[r][c].value === 0) full = false;
            else if (!isPlacementValid(r, c, state.board[r][c].value)) valid = false;
          }
        }
        if (full && valid) setState('GAMEOVER');
      }

      function update(dt) {
        state.shake *= 0.9;
        state.particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt * 2;
        });
        state.particles = state.particles.filter(p => p.life > 0);
        state.cellAnims.forEach(a => a.scale += (1 - a.scale) * 0.2);
      }

      function draw() {
        ctx.clearRect(0, 0, cw, ch);

        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;
        ctx.save();
        ctx.translate(shakeX, shakeY);

        const boardSize = state.cell * 9;
        const boardX = state.offsetX;
        const boardY = state.offsetY;

        const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
        bgGrad.addColorStop(0, '#140924');
        bgGrad.addColorStop(1, '#07030f');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);

        for (let i = 0; i < 18; i++) {
          const starX = (i * 97) % cw;
          const starY = ((i * 67) + performance.now() * 0.01) % ch;
          ctx.fillStyle = i % 2 === 0 ? 'rgba(117,245,255,0.22)' : 'rgba(255,209,102,0.16)';
          ctx.beginPath();
          ctx.arc(starX, starY, i % 3 === 0 ? 2 : 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = palette.panelShadow;
        ctx.fillRect(boardX + 10, boardY + 14, boardSize, boardSize);

        const boardGrad = ctx.createLinearGradient(boardX, boardY, boardX, boardY + boardSize);
        boardGrad.addColorStop(0, '#17102d');
        boardGrad.addColorStop(1, '#0b0718');
        ctx.fillStyle = boardGrad;
        ctx.fillRect(boardX, boardY, boardSize, boardSize);

        ctx.save();
        ctx.shadowColor = palette.boardGlow;
        ctx.shadowBlur = 18;
        ctx.strokeStyle = palette.boardEdge;
        ctx.lineWidth = 4;
        ctx.strokeRect(boardX, boardY, boardSize, boardSize);
        ctx.restore();

        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const x = boardX + c * state.cell;
            const y = boardY + r * state.cell;
            ctx.fillStyle = (Math.floor(r / 3) + Math.floor(c / 3)) % 2 === 0 ? palette.cellFill : palette.cellAlt;
            ctx.fillRect(x, y, state.cell, state.cell);
            if (r % 3 === 1 && c % 3 === 1) {
              ctx.fillStyle = palette.blockTint;
              ctx.fillRect(x, y, state.cell, state.cell);
            }
          }
        }

        for (let i = 0; i <= 9; i++) {
          ctx.lineWidth = i % 3 === 0 ? 4 : 1.5;
          ctx.strokeStyle = i % 3 === 0 ? palette.boardEdge : palette.lineSoft;
          ctx.beginPath();
          ctx.moveTo(boardX + i * state.cell, boardY);
          ctx.lineTo(boardX + i * state.cell, boardY + boardSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(boardX, boardY + i * state.cell);
          ctx.lineTo(boardX + boardSize, boardY + i * state.cell);
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const cell = state.board[r][c];
            if (cell.value !== 0) {
              const anim = state.cellAnims[r * 9 + c];
              const cx = state.offsetX + (c + 0.5) * state.cell;
              const cy = state.offsetY + (r + 0.5) * state.cell;
              const valid = isPlacementValid(r, c, cell.value);

              ctx.save();
              ctx.translate(cx, cy);
              ctx.scale(anim.scale, anim.scale);

              if (!valid) {
                ctx.fillStyle = palette.invalid;
                ctx.globalAlpha = 0.22;
                ctx.fillRect(-state.cell/2 + 2, -state.cell/2 + 2, state.cell - 4, state.cell - 4);
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = palette.invalid;
              } else {
                ctx.fillStyle = cell.given ? palette.given : palette.placed;
              }

              ctx.font = `${cell.given ? '600' : '400'} ${Math.floor(state.cell * 0.5)}px "Rajdhani"`;
              if (isFinite(cx) && isFinite(cy)) {
                ctx.fillText(cell.value, 0, 2);
              }
              ctx.restore();
            }
          }
        }

        state.particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        });

        ctx.restore();
      }

      function loop(now) {
        try {
          const dt = Math.min(0.05, (now - (loop.last || now)) / 1000);
          loop.last = now;
          update(dt);
          draw();
        } catch (e) {
          console.error("Loop error", e);
        }
        requestAnimationFrame(loop);
      }

      const ro = new ResizeObserver((entries) => {
        if (entries.length === 0) return;
        resize();
        if (!initialized) {
          initGame();
          initialized = true;
          requestAnimationFrame(loop);
        }
      });
      ro.observe(document.body);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopBgm();
        else if (gameState === 'PLAYING') startBgm();
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        primeAudio();
        handleInput(e);
      }, { passive: false });

      keyButtons.forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          primeAudio();
          state.activeNumber = parseInt(btn.dataset.key);
          updateKeypad();
          vibrate('light');
          safePlay(sfxUi, 'ui-nav', 60);
          showFeedback('success', 'Loadout', state.activeNumber === 0 ? 'Clear mode armed' : `Digit ${state.activeNumber} selected`, 550);
        }, { passive: false });
      });

      restartBtn.addEventListener('click', () => {
        primeAudio();
        safePlay(sfxUi, 'restart', 60);
        initGame();
        setState('PLAYING');
      });
    });
    </script>
  </div>
</body>
