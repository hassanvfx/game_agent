<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ginger Meme Rush</title>
    <!-- [agent-note][stage4] font-remap: display=Audiowide ui=Exo 2 via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070311;
            --bg-deep: #12062a;
            --panel: rgba(18, 12, 42, 0.84);
            --panel-border: rgba(157, 242, 255, 0.3);
            --text: #f5f7ff;
            --muted: #aeb6d6;
            --hot-pink: #ff4db8;
            --orange: #ffb14a;
            --red: #ff5a71;
            --cyan: #71f4ff;
            --violet: #8a63ff;
            --track-glow: rgba(113, 244, 255, 0.24);
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text);
        }

        body {
            background:
                radial-gradient(circle at top, rgba(255, 77, 184, 0.22), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 177, 74, 0.18), transparent 38%),
                radial-gradient(circle at 50% 20%, rgba(113, 244, 255, 0.1), transparent 28%),
                linear-gradient(180deg, var(--bg-deep), var(--bg));
        }

        canvas { display: block; touch-action: none; }

        .hidden { display: none !important; }

        .screen {
            width: min(88vw, 540px);
            padding: 2rem;
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(33, 22, 72, 0.94), rgba(12, 9, 31, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(113, 244, 255, 0.14), transparent 36%),
                radial-gradient(circle at top right, rgba(255, 77, 184, 0.18), transparent 30%);
            pointer-events: none;
        }

        .screen > * {
            position: relative;
            z-index: 1;
        }

        .screen-start { border-top: 5px solid var(--hot-pink); }
        .screen-over { border-top: 5px solid var(--red); }

        .title {
            margin: 0 0 0.75rem;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(1.9rem, 6vw, 3.2rem);
            line-height: 1.1;
            letter-spacing: 0.08em;
            color: #ffd5f1;
            text-shadow:
                0 0 18px rgba(255, 77, 184, 0.35),
                0 0 30px rgba(113, 244, 255, 0.18);
        }

        .subtitle {
            margin: 0 0 1.25rem;
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 700;
            color: #eef7ff;
        }

        .status-row {
            margin: 0 0 1.5rem;
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .emoji-strip {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .emoji-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(113, 244, 255, 0.24);
            box-shadow: 0 0 18px rgba(113, 244, 255, 0.12);
        }

        .btn {
            border: 0;
            border-radius: 999px;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(0.74rem, 2vw, 0.92rem);
            padding: 1rem 1.35rem;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover { transform: scale(1.04); filter: brightness(1.05); box-shadow: 0 0 18px rgba(113, 244, 255, 0.2); }
        .btn:active { transform: scale(0.98); }

        .btn-start {
            background: linear-gradient(90deg, var(--hot-pink), var(--orange));
        }

        .btn-restart {
            background: linear-gradient(90deg, #eef7ff, #b3efff);
            color: #121212;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 77, 184, 0.2), transparent 28%),
                linear-gradient(180deg, #170b2d 0%, #090512 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(113, 244, 255, 0.08) 50%, transparent 100%);
            opacity: 0.5;
            mix-blend-mode: screen;
        }

        #game-container::after {
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025) 0 2px,
                    transparent 2px 7px
                );
            opacity: 0.26;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.2rem;
            padding: 0.5rem 0.7rem;
            border-radius: 16px;
            background: rgba(11, 9, 28, 0.48);
            border: 1px solid rgba(113, 244, 255, 0.16);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .hud-score {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(0.88rem, 2.4vw, 1.22rem);
            line-height: 1.35;
        }

        .hud-value,
        .final-value {
            color: var(--orange);
        }

        .hud-hint {
            font-size: 0.92rem;
            color: var(--muted);
        }

        .final-score {
            margin: 0 0 1.5rem;
            font-size: clamp(1.3rem, 3.5vw, 2rem);
        }

        .feedback-gif {
            position: absolute;
            right: 0.8rem;
            bottom: 0.8rem;
            width: min(30vw, 120px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            opacity: 0.92;
            pointer-events: none;
        }

        .feedback-gif.start-gif {
            top: 0.9rem;
            right: 0.9rem;
            bottom: auto;
            width: min(26vw, 104px);
        }

        .feedback-banner {
            position: absolute;
            left: 50%;
            top: 5.2rem;
            transform: translateX(-50%) scale(0.92);
            min-width: min(70vw, 240px);
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: rgba(11, 9, 28, 0.82);
            border: 1px solid rgba(113, 244, 255, 0.28);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
            text-align: center;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: 0.08em;
            color: #fff6cf;
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
            text-transform: uppercase;
        }

        .feedback-banner.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .feedback-banner.good {
            background: rgba(26, 16, 44, 0.84);
            color: #ffefb1;
            border-color: rgba(255, 177, 74, 0.34);
        }

        .feedback-banner.bad {
            background: rgba(36, 10, 24, 0.88);
            color: #ffd8e2;
            border-color: rgba(255, 90, 113, 0.34);
        }

        @media (max-width: 640px) {
            .screen {
                width: min(92vw, 540px);
                padding: 1.5rem;
                border-radius: 22px;
            }

            .emoji-strip { gap: 0.6rem; font-size: 1.7rem; }
            .btn { width: 100%; }
            #hud { top: 0.75rem; left: 0.75rem; }
            .hud-hint { max-width: 220px; }
            .feedback-banner { top: auto; bottom: 1rem; min-width: min(78vw, 250px); }
            .feedback-gif { width: min(28vw, 92px); right: 0.55rem; bottom: 0.55rem; }
            .feedback-gif.start-gif { top: 0.55rem; right: 0.55rem; width: min(24vw, 82px); }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Sensitivity", "value": 15, "min": 5, "max": 30 },
    "hairGrowth": { "type": "number", "label": "Trail Growth Rate", "value": 5, "min": 1, "max": 10 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF0055" }
}
</script>

<!-- Approved catalog-backed player sprite replaces removed user upload ref. -->
<img id="asset_player" data-editable="image" data-label="Player Sprite" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>

<!-- [agent-note][stage3] resolved-audio: loop+ui+collect+hit+game-over via catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Runway BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Collect SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_hit" data-editable="audio" data-label="Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI Start SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_game_over" data-editable="audio" data-label="Game Over SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="start-screen" class="screen screen-start">
            <img class="feedback-gif start-gif" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="Celebration dance preview" loading="lazy">
            <h1 class="title">GINGER MEME RUSH</h1>
            <p class="subtitle">Swipe to stack the longest viral trail.</p>
            <p class="status-row">Catch the glam drops. Dodge the scissors.</p>
            <div class="emoji-strip" aria-hidden="true">
                <span class="emoji-badge">🧥</span><span class="emoji-badge">🩳</span><span class="emoji-badge">💄</span>
            </div>
            <button id="start-btn" class="btn btn-start">START RUN</button>
        </div>

        <div id="game-over-screen" class="hidden screen screen-over">
            <img class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction" loading="lazy">
            <h2 class="title">MEME WIPEOUT</h2>
            <div class="final-score">Final Trail: <span id="finalScore" class="final-value">0</span>m</div>
            <button id="restart-btn" class="btn btn-restart">RUN AGAIN</button>
        </div>

        <div id="hud" class="hidden">
            <div class="hud-score">TRAIL: <span id="score" class="hud-value">0</span>m</div>
            <div class="hud-hint">Catch glam loot. Avoid ✂️ scissors.</div>
        </div>
        <!-- [agent-note][stage3] resolved-gif: feedback banner uses catalogs/gifs.json without blocking playfield -->
        <div id="feedback-banner" class="feedback-banner" aria-live="polite"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') {
                // [agent-note][stage1] role: future-visual | element: player-ring | intent: sync accent color with theme shifts
            }
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let state = {
        playing: false,
        gameOver: false,
        score: 0,
        frames: 0,
        player: { x: 0.5, y: 0.8, r: 0.06 },
        hair: [],
        items: [],
        particles: [],
        camShake: 0
    };

    const assets = {
        player: document.getElementById('asset_player'),
        bgm: document.getElementById('bgm_main'),
        sfxCollect: document.getElementById('sfx_collect'),
        sfxHit: document.getElementById('sfx_hit'),
        sfxUi: document.getElementById('sfx_ui'),
        sfxGameOver: document.getElementById('sfx_game_over')
    };

    const feedbackBanner = document.getElementById('feedback-banner');
    let audioCtx = null;
    const ensureAudioContext = () => {
        if (!audioCtx) {
            const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
            if (AudioContextCtor) audioCtx = new AudioContextCtor();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        return audioCtx;
    };

    const playSound = (el, volume = 0.5) => {
        if (!el) return;
        ensureAudioContext();
        const now = performance.now();
        if (el.dataset.lastPlay && now - Number(el.dataset.lastPlay) < 90) return;
        el.dataset.lastPlay = String(now);
        if (el.duration > 0 && !el.paused) {
            const clone = el.cloneNode();
            clone.volume = volume;
            clone.play().catch(() => {});
        } else {
            el.volume = volume;
            el.currentTime = 0;
            el.play().catch(() => {});
        }
    };

    const playTone = (type) => {
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.connect(gain);
        gain.connect(ctxAudio.destination);

        if (type === 'good') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(740, ctxAudio.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1180, ctxAudio.currentTime + 0.12);
            gain.gain.setValueAtTime(0.04, ctxAudio.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.008, ctxAudio.currentTime + 0.12);
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.12);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, ctxAudio.currentTime);
            osc.frequency.linearRampToValueAtTime(90, ctxAudio.currentTime + 0.16);
            gain.gain.setValueAtTime(0.035, ctxAudio.currentTime);
            gain.gain.linearRampToValueAtTime(0.008, ctxAudio.currentTime + 0.16);
            osc.start();
            osc.stop(ctxAudio.currentTime + 0.16);
        }
    };

    const showFeedback = (message, tone) => {
        feedbackBanner.textContent = message;
        feedbackBanner.className = `feedback-banner show ${tone}`;
        clearTimeout(showFeedback.timeoutId);
        showFeedback.timeoutId = setTimeout(() => {
            feedbackBanner.className = 'feedback-banner';
        }, 850);
    };

    const syncLoopState = () => {
        if (!assets.bgm) return;
        if (state.playing && !state.gameOver) {
            assets.bgm.volume = 0.2;
            assets.bgm.play().catch(() => {});
        } else {
            assets.bgm.pause();
            assets.bgm.currentTime = 0;
        }
    };

    let w, h, dpr;
    const resize = () => {
        w = window.innerWidth;
        h = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    let input = { isDown: false, x: 0 };

    const handleStart = (e) => {
        e.preventDefault();
        input.isDown = true;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;

        ensureAudioContext();
    };

    const handleMove = (e) => {
        if (!input.isDown) return;
        e.preventDefault();
        const clientX = e.clientX || e.touches[0].clientX;
        const currentX = clientX - canvas.getBoundingClientRect().left;

        const delta = (currentX - input.x) / w;
        state.player.x += delta * (window.gameConfig.heroSpeed / 10);
        state.player.x = Math.max(0.1, Math.min(0.9, state.player.x));

        input.x = currentX;
    };

    const handleEnd = () => {
        input.isDown = false;
    };

    canvas.addEventListener('pointerdown', handleStart, { passive: false });
    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    const initGame = () => {
        state.playing = true;
        state.gameOver = false;
        state.score = 10;
        state.items = [];
        state.particles = [];
        state.player.x = 0.5;
        state.hair = [];

        for (let i = 0; i < 20; i++) {
            state.hair.push({ x: 0.5, y: 0.8 + (i * 0.01) });
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');

        playSound(assets.sfxUi, 0.42);
        showFeedback('Runway live!', 'good');
        syncLoopState();
    };

    const gameOver = () => {
        state.playing = false;
        state.gameOver = true;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = Math.floor(state.score);
        state.camShake = 10;
        playSound(assets.sfxGameOver, 0.5);
        playTone('bad');
        showFeedback('Scissors ruined the vibe!', 'bad');
        syncLoopState();
    };

    const spawnItem = () => {
        const types = [
            { type: 'good', emoji: '🧥', color: '#ff69b4' },
            { type: 'good', emoji: '🩳', color: '#00ff00' },
            { type: 'good', emoji: '💄', color: '#000000' },
            { type: 'bad', emoji: '✂️', color: '#ff0000' }
        ];

        const choice = Math.random() < 0.2 ? 3 : Math.floor(Math.random() * 3);

        state.items.push({
            x: Math.random() * 0.8 + 0.1,
            y: -0.1,
            ...types[choice],
            speed: 0.005 + (Math.random() * 0.005)
        });
    };

    const updateParticles = (dt) => {
        for (let i = state.particles.length - 1; i >= 0; i--) {
            const p = state.particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.life <= 0) state.particles.splice(i, 1);
        }
    };

    const spawnParticles = (x, y, color, count) => {
        for (let i = 0; i < count; i++) {
            state.particles.push({
                x,
                y,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                life: 1.0,
                color,
                size: Math.random() * 5 + 2
            });
        }
    };

    let lastTime = 0;
    const loop = (timestamp) => {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        const laneGrad = ctx.createLinearGradient(0, 0, 0, h);
        laneGrad.addColorStop(0, '#241147');
        laneGrad.addColorStop(0.45, '#12081f');
        laneGrad.addColorStop(1, '#07040f');
        ctx.fillStyle = laneGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.strokeStyle = 'rgba(113, 244, 255, 0.2)';
        ctx.lineWidth = 2;
        const offset = (timestamp * 0.2) % 100;
        for (let i = 0; i < 10; i++) {
            const y = -h / 2 + ((i * 100 + offset) % h);
            ctx.beginPath();
            ctx.moveTo(-w, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }

        const spotlightX = Math.sin(timestamp * 0.002) * w * 0.3;
        const grad = ctx.createRadialGradient(spotlightX, 0, 0, spotlightX, 0, w * 0.6);
        grad.addColorStop(0, 'rgba(255, 77, 184, 0.14)');
        grad.addColorStop(0.45, 'rgba(113, 244, 255, 0.08)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.restore();

        let shakeX = 0;
        let shakeY = 0;
        if (state.camShake > 0) {
            shakeX = (Math.random() - 0.5) * state.camShake;
            shakeY = (Math.random() - 0.5) * state.camShake;
            state.camShake *= 0.9;
            if (state.camShake < 0.5) state.camShake = 0;
        }
        ctx.save();
        ctx.translate(shakeX, shakeY);

        if (state.playing) {
            if (Math.random() < 0.03) spawnItem();

            for (let i = state.items.length - 1; i >= 0; i--) {
                const item = state.items[i];
                item.y += item.speed * 60 * dt;

                const dx = (item.x * w) - (state.player.x * w);
                const dy = (item.y * h) - (state.player.y * h);
                const dist = Math.sqrt(dx * dx + dy * dy);
                const hitRadius = w * 0.08;

                if (dist < hitRadius) {
                    if (item.type === 'good') {
                        state.score += window.gameConfig.hairGrowth;
                        spawnParticles(item.x * w, item.y * h, item.color, 10);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(0, 0, w, h);
                        playSound(assets.sfxCollect, 0.42);
                        playTone('good');
                        showFeedback('Glam boost!', 'good');
                    } else {
                        state.score = Math.max(0, state.score - 10);
                        state.camShake = 15;
                        spawnParticles(item.x * w, item.y * h, '#ff0000', 20);
                        playSound(assets.sfxHit, 0.45);
                        playTone('bad');
                        showFeedback('Snip hit!', 'bad');
                        state.hair = state.hair.slice(0, Math.max(5, state.hair.length - 10));
                    }
                    state.items.splice(i, 1);
                    continue;
                }

                if (item.y > 1.1) state.items.splice(i, 1);
            }

            const targetX = state.player.x;
            const targetY = state.player.y;

            const targetSegs = Math.floor(state.score * 2);
            while (state.hair.length < targetSegs) {
                state.hair.push({ x: state.hair[state.hair.length - 1].x, y: state.hair[state.hair.length - 1].y + 0.01 });
            }
            while (state.hair.length > targetSegs && state.hair.length > 5) {
                state.hair.pop();
            }

            if (state.hair.length > 0) {
                state.hair[0].x += (targetX - state.hair[0].x) * 20 * dt;
                state.hair[0].y = targetY + 0.02;
            }

            for (let i = 1; i < state.hair.length; i++) {
                const prev = state.hair[i - 1];
                const curr = state.hair[i];
                const dx = curr.x - prev.x;
                const dy = curr.y - prev.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const spacing = 0.01;

                if (dist > spacing) {
                    const angle = Math.atan2(dy, dx);
                    curr.x = prev.x + Math.cos(angle) * spacing;
                    curr.y = prev.y + Math.sin(angle) * spacing;
                }
                curr.x += Math.sin(timestamp * 0.005 + i * 0.1) * 0.001;
            }

            document.getElementById('score').innerText = Math.floor(state.score);

            if (state.score <= 0 && !state.gameOver) {
                gameOver();
            }
        }

        if (state.hair.length > 1) {
            ctx.beginPath();
            ctx.moveTo(state.hair[0].x * w, state.hair[0].y * h);
            for (let i = 1; i < state.hair.length; i++) {
                const xc = (state.hair[i].x + state.hair[i - 1].x) / 2 * w;
                const yc = (state.hair[i].y + state.hair[i - 1].y) / 2 * h;
                ctx.quadraticCurveTo(state.hair[i - 1].x * w, state.hair[i - 1].y * h, xc, yc);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = w * 0.075;
            ctx.strokeStyle = 'rgba(113, 244, 255, 0.14)';
            ctx.stroke();

            ctx.lineWidth = w * 0.055;
            ctx.strokeStyle = '#ff8d53';
            ctx.stroke();

            ctx.lineWidth = w * 0.024;
            ctx.strokeStyle = '#ffd36c';
            ctx.stroke();
        }

        const px = state.player.x * w;
        const py = state.player.y * h;
        const pr = w * 0.08;

        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.arc(px, py, pr * 1.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(113, 244, 255, 0.18)';
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.clip();
        if (assets.player && assets.player.complete && assets.player.naturalWidth > 0) {
            try {
                ctx.drawImage(assets.player, px - pr, py - pr, pr * 2, pr * 2);
            } catch (e) {
                ctx.fillStyle = '#ff0055';
                ctx.fill();
            }
        } else {
            ctx.fillStyle = '#ff0055';
            ctx.fill();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(px, py, pr * 1.08, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.strokeStyle = window.gameConfig.themeColor;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = `${w * 0.08}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        state.items.forEach(item => {
            ctx.fillText(item.emoji, item.x * w, item.y * h);
        });

        updateParticles(dt);
        state.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.restore();
        requestAnimationFrame(loop);
    };

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (assets.bgm) assets.bgm.pause();
        } else {
            syncLoopState();
        }
    });

    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
