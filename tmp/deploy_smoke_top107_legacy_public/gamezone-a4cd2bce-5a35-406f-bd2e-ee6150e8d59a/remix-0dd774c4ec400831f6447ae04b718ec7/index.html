<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Highway Interceptor 100</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-night: #060b17;
            --bg-roadside: #0a1630;
            --panel-bg: rgba(7, 15, 32, 0.84);
            --panel-stroke: rgba(111, 217, 255, 0.42);
            --cyan: #6fe3ff;
            --cyan-strong: #24c8ff;
            --amber: #ffd66e;
            --danger: #ff627d;
            --road: #111c31;
            --lane: rgba(255,255,255,0.25);
            --text-main: #f5fbff;
            --text-soft: #9bb5d8;
            --glow: 0 0 18px rgba(36, 200, 255, 0.28);
        }

        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background:
            radial-gradient(circle at top, rgba(36, 200, 255, 0.12), transparent 30%),
            linear-gradient(180deg, var(--bg-roadside), var(--bg-night) 68%);
            font-family: 'Rajdhani', system-ui, sans-serif; }
        body { color: var(--text-main); }
        canvas { display: block; touch-action: none; }
        button { font: inherit; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .z-50 { z-index: 50; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-32 { width: 8rem; }
        .h-4 { height: 1rem; }
        .overflow-hidden { overflow: hidden; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .interactive { pointer-events: auto; }
        .text-center { text-align: center; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .border { border-width: 1px; border-style: solid; }
        .border-gray-600 { border-color: rgba(75, 85, 99, 0.95); }
        .border-b-4 { border-bottom-width: 4px; border-bottom-style: solid; }
        .border-blue-800 { border-bottom-color: #1e40af; }
        .border-red-800 { border-bottom-color: #991b1b; }
        .bg-gray-800 { background: rgba(31, 41, 55, 0.95); }
        .bg-blue-500 { background: #3b82f6; }
        .bg-blue-600 { background: #2563eb; }
        .bg-red-600 { background: #dc2626; }
        .text-white { color: #fff; }
        .text-yellow-400 { color: #facc15; }
        .text-blue-300 { color: #93c5fd; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-green-400 { color: #4ade80; }
        .text-red-500 { color: #ef4444; }

        .text-xl { font-size: 1.45rem; }
        .text-2xl { font-size: 1.8rem; }

        #hud > div:first-child::before,
        #hud > div:last-child::before,

        #game-over-screen::before {
            content: "";

                -webkit-overflow-scrolling: touch;
            }
            #ui-title,
            #go-title {

<script>
/**
 * §4 Iron Laws & Architecture
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    const configScript = document.getElementById('game-config');
    window.gameConfigDefs = JSON.parse(configScript.textContent);
    window.gameConfig = {};
    
    // Initialize pure config values
    Object.keys(window.gameConfigDefs).forEach(key => {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            const def = window.gameConfigDefs[key];
            // Type validation
            if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, Number(val)));
            if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
            
            window.gameConfig[key] = val;
            
            // Hot reload logic
            if (key === 'gameTitle') {
                const el = document.getElementById('ui-title');
                if (el) el.textContent = val;
                document.title = val;
            }
            if (key === 'themeColor') {
                const el = document.getElementById('scoreVal');
                if (el) el.style.color = val;
            }
        }
    };

    // --- Audio System ---
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffers = {};
                this.cooldowns = new Map();
                this.unlocked = false;
            }

            unlock() {
                if (this.unlocked) return;
                this.ctx.resume().then(() => {
                    this.unlocked = true;
                    this.playBgm();
                }).catch(() => {});
            }

            async loadSound(id, src) {
                try {
                    const res = await fetch(src);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('Audio load failed, using fallback', id);
                    this.buffers[id] = 'fallback';
                }
            }

            playBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.volume = 0.2;
                    el.currentTime = 0;
                    el.play().catch(() => {});
                }
            }

            stopBgm() {
                const el = document.getElementById('bgm_race');
                if (el) {
                    el.pause();
                    el.currentTime = 0;
                }
            }

            playSfx(id, type = 'beep', cooldown = 0) {
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                const now = performance.now();
                const lastPlay = this.cooldowns.get(id) || 0;
                if (cooldown && now - lastPlay < cooldown) return;
                this.cooldowns.set(id, now);

                const buffer = this.buffers[id];
                if (buffer && buffer !== 'fallback') {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    gain.gain.value = id === 'sfx_crash' ? 0.35 : id === 'sfx_ui' ? 0.3 : 0.4;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } else {
                    this.synthesize(type);
                }
            }

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.5);
                } else {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        }

    const audio = new AudioManager();
    const feedback = {
        crashGif: document.getElementById('crash-gif'),
        winGif: document.getElementById('win-gif'),
        timers: new Map()
    };

    function flashGif(key, duration = 900) {
        const el = feedback[key];
        if (!el) return;
        clearTimeout(feedback.timers.get(key));
        el.classList.remove('hidden', 'opacity-0');
        const timeout = setTimeout(() => {
            el.classList.add('opacity-0');
            setTimeout(() => el.classList.add('hidden'), 250);
        }, duration);
        feedback.timers.set(key, timeout);
    }

    // Preload SFX
    ['sfx_hit', 'sfx_crash', 'sfx_win', 'sfx_fail', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // State
    let gameState = 'START'; // START, PLAY, GAME_OVER
    let lastTime = 0;
    let scoreDistance = 0; // Miles
    let gameSpeed = 1;
    let roadOffset = 0;
    
    // Entities
    const player = { x: 0, y: 0, w: 50, h: 80, hp: 100, maxHp: 100 };
    const enemy = { x: 0, y: 0, w: 60, h: 100, hp: 500, maxHp: 500, dir: 1, moveTimer: 0 };
    let bullets = [];
    let particles = [];
    let obstacles = []; // Debris from van
    let roadLines = [];

    // Input
    let input = { active: false, x: 0 };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset positions if resizing during play
        if (gameState === 'START') {
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight - 150;
            enemy.x = window.innerWidth / 2;
            enemy.y = 150;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handlers
    const handleStart = (e) => {
        if (gameState !== 'PLAY') return;
        input.active = true;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
        audio.unlock();
    };
    
    const handleMove = (e) => {
        if (!input.active) return;
        input.x = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
    };

    const handleEnd = () => {
        input.active = false;
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleStart(e);
    }, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        handleMove(e);
    }, { passive: false });
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointercancel', handleEnd);

    // Game Loop
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Config sync
        gameSpeed = window.gameConfig.gameSpeed;
        const steerSpeed = window.gameConfig.heroSpeed * 60;

        // Player Movement (Lerp towards input)
        if (input.active) {
            const dx = input.x - player.x;
            player.x += dx * steerSpeed * dt * 0.1;
        }
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(window.innerWidth - player.w/2, player.x));

        // Enemy AI (Sway and evade)
        enemy.moveTimer += dt;
        if (enemy.moveTimer > 2) {
            enemy.dir = Math.random() > 0.5 ? 1 : -1;
            enemy.moveTimer = 0;
        }
        enemy.x += enemy.dir * 50 * dt;
        // Keep enemy in bounds
        if (enemy.x < 50 || enemy.x > window.innerWidth - 50) enemy.dir *= -1;
        enemy.x = Math.max(enemy.w/2, Math.min(window.innerWidth - enemy.w/2, enemy.x));

        // Road Scrolling
        roadOffset += 800 * gameSpeed * dt;
        if (roadOffset > 100) roadOffset = 0;
        scoreDistance += (10 * gameSpeed * dt) / 100; // Miles

        // Win Condition
        if (scoreDistance >= 100 || enemy.hp <= 0) {
            endGame(true);
        }

        // Shooting (Auto-fire)
        player.fireTimer = (player.fireTimer || 0) + dt;
        if (player.fireTimer > 0.15) {
            bullets.push({ x: player.x - 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            bullets.push({ x: player.x + 10, y: player.y, vx: 0, vy: -1200, type: 'player' });
            player.fireTimer = 0;
        }

        // Enemy Shooting / Debris
        enemy.fireTimer = (enemy.fireTimer || 0) + dt;
        if (enemy.fireTimer > 1.0) {
            // Drop debris
            obstacles.push({ x: enemy.x, y: enemy.y + 50, w: 40, h: 40, active: true });
            enemy.fireTimer = 0;
        }

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;

            // Collision with Enemy
            if (b.type === 'player' && 
                Math.abs(b.x - enemy.x) < enemy.w/2 + 5 && 
                Math.abs(b.y - enemy.y) < enemy.h/2 + 5) {
                
                enemy.hp -= 5;
                spawnParticles(b.x, b.y, '#ffffff', 5);
                audio.playSfx('sfx_hit', 'hit', 70);
                bullets.splice(i, 1);
                continue;
            }

            if (b.y < -50 || b.y > window.innerHeight + 50) bullets.splice(i, 1);
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const o = obstacles[i];
            o.y += 600 * dt; // Move down relative to road speed

            // Collision with Player
            if (o.active && 
                Math.abs(o.x - player.x) < (o.w + player.w)/2 * 0.8 &&
                Math.abs(o.y - player.y) < (o.h + player.h)/2 * 0.8) {
                
                player.hp -= 20;
                o.active = false;
                spawnParticles(player.x, player.y, '#ef4444', 15);
                audio.playSfx('sfx_crash', 'explosion', 220);
                flashGif('crashGif', 850);

                // Screen shake
                shake = 0.5;
            }

            if (o.y > window.innerHeight + 100) obstacles.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Game Over Check
        if (player.hp <= 0) endGame(false);

        // Update UI
        document.getElementById('scoreVal').textContent = scoreDistance.toFixed(1);
        document.getElementById('healthBar').style.width = Math.max(0, player.hp) + '%';
        
        // Shake decay
        if (shake > 0) shake = Math.max(0, shake - dt * 2);
    }

    let shake = 0;

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 200 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.5,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function draw() {
        // Clear background
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Shake effect
        let sx = 0, sy = 0;
        if (shake > 0) {
            sx = (Math.random() - 0.5) * shake * 50;
            sy = (Math.random() - 0.5) * shake * 50;
        }
        ctx.save();
        ctx.translate(sx, sy);

        // Draw Road
        ctx.fillStyle = '#1e293b'; // Road color
        const roadW = Math.min(600, window.innerWidth);
        const roadX = (window.innerWidth - roadW) / 2;
        ctx.fillRect(roadX, 0, roadW, window.innerHeight);
        
        // Road Lines
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        for (let i = -1; i < 10; i++) {
            let y = (i * 100) + roadOffset;
            ctx.rect(window.innerWidth/2 - 5, y, 10, 50);
        }
        ctx.fill();

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 0.5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Obstacles (Debris)
        ctx.fillStyle = '#475569';
        obstacles.forEach(o => {
            if (!o.active) return;
            ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
            // Detail
            ctx.fillStyle = '#000';
            ctx.fillRect(o.x - o.w/2 + 5, o.y - o.h/2 + 5, o.w-10, o.h-10);
            ctx.fillStyle = '#475569';
        });

        // Draw Player
        const pImg = document.getElementById('asset_player');
        if (pImg && pImg.complete && pImg.naturalWidth > 0) {
            ctx.drawImage(pImg, player.x - player.w/2, player.y - player.h/2, player.w, player.h);
        } else {
            // Fallback
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(player.x - player.w/2, player.y - player.h/2, player.w, player.h);
        }
        
        // Siren Lights (Procedural Juice)
        const time = Date.now() / 100;
        if (Math.floor(time) % 2 === 0) {
            ctx.fillStyle = 'rgba(239, 68, 68, 0.5)'; // Red
            ctx.beginPath();
            ctx.arc(player.x - 15, player.y, 20, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = 'rgba(59, 130, 246, 0.5)'; // Blue
            ctx.beginPath();
            ctx.arc(player.x + 15, player.y, 20, 0, Math.PI*2);
            ctx.fill();
        }

        // Draw Enemy
        const eImg = document.getElementById('asset_enemy');
        if (eImg && eImg.complete && eImg.naturalWidth > 0) {
            ctx.drawImage(eImg, enemy.x - enemy.w/2, enemy.y - enemy.h/2, enemy.w, enemy.h);
        } else {
            ctx.fillStyle = '#000';
            ctx.fillRect(enemy.x - enemy.w/2, enemy.y - enemy.h/2, enemy.w, enemy.h);
        }
        
        // Enemy Health Bar
        const hpPct = Math.max(0, enemy.hp / enemy.maxHp);
        ctx.fillStyle = 'red';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60, 5);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(enemy.x - 30, enemy.y - 60, 60 * hpPct, 5);

        // Draw Bullets
        ctx.fillStyle = '#facc15';
        bullets.forEach(b => {
            ctx.fillRect(b.x - 2, b.y - 10, 4, 20);
        });

        ctx.restore();
    }

    function initGame() {
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight - 150;
        player.hp = player.maxHp;
        
        enemy.x = window.innerWidth / 2;
        enemy.y = 150;
        enemy.hp = enemy.maxHp;
        
        bullets = [];
        particles = [];
        obstacles = [];
        scoreDistance = 0;
        shake = 0;
        
        gameState = 'PLAY';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('siren-fx').classList.remove('opacity-0');
        
        audio.unlock();
        audio.playSfx('sfx_ui', 'win', 180);
    }

    function endGame(win) {
        gameState = 'GAME_OVER';
        audio.stopBgm();
        audio.playSfx(win ? 'sfx_win' : 'sfx_fail', win ? 'win' : 'explosion', 300);
        if (win) {
            flashGif('winGif', 2200);
        } else {
            flashGif('crashGif', 1200);
        }
        
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('siren-fx').classList.add('opacity-0');
        
        const title = document.getElementById('go-title');
        title.textContent = win ? "TARGET STOPPED" : "PURSUIT LOST";
        title.className = win ? "text-5xl font-bold text-green-400 mb-4 neon-text" : "text-5xl font-bold text-red-500 mb-4 neon-text";
        
        document.getElementById('finalScore').textContent = scoreDistance.toFixed(1);
    }

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);

    // Initial Draw
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
