<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Pet Parade</title>
    <!-- [agent-note][stage4] font-remap: using catalog-approved display/UI fonts only -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #1f1447;
            --sky-bottom: #4f2c86;
            --cloud-glow: rgba(255, 255, 255, 0.28);
            --panel-fill: rgba(31, 20, 71, 0.58);
            --panel-border: rgba(154, 246, 255, 0.65);
            --panel-shadow: rgba(11, 8, 26, 0.3);
            --text-main: #fff4fe;
            --text-warm: #ffd7fb;
            --accent-cyan: #88f7ff;
            --accent-pink: #ff7fd8;
            --accent-gold: #ffd86b;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 220, 129, 0.2), transparent 32%),
                linear-gradient(180deg, var(--sky-top) 0%, #331d67 45%, var(--sky-bottom) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
            position: relative;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        body::before {
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 28%, rgba(255,255,255,0.14) 0 1.5px, transparent 2px),
                radial-gradient(circle at 30% 74%, rgba(136,247,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 70% 64%, rgba(255,127,216,0.18) 0 2px, transparent 3px);
            opacity: 0.95;
        }
        body::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 6px);
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(59, 36, 112, 0.76), rgba(24, 16, 48, 0.76));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 10px 28px var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.12), rgba(16, 11, 35, 0.72)),
                linear-gradient(180deg, rgba(22, 13, 46, 0.3), rgba(22, 13, 46, 0.82));
            backdrop-filter: blur(10px);
            z-index: 50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .hud-score {
            padding: 10px 22px;
            margin-bottom: 8px;
            font-size: clamp(1.2rem, 3.6vw, 1.85rem);
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(255, 216, 107, 0.45);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            letter-spacing: 0.06em;
        }
        .hud-goal {
            padding: 7px 14px;
            font-size: clamp(0.78rem, 2.5vw, 0.96rem);
            color: var(--text-warm);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .title {
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            line-height: 0.9;
            color: #fff1a8;
            margin: 0 0 16px;
            letter-spacing: 0.04em;
            text-shadow:
                0 3px 0 rgba(65, 28, 110, 0.95),
                0 10px 20px rgba(0,0,0,0.35),
                0 0 18px rgba(255, 127, 216, 0.28);
        }
        .subtitle {
            max-width: 22rem;
            font-size: clamp(0.98rem, 3.7vw, 1.18rem);
            color: var(--text-warm);
            margin: 0 0 28px;
            animation: pulse 1.4s ease-in-out infinite;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .start-btn {
            background: linear-gradient(180deg, #ff8ae1, #ff5abb);
            color: #fffdf6;
            font-size: clamp(1.05rem, 3.9vw, 1.45rem);
            padding: 15px 28px;
            border-radius: 999px;
            border: 3px solid rgba(255,255,255,0.92);
            box-shadow: 0 10px 24px rgba(30, 17, 58, 0.3), 0 0 18px rgba(255, 127, 216, 0.34);
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }
        .start-btn:hover {
            background: linear-gradient(180deg, #ffa5e8, #ff6bc3);
            box-shadow: 0 12px 28px rgba(30, 17, 58, 0.34), 0 0 24px rgba(136, 247, 255, 0.3);
        }
        .start-btn:active { transform: scale(0.95); filter: brightness(1.08); }
        .unlock-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unlock-text {
            margin: 0;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 7vw, 3.6rem);
            color: #fff1a8;
            text-shadow: 0 3px 0 rgba(65, 28, 110, 0.95), 0 0 16px rgba(255, 127, 216, 0.5);
            white-space: nowrap;
            letter-spacing: 0.06em;
            animation: bounce 1s infinite;
        }
        .feedback-gif {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: min(30vw, 128px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.65);
            background: rgba(10, 8, 26, 0.45);
            box-shadow: 0 10px 24px rgba(9, 7, 23, 0.35);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.9) translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.95;
            transform: scale(1) translateY(0);
        }
        .feedback-gif--reward {
            right: auto;
            left: 16px;
            bottom: 20px;
            width: min(27vw, 112px);
            border-color: rgba(255, 216, 107, 0.72);
        }
        @media (max-width: 640px) {
            .hud { padding: 16px; }
            .feedback-gif {
                width: min(28vw, 96px);
                right: 10px;
                bottom: 10px;
            }
            .feedback-gif--reward {
                left: 10px;
                bottom: 14px;
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); } to { opacity: 1; transform: translate(-50%, -50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>

<!-- Config Definition -->
<script id="game-config" type="application/x-game-config">
{
    "basePoints": { "type": "number", "label": "Points Per Click", "value": 1, "min": 1, "max": 100 },
    "unlockMultiplier": { "type": "number", "label": "Unlock Difficulty", "value": 50, "min": 10, "max": 200 },
    "bgColor": { "type": "color", "label": "Background Color", "value": "#FFE4E1" }
}
</script>

<!-- Asset Declarations -->
<div id="assets" style="display:none;">
    <!-- [agent-note][stage3] resolved-audio: bgm/start/tap/unlock -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM Parade" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_tap" data-editable="audio" data-label="SFX Parade Tap" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_unlock" data-editable="audio" data-label="SFX Unlock" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="SFX Start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
</div>

<!-- UI Layer -->
<div id="game-container" style="position: relative; width: 100%; height: 100%; user-select: none;">
    <canvas id="gameCanvas"></canvas>
    
    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="glass hud-score">★ <span id="score">0</span></div>
        <div class="glass hud-goal">
            Next Parade Star: <span id="next-goal">50</span> ★
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
        <h1 class="title">Neon Pet<br>Parade</h1>
        <p class="subtitle">Tap the mascot to build the parade crowd.</p>
        <button id="start-btn" class="start-btn">
            START THE PARADE
        </button>
    </div>

    <!-- Unlock Notification -->
    <div id="unlock-msg" class="unlock-msg hidden">
        <h2 class="unlock-text">NEW PARADE STAR!</h2>
    </div>
    <!-- [agent-note][stage3] resolved-gif: mascot/reward feedback -> catalogs/gifs.json -->
    <img
        id="mascot-gif"
        class="feedback-gif"
        src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.gif"
        alt="Mascot celebration reaction"
        decoding="async"
        loading="lazy"
    >
    <img
        id="reward-gif"
        class="feedback-gif feedback-gif--reward"
        src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif"
        alt="Heart reward reaction"
        decoding="async"
        loading="lazy"
    >
</div>

<script>
/** 
 * CORE ENGINE 
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & State ---
    window.gameConfig = {
        basePoints: 1,
        unlockMultiplier: 50,
        bgColor: "#FFE4E1"
    };

    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const defs = JSON.parse(cfgEl.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                if (window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = defs[key].value;
                }
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if(key === 'bgColor') document.body.style.backgroundColor = val;
        }
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        tap: document.getElementById('sfx_tap'),
        unlock: document.getElementById('sfx_unlock'),
        start: document.getElementById('sfx_start')
    };

    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const setAudioDefaults = () => {
        if (sounds.bgm) sounds.bgm.volume = 0.25;
        if (sounds.tap) sounds.tap.volume = 0.4;
        if (sounds.unlock) sounds.unlock.volume = 0.52;
        if (sounds.start) sounds.start.volume = 0.46;
    };
    setAudioDefaults();

    const unlockAudio = async () => {
        if (audioUnlocked) return;
        try {
            if (audioCtx.state !== 'running') {
                await audioCtx.resume();
            }
        } catch (_) {}
        if (sounds.bgm) {
            sounds.bgm.currentTime = 0;
            sounds.bgm.play().catch(() => {});
        }
        audioUnlocked = true;
    };

    const playSfx = (name, cooldown = 0) => {
        if (!audioUnlocked) return;
        const now = performance.now();
        const lastPlayed = sfxCooldowns.get(name) || 0;
        if (cooldown && now - lastPlayed < cooldown) return;
        sfxCooldowns.set(name, now);

        const el = sounds[name];
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (_) {}
            return;
        }

        // Fallback Synth
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(name === 'unlock' ? 620 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(name === 'unlock' ? 1120 : 1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    };

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const nextGoalEl = document.getElementById('next-goal');
    const startScreen = document.getElementById('start-screen');
    const unlockMsg = document.getElementById('unlock-msg');
    const mascotGif = document.getElementById('mascot-gif');
    const rewardGif = document.getElementById('reward-gif');

    let gameState = 'START'; // START, PLAY
    let score = 0;
    let nextUnlock = window.gameConfig.unlockMultiplier;
    let currentSkin = 0;
    let particles = [];
    let lastTime = 0;
    
    // Cat Physics
    let catScale = 1;
    let catVel = 0;
    const catBaseRadius = 120;
    let catX = 0, catY = 0;

    // Mascot variants for the parade theme
    const skins = [
        { name: "Glint", color: "#fff7ff", eyes: "#342153", nose: "#ff8fc4", glow: "#88f7ff", belly: "#ffeaf7", ear: "#ffcee8" },
        { name: "Spark", color: "#ffd57c", eyes: "#5d2d53", nose: "#ff9f8c", stripes: true, glow: "#ff7fd8", belly: "#fff0bf", ear: "#ffe0ba" },
        { name: "Pulse", color: "#7a8cff", eyes: "#fff07a", nose: "#b9d6ff", glow: "#88f7ff", belly: "#dbe4ff", ear: "#bec8ff" },
        { name: "Nova", color: "#28234d", eyes: "#9effd1", nose: "#8892ff", glow: "#9b8cff", belly: "#4a4574", ear: "#615d92" },
        { name: "Bloom", color: "#ff9fd2", eyes: "#7d1852", nose: "#fff0fa", glow: "#ffd86b", belly: "#ffd8ec", ear: "#ffc4e2" }
    ];

    // --- Resize Logic ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        catX = window.innerWidth / 2;
        catY = window.innerHeight / 2 + 50;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    let mascotGifTimer = null;
    let rewardGifTimer = null;
    const showGif = (el, duration = 1200) => {
        if (!el) return;
        el.classList.add('is-visible');
        const timerKey = el === mascotGif ? 'mascot' : 'reward';
        if (timerKey === 'mascot' && mascotGifTimer) clearTimeout(mascotGifTimer);
        if (timerKey === 'reward' && rewardGifTimer) clearTimeout(rewardGifTimer);
        const timer = setTimeout(() => el.classList.remove('is-visible'), duration);
        if (timerKey === 'mascot') mascotGifTimer = timer;
        if (timerKey === 'reward') rewardGifTimer = timer;
    };

    const handleInput = (e) => {
        if (gameState !== 'PLAY') return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Check distance to cat center
        const dx = x - catX;
        const dy = y - (catY - 40); // Offset for head center
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < catBaseRadius * 1.2) {
            // Clicked Cat
            score += window.gameConfig.basePoints;
            scoreEl.innerText = score;
            
            // Physics Impulse
            catVel = 0.4; // Squish down
            
            // Audio + feedback
            playSfx('tap', 70);
            showGif(mascotGif, 950);

            // Particles
            for(let i=0; i<5; i++) {
                particles.push(createParticle(x, y, 'heart'));
            }

            // Unlock Check
            if (score >= nextUnlock) {
                triggerUnlock();
            }
        }
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // --- Game Logic ---
    const triggerUnlock = () => {
        playSfx('unlock', 220);
        currentSkin = (currentSkin + 1) % skins.length;
        showGif(rewardGif, 1800);
        nextUnlock = Math.floor(nextUnlock * 1.8); // Increase difficulty
        nextGoalEl.innerText = nextUnlock;
        
        // Visual Feedback
        unlockMsg.classList.remove('hidden');
        unlockMsg.classList.add('fade-in');
        
        // Explosion of confetti
        for(let i=0; i<50; i++) {
            particles.push(createParticle(catX, catY - 50, 'confetti'));
        }

        setTimeout(() => {
            unlockMsg.classList.add('hidden');
            unlockMsg.classList.remove('fade-in');
        }, 2000);
    };

    const createParticle = (x, y, type) => {
        return {
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10 - 5,
            life: 1.0,
            type: type, // 'heart' or 'confetti'
            color: type === 'heart' ? '#FF6B6B' : `hsl(${Math.random()*360}, 100%, 70%)`,
            size: Math.random() * 10 + 5
        };
    };

    const updatePhysics = (dt) => {
        // Spring Physics for Cat Scale
        // Hooke's Law: F = -k*x - c*v
        const k = 150; // Stiffness
        const damping = 8;
        const target = 1;
        
        const displacement = catScale - target;
        const force = -k * displacement - damping * catVel;
        
        // Euler integration
        catVel += force * (dt / 1000); // Scale velocity
        catScale += catVel * (dt / 1000); // Scale position

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.life -= dt / 1000;
            if (p.life <= 0) particles.splice(i, 1);
        }
    };

    // --- Rendering ---
    const drawCat = (ctx, x, y, scale, skinIdx) => {
        const skin = skins[skinIdx];
        const r = catBaseRadius;
        
        ctx.save();
        ctx.translate(x, y);
        
        // Apply squish scale (squash Y, stretch X slightly to conserve volume)
        // scale > 1 means stretched vertically? No, let's say scale is Y-scale.
        // If Y grows, X shrinks.
        // Actually simpler: scale affects both but Y more.
        // Let's implement squash and stretch:
        // if scale deviates from 1:
        // y_scale = scale
        // x_scale = 1 + (1 - scale) * 0.5
        
        const sy = 1 + (1 - scale) * 0.5; // Invert logic: if scale is 1.2 (stretched), y is bigger
        // Wait, earlier I set catVel positive to squish? 
        // Let's just map catScale directly to Y scale.
        // If catScale > 1, it's tall. If < 1, it's flat.
        // I want click to make it flat (squish), then spring back.
        // So click -> catScale < 1.
        
        const yScale = catScale;
        const xScale = 2 - catScale; // Volume preservation approx
        
        ctx.scale(xScale, yScale);

        // Character glow
        ctx.save();
        ctx.shadowColor = skin.glow;
        ctx.shadowBlur = 30;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.ellipse(0, -10, r * 0.96, r * 1.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Body (Simple blob)
        ctx.fillStyle = skin.color;
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, 0); // Semi circle top
        ctx.lineTo(r, r*0.8);
        ctx.bezierCurveTo(r, r*1.2, -r, r*1.2, -r, r*0.8); // Bottom curve
        ctx.fill();

        // Belly patch
        ctx.fillStyle = skin.belly;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.24, r * 0.55, r * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.beginPath();
        ctx.moveTo(-r*0.7, -r*0.5);
        ctx.lineTo(-r*0.9, -r*1.3);
        ctx.lineTo(-r*0.3, -r*0.8);
        ctx.fill(); // Left Ear

        ctx.beginPath();
        ctx.moveTo(r*0.7, -r*0.5);
        ctx.lineTo(r*0.9, -r*1.3);
        ctx.lineTo(r*0.3, -r*0.8);
        ctx.fill(); // Right Ear

        ctx.fillStyle = skin.ear;
        ctx.beginPath();
        ctx.moveTo(-r*0.66, -r*0.58);
        ctx.lineTo(-r*0.78, -r*1.08);
        ctx.lineTo(-r*0.44, -r*0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r*0.66, -r*0.58);
        ctx.lineTo(r*0.78, -r*1.08);
        ctx.lineTo(r*0.44, -r*0.8);
        ctx.fill();

        // Stripes (if tabby)
        if (skin.stripes) {
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(0, -r*0.8, 20, 10, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -r*0.6, 30, 10, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Face
        // Eyes
        ctx.fillStyle = skin.eyes;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.2, 13, 15, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = skin.glow;
        ctx.beginPath();
        ctx.ellipse(-r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.ellipse(r*0.3, -r*0.12, 4, 6, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Shine in eyes
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.arc(r*0.3 + 5, -r*0.2 - 5, 4, 0, Math.PI*2);
        ctx.fill();

        // Cheeks
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.44, r * 0.02, 16, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = skin.nose;
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 6, 0, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = "#5D4037";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, 12, 20, 7);
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-10, 12, -20, 7);
        ctx.stroke();

        // Whiskers
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.moveTo(-r*0.5, 0); ctx.lineTo(-r*0.9, -10);
        ctx.moveTo(-r*0.5, 5); ctx.lineTo(-r*0.9, 10);
        ctx.moveTo(r*0.5, 0); ctx.lineTo(r*0.9, -10);
        ctx.moveTo(r*0.5, 5); ctx.lineTo(r*0.9, 10);
        ctx.stroke();

        ctx.restore();
    };

    const drawParticles = (ctx) => {
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            
            if (p.type === 'heart') {
                // Draw heart
                const size = p.size;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-size/2, -size/2, -size, size/3, 0, size);
                ctx.bezierCurveTo(size, size/3, size/2, -size/2, 0, 0);
                ctx.fill();
                ctx.restore();
            } else {
                // Confetti rect
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 10);
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size/2);
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1;
    };

    const drawBackground = (ctx) => {
        const sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        sky.addColorStop(0, "#20124d");
        sky.addColorStop(0.55, "#3f247b");
        sky.addColorStop(1, "#6c3dc0");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const glow = ctx.createRadialGradient(
            window.innerWidth / 2, window.innerHeight * 0.26, 20,
            window.innerWidth / 2, window.innerHeight * 0.26, window.innerHeight * 0.72
        );
        glow.addColorStop(0, "rgba(255, 241, 168, 0.26)");
        glow.addColorStop(0.45, "rgba(136, 247, 255, 0.12)");
        glow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        for (let i = 0; i < 7; i++) {
            const y = window.innerHeight - 130 + i * 22;
            ctx.strokeStyle = `rgba(136, 247, 255, ${0.22 - i * 0.02})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.quadraticCurveTo(window.innerWidth * 0.25, y - 8, window.innerWidth * 0.5, y);
            ctx.quadraticCurveTo(window.innerWidth * 0.75, y + 8, window.innerWidth, y);
            ctx.stroke();
        }

        ctx.fillStyle = "rgba(255,255,255,0.12)";
        for (let i = 0; i < 3; i++) {
            const cloudX = window.innerWidth * (0.18 + i * 0.32);
            const cloudY = window.innerHeight * (0.18 + (i % 2) * 0.08);
            ctx.beginPath();
            ctx.ellipse(cloudX, cloudY, 42, 16, 0, 0, Math.PI * 2);
            ctx.ellipse(cloudX + 28, cloudY - 8, 30, 14, 0, 0, Math.PI * 2);
            ctx.ellipse(cloudX - 28, cloudY - 6, 26, 12, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (gameState === 'PLAY') {
            updatePhysics(dt);
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw
        drawBackground(ctx);
        
        if (gameState === 'PLAY') {
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.beginPath();
            ctx.ellipse(catX, catY + 80, 100 * (2-catScale), 20, 0, 0, Math.PI*2);
            ctx.fill();

            drawCat(ctx, catX, catY - 40, catScale, currentSkin);
            drawParticles(ctx);
        }

        requestAnimationFrame(loop);
    };

    // --- Init ---
    const startBtn = document.getElementById('start-btn');
    let startTriggered = false;
    const startGame = async () => {
        if (startTriggered || gameState !== 'START') return;
        startTriggered = true;
        await unlockAudio();
        playSfx('start', 250);
        showGif(mascotGif, 1500);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAY';
        
        // Initial config sync
        document.body.style.backgroundColor = window.gameConfig.bgColor;
        nextUnlock = window.gameConfig.unlockMultiplier;
        nextGoalEl.innerText = nextUnlock;
    };
    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: native click + pointerup support without global touch suppression
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerup', startGame);

    document.addEventListener('visibilitychange', () => {
        if (!sounds.bgm) return;
        if (document.hidden) {
            sounds.bgm.pause();
            return;
        }
        if (audioUnlocked && gameState === 'PLAY') {
            sounds.bgm.play().catch(() => {});
        }
    });

    requestAnimationFrame(loop);
});
</script>
