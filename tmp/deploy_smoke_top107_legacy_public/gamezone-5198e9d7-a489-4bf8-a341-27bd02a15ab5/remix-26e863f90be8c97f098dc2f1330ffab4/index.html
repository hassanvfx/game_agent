<body>

            <button onclick="location.reload()" class="w-full bg-[#1DA1F2] text-white font-bold py-4 rounded-xl hover:bg-blue-500 transition shadow-lg shadow-blue-500/30">

<script>
// --- §1 Configuration & State ---
const CONFIG = {
    targetGive: 100,
    targetGet: 20,
    colors: ['#73F0FF', '#FF5BCF', '#9BFF5D', '#FFD75E', '#8B6DFF']
};

let state = {
    mode: null,
    score: 0,
    target: 100,
    isPlaying: false,
    lastTime: 0,
    profile: {
        name: '',
        color: ''
    }
};
let feedbackTimer = null;

function getEmbeddedGameConfig() {
    const configEl = document.getElementById('game-config');
    if (!configEl) return null;

    try {
        return JSON.parse(configEl.textContent);
    } catch (_) {
        return null;
    }
}

// --- §2 Audio Manager ---
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sounds = {
    bgm: document.getElementById('bgm_main'),
    like: document.getElementById('sfx_like'),
    win: document.getElementById('sfx_win'),
    ui: document.getElementById('sfx_ui'),
    start: document.getElementById('sfx_start')
};
const sfxCooldowns = new Map();

function safeResumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function unlockAudio() {
    safeResumeAudio();
    sounds.bgm.volume = 0.18;
    sounds.bgm.play().catch(() => {});
}

function stopLoopedAudio() {
    sounds.bgm.pause();
    sounds.bgm.currentTime = 0;
}

function playSfx(id) {
    safeResumeAudio();
    const now = performance.now();
    const cooldown = id === 'like' ? 90 : 180;
    if ((sfxCooldowns.get(id) || 0) > now) return;
    sfxCooldowns.set(id, now + cooldown);

    const el = sounds[id];
    if (el) {
        try {
            el.pause();
            el.currentTime = 0;
        } catch (_) {}
        el.play().catch(() => playSynth(id));
    } else {
        playSynth(id);
    }
}

function playSynth(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'like' || type === 'ui') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'like' ? 700 : 520, now);
        osc.frequency.exponentialRampToValueAtTime(type === 'like' ? 1100 : 740, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
        return;
    }

    if (type === 'start') {
        const freqs = [330, 440, 660];
        freqs.forEach((freq, index) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + index * 0.04);
            g.gain.setValueAtTime(0.0001, now + index * 0.04);
            g.gain.exponentialRampToValueAtTime(0.05, now + index * 0.04 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.04 + 0.24);
            o.start(now + index * 0.04);
            o.stop(now + index * 0.04 + 0.24);
        });
        return;
    }

    const freqs = [523.25, 659.25, 783.99];
    freqs.forEach((freq, index) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + index * 0.06);
        g.gain.setValueAtTime(0.0001, now + index * 0.06);
        g.gain.exponentialRampToValueAtTime(0.08, now + index * 0.06 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.06 + 0.5);
        o.start(now + index * 0.06);
        o.stop(now + index * 0.06 + 0.5);
    });
}

// --- §3 Visual System (Canvas) ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let bgShapes = [];

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initBgShapes();
}

function initBgShapes() {
    bgShapes = [];
    for (let i = 0; i < 15; i++) {
        bgShapes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 50 + 20,
            color: CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)],
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5
        });
    }
}

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
        this.size = Math.random() * 8 + 4;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.5;
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(x, y) {
    for (let i = 0; i < 12; i++) particles.push(new Particle(x, y));
}

function drawBackground() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#090c1f');
    grad.addColorStop(0.45, '#11183a');
    grad.addColorStop(1, '#05060d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    bgShapes.forEach((s) => {
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < -s.r) s.x = w + s.r;
        if (s.x > w + s.r) s.x = -s.r;
        if (s.y < -s.r) s.y = h + s.r;
        if (s.y > h + s.r) s.y = -s.r;

        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        glow.addColorStop(0, `${s.color}55`);
        glow.addColorStop(1, `${s.color}00`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.strokeStyle = 'rgba(115, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let y = 0; y < h; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }
}

function gameLoop(time) {
    state.lastTime = time;

    drawBackground();

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (state.isPlaying && state.score >= state.target) {
        winGame();
    }

    requestAnimationFrame(gameLoop);
}

// --- §4 Profile Logic ---

function selectName(name) {
    const input = document.getElementById('username-input');
    input.value = name;
    state.profile.name = name;

    document.querySelectorAll('.chip-btn').forEach(btn => {
        if (btn.innerText === name) btn.classList.add('selected');
        else btn.classList.remove('selected');
    });

    checkProfileComplete();
}

function customNameInput(val) {
    state.profile.name = val;
    document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('selected'));
    checkProfileComplete();
}

function selectColor(color) {
    state.profile.color = color;
    document.querySelectorAll('.color-opt').forEach(div => {
        if (div.style.background === color) div.classList.add('selected');
        else div.classList.remove('selected');
    });

    const opts = document.querySelectorAll('.color-opt');
    opts.forEach(opt => {
        opt.classList.remove('selected');
    });

    const clicked = Array.from(opts).find(o => o.style.backgroundColor.includes(hexToRgb(color)));
    if (!clicked) {
        Array.from(opts).find(o => o.getAttribute('style').includes(color))?.classList.add('selected');
    } else {
        clicked.classList.add('selected');
    }

    checkProfileComplete();
}

function hexToRgb(hex) {
    const bigint = parseInt(hex.slice(1), 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `${r}, ${g}, ${b}`;
}

function checkProfileComplete() {
    const btn = document.getElementById('btn-next');
    if (state.profile.name.length > 0 && state.profile.color.length > 0) {
        btn.disabled = false;
    } else {
        btn.disabled = true;
    }
}

function showFeedback(message, gifId) {
    const banner = document.getElementById('feedback-banner');
    const text = document.getElementById('feedback-text');
    const gif = document.getElementById('feedback-gif');
    const source = document.getElementById(gifId);

    if (!banner || !text || !gif || !source) return;

    text.textContent = message;
    gif.src = source.src;
    banner.classList.add('visible');
    gif.classList.add('visible');

    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        banner.classList.remove('visible');
        gif.classList.remove('visible');
    }, 1600);
}

function goToModes() {
    playSfx('ui');
    document.getElementById('phase-profile').classList.add('hidden');
    document.getElementById('phase-mode').classList.remove('hidden');
}

function backToProfile() {
    playSfx('ui');
    document.getElementById('phase-mode').classList.add('hidden');
    document.getElementById('phase-profile').classList.remove('hidden');
}

// --- §5 Game Logic & Feed ---

const POSTS_DATA = [
    {
        type: 'image',
        srcId: 'asset_meme1',
        user: 'LoopLoader',
        caption: 'Opening round: rate the vibe before it scrolls away. #arcadefeed',
        comments: ['Locked in', 'Fast tap meta', 'Clip this']
    },
    {
        type: 'image',
        srcId: 'asset_meme2',
        user: 'ComboCrafter',
        caption: 'Every like extends the streak. Stay sharp.',
        comments: ['True combo energy', 'No misses', 'Keep farming']
    },
    {
        type: 'image',
        srcId: 'asset_meme3',
        user: 'PatchNotesLive',
        caption: 'Chaotic meme patch deployed. React before the crowd does.',
        comments: ['Buffed absurdity', 'Meta shifted', 'I saw this live']
    },
    {
        type: 'image',
        srcId: 'asset_brazil',
        user: 'VictoryReplay',
        caption: 'When the feed finally lands the perfect reaction shot.',
        comments: ['Instant replay', 'Certified banger', 'That hit clean']
    },
    {
        type: 'image',
        srcId: 'asset_meme1',
        user: 'NightShiftMod',
        caption: 'Late-night queue, same mission: keep the hype bar glowing.',
        comments: ['Still grinding', 'One more round', 'Queue again']
    }
];

function createAvatarBadge(user, index) {
    const symbolSet = ['⚡', '✨', '🎯', '🎮', '💥'];
    const symbol = symbolSet[index % symbolSet.length];
    const color = CONFIG.colors[index % CONFIG.colors.length];
    return `<div class="avatar" style="background: linear-gradient(135deg, ${color}, rgba(255,255,255,0.78));">${symbol}</div>`;
}

function createPostHTML(data, index) {
    const asset = document.getElementById(data.srcId);
    let media = '';
    if (data.type === 'video') {
        media = `<video src="${asset ? asset.src : ''}" loop playsinline muted autoplay></video>`;
    } else {
        media = `<img src="${asset ? asset.src : ''}" loading="lazy">`;
    }

    const commentsHTML = data.comments.map(c =>
        `<div class="comment"><strong>user${Math.floor(Math.random() * 1000)}</strong> ${c}</div>`
    ).join('');

    return `
    <div class="post-card" id="post-${index}">
        <div class="post-header">
            ${createAvatarBadge(data.user, index)}
            <div class="username">${data.user}</div>
        </div>
        <div class="post-media" ondblclick="handleLike(event, ${index})">
            ${media}
        </div>
        <div class="post-actions">
            <div class="action-btn" id="btn-like-${index}" onclick="handleLike(event, ${index})">
                <span class="text-2xl">🤍</span> <span id="likes-${index}">${Math.floor(Math.random() * 500)}</span>
            </div>
            <div class="action-btn">
                <span class="text-2xl">💬</span> <span>${data.comments.length}</span>
            </div>
            <div class="action-btn">
                <span class="text-2xl">🚀</span>
            </div>
        </div>
        <div class="px-1 text-sm mb-2 feed-caption"><span class="font-bold">${data.user}</span> ${data.caption}</div>
        <div class="comments-box">
            ${commentsHTML}
        </div>
    </div>`;
}

function generateFeed() {
    const container = document.getElementById('feed-container');
    let html = '';

    POSTS_DATA.forEach((p, i) => html += createPostHTML(p, i));

    for (let i = 0; i < 15; i++) {
        const tpl = POSTS_DATA[Math.floor(Math.random() * POSTS_DATA.length)];
        html += createPostHTML(tpl, POSTS_DATA.length + i);
    }

    container.innerHTML = html;

    container.querySelectorAll('video').forEach(v => {
        v.muted = true;
        v.play().catch(() => {});
    });
}

window.handleLike = function(e, idx) {
    e.stopPropagation();
    e.preventDefault();

    const btn = document.getElementById(`btn-like-${idx}`);
    if (btn.classList.contains('liked')) return;

    btn.classList.add('liked');
    const heartIcon = btn.querySelector('span:first-child');
    heartIcon.innerText = '❤️';

    const countSpan = document.getElementById(`likes-${idx}`);
    countSpan.innerText = parseInt(countSpan.innerText) + 1;

    playSfx('like');
    const rect = btn.getBoundingClientRect();
    spawnParticles(rect.left + 20, rect.top + 20);
    showFeedback(state.mode === 'give' ? 'Like streak boosted.' : 'Clout spike locked in.', 'asset_reaction_like');

    if (state.mode === 'give') {
        state.score++;
    } else {
        state.score += 1;
    }
    updateUI();
}

function updateUI() {
    document.getElementById('score-display').innerText = `${state.score} / ${state.target}`;
}

// --- §6 Core Flow ---

window.startGame = function(mode) {
    unlockAudio();
    playSfx('start');
    state.mode = mode;
    state.score = 0;
    state.target = mode === 'give' ? CONFIG.targetGive : CONFIG.targetGet;
    state.isPlaying = true;

    document.getElementById('header-username').innerText = state.profile.name;
    const headerAvatar = document.getElementById('header-avatar');
    headerAvatar.style.background = `linear-gradient(135deg, ${state.profile.color}, rgba(255,255,255,0.85))`;
    headerAvatar.textContent = state.mode === 'give' ? '❤️' : '🌟';

    document.getElementById('target-icon').innerText = mode === 'give' ? '❤️' : '🌟';
    updateUI();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');

    generateFeed();
    showFeedback(mode === 'give' ? 'Heart combo live. Double-tap the hottest posts.' : 'Clout hunt live. Stack reactions before the scroll wins.', 'asset_reaction_like');
}

function winGame() {
    state.isPlaying = false;
    stopLoopedAudio();
    playSfx('win');
    showFeedback('Trend secured. Feed conquered.', 'asset_reaction_win');
    document.getElementById('win-msg').innerText = state.mode === 'give' ? "You dropped 100 hype hearts and owned the feed." : "You stacked 20 clout points and went fully viral.";
    document.getElementById('win-screen').classList.remove('hidden');

    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    for (let i = 0; i < 100; i++) {
        particles.push(new Particle(w / 2, h / 2));
    }
}

document.addEventListener('DOMContentLoaded', () => {
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(gameLoop);

    const embeddedConfig = getEmbeddedGameConfig();
    const configuredTitle = window.gameConfig?.gameTitle || embeddedConfig?.gameTitle?.value;
    if (configuredTitle) {
        document.title = configuredTitle;
    }
});
</script>
</body>
</html>
