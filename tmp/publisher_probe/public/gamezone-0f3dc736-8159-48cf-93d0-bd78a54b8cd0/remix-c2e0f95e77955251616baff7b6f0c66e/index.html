<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Mom Joy Brainrot Pop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | action: Exo 2 for UI/HUD readability, Audiowide for title/buttons -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Audiowide&family=Material+Symbols+Sharp" rel="stylesheet">
    <style>
        :root {
            --bg-top: #2d123f;
            --bg-bottom: #ffb3c9;
            --panel: rgba(72, 24, 68, 0.84);
            --panel-strong: rgba(105, 38, 86, 0.94);
            --line: rgba(255, 236, 170, 0.42);
            --glow: rgba(255, 111, 174, 0.34);
            --text: #fff8f4;
            --muted: #ffe1eb;
            --accent: #ffec7a;
            --accent-strong: #ff6fae;
            --warning: #8b2cff;
            --hud-bg: rgba(85, 25, 70, 0.72);
            --shadow: 0 16px 38px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 236, 170, 0.16), transparent 32%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.2) 0 1px, transparent 2px),
                radial-gradient(circle at 72% 24%, rgba(255,255,255,0.16) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 58% 78%, rgba(255,255,255,0.13) 0 1px, transparent 2px),
                radial-gradient(circle at 85% 60%, rgba(255, 111, 174, 0.16) 0 2px, transparent 3px),
                radial-gradient(circle at 10% 70%, rgba(255, 236, 170, 0.14) 0 2px, transparent 3px);
            background-size: 180px 180px, 220px 220px, 260px 260px, 200px 200px, 240px 240px;
            opacity: 0.9;
            animation: momSparkleDrift 18s linear infinite;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 14%, transparent 86%, rgba(0,0,0,0.22));
        }

        @keyframes momSparkleDrift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-36px, -48px, 0); }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.28);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #game-container::before {
            background:
                repeating-linear-gradient(115deg, rgba(255, 236, 170, 0.08) 0 8px, transparent 8px 28px),
                radial-gradient(circle at 12% 88%, rgba(255, 111, 174, 0.15), transparent 24%),
                radial-gradient(circle at 88% 14%, rgba(201, 139, 255, 0.12), transparent 26%);
            mix-blend-mode: screen;
            animation: tableclothSlide 16s linear infinite;
        }

        #game-container::after {
            background: radial-gradient(ellipse at center, transparent 48%, rgba(45, 18, 63, 0.28) 100%);
        }

        @keyframes tableclothSlide {
            from { background-position: 0 0, 0 0, 0 0; }
            to { background-position: 90px 60px, 0 0, 0 0; }
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(14px, env(safe-area-inset-top)) max(14px, calc(env(safe-area-inset-right) + 14px)) max(14px, calc(env(safe-area-inset-bottom) + 14px)) max(14px, calc(env(safe-area-inset-left) + 14px));
        }

        .screen {
            pointer-events: auto;
            width: min(92vw, 420px);
            max-height: min(86vh, 560px);
            overflow-y: auto;
            background:
                linear-gradient(180deg, rgba(105, 38, 86, 0.95), rgba(45, 18, 63, 0.95));
            padding: 1.35rem 1.15rem;
            border-radius: 1.25rem;
            text-align: center;
            color: var(--text);
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 36px rgba(255, 111, 174, 0.18);
            position: relative;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 236, 170, 0.16), transparent 28%),
                repeating-linear-gradient(135deg, rgba(255,255,255,0.045) 0 7px, transparent 7px 22px),
                linear-gradient(135deg, rgba(255, 236, 170, 0.2), transparent 30%, transparent 70%, rgba(255, 111, 174, 0.14));
            opacity: 0.9;
        }

        .screen::after {
            content: "♡";
            position: absolute;
            top: 0.55rem;
            right: 0.8rem;
            color: rgba(255, 236, 170, 0.48);
            font-family: 'Audiowide', sans-serif;
            font-size: 1.2rem;
            pointer-events: none;
            text-shadow: 0 0 14px rgba(255, 111, 174, 0.42);
        }

        .screen > * {
            position: relative;
            z-index: 1;
        }

        #start-screen { display: block; }

        h1 {
            margin: 0 0 0.9rem 0;
            font-size: clamp(1.8rem, 7vw, 2.35rem);
            line-height: 1.05;
            color: #fff8f4;
            text-shadow: 0 0 18px rgba(255, 111, 174, 0.34);
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
        }

        p {
            color: var(--muted);
            margin: 0 0 1.25rem;
            font-size: clamp(0.95rem, 3.7vw, 1.05rem);
            line-height: 1.5;
        }

        .screen-copy-strong {
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
            margin-bottom: 0.65rem;
            display: block;
        }

        button {
            background: linear-gradient(180deg, #ffec7a, #ff6fae);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 0.95rem 1.2rem;
            min-height: 48px;
            font-size: 1rem;
            color: #3b1036;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 24px rgba(255, 111, 174, 0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            width: min(100%, 260px);
        }

        button:hover,
        button:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow: 0 12px 26px rgba(255, 111, 174, 0.38);
            outline: none;
        }

        button:active {
            transform: scale(0.97);
        }

        #hud {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            color: var(--text);
            font-size: clamp(0.72rem, 2.8vw, 0.92rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.48);
            pointer-events: none;
            display: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            text-transform: uppercase;
            background: var(--hud-bg);
            border: 1px solid rgba(255, 236, 170, 0.24);
            border-radius: 999px;
            padding: 0.55rem 0.8rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
        }

        #scoreVal {
            color: var(--accent);
        }

        #controls {
            position: absolute;
            right: max(14px, calc(env(safe-area-inset-right) + 10px));
            bottom: max(16px, calc(env(safe-area-inset-bottom) + 12px));
            pointer-events: auto;
            z-index: 100;
        }

        .icon-btn {
            background: var(--panel);
            border: 1px solid rgba(255, 236, 170, 0.28);
            color: var(--text);
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            backdrop-filter: blur(8px);
        }

        .icon-btn .material-symbols-sharp {
            font-size: 24px;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 40;
        }

        #ui-layer,
        #hud,
        #controls {
            z-index: 90;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 22vw, 132px);
            opacity: 0;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.35));
            transition: opacity 0.2s ease, transform 0.2s ease;
            will-change: opacity, transform;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
        }

        .feedback-gif-top {
            top: max(70px, calc(env(safe-area-inset-top) + 56px));
            right: max(12px, calc(env(safe-area-inset-right) + 14px));
            transform: translateY(-8px) scale(0.96);
        }

        .feedback-gif-bottom {
            left: max(12px, calc(env(safe-area-inset-left) + 14px));
            bottom: max(90px, calc(env(safe-area-inset-bottom) + 82px));
            transform: translateY(8px) scale(0.96);
        }

        .feedback-gif-top.is-visible,
        .feedback-gif-bottom.is-visible {
            transform: translateY(0) scale(1);
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.42rem 0.7rem;
            border-radius: 999px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            color: var(--accent);
            background: rgba(255, 236, 170, 0.1);
            border: 1px solid rgba(255, 236, 170, 0.24);
            margin-bottom: 0.75rem;
        }

        @media (max-width: 480px) {
            .screen {
                padding: 1.1rem 0.95rem;
                border-radius: 1rem;
            }

            .feedback-gif {
                width: clamp(76px, 26vw, 104px);
            }

            .feedback-gif-top {
                top: max(76px, calc(env(safe-area-inset-top) + 64px));
            }

            .feedback-gif-bottom {
                bottom: max(94px, calc(env(safe-area-inset-bottom) + 86px));
            }

            p br {
                display: none;
            }

            button {
                width: 100%;
                font-size: 0.96rem;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
    <div id="hud">Mom Joy: <span id="scoreVal">0</span></div>
    
    <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
    <div id="controls">
        <button id="muteBtn" class="icon-btn" aria-label="Toggle audio">
            <span class="material-symbols-sharp">volume_up</span>
        </button>
    </div>

    <!-- [agent-note][world-design-v4] authored-world: brainrot 3D Mother's Day | keep feedback off playfield controls -->
    <!-- [agent-note][stage3] resolved-gif: combo/game-over feedback -> catalogs/gifs.json -->
    <div id="feedback-layer" aria-hidden="true">
        <img id="combo-gif" class="feedback-gif feedback-gif-top" alt="Combo celebration effect">
        <img id="danger-gif" class="feedback-gif feedback-gif-bottom" alt="Relay danger warning effect">
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <span class="screen-copy-strong">Momcore Dispatch</span>
            <h1>MOM JOY BRAINROT POP</h1>
            <div class="status-chip">Gift Table Online</div>
            <p>Drag to aim. Release to launch.<br>Match 3 Mom Joy charms to clear the gift stack.</p>
            <button id="startBtn">START POP</button>
        </div>
        <div id="game-over-screen" class="screen">
            <span class="screen-copy-strong">Gift Stack Overload</span>
            <h1 id="go-title">MOM JOY LOST</h1>
            <p>Mom Joy: <span id="finalScore">0</span></p>
            <button id="restartBtn">RETRY POP</button>
        </div>
    </div>
</div>

<script>
/**
 * 1. ASSET CONFIGURATION
 */
const ASSETS = {
    images: {
        bubble: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png",
        /* [agent-note][world-design-v4] non-protected-bg: generic city image is approved catalog media but should be demoted/replaced by procedural Mother's Day brainrot scenery in visuals_unified. */
        background: "https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png"
    },
    audio: {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
        throw: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
        pop: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
        combo: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
        fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
        ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
        start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
        restart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3"
    },
    gifs: {
        combo: "https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp",
        danger: "https://i.giphy.com/9npIiZIdldtWYhGztn.webp"
    }
};

const COLORS = [
    { name: 'heart-pink', hex: '#ff6fae', glow: 'rgba(255, 111, 174, 0.45)', charm: 'heart' },
    { name: 'card-gold', hex: '#ffd166', glow: 'rgba(255, 209, 102, 0.45)', charm: 'card' },
    { name: 'bouquet-mint', hex: '#8ee6a8', glow: 'rgba(142, 230, 168, 0.42)', charm: 'flower' },
    { name: 'brainrot-lilac', hex: '#c98bff', glow: 'rgba(201, 139, 255, 0.45)', charm: 'cake' }
];

/**
 * 2. AUDIO MANAGER SYSTEM
 */
class AudioManager {
    constructor() {
        this.sounds = {};
        this.cooldowns = new Map();
        this.muted = false;
        this.ready = false;
    }

    preload() {
        if (this.ready) return;
        Object.entries(ASSETS.audio).forEach(([key, url]) => {
            if (!url) return;
            const audio = new Audio(url);
            audio.preload = 'auto';
            if (key === 'bgm') {
                audio.loop = true;
                audio.volume = 0.2;
            } else if (key === 'pop') {
                audio.volume = 0.5;
            } else if (key === 'throw') {
                audio.volume = 0.38;
            } else {
                audio.volume = 0.44;
            }
            this.sounds[key] = audio;
        });
        this.ready = true;
    }

    unlock() {
        this.preload();
        if (this.muted || !this.sounds.bgm) return;
        const bgm = this.sounds.bgm;
        bgm.play().then(() => {
            bgm.pause();
            bgm.currentTime = 0;
        }).catch(() => {});
    }

    play(key, options = {}) {
        if (this.muted || !this.sounds[key]) return;
        const { restart = false, cooldown = 0 } = options;
        const now = performance.now();

        if (cooldown > 0) {
            const nextAllowedAt = this.cooldowns.get(key) || 0;
            if (now < nextAllowedAt) return;
            this.cooldowns.set(key, now + cooldown);
        }

        if (key === 'bgm') {
            const bgm = this.sounds[key];
            if (restart) {
                bgm.currentTime = 0;
            }
            bgm.play().catch(() => {});
            return;
        }

        const base = this.sounds[key];
        if (restart) {
            base.pause();
            base.currentTime = 0;
            base.play().catch(() => {});
            return;
        }

        const sfx = base.cloneNode();
        sfx.volume = base.volume;
        sfx.play().catch(() => {});
    }

    stop(key) {
        if (!this.sounds[key]) return;
        this.sounds[key].pause();
        this.sounds[key].currentTime = 0;
    }

    toggleMute() {
        this.muted = !this.muted;
        const btnIcon = document.querySelector('#muteBtn .material-symbols-sharp');
        if (btnIcon) {
            btnIcon.textContent = this.muted ? 'volume_off' : 'volume_up';
        }

        if (!this.sounds.bgm) return;
        if (this.muted) {
            this.sounds.bgm.pause();
        } else {
            this.play('bgm');
        }
    }
}

/**
 * 3. GAME LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioManager = new AudioManager();
const comboGif = document.getElementById('combo-gif');
const dangerGif = document.getElementById('danger-gif');

// Game State
let gameState = 'START'; // START, PLAY, GAMEOVER
let score = 0;
let lastTime = 0;

// Grid Config
const GRID_COLS = 8;
const GRID_ROWS = 12; // Visible rows
let TILE_SIZE = 40; // Calculated dynamically
let OFFSET_X = 0;
let OFFSET_Y = 0;

// Entities
let grid = []; // 2D array
let particles = [];
let projectile = null;
let nextBubbleType = 0;
let animationId;

// Images
const imgBubble = new Image();
const imgBg = new Image();
let assetsLoaded = 0;

function checkAssets() {
    assetsLoaded++;
    if (assetsLoaded === 2) {
        console.log("Assets Loaded");
        draw(); // Initial draw
    }
}

imgBubble.src = ASSETS.images.bubble;
imgBubble.onload = checkAssets;
imgBg.src = ASSETS.images.background;
imgBg.onload = checkAssets;
comboGif.src = ASSETS.gifs.combo;
dangerGif.src = ASSETS.gifs.danger;

// Input
let aimAngle = -Math.PI / 2;
let isDragging = false;

// --- Core Classes ---

class Bubble {
    constructor(r, c, type) {
        this.r = r;
        this.c = c;
        this.type = type; // Index in COLORS
        this.x = 0;
        this.y = 0;
        this.active = true;
        this.updatePos();
    }

    updatePos() {
        // Hex grid math
        // Odd rows offset by half width
        const offsetX = (this.r % 2 === 1) ? TILE_SIZE / 2 : 0;
        this.x = OFFSET_X + this.c * TILE_SIZE + TILE_SIZE / 2 + offsetX;
        this.y = OFFSET_Y + this.r * (TILE_SIZE * 0.866) + TILE_SIZE / 2; // 0.866 is sin(60deg) approx
    }

    draw(context) {
        if (!this.active) return;
        
        const radius = TILE_SIZE / 2 - 2;
        const color = COLORS[this.type];
        
        context.save();
        context.translate(this.x, this.y);

        context.beginPath();
        context.arc(0, 0, radius + 4, 0, Math.PI * 2);
        context.fillStyle = color.glow;
        context.globalAlpha = 0.85;
        context.fill();

        context.beginPath();
        context.arc(0, 0, radius + 1.5, 0, Math.PI * 2);
        context.fillStyle = 'rgba(8, 17, 35, 0.55)';
        context.globalAlpha = 1;
        context.fill();
        
        drawMomCharm(context, this.type, radius, 0);

        context.strokeStyle = 'rgba(255,255,255,0.58)';
        context.lineWidth = Math.max(1.5, TILE_SIZE * 0.04);
        context.beginPath();
        context.arc(0, 0, radius - 1, 0, Math.PI * 2);
        context.stroke();

        context.restore();
    }
}

class Projectile {
    constructor(type) {
        this.type = type;
        this.x = canvas.width / 2;
        this.y = canvas.height - TILE_SIZE * 2;
        this.vx = 0;
        this.vy = 0;
        this.radius = TILE_SIZE / 2 - 2;
        this.active = true;
        this.moving = false;
    }

    shoot(angle) {
        const speed = TILE_SIZE * 0.5; // Speed relative to screen size
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.moving = true;
        audioManager.play('throw');
    }

    update() {
        if (!this.moving) return;

        this.x += this.vx;
        this.y += this.vy;

        // Wall collisions
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        }
        if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -1;
        }
        
        // Ceiling collision
        if (this.y - this.radius < 0) {
            this.snapToGrid();
        }
    }

    draw(context) {
        if (!this.active) return;
        
        const color = COLORS[this.type];

        context.save();
        context.translate(this.x, this.y);

        context.beginPath();
        context.arc(0, 0, this.radius + 5, 0, Math.PI * 2);
        context.fillStyle = color.glow;
        context.globalAlpha = 0.9;
        context.fill();
        
        drawMomCharm(context, this.type, this.radius, performance.now() * 0.004);
        
        context.restore();
    }

    snapToGrid() {
        this.moving = false;
        
        // Find nearest grid coordinate
        // Inverse of updatePos logic
        const gridY = (this.y - OFFSET_Y - TILE_SIZE / 2) / (TILE_SIZE * 0.866);
        let r = Math.round(gridY);
        
        // Handle X based on row parity
        const offsetX = (r % 2 === 1) ? TILE_SIZE / 2 : 0;
        const gridX = (this.x - OFFSET_X - TILE_SIZE / 2 - offsetX) / TILE_SIZE;
        let c = Math.round(gridX);

        // Clamp
        if (r < 0) r = 0;
        if (c < 0) c = 0;
        if (c >= GRID_COLS - (r % 2)) c = GRID_COLS - (r % 2) - 1;

        // Check if occupied, if so, move to neighbor closest to entry vector
        // Simple fallback: if occupied, just search neighbors
        while (grid[r] && grid[r][c]) {
            r++;
        }

        // Expand grid if necessary
        if (!grid[r]) grid[r] = [];

        const newBubble = new Bubble(r, c, this.type);
        grid[r][c] = newBubble;

        // Check Matches
        handleLanding(newBubble);
        
        // Reset Projectile
        spawnProjectile();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((1 - this.life) * Math.PI * 2);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        drawHeartPath(ctx, 0, -1, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.78)';
        ctx.beginPath();
        ctx.arc(-2, -4, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1.0;
    }
}

function drawRoundRectPath(context, x, y, w, h, r) {
    const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    context.beginPath();
    context.moveTo(x + radius, y);
    context.arcTo(x + w, y, x + w, y + h, radius);
    context.arcTo(x + w, y + h, x, y + h, radius);
    context.arcTo(x, y + h, x, y, radius);
    context.arcTo(x, y, x + w, y, radius);
    context.closePath();
}

function drawHeartPath(context, x, y, size) {
    context.beginPath();
    context.moveTo(x, y + size * 0.38);
    context.bezierCurveTo(x - size, y - size * 0.28, x - size * 0.52, y - size * 0.9, x, y - size * 0.42);
    context.bezierCurveTo(x + size * 0.52, y - size * 0.9, x + size, y - size * 0.28, x, y + size * 0.38);
    context.closePath();
}

function drawMomCharm(context, type, radius, wobble = 0) {
    const color = COLORS[type];
    const clay = context.createRadialGradient(-radius * 0.4, -radius * 0.45, radius * 0.08, 0, 0, radius);
    clay.addColorStop(0, 'rgba(255,255,255,0.92)');
    clay.addColorStop(0.16, color.hex);
    clay.addColorStop(0.72, color.hex);
    clay.addColorStop(1, 'rgba(59,16,54,0.78)');

    context.save();
    context.rotate(Math.sin(wobble) * 0.035);

    context.beginPath();
    context.arc(0, 0, radius, 0, Math.PI * 2);
    context.fillStyle = clay;
    context.fill();

    context.strokeStyle = 'rgba(59,16,54,0.5)';
    context.lineWidth = Math.max(2, radius * 0.12);
    context.stroke();

    context.strokeStyle = 'rgba(255,248,244,0.42)';
    context.lineWidth = Math.max(1, radius * 0.035);
    context.beginPath();
    context.arc(0, 0, radius * 0.78, -Math.PI * 0.95, Math.PI * 0.1);
    context.stroke();

    const iconScale = radius * 0.72;
    context.fillStyle = 'rgba(255,248,244,0.92)';
    context.strokeStyle = 'rgba(72,24,68,0.38)';
    context.lineWidth = Math.max(1, radius * 0.055);

    if (color.charm === 'heart') {
        drawHeartPath(context, 0, radius * 0.02, iconScale);
        context.fill();
        context.stroke();
        context.fillStyle = 'rgba(255,236,170,0.72)';
        drawHeartPath(context, radius * 0.2, -radius * 0.08, iconScale * 0.28);
        context.fill();
    } else if (color.charm === 'card') {
        context.rotate(-0.12);
        drawRoundRectPath(context, -iconScale * 0.58, -iconScale * 0.44, iconScale * 1.16, iconScale * 0.88, radius * 0.12);
        context.fill();
        context.stroke();
        context.strokeStyle = 'rgba(72,24,68,0.48)';
        context.lineWidth = Math.max(1, radius * 0.045);
        context.beginPath();
        context.moveTo(-iconScale * 0.36, -iconScale * 0.14);
        context.lineTo(iconScale * 0.36, -iconScale * 0.14);
        context.moveTo(-iconScale * 0.3, iconScale * 0.1);
        context.lineTo(iconScale * 0.18, iconScale * 0.1);
        context.stroke();
        context.fillStyle = '#ff6fae';
        drawHeartPath(context, iconScale * 0.35, iconScale * 0.2, iconScale * 0.18);
        context.fill();
    } else if (color.charm === 'flower') {
        for (let i = 0; i < 6; i++) {
            context.save();
            context.rotate((Math.PI * 2 * i) / 6);
            context.beginPath();
            context.ellipse(0, -iconScale * 0.32, iconScale * 0.18, iconScale * 0.34, 0, 0, Math.PI * 2);
            context.fill();
            context.stroke();
            context.restore();
        }
        context.fillStyle = '#ffec7a';
        context.beginPath();
        context.arc(0, 0, iconScale * 0.2, 0, Math.PI * 2);
        context.fill();
    } else {
        context.save();
        context.rotate(0.12);
        context.fillStyle = 'rgba(255,248,244,0.92)';
        drawRoundRectPath(context, -iconScale * 0.48, -iconScale * 0.2, iconScale * 0.96, iconScale * 0.54, radius * 0.1);
        context.fill();
        context.stroke();
        context.fillStyle = '#ffec7a';
        context.beginPath();
        context.moveTo(-iconScale * 0.48, -iconScale * 0.2);
        context.lineTo(iconScale * 0.48, -iconScale * 0.2);
        context.lineTo(iconScale * 0.34, -iconScale * 0.48);
        context.lineTo(-iconScale * 0.28, -iconScale * 0.4);
        context.closePath();
        context.fill();
        context.stroke();
        context.strokeStyle = 'rgba(255,111,174,0.8)';
        context.beginPath();
        context.moveTo(-iconScale * 0.28, -iconScale * 0.02);
        context.lineTo(iconScale * 0.28, -iconScale * 0.02);
        context.stroke();
        context.restore();
    }

    context.fillStyle = 'rgba(255,255,255,0.58)';
    context.beginPath();
    context.ellipse(-radius * 0.33, -radius * 0.42, radius * 0.2, radius * 0.1, -0.55, 0, Math.PI * 2);
    context.fill();

    context.restore();
}

// --- Game Functions ---

function showGifFeedback(element, duration = 1200) {
    if (!element) return;
    element.classList.add('is-visible');
    clearTimeout(element._hideTimer);
    element._hideTimer = setTimeout(() => {
        element.classList.remove('is-visible');
    }, duration);
}

function initGame() {
    resize();
    score = 0;
    particles = [];
    document.getElementById('scoreVal').innerText = score;
    
    // Build Level
    grid = [];
    for (let r = 0; r < 5; r++) {
        grid[r] = [];
        let cols = GRID_COLS - (r % 2);
        for (let c = 0; c < cols; c++) {
            grid[r][c] = new Bubble(r, c, Math.floor(Math.random() * COLORS.length));
        }
    }

    spawnProjectile();
    gameState = 'PLAY';
    showGifFeedback(comboGif, 900);
    audioManager.play('bgm');
}

function spawnProjectile() {
    // Determine next type
    // Simple random for MVP
    let nextType = Math.floor(Math.random() * COLORS.length);
    projectile = new Projectile(nextType);
}

function handleLanding(bubble) {
    // 1. Find Matches (BFS)
    let matches = findMatches(bubble);
    
    if (matches.length >= 3) {
        // Pop
        audioManager.play('pop', { cooldown: 90 });
        if (matches.length >= 4) {
            audioManager.play('combo', { cooldown: 300 });
            showGifFeedback(comboGif, 1300);
        }
        score += matches.length * 10;
        document.getElementById('scoreVal').innerText = score;

        matches.forEach(b => {
            grid[b.r][b.c] = null;
            createExplosion(b.x, b.y, COLORS[b.type].hex);
        });

        // 2. Drop Floating Clusters
        dropFloatingBubbles();
    } else {
        audioManager.play('fail', { cooldown: 260 });
        if (bubble.r >= GRID_ROWS - 3) {
            showGifFeedback(dangerGif, 1100);
        }
        // Check Loss Condition (if bubble is too low)
        if (bubble.r >= GRID_ROWS - 2) {
            gameOver();
        }
    }
    
    // Check Win (Empty Grid)
    let count = 0;
    for (let r in grid) {
        for (let c in grid[r]) {
            if (grid[r][c]) count++;
        }
    }
    if (count === 0) {
        audioManager.play('combo', { restart: true });
        showGifFeedback(comboGif, 1500);
        // Win/Reset
        initGame(); // Loop for MVP
    }
}

function findMatches(startNode) {
    let visited = new Set();
    let queue = [startNode];
    let matches = [];
    let targetType = startNode.type;

    visited.add(`${startNode.r},${startNode.c}`);
    matches.push(startNode);

    while (queue.length > 0) {
        let current = queue.shift();
        let neighbors = getNeighbors(current);

        for (let n of neighbors) {
            let key = `${n.r},${n.c}`;
            if (!visited.has(key) && n.type === targetType) {
                visited.add(key);
                matches.push(n);
                queue.push(n);
            }
        }
    }
    return matches;
}

function dropFloatingBubbles() {
    // Find all bubbles connected to roof (row 0)
    let visited = new Set();
    let queue = [];

    // Add all top row bubbles
    if (grid[0]) {
        for (let c = 0; c < grid[0].length; c++) {
            if (grid[0][c]) {
                queue.push(grid[0][c]);
                visited.add(`0,${c}`);
            }
        }
    }

    // BFS from roof
    while (queue.length > 0) {
        let current = queue.shift();
        let neighbors = getNeighbors(current);
        for (let n of neighbors) {
            let key = `${n.r},${n.c}`;
            if (!visited.has(key)) {
                visited.add(key);
                queue.push(n);
            }
        }
    }

    // Remove anything not visited
    let dropped = 0;
    for (let r = 0; r < grid.length; r++) {
        if (!grid[r]) continue;
        for (let c = 0; c < grid[r].length; c++) {
            let b = grid[r][c];
            if (b && !visited.has(`${r},${c}`)) {
                grid[r][c] = null;
                createExplosion(b.x, b.y, COLORS[b.type].hex);
                dropped++;
            }
        }
    }
    if (dropped > 0) {
        score += dropped * 20;
        document.getElementById('scoreVal').innerText = score;
        audioManager.play('combo', { cooldown: 180 });
        showGifFeedback(comboGif, 1200);
    }
}

function getNeighbors(node) {
    let neighbors = [];
    let directions = [
        {r:0, c:-1}, {r:0, c:1},
        {r:-1, c:0}, {r:-1, c:1},
        {r:1, c:0}, {r:1, c:1}
    ];

    // Adjust for Odd Rows
    if (node.r % 2 !== 0) {
        directions = [
            {r:0, c:-1}, {r:0, c:1},
            {r:-1, c:-1}, {r:-1, c:0},
            {r:1, c:-1}, {r:1, c:0}
        ];
    }

    for (let d of directions) {
        let nr = node.r + d.r;
        let nc = node.c + d.c;
        if (grid[nr] && grid[nr][nc]) {
            neighbors.push(grid[nr][nc]);
        }
    }
    return neighbors;
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 5; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    audioManager.stop('bgm');
    audioManager.play('fail', { restart: true });
    showGifFeedback(dangerGif, 1800);
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').style.display = 'block';
    document.getElementById('hud').style.display = 'none';
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Calculate Grid Metrics based on screen width
    // We want GRID_COLS to fit width
    TILE_SIZE = Math.min(canvas.width / (GRID_COLS + 1), 60);
    
    // Center the grid
    let gridWidth = GRID_COLS * TILE_SIZE;
    OFFSET_X = (canvas.width - gridWidth) / 2;
    OFFSET_Y = 50; // Top padding

    // Re-calc positions of existing bubbles
    if (grid) {
        for (let r in grid) {
            for (let c in grid[r]) {
                if (grid[r][c]) grid[r][c].updatePos();
            }
        }
    }
    if (projectile) {
        projectile.radius = TILE_SIZE / 2 - 2;
        if (!projectile.moving) {
            projectile.x = canvas.width / 2;
            projectile.y = canvas.height - TILE_SIZE * 2;
        }
    }
}

// --- Loop ---

function update() {
    if (gameState !== 'PLAY') return;

    // Update Projectile
    if (projectile) {
        projectile.update();
        // Check collision with bubbles
        if (projectile.moving) {
            let hit = false;
            for (let r = 0; r < grid.length; r++) {
                if (!grid[r]) continue;
                for (let c = 0; c < grid[r].length; c++) {
                    let b = grid[r][c];
                    if (b) {
                        let dx = projectile.x - b.x;
                        let dy = projectile.y - b.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < (projectile.radius + TILE_SIZE / 2 - 4)) {
                            projectile.snapToGrid();
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit) break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function drawMomcoreBackground() {
    const time = performance.now() * 0.001;
    const phase = Math.min(4, Math.floor(score / 120));
    const horizon = canvas.height * (0.58 + phase * 0.018);

    const room = ctx.createLinearGradient(0, 0, 0, canvas.height);
    room.addColorStop(0, '#2d123f');
    room.addColorStop(0.45, phase >= 3 ? '#7a2b78' : '#6a245f');
    room.addColorStop(1, '#ffb3c9');
    ctx.fillStyle = room;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const spotlight = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.18, 0, canvas.width * 0.5, canvas.height * 0.18, canvas.width * 0.78);
    spotlight.addColorStop(0, 'rgba(255,236,170,0.18)');
    spotlight.addColorStop(0.44, 'rgba(255,111,174,0.08)');
    spotlight.addColorStop(1, 'rgba(45,18,63,0)');
    ctx.fillStyle = spotlight;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.globalAlpha = 0.36;
    ctx.strokeStyle = 'rgba(255,236,170,0.2)';
    ctx.lineWidth = 2;
    for (let x = -80; x < canvas.width + 120; x += 80) {
        const sway = Math.sin(time * 0.7 + x * 0.01) * 12;
        ctx.beginPath();
        ctx.moveTo(x + sway, 0);
        ctx.bezierCurveTo(x + 24 + sway, canvas.height * 0.24, x - 28 - sway, canvas.height * 0.46, x + 10, horizon);
        ctx.stroke();
        ctx.fillStyle = x % 160 === 0 ? 'rgba(255,111,174,0.24)' : 'rgba(255,236,170,0.2)';
        drawHeartPath(ctx, x + 10 + sway * 0.2, canvas.height * 0.18 + Math.sin(time + x) * 7, 15);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(0, horizon);
    const table = ctx.createLinearGradient(0, 0, 0, canvas.height - horizon);
    table.addColorStop(0, 'rgba(255,225,235,0.95)');
    table.addColorStop(1, 'rgba(255,111,174,0.72)');
    ctx.fillStyle = table;
    ctx.fillRect(0, 0, canvas.width, canvas.height - horizon);

    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = 'rgba(72,24,68,0.18)';
    ctx.lineWidth = 12;
    for (let x = -canvas.width; x < canvas.width * 2; x += 72) {
        ctx.beginPath();
        ctx.moveTo(x + ((time * 16) % 72), 0);
        ctx.lineTo(x + canvas.height * 0.7 + ((time * 16) % 72), canvas.height - horizon);
        ctx.stroke();
    }
    ctx.restore();

    drawBackgroundProps(time, phase, horizon);
    drawSkyOverlay();
}

function drawBackgroundProps(time, phase, horizon) {
    const propY = horizon - 24;
    const count = Math.max(3, Math.min(6, 3 + phase));
    ctx.save();
    ctx.globalAlpha = 0.42;
    for (let i = 0; i < count; i++) {
        const x = ((i + 0.5) * canvas.width) / count + Math.sin(time * 0.5 + i) * 12;
        const y = propY - (i % 2) * 20;
        const w = Math.min(70, canvas.width * 0.13);
        const h = w * 0.72;

        ctx.fillStyle = i % 2 ? 'rgba(255,236,170,0.4)' : 'rgba(201,139,255,0.32)';
        drawRoundRectPath(ctx, x - w / 2, y - h, w, h, 10);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,248,244,0.36)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,111,174,0.44)';
        drawHeartPath(ctx, x, y - h * 0.54, w * 0.16);
        ctx.fill();

        if (phase >= 2) {
            ctx.strokeStyle = 'rgba(255,248,244,0.26)';
            ctx.beginPath();
            ctx.arc(x, y - h - 14, 12 + Math.sin(time + i) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawSkyOverlay() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, 'rgba(45, 18, 63, 0.2)');
    gradient.addColorStop(0.45, 'rgba(255, 179, 201, 0.08)');
    gradient.addColorStop(1, 'rgba(75, 18, 68, 0.24)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 10; i++) {
        const drift = (performance.now() * 0.012 + i * 53) % (canvas.width + 120);
        const px = drift - 60;
        const py = 55 + (i % 5) * 72 + Math.sin(performance.now() * 0.001 + i) * 10;
        const pulse = 5 + Math.sin((performance.now() * 0.0015) + i) * 2;
        const signal = ctx.createRadialGradient(px, py, 0, px, py, 20 + pulse);
        signal.addColorStop(0, i % 2 ? 'rgba(255, 236, 170, 0.22)' : 'rgba(255, 111, 174, 0.18)');
        signal.addColorStop(0.45, 'rgba(255, 111, 174, 0.07)');
        signal.addColorStop(1, 'rgba(255, 236, 170, 0)');
        ctx.fillStyle = signal;
        ctx.beginPath();
        ctx.arc(px, py, 20 + pulse, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawLauncherBase() {
    if (!projectile) return;

    const baseY = canvas.height - TILE_SIZE * 1.1;
    const baseRadius = TILE_SIZE * 0.9;

    ctx.save();
    ctx.translate(canvas.width / 2, baseY);

    const baseGlow = ctx.createRadialGradient(0, 0, 4, 0, 0, baseRadius * 1.55);
    baseGlow.addColorStop(0, 'rgba(255, 236, 170, 0.28)');
    baseGlow.addColorStop(0.45, 'rgba(255, 111, 174, 0.16)');
    baseGlow.addColorStop(1, 'rgba(255, 111, 174, 0)');
    ctx.fillStyle = baseGlow;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 1.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.rotate(-0.08);
    const cardGradient = ctx.createLinearGradient(0, -baseRadius, 0, baseRadius);
    cardGradient.addColorStop(0, 'rgba(255,248,244,0.94)');
    cardGradient.addColorStop(1, 'rgba(255,179,201,0.9)');
    ctx.fillStyle = cardGradient;
    drawRoundRectPath(ctx, -baseRadius * 1.05, -baseRadius * 0.68, baseRadius * 2.1, baseRadius * 1.22, baseRadius * 0.24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(72,24,68,0.62)';
    ctx.lineWidth = Math.max(2, TILE_SIZE * 0.055);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,111,174,0.5)';
    ctx.lineWidth = Math.max(2, TILE_SIZE * 0.045);
    ctx.beginPath();
    ctx.moveTo(-baseRadius * 0.62, -baseRadius * 0.18);
    ctx.lineTo(baseRadius * 0.38, -baseRadius * 0.18);
    ctx.moveTo(-baseRadius * 0.52, baseRadius * 0.13);
    ctx.lineTo(baseRadius * 0.52, baseRadius * 0.13);
    ctx.stroke();

    ctx.fillStyle = '#ff6fae';
    drawHeartPath(ctx, baseRadius * 0.58, baseRadius * 0.02, baseRadius * 0.24);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(142,230,168,0.72)';
    ctx.lineWidth = Math.max(3, TILE_SIZE * 0.06);
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * baseRadius * 0.22, -baseRadius * 0.1);
        ctx.quadraticCurveTo(i * baseRadius * 0.5, -baseRadius * 0.72, i * baseRadius * 0.82, -baseRadius * 0.98);
        ctx.stroke();
    }
    ctx.fillStyle = '#8ee6a8';
    for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * baseRadius * 0.82, -baseRadius * 0.98, baseRadius * 0.15, baseRadius * 0.28, i * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    ctx.restore();
}

function draw() {
    // Clear
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw authored procedural Mom's Day brainrot scene; remote city image is intentionally demoted.
    drawMomcoreBackground();

    // Draw Grid
    for (let r in grid) {
        for (let c in grid[r]) {
            if (grid[r][c]) grid[r][c].draw(ctx);
        }
    }

    drawLauncherBase();

    // Draw Projectile
    if (projectile) projectile.draw(ctx);

    // Draw Particles
    particles.forEach(p => p.draw(ctx));

    // Draw Aim Line
    if (gameState === 'PLAY' && projectile && !projectile.moving) {
        ctx.beginPath();
        ctx.moveTo(projectile.x, projectile.y);
        ctx.lineTo(projectile.x + Math.cos(aimAngle) * 110, projectile.y + Math.sin(aimAngle) * 110);
        ctx.strokeStyle = 'rgba(255, 236, 170, 0.88)';
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    animationId = requestAnimationFrame(loop);
}

function loop(timestamp) {
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    
    update(dt);
    draw();
}

// --- Event Listeners ---

window.addEventListener('resize', resize);

// Input Handling
function handleInputStart(e) {
    if (gameState !== 'PLAY') return;
    if (e.target.closest('button')) return;
    isDragging = true;
    updateAim(e);
}

function handleInputMove(e) {
    if (!isDragging) return;
    updateAim(e);
}

function handleInputEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    if (projectile && !projectile.moving) {
        projectile.shoot(aimAngle);
    }
}

function updateAim(e) {
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    // Aim based on angle from shooter
    if (projectile) {
        let dx = clientX - projectile.x;
        let dy = clientY - projectile.y;
        aimAngle = Math.atan2(dy, dx);
        
        // Clamp angle to upward direction only
        if (aimAngle > -0.2) aimAngle = -0.2;
        if (aimAngle < -Math.PI + 0.2) aimAngle = -Math.PI + 0.2;
    }
}

window.addEventListener('mousedown', handleInputStart);
window.addEventListener('mousemove', handleInputMove);
window.addEventListener('mouseup', handleInputEnd);

/* [agent-note][stage4] repaired: mobile-cta-actionability | action: scope touch suppression to game surface so menu buttons keep native tap/click */
canvas.addEventListener('touchstart', handleInputStart, { passive: false });
canvas.addEventListener('touchmove', (e) => {
    if (!isDragging || gameState !== 'PLAY') return;
    e.preventDefault();
    handleInputMove(e);
}, { passive: false });
canvas.addEventListener('touchend', handleInputEnd);
canvas.addEventListener('touchcancel', handleInputEnd);

// UI Buttons
document.getElementById('startBtn').addEventListener('click', () => {
    audioManager.unlock();
    audioManager.play('start', { restart: true });
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    initGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    audioManager.play('restart', { restart: true });
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    initGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
    e.stopPropagation(); // prevent shooting
    audioManager.play('ui', { restart: true });
    audioManager.toggleMute();
});

// Start Loop
requestAnimationFrame(loop);
