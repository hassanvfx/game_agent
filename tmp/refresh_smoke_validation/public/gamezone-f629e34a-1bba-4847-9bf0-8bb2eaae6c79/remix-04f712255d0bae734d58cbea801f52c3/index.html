<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
<title>Spartan Ringfall Arena</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp');
:root{--navy:#06111f;--deep:#0a1830;--panel:rgba(7,18,34,.82);--cyan:#7df4ff;--blue:#3ea7ff;--gold:#ffd86b;--green:#69ffb7;--purple:#b06bff;--danger:#ff4f70;--text:#f2fbff;--muted:#a9c7df}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020812;color:var(--text);font-family:'Rajdhani',system-ui,sans-serif;-webkit-user-select:none;user-select:none}body{touch-action:none}canvas{display:block;width:100%;height:100%;filter:saturate(1.12) contrast(1.06)}button{font:inherit}.display{font-family:'Orbitron','Rajdhani',sans-serif;letter-spacing:.08em;text-transform:uppercase}.material-symbols-sharp{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}.hidden{display:none!important}.screen{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,28px);background:radial-gradient(circle at 50% 16%,rgba(125,244,255,.18),transparent 34%),linear-gradient(180deg,rgba(4,12,24,.92),rgba(1,5,11,.96))}.panel{width:min(92vw,430px);border:1px solid rgba(125,244,255,.5);border-radius:28px;background:linear-gradient(180deg,rgba(11,31,55,.88),rgba(5,13,26,.8));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 22px 46px rgba(0,0,0,.42),0 0 38px rgba(62,167,255,.22);backdrop-filter:blur(12px);padding:clamp(22px,6vw,34px);text-align:center;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 120deg,transparent,rgba(125,244,255,.18),transparent,rgba(255,216,107,.1),transparent);animation:spin 12s linear infinite;opacity:.75}.panel>*{position:relative}.title{font-size:clamp(2.25rem,12vw,4.5rem);line-height:.88;margin:0 0 12px;color:var(--cyan);text-shadow:0 0 18px rgba(125,244,255,.55),0 0 44px rgba(62,167,255,.26)}.subtitle{font-size:clamp(1.05rem,4.6vw,1.3rem);line-height:1.25;color:var(--muted);margin:0 0 24px}.btn{width:100%;min-height:58px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold),#fff0a0 44%,var(--cyan));color:#07111c;font-weight:700;font-size:clamp(1.25rem,6vw,1.55rem);box-shadow:0 12px 30px rgba(125,244,255,.26),0 0 0 2px rgba(255,255,255,.22) inset}.btn:active{transform:scale(.97)}#game-container{position:relative;width:100%;height:100%;overflow:hidden;background:var(--navy)}#game-container:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(125,244,255,.09),transparent 28%,transparent 68%,rgba(105,255,183,.08)),repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px);mix-blend-mode:screen}#game-container:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0 45%,rgba(2,8,18,.36) 75%,rgba(0,0,0,.78) 100%)}.visor{position:absolute;inset:0;z-index:3;pointer-events:none}.visor:before,.visor:after{content:"";position:absolute;top:15%;bottom:18%;width:16%;border-color:rgba(255,216,107,.38);filter:drop-shadow(0 0 12px rgba(255,216,107,.16))}.visor:before{left:0;border-left:5px solid;border-top:2px solid;border-bottom:2px solid;border-radius:0 22px 22px 0}.visor:after{right:0;border-right:5px solid;border-top:2px solid;border-bottom:2px solid;border-radius:22px 0 0 22px}.ring-arc{position:absolute;left:50%;top:4%;width:150vw;height:42vw;max-height:220px;transform:translateX(-50%) rotate(-8deg);border:2px solid rgba(125,244,255,.22);border-bottom:0;border-radius:50% 50% 0 0;z-index:1;pointer-events:none;box-shadow:0 -12px 60px rgba(125,244,255,.08) inset;animation:drift 9s ease-in-out infinite}.stars{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.4px),radial-gradient(circle,rgba(125,244,255,.5) 1px,transparent 1.5px);background-size:72px 72px,118px 118px;background-position:0 0,30px 40px;animation:star 18s linear infinite}.dropship{position:absolute;right:7vw;top:14vh;z-index:1;width:88px;height:28px;border-radius:40% 12% 42% 18%;background:linear-gradient(90deg,rgba(100,122,146,.28),rgba(125,244,255,.18));border:1px solid rgba(125,244,255,.22);box-shadow:-26px 8px 0 -7px rgba(100,122,146,.22);animation:ship 7s ease-in-out infinite}.hud{position:absolute;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}.chip{pointer-events:none;border:1px solid rgba(125,244,255,.46);background:var(--panel);border-radius:18px;padding:8px 12px;box-shadow:0 0 22px rgba(62,167,255,.16),0 0 0 1px rgba(255,255,255,.06) inset}.score-label{font-size:clamp(.83rem,3.6vw,1.05rem);color:var(--cyan)}#score{font-size:clamp(1.35rem,6vw,1.85rem);color:#fff;text-shadow:0 0 14px var(--cyan)}#mute-btn{pointer-events:auto;width:48px;height:48px;border-radius:16px;color:var(--cyan);display:grid;place-items:center;padding:0}.crosshair{position:absolute;left:50%;top:50%;z-index:18;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none}.crosshair:before{content:"";position:absolute;inset:10px;border:2px solid rgba(125,244,255,.8);border-radius:50%;box-shadow:0 0 20px rgba(125,244,255,.42),0 0 0 10px rgba(125,244,255,.04)}.crosshair i{position:absolute;background:rgba(255,216,107,.9);box-shadow:0 0 10px rgba(255,216,107,.55)}.crosshair .h{left:0;right:0;top:31px;height:2px}.crosshair .v{top:0;bottom:0;left:31px;width:2px}.crosshair b{position:absolute;left:28px;top:28px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 14px var(--danger)}#controls-layer{position:absolute;inset:0;z-index:24}#shoot-zone{position:absolute;left:0;right:0;top:0;height:60%;touch-action:none}#joystick-zone{position:absolute;left:50%;bottom:calc(4.8% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(45vw,205px);height:min(45vw,205px);border-radius:50%;border:2px solid rgba(125,244,255,.58);background:radial-gradient(circle,rgba(125,244,255,.14),rgba(4,14,29,.55) 64%,rgba(0,0,0,.38));box-shadow:0 0 30px rgba(125,244,255,.18),0 0 0 10px rgba(125,244,255,.04) inset;touch-action:none}#joystick-knob{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,var(--cyan) 42%,#154a7e 100%);box-shadow:0 0 0 3px rgba(255,255,255,.24) inset,0 0 22px rgba(125,244,255,.42)}.hint{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:25;text-align:center;color:rgba(242,251,255,.8);font-weight:700;font-size:.86rem;pointer-events:none;text-shadow:0 2px 8px #000}.feedback{position:absolute;left:50%;top:calc(74px + env(safe-area-inset-top,0px));z-index:30;transform:translateX(-50%) translateY(-8px);opacity:0;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,216,107,.5);background:rgba(5,13,26,.86);color:var(--gold);font-size:.88rem;transition:.16s;pointer-events:none;white-space:nowrap}.feedback.visible{opacity:1;transform:translateX(-50%)}.gif{position:absolute;z-index:30;right:12px;bottom:calc(122px + env(safe-area-inset-bottom,0px));width:min(31vw,120px);border-radius:18px;border:1px solid rgba(125,244,255,.48);background:rgba(5,13,26,.84);box-shadow:0 14px 30px rgba(0,0,0,.42);opacity:0;transform:translateY(12px) scale(.94);transition:.18s;pointer-events:none}.gif.visible{opacity:.9;transform:translateY(0) scale(1)}.gif img{display:block;width:100%;border-radius:inherit}#gameover-gif{left:50%;right:auto;top:calc(16px + env(safe-area-inset-top,0px));bottom:auto;transform:translateX(-50%) translateY(-10px) scale(.94);width:min(44vw,160px)}#gameover-gif.visible{transform:translateX(-50%) translateY(0) scale(1)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{50%{transform:translateX(-50%) rotate(-4deg) translateY(9px)}}@keyframes star{to{background-position:0 72px,30px 158px}}@keyframes ship{50%{transform:translateY(12px) translateX(-14px)}}@media (min-aspect-ratio:9/13){#joystick-zone{width:160px;height:160px}.hint{bottom:4px}.title{font-size:3.2rem}}
</style>
</head>
<body>
<div id="game-container">
<div class="stars"></div><div class="ring-arc"></div><div class="dropship"></div><canvas id="gameCanvas"></canvas><div class="visor"></div>
<div id="feedback-pill" class="feedback display">SHIELD SYNCED</div>
<div id="impact-gif" class="gif" aria-hidden="true"><img src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="shield impact" loading="lazy" decoding="async"></div>
<div id="gameover-gif" class="gif" aria-hidden="true"><img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="mission failed" loading="lazy" decoding="async"></div>
<div class="crosshair"><i class="h"></i><i class="v"></i><b></b></div>
<div id="hud" class="hud hidden"><div class="chip"><div class="display score-label">SHIELDS BROKEN</div><div id="score" class="display">0</div></div><button id="mute-btn" class="chip" aria-label="Toggle audio"><span class="material-symbols-sharp">volume_up</span></button></div>
<div id="controls-layer" class="hidden"><div id="shoot-zone" aria-label="Tap to fire"></div><div id="joystick-zone" aria-label="Move and turn"><div id="joystick-knob"></div></div><div class="hint display">DRAG TO ADVANCE • TAP UPPER FIELD TO FIRE</div></div>
<div id="start-screen" class="screen"><div class="panel"><h1 class="title display">SPARTAN<br>RINGFALL</h1><p class="subtitle">Drop into a portrait-first orbital arena. Break alien shields before their plasma phantoms breach your suit.</p><button id="start-btn" class="btn display">Deploy</button></div></div>
<div id="game-over-screen" class="screen hidden"><div class="panel"><h2 class="title display" style="font-size:clamp(2rem,10vw,3.4rem);color:var(--danger)">SUIT<br>BREACH</h2><p class="subtitle">Final after-action count: <b id="finalScore" style="color:var(--cyan)">0</b> alien shields broken.</p><button id="restart-btn" class="btn display">Redeploy</button></div></div>
</div>
<script>
const CONFIG={fov:.66,moveSpeed:4.0,rotSpeed:2.5,mapWidth:20,mapHeight:20,colors:{skyTop:'#061225',skyBot:'#173a64',floorTop:'#102941',floorBot:'#020812',walls:['#7df4ff','#3ea7ff','#69ffb7','#ffd86b','#b06bff']}};
const ASSETS={impactGif:'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',failGif:'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'};
const AudioSys={muted:false,primed:false,ctx:null,bgmTimer:null,init(){},prime(){if(this.primed)return;this.primed=true;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){this.ctx=null}},tone(freq,duration=.12,type='sine',gain=.045){if(this.muted||!this.ctx)return;const now=this.ctx.currentTime;const osc=this.ctx.createOscillator();const g=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(g).connect(this.ctx.destination);osc.start(now);osc.stop(now+duration+.02)},playBGM(){if(this.muted||!this.ctx||this.bgmTimer)return;let step=0;const notes=[110,146.8,164.8,220,196,164.8];this.bgmTimer=setInterval(()=>{this.tone(notes[step%notes.length],.42,'triangle',.018);step++},520)},stopBGM(){if(this.bgmTimer){clearInterval(this.bgmTimer);this.bgmTimer=null}},playSFX(type){if(type==='shoot'){this.tone(740,.08,'sawtooth',.035);this.tone(220,.1,'square',.018)}else if(type==='collect'){this.tone(523,.09,'triangle',.035);setTimeout(()=>this.tone(880,.12,'triangle',.03),70)}else if(type==='fail'){this.tone(180,.32,'sawtooth',.045);setTimeout(()=>this.tone(92,.42,'triangle',.04),150)}else if(type==='start'){this.tone(330,.11,'triangle',.035);setTimeout(()=>this.tone(660,.14,'triangle',.03),90)}else if(type==='muteToggle'){this.tone(440,.08,'sine',.025)}},toggleMute(){const next=!this.muted;if(!next)this.playSFX('muteToggle');this.muted=next;if(this.muted)this.stopBGM();else this.playBGM();return this.muted}};
const Input={x:0,y:0,shooting:false,init(){const joyZone=document.getElementById('joystick-zone'),joyKnob=document.getElementById('joystick-knob'),shootZone=document.getElementById('shoot-zone');let startX=0,startY=0;const maxDist=70;joyZone.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;joyKnob.style.transition='none'},{passive:false});joyZone.addEventListener('touchmove',e=>{e.preventDefault();const t=e.changedTouches[0];let dx=t.clientX-startX,dy=t.clientY-startY;const dist=Math.hypot(dx,dy);if(dist>maxDist){dx=dx/dist*maxDist;dy=dy/dist*maxDist}joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;this.x=dx/maxDist;this.y=dy/maxDist},{passive:false});const reset=e=>{e.preventDefault();this.x=0;this.y=0;joyKnob.style.transition='transform .2s';joyKnob.style.transform='translate(-50%,-50%)'};joyZone.addEventListener('touchend',reset,{passive:false});joyZone.addEventListener('touchcancel',reset,{passive:false});shootZone.addEventListener('touchstart',e=>{e.preventDefault();this.shooting=true},{passive:false});shootZone.addEventListener('mousedown',()=>{this.shooting=true});window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();this.shooting=true}if(e.key==='ArrowLeft'||e.key==='a')this.x=-1;if(e.key==='ArrowRight'||e.key==='d')this.x=1;if(e.key==='ArrowUp'||e.key==='w')this.y=-1;if(e.key==='ArrowDown'||e.key==='s')this.y=1});window.addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))this.x=0;if(['ArrowUp','w','ArrowDown','s'].includes(e.key))this.y=0})},consumeShoot(){if(this.shooting){this.shooting=false;return true}return false}};
const Game={canvas:null,ctx:null,width:0,height:0,lastTime:0,active:false,score:0,feedbackTimer:null,gifTimers:{},player:{x:10.5,y:10.5,dirX:-1,dirY:0,planeX:0,planeY:.66},map:[],enemies:[],zBuffer:[],init(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d',{alpha:false});this.generateMap();this.resize();window.addEventListener('resize',()=>this.resize());Input.init();AudioSys.init();document.getElementById('start-btn').onclick=()=>this.start();document.getElementById('restart-btn').onclick=()=>this.start();document.getElementById('mute-btn').onclick=()=>{AudioSys.prime();const m=AudioSys.toggleMute();document.querySelector('#mute-btn .material-symbols-sharp').innerText=m?'volume_off':'volume_up'};document.addEventListener('visibilitychange',()=>{if(document.hidden)AudioSys.stopBGM(false);else if(this.active&&!AudioSys.muted)AudioSys.playBGM()});this.render()},generateMap(){this.map=[];for(let x=0;x<CONFIG.mapWidth;x++){this.map[x]=[];for(let y=0;y<CONFIG.mapHeight;y++){if(x===0||x===CONFIG.mapWidth-1||y===0||y===CONFIG.mapHeight-1)this.map[x][y]=1;else this.map[x][y]=(Math.random()>.9)?Math.floor(Math.random()*4)+1:0}}},resize(){this.width=window.innerWidth;this.height=window.innerHeight;this.canvas.width=this.width;this.canvas.height=this.height;this.zBuffer=new Array(this.width).fill(0);if(!this.active)this.render()},start(){AudioSys.prime();this.active=true;this.score=0;document.getElementById('score').innerText=0;this.player.x=CONFIG.mapWidth/2;this.player.y=CONFIG.mapHeight/2;this.player.dirX=-1;this.player.dirY=0;this.player.planeX=0;this.player.planeY=.66;this.enemies=[];for(let i=0;i<6;i++)this.spawnEnemy();document.getElementById('start-screen').classList.add('hidden');document.getElementById('game-over-screen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('controls-layer').classList.remove('hidden');this.hideGif('gameover-gif');this.flashFeedback('DROP LIVE');AudioSys.playSFX('start');AudioSys.playBGM();this.lastTime=performance.now();requestAnimationFrame(t=>this.loop(t))},spawnEnemy(){let ex,ey,guard=0;do{ex=Math.floor(Math.random()*(CONFIG.mapWidth-2))+1.5;ey=Math.floor(Math.random()*(CONFIG.mapHeight-2))+1.5;guard++}while((this.map[Math.floor(ex)][Math.floor(ey)]!==0||Math.hypot(ex-this.player.x,ey-this.player.y)<4)&&guard<200);this.enemies.push({x:ex,y:ey,hue:260+Math.random()*80,bounceOffset:Math.random()*Math.PI*2,crest:Math.random()>.5?1:-1})},gameOver(){this.active=false;AudioSys.stopBGM();AudioSys.playSFX('fail');this.flashFeedback('SUIT BREACH',1200);this.showGif('gameover-gif',2200);document.getElementById('hud').classList.add('hidden');document.getElementById('controls-layer').classList.add('hidden');document.getElementById('game-over-screen').classList.remove('hidden');document.getElementById('finalScore').innerText=this.score},flashFeedback(message,duration=900){const pill=document.getElementById('feedback-pill');pill.textContent=message;pill.classList.add('visible');clearTimeout(this.feedbackTimer);this.feedbackTimer=setTimeout(()=>pill.classList.remove('visible'),duration)},showGif(id,duration=700){const el=document.getElementById(id);if(!el)return;el.classList.add('visible');clearTimeout(this.gifTimers[id]);this.gifTimers[id]=setTimeout(()=>el.classList.remove('visible'),duration)},hideGif(id){const el=document.getElementById(id);if(!el)return;clearTimeout(this.gifTimers[id]);el.classList.remove('visible')},loop(timestamp){if(!this.active)return;const dt=Math.min((timestamp-this.lastTime)/1000,.1);this.lastTime=timestamp;this.update(dt);this.render();requestAnimationFrame(t=>this.loop(t))},update(dt){const p=this.player;const rot=-Input.x*CONFIG.rotSpeed*dt;const oldDirX=p.dirX;p.dirX=p.dirX*Math.cos(rot)-p.dirY*Math.sin(rot);p.dirY=oldDirX*Math.sin(rot)+p.dirY*Math.cos(rot);const oldPlaneX=p.planeX;p.planeX=p.planeX*Math.cos(rot)-p.planeY*Math.sin(rot);p.planeY=oldPlaneX*Math.sin(rot)+p.planeY*Math.cos(rot);const moveStep=-Input.y*CONFIG.moveSpeed*dt;const nextX=p.x+p.dirX*moveStep,nextY=p.y+p.dirY*moveStep;if(this.map[Math.floor(nextX)][Math.floor(p.y)]===0)p.x=nextX;if(this.map[Math.floor(p.x)][Math.floor(nextY)]===0)p.y=nextY;for(let i=this.enemies.length-1;i>=0;i--){const en=this.enemies[i];const dx=p.x-en.x,dy=p.y-en.y,dist=Math.hypot(dx,dy);if(dist<.8){this.gameOver();return}en.x+=(dx/dist)*.5*dt;en.y+=(dy/dist)*.5*dt}if(Input.consumeShoot()){AudioSys.playSFX('shoot');let hitIndex=-1,closestDist=999;this.enemies.forEach((en,idx)=>{const dx=en.x-p.x,dy=en.y-p.y,dist=Math.hypot(dx,dy);const dot=(p.dirX*dx+p.dirY*dy)/dist;if(dot>.8&&dist<closestDist){closestDist=dist;hitIndex=idx}});if(hitIndex!==-1){this.enemies.splice(hitIndex,1);this.score++;document.getElementById('score').innerText=this.score;this.spawnEnemy();AudioSys.playSFX('collect');this.flashFeedback(this.score%5===0?'HEROIC BREAK':'SHIELD BROKEN');this.showGif('impact-gif',650)}else this.flashFeedback('PLASMA MISS',420)}}};
Game.render=function(){const w=this.width,h=this.height,ctx=this.ctx,p=this.player;if(!ctx||!w||!h)return;const sky=ctx.createLinearGradient(0,0,0,h/2);sky.addColorStop(0,CONFIG.colors.skyTop);sky.addColorStop(.62,CONFIG.colors.skyBot);sky.addColorStop(1,'#0b2540');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h/2);this.drawSkyMotifs(ctx,w,h);const floor=ctx.createLinearGradient(0,h/2,0,h);floor.addColorStop(0,CONFIG.colors.floorTop);floor.addColorStop(1,CONFIG.colors.floorBot);ctx.fillStyle=floor;ctx.fillRect(0,h/2,w,h/2);this.drawFloorGrid(ctx,w,h);for(let x=0;x<w;x+=2){const cameraX=2*x/w-1,rayDirX=p.dirX+p.planeX*cameraX,rayDirY=p.dirY+p.planeY*cameraX;let mapX=Math.floor(p.x),mapY=Math.floor(p.y),sideDistX,sideDistY;const deltaDistX=Math.abs(1/rayDirX),deltaDistY=Math.abs(1/rayDirY);let stepX,stepY,hit=0,side=0;if(rayDirX<0){stepX=-1;sideDistX=(p.x-mapX)*deltaDistX}else{stepX=1;sideDistX=(mapX+1-p.x)*deltaDistX}if(rayDirY<0){stepY=-1;sideDistY=(p.y-mapY)*deltaDistY}else{stepY=1;sideDistY=(mapY+1-p.y)*deltaDistY}while(hit===0){if(sideDistX<sideDistY){sideDistX+=deltaDistX;mapX+=stepX;side=0}else{sideDistY+=deltaDistY;mapY+=stepY;side=1}if(this.map[mapX][mapY]>0)hit=1}const perpWallDist=(side===0)?sideDistX-deltaDistX:sideDistY-deltaDistY;this.zBuffer[x]=perpWallDist;this.zBuffer[x+1]=perpWallDist;const lineHeight=Math.floor(h/perpWallDist),drawStart=Math.max(0,-lineHeight/2+h/2),drawEnd=Math.min(h,lineHeight/2+h/2);const base=CONFIG.colors.walls[(mapX+mapY)%CONFIG.colors.walls.length];ctx.globalAlpha=side===1?.76:1;ctx.fillStyle=base;ctx.fillRect(x,drawStart,2,drawEnd-drawStart);ctx.globalAlpha=.28;ctx.fillStyle='#ffffff';if(((mapY*7+mapX*5+x/2)%17)<2)ctx.fillRect(x,drawStart,2,drawEnd-drawStart);ctx.globalAlpha=.22;ctx.fillStyle='#00101c';ctx.fillRect(x,drawStart,2,Math.max(2,(drawEnd-drawStart)*.08));ctx.globalAlpha=1}
const spriteOrder=this.enemies.map((e,i)=>({dist:(p.x-e.x)**2+(p.y-e.y)**2,index:i})).sort((a,b)=>b.dist-a.dist);for(let i=0;i<spriteOrder.length;i++){const s=this.enemies[spriteOrder[i].index],spriteX=s.x-p.x,spriteY=s.y-p.y;const invDet=1/(p.planeX*p.dirY-p.dirX*p.planeY);const transformX=invDet*(p.dirY*spriteX-p.dirX*spriteY),transformY=invDet*(-p.planeY*spriteX+p.planeX*spriteY);if(transformY<=0)continue;const spriteScreenX=Math.floor((w/2)*(1+transformX/transformY));const spriteH=Math.abs(Math.floor(h/transformY)),spriteW=Math.abs(Math.floor(h/transformY));const bounce=Math.sin(performance.now()*.005+s.bounceOffset)*20/transformY;const drawY=(-spriteH/2+h/2)+bounce;if(spriteScreenX>0&&spriteScreenX<w&&transformY<this.zBuffer[spriteScreenX])this.drawAlien(ctx,s,spriteScreenX,drawY+spriteH/2,spriteW*.82)}this.drawWeaponSilhouette(ctx,w,h)};
Game.drawSkyMotifs=function(ctx,w,h){ctx.save();ctx.globalAlpha=.28;ctx.strokeStyle='#7df4ff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(w*.5,h*.18,w*.58,h*.12,-.12,Math.PI,Math.PI*2);ctx.stroke();ctx.globalAlpha=.18;ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.moveTo(w*.74,h*.23);ctx.lineTo(w*.88,h*.26);ctx.lineTo(w*.8,h*.3);ctx.lineTo(w*.69,h*.28);ctx.closePath();ctx.fill();ctx.restore()};
Game.drawFloorGrid=function(ctx,w,h){ctx.save();ctx.strokeStyle='rgba(125,244,255,.15)';ctx.lineWidth=1;for(let i=0;i<16;i++){const y=h/2+Math.pow(i/15,1.8)*h/2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(w/2+i*18,h/2);ctx.lineTo(w/2+i*w*.18,h);ctx.stroke()}ctx.restore()};
Game.drawAlien=function(ctx,s,cx,cy,size){const r=size/2;ctx.save();ctx.translate(cx,cy);const shield=ctx.createRadialGradient(0,0,r*.2,0,0,r*.82);shield.addColorStop(0,`hsla(${s.hue},100%,74%,.42)`);shield.addColorStop(.55,`hsla(${s.hue},100%,52%,.22)`);shield.addColorStop(1,`hsla(${s.hue},100%,60%,0)`);ctx.fillStyle=shield;ctx.beginPath();ctx.ellipse(0,0,r*.86,r*1.02,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=`hsla(${s.hue},100%,74%,.68)`;ctx.lineWidth=Math.max(2,size/34);ctx.beginPath();ctx.ellipse(0,0,r*.68,r*.9,0,0,Math.PI*2);ctx.stroke();const body=ctx.createLinearGradient(0,-r*.68,0,r*.62);body.addColorStop(0,'#ead8ff');body.addColorStop(.34,`hsla(${s.hue},86%,58%,.96)`);body.addColorStop(1,'#24113d');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(0,-r*.75);ctx.lineTo(r*.42,-r*.36);ctx.lineTo(r*.34,r*.22);ctx.lineTo(r*.16,r*.56);ctx.lineTo(0,r*.36);ctx.lineTo(-r*.16,r*.56);ctx.lineTo(-r*.34,r*.22);ctx.lineTo(-r*.42,-r*.36);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.56)';ctx.stroke();ctx.fillStyle='#0b0616';ctx.beginPath();ctx.moveTo(-r*.28,-r*.28);ctx.lineTo(-r*.07,-r*.2);ctx.lineTo(-r*.18,-r*.08);ctx.closePath();ctx.moveTo(r*.28,-r*.28);ctx.lineTo(r*.07,-r*.2);ctx.lineTo(r*.18,-r*.08);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(105,255,183,.9)';ctx.lineWidth=Math.max(2,size/42);ctx.beginPath();ctx.moveTo(-r*.18,r*.18);ctx.quadraticCurveTo(0,r*.34,r*.18,r*.18);ctx.stroke();ctx.fillStyle=`hsla(${s.hue+30},100%,70%,.72)`;ctx.beginPath();ctx.moveTo(s.crest*r*.22,-r*.72);ctx.lineTo(s.crest*r*.72,-r*.42);ctx.lineTo(s.crest*r*.24,-r*.35);ctx.closePath();ctx.fill();ctx.restore()};
Game.drawWeaponSilhouette=function(ctx,w,h){ctx.save();ctx.globalAlpha=.85;ctx.translate(w*.66,h*.82);ctx.fillStyle='rgba(8,18,30,.86)';ctx.strokeStyle='rgba(125,244,255,.46)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.22,-h*.05);ctx.lineTo(w*.28,h*.02);ctx.lineTo(w*.12,h*.08);ctx.lineTo(w*.03,h*.07);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,216,107,.5)';ctx.fillRect(w*.13,-h*.018,w*.055,h*.012);ctx.restore()};
