<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Blob Roundup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp');
        
        :root {
            --happy-blue: #87CEEB;
            --happy-green: #90EE90;
            --scan-sky-top: #0f1837;
            --scan-sky-bottom: #284b8b;
            --scan-floor-top: #153a53;
            --scan-floor-bottom: #08141f;
            --scan-panel: rgba(14, 24, 45, 0.78);
            --scan-panel-line: rgba(120, 228, 255, 0.65);
            --scan-glow: rgba(110, 237, 255, 0.32);
            --scan-accent: #7bf0ff;
            --scan-accent-strong: #b896ff;
            --scan-danger: #ff5f88;
            --scan-text: #f4fbff;
            --scan-muted: #bfd6f7;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(123, 240, 255, 0.2), transparent 38%),
                linear-gradient(180deg, var(--scan-sky-top), var(--scan-floor-bottom));
            color: var(--scan-text);
            -webkit-user-select: none;
            user-select: none;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            filter: saturate(1.06) contrast(1.04);
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .bottom-4 { bottom: 1rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-sm { max-width: 24rem; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .overflow-hidden { overflow: hidden; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-30 { z-index: 30; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pt-4 { padding-top: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; line-height: 0.95; }
        .font-bold { font-weight: 700; }
        .rounded-full { border-radius: 9999px; }
        .shadow-sm { box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        .shadow-lg { box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
        .drop-shadow-md { text-shadow: 0 3px 6px rgba(0,0,0,0.18); }
        .opacity-80 { opacity: 0.8; }
        .touch-none { touch-action: none; }
        .top-safe { top: env(safe-area-inset-top, 0); }
        .bg-happy-blue-90 { background: rgba(135, 206, 235, 0.9); }
        .bg-red-400-90 { background: rgba(248, 113, 113, 0.9); }
        .text-white { color: #fff; }
        .text-white-80 { color: rgba(255,255,255,0.8); }
        .text-pink-400 { color: #f472b6; }
        .text-pink-500 { color: #ec4899; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-700 { color: #374151; }
        .bg-pink-400 { background-color: #f472b6; }

        /* UI Panels */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(16, 26, 52, 0.92), rgba(9, 16, 33, 0.82)),
                rgba(14, 24, 45, 0.84);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--scan-panel-line);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 10px 28px rgba(0, 0, 0, 0.28),
                0 0 24px var(--scan-glow);
            border-radius: 24px;
            color: var(--scan-text);
        }

        .display-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .material-symbols-sharp {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.35rem;
            line-height: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--scan-accent-strong), var(--scan-accent));
            border: 1px solid rgba(255,255,255,0.24);
            color: #07111d;
            text-shadow: none;
            transition: transform 0.1s, box-shadow 0.16s, filter 0.16s;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 26px rgba(123, 240, 255, 0.3);
        }
        .btn-primary:hover,
        .btn-primary:focus-visible {
            filter: brightness(1.06);
            box-shadow: 0 12px 30px rgba(123, 240, 255, 0.36);
        }
        .btn-primary:active { transform: scale(0.95); }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(123, 240, 255, 0.08), transparent 26%, transparent 72%, rgba(184, 150, 255, 0.08)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 8px);
            mix-blend-mode: screen;
            opacity: 0.9;
            z-index: 1;
        }

        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0 22%, rgba(0, 0, 0, 0.24) 82%, rgba(0, 0, 0, 0.52) 100%);
            z-index: 1;
        }

        /* Joystick UI */
        #joystick-zone {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background:
                radial-gradient(circle at center, rgba(123, 240, 255, 0.18), rgba(16, 35, 69, 0.32) 58%, rgba(8, 16, 31, 0.5));
            border: 2px solid rgba(123, 240, 255, 0.58);
            box-shadow:
                inset 0 0 24px rgba(123, 240, 255, 0.18),
                0 0 24px rgba(11, 25, 46, 0.35);
            pointer-events: auto;
            touch-action: none;
        }
        
        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 80px; height: 80px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 35% 35%, #ffffff, #7bf0ff 50%, #18345f 100%);
            border-radius: 50%;
            box-shadow:
                0 0 0 3px rgba(255,255,255,0.25) inset,
                0 8px 18px rgba(0,0,0,0.22),
                0 0 22px rgba(123, 240, 255, 0.35);
            pointer-events: none;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .scanner-subtitle {
            color: var(--scan-muted);
            line-height: 1.35;
        }

        .hud-score {
            color: var(--scan-accent);
            text-shadow: 0 0 14px rgba(123, 240, 255, 0.38);
        }

        .crosshair-shell {
            width: 2.75rem;
            height: 2.75rem;
            border: 3px solid rgba(255,255,255,0.88);
            background: rgba(13, 25, 48, 0.28);
            box-shadow: 0 0 18px rgba(123, 240, 255, 0.18);
        }

        .crosshair-core {
            width: 0.55rem;
            height: 0.55rem;
            background: var(--scan-danger);
            box-shadow: 0 0 14px rgba(255, 95, 136, 0.55);
        }

        .gif-overlay {
            position: absolute;
            right: 1rem;
            bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
            width: min(32vw, 132px);
            border-radius: 20px;
            border: 2px solid rgba(123, 240, 255, 0.5);
            box-shadow: 0 12px 24px rgba(0,0,0,0.28);
            background: rgba(8, 16, 31, 0.78);
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 25;
        }

        .gif-overlay.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .gif-overlay img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: inherit;
        }

        #impact-gif {
            right: 1rem;
            bottom: calc(7.5rem + env(safe-area-inset-bottom, 0px));
        }

        #gameover-gif {
            left: 50%;
            right: auto;
            bottom: auto;
            top: calc(1rem + env(safe-area-inset-top, 0px));
            transform: translateX(-50%) translateY(-12px) scale(0.92);
            width: min(42vw, 180px);
        }

        #gameover-gif.visible {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .feedback-pill {
            position: absolute;
            left: 50%;
            top: calc(5.5rem + env(safe-area-inset-top, 0px));
            transform: translateX(-50%);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid rgba(123, 240, 255, 0.45);
            background: rgba(9, 16, 33, 0.84);
            color: var(--scan-text);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            font-size: 0.9rem;
            z-index: 25;
            opacity: 0;
            transition: opacity 160ms ease, transform 160ms ease;
            pointer-events: none;
        }

        .feedback-pill.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .gif-overlay {
                width: min(34vw, 112px);
            }

            #impact-gif {
                bottom: calc(8.5rem + env(safe-area-inset-bottom, 0px));
            }

            #gameover-gif {
                width: min(48vw, 148px);
            }

            .feedback-pill {
                top: calc(5rem + env(safe-area-inset-top, 0px));
                font-size: 0.78rem;
                max-width: 78vw;
                text-align: center;
            }
        }
    </style>
</head>
<body>
        <!-- Game Container -->
        <div id="game-container" class="relative w-full h-full overflow-hidden">
            <canvas id="gameCanvas"></canvas>
            <!-- [agent-note][stage4] resolved-font: title/ui -> Orbitron + Exo 2 and Material Symbols Sharp from catalogs/fonts.json -->
            <!-- [agent-note][stage3] resolved-gif: tag-impact + breach-reaction -> catalogs/gifs.json -->
            <div id="feedback-pill" class="feedback-pill display-font">SCAN LOCKED</div>
            <div id="impact-gif" class="gif-overlay" aria-hidden="true">
                <img src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Impact reaction" loading="lazy" decoding="async">
            </div>
            <div id="gameover-gif" class="gif-overlay" aria-hidden="true">
                <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Game over reaction" loading="lazy" decoding="async">
            </div>
        
        <!-- Crosshair (Cute) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-80 z-10">
                <div class="rounded-full flex items-center justify-center shadow-sm crosshair-shell">
                    <div class="crosshair-core rounded-full"></div>
                </div>
            </div>

        <!-- HUD -->
        <div id="hud" class="absolute top-safe left-4 right-4 flex justify-between items-start pointer-events-none hidden z-10 pt-4">
            <div class="glass-panel px-6 py-2">
                <span class="text-xl display-font hud-score">BLOBS TAGGED: <span id="score" class="text-2xl">0</span></span>
            </div>
            <button id="mute-btn" aria-label="Toggle audio" class="glass-panel w-12 h-12 flex items-center justify-center pointer-events-auto text-xl">
                <span class="material-symbols-sharp">volume_up</span>
            </button>
        </div>

        <!-- Controls Layer -->
        <div id="controls-layer" class="absolute inset-0 z-20 hidden">
            <!-- Top half for shooting -->
            <div id="shoot-zone" class="absolute top-0 left-0 w-full touch-none" style="height: 60%;"></div>
            <!-- Bottom half contains joystick visually, but logic handles touches -->
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
            <div class="absolute bottom-4 w-full text-center text-white-80 text-sm font-bold pointer-events-none display-font">
                DRAG TO SCOUT • TAP ABOVE TO TAG
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center z-30 bg-happy-blue-90 p-6">
            <div class="glass-panel p-8 text-center animate-float max-w-sm w-full">
                <h1 class="text-5xl drop-shadow-md mb-2 display-font" style="color: var(--scan-accent); text-shadow: 0 0 18px rgba(123,240,255,0.38);">BLOB<br>ROUNDUP</h1>
                <p class="scanner-subtitle mb-8 text-lg">Lock onto playful runaway blobs before your neon scanner zone gets overwhelmed.</p>
                <button id="start-btn" class="btn-primary w-full py-4 rounded-full text-2xl font-bold shadow-lg">START SCAN</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center z-30 bg-red-400-90 p-6">
            <div class="glass-panel p-8 text-center max-w-sm w-full">
                <h2 class="text-4xl mb-4 display-font" style="color: #ffd8e6;">SCAN BREACH!</h2>
                <div class="text-xl scanner-subtitle mb-8">You tagged <span id="finalScore" class="hud-score font-bold">0</span> blobs before one slipped into the scanner core.</div>
                <button id="restart-btn" class="btn-primary w-full py-4 rounded-full text-2xl font-bold shadow-lg">RESCAN</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * GAME ENGINE - SINGLE FILE
         */

        // --- 1. CONFIG & ASSETS ---
        const CONFIG = {
            fov: 0.66,
            moveSpeed: 4.0,
            rotSpeed: 2.5,
            mapWidth: 20,
            mapHeight: 20,
            colors: {
                skyTop: '#0f1837',
                skyBot: '#284b8b',
                floorTop: '#153a53',
                floorBot: '#08141f',
                walls: ['#59d3ff', '#7a8dff', '#7effd4', '#ffd36b', '#ff8ab8'] // Neon scanner lanes
            }
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            shoot: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3",
            collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
            muteToggle: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
        };

        // --- 2. AUDIO SYSTEM ---
        const AudioSys = {
            bgm: null,
            muted: false,
            primed: false,
            pools: {},
            init: function() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.16;
                this.bgm.preload = 'auto';

                this.pools = {
                    start: this.createPool(ASSETS.start, 1, 0.45),
                    shoot: this.createPool(ASSETS.shoot, 3, 0.26),
                    collect: this.createPool(ASSETS.collect, 3, 0.34),
                    fail: this.createPool(ASSETS.fail, 1, 0.42),
                    muteToggle: this.createPool(ASSETS.muteToggle, 1, 0.24)
                };
            },
            createPool: function(src, size, volume) {
                return Array.from({ length: size }, () => {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = volume;
                    return audio;
                });
            },
            prime: function() {
                if (this.primed) return;
                this.primed = true;
                Object.values(this.pools).flat().forEach((audio) => {
                    audio.load();
                });
                this.bgm.load();
            },
            playBGM: function() {
                if (this.muted || !this.bgm) return;
                this.bgm.play().catch(() => {});
            },
            stopBGM: function(reset = true) {
                if (!this.bgm) return;
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            },
            playSFX: function(type) {
                if (this.muted || !this.pools[type]) return;
                const audio = this.pools[type].find((item) => item.paused || item.ended) || this.pools[type][0];
                try {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } catch (_) {}
            },
            toggleMute: function() {
                const nextMuted = !this.muted;
                if (!nextMuted) {
                    this.playSFX('muteToggle');
                }
                this.muted = nextMuted;
                if (this.muted) this.stopBGM(false);
                else this.playBGM();
                return this.muted;
            }
        };

        // --- 3. INPUT SYSTEM (MOBILE FIRST) ---
        const Input = {
            x: 0, // -1 to 1 (Turning)
            y: 0, // -1 to 1 (Movement)
            shooting: false,
            
            init: function() {
                const joyZone = document.getElementById('joystick-zone');
                const joyKnob = document.getElementById('joystick-knob');
                const shootZone = document.getElementById('shoot-zone');
                
                let startX, startY;
                const maxDist = 70; // Max joystick radius

                // Joystick Logic
                joyZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    joyKnob.style.transition = 'none';
                }, {passive: false});

                joyZone.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    let dx = touch.clientX - startX;
                    let dy = touch.clientY - startY;
                    
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    
                    // Map to inputs
                    // X axis = Turn
                    this.x = dx / maxDist;
                    // Y axis = Move Forward/Back
                    this.y = dy / maxDist;
                }, {passive: false});

                const resetJoystick = (e) => {
                    e.preventDefault();
                    this.x = 0;
                    this.y = 0;
                    joyKnob.style.transition = 'transform 0.2s';
                    joyKnob.style.transform = `translate(-50%, -50%)`;
                };

                joyZone.addEventListener('touchend', resetJoystick);
                joyZone.addEventListener('touchcancel', resetJoystick);

                // Shooting Logic
                shootZone.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent zoom
                    this.shooting = true;
                }, {passive: false});
            },
            
            consumeShoot: function() {
                if(this.shooting) {
                    this.shooting = false;
                    return true;
                }
                return false;
            }
        };

        // --- 4. GAME STATE ---
        const Game = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            lastTime: 0,
            active: false,
            score: 0,
            feedbackTimer: null,
            gifTimers: {},
            
            player: { x: 10.5, y: 10.5, dirX: -1, dirY: 0, planeX: 0, planeY: 0.66 },
            map: [],
            enemies: [],
            zBuffer: [],

            init: function() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                
                // Generate Open Map
                for(let x=0; x<CONFIG.mapWidth; x++) {
                    this.map[x] = [];
                    for(let y=0; y<CONFIG.mapHeight; y++) {
                        // Borders are walls
                        if(x===0 || x===CONFIG.mapWidth-1 || y===0 || y===CONFIG.mapHeight-1) {
                            this.map[x][y] = 1;
                        } else {
                            // Random pillars, but sparse
                            this.map[x][y] = (Math.random() > 0.9) ? Math.floor(Math.random()*4)+1 : 0;
                        }
                    }
                }

                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                Input.init();
                AudioSys.init();

                // Bind UI
                document.getElementById('start-btn').onclick = () => this.start();
                document.getElementById('restart-btn').onclick = () => this.start();
                document.getElementById('mute-btn').onclick = () => {
                    AudioSys.prime();
                    const m = AudioSys.toggleMute();
                    document.querySelector('#mute-btn .material-symbols-sharp').innerText = m ? 'volume_off' : 'volume_up';
                };

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        AudioSys.stopBGM(false);
                    } else if (this.active && !AudioSys.muted) {
                        AudioSys.playBGM();
                    }
                });
            },

            resize: function() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.zBuffer = new Array(this.width).fill(0);
            },

            start: function() {
                AudioSys.prime();
                this.active = true;
                this.score = 0;
                document.getElementById('score').innerText = 0;
                
                // Reset Player
                this.player.x = CONFIG.mapWidth / 2;
                this.player.y = CONFIG.mapHeight / 2;
                this.player.dirX = -1; this.player.dirY = 0;
                this.player.planeX = 0; this.player.planeY = 0.66;

                // Reset Enemies
                this.enemies = [];
                for(let i=0; i<6; i++) this.spawnEnemy();

                // UI
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('controls-layer').classList.remove('hidden');
                this.hideGif('gameover-gif');
                this.flashFeedback('SCAN LIVE');
                AudioSys.playSFX('start');
                AudioSys.playBGM();

                this.lastTime = performance.now();
                requestAnimationFrame((t) => this.loop(t));
            },

            spawnEnemy: function() {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * (CONFIG.mapWidth-2)) + 1.5;
                    ey = Math.floor(Math.random() * (CONFIG.mapHeight-2)) + 1.5;
                } while (this.map[Math.floor(ex)][Math.floor(ey)] !== 0 || Math.hypot(ex - this.player.x, ey - this.player.y) < 4);
                
                this.enemies.push({
                    x: ex, y: ey,
                    hue: Math.random() * 360,
                    bounceOffset: Math.random() * Math.PI * 2
                });
            },

            gameOver: function() {
                this.active = false;
                AudioSys.stopBGM();
                AudioSys.playSFX('fail');
                this.flashFeedback('SCAN BREACH');
                this.showGif('gameover-gif', 2200);
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('controls-layer').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = this.score;
            },

            flashFeedback: function(message, duration = 900) {
                const pill = document.getElementById('feedback-pill');
                pill.textContent = message;
                pill.classList.add('visible');
                clearTimeout(this.feedbackTimer);
                this.feedbackTimer = setTimeout(() => {
                    pill.classList.remove('visible');
                }, duration);
            },

            showGif: function(id, duration = 700) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.add('visible');
                clearTimeout(this.gifTimers[id]);
                this.gifTimers[id] = setTimeout(() => {
                    el.classList.remove('visible');
                }, duration);
            },

            hideGif: function(id) {
                const el = document.getElementById(id);
                if (!el) return;
                clearTimeout(this.gifTimers[id]);
                el.classList.remove('visible');
            },

            loop: function(timestamp) {
                if(!this.active) return;
                const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
                this.lastTime = timestamp;

                this.update(dt);
                this.render();
                requestAnimationFrame((t) => this.loop(t));
            },

            update: function(dt) {
                const p = this.player;
                
                // Rotation
                const rot = -Input.x * CONFIG.rotSpeed * dt;
                const oldDirX = p.dirX;
                p.dirX = p.dirX * Math.cos(rot) - p.dirY * Math.sin(rot);
                p.dirY = oldDirX * Math.sin(rot) + p.dirY * Math.cos(rot);
                const oldPlaneX = p.planeX;
                p.planeX = p.planeX * Math.cos(rot) - p.planeY * Math.sin(rot);
                p.planeY = oldPlaneX * Math.sin(rot) + p.planeY * Math.cos(rot);

                // Movement (Inverted Y input for intuitive joystick: Up is negative Y in screen, but positive move)
                // Actually Input.y is -1 (Up) to 1 (Down).
                // We want Up to move forward.
                const moveStep = -Input.y * CONFIG.moveSpeed * dt;
                
                const nextX = p.x + p.dirX * moveStep;
                const nextY = p.y + p.dirY * moveStep;

                // Collision
                if(this.map[Math.floor(nextX)][Math.floor(p.y)] === 0) p.x = nextX;
                if(this.map[Math.floor(p.x)][Math.floor(nextY)] === 0) p.y = nextY;

                // Enemy Logic (Move towards player slowly)
                for(let i = this.enemies.length - 1; i >= 0; i--) {
                    let en = this.enemies[i];
                    const dx = p.x - en.x;
                    const dy = p.y - en.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if(dist < 0.8) {
                        this.gameOver();
                        return;
                    }

                    // Move
                    en.x += (dx/dist) * 0.5 * dt;
                    en.y += (dy/dist) * 0.5 * dt;
                }

                // Shooting
                if(Input.consumeShoot()) {
                    AudioSys.playSFX('shoot');
                    
                    // Check hits
                    // Simple distance + angle check
                    let hitIndex = -1;
                    let closestDist = 999;

                    this.enemies.forEach((en, idx) => {
                        const dx = en.x - p.x;
                        const dy = en.y - p.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        // Dot product for angle
                        const dot = (p.dirX * dx + p.dirY * dy) / dist;
                        
                        // Generous aim assist
                        if(dot > 0.8 && dist < closestDist) {
                            closestDist = dist;
                            hitIndex = idx;
                        }
                    });

                    if(hitIndex !== -1) {
                        // Collect!
                        this.enemies.splice(hitIndex, 1);
                        this.score++;
                        document.getElementById('score').innerText = this.score;
                        this.spawnEnemy();
                        AudioSys.playSFX('collect');
                        this.flashFeedback(this.score % 5 === 0 ? 'BLOB BONUS' : 'TAGGED');
                        this.showGif('impact-gif', 650);
                    } else {
                        this.flashFeedback('MISS', 420);
                    }
                }
            },

            render: function() {
                const w = this.width;
                const h = this.height;
                const ctx = this.ctx;
                const p = this.player;

                // 1. Sky & Floor
                const skyGrad = ctx.createLinearGradient(0, 0, 0, h/2);
                skyGrad.addColorStop(0, CONFIG.colors.skyTop);
                skyGrad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, w, h/2);

                const floorGrad = ctx.createLinearGradient(0, h/2, 0, h);
                floorGrad.addColorStop(0, CONFIG.colors.floorTop);
                floorGrad.addColorStop(1, CONFIG.colors.floorBot);
                ctx.fillStyle = floorGrad;
                ctx.fillRect(0, h/2, w, h/2);

                // 2. Walls
                for(let x = 0; x < w; x+=2) { // Resolution optimization
                    const cameraX = 2 * x / w - 1;
                    const rayDirX = p.dirX + p.planeX * cameraX;
                    const rayDirY = p.dirY + p.planeY * cameraX;

                    let mapX = Math.floor(p.x);
                    let mapY = Math.floor(p.y);
                    let sideDistX, sideDistY;
                    const deltaDistX = Math.abs(1/rayDirX);
                    const deltaDistY = Math.abs(1/rayDirY);
                    let stepX, stepY;
                    let hit = 0, side;

                    if (rayDirX < 0) { stepX = -1; sideDistX = (p.x - mapX) * deltaDistX; }
                    else { stepX = 1; sideDistX = (mapX + 1.0 - p.x) * deltaDistX; }
                    if (rayDirY < 0) { stepY = -1; sideDistY = (p.y - mapY) * deltaDistY; }
                    else { stepY = 1; sideDistY = (mapY + 1.0 - p.y) * deltaDistY; }

                    while (hit === 0) {
                        if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
                        else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
                        if (this.map[mapX][mapY] > 0) hit = 1;
                    }

                    let perpWallDist = (side === 0) ? (sideDistX - deltaDistX) : (sideDistY - deltaDistY);
                    
                    // ZBuffer
                    this.zBuffer[x] = perpWallDist;
                    this.zBuffer[x+1] = perpWallDist;

                    const lineHeight = Math.floor(h / perpWallDist);
                    const drawStart = Math.max(0, -lineHeight / 2 + h / 2);
                    const drawEnd = Math.min(h, lineHeight / 2 + h / 2);

                    // Color
                    const wallType = this.map[mapX][mapY];
                    let color = CONFIG.colors.walls[(mapX + mapY) % CONFIG.colors.walls.length];
                    
                    // Simple shading
                    if(side === 1) {
                        // Darken slightly
                        // Parse hex to rgb to darken? Just use filter overlay
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.8; 
                    } else {
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 1.0;
                    }
                    
                    // Draw wall strip
                    ctx.fillRect(x, drawStart, 2, drawEnd - drawStart);
                    ctx.globalAlpha = 1.0;
                }

                // 3. Sprites (Blobs)
                // Sort
                const spriteOrder = this.enemies.map((e, i) => {
                    return { dist: ((p.x - e.x)**2 + (p.y - e.y)**2), index: i };
                }).sort((a, b) => b.dist - a.dist);

                for(let i=0; i<spriteOrder.length; i++) {
                    const sprite = this.enemies[spriteOrder[i].index];
                    const spriteX = sprite.x - p.x;
                    const spriteY = sprite.y - p.y;

                    const invDet = 1.0 / (p.planeX * p.dirY - p.dirX * p.planeY);
                    const transformX = invDet * (p.dirY * spriteX - p.dirX * spriteY);
                    const transformY = invDet * (-p.planeY * spriteX + p.planeX * spriteY);

                    if (transformY <= 0) continue;

                    const spriteScreenX = Math.floor((w / 2) * (1 + transformX / transformY));
                    const spriteH = Math.abs(Math.floor(h / transformY));
                    const spriteW = Math.abs(Math.floor(h / transformY));
                    
                    // Bounce effect
                    const bounce = Math.sin(performance.now() * 0.005 + sprite.bounceOffset) * 20 / transformY;
                    const drawY = (-spriteH / 2 + h / 2) + bounce;
                    
                    // Check visibility (simple center check)
                    if (spriteScreenX > 0 && spriteScreenX < w && transformY < this.zBuffer[spriteScreenX]) {
                        const size = spriteW * 0.8;
                        
                        // Draw Blob
                        ctx.save();
                        ctx.translate(spriteScreenX, drawY + spriteH/2);

                        const bodyRadius = size / 2;
                        const glowRadius = size * 0.7;
                        const bodyGradient = ctx.createRadialGradient(-size * 0.15, -size * 0.22, size * 0.05, 0, 0, bodyRadius);
                        bodyGradient.addColorStop(0, `hsla(${sprite.hue}, 100%, 88%, 0.98)`);
                        bodyGradient.addColorStop(0.45, `hsla(${sprite.hue}, 95%, 68%, 0.98)`);
                        bodyGradient.addColorStop(1, `hsla(${sprite.hue}, 90%, 42%, 0.98)`);

                        ctx.fillStyle = `hsla(${sprite.hue}, 100%, 62%, 0.18)`;
                        ctx.beginPath();
                        ctx.arc(0, 0, glowRadius, 0, Math.PI*2);
                        ctx.fill();

                        ctx.fillStyle = bodyGradient;
                        ctx.beginPath();
                        ctx.arc(0, 0, bodyRadius, 0, Math.PI*2);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                        ctx.lineWidth = Math.max(2, size / 24);
                        ctx.stroke();

                        ctx.fillStyle = 'rgba(255,255,255,0.42)';
                        ctx.beginPath();
                        ctx.ellipse(-size * 0.13, -size * 0.17, size * 0.15, size * 0.1, -0.4, 0, Math.PI * 2);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(-size/5, -size/10, size/6, 0, Math.PI*2);
                        ctx.arc(size/5, -size/10, size/6, 0, Math.PI*2);
                        ctx.fill();

                        ctx.fillStyle = '#172033';
                        ctx.beginPath();
                        ctx.arc(-size/5, -size/10, size/13, 0, Math.PI*2);
                        ctx.arc(size/5, -size/10, size/13, 0, Math.PI*2);
                        ctx.fill();

                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(-size/5 - size/40, -size/8.5, size/28, 0, Math.PI*2);
                        ctx.arc(size/5 - size/40, -size/8.5, size/28, 0, Math.PI*2);
                        ctx.fill();

                        // Smile
                        ctx.strokeStyle = '#172033';
                        ctx.lineWidth = Math.max(2, size/20);
                        ctx.beginPath();
                        ctx.arc(0, size/10, size/4, 0.2, Math.PI - 0.2);
                        ctx.stroke();

                        ctx.restore();
                    }
                }
            }
        };

        // Start
        window.onload = () => Game.init();

    </script>
</body>
