<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bat Signal: Space Shooter Arcade</title><meta name="description" content="Neon noir one-thumb space shooter arcade with bat-satire rizz energy."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"><style>
:root{--c:#38f7ff;--m:#77ffd2;--v:#8d4dff;--g:#ffe36c;--d:#ff3d74}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02030a;color:#fff;font-family:Rajdhani,system-ui,sans-serif;touch-action:none}button{font:inherit}#game{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(141,77,255,.3),transparent 34%),linear-gradient(#080827,#02030a 62%,#000)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.beacon{position:absolute;left:50%;top:7%;width:min(82vw,420px);height:min(82vw,420px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(56,247,255,.18),rgba(141,77,255,.08) 48%,transparent 70%);pointer-events:none}.beacon:after{content:"";position:absolute;left:50%;top:50%;width:48%;height:28%;transform:translate(-50%,-50%);background:rgba(56,247,255,.16);clip-path:polygon(0 74%,16% 34%,31% 53%,43% 18%,50% 47%,57% 18%,69% 53%,84% 34%,100% 74%,72% 64%,50% 88%,28% 64%);filter:drop-shadow(0 0 24px var(--c))}.city{position:absolute;inset:auto 0 0;height:28%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,0,0,.68) 18%,#010207)}.city:before{content:"";position:absolute;inset:28% 0 0;background:linear-gradient(90deg,#08122b 0 4%,transparent 4% 7%,#061129 7% 13%,transparent 13% 18%,#08122b 18% 23%,transparent 23% 28%,#0b1534 28% 37%,transparent 37% 42%,#061129 42% 48%,transparent 48% 53%,#08122b 53% 60%,transparent 60% 64%,#0b1534 64% 74%,transparent 74% 79%,#061129 79% 86%,transparent 86% 90%,#08122b 90%)}.hud{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:none;justify-content:space-between;gap:10px;pointer-events:none}.chip{padding:8px 12px;border:1px solid rgba(56,247,255,.34);border-radius:999px;background:rgba(7,10,26,.78);box-shadow:0 0 22px rgba(56,247,255,.12);text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:clamp(15px,4vw,21px)}.chip b{font-family:Orbitron;color:var(--m);text-shadow:0 0 10px var(--m)}.mode{text-align:right;color:#c9fbff}.overlay{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 18%,rgba(56,247,255,.16),transparent 34%),linear-gradient(rgba(3,4,13,.62),rgba(3,4,13,.92));backdrop-filter:blur(9px)}.card{width:min(92vw,520px);text-align:center;padding:26px 18px 22px;border:1px solid rgba(56,247,255,.34);border-radius:28px;background:linear-gradient(rgba(9,14,34,.86),rgba(3,4,13,.78));box-shadow:0 30px 70px #0008,0 0 60px rgba(141,77,255,.18)}.mark{width:126px;height:76px;margin:0 auto 12px;background:linear-gradient(135deg,var(--c),var(--v));clip-path:polygon(0 72%,15% 24%,30% 45%,43% 4%,50% 38%,57% 4%,70% 45%,85% 24%,100% 72%,72% 62%,50% 96%,28% 62%);filter:drop-shadow(0 0 22px var(--c))}.title{font-family:Orbitron,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(38px,12vw,72px);line-height:.9;margin:0;text-shadow:0 0 16px var(--c),0 0 42px rgba(141,77,255,.34)}.tag{margin:14px auto 22px;max-width:31rem;font-size:clamp(18px,5vw,24px);line-height:1.08;color:#d8fbff}.meme{color:var(--g);font-weight:800}.cta{min-width:min(78vw,340px);min-height:58px;border:0;border-radius:18px;padding:14px 22px;background:linear-gradient(135deg,var(--c),var(--m));color:#02030a;font-family:Orbitron,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(18px,5vw,26px);box-shadow:0 0 26px rgba(56,247,255,.45);cursor:pointer}.ghost{background:transparent;color:var(--c);border:2px solid var(--c)}.hidden{display:none!important}.toast{position:absolute;z-index:8;left:50%;top:16%;transform:translate(-50%,-12px) scale(.96);opacity:0;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,227,108,.5);background:rgba(4,6,18,.78);color:var(--g);font-weight:900;text-transform:uppercase;letter-spacing:.1em;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}@media(max-width:440px){.mode{display:none}.mark{width:104px;height:63px}.cta{min-height:56px}}
</style></head><body><div id="game"><canvas id="gameCanvas"></canvas><div class="beacon"></div><div class="city"></div><div id="hud" class="hud"><div class="chip">Rizz Score <b id="score">0</b></div><div class="chip mode">One-thumb batwing online</div></div><div id="toast" class="toast">Based break!</div><section id="start" class="overlay"><div class="card"><div class="mark"></div><h1 class="title">Bat Signal<br>Space Shooter</h1><p class="tag">Drag anywhere to pilot the totally-not-a-vigilante prism wing. Auto-fire starts on touch. Split meme meteors, farm <span class="meme">rizz</span>, stay based.</p><button id="startBtn" class="cta">Start Session</button></div></section><section id="over" class="overlay hidden"><div class="card"><div class="mark"></div><h2 class="title">Signal<br>Cooked</h2><p class="tag">The neon noir debris chat ratioed your batwing. Final rizz: <span class="meme" id="finalScore">0</span></p><button id="restartBtn" class="cta ghost">Run It Back</button></div></section></div><audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/dungeon_bgm_01.mp3" preload="auto" loop></audio><audio id="shootSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_item_01.mp3" preload="auto"></audio><audio id="hitSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_enemy_01.mp3" preload="auto"></audio><audio id="boomSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dungeon_enemy_02.mp3" preload="auto"></audio><audio id="failSfx" src="https://gamezone-virid.vercel.app/assets/audios/sfx/dark_defeat_01.mp3" preload="auto"></audio><script>
(()=>{'use strict';const cfg={heroSpeed:.15,fireRate:150,rockSpeed:100,themeColor:'#38f7ff'},canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false}),start=document.getElementById('start'),over=document.getElementById('over'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),finalEl=document.getElementById('finalScore'),toast=document.getElementById('toast'),startBtn=document.getElementById('startBtn'),restartBtn=document.getElementById('restartBtn'),sounds={bgm:document.getElementById('bgm'),shoot:document.getElementById('shootSfx'),hit:document.getElementById('hitSfx'),boom:document.getElementById('boomSfx'),fail:document.getElementById('failSfx')};let W=0,H=0,last=0,playing=false,score=0,gameTime=0,shake=0,toastTimer=0,player={x:0,y:0,w:30,h:40,lastFire:0},bullets=[],rocks=[],particles=[],stars=[],lanes=[];const input={x:0,y:0,active:false},rand=(a,b)=>Math.random()*(b-a)+a;function play(n,v=.5){const a=sounds[n];if(!a)return;try{a.volume=v;a.currentTime=0;a.play().catch(()=>{})}catch(e){}}function unlock(){try{sounds.bgm.volume=.18;sounds.bgm.play().catch(()=>{})}catch(e){}}function seed(){stars=Array.from({length:110},()=>({x:rand(0,W),y:rand(0,H),z:rand(.25,2.3),a:rand(.12,.9)}));lanes=Array.from({length:8},(_,i)=>({x:(i+.5)*W/8+rand(-20,20),phase:rand(0,99),speed:rand(8,22)}))}function resize(){W=innerWidth;H=innerHeight;const dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);seed();if(!playing){player.x=W/2;player.y=H-105}}function poly(r,n){let pts=[];for(let i=0;i<n;i++){let a=Math.PI*2*i/n,rr=r*rand(.72,1.28);pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr})}return pts}function spawnRock(x,y,t){const r=t*15+10,s=cfg.rockSpeed*(1+(3-t)*.2);rocks.push({x,y,vx:rand(-20,20)+(Math.random()<.5?-1:1)*(4-t)*10,vy:s*rand(.8,1.2),radius:r,rotation:rand(0,Math.PI*2),rotSpeed:rand(-2,2),pts:poly(r,Math.floor(rand(5,8))),sizeTier:t,color:t===3?'#ff3d74':t===2?'#ffe36c':'#77ffd2'})}function burst(x,y,c,n){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(50,210);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rand(1.5,3),color:c,size:rand(1.5,4)})}}function show(txt){toast.textContent=txt;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),520)}function init(){score=0;gameTime=0;scoreEl.textContent='0';player={x:W/2,y:H-105,w:30,h:40,lastFire:0};bullets=[];rocks=[];particles=[];shake=0;input.active=false;seed()}function begin(){unlock();play('hit',.25);init();playing=true;start.classList.add('hidden');over.classList.add('hidden');hud.style.display='flex'}function gameOver(){playing=false;play('fail',.6);try{sounds.bgm.pause();sounds.bgm.currentTime=0}catch(e){}burst(player.x,player.y,cfg.themeColor,34);shake=22;hud.style.display='none';finalEl.textContent=score;over.classList.remove('hidden');show('Signal cooked')}function update(dt){gameTime+=dt;if(shake>0)shake=Math.max(0,shake-dt*60);if(input.active){let f=Math.max(0,Math.min(1,cfg.heroSpeed*60*dt));player.x+=(input.x-player.x)*f;player.y+=((input.y-50)-player.y)*f;player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));player.y=Math.max(player.h/2,Math.min(H-player.h/2,player.y));if(gameTime-player.lastFire>cfg.fireRate/1000){bullets.push({x:player.x,y:player.y-20,vy:-800});player.lastFire=gameTime;play('shoot',.22);player.y+=2}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.y+=b.vy*dt;if(b.y<-50)bullets.splice(i,1)}let rate=Math.max(.5,2-score/5000);if(Math.random()<dt/rate)spawnRock(rand(20,W-20),-50,3);for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.rotation+=r.rotSpeed*dt;let dx=player.x-r.x,dy=player.y-r.y;if(Math.sqrt(dx*dx+dy*dy)<r.radius+10){gameOver();return}let hit=false;for(let j=bullets.length-1;j>=0;j--){let b=bullets[j],bdx=b.x-r.x,bdy=b.y-r.y;if(bdx*bdx+bdy*bdy<r.radius*r.radius){bullets.splice(j,1);hit=true;break}}if(hit){play(r.sizeTier===3?'boom':'hit',.42);burst(r.x,r.y,r.color,10*r.sizeTier);shake+=r.sizeTier*2;score+=(4-r.sizeTier)*100;scoreEl.textContent=score;show(r.sizeTier===3?'Based split!':'+ rizz');if(r.sizeTier>1){spawnRock(r.x,r.y,r.sizeTier-1);spawnRock(r.x,r.y,r.sizeTier-1)}rocks.splice(i,1);continue}if(r.y>H+100)rocks.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;if(p.life<=0)particles.splice(i,1)}stars.forEach(s=>{s.y+=s.z*20*dt;if(s.y>H){s.y=0;s.x=rand(0,W)}});lanes.forEach(l=>l.phase+=dt*l.speed)}function bat(x,y){let bob=Math.sin(gameTime*7)*1.5;ctx.save();ctx.translate(x,y+bob);ctx.shadowBlur=22;ctx.shadowColor='#38f7ff';ctx.fillStyle='rgba(56,247,255,.16)';ctx.beginPath();ctx.ellipse(0,6,24,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eaffff';ctx.strokeStyle='#38f7ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(-9,-7);ctx.lineTo(-28,8);ctx.lineTo(-11,6);ctx.lineTo(-4,17);ctx.lineTo(0,10);ctx.lineTo(4,17);ctx.lineTo(11,6);ctx.lineTo(28,8);ctx.lineTo(9,-7);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffe36c';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(-5,5);ctx.lineTo(5,5);ctx.closePath();ctx.fill();ctx.fillStyle='#38f7ff';ctx.beginPath();ctx.arc(0,17,rand(3,6),0,Math.PI*2);ctx.fill();ctx.restore()}function draw(){ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090829');g.addColorStop(.55,'#030713');g.addColorStop(1,'#010207');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(56,247,255,.12)';lanes.forEach(l=>{ctx.beginPath();ctx.moveTo(l.x+Math.sin(l.phase*.05)*18,0);ctx.lineTo(l.x+Math.cos(l.phase*.05)*34,H);ctx.stroke()});ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.z,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;bat(player.x,player.y);ctx.shadowColor='#77ffd2';ctx.shadowBlur=14;ctx.strokeStyle='#77ffd2';ctx.lineWidth=3;ctx.beginPath();bullets.forEach(b=>{ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+16)});ctx.stroke();rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rotation);ctx.shadowColor=r.color;ctx.shadowBlur=12;ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.beginPath();r.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.fillStyle=r.color;ctx.globalAlpha=.12;ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.75)';ctx.font=`${Math.max(10,r.radius*.38)}px Orbitron`;ctx.textAlign='center';ctx.fillText('LOL',0,4);ctx.restore()});particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)});ctx.globalAlpha=1;ctx.restore()}function loop(t){let dt=Math.min((t-last)/1000,.1)||0;last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}function handle(e){if(!playing)return;e.preventDefault();let r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;input.x=(p.clientX-r.left)*(W/r.width);input.y=(p.clientY-r.top)*(H/r.height);input.active=true}function stop(){input.active=false}canvas.addEventListener('pointerdown',e=>{unlock();handle(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}} ,{passive:false});canvas.addEventListener('pointermove',handle,{passive:false});canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);startBtn.addEventListener('click',begin);restartBtn.addEventListener('click',begin);startBtn.addEventListener('pointerup',e=>{if(e.pointerType==='touch')begin()});restartBtn.addEventListener('pointerup',e=>{if(e.pointerType==='touch')begin()});addEventListener('resize',resize);resize();init();requestAnimationFrame(loop)})();
</script></body></html>
