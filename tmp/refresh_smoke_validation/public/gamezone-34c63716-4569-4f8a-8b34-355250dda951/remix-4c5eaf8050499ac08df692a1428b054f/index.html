<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbit Relay Defense</title>
    <!-- [agent-note][stage4] remapped-font: body/ui -> Rajdhani, display -> Orbitron from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --cyan-200: #b5fbff;
            --cyan-400: #63f2ff;
            --cyan-500: #18cde4;
            --red-500: #ff596f;
            --black: #000000;
            --white: #ffffff;
            --bg-deep: #050510;
            --bg-mid: #0d1430;
            --bg-glow: #112657;
            --panel: rgba(10, 18, 40, 0.72);
            --panel-border: rgba(122, 244, 255, 0.36);
            --gold-400: #ffd86b;
            --mint-400: #78ffcf;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #050510;
        }

        body {
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--white);
            letter-spacing: 0.03em;
            background:
                radial-gradient(circle at 50% 20%, rgba(99, 242, 255, 0.12), transparent 32%),
                radial-gradient(circle at 50% 100%, rgba(24, 205, 228, 0.14), transparent 30%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 58%, #02030a 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .font-game { font-family: 'Rajdhani', system-ui, sans-serif; }
        .font-bold { font-weight: 700; }
        .leading-none { line-height: 1; }
        .tracking-wider { letter-spacing: 0.08em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .text-white { color: var(--white); }
        .text-black { color: var(--black); }
        .text-cyan-200 { color: var(--cyan-200); }
        .text-cyan-400 { color: var(--cyan-400); }
        .text-cyan-500 { color: var(--cyan-500); }
        .text-red-500 { color: var(--red-500); }
        .text-2xl { font-size: clamp(1.2rem, 2.6vw, 1.5rem); }
        .text-3xl { font-size: clamp(1.4rem, 3vw, 1.875rem); }
        .text-6xl { font-size: clamp(2.6rem, 8vw, 3.75rem); }
        .text-7xl { font-size: clamp(3rem, 10vw, 4.5rem); }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .rounded { border-radius: 0.5rem; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-cyan-500 { border-color: var(--cyan-500); }
        .bg-cyan-500 { background: var(--cyan-500); }
        .opacity-80 { opacity: 0.8; }
        .transition-all { transition: all 0.2s ease; }
        .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }
        .glass {
            background:
                linear-gradient(180deg, rgba(14, 25, 52, 0.88), rgba(6, 10, 24, 0.82)),
                radial-gradient(circle at top, rgba(99, 242, 255, 0.16), transparent 55%);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 18px 48px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(24, 205, 228, 0.1);
        }
        .neon-text {
            text-shadow: 0 0 12px rgba(99, 242, 255, 0.72), 0 0 28px rgba(24, 205, 228, 0.42);
        }
        .neon-danger {
            text-shadow: 0 0 10px rgba(255, 89, 111, 0.75), 0 0 22px rgba(255, 89, 111, 0.35);
        }
        .shadow-start {
            box-shadow: 0 0 24px rgba(99, 242, 255, 0.45);
        }
        .hud-chip {
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(13, 23, 50, 0.92), rgba(5, 9, 20, 0.88));
            border: 1px solid rgba(120, 255, 207, 0.28);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.35);
        }
        .display-title {
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            text-transform: uppercase;
        }
        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: clamp(5rem, 20vw, 8rem);
            border-radius: 1rem;
            border: 1px solid rgba(122, 244, 255, 0.35);
            background: rgba(4, 10, 24, 0.72);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            object-fit: cover;
        }
        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.hit {
            top: 5.5rem;
        }
        .feedback-gif.fail {
            bottom: 1rem;
        }
        .subtitle-copy {
            max-width: min(82vw, 28rem);
            padding: 0 1rem;
            line-height: 1.1;
        }
        .arcade-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .arcade-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.32) 50%, transparent 80%);
            transform: translateX(-120%);
            transition: transform 0.4s ease;
        }
        .arcade-btn:hover::before {
            transform: translateX(120%);
        }
        .scanlines::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.01) 50%, rgba(0,0,0,0.08) 100%);
            background-size: 100% 6px;
            mix-blend-mode: screen;
            opacity: 0.35;
        }
        .status-orbit {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        .status-orbit::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            border-radius: 999px;
            background: var(--mint-400);
            box-shadow: 0 0 12px rgba(120, 255, 207, 0.9);
            animation: pulse 1.4s ease-in-out infinite;
        }

        .bg-cyan-500:hover {
            background: #22d3ee;
        }

        .border-cyan-500:hover {
            background: var(--cyan-500);
            color: var(--black);
        }

        #start-screen,
        #game-over-screen {
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
            box-sizing: border-box;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }

        @media (max-width: 640px) {
            .top-4 { top: 0.75rem; }
            .left-4 { left: 0.75rem; }
            .px-10, .px-12 { padding-left: 2rem; padding-right: 2rem; }
            .py-3, .py-4 { padding-top: 0.8rem; padding-bottom: 0.8rem; }
            .tracking-widest { letter-spacing: 0.12em; }
            .hud-chip { padding: 0.4rem 0.68rem; }
            .subtitle-copy { font-size: 1rem; margin-bottom: 1.6rem; }
            .feedback-gif {
                right: 0.75rem;
                width: clamp(4.5rem, 23vw, 6rem);
            }
            .feedback-gif.hit {
                top: 4.75rem;
            }
            .feedback-gif.fail {
                bottom: 0.75rem;
            }
         }
    </style>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: gameplay loop + hit/fire/ui/fail cues -> catalogs/audios.json -->

<!-- UI Layer -->

<script>
/**
 * AUDIO MANAGER
 * Handles BGM and Synthesized SFX
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgm = document.getElementById('bgm_main');
        this.sfx = {
            fire: document.getElementById('sfx_fire'),
            hit: document.getElementById('sfx_hit'),
            burst: document.getElementById('sfx_burst'),
            fail: document.getElementById('sfx_fail'),
            ui: document.getElementById('sfx_ui')
        };
        this.unlocked = false;
        this.lastPlayed = new Map();
    }

    ensureContext() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                this.ctx = new AudioCtx();
            }
        }
        return this.ctx;
    }

    unlock() {
        if (this.unlocked) return;
        const ctx = this.ensureContext();
        if (ctx) {
            ctx.resume().catch(() => {});
        }
        this.unlocked = true;
        this.startLoop();
    }

    startLoop() {
        if (!this.bgm) return;
        this.bgm.volume = 0.2;
        this.bgm.play().catch(() => {});
    }

    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }

    play(name, cooldown = 0) {
        if (!this.unlocked) return;
        const clip = this.sfx[name];
        if (!clip) return;
        const now = performance.now();
        const last = this.lastPlayed.get(name) || 0;
        if (now - last < cooldown) return;
        this.lastPlayed.set(name, now);
        try {
            clip.currentTime = 0;
            clip.play().catch(() => {});
        } catch (_) {}
    }

    playShoot() {
        this.play('fire', 70);
    }

    playHit(isBig) {
        this.play(isBig ? 'burst' : 'hit', isBig ? 120 : 80);
    }

    playGameOver() {
        this.play('fail', 250);
        this.stopLoop();
    }

    playUi() {
        this.play('ui', 140);
    }
}

/**
 * GAME ENGINE
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config Setup ---
    window.gameConfig = {
        heroSpeed: 0.15,
        fireRate: 150,
        rockSpeed: 100,
        themeColor: "#00f3ff"
    };

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    
    // Apply defaults
    for (let key in window.gameConfigDefs) {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on canvas bg
    const audioSys = new AudioManager();

    // DOM Elements
    const uiStart = document.getElementById('start-screen');
    const uiGameOver = document.getElementById('game-over-screen');
    const uiHud = document.getElementById('hud');
    const elScore = document.getElementById('score');
    const elFinalScore = document.getElementById('finalScore');
    const btnStart = document.getElementById('start-btn');
    const btnRestart = document.getElementById('restart-btn');
    const hitGif = document.getElementById('hit-gif');
    const failGif = document.getElementById('fail-gif');

    // State
    let width, height;
    let lastTime = 0;
    let isPlaying = false;
    let score = 0;
    let gameTime = 0;
    
    // Input
    const input = { x: 0, y: 0, active: false };
    
    // Entities
    let player = { x: 0, y: 0, w: 30, h: 40, vx: 0, vy: 0, lastFire: 0 };
    let bullets = [];
    let rocks = [];
    let particles = [];
    let stars = [];
    let shake = 0;
    let feedbackTimers = { hit: 0, fail: 0 };
    const theme = {
        playerGlow: '#7af4ff',
        playerCore: '#eaffff',
        playerAccent: '#ffd86b',
        bullet: '#78ffcf',
        shield: 'rgba(122, 244, 255, 0.16)'
    };

    // --- Helper Functions ---
    const rand = (min, max) => Math.random() * (max - min) + min;
    
    function createPolygon(radius, vertices) {
        const pts = [];
        for (let i = 0; i < vertices; i++) {
            const angle = (Math.PI * 2 * i) / vertices;
            const r = radius * rand(0.7, 1.3);
            pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
        }
        return pts;
    }

    function spawnRock(x, y, sizeTier) {
        // sizeTier: 3 (Large), 2 (Med), 1 (Small)
        const radius = sizeTier * 15 + 10;
        const speed = window.gameConfig.rockSpeed * (1 + (3-sizeTier)*0.2);
        
        rocks.push({
            x: x,
            y: y,
            vx: rand(-20, 20) + (Math.random() < 0.5 ? -1 : 1) * (4-sizeTier)*10, // Add horizontal spread on split
            vy: speed * rand(0.8, 1.2),
            radius: radius,
            rotation: rand(0, Math.PI*2),
            rotSpeed: rand(-2, 2),
            pts: createPolygon(radius, rand(5, 8)),
            sizeTier: sizeTier,
            color: sizeTier === 3 ? '#ff5e00' : (sizeTier === 2 ? '#ffaa00' : '#ffff00')
        });
    }

    function createExplosion(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = rand(0, Math.PI*2);
            const speed = rand(50, 200);
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                decay: rand(1.5, 3.0),
                color: color,
                size: rand(1, 3)
            });
        }
    }

    function showGif(type, duration = 700) {
        const target = type === 'fail' ? failGif : hitGif;
        if (!target) return;
        target.classList.add('is-visible');
        feedbackTimers[type] = window.setTimeout(() => {
            target.classList.remove('is-visible');
        }, duration);
    }

    function hideFeedback() {
        window.clearTimeout(feedbackTimers.hit);
        window.clearTimeout(feedbackTimers.fail);
        hitGif?.classList.remove('is-visible');
        failGif?.classList.remove('is-visible');
    }

    // --- Core Loops ---

    function initGame() {
        score = 0;
        gameTime = 0;
        elScore.innerText = "0";
        hideFeedback();
        
        player.x = width / 2;
        player.y = height - 100;
        player.vx = 0;
        player.vy = 0;
        
        bullets = [];
        rocks = [];
        particles = [];
        shake = 0;

        // Init Stars
        stars = [];
        for(let i=0; i<100; i++) {
            stars.push({
                x: rand(0, width),
                y: rand(0, height),
                z: rand(0.2, 2), // Parallax factor
                alpha: rand(0.1, 0.8)
            });
        }
    }

    function gameOver() {
        isPlaying = false;
        audioSys.playGameOver();
        showGif('fail', 1200);
        shake = 20;
        uiHud.classList.add('hidden');
        uiGameOver.classList.remove('hidden');
        elFinalScore.innerText = score;
    }

    function update(dt) {
        gameTime += dt;
        
        if (document.hidden && audioSys.bgm && !audioSys.bgm.paused) {
            audioSys.bgm.pause();
        }
        
        // Screen Shake Decay
        if (shake > 0) shake = Math.max(0, shake - dt * 60);

        // --- Player ---
        if (input.active) {
            // Smooth follow
            const dx = input.x - player.x;
            const dy = (input.y - 50) - player.y; // Offset slightly above finger
            
            // Frame independent lerp
            const f = window.gameConfig.heroSpeed * 60 * dt; // Normalize to 60fps base
            const clampedF = Math.max(0, Math.min(1, f));
            
            player.x += dx * clampedF;
            player.y += dy * clampedF;

            // Clamp to screen
            player.x = Math.max(player.w/2, Math.min(width - player.w/2, player.x));
            player.y = Math.max(player.h/2, Math.min(height - player.h/2, player.y));

            // Auto Fire
            if (gameTime - player.lastFire > window.gameConfig.fireRate / 1000) {
                bullets.push({ x: player.x, y: player.y - 20, vy: -800 });
                player.lastFire = gameTime;
                audioSys.playShoot();
                // Recoil
                player.y += 2;
            }
        }

        // --- Bullets ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y += b.vy * dt;
            if (b.y < -50) bullets.splice(i, 1);
        }

        // --- Spawner ---
        // Difficulty curve: spawn rate increases with score
        const spawnRate = Math.max(0.5, 2.0 - (score / 5000)); 
        if (Math.random() < dt / spawnRate) {
            spawnRock(rand(20, width-20), -50, 3);
        }

        // --- Rocks ---
        for (let i = rocks.length - 1; i >= 0; i--) {
            let r = rocks[i];
            r.x += r.vx * dt;
            r.y += r.vy * dt;
            r.rotation += r.rotSpeed * dt;

            // Collision: Rock vs Player
            const dx = player.x - r.x;
            const dy = player.y - r.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < r.radius + 10) { // 10 is approx player radius
                createExplosion(player.x, player.y, window.gameConfig.themeColor, 30);
                gameOver();
                return; // Stop update
            }

            // Collision: Rock vs Bullet
            let hit = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                const bdx = b.x - r.x;
                const bdy = b.y - r.y;
                if (bdx*bdx + bdy*bdy < r.radius * r.radius) {
                    // HIT!
                    bullets.splice(j, 1);
                    hit = true;
                    break;
                }
            }

            if (hit) {
                audioSys.playHit(r.sizeTier === 3);
                showGif('hit', r.sizeTier === 3 ? 720 : 420);
                createExplosion(r.x, r.y, r.color, 10 * r.sizeTier);
                shake += r.sizeTier * 2;
                score += (4 - r.sizeTier) * 100;
                elScore.innerText = score;

                // Split Logic
                if (r.sizeTier > 1) {
                    spawnRock(r.x, r.y, r.sizeTier - 1);
                    spawnRock(r.x, r.y, r.sizeTier - 1);
                }
                
                rocks.splice(i, 1);
                continue;
            }

            // Despawn
            if (r.y > height + 100) rocks.splice(i, 1);
        }

        // --- Particles ---
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= p.decay * dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // --- Stars (Background) ---
        stars.forEach(s => {
            s.y += s.z * 20 * dt; // Fall speed
            if (s.y > height) {
                s.y = 0;
                s.x = rand(0, width);
            }
        });
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, width, height);

        // Apply Shake
        ctx.save();
        if (shake > 0) {
            ctx.translate(rand(-shake, shake), rand(-shake, shake));
        }

        // Draw Stars
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            ctx.globalAlpha = s.alpha;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.z, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // Draw Player
        const bob = Math.sin(gameTime * 7) * 1.5;
        ctx.shadowBlur = 18;
        ctx.shadowColor = theme.playerGlow;
        ctx.fillStyle = theme.shield;
        ctx.beginPath();
        ctx.ellipse(player.x, player.y + 5, 21, 28, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = theme.playerCore;
        ctx.strokeStyle = theme.playerGlow;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 22 + bob);
        ctx.lineTo(player.x - 16, player.y + 12);
        ctx.lineTo(player.x - 5, player.y + 8);
        ctx.lineTo(player.x, player.y + 16);
        ctx.lineTo(player.x + 5, player.y + 8);
        ctx.lineTo(player.x + 16, player.y + 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = theme.playerAccent;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 12 + bob);
        ctx.lineTo(player.x - 4, player.y + 5);
        ctx.lineTo(player.x + 4, player.y + 5);
        ctx.closePath();
        ctx.fill();

        // Engine Glow
        ctx.fillStyle = theme.playerGlow;
        ctx.beginPath();
        ctx.arc(player.x, player.y + 14, rand(3, 6), 0, Math.PI*2);
        ctx.fill();

        // Draw Bullets
        ctx.shadowColor = theme.bullet;
        ctx.strokeStyle = theme.bullet;
        ctx.lineWidth = 3;
        ctx.beginPath();
        bullets.forEach(b => {
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x, b.y + 15);
        });
        ctx.stroke();

        // Draw Rocks
        rocks.forEach(r => {
            ctx.shadowColor = r.color;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = r.color;
            ctx.lineWidth = 2;
            
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.rotation);
            
            ctx.beginPath();
            r.pts.forEach((p, idx) => {
                if (idx === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.stroke();
            
            // Inner detail
            ctx.fillStyle = r.color;
            ctx.globalAlpha = 0.1;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            
            ctx.restore();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.shadowBlur = 5;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.rect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore(); // Restore shake
    }

    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        if (isPlaying) {
            try {
                update(dt);
            } catch (e) {
                console.error("Game Loop Error:", e);
            }
        }
        draw();
        requestAnimationFrame(loop);
    }

    // --- Input Handling ---
    function handleInput(e) {
        if (!isPlaying) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        input.x = (clientX - rect.left) * (width / rect.width);
        input.y = (clientY - rect.top) * (height / rect.height);
        input.active = true;
    }

    function stopInput() {
        input.active = false;
    }

    // Pointer Events (Mouse + Touch unified)
    canvas.addEventListener('pointerdown', (e) => {
        audioSys.unlock();
        handleInput(e);
        canvas.setPointerCapture(e.pointerId);
    }, { passive: false });

    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', stopInput);
    canvas.addEventListener('pointercancel', stopInput);

    // --- Initialization ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Re-init stars if resized to cover new area
        if (stars.length === 0) initGame();
    }

    window.addEventListener('resize', resize);
    resize();
    initGame(); // Initial setup
    requestAnimationFrame(loop);

    // --- UI Bindings ---
    function startRun() {
        audioSys.unlock();
        audioSys.playUi();
        initGame();
        isPlaying = true;
        uiStart.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        uiHud.classList.remove('hidden');
        // Set initial input pos to center to avoid jump
        input.x = width / 2;
        input.y = height - 100;
        input.active = false;
    }

    function restartRun() {
        audioSys.unlock();
        audioSys.playUi();
        initGame();
        isPlaying = true;
        uiGameOver.classList.add('hidden');
        uiHud.classList.remove('hidden');
        input.active = false;
    }

    btnStart.addEventListener('click', startRun);
    btnRestart.addEventListener('click', restartRun);
    // [agent-note][stage4] repaired: mobile-action-path | element: start/restart buttons | action: native click preserved, pointerup fallback added without global touch suppression
    btnStart.addEventListener('pointerup', startRun);
    btnRestart.addEventListener('pointerup', restartRun);

    document.addEventListener('visibilitychange', () => {
        if (!audioSys.bgm) return;
        if (document.hidden) {
            audioSys.bgm.pause();
        } else if (audioSys.unlocked && (isPlaying || !uiStart.classList.contains('hidden'))) {
            audioSys.startLoop();
        }
    });
});
</script>
</body>
</html>
