<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tough Pigeon Panic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #4f46e5;
    --bg-deep: #22114f;
    --ink: #130a2c;
    --paper: #fff9ef;
    --paper-strong: #ffffff;
    --danger: #ff5a6a;
    --danger-deep: #cb2855;
    --accent: #8b5cf6;
    --accent-bright: #41f2ff;
    --gold: #ffd54f;
    --sky: #b9f3ff;
    --enemy: #ff7a45;
    --enemy-deep: #ff4d6d;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at top, #8b5cf6 0%, #4f46e5 35%, #22114f 100%);
    font-family: 'Exo 2', system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    user-select: none;
  }

  canvas {
    display: block;
    touch-action: none;
    width: 100%;
    height: 100%;
  }

  .ui-layer {
    position: absolute;
    inset: 0;
    z-index: 50;
    pointer-events: none;
  }

  #hud {
    position: absolute;
    inset: 0;
  }

  .hidden {
    display: none !important;
  }

  .ui-font {
    font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
    letter-spacing: 1.4px;
  }

  .body-font {
    font-family: 'Exo 2', system-ui, sans-serif;
  }

  .brutal-shadow {
    box-shadow: 0 10px 0 rgba(19, 10, 44, 0.55), 0 16px 30px rgba(19, 10, 44, 0.28);
  }

  .brutal-border {
    border: 4px solid var(--ink);
  }

  .brutal-active:active {
    transform: translate(0, 4px) scale(0.98);
    box-shadow: 0 5px 0 rgba(19, 10, 44, 0.55), 0 10px 18px rgba(19, 10, 44, 0.24);
  }

  .health-shell {
    position: absolute;
    top: 24px;
    right: 24px;
    width: min(192px, calc(100vw - 48px));
    height: 40px;
    background: linear-gradient(180deg, rgba(255, 249, 239, 0.96), rgba(227, 232, 255, 0.96));
    padding: 4px;
    border-radius: 20px;
    overflow: hidden;
  }

  #health-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--danger), var(--gold));
    transform-origin: left;
    transition: transform 100ms linear;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  #health-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: health-sheen 2.2s linear infinite;
  }

  .top-banner {
    position: absolute;
    top: 24px;
    left: 24px;
    max-width: min(340px, calc(100vw - 160px));
    background: linear-gradient(180deg, rgba(255, 249, 239, 0.95), rgba(222, 233, 255, 0.94));
    padding: 12px 14px;
    color: var(--ink);
    border-radius: 22px;
  }

  .top-banner h2,
  .top-banner p {
    margin: 0;
  }

  .top-banner h2 {
    font-size: clamp(18px, 3vw, 24px);
    line-height: 1.1;
    text-transform: uppercase;
    color: #35206a;
    text-shadow: 0 2px 0 rgba(255,255,255,0.65);
  }

  .top-banner p {
    margin-top: 8px;
    font-size: clamp(13px, 1.8vw, 18px);
    line-height: 1.15;
    font-family: 'Exo 2', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  #kill-btn {
    position: absolute;
    right: 40px;
    bottom: 40px;
    width: 112px;
    height: 112px;
    border-radius: 999px;
    background: radial-gradient(circle at 30% 30%, #fff48d 0%, #ff9e57 35%, var(--danger) 75%, var(--danger-deep) 100%);
    color: var(--paper);
    font-size: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease, filter 120ms ease;
    pointer-events: auto;
    text-transform: uppercase;
    text-shadow: 0 2px 0 rgba(19, 10, 44, 0.45);
    filter: saturate(1.06);
  }

  #kill-btn:hover {
    filter: brightness(1.06) saturate(1.12);
  }

  #kill-btn::before {
    content: '💥';
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 22px;
    transform: rotate(14deg);
  }

  #game-over-screen {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top, rgba(139, 92, 246, 0.42), transparent 34%),
      linear-gradient(180deg, rgba(34, 17, 79, 0.92), rgba(19, 10, 44, 0.96));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: auto;
    z-index: 60;
  }

  .game-over-card {
    position: relative;
    background: linear-gradient(180deg, var(--paper-strong), #ffdff0);
    padding: 24px;
    text-align: center;
    transform: rotate(-2deg);
    margin-bottom: 24px;
    max-width: min(90vw, 560px);
    border-radius: 28px;
    overflow: hidden;
  }

  .game-over-card h1,
  .game-over-card p {
    margin: 0;
    position: relative;
    z-index: 2;
  }

  .game-over-card h1 {
    font-size: clamp(44px, 8vw, 86px);
    line-height: 0.95;
    text-transform: uppercase;
    color: #35206a;
  }

  .game-over-card .accent {
    color: var(--danger);
  }

  .game-over-card p {
    margin-top: 16px;
    font-size: clamp(18px, 3vw, 24px);
    line-height: 1.1;
  }

  #restart-btn {
    padding: 18px 32px;
    background: linear-gradient(180deg, var(--accent-bright), #5cf0d2);
    color: var(--ink);
    font-size: clamp(26px, 4vw, 38px);
    transition: background-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    pointer-events: auto;
    text-transform: uppercase;
    border-radius: 20px;
  }

  #restart-btn:hover {
    background: linear-gradient(180deg, #7ff7ff, #77f2dd);
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(65, 242, 255, 0.18);
    color: #35206a;
    font-family: 'Exo 2', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .status-chip::before {
    content: '🕊️';
    font-size: 12px;
  }

  .feedback-gif {
    position: absolute;
    z-index: 55;
    pointer-events: none;
    opacity: 0;
    transition: opacity 180ms ease, transform 180ms ease;
    filter: drop-shadow(0 12px 24px rgba(19, 10, 44, 0.35));
  }

  .feedback-gif img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
  }

  #impact-gif {
    right: 24px;
    top: 148px;
    width: min(144px, 28vw);
    transform: translateY(8px) scale(0.96);
  }

  #impact-gif.visible {
    opacity: 0.95;
    transform: translateY(0) scale(1);
  }

  #fail-gif {
    left: 24px;
    bottom: 24px;
    width: min(150px, 32vw);
    transform: translateY(8px) scale(0.96);
  }

  #fail-gif.visible {
    opacity: 0.9;
    transform: translateY(0) scale(1);
  }

  .gif-caption {
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(19, 10, 44, 0.74);
    color: white;
    font-family: 'Exo 2', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    text-transform: uppercase;
  }

  @keyframes health-sheen {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  @media (max-width: 700px) {
    .top-banner {
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: none;
      padding: 10px 12px;
    }

    .health-shell {
      top: auto;
      right: 16px;
      left: 16px;
      bottom: 132px;
      width: auto;
      height: 28px;
    }

    #kill-btn {
      right: 16px;
      bottom: 16px;
      width: 96px;
      height: 96px;
      font-size: 26px;
    }

    #impact-gif {
      top: auto;
      right: 16px;
      bottom: 240px;
      width: min(120px, 28vw);
    }

    #fail-gif {
      left: 16px;
      bottom: 144px;
      width: min(116px, 28vw);
    }

    .gif-caption {
      font-size: 10px;
      letter-spacing: 0.8px;
    }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer" class="ui-layer">
    <!-- HUD -->
    <div id="hud">
      <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled without moving controls -->
      <!-- [agent-note][stage4] resolved-font: title/buttons -> Bangers, body/ui -> Exo 2 from catalogs/fonts.json -->
      <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
      <div class="top-banner brutal-border brutal-shadow">
        <div class="status-chip">Skyline Escape</div>
        <h2 class="ui-font">Tough Pigeon Panic</h2>
        <p>Guide the pigeon clear of the crowd. Tap SCAT to shoo the closest nuisance before the panic meter runs out.</p>
      </div>

      <div class="health-shell brutal-border brutal-shadow">
        <div id="health-fill" style="transform: scaleX(1);"></div>
      </div>

      <button id="kill-btn" class="ui-font brutal-border brutal-shadow brutal-active">
        SCAT
      </button>
    </div>

    <div id="impact-gif" class="feedback-gif hidden" aria-hidden="true">
      <img
        src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
        alt="Impact reaction"
        loading="lazy"
        decoding="async">
      <div class="gif-caption ui-font">Scat Blast</div>
    </div>

    <div id="fail-gif" class="feedback-gif hidden" aria-hidden="true">
      <img
        src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
        alt="Fail reaction"
        loading="lazy"
        decoding="async">
      <div class="gif-caption ui-font">Panic Spike</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
      <div class="game-over-card brutal-border brutal-shadow ui-font">
        <h1>Tough Pigeon<br><span class="accent">Overrun</span></h1>
        <p class="body-font">The flock lost its nerve. Launch another escape run.</p>
      </div>
      <button id="restart-btn" class="ui-font brutal-border brutal-shadow brutal-active">
        FLY AGAIN
      </button>
    </div>
  </div>
</div>

<!-- Assets -->
<img id="asset_player" data-editable="image" data-label="Player Sprite" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_idle.png" crossorigin="anonymous" hidden>
<!-- [agent-note][stage3] resolved-audio: gameplay/ui/fail cues mapped from catalogs/audios.json -->
<audio id="bgm_game" data-editable="audio" data-label="Game BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop hidden></audio>
<audio id="bgm_defeat" data-editable="audio" data-label="Defeat BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_02.mp3" preload="auto" loop hidden></audio>
<audio id="sfx_enemy_defeat" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3" preload="auto" hidden></audio>
<audio id="sfx_blocked" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto" hidden></audio>
<audio id="sfx_damage" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto" hidden></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto" hidden></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto" hidden></audio>
<audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto" hidden></audio>

<script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 12 },
  "enemySpeed": { "type": "number", "label": "Enemy Speed", "value": 120, "min": 50, "max": 300 },
  "maxHealth": { "type": "number", "label": "Panic Meter", "value": 100, "min": 10, "max": 500 }
}
</script>

<script>
// --- Configuration ---
let gameConfig = {};
try {
  const confStr = document.getElementById('game-config').textContent;
  const defs = JSON.parse(confStr);
  for (let k in defs) gameConfig[k] = defs[k].value;
} catch (e) {
  gameConfig = { heroSpeed: 6, enemySpeed: 120, maxHealth: 100 };
}

// --- Globals ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
let lastTime = 0;

// DOM Elements
const uiHud = document.getElementById('hud');
const uiGameOver = document.getElementById('game-over-screen');
const healthFill = document.getElementById('health-fill');
const assetPlayer = document.getElementById('asset_player');
const bgmGame = document.getElementById('bgm_game');
const bgmDefeat = document.getElementById('bgm_defeat');
const impactGif = document.getElementById('impact-gif');
const failGif = document.getElementById('fail-gif');

// Audio Context
let audioCtx = null;
let audioUnlocked = false;

// Game State Data
let health = gameConfig.maxHealth;
let player = { x: 0, y: 0, r: 35, vx: 0, vy: 0, flash: 0 };
let enemies = [];
let particles = [];
let enemySpawnTimer = 0;
let screenShake = 0;
let skylineDrift = 0;
let lastDamageSfxAt = 0;
let lowHealthWarningPlayed = false;
let gifTimers = { impact: 0, fail: 0 };

// Input / Tilt Data
let tiltActive = false;
let tiltX = 0, tiltY = 0;
let targetX = 0, targetY = 0;
let tiltPermissionRequested = false;

// --- Audio System ---
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
}

function unlockAudio() {
  if (audioUnlocked) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
}

function configureAudioElement(element, volume) {
  if (!element) return;
  element.volume = volume;
  element.crossOrigin = 'anonymous';
  element.playsInline = true;
}

function stopAudio(element) {
  if (!element) return;
  try {
    element.pause();
    element.currentTime = 0;
  } catch (e) {}
}

function playAudioElement(id, { volume, restart = true } = {}) {
  if (!audioUnlocked) return;
  const element = document.getElementById(id);
  if (!element) return;
  try {
    if (typeof volume === 'number') element.volume = volume;
    if (restart) element.currentTime = 0;
    element.play().catch(() => {});
  } catch (e) {}
}

function playSfx(type) {
  if (type === 'kill') {
    playAudioElement('sfx_enemy_defeat', { volume: 0.5 });
  } else if (type === 'blocked') {
    playAudioElement('sfx_blocked', { volume: 0.36 });
  } else if (type === 'damage') {
    playAudioElement('sfx_damage', { volume: 0.42 });
  } else if (type === 'warning') {
    playAudioElement('sfx_warning', { volume: 0.32 });
  } else if (type === 'restart') {
    playAudioElement('sfx_restart', { volume: 0.4 });
  } else if (type === 'gameover') {
    playAudioElement('sfx_game_over', { volume: 0.42 });
  }
}

function startLoop(element, volume) {
  if (!audioUnlocked || !element) return;
  try {
    element.volume = volume;
    element.play().catch(() => {});
  } catch (e) {}
}

function updateFeedbackGifs() {
  gifTimers.impact = Math.max(0, gifTimers.impact - 1);
  gifTimers.fail = Math.max(0, gifTimers.fail - 1);

  if (gifTimers.impact > 0) {
    impactGif.classList.remove('hidden');
    impactGif.classList.add('visible');
  } else {
    impactGif.classList.remove('visible');
    impactGif.classList.add('hidden');
  }

  if (gifTimers.fail > 0) {
    failGif.classList.remove('hidden');
    failGif.classList.add('visible');
  } else {
    failGif.classList.remove('visible');
    failGif.classList.add('hidden');
  }
}

function showGif(type, frames = 42) {
  if (type === 'impact') {
    gifTimers.impact = Math.max(gifTimers.impact, frames);
  } else if (type === 'fail') {
    gifTimers.fail = Math.max(gifTimers.fail, frames);
  }
  updateFeedbackGifs();
}

function vibrate(style = 'light') {
  try {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
      action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
      params: { style }
    });
  } catch (e) {}
}

// --- Core Systems ---
function setState(newState) {
  gameState = newState;
  if (newState === 'PLAYING') {
    uiHud.classList.remove('hidden');
    uiGameOver.classList.add('hidden');
    gifTimers.fail = 0;
    updateFeedbackGifs();
    stopAudio(bgmDefeat);
    bgmGame.currentTime = 0;
    startLoop(bgmGame, 0.2);
  } else if (newState === 'GAMEOVER') {
    uiHud.classList.add('hidden');
    uiGameOver.classList.remove('hidden');
    stopAudio(bgmGame);
    showGif('fail', 180);
    playSfx('gameover');
    bgmDefeat.currentTime = 0;
    startLoop(bgmDefeat, 0.2);
  }
}

function requestTilt() {
  if (tiltPermissionRequested) return;
  tiltPermissionRequested = true;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(permissionState => {
      if (permissionState === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
  }
}

function handleOrientation(e) {
  if (e.gamma !== null && e.beta !== null) {
    tiltActive = true;
    let g = e.gamma;
    let b = e.beta;
    // clamp and normalize
    g = Math.max(-45, Math.min(45, g));
    b = Math.max(-45, Math.min(45, b - 45)); // offset for holding angle
    tiltX = g / 45;
    tiltY = b / 45;
  }
}

function handleGlobalInput(e) {
  unlockAudio();
  requestTilt();

  if (gameState === 'GAMEOVER') {
    if (e.target.id === 'restart-btn') {
      playSfx('restart');
      restartGame();
    }
    return;
  }

  if (gameState === 'PLAYING') {
    if (e.target.id === 'kill-btn' || e.target.closest('#kill-btn')) {
      executeKill();
      e.preventDefault();
    } else {
      // Fallback touch movement
      tiltActive = false;
      const rect = canvas.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    }
  }
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', (e) => {
  if (gameState === 'PLAYING' && !tiltActive) {
    const rect = canvas.getBoundingClientRect();
    targetX = e.clientX - rect.left;
    targetY = e.clientY - rect.top;
  }
}, { passive: false });

function executeKill() {
  if (enemies.length === 0) {
    playSfx('blocked');
    showGif('fail', 28);
    return;
  }

  // Find nearest enemy
  let nearest = null;
  let minDist = Infinity;
  let nIdx = -1;

  for (let i = 0; i < enemies.length; i++) {
    let dx = enemies[i].x - player.x;
    let dy = enemies[i].y - player.y;
    let dist = dx * dx + dy * dy;
    if (dist < minDist) {
      minDist = dist;
      nearest = enemies[i];
      nIdx = i;
    }
  }

  if (nearest) {
    // Spawn particles
    for (let p = 0; p < 15; p++) {
      particles.push({
        x: nearest.x, y: nearest.y,
        vx: (Math.random() - 0.5) * 400,
        vy: (Math.random() - 0.5) * 400,
        life: 1.0, size: Math.random() * 15 + 5
      });
    }
    enemies.splice(nIdx, 1);
    playSfx('kill');
    showGif('impact', 34);
    vibrate('medium');
    screenShake = 10;
  }
}

function spawnEnemy() {
  let angle = Math.random() * Math.PI * 2;
  let dist = Math.max(cw, ch) * 0.7;
  enemies.push({
    x: player.x + Math.cos(angle) * dist,
    y: player.y + Math.sin(angle) * dist,
    r: 20
  });
}

function initGame() {
  player.x = cw / 2;
  player.y = ch / 2;
  targetX = player.x;
  targetY = player.y;
  health = gameConfig.maxHealth;
  enemies = [];
  particles = [];
  screenShake = 0;
  enemySpawnTimer = 0;
  lastDamageSfxAt = 0;
  lowHealthWarningPlayed = false;
  gifTimers = { impact: 0, fail: 0 };
  updateFeedbackGifs();
  healthFill.style.transform = 'scaleX(1)';
  setState('PLAYING');
}

function restartGame() {
  initGame();
}

// --- Resize Handling ---
const ro = new ResizeObserver(entries => {
  for (let entry of entries) {
    const cr = entry.contentRect;
    cw = cr.width;
    ch = cr.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!initialized) {
      initGame();
      initialized = true;
      requestAnimationFrame(loop);
    } else {
      player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
      player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
    }
  }
});

// --- Game Loop ---
function update(dt) {
  skylineDrift += dt * 16;

  // Player movement
  let speedMult = gameConfig.heroSpeed * 60;
  if (tiltActive) {
    player.vx = tiltX * speedMult;
    player.vy = tiltY * speedMult;
  } else {
    let dx = targetX - player.x;
    let dy = targetY - player.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      player.vx = (dx / dist) * speedMult;
      player.vy = (dy / dist) * speedMult;
    } else {
      player.vx = 0;
      player.vy = 0;
    }
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Clamp & finite check
  if (!isFinite(player.x)) player.x = cw / 2;
  if (!isFinite(player.y)) player.y = ch / 2;
  player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
  player.y = Math.max(player.r, Math.min(ch - player.r, player.y));

  if (player.flash > 0) player.flash -= dt;
  if (screenShake > 0) screenShake -= dt * 30;

  // Enemies
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    enemySpawnTimer = Math.max(0.3, 1.2 - (gameConfig.maxHealth - health) * 0.005);
  }

  let isHit = false;
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0) {
      e.x += (dx / dist) * gameConfig.enemySpeed * dt;
      e.y += (dy / dist) * gameConfig.enemySpeed * dt;
    }

    // Collision
    if (dist < player.r + e.r) {
      health -= 30 * dt;
      isHit = true;
      player.flash = 0.1;
      // push enemy back slightly
      e.x -= (dx / dist) * 50 * dt;
      e.y -= (dy / dist) * 50 * dt;
    }
  }

  if (isHit) {
    const now = performance.now();
    if (now - lastDamageSfxAt > 350) {
      playSfx('damage');
      lastDamageSfxAt = now;
    }
    if (Math.random() < 0.04) vibrate('light');
    showGif('fail', 18);
    screenShake = Math.max(screenShake, 3);
  }

  const healthRatio = Math.max(0, health / gameConfig.maxHealth);
  if (healthRatio <= 0.35 && !lowHealthWarningPlayed) {
    playSfx('warning');
    lowHealthWarningPlayed = true;
  } else if (healthRatio > 0.45) {
    lowHealthWarningPlayed = false;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Health update
  healthFill.style.transform = `scaleX(${healthRatio})`;
  updateFeedbackGifs();
  if (health <= 0) {
    vibrate('heavy');
    setState('GAMEOVER');
  }
}

function draw() {
  const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
  skyGradient.addColorStop(0, '#7c5cff');
  skyGradient.addColorStop(0.45, '#4f46e5');
  skyGradient.addColorStop(1, '#22114f');
  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, cw, ch);

  const moonX = cw * 0.8;
  const moonY = Math.max(82, ch * 0.18);
  const moonGlow = ctx.createRadialGradient(moonX, moonY, 8, moonX, moonY, 110);
  moonGlow.addColorStop(0, 'rgba(255,245,186,0.95)');
  moonGlow.addColorStop(0.35, 'rgba(255,213,79,0.35)');
  moonGlow.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(moonX - 110, moonY - 110, 220, 220);

  ctx.fillStyle = '#ffe58f';
  ctx.beginPath();
  ctx.arc(moonX, moonY, 34, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  const horizon = ch * 0.76;
  const stripeOffset = (skylineDrift * 10 + player.x * 0.08) % 120;
  ctx.globalAlpha = 0.16;
  for (let i = -1; i < 10; i++) {
    const baseX = i * 120 - stripeOffset;
    ctx.fillStyle = i % 2 === 0 ? '#41f2ff' : '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(baseX, horizon);
    ctx.lineTo(baseX + 70, horizon - 120);
    ctx.lineTo(baseX + 140, horizon);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const layers = [
    { color: '#1d0d45', height: 0.22, shift: 0.12, width: 46 },
    { color: '#2d1663', height: 0.28, shift: 0.2, width: 58 },
    { color: '#43218b', height: 0.34, shift: 0.28, width: 72 }
  ];

  layers.forEach((layer, index) => {
    const layerOffset = (player.x * layer.shift + skylineDrift * (6 + index * 4)) % (layer.width * 2);
    ctx.fillStyle = layer.color;
    for (let x = -layer.width * 2; x < cw + layer.width * 3; x += layer.width) {
      const bx = x - layerOffset;
      const buildingHeight = ch * layer.height + ((x / layer.width) % 3) * 18 + index * 12;
      ctx.fillRect(bx, ch - buildingHeight, layer.width - 6, buildingHeight);
      ctx.fillStyle = 'rgba(255, 245, 186, 0.22)';
      for (let wy = ch - buildingHeight + 14; wy < ch - 20; wy += 18) {
        ctx.fillRect(bx + 8, wy, 6, 8);
        if (layer.width > 52) ctx.fillRect(bx + 24, wy, 6, 8);
      }
      ctx.fillStyle = layer.color;
    }
  });

  const gridOffsetX = (player.x * 0.14) % 42;
  const gridOffsetY = (player.y * 0.08 + skylineDrift * 6) % 42;
  ctx.strokeStyle = 'rgba(185, 243, 255, 0.18)';
  ctx.lineWidth = 1;
  for (let x = -42; x < cw + 42; x += 42) {
    ctx.beginPath();
    ctx.moveTo(x - gridOffsetX, horizon - 8);
    ctx.lineTo(x - gridOffsetX, ch);
    ctx.stroke();
  }
  for (let y = horizon; y < ch + 42; y += 42) {
    ctx.beginPath();
    ctx.moveTo(0, y - gridOffsetY);
    ctx.lineTo(cw, y - gridOffsetY);
    ctx.stroke();
  }

  // Particles
  for (let p of particles) {
    ctx.fillStyle = `rgba(255, 213, 79, ${p.life})`;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }

  // Enemies
  for (let e of enemies) {
    const enemyGradient = ctx.createLinearGradient(e.x, e.y - e.r, e.x, e.y + e.r);
    enemyGradient.addColorStop(0, '#ffb15c');
    enemyGradient.addColorStop(1, '#ff4d6d');
    ctx.fillStyle = enemyGradient;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#130a2c';
    ctx.beginPath();
    ctx.roundRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2, 8);
    ctx.fill();
    ctx.stroke();

    // Enemy face
    ctx.fillStyle = '#130a2c';
    ctx.fillRect(e.x - 8, e.y - 5, 4, 4);
    ctx.fillRect(e.x + 4, e.y - 5, 4, 4);
    ctx.fillRect(e.x - 6, e.y + 5, 12, 3);
    ctx.fillStyle = '#ffe58f';
    ctx.fillRect(e.x - 2, e.y + 13, 4, 4);
  }

  // Player
  ctx.save();
  ctx.translate(player.x, player.y);

  // Shadow
  ctx.fillStyle = 'rgba(19,10,44,0.4)';
  ctx.beginPath();
  ctx.ellipse(8, player.r + 10, player.r * 0.9, player.r * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(65, 242, 255, 0.2)';
  ctx.beginPath();
  ctx.arc(0, 0, player.r + 10 + Math.sin(skylineDrift * 0.5) * 2, 0, Math.PI * 2);
  ctx.fill();

  // Sprite clipping
  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();

  ctx.fillStyle = '#FFF';
  ctx.fill();

  if (assetPlayer.complete && assetPlayer.naturalWidth > 0) {
    let scale = Math.max((player.r * 2.1) / assetPlayer.naturalWidth, (player.r * 2.1) / assetPlayer.naturalHeight);
    let w = assetPlayer.naturalWidth * scale;
    let h = assetPlayer.naturalHeight * scale;
    ctx.drawImage(assetPlayer, -w / 2, -h / 2 - 2, w, h);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.arc(-10, -14, 11, 0, Math.PI * 2);
  ctx.fill();

  if (player.flash > 0) {
    ctx.fillStyle = 'rgba(255,90,106,0.42)';
    ctx.fill();
  }

  ctx.restore();

  ctx.lineWidth = 5;
  ctx.strokeStyle = '#130a2c';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 3;
  ctx.strokeStyle = '#41f2ff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function loop(timestamp) {
  requestAnimationFrame(loop);
  try {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    if (gameState === 'PLAYING') {
      update(dt);
    } else {
      updateFeedbackGifs();
    }
    draw();
  } catch (e) {
    console.error('Loop error:', e);
  }
}

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
  configureAudioElement(bgmGame, 0.2);
  configureAudioElement(bgmDefeat, 0.2);
  configureAudioElement(document.getElementById('sfx_enemy_defeat'), 0.5);
  configureAudioElement(document.getElementById('sfx_blocked'), 0.36);
  configureAudioElement(document.getElementById('sfx_damage'), 0.42);
  configureAudioElement(document.getElementById('sfx_warning'), 0.32);
  configureAudioElement(document.getElementById('sfx_restart'), 0.4);
  configureAudioElement(document.getElementById('sfx_game_over'), 0.42);
  ro.observe(canvas);
});
</script>
