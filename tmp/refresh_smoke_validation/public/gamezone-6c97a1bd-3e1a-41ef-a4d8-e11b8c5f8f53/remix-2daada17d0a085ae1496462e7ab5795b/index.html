<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Midnight Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-night: #04030b;
        --bg-deep: #120a25;
        --panel: rgba(12, 11, 28, 0.82);
        --panel-strong: rgba(18, 16, 38, 0.92);
        --line: rgba(106, 244, 255, 0.38);
        --line-strong: rgba(255, 80, 195, 0.68);
        --glow-cyan: #6af4ff;
        --glow-pink: #ff50c3;
        --text-main: #eff6ff;
        --text-muted: #b6bdd8;
        --text-soft: rgba(239, 246, 255, 0.8);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(106, 244, 255, 0.08), transparent 28%),
            radial-gradient(circle at 85% 18%, rgba(255, 80, 195, 0.12), transparent 25%),
            linear-gradient(180deg, #050510 0%, #090814 35%, #140b2a 100%);
        color: var(--text-main);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }

    body::before {
        background:
            radial-gradient(circle at 50% 60%, rgba(106, 244, 255, 0.12), transparent 32%),
            linear-gradient(180deg, rgba(255,255,255,0.02), transparent 35%);
    }

    body::after {
        opacity: 0.45;
        background-image:
            linear-gradient(rgba(106, 244, 255, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(106, 244, 255, 0.04) 1px, transparent 1px);
        background-size: 100% 42px, 42px 100%;
        mix-blend-mode: screen;
    }

    canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 0; }
    .relative { position: relative; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .overflow-hidden { overflow: hidden; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .flex-1 { flex: 1; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-sm { font-size: 0.9rem; }
    .text-xs { font-size: 0.78rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .animate-pulse { animation: pulse 2s infinite; }
    .text-muted { color: var(--text-muted); }
    .text-dim { color: rgba(196, 205, 235, 0.72); }
    .text-soft { color: var(--text-soft); }
    .actions-stack { display: flex; flex-direction: column; gap: 1rem; width: 100%; align-items: center; }

    #game-container {
        background:
            radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 42%),
            linear-gradient(180deg, rgba(4,3,11,0.2), rgba(4,3,11,0.74));
        isolation: isolate;
    }

    /* UI Layers */
    #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Text Box */
    .dialogue-box {
        background:
            linear-gradient(180deg, rgba(18, 16, 38, 0.94), rgba(8, 8, 20, 0.95)),
            rgba(0, 0, 0, 0.85);
        border-top: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 -12px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(106, 244, 255, 0.16);
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 8px));
        min-height: 200px;
        pointer-events: auto;
        backdrop-filter: blur(12px);
        transition: opacity 0.3s;
        position: relative;
        overflow: hidden;
    }

    .dialogue-box::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, var(--glow-cyan), var(--glow-pink), var(--glow-cyan));
        opacity: 0.95;
    }

    /* Choices */
    .choice-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
        pointer-events: auto;
        width: 100%;
        padding: 0 10px;
    }

    .choice-btn {
        background:
            linear-gradient(180deg, rgba(25, 29, 56, 0.96), rgba(14, 15, 33, 0.96));
        border: 1px solid rgba(106, 244, 255, 0.24);
        color: var(--text-main);
        padding: 14px 18px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        font-size: 1rem;
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease, filter 0.18s ease;
        box-shadow: 0 8px 18px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-radius: 16px;
        position: relative;
        overflow: hidden;
    }

    .choice-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
    }

    .choice-btn:active { transform: scale(0.98); filter: brightness(1.08); }
    .choice-btn:hover { border-color: var(--line-strong); color: #fff; box-shadow: 0 0 0 1px rgba(255,80,195,0.16), 0 10px 22px rgba(0,0,0,0.32), 0 0 22px rgba(255,80,195,0.12); }
    .choice-btn:hover::before { transform: translateX(100%); }

    /* Screens */
    .screen {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 22%, rgba(106, 244, 255, 0.12), transparent 28%),
            linear-gradient(180deg, rgba(5, 5, 16, 0.92), rgba(5, 5, 16, 0.98));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        pointer-events: auto;
        transition: opacity 0.5s;
        padding: 20px;
    }

    .screen::before {
        content: "";
        position: absolute;
        width: min(76vw, 420px);
        aspect-ratio: 1 / 1.22;
        border-radius: 28px;
        border: 1px solid rgba(106, 244, 255, 0.18);
        background:
            radial-gradient(circle at 50% 20%, rgba(106,244,255,0.14), transparent 34%),
            linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
        box-shadow: 0 0 40px rgba(106,244,255,0.08), inset 0 0 40px rgba(255,80,195,0.08);
        z-index: -1;
    }

    .hidden { opacity: 0; pointer-events: none; }
    .pulse { animation: pulse 2s infinite; }
    .screen-kicker { margin-bottom: 2rem; max-width: 26rem; text-shadow: 0 0 18px rgba(0,0,0,0.35); }

    .feedback-gif {
        position: absolute;
        right: 16px;
        width: clamp(78px, 18vw, 130px);
        border-radius: 18px;
        border: 1px solid rgba(106, 244, 255, 0.25);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 0.28s ease, transform 0.28s ease;
        z-index: 12;
        pointer-events: none;
        object-fit: cover;
        background: rgba(4, 3, 11, 0.8);
    }

    .feedback-gif.visible {
        opacity: 0.88;
        transform: translateY(0) scale(1);
    }

    #affection-gif {
        top: 82px;
        aspect-ratio: 1 / 1;
    }

    #ending-gif {
        bottom: calc(226px + env(safe-area-inset-bottom, 8px));
        aspect-ratio: 1 / 1;
    }

    .signal-pill {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 12;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(106, 244, 255, 0.22);
        background: rgba(8, 10, 22, 0.74);
        color: var(--text-soft);
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(10px);
        pointer-events: none;
    }

    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    /* Typography */
    h1 {
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: clamp(2.35rem, 7vw, 3.1rem);
        color: #f3f6ff;
        text-shadow: 0 0 12px rgba(106, 244, 255, 0.35), 0 0 28px rgba(255, 80, 195, 0.28);
        margin-bottom: 0.6rem;
        text-align: center;
        line-height: 1.05;
        letter-spacing: 0.08em;
    }

    p { font-size: 1.05rem; line-height: 1.55; }
    .name-tag {
        color: var(--glow-cyan);
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 1.05rem;
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    #dialogue-text {
        font-size: 1.08rem;
        line-height: 1.5;
        color: #f6f9ff;
    }

    /* CRT Scanline Effect */
    .scanlines {
        position: fixed; inset: 0; z-index: 99; pointer-events: none;
        background:
            linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.12) 50%, rgba(0,0,0,0.12)),
            linear-gradient(90deg, rgba(106,244,255,0.03), rgba(255,80,195,0.03));
        background-size: 100% 4px, 100% 100%;
        opacity: 0.5;
    }

    /* Language Buttons */
    .lang-row { display: flex; gap: 15px; margin-top: 30px; width: 100%; justify-content: center; }
    .lang-btn { flex: 1; max-width: 220px; }

    @media (max-width: 640px) {
        .dialogue-box {
            min-height: 176px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .choice-container {
            gap: 10px;
            padding: 0 8px;
        }

        .choice-btn {
            max-width: none;
            font-size: 0.96rem;
            padding: 13px 15px;
            border-radius: 14px;
        }

        p,
        #dialogue-text {
            font-size: 1rem;
        }

        .screen-kicker {
            max-width: 21rem;
            margin-bottom: 1.6rem;
        }

        .feedback-gif {
            right: 10px;
            width: 82px;
        }

        #ending-gif {
            bottom: calc(212px + env(safe-area-inset-bottom, 8px));
        }

        .signal-pill {
            font-size: 0.62rem;
            top: 10px;
            right: 10px;
        }
    }
</style>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "textSpeed": { "type": "number", "label": "Text Speed (ms)", "value": 30, "min": 10, "max": 100 },
    "bgmVolume": { "type": "number", "label": "Music Volume", "value": 0.2, "min": 0, "max": 1 }
}
</script>

</head>
<body>

<!-- Assets -->
<img id="asset_girl" data-editable="image" data-label="Signal Contact" src="https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png" hidden>
<!-- [agent-note][stage3] resolved-audio: start/ui/good/bad/endings -> catalogs/audios.json -->
<!-- [agent-note][stage3] resolved-gif: affection/end-state feedback -> catalogs/gifs.json -->
<!-- [agent-note][stage4] resolved-font: title=Orbitron ui/body=Rajdhani -> catalogs/fonts.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Midnight Ambience" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_good" data-editable="audio" data-label="SFX Good Choice" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
<audio id="sfx_bad" data-editable="audio" data-label="SFX Bad Choice" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX Start Game" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>
<audio id="sfx_continue" data-editable="audio" data-label="SFX Continue Tap" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_end_good" data-editable="audio" data-label="SFX Good Ending" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>
<audio id="sfx_end_bad" data-editable="audio" data-label="SFX Bad Ending" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>

<!-- Game Structure -->
<div id="game-container" class="relative w-full h-full overflow-hidden select-none">
    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>
    <div class="signal-aura" aria-hidden="true"></div>
    <div class="signal-pill" id="signal-status">CHANNEL // STANDBY</div>
    <img id="affection-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="" aria-hidden="true">
    <img id="ending-gif" class="feedback-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="" aria-hidden="true">
    
    <div id="ui-layer">
        <!-- Top Spacer -->
        <div class="flex-1"></div>
        
        <!-- Choices Area -->
        <div id="choices-area" class="choice-container hidden"></div>
        
        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-box hidden">
            <div id="speaker-name" class="name-tag">???</div>
            <div id="dialogue-text"></div>
            <div id="tap-hint" class="text-right text-xs text-dim mt-2 animate-pulse">▼ Tap to continue</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>MIDNIGHT<br>SIGNAL</h1>
        <p class="mb-8 text-muted text-center text-sm screen-kicker">Slip into a neon-noir channel, answer the midnight call, and shape the mood of a stranger before the static swallows the line.</p>
        
        <div class="lang-row">
            <button id="btn-lang-en" class="choice-btn lang-btn">BEGIN TRANSMISSION</button>
        </div>
        <!-- [agent-note][stage1] role: future-audio | trigger: start-screen | intent: reinforce the mysterious incoming-signal vibe -->
    </div>

    <!-- Ending Screen -->
    <div id="end-screen" class="screen hidden">
        <h1 id="end-title" style="font-size: 1.8rem;">ENDING</h1>
        <p id="end-desc" class="mb-8 text-center px-4 text-soft text-sm"></p>
        <div class="actions-stack">
            <button id="restart-btn" class="choice-btn">TRY AGAIN</button>
            <button id="menu-btn" class="choice-btn" style="border-color: #333; color: #888;">MENU</button>
        </div>
    </div>
</div>

<script>
/**
 * § Localization Data
 */
const UI_TEXT = {
    en: {
        tapHint: "▼ Tap to continue",
        restart: "RECONNECT",
        menu: "MAIN MENU",
        speakerUnknown: "???",
        speakerHer: "Signal",
        speakerNarrator: "System"
    }
};

const SCRIPTS = {
    en: {
        'start': {
            speaker: "Narrator",
            text: "A scrambled transmission cuts through the midnight static. A lone contact appears on your screen, waiting to see what kind of voice answered.",
            next: 'meet_her'
        },
        'meet_her': {
            speaker: "Her",
            text: "So you picked up. I was about to drop this channel.",
            choices: [
                { text: "Sorry. The signal took a minute to lock.", next: 'excuse', score: 0 },
                { text: "I wasn't going to miss a mystery call.", next: 'flirt', score: 10 },
                { text: "I'm here now. Start talking.", next: 'cold', score: -10 }
            ]
        },
        'excuse': {
            speaker: "Her",
            text: "Convenient excuse. Midnight channels don't wait for anyone.",
            next: 'q_hobby'
        },
        'flirt': {
            speaker: "Her",
            text: "Confident. Just don't mistake curiosity for trust.",
            next: 'q_hobby'
        },
        'cold': {
            speaker: "Her",
            text: "Sharp tone. You can still disconnect if that's all you've got.",
            next: 'q_hobby'
        },
        'q_hobby': {
            speaker: "Her",
            text: "Your profile ping says you like 'chasing the unknown.' What does that mean when the dark answers back?",
            choices: [
                { text: "It means I follow strange signals to their source.", next: 'secrets', score: 10 },
                { text: "It sounded dramatic, so I kept it.", next: 'honest', score: 5 },
                { text: "It means you ask too many questions.", next: 'rude', score: -20 }
            ]
        },
        'secrets': {
            speaker: "Her",
            text: "Good answer. This city leaks hidden frequencies if you know where to listen.",
            next: 'deep_talk'
        },
        'honest': {
            speaker: "Her",
            text: "Honesty on an anonymous line? That's rarer than charm.",
            next: 'deep_talk'
        },
        'rude': {
            speaker: "Her",
            text: "Noted. This connection is already cooling off.",
            next: 'end_check'
        },
        'deep_talk': {
            speaker: "Her",
            text: "Sometimes it feels like the whole grid is a cage made of noise. Do you ever feel trapped inside the feed?",
            choices: [
                { text: "All the time. That's why I answered.", next: 'connect', score: 15 },
                { text: "No. Noise is just noise unless you let it own you.", next: 'pragmatic', score: -5 },
                { text: "Are all your calls this melodramatic?", next: 'mock', score: -15 }
            ]
        },
        'connect': {
            speaker: "Her",
            text: "I thought so. You sound tired in the same way this city does.",
            next: 'end_check'
        },
        'pragmatic': {
            speaker: "Her",
            text: "You make detachment sound easy. I don't buy it.",
            next: 'end_check'
        },
        'mock': {
            speaker: "Her",
            text: "Then you were never hearing me in the first place.",
            next: 'end_check'
        },
        'end_check': {
            speaker: "Narrator",
            text: "The channel hums. Static swells between you while the contact decides whether to stay.",
            action: (s) => {
                if (s.affection >= 75) return 'end_good_1';
                if (s.affection >= 40) return 'end_good_2';
                if (s.affection >= 10) return 'end_bad_1';
                return 'end_bad_2';
            }
        },
        'end_good_1': {
            ending: true,
            title: "ENDING 1/4: OPEN CHANNEL",
            desc: "Her voice softens. 'Keep this frequency. I'll send coordinates where the skyline goes quiet.' The line holds, and for once the night feels shared."
        },
        'end_good_2': {
            ending: true,
            title: "ENDING 2/4: SIGNAL KEPT",
            desc: "'Interesting contact,' she says. 'Maybe we try this again on a clearer night.' The call ends without warmth, but not without promise."
        },
        'end_bad_1': {
            ending: true,
            title: "ENDING 3/4: SIGNAL LOST",
            desc: "'This isn't the voice I was looking for,' she says. The channel clicks dead before you can recover the moment."
        },
        'end_bad_2': {
            ending: true,
            title: "ENDING 4/4: DEAD AIR",
            desc: "Only cold static remains. Whatever trust the midnight signal offered is gone, leaving you alone with the hiss."
        }
    }
};

/**
 * § Engine Core
 */
const CONFIG = {
    width: 0,
    height: 0,
    dpr: 1
};

// State
let state = {
    lang: 'en',
    node: 'start',
    affection: 50, // 0-100
    typing: false,
    textQueue: '',
    textIndex: 0,
    timer: 0
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const uiDialogue = document.getElementById('dialogue-box');
const uiText = document.getElementById('dialogue-text');
const uiSpeaker = document.getElementById('speaker-name');
const uiChoices = document.getElementById('choices-area');
const uiTapHint = document.getElementById('tap-hint');
const uiRestartBtn = document.getElementById('restart-btn');
const uiMenuBtn = document.getElementById('menu-btn');

// Config Access
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});
window.updateGameConfig = (k, v) => {
    if(window.gameConfig.hasOwnProperty(k)) window.gameConfig[k] = v;
    if(k === 'bgmVolume') setBgmVolume(v);
};

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    good: document.getElementById('sfx_good'),
    bad: document.getElementById('sfx_bad'),
    start: document.getElementById('sfx_start'),
    continue: document.getElementById('sfx_continue'),
    endGood: document.getElementById('sfx_end_good'),
    endBad: document.getElementById('sfx_end_bad')
};

const uiSignalStatus = document.getElementById('signal-status');
const affectionGif = document.getElementById('affection-gif');
const endingGif = document.getElementById('ending-gif');
let audioReady = false;
let activeGifTimer = null;

function initAudio() {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioReady = true;
    const bgm = sounds.bgm;
    if (bgm) {
        bgm.volume = Math.max(0, Math.min(1, window.gameConfig.bgmVolume));
        if (bgm.paused) {
            bgm.play().catch(() => {});
        }
    }
}

function stopBgm() {
    if (sounds.bgm && !sounds.bgm.paused) {
        sounds.bgm.pause();
        sounds.bgm.currentTime = 0;
    }
}

function setBgmVolume(v) {
    if (sounds.bgm) sounds.bgm.volume = v;
}

function playSfx(type) {
    const map = {
        good: { el: sounds.good, volume: 0.54 },
        bad: { el: sounds.bad, volume: 0.58 },
        start: { el: sounds.start, volume: 0.5 },
        continue: { el: sounds.continue, volume: 0.34 },
        endGood: { el: sounds.endGood, volume: 0.6 },
        endBad: { el: sounds.endBad, volume: 0.6 }
    };
    const selected = map[type] || map.continue;
    const sfx = selected.el;
    if (sfx) {
        sfx.pause();
        sfx.currentTime = 0;
        sfx.volume = selected.volume;
        sfx.play().catch(() => {});
    } else if (audioReady) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type === 'bad' || type === 'endBad' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(type === 'bad' || type === 'endBad' ? 150 : 800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(type === 'bad' || type === 'endBad' ? 50 : 1200, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
    }
}

function flashGif(kind, duration = 1700) {
    const target = kind === 'good' ? affectionGif : endingGif;
    if (!target) return;
    clearTimeout(activeGifTimer);
    affectionGif.classList.remove('visible');
    endingGif.classList.remove('visible');
    target.classList.add('visible');
    activeGifTimer = setTimeout(() => {
        target.classList.remove('visible');
    }, duration);
}

function updateSignalStatus(label) {
    if (uiSignalStatus) uiSignalStatus.textContent = label;
}

/**
 * § Visual System
 */
const particles = [];

function initParticles() {
    particles.length = 0;
    for(let i=0; i<30; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 4 + 1,
            speed: Math.random() * 0.5 + 0.1,
            color: Math.random() > 0.5 ? '#b026ff' : '#00f3ff',
            alpha: Math.random()
        });
    }
}

function drawBackground(dt) {
    // Dark Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#020205');
    grad.addColorStop(1, '#1a0b2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Bokeh Particles
    particles.forEach(p => {
        p.y -= p.speed * (dt/16);
        if (p.y < -10) {
            p.y = canvas.height + 10;
            p.x = Math.random() * canvas.width;
        }
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha * 0.4;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

 function drawCharacter(dt) {
     const img = document.getElementById('asset_girl');
     if (!img || !img.complete) return;

     // Breathe effect
     state.timer += dt * 0.002;
     const breathe = Math.sin(state.timer) * 5;

     // Aspect Ratio Fit
     const scale = Math.min(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight) * 1.2;
     const w = img.naturalWidth * scale;
     const h = img.naturalHeight * scale;
     const x = (canvas.width - w) / 2;
     const y = (canvas.height - h) + 50 + breathe; // Anchor bottom
     const frameX = canvas.width * 0.5;
     const frameY = canvas.height * 0.45;
     const frameW = Math.min(canvas.width * 0.68, 360);
     const frameH = Math.min(canvas.height * 0.72, 540);

     ctx.save();

     const halo = ctx.createRadialGradient(frameX, frameY, frameW * 0.08, frameX, frameY, frameW * 0.85);
     halo.addColorStop(0, 'rgba(106,244,255,0.22)');
     halo.addColorStop(0.55, 'rgba(255,80,195,0.12)');
     halo.addColorStop(1, 'rgba(0,0,0,0)');
     ctx.fillStyle = halo;
     ctx.beginPath();
     ctx.arc(frameX, frameY, frameW * 0.85, 0, Math.PI * 2);
     ctx.fill();

     ctx.strokeStyle = 'rgba(106,244,255,0.18)';
     ctx.lineWidth = 2;
     roundRectPath(frameX - frameW / 2, frameY - frameH / 2, frameW, frameH, 28);
     ctx.stroke();

     ctx.strokeStyle = 'rgba(255,80,195,0.24)';
     ctx.lineWidth = 1;
     roundRectPath(frameX - frameW / 2 + 10, frameY - frameH / 2 + 10, frameW - 20, frameH - 20, 22);
     ctx.stroke();

     ctx.shadowColor = 'rgba(106,244,255,0.34)';
     ctx.shadowBlur = 24;
     ctx.drawImage(img, x, y, w, h);
     ctx.shadowBlur = 0;

     // Darken overlay for mood
     ctx.fillStyle = 'rgba(0,0,0,0.2)';
     ctx.fillRect(0,0,canvas.width, canvas.height);
     ctx.restore();
 }

 function roundRectPath(x, y, w, h, r) {
     ctx.beginPath();
     ctx.moveTo(x + r, y);
     ctx.lineTo(x + w - r, y);
     ctx.quadraticCurveTo(x + w, y, x + w, y + r);
     ctx.lineTo(x + w, y + h - r);
     ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
     ctx.lineTo(x + r, y + h);
     ctx.quadraticCurveTo(x, y + h, x, y + h - r);
     ctx.lineTo(x, y + r);
     ctx.quadraticCurveTo(x, y, x + r, y);
     ctx.closePath();
 }

 function render(time) {
    requestAnimationFrame(render);
    
    // Resize check
    const rect = canvas.getBoundingClientRect();
    if (canvas.width !== rect.width || canvas.height !== rect.height) {
        canvas.width = rect.width;
        canvas.height = rect.height;
        initParticles(); 
    }

    const dt = time - (state.lastTime || time);
    state.lastTime = time;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawBackground(dt);
    drawCharacter(dt);
    
    // Typewriter Logic
    if (state.typing) {
        const speed = window.gameConfig.textSpeed || 30;
        const charsPerFrame = dt / speed;
        if (charsPerFrame > 0) {
            state.textIndex += charsPerFrame;
            const currentText = state.textQueue.substring(0, Math.floor(state.textIndex));
            uiText.innerText = currentText;
            
            if (state.textIndex >= state.textQueue.length) {
                state.typing = false;
                showChoices();
            }
        }
    }
}

/**
 * § Game Logic
 */
function startGame(lang) {
    state.lang = lang;
    
    // Update UI static text
    uiTapHint.innerText = UI_TEXT[lang].tapHint;
    uiRestartBtn.innerText = UI_TEXT[lang].restart;
    uiMenuBtn.innerText = UI_TEXT[lang].menu;

    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    uiDialogue.classList.remove('hidden');
    state.affection = 50;
    updateSignalStatus('CHANNEL // LIVE');
    initAudio();
    playSfx('start');
    loadNode('start');
}

function loadNode(nodeId) {
    const script = SCRIPTS[state.lang];
    const node = script[nodeId];
    if (!node) return;

    // Handle dynamic next node (shared logic, but checks state)
    if (node.action) {
        const nextId = node.action(state);
        loadNode(nextId);
        return;
    }

    // Handle Endings
    if (node.ending) {
        showEnding(node);
        return;
    }

    state.node = nodeId;
    
    // Map speaker name
    let speakerDisplay = node.speaker;
    if (node.speaker === 'Her') speakerDisplay = UI_TEXT[state.lang].speakerHer;
    else if (node.speaker === 'Narrator') speakerDisplay = UI_TEXT[state.lang].speakerNarrator;
    
    uiSpeaker.innerText = speakerDisplay;
    uiSpeaker.style.color = node.speaker === 'Her' ? '#ff7cd6' : '#6af4ff';
    updateSignalStatus(node.speaker === 'Her' ? 'CHANNEL // SIGNAL LOCKED' : 'CHANNEL // STATIC READ');
    
    // Start typing
    state.textQueue = node.text;
    state.textIndex = 0;
    state.typing = true;
    uiChoices.innerHTML = '';
    uiChoices.classList.add('hidden');
}

function showChoices() {
    const node = SCRIPTS[state.lang][state.node];
    if (!node) return;

    if (node.choices) {
        uiChoices.classList.remove('hidden');
        node.choices.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'choice-btn';
            btn.innerText = c.text;
            btn.onclick = (e) => {
                e.stopPropagation(); 
                const tone = c.score > 0 ? 'good' : (c.score < 0 ? 'bad' : 'continue');
                playSfx(tone);
                if (c.score > 0) {
                    flashGif('good', 1500);
                } else if (c.score < 0) {
                    flashGif('bad', 1800);
                }
                state.affection += (c.score || 0);
                loadNode(c.next);
            };
            uiChoices.appendChild(btn);
        });
    }
}

function showEnding(node) {
    uiDialogue.classList.add('hidden');
    const endScreen = document.getElementById('end-screen');
    document.getElementById('end-title').innerText = node.title;
    document.getElementById('end-desc').innerText = node.desc;
    endScreen.classList.remove('hidden');
    
    // Color code ending
    const goodEnding = node.title.includes('OPEN CHANNEL') || node.title.includes('SIGNAL KEPT');
    const titleColor = node.title.includes('OPEN CHANNEL') ? '#6af4ff' :
                       node.title.includes('DEAD AIR') ? '#ff5d8f' : '#fff';
    document.getElementById('end-title').style.color = titleColor;
    updateSignalStatus(goodEnding ? 'CHANNEL // KEPT' : 'CHANNEL // LOST');
    playSfx(goodEnding ? 'endGood' : 'endBad');
    flashGif(goodEnding ? 'good' : 'bad', 2600);
}

// Input Handling
const bindPrimaryPress = (element, handler) => {
    let pointerHandled = false;
    element.addEventListener('pointerdown', () => {
        pointerHandled = true;
        handler();
        requestAnimationFrame(() => {
            pointerHandled = false;
        });
    });
    element.addEventListener('click', () => {
        if (pointerHandled) return;
        handler();
    });
};

// [agent-note][stage4] repaired: mobile-action-path | element: start/restart/menu/dialogue | action: dual pointer+click binding without global touch suppression
bindPrimaryPress(document.getElementById('btn-lang-en'), () => startGame('en'));

// Restart (Same Language)
bindPrimaryPress(uiRestartBtn, () => {
    document.getElementById('end-screen').classList.add('hidden');
    playSfx('continue');
    startGame(state.lang);
});

// Menu (Back to Start)
bindPrimaryPress(uiMenuBtn, () => {
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    uiDialogue.classList.add('hidden');
    flashGif('bad', 1200);
    updateSignalStatus('CHANNEL // STANDBY');
    playSfx('continue');
    stopBgm();
});

// Tap to advance text
bindPrimaryPress(uiDialogue, () => {
    playSfx('continue');
    if (state.typing) {
        // Instant finish
        state.textIndex = state.textQueue.length;
        uiText.innerText = state.textQueue;
        state.typing = false;
        showChoices();
    } else {
        const node = SCRIPTS[state.lang][state.node];
        if (node && !node.choices && node.next) {
            loadNode(node.next);
        }
    }
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    initParticles();
    updateSignalStatus('CHANNEL // STANDBY');
    requestAnimationFrame(render);
});

</script>
