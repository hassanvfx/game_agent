const UI_TEXT={en:{tapHint:"▼ Tap to continue",restart:"REPLAY THE YEARNING",menu:"BACK TO THE WOODS",speakerUnknown:"???",speakerHer:"Rowan, Obviously Immortal",speakerNarrator:"The Rain"}};
const SCRIPTS={en:{start:{speaker:"Narrator",text:"Rain needles the pines outside Forked-Pine High. Your phone vibrates with a message from Rowan—the pale transfer student who broods near biology and sparkles only when legally inconvenient.",next:"meet_her"},meet_her:{speaker:"Her",text:"You came to the clearing. Reckless. Deliciously reckless. Also, your umbrella is tragic.",choices:[{text:"I brought it so you could judge me forever.",next:"excuse",score:0},{text:"I would cross any weather system for your cheekbones.",next:"flirt",score:10},{text:"I came because my friends dared me. Mostly.",next:"cold",score:-10}]},excuse:{speaker:"Her",text:"A practical answer in a cursed forest. How devastatingly human of you.",next:"q_hobby"},flirt:{speaker:"Her",text:"Careful. I have had a century to perfect yearning and a semester to misuse it.",next:"q_hobby"},cold:{speaker:"Her",text:"Dares fade. Immortal embarrassment does not. Choose better before the wolves start offering commentary.",next:"q_hobby"},q_hobby:{speaker:"Her",text:"Your profile says you enjoy 'mysterious vibes.' Does that include secret covenants, jealous werewolves, and cafeteria-level destiny?",choices:[{text:"Yes. Especially if destiny has storm lighting.",next:"secrets",score:10},{text:"Only if someone explains the rules slowly.",next:"honest",score:5},{text:"It was a phase. Like bangs, but searchable.",next:"rude",score:-20}]},secrets:{speaker:"Her",text:"Then listen: the old pines remember every forbidden crush, and tonight they are gossiping loudly about us.",next:"deep_talk"},honest:{speaker:"Her",text:"Honesty. Adorable. Dangerous. The two traits most likely to get a mortal invited to a moonlit intervention.",next:"deep_talk"},rude:{speaker:"Her",text:"A phase? I have been seventeen since before your town had indoor plumbing. Respect the genre.",next:"end_check"},deep_talk:{speaker:"Her",text:"If I asked you to stand between my eternal loneliness and a shirtless wolf with boundary issues, what would your melodramatic little heart do?",choices:[{text:"Stand there, soaked and poetic, obviously.",next:"connect",score:15},{text:"Request a consent form and a towel first.",next:"pragmatic",score:-5},{text:"Ask if everyone in this forest needs therapy.",next:"mock",score:-15}]},connect:{speaker:"Her",text:"There it is—the reckless sincerity that makes immortality feel briefly less like detention.",next:"end_check"},pragmatic:{speaker:"Her",text:"Reasonable. Cruel, but reasonable. Romance hates paperwork almost as much as vampires hate fluorescent lights.",next:"end_check"},mock:{speaker:"Her",text:"We need therapy, yes. But tonight I needed belief, and you brought a punchline.",next:"end_check"},end_check:{speaker:"Narrator",text:"Thunder applauds too hard. Rowan weighs your answers while the wolf pack, the rain, and your group chat all wait for the verdict.",action:s=>{if(s.affection>=75)return"end_good_1";if(s.affection>=40)return"end_good_2";if(s.affection>=10)return"end_bad_1";return"end_bad_2"}},end_good_1:{ending:true,title:"ENDING 1/4: ETERNAL STUDY DATE",desc:"Rowan offers a gloved hand. You leave the clearing together, doomed, adored, and prepared to overanalyze one text message for the next hundred years."},end_good_2:{ending:true,title:"ENDING 2/4: MAYBE AFTER BIOLOGY",desc:"Rowan smiles like a moonlit lawsuit. The covenant remains risky, but another rainy conversation is officially, dramatically possible."},end_bad_1:{ending:true,title:"ENDING 3/4: WEREWOLF GROUP CHAT",desc:"Rowan disappears into the mist. Your phone lights up with wolf emojis, concerned friends, and the terrible knowledge that you fumbled gothic chemistry."},end_bad_2:{ending:true,title:"ENDING 4/4: CURFEW OF THE HEART",desc:"The clearing empties. Even the rain sounds disappointed. Somewhere, an immortal writes a devastating vague post about mortals."}}};

const rain=[],fireflies=[];function initAtmosphere(){rain.length=0;fireflies.length=0;for(let i=0;i<90;i++)rain.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,l:8+Math.random()*18,s:7+Math.random()*8,a:.12+Math.random()*.23});for(let i=0;i<24;i++)fireflies.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height*.7,r:1+Math.random()*2,t:Math.random()*99})}function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}function drawBackground(dt){const w=canvas.width,h=canvas.height,phase=Math.max(0,Math.min(1,(state.affection-25)/65));let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0b1020");g.addColorStop(.48,"#111626");g.addColorStop(1,"#05060c");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.globalAlpha=.7;ctx.fillStyle="#dcecff";ctx.beginPath();ctx.arc(w*.74,h*.16,Math.min(w,h)*.09,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over";ctx.fillStyle="rgba(8,12,22,.62)";ctx.beginPath();ctx.arc(w*.70,h*.14,Math.min(w,h)*.095,0,Math.PI*2);ctx.fill();ctx.restore();for(let layer=0;layer<3;layer++){ctx.save();ctx.globalAlpha=.45-layer*.1;ctx.fillStyle=layer===0?"#081615":layer===1?"#07100f":"#040908";const base=h*(.64+layer*.08),step=w/7;for(let i=-1;i<9;i++){let x=i*step+(Math.sin(state.timer*.25+layer)*12);ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+step*.35,base-h*(.18+layer*.03));ctx.lineTo(x+step*.72,base);ctx.closePath();ctx.fill()}ctx.restore()}rain.forEach(p=>{p.y+=p.s*(dt/16);p.x-=p.s*.18*(dt/16);if(p.y>h+30){p.y=-30;p.x=Math.random()*w}ctx.strokeStyle=`rgba(207,232,255,${p.a})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-3,p.y+p.l);ctx.stroke()});fireflies.forEach(f=>{f.t+=dt*.002;ctx.globalAlpha=.35+.3*Math.sin(f.t);ctx.fillStyle=phase>.55?"#ffd98b":"#9fb4ff";ctx.beginPath();ctx.arc(f.x+Math.sin(f.t)*12,f.y+Math.cos(f.t*.7)*8,f.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}function drawFocal(dt){state.timer+=dt*.001;const w=canvas.width,h=canvas.height,cx=w*.5,cy=h*.39,b=Math.sin(state.timer*2)*5;ctx.save();let halo=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.min(w,h)*.38);halo.addColorStop(0,"rgba(219,233,255,.28)");halo.addColorStop(.45,"rgba(192,57,100,.16)");halo.addColorStop(1,"transparent");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,Math.min(w,h)*.38,0,Math.PI*2);ctx.fill();const frameW=Math.min(w*.62,260),frameH=Math.min(h*.47,390);ctx.strokeStyle="rgba(214,176,106,.28)";ctx.lineWidth=2;rr(cx-frameW/2,cy-frameH/2+b,frameW,frameH,Math.min(28,frameW*.09));ctx.stroke();ctx.fillStyle="rgba(5,6,13,.22)";rr(cx-frameW/2+8,cy-frameH/2+8+b,frameW-16,frameH-16,22);ctx.fill();ctx.translate(cx,cy+b);ctx.shadowColor="rgba(219,233,255,.6)";ctx.shadowBlur=22;ctx.fillStyle="#e9eef8";ctx.beginPath();ctx.ellipse(0,-frameH*.16,frameW*.12,frameW*.15,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#121019";ctx.beginPath();ctx.ellipse(0,-frameH*.205,frameW*.17,frameW*.105,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle="#16131b";ctx.beginPath();ctx.moveTo(-frameW*.16,-frameH*.16);ctx.quadraticCurveTo(0,-frameH*.36,frameW*.16,-frameH*.16);ctx.lineTo(frameW*.13,frameH*.19);ctx.quadraticCurveTo(0,frameH*.25,-frameW*.13,frameH*.19);ctx.closePath();ctx.fill();ctx.strokeStyle="rgba(192,57,100,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-frameW*.06,-frameH*.05);ctx.bezierCurveTo(-frameW*.17,-frameH*.14,-frameW*.21,frameH*.04,0,frameH*.09);ctx.bezierCurveTo(frameW*.21,frameH*.04,frameW*.17,-frameH*.14,frameW*.06,-frameH*.05);ctx.stroke();ctx.fillStyle="#ffd5dd";ctx.beginPath();ctx.arc(-frameW*.04,-frameH*.17,2.2,0,Math.PI*2);ctx.arc(frameW*.04,-frameH*.17,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(207,232,255,.55)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-frameW*.3,frameH*.04);ctx.quadraticCurveTo(-frameW*.42,-frameH*.04,-frameW*.35,-frameH*.14);ctx.moveTo(frameW*.3,frameH*.04);ctx.quadraticCurveTo(frameW*.42,-frameH*.04,frameW*.35,-frameH*.14);ctx.stroke();ctx.restore()}
function render(time){requestAnimationFrame(render);const rect=canvas.getBoundingClientRect(),need=canvas.width!==Math.floor(rect.width)||canvas.height!==Math.floor(rect.height);if(need){canvas.width=Math.floor(rect.width);canvas.height=Math.floor(rect.height);ctx.setTransform(1,0,0,1,0,0);initAtmosphere()}const dt=time-(state.lastTime||time);state.lastTime=time;ctx.clearRect(0,0,canvas.width,canvas.height);drawBackground(dt);drawFocal(dt);if(state.typing){const speed=window.gameConfig.textSpeed||30;state.textIndex+=dt/speed;uiText.innerText=state.textQueue.substring(0,Math.floor(state.textIndex));if(state.textIndex>=state.textQueue.length){state.typing=false;showChoices()}}}
function startGame(lang){state.lang=lang;uiTapHint.innerText=UI_TEXT[lang].tapHint;uiRestartBtn.innerText=UI_TEXT[lang].restart;uiMenuBtn.innerText=UI_TEXT[lang].menu;document.getElementById("end-screen").classList.add("hidden");document.getElementById("start-screen").classList.add("hidden");uiDialogue.classList.remove("hidden");state.affection=50;updateMeter();updateStatus("COVENANT // LIVE IN THE RAIN");initAudio();playSfx("start");loadNode("start")}function loadNode(nodeId){const node=SCRIPTS[state.lang][nodeId];if(!node)return;if(node.action){loadNode(node.action(state));return}if(node.ending){showEnding(node);return}state.node=nodeId;let speaker=node.speaker;if(speaker==="Her")speaker=UI_TEXT[state.lang].speakerHer;else if(speaker==="Narrator")speaker=UI_TEXT[state.lang].speakerNarrator;uiSpeaker.innerText=speaker;uiSpeaker.style.color=node.speaker==="Her"?"#ffd5dd":"#cfe8ff";updateStatus(node.speaker==="Her"?"COVENANT // IMMORTAL ONLINE":"COVENANT // RAIN NARRATES");state.textQueue=node.text;state.textIndex=0;state.typing=true;uiChoices.innerHTML="";uiChoices.classList.add("hidden");updateMeter()}function showChoices(){const node=SCRIPTS[state.lang][state.node];if(!node||!node.choices)return;uiChoices.classList.remove("hidden");node.choices.forEach(c=>{const btn=document.createElement("button");btn.className="choice-btn";btn.type="button";btn.innerText=c.text;btn.onclick=e=>{e.stopPropagation();const tone=c.score>0?"good":c.score<0?"bad":"continue";playSfx(tone);if(c.score>0)flashGif("good",1500);else if(c.score<0)flashGif("bad",1700);state.affection+=c.score||0;updateMeter();loadNode(c.next)};uiChoices.appendChild(btn)})}function showEnding(node){uiDialogue.classList.add("hidden");uiChoices.classList.add("hidden");const end=document.getElementById("end-screen");document.getElementById("end-title").innerText=node.title;document.getElementById("end-desc").innerText=node.desc;end.classList.remove("hidden");const good=node.title.includes("ETERNAL")||node.title.includes("MAYBE");document.getElementById("end-title").style.color=node.title.includes("CURFEW")?"#ff7b95":good?"#dbe9ff":"#d6b06a";updateStatus(good?"COVENANT // YEARNING ACCEPTED":"COVENANT // YEARNING DENIED");playSfx(good?"endGood":"endBad");flashGif(good?"good":"bad",2600)}
function bindPrimaryPress(el,handler){let pointerHandled=false;el.addEventListener("pointerdown",()=>{pointerHandled=true;handler();requestAnimationFrame(()=>pointerHandled=false)});el.addEventListener("click",()=>{if(!pointerHandled)handler()})}bindPrimaryPress(document.getElementById("btn-lang-en"),()=>startGame("en"));bindPrimaryPress(uiRestartBtn,()=>{document.getElementById("end-screen").classList.add("hidden");playSfx("continue");startGame(state.lang)});bindPrimaryPress(uiMenuBtn,()=>{document.getElementById("end-screen").classList.add("hidden");document.getElementById("start-screen").classList.remove("hidden");uiDialogue.classList.add("hidden");uiChoices.classList.add("hidden");updateStatus("COVENANT // BEFORE CURFEW");playSfx("continue");stopBgm()});bindPrimaryPress(uiDialogue,()=>{playSfx("continue");if(state.typing){state.textIndex=state.textQueue.length;uiText.innerText=state.textQueue;state.typing=false;showChoices()}else{const node=SCRIPTS[state.lang][state.node];if(node&&!node.choices&&node.next)loadNode(node.next)}});window.addEventListener("DOMContentLoaded",()=>{updateMeter();updateStatus("COVENANT // BEFORE CURFEW");requestAnimationFrame(render)});
