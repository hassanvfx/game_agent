<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Sketchboard</title>
    <!-- [agent-note][stage4] preserved-approved-fonts: title-display uses Audiowide and UI text uses Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f1029;
            --bg-bottom: #040612;
            --grid-line: rgba(140, 222, 255, 0.11);
            --panel-bg: rgba(14, 20, 46, 0.82);
            --panel-border: rgba(113, 228, 255, 0.22);
            --panel-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
            --text-main: #f3f7ff;
            --text-muted: #a8b6d9;
            --accent-cyan: #71e4ff;
            --accent-blue: #5785ff;
            --accent-pink: #ff59c7;
            --danger: #ff5b7f;
            --danger-shadow: #ba214d;
            --swatch-ring: rgba(255, 255, 255, 0.18);
            --canvas-glow: rgba(95, 227, 255, 0.18);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(87, 133, 255, 0.18), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
        }

        .font-display {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
        }

        .hidden {
            display: none !important;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 89, 199, 0.12), transparent 26%),
                radial-gradient(circle at 80% 12%, rgba(113, 228, 255, 0.16), transparent 24%),
                linear-gradient(180deg, rgba(10, 16, 38, 0.94), rgba(3, 6, 18, 0.98));
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                linear-gradient(90deg, transparent 0 24px, rgba(113, 228, 255, 0.06) 24px 25px),
                linear-gradient(transparent 0 24px, rgba(113, 228, 255, 0.05) 24px 25px);
            background-size: 25px 25px;
            opacity: 0.55;
            mix-blend-mode: screen;
        }

        .game-container::after {
            inset: 1.1rem 1rem 7rem;
            border: 1px solid rgba(113, 228, 255, 0.12);
            border-radius: 1.5rem;
            box-shadow: inset 0 0 26px rgba(95, 227, 255, 0.06);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            width: 100%;
            padding: 1rem 1rem 0;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            pointer-events: auto;
        }

        .mission-card {
            max-width: min(24rem, calc(100vw - 8.5rem));
            background:
                linear-gradient(180deg, rgba(26, 35, 76, 0.88), var(--panel-bg));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            border-radius: 1rem;
            padding: 0.85rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .mission-card::after {
            content: 'โ�จ';
            position: absolute;
            right: 0.9rem;
            top: 0.72rem;
            font-size: 1rem;
            opacity: 0.88;
            filter: drop-shadow(0 0 8px rgba(113, 228, 255, 0.45));
        }

        .mission-title {
            margin: 0 0 0.28rem;
            font-size: 1rem;
            line-height: 1.05;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff4b8;
            text-shadow: 0 0 12px rgba(255, 225, 112, 0.32);
        }

        .mission-copy {
            margin: 0;
            font-size: 0.84rem;
            line-height: 1.28;
            color: var(--text-muted);
            font-weight: 600;
            max-width: 18rem;
        }

        .clear-btn {
            background: linear-gradient(180deg, #ff7e97, var(--danger));
            color: white;
            box-shadow: 0 4px 0 var(--danger-shadow), 0 0 18px rgba(255, 91, 127, 0.24);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 0.95rem;
            padding: 0.9rem 1.15rem;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: 0.84rem;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
        }

        .clear-btn:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 0 0 var(--danger-shadow);
            filter: brightness(1.06);
        }

        .controls-wrap {
            width: 100%;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            pointer-events: auto;
        }

        .palette-scroll {
            width: 100%;
            overflow-x: auto;
            padding: 0 1rem;
            box-sizing: border-box;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .palette-scroll::-webkit-scrollbar {
            display: none;
        }

        .palette-row {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: min-content;
            width: fit-content;
            margin: 0 auto;
            padding: 0 0 1rem;
        }

        .palette-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, border-color 0.2s;
            border: 3px solid var(--swatch-ring);
            position: relative;
            flex-shrink: 0;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 9999px;
            padding: 0;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        }

        .palette-btn::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 9999px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .palette-btn:active {
            transform: scale(0.9);
        }

        .palette-btn.active {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.4);
            z-index: 10;
            box-shadow: 0 0 0 3px rgba(113, 228, 255, 0.16), 0 6px 18px rgba(0, 0, 0, 0.32);
        }

        .palette-btn.active::after {
            border-color: currentColor;
        }

        .divider {
            width: 1px;
            height: 2.5rem;
            background: linear-gradient(180deg, transparent, rgba(113, 228, 255, 0.72), transparent);
            margin: 0 0.15rem;
            flex-shrink: 0;
        }

        .eraser-btn {
            background: linear-gradient(180deg, #f4f6fb, #dce2ee);
            color: #687284;
            border-style: dashed;
            border-color: rgba(58, 76, 115, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eraser-icon {
            width: 1.5rem;
            height: 1.5rem;
            color: #566074;
        }

        .swatch-black { background: radial-gradient(circle at 32% 28%, #3a4d69, #0e1728 72%); color: #3a4d69; }
        .swatch-blue { background: radial-gradient(circle at 32% 28%, #7fd7ff, #2f72ff 72%); color: #7fd7ff; }
        .swatch-red { background: radial-gradient(circle at 32% 28%, #ffac9f, #ff4f77 72%); color: #ffac9f; }
        .swatch-green { background: radial-gradient(circle at 32% 28%, #b6ffcf, #1dc980 72%); color: #b6ffcf; }
        .swatch-purple { background: radial-gradient(circle at 32% 28%, #e0b3ff, #9254ff 72%); color: #e0b3ff; }
        .swatch-orange { background: radial-gradient(circle at 32% 28%, #ffd0a4, #ff8a3d 72%); color: #ffd0a4; }
        .swatch-pink { background: radial-gradient(circle at 32% 28%, #ffc1ea, #ff4bc0 72%); color: #ffc1ea; }

        .feedback-stack {
            position: absolute;
            top: 5.4rem;
            right: 1rem;
            z-index: 65;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
            pointer-events: none;
        }

        .feedback-badge {
            min-width: 7.5rem;
            max-width: min(11rem, 42vw);
            padding: 0.65rem 0.85rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: linear-gradient(180deg, rgba(16, 25, 56, 0.92), rgba(8, 12, 26, 0.88));
            box-shadow: var(--panel-shadow);
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .feedback-badge.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-label {
            margin: 0;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff8c8;
        }

        .feedback-subcopy {
            margin: 0.2rem 0 0;
            font-size: 0.86rem;
            font-weight: 600;
            color: #eff6ff;
        }

        .feedback-gif-wrap {
            width: min(7rem, 24vw);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(113, 228, 255, 0.24);
            background: rgba(9, 14, 28, 0.82);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.26);
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-gif-wrap.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-gif {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-gif-caption {
            padding: 0.28rem 0.5rem 0.45rem;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #a8b6d9;
            text-align: center;
        }

        @media (max-width: 640px) {
            .hud-top {
                padding: 0.85rem 0.85rem 0;
            }

            .mission-card {
                max-width: min(19rem, calc(100vw - 7rem));
                padding: 0.75rem 0.85rem;
            }

            .feedback-stack {
                top: 5rem;
                right: 0.75rem;
                gap: 0.55rem;
            }

            .feedback-badge {
                min-width: 6.5rem;
                max-width: min(8.5rem, 40vw);
                padding: 0.5rem 0.65rem;
            }

            .feedback-subcopy {
                font-size: 0.76rem;
            }

            .feedback-gif-wrap {
                width: min(5.4rem, 22vw);
            }

            .mission-title {
                font-size: 0.82rem;
            }

            .mission-copy {
                font-size: 0.8rem;
            }

            .clear-btn {
                padding: 0.85rem 1rem;
                font-size: 0.72rem;
            }

            .palette-btn {
                width: 3.25rem;
                height: 3.25rem;
            }
        }
    </style>
</head>

<script>
/**
 * ยง0 System Constants & State
 */
const COLORS = {
    BLACK: '#1f2937',
    BLUE: '#2563eb',
    RED: '#dc2626',
    GREEN: '#16a34a',
    PURPLE: '#9333ea',
    ORANGE: '#ea580c',
    PINK: '#db2777',
    ERASER: '#ffffff'
};

const TOOLS = {
    MARKER: 'MARKER',
    ERASER: 'ERASER'
};

let gameState = 'PLAYING';
let initialized = false;
let lastTime = 0;
let cw = 0, ch = 0;
let dpr = 1;

// Config
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = {};
Object.keys(gameConfigDefs).forEach(k => gameConfig[k] = gameConfigDefs[k].value);

// Audio Context
let audioCtx;
const audioBuffers = {};
const sfxElements = {};

// Game Entities
let lines = []; // { p1, p2, color, width }
let particles = [];
let currentDrawColor = COLORS.BLACK;
let currentTool = TOOLS.MARKER;
let shakeTime = 0;
let lastDrawPos = null;
let drawDistanceAccumulator = 0;
let activePointers = 0;
let bgmStarted = false;
let feedbackTimer = 0;
let gifTimer = 0;
let currentFeedbackState = 'idle';

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const clearBtn = document.getElementById('btn-clear');
const feedbackBadge = document.getElementById('feedback-badge');
const feedbackLabel = document.getElementById('feedback-label');
const feedbackSubcopy = document.getElementById('feedback-subcopy');
const feedbackGifWrap = document.getElementById('feedback-gif-wrap');
const feedbackGif = document.getElementById('feedback-gif');
const feedbackGifCaption = document.getElementById('feedback-gif-caption');

/**
 * ยง1 Audio System (L0: Zero DOM Overhead)
 */
async function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    
    const loadBuffer = async (id, url) => {
        try {
            const audioUrl = new URL(url, window.location.href);
            if (audioUrl.origin !== window.location.origin) {
                return;
            }
            const response = await fetch(audioUrl.href);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Failed to load audio ${id}`, e);
        }
    };

    const assets = document.getElementById('assets').children;
    for (let el of assets) {
        if (el.tagName === 'AUDIO' && el.id.startsWith('sfx_')) {
            sfxElements[el.id] = el;
            await loadBuffer(el.id, el.src);
        }
    }
}

function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const bgm = document.getElementById('bgm_main');
    if (bgm && !bgmStarted) {
        bgm.volume = 0.18;
        bgm.play().then(() => {
            bgmStarted = true;
        }).catch(() => {});
    }
}

function playSfx(id, pitch = 1.0, vol = 1.0) {
    const buffer = audioBuffers[id];
    if (audioCtx && buffer) {
        const source = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        source.buffer = buffer;
        source.playbackRate.value = pitch;
        gainNode.gain.value = vol;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
        return;
    }

    const el = sfxElements[id];
    if (el) {
        const oneShot = el.cloneNode();
        oneShot.volume = Math.min(1, Math.max(0, vol));
        oneShot.playbackRate = pitch;
        oneShot.preload = 'auto';
        oneShot.play().catch(() => synthesizeSfx(id));
        return;
    }

    if (audioCtx) {
        synthesizeSfx(id);
    }
}

function showFeedback(label, copy, state = 'idle') {
    currentFeedbackState = state;
    feedbackLabel.textContent = label;
    feedbackSubcopy.textContent = copy;
    feedbackBadge.classList.add('show');
    feedbackTimer = 1.45;
}

function setReactionGif(src, caption) {
    feedbackGif.src = src;
    feedbackGifCaption.textContent = caption;
    feedbackGifWrap.classList.add('show');
    gifTimer = 2.1;
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'sfx_clear') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'sfx_select') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'sfx_draw') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(340, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
    }
}

function vibrate(type) {
    if (!window.navigator.vibrate) return;
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: type }
    });
    if (type === 'heavy') navigator.vibrate(100);
    else navigator.vibrate(15);
}

/**
 * ยง2 Game Logic & Entities
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 100 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 2.0 + 1.0;
        this.size = Math.random() * 4 + 2;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 300 * dt; // Gravity
        this.life -= this.decay * dt;
    }

    draw(ctx) {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function initGame() {
    lines = [];
    particles = [];
    shakeTime = 0;
    showFeedback('Sketch status', 'Tap a color and start doodling.', 'idle');
    setTool('BLACK', false); // No SFX on init
}

function clearBoard() {
    // Burst the sketch into color confetti
    const palette = Object.values(COLORS).filter(c => c !== '#ffffff');
    for(let i = 0; i < 50; i++) {
        const col = palette[Math.floor(Math.random() * palette.length)];
        particles.push(new Particle(cw / 2, ch / 2, col));
    }
    
    lines = [];
    screenShake(0.4);
    vibrate('heavy');
    playSfx('sfx_clear', 1.0, 0.8);
    showFeedback('Grid wiped', 'Fresh holo-board ready for a new combo.', 'clear');
    setReactionGif('https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp', 'Reset burst');
}

function screenShake(duration) {
    shakeTime = duration;
}

function setTool(key, playSound = true) {
    if (key === 'ERASER') {
        currentTool = TOOLS.ERASER;
        currentDrawColor = COLORS.ERASER;
    } else {
        currentTool = TOOLS.MARKER;
        currentDrawColor = COLORS[key];
    }

    // Update UI
    document.querySelectorAll('.palette-btn').forEach(btn => {
        if (btn.dataset.color === key) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    if (playSound) {
        playSfx('sfx_select', 1.0 + Math.random() * 0.2, 0.5);
        showFeedback('Ink swapped', `${key === 'ERASER' ? 'Eraser bot' : key.toLowerCase() + ' glow'} equipped.`, 'select');
    }
}

/**
 * ยง3 Input Handling
 */
function handleCanvasInput(e) {
    unlockAudio();

    if (e.type === 'pointerdown') activePointers += 1;
    if ((e.type === 'pointerup' || e.type === 'pointercancel') && activePointers > 0) activePointers -= 1;

    // [agent-note][stage4] repaired: mobile-action-path | element: canvas input | action: only prevent default on gameplay surface
    if (e.cancelable) {
        e.preventDefault();
    }

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    if (e.type === 'pointerdown') {
        lastDrawPos = {x, y};
        showFeedback('Sketching live', currentTool === TOOLS.ERASER ? 'Scrubbing holo-ink.' : 'Trail your finger to draw neon lines.', 'draw');
        if (currentTool === TOOLS.MARKER) {
            lines.push({
                p1: {x, y},
                p2: {x: x + 0.1, y: y + 0.1},
                color: currentDrawColor,
                width: gameConfig.baseLineWidth
            });
        }
    } else if (e.type === 'pointermove' && lastDrawPos) {
        const dist = Math.hypot(x - lastDrawPos.x, y - lastDrawPos.y);
        if (dist > 4) {
            let width = currentTool === TOOLS.ERASER ? gameConfig.eraserWidth : gameConfig.baseLineWidth;
            
            if (currentTool === TOOLS.MARKER) {
                // Dynamic width: faster = slightly thinner
                width *= (1.0 - Math.min(dist / 150, 0.3)); 
            }

            lines.push({
                p1: { ...lastDrawPos },
                p2: { x, y },
                color: currentDrawColor,
                width: width
            });
            
            // Particles for juice
            if (currentTool === TOOLS.MARKER && Math.random() > 0.92) {
                particles.push(new Particle(x, y, currentDrawColor));
            }

            // Audio Feedback
            drawDistanceAccumulator += dist;
            if (drawDistanceAccumulator > 40) {
                playSfx('sfx_draw', 1.0 + Math.random() * 0.4, 0.2);
                drawDistanceAccumulator = 0;
                if (currentTool === TOOLS.MARKER) {
                    vibrate('light');
                    if (Math.random() > 0.72) {
                        setReactionGif('https://i.giphy.com/1AjEBGWggGXh9onllB.webp', 'Combo spark');
                    }
                }
            }

            lastDrawPos = {x, y};
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        lastDrawPos = null;
        drawDistanceAccumulator = 0;
    }
}

function handleUiButton(e) {
    unlockAudio();

    const target = e.currentTarget;
    if (target.id === 'btn-clear') {
        clearBoard();
        return;
    }
    if (target.dataset.color) {
        setTool(target.dataset.color);
    }
}

function handlePointerRelease() {
    if (activePointers > 0) activePointers -= 1;
    lastDrawPos = null;
    drawDistanceAccumulator = 0;
}

/**
 * ยง4 Lifecycle & Loop
 */
function resize() {
    const rect = document.body.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initialized = true;
        initGame();
        requestAnimationFrame(loop);
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    draw();
    
    requestAnimationFrame(loop);
}

function update(dt) {
    if (shakeTime > 0) shakeTime -= dt;
    if (feedbackTimer > 0) {
        feedbackTimer -= dt;
        if (feedbackTimer <= 0 && activePointers === 0) {
            feedbackBadge.classList.remove('show');
        }
    }
    if (gifTimer > 0) {
        gifTimer -= dt;
        if (gifTimer <= 0) {
            feedbackGifWrap.classList.remove('show');
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

     function draw() {
     // Clear
     const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
     bgGradient.addColorStop(0, '#0d1230');
     bgGradient.addColorStop(1, '#030612');
     ctx.fillStyle = bgGradient;
     ctx.fillRect(0, 0, cw, ch);

     const halo = ctx.createRadialGradient(cw * 0.18, ch * 0.14, 0, cw * 0.18, ch * 0.14, Math.max(cw, ch) * 0.48);
     halo.addColorStop(0, 'rgba(255, 89, 199, 0.15)');
     halo.addColorStop(1, 'rgba(255, 89, 199, 0)');
     ctx.fillStyle = halo;
     ctx.fillRect(0, 0, cw, ch);

     const haloTwo = ctx.createRadialGradient(cw * 0.82, ch * 0.12, 0, cw * 0.82, ch * 0.12, Math.max(cw, ch) * 0.42);
     haloTwo.addColorStop(0, 'rgba(113, 228, 255, 0.18)');
     haloTwo.addColorStop(1, 'rgba(113, 228, 255, 0)');
     ctx.fillStyle = haloTwo;
     ctx.fillRect(0, 0, cw, ch);

     // Subtle Grid
     ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line') || 'rgba(140, 222, 255, 0.11)';
     ctx.lineWidth = 1;
     const gridSize = 40;
    
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        const mag = 20 * shakeTime;
        sx = (Math.random() - 0.5) * mag;
        sy = (Math.random() - 0.5) * mag;
    }
    
    ctx.save();
    ctx.translate(sx, sy);

    ctx.beginPath();
    for (let x = 0; x <= cw; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
    for (let y = 0; y <= ch; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
    ctx.stroke();

    // Draw Lines
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
     lines.forEach(line => {
         ctx.strokeStyle = line.color;
         ctx.lineWidth = line.width;
         ctx.shadowColor = line.color;
         ctx.shadowBlur = line.color === COLORS.ERASER ? 0 : Math.max(8, line.width * 1.7);
         ctx.beginPath();
         ctx.moveTo(line.p1.x, line.p1.y);
         ctx.lineTo(line.p2.x, line.p2.y);
         ctx.stroke();
     });
     ctx.shadowBlur = 0;

    // Draw Particles
    particles.forEach(p => p.draw(ctx));

    // Cursor Preview
    if (lastDrawPos) {
        ctx.beginPath();
        let r = currentTool === TOOLS.ERASER ? gameConfig.eraserWidth / 2 : gameConfig.baseLineWidth / 2;
        ctx.arc(lastDrawPos.x, lastDrawPos.y, r, 0, Math.PI * 2);
        ctx.fillStyle = currentDrawColor;
        if (currentTool === TOOLS.ERASER) {
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.fill();
    }

    ctx.restore();
}

// Initialization
window.addEventListener('DOMContentLoaded', () => {
    const ro = new ResizeObserver(() => resize());
    ro.observe(canvas);

    canvas.addEventListener('pointerdown', handleCanvasInput, { passive: false });
    canvas.addEventListener('pointermove', handleCanvasInput, { passive: false });
    canvas.addEventListener('pointerup', handleCanvasInput, { passive: false });
    canvas.addEventListener('pointercancel', handleCanvasInput, { passive: false });
    window.addEventListener('pointerup', handlePointerRelease);
    window.addEventListener('pointercancel', handlePointerRelease);
    
    clearBtn.addEventListener('click', handleUiButton);
    
    // [agent-note][stage4] action-path: palette tap -> tool swap | clear tap -> reset | native click preserved for mobile buttons
    document.querySelectorAll('.palette-btn').forEach(btn => {
        btn.addEventListener('click', handleUiButton);
    });
});
</script>
