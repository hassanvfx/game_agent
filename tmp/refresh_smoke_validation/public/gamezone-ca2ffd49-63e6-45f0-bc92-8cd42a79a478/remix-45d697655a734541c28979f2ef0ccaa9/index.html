    <!-- [agent-note][stage4] resolved-font: title/ui -> approved catalogs/fonts.json entries (Orbitron + Rajdhani) -->
    <style>

            --sky-top: #081f3a;
            --sky-bottom: #1d6fa7;

<script>
/**
 * Sunny Harvest - A single file HTML5 game
 * Architecture: Canvas Renderer + State Machine
 */

// --- Global Config & State ---
window.gameConfigDefs = {
    growthSpeed: { type: "number", label: "Growth Speed", value: 1.0, min: 0.5, max: 3.0 },
    gameDuration: { type: "number", label: "Game Duration (s)", value: 60, min: 30, max: 120 },
    themeColor: { type: "color", label: "Sky Color", value: "#87CEEB" }
};
window.gameConfig = {
    growthSpeed: 1.0,
    gameDuration: 60,
    themeColor: "#87CEEB"
};

// Config Hot Update
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') document.body.style.background = val;
    }
};

// --- Audio Manager ---
class AudioManager {
        constructor() {
            this.ctx = null;
            this.bgmNode = null;
            this.sfxElements = {};
            this.isUnlocked = false;
            this.muted = false;
            this.lastPlayedAt = {};
            this.cooldowns = {
                sfx_harvest: 90,
                sfx_ripe: 220,
                sfx_fail: 140,
                sfx_start: 220,
                sfx_gameover: 320
            };
        }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        ['sfx_harvest', 'sfx_ripe', 'sfx_fail', 'sfx_start', 'sfx_gameover'].forEach((id) => {
            const el = document.getElementById(id);
            if (el) {
                el.crossOrigin = 'anonymous';
                this.sfxElements[id] = el;
            }
        });
    }

    unlock() {
        if (this.isUnlocked || !this.ctx) return;
        this.ctx.resume().then(() => {
            this.isUnlocked = true;
            this.playBgm();
        });
    }

        playBgm() {
            const el = document.getElementById('bgm_main');
            if (!el || this.muted) return;
            el.crossOrigin = 'anonymous';
            el.volume = 0.2;
            el.loop = true;
            this.bgmNode = el;
            if (el.paused) {
                el.play().catch(e => console.log('BGM autoplay blocked', e));
            }
        }

        stopBgm() {
            if (this.bgmNode) {
                this.bgmNode.pause();
                this.bgmNode.currentTime = 0;
            }
        }

        playSfx(id, volume = 0.45) {
            if (!this.ctx || this.muted) return;
            const now = performance.now();
            const cooldown = this.cooldowns[id] || 0;
            if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
            this.lastPlayedAt[id] = now;

            const el = this.sfxElements[id];
            if (el) {
                const clone = el.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => this.synthesize(id, Math.min(volume, 0.35)));
                return;
            }

            this.synthesize(id, volume);
        }

        synthesize(type, volume = 0.35) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'sfx_harvest' || type === 'sfx_ripe' || type === 'sfx_start' || type === 'sfx_gameover') {
                osc.type = type === 'sfx_gameover' ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(type === 'sfx_ripe' ? 520 : 400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(type === 'sfx_gameover' ? 920 : 860, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.14);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }
}

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const uiLayer = document.getElementById('ui-layer');
    const startScreen = document.getElementById('start-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restart-btn');
    const harvestGif = document.getElementById('harvest-gif');
    const failGif = document.getElementById('fail-gif');

    const audio = new AudioManager();

    // Game State
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let timeLeft = 60;
    let lastTime = 0;
    let shake = 0;
    let lastTickCue = -1;
    let harvestGifTimer = null;
    let failGifTimer = null;

    // Entities
    const particles = [];
    const floatTexts = [];
    const crops = [];
    const clouds = [];

    // Grid Config
    const gridRows = 4;
    const gridCols = 3;
    let cellWidth, cellHeight, gridOffsetX, gridOffsetY;

    // Crop States
    const STATE_EMPTY = 0;
    const STATE_GROWING = 1;
    const STATE_RIPE = 2;
    const STATE_ROTTEN = 3;

    function triggerGif(el, timerName, duration = 1200) {
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(timerName === 'harvest' ? harvestGifTimer : failGifTimer);
        const timeoutId = setTimeout(() => el.classList.remove('visible'), duration);
        if (timerName === 'harvest') {
            harvestGifTimer = timeoutId;
        } else {
            failGifTimer = timeoutId;
        }
    }

    class Crop {
        constructor(row, col) {
            this.row = row;
            this.col = col;
            this.state = STATE_EMPTY;
            this.timer = 0;
            this.maxTime = 0;
            this.scale = 0; // Animation scale
            this.wiggle = 0;
        }

        reset() {
            this.state = STATE_EMPTY;
            this.timer = 0;
            this.scale = 0;
        }

        startGrowing() {
            this.state = STATE_GROWING;
            this.timer = 0;
            this.maxTime = 2 + Math.random() * 2; // Random growth time
            this.scale = 0;
        }

        update(dt) {
            const speed = window.gameConfig.growthSpeed;
            
            // Animation smoothing
            if (this.state !== STATE_EMPTY) {
                this.scale += (1 - this.scale) * 10 * dt;
            } else {
                this.scale += (0 - this.scale) * 10 * dt;
            }

            if (this.state === STATE_GROWING) {
                this.timer += dt * speed;
                if (this.timer >= this.maxTime) {
                    this.state = STATE_RIPE;
                    this.timer = 0;
                    this.maxTime = 3; // Time before rot
                    this.scale = 1.2; // Pop effect
                    audio.playSfx('sfx_ripe', 0.24);
                }
            } else if (this.state === STATE_RIPE) {
                this.timer += dt * speed;
                this.wiggle = Math.sin(Date.now() / 100) * 0.1;
                if (this.timer >= this.maxTime) {
                    this.state = STATE_ROTTEN;
                    this.timer = 0;
                    this.maxTime = 2; // Time to stay rotten
                    this.scale = 0.8;
                    // Fail sound if it rots? optional, maybe too chaotic
                }
            } else if (this.state === STATE_ROTTEN) {
                this.timer += dt;
                if (this.timer >= this.maxTime) {
                    this.reset();
                }
            }
        }

        draw(ctx, x, y, w, h) {
            const cx = x + w/2;
            const cy = y + h/2 + h * 0.1; // Offset slightly down
            const s = Math.max(0, this.scale);

            // Draw Soil Patch
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(cx, cy + h*0.2, w*0.35, h*0.15, 0, 0, Math.PI*2);
            ctx.fill();

            if (this.state === STATE_EMPTY) return;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(s, s);
            if (this.state === STATE_RIPE) ctx.rotate(this.wiggle);

            if (this.state === STATE_GROWING) {
                // Green Sprout
                ctx.fillStyle = '#32CD32';
                ctx.beginPath();
                ctx.ellipse(0, 0, w*0.15, h*0.15, 0, 0, Math.PI*2);
                ctx.fill();
                // Leaves
                ctx.beginPath();
                ctx.ellipse(-w*0.1, -h*0.1, w*0.08, h*0.2, -0.5, 0, Math.PI*2);
                ctx.ellipse(w*0.1, -h*0.1, w*0.08, h*0.2, 0.5, 0, Math.PI*2);
                ctx.fill();
            } else if (this.state === STATE_RIPE) {
                // Golden Veggie (Pumpkin-ish)
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, w*0.25, 0, Math.PI*2);
                ctx.fill();
                // Detail
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, w*0.25, 0, Math.PI*2);
                ctx.stroke();
                // Shine
                ctx.fillStyle = '#FFF';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(-w*0.1, -w*0.1, w*0.05, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            } else if (this.state === STATE_ROTTEN) {
                // Brown Mush
                ctx.fillStyle = '#5D4037';
                ctx.beginPath();
                ctx.moveTo(-w*0.2, 0);
                ctx.quadraticCurveTo(0, -h*0.1, w*0.2, 0);
                ctx.quadraticCurveTo(w*0.25, h*0.1, 0, h*0.15);
                ctx.quadraticCurveTo(-w*0.25, h*0.1, -w*0.2, 0);
                ctx.fill();
                // Flies (particles later, simple dots here)
                ctx.fillStyle = '#000';
                const t = Date.now() / 50;
                ctx.fillRect(Math.sin(t)*10, -20 + Math.cos(t)*5, 4, 4);
                ctx.fillRect(Math.cos(t)*15, -10 + Math.sin(t)*5, 3, 3);
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, type) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 1) * 10 - 5;
            this.life = 1.0;
            this.type = type; // 'leaf' or 'dirt'
            this.size = Math.random() * 8 + 4;
        }
        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 20 * dt; // Gravity
            this.life -= dt * 1.5;
            this.size *= 0.95;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            if (this.type === 'leaf') {
                ctx.ellipse(this.x, this.y, this.size, this.size/2, this.life*5, 0, Math.PI*2);
            } else {
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    class FloatText {
        constructor(x, y, text, color) {
            this.x = x;
            this.y = y;
            this.text = text;
            this.color = color;
            this.life = 1.0;
            this.vy = -50;
        }
        update(dt) {
            this.y += this.vy * dt;
            this.life -= dt;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 3;
            ctx.font = '700 30px "Orbitron"';
            ctx.strokeText(this.text, this.x, this.y);
            ctx.fillText(this.text, this.x, this.y);
            ctx.globalAlpha = 1.0;
        }
    }

    function initGame() {
        // Init Crops
        crops.length = 0;
        for(let r=0; r<gridRows; r++) {
            for(let c=0; c<gridCols; c++) {
                crops.push(new Crop(r, c));
            }
        }
        
        // Init Clouds
        clouds.length = 0;
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight * 0.4,
                speed: 10 + Math.random() * 20,
                size: 0.5 + Math.random() * 0.5
            });
        }
    }

    function startGame() {
        if (gameState === 'PLAYING') return;
        
        audio.init();
        audio.unlock();
        
        gameState = 'PLAYING';
        score = 0;
        timeLeft = window.gameConfig.gameDuration;
        shake = 0;
        
        scoreEl.innerText = score;
        timeEl.innerText = Math.ceil(timeLeft);
        lastTickCue = Math.ceil(timeLeft);
        
        // UI Transitions
        startScreen.style.display = 'none';
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        hud.classList.add('flex'); // Ensure flex display

        // Reset crops
        crops.forEach(c => c.reset());
        harvestGif.classList.remove('visible');
        failGif.classList.remove('visible');
        audio.playSfx('sfx_start', 0.38);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        finalScoreEl.innerText = score;
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        triggerGif(harvestGif, 'harvest', 1800);
        audio.stopBgm();
        audio.playSfx('sfx_gameover', 0.42);
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Grid calc
        const margin = 20;
        const availW = window.innerWidth - margin*2;
        const availH = window.innerHeight - margin*2 - 100; // Space for HUD/Sky
        
        // Keep aspect ratio roughly square-ish for cells
        cellWidth = availW / gridCols;
        cellHeight = availH / gridRows;
        
        // Center grid
        gridOffsetX = margin;
        gridOffsetY = 100 + margin;
    }

    function spawnParticles(x, y, color, count, type) {
        for(let i=0; i<count; i++) {
            particles.push(new Particle(x, y, color, type));
        }
    }

    function update(dt) {
        // Background
        clouds.forEach(c => {
            c.x += c.speed * dt;
            if (c.x > window.innerWidth + 100) c.x = -100;
        });

        if (gameState === 'PLAYING') {
            timeLeft -= dt;
            const displayTime = Math.ceil(Math.max(0, timeLeft));
            timeEl.innerText = displayTime;
            if (displayTime !== lastTickCue && displayTime <= 10 && displayTime > 0) {
                audio.playSfx('sfx_ripe', 0.18);
                lastTickCue = displayTime;
            }
            
            if (timeLeft <= 0) {
                gameOver();
            }

            // Spawn logic
            if (Math.random() < 0.05 * window.gameConfig.growthSpeed) {
                const emptyCrops = crops.filter(c => c.state === STATE_EMPTY);
                if (emptyCrops.length > 0) {
                    const pick = emptyCrops[Math.floor(Math.random() * emptyCrops.length)];
                    pick.startGrowing();
                }
            }

            // Shake decay
            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        crops.forEach(c => c.update(dt));
        
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = floatTexts.length - 1; i >= 0; i--) {
            floatTexts[i].update(dt);
            if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
        }
    }

    function draw() {
        // Clear & Background
        ctx.fillStyle = window.gameConfig.themeColor || '#87CEEB';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        // Shake offset
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.save();
        ctx.translate(dx, dy);

        // Hills
        ctx.fillStyle = '#90EE90';
        ctx.beginPath();
        ctx.moveTo(0, window.innerHeight * 0.4);
        ctx.bezierCurveTo(window.innerWidth/2, window.innerHeight * 0.3, window.innerWidth, window.innerHeight * 0.5, window.innerWidth, window.innerHeight);
        ctx.lineTo(0, window.innerHeight);
        ctx.fill();

        ctx.fillStyle = '#32CD32';
        ctx.beginPath();
        ctx.moveTo(0, window.innerHeight * 0.5);
        ctx.bezierCurveTo(window.innerWidth/3, window.innerHeight * 0.45, window.innerWidth, window.innerHeight * 0.6, window.innerWidth, window.innerHeight);
        ctx.lineTo(0, window.innerHeight);
        ctx.fill();

        // Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        clouds.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 40 * c.size, 0, Math.PI*2);
            ctx.arc(c.x + 30*c.size, c.y - 10*c.size, 50*c.size, 0, Math.PI*2);
            ctx.arc(c.x + 60*c.size, c.y, 40*c.size, 0, Math.PI*2);
            ctx.fill();
        });

        // Grid / Crops
        crops.forEach(c => {
            const x = gridOffsetX + c.col * cellWidth;
            const y = gridOffsetY + c.row * cellHeight;
            c.draw(ctx, x, y, cellWidth, cellHeight);
        });

        // Particles
        particles.forEach(p => p.draw(ctx));
        floatTexts.forEach(t => t.draw(ctx));

        ctx.restore();
    }

    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        update(dt);
        draw();

        requestAnimationFrame(loop);
    }

    // Input Handling
    function handleInput(e) {
        // Always unlock audio
        audio.init();
        audio.unlock();

        if (gameState === 'MENU') {
            startGame();
            return;
        }
        
        if (gameState === 'GAMEOVER') {
            // Handled by button, but clicking screen can also restart if desired
            return;
        }

        if (gameState !== 'PLAYING') return;

        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        // Check crop hits
        let hit = false;
        for (let c of crops) {
            const cx = gridOffsetX + c.col * cellWidth;
            const cy = gridOffsetY + c.row * cellHeight;
            // Simple box collision for tap
            if (x > cx && x < cx + cellWidth && y > cy && y < cy + cellHeight) {
                if (c.state === STATE_RIPE) {
                    // Harvest Success
                    score += 10;
                    scoreEl.innerText = score;
                    c.reset();
                    spawnParticles(x, y, '#FFD700', 10, 'leaf');
                    spawnParticles(x, y, '#32CD32', 5, 'leaf');
                    floatTexts.push(new FloatText(x, y, '+10', '#FFD700'));
                    audio.playSfx('sfx_harvest', 0.4);
                    triggerGif(harvestGif, 'harvest');
                    hit = true;
                } else if (c.state === STATE_ROTTEN) {
                    // Rotten Clear
                    score = Math.max(0, score - 5);
                    scoreEl.innerText = score;
                    c.reset();
                    shake = 10;
                    spawnParticles(x, y, '#5D4037', 15, 'dirt');
                    floatTexts.push(new FloatText(x, y, '-5', '#5D4037'));
                    audio.playSfx('sfx_fail', 0.34);
                    triggerGif(failGif, 'fail');
                    hit = true;
                } else if (c.state === STATE_GROWING) {
                    // Penalty for picking too early
                    shake = 5;
                    // Don't reset, just shake/feedback
                    audio.playSfx('sfx_fail', 0.26);
                    triggerGif(failGif, 'fail', 900);
                    hit = true;
                }
                break;
            }
        }
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Bind to container to capture all
    const container = document.getElementById('game-container');
    
    // Pointer events for game interaction
    container.addEventListener('pointerdown', (e) => {
        // Only prevent default if it's on the canvas to avoid blocking UI buttons if they overlap
        if (e.target.tagName === 'CANVAS') e.preventDefault();
        handleInput(e);
    }, { passive: false });

    // Restart Button
    restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    // Start Screen Click
    startScreen.addEventListener('click', () => {
        startGame();
    });

    // Init
    initGame();
    resize();
    requestAnimationFrame(loop);
});
</script>
</body>
