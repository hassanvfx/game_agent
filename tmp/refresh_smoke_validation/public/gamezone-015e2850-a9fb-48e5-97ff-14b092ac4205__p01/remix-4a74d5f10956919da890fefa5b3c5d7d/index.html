:root{--void:#060817;--lunar:#dce9ff;--rose:#ff6ea9;--mint:#6ef7d8;--gold:#ffd978;--violet:#8f6cff;--panel:rgba(8,12,34,.74);--line:rgba(220,233,255,.22)}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#050713;color:#f7fbff;font-family:"Exo 2",system-ui,sans-serif;touch-action:manipulation}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 12%,rgba(255,110,169,.23),transparent 23%),linear-gradient(180deg,#101845 0%,#070a1b 55%,#02030a 100%)}button{font:inherit;color:inherit}.app{position:relative;width:100vw;height:100dvh;max-width:560px;overflow:hidden;background:linear-gradient(180deg,rgba(16,24,69,.85),rgba(4,7,18,.95));box-shadow:0 0 60px rgba(143,108,255,.28)}.moonfield{position:absolute;inset:0;pointer-events:none}.moon{position:absolute;right:-9vmin;top:5vmin;width:34vmin;height:34vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd8ee 52%,#8692bb);box-shadow:0 0 70px rgba(220,233,255,.38)}.moon:before,.moon:after{content:"";position:absolute;border-radius:50%;background:rgba(90,101,143,.28)}.moon:before{width:7vmin;height:7vmin;left:35%;top:22%}.moon:after{width:11vmin;height:11vmin;left:52%;top:56%}.dome{position:absolute;left:5%;right:5%;bottom:8%;height:23%;border:2px solid rgba(110,247,216,.22);border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(110,247,216,.08),rgba(255,110,169,.035));box-shadow:inset 0 0 35px rgba(110,247,216,.12)}.ridge{position:absolute;left:-10%;right:-10%;bottom:0;height:16%;background:linear-gradient(180deg,rgba(132,119,167,.45),#26213d 42%,#12101f);clip-path:polygon(0 53%,8% 45%,19% 58%,31% 35%,43% 55%,58% 30%,70% 52%,84% 38%,100% 54%,100% 100%,0 100%)}.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 3s infinite ease-in-out}.heart-orbit{position:absolute;border:1px solid rgba(255,110,169,.22);border-radius:50%;animation:orbit 18s linear infinite}.heart-orbit:after{content:"♥";position:absolute;right:8%;top:14%;color:var(--rose);text-shadow:0 0 12px var(--rose);font-size:1rem}.orbit-a{width:82vmin;height:22vmin;left:-20vmin;top:18vmin;transform:rotate(-13deg)}.orbit-b{width:70vmin;height:18vmin;right:-22vmin;top:43vmin;animation-duration:24s}.hud{position:absolute;z-index:3;left:14px;right:14px;top:max(10px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.brand{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(14px)}.hunter-badge{position:relative;width:48px;height:48px;flex:0 0 48px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 28%,#fff4be 0 10%,#6ef7d8 11% 22%,#25336b 23% 100%);box-shadow:0 0 0 3px rgba(255,110,169,.18),0 0 24px rgba(110,247,216,.34)}.hunter-badge:before,.hunter-badge:after{content:"";position:absolute;top:17px;width:8px;height:12px;background:#ff6ea9;border-radius:50%;box-shadow:0 0 10px #ff6ea9}.hunter-badge:before{left:13px}.hunter-badge:after{right:13px}.antenna{position:absolute;left:22px;top:-12px;width:4px;height:16px;border-radius:5px;background:#6ef7d8;transform:rotate(-15deg)}.antenna:after{content:"♥";position:absolute;left:-7px;top:-13px;color:#ff6ea9;font-size:15px}.brand h1{font-family:Orbitron,sans-serif;font-size:clamp(18px,4.4vw,25px);line-height:1;color:#fff;letter-spacing:.04em;text-shadow:0 0 14px rgba(255,110,169,.55)}.brand p{margin-top:4px;font-size:12px;font-weight:600;color:rgba(247,251,255,.78);text-transform:uppercase;letter-spacing:.08em}.stats{display:grid;gap:8px}.pill{min-width:94px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(8,12,34,.72);backdrop-filter:blur(12px);font-family:Orbitron,sans-serif;font-size:12px}.pill b{display:block;font-size:19px;color:var(--gold)}.stage{position:absolute;z-index:2;left:50%;top:54%;transform:translate(-50%,-50%);width:min(92vw,500px);padding:12px;border-radius:30px;background:linear-gradient(145deg,rgba(220,233,255,.16),rgba(255,110,169,.08));border:1px solid rgba(220,233,255,.22);box-shadow:0 22px 70px rgba(0,0,0,.35),inset 0 0 36px rgba(110,247,216,.06)}canvas{display:block;width:100%;height:auto;border-radius:22px;background:linear-gradient(180deg,rgba(8,15,45,.92),rgba(8,7,23,.96));touch-action:none;box-shadow:inset 0 0 0 2px rgba(110,247,216,.2)}.message{position:absolute;z-index:4;left:24px;right:24px;bottom:max(18px,env(safe-area-inset-bottom));padding:12px 14px;border:1px solid rgba(255,110,169,.28);border-radius:18px;background:rgba(8,12,34,.78);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.32);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.message strong{font-family:Orbitron,sans-serif;font-size:14px;color:#fff}.message span{display:block;margin-top:3px;font-size:12px;color:rgba(247,251,255,.76)}.restart{border:0;border-radius:14px;background:linear-gradient(135deg,var(--rose),var(--violet));padding:10px 12px;box-shadow:0 0 20px rgba(255,110,169,.28);cursor:pointer;font-weight:700;min-width:76px}.toast{position:absolute;z-index:5;left:50%;top:21%;transform:translate(-50%,-12px) scale(.96);opacity:0;transition:.22s ease;padding:9px 13px;border-radius:999px;background:rgba(255,110,169,.92);box-shadow:0 0 26px rgba(255,110,169,.45);font-family:Orbitron,sans-serif;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.audio-chip{position:absolute;z-index:4;right:14px;bottom:112px;border:1px solid var(--line);border-radius:999px;padding:8px 10px;background:rgba(8,12,34,.68);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:rgba(247,251,255,.74)}@keyframes twinkle{50%{opacity:.25;transform:scale(.65)}}@keyframes orbit{to{transform:rotate(347deg)}}@media(max-height:720px){.stage{top:56%;width:min(84vh,92vw)}.brand p{display:none}.message{padding:9px 10px}.audio-chip{display:none}}@media(max-width:390px){.hud{left:8px;right:8px}.brand{padding:8px}.hunter-badge{width:40px;height:40px;flex-basis:40px}.stats .pill{min-width:78px;font-size:10px}.pill b{font-size:16px}.stage{padding:8px}.message{left:10px;right:10px}.message strong{font-size:12px}}
</style></head><body><div class="app" id="app"><div class="moonfield" aria-hidden="true"><div class="moon"></div><div class="stars" id="stars"></div><div class="heart-orbit orbit-a"></div><div class="heart-orbit orbit-b"></div><div class="dome"></div><div class="ridge"></div></div><header class="hud"><section class="brand"><div class="hunter-badge"><i class="antenna"></i></div><div><h1>Lunar Heart Hunter</h1><p>match alien signals for the colony rendezvous</p></div></section><section class="stats"><div class="pill">Affinity<b id="score">0</b></div><div class="pill">Chain<b id="chain">0</b></div></section></header><main class="stage"><canvas id="board" width="720" height="720" aria-label="Match three alien moon tokens by swapping adjacent pieces"></canvas></main><div class="toast" id="toast">signal aligned</div><div class="audio-chip" id="audioChip">tap: romance comms offline</div><footer class="message"><div><strong id="statusTitle">Hunt with your heart.</strong><span id="statusText">Tap adjacent moon tokens to swap; make rows of three or more to send love signals.</span></div><button class="restart" id="restart">Restart</button></footer></div>
<script>(()=>{"use strict";const N=8,TYPES=6,SIZE=720,CELL=SIZE/N,palette=["#ff6ea9","#6ef7d8","#ffd978","#8f6cff","#dce9ff","#ff5571"],names=["Rose Beacon","Mint Comet","Vow Crystal","Violet Ring","Moon Pearl","Blush Flare"],canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),chainEl=document.getElementById("chain"),toast=document.getElementById("toast"),statusTitle=document.getElementById("statusTitle"),statusText=document.getElementById("statusText"),audioChip=document.getElementById("audioChip");let grid=[],selected=null,score=0,chain=0,busy=false,particles=[],lastT=0,audioReady=false,seed=7;const media={bgm:new Audio("https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3"),pick:new Audio("https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3"),bad:new Audio("https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3"),win:new Audio("https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3")};media.bgm.loop=true;media.bgm.volume=.16;media.pick.volume=.28;media.bad.volume=.22;media.win.volume=.3;function seededStars(){const s=document.getElementById("stars");for(let i=0;i<38;i++){const e=document.createElement("span");e.style.left=i*37%100+"%";e.style.top=8+i*61%78+"%";e.style.animationDelay=-(i%9)*.31+"s";s.appendChild(e)}}function rType(x,y){seed=(seed*1103515245+12345)&2147483647;return(seed+x*17+y*31+score*7+chain*11)%TYPES}function init(){score=0;chain=0;selected=null;busy=false;grid=[];seed=7;for(let y=0;y<N;y++){grid[y]=[];for(let x=0;x<N;x++){let t=(x*3+y*5+x*y)%TYPES;while((x>=2&&grid[y][x-1]===t&&grid[y][x-2]===t)||(y>=2&&grid[y-1][x]===t&&grid[y-2][x]===t))t=(t+1)%TYPES;grid[y][x]=t}}updateHud();setStatus("Hunt with your heart.","Tap adjacent moon tokens to swap; make rows of three or more to send love signals.")}function updateHud(){scoreEl.textContent=score;chainEl.textContent=chain}function setStatus(t,s){statusTitle.textContent=t;statusText.textContent=s}function showToast(txt){toast.textContent=txt;toast.classList.add("show");clearTimeout(showToast.to);showToast.to=setTimeout(()=>toast.classList.remove("show"),950)}function unlock(){if(audioReady)return;audioReady=true;audioChip.textContent="romance comms online";media.bgm.play().catch(()=>{audioReady=false;audioChip.textContent="audio ready after next tap"})}function beep(k){if(!audioReady)return;try{media[k].currentTime=0;media[k].play().catch(()=>{})}catch(e){}}function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s,y-s*.25,x-s*.45,y-s,x,y-s*.45);ctx.bezierCurveTo(x+s*.45,y-s,x+s,y-s*.25,x,y+s*.35);ctx.fill()}function drawToken(x,y,t,sel){const cx=x*CELL+CELL/2,cy=y*CELL+CELL/2,r=CELL*.34;ctx.save();ctx.translate(cx,cy);ctx.shadowColor=palette[t];ctx.shadowBlur=sel?26:12;ctx.fillStyle="rgba(255,255,255,.08)";ctx.beginPath();ctx.arc(0,0,r+7,0,Math.PI*2);ctx.fill();ctx.fillStyle=palette[t];if(t===0)heart(0,2,r*.82);else if(t===1){ctx.beginPath();ctx.ellipse(0,0,r*.62,r*.9,Math.PI/4,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(-r*.15,-r*.1,r*.38,0,Math.PI*2);ctx.stroke()}else if(t===2){ctx.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3,rr=i%2?r*.55:r*.95;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill()}else if(t===3){ctx.strokeStyle=palette[t];ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(0,0,r*.82,r*.45,-.45,0,Math.PI*2);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.2,0,Math.PI*2);ctx.fill()}else if(t===4){ctx.beginPath();ctx.arc(0,0,r*.86,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(20,28,68,.22)";ctx.beginPath();ctx.arc(-r*.15,-r*.2,r*.18,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*.9,-r*.05,r*.25,r*.95);ctx.quadraticCurveTo(0,r*.55,-r*.25,r*.95);ctx.quadraticCurveTo(-r*.9,-r*.05,0,-r);ctx.fill()}ctx.shadowBlur=0;ctx.strokeStyle=sel?"#fff":"rgba(255,255,255,.5)";ctx.lineWidth=sel?5:2;ctx.stroke();ctx.restore()}function draw(t){const dt=Math.min(32,t-lastT||16);lastT=t;ctx.clearRect(0,0,SIZE,SIZE);ctx.fillStyle="rgba(4,8,28,.84)";ctx.fillRect(0,0,SIZE,SIZE);ctx.strokeStyle="rgba(110,247,216,.09)";ctx.lineWidth=2;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,SIZE);ctx.moveTo(0,i*CELL);ctx.lineTo(SIZE,i*CELL);ctx.stroke()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawToken(x,y,grid[y][x],selected&&selected.x===x&&selected.y===y);particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.y-=p.vy*dt/16;ctx.globalAlpha=Math.max(0,p.life/620);ctx.fillStyle=p.c;ctx.font=`${p.s}px Orbitron`;ctx.fillText(p.txt,p.x,p.y)}ctx.globalAlpha=1;requestAnimationFrame(draw)}function cellFrom(ev){const r=canvas.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*SIZE,py=(ev.clientY-r.top)/r.height*SIZE;return{x:Math.floor(px/CELL),y:Math.floor(py/CELL)}}function adjacent(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1}function swap(a,b){const tmp=grid[a.y][a.x];grid[a.y][a.x]=grid[b.y][b.x];grid[b.y][b.x]=tmp}function findMatches(){const out=[],seen=new Set;for(let y=0;y<N;y++){let run=1;for(let x=1;x<=N;x++){if(x<N&&grid[y][x]===grid[y][x-1])run++;else{if(run>=3)for(let k=x-run;k<x;k++){const key=k+","+y;if(!seen.has(key)){seen.add(key);out.push({x:k,y})}}run=1}}}for(let x=0;x<N;x++){let run=1;for(let y=1;y<=N;y++){if(y<N&&grid[y][x]===grid[y-1][x])run++;else{if(run>=3)for(let k=y-run;k<y;k++){const key=x+","+k;if(!seen.has(key)){seen.add(key);out.push({x,y:k})}}run=1}}}return out}async function resolveMatches(){let matches=findMatches();if(!matches.length){chain=0;updateHud();return}busy=true;while(matches.length){chain++;score+=matches.length*10*chain;updateHud();setStatus("Love signal locked.",`${matches.length} alien tokens aligned for the moon-colony rendezvous.`);showToast(chain>1?`chain ${chain} vow burst`:`${names[grid[matches[0].y][matches[0].x]]} matched`);beep(chain>1?"win":"pick");for(const m of matches){particles.push({x:m.x*CELL+25,y:m.y*CELL+48,vy:1.3+chain*.15,life:620,c:palette[grid[m.y][m.x]],s:24,txt:"♥"});grid[m.y][m.x]=null}await wait(210);collapse();await wait(210);matches=findMatches()}busy=false}function collapse(){for(let x=0;x<N;x++){let col=[];for(let y=N-1;y>=0;y--)if(grid[y][x]!=null)col.push(grid[y][x]);for(let y=N-1;y>=0;y--)grid[y][x]=col[N-1-y]??rType(x,y)}}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function handle(ev){ev.preventDefault();unlock();if(busy)return;const c=cellFrom(ev);if(c.x<0||c.y<0||c.x>=N||c.y>=N)return;if(!selected){selected=c;setStatus("Choose a vow path.","Now tap an adjacent token to trade places.");return}if(selected.x===c.x&&selected.y===c.y){selected=null;return}if(!adjacent(selected,c)){selected=c;showToast("adjacent only");beep("bad");return}const a=selected,b=c;selected=null;swap(a,b);const matches=findMatches();if(!matches.length){swap(a,b);chain=0;updateHud();setStatus("Signal bounced.","That swap made no trio; the hunter keeps the old moon path.");showToast("no rendezvous");beep("bad");return}await resolveMatches()}canvas.addEventListener("pointerdown",handle,{passive:false});document.getElementById("restart").addEventListener("click",()=>{unlock();init();showToast("colony reset")});document.addEventListener("visibilitychange",()=>{if(document.hidden)media.bgm.pause();else if(audioReady)media.bgm.play().catch(()=>{})});seededStars();init();requestAnimationFrame(draw)})();</script></body></html>
