<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Night Courier Run</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #050510;
            --bg-deep: #02030a;
            --panel-bg: rgba(16, 18, 34, 0.82);
            --panel-border: rgba(62, 224, 255, 0.35);
            --panel-highlight: rgba(255, 92, 168, 0.18);
            --cyan: #49f3ff;
            --pink: #ff6ab7;
            --gold: #ffe16a;
            --white: #ffffff;
            --muted: rgba(225, 238, 255, 0.72);
            --danger: #ff5e7a;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 106, 183, 0.12), transparent 28%),
                radial-gradient(circle at 50% 30%, rgba(73, 243, 255, 0.12), transparent 32%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 55%, #13081f 100%);
            color: var(--white);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        .screen-fill { position: absolute; inset: 0; }
        .flex-center-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hud-bar {
            position: absolute;
            top: 1rem;
            left: 0;
            width: 100%;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .hud-block-left { text-align: left; }
        .hud-block-right { text-align: right; }
        .hud-label {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 0.875rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(73, 243, 255, 0.18);
        }
        .hud-label-cyan { color: var(--cyan); }
        .hud-label-pink { color: var(--pink); }
        .hud-value {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--white);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5), 0 0 18px rgba(73, 243, 255, 0.22);
        }
        .hud-unit { font-size: 0.875rem; }
        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(21, 26, 48, 0.96), rgba(9, 11, 23, 0.92)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 24px rgba(73, 243, 255, 0.16),
                0 0 50px rgba(255, 106, 183, 0.1),
                inset 0 0 24px rgba(0, 0, 0, 0.45);
            border-radius: 1rem;
            text-align: center;
            width: min(100%, 28rem);
            margin: 1rem;
            padding: 2.5rem;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(115deg, transparent 0 35%, rgba(73, 243, 255, 0.13) 48%, transparent 60%),
                radial-gradient(circle at top right, var(--panel-highlight), transparent 32%);
            pointer-events: none;
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(73, 243, 255, 0.88), 0 0 22px rgba(73, 243, 255, 0.65), 0 0 42px rgba(86, 94, 255, 0.4);
        }
        .title-text {
            margin: 0 0 0.5rem;
            color: var(--white);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.45rem, 8vw, 4rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: 0.08em;
        }
        .subtitle-text {
            margin: 0 0 2rem;
            color: #d8f6ff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        .control-grid {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            color: var(--muted);
            font-size: 0.875rem;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-key {
            width: 3rem;
            height: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.35rem;
            color: var(--white);
            background: linear-gradient(180deg, rgba(73, 243, 255, 0.14), rgba(255, 106, 183, 0.12));
            box-shadow: inset 0 0 12px rgba(255,255,255,0.04), 0 0 12px rgba(73, 243, 255, 0.12);
        }
        .control-caption {
            max-width: 5rem;
            line-height: 1.3;
        }
        .neon-button {
            width: 100%;
            border-radius: 999px;
            padding: 1rem 2rem;
            color: var(--white);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            background: linear-gradient(90deg, #ff4f9d 0%, #7c4dff 45%, #11c2ff 100%);
            box-shadow: 0 0 15px rgba(17, 194, 255, 0.45);
        }
        .neon-button:hover,
        .neon-button:focus-visible {
            box-shadow: 0 0 25px rgba(73, 243, 255, 0.7);
            transform: scale(1.05);
            filter: brightness(1.06);
        }
        .panel-heading {
            margin: 0 0 0.5rem;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.1rem, 7vw, 3.2rem);
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        .danger-text { color: var(--danger); }
        .panel-copy {
            color: #d1d5db;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .panel-score {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 2.25rem;
            color: var(--gold);
            margin-bottom: 2rem;
            text-shadow: 0 0 18px rgba(255, 225, 106, 0.3);
        }
        .feedback-stack {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
            z-index: 4;
            pointer-events: none;
        }
        .feedback-card {
            width: min(42vw, 8.5rem);
            padding: 0.45rem;
            border-radius: 1rem;
            background: rgba(7, 10, 18, 0.8);
            border: 1px solid rgba(73, 243, 255, 0.28);
            box-shadow: 0 0 18px rgba(73, 243, 255, 0.18);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-card.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.8rem;
        }
        .feedback-label {
            margin-top: 0.35rem;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #dffcff;
            text-align: center;
        }
        .status-pill {
            position: absolute;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            min-width: 12rem;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            background: rgba(7, 10, 18, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 18px rgba(255, 106, 183, 0.18);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 4;
        }
        .status-pill.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .status-pill-title {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
        }
        .status-pill-copy {
            font-size: 0.82rem;
            color: #d8f6ff;
        }
        .hidden { display: none !important; }
        #game-container { position: relative; width: 100%; height: 100%; }
        #ui-layer { pointer-events: none; }
        #start-screen, #game-over-screen { pointer-events: auto; }
        #touch-controls { display: none; touch-action: none; }
        #touch-controls.active { display: flex; }
        #touch-left, #touch-right { width: 50%; height: 100%; }
        @media (max-width: 640px) {
            .glass-panel { padding: 2rem 1.25rem; }
            .hud-bar { padding: 0 1rem; }
            .hud-value { font-size: 1.5rem; }
            .control-grid { gap: 0.75rem; }
            .control-key { width: 2.75rem; height: 2.75rem; }
            .title-text { font-size: clamp(2.1rem, 12vw, 3rem); }
            .subtitle-text { font-size: 0.9rem; }
            .neon-button { font-size: 0.95rem; padding: 0.95rem 1.25rem; }
            .feedback-stack {
                right: 0.55rem;
                bottom: 0.65rem;
                gap: 0.45rem;
            }
            .feedback-card {
                width: min(38vw, 6.5rem);
                padding: 0.35rem;
            }
            .feedback-label { font-size: 0.56rem; }
            .status-pill {
                min-width: auto;
                width: min(80vw, 18rem);
                bottom: 0.6rem;
                padding: 0.55rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="screen-fill flex-center-column">
            
            <!-- HUD -->
            <div id="hud" class="hud-bar hidden">
                <div class="hud-block-left">
                    <div class="hud-label hud-label-cyan">Route Score</div>
                    <div id="score" class="hud-value">0</div>
                </div>
                <div class="hud-block-right">
                    <div class="hud-label hud-label-pink">Courier Speed</div>
                    <div class="hud-value"><span id="speed-display">0</span> <span class="hud-unit">KM/H</span></div>
                </div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel">
                <h1 class="title-text neon-text">NIGHT COURIER</h1>
                <p class="subtitle-text">Deliver as far as the route stays open</p>
                
                <div class="control-grid">
                    <div class="control-item">
                        <div class="control-key">←</div>
                        <span class="control-caption">Drift left</span>
                    </div>
                    <div class="control-item">
                        <div class="control-key">↑</div>
                        <span class="control-caption">Push speed</span>
                    </div>
                    <div class="control-item">
                        <div class="control-key">→</div>
                        <span class="control-caption">Drift right</span>
                    </div>
                </div>

                <button id="start-btn" class="neon-button">START DELIVERY</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="panel-heading danger-text neon-text">DELIVERY LOST</h2>
                <div class="panel-copy">Route covered</div>
                <div class="panel-score"><span id="finalScore">0</span></div>
                <button id="restart-btn" class="neon-button">RUN IT AGAIN</button>
            </div>
            
        </div>

        <div id="status-pill" class="status-pill hidden" aria-live="polite">
            <div class="status-pill-title">Courier Feed</div>
            <div id="status-pill-copy" class="status-pill-copy">Hold the lane.</div>
        </div>

        <div class="feedback-stack" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: crash/pickup reaction overlays -> catalogs/gifs.json -->
            <div id="pickup-feedback" class="feedback-card hidden">
                <img src="https://i.giphy.com/l41lGU07rD3fMQxYQ.webp" alt="Neon bonus effect">
                <div class="feedback-label">Turbo Drop</div>
            </div>
            <div id="crash-feedback" class="feedback-card hidden">
                <img src="https://i.giphy.com/XrNry0aqYWEhi.webp" alt="Crash impact effect">
                <div class="feedback-label">Route Slam</div>
            </div>
        </div>
        
        <!-- Touch Controls Overlay for Mobile -->
        <div id="touch-controls" class="screen-fill">
            <div id="touch-left"></div>
            <div id="touch-right"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = new Map();
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                if (this.enabled) return;
                this.enabled = true;
                const warmups = Object.values(this.sfx).concat(this.bgm);
                warmups.forEach((clip) => {
                    try { clip.load(); } catch (_) {}
                });
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key, options = {}) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const debounce = options.debounce ?? 0;
                const lastPlayed = this.cooldowns.get(key) ?? 0;
                if (debounce && now - lastPlayed < debounce) return;
                this.cooldowns.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? 0.55;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score');
        const speedDisplayEl = document.getElementById('speed-display');
        const finalScoreEl = document.getElementById('finalScore');
        const hudEl = document.getElementById('hud');
        const gameOverScreenEl = document.getElementById('game-over-screen');
        const startScreenEl = document.getElementById('start-screen');
        const touchControlsEl = document.getElementById('touch-controls');
        const pickupFeedbackEl = document.getElementById('pickup-feedback');
        const crashFeedbackEl = document.getElementById('crash-feedback');
        const statusPillEl = document.getElementById('status-pill');
        const statusPillCopyEl = document.getElementById('status-pill-copy');
        
        let width, height;
        let gameActive = false;
        
        const FPS = 60;
        const STEP = 1 / FPS;
        const SEGMENT_LENGTH = 200;
        const RUMBLE_LENGTH = 3;
        const ROAD_WIDTH = 2000;
        const DRAW_DISTANCE = 300;
        const FIELD_OF_VIEW = 100;
        const CAMERA_HEIGHT = 1000;
        const CAMERA_DEPTH = 1 / Math.tan((FIELD_OF_VIEW / 2) * Math.PI / 180);
        
        let segments = [];
        let playerX = 0;
        let position = 0;
        let speed = 0;
        let maxSpeed = SEGMENT_LENGTH * 60;
        let accel = maxSpeed / 5;
        let breaking = -maxSpeed;
        let decel = -maxSpeed / 5;
        let offRoadDecel = -maxSpeed / 2;
        let offRoadLimit = maxSpeed / 4;
        let score = 0;
        let trackLength = 0;
        let nextPickupScore = 180;
        let warningCooldownUntil = 0;
        
        let keyLeft = false;
        let keyRight = false;
        let keyFaster = false;
        let keySlower = false;

        let skyOffset = 0;

        /** 4. UTILS */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function showStatus(message, duration = 1200) {
            statusPillCopyEl.textContent = message;
            statusPillEl.classList.remove('hidden');
            statusPillEl.classList.add('visible');
            clearTimeout(showStatus.timeoutId);
            showStatus.timeoutId = setTimeout(() => {
                statusPillEl.classList.remove('visible');
                statusPillEl.classList.add('hidden');
            }, duration);
        }

        function pulseFeedback(element, duration = 1300) {
            element.classList.remove('hidden');
            requestAnimationFrame(() => element.classList.add('visible'));
            clearTimeout(element._hideTimer);
            element._hideTimer = setTimeout(() => {
                element.classList.remove('visible');
                setTimeout(() => element.classList.add('hidden'), 220);
            }, duration);
        }

        /** 5. ROAD GENERATION */
        function addSegment(curve, y) {
            const n = segments.length;
            segments.push({
                index: n,
                p1: { world: { x: 0, y: lastY(), z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
                p2: { world: { x: 0, y: y, z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
                curve: curve,
                color: Math.floor(n / RUMBLE_LENGTH) % 2 ? 'DARK' : 'LIGHT',
                sprites: []
            });
        }

        function lastY() {
            return (segments.length === 0) ? 0 : segments[segments.length - 1].p2.world.y;
        }

        function resetRoad() {
            segments = [];
            const NUM_SEGMENTS = 2000;
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                let curve = 0;
                let y = 0;
                
                if (i > 50 && i < 300) curve = 2;
                if (i > 500 && i < 700) curve = -2;
                if (i > 900 && i < 1100) curve = 3;
                if (i > 1500 && i < 1700) curve = -3;

                if (i > 300 && i < 500) y = Math.sin(i / 10) * 1000;
                if (i > 1100 && i < 1300) y = Math.cos(i / 15) * 1500;

                addSegment(curve, y);
                
                if (i > 100 && i % 40 === 0 && Math.random() > 0.3) {
                    const offset = (Math.random() * 2 - 1) * 0.8;
                    segments[i].sprites.push({ x: offset, type: 'rock' });
                }
            }
            trackLength = segments.length * SEGMENT_LENGTH;
        }

        /** 6. RENDERING ENGINE */
        function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;
            p.screen.scale = cameraDepth / p.camera.z;
            p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
            p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
            p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
        }

        const COLORS = {
            SKY: '#050510',
            ROAD_LIGHT: '#1a1a2e',
            ROAD_DARK: '#16213e',
            GRASS_LIGHT: '#0f0f1a',
            GRASS_DARK: '#0a0a12',
            RUMBLE_LIGHT: '#00f2ff',
            RUMBLE_DARK: '#ff0055',
            LANE: 'rgba(255, 255, 255, 0.2)'
        };

        function drawBackground(ctx, width, height, skyOffset) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#000000');
            grad.addColorStop(0.5, '#1a0b2e');
            grad.addColorStop(1, '#2d1b4e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 0, 128, 0.2)';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2 + 50, 150, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2 + 50, 100, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i + skyOffset * 0.1, 0);
                ctx.lineTo(i + skyOffset * 0.05, height / 2);
                ctx.stroke();
            }
        }

        function drawPlayer(ctx, width, height, steer) {
            const destX = width / 2;
            const destY = height - 20;
            const w = width * 0.15;
            const h = w * 0.5;

            ctx.save();
            ctx.translate(destX, destY);
            ctx.rotate(steer * 0.1);

            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 6, w * 0.34, h * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();

            const wheelGlow = ctx.createRadialGradient(-w * 0.22, -h * 0.08, 2, -w * 0.22, -h * 0.08, w * 0.16);
            wheelGlow.addColorStop(0, 'rgba(73,243,255,0.95)');
            wheelGlow.addColorStop(1, 'rgba(73,243,255,0)');
            ctx.fillStyle = wheelGlow;
            ctx.beginPath();
            ctx.arc(-w * 0.22, -h * 0.08, w * 0.16, 0, Math.PI * 2);
            ctx.arc(w * 0.22, -h * 0.08, w * 0.16, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#49f3ff';
            ctx.lineWidth = Math.max(2, w * 0.02);
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#49f3ff';
            ctx.beginPath();
            ctx.arc(-w * 0.22, -h * 0.08, w * 0.11, 0, Math.PI * 2);
            ctx.arc(w * 0.22, -h * 0.08, w * 0.11, 0, Math.PI * 2);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0b1020';
            ctx.beginPath();
            ctx.moveTo(-w * 0.28, -h * 0.18);
            ctx.lineTo(-w * 0.04, -h * 0.52);
            ctx.lineTo(w * 0.2, -h * 0.52);
            ctx.lineTo(w * 0.3, -h * 0.18);
            ctx.lineTo(w * 0.06, -h * 0.06);
            ctx.lineTo(-w * 0.14, -h * 0.06);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ff5fb3';
            ctx.beginPath();
            ctx.moveTo(-w * 0.06, -h * 0.5);
            ctx.lineTo(w * 0.13, -h * 0.5);
            ctx.lineTo(w * 0.2, -h * 0.24);
            ctx.lineTo(-w * 0.02, -h * 0.24);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffe16a';
            ctx.beginPath();
            ctx.arc(w * 0.3, -h * 0.18, w * 0.05, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = Math.max(2, w * 0.015);
            ctx.beginPath();
            ctx.moveTo(-w * 0.14, -h * 0.08);
            ctx.lineTo(-w * 0.22, -h * 0.24);
            ctx.lineTo(-w * 0.02, -h * 0.24);
            ctx.lineTo(w * 0.07, -h * 0.08);
            ctx.stroke();

            ctx.fillStyle = '#49f3ff';
            ctx.beginPath();
            ctx.arc(-w * 0.08, -h * 0.62, w * 0.06, 0, Math.PI * 2);
            ctx.fill();

            if (speed > maxSpeed * 0.8) {
                ctx.fillStyle = '#49f3ff';
                ctx.shadowColor = '#49f3ff';
                ctx.shadowBlur = 14;
                const flicker = Math.random() * 10;
                ctx.beginPath();
                ctx.moveTo(-w * 0.28, -h * 0.16);
                ctx.lineTo(-w * 0.38, -h * 0.1);
                ctx.lineTo(-w * 0.31, 0 + flicker * 0.2);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function drawObstacle(ctx, x, y, scale) {
            const w = 400 * scale * width / 2;
            const h = 200 * scale * height / 2;

            ctx.save();
            ctx.translate(x, y);

            const glow = ctx.createLinearGradient(-w / 2, -h, w / 2, 0);
            glow.addColorStop(0, '#281133');
            glow.addColorStop(1, '#4e224d');
            ctx.fillStyle = glow;
            ctx.strokeStyle = '#ff6ab7';
            ctx.lineWidth = Math.max(2, scale * 8);

            ctx.beginPath();
            ctx.moveTo(-w / 2, 0);
            ctx.lineTo(-w * 0.28, -h);
            ctx.lineTo(w * 0.28, -h);
            ctx.lineTo(w / 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffe16a';
            ctx.beginPath();
            ctx.arc(0, -h * 0.55, Math.max(3, w * 0.06), 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(73,243,255,0.9)';
            ctx.beginPath();
            ctx.moveTo(-w * 0.2, -h * 0.42);
            ctx.lineTo(w * 0.2, -h * 0.42);
            ctx.moveTo(-w * 0.08, -h * 0.72);
            ctx.lineTo(w * 0.08, -h * 0.18);
            ctx.stroke();

            ctx.restore();
        }

        /** 7. GAME LOOP */
        function update(dt) {
            position = (position + speed * dt);
            while (position >= trackLength) position -= trackLength;
            while (position < 0) position += trackLength;

            const dx = dt * 2 * (speed / maxSpeed);
            if (keyLeft) playerX = playerX - dx;
            if (keyRight) playerX = playerX + dx;

            if (keyFaster) speed = speed + accel * dt;
            else if (keySlower) speed = speed + breaking * dt;
            else speed = speed + decel * dt;

            if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
                speed = speed + offRoadDecel * dt;
            }

            playerX = Math.max(-2, Math.min(2, playerX));
            speed = Math.max(0, Math.min(maxSpeed, speed));

            score += (speed * dt) / 100;
            scoreEl.innerText = Math.floor(score);
            speedDisplayEl.innerText = Math.floor(speed / 100);

            if (score >= nextPickupScore) {
                audio.playSFX('pickup', { debounce: 800, volume: 0.48 });
                pulseFeedback(pickupFeedbackEl, 1200);
                showStatus('Drop secured. Keep the neon line.', 1100);
                nextPickupScore += 180;
            }

            if ((playerX < -1 || playerX > 1) && speed > offRoadLimit * 0.92) {
                const now = performance.now();
                if (now > warningCooldownUntil) {
                    warningCooldownUntil = now + 1800;
                    audio.playSFX('warning', { debounce: 1500, volume: 0.42 });
                    showStatus('Edge of route. Pull back in.', 900);
                }
            }

            const currentSegmentIdx = Math.floor((position + 100) / SEGMENT_LENGTH) % segments.length;
            const currentSegment = segments[currentSegmentIdx];

            if (currentSegment.sprites.length > 0) {
                for (let i = 0; i < currentSegment.sprites.length; i++) {
                    const sprite = currentSegment.sprites[i];
                    const spriteW = 0.5;
                    if (playerX > sprite.x - spriteW && playerX < sprite.x + spriteW) {
                        if (speed > 500) {
                            crash();
                            return;
                        }
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            drawBackground(ctx, width, height, skyOffset);

            let baseSegment = segments[Math.floor(position / SEGMENT_LENGTH) % segments.length];
            let basePercent = (position % SEGMENT_LENGTH) / SEGMENT_LENGTH;
            let dx = -(baseSegment.curve * basePercent);
            let x = 0;
            let maxY = height;

            for (let n = 0; n < DRAW_DISTANCE; n++) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                let looped = segment.index < baseSegment.index;
                let camZ = position - (looped ? trackLength : 0);
                
                project(segment.p1, (playerX * ROAD_WIDTH) - x, CAMERA_HEIGHT, camZ, CAMERA_DEPTH, width, height, ROAD_WIDTH);
                project(segment.p2, (playerX * ROAD_WIDTH) - x - dx, CAMERA_HEIGHT, camZ, CAMERA_DEPTH, width, height, ROAD_WIDTH);

                x += dx;
                dx += segment.curve;

                if (segment.p1.camera.z <= CAMERA_DEPTH ||
                    segment.p2.screen.y >= maxY ||
                    segment.p2.screen.y >= segment.p1.screen.y) {
                    continue;
                }

                renderPolygon(ctx, segment.p1.screen.x, segment.p1.screen.y, segment.p1.screen.w, segment.p2.screen.x, segment.p2.screen.y, segment.p2.screen.w, segment.color);
                maxY = segment.p1.screen.y;
            }

            for (let n = DRAW_DISTANCE - 1; n > 0; n--) {
                let segment = segments[(baseSegment.index + n) % segments.length];
                if (segment.sprites.length > 0) {
                    for (let s = 0; s < segment.sprites.length; s++) {
                        let sprite = segment.sprites[s];
                        let spriteX = segment.p1.screen.x + (sprite.x * segment.p1.screen.w);
                        let spriteY = segment.p1.screen.y;
                        let spriteScale = segment.p1.screen.scale;
                        
                        if (spriteY < height && spriteY > height / 2) {
                            drawObstacle(ctx, spriteX, spriteY, spriteScale);
                        }
                    }
                }
            }

            drawPlayer(ctx, width, height, (keyLeft ? -1 : (keyRight ? 1 : 0)));
        }

        function renderPolygon(ctx, x1, y1, w1, x2, y2, w2, colorType) {
            ctx.fillStyle = (colorType === 'DARK') ? COLORS.GRASS_DARK : COLORS.GRASS_LIGHT;
            ctx.fillRect(0, y2, width, y1 - y2);

            let r1 = w1 / 4;
            let r2 = w2 / 4;
            ctx.fillStyle = (colorType === 'DARK') ? COLORS.RUMBLE_DARK : COLORS.RUMBLE_LIGHT;
            ctx.beginPath();
            ctx.moveTo(x1 - w1 - r1, y1);
            ctx.lineTo(x1 + w1 + r1, y1);
            ctx.lineTo(x2 + w2 + r2, y2);
            ctx.lineTo(x2 - w2 - r2, y2);
            ctx.fill();

            ctx.fillStyle = (colorType === 'DARK') ? COLORS.ROAD_DARK : COLORS.ROAD_LIGHT;
            ctx.beginPath();
            ctx.moveTo(x1 - w1, y1);
            ctx.lineTo(x1 + w1, y1);
            ctx.lineTo(x2 + w2, y2);
            ctx.lineTo(x2 - w2, y2);
            ctx.fill();

            if (colorType === 'DARK') {
                let l1 = w1 / 40;
                let l2 = w2 / 40;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(x1 - l1, y1);
                ctx.lineTo(x1 + l1, y1);
                ctx.lineTo(x2 + l2, y2);
                ctx.lineTo(x2 - l2, y2);
                ctx.fill();
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            update(STEP);
            render();
            skyOffset += speed * STEP * 0.005;
            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            score = 0;
            speed = 0;
            position = 0;
            playerX = 0;
            nextPickupScore = 180;
            warningCooldownUntil = 0;
            resetRoad();
        }

        function crash() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.58 });
            pulseFeedback(crashFeedbackEl, 1500);
            showStatus('Bike down. Dispatch is resetting.', 1500);
            hudEl.classList.add('hidden');
            gameOverScreenEl.classList.remove('hidden');
            finalScoreEl.innerText = Math.floor(score) + " m";
            touchControlsEl.classList.remove('active');
        }

        /** 8. INPUT HANDLING */
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowLeft': keyLeft = true; break;
                case 'ArrowRight': keyRight = true; break;
                case 'ArrowUp': keyFaster = true; break;
                case 'ArrowDown': keySlower = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.key) {
                case 'ArrowLeft': keyLeft = false; break;
                case 'ArrowRight': keyRight = false; break;
                case 'ArrowUp': keyFaster = false; break;
                case 'ArrowDown': keySlower = false; break;
            }
        });

        const touchLeft = document.getElementById('touch-left');
        const touchRight = document.getElementById('touch-right');

        const touchListenerOptions = { passive: false };
        const releaseTouchControls = () => {
            keyLeft = false;
            keyRight = false;
            keyFaster = false;
        };

        touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keyLeft = true; keyFaster = true; }, touchListenerOptions);
        touchLeft.addEventListener('touchend', (e) => { e.preventDefault(); keyLeft = false; keyFaster = false; }, touchListenerOptions);
        touchLeft.addEventListener('touchcancel', releaseTouchControls, touchListenerOptions);
        
        touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); keyRight = true; keyFaster = true; }, touchListenerOptions);
        touchRight.addEventListener('touchend', (e) => { e.preventDefault(); keyRight = false; keyFaster = false; }, touchListenerOptions);
        touchRight.addEventListener('touchcancel', releaseTouchControls, touchListenerOptions);

        function startRun() {
            audio.unlock();
            audio.playSFX('click', { volume: 0.38, debounce: 150 });
            audio.playSFX('start', { volume: 0.5, debounce: 150 });
            audio.playBGM();
            startScreenEl.classList.add('hidden');
            gameOverScreenEl.classList.add('hidden');
            hudEl.classList.remove('hidden');
            touchControlsEl.classList.add('active');
            pickupFeedbackEl.classList.add('hidden');
            crashFeedbackEl.classList.add('hidden');
            gameActive = true;
            initGame();
            showStatus('Route live. Hit the corners clean.', 1400);
            gameLoop();
        }

        /** 9. UI CONTROL */
        document.getElementById('start-btn').addEventListener('click', startRun);

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', { volume: 0.38, debounce: 150 });
            startRun();
        });

    });
    </script>
</body>
</html>
