<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Right or Else</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #120f24;
            --bg-mid: #251b45;
            --counter-top: #7a5a43;
            --counter-front: #b98758;
            --panel: rgba(24, 19, 49, 0.86);
            --panel-strong: rgba(39, 29, 77, 0.96);
            --panel-outline: #fff1bf;
            --text-main: #fff8dc;
            --text-soft: #ffeab1;
            --danger: #ff5c72;
            --danger-dark: #b52143;
            --success: #52d67e;
            --accent: #6ce7ff;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #40306e 0%, #1e173c 40%, #120f24 78%),
                linear-gradient(180deg, #100d20, #1a1432);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
            border: 0;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .ui-overlay {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 241, 191, 0.12), transparent 36%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.2));
        }

        .ui-overlay::before,
        .ui-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ui-overlay::before {
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 100%);
            background-size: 34px 34px;
            opacity: 0.28;
        }

        .ui-overlay::after {
            background: radial-gradient(circle at center, transparent 58%, rgba(0, 0, 0, 0.22) 100%);
        }

        .panel {
            background: linear-gradient(180deg, rgba(44, 31, 87, 0.97), rgba(19, 15, 40, 0.97));
            border: 3px solid var(--panel-outline);
            border-radius: 20px;
            box-shadow:
                0 10px 24px var(--shadow),
                inset 0 0 0 2px rgba(255, 255, 255, 0.06);
        }

        .glass {
            background: linear-gradient(180deg, rgba(36, 27, 70, 0.96), rgba(20, 17, 39, 0.95));
            border: 4px solid var(--panel-outline);
            box-shadow:
                0 12px 0 rgba(11, 7, 24, 0.85),
                0 22px 38px rgba(0, 0, 0, 0.35);
            border-radius: 24px;
        }

        .hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-pill {
            padding: 12px 14px 10px;
            border-radius: 999px;
            border: 3px solid var(--panel-outline);
            background: linear-gradient(180deg, rgba(31, 24, 63, 0.96), rgba(17, 13, 36, 0.96));
            color: var(--text-main);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            font-size: 12px;
            line-height: 1.2;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        .hud-score {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .hud-score-badge {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            background: linear-gradient(180deg, #ffcf66, #f88430);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22);
        }

        .warning-msg {
            background: linear-gradient(180deg, #ff7d88, #db294f);
            color: #fffdf3;
            animation: pulseRush 0.95s ease-in-out infinite;
        }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 12px;
            z-index: 11;
        }

        .food-btn {
            position: relative;
            width: min(25vw, 104px);
            height: min(25vw, 104px);
            min-width: 86px;
            min-height: 86px;
            border-radius: 24px;
            border: 3px solid rgba(255, 251, 220, 0.72);
            border-bottom-width: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
            box-shadow:
                0 14px 22px rgba(0, 0, 0, 0.28),
                inset 0 2px 0 rgba(255, 255, 255, 0.22);
            transition: transform 120ms ease, filter 120ms ease, border-bottom-width 120ms ease;
        }

        .food-btn:active,
        .food-btn.scale-90 {
            transform: translateY(4px) scale(0.96);
            border-bottom-width: 3px;
            filter: brightness(1.08);
        }

        .food-btn .emoji {
            font-size: clamp(2rem, 7vw, 3rem);
            transform: translateY(-2px);
        }

        .food-btn .food-tag {
            position: absolute;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            letter-spacing: 0.5px;
            opacity: 0.92;
            white-space: nowrap;
        }

        .food-btn.burger {
            background: linear-gradient(180deg, #ffba53, #ec6d2f);
            border-color: #ffe4a8;
        }

        .food-btn.pizza {
            background: linear-gradient(180deg, #ffe066, #f1a122);
            border-color: #fff0a8;
        }

        .food-btn.salad {
            background: linear-gradient(180deg, #70e58e, #29aa5b);
            border-color: #d9ffd8;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 20;
            background: rgba(8, 7, 19, 0.52);
            backdrop-filter: blur(8px);
        }

        .screen-card {
            width: min(100%, 430px);
            padding: 22px 18px 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top center, rgba(108, 231, 255, 0.13), transparent 36%),
                radial-gradient(circle at bottom left, rgba(255, 92, 114, 0.12), transparent 32%);
            pointer-events: none;
        }

        .screen-inner {
            position: relative;
            z-index: 1;
        }

        .title-kicker {
            display: inline-block;
            padding: 8px 12px 6px;
            border-radius: 999px;
            margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.09);
            color: var(--text-soft);
            font-size: 10px;
        }

        .title-main {
            margin: 0 0 10px;
            font-family: 'Bangers', system-ui, sans-serif;
            font-size: clamp(2.4rem, 11vw, 4rem);
            line-height: 0.9;
            letter-spacing: 1px;
            color: #fff4c2;
            text-shadow:
                0 4px 0 #8a3f1c,
                0 10px 22px rgba(0, 0, 0, 0.3);
        }

        .title-main .accent {
            color: #ff727d;
        }

        .screen-copy {
            margin: 0 auto 18px;
            max-width: 300px;
            font-size: 11px;
            line-height: 1.7;
            color: #fff4cf;
        }

        .hero-strip {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 0 0 18px;
        }

        .hero-chip {
            min-width: 76px;
            padding: 10px 8px 8px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
            border: 2px solid rgba(255, 248, 220, 0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .hero-chip .hero-emoji {
            display: block;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .hero-chip .hero-label {
            font-size: 8px;
            color: var(--text-soft);
        }

        .arcade-btn {
            width: 100%;
            padding: 16px 12px 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, #68e28d, #29b75d);
            border: 3px solid #ebffcf;
            border-bottom-width: 8px;
            color: #112517;
            font-family: 'Bangers', system-ui, sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.28);
            transition: transform 140ms ease, border-bottom-width 140ms ease, filter 140ms ease;
        }

        .arcade-btn:active {
            transform: translateY(4px);
            border-bottom-width: 3px;
            filter: brightness(1.05);
        }

        .danger-screen {
            background: rgba(61, 6, 20, 0.72);
        }

        .danger-card {
            background: linear-gradient(180deg, rgba(68, 15, 34, 0.96), rgba(34, 10, 18, 0.97));
        }

        .stamp-title {
            display: inline-block;
            margin: 0 0 14px;
            padding: 10px 14px 8px;
            border: 4px solid #ff9aaa;
            border-radius: 14px;
            color: #ffd8de;
            background: rgba(255, 92, 114, 0.15);
            font-family: 'Bangers', system-ui, sans-serif;
            font-size: clamp(2.3rem, 12vw, 4rem);
            line-height: 0.9;
            letter-spacing: 1px;
            transform: rotate(-9deg);
            text-shadow: 0 3px 0 rgba(122, 19, 44, 0.9);
        }

        .result-score {
            margin: 18px 0 20px;
            font-size: 1rem;
            color: #fff0bd;
        }

        .result-score strong {
            display: inline-block;
            margin-left: 8px;
            font-size: 1.5rem;
            color: #fff;
        }

        .subcopy {
            font-size: 11px;
            line-height: 1.6;
            color: #ffe4e7;
        }

        .spark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .spark {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
            animation: sparkFloat 1.8s ease-in-out infinite;
        }

        .spark:nth-child(1) { left: 16%; top: 72%; }
        .spark:nth-child(2) { left: 28%; top: 18%; animation-delay: 0.25s; }
        .spark:nth-child(3) { left: 79%; top: 22%; animation-delay: 0.5s; }
        .spark:nth-child(4) { left: 70%; top: 74%; animation-delay: 0.8s; }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.18; }
            50% { transform: translateY(-12px) scale(1.1); opacity: 0.75; }
        }

        @keyframes pulseRush {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.08); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-anim { animation: shake 0.5s; }

        @keyframes stamp {
            0% { transform: scale(3) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1) rotate(-15deg); opacity: 1; }
            70% { transform: scale(1.1) rotate(-15deg); }
            100% { transform: scale(1) rotate(-15deg); }
        }

        .stamp-anim { animation: stamp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .feedback-gif {
            position: absolute;
            right: 14px;
            top: 86px;
            width: min(26vw, 108px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 3px solid rgba(255, 241, 191, 0.62);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
            background: rgba(22, 17, 44, 0.78);
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 9;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            top: auto;
            bottom: calc(132px + env(safe-area-inset-bottom, 0px));
            right: 18px;
            width: min(30vw, 120px);
        }

        @media (max-width: 520px) {
            .hud {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .hud-pill {
                padding: 10px 12px 8px;
                font-size: 10px;
            }

            .controls {
                gap: 10px;
                padding: 0 10px;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            }

            .food-btn {
                width: min(28vw, 96px);
                height: min(28vw, 96px);
                min-width: 82px;
                min-height: 82px;
                border-radius: 20px;
            }

            .screen-card {
                padding: 20px 14px 16px;
            }

            .feedback-gif {
                top: 78px;
                right: 10px;
                width: min(24vw, 88px);
            }

            .feedback-gif.fail {
                right: 12px;
                bottom: calc(118px + env(safe-area-inset-bottom, 0px));
                width: min(26vw, 96px);
            }

            .hero-chip {
                min-width: 68px;
                padding: 8px 6px 7px;
            }
        }
    </style>
</head>

<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" loop preload="auto"></audio>

                <div class="title-kicker">CHEF EXPRESS • MATCH FAST</div>
                <h1 class="title-main">ORDER <span class="accent">RUSH</span> RELAY</h1>
                <p class="screen-copy">Snap the right meal to the front customer before the kitchen line melts down.</p>
                <div class="hero-strip">
                    <div class="hero-chip"><span class="hero-emoji">🍔</span><span class="hero-label">BURGER</span></div>
                    <div class="hero-chip"><span class="hero-emoji">🍕</span><span class="hero-label">PIZZA</span></div>

<script>
window.gameConfigDefs = {
    "patienceDecay": { "type": "number", "label": "Patience Decay Speed", "value": 10, "min": 5, "max": 30 },
    "spawnRate": { "type": "number", "label": "Spawn Rate (ms)", "value": 2000, "min": 500, "max": 3000 },
    "themeColor": { "type": "color", "label": "Kitchen Color", "value": "#f0f4f8" }
};
window.gameConfig = {
    patienceDecay: 10,
    spawnRate: 2000,
    themeColor: "#f0f4f8"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.masterGain = null;
        this.sfxGain = null;
        this.lastPlayed = {};
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.74;
        this.masterGain.connect(this.ctx.destination);
        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.7;
        this.sfxGain.connect(this.masterGain);

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                document.removeEventListener('pointerdown', unlock);
                document.removeEventListener('keydown', unlock);
            });
        };

        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);

        this.loadSound('sfx_success', 'success');
        this.loadSound('sfx_fail', 'fail');
        this.loadSound('sfx_chop', 'pickup');
        this.loadSound('sfx_warning', 'warning');
        this.loadSound('sfx_ui', 'click');
    }

    loadSound(id, fallback) {
        const el = document.getElementById(id);
        if (el && el.src) {
            this.buffers[id] = { type: 'media', element: el, fallback };
        } else {
            this.buffers[id] = fallback;
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.28;
        el.play().catch(() => {});
    }

    playSfx(id) {
        if (!this.ctx || !this.unlocked) return;
        const now = performance.now();
        if (this.lastPlayed[id] && now - this.lastPlayed[id] < 90) return;
        this.lastPlayed[id] = now;
        const buffer = this.buffers[id];
        if (buffer && typeof buffer !== 'string' && buffer.type === 'media' && buffer.element) {
            const clone = buffer.element.cloneNode();
            clone.volume = Math.min(buffer.element.loop ? 0.2 : 0.75, 0.75);
            clone.play().catch(() => {
                this.synthesize(buffer.fallback || 'beep');
            });
        } else {
            this.synthesize(buffer || 'beep');
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.connect(gain);
        gain.connect(this.sfxGain || this.ctx.destination);

        if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(54, now + 0.34);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.34);
            osc.start(now);
            osc.stop(now + 0.34);
        } else if (type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(740, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(760, now + 0.09);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
        } else if (type === 'pickup' || type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(type === 'success' ? 660 : 520, now);
            osc.frequency.exponentialRampToValueAtTime(type === 'success' ? 1040 : 760, now + 0.12);
            gain.gain.setValueAtTime(type === 'success' ? 0.16 : 0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(580, now);
            osc.frequency.exponentialRampToValueAtTime(930, now + 0.12);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        }
    }
}

const audio = new AudioManager();

document.addEventListener('DOMContentLoaded', () => {
    const successGif = document.getElementById('success-gif');
    const failGif = document.getElementById('fail-gif');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let state = {
        mode: 'MENU',
        score: 0,
        lastTime: 0,
        customers: [],
        particles: [],
        shake: 0,
        nextSpawn: 0,
        difficulty: 1,
        chef: { x: 0, y: 0, targetX: 0, state: 'IDLE', bob: 0 },
        dimensions: { w: 0, h: 0 },
        feedbackTimers: { success: null, fail: null },
        warningCooldownUntil: 0
    };

    const TYPES = ['BURGER', 'PIZZA', 'SALAD'];
    const COLORS = {
        BURGER: '#ef7b45',
        PIZZA: '#f3ba2f',
        SALAD: '#42c96b'
    };
    const FOOD_EMOJI = {
        BURGER: '🍔',
        PIZZA: '🍕',
        SALAD: '🥗'
    };

    function showGif(kind, duration = 900) {
        const target = kind === 'success' ? successGif : failGif;
        if (!target) return;
        const key = kind === 'success' ? 'success' : 'fail';
        target.classList.add('visible');
        const bust = `t=${Date.now()}`;
        target.src = `${target.src.split('?')[0]}?${bust}`;
        clearTimeout(state.feedbackTimers[key]);
        state.feedbackTimers[key] = setTimeout(() => {
            target.classList.remove('visible');
        }, duration);
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = document.getElementById('game-container').getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        state.dimensions.w = rect.width;
        state.dimensions.h = rect.height;

        if (state.mode === 'MENU') {
            state.chef.x = rect.width / 2;
            state.chef.targetX = rect.width / 2;
            state.chef.y = rect.height - 150;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function loop(t) {
        const dt = Math.min((t - state.lastTime) / 1000, 0.1);
        state.lastTime = t;

        try {
            update(dt, t / 1000);
            draw(t / 1000);
        } catch (e) {
            console.error(e);
        }
        requestAnimationFrame(loop);
    }

    function update(dt, time) {
        if (state.mode !== 'PLAY') return;

        if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 30);

        state.difficulty += dt * 0.05;
        const currentSpawnRate = Math.max(500, window.gameConfig.spawnRate - state.difficulty * 100);
        const currentPatienceDecay = window.gameConfig.patienceDecay + state.difficulty * 2;

        if (time > state.nextSpawn) {
            spawnCustomer();
            state.nextSpawn = time + currentSpawnRate / 1000;
        }

        const targetXBase = state.dimensions.w / 2;
        const targetYBase = state.dimensions.h - 300;

        for (let i = state.customers.length - 1; i >= 0; i--) {
            const c = state.customers[i];

            let tx, ty;
            if (i === 0) {
                tx = targetXBase;
                ty = targetYBase;
            } else {
                const spot = i;
                tx = targetXBase - (spot * 120);
                ty = targetYBase;
            }

            const speed = 5;
            c.x += (tx - c.x) * speed * dt;
            c.y += (ty - c.y) * speed * dt;
            c.wobble += dt * (3 + i * 0.3);

            if (i === 0) {
                c.patience -= currentPatienceDecay * dt;
                if (c.patience <= 0) {
                    gameOver("The queue stalled out!");
                }
            }
        }

        for (let i = state.particles.length - 1; i >= 0; i--) {
            const p = state.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 800 * dt;
            p.life -= dt;
            if (p.life <= 0) state.particles.splice(i, 1);
        }

        state.chef.x += (state.chef.targetX - state.chef.x) * 10 * dt;
        state.chef.bob += dt * 6;

        const front = state.customers[0];
        const warningEl = document.getElementById('warning-msg');
        if (front && front.patience < 30) {
            warningEl.style.display = 'block';
            if (performance.now() > state.warningCooldownUntil) {
                audio.playSfx('sfx_warning');
                state.warningCooldownUntil = performance.now() + 1400;
            }
        } else {
            warningEl.style.display = 'none';
        }
    }

    function draw(time) {
        const w = state.dimensions.w;
        const h = state.dimensions.h;

        ctx.save();
        if (state.shake > 0) {
            const dx = (Math.random() - 0.5) * state.shake * 10;
            const dy = (Math.random() - 0.5) * state.shake * 10;
            ctx.translate(dx, dy);
        }

        drawBackground(ctx, w, h, time);
        state.customers.forEach((c, index) => {
            drawCustomer(ctx, c, index === 0);
        });
        drawChef(ctx, state.chef, time);

        state.particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    function drawBackground(ctx, w, h, time) {
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, '#2a2250');
        bg.addColorStop(0.5, '#1c1739');
        bg.addColorStop(1, '#130f25');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 14; i++) {
            const px = (i * 97 + (time * 18)) % (w + 80) - 40;
            const py = 50 + (i % 5) * 42 + Math.sin(time * 1.4 + i) * 4;
            ctx.fillStyle = 'rgba(255, 240, 180, 0.08)';
            ctx.beginPath();
            ctx.arc(px, py, 3 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        const tileSize = 52;
        for (let x = 0; x < w; x += tileSize) {
            for (let y = 0; y < h; y += tileSize) {
                if ((Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0) {
                    ctx.fillRect(x, y, tileSize, tileSize);
                }
            }
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.fillRect(0, h - 330, w, 6);

        ctx.fillStyle = '#6f4d35';
        ctx.fillRect(0, h - 250, w, 22);

        const topGloss = ctx.createLinearGradient(0, h - 250, 0, h - 228);
        topGloss.addColorStop(0, '#d2a472');
        topGloss.addColorStop(1, '#8e6746');
        ctx.fillStyle = topGloss;
        ctx.fillRect(0, h - 248, w, 20);

        const frontGrad = ctx.createLinearGradient(0, h - 230, 0, h);
        frontGrad.addColorStop(0, '#c48c57');
        frontGrad.addColorStop(1, '#8f633d');
        ctx.fillStyle = frontGrad;
        ctx.fillRect(0, h - 230, w, 230);

        for (let i = 0; i < 6; i++) {
            const shelfX = 34 + i * ((w - 68) / 6);
            ctx.fillStyle = 'rgba(255, 245, 219, 0.12)';
            ctx.fillRect(shelfX, h - 208, 6, 190);
        }

        drawKitchenLights(ctx, w, h, time);
    }

    function drawKitchenLights(ctx, w, h, time) {
        const positions = [0.18, 0.5, 0.82];
        positions.forEach((pct, idx) => {
            const x = w * pct;
            const glow = 26 + Math.sin(time * 2 + idx) * 3;
            ctx.fillStyle = 'rgba(255, 237, 181, 0.12)';
            ctx.beginPath();
            ctx.arc(x, 78, glow * 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffefb0';
            ctx.beginPath();
            ctx.arc(x, 78, glow, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 44);
            ctx.stroke();
        });
    }

    function drawCustomer(ctx, c, isActive) {
        const x = c.x;
        const y = c.y + Math.sin(c.wobble) * 2;
        const impatience = Math.max(0, 1 - c.patience / 100);

        ctx.save();

        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.beginPath();
        ctx.ellipse(x, y + 52, 35, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.roundRect(x - 34, y - 10, 68, 54, 22);
        ctx.fill();

        ctx.fillStyle = c.apron;
        ctx.beginPath();
        ctx.roundRect(x - 26, y + 8, 52, 28, 16);
        ctx.fill();

        ctx.fillStyle = c.face;
        ctx.beginPath();
        ctx.arc(x, y - 8, 30, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = c.hair;
        ctx.beginPath();
        ctx.arc(x, y - 16, 31, Math.PI, 0);
        ctx.lineTo(x + 31, y - 8);
        ctx.quadraticCurveTo(x, y - 28, x - 31, y - 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 11, y - 10, 7, 0, Math.PI * 2);
        ctx.arc(x + 11, y - 10, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1b1532';
        if (c.patience < 30 && isActive) {
            ctx.fillRect(x - 15, y - 12, 9, 2.5);
            ctx.fillRect(x + 6, y - 12, 9, 2.5);
        } else {
            ctx.beginPath();
            ctx.arc(x - 11, y - 10, 2.8, 0, Math.PI * 2);
            ctx.arc(x + 11, y - 10, 2.8, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1b1532';
        ctx.beginPath();
        if (c.patience < 30 && isActive) {
            ctx.moveTo(x - 10, y + 6);
            ctx.lineTo(x + 10, y + 6);
        } else {
            ctx.arc(x, y + 3, 9, 0.15, Math.PI - 0.15);
        }
        ctx.stroke();

        ctx.fillStyle = c.badge;
        ctx.beginPath();
        ctx.roundRect(x - 12, y + 10, 24, 16, 8);
        ctx.fill();

        ctx.font = '700 12px "Exo 2"';
        ctx.fillStyle = '#fffdf4';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.marker, x, y + 19);

        if (isActive) {
            const bx = x + 48;
            const by = y - 54;

            ctx.fillStyle = '#fff9e1';
            ctx.beginPath();
            ctx.moveTo(x + 18, y - 15);
            ctx.lineTo(bx - 8, by + 18);
            ctx.lineTo(bx + 8, by + 18);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.roundRect(bx - 34, by - 30, 68, 60, 24);
            ctx.fill();

            ctx.strokeStyle = '#4b3654';
            ctx.lineWidth = 3;
            ctx.stroke();

            drawFoodIcon(ctx, bx, by, c.type, 22);

            const barW = 68;
            const barH = 10;
            ctx.fillStyle = 'rgba(15, 10, 25, 0.25)';
            ctx.beginPath();
            ctx.roundRect(x - barW / 2, y - 60, barW, barH, 999);
            ctx.fill();

            const pct = Math.max(0, c.patience / 100);
            const patienceColor = pct < 0.3 ? '#ff5c72' : pct < 0.55 ? '#ffd34d' : '#52d67e';
            ctx.fillStyle = patienceColor;
            ctx.beginPath();
            ctx.roundRect(x - barW / 2, y - 60, barW * pct, barH, 999);
            ctx.fill();

            if (impatience > 0.6) {
                ctx.strokeStyle = 'rgba(255, 92, 114, 0.45)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(x, y - 8, 38 + Math.sin(c.wobble * 2) * 1.5, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function drawChef(ctx, chef, time) {
        const x = chef.x;
        const y = chef.y + Math.sin(chef.bob || time * 6) * 1.8;

        if (chef.state === 'FIRED') return;

        ctx.save();

        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(x, y + 76, 40, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff7df';
        ctx.beginPath();
        ctx.arc(x, y - 18, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1f173d';
        ctx.beginPath();
        ctx.arc(x, y - 22, 28, Math.PI, 0);
        ctx.lineTo(x + 28, y - 18);
        ctx.quadraticCurveTo(x, y - 38, x - 28, y - 18);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(x - 26, y - 87, 52, 26, 10);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - 16, y - 87, 15, Math.PI, 0);
        ctx.arc(x, y - 96, 18, Math.PI, 0);
        ctx.arc(x + 18, y - 88, 14, Math.PI, 0);
        ctx.fill();
        ctx.strokeStyle = '#e7ddff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#f8fbff';
        ctx.beginPath();
        ctx.roundRect(x - 32, y + 4, 64, 58, 20);
        ctx.fill();

        const coatGrad = ctx.createLinearGradient(x, y + 4, x, y + 62);
        coatGrad.addColorStop(0, '#ffffff');
        coatGrad.addColorStop(1, '#dce8ff');
        ctx.fillStyle = coatGrad;
        ctx.beginPath();
        ctx.roundRect(x - 26, y + 8, 52, 50, 18);
        ctx.fill();

        ctx.fillStyle = '#ff5d72';
        ctx.beginPath();
        ctx.moveTo(x - 16, y + 10);
        ctx.quadraticCurveTo(x, y + 28, x + 16, y + 10);
        ctx.lineTo(x, y + 16);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#2c2252';
        ctx.beginPath();
        ctx.arc(x - 10, y - 20, 3, 0, Math.PI * 2);
        ctx.arc(x + 10, y - 20, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#2c2252';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y - 12, 8, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.fillStyle = '#ffd76c';
        ctx.beginPath();
        ctx.roundRect(x + 30, y + 12, 10, 34, 4);
        ctx.fill();

        ctx.fillStyle = '#c1f082';
        ctx.beginPath();
        ctx.moveTo(x + 34, y + 10);
        ctx.lineTo(x + 52, y + 24);
        ctx.lineTo(x + 34, y + 38);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawFoodIcon(ctx, x, y, type, size) {
        ctx.save();
        ctx.translate(x, y);
        if (type === 'BURGER') {
            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.arc(0, -4, size / 1.55, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(-size / 1.45, -2, size * 1.38, 7);
            ctx.fillStyle = '#facc15';
            ctx.fillRect(-size / 1.45, -5, size * 1.38, 3);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(-size / 1.45, -8, size * 1.38, 3);
            ctx.fillStyle = '#d97706';
            ctx.fillRect(-size / 1.45, 6, size * 1.38, 7);
        } else if (type === 'PIZZA') {
            ctx.fillStyle = '#f6d94f';
            ctx.beginPath();
            ctx.moveTo(0, size);
            ctx.lineTo(-size, -size / 2);
            ctx.lineTo(size, -size / 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ef6d55';
            ctx.fillRect(-size, -size / 2 - 2, size * 2, 4);
            ctx.fillStyle = '#d83743';
            ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-6, -5, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -6, 3, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'SALAD') {
            ctx.fillStyle = '#f9f8ee';
            ctx.beginPath();
            ctx.arc(0, 6, size / 1.15, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#38c96b';
            ctx.beginPath();
            ctx.arc(0, -1, size / 1.5, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#ef5e5e';
            ctx.beginPath(); ctx.arc(5, -5, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffdb57';
            ctx.beginPath(); ctx.arc(-6, -3, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    function spawnCustomer() {
        if (state.customers.length > 5) return;
        const type = TYPES[Math.floor(Math.random() * TYPES.length)];
        const palette = [
            { body: '#7dc8ff', face: '#ffe3c7', hair: '#3d275e', apron: '#5a76ff', badge: '#ff7b74', marker: '1' },
            { body: '#ff9f76', face: '#ffd9ba', hair: '#62321d', apron: '#ffce54', badge: '#6be28a', marker: '2' },
            { body: '#9be39f', face: '#f6d3b8', hair: '#27304f', apron: '#ff6c93', badge: '#6ce7ff', marker: '3' },
            { body: '#dd9eff', face: '#ffd8c0', hair: '#48265e', apron: '#61d1a1', badge: '#ffd96c', marker: '4' }
        ];
        const look = palette[Math.floor(Math.random() * palette.length)];

        state.customers.push({
            x: -100,
            y: state.dimensions.h - 300,
            type: type,
            color: look.body,
            face: look.face,
            hair: look.hair,
            apron: look.apron,
            badge: look.badge,
            marker: look.marker,
            patience: 100,
            wobble: Math.random() * Math.PI * 2
        });
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            state.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 400,
                vy: (Math.random() - 1.0) * 400,
                life: 0.5 + Math.random() * 0.5,
                color: color,
                size: 3 + Math.random() * 5
            });
        }
    }

    function handleInput(type) {
        if (state.mode !== 'PLAY') return;

        audio.playSfx('sfx_chop');

        state.chef.y += 10;
        setTimeout(() => state.chef.y -= 10, 50);

        if (state.customers.length === 0) return;

        const front = state.customers[0];

        if (front.type === type) {
            audio.playSfx('sfx_success');
            state.score++;
            document.getElementById('scoreVal').innerText = state.score;
            createParticles(front.x, front.y, COLORS[type], 15);
            showGif('success', 850);
            state.customers.shift();
        } else {
            gameOver("That order went to the wrong customer!");
        }
    }

    function gameOver(reason) {
        state.mode = 'GAMEOVER';
        state.shake = 2;
        audio.playSfx('sfx_fail');
        showGif('fail', 1400);

        document.getElementById('fail-reason').innerText = reason;
        document.getElementById('finalScore').innerText = state.score;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('controls').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');

        state.chef.state = 'FIRED';
        const bgm = document.getElementById('bgm_main');
        if (bgm) {
            bgm.pause();
            bgm.currentTime = 0;
        }
    }

    function startGame() {
        state.mode = 'PLAY';
        state.score = 0;
        state.customers = [];
        state.particles = [];
        state.difficulty = 1;
        state.nextSpawn = 0;
        state.chef.state = 'IDLE';
        state.warningCooldownUntil = 0;
        successGif?.classList.remove('visible');
        failGif?.classList.remove('visible');

        resize();

        document.getElementById('scoreVal').innerText = '0';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('hud').classList.remove('hidden');

        spawnCustomer();

        audio.init();
        audio.playSfx('sfx_ui');
        audio.playBgm();
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    const btnBurger = document.getElementById('btn-burger');
    const btnPizza = document.getElementById('btn-pizza');
    const btnSalad = document.getElementById('btn-salad');

    const bindBtn = (el, type) => {
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleInput(type);
            el.classList.add('scale-90');
        });
        el.addEventListener('pointerup', () => el.classList.remove('scale-90'));
        el.addEventListener('pointerleave', () => el.classList.remove('scale-90'));
    };

    bindBtn(btnBurger, 'BURGER');
    bindBtn(btnPizza, 'PIZZA');
    bindBtn(btnSalad, 'SALAD');

    document.addEventListener('keydown', (e) => {
        if (state.mode !== 'PLAY') return;
        if (e.key === '1' || e.key === 'ArrowLeft') handleInput('BURGER');
        if (e.key === '2' || e.key === 'ArrowUp') handleInput('PIZZA');
        if (e.key === '3' || e.key === 'ArrowRight') handleInput('SALAD');
    });

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
