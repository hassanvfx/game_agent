<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Prom Date Dilemma</title>
<style>
    :root {
        --primary: #FF2E63;
        --secondary: #08D9D6;
        --chat-bg: rgba(10, 14, 34, 0.82);
        --bubble-left: rgba(255, 255, 255, 0.88);
        --bubble-right: linear-gradient(135deg, #ff4f8b, #7b61ff);
        --text-left: #190f2f;
        --text-right: #fff9ff;
        --panel-border: rgba(255, 255, 255, 0.16);
        --panel-shadow: 0 20px 45px rgba(1, 4, 20, 0.45);
        --sparkle: rgba(255, 255, 255, 0.65);
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 110, 199, 0.28), transparent 32%),
            linear-gradient(180deg, #16091f 0%, #261445 45%, #090a18 100%);
        font-family: "Exo 2", system-ui, sans-serif;
        color: #fdf7ff;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.18) 0 2px, transparent 3px),
            radial-gradient(circle at 80% 18%, rgba(255, 255, 255, 0.15) 0 1.5px, transparent 3px),
            radial-gradient(circle at 30% 75%, rgba(255, 255, 255, 0.12) 0 2px, transparent 3px),
            radial-gradient(circle at 65% 65%, rgba(255, 255, 255, 0.1) 0 2px, transparent 3px);
        opacity: 0.8;
        z-index: 0;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; width: 100%; height: 100%; }
    
    /* UI Layer */
    #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; pointer-events: none; }
    
    /* Chat Container */
    #app-container {
        pointer-events: auto;
        width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
        display: flex; flex-direction: column;
        background:
            linear-gradient(180deg, rgba(18, 21, 48, 0.92), rgba(9, 10, 28, 0.9)),
            var(--chat-bg);
        box-shadow: var(--panel-shadow);
        backdrop-filter: blur(18px);
        border-inline: 1px solid var(--panel-border);
        position: relative;
        overflow: hidden;
    }
    #app-container::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at top right, rgba(8, 217, 214, 0.18), transparent 28%),
            radial-gradient(circle at bottom left, rgba(255, 46, 99, 0.22), transparent 32%);
        z-index: 0;
    }
    #app-container > * { position: relative; z-index: 1; }

    /* Header */
    header {
        padding: calc(var(--safe-top) + 10px) 16px 16px;
        background: linear-gradient(180deg, rgba(23, 24, 56, 0.98), rgba(18, 19, 43, 0.94));
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex; align-items: center; gap: 12px;
        z-index: 20;
        box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 16px;
        background:
            radial-gradient(circle at 30% 30%, #fff1f8, transparent 28%),
            linear-gradient(135deg, var(--primary), var(--secondary));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: "Russo One", "Exo 2", sans-serif;
        letter-spacing: 1px;
        font-size: 18px;
        box-shadow: 0 8px 18px rgba(255, 46, 99, 0.35);
        border: 1px solid rgba(255,255,255,0.28);
    }
    .header-info h1 {
        margin: 0;
        font-family: "Russo One", "Exo 2", sans-serif;
        letter-spacing: 1.1px;
        font-size: 24px;
        line-height: 1;
        color: #fff8ff;
        text-shadow: 0 2px 10px rgba(255, 46, 99, 0.35);
    }
    .header-info p {
        margin: 4px 0 0;
        font-size: 12px;
        color: #90ffe8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
    }
    
    /* Chat Area */
    #chat-area {
        flex: 1; overflow-y: auto; padding: 20px 16px;
        display: flex; flex-direction: column; gap: 12px;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
            radial-gradient(circle at top center, rgba(255,255,255,0.05), transparent 40%);
    }
    
    .message {
        max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.45;
        position: relative; transform-origin: bottom center;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        font-weight: 500;
    }
    .message::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 45%);
        opacity: 0.7;
    }
    .msg-left { align-self: flex-start; background: var(--bubble-left); color: var(--text-left); border-bottom-left-radius: 6px; }
    .msg-right { align-self: flex-end; background: var(--bubble-right); color: var(--text-right); border-bottom-right-radius: 6px; }
    .msg-center {
        align-self: center;
        background: rgba(255,255,255,0.1);
        color: #fbdfff;
        font-size: 12px;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
    }
    .sender-name {
        font-size: 11px;
        margin-bottom: 5px;
        opacity: 0.72;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Footer */
    footer {
        padding: 10px 16px calc(var(--safe-bottom) + 10px);
        background: linear-gradient(180deg, rgba(14,16,35,0.82), rgba(7,8,20,0.98));
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    #tap-area {
        width: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08));
        color: #e4d8fb;
        padding: 14px;
        border-radius: 24px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        transition: 0.2s;
        border: 2px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
        font-family: "Exo 2", system-ui, sans-serif;
    }
    #tap-area.pulse {
        border-color: rgba(255, 46, 99, 0.75);
        color: #fff6fb;
        animation: pulse 1.5s infinite;
        box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    @keyframes pulse {
        0% { opacity: 1; box-shadow: 0 0 0 0 rgba(255, 46, 99, 0.45), inset 0 1px 0 rgba(255,255,255,0.2); }
        70% { opacity: 1; box-shadow: 0 0 0 12px rgba(255, 46, 99, 0); }
        100% { opacity: 0.9; box-shadow: 0 0 0 0 rgba(255, 46, 99, 0); }
    }

    /* Overlays */
    .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5,7,18,0.84), rgba(12,5,27,0.92));
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px;
        backdrop-filter: blur(12px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    
    .choice-card {
        background: white;
        padding: 20px;
        margin: 10px 0;
        border-radius: 20px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.25);
        box-shadow: 0 16px 34px rgba(0,0,0,0.26);
    }
    .choice-card::after {
        content: "★";
        position: absolute;
        top: 10px;
        right: 14px;
        font-family: "Russo One", "Exo 2", sans-serif;
        font-size: 16px;
        opacity: 0.7;
    }
    .choice-card:active { transform: scale(0.96); }
    .choice-card:hover { filter: brightness(1.03); box-shadow: 0 20px 36px rgba(0,0,0,0.3); }
    .choice-a { background: linear-gradient(135deg, #2bb7ff, #00f2fe); color: white; }
    .choice-b { background: linear-gradient(135deg, #8c5bff, #ff86d3); color: white; }
    .choice-name {
        font-size: 24px;
        font-weight: bold;
        font-family: "Russo One", "Exo 2", sans-serif;
        letter-spacing: 1px;
    }
    
    /* Video */
    video { width: 100%; height: 100%; object-fit: cover; }
    #replay-btn {
        position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
        padding: 12px 30px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.7);
        color: white; border-radius: 30px; backdrop-filter: blur(4px); font-weight: 700;
        font-family: "Russo One", "Exo 2", sans-serif; letter-spacing: 1px; font-size: 18px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    #replay-btn:active { transform: translateX(-50%) scale(0.97); }
    .hidden { display: none !important; }

    .overlay-title {
        color: white;
        margin-bottom: 20px;
        text-align: center;
        font-family: "Russo One", "Exo 2", sans-serif;
        letter-spacing: 1px;
        font-size: 30px;
        text-shadow: 0 4px 16px rgba(255, 46, 99, 0.35);
    }

    .choice-tagline {
        opacity: 0.92;
        font-size: 14px;
        line-height: 1.35;
        font-weight: 600;
    }

    #result-card {
        color: white;
        padding: 32px 24px;
        max-width: 320px;
        background: linear-gradient(180deg, rgba(27,30,68,0.88), rgba(18,10,39,0.92));
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.28);
        backdrop-filter: blur(8px);
        text-align: center;
    }
    #result-title {
        margin: 0 0 12px;
        font-size: 32px;
        font-family: "Russo One", "Exo 2", sans-serif;
        letter-spacing: 1.2px;
    }
    #result-text {
        margin: 0;
        font-size: 18px;
        line-height: 1.35;
        color: #f4e6ff;
    }

    .feedback-gif {
        position: absolute;
        right: 14px;
        width: 108px;
        height: 108px;
        object-fit: cover;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 14px 32px rgba(0,0,0,0.32);
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
        z-index: 120;
        background: rgba(12, 10, 26, 0.65);
    }
    .feedback-gif.active {
        opacity: 0.94;
        transform: translateY(0) scale(1);
    }
    #chat-gif {
        top: calc(var(--safe-top) + 82px);
    }
    #result-gif {
        top: 18px;
        right: 18px;
        width: 124px;
        height: 124px;
    }

    @media (max-width: 420px) {
        .header-info h1 { font-size: 22px; }
        .message { max-width: 84%; font-size: 14px; }
        .choice-name { font-size: 22px; }
        #result-title { font-size: 28px; }
        #result-text { font-size: 16px; }
        .feedback-gif {
            width: 88px;
            height: 88px;
            right: 10px;
        }
        #chat-gif { top: calc(var(--safe-top) + 88px); }
        #result-gif {
            width: 96px;
            height: 96px;
            top: 14px;
            right: 14px;
        }
    }
</style>
<!-- CONFIG -->
<script id="game-config" type="application/x-game-config">
{
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#FF2E63" },
  "textSpeed": { "type": "number", "label": "Text Delay (ms)", "value": 0, "min": 0, "max": 500 }
}
</script>
</head>
<body>

<!-- ASSETS -->

<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="app-container">
            <header>
                <div class="avatar">GC</div>

            </div>

                <img
                    id="result-gif"
                    class="feedback-gif"

                >

<script>
/**
 * §1 System Invariants
 */
const CONFIG_DEFAULT = { themeColor: '#FF2E63', textSpeed: 0 };
let gameConfig = { ...CONFIG_DEFAULT };
const STATE = { BOOT: 0, PLAYING: 1, CHOICE: 2, VIDEO: 3 };
let gameState = STATE.BOOT;

/**
 * §2 Data & State
 */
const SCRIPT = [
    { sender: 'A', name: 'Alex', text: "Hey... quick check before the big night. I already mapped out the perfect slow-dance route. 🌹" },
    { sender: 'B', name: 'Brad', text: "Yo! Final mission briefing: prom starts soon, and I need your answer." },
    { sender: 'A', name: 'Alex', text: "I even picked a tux that matches your vibe. This invite is fully committed." },
    { sender: 'B', name: 'Brad', text: "Forget subtle. I lined up the loudest entrance in town. 🏎️" },
    { sender: 'A', name: 'Alex', text: "I've been practicing all month. If you choose me, the first dance will land perfectly." },
    { sender: 'B', name: 'Brad', text: "Choose me and we turn the whole gym into a headline moment." },
    { sender: 'A', name: 'Alex', text: "Send the word and I'll be your calm, classy plus-one tonight." },
    { sender: 'B', name: 'Brad', text: "Come on, lock it in. You know I bring the energy." },
    { sender: 'SYS', text: "Both invites are waiting for your tap..." }
];

let msgIndex = 0;
let particles = [];
let audioCtx = null;
let audioUnlocked = false;
let lastSfxAt = 0;
let feedbackTimer = 0;

// DOM Cache
const dom = {
    chat: document.getElementById('chat-area'),
    tapBtn: document.getElementById('tap-area'),
    choiceScreen: document.getElementById('choice-screen'),
    videoScreen: document.getElementById('video-screen'),
    videoPlayer: document.getElementById('reveal-player'),
    resultTitle: document.getElementById('result-title'),
    resultText: document.getElementById('result-text'),
    canvas: document.getElementById('gameCanvas'),
    app: document.getElementById('app-container'),
    bgm: document.getElementById('bgm_main'),
    chatGif: document.getElementById('chat-gif'),
    resultGif: document.getElementById('result-gif')
};
const ctx = dom.canvas.getContext('2d', { alpha: false });
let cw, ch;

/**
 * §3 Lifecycle
 */
function initGame() {
    resize();
    parseConfig();
    setState(STATE.PLAYING);
    createParticles(28);
    dom.bgm.volume = 0.2;
    requestAnimationFrame(loop);
}

function resize() {
    cw = dom.canvas.width = window.innerWidth * window.devicePixelRatio;
    ch = dom.canvas.height = window.innerHeight * window.devicePixelRatio;
    dom.canvas.style.width = window.innerWidth + 'px';
    dom.canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    cw = window.innerWidth;
    ch = window.innerHeight;
}

function parseConfig() {
    try {
        const el = document.getElementById('game-config');
        if (el) {
            const parsed = JSON.parse(el.textContent);
            Object.keys(parsed).forEach(k => gameConfig[k] = parsed[k].value);
            document.documentElement.style.setProperty('--primary', gameConfig.themeColor);
        }
    } catch(e) {}
}

function setState(s) {
    gameState = s;
    if (s === STATE.PLAYING) {
        dom.choiceScreen.classList.remove('active');
        dom.videoScreen.classList.remove('active');
        dom.resultGif.classList.remove('active');
        dom.tapBtn.textContent = "Tap to open the chat...";
        dom.tapBtn.classList.add('pulse');
        syncBgm(true);
    } else if (s === STATE.CHOICE) {
        dom.choiceScreen.classList.add('active');
        dom.tapBtn.textContent = "Choose your invite!";
        dom.tapBtn.classList.remove('pulse');
        haptic('medium');
        playSfx('sfx_choice');
        syncBgm(true);
    } else if (s === STATE.VIDEO) {
        dom.videoScreen.classList.add('active');
        dom.resultGif.classList.add('active');
        syncBgm(false);
    }
}

function restartGame() {
    msgIndex = 0;
    dom.chat.innerHTML = '<div class="msg-center">Tonight 8:30 PM</div>';
    dom.videoPlayer.pause();
    dom.videoPlayer.removeAttribute('src');
    dom.videoPlayer.load();
    dom.resultGif.classList.remove('active');
    showGif(dom.chatGif, 900);
    playSfx('sfx_replay');
    syncBgm(true, true);
    setState(STATE.PLAYING);
}

function syncBgm(shouldPlay, restart = false) {
    if (!audioUnlocked) return;
    if (restart) dom.bgm.currentTime = 0;
    if (shouldPlay) {
        if (dom.bgm.paused) dom.bgm.play().catch(() => {});
    } else {
        dom.bgm.pause();
    }
}

/**
 * §4 Input & Logic
 */
function handleGlobalInput(e) {
    const interactiveTarget = e.target.closest('#btn-choice-a, #btn-choice-b, #replay-btn, video, button');
    if (interactiveTarget) return;

    if (!audioUnlocked) {
        audioUnlocked = true;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        audioCtx.resume().catch(() => {});
        syncBgm(true);
        showGif(dom.chatGif, 1200);
    }

    if (typeof e.clientX === 'number' && typeof e.clientY === 'number') {
        spawnTapParticles(e.clientX, e.clientY);
    }

    if (gameState === STATE.PLAYING) {
        advanceChat();
    }
}

function advanceChat() {
    if (msgIndex >= SCRIPT.length) {
        setState(STATE.CHOICE);
        return;
    }

    const data = SCRIPT[msgIndex];
    renderMessage(data);
    msgIndex++;
    
    playSfx('sfx_msg');
    haptic('light');
    showGif(dom.chatGif, 850);
    
    setTimeout(() => {
        dom.chat.scrollTop = dom.chat.scrollHeight;
    }, 50);

    if (msgIndex >= SCRIPT.length) {
        dom.tapBtn.textContent = "Choose your invite!";
        setTimeout(() => setState(STATE.CHOICE), 120);
    }
}

function renderMessage(data) {
    const div = document.createElement('div');
    div.className = 'message';
    
    if (data.sender === 'SYS') {
        div.classList.add('msg-center');
        div.textContent = data.text;
    } else {
        div.classList.add(data.sender === 'A' ? 'msg-left' : 'msg-right');
        const nameDiv = document.createElement('div');
        nameDiv.className = 'sender-name';
        nameDiv.textContent = data.name;
        div.appendChild(nameDiv);
        div.appendChild(document.createTextNode(data.text));
    }
    dom.chat.appendChild(div);
}

function makeChoice(choice) {
    if (gameState !== STATE.CHOICE) return;
    
    haptic('heavy');
    playSfx('sfx_win');
    setState(STATE.VIDEO);
    
    const ending = choice === 'A'
        ? {
            title: 'Invite sent to Alex',
            text: 'You picked the smooth slow-dance plan and locked in a romantic prom entrance.'
        }
        : {
            title: 'Invite sent to Brad',
            text: 'You picked the hype squad route and locked in a high-energy prom entrance.'
        };
    
    dom.resultTitle.textContent = ending.title;
    dom.resultText.textContent = ending.text;
}

// Choice Listeners
document.getElementById('btn-choice-a').addEventListener('click', (e) => { e.stopPropagation(); makeChoice('A'); });
document.getElementById('btn-choice-b').addEventListener('click', (e) => { e.stopPropagation(); makeChoice('B'); });
document.getElementById('replay-btn').addEventListener('click', (e) => { e.stopPropagation(); restartGame(); });

// Global Listener
// [agent-note][stage4] repaired: mobile-action-risk | scope: gameplay chat surface only | reason: prevent overlay CTA taps from also triggering the global progression handler
dom.app.addEventListener('pointerdown', handleGlobalInput, { passive: true });
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', initGame);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        dom.bgm.pause();
    } else if (gameState !== STATE.VIDEO) {
        syncBgm(true);
    }
});

/**
 * §5 Audio & Haptics
 */
function playSfx(id) {
    const now = performance.now();
    if (now - lastSfxAt < 65) return;
    lastSfxAt = now;

    const el = document.getElementById(id);
    if (el) {
        el.currentTime = 0;
        el.volume = id === 'sfx_win' ? 0.72 : 0.5;
        el.play().catch(() => {
            if (audioCtx && audioCtx.state === 'running') {
                playOscillator(id === 'sfx_win' ? 720 : 460);
            }
        });
        return;
    }

    if (audioCtx && audioCtx.state === 'running') {
        playOscillator(460);
    }
}

function playOscillator(freq) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.11);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.11);
}

function showGif(el, duration = 900) {
    if (!el) return;
    clearTimeout(feedbackTimer);
    el.classList.add('active');
    feedbackTimer = window.setTimeout(() => {
        el.classList.remove('active');
    }, duration);
}

function haptic(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0',
        params: { style: style }
    });
}

/**
 * §6 Visuals (Canvas Background)
 */
function createParticles(n) {
    for(let i=0; i<n; i++) {
        particles.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            vx: (Math.random()-0.5) * 0.5,
            vy: (Math.random()-0.5) * 0.5,
            size: Math.random() * 20 + 10,
            type: Math.random() > 0.5 ? '💖' : '✦',
            life: 1
        });
    }
}

function spawnTapParticles(x, y) {
    for(let i=0; i<5; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5) * 4,
            vy: (Math.random()-0.5) * 4,
            size: Math.random() * 15 + 10,
            type: Math.random() > 0.5 ? '💘' : '✦',
            life: 1,
            decay: 0.02 + Math.random()*0.02
        });
    }
}

function loop() {
    const grad = ctx.createLinearGradient(0, 0, cw, ch);
    grad.addColorStop(0, '#180a25');
    grad.addColorStop(0.55, '#2b1650');
    grad.addColorStop(1, '#07101e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    const glow = ctx.createRadialGradient(cw * 0.5, ch * 0.12, 10, cw * 0.5, ch * 0.12, ch * 0.8);
    glow.addColorStop(0, 'rgba(255, 90, 170, 0.28)');
    glow.addColorStop(0.5, 'rgba(123, 97, 255, 0.12)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, cw, ch);

    ctx.font = '20px "Exo 2", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay || 0.002;
        
        if (p.x < -50 || p.x > cw + 50 || p.y < -50 || p.y > ch + 50 || p.life <= 0) {
            if (!p.decay) {
                p.x = Math.random() * cw;
                p.y = Math.random() * ch;
                p.life = 1;
            } else {
                particles.splice(i, 1);
                continue;
            }
        }

        ctx.globalAlpha = p.life * 0.5;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillText(p.type, 0, 0);
        ctx.restore();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
}
