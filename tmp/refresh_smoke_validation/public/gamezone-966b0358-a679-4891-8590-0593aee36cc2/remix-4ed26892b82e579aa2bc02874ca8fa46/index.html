<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<title>Neon Afterglow: Read Receipts</title>
<style>
:root{--ink:#fff7ff;--muted:#c8bbdf;--void:#080611;--glass:rgba(15,13,35,.74);--pink:#ff2f9f;--cyan:#23f7ff;--violet:#8b5cff;--amber:#ffd36c;--safe-top:env(safe-area-inset-top,18px);--safe-bottom:env(safe-area-inset-bottom,18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080611;color:var(--ink);font-family:"Exo 2",system-ui,sans-serif;touch-action:manipulation}button{font:inherit;color:inherit}#game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(255,47,159,.32),transparent 34%),linear-gradient(180deg,#17091f 0%,#0d0924 48%,#04040b 100%)}#backCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}.skyline{position:absolute;inset:auto 0 0 0;height:32%;z-index:1;pointer-events:none}.tower{position:absolute;bottom:0;width:9vw;min-width:28px;background:linear-gradient(180deg,rgba(16,14,39,.35),rgba(4,4,12,.9));border:1px solid rgba(35,247,255,.09);box-shadow:0 0 24px rgba(255,47,159,.08)}.tower:before{content:"";position:absolute;inset:10px 7px;background:repeating-linear-gradient(180deg,rgba(35,247,255,.58) 0 2px,transparent 2px 14px);opacity:.55}.t1{left:3%;height:55%}.t2{left:16%;height:78%}.t3{right:18%;height:68%}.t4{right:4%;height:48%}.moon{position:absolute;right:10%;top:7%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.65) 34%,rgba(255,47,159,.18) 62%,transparent 70%);box-shadow:0 0 50px rgba(255,47,159,.28);opacity:.7}.phone{position:relative;z-index:4;width:min(100vw,480px);height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(15,14,38,.9),rgba(6,7,17,.91));border-inline:1px solid rgba(255,255,255,.13);box-shadow:0 0 60px rgba(0,0,0,.52);overflow:hidden}.phone:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 14% 10%,rgba(35,247,255,.17),transparent 25%),radial-gradient(circle at 92% 78%,rgba(255,47,159,.18),transparent 30%),linear-gradient(90deg,transparent 0 48%,rgba(255,255,255,.035) 49% 51%,transparent 52%)}.phone>*{position:relative;z-index:1}.topbar{padding:calc(var(--safe-top) + 10px) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(16,12,35,.96),rgba(19,14,42,.78));box-shadow:0 10px 28px rgba(0,0,0,.28)}.mascara{width:50px;height:50px;border-radius:18px;background:conic-gradient(from 210deg,var(--pink),var(--violet),var(--cyan),var(--pink));position:relative;box-shadow:0 0 28px rgba(255,47,159,.45),inset 0 0 0 1px rgba(255,255,255,.32);flex:0 0 auto}.mascara:before{content:"";position:absolute;left:13px;top:14px;width:24px;height:15px;border-radius:50%;background:#05040d;box-shadow:0 0 0 3px rgba(255,255,255,.13)}.mascara:after{content:"✦";position:absolute;right:-5px;top:-8px;color:#fff;text-shadow:0 0 12px var(--cyan);font-size:24px}.title h1{margin:0;font-family:Orbitron,"Exo 2",sans-serif;font-size:clamp(19px,5.4vw,27px);line-height:1;letter-spacing:.02em;text-shadow:0 0 14px rgba(255,47,159,.55)}.title p{margin:5px 0 0;color:var(--cyan);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.15em}.stats{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);font-weight:700}.stats strong{display:block;color:#fff;font-family:Orbitron,sans-serif;font-size:16px;text-shadow:0 0 10px rgba(35,247,255,.55)}

#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 15px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.stamp{align-self:center;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.07);color:#dfd4f5;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.bubble{max-width:84%;padding:13px 15px;border-radius:22px;font-size:15px;line-height:1.4;font-weight:600;animation:rise .26s ease-out both;position:relative;box-shadow:0 15px 30px rgba(0,0,0,.23);border:1px solid rgba(255,255,255,.18)}.bubble .name{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:5px;opacity:.78}.left{align-self:flex-start;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(236,231,255,.88));color:#1c1231;border-bottom-left-radius:7px}.right{align-self:flex-end;background:linear-gradient(135deg,rgba(255,47,159,.96),rgba(139,92,255,.93));color:white;border-bottom-right-radius:7px}.system{align-self:center;max-width:92%;text-align:center;background:rgba(35,247,255,.09);border-color:rgba(35,247,255,.25);color:#e8fbff;border-radius:16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.typing{display:inline-flex;gap:4px}.typing i{width:5px;height:5px;background:currentColor;border-radius:50%;display:block;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.25;transform:translateY(2px)}}@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}.footer{padding:10px 15px calc(var(--safe-bottom) + 10px);background:linear-gradient(180deg,rgba(10,8,25,.72),rgba(5,5,14,.98));border-top:1px solid rgba(255,255,255,.12)}#tapPad{width:100%;min-height:56px;border:1px solid rgba(255,255,255,.2);border-radius:22px;background:linear-gradient(135deg,rgba(35,247,255,.14),rgba(255,47,159,.17));display:flex;align-items:center;justify-content:center;text-align:center;padding:13px;color:#fff;font-weight:800;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 rgba(255,47,159,0);user-select:none}.pulse{animation:pulse 1.45s infinite}@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,47,159,0)}0%{box-shadow:0 0 0 0 rgba(255,47,159,.34)}}.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(6,5,16,.88),rgba(13,8,32,.95));backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:.25s}.overlay.active{opacity:1;pointer-events:auto}.overlay h2{font-family:Orbitron,"Exo 2",sans-serif;text-align:center;font-size:clamp(24px,7vw,34px);margin:0 0 10px;text-shadow:0 0 22px rgba(255,47,159,.6)}.overlay .sub{text-align:center;color:#d9c9ee;margin:0 auto 22px;max-width:320px;line-height:1.35}.choice{border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:18px;margin:9px 0;text-align:left;cursor:pointer;box-shadow:0 18px 36px rgba(0,0,0,.3);position:relative;overflow:hidden;transition:transform .12s,filter .16s}.choice:active{transform:scale(.97)}.choice:before{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-65%);animation:sheen 4s infinite}.choiceA{background:linear-gradient(135deg,#26d9ff,#4069ff 55%,#8b5cff)}.choiceB{background:linear-gradient(135deg,#ff2f9f,#ff6aa2 55%,#ffd36c)}@keyframes sheen{55%,100%{transform:translateX(80%)}}.choice strong{display:block;font-family:Orbitron,sans-serif;font-size:22px;margin-bottom:5px}.choice span{display:block;font-size:14px;line-height:1.35;color:rgba(255,255,255,.9)}#ending{align-items:center;text-align:center}.resultCard{max-width:350px;border:1px solid rgba(255,255,255,.17);border-radius:28px;padding:26px 20px;background:linear-gradient(180deg,rgba(31,22,63,.86),rgba(13,8,29,.92));box-shadow:0 25px 60px rgba(0,0,0,.42)}#resultTitle{margin:8px 0 12px;font-family:Orbitron,sans-serif;font-size:27px}#resultText{margin:0 0 18px;color:#efe4ff;font-size:16px;line-height:1.45}.sigil{width:104px;height:104px;margin:0 auto 8px;border-radius:32px;background:conic-gradient(var(--pink),var(--cyan),var(--violet),var(--pink));position:relative;box-shadow:0 0 38px rgba(255,47,159,.45)}.sigil:before{content:"♡";position:absolute;inset:12px;border-radius:25px;background:#090613;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;text-shadow:0 0 18px var(--pink)}#replay{border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.12);padding:13px 24px;font-weight:800;box-shadow:0 12px 25px rgba(0,0,0,.25)}.feedback{position:absolute;right:13px;top:calc(var(--safe-top) + 78px);width:94px;height:94px;object-fit:cover;border-radius:22px;z-index:15;border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 35px rgba(0,0,0,.35);opacity:0;transform:translateY(8px) scale(.9);transition:.25s;pointer-events:none}.feedback.active{opacity:.94;transform:none}.chapter{position:absolute;left:14px;bottom:calc(var(--safe-bottom) + 84px);z-index:3;color:rgba(255,255,255,.48);font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;writing-mode:vertical-rl;pointer-events:none}.hidden{display:none!important}@media(max-width:380px){.bubble{font-size:14px;padding:12px 13px}.topbar{gap:9px}.mascara{width:45px;height:45px}.feedback{width:78px;height:78px}.choice strong{font-size:20px}.overlay{padding:18px}}
</style>
</head>

<body>
<div id="game">
  <canvas id="backCanvas" aria-hidden="true"></canvas>
  <div class="moon" aria-hidden="true"></div><div class="skyline" aria-hidden="true"><i class="tower t1"></i><i class="tower t2"></i><i class="tower t3"></i><i class="tower t4"></i></div>
  <main class="phone" id="phone" aria-label="Neon Afterglow narrative game">
    <header class="topbar"><div class="mascara" aria-hidden="true"></div><div class="title"><h1>Neon Afterglow</h1><p>read receipts / 2:17 AM</p></div><div class="stats"><strong id="meter">0/9</strong>vulnerability</div></header>
    <img id="notifyGif" class="feedback" alt="chat notification feedback" src="https://i.giphy.com/eRM47Z22ZXSNoVeM1c.webp">
    <section id="chat" aria-live="polite"><div class="stamp">bathroom mirror // party night</div></section>
    <div class="chapter" id="chapter">chapter 01: mascara weather</div>
    <footer class="footer"><div id="tapPad" class="pulse" role="button" tabindex="0">Tap to open the next unread confession</div></footer>
    <section id="choiceScreen" class="overlay" aria-modal="true" aria-label="Choose whose message to answer"><h2>Who gets the blue heart?</h2><p class="sub">Both threads are glowing. Pick the intimacy you can survive tonight.</p><button id="choiceA" class="choice choiceA"><strong>Jules // the soft chaos</strong><span>Send the vulnerable reply. Glitter, forgiveness, and a dangerous kind of hope.</span></button><button id="choiceB" class="choice choiceB"><strong>Riven // the toxic orbit</strong><span>Choose the magnetic mess. Big feelings, bad timing, unforgettable neon.</span></button></section>
    <section id="ending" class="overlay" aria-modal="true" aria-label="Ending"><div class="resultCard"><div class="sigil" aria-hidden="true"></div><img id="resultGif" class="feedback" alt="romance result feedback" src="https://i.giphy.com/SbmXAXRjXjqkVMnDzr.webp"><h2 id="resultTitle">Message sent</h2><p id="resultText"></p><button id="replay">Run the night back</button></div></section>
  </main>
</div>
<audio id="bgm" loop preload="none"></audio>
<audio id="msgSfx" preload="none"></audio>
<audio id="choiceSfx" preload="none"></audio>
<audio id="winSfx" preload="none"></audio>
<script>
const STATE={PLAYING:'playing',CHOICE:'choice',ENDING:'ending'};let state=STATE.PLAYING,msgIndex=0,audioUnlocked=false,audioCtx=null,lastSfx=0,gifTimer=0,particles=[];
const SCRIPT=[
 {sender:'A',name:'Jules',text:'are you still at the party or did you disappear into the mirror again? ✨'},
 {sender:'B',name:'Riven',text:'I saw your story. you looked unreal. also maybe mad at me.'},
 {sender:'A',name:'Jules',text:'no pressure. I just miss when texting you felt like a window instead of a test.'},
 {sender:'B',name:'Riven',text:'I know I make everything loud. I keep trying to be casual and then I become a siren.'},
 {sender:'A',name:'Jules',text:'if you answer me, answer honestly. even if the truth is messy.'},
 {sender:'B',name:'Riven',text:'choose me and we leave before sunrise. bad idea, cinematic lighting, full disaster.'},
 {sender:'A',name:'Jules',text:'choose softness for once. not perfect. just real.'},
 {sender:'B',name:'Riven',text:'or choose the person who knows the ugly parts and still wants the afterparty.'},
 {sender:'SYS',text:'Two unread futures are pulsing. Your next tap opens the choice.'}
];
const dom={phone:document.getElementById('phone'),chat:document.getElementById('chat'),tap:document.getElementById('tapPad'),meter:document.getElementById('meter'),choiceScreen:document.getElementById('choiceScreen'),ending:document.getElementById('ending'),resultTitle:document.getElementById('resultTitle'),resultText:document.getElementById('resultText'),notifyGif:document.getElementById('notifyGif'),resultGif:document.getElementById('resultGif'),canvas:document.getElementById('backCanvas'),bgm:document.getElementById('bgm')};
const ctx=dom.canvas.getContext('2d');let w=0,h=0,dpr=1;

function boot(){resize();seedParticles();requestAnimationFrame(loop);setState(STATE.PLAYING)}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=innerWidth;h=innerHeight;dom.canvas.width=w*dpr;dom.canvas.height=h*dpr;dom.canvas.style.width=w+'px';dom.canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function setState(next){state=next;dom.choiceScreen.classList.toggle('active',next===STATE.CHOICE);dom.ending.classList.toggle('active',next===STATE.ENDING);if(next===STATE.PLAYING){dom.tap.textContent='Tap to open the next unread confession';dom.tap.classList.add('pulse');syncBgm(true)}if(next===STATE.CHOICE){dom.tap.textContent='Choose the blue heart';dom.tap.classList.remove('pulse');playSfx('choiceSfx');vibrate('medium');syncBgm(true)}if(next===STATE.ENDING){dom.tap.classList.remove('pulse');dom.resultGif.classList.add('active');syncBgm(false)}}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume().catch(()=>{})}catch(e){}dom.bgm.volume=.18;syncBgm(true)}
function syncBgm(on){if(!audioUnlocked||!dom.bgm.currentSrc)return;if(on){dom.bgm.play().catch(()=>{})}else dom.bgm.pause()}
function globalInput(e){if(e.target.closest('button,#choiceScreen,#ending'))return;unlockAudio();tapBurst(e.clientX||w/2,e.clientY||h*.78);if(state===STATE.PLAYING)advanceChat()}
function advanceChat(){if(msgIndex>=SCRIPT.length){setState(STATE.CHOICE);return}showTyping(()=>{const data=SCRIPT[msgIndex++];renderMessage(data);dom.meter.textContent=Math.min(msgIndex,SCRIPT.length)+'/'+SCRIPT.length;playSfx('msgSfx');vibrate('light');showGif(dom.notifyGif,820);dom.chat.scrollTop=dom.chat.scrollHeight;if(msgIndex>=SCRIPT.length)setTimeout(()=>setState(STATE.CHOICE),170)},150)}
function showTyping(done,delay){const t=document.createElement('div');t.className='bubble system';t.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';dom.chat.appendChild(t);dom.chat.scrollTop=dom.chat.scrollHeight;setTimeout(()=>{t.remove();done()},delay)}
function renderMessage(data){const el=document.createElement('div');el.className='bubble '+(data.sender==='SYS'?'system':data.sender==='A'?'left':'right');if(data.sender==='SYS'){el.textContent=data.text}else{const n=document.createElement('div');n.className='name';n.textContent=(data.sender==='A'?'◇ ':'◆ ')+data.name;el.appendChild(n);el.appendChild(document.createTextNode(data.text))}dom.chat.appendChild(el)}
function choose(which){if(state!==STATE.CHOICE)return;unlockAudio();playSfx('winSfx');vibrate('heavy');const ending=which==='A'?{title:'Blue heart sent to Jules',text:'You chose the soft confession. The night does not become simple, but it becomes honest: glitter on your cheeks, one clean breath, one reply that does not perform.'}:{title:'Blue heart sent to Riven',text:'You chose the toxic orbit. It burns bright and complicated: headlights, perfume, a promise you know might bruise and still understand too well.'};dom.resultTitle.textContent=ending.title;dom.resultText.textContent=ending.text;tapBurst(w/2,h*.45,22);setState(STATE.ENDING)}
function restart(){msgIndex=0;dom.chat.innerHTML='<div class="stamp">bathroom mirror // party night</div>';dom.meter.textContent='0/9';dom.resultGif.classList.remove('active');showGif(dom.notifyGif,900);playSfx('choiceSfx');if(audioUnlocked){dom.bgm.currentTime=0}setState(STATE.PLAYING)}
function playSfx(id){const now=performance.now();if(now-lastSfx<70)return;lastSfx=now;const el=document.getElementById(id);if(el&&el.currentSrc){el.currentTime=0;el.volume=id==='winSfx'?.62:.42;el.play().catch(()=>tone(id==='winSfx'?660:420));return}tone(id==='winSfx'?660:420)}
function tone(freq){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.008,audioCtx.currentTime+.12);o.start();o.stop(audioCtx.currentTime+.12)}
function vibrate(style){window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'neon-'+Date.now(),version:'1.0',params:{style}})}
function showGif(el,dur){clearTimeout(gifTimer);el.classList.add('active');gifTimer=setTimeout(()=>el.classList.remove('active'),dur)}
function seedParticles(){particles=[];for(let i=0;i<58;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.45,vy:.12+Math.random()*.35,r:1+Math.random()*2.8,a:.25+Math.random()*.55,hue:Math.random()>.5?'pink':'cyan',life:1})}
function tapBurst(x,y,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4.6,vy:(Math.random()-.5)*4.6,r:2+Math.random()*4,a:.95,hue:Math.random()>.45?'pink':'cyan',life:1,decay:.018+Math.random()*.025})}
function loop(t){ctx.clearRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#150620');g.addColorStop(.55,'#0a0822');g.addColorStop(1,'#04040b');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.globalAlpha=.23;for(let y=80;y<h;y+=42){ctx.strokeStyle=y%84?'rgba(35,247,255,.28)':'rgba(255,47,159,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y+Math.sin(t/900+y)*4);ctx.lineTo(w,y+Math.cos(t/1000+y)*4);ctx.stroke()}ctx.restore();for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay||0;p.a-=p.decay?0:.0008;if(p.y>h+20||p.x<-20||p.x>w+20||p.a<=0||p.life<=0){if(p.decay){particles.splice(i,1);continue}else{p.x=Math.random()*w;p.y=-10;p.a=.25+Math.random()*.55}}ctx.globalAlpha=Math.max(0,p.a*p.life);ctx.fillStyle=p.hue==='pink'?'#ff54b8':'#47f8ff';ctx.shadowBlur=16;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(loop)}
dom.phone.addEventListener('pointerdown',globalInput,{passive:true});dom.tap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();globalInput({target:dom.tap,clientX:w/2,clientY:h*.8})}});document.getElementById('choiceA').addEventListener('click',e=>{e.stopPropagation();choose('A')});document.getElementById('choiceB').addEventListener('click',e=>{e.stopPropagation();choose('B')});document.getElementById('replay').addEventListener('click',e=>{e.stopPropagation();restart()});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)dom.bgm.pause();else if(state!==STATE.ENDING)syncBgm(true)});document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
