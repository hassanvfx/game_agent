<style>
    :root {
        --bg-deep: #050816;
        --bg-mid: #140a2b;
        --panel: rgba(11, 15, 34, 0.84);
        --panel-strong: rgba(18, 24, 48, 0.96);

            radial-gradient(circle at top, rgba(0, 243, 255, 0.12), transparent 32%),

    body::before {

    .feedback-gif {
        position: absolute;

        #result-panel {

    .week-card:hover::after { transform: translateX(100%); }
    
    /* Animation classes */
    @keyframes pulse-glow { 0% { box-shadow: 0 0 10px #00f3ff; } 50% { box-shadow: 0 0 25px #00f3ff; } 100% { box-shadow: 0 0 10px #00f3ff; } }
    .glow-anim { animation: pulse-glow 2s infinite; }
</style>

<script>
/**
 * NEON PULSE: HOLD THE SIGNAL
 * Arcade lane rhythm play with tap and hold notes.
 * 
 * Architecture:
 * - Single loop for update/draw.
 * - Input system tracks 'pressed' state per lane for Hold logic.
 * - Notes have 'state' (active, holding, done, missed).
 */

// --- §2 System Invariants & Globals ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});
window.gameConfigDefs = gameConfigDefs;
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) gameConfigDefs[key].value = val;
    if (key === 'masterVolume') setGlobalVolume(val);
};

function getVolumeScale(mult = 1) {
    return Math.max(0, Math.min(1, (gameConfig.masterVolume ?? 0.8) * mult));
}

function ensureAudioUnlocked() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function createPooledSFX(key, src, volume = 0.6, limit = 4) {
    if (sfxPools[key]) return sfxPools[key];
    const pool = Array.from({ length: limit }, () => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = getVolumeScale(volume);
        return audio;
    });
    sfxPools[key] = { pool, index: 0, volume };
    return sfxPools[key];
}

function playMappedSFX(key, volume) {
    const src = MEDIA.sfx[key];
    if (!src) return;
    const entry = createPooledSFX(key, src, volume ?? 0.55, key === 'hold' ? 2 : 4);
    entry.pool.forEach(audio => {
        audio.volume = getVolumeScale(volume ?? entry.volume);
    });
    const audio = entry.pool[entry.index];
    entry.index = (entry.index + 1) % entry.pool.length;
    try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch (_) {}
}

function stopHoldLoop() {
    if (!holdHumSource) return;
    holdHumSource.pause();
    holdHumSource.currentTime = 0;
    holdHumSource = null;
}

function startHoldLoop() {
    if (holdHumSource) return;
    const audio = new Audio(MEDIA.sfx.hold);
    audio.loop = true;
    audio.preload = 'auto';
    audio.volume = getVolumeScale(0.18);
    holdHumSource = audio;
    audio.play().catch(() => {
        holdHumSource = null;
    });
}

function flashGif(el, duration = 900) {
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

// State
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, WIN
let lastTime = 0;
let gameTime = 0;
let levelDuration = 90;

// Audio
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContext ? new AudioContext() : null;
let currentBgm = null;
const sfxGain = audioCtx ? audioCtx.createGain() : null;
if (sfxGain) {
    sfxGain.gain.value = 0.65;
    sfxGain.connect(audioCtx.destination);
}
const MEDIA = {
    bgm: [
        'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3',
        'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
        'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3'
    ],
    sfx: {
        hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
        miss: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
        hold: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
        menu: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        die: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
        warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3'
    }
};
const sfxPools = {};
let holdHumSource = null;
let lowHealthWarnAt = -1;
let lastComboBurstAt = -1;
const comboBurstGif = document.getElementById('combo-burst');
const resultReactionGif = document.getElementById('result-reaction');

// Gameplay Vars
let score = 0;
let combo = 0;
let maxCombo = 0;
let health = 50; 
let bpm = 100;
let noteSpawnTimer = 0;
let camZoom = 1.0;
let camBump = 0;
let camShakeX = 0;
let camShakeY = 0;
let selectedWeekIndex = 0;
let selectedDifficulty = 'NORMAL';
let scrollSpeedPx = 0; // Calculated per frame

// Entities
let notes = [];
let particles = [];
let feedbacks = [];
let receptors = []; // { x, y, pressed, lane }

const ARROW_COLORS = ['#C24B99', '#00FFFF', '#12FA05', '#F9393F']; // Left, Down, Up, Right
const ARROW_ANGLES = [Math.PI * 1.5, Math.PI, 0, Math.PI * 0.5]; 
const LANE_KEYS = [['KeyD', 'ArrowLeft'], ['KeyF', 'ArrowDown'], ['KeyJ', 'ArrowUp'], ['KeyK', 'ArrowRight']];

const WEEKS = [
    { name: "SET 1: Warmup Circuit", bpm: 100, audioId: 'bgm_week1', rate: 1.0 },
    { name: "SET 2: Ghost Frequency", bpm: 120, audioId: 'bgm_week2', rate: 1.1 },
    { name: "SET 3: Voltage Rush", bpm: 140, audioId: 'bgm_week3', rate: 1.2 }
];

// --- §3 Lifecycle & Input ---

window.addEventListener('DOMContentLoaded', () => {
    resize();
    initMenu();
    setGlobalVolume(gameConfig.masterVolume);
    

    requestAnimationFrame(loop);
});

window.addEventListener('resize', resize);

function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cw = rect.width;
    ch = rect.height;
    
    // Layout
    const laneW = Math.min(cw / 4.5, 110); 
    const totalW = laneW * 4;
    const startX = (cw - totalW) / 2 + laneW/2;
    const receptorY = ch - 120; 
    
    // Preserve pressed state if resizing during play
    const oldPressed = receptors.map(r => r.pressed);
    
    receptors = [];
    for(let i=0; i<4; i++) {
        receptors.push({
            x: startX + i * laneW,
            y: receptorY, 
            scale: 1.0,
            pressed: oldPressed[i] || false,
            lane: i,
            glow: 0
        });
    }
}

function setGlobalVolume(val) {
    sfxGain.gain.value = val;
    ['bgm_week1', 'bgm_week2', 'bgm_week3'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.volume = val;
    });
}

function initMenu() {
    const selector = document.getElementById('week-selector');
    selector.innerHTML = '';
    
    WEEKS.forEach((w, i) => {
        const btn = document.createElement('button');
        btn.className = "menu-btn week-card neon-panel w-full text-white border-l-8 border-[#ff0055] p-4 text-left text-2xl hover:bg-gray-700 hover:pl-6 transition-all mb-2 rounded-r";
        btn.innerHTML = `<span class="text-[#00f3ff] mr-4 font-bold">WK ${i+1}</span> ${w.name}`;
        btn.onclick = (e) => {
            e.stopPropagation();
            selectedWeekIndex = i;
            playMappedSFX('menu', 0.3);
            showDifficultySelect();
        };
        selector.appendChild(btn);
    });
    
    document.getElementById('week-selector').classList.remove('hidden');
    document.getElementById('diff-selector').classList.add('hidden');
    document.getElementById('result-panel').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function showDifficultySelect() {
    document.getElementById('week-selector').classList.add('hidden');
    document.getElementById('diff-selector').classList.remove('hidden');
}

function backToWeeks() {
    playMappedSFX('menu', 0.3);
    document.getElementById('diff-selector').classList.add('hidden');
    document.getElementById('week-selector').classList.remove('hidden');
}

window.selectDifficulty = (diff) => {
    selectedDifficulty = diff;
    playMappedSFX('menu', 0.35);
    startGame();
};

function startGame() {
    ensureAudioUnlocked();
    const week = WEEKS[selectedWeekIndex];
    playMappedSFX('start', 0.4);
    
    // Reset Audio
    ['bgm_week1', 'bgm_week2', 'bgm_week3'].forEach(id => {
        const el = document.getElementById(id);
        el.pause();
        el.currentTime = 0;
    });
    stopHoldLoop();
    lowHealthWarnAt = -1;
    lastComboBurstAt = -1;
    comboBurstGif.classList.remove('visible');
    resultReactionGif.classList.remove('visible');

    // Reset State
    score = 0;
    combo = 0;
    maxCombo = 0;
    health = 50;
    notes = [];
    particles = [];
    feedbacks = [];
    gameTime = 0;
    levelDuration = gameConfig.gameDuration;
    
    // Difficulty
    let speedMod = 1.0;
    if (selectedDifficulty === 'EASY') {
        bpm = week.bpm * 0.9;
    } else if (selectedDifficulty === 'NORMAL') {
        bpm = week.bpm;
    } else { 
        bpm = week.bpm * 1.1;
    }

    // Play BGM
    currentBgm = document.getElementById(week.audioId);
    currentBgm.src = MEDIA.bgm[selectedWeekIndex] || MEDIA.bgm[0];
    currentBgm.volume = getVolumeScale(0.42);
    currentBgm.playbackRate = week.rate;
    currentBgm.loop = true;
    currentBgm.play().catch(() => {});
    
    document.getElementById('menu-overlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateHUD();
    
    gameState = 'PLAYING';
    resize();
}

function endGame(isWin) {
    gameState = isWin ? 'WIN' : 'GAMEOVER';
    if(currentBgm) currentBgm.pause();
    stopHoldLoop();
    
    const resultPanel = document.getElementById('result-panel');
    const resultTitle = document.getElementById('result-title');
    const finalScore = document.getElementById('final-score');
    const rankContainer = document.getElementById('rating-container');
    const finalRank = document.getElementById('final-rank');
    
    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    resultPanel.classList.remove('hidden');

    finalScore.innerText = score;

    if (isWin) {
        playMappedSFX('win', 0.55);
        flashGif(resultReactionGif, 2400);
        resultTitle.innerText = "STAGE CLEAR";
        resultTitle.style.color = "#22c55e"; 
        resultTitle.classList.add('animate-bounce');
        rankContainer.classList.remove('hidden');
        
        let rank = "C";
        if (score > 50000) rank = "S";
        else if (score > 35000) rank = "A";
        else if (score > 20000) rank = "B";
        
        finalRank.innerText = rank;
        finalRank.style.color = rank === "S" ? "#00f3ff" : (rank === "A" ? "#22c55e" : "#fbbf24");
    } else {
        playMappedSFX('die', 0.55);
        resultReactionGif.src = 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
        flashGif(resultReactionGif, 2200);
        resultTitle.innerText = "FAILED";
        resultTitle.style.color = "#ef4444";
        resultTitle.classList.remove('animate-bounce');
        rankContainer.classList.add('hidden');
    }
}

// --- Input Handling ---

function handlePointer(e) {
    if (gameState !== 'PLAYING') return;
    
    // Prevent default touch actions (scrolling)
    e.preventDefault();
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const laneW = Math.min(cw / 4.5, 110);
    const totalW = laneW * 4;
    const startX = (cw - totalW) / 2;
    
    let lane = -1;
    if (x >= startX && x <= startX + totalW) {
        lane = Math.floor((x - startX) / laneW);
    }

    if (e.type === 'pointerdown') {
        if (lane >= 0 && lane < 4) {
            setInputState(lane, true);
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        // For simplicity in single-touch MVP, release all if outside, or specific if tracked.
        // Better: Release the lane that was pressed. 
        // Since we don't track pointerId per lane in this MVP, we release the calculated lane.
        if (lane >= 0 && lane < 4) {
            setInputState(lane, false);
        } else {
            // Fallback: Release all if touch ends outside (prevent stuck keys)
            receptors.forEach((r, i) => setInputState(i, false));
        }
    }
}

function handleKey(e) {
    if (gameState !== 'PLAYING') return;
    
    for (let i = 0; i < 4; i++) {
        if (LANE_KEYS[i].includes(e.code)) {
            if (e.type === 'keydown' && !e.repeat) {
                setInputState(i, true);
            } else if (e.type === 'keyup') {
                setInputState(i, false);
            }
        }
    }
}

function setInputState(lane, isPressed) {
    if (!receptors[lane]) return;
    
    const wasPressed = receptors[lane].pressed;
    receptors[lane].pressed = isPressed;
    
    if (isPressed && !wasPressed) {
        // Fresh press: Trigger Hit Logic
        receptors[lane].scale = 1.2;
        receptors[lane].glow = 1.0;
        checkHit(lane);
    }
}

function checkHit(lane) {
    const hitY = receptors[lane].y;
    // Find closest hittable note in this lane
    // Filter out notes that are already 'holding' or 'done' or 'missed'
    const candidates = notes.filter(n => n.lane === lane && n.state === 'active');
    if (candidates.length === 0) return;
    
    candidates.sort((a, b) => Math.abs(a.y - hitY) - Math.abs(b.y - hitY));
    const target = candidates[0];
    const err = Math.abs(target.y - hitY);
    
    let windowMult = selectedDifficulty === 'EASY' ? 1.5 : (selectedDifficulty === 'HARD' ? 0.8 : 1.0);
    const hitWindow = 120 * windowMult;

    if (err < hitWindow) {
        // Hit!
        let rating = "BAD";
        let color = "#888";
        let scoreAdd = 0;
        
        if (err < 40 * windowMult) {
            rating = "SICK!!";
            color = "#0ff";
            scoreAdd = 350;
            createSplash(target.x, target.y, ARROW_COLORS[lane], 15);
        } else if (err < 80 * windowMult) {
            rating = "GOOD";
            color = "#0f0";
            scoreAdd = 200;
            createSplash(target.x, target.y, ARROW_COLORS[lane], 8);
        } else {
            rating = "BAD";
            color = "#f00";
            scoreAdd = 50;
            combo = 0; // Combo break on bad hit? Optional. Let's keep combo but low score.
        }
        
        if (rating !== "BAD") {
            combo++;
            maxCombo = Math.max(maxCombo, combo);
        }

        score += scoreAdd;
        health = Math.min(100, health + 2);
        
        spawnFeedback(cw/2, ch/2, rating, color);
        playMappedSFX('hit', rating === 'SICK!!' ? 0.45 : 0.32);
        if (combo > 0 && combo % 10 === 0 && combo !== lastComboBurstAt) {
            lastComboBurstAt = combo;
            flashGif(comboBurstGif, 950);
        }
        
        if (target.isHold) {
            target.state = 'holding';
            target.y = hitY; // Snap head to receptor visual
        } else {
            target.state = 'done';
            target.hit = true; // Mark for removal
        }
    } else {
        // Ghost tap / Miss if too far? 
        // Usually VSRGs don't punish ghost taps unless strict. 
        // We will just ignore taps that are too far to prevent accidental misses.
    }
}

canvas.addEventListener('pointerdown', handlePointer, { passive: false });
canvas.addEventListener('pointerup', handlePointer, { passive: false });
canvas.addEventListener('pointercancel', handlePointer, { passive: false });
window.addEventListener('keydown', handleKey);
window.addEventListener('keyup', handleKey);

document.getElementById('retry-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    playMappedSFX('menu', 0.35);
    startGame();
});
document.getElementById('menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    playMappedSFX('menu', 0.35);
    stopHoldLoop();
    gameState = 'MENU';
    document.getElementById('result-panel').classList.add('hidden');
    initMenu();
});

// --- §4 Game Loop ---

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    if (gameState === 'PLAYING') {
        try {
            update(dt);
            draw();
        } catch (e) { console.error(e); }
    } else if (gameState === 'MENU' || gameState === 'WIN' || gameState === 'GAMEOVER') {
        drawMenuBG(timestamp / 1000);
    }
    
    requestAnimationFrame(loop);
}

function update(dt) {
    gameTime += dt;
    
    if (gameTime >= levelDuration) {
        endGame(true);
        return;
    }
    
    // Beat Pulse
    const beatLen = 60 / bpm;
    if (gameTime % beatLen < dt) {
        camZoom = 1.02;
        receptors.forEach(r => r.scale = 1.1);
    }
    camZoom += (1.0 - camZoom) * 6 * dt;
    camBump *= 0.9;
    camShakeX = (Math.random() - 0.5) * camBump * 20;
    camShakeY = (Math.random() - 0.5) * camBump * 20;
    
    // Spawning
    noteSpawnTimer -= dt;
    if (noteSpawnTimer <= 0) {
        spawnNote();
        let density = selectedDifficulty === 'EASY' ? 0.6 : (selectedDifficulty === 'HARD' ? 1.3 : 1.0);
        noteSpawnTimer = (beatLen / density);
    }
    
    // Note Movement & Logic
    let baseSpeed = gameConfig.scrollSpeed;
    if (selectedDifficulty === 'EASY') baseSpeed *= 0.8;
    if (selectedDifficulty === 'HARD') baseSpeed *= 1.3;
    
    scrollSpeedPx = (ch * 0.8) * (baseSpeed / 10); // Pixels per second
    const receptorY = receptors[0].y;

    for (let i = notes.length - 1; i >= 0; i--) {
        let n = notes[i];
        
        if (n.state === 'done') {
            notes.splice(i, 1);
            continue;
        }

        // Move Logic
        if (n.state === 'active') {
            n.y += scrollSpeedPx * dt;
            
            // Miss Condition (Head passed receptor)
            if (n.y > receptorY + 100) {
                triggerMiss(i);
                continue;
            }
        } else if (n.state === 'holding') {
            // In holding state, the head stays at receptorY, but we conceptually move "through" the note
            // Effectively, we decrease the remaining length or move the tail
            // Simpler visual approach: Move the note down, but clamp head to receptorY for drawing?
            // No, easier: Note continues moving down. 
            // If button held: Score. 
            // If button released: Miss.
            // If tail passes receptor: Done.
            
            n.y += scrollSpeedPx * dt;
            
            // Check Input
            if (!receptors[n.lane].pressed) {
                // Released too early!
                n.state = 'missed'; // Turn gray/fade
                combo = 0;
                health -= 5;
                spawnFeedback(cw/2, ch/2, "DROP", "#888");
                stopHoldLoop();
                playMappedSFX('miss', 0.42);
                continue;
            }
            
            // Holding Logic
            score += 10; // Constant score stream
            health = Math.min(100, health + 0.1);
            receptors[n.lane].glow = 1.5;
            startHoldLoop();
            camBump = 0.2; // Rumble
            
            // Spawn spark particles at receptor
            if (Math.random() > 0.5) {
                particles.push({
                    x: receptors[n.lane].x + (Math.random()-0.5)*40,
                    y: receptorY,
                    vx: (Math.random()-0.5)*200,
                    vy: Math.random() * -300,
                    life: 0.5,
                    color: '#fff',
                    size: Math.random()*3+1
                });
            }

            // Check completion
            // The tail is at n.y - n.length (visually above head).
            // Actually, if head is at n.y, and we draw tail upwards, tail end is at n.y - n.length.
            // When tail end passes receptorY, we are done.
            if (n.y - n.length > receptorY) {
                n.state = 'done';
                score += 500;
                combo++;
                createSplash(receptors[n.lane].x, receptorY, '#fff', 20);
                spawnFeedback(cw/2, ch/2, "COMPLETE!", "#fff");
                playMappedSFX('win', 0.55);
        flashGif(resultReactionGif, 2400); // Small chime
            }
        } else if (n.state === 'missed') {
            n.y += scrollSpeedPx * dt;
            if (n.y - n.length > ch) {
                notes.splice(i, 1);
            }
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 3.0;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Feedbacks
    for (let i = feedbacks.length - 1; i >= 0; i--) {
        let f = feedbacks[i];
        f.y -= 50 * dt; 
        f.life -= dt;
        if (f.life <= 0) feedbacks.splice(i, 1);
    }
    
    receptors.forEach(r => {
        r.scale += (1.0 - r.scale) * 15 * dt;
        r.glow *= 0.9;
    });
    
    if (health <= 28) {
        const warningBucket = Math.floor(gameTime * 1.2);
        if (warningBucket !== lowHealthWarnAt) {
            lowHealthWarnAt = warningBucket;
            playMappedSFX('warning', 0.24);
        }
    } else {
        lowHealthWarnAt = -1;
    }

    updateHUD();
}

function triggerMiss(index) {
    let n = notes[index];
    combo = 0;
    health -= (selectedDifficulty === 'HARD' ? 10 : 5);
    spawnFeedback(cw/2, ch/2, "MISS", "#555");
    stopHoldLoop();
    playMappedSFX('miss', 0.4);
    // Don't remove immediately, let it fall off screen
    n.state = 'missed';
    
    if (health <= 0) endGame(false);
    if (health <= 28) {
        const warningBucket = Math.floor(gameTime * 1.2);
        if (warningBucket !== lowHealthWarnAt) {
            lowHealthWarnAt = warningBucket;
            playMappedSFX('warning', 0.24);
        }
    } else {
        lowHealthWarnAt = -1;
    }

    updateHUD();
}

function spawnNote() {
    const lane = Math.floor(Math.random() * 4);
    
    // Check if lane is free (simple collision check)
    // We only spawn if the last note in this lane is far enough up
    const lastNoteInLane = notes.filter(n => n.lane === lane).sort((a,b) => a.y - b.y)[0]; // Topmost note (lowest y)
    
    // Spawn Y is usually -50.
    // If last note exists, its tail is at lastNote.y - lastNote.length.
    // We need newNote.y > lastNote.y - lastNote.length + gap? No.
    // Notes move down (y increases). New notes spawn at top (low y).
    // So new note Y must be < lastNote.y - lastNote.length - gap.
    
    let spawnY = -50;
    if (lastNoteInLane) {
        const tailY = lastNoteInLane.y - lastNoteInLane.length;
        if (tailY < 100) return; // Lane too full
    }

    // Determine Type
    const isHold = Math.random() * 100 < gameConfig.holdFrequency;
    let length = 0;
    if (isHold) {
        // Length in pixels based on duration
        // Min 1 beat, max 3 beats
        const beatLenPx = scrollSpeedPx * (60 / bpm);
        length = beatLenPx * (1 + Math.random() * 2);
    }

    notes.push({
        lane: lane,
        x: receptors[lane].x,
        y: spawnY, 
        state: 'active', // active, holding, done, missed
        isHold: isHold,
        length: length,
        color: ARROW_COLORS[lane],
        angle: ARROW_ANGLES[lane]
    });
    
    // If we spawned a long note, we need to delay the next spawn timer to prevent overlapping
    if (isHold) {
        noteSpawnTimer += (length / scrollSpeedPx);
    }
}

function createSplash(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 250 + 100;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 6 + 3
        });
    }
}

function spawnFeedback(x, y, text, color) {
    feedbacks.push({
        x: x, y: y, text: text, color: color, life: 0.8, scale: 0.5
    });
}

function updateHUD() {
    document.getElementById('score-display').innerText = Math.floor(score);
    document.getElementById('combo-display').innerText = combo;
    
    // Health
    const bar = document.getElementById('health-bar');
    bar.style.width = Math.max(0, health) + '%';
    if (health > 70) bar.style.backgroundColor = '#22c55e'; 
    else if (health > 30) bar.style.backgroundColor = '#eab308'; 
    else bar.style.backgroundColor = '#dc2626'; 

    // Progress
    const prog = document.getElementById('song-progress');
    const pct = Math.min(100, (gameTime / levelDuration) * 100);
    prog.style.width = (100 - pct) + '%';
}

// --- §5 Drawing ---

function drawArrow(ctx, x, y, size, angle, color, isOutline) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const s = size;
    
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s, 0);
    ctx.lineTo(s*0.3, 0);
    ctx.lineTo(s*0.3, s);
    ctx.lineTo(-s*0.3, s);
    ctx.lineTo(-s*0.3, 0);
    ctx.lineTo(-s, 0);
    ctx.closePath();
    
    if (isOutline) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#222';
        ctx.stroke();
        ctx.fillStyle = 'rgba(20,20,20,0.8)';
        ctx.fill();
    } else {
        ctx.shadowBlur = 15;
        ctx.shadowColor = color;
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
    }
    ctx.restore();
}

function drawMenuBG(t) {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, cw, ch);
    
    ctx.save();
    ctx.globalAlpha = 0.1;
        ctx.font = "bold 120px var(--font-display)";
    ctx.fillStyle = '#ff0055';
    const offset = (t * 50) % 400;
    
    ctx.rotate(-0.2);
    for(let y=-200; y<ch+400; y+=200) {
        for(let x=-400; x<cw+400; x+=400) {
            ctx.fillText("HOLD", x + offset + (y%400)/2, y);
        }
    }
    ctx.restore();
}

function draw() {
    ctx.save();
    ctx.translate(cw/2 + camShakeX, ch/2 + camShakeY);
    const z = camZoom + camBump * 0.1;
    ctx.scale(z, z);
    ctx.translate(-cw/2, -ch/2);
    
    // 1. Background
    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#0f0518');
    grad.addColorStop(1, '#2d1b4e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);
    
    // Grid
    ctx.save();
    ctx.translate(cw/2, ch);
    ctx.scale(1, 0.3);
    ctx.beginPath();
    ctx.arc(0, 0, cw, 0, Math.PI, true);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff0055';
    ctx.stroke();
    // Grid lines
    ctx.beginPath();
    for(let i=-5; i<=5; i++) {
        ctx.moveTo(i*cw/5, 0);
        ctx.lineTo(i*cw/15, -cw);
    }
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    ctx.restore();
    
    // 2. Receptors
    receptors.forEach((r, i) => {
        // Glow effect
        if (r.glow > 0.01) {
            ctx.save();
            ctx.shadowBlur = 30 * r.glow;
            ctx.shadowColor = ARROW_COLORS[i];
            ctx.globalAlpha = r.glow * 0.5;
            ctx.fillStyle = ARROW_COLORS[i];
            ctx.beginPath();
            ctx.arc(r.x, r.y, 50, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        drawArrow(ctx, r.x, r.y, 42 * r.scale, ARROW_ANGLES[i], ARROW_COLORS[i], true);
        if (r.pressed) {
            ctx.save();
            ctx.globalAlpha = 0.7;
            drawArrow(ctx, r.x, r.y, 42 * r.scale, ARROW_ANGLES[i], ARROW_COLORS[i], false);
            ctx.restore();
        }
    });
    
    // 3. Notes (Draw trails first, then heads)
    
    // Draw Trails
    notes.forEach(n => {
        if (n.isHold && n.state !== 'done') {
            const tailEnd = n.y - n.length;
            const headY = n.y;
            
            // If holding, the visual head is clamped to receptor, but logic head moves down.
            // Actually, let's just draw from headY up to tailEnd.
            
            ctx.save();
            const w = 40;
            const x = n.x - w/2;
            
            // Gradient Trail
            const grd = ctx.createLinearGradient(0, tailEnd, 0, headY);
            grd.addColorStop(0, 'rgba(255,255,255,0)');
            if (n.state === 'holding') {
                grd.addColorStop(0.5, n.color);
                grd.addColorStop(1, '#fff');
                ctx.shadowBlur = 20;
                ctx.shadowColor = n.color;
            } else if (n.state === 'missed') {
                grd.addColorStop(0.5, '#555');
                grd.addColorStop(1, '#333');
            } else {
                grd.addColorStop(0.2, n.color); // Solid color
                grd.addColorStop(1, n.color);
                ctx.globalAlpha = 0.6;
            }
            
            ctx.fillStyle = grd;
            ctx.fillRect(x, tailEnd, w, headY - tailEnd);
            
            // Inner bright core
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(n.x - 5, tailEnd, 10, headY - tailEnd);
            
            ctx.restore();
        }
    });

    // Draw Heads
    notes.forEach(n => {
        if (n.state === 'done') return;
        
        // If holding, we can hide the head or make it glow intensely at the receptor
        // But since n.y continues moving, we should probably draw the head at Math.min(n.y, receptorY) if holding?
        // Let's draw head at n.y unless holding, then draw at receptorY
        
        let drawY = n.y;
        if (n.state === 'holding') {
            drawY = receptors[n.lane].y;
            // Draw electric effect
            ctx.save();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(n.x - 20, drawY);
            for(let k=0; k<5; k++) {
                ctx.lineTo(n.x - 10 + k*5 + Math.random()*10, drawY + (Math.random()-0.5)*20);
            }
            ctx.stroke();
            ctx.restore();
        }
        
        if (n.state === 'missed') {
            ctx.globalAlpha = 0.3;
            drawArrow(ctx, n.x, drawY, 42, n.angle, '#555', false);
            ctx.globalAlpha = 1;
        } else {
            drawArrow(ctx, n.x, drawY, 42, n.angle, n.color, false);
        }
    });
    
    // 4. Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // 5. Feedbacks
    for (let f of feedbacks) {
        ctx.save();
        ctx.translate(f.x, f.y);
        const s = 1 + Math.sin(f.life * Math.PI) * 0.3;
        ctx.scale(s, s);
        
        ctx.font = "bold 700 70px var(--font-display)";
        ctx.textAlign = "center";
        ctx.lineJoin = 'round';
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#000';
        ctx.strokeText(f.text, 0, 0);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, 0, 0);
        ctx.restore();
    }
    
    ctx.restore();
}

</script>
