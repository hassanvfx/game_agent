<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Meme Relay.exe</title>
<!-- [agent-note][stage4] resolved-font: display/ui -> catalogs/fonts.json (Press Start 2P + Orbitron) -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-0: #120e24;
        --bg-1: #1d1538;
        --bg-2: #2f1f56;
        --panel: rgba(22, 18, 40, 0.86);
        --panel-soft: rgba(255, 255, 255, 0.08);
        --panel-strong: rgba(255, 255, 255, 0.14);
        --text: #f8f7ff;
        --text-dim: #c7c5df;
        --accent: #8b5cf6;
        --accent-2: #ff4fa3;
        --accent-3: #67e8f9;
        --danger: #ff6b81;
        --success: #34d399;
        --shadow: 0 18px 40px rgba(8, 8, 18, 0.35);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 16px;
        --hud-height: 84px;
    }

    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 79, 163, 0.18), transparent 32%),
            radial-gradient(circle at 85% 18%, rgba(103, 232, 249, 0.14), transparent 24%),
            linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 36%, var(--bg-0) 100%);
        color: var(--text);
        font-family: 'Orbitron', system-ui, sans-serif;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: auto;
        pointer-events: none;
        z-index: 0;
        filter: blur(0.4px);
    }

    body::before {
        width: 52vw;
        height: 52vw;
        left: -18vw;
        top: -12vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 79, 163, 0.22), transparent 68%);
    }

    body::after {
        width: 40vw;
        height: 40vw;
        right: -12vw;
        bottom: -10vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(103, 232, 249, 0.2), transparent 68%);
    }

    button, textarea { font: inherit; }
    button {
        border: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    canvas {
        display: block;
        touch-action: none;
        position: relative;
        z-index: 1;
    }

    textarea {
        resize: none;
        color: #f4f3ff;
        background: rgba(8, 10, 24, 0.72);
        border: 1px solid rgba(255,255,255,0.1);
    }

    textarea:focus {
        outline: 2px solid rgba(103, 232, 249, 0.9);
        border-color: rgba(103, 232, 249, 0.5);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.06); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }

    .hidden { display: none !important; }
    .select-none { user-select: none; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }

    .screen-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .screen-root::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.04), transparent 14%, transparent 86%, rgba(255,255,255,0.04)),
            repeating-linear-gradient(
                180deg,
                rgba(255,255,255,0.02) 0px,
                rgba(255,255,255,0.02) 1px,
                transparent 2px,
                transparent 4px
            );
        opacity: 0.45;
    }

    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        padding: 16px;
    }

    .panel {
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(180deg, rgba(31, 26, 56, 0.95), rgba(16, 14, 30, 0.93));
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: var(--shadow);
        color: var(--text);
    }

    .panel::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 38%, transparent 62%, rgba(103,232,249,0.08));
    }

    .hero-card,
    .game-over-card {
        width: min(100%, 420px);
        border-radius: var(--radius-xl);
        padding: 28px 24px;
        text-align: center;
    }

    .hero-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: relative;
        z-index: 1;
    }

    .avatar-core {
        position: relative;
        width: 116px;
        height: 116px;
        margin: 0 auto;
        border-radius: 32px;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 35% 30%, #fff7bf 0 8%, transparent 8.2%),
            radial-gradient(circle at 65% 30%, #fff7bf 0 8%, transparent 8.2%),
            linear-gradient(180deg, #ff77ba 0%, #ff4fa3 32%, #8b5cf6 100%);
        box-shadow:
            0 0 0 4px rgba(255,255,255,0.08),
            0 20px 34px rgba(139, 92, 246, 0.4),
            0 0 24px rgba(255, 79, 163, 0.35);
        animation: mascotBob 2.8s ease-in-out infinite;
    }

    .avatar-core::before,
    .avatar-core::after {
        content: "";
        position: absolute;
        top: 42px;
        width: 12px;
        height: 18px;
        border-radius: 999px;
        background: #27143f;
        box-shadow: 0 0 10px rgba(255,255,255,0.25);
    }

    .avatar-core::before { left: 32px; }
    .avatar-core::after { right: 32px; }

    .avatar-mouth {
        position: absolute;
        bottom: 28px;
        width: 40px;
        height: 18px;
        border-bottom: 4px solid #27143f;
        border-radius: 0 0 30px 30px;
    }

    .avatar-spark {
        position: absolute;
        border-radius: 999px;
        background: rgba(255,255,255,0.8);
        box-shadow: 0 0 16px rgba(255,255,255,0.5);
        animation: floatSpark 2.2s ease-in-out infinite;
    }

    .avatar-spark.s1 { width: 9px; height: 9px; left: -6px; top: 16px; }
    .avatar-spark.s2 { width: 7px; height: 7px; right: 4px; top: 10px; animation-delay: 0.5s; }
    .avatar-spark.s3 { width: 11px; height: 11px; right: -8px; bottom: 24px; animation-delay: 1s; }

    .eyebrow {
        position: absolute;
        top: 28px;
        width: 24px;
        height: 8px;
        border-top: 4px solid rgba(39, 20, 63, 0.92);
        border-radius: 999px;
    }

    .eyebrow.left { left: 24px; transform: rotate(-8deg); }
    .eyebrow.right { right: 24px; transform: rotate(8deg); }

    .headline {
        margin: 0;
        font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
        font-size: clamp(28px, 5vw, 34px);
        line-height: 1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(103,232,249,0.24);
    }

    .subhead {
        margin: 0;
        color: var(--text-dim);
        font-size: 18px;
        line-height: 1.1;
    }

    .tagline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        align-self: center;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(103,232,249,0.24);
        color: #b7f6ff;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .btn {
        position: relative;
        z-index: 1;
        width: 100%;
        min-height: 54px;
        border-radius: 18px;
        padding: 14px 18px;
        font-weight: 700;
        font-size: 18px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .btn:active {
        transform: scale(0.97);
        filter: brightness(1.06);
    }

    .btn-primary {
        color: white;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow: 0 14px 26px rgba(139, 92, 246, 0.3);
    }

    .btn-secondary {
        color: #fbe9ff;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-neutral {
        color: #f4f3ff;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.14);
    }

    .custom-screen {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        background:
            linear-gradient(180deg, rgba(16, 14, 30, 0.96), rgba(12, 10, 24, 0.98));
        pointer-events: auto;
    }

    .custom-header,
    .custom-footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: rgba(12, 10, 22, 0.78);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: relative;
        z-index: 2;
    }

    .custom-header { justify-content: space-between; }
    .custom-footer {
        border-bottom: 0;
        border-top: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 -12px 24px rgba(0,0,0,0.2);
    }

    .custom-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--text);
    }

    .custom-content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        padding-bottom: 20px;
        display: grid;
        gap: 16px;
        align-content: start;
    }

    .editor-card {
        border-radius: 22px;
        padding: 16px;
        background: linear-gradient(180deg, rgba(38, 31, 66, 0.94), rgba(17, 14, 30, 0.94));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    .editor-label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        font-weight: 700;
        color: #f8f7ff;
        font-size: 18px;
    }

    .editor-label small {
        color: #a7a6c6;
        font-size: 12px;
        font-weight: 400;
    }

    .tip {
        text-align: center;
        color: #9f9cc1;
        font-size: 12px;
    }

    .footer-grow { flex: 1; }
    .footer-wide { flex: 2; }

    .game-over-card h2 {
        margin: 0 0 8px;
        font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
        font-size: clamp(36px, 8vw, 54px);
        line-height: 0.95;
        color: #ff8bb2;
        text-shadow: 0 0 18px rgba(255,107,129,0.28);
    }

    .game-over-card p {
        margin: 0 0 18px;
        color: var(--text-dim);
        font-size: 18px;
    }

    .score-card {
        margin-bottom: 18px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.09);
    }

    .score-card .label {
        color: #a8f8ff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .score-card .value {
        margin-top: 6px;
        font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
        font-size: 40px;
        color: white;
    }

    .row {
        display: flex;
        gap: 12px;
    }

    .hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 72px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        z-index: 40;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background:
            linear-gradient(180deg, rgba(15, 13, 28, 0.88), rgba(15, 13, 28, 0.54));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
    .hud-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .hud-avatar {
        position: relative;
        width: 48px;
        height: 48px;
        flex: 0 0 48px;
        border-radius: 18px;
        background:
            radial-gradient(circle at 30% 30%, #fff7bf 0 8%, transparent 8.2%),
            radial-gradient(circle at 70% 30%, #fff7bf 0 8%, transparent 8.2%),
            linear-gradient(180deg, #ff77ba, #8b5cf6);
        box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .hud-avatar::before,
    .hud-avatar::after {
        content: "";
        position: absolute;
        top: 18px;
        width: 5px;
        height: 8px;
        border-radius: 999px;
        background: #291544;
    }

    .hud-avatar::before { left: 14px; }
    .hud-avatar::after { right: 14px; }

    .hud-avatar .mouth {
        position: absolute;
        left: 50%;
        bottom: 11px;
        width: 16px;
        height: 7px;
        border-bottom: 2.5px solid #291544;
        border-radius: 0 0 18px 18px;
        transform: translateX(-50%);
    }

    .status-dot {
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid rgba(15, 13, 28, 0.95);
        background: linear-gradient(180deg, #6dffaf, #1bc47b);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
    }

    .hud-meta {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1;
    }

    .hud-meta strong {
        font-size: 14px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #ffffff;
    }

    .hud-meta span {
        margin-top: 4px;
        font-size: 11px;
        color: #81f0ba;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .hud-score {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 10px 14px;
        white-space: nowrap;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
        font-size: 18px;
        color: #ffd6f3;
    }

    .score-heart {
        font-size: 18px;
        line-height: 1;
        filter: drop-shadow(0 0 8px rgba(255,79,163,0.5));
    }

    .sr-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    @keyframes mascotBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
    }

    @keyframes floatSpark {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
        50% { transform: translateY(-8px) scale(1.18); opacity: 1; }
    }

    @media (max-width: 480px) {
        .ui-layer { padding: 12px; }
        .hero-card,
        .game-over-card { padding: 24px 18px; }
        .avatar-core {
            width: 98px;
            height: 98px;
            border-radius: 28px;
        }
        .headline { font-size: 28px; }
        .subhead { font-size: 16px; }
        .btn { font-size: 17px; min-height: 52px; }
        .custom-title { font-size: 20px; }
        .editor-label { font-size: 17px; }
        textarea { height: 152px !important; }
        .hud {
            padding: 12px;
            min-height: 68px;
        }
        .hud-score {
            padding: 9px 12px;
            font-size: 16px;
        }
    }
</style>
</head>

<!-- UI Layer -->
<div id="game-container" class="screen-root select-none">

    <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->
    <div class="feedback-gif-layer" aria-hidden="true">
        <img id="gif-success" class="feedback-gif" alt="" src="https://i.giphy.com/34HAaqlL2oCUo.webp">

    </div>

    <div id="ui-layer" class="ui-layer pointer-events-none">

        <div id="start-screen" class="panel hero-card pointer-events-auto">
            <div class="hero-stack">
                <div class="tagline">💿 Neon meme dispatch</div>
                <div class="avatar-core" aria-hidden="true">
                    <span class="eyebrow left"></span>
                    <span class="eyebrow right"></span>
                    <span class="avatar-mouth"></span>
                    <span class="avatar-spark s1"></span>
                    <span class="avatar-spark s2"></span>
                    <span class="avatar-spark s3"></span>
                </div>
                <div>
                    <h1 class="headline">Meme Relay.exe</h1>
                    <p class="subhead">Tap fast, ship the perfect post, keep the feed alive.</p>
                </div>
                <button id="start-btn" class="btn btn-primary">Start Run</button>
                <button id="edit-chat-btn" class="btn btn-secondary">✏️ Edit Meme Pack</button>
            </div>
        </div>

        <div id="custom-screen" class="custom-screen hidden">
            <div class="custom-header">
                <h2 class="custom-title">Edit Meme Pack</h2>
                <button id="close-custom-btn" class="btn btn-neutral" style="width:auto; min-height:42px; padding:12px 14px; font-size:14px;">Cancel</button>

            <div class="custom-content custom-scroll">
                <div class="editor-card">

                <div class="editor-card">

                        <small>One per line</small>

                </div>

                <div class="tip">Tip: Keep lines short so they fit the feed.</div>
            </div>

            <div class="custom-footer">
                <button id="reset-defaults-btn" class="btn btn-neutral footer-grow">Reset</button>
                <button id="save-custom-btn" class="btn btn-primary footer-wide">Save & Close</button>
            </div>
        </div>

        <div id="game-over-screen" class="panel game-over-card pointer-events-auto hidden">
            <h2>Timed Out</h2>
            <p>The meme feed moved on.</p>
            <div class="score-card">
                <div class="label">Hype</div>
                <div class="value" id="finalScore">0</div>
            </div>
            <div class="row">
                <button id="menu-btn" class="btn btn-neutral footer-grow">Menu</button>
                <button id="restart-btn" class="btn btn-primary footer-wide">Try Again</button>
            </div>
        </div>

        <div id="hud" class="hud hidden">
            <div class="hud-left">
                <div class="hud-avatar" aria-hidden="true">
                    <span class="mouth"></span>
                    <span class="status-dot"></span>
                </div>
                <div class="hud-meta">
                    <strong>Meme Feed</strong>
                    <span>● Live now</span>
                </div>
            </div>
            <div class="hud-score">
                <span class="score-heart">❤</span>
                <span id="score">0</span>
            </div>
        </div>
    </div>
</div>

        "The group is watching.",
        "Reaction window is tiny.",
        "Can you top this post?",
        "This meme needs context.",
        "Reply before it fades.",
        "Keep the streak alive.",
        "You saw that too, right?",
        "One more for the timeline."
    ]
};

// Runtime Data
let playerReplies = [...DEFAULTS.PLAYER];
let aiPhrases = [...DEFAULTS.AI];

// Canvas Setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = 1;

// Game State
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
let lastTime = 0;
let score = 0;
let gameSpeed = 1;
let shakeTime = 0;
let round = 1;

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioCtx ? new AudioCtx() : null;
const sounds = { unlocked: false, lastWarningAt: 0 };
const successGif = document.getElementById('gif-success');
const failGif = document.getElementById('gif-fail');
let feedbackTimer = 0;

function initAudio() {
    if (sounds.unlocked) return;
    sounds.unlocked = true;
    if (audioCtx && audioCtx.state !== 'running') {
        audioCtx.resume().catch(() => {});
    }
    const bgm = document.getElementById('bgm_main');
    if (bgm) {
        bgm.volume = 0.2;
        bgm.play().catch(() => {});
    }
}

function setBgmPaused(paused) {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    if (paused) bgm.pause();
    else if (sounds.unlocked) bgm.play().catch(() => {});
}

function triggerFeedback(kind) {
    const target = kind === 'fail' ? failGif : successGif;
    if (!target) return;
    clearTimeout(feedbackTimer);
    successGif?.classList.remove('show');
    failGif?.classList.remove('show');
    target.classList.add('show');
    feedbackTimer = setTimeout(() => {
        target.classList.remove('show');
    }, kind === 'fail' ? 1800 : 1100);
}

function playSfx(id, type, volume = 0.5) {
    const el = document.getElementById(id);
    if (el) {
        el.pause();
        el.currentTime = 0;
        el.volume = volume;
        el.play().catch(() => synthSfx(type));
    } else {
        synthSfx(type);
    }
}

function synthSfx(type) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'reply') {
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(820, now + 0.12);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        osc.start();
        osc.stop(now + 0.12);
    } else if (type === 'success') {
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + 0.18);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.18);
        osc.start();
        osc.stop(now + 0.18);
    } else if (type === 'warning') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(180, now + 0.22);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.22);
        osc.start();
        osc.stop(now + 0.22);
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.4);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start();
        osc.stop(now + 0.4);
    }
}

// Logic Variables
let messages = [];
let particles = [];
let currentInput = "";
let targetInputLength = 0;
let patience = 100;
let maxPatience = 100;
let isAiTyping = false;
let aiTypingTimer = 0;

// Resize
function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = document.getElementById('game-container').getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// Input Handling (Gameplay)
function handleGameTap(e) {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();

    if (isAiTyping) return;

    const difficulty = 15;
    const tapVal = 100 / difficulty;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnParticles(x, y, 'char');

    targetInputLength += tapVal;

    if (targetInputLength >= 100) {
        sendPlayerMessage();
    }
}

function sendPlayerMessage() {
    playSfx('sfx_reply', 'reply', 0.34);

    const text = playerReplies[(round - 1) % playerReplies.length];

    messages.push({
        text: text,
        isPlayer: true,
        t: 0
    });

    score += Math.floor(patience * 10);
    document.getElementById('score').innerText = score;

    targetInputLength = 0;
    patience = 100;
    round++;
    gameSpeed += 0.05;

    isAiTyping = true;
    aiTypingTimer = Math.max(0.5, 1.5 - (round * 0.02));
    spawnParticles(canvas.width / 2, canvas.height - 100, 'burst');
}

function aiSendsMessage() {
    isAiTyping = false;
    const text = aiPhrases[Math.floor(Math.random() * aiPhrases.length)];

    messages.push({
        text: text,
        isPlayer: false,
        t: 0
    });
    shakeTime = 0.2;
    playSfx('sfx_reply', 'reply', 0.42);
    playSfx('sfx_success', 'success', 0.32);
    triggerFeedback('success');
}

function gameOver() {
    gameState = 'GAMEOVER';
    playSfx('sfx_fail', 'fail', 0.4);
    triggerFeedback('fail');
    setBgmPaused(true);
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    shakeTime = 0.5;
}

function resetGame() {
    score = 0;
    round = 1;
    gameSpeed = 1;
    messages = [];
    particles = [];
    targetInputLength = 0;
    patience = 100;
    document.getElementById('score').innerText = "0";

    messages.push({
        text: "Fresh meme drop! Tap out a reply! 📲",
        isPlayer: false,
        t: 0
    });

    gameState = 'PLAYING';
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');

    initAudio();
    playSfx('sfx_start', 'success', 0.38);
    setBgmPaused(false);
}

function spawnParticles(x, y, type) {
    const count = type === 'burst' ? 15 : 2;
    const colors = ['#ff6bb4', '#8b5cf6', '#67e8f9'];
    const glyphs = ['✦', '✧', '❤', '✉', '★'];
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - (type === 'burst' ? 5 : 0),
            life: 1.0,
            color: colors[Math.floor(Math.random() * colors.length)],
            type: type,
            glyph: glyphs[Math.floor(Math.random() * glyphs.length)]
        });
    }
}

// Game Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    if (isAiTyping) {
        aiTypingTimer -= dt;
        if (aiTypingTimer <= 0) aiSendsMessage();
    } else {
        const drainRate = 8 * gameSpeed;
        patience -= drainRate * dt;
        if (patience <= 28 && patience > 0 && Date.now() - sounds.lastWarningAt > 1100) {
            sounds.lastWarningAt = Date.now();
            playSfx('sfx_warning', 'warning', 0.2);
        }
        if (patience <= 0) gameOver();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 20 * dt;
        p.life -= 2 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (shakeTime > 0) shakeTime -= dt;
}

function drawBackdrop(cw, ch) {
    const backdrop = ctx.createLinearGradient(0, 0, 0, ch);
    backdrop.addColorStop(0, '#241545');
    backdrop.addColorStop(0.4, '#17122f');
    backdrop.addColorStop(1, '#0d0a18');
    ctx.fillStyle = backdrop;
    ctx.fillRect(0, 0, cw, ch);

    const flareA = ctx.createRadialGradient(cw * 0.2, ch * 0.16, 0, cw * 0.2, ch * 0.16, cw * 0.4);
    flareA.addColorStop(0, 'rgba(255, 79, 163, 0.26)');
    flareA.addColorStop(1, 'rgba(255, 79, 163, 0)');
    ctx.fillStyle = flareA;
    ctx.fillRect(0, 0, cw, ch);

    const flareB = ctx.createRadialGradient(cw * 0.82, ch * 0.26, 0, cw * 0.82, ch * 0.26, cw * 0.34);
    flareB.addColorStop(0, 'rgba(103, 232, 249, 0.18)');
    flareB.addColorStop(1, 'rgba(103, 232, 249, 0)');
    ctx.fillStyle = flareB;
    ctx.fillRect(0, 0, cw, ch);

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let y = 24; y < ch; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }
}

function drawCharacterSignal(cw, ch) {
    const x = 26;
    const y = Math.max(92, Math.min(ch - 240, 116));
    const w = Math.min(120, cw * 0.26);
    const h = 124;

    ctx.save();
    ctx.globalAlpha = 0.95;
    const glow = ctx.createLinearGradient(x, y, x, y + h);
    glow.addColorStop(0, 'rgba(255, 79, 163, 0.92)');
    glow.addColorStop(1, 'rgba(139, 92, 246, 0.92)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 28);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(x + 6, y + 6, w - 12, h - 12, 24);
    ctx.fill();

    ctx.fillStyle = '#fff7bf';
    ctx.beginPath();
    ctx.arc(x + w * 0.34, y + 40, 8, 0, Math.PI * 2);
    ctx.arc(x + w * 0.66, y + 40, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#24133f';
    ctx.beginPath();
    ctx.arc(x + w * 0.34, y + 42, 3, 0, Math.PI * 2);
    ctx.arc(x + w * 0.66, y + 42, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#24133f';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(x + w * 0.5, y + 74, 18, 0.15, Math.PI - 0.15, false);
    ctx.stroke();

    ctx.fillStyle = 'rgba(103, 232, 249, 0.9)';
    ctx.beginPath();
    ctx.arc(x + w - 14, y + 14, 4, 0, Math.PI * 2);
    ctx.arc(x + 16, y + h - 16, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function draw() {
    const cw = canvas.width / dpr;
    const ch = canvas.height / dpr;

    drawBackdrop(cw, ch);

    let dx = 0, dy = 0;
    if (shakeTime > 0) {
        dx = (Math.random() - 0.5) * 15 * shakeTime;
        dy = (Math.random() - 0.5) * 15 * shakeTime;
    }

    ctx.save();
    ctx.translate(dx, dy);

    drawCharacterSignal(cw, ch);

    const inputH = 120;
    let currentY = ch - inputH - 30;
    ctx.font = "18px Orbitron";

    for (let i = messages.length - 1; i >= 0; i--) {
        const msg = messages[i];
        const isMe = msg.isPlayer;

        const maxBubbleW = cw * 0.7;
        let text = msg.text;
        let textW = ctx.measureText(text).width;

        if (textW > maxBubbleW) {
            const approxChars = Math.floor(text.length * (maxBubbleW / textW));
            text = text.substring(0, approxChars - 3) + "...";
            textW = ctx.measureText(text).width;
        }

        const padding = 14;
        const bubbleW = textW + padding * 2;
        const bubbleH = 44;

        let bx = isMe ? cw - bubbleW - 20 : 20;
        let by = currentY - bubbleH;

        if (msg.t < 1) {
            msg.t += 0.15;
            by += (1 - msg.t) * 20;
            ctx.globalAlpha = msg.t;
        } else {
            ctx.globalAlpha = 1;
        }

        const bubbleGrad = isMe
            ? ctx.createLinearGradient(bx, by, bx + bubbleW, by + bubbleH)
            : ctx.createLinearGradient(bx, by, bx + bubbleW, by + bubbleH);

        if (isMe) {
            bubbleGrad.addColorStop(0, '#8b5cf6');
            bubbleGrad.addColorStop(1, '#ff4fa3');
        } else {
            bubbleGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
            bubbleGrad.addColorStop(1, 'rgba(230,234,255,0.95)');
        }

        ctx.fillStyle = bubbleGrad;
        if (!isMe) {
            ctx.shadowColor = "rgba(0,0,0,0.18)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;
        } else {
            ctx.shadowColor = "rgba(139,92,246,0.28)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;
        }

        ctx.beginPath();
        ctx.roundRect(bx, by, bubbleW, bubbleH, 18);
        ctx.fill();
        ctx.shadowColor = "transparent";

        ctx.fillStyle = isMe ? '#fff' : '#221934';
        ctx.fillText(text, bx + padding, by + 28);

        currentY -= (bubbleH + 10);
        if (currentY < -50) break;
    }
    ctx.globalAlpha = 1;

    if (isAiTyping) {
        ctx.fillStyle = 'rgba(245,246,255,0.97)';
        const bx = 20, by = currentY - 44;
        ctx.shadowColor = "rgba(0,0,0,0.14)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.roundRect(bx, by, 66, 44, 18);
        ctx.fill();
        ctx.shadowColor = "transparent";

        ctx.fillStyle = '#8a88a8';
        const t = Date.now() / 200;
        for(let j = 0; j < 3; j++) {
            const yOff = Math.sin(t + j) * 3;
            ctx.beginPath();
            ctx.arc(bx + 20 + j * 13, by + 22 + yOff, 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const inputGrad = ctx.createLinearGradient(0, ch - inputH, 0, ch);
    inputGrad.addColorStop(0, 'rgba(15,13,28,0.88)');
    inputGrad.addColorStop(1, 'rgba(20,16,36,0.96)');
    ctx.fillStyle = inputGrad;
    ctx.fillRect(0, ch - inputH, cw, inputH);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(0, ch - inputH, cw, 1);

    const barW = cw - 40;
    const barH = 56;
    const barX = 20;
    const barY = ch - 80;

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 28);
    ctx.fill();

    if (targetInputLength > 0) {
        const fillGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
        fillGrad.addColorStop(0, '#8b5cf6');
        fillGrad.addColorStop(1, '#ff4fa3');
        ctx.fillStyle = fillGrad;
        const fillW = (targetInputLength / 100) * barW;
        ctx.beginPath();
        ctx.roundRect(barX, barY, Math.max(28, fillW), barH, 28);
        ctx.fill();
    }

    ctx.fillStyle = targetInputLength > 50 ? '#fff' : '#d7d4ed';
    ctx.font = "700 20px 'Press Start 2P'";
    const statusText = isAiTyping ? "Feed posting..." : (targetInputLength === 0 ? "Tap to react!" : "Uploading...");
    ctx.fillText(statusText, barX + 22, barY + 36);

    if (!isAiTyping && gameState === 'PLAYING') {
        const pRatio = patience / maxPatience;
        const patienceGrad = ctx.createLinearGradient(0, ch - inputH, cw, ch - inputH);
        if (pRatio < 0.3) {
            patienceGrad.addColorStop(0, '#ff6b81');
            patienceGrad.addColorStop(1, '#ff9272');
        } else {
            patienceGrad.addColorStop(0, '#67e8f9');
            patienceGrad.addColorStop(1, '#34d399');
        }
        ctx.fillStyle = patienceGrad;
        ctx.fillRect(0, ch - inputH, cw * pRatio, 4);

        if (pRatio < 0.3) {
            ctx.fillStyle = '#ff8fb0';
            ctx.font = "700 14px 'Press Start 2P'";
            ctx.fillText("POST NOW!", cw - 106, ch - inputH - 10);
        }
    }

    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        if (p.type === 'char') {
            ctx.font = "18px Orbitron";
            ctx.fillText(p.glyph, p.x, p.y);
        } else {
            ctx.font = "20px 'Press Start 2P'";
            ctx.fillText("✦", p.x, p.y);
        }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

/**
 * Customization Logic
 */
const customScreen = document.getElementById('custom-screen');
const inputPlayer = document.getElementById('input-player');
const inputAi = document.getElementById('input-ai');

function openCustomization() {
    playSfx('sfx_menu_open', 'success', 0.28);
    inputPlayer.value = playerReplies.join('\n');
    inputAi.value = aiPhrases.join('\n');
    customScreen.classList.remove('hidden');
}

function closeCustomization() {
    playSfx('sfx_menu_close', 'reply', 0.24);
    customScreen.classList.add('hidden');
}

function saveCustomization() {
    playSfx('sfx_ui', 'success', 0.28);
    const pLines = inputPlayer.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const aLines = inputAi.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    if (pLines.length > 0) playerReplies = pLines;
    else playerReplies = [...DEFAULTS.PLAYER];

    if (aLines.length > 0) aiPhrases = aLines;
    else aiPhrases = [...DEFAULTS.AI];

    closeCustomization();
}

function resetCustomization() {
    playSfx('sfx_ui', 'reply', 0.22);
    inputPlayer.value = DEFAULTS.PLAYER.join('\n');
    inputAi.value = DEFAULTS.AI.join('\n');
}

// Event Bindings
document.addEventListener('DOMContentLoaded', () => {
    resize();
    requestAnimationFrame(loop);

    document.getElementById('start-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        playSfx('sfx_ui', 'reply', 0.25);
        resetGame();
    });
    document.getElementById('edit-chat-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        openCustomization();
    });

    document.getElementById('close-custom-btn').addEventListener('click', closeCustomization);
    document.getElementById('save-custom-btn').addEventListener('click', saveCustomization);
    document.getElementById('reset-defaults-btn').addEventListener('click', resetCustomization);

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        playSfx('sfx_ui', 'reply', 0.25);
        resetGame();
    });
    document.getElementById('menu-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        playSfx('sfx_menu_close', 'reply', 0.24);
        setBgmPaused(true);
        gameState = 'MENU';
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    });

    canvas.addEventListener('pointerdown', (e) => {
        handleGameTap(e);
        initAudio();
    playSfx('sfx_start', 'success', 0.38);
    setBgmPaused(false);
    }, { passive: false });

    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
});
</script>
