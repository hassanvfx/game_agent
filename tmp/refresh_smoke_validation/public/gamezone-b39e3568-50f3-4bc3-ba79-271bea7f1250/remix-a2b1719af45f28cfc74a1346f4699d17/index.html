<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Courier Run</title>
    <!-- [agent-note][stage4] repaired: font-remap | action: kept sci-fi HUD/title styling on approved catalog fonts only -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03040b;
            --bg-2: #0a1020;
            --panel-bg: rgba(10, 18, 34, 0.82);
            --panel-edge: rgba(110, 229, 255, 0.35);
            --accent: #73f0ff;
            --accent-2: #ad7bff;
            --accent-3: #5cff95;
            --text-main: #f5fbff;
            --text-muted: #93a4c4;
            --text-soft: #b5c8ff;
            --danger: #ff5f88;
            --yellow: #ffd86b;
            --glow: rgba(115, 240, 255, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(173, 123, 255, 0.18), transparent 32%),
                radial-gradient(circle at 50% 20%, rgba(115, 240, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-2), var(--bg));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #game-container::before {
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(115, 240, 255, 0.06) 0 1px,
                    transparent 1px 64px
                ),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%);
            opacity: 0.45;
        }

        #game-container::after {
            background: radial-gradient(circle at center, transparent 54%, rgba(2, 4, 12, 0.58) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .screen {
            pointer-events: auto;
            width: min(420px, calc(100vw - 32px));
            padding: 1.55rem 1.35rem;
            border-radius: 1.4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(20, 30, 55, 0.9), rgba(7, 10, 20, 0.84)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 28px rgba(8, 15, 30, 0.6),
                0 0 28px var(--glow);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(115, 240, 255, 0.14), transparent 45%, rgba(173, 123, 255, 0.12));
            pointer-events: none;
        }

        .title-font {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            text-shadow:
                0 0 12px rgba(115, 240, 255, 0.55),
                0 0 24px rgba(173, 123, 255, 0.28);
            letter-spacing: 0.12em;
        }

        .hud-text {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
        }

        .screen-title {
            margin: 0 0 0.55rem;
            font-size: clamp(2rem, 8vw, 3.15rem);
            line-height: 0.95;
        }

        .screen-subtitle {
            margin: 0 0 1.15rem;
            color: var(--text-soft);
            font-size: 1rem;
            font-weight: 600;
        }

        .instruction-list {
            margin: 0 0 1.2rem;
            color: #d9e6ff;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .instruction-list p {
            margin: 0.2rem 0;
        }

        .primary-btn,
        .secondary-btn {
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
            position: relative;
            z-index: 1;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            color: #041019;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.9rem 1.6rem;
            box-shadow: 0 0 18px rgba(92, 255, 149, 0.28);
            border-color: rgba(115, 240, 255, 0.65);
        }

        .primary-btn:hover,
        .primary-btn:focus-visible,
        .secondary-btn:hover,
        .secondary-btn:focus-visible {
            transform: translateY(-1px) scale(1.03);
            filter: brightness(1.08);
            box-shadow: 0 0 22px rgba(115, 240, 255, 0.28);
        }

        .secondary-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(187, 217, 255, 0.95));
            color: #0b1327;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.9rem 1.45rem;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        .hidden {
            display: none !important;
        }

        #hud {
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            padding: max(0.75rem, env(safe-area-inset-top)) 0.85rem 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .score-text {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            line-height: 1.5;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.04em;
        }

        .pilot-card,
        .ability-card {
            margin-top: 0.35rem;
            padding: 0.2rem 0.6rem;
            border-radius: 0.7rem;
            background: linear-gradient(180deg, rgba(10, 18, 34, 0.9), rgba(7, 10, 20, 0.76));
            border: 1px solid rgba(115, 240, 255, 0.26);
            box-shadow: 0 0 14px rgba(3, 9, 22, 0.42);
        }

        .pilot-card {
            color: var(--accent-2);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .pilot-card span {
            color: var(--text-main);
        }

        .hud-right {
            text-align: right;
        }

        .ability-label {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 0.35rem;
            background: rgba(7, 10, 20, 0.8);
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-bottom: 0.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ability-card {
            color: var(--yellow);
            font-size: 0.88rem;
            font-weight: 700;
            border-color: rgba(255, 216, 107, 0.34);
            max-width: 220px;
        }

        .character-badge {
            position: relative;
            z-index: 1;
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            border-radius: 28px;
            background:
                radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.95) 0 10px, transparent 11px),
                radial-gradient(circle at 34% 36%, #041019 0 4px, transparent 5px),
                radial-gradient(circle at 66% 36%, #041019 0 4px, transparent 5px),
                radial-gradient(circle at 50% 72%, rgba(92, 255, 149, 0.95) 0 8px, transparent 9px),
                linear-gradient(180deg, #9ef7ff 0%, #6fdcff 28%, #ad7bff 100%);
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.08) inset,
                0 0 0 2px rgba(115, 240, 255, 0.35),
                0 0 32px rgba(115, 240, 255, 0.24);
            animation: floatCourier 2.8s ease-in-out infinite;
        }

        .character-badge::before,
        .character-badge::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .character-badge::before {
            width: 92px;
            height: 34px;
            left: 14px;
            bottom: 18px;
            background: linear-gradient(90deg, rgba(173, 123, 255, 0.95), rgba(115, 240, 255, 0.95));
            box-shadow: 0 0 24px rgba(173, 123, 255, 0.4);
        }

        .character-badge::after {
            width: 56px;
            height: 12px;
            left: 32px;
            bottom: 8px;
            background: rgba(92, 255, 149, 0.9);
            filter: blur(4px);
        }

        .flavor-chip {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.85rem;
            padding: 0.28rem 0.72rem;
            border-radius: 999px;
            background: rgba(7, 10, 20, 0.72);
            border: 1px solid rgba(115, 240, 255, 0.22);
            color: var(--text-soft);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .feedback-gif {
            position: absolute;
            width: min(32vw, 130px);
            max-width: 130px;
            border-radius: 0.9rem;
            border: 1px solid rgba(115, 240, 255, 0.5);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.4), 0 0 18px rgba(115, 240, 255, 0.2);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 2;
            background: rgba(6, 12, 24, 0.65);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #pickup-gif {
            right: 10px;
            bottom: 18%;
        }

        #gameover-gif {
            left: 10px;
            top: 18%;
        }

        @keyframes floatCourier {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .result-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 7vw, 3.4rem);
            line-height: 1;
        }

        .result-score {
            margin: 0 0 0.4rem;
            font-size: 1.5rem;
        }

        .result-score span {
            color: var(--accent);
            font-weight: 700;
        }

        .result-detail {
            margin: 0 0 1.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .result-detail span {
            color: var(--text-soft);
        }

        @media (max-width: 640px) {
            .screen {
                padding: 1.35rem 1rem;
                border-radius: 1rem;
            }

            .screen-title {
                font-size: clamp(1.7rem, 9vw, 2.35rem);
            }

            .screen-subtitle {
                font-size: 0.92rem;
            }

            .character-badge {
                width: 96px;
                height: 96px;
                margin-bottom: 0.85rem;
            }

            #hud {
                padding: max(0.65rem, env(safe-area-inset-top)) 0.65rem 0.65rem;
            }

            .pilot-card,
            .ability-card {
                padding: 0.18rem 0.48rem;
            }

            .ability-card {
                max-width: 38vw;
                font-size: 0.8rem;
            }

            .pilot-card {
                font-size: 0.78rem;
            }

            .ability-label {
                font-size: 0.64rem;
            }

            .feedback-gif {
                width: min(28vw, 100px);
            }

            #pickup-gif {
                right: 8px;
                bottom: 24%;
            }

            #gameover-gif {
                left: 8px;
                top: 24%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls and sight lines -->
        <img id="pickup-gif" class="feedback-gif hidden" src="https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp" alt="Victory celebration feedback">
        <img id="gameover-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Loss reaction feedback">

        <!-- UI Layer -->
        <div id="ui-layer">

            <!-- Start Screen -->
            <div id="start-screen" class="screen glass-panel">
                <div class="flavor-chip">⚡ courier uplink active</div>
                <div class="character-badge" aria-hidden="true"></div>
                <h1 class="screen-title title-font">NEON COURIER RUN</h1>
                <p class="screen-subtitle">Thread the traffic lanes and keep the package stream alive.</p>
                <div class="instruction-list">
                    <p>🖱️ Slide to steer your courier pod</p>
                    <p>💎 Collect data cores for bonus points</p>
                    <p>⚠️ Dodge rifts and debris to stay online</p>
                </div>
                <button id="start-btn" class="primary-btn">Launch Delivery</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen glass-panel hidden">
                <h2 class="result-title title-font" style="color: var(--danger);">DELIVERY LOST</h2>
                <div class="result-score">Score: <span id="finalScore">0</span></div>
                <div class="result-detail">Courier on duty: <span id="lastPilot">Unknown</span></div>
                <button id="restart-btn" class="secondary-btn">Retry Route</button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="hud-stack">
                    <div class="score-text hud-text">Score: <span id="score">0</span></div>
                    <div class="pilot-card hud-text">
                        Courier: <span id="pilot-name">...</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="ability-label">Rig</div>
                    <div id="pilot-ability" class="ability-card hud-text">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                scoreTick: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayed = {};
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(url);
                    sample.preload = 'auto';
                    sample.volume = key === 'fail' ? 0.7 : 0.55;
                    this.sfx[key] = sample;
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 120) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
                this.lastPlayed[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        class GifController {
            constructor() {
                this.activeTimers = new Map();
                this.pickupEl = document.getElementById('pickup-gif');
                this.failEl = document.getElementById('gameover-gif');
                this.pickupEl.src = ASSETS.gifs.pickup;
                this.failEl.src = ASSETS.gifs.fail;
            }

            hide(el) {
                el.classList.remove('visible');
                el.classList.add('hidden');
            }

            show(type, duration = 1200) {
                const el = type === 'fail' ? this.failEl : this.pickupEl;
                if (!el) return;
                clearTimeout(this.activeTimers.get(type));
                el.classList.remove('hidden');
                requestAnimationFrame(() => el.classList.add('visible'));
                const timer = setTimeout(() => this.hide(el), duration);
                this.activeTimers.set(type, timer);
            }

            reset() {
                clearTimeout(this.activeTimers.get('pickup'));
                clearTimeout(this.activeTimers.get('fail'));
                if (this.pickupEl) this.hide(this.pickupEl);
                if (this.failEl) this.hide(this.failEl);
            }
        }

        const audio = new AudioController();
        const gifs = new GifController();

        /** 3. DATA */
        const couriers = [
            {id: 0, name: "Rook-137", ability: "Phase Gate", power: 400},
            {id: 1, name: "Mox", ability: "Panic Burst", power: 300},
            {id: 2, name: "Suri", ability: "Laser Rain", power: 350},
            {id: 3, name: "Bex", ability: "Patch Serum", power: 250},
            {id: 4, name: "Jaro", ability: "Signal Veil", power: 150},
            {id: 5, name: "Null M", ability: "Grid Hack", power: 450},
            {id: 6, name: "Skylark", ability: "Low Sweep", power: 380},
            {id: 7, name: "Squint", ability: "Overdrive Mode", power: 500},
            {id: 8, name: "Pick-7", ability: "Gel Cannon", power: 420},
            {id: 9, name: "Tasker", ability: "Multi-Clone", power: 200},
            {id: 10, name: "Night T", ability: "Night Leap", power: 400},
            {id: 11, name: "Unison", ability: "Hive Sync", power: 280},
            {id: 12, name: "Jag", ability: "Burst Charges", power: 600},
            {id: 13, name: "K-Mike", ability: "Precision Shot", power: 700},
            {id: 14, name: "Nob", ability: "Lane Sweep", power: 100},
            {id: 15, name: "Supernova", ability: "Void Well", power: 450},
            {id: 16, name: "Rail", ability: "Ghost Train", power: 550},
            {id: 17, name: "Million Ants", ability: "Swarm Rush", power: 300},
            {id: 18, name: "Crocubot", ability: "Guided Missile", power: 400},
            {id: 19, name: "Arthricia", ability: "Purge Frenzy", power: 500},
            {id: 20, name: "Zeep", ability: "Micro Drain", power: 320},
            {id: 21, name: "President", ability: "Air Strike", power: 600}
        ];

        /** 4. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let speedMultiplier = 1;
        let lastWarningFrame = -999;

        // Entities
        let player = { x: 0, y: 0, radius: 20, speed: 0 };
        let enemies = [];
        let pickups = [];
        let stars = [];
        let currentPilot = null;

        // Input
        let inputX = 0;
        let inputY = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive) {
                player.x = width / 2;
                player.y = height - 100;
                inputX = width / 2;
                inputY = height - 100;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function updateInput(e) {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            inputX = clientX;
            inputY = clientY;
        }
        window.addEventListener('mousemove', updateInput);
        window.addEventListener('touchmove', updateInput, { passive: false });

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            frameCount = 0;
            speedMultiplier = 1;
            lastWarningFrame = -999;
            enemies = [];
            pickups = [];
            stars = [];
            gifs.reset();

            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 3 + 1
                });
            }

            currentPilot = couriers[Math.floor(Math.random() * couriers.length)];
            document.getElementById('pilot-name').innerText = currentPilot.name;
            document.getElementById('pilot-ability').innerText = currentPilot.ability;

            player.x = width / 2;
            player.y = height - 100;
            inputX = width / 2;
            inputY = height - 100;

            document.getElementById('score').innerText = "0";
        }

        function spawnEnemy() {
            const size = Math.random() * 30 + 20;
            const type = Math.random() > 0.5 ? 'rock' : 'portal';
            enemies.push({
                x: Math.random() * (width - size * 2) + size,
                y: -50,
                radius: size,
                speed: (Math.random() * 3 + 4) * speedMultiplier,
                type: type,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnPickup() {
            pickups.push({
                x: Math.random() * (width - 40) + 20,
                y: -50,
                radius: 12,
                speed: 4 * speedMultiplier
            });
        }

        function drawUFO(x, y, r) {
            ctx.save();
            ctx.translate(x, y);

            const coreGlow = ctx.createRadialGradient(0, -4, 2, 0, 4, r * 1.3);
            coreGlow.addColorStop(0, 'rgba(115, 240, 255, 0.95)');
            coreGlow.addColorStop(0.5, 'rgba(173, 123, 255, 0.35)');
            coreGlow.addColorStop(1, 'rgba(173, 123, 255, 0)');
            ctx.fillStyle = coreGlow;
            ctx.beginPath();
            ctx.arc(0, 4, r * 1.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 22;
            ctx.shadowColor = '#73f0ff';

            const canopy = ctx.createLinearGradient(0, -r, 0, 0);
            canopy.addColorStop(0, '#f7feff');
            canopy.addColorStop(1, '#7fe4ff');
            ctx.fillStyle = canopy;
            ctx.beginPath();
            ctx.arc(0, -7, r * 0.7, Math.PI, 0);
            ctx.fill();

            ctx.fillStyle = '#05111a';
            ctx.beginPath();
            ctx.arc(-r * 0.22, -9, r * 0.11, 0, Math.PI * 2);
            ctx.arc(r * 0.22, -9, r * 0.11, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#5cff95';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -2, r * 0.26, 0.18 * Math.PI, 0.82 * Math.PI);
            ctx.stroke();

            const hull = ctx.createLinearGradient(-r, 0, r, 0);
            hull.addColorStop(0, '#7f70ff');
            hull.addColorStop(0.5, '#73f0ff');
            hull.addColorStop(1, '#5cff95');
            ctx.fillStyle = hull;
            ctx.beginPath();
            ctx.ellipse(0, 4, r * 1.08, r * 0.46, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fillRect(-r * 0.68, 2, r * 1.36, 2);

            ctx.fillStyle = '#f9ffb5';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc((i - 1) * r * 0.48, 5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(92, 255, 149, 0.55)';
            ctx.beginPath();
            ctx.moveTo(-r * 0.45, r * 0.45);
            ctx.lineTo(0, r * 1.28);
            ctx.lineTo(r * 0.45, r * 0.45);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawPortal(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.rotation);

            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, e.radius);
            gradient.addColorStop(0, '#04060f');
            gradient.addColorStop(0.45, '#5d2d91');
            gradient.addColorStop(0.72, '#ad7bff');
            gradient.addColorStop(1, '#73f0ff');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.ellipse(e.radius * 0.6, 0, e.radius * 0.42, e.radius * 0.11, 0, 0, Math.PI * 2);
            }
            ctx.fill();

            ctx.strokeStyle = 'rgba(245, 251, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, e.radius * 0.55, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#f5fbff';
            ctx.beginPath();
            ctx.arc(0, 0, e.radius * 0.22, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawRock(e) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.rotation);
            ctx.fillStyle = '#49384f';
            ctx.strokeStyle = '#ff5f88';
            ctx.lineWidth = 2;

            ctx.beginPath();
            const sides = 6;
            for (let i = 0; i < sides; i++) {
                const angle = (i / sides) * Math.PI * 2;
                const stableR = e.radius;
                ctx.lineTo(Math.cos(angle) * stableR, Math.sin(angle) * stableR);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.beginPath();
            ctx.moveTo(-e.radius * 0.3, -e.radius * 0.2);
            ctx.lineTo(e.radius * 0.2, e.radius * 0.28);
            ctx.moveTo(e.radius * 0.08, -e.radius * 0.4);
            ctx.lineTo(e.radius * 0.38, -e.radius * 0.08);
            ctx.stroke();
            ctx.restore();
        }

        function drawPickup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = '#ffd86b';
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffd86b';

            ctx.beginPath();
            ctx.moveTo(0, -p.radius);
            ctx.lineTo(p.radius * 0.42, -p.radius * 0.2);
            ctx.lineTo(p.radius, 0);
            ctx.lineTo(p.radius * 0.42, p.radius * 0.2);
            ctx.lineTo(0, p.radius);
            ctx.lineTo(-p.radius * 0.42, p.radius * 0.2);
            ctx.lineTo(-p.radius, 0);
            ctx.lineTo(-p.radius * 0.42, -p.radius * 0.2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff8da';
            ctx.beginPath();
            ctx.arc(0, 0, p.radius * 0.35, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function maybePlayWarning() {
            const nearestThreat = enemies.some((enemy) => (
                enemy.y > player.y - 180 &&
                enemy.y < player.y + 20 &&
                Math.abs(enemy.x - player.x) < enemy.radius + player.radius + 30
            ));

            if (nearestThreat && frameCount - lastWarningFrame > 90) {
                lastWarningFrame = frameCount;
                audio.playSFX('warning', 350);
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#081222');
            sky.addColorStop(0.45, '#070b17');
            sky.addColorStop(1, '#02040a');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(115, 240, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 5; i++) {
                const laneY = (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(0, laneY);
                ctx.lineTo(width, laneY);
                ctx.stroke();
            }

            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed * speedMultiplier;
                if (star.y > height) {
                    star.y = 0;
                    star.x = Math.random() * width;
                }
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            player.x += (inputX - player.x) * 0.15;
            player.y += (inputY - player.y) * 0.15;

            if (player.x < player.radius) player.x = player.radius;
            if (player.x > width - player.radius) player.x = width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > height - player.radius) player.y = height - player.radius;

            drawUFO(player.x, player.y, player.radius);

            if (frameCount % Math.max(20, 60 - Math.floor(score / 100)) === 0) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;
                e.rotation += e.rotSpeed;

                if (e.type === 'portal') drawPortal(e);
                else drawRock(e);

                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < (player.radius + e.radius) * 0.8) {
                    gameOver();
                    return;
                }

                if (e.y > height + 50) {
                    enemies.splice(i, 1);
                    score += 10;
                    audio.playSFX('scoreTick', 140);
                    document.getElementById('score').innerText = score;
                }
            }

            if (frameCount % 150 === 0) {
                spawnPickup();
            }

            for (let i = pickups.length - 1; i >= 0; i--) {
                let p = pickups[i];
                p.y += p.speed;
                drawPickup(p);

                const dx = player.x - p.x;
                const dy = player.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + p.radius) {
                    pickups.splice(i, 1);
                    score += 100;
                    audio.playSFX('pickup', 90);
                    gifs.show('pickup', 1100);
                    document.getElementById('score').innerText = score;

                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(0, 0, width, height);
                } else if (p.y > height + 50) {
                    pickups.splice(i, 1);
                }
            }

            maybePlayWarning();

            speedMultiplier = 1 + (score / 5000);
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0);
            gifs.show('fail', 1800);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('lastPilot').innerText = currentPilot ? currentPilot.name : "Unknown";
        }

        /** 6. CONTROLS */
        function startRun() {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            gifs.reset();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            startRun();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            startRun();
        });
    });
    </script>
</body>
