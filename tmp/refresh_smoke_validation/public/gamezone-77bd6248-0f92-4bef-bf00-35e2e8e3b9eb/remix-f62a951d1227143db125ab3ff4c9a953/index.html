<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Sum Stacks</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #08111f;
        --bg-bottom: #190f38;
        --panel: rgba(11, 19, 37, 0.72);
        --panel-strong: rgba(18, 29, 56, 0.88);
        --panel-stroke: rgba(127, 232, 255, 0.3);
        --text-main: #effbff;
        --text-soft: #9db7d8;
        --accent-cyan: #7ef0ff;
        --accent-violet: #8f7cff;
        --accent-pink: #ff6fbf;
        --accent-gold: #ffd76a;
        --shadow-deep: rgba(1, 6, 18, 0.45);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(126, 240, 255, 0.12), transparent 28%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 15% 18%, rgba(126, 240, 255, 0.15), transparent 18%),
            radial-gradient(circle at 84% 22%, rgba(255, 111, 191, 0.12), transparent 20%),
            radial-gradient(circle at 50% 88%, rgba(143, 124, 255, 0.12), transparent 28%);
    }

    body::after {
        opacity: 0.18;
        background-image:
            linear-gradient(rgba(126, 240, 255, 0.18) 1px, transparent 1px),
            linear-gradient(90deg, rgba(126, 240, 255, 0.12) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.75), transparent 90%);
    }

    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .hidden { display: none !important; }
    #ui-layer { pointer-events: none; position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; }
    .interactive { pointer-events: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass {
        position: relative;
        background: linear-gradient(180deg, rgba(17, 30, 56, 0.88), rgba(8, 16, 32, 0.76));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--panel-stroke);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.16),
            0 12px 36px var(--shadow-deep);
    }

    .glass::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid rgba(255,255,255,0.08);
        pointer-events: none;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
        background: transparent;
    }

    #hud {
        width: 100%;
        padding: max(14px, env(safe-area-inset-top)) 14px 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        box-sizing: border-box;
    }

    .hud-card {
        border-radius: 22px;
        padding: 10px 16px;
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 92px;
    }

    .hud-pill {
        border-radius: 999px;
        padding: 10px 14px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .hud-label,
    .goal-label {
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-soft);
    }

    .hud-value,
    .goal-value {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 0 12px rgba(126, 240, 255, 0.18);
    }

    .hud-value {
        margin-top: 4px;
        font-size: clamp(28px, 6vw, 34px);
        color: var(--accent-cyan);
    }

    .goal-value {
        font-size: clamp(24px, 5vw, 30px);
        color: #ffffff;
    }

    .goal-ring {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(143, 124, 255, 0.18));
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--accent-gold);
        font-size: 16px;
        box-shadow: 0 0 18px rgba(255, 215, 106, 0.18);
    }

    #inventory-dock {
        width: 100%;
        padding: 6px 10px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        align-items: flex-end;
        box-sizing: border-box;
        pointer-events: auto;
    }

    .dock-shell {
        width: min(100%, 420px);
        padding: 10px;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(7, 18, 35, 0.84), rgba(15, 25, 52, 0.92));
        box-shadow:
            0 18px 40px rgba(2, 8, 26, 0.48),
            inset 0 0 0 1px rgba(126, 240, 255, 0.18);
    }

    .dock-caption {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 6px 8px;
        font-size: 11px;
        color: var(--text-soft);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    .title-accent {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        letter-spacing: 0.18em;
        color: var(--accent-cyan);
        text-shadow: 0 0 16px rgba(126, 240, 255, 0.24);
    }

    #feedback-layer {
        position: absolute;
        top: max(84px, env(safe-area-inset-top) + 68px);
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
        z-index: 55;
        pointer-events: none;
    }

    .feedback-burst {
        width: min(26vw, 100px);
        max-width: 100px;
        border-radius: 18px;
        border: 1px solid rgba(126, 240, 255, 0.24);
        box-shadow: 0 12px 28px rgba(2, 8, 26, 0.42);
        background: rgba(6, 12, 25, 0.66);
        object-fit: cover;
        opacity: 0;
        transform: translateY(-8px) scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .feedback-burst.active {
        opacity: 0.9;
        transform: translateY(0) scale(1);
    }

    .feedback-chip {
        padding: 8px 12px;
        border-radius: 16px;
        color: var(--text-main);
        font: 600 13px/1 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .feedback-chip.active {
        opacity: 1;
        transform: translateY(0);
    }

    #dock-scroll {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        align-items: center;
        padding: 4px 6px 2px;
        scroll-behavior: smooth;
        touch-action: pan-x;
    }

    .dock-item {
        position: relative;
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        border: 2px solid rgba(157, 183, 216, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, filter 0.18s ease;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        box-sizing: border-box;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 18px rgba(0,0,0,0.16);
        overflow: hidden;
    }

    .dock-item::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent 48%);
        pointer-events: none;
    }

    .dock-item:active {
        transform: scale(0.92);
        filter: brightness(1.08);
    }

    .dock-item img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        pointer-events: none;
        position: relative;
        z-index: 1;
    }

    .dock-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 24px;
        padding: 2px 6px;
        border-radius: 999px;
        color: #fff;
        font: 700 12px/1 'Audiowide', 'Rajdhani', sans-serif;
        box-shadow: 0 4px 10px rgba(0,0,0,0.18);
        z-index: 2;
    }

    .dock-divider {
        width: 1px;
        height: 40px;
        margin: 0 4px;
        flex-shrink: 0;
        background: linear-gradient(180deg, transparent, rgba(126, 240, 255, 0.55), transparent);
    }

    @media (max-width: 480px) {
        .hud-card { min-width: 82px; padding: 10px 14px; }
        .hud-pill { padding: 9px 12px; }
        .dock-shell { border-radius: 24px; }
        .dock-caption { font-size: 10px; }
        #feedback-layer {
            top: max(76px, env(safe-area-inset-top) + 60px);
            right: 8px;
        }
        .feedback-burst {
            width: min(24vw, 82px);
        }
    }
</style>
</head>
<body>

<!-- Assets -->
<img id="asset_cat_zero" data-editable="image" data-label="Drone Seed (0)" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/slime.png" hidden>
<img id="asset_cat_face" data-editable="image" data-label="Core Drone (1)" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png" hidden>
<img id="asset_cat_body" data-editable="image" data-label="Linked Drone (2)" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/magnet.png" hidden>

<img id="asset_pinki" data-editable="image" data-label="Static Pulse (-1)" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png" hidden>

<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_land" data-editable="audio" data-label="Dock Spawn SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "gravity": { "type": "number", "label": "Gravity Force", "value": 1800, "min": 500, "max": 3000 },

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- [agent-note][stage3] resolved-font: title/ui -> Audiowide + Rajdhani from catalogs/fonts.json -->
        <!-- [agent-note][stage3] resolved-audio: loop/merge/fail/throw/bounce/goal -> catalogs/audios.json -->
        <!-- [agent-note][stage3] resolved-gif: merge/goal feedback -> catalogs/gifs.json -->
        <div id="feedback-layer" aria-live="polite">
            <img
                id="merge-gif"

            >
            <img
                id="goal-gif"
                class="feedback-burst"
                alt="Goal clear celebration"

            >

        <!-- Inventory Dock -->

                    <span class="title-accent">Drone Bay</span>
                    <span>drag upward to launch</span>
                </div>
                <div id="dock-scroll" class="no-scrollbar">

                </div>
            </div>
        </div>

<script>
/**
 * §0 System Invariants & Core
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let cw = 0, ch = 0;
const dpr = window.devicePixelRatio || 1;

// State
let gameState = 'INIT';
let initialized = false;
let score = 0;
let lastTime = 0;

// Config
let config = { gravity: 1800, throwPower: 25, targetNumber: 30 };

// Entities
let blocks = [];
let particles = [];
let floaters = [];
let draggingBlock = null;
let pointerHistory = []; 
let floorHeight = 160; 
let shakeTime = 0;

// Input State for Dock
let pendingDockItem = null; // { type, startX, startY }

// Audio
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const audioBuffers = {};
const sfxCooldowns = {};
const bgm = document.getElementById('bgm_main');
const mergeGif = document.getElementById('merge-gif');
const goalGif = document.getElementById('goal-gif');
const feedbackChip = document.getElementById('feedback-chip');
let feedbackTimer = 0;
let currentFeedbackVisual = null;

async function initAudio() {
    if (!audioCtx) return;
    const loadBuffer = async (id, url) => {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn('Audio load failed', id); }
    };
    await Promise.all([
        loadBuffer('land', document.getElementById('sfx_land').src),
        loadBuffer('merge', document.getElementById('sfx_merge').src),
        loadBuffer('subtract', document.getElementById('sfx_subtract').src),
        loadBuffer('throw', document.getElementById('sfx_throw').src),
        loadBuffer('goal', document.getElementById('sfx_goal').src),
        loadBuffer('bounce', document.getElementById('sfx_bounce').src)
    ]);
}

function pulseFeedback(message, visual = null, hold = 800) {
    if (feedbackChip) {
        feedbackChip.textContent = message;
        feedbackChip.classList.add('active');
    }

    if (currentFeedbackVisual && currentFeedbackVisual !== visual) {
        currentFeedbackVisual.classList.remove('active');
    }

    currentFeedbackVisual = visual;
    if (visual) {
        visual.classList.add('active');
    }

    clearTimeout(feedbackTimer);
    feedbackTimer = window.setTimeout(() => {
        if (feedbackChip) feedbackChip.classList.remove('active');
        if (currentFeedbackVisual) currentFeedbackVisual.classList.remove('active');
        currentFeedbackVisual = null;
    }, hold);
}

function playSfx(id, pitch = 1.0, volume = 0.22) {
    if (!audioCtx) return;
    const now = performance.now();
    const cooldown = id === 'bounce' ? 90 : 0;
    if (cooldown && now - (sfxCooldowns[id] || 0) < cooldown) return;
    sfxCooldowns[id] = now;

    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    const buffer = audioBuffers[id];
    if (buffer) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buffer;
        src.playbackRate.value = pitch;
        gain.gain.value = volume;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = id === 'subtract' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(id === 'subtract' ? 800 : 400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(Math.min(volume, 0.08), audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 60 : (style === 'medium' ? 40 : 15));
    }
}

/**
 * §1 Game Logic
 */
function initGame() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').text);
        config.gravity = raw.gravity.value;
        config.throwPower = raw.throwPower.value;
        config.targetNumber = raw.targetNumber.value;
        document.getElementById('target-display').innerText = config.targetNumber;
    } catch(e) {}

    generateDockItems();
    resetLevel();
    gameState = 'PLAYING';
    bgm.volume = 0.2;
    bgm.play().catch(()=>{});
    pulseFeedback('Arcade loop armed');
    requestAnimationFrame(loop);
}

function generateDockItems() {
    const dockContainer = document.getElementById('dock-scroll');
    dockContainer.innerHTML = ''; // Clear

    // Helper to create item
    const createItem = (val, isPinki = false) => {
        const div = document.createElement('div');
        div.className = 'dock-item';
        
        let bgColor = '#dbe4f2';
        let borderColor = '#7fdcff';
        let badgeColor = '#64748b';
        let imgSrc = '';
        let label = val;

        if (isPinki) {
            bgColor = 'rgba(255, 111, 191, 0.18)';
            borderColor = '#ff6fbf';
            badgeColor = '#ff4fae';
            imgSrc = document.getElementById('asset_pinki').src;
            div.dataset.type = 'PINKI';
            label = '-1';
        } else {
            div.dataset.type = val;
            if (val === 0) {
                imgSrc = document.getElementById('asset_cat_zero').src;
            } else if (val === 1) {
                bgColor = 'rgba(126, 240, 255, 0.18)';
                borderColor = '#7ef0ff';
                badgeColor = '#2ec5ff';
                imgSrc = document.getElementById('asset_cat_face').src;
            } else if (val === 2) {
                bgColor = 'rgba(143, 124, 255, 0.2)';
                borderColor = '#8f7cff';
                badgeColor = '#7d67ff';
                imgSrc = document.getElementById('asset_cat_body').src;
            } else {
                // 3-30
                const hue = 220 + (Math.min((val-1)/29, 1) * 140);
                bgColor = `hsla(${hue}, 90%, 62%, 0.18)`;
                borderColor = `hsl(${hue}, 92%, 72%)`;
                badgeColor = `hsl(${hue}, 90%, 60%)`;
                imgSrc = document.getElementById('asset_cat_tall').src;
            }
        }
        
        div.style.background = `linear-gradient(180deg, rgba(255,255,255,0.16), transparent 42%), ${bgColor}`;
        div.style.borderColor = borderColor;

        div.innerHTML = `
            <img src="${imgSrc}" alt="">
            <div class="dock-badge" style="background-color: ${badgeColor}">
                ${label}
            </div>
        `;

        dockContainer.appendChild(div);
    };

    // 0, 1, 2
    createItem(0);
    createItem(1);
    createItem(2);

    // 3 to 30
    for (let i = 3; i <= 30; i++) {
        createItem(i);
    }

    // Divider
    const sep = document.createElement('div');
    sep.className = "dock-divider";
    dockContainer.appendChild(sep);

    // Pinki
    createItem(-1, true);
}

function resetLevel() {
    blocks = [];
    particles = [];
    floaters = [];
    score = 0;
    draggingBlock = null;
    shakeTime = 0;
    updateUI();
}

function getBlockDims(val) {
    const u = Math.floor(cw / 10);
    if (val === -1) return { w: 2*u, h: 2*u };
    if (val === 0) return { w: u, h: u };
    if (val === 4) return { w: 2*u, h: 2*u };
    if (val === 9) return { w: 3*u, h: 3*u };
    if (val === 16) return { w: 4*u, h: 4*u };
    if (val === 6) return { w: 2*u, h: 3*u };
    if (val === 8) return { w: 2*u, h: 4*u };
    if (val === 10) return { w: 2*u, h: 5*u };
    // Cap height for large numbers to prevent screen filling
    return { w: u, h: u * Math.min(val, 6) }; 
}

function getColor(val) {
    if (val === -1) return '#ff6fbf';
    if (val === 0) return '#93a8ca';
    const pct = Math.min((val - 1) / (config.targetNumber - 1), 1);
    const hue = 188 + (pct * 108);
    return `hsl(${hue}, 92%, ${68 - pct * 10}%)`;
}

function spawnBlock(val, x, y, isDragging = false) {
    const dims = getBlockDims(val);
    const b = {
        x: x, y: y,
        w: dims.w, h: dims.h,
        value: val,
        vx: 0, vy: 0,
        scale: 0,
        dragging: isDragging,
        merged: false
    };
    let t = 0;
    const animate = () => {
        t += 0.1;
        b.scale = Math.min(1, t * 2);
        if (t < 0.5) requestAnimationFrame(animate);
    };
    animate();
    return b;
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    if (shakeTime > 0) shakeTime -= dt;

    const steps = 8;
    const subDt = dt / steps;

    for(let s=0; s<steps; s++) {
        updatePhysics(subDt);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 800 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = floaters.length - 1; i >= 0; i--) {
        let f = floaters[i];
        f.life -= dt;
        f.y -= 40 * dt;
        if (f.life <= 0) floaters.splice(i, 1);
    }
}

function updatePhysics(dt) {
    const floorY = ch - floorHeight;

    blocks.forEach(b => {
        if (b.dragging) return;

        b.vy += config.gravity * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.vx *= 0.99;
        b.vy *= 0.99;

        if (b.y + b.h/2 > floorY) {
            b.y = floorY - b.h/2;
            b.vy *= -0.3;
            b.vx *= 0.6;
            if (Math.abs(b.vy) < 20) b.vy = 0;
        }

        if (b.x - b.w/2 < 0) {
            b.x = b.w/2;
            b.vx *= -0.5;
        } else if (b.x + b.w/2 > cw) {
            b.x = cw - b.w/2;
            b.vx *= -0.5;
        }
    });

    for(let i=0; i<2; i++) {
        for (let j = 0; j < blocks.length; j++) {
            for (let k = j + 1; k < blocks.length; k++) {
                resolveAABB(blocks[j], blocks[k]);
            }
        }
    }
}

function resolveAABB(b1, b2) {
    if (b1.dragging || b2.dragging) return;

    if (Math.abs(b1.x - b2.x) < (b1.w + b2.w)/2 &&
        Math.abs(b1.y - b2.y) < (b1.h + b2.h)/2) {
        
        if (b1.value === -1 || b2.value === -1) {
            if (b1.value === -1 && b2.value === -1) {
                bounce(b1, b2);
            } else {
                const pinki = b1.value === -1 ? b1 : b2;
                const cat = b1.value === -1 ? b2 : b1;
                handleSubtraction(pinki, cat);
            }
            return;
        }

        const sum = b1.value + b2.value;
        if (!b1.merged && !b2.merged && sum <= config.targetNumber) {
            mergeBlocks(b1, b2, sum);
            return;
        }
        bounce(b1, b2);
    }
}

function bounce(b1, b2) {
    playSfx('bounce', 0.95 + Math.random() * 0.1, 0.12);
    const dx = b2.x - b1.x;
    const dy = b2.y - b1.y;
    const overlapX = (b1.w + b2.w)/2 - Math.abs(dx);
    const overlapY = (b1.h + b2.h)/2 - Math.abs(dy);

    if (overlapX < overlapY) {
        const sign = dx > 0 ? 1 : -1;
        const move = overlapX * 0.5;
        b1.x -= move * sign;
        b2.x += move * sign;
        b1.vx *= 0.5; b2.vx *= 0.5;
        const avgVx = (b1.vx + b2.vx)/2;
        b1.vx = avgVx - (b1.vx - avgVx)*0.5;
        b2.vx = avgVx - (b2.vx - avgVx)*0.5;
    } else {
        const sign = dy > 0 ? 1 : -1;
        const move = overlapY * 0.5;
        b1.y -= move * sign;
        b2.y += move * sign;
        b1.vy *= 0.5; b2.vy *= 0.5;
    }
}

function handleSubtraction(pinki, cat) {
    if (pinki.merged || cat.merged) return;
    pinki.merged = true; 
    
    const newVal = cat.value - 1;
    
    playSfx('subtract', 1, 0.2);
    vibrate('medium');
    pulseFeedback('Pinki scramble', mergeGif, 900);
    createParticles(pinki.x, pinki.y, '#ec4899');
    floaters.push({x: pinki.x, y: pinki.y - 30, text: "-1", life: 1.0, color: '#ec4899'});

    blocks = blocks.filter(b => b !== pinki);

    if (newVal < 0) {
        cat.merged = true;
        blocks = blocks.filter(b => b !== cat);
        createParticles(cat.x, cat.y, getColor(cat.value));
        floaters.push({x: cat.x, y: cat.y, text: "POOF!", life: 1.0, color: '#64748b'});
    } else {
        cat.value = newVal;
        const newDims = getBlockDims(newVal);
        cat.w = newDims.w;
        cat.h = newDims.h;
        cat.scale = 1.3;
        setTimeout(() => cat.scale = 1, 150);
    }
    updateUI();
}

function mergeBlocks(b1, b2, sum) {
    b1.merged = true;
    b2.merged = true;
    blocks = blocks.filter(b => b !== b1 && b !== b2);

    const mx = (b1.x + b2.x) / 2;
    const my = (b1.y + b2.y) / 2;
    
    playSfx('merge', 0.8 + (sum * 0.02), 0.24);
    vibrate('medium');
    pulseFeedback(`Sum online: ${sum}`, mergeGif, 850);
    createParticles(mx, my, getColor(sum));
    
    floaters.push({
        x: mx, y: my - 20,
        text: `${b1.value}+${b2.value}=${sum}`,
        life: 1.0,
        color: '#333'
    });

    if (sum === config.targetNumber) {
        score += sum * 100;
        shakeTime = 0.4;
        playSfx('goal', 1, 0.28);
        vibrate('heavy');
        pulseFeedback('Goal cleared!', goalGif, 1400);
        createParticles(mx, my, '#FFD700');
        floaters.push({x: mx, y: my-50, text: "CLEARED!", life: 1.5, color: '#d97706'});
    } else {
        blocks.push(spawnBlock(sum, mx, my));
        score += sum * 10;
    }
    updateUI();
}

/**
 * §2 Input & Spawn
 */
function handleGlobalInput(e) {
    if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
    if (bgm.paused) bgm.play().catch(()=>{});

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        const dock = document.getElementById('inventory-dock').getBoundingClientRect();
        
        // 1. Dock Interaction (Drag out logic)
        if (e.clientY > dock.top) {
            const target = e.target.closest('.dock-item');
            if (target) {
                // Don't preventDefault here, let browser handle scroll start
                // We just track the potential drag
                const type = target.dataset.type;
                const val = type === 'PINKI' ? -1 : parseInt(type);
                pendingDockItem = { val, startY: e.clientY };
            }
        } 
        // 2. World Interaction
        else {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                if (Math.abs(x - b.x) < b.w/2 && Math.abs(y - b.y) < b.h/2) {
                    e.preventDefault();
                    draggingBlock = b;
                    b.dragging = true;
                    b.vx = 0; b.vy = 0;
                    pointerHistory = [];
                    playSfx('throw', 0.5, 0.18);
                    vibrate('light');
                    blocks.splice(i, 1);
                    blocks.push(b);
                    break;
                }
            }
        }
    } else if (e.type === 'pointermove') {
        // Handle Drag-Out from Dock
        if (pendingDockItem) {
            const dy = pendingDockItem.startY - e.clientY;
            // If dragged UP by more than 30px, trigger spawn
            if (dy > 30) {
                e.preventDefault(); // Stop scrolling now
                draggingBlock = spawnBlock(pendingDockItem.val, x, y, true);
                blocks.push(draggingBlock);
                pointerHistory = [];
                playSfx('land', 1.35, 0.18);
                vibrate('medium');
                pendingDockItem = null; // Consumed
            }
        }

        if (draggingBlock) {
            e.preventDefault();
            draggingBlock.x += (x - draggingBlock.x) * 0.8;
            draggingBlock.y += (y - draggingBlock.y) * 0.8;
            
            pointerHistory.push({x, y, t: performance.now()});
            if (pointerHistory.length > 8) pointerHistory.shift();
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        pendingDockItem = null; // Clear pending
        
        if (draggingBlock) {
            let vx = 0, vy = 0;
            if (pointerHistory.length >= 2) {
                const last = pointerHistory[pointerHistory.length - 1];
                const first = pointerHistory[0];
                const dt = (last.t - first.t) / 1000;
                if (dt > 0.01) {
                    vx = (last.x - first.x) / dt * config.throwPower * 0.1;
                    vy = (last.y - first.y) / dt * config.throwPower * 0.1;
                }
            }

            const maxV = 2500;
            vx = Math.max(-maxV, Math.min(maxV, vx));
            vy = Math.max(-maxV, Math.min(maxV, vy));

            draggingBlock.vx = vx;
            draggingBlock.vy = vy;
            draggingBlock.dragging = false;
            
            if (Math.hypot(vx, vy) > 300) {
                playSfx('throw', 1.0 + Math.random()*0.2, 0.2);
            }

            draggingBlock = null;
            pointerHistory = [];
        }
    }
}

/**
 * §3 Rendering
 */
function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    if (shakeTime > 0) {
        const mag = shakeTime * 15;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    }

    const grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#07111f');
    grad.addColorStop(0.56, '#101a35');
    grad.addColorStop(1, '#1b1040');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, cw + 40, ch + 40);

    for (let i = 0; i < 5; i++) {
        const starX = ((i * 173) % cw) + 20;
        const starY = 46 + (i * 63) % Math.max(120, ch - floorHeight - 40);
        ctx.fillStyle = 'rgba(126, 240, 255, 0.18)';
        ctx.beginPath();
        ctx.arc(starX, starY, 2 + (i % 2), 0, Math.PI * 2);
        ctx.fill();
    }

    const floorGrad = ctx.createLinearGradient(0, ch - floorHeight, 0, ch);
    floorGrad.addColorStop(0, '#1f3155');
    floorGrad.addColorStop(1, '#09101d');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, ch - floorHeight, cw, floorHeight);

    ctx.strokeStyle = 'rgba(126, 240, 255, 0.18)';
    ctx.lineWidth = 1;
    for (let y = ch - floorHeight; y < ch; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }
    
    blocks.forEach(drawBlock);

    if (draggingBlock && pointerHistory.length > 1) {
        ctx.beginPath();
        ctx.moveTo(pointerHistory[0].x, pointerHistory[0].y);
        for(let p of pointerHistory) ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = 'rgba(126, 240, 255, 0.24)';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    floaters.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.globalAlpha = f.life;
        ctx.font = '700 28px Audiowide';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;
        ctx.strokeStyle = 'rgba(6, 12, 25, 0.45)';
        ctx.lineWidth = 4;
        ctx.textAlign = 'center';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.globalAlpha = 1;
    });
}

function drawBlock(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    const scale = b.scale * (b.dragging ? 1.15 : 1);
    ctx.scale(scale, scale);
    
    const hw = b.w / 2;
    const hh = b.h / 2;
    const r = 12;

    if (b.dragging) {
        ctx.shadowColor = 'rgba(126, 240, 255, 0.45)';
        ctx.shadowBlur = 28;
        ctx.shadowOffsetY = 16;
    }

    ctx.beginPath();
    ctx.roundRect(-hw, -hh, b.w, b.h, r);
    const blockGrad = ctx.createLinearGradient(0, -hh, 0, hh);
    blockGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
    blockGrad.addColorStop(0.18, getColor(b.value));
    blockGrad.addColorStop(1, 'rgba(8,16,32,0.28)');
    ctx.fillStyle = blockGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.38)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(126, 240, 255, 0.14)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-hw + 5, -hh + 5, b.w - 10, b.h - 10);

    ctx.clip();

    let imgId = 'asset_cat_face';
    if (b.value === -1) imgId = 'asset_pinki';
    else if (b.value === 0) imgId = 'asset_cat_zero';
    else if (b.value >= 3) imgId = 'asset_cat_tall';
    else if (b.value === 2) imgId = 'asset_cat_body';
    
    const img = document.getElementById(imgId);
    if (img && img.complete) {
        ctx.drawImage(img, -hw, -hh, b.w, b.h);
    }

    ctx.beginPath();
    ctx.moveTo(-hw, -hh);
    ctx.lineTo(hw, -hh);
    ctx.lineTo(hw, -hh + b.h*0.15);
    ctx.lineTo(-hw, -hh + b.h*0.3);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();

    ctx.fillStyle = '#f8fdff';
    ctx.font = `700 ${Math.min(b.w, b.h)*0.42}px Audiowide`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(b.value === -1 ? '' : b.value, 0, b.h*0.35);

    ctx.restore();
}

function createParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 500,
            vy: (Math.random() - 0.5) * 500,
            life: 0.5 + Math.random() * 0.3,
            color: color,
            size: Math.random() * 10 + 4
        });
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = score;
}

// Lifecycle
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    cw = entry.contentRect.width;
    ch = entry.contentRect.height;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (blocks.length > 0) {
        blocks.forEach(b => {
            const dims = getBlockDims(b.value);
            b.w = dims.w;
            b.h = dims.h;
        });
    }

    if (!initialized) {
        initAudio();
        initGame();
        initialized = true;
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        bgm.pause();
    } else if (initialized && gameState === 'PLAYING') {
        bgm.play().catch(() => {});
    }
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').text);
    window.gameConfig = {};
    for(let k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;
});
document.addEventListener('touchmove', e => {
    // Only prevent default if not in scrollable dock or if dragging
    if (draggingBlock || !e.target.closest('#dock-scroll')) {
        e.preventDefault();
    }
}, { passive: false });
</script>
