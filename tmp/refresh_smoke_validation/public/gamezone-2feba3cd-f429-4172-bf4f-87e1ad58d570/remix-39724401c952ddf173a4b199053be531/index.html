<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- §3.2 Configuration Engine ---
    window.gameConfigDefs = {};
    window.gameConfig = {};
    
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (const key in rawConfig) {
            window.gameConfigDefs[key] = rawConfig[key];
            window.gameConfig[key] = rawConfig[key].value;
        }
    } catch (e) {
        console.error("Config Parse Error", e);
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') {
                // Trigger visual refresh if needed
            }
        }
    };

    // --- §A.2 Audio Manager ---
    class AudioManager {
        constructor() {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.buffers = {};
            this.unlocked = false;
            this.bgmEl = document.getElementById('bgm_main');
            this.lastPlayed = {};
        }

        async loadSound(id, src) {
            try {
                const res = await fetch(src, { mode: 'cors' });
                const arrayBuffer = await res.arrayBuffer();
                this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
            } catch (e) {
                this.buffers[id] = 'error';
            }
        }

        unlock() {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playLoop();
            }).catch(() => {});
        }

        playLoop() {
            if (this.bgmEl && this.unlocked) {
                this.bgmEl.volume = 0.22;
                this.bgmEl.play().catch(() => {});
            }
        }

        stopLoop() {
            if (this.bgmEl) {
                this.bgmEl.pause();
                this.bgmEl.currentTime = 0;
            }
        }

        playSfx(id, fallbackType = 'beep', debounceMs = 90, volume = 0.5) {
            const now = performance.now();
            if ((this.lastPlayed[id] || 0) + debounceMs > now) return;
            this.lastPlayed[id] = now;

            if (!this.unlocked || !this.buffers[id] || this.buffers[id] === 'error') {
                this.synthesize(fallbackType, volume);
                return;
            }
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            source.buffer = this.buffers[id];
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        }

        synthesize(type, volume = 0.25) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(18, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            } else if (type === 'soft-rise') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(840, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(volume * 0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }
    }

    const audio = new AudioManager();
    const assets = ['sfx_collect', 'sfx_die', 'sfx_draw', 'sfx_start', 'sfx_restart', 'sfx_land', 'sfx_hit'];
    assets.forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });

    // --- Game Core ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
    
    // State
    let gameState = 'START'; // START, PLAY, GAMEOVER
    let score = 0;
    let frames = 0;
    let cameraX = 0;
    
    // Entities
    let hero = { x: 100, y: 200, vy: 0, r: 20, grounded: false };
    let lines = []; // { points: [{x,y}], life: 100 }
    let particles = [];
    let items = [];
    let obstacles = [];
    
    // Input
    let isDrawing = false;
    let currentLine = null;
    let lastPointer = { x: 0, y: 0 };
    let prevGrounded = false;
    let feedbackTimer = null;

    // Resize Handling
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handlers
    function showFeedback(type) {
        const collectGif = document.getElementById('gif_collect');
        const failGif = document.getElementById('gif_fail');
        collectGif.classList.remove('show');
        failGif.classList.remove('show');
        clearTimeout(feedbackTimer);
        const target = type === 'collect' ? collectGif : failGif;
        target.classList.add('show');
        feedbackTimer = setTimeout(() => target.classList.remove('show'), 1400);
    }

    canvas.addEventListener('pointerdown', e => {
        if (gameState !== 'PLAY') return;
        e.preventDefault();
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left + cameraX;
        const y = e.clientY - rect.top;
        lastPointer = { x, y };
        currentLine = { points: [{x, y}], life: window.gameConfig.lineDuration, color: window.gameConfig.themeColor };
        lines.push(currentLine);
        
        // Juice: Spawn particles
        spawnParticles(x - cameraX, y, 5, window.gameConfig.themeColor);
        
        // Unlock audio on first interaction
        audio.unlock();
        audio.playSfx('sfx_draw', 'soft-rise', 120, 0.18);
    }, { passive: false });

    canvas.addEventListener('pointermove', e => {
        if (!isDrawing || gameState !== 'PLAY') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left + cameraX;
        const y = e.clientY - rect.top;
        
        // Distance check to avoid too many points
        const dx = x - lastPointer.x;
        const dy = y - lastPointer.y;
        if (dx*dx + dy*dy > 25) {
            currentLine.points.push({x, y});
            lastPointer = { x, y };
            // Juice: Trail
            if (Math.random() > 0.5) spawnParticles(x - cameraX, y, 1, window.gameConfig.themeColor);
        }
    }, { passive: false });

    const endDraw = (e) => {
        isDrawing = false;
        currentLine = null;
    };
    canvas.addEventListener('pointerup', endDraw);
    canvas.addEventListener('pointercancel', endDraw);

    // Game Logic
    function spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x + cameraX, y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 1.0,
                color: color
            });
        }
    }

    function spawnWorld(startX) {
        // Procedural generation
        if (startX % 400 < window.gameConfig.heroSpeed) { // Roughly every 400px
            const type = Math.random();
            const y = 100 + Math.random() * (window.innerHeight - 200);
            if (type > 0.3) {
                items.push({ x: startX + 600, y: y, collected: false, r: 15 });
            } else {
                obstacles.push({ x: startX + 600, y: y, r: 20 });
            }
        }
    }

    function resetGame() {
        hero = { x: 100, y: 200, vy: 0, r: 20, grounded: false };
        lines = [];
        particles = [];
        items = [];
        obstacles = [];
        score = 0;
        cameraX = 0;
        frames = 0;
        
        // Initial platform
        lines.push({
            points: [{x: 0, y: 300}, {x: 400, y: 300}],
            life: 9999, // Permanent start platform
            color: '#CBD5E1'
        });
        
        prevGrounded = false;
        document.getElementById('score').innerText = '0';
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('tutorial').classList.remove('hidden');
        document.getElementById('gif_collect').classList.remove('show');
        document.getElementById('gif_fail').classList.remove('show');
        setTimeout(() => document.getElementById('tutorial').classList.add('hidden'), 3000);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        audio.playSfx('sfx_die', 'explosion', 200, 0.34);
        audio.stopLoop();
        showFeedback('fail');
        document.getElementById('finalScore').innerText = score;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        // Hero Physics
        hero.vy += window.gameConfig.gravity;
        hero.y += hero.vy;
        hero.x += window.gameConfig.heroSpeed;
        cameraX = hero.x - 100; // Camera follows hero

        // Ground Collision (Simple Line Segments)
        prevGrounded = hero.grounded;
        hero.grounded = false;
        // Check lines
        for (let l of lines) {
            for (let i = 0; i < l.points.length - 1; i++) {
                const p1 = l.points[i];
                const p2 = l.points[i+1];
                
                // Bounding box check optimization
                if (hero.x + hero.r < Math.min(p1.x, p2.x) || hero.x - hero.r > Math.max(p1.x, p2.x)) continue;

                // Line collision logic
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const lenSq = dx*dx + dy*dy;
                const t = ((hero.x - p1.x) * dx + (hero.y - p1.y) * dy) / lenSq;
                
                if (t >= 0 && t <= 1) {
                    const closestX = p1.x + t * dx;
                    const closestY = p1.y + t * dy;
                    const distY = hero.y - closestY;
                    
                    // Only collide if coming from above and close enough
                    if (distY < hero.r && distY > -hero.r && hero.vy >= 0) {
                        hero.y = closestY - hero.r;
                        hero.vy = 0;
                        hero.grounded = true;
                    }
                }
            }
        }

        if (!prevGrounded && hero.grounded) {
            audio.playSfx('sfx_land', 'soft-rise', 140, 0.16);
        }

        // World Bounds (Death)
        if (hero.y > window.innerHeight + 100) {
            gameOver();
        }

        // Update Lines (Fade out)
        for (let i = lines.length - 1; i >= 0; i--) {
            if (lines[i].life < 9000) { // Don't fade start platform
                lines[i].life--;
                if (lines[i].life <= 0) lines.splice(i, 1);
            }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Update/Spawn Entities
        spawnWorld(hero.x);
        
        // Items
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            // Check collision
            const dx = hero.x - item.x;
            const dy = hero.y - item.y;
            if (dx*dx + dy*dy < (hero.r + item.r)**2) {
                score += 10;
                document.getElementById('score').innerText = score;
                audio.playSfx('sfx_collect', 'beep', 80, 0.32);
                showFeedback('collect');
                spawnParticles(item.x - cameraX, item.y, 10, '#FFD700');
                items.splice(i, 1);
            } else if (item.x < cameraX - 100) {
                items.splice(i, 1);
            }
        }

        // Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            const dx = hero.x - obs.x;
            const dy = hero.y - obs.y;
            if (dx*dx + dy*dy < (hero.r + obs.r)**2) {
                audio.playSfx('sfx_hit', 'explosion', 120, 0.3);
                showFeedback('fail');
                gameOver();
            } else if (obs.x < cameraX - 100) {
                obstacles.splice(i, 1);
            }
        }
    }

    function draw() {
        // Clear Background
        const skyGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        skyGradient.addColorStop(0, '#3a2875');
        skyGradient.addColorStop(0.45, '#21174c');
        skyGradient.addColorStop(1, '#0f0c26');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        // Atmosphere glow
        const moonGlow = ctx.createRadialGradient(window.innerWidth * 0.72, 90, 12, window.innerWidth * 0.72, 90, 180);
        moonGlow.addColorStop(0, 'rgba(101, 231, 255, 0.26)');
        moonGlow.addColorStop(1, 'rgba(101, 231, 255, 0)');
        ctx.fillStyle = moonGlow;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        // Grid Parallax
        ctx.save();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(201, 196, 239, 0.12)';
        const offsetX = -(cameraX * 0.5) % 50;
        ctx.beginPath();
        for (let x = offsetX; x < window.innerWidth; x += 50) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
        }
        for (let y = 0; y < window.innerHeight; y += 50) {
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
        }
        ctx.stroke();
        ctx.restore();

        // Horizon streaks
        ctx.save();
        ctx.globalAlpha = 0.45;
        for (let i = 0; i < 4; i++) {
            const y = 110 + i * 86;
            const streak = ctx.createLinearGradient(0, y, window.innerWidth, y);
            streak.addColorStop(0, 'rgba(255,255,255,0)');
            streak.addColorStop(0.5, i % 2 === 0 ? 'rgba(101, 231, 255, 0.12)' : 'rgba(255, 79, 160, 0.10)');
            streak.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = streak;
            ctx.fillRect(0, y, window.innerWidth, 2);
        }
        ctx.restore();

        // Draw Lines
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.translate(-cameraX, 0);
        
        lines.forEach(l => {
            if (l.points.length < 2) return;
            ctx.beginPath();
            ctx.lineWidth = 12;
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.globalAlpha = Math.min(1, l.life / 30) * 0.7;
            ctx.moveTo(l.points[0].x, l.points[0].y);
            for(let i=1; i<l.points.length; i++) {
                ctx.lineTo(l.points[i].x, l.points[i].y);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.lineWidth = 7;
            ctx.strokeStyle = l.color;
            ctx.globalAlpha = Math.min(1, l.life / 30);
            ctx.moveTo(l.points[0].x, l.points[0].y);
            for(let i=1; i<l.points.length; i++) {
                ctx.lineTo(l.points[i].x, l.points[i].y);
            }
            ctx.stroke();
        });
        ctx.globalAlpha = 1;

        // Draw Items
        const imgStar = document.getElementById('asset_collectible');
        items.forEach(item => {
            ctx.save();
            ctx.shadowColor = 'rgba(255, 216, 78, 0.55)';
            ctx.shadowBlur = 20;
            if (imgStar.complete) {
                ctx.drawImage(imgStar, item.x - item.r, item.y - item.r, item.r*2, item.r*2);
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(item.x, item.y, item.r, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        });

        // Draw Obstacles
        const imgObs = document.getElementById('asset_obstacle');
        obstacles.forEach(obs => {
            ctx.save();
            ctx.shadowColor = 'rgba(255, 107, 125, 0.3)';
            ctx.shadowBlur = 16;
            if (imgObs.complete) {
                ctx.drawImage(imgObs, obs.x - obs.r, obs.y - obs.r, obs.r*2, obs.r*2);
            } else {
                ctx.fillStyle = '#1F2937';
                ctx.fillRect(obs.x - obs.r, obs.y - obs.r, obs.r*2, obs.r*2);
            }
            ctx.restore();
        });

        // Draw Hero
        const imgHero = document.getElementById('asset_player');
        ctx.save();
        ctx.translate(hero.x, hero.y);
        // Squash and stretch
        if (hero.grounded) {
            ctx.scale(1.1, 0.9);
        } else {
            ctx.scale(0.9, 1.1);
        }
        ctx.shadowColor = 'rgba(255, 79, 160, 0.45)';
        ctx.shadowBlur = 24;
        if (imgHero.complete) {
            ctx.drawImage(imgHero, -hero.r, -hero.r, hero.r*2, hero.r*2);
        } else {
            ctx.fillStyle = '#FF0055';
            ctx.fillRect(-hero.r, -hero.r, hero.r*2, hero.r*2);
        }
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, hero.r + 5, 0.15 * Math.PI, 1.85 * Math.PI);
        ctx.stroke();
        ctx.restore();

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    // Game Loop
    let lastTime = 0;
    function loop(timestamp) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        
        // Cap dt to prevent huge jumps
        const safeDt = Math.min(dt, 50);
        
        // Fixed time step logic approximation
        // For simplicity in single file, we run update once per frame but scale by "frames" logic implicitly or just run physics
        // Here we just use 60fps baseline logic
        if (gameState === 'PLAY') {
            update(safeDt);
        }
        
        draw();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // UI Bindings
    document.getElementById('start-btn').classList.add('ui-font');
    document.getElementById('restart-btn').classList.add('ui-font');

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        audio.unlock();
        audio.playSfx('sfx_start', 'soft-rise', 150, 0.24);
        gameState = 'PLAY';
        resetGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        audio.unlock();
        audio.playSfx('sfx_restart', 'soft-rise', 150, 0.22);
        gameState = 'PLAY';
        resetGame();
        audio.playLoop();
    });

});
</script>
