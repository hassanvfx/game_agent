<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Meme Crate Reveal</title>
    <!-- [agent-note][stage3] resolved-font: title -> Bangers | ui/body -> Exo 2 | accent -> Press Start 2P -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg-deep: #140a25;
            --bg-mid: #31135e;
            --bg-warm: #8b1c62;
            --bg-hot: #ff7a18;
            --panel-bg: rgba(19, 10, 44, 0.76);
            --panel-border: rgba(130, 240, 255, 0.32);
            --panel-highlight: rgba(255, 210, 120, 0.18);
            --text-light: #f8f7ff;
            --text-accent: #ffe083;
            --text-cool: #9ff5ff;
            --gold: #ffd447;
            --gold-dark: #b96a11;
            --danger: #ff4f76;
            --shadow: rgba(0, 0, 0, 0.42);
            --crate-main: #ff7a18;
            --crate-dark: #9b2c13;
            --crate-ribbon: #7ef9ff;
            --crate-ribbon-shadow: #1aa7b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(126, 249, 255, 0.14), transparent 26%),
                radial-gradient(circle at 20% 20%, rgba(255, 212, 71, 0.12), transparent 24%),
                linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 52%, var(--bg-warm) 80%, var(--bg-hot));
            color: var(--text-light);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.2) 0 2px, transparent 3px),
                radial-gradient(circle at 78% 24%, rgba(255, 255, 255, 0.12) 0 2px, transparent 3px),
                radial-gradient(circle at 24% 72%, rgba(255, 224, 131, 0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 82% 68%, rgba(159, 245, 255, 0.16) 0 2px, transparent 3px);
            opacity: 0.9;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.24));
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 68%, rgba(255, 122, 24, 0.14), transparent 28%),
                linear-gradient(135deg, rgba(20, 10, 37, 0.94), rgba(49, 19, 94, 0.9) 50%, rgba(139, 28, 98, 0.92) 76%, rgba(255, 122, 24, 0.82));
        }

        .game-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 100%);
            background-size: 32px 32px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0,0,0,0.85));
            opacity: 0.26;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 2;
        }

        .screen-card {
            width: min(92vw, 540px);
            padding: 1.65rem 1.25rem 1.5rem;
            border-radius: 1.75rem;
            text-align: center;
            pointer-events: auto;
            z-index: 50;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
                linear-gradient(180deg, var(--panel-bg), rgba(21, 8, 40, 0.88));
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 20px 50px var(--shadow),
                inset 0 1px 0 rgba(255,255,255,0.14),
                0 0 28px rgba(126, 249, 255, 0.14);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .screen-card:hover {
            transform: scale(1.02);
            box-shadow:
                0 22px 58px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255,255,255,0.16),
                0 0 36px rgba(126, 249, 255, 0.18);
        }

        .hero-sticker {
            width: clamp(5.5rem, 18vw, 7.5rem);
            aspect-ratio: 1;
            margin: 0 auto 0.8rem;
            border-radius: 1.5rem;
            display: grid;
            place-items: center;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.18) 28%, transparent 29%),
                linear-gradient(180deg, rgba(255, 212, 71, 0.85), rgba(255, 122, 24, 0.92));
            border: 2px solid rgba(255,255,255,0.38);
            box-shadow:
                0 0 0 6px rgba(255, 255, 255, 0.06),
                0 16px 34px rgba(0, 0, 0, 0.35),
                0 0 28px rgba(255, 212, 71, 0.28);
            transform: rotate(-4deg);
        }

        .title {
            margin: 0 0 0.35rem;
            font-family: 'Bangers', 'Press Start 2P', cursive;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            line-height: 1.15;
            letter-spacing: 0.05em;
            color: #fff4bf;
            text-shadow:
                0 0 0 rgba(0,0,0,0),
                0 3px 0 rgba(95, 25, 63, 0.95),
                0 0 24px rgba(255, 214, 92, 0.24);
        }

        .subtitle {
            margin: 0 0 1rem;
            font-size: clamp(0.92rem, 2.8vw, 1.1rem);
            line-height: 1.5;
            color: rgba(248, 247, 255, 0.92);
        }

        .meme-burst {
            position: absolute;
            left: 50%;
            bottom: calc(18vh + env(safe-area-inset-bottom));
            transform: translateX(-50%) scale(0.86);
            width: min(36vw, 180px);
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.32));
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 3;
        }

        .meme-burst.active {
            opacity: 0.92;
            transform: translateX(-50%) scale(1);
        }

        .flavor-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0 0 1rem;
        }

        .flavor-chip {
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.5rem, 1.8vw, 0.62rem);
            line-height: 1.4;
            color: var(--text-cool);
            background: rgba(126, 249, 255, 0.1);
            border: 1px solid rgba(126, 249, 255, 0.28);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .primary-btn,
        .secondary-btn {
            border-radius: 999px;
            min-height: 48px;
            padding: 0.9rem 1.5rem;
            font-size: clamp(0.92rem, 2.8vw, 1.08rem);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, filter 0.15s ease;
            pointer-events: auto;
        }

        .primary-btn {
            background: linear-gradient(180deg, #ffe083, var(--gold));
            color: #5f1c0a;
            box-shadow:
                0 5px 0 var(--gold-dark),
                0 14px 28px rgba(0, 0, 0, 0.28);
        }

        .primary-btn:hover {
            transform: translateY(2px);
            box-shadow:
                0 3px 0 var(--gold-dark),
                0 10px 20px rgba(0, 0, 0, 0.24);
            filter: brightness(1.03);
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .secondary-btn {
            background: linear-gradient(180deg, #ffffff, #f3d7ff);
            color: #7b1d64;
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
        }

        .secondary-btn:hover {
            background: linear-gradient(180deg, #ffffff, #f5e5ff);
            transform: scale(1.04);
            filter: brightness(1.02);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only */
        .hud {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            width: min(88vw, 420px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.5s ease;
        }

        .hud-label {
            margin: 0;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.75rem, 2.6vw, 0.95rem);
            line-height: 1.45;
            text-align: center;
            color: var(--text-accent);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        }

        .meter {
            position: relative;
            width: 100%;
            height: 1.15rem;
            background: rgba(10, 7, 23, 0.7);
            border-radius: 999px;
            overflow: hidden;
            border: 2px solid rgba(159, 245, 255, 0.22);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.4),
                0 0 16px rgba(126, 249, 255, 0.12);
        }

        .meter::after {
            content: 'HYPE';
            position: absolute;
            inset: 0.08rem 0.5rem auto auto;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.08em;
            pointer-events: none;
        }

        .meter-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background:
                linear-gradient(90deg, #7ef9ff 0%, #ffe083 45%, #ff7a18 100%);
            box-shadow:
                inset 0 0 12px rgba(255,255,255,0.38),
                0 0 18px rgba(255, 212, 71, 0.24);
            transition: width 0.1s ease-out;
        }

        .reveal-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.9rem;
            z-index: 40;
            background:
                radial-gradient(circle at center, rgba(255, 122, 24, 0.18), transparent 30%),
                rgba(8, 5, 18, 0.72);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            pointer-events: auto;
            padding: 1rem;
        }

        .reveal-card {
            width: min(92vw, 580px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem;
            border-radius: 1.7rem;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05)),
                linear-gradient(180deg, rgba(31, 12, 59, 0.92), rgba(20, 7, 42, 0.96));
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow:
                0 24px 60px rgba(0,0,0,0.45),
                0 0 38px rgba(255, 122, 24, 0.16);
        }

        .reveal-badge {
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.5rem, 1.8vw, 0.62rem);
            color: var(--text-cool);
            background: rgba(126, 249, 255, 0.1);
            border: 1px solid rgba(126, 249, 255, 0.26);
        }

        .pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        #meme-container {
            width: 100%;
            display: grid;
            place-items: center;
            border-radius: 1.2rem;
            padding: 0.6rem;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 60%),
                linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        }

        #meme-container img {
            display: block;
            max-width: min(86vw, 520px);
            max-height: 50vh;
            border-radius: 16px;
            box-shadow:
                0 0 36px rgba(255, 212, 71, 0.32),
                0 12px 40px rgba(0, 0, 0, 0.38);
            border: 3px solid rgba(255, 255, 255, 0.9);
            object-fit: contain;
            background: rgba(255,255,255,0.08);
        }

        .reveal-title {
            margin: 0;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.15rem, 4.3vw, 1.9rem);
            line-height: 1.4;
            color: #fff5c7;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.8);
        }

        .reveal-copy {
            margin: 0;
            max-width: 34ch;
            text-align: center;
            font-size: clamp(0.86rem, 2.5vw, 1rem);
            line-height: 1.55;
            color: rgba(248, 247, 255, 0.88);
        }

        .reveal-side-gif {
            width: min(42vw, 180px);
            max-width: 100%;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            background: rgba(255,255,255,0.06);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .screen-card {
                padding: 1.35rem 1rem 1.2rem;
                border-radius: 1.45rem;
            }

            .hero-sticker {
                margin-bottom: 0.7rem;
                border-radius: 1.2rem;
            }

            .hud {
                top: calc(max(0.75rem, env(safe-area-inset-top)) + 0.25rem);
            }

            .meter {
                height: 1rem;
            }

            .reveal-card {
                padding: 0.85rem;
                gap: 0.75rem;
            }

            #meme-container img {
                max-height: 42vh;
            }

            .meme-burst {
                width: min(42vw, 150px);
                bottom: calc(15vh + env(safe-area-inset-bottom));
            }

            .reveal-side-gif {
                width: min(52vw, 150px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: tap-burst -> catalogs/gifs.json | keep off playfield center to protect controls -->
            <img id="tap-burst" class="meme-burst hidden" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.gif" alt="Arcade impact burst">
            <div id="start-screen" class="screen-card">
                <div class="hero-sticker" aria-hidden="true">📦</div>
                <h1 class="title">MEME CRATE</h1>
                <p class="subtitle">Smash the streamer crate, charge the hype meter, and pop the final chaotic reaction.</p>
                <div class="flavor-row" aria-hidden="true">
                    <span class="flavor-chip">TAP FRENZY</span>
                    <span class="flavor-chip">HYPE BUILD</span>
                    <span class="flavor-chip">BIG REVEAL</span>
                </div>
                <button id="start-btn" class="primary-btn">START UNBOXING</button>
            </div>

            <div id="hud" class="hud hidden">
                <p class="hud-label">TAP THE CRATE TO CHARGE THE REVEAL</p>
                <div class="meter">
                    <div id="progress-bar" class="meter-fill"></div>
                </div>
            </div>

            <div id="meme-reveal" class="reveal-screen hidden">
                <div class="reveal-card pop-in">
                    <div class="reveal-badge">DROP COMPLETE</div>
                    <div id="meme-container">
                        <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.gif" alt="Unlocked meme reaction">
                    </div>
                    <img class="reveal-side-gif" src="https://i.giphy.com/3uHqVTVsvzuZia7z39.gif" alt="Celebration reaction sticker">
                    <h2 class="reveal-title">REACTION UNLOCKED!</h2>
                    <p class="reveal-copy">The crate cracked, the chat popped off, and the payoff landed with maximum drama.</p>
                    <!-- [agent-note][stage1] role: future-audio | trigger: win-state | intent: amplify meme payoff without changing the tap loop -->
                    <button id="restart-btn" class="secondary-btn">SEAL THE CRATE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                tap: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                fill: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            pauseBGM() {
                this.bgm.pause();
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = key === 'tap' ? 65 : 120;
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = ({
                    start: 0.5,
                    tap: 0.22,
                    fill: 0.42,
                    restart: 0.45,
                    win: 0.72
                })[key] ?? 0.5;

                if (key === 'tap') {
                    clone.playbackRate = 0.92 + Math.random() * 0.16;
                } else if (key === 'fill') {
                    clone.playbackRate = 1.05;
                }

                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        let gameActive = false;
        let progress = 0;
        const GOAL = 20;

        let boxScale = 1;
        let shakeX = 0;
        let shakeY = 0;
        let shakeTimer = 0;
        let particles = [];
        let backgroundParticles = [];
        let gameLoopStarted = false;
        let burstTimer = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initBackgroundParticles();
        }
        window.addEventListener('resize', resize);

        /** 4. PARTICLE SYSTEMS */
        function initBackgroundParticles() {
            backgroundParticles = [];
            for (let i = 0; i < 50; i++) {
                backgroundParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 3 + 1,
                    speedY: Math.random() * 1 + 0.5,
                    opacity: Math.random() * 0.5 + 0.1,
                    drift: (Math.random() - 0.5) * 0.35
                });
            }
        }

        function spawnConfetti(x, y) {
            const colors = ['#7EF9FF', '#FFFFFF', '#FFD447', '#FF7A18', '#FF4F76'];
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    gravity: 0.5
                });
            }
        }

        /** 5. DRAWING & LOGIC */
        function update() {
            if (burstTimer > 0) {
                burstTimer--;
                const tapBurst = document.getElementById('tap-burst');
                if (tapBurst && burstTimer === 0) {
                    tapBurst.classList.remove('active');
                    tapBurst.classList.add('hidden');
                }
            }
            if (!gameActive) return;

            if (shakeTimer > 0) {
                shakeTimer--;
                shakeX = (Math.random() - 0.5) * 20;
                shakeY = (Math.random() - 0.5) * 20;
                boxScale = 0.95;
            } else {
                shakeX = 0;
                shakeY = 0;
                boxScale += (1 - boxScale) * 0.1;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }

            backgroundParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.drift;
                if (p.y > height) p.y = -10;
                if (p.x > width + 8) p.x = -8;
                if (p.x < -8) p.x = width + 8;
            });
        }

        function drawGiftBox(cx, cy, scale) {
            ctx.save();
            ctx.translate(cx + shakeX, cy + shakeY);
            ctx.scale(scale, scale);

            const boxSize = Math.min(width, height) * 0.4;
            const faceBlink = Math.sin(Date.now() / 220) > 0.96 ? 1.5 : 0;
            const mouthOpen = 10 + Math.abs(Math.sin(Date.now() / 190)) * 3;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, boxSize / 1.7, boxSize / 1.75, boxSize / 6.5, 0, 0, Math.PI * 2);
            ctx.fill();

            const glow = ctx.createRadialGradient(0, 0, boxSize * 0.1, 0, 0, boxSize * 0.95);
            glow.addColorStop(0, 'rgba(255, 224, 131, 0.20)');
            glow.addColorStop(1, 'rgba(255, 224, 131, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, boxSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#9b2c13';
            ctx.beginPath();
            ctx.roundRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize, boxSize * 0.08);
            ctx.fill();

            const crateGradient = ctx.createLinearGradient(-boxSize / 2, -boxSize / 2, boxSize / 2, boxSize / 2);
            crateGradient.addColorStop(0, '#ff9b4a');
            crateGradient.addColorStop(0.55, '#ff7a18');
            crateGradient.addColorStop(1, '#d44a0f');
            ctx.fillStyle = crateGradient;
            ctx.beginPath();
            ctx.roundRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize, boxSize * 0.08);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.beginPath();
            ctx.roundRect(-boxSize * 0.38, -boxSize * 0.36, boxSize * 0.76, boxSize * 0.16, boxSize * 0.04);
            ctx.fill();

            ctx.strokeStyle = 'rgba(91, 22, 5, 0.32)';
            ctx.lineWidth = boxSize * 0.025;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-boxSize * 0.48, i * boxSize * 0.16);
                ctx.lineTo(boxSize * 0.48, i * boxSize * 0.16);
                ctx.stroke();
            }

            ctx.fillStyle = '#7ef9ff';
            ctx.fillRect(-boxSize * 0.09, -boxSize / 2, boxSize * 0.18, boxSize);
            ctx.fillRect(-boxSize / 2, -boxSize * 0.09, boxSize, boxSize * 0.18);

            ctx.fillStyle = '#1aa7b8';
            ctx.fillRect(-boxSize * 0.09, -boxSize / 2, boxSize * 0.05, boxSize);
            ctx.fillRect(-boxSize / 2, -boxSize * 0.09, boxSize, boxSize * 0.05);

            ctx.fillStyle = '#c7ffff';
            ctx.beginPath();
            ctx.ellipse(-boxSize * 0.16, -boxSize / 2, boxSize * 0.15, boxSize * 0.1, -0.55, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(boxSize * 0.16, -boxSize / 2, boxSize * 0.15, boxSize * 0.1, 0.55, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#7ef9ff';
            ctx.beginPath();
            ctx.arc(0, -boxSize / 2, boxSize * 0.055, 0, Math.PI * 2);
            ctx.fill();

            const faceY = boxSize * 0.03;
            ctx.fillStyle = '#2a0d3f';
            ctx.beginPath();
            ctx.arc(-boxSize * 0.14, faceY - boxSize * 0.03, boxSize * 0.045, 0, Math.PI * 2);
            ctx.arc(boxSize * 0.14, faceY - boxSize * 0.03, boxSize * 0.045, 0, Math.PI * 2);
            ctx.fill();

            if (faceBlink > 0) {
                ctx.strokeStyle = '#fff4bf';
                ctx.lineWidth = boxSize * 0.015;
                ctx.beginPath();
                ctx.moveTo(-boxSize * 0.19, faceY - boxSize * 0.03);
                ctx.lineTo(-boxSize * 0.09, faceY - boxSize * 0.03);
                ctx.moveTo(boxSize * 0.09, faceY - boxSize * 0.03);
                ctx.lineTo(boxSize * 0.19, faceY - boxSize * 0.03);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#fff4bf';
                ctx.beginPath();
                ctx.arc(-boxSize * 0.13, faceY - boxSize * 0.045, boxSize * 0.015, 0, Math.PI * 2);
                ctx.arc(boxSize * 0.15, faceY - boxSize * 0.045, boxSize * 0.015, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#2a0d3f';
            ctx.lineWidth = boxSize * 0.02;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(0, faceY + boxSize * 0.05, boxSize * 0.09, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.fillStyle = '#fff4bf';
            ctx.beginPath();
            ctx.arc(0, faceY + boxSize * 0.1, boxSize * 0.025, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.beginPath();
            ctx.arc(-boxSize * 0.22, faceY + boxSize * 0.1, mouthOpen, 0, Math.PI * 2);
            ctx.arc(boxSize * 0.22, faceY + boxSize * 0.1, mouthOpen, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, 'rgba(255,255,255,0.08)');
            bgGradient.addColorStop(1, 'rgba(0,0,0,0.12)');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            backgroundParticles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            if (gameActive) {
                drawGiftBox(width / 2, height / 2, boxScale);
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function triggerBurst() {
            const tapBurst = document.getElementById('tap-burst');
            if (!tapBurst) return;
            burstTimer = 12;
            tapBurst.classList.remove('hidden');
            tapBurst.classList.add('active');
        }

        /** 6. INTERACTION */
        function handleTap(e) {
            if (!gameActive) return;

            progress++;
            shakeTimer = 5;
            audio.playSFX('tap');
            if (progress % 5 === 0 && progress < GOAL) {
                audio.playSFX('fill');
                triggerBurst();
            }

            let tx = width / 2;
            let ty = height / 2;
            if (e.touches && e.touches[0]) {
                tx = e.touches[0].clientX;
                ty = e.touches[0].clientY;
            } else if (e.clientX) {
                tx = e.clientX;
                ty = e.clientY;
            }
            spawnConfetti(tx, ty);

            const percentage = Math.min((progress / GOAL) * 100, 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            if (progress >= GOAL) {
                winGame();
            }
        }

        function winGame() {
            gameActive = false;
            audio.pauseBGM();
            audio.playSFX('win');
            triggerBurst();
            document.getElementById('hud').classList.add('hidden');

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    spawnConfetti(width / 2 + (Math.random() - 0.5) * 100, height / 2 + (Math.random() - 0.5) * 100);
                }, i * 100);
            }

            setTimeout(() => {
                document.getElementById('meme-reveal').classList.remove('hidden');
            }, 500);
        }

        function initGame() {
            resize();
            progress = 0;
            burstTimer = 0;
            document.getElementById('tap-burst').classList.add('hidden');
            document.getElementById('tap-burst').classList.remove('active');
            document.getElementById('progress-bar').style.width = '0%';
            particles = [];
            gameActive = true;
            if (!gameLoopStarted) {
                gameLoopStarted = true;
                gameLoop();
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('restart');
            audio.playBGM();
            document.getElementById('meme-reveal').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
        });

        window.addEventListener('mousedown', handleTap);
        window.addEventListener('touchstart', (e) => {
            handleTap(e);
        }, { passive: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.pauseBGM();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        resize();
        initBackgroundParticles();

        function attractLoop() {
            if (!gameActive) {
                ctx.clearRect(0, 0, width, height);

                const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
                bgGradient.addColorStop(0, 'rgba(255,255,255,0.08)');
                bgGradient.addColorStop(1, 'rgba(0,0,0,0.12)');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, width, height);

                backgroundParticles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.drift;
                    if (p.y > height) p.y = -10;
                    if (p.x > width + 8) p.x = -8;
                    if (p.x < -8) p.x = width + 8;
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                const idleScale = 1 + Math.sin(Date.now() / 500) * 0.05;
                drawGiftBox(width / 2, height / 2, idleScale);

                requestAnimationFrame(attractLoop);
            }
        }
        attractLoop();
    });
    </script>
</body>
