<!DOCTYPE html>
<html lang="en">

<title>Moonroom Life Simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
:root{--safe-bottom:env(safe-area-inset-bottom,18px);--safe-top:env(safe-area-inset-top,18px);--ink:#432047;--cream:#fff8fc;--pink:#ff73bd;--lilac:#b990ff;--mint:#85ffd3;--gold:#ffe082;--sky:#95d8ff;--panel:rgba(255,248,252,.82)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffe8f6;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}canvas{display:block;width:100%;height:100%}.display{font-family:'Bangers',system-ui,sans-serif;letter-spacing:.045em}.pixel{font-family:'Press Start 2P',monospace}.glass{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,240,252,.72));border:2px solid rgba(255,115,189,.38);box-shadow:0 12px 30px rgba(162,67,137,.2),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}#game{position:relative;width:100%;height:100%;background:radial-gradient(circle at 20% 0,#fff 0 5%,transparent 22%),linear-gradient(180deg,#ffd9f1 0%,#d7c6ff 45%,#c5fff0 100%)}#game:before{content:"";position:absolute;inset:-30%;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 8px,transparent 8px 34px);animation:drift 18s linear infinite}#game:after{content:"☾ ✦ ♡ ☆ ✧ ♡ ✦ ☾";position:absolute;left:50%;top:50%;width:120vmax;transform:translate(-50%,-50%) rotate(-10deg);font-size:clamp(20px,7vw,64px);letter-spacing:8vw;color:rgba(255,255,255,.22);white-space:nowrap;pointer-events:none;animation:floatText 9s ease-in-out infinite alternate}@keyframes drift{to{transform:translate3d(120px,80px,0)}}@keyframes floatText{to{transform:translate(-50%,-54%) rotate(8deg)}}#ui{position:absolute;inset:0;z-index:10;pointer-events:none}.topbar{position:absolute;top:var(--safe-top);left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.feed{width:min(67vw,360px);height:168px;overflow:hidden;padding:10px;border-radius:22px;font-size:12px;font-weight:800;text-shadow:0 1px rgba(255,255,255,.6)}#chat-messages{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%;gap:4px}.chat-msg{animation:pop .22s ease-out}.chat-name{color:#a444d7}.system{color:#ff4fa9}.hud-stack{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:0;font-size:20px;color:var(--ink);pointer-events:auto}.online{border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;color:#4e2356}.prompt{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);z-index:34;pointer-events:auto}.hidden{display:none!important}.claim-btn,.play-btn,.send-btn{border:0;border-radius:999px;background:linear-gradient(90deg,#ff73bd,#b990ff,#85ffd3);color:#fff;text-shadow:0 2px rgba(85,36,84,.25);box-shadow:0 7px 0 rgba(144,70,143,.45),0 14px 25px rgba(255,115,189,.28);font-weight:1000;touch-action:manipulation}.claim-btn{padding:14px 22px;font-size:15px}.play-btn{width:100%;padding:16px 18px;font-size:22px}.claim-btn:active,.play-btn:active,.send-btn:active,.action:active,.round:active{transform:scale(.94)}.bottom{position:absolute;left:0;right:0;bottom:0;height:33%;pointer-events:none}#joystick-zone{position:absolute;left:26px;bottom:calc(36px + var(--safe-bottom));width:138px;height:138px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,115,189,.18));border:3px dashed rgba(255,115,189,.52);box-shadow:0 0 0 9px rgba(255,255,255,.18);touch-action:none;pointer-events:auto}#joystick-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 32% 28%,#fff,#ffe082 45%,#ff73bd 75%,#b990ff);border:3px solid #fff;box-shadow:0 8px 18px rgba(121,61,129,.28);pointer-events:none}.chat-btn{position:absolute;left:180px;top:10px;border:0;border-radius:999px;padding:12px 14px;font-weight:1000;color:#5d2b63;pointer-events:auto}.actions{position:absolute;right:18px;bottom:calc(36px + var(--safe-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:13px;pointer-events:auto}.action{border:0;border-radius:24px;width:58px;height:58px;font-size:25px;color:#fff;background:linear-gradient(180deg,#ff9fd0,#ff5ab3);box-shadow:0 6px 0 rgba(170,66,132,.45);touch-action:manipulation}.action.big{width:68px;height:68px;font-size:31px;background:linear-gradient(180deg,#a98cff,#69dff8)}.modal{position:absolute;inset:0;z-index:42;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(75,30,76,.38);opacity:0;pointer-events:none;transform:scale(.98);transition:.18s}.modal.active{opacity:1;pointer-events:auto;transform:scale(1)}.sheet{width:min(390px,96vw);max-height:82vh;border-radius:28px;padding:18px;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.close{border:0;background:transparent;font-size:30px;color:#6b3671}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.card{border:0;border-radius:20px;background:rgba(255,255,255,.72);padding:12px;min-height:76px;font-weight:900;color:#55245b;box-shadow:inset 0 0 0 2px rgba(255,115,189,.15)}#chat-modal{align-items:flex-end;padding:0 0 var(--safe-bottom)}#chat-modal .sheet{border-radius:28px 28px 0 0;width:100%;max-width:none}#chat-input-field{width:100%;border:2px solid rgba(255,115,189,.35);border-radius:18px;padding:15px;font-size:16px;color:#55245b;background:#fff}.send-row{display:flex;gap:8px}.send-btn{padding:0 18px}.reaction{position:absolute;right:12px;width:88px;height:88px;border-radius:22px;object-fit:cover;z-index:23;opacity:0;transform:translateY(8px) scale(.9);transition:.18s;pointer-events:none;border:3px solid rgba(255,255,255,.72);box-shadow:0 12px 28px rgba(118,45,118,.24)}.reaction.visible{opacity:.95;transform:none}#start-screen{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;background:radial-gradient(circle at 50% 10%,#fff 0 4%,transparent 22%),linear-gradient(180deg,#ffd8f0,#d7c5ff 54%,#c7ffef)}.start-card{width:min(430px,95vw);border-radius:34px;padding:24px;position:relative;overflow:hidden}.start-card:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#fff9,transparent,#fff7,transparent);animation:spin 9s linear infinite;opacity:.45;pointer-events:none}.start-card>*{position:relative}.title{font-size:clamp(44px,13vw,68px);line-height:.84;margin:0;background:linear-gradient(90deg,#ff4fa9,#8d6cff,#00b8da,#ffb64a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.75);filter:drop-shadow(0 7px 0 rgba(255,255,255,.55))}.tag{display:inline-block;margin:12px 0 14px;border-radius:999px;padding:7px 12px;background:#fff;color:#8b377e;font-size:9px;font-weight:1000}.intro{font-weight:800;line-height:1.35;margin:0 auto 18px;max-width:320px;color:#65306a}#player-name{width:100%;border:3px solid rgba(255,115,189,.35);border-radius:22px;padding:14px;text-align:center;font-size:22px;color:#67306a;background:#fff;margin:8px 0 14px}.loader{height:9px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden}.loader-bar{height:100%;width:0;background:linear-gradient(90deg,#ff73bd,#b990ff,#85ffd3);transition:.14s}.loading-text{font-weight:1000;color:#8b377e}.sr-label{display:block;text-align:left;font-size:11px;font-weight:1000;color:#7d3a80}@keyframes spin{to{transform:rotate(1turn)}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}@media(max-width:390px){.feed{height:138px;font-size:10px}.chat-btn{left:168px;padding:10px 11px}.actions{right:12px}.action{width:54px;height:54px}#joystick-zone{width:126px;height:126px;left:18px}.title{font-size:42px}}
</style>
</head>
<body>
<div id="game">
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="topbar">
    <div class="feed glass"><div class="pixel" style="font-size:9px;margin-bottom:6px;color:#9a438f">SLAY FEED</div><div id="chat-messages"></div></div>
    <div class="hud-stack"><button id="menu-btn" class="round glass" aria-label="Open life arcs">🌙</button><div class="online glass"><span style="color:#20bd94">●</span> <span id="player-count">1 Online</span></div></div>
  </div>
  <div id="interact-prompt" class="prompt hidden"><button id="interact-btn" class="claim-btn">🏡 Claim Dream Dorm</button></div>
  <div class="bottom">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <button id="chat-btn" class="chat-btn glass">💬 Vibe</button>
    <div class="actions"><button id="vehicle-btn" class="action">🛼</button><button id="emotes-btn" class="action">✨</button><button id="roles-btn" class="action big">🎀</button></div>
  </div>
</div>
<div id="chat-modal" class="modal"><div class="sheet glass"><div class="send-row"><input id="chat-input-field" maxlength="40" placeholder="drop a cozy hot take..."><button id="send-chat-btn" class="send-btn">SEND</button></div><button id="close-chat" class="close" style="width:100%;font-size:15px;margin-top:10px">cancel vibe</button></div></div>
<div id="roles-modal" class="modal"><div class="sheet glass"><div class="sheet-head"><h2 class="display" style="font-size:34px;margin:0;color:#ff4fa9">Pick Life Arc</h2><button class="close close-modal">×</button></div><div id="roles-list" class="grid2"></div></div></div>
<div id="emotes-modal" class="modal"><div class="sheet glass"><div class="sheet-head"><h2 class="display" style="font-size:34px;margin:0;color:#8d6cff">Tiny Rituals</h2><button class="close close-modal">×</button></div><div id="emotes-list" class="grid3"></div></div></div>
<img id="claim-gif" class="reaction" style="top:calc(var(--safe-top) + 70px)" src="https://i.giphy.com/Y1AWZiOfbIajeMQmAy.webp" alt="slay claim reaction">
<img id="emote-gif" class="reaction" style="top:calc(var(--safe-top) + 170px)" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="sparkle ritual reaction">
<div id="start-screen"><div class="start-card glass"><h1 class="title display">MOONROOM<br>LIFE SIM</h1><div class="tag pixel">life simulator • rpg vibes • rainbowcore</div><p class="intro">A one-thumb cozy satire where you skate through chores, choose a dramatic life arc, claim a dream dorm, and announce that everything is giving main character.</p><div id="login-form"><label class="sr-label pixel" for="player-name">MAIN CHARACTER NAME</label><input id="player-name" value="Guest" maxlength="10" placeholder="Guest"><button id="play-btn" class="play-btn display">START SLAY</button></div><div id="loading-state" class="hidden"><p id="loading-text" class="loading-text">charging moon compact...</p><div class="loader"><div id="loading-bar" class="loader-bar"></div></div></div></div></div>
</div>
<script>
const ASSETS={bgm:"https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",sfx:{click:"https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",claim:"https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",chat:"https://gamezone-virid.vercel.app/assets/audios/ui/ui_hover_02.mp3",role:"https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",emote:"https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",vehicle:"https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3"}};
const ROLES=[{id:'soft',name:'Soft Girl CEO',color:'#ff73bd',accessory:'bow'},{id:'moon',name:'Moon Intern',color:'#8d6cff',accessory:'moon'},{id:'healer',name:'Snack Healer',color:'#20d5b0',accessory:'scope'},{id:'villain',name:'Drama Villain',color:'#6b3b73',accessory:'mask'},{id:'student',name:'Homework Mage',color:'#ffb64a',accessory:'pack'},{id:'chef',name:'Cafe Icon',color:'#ff5b80',accessory:'hat'}];
const EMOTES=[{id:'dance',icon:'💃',name:'Slay'},{id:'wave',icon:'👋',name:'Hey Bestie'},{id:'sit',icon:'🧘',name:'Decompress'},{id:'sleep',icon:'💤',name:'Nap Arc'},{id:'spin',icon:'🌪️',name:'Spiral'},{id:'float',icon:'🌙',name:'Moon Float'}];
const BOT_NAMES=['Luna','Mochi','Nova','Bunny','Ami','Rei','Mina','Usagi-ish','SlayBot','CozyNPC','RentDue','VibeGoblin'];
const BOT_CHATS=['its giving errands','slay bestie','abc for roommate arc','rent? in this economy?','soft reset walk','who has snacks','moon meeting at my dorm','stress deleted','main character moment','need a tiny treat'];
const AudioSys={bgm:null,sfx:{},enabled:false,lastPlayed:{},init(){this.bgm=new Audio(ASSETS.bgm);this.bgm.loop=true;this.bgm.volume=.13;this.bgm.preload='auto';for(const k in ASSETS.sfx){this.sfx[k]=new Audio(ASSETS.sfx[k]);this.sfx[k].preload='auto';this.sfx[k].volume={click:.28,claim:.38,chat:.22,role:.32,emote:.32,vehicle:.3}[k]||.3}},enable(){this.enabled=true},playBGM(){if(this.enabled&&this.bgm)this.bgm.play().catch(()=>{})},pauseBGM(){if(this.bgm)this.bgm.pause()},playSFX(k,cooldown=90){if(!this.enabled||!this.sfx[k])return;const now=performance.now();if((this.lastPlayed[k]||0)+cooldown>now)return;this.lastPlayed[k]=now;const s=this.sfx[k].cloneNode();s.volume=this.sfx[k].volume;s.play().catch(()=>{})}};
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let width=0,height=0,lastTime=0,gameRunning=false,gameStarted=false,reactionTimeout=null;const WORLD_SIZE=2400,camera={x:0,y:0},keys={},joystick={active:false,x:0,y:0,originX:0,originY:0};const player={x:WORLD_SIZE/2,y:WORLD_SIZE/2,name:'Player',role:ROLES[0],emote:null,emoteTimer:0,vehicle:false,facing:1,animFrame:0,chatBubble:null,chatTimer:0};const otherPlayers=[],houses=[],particles=[];
function resize(){width=innerWidth;height=innerHeight;canvas.width=width;canvas.height=height}addEventListener('resize',resize);resize();
function addChatMessage(name,text,isSystem=false){const c=document.getElementById('chat-messages'),el=document.createElement('div');el.className='chat-msg';el.innerHTML=isSystem?`<span class="system">✦ ${text}</span>`:`<span class="chat-name">[${name}]:</span> <span>${text}</span>`;c.appendChild(el);if(!isSystem)AudioSys.playSFX('chat');while(c.children.length>20)c.removeChild(c.firstChild)}
function setChatBubble(e,text){e.chatBubble=text;e.chatTimer=4000}function showReaction(type){const a=document.getElementById('claim-gif'),b=document.getElementById('emote-gif');a.classList.remove('visible');b.classList.remove('visible');const t=type==='claim'?a:b;t.classList.add('visible');clearTimeout(reactionTimeout);reactionTimeout=setTimeout(()=>t.classList.remove('visible'),1800)}
function createHouse(x,y,streetIdx){return{x,y,w:200,h:180,color:`hsl(${310+Math.random()*70},85%,88%)`,roofColor:`hsl(${250+Math.random()*80},78%,62%)`,owner:null,id:`dorm_${streetIdx}_${x}`}};
function spawnBot(){const name=BOT_NAMES[Math.floor(Math.random()*BOT_NAMES.length)]+Math.floor(Math.random()*99);otherPlayers.push({x:Math.random()*WORLD_SIZE,y:Math.random()*WORLD_SIZE,role:ROLES[Math.floor(Math.random()*ROLES.length)],targetX:Math.random()*WORLD_SIZE,targetY:Math.random()*WORLD_SIZE,speed:3+Math.random(),name,vehicle:Math.random()>.7,emote:null,emoteTimer:0,facing:1,animFrame:0,state:'wander',stateTimer:0,chatBubble:null,chatTimer:0});addChatMessage('',`${name} entered the group chat`,true);updatePlayerCount()}
function updatePlayerCount(){document.getElementById('player-count').innerText=`${otherPlayers.length+1} Online`}
function initWorld(){houses.length=0;[600,1200,1800].forEach((y,i)=>{for(let x=200;x<WORLD_SIZE-200;x+=500)houses.push(createHouse(x,y-250,i));for(let x=450;x<WORLD_SIZE-200;x+=500)houses.push(createHouse(x,y+120,i))});otherPlayers.length=0;for(let i=0;i<8;i++)spawnBot();updatePlayerCount()}
function update(dt){if(!gameRunning)return;let dx=joystick.x,dy=joystick.y;if(keys.ArrowUp||keys.w)dy=-1;if(keys.ArrowDown||keys.s)dy=1;if(keys.ArrowLeft||keys.a)dx=-1;if(keys.ArrowRight||keys.d)dx=1;const moving=dx!==0||dy!==0;if(moving){if(player.emote&&player.emote!=='float')player.emote=null;const speed=player.vehicle?14:7,len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len}player.x+=dx*speed;player.y+=dy*speed;if(dx>0)player.facing=1;if(dx<0)player.facing=-1;player.animFrame+=dt*.015*speed}else player.animFrame=0;player.x=Math.max(50,Math.min(WORLD_SIZE-50,player.x));player.y=Math.max(50,Math.min(WORLD_SIZE-50,player.y));camera.x+=(player.x-width/2-camera.x)*.1;camera.y+=(player.y-height/2-camera.y)*.1;if(player.chatTimer>0)player.chatTimer-=dt;let nearHouse=null;houses.forEach(h=>{const cx=h.x+h.w/2,cy=h.y+h.h;if(Math.hypot(player.x-cx,player.y-cy)<100&&h.owner===null)nearHouse=h});const prompt=document.getElementById('interact-prompt'),btn=document.getElementById('interact-btn');if(nearHouse){prompt.classList.remove('hidden');btn.onclick=()=>{nearHouse.owner=player.name;AudioSys.playSFX('claim',220);showReaction('claim');spawnParticles(nearHouse.x+nearHouse.w/2,nearHouse.y+nearHouse.h,'#ffe082');addChatMessage('',`${player.name} claimed a Dream Dorm. slay.`,true)}}else{prompt.classList.add('hidden');btn.onclick=null}otherPlayers.forEach(bot=>{if(bot.chatTimer>0)bot.chatTimer-=dt;bot.stateTimer-=dt;if(bot.stateTimer<=0){const r=Math.random();if(r<.02){const msg=BOT_CHATS[Math.floor(Math.random()*BOT_CHATS.length)];setChatBubble(bot,msg);addChatMessage(bot.name,msg);bot.stateTimer=2000}else if(r<.3){bot.targetX=Math.random()*WORLD_SIZE;bot.targetY=Math.random()*WORLD_SIZE;bot.state='walk';bot.stateTimer=4000+Math.random()*4000;bot.vehicle=Math.random()>.5;bot.emote=null}else if(r<.4){bot.state='idle';bot.emote=EMOTES[Math.floor(Math.random()*EMOTES.length)].id;bot.stateTimer=3000}else if(r<.45){const empty=houses.find(h=>!h.owner);if(empty){bot.targetX=empty.x+empty.w/2;bot.targetY=empty.y+empty.h;bot.state='claim';bot.stateTimer=10000}}}if(bot.state==='walk'||bot.state==='claim'){const bx=bot.targetX-bot.x,by=bot.targetY-bot.y,dist=Math.hypot(bx,by),speed=bot.vehicle?10:4;if(dist>20){bot.x+=bx/dist*speed;bot.y+=by/dist*speed;bot.facing=bx>0?1:-1;bot.animFrame+=dt*.015*speed}else{if(bot.state==='claim'){const h=houses.find(h=>Math.hypot(bot.x-(h.x+h.w/2),bot.y-(h.y+h.h))<50);if(h&&!h.owner){h.owner=bot.name;spawnParticles(h.x+h.w/2,h.y+h.h,'#ffe082');addChatMessage('',`${bot.name} claimed a Dream Dorm.`,true)}bot.state='idle'}bot.animFrame=0}}else bot.animFrame=0;if(bot.emote)bot.emoteTimer+=dt*.005});for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.05;if(p.life<=0)particles.splice(i,1)}player.emoteTimer+=dt*.005}
function spawnParticles(x,y,color){for(let i=0;i<15;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,life:1,color})}
function star(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*.42;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function drawEntity(e,isPlayer){ctx.save();ctx.translate(e.x,e.y);let scaleY=1,rot=0,bounce=0;if(e.emote==='sit'){scaleY=.6;ctx.translate(0,10)}else if(e.emote==='sleep'){rot=Math.PI/2;ctx.translate(0,10)}else if(e.emote==='dance'){rot=Math.sin(e.emoteTimer*10)*.22;bounce=Math.abs(Math.sin(e.emoteTimer*10))*5}else if(e.emote==='float'){bounce=Math.sin(e.emoteTimer*3)*10+10}else if(e.emote==='spin')rot=e.emoteTimer*10;if(!e.emote&&(e.vehicle||e.animFrame>0)){bounce=Math.abs(Math.sin(e.animFrame))*3;rot=Math.sin(e.animFrame)*.1*e.facing}ctx.translate(0,-bounce);ctx.rotate(rot);if(e.vehicle){ctx.fillStyle='#ff73bd';ctx.beginPath();ctx.roundRect(-29,11,58,11,6);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-19,22,5,0,Math.PI*2);ctx.arc(19,22,5,0,Math.PI*2);ctx.fill();star(0,10,6,'#ffe082')}ctx.fillStyle='rgba(100,44,103,.22)';ctx.beginPath();ctx.ellipse(0,17,18,7,0,0,Math.PI*2);ctx.fill();ctx.scale(1,scaleY);if(isPlayer){ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,-10,31,38,0,0,Math.PI*2);ctx.stroke();star(-28,-38,10,'rgba(255,224,130,.8)')}ctx.fillStyle=e.role.color;ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(18,14);ctx.lineTo(-18,14);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(-11,-6,22,6);ctx.fillStyle='#7a3b73';ctx.fillRect(-13,12,10,13);ctx.fillRect(3,12,10,13);ctx.fillStyle='#ffd7b6';ctx.beginPath();ctx.roundRect(-12,-40,24,24,9);ctx.fill();ctx.fillStyle=isPlayer?'#ffb6df':'#7b4b82';ctx.beginPath();ctx.arc(0,-37,15,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#402044';if(e.emote==='sleep')ctx.fillText('- -',-5,-26);else{ctx.fillRect(-6,-31,4,4);ctx.fillRect(3,-31,4,4);ctx.beginPath();ctx.arc(1,-25,4,0,Math.PI);ctx.stroke()}ctx.fillStyle=e.role.color;if(e.emote==='wave'){ctx.save();ctx.translate(16,-10);ctx.rotate(Math.sin(e.emoteTimer*10)*.5-.5);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.fillRect(-20,-11,8,20)}else{ctx.fillRect(-20,-11,8,20);ctx.fillRect(12,-11,8,20)}if(e.role.accessory==='hat'){ctx.fillStyle='#fff';ctx.fillRect(-13,-48,26,10)}else if(e.role.accessory==='mask'){ctx.fillStyle='#4b2450';ctx.fillRect(-9,-31,18,7)}else if(e.role.accessory==='bow'){ctx.fillStyle='#ff4fa9';ctx.beginPath();ctx.arc(-10,-44,6,0,Math.PI*2);ctx.arc(2,-44,6,0,Math.PI*2);ctx.fill()}else if(e.role.accessory==='moon'){ctx.fillStyle='#ffe082';ctx.beginPath();ctx.arc(10,-45,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd7b6';ctx.beginPath();ctx.arc(14,-47,7,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.save();ctx.translate(e.x,e.y-57-bounce);ctx.textAlign='center';ctx.font='700 10px system-ui';ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.roundRect(-48,-18,96,18,8);ctx.fill();ctx.fillStyle=e.role.color;ctx.fillText(e.role.name.toUpperCase(),0,-5);ctx.font='900 15px system-ui';ctx.fillStyle='#5b2860';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.strokeText(e.name,0,14);ctx.fillText(e.name,0,14);if(e.chatBubble&&e.chatTimer>0){ctx.font='13px system-ui';const w=ctx.measureText(e.chatBubble).width+22;ctx.translate(0,-42);ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-w/2,-30,w,30,12);ctx.fill();ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(0,8);ctx.lineTo(5,0);ctx.fill();ctx.fillStyle='#5b2860';ctx.fillText(e.chatBubble,0,-10)}ctx.restore()}
function draw(){ctx.clearRect(0,0,width,height);ctx.fillStyle='#ffe8f6';ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(-camera.x,-camera.y);const g=ctx.createLinearGradient(0,0,0,WORLD_SIZE);g.addColorStop(0,'#ffd4ef');g.addColorStop(.42,'#d9c7ff');g.addColorStop(1,'#c8fff1');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD_SIZE,WORLD_SIZE);for(let i=0;i<50;i++){star((i*173)%WORLD_SIZE,(i*227)%WORLD_SIZE,8+(i%3)*4,['rgba(255,255,255,.48)','rgba(255,224,130,.42)','rgba(255,115,189,.28)'][i%3])}ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;for(let i=0;i<=WORLD_SIZE;i+=100){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,WORLD_SIZE);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(WORLD_SIZE,i);ctx.stroke()}[600,1200,1800].forEach(y=>{ctx.fillStyle='rgba(255,255,255,.38)';ctx.fillRect(0,y,WORLD_SIZE,120);ctx.strokeStyle='rgba(255,115,189,.55)';ctx.setLineDash([22,26]);ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,y+60);ctx.lineTo(WORLD_SIZE,y+60);ctx.stroke();ctx.setLineDash([])});houses.forEach(h=>{ctx.fillStyle='rgba(255,255,255,.36)';ctx.beginPath();ctx.roundRect(h.x-13,h.y-13,h.w+26,h.h+26,24);ctx.fill();ctx.fillStyle=h.color;ctx.beginPath();ctx.roundRect(h.x,h.y,h.w,h.h,18);ctx.fill();ctx.fillStyle=h.roofColor;ctx.beginPath();ctx.moveTo(h.x-12,h.y+10);ctx.lineTo(h.x+h.w/2,h.y-64);ctx.lineTo(h.x+h.w+12,h.y+10);ctx.closePath();ctx.fill();ctx.fillStyle=h.owner?'#b990ff':'#ff9ccc';ctx.beginPath();ctx.roundRect(h.x+h.w/2-28,h.y+h.h-72,56,72,16);ctx.fill();ctx.fillStyle='#fff7fe';ctx.beginPath();ctx.roundRect(h.x+22,h.y+42,42,42,10);ctx.roundRect(h.x+h.w-64,h.y+42,42,42,10);ctx.fill();star(h.x+h.w/2,h.y+14,13,'#ffe082');ctx.textAlign='center';ctx.font='900 14px system-ui';if(h.owner){ctx.fillStyle='rgba(91,40,96,.72)';ctx.beginPath();ctx.roundRect(h.x+h.w/2-72,h.y+h.h/2,144,31,12);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`${h.owner}'s Dorm`,h.x+h.w/2,h.y+h.h/2+20)}else{ctx.fillStyle='#8b377e';ctx.fillText('DREAM DORM',h.x+h.w/2,h.y+h.h/2)}});[player,...otherPlayers].sort((a,b)=>a.y-b.y).forEach(e=>drawEntity(e,e===player));particles.forEach(p=>{ctx.globalAlpha=p.life;star(p.x,p.y,7,p.color);ctx.globalAlpha=1});ctx.restore()}
function loop(t){const dt=t-lastTime;lastTime=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('play-btn').addEventListener('click',()=>{const name=document.getElementById('player-name').value.trim()||'Guest';player.name=name;document.getElementById('login-form').classList.add('hidden');document.getElementById('loading-state').classList.remove('hidden');let progress=0;const bar=document.getElementById('loading-bar');const iv=setInterval(()=>{progress+=Math.random()*10;if(progress>100)progress=100;bar.style.width=progress+'%';if(progress===100){clearInterval(iv);setTimeout(startGame,500)}},100)});
function startGame(){if(gameStarted)return;gameStarted=true;AudioSys.init();AudioSys.enable();AudioSys.playSFX('click',0);AudioSys.playBGM();document.getElementById('start-screen').style.display='none';gameRunning=true;resize();initWorld();addChatMessage('','Moonroom opened: keep it cozy, keep it slay.',true);requestAnimationFrame(loop)}
function toggleModal(id){const m=document.getElementById(id);if(m.classList.contains('active')){m.classList.remove('active');AudioSys.playSFX('click')}else{document.querySelectorAll('.modal').forEach(x=>x.classList.remove('active'));m.classList.add('active');AudioSys.playSFX('click')}}document.querySelectorAll('.close-modal').forEach(b=>b.addEventListener('click',e=>e.target.closest('.modal').classList.remove('active')));document.getElementById('roles-btn').addEventListener('click',()=>toggleModal('roles-modal'));document.getElementById('menu-btn').addEventListener('click',()=>toggleModal('roles-modal'));document.getElementById('emotes-btn').addEventListener('click',()=>toggleModal('emotes-modal'));
ROLES.forEach(role=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<div style="width:36px;height:36px;margin:0 auto 7px;border-radius:50%;background:${role.color};box-shadow:inset 0 0 0 5px rgba(255,255,255,.5)"></div><span>${role.name}</span>`;b.onclick=()=>{player.role=role;toggleModal('roles-modal');AudioSys.playSFX('role',120)};document.getElementById('roles-list').appendChild(b)});
EMOTES.forEach(emote=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span style="font-size:28px">${emote.icon}</span><br><span style="font-size:11px">${emote.name}</span>`;b.onclick=()=>{player.emote=emote.id;player.emoteTimer=0;showReaction('emote');toggleModal('emotes-modal');AudioSys.playSFX('emote',120)};document.getElementById('emotes-list').appendChild(b)});
document.getElementById('vehicle-btn').addEventListener('click',()=>{player.vehicle=!player.vehicle;AudioSys.playSFX('vehicle',150);const b=document.getElementById('vehicle-btn');b.style.filter=player.vehicle?'brightness(1.18) saturate(1.3)':'none';b.style.transform=player.vehicle?'scale(1.08)':'scale(1)'});document.getElementById('chat-btn').addEventListener('click',()=>{toggleModal('chat-modal');setTimeout(()=>document.getElementById('chat-input-field').focus(),100)});document.getElementById('close-chat').addEventListener('click',()=>document.getElementById('chat-modal').classList.remove('active'));document.getElementById('send-chat-btn').addEventListener('click',sendChat);document.getElementById('chat-input-field').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});function sendChat(){const input=document.getElementById('chat-input-field'),text=input.value.trim();if(text){addChatMessage(player.name,text);setChatBubble(player,text);input.value='';document.getElementById('chat-modal').classList.remove('active');AudioSys.playSFX('chat',120)}}
const joyZone=document.getElementById('joystick-zone'),joyKnob=document.getElementById('joystick-knob');joyZone.addEventListener('touchstart',e=>{e.preventDefault();const touch=e.changedTouches[0],r=joyZone.getBoundingClientRect();joystick.active=true;joystick.originX=r.left+r.width/2;joystick.originY=r.top+r.height/2;updateJoystick(touch.clientX,touch.clientY)},{passive:false});joyZone.addEventListener('touchmove',e=>{e.preventDefault();if(joystick.active){const t=e.changedTouches[0];updateJoystick(t.clientX,t.clientY)}},{passive:false});function endJoystick(e){e.preventDefault();joystick.active=false;joystick.x=0;joystick.y=0;joyKnob.style.transform='translate(-50%, -50%)'}joyZone.addEventListener('touchend',endJoystick,{passive:false});joyZone.addEventListener('touchcancel',endJoystick,{passive:false});function updateJoystick(cx,cy){const maxDist=50;let dx=cx-joystick.originX,dy=cy-joystick.originY,dist=Math.hypot(dx,dy);if(dist>maxDist){dx=dx/dist*maxDist;dy=dy/dist*maxDist}joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;joystick.x=dx/maxDist;joystick.y=dy/maxDist}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden)AudioSys.pauseBGM();else if(gameRunning)AudioSys.playBGM()});draw();
</script>
