<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nano Vibe Walk</title>
    <!-- [agent-note][stage4] repaired-font-remap: title -> Orbitron, ui -> Rajdhani via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #07111f;
            --bg-mid: #0f1f38;
            --bg-surface: rgba(12, 24, 44, 0.84);
            --panel-border: rgba(119, 230, 255, 0.22);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --text-main: #eff8ff;
            --text-soft: rgba(227, 240, 255, 0.72);
            --text-dim: rgba(214, 228, 255, 0.38);
            --cyan: #77e6ff;
            --cyan-strong: #2ad8ff;
            --pink: #ff6fcf;
            --purple: #8f7cff;
            --lime: #6ff8a4;
            --shadow: rgba(0, 0, 0, 0.34);
            --danger: #ff7b8f;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(37, 195, 255, 0.10), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 111, 207, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            color: var(--text-main);
        }

        body {
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(transparent 49%, rgba(129, 237, 255, 0.045) 50%, transparent 51%);
            background-size: 100% 6px;
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        body::after {
            background:
                radial-gradient(circle at 20% 15%, rgba(119, 230, 255, 0.16), transparent 14%),
                radial-gradient(circle at 78% 22%, rgba(255, 111, 207, 0.12), transparent 18%),
                radial-gradient(circle at 50% 78%, rgba(143, 124, 255, 0.1), transparent 16%);
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        .hidden {
            display: none !important;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(18, 34, 60, 0.92), rgba(7, 16, 31, 0.9));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 34px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 18px rgba(42, 216, 255, 0.08);
        }

        .msg-enter {
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .font-display {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        .font-ui {
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        .screen {
            position: absolute;
            inset: 0;
        }

        .overlay {
            background: rgba(3, 8, 20, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .center-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .start-card {
            position: relative;
            width: min(100%, 280px);
            border-radius: 24px;
            padding: 24px 22px;
            text-align: center;
            overflow: hidden;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(119, 230, 255, 0.18), transparent 38%),
                radial-gradient(circle at bottom, rgba(255, 111, 207, 0.14), transparent 40%);
            pointer-events: none;
        }

        .start-mascot {
            position: relative;
            margin-bottom: 10px;
            font-size: 52px;
            line-height: 1;
            filter: drop-shadow(0 0 16px rgba(119, 230, 255, 0.36));
            animation: mascotBob 1.8s ease-in-out infinite;
        }

        @keyframes mascotBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        .title {
            position: relative;
            margin: 0 0 6px;
            font-size: 31px;
            line-height: 0.95;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(90deg, var(--cyan), #fff7ff 40%, var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 26px rgba(119, 230, 255, 0.2);
        }

        .subtitle {
            position: relative;
            margin: 0 0 18px;
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .intro-copy {
            position: relative;
            margin: 0 0 18px;
            font-size: 14px;
            line-height: 1.4;
            color: rgba(239, 248, 255, 0.9);
        }

        .pulse-row {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--cyan);
            box-shadow: 0 0 10px currentColor;
            animation: pulseDot 1.2s ease-in-out infinite;
        }

        .pulse-dot:nth-child(2) {
            color: var(--pink);
            background: var(--pink);
            animation-delay: 0.15s;
        }

        .pulse-dot:nth-child(3) {
            color: var(--lime);
            background: var(--lime);
            animation-delay: 0.3s;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(0.8); opacity: 0.45; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .primary-btn,
        .icon-btn,
        .emoji-btn,
        .send-btn,
        .action-btn {
            border: 0;
            cursor: pointer;
            color: var(--text-main);
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .primary-btn {
            position: relative;
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1198db, #675dff 52%, #ff53bf);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 14px 28px rgba(17, 152, 219, 0.28);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .primary-btn:hover,
        .icon-btn:hover,
        .emoji-btn:hover,
        .send-btn:hover,
        .action-btn:hover {
            filter: brightness(1.08);
        }

        .primary-btn:active,
        .icon-btn:active,
        .emoji-btn:active,
        .send-btn:active,
        .action-btn:active {
            transform: scale(0.95);
        }

        #hud {
            pointer-events: none;
        }

        .top-bar {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            z-index: 4;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(9, 19, 37, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-led {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: ledPulse 1.2s ease-in-out infinite;
        }

        @keyframes ledPulse {
            0%, 100% { opacity: 0.55; transform: scale(0.94); }
            50% { opacity: 1; transform: scale(1); }
        }

        .status-text {
            font-size: 10px;
            letter-spacing: 0.22em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.82);
            text-transform: uppercase;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 18, 35, 0.78);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
            transition: transform 160ms ease, filter 160ms ease, background 160ms ease;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #chat-box {
            position: absolute;
            width: 208px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 16px;
            pointer-events: auto;
            transition: opacity 0.3s, transform 0.1s;
        }

        .chat-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            cursor: grab;
            background:
                linear-gradient(90deg, rgba(119, 230, 255, 0.1), rgba(255,255,255,0.04), rgba(255, 111, 207, 0.1));
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .chat-handle:active {
            cursor: grabbing;
        }

        .handle-bar {
            width: 34px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(119,230,255,0.38), rgba(255,255,255,0.7), rgba(255,111,207,0.38));
        }

        .nano-text {
            font-size: 10px;
            line-height: 1.4;
        }

        .chat-history {
            height: 112px;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 4px;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.03), transparent 42%),
                rgba(0, 8, 20, 0.34);
            box-shadow: inset 0 0 22px rgba(0,0,0,0.25);
        }

        .history-placeholder {
            padding: 4px 0;
            text-align: center;
            font-size: 9px;
            font-style: italic;
            color: var(--text-dim);
        }

        .emoji-bar {
            display: flex;
            gap: 2px;
            padding: 4px;
            overflow-x: auto;
            border-top: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
        }

        .emoji-btn {
            flex: 0 0 auto;
            min-width: 28px;
            min-height: 28px;
            border-radius: 9px;
            background: transparent;
            font-size: 15px;
            transition: transform 160ms ease, background 160ms ease, filter 160ms ease;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            background: rgba(255,255,255,0.05);
        }

        .nano-input {
            flex: 1;
            min-width: 0;
            height: 28px;
            padding: 0 8px;
            border: 1px solid rgba(119,230,255,0.18);
            border-radius: 9px;
            background: rgba(0, 8, 20, 0.42);
            color: var(--text-main);
            font-size: 11px;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            outline: none;
            box-sizing: border-box;
        }

        .nano-input::placeholder {
            color: rgba(255, 255, 255, 0.22);
        }

        .nano-input:focus {
            border-color: rgba(119,230,255,0.5);
            box-shadow: 0 0 0 2px rgba(42,216,255,0.12);
        }

        .send-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 9px;
            background: linear-gradient(135deg, #0fa7de, #0b82bd);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 160ms ease, filter 160ms ease;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .action-btn {
            position: absolute;
            right: max(24px, env(safe-area-inset-right));
            bottom: max(24px, env(safe-area-inset-bottom));
            width: 54px;
            height: 54px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            font-size: 23px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 28%),
                linear-gradient(135deg, #6a6fff, #ff52bd);
            border: 2px solid rgba(255,255,255,0.14);
            box-shadow:
                0 14px 24px rgba(73, 56, 164, 0.36),
                0 0 16px rgba(255, 111, 207, 0.25);
            transition: transform 160ms ease, filter 160ms ease;
        }

        .action-core {
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.45));
        }

        .action-ring {
            position: absolute;
            inset: -5px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            opacity: 0.7;
            animation: ringPulse 1.8s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(0.92); opacity: 0.32; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .chat-accent {
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--pink));
            opacity: 0.8;
        }

        .sr-only-visual {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .gif-feedback {
            position: absolute;
            right: 18px;
            top: 66px;
            width: min(34vw, 132px);
            padding: 8px;
            border-radius: 18px;
            pointer-events: none;
            z-index: 3;
            background: rgba(5, 12, 25, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .gif-feedback-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: rgba(255, 255, 255, 0.04);
        }

        .gif-feedback-label {
            margin-top: 6px;
            font-size: 10px;
            letter-spacing: 0.14em;
            text-align: center;
            color: var(--text-soft);
            text-transform: uppercase;
        }

        .gif-feedback.show {
            display: block !important;
            animation: gifPop 0.28s ease-out;
        }

        @keyframes gifPop {
            from { opacity: 0; transform: translateY(-6px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 480px) {
            .start-card {
                padding: 22px 18px;
                border-radius: 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 11px;
                margin-bottom: 16px;
            }

            #chat-box {
                width: min(196px, calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
                left: max(12px, env(safe-area-inset-left)) !important;
                bottom: max(72px, calc(env(safe-area-inset-bottom) + 16px)) !important;
            }

            .action-btn {
                right: max(18px, env(safe-area-inset-right));
                bottom: max(18px, calc(env(safe-area-inset-bottom) + 4px));
                width: 50px;
                height: 50px;
            }

            .gif-feedback {
                right: 12px;
                top: 60px;
                width: min(33vw, 116px);
                padding: 6px;
            }

            .gif-feedback-label {
                font-size: 9px;
            }
        }
    </style>
</head>
<body class="no-select">

<script id="game-config" type="application/x-game-config">

}
</script>

<div id="assets" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/chat/burst -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: burst/cheer overlays -> catalogs/gifs.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Lounge BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>

<div id="game-root" class="screen">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen overlay center-wrap">
        <div class="glass start-card font-ui">
            <div class="start-mascot" aria-hidden="true">🪩</div>
            <h1 class="title font-display">NANO<br>WALK</h1>
            <p class="subtitle">Signal Lounge • Big Vibes</p>
            <p class="intro-copy">Guide your emoji star through a neon social plaza and light up the timeline with quick reactions.</p>
            <div class="pulse-row" aria-hidden="true">
                <span class="pulse-dot"></span>
                <span class="pulse-dot"></span>
                <span class="pulse-dot"></span>
            </div>
            <button id="btn-start" class="primary-btn font-ui">Enter World</button>
        </div>
    </div>

    <div id="hud" class="screen hidden">
        <div class="top-bar">
            <div class="glass status-pill">
                <div class="status-led"></div>
                <span class="status-text font-display">ONLINE</span>
            </div>
            <button id="btn-mute" class="glass icon-btn" aria-label="Toggle audio">🔊</button>

        <div id="chat-box" class="glass" style="left: 16px; bottom: 80px;">
            <div class="chat-accent" aria-hidden="true"></div>

            <div id="chat-history" class="chat-history nano-text hide-scrollbar">
                <div class="history-placeholder">Connected to NanoNet lounge...</div>

            <div class="emoji-bar hide-scrollbar">
                <button class="emoji-btn" data-emoji="👋">👋</button>
                <button class="emoji-btn" data-emoji="😂">😂</button>
                <button class="emoji-btn" data-emoji="🔥">🔥</button>
                <button class="emoji-btn" data-emoji="💖">💖</button>
                <button class="emoji-btn" data-emoji="👀">👀</button>
                <button class="emoji-btn" data-emoji="💃">💃</button>
            </div>

            <div class="chat-input-row">
                <input id="chat-input" type="text" placeholder="..." class="nano-input" maxlength="24">
                <button id="btn-send" class="send-btn">OK</button>
            </div>
        </div>

        <button id="btn-action" class="action-btn" aria-label="Vibe burst">
            <span class="action-ring" aria-hidden="true"></span>
            <span class="action-core">✨</span>
        </button>

        <div id="gif-feedback" class="gif-feedback hidden" aria-live="polite">
            <img id="gif-feedback-img" class="gif-feedback-img" alt="Reaction overlay">
            <div id="gif-feedback-label" class="gif-feedback-label font-display"></div>
        </div>
    </div>
</div>

<script>
/**
 * NANO VIBE WALK - Engine
 */

const CONFIG = {
    heroSpeed: 10,
    heroFace: "😎",
    themeColor: '#22d3ee',
    botCount: 30
};

const STATE = {
    active: false,
    lastTime: 0,
    camera: { x: 0, y: 0 },
    drag: { active: false, x: 0, y: 0, el: null },
    muted: false,
    dpr: 1
};

const BOT_FACES = ["🤖", "👽", "👻", "🤡", "🤠", "👺", "😺", "🐶", "🦄", "🐙", "🐸", "🐼", "🦊", "🦁", "🐯", "🐨", "🐷"];
const PARTICLE_EMOJIS = ["✨", "⭐", "💫", "💨", "🎵", "🌸", "🍀"];
const GIF_FEEDBACK = {
    burst: {
        src: "https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp",
        label: "Vibe Burst"
    },
    chat: {
        src: "https://i.giphy.com/34HAaqlL2oCUo.webp",
        label: "Nano Reply"
    }
};

const AudioSys = {
    ctx: null,
    buffers: {},
    bgmEl: null,
    lastPlayedAt: {},
    masterGain: null,
    assetMap: {
        start: 'sfx_start',
        move: 'sfx_move',
        chat: 'sfx_chat',
        burst: 'sfx_burst',
        toggle: 'sfx_toggle',
        pause: 'sfx_pause',
        resume: 'sfx_resume'
    },
    init() {
        this.bgmEl = document.getElementById('bgm_main');
        if (this.bgmEl) {
            this.bgmEl.volume = 0.2;
            this.bgmEl.play().catch(() => console.log("BGM autoplay blocked (waiting for interaction)"));
        }
        Object.entries(this.assetMap).forEach(([key, id]) => {
            const el = document.getElementById(id);
            if (!el?.src) return;
            fetch(el.src)
                .then(r => r.arrayBuffer())
                .then(b => this.buffers[key] = b)
                .catch(() => {});
        });
    },
    unlock() {
        if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new Ctx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.7;
            this.masterGain.connect(this.ctx.destination);
            Object.entries(this.buffers).forEach(([key, data]) => {
                if (data instanceof ArrayBuffer) {
                    this.ctx.decodeAudioData(data.slice(0)).then(decoded => {
                        this.buffers[key] = decoded;
                    }).catch(() => {});
                }
            });
        }
        this.ctx.resume().catch(() => {});
        this.syncBgm();
    },
    syncBgm() {
        if (!this.bgmEl) return;
        if (STATE.muted || !STATE.active) {
            this.bgmEl.pause();
            return;
        }
        this.bgmEl.play().catch(() => {});
    },
    play(key, pitchVar = 0, cooldown = 80) {
        if (!this.ctx || STATE.muted) return;
        const now = performance.now();
        if ((this.lastPlayedAt[key] || 0) + cooldown > now) return;
        this.lastPlayedAt[key] = now;
        const buffer = this.buffers[key];
        if (buffer instanceof AudioBuffer) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = buffer;
            src.playbackRate.value = 1.0 + (Math.random() * pitchVar * 2 - pitchVar);
            gain.gain.value = key === 'burst' ? 0.55 : key === 'move' ? 0.22 : 0.38;
            src.connect(gain);
            gain.connect(this.masterGain || this.ctx.destination);
            src.start(0);
            return;
        }
        this.fallback(key);
    },
    fallback(key) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.masterGain || this.ctx.destination);
        osc.type = key === 'burst' ? 'triangle' : 'sine';
        const base = key === 'burst' ? 260 : key === 'chat' ? 720 : 520;
        osc.frequency.setValueAtTime(base, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(base * 0.5, this.ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.04, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
};

const World = {
    hero: { x: 0, y: 0, tx: 0, ty: 0, face: CONFIG.heroFace, msg: null, msgTime: 0, action: 'IDLE', scale: 1 },
    bots: [],
    particles: [],
    init() {
        this.bots = [];
        for (let i = 0; i < CONFIG.botCount; i++) this.spawnBot();
    },
    spawnBot() {
        const names = ["Bot", "AI", "User", "Guest", "Vibe", "Nano"];
        this.bots.push({
            id: Math.random(),
            x: (Math.random() - 0.5) * 1800,
            y: (Math.random() - 0.5) * 1800,
            tx: (Math.random() - 0.5) * 1800,
            ty: (Math.random() - 0.5) * 1800,
            face: BOT_FACES[Math.floor(Math.random() * BOT_FACES.length)],
            name: names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 99),
            msg: null, msgTime: 0, timer: Math.random() * 3, action: 'IDLE',
            scale: 0.7 + Math.random() * 0.3
        });
    }
};

function startLoop() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const resize = () => {
        STATE.dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * STATE.dpr;
        canvas.height = window.innerHeight * STATE.dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
    };
    window.addEventListener('resize', resize);
    resize();

    const loop = (t) => {
        try {
            const dt = Math.min((t - STATE.lastTime) / 1000, 0.1);
            STATE.lastTime = t;
            if (STATE.active) {
                update(dt);
                draw(ctx, t);
            }
        } catch (e) { console.error(e); }
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
}

function update(dt) {
    const dx = World.hero.tx - World.hero.x;
    const dy = World.hero.ty - World.hero.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
        const s = CONFIG.heroSpeed * 60 * dt;
        World.hero.x += (dx / dist) * Math.min(s, dist);
        World.hero.y += (dy / dist) * Math.min(s, dist);
        World.hero.action = 'WALK';
        if (Math.random() < 0.08) spawnParticle(World.hero.x, World.hero.y + 15, '💨');
    } else {
        World.hero.action = 'IDLE';
    }

    if (World.hero.msgTime > 0) World.hero.msgTime -= dt;
    else World.hero.msg = null;
    World.hero.face = CONFIG.heroFace;

    STATE.camera.x += (World.hero.x - window.innerWidth / 2 - STATE.camera.x) * 5 * dt;
    STATE.camera.y += (World.hero.y - window.innerHeight / 2 - STATE.camera.y) * 5 * dt;

    World.bots.forEach(b => {
        b.timer -= dt;
        if (b.msgTime > 0) b.msgTime -= dt;
        else b.msg = null;

        if (b.timer <= 0) {
            const r = Math.random();
            if (r < 0.6) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 400;
                b.tx = b.x + Math.cos(angle) * distance;
                b.ty = b.y + Math.sin(angle) * distance;
                b.timer = 2 + Math.random() * 6;
            } else if (r < 0.7) {
                const phrases = ["hi", "lol", "yo", "hmm", "👀", "✨", "sup", "nice"];
                b.msg = phrases[Math.floor(Math.random() * phrases.length)];
                b.msgTime = 2.0;
                b.timer = 1.5;
            } else {
                b.timer = 1.0;
            }
        }

        const bdx = b.tx - b.x;
        const bdy = b.ty - b.y;
        const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
        if (bdist > 5) {
            const bs = 5 * 60 * dt;
            b.x += (bdx / bdist) * Math.min(bs, bdist);
            b.y += (bdy / bdist) * Math.min(bs, bdist);
            b.action = 'WALK';
        } else {
            b.action = 'IDLE';
        }
    });

    for (let i = World.particles.length - 1; i >= 0; i--) {
        const p = World.particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.vy += p.grav * dt * 60;
        p.rot += p.vrot * dt;
        if (p.life <= 0) World.particles.splice(i, 1);
    }
}

function draw(ctx, time) {
    ctx.setTransform(STATE.dpr, 0, 0, STATE.dpr, 0, 0);
    const { width, height } = ctx.canvas;
    const cw = width / STATE.dpr;
    const ch = height / STATE.dpr;
    const cx = STATE.camera.x;
    const cy = STATE.camera.y;
    const pulse = (Math.sin(time / 400) + 1) / 2;

    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#0d1c34');
    bgGradient.addColorStop(1, '#050d19');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    const glowA = ctx.createRadialGradient(cw * 0.18, ch * 0.12, 0, cw * 0.18, ch * 0.12, 240);
    glowA.addColorStop(0, 'rgba(42, 216, 255, 0.18)');
    glowA.addColorStop(1, 'rgba(42, 216, 255, 0)');
    ctx.fillStyle = glowA;
    ctx.fillRect(0, 0, cw, ch);

    const glowB = ctx.createRadialGradient(cw * 0.82, ch * 0.2, 0, cw * 0.82, ch * 0.2, 220);
    glowB.addColorStop(0, 'rgba(255, 111, 207, 0.16)');
    glowB.addColorStop(1, 'rgba(255, 111, 207, 0)');
    ctx.fillStyle = glowB;
    ctx.fillRect(0, 0, cw, ch);

    drawParallax(ctx, cx * 0.05, cy * 0.05, 300, 'rgba(255,255,255,0.05)', 1.5);
    drawParallax(ctx, cx * 0.2, cy * 0.2, 180, 'rgba(140,225,255,0.1)', 1);

    ctx.save();
    ctx.translate(-cx, -cy);

    const gs = 120;
    const sx = Math.floor(cx / gs) * gs - gs;
    const sy = Math.floor(cy / gs) * gs - gs;
    ctx.strokeStyle = CONFIG.themeColor;
    ctx.globalAlpha = 0.06;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = sx; x < sx + cw + gs * 2; x += gs) {
        ctx.moveTo(x, sy);
        ctx.lineTo(x, sy + ch + gs * 2);
    }
    for (let y = sy; y < sy + ch + gs * 2; y += gs) {
        ctx.moveTo(sx, y);
        ctx.lineTo(sx + cw + gs * 2, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    for (let x = sx; x < sx + cw + gs * 2; x += gs) {
        for (let y = sy; y < sy + ch + gs * 2; y += gs) {
            ctx.fillStyle = 'rgba(119,230,255,0.04)';
            ctx.beginPath();
            ctx.arc(x, y, 2 + pulse, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (World.hero.action === 'WALK') {
        ctx.strokeStyle = CONFIG.themeColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const r = 8 + Math.sin(time / 80) * 3;
        ctx.arc(World.hero.tx, World.hero.ty, Math.max(0, r), 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.arc(World.hero.tx, World.hero.ty, Math.max(0, r + 6), 0, Math.PI * 2);
        ctx.stroke();
    }

    const all = [...World.bots, World.hero].sort((a, b) => a.y - b.y);

    all.forEach(e => {
        const isHero = e === World.hero;
        const bounce = e.action === 'WALK' ? Math.abs(Math.sin(time / 80)) * 6 : 0;
        const aura = isHero ? 1 : 0.45;

        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.beginPath();
        ctx.ellipse(e.x, e.y, 14 * e.scale, 5 * e.scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.globalAlpha = isHero ? 0.6 : 0.24;
        const ringGradient = ctx.createRadialGradient(e.x, e.y - 24 * e.scale, 2, e.x, e.y - 24 * e.scale, 28 * e.scale);
        ringGradient.addColorStop(0, isHero ? 'rgba(119,230,255,0.9)' : 'rgba(255,111,207,0.45)');
        ringGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = ringGradient;
        ctx.beginPath();
        ctx.arc(e.x, e.y - 22 * e.scale, 30 * e.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (isHero) {
            ctx.strokeStyle = `rgba(119,230,255,${0.25 + pulse * 0.3})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(e.x, e.y - 18 * e.scale, 24 * e.scale + Math.sin(time / 220) * 2, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.font = `${36 * e.scale}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.shadowColor = isHero ? CONFIG.themeColor : 'rgba(255,111,207,0.2)';
        ctx.shadowBlur = isHero ? 16 : 4 * aura;
        ctx.fillText(e.face, e.x, e.y - bounce + 4);
        ctx.shadowBlur = 0;

        ctx.fillStyle = isHero ? '#f8fdff' : '#a8b7d0';
        ctx.font = '700 9px "Orbitron", "Rajdhani", sans-serif';
        ctx.fillText(isHero ? 'YOU' : e.name, e.x, e.y - bounce - 42 * e.scale);

        if (e.msg) {
            ctx.font = '600 11px "Rajdhani", sans-serif';
            const m = ctx.measureText(e.msg);
            const bw = m.width + 16;
            const bh = 22;
            const by = e.y - bounce - 56 * e.scale;

            const bubbleGradient = ctx.createLinearGradient(e.x - bw / 2, by - bh, e.x + bw / 2, by);
            bubbleGradient.addColorStop(0, 'rgba(240,248,255,0.98)');
            bubbleGradient.addColorStop(1, 'rgba(215,236,255,0.98)');
            ctx.fillStyle = bubbleGradient;
            ctx.beginPath();
            ctx.roundRect(e.x - bw / 2, by - bh, bw, bh, 8);
            ctx.fill();

            ctx.strokeStyle = isHero ? 'rgba(42,216,255,0.42)' : 'rgba(143,124,255,0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(e.x - 3, by);
            ctx.lineTo(e.x + 3, by);
            ctx.lineTo(e.x, by + 4);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#081323';
            ctx.fillText(e.msg, e.x, by - 6);
        }
    });

    World.particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.font = `${p.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.char, 0, 0);
        ctx.restore();
    });

    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawParallax(ctx, ox, oy, space, color, r) {
    const w = ctx.canvas.width / STATE.dpr;
    const h = ctx.canvas.height / STATE.dpr;
    ctx.fillStyle = color;
    const offX = -ox % space;
    const offY = -oy % space;
    for (let x = offX - space; x < w + space; x += space) {
        for (let y = offY - space; y < h + space; y += space) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function spawnParticle(x, y, char, count = 1, burst = false) {
    for (let i = 0; i < count; i++) {
        const speed = burst ? 6 : 1.5;
        World.particles.push({
            x, y, char,
            vx: (Math.random() - 0.5) * speed,
            vy: burst ? -4 - Math.random() * 4 : -0.5 - Math.random() * 1.5,
            grav: 0.15,
            life: 0.8 + Math.random() * 0.5,
            size: 10 + Math.random() * 8,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 0.3
        });
    }
}

function showGifFeedback(kind) {
    const overlay = document.getElementById('gif-feedback');
    const img = document.getElementById('gif-feedback-img');
    const label = document.getElementById('gif-feedback-label');
    const gif = GIF_FEEDBACK[kind];
    if (!overlay || !img || !label || !gif) return;
    img.src = gif.src;
    label.textContent = gif.label;
    overlay.classList.remove('hidden');
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    overlay.classList.add('show');
    clearTimeout(showGifFeedback.timer);
    showGifFeedback.timer = setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.classList.remove('show');
    }, 1800);
}

function setupInteraction() {
    const canvas = document.getElementById('gameCanvas');

    document.getElementById('btn-start').addEventListener('click', () => {
        STATE.active = true;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').classList.remove('hidden');
        AudioSys.unlock();
        World.init();
        AudioSys.play('start', 0.05, 250);
        AudioSys.syncBgm();
    });

    const muteBtn = document.getElementById('btn-mute');
    muteBtn.addEventListener('click', () => {
        STATE.muted = !STATE.muted;
        muteBtn.innerText = STATE.muted ? '🔇' : '🔊';
        AudioSys.play(STATE.muted ? 'pause' : 'resume', 0.03, 180);
        AudioSys.syncBgm();
    });

    canvas.addEventListener('pointerdown', e => {
        if (!STATE.active) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) + STATE.camera.x;
        const y = (e.clientY - rect.top) + STATE.camera.y;
        World.hero.tx = x;
        World.hero.ty = y;
        spawnParticle(x, y, '🎯', 1);
        AudioSys.play('move', 0.08, 110);
    });

    const input = document.getElementById('chat-input');
    const send = () => {
        const txt = input.value.trim();
        if (!txt) return;
        World.hero.msg = txt;
        World.hero.msgTime = 3;
        addChatLog('You', txt);
        input.value = '';
        AudioSys.play('chat', 0.04, 140);
        showGifFeedback('chat');

        setTimeout(() => {
            const b = World.bots[Math.floor(Math.random() * World.bots.length)];
            const reacts = ["👍", "😂", "😮", "💯", "👀"];
            b.msg = reacts[Math.floor(Math.random() * reacts.length)];
            b.msgTime = 1.5;
        }, 600);
    };
    document.getElementById('btn-send').addEventListener('click', send);
    input.addEventListener('keydown', e => e.key === 'Enter' && send());

    document.querySelectorAll('.emoji-btn').forEach(b => {
        b.addEventListener('click', () => {
            input.value += b.dataset.emoji;
            input.focus();
        });
    });

    document.getElementById('btn-action').addEventListener('click', () => {
        World.hero.msg = "VIBE CHECK! ✨";
        World.hero.msgTime = 2;
        for (let i = 0; i < 15; i++) {
            const char = PARTICLE_EMOJIS[Math.floor(Math.random() * PARTICLE_EMOJIS.length)];
            spawnParticle(World.hero.x, World.hero.y - 15, char, 1, true);
        }
        AudioSys.play('burst', 0.06, 220);
        showGifFeedback('burst');
    });

    const chatBox = document.getElementById('chat-box');
    const handle = document.getElementById('chat-handle');
    handle.addEventListener('pointerdown', e => {
        STATE.drag.active = true;
        STATE.drag.el = chatBox;
        const r = chatBox.getBoundingClientRect();
        STATE.drag.x = e.clientX - r.left;
        STATE.drag.y = e.clientY - r.top;
        e.preventDefault();
    });

    window.addEventListener('pointermove', e => {
        if (!STATE.drag.active) return;
        const x = e.clientX - STATE.drag.x;
        const y = e.clientY - STATE.drag.y;
        const el = STATE.drag.el;
        el.style.left = Math.max(0, Math.min(x, window.innerWidth - el.offsetWidth)) + 'px';
        el.style.top = Math.max(0, Math.min(y, window.innerHeight - el.offsetHeight)) + 'px';
        el.style.bottom = 'auto';
    });
    const endDrag = () => STATE.drag.active = false;
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
}

function addChatLog(name, txt) {
    const h = document.getElementById('chat-history');
    const div = document.createElement('div');
    div.className = 'msg-enter';
    div.innerHTML = `<span class="font-display" style="color:${CONFIG.themeColor};font-weight:700;">${name}:</span> <span style="color:rgba(255,255,255,0.9)">${txt}</span>`;
    h.appendChild(div);
    h.scrollTop = h.scrollHeight;
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (AudioSys.bgmEl) AudioSys.bgmEl.pause();
    } else {
        AudioSys.syncBgm();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const cfg = JSON.parse(configEl.textContent);
            window.gameConfig = {};
            Object.keys(cfg).forEach(k => window.gameConfig[k] = cfg[k].value);
            Object.assign(CONFIG, window.gameConfig);
        } catch (e) {}
    }

    window.updateGameConfig = (k, v) => {
        CONFIG[k] = v;
        if (k === 'botCount') World.init();
        if (k === 'heroFace') World.hero.face = v;
    };

    AudioSys.init();
    setupInteraction();
    startLoop();
});
