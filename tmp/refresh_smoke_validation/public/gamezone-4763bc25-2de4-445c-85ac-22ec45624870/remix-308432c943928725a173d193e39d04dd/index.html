<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Pursuit: Wanted Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Sharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080914;
            --bg-deep: #04050d;
            --panel: rgba(15, 18, 34, 0.86);
            --panel-strong: rgba(21, 27, 52, 0.94);
            --line: rgba(91, 224, 255, 0.38);
            --line-strong: rgba(253, 74, 167, 0.72);
            --accent: #5be0ff;
            --accent-strong: #92f7ff;
            --hot: #fd4aa7;
            --warn: #ffb84f;
            --danger: #ff5d7a;
            --text: #eef8ff;
            --muted: #9db7d1;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 15%, rgba(91, 224, 255, 0.14), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(253, 74, 167, 0.16), transparent 24%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Exo 2', sans-serif;
            color: var(--text);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(120deg, transparent 0 46%, rgba(91, 224, 255, 0.05) 50%, transparent 54%),
                linear-gradient(60deg, transparent 0 47%, rgba(253, 74, 167, 0.05) 50%, transparent 53%);
            background-size: 18rem 18rem, 24rem 24rem;
            opacity: 0.45;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%, transparent 78%, rgba(91,224,255,0.04));
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(18, 23, 43, 0.95), rgba(10, 13, 29, 0.9)),
                rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 16px 40px rgba(0, 0, 0, 0.4),
                0 0 24px rgba(91, 224, 255, 0.16);
        }

        .neon-text {
            color: var(--text);
            text-shadow: 0 0 8px rgba(91, 224, 255, 0.85), 0 0 22px rgba(253, 74, 167, 0.45);
            font-family: 'Audiowide', sans-serif;
        }

        .hud-text {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 1px;
        }

        .screen-card {
            position: relative;
            overflow: hidden;
            border-radius: 1.2rem;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(91, 224, 255, 0.12), transparent 34%),
                radial-gradient(circle at top right, rgba(253, 74, 167, 0.18), transparent 28%);
            pointer-events: none;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-height: 2rem;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(91, 224, 255, 0.3);
            background: rgba(6, 12, 27, 0.55);
            color: var(--accent-strong);
            font-family: 'Exo 2', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 0 14px rgba(91, 224, 255, 0.12);
        }

        .material-symbols-sharp {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
            font-size: 1.05rem;
            line-height: 1;
        }

        .btn-retro {
            position: relative;
            background: linear-gradient(135deg, var(--hot), #a845ff 50%, var(--accent));
            border: 1px solid rgba(255,255,255,0.18);
            clip-path: polygon(8% 0, 100% 0, 100% 82%, 92% 100%, 0 100%, 0 18%);
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
            text-shadow: 0 1px 0 #000;
            box-shadow:
                0 12px 26px rgba(253, 74, 167, 0.25),
                inset 0 0 0 1px rgba(255,255,255,0.14);
        }

        .btn-retro::after {
            content: "";
            position: absolute;
            inset: 1px;
            clip-path: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 42%);
            pointer-events: none;
        }

        .btn-retro:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }

        #logo-img {
            max-width: 80%;
            max-height: 30vh;
            object-fit: contain;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px rgba(255,0,255,0.5));
        }

        .briefing-text {
            color: var(--muted);
            font-family: 'Exo 2', sans-serif;
            font-size: 0.95rem;
            line-height: 1.4;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.6rem;
            width: 100%;
        }

        .control-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-height: 2.7rem;
            padding: 0.55rem 0.7rem;
            border-radius: 0.95rem;
            background: rgba(8, 14, 30, 0.76);
            border: 1px solid rgba(157, 183, 209, 0.18);
            color: #d9f6ff;
            font-family: 'Exo 2', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
        }

        .control-pill .material-symbols-sharp {
            color: var(--accent);
        }

        .hud-panel {
            border-radius: 1rem;
            border: 1px solid rgba(91, 224, 255, 0.28);
            background: linear-gradient(180deg, rgba(8, 13, 28, 0.92), rgba(10, 17, 36, 0.74));
            box-shadow:
                0 0 18px rgba(91, 224, 255, 0.1),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
        }

        .hud-score-label {
            color: var(--muted);
            font-family: 'Exo 2', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .hud-score-value {
            color: #ffe77c;
            text-shadow: 0 0 10px rgba(255, 231, 124, 0.5);
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(1.15rem, 3.8vw, 1.65rem);
            line-height: 1;
        }

        .alert-readout {
            color: #ff8dad;
            text-shadow: 0 0 10px rgba(255, 93, 122, 0.35);
            font-family: 'Exo 2', sans-serif;
            font-size: clamp(0.78rem, 2.7vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .alert-stars {
            color: #ffd06c;
            letter-spacing: 0.1em;
        }

        .scanline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(91, 224, 255, 0.06), transparent);
            mix-blend-mode: screen;
            animation: scanlineSweep 6s linear infinite;
            opacity: 0.45;
        }

        .feedback-gif {
            position: absolute;
            right: 0.9rem;
            bottom: 0.9rem;
            width: clamp(4.5rem, 16vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(91, 224, 255, 0.28);
            background: rgba(4, 8, 20, 0.7);
            box-shadow: 0 0 18px rgba(91, 224, 255, 0.16);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail-gif {
            left: 50%;
            right: auto;
            top: 1rem;
            bottom: auto;
            transform: translate(-50%, -10px) scale(0.92);
            width: min(72vw, 13rem);
            max-height: 20vh;
        }

        .feedback-gif.fail-gif.is-visible {
            transform: translate(-50%, 0) scale(1);
        }

        @keyframes scanlineSweep {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @media (max-width: 640px) {
            #start-screen,
            #game-over-screen {
                padding: 1rem;
            }

            .neon-text {
                font-size: 2rem !important;
            }

            .briefing-text {
                font-size: 0.82rem;
            }

            .btn-retro {
                font-size: 1rem;
                letter-spacing: 0.14em;
            }

            #hud {
                padding: 0.75rem;
                gap: 0.65rem;
            }

            .hud-panel {
                padding: 0.65rem 0.8rem;
            }

            .controls-grid {
                gap: 0.5rem;
            }

            .control-pill {
                min-height: 2.35rem;
                font-size: 0.72rem;
                padding: 0.45rem 0.55rem;
            }
        }
    </style>
</head>
<body>

    <!-- ASSET DECLARATION -->
    <div id="assets" style="display: none;">
        <!-- User Logo -->
        <img id="asset_logo" data-editable="image" data-label="Game Logo" src="">
        
        <!-- Audio Assets -->
        <!-- BGM: 80s Dance Style -->
        <audio id="bgm_main" data-editable="audio" data-label="BGM Retro Chase Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
        <audio id="sfx_crash" data-editable="audio" data-label="SFX Crash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3" preload="auto"></audio>
        <audio id="sfx_cash" data-editable="audio" data-label="SFX Cash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
        <audio id="sfx_start" data-editable="audio" data-label="SFX Start Run" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
        <audio id="sfx_alert" data-editable="audio" data-label="SFX Threat Alert" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
        <audio id="sfx_ui" data-editable="audio" data-label="SFX UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    </div>

    <!-- CONFIG DECLARATION -->
    <script id="game-config" type="application/x-game-config">
    {
        "playerSpeed": { "type": "number", "label": "Car Speed", "value": 600, "min": 300, "max": 1000 },
        "turnSpeed": { "type": "number", "label": "Turn Speed", "value": 5, "min": 2, "max": 10 },
        "enemySpawnRate": { "type": "number", "label": "Police Spawn Rate (ms)", "value": 2000, "min": 500, "max": 5000 },
        "themeColor": { "type": "color", "label": "Neon Color", "value": "#ff00ff" }
    }
    </script>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- UI LAYER -->
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center">
            
            <!-- START SCREEN -->
            <div id="start-screen" class="glass screen-card pointer-events-auto p-8 flex flex-col items-center justify-center w-11/12 max-w-md">
                <div class="scanline" aria-hidden="true"></div>
                <!-- [agent-note][stage3] resolved-gif: start-screen reaction -> catalogs/gifs.json | keep compact to protect controls -->
                <img id="menu-gif" class="feedback-gif is-visible" src="https://i.giphy.com/Y1AWZiOfbIajeMQmAy.webp" alt="Wanted signal flicker" loading="lazy" decoding="async">
                <div class="status-chip mb-4">
                    <span class="material-symbols-sharp">speed</span>
                    Grid Runner Briefing
                </div>
                <img id="ui-logo" src="" class="hidden">
                <h1 id="ui-title" class="neon-text text-5xl mb-2 tracking-widest hidden">NEON PURSUIT</h1>
                <p class="briefing-text mb-5 text-center">Outrun interceptor units, scoop data cores, and keep the getaway line blazing.</p>
                <div class="controls-grid mb-6">
                    <div class="control-pill">
                        <span class="material-symbols-sharp">arrow_back</span>
                        Tap Left
                    </div>
                    <div class="control-pill">
                        <span class="material-symbols-sharp">arrow_forward</span>
                        Tap Right
                    </div>
                </div>
                <button id="start-btn" class="btn-retro px-12 py-4 w-full">Jack In</button>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="game-over-screen" class="hidden glass screen-card pointer-events-auto p-8 flex flex-col items-center justify-center w-11/12 max-w-md">
                <div class="scanline" aria-hidden="true"></div>
                <!-- [agent-note][stage3] resolved-gif: fail-screen reaction -> catalogs/gifs.json -->
                <img id="fail-gif" class="feedback-gif fail-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Pursuit lost reaction" loading="lazy" decoding="async">
                <div class="status-chip mb-4">
                    <span class="material-symbols-sharp">warning</span>
                    Pursuit Broken
                </div>
                <h2 class="neon-text text-4xl md:text-5xl mb-3 tracking-wider" style="color: #ffb6c7; text-shadow: 0 0 10px rgba(255,93,122,0.55), 0 0 22px rgba(253,74,167,0.28);">INTERCEPTED</h2>
                <div class="text-white text-xl mb-6 text-center">
                    <div class="hud-score-label mb-2">Data Secured</div>
                    <div id="final-score" class="hud-score-value">0</div>
                </div>
                <button id="restart-btn" class="btn-retro px-12 py-4 w-full">Run Again</button>
            </div>

            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 hidden flex justify-between items-start">
                <div class="hud-panel px-4 py-3">
                    <div class="hud-score-label">Core Cache</div>
                    <div class="hud-score-value"><span id="score-display">0</span></div>
                </div>
                <div class="hud-panel px-4 py-3 text-right">
                    <div class="hud-score-label">Threat Scan</div>
                    <div class="alert-readout animate-pulse">Alert Level <span class="alert-stars">★★★★★</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME ENGINE -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- 1. CONFIG SYSTEM ---
        const configScript = document.getElementById('game-config');
        window.gameConfigDefs = JSON.parse(configScript.textContent);
        window.gameConfig = {};
        
        function parseConfig() {
            for (const key in window.gameConfigDefs) {
                window.gameConfig[key] = window.gameConfigDefs[key].value;
            }
        }
        parseConfig();

        window.updateGameConfig = (key, val) => {
            if (window.gameConfigDefs[key]) {
                window.gameConfig[key] = val; // Direct update
                // Specific hot-reload logic
                if (key === 'themeColor') {
                    // Force redraw or update style if needed
                }
            }
        };

        // --- 2. AUDIO SYSTEM ---
        const AudioSys = {
            ctx: null,
            bgmNode: null,
            buffers: {},
            unlocked: false,

            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                this.loadBuffer('sfx_crash', 'explosion');
                this.loadBuffer('sfx_cash', 'pickup');
                this.loadBuffer('sfx_start', 'ui');
                this.loadBuffer('sfx_alert', 'warning');
                this.loadBuffer('sfx_ui', 'ui');

                const unlock = () => {
                    if (!this.ctx || this.unlocked) return;
                    this.ctx.resume().then(() => {
                        this.unlocked = true;
                        this.playBgm();
                    }).catch(() => {});
                    document.removeEventListener('pointerdown', unlock);
                    document.removeEventListener('keydown', unlock);
                };
                document.addEventListener('pointerdown', unlock, { passive: false });
                document.addEventListener('keydown', unlock, { passive: false });
            },

            loadBuffer(id, fallbackType) {
                const el = document.getElementById(id);
                const src = el ? el.getAttribute('src') : '';
                if (!src) {
                    this.buffers[id] = fallbackType;
                    return;
                }
                fetch(src)
                    .then(res => res.arrayBuffer())
                    .then(buf => this.ctx.decodeAudioData(buf))
                    .then(decoded => { this.buffers[id] = decoded; })
                    .catch(() => { this.buffers[id] = fallbackType; }); // Mark as fallback
            },

            playBgm() {
                const el = document.getElementById('bgm_main');
                if (!el) return;
                el.volume = 0.2;
                el.play().catch(() => {});
            },

            stopBgm() {
                const el = document.getElementById('bgm_main');
                if (!el) return;
                el.pause();
                el.currentTime = 0;
            },

            playSfx(id) {
                if (!this.ctx || !this.unlocked) return;
                const buffer = this.buffers[id];

                if (buffer && typeof buffer !== 'string') {
                    const src = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    const volumeMap = {
                        sfx_crash: 0.42,
                        sfx_cash: 0.3,
                        sfx_start: 0.26,
                        sfx_alert: 0.22,
                        sfx_ui: 0.2
                    };
                    gain.gain.value = volumeMap[id] || 0.24;
                    src.buffer = buffer;
                    src.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(0);
                } else {
                    this.synthesize(buffer || 'ui');
                }
            },

            synthesize(type) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if (type === 'explosion') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } else if (type === 'warning') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(700, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } else if (type === 'pickup') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(920, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1380, this.ctx.currentTime + 0.14);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.14);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                }
            }
        };

        // --- 3. GRAPHICS & INPUT ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        let canvasW, canvasH;

        function resize() {
            canvasW = window.innerWidth;
            canvasH = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        const Input = {
            left: false,
            right: false,
            init() {
                const handleStart = (e) => {
                    e.preventDefault();
                    const x = e.clientX - canvas.getBoundingClientRect().left;
                    if (x < canvasW / 2) this.left = true;
                    else this.right = true;
                };
                const handleEnd = (e) => {
                    e.preventDefault();
                    this.left = false;
                    this.right = false;
                };
                
                canvas.addEventListener('pointerdown', handleStart, { passive: false });
                canvas.addEventListener('pointerup', handleEnd, { passive: false });
                canvas.addEventListener('pointercancel', handleEnd, { passive: false });
                // No pointermove needed for tap steering
            }
        };

        // --- 4. GAME ENTITIES ---
        
        // Helper: Check collision between two circles
        function checkCollision(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            return dist < (a.radius + b.radius);
        }

        class Particle {
            constructor(x, y, color, speed, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = speed * (0.5 + Math.random());
                this.life = life;
                this.maxLife = life;
                this.size = 2 + Math.random() * 3;
            }
            update(dt) {
                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;
                this.life -= dt;
                this.size *= 0.95;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class Car {
            constructor(isPlayer = false) {
                this.isPlayer = isPlayer;
                this.x = canvasW / 2;
                this.y = canvasH / 2;
                this.angle = -Math.PI / 2; // Pointing up
                this.speed = 0;
                this.radius = 15;
                this.color = isPlayer ? window.gameConfig.themeColor : '#5be0ff';
                this.dead = false;
                
                // Police lights
                this.lightTimer = 0;
                this.lightState = false;
            }

            update(dt, target) {
                if (this.dead) return;

                if (this.isPlayer) {
                    // Constant forward movement in direction of angle
                    this.speed = window.gameConfig.playerSpeed;
                    
                    // Steering
                    const turnRate = window.gameConfig.turnSpeed * dt;
                    if (Input.left) this.angle -= turnRate;
                    if (Input.right) this.angle += turnRate;

                    // Keep player centered-ish? No, let's move player and camera follows logic.
                    // Actually for this simple arcade, let's keep player in center and move world?
                    // Or simple bounds wrapping?
                    // Let's do: Player moves freely, camera follows (simulated by moving entities opposite)
                    // Wait, simple arcade: Player stays center-ish, world moves.
                    // BUT for drift feel, player needs to slide.
                    
                    // SIMPLIFIED: Player moves in world. Camera centers on player.
                    this.x += Math.cos(this.angle) * this.speed * dt;
                    this.y += Math.sin(this.angle) * this.speed * dt;

                    // Boundaries (Bounce)
                    if (this.x < 0 || this.x > 2000) { this.angle = Math.PI - this.angle; this.x = Math.max(0, Math.min(2000, this.x)); }
                    if (this.y < 0 || this.y > 2000) { this.angle = -this.angle; this.y = Math.max(0, Math.min(2000, this.y)); }

                } else {
                    // Enemy AI: Seek Player
                    if (!target) return;
                    
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const targetAngle = Math.atan2(dy, dx);
                    
                    // Smooth turn
                    let diff = targetAngle - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    
                    this.angle += Math.sign(diff) * Math.min(Math.abs(diff), 3 * dt);
                    
                    this.speed = window.gameConfig.playerSpeed * 0.85; // Slightly slower
                    this.x += Math.cos(this.angle) * this.speed * dt;
                    this.y += Math.sin(this.angle) * this.speed * dt;

                    // Police Lights
                    this.lightTimer += dt;
                    if (this.lightTimer > 0.2) {
                        this.lightTimer = 0;
                        this.lightState = !this.lightState;
                    }
                }
            }

            draw(ctx, camX, camY) {
                if (this.dead) return;
                
                const drawX = this.x - camX + canvasW/2;
                const drawY = this.y - camY + canvasH/2;

                // Offscreen culling
                if (drawX < -50 || drawX > canvasW + 50 || drawY < -50 || drawY > canvasH + 50) return;

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.angle);

                if (this.isPlayer) {
                    // Character-first runner silhouette
                    ctx.shadowBlur = 26;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(0, 18, 10, 18, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -22);
                    ctx.lineTo(18, 8);
                    ctx.lineTo(11, 18);
                    ctx.lineTo(0, 12);
                    ctx.lineTo(-11, 18);
                    ctx.lineTo(-18, 8);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#f7fbff';
                    ctx.beginPath();
                    ctx.moveTo(0, -14);
                    ctx.lineTo(10, 4);
                    ctx.lineTo(0, 1);
                    ctx.lineTo(-10, 4);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#08111f';
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.lineTo(7, 5);
                    ctx.lineTo(0, 3);
                    ctx.lineTo(-7, 5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = '#92f7ff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-8, 10);
                    ctx.lineTo(-14, 20);
                    ctx.moveTo(8, 10);
                    ctx.lineTo(14, 20);
                    ctx.stroke();

                    ctx.fillStyle = '#fd4aa7';
                    ctx.shadowColor = '#fd4aa7';
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    ctx.moveTo(-8, 8);
                    ctx.lineTo(-3, 17);
                    ctx.lineTo(-10, 17);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(8, 8);
                    ctx.lineTo(10, 17);
                    ctx.lineTo(3, 17);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Interceptor unit silhouette
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#5be0ff';
                    ctx.fillStyle = '#091221';
                    ctx.beginPath();
                    ctx.moveTo(0, -19);
                    ctx.lineTo(16, -3);
                    ctx.lineTo(14, 15);
                    ctx.lineTo(0, 20);
                    ctx.lineTo(-14, 15);
                    ctx.lineTo(-16, -3);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = '#182b45';
                    ctx.fillRect(-6, -5, 12, 15);

                    ctx.fillStyle = this.lightState ? '#ff5d7a' : '#5be0ff';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 18;
                    ctx.fillRect(-12, -2, 6, 5);
                    ctx.fillRect(6, -2, 6, 5);

                    ctx.strokeStyle = 'rgba(253,74,167,0.55)';
                    ctx.beginPath();
                    ctx.moveTo(-10, 10);
                    ctx.lineTo(10, 10);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        class Cash {
            constructor() {
                this.x = Math.random() * 2000;
                this.y = Math.random() * 2000;
                this.radius = 15;
                this.active = true;
                this.bobOffset = Math.random() * Math.PI;
            }
            draw(ctx, camX, camY, time) {
                if (!this.active) return;
                const drawX = this.x - camX + canvasW/2;
                const drawY = this.y - camY + canvasH/2;
                
                if (drawX < -50 || drawX > canvasW + 50 || drawY < -50 || drawY > canvasH + 50) return;

                const scale = 1 + Math.sin(time * 5 + this.bobOffset) * 0.2;

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.scale(scale, scale);
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ffe77c';
                ctx.fillStyle = '#091525';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#ffe77c';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffe77c';
                ctx.font = "600 18px 'Exo 2'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("✦", 0, 0);

                ctx.strokeStyle = 'rgba(91,224,255,0.8)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-7, 0);
                ctx.lineTo(7, 0);
                ctx.moveTo(0, -7);
                ctx.lineTo(0, 7);
                ctx.stroke();
                ctx.restore();
            }
        }

        // --- 5. GAME STATE ---
        const Game = {
            state: 'MENU', // MENU, PLAYING, GAMEOVER
            lastTime: 0,
            player: null,
            enemies: [],
            particles: [],
            cashItems: [],
            score: 0,
            enemyTimer: 0,
            shake: 0,
            camX: 1000,
            camY: 1000,

            start() {
                this.state = 'PLAYING';
                this.player = new Car(true);
                this.player.x = 1000;
                this.player.y = 1000;
                this.enemies = [];
                this.particles = [];
                this.cashItems = [];
                this.score = 0;
                this.enemyTimer = 0;
                this.shake = 0;

                AudioSys.init();
                AudioSys.playSfx('sfx_start');
                AudioSys.playBgm();

                // Spawn initial cash
                for(let i=0; i<10; i++) this.cashItems.push(new Cash());

                // UI
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('score-display').innerText = '0';
                
            },

            over() {
                this.state = 'GAMEOVER';
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = this.score;
                AudioSys.playSfx('sfx_alert');
                AudioSys.playSfx('sfx_crash');
                AudioSys.stopBgm();
                document.getElementById('fail-gif').classList.add('is-visible');
            },

            spawnEnemy() {
                const enemy = new Car(false);
                // Spawn away from player
                const angle = Math.random() * Math.PI * 2;
                const dist = 600; // Outside immediate view
                enemy.x = this.player.x + Math.cos(angle) * dist;
                enemy.y = this.player.y + Math.sin(angle) * dist;
                // Clamp to world
                enemy.x = Math.max(0, Math.min(2000, enemy.x));
                enemy.y = Math.max(0, Math.min(2000, enemy.y));
                this.enemies.push(enemy);
            },

            spawnParticles(x, y, color, count) {
                for(let i=0; i<count; i++) {
                    this.particles.push(new Particle(x, y, color, 200, 0.5));
                }
            },

            update(time) {
                const dt = Math.min((time - this.lastTime) / 1000, 0.1);
                this.lastTime = time;

                if (this.state !== 'PLAYING') return;

                // Camera follow player with smoothing
                this.camX += (this.player.x - this.camX) * 5 * dt;
                this.camY += (this.player.y - this.camY) * 5 * dt;

                // Screen shake decay
                if (this.shake > 0) this.shake = Math.max(0, this.shake - 10 * dt);

                // Player Update
                this.player.update(dt);

                // Enemies Update & Logic
                this.enemyTimer += dt * 1000;
                    if (this.enemyTimer > window.gameConfig.enemySpawnRate) {
                        this.spawnEnemy();
                        this.enemyTimer = 0;
                        if (this.enemies.length <= 2) AudioSys.playSfx('sfx_alert');
                    }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    e.update(dt, this.player);

                    // Collision with Player
                    if (checkCollision(this.player, e)) {
                        this.spawnParticles(this.player.x, this.player.y, '#ff0000', 20);
                        this.over();
                    }

                    // Collision with other enemies (Juice!)
                    for (let j = i - 1; j >= 0; j--) {
                        const other = this.enemies[j];
                        if (checkCollision(e, other)) {
                            // Crash them!
                            this.spawnParticles((e.x+other.x)/2, (e.y+other.y)/2, '#ffaa00', 15);
                            AudioSys.playSfx('sfx_crash');
                            this.enemies.splice(i, 1);
                            this.enemies.splice(j, 1);
                            this.shake = 10;
                            this.score += 50; // Bonus for making them crash
                            document.getElementById('score-display').innerText = this.score;
                            i -= 2; // Adjusted index
                            break;
                        }
                    }
                }

                // Cash Update
                for (let i = this.cashItems.length - 1; i >= 0; i--) {
                    const c = this.cashItems[i];
                    if (checkCollision(this.player, c)) {
                        this.score += 100;
                        document.getElementById('score-display').innerText = this.score;
                        AudioSys.playSfx('sfx_cash');
                        this.cashItems.splice(i, 1);
                        this.cashItems.push(new Cash()); // Respawn elsewhere
                    }
                }

                // Particles Update
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update(dt);
                    if (this.particles[i].life <= 0) this.particles.splice(i, 1);
                }
            },

            draw() {
                // Clear
                ctx.fillStyle = '#070b16';
                ctx.fillRect(0, 0, canvasW, canvasH);

                // Shake offset
                let sx = (Math.random() - 0.5) * this.shake;
                let sy = (Math.random() - 0.5) * this.shake;

                ctx.save();
                ctx.translate(sx, sy);

                // Grid Floor (Parallax-ish)
                this.drawGrid(this.camX, this.camY);

                // Draw Items
                const time = performance.now() / 1000;
                this.cashItems.forEach(c => c.draw(ctx, this.camX, this.camY, time));

                // Draw Particles (Bottom layer - skid marks could go here, but explosions on top)
                // Let's draw explosions on top.

                // Draw Enemies
                this.enemies.forEach(e => e.draw(ctx, this.camX, this.camY));

                // Draw Player
                if (this.state === 'PLAYING') this.player.draw(ctx, this.camX, this.camY);

                // Draw Particles (Top)
                this.particles.forEach(p => p.draw(ctx));

                ctx.restore();
            },

            drawGrid(cx, cy) {
                const gridSize = 100;
                const offsetX = -cx % gridSize;
                const offsetY = -cy % gridSize;

                const horizon = canvasH * 0.16;
                const sky = ctx.createLinearGradient(0, 0, 0, canvasH);
                sky.addColorStop(0, '#0d1324');
                sky.addColorStop(0.45, '#08101d');
                sky.addColorStop(1, '#04060e');
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, canvasW, canvasH);

                ctx.fillStyle = 'rgba(253, 74, 167, 0.10)';
                ctx.beginPath();
                ctx.moveTo(canvasW * 0.08, horizon);
                ctx.lineTo(canvasW * 0.21, horizon - 44);
                ctx.lineTo(canvasW * 0.34, horizon);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(91, 224, 255, 0.08)';
                ctx.beginPath();
                ctx.moveTo(canvasW * 0.62, horizon);
                ctx.lineTo(canvasW * 0.74, horizon - 60);
                ctx.lineTo(canvasW * 0.9, horizon);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(91, 224, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();

                // Verticals
                for (let x = offsetX; x < canvasW; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasH);
                }
                // Horizontals
                for (let y = offsetY; y < canvasH; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasW, y);
                }
                ctx.stroke();

                const vignette = ctx.createRadialGradient(canvasW / 2, canvasH / 2, canvasW * 0.15, canvasW / 2, canvasH / 2, canvasW * 0.72);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, 'rgba(0,0,0,0.36)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, canvasW, canvasH);

                // World Borders (if visible)
                const left = -cx + canvasW/2;
                const top = -cy + canvasH/2;
                const right = 2000 - cx + canvasW/2;
                const bottom = 2000 - cy + canvasH/2;

                ctx.strokeStyle = '#fd4aa7';
                ctx.lineWidth = 5;
                ctx.shadowColor = 'rgba(253,74,167,0.45)';
                ctx.shadowBlur = 12;
                ctx.strokeRect(left, top, 2000, 2000);
                ctx.shadowBlur = 0;
            }
        };

        // --- 6. INITIALIZATION & LOOP ---
        
        // Setup UI Logos
        const logoAsset = document.getElementById('asset_logo');
        const uiLogo = document.getElementById('ui-logo');
        const uiTitle = document.getElementById('ui-title');
        const menuGif = document.getElementById('menu-gif');
        const failGif = document.getElementById('fail-gif');
        
        const logoSrc = logoAsset ? logoAsset.getAttribute('src') : '';
        if (logoSrc) {
            uiLogo.src = logoSrc;
            uiLogo.classList.remove('hidden');
        } else {
            uiTitle.classList.remove('hidden');
        }

        // Bind Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            AudioSys.init();
            AudioSys.playSfx('sfx_ui');
            if (menuGif) menuGif.classList.remove('is-visible');
            if (failGif) failGif.classList.remove('is-visible');
            Game.start();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            AudioSys.init();
            AudioSys.playSfx('sfx_ui');
            if (failGif) failGif.classList.remove('is-visible');
            Game.start();
        });

        Input.init();

        function loop(time) {
            try {
                Game.update(time);
                Game.draw();
            } catch (e) {
                console.error(e);
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

    });
    </script>
