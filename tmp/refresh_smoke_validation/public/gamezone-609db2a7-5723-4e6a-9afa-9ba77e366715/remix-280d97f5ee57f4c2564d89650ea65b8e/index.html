<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Blade Reflex: Dojo Defender</title>
    <!-- [agent-note][stage4] preserve: catalog-fonts | title -> Audiowide | ui/body -> Rajdhani | score accent -> Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg-top: #140f24;
            --bg-bottom: #241640;
            --panel-bg: rgba(18, 13, 34, 0.82);
            --panel-border: rgba(152, 225, 255, 0.18);
            --title-glow: rgba(76, 201, 240, 0.45);
            --text-main: #f8fbff;
            --text-soft: rgba(239, 246, 255, 0.76);
            --text-faint: rgba(214, 228, 255, 0.36);
            --cyan: #69e2ff;
            --cyan-deep: #0ea5c6;
            --blue: #7c3aed;
            --blue-deep: #4c1d95;
            --red: #fb7185;
            --yellow: #facc15;
            --gray-900: #111827;
            --gray-200: #e5e7eb;
            --blade-glow: rgba(105, 226, 255, 0.55);
            --lane-glow: rgba(124, 58, 237, 0.18);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(105, 226, 255, 0.12), transparent 32%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            background-color: var(--bg-top);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            border: 0;
            cursor: pointer;
            font: inherit;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(33, 19, 60, 0.96), rgba(12, 16, 35, 0.92));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
            border-radius: 24px;
            text-align: center;
            padding: 40px;
            width: min(92vw, 460px);
        }

        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% -10%, rgba(105, 226, 255, 0.22), transparent 34%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.06), transparent 46%);
            pointer-events: none;
        }

        .panel--start {
            border-top: 4px solid var(--cyan);
        }

        .panel--gameover {
            border-top: 4px solid var(--red);
        }

        .title {
            margin: 0 0 8px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.6rem, 8vw, 4.4rem);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px var(--title-glow);
        }

        .subtitle {
            margin: 0 0 28px;
            color: #c7d2fe;
            font-size: clamp(1.1rem, 3vw, 1.45rem);
            font-weight: 600;
        }

        .instructions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 28px;
            color: var(--text-soft);
            font-size: 1rem;
            line-height: 1.2;
        }

        .instructions p {
            margin: 0;
        }

        .instructions strong {
            color: var(--text-main);
        }

        .primary-btn,
        .secondary-btn {
            position: relative;
            border-radius: 999px;
            padding: 14px 28px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, filter 180ms ease;
        }

        .primary-btn {
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            color: var(--text-main);
            box-shadow: 0 10px 24px rgba(8, 145, 178, 0.25);
        }

        .secondary-btn {
            background: linear-gradient(90deg, #f8fafc, #dbeafe);
            color: var(--gray-900);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-1px) scale(1.01);
            filter: brightness(1.04);
        }

        .secondary-btn:hover {
            background: var(--gray-200);
        }

        .hidden {
            display: none !important;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(96px, 22vw, 160px);
            height: clamp(96px, 22vw, 160px);
            object-fit: cover;
            border-radius: 22px;
            border: 1px solid rgba(105, 226, 255, 0.32);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 220ms ease;
            will-change: transform, opacity;
        }

        .feedback-gif--hit {
            left: 20px;
            bottom: 96px;
        }

        .feedback-gif--fail {
            right: 20px;
            top: 88px;
        }

        .feedback-gif.is-active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .hit-streak {
            position: absolute;
            left: 50%;
            top: 86px;
            transform: translateX(-50%) translateY(-8px);
            min-width: 148px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(8, 12, 24, 0.74);
            border: 1px solid rgba(105, 226, 255, 0.22);
            color: var(--yellow);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.8rem, 3vw, 1rem);
            font-weight: 800;
            letter-spacing: 0.12em;
            text-align: center;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 160ms ease, transform 200ms ease;
        }

        .hit-streak.is-active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .game-over-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--red);
            text-transform: uppercase;
        }

        .game-over-copy {
            margin: 0 0 24px;
            color: var(--text-soft);
            font-size: 1.1rem;
        }

        .final-score {
            margin: 0 0 28px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1rem, 4vw, 1.4rem);
            line-height: 1.7;
            color: var(--text-main);
        }

        .final-score span {
            color: var(--yellow);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 24px;
            pointer-events: none;
        }

        .hud-score,
        .hud-wave {
            padding: 10px 14px;
            border: 1px solid rgba(105, 226, 255, 0.16);
            border-radius: 16px;
            background: rgba(10, 13, 31, 0.44);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .hud-score {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            line-height: 1.6;
            text-transform: uppercase;
        }

        .hud-score span {
            color: var(--cyan);
        }

        .hud-wave {
            color: rgba(255, 255, 255, 0.72);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        #tutorial-hint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20px;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            color: var(--text-faint);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(1.1rem, 5vw, 1.8rem);
            letter-spacing: 0.08em;
            pointer-events: none;
        }

        @media (max-width: 640px) {
            .panel {
                padding: 28px 22px;
                border-radius: 20px;
            }

            #hud {
                top: 16px;
                padding: 0 16px;
            }

            .hud-score,
            .hud-wave {
                padding: 8px 10px;
                border-radius: 14px;
            }

            #tutorial-hint {
                bottom: 16px;
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="feedback-layer" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: hit-reaction + fail-reaction from catalogs/gifs.json -->
            <img id="hit-gif" class="feedback-gif feedback-gif--hit" src="https://i.giphy.com/SY41GHA1ArmVMSlu5G.webp" alt="">
            <img id="fail-gif" class="feedback-gif feedback-gif--fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="">
            <div id="hit-streak" class="hit-streak">Clean Slash!</div>
        </div>

        <div id="ui-layer">
            <div id="start-screen" class="panel panel--start">
                <h1 class="title">Blade Reflex</h1>
                <p class="subtitle">Guard the neon dojo gate from a two-sided rush.</p>
                <div class="instructions">
                    <p>⚔️ Tap <strong>LEFT</strong> to cut the left lane.</p>
                    <p>⚔️ Tap <strong>RIGHT</strong> to cut the right lane.</p>
                </div>
                <button id="start-btn" class="primary-btn">Begin Guard</button>
            </div>

            <div id="game-over-screen" class="hidden panel panel--gameover">
                <h2 class="game-over-title">Gate Breached</h2>
                <p class="game-over-copy">One raider slipped through your guard.</p>
                <div class="final-score">Score: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="secondary-btn">Guard Again</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-score">Score: <span id="score">0</span></div>
                <div class="hud-wave">Wave <span id="wave-display">1</span></div>
            </div>

            <div id="tutorial-hint" class="hidden">
                <span>Tap Left</span>
                <span>Tap Right</span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3",
                slash: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                wave: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            images: {
                player: "https://gamezone-virid.vercel.app/assets/images/sprites/tower/tower_basic.png",
                enemy: "https://gamezone-virid.vercel.app/assets/images/sprites/tower/enemy_walker.png"
            }
        };

        const images = {};
        let imagesLoaded = 0;
        const totalImages = Object.keys(ASSETS.images).length;

        function preloadImages() {
            for (const [key, url] of Object.entries(ASSETS.images)) {
                const img = new Image();
                img.src = url;
                img.onload = () => imagesLoaded++;
                images[key] = img;
            }
        }
        preloadImages();

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.poolSize = 3;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
            }

            prime() {
                if (this.ready) return;
                this.ready = true;
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = Array.from({ length: this.poolSize }, () => {
                        const audio = new Audio(url);
                        audio.preload = 'auto';
                        audio.volume = key === 'fail' ? 0.7 : 0.5;
                        return audio;
                    });
                }
                this.bgm.load();
            }

            playBGM() {
                this.prime();
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { debounce = 80 } = {}) {
                this.prime();
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounce) return;
                this.lastPlayedAt[key] = now;

                const pool = this.sfx[key];
                if (!pool) return;
                const audio = pool.find((item) => item.paused || item.ended) || pool[0];
                try {
                    audio.currentTime = 0;
                } catch (_) {}
                audio.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const hitGif = document.getElementById('hit-gif');
        const failGif = document.getElementById('fail-gif');
        const hitStreak = document.getElementById('hit-streak');
        let feedbackTimers = {};
        let streakCount = 0;

        function showFeedback(element, duration = 720) {
            if (!element) return;
            element.classList.add('is-active');
            clearTimeout(feedbackTimers[element.id]);
            feedbackTimers[element.id] = setTimeout(() => {
                element.classList.remove('is-active');
            }, duration);
        }

        function updateStreakLabel() {
            if (!hitStreak) return;
            hitStreak.textContent = streakCount >= 3 ? `Combo x${streakCount}` : 'Clean Slash!';
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let wave = 1;
        let spawnRate = 100;
        let frameCount = 0;

        let player = { x: 0, y: 0, radius: 40, angle: 0 };
        let enemies = [];
        let particles = [];
        let slashEffects = [];
        let bgParticles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.x = width / 2;
            player.y = height - 150;
            initBgParticles();
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & VISUALS */
        function initBgParticles() {
            bgParticles = [];
            for (let i = 0; i < 30; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    speedY: Math.random() * 0.5 + 0.2,
                    opacity: Math.random() * 0.5
                });
            }
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#140f24');
            grad.addColorStop(0.58, '#22163a');
            grad.addColorStop(1, '#0f1327');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const shrineGlow = ctx.createRadialGradient(width * 0.5, player.y - 140, 20, width * 0.5, player.y - 140, width * 0.55);
            shrineGlow.addColorStop(0, 'rgba(105, 226, 255, 0.24)');
            shrineGlow.addColorStop(1, 'rgba(105, 226, 255, 0)');
            ctx.fillStyle = shrineGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#090c1d';
            ctx.fillRect(0, player.y + 36, width, height - (player.y + 36));

            ctx.strokeStyle = '#4cc9f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, player.y + 36);
            ctx.lineTo(width, player.y + 36);
            ctx.stroke();

            ctx.save();
            ctx.strokeStyle = 'rgba(124, 58, 237, 0.28)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 7; i++) {
                const offset = (i + 1) * (width / 8);
                ctx.beginPath();
                ctx.moveTo(offset, player.y + 36);
                ctx.lineTo(offset * 0.75, 0);
                ctx.stroke();
            }
            ctx.restore();

            ctx.fillStyle = 'white';
            bgParticles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;

                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        /** 5. GAME LOGIC */
        class Enemy {
            constructor() {
                this.side = Math.random() > 0.5 ? -1 : 1;
                this.y = player.y;
                this.x = this.side === -1 ? -50 : width + 50;
                this.speed = (Math.random() * 2 + 2) + (wave * 0.5);
                this.radius = 30;
                this.dead = false;
                this.bounceOffset = 0;
                this.bounceSpeed = 0.2;
                this.tint = this.side === -1 ? '#fb7185' : '#f59e0b';
            }

            update() {
                if (this.side === -1) {
                    this.x += this.speed;
                } else {
                    this.x -= this.speed;
                }

                this.bounceOffset = Math.sin(Date.now() * 0.01) * 10;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.bounceOffset);

                if (this.side === 1) ctx.scale(-1, 1);

                ctx.shadowColor = this.tint;
                ctx.shadowBlur = 16;

                if (images.enemy && images.enemy.complete) {
                    ctx.drawImage(images.enemy, -34, -68, 68, 68);
                    ctx.fillStyle = this.tint;
                    ctx.globalAlpha = 0.18;
                    ctx.fillRect(-34, -68, 68, 68);
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = this.tint;
                    ctx.beginPath();
                    ctx.moveTo(0, -42);
                    ctx.lineTo(30, -4);
                    ctx.lineTo(18, 26);
                    ctx.lineTo(-18, 26);
                    ctx.lineTo(-30, -4);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30,
                    color: color
                });
            }
        }

        function initGame() {
            score = 0;
            wave = 1;
            enemies = [];
            particles = [];
            slashEffects = [];
            frameCount = 0;
            spawnRate = 100;
            document.getElementById('score').innerText = score;
            document.getElementById('wave-display').innerText = wave;

            const hint = document.getElementById('tutorial-hint');
            hint.classList.remove('hidden');
            setTimeout(() => hint.classList.add('hidden'), 3000);
        }

        function handleInput(x) {
            if (!gameActive) return;

            const isLeft = x < width / 2;
            const side = isLeft ? -1 : 1;

            slashEffects.push({
                side: isLeft ? 'left' : 'right',
                life: 10,
                alpha: 1.0
            });
            audio.playSFX('slash', { debounce: 50 });

            let hit = false;
            const attackRange = 220;

            enemies.forEach(e => {
                if (e.dead) return;

                const dist = Math.abs(e.x - player.x);

                if (e.side === side && dist < attackRange) {
                    e.dead = true;
                    hit = true;
                    score += 10;
                    spawnParticles(e.x, e.y - 30, '#fca5a5');
                    audio.playSFX('hit');
                    streakCount++;
                    updateStreakLabel();
                    showFeedback(hitGif, 520);
                    showFeedback(hitStreak, 460);
                }
            });

            if (hit) {
                document.getElementById('score').innerText = score;
                if (score % 100 === 0) {
                    wave++;
                    spawnRate = Math.max(30, spawnRate - 10);
                    document.getElementById('wave-display').innerText = wave;
                    audio.playSFX('wave', { debounce: 150 });
                    showFeedback(hitStreak, 700);
                }
            } else {
                streakCount = 0;
                updateStreakLabel();
                audio.playSFX('blocked', { debounce: 120 });
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            frameCount++;
            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }

            enemies.forEach(e => e.update());

            for (const e of enemies) {
                if (!e.dead && Math.abs(e.x - player.x) < 40) {
                    gameOver();
                    return;
                }
            }

            enemies = enemies.filter(e => !e.dead);

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowColor = 'rgba(105, 226, 255, 0.85)';
            ctx.shadowBlur = 24;
            if (images.player && images.player.complete) {
                ctx.drawImage(images.player, -48, -92, 96, 96);
                ctx.fillStyle = 'rgba(105, 226, 255, 0.18)';
                ctx.beginPath();
                ctx.arc(0, -48, 38, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#4cc9f0';
                ctx.beginPath();
                ctx.arc(0, -30, 30, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            enemies.forEach(e => e.draw());

            slashEffects.forEach(s => {
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.strokeStyle = '#4cc9f0';
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'rgba(76, 201, 240, 0.85)';
                ctx.shadowBlur = 18;

                ctx.beginPath();
                if (s.side === 'left') {
                    ctx.moveTo(player.x - 20, player.y - 80);
                    ctx.quadraticCurveTo(player.x - 150, player.y - 100, player.x - 180, player.y + 20);
                } else {
                    ctx.moveTo(player.x + 20, player.y - 80);
                    ctx.quadraticCurveTo(player.x + 150, player.y - 100, player.x + 180, player.y + 20);
                }
                ctx.stroke();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();

                s.life--;
                s.alpha -= 0.1;
            });
            slashEffects = slashEffects.filter(s => s.life > 0);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            particles = particles.filter(p => p.life > 0);

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { debounce: 200 });
            showFeedback(failGif, 1400);
            streakCount = 0;
            updateStreakLabel();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('tutorial-hint').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleInput(e.changedTouches[i].clientX);
            }
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.prime();
            audio.playSFX('start', { debounce: 200 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playSFX('start', { debounce: 200 });
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
