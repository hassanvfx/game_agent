<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbital Relay Rush</title>
    <!-- [agent-note][stage3] resolved-font: display/ui -> catalogs/fonts.json (Orbitron + Exo 2) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #050014;
            --bg-deep: #09011f;
            --panel: rgba(10, 7, 34, 0.76);
            --panel-border: rgba(109, 244, 255, 0.4);
            --accent: #39FF14;
            --accent-soft: #6df4ff;
            --accent-warm: #ffe978;
            --danger: #FF0055;
            --danger-soft: #ff6b8d;
            --text: #ffffff;
            --muted: #b6becf;
            --panel-shadow: 0 0 26px rgba(109, 244, 255, 0.14);
            --font-display: 'Orbitron', system-ui, sans-serif;
            --font-ui: 'Exo 2', system-ui, sans-serif;
            --font-accent: 'Orbitron', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 18%, rgba(109, 244, 255, 0.18), transparent 20rem),
                radial-gradient(circle at 82% 22%, rgba(57, 255, 20, 0.14), transparent 18rem),
                linear-gradient(180deg, #070019 0%, #050014 50%, #02000c 100%);
            font-family: var(--font-ui);
            color: var(--text);
        }

        body {
            touch-action: manipulation;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 42px, 42px 100%;
            opacity: 0.22;
        }

        body::after {
            background:
                radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.42) 100%);
            mix-blend-mode: multiply;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font-family: var(--font-display);
            font-size: inherit;
            line-height: inherit;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 50% 78%, rgba(57, 255, 20, 0.08), transparent 16rem),
                radial-gradient(circle at 48% 75%, rgba(109, 244, 255, 0.12), transparent 10rem);
            opacity: 0.95;
        }

        #game-container::after {
            inset: 8% 10%;
            border: 1px solid rgba(109, 244, 255, 0.08);
            border-radius: 28px;
            box-shadow: inset 0 0 80px rgba(109, 244, 255, 0.03);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(18, 14, 47, 0.92), rgba(7, 5, 25, 0.88));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 1.85rem;
            text-align: center;
            pointer-events: auto;
            width: min(90vw, 420px);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(109, 244, 255, 0.12), transparent 40%),
                linear-gradient(315deg, rgba(255, 233, 120, 0.08), transparent 42%);
            pointer-events: none;
        }

        .panel--start {
            transform: scale(1);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .panel--start:hover {
            transform: scale(1.02);
            box-shadow: 0 0 34px rgba(109, 244, 255, 0.2);
        }

        .title,
        #game-over-screen h2,
        .score-line,
        #hud .hud-label,
        .button {
            position: relative;
            z-index: 1;
        }

        .title {
            margin: 0 0 0.55rem;
            font-family: var(--font-display);
            font-size: clamp(2.4rem, 8vw, 3.75rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            color: var(--accent-soft);
            text-shadow:
                0 0 10px rgba(109, 244, 255, 0.7),
                0 0 24px rgba(57, 255, 20, 0.28);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            padding: 0.9rem 1.3rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            cursor: pointer;
            font-size: clamp(1rem, 3vw, 1.2rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button--start {
            background: linear-gradient(180deg, var(--accent-soft), #42cbe3);
            color: #041018;
            box-shadow: 0 0 16px rgba(109, 244, 255, 0.45);
        }

        .button--restart {
            background: linear-gradient(180deg, var(--danger-soft), var(--danger));
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.45);
        }

        .button--restart:hover {
            background: linear-gradient(180deg, #ffffff, #ffd9e3);
            color: var(--danger);
        }

        .hidden {
            display: none !important;
        }

        #game-over-screen h2 {
            margin: 0 0 1rem;
            font-family: var(--font-display);
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 400;
            color: var(--danger-soft);
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.7);
        }

        .score-line {
            margin-bottom: 0.55rem;
            font-family: var(--font-display);
            font-size: clamp(1.15rem, 4vw, 1.7rem);
            color: #f6fbff;
        }

        .score-value {
            color: var(--accent-warm);
        }

        .best-line {
            position: relative;
            z-index: 1;
            margin-bottom: 1.4rem;
            color: var(--muted);
            font-size: clamp(1rem, 3vw, 1.15rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            pointer-events: none;
        }

        #hud .hud-label {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(10, 7, 34, 0.72);
            border: 1px solid rgba(109, 244, 255, 0.26);
            box-shadow: 0 0 18px rgba(109, 244, 255, 0.12);
            font-family: var(--font-display);
            font-size: clamp(0.9rem, 3.5vw, 1.25rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        #hud .hud-label::before {
            content: "◉";
            color: var(--accent-warm);
            text-shadow: 0 0 8px rgba(255, 233, 120, 0.8);
        }

        #score {
            color: var(--accent-soft);
        }

        .feedback-gif {
            position: absolute;
            right: max(12px, env(safe-area-inset-right));
            width: clamp(88px, 22vw, 132px);
            border-radius: 18px;
            border: 1px solid rgba(109, 244, 255, 0.28);
            background: rgba(4, 5, 18, 0.72);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 45;
            object-fit: cover;
        }

        .feedback-gif--collect {
            top: max(76px, calc(env(safe-area-inset-top) + 64px));
        }

        .feedback-gif--crash {
            bottom: max(18px, calc(env(safe-area-inset-bottom) + 18px));
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        @media (max-width: 640px) {
            .panel {
                padding: 1.35rem 1.1rem;
                width: min(92vw, 360px);
                border-radius: 20px;
            }

            .button {
                min-width: 0;
                width: 100%;
            }

            .subtitle {
                line-height: 1.25;
            }

            #hud .hud-label {
                padding: 0.35rem 0.68rem;
            }
        }
    </style>
</head>

<!-- [agent-note][stage3] resolved-audio: loop/ui/collect/crash -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM: Space Sprint Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="SFX: Collect Core" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_crash" data-editable="audio" data-label="SFX: Relay Crash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="SFX: Launch Button" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="SFX: UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: collect/crash feedback -> catalogs/gifs.json -->
    <img id="collect-gif" class="feedback-gif feedback-gif--collect" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp" alt="Collect streak reaction" loading="lazy" decoding="async">
    <img id="crash-gif" class="feedback-gif feedback-gif--crash" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash reaction" loading="lazy" decoding="async">
    <div id="ui-layer">
        <div id="start-screen" class="panel panel--start">
            <h1 id="ui-title" class="title">ORBITAL RELAY RUSH</h1>
            <p class="subtitle">Drag to steer the courier drone • dodge scrap • collect signal cores</p>
            <button id="start-btn" class="button button--start">Begin Delivery Run</button>
        </div>

        <div id="game-over-screen" class="hidden panel">
            <h2>RELAY LOST</h2>
            <div class="score-line">CORES SAVED: <span id="finalScore" class="score-value">0</span></div>
            <div class="best-line">BEST RUN: <span id="bestScore">0</span></div>
            <button id="restart-btn" class="button button--restart">Launch Again</button>

        <div id="hud" class="hidden">
            <div class="hud-label">CORES: <span id="score">0</span></div>
        </div>

</div>

<script>
window.gameConfigDefs = {
    heroSpeed: { type: "number", label: "Drift Response", value: 0.15, min: 0.05, max: 0.5 },
    themeColor: { type: "color", label: "Signal Color", value: "#39FF14" },
    dangerColor: { type: "color", label: "Hazard Color", value: "#FF0055" },
    gameTitle: { type: "text", label: "Game Title", value: "ORBITAL RELAY RUSH" }
};

window.gameConfig = {
    heroSpeed: 0.15,
    themeColor: "#39FF14",
    dangerColor: "#FF0055",
    gameTitle: "ORBITAL RELAY RUSH"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') {
            document.title = val;
            document.getElementById('ui-title').innerText = val;
        }
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--accent', val);
            document.getElementById('ui-title').style.color = val;
            document.getElementById('start-btn').style.backgroundColor = val;
            document.getElementById('score').style.color = val;
            document.getElementById('finalScore').style.color = val;
        }
        if (key === 'dangerColor') {
            document.documentElement.style.setProperty('--danger', val);
            document.getElementById('restart-btn').style.backgroundColor = val;
        }
    }
};

    class AudioManager {
        constructor() {
            this.ctx = null;
            this.unlocked = false;
            this.lastPlayedAt = new Map();
        }

        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
        }

        unlock() {
            if (!this.ctx) return Promise.resolve();
            const resumePromise = this.ctx.state === 'suspended' ? this.ctx.resume() : Promise.resolve();
            return resumePromise.then(() => {
                this.unlocked = true;
                this.playBgm();
            }).catch(() => {});
        }

        playBgm() {
            const el = document.getElementById('bgm_main');
            if (!el) return;
            el.volume = 0.34;
            if (el.paused) {
                el.play().catch(() => {});
            }
        }

        stopBgm() {
            const el = document.getElementById('bgm_main');
            if (!el) return;
            el.pause();
            el.currentTime = 0;
        }

        playSfx(id, fallbackType = 'beep', options = {}) {
            const { volume = 0.72, debounceMs = 0 } = options;
            const nowMs = performance.now();
            const lastPlayed = this.lastPlayedAt.get(id) || 0;
            if (debounceMs && nowMs - lastPlayed < debounceMs) return;
            this.lastPlayedAt.set(id, nowMs);

            const el = document.getElementById(id);
            if (el) {
                try {
                    el.pause();
                    el.currentTime = 0;
                    el.volume = volume;
                    el.play().catch(() => {
                        if (this.unlocked && this.ctx) this.synthesize(fallbackType);
                    });
                    return;
                } catch (err) {}
            }

            if (this.unlocked && this.ctx) {
                this.synthesize(fallbackType);
            }
        }

        synthesize(type) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            const now = this.ctx.currentTime;
            if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'ui') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(560, now);
                osc.frequency.exponentialRampToValueAtTime(860, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1320, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }
    }

document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const bestScoreEl = document.getElementById('bestScore');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const collectGif = document.getElementById('collect-gif');
    const crashGif = document.getElementById('crash-gif');

    const audio = new AudioManager();
    let gifTimers = {};

    let state = 'MENU';
    let score = 0;
    let highScore = localStorage.getItem('xeno_highscore') || 0;
    let frames = 0;
    let lastTime = 0;
    let shakeStrength = 0;

    let width, height;

    let player = { x: 0, y: 0, r: 20, targetX: 0, targetY: 0, trail: [] };
    let obstacles = [];
    let particles = [];
    let stars = [];
    let collectibles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (state === 'MENU') {
            player.x = width / 2;
            player.y = height * 0.8;
            player.targetX = width / 2;
            player.targetY = height * 0.8;
        }
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 3 + 0.5,
                alpha: Math.random()
            });
        }
    }

    function flashGif(el, duration = 900) {
        if (!el) return;
        el.classList.add('is-visible');
        clearTimeout(gifTimers[el.id]);
        gifTimers[el.id] = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    }

    function resetGame() {
        state = 'PLAYING';
        score = 0;
        scoreEl.innerText = '0';
        obstacles = [];
        collectibles = [];
        particles = [];
        shakeStrength = 0;
        flashGif(collectGif, 10);
        flashGif(crashGif, 10);

        player.x = width / 2;
        player.y = height * 0.8;
        player.targetX = width / 2;
        player.targetY = height * 0.8;
        player.trail = [];

        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');

        audio.init();
        audio.unlock();
        audio.playSfx('sfx_start', 'ui', { volume: 0.68, debounceMs: 120 });
    }

    function gameOver() {
        state = 'GAMEOVER';
        shakeStrength = 20;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('xeno_highscore', highScore);
        }

        finalScoreEl.innerText = score;
        bestScoreEl.innerText = highScore;

        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        flashGif(crashGif, 1800);

        audio.playSfx('sfx_crash', 'explosion', { volume: 0.72, debounceMs: 250 });
        audio.stopBgm();
    }

    function handleInput(e) {
        if (state !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

        player.targetX = clientX - rect.left;
        player.targetY = clientY - rect.top;

        player.targetX = Math.max(player.r, Math.min(width - player.r, player.targetX));
        player.targetY = Math.max(player.r, Math.min(height - player.r, player.targetY));
    }

    window.addEventListener('resize', resize);

    // [agent-note][stage4] repaired: mobile-action-path | element: #start-btn | action: keep native taps outside canvas
    canvas.addEventListener('pointerdown', (e) => {
        if (state === 'MENU') return;
        handleInput(e);
        if (typeof canvas.setPointerCapture === 'function') {
            canvas.setPointerCapture(e.pointerId);
        }
    }, { passive: false });

    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', (e) => {
        if (typeof canvas.releasePointerCapture === 'function' && canvas.hasPointerCapture?.(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
        }
    }, { passive: false });
    canvas.addEventListener('pointercancel', (e) => {
        if (typeof canvas.releasePointerCapture === 'function' && canvas.hasPointerCapture?.(e.pointerId)) {
            canvas.releasePointerCapture(e.pointerId);
        }
    }, { passive: false });

    startBtn.addEventListener('click', () => {
        audio.init();
        audio.unlock();
        audio.playSfx('sfx_ui', 'ui', { volume: 0.55, debounceMs: 120 });
        resetGame();
    });
    restartBtn.addEventListener('click', () => {
        audio.init();
        audio.unlock();
        audio.playSfx('sfx_ui', 'ui', { volume: 0.55, debounceMs: 120 });
        resetGame();
    });

    function spawnObstacle() {
        const size = Math.random() * 30 + 20;
        obstacles.push({
            x: Math.random() * (width - size * 2) + size,
            y: -size - 50,
            size: size,
            speed: Math.random() * 3 + 3 + (score * 0.05),
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.1,
            type: Math.random() > 0.8 ? 'spike' : 'rock'
        });
    }

    function spawnCollectible() {
        collectibles.push({
            x: Math.random() * (width - 40) + 20,
            y: -30,
            size: 15,
            speed: 4,
            pulse: 0
        });
    }

    function createExplosion(x, y, color, count = 15) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 1
            });
        }
    }

    function update(dt) {
        if (state === 'PLAYING') {
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            player.x += dx * window.gameConfig.heroSpeed;
            player.y += dy * window.gameConfig.heroSpeed;

            if (frames % 3 === 0) {
                player.trail.push({ x: player.x, y: player.y, life: 1.0 });
            }

            if (frames % 40 === 0) spawnObstacle();
            if (frames % 150 === 0) spawnCollectible();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let ob = obstacles[i];
                ob.y += ob.speed;
                ob.rotation += ob.rotSpeed;

                const dist = Math.hypot(player.x - ob.x, player.y - ob.y);
                if (dist < player.r + ob.size * 0.8) {
                    gameOver();
                }

                if (ob.y > height + 100) obstacles.splice(i, 1);
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                let c = collectibles[i];
                c.y += c.speed;
                c.pulse += 0.1;

                const dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < player.r + c.size + 10) {
                    score += 10;
                    scoreEl.innerText = score;
                    audio.playSfx('sfx_collect', 'beep', { volume: 0.62, debounceMs: 80 });
                    flashGif(collectGif, 820);
                    createExplosion(c.x, c.y, window.gameConfig.themeColor, 8);
                    collectibles.splice(i, 1);
                } else if (c.y > height + 50) {
                    collectibles.splice(i, 1);
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = player.trail.length - 1; i >= 0; i--) {
            player.trail[i].life -= 0.05;
            if (player.trail[i].life <= 0) player.trail.splice(i, 1);
        }

        stars.forEach(s => {
            s.y += s.speed * (state === 'PLAYING' ? 1.5 : 0.5);
            if (s.y > height) {
                s.y = 0;
                s.x = Math.random() * width;
            }
        });

        if (shakeStrength > 0) shakeStrength *= 0.9;
        if (shakeStrength < 0.5) shakeStrength = 0;

        frames++;
    }

    function draw() {
         const accent = window.gameConfig.themeColor;
         const danger = window.gameConfig.dangerColor;
         const starStreak = state === 'PLAYING' ? 18 : 8;

         const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
         bgGradient.addColorStop(0, '#09011f');
         bgGradient.addColorStop(0.55, '#050014');
         bgGradient.addColorStop(1, '#02000c');
         ctx.fillStyle = bgGradient;
         ctx.fillRect(0, 0, width, height);

         const nebulaA = ctx.createRadialGradient(width * 0.2, height * 0.18, 0, width * 0.2, height * 0.18, width * 0.35);
         nebulaA.addColorStop(0, 'rgba(109, 244, 255, 0.18)');
         nebulaA.addColorStop(1, 'rgba(109, 244, 255, 0)');
         ctx.fillStyle = nebulaA;
         ctx.fillRect(0, 0, width, height);

         const nebulaB = ctx.createRadialGradient(width * 0.8, height * 0.24, 0, width * 0.8, height * 0.24, width * 0.28);
         nebulaB.addColorStop(0, 'rgba(57, 255, 20, 0.12)');
         nebulaB.addColorStop(1, 'rgba(57, 255, 20, 0)');
         ctx.fillStyle = nebulaB;
         ctx.fillRect(0, 0, width, height);

         ctx.save();
         if (shakeStrength > 0) {
             const dx = (Math.random() - 0.5) * shakeStrength;
             const dy = (Math.random() - 0.5) * shakeStrength;
             ctx.translate(dx, dy);
         }

         stars.forEach(s => {
             const tail = s.speed * starStreak;
             ctx.globalAlpha = s.alpha * (state === 'PLAYING' ? 0.65 : 0.42);
             ctx.strokeStyle = 'rgba(255,255,255,0.7)';
             ctx.lineWidth = Math.max(1, s.size * 0.7);
             ctx.beginPath();
             ctx.moveTo(s.x, s.y - tail);
             ctx.lineTo(s.x, s.y);
             ctx.stroke();

             ctx.fillStyle = '#fff';
             ctx.beginPath();
             ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
             ctx.fill();
         });
         ctx.globalAlpha = 1.0;

         player.trail.forEach(t => {
             ctx.fillStyle = accent;
             ctx.globalAlpha = t.life * 0.22;
             ctx.beginPath();
             ctx.arc(t.x, t.y, player.r * t.life * 1.2, 0, Math.PI * 2);
             ctx.fill();
         });
         ctx.globalAlpha = 1.0;

         collectibles.forEach(c => {
             const r = c.size + Math.sin(c.pulse) * 2;
             ctx.save();
             ctx.translate(c.x, c.y);
             ctx.rotate(c.pulse * 0.45);

             ctx.shadowBlur = 18;
             ctx.shadowColor = accent;
             ctx.fillStyle = '#fff7d6';
             ctx.beginPath();
             for (let i = 0; i < 8; i++) {
                 const angle = (Math.PI / 4) * i;
                 const radius = i % 2 === 0 ? r + 6 : r * 0.55;
                 const px = Math.cos(angle) * radius;
                 const py = Math.sin(angle) * radius;
                 if (i === 0) ctx.moveTo(px, py);
                 else ctx.lineTo(px, py);
             }
             ctx.closePath();
             ctx.fill();

             ctx.lineWidth = 2;
             ctx.strokeStyle = accent;
             ctx.stroke();

             ctx.beginPath();
             ctx.fillStyle = accent;
             ctx.arc(0, 0, Math.max(0, r * 0.4), 0, Math.PI * 2);
             ctx.fill();
             ctx.restore();
         });

         obstacles.forEach(ob => {
             ctx.save();
             ctx.translate(ob.x, ob.y);
             ctx.rotate(ob.rotation);

             ctx.lineWidth = 2.5;
             ctx.shadowBlur = 12;
             ctx.shadowColor = danger;

             if (ob.type === 'rock') {
                 const rockGradient = ctx.createRadialGradient(0, 0, ob.size * 0.2, 0, 0, ob.size * 1.2);
                 rockGradient.addColorStop(0, '#514a73');
                 rockGradient.addColorStop(1, '#1a1730');
                 ctx.fillStyle = rockGradient;
                 ctx.strokeStyle = danger;

                 ctx.beginPath();
                 for (let i = 0; i < 6; i++) {
                     const angle = (i / 6) * Math.PI * 2;
                     const radius = ob.size * (i % 2 === 0 ? 1.05 : 0.82);
                     const px = Math.cos(angle) * radius;
                     const py = Math.sin(angle) * radius;
                     if (i === 0) ctx.moveTo(px, py);
                     else ctx.lineTo(px, py);
                 }
                 ctx.closePath();
                 ctx.fill();
                 ctx.stroke();

                 ctx.strokeStyle = 'rgba(255,255,255,0.14)';
                 ctx.beginPath();
                 ctx.moveTo(-ob.size * 0.3, -ob.size * 0.2);
                 ctx.lineTo(ob.size * 0.25, ob.size * 0.18);
                 ctx.stroke();
             } else {
                 ctx.fillStyle = '#1a0f23';
                 ctx.strokeStyle = danger;
                 const s = ob.size;
                 ctx.beginPath();
                 ctx.moveTo(0, -s);
                 ctx.lineTo(s * 0.88, s * 0.95);
                 ctx.lineTo(0, s * 0.34);
                 ctx.lineTo(-s * 0.88, s * 0.95);
                 ctx.closePath();
                 ctx.fill();
                 ctx.stroke();

                 ctx.fillStyle = 'rgba(255,255,255,0.18)';
                 ctx.beginPath();
                 ctx.moveTo(0, -s * 0.55);
                 ctx.lineTo(s * 0.2, s * 0.08);
                 ctx.lineTo(-s * 0.2, s * 0.08);
                 ctx.closePath();
                 ctx.fill();
             }

             ctx.restore();
             ctx.shadowBlur = 0;
         });

         if (state !== 'GAMEOVER') {
             ctx.save();
             ctx.translate(player.x, player.y);

             const bob = Math.sin(frames * 0.12) * 1.5;
             const droneGlow = ctx.createRadialGradient(0, 0, player.r * 0.2, 0, 0, player.r * 1.65);
             droneGlow.addColorStop(0, 'rgba(109, 244, 255, 0.35)');
             droneGlow.addColorStop(1, 'rgba(109, 244, 255, 0)');
             ctx.fillStyle = droneGlow;
             ctx.beginPath();
             ctx.arc(0, 0, player.r * 1.7, 0, Math.PI * 2);
             ctx.fill();

             ctx.shadowBlur = 22;
             ctx.shadowColor = accent;

             ctx.fillStyle = '#dffcff';
             ctx.beginPath();
             ctx.ellipse(0, -player.r * 0.18 + bob, player.r * 0.9, player.r * 0.62, 0, Math.PI, 0);
             ctx.fill();

             ctx.fillStyle = accent;
             ctx.beginPath();
             ctx.ellipse(0, player.r * 0.18 + bob, player.r * 1.05, player.r * 0.48, 0, 0, Math.PI * 2);
             ctx.fill();

             ctx.fillStyle = '#071520';
             ctx.beginPath();
             ctx.arc(-player.r * 0.26, -player.r * 0.18 + bob, player.r * 0.12, 0, Math.PI * 2);
             ctx.arc(player.r * 0.26, -player.r * 0.18 + bob, player.r * 0.12, 0, Math.PI * 2);
             ctx.fill();

             ctx.fillStyle = '#fff';
             ctx.beginPath();
             ctx.arc(-player.r * 0.22, -player.r * 0.22 + bob, player.r * 0.04, 0, Math.PI * 2);
             ctx.arc(player.r * 0.3, -player.r * 0.22 + bob, player.r * 0.04, 0, Math.PI * 2);
             ctx.fill();

             ctx.shadowBlur = 0;
             ctx.fillStyle = 'rgba(255, 233, 120, 0.55)';
             ctx.beginPath();
             ctx.ellipse(0, player.r * 0.95, player.r * 0.62, player.r * 0.2, 0, 0, Math.PI * 2);
             ctx.fill();

             ctx.restore();
         }

         particles.forEach(p => {
             ctx.fillStyle = p.color;
             ctx.globalAlpha = p.life;
             ctx.beginPath();
             ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
             ctx.fill();
         });
         ctx.globalAlpha = 1.0;

         ctx.strokeStyle = 'rgba(109, 244, 255, 0.08)';
         ctx.lineWidth = 1;
         for (let y = 0; y < height; y += 48) {
             ctx.beginPath();
             ctx.moveTo(0, y + 0.5);
             ctx.lineTo(width, y + 0.5);
             ctx.stroke();
         }

         ctx.restore();
    }

    function loop(timestamp) {
        try {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(loop);
        } catch (e) {
            console.error("Game Loop Error:", e);
        }
    }

    resize();
    initStars();
    requestAnimationFrame(loop);

    updateGameConfig('gameTitle', window.gameConfig.gameTitle);
    updateGameConfig('themeColor', window.gameConfig.themeColor);
    updateGameConfig('dangerColor', window.gameConfig.dangerColor);
});
</script>
