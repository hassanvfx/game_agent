const SCRIPT={start:{chapter:"VOLUME 01: TRANSFER STUDENT WEATHER",bg:"forest",char:null,lines:[{text:"Rain auditions for the role of my entire personality.",speaker:null},{text:"New school, new town, same tragic ability to fall for warning signs in designer coats.",speaker:"Mira"},{text:"Then he appears beside the cafeteria recycling bin, sparkling like a tax loophole.",speaker:null}],next:"orion_enter"},orion_enter:{bg:"school",char:"orion",lines:[{text:"You should not stare at me. It encourages the moon.",speaker:"Orion"},{text:"His voice sounds seventeen and also older than algebra.",speaker:null},{text:"I should walk away. Naturally, I write his name in my diary seven times.",speaker:"Mira"}],choices:[{text:"Ask why he sparkles during drizzle",target:"sparkle_confession"},{text:"Pretend I was staring at the recycling bin",target:"recycling_lie"}]},recycling_lie:{bg:"school",char:"orion",lines:[{text:"The bin is taken. By me. Emotionally.",speaker:"Orion"},{text:"This is the worst flirting I have ever survived, and I have group projects.",speaker:"Mira"}],next:"sparkle_confession"},sparkle_confession:{bg:"forest",char:"orion",lines:[{text:"Meet me where the pines look judgemental.",speaker:"Orion"},{text:"I follow him into the woods because my survival instincts are apparently extra credit.",speaker:null},{text:"He lifts one pale hand. The rain freezes above us like gossip holding its breath.",speaker:null,effect:"melodrama"}],next:"first_spark",unlockMemory:true},first_spark:{chapter:"VOLUME 02: THE TRIANGLE GETS ABS",bg:"forest",char:"orion",lines:[{text:"I am immortal. Also, terribly enrolled.",speaker:"Orion"},{text:"That explains the antique handwriting and the way he pronounces 'text message' like a curse.",speaker:"Mira"},{text:"Before I can process eternal detention, a wolf-sized shadow steps from the trees.",speaker:null}],next:"caleb_enter"},caleb_enter:{bg:"wolf",char:"caleb",lines:[{text:"Step away from the glitter cadaver, Mira.",speaker:"Caleb"},{t
