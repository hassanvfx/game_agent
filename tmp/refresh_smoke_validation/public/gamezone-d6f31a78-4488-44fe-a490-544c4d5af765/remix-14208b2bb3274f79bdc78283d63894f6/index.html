<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fragments of Yesterday: Extended</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap">
    <style>
        :root {
            --bg-deep: #060917;
            --bg-night: #0d1430;
            --panel: rgba(10, 16, 35, 0.78);
            --panel-strong: rgba(16, 25, 51, 0.92);
            --line: rgba(146, 231, 255, 0.24);
            --line-strong: rgba(146, 231, 255, 0.58);
            --text-main: #f4f8ff;
            --text-soft: #b9c8ef;
            --text-dim: #6e81af;
            --cyan: #92e7ff;
            --cyan-strong: #47c9ff;
            --violet: #aa7dff;
            --pink: #ff72c5;
            --danger: #ff667e;
            --shadow: 0 12px 42px rgba(0, 0, 0, 0.52);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(71, 201, 255, 0.12), transparent 34%),
                radial-gradient(circle at bottom, rgba(170, 125, 255, 0.12), transparent 42%),
                linear-gradient(180deg, #0a1022 0%, #060917 100%);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 25%, transparent 75%, rgba(255,255,255,0.03)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px);
            opacity: 0.38;
        }

        .asset-vault {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(19, 29, 61, 0.92), rgba(8, 14, 31, 0.88));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .glass-panel::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .glass-btn {
            background:
                linear-gradient(180deg, rgba(33, 48, 93, 0.9), rgba(13, 20, 43, 0.95));
            border: 1px solid rgba(146, 231, 255, 0.28);
            color: var(--text-main);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 0 1px rgba(255,255,255,0.03);
            transition: transform 0.2s ease, filter 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-btn:hover,
        .glass-btn:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.08);
            border-color: rgba(146, 231, 255, 0.5);
            box-shadow:
                0 14px 28px rgba(0, 0, 0, 0.4),
                0 0 18px rgba(71, 201, 255, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.1);
            outline: none;
        }

        .glass-btn:active {
            transform: scale(0.96);
            filter: brightness(1.12);
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-fade-in {
            animation: fade-in 0.8s ease-out forwards;
        }

        @keyframes slide-up {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-slide-up {
            animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulse-arrow {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(4px); opacity: 1; }
        }

        .animate-arrow {
            animation: pulse-arrow 1.5s infinite;
        }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .ripple-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            margin-left: -50px;
            margin-top: -50px;
            background: rgba(146, 231, 255, 0.2);
            border: 1px solid rgba(146, 231, 255, 0.28);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 0.6s ease-out forwards;
            z-index: 9999;
        }

        @keyframes chapter-anim {
            0% { opacity: 0; transform: scale(0.92); letter-spacing: 0.25em; }
            20% { opacity: 1; transform: scale(1); letter-spacing: 0.45em; }
            80% { opacity: 1; transform: scale(1); letter-spacing: 0.45em; }
            100% { opacity: 0; transform: scale(1.06); letter-spacing: 0.58em; }
        }

        .chapter-title-anim {
            animation: chapter-anim 4s ease-in-out forwards;
        }

        #game-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .font-display {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        #game-layer {
            touch-action: none;
        }

        .hud-top {
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            z-index: 20;
        }

        .hud-pill {
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: var(--shadow);
            min-height: 2rem;
            display: inline-flex;
            align-items: center;
        }

        #day-hud {
            color: var(--cyan);
        }

        #mem-hud {
            color: #ffd0f0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .hud-flash {
            transform: scale(1.08);
            color: #ffffff !important;
            box-shadow: var(--shadow), 0 0 18px rgba(255, 114, 197, 0.28);
        }

        #chapter-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            pointer-events: none;
        }

        #chapter-title {
            margin: 0;
            padding: 0 1rem;
            text-align: center;
            color: #ffffff;
            font-size: clamp(2rem, 8vw, 4rem);
            letter-spacing: 0.3em;
            text-shadow: 0 0 24px rgba(71, 201, 255, 0.45), 0 0 40px rgba(170, 125, 255, 0.2);
        }

        #choices-container {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            z-index: 30;
            padding: 8rem 1.25rem 1.5rem;
            pointer-events: none;
        }

        .choice-btn {
            width: min(100%, 22rem);
            padding: 1rem 1.15rem;
            border-radius: 1rem;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            pointer-events: auto;
        }

        .dialogue-wrap {
            width: 100%;
            padding: 1rem;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            z-index: 20;
            margin-top: auto;
        }

        #dialogue-panel {
            border-radius: 1.5rem;
            padding: 1.2rem 1.2rem 1.45rem;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #dialogue-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(255, 114, 197, 0.12), transparent 35%),
                radial-gradient(circle at bottom left, rgba(71, 201, 255, 0.12), transparent 38%);
            pointer-events: none;
        }

        #char-name {
            position: absolute;
            top: -0.72rem;
            left: 1.2rem;
            color: #ffffff;
            padding: 0.22rem 0.7rem;
            border-radius: 0.55rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
        }

        #main-text {
            margin: 0;
            color: var(--text-main);
            font-size: clamp(1rem, 2.6vw, 1.25rem);
            line-height: 1.45;
            font-weight: 400;
            text-shadow: 0 1px 10px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        #next-icon {
            position: absolute;
            right: 1rem;
            bottom: 0.7rem;
            color: var(--pink);
            font-size: 1.25rem;
            text-shadow: 0 0 14px rgba(255, 114, 197, 0.4);
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at top, rgba(71, 201, 255, 0.14), transparent 30%),
                radial-gradient(circle at bottom, rgba(255, 114, 197, 0.12), transparent 36%),
                linear-gradient(180deg, #0b1023 0%, #050814 100%);
            overflow: hidden;
        }

        .start-grid {
            position: absolute;
            inset: 0;
            opacity: 0.24;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(146, 231, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(146, 231, 255, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,1), rgba(0,0,0,0.5));
        }

        .start-aura {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 35%, rgba(255,255,255,0.1), transparent 16%),
                radial-gradient(circle at 45% 44%, rgba(71, 201, 255, 0.14), transparent 24%),
                radial-gradient(circle at 54% 56%, rgba(255, 114, 197, 0.12), transparent 20%);
            filter: blur(14px);
        }

        .start-kicker {
            margin: 0 0 0.7rem;
            color: var(--cyan);
            font-size: 0.9rem;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            text-align: center;
        }

        .start-title {
            margin: 0;
            text-align: center;
            font-size: clamp(3rem, 14vw, 5.4rem);
            line-height: 0.92;
            letter-spacing: 0.16em;
            color: #f8fbff;
            text-shadow:
                0 0 16px rgba(71, 201, 255, 0.35),
                0 0 34px rgba(170, 125, 255, 0.18);
        }

        .start-subtitle {
            margin: 0.5rem 0 1.6rem;
            text-align: center;
            color: var(--text-soft);
            font-size: clamp(0.9rem, 3.2vw, 1.15rem);
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .start-portrait {
            position: relative;
            width: min(60vw, 230px);
            aspect-ratio: 0.76;
            margin-bottom: 1.4rem;
            border-radius: 2rem 2rem 2.4rem 2.4rem;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(255,255,255,0.2), transparent 22%),
                linear-gradient(180deg, rgba(29, 44, 89, 0.96), rgba(10, 16, 35, 0.98));
            border: 1px solid rgba(146, 231, 255, 0.26);
            box-shadow: var(--shadow), 0 0 28px rgba(71, 201, 255, 0.12);
        }

        .start-portrait::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 38%),
                radial-gradient(circle at 50% 58%, rgba(255, 114, 197, 0.12), transparent 28%);
            pointer-events: none;
        }

        .start-portrait img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: translateY(10px) scale(1.08);
            filter: drop-shadow(0 18px 26px rgba(0,0,0,0.4));
        }

        #btn-start {
            padding: 1rem 2.1rem;
            border-radius: 999px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1rem, 4vw, 1.5rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .feedback-overlay {
            position: absolute;
            right: 1rem;
            bottom: calc(10.5rem + env(safe-area-inset-bottom));
            width: min(34vw, 128px);
            aspect-ratio: 1;
            z-index: 25;
            border-radius: 1rem;
            border: 1px solid rgba(146, 231, 255, 0.2);
            background: rgba(8, 14, 31, 0.5);
            box-shadow: var(--shadow);
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-overlay.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feedback-label {
            position: absolute;
            left: 0.45rem;
            bottom: 0.35rem;
            padding: 0.12rem 0.35rem;
            border-radius: 999px;
            background: rgba(6, 9, 23, 0.72);
            color: #fff;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-reaction {
            position: absolute;
            inset: 0;
            z-index: 45;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background: radial-gradient(circle, rgba(9, 16, 34, 0.12), rgba(9, 16, 34, 0));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .screen-reaction.visible {
            opacity: 1;
        }

        .screen-reaction img {
            width: min(70vw, 220px);
            max-height: 28vh;
            object-fit: contain;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: var(--shadow);
        }

        .start-footer {
            margin-top: 1rem;
            color: var(--text-dim);
            font-size: 0.78rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            text-align: center;
        }

        #glitch-overlay {
            position: absolute;
            inset: 0;
            z-index: 40;
            background: linear-gradient(180deg, rgba(255, 0, 76, 0.45), rgba(255, 91, 145, 0.3));
            mix-blend-mode: screen;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 640px) {
            .hud-top,
            .dialogue-wrap {
                padding-left: 0.85rem;
                padding-right: 0.85rem;
            }

            .hud-pill {
                font-size: 0.7rem;
                padding: 0.42rem 0.75rem;
                letter-spacing: 0.14em;
            }

            #choices-container {
                padding-top: 7rem;
            }

            #dialogue-panel {
                border-radius: 1.2rem;
                padding: 1rem 1rem 1.3rem;
                min-height: 132px;
            }

            #char-name {
                left: 1rem;
            }

            .choice-btn {
                font-size: 1rem;
                padding: 0.9rem 1rem;
            }

            .start-subtitle {
                letter-spacing: 0.18em;
                margin-bottom: 1.2rem;
            }

            .start-kicker,
            .start-footer {
                letter-spacing: 0.18em;
            }

            .feedback-overlay {
                right: 0.85rem;
                bottom: calc(10rem + env(safe-area-inset-bottom));
                width: min(28vw, 100px);
            }

            .screen-reaction img {
                width: min(62vw, 180px);
                max-height: 20vh;
            }
        }
    </style>
</head>

const AUDIO = {
    ctx: null, master: null, buffers: {}, currentLoop: null, initialized: false, playCooldowns: {},
    urls: {
        bgm_story: "https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3",
        bgm_tension: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
        bgm_end: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
        sfx_click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
        sfx_start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
        sfx_memory: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
        sfx_glitch: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
        sfx_choice: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
        sfx_bad_end: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
        sfx_good_end: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
    },
    async init() {
        if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.34;
        this.master.connect(this.ctx.destination);
        this.initialized = true;
        await Promise.all(Object.entries(this.urls).map(async ([key, url]) => {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                this.buffers[key] = await this.ctx.decodeAudioData(arrayBuffer);
            } catch (e) {}
        }));
        this.playLoop('bgm_story', 0.18, 0.92);
    },
    ensureRunning() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    stopLoop() {
        if (!this.currentLoop) return;
        try {
            this.currentLoop.source.stop();
        } catch (e) {}
        this.currentLoop = null;
    },
    playLoop(key, volume = 0.18, rate = 1) {
        this.ensureRunning();
        if (!this.buffers[key] || !this.ctx) return;
        if (this.currentLoop?.key === key) return;
        this.stopLoop();
        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        source.buffer = this.buffers[key];
        source.loop = true;
        source.playbackRate.value = rate;
        gain.gain.value = volume;
        source.connect(gain);
        gain.connect(this.master);
        source.start(0);
        this.currentLoop = { key, source, gain };
    },
    playSFX(key, volume = 0.48, cooldown = 120) {
        this.ensureRunning();
        const now = performance.now();
        if (this.playCooldowns[key] && now - this.playCooldowns[key] < cooldown) return;
        this.playCooldowns[key] = now;
        if (!this.buffers[key] || !this.ctx) return;
        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        source.buffer = this.buffers[key];
        gain.gain.value = volume;
        source.connect(gain);
        gain.connect(this.master);
        source.start(0);
    }
};

        this.state.started = true;
        this.state.memories = 0;
        this.els.memCount.innerText = "0/3";
        this.loadScene('start');

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.els.canvas.width = window.innerWidth * dpr;
        this.els.canvas.height = window.innerHeight * dpr;
        this.els.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.els.ctx.scale(dpr, dpr);

        const data = SCRIPT[id];
        if (!data) return;

        this.state.scene = data;
        this.state.lineIdx = 0;
        this.state.waitInput = false;
        this.hideEndingReaction();

        if (data.chapter) {
            this.els.dayHud.innerText = data.chapter;
            this.els.chapTitle.innerText = data.chapter;
            this.els.chapOverlay.classList.remove('hidden');
            this.els.chapTitle.classList.remove('chapter-title-anim');
            void this.els.chapTitle.offsetWidth;
            this.els.chapTitle.classList.add('chapter-title-anim');
            setTimeout(() => this.els.chapOverlay.classList.add('hidden'), 4000);
        }

        if (data.bg) this.visuals.bgImg = document.getElementById(data.bg);
        this.visuals.tint = data.tint || null;

        if (id.startsWith('chapter_3') || id.startsWith('ch3_')) AUDIO.playLoop('bgm_tension', 0.16, 0.94);
        else if (id.startsWith('game_over') || id.startsWith('end_')) AUDIO.playLoop('bgm_end', 0.15, 0.9);
        else AUDIO.playLoop('bgm_story', 0.18, 0.92);

        this.setChar(data.char);

        if (data.unlockMemory) {
            this.state.memories++;
            this.els.memCount.innerText = `${this.state.memories}/3`;
            AUDIO.playSFX('sfx_memory', 0.5, 180);
            this.els.memHud.classList.add('hud-flash');
            this.showMemoryReaction();
            setTimeout(() => this.els.memHud.classList.remove('hud-flash'), 500);
        }

        if (id === 'game_over_bad') {
            AUDIO.playSFX('sfx_bad_end', 0.56, 0);
            this.showEndingReaction("https://i.giphy.com/3o7aTskHEUdgCQAXde.webp", "Submission ending reaction");
        } else if (id === 'game_over_good') {
            AUDIO.playSFX('sfx_good_end', 0.52, 0);
            this.showEndingReaction("https://i.giphy.com/G5X63GrrLjjVK.webp", "Truth kept ending reaction");
        }

        this.showLine();
    },

    setChar(id) {
        if (!id) {
            this.visuals.targetCharOpacity = 0;
        } else {
            const el = document.getElementById(id);
            if (el) {
                if (this.visuals.charImg !== el) {
                    this.visuals.charImg = el;
                    if (this.visuals.targetCharOpacity === 0) this.visuals.charOpacity = 0;
                }
                this.visuals.targetCharOpacity = 1;
            }
        }
    },

    showMemoryReaction() {
        const card = this.els.memoryGif;
        card.classList.remove('hidden');
        card.classList.add('visible');
        clearTimeout(this.memoryGifTimer);
        this.memoryGifTimer = setTimeout(() => {
            card.classList.remove('visible');
            setTimeout(() => card.classList.add('hidden'), 250);
        }, 1800);
    },

    showEndingReaction(src, alt) {
        const wrap = this.els.endingGif;
        const img = wrap.querySelector('img');
        img.src = src;
        img.alt = alt;
        wrap.classList.remove('hidden');
        requestAnimationFrame(() => wrap.classList.add('visible'));
    },

    hideEndingReaction() {
        const wrap = this.els.endingGif;
        wrap.classList.remove('visible');
        setTimeout(() => wrap.classList.add('hidden'), 180);
    },

    showLine() {
        const line = this.state.scene.lines[this.state.lineIdx];

        if (line.char !== undefined) this.setChar(line.char);
        else if (line.speaker && CHAR_MAP[line.speaker]) this.setChar(CHAR_MAP[line.speaker]);

        if (line.speaker) {
            this.els.name.innerText = line.speaker;
            this.els.name.classList.remove('hidden');
            if (line.speaker === "Me" || line.speaker === "???") this.els.name.style.backgroundColor = '#5e6f91';
            else if (line.speaker === "Doctor" || line.speaker === "Dr. K") this.els.name.style.backgroundColor = '#2b9df8';
            else this.els.name.style.backgroundColor = '#dd5db4';
        } else {
            this.els.name.classList.add('hidden');
        }

        if (line.effect === 'glitch') {
            this.visuals.glitchTimer = 20;
            AUDIO.playSFX('sfx_glitch', 0.42, 160);
        }

        this.state.textTarget = line.text;
        this.state.textCurrent = "";
        this.state.typing = true;
        this.els.text.innerText = "";
        this.els.next.classList.add('hidden');
        this.els.choices.innerHTML = '';
        this.els.choices.classList.add('hidden');
    },

    finishTyping() {
        this.state.typing = false;
        this.state.textCurrent = this.state.textTarget;
        this.els.text.innerText = this.state.textTarget;
        this.checkLineEnd();
    },

    checkLineEnd() {
        const isLastLine = this.state.lineIdx >= this.state.scene.lines.length - 1;
        if (isLastLine && this.state.scene.choices) {
            this.showChoices();
        } else {
            this.els.next.classList.remove('hidden');
        }
    },

    showChoices() {
        this.state.waitInput = true;
        this.els.choices.classList.remove('hidden');
        this.els.next.classList.add('hidden');

        this.state.scene.choices.forEach((c, i) => {
            const btn = document.createElement('button');
            btn.className = "glass-btn choice-btn animate-slide-up interactive";
            btn.style.animationDelay = (i * 0.1) + 's';
            btn.innerText = c.text;
            btn.onclick = (e) => {
                e.stopPropagation();
                AUDIO.playSFX('sfx_choice', 0.46, 60);
                this.els.choices.innerHTML = '';
                this.els.choices.classList.add('hidden');
                this.loadScene(c.target);
            };
            this.els.choices.appendChild(btn);
        });
    },

    advance() {
        if (this.state.waitInput) return;
        if (this.state.typing) {
            this.finishTyping();
            return;
        }
        if (this.state.lineIdx < this.state.scene.lines.length - 1) {
            this.state.lineIdx++;
            this.showLine();
        } else {
            if (this.state.scene.next) this.loadScene(this.state.scene.next);
        }
    },

    loop() {
        const ctx = this.els.ctx;
        const w = window.innerWidth;
        const h = window.innerHeight;

        if (this.state.typing) {
            const speed = 2;
            if (this.state.textCurrent.length < this.state.textTarget.length) {
                this.state.textCurrent = this.state.textTarget.substring(0, this.state.textCurrent.length + speed);
                this.els.text.innerText = this.state.textCurrent;
            } else {
                this.finishTyping();
            }
        }

        if (this.visuals.bgImg && this.visuals.bgImg.complete) {
            this.drawImageCover(ctx, this.visuals.bgImg, w, h);
        } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);
        }

        const horizonGlow = ctx.createLinearGradient(0, 0, 0, h);
        horizonGlow.addColorStop(0, 'rgba(10,16,35,0.14)');
        horizonGlow.addColorStop(0.55, 'rgba(46,74,140,0.06)');
        horizonGlow.addColorStop(1, 'rgba(5,8,20,0.6)');
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(0, 0, w, h);

        if (this.visuals.tint) {
            ctx.fillStyle = this.visuals.tint;
            ctx.fillRect(0, 0, w, h);
        }

        ctx.fillStyle = 'rgba(201,233,255,0.18)';
        this.visuals.particles.forEach(p => {
            p.y -= p.v;
            if (p.y < 0) p.y = h;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
            ctx.fill();
        });

        let v = this.visuals;
        if (v.charOpacity !== v.targetCharOpacity) {
            const diff = v.targetCharOpacity - v.charOpacity;
            v.charOpacity += Math.sign(diff) * 0.08;
            if (Math.abs(diff) < 0.08) v.charOpacity = v.targetCharOpacity;
        }

        if (v.charImg && v.charOpacity > 0.01 && v.charImg.complete) {
            ctx.save();
            ctx.globalAlpha = v.charOpacity;
            ctx.shadowColor = 'rgba(71, 201, 255, 0.18)';
            ctx.shadowBlur = 28;
            ctx.shadowOffsetY = 8;
            const img = v.charImg;
            const nW = img.naturalWidth || 400;
            const nH = img.naturalHeight || 600;
            const desiredH = h * 0.85;
            const scale = desiredH / nH;
            const dw = nW * scale;
            const dh = desiredH;
            const dx = (w - dw) / 2;
            const dy = h - dh;
            ctx.drawImage(img, dx, dy, dw, dh);

            const glow = ctx.createRadialGradient(w / 2, h * 0.7, 20, w / 2, h * 0.74, w * 0.28);
            glow.addColorStop(0, 'rgba(146, 231, 255, 0.14)');
            glow.addColorStop(1, 'rgba(146, 231, 255, 0)');
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }

        if (v.glitchTimer > 0) {
            v.glitchTimer--;
            this.els.glitch.classList.remove('hidden');
            this.els.glitch.style.opacity = Math.random() * 0.6;
            const shift = (Math.random() - 0.5) * 40;
            const sy = Math.random() * h;
            const sh = Math.random() * 100;
            try { ctx.drawImage(ctx.canvas, 0, sy, w, sh, shift, sy, w, sh); } catch(e) {}
        } else {
            this.els.glitch.classList.add('hidden');
        }

        requestAnimationFrame(() => this.loop());
    },

    drawImageCover(ctx, img, w, h) {
        if (!img.naturalWidth) return;
        const iRatio = img.naturalWidth / img.naturalHeight;
        const sRatio = w / h;
        let nw, nh;
        if (sRatio > iRatio) { nw = w; nh = w / iRatio; }
        else { nh = h; nw = h * iRatio; }
        ctx.drawImage(img, (w - nw) / 2, (h - nh) / 2, nw, nh);
    }
};

document.body.addEventListener('pointerup', (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'ripple-effect';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
    if (GAME.state.started) GAME.advance();
});

document.getElementById('btn-start').addEventListener('click', async (e) => {
    e.stopPropagation();
    await AUDIO.init();
    AUDIO.playSFX('sfx_start', 0.52, 0);
    document.getElementById('start-screen').classList.add('hidden');
    GAME.start();
});

GAME.init();

const gameSurface = document.getElementById('game-layer');
gameSurface.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>
