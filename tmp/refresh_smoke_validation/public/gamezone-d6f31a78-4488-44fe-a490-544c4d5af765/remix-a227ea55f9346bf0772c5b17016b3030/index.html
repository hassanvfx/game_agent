<script>
const CHAR_MAP={"The Vessel":"vessel","Me":"vessel","Father Martel":"priest","Dr. Synod":"doctor","Basement Voice":"demon","The Tenant":"demon","Sister Ad Copy":"nun"};
const SCRIPT={
start:{chapter:"RITE I",mood:"bedroom",char:null,lines:[{text:"The room is narrow enough to make every prayer bump its elbows.",speaker:null},{text:"My wrists smell of candle wax. The wallpaper breathes in Latin.",speaker:"The Vessel"},{text:"Someone outside the door argues with something inside my throat.",speaker:null}],next:"priest_enter"},
priest_enter:{mood:"bedroom",char:"priest",lines:[{text:"Good evening, child. I am Father Martel, licensed exorcist and part-time parish newsletter critic.",speaker:"Father Martel"},{text:"The straps are ceremonial. Also recommended by our insurance carrier.",speaker:"Father Martel"},{text:"If the voice answers, do not negotiate bulk rates on damnation.",speaker:"Father Martel"}],choices:[{text:"Whisper the saint's name",target:"confession"},{text:"Ask why the bed is facing the wall",target:"confession"}]},
confession:{mood:"bedroom",char:"vessel",lines:[{text:"I try to remember my name. The ceiling remembers it backward first.",speaker:"Me"},{text:"A medal burns in my palm. It was not there a breath ago.",speaker:null},{text:"The room tilts. Somewhere downstairs, a radio sells holy water in convenient monthly plans.",speaker:null,effect:"rupture"}],next:"first_relic"},
first_relic:{mood:"sanctum",char:"demon",lines:[{text:"MARTELLLL. Your faith is off-brand and under-seasoned.",speaker:"The Tenant"},{text:"The medal clicks open. Inside is a child's tooth wrapped in scripture.",speaker:null},{text:"Father Martel does not flinch. He only raises the candle closer.",speaker:null}],next:"chapter_two",unlockRelic:true},
chapter_two:{chapter:"RITE II",mood:"hall",char:null,lines:[{text:"Hours pass. The hallway outside Room 13 grows shorter each time I blink.",speaker:null},{text:"Dr. Synod arrives with a clipboard, a grin, and the confidence of a man who bills by the possession.",speaker:null},{text:"He says this is hysteria. The crucifix on the wall laughs so hard it turns upside down.",speaker:null,effect:"rupture"}],choices:[{text:"Let the doctor examine the marks",target:"doctor_scene"},{text:"Refuse and recite the old prayer",target:"prayer_scene"}]},
doctor_scene:{mood:"hall",char:"doctor",lines:[{text:"Fascinating. The scratches spell a complaint about my bedside manner.",speaker:"Dr. Synod"},{text:"He reaches for the medal. The lights go green. The bed knocks politely on the ceiling.",speaker:null},{text:"Father Martel hisses, 'Nobody touches relics during visiting hours.'",speaker:"Father Martel"}],next:"second_relic",unlockRelic:true},
prayer_scene:{mood:"hall",char:"priest",lines:[{text:"I do not know the words, but my mouth does. That scares all of us equally.",speaker:"Me"},{text:"The wallpaper peels into a hundred little ears.",speaker:null},{text:"A second relic drops from the vent with the dry clink of a bone refusing retirement.",speaker:null}],next:"second_relic",unlockRelic:true},
second_relic:{mood:"sanctum",char:"demon",lines:[{text:"Two relics, two candles, one exhausted priest, and a demon doing impressions of my mother.",speaker:null},{text:"It says faith is a costume. Father Martel says so is skin.",speaker:null},{text:"The sacred circle tightens around the bed like a noose made of gold leaf.",speaker:null}],next:"chapter_three"},
chapter_three:{chapter:"RITE III",mood:"infernal",char:"demon",lines:[{text:"Midnight arrives with its shoes on the wrong feet.",speaker:null},{text:"The Tenant crawls through my voice and offers a bargain: silence for the medal, peace for the lie.",speaker:"The Tenant"},{text:"Father Martel places the final candle. The flame points down.",speaker:null}],choices:[{text:"Hand over the medal and end the pain",target:"bad_end"},{text:"Keep the medal and answer with the rite",target:"good_path"}]},

bad_end:{mood:"infernal",char:"doctor",tint:"bad",lines:[{text:"I give Dr. Synod the medal. He smiles like a door closing from the outside.",speaker:null},{text:"Father Martel shouts, but his voice is already far away.",speaker:null},{text:"The Tenant settles into my bones and starts redecorating.",speaker:"The Tenant",effect:"rupture"}],next:"game_over_bad"},
good_end:{mood:"sanctum",char:"vessel",lines:[{text:"Dawn leaks into Room 13. The bed is on the floor again. Mostly.",speaker:null},{text:"Father Martel signs the discharge note: 'Improved, still sarcastic.'",speaker:"Father Martel"},{text:"I keep the relics. They are warm now. So is my name.",speaker:"Me"}],next:"game_over_good"},
game_over_bad:{mood:"infernal",char:"demon",lines:[{text:"BAD ENDING: SUBLEASE OF THE SOUL",speaker:"SYSTEM"},{text:"The possession continues with complimentary continental dread.",speaker:"SYSTEM"}],choices:[{text:"Try the rite again",target:"start"}]},
game_over_good:{mood:"sanctum",char:"vessel",lines:[{text:"GOOD ENDING: EVICTION NOTICE SERVED",speaker:"SYSTEM"},{text:"Faith, fear, and one very tired priest survive the night.",speaker:"SYSTEM"}],choices:[{text:"Replay confession",target:"start"}]}
};
const AUDIO={ctx:null,master:null,buffers:{},currentLoop:null,initialized:false,playCooldowns:{},urls:{bgm_story:"https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3",bgm_tension:"https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",bgm_end:"https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",sfx_click:"https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",sfx_start:"https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",sfx_relic:"https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",sfx_glitch:"https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",sfx_choice:"https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",sfx_bad_end:"https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",sfx_good_end:"https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"},async init(){if(this.initialized){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return}try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.31;this.master.connect(this.ctx.destination);this.initialized=true;await Promise.all(Object.entries(this.urls).map(async([k,u])=>{try{const r=await fetch(u);const b=await r.arrayBuffer();this.buffers[k]=await this.ctx.decodeAudioData(b)}catch(e){}}));this.playLoop('bgm_story',.16,.78)}catch(e){this.initialized=true}},ensureRunning(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},stopLoop(){if(!this.currentLoop)return;try{this.currentLoop.source.stop()}catch(e){}this.currentLoop=null},playLoop(k,v=.16,rate=1){this.ensureRunning();if(!this.buffers[k]||!this.ctx)return;if(this.currentLoop?.key===k)return;this.stopLoop();const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=this.buffers[k];s.loop=true;s.playbackRate.value=rate;g.gain.value=v;s.connect(g);g.connect(this.master);s.start(0);this.currentLoop={key:k,source:s,gain:g}},playSFX(k,v=.45,cool=120){this.ensureRunning();const n=performance.now();if(this.playCooldowns[k]&&n-this.playCooldowns[k]<cool)return;this.playCooldowns[k]=n;if(!this.buffers[k]||!this.ctx)return;const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=this.buffers[k];g.gain.value=v;s.connect(g);g.connect(this.master);s.start(0)}};
const GAME={state:{scene:null,sceneId:'',lineIdx:0,typing:false,textTarget:'',textCurrent:'',waitInput:false,relics:0,started:false},visuals:{char:'',charOpacity:0,targetCharOpacity:0,particles:[],cracks:[],glitchTimer:0,mood:'bedroom',tint:null,time:0},els:{canvas:document.getElementById('game-layer'),ctx:document.getElementById('game-layer').getContext('2d'),text:document.getElementById('main-text'),name:document.getElementById('char-name'),next:document.getElementById('next-icon'),choices:document.getElementById('choices-container'),glitch:document.getElementById('glitch-overlay'),relicCount:document.getElementById('relic-count'),relicHud:document.getElementById('relic-hud'),chapterHud:document.getElementById('chapter-hud'),chapOverlay:document.getElementById('chapter-overlay'),chapTitle:document.getElementById('chapter-title'),relicFlash:document.getElementById('relic-flash'),endingCard:document.getElementById('ending-card'),endingLabel:document.getElementById('ending-label')},init(){this.resize();window.addEventListener('resize',()=>this.resize());for(let i=0;i<70;i++)this.visuals.particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*2+.5,v:Math.random()*.55+.12,a:Math.random()*6});for(let i=0;i<20;i++)this.visuals.cracks.push({x:Math.random(),y:Math.random()*.72,l:20+Math.random()*90,ang:-1.2+Math.random()*2.4});requestAnimationFrame(()=>this.loop())},start(){this.state.started=true;this.state.relics=0;this.els.relicCount.innerText='0/3';this.loadScene('start')},resize(){const d=window.devicePixelRatio||1;this.els.canvas.width=innerWidth*d;this.els.canvas.height=innerHeight*d;this.els.ctx.setTransform(1,0,0,1,0,0);this.els.ctx.scale(d,d)},loadScene(id){const data=SCRIPT[id];if(!data)return;this.state.scene=data;this.state.sceneId=id;this.state.lineIdx=0;this.state.waitInput=false;this.hideEnding();this.visuals.mood=data.mood||'bedroom';this.visuals.tint=data.tint||null;if(data.chapter){this.els.chapterHud.innerText=data.chapter
