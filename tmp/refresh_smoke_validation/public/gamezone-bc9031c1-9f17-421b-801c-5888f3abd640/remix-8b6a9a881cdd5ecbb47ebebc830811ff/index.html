<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Glitch Boutique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #120f2f;
            --bg-bottom: #3a1f74;
            --panel: rgba(255, 247, 252, 0.92);
            --panel-strong: rgba(255, 255, 255, 0.97);
            --ink: #2c1447;
            --ink-soft: #704998;
            --accent: #ff71c9;
            --accent-2: #7cf0ff;
            --accent-3: #ffd166;
            --accent-deep: #9c37ff;
            --edge: rgba(255, 255, 255, 0.45);
            --shadow: rgba(24, 8, 54, 0.38);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(124, 240, 255, 0.24), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--ink);
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.18), transparent 18%),
                radial-gradient(circle at 80% 22%, rgba(255, 113, 201, 0.18), transparent 16%),
                radial-gradient(circle at 50% 78%, rgba(124, 240, 255, 0.14), transparent 22%);
            opacity: 0.9;
        }
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
            opacity: 0.28;
        }

        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        
        .font-cute { font-family: 'Exo 2', system-ui, sans-serif; }
        .font-display { font-family: 'Audiowide', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }

        /* Minimal utility layer replacing the removed Tailwind runtime */
        .absolute { position: absolute; }
        .relative { position: relative; }
        .hidden { display: none !important; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .inline-block { display: inline-block; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-end { justify-content: flex-end; }
        .justify-center { justify-content: center; }
        .justify-around { justify-content: space-around; }
        .gap-2 { gap: 0.5rem; }
        .grid { display: grid; }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .content-start { align-content: start; }
        .flex-1 { flex: 1 1 0%; min-height: 0; }
        .w-full { width: 100%; }
        .h-\[45\%\] { height: 45%; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .pb-0 { padding-bottom: 0; }
        .pb-12 { padding-bottom: 3rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-3xl { font-size: 1.875rem; }
        .leading-tight { line-height: 1.25; }
        .font-bold { font-weight: 700; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-gray-700 { color: #374151; }
        .text-pink-300 { color: #f9a8d4; }
        .text-pink-600 { color: #db2777; }
        .bg-white\/95 { background: rgba(255,255,255,0.95); }
        .bg-white\/80 { background: rgba(255,255,255,0.8); }
        .bg-white { background: #fff; }
        .bg-black { background: #000; }
        .bg-pink-500 { background: #ec4899; }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-t-\[2rem\] { border-top-left-radius: 2rem; border-top-right-radius: 2rem; }
        .border-2 { border: 2px solid transparent; }
        .border-4 { border: 4px solid transparent; }
        .border-t-2 { border-top: 2px solid transparent; }
        .border-t-8 { border-top: 8px solid transparent; }
        .border-pink-400 { border-color: #f472b6; }
        .border-pink-200 { border-color: #fbcfe8; }
        .border-dashed { border-style: dashed; }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .shadow-\[0_-10px_40px_rgba\(244\,114\,182\,0\.4\)\] { box-shadow: 0 -10px 40px rgba(244,114,182,0.4); }
        .cursor-pointer { cursor: pointer; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .overflow-y-auto { overflow-y: auto; }
        .active\:border-b-0:active { border-bottom-width: 0 !important; }
        .active\:translate-y-1:active { transform: translateY(0.25rem); }

        /* UI Styling */
        .tab-btn,
        .item-card,
        [data-action="finish"],
        [data-action="restart"] {
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease, background 0.16s ease;
        }

        .tab-btn {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .tab-active {
            background: linear-gradient(180deg, var(--accent), #ff4fb2);
            color: white;
            border-color: #fff3fe;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #8426c7, 0 0 18px rgba(255, 113, 201, 0.34);
        }

        .tab-inactive {
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(247, 224, 255, 0.95));
            color: var(--ink-soft);
            border-color: rgba(156, 55, 255, 0.14);
            box-shadow: 0 4px 0 rgba(156, 55, 255, 0.14);
        }
        
        .item-card {
            position: relative;
            overflow: hidden;
            border-color: rgba(156, 55, 255, 0.14);
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(244, 232, 255, 0.96));
            box-shadow: 0 5px 0 rgba(156, 55, 255, 0.16);
        }

        .item-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(124,240,255,0.18), transparent 45%);
            pointer-events: none;
        }

        .item-card.selected {
            border-color: var(--accent);
            background: linear-gradient(180deg, rgba(255, 238, 249, 0.98), rgba(235, 245, 255, 0.98));
            box-shadow: 0 6px 0 var(--accent), 0 0 16px rgba(124, 240, 255, 0.2);
            transform: translateY(1px) scale(0.97);
        }

        .arcade-panel {
            background: linear-gradient(180deg, var(--panel-strong), var(--panel));
            border-color: rgba(255,255,255,0.5);
            box-shadow:
                0 -12px 32px rgba(255, 113, 201, 0.22),
                0 0 0 1px rgba(124, 240, 255, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .action-chip {
            background: linear-gradient(180deg, #191126, #09070f);
            color: #ffe7fb;
            box-shadow: 0 4px 0 #3d2858, 0 0 18px rgba(124, 240, 255, 0.18);
        }

        .action-chip span {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .modal-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(248,240,255,0.9));
            color: var(--ink);
            box-shadow:
                0 20px 40px rgba(15, 4, 33, 0.3),
                0 0 0 1px rgba(255,255,255,0.55),
                inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .title-glow {
            text-shadow: 0 0 12px rgba(124, 240, 255, 0.35), 0 0 24px rgba(255, 113, 201, 0.2);
        }

        .game-badge {
            position: absolute;
            top: max(0.8rem, env(safe-area-inset-top));
            left: 0.8rem;
            z-index: 30;
            pointer-events: none;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(16, 8, 34, 0.48);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #f9f6ff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        }

        .item-emoji {
            filter: drop-shadow(0 4px 10px rgba(124, 240, 255, 0.24));
        }

        .feedback-overlay {
            position: absolute;
            inset: auto 0 calc(45% + 1rem) 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 35;
            padding: 0 1rem;
        }

        .feedback-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            max-width: min(90vw, 360px);
            padding: 0.6rem 0.85rem;
            border: 1px solid rgba(255,255,255,0.32);
            border-radius: 1.1rem;
            background: rgba(18, 10, 36, 0.72);
            color: #fff7fd;
            box-shadow: 0 16px 28px rgba(12, 4, 30, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card img {
            width: 4rem;
            height: 4rem;
            object-fit: cover;
            border-radius: 0.9rem;
            border: 2px solid rgba(255,255,255,0.28);
            flex: 0 0 auto;
            background: rgba(255,255,255,0.08);
        }

        .feedback-copy {
            min-width: 0;
        }

        .feedback-label {
            font-family: 'Audiowide', 'Orbitron', system-ui, sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #7cf0ff;
            margin-bottom: 0.18rem;
        }

        .feedback-text {
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .feedback-card.horror {
            background: rgba(32, 0, 0, 0.78);
            box-shadow: 0 14px 30px rgba(95, 0, 0, 0.34);
        }

        .feedback-card.horror .feedback-label {
            color: #ff9d9d;
        }
        
        /* Custom scrollbar for grid */
        #item-grid::-webkit-scrollbar { width: 6px; }
        #item-grid::-webkit-scrollbar-track { background: transparent; }
        #item-grid::-webkit-scrollbar-thumb { background: rgba(156, 55, 255, 0.3); border-radius: 10px; }

        .glitch-text {
            animation: glitch 0.2s infinite;
        }

        @media (max-width: 480px) {
            .game-badge { font-size: 0.72rem; padding: 0.34rem 0.6rem; }
            .tab-btn { letter-spacing: 0.03em; }
            .feedback-overlay { inset: auto 0 calc(45% + 0.6rem) 0; padding: 0 0.75rem; }
            .feedback-card { gap: 0.6rem; padding: 0.52rem 0.65rem; }
            .feedback-card img { width: 3.15rem; height: 3.15rem; }
            .feedback-text { font-size: 0.84rem; }
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>
    <div id="game-container" class="font-cute select-none">
        <canvas id="gameCanvas"></canvas>
        <div class="game-badge font-display">Glitch Boutique // neon fitting room</div>
        <!-- [agent-note][stage3] resolved-font: title/ui -> Audiowide + Exo 2 from catalogs/fonts.json -->
        <!-- [agent-note][stage3] resolved-gif: success + horror feedback -> catalogs/gifs.json -->
        <div id="feedback-overlay" class="feedback-overlay" aria-live="polite">
            <div id="feedback-card" class="feedback-card hidden">
                <img id="feedback-gif" alt="" />
                <div class="feedback-copy">
                    <div id="feedback-label" class="feedback-label">Boutique Signal</div>
                    <div id="feedback-text" class="feedback-text">Curating the next glow-up...</div>
                </div>
            </div>
        </div>
        
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-end">
            <!-- Dress Up HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <div id="hud" class="arcade-panel w-full h-[45%] backdrop-blur-md rounded-t-[2rem] border-t-8 border-pink-400 pointer-events-auto flex flex-col">
                
                <!-- Tabs -->
                <div class="flex justify-around p-3 pb-0">
                    <!-- [agent-note][stage1] role: future-audio | trigger: horror-reveal | intent: accent the sudden boutique corruption beat -->
                    <div data-action="tab" data-val="hair" class="tab-btn tab-inactive px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer">Hair</div>
                    <div data-action="tab" data-val="top" class="tab-btn tab-active px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer">Top</div>
                    <div data-action="tab" data-val="bottom" class="tab-btn tab-inactive px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer">Bottom</div>
                    <div data-action="tab" data-val="acc" class="tab-btn tab-inactive px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer">Acc</div>
                </div>

                <!-- Item Grid -->
                <div id="item-grid" class="flex-1 p-4 grid grid-cols-3 gap-3 content-start overflow-y-auto">
                    <!-- Populated by JS -->
                </div>

                <!-- Action Bar -->
                <div class="p-3 border-t-2 border-dashed border-pink-200 flex justify-center">
                    <div data-action="finish" class="action-chip px-8 py-3 rounded-2xl font-bold text-lg active:border-b-0 active:translate-y-1 flex items-center gap-2 cursor-pointer" style="border-bottom: 4px solid #0a0710;">
                        <span>✨ Lock Look ✨</span>
                    </div>
                </div>
            </div>

            <!-- Game Over / Photoshoot Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 pointer-events-auto flex flex-col items-center justify-end pb-12">
                <div class="modal-card backdrop-blur-sm p-6 rounded-3xl border-4 border-pink-400 shadow-2xl text-center mb-8 mx-4">
                    <h2 class="font-display title-glow text-3xl font-bold text-pink-600 mb-2">Look Locked!</h2>
                    <p class="text-gray-700 font-bold mb-4">Boutique snapshot approved for the neon feed.</p>
                    <div data-action="restart" class="inline-block action-chip text-white px-8 py-3 rounded-2xl font-bold text-lg active:border-b-0 active:translate-y-1 cursor-pointer" style="border-bottom: 4px solid #8426c7;">
                        Restyle 🎀
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assets -->
    <!-- [agent-note][stage3] resolved-audio: gameplay/ui/horror cues -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop=""></audio>
    <audio id="bgm_horror" data-editable="audio" data-label="Glitch Music" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_02.mp3" preload="auto" loop=""></audio>
    <audio id="sfx_tab" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3" preload="auto"></audio>
    <audio id="sfx_equip" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_finish" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
    <audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
    <audio id="sfx_horror" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>

    <script id="game-config" type="application/x-game-config">
        {
            "themeColor1": {"type":"color","label":"Gradient Top","value":"#F356AF"},
            "themeColor2": {"type":"color","label":"Gradient Bottom","value":"#354EAE"},
            "heroScale": {"type":"number","label":"Character Scale","value":0.7,"min":0.5,"max":2}
        }
    </script>

    <script>
        // --- System L0 & Config ---
        let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let initialized = false;
        let gameState = 'PLAYING'; // PLAYING, GAMEOVER
        let horrorMode = false;
        let lastTime = 0;
        let animationFrameId;

        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));
        window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const bgm_horror = document.getElementById('bgm_horror');
        const sfx = {
            tab: document.getElementById('sfx_tab'),
            equip: document.getElementById('sfx_equip'),
            finish: document.getElementById('sfx_finish'),
            restart: document.getElementById('sfx_restart'),
            horror: document.getElementById('sfx_horror')
        };
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackLabel = document.getElementById('feedback-label');
        const feedbackText = document.getElementById('feedback-text');
        const FEEDBACK_GIFS = {
            success: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp',
            horror: 'https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp'
        };
        let feedbackTimer = null;
        let loopState = 'main';

        [bgm, bgm_horror].forEach(track => {
            track.volume = 0.34;
        });
        Object.values(sfx).forEach(track => {
            track.volume = track === sfx.horror ? 0.5 : 0.62;
        });

        function primeAudioElement(audioEl) {
            if (!audioEl) return;
            audioEl.play().then(() => {
                audioEl.pause();
                audioEl.currentTime = 0;
            }).catch(() => {});
        }

        function setLoopState(mode) {
            loopState = mode;
            if (!audioUnlocked) return;

            if (mode === 'horror') {
                bgm.pause();
                bgm_horror.currentTime = 0;
                bgm_horror.play().catch(() => {});
            } else {
                bgm_horror.pause();
                bgm_horror.currentTime = 0;
                bgm.play().catch(() => {});
            }
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioCtx.resume().catch(() => {});
            primeAudioElement(bgm);
            primeAudioElement(bgm_horror);
            Object.values(sfx).forEach(primeAudioElement);
            audioUnlocked = true;
            setLoopState(loopState);
        }

        function playSfx(name) {
            if (!audioUnlocked) return;
            const audioEl = sfx[name];
            if (!audioEl) return;
            audioEl.pause();
            audioEl.currentTime = 0;
            audioEl.play().catch(() => {});
        }

        function showFeedback(type, label, text) {
            if (!feedbackCard || !feedbackGif || !feedbackLabel || !feedbackText) return;
            feedbackLabel.textContent = label;
            feedbackText.textContent = text;
            feedbackGif.src = FEEDBACK_GIFS[type];
            feedbackGif.alt = `${label} animated feedback`;
            feedbackCard.classList.remove('hidden', 'horror', 'visible');
            if (type === 'horror') {
                feedbackCard.classList.add('horror');
            }
            requestAnimationFrame(() => feedbackCard.classList.add('visible'));
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackCard.classList.remove('visible');
                setTimeout(() => feedbackCard.classList.add('hidden'), 220);
            }, 2200);
        }

        function playSynth(type) {
            if (!audioUnlocked) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'sparkle') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, now); 
                osc.frequency.setValueAtTime(1108, now + 0.05); 
                osc.frequency.setValueAtTime(1318, now + 0.1); 
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'glitch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({

        let particles = [];

        // --- Initialization & Lifecycle ---
        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                const cr = entry.contentRect;
                cw = cr.width;
                ch = cr.height;
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                
                if (!initialized) {
                    initGame();
                    initialized = true;
                    requestAnimationFrame(gameLoop);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);
        });

        function initGame() {
            bgElements = [];
            for(let i=0; i<15; i++) {
                bgElements.push({
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    size: 10 + Math.random() * 20,
                    speed: 10 + Math.random() * 20,
                    type: Math.random() > 0.5 ? 'star' : (Math.random() > 0.5 ? 'bat' : 'heart'),
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 2
                });
            }
            setState('PLAYING');
            setLoopState('main');
            renderUI();
        }

        function restartGame() {
            if (horrorMode) return; // No escape
            equipped.hair = 0; equipped.top = 0; equipped.bottom = 0; equipped.acc = 0;
            particles = [];
            playSfx('restart');
            showFeedback('success', 'Boutique Reset', 'Fresh rack loaded for another glitter run.');
            setState('PLAYING');
            renderUI();
        }

        function setState(newState) {
            if (horrorMode) return;
            gameState = newState;
            const hud = document.getElementById('hud');
            const gameOver = document.getElementById('game-over-screen');
            
            if (gameState === 'PLAYING') {
                hud.classList.remove('hidden');
                gameOver.classList.add('hidden');
                setLoopState('main');
            } else {
                hud.classList.add('hidden');
                gameOver.classList.remove('hidden');
                spawnConfetti();
                playSfx('finish');
                playSynth('sparkle');
                showFeedback('success', 'Look Locked', 'Snapshot approved — the neon feed loves it.');
                vibrate('heavy');
            }
        }

        function activateHorrorMode() {
            horrorMode = true;
            gameState = 'HORROR';
            document.getElementById('ui-layer').classList.add('hidden');
            
            playSfx('horror');
            setLoopState('horror');
            showFeedback('horror', 'Glitch Alert', 'Boutique malware detected. The fitting room turned hostile.');
            
            window.gameConfig.themeColor1 = '#2a0000';
            window.gameConfig.themeColor2 = '#000000';
            
            vibrate('heavy');
            playSynth('glitch');
            
            // Corrupt background elements
            bgElements.forEach(el => {
                el.speed *= 5;
                el.type = 'eye';
            });
        }

        // --- UI Logic ---
        function renderUI() {
            if (horrorMode) return;
            // Update Tabs
            document.querySelectorAll('[data-action="tab"]').forEach(el => {
                const val = el.getAttribute('data-val');
                if (val === currentTab) {
                    el.className = "tab-btn tab-active px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer";
                } else {
                    el.className = "tab-btn tab-inactive px-4 py-2 rounded-xl border-2 font-bold text-sm cursor-pointer";
                }
            });

            // Update Grid
            const grid = document.getElementById('item-grid');
            grid.innerHTML = '';
            inventory[currentTab].forEach(item => {
                const isEquipped = equipped[currentTab] === item.id;
                const btn = document.createElement('div');
                btn.className = `item-card flex flex-col items-center justify-center p-3 rounded-2xl border-2 bg-white cursor-pointer ${isEquipped ? 'selected' : 'border-pink-200'}`;
                btn.setAttribute('data-action', 'equip');
                btn.setAttribute('data-val', item.id);
                btn.innerHTML = `
                    <div class="item-emoji text-3xl mb-1">${item.icon}</div>
                    <div class="text-xs font-bold text-gray-700 text-center leading-tight">${item.name}</div>
                `;
                grid.appendChild(btn);
            });
        }

        // --- Input Routing ---
        function handleGlobalInput(e) {
            const pointX = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX);
            const pointY = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY);
            const target = pointX != null && pointY != null ? document.elementFromPoint(pointX, pointY) : e.target;
            const btn = target && target.closest ? target.closest('[data-action]') : null;

            if (!btn) {
                e.preventDefault();
            }

            unlockAudio();

            if (horrorMode) {
                playSynth('glitch');
                vibrate('heavy');
                spawnClickParticles(pointX ?? cw / 2, pointY ?? ch / 2, true);
                return;
            }

            const touchX = pointX;
            const touchY = pointY;
            if (touchX == null || touchY == null) return;

            if (gameState === 'GAMEOVER') {
                if (btn && btn.getAttribute('data-action') === 'restart') {
                    restartGame();
                }
                return;
            }

            if (gameState === 'PLAYING') {
                if (btn) {
                    const action = btn.getAttribute('data-action');
                    const val = btn.getAttribute('data-val');
                    
                    if (action === 'tab') {
                        currentTab = val;
                        playSfx('tab');
                        vibrate('light');
                        renderUI();
                    } else if (action === 'equip') {
                        const id = parseInt(val);
                        
                        // HORROR VIRUS TRIGGER
                        if (currentTab === 'bottom' && id === 2) {
                            activateHorrorMode();
                            return;
                        }

                        if (equipped[currentTab] !== id) {
                            equipped[currentTab] = id;
                            playSfx('equip');
                            playSynth('pop');
                            vibrate('light');
                            spawnEquipParticles();
                            showFeedback('success', 'Style Sync', `${inventory[currentTab][id].name} is now live on the runway.`);
                            renderUI();
                        }
                    } else if (action === 'finish') {
                        setState('GAMEOVER');
                    }
                } else {
                    playSynth('pop');
                    vibrate('light');
                    spawnClickParticles(touchX, touchY);
                }
            }
        }

        // [agent-note][stage4] repaired: mobile-action-path | issue: global preventDefault blocked native tap lifecycle | action: preserve native button taps and only suppress non-UI canvas presses
        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgm.pause();
                bgm_horror.pause();
                return;
            }
            setLoopState(loopState);
        });

        // --- Particles ---
        function spawnEquipParticles() {
            const cx = cw / 2;
            const cy = ch * 0.4;
            for(let i=0; i<12; i++) {
                const angle = (Math.PI * 2 / 12) * i;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * 200, vy: Math.sin(angle) * 200,
                    life: 1.0, type: 'star', color: '#FCD34D'
                });
            }
        }

        function spawnClickParticles(x, y, isHorror = false) {
            for(let i=0; i<5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 50 + Math.random() * 100;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1.0, type: isHorror ? 'glitch' : 'circle', 
                    color: isHorror ? '#FF0000' : '#F472B6'
                });
            }
        }

        function spawnConfetti() {
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * cw, y: -20 - Math.random() * 100,
                    vx: (Math.random() - 0.5) * 100, vy: 100 + Math.random() * 200,
                    life: 3.0, type: 'confetti', 
                    color: ['#F472B6', '#60A5FA', '#34D399', '#FCD34D'][Math.floor(Math.random()*4)],
                    rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 10
                });
            }
        }

        // --- Drawing Routines ---
        function drawCharacter(dt, now) {
            const cx = cw / 2;
            const baseY = (gameState === 'PLAYING' || horrorMode) ? ch * 0.35 : ch * 0.5;
            const breathe = horrorMode ? (Math.random()-0.5)*5 : Math.sin(now * 3) * 3;
            const scale = window.gameConfig.heroScale * Math.min(cw/400, ch/800);

            ctx.save();
            ctx.translate(cx, baseY + breathe);
            ctx.scale(scale, scale);

            if (horrorMode && Math.random() > 0.8) {
                ctx.translate((Math.random()-0.5)*20, (Math.random()-0.5)*20);
                ctx.scale(1 + (Math.random()-0.5)*0.1, 1 + (Math.random()-0.5)*0.1);
            }

            ctx.shadowColor = horrorMode ? '#FF0000' : 'rgba(0,0,0,0.15)';
            ctx.shadowBlur = horrorMode ? 30 : 15;
            ctx.shadowOffsetY = 10;

            // --- Back Hair ---
            if (equipped.hair === 0) { 
                ctx.fillStyle = horrorMode ? '#330000' : '#FFB7B2';
                ctx.beginPath(); ctx.arc(-60, -20, 40, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(60, -20, 40, 0, Math.PI*2); ctx.fill();
            } else if (equipped.hair === 1) { 
                ctx.fillStyle = '#2C2C2C';
                ctx.fillRect(-55, -60, 110, 140);
            } else if (equipped.hair === 2) { 
                ctx.fillStyle = horrorMode ? '#113322' : '#B5EAD7';
                ctx.beginPath(); ctx.arc(-50, -10, 50, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(50, -10, 50, 0, Math.PI*2); ctx.fill();
            } else if (equipped.hair === 3) { 
                ctx.fillStyle = horrorMode ? '#113311' : '#A0E8AF';
                ctx.beginPath(); ctx.arc(-45, -65, 30, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(45, -65, 30, 0, Math.PI*2); ctx.fill();
            } else if (equipped.hair === 4) { 
                ctx.fillStyle = horrorMode ? '#440022' : '#FF9CEE';
                ctx.beginPath(); ctx.roundRect(-65, -40, 130, 180, 20); ctx.fill();
            } else if (equipped.hair === 5) { 
                ctx.fillStyle = '#4A4A4A';
                ctx.beginPath(); ctx.roundRect(-55, -50, 110, 90, 20); ctx.fill();
            } else if (equipped.hair === 6) { 
                ctx.fillStyle = horrorMode ? '#331111' : '#FFD1DC';
                ctx.beginPath(); ctx.moveTo(-40, -40); ctx.lineTo(-70, 80); ctx.lineTo(-30, 80); ctx.fill();
                ctx.beginPath(); ctx.moveTo(40, -40); ctx.lineTo(70, 80); ctx.lineTo(30, 80); ctx.fill();
            } else if (equipped.hair === 7) { 
                ctx.fillStyle = horrorMode ? '#221100' : '#8B4513';
                ctx.beginPath(); ctx.arc(0, -75, 35, 0, Math.PI*2); ctx.fill();
            } else if (equipped.hair === 8) { 
                ctx.fillStyle = horrorMode ? '#440044' : '#FF00FF';
                for(let i=0; i<7; i++) {
                    const a = Math.PI + (Math.PI/6)*i;
                    ctx.beginPath(); ctx.moveTo(0, -40); 
                    ctx.lineTo(Math.cos(a)*80, Math.sin(a)*80 - 40);
                    ctx.lineTo(Math.cos(a+0.2)*40, Math.sin(a+0.2)*40 - 40);
                    ctx.fill();
                }
            } else if (equipped.hair === 9) { 
                ctx.fillStyle = horrorMode ? '#332211' : '#E8C396';
                ctx.beginPath(); ctx.roundRect(-65, -20, 25, 120, 10); ctx.fill();
                ctx.beginPath(); ctx.roundRect(40, -20, 25, 120, 10); ctx.fill();
            }

            ctx.shadowColor = 'transparent';

            // --- Body Base ---
            const skin = horrorMode ? '#888888' : '#FFE4E1';
            ctx.fillStyle = skin;
            // Legs
            ctx.beginPath(); ctx.roundRect(-25, 60, 20, 60, 10); ctx.fill();
            ctx.beginPath(); ctx.roundRect(5, 60, 20, 60, 10); ctx.fill();
            // Arms
            ctx.beginPath(); ctx.roundRect(-45, 20, 20, 50, 10); ctx.fill();
            ctx.beginPath(); ctx.roundRect(25, 20, 20, 50, 10); ctx.fill();
            // Torso
            ctx.beginPath(); ctx.roundRect(-30, 10, 60, 60, 20); ctx.fill();
            
            // --- Bottom ---
            if (equipped.bottom === 0) { 
                ctx.fillStyle = '#FFB7B2';
                ctx.beginPath(); ctx.moveTo(-40, 50); ctx.lineTo(40, 50); ctx.lineTo(50, 80); ctx.lineTo(-50, 80); ctx.fill();
            } else if (equipped.bottom === 1) { 
                ctx.fillStyle = '#333333';
                ctx.beginPath(); ctx.moveTo(-35, 50); ctx.lineTo(35, 50); ctx.lineTo(45, 75); ctx.lineTo(-45, 75); ctx.fill();
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-20, 50); ctx.lineTo(-25, 75); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, 50); ctx.lineTo(25, 75); ctx.stroke();
            } else if (equipped.bottom === 2) { // Panties (Triggered horror)
                ctx.fillStyle = horrorMode ? '#440000' : '#FFFFFF';
                ctx.beginPath(); ctx.roundRect(-30, 50, 60, 25, 10); ctx.fill();
            } else if (equipped.bottom === 3) { 
                ctx.fillStyle = '#5D8AA8';
                ctx.beginPath(); ctx.roundRect(-32, 45, 30, 30, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(2, 45, 30, 30, 5); ctx.fill();
            } else if (equipped.bottom === 4) { 
                ctx.fillStyle = '#B39EB5';
                ctx.beginPath(); ctx.moveTo(-35, 50); ctx.lineTo(35, 50); ctx.lineTo(50, 115); ctx.lineTo(-50, 115); ctx.fill();
            } else if (equipped.bottom === 5) { 
                ctx.fillStyle = '#000080';
                ctx.beginPath(); ctx.moveTo(-35, 50); ctx.lineTo(35, 50); ctx.lineTo(45, 80); ctx.lineTo(-45, 80); ctx.fill();
                ctx.strokeStyle = '#000050'; ctx.lineWidth = 2;
                for(let i=-30; i<=30; i+=15) { ctx.beginPath(); ctx.moveTo(i, 50); ctx.lineTo(i*1.2, 80); ctx.stroke(); }
            } else if (equipped.bottom === 6) { 
                ctx.fillStyle = '#4169E1';
                ctx.beginPath(); ctx.roundRect(-26, 50, 22, 65, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(4, 50, 22, 65, 5); ctx.fill();
            } else if (equipped.bottom === 7) { 
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath(); ctx.roundRect(-25, 50, 20, 60, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(5, 50, 20, 60, 5); ctx.fill();
            } else if (equipped.bottom === 8) { 
                ctx.fillStyle = 'rgba(255, 192, 203, 0.8)';
                ctx.beginPath(); ctx.ellipse(0, 65, 55, 20, 0, 0, Math.PI*2); ctx.fill();
            } else if (equipped.bottom === 9) { 
                ctx.fillStyle = '#556B2F';
                ctx.beginPath(); ctx.roundRect(-30, 50, 26, 65, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(4, 50, 26, 65, 5); ctx.fill();
            }

            // --- Top ---
            if (equipped.top === 0) { 
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.roundRect(-32, 10, 64, 45, 15); ctx.fill();
                ctx.fillStyle = '#F472B6';
                ctx.beginPath(); ctx.arc(0, 25, 5, 0, Math.PI*2); ctx.fill(); 
            } else if (equipped.top === 1) { 
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath(); ctx.roundRect(-30, 10, 60, 40, 10); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-30, 20); ctx.lineTo(-70, 0); ctx.lineTo(-50, 30); ctx.fill();
                ctx.beginPath(); ctx.moveTo(30, 20); ctx.lineTo(70, 0); ctx.lineTo(50, 30); ctx.fill();
            } else if (equipped.top === 2) { 
                ctx.fillStyle = '#C7CEEA';
                ctx.beginPath(); ctx.roundRect(-40, 5, 80, 60, 25); ctx.fill();
                ctx.beginPath(); ctx.roundRect(-55, 15, 30, 60, 15); ctx.fill();
                ctx.beginPath(); ctx.roundRect(25, 15, 30, 60, 15); ctx.fill();
            } else if (equipped.top === 3) { 
                ctx.fillStyle = '#FF6666';
                ctx.beginPath(); ctx.roundRect(-30, 10, 60, 25, 8); ctx.fill();
            } else if (equipped.top === 4) { 
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.roundRect(-30, 10, 60, 40, 10); ctx.fill();
                ctx.fillStyle = '#85E3FF';
                ctx.beginPath(); ctx.moveTo(-30, 10); ctx.lineTo(0, 35); ctx.lineTo(30, 10); ctx.fill();
            } else if (equipped.top === 5) { 
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath(); ctx.roundRect(-35, 5, 70, 55, 15); ctx.fill();
                ctx.beginPath(); ctx.roundRect(-48, 15, 20, 50, 10); ctx.fill();
                ctx.beginPath(); ctx.roundRect(28, 15, 20, 50, 10); ctx.fill();
            } else if (equipped.top === 6) { 
                ctx.fillStyle = '#FFFFFF'; 
                ctx.beginPath(); ctx.roundRect(-30, 10, 60, 40, 5); ctx.fill();
                ctx.fillStyle = '#800080';
                ctx.beginPath(); ctx.moveTo(-25, 20); ctx.lineTo(25, 20); ctx.lineTo(20, 50); ctx.lineTo(0, 55); ctx.lineTo(-20, 50); ctx.fill();
            } else if (equipped.top === 7) { 
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.roundRect(-32, 10, 64, 40, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(-45, 10, 20, 20, 5); ctx.fill();
                ctx.beginPath(); ctx.roundRect(25, 10, 20, 20, 5); ctx.fill();
            } else if (equipped.top === 8) { 
                ctx.fillStyle = '#FFFACD';
                ctx.beginPath(); ctx.roundRect(-35, 8, 70, 50, 20); ctx.fill();
                ctx.beginPath(); ctx.roundRect(-50, 15, 25, 55, 10); ctx.fill();
                ctx.beginPath(); ctx.roundRect(25, 15, 25, 55, 10); ctx.fill();
            } else if (equipped.top === 9) { 
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.roundRect(-25, 15, 50, 35, 5); ctx.fill();
            }

            // --- Head ---
            ctx.fillStyle = skin;
            ctx.beginPath(); ctx.arc(0, -40, 45, 0, Math.PI*2); ctx.fill();
            
            // Face
            if (horrorMode) {
                // Hollow eyes
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.ellipse(-15, -35, 8, 14, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(15, -35, 8, 14, 0, 0, Math.PI*2); ctx.fill();
                // Red dots
                ctx.fillStyle = '#FF0000';
                ctx.beginPath(); ctx.arc(-15, -35, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, -35, 2, 0, Math.PI*2); ctx.fill();
                // Bleeding
                ctx.fillRect(-16, -25, 2, 25);
                ctx.fillRect(14, -25, 2, 25);
                // Gaping mouth
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.ellipse(0, -15, 12, 18, 0, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath(); ctx.ellipse(-15, -35, 6, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(15, -35, 6, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(-17, -38, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(13, -38, 2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(255, 182, 193, 0.6)';
                ctx.beginPath(); ctx.ellipse(-25, -25, 8, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(25, -25, 8, 4, 0, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, -25, 4, 0, Math.PI, false); ctx.stroke();
            }

            // --- Front Hair ---
            if (equipped.hair === 0) { 
                ctx.fillStyle = horrorMode ? '#330000' : '#FFB7B2';
                ctx.beginPath(); ctx.arc(0, -60, 45, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-45, -60); ctx.lineTo(-20, -30); ctx.lineTo(0, -60); ctx.fill();
                ctx.beginPath(); ctx.moveTo(45, -60); ctx.lineTo(20, -30); ctx.lineTo(0, -60); ctx.fill();
            } else if (equipped.hair === 1) { 
                ctx.fillStyle = '#2C2C2C';
                ctx.beginPath(); ctx.arc(0, -60, 46, Math.PI, Math.PI*2); ctx.fill();
                ctx.fillRect(-46, -60, 92, 20);
            } else if (equipped.hair === 2) { 
                ctx.fillStyle = horrorMode ? '#113322' : '#B5EAD7';
                ctx.beginPath(); ctx.arc(0, -65, 50, Math.PI, Math.PI*2); ctx.fill();
                for(let i=-40; i<=40; i+=20) {
                    ctx.beginPath(); ctx.arc(i, -50, 15, 0, Math.PI*2); ctx.fill();
                }
            } else if (equipped.hair === 3) { 
                ctx.fillStyle = horrorMode ? '#113311' : '#A0E8AF';
                ctx.beginPath(); ctx.arc(0, -60, 45, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-10, -60); ctx.lineTo(0, -45); ctx.lineTo(10, -60); ctx.fill(); 
            } else if (equipped.hair === 4) { 
                ctx.fillStyle = horrorMode ? '#440022' : '#FF9CEE';
                ctx.beginPath(); ctx.arc(0, -60, 46, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-46, -60); ctx.lineTo(-30, -20); ctx.lineTo(10, -60); ctx.fill();
            } else if (equipped.hair === 5) { 
                ctx.fillStyle = '#4A4A4A';
                ctx.beginPath(); ctx.arc(0, -60, 46, Math.PI, Math.PI*2); ctx.fill();
                ctx.fillRect(-46, -60, 92, 25);
            } else if (equipped.hair === 6) { 
                ctx.fillStyle = horrorMode ? '#331111' : '#FFD1DC';
                ctx.beginPath(); ctx.arc(0, -60, 45, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-45, -60); ctx.lineTo(0, -35); ctx.lineTo(45, -60); ctx.fill();
            } else if (equipped.hair === 7) { 
                ctx.fillStyle = horrorMode ? '#221100' : '#8B4513';
                ctx.beginPath(); ctx.arc(0, -60, 45, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-20, -60); ctx.lineTo(-30, -30); ctx.lineTo(-40, -60); ctx.fill();
                ctx.beginPath(); ctx.moveTo(20, -60); ctx.lineTo(30, -30); ctx.lineTo(40, -60); ctx.fill();
            } else if (equipped.hair === 8) { 
                ctx.fillStyle = horrorMode ? '#440044' : '#FF00FF';
                ctx.beginPath(); ctx.moveTo(-40, -60); ctx.lineTo(-20, -30); ctx.lineTo(0, -60); ctx.fill();
                ctx.beginPath(); ctx.moveTo(10, -60); ctx.lineTo(30, -20); ctx.lineTo(40, -60); ctx.fill();
            } else if (equipped.hair === 9) { 
                ctx.fillStyle = horrorMode ? '#332211' : '#E8C396';
                ctx.beginPath(); ctx.arc(0, -60, 45, Math.PI, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-45, -60); ctx.lineTo(0, -40); ctx.lineTo(45, -60); ctx.fill();
            }

            // --- Accessories ---
            if (equipped.acc === 1) { 
                ctx.fillStyle = '#FFD700';
                drawStar(ctx, -30, -50, 5, 10, 5);
                drawStar(ctx, 30, -60, 4, 8, 5);
            } else if (equipped.acc === 2) { 
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(25, -55, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath(); ctx.arc(21, -57, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(29, -57, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(21, -50, 8, 4);
            } else if (equipped.acc === 3) { 
                ctx.fillStyle = '#1A1A1A';
                ctx.beginPath(); ctx.moveTo(-15, -75); ctx.lineTo(-35, -100); ctx.lineTo(-40, -65); ctx.fill();
                ctx.beginPath(); ctx.moveTo(15, -75); ctx.lineTo(35, -100); ctx.lineTo(40, -65); ctx.fill();
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath(); ctx.moveTo(-20, -75); ctx.lineTo(-32, -90); ctx.lineTo(-35, -68); ctx.fill();
                ctx.beginPath(); ctx.moveTo(20, -75); ctx.lineTo(32, -90); ctx.lineTo(35, -68); ctx.fill();
            } else if (equipped.acc === 4) { 
                ctx.fillStyle = '#000000';
                ctx.fillRect(-12, 2, 24, 6);
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(0, 5, 4, 0, Math.PI*2); ctx.fill();
            } else if (equipped.acc === 5) { 
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 3;
                ctx.strokeRect(-25, -45, 20, 14);
                ctx.strokeRect(5, -45, 20, 14);
                ctx.beginPath(); ctx.moveTo(-5, -38); ctx.lineTo(5, -38); ctx.stroke();
            } else if (equipped.acc === 6) { 
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(-12, -32, 24, 8);
                ctx.fillStyle = '#FFC0CB';
                ctx.fillRect(-4, -30, 8, 4);
            } else if (equipped.acc === 7) { 
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.ellipse(0, -100, 30, 10, 0, 0, Math.PI*2); ctx.stroke();
            } else if (equipped.acc === 8) { 
                ctx.fillStyle = '#FF0000';
                ctx.beginPath(); ctx.moveTo(-15, -75); ctx.lineTo(-25, -105); ctx.lineTo(-35, -70); ctx.fill();
                ctx.beginPath(); ctx.moveTo(15, -75); ctx.lineTo(25, -105); ctx.lineTo(35, -70); ctx.fill();
            } else if (equipped.acc === 9) { 
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath(); ctx.arc(-45, -40, 15, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(45, -40, 15, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#FF69B4'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(0, -40, 45, Math.PI, Math.PI*2); ctx.stroke();
            }

            ctx.restore();
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        // --- Main Loop ---
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            dt = Math.min(dt, 0.05);
            lastTime = timestamp;
            const now = timestamp / 1000;

            try {
                ctx.save();
                
                if (horrorMode) {
                    ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
                }

                // Background
                const grad = ctx.createLinearGradient(0, 0, 0, ch);
                grad.addColorStop(0, window.gameConfig.themeColor1);
                grad.addColorStop(1, window.gameConfig.themeColor2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);

                // Parallax BG Elements
                ctx.fillStyle = horrorMode ? 'rgba(255,0,0,0.3)' : 'rgba(255,255,255,0.3)';
                bgElements.forEach(el => {
                    el.y -= el.speed * dt;
                    el.rot += el.rotSpeed * dt;
                    if (el.y < -50) { el.y = ch + 50; el.x = Math.random() * cw; }
                    
                    ctx.save();
                    ctx.translate(el.x, el.y);
                    ctx.rotate(el.rot);
                    if (el.type === 'star') {
                        drawStar(ctx, 0, 0, 4, el.size, el.size/2);
                    } else if (el.type === 'bat') {
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-el.size, -el.size/2); ctx.lineTo(-el.size/2, el.size/2); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(el.size, -el.size/2); ctx.lineTo(el.size/2, el.size/2); ctx.fill();
                    } else if (el.type === 'eye') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath(); ctx.ellipse(0, 0, el.size, el.size/2, 0, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#FF0000';
                        ctx.beginPath(); ctx.arc(0, 0, el.size/3, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#000000';
                        ctx.beginPath(); ctx.arc(0, 0, el.size/6, 0, Math.PI*2); ctx.fill();
                    } else {
                        ctx.beginPath(); ctx.arc(0, 0, el.size/2, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                });

                // Character
                drawCharacter(dt, now);

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    
                    if (p.type === 'confetti') {
                        p.vy += 400 * dt; 
                        p.rot += p.rotSpeed * dt;
                    }

                    if (p.life <= 0 || p.y > ch + 50) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.translate(p.x, p.y);
                    if (p.type === 'star') {
                        drawStar(ctx, 0, 0, 5, 10, 4);
                    } else if (p.type === 'confetti') {
                        ctx.rotate(p.rot);
                        ctx.fillRect(-5, -10, 10, 20);
                    } else if (p.type === 'glitch') {
                        ctx.fillRect(-10, -2, 20, 4);
                        ctx.fillRect(-2, -10, 4, 20);
                    } else {
                        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                }

                // Glitch Overlays
                if (horrorMode && Math.random() > 0.7) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${Math.random()*0.5})`;
                    ctx.fillRect(0, Math.random()*ch, cw, Math.random()*100);
                    ctx.fillStyle = `rgba(255, 0, 0, ${Math.random()*0.3})`;
                    ctx.fillRect(0, Math.random()*ch, cw, Math.random()*50);
                }

                ctx.restore();
            } catch (e) {
                console.error("Loop error isolated:", e);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
