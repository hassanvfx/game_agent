<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>007n7: Arcade Recon</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --spy-green: #6bffb8;
            --spy-red: #ff4d8d;
            --spy-gold: #ffe27a;
            --spy-dark: #050816;
            --spy-deep: #0c1330;
            --spy-panel: rgba(8, 18, 38, 0.82);
            --spy-panel-border: rgba(107, 255, 184, 0.28);
            --spy-cyan: #65d9ff;
            --glass: rgba(20, 20, 20, 0.85);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        body {
            background:
                radial-gradient(circle at top, rgba(101, 217, 255, 0.14), transparent 34%),
                radial-gradient(circle at 20% 80%, rgba(255, 77, 141, 0.12), transparent 30%),
                linear-gradient(180deg, #040611 0%, #050816 52%, #090f22 100%);
            color: var(--spy-green);
            font-family: "Exo 2", system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        button {
            font: inherit;
        }
        .glass {
            background:
                linear-gradient(180deg, rgba(13, 27, 54, 0.92), rgba(8, 16, 33, 0.82));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--spy-panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 12px 28px rgba(0, 0, 0, 0.32),
                0 0 22px rgba(101, 217, 255, 0.08);
        }
        .scanline {
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18)),
                linear-gradient(90deg, rgba(101, 217, 255, 0.03), rgba(255,255,255,0), rgba(107, 255, 184, 0.03));
            background-size: 100% 4px, 100% 100%;
            mix-blend-mode: screen;
            pointer-events: none;
        }
        .crt-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
        }
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at top, rgba(101, 217, 255, 0.08), transparent 35%), #000;
            overflow: hidden;
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
            pointer-events: none;
        }
        #ui-layer > * { pointer-events: auto; }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 1rem;
        }
        .hud-card {
            padding: 0.75rem 1rem;
            border-radius: 0.9rem;
            min-width: 8rem;
        }
        .hud-card.right {
            text-align: right;
        }
        .label {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            opacity: 0.78;
            font-weight: 600;
            color: var(--spy-cyan);
        }
        .hud-value {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 700;
            font-family: "Orbitron", system-ui, sans-serif;
            line-height: 1;
        }
        .status-value {
            font-size: clamp(1rem, 3vw, 1.35rem);
            font-weight: 600;
            color: #fff;
            max-width: 9rem;
            line-height: 1.05;
        }
        .hud-text { text-shadow: 0 0 5px var(--spy-green), 0 0 14px rgba(107, 255, 184, 0.5); }
        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #game-over-screen.hidden {
            display: none;
        }
        .report-panel {
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            border: 2px solid rgba(107, 255, 184, 0.58);
            box-shadow: 0 0 30px rgba(101, 217, 255, 0.22);
            max-width: min(90vw, 30rem);
            position: relative;
            overflow: hidden;
        }
        .report-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 400;
            font-family: "Orbitron", system-ui, sans-serif;
            color: #fff;
        }
        .report-score {
            margin-bottom: 1rem;
            font-size: clamp(3.5rem, 10vw, 4.5rem);
            font-weight: 400;
            font-family: "Orbitron", system-ui, sans-serif;
            color: var(--spy-green);
            text-shadow: 0 0 18px rgba(107, 255, 184, 0.4);
        }
        .report-subtitle {
            margin-bottom: 2rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: #d1d5db;
            line-height: 1.5;
        }
        .primary-btn {
            border: 0;
            background: linear-gradient(135deg, var(--spy-green), var(--spy-cyan));
            color: #03111d;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            padding: 1rem 2.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(101, 217, 255, 0.24);
            transition: transform 0.2s ease, filter 0.2s ease, background-color 0.2s ease;
        }
        .primary-btn:hover,
        .primary-btn:active {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }
        #instructions {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 25%;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .instruction-pill {
            display: inline-block;
            padding: 0.9rem 1.5rem;
            border-radius: 999px;
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 700;
            color: #fff;
            border: 1px solid rgba(255, 226, 122, 0.32);
            box-shadow: 0 0 18px rgba(255, 226, 122, 0.12);
            animation: pulse 1.2s infinite;
        }
        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.82; transform: scale(1.02); }
        }
        #gif-overlay {
            position: absolute;
            right: clamp(0.6rem, 2vw, 1rem);
            bottom: clamp(5.5rem, 18vh, 8rem);
            z-index: 12;
            width: min(28vw, 7rem);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.45rem;
            pointer-events: none;
        }
        .feedback-gif {
            width: 100%;
            border-radius: 0.85rem;
            border: 1px solid rgba(101, 217, 255, 0.35);
            box-shadow: 0 0 18px rgba(101, 217, 255, 0.14);
            background: rgba(6, 11, 24, 0.62);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        .feedback-caption {
            padding: 0.3rem 0.55rem;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #fff;
            background: rgba(5, 8, 22, 0.78);
            border: 1px solid rgba(255, 226, 122, 0.24);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .feedback-caption.active {
            opacity: 1;
            transform: translateY(0);
        }
        .report-panel::before,
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 15%, rgba(101, 217, 255, 0.18), transparent 18%),
                radial-gradient(circle at 82% 22%, rgba(255, 226, 122, 0.12), transparent 14%),
                radial-gradient(circle at 50% 100%, rgba(107, 255, 184, 0.08), transparent 28%);
        }
        #game-container::before {
            z-index: 1;
        }
        #gameCanvas,
        .scanline,
        #ui-layer {
            position: relative;
            z-index: 2;
        }
        @media (max-width: 640px) {
            #ui-layer {
                padding: 0.75rem;
            }
            #hud {
                gap: 0.5rem;
            }
            .hud-card {
                padding: 0.65rem 0.8rem;
            }
            .label {
                font-size: 0.6rem;
            }
            #gif-overlay {
                width: min(32vw, 5.5rem);
                bottom: 7rem;
            }
            .feedback-caption {
                font-size: 0.58rem;
                letter-spacing: 0.12em;
            }
            .report-panel {
                padding: 1.5rem;
            }
            .primary-btn {
                width: 100%;
            }
        }
    </style>

<script>
/**
 * Arcade Recon
 * A mobile-first rooftop recon launcher.
 */

// --- System Invariants ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// --- State & Config ---
const GAME_STATE = {
    IDLE: 'IDLE',
    POWER: 'POWER',
    ANGLE: 'ANGLE',
    FLYING: 'FLYING',
    RESULT: 'RESULT'
};

let gameState = GAME_STATE.IDLE;
let gameTime = 0;
let lastTime = 0;
let initialized = false;

// Config Proxy
const config = {
    gravity: 0.5,
    maxPower: 28,
    minPower: 10,
    maxAngle: 80,
    minAngle: 10,
    groundFriction: 0.96,
    elasticity: 0.7,
    themeColor: '#00ff41'
};

// --- Audio / Feedback System (Gesture-Safe) ---
const AudioCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioCtor ? new AudioCtor() : null;
const audioBuffers = {};
const audioLastPlayedAt = {};
let audioUnlocked = false;

const AUDIO_CONFIG = {
    sfx_launch: { volume: 0.7, debounceMs: 120 },
    sfx_bounce: { volume: 0.52, debounceMs: 140 },
    sfx_ui: { volume: 0.42, debounceMs: 90 },
    sfx_result: { volume: 0.64, debounceMs: 320 }
};

const GIF_KEYS = {
    impact: 'impact',
    result: 'result'
};

let feedbackGifTimer = 0;

async function loadAudio(id, url) {
    if (!audioCtx) return;
    try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (e) {
        console.warn('Audio load failed:', id, e);
    }
}

function playSfx(id, detune = 0) {
    if (!audioCtx || !audioUnlocked || !audioBuffers[id]) return;
    const settings = AUDIO_CONFIG[id] || { volume: 0.55, debounceMs: 0 };
    const now = performance.now();
    if (settings.debounceMs && now - (audioLastPlayedAt[id] || 0) < settings.debounceMs) return;
    audioLastPlayedAt[id] = now;

    try {
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[id];
        source.detune.value = detune;

        const gain = audioCtx.createGain();
        gain.gain.value = settings.volume;

        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } catch (e) {
        console.warn('Audio play failed:', id, e);
    }
}

function setBgmState(shouldPlay) {
    const bgmEl = document.getElementById('bgm_main');
    if (!bgmEl) return;
    bgmEl.volume = 0.3;

    if (!shouldPlay) {
        bgmEl.pause();
        return;
    }

    if (!audioUnlocked) return;
    bgmEl.play().catch(() => {});
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    audioUnlocked = true;
    setBgmState(gameState !== GAME_STATE.RESULT);
}

function showFeedbackGif(kind, caption, duration = 900) {
    const impactGif = document.getElementById('impact-gif');
    const resultGif = document.getElementById('result-gif');
    const captionEl = document.getElementById('gif-caption');
    if (!impactGif || !resultGif || !captionEl) return;

    impactGif.classList.toggle('active', kind === GIF_KEYS.impact);
    resultGif.classList.toggle('active', kind === GIF_KEYS.result);
    captionEl.textContent = caption;
    captionEl.classList.add('active');
    feedbackGifTimer = duration;
}

function clearFeedbackGif() {
    const impactGif = document.getElementById('impact-gif');
    const resultGif = document.getElementById('result-gif');
    const captionEl = document.getElementById('gif-caption');
    if (!impactGif || !resultGif || !captionEl) return;

    impactGif.classList.remove('active');
    resultGif.classList.remove('active');
    captionEl.classList.remove('active');
}

// --- Vibration ---
function vibrate(type) {
    if (!window.navigator.vibrate) return;
    switch (type) {
        case 'light': navigator.vibrate(10); break;
        case 'medium': navigator.vibrate(40); break;
        case 'heavy': navigator.vibrate([50, 50, 50]); break;
    }
}

// --- Game Entities ---
const camera = { x: 0, y: 0, shake: 0 };
const world = {
    groundY: 0,
    gravity: 0,
    wind: 0
};

const hero = {
    x: 0, y: 0,
    width: 60, height: 100,
    state: 'idle', // idle, kick
    animTimer: 0
};

const ball = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    radius: 15,
    rotation: 0,
    active: false,
    face: '😎' // Coolkid face
};

const gauge = {
    power: 0,
    powerDir: 1,
    angle: 45,
    angleDir: 1,
    speed: 1.5 // oscillation speed
};

const particles = [];

// --- Lifecycle ---

function initGame() {
    // Reset state
    gameState = GAME_STATE.IDLE;
    ball.active = false;
    ball.vx = 0;
    ball.vy = 0;
    ball.rotation = 0;
    camera.x = 0;
    camera.shake = 0;
    clearFeedbackGif();
    
    // Position entities
    world.groundY = ch * 0.85;
    hero.x = cw * 0.15;
    hero.y = world.groundY;
    
    ball.x = hero.x + 40;
    ball.y = world.groundY - ball.radius;
    
    // UI Reset
    updateHUD();
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('instructions').style.opacity = '1';
    document.querySelector('#instructions div').innerText = "TAP TO START SCAN";
    
    // Config sync
    if (window.gameConfig) {
        Object.assign(config, window.gameConfig);
    }
}

function restartGame() {
    initGame();
}

// --- Logic ---

function update(dt) {
    gameTime += dt;
    
    // Camera Shake Decay
    if (camera.shake > 0) camera.shake *= 0.9;
    if (camera.shake < 0.5) camera.shake = 0;

    // Hero Animation
    if (hero.state === 'kick') {
        hero.animTimer += dt;
        if (hero.animTimer > 0.5) {
            hero.state = 'idle';
        }
    }

    // State Machine
    switch (gameState) {
        case GAME_STATE.POWER:
            gauge.power += gauge.speed * 60 * dt * gauge.powerDir;
            if (gauge.power >= 100) { gauge.power = 100; gauge.powerDir = -1; }
            if (gauge.power <= 0) { gauge.power = 0; gauge.powerDir = 1; }
            break;
            
        case GAME_STATE.ANGLE:
            gauge.angle += gauge.speed * 40 * dt * gauge.angleDir;
            if (gauge.angle >= config.maxAngle) { gauge.angle = config.maxAngle; gauge.angleDir = -1; }
            if (gauge.angle <= config.minAngle) { gauge.angle = config.minAngle; gauge.angleDir = 1; }
            break;
            
        case GAME_STATE.FLYING:
            updatePhysics(dt);
            break;
    }
    
    if (feedbackGifTimer > 0) {
        feedbackGifTimer -= dt * 1000;
        if (feedbackGifTimer <= 0) {
            clearFeedbackGif();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Camera Follow
    let targetCamX = ball.x - cw * 0.3;
    if (targetCamX < 0) targetCamX = 0;
    camera.x += (targetCamX - camera.x) * 0.1; // Smooth follow
}

function updatePhysics(dt) {
    // Gravity
    ball.vy += config.gravity * 60 * dt;
    
    // Movement
    ball.x += ball.vx * 60 * dt;
    ball.y += ball.vy * 60 * dt;
    
    // Rotation based on speed
    ball.rotation += (ball.vx * 0.05) * 60 * dt;

    // Ground Collision
    if (ball.y + ball.radius > world.groundY) {
        ball.y = world.groundY - ball.radius;
        
        // Bounce
        if (Math.abs(ball.vy) > 2) {
            ball.vy *= -config.elasticity;
            ball.vx *= config.groundFriction;
            playSfx('sfx_bounce', Math.random() * 140 - 70);
            showFeedbackGif(GIF_KEYS.impact, 'Impact echo', 700);
            vibrate('light');
            createParticles(ball.x, ball.y + ball.radius, 5, '#fff');
        } else {
            ball.vy = 0;
            ball.vx *= config.groundFriction; // Rolling friction
        }
        
        // Stop check
        if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) {
            ball.vx = 0;
            endGame();
        }
    }
    
    updateHUD();
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 1) * 10,
            life: 0.5 + Math.random() * 0.5,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

function endGame() {
    gameState = GAME_STATE.RESULT;
    document.getElementById('final-score').innerText = getDistance() + "m";
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('status-display').innerText = "SCAN COMPLETE";
    playSfx('sfx_result');
    showFeedbackGif(GIF_KEYS.result, 'Recon complete', 1800);
    setBgmState(false);
    vibrate('medium');
}

function getDistance() {
    return Math.max(0, ((ball.x - (cw * 0.15 + 40)) / 10).toFixed(1));
}

function updateHUD() {
    document.getElementById('score-display').innerText = getDistance() + "m";
}

// --- Input Router ---

function handleGlobalInput() {
    unlockAudio();
    
    if (gameState === GAME_STATE.RESULT) return; // Handled by button
    
    switch (gameState) {
        case GAME_STATE.IDLE:
            gameState = GAME_STATE.POWER;
            document.querySelector('#instructions div').innerText = "TAP TO LOCK BOOST";
            document.getElementById('status-display').innerText = "TUNING BOOST";
            playSfx('sfx_ui', -100);
            vibrate('light');
            break;
            
        case GAME_STATE.POWER:
            gameState = GAME_STATE.ANGLE;
            document.querySelector('#instructions div').innerText = "TAP TO LOCK ARC";
            document.getElementById('status-display').innerText = "TUNING ARC";
            playSfx('sfx_ui', 70);
            vibrate('light');
            break;
            
        case GAME_STATE.ANGLE:
            performKick();
            break;
    }
}

function performKick() {
    gameState = GAME_STATE.FLYING;
    document.getElementById('instructions').style.opacity = '0';
    document.getElementById('status-display').innerText = "PROBE AIRBORNE";
    clearFeedbackGif();
    
    // Calculate Velocity
    const powerVal = config.minPower + (gauge.power / 100) * (config.maxPower - config.minPower);
    const rad = (gauge.angle * Math.PI) / 180;
    
    ball.vx = powerVal * Math.cos(rad);
    ball.vy = -powerVal * Math.sin(rad);
    ball.active = true;
    
    // Juice
    hero.state = 'kick';
    hero.animTimer = 0;
    camera.shake = 20;
    playSfx('sfx_launch');
    showFeedbackGif(GIF_KEYS.impact, 'Launch burst', 850);
    setBgmState(true);
    vibrate('heavy');
    createParticles(ball.x, ball.y, 20, '#ff0055');
}

// --- Rendering ---

function draw() {
    // Clear
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    
    // Camera Transform
    const camX = Math.floor(camera.x);
    const shakeX = (Math.random() - 0.5) * camera.shake;
    const shakeY = (Math.random() - 0.5) * camera.shake;
    
    ctx.save();
    ctx.translate(-camX + shakeX, shakeY);
    
    drawBackground(camX);
    drawGround(camX);
    drawMilestones();
    drawHero();
    drawBall();
    drawParticles();
    
    ctx.restore();
    
    // HUD Overlays (No camera transform)
    if (gameState === GAME_STATE.POWER || gameState === GAME_STATE.ANGLE) {
        drawGauges();
    }
}

function drawBackground(camX) {
    // Sky gradient
        const grad = ctx.createLinearGradient(0, 0, 0, ch);
        grad.addColorStop(0, '#07101f');
        grad.addColorStop(0.55, '#0f1d34');
        grad.addColorStop(1, '#08111e');
        ctx.fillStyle = grad;
    ctx.fillRect(camX, 0, cw, ch); // Fill screen relative to camera
    
    // Parallax City (Far)
    ctx.fillStyle = '#132345';
    for (let i = 0; i < 20; i++) {
        const x = (i * 100) - (camX * 0.2) % 2000;
        const h = 100 + Math.sin(i * 132) * 50;
        ctx.fillRect(x, world.groundY - h, 60, h);
        // Windows
        ctx.fillStyle = i % 2 === 0 ? '#6bffb8' : '#65d9ff';
        if (i % 3 === 0) ctx.fillRect(x + 10, world.groundY - h + 20, 5, 5);
        ctx.fillStyle = '#0f1f0f';
    }
    
    // Parallax City (Near)
    ctx.fillStyle = '#09162b';
    for (let i = 0; i < 20; i++) {
        const x = (i * 150) - (camX * 0.5) % 3000;
        const h = 150 + Math.cos(i * 45) * 80;
        ctx.fillRect(x, world.groundY - h, 80, h);
    }
}

function drawGround(camX) {
    const groundGrad = ctx.createLinearGradient(0, world.groundY, 0, ch);
    groundGrad.addColorStop(0, '#13294a');
    groundGrad.addColorStop(1, '#050a16');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(camX, world.groundY, cw, ch - world.groundY);
    
    // Runway line
    ctx.strokeStyle = '#6bffb8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(camX, world.groundY);
    ctx.lineTo(camX + cw, world.groundY);
    ctx.stroke();
    
    for (let x = camX - (camX % 80); x < camX + cw + 80; x += 80) {
        ctx.strokeStyle = 'rgba(101, 217, 255, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, world.groundY);
        ctx.lineTo(x + 24, world.groundY + 16);
        ctx.stroke();
    }
}

function drawMilestones() {
    const startM = Math.floor(camera.x / 100) * 100;
    for (let x = startM; x < camera.x + cw + 100; x += 100) {
        if (x < hero.x + 100) continue;
        
        // Marker
        ctx.fillStyle = '#20365f';
        ctx.fillRect(x - 2, world.groundY, 4, 20);
        
        // Text
        const dist = Math.round((x - (cw * 0.15 + 40)) / 10);
        if (dist > 0 && dist % 50 === 0) {
            ctx.fillStyle = '#ffe27a';
            ctx.font = '600 18px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.fillText(dist + 'm', x, world.groundY + 40);
        }
    }
}

function drawHero() {
    const hx = hero.x;
    const hy = hero.y;
    
    ctx.save();
    ctx.translate(hx, hy);
    
    // Agent 007n7 silhouette with cyan recon trim
    ctx.fillStyle = '#09111f';
    ctx.strokeStyle = '#65d9ff';
    ctx.lineWidth = 2;
    
    // Coat core
    ctx.beginPath();
    ctx.roundRect(-18, -62, 36, 46, 8);
    ctx.fill();
    ctx.stroke();
    
    // Head
    ctx.fillStyle = '#13213f';
    ctx.beginPath();
    ctx.arc(0, -72, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // Sunglasses
    ctx.fillStyle = '#6bffb8';
    ctx.fillRect(-7, -74, 15, 5);
    
    // Tie
    ctx.fillStyle = '#ff4d8d';
    ctx.beginPath();
    ctx.moveTo(0, -45);
    ctx.lineTo(-5, -30);
    ctx.lineTo(0, -18);
    ctx.lineTo(5, -30);
    ctx.closePath();
    ctx.fill();
    
    // Shoulder beacon
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath();
    ctx.arc(11, -49, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Legs
    ctx.strokeStyle = '#09111f';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    
    if (hero.state === 'idle') {
        // Standing
        ctx.beginPath();
        ctx.moveTo(-5, -20); ctx.lineTo(-10, 0); // Left leg
        ctx.moveTo(5, -20); ctx.lineTo(10, 0); // Right leg
        ctx.stroke();
    } else {
        // Kicking
        ctx.beginPath();
        ctx.moveTo(-5, -20); ctx.lineTo(-15, 0); // Plant leg
        ctx.moveTo(5, -20); ctx.lineTo(25, -20); // Kick leg
        ctx.stroke();
    }
    
    // Arm gesture
    ctx.strokeStyle = '#09111f';
    ctx.beginPath();
    ctx.moveTo(0, -50);
    ctx.lineTo(16, -46);
    ctx.lineTo(22, -56);
    ctx.stroke();
    
    ctx.strokeStyle = 'rgba(101, 217, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -36);
    ctx.lineTo(10, -36);
    ctx.stroke();
    
    ctx.restore();
}

function drawBall() {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rotation);
    
    // Probe face capsule
    const probeGrad = ctx.createRadialGradient(-4, -6, 2, 0, 0, ball.radius + 4);
    probeGrad.addColorStop(0, '#ffe9c4');
    probeGrad.addColorStop(0.72, '#ffc18f');
    probeGrad.addColorStop(1, '#ff8b7e');
    ctx.beginPath();
    ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = probeGrad;
    ctx.fill();
    ctx.strokeStyle = '#13213f';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Recon visor
    ctx.fillStyle = '#09111f';
    ctx.beginPath();
    ctx.roundRect(-11, -6, 22, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#6bffb8';
    ctx.fillRect(-8, -3, 6, 2);
    ctx.fillStyle = '#65d9ff';
    ctx.fillRect(1, -3, 6, 2);
    
    // Mouth (smirk)
    ctx.strokeStyle = '#7a2c2d';
    ctx.beginPath();
    ctx.arc(0, 6, 5, 0.1, Math.PI - 0.1, false);
    ctx.stroke();
    
    // Tiny antenna sparkle
    ctx.strokeStyle = '#ffe27a';
    ctx.beginPath();
    ctx.moveTo(0, -ball.radius);
    ctx.lineTo(0, -ball.radius - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -ball.radius - 8, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe27a';
    ctx.fill();
    
    ctx.restore();
}

function drawParticles() {
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function drawGauges() {
    // Power Bar
    const barW = cw * 0.6;
    const barH = 20;
    const barX = (cw - barW) / 2;
    const barY = ch * 0.2;
    
    // Bg
    ctx.fillStyle = 'rgba(8, 16, 33, 0.88)';
    ctx.fillRect(barX, barY, barW, barH);
    
    // Fill
    const fillW = (gauge.power / 100) * barW;
    const hue = 190 - gauge.power * 1.4; // Cyan to warm pink
    ctx.fillStyle = `hsl(${hue}, 100%, 62%)`;
    ctx.fillRect(barX, barY, fillW, barH);
    
    // Border
    ctx.strokeStyle = '#dff7ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    
    // Label
    ctx.fillStyle = '#dff7ff';
    ctx.textAlign = 'center';
    ctx.font = '600 20px "Exo 2"';
    ctx.fillText('BOOST', cw/2, barY - 10);
    
    // Angle Indicator (Only in ANGLE state)
    if (gameState === GAME_STATE.ANGLE) {
        const originX = hero.x;
        const originY = hero.y - 40;
        const len = 80;
        const rad = (gauge.angle * Math.PI) / 180;
        
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // Need absolute coords for overlay logic if not careful, but here we are in draw() which reset transform. 
        // Wait, draw() resets transform at start. But we need to account for camera if we draw near hero.
        // Actually, let's draw angle relative to screen for UI, or relative to hero for world? 
        // Better relative to hero.
        
        const camX = Math.floor(camera.x);
        ctx.translate(-camX, 0); // Apply camera
        
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(originX + Math.cos(rad) * len, originY - Math.sin(rad) * len);
        ctx.strokeStyle = '#6bffb8';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // Arc
        ctx.beginPath();
        ctx.arc(originX, originY, 40, -config.maxAngle * Math.PI/180, -config.minAngle * Math.PI/180);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.restore();
    }
}

// --- Main Loop ---

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

// --- Initialization ---

window.addEventListener('resize', () => {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    
    if (!initialized) {
        initGame();
        initialized = true;
        requestAnimationFrame(gameLoop);
    } else {
        // Reposition ground dependent entities if needed
        world.groundY = ch * 0.85;
    }
});

document.addEventListener('DOMContentLoaded', () => {
    // Parse config
    try {
        const confEl = document.getElementById('game-config');
        if (confEl) {
            const defs = JSON.parse(confEl.textContent);
            window.gameConfigDefs = defs;
            window.gameConfig = {};
            for (const k in defs) window.gameConfig[k] = defs[k].value;
        }
    } catch(e) { console.error('Config parse error', e); }

    // Preload Audio
    loadAudio('sfx_launch', document.getElementById('sfx_launch').src);
    loadAudio('sfx_bounce', document.getElementById('sfx_bounce').src);
    loadAudio('sfx_ui', document.getElementById('sfx_ui').src);
    loadAudio('sfx_result', document.getElementById('sfx_result').src);
    
    // Setup Input
    const gameContainer = document.getElementById('game-container');
    gameContainer.addEventListener('pointerdown', handleGlobalInput);
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        playSfx('sfx_ui', 110);
        restartGame();
    });

    document.addEventListener('visibilitychange', () => {
        setBgmState(!document.hidden && gameState !== GAME_STATE.RESULT);
    });
    
    // Trigger resize to start
    window.dispatchEvent(new Event('resize'));
});

// Config Hot Reload Stub
window.updateGameConfig = (key, val) => {
    if (window.gameConfig) window.gameConfig[key] = val;
    if (key === 'themeColor') document.documentElement.style.setProperty('--spy-green', val);
};

</script>
