<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gamezone: Cyber Arena</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] repaired: font-remap | action: removed mirrored non-catalog font asset and consolidated approved catalog-backed fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;family=Exo+2:wght@400;600&amp;family=Rajdhani:wght@400;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #040812;
            --panel: rgba(10, 19, 35, 0.82);
            --panel-strong: rgba(13, 28, 52, 0.92);
            --text: #e8f7ff;
            --muted: #8db8d1;
            --hero-core: #53f6ff;
            --hero-glow: rgba(83, 246, 255, 0.45);
            --enemy-core: #ff4d8d;
            --enemy-edge: #ff94ba;
            --xp-core: #ffe56b;
            --ui-accent: #63c6ff;
            --ui-accent-2: #9d7bff;
            --warning: #ff5c87;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(58, 120, 255, 0.15), transparent 34%),
                radial-gradient(circle at bottom, rgba(157, 123, 255, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            color: var(--text);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 198, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 3px, 42px 42px;
            mask-image: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.15));
            opacity: 0.45;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        .glass {
            background: linear-gradient(180deg, rgba(9, 19, 35, 0.92), rgba(7, 14, 25, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 198, 255, 0.32);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 16px 32px rgba(0, 0, 0, 0.35),
                0 0 24px rgba(83, 246, 255, 0.08);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(83, 246, 255, 0.9), 0 0 22px rgba(83, 246, 255, 0.25);
        }
        .neon-text-red {
            text-shadow: 0 0 12px rgba(255, 77, 141, 0.9), 0 0 20px rgba(255, 77, 141, 0.25);
        }
        #hud { font-family: 'Orbitron', system-ui, sans-serif; pointer-events: none; }
        .hidden { display: none !important; }
        .hud-card {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(8, 18, 33, 0.84), rgba(5, 10, 20, 0.92));
            border: 1px solid rgba(99, 198, 255, 0.24);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), 0 0 18px rgba(83, 246, 255, 0.09);
        }
        .hud-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(83, 246, 255, 0.12), transparent 50%, rgba(157, 123, 255, 0.1));
            pointer-events: none;
        }
        .panel-title {
            font-family: 'Rajdhani', 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }
        .body-copy,
        .upgrade-option,
        #game-over-screen p,
        #restart-btn {
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        .hero-score {
            font-family: 'Rajdhani', 'Exo 2', system-ui, sans-serif;
        }
        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: 1rem;
            width: min(26vw, 122px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(99, 198, 255, 0.35);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 18px rgba(83, 246, 255, 0.2);
            background: rgba(8, 18, 33, 0.75);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }
        .feedback-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.fail {
            left: 0.75rem;
            right: auto;
            bottom: 1rem;
            border-color: rgba(255, 92, 135, 0.4);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), 0 0 18px rgba(255, 92, 135, 0.22);
        }
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.55rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #b9eeff;
            background: rgba(83, 246, 255, 0.12);
            border: 1px solid rgba(83, 246, 255, 0.22);
        }
        .status-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: var(--hero-core);
            box-shadow: 0 0 10px var(--hero-glow);
        }
        .energy-bar {
            position: relative;
            overflow: hidden;
        }
        .energy-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
            transform: translateX(-100%);
            animation: barSweep 2.4s linear infinite;
            pointer-events: none;
        }
        .upgrade-option {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(99, 198, 255, 0.34);
            background: linear-gradient(180deg, rgba(16, 41, 74, 0.74), rgba(9, 20, 36, 0.9));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }
        .upgrade-option::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(83, 246, 255, 0.12), transparent 35%, rgba(157, 123, 255, 0.14));
            pointer-events: none;
        }
        .upgrade-option:active { transform: scale(0.98); }
        /* Animation for hit */
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 75% { transform: translate(2px, -2px); } 100% { transform: translate(0,0); } }
        @keyframes barSweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
        .shaking { animation: shake 0.2s ease-in-out; }
        @media (max-width: 640px) {
            #hud { padding: 0.75rem; gap: 0.6rem; }
            .feedback-gif {
                width: 88px;
                bottom: 0.75rem;
            }
            .feedback-gif.fail {
                left: 0.5rem;
            }
        }
    </style>
</head>
<body>

<script>
/**
 * GAMEZONE: CYBER ARENA
 * Single-file Mobile HTML5 Game
 */

// --- §0 Constants & Config ---
const CONFIG = {
    baseHeroSpeed: 5,
    friction: 0.88,
    colors: {
        bg: '#07111f',
        hero: '#53f6ff',
        enemy: '#ff4d8d',
        xp: '#ffe56b',
        grid: 'rgba(99, 198, 255, 0.13)',
        heroGlow: 'rgba(83, 246, 255, 0.5)',
        heroAura: 'rgba(83, 246, 255, 0.16)',
        enemyGlow: 'rgba(255, 77, 141, 0.42)',
        enemyEdge: '#ffd1e1',
        projectileGlow: '#c7f8ff'
    }
};

let gameConfig = {
    heroSpeed: 5,
    enemySpawnRate: 800,
    themeColor: '#00f3ff'
};

// --- §1 System State ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;
let lastTime = 0;
let animationId;
let gameState = 'BOOT'; // BOOT, PLAYING, UPGRADE, GAMEOVER
let audioCtx = null;
const audioState = {
    enabled: false,
    sfxCooldowns: Object.create(null),
    bgmStarted: false
};
const FEEDBACK_TIMERS = { hype: null, danger: null };

// Entities
let hero = {};
let enemies = [];
let projectiles = [];
let particles = [];
let xpOrbs = [];
let floatingTexts = [];

// Gameplay State
let score = 0;
let wave = 1;
let spawnTimer = 0;
let gameTime = 0;
let camera = { x: 0, y: 0, shake: 0 };

// Input State
const input = {
    active: false,
    originX: 0, originY: 0,
    currX: 0, currY: 0,
    vectorX: 0, vectorY: 0
};

// --- §2 Lifecycle & Init ---
window.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        const rawCfg = JSON.parse(cfgEl.textContent);
        window.gameConfigDefs = rawCfg;
        for (let key in rawCfg) gameConfig[key] = rawCfg[key].value;
    } catch(e) { console.error('Config parse error', e); }

    // Setup
    resize();
    window.addEventListener('resize', resize);
    
    // Input Binding
    window.addEventListener('pointerdown', handleInputStart, { passive: false });
    window.addEventListener('pointermove', handleInputMove, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent firing game input
        unlockAudio();
        restartGame();
    });

    // Start
    initGame();
    setState('PLAYING');
    
    primeAudio();
    requestAnimationFrame(loop);
});

function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = document.body.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initGame() {
    // Reset State
    score = 0;
    wave = 1;
    spawnTimer = 0;
    gameTime = 0;
    
    // Reset Entities
    hero = {
        x: cw / 2,
        y: ch / 2,
        hp: 100,
        maxHp: 100,
        radius: 12,
        speed: gameConfig.heroSpeed,
        weapon: {
            type: 'RIFLE',
            damage: 15,
            fireRate: 150, // ms
            range: 300,
            lastShot: 0,
            color: '#00f3ff'
        },
        xp: 0,
        level: 1,
        nextLevelXp: 50
    };
    
    enemies = [];
    projectiles = [];
    particles = [];
    xpOrbs = [];
    floatingTexts = [];
    
    // Reset Camera
    camera.x = 0;
    camera.y = 0;
    camera.shake = 0;
    
    updateHUD();
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

function setState(newState) {
    gameState = newState;
    
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const upgrade = document.getElementById('upgrade-panel');
    
    // UI Visibility Logic
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        upgrade.classList.add('hidden');
        resumeBgm();
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        upgrade.classList.add('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        showFeedbackGif('danger', 2600);
        playSfx('sfx_game_over', 0.55, 1000);
        pauseBgm();
        vibrate('heavy');
    } else if (newState === 'UPGRADE') {
        upgrade.classList.remove('hidden');
        pauseBgm();
    }
}

// --- §3 Input System ---
function handleInputStart(e) {
    unlockAudio();
    if (gameState !== 'PLAYING') return;
    // Don't capture input if clicking UI
    if (e.target.closest('button') || e.target.closest('.glass')) return;

    e.preventDefault();
    const x = e.clientX - canvas.getBoundingClientRect().left;
    const y = e.clientY - canvas.getBoundingClientRect().top;
    
    input.active = true;
    input.originX = x;
    input.originY = y;
    input.currX = x;
    input.currY = y;
    input.vectorX = 0;
    input.vectorY = 0;
}

function handleInputMove(e) {
    if (!input.active) return;
    e.preventDefault();
    const x = e.clientX - canvas.getBoundingClientRect().left;
    const y = e.clientY - canvas.getBoundingClientRect().top;
    
    input.currX = x;
    input.currY = y;
    
    const dx = x - input.originX;
    const dy = y - input.originY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 60; // joystick radius
    
    if (dist > 0) {
        const scale = Math.min(dist, maxDist) / dist;
        input.vectorX = (dx * scale) / maxDist;
        input.vectorY = (dy * scale) / maxDist;
    }
}

function handleInputEnd(e) {
    e.preventDefault();
    input.active = false;
    input.vectorX = 0;
    input.vectorY = 0;
}

// --- §4 Core Loop ---
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
    lastTime = timestamp;
    
    try {
        if (gameState === 'PLAYING') {
            update(dt, timestamp);
        }
        draw();
    } catch (err) {
        console.error('Loop Error:', err);
        // Attempt recovery
        hero.x = cw/2; hero.y = ch/2;
    }
    
    requestAnimationFrame(loop);
}

function update(dt, now) {
    gameTime += dt;
    
    // -- Hero Movement --
    if (input.active) {
        hero.x += input.vectorX * hero.speed * 60 * dt;
        hero.y += input.vectorY * hero.speed * 60 * dt;
    }
    
    // Clamp Hero
    hero.x = Math.max(hero.radius, Math.min(cw - hero.radius, hero.x));
    hero.y = Math.max(hero.radius, Math.min(ch - hero.radius, hero.y));
    
    // -- Combat --
    // Find nearest enemy
    let nearest = null;
    let minDst = Infinity;
    
    enemies.forEach(e => {
        const dx = e.x - hero.x;
        const dy = e.y - hero.y;
        const d = dx*dx + dy*dy;
        if (d < minDst) {
            minDst = d;
            nearest = e;
        }
    });
    
    // Auto Fire
    if (nearest && Math.sqrt(minDst) < hero.weapon.range) {
        if (now - hero.weapon.lastShot > hero.weapon.fireRate) {
            shoot(nearest, now);
        }
    }
    
    // -- Spawning --
    spawnTimer += dt * 1000;
    // Spawn rate decreases (gets faster) as wave increases
    const currentSpawnRate = Math.max(300, gameConfig.enemySpawnRate - (wave * 50));
    
    if (spawnTimer > currentSpawnRate) {
        spawnEnemy();
        spawnTimer = 0;
    }
    
    // -- Entities Update --
    
    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        
        // Collision with enemies
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dx = p.x - e.x;
            const dy = p.y - e.y;
            if (dx*dx + dy*dy < (e.radius + p.radius)**2) {
                damageEnemy(e, p.damage);
                hit = true;
                spawnParticles(p.x, p.y, p.color, 3);
                break;
            }
        }
        
        if (hit || p.life <= 0 || p.x < 0 || p.x > cw || p.y < 0 || p.y > ch) {
            projectiles.splice(i, 1);
        }
    }
    
    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        // Move towards hero
        const dx = hero.x - e.x;
        const dy = hero.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            e.x += (dx / dist) * e.speed * 60 * dt;
            e.y += (dy / dist) * e.speed * 60 * dt;
        }
        
        // Soft collision between enemies (separation)
        for (let j = i - 1; j >= 0; j--) {
            const other = enemies[j];
            const odx = e.x - other.x;
            const ody = e.y - other.y;
            const odist = Math.sqrt(odx*odx + ody*ody);
            const minSep = e.radius + other.radius;
            if (odist < minSep && odist > 0) {
                const push = (minSep - odist) / 2;
                e.x += (odx / odist) * push;
                e.y += (ody / odist) * push;
                other.x -= (odx / odist) * push;
                other.y -= (ody / odist) * push;
            }
        }
        
        // Collision with Hero
        if (dist < e.radius + hero.radius) {
            damageHero(10);
            e.hp = 0; // Enemy explodes on contact
            spawnParticles(e.x, e.y, CONFIG.colors.enemy, 8);
            camera.shake = 5;
            vibrate('medium');
        }
        
        if (e.hp <= 0) {
            killEnemy(e);
            enemies.splice(i, 1);
        }
    }
    
    // XP Orbs
    for (let i = xpOrbs.length - 1; i >= 0; i--) {
        const orb = xpOrbs[i];
        const dx = hero.x - orb.x;
        const dy = hero.y - orb.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // Magnet
        if (dist < 150) {
            orb.x += (dx / dist) * 300 * dt;
            orb.y += (dy / dist) * 300 * dt;
        }
        
        if (dist < hero.radius + orb.radius) {
            collectXp(orb.value);
            spawnParticles(orb.x, orb.y, CONFIG.colors.xp, 4);
            xpOrbs.splice(i, 1);
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Camera Shake Decay
    if (camera.shake > 0) camera.shake *= 0.9;
    if (camera.shake < 0.5) camera.shake = 0;
}

// --- §5 Drawing ---
function draw() {
    // Clear & BG
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, cw, ch);
    
    // Grid Effect
    const gridSize = 40;
    const pulse = 0.65 + Math.sin(gameTime * 1.6) * 0.1;
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    
    for (let x = 0; x <= cw; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, ch);
    }
    for (let y = 0; y <= ch; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(cw, y);
    }
    ctx.stroke();

    const arenaGlow = ctx.createRadialGradient(hero.x, hero.y, hero.radius * 2, hero.x, hero.y, Math.max(cw, ch) * 0.55);
    arenaGlow.addColorStop(0, 'rgba(83, 246, 255, 0.14)');
    arenaGlow.addColorStop(0.45, 'rgba(125, 167, 255, 0.07)');
    arenaGlow.addColorStop(1, 'rgba(4, 8, 18, 0)');
    ctx.fillStyle = arenaGlow;
    ctx.fillRect(0, 0, cw, ch);

    for (let i = 0; i < 18; i++) {
        const px = (i * 79 + gameTime * 18) % cw;
        const py = (i * 53 + gameTime * 12) % ch;
        ctx.fillStyle = `rgba(157, 123, 255, ${0.08 + (i % 3) * 0.03})`;
        ctx.fillRect(px, py, 2, 2);
    }

    ctx.globalAlpha = pulse;
    ctx.strokeStyle = 'rgba(83, 246, 255, 0.05)';
    ctx.strokeRect(16, 16, cw - 32, ch - 32);
    ctx.globalAlpha = 1;
    
    // Apply Camera Shake
    ctx.save();
    if (camera.shake > 0) {
        const sx = (Math.random() - 0.5) * camera.shake;
        const sy = (Math.random() - 0.5) * camera.shake;
        ctx.translate(sx, sy);
    }
    
    // Draw XP
    xpOrbs.forEach(orb => {
        const orbGlow = ctx.createRadialGradient(orb.x, orb.y, 1, orb.x, orb.y, orb.radius * 3);
        orbGlow.addColorStop(0, 'rgba(255, 245, 184, 1)');
        orbGlow.addColorStop(0.45, 'rgba(255, 229, 107, 0.95)');
        orbGlow.addColorStop(1, 'rgba(255, 229, 107, 0)');
        ctx.fillStyle = orbGlow;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius * 2.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = CONFIG.colors.xp;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
    
    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = CONFIG.colors.enemy;
        ctx.shadowBlur = 12;
        ctx.shadowColor = CONFIG.colors.enemyGlow;
        ctx.beginPath();
        // Diamond shape
        ctx.moveTo(e.x, e.y - e.radius);
        ctx.lineTo(e.x + e.radius, e.y);
        ctx.lineTo(e.x, e.y + e.radius);
        ctx.lineTo(e.x - e.radius, e.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = CONFIG.colors.enemyEdge;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 209, 225, 0.85)';
        ctx.arc(e.x, e.y, Math.max(1.8, e.radius * 0.18), 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.shadowBlur = 0;
    
    // Draw Projectiles
    projectiles.forEach(p => {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 8;
        ctx.shadowColor = CONFIG.colors.projectileGlow;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); // Trail effect
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.shadowBlur = 0;
    
    // Draw Hero
    if (hero.hp > 0) {
        const aura = ctx.createRadialGradient(hero.x, hero.y, hero.radius * 0.5, hero.x, hero.y, hero.radius * 3.1);
        aura.addColorStop(0, CONFIG.colors.heroAura);
        aura.addColorStop(0.65, 'rgba(83, 246, 255, 0.05)');
        aura.addColorStop(1, 'rgba(83, 246, 255, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius * 3.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = CONFIG.colors.hero;
        ctx.shadowBlur = 18;
        ctx.shadowColor = CONFIG.colors.heroGlow;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius, 0, Math.PI * 2);
        ctx.fill();

        // visor
        ctx.fillStyle = '#f8ffff';
        ctx.beginPath();
        ctx.ellipse(hero.x, hero.y - 1, hero.radius * 0.48, hero.radius * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();

        // side fins for a clearer silhouette
        ctx.fillStyle = 'rgba(83, 246, 255, 0.9)';
        ctx.beginPath();
        ctx.moveTo(hero.x - hero.radius * 0.95, hero.y - 2);
        ctx.lineTo(hero.x - hero.radius * 1.55, hero.y - hero.radius * 0.35);
        ctx.lineTo(hero.x - hero.radius * 1.2, hero.y + hero.radius * 0.45);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(hero.x + hero.radius * 0.95, hero.y - 2);
        ctx.lineTo(hero.x + hero.radius * 1.55, hero.y - hero.radius * 0.35);
        ctx.lineTo(hero.x + hero.radius * 1.2, hero.y + hero.radius * 0.45);
        ctx.closePath();
        ctx.fill();

        // Hero Ring
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius + 4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(157, 123, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hero.x, hero.y, hero.radius + 7 + Math.sin(gameTime * 3) * 1.5, -Math.PI * 0.2, Math.PI * 0.9);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    
    // Draw Joystick
    if (input.active) {
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(input.originX, input.originY, 60, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(input.originX + input.vectorX * 60, input.originY + input.vectorY * 60, 20, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

// --- §6 Mechanics & Helpers ---

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    // Spawn outside screen
    const r = Math.max(cw, ch) / 2 + 50;
    const ex = cw/2 + Math.cos(angle) * r;
    const ey = ch/2 + Math.sin(angle) * r;
    
    enemies.push({
        x: ex,
        y: ey,
        hp: 20 + (wave * 5),
        radius: 10,
        speed: 2 + Math.random() * 1.5,
        value: 10
    });
}

function shoot(target, now) {
    hero.weapon.lastShot = now;
    
    const angle = Math.atan2(target.y - hero.y, target.x - hero.x);
    const speed = 800; // px/s
    
    projectiles.push({
        x: hero.x,
        y: hero.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.5,
        damage: hero.weapon.damage,
        radius: 4,
        color: hero.weapon.color
    });
    
    // Juice
    camera.shake = 2;
    vibrate('light');
    playSfx('sfx_shoot', 0.18, 80);
    synthPew();
}

function damageEnemy(e, dmg) {
    e.hp -= dmg;
    playSfx('sfx_enemy_hit', 0.22, 60);
    if (e.hp <= dmg) {
        showFeedbackGif('hype', 900);
    }
    // Flash effect logic handled in draw via particles
}

function killEnemy(e) {
    score += e.value;
    spawnParticles(e.x, e.y, CONFIG.colors.enemy, 10);
    // Drop XP
    xpOrbs.push({
        x: e.x,
        y: e.y,
        value: 10,
        radius: 4
    });
    updateHUD();
    playSfx('sfx_enemy_defeat', 0.3, 90);
    synthExplosion();
}

function damageHero(dmg) {
    hero.hp -= dmg;
    updateHUD();
    document.getElementById('game-container').classList.add('shaking');
    setTimeout(() => document.getElementById('game-container').classList.remove('shaking'), 200);
    playSfx('sfx_damage', hero.hp <= 30 ? 0.42 : 0.28, 180);
    if (hero.hp <= 30 && hero.hp > 0) {
        showFeedbackGif('danger', 1200);
    }
    
    if (hero.hp <= 0) {
        setState('GAMEOVER');
    }
}

function collectXp(amount) {
    hero.xp += amount;
    score += amount;
    
    // Level Up Check
    if (hero.xp >= hero.nextLevelXp) {
        hero.level++;
        hero.xp -= hero.nextLevelXp;
        hero.nextLevelXp = Math.floor(hero.nextLevelXp * 1.2);
        triggerLevelUp();
    }
    
    updateHUD();
    
    playSfx('sfx_collect', 0.26, 90);
    if (amount >= 10) {
        showFeedbackGif('hype', 700);
    }
}

function triggerLevelUp() {
    setState('UPGRADE');
    playSfx('sfx_upgrade_open', 0.32, 250);
    showFeedbackGif('hype', 1800);
    
    const options = [
        { name: 'DMG BOOST', desc: '+20% Damage', action: () => { hero.weapon.damage *= 1.2; } },
        { name: 'FIRE RATE', desc: '+15% Fire Rate', action: () => { hero.weapon.fireRate *= 0.85; } },
        { name: 'SPEED UP', desc: '+10% Move Speed', action: () => { hero.speed *= 1.1; } },
        { name: 'HEAL', desc: 'Restore 50% HP', action: () => { hero.hp = Math.min(hero.maxHp, hero.hp + hero.maxHp * 0.5); } }
    ];
    
    // Pick 3 random
    const choices = options.sort(() => 0.5 - Math.random()).slice(0, 3);
    
    const container = document.getElementById('upgrade-options');
    container.innerHTML = '';
    
    choices.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'upgrade-option text-white p-3 rounded-xl text-left transition-colors';
        btn.innerHTML = `<div class="flex items-center justify-between gap-3"><div class="font-bold text-cyan-200 text-lg tracking-[0.12em]">${opt.name}</div><div class="text-xl" aria-hidden="true">⚡</div></div><div class="text-sm text-slate-200/85">${opt.desc}</div>`;
        btn.onclick = (e) => {
            e.stopPropagation(); // prevent input
            opt.action();
            wave++;
            updateHUD();
            setState('PLAYING');
            playSfx('sfx_upgrade_pick', 0.3, 180);
            unlockAudio(); // ensure audio keeps going
        };
        container.appendChild(btn);
    });
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function updateHUD() {
    document.getElementById('score-disp').innerText = Math.floor(score);
    document.getElementById('wave-disp').innerText = wave;
    document.getElementById('hp-bar').style.width = Math.max(0, (hero.hp / hero.maxHp) * 100) + '%';
    document.getElementById('weapon-disp').innerText = `LVL ${hero.level} | ${hero.weapon.type}`;
}

// --- §7 Audio & Vibration ---
function primeAudio() {
    const bgm = document.getElementById('bgm_battle');
    if (bgm) {
        bgm.volume = 0.2;
    }
    [
        ['sfx_collect', 0.26],
        ['sfx_shoot', 0.18],
        ['sfx_enemy_hit', 0.22],
        ['sfx_enemy_defeat', 0.3],
        ['sfx_damage', 0.3],
        ['sfx_upgrade_open', 0.32],
        ['sfx_upgrade_pick', 0.3],
        ['sfx_game_over', 0.55]
    ].forEach(([id, volume]) => {
        const el = document.getElementById(id);
        if (el) el.volume = volume;
    });
}

function unlockAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    audioState.enabled = true;
    resumeBgm();
}

function synthPew() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function synthExplosion() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function playSfx(id, volume = 0.25, cooldownMs = 0) {
    if (!audioState.enabled) return;
    const now = performance.now();
    const nextAllowed = audioState.sfxCooldowns[id] || 0;
    if (now < nextAllowed) return;
    audioState.sfxCooldowns[id] = now + cooldownMs;
    const el = document.getElementById(id);
    if (!el) return;
    try {
        el.volume = volume;
        el.currentTime = 0;
        el.play().catch(() => {});
    } catch (_) {}
}

function resumeBgm() {
    if (!audioState.enabled) return;
    const bgm = document.getElementById('bgm_battle');
    if (!bgm) return;
    bgm.volume = 0.2;
    if (bgm.paused) {
        bgm.play().catch(() => {});
    }
    audioState.bgmStarted = true;
}

function pauseBgm() {
    const bgm = document.getElementById('bgm_battle');
    if (bgm && !bgm.paused) {
        bgm.pause();
    }
}

function showFeedbackGif(kind, duration = 1000) {
    const el = document.getElementById(kind === 'danger' ? 'gif-danger' : 'gif-hype');
    if (!el) return;
    clearTimeout(FEEDBACK_TIMERS[kind]);
    el.classList.add('show');
    FEEDBACK_TIMERS[kind] = setTimeout(() => el.classList.remove('show'), duration);
}

function vibrate(style) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

// --- §8 Utils ---
// Helper for hot-reload of config
window.updateGameConfig = function(key, val) {
    if (gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
        // Apply immediate effects
        if (key === 'heroSpeed') hero.speed = val;
    }
};
