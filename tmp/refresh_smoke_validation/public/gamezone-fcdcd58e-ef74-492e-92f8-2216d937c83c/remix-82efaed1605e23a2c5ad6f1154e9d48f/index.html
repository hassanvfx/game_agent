<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sprint: Broadcast Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-primary: #ff6b2c;
            --theme-secondary: #58f5ff;
            --theme-gold: #ffe27a;
            --bg-color: #050816;
            --bg-glow: #1c1342;
            --panel-bg: rgba(10, 16, 32, 0.78);
            --panel-border: rgba(113, 227, 255, 0.24);
            --muted-text: #b5bfd7;
            --danger-tint: rgba(88, 18, 26, 0.66);
            --hero-core: #7af8ff;
            --hero-accent: #ff6b2c;
            --hazard-main: #25134f;
            --hazard-edge: #58f5ff;
            --font-body: 'Exo 2', system-ui, sans-serif;
            --font-display: 'Audiowide', 'Press Start 2P', sans-serif;
            --font-hud: 'Press Start 2P', 'Audiowide', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top, rgba(88, 245, 255, 0.14), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 107, 44, 0.14), transparent 32%),
                linear-gradient(180deg, var(--bg-glow), var(--bg-color) 28%, #02040a 100%);
            color: white;
            font-family: var(--font-body);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(88, 245, 255, 0.16), transparent 38%),
                linear-gradient(180deg, #0a1020 0%, #050816 48%, #04050d 100%);
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(16, 24, 45, 0.92), rgba(8, 12, 26, 0.86)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 28px rgba(88, 245, 255, 0.14),
                0 20px 45px rgba(0, 0, 0, 0.38);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--theme-primary), #ff9759 58%, var(--theme-gold));
            box-shadow: 0 10px 20px rgba(255, 107, 44, 0.28);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            color: #08111f;
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 4px 12px rgba(255, 107, 44, 0.22);
            filter: brightness(1.06);
        }

        .display-font {
            font-family: var(--font-display);
        }

        .screen {
            padding: 24px;
        }

        .screen-start {
            background:
                radial-gradient(circle at center, rgba(88, 245, 255, 0.1), transparent 40%),
                rgba(2, 4, 10, 0.66);
            backdrop-filter: blur(6px);
            z-index: 20;
        }

        .screen-gameover {
            background: var(--danger-tint);
            backdrop-filter: blur(12px);
            z-index: 30;
        }

        .panel {
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            width: min(90%, 380px);
            position: relative;
            overflow: hidden;
        }

        .panel--start {
            transform: translateZ(0);
            transition: transform 0.2s ease;
        }

        .panel--start:hover {
            transform: scale(1.02);
        }

        .title {
            margin: 0 0 10px;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            line-height: 0.95;
            font-weight: 400;
            color: #fff;
            text-transform: uppercase;
            text-shadow:
                0 0 16px rgba(88, 245, 255, 0.2),
                0 0 32px rgba(255, 107, 44, 0.12);
        }

        .subtitle {
            margin: 0 0 32px;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            color: var(--theme-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .action-button {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: clamp(1.2rem, 4vw, 1.65rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .helper-text {
            margin: 16px 0 0;
            color: var(--muted-text);
            font-size: 0.95rem;
            letter-spacing: 0.08em;
        }

        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(88, 245, 255, 0.08), transparent 42%),
                linear-gradient(315deg, rgba(255, 107, 44, 0.12), transparent 38%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            border-radius: 22px;
            background:
                radial-gradient(circle at 35% 32%, #fef7ba 0 8%, #fff0 9%),
                radial-gradient(circle at 68% 66%, rgba(255, 107, 44, 0.7), transparent 40%),
                linear-gradient(160deg, rgba(88, 245, 255, 0.95), rgba(35, 120, 255, 0.72));
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                0 0 22px rgba(88, 245, 255, 0.28);
            font-size: 2rem;
        }

        .panel-copy,
        .hud-note,
        .final-label,
        .score-label {
            font-family: var(--font-body);
        }

        .panel-copy {
            margin: -6px 0 18px;
            color: #dce7ff;
            font-size: 0.94rem;
            line-height: 1.45;
        }

        .hud-note {
            margin-top: 8px;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 226, 122, 0.95);
        }

        .hud {
            justify-content: flex-start;
            align-items: stretch;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 16px;
        }

        .hud-block {
            display: flex;
            flex-direction: column;
        }

        .hud-live {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #dc2626;
            animation: pulse 1.1s infinite;
        }

        .hud-live-label {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #ef4444;
        }

        .score-display {
            font-family: var(--font-hud);
            font-size: clamp(1.9rem, 7vw, 2.6rem);
            font-weight: 400;
            line-height: 1.1;
            text-shadow: 0 0 12px rgba(88, 245, 255, 0.3);
            transition: transform 0.1s ease;
            color: var(--theme-gold);
        }

        .score-label,
        .final-label {
            font-size: 0.82rem;
            color: var(--muted-text);
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .icon-button {
            width: 48px;
            height: 48px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.1s ease, background-color 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 0 16px rgba(88, 245, 255, 0.14);
        }

        .icon-button:active {
            transform: scale(0.95);
        }

        .icon-button.muted {
            background: rgba(127, 29, 29, 0.5);
        }

        .result-wrap {
            margin: 24px 0;
        }

        .signal-frame {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .signal-frame::before,
        .signal-frame::after {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1px solid rgba(88, 245, 255, 0.14);
            border-radius: 22px;
        }

        .signal-frame::after {
            inset: auto 18px 18px;
            top: 18px;
            background:
                linear-gradient(90deg, transparent, rgba(88, 245, 255, 0.16), transparent);
            height: 1px;
            border: 0;
            border-radius: 0;
            animation: scanline 2.6s linear infinite;
        }

        .final-score {
            font-family: var(--font-hud);
            font-size: clamp(2.6rem, 10vw, 3.6rem);
            font-weight: 400;
            color: var(--theme-gold);
            text-shadow: 0 0 14px rgba(88, 245, 255, 0.24);
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 var(--theme-primary);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 var(--theme-secondary);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(38px, 9999px, 84px, 0); }
            20% { clip: rect(7px, 9999px, 86px, 0); }
            40% { clip: rect(42px, 9999px, 12px, 0); }
            60% { clip: rect(65px, 9999px, 5px, 0); }
            80% { clip: rect(15px, 9999px, 58px, 0); }
            100% { clip: rect(96px, 9999px, 94px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(12px, 9999px, 56px, 0); }
            20% { clip: rect(54px, 9999px, 12px, 0); }
            40% { clip: rect(23px, 9999px, 92px, 0); }
            60% { clip: rect(87px, 9999px, 34px, 0); }
            80% { clip: rect(2px, 9999px, 67px, 0); }
            100% { clip: rect(45px, 9999px, 15px, 0); }
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            50% { transform: skew(1deg); }
            100% { transform: skew(-1deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.8); }
        }

        @keyframes scanline {
            0% { transform: translateY(0); opacity: 0.2; }
            45% { opacity: 0.7; }
            100% { transform: translateY(250px); opacity: 0.15; }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 24px 20px;
            }

            .helper-text,
            .panel-copy {
                font-size: 0.85rem;
            }

            .hero-badge {
                width: 62px;
                height: 62px;
                margin-bottom: 16px;
                border-radius: 18px;
                font-size: 1.7rem;
            }

            .hud {
                padding-bottom: 16px;
            }

            .hud-row {
                gap: 12px;
            }

            .hud-note {
                max-width: 12rem;
                line-height: 1.35;
            }
        }
    </style>
</head>
<body>

<!-- Assets (Hidden) -->
<div id="assets" class="hidden">
    <img id="img-hero" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" crossorigin="anonymous" alt="">
    <img id="img-obstacle" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png" crossorigin="anonymous" alt="">
</div>

<!-- Game Container -->
<div id="game-container" class="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="ui-layer hud hidden">
        <div class="hud-row">
            <div class="hud-block">
                <div class="hud-live">
                    <div class="live-dot"></div>
                    <span class="hud-live-label display-font">LIVE</span>
                </div>
                <div class="score-display" id="score-display">0</div>
                <div class="score-label">Signal Streak</div>
                <div class="hud-note">Relay Sprite online</div>
            </div>
            <button id="btn-sound" class="interactive icon-button glass-panel" aria-label="Toggle sound">
                <svg id="icon-sound-on" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <svg id="icon-sound-off" class="hidden" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
            </button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="screen-start" class="ui-layer screen screen-start">
        <div class="glass-panel panel panel--start interactive">
            <div class="signal-frame" aria-hidden="true"></div>
            <div class="hero-badge" aria-hidden="true">📡</div>
            <h1 class="title display-font glitch" data-text="SIGNAL SPRINT">SIGNAL SPRINT</h1>
            <p class="subtitle display-font">Broadcast Dash</p>
            <p class="panel-copy">Pilot a spark-bright courier through the blackout grid and keep the city feed alive.</p>
            <button id="btn-start" class="btn-primary action-button display-font">
                Go Live
            </button>
            <p class="helper-text">Tap to boost • Thread the signal gates</p>
            <!-- [agent-note][stage1] role: future-audio | trigger: score-up | intent: accent each clean gate clear -->
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="screen-gameover" class="ui-layer screen screen-gameover hidden">
        <div class="glass-panel panel interactive">
            <div class="signal-frame" aria-hidden="true"></div>
            <div class="hero-badge" aria-hidden="true">⚡</div>
            <h2 class="title display-font glitch" data-text="SIGNAL LOST">SIGNAL LOST</h2>
            <div class="result-wrap">
                <div class="final-label">Best Streak</div>
                <div id="final-score" class="final-score">0</div>
            </div>
            <button id="btn-restart" class="btn-primary action-button display-font">
                Reconnect
            </button>
        </div>
    </div>
</div>

<script>
/**
 * AUDIO SYSTEM
 * Robust Web Audio API implementation with procedural fallbacks.
 */
class AudioController {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.buffers = {};
        this.sources = {
            bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
            start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
            jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
            score: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
            crash: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
            toggle: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3'
        };
        this.gains = {
            bgm: 0.24,
            start: 0.45,
            jump: 0.4,
            score: 0.36,
            crash: 0.5,
            toggle: 0.28
        };
        this.bgmNode = null;
        this.bgmGain = null;
        this.loadingPromise = null;
        this.lastPlayedAt = {};
        this.cooldowns = {
            jump: 80,
            score: 120,
            crash: 250,
            toggle: 100,
            start: 180
        };
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.loadingPromise = this.preloadSounds();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        return this.loadingPromise || Promise.resolve();
    }

    async preloadSounds() {
        const entries = Object.entries(this.sources);
        await Promise.all(entries.map(async ([key, url]) => {
            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                this.buffers[key] = await this.ctx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn(`Failed to load audio ${key}, using fallback.`, e);
            }
        }));
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.stopBGM();
        } else {
            this.init();
            this.playSFX('toggle');
            this.playBGM();
        }
        return this.muted;
    }

    stopBGM() {
        if (this.bgmNode) {
            try {
                this.bgmNode.stop();
            } catch (e) {}
            try {
                this.bgmNode.disconnect();
            } catch (e) {}
            this.bgmNode = null;
        }
        if (this.bgmGain) {
            try {
                this.bgmGain.disconnect();
            } catch (e) {}
            this.bgmGain = null;
        }
    }

    playBGM() {
        if (this.muted || !this.ctx) return;
        this.stopBGM();

        if (this.buffers.bgm) {
            this.bgmNode = this.ctx.createBufferSource();
            this.bgmNode.buffer = this.buffers.bgm;
            this.bgmNode.loop = true;
            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.value = this.gains.bgm;
            this.bgmNode.connect(this.bgmGain);
            this.bgmGain.connect(this.ctx.destination);
            this.bgmNode.start(0);
        }
    }

    playSFX(type) {
        if (this.muted || !this.ctx) return;

        const nowMs = performance.now();
        const cooldown = this.cooldowns[type] || 0;
        if (cooldown && this.lastPlayedAt[type] && nowMs - this.lastPlayedAt[type] < cooldown) {
            return;
        }
        this.lastPlayedAt[type] = nowMs;

        if (this.buffers[type]) {
            const source = this.ctx.createBufferSource();
            source.buffer = this.buffers[type];
            const gain = this.ctx.createGain();
            gain.gain.value = this.gains[type] ?? 0.4;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.onended = () => {
                source.disconnect();
                gain.disconnect();
            };
            source.start(0);
        } else {
            this.playFallback(type);
        }
    }

    playFallback(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'jump' || type === 'start') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.13);
            osc.start(now);
            osc.stop(now + 0.13);
        } else if (type === 'score' || type === 'toggle') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(920, now);
            osc.frequency.exponentialRampToValueAtTime(1380, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.32);
            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.start(now);
            osc.stop(now + 0.32);
        }
    }
}

/**
 * GAME ENGINE
 */
const CONFIG = {
    gravity: 2000,
    jumpForce: 550,
    speed: 240,
    pipeGap: 210,
    pipeSpawnDist: 320,
    heroSize: 36
};

class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.audio = new AudioController();

        this.state = 'START';
        this.lastTime = 0;
        this.score = 0;
        this.shake = 0;

        this.hero = { x: 0, y: 0, vy: 0, r: 0 };
        this.pipes = [];
        this.particles = [];

        this.imgHero = document.getElementById('img-hero');
        this.imgPipe = document.getElementById('img-obstacle');

        this.resize = this.resize.bind(this);
        this.loop = this.loop.bind(this);
        this.handleInput = this.handleInput.bind(this);

        window.addEventListener('resize', this.resize);
        this.resize();

        this.canvas.addEventListener('pointerdown', this.handleInput);
        this.canvas.addEventListener('touchstart', this.handleInput, { passive: false });

        this.uiStart = document.getElementById('screen-start');
        this.uiHUD = document.getElementById('hud');
        this.uiGameOver = document.getElementById('screen-gameover');
        this.elScore = document.getElementById('score-display');
        this.elFinalScore = document.getElementById('final-score');

        document.getElementById('btn-start').addEventListener('click', () => this.startGame());
        document.getElementById('btn-restart').addEventListener('click', () => this.resetGame());

        const btnSound = document.getElementById('btn-sound');
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');
        btnSound.addEventListener('click', (e) => {
            e.stopPropagation();
            const isMuted = this.audio.toggleMute();
            if (isMuted) {
                iconOn.classList.add('hidden');
                iconOff.classList.remove('hidden');
                btnSound.classList.add('muted');
            } else {
                iconOn.classList.remove('hidden');
                iconOff.classList.add('hidden');
                btnSound.classList.remove('muted');
            }
        });

        requestAnimationFrame(this.loop);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    }

    startGame() {
        this.audio.init();
        this.audio.playSFX('start');
        this.audio.playBGM();
        this.resetGame();
    }

    resetGame() {
        this.state = 'PLAY';
        this.score = 0;
        this.elScore.innerText = '0';
        this.pipes = [];
        this.particles = [];
        this.hero = {
            x: this.width * 0.2,
            y: this.height * 0.4,
            vy: 0,
            r: 0
        };
        this.shake = 0;

        this.uiStart.classList.add('hidden');
        this.uiGameOver.classList.add('hidden');
        this.uiHUD.classList.remove('hidden');

        this.jump();
        this.spawnPipe(this.width + 100);
    }

    handleInput(e) {
        if (e) e.preventDefault();
        if (this.state === 'PLAY') {
            this.jump();
        }
    }

    jump() {
        this.hero.vy = -CONFIG.jumpForce;
        this.audio.playSFX('jump');
        this.spawnParticles(this.hero.x, this.hero.y + CONFIG.heroSize, 5, '#fff');
    }

    spawnPipe(x) {
        const minH = 100;
        const maxH = this.height - CONFIG.pipeGap - minH;
        const topH = Math.random() * (maxH - minH) + minH;

        this.pipes.push({
            x: x,
            y: 0,
            w: 60,
            h: topH,
            type: 'top',
            passed: false
        });
        this.pipes.push({
            x: x,
            y: topH + CONFIG.pipeGap,
            w: 60,
            h: this.height - (topH + CONFIG.pipeGap),
            type: 'bottom',
            passed: false
        });
    }

    spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            this.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 200,
                vy: (Math.random() - 0.5) * 200,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    update(dt) {
        if (this.state !== 'PLAY') return;

        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 20);

        this.hero.vy += CONFIG.gravity * dt;
        this.hero.y += this.hero.vy * dt;
        this.hero.r = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.hero.vy * 0.002));

        if (this.hero.y > this.height || this.hero.y < -100) {
            this.die();
        }

        let rightMost = 0;
        for (let i = this.pipes.length - 1; i >= 0; i--) {
            const p = this.pipes[i];
            p.x -= CONFIG.speed * dt;
            rightMost = Math.max(rightMost, p.x);

            const buffer = 8;
            if (
                this.hero.x + CONFIG.heroSize - buffer > p.x &&
                this.hero.x + buffer < p.x + p.w &&
                this.hero.y + CONFIG.heroSize - buffer > p.y &&
                this.hero.y + buffer < p.y + p.h
            ) {
                this.die();
            }

            if (p.type === 'top' && !p.passed && p.x + p.w < this.hero.x) {
                p.passed = true;
                this.score++;
                this.elScore.innerText = this.score;
                this.audio.playSFX('score');
                this.elScore.style.transform = 'scale(1.5)';
                setTimeout(() => this.elScore.style.transform = 'scale(1)', 100);
            }

            if (p.x + p.w < -50) {
                this.pipes.splice(i, 1);
            }
        }

        if (this.width - rightMost > CONFIG.pipeSpawnDist) {
            this.spawnPipe(this.width);
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    }

    die() {
        this.state = 'GAMEOVER';
        this.audio.playSFX('crash');
        this.shake = 20;
        this.spawnParticles(this.hero.x, this.hero.y, 30, '#ff0000');

        setTimeout(() => {
            this.uiHUD.classList.add('hidden');
            this.uiGameOver.classList.remove('hidden');
            this.elFinalScore.innerText = this.score;
        }, 500);
    }

    draw() {
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, '#0a1430');
        skyGrad.addColorStop(0.6, '#050816');
        skyGrad.addColorStop(1, '#03040a');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const glow = this.ctx.createRadialGradient(this.width * 0.48, this.height * 0.22, 20, this.width * 0.48, this.height * 0.22, this.width * 0.7);
        glow.addColorStop(0, 'rgba(88, 245, 255, 0.18)');
        glow.addColorStop(0.35, 'rgba(88, 245, 255, 0.06)');
        glow.addColorStop(1, 'rgba(88, 245, 255, 0)');
        this.ctx.fillStyle = glow;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();

        if (this.shake > 0) {
            const dx = (Math.random() - 0.5) * this.shake;
            const dy = (Math.random() - 0.5) * this.shake;
            this.ctx.translate(dx, dy);
        }

        this.ctx.strokeStyle = 'rgba(88, 245, 255, 0.08)';
        this.ctx.lineWidth = 1.5;
        this.ctx.beginPath();
        const gridSize = 52;
        const offset = (Date.now() / 60) % gridSize;
        for (let x = -offset; x < this.width; x += gridSize) {
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.height);
        }
        for (let y = this.height * 0.58; y < this.height; y += 42) {
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.width, y);
        }
        this.ctx.stroke();

        this.ctx.fillStyle = '#1b2240';
        this.ctx.strokeStyle = '#58f5ff';
        this.ctx.lineWidth = 2;

        this.pipes.forEach((p) => {
            if (this.imgPipe && this.imgPipe.complete && this.imgPipe.naturalWidth > 0) {
                this.ctx.drawImage(this.imgPipe, p.x, p.y, p.w, p.h);
            } else {
                const hazardGrad = this.ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y + p.h);
                hazardGrad.addColorStop(0, '#1d1247');
                hazardGrad.addColorStop(1, '#2d0f2f');
                this.ctx.fillStyle = hazardGrad;
                this.ctx.fillRect(p.x, p.y, p.w, p.h);
                this.ctx.strokeStyle = '#58f5ff';
                this.ctx.strokeRect(p.x, p.y, p.w, p.h);
                this.ctx.fillStyle = '#ff6b2c';
                this.ctx.fillRect(p.x + 8, p.y + (p.type === 'top' ? p.h - 18 : 8), p.w - 16, 8);
                this.ctx.fillStyle = '#ffe27a';
                this.ctx.fillRect(p.x + 16, p.y + (p.type === 'top' ? p.h - 28 : 18), p.w - 32, 3);
            }
        });

        this.ctx.save();
        this.ctx.translate(this.hero.x + CONFIG.heroSize / 2, this.hero.y + CONFIG.heroSize / 2);
        this.ctx.rotate(this.hero.r);

        if (this.imgHero && this.imgHero.complete && this.imgHero.naturalWidth > 0) {
            this.ctx.save();
            this.ctx.shadowColor = 'rgba(122, 248, 255, 0.45)';
            this.ctx.shadowBlur = 18;
            this.ctx.drawImage(this.imgHero, -CONFIG.heroSize / 2, -CONFIG.heroSize / 2, CONFIG.heroSize, CONFIG.heroSize);
            this.ctx.restore();
        } else {
            this.ctx.fillStyle = '#7af8ff';
            this.ctx.beginPath();
            this.ctx.roundRect(-CONFIG.heroSize / 2, -CONFIG.heroSize / 2, CONFIG.heroSize, CONFIG.heroSize, 10);
            this.ctx.fill();
            this.ctx.fillStyle = '#0c1230';
            this.ctx.fillRect(-4, -3, 8, 8);
            this.ctx.fillStyle = '#ff6b2c';
            this.ctx.fillRect(8, -2, 7, 12);
            this.ctx.fillStyle = '#ffe27a';
            this.ctx.fillRect(-13, -13, 6, 6);
        }
        this.ctx.restore();

        this.particles.forEach((p) => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(p.x, p.y, p.size, p.size);
            this.ctx.fillStyle = 'rgba(255, 226, 122, 0.35)';
            this.ctx.fillRect(p.x - 1, p.y - 1, Math.max(1, p.size - 1), Math.max(1, p.size - 1));
        });
        this.ctx.globalAlpha = 1.0;

        this.ctx.restore();
    }

    loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame(this.loop);
    }
}

window.onload = () => {
    new Game();
};
</script>
