<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover"><title>Sheriff Skibidi: Dust Jail Drift</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet"><style>
:root{--sand:#ffd37a;--hot:#ff7a18;--red:#e73323;--ink:#241007;--lime:#baff3b;--panel:rgba(55,24,8,.82)}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#3a1707;color:#fff;user-select:none;-webkit-user-select:none;font-family:'Press Start 2P',monospace}#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 8%,#ffed9b 0 8%,#f68526 19%,#73300a 55%,#1c0904 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none}.screen{display:none;pointer-events:auto;text-align:center;width:min(92vw,430px);padding:20px;border:4px solid #7b3107;border-radius:24px;background:linear-gradient(180deg,rgba(255,199,94,.95),rgba(108,43,9,.9));box-shadow:0 18px 50px #0009,inset 0 0 0 4px #fff3;position:relative}.screen:before{content:'🤠';position:absolute;left:12px;top:-28px;font-size:54px;filter:drop-shadow(0 5px 0 #0005)}.screen.active{display:flex;flex-direction:column;gap:13px;animation:pop .25s ease-out}h1{font-family:Bangers,cursive;letter-spacing:2px;font-size:clamp(2.4rem,10vw,4.3rem);line-height:.88;margin:0;color:#fff;text-shadow:4px 4px 0 #7d1508,0 0 22px #fffb}p{margin:0;font-size:clamp(.72rem,2.6vw,.92rem);line-height:1.55;color:#2b1105}.chip{align-self:center;padding:8px 12px;border-radius:999px;background:#2a1007;color:var(--lime);font-size:.62rem;border:2px dashed #ffdc7f;text-transform:uppercase}button{font-family:'Press Start 2P',monospace;font-size:clamp(.75rem,2.9vw,.92rem);padding:15px 18px;border:0;border-radius:999px;background:linear-gradient(180deg,#baff3b,#45d52c);color:#241007;box-shadow:0 8px 0 #227316,0 18px 24px #0005;text-transform:uppercase;cursor:pointer}button:active{transform:translateY(5px);box-shadow:0 3px 0 #227316,0 10px 18px #0005}#hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:none;padding:10px 12px;border-radius:16px;background:var(--panel);border:3px solid #ffca65;box-shadow:0 8px 22px #0008;font-size:clamp(.62rem,2.4vw,.82rem);z-index:5}#score{color:#ffe15d}#mute{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:6;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#321207;border:3px solid #ffca65;box-shadow:0 8px 20px #0008;pointer-events:auto;cursor:pointer}.poster{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-family:Bangers,cursive;color:#fff2;font-size:clamp(2.6rem,12vw,8rem);letter-spacing:.08em;pointer-events:none;white-space:nowrap}.toast{position:absolute;right:14px;bottom:max(16px,env(safe-area-inset-bottom));width:min(32vw,120px);opacity:0;transform:scale(.85) rotate(4deg);transition:.18s;pointer-events:none;z-index:4}.toast.show{opacity:.95;transform:scale(1) rotate(-4deg)}.toast img{width:100%;border-radius:18px;border:3px solid #ffca65;background:#321207}.toast div{margin-top:-7px;background:#321207;color:#ffe15d;border-radius:999px;padding:5px;font-family:Bangers,cursive;letter-spacing:1px;text-align:center}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:480px){.screen{padding:17px;gap:11px}button{width:100%}.poster{bottom:76px}.toast{width:94px}}
</style></head><body><div id="game"><canvas id="c"></canvas><div class="poster">YEEHAW NO CAP</div><div id="hud">YEEHAW STREAK: <span id="score">0</span></div><div id="mute" aria-label="Toggle audio">🔊</div><div class="toast" id="toast"><img id="gif" alt=""><div id="cap">BONK</div></div><div class="ui"><section id="start" class="screen active"><div class="chip">deterministic outlaw brainrot</div><h1>SHERIFF<br>SKIBIDI</h1><p>Drag the floating cowboy outlaw. Dodge cursed tumbleweeds. Survive the desert algorithm as long as possible.</p><button id="startBtn">Ride the Dust</button></section><section id="over" class="screen"><div class="chip">sent to dust jail</div><h1>BONKED<br>PARTNER</h1><p>Final Yeehaw Streak: <span id="final">0</span></p><button id="restartBtn">Remount</button></section></div></div><script>
const MEDIA={audio:{bgm:'https://gamezone-virid.vercel.app/assets/audios/bgm/desert_bgm_01.mp3',start:'https://gamezone-virid.vercel.app/assets/audios/sfx/desert_character_01.mp3',ui:'https://gamezone-virid.vercel.app/assets/audios/sfx/desert_item_01.mp3',warn:'https://gamezone-virid.vercel.app/assets/audios/sfx/desert_enemy_01.mp3',boom:'https://gamezone-virid.vercel.app/assets/audios/sfx/desert_defeat_01.mp3'},gifs:{warn:'https://i.giphy.com/wcUySG1fjlMZxWtIhY.webp',boom:'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp'}};
class AudioBus{constructor(){this.muted=false;this.ready=false;this.last={};this.cool={ui:120,warn:850,boom:300,start:250};this.s={};for(const k in MEDIA.audio){let a=new Audio(MEDIA.audio[k]);a.preload=k==='bgm'?'metadata':'auto';a.loop=k==='bgm';a.volume=k==='bgm'?.22:.45;this.s[k]=a}}prime(){this.ready=true;this.s.bgm.load()}toggle(){this.muted=!this.muted;Object.values(this.s).forEach(a=>a.muted=this.muted);if(this.muted)this.s.bgm.pause();else if(state==='PLAY')this.bgm();return this.muted}ok(k){let n=performance.now(),l=this.last[k]||0;if(n-l<(this.cool[k]||0))return false;this.last[k]=n;return true}play(k){if(this.muted||!this.s[k]||!this.ok(k))return;let a=this.s[k].cloneNode(true);a.volume=this.s[k].volume;a.muted=this.muted;a.play().catch(()=>{})}bgm(){if(this.ready&&!this.muted)this.s.bgm.play().catch(()=>{})}stop(){this.s.bgm.pause();this.s.bgm.currentTime=0}}
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),bus=new AudioBus();let state='MENU',score=0,last=0,spawnTimer=0,difficultyMultiplier=1,warningTriggered=false,feedbackTimer=0;const input={x:0,y:0,active:false},player={x:0,y:0,radius:20,trail:[]};let enemies=[],particles=[];const start=document.getElementById('start'),over=document.getElementById('over'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),finalEl=document.getElementById('final'),toast=document.getElementById('toast'),gif=document.getElementById('gif'),cap=document.getElementById('cap');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;if(state==='MENU'){player.x=canvas.width/2;player.y=canvas.height/2;input.x=player.x;input.y=player.y}}addEventListener('resize',resize);resize();function aim(x,y){input.x=x;input.y=y;input.active=true}addEventListener('mousemove',e=>aim(e.clientX,e.clientY));canvas.addEventListener('touchmove',e=>{if(state!=='PLAY'||!e.touches.length)return;e.preventDefault();aim(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});canvas.addEventListener('touchstart',e=>{if(!e.touches.length)return;if(state==='PLAY')e.preventDefault();aim(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});document.getElementById('startBtn').onclick=startGame;document.getElementById('restartBtn').onclick=startGame;document.getElementById('mute').onclick=()=>{bus.play('ui');document.getElementById('mute').textContent=bus.toggle()?'🔇':'🔊'};
function feedback(t,l,d=1100){gif.src=MEDIA.gifs[t];cap.textContent=l;toast.classList.add('show');feedbackTimer=d}function hideFeedback(){toast.classList.remove('show')}function startGame(){bus.prime();bus.play('start');bus.bgm();state='PLAY';score=0;difficultyMultiplier=1;spawnTimer=0;warningTriggered=false;enemies=[];particles=[];player.x=canvas.width/2;player.y=canvas.height/2;input.x=player.x;input.y=player.y;player.trail=[];start.classList.remove('active');over.classList.remove('active');hud.style.display='block';scoreEl.textContent='0';hideFeedback()}function gameOver(){state='GAMEOVER';bus.stop();bus.play('boom');feedback('boom','DUST JAIL',1800);hud.style.display='none';over.classList.add('active');finalEl.textContent=Math.floor(score)}
function near(){let m=Infinity;for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.sqrt(dx*dx+dy*dy)-e.radius-player.radius;if(d<m)m=d}return m}function update(dt){if(feedbackTimer>0){feedbackTimer-=dt*1000;if(feedbackTimer<=0)hideFeedback()}if(state!=='PLAY')return;score+=dt*10;scoreEl.textContent=Math.floor(score);difficultyMultiplier=1+score/1000;player.x+=(input.x-player.x)*.15;player.y+=(input.y-player.y)*.15;player.trail.push({x:player.x,y:player.y,age:1});player.trail.forEach(t=>t.age-=dt*5);player.trail=player.trail.filter(t=>t.age>0);spawnTimer+=dt;if(spawnTimer>1/difficultyMultiplier){spawnEnemy();spawnTimer=0}enemies.forEach(e=>{e.x+=e.vx*dt*60;e.y+=e.vy*dt*60;e.pulse+=dt*5});enemies=enemies.filter(e=>e.x>-50&&e.x<canvas.width+50&&e.y>-50&&e.y<canvas.height+50);let d=near();if(d<90&&!warningTriggered){warningTriggered=true;bus.play('warn');feedback('warn','TOO CLOSE',900)}else if(d>135)warningTriggered=false;for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,dist=Math.sqrt(dx*dx+dy*dy),r=e.radius+Math.sin(e.pulse)*3;if(dist<player.radius+r-5){explode(player.x,player.y,'#ffe15d');gameOver();break}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x,y,vx,vy,s=(2+Math.random()*3)*difficultyMultiplier;if(side===0){x=Math.random()*canvas.width;y=-30;vx=(Math.random()-.5)*2;vy=s}else if(side===1){x=canvas.width+30;y=Math.random()*canvas.height;vx=-s;vy=(Math.random()-.5)*2}else if(side===2){x=Math.random()*canvas.width;y=canvas.height+30;vx=(Math.random()-.5)*2;vy=-s}else{x=-30;y=Math.random()*canvas.height;vx=s;vy=(Math.random()-.5)*2}enemies.push({x,y,vx,vy,radius:15+Math.random()*15,pulse:Math.random()*Math.PI})}function explode(x,y,color){for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2,s=Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,color})}}
function bg(){let w=canvas.width,h=canvas.height,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ffbd45');g.addColorStop(.5,'#ca5b18');g.addColorStop(1,'#351007');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffef7a';ctx.beginPath();ctx.arc(w*.78,h*.15,46+Math.sin(performance.now()/500)*4,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.14)';for(let i=0;i<9;i++){let y=(i*h/9+(performance.now()/45)%80);ctx.fillRect(0,y,w,3)}ctx.fillStyle='rgba(55,18,5,.42)';for(let i=0;i<8;i++){let x=(i*137+60)%w,y=h-85-((i*43)%95),s=18+(i%3)*9;ctx.fillRect(x,y,s*.28,s*2.3);ctx.fillRect(x-s*.42,y+s*.55,s,s*.25);ctx.fillRect(x+s*.08,y+s*.95,s*.75,s*.25)}ctx.fillStyle='rgba(36,16,7,.55)';for(let i=0;i<12;i++){let x=(i*91+(performance.now()/35))%(w+120)-60,y=h-35-(i%4)*10;ctx.beginPath();ctx.ellipse(x,y,75,10,0,0,7);ctx.fill()}}
function drawPlayer(){player.trail.forEach(t=>{ctx.fillStyle=`rgba(186,255,59,${t.age*.16})`;ctx.beginPath();ctx.arc(t.x,t.y,player.radius*(.6+t.age*.8),0,7);ctx.fill()});ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#8b3b09';ctx.fillRect(-28,-25,56,10);ctx.beginPath();ctx.ellipse(0,-25,24,12,0,0,7);ctx.fill();ctx.fillStyle='#ffdf96';ctx.beginPath();ctx.arc(0,0,player.radius,0,7);ctx.fill();ctx.fillStyle='#2b1006';ctx.fillRect(-14,-6,9,4);ctx.fillRect(6,-6,9,4);ctx.fillStyle='#c21b0d';ctx.fillRect(-18,13,36,8);ctx.fillStyle='#fff';ctx.font='12px Bangers';ctx.textAlign='center';ctx.fillText('NO CAP',0,4);ctx.strokeStyle='#baff3b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,player.radius+5,0,7);ctx.stroke();ctx.restore()}function drawEnemy(e){let r=e.radius+Math.sin(e.pulse)*3;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.pulse*.7);ctx.fillStyle='#6d2d09';ctx.strokeStyle='#e73323';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<14;i++){let a=i*Math.PI*2/14,rr=i%2?r+6:r*.72,px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffef7a';ctx.font=`${Math.max(12,r*.65)}px Bangers`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('BONK',0,1);ctx.restore()}function draw(){bg();drawPlayer();enemies.forEach(drawEnemy);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();ctx.globalAlpha=1})}function loop(t){let dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
