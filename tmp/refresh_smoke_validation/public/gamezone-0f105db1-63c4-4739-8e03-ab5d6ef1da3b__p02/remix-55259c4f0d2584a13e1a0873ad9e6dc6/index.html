<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Kelp Confidential</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
  :root {
    --abyss: #061420;
    --ink: #020611;
    --kelp: #11d6ad;
    --aqua: #74f6ff;
    --bubble: #d9fff4;
    --sponge: #ffd85c;
    --sponge-shadow: #d69b2f;
    --noir: #121526;
    --danger: #ff4778;
    --danger-deep: #a81343;
    --casefile: rgba(7, 28, 43, 0.78);
    --panel-line: rgba(116, 246, 255, 0.42);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); color: var(--bubble); font-family: 'Rajdhani', system-ui, sans-serif; }
  #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, #08263a 0%, #061420 47%, #020611 100%); }
  #game-container::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(circle at 22% 11%, rgba(255,216,92,0.16), transparent 17%),
      radial-gradient(circle at 78% 19%, rgba(116,246,255,0.13), transparent 18%),
      repeating-linear-gradient(160deg, transparent 0 38px, rgba(255,255,255,0.025) 39px 42px),
      linear-gradient(180deg, rgba(6,20,32,0), rgba(2,6,17,0.7));
    mix-blend-mode: screen; opacity: 0.84;
  }
  #game-container::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(circle at center, transparent 39%, rgba(0,0,0,0.62) 100%), repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 5px);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 0; }
  #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: flex; flex-direction: column; justify-content: space-between; }
  #hud { padding: max(13px, env(safe-area-inset-top)) 12px 10px; transition: opacity .28s ease; }
  .hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  #score-display {
    display: inline-flex; align-items: center; gap: 9px; min-height: 42px; padding: 9px 13px 8px;
    border: 1px solid var(--panel-line); border-radius: 999px; background: linear-gradient(180deg, rgba(8,37,54,.92), rgba(3,12,24,.8));
    color: var(--bubble); font-family: 'Orbitron', sans-serif; font-size: clamp(14px, 3.8vw, 21px); font-weight: 700; letter-spacing: .9px;
    box-shadow: 0 0 22px rgba(116,246,255,.16), inset 0 0 20px rgba(255,216,92,.06); text-shadow: 0 0 10px rgba(116,246,255,.5);
  }
  #score-display::before { content: "🔎"; filter: drop-shadow(0 0 6px rgba(255,216,92,.85)); font-size: 1.05em; }
  #case-badge {
    padding: 8px 11px; border-radius: 14px; border: 1px solid rgba(255,216,92,.34); background: rgba(18,21,38,.62);
    color: rgba(255,247,204,.9); font-family: 'Bangers', cursive; letter-spacing: 1.5px; font-size: clamp(15px, 4vw, 21px); transform: rotate(1deg);
    box-shadow: inset 0 0 14px rgba(255,216,92,.07);
  }
  #story-text, #feedback-strip {
    max-width: min(92vw, 480px); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    background: var(--casefile); border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(116,246,255,.08), 0 10px 28px rgba(0,0,0,.22);
  }
  #story-text {
    margin-top: 9px; padding: 9px 12px; border-left: 4px solid var(--sponge); color: rgba(225,255,249,.88);
    font-size: clamp(13px, 3.5vw, 18px); line-height: 1.15; min-height: 1.1em; opacity: .92; transition: opacity .35s ease;
  }
  #feedback-strip { display: flex; align-items: center; gap: 8px; width: fit-content; margin-top: 9px; padding: 7px 10px; border: 1px solid rgba(116,246,255,.24); font-size: clamp(12px, 3.1vw, 15px); }
  #feedback-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--kelp); box-shadow: 0 0 11px rgba(17,214,173,.9); animation: blink 1.4s ease-in-out infinite; }
  #feedback-strip.danger #feedback-dot { background: var(--danger); box-shadow: 0 0 11px rgba(255,71,120,.9); }
  #game-over-screen { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .28s ease; display: flex; align-items: center; justify-content: center; padding: 18px; background: radial-gradient(circle at 50% 42%, rgba(255,71,120,.14), transparent 31%), rgba(2,6,17,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #game-over-screen.active { pointer-events: auto; opacity: 1; }
  .game-over-card { width: min(100%, 378px); max-height: min(90vh, 480px); overflow-y: auto; padding: 24px 18px; border-radius: 24px; border: 1px solid rgba(116,246,255,.34); background: linear-gradient(180deg, rgba(8,37,54,.97), rgba(5,12,28,.96)); box-shadow: 0 22px 60px rgba(0,0,0,.55), 0 0 32px rgba(116,246,255,.13); text-align: center; }
  h1 { margin: 0 0 8px; font-family: 'Bangers', cursive; color: var(--sponge); font-size: clamp(34px, 9vw, 58px); font-weight: 400; letter-spacing: 2px; text-shadow: 3px 4px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,216,92,.34); }
  .final-score { margin: 0 0 18px; color: rgba(225,255,249,.76); font-size: clamp(16px,4.5vw,20px); }
  #restart-btn { pointer-events: auto; width: 100%; min-height: 52px; border: 1px solid rgba(255,216,92,.58); border-radius: 16px; background: linear-gradient(180deg, rgba(255,216,92,.96), rgba(214,155,47,.96)); color: #271908; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: clamp(15px,4.2vw,21px); text-transform: uppercase; letter-spacing: .8px; cursor: pointer; box-shadow: 0 0 22px rgba(255,216,92,.22); }
  #restart-btn:active { transform: scale(.97); filter: brightness(1.05); }
  #gif-overlay { position: absolute; right: 11px; bottom: max(78px, env(safe-area-inset-bottom) + 64px); width: min(31vw, 120px); aspect-ratio: 1; z-index: 7; opacity: 0; transform: translateY(10px) scale(.9); transition: opacity .22s ease, transform .22s ease; pointer-events: none; }
  #gif-overlay.active { opacity: .88; transform: translateY(0) scale(1); }
  #gif-overlay img { width: 100%; height: 100%; object-fit: cover; border-radius: 22px; border: 1px solid rgba(255,216,92,.32); background: rgba(8,37,54,.5); filter: saturate(1.2) contrast(1.05); }
  @keyframes blink { 0%,100%{transform:scale(.8);opacity:.68} 50%{transform:scale(1.15);opacity:1} }
  @media (max-width: 480px) { #case-badge { display: none; } #hud { padding-left: 10px; padding-right: 10px; } #story-text { font-size: 13.5px; } #feedback-strip { max-width: 90vw; } .game-over-card { padding: 21px 15px; } }
</style>
<script id="game-config" type="application/x-game-config">
{
  "playerSpeed": { "type": "number", "label": "Player Speed", "value": 6, "min": 3, "max": 10 },
  "obstacleSpeed": { "type": "number", "label": "Obstacle Speed", "value": 4, "min": 2, "max": 8 },
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#74f6ff" }
}
</script>
<audio id="bgm_main" data-editable="audio" data-label="Main BGM" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Clue SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3" preload="auto"></audio>
<audio id="sfx_warning" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3" preload="auto"></audio>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" aria-label="Neon Kelp Confidential playfield"></canvas>
  <div id="ui-layer">
    <div id="hud">
      <div class="hud-row">
        <div id="score-display">CLUES: 0</div>
        <div id="case-badge">Kelp City P.I.</div>
      </div>
      <div id="story-text">Drag the detective sponge through the alley and bag glowing clue chips.</div>
      <div id="feedback-strip" class="success"><span id="feedback-dot"></span><span id="feedback-text">CASE OPEN • tap or drag to steer Detective Porifera.</span></div>
    </div>
    <div id="game-over-screen">
      <div class="game-over-card">
        <h1>Case Soaked</h1>
        <p class="final-score" id="final-score">Clues Bagged: 0</p>
        <button id="restart-btn">Reopen Case</button>
      </div>
    </div>
  </div>
  <div id="gif-overlay" aria-hidden="true"><img id="gif-image" alt="Case feedback overlay"></div>
</div>
<script>
'use strict';
const defaultConfig = { playerSpeed: 6, obstacleSpeed: 4, themeColor: '#74f6ff' };
window.gameConfig = { ...defaultConfig };
function parseConfig(){ const el=document.getElementById('game-config'); if(!el) return; try{ const parsed=JSON.parse(el.textContent); for(const key in parsed){ if(parsed[key].type==='number') window.gameConfig[key]=Number(parsed[key].value); else if(parsed[key].type==='color') window.gameConfig[key]=String(parsed[key].value); } }catch(e){ console.error('Config parse error', e); } }
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sfxNodes = {}, sfxBuffers = {}, lastSfxAt = {};
let audioUnlocked = false;
const gifMap = { collect: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp', fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp' };
function registerAudioElements(){ [['collect','sfx_collect'],['warning','sfx_warning'],['fail','sfx_fail'],['ui','sfx_ui']].forEach(([id,dom])=>{ const el=document.getElementById(dom); if(el&&el.src){ sfxNodes[id]=el; el.volume=id==='fail'?.42:id==='warning'?.28:id==='ui'?.2:.3; el.preload='metadata'; } }); const bgm=document.getElementById('bgm_main'); if(bgm){ bgm.volume=.18; bgm.preload='metadata'; } }
async function loadSfx(id,url){ return null; }
function playTone(f=440,d=.14,v=.035,type='sine'){ if(!audioCtx) return; try{ if(audioCtx.state==='suspended') audioCtx.resume(); const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(); osc.type=type; osc.frequency.value=f; gain.gain.setValueAtTime(v,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+d); }catch(e){} }
function playSfx(id, options={}){ const now=performance.now(), minGap=options.minGap??80; if(lastSfxAt[id] && now-lastSfxAt[id]<minGap) return; lastSfxAt[id]=now; const el=sfxNodes[id]; if(audioUnlocked && el){ try{ el.currentTime=0; el.play().catch(()=>{}); return; }catch(e){} } if(audioCtx && sfxBuffers[id]){ try{ if(audioCtx.state==='suspended') audioCtx.resume(); const src=audioCtx.createBufferSource(), gain=audioCtx.createGain(); src.buffer=sfxBuffers[id]; gain.gain.value=options.volume??(id==='fail'?.52:id==='warning'?.32:id==='ui'?.22:.3); src.connect(gain); gain.connect(audioCtx.destination); src.start(0); return; }catch(e){} } if(id==='fail') playTone(160,.28,.05,'sawtooth'); else if(id==='warning') playTone(280,.14,.035,'triangle'); else if(id==='ui') playTone(620,.08,.025,'square'); else playTone(740,.12,.035,'sine'); }
function unlockAudio(){ audioUnlocked=true; if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); syncBgmForState(); }
function startBgm(){ const bgm=document.getElementById('bgm_main'); if(bgm && gameState==='PLAYING') bgm.play().catch(()=>{}); }
function pauseBgm(){ const bgm=document.getElementById('bgm_main'); if(bgm) bgm.pause(); }
function syncBgmForState(){ if(!audioUnlocked) return; gameState==='PLAYING' ? startBgm() : pauseBgm(); }
function vibrate(style){ if(navigator.vibrate) navigator.vibrate(style==='heavy'?200:50); }
let feedbackTimeout=null;
function setFeedback(text,tone='success'){ const strip=document.getElementById('feedback-strip'), textEl=document.getElementById('feedback-text'); if(!strip||!textEl) return; strip.className=tone; textEl.textContent=text; }
function showGif(kind,duration=1100){ const overlay=document.getElementById('gif-overlay'), image=document.getElementById('gif-image'), src=gifMap[kind]; if(!overlay||!image||!src) return; overlay.className=kind; image.src=src; overlay.classList.add('active'); clearTimeout(feedbackTimeout); feedbackTimeout=setTimeout(()=>overlay.classList.remove('active'), duration); }
let gameState='INIT', canvas, ctx, cw=0, ch=0, dpr=1, lastTime=0, score=0, distance=0, warningCooldown=0, startCuePlayed=false, currentTextIdx=0;
const player={x:0,y:0,r:12,targetX:0};
const obstacles=[], particles=[], stars=[], bubbles=[];
const texts=[
  {d:0,t:'Drag the detective sponge through the alley and bag glowing clue chips.'},
  {d:500,t:'Dodge subpoena mines drifting out of the future reef.'},
  {d:1500,t:'Clue current is clean. Keep the magnifier steady.'},
  {d:3000,t:'A neon plankton fog rolls across the boulevard.'},
  {d:4500,t:'More clue chips sparkle near the coral towers.'},
  {d:6000,t:'The syndicate is dumping mine evidence upstream.'},
  {d:8000,t:'Dense alley traffic ahead. Work the case, detective.'},
  {d:10000,t:'Deep-zone sting operation in progress.'}
];
window.addEventListener('DOMContentLoaded',()=>{ parseConfig(); canvas=document.getElementById('gameCanvas'); ctx=canvas.getContext('2d',{alpha:false}); registerAudioElements(); setFeedback('CASE OPEN • tap or drag to steer Detective Porifera.','success'); const ro=new ResizeObserver(entries=>{ const rect=entries[0].contentRect; cw=rect.width; ch=rect.height; dpr=window.devicePixelRatio||1; canvas.width=cw*dpr; canvas.height=ch*dpr; canvas.style.width=cw+'px'; canvas.style.height=ch+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); if(gameState==='INIT'){ initGame(); setState('PLAYING'); requestAnimationFrame(gameLoop); } else { player.x=Math.max(player.r,Math.min(cw-player.r,player.x)); player.y=ch*.8; } }); ro.observe(canvas); window.addEventListener('pointerdown', handleGlobalInput, {passive:false}); window.addEventListener('pointermove', handleGameInput, {passive:false}); window.addEventListener('pointerup', handleGameInput, {passive:false}); window.addEventListener('pointercancel', handleGameInput, {passive:false}); document.getElementById('restart-btn')?.addEventListener('click', handleRestartClick); document.addEventListener('visibilitychange',()=>{ document.hidden?pauseBgm():syncBgmForState(); }); });
function setState(newState){ gameState=newState; const go=document.getElementById('game-over-screen'), hud=document.getElementById('hud'); if(newState==='PLAYING'){ go.classList.remove('active'); hud.style.opacity='1'; setFeedback(startCuePlayed?'MAGNIFIER HOT • collect clue chips, dodge mines.':'CASE OPEN • tap or drag to steer Detective Porifera.','success'); syncBgmForState(); } else if(newState==='GAMEOVER'){ go.classList.add('active'); hud.style.opacity='0'; document.getElementById('final-score').innerText=`Clues Bagged: ${score}`; pauseBgm(); } }
function initGame(){ score=0; distance=0; warningCooldown=0; currentTextIdx=0; lastTime=0; updateStoryText(texts[0].t); player.x=cw/2; player.y=ch*.8; player.targetX=cw/2; player.r=12; obstacles.length=0; particles.length=0; stars.length=0; bubbles.length=0; for(let i=0;i<64;i++){ stars.push({x:Math.random()*cw,y:Math.random()*ch,size:Math.random()*2+.45,speed:Math.random()*.55+.08,alpha:Math.random()*.55+.18}); } for(let i=0;i<26;i++){ bubbles.push({x:Math.random()*cw,y:Math.random()*ch,r:Math.random()*8+3,speed:Math.random()*16+9,phase:Math.random()*6.28}); } }
function restartGame(){ initGame(); setState('PLAYING'); }
function handleRestartClick(e){ e.preventDefault(); unlockAudio(); playSfx('ui',{minGap:40}); restartGame(); }
function handleGlobalInput(e){ unlockAudio(); if(!startCuePlayed && gameState==='PLAYING'){ startCuePlayed=true; playSfx('ui',{minGap:40}); setFeedback('MAGNIFIER HOT • collect clue chips, dodge mines.','success'); } if(gameState==='GAMEOVER'){ if(e.target.id==='restart-btn') restartGame(); return; } if(gameState==='PLAYING') handleGameInput(e); }
function handleGameInput(e){ if(gameState!=='PLAYING') return; e.preventDefault(); if(e.type==='pointerdown'||e.type==='pointermove'){ const rect=canvas.getBoundingClientRect(); const tx=e.clientX-rect.left; player.targetX=Math.max(player.r, Math.min(cw-player.r, tx)); } }
function updateStoryText(text){ const el=document.getElementById('story-text'); if(!el) return; el.style.opacity=0; setTimeout(()=>{ el.innerText=text; el.style.opacity=1; },260); }
function spawnObstacle(){ const r=15+Math.random()*20, x=Math.random()*(cw-2*r)+r, type=Math.random()>.8?'COLLECT':'AVOID'; obstacles.push({x,y:-r-20,r,type,speed:window.gameConfig.obstacleSpeed*(1+distance/10000),angle:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.1,seed:Math.random()*99}); }
function createExplosion(x,y,color,count){ for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,color,size:Math.random()*3+1}); }
function gameLoop(timestamp){ if(!lastTime) lastTime=timestamp; const dt=Math.min((timestamp-lastTime)/1000,.05); lastTime=timestamp; try{ if(gameState==='PLAYING') update(dt); draw(); } catch(e){ console.error('Loop error', e); } requestAnimationFrame(gameLoop); }
function update(dt){ const speed=window.gameConfig.playerSpeed*60*dt; player.x+=(player.targetX-player.x)*5*dt; distance+=speed*dt; warningCooldown=Math.max(0, warningCooldown-dt); document.getElementById('score-display').innerText=`CLUES: ${score}`; if(currentTextIdx<texts.length-1 && distance>texts[currentTextIdx+1].d){ currentTextIdx++; updateStoryText(texts[currentTextIdx].t); } if(Math.random()<.02+(distance/50000)) spawnObstacle(); stars.forEach(s=>{ s.y+=s.speed*(1+distance/5000); if(s.y>ch){ s.y=0; s.x=Math.random()*cw; } }); bubbles.forEach(b=>{ b.y-=b.speed*dt; b.x+=Math.sin(performance.now()*.001+b.phase)*.08; if(b.y<-20){ b.y=ch+20; b.x=Math.random()*cw; } }); for(let i=obstacles.length-1;i>=0;i--){ const o=obstacles[i]; o.y+=o.speed*60*dt; o.angle+=o.spin; const dx=player.x-o.x, dy=player.y-o.y, dist=Math.sqrt(dx*dx+dy*dy); if(o.type==='AVOID' && warningCooldown===0 && o.y>ch*.55 && Math.abs(dx)<o.r+34){ warningCooldown=.6; playSfx('warning',{minGap:350}); setFeedback('SUBPOENA MINE • slide out of the lane.','danger'); } if(dist<player.r+o.r){ if(o.type==='COLLECT'){ score+=10; playSfx('collect',{minGap:55}); vibrate('light'); setFeedback('CLUE CHIP BAGGED • case file brightens.','success'); showGif('collect',920); createExplosion(o.x,o.y,'#ffd85c',9); obstacles.splice(i,1); continue; } else { vibrate('heavy'); playSfx('fail',{minGap:120}); setFeedback('CASE SOAKED • mine blew the alibi.','danger'); showGif('fail',1700); createExplosion(player.x,player.y,'#ff4778',22); setState('GAMEOVER'); } } if(o.y>ch+o.r) obstacles.splice(i,1); } for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=dt*2; if(p.life<=0) particles.splice(i,1); } }
function roundedRectPath(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBackground(){ const g=ctx.createLinearGradient(0,0,0,ch); g.addColorStop(0,'#0b3147'); g.addColorStop(.45,'#082033'); g.addColorStop(1,'#020611'); ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch); const phase=performance.now()*.00025; for(let i=0;i<5;i++){ const x=(i+.5)*cw/5 + Math.sin(phase*5+i)*12; ctx.fillStyle=i%2?'rgba(255,216,92,.055)':'rgba(116,246,255,.055)'; ctx.beginPath(); ctx.ellipse(x,ch*.96,48+i*7,ch*.55,0,Math.PI,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(116,246,255,.08)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,ch); ctx.quadraticCurveTo(x-18,ch*.7,x+8,ch*.48); ctx.stroke(); }
  for(let i=0;i<4;i++){ const bx=(i+.18)*cw/4 + Math.sin(phase*4+i)*18, bw=44+i*9, bh=ch*(.23+.04*i); ctx.fillStyle='rgba(8, 18, 35, .48)'; roundedRectPath(bx-bw/2, ch-bh, bw, bh, 18); ctx.fill(); ctx.strokeStyle='rgba(116,246,255,.13)'; ctx.stroke(); ctx.fillStyle='rgba(255,216,92,.22)'; for(let y=ch-bh+24;y<ch-18;y+=28){ ctx.fillRect(bx-bw*.25,y,4,8); ctx.fillRect(bx+bw*.18,y+8,4,8); } }
  ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1; for(let lane=1;lane<=3;lane++){ const x=(cw/4)*lane; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,ch); ctx.stroke(); }
  stars.forEach(s=>{ ctx.globalAlpha=s.alpha; ctx.fillStyle='#e7fffb'; ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1; bubbles.forEach(b=>{ ctx.strokeStyle='rgba(196,255,245,.16)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke(); }); }
function drawPlayer(){ ctx.save(); ctx.translate(player.x,player.y); const t=performance.now()*.008, pulse=.94+Math.sin(t)*.06; const aura=ctx.createRadialGradient(0,0,player.r*.2,0,0,player.r*3.4); aura.addColorStop(0,'rgba(255,216,92,.62)'); aura.addColorStop(.45,'rgba(116,246,255,.2)'); aura.addColorStop(1,'rgba(116,246,255,0)'); ctx.fillStyle=aura; ctx.beginPath(); ctx.arc(0,0,player.r*3.4*pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#151622'; ctx.beginPath(); ctx.ellipse(0,-player.r*1.1,player.r*1.35,player.r*.34,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillRect(-player.r*.95,-player.r*1.16,player.r*1.9,player.r*.24); ctx.strokeStyle='rgba(116,246,255,.5)'; ctx.lineWidth=1.4; ctx.strokeRect(-player.r*.9,-player.r*1.18,player.r*1.8,player.r*.2);
  ctx.fillStyle='#ffd85c'; roundedRectPath(-player.r*.95,-player.r*.95,player.r*1.9,player.r*2.05,7); ctx.fill(); ctx.strokeStyle='#d69b2f'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='rgba(120,83,32,.35)'; [[-.45,-.35,.14],[.35,-.1,.18],[-.25,.42,.12],[.53,.48,.1]].forEach(h=>{ ctx.beginPath(); ctx.arc(player.r*h[0],player.r*h[1],player.r*h[2],0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#f8ffff'; ctx.beginPath(); ctx.arc(-player.r*.25,-player.r*.18,player.r*.28,0,Math.PI*2); ctx.arc(player.r*.34,-player.r*.18,player.r*.28,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#082033'; ctx.beginPath(); ctx.arc(-player.r*.18,-player.r*.16,player.r*.11,0,Math.PI*2); ctx.arc(player.r*.41,-player.r*.16,player.r*.11,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(20,22,34,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-player.r*.78,-player.r*.46); ctx.quadraticCurveTo(-player.r*.2,-player.r*.66,player.r*.05,-player.r*.44); ctx.stroke(); ctx.strokeStyle='rgba(116,246,255,.8)'; ctx.beginPath(); ctx.arc(player.r*.95,player.r*.36,player.r*.48,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(player.r*.62,player.r*.7); ctx.lineTo(player.r*.22,player.r*1.1); ctx.stroke(); ctx.restore(); }
function drawCollect(o){ const g=ctx.createRadialGradient(0,0,o.r*.1,0,0,o.r*1.9); g.addColorStop(0,'rgba(255,216,92,.7)'); g.addColorStop(1,'rgba(255,216,92,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,o.r*1.9,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#ffd85c'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-o.r); ctx.lineTo(o.r*.78,-o.r*.25); ctx.lineTo(o.r*.48,o.r*.9); ctx.lineTo(-o.r*.48,o.r*.9); ctx.lineTo(-o.r*.78,-o.r*.25); ctx.closePath(); ctx.stroke(); ctx.fillStyle='rgba(255,216,92,.2)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-o.r*.38,0); ctx.lineTo(o.r*.38,0); ctx.moveTo(0,-o.r*.38); ctx.lineTo(0,o.r*.38); ctx.stroke(); }
function drawAvoid(o){ ctx.strokeStyle='#ff4778'; ctx.lineWidth=2; ctx.fillStyle='rgba(168,19,67,.28)'; ctx.beginPath(); for(let j=0;j<8;j++){ const th=j/8*Math.PI*2, rad=o.r*(j%2?0.72:1.05); const px=Math.cos(th)*rad, py=Math.sin(th)*rad; if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.strokeStyle='rgba(116,246,255,.62)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(0,0,o.r*.48,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle='rgba(255,216,92,.76)'; ctx.beginPath(); ctx.moveTo(-o.r*.34,-o.r*.34); ctx.lineTo(o.r*.34,o.r*.34); ctx.moveTo(o.r*.34,-o.r*.34); ctx.lineTo(-o.r*.34,o.r*.34); ctx.stroke(); }
function draw(){ drawBackground(); if(gameState==='PLAYING') drawPlayer(); obstacles.forEach(o=>{ ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.angle); o.type==='COLLECT'?drawCollect(o):drawAvoid(o); ctx.restore(); }); particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1; }
