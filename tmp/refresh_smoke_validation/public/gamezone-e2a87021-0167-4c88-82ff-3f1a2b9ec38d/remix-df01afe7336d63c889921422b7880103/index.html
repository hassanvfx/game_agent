<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Meme Merge 2025: Brainrot Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #140f2d;
            --bg-bottom: #040816;
            --panel-bg: rgba(11, 16, 35, 0.82);
            --panel-border: rgba(112, 244, 255, 0.28);
            --panel-shadow: rgba(0, 0, 0, 0.52);
            --text-main: #f5fbff;
            --text-muted: #d5e3ff;
            --text-soft: #89a6d6;
            --score-accent: #ffe66d;
            --danger: #ff5f86;
            --accent-a: #66f2ff;
            --accent-b: #9c6bff;
            --accent-c: #ff7ab8;
            --feed-line: rgba(255, 105, 145, 0.72);
            --hud-glow: rgba(102, 242, 255, 0.22);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(156, 107, 255, 0.25), transparent 32%),
                radial-gradient(circle at bottom, rgba(102, 242, 255, 0.14), transparent 36%),
                #030712;
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(156, 107, 255, 0.22), transparent 36%),
                linear-gradient(180deg, #15122f 0%, #070c19 60%, #04070f 100%);
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.45;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 15%, rgba(102, 242, 255, 0.14), transparent 18%),
                radial-gradient(circle at 80% 18%, rgba(255, 122, 184, 0.12), transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(156, 107, 255, 0.12), transparent 24%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 2;
        }

        .screen {
            width: min(100% - 32px, 420px);
            text-align: center;
            pointer-events: auto;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(16, 21, 46, 0.95), rgba(7, 11, 26, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 38px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 22px rgba(102, 242, 255, 0.08);
            border-radius: 28px;
        }

        .card {
            padding: 36px 24px 28px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top center, rgba(102, 242, 255, 0.14), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 122, 184, 0.1), transparent 30%);
            pointer-events: none;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(102, 242, 255, 0.3),
                0 0 22px rgba(156, 107, 255, 0.32);
        }

        .title {
            margin: 0 0 14px;
            font-family: 'Bangers', fantasy;
            font-size: clamp(2.35rem, 10vw, 4rem);
            line-height: 0.94;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #8ef7ff, #bc91ff 55%, #ff9ed0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin: 0 0 10px;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .emoji-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 0 0 22px;
            font-size: 2rem;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
        }

        .emoji-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 18px rgba(0,0,0,0.25);
            animation: floatBob 2.8s ease-in-out infinite;
        }

        .emoji-chip:nth-child(2) { animation-delay: 0.18s; }
        .emoji-chip:nth-child(3) { animation-delay: 0.36s; }

        .helper-text {
            margin: 0 0 22px;
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.52;
        }

        .flavor-strip {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 22px;
        }

        .flavor-badge {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(102, 242, 255, 0.24);
            background: rgba(102, 242, 255, 0.08);
            color: var(--text-muted);
            font-size: 0.83rem;
            line-height: 1;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 15px 24px;
            font: 700 0.98rem 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease, background 0.2s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            filter: brightness(1.06);
            outline: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            color: #04101e;
            background: linear-gradient(90deg, #7af7ff, #d2a8ff 58%, #ff9ccc);
            box-shadow: 0 12px 28px rgba(124, 58, 237, 0.28);
        }

        .btn-secondary {
            color: #f7fbff;
            background: linear-gradient(90deg, rgba(255,255,255,0.18), rgba(102, 242, 255, 0.24));
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 12px 28px rgba(8, 15, 38, 0.28);
        }

        .hidden {
            display: none !important;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            gap: 12px;
        }

        .hud-pill,
        .hud-preview,
        .status-pill {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(10, 15, 33, 0.92), rgba(8, 11, 24, 0.88));
            border: 1px solid rgba(102, 242, 255, 0.24);
            box-shadow:
                0 10px 24px rgba(0,0,0,0.26),
                0 0 18px var(--hud-glow);
        }

        .hud-pill::before,
        .hud-preview::before,
        .status-pill::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 40%, transparent 60%, rgba(255,255,255,0.05));
            pointer-events: none;
        }

        .hud-pill {
            padding: 10px 18px;
            border-radius: 999px;
            min-width: 120px;
        }

        .hud-label,
        .hud-preview-label,
        .status-label {
            color: var(--text-soft);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.54rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hud-value {
            margin-top: 7px;
            font-family: 'Bangers', fantasy;
            font-size: 1.8rem;
            line-height: 1;
            color: var(--score-accent);
            text-shadow: 0 0 10px rgba(255, 230, 109, 0.3);
            letter-spacing: 0.05em;
        }

        .hud-preview {
            min-width: 94px;
            padding: 10px 16px;
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-preview-label {
            margin-bottom: 8px;
        }

        #next-meme-preview {
            font-size: 1.8rem;
            line-height: 1;
            filter: drop-shadow(0 2px 10px rgba(255,255,255,0.18));
        }

        .status-pill {
            position: absolute;
            left: 12px;
            bottom: 14px;
            max-width: min(58vw, 240px);
            padding: 10px 14px;
            border-radius: 18px;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .status-pill.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .status-text {
            margin-top: 6px;
            color: var(--text-main);
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .feedback-gif {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 14px 36px rgba(0,0,0,0.34);
            object-fit: cover;
            opacity: 0;
            transform: scale(0.88);
            transition: opacity 0.2s ease, transform 0.25s ease;
            background: rgba(8, 12, 24, 0.72);
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: scale(1);
        }

        #merge-gif {
            right: 14px;
            bottom: 16px;
            width: min(28vw, 128px);
            aspect-ratio: 1 / 1;
        }

        #fail-gif {
            top: 88px;
            right: 14px;
            width: min(26vw, 116px);
            aspect-ratio: 1 / 1;
        }

        .result-title {
            margin: 0 0 14px;
            font-family: 'Bangers', fantasy;
            font-size: clamp(2rem, 8vw, 3.2rem);
            line-height: 1;
            color: #ff9cb8;
            letter-spacing: 0.06em;
        }

        .result-score {
            font-size: 1.15rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .score-highlight {
            color: var(--score-accent);
            font-family: 'Bangers', fantasy;
            letter-spacing: 0.04em;
        }

        .result-note {
            margin: 0 0 22px;
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .screen-accent {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            margin: 0 0 18px;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-b), var(--accent-c));
            box-shadow: 0 0 20px rgba(102, 242, 255, 0.22);
        }

        @keyframes floatBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @media (max-width: 640px) {
            .card {
                padding: 28px 20px 22px;
                border-radius: 24px;
            }

            #hud {
                padding: 12px;
            }

            .hud-pill,
            .hud-preview {
                min-width: 0;
            }

            .hud-value {
                font-size: 1.5rem;
            }

            .title {
                font-size: clamp(2.15rem, 13vw, 3rem);
            }

            .subtitle {
                font-size: 1rem;
            }

            .helper-text,
            .result-note {
                font-size: 0.9rem;
            }

            .emoji-chip {
                width: 48px;
                height: 48px;
                border-radius: 16px;
            }

            .status-pill {
                left: 10px;
                bottom: 10px;
                max-width: 62vw;
                padding: 9px 12px;
            }

            #merge-gif {
                width: min(30vw, 106px);
                right: 10px;
                bottom: 10px;
            }

            #fail-gif {
                width: min(28vw, 96px);
                right: 10px;
                top: 86px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: merge/fail feedback overlays -> catalogs/gifs.json -->
        <img id="merge-gif" class="feedback-gif hidden" src="https://i.giphy.com/3uHqVTVsvzuZia7z39.webp" alt="Merge hype reaction" loading="lazy" decoding="async">
        <img id="fail-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Game over rage reaction" loading="lazy" decoding="async">

        <div id="ui-layer">
            <div id="start-screen" class="screen glass-panel card">
                <div class="screen-accent" aria-hidden="true"></div>
                <h1 class="title neon-text">MEME MERGE</h1>
                <p class="subtitle">Feed Fusion Arena · 2016 ➜ 2025</p>
                <div class="emoji-row" aria-hidden="true">
                    <span class="emoji-chip">🐕</span><span class="emoji-chip">🚽</span><span class="emoji-chip">🤖</span>
                </div>
                <div class="flavor-strip" aria-hidden="true">
                    <span class="flavor-badge">drop</span>
                    <span class="flavor-badge">merge</span>
                    <span class="flavor-badge">evolve</span>
                </div>
                <p class="helper-text">Move left or right, then tap to drop. Match two of the same meme to evolve the timeline.</p>
                <button id="start-btn" class="btn btn-primary">Drop the Memes</button>
            </div>

            <div id="game-over-screen" class="screen glass-panel card hidden">
                <div class="screen-accent" aria-hidden="true"></div>
                <h2 class="result-title neon-text">Timeline Jammed</h2>
                <div class="result-score">Score: <span id="finalScore" class="score-highlight">0</span></div>
                <p class="result-note">The stack crossed the feed line.</p>
                <button id="restart-btn" class="btn btn-secondary">Try Again</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hidden">
                <div class="glass-panel hud-pill">
                    <span class="hud-label">Score</span>
                    <div id="score" class="hud-value">0</div>
                </div>
                <div class="glass-panel hud-preview">
                    <span class="hud-preview-label">Next</span>
                    <div id="next-meme-preview">🐕</div>
                </div>
            </div>

            <div id="status-pill" class="status-pill hidden" aria-live="polite">
                <div class="status-label">feed pulse</div>
                <div id="status-text" class="status-text">Drop to begin the remix.</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                drop: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
                merge: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                collide: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"
            },
            gifs: {
                merge: "https://i.giphy.com/3uHqVTVsvzuZia7z39.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = new Map();
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume = 0.5, cooldown = 0 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const nextAllowed = this.cooldowns.get(key) || 0;
                if (now < nextAllowed) return;
                if (cooldown > 0) this.cooldowns.set(key, now + cooldown);

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const statusPill = document.getElementById('status-pill');
        const statusText = document.getElementById('status-text');
        const mergeGif = document.getElementById('merge-gif');
        const failGif = document.getElementById('fail-gif');

        const MEMES = [
            { id: 0, name: "Doge", color: "#FFD166", icon: "🐕", radius: 25, score: 2 },
            { id: 1, name: "Harambe", color: "#8E9AAF", icon: "🦍", radius: 35, score: 4 },
            { id: 2, name: "Spinner", color: "#FF5C8A", icon: "🌀", radius: 45, score: 8 },
            { id: 3, name: "Amogus", color: "#FF405F", icon: "ඞ", radius: 55, score: 16 },
            { id: 4, name: "Skibidi", color: "#EAF7FF", icon: "🚽", radius: 70, score: 32 },
            { id: 5, name: "Grimace", color: "#9A6BFF", icon: "🥤", radius: 85, score: 64 },
            { id: 6, name: "Rizzler", color: "#4D7CFE", icon: "🤫", radius: 100, score: 128 },
            { id: 7, name: "Cyber-G", color: "#66F2FF", icon: "🤖", radius: 120, score: 256 },
            { id: 8, name: "Neurolink", color: "#FF7AB8", icon: "🧠", radius: 140, score: 512 },
            { id: 9, name: "Singularity", color: "#0B1022", icon: "🌌", radius: 160, score: 1024 }
        ];

        let width, height;
        let gameActive = false;
        let score = 0;
        let balls = [];
        let particles = [];
        let nextMemeIndex = 0;
        let dropX = 0;
        let dropCooldown = false;
        let gameOverTimer = 0;
        let collisionTick = 0;
        let warningShown = false;
        let statusTimeout = null;
        let gifTimeouts = [];

        const GRAVITY = 0.5;
        const FRICTION = 0.98;
        const BOUNCE = 0.3;
        const SUBSTEPS = 8;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function showStatus(message, duration = 1500) {
            statusText.textContent = message;
            statusPill.classList.remove('hidden');
            requestAnimationFrame(() => statusPill.classList.add('is-visible'));
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                statusPill.classList.remove('is-visible');
                setTimeout(() => statusPill.classList.add('hidden'), 220);
            }, duration);
        }

        function clearGifTimers() {
            gifTimeouts.forEach(id => clearTimeout(id));
            gifTimeouts = [];
        }

        function flashGif(element, duration = 1100) {
            if (!element) return;
            element.classList.remove('hidden');
            requestAnimationFrame(() => element.classList.add('is-visible'));
            const timer = setTimeout(() => {
                element.classList.remove('is-visible');
                setTimeout(() => element.classList.add('hidden'), 220);
            }, duration);
            gifTimeouts.push(timer);
        }

        function hideFeedbackMedia() {
            clearGifTimers();
            [mergeGif, failGif].forEach(element => {
                element.classList.remove('is-visible');
                element.classList.add('hidden');
            });
        }

        function initGame() {
            score = 0;
            balls = [];
            particles = [];
            gameActive = true;
            gameOverTimer = 0;
            collisionTick = 0;
            warningShown = false;
            dropCooldown = false;
            updateNextMeme();
            dropX = width / 2;
            document.getElementById('score').innerText = score;
            hideFeedbackMedia();
            showStatus('Synthwave stack online. Merge matching memes.', 1700);
        }

        function updateNextMeme() {
            nextMemeIndex = Math.floor(Math.random() * 4);
            const meme = MEMES[nextMemeIndex];
            document.getElementById('next-meme-preview').innerText = meme.icon;
            document.getElementById('next-meme-preview').style.color = meme.color;
        }

        class Ball {
            constructor(x, y, level) {
                this.x = x;
                this.y = y;
                this.level = level;
                this.radius = MEMES[level].radius;
                const scaleFactor = Math.min(width, height) / 800;
                this.radius *= scaleFactor;

                this.vx = 0;
                this.vy = 0;
                this.mass = this.radius;
                this.isMerging = false;
                this.scale = 0.1;
            }

            update() {
                if (this.scale < 1) this.scale += 0.1;

                this.vy += GRAVITY;
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                this.x += this.vx;
                this.y += this.vy;

                if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy *= -BOUNCE;
                }

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -BOUNCE;
                }

                if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx *= -BOUNCE;
                }
            }

            draw() {
                const meme = MEMES[this.level];
                const r = this.radius * this.scale;

                const grad = ctx.createRadialGradient(this.x - r / 3, this.y - r / 3, r / 10, this.x, this.y, r);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.18, '#ffffff');
                grad.addColorStop(0.5, meme.color);
                grad.addColorStop(1, '#040816');

                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,0.22)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x - r * 0.22, this.y - r * 0.25, r * 0.28, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,255,0.18)";
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = "#fff";
                ctx.font = `${r * 0.72}px "Orbitron"`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0,0,0,0.45)";
                ctx.shadowBlur = 10;
                ctx.fillText(meme.icon, this.x, this.y + r * 0.08);
                ctx.shadowBlur = 0;
            }
        }

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const distSq = dx * dx + dy * dy;
                    const minDist = b1.radius + b2.radius;

                    if (distSq < minDist * minDist) {
                        const dist = Math.sqrt(distSq);

                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        if (dist === 0) {
                            b1.x -= 1;
                            b2.x += 1;
                            continue;
                        }

                        const totalMass = b1.mass + b2.mass;
                        const m1Ratio = b2.mass / totalMass;
                        const m2Ratio = b1.mass / totalMass;

                        b1.x -= nx * overlap * m1Ratio;
                        b1.y -= ny * overlap * m1Ratio;
                        b2.x += nx * overlap * m2Ratio;
                        b2.y += ny * overlap * m2Ratio;

                        const k = 0.5;
                        const dvx = b2.vx - b1.vx;
                        const dvy = b2.vy - b1.vy;
                        const velAlongNormal = dvx * nx + dvy * ny;

                        if (velAlongNormal > 0) continue;

                        const jVal = -(1 + k) * velAlongNormal;
                        const invMass1 = 1 / b1.mass;
                        const invMass2 = 1 / b2.mass;
                        const impulse = jVal / (invMass1 + invMass2);

                        const ix = impulse * nx;
                        const iy = impulse * ny;

                        b1.vx -= ix * invMass1;
                        b1.vy -= iy * invMass1;
                        b2.vx += ix * invMass2;
                        b2.vy += iy * invMass2;

                        collisionTick++;
                        if (collisionTick % 14 === 0) {
                            audio.playSFX('collide', { volume: 0.2, cooldown: 70 });
                        }

                        if (b1.level === b2.level && !b1.isMerging && !b2.isMerging && b1.level < MEMES.length - 1) {
                            b1.isMerging = true;
                            b2.isMerging = true;

                            const newX = (b1.x + b2.x) / 2;
                            const newY = (b1.y + b2.y) / 2;
                            const nextLevel = b1.level + 1;

                            score += MEMES[nextLevel].score;
                            document.getElementById('score').innerText = score;

                            audio.playSFX('merge', { volume: 0.48, cooldown: 120 });
                            createParticles(newX, newY, MEMES[nextLevel].color);
                            flashGif(mergeGif, 900);
                            showStatus(`${MEMES[nextLevel].name} unlocked!`, 1000);

                            setTimeout(() => {
                                balls = balls.filter(b => b !== b1 && b !== b2);
                                balls.push(new Ball(newX, newY, nextLevel));
                            }, 0);
                        }
                    }
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        const bgShapes = Array(15).fill(0).map(() => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 50 + 20,
            speed: Math.random() * 0.5 + 0.1,
            char: ["✦", "✶", "⚡", "◈", "💀", "👽"][Math.floor(Math.random() * 6)]
        }));

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, getComputedStyle(document.documentElement).getPropertyValue('--bg-top'));
            grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--bg-bottom'));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            bgShapes.forEach((s, index) => {
                s.y -= s.speed;
                if (s.y < -50) s.y = height + 50;

                ctx.globalAlpha = 0.12 + (index % 3) * 0.04;
                ctx.fillStyle = index % 2 === 0 ? "#66F2FF" : "#FF7AB8";
                ctx.font = `600 ${Math.max(22, s.size)}px Orbitron`;
                ctx.fillText(s.char, s.x, s.y);
            });
            ctx.restore();

            const deadLineY = 150;
            ctx.beginPath();
            ctx.moveTo(0, deadLineY);
            ctx.lineTo(width, deadLineY);
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--feed-line');
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.save();
            ctx.fillStyle = "rgba(255, 122, 184, 0.72)";
            ctx.font = '700 14px "Orbitron"';
            ctx.textAlign = "left";
            ctx.fillText("FEED LINE", 14, deadLineY - 10);
            ctx.restore();
        }

        function drawDropper() {
            if (dropCooldown) return;
            const y = 80;
            const meme = MEMES[nextMemeIndex];

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(dropX, y + 8);
            ctx.lineTo(dropX, height);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.11)";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(dropX, y, 24, 0, Math.PI * 2);
            const dropperGradient = ctx.createRadialGradient(dropX - 6, y - 7, 4, dropX, y, 24);
            dropperGradient.addColorStop(0, "#ffffff");
            dropperGradient.addColorStop(0.3, meme.color);
            dropperGradient.addColorStop(1, "#0d1328");
            ctx.fillStyle = dropperGradient;
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = '700 20px "Orbitron"';
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(meme.icon, dropX, y + 1);
            ctx.restore();
        }

        function checkGameOver() {
            const deadLineY = 150;
            let nearTop = false;
            for (let b of balls) {
                if (b.y - b.radius < deadLineY + 20) {
                    nearTop = true;
                }
                if (b.y - b.radius < deadLineY && Math.abs(b.vy) < 0.1 && Math.abs(b.vx) < 0.1) {
                    gameOverTimer++;
                    if (!warningShown && gameOverTimer > 45) {
                        warningShown = true;
                        audio.playSFX('warning', { volume: 0.3, cooldown: 300 });
                        showStatus('Feed line danger! Clear space fast.', 1200);
                    }
                    if (gameOverTimer > 120) {
                        gameOver();
                    }
                    return;
                }
            }
            if (!nearTop) {
                warningShown = false;
            }
            gameOverTimer = 0;
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.5 });
            flashGif(failGif, 1400);
            showStatus('Timeline jammed. Resetting the chaos lane.', 1400);
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function loop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            for (let i = 0; i < SUBSTEPS; i++) {
                balls.forEach(b => b.update());
                resolveCollisions();
            }

            balls.forEach(b => b.draw());

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(index, 1);
            });

            drawDropper();
            checkGameOver();

            requestAnimationFrame(loop);
        }

        function handleInputMove(x) {
            dropX = Math.max(20, Math.min(width - 20, x));
        }

        function handleInputClick() {
            if (!gameActive || dropCooldown) {
                if (gameActive && dropCooldown) {
                    audio.playSFX('blocked', { volume: 0.18, cooldown: 180 });
                }
                return;
            }

            dropCooldown = true;
            const newBall = new Ball(dropX, 80, nextMemeIndex);
            balls.push(newBall);
            audio.playSFX('drop', { volume: 0.28, cooldown: 90 });

            updateNextMeme();

            setTimeout(() => {
                dropCooldown = false;
            }, 600);
        }

        canvas.addEventListener('mousemove', e => handleInputMove(e.clientX));
        canvas.addEventListener('mousedown', handleInputClick);

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInputMove(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInputMove(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            handleInputClick();
        }, { passive: false });

        function startRun() {
            audio.unlock();
            audio.playSFX('start', { volume: 0.42 });
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            initGame();
            loop();
        }

        document.getElementById('start-btn').addEventListener('click', startRun);

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.36 });
            audio.playBGM();
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            initGame();
            loop();
        });
    });
    </script>
</body>
