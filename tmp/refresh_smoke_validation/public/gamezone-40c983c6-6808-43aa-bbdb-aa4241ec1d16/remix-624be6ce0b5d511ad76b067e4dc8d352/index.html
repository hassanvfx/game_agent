<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Forge Tycoon</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            color-scheme: dark;
            --panel-border: rgba(167, 244, 255, 0.35);
            --panel-shadow: rgba(0, 8, 26, 0.42);
            --text-main: #f4fbff;
            --text-soft: rgba(234, 248, 255, 0.82);
            --accent-sun: #ffd76a;
            --accent-mint: #78f7d4;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at top, #184486 0%, #071124 58%, #02050d 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.18) 0 0.12rem, transparent 0.14rem),
                radial-gradient(circle at 72% 30%, rgba(255, 255, 255, 0.2) 0 0.1rem, transparent 0.12rem),
                radial-gradient(circle at 84% 14%, rgba(255, 255, 255, 0.16) 0 0.1rem, transparent 0.12rem),
                radial-gradient(circle at 30% 12%, rgba(255, 255, 255, 0.14) 0 0.08rem, transparent 0.1rem);
            opacity: 0.8;
        }

        body::after {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 219, 126, 0.2), transparent 36%),
                linear-gradient(180deg, rgba(117, 219, 255, 0.06), transparent 42%);
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        button {
            font: inherit;
            color: inherit;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: max(2rem, env(safe-area-inset-top));
            animation: float-in 500ms ease-out;
        }

        #ui-title {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(1.35rem, 4vw, 1.95rem);
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.97;
            color: #effcff;
            text-shadow: 0 0 16px rgba(138, 231, 255, 0.38), 0 3px 12px rgba(0, 0, 0, 0.45);
        }

        .score-pill {
            margin-top: 0.65rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.72rem 1.4rem;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(16, 35, 71, 0.72), rgba(8, 19, 43, 0.78));
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 12px 30px var(--panel-shadow);
        }

        .score-dot {
            width: 0.9rem;
            height: 0.9rem;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff7c3, var(--accent-sun) 55%, #ff9f43 100%);
            box-shadow: 0 0 12px var(--accent-sun);
            flex: 0 0 auto;
        }

        #score-display {
            font-size: clamp(1.9rem, 6vw, 3rem);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-weight: 700;
            color: #fff7cf;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 14px rgba(255, 215, 106, 0.3);
        }

        .rate-label {
            margin-top: 0.35rem;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: var(--text-soft);
            font-weight: 700;
            text-transform: uppercase;
        }

        #upgrade-panel {
            width: 100%;
            max-width: 26rem;
            margin: 0 auto;
            padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
            pointer-events: auto;
            transition: opacity 500ms ease;
            opacity: 0;
        }

        #forge-gif-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 30;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(4.5rem, 18vw, 7rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: scale(0.82) translateY(0.75rem);
            transition: opacity 220ms ease, transform 220ms ease;
            background: rgba(10, 18, 36, 0.3);
        }

        .feedback-gif.visible {
            opacity: 0.88;
            transform: scale(1) translateY(0);
        }

        #forge-ready-gif {
            top: max(5.2rem, env(safe-area-inset-top) + 4.4rem);
            right: clamp(0.55rem, 2vw, 1rem);
        }

        #forge-burst-gif {
            bottom: calc(9.4rem + env(safe-area-inset-bottom));
            left: clamp(0.55rem, 2vw, 1rem);
        }

        .glass {
            background: linear-gradient(180deg, rgba(8, 24, 56, 0.74), rgba(5, 14, 33, 0.82));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 30px var(--panel-shadow);
        }

        .upgrade-strip {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            padding: 0.85rem;
            border-radius: 1.25rem;
            scrollbar-width: none;
        }

        .upgrade-strip::-webkit-scrollbar {
            display: none;
        }

        .upgrade-btn {
            flex: 0 0 6rem;
            width: 6rem;
            min-height: 8rem;
            border: 1px solid rgba(138, 231, 255, 0.16);
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(14, 33, 74, 0.9), rgba(5, 12, 28, 0.95));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            padding: 0.65rem 0.55rem;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 140ms ease, background-color 180ms ease, border-color 180ms ease, opacity 180ms ease, filter 180ms ease, box-shadow 180ms ease;
        }

        .upgrade-btn:active {
            transform: scale(0.95);
        }

        .upgrade-btn.can-buy {
            background: linear-gradient(180deg, rgba(20, 87, 92, 0.92), rgba(11, 39, 65, 0.95));
            border-color: rgba(120, 247, 212, 0.55);
            box-shadow: 0 0 18px rgba(120, 247, 212, 0.18);
        }

        .upgrade-btn.locked {
            opacity: 0.6;
            filter: saturate(0.65);
        }

        .upgrade-icon {
            font-size: 1.9rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.12));
        }

        .upgrade-name {
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.94);
            text-transform: uppercase;
        }

        .upgrade-cost {
            margin-top: 0.15rem;
            font-size: 0.64rem;
            color: #ffe9a4;
            font-variant-numeric: tabular-nums;
        }

        .upgrade-count {
            font-size: 0.64rem;
            color: rgba(255, 255, 255, 0.58);
            text-transform: uppercase;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background:
                radial-gradient(circle at top, rgba(130, 205, 255, 0.24), transparent 35%),
                linear-gradient(180deg, rgba(3, 10, 26, 0.45), rgba(2, 7, 20, 0.7));
            backdrop-filter: blur(10px);
            transition: opacity 500ms ease;
            text-align: center;
            padding: 1.5rem;
        }

        .start-kicker {
            font-size: 0.82rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #c6f4ff;
            opacity: 0.92;
        }

        .start-title {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2.8rem, 11vw, 4.8rem);
            font-weight: 400;
            line-height: 0.95;
            text-transform: uppercase;
            color: #fbfeff;
            text-shadow: 0 0 18px rgba(138, 231, 255, 0.28), 0 4px 0 rgba(0, 0, 0, 0.28);
        }

        .start-subtitle {
            margin: 0;
            font-size: clamp(1rem, 3.6vw, 1.25rem);
            color: #eff8ff;
        }

        .start-instruction {
            margin: 0.35rem 0 0;
            max-width: 21rem;
            font-size: 0.92rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.88);
        }

        #start-btn {
            margin-top: 1rem;
            padding: 1rem 2.4rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: linear-gradient(90deg, #ffbf59, #5ddcff 52%, #7a8dff);
            font-size: clamp(1.1rem, 4vw, 1.55rem);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 14px 34px rgba(93, 220, 255, 0.24);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        #start-btn:hover {
            filter: brightness(1.06);
            transform: scale(1.03);
            box-shadow: 0 16px 40px rgba(122, 141, 255, 0.28);
        }

        @keyframes float-in {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding: 0.8rem;
            }

            .upgrade-btn {
                flex-basis: 5.5rem;
                width: 5.5rem;
                min-height: 7.6rem;
            }

            .start-instruction {
                max-width: 18rem;
                font-size: 0.84rem;
            }
        }
    </style>
</head>
<body>

    <script id="game-config" type="application/x-game-config">
    {
        "floatSpeed": { "type": "number", "label": "Float Speed", "value": 2, "min": 0, "max": 10 },
        "skyColorTop": { "type": "color", "label": "Sky Top", "value": "#4facfe" },
        "skyColorBot": { "type": "color", "label": "Sky Bottom", "value": "#00f2fe" },
        "gameTitle": { "type": "text", "label": "Sky Forge Name", "value": "Sky Forge" }
    }
    </script>

    <!-- [agent-note][stage4] repaired-font-remap: title/ui -> Audiowide + Exo 2 from catalogs/fonts.json -->
    <!-- [agent-note][stage3] resolved-audio: tap/purchase/block/start -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: upgrade-ready + milestone feedback -> catalogs/gifs.json -->
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_coin" data-editable="audio" data-label="Energy Tap SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_buy" data-editable="audio" data-label="Upgrade SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_blocked" data-editable="audio" data-label="Blocked SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="Launch SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="forge-gif-layer" aria-hidden="true">
            <img id="forge-ready-gif" class="feedback-gif" alt="" src="https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp">
            <img id="forge-burst-gif" class="feedback-gif" alt="" src="https://i.giphy.com/1zmG8avB83Uvm.webp">
        </div>

        <div id="ui-layer">
            <div class="top-bar">
                <h1 id="ui-title">SKY FORGE</h1>
                <div class="score-pill">
                    <div class="score-dot"></div>
                    <span id="score-display">0</span>
                </div>
                <div class="rate-label">+<span id="pps-display">0</span> sky energy / sec</div>
            </div>

            <div id="upgrade-panel">
                <div class="glass upgrade-strip">
                    <!-- [agent-note][stage2] visual-intent: luminous sky-forge console | scope: hud,upgrades -->
                    <!-- [agent-note][stage1] role: future-emoji | element: upgrade-strip | intent: add stronger themed identity to each build tier -->
                </div>
            </div>
        </div>

        <div id="start-screen">
            <div class="start-kicker">Arcade Build Loop</div>
            <h1 class="start-title">Sky Forge</h1>
            <p class="start-subtitle">Shape a floating workshop above the clouds.</p>
            <p class="start-instruction">Tap the island to gather sky energy, then buy upgrades to grow your airborne forge.</p>
            <button id="start-btn">Tap to Launch</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        window.gameConfig = {
            floatSpeed: 2,
            skyColorTop: "#4facfe",
            skyColorBot: "#00f2fe",
            gameTitle: "Sky Forge"
        };

        let state = {
            coins: 0,
            pps: 0,
            clickPower: 1,
            lastTime: 0,
            isPlaying: false,
            lastTapAt: 0,
            highestTierUnlocked: 0,
            island: {
                yOffset: 0,
                scale: 1,
                items: []
            },
            particles: [],
            clouds: [],
            ambientOrbs: []
        };

        const gifTimers = new Map();

        const UPGRADES = [
            { id: 'soil', name: 'Forge Bed', cost: 15, pps: 0, clickDetails: 1, icon: '🧱', color: '#8B4513' },
            { id: 'tree', name: 'Wind Spire', cost: 50, pps: 2, clickDetails: 0, icon: '🗼', color: '#2E8B57' },
            { id: 'house', name: 'Crew Hub', cost: 250, pps: 10, clickDetails: 0, icon: '🏗️', color: '#CD5C5C' },
            { id: 'crystal', name: 'Aether Core', cost: 1000, pps: 50, clickDetails: 0, icon: '💠', color: '#00FFFF' }
        ];

        let upgradesState = UPGRADES.map(u => ({ ...u, count: 0, currentCost: u.cost }));

        class AudioManager {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.sfxGain = null;
                this.musicGain = null;
                this.buffers = {};
                this.unlocked = false;
                this.lastPlayedAt = {};
                this.bgmElement = document.getElementById('bgm_main');
            }

            ensureContext() {
                if (this.ctx) return true;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return false;
                this.ctx = new AudioCtx();
                this.masterGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();
                this.musicGain = this.ctx.createGain();
                this.sfxGain.gain.value = 0.45;
                this.musicGain.gain.value = 0.18;
                this.sfxGain.connect(this.masterGain);
                this.musicGain.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);
                return true;
            }

            async init() {
                if (this.unlocked) {
                    this.resumeLoop();
                    return;
                }

                this.unlocked = true;
                const hasContext = this.ensureContext();

                if (hasContext && this.ctx.state === 'suspended') {
                    try {
                        await this.ctx.resume();
                    } catch (e) {
                        console.warn('Audio context resume failed', e);
                    }
                }

                const ids = ['sfx_coin', 'sfx_buy', 'sfx_blocked', 'sfx_start'];
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) this.loadBuffer(id, el.src);
                });

                this.resumeLoop();
            }

            async loadBuffer(id, url) {
                if (!this.ctx || this.buffers[id]) return;
                try {
                    const res = await fetch(url);
                    const arrayBuffer = await res.arrayBuffer();
                    this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn(`Audio load failed: ${id}`, e);
                }
            }

            async resumeLoop() {
                const bgm = this.bgmElement;
                if (!bgm) return;
                bgm.volume = 0.2;
                bgm.muted = false;
                try {
                    await bgm.play();
                } catch (e) {
                    console.warn('BGM playback blocked', e);
                }
            }

            pauseLoop() {
                if (this.bgmElement) this.bgmElement.pause();
            }

            playSfx(id, fallbackType = 'beep', cooldown = 80) {
                const now = performance.now();
                if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
                this.lastPlayedAt[id] = now;

                if (!this.ensureContext()) return;
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }

                if (this.buffers[id]) {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = this.buffers[id];
                    gain.gain.value = id === 'sfx_start' ? 0.32 : 0.42;
                    source.connect(gain);
                    gain.connect(this.sfxGain);
                    source.start(0);
                } else {
                    this.synthesize(fallbackType);
                }
            }

            synthesize(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.sfxGain);

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.09);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } else if (type === 'buy') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(380, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(760, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.24);
                } else if (type === 'blocked') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(230, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(160, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.14);
                } else if (type === 'start') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.22);
                }
            }
        }
        const audio = new AudioManager();

        window.updateGameConfig = (key, val) => {
            if (window.gameConfig.hasOwnProperty(key)) {
                window.gameConfig[key] = val;
                if (key === 'gameTitle') document.getElementById('ui-title').innerText = val.toUpperCase();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            initUI();
            resize();
            window.addEventListener('resize', resize);
            canvas.addEventListener('pointerdown', handleInput, { passive: false });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    audio.pauseLoop();
                } else if (state.isPlaying) {
                    audio.resumeLoop();
                }
            });

            document.getElementById('start-btn').addEventListener('click', () => {
                state.isPlaying = true;
                audio.init();
                audio.playSfx('sfx_start', 'start', 200);
                document.getElementById('start-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);
                document.getElementById('upgrade-panel').style.opacity = '1';
                flashGif('forge-ready-gif', 1800);
                gameLoop(0);
            });

            for (let i = 0; i < 10; i++) {
                state.clouds.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 0.6,
                    size: 30 + Math.random() * 50,
                    speed: 0.2 + Math.random() * 0.5
                });
            }

            for (let i = 0; i < 16; i++) {
                state.ambientOrbs.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 0.8,
                    radius: 2 + Math.random() * 4,
                    speed: 4 + Math.random() * 10,
                    drift: Math.random() * Math.PI * 2,
                    alpha: 0.12 + Math.random() * 0.22
                });
            }
        });

        function initUI() {
            const panel = document.querySelector('#upgrade-panel > div');
            upgradesState.forEach((u, idx) => {
                const btn = document.createElement('button');
                btn.className = 'upgrade-btn locked';
                btn.id = `btn-${u.id}`;
                btn.innerHTML = `
                    <div class="upgrade-icon">${u.icon}</div>
                    <div class="upgrade-name">${u.name}</div>
                    <div class="upgrade-cost">⚡ <span id="cost-${u.id}">${u.cost}</span></div>
                    <div class="upgrade-count" id="count-${u.id}">Tier 0</div>
                `;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    buyUpgrade(idx);
                };
                panel.appendChild(btn);
            });
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function handleInput(e) {
            e.preventDefault();
            if (!state.isPlaying) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight * 0.4 + state.island.yOffset;
            const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);

            if (dist < 150) {
                tapIsland(x, y);
            }
        }

        function tapIsland(x, y) {
            addCoins(state.clickPower);
            state.island.scale = 0.9;
            spawnText(`+${Math.floor(state.clickPower)}`, x, y, '#FFD700');
            spawnParticles(x, y, 5, '#FFD700');
            audio.playSfx('sfx_coin', 'coin', 65);

            const now = performance.now();
            if (now - state.lastTapAt > 800) {
                flashGif('forge-burst-gif', 700);
            }
            state.lastTapAt = now;
        }

        function buyUpgrade(idx) {
            const u = upgradesState[idx];
            if (state.coins >= u.currentCost) {
                state.coins -= u.currentCost;
                u.count++;
                state.pps += u.pps;
                state.clickPower += u.clickDetails;
                u.currentCost = Math.floor(u.currentCost * 1.3);
                document.getElementById(`cost-${u.id}`).innerText = formatNumber(u.currentCost);
                document.getElementById(`count-${u.id}`).innerText = `Tier ${u.count}`;
                addBuildingVisual(u);
                audio.playSfx('sfx_buy', 'buy', 90);
                if (u.count === 1 || u.count > state.highestTierUnlocked) {
                    state.highestTierUnlocked = Math.max(state.highestTierUnlocked, u.count);
                    flashGif('forge-ready-gif', 1600);
                }
                if (u.id === 'crystal' || u.count % 3 === 0) {
                    flashGif('forge-burst-gif', 1400);
                }
                updateHUD();
            } else {
                audio.playSfx('sfx_blocked', 'blocked', 140);
                flashGif('forge-burst-gif', 900);
            }
        }

        function addBuildingVisual(u) {
            if (u.id === 'soil') return;

            const w = 220;
            const xPos = (Math.random() * w) - (w / 2);
            const yPos = (Math.random() * 20) - 10;

            state.island.items.push({
                type: u.id,
                x: xPos,
                y: yPos,
                scale: 0.5 + Math.random() * 0.5,
                color: u.color
            });

            state.island.items.sort((a, b) => a.y - b.y);
        }

        function addCoins(amount) {
            state.coins += amount;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = formatNumber(Math.floor(state.coins));
            document.getElementById('pps-display').innerText = formatNumber(state.pps);

            upgradesState.forEach(u => {
                const btn = document.getElementById(`btn-${u.id}`);
                if (state.coins >= u.currentCost) {
                    btn.classList.remove('locked');
                    btn.classList.add('can-buy');
                } else {
                    btn.classList.add('locked');
                    btn.classList.remove('can-buy');
                }
            });
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return Math.floor(num);
        }

        function gameLoop(timestamp) {
            if (!state.isPlaying) return;

            const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
            state.lastTime = timestamp;

            if (state.pps > 0) {
                addCoins(state.pps * dt);
            }

            updatePhysics(dt, timestamp);
            draw(dt, timestamp);
            requestAnimationFrame(gameLoop);
        }

        function updatePhysics(dt, time) {
            const floatY = Math.sin(time * 0.001 * window.gameConfig.floatSpeed) * 10;
            state.island.yOffset = floatY;
            state.island.scale += (1 - state.island.scale) * 10 * dt;

            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                p.vy += 200 * dt;
                if (p.life <= 0) state.particles.splice(i, 1);
            }

            state.clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > window.innerWidth + 100) c.x = -100;
            });

            state.ambientOrbs.forEach(orb => {
                orb.y -= orb.speed * dt;
                orb.x += Math.sin(time * 0.001 + orb.drift) * 8 * dt;
                if (orb.y < -20) {
                    orb.y = window.innerHeight + 20;
                    orb.x = Math.random() * window.innerWidth;
                }
            });
        }

        function draw(dt, time) {
            const W = canvas.width / (window.devicePixelRatio || 1);
            const H = canvas.height / (window.devicePixelRatio || 1);
            const cx = W / 2;
            const cy = H * 0.4 + state.island.yOffset;

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, window.gameConfig.skyColorTop);
            grad.addColorStop(0.55, '#1d5fb5');
            grad.addColorStop(1, window.gameConfig.skyColorBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const glowGrad = ctx.createRadialGradient(cx, H * 0.08, 20, cx, H * 0.08, W * 0.45);
            glowGrad.addColorStop(0, 'rgba(255, 224, 140, 0.35)');
            glowGrad.addColorStop(1, 'rgba(255, 224, 140, 0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, 0, W, H);

            state.ambientOrbs.forEach(orb => {
                ctx.save();
                ctx.globalAlpha = orb.alpha;
                ctx.fillStyle = '#dffbff';
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.46)';
            state.clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.5, c.size * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x - c.size * 0.8, c.y - c.size * 0.2, c.size * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(state.island.scale, state.island.scale);

            const islandGlow = ctx.createRadialGradient(0, -8, 10, 0, 0, 150);
            islandGlow.addColorStop(0, 'rgba(120, 247, 212, 0.28)');
            islandGlow.addColorStop(1, 'rgba(120, 247, 212, 0)');
            ctx.fillStyle = islandGlow;
            ctx.beginPath();
            ctx.ellipse(0, 6, 160, 62, 0, 0, Math.PI * 2);
            ctx.fill();

            const rockGrad = ctx.createLinearGradient(0, -10, 0, 150);
            rockGrad.addColorStop(0, '#87513d');
            rockGrad.addColorStop(1, '#3d241f');
            ctx.fillStyle = rockGrad;
            ctx.beginPath();
            ctx.moveTo(-120, 0);
            ctx.bezierCurveTo(-100, 150, 100, 150, 120, 0);
            ctx.fill();

            const grassGrad = ctx.createLinearGradient(0, -35, 0, 50);
            grassGrad.addColorStop(0, '#c3ff9a');
            grassGrad.addColorStop(0.5, '#78f7d4');
            grassGrad.addColorStop(1, '#247b69');
            ctx.fillStyle = grassGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 125, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-34, -4, 12, Math.PI * 0.15, Math.PI * 1.1);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(26, 2, 16, Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();

            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.ellipse(0, 40, 80, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            drawForgeCore(ctx, time);

            state.island.items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.scale(item.scale, item.scale);
                drawBuilding(ctx, item.type, item.color);
                ctx.restore();
            });

            ctx.restore();

            state.particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life);
                if (p.type === 'text') {
                    ctx.fillStyle = p.color;
                    ctx.font = "700 24px 'Audiowide'";
                    ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, 6, 6);
                }
                ctx.restore();
            });
        }

        function drawForgeCore(ctx, time) {
            const pulse = 1 + Math.sin(time * 0.004) * 0.06;

            ctx.save();
            ctx.scale(pulse, pulse);

            const halo = ctx.createRadialGradient(0, -32, 4, 0, -32, 38);
            halo.addColorStop(0, 'rgba(255, 239, 176, 0.95)');
            halo.addColorStop(0.38, 'rgba(138, 231, 255, 0.45)');
            halo.addColorStop(1, 'rgba(138, 231, 255, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, -32, 38, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#27466f';
            ctx.fillRect(-18, -18, 36, 22);

            ctx.fillStyle = '#132742';
            ctx.beginPath();
            ctx.moveTo(-24, -18);
            ctx.lineTo(0, -42);
            ctx.lineTo(24, -18);
            ctx.fill();

            ctx.fillStyle = '#f5d979';
            ctx.beginPath();
            ctx.arc(0, -28, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#9ee7ff';
            ctx.fillRect(-6, -14, 12, 12);

            ctx.strokeStyle = 'rgba(255,255,255,0.42)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-18, -4);
            ctx.lineTo(18, -4);
            ctx.stroke();

            ctx.restore();
        }

        function drawBuilding(ctx, type, color) {
            if (type === 'tree') {
                ctx.fillStyle = '#705040';
                ctx.fillRect(-6, -18, 12, 18);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(-20, -14);
                ctx.lineTo(0, -56);
                ctx.lineTo(20, -14);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, -26);
                ctx.lineTo(0, -44);
                ctx.lineTo(10, -26);
                ctx.stroke();
            } else if (type === 'house') {
                ctx.fillStyle = '#f0d7bc';
                ctx.fillRect(-20, -30, 40, 30);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(-25, -30);
                ctx.lineTo(0, -56);
                ctx.lineTo(25, -30);
                ctx.fill();

                ctx.fillStyle = '#5D4037';
                ctx.fillRect(-8, -15, 16, 15);

                ctx.fillStyle = '#bfeeff';
                ctx.fillRect(-12, -24, 8, 8);
                ctx.fillRect(4, -24, 8, 8);
            } else if (type === 'crystal') {
                const crystalGrad = ctx.createLinearGradient(0, -60, 0, 0);
                crystalGrad.addColorStop(0, '#f4fdff');
                crystalGrad.addColorStop(0.35, color);
                crystalGrad.addColorStop(1, '#3461d7');
                ctx.fillStyle = crystalGrad;
                ctx.beginPath();
                ctx.moveTo(0, -60);
                ctx.lineTo(15, -30);
                ctx.lineTo(0, 0);
                ctx.lineTo(-15, -30);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.beginPath();
                ctx.moveTo(0, -60);
                ctx.lineTo(5, -30);
                ctx.lineTo(0, 0);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function spawnText(text, x, y, color) {
            state.particles.push({
                type: 'text', text: text, x: x, y: y,
                vx: (Math.random() - 0.5) * 30, vy: -100,
                life: 1.0, color: color
            });
        }

        function spawnParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                state.particles.push({
                    type: 'dot', x: x, y: y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 1) * 300,
                    life: 0.8, color: color
                });
            }
        }

        function flashGif(id, duration = 1200) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('visible');
            clearTimeout(gifTimers.get(id));
            gifTimers.set(id, setTimeout(() => {
                el.classList.remove('visible');
            }, duration));
        }
    </script>
</body>
