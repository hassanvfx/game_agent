<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Anime Tactics: Ultimate Roster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&family=Bangers&display=swap">
    <style>
        :root {
            --bg: #050816;
            --bg-deep: #02040c;
            --panel: rgba(10, 16, 34, 0.88);
            --panel-strong: rgba(16, 24, 48, 0.96);
            --panel-soft: rgba(255, 255, 255, 0.06);
            --line: rgba(255, 255, 255, 0.12);
            --text: #eef4ff;
            --muted: #97a5c3;
            --blue: #59b7ff;
            --blue-strong: #3b82f6;
            --red: #ff6b87;
            --red-strong: #ef4444;
            --gold: #ffd166;
            --violet: #b57bff;
            --green: #3ddc97;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --radius: 18px;
            --radius-sm: 12px;
            --hud-font: "Orbitron", sans-serif;
            --ui-font: "Exo 2", sans-serif;
            --display-font: "Bangers", "Orbitron", sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; }
        body {
            background:
                radial-gradient(circle at top, rgba(88, 46, 160, 0.35), transparent 28%),
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.24), transparent 32%),
                linear-gradient(180deg, #09111f 0%, var(--bg) 42%, var(--bg-deep) 100%);
            color: var(--text);
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--ui-font);
        }

        button, input { font: inherit; }\n        img { display: block; max-width: 100%; }
        canvas { display: block; width: 100%; height: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hidden { display: none !important; }
        .flex { display: flex !important; }
        .btn-active:active { transform: scale(0.96); }
        .touch-manipulation { touch-action: manipulation; }
        .safe-area {
            padding-top: max(16px, env(safe-area-inset-top, 0px));
            padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            touch-action: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            background: linear-gradient(180deg, #ffffff, #cdd8ff);
            border: 2px solid rgba(59, 130, 246, 0.4);
            border-radius: 50%;
            margin-top: -10px;
            box-shadow: 0 0 14px rgba(89, 183, 255, 0.65);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.7), rgba(181, 123, 255, 0.7));
            border-radius: 999px;
        }

        .screen {
            position: absolute;
            inset: 0;
        }

        .setup-screen {
            display: flex;
            flex-direction: column;
            z-index: 20;
            background:
                linear-gradient(180deg, rgba(2, 6, 23, 0.98), rgba(3, 8, 20, 0.98)),
                radial-gradient(circle at top, rgba(181, 123, 255, 0.12), transparent 24%);
            transition: opacity 0.5s ease;
        }

        .header-shell {
            position: relative;
            overflow: hidden;
            padding-left: 14px;
            padding-right: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(10, 16, 34, 0.95), rgba(4, 8, 20, 0.98));
            flex-shrink: 0;
        }

        .header-shell::before,
        .header-shell::after {
            content: "";
            position: absolute;
            inset: auto auto 0 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .header-shell::before {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.18), rgba(181, 123, 255, 0.1), rgba(239, 68, 68, 0.16));
            opacity: 0.7;
        }
        .header-shell::after {
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 18px);
            opacity: 0.2;
        }

        .header-bar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .logo-lockup {
            text-align: center;
            flex: 1;
        }

        .game-title {
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(28px, 7vw, 40px);
            line-height: 0.95;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 0 14px rgba(89, 183, 255, 0.25), 0 0 28px rgba(181, 123, 255, 0.18);
        }
        .game-title .accent { color: #c38fff; }

        .subtitle {
            position: relative;
            z-index: 1;
            margin: 2px 0 0;
            text-align: center;
            font-family: var(--hud-font);
            font-size: 10px;
            letter-spacing: 0.38em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 8px 20px rgba(0,0,0,0.22);
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        .icon-button:hover { background: rgba(255,255,255,0.14); }
        .icon-button:active { transform: scale(0.9); }

        .roster-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 132px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(13, 20, 40, 0.92), rgba(6, 10, 24, 0.9));
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            position: relative;
        }

        .team-panel {
            padding: 12px;
            overflow: hidden;
        }
        .team-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(255,255,255,0.07), transparent 28%),
                linear-gradient(140deg, rgba(255,255,255,0.02), transparent 45%);
            pointer-events: none;
        }
        .team-panel.blue { border-left: 4px solid var(--blue-strong); }
        .team-panel.red { border-left: 4px solid var(--red-strong); }

        .team-badge-emoji {
            position: absolute;
            top: -4px;
            right: 8px;
            font-size: 64px;
            opacity: 0.12;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
            pointer-events: none;
        }

        .team-header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .team-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--hud-font);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .team-title.blue { color: #84d0ff; }
        .team-title.red { color: #ff99aa; }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            animation: pulseDot 1.2s infinite;
            box-shadow: 0 0 12px currentColor;
        }
        .pulse-dot.blue { background: var(--blue-strong); color: var(--blue-strong); }
        .pulse-dot.red { background: var(--red-strong); color: var(--red-strong); }

        @keyframes pulseDot {
            0%, 100% { transform: scale(0.95); opacity: 0.55; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .team-total,
        .mono-text {
            font-family: var(--hud-font);
            color: var(--muted);
        }

        .control-panel {
            padding: 14px 16px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            font-family: var(--hud-font);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .control-row strong {
            color: #fff;
            font-weight: 700;
        }
        .slider-wrap { padding: 0 8px 2px; }

        .footer-launch {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding: 12px 14px;
            background: linear-gradient(180deg, rgba(2,4,12,0), rgba(2,4,12,0.55) 24%, rgba(2,4,12,0.96) 100%);
        }

        .launch-button,
        .menu-button {
            width: 100%;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            padding: 16px 14px;
            font-family: var(--display-font);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }
        .launch-button {
            color: #08101f;
            background: linear-gradient(180deg, #ffffff, #dce8ff);
            box-shadow: 0 0 28px rgba(137, 197, 255, 0.35);
            font-size: 30px;
        }
        .launch-button:disabled {
            opacity: 0.5;
            box-shadow: none;
        }

        .info-screen {
            z-index: 40;
            background: rgba(2, 6, 23, 0.94);
            backdrop-filter: blur(18px);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(180deg, rgba(11, 17, 35, 0.98), rgba(7, 11, 24, 0.95));
        }
        .info-title {
            margin: 0;
            font-family: var(--display-font);
            letter-spacing: 0.08em;
            font-size: 28px;
        }

        .secondary-button {
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: var(--hud-font);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .info-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-screen {
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            background: #000;
        }

        .scanlines {
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
                linear-gradient(90deg, rgba(255, 0, 106, 0.06), rgba(59, 130, 246, 0.03), rgba(0, 255, 214, 0.05));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            opacity: 0.52;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            background: radial-gradient(circle, transparent 46%, rgba(0, 0, 0, 0.78) 100%);
        }

        .hud-row {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 50;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud-stack {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-label {
            display: flex;
            justify-content: space-between;
            font-family: var(--hud-font);
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .hud-label.blue { color: #8ecfff; }
        .hud-label.red { color: #ff9aab; }

        .hud-bar-shell {
            height: 14px;
            overflow: hidden;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(4, 7, 16, 0.76);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }
        .hud-bar-shell.left { transform: skewX(-10deg); }
        .hud-bar-shell.right { transform: skewX(10deg); }

        .hud-bar {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }
        .hud-bar.blue {
            background: linear-gradient(90deg, #276dff, #65d9ff);
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.72);
        }
        .hud-bar.red {
            background: linear-gradient(270deg, #f04949, #ff84a1);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
            margin-left: auto;
        }

        .vs-badge {
            width: 10%;
            text-align: center;
            padding-top: 2px;
            font-family: var(--display-font);
            font-size: 26px;
            color: rgba(255,255,255,0.28);
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }

        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .control-cluster {
            position: absolute;
            top: 0;
            right: 8px;
            margin-top: 64px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 50;
        }

        .control-cluster .icon-button {
            width: 42px;
            height: 42px;
            border-color: rgba(255,255,255,0.22);
            background: rgba(5, 10, 24, 0.55);
            backdrop-filter: blur(8px);
            font-size: 17px;
        }
        .control-cluster .icon-button.home {
            background: rgba(120, 12, 35, 0.85);
            box-shadow: 0 10px 24px rgba(120, 12, 35, 0.35);
        }

        .media-strip {
            position: absolute;
            left: 12px;
            right: 72px;
            bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 84px));
            z-index: 45;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .reaction-gif {
            position: relative;
            width: clamp(72px, 20vw, 118px);
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(3, 6, 18, 0.72);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.28);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px) scale(0.9);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .reaction-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reaction-gif.left { align-self: flex-end; }
        .reaction-gif.right { align-self: flex-start; }

        .reaction-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .reaction-gif::after {
            content: attr(data-label);
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 8px;
            padding: 4px 6px;
            border-radius: 999px;
            background: rgba(2, 6, 23, 0.78);
            color: #fff;
            font-family: var(--hud-font);
            font-size: 7px;
            line-height: 1.35;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
        }

        .reaction-gif.burst {
            border-color: rgba(255, 209, 102, 0.55);
            box-shadow: 0 0 24px rgba(255, 209, 102, 0.32);
        }

        .reaction-gif.finish {
            border-color: rgba(89, 183, 255, 0.55);
            box-shadow: 0 0 24px rgba(89, 183, 255, 0.28);
        }

        @media (max-width: 420px) {
            .media-strip {
                left: 10px;
                right: 66px;
                gap: 8px;
            }

            .reaction-gif {
                width: 72px;
                border-radius: 12px;
            }

            .reaction-gif::after {
                font-size: 6px;
            }
        }

        .domain-popup {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transform: scale(1.5);
            transition: all 0.5s ease;
            z-index: 40;
            padding: 0 10px;
        }
        .domain-text {
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(36px, 10vw, 62px);
            line-height: 0.9;
            color: #fff;
            text-shadow: 0 0 14px #fff, 0 0 28px rgba(181, 123, 255, 0.55);
            letter-spacing: 0.04em;
            word-break: break-word;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 60;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            transition: opacity 0.2s ease;
        }

        .pause-title,
        .result-title {
            margin: 0 0 18px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 18px rgba(255,255,255,0.35);
        }
        .pause-title {
            font-family: var(--display-font);
            font-size: clamp(54px, 12vw, 82px);
            letter-spacing: 0.08em;
        }

        .menu-actions,
        .result-actions {
            width: min(100%, 288px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-button {
            font-size: 22px;
        }
        .menu-button.primary,
        .result-button.primary {
            color: #09101d;
            background: linear-gradient(180deg, #fff, #e5efff);
            box-shadow: 0 0 24px rgba(255,255,255,0.2);
        }
        .menu-button.danger {
            color: #ff7f96;
            background: rgba(111, 13, 34, 0.12);
            border-color: rgba(239, 68, 68, 0.45);
        }

        .result-screen {
            z-index: 50;
        }

        .result-title {
            font-family: var(--display-font);
            font-size: clamp(64px, 13vw, 108px);
            line-height: 0.88;
            padding: 0 10px;
        }

        .result-msg {
            margin-bottom: 28px;
            padding: 10px 14px;
            border-top: 1px solid rgba(255,255,255,0.12);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            text-align: center;
            font-family: var(--hud-font);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: #d4def4;
        }

        .result-button {
            width: 100%;
            border-radius: 16px;
            padding: 16px 14px;
            border: 2px solid rgba(255,255,255,0.18);
            font-family: var(--display-font);
            font-size: 24px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        .result-button.secondary {
            color: #b8c4da;
            background: transparent;
        }

        @keyframes flash {
            0% { background-color: white; opacity: 0.8; }
            100% { background-color: transparent; opacity: 0; }
        }
        .flash-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            animation: flash 0.15s ease-out forwards;
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            padding-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        @media (min-width: 640px) {
            .roster-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }

        .unit-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 108px;
            border-radius: 14px;
            padding: 8px 6px 6px;
            border: 1px solid rgba(255,255,255,0.07);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
                rgba(4, 8, 18, 0.7);
            position: relative;
            overflow: hidden;
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }
        .unit-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.07), transparent 40%);
            opacity: 0.5;
            pointer-events: none;
        }
        .unit-card-icon {
            position: relative;
            z-index: 1;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255,255,255,0.07);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 6px 14px rgba(0,0,0,0.22);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
        }
        .unit-card-name {
            position: relative;
            z-index: 1;
            width: 100%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--hud-font);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .unit-card-name.blue { color: #d2edff; }
        .unit-card-name.red { color: #ffd6dd; }

        .unit-card-controls {
            position: relative;
            z-index: 1;
            width: 100%;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            border-radius: 10px;
            background: rgba(0,0,0,0.36);

    <script>
        // --- AUDIO ENGINE ---
        /* [agent-note][stage3] resolved-audio: ui/combat/music loop -> catalogs/audios.json */
        class MediaAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.masterGain = null;
                this.musicGain = null;
                this.sfxGain = null;
                this.buffers = new Map();
                this.loading = new Map();
                this.loopSource = null;
                this.lastPlayed = {};
                this.catalog = {
                    uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                    start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                    pause: "https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3",
                    resume: "https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3",
                    blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                    hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                    magic: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                    burst: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                    power: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                    warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                    victory: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                    defeat: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                    bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3"
                };
            }

            init() {
                if (this.ctx) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                try {
                    this.ctx = new AC();
                    this.masterGain = this.ctx.createGain();
                    this.sfxGain = this.ctx.createGain();
                    this.musicGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.enabled ? 0.85 : 0;
                    this.sfxGain.gain.value = 0.78;
                    this.musicGain.gain.value = 0.22;
                    this.sfxGain.connect(this.masterGain);
                    this.musicGain.connect(this.masterGain);
                    this.masterGain.connect(this.ctx.destination);
                } catch (error) {
                    this.ctx = null;
                }
            }

            async unlock() {
                this.init();
                if (!this.ctx) return false;
                try {
                    if (this.ctx.state === 'suspended') await this.ctx.resume();
                    return true;
                } catch (error) {
                    return false;
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.masterGain) this.masterGain.gain.value = this.enabled ? 0.85 : 0;
                if (!this.enabled) this.stopLoop();
                return this.enabled;
            }

            async loadBuffer(url) {
                if (!url || !this.ctx) return null;
                if (this.buffers.has(url)) return this.buffers.get(url);
                if (this.loading.has(url)) return this.loading.get(url);
                const promise = fetch(url)
                    .then(resp => resp.arrayBuffer())
                    .then(data => this.ctx.decodeAudioData(data))
                    .then(buffer => {
                        this.buffers.set(url, buffer);
                        this.loading.delete(url);
                        return buffer;
                    })
                    .catch(() => {
                        this.loading.delete(url);
                        return null;
                    });
                this.loading.set(url, promise);
                return promise;
            }

            prime(urls = []) {
                if (!this.ctx) return;
                urls.forEach(url => { this.loadBuffer(url); });
            }

            async play(name, options = {}) {
                if (!this.enabled) return;
                const ready = await this.unlock();
                if (!ready || !this.sfxGain) return;
                const { cooldown = 100, volume = 1 } = options;
                const now = performance.now();
                if (cooldown && this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return;
                this.lastPlayed[name] = now;

                const buffer = await this.loadBuffer(this.catalog[name]);
                if (!buffer) return;
                try {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    gain.gain.value = volume;
                    source.buffer = buffer;
                    source.connect(gain);
                    gain.connect(this.sfxGain);
                    source.start();
                } catch (error) {}
            }

            async startLoop(name = 'bgm') {
                if (!this.enabled || this.loopSource) return;
                const ready = await this.unlock();
                if (!ready || !this.musicGain) return;
                const buffer = await this.loadBuffer(this.catalog[name]);
                if (!buffer) return;
                try {
                    const source = this.ctx.createBufferSource();
                    source.buffer = buffer;
                    source.loop = true;
                    source.connect(this.musicGain);
                    source.start();
                    this.loopSource = source;
                } catch (error) {}
            }

            stopLoop() {
                if (!this.loopSource) return;
                try { this.loopSource.stop(); } catch (error) {}
                if (this.loopSource.disconnect) this.loopSource.disconnect();
                this.loopSource = null;
            }
        }
        const audio = new MediaAudio();

        const REACTION_TIMERS = {};

        }

        // --- UNITS & SKILLS (ULTIMATE ROSTER) ---
        const UNITS = {

            sasuke: { name: 'Sasuke', icon: '⚡', hp: 68000, spd: 3.8, pwr: 80.0, cost: 7, color: '#6366f1', iq: 1.0, desc: "Shadow Hokage. Chidori, Amenotejikara, Susanoo." },

            pain: { name: 'Pain', icon: '📌', hp: 65000, spd: 2.5, pwr: 95.0, cost: 7, color: '#f97316', iq: 1.0, desc: "God of Peace. Shinra Tensei, Chibaku Tensei." },
            obito: { name: 'Obito', icon: '🎭', hp: 60000, spd: 3.0, pwr: 75.0, cost: 6, color: '#4c1d95', iq: 1.0, desc: "Broken Hero. Kamui Intangibility, Wood Style." },
            madara: { name: 'Madara', icon: '☄️', hp: 80000, spd: 3.2, pwr: 100.0, cost: 8, color: '#7f1d1d', iq: 1.0, desc: "Ghost of Uchiha. Meteor Drop, Perfect Susanoo." },

            gon: { name: 'Gon (Adult)', icon: '👊', hp: 60000, spd: 4.0, pwr: 120.0, cost: 7, color: '#16a34a', iq: 0.8, desc: "Sacrifice. Jajanken Rock, Limit Breaker." },
            killua: { name: 'Killua', icon: '⚡', hp: 55000, spd: 5.0, pwr: 70.0, cost: 6, color: '#a855f7', iq: 1.0, desc: "Assassin. Godspeed, Thunderbolt, Stun Lock." },

            yuji: { name: 'Yuji (Awakened)', icon: '🐯', hp: 25000, spd: 2.5, pwr: 40.0, cost: 4, color: '#f59e0b', iq: 1.0, desc: "Soul King. Black Flash Spam." },
            sungjinwo: { name: 'Jinwoo (Monarch)', icon: '👤', hp: 50000, spd: 3.0, pwr: 70.0, cost: 5, color: '#4c1d95', iq: 1.0, desc: "Shadow Sovereign. Army Summon." },
            luffy: { name: 'Luffy (Nika)', icon: '👒', hp: 55000, spd: 2.8, pwr: 60.0, cost: 5, color: '#ef4444', iq: 1.0, desc: "Joyboy. Toon Force, Bajrang Gun." },
            wukong: { name: 'Wukong', icon: '🐵', hp: 60000, spd: 3.0, pwr: 65.0, cost: 5, color: '#eab308', iq: 1.0, desc: "Buddha. Immortality, Clones." }
        };

        const TEAM_LIMIT = 15;
        let teams = { blue: {}, red: {} };
        ['blue','red'].forEach(t => Object.keys(UNITS).forEach(k => teams[t][k] = 0));
        teams.blue.sorcerer = 1; teams.red.sukuna = 1;
        let hpMult = 1.0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, shake = 0, freezeFrames = 0;

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let gameActive = false, isPaused = false, entities = [], particles = [], domain = null;

        // --- SETUP ---
        function initSetup() { renderRoster('blue'); renderRoster('red'); updateCounts(); renderInfo(); }
        function renderRoster(team) {
            const c = document.getElementById(`${team}-roster`); c.innerHTML = '';
            Object.keys(UNITS).forEach(k => {
                const u = UNITS[k];
                const d = document.createElement('div');
                d.className = 'unit-card';
                d.id = `card-${team}-${k}`;
                d.innerHTML = `
                    <div class="unit-card-icon">${u.icon}</div>
                    <div class="unit-card-name ${team==='blue'?'blue':'red'}">${u.name}</div>
                    <div class="unit-card-controls">
                        <button class="count-button minus btn-active" onclick="modUnit('${team}','${k}',-1)" aria-label="Remove ${u.name}">−</button>
                        <span id="count-${team}-${k}" class="count-value">0</span>
                        <button class="count-button plus btn-active" onclick="modUnit('${team}','${k}',1)" aria-label="Add ${u.name}">+</button>
                    </div>`;
                c.appendChild(d);
            });
        }
        function renderInfo() {
            const l = document.getElementById('info-list'); l.innerHTML = '';
            Object.keys(UNITS).forEach(k => {
                const u = UNITS[k];
                const d = document.createElement('div');
                d.className = 'glass-panel archive-card';
                d.innerHTML = `
                    <div class="archive-head">
                        <div class="archive-icon">${u.icon}</div>
                        <div>
                            <h3 class="archive-name">${u.name.toUpperCase()}</h3>
                            <div class="archive-meta">COST: ${u.cost} // IQ: MAX</div>
                        </div>
                    </div>
                    <p class="archive-desc">${u.desc}</p>`;
                l.appendChild(d);
            });
        }
        function toggleInfo() {
            audio.play(document.getElementById('info-screen').classList.contains('open') ? 'resume' : 'uiClick', { cooldown: 120, volume: 0.55 });
            document.getElementById('info-screen').classList.toggle('hidden'); document.getElementById('info-screen').classList.toggle('open'); if (document.getElementById('info-screen').classList.contains('open')) { document.getElementById('info-screen').style.transform = 'translateY(0)'; } else { document.getElementById('info-screen').style.transform = 'translateY(100%)'; }
        }
        function modUnit(t, k, d) {
            const tot = Object.values(teams[t]).reduce((a,b)=>a+b,0);
            if (d>0 && tot<TEAM_LIMIT) {
                teams[t][k]++;
                audio.play('uiClick', { cooldown: 40, volume: 0.42 });
            } else if (d<0 && teams[t][k]>0) {
                teams[t][k]--;
                audio.play('uiClick', { cooldown: 40, volume: 0.34 });
            } else if (d !== 0) {
                audio.play('blocked', { cooldown: 150, volume: 0.45 });
            }
            updateCounts();
        }
        function updateCounts() {
            let bT=0, rT=0;
            ['blue','red'].forEach(t => {
                let tc = 0;
                Object.keys(UNITS).forEach(k => {
                    const c = teams[t][k]; tc+=c;
                    document.getElementById(`count-${t}-${k}`).innerText = c;
                    const cd = document.getElementById(`card-${t}-${k}`);
                    if(c>0) {
                        cd.style.transform = 'translateY(-1px)';
                        cd.style.borderColor=t==='blue'?'rgba(89,183,255,0.95)':'rgba(255,107,135,0.95)';
                        cd.style.background=t==='blue'
                            ? 'linear-gradient(180deg, rgba(89,183,255,0.22), rgba(7,10,22,0.76))'
                            : 'linear-gradient(180deg, rgba(255,107,135,0.22), rgba(18,7,12,0.78))';
                        cd.style.boxShadow=t==='blue'
                            ? '0 10px 24px rgba(59,130,246,0.2), inset 0 0 0 1px rgba(255,255,255,0.04)'
                            : '0 10px 24px rgba(239,68,68,0.18), inset 0 0 0 1px rgba(255,255,255,0.04)';
                    }
                    else {
                        cd.style.transform = 'translateY(0)';
                        cd.style.borderColor='rgba(255,255,255,0.07)';
                        cd.style.background='linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)), rgba(4, 8, 18, 0.7)';
                        cd.style.boxShadow='inset 0 0 0 1px rgba(255,255,255,0.03)';
                    }
                });
                document.getElementById(`total-${t}`).innerText = `${tc}/${TEAM_LIMIT}`;
                if(t==='blue') bT=tc; else rT=tc;
            });
            document.getElementById('start-btn').disabled = (bT===0 || rT===0);
        }
        function updateHpDisplay(v) {
            const o = ["NORMAL", "LOW (50%)", "HIGH (200%)", "BOSS (500%)", "RAID (1000%)", "IMMORTAL", "ONE SHOT"];
            const m = [1.0, 0.5, 2.0, 5.0, 10.0, 9999, 0.01];
            document.getElementById('disp-hp').innerText = o[v]; hpMult = m[v];
        }

        // --- GAMEPLAY ---
        async function startGame() {
            await audio.unlock();
            audio.prime(Object.values(audio.catalog));
            audio.play('start', { cooldown: 200, volume: 0.7 });
            audio.startLoop('bgm');
            document.getElementById('setup-screen').style.opacity = '0'; document.getElementById('setup-screen').style.pointerEvents = 'none';
            document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('pause-screen').classList.remove('flex');
            const gs = document.getElementById('game-screen'); gs.style.opacity = '1'; gs.style.pointerEvents = 'auto';
            gameActive = true; isPaused = false; entities = []; particles = []; domain = null;
            spawnTeam('blue', width*0.15); spawnTeam('red', width*0.85);
            requestAnimationFrame(gameLoop);
        }
        function togglePause() {
            if(!gameActive) return; isPaused = !isPaused;
            const ps = document.getElementById('pause-screen');
            if(isPaused) {
                audio.play('pause', { cooldown: 180, volume: 0.6 });
                audio.stopLoop();
                ps.classList.remove('hidden'); ps.classList.add('flex');
            }
            else {
                audio.play('resume', { cooldown: 180, volume: 0.6 });
                audio.startLoop('bgm');
                ps.classList.add('hidden'); ps.classList.remove('flex'); requestAnimationFrame(gameLoop);
            }
        }
        function spawnTeam(t, sx) {
            let off = 0;
            Object.keys(UNITS).forEach(k => {
                for(let i=0; i<teams[t][k]; i++) {
                    createEntity(t, k, sx + (Math.random()*40-20) + (t==='blue'?-off:off));
                    off += 15;
                }
            });
        }

        function createEntity(team, type, x, isSummon=false) {
            const s = UNITS[type];
            let hp = isSummon ? s.hp : Math.floor(s.hp * hpMult);
            if(hpMult < 0.1 && !isSummon) hp = 1;

            entities.push({
                id: Math.random().toString(36), team, type, x, y: height - 100 - Math.random()*20,
                vx: 0, vy: 0, w: 30, h: 60, hp, maxHp: hp, spd: s.spd * 2, pwr: s.pwr, iq: s.iq || 1.0,
                color: s.color, facing: team==='blue'?1:-1, state: 'IDLE', frame: Math.floor(Math.random()*100),
                cd: { atk: 0, skill1: 0, skill2: 0, skill3: 0, ult: 0, block: 0 },
                blockTimer: 0, target: null, isSummon, life: isSummon?600:999999, stun: 0, invuln: 0,
                mode: 'normal', revived: false, clones: 0, lowHealthCue: false
            });
            for(let i=0; i<10; i++) particles.push({ x, y: height-100, vx: (Math.random()-0.5)*10, vy: -Math.random()*10, life: 1, color: team==='blue'?'#60a5fa':'#f87171', size: 3, type: 'spark' });
        }

        function gameLoop() {
            if (!gameActive || isPaused) return;
            if (freezeFrames > 0) { freezeFrames--; draw(); requestAnimationFrame(gameLoop); return; }
            updatePhysics(); updateAI(); updateDomain(); draw(); checkWinCondition();
            requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            if (shake > 0) shake *= 0.9;
            entities.forEach(e => {
                if (e.hp <= 0 && !e.revived && e.type === 'wukong') {
                    e.hp = e.maxHp * 0.8; e.revived = true; e.mode = 'immortal'; e.invuln = 60;
                    showPopup("IMMORTALITY"); audio.play('power', { cooldown: 300, volume: 0.72 }); showReactionGif('finish', 'Immortal Reset', 1800);
                }
                if (e.type === 'venom' && e.hp > 0 && e.hp < e.maxHp && e.frame % 20 === 0) {
                    e.hp += e.maxHp * 0.05;
                }
                if ((e.type === 'sorcerer' || e.type === 'sukuna') && e.hp < e.maxHp && e.hp > 0 && e.frame % 15 === 0) {
                    e.hp += e.maxHp * 0.05;
                }

                if (e.hp <= 0) return;

                e.vy += 0.8;
                if (e.state === 'BLOCK' || e.state === 'CAST') { e.vx *= 0.8; }
                if (e.state === 'BLOCK') { e.blockTimer--; if (e.blockTimer <= 0) { e.state = 'IDLE'; e.cd.block = 60; } }

                e.x += e.vx; e.y += e.vy; e.frame++;
                const floor = height - 80;
                if (e.y + e.h > floor) { e.y = floor - e.h; e.vy = 0; e.vx *= 0.8; }
                if (e.x < 0) { e.x = 0; e.vx *= -0.5; }
                if (e.x > width - e.w) { e.x = width - e.w; e.vx *= -0.5; }

                if (e.stun > 0) { e.stun--; e.vx *= 0.9; }
                if (!e.lowHealthCue && !e.isSummon && e.hp > 0 && e.hp < e.maxHp * 0.2) {
                    e.lowHealthCue = true;
                    audio.play('warning', { cooldown: 240, volume: 0.44 });
                }
                if (e.invuln > 0) e.invuln--;

                Object.keys(e.cd).forEach(k => { if(e.cd[k]>0) e.cd[k]--; });
                if (e.isSummon) e.life--;
            });
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy;
                if (p.type !== 'beam' && p.type !== 'projectile') p.vy += 0.1;
                p.life -= p.decay || 0.02; if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateAI() {
            entities.forEach(e => {
                if (e.hp <= 0 || e.stun > 0 || e.state === 'BLOCK') return;
                if (e.isSummon && e.life <= 0) { e.hp = 0; return; }

                let target = null, minDist = Infinity;
                entities.forEach(o => {
                    if (o.team !== e.team && o.hp > 0) {
                        const d = Math.abs((e.x+e.w/2) - (o.x+o.w/2));
                        if (d < minDist) { minDist = d; target = o; }
                    }
                });
                e.target = target;
                if (!target) { e.state = 'IDLE'; if(Math.abs(e.vx)>0.1) e.vx*=0.9; return; }

                const dist = minDist;
                const facingTarget = (target.x > e.x);
                e.facing = facingTarget ? 1 : -1;

                switch(e.type) {
                    case 'sorcerer':
                        if (e.cd.ult <= 0 && Math.random() < 0.1) { castDomain(e, 'VOID'); return; }
                        if (dist < 800 && e.cd.skill1 <= 0 && Math.random() < 0.3) {
                            e.state = 'CAST'; e.cd.skill1 = 120; e.vx = 0; createProjectile(e, target, 'PURPLE'); return;
                        }
                        break;
                    case 'sukuna':
                        if (e.cd.ult <= 0 && Math.random() < 0.1) { castDomain(e, 'SHRINE'); return; }
                        if (dist < 800 && e.cd.skill1 <= 0 && Math.random() < 0.3) {
                            e.state = 'CAST'; e.cd.skill1 = 120; e.vx = 0; showPopup("WORLD CUTTING SLASH");
                            setTimeout(() => { audio.play('slash'); shake=40; entities.forEach(o => { if(o.team !== e.team) dealDamage(e, o, 10.0, 'WORLD'); }); }, 500); return;
                        }
                        break;
                    case 'venom':
                        if (dist < 100 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 80; e.vx = 0; audio.play('burst', { cooldown: 180, volume: 0.58 });
                            dealDamage(e, target, 2.0, 'BITE'); e.hp += 2000; particles.push({x:e.x, y:e.y, vx:0, vy:-2, life:1, color:'#10b981', size:5, type:'spark'}); return;
                        }
                        break;
                    case 'ben10':
                        if (e.cd.skill1 <= 0 && Math.random() < 0.2) {
                            e.state = 'CAST'; e.cd.skill1 = 150; e.vx = 0; audio.play('power', { cooldown: 220, volume: 0.62 });
                            showPopup("ALIEN X"); screenFlash(); shake=30;
                            entities.forEach(o => { if(o.team !== e.team) { o.stun=60; dealDamage(e, o, 3.0, 'MAGIC'); } }); return;
                        }
                        break;
                    case 'sanji':
                        if (dist < 200 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 60; e.vx = e.facing * 15; audio.play('magic', { cooldown: 120, volume: 0.52 });
                            particles.push({x:e.x, y:e.y, vx:0, vy:0, life:0.5, color:'#facc15', size:30, type:'spark'});
                            setTimeout(() => dealDamage(e, target, 2.0, 'FIRE_KICK'), 200); return;
                        }
                        break;
                    case 'zoro':
                        if (dist < 300 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 80; e.vx = 0; audio.play('magic', { cooldown: 120, volume: 0.54 });
                            createProjectile(e, target, 'SLASH_WAVE'); return;
                        }
                        break;
                    case 'naruto':
                        if (e.cd.skill2 <= 0 && e.clones < 3) {
                            e.state = 'CAST'; e.cd.skill2 = 200; e.vx = 0; audio.play('power', { cooldown: 220, volume: 0.56 });
                            createEntity(e.team, 'naruto', e.x + (Math.random()*40-20), true); e.clones++; return;
                        }
                        if (dist < 400 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 100; e.vx = 0; createProjectile(e, target, 'RASENGAN'); return;
                        }
                        break;
                    case 'sasuke':
                        if (dist > 200 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 100; e.x = target.x - (e.facing*50); audio.play('magic', { cooldown: 140, volume: 0.48 });
                            setTimeout(() => dealDamage(e, target, 2.5, 'CHIDORI'), 100); return;
                        }
                        break;
                    case 'itachi':
                        if (e.cd.ult <= 0 && Math.random() < 0.2) { castDomain(e, 'TSUKUYOMI'); return; }
                        if (dist < 400 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 120; e.vx = 0; createProjectile(e, target, 'AMATERASU'); return;
                        }
                        break;
                    case 'pain':
                        if (dist < 300 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 150; e.vx = 0; showPopup("SHINRA TENSEI"); audio.play('burst', { cooldown: 220, volume: 0.68 });
                            entities.forEach(o => {
                                if(o.team !== e.team && Math.abs(o.x - e.x) < 300) {
                                    o.vx = e.facing * 20; o.vy = -10; dealDamage(e, o, 2.0, 'MAGIC');
                                }
                            }); return;
                        }
                        break;
                    case 'obito':
                        if (Math.random() < 0.1) { e.invuln = 20; }
                        break;
                    case 'madara':
                        if (e.cd.ult <= 0 && Math.random() < 0.2) {
                            e.state = 'CAST'; e.cd.ult = 999; e.vx = 0; showPopup("TENGAL SHINSEI");
                            setTimeout(() => {
                                screenFlash(); shake=50;
                                entities.forEach(o => { if(o.team !== e.team) dealDamage(e, o, 8.0, 'SMASH'); });
                            }, 1000); return;
                        }
                        break;
                    case 'gon':
                        if (dist < 80 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 150; e.vx = 0; showPopup("JA... JAN...");
                            setTimeout(() => {
                                showPopup("KEN!"); audio.play('burst', { cooldown: 240, volume: 0.72 });
                                dealDamage(e, target, 5.0, 'SMASH'); shake=30;
                            }, 800); return;
                        }
                        break;
                    case 'killua':
                        if (dist < 100 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 60; e.vx = 0; audio.play('warning', { cooldown: 220, volume: 0.52 });
                            target.stun = 60; dealDamage(e, target, 1.5, 'LIGHTNING'); return;
                        }
                        break;
                    case 'sungjinwo':
                         if (e.cd.skill2 <= 0 && entities.filter(ent => ent.team === e.team).length < 25) {
                            e.state = 'CAST'; e.cd.skill2 = 100; e.vx = 0; audio.play('power', { cooldown: 200, volume: 0.54 });
                            createEntity(e.team, 'yuji', e.x, true); return;
                        }
                        break;
                }

                if (dist < 60 && e.cd.atk <= 0) {
                    e.state = 'ATTACK'; e.cd.atk = 15; e.vx = 0;
                    setTimeout(() => dealDamage(e, target, 1.0, 'MELEE'), 100);
                } else if (dist > 50) {
                    e.state = 'MOVE'; e.vx = e.facing * e.spd;
                } else {
                    e.state = 'IDLE'; e.vx = 0;
                }
            });
        }

        function createProjectile(owner, target, type) {
            const py = owner.y + 20;
            const px = owner.x + owner.w/2 + (owner.facing * 20);

            if (type === 'PURPLE') {
                audio.play('burst', { cooldown: 240, volume: 0.75 }); showPopup("HOLLOW PURPLE"); showReactionGif('burst', 'Hollow Purple', 1600);
                setTimeout(() => {
                    screenFlash(); shake = 40; freezeFrames = 10;
                    particles.push({ x: px, y: py, vx: owner.facing * 15, vy: 0, life: 3, color: '#a855f7', size: 100, type: 'projectile', damage: 99999, owner: owner, pierce: true });
                }, 500);
            } else if (type === 'RASENGAN') {
                particles.push({ x: px, y: py, vx: owner.facing * 12, vy: 0, life: 1, color: '#3b82f6', size: 30, type: 'projectile', damage: 2000, owner: owner, effect: 'knockback' });
            } else if (type === 'AMATERASU') {
                particles.push({ x: target.x, y: target.y, vx: 0, vy: 0, life: 2, color: '#000', size: 40, type: 'projectile', damage: 500, owner: owner, pierce: true });
            } else if (type === 'SLASH_WAVE') {
                particles.push({ x: px, y: py, vx: owner.facing * 20, vy: 0, life: 0.5, color: '#15803d', size: 50, type: 'projectile', damage: 1500, owner: owner, pierce: true });
            }
        }

        function dealDamage(att, def, mult, type) {
            if (def.hp <= 0 || def.invuln > 0) return;

            if (def.type === 'sorcerer' && type !== 'WORLD' && type !== 'DOMAIN_HIT') {
                if (Math.random() < 0.9) {
                    particles.push({x: def.x+def.w/2, y: def.y+def.h/2, vx:0, vy:0, life:0.5, color:'#3b82f6', size:40, type:'shield'});
                    return;
                }
            }

            if (type === 'WORLD') {
                def.hp -= 99999;
                particles.push({x: def.x+def.w/2, y: def.y+def.h/2, vx:0, vy:0, life:0.5, color:'#000', size:60, type:'slash_anim'});
                return;
            }

            const dmg = att.pwr * 10 * mult;
            def.hp -= dmg;

            audio.play(mult > 1.7 ? 'burst' : 'hit', { cooldown: mult > 1.7 ? 120 : 70, volume: mult > 1.7 ? 0.55 : 0.45 });
            if (mult > 1.7) showReactionGif('burst', type.replace(/_/g, ' '), 1000);
            if (type === 'FIRE_KICK' || type === 'AMATERASU') {
                particles.push({x:def.x, y:def.y, vx:0, vy:-2, life:0.5, color:'#f97316', size:30, type:'smoke'});
            } else if (type === 'LIGHTNING' || type === 'CHIDORI') {
                particles.push({x:def.x, y:def.y, vx:0, vy:0, life:0.3, color:'#fff', size:40, type:'spark'});
            }

            def.vx = att.facing * 5 * mult; def.vy = -3;
            if (mult > 2.0) { shake = 10; freezeFrames = 3; }
        }

        function castDomain(owner, type) {
            domain = { type, owner: owner.id, time: 600 };
            owner.cd.ult = 9999; audio.play('power', { cooldown: 280, volume: 0.72 }); screenFlash(); shake = 15; showReactionGif('burst', 'Domain Expansion', 1700);
            let name = "DOMAIN EXPANSION";
            if (type === 'VOID') name = "UNLIMITED VOID";
            else if (type === 'SHRINE') name = "MALEVOLENT SHRINE";
            else if (type === 'TSUKUYOMI') name = "TSUKUYOMI";
            showPopup(name);
            if (type === 'VOID' || type === 'TSUKUYOMI') entities.forEach(e => { if (e.id !== owner.id && e.type !== 'sukuna') e.stun = 600; });
        }

        function showPopup(text) {
            const p = document.getElementById('domain-popup'); const t = document.getElementById('domain-text');
            t.innerText = text; p.style.opacity = '1'; p.style.transform = 'scale(1)';
            setTimeout(() => { p.style.opacity = '0'; p.style.transform = 'scale(1.5)'; }, 2000);
        }

        function updateDomain() {
            if (!domain) return;
            domain.time--;
            const owner = entities.find(e => e.id === domain.owner);
            if (!owner) { domain = null; return; }

            if (domain.type === 'SHRINE' && domain.time % 2 === 0) {
                entities.forEach(e => {
                    if (e.team !== owner.team) {
                        dealDamage(owner, e, 0.8, 'DOMAIN_HIT');
                        particles.push({x:e.x+Math.random()*20, y:e.y+Math.random()*40, vx:0, vy:0, life:0.2, color:'#fff', size:20, type:'slash_anim'});
                    }
                });
                shake = 4;
            } else if ((domain.type === 'VOID' || domain.type === 'TSUKUYOMI') && domain.time % 20 === 0) {
                 entities.forEach(e => { if (e.team !== owner.team) dealDamage(owner, e, 0.5, 'MAGIC'); });
            }
            if (domain.time <= 0) domain = null;
        }

        function screenFlash() {
            const f = document.createElement('div'); f.className = 'flash-fx';
            document.getElementById('flash-layer').appendChild(f); setTimeout(() => f.remove(), 200);
        }

        // --- DRAWING ---
        function draw() {
            if (domain) {
                if (domain.type === 'VOID') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height); ctx.fillStyle = '#000'; for(let i=0;i<50;i++) ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2); }
                else if (domain.type === 'SHRINE') { ctx.fillStyle = '#450a0a'; ctx.fillRect(0,0,width,height); }
                else if (domain.type === 'TSUKUYOMI') { ctx.fillStyle = '#000'; ctx.fillRect(0,0,width,height); ctx.fillStyle = '#b91c1c'; ctx.fillRect(0,0,width,height/2); ctx.globalAlpha=0.5; }
            } else {
                const sky = ctx.createLinearGradient(0, 0, 0, height);
                sky.addColorStop(0, '#040817');
                sky.addColorStop(0.48, '#081327');
                sky.addColorStop(1, '#02050d');
                ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height);

                ctx.save();
                ctx.globalAlpha = 0.22;
                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = i === 0 ? '#13213f' : i === 1 ? '#0d1831' : '#091120';
                    const peak = height * (0.48 + i * 0.08);
                    ctx.beginPath();
                    ctx.moveTo(0, height);
                    for (let x = 0; x <= width; x += 80) {
                        const y = peak + Math.sin((x / width) * Math.PI * (2.4 + i)) * (22 + i * 8) + (Math.random() * 4);
                        ctx.lineTo(x, y);
                    }
                    ctx.lineTo(width, height);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                ctx.strokeStyle = 'rgba(102, 167, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let i=0; i<width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,height); }
                for(let j=0; j<height; j+=44) { ctx.moveTo(0,j); ctx.lineTo(width,j); }
                ctx.stroke();

                const floorGrad = ctx.createLinearGradient(0, height-90, 0, height);
                floorGrad.addColorStop(0, '#0a1326');
                floorGrad.addColorStop(1, '#050914');
                ctx.fillStyle = floorGrad; ctx.fillRect(0, height-80, width, 80);

                ctx.strokeStyle = 'rgba(119, 191, 255, 0.28)';
                ctx.beginPath();
                ctx.moveTo(0, height-80);
                ctx.lineTo(width, height-80);
                ctx.stroke();
            }
            ctx.globalAlpha=1;

            ctx.save();
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            entities.sort((a,b) => a.y - b.y);
            entities.forEach(e => { if(e.hp > 0) drawEntity(e); });

            particles.forEach(p => {
                if (p.type === 'projectile') {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    entities.forEach(e => {
                        if (e.team !== p.owner.team && Math.abs(e.x+e.w/2 - p.x) < p.size + e.w/2 && Math.abs(e.y+e.h/2 - p.y) < 50) {
                            dealDamage(p.owner, e, 1.0, 'MAGIC');
                            if (!p.pierce) p.life = 0;
                        }
                    });
                } else {
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
                }
            });
            ctx.restore(); updateHUD();
        }

        function drawEntity(e) {
            ctx.save(); ctx.translate(Math.floor(e.x + e.w/2), Math.floor(e.y + e.h)); ctx.scale(e.facing, 1);
            const bob = Math.abs(e.vx) > 0.1 ? Math.sin(Date.now()/100)*2 : 0; ctx.translate(0, bob);

            const champion = ['sorcerer','sukuna'].includes(e.type);
            const shadowMonarch = e.type === 'sungjinwo';
            if (['sorcerer','sukuna','naruto','madara', 'itachi', 'sungjinwo'].includes(e.type)) {
                ctx.shadowBlur = champion ? 28 : 20;
                ctx.shadowColor = e.color;
                ctx.globalAlpha = champion ? 0.4 : 0.28;
                ctx.beginPath();
                ctx.ellipse(0, -e.h/2, e.w/1.35, e.h/1.4, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            if (shadowMonarch) {
                ctx.globalAlpha = 0.26;
                ctx.fillStyle = '#7c3aed';
                ctx.beginPath();
                ctx.arc(0, -40, 22, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.beginPath(); ctx.ellipse(0, 0, e.w/2, 5, 0, 0, Math.PI*2); ctx.fill();

            drawHumanoid(e);

            if (e.state === 'BLOCK') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(15, -30, 20, -Math.PI/4, Math.PI/4); ctx.stroke(); }
            if (e.stun > 0) { ctx.fillStyle = '#fbbf24'; ctx.font = '20px serif'; ctx.fillText("💫", -10, -e.h - 20); }

            ctx.scale(e.facing, 1); ctx.fillStyle = '#000'; ctx.fillRect(-15, -e.h - 15, 30, 4);
            ctx.fillStyle = e.team === 'blue' ? '#3b82f6' : '#ef4444'; ctx.fillRect(-15, -e.h - 15, 30 * (e.hp/e.maxHp), 4);
            ctx.restore();
        }

        function drawHumanoid(e) {
            const t = e.type;

            ctx.fillStyle = '#0f172a';
            if(t==='luffy') ctx.fillStyle='#3b82f6'; if(t==='naruto') ctx.fillStyle='#f97316'; if(t==='sanji') ctx.fillStyle='#000'; if(t==='gon') ctx.fillStyle='#16a34a';
            ctx.fillRect(-10, -25, 8, 25); ctx.fillRect(2, -25, 8, 25);

            ctx.fillStyle = e.color;
            if(t==='sorcerer') ctx.fillStyle='#1e1b4b';
            if(t==='sukuna') ctx.fillStyle='#fefce8';
            if(t==='luffy') ctx.fillStyle='#ef4444';
            if(t==='zoro') ctx.fillStyle='#15803d';
            if(t==='sanji') ctx.fillStyle='#1e293b';
            if(t==='itachi') ctx.fillStyle='#000';
            ctx.fillRect(-12, -55, 24, 30);

            if(t==='sorcerer') { ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(-12,-46,24,4); }
            if(t==='sukuna') { ctx.fillStyle='#1e1b4b'; ctx.fillRect(-12,-40,24,8); ctx.fillStyle='#ef4444'; ctx.fillRect(-8,-53,3,16); ctx.fillRect(5,-53,3,16); }
            if(t==='naruto') { ctx.fillStyle='#000'; ctx.fillRect(-12,-45,24,10); }
            if(t==='itachi') { ctx.fillStyle='#b91c1c'; ctx.beginPath(); ctx.arc(0,-45,5,0,Math.PI*2); ctx.fill(); }
            if(t==='ben10') { ctx.fillStyle='#000'; ctx.fillRect(-4,-50,8,10); }
            if(t==='venom') {
                ctx.fillStyle='#f8fafc';
                ctx.beginPath();
                ctx.moveTo(0,-53); ctx.lineTo(-10,-43); ctx.lineTo(-4,-35); ctx.lineTo(0,-40); ctx.lineTo(4,-35); ctx.lineTo(10,-43);
                ctx.closePath(); ctx.fill();
            }

            ctx.fillStyle = '#ffedd5';
            if(t==='venom') ctx.fillStyle='#000';
            if(t==='pain') ctx.fillStyle='#ffedd5';
            ctx.beginPath(); ctx.arc(0, -62, 10, 0, Math.PI*2); ctx.fill();

            if(t==='sorcerer') {
                ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-65,13,Math.PI,0); ctx.fill();
                ctx.fillStyle='#9cdcff'; ctx.fillRect(-9,-63,18,3);
            }
            else if(t==='sukuna') { ctx.fillStyle='#db2777'; ctx.beginPath(); ctx.moveTo(-12,-66); ctx.lineTo(0,-80); ctx.lineTo(12,-66); ctx.fill(); }
            else if(t==='naruto' || t==='sanji') { ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(0,-65,12,Math.PI,0); ctx.fill(); }
            else if(t==='zoro') { ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.arc(0,-65,11,Math.PI,0); ctx.fill(); }
            else if(t==='sasuke' || t==='madara' || t==='itachi') { ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,-65,13,Math.PI,0); ctx.fill(); }
            else if(t==='gon') { ctx.fillStyle='#000'; ctx.beginPath(); ctx.moveTo(-10,-65); ctx.lineTo(0,-90); ctx.lineTo(10,-65); ctx.fill(); }
            else if(t==='killua') { ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(0,-65,13,Math.PI,0); ctx.fill(); }
            else if(t==='pain') { ctx.fillStyle='#f97316'; ctx.beginPath(); ctx.arc(0,-65,12,Math.PI,0); ctx.fill(); }
            else if(t==='obito') { ctx.fillStyle='#f97316'; ctx.beginPath(); ctx.arc(0,-62,10,0,Math.PI*2); ctx.fill(); }
            else if(t==='venom') {
                ctx.fillStyle='#fff';
                ctx.beginPath(); ctx.moveTo(-8,-64); ctx.lineTo(-12,-57); ctx.lineTo(-3,-59); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(8,-64); ctx.lineTo(12,-57); ctx.lineTo(3,-59); ctx.closePath(); ctx.fill();
            }
            else if(t==='sungjinwo') {
                ctx.fillStyle='#a855f7'; ctx.beginPath(); ctx.arc(0,-65,13,Math.PI,0); ctx.fill();
            }

            ctx.fillStyle = e.color;
            if(t==='sukuna') ctx.fillStyle='#fefce8';
            if (e.state === 'ATTACK' || e.state === 'CAST') {
                ctx.save(); ctx.translate(10, -50); ctx.rotate(-Math.PI/4); ctx.fillRect(0, 0, 18, 6);
                if(t==='zoro' || t==='sasuke') { ctx.fillStyle='#cbd5e1'; ctx.fillRect(10,-2,30,4); }
                ctx.restore();
            } else { ctx.fillRect(10, -50, 6, 20); }

            if (['sorcerer','sukuna','itachi','killua'].includes(t)) {
                ctx.fillStyle = t === 'sukuna' ? '#ff7b9b' : t === 'killua' ? '#c4b5fd' : '#8ecfff';
                ctx.beginPath();
                ctx.arc(-4, -62, 1.5, 0, Math.PI * 2);
                ctx.arc(4, -62, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateHUD() {
            let bHp=0, bMax=0, rHp=0, rMax=0;
            entities.forEach(e => {
                if (e.isSummon) return;
                if (e.team === 'blue') { bHp+=Math.max(0,e.hp); bMax+=e.maxHp; }
                else { rHp+=Math.max(0,e.hp); rMax+=e.maxHp; }
            });
            document.getElementById('bar-blue').style.width = `${bMax>0?(bHp/bMax)*100:0}%`;
            document.getElementById('bar-red').style.width = `${rMax>0?(rHp/rMax)*100:0}%`;
            document.getElementById('hp-val-blue').innerText = Math.ceil(bHp);
            document.getElementById('hp-val-red').innerText = Math.ceil(rHp);
        }

        function checkWinCondition() {
            const bAlive = entities.some(e => e.team === 'blue' && e.hp > 0 && !e.isSummon);
            const rAlive = entities.some(e => e.team === 'red' && e.hp > 0 && !e.isSummon);
            if (!bAlive || !rAlive) {
                gameActive = false;
                audio.stopLoop();
                const rs = document.getElementById('result-screen'), rt = document.getElementById('result-title'), rm = document.getElementById('result-msg');
                rs.classList.remove('hidden'); rs.classList.add('flex');
                if (!bAlive && !rAlive) { rt.innerText = "DRAW"; rt.style.color = '#ffffff'; rt.style.textShadow = '0 0 24px rgba(255,255,255,0.42)'; rm.innerText = "MUTUAL DESTRUCTION"; audio.play('victory', { cooldown: 200, volume: 0.62 }); showReactionGif('finish', 'Draw Clash', 2600); }
                else if (bAlive) { rt.innerText = "ALLIES WIN"; rt.style.color = '#69c3ff'; rt.style.textShadow = '0 0 24px rgba(59,130,246,0.72)'; rm.innerText = "THE STRONGEST PREVAIL"; audio.play('victory', { cooldown: 200, volume: 0.75 }); showReactionGif('finish', 'Allies Win', 2600); }
                else { rt.innerText = "ENEMIES WIN"; rt.style.color = '#ff7b93'; rt.style.textShadow = '0 0 24px rgba(239,68,68,0.72)'; rm.innerText = "THE AGE OF CURSES"; audio.play('defeat', { cooldown: 200, volume: 0.7 }); showReactionGif('finish', 'Enemies Win', 2600); }
            }
        }

        function restartGame() { document.getElementById('result-screen').classList.add('hidden'); startGame(); }
        function toMenu() {
            gameActive = false; isPaused = false;
            audio.stopLoop();
            document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('pause-screen').classList.remove('flex');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').style.opacity = '0'; document.getElementById('game-screen').style.pointerEvents = 'none';
            document.getElementById('setup-screen').style.opacity = '1'; document.getElementById('setup-screen').style.pointerEvents = 'auto';
        }
        function toggleAudio() {
            const isOn = audio.toggle();
            if (isOn && gameActive && !isPaused) audio.startLoop('bgm');
            document.getElementById('btn-audio').innerText = isOn ? '🔊' : '🔇';
        }

        document.getElementById('info-screen').classList.add('hidden');
        initSetup();
    </script>
</body>
</html>
