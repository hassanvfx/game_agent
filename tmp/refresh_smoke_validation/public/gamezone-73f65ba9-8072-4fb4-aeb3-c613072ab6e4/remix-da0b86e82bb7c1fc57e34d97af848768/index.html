<div id="setup-screen" class="screen setup-screen"><header class="marquee safe"><div class="topbar"><div style="width:44px"></div><div class="logo"><h1>WORLD <span>CIRCUIT</span><br>RIVALS</h1><p class="sub">portrait arcade auto-duel tournament</p></div><button onclick="toggleInfo()" class="icon-btn" aria-label="Open move cards">?</button></div></header><main class="roster-scroll"><section class="panel team-panel blue"><div class="team-head"><span class="blue">▶ CORNER A: CHALLENGERS</span><span id="total-blue" class="team-total">0/15</span></div><div id="blue-roster" class="roster-grid"></div></section><section class="panel team-panel red"><div class="team-head"><span class="red">CORNER B: RIVALS ◀</span><span id="total-red" class="team-total">0/15</span></div><div id="red-roster" class="roster-grid"></div></section><section class="panel control-panel"><div class="control-row"><span>ROUND DURABILITY</span><strong id="disp-hp">NORMAL</strong></div><div class="slider-wrap"><input type="range" id="input-hp" min="0" max="6" value="0" step="1" oninput="updateHpDisplay(this.value)"></div></section></main><footer class="footer safe"><button id="start-btn" onclick="startGame()" class="launch" disabled>FIGHT!</button></footer></div>

class BeepAudio{constructor(){this.ctx=null;this.enabled=true;this.loop=null}init(){if(this.ctx)return;const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}async unlock(){this.init();if(this.ctx&&this.ctx.state==='suspended')await this.ctx.resume();return !!this.ctx}tone(f=220,d=.07,type='square',v=.08){if(!this.enabled||!this.ctx)return;try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);o.stop(this.ctx.currentTime+d+.02)}catch(e){}}play(name){const m={uiClick:[520,.04,'square',.05],start:[196,.12,'sawtooth',.09],pause:[160,.08,'triangle',.06],resume:[360,.08,'triangle',.06],blocked:[90,.1,'square',.07],hit:[120,.045,'square',.06],magic:[620,.09,'sine',.06],burst:[70,.16,'sawtooth',.1],power:[260,.14,'triangle',.08],warning:[880,.08,'square',.06],victory:[660,.14,'triangle',.09],defeat:[80,.25,'sawtooth',.09],slash:[420,.05,'sawtooth',.07]};this.tone(...(m[name]||m.uiClick))}startLoop(){if(!this.enabled||this.loop||!this.ctx)return;this.loop=setInterval(()=>{this.tone(98,.05,'triangle',.025);setTimeout(()=>this.tone(147,.04,'triangle',.018),170)},520)}stopLoop(){clearInterval(this.loop);this.loop=null}toggle(){this.enabled=!this.enabled;if(!this.enabled)this.stopLoop();return this.enabled}prime(){}}
const audio=new BeepAudio(), TIMERS={};function showReactionGif(k,label,d=1400){const el=document.getElementById(`reaction-${k}`);if(!el)return;el.textContent=label||el.textContent;clearTimeout(TIMERS[k]);el.classList.add('active');TIMERS[k]=setTimeout(()=>el.classList.remove('active'),d)}
const UNITS={sorcerer:{name:'White Gi Legend',klass:'FOCUS',icon:'🥋',hp:99999,spd:3.5,pwr:150,cost:10,color:'#16c8ff',iq:1,desc:'Perfect spacing. Vacuum Palm, Meteor Fireball, full-screen focus trap.'},sukuna:{name:'Crimson Emperor',klass:'BOSS',icon:'👑',hp:99999,spd:3.5,pwr:150,cost:10,color:'#ff3d5a',iq:1,desc:'Final boss pressure. World Cut, Inferno Nuke, arena control.'},venom:{name:'Grapple Brute',klass:'GRAB',icon:'💪',hp:65000,spd:2.8,pwr:75,cost:6,color:'#22131f',iq:1,desc:'Command grab archetype with lifesteal bite and rage armor.'},ben10:{name:'Style Switcher',klass:'STANCE',icon:'⌚',hp:60000,spd:3,pwr:80,cost:6,color:'#22c55e',iq:1,desc:'Stance-change hero. Screen stun and multi-style power burst.'},sanji:{name:'Flame Kicker',klass:'RUSH',icon:'🦶',hp:55000,spd:4.5,pwr:70,cost:5,color:'#facc15',iq:1,desc:'Fast rushdown feet, airborne dive pressure, flaming launcher.'},zoro:{name:'Blade Rival',klass:'ZONER',icon:'⚔️',hp:60000,spd:3.2,pwr:85,cost:6,color:'#18a957',iq:1,desc:'Weapon specialist. Long slash waves and footsie punishment.'},naruto:{name:'Clone Prodigy',klass:'SWARM',icon:'🌪️',hp:70000,spd:3.5,pwr:80,cost:7,color:'#f97316',iq:1,desc:'Shadow doubles and spinning projectile pressure.'},sasuke:{name:'Lightning Duelist',klass:'DASH',icon:'⚡',hp:68000,spd:3.8,pwr:80,cost:7,color:'#8b5cf6',iq:1,desc:'Teleport dash-in, electric pierce and whiff punish speed.'},itachi:{name:'Mind Game Master',klass:'TRAP',icon:'👁️',hp:50000,spd:3.5,pwr:90,cost:6,color:'#b91c1c',iq:1,desc:'Illusion super, delayed flame traps, high IQ punish.'},pain:{name:'Ring Controller',klass:'WALL',icon:'◎',hp:65000,spd:2.5,pwr:95,cost:7,color:'#ff8a23',iq:1,desc:'Pushback shockwave and arena control.'},obito:{name:'Phase Boxer',klass:'EVADE',icon:'🎭',hp:60000,spd:3,pwr:75,cost:6,color:'#6d28d9',iq:1,desc:'Phasing defense and tricky invulnerable slips.'},madara:{name:'Meteor Champ',klass:'SUPER',icon:'☄️',hp:80000,spd:3.2,pwr:100,cost:8,color:'#8b111a',iq:1,desc:'One-time meteor super that punishes the whole side.'},gon:{name:'One Punch Kid',klass:'CHARGE',icon:'👊',hp:60000,spd:4,pwr:120,cost:7,color:'#16a34a',iq:.8,desc:'Slow charge, terrifying close-range haymaker.'},killua:{name:'Spark Assassin',klass:'STUN',icon:'✦',hp:55000,spd:5,pwr:70,cost:6,color:'#c4b5fd',iq:1,desc:'Fastest footwork, stun lock and lightning jab.'},yuji:{name:'Black Flash Rookie',klass:'COMBO',icon:'🐯',hp:25000,spd:2.5,pwr:40,cost:4,color:'#f59e0b',iq:1,desc:'Cheap combo starter with explosive critical rhythm.'},sungjinwo:{name:'Shadow Coach',klass:'SUMMON',icon:'♟',hp:50000,spd:3,pwr:70,cost:5,color:'#7c3aed',iq:1,desc:'Calls rookie assists while keeping tournament pressure.'},luffy:{name:'Rubber Trickster',klass:'MIX',icon:'🎈',hp:55000,spd:2.8,pwr:60,cost:5,color:'#ef4444',iq:1,desc:'Bouncy mixup specialist with unreadable movement.'},wukong:{name:'Immortal Monkey',klass:'REVIVE',icon:'🐵',hp:60000,spd:3,pwr:65,cost:5,color:'#eab308',iq:1,desc:'Revives once and keeps scrapping.'}};
const TEAM_LIMIT=15;let teams={blue:{},red:{}};['blue','red'].forEach(t=>Object.keys(UNITS).forEach(k=>teams[t][k]=0));teams.blue.sorcerer=1;teams.red.sukuna=1;let hpMult=1,canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false}),width,height,shake=0,freezeFrames=0,gameActive=false,isPaused=false,entities=[],particles=[],domain=null;function resize(){width=canvas.width=innerWidth;height=canvas.height=innerHeight}addEventListener('resize',resize);resize();
function initSetup(){renderRoster('blue');renderRoster('red');updateCounts();renderInfo()}function renderRoster(team){const c=document.getElementById(`${team}-roster`);c.innerHTML='';Object.keys(UNITS).forEach(k=>{const u=UNITS[k],d=document.createElement('div');d.className='card';d.id=`card-${team}-${k}`;d.dataset.class=u.klass;d.innerHTML=`<div class="icon">${u.icon}</div><div class="name ${team}">${u.name}</div><div class="controls"><button class="count-btn" onclick="modUnit('${team}','${k}',-1)" aria-label="Remove ${u.name}">−</button><span id="count-${team}-${k}" class="count">0</span><button class="count-btn" onclick="modUnit('${team}','${k}',1)" aria-label="Add ${u.name}">+</button></div>`;c.appendChild(d)})}function renderInfo(){const l=document.getElementById('info-list');l.innerHTML='';Object.keys(UNITS).forEach(k=>{const u=UNITS[k],d=document.createElement('div');d.className='panel archive-card';d.innerHTML=`<div class="archive-head"><div class="archive-icon">${u.icon}</div><div><h3 class="archive-name">${u.name}</h3><div class="archive-meta">${u.klass} // COST ${u.cost}</div></div></div><p class="archive-desc">${u.desc}</p>`;l.appendChild(d)})}function toggleInfo(){audio.play('uiClick');const s=document.getElementById('info-screen');s.classList.toggle('hidden');s.style.transform=s.classList.contains('hidden')?'translateY(100%)':'translateY(0)'}function modUnit(t,k,d){const tot=Object.values(teams[t]).reduce((a,b)=>a+b,0);if(d>0&&tot<TEAM_LIMIT){teams[t][k]++;audio.play('uiClick')}else if(d<0&&teams[t][k]>0){teams[t][k]--;audio.play('uiClick')}else if(d!==0)audio.play('blocked');updateCounts()}function updateCounts(){let bT=0,rT=0;['blue','red'].forEach(t=>{let tc=0;Object.keys(UNITS).forEach(k=>{const c=teams[t][k];tc+=c;document.getElementById(`count-${t}-${k}`).innerText=c;const cd=document.getElementById(`card-${t}-${k}`);if(c>0){cd.style.borderColor=t==='blue'?'rgba(22,200,255,.95)':'rgba(255,61,90,.95)';cd.style.background=t==='blue'?'linear-gradien function draw(){const time=performance.now()/1000;if(domain){if(domain.type==='VOID'){ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#111';for(let i=0;i<50;i++)ctx.fillRect(Math.random()*width,Math.random()*height,2,2)}else if(domain.type==='SHRINE'){ctx.fillStyle='#460711';ctx.fillRect(0,0,width,height)}else{ctx.fillStyle='#050005';ctx.fillRect(0,0,width,height);ctx.fillStyle='#a20e23';ctx.fillRect(0,0,width,height/2);ctx.globalAlpha=.5}}else{let sky=ctx.createLinearGradient(0,0,0,height);sky.addColorStop(0,'#2a0912');sky.addColorStop(.45,'#12040a');sky.addColorStop(1,'#050102');ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);for(let r=0;r<3;r++){ctx.fillStyle=r===0?'rgba(255,209,102,.18)':r===1?'rgba(22,200,255,.1)':'rgba(255,61,90,.1)';for(let i=0;i<12;i++){let x=(i*90+(time*18*(r+1)))%(width+100)-50;ctx.fillRect(x,height*.16+r*38,34,10)}}ctx.fillStyle='rgba(255,244,190,.16)';for(let i=0;i<width;i+=36){ctx.fillRect(i+Math.sin(time+i)*4,height-170,18,80)}ctx.strokeStyle='rgba(255,209,102,.22)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<width;i+=50){ctx.moveTo(i,height-82);ctx.lineTo(width/2,height-210)}ctx.stroke();ctx.fillStyle='#2b1115';ctx.fillRect(0,height-80,width,80);ctx.strokeStyle='#ffd166';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,height-80);ctx.lineTo(width,height-80);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.14)';for(let x=0;x<width;x+=40){ctx.beginPath();ctx.moveTo(x,height-80);ctx.lineTo(x+28,height);ctx.stroke()}}ctx.globalAlpha=1;ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);entities.sort((a,b)=>a.y-b.y);entities.forEach(e=>{if(e.hp>0)drawEntity(e)});particles.forEach(p=>{if(p.type==='projectile'){p.x+=p.vx;p.y+=p.vy;p.life-=.02;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();entities.forEach(e=>{if(e.team!==p.owner.team&&Math.abs(e.x+e.w/2-p.x)<p.size+e.w/2&&Math.abs(e.y+e.h/2-p.y)<50){dealDamage(p.owner,e,1,'MAGIC');if(!p.pierce)p.life=0}})}else{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}});ctx.restore();updateHUD()}function drawEntity(e){ctx.save();ctx.translate(Math.floor(e.x+e.w/2),Math.floor(e.y+e.h));ctx.scale(e.facing,1);const bob=Math.abs(e.vx)>.1?Math.sin(Date.now()/100)*2:0;ctx.translate(0,bob);ctx.fillStyle='rgba(0,0,0,.48)';ctx.beginPath();ctx.ellipse(0,0,e.w/1.3,6,0,0,Math.PI*2);ctx.fill();if(['sorcerer','sukuna','naruto','madara','itachi','sungjinwo'].includes(e.type)){ctx.globalAlpha=.25;ctx.fillStyle=e.color;ctx.beginPath();ctx.ellipse(0,-32,e.w,e.h*.65,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}drawFighter(e);if(e.state==='BLOCK'){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(15,-30,20,-Math.PI/4,Math.PI/4);ctx.stroke()}if(e.stun>0){ctx.fillStyle='#fbbf24';ctx.font='20px serif';ctx.fillText('★',-8,-e.h-20)}ctx.scale(e.facing,1);ctx.fillStyle='#060102';ctx.fillRect(-16,-e.h-15,32,5);ctx.fillStyle=e.team==='blue'?'#16c8ff':'#ff3d5a';ctx.fillRect(-16,-e.h-15,32*Math.max(0,e.hp/e.maxHp),5);ctx.restore()}function drawFighter(e){const t=e.type;ctx.fillStyle=t==='sukuna'?'#fff3d7':e.color;ctx.fillRect(-12,-55,24,30);ctx.fillStyle=t==='venom'?'#111':'#f5c7a0';ctx.beginPath();ctx.arc(0,-62,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171018';ctx.fillRect(-10,-25,8,25);ctx.fillRect(2,-25,8,25);ctx.fillStyle=e.team==='blue'?'#16c8ff':'#ff3d5a';if(t==='sorcerer'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-67,13,Math.PI,0);ctx.fill();ctx.fillStyle='#16c8ff';ctx.fillRect(-10,-63,20,3)}else if(t==='sukuna'){ctx.fillStyle='#ff3d5a';ctx.beginPath();ctx.moveTo(-13,-66);ctx.lineTo(0,-82);ctx.lineTo(13,-66);ctx.fill()}else if(t==='gon'){ctx.fillStyle='#111';ctx.beginPath();ctx.moveTo(-10,-65);ctx.lineTo(0,-90);ctx.lineTo(10,-65);ctx.fill()}else if(t==='venom'){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-8,-64);ctx.lineTo(-12,-57);ctx.lineTo(-3,-59);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,-64);ctx.lineTo(12,-57);ctx.lineTo(3,-59);ctx.closePath();ctx.fill()}else{ctx.beginPath();ctx.arc(0,-65,12,Math.PI,0);ctx.fill()}ctx.fillStyle=e.color;if(e.state==='ATTACK'||e.state==='CAST'){ctx.save();ctx.translate(10,-50);ctx.rotate(-Math.PI/4);ctx.fillRect(0,0,20,6);if(t==='zoro'||t==='sasuke'){ctx.fillStyle='#e5e7eb';ctx.fillRect(10,-2,32,4)}ctx.restore()}else ctx.fillRect(10,-50,6,20)}function updateHUD(){let bHp=0,bMax=0,rHp=0,rMax=0;entities.forEach(e=>{if(e.isSummon)return;if(e.team==='blue'){bHp+=Math.max(0,e.hp);bMax+=e.maxHp}else{rHp+=Math.max(0,e.hp);rMax+=e.maxHp}});document.getElementById('bar-blue').style.width=`${bMax>0?bHp/bMax*100:0}%`;document.getElementById('bar-red').style.width=`${rMax>0?rHp/rMax*100:0}%`;document.getElementById('hp-val-blue').innerText=Math.ceil(bHp);document.getElementById('hp-val-red').innerText=Math.ceil(rHp)}function checkWinCondition(){const bAlive=entities.some(e=>e.team==='blue'&&e.hp>0&&!e.isSummon),rAlive=entities.some(e=>e.team==='red'&&e.hp>0&&!e.isSummon);if(!bAlive||!rAlive){gameActive=false;audio.stopLoop();const rs=document.getElementById('result-screen'),rt=document.getElementById('result-title'),rm=document.getElementById('result-msg');rs.classList.remove('hidden');rs.classList.add('flex');if(!bAlive&&!rAlive){rt.innerText='DOUBLE KO';rt.style.color='#fff';rm.innerText='THE CROWD ERUPTS FOR A DRAW';audio.play('victory');showReactionGif('finish','DOUBLE KO!',2600)}else if(bAlive){rt.innerText='CHALLENGERS WIN';rt.style.color='#86e9ff';rm.innerText='CORNER A OWNS THE WORLD CIRCUIT';audio.play('victory');showReactionGif('finish','KO!',2600)}else{rt.innerText='RIVALS WIN';rt.style.color='#ff9cac';rm.innerText='CORNER B STEALS THE TROPHY';audio.play('defeat');showReactionGif('finish','KO!',2600)}}}function restartGame(){document.getElementById('result-screen').classList.add('hidden');document.getElementById('result-screen').classList.remove('flex');startGame()}function toMenu(){gameActive=false;isPaused=false;audio.stopLoop();document.getElementById('pause-screen').classList.add('hidden');document.getElementById('pause-screen').classList.remove('flex');document.getElementById('result-screen').classList.add('hidden');document.getElementById('game-screen').style.opacity='0';document.getElementById('game-screen').style.pointerEvents='none';document.getElementById('setup-screen').style.opacity='1';document.getElementById('setup-screen').style.pointerEvents='auto'}function toggleAudio(){const on=audio.toggle();if(on&&gameActive&&!isPaused)audio.startLoop();document.getElementById('btn-audio').innerText=on?'🔊':'🔇'}document.getElementById('info-screen').classList.add('hidden');initSetup();window.__qa={startGame,modUnit,teams,entities:()=>entities,forceOneShot:()=>{updateHpDisplay(6);document.getElementById('input-hp').value=6}};
</script>
