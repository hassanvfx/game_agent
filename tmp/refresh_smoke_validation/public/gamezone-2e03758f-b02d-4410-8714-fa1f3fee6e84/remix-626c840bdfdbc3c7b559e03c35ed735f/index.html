<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Orbital Shield: Meteor Watch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&family=VT323&display=swap');

        :root {
            --primary: #5df6ff;
            --primary-strong: #96ff9d;
            --danger: #ff6b8f;
            --danger-strong: #ff926b;
            --bg-color: #050816;
            --bg-deep: #02030a;
            --panel: rgba(7, 14, 32, 0.78);
            --panel-border: rgba(93, 246, 255, 0.45);
            --text-main: #e8fbff;
            --text-dim: rgba(200, 236, 255, 0.72);
            --warning: #ffd86b;
            --shadow-glow: 0 0 18px rgba(93, 246, 255, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 82%, rgba(93, 246, 255, 0.12), transparent 28%),
                radial-gradient(circle at 50% 12%, rgba(150, 255, 157, 0.08), transparent 22%),
                linear-gradient(180deg, #091127 0%, var(--bg-color) 45%, var(--bg-deep) 100%);
            touch-action: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        canvas {
            display: block;
        }

        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .left-0 { left: 0; }
        .right-0 { right: 0; }
        .top-1\/4 { top: 25%; }
        .z-0 { z-index: 0; }
        .z-20 { z-index: 20; }
        .z-30 { z-index: 30; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-right { text-align: right; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .w-full { width: 100%; }
        .max-w-sm { max-width: 24rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-4 { padding-bottom: 1rem; }
        .pb-safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pt-safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pl-4 { padding-left: 1rem; }
        .pr-4 { padding-right: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .border { border: 1px solid currentColor; }
        .border-l-0 { border-left-width: 0; }
        .border-r-0 { border-right-width: 0; }
        .border-t-0 { border-top-width: 0; }
        .border-b-0 { border-bottom-width: 0; }
        .border-l-2 { border-left-width: 2px; }
        .border-b { border-bottom: 1px solid; }
        .border-r { border-right: 1px solid; }
        .rounded-bl-lg { border-bottom-left-radius: 0.5rem; }
        .rounded-br-lg { border-bottom-right-radius: 0.5rem; }
        .rounded-t-lg { border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; }
        .leading-none { line-height: 1; }
        .transform { transform: translateZ(0); }
        .transition-all { transition: all 0.2s ease; }
        .text-\[10px\] { font-size: 10px; line-height: 1.2; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'VT323', monospace; }
        .tracking-widest { letter-spacing: 0.22em; }
        .tracking-\[0\.5em\] { letter-spacing: 0.5em; }
        .opacity-60 { opacity: 0.6; }
        .opacity-70 { opacity: 0.7; }
        .text-white { color: #fff; }
        .text-amber-400 { color: #fbbf24; }
        .text-amber-500 { color: #f59e0b; }
        .text-amber-700 { color: #b45309; }
        .text-amber-900 { color: #78350f; }
        .text-green-400 { color: #4ade80; }
        .text-green-500 { color: #22c55e; }
        .text-red-400 { color: #f87171; }
        .text-red-500 { color: #ef4444; }
        .border-amber-500\/30 { border-color: rgba(245, 158, 11, 0.3); }
        .border-amber-900 { border-color: #78350f; }
        .border-green-500\/50 { border-color: rgba(34, 197, 94, 0.5); }
        .border-amber-500\/50 { border-color: rgba(245, 158, 11, 0.5); }
        .border-red-500\/50 { border-color: rgba(239, 68, 68, 0.5); }
        .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
        .border-white\/20 { border-color: rgba(255, 255, 255, 0.2); }
        .border-white\/30 { border-color: rgba(255, 255, 255, 0.3); }
        .bg-white\/10 { background: rgba(255, 255, 255, 0.1); }
        .hover\:bg-green-900\/20:hover { background: rgba(20, 83, 45, 0.2); }
        .hover\:bg-amber-900\/20:hover { background: rgba(120, 53, 15, 0.2); }
        .hover\:bg-red-900\/20:hover { background: rgba(127, 29, 29, 0.2); }
        .hover\:bg-white\/10:hover { background: rgba(255, 255, 255, 0.1); }
        .drop-shadow-lg { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.35)); }
        .drop-shadow-\[0_0_10px_rgba\(255\,255\,255\,0\.5\)\] { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .w-full.h-px { height: 1px; }

        @keyframes pulse {
            50% { opacity: 0.5; }
        }

        .title-font { font-family: 'Audiowide', system-ui, sans-serif; }
        .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
        .text-amber-400\/70 { color: rgba(255, 216, 107, 0.7); }
        .text-amber-500\/60 { color: rgba(93, 246, 255, 0.6); }

        /* CRT Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(5,10,22,0.22) 50%,
                rgba(5,10,22,0.22)
            );
            background-size: 100% 4px;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 78%, transparent 18%, rgba(1, 3, 10, 0.28) 46%, rgba(0, 0, 0, 0.88) 100%),
                radial-gradient(circle at 50% 16%, rgba(93, 246, 255, 0.1), transparent 18%);
            pointer-events: none;
            z-index: 11;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            position: absolute;
            inset: 0;
            background: rgba(93, 246, 255, 0.025);
            z-index: 12;
            opacity: 0.45;
        }

        @keyframes flicker {
            0% { opacity: 0.5; }
            50% { opacity: 0.3; }
            100% { opacity: 0.5; }
        }

        /* UI Components */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 30, 58, 0.92), rgba(6, 12, 28, 0.92)),
                var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-glow), inset 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(7px);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 35%, transparent 70%, rgba(93,246,255,0.08));
            pointer-events: none;
        }

        .btn-tactical {
            background: linear-gradient(180deg, rgba(93, 246, 255, 0.14), rgba(93, 246, 255, 0.05));
            border: 1px solid rgba(93, 246, 255, 0.55);
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
            position: relative;
            box-shadow: 0 0 14px rgba(93, 246, 255, 0.12);
            text-shadow: 0 0 10px rgba(93, 246, 255, 0.3);
        }

        .btn-tactical:hover {
            background: linear-gradient(180deg, rgba(150, 255, 157, 0.18), rgba(93, 246, 255, 0.08));
            box-shadow: 0 0 20px rgba(150, 255, 157, 0.22);
        }

        .btn-tactical:active {
            background: linear-gradient(180deg, rgba(150, 255, 157, 0.72), rgba(93, 246, 255, 0.72));
            color: #031018;
            transform: scale(0.98);
        }

        /* HUD */
        .hud-text {
            text-shadow: 0 0 8px rgba(93, 246, 255, 0.65);
        }

        .hud-stat-label {
            color: var(--text-dim);
            letter-spacing: 0.26em;
        }

        .radar-reticle {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            opacity: 0.34;
            background:
                radial-gradient(circle at 50% 78%, rgba(93,246,255,0.18), transparent 0 12%, rgba(93,246,255,0.04) 13%, transparent 15%),
                repeating-linear-gradient(90deg, transparent 0 11%, rgba(93,246,255,0.05) 11.5% 12%),
                linear-gradient(180deg, transparent 0%, rgba(93,246,255,0.05) 100%);
        }

        .feedback-bay {
            position: absolute;
            right: 1rem;
            bottom: max(5.5rem, env(safe-area-inset-bottom) + 4rem);
            width: min(26vw, 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 21;
            pointer-events: none;
        }

        .reaction-gif {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 0.9rem;
            border: 1px solid rgba(93, 246, 255, 0.4);
            background: rgba(4, 12, 30, 0.82);
            box-shadow: 0 0 16px rgba(93, 246, 255, 0.18);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .reaction-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            min-height: 1.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            background: rgba(4, 12, 30, 0.82);
            border: 1px solid rgba(255, 216, 107, 0.24);
            color: var(--warning);
            font-family: 'VT323', monospace;
            font-size: 0.5rem;
            line-height: 1.4;
            letter-spacing: 0.12em;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 216, 107, 0.25);
        }

        @media (max-width: 640px) {
            .feedback-bay {
                right: 0.75rem;
                width: min(28vw, 96px);
                bottom: max(6rem, env(safe-area-inset-bottom) + 4.5rem);
            }

            .feedback-caption {
                font-size: 0.43rem;
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- FX Overlays -->
    <div class="radar-reticle"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="crt-flicker"></div>

    <!-- [agent-note][stage3] resolved-gif: impact/finale overlays -> catalogs/gifs.json | keep off playfield to protect controls -->
    <div class="feedback-bay" aria-live="polite">
        <img id="reaction-impact" class="reaction-gif" alt="Impact feedback animation" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" />
        <img id="reaction-finale" class="reaction-gif" alt="Final outcome reaction animation" src="https://i.giphy.com/YUacjDxhp6cYteVMVf.webp" />
        <div id="feedback-caption" class="feedback-caption ui-font">ARRAY READY</div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 pb-safe-bottom pt-safe-top">
        
        <!-- Top HUD -->
        <div id="hud-top" class="hidden flex justify-between items-start w-full">
            <div class="glass-panel px-3 py-1 rounded-bl-lg border-t-0 border-r-0">
                <div class="text-[10px] opacity-70 hud-stat-label">SCORE</div>
                <div id="score-display" class="text-2xl font-bold hud-text title-font">0</div>
            </div>
            
            <div class="glass-panel px-3 py-1 rounded-br-lg border-t-0 border-l-0 text-right">
                <div class="text-[10px] opacity-70 hud-stat-label">SHIELD</div>
                <div id="health-display" class="text-2xl font-bold text-red-500 hud-text title-font">100%</div>
            </div>
        </div>

        <!-- Center Message Area -->
        <div id="message-area" class="absolute top-1/4 left-0 right-0 text-center pointer-events-none">
            <div id="wave-text" class="hidden text-4xl font-bold text-amber-500 drop-shadow-lg animate-pulse title-font">METEOR SWARM</div>
        </div>

        <!-- Bottom HUD -->
        <div id="hud-bottom" class="hidden flex justify-center items-end w-full pb-4">
            <div class="glass-panel px-6 py-2 rounded-t-lg border-b-0">
                <div class="text-[10px] text-center opacity-70 hud-stat-label">TIME REMAINING</div>
                <div id="time-display" class="text-3xl font-bold text-center hud-text title-font">60</div>
            </div>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-layer" class="absolute inset-0 z-30 flex items-center justify-center p-6 pointer-events-none">
        
        <!-- Start Screen -->
        <div id="start-screen" class="glass-panel pointer-events-auto p-8 max-w-sm w-full text-center transform transition-all">
            <div class="mb-8 border-b border-amber-500/30 pb-4">
                <h1 class="text-5xl font-bold text-amber-500 mb-1 leading-none title-font" style="text-shadow: 0 0 14px rgba(93,246,255,0.65)">ORBITAL<br>SHIELD</h1>
                <p class="text-amber-700 text-sm tracking-[0.5em]">METEOR WATCH</p>
            </div>
            <div class="text-left text-xs text-amber-400/70 mb-8 font-mono space-y-2 border-l-2 border-amber-900 pl-4">
                <p>> ARRAY ONLINE... STABLE</p>
                <p>> TRACKER FEED... VECTOR READY</p>
                <p>> OBJECTIVE: KEEP THE COLONY SAFE</p>
            </div>
            <button id="btn-init" class="btn-tactical w-full py-4 text-xl font-bold mb-4">ARM ARRAY</button>
            <p class="text-[10px] text-amber-900">TOUCH & DRAG TO AIM // THE ARRAY FIRES AUTOMATICALLY</p>
        </div>

        <!-- Difficulty Select -->
        <div id="diff-screen" class="hidden glass-panel pointer-events-auto p-6 max-w-sm w-full text-center">
            <h2 class="text-xl font-bold mb-6 text-amber-500 tracking-widest border-b border-amber-500/30 pb-2 title-font">SELECT SHIFT</h2>
            <div class="space-y-3">
                <button onclick="game.start('easy')" class="btn-tactical w-full py-3 border-green-500/50 text-green-400 hover:bg-green-900/20">
                    WATCHKEEPER <span class="text-[10px] block opacity-60">90s / LIGHT DEBRIS</span>
                </button>
                <button onclick="game.start('normal')" class="btn-tactical w-full py-3 border-amber-500/50 text-amber-400 hover:bg-amber-900/20">
                    SENTINEL <span class="text-[10px] block opacity-60">60s / STEADY SWARM</span>
                </button>
                <button onclick="game.start('hard')" class="btn-tactical w-full py-3 border-red-500/50 text-red-400 hover:bg-red-900/20">
                    COMMAND <span class="text-[10px] block opacity-60">45s / HEAVY IMPACT</span>
                </button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="hidden glass-panel pointer-events-auto p-8 max-w-sm w-full text-center border-red-500/50">
            <h2 id="go-title" class="text-4xl font-bold mb-2 text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] title-font">SHIELD COLLAPSED</h2>
            <div class="w-full h-px bg-white/20 mb-6"></div>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="text-right border-r border-white/10 pr-4">
                    <div class="text-[10px] text-amber-500/60">SCORE</div>
                    <div id="final-score" class="text-2xl font-bold text-amber-500">0</div>
                </div>
                <div class="text-left pl-4">
                    <div class="text-[10px] text-amber-500/60">OUTCOME</div>
                    <div id="final-status" class="text-xl font-bold text-red-400">IMPACTED</div>
                </div>
            </div>
            
            <button onclick="game.showDiff()" class="btn-tactical w-full py-4 text-xl font-bold border-white/30 text-white hover:bg-white/10">RUN NEXT SHIFT</button>
        </div>

    </div>

    <script>
        /* --- Audio System --- */
        /* [agent-note][stage3] resolved-audio: gameplay loop + ui/start/fire/hit/damage/win/lose -> catalogs/audios.json */
        const AUDIO_MAP = {
            uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
            startGame: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
            shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
            hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3',
            defeat: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3',
            damage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
            warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3',
            win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
            lose: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
            bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
        };

        const AudioSys = {
            enabled: false,
            unlocked: false,
            bgm: null,
            sfxPools: {},
            init: function() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.enabled = true;
                Object.entries(AUDIO_MAP).forEach(([key, url]) => {
                    const volume = key === 'bgm' ? 0.2 : 0.42;
                    if (key === 'bgm') {
                        const loop = new Audio(url);
                        loop.loop = true;
                        loop.preload = 'auto';
                        loop.volume = volume;
                        this.bgm = loop;
                    } else {
                        this.sfxPools[key] = Array.from({ length: 3 }, () => {
                            const audio = new Audio(url);
                            audio.preload = 'auto';
                            audio.volume = volume;
                            return audio;
                        });
                    }
                });
            },
            unlock: function() {
                if (!this.unlocked) this.init();
                this.enabled = true;
            },
            playSfx: function(name) {
                if (!this.enabled || !this.sfxPools[name]) return;
                const pool = this.sfxPools[name];
                const audio = pool.find((item) => item.paused || item.ended) || pool[0];
                try {
                    audio.currentTime = 0;
                    const playPromise = audio.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {});
                    }
                } catch (_) {}
            },
            startLoop: function() {
                if (!this.enabled || !this.bgm) return;
                this.bgm.currentTime = 0;
                const playPromise = this.bgm.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            },
            stopLoop: function() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
        };

        const FxOverlay = {
            timers: {},
            show(id, caption, duration = 900) {
                const el = document.getElementById(id);
                const captionEl = document.getElementById('feedback-caption');
                if (!el || !captionEl) return;
                captionEl.textContent = caption;
                el.classList.add('is-visible');
                clearTimeout(this.timers[id]);
                this.timers[id] = setTimeout(() => {
                    el.classList.remove('is-visible');
                    if (!document.querySelector('.reaction-gif.is-visible')) {
                        captionEl.textContent = 'ARRAY READY';
                    }
                }, duration);
            }
        };

        /* --- Game Engine --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        
        // Game State
        const state = {
            screen: 'start', // start, diff, playing, over
            width: 0,
            height: 0,
            time: 0,
            score: 0,
            health: 100,
            lastTime: 0,
            touching: false,
            aimX: 0,
            aimY: 0,
            fireTimer: 0,
            spawnTimer: 0,
            difficulty: 'normal',
            shake: 0
        };

        // Entities
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Config
        const CFG = {
            fireRate: 0.15, // Seconds between shots
            bulletSpeed: 800,
            colors: {
                bg: '#050816',
                grid: '#123457',
                turret: '#5df6ff',
                turretGlow: '#96ff9d',
                enemy: '#ff6b8f',
                enemyHeavy: '#c7f2ff',
                enemyFast: '#ffd86b',
                bullet: '#96ff9d'
            }
        };

        const DIFF = {
            easy: { spawnRate: 1.2, speed: 100, time: 90 },
            normal: { spawnRate: 0.8, speed: 150, time: 60 },
            hard: { spawnRate: 0.5, speed: 220, time: 45 }
        };

        // Resize
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width;
            canvas.height = state.height;
            // Init stars
            stars = [];
            for(let i=0; i<50; i++) {
                stars.push({
                    x: Math.random() * state.width,
                    y: Math.random() * state.height,
                    s: Math.random() * 2,
                    v: 0.5 + Math.random() * 2
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input
        function updateAim(e) {
            if (state.screen !== 'playing') return;
            const t = e.touches ? e.touches[0] : e;
            state.aimX = t.clientX;
            state.aimY = t.clientY;
            state.touching = true;
        }

        window.addEventListener('pointerdown', (e) => {
            AudioSys.unlock();
            if (state.screen === 'playing') AudioSys.startLoop();
            updateAim(e);
        });
        window.addEventListener('pointermove', updateAim);
        window.addEventListener('pointerup', () => state.touching = false);
        window.addEventListener('pointercancel', () => state.touching = false);

        // Core Logic
        function spawnEnemy() {
            let size = 20 + Math.random() * 15;
            const type = Math.random();
            let hp = 1;
            let speedMult = 1;
            let color = CFG.colors.enemy;

            if (type > 0.8) { // Heavy
                hp = 3;
                size += 10;
                speedMult = 0.6;
                color = CFG.colors.enemyHeavy;
            } else if (type < 0.3) { // Fast
                size -= 5;
                speedMult = 1.5;
                color = CFG.colors.enemyFast;
            }

            enemies.push({
                x: Math.random() * (state.width - 40) + 20,
                y: -50,
                size: size,
                hp: hp,
                speed: DIFF[state.difficulty].speed * speedMult,
                color: color,
                angle: 0,
                spin: (Math.random() - 0.5) * 5
            });
        }

        function createExplosion(x, y, color, count = 10) {
            AudioSys.playSfx('defeat');
            FxOverlay.show('reaction-impact', 'DIRECT HIT', 700);
            state.shake = 5;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 0.5) * 300,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function update(dt) {
            if (state.screen !== 'playing') return;

            // Timer
            state.time -= dt;
            if (state.time <= 0) {
                endGame(true);
                return;
            }
            document.getElementById('time-display').innerText = Math.ceil(state.time);

            // Spawning
            state.spawnTimer -= dt;
            if (state.spawnTimer <= 0) {
                spawnEnemy();
                state.spawnTimer = DIFF[state.difficulty].spawnRate;
            }

            // Fire
            if (state.touching) {
                state.fireTimer -= dt;
                if (state.fireTimer <= 0) {
                    // Calculate angle
                    const tx = state.width / 2;
                    const ty = state.height - 50;
                    const angle = Math.atan2(state.aimY - ty, state.aimX - tx);
                    
                    projectiles.push({
                        x: tx,
                        y: ty,
                        vx: Math.cos(angle) * CFG.bulletSpeed,
                        vy: Math.sin(angle) * CFG.bulletSpeed,
                        life: 2.0
                    });
                    
                    AudioSys.playSfx('shoot');
                    state.fireTimer = CFG.fireRate;
                }
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                
                if (p.life <= 0 || p.x < 0 || p.x > state.width || p.y < 0) {
                    projectiles.splice(i, 1);
                    continue;
                }

                // Collision
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    const dx = p.x - e.x;
                    const dy = p.y - e.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < e.size + 5) {
                        e.hp--;
                        projectiles.splice(i, 1); // Remove bullet
                        
                        // Hit effect
                        particles.push({
                            x: p.x, y: p.y, vx: 0, vy: 0, life: 0.2, color: '#fff', size: 5
                        });

                        if (e.hp <= 0) {
                            state.score += 100;
                            document.getElementById('score-display').innerText = state.score;
                            createExplosion(e.x, e.y, e.color);
                            enemies.splice(j, 1);
                        } else {
                            AudioSys.playSfx('hit');
                        }
                        break; // Bullet hit something, stop checking enemies
                    }
                }
            }

            // Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed * dt;
                e.angle += e.spin * dt;

                if (e.y > state.height) {
                    // Breach
                    state.health -= 20;
                    state.shake = 10;
                    document.getElementById('health-display').innerText = state.health + '%';
                    AudioSys.playSfx('damage');
                    if (state.health <= 40) {
                        AudioSys.playSfx('warning');
                        FxOverlay.show('reaction-impact', 'SHIELD LOW', 900);
                    }
                    enemies.splice(i, 1);
                    
                    if (state.health <= 0) {
                        endGame(false);
                    }
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Shake decay
            if (state.shake > 0) state.shake *= 0.9;
            if (state.shake < 0.5) state.shake = 0;
        }

        function draw() {
            // Clear / Trail effect
            const skyGradient = ctx.createLinearGradient(0, 0, 0, state.height);
            skyGradient.addColorStop(0, '#081120');
            skyGradient.addColorStop(0.55, CFG.colors.bg);
            skyGradient.addColorStop(1, '#02030a');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, state.width, state.height);

            const horizonGlow = ctx.createRadialGradient(state.width / 2, state.height * 0.78, 10, state.width / 2, state.height * 0.78, state.width * 0.4);
            horizonGlow.addColorStop(0, 'rgba(93,246,255,0.18)');
            horizonGlow.addColorStop(1, 'rgba(93,246,255,0)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, state.width, state.height);

            // Shake offset
            const sx = (Math.random() - 0.5) * state.shake;
            const sy = (Math.random() - 0.5) * state.shake;
            ctx.save();
            ctx.translate(sx, sy);

            // Stars
            stars.forEach(s => {
                s.y += s.v;
                if (s.y > state.height) { s.y = 0; s.x = Math.random() * state.width; }
                ctx.fillStyle = `rgba(199, 242, 255, ${0.18 + s.s * 0.18})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s + 0.4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Grid Lines
            ctx.strokeStyle = 'rgba(48, 128, 196, 0.38)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const cx = state.width / 2;
            for (let i = -5; i <= 5; i++) {
                ctx.moveTo(cx + i * 100, state.height);
                ctx.lineTo(cx + i * 20, state.height * 0.18);
            }
            const timeOffset = (Date.now() / 10) % 100;
            for (let y = state.height * 0.18; y < state.height; y += 50) {
                let drawY = y + timeOffset;
                if (drawY > state.height) drawY = state.height * 0.18 + (drawY - state.height);
                ctx.moveTo(0, drawY);
                ctx.lineTo(state.width, drawY);
            }
            ctx.stroke();

            // Colony shield arc
            ctx.save();
            ctx.strokeStyle = 'rgba(93,246,255,0.24)';
            ctx.lineWidth = 4;
            ctx.shadowColor = CFG.colors.turret;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(state.width / 2, state.height + 120, Math.min(state.width * 0.42, 220), Math.PI * 1.1, Math.PI * 1.9);
            ctx.stroke();
            ctx.restore();

            // Turret Base
            const tx = state.width / 2;
            const ty = state.height - 50;

            if (state.touching) {
                ctx.strokeStyle = 'rgba(93, 246, 255, 0.34)';
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(state.aimX, state.aimY);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.save();
                ctx.strokeStyle = CFG.colors.turret;
                ctx.shadowColor = CFG.colors.turret;
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(state.aimX, state.aimY, 22, 0, Math.PI * 2);
                ctx.moveTo(state.aimX - 12, state.aimY); ctx.lineTo(state.aimX + 12, state.aimY);
                ctx.moveTo(state.aimX, state.aimY - 12); ctx.lineTo(state.aimX, state.aimY + 12);
                ctx.stroke();
                ctx.restore();
            }

            // Main turret / character silhouette
            const pulse = 0.92 + Math.sin(Date.now() / 180) * 0.04;
            ctx.save();
            ctx.translate(tx, ty);

            const ringGradient = ctx.createRadialGradient(0, 0, 6, 0, 0, 36);
            ringGradient.addColorStop(0, 'rgba(150,255,157,0.85)');
            ringGradient.addColorStop(0.45, 'rgba(93,246,255,0.9)');
            ringGradient.addColorStop(1, 'rgba(93,246,255,0.06)');
            ctx.fillStyle = ringGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 28 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#081624';
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = CFG.colors.turret;
            ctx.lineWidth = 3;
            ctx.shadowColor = CFG.colors.turret;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, 21, 0, Math.PI * 2);
            ctx.stroke();

            const faceBlink = 0.75 + Math.sin(Date.now() / 120) * 0.1;
            ctx.fillStyle = CFG.colors.turretGlow;
            ctx.beginPath();
            ctx.arc(-6, -2, 2.6, 0, Math.PI * 2);
            ctx.arc(6, -2, 2.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = `rgba(150,255,157,${faceBlink})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 6, 8, 0.15, Math.PI - 0.15);
            ctx.stroke();

            let angle = -Math.PI / 2;
            if (state.touching) {
                angle = Math.atan2(state.aimY - ty, state.aimX - tx);
            }
            ctx.rotate(angle);

            ctx.fillStyle = CFG.colors.turretGlow;
            ctx.beginPath();
            ctx.roundRect(2, -7, 34, 14, 5);
            ctx.fill();

            ctx.fillStyle = '#dffcff';
            ctx.beginPath();
            ctx.roundRect(16, -4, 18, 8, 4);
            ctx.fill();
            ctx.restore();

            // Projectiles
            projectiles.forEach(p => {
                ctx.save();
                ctx.fillStyle = CFG.colors.bullet;
                ctx.shadowColor = CFG.colors.bullet;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(223,252,255,0.85)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Enemies
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(e.angle);
                ctx.strokeStyle = e.color;
                ctx.lineWidth = 2.4;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 14;

                ctx.beginPath();
                if (e.color === CFG.colors.enemyHeavy) {
                    ctx.roundRect(-e.size / 2, -e.size / 2, e.size, e.size, 4);
                } else if (e.color === CFG.colors.enemyFast) {
                    ctx.moveTo(0, e.size / 2);
                    ctx.lineTo(e.size / 2, -e.size / 2);
                    ctx.lineTo(-e.size / 2, -e.size / 2);
                    ctx.closePath();
                } else {
                    const s = e.size / 2;
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s * 0.85, -s * 0.25);
                    ctx.lineTo(s * 0.55, s * 0.85);
                    ctx.lineTo(-s * 0.55, s * 0.85);
                    ctx.lineTo(-s * 0.85, -s * 0.25);
                    ctx.closePath();
                }
                ctx.stroke();

                ctx.fillStyle = e.color;
                ctx.globalAlpha = 0.22;
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(3, e.size * 0.12), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        // Loop
        function loop(timestamp) {
            const dt = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;

            if (dt < 0.1) { // Prevent huge jumps
                update(dt);
                draw();
            }

            requestAnimationFrame(loop);
        }

        // UI Logic
        const game = {
            init: function() {
                document.getElementById('btn-init').addEventListener('click', () => {
                    AudioSys.unlock();
                    AudioSys.playSfx('uiClick');
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('diff-screen').classList.remove('hidden');
                    document.getElementById('feedback-caption').textContent = 'SHIFT SELECT';
                    state.screen = 'diff';
                });
            },
            start: function(diff) {
                AudioSys.unlock();
                AudioSys.playSfx('startGame');
                AudioSys.startLoop();
                state.difficulty = diff;
                state.time = DIFF[diff].time;
                state.score = 0;
                state.health = 100;
                state.screen = 'playing';
                state.spawnTimer = 0;
                
                // Reset entities
                enemies = [];
                projectiles = [];
                particles = [];

                // UI
                document.getElementById('diff-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('hud-top').classList.remove('hidden');
                document.getElementById('hud-bottom').classList.remove('hidden');
                document.getElementById('score-display').innerText = '0';
                document.getElementById('health-display').innerText = '100%';
                document.getElementById('health-display').className = 'text-2xl font-bold text-green-500 hud-text'; // Reset color

                // Wave Text
                const waveTxt = document.getElementById('wave-text');
                waveTxt.classList.remove('hidden');
                setTimeout(() => waveTxt.classList.add('hidden'), 2000);
                document.getElementById('feedback-caption').textContent = 'ARRAY HOT';
            },
            showDiff: function() {
                AudioSys.playSfx('uiClick');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('diff-screen').classList.remove('hidden');
                document.getElementById('feedback-caption').textContent = 'SHIFT SELECT';
            }
        };

        function endGame(win) {
            state.screen = 'over';
            state.touching = false;
            AudioSys.stopLoop();
            
            document.getElementById('hud-top').classList.add('hidden');
            document.getElementById('hud-bottom').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            const title = document.getElementById('go-title');
            const status = document.getElementById('final-status');
            const score = document.getElementById('final-score');
            
            score.innerText = state.score;
            
            if (win) {
                title.innerText = "ORBIT SECURED";
                title.classList.replace('text-red-500', 'text-green-500');
                status.innerText = "COLONY SAFE";
                status.classList.replace('text-red-400', 'text-green-400');
                AudioSys.playSfx('win');
                FxOverlay.show('reaction-finale', 'COLONY SAFE', 2200);
            } else {
                title.innerText = "SHIELD COLLAPSED";
                title.classList.replace('text-green-500', 'text-red-500');
                status.innerText = "COLONY IMPACTED";
                status.classList.replace('text-green-400', 'text-red-400');
                AudioSys.playSfx('lose');
                FxOverlay.show('reaction-finale', 'IMPACTED', 2200);
            }
        }

        // Boot
        game.init();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
