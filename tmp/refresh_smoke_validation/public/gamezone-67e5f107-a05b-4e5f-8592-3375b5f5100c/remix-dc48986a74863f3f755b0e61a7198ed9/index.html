<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Harbor Deck Rescue</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #08162c;
            --sky-bottom: #0f2d4f;
            --deck-base: #724c2e;
            --deck-warm: #96633a;
            --foam: #d8fbff;
            --panel-fill: rgba(7, 23, 44, 0.72);
            --panel-stroke: rgba(157, 232, 255, 0.46);
            --panel-shadow: rgba(0, 0, 0, 0.28);
            --highlight: #83f0ff;
            --sun-gold: #ffd36b;
            --danger: #ff7b72;
            --text-main: #f6feff;
            --text-soft: rgba(246, 254, 255, 0.78);
            --font-display: 'Cinzel', serif;
            --font-ui: 'Exo 2', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(131, 240, 255, 0.18), transparent 28%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 34%, #1e4c73 58%, #0b2341 100%);
            font-family: var(--font-ui);
            color: var(--text-main);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 14% 18%, rgba(255, 211, 107, 0.18), transparent 16%),
                radial-gradient(circle at 82% 11%, rgba(131, 240, 255, 0.13), transparent 20%);
            opacity: 0.9;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), transparent 22%),
                radial-gradient(circle at 50% -8%, rgba(255,255,255,0.22), transparent 30%);
            z-index: 0;
        }
        #game-container::after {
            content: "🛟";
            position: absolute;
            right: 4.5vw;
            bottom: 12vh;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.26));
            opacity: 0.28;
            transform: rotate(-8deg);
            pointer-events: none;
            z-index: 0;
            animation: buoyBob 3.8s ease-in-out infinite;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 1; }
        
        /* [agent-note][stage2] visual-intent: harbor rescue command deck styling | scope: hud,modal,buttons */
        .organic-panel {
            position: relative;
            background: linear-gradient(180deg, rgba(11, 34, 61, 0.86), rgba(8, 24, 45, 0.78));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-stroke);
            border-radius: 18px;
            box-shadow:
                0 10px 24px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.18),
                0 0 0 1px rgba(255,255,255,0.04);
            color: var(--text-main);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .organic-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(131, 240, 255, 0.14), transparent 42%, rgba(255, 211, 107, 0.08));
        }
        .organic-btn {
            background: linear-gradient(180deg, #3db4d8, #187ea8);
            border: 1px solid rgba(216, 251, 255, 0.5);
            border-radius: 999px;
            color: white;
            font-weight: 700;
            letter-spacing: 0.08em;
            font-family: var(--font-display);
            box-shadow:
                0 8px 18px rgba(24, 126, 168, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        .organic-btn:active {
            transform: scale(0.95);
            filter: brightness(1.06);
        }
        .organic-btn:hover {
            box-shadow:
                0 10px 22px rgba(24, 126, 168, 0.52),
                inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .headline-font {
            font-family: var(--font-display);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        #hud {
            gap: 0.6rem;
        }
        #hud .organic-panel {
            min-width: 82px;
        }
        #hud .organic-panel span:first-child {
            color: var(--text-soft);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
        }
        #ui-level, #ui-time, #ui-score,
        #go-level, #go-score {
            font-family: var(--font-display);
        }
        .status-ribbon {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.55rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            background: rgba(6, 16, 32, 0.42);
            border: 1px solid rgba(216, 251, 255, 0.18);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: var(--font-ui);
            color: rgba(246, 254, 255, 0.86);
        }
        .status-ribbon .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: var(--highlight);
            box-shadow: 0 0 10px rgba(131, 240, 255, 0.9);
        }
        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(30vw, 132px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(216, 251, 255, 0.35);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
            z-index: 3;
            background: rgba(4, 14, 28, 0.4);
        }
        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        #collect-gif {
            top: 5.5rem;
        }
        #celebration-gif {
            bottom: 6.5rem;
        }
        #game-over-panel {
            max-height: min(90vh, 620px);
        }
        @keyframes buoyBob {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            50% { transform: rotate(-4deg) translateY(-10px); }
        }
        @media (max-width: 640px) {
            #ui-layer { padding: 0.85rem; }
            #hud .organic-panel {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
                border-radius: 16px;
            }
            #ui-level, #ui-score { font-size: 1.35rem !important; }
            #ui-time { font-size: 1.55rem !important; }
            #game-over-panel {
                padding: 1.35rem;
                margin: 1rem;
            }
            .feedback-gif {
                width: 92px;
                right: 0.75rem;
                border-radius: 14px;
            }
            #collect-gif {
                top: 5rem;
            }
            #celebration-gif {
                bottom: 5.5rem;
            }
            #game-over-panel h2 {
                font-size: 2rem;
            }
            #restart-btn {
                padding-top: 1rem;
                padding-bottom: 1rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<!-- Static Media Declarations -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Collect SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>

<audio id="sfx_level" data-editable="audio" data-label="Level Complete SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>

<div id="game-container" class="select-none">

        <!-- Game Over Screen -->

                <p class="text-lg mb-4 opacity-90">The rescue crew is heading back to the beacon.</p>
                <div class="status-ribbon" aria-hidden="true"><span class="dot"></span> Harbor crew ready</div>
                
                <div class="w-full bg-black/20 rounded-xl p-4 mb-8">

                        <span class="opacity-80">Shifts Cleared:</span>

                    </div>
                    <div class="flex justify-between">

<script>
/**
 * L0/L1 System Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let initialized = false;
let dpr = 1;

// Config System
window.gameConfigDefs = {};
window.gameConfig = {};
try {
    const configScript = document.getElementById('game-config');
    if (configScript) {
        window.gameConfigDefs = JSON.parse(configScript.textContent);
        for (let key in window.gameConfigDefs) {
            window.gameConfig[key] = window.gameConfigDefs[key].value;
        }
    }
} catch (e) { console.error("Config parse error", e); }

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
};

// Audio System
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let audioUnlocked = false;
const bgm = document.getElementById('bgm_main');
const audioEls = {
    collect: document.getElementById('sfx_collect'),
    clean: document.getElementById('sfx_clean'),
    level: document.getElementById('sfx_level'),
    fail: document.getElementById('sfx_fail'),
    start: document.getElementById('sfx_start')
};
const lastSfxAt = new Map();

if (bgm) {
    bgm.volume = 0.22;
    bgm.muted = true;
}
Object.values(audioEls).forEach(audio => {
    if (audio) audio.volume = 0.42;
});
if (audioEls.clean) audioEls.clean.volume = 0.18;
if (audioEls.fail) audioEls.fail.volume = 0.36;
if (audioEls.level) audioEls.level.volume = 0.4;
if (audioEls.start) audioEls.start.volume = 0.34;

function safePlayAudio(audio, { reset = true } = {}) {
    if (!audio) return;
    try {
        if (reset) audio.currentTime = 0;
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
    } catch (e) {}
}

function playSfx(type, cooldown = 0) {
    const audio = audioEls[type];
    if (!audio) return;
    const now = performance.now();
    if (cooldown > 0 && now - (lastSfxAt.get(type) || 0) < cooldown) return;
    lastSfxAt.set(type, now);
    safePlayAudio(audio);
}

function startBgm() {
    if (!bgm) return;
    bgm.muted = false;
    safePlayAudio(bgm, { reset: false });
}

function pauseBgm() {
    if (!bgm) return;
    try { bgm.pause(); } catch (e) {}
}

function unlockAudio() {
    if (audioUnlocked) return;
    try {
        if (AudioContext && !audioCtx) audioCtx = new AudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        startBgm();
        playSfx('start', 250);
        audioUnlocked = true;
    } catch (e) {}
}

function vibrate(style = 'light') {
    try {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        } else if (navigator.vibrate) {
            const pattern = style === 'heavy' ? [50, 50, 50] : style === 'medium' ? [30] : [15];
            navigator.vibrate(pattern);
        }
    } catch (e) {}
}

// State & UI System
let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
const uiHud = document.getElementById('hud');
const uiGameOver = document.getElementById('game-over-screen');
const collectGif = document.getElementById('collect-gif');
const celebrationGif = document.getElementById('celebration-gif');
let gifTimeouts = { collect: 0, celebration: 0 };

function showFeedbackGif(kind, duration = 1500) {
    const gif = kind === 'collect' ? collectGif : celebrationGif;
    if (!gif) return;
    gif.classList.add('visible');
    clearTimeout(gifTimeouts[kind]);
    gifTimeouts[kind] = setTimeout(() => gif.classList.remove('visible'), duration);
}

function setState(next) {
    gameState = next;
    if (next === 'PLAYING') {
        uiHud.style.opacity = '1';
        uiGameOver.classList.add('hidden');
        startBgm();
    } else if (next === 'GAMEOVER') {
        uiHud.style.opacity = '0';
        uiGameOver.classList.remove('hidden');
        document.getElementById('go-level').innerText = level - 1;
        document.getElementById('go-score').innerText = score;
        pauseBgm();
        vibrate('heavy');
        playSfx('fail', 200);
        showFeedbackGif('celebration', 2200);
    }
}

// Input System
const pointer = { x: -100, y: -100, down: false, lastX: -100, lastY: -100 };

function handleGlobalInput(e) {
    unlockAudio();
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    
    if (e.type === 'pointerdown') {
        pointer.down = true;
        pointer.x = px; pointer.y = py;
        pointer.lastX = px; pointer.lastY = py;
    } else if (e.type === 'pointermove') {
        pointer.x = px; pointer.y = py;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        pointer.down = false;
    }
}

/* [agent-note][stage4] repaired: modal-action-risk | element: #game-over-screen/#restart-btn | action: removed global restart on any pointerdown to preserve mobile tap actionability */
function handleRestartClick() {
    unlockAudio();
    if (gameState === 'GAMEOVER') restartGame();
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
document.getElementById('restart-btn').addEventListener('click', handleRestartClick);

// Resize Observer
const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    resize(rect.width, rect.height);
});
ro.observe(document.getElementById('game-container'));

function resize(w, h) {
    if (w === 0 || h === 0) return;
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    cw = w; ch = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initGame();
        initialized = true;
        requestAnimationFrame(gameLoop);
    } else {
        // Re-init grid on resize to prevent visual bugs
        initLevelGrid();
    }
}

/**
 * Game Logic & Entities
 */
let score = 0;
let level = 1;
let timeLeft = 60;
let lastTime = 0;

// Grid & Dirt
let grid = [];
let cols = 0, rows = 0;
const cellSize = 30;
let totalDirt = 0;
let maxDirt = 0;
let levelTransitioning = false;

// Entities
let items = [];
let particles = [];

// Visual Effects
let woodLines = [];
let foamBands = [];
let sunGlints = [];

function generateWoodTexture() {
    woodLines = [];
    foamBands = [];
    sunGlints = [];
    const numLines = Math.floor(cw / 40);
    for(let i=0; i<=numLines; i++) {
        woodLines.push(i * 40 + (Math.random() * 10 - 5));
    }
    const bandCount = Math.max(3, Math.floor(ch / 180));
    for (let i = 0; i < bandCount; i++) {
        foamBands.push({
            y: ch * (0.18 + i * 0.2) + (Math.random() * 24 - 12),
            amp: 8 + Math.random() * 10,
            width: 90 + Math.random() * 100,
            alpha: 0.08 + Math.random() * 0.08
        });
    }
    for (let i = 0; i < 5; i++) {
        sunGlints.push({
            x: cw * (0.15 + i * 0.18) + (Math.random() * 40 - 20),
            y: ch * (0.12 + Math.random() * 0.24),
            r: 20 + Math.random() * 34
        });
    }
}

function initLevelGrid() {
    cols = Math.ceil(cw / cellSize);
    rows = Math.ceil(ch / cellSize);
    grid = new Float32Array(cols * rows);
    for(let i=0; i<grid.length; i++) grid[i] = 1.0; // 1.0 = fully dirty
    maxDirt = cols * rows;
    totalDirt = maxDirt;
    generateWoodTexture();
}

function spawnItems() {
    items = [];
    const numItems = 2 + level;
    for(let i=0; i<numItems; i++) {
        items.push({
            x: 40 + Math.random() * (cw - 80),
            y: 40 + Math.random() * (ch - 80),
            type: 'shell',
            active: true,
            radius: 20,
            rot: Math.random() * Math.PI * 2,
            floatOffset: Math.random() * Math.PI * 2
        });
    }
}

function initGame() {
    if (AudioContext && !audioCtx) audioCtx = new AudioContext();
    score = 0;
    level = 1;
    timeLeft = 60;
    levelTransitioning = false;
    items = [];
    particles = [];
    
    initLevelGrid();
    spawnItems();
    updateUI();
    
    startBgm();
    setState('PLAYING');
}

function restartGame() {
    initGame();
}

function nextLevel() {
    level++;
    timeLeft += 15;
    score += 100;
    levelTransitioning = false;
    initLevelGrid();
    spawnItems();
    playSfx('level', 250);
    vibrate('medium');
    showFeedbackGif('celebration', 1800);
    updateUI();
    
    // Level up particles
    for(let i=0; i<30; i++) {
        spawnParticle(cw/2, ch/2, 'star');
    }
}

function spawnParticle(x, y, type) {
    particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * (type === 'star' ? 400 : 100),
        vy: (Math.random() - 0.5) * (type === 'star' ? 400 : 100),
        life: 1.0,
        type: type,
        size: Math.random() * 4 + 2
    });
}

function collectItem(item) {
    item.active = false;
    score += 50;
    timeLeft += 3;
    vibrate('medium');
    playSfx('collect', 120);
    showFeedbackGif('collect', 1200);
    for(let i=0; i<10; i++) spawnParticle(item.x, item.y, 'star');
    updateUI();
}

function cleanAt(x, y, dt) {
    if(!isFinite(x) || !isFinite(y)) return;
    
    const cx = Math.floor(x / cellSize);
    const cy = Math.floor(y / cellSize);
    const br = Math.max(1, Math.floor(gameConfig.brushSize / cellSize));
    const cleanPower = Math.min(gameConfig.heroSpeed, 12) * 0.5 * dt; // L0 heroSpeed constraint
    
    let cleanedSomething = false;

    for(let i = -br; i <= br; i++) {
        for(let j = -br; j <= br; j++) {
            if(i*i + j*j <= br*br) {
                const nx = cx + i;
                const ny = cy + j;
                if(nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                    const idx = ny * cols + nx;
                    if(grid[idx] > 0) {
                        grid[idx] -= cleanPower;
                        if(grid[idx] < 0) grid[idx] = 0;
                        cleanedSomething = true;
                    }
                }
            }
        }
    }

    if(cleanedSomething && Math.random() < 0.2) {
        spawnParticle(x + (Math.random()-0.5)*gameConfig.brushSize, y + (Math.random()-0.5)*gameConfig.brushSize, 'water');
        if (Math.random() < 0.08) playSfx('clean', 90);
        if(Math.random() < 0.05) vibrate('light');
    }

    // Check items
    items.forEach(item => {
        if(!item.active) return;
        const dist = Math.hypot(x - item.x, y - item.y);
        if(dist < (gameConfig.brushSize + item.radius)) {
            if(item.type === 'shell') {
                collectItem(item);
            }
        }
    });
}

function updateUI() {
    document.getElementById('ui-level').innerText = level;
    document.getElementById('ui-time').innerText = Math.ceil(timeLeft);
    document.getElementById('ui-score').innerText = score;
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Timer
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        setState('GAMEOVER');
        return;
    }
    
    // Update UI occasionally
    if (Math.random() < 0.1) updateUI();

    // Input Processing (Interpolate line for smooth wiping)
    if (pointer.down) {
        const dx = pointer.x - pointer.lastX;
        const dy = pointer.y - pointer.lastY;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.floor(dist / (gameConfig.brushSize / 3)));
        
        for(let i = 1; i <= steps; i++) {
            const ix = pointer.lastX + dx * (i / steps);
            const iy = pointer.lastY + dy * (i / steps);
            cleanAt(ix, iy, dt * 10); // scale dt to make wiping responsive
        }
        pointer.lastX = pointer.x;
        pointer.lastY = pointer.y;
    }

    // Recalculate Dirt
    totalDirt = 0;
    for(let i=0; i<grid.length; i++) totalDirt += grid[i];
    
    if (totalDirt / maxDirt < 0.05 && !levelTransitioning) {
        levelTransitioning = true;
        setTimeout(nextLevel, 500);
    }

    // Particles
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function drawWoodBackground() {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
    skyGrad.addColorStop(0, '#0b1a31');
    skyGrad.addColorStop(0.36, '#134065');
    skyGrad.addColorStop(0.65, '#2a6b89');
    skyGrad.addColorStop(1, '#5d432a');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, cw, ch);

    const sunGrad = ctx.createRadialGradient(cw * 0.78, ch * 0.18, 10, cw * 0.78, ch * 0.18, ch * 0.24);
    sunGrad.addColorStop(0, 'rgba(255, 226, 143, 0.55)');
    sunGrad.addColorStop(1, 'rgba(255, 226, 143, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, cw, ch);

    sunGlints.forEach(glint => {
        const glow = ctx.createRadialGradient(glint.x, glint.y, 0, glint.x, glint.y, glint.r);
        glow.addColorStop(0, 'rgba(255,255,255,0.12)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(glint.x, glint.y, glint.r, 0, Math.PI * 2);
        ctx.fill();
    });

    const deckTop = ch * 0.34;
    const deckGrad = ctx.createLinearGradient(0, deckTop, 0, ch);
    deckGrad.addColorStop(0, '#a06a41');
    deckGrad.addColorStop(0.4, '#875733');
    deckGrad.addColorStop(1, '#6b452c');
    ctx.fillStyle = deckGrad;
    ctx.fillRect(0, deckTop, cw, ch - deckTop);

    ctx.strokeStyle = 'rgba(78, 47, 27, 0.55)';
    ctx.lineWidth = 3;
    woodLines.forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, deckTop);
        ctx.lineTo(x, ch);
        ctx.stroke();
    });

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i < woodLines.length - 1; i++) {
        if (i % 2 === 0) {
            ctx.fillRect(woodLines[i], deckTop, Math.max(14, woodLines[i + 1] - woodLines[i]), ch - deckTop);
        }
    }

    foamBands.forEach((band, index) => {
        ctx.strokeStyle = `rgba(216, 251, 255, ${band.alpha})`;
        ctx.lineWidth = 3 + index * 0.4;
        ctx.beginPath();
        for (let x = 0; x <= cw + 20; x += 20) {
            const y = band.y + Math.sin((x / band.width) + performance.now() / 900 + index) * band.amp;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    });

    ctx.strokeStyle = 'rgba(232, 248, 255, 0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, deckTop);
    ctx.lineTo(cw, deckTop);
    ctx.stroke();
}

function drawItem(item, time) {
    ctx.save();
    const bob = Math.sin(time * 3 + item.floatOffset) * 5;
    ctx.translate(item.x, item.y + bob);
    ctx.rotate(item.rot);
    
    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;

    if (item.type === 'shell') {
        const pulse = 1 + Math.sin(time * 5 + item.floatOffset) * 0.04;
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#ff8f6b';
        ctx.beginPath();
        ctx.arc(0, 0, item.radius * 0.95, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff2c1';
        ctx.beginPath();
        ctx.arc(0, 0, item.radius * 0.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f355d';
        ctx.beginPath();
        ctx.arc(-5, -2, 3, 0, Math.PI * 2);
        ctx.arc(5, -2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 5, 8, 0.18 * Math.PI, 0.82 * Math.PI);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(-9 + i * 9, -11);
            ctx.lineTo(-13 + i * 9, -18);
            ctx.stroke();
        }

        ctx.fillStyle = '#ffd36b';
        ctx.beginPath();
        ctx.moveTo(0, -item.radius - 4);
        ctx.lineTo(4, -item.radius + 4);
        ctx.lineTo(-4, -item.radius + 4);
        ctx.closePath();
        ctx.fill();
    }
    
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, cw, ch);
    
    ctx.save();

    // 1. Clean Background (Wood)
    drawWoodBackground();

    // 2. Dirt Layer (Algae)
    const time = performance.now() / 1000;
    for(let y=0; y<rows; y++) {
        for(let x=0; x<cols; x++) {
            const val = grid[y*cols + x];
            if(val > 0) {
                ctx.globalAlpha = val;
                // Harbor grime color variations
                const hue = 170 + Math.sin(x*0.35 + y*0.45)*12;
                const lightness = 16 + Math.sin((x + y) * 0.15) * 3;
                ctx.fillStyle = `hsla(${hue}, 35%, ${lightness}%, 0.92)`;
                // Overlap cells slightly to prevent seams
                ctx.fillRect(x*cellSize - 1, y*cellSize - 1, cellSize + 2, cellSize + 2);
            }
        }
    }
    ctx.globalAlpha = 1.0;

    // 3. Items
    items.forEach(item => {
        if(item.active) drawItem(item, time);
    });

    // 4. Particles
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        if (p.type === 'water') {
            ctx.fillStyle = '#bdf7ff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        } else if (p.type === 'star') {
            ctx.fillStyle = '#ffd36b';
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.life * Math.PI * 4);
            ctx.fillRect(-p.size, -p.size, p.size*2, p.size*2);
            ctx.restore();
        }
    });
    ctx.globalAlpha = 1.0;

    // 5. Brush Cursor (Sponge)
    if (pointer.down && gameState === 'PLAYING') {
        const radius = Math.max(0, gameConfig.brushSize);
        const ring = ctx.createRadialGradient(pointer.x, pointer.y, radius * 0.15, pointer.x, pointer.y, radius);
        ring.addColorStop(0, 'rgba(216, 251, 255, 0.28)');
        ring.addColorStop(1, 'rgba(216, 251, 255, 0)');
        ctx.fillStyle = ring;
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, radius, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(216, 251, 255, 0.85)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 211, 107, 0.9)';
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseBgm();
    else if (gameState === 'PLAYING' && audioUnlocked) startBgm();
});

function gameLoop(timestamp) {
    try {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        
        // dt cap for resilience
        if (dt > 0.1) dt = 0.1;

        update(dt);
        draw();
    } catch (e) {
        console.error("Loop Error:", e);
    }
    requestAnimationFrame(gameLoop);
}

</script>
