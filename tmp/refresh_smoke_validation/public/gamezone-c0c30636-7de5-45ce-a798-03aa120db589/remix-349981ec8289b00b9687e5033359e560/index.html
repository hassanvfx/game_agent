<div id="game-container">

<script type="module">
/*
 * BOSS LAUNCH 3D
 * A physics-based launcher game.
 * 
 * Logic:
 * - Aim Phase: Oscillating power bar.
 * - Flight Phase: Projectile physics with ground bounce.
 * - Shop Phase: Upgrade velocity.
 */

// --- Configuration ---
const CONFIG = {
    gravity: 0.15,
    groundFriction: 0.96,
    airResistance: 0.995,
    bounceFactor: 0.6,
    meterSpeed: 0.05,
    baseKickPower: 15,
    scaleFactor: 100,
    colors: {
        skyTop: '#6a5cff',
        skyBot: '#120f35',
        ground: '#774936',
        groundDark: '#3b2418',
        boss: '#ff5a8f',
        player: '#73e7ff'
    }
};

// --- Game State ---
const STATE = {
    money: 0,
    upgradeLevel: 1,
    upgradeCost: 100,
    maxDistance: 0,
    
    phase: 'MENU',
    power: 0,
    meterDir: 1,
    
    camera: { x: 0, y: 0 },
    boss: { x: 0, y: 0, vx: 0, vy: 0, r: 0, rotation: 0 },
    player: { x: 0, y: 0 }
};

// --- Audio Controller ---
const Audio = {
    ctx: null,
    sounds: {},
    masterGain: null,
    musicGain: null,
    sfxGain: null,
    loopSource: null,
    initialized: false,
    
    init() {
        if (this.initialized) {
            if (this.ctx?.state === 'suspended') this.ctx.resume().catch(() => {});
            this.startLoop();
            return;
        }
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.musicGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.9;
            this.musicGain.gain.value = 0.2;
            this.sfxGain.gain.value = 0.72;
            this.musicGain.connect(this.masterGain);
            this.sfxGain.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);

            this.load('launch', 'sfx_launch');
            this.load('bounce', 'sfx_bounce');
            this.load('reward', 'sfx_reward');
            this.load('upgrade', 'sfx_upgrade');
            this.load('fail', 'sfx_fail');
            this.load('click', 'sfx_click');
            this.load('bgm', 'bgm_main');

            this.initialized = true;
            this.startLoop();
        } catch (e) {
            console.log('Audio init fail', e);
        }
    },

    async load(id, elId) {
        const el = document.getElementById(elId);
        if (!el?.src || !this.ctx) return;
        try {
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            this.sounds[id] = await this.ctx.decodeAudioData(buf);
        } catch (e) {
            console.log('Audio load fail', e);
        }
    },

    startLoop(name = 'bgm') {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        if (!this.sounds[name] || this.loopSource) return;

        const src = this.ctx.createBufferSource();
        src.buffer = this.sounds[name];
        src.loop = true;
        src.connect(this.musicGain);
        src.start(0);
        src.onended = () => {
            if (this.loopSource === src) this.loopSource = null;
        };
        this.loopSource = src;
    },

    stopLoop() {
        if (!this.loopSource) return;
        try {
            this.loopSource.stop(0);
        } catch (e) {}
        this.loopSource = null;
    },

    play(id, rate = 1.0, volume = 1) {
        if (!this.ctx || !this.sfxGain) return;
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        
        if (this.sounds[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.sounds[id];
            src.playbackRate.value = rate;
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.sfxGain);
            src.start(0);
            return;
        }

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = 220;
        gain.gain.value = 0.05 * volume;
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.stop(this.ctx.currentTime + 0.08);
    }
};

const FX = {
    launchGif: null,
    resultGif: null,
    gifTimer: 0,

    init() {
        this.launchGif = document.getElementById('launch-gif');
        this.resultGif = document.getElementById('result-gif');
    },

    showLaunch() {
        if (!this.launchGif) return;
        this.launchGif.classList.add('visible');
        clearTimeout(this.gifTimer);
        this.gifTimer = setTimeout(() => {
            this.launchGif?.classList.remove('visible');
        }, 1250);
    },

    showResult(distanceKm) {
        if (!this.resultGif) return;
        const success = distanceKm >= Math.max(12, STATE.maxDistance);
        this.resultGif.src = success
            ? 'https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp'
            : 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp';
        this.resultGif.alt = success ? 'Celebration reaction' : 'Funny fail reaction';
        this.resultGif.classList.add('visible');
    },

    hideResult() {
        this.resultGif?.classList.remove('visible');
    }
};

// --- Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height, groundY;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    
    groundY = height * 0.75;
    
    if (STATE.phase === 'MENU') {
        resetPositions();
    }
}
window.addEventListener('resize', resize);

function resetPositions() {
    STATE.boss.x = width * 0.2;
    STATE.boss.y = groundY;
    STATE.boss.vx = 0;
    STATE.boss.vy = 0;
    STATE.boss.r = width * 0.05;
    STATE.boss.rotation = 0;

    STATE.player.x = width * 0.1;
    STATE.player.y = groundY;
    
    STATE.camera.x = 0;
}

// --- Logic ---

function startAiming() {
    STATE.phase = 'AIM';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('shop-screen').classList.add('hidden');
    document.getElementById('aim-ui').classList.remove('hidden');
    resetPositions();
    Audio.init();
    Audio.play('click', 1, 0.7);
    Audio.startLoop();
    FX.hideResult();
}

function kick() {
    STATE.phase = 'FLY';
    document.getElementById('aim-ui').classList.add('hidden');
    
    const force = CONFIG.baseKickPower * (1 + STATE.upgradeLevel * 0.2);
    const finalPower = force * (0.5 + STATE.power * 0.5);
    
    STATE.boss.vx = finalPower * 0.8;
    STATE.boss.vy = -finalPower * 1.2;
    STATE.boss.y -= 5;
    
    Audio.play('launch', 1, 0.95);
    FX.showLaunch();
}

function endRun() {
    STATE.phase = 'RESULT';
    
    const distanceKm = Math.floor(STATE.boss.x / CONFIG.scaleFactor);
    const reward = Math.floor(distanceKm * 10);
    
    STATE.money += reward;
    if (distanceKm > STATE.maxDistance) STATE.maxDistance = distanceKm;
    
    document.getElementById('result-dist').innerText = distanceKm.toLocaleString();
    document.getElementById('result-money').innerText = reward.toLocaleString();
    document.getElementById('shop-screen').classList.remove('hidden');
    
    updateShopUI();
    Audio.play('reward', 1, 0.85);
    FX.showResult(distanceKm);
}

function buyUpgrade() {
    if (STATE.money >= STATE.upgradeCost) {
        STATE.money -= STATE.upgradeCost;
        STATE.upgradeLevel++;
        STATE.upgradeCost = Math.floor(STATE.upgradeCost * 1.5);
        Audio.play('upgrade', 1.1, 0.85);
        updateShopUI();
    } else {
        Audio.play('fail', 1, 0.7);
    }
}

function updateShopUI() {
    document.getElementById('money-display').innerText = STATE.money.toLocaleString();
    document.getElementById('upgrade-cost').innerText = STATE.upgradeCost.toLocaleString();
    
    const btn = document.getElementById('upgrade-btn');
    if (STATE.money < STATE.upgradeCost) {
        btn.classList.add('btn-disabled');
        btn.classList.remove('btn-upgrade');
    } else {
        btn.classList.remove('btn-disabled');
        btn.classList.add('btn-upgrade');
    }
}

// --- Game Loop ---

function update() {
    if (STATE.phase === 'AIM') {
        STATE.power += CONFIG.meterSpeed * STATE.meterDir;
        if (STATE.power >= 1) { STATE.power = 1; STATE.meterDir = -1; }
        if (STATE.power <= 0) { STATE.power = 0; STATE.meterDir = 1; }
        
        document.getElementById('power-fill').style.height = (STATE.power * 100) + '%';
    }
    
    if (STATE.phase === 'FLY') {
        const b = STATE.boss;
        
        b.vy += CONFIG.gravity;
        b.vx *= CONFIG.airResistance;
        b.x += b.vx;
        b.y += b.vy;
        b.rotation += b.vx * 0.1;

        if (b.y + b.r > groundY) {
            b.y = groundY - b.r;
            b.vy *= -CONFIG.bounceFactor;
            b.vx *= CONFIG.groundFriction;
            
            if (Math.abs(b.vy) < 0.5 && Math.abs(b.vx) < 0.1) {
                b.vx = 0;
                b.vy = 0;
                endRun();
            } else {
                if (Math.abs(b.vy) > 2) Audio.play('bounce', 0.85 + Math.random() * 0.3, 0.45);
            }
        }
        
        let targetCamX = b.x - width * 0.3;
        if (targetCamX < 0) targetCamX = 0;
        STATE.camera.x += (targetCamX - STATE.camera.x) * 0.1;
        
        const dist = Math.floor(b.x / CONFIG.scaleFactor);
        document.getElementById('dist-display').innerText = dist.toLocaleString();
    }
}

function drawEntity(x, y, type, rotation) {
    ctx.save();
    ctx.translate(x, y);
    
    ctx.fillStyle = 'rgba(0,0,0,0.24)';
    ctx.beginPath();
    ctx.ellipse(0, type === 'boss' ? STATE.boss.r + 8 : 42, 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'boss') {
        ctx.rotate(rotation);
        const r = STATE.boss.r;

        const aura = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.4);
        aura.addColorStop(0, 'rgba(255, 209, 102, 0.35)');
        aura.addColorStop(1, 'rgba(255, 209, 102, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
        ctx.fill();
        
        const grad = ctx.createRadialGradient(-r / 3, -r / 3, r / 5, 0, 0, r);
        grad.addColorStop(0, '#fff0a8');
        grad.addColorStop(0.35, '#ff8c6b');
        grad.addColorStop(1, '#ff4f8b');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = Math.max(2, r * 0.08);
        ctx.stroke();

        ctx.fillStyle = '#2a184f';
        ctx.beginPath();
        ctx.moveTo(-r * 0.62, -r * 0.2);
        ctx.quadraticCurveTo(-r * 0.28, -r * 0.76, -r * 0.02, -r * 0.14);
        ctx.quadraticCurveTo(-r * 0.18, -r * 0.08, -r * 0.62, -r * 0.2);
        ctx.moveTo(r * 0.62, -r * 0.2);
        ctx.quadraticCurveTo(r * 0.28, -r * 0.76, r * 0.02, -r * 0.14);
        ctx.quadraticCurveTo(r * 0.18, -r * 0.08, r * 0.62, -r * 0.2);
        ctx.fill();
        
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(-r / 3, -r / 7, r / 4.2, 0, Math.PI * 2);
        ctx.arc(r / 3, -r / 7, r / 4.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#141226';
        ctx.beginPath();
        ctx.arc(-r / 3, -r / 7, r / 10, 0, Math.PI * 2);
        ctx.arc(r / 3, -r / 7, r / 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#141226';
        ctx.lineWidth = Math.max(2, r * 0.08);
        ctx.beginPath();
        ctx.arc(0, r * 0.22, r * 0.3, 0.1, Math.PI - 0.1, false);
        ctx.stroke();

        ctx.fillStyle = '#73e7ff';
        ctx.beginPath();
        ctx.arc(-r * 0.82, -r * 0.2, r * 0.12, 0, Math.PI * 2);
        ctx.arc(r * 0.82, -r * 0.2, r * 0.12, 0, Math.PI * 2);
        ctx.fill();
    } else if (type === 'player') {
        ctx.strokeStyle = CONFIG.colors.player;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';

        ctx.fillStyle = '#18204f';
        ctx.beginPath();
        ctx.arc(0, -54, 17, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd8b8';
        ctx.beginPath();
        ctx.arc(0, -50, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffcf6a';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-10, -62);
        ctx.quadraticCurveTo(0, -74, 10, -62);
        ctx.stroke();

        ctx.strokeStyle = CONFIG.colors.player;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(0, 0);

        if (STATE.phase === 'AIM') {
            ctx.moveTo(0, -2);
            ctx.lineTo(-22, 26);
            ctx.moveTo(0, -2);
            ctx.lineTo(12, 30);
        } else {
            ctx.moveTo(0, -2);
            ctx.lineTo(-12, 28);
            ctx.moveTo(0, -4);
            ctx.lineTo(30, -12);
        }

        ctx.moveTo(0, -25);
        ctx.lineTo(-24, -8);
        ctx.moveTo(0, -25);
        ctx.lineTo(24, -6);
        ctx.moveTo(0, 0);
        ctx.lineTo(-12, 34);
        ctx.moveTo(0, 0);
        ctx.lineTo(14, 32);
        ctx.stroke();

        ctx.fillStyle = '#73e7ff';
        ctx.beginPath();
        ctx.arc(30, -12, 8, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

function draw() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#6a5cff');
    grad.addColorStop(0.45, '#201f64');
    grad.addColorStop(1, CONFIG.colors.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    const moonGlow = ctx.createRadialGradient(width * 0.75, height * 0.18, 20, width * 0.75, height * 0.18, width * 0.18);
    moonGlow.addColorStop(0, 'rgba(255, 241, 178, 0.85)');
    moonGlow.addColorStop(0.35, 'rgba(255, 209, 102, 0.35)');
    moonGlow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(width * 0.75, height * 0.18, width * 0.16, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 16; i++) {
        const starX = ((i * 157) % width);
        const starY = 30 + ((i * 73) % Math.max(60, groundY - 120));
        const twinkle = 0.35 + 0.3 * Math.sin((performance.now() * 0.002) + i);
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.fillRect(starX, starY, 2 + (i % 2), 2 + (i % 2));
    }
    
    ctx.save();
    
    ctx.fillStyle = 'rgba(77, 60, 137, 0.75)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let i = 0; i <= width; i += 50) {
        const h = 120 + Math.sin((i + STATE.camera.x * 0.3) * 0.01) * 45;
        ctx.lineTo(i, groundY - h);
    }
    ctx.lineTo(width, groundY);
    ctx.fill();

    ctx.fillStyle = 'rgba(44, 33, 100, 0.9)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let i = 0; i <= width; i += 40) {
        const h = 70 + Math.sin((i + STATE.camera.x * 0.55) * 0.016) * 26;
        ctx.lineTo(i, groundY - h);
    }
    ctx.lineTo(width, groundY);
    ctx.fill();

    ctx.translate(-STATE.camera.x, 0);
    
    const floorGrad = ctx.createLinearGradient(0, groundY, 0, height);
    floorGrad.addColorStop(0, '#9d5c43');
    floorGrad.addColorStop(1, CONFIG.colors.groundDark);
    ctx.fillStyle = floorGrad;
    ctx.fillRect(STATE.camera.x, groundY, width, height - groundY);
    
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.16)';
    ctx.lineWidth = 3;
    const gridSize = 100;
    const startX = Math.floor(STATE.camera.x / gridSize) * gridSize;
    
    ctx.beginPath();
    for (let x = startX; x < STATE.camera.x + width + gridSize; x += gridSize) {
        ctx.moveTo(x, groundY);
        ctx.lineTo(x - (x - (STATE.camera.x + width / 2)) * 0.5, height);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgba(115, 231, 255, 0.35)';
    for (let x = startX; x < STATE.camera.x + width + gridSize; x += 180) {
        ctx.fillRect(x + 10, groundY + 12, 42, 4);
    }

    const graveX = 5000 * CONFIG.scaleFactor; 
    if (graveX < STATE.camera.x + width * 2) {
        ctx.fillStyle = '#5b566a';
        ctx.fillRect(graveX, groundY - 60, 40, 60);
        ctx.fillStyle = '#f4f7ff';
        ctx.font = '700 12px "Rajdhani", system-ui, sans-serif';
        ctx.fillText('RIP', graveX + 9, groundY - 26);
    }

    if (STATE.camera.x < 500) {
        drawEntity(STATE.player.x, STATE.player.y - 40, 'player', 0);
    }
    
    drawEntity(STATE.boss.x, STATE.boss.y - STATE.boss.r, 'boss', STATE.boss.rotation);

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function handleInput(e) {
    if (e.type !== 'click' && e.type !== 'touchstart' && e.type !== 'pointerdown') return;
    
    if (STATE.phase === 'AIM') {
        kick();
    }
}

FX.init();

document.getElementById('start-btn').addEventListener('click', startAiming);
document.getElementById('retry-btn').addEventListener('click', startAiming);
document.getElementById('upgrade-btn').addEventListener('click', buyUpgrade);
document.getElementById('game-container').addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'CANVAS' || e.target.id === 'aim-ui') {
        handleInput(e);
    }
});

resize();
loop();

</script>
