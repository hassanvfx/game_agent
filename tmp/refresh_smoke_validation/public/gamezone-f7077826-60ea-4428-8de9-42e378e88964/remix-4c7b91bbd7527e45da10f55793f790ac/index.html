<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Royal Race</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-top: #140b29;
            --bg-bottom: #06030f;
            --royal-violet: #2b1554;
            --royal-violet-soft: #4a2a84;
            --panel-night: rgba(20, 12, 39, 0.9);
            --panel-edge: rgba(255, 214, 102, 0.45);
            --panel-glow: 0 14px 28px rgba(43, 21, 84, 0.38);
            --cream: #f5efff;
            --gold-1: #ffe08a;
            --gold-2: #ffc94d;
            --gold-3: #b87417;
            --sky-glow: #79e4ff;
            --overlay-dark: rgba(3, 3, 10, 0.62);
            --overlay-strong: rgba(3, 3, 10, 0.82);
            --shadow-strong: 0 16px 28px rgba(0, 0, 0, 0.45);
            --transition-fast: 0.2s ease;
            --transition-med: 0.3s ease;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', sans-serif;
            background:
                radial-gradient(circle at top, rgba(121, 228, 255, 0.18), transparent 35%),
                radial-gradient(circle at 50% 20%, rgba(255, 201, 77, 0.18), transparent 40%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--cream);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.14) 0, transparent 18%),
                radial-gradient(circle at 78% 15%, rgba(255, 224, 138, 0.1) 0, transparent 22%),
                radial-gradient(circle at 50% 82%, rgba(121, 228, 255, 0.07) 0, transparent 26%);
            opacity: 0.95;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            padding-right: calc(16px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            padding-left: calc(16px + env(safe-area-inset-left, 0px));
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            transition: opacity var(--transition-med);
            opacity: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 32px;
            pointer-events: auto;
            transition: opacity var(--transition-med);
            opacity: 0;
        }

        .dice-wrapper {
            position: relative;
        }

        .wood-panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 34%),
                linear-gradient(135deg, rgba(74, 42, 132, 0.96) 0%, rgba(20, 12, 39, 0.96) 100%);
            border: 2px solid var(--panel-edge);
            box-shadow: var(--shadow-strong), var(--panel-glow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            color: var(--cream);
            backdrop-filter: blur(8px);
        }

        .badge-panel {
            border-radius: 18px;
            padding: 10px 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status-panel {
            border-radius: 18px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            background-blend-mode: screen;
            text-shadow: 0 0 12px rgba(121, 228, 255, 0.18);
        }

        .player-badge {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 7px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 255, 255, 0.12);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
            position: relative;
        }

        .bg-red { background: #dc2626; }
        .bg-green { background: #16a34a; }
        .bg-yellow { background: #eab308; }
        .bg-blue { background: #2563eb; }

        .scene {
            width: 80px;
            height: 80px;
            perspective: 400px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-out;
        }

        .cube__face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #FAFAFA;
            border: 1px solid #CCC;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dot {
            width: 14px;
            height: 14px;
            background: #333;
            border-radius: 50%;
            box-shadow: inset 0 2px 2px rgba(0,0,0,0.5);
        }

        .cube__face--1 { transform: rotateY(0deg) translateZ(40px); }
        .cube__face--2 { transform: rotateY(90deg) translateZ(40px); }
        .cube__face--3 { transform: rotateY(180deg) translateZ(40px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(40px); }
        .cube__face--5 { transform: rotateX(90deg) translateZ(40px); }
        .cube__face--6 { transform: rotateX(-90deg) translateZ(40px); }

        .face-1 { display: flex; justify-content: center; align-items: center; }
        .face-2 { display: flex; justify-content: space-around; align-items: center; flex-direction: column; padding: 15px; }
        .face-3 { display: flex; justify-content: space-between; padding: 15px; }
        .face-3 .dot:nth-child(2) { align-self: center; }
        .face-3 .dot:nth-child(3) { align-self: flex-end; }
        .face-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .face-5 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .face-5 .dot:nth-child(5) { grid-column: 1 / span 2; justify-self: center; }
        .face-6 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }

        .active-player-glow {
            box-shadow: 0 0 0 3px rgba(255, 224, 138, 0.25), 0 0 18px 6px rgba(121, 228, 255, 0.35);
            border-color: #fff3c4;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .dice-active {
            cursor: pointer;
            animation: pulse-ring 2s infinite;
        }

        .hint-text {
            position: absolute;
            left: 50%;
            bottom: -32px;
            transform: translateX(-50%);
            width: max-content;
            text-align: center;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(121, 228, 255, 0.3);
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            padding: 24px;
        }

        .start-screen {
            background: var(--overlay-dark);
            backdrop-filter: blur(8px);
        }

        .game-over-screen {
            background: var(--overlay-strong);
        }

        .hidden {
            display: none;
        }

        .modal-card {
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            width: min(100%, 340px);
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .modal-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at top, rgba(255, 224, 138, 0.2), transparent 48%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 34%);
        }

        .modal-card.intro-card {
            transition: transform var(--transition-med);
        }

        .modal-card.intro-card:hover {
            transform: scale(1.03);
        }

        .title {
            margin: 0 0 10px;
            font-size: clamp(2.4rem, 8vw, 3.7rem);
            line-height: 0.98;
            font-weight: 400;
            font-family: 'Russo One', sans-serif;
            color: var(--gold-1);
            letter-spacing: 0.08em;
            text-shadow: 0 0 18px rgba(121, 228, 255, 0.25), 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            margin: 0 0 12px;
            color: rgba(255, 224, 138, 0.9);
            font-size: 0.8rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .intro-copy {
            margin: 0 0 20px;
            color: rgba(245, 239, 255, 0.92);
            font-size: 1rem;
            line-height: 1.35;
            max-width: 28ch;
            margin-left: auto;
            margin-right: auto;
        }

        .result-title {
            margin: 0 0 16px;
            font-size: clamp(2rem, 7vw, 2.8rem);
            font-weight: 400;
            font-family: 'Russo One', sans-serif;
            letter-spacing: 0.06em;
            color: var(--gold-1);
        }

        .winner-text {
            margin: 0 0 28px;
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 12px rgba(121, 228, 255, 0.2);
        }

        .game-button {
            border: 1px solid rgba(255, 244, 199, 0.6);
            border-radius: 999px;
            padding: 14px 28px;
            background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 100%);
            color: #311902;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28), 0 0 18px rgba(255, 201, 77, 0.18);
            transition: transform var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
            font-size: 1rem;
            letter-spacing: 0.04em;
            position: relative;
            z-index: 1;
        }

        .game-button:hover {
            background: linear-gradient(180deg, #fff0b3 0%, #ffd86f 100%);
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.32), 0 0 20px rgba(121, 228, 255, 0.2);
        }

        .game-button:active {
            transform: scale(0.95);
        }

        .crown-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 0 0 16px;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(255, 201, 77, 0.3));
        }

        .court-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border-radius: 999px;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.92rem;
            letter-spacing: 0.05em;
        }

        .court-gem {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--sky-glow) 35%, #2bd0ff 100%);
            box-shadow: 0 0 10px rgba(121, 228, 255, 0.5);
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 45;
        }

        .feedback-badge {
            position: absolute;
            right: 16px;
            width: min(34vw, 130px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(13, 8, 26, 0.72);
            box-shadow: 0 16px 24px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            overflow: hidden;
        }

        .feedback-badge img {
            display: block;
            width: 100%;
            height: auto;
        }

        .feedback-badge--capture {
            top: calc(92px + env(safe-area-inset-top, 0px));
        }

        .feedback-badge--victory {
            left: 50%;
            right: auto;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            width: min(44vw, 180px);
            transform: translateX(-50%) translateY(12px) scale(0.92);
        }

        .feedback-badge.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-badge--victory.visible {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .feedback-chip {
            position: absolute;
            left: 50%;
            bottom: calc(116px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(13, 8, 26, 0.86);
            border: 1px solid rgba(255, 224, 138, 0.42);
            color: var(--gold-1);
            font-family: 'Russo One', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .feedback-chip.visible {
            opacity: 1;
        }

        @media (max-width: 700px) {
            .hud {
                flex-direction: column;
                align-items: stretch;
            }

            .status-panel {
                white-space: normal;
            }

            .modal-card {
                padding: 24px;
            }

            .controls {
                padding-bottom: 40px;
            }

            .feedback-badge--capture {
                top: auto;
                bottom: calc(148px + env(safe-area-inset-bottom, 0px));
                width: min(38vw, 120px);
            }

            .feedback-chip {
                bottom: calc(128px + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 32px);
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="feedback-layer" class="feedback-layer" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: capture/victory feedback -> catalogs/gifs.json -->
            <div id="capture-gif" class="feedback-badge feedback-badge--capture">
                <img src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="Court clash reaction">
            </div>
            <div id="victory-gif" class="feedback-badge feedback-badge--victory">
                <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Victory celebration reaction">
            </div>
            <div id="feedback-chip" class="feedback-chip">Court clash!</div>
        </div>
        <div class="overlay">
            <div id="hud" class="hud">
                <div class="wood-panel badge-panel">
                    <div id="p0-badge" class="player-badge bg-red"></div>
                    <div id="p1-badge" class="player-badge bg-green"></div>
                    <div id="p2-badge" class="player-badge bg-yellow"></div>
                    <div id="p3-badge" class="player-badge bg-blue"></div>
                </div>
                <div class="wood-panel status-panel" id="status-text">
                    Begin the royal race
                </div>
            </div>

            <div id="controls" class="controls">
                <div class="dice-wrapper">
                    <div class="scene">
                        <div class="cube" id="dice-cube">
                            <div class="cube__face cube__face--1 face-1"><div class="dot"></div></div>
                            <div class="cube__face cube__face--2 face-2"><div class="dot"></div><div class="dot"></div></div>
                            <div class="cube__face cube__face--3 face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <div class="cube__face cube__face--4 face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <div class="cube__face cube__face--5 face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                            <div class="cube__face cube__face--6 face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        </div>
                    </div>
                    <div id="roll-hint" class="hint-text">Roll the die</div>
                </div>
            </div>
        </div>

        <div id="start-screen" class="screen start-screen">
            <div class="wood-panel modal-card intro-card">
                <div class="crown-row" aria-hidden="true"><span>👑</span><span>✨</span><span>👑</span></div>
                <h1 class="title">ROYAL RACE</h1>
                <p class="subtitle">Starlit court challenge</p>
                <p class="intro-copy">Roll the die, release a token on a six, and guide your whole court to the radiant throne before the rival houses arrive.</p>
                <button id="start-btn" class="game-button">Enter the court</button>
                <div class="court-chip"><span class="court-gem"></span><span>Four courts. One shining throne.</span></div>
            </div>
        </div>

        <div id="game-over-screen" class="screen game-over-screen hidden">
            <div class="wood-panel modal-card">
                <h2 class="result-title">Court triumphant</h2>
                <div class="winner-text" id="winnerText">Red Court Wins!</div>
                <button id="restart-btn" class="game-button">Play again</button>
            </div>
        </div>
    </div>

    <script>
        /*
         * ROYAL RACE ENGINE
         * Single-file implementation with vanilla JS + Canvas
         */

        const CONFIG = {
            colors: ['#ff5d73', '#3ddc97', '#ffd84d', '#57a8ff'],
            darkColors: ['#8a142f', '#0f6e54', '#b87417', '#1d4ed8'],
            boardColor: '#fbf7ff',
            woodColor: '#2b1554',
            glowColors: ['rgba(255,93,115,0.45)', 'rgba(61,220,151,0.45)', 'rgba(255,216,77,0.45)', 'rgba(87,168,255,0.45)'],
            hopHeight: 20,
            hopSpeed: 0.25,
        };

        const COURT_NAMES = ['Red Court', 'Green Court', 'Golden Court', 'Blue Court'];

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3",
            sfx: {
                roll: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                step: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                enter: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                capture: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                home: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3"
            }
        };
        // [agent-note][stage3] resolved-audio: bgm/sfx -> catalogs/audios.json
        // [agent-note][stage4] repaired-font-remap: title/body fonts -> Russo One/Rajdhani from catalogs/fonts.json

        const audio = {
            initialized: false,
            unlocked: false,
            bgm: null,
            sfx: {},
            lastPlayedAt: {},
            init: function() {
                if (this.initialized) return;
                this.initialized = true;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';

                Object.entries(ASSETS.sfx).forEach(([key, src]) => {
                    const clip = new Audio(src);
                    clip.preload = 'auto';
                    clip.volume = key === 'blocked' ? 0.55 : key === 'step' ? 0.3 : 0.68;
                    this.sfx[key] = clip;
                });
            },
            unlock: function() {
                this.init();
                this.unlocked = true;
            },
            playBGM: function() {
                if (this.bgm && this.unlocked) this.bgm.play().catch(() => {});
            },
            stopBGM: function() {
                if (this.bgm) {
                    this.bgm.pause();
                    this.bgm.currentTime = 0;
                }
            },
            playSFX: function(key, cooldown = 0) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const base = this.sfx[key];
                const clip = base.cloneNode();
                clip.volume = base.volume;
                clip.play().catch(() => {});
            }
        };

        const feedback = {
            captureEl: null,
            victoryEl: null,
            chipEl: null,
            captureTimer: null,
            victoryTimer: null,
            chipTimer: null,
            init() {
                this.captureEl = document.getElementById('capture-gif');
                this.victoryEl = document.getElementById('victory-gif');
                this.chipEl = document.getElementById('feedback-chip');
            },
            showChip(message, duration = 900) {
                if (!this.chipEl) return;
                clearTimeout(this.chipTimer);
                this.chipEl.textContent = message;
                this.chipEl.classList.add('visible');
                this.chipTimer = setTimeout(() => this.chipEl.classList.remove('visible'), duration);
            },
            showCapture() {
                if (!this.captureEl) return;
                clearTimeout(this.captureTimer);
                this.captureEl.classList.add('visible');
                this.showChip('Court clash!', 950);
                this.captureTimer = setTimeout(() => this.captureEl.classList.remove('visible'), 1100);
            },
            showVictory() {
                if (!this.victoryEl) return;
                clearTimeout(this.victoryTimer);
                this.victoryEl.classList.add('visible');
                this.showChip('Throne secured!', 1800);
                this.victoryTimer = setTimeout(() => this.victoryEl.classList.remove('visible'), 2200);
            },
            reset() {
                this.captureEl?.classList.remove('visible');
                this.victoryEl?.classList.remove('visible');
                this.chipEl?.classList.remove('visible');
            }
        };

        const MAIN_PATH = [
            {x:1,y:6},{x:2,y:6},{x:3,y:6},{x:4,y:6},{x:5,y:6},
            {x:6,y:5},{x:6,y:4},{x:6,y:3},{x:6,y:2},{x:6,y:1},{x:6,y:0},
            {x:7,y:0},{x:8,y:0},
            {x:8,y:1},{x:8,y:2},{x:8,y:3},{x:8,y:4},{x:8,y:5},
            {x:9,y:6},{x:10,y:6},{x:11,y:6},{x:12,y:6},{x:13,y:6},{x:14,y:6},
            {x:14,y:7},{x:14,y:8},
            {x:13,y:8},{x:12,y:8},{x:11,y:8},{x:10,y:8},{x:9,y:8},
            {x:8,y:9},{x:8,y:10},{x:8,y:11},{x:8,y:12},{x:8,y:13},{x:8,y:14},
            {x:7,y:14},{x:6,y:14},
            {x:6,y:13},{x:6,y:12},{x:6,y:11},{x:6,y:10},{x:6,y:9},
            {x:5,y:8},{x:4,y:8},{x:3,y:8},{x:2,y:8},{x:1,y:8},{x:0,y:8},
            {x:0,y:7},{x:0,y:6}
        ];
        const START_INDICES = [0, 13, 26, 39];
        const HOME_PATHS = [
            [{x:1,y:7},{x:2,y:7},{x:3,y:7},{x:4,y:7},{x:5,y:7},{x:6,y:7}],
            [{x:7,y:1},{x:7,y:2},{x:7,y:3},{x:7,y:4},{x:7,y:5},{x:7,y:6}],
            [{x:13,y:7},{x:12,y:7},{x:11,y:7},{x:10,y:7},{x:9,y:7},{x:8,y:7}],
            [{x:7,y:13},{x:7,y:12},{x:7,y:11},{x:7,y:10},{x:7,y:9},{x:7,y:8}]
        ];
        const BASE_POS = [
            [{x:1,y:1}, {x:4,y:1}, {x:1,y:4}, {x:4,y:4}],
            [{x:10,y:1}, {x:13,y:1}, {x:10,y:4}, {x:13,y:4}],
            [{x:10,y:10}, {x:13,y:10}, {x:10,y:13}, {x:13,y:13}],
            [{x:1,y:10}, {x:4,y:10}, {x:1,y:13}, {x:4,y:13}]
        ];

        let state = {
            players: [],
            turn: 0,
            diceVal: 1,
            waitingForRoll: true,
            waitingForMove: false,
            animatingToken: null,
            gameActive: false
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let dims = { width: 0, height: 0, cellSize: 0, boardX: 0, boardY: 0 };

        function initGame() {
            state.players = [];
            for (let i = 0; i < 4; i++) {
                let tokens = [];
                for (let t = 0; t < 4; t++) {
                    tokens.push({ id: t, pid: i, state: 'BASE', pos: -1 });
                }
                state.players.push({ id: i, tokens: tokens, finished: 0 });
            }
            state.turn = 0;
            state.diceVal = 1;
            state.waitingForRoll = true;
            state.waitingForMove = false;
            state.animatingToken = null;
            state.gameActive = true;

            feedback.reset();
            updateHUD();
            resetDiceVisual();
        }

        function getCoords(pid, token) {
            if (token.state === 'BASE') return BASE_POS[pid][token.id];
            if (token.state === 'HOME') return {x:7, y:7};

            if (token.pos < 51) {
                let idx = (START_INDICES[pid] + token.pos) % 52;
                return MAIN_PATH[idx];
            } else {
                let idx = token.pos - 51;
                if (idx >= HOME_PATHS[pid].length) idx = HOME_PATHS[pid].length - 1;
                return HOME_PATHS[pid][idx];
            }
        }

        function rollDice() {
            if (!state.waitingForRoll || !state.gameActive) return;
            state.waitingForRoll = false;

            audio.playSFX('roll');
            const cube = document.getElementById('dice-cube');
            const xRot = Math.floor(Math.random() * 4) * 360 + (Math.random() * 360);
            const yRot = Math.floor(Math.random() * 4) * 360 + (Math.random() * 360);

            cube.style.transition = "transform 0.6s ease-out";
            cube.style.transform = `rotateX(${xRot}deg) rotateY(${yRot}deg)`;

            setTimeout(() => {
                state.diceVal = Math.floor(Math.random() * 6) + 1;
                setDiceFace(state.diceVal);
                checkMoves();
            }, 600);
        }

        function setDiceFace(val) {
            const cube = document.getElementById('dice-cube');
            cube.style.transition = "transform 0.2s ease-out";
            const rotations = {
                1: 'rotateY(0deg)',
                2: 'rotateY(-90deg)',
                3: 'rotateY(180deg)',
                4: 'rotateY(90deg)',
                5: 'rotateX(-90deg)',
                6: 'rotateX(90deg)'
            };
            cube.style.transform = rotations[val];
        }

        function resetDiceVisual() {
            setDiceFace(1);
        }

        function checkMoves() {
            let p = state.players[state.turn];
            let hasMoves = false;
            p.tokens.forEach(t => {
                if (canMove(t, state.diceVal)) hasMoves = true;
            });

            if (hasMoves) {
                state.waitingForMove = true;
                document.getElementById('status-text').innerText = "Choose a court token";
            } else {
                document.getElementById('status-text').innerText = "No route opens";
                audio.playSFX('blocked', 250);
                feedback.showChip('No route opens', 850);
                setTimeout(nextTurn, 1000);
            }
        }

        function canMove(token, roll) {
            if (token.state === 'HOME') return false;
            if (token.state === 'BASE') return roll === 6;
            if (token.pos + roll > 56) return false;
            return true;
        }

        function handleInput(e) {
            if (!state.gameActive) return;
            if (e.cancelable) {
                e.preventDefault();
            }

            const point = e.touches && e.touches[0] ? e.touches[0] : e;

            const diceZone = document.getElementById('controls').getBoundingClientRect();
            if (point.clientY > diceZone.top && state.waitingForRoll) {
                rollDice();
                return;
            }

            if (state.waitingForMove) {
                const rect = canvas.getBoundingClientRect();
                const x = point.clientX - rect.left;
                const y = point.clientY - rect.top;

                let p = state.players[state.turn];
                let clickedToken = null;

                p.tokens.forEach(t => {
                    let c = getCoords(state.turn, t);
                    let px = dims.boardX + c.x * dims.cellSize + dims.cellSize / 2;
                    let py = dims.boardY + c.y * dims.cellSize + dims.cellSize / 2;
                    let dist = Math.hypot(x - px, y - py);
                    if (dist < dims.cellSize * 0.8 && canMove(t, state.diceVal)) {
                        clickedToken = t;
                    }
                });

                if (clickedToken) {
                    startMove(clickedToken);
                }
            }
        }

        function startMove(token) {
            state.waitingForMove = false;

            let path = [];
            let startPos = token.pos;

            if (token.state === 'BASE') {
                 token.state = 'PATH';
                 token.pos = 0;
                 path.push({ state: 'PATH', pos: 0 });
                 audio.playSFX('enter', 120);
            } else {
                for (let i = 1; i <= state.diceVal; i++) {
                    path.push({ state: token.pos + i >= 56 ? 'HOME' : (token.pos + i > 50 ? 'HOME_PATH' : 'PATH'), pos: token.pos + i });
                }
            }

            state.animatingToken = {
                token: token,
                queue: path,
                idx: 0,
                progress: 0,
                startCoords: getCoords(state.turn, token),
                targetCoords: null
            };

            updateAnimTarget();
        }

        function updateAnimTarget() {
            let anim = state.animatingToken;
            if (!anim) return;

            let nextStep = anim.queue[anim.idx];
            let tempToken = { ...anim.token, pos: nextStep.pos, state: nextStep.state === 'HOME_PATH' ? 'PATH' : nextStep.state };
            if (nextStep.pos >= 56) tempToken.state = 'HOME';

            anim.targetCoords = getCoords(state.turn, tempToken);
        }

        function updateAnimation() {
            if (!state.animatingToken) return;

            let anim = state.animatingToken;
            anim.progress += 0.15;

            if (anim.progress >= 1) {
                audio.playSFX('step');
                anim.token.pos = anim.queue[anim.idx].pos;
                if (anim.token.pos >= 56) anim.token.state = 'HOME';

                anim.startCoords = anim.targetCoords;
                anim.idx++;
                anim.progress = 0;

                if (anim.idx >= anim.queue.length) {
                    finishMove(anim.token);
                    state.animatingToken = null;
                } else {
                    updateAnimTarget();
                }
            }
        }

        function finishMove(token) {
            if (token.state === 'HOME') {
                state.players[state.turn].finished++;
                audio.playSFX('home', 180);
                feedback.showChip('A token reached the throne path!', 1000);
            }

            let myCoords = getCoords(state.turn, token);
            let collision = false;

            if (token.state !== 'HOME') {
                state.players.forEach(p => {
                    if (p.id !== state.turn) {
                        p.tokens.forEach(t => {
                            if (t.state === 'PATH' && t.pos < 51) {
                                let c = getCoords(p.id, t);
                                if (c.x === myCoords.x && c.y === myCoords.y) {
                                    t.state = 'BASE';
                                    t.pos = -1;
                                    audio.playSFX('capture', 180);
                                    feedback.showCapture();
                                    collision = true;
                                }
                            }
                        });
                    }
                });
            }

            if (state.players[state.turn].finished === 4) {
                endGame();
            } else {
                if (state.diceVal === 6 || collision || token.state === 'HOME') {
                    state.waitingForRoll = true;
                    updateHUD();
                } else {
                    nextTurn();
                }
            }
        }

        function nextTurn() {
            state.turn = (state.turn + 1) % 4;
            state.waitingForRoll = true;
            updateHUD();
        }

        function updateHUD() {
            document.querySelectorAll('.player-badge').forEach((el, i) => {
                if (i === state.turn) {
                    el.classList.add('active-player-glow');
                    el.style.transform = "scale(1.2)";
                } else {
                    el.classList.remove('active-player-glow');
                    el.style.transform = "scale(1)";
                }
            });

            const status = document.getElementById('status-text');
            status.innerText = `${COURT_NAMES[state.turn]}'s turn`;
            status.style.color = CONFIG.colors[state.turn];

            const diceHint = document.getElementById('roll-hint');
            if (state.waitingForRoll) {
                diceHint.style.opacity = 1;
                document.getElementById('dice-cube').parentElement.classList.add('dice-active');
            } else {
                diceHint.style.opacity = 0;
                document.getElementById('dice-cube').parentElement.classList.remove('dice-active');
            }
        }

        function endGame() {
            state.gameActive = false;
            audio.playSFX('win');
            audio.stopBGM();
            feedback.showVictory();
            document.getElementById('hud').style.opacity = 0;
            document.getElementById('controls').style.opacity = 0;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('winnerText').innerText = COURT_NAMES[state.turn] + " takes the throne!";
            document.getElementById('winnerText').style.color = CONFIG.colors[state.turn];
        }

        function resize() {
            dims.width = window.innerWidth;
            dims.height = window.innerHeight;
            canvas.width = dims.width;
            canvas.height = dims.height;

            const horizontalPadding = dims.width <= 700 ? 20 : 32;
            const topReserve = dims.width <= 700 ? 108 : 88;
            const bottomReserve = dims.width <= 700 ? 152 : 136;
            const availableBoardHeight = Math.max(180, dims.height - topReserve - bottomReserve);
            let minDim = Math.min(dims.width - horizontalPadding, availableBoardHeight);
            dims.cellSize = Math.max(18, Math.floor(minDim / 15));
            dims.boardX = (dims.width - dims.cellSize * 15) / 2;
            dims.boardY = Math.max(topReserve, (dims.height - dims.cellSize * 15) / 2 - 8);
        }

        function drawRoundedRect(x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        function drawHole(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y, size, 0.5, 2.5);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.stroke();
        }

        function drawBoard() {
            const { cellSize, boardX, boardY } = dims;

            const boardGlow = ctx.createRadialGradient(
                boardX + cellSize * 7.5,
                boardY + cellSize * 7.5,
                cellSize * 1.5,
                boardX + cellSize * 7.5,
                boardY + cellSize * 7.5,
                cellSize * 10
            );
            boardGlow.addColorStop(0, 'rgba(121, 228, 255, 0.18)');
            boardGlow.addColorStop(1, 'rgba(121, 228, 255, 0)');

            ctx.fillStyle = boardGlow;
            ctx.fillRect(boardX - cellSize, boardY - cellSize, cellSize * 17, cellSize * 17);

            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;

            drawRoundedRect(boardX - 10, boardY - 10, cellSize * 15 + 20, cellSize * 15 + 20, 16, CONFIG.boardColor, 'rgba(255, 224, 138, 0.35)');

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    if ((i < 6 && j < 6) || (i > 8 && j < 6) || (i < 6 && j > 8) || (i > 8 && j > 8) || (i > 5 && i < 9 && j > 5 && j < 9)) continue;

                    let cx = boardX + j * cellSize + cellSize / 2;
                    let cy = boardY + i * cellSize + cellSize / 2;
                    drawHole(cx, cy, cellSize * 0.32);
                }
            }

            const baseSize = cellSize * 6;
            ctx.fillStyle = CONFIG.colors[0]; ctx.fillRect(boardX, boardY, baseSize, baseSize);
            ctx.fillStyle = CONFIG.colors[1]; ctx.fillRect(boardX + cellSize * 9, boardY, baseSize, baseSize);
            ctx.fillStyle = CONFIG.colors[3]; ctx.fillRect(boardX, boardY + cellSize * 9, baseSize, baseSize);
            ctx.fillStyle = CONFIG.colors[2]; ctx.fillRect(boardX + cellSize * 9, boardY + cellSize * 9, baseSize, baseSize);

            ctx.fillStyle = '#FFF';
            const innerSize = cellSize * 4;
            const off = cellSize;
            drawRoundedRect(boardX + off, boardY + off, innerSize, innerSize, 8, 'rgba(255,255,255,0.92)');
            drawRoundedRect(boardX + cellSize * 9 + off, boardY + off, innerSize, innerSize, 8, 'rgba(255,255,255,0.92)');
            drawRoundedRect(boardX + off, boardY + cellSize * 9 + off, innerSize, innerSize, 8, 'rgba(255,255,255,0.92)');
            drawRoundedRect(boardX + cellSize * 9 + off, boardY + cellSize * 9 + off, innerSize, innerSize, 8, 'rgba(255,255,255,0.92)');

            BASE_POS.forEach(playerBases => {
                playerBases.forEach(pos => {
                    let cx = boardX + pos.x * cellSize + cellSize / 2;
                    let cy = boardY + pos.y * cellSize + cellSize / 2;
                    drawHole(cx, cy, cellSize * 0.35);
                });
            });

            ctx.fillStyle = CONFIG.colors[0];
            for (let i = 1; i < 6; i++) ctx.fillRect(boardX + i * cellSize, boardY + 7 * cellSize, cellSize, cellSize);
            ctx.fillStyle = CONFIG.colors[1];
            for (let i = 1; i < 6; i++) ctx.fillRect(boardX + 7 * cellSize, boardY + i * cellSize, cellSize, cellSize);
            ctx.fillStyle = CONFIG.colors[2];
            for (let i = 9; i < 14; i++) ctx.fillRect(boardX + i * cellSize, boardY + 7 * cellSize, cellSize, cellSize);
            ctx.fillStyle = CONFIG.colors[3];
            for (let i = 9; i < 14; i++) ctx.fillRect(boardX + 7 * cellSize, boardY + i * cellSize, cellSize, cellSize);

            ctx.beginPath();
            ctx.moveTo(boardX + 6 * cellSize, boardY + 6 * cellSize);
            ctx.lineTo(boardX + 9 * cellSize, boardY + 6 * cellSize);
            ctx.lineTo(boardX + 9 * cellSize, boardY + 9 * cellSize);
            ctx.lineTo(boardX + 6 * cellSize, boardY + 9 * cellSize);
            ctx.fillStyle = '#f4ecff';
            ctx.fill();

            const cx = boardX + 7.5 * cellSize;
            const cy = boardY + 7.5 * cellSize;

            ctx.fillStyle = CONFIG.colors[0]; ctx.beginPath(); ctx.moveTo(boardX + 6 * cellSize, boardY + 6 * cellSize); ctx.lineTo(boardX + 6 * cellSize, boardY + 9 * cellSize); ctx.lineTo(cx, cy); ctx.fill();
            ctx.fillStyle = CONFIG.colors[1]; ctx.beginPath(); ctx.moveTo(boardX + 6 * cellSize, boardY + 6 * cellSize); ctx.lineTo(boardX + 9 * cellSize, boardY + 6 * cellSize); ctx.lineTo(cx, cy); ctx.fill();
            ctx.fillStyle = CONFIG.colors[2]; ctx.beginPath(); ctx.moveTo(boardX + 9 * cellSize, boardY + 6 * cellSize); ctx.lineTo(boardX + 9 * cellSize, boardY + 9 * cellSize); ctx.lineTo(cx, cy); ctx.fill();
            ctx.fillStyle = CONFIG.colors[3]; ctx.beginPath(); ctx.moveTo(boardX + 6 * cellSize, boardY + 9 * cellSize); ctx.lineTo(boardX + 9 * cellSize, boardY + 9 * cellSize); ctx.lineTo(cx, cy); ctx.fill();
        }

        function drawMarble(x, y, radius, color, heightOffset = 0) {
            ctx.beginPath();
            let shadowScale = 1 - (heightOffset / 50);
            ctx.ellipse(x, y + heightOffset + radius * 0.58, radius * shadowScale, radius * 0.62 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.32)';
            ctx.fill();

            let drawY = y - heightOffset;
            ctx.beginPath();
            ctx.arc(x, drawY, radius * 1.18, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fill();

            let grad = ctx.createRadialGradient(x - radius * 0.28, drawY - radius * 0.35, radius * 0.12, x, drawY, radius);
            grad.addColorStop(0, '#FFF');
            grad.addColorStop(0.28, color);
            grad.addColorStop(1, '#160b29');

            ctx.beginPath();
            ctx.arc(x, drawY, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, drawY, radius * 0.74, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x - radius * 0.3, drawY - radius * 0.32, radius * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x + radius * 0.28, drawY + radius * 0.24, radius * 0.14, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 224, 138, 0.18)';
            ctx.fill();
        }

        function drawTokens() {
            const { cellSize, boardX, boardY } = dims;

            state.players.forEach((p, pIdx) => {
                p.tokens.forEach(t => {
                    if (state.animatingToken && state.animatingToken.token === t) {
                        let anim = state.animatingToken;
                        let s = anim.startCoords;
                        let e = anim.targetCoords;

                        let sx = boardX + s.x * cellSize + cellSize / 2;
                        let sy = boardY + s.y * cellSize + cellSize / 2;
                        let ex = boardX + e.x * cellSize + cellSize / 2;
                        let ey = boardY + e.y * cellSize + cellSize / 2;

                        let tx = sx + (ex - sx) * anim.progress;
                        let ty = sy + (ey - sy) * anim.progress;

                        let h = Math.sin(anim.progress * Math.PI) * CONFIG.hopHeight;

                        drawMarble(tx, ty, cellSize * 0.35, CONFIG.colors[pIdx], h);
                    } else {
                        let coords = getCoords(pIdx, t);
                        let x = boardX + coords.x * cellSize + cellSize / 2;
                        let y = boardY + coords.y * cellSize + cellSize / 2;

                        if (state.waitingForMove && pIdx === state.turn && canMove(t, state.diceVal)) {
                            let pulse = Math.sin(Date.now() / 150) * 5;
                            ctx.beginPath();
                            ctx.arc(x, y, cellSize * 0.45 + pulse / 2, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                        }

                        drawMarble(x, y, cellSize * 0.35, CONFIG.colors[pIdx], 0);
                    }
                });
            });
        }

        function loop() {
            updateAnimation();

            ctx.clearRect(0, 0, dims.width, dims.height);
            drawBoard();
            if (state.gameActive) drawTokens();

            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('click', handleInput);
        document.getElementById('controls').addEventListener('click', handleInput);
        document.getElementById('controls').addEventListener('touchstart', handleInput, { passive: false });

        feedback.init();

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').style.opacity = 1;
            document.getElementById('controls').style.opacity = 1;
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('restart');
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').style.opacity = 1;
            document.getElementById('controls').style.opacity = 1;
            initGame();
        });

        resize();
        loop();
    </script>
</body>
