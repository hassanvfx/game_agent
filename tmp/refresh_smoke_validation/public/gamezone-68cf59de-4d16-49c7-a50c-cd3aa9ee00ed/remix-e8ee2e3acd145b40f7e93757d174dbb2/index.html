<style>

*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050713;color:var(--cream);font-family:'Rajdhani',system-ui,sans-serif;touch-action:none}

button{font:inherit}.hidden{display:none!important}.font-display{font-family:'Audiowide','Trebuchet MS',sans-serif}.font-ui{font-family:'Rajdhani',system-ui,sans-serif}.layout-root{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;background:linear-gradient(180deg,#07142a 0%,#0a1026 44%,#08040b 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}.ui-layer{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,calc(env(safe-area-inset-top) + 12px)) max(12px,calc(env(safe-area-inset-right) + 12px)) max(14px,calc(env(safe-area-inset-bottom) + 14px)) max(12px,calc(env(safe-area-inset-left) + 12px))}.interactive{pointer-events:auto}.glass{background:linear-gradient(180deg,rgba(12,18,37,.84),rgba(7,7,18,.62));border:1px solid var(--edge);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 12px 30px rgba(0,0,0,.32),0 0 28px rgba(98,232,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brief{position:absolute;z-index:12;top:max(12px,calc(env(safe-area-inset-top) + 10px));left:max(12px,calc(env(safe-area-inset-left) + 10px));right:max(12px,calc(env(safe-area-inset-right) + 10px));border-radius:20px;padding:12px 14px;max-width:460px;pointer-events:auto}.brief h1{margin:0 0 6px;font-size:clamp(22px,6.4vw,38px);line-height:1;color:var(--red);letter-spacing:.12em;text-shadow:0 0 18px rgba(255,54,95,.55),2px 2px 0 rgba(98,232,255,.16)}.brief p{margin:0;color:#d7edff;font-size:clamp(15px,4.2vw,19px);line-height:1.18}.status-chip{display:inline-flex;align-items:center;gap:8px;margin-top:9px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,214,109,.24);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(11px,3.2vw,14px);color:#ffe7a8}.status-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.hud-row{display:flex;align-items:flex-start;justify-content:space-between;width:100%;transition:opacity .25s}.pill{border-radius:999px;padding:9px 13px}.score-text{font-family:'Audiowide',sans-serif;font-size:clamp(12px,3.7vw,18px);letter-spacing:.1em;color:var(--cyan);text-shadow:0 0 12px rgba(98,232,255,.42)}.score-value{color:var(--cream)}.pressure{align-self:flex-end;margin-top:auto;margin-left:auto;max-width:55%;text-align:right;color:#ffc4d0;font-size:clamp(12px,3.1vw,15px);letter-spacing:.07em;text-transform:uppercase;opacity:.92}.shaking{animation:glitch .28s infinite;color:#ffd5de}.overlay{position:absolute;inset:0;z-index:30;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 36%,rgba(255,54,95,.28),transparent 28%),rgba(3,2,8,.95)}.end-title{font-family:'Audiowide';font-size:clamp(42px,11vw,92px);line-height:.96;margin:0 0 18px;color:var(--red);letter-spacing:.12em;text-shadow:0 0 28px rgba(255,54,95,.65);animation:pulse 1.3s infinite}.end-subtitle{max-width:540px;margin:0 0 22px;color:#ffe4d8;font-size:clamp(18px,5vw,27px);line-height:1.12}.restart-btn{min-width:184px;min-height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.3);color:white;font-weight:800;letter-spacing:.09em;padding:12px 24px;background:linear-gradient(180deg,rgba(255,54,95,.35),rgba(98,232,255,.16));box-shadow:0 0 24px rgba(255,54,95,.22)}.restart-btn:active{transform:scale(.97)}.feedback-gif{position:absolute;right:12px;bottom:18px;width:clamp(78px,22vw,122px);aspect-ratio:1;object-fit:cover;border-radius:18px;border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 28px rgba(0,0,0,.35);opacity:0;transform:translateY(8px) scale(.94);transition:opacity .18s,transform .18s;pointer-events:none;z-index:16}.feedback-gif.visible{opacity:.92;transform:translateY(0) scale(1)}.feedback-gif.fail-state{left:50%;top:50%;right:auto;bottom:auto;width:min(42vw,165px);transform:translate(-50%,-50%) scale(.92);z-index:31;border-color:rgba(255,54,95,.5)}.feedback-gif.fail-state.visible{transform:translate(-50%,-50%) scale(1)}
@keyframes glitch{0%,100%{transform:translate(0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(1px,1px)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.018);opacity:.88}}
@media (min-aspect-ratio: 9/12){.brief{max-width:390px}.score-text{font-size:16px}}@media (max-width:430px){.pill{padding:8px 10px}.brief{padding:11px 12px}.pressure{max-width:60%}}

<body>
<div id="game-container" class="layout-root">
  <canvas id="gameCanvas"></canvas>
  <section id="mission-brief" class="brief glass interactive">
    <h1 class="font-display">HAWKINS<br>RIFT RIDERS</h1>
    <p class="font-ui">Tap two clue dossiers. Link every matching friend signal before the shadow gate answers.</p>
    <div class="status-chip font-ui"><span class="status-dot"></span><span id="channel-status">PARTY CHANNEL OPEN</span></div>
  </section>
  <img id="reward-gif" class="feedback-gif" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="friend clue linked animation" decoding="async" loading="lazy">
  <img id="fail-gif" class="feedback-gif fail-state" src="https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp" alt="shadow breach reaction" decoding="async" loading="lazy">
  <div id="ui-layer" class="ui-layer">
    <div id="hud" class="hud-row">
      <div class="glass pill"><span id="score-label" class="score-text">CLUES LINKED: <span id="score-val" class="score-value">0</span></span></div>
    </div>
    <div id="pressure-note" class="pressure glass pill">RIFT PRESSURE LOW</div>

      <p id="end-subtitle" class="end-subtitle">The party solved the map, but something on the other side learned the route.</p>
      <button id="restart-btn" class="restart-btn glass interactive">RIDE AGAIN</button>
    </div>
  </div>
</div>
<script>
const CONFIG_DEFS=JSON.parse(document.getElementById('game-config').textContent);window.gameConfig=Object.fromEntries(Object.entries(CONFIG_DEFS).map(([k,v])=>[k,v.value]));
let canvas,ctx,cw=0,ch=0,dpr=1,lastTime=0,initialized=false,gameState='PLAYING',sanity=1,shakeIntensity=0;
let audioCtx,audioBuffers={},warningPlayed=false,lastSfxTimes={},cards=[],particles=[],matches=0,totalPairs=8,flippedCards=[],isProcessingMatch=false;
const SFX_DEBOUNCE_MS=120;
const mediaEls={bgm:document.getElementById('bgm_main'),rewardGif:document.getElementById('reward-gif'),failGif:document.getElementById('fail-gif')};
const gifTimers={reward:null,fail:null};
const SYMBOLS_CLEAR=['🚲','📻','🔦','🧇','🎲','📼','⭐','🔑'];
const SYMBOLS_DARK=['🕳️','🦇','🩸','⚠️','👁️','🕷️','🌑','🦷'];
const LABELS=['BIKE','WALKIE','LAMP','WAFFLE','DICE','TAPE','STAR','KEY'];
const GLITCH_TEXTS=['RUN','RIGHT HERE','FRIENDS','GATE','UPSIDE'];
function q(id){return document.getElementById(id)}
async function initAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();const loadBuffer=async(id,url)=>{try{const u=new URL(url,location.href);if(u.origin!==location.origin)return;const r=await fetch(u.href);const a=await r.arrayBuffer();audioBuffers[id]=await audioCtx.decodeAudioData(a)}catch(e){}};await Promise.all(['flip','match','collect','fail','warning','scare','restart'].map(id=>loadBuffer(id,q('sfx_'+id)?.src||'')))}
function unlockAudio(){if(!audioCtx)initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();const bgm=mediaEls.bgm;if(bgm&&bgm.paused){bgm.volume=.18;bgm.play().catch(()=>{})}}
function setBgmState(play){const bgm=mediaEls.bgm;if(!bgm)return;if(play){if(bgm.paused)bgm.play().catch(()=>{})}else if(!bgm.paused)bgm.pause()}
function playSfx(id,rate=1,vol=1){const now=performance.now();if(lastSfxTimes[id]&&now-lastSfxTimes[id]<SFX_DEBOUNCE_MS)return;lastSfxTimes[id]=now;if(!audioCtx||!audioBuffers[id]){if(['flip','match','collect','restart'].includes(id))synthesize('beep');else synthesize('noise');return}const s=audioCtx.createBufferSource();s.buffer=audioBuffers[id];s.playbackRate.value=rate;const g=audioCtx.createGain();g.gain.value=vol;s.connect(g);g.connect(audioCtx.destination);s.start(0)}
function synthesize(type){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);if(type==='beep'){o.type='triangle';o.frequency.setValueAtTime(620,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(280,audioCtx.currentTime+.12);g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.12);o.start();o.stop(audioCtx.currentTime+.12)}else{o.type='sawtooth';o.frequency.setValueAtTime(55,audioCtx.currentTime);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.34);o.start();o.stop(audioCtx.currentTime+.34)}}
function showGif(kind,duration=1200){const el=kind==='reward'?mediaEls.rewardGif:mediaEls.failGif;clearTimeout(gifTimers[kind]);el.classList.add('visible');gifTimers[kind]=setTimeout(()=>el.classList.remove('visible'),duration)}
function resetFeedbackMedia(){mediaEls.rewardGif.classList.remove('visible');mediaEls.failGif.classList.remove('visible');clearTimeout(gifTimers.reward);clearTimeout(gifTimers.fail)}
function vibrate(style){window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}});if(navigator.vibrate){const m={light:18,medium:38,heavy:[70,35,70]};navigator.vibrate(m[style]||12)}}
class Particle{constructor(x,y,color,kind='spark'){this.x=x;this.y=y;this.vx=(Math.random()-.5)*(kind==='rift'?13:9);this.vy=(Math.random()-.5)*(kind==='rift'?13:9)-1;this.life=1;this.color=color;this.kind=kind;this.size=Math.random()*5+2;this.spin=Math.random()*Math.PI}update(dt){this.x+=this.vx;this.y+=this.vy;this.vy+=dt*8;this.life-=dt*(this.kind==='rift'?1.45:1.9);this.size*=.97;this.spin+=dt*6}draw(ctx){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.spin);ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=12;if(this.kind==='rift'){ctx.fillRect(-this.size*.35,-this.size*1.2,this.size*.7,this.size*2.4)}else{ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function spawnParticles(x,y,count,color,kind='spark'){for(let i=0;i<count;i++)particles.push(new Particle(x,y,color,kind))}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
class Card{constructor(id,gx,gy,symbolIndex){this.id=id;this.gridX=gx;this.gridY=gy;this.symbolIndex=symbolIndex;this.state='HIDDEN';this.scaleX=1;this.targetScaleX=1;this.glitchOffset={x:0,y:0};this.idlePhase=Math.random()*Math.PI*2;this.x=0;this.y=0;this.w=0;this.h=0}update(dt){const speed=10;if(Math.abs(this.scaleX-this.targetScaleX)>.01)this.scaleX+=(this.targetScaleX-this.scaleX)*speed*dt;else this.scaleX=this.targetScaleX;if(sanity<.5&&Math.random()<(1-sanity)*.1){this.glitchOffset.x=(Math.random()-.5)*10;this.glitchOffset.y=(Math.random()-.5)*10}else{this.glitchOffset.x=0;this.glitchOffset.y=0}this.idlePhase+=dt*(1.5+this.symbolIndex*.05)}draw(ctx){if(this.state==='MATCHED'&&sanity>.3)return;const dx=this.x+this.w/2+this.glitchOffset.x,dy=this.y+this.h/2+this.glitchOffset.y,w=this.w,h=this.h,pulse=Math.sin(this.idlePhase)*.5+.5;ctx.save();ctx.translate(dx,dy);ctx.scale(this.scaleX,1);const isFaceUp=this.scaleX<0||this.state==='FLIPPED'||(this.state==='MATCHED'&&sanity<=.3);const edge=sanity>.5?'#62e8ff':'#ff365f',warm=sanity>.5?'#ffd66d':'#ff9eb0';ctx.shadowBlur=18;ctx.shadowColor=sanity>.5?'rgba(98,232,255,.32)':'rgba(255,54,95,.36)';let g=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);if(isFaceUp){g.addColorStop(0,sanity>.5?'#fff4db':'#321018');g.addColorStop(.48,sanity>.5?'#dfebff':'#16070d');g.addColorStop(1,sanity>.5?'#b8d7ff':'#050206')}else{g.addColorStop(0,sanity>.5?'#182847':'#21101a');g.addColorStop(1,sanity>.5?'#070d1c':'#080207')}rr(ctx,-w/2,-h/2,w,h,16);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle=isFaceUp?warm:edge;ctx.stroke();rr(ctx,-w/2+7,-h/2+7,w-14,h-14,11);ctx.strokeStyle=sanity>.5?`rgba(255,255,255,${.12+pulse*.24})`:'rgba(255,80,110,.22)';ctx.lineWidth=1.5;ctx.stroke();
if(isFaceUp){ctx.save();ctx.scale(-1,1);ctx.textAlign='center';ctx.textBaseline='middle';const symbolSize=Math.min(w,h)*.38;let char=sanity>.5?SYMBOLS_CLEAR[this.symbolIndex]:SYMBOLS_DARK[this.symbolIndex];if(sanity<.38&&Math.random()<.22){char=GLITCH_TEXTS[Math.floor(Math.random()*GLITCH_TEXTS.length)][0];ctx.fillStyle='#ff365f'}else ctx.fillStyle=sanity>.5?'#171124':'#ffe1e8';ctx.shadowColor=sanity>.5?'rgba(255,214,109,.45)':'rgba(255,54,95,.55)';ctx.shadowBlur=12;ctx.font=`${symbolSize}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.fillText(char,0,-h*.12);ctx.shadowBlur=0;const bw=w*.66,bh=Math.max(18,h*.16),by=h*.25;rr(ctx,-bw/2,by-bh/2,bw,bh,999);ctx.fillStyle=sanity>.5?'rgba(9,24,46,.9)':'rgba(91,14,35,.9)';ctx.fill();ctx.font=`${Math.max(10,w*.085)}px Audiowide`;ctx.fillStyle=sanity>.5?'#62e8ff':'#ffd2de';ctx.fillText(LABELS[this.symbolIndex],0,by+1);ctx.font=`${Math.max(8,w*.065)}px Rajdhani`;ctx.fillStyle=sanity>.5?'#ffe7a8':'#ff98ad';ctx.fillText('FRIEND CLUE',0,by+bh*.78);ctx.restore()}else{ctx.save();ctx.strokeStyle=edge;ctx.fillStyle='rgba(98,232,255,.08)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-h*.12,w*.18,h*.13,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(-w*.08,-h*.12,w*.12,0,Math.PI*2);ctx.arc(w*.08,-h*.12,w*.12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-w*.22,h*.06);ctx.quadraticCurveTo(0,h*.17,w*.22,h*.06);ctx.strokeStyle=warm;ctx.stroke();ctx.font=`${Math.max(11,w*.095)}px Audiowide`;ctx.textAlign='center';ctx.fillStyle=sanity>.5?'#c8f7ff':'#ff9fb2';ctx.fillText('RIDE',0,h*.29);ctx.restore()}ctx.restore()}}
function drawBackground(t){const pressure=1-sanity;const sky=ctx.createLinearGradient(0,0,0,ch);sky.addColorStop(0,`rgb(${7+pressure*10},${18-pressure*10},${42-pressure*28})`);sky.addColorStop(.55,'#070a1b');sky.addColorStop(1,'#050207');ctx.fillStyle=sky;ctx.fillRect(0,0,cw,ch);const portalX=cw*.52,portalY=ch*(.27+pressure*.04),portalR=Math.min(cw,ch)*(.16+pressure*.08);ctx.save();ctx.translate(portalX,portalY);for(let i=0;i<6;i++){ctx.rotate(.35+t*.00008);ctx.beginPath();ctx.ellipse(0,0,portalR*(1+i*.08),portalR*(.32+i*.05),0,0,Math.PI*2);ctx.strokeStyle=`rgba(255,54,95,${.13+i*.035+pressure*.08})`;ctx.lineWidth=3;ctx.shadowColor='#ff365f';ctx.shadowBlur=18;ctx.stroke()}ctx.restore();ctx.shadowBlur=0;for(let i=0;i<14;i++){const x=(i/13)*cw;const y=ch*.18+Math.sin(i*1.7+t*.001)*12;ctx.strokeStyle='rgba(255,214,109,.2)';ctx.beginPath();if(i>0)ctx.lineTo(x,y);ctx.arc(x,y,3+Math.sin(t*.004+i)*1.2,0,Math.PI*2);ctx.stroke();ctx.fillStyle=i%3===0?'#ffd66d':i%3===1?'#62e8ff':'#ff365f';ctx.globalAlpha=.42+Math.sin(t*.004+i)*.18;ctx.fill();ctx.globalAlpha=1}ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(0,ch*.76,cw,ch*.24);ctx.fillStyle='rgba(9,13,23,.88)';ctx.fillRect(0,ch*.66,cw,ch*.12);ctx.fillStyle='rgba(15,18,30,.92)';for(let i=0;i<5;i++){const bx=i*cw/4-20;ctx.fillRect(bx,ch*.58-(i%2)*18,60,ch*.1+(i%2)*18);ctx.fillStyle='rgba(255,214,109,.18)';ctx.fillRect(bx+11,ch*.6,8,8);ctx.fillRect(bx+35,ch*.62,8,8);ctx.fillStyle='rgba(15,18,30,.92)'}ctx.strokeStyle='rgba(98,232,255,.2)';ctx.lineWidth=2;for(let i=0;i<5;i++){const y=ch*.83+i*18;ctx.beginPath();ctx.moveTo(cw*.08,y);ctx.quadraticCurveTo(cw*.5,y-35+Math.sin(t*.001+i)*5,cw*.92,y);ctx.stroke()}ctx.strokeStyle=`rgba(255,54,95,${.13+pressure*.22})`;ctx.lineWidth=2;for(let i=0;i<7;i++){const x=(i+1)*cw/8;ctx.beginPath();ctx.moveTo(x,ch*.44);ctx.bezierCurveTo(x+Math.sin(t*.001+i)*30,ch*.52,x-25,ch*.62,x+Math.cos(t*.001+i)*42,ch*.75);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<26;i++){const x=(i*83+t*.018)%cw,y=(i*47)%ch;ctx.globalAlpha=.08+pressure*.14;ctx.beginPath();ctx.arc(x,y,1.2+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function initGame(){if(initialized)return;cards=[];particles=[];flippedCards=[];matches=0;sanity=1;shakeIntensity=0;isProcessingMatch=false;warningPlayed=false;resetFeedbackMedia();let indices=[];for(let i=0;i<totalPairs;i++)indices.push(i,i);for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}for(let i=0;i<16;i++)cards.push(new Card(i,i%4,Math.floor(i/4),indices[i]));recalcLayout();gameState='PLAYING';q('hud').style.opacity='1';q('game-over-screen').classList.add('hidden');q('score-label').className='score-text';q('score-label').innerHTML='CLUES LINKED: <span id="score-val" class="score-value">0</span>';q('pressure-note').textContent='RIFT PRESSURE LOW';q('channel-status').textContent='PARTY CHANNEL OPEN';document.querySelector('.status-dot').style.cssText='';q('end-title').innerHTML='SHADOW<br>BREACH';q('end-subtitle').innerText='The party solved the map, but something on the other side learned the route.';const bgm=mediaEls.bgm;bgm.playbackRate=1;bgm.volume=.18;setBgmState(true);initialized=true;lastTime=performance.now();requestAnimationFrame(loop);publishDebug()}
function recalcLayout(){if(!cards.length)return;const cols=4,rows=4,gap=Math.max(8,Math.min(12,cw*.025));const topReserve=Math.min(190,Math.max(136,ch*.22));const bottomReserve=Math.min(90,Math.max(62,ch*.09));const pad=Math.max(14,Math.min(24,cw*.05));const availW=cw-pad*2;const availH=ch-topReserve-bottomReserve;let cardW=(availW-(cols-1)*gap)/cols;let cardH=cardW*1.28;if(cardH*rows+gap*(rows-1)>availH){cardH=(availH-gap*(rows-1))/rows;cardW=cardH/1.28}const startX=(cw-(cardW*cols+gap*(cols-1)))/2;const startY=topReserve+(availH-(cardH*rows+gap*(rows-1)))/2;cards.forEach(c=>{c.w=cardW;c.h=cardH;c.x=startX+c.gridX*(cardW+gap);c.y=startY+c.gridY*(cardH+gap)})}
function handleInput(e){unlockAudio();if(gameState==='GAMEOVER'){restartGame();return}if(gameState!=='PLAYING'||isProcessingMatch)return;const rect=canvas.getBoundingClientRect();const tx=e.clientX-rect.left,ty=e.clientY-rect.top;for(const c of cards){if(tx>=c.x&&tx<=c.x+c.w&&ty>=c.y&&ty<=c.y+c.h){if(c.state==='HIDDEN')flipCard(c);break}}}
function flipCard(card){playSfx('flip',sanity<.5?.88:1.1,.34);card.state='FLIPPED';card.targetScaleX=-1;flippedCards.push(card);if(flippedCards.length===2){isProcessingMatch=true;setTimeout(checkMatch,600)}}
function checkMatch(){const [c1,c2]=flippedCards;if(!c1||!c2){flippedCards=[];isProcessingMatch=false;return}if(c1.symbolIndex===c2.symbolIndex){c1.state='MATCHED';c2.state='MATCHED';matches++;sanity-=window.gameConfig.sanityDecay||.15;if(sanity<0)sanity=0;if(sanity>.5){spawnParticles(c1.x+c1.w/2,c1.y+c1.h/2,20,'#ffd66d');spawnParticles(c2.x+c2.w/2,c2.y+c2.h/2,20,'#62e8ff');vibrate('light');playSfx('match',1.04,.44);playSfx('collect',1.1,.36);showGif('reward',1050)}else{spawnParticles(c1.x+c1.w/2,c1.y+c1.h/2,28,'#ff365f','rift');spawnParticles(c2.x+c2.w/2,c2.y+c2.h/2,28,'#080000','rift');vibrate('medium');playSfx('collect',.82,.34);playSfx('scare',.7,.22);showGif('fail',850);shakeIntensity=10}updateUI();if(matches===totalPairs)triggerEnding()}else{c1.state='HIDDEN';c2.state='HIDDEN';c1.targetScaleX=1;c2.targetScaleX=1;playSfx('fail',.96,.38);showGif('fail',800)}flippedCards=[];isProcessingMatch=false;publishDebug()}
function updateUI(){const scoreVal=q('score-val'),scoreLabel=q('score-label'),bgm=mediaEls.bgm,status=q('channel-status'),dot=document.querySelector('.status-dot'),pressure=q('pressure-note');if(scoreVal)scoreVal.innerText=matches;bgm.playbackRate=.68+sanity*.32;bgm.volume=Math.min(.2,.11+sanity*.08);if(sanity<.6){scoreLabel.className='score-text shaking';scoreLabel.innerHTML=`RIFT PRESSURE: <span style="color:#ff9db1;">${Math.floor((1-sanity)*100)}%</span>`;status.textContent='PARTY CHANNEL BREAKING';pressure.textContent='BIKES KEEP MOVING';dot.style.background='#ff365f';dot.style.boxShadow='0 0 12px rgba(255,54,95,.85)';if(!warningPlayed){playSfx('warning',.95,.3);warningPlayed=true}}if(sanity<.3){scoreLabel.innerHTML='HOLD THE LIGHTS';status.textContent='SHADOW IN THE WIRES';pressure.textContent='RIFT PRESSURE CRITICAL'}}
function triggerEnding(){gameState='LOCKED';setTimeout(()=>{playSfx('scare',1,.78);vibrate('heavy');showGif('fail',1600);shakeIntensity=50;setBgmState(false);let flash=0;const flashInt=setInterval(()=>{document.body.style.backgroundColor=flash%2===0?'#020104':'#8a1029';flash++;if(flash>10){clearInterval(flashInt);gameState='GAMEOVER';q('game-over-screen').classList.remove('hidden');q('hud').style.opacity='0';publishDebug()}},50)},500)}
function restartGame(){unlockAudio();playSfx('restart',1,.42);initialized=false;document.body.style.backgroundColor='';setTimeout(()=>initGame(),80)}
function loop(timestamp){if(!initialized)return;const dt=Math.min((timestamp-lastTime)/1000,.05);lastTime=timestamp;let sx=0,sy=0;if(shakeIntensity>0){sx=(Math.random()-.5)*shakeIntensity;sy=(Math.random()-.5)*shakeIntensity;shakeIntensity*=.9}ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground(timestamp);ctx.translate(sx,sy);if(sanity<.4&&Math.random()<.05){ctx.save();ctx.font='72px Audiowide';ctx.fillStyle='rgba(255,54,95,.14)';ctx.translate(cw/2,ch/2);ctx.rotate((Math.random()-.5)*.45);ctx.textAlign='center';ctx.fillText(GLITCH_TEXTS[Math.floor(Math.random()*GLITCH_TEXTS.length)],0,0);ctx.restore()}cards.forEach(c=>{c.update(dt);c.draw(ctx)});for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.update(dt);p.draw(ctx);if(p.life<=0)particles.splice(i,1)}if(sanity<.5){ctx.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<ch;y+=4)ctx.fillRect(0,y,cw,1)}requestAnimationFrame(loop)}
function resize(){const rect=q('game-container').getBoundingClientRect();cw=rect.width;ch=rect.height;dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);if(initialized)recalcLayout();else initGame();publishDebug()}
function publishDebug(){window.__gameDebug={cards,matches,totalPairs,sanity,gameState,isProcessingMatch,getCardCenters:()=>cards.map(c=>({id:c.id,symbolIndex:c.symbolIndex,state:c.state,x:c.x+c.w/2,y:c.y+c.h/2,w:c.w,h:c.h})),forceMatch:()=>{const groups={};cards.filter(c=>c.state==='HIDDEN').forEach(c=>(groups[c.symbolIndex]??=[]).push(c));const pair=Object.values(groups).find(g=>g.length>=2);if(pair){flipCard(pair[0]);setTimeout(()=>flipCard(pair[1]),80);return pair.map(c=>c.id)}return null},completeGame:()=>{cards.forEach(c=>{c.state='MATCHED';c.targetScaleX=-1});matches=totalPairs;sanity=0;updateUI();triggerEnding()}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setBgmState(false);else if(initialized&&gameState==='PLAYING')setBgmState(true)});
document.addEventListener('DOMContentLoaded',()=>{canvas=q('gameCanvas');const ro=new ResizeObserver(()=>resize());ro.observe(q('game-container'));canvas.addEventListener('pointerdown',handleInput,{passive:true});q('restart-btn').addEventListener('click',e=>{e.stopPropagation();restartGame()});});
</script>
