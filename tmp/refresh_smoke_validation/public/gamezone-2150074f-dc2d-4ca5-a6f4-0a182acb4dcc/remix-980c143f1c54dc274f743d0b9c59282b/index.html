<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Void Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title -> Orbitron, ui/body -> Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070f;
            --bg-deep: #0d1330;
            --bg-horizon: #1e0c42;
            --panel-bg: rgba(9, 14, 30, 0.8);
            --panel-border: rgba(104, 228, 255, 0.28);
            --cyan: #4de8ff;
            --cyan-bright: #8df5ff;
            --cyan-soft: #d6fbff;
            --magenta: #ff4fd8;
            --magenta-soft: #ff9ef0;
            --red: #ff5a7a;
            --red-neon: #ff3366;
            --amber: #ffd96a;
            --green-neon: #6affc3;
            --text-main: #f8fcff;
            --text-muted: #a8b4d8;
            --shadow-deep: rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(77, 232, 255, 0.14), transparent 30%),
                radial-gradient(circle at bottom, rgba(255, 79, 216, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 50%, #05060d 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .transform { transform: translateZ(0); }
        .transition { transition: all 0.25s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 999px; }
        .border-t-4 { border-top-width: 4px; border-top-style: solid; }
        .border-cyan-400 { border-top-color: var(--cyan); }
        .border-red-500 { border-top-color: var(--red); }
        .italic { font-style: italic; }
        .font-bold { font-weight: 700; }
        .text-white { color: var(--text-main); }
        .text-black { color: #031018; }
        .text-cyan-200 { color: var(--cyan-soft); }
        .text-cyan-300 { color: var(--cyan-bright); }
        .text-cyan-400 { color: var(--cyan); }
        .text-red-500 { color: var(--red); }
        .text-gray-400 { color: var(--text-muted); }
        .drop-shadow-lg { text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
        .shadow-lg { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .bg-cyan-500 { background: linear-gradient(180deg, var(--cyan-bright), var(--cyan)); }
        .bg-white { background: linear-gradient(180deg, #ffffff, #d8ecff); }
        .hover\:bg-cyan-400:hover { filter: brightness(1.08); }
        .hover\:bg-gray-200:hover { filter: brightness(1.05); }
        .mt-1 { margin-top: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-10 { padding: 2.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.2; }
        .text-xl { font-size: 1.25rem; line-height: 1.3; }
        .text-3xl { font-size: clamp(1.6rem, 4vw, 2rem); line-height: 1.1; }
        .text-5xl { font-size: clamp(2.25rem, 7vw, 3rem); line-height: 1; }
        .text-6xl { font-size: clamp(2.6rem, 9vw, 4.25rem); line-height: 0.95; }
        .tracking-tighter { letter-spacing: -0.06em; }
        .tracking-widest { letter-spacing: 0.35em; }

        .group {
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 18% 16%, rgba(141, 245, 255, 0.2), transparent 16%),
                radial-gradient(circle at 82% 22%, rgba(255, 79, 216, 0.18), transparent 20%),
                radial-gradient(circle at 50% 85%, rgba(106, 255, 195, 0.16), transparent 22%);
            opacity: 0.9;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), transparent 14%, transparent 86%, rgba(255,255,255,0.03)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
            mix-blend-mode: screen;
            opacity: 0.15;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(14, 24, 48, 0.92), rgba(8, 12, 26, 0.86));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px var(--shadow-deep),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 36px rgba(77, 232, 255, 0.14);
            max-width: min(92vw, 34rem);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(141, 245, 255, 0.14), transparent 28%, transparent 72%, rgba(255, 79, 216, 0.1)),
                radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 25%);
            pointer-events: none;
        }

        .neon-text {
            text-shadow: 0 0 12px rgba(77, 232, 255, 0.5), 0 0 28px rgba(255, 79, 216, 0.24);
        }

        .neon-button {
            position: relative;
            box-shadow:
                0 10px 22px rgba(77, 232, 255, 0.2),
                0 0 18px rgba(77, 232, 255, 0.24);
            border: none;
            cursor: pointer;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
        }

        .neon-button:hover {
            box-shadow:
                0 12px 28px rgba(77, 232, 255, 0.28),
                0 0 24px rgba(77, 232, 255, 0.36);
        }

        .neon-button::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.28);
            pointer-events: none;
        }

        .active\:scale-95:active {
            transform: scale(0.95);
        }

        .animate-pulse {
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        @keyframes drift {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -4px, 0); }
        }

        #ui-layer {
            padding: 1rem;
        }

        #start-btn,
        #restart-btn,
        .glass-panel {
            touch-action: manipulation;
        }

        #start-screen,
        #game-over-screen {
            margin: auto;
        }

        #start-screen {
            animation: none;
        }

        #start-screen .character-card,
        #start-screen .support-copy {
            animation: drift 3s ease-in-out infinite;
        }

        #hud {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .title-font,
        .hud-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .support-copy {
            max-width: 24rem;
            margin-inline: auto;
        }

        .ui-copy {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .feedback-overlay {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(28vw, 8.5rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 1px solid rgba(141, 245, 255, 0.26);
            background: rgba(5, 10, 22, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(77, 232, 255, 0.14);
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 6;
        }

        .feedback-overlay.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feedback-overlay span {
            position: absolute;
            left: 0.55rem;
            bottom: 0.45rem;
            padding: 0.18rem 0.45rem;
            border-radius: 999px;
            background: rgba(3, 16, 24, 0.78);
            color: var(--cyan-soft);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 0.58rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .identity-strip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.8rem;
            margin-bottom: 1rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            color: var(--cyan-soft);
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: 1px solid rgba(141, 245, 255, 0.18);
        }

        .identity-strip .avatar {
            display: inline-grid;
            place-items: center;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 30%, #ffffff, var(--cyan) 60%, #08657e 100%);
            box-shadow: 0 0 18px rgba(77, 232, 255, 0.34);
            font-size: 0.9rem;
        }

        .character-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            margin: 0 auto 1.35rem;
            padding: 0.85rem 1rem;
            max-width: 18rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
            border: 1px solid rgba(141, 245, 255, 0.16);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
        }

        .hero-token {
            position: relative;
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 1.25rem;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, #ffffff, rgba(255,255,255,0.7) 12%, rgba(141,245,255,0.15) 13%),
                linear-gradient(180deg, rgba(77, 232, 255, 0.95), rgba(35, 119, 246, 0.88));
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12) inset,
                0 0 20px rgba(77, 232, 255, 0.28),
                0 14px 28px rgba(0,0,0,0.24);
            font-size: 2rem;
            transform: rotate(-6deg);
        }

        .hero-token::before,
        .hero-token::after {
            content: "";
            position: absolute;
            bottom: -0.25rem;
            width: 0.8rem;
            height: 1rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--amber), rgba(255, 90, 122, 0));
            filter: blur(0.5px);
            opacity: 0.92;
        }

        .hero-token::before { left: 0.8rem; transform: rotate(6deg); }
        .hero-token::after { right: 0.8rem; transform: rotate(-6deg); }

        .character-copy {
            text-align: left;
        }

        .character-copy strong {
            display: block;
            color: var(--cyan-soft);
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            margin-bottom: 0.15rem;
        }

        .character-copy span {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.25;
        }

        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.35rem;
            padding: 0.22rem 0.65rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(141, 245, 255, 0.2);
            color: var(--cyan-soft);
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .hud-badge .avatar {
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .px-10 { padding-left: 1.5rem; padding-right: 1.5rem; }
            .tracking-widest { letter-spacing: 0.2em; }

            #hud {
                top: 1rem;
                left: 1rem;
            }

            .character-card {
                gap: 0.75rem;
                padding: 0.75rem 0.85rem;
            }

            .hero-token {
                width: 4rem;
                height: 4rem;
                font-size: 1.8rem;
            }

            .identity-strip {
                font-size: 0.72rem;
                letter-spacing: 0.14em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-2xl text-center pointer-events-auto transform transition duration-300 border-t-4 border-cyan-400">
                <div class="identity-strip"><span class="avatar">🚀</span><span>Nova Pulse Pilot</span></div>
                <div class="character-card" aria-hidden="true">
                    <div class="hero-token">🤖</div>
                    <div class="character-copy">
                        <strong>Void Skipper</strong>
                        <span>Thread the neon storm, harvest bright cores, and slip past razor drones.</span>
                    </div>
                </div>
                <h1 class="title-font text-6xl font-bold text-white mb-2 neon-text italic tracking-tighter">NEON VOID</h1>
                <p class="title-font text-cyan-200 text-xl mb-8 animate-pulse tracking-widest">RUNNER</p>
                <div class="support-copy ui-copy mb-6 text-gray-400 text-sm">Drag to steer through the lane. Dodge red hazards and collect blue energy.</div>
                <button id="start-btn" class="neon-button bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 px-10 rounded-full transition active:scale-95">INITIATE RUN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-2xl text-center pointer-events-auto border-t-4 border-red-500">
                <div class="identity-strip"><span class="avatar">⚠️</span><span>Signal Lost</span></div>
                <h2 class="title-font text-5xl font-bold text-red-500 mb-2 drop-shadow-lg">SYSTEM FAILURE</h2>
                <div class="text-3xl text-white mb-8">Score: <span id="finalScore" class="text-cyan-400">0</span></div>
                <button id="restart-btn" class="neon-button bg-white text-black font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-200 transition">REBOOT SYSTEM</button>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback overlays -> catalogs/gifs.json -->
            <div id="collect-overlay" class="feedback-overlay pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Reward pulse feedback">
                <span>core surge</span>
            </div>
            <div id="danger-overlay" class="feedback-overlay pointer-events-none" aria-hidden="true">
                <img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash warning feedback">
                <span>void crash</span>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-6 left-6 hidden">
                <div class="hud-badge"><span class="avatar">🤖</span><span>Pilot Online</span></div>
                <div class="hud-font text-3xl font-bold text-white italic neon-text">
                    SCORE: <span id="score">0</span>
                </div>
                <div class="hud-font text-sm text-cyan-300 mt-1">SPEED: <span id="speed-display">100%</span></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                nearMiss: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            },
            gifs: {
                collect: 'collect-overlay',
                crash: 'danger-overlay'
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.unlocked = false;
                this.lastPlayed = {};
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(v);
                    sound.preload = 'auto';
                    this.sfx[k] = sound;
                }
            }

            unlock() {
                this.unlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key, options = {}) {
                const sound = this.sfx[key];
                if (!sound || !this.unlocked) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 120;
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
                this.lastPlayed[key] = now;
                const clone = sound.cloneNode();
                clone.volume = options.volume ?? 0.55;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();
        const overlays = {
            collect: document.getElementById(ASSETS.gifs.collect),
            crash: document.getElementById(ASSETS.gifs.crash)
        };
        let overlayTimers = {};
        
        function pulseOverlay(key, duration = 900) {
            const overlay = overlays[key];
            if (!overlay) return;
            overlay.classList.add('visible');
            clearTimeout(overlayTimers[key]);
            overlayTimers[key] = setTimeout(() => overlay.classList.remove('visible'), duration);
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;
        let difficultyMultiplier = 1;
        
        // Input
        let mouseX = 0;
        
        // Entities
        let player = { x: 0, y: 0, width: 40, height: 40, color: '#4de8ff' };
        let entities = []; // Obstacles and Coins
        let particles = [];
        
        // Grid State
        let gridOffsetY = 0;
        let lastNearMissFrame = -999;

        /** 4. RESIZE & INPUT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 150;
            // Center player initially
            if (!gameActive) mouseX = width / 2;
        }
        window.addEventListener('resize', resize);
        
        // Mouse/Touch Tracking
        const updateInput = (e) => {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            mouseX = clientX;
        };
        window.addEventListener('mousemove', updateInput);
        window.addEventListener('touchmove', updateInput, { passive: false });
        window.addEventListener('touchstart', updateInput, { passive: false });

        /** 5. GAME LOGIC HELPERS */
        function spawnEntity() {
            const isObstacle = Math.random() > 0.3; // 70% obstacle, 30% coin
            const size = isObstacle ? 50 + Math.random() * 30 : 30;
            const x = Math.random() * (width - size);
            
            entities.push({
                x: x,
                y: -100,
                width: size,
                height: size,
                type: isObstacle ? 'obstacle' : 'coin',
                speed: gameSpeed * (isObstacle ? 1 : 0.8), // Coins fall slightly slower
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function drawPlayer(x, y, w, h, color) {
            ctx.save();
            ctx.translate(x, y);

            ctx.shadowBlur = 26;
            ctx.shadowColor = color;

            const shell = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
            shell.addColorStop(0, '#ffffff');
            shell.addColorStop(0.2, '#7cf6ff');
            shell.addColorStop(0.65, color);
            shell.addColorStop(1, '#2e55ff');

            ctx.beginPath();
            ctx.moveTo(0, -h / 2);
            ctx.lineTo(-w / 2.3, h / 3.1);
            ctx.quadraticCurveTo(0, h / 2.15, w / 2.3, h / 3.1);
            ctx.closePath();
            ctx.fillStyle = shell;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -h / 2 + 7);
            ctx.lineTo(-w / 5.5, h / 7);
            ctx.lineTo(w / 5.5, h / 7);
            ctx.closePath();
            ctx.fillStyle = 'rgba(4, 16, 32, 0.85)';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-w / 2.3, h / 3.1);
            ctx.lineTo(-w / 2.9, h / 2.2);
            ctx.lineTo(-w / 8, h / 4.8);
            ctx.closePath();
            ctx.fillStyle = '#ff8de5';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(w / 2.3, h / 3.1);
            ctx.lineTo(w / 2.9, h / 2.2);
            ctx.lineTo(w / 8, h / 4.8);
            ctx.closePath();
            ctx.fillStyle = '#ff8de5';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, -h / 10, w / 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd96a';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-w / 8, h / 3.2);
            ctx.lineTo(0, h / 2.2);
            ctx.lineTo(w / 8, h / 3.2);
            ctx.closePath();
            ctx.fillStyle = '#fff1bd';
            ctx.fill();

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawGrid() {
            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#040712');
            grad.addColorStop(0.45, '#101b40');
            grad.addColorStop(1, '#180727');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const aurora = ctx.createRadialGradient(width * 0.5, height * 0.18, 10, width * 0.5, height * 0.18, width * 0.55);
            aurora.addColorStop(0, 'rgba(77, 232, 255, 0.18)');
            aurora.addColorStop(0.45, 'rgba(255, 79, 216, 0.08)');
            aurora.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aurora;
            ctx.fillRect(0, 0, width, height);

            const skylineY = height * 0.19;
            ctx.strokeStyle = 'rgba(141, 245, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, skylineY);
            ctx.lineTo(width, skylineY);
            ctx.stroke();

            for (let i = 0; i < 18; i++) {
                const towerWidth = width / 28;
                const towerX = (i / 18) * width;
                const towerHeight = 18 + (i % 5) * 10 + ((i * 7) % 3) * 12;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 79, 216, 0.09)' : 'rgba(77, 232, 255, 0.08)';
                ctx.fillRect(towerX, skylineY - towerHeight, towerWidth, towerHeight);
            }

            // Perspective Grid
            ctx.lineWidth = 2;
            
            const centerX = width / 2;
            
            for (let i = -10; i <= 10; i++) {
                ctx.beginPath();
                const startX = centerX + (i * 100);
                const endX = centerX + (i * 400);
                ctx.strokeStyle = i === 0 ? 'rgba(255, 217, 106, 0.24)' : 'rgba(255, 79, 216, 0.18)';
                ctx.moveTo(startX, skylineY);
                ctx.lineTo(endX, height);
                ctx.stroke();
            }

            // Horizontal lines (moving down)
            gridOffsetY = (gridOffsetY + gameSpeed) % 100;
            for (let y = skylineY; y < height; y += 100) {
                const drawY = y + gridOffsetY;
                ctx.beginPath();
                ctx.moveTo(0, drawY);
                ctx.lineTo(width, drawY);
                ctx.strokeStyle = `rgba(77, 232, 255, ${0.08 + (drawY / height) * 0.26})`;
                ctx.stroke();
            }
        }

        /** 6. MAIN LOOP */
        function initGame() {
            score = 0;
            frameCount = 0;
            gameSpeed = 6;
            difficultyMultiplier = 1;
            entities = [];
            particles = [];
            mouseX = width / 2;
            player.x = width / 2;
            resize();
            document.getElementById('score').innerText = score;
            document.getElementById('speed-display').innerText = '100%';
        }

        function gameLoop() {
            if (!gameActive) return;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Background/Grid
            drawGrid();

            // 2. Update Player
            // Smooth movement (Lerp)
            player.x += (mouseX - player.x) * 0.15;
            
            // Clamp player
            if (player.x < player.width / 2) player.x = player.width / 2;
            if (player.x > width - player.width / 2) player.x = width - player.width / 2;

            // Draw Player
            if (Math.random() > 0.42) {
                particles.push({
                    x: player.x + (Math.random() - 0.5) * 12,
                    y: player.y + 18,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: 4.8 + Math.random() * 1.3,
                    life: 0.5,
                    color: Math.random() > 0.5 ? '#ffd96a' : '#ff8de5',
                    size: Math.random() * 2 + 1.5
                });
            }
            drawPlayer(player.x, player.y, player.width, player.height, player.color);

            // 3. Spawner
            if (frameCount % Math.max(20, Math.floor(60 / difficultyMultiplier)) === 0) {
                spawnEntity();
            }
            
            // Increase difficulty
            if (frameCount > 0 && frameCount % 600 === 0) {
                gameSpeed += 0.5;
                difficultyMultiplier += 0.1;
                document.getElementById('speed-display').innerText = Math.floor(difficultyMultiplier * 100) + '%';
            }

            // 4. Update Entities
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                e.y += e.speed;
                e.rotation += e.rotationSpeed;

                // Draw
                ctx.save();
                ctx.translate(e.x + e.width / 2, e.y + e.height / 2);
                ctx.rotate(e.rotation);
                
                if (e.type === 'obstacle') {
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#ff3366';
                    const hazardGrad = ctx.createLinearGradient(-e.width / 2, -e.height / 2, e.width / 2, e.height / 2);
                    hazardGrad.addColorStop(0, '#ffb0cb');
                    hazardGrad.addColorStop(0.35, '#ff5a7a');
                    hazardGrad.addColorStop(1, '#8f123d');
                    ctx.fillStyle = hazardGrad;
                    ctx.beginPath();
                    ctx.moveTo(0, -e.height / 2);
                    ctx.lineTo(e.width / 2, 0);
                    ctx.lineTo(0, e.height / 2);
                    ctx.lineTo(-e.width / 2, 0);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(4, e.width * 0.1), 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.shadowBlur = 18;
                    ctx.shadowColor = '#6affc3';
                    const coinGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, e.width / 2);
                    coinGrad.addColorStop(0, '#ffffff');
                    coinGrad.addColorStop(0.2, '#eafff6');
                    coinGrad.addColorStop(0.6, '#6affc3');
                    coinGrad.addColorStop(1, '#149c7d');
                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, e.width / 3.2, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();

                // Collision
                const dx = player.x - (e.x + e.width / 2);
                const dy = player.y - (e.y + e.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < (player.width / 2 + e.width / 2)) {
                    if (e.type === 'obstacle') {
                        createParticles(player.x, player.y, '#ff3366', 30);
                        pulseOverlay('crash', 1500);
                        gameOver();
                        return;
                    } else {
                        score += 100;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect', { volume: 0.52, cooldown: 100 });
                        pulseOverlay('collect', 850);
                        createParticles(e.x + e.width / 2, e.y + e.height / 2, '#6affc3', 10);
                        entities.splice(i, 1);
                        continue;
                    }
                }

                // Remove off screen
                if (e.y > height + 100) {
                    if (e.type === 'obstacle' && frameCount - lastNearMissFrame > 18) {
                        lastNearMissFrame = frameCount;
                        audio.playSFX('nearMiss', { volume: 0.33, cooldown: 180 });
                    }
                    entities.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }

            // 5. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('crash', { volume: 0.6, cooldown: 50 });
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. CONTROL BINDINGS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.48, cooldown: 50 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.42, cooldown: 50 });
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        // Initial Resize
        resize();
    });
    </script>
</body>
