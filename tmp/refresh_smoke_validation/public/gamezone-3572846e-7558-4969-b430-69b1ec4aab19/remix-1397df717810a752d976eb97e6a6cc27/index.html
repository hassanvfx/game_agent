<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Hype Booth</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        :root {
            --sky-top: #130f28;
            --sky-bottom: #2d1755;
            --panel: rgba(19, 15, 40, 0.72);
            --panel-strong: rgba(33, 21, 66, 0.9);
            --glow-cyan: #8cf4ff;
            --glow-mint: #78ffd6;
            --glow-pink: #ff71c8;
            --accent-gold: #ffd36e;
            --peach: #ffe7db;
            --ink: #eef6ff;
            --ink-dim: #c4d3ff;
            --danger: #ff7a9d;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(140, 244, 255, 0.2), transparent 38%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }
        body {
            position: relative;
            color: var(--ink);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif; border: 0; cursor: pointer; }
        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #game-container::before,
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        #game-container::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 113, 200, 0.18), transparent 25%),
                radial-gradient(circle at 80% 10%, rgba(120, 255, 214, 0.16), transparent 22%),
                radial-gradient(circle at 50% 80%, rgba(255, 211, 110, 0.12), transparent 30%);
        }
        #game-container::after {
            background-image:
                linear-gradient(rgba(140, 244, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 244, 255, 0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.8) 30%, rgba(0, 0, 0, 0.2));
        }
        .glass {
            background: linear-gradient(180deg, rgba(43, 32, 77, 0.82), rgba(20, 14, 43, 0.9));
            backdrop-filter: blur(14px);
            border: 1px solid rgba(140, 244, 255, 0.3);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 14px 30px rgba(7, 5, 18, 0.35),
                0 0 24px rgba(140, 244, 255, 0.12);
        }
        .bubble {
            position: absolute;
            left: 50%;
            top: 25%;
            z-index: 10;
            transform: translateX(-50%) translateY(20px) scale(0.8);
            background: linear-gradient(180deg, rgba(255, 239, 250, 0.98), rgba(231, 248, 255, 0.98));
            border: 2px solid rgba(255, 113, 200, 0.35);
            border-radius: 20px;
            padding: 12px 20px;
            color: #3a275d;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 12px 24px rgba(8, 5, 24, 0.22);
            max-width: 80%;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(231, 248, 255, 0.98) transparent;
            transform: translateX(-50%);
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding:
                max(24px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            box-sizing: border-box;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
        }
        .hud-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
        }
        .mascot-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(255, 211, 110, 0.35));
        }
        .hud-text {
            display: flex;
            flex-direction: column;
        }
        .hud-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--glow-mint);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .hud-score {
            color: var(--ink);
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 16px rgba(140, 244, 255, 0.18);
        }
        .talk-btn {
            padding: 12px 18px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 113, 200, 0.95), rgba(228, 66, 162, 0.95));
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(255, 113, 200, 0.28);
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .talk-btn:active { transform: scale(0.95); }
        .talk-btn:hover {
            background: linear-gradient(180deg, rgba(255, 133, 209, 0.98), rgba(238, 81, 174, 0.98));
            box-shadow: 0 14px 22px rgba(255, 113, 200, 0.35);
        }
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(140, 244, 255, 0.16), transparent 38%),
                rgba(10, 8, 24, 0.54);
            backdrop-filter: blur(8px);
            pointer-events: auto;
            text-align: center;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(20, 14, 43, 0.8);
            border: 1px solid rgba(255, 211, 110, 0.35);
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-gold);
        }
        .title {
            margin: 0;
            font-family: 'Audiowide', 'Press Start 2P', monospace;
            font-size: clamp(28px, 6vw, 52px);
            line-height: 1.2;
            color: #fff6d6;
            text-shadow:
                0 0 14px rgba(255, 211, 110, 0.4),
                0 3px 0 rgba(30, 16, 52, 0.9);
        }
        .subtitle {
            margin: 0 0 18px;
            max-width: 34rem;
            color: var(--ink-dim);
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: 600;
            line-height: 1.45;
            animation: pulse 1.8s ease-in-out infinite;
        }
        .feedback-gif {
            position: absolute;
            right: 18px;
            bottom: 92px;
            width: min(26vw, 140px);
            border-radius: 18px;
            border: 2px solid rgba(140, 244, 255, 0.28);
            box-shadow: 0 12px 28px rgba(8, 5, 24, 0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 30;
            background: rgba(13, 9, 28, 0.85);
        }
        .feedback-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }
        #reaction-gif {
            bottom: 96px;
        }
        #celebration-gif {
            right: auto;
            left: 18px;
            bottom: 116px;
        }
        .start-btn {
            background: linear-gradient(180deg, rgba(255, 211, 110, 1), rgba(255, 159, 90, 1));
            color: #2a1639;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 2.4vw, 22px);
            line-height: 1.4;
            padding: 18px 28px;
            border-radius: 999px;
            box-shadow: 0 12px 28px rgba(255, 189, 94, 0.28);
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
            box-shadow: 0 16px 30px rgba(255, 189, 94, 0.34);
        }
        .start-btn:active { transform: scale(0.97); }
        .start-copy {
            margin: 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            letter-spacing: 0.03em;
        }
        .hidden { display: none !important; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @media (max-width: 640px) {
            #ui-layer {
                padding:
                    max(14px, env(safe-area-inset-top))
                    max(14px, env(safe-area-inset-right))
                    max(14px, env(safe-area-inset-bottom))
                    max(14px, env(safe-area-inset-left));
            }
            .bubble { font-size: 16px; padding: 10px 16px; max-width: calc(100% - 24px); }
            .hud-chip { padding: 8px 12px; }
            .talk-btn { padding: 10px 14px; font-size: 14px; }
            .hero-badge { font-size: 11px; }
            .subtitle { max-width: 20rem; }
            .start-copy { font-size: 12px; }
            .feedback-gif {
                width: 86px;
                bottom: 104px;
            }
            #celebration-gif {
                left: 12px;
                bottom: 128px;
            }
            #reaction-gif {
                right: 12px;
                bottom: 104px;
            }
        }
    </style>
</head>

<script>
// §3.2 Config System
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--glow-pink', val);
        }
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const ui = {
        start: document.getElementById('start-screen'),
        bubble: document.getElementById('chat-bubble'),
        score: document.getElementById('score-display'),
        talkBtn: document.getElementById('talk-btn'),
        startBtn: document.getElementById('start-btn'),
        reactionGif: document.getElementById('reaction-gif'),
        celebrationGif: document.getElementById('celebration-gif')
    };

    // State
    let gameState = 'START'; // START, PLAY
    let lastTime = 0;
    let score = 0;
    let particles = [];
    let maid = {
        x: 0, y: 0, 
        baseY: 0,
        scale: 1, 
        squish: 0,
        blinkTimer: 0,
        isBlinking: false,
        emotion: 'normal', // normal, happy, shy
        emotionTimer: 0
    };
    
    // Dialogues
    const dialogues = [
        "Player two is here — let's build the hype! ✨",
        "Fresh tokens, bright lights, big combo energy! 🕹️",
        "Nice tap! The crowd meter just jumped.",
        "Mascot mode online! 🐱",
        "Keep the cheers coming — the booth is glowing!",
        "This run is getting louder by the second!",
        "Arcade fans never miss a beat.",
        "Haha, that pep talk landed perfectly!",
        "Want to kick off another round?",
        "You're the MVP of this cabinet line!"
    ];

    // --- Audio System ---
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioCtor ? new AudioCtor() : null;
    const assets = {
        bgm: document.getElementById('bgm_main'),
        sfxCollect: document.getElementById('sfx_collect'),
        sfxUi: document.getElementById('sfx_ui'),
        sfxCelebrate: document.getElementById('sfx_celebrate'),
        sfxStart: document.getElementById('sfx_start')
    };
    let audioUnlocked = false;
    let lastCollectSfxAt = 0;
    let lastUiSfxAt = 0;
    let gifTimers = {};
    let celebrationTriggeredAtScore = 0;

    const unlockAudio = () => {
        if (audioUnlocked) return;
        audioUnlocked = true;
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        if (assets.bgm) {
            assets.bgm.volume = 0.22;
        }
        Object.values(assets).forEach((audioEl) => {
            if (!audioEl) return;
            audioEl.preload = 'auto';
            if (audioEl !== assets.bgm) {
                audioEl.volume = audioEl === assets.sfxCelebrate ? 0.5 : 0.42;
            }
        });
    };

    const flashGif = (key, duration = 1400) => {
        const gif = ui[key];
        if (!gif) return;
        gif.classList.add('show');
        if (gifTimers[key]) clearTimeout(gifTimers[key]);
        gifTimers[key] = setTimeout(() => gif.classList.remove('show'), duration);
    };

    const playAudioNode = (audioEl, fallbackType, volume = 0.45) => {
        if (!audioUnlocked || !audioEl) {
            synthesize(fallbackType);
            return;
        }

        try {
            audioEl.pause();
            audioEl.currentTime = 0;
            audioEl.volume = volume;
            audioEl.play().catch(() => synthesize(fallbackType));
        } catch (err) {
            synthesize(fallbackType);
        }
    };

    const playSfx = (type) => {
        const now = performance.now();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }

        if (type === 'collect') {
            if (now - lastCollectSfxAt < 90) return;
            lastCollectSfxAt = now;
            playAudioNode(assets.sfxCollect, 'coin', 0.4);
            flashGif('reactionGif', 1200);
            return;
        }

        if (type === 'ui') {
            if (now - lastUiSfxAt < 120) return;
            lastUiSfxAt = now;
            playAudioNode(assets.sfxUi, 'click', 0.35);
            return;
        }

        if (type === 'celebrate') {
            playAudioNode(assets.sfxCelebrate, 'success', 0.5);
            flashGif('celebrationGif', 1800);
            return;
        }

        if (type === 'start') {
            playAudioNode(assets.sfxStart, 'rise', 0.45);
        }
    };

    const synthesize = (type) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        osc.type = type === 'click' ? 'square' : 'sine';

        if (type === 'coin') {
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
            return;
        }

        if (type === 'success' || type === 'rise') {
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.12);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
            return;
        }

        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    };

    // --- Resize Handler ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        maid.x = rect.width / 2;
        maid.baseY = rect.height * 0.75;
        maid.y = maid.baseY;
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Game Logic ---

    const showBubble = (text) => {
        ui.bubble.innerText = text;
        ui.bubble.classList.add('show');
        // Position bubble above head
        const rect = canvas.getBoundingClientRect();
        ui.bubble.style.top = (maid.y - 250) + 'px';
        
        // Clear previous timeout if exists
        if (ui.bubble.hideTimeout) clearTimeout(ui.bubble.hideTimeout);
        ui.bubble.hideTimeout = setTimeout(() => {
            ui.bubble.classList.remove('show');
        }, 3000);
    };

    const spawnHeart = (x, y) => {
        for(let i=0; i<5; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: -Math.random() * 5 - 2,
                life: 1.0,
                scale: Math.random() * 0.5 + 0.5,
                type: 'heart'
            });
        }
    };

    const interact = (x, y) => {
        // Check if clicked on maid (simple box check)
        const dx = x - maid.x;
        const dy = y - (maid.y - 100); // Center roughly on head/body
        
        // Hitbox approx 200x300
        if (Math.abs(dx) < 120 && Math.abs(dy) < 180) {
            // Headpat!
            score++;
            ui.score.innerText = score;
            playSfx('collect');
            spawnHeart(x, y);
            
            // Maid Reaction
            maid.squish = 0.2; // Bounce
            maid.emotion = 'happy';
            maid.emotionTimer = 1.5; // Happy for 1.5s
            
            if (Math.random() < 0.3) {
                showBubble(dialogues[Math.floor(Math.random() * dialogues.length)]);
            }

            if (score % 10 === 0 && celebrationTriggeredAtScore !== score) {
                celebrationTriggeredAtScore = score;
                playSfx('celebrate');
                showBubble(`Hype combo ${score}! The booth is popping off!`);
            }
        }
    };

    // --- Input Handling ---
    const handleInput = (e) => {
        if (gameState !== 'PLAY') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        interact(x, y);
    };

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointerdown', unlockAudio, { passive: true, once: true });
    
    ui.talkBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent canvas click
        unlockAudio();
        playSfx('ui');
        showBubble(dialogues[Math.floor(Math.random() * dialogues.length)]);
        maid.emotion = 'happy';
        maid.emotionTimer = 2.0;
        flashGif('reactionGif', 1400);
    });

    ui.startBtn.addEventListener('click', () => {
        unlockAudio();
        gameState = 'PLAY';
        ui.start.classList.add('hidden');
        playSfx('start');
        
        if (assets.bgm) {
            assets.bgm.currentTime = 0;
            assets.bgm.play().catch(() => {});
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (!assets.bgm) return;
        if (document.hidden) {
            assets.bgm.pause();
        } else if (gameState === 'PLAY' && audioUnlocked) {
            assets.bgm.play().catch(() => {});
        }
    });

    // --- Rendering ---
    
    const drawBackground = (time) => {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0f0c22');
        grad.addColorStop(0.55, '#24134a');
        grad.addColorStop(1, '#3d1b63');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const width = canvas.width;
        const height = canvas.height;
        const speed = window.gameConfig.bgSpeed * 24;
        const sweep = time * speed;

        const neonOrbs = [
            { x: width * 0.2, y: height * 0.22, radius: 140, color: 'rgba(255, 113, 200, 0.18)' },
            { x: width * 0.78, y: height * 0.18, radius: 130, color: 'rgba(120, 255, 214, 0.16)' },
            { x: width * 0.52, y: height * 0.68, radius: 170, color: 'rgba(140, 244, 255, 0.12)' }
        ];

        neonOrbs.forEach((orb) => {
            const radial = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
            radial.addColorStop(0, orb.color);
            radial.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radial;
            ctx.fillRect(orb.x - orb.radius, orb.y - orb.radius, orb.radius * 2, orb.radius * 2);
        });

        ctx.save();
        ctx.strokeStyle = 'rgba(140, 244, 255, 0.14)';
        ctx.lineWidth = 1;
        const gridGap = 46;
        const horizon = height * 0.58;
        for (let x = -gridGap; x < width + gridGap; x += gridGap) {
            const drift = ((x + sweep) % gridGap);
            ctx.beginPath();
            ctx.moveTo(x + drift, horizon);
            ctx.lineTo(width / 2 + (x - width / 2) * 1.6, height);
            ctx.stroke();
        }
        for (let i = 0; i < 8; i++) {
            const y = horizon + i * 28;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = 'rgba(255, 211, 110, 0.08)';
        for (let i = 0; i < 22; i++) {
            const px = (i * 91 + sweep * 1.4) % (width + 80) - 40;
            const py = (Math.sin(time * 1.1 + i) * 18) + height * (0.16 + (i % 5) * 0.09);
            ctx.beginPath();
            ctx.arc(px, py, (i % 3) + 2, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const drawMaid = (dt, time) => {
        ctx.save();
        ctx.translate(maid.x, maid.y);

        maid.squish = maid.squish * 0.9 - (maid.squish * 10 * dt);
        const scaleX = 1 + maid.squish;
        const scaleY = 1 - maid.squish;
        const breathe = Math.sin(time * 2) * 0.02;

        ctx.scale(scaleX, scaleY + breathe);

        const accent = window.gameConfig.themeColor;

        ctx.save();
        ctx.shadowColor = 'rgba(120, 255, 214, 0.28)';
        ctx.shadowBlur = 28;
        ctx.fillStyle = 'rgba(120, 255, 214, 0.12)';
        ctx.beginPath();
        ctx.ellipse(0, 190, 140, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = 'rgba(140, 244, 255, 0.24)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -40, 120 + Math.sin(time * 3) * 4, Math.PI * 0.18, Math.PI * 0.82);
        ctx.stroke();

        ctx.fillStyle = '#44f7d6';
        ctx.beginPath();
        ctx.arc(-110, -66, 8, 0, Math.PI * 2);
        ctx.arc(110, -66, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#151127';
        ctx.beginPath();
        ctx.moveTo(-68, -70);
        ctx.bezierCurveTo(-102, 112, -108, 192, 0, 212);
        ctx.bezierCurveTo(108, 192, 102, 112, 68, -70);
        ctx.closePath();
        ctx.fill();

        const dressGlow = ctx.createLinearGradient(0, -70, 0, 212);
        dressGlow.addColorStop(0, accent);
        dressGlow.addColorStop(1, '#5bf0ff');
        ctx.fillStyle = dressGlow;
        ctx.globalAlpha = 0.16;
        ctx.beginPath();
        ctx.moveTo(-44, -28);
        ctx.quadraticCurveTo(0, 60, 44, -28);
        ctx.lineTo(18, 176);
        ctx.quadraticCurveTo(0, 198, -18, 176);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = '#fff9f0';
        ctx.beginPath();
        ctx.moveTo(-42, -24);
        ctx.quadraticCurveTo(-52, 148, 0, 180);
        ctx.quadraticCurveTo(52, 148, 42, -24);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 113, 200, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 98, 42, 0.15, Math.PI - 0.15, false);
        ctx.stroke();

        ctx.fillStyle = '#ff9bcf';
        ctx.beginPath();
        ctx.arc(0, -154, 84, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffe8dc';
        ctx.beginPath();
        ctx.ellipse(0, -150, 68, 78, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff9bcf';
        ctx.beginPath();
        ctx.moveTo(-54, -212);
        ctx.lineTo(-84, -286);
        ctx.lineTo(-18, -228);
        ctx.closePath();
        ctx.moveTo(54, -212);
        ctx.lineTo(84, -286);
        ctx.lineTo(18, -228);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffd8ef';
        ctx.beginPath();
        ctx.moveTo(-52, -224);
        ctx.lineTo(-72, -264);
        ctx.lineTo(-32, -234);
        ctx.closePath();
        ctx.moveTo(52, -224);
        ctx.lineTo(72, -264);
        ctx.lineTo(32, -234);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff7fbe';
        ctx.beginPath();
        ctx.moveTo(-72, -184);
        ctx.quadraticCurveTo(-34, -116, 0, -188);
        ctx.quadraticCurveTo(34, -116, 72, -184);
        ctx.lineTo(72, -224);
        ctx.lineTo(-72, -224);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fffaf7';
        ctx.strokeStyle = 'rgba(255, 211, 110, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.rect(-52, -220, 104, 22);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        for (let i = -50; i < 50; i += 10) {
            ctx.moveTo(i, -220);
            ctx.arc(i + 5, -220, 5, Math.PI, 0);
        }
        ctx.fill();

        ctx.strokeStyle = accent;
        ctx.fillStyle = accent;
        if (maid.isBlinking) {
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-30, -150); ctx.lineTo(-10, -150);
            ctx.moveTo(10, -150); ctx.lineTo(30, -150);
            ctx.stroke();
        } else if (maid.emotion === 'happy') {
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-35, -150); ctx.lineTo(-20, -165); ctx.lineTo(-5, -150);
            ctx.moveTo(5, -150); ctx.lineTo(20, -165); ctx.lineTo(35, -150);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.ellipse(-20, -150, 9, 13, 0, 0, Math.PI * 2);
            ctx.ellipse(20, -150, 9, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fffefc';
            ctx.beginPath();
            ctx.arc(-22, -154, 3, 0, Math.PI * 2);
            ctx.arc(18, -154, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(255, 122, 157, 0.26)';
        ctx.beginPath();
        ctx.ellipse(-35, -130, 11, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(35, -130, 11, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#d57aa2';
        ctx.lineWidth = 2;
        if (maid.emotion === 'happy') {
            ctx.fillStyle = '#ff98b7';
            ctx.beginPath();
            ctx.arc(0, -124, 9, 0, Math.PI);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(-5, -125, 5, 0.2, Math.PI - 0.2);
            ctx.arc(5, -125, 5, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        ctx.fillStyle = '#fff4d0';
        ctx.beginPath();
        ctx.moveTo(-22, -50);
        ctx.lineTo(0, -82);
        ctx.lineTo(22, -50);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-80, 16);
        ctx.quadraticCurveTo(-112, 54, -112, 96);
        ctx.moveTo(80, 16);
        ctx.quadraticCurveTo(112, 54, 112, 96);
        ctx.stroke();

        ctx.restore();
    };

    const drawParticles = (dt) => {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life -= dt;
            p.x += p.vx;
            p.y += p.vy;
            p.scale *= 0.98; // Fade out size

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(p.scale, p.scale);
            
            if (p.type === 'heart') {
                ctx.fillStyle = window.gameConfig.themeColor;
                ctx.beginPath();
                // Draw Heart
                const topCurveHeight = 10;
                ctx.moveTo(0, 10);
                ctx.bezierCurveTo(0, 5, -15, -5, -15, -15);
                ctx.bezierCurveTo(-15, -25, -5, -25, 0, -15);
                ctx.bezierCurveTo(5, -25, 15, -25, 15, -15);
                ctx.bezierCurveTo(15, -5, 0, 5, 0, 10);
                ctx.fill();
            }
            
            ctx.restore();
        }
    };

    const loop = (timestamp) => {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        if (gameState === 'PLAY') {
            // Logic
            maid.emotionTimer -= dt;
            if (maid.emotionTimer <= 0) maid.emotion = 'normal';

            maid.blinkTimer -= dt;
            if (maid.blinkTimer <= 0) {
                maid.isBlinking = !maid.isBlinking;
                maid.blinkTimer = maid.isBlinking ? 0.15 : (Math.random() * 3 + 2);
            }
        }

        // Draw
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground(timestamp / 1000);
        
        if (gameState === 'PLAY') {
            drawMaid(dt, timestamp / 1000);
            drawParticles(dt);
        }

        requestAnimationFrame(loop);
    };

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
