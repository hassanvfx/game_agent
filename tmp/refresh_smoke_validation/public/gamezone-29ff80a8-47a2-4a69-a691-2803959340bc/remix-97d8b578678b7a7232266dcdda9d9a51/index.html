<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Salvager Infinite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap">
    <script src="assets/cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --sky-top: #091126;
            --sky-mid: #142a52;
            --sky-glow: #1f4f8a;
            --cloud-light: rgba(160, 240, 255, 0.18);
            --panel-bg: rgba(8, 14, 32, 0.62);
            --panel-border: rgba(120, 224, 255, 0.34);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --text-main: #f4fbff;
            --text-soft: #b7d7f6;
            --accent-cyan: #74f3ff;
            --accent-gold: #ffd75e;
            --accent-coral: #ff8f70;
            --accent-lime: #8bffb7;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 18%, rgba(116, 243, 255, 0.2), transparent 24%),
                radial-gradient(circle at 78% 16%, rgba(255, 215, 94, 0.14), transparent 18%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, #244a72 100%);
            color: var(--text-main);
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .hidden { display: none !important; }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(20, 32, 62, 0.86), rgba(8, 16, 34, 0.72)),
                rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 14px 30px rgba(1, 8, 20, 0.28),
                0 0 18px rgba(116, 243, 255, 0.08);
        }

        .hud {
            width: 100%;
            padding: max(16px, env(safe-area-inset-top)) 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-card {
            min-width: 88px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(116, 243, 255, 0.14), transparent 46%, rgba(255, 215, 94, 0.08));
            pointer-events: none;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-soft);
        }

        .score-value {
            margin-top: 4px;
            font-size: 2rem;
            line-height: 1;
            font-weight: 700;
            color: var(--accent-gold);
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            text-shadow: 0 0 14px rgba(255, 215, 94, 0.28);
        }

        .fps-value {
            margin-top: 4px;
            font-size: 1.5rem;
            line-height: 1;
            font-weight: 700;
            color: var(--accent-lime);
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            text-shadow: 0 0 14px rgba(139, 255, 183, 0.24);
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.85;
            filter: drop-shadow(0 0 10px rgba(116, 243, 255, 0.35));
        }

        .controls {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        #start-btn,
        #restart-btn,
        #btn-jump,
        #btn-mine {
            touch-action: manipulation;
        }

        #touch-left,
        #touch-right {
            touch-action: none;
        }

        .touch-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 50%;
            height: 75%;
            z-index: 10;
        }

        .touch-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 50%;
            height: 75%;
            z-index: 10;
        }

        .control-stack {
            position: absolute;
            right: 24px;
            bottom: calc(32px + env(safe-area-inset-bottom));
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-btn {
            background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.28), rgba(36, 72, 110, 0.28));
            border: 2px solid rgba(130, 232, 255, 0.62);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.28), inset 0 1px 0 rgba(255,255,255,0.22);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(2, 6, 23, 0.3);
        }

        .jump-btn {
            width: 64px;
            height: 64px;
        }

        .mine-btn {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 35% 30%, rgba(255, 230, 150, 0.38), rgba(255, 143, 112, 0.22));
            border-color: rgba(255, 215, 94, 0.9);
            box-shadow: 0 12px 26px rgba(255, 143, 112, 0.26), inset 0 1px 0 rgba(255,255,255,0.28);
        }

        #joystick-zone {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(116, 243, 255, 0.14), rgba(8, 16, 34, 0.28));
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 2px solid rgba(116, 243, 255, 0.35);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 24px rgba(116, 243, 255, 0.14);
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, rgba(244, 251, 255, 0.98), rgba(116, 243, 255, 0.78));
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 6px 16px rgba(0,0,0,0.26);
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow-y: auto;
        }

        .start-screen {
            background:
                radial-gradient(circle at 50% 20%, rgba(116, 243, 255, 0.12), transparent 28%),
                linear-gradient(180deg, rgba(6, 16, 36, 0.94), rgba(14, 39, 73, 0.92));
        }

        .game-over-screen {
            background:
                radial-gradient(circle at 50% 24%, rgba(255, 143, 112, 0.16), transparent 22%),
                linear-gradient(180deg, rgba(40, 10, 22, 0.94), rgba(92, 22, 34, 0.9));
        }

        .title-wrap {
            margin-bottom: 32px;
            animation: pulse 3s ease-in-out infinite;
        }

        .title-main {
            margin: 0;
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            line-height: 0.95;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #baf7ff 0%, #63d5ff 55%, #ffd75e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 16px rgba(34, 211, 238, 0.15);
        }

        .title-sub {
            margin: 10px 0 0;
            font-size: clamp(1rem, 3vw, 1.35rem);
            letter-spacing: 0.28em;
            color: #cde7ff;
            text-transform: uppercase;
        }

        .panel {
            width: min(100%, 328px);
            margin-bottom: 28px;
            padding: 22px 20px;
            position: relative;
            overflow: hidden;
        }

        .panel::after,
        .final-card::after {
            content: "";
            position: absolute;
            inset: auto 18px 10px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold), var(--accent-coral));
            opacity: 0.85;
        }

        .intro-copy {
            margin: 0 0 14px;
            font-size: 0.95rem;
            color: #e4f1ff;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
            text-align: left;
            font-size: 0.9rem;
            color: #d8ebff;
        }

        .accent {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .primary-btn,
        .restart-btn {
            width: min(100%, 256px);
            border: 0;
            cursor: pointer;
            border-radius: 999px;
            padding: 16px 28px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
            pointer-events: auto;
        }

        .primary-btn {
            background: linear-gradient(180deg, #73f1ff, #2399ff);
            color: #03101f;
            box-shadow: 0 4px 0 #0d4d84, 0 12px 20px rgba(35, 153, 255, 0.24);
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            font-size: 1rem;
        }

        .primary-btn:hover { background: linear-gradient(180deg, #a2fbff, #49b2ff); }

        .restart-btn {
            background: linear-gradient(180deg, #fff0c9, #ff9b78);
            color: #4d0818;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            font-size: 1rem;
        }

        .primary-btn:active,
        .restart-btn:active {
            transform: translateY(2px) scale(0.99);
            box-shadow: none;
        }

        .game-over-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(2.1rem, 7vw, 3rem);
            text-transform: uppercase;
            color: #ffe1d5;
        }

        .final-card {
            min-width: 220px;
            margin-bottom: 32px;
            padding: 24px;
        }

        .final-value {
            margin-top: 10px;
            font-size: 3.25rem;
            line-height: 1;
            font-weight: 700;
            color: var(--accent-gold);
            font-family: 'Audiowide', ui-sans-serif, system-ui, sans-serif;
            text-shadow: 0 0 14px rgba(255, 215, 94, 0.22);
        }

        .ship-badge {
            width: min(42vw, 184px);
            aspect-ratio: 1;
            margin: 0 auto 18px;
            position: relative;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.32));
        }

        .ship-core {
            width: 68%;
            height: 68%;
            position: relative;
            border-radius: 36% 36% 48% 48%;
            background: linear-gradient(180deg, #f5fcff 0%, #98ecff 32%, #3681c8 80%, #17375e 100%);
            border: 2px solid rgba(255,255,255,0.32);
            box-shadow:
                inset 0 4px 10px rgba(255,255,255,0.32),
                0 0 22px rgba(116, 243, 255, 0.24);
            transform: rotate(45deg);
        }

        .ship-core::before,
        .ship-core::after {
            content: "";
            position: absolute;
            background: linear-gradient(180deg, #ffd75e, #ff8f70);
            border-radius: 999px;
        }

        .ship-core::before {
            width: 22%;
            height: 56%;
            left: -14%;
            top: 22%;
            box-shadow: 84px 0 0 0 #ffd75e;
        }

        .ship-core::after {
            width: 28%;
            height: 16%;
            left: 36%;
            bottom: -16%;
            transform: rotate(-45deg);
            box-shadow: 0 0 14px rgba(255, 143, 112, 0.28);
        }

        .ship-cockpit {
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #73f1ff 45%, #204f8d 100%);
            box-shadow: 0 0 14px rgba(116, 243, 255, 0.4);
            z-index: 1;
        }

        .drift-tag {
            margin: 0 0 18px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(116, 243, 255, 0.4);
            background: rgba(10, 24, 44, 0.5);
            color: #e4f7ff;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .sky-decor {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .sky-decor span {
            position: absolute;
            display: block;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0));
            opacity: 0.55;
            animation: driftGlow 8s ease-in-out infinite;
        }

        .sky-decor span:nth-child(1) { width: 140px; height: 140px; top: 8%; left: -4%; }
        .sky-decor span:nth-child(2) { width: 90px; height: 90px; top: 18%; right: 8%; animation-delay: 1.2s; }
        .sky-decor span:nth-child(3) { width: 180px; height: 180px; bottom: 16%; left: 12%; animation-delay: 2.4s; }
        .sky-decor span:nth-child(4) { width: 120px; height: 120px; bottom: 8%; right: -2%; animation-delay: 3.1s; }

        .hud-signal {
            position: absolute;
            inset: auto 10px 8px auto;
            width: 30px;
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(116,243,255,0.1), rgba(116,243,255,0.9));
            opacity: 0.75;
        }

        @keyframes driftGlow {
            0%, 100% { transform: translate3d(0, 0, 0) scale(0.95); opacity: 0.35; }
            50% { transform: translate3d(0, -12px, 0) scale(1.08); opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 480px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }

            .control-stack {
                right: 16px;
                gap: 12px;
            }

            .mine-btn {
                width: 74px;
                height: 74px;
            }

            .jump-btn {
                width: 58px;
                height: 58px;
            }

            .panel {
                padding: 20px 18px;
            }

            .ship-badge {
                width: min(46vw, 154px);
                margin-bottom: 14px;
            }

            .drift-tag {
                margin-bottom: 14px;
                font-size: 0.75rem;
            }
        }

        .feedback-gif {
            position: absolute;
            right: 14px;
            bottom: calc(148px + env(safe-area-inset-bottom));
            width: min(28vw, 120px);
            aspect-ratio: 1;
            z-index: 18;
            border-radius: 18px;
            border: 1px solid rgba(116, 243, 255, 0.34);
            background: rgba(5, 12, 26, 0.42);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            object-fit: cover;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.loss {
            left: 50%;
            right: auto;
            bottom: calc(130px + env(safe-area-inset-bottom));
            width: min(42vw, 172px);
            transform: translateX(-50%) translateY(16px) scale(0.94);
        }

        .feedback-gif.loss.visible {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        @media (max-width: 480px) {
            .feedback-gif {
                right: 10px;
                bottom: calc(140px + env(safe-area-inset-bottom));
                width: min(26vw, 92px);
            }

            .feedback-gif.loss {
                bottom: calc(122px + env(safe-area-inset-bottom));
                width: min(44vw, 148px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .title-wrap,
            .sky-decor span {
                animation: none;
            }

            .feedback-gif,
            .feedback-gif.loss {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="ui-layer">
        <div id="hud" class="hud hidden">
            <div class="glass hud-card">
                <span class="label">Scrap</span>
                <span class="score-value" id="score">0</span>
                <span class="hud-signal" aria-hidden="true"></span>
            </div>
            <div class="glass hud-card">
                <span class="label">FPS</span>
                <span class="fps-value" id="fps">60</span>
                <span class="hud-signal" aria-hidden="true"></span>
            </div>
        </div>

        <div id="crosshair" class="crosshair hidden">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="2" fill="white" />
                <circle cx="10" cy="10" r="9" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
            </svg>
        </div>

        <div id="controls" class="controls hidden">
            <div id="touch-left" class="touch-left"></div>
            <div id="touch-right" class="touch-right"></div>

            <!-- [agent-note][stage3] resolved-gif: salvage-feedback + loss-feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <img id="salvage-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Salvage impact reaction" aria-hidden="true">
            <img id="loss-gif" class="feedback-gif loss" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Hull lost reaction" aria-hidden="true">

            <div id="joystick-zone"><div id="joystick-knob"></div></div>

            <div class="control-stack">
                <button id="btn-jump" class="control-btn jump-btn" aria-label="Boost jump">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M12 4L4 12H9V20H15V12H20L12 4Z"/></svg>
                </button>
                <button id="btn-mine" class="control-btn mine-btn" aria-label="Salvage block">
                    <span style="font-size: 2rem;">⛏️</span>
                </button>
            </div>
        </div>

        <div id="start-screen" class="overlay start-screen">
            <div class="sky-decor" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="ship-badge" aria-hidden="true">
                <div class="ship-core"></div>
                <div class="ship-cockpit"></div>
            </div>
            <p class="drift-tag">Wreckfield Runner // Neon salvage rig</p>
            <div class="title-wrap">
                <h1 class="title-main">Sky Salvager</h1>
                <p class="title-sub">Infinite Drift</p>
            </div>

            <div class="glass panel">
                <p class="intro-copy">Sweep the floating wreck field and salvage as much scrap as you can before you drop into the storm.</p>
                <div class="controls-grid">
                    <div><span class="accent">Left Stick</span> Drift</div>
                    <div><span class="accent">Right Drag</span> Scan</div>
                    <div><span class="accent">Tap ⛏️</span> Salvage</div>
                    <div><span class="accent">Tap ⬆️</span> Boost</div>
                </div>
            </div>

            <button id="start-btn" class="primary-btn">Start Run</button>
            <!-- [agent-note][stage1] role: future-audio | trigger: salvage-success | intent: crisp pickup feedback for each recovered scrap -->
        </div>

        <div id="game-over-screen" class="overlay game-over-screen hidden">
            <h2 class="game-over-title">Hull Lost</h2>
            <div class="glass final-card">
                <div class="label">Scrap Recovered</div>
                <div class="final-value" id="final-score">0</div>
            </div>
            <button id="restart-btn" class="restart-btn">Retry Run</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            viewRadius: 10,
            chunkSize: 16,
            blockSize: 2,
            moveSpeed: 12,
            jumpForce: 18,
            gravity: 45,
            reach: 6,
            voidLimit: -40
        };

        const STATE = {
            active: false,
            score: 0,
            time: 0,
            lastFrame: 0,
            playerPos: new THREE.Vector3(),
            velocity: new THREE.Vector3(),
            onGround: false,
            canJump: false,
            inputs: { move: {x:0, y:0}, look: {x:0, y:0} },
            worldData: new Map(),
            lastRenderPos: { x: null, z: null }
        };

        const FEEDBACK = {
            salvageGif: document.getElementById('salvage-gif'),
            lossGif: document.getElementById('loss-gif'),
            timers: {},
            show(key, duration = 900) {
                const node = this[key];
                if (!node) return;
                node.classList.add('visible');
                clearTimeout(this.timers[key]);
                this.timers[key] = setTimeout(() => node.classList.remove('visible'), duration);
            },
            hideAll() {
                Object.values(this.timers).forEach(timer => clearTimeout(timer));
                this.salvageGif?.classList.remove('visible');
                this.lossGif?.classList.remove('visible');
            }
        };

        const AUDIO = {
            unlocked: false,
            sounds: {},
            bgm: null,
            init() {
                if (this.unlocked) {
                    this.resumeContext();
                    return;
                }

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                this.unlocked = true;
                this.sounds = {
                    jump: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3'),
                    salvage: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3'),
                    blocked: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3'),
                    land: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3'),
                    start: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'),
                    gameOver: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3'),
                    uiClick: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3')
                };

                Object.values(this.sounds).forEach(sound => {
                    sound.preload = 'auto';
                    sound.crossOrigin = 'anonymous';
                    sound.volume = 0.34;
                });

                this.sounds.salvage.volume = 0.28;
                this.sounds.blocked.volume = 0.26;
                this.sounds.land.volume = 0.22;
                this.sounds.start.volume = 0.3;
                this.sounds.gameOver.volume = 0.32;
                this.sounds.uiClick.volume = 0.24;

                this.bgm = new Audio('https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3');
                this.bgm.preload = 'auto';
                this.bgm.loop = true;
                this.bgm.crossOrigin = 'anonymous';
                this.bgm.volume = 0.16;
            },
            resumeContext() {
                const attemptResume = media => {
                    if (!media) return;
                    if (typeof media.load === 'function') {
                        try { media.load(); } catch (_) {}
                    }
                };
                Object.values(this.sounds).forEach(attemptResume);
                attemptResume(this.bgm);
            },
            play(name, { reset = true } = {}) {
                const sound = this.sounds[name];
                if (!sound) return;
                try {
                    if (reset) sound.currentTime = 0;
                    const maybePromise = sound.play();
                    if (maybePromise?.catch) maybePromise.catch(() => {});
                } catch (_) {}
            },
            playJump() {
                this.play('jump');
            },
            playSalvage() {
                this.play('salvage');
            },
            playBlocked() {
                this.play('blocked');
            },
            playLand() {
                this.play('land');
            },
            playStart() {
                this.play('start');
            },
            playGameOver() {
                this.play('gameOver');
            },
            playUiClick() {
                this.play('uiClick');
            },
            startLoop() {
                if (!this.bgm) return;
                try {
                    const maybePromise = this.bgm.play();
                    if (maybePromise?.catch) maybePromise.catch(() => {});
                } catch (_) {}
            },
            stopLoop() {
                if (!this.bgm) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f1f40);
        scene.fog = new THREE.Fog(0x0f1f40, CONFIG.viewRadius * CONFIG.blockSize * 0.58, CONFIG.viewRadius * CONFIG.blockSize * 1.22);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        const ambientLight = new THREE.AmbientLight(0xc6eeff, 0.92);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfff1c6, 0.9);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x74f3ff, 0.55);
        rimLight.position.set(-18, 16, -12);
        scene.add(rimLight);

        const MATERIALS = {
            grass: new THREE.MeshStandardMaterial({ color: 0x7fe6ff, emissive: 0x0d2940, emissiveIntensity: 0.35, roughness: 0.78, metalness: 0.12 }),
            dirt: new THREE.MeshStandardMaterial({ color: 0x35567d, emissive: 0x081324, emissiveIntensity: 0.22, roughness: 0.92 }),
            stone: new THREE.MeshStandardMaterial({ color: 0xa0b8d0, emissive: 0x14203e, emissiveIntensity: 0.28, roughness: 0.64, metalness: 0.2 }),
            wood: new THREE.MeshStandardMaterial({ color: 0xffb36a, emissive: 0x3b1e14, emissiveIntensity: 0.25, roughness: 0.88 }),
            leaves: new THREE.MeshStandardMaterial({ color: 0xff7f66, emissive: 0x37182d, emissiveIntensity: 0.32, roughness: 0.82 })
        };

        const MAX_INSTANCES = 4000;
        const geometry = new THREE.BoxGeometry(CONFIG.blockSize, CONFIG.blockSize, CONFIG.blockSize);
        const meshes = {};
        const dummy = new THREE.Object3D();

        for (const [key, mat] of Object.entries(MATERIALS)) {
            const mesh = new THREE.InstancedMesh(geometry, mat, MAX_INSTANCES);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            mesh.count = 0;
            mesh.userData.type = key;
            scene.add(mesh);
            meshes[key] = mesh;
        }

        function getNoiseHeight(x, z) {
            const scale = 0.08;
            const y1 = Math.sin(x * scale) * Math.cos(z * scale) * 3;
            const y2 = Math.sin(x * scale * 2.5 + z * scale * 2) * 1.5;
            return Math.floor(y1 + y2);
        }

        function getBlockType(y, surfaceY) {
            if (y === surfaceY) return 'grass';
            if (y > surfaceY - 3) return 'dirt';
            return 'stone';
        }

        function generateColumn(x, z) {
            const h = getNoiseHeight(x, z);
            addBlockToData(x, h, z, 'grass');
            addBlockToData(x, h-1, z, 'dirt');
            addBlockToData(x, h-2, z, 'stone');

            const hash = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453);
            if (hash % 1 < 0.05 && x%3!==0 && z%3!==0) {
                generateTree(x, h+1, z);
            }
        }

        function generateTree(x, y, z) {
            for(let i=0; i<3; i++) addBlockToData(x, y+i, z, 'wood');
            addBlockToData(x, y+3, z, 'leaves');
            addBlockToData(x+1, y+2, z, 'leaves');
            addBlockToData(x-1, y+2, z, 'leaves');
            addBlockToData(x, y+2, z+1, 'leaves');
            addBlockToData(x, y+2, z-1, 'leaves');
        }

        function addBlockToData(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (!STATE.worldData.has(key)) {
                STATE.worldData.set(key, type);
            }
        }

        function updateVisibleWorld() {
            const cx = Math.floor(camera.position.x / CONFIG.blockSize);
            const cz = Math.floor(camera.position.z / CONFIG.blockSize);

            if (STATE.lastRenderPos.x === cx && STATE.lastRenderPos.z === cz && !STATE.forceUpdate) return;
            STATE.lastRenderPos.x = cx;
            STATE.lastRenderPos.z = cz;
            STATE.forceUpdate = false;

            const counts = { grass:0, dirt:0, stone:0, wood:0, leaves:0 };

            const R = CONFIG.viewRadius;
            for (let x = cx - R; x <= cx + R; x++) {
                for (let z = cz - R; z <= cz + R; z++) {
                    const h = getNoiseHeight(x, z);
                    for (let y = h - 3; y <= h + 5; y++) {
                        const key = `${x},${y},${z}`;
                        let type = STATE.worldData.get(key);

                        if (!type) {
                            if (y <= h && y >= h-2) {
                                type = getBlockType(y, h);
                                STATE.worldData.set(key, type);
                            } else {
                                const hash = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453);
                                if (hash % 1 < 0.05 && y > h && y <= h+3) {
                                    if (y === h) {
                                        generateColumn(x, z);
                                        type = STATE.worldData.get(key);
                                    }
                                }
                            }
                        }

                        if (type && counts[type] < MAX_INSTANCES) {
                            dummy.position.set(x * CONFIG.blockSize, y * CONFIG.blockSize, z * CONFIG.blockSize);
                            dummy.updateMatrix();
                            meshes[type].setMatrixAt(counts[type], dummy.matrix);
                            counts[type]++;
                        }
                    }
                }
            }

            for (const [key, mesh] of Object.entries(meshes)) {
                mesh.count = counts[key];
                mesh.instanceMatrix.needsUpdate = true;
            }
        }

        const playerBox = new THREE.Box3();
        const blockBox = new THREE.Box3();
        const playerSize = new THREE.Vector3(0.6, 1.8, 0.6);

        function checkCollision(pos) {
            playerBox.setFromCenterAndSize(pos, playerSize);
            const r = 1;
            const px = Math.round(pos.x / CONFIG.blockSize);
            const py = Math.round(pos.y / CONFIG.blockSize);
            const pz = Math.round(pos.z / CONFIG.blockSize);

            for(let x = px-r; x<=px+r; x++){
                for(let y = py-r; y<=py+r; y++){
                    for(let z = pz-r; z<=pz+r; z++){
                        const key = `${x},${y},${z}`;
                        if(STATE.worldData.has(key)){
                            blockBox.min.set(x*CONFIG.blockSize - CONFIG.blockSize/2, y*CONFIG.blockSize - CONFIG.blockSize/2, z*CONFIG.blockSize - CONFIG.blockSize/2);
                            blockBox.max.set(x*CONFIG.blockSize + CONFIG.blockSize/2, y*CONFIG.blockSize + CONFIG.blockSize/2, z*CONFIG.blockSize + CONFIG.blockSize/2);
                            if(playerBox.intersectsBox(blockBox)) return true;
                        }
                    }
                }
            }
            return false;
        }

        const pickaxeGroup = new THREE.Group();
        const pickMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0xffb36a, emissive: 0x4b2414, emissiveIntensity: 0.28, roughness: 0.72 }));
        const pickHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), new THREE.MeshStandardMaterial({ color:0x74f3ff, emissive: 0x14334a, emissiveIntensity: 0.7, metalness: 0.45, roughness: 0.3 }));
        pickMesh.position.y = 0.2;
        pickHead.position.y = 0.5;
        pickaxeGroup.add(pickMesh, pickHead);
        pickaxeGroup.position.set(0.5, -0.4, -0.8);
        pickaxeGroup.rotation.set(0.5, -0.5, 0);
        camera.add(pickaxeGroup);
        scene.add(camera);

        const skyDome = new THREE.Mesh(
            new THREE.SphereGeometry(CONFIG.viewRadius * CONFIG.blockSize * 1.5, 24, 24),
            new THREE.MeshBasicMaterial({ color: 0x10264a, side: THREE.BackSide })
        );
        scene.add(skyDome);

        const salvageDrone = new THREE.Group();
        const droneCore = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.55, 0),
            new THREE.MeshStandardMaterial({ color: 0x9aefff, emissive: 0x14334a, emissiveIntensity: 0.6, metalness: 0.3, roughness: 0.35 })
        );
        const droneWingMaterial = new THREE.MeshStandardMaterial({ color: 0xffd75e, emissive: 0x4a3008, emissiveIntensity: 0.36, roughness: 0.55, metalness: 0.2 });
        const wingLeft = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.7, 0.14), droneWingMaterial);
        const wingRight = wingLeft.clone();
        wingLeft.rotation.z = 0.85;
        wingRight.rotation.z = -0.85;
        wingLeft.position.x = -0.62;
        wingRight.position.x = 0.62;
        salvageDrone.add(droneCore, wingLeft, wingRight);
        scene.add(salvageDrone);

        let mineAnim = 0;
        function updatePickaxe() {
            if (mineAnim > 0) {
                mineAnim -= 0.15;
                pickaxeGroup.rotation.z = -Math.sin(Math.PI - mineAnim) * 1.5;
            } else {
                pickaxeGroup.rotation.z = 0;
                pickaxeGroup.position.y = -0.4 + Math.sin(Date.now() * 0.005) * 0.02;
            }
        }

        function updateSalvageDrone(timeSeconds) {
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            const bob = Math.sin(timeSeconds * 2.3) * 0.14;
            const sway = Math.cos(timeSeconds * 1.8) * 0.2;
            salvageDrone.position.copy(camera.position)
                .add(forward.clone().multiplyScalar(4.4))
                .add(new THREE.Vector3(1.75 + sway, 1.8 + bob, -1.1));
            salvageDrone.rotation.y = timeSeconds * 1.3;
            salvageDrone.rotation.x = bob * 0.18;
        }

        const joyZone = document.getElementById('touch-left');
        const lookZone = document.getElementById('touch-right');
        const joyUI = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;
        let lookTouchId = null;
        let joyStart = {x:0, y:0};
        let lastLook = {x:0, y:0};

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.changedTouches[0];
            joyTouchId = t.identifier;
            joyStart = {x: t.clientX, y: t.clientY};
            joyUI.style.opacity = 1;
            joyUI.style.left = t.clientX + 'px';
            joyUI.style.top = t.clientY + 'px';
            joyKnob.style.transform = `translate(-50%, -50%)`;
        }, {passive:false});

        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++){
                if(e.changedTouches[i].identifier === joyTouchId){
                    const t = e.changedTouches[i];
                    const dx = t.clientX - joyStart.x;
                    const dy = t.clientY - joyStart.y;
                    const dist = Math.min(50, Math.sqrt(dx*dx+dy*dy));
                    const ang = Math.atan2(dy, dx);
                    const kx = Math.cos(ang)*dist;
                    const ky = Math.sin(ang)*dist;
                    joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
                    STATE.inputs.move.x = kx/50;
                    STATE.inputs.move.y = ky/50;
                }
            }
        }, {passive:false});

        const endJoy = e => {
            for(let i=0; i<e.changedTouches.length; i++){
                if(e.changedTouches[i].identifier === joyTouchId){
                    joyTouchId = null;
                    STATE.inputs.move.x = 0;
                    STATE.inputs.move.y = 0;
                    joyUI.style.opacity = 0;
                }
            }
        };
        joyZone.addEventListener('touchend', endJoy);
        joyZone.addEventListener('touchcancel', endJoy);

        lookZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.changedTouches[0];
            lookTouchId = t.identifier;
            lastLook = {x: t.clientX, y: t.clientY};
        }, {passive:false});

        lookZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++){
                if(e.changedTouches[i].identifier === lookTouchId){
                    const t = e.changedTouches[i];
                    const dx = t.clientX - lastLook.x;
                    const dy = t.clientY - lastLook.y;
                    camera.rotation.y -= dx * 0.005;
                    camera.rotation.x -= dy * 0.005;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                    lastLook = {x: t.clientX, y: t.clientY};
                }
            }
        }, {passive:false});

        const endLook = e => {
            for(let i=0; i<e.changedTouches.length; i++){
                if(e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
            }
        };
        lookZone.addEventListener('touchend', endLook);

        document.getElementById('btn-jump').addEventListener('touchstart', e => {
            e.preventDefault();
            if(STATE.onGround) {
                STATE.velocity.y = CONFIG.jumpForce;
                STATE.onGround = false;
                AUDIO.playJump();
            }
        });

        document.getElementById('btn-mine').addEventListener('touchstart', e => {
            e.preventDefault();
            mineBlock();
        });

        let wasOnGround = false;

        const raycaster = new THREE.Raycaster();
        function mineBlock() {
            mineAnim = Math.PI;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            raycaster.far = CONFIG.reach;

            const targets = Object.values(meshes);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(-0.1));
                const x = Math.round(p.x / CONFIG.blockSize);
                const y = Math.round(p.y / CONFIG.blockSize);
                const z = Math.round(p.z / CONFIG.blockSize);

                const key = `${x},${y},${z}`;
                if (STATE.worldData.has(key)) {
                    STATE.worldData.delete(key);
                    STATE.score++;
                    document.getElementById('score').innerText = STATE.score;
                    STATE.forceUpdate = true;
                    spawnParticles(hit.point, hit.object.material.color);
                    AUDIO.playSalvage();
                    FEEDBACK.show('salvageGif', 720);
                } else {
                    AUDIO.playBlocked();
                }
            } else {
                AUDIO.playBlocked();
            }
        }

        const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const particles = [];
        function spawnParticles(pos, color) {
            const mat = new THREE.MeshBasicMaterial({color: color});
            for(let i=0; i<5; i++){
                const mesh = new THREE.Mesh(particleGeo, mat);
                mesh.position.copy(pos).add(new THREE.Vector3((Math.random()-.5), (Math.random()-.5), (Math.random()-.5)));
                mesh.userData.vel = new THREE.Vector3((Math.random()-.5)*5, Math.random()*5, (Math.random()-.5)*5);
                scene.add(mesh);
                particles.push(mesh);
            }
        }

        function updateParticles(dt) {
            for(let i=particles.length-1; i>=0; i--){
                const p = particles[i];
                p.position.add(p.userData.vel.clone().multiplyScalar(dt));
                p.userData.vel.y -= 20 * dt;
                p.scale.multiplyScalar(0.9);
                if(p.scale.x < 0.05) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsTime = 0;

        function loop() {
            requestAnimationFrame(loop);
            if (!STATE.active) return;

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            frameCount++;
            if (now - lastFpsTime >= 1000) {
                document.getElementById('fps').innerText = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();
            const right = new THREE.Vector3(-forward.z, 0, forward.x);

            const moveVec = forward.clone().multiplyScalar(-STATE.inputs.move.y).add(right.clone().multiplyScalar(STATE.inputs.move.x));

            if (moveVec.length() > 0) moveVec.normalize();

            STATE.velocity.x = moveVec.x * CONFIG.moveSpeed;
            STATE.velocity.z = moveVec.z * CONFIG.moveSpeed;
            STATE.velocity.y -= CONFIG.gravity * dt;

            camera.position.x += STATE.velocity.x * dt;
            if (checkCollision(camera.position)) camera.position.x -= STATE.velocity.x * dt;

            camera.position.z += STATE.velocity.z * dt;
            if (checkCollision(camera.position)) camera.position.z -= STATE.velocity.z * dt;

            camera.position.y += STATE.velocity.y * dt;
                if (checkCollision(camera.position)) {
                    if (STATE.velocity.y < 0) {
                        STATE.onGround = true;
                        camera.position.y = Math.ceil(camera.position.y/CONFIG.blockSize)*CONFIG.blockSize - CONFIG.blockSize/2 + playerSize.y/2 - 0.01;
                    }
                    STATE.velocity.y = 0;
                } else {
                    STATE.onGround = false;
                }

                if (STATE.onGround && !wasOnGround) {
                    AUDIO.playLand();
                }
                wasOnGround = STATE.onGround;

                updateVisibleWorld();
            updatePickaxe();
            updateParticles(dt);
            updateSalvageDrone(now * 0.001);

            if (camera.position.y < CONFIG.voidLimit) gameOver();

            renderer.render(scene, camera);
        }

        function initGame() {
            STATE.worldData.clear();
            STATE.score = 0;
            STATE.lastRenderPos = {x:null, z:null};
            STATE.velocity.set(0,0,0);
            wasOnGround = false;
            FEEDBACK.hideAll();
            document.getElementById('score').innerText = '0';

            const startH = getNoiseHeight(0,0);
            camera.position.set(0, (startH + 5) * CONFIG.blockSize, 0);
            camera.rotation.set(0,0,0);

            STATE.active = true;
            lastTime = performance.now();
            AUDIO.init();
            AUDIO.startLoop();
        }

        function gameOver() {
            STATE.active = false;
            AUDIO.stopLoop();
            AUDIO.playGameOver();
            FEEDBACK.show('lossGif', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('crosshair').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = STATE.score;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            AUDIO.init();
            AUDIO.playStart();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            initGame();
            loop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            AUDIO.init();
            AUDIO.playUiClick();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('crosshair').classList.remove('hidden');
            initGame();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
