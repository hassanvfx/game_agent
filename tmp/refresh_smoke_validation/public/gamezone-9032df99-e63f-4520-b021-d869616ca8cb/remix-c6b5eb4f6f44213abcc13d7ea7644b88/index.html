<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Midnight Romance Run</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        :root {
            --sky-top: #13051e;
            --sky-mid: #2d0d43;
            --sky-bottom: #511643;
            --star-glow: rgba(255, 211, 244, 0.7);
            --mist: rgba(255, 173, 218, 0.12);
            --panel-bg: rgba(20, 8, 34, 0.72);
            --panel-border: rgba(255, 151, 214, 0.48);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #fff7fd;
            --text-soft: #ffd8f1;
            --accent-primary: #ff66b9;
            --accent-secondary: #ff8fe2;
            --accent-hot: #ff4d94;
            --accent-cool: #8e6dff;
            --danger: #6ee8ff;
            --danger-deep: #53bbff;
            --gold: #ffd86a;
            --button-text: #2b1028;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 130, 204, 0.22), transparent 18rem),
                radial-gradient(circle at 80% 10%, rgba(142, 109, 255, 0.2), transparent 16rem),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 100%);
            color: var(--text-main);
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                radial-gradient(circle at 12% 24%, var(--star-glow) 0 0.18rem, transparent 0.22rem),
                radial-gradient(circle at 26% 12%, rgba(255, 255, 255, 0.75) 0 0.12rem, transparent 0.16rem),
                radial-gradient(circle at 43% 22%, rgba(255, 214, 241, 0.62) 0 0.14rem, transparent 0.18rem),
                radial-gradient(circle at 61% 11%, rgba(255, 255, 255, 0.82) 0 0.13rem, transparent 0.17rem),
                radial-gradient(circle at 79% 26%, rgba(255, 189, 237, 0.65) 0 0.15rem, transparent 0.19rem),
                radial-gradient(circle at 90% 17%, rgba(255, 255, 255, 0.78) 0 0.11rem, transparent 0.14rem);
            opacity: 0.9;
        }

        .game-container::after {
            background:
                radial-gradient(circle at 50% 110%, rgba(255, 100, 185, 0.18), transparent 22rem),
                linear-gradient(180deg, transparent 58%, rgba(255, 156, 221, 0.06) 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(44, 15, 55, 0.92), rgba(23, 8, 36, 0.78)),
                var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 36px var(--panel-shadow),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 24px rgba(255, 102, 185, 0.18);
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            padding: 2.25rem 1.7rem 1.8rem;
            max-width: min(92vw, 35rem);
            margin: 1rem;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 28%),
                radial-gradient(circle at 50% 0%, rgba(255, 170, 223, 0.16), transparent 45%);
            pointer-events: none;
        }

        .start-screen {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .start-screen:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 18px 38px rgba(0, 0, 0, 0.48),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 32px rgba(255, 102, 185, 0.26);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-bottom: 0.85rem;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
            background: rgba(255, 143, 226, 0.12);
            border: 1px solid rgba(255, 143, 226, 0.34);
        }

        .title {
            position: relative;
            z-index: 1;
            margin: 0 0 0.4rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.6rem);
            line-height: 0.98;
            letter-spacing: 0.05em;
            color: #fff2fb;
        }

        .subtitle {
            position: relative;
            z-index: 1;
            margin: 0 auto 1.2rem;
            max-width: 26rem;
            font-size: clamp(1rem, 3.3vw, 1.25rem);
            line-height: 1.35;
            color: var(--text-soft);
            animation: pulse 1.8s ease-in-out infinite;
        }

        .character-card {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.85rem;
            align-items: center;
            margin: 0 auto 1.4rem;
            padding: 0.8rem 0.9rem;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 143, 226, 0.08));
            border: 1px solid rgba(255, 177, 229, 0.24);
            text-align: left;
        }

        .character-avatar {
            width: 4rem;
            height: 4rem;
            border-radius: 1.15rem;
            display: grid;
            place-items: center;
            font-size: 2rem;
            background:
                radial-gradient(circle at 35% 30%, #ffd7ef, rgba(255, 215, 239, 0.25) 30%, transparent 32%),
                linear-gradient(180deg, #ff70c2, #7f5fff);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                0 10px 24px rgba(0, 0, 0, 0.26),
                0 0 22px rgba(255, 112, 194, 0.35);
            animation: charmFloat 2.4s ease-in-out infinite;
        }

        .character-text strong {
            display: block;
            margin-bottom: 0.2rem;
            font-size: 1.02rem;
            color: #fff7fd;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .character-text span {
            display: block;
            font-size: 0.96rem;
            line-height: 1.25;
            color: rgba(255, 236, 248, 0.86);
        }

        .result-title {
            margin: 0 0 1rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.85rem, 6vw, 3rem);
            letter-spacing: 0.04em;
            color: #fff4fd;
        }

        .score-line {
            font-size: clamp(1.2rem, 4vw, 1.65rem);
            margin-bottom: 1.4rem;
            color: var(--text-soft);
        }

        .score-value {
            color: var(--gold);
            font-weight: 700;
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(255, 129, 208, 0.85),
                0 0 24px rgba(255, 77, 148, 0.65),
                0 0 40px rgba(142, 109, 255, 0.38);
        }

        .button-primary,
        .button-secondary {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 3.2rem;
            padding: 0.9rem 1.45rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.02rem;
            letter-spacing: 0.04em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, background-color 0.18s ease;
            pointer-events: auto;
        }

        .button-primary {
            color: #fff;
            background: linear-gradient(90deg, var(--accent-hot), var(--accent-cool));
            box-shadow: 0 14px 28px rgba(60, 16, 66, 0.46);
        }

        .button-primary:hover,
        .button-primary:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(255, 77, 148, 0.34);
            filter: brightness(1.05);
        }

        .button-secondary {
            color: var(--button-text);
            background: linear-gradient(180deg, #fff4fd, #ffd8f1);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
        }

        .button-secondary:hover,
        .button-secondary:focus-visible {
            background: linear-gradient(180deg, #ffffff, #ffe7f6);
            transform: translateY(-1px);
        }

        .hud {
            position: absolute;
            top: 1.15rem;
            left: 1rem;
            font-family: 'Press Start 2P', monospace;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            font-size: clamp(0.95rem, 3.2vw, 1.15rem);
            font-weight: 600;
            color: #fff6fc;
            background: rgba(27, 8, 40, 0.62);
            border: 1px solid rgba(255, 151, 214, 0.36);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
            letter-spacing: 0.05em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-icon {
            font-size: 1rem;
            line-height: 1;
        }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            z-index: 3;
            width: min(26vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(255, 180, 232, 0.42);
            background: rgba(22, 8, 34, 0.58);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(0.5rem) scale(0.95);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.collect-gif {
            top: 0.95rem;
        }

        .feedback-gif.fail-gif {
            bottom: 1rem;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.76; }
            50% { opacity: 1; }
        }

        @keyframes charmFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 1.35rem 1rem 1.15rem;
                border-radius: 20px;
                max-width: min(92vw, 30rem);
            }

            .title {
                font-size: clamp(1.85rem, 10vw, 2.7rem);
            }

            .subtitle {
                margin-bottom: 1rem;
                font-size: 1rem;
            }

            .character-card {
                grid-template-columns: 1fr;
                justify-items: center;
                text-align: center;
                gap: 0.7rem;
                padding: 0.75rem;
            }

            .character-avatar {
                width: 3.6rem;
                height: 3.6rem;
                font-size: 1.8rem;
            }

            .hud {
                top: 0.85rem;
                left: 0.75rem;
                padding: 0.4rem 0.72rem;
                font-size: 0.7rem;
            }

            .feedback-gif {
                width: min(28vw, 5.1rem);
                right: 0.55rem;
                border-radius: 0.8rem;
            }

            .feedback-gif.collect-gif {
                top: 0.75rem;
            }

            .feedback-gif.fail-gif {
                bottom: 0.75rem;
            }

            .button-primary,
            .button-secondary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel start-screen">
                <div class="hero-badge">💖 Moonlit Dash</div>
                <h1 class="title neon-text">MIDNIGHT ROMANCE</h1>
                <p class="subtitle">Guide the star-crossed heart through a dreamy neon skyline. Catch glowing roses and slip past heartbreak shards.</p>
                <div class="character-card" aria-hidden="true">
                    <div class="character-avatar">💗</div>
                    <div class="character-text">
                        <strong>Lead Charm</strong>
                        <span>The radiant heart heroine glows brightest in the storm—swift, sweet, and impossible to miss.</span>
                    </div>
                </div>
                <button id="start-btn" class="button-primary">START THE CHASE</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="result-title neon-text">HEARTBREAK HIT</h2>
                <div class="score-line">Romance Score: <span id="finalScore" class="score-value">0</span></div>
                <button id="restart-btn" class="button-secondary">Run Again</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <span class="hud-icon" aria-hidden="true">💞</span>
                <span id="score">0</span>
            </div>
            <!-- [agent-note][stage3] resolved-gif: collect/fail overlays -> catalogs/gifs.json -->
            <img id="collect-gif" class="feedback-gif collect-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Collect celebration reaction" aria-hidden="true">
            <img id="fail-gif" class="feedback-gif fail-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction" aria-hidden="true">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                combo: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = true;
                this.started = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxVolume = {
                    score: 0.52,
                    combo: 0.68,
                    start: 0.62,
                    click: 0.46,
                    fail: 0.74
                };
                this.cooldowns = {
                    score: 70,
                    combo: 150,
                    start: 200,
                    click: 120,
                    fail: 250
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                if (this.started) return;
                this.started = true;
                const warmup = this.bgm.play();
                if (warmup && typeof warmup.then === 'function') {
                    warmup.then(() => {
                        this.bgm.pause();
                        this.bgm.currentTime = 0;
                    }).catch(() => {});
                }
            }

            playBGM() {
                if (!this.enabled || !this.started) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.started || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = this.cooldowns[key] ?? 0;
                const last = this.lastPlayed.get(key) ?? -Infinity;
                if (now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolume[key] ?? 0.6;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const collectGif = document.getElementById('collect-gif');
        const failGif = document.getElementById('fail-gif');
        let gifTimers = {};

        function pulseGif(element, key, duration = 900) {
            if (!element) return;
            clearTimeout(gifTimers[key]);
            element.classList.add('active');
            gifTimers[key] = setTimeout(() => {
                element.classList.remove('active');
            }, duration);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let speedMultiplier = 1;

        // Entities
        let player = { x: 0, y: 0, radius: 25, color: '#ff1493' };
        let obstacles = []; // "Heartbreak shards"
        let rewards = [];   // "Roses"
        let particles = []; // Background ambiance

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        let targetX = width / 2;

        const handleInput = (e) => {
            if (!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            targetX = clientX;
            if (e.cancelable) e.preventDefault();
        };

        window.addEventListener('mousemove', handleInput);
        window.addEventListener('touchmove', handleInput, { passive: false });
        window.addEventListener('touchstart', handleInput, { passive: false });

        /** 4. PARALLAX & VISUALS */
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 4 + 1;
                this.speed = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.hue = Math.random() > 0.5 ? 330 : 280;
            }
            update() {
                this.y -= this.speed;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 85%, 72%, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        /** 5. GAME LOGIC */
        function spawnEntities() {
            if (frames % 40 === 0) {
                rewards.push({
                    x: Math.random() * (width - 40) + 20,
                    y: -50,
                    size: 20,
                    speed: 4 + speedMultiplier,
                    wobble: Math.random() * Math.PI * 2
                });
            }

            if (frames % 60 === 0) {
                obstacles.push({
                    x: Math.random() * (width - 50) + 25,
                    y: -50,
                    size: 25,
                    speed: 5 + speedMultiplier,
                    tilt: Math.random() * 0.35 - 0.175
                });
            }
        }

        function updateEntities() {
            player.x += (targetX - player.x) * 0.15;

            if (player.x < player.radius) player.x = player.radius;
            if (player.x > width - player.radius) player.x = width - player.radius;

            for (let i = rewards.length - 1; i >= 0; i--) {
                const r = rewards[i];
                r.y += r.speed;

                const dist = Math.hypot(player.x - r.x, player.y - r.y);
                if (dist < player.radius + r.size) {
                    score += 1;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score');
                    pulseGif(collectGif, 'collect', 720);
                    rewards.splice(i, 1);

                    if (score % 5 === 0) {
                        speedMultiplier += 0.2;
                        audio.playSFX('combo');
                    }
                } else if (r.y > height) {
                    rewards.splice(i, 1);
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.y += o.speed;

                const dist = Math.hypot(player.x - o.x, player.y - o.y);
                if (dist < player.radius + o.size - 5) {
                    gameOver();
                } else if (o.y > height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawHeartCharacter(px, py) {
            ctx.save();

            ctx.translate(px, py);
            const bob = Math.sin(frames * 0.14) * 2.5;
            ctx.translate(0, bob);

            ctx.beginPath();
            ctx.fillStyle = '#ff66b9';
            ctx.shadowBlur = 26;
            ctx.shadowColor = 'rgba(255, 106, 185, 0.88)';
            ctx.moveTo(0, 12);
            ctx.bezierCurveTo(-27, -16, -42, 18, 0, 40);
            ctx.bezierCurveTo(42, 18, 27, -16, 0, 12);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = 'rgba(255, 220, 244, 0.55)';
            ctx.ellipse(-8, 2, 7, 11, -0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff7fd';
            ctx.beginPath();
            ctx.arc(-8, 10, 2.4, 0, Math.PI * 2);
            ctx.arc(8, 10, 2.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#a92d70';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-8, 21);
            ctx.quadraticCurveTo(0, 28, 8, 21);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 214, 241, 0.82)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-18, -4);
            ctx.quadraticCurveTo(-26, -14, -31, -25);
            ctx.moveTo(18, -4);
            ctx.quadraticCurveTo(26, -14, 31, -25);
            ctx.stroke();

            ctx.restore();
        }

        function drawRoseCollectible(r) {
            const sway = Math.sin(frames * 0.2 + r.wobble) * 1.8;

            ctx.save();
            ctx.translate(r.x, r.y + sway);

            ctx.strokeStyle = 'rgba(108, 209, 126, 0.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 16);
            ctx.quadraticCurveTo(-1, 27, 0, 36);
            ctx.stroke();

            ctx.fillStyle = '#ff74bb';
            ctx.beginPath();
            ctx.arc(0, 0, r.size * 0.54, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff9ed2';
            ctx.beginPath();
            ctx.arc(-8, -2, r.size * 0.38, 0, Math.PI * 2);
            ctx.arc(8, -2, r.size * 0.38, 0, Math.PI * 2);
            ctx.arc(0, -9, r.size * 0.34, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff7bd';
            ctx.beginPath();
            ctx.arc(0, 0, r.size * 0.16, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(255, 130, 204, 0.55)';
            ctx.strokeStyle = 'rgba(255, 214, 241, 0.75)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, r.size * 0.88, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawShardHazard(o) {
            ctx.save();
            ctx.translate(o.x, o.y);
            ctx.rotate(o.tilt + Math.sin((frames + o.y) * 0.04) * 0.08);

            const grad = ctx.createLinearGradient(0, -o.size, 0, o.size);
            grad.addColorStop(0, '#c9f5ff');
            grad.addColorStop(0.45, '#6ee8ff');
            grad.addColorStop(1, '#3b88ff');

            ctx.fillStyle = grad;
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(110, 232, 255, 0.7)';
            ctx.beginPath();
            ctx.moveTo(0, o.size);
            ctx.lineTo(-o.size * 0.55, -o.size * 0.85);
            ctx.lineTo(0, -o.size * 0.45);
            ctx.lineTo(o.size * 0.55, -o.size);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.72)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(-o.size * 0.16, -o.size * 0.52);
            ctx.lineTo(0, o.size * 0.5);
            ctx.lineTo(o.size * 0.2, -o.size * 0.18);
            ctx.stroke();

            ctx.restore();
        }

        function drawGame() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#12051d');
            gradient.addColorStop(0.55, '#33104d');
            gradient.addColorStop(1, '#5d173f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const moonX = width * 0.8;
            const moonY = Math.max(78, height * 0.16);
            const moonGlow = ctx.createRadialGradient(moonX, moonY, 8, moonX, moonY, 80);
            moonGlow.addColorStop(0, 'rgba(255, 245, 255, 0.9)');
            moonGlow.addColorStop(0.3, 'rgba(255, 201, 234, 0.42)');
            moonGlow.addColorStop(1, 'rgba(255, 201, 234, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(moonX, moonY, 80, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 246, 252, 0.88)';
            ctx.beginPath();
            ctx.arc(moonX, moonY, 24, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(20, 5, 30, 0.18)';
            ctx.beginPath();
            ctx.arc(moonX + 8, moonY - 4, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            for (let i = 0; i < 18; i++) {
                const sx = ((i * 71) + frames * 0.4) % (width + 40) - 20;
                const sy = (i * 53) % Math.max(120, height * 0.42) + 10;
                const size = (i % 3) + 1;
                ctx.fillRect(sx, sy, size, size);
            }

            particles.forEach(p => { p.update(); p.draw(); });

            ctx.fillStyle = 'rgba(18, 7, 31, 0.45)';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height - 110);
            for (let x = 0; x <= width + 40; x += 40) {
                const peak = (x % 120 === 0) ? 64 : 26;
                ctx.lineTo(x, height - 110 - peak);
                ctx.lineTo(x + 22, height - 110);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 116, 187, 0.14)';
            ctx.fillRect(0, height - 96, width, 2);

            drawHeartCharacter(player.x, player.y - 12);

            rewards.forEach(drawRoseCollectible);
            obstacles.forEach(drawShardHazard);
        }

        function initGame() {
            score = 0;
            speedMultiplier = 1;
            frames = 0;
            rewards = [];
            obstacles = [];
            player.x = width / 2;
            targetX = width / 2;
            collectGif.classList.remove('active');
            failGif.classList.remove('active');
            document.getElementById('score').innerText = score;
        }

        function gameLoop() {
            if (!gameActive) return;
            frames++;

            ctx.clearRect(0, 0, width, height);

            spawnEntities();
            updateEntities();
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            pulseGif(failGif, 'fail', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
