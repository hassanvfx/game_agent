<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Judgment Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] remapped-font: title-hud=Orbitron body-ui=Exo 2 via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-top: #040816;
            --bg-bottom: #130a22;
            --panel: rgba(9, 16, 38, 0.82);
            --panel-strong: rgba(12, 22, 52, 0.96);
            --line: rgba(115, 243, 255, 0.25);
            --aqua: #73f3ff;
            --violet: #8b5dff;
            --pink: #ff5fcf;
            --gold: #ffd76b;
            --text: #eef6ff;
            --muted: #9bb4d8;
            --glow: 0 0 28px rgba(115, 243, 255, 0.22);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(115, 243, 255, 0.18), transparent 28%),
                radial-gradient(circle at 80% 20%, rgba(139, 93, 255, 0.16), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(255, 95, 207, 0.14), transparent 40%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 62%, #070912);
            background-color: #070912;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(115deg, transparent 0 43%, rgba(115, 243, 255, 0.07) 49%, transparent 55%),
                repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0 2px, transparent 2px 6px);
            opacity: 0.55;
            mix-blend-mode: screen;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .glass-panel {
            position: relative;
            background: linear-gradient(180deg, rgba(12, 22, 52, 0.94), rgba(6, 12, 31, 0.92));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), var(--glow);
            overflow: hidden;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 30%, transparent 70%, rgba(115,243,255,0.08));
        }
        .glass-panel > * { position: relative; z-index: 1; }
        .hud-chip {
            background: linear-gradient(180deg, rgba(11, 19, 46, 0.9), rgba(6, 12, 28, 0.95));
            border: 1px solid rgba(115, 243, 255, 0.22);
            box-shadow: 0 8px 18px rgba(0,0,0,0.35), 0 0 18px rgba(115,243,255,0.14);
        }
        .title-font { font-family: 'Orbitron', system-ui, sans-serif; letter-spacing: 0.08em; }
        .ui-font { font-family: 'Exo 2', system-ui, sans-serif; }
        .verdict-avatar {
            box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 0 36px rgba(115,243,255,0.32);
        }
        .verdict-avatar::before,
        .verdict-avatar::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            border: 2px solid rgba(115,243,255,0.22);
            inset: -10px;
            animation: pulseRing 3.2s ease-in-out infinite;
        }
        .verdict-avatar::after {
            inset: -20px;
            border-color: rgba(255,95,207,0.18);
            animation-delay: 0.8s;
        }
        .arcade-btn {
            background: linear-gradient(180deg, #6b4dff, #4a36c8);
            box-shadow: 0 12px 24px rgba(37, 19, 107, 0.38), 0 0 18px rgba(139, 93, 255, 0.28);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }
        .arcade-btn:hover { filter: brightness(1.08); }
        .arcade-btn:active {
            transform: scale(0.96);
            box-shadow: 0 6px 14px rgba(37, 19, 107, 0.4);
        }
        .secondary-btn {
            background: linear-gradient(180deg, #10b981, #0a8b66);
            box-shadow: 0 12px 24px rgba(4, 77, 60, 0.32), 0 0 18px rgba(16,185,129,0.24);
        }
        .hidden { display: none !important; }
        .feedback-gif {
            position: absolute;
            right: max(16px, calc(var(--safe-right) + 12px));
            width: min(24vw, 128px);
            max-width: 128px;
            border-radius: 18px;
            border: 1px solid rgba(115,243,255,0.28);
            box-shadow: 0 12px 34px rgba(0,0,0,0.34), 0 0 18px rgba(115,243,255,0.18);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 220ms ease, transform 220ms ease;
            pointer-events: none;
            z-index: 9;
            background: rgba(4, 8, 18, 0.68);
            object-fit: cover;
        }
        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #verdict-gif {
            top: max(104px, calc(var(--safe-top) + 92px));
        }
        #result-gif {
            bottom: max(24px, calc(var(--safe-bottom) + 16px));
        }
        #audio-hint {
            position: absolute;
            left: 50%;
            bottom: max(20px, calc(var(--safe-bottom) + 8px));
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(8, 16, 36, 0.82);
            border: 1px solid rgba(115,243,255,0.24);
            color: #d9f6ff;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(0,0,0,0.3);
            opacity: 0.9;
        }
        * { user-select: none; -webkit-user-select: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseRing {
            0%, 100% { transform: scale(0.98); opacity: 0.35; }
            50% { transform: scale(1.04); opacity: 0.8; }
        }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @media (max-width: 640px) {
            #start-screen, #end-screen {
                max-width: min(92vw, 360px);
                padding: 1.4rem;
                gap: 1rem;
            }
            #hud {
                padding: calc(var(--safe-top) + 0.75rem) calc(var(--safe-right) + 0.75rem) 0 calc(var(--safe-left) + 0.75rem);
            }
            .feedback-gif {
                width: min(30vw, 104px);
            }
            #verdict-gif {
                top: max(96px, calc(var(--safe-top) + 84px));
            }
            #result-gif {
                bottom: max(18px, calc(var(--safe-bottom) + 12px));
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full bg-slate-900">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: verdict-reveal + final-result feedback from catalogs/gifs.json -->
        <img id="verdict-gif" class="feedback-gif" alt="Verdict reaction animation" src="https://i.giphy.com/12GxI1Eqg7S6f6.webp">
        <img id="result-gif" class="feedback-gif" alt="Final result celebration animation" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
        <div id="audio-hint" class="ui-font">Tap start to enable the neon jury soundtrack</div>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">

            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 rounded-3xl text-center pointer-events-auto flex flex-col items-center gap-6 max-w-sm mx-4 animate-fade-in">
                <div class="verdict-avatar w-28 h-28 rounded-full border-4 border-cyan-300/70 relative flex items-center justify-center bg-gradient-to-br from-cyan-300 via-violet-500 to-pink-500 text-white">
                    <span class="text-5xl drop-shadow-[0_0_12px_rgba(255,255,255,0.5)]">⚖️</span>
                </div>
                <div>
                    <h1 class="title-font text-4xl sm:text-5xl text-white mb-2 drop-shadow-md">JUDGMENT CALL</h1>
                    <p class="ui-font text-cyan-100 text-base sm:text-lg font-medium leading-relaxed">30 split-second verdicts.<br>Sync with the neon jury.</p>
                </div>
                <button id="start-btn" class="arcade-btn title-font text-white py-4 px-10 rounded-full text-lg sm:text-xl tracking-[0.22em] border border-cyan-300/30">
                    START
                </button>
            </div>

            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden pointer-events-none z-10">
                <div class="hud-chip px-4 py-2 rounded-full text-white font-bold text-sm flex items-center gap-2 ui-font">
                    <span class="text-yellow-300 drop-shadow-[0_0_10px_rgba(255,215,107,0.45)]">★</span>
                    <span>Crowd Match: <span id="score">0</span></span>
                </div>
                <div class="hud-chip px-4 py-2 rounded-full text-cyan-100/80 text-xs ui-font">
                    <span id="q-num">1</span> / <span id="q-total">30</span>
                </div>
            </div>

            <!-- End Screen -->
            <div id="end-screen" class="glass-panel p-8 rounded-3xl text-center pointer-events-auto hidden flex flex-col items-center gap-6 max-w-sm mx-4">
                <h2 class="title-font text-3xl sm:text-4xl text-white">VERDICT FILED</h2>
                <p class="ui-font text-slate-200">You matched the crowd <br><span id="final-score" class="text-yellow-300 text-2xl font-bold">0</span> times.</p>
                <div class="w-full h-px bg-white/10 my-2"></div>
                <p id="final-judgment" class="ui-font text-sm text-cyan-100 italic">"Your moral compass is unique."</p>
                <button id="restart-btn" class="secondary-btn title-font text-white py-3 px-8 rounded-full transition-all active:scale-95 tracking-[0.18em]">PLAY AGAIN</button>
            </div>

        </div>
    </div>

    <script>
    window.addEventListener('load', () => {

    /**
     * GAME CONFIGURATION & DATA
     * Expanded to 30 levels
     */
    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
        victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
        sfx: {
            select: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            reveal: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
            correct: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
            incorrect: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            finish: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
        },
        gifs: {
            reveal: "https://i.giphy.com/12GxI1Eqg7S6f6.webp",
            win: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
            lose: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
        }
    };

    const QUESTIONS = [
        { a: "Unlimited Money", b: "True Love", aPct: 45, feedbackA: "You are greedy!", feedbackB: "You will be a great person." },
        { a: "Save your Wife", b: "Save your Mother", aPct: 62, feedbackA: "You chose your future over your past.", feedbackB: "You honor the one who gave you life." },
        { a: "Save your Child", b: "Save your Partner", aPct: 88, feedbackA: "A parent's instinct prevails.", feedbackB: "You chose your soulmate." },
        { a: "Ability to Fly", b: "Invisibility", aPct: 55, feedbackA: "You seek absolute freedom.", feedbackB: "You have secrets to hide." },
        { a: "End All Wars", b: "End All Hunger", aPct: 48, feedbackA: "You chose peace over sustenance.", feedbackB: "You chose life over conflict." },
        { a: "Explore Space", b: "Explore Ocean", aPct: 70, feedbackA: "You look to the stars.", feedbackB: "You look to the depths." },
        { a: "Be the Smartest", b: "Be the Happiest", aPct: 25, feedbackA: "Knowledge is your power.", feedbackB: "Ignorance is bliss." },
        { a: "Know Date of Death", b: "Know Cause of Death", aPct: 35, feedbackA: "You want to plan your time.", feedbackB: "You want to prevent the inevitable." },
        { a: "Restart Life at 10", b: "Gain $10 Million", aPct: 52, feedbackA: "You value time over money.", feedbackB: "You're taking the cash out." },
        { a: "Lose Internet", b: "Lose Heating/AC", aPct: 60, feedbackA: "You prefer comfort over connection.", feedbackB: "You are addicted to the web." },
        { a: "Talk to Animals", b: "Speak all Languages", aPct: 42, feedbackA: "You are one with nature.", feedbackB: "You are a global citizen." },
        { a: "Always be Cold", b: "Always be Hot", aPct: 49, feedbackA: "You can always put more clothes on.", feedbackB: "You love the summer heat." },
        { a: "Famous & Hated", b: "Unknown & Loved", aPct: 15, feedbackA: "You crave the spotlight at any cost.", feedbackB: "You value genuine connection." },
        { a: "Save 1 Human", b: "Save 100 Puppies", aPct: 75, feedbackA: "Human life is paramount.", feedbackB: "You just really love dogs." },
        { a: "Stop Time", b: "Rewind Time", aPct: 58, feedbackA: "You want to savor the moment.", feedbackB: "You live with regrets." },
        { a: "Read Minds", b: "See The Future", aPct: 65, feedbackA: "You crave control over the present.", feedbackB: "You fear the uncertainty of tomorrow." },
        { a: "Rich & Lonely", b: "Poor & Loved", aPct: 30, feedbackA: "Success is your only companion.", feedbackB: "Your heart is full, pockets empty." },
        { a: "Cure Cancer", b: "End Poverty", aPct: 55, feedbackA: "You prioritize biological survival.", feedbackB: "You prioritize societal equality." },
        { a: "Save 5 Strangers", b: "Save 1 Best Friend", aPct: 40, feedbackA: "The needs of the many outweigh the few.", feedbackB: "Loyalty defines your morality." },
        { a: "Never Sleep", b: "Never Eat", aPct: 48, feedbackA: "You want 50% more life.", feedbackB: "You want freedom from sustenance." },
        { a: "Always Truth", b: "White Lies OK", aPct: 40, feedbackA: "Brutal honesty is your weapon.", feedbackB: "You value social harmony over facts." },
        { a: "Lose Sight", b: "Lose Hearing", aPct: 20, feedbackA: "You treasure the visual world.", feedbackB: "You cannot live without music." },
        { a: "Live in Wilderness", b: "Live in Mega City", aPct: 35, feedbackA: "You seek solitude and nature.", feedbackB: "You thrive in the chaos of humanity." },
        { a: "Unlimited Travel", b: "Unlimited Food", aPct: 75, feedbackA: "The world is your oyster.", feedbackB: "The feast is your fortress." },
        { a: "Change Past", b: "See Future", aPct: 60, feedbackA: "You have regrets to fix.", feedbackB: "You want to prepare for what comes." },
        { a: "Fight a Bear", b: "Fight a Shark", aPct: 70, feedbackA: "You trust your running shoes.", feedbackB: "You prefer water to land." },
        { a: "Give up Music", b: "Give up TV", aPct: 45, feedbackA: "Visual storytelling matters more.", feedbackB: "Life without rhythm is a mistake." },
        { a: "Be 10ft Tall", b: "Be 3ft Tall", aPct: 25, feedbackA: "You want to dominate the room.", feedbackB: "You prefer to fit in small spaces." },
        { a: "Teleportation", b: "Telekinesis", aPct: 80, feedbackA: "The journey is irrelevant to you.", feedbackB: "You want to move the world." },
        { a: "Forgive Everyone", b: "Punish Everyone", aPct: 85, feedbackA: "Mercy is your strength.", feedbackB: "Justice must be absolute." }
    ];

    /** AUDIO SYSTEM */
    class AudioController {
        constructor() {
            this.enabled = false;
            this.unlocked = false;
            this.bgm = this.createTrack(ASSETS.bgm, 0.2, true);
            this.victoryLoop = this.createTrack(ASSETS.victoryLoop, 0.18, true);
            this.sfx = {};
            this.cooldowns = {};
            this.poolSize = 3;

            const sfxVolumes = {
                select: 0.45,
                reveal: 0.45,
                correct: 0.55,
                incorrect: 0.5,
                start: 0.55,
                finish: 0.5
            };

            for (const [key, url] of Object.entries(ASSETS.sfx)) {
                this.sfx[key] = Array.from({ length: this.poolSize }, () => {
                    const sound = new Audio(url);
                    sound.preload = 'auto';
                    sound.volume = sfxVolumes[key] ?? 0.5;
                    return sound;
                });
            }
        }

        createTrack(url, volume, loop = false) {
            const track = new Audio(url);
            track.preload = 'auto';
            track.loop = loop;
            track.volume = volume;
            return track;
        }

        unlock() {
            if (this.unlocked) return;
            this.unlocked = true;
            this.enabled = true;
            [this.bgm, this.victoryLoop].forEach((track) => {
                try {
                    track.load();
                } catch (_) {}
            });
            Object.values(this.sfx).flat().forEach((sound) => {
                try {
                    sound.load();
                } catch (_) {}
            });
        }

        playTrack(track) {
            if (!this.enabled || !track) return;
            track.play().catch(() => {});
        }

        startBGM() {
            if (!this.enabled) return;
            this.victoryLoop.pause();
            this.victoryLoop.currentTime = 0;
            this.playTrack(this.bgm);
        }

        stopBGM() {
            [this.bgm, this.victoryLoop].forEach((track) => {
                track.pause();
                track.currentTime = 0;
            });
        }

        playVictoryLoop() {
            if (!this.enabled) return;
            this.bgm.pause();
            this.bgm.currentTime = 0;
            this.playTrack(this.victoryLoop);
        }

        playSFX(key, cooldown = 0) {
            if (!this.enabled || !this.sfx[key]) return;
            const now = performance.now();
            const lastTime = this.cooldowns[key] ?? 0;
            if (cooldown && now - lastTime < cooldown) return;
            this.cooldowns[key] = now;

            const sound = this.sfx[key].find((entry) => entry.paused || entry.ended) || this.sfx[key][0];
            try {
                sound.currentTime = 0;
            } catch (_) {}
            sound.play().catch(() => {});
        }
    }
    const audio = new AudioController();

    /** ENGINE & STATE */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const verdictGif = document.getElementById('verdict-gif');
    const resultGif = document.getElementById('result-gif');
    const audioHint = document.getElementById('audio-hint');

    let width, height;
    let gameActive = false;
    let currentQIndex = 0;
    let score = 0;
    let state = 'WAITING';
    let animProgress = 0;
    let selectedOption = null;
    let particles = [];
    let revealHandled = false;
    let gifTimers = { reveal: null, result: null };

    const bgImage = new Image();
    bgImage.src = "";
    let bgScale = 1.0;
    let bgDir = 1;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initParticles();
    }
    window.addEventListener('resize', resize);

    function initParticles() {
        particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2 + 1,
                speedY: Math.random() * 0.4 + 0.1,
                alpha: Math.random() * 0.5 + 0.1
            });
        }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let lines = [];

        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);

        let startY = y - ((lines.length - 1) * lineHeight) / 2;
        for (let k = 0; k < lines.length; k++) {
            context.fillText(lines[k], x, startY + (k * lineHeight));
        }
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function showGif(type, duration = 1800) {
        const target = type === 'result' ? resultGif : verdictGif;
        clearTimeout(gifTimers[type]);
        target.classList.add('show');
        gifTimers[type] = setTimeout(() => target.classList.remove('show'), duration);
    }

    function hideAllGifs() {
        verdictGif.classList.remove('show');
        resultGif.classList.remove('show');
        Object.values(gifTimers).forEach((timer) => clearTimeout(timer));
    }

    function enableAudioFromGesture() {
        audio.unlock();
        audioHint.classList.add('hidden');
    }

    /** RENDER LOOP */
    function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        if (bgImage.complete && bgImage.src) {
            bgScale += 0.0001 * bgDir;
            if (bgScale > 1.1) bgDir = -1;
            if (bgScale < 1.0) bgDir = 1;

            const sW = width * bgScale;
            const sH = height * bgScale;
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.drawImage(bgImage, (width - sW) / 2, (height - sH) / 2, sW, sH);
            ctx.restore();
        }

        ctx.fillStyle = '#ffffff';
        particles.forEach(p => {
            p.y -= p.speedY;
            if (p.y < 0) p.y = height;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        if (gameActive) drawGameUI();
    }

    function drawGameUI() {
        const q = QUESTIONS[currentQIndex];
        if (!q) return;

        const compact = width < 640;
        const pad = compact ? 14 : 20;
        const gutter = compact ? 12 : 20;
        const panelW = (width - pad * 2 - gutter) / 2;
        const panelH = Math.min(height * (compact ? 0.42 : 0.5), 420);
        const panelY = Math.max(height * 0.18, compact ? 116 : 120);
        const centerX = width / 2;

        const cA = '#ff5fcf';
        const cB = '#73f3ff';
        const cNeutral = 'rgba(255,255,255,0.06)';

        let hA = 0, hB = 0;
        let borderA = 'rgba(255,255,255,0.1)', borderB = 'rgba(255,255,255,0.1)';
        let textColA = '#fff', textColB = '#fff';

        if (state === 'REVEALING') {
            const ease = 1 - Math.pow(1 - animProgress, 3);
            hA = panelH * (q.aPct / 100) * ease;
            hB = panelH * ((100 - q.aPct) / 100) * ease;

            if (selectedOption === 'a') {
                borderA = cA;
                textColA = cA;
            } else {
                borderB = cB;
                textColB = cB;
            }
        }

        ctx.fillStyle = state === 'REVEALING' ? cA : cNeutral;
        ctx.globalAlpha = state === 'REVEALING' ? 0.2 : 1;
        if (state === 'REVEALING') ctx.fillRect(pad, panelY + panelH - hA, panelW, hA);
        ctx.globalAlpha = 1;
        ctx.lineWidth = selectedOption === 'a' ? 4 : 2;
        ctx.strokeStyle = borderA;
        ctx.strokeRect(pad, panelY, panelW, panelH);

        const panelBX = pad + panelW + gutter;
        ctx.fillStyle = state === 'REVEALING' ? cB : cNeutral;
        ctx.globalAlpha = state === 'REVEALING' ? 0.2 : 1;
        if (state === 'REVEALING') ctx.fillRect(panelBX, panelY + panelH - hB, panelW, hB);
        ctx.globalAlpha = 1;
        ctx.lineWidth = selectedOption === 'b' ? 4 : 2;
        ctx.strokeStyle = borderB;
        ctx.strokeRect(panelBX, panelY, panelW, panelH);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${compact ? 20 : 24}px Exo 2`;

        ctx.fillStyle = textColA;
        wrapText(ctx, q.a, pad + panelW / 2, panelY + panelH / 2, panelW - 20, compact ? 28 : 36);

        ctx.fillStyle = textColB;
        wrapText(ctx, q.b, panelBX + panelW / 2, panelY + panelH / 2, panelW - 20, compact ? 28 : 36);

        ctx.shadowColor = 'rgba(115, 243, 255, 0.35)';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#111c3d';
        ctx.beginPath();
        ctx.arc(centerX, height / 2, compact ? 28 : 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#73f3ff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#eef6ff';
        ctx.font = `400 ${compact ? 14 : 18}px Orbitron`;
        ctx.fillText("OR", centerX, height / 2);

        if (state === 'REVEALING') {
            ctx.font = `400 ${compact ? 24 : 34}px Orbitron`;
            const curPctA = Math.floor(q.aPct * animProgress);
            const curPctB = Math.floor((100 - q.aPct) * animProgress);

            ctx.fillStyle = cA;
            ctx.fillText(curPctA + "%", pad + panelW / 2, panelY - (compact ? 22 : 30));

            ctx.fillStyle = cB;
            ctx.fillText(curPctB + "%", panelBX + panelW / 2, panelY - (compact ? 22 : 30));

            if (animProgress >= 1) {
                const feedbackY = panelY + panelH + (compact ? 40 : 50);

                ctx.font = `700 ${compact ? 17 : 20}px Exo 2`;
                const feedbackText = selectedOption === 'a' ? q.feedbackA : q.feedbackB;

                const textWidth = ctx.measureText(feedbackText).width;
                ctx.fillStyle = 'rgba(7,12,26,0.82)';
                const pillH = compact ? 56 : 60;
                const pillW = Math.min(width - 32, textWidth + 60);

                drawRoundRect(ctx, centerX - pillW / 2, feedbackY - pillH / 2, pillW, pillH, 30);
                ctx.fill();

                ctx.fillStyle = selectedOption === 'a' ? '#ffd5f3' : '#d6fbff';
                ctx.fillText(feedbackText, centerX, feedbackY);

                ctx.font = `600 ${compact ? 13 : 14}px Exo 2`;
                ctx.fillStyle = '#9bb4d8';
                ctx.fillText("Tap to continue...", centerX, height - (compact ? 28 : 40));
            }
        } else {
            ctx.font = `600 ${compact ? 14 : 16}px Exo 2`;
            ctx.fillStyle = '#9bb4d8';
            ctx.fillText("Tap left or right to lock your vote", centerX, panelY + panelH + (compact ? 32 : 40));
        }
    }

    /** GAME LOGIC */
    function gameLoop() {
        if (!gameActive) return;

        draw();

        if (state === 'REVEALING') {
            if (animProgress < 1) {
                animProgress += 0.04;
                if (animProgress >= 1) {
                    animProgress = 1;
                    if (!revealHandled) {
                        revealHandled = true;
                        audio.playSFX('reveal', 180);
                        showGif('reveal', 1500);
                    }
                }
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function handleInput(e) {
        if (!gameActive) return;

        if (state === 'REVEALING' && animProgress >= 1) {
            audio.playSFX('select', 120);
            nextQuestion();
            return;
        }

        if (state !== 'WAITING') return;

        let clientX = e.clientX;
        if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
        }

        const centerX = width / 2;
        const q = QUESTIONS[currentQIndex];

        if (clientX < centerX) {
            selectedOption = 'a';
            if (q.aPct >= 50) score++;
        } else {
            selectedOption = 'b';
            if (q.aPct < 50) score++;
        }

        const matchedCrowd = (selectedOption === 'a' && q.aPct >= 50) || (selectedOption === 'b' && q.aPct < 50);

        audio.playSFX('select', 120);
        audio.playSFX(matchedCrowd ? 'correct' : 'incorrect', 120);
        state = 'REVEALING';
        animProgress = 0;
        revealHandled = false;

        document.getElementById('score').innerText = score;
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex >= QUESTIONS.length) {
            endGame();
        } else {
            state = 'WAITING';
            selectedOption = null;
            animProgress = 0;
            revealHandled = false;
            verdictGif.classList.remove('show');
            document.getElementById('q-num').innerText = (currentQIndex + 1);
        }
    }

    function startGame() {
        enableAudioFromGesture();
        audio.playSFX('start', 120);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');

        currentQIndex = 0;
        score = 0;
        state = 'WAITING';
        selectedOption = null;
        animProgress = 0;
        revealHandled = false;

        hideAllGifs();

        document.getElementById('score').innerText = '0';
        document.getElementById('q-num').innerText = '1';
        document.getElementById('q-total').innerText = QUESTIONS.length;

        gameActive = true;
        audio.startBGM();
        gameLoop();
    }

    function endGame() {
        gameActive = false;
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;

        const judgment = document.getElementById('final-judgment');
        const ratio = score / QUESTIONS.length;
        if (ratio > 0.8) {
            judgment.innerText = '"You read the room like a veteran juror."';
            resultGif.src = ASSETS.gifs.win;
            audio.playSFX('finish', 200);
            audio.playVictoryLoop();
        } else if (ratio > 0.5) {
            judgment.innerText = '"You split instinct and consensus well."';
            resultGif.src = ASSETS.gifs.reveal;
            audio.playSFX('finish', 200);
            audio.playVictoryLoop();
        } else {
            judgment.innerText = '"You make calls the crowd never saw coming."';
            resultGif.src = ASSETS.gifs.lose;
            audio.playSFX('incorrect', 200);
            audio.stopBGM();
        }
        showGif('result', 2600);
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInput(e);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
            enableAudioFromGesture();
            if (!gameActive) return;
            e.preventDefault();
            handleInput({ clientX: width * 0.75 });
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.stopBGM();
        } else if (gameActive) {
            audio.startBGM();
        }
    });

    resize();
    initParticles();

    function idleLoop() {
        if (!gameActive) {
            draw();
            requestAnimationFrame(idleLoop);
        }
    }
    idleLoop();

    });
    </script>
</body>
