<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quarantine Trigger: Outbreak Sweep</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | display: Audiowide | ui: Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #02060e;
            --panel: rgba(7, 17, 31, 0.72);
            --panel-strong: rgba(11, 23, 43, 0.88);
            --panel-border: rgba(124, 240, 255, 0.24);
            --text: #ecf9ff;
            --accent: #7cf0ff;
            --accent-strong: #35c9ff;
            --accent-warm: #ffd166;
            --danger: #ff647c;
            --danger-dark: #8a2036;
            --gray-800: #122033;
            --green-500: #34d399;
            --yellow-500: #fbbf24;
            --red-600: #ff5f6d;
            --blue-500: #3b82f6;
            --blue-400: #60a5fa;
            --grid: rgba(124, 240, 255, 0.09);
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(53, 201, 255, 0.16), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 100, 124, 0.12), transparent 34%),
                linear-gradient(180deg, #0b1730 0%, var(--bg) 45%, var(--bg-deep) 100%);
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body { color: var(--text); }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .glass {
            background:
                linear-gradient(180deg, rgba(12, 24, 44, 0.86), rgba(4, 10, 22, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 42px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.03);
        }
        .hidden { display: none !important; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid rgba(124,240,255,0.3);
            background:
                radial-gradient(circle, rgba(124,240,255,0.12), rgba(124,240,255,0.04) 55%, transparent 70%);
            box-shadow: 0 0 24px rgba(53, 201, 255, 0.16), inset 0 0 24px rgba(124,240,255,0.08);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #effcff, rgba(124,240,255,0.9) 65%, rgba(53,201,255,0.76) 100%);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(124,240,255,0.45);
            transform: translate(-50%, -50%);
        }

        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            pointer-events: none;
            z-index: 10;
            padding: 0.8rem 0.95rem 0.9rem;
            border-radius: 1rem;
            background:
                linear-gradient(180deg, rgba(5, 12, 27, 0.82), rgba(8, 16, 31, 0.64));
            border: 1px solid rgba(124,240,255,0.22);
            box-shadow: 0 14px 28px rgba(0,0,0,0.25);
        }

        .hud-score {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(1rem, 2.8vw, 1.45rem);
            color: #fff;
            text-shadow: 0 0 16px rgba(124,240,255,0.35);
            letter-spacing: 0.08em;
        }

        .hp-shell {
            width: 12rem;
            height: 1rem;
            background: linear-gradient(180deg, rgba(10, 19, 37, 0.95), rgba(20, 32, 52, 0.88));
            border-radius: 999px;
            margin-top: 0.55rem;
            border: 1px solid rgba(255,255,255,0.16);
            overflow: hidden;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.3);
        }

        #hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #34d399, #8bffbf);
            transition: width 0.2s ease;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.45);
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .overlay.dark { background: rgba(0, 0, 0, 0.8); }

        .overlay-panel {
            width: min(100%, 32rem);
            padding: 1.2rem 1rem 1rem;
            border-radius: 1.3rem;
            position: relative;
            overflow: hidden;
        }

        .overlay-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(124,240,255,0.08), transparent 40%),
                linear-gradient(315deg, rgba(255,209,102,0.08), transparent 35%);
            pointer-events: none;
        }

        .title {
            position: relative;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.25rem, 9vw, 4.3rem);
            color: var(--accent);
            margin: 0 0 0.7rem;
            letter-spacing: 0.08em;
            text-shadow: 0 0 16px rgba(124,240,255,0.45);
        }

        .subtitle {
            position: relative;
            margin: 0 0 1.4rem;
            font-size: clamp(1rem, 2.8vw, 1.25rem);
            opacity: 0.92;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .status-title {
            position: relative;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.1rem, 8vw, 3.4rem);
            color: var(--danger);
            margin: 0 0 0.45rem;
            text-shadow: 0 0 14px rgba(255,100,124,0.4);
        }

        .meme-frame {
            position: relative;
            margin-bottom: 1.1rem;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(124,240,255,0.36);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            background: rgba(255,255,255,0.08);
        }

        #meme-display {
            display: block;
            max-width: min(300px, 70vw);
            max-height: min(300px, 34vh);
            object-fit: cover;
        }

        .results-copy {
            position: relative;
            font-size: clamp(1.05rem, 4vw, 1.45rem);
            margin-bottom: 1.2rem;
        }

        .accent { color: var(--accent-warm); }

        .btn {
            border: 0;
            border-radius: 0.85rem;
            padding: 0.95rem 2.2rem;
            cursor: pointer;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(1rem, 4vw, 1.3rem);
            letter-spacing: 0.06em;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, filter 0.12s ease;
        }

        .reaction-stack {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
            width: min(34vw, 188px);
            pointer-events: none;
        }

        .reaction-card {
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(124,240,255,0.26);
            background: rgba(6, 14, 27, 0.76);
            box-shadow: 0 12px 26px rgba(0,0,0,0.28);
        }

        .reaction-card.active {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .reaction-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .reaction-label {
            padding: 0.45rem 0.55rem 0.5rem;
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #d8f7ff;
            background: linear-gradient(180deg, rgba(8,16,31,0.34), rgba(8,16,31,0.7));
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-start {
            background: linear-gradient(180deg, #ffe27a, #ffbe32);
            color: #08111f;
            box-shadow: 0 5px 0 #a96e00, 0 0 18px rgba(255, 209, 102, 0.28);
        }

        .btn-start:hover { filter: brightness(1.04); }

        .btn-restart {
            background: linear-gradient(180deg, #ff8193, var(--red-600));
            color: #fff;
            box-shadow: 0 5px 0 var(--danger-dark), 0 0 18px rgba(255, 95, 109, 0.22);
        }

        .btn-restart:hover { filter: brightness(1.04); }

        .tagline,
        .instruction-strip {
            position: relative;
            margin: 0 auto 0.8rem;
            width: fit-content;
            max-width: 100%;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(124,240,255,0.1);
            border: 1px solid rgba(124,240,255,0.18);
            color: var(--accent);
            font-size: clamp(0.82rem, 2.8vw, 0.98rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .instruction-strip {
            margin-bottom: 1.15rem;
            color: #d8f7ff;
        }

        .screen-copy {
            position: relative;
            margin: 0 0 1.3rem;
            max-width: 24rem;
            font-size: clamp(0.95rem, 3vw, 1.08rem);
            line-height: 1.2;
            color: rgba(236, 249, 255, 0.82);
        }

        .sr-assets { display: none; }

        @keyframes pulse {
            0%, 100% { opacity: 0.74; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        @media (max-width: 640px) {
            #hud { top: 12px; left: 12px; padding: 0.7rem 0.8rem 0.8rem; }
            .overlay { padding: 18px; }
            .overlay-panel { padding: 1rem 0.85rem 0.9rem; }
            .btn { width: min(280px, 84vw); }
            #joystick-zone {
                width: 132px;
                height: 132px;
            }
            .hp-shell { width: min(11rem, 46vw); }
            .reaction-stack {
                top: auto;
                bottom: 18px;
                right: 12px;
                width: min(30vw, 128px);
                gap: 0.55rem;
            }
            .reaction-label {
                font-size: 0.56rem;
                letter-spacing: 0.08em;
            }
        }
    </style>
</head>

<script>
// --- CORE ENGINE & CONFIG ---
window.gameConfigDefs = {
    "playerSpeed": { "type": "number", "label": "Player Speed", "value": 200, "min": 100, "max": 500 },
    "enemySpeed": { "type": "number", "label": "Infected Speed", "value": 120, "min": 50, "max": 300 },
    "spawnRate": { "type": "number", "label": "Spawn Rate (ms)", "value": 800, "min": 200, "max": 2000 },
    "bulletSpeed": { "type": "number", "label": "Pulse Speed", "value": 800, "min": 300, "max": 1000 },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "QUARANTINE TRIGGER" }
};
window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') document.getElementById('ui-title').innerText = val;
    }
};

// --- AUDIO SYSTEM ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.masterGain = null;
        this.bgmEl = document.getElementById('bgm_main');
        this.lastPlayTimes = {};
        this.bgmStarted = false;
        this.ensureContext();
        if (this.bgmEl) {
            this.bgmEl.volume = 0.2;
        }
    }

    ensureContext() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.85;
        this.masterGain.connect(this.ctx.destination);
    }

    async loadSound(id, src) {
        this.ensureContext();
        if (!this.ctx || !src) return;
        try {
            const res = await fetch(src);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(buf);
        } catch (e) {
            console.warn('Audio load fail:', id);
        }
    }

    playSfx(id, options = {}) {
        this.ensureContext();
        if (!this.unlocked || !this.ctx) return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 0;
        if (cooldown && this.lastPlayTimes[id] && now - this.lastPlayTimes[id] < cooldown) {
            return;
        }
        this.lastPlayTimes[id] = now;

        const buffer = this.buffers[id];
        if (!buffer) {
            this.synthesize(options.fallback || id);
            return;
        }

        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        src.buffer = buffer;
        gain.gain.value = options.volume ?? 0.32;
        src.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);
        src.start(0);
    }

    async playBgm() {
        if (!this.unlocked || !this.bgmEl) return;
        this.bgmEl.loop = true;
        try {
            await this.bgmEl.play();
            this.bgmStarted = true;
        } catch (_) {}
    }

    pauseBgm() {
        if (this.bgmEl && !this.bgmEl.paused) {
            this.bgmEl.pause();
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        } else if (type === 'damage' || type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.035, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }
    }

    unlock() {
        this.ensureContext();
        if (!this.ctx) {
            this.unlocked = true;
            return;
        }
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {
            this.unlocked = true;
        });
    }
}

// --- GAME STATE ---
let canvas, ctx;
let audioManager;
let lastTime = 0;
let gameState = 'START'; // START, PLAY, GAMEOVER
let score = 0;
let spawnTimer = 0;
let shakeTime = 0;
let damageSfxTimer = 0;
let lowHealthWarningPlayed = false;
let reactionTimers = { hit: 0, breach: 0 };

// Entities
let player = { x: 0, y: 0, hp: 100, angle: 0 };
let bullets = [];
let enemies = [];
let particles = [];
let joystick = { active: false, originX: 0, originY: 0, dx: 0, dy: 0, id: null };

// --- INIT ---
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    audioManager = new AudioManager();

    // Load Assets
    const soundMap = {
        shoot: 'sfx_shoot',
        enemyHit: 'sfx_enemy_hit',
        enemyDefeat: 'sfx_enemy_defeat',
        damage: 'sfx_damage',
        uiStart: 'sfx_ui_start',
        uiRestart: 'sfx_ui_restart',
        gameOver: 'sfx_game_over'
    };
    Object.entries(soundMap).forEach(([id, elId]) => {
        const src = document.getElementById(elId)?.src;
        if (src) audioManager.loadSound(id, src);
    });

    // Resize
    const resize = () => {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Inputs
    setupInputs();

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    // Loop
    requestAnimationFrame(loop);
});

function setupInputs() {
    canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        audioManager.unlock();

        if (gameState !== 'PLAY') return;

        // Left side of screen = Joystick
        if (e.clientX < window.innerWidth / 2) {
            if (joystick.active) return;
            joystick.active = true;
            joystick.id = e.pointerId;
            joystick.originX = e.clientX;
            joystick.originY = e.clientY;
            joystick.dx = 0;
            joystick.dy = 0;
            updateJoystickVisual(true, e.clientX, e.clientY, 0, 0);
        } else {
            // Right side = Shoot
            shoot(e.clientX, e.clientY);
        }
    }, { passive: false });

    canvas.addEventListener('pointermove', e => {
        e.preventDefault();
        if (gameState === 'PLAY' && joystick.active && e.pointerId === joystick.id) {
            const maxDist = 50;
            let dx = e.clientX - joystick.originX;
            let dy = e.clientY - joystick.originY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                const ratio = maxDist / dist;
                dx *= ratio;
                dy *= ratio;
            }

            joystick.dx = dx / maxDist;
            joystick.dy = dy / maxDist;
            updateJoystickVisual(true, joystick.originX, joystick.originY, dx, dy);

            // Update player angle based on movement
            if (Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1) {
                player.angle = Math.atan2(joystick.dy, joystick.dx);
            }
        }
    }, { passive: false });

    const endInput = e => {
        if (joystick.active && e.pointerId === joystick.id) {
            joystick.active = false;
            joystick.dx = 0;
            joystick.dy = 0;
            updateJoystickVisual(false);
        }
    };
    canvas.addEventListener('pointerup', endInput);
    canvas.addEventListener('pointercancel', endInput);
}

function updateJoystickVisual(active, ox, oy, dx, dy) {
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    if (active) {
        zone.style.opacity = '1';
        zone.style.left = (ox - 75) + 'px';
        zone.style.top = (oy - 75) + 'px';
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else {
        zone.style.opacity = '0';
    }
}

function startGame() {
    const wasGameOver = gameState === 'GAMEOVER';
    gameState = 'PLAY';
    score = 0;
    spawnTimer = 0;
    player.hp = 100;
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight / 2;
    bullets = [];
    enemies = [];
    particles = [];
    joystick.active = false;
    damageSfxTimer = 0;
    lowHealthWarningPlayed = false;
    reactionTimers.hit = 0;
    reactionTimers.breach = 0;
    setReactionVisible('hit', false);
    setReactionVisible('breach', false);

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateHUD();

    audioManager.unlock();
    audioManager.playSfx(wasGameOver ? 'uiRestart' : 'uiStart', { volume: 0.3, cooldown: 180, fallback: 'shoot' });
    audioManager.playBgm();
}

function shoot(tx, ty) {
    // Calculate angle to tap
    const angle = Math.atan2(ty - player.y, tx - player.x);
    player.angle = angle;

    bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * window.gameConfig.bulletSpeed,
        vy: Math.sin(angle) * window.gameConfig.bulletSpeed,
        life: 2 // seconds
    });

    audioManager.playSfx('shoot');
    shakeTime = 0.1;

    // Muzzle flash particle
    for (let i = 0; i < 5; i++) {
        particles.push({
            x: player.x + Math.cos(angle) * 20,
            y: player.y + Math.sin(angle) * 20,
            vx: Math.cos(angle + (Math.random() - 0.5)) * 200,
            vy: Math.sin(angle + (Math.random() - 0.5)) * 200,
            life: 0.1,
            color: '#ffff00',
            size: 3
        });
    }
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const pad = 50;
    if (side === 0) { x = Math.random() * window.innerWidth; y = -pad; }
    else if (side === 1) { x = window.innerWidth + pad; y = Math.random() * window.innerHeight; }
    else if (side === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + pad; }
    else { x = -pad; y = Math.random() * window.innerHeight; }

    enemies.push({
        x: x,
        y: y,
        hp: 3,
        speed: window.gameConfig.enemySpeed * (0.8 + Math.random() * 0.4)
    });
}

function gameOver() {
    if (gameState === 'GAMEOVER') return;
    gameState = 'GAMEOVER';
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score;

    const memeImg = document.getElementById('asset_meme');
    const memeDisplay = document.getElementById('meme-display');
    if (memeImg && memeDisplay) {
        memeDisplay.src = memeImg.src;
    }

    audioManager.playSfx('gameOver', { volume: 0.35, cooldown: 250, fallback: 'gameover' });
    audioManager.pauseBgm();
    triggerReaction('breach', 2.6);
}

function updateHUD() {
    document.getElementById('score').innerText = score;
    const hpBar = document.getElementById('hp-bar');
    hpBar.style.width = Math.max(0, player.hp) + '%';
    hpBar.style.background = player.hp > 50 ? '#22c55e' : player.hp > 20 ? '#eab308' : '#dc2626';
}

function setReactionVisible(type, visible) {
    const el = document.getElementById(`${type}-reaction`);
    if (el) {
        el.classList.toggle('active', visible);
    }
}

function triggerReaction(type, duration = 0.9) {
    reactionTimers[type] = duration;
    setReactionVisible(type, true);
}

// --- MAIN LOOP ---
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (gameState === 'PLAY') {
        update(dt);
    }
    draw();
    requestAnimationFrame(loop);
}

function update(dt) {
    reactionTimers.hit = Math.max(0, reactionTimers.hit - dt);
    reactionTimers.breach = Math.max(0, reactionTimers.breach - dt);
    if (reactionTimers.hit === 0) setReactionVisible('hit', false);
    if (reactionTimers.breach === 0) setReactionVisible('breach', false);

    // Player Move
    if (joystick.active) {
        player.x += joystick.dx * window.gameConfig.playerSpeed * dt;
        player.y += joystick.dy * window.gameConfig.playerSpeed * dt;

        // Clamp
        player.x = Math.max(20, Math.min(window.innerWidth - 20, player.x));
        player.y = Math.max(20, Math.min(window.innerHeight - 20, player.y));
    }

    // Spawn
    spawnTimer += dt * 1000;
    if (spawnTimer > window.gameConfig.spawnRate) {
        spawnEnemy();
        spawnTimer = 0;
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0) bullets.splice(i, 1);
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
            e.x += (dx / dist) * e.speed * dt;
            e.y += (dy / dist) * e.speed * dt;
        }

        if (dist < 30) {
            player.hp -= 30 * dt;
            damageSfxTimer -= dt;
            if (damageSfxTimer <= 0) {
                audioManager.playSfx('damage', { volume: 0.27, cooldown: 300, fallback: 'damage' });
                triggerReaction('breach', 1.1);
                damageSfxTimer = 0.28;
            }
            if (player.hp <= 25 && !lowHealthWarningPlayed) {
                audioManager.playSfx('damage', { volume: 0.2, cooldown: 400, fallback: 'damage' });
                lowHealthWarningPlayed = true;
            }
            updateHUD();
            if (Math.random() < 0.2) {
                particles.push({
                    x: player.x, y: player.y,
                    vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100,
                    life: 0.5, color: '#ef4444', size: 4
                });
            }
            if (player.hp <= 0) gameOver();
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            const bdx = b.x - e.x;
            const bdy = b.y - e.y;
            if (bdx * bdx + bdy * bdy < 900) {
                e.hp--;
                bullets.splice(j, 1);
                audioManager.playSfx('enemyHit', { volume: 0.22, cooldown: 90, fallback: 'hit' });
                triggerReaction('hit', 0.65);
                particles.push({
                    x: e.x, y: e.y,
                    vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                    life: 0.3, color: '#ffffff', size: 2
                });

                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                    score++;
                    audioManager.playSfx('enemyDefeat', { volume: 0.28, cooldown: 110, fallback: 'hit' });
                    updateHUD();
                    for (let k = 0; k < 8; k++) {
                        particles.push({
                            x: e.x, y: e.y,
                            vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300,
                            life: 0.6, color: '#ef4444', size: 5
                        });
                    }
                }
                break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (shakeTime > 0) shakeTime -= dt;
}

function draw() {
    const playW = window.innerWidth;
    const playH = window.innerHeight;

    const bgGradient = ctx.createLinearGradient(0, 0, 0, playH);
    bgGradient.addColorStop(0, '#0d1930');
    bgGradient.addColorStop(0.55, '#08111f');
    bgGradient.addColorStop(1, '#030711');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, playW, playH);

    const bloom = ctx.createRadialGradient(playW * 0.5, playH * 0.45, 30, playW * 0.5, playH * 0.45, Math.max(playW, playH) * 0.7);
    bloom.addColorStop(0, 'rgba(53, 201, 255, 0.12)');
    bloom.addColorStop(1, 'rgba(53, 201, 255, 0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, playW, playH);

    ctx.save();
    if (shakeTime > 0) {
        const intensity = 5;
        ctx.translate((Math.random() - 0.5) * intensity, (Math.random() - 0.5) * intensity);
    }

    ctx.strokeStyle = 'rgba(124, 240, 255, 0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const gridSize = 50;

    for (let x = 0; x <= playW; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, playH);
    }
    for (let y = 0; y <= playH; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(playW, y);
    }
    ctx.stroke();

    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life * 1.8);
        ctx.shadowBlur = 16;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.fillStyle = '#ffd166';
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(255, 209, 102, 0.7)';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    const enemyImg = document.getElementById('asset_player');
    for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);

        const enemyGlow = ctx.createRadialGradient(0, 0, 6, 0, 0, 26);
        enemyGlow.addColorStop(0, 'rgba(255, 180, 190, 0.9)');
        enemyGlow.addColorStop(0.55, 'rgba(255, 100, 124, 0.9)');
        enemyGlow.addColorStop(1, 'rgba(138, 32, 54, 0.95)');
        ctx.fillStyle = enemyGlow;
        ctx.shadowBlur = 18;
        ctx.shadowColor = 'rgba(255, 100, 124, 0.45)';
        ctx.beginPath();
        ctx.arc(0, 0, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (enemyImg && enemyImg.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, 0, 17, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(enemyImg, -20, -20, 40, 40);
            ctx.restore();
        }

        ctx.fillStyle = '#ffd5de';
        ctx.beginPath();
        ctx.arc(-6, -5, 2.6, 0, Math.PI * 2);
        ctx.arc(6, -5, 2.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.moveTo(-7, 6);
        ctx.lineTo(0, 10);
        ctx.lineTo(7, 6);
        ctx.stroke();

        ctx.restore();
    }

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    const playerGlow = ctx.createRadialGradient(-3, -3, 5, 0, 0, 26);
    playerGlow.addColorStop(0, 'rgba(229, 252, 255, 1)');
    playerGlow.addColorStop(0.55, 'rgba(124, 240, 255, 0.96)');
    playerGlow.addColorStop(1, 'rgba(53, 201, 255, 0.86)');
    ctx.fillStyle = playerGlow;
    ctx.shadowBlur = 22;
    ctx.shadowColor = 'rgba(124, 240, 255, 0.42)';
    ctx.beginPath();
    ctx.arc(0, 0, 21, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (enemyImg && enemyImg.complete) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(enemyImg, -20, -20, 40, 40);
        ctx.restore();
    }

    ctx.fillStyle = '#f3fbff';
    ctx.beginPath();
    ctx.arc(-5, -5, 2.8, 0, Math.PI * 2);
    ctx.arc(6, -5, 2.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(5, 26, 40, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 3, 8, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.fillStyle = '#35c9ff';
    ctx.fillRect(10, -5, 28, 10);

    ctx.fillStyle = '#dffcff';
    ctx.beginPath();
    ctx.moveTo(32, 0);
    ctx.lineTo(20, -4);
    ctx.lineTo(20, 4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.restore();
}
