<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Dash Roll</title>
    <!-- [agent-note][stage4] repaired: font-plumbing | source: catalogs/fonts.json | action: consolidated approved display/ui/pixel fonts into workspace-local imports -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Audiowide&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
    </style>
    <style>
        :root {
            --bg: #090814;
            --bg-deep: #04030b;
            --panel: rgba(13, 14, 30, 0.72);
            --panel-strong: rgba(21, 24, 44, 0.88);
            --panel-border: rgba(120, 236, 255, 0.34);
            --cyan: #78ecff;
            --pink: #ff5fb0;
            --gold: #ffd86b;
            --text: #f5faff;
            --danger: #ff627d;
            --dark: #090814;
            --track: #1c2340;
            --track-edge: #86f7ff;
            --spike: #ff5a7b;
            --player-core: #ff7ed1;
            --player-face: #fff3aa;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(120, 236, 255, 0.16), transparent 32%),
                radial-gradient(circle at 20% 20%, rgba(255, 95, 176, 0.14), transparent 26%),
                linear-gradient(180deg, #120f24 0%, var(--bg) 45%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        .hidden { display: none !important; }

        .glass {
            background:
                linear-gradient(180deg, rgba(24, 28, 52, 0.92), rgba(10, 12, 25, 0.84)),
                var(--panel);
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px rgba(0, 0, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 22px rgba(120, 236, 255, 0.1);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(120, 236, 255, 0.44), 0 0 24px rgba(255, 95, 176, 0.24);
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        .font-ui {
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: clamp(88px, 22vw, 134px);
            border-radius: 18px;
            border: 1px solid rgba(120, 236, 255, 0.25);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            background: rgba(6, 8, 18, 0.72);
            padding: 6px;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 70;
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
        }

        .feedback-gif.is-visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif--fail {
            left: 50%;
            right: auto;
            bottom: 132px;
            width: min(42vw, 180px);
            transform: translate(-50%, 12px) scale(0.92);
        }

        .feedback-gif--fail.is-visible {
            transform: translate(-50%, 0) scale(1);
        }

        .feedback-gif__label {
            margin-top: 6px;
            text-align: center;
            font-size: 0.62rem;
            letter-spacing: 0.12em;
            color: #d8f8ff;
            text-transform: uppercase;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 24px;
            background:
                radial-gradient(circle at 50% 12%, rgba(120, 236, 255, 0.08), transparent 22%),
                radial-gradient(circle at 80% 18%, rgba(255, 95, 176, 0.08), transparent 18%);
        }

        #start-screen,
        #game-over-screen {
            pointer-events: auto;
            text-align: center;
            border-radius: 24px;
            padding: 32px;
            width: min(92vw, 520px);
            transition: opacity 300ms ease;
        }

        .panel-title {
            margin: 0 0 12px;
            font-size: clamp(2.5rem, 8vw, 4.25rem);
            line-height: 0.98;
            letter-spacing: 0.08em;
            color: var(--cyan);
        }

        .panel-subtitle {
            margin: 0 0 16px;
            font-size: clamp(1rem, 3.8vw, 1.2rem);
            opacity: 0.92;
            line-height: 1.5;
            color: #d8f8ff;
        }

        .panel-copy {
            margin: 0 0 24px;
            font-size: clamp(0.85rem, 3.2vw, 1rem);
            opacity: 0.84;
            line-height: 1.6;
            max-width: 28rem;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 190px;
            padding: 14px 28px;
            border-radius: 999px;
            font-size: clamp(1rem, 3.8vw, 1.1rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            transform: scale(1);
            transition: transform 180ms ease, background-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
        }

        .action-btn:hover { transform: scale(1.05); }
        .action-btn:active { transform: scale(0.95); }

        .action-btn-primary {
            background: linear-gradient(135deg, var(--pink), #ff8f59);
            color: var(--text);
            box-shadow: 0 12px 26px rgba(255, 95, 176, 0.3);
        }

        .action-btn-primary:hover {
            background: linear-gradient(135deg, #ff76bf, #ffa16f);
        }

        .action-btn-secondary {
            background: linear-gradient(135deg, var(--cyan), #b79cff);
            color: var(--dark);
            box-shadow: 0 12px 26px rgba(120, 236, 255, 0.28);
        }

        .action-btn-secondary:hover {
            background: linear-gradient(135deg, #97f0ff, #cab6ff);
        }

        .danger-title {
            margin: 0 0 16px;
            font-size: clamp(2rem, 7vw, 3.5rem);
            color: var(--danger);
        }

        .results-copy {
            margin: 0 0 24px;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
        }

        #hud {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */

        #score {
            font-size: clamp(1.15rem, 4vw, 1.7rem);
            line-height: 1.2;
            padding: 12px 14px 11px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(16, 18, 35, 0.86), rgba(8, 10, 24, 0.74));
            border: 1px solid rgba(120, 236, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26), inset 0 0 16px rgba(120, 236, 255, 0.08);
        }

        .hud-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            opacity: 0.82;
            color: #d8f8ff;
        }

        .score-value {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 216, 107, 0.45);
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 16px;
            }

            #start-screen,
            #game-over-screen {
                padding: 24px 20px;
                border-radius: 20px;
            }

            #hud {
                top: 16px;
                left: 16px;
            }

            .feedback-gif {
                right: 10px;
                bottom: 10px;
                width: 86px;
            }

            .feedback-gif--fail {
                bottom: 118px;
                width: min(46vw, 150px);
            }

            .hud-label {
                font-size: 0.62rem;
            }
        }
    </style>
</head>

<script>
/**
 * §4 Iron Laws & Core Logic
 */

// --- Global State ---
let canvas, ctx;
let lastTime = 0;
let animationId;
let isGameRunning = false;
let isGameOver = false;
let score = 0;
let gameSpeed = 0;
let frameCount = 0;
let landingReady = false;
let gifTimeouts = {};

// Config
window.gameConfig = {
    heroSpeed: 8,
    jumpForce: 14,
    gravity: 0.8,
    themeColor: "#ff0055"
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.fallbackVoices = new Set();
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (this.unlocked) {
            if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.playBgm();
            return;
        }

        this.unlockListener = () => {
            if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.unlocked = true;
            this.playBgm();
            window.removeEventListener('pointerdown', this.unlockListener);
            window.removeEventListener('keydown', this.unlockListener);
        };

        window.addEventListener('pointerdown', this.unlockListener, { once: true });
        window.addEventListener('keydown', this.unlockListener, { once: true });
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.26;
        if (this.unlocked) {
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, volume = 0.58, cooldown = 90) {
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const el = document.getElementById(id);
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            el.play().catch(() => this.synthesizeFallback(id));
            return;
        }

        this.synthesizeFallback(id);
    }

    synthesizeFallback(id) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (id === 'sfx_coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(760, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1280, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.13);
        } else if (id === 'sfx_jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.09);
        } else if (id === 'sfx_land') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.11);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(68, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.19);
        }
    }
}
const audioManager = new AudioManager();

// --- Game Entities ---
let player = {
    x: 100,
    y: 0,
    r: 15,
    dy: 0,
    grounded: false,
    rotation: 0,
    squish: 1
};

let platforms = [];
let particles = [];
let cameraX = 0;
let coins = [];

// --- Config System ---
window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Roll Speed", "value": 8, "min": 4, "max": 15 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 14, "min": 10, "max": 25 },
    "gravity": { "type": "number", "label": "Gravity", "value": 0.8, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Courier Color", "value": "#ff0055" }
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'themeColor') {
            // Color updates automatically in draw loop
        }
    }
};

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    // Parse config
    try {
        const configEl = document.getElementById('game-config');
        if (configEl) {
            const parsed = JSON.parse(configEl.textContent);
            for (let key in parsed) {
                window.gameConfig[key] = parsed[key].value;
                if(window.gameConfigDefs[key]) window.gameConfigDefs[key] = parsed[key];
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });

    resize();
    window.addEventListener('resize', resize);

    // Input
    const handleInput = (e) => {
        if (!isGameRunning && !isGameOver) return;
        if (isGameOver) return;
        
        e.preventDefault();
        if (player.grounded) {
            player.dy = -window.gameConfig.jumpForce;
            player.grounded = false;
            player.squish = 0.6; // Squash effect
            landingReady = true;
            createParticles(player.x, player.y + player.r, 5, '#fff');
            audioManager.playSfx('sfx_jump', 0.42, 110);
        }
    };

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);

    // Initial Render
    requestAnimationFrame(gameLoop);
});

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setHudScore(value) {
    document.querySelector('#score .score-value').textContent = value;
}

function showFeedbackGif(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(gifTimeouts[id]);
    el.classList.remove('hidden');
    requestAnimationFrame(() => el.classList.add('is-visible'));
    gifTimeouts[id] = setTimeout(() => {
        el.classList.remove('is-visible');
        setTimeout(() => el.classList.add('hidden'), 180);
    }, duration);
}

function startGame() {
    audioManager.init();
    audioManager.playSfx('sfx_ui', 0.45, 120);
    audioManager.playBgm();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    resetGame();
}

function resetGame() {
    isGameRunning = true;
    isGameOver = false;
    score = 0;
    gameSpeed = window.gameConfig.heroSpeed;
    cameraX = 0;
    landingReady = false;
    
    player.x = 100;
    player.y = canvas.height / 2;
    player.dy = 0;
    player.grounded = false;
    player.rotation = 0;
    
    platforms = [];
    coins = [];
    particles = [];
    
    // Initial platform
    platforms.push({ x: 0, y: canvas.height - 100, w: 1000, h: 100, type: 'normal' });
    
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    setHudScore("0");
    
    lastTime = performance.now();
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color || '#fff',
            size: Math.random() * 4 + 2
        });
    }
}

function generateWorld() {
    // Generate platforms ahead of camera
    let lastPlat = platforms[platforms.length - 1];
    let spawnX = lastPlat.x + lastPlat.w;
    
    while (spawnX < cameraX + canvas.width / window.devicePixelRatio + 500) {
        let gap = 100 + Math.random() * 100;
        let w = 200 + Math.random() * 400;
        let h = 100; // Ground height
        let y = canvas.height / window.devicePixelRatio - h;
        
        // Random height variation
        if (Math.random() > 0.5) y -= Math.random() * 100;
        
        // Spike chance
        let type = 'normal';
        if (Math.random() > 0.7) type = 'spike';

        platforms.push({ x: spawnX + gap, y: y, w: w, h: h + 200, type: type });
        
        // Coin generation
        if (Math.random() > 0.3 && type !== 'spike') {
            coins.push({
                x: spawnX + gap + w/2,
                y: y - 50 - Math.random() * 100,
                r: 10,
                collected: false
            });
        }
        
        spawnX += gap + w;
        lastPlat = platforms[platforms.length - 1];
    }
    
    // Cleanup
    platforms = platforms.filter(p => p.x + p.w > cameraX - 200);
    coins = coins.filter(c => c.x > cameraX - 200);
}

function update(dt) {
    if (!isGameRunning) return;

    // Physics
    player.dy += window.gameConfig.gravity;
    player.y += player.dy;
    player.x += gameSpeed * (dt / 16); // Move player forward
    
    // Rotation visual
    player.rotation += (gameSpeed * 0.1);

    // Camera follow
    cameraX = player.x - 100;
    
    // Ground Collision
    player.grounded = false;
    let onPlatform = false;
    
    // Collision logic
    // We treat player as a box for platform top collision for stability
    let playerBottom = player.y + player.r;
    let playerRight = player.x + player.r;
    let playerLeft = player.x - player.r;
    
    for (let p of platforms) {
        if (playerRight > p.x && playerLeft < p.x + p.w) {
            // Top collision
            if (playerBottom >= p.y && playerBottom <= p.y + 30 && player.dy >= 0) {
                player.y = p.y - player.r;
                player.dy = 0;
                player.grounded = true;
                onPlatform = true;
                
                if (landingReady) {
                    landingReady = false;
                    audioManager.playSfx('sfx_land', 0.34, 140);
                }

                if (p.type === 'spike') {
                    die();
                }
            } 
            // Side collision (death)
            else if (player.y > p.y + 10) {
                die();
            }
        }
    }
    
    // Fall death
    if (player.y > canvas.height / window.devicePixelRatio + 100) {
        die();
    }
    
    // Coin Collection
    for (let c of coins) {
        if (!c.collected) {
            let dx = player.x - c.x;
            let dy = player.y - c.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < player.r + c.r + 10) {
                c.collected = true;
                score += 100;
                audioManager.playSfx('sfx_coin', 0.52, 120);
                createParticles(c.x, c.y, 10, '#ffd700');
                showFeedbackGif('pickup-gif', 850);
            }
        }
    }
    
    // Score based on distance
    score += Math.round(gameSpeed * 0.1);
    setHudScore(score);
    
    // Difficulty scaling
    gameSpeed += 0.001;
    
    // World Gen
    generateWorld();
    
    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Squash recovery
    player.squish += (1 - player.squish) * 0.1;
}

function die() {
    isGameRunning = false;
    isGameOver = true;
    audioManager.playSfx('sfx_die', 0.6, 300);
    audioManager.stopBgm();
    showFeedbackGif('fail-gif', 1600);
    createParticles(player.x, player.y, 30, window.gameConfig.themeColor);
    
    // Screen shake effect handled in draw via offset
    setTimeout(() => {
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('finalScore').textContent = score;
    }, 500);
}

function draw() {
    const width = canvas.width / window.devicePixelRatio;
    const height = canvas.height / window.devicePixelRatio;
    
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
    skyGradient.addColorStop(0, '#160f2f');
    skyGradient.addColorStop(0.45, '#090814');
    skyGradient.addColorStop(1, '#03020a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, height);

    const hazeGradient = ctx.createRadialGradient(width * 0.5, height * 0.12, 10, width * 0.5, height * 0.12, width * 0.65);
    hazeGradient.addColorStop(0, 'rgba(120, 236, 255, 0.18)');
    hazeGradient.addColorStop(1, 'rgba(120, 236, 255, 0)');
    ctx.fillStyle = hazeGradient;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    
    // Camera Transform
    ctx.translate(-cameraX, 0);
    
    // Parallax Background (Stars/Grid)
    ctx.strokeStyle = 'rgba(120, 236, 255, 0.08)';
    ctx.lineWidth = 1.5;
    let gridSize = 100;
    let startX = Math.floor(cameraX / gridSize) * gridSize;
    for (let x = startX; x < cameraX + width + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
    }
    for (let y = height * 0.55; y < height; y += 48) {
        ctx.beginPath();
        ctx.moveTo(cameraX - 200, y);
        ctx.lineTo(cameraX + width + 300, y);
        ctx.stroke();
    }

    for (let i = 0; i < 28; i++) {
        const starX = cameraX * 0.15 + ((i * 173) % (width + 240)) - 120;
        const starY = 32 + ((i * 67) % Math.max(140, height * 0.45));
        const twinkle = 0.4 + Math.sin((Date.now() / 450) + i) * 0.25;
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0.18, twinkle)})`;
        ctx.beginPath();
        ctx.arc(starX, starY, i % 5 === 0 ? 2.1 : 1.3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Platforms
    for (let p of platforms) {
        const platGradient = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        platGradient.addColorStop(0, p.type === 'spike' ? '#462038' : '#273155');
        platGradient.addColorStop(1, p.type === 'spike' ? '#1f1223' : '#111727');
        ctx.fillStyle = platGradient;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(p.x, p.y + 8, p.w, 3);

        ctx.shadowBlur = 12;
        ctx.shadowColor = p.type === 'spike' ? '#ff5a7b' : '#78ecff';
        ctx.fillStyle = p.type === 'spike' ? '#ff5a7b' : '#78ecff';
        ctx.fillRect(p.x, p.y, p.w, 5);
        ctx.shadowBlur = 0;
        
        if (p.type === 'spike') {
            ctx.fillStyle = '#ff5a7b';
            ctx.beginPath();
            for(let i=0; i<p.w; i+=40) {
                ctx.moveTo(p.x + i, p.y);
                ctx.lineTo(p.x + i + 20, p.y - 20);
                ctx.lineTo(p.x + i + 40, p.y);
            }
            ctx.fill();
        }
    }
    
    // Coins
    for (let c of coins) {
        if (c.collected) continue;
        const bobY = c.y + Math.sin(Date.now() / 220) * 5;
        ctx.shadowColor = '#ffd86b';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ffd86b';
        ctx.beginPath();
        ctx.arc(c.x, bobY, c.r + 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff3b8';
        ctx.beginPath();
        ctx.arc(c.x, bobY, c.r * 0.48, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Player
    if (isGameRunning || (!isGameRunning && !isGameOver)) {
        ctx.translate(player.x, player.y);
        ctx.rotate(player.rotation);
        
        const pulse = 0.92 + Math.sin(Date.now() / 160) * 0.06;
        const playerGradient = ctx.createRadialGradient(-4, -6, 2, 0, 0, player.r + 6);
        playerGradient.addColorStop(0, '#fff0b3');
        playerGradient.addColorStop(0.28, window.gameConfig.themeColor);
        playerGradient.addColorStop(1, '#7f2fff');
        ctx.fillStyle = playerGradient;
        ctx.shadowColor = window.gameConfig.themeColor;
        ctx.shadowBlur = 18;

        // Squash & Stretch drawing
        ctx.scale((1 / player.squish) * pulse, player.squish / pulse);
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath();
        ctx.arc(-player.r * 0.3, -player.r * 0.35, player.r * 0.72, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#20103f';
        ctx.beginPath();
        ctx.arc(-4, -2, 2.4, 0, Math.PI * 2);
        ctx.arc(5, -1, 2.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#20103f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0.5, 4, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.restore(); // Restore from player transform
    }
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    
    ctx.restore(); // Restore camera
}

function gameLoop(timestamp) {
    try {
        const dt = Math.min(timestamp - lastTime, 64);
        lastTime = timestamp;
        
        update(dt);
        draw();
        
        animationId = requestAnimationFrame(gameLoop);
    } catch (e) {
        console.error("Game Loop Error:", e);
    }
}

</script>
