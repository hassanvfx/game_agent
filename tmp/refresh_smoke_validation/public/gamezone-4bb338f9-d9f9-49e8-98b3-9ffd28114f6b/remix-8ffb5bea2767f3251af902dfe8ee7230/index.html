        .select-none { user-select: none; }

        .py-1 { padding-top: 0.45rem; padding-bottom: 0.45rem; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 1.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }

        .glass {

            backdrop-filter: blur(8px);
            border-color: var(--panel-border);
            box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.05);

        .crt-overlay {
            position: absolute;

            background-size: 100% 2px, 3px 100%;
            opacity: 0.85;

        .scanline {
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, transparent, rgba(98, 224, 255, 0.32), transparent);
            position: absolute;
            animation: scan 6s linear infinite;
            pointer-events: none;
            z-index: 41;
        }

        @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }

            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 98, 125, 0.3); }

<script>
/** 
 * §0 CORE SYSTEMS 
 */
const CONFIG_DEFS = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEFS).map(([k, v]) => [k, v.value]));
window.updateGameConfig = (k, v) => { if(window.gameConfig[k] !== undefined) window.gameConfig[k] = v; };

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
let cw = 0, ch = 0, dpr = 1;
let lastTime = 0;
let initialized = false;
let gameState = 'OFFICE'; // OFFICE, DIALOGUE, DRIVING, ARREST, GAMEOVER
let stateTimer = 0;
let phaseTime = 0;

// Entities
let particles = [];
let entities = [];
let player = { x: 0, y: 0, w: 0, h: 0, shaking: false };
let suspect = null;
let shakeIntensity = 0;

/**
 * §1 AUDIO ENGINE (Web Audio API)
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBuffers = {};
const bgm = document.getElementById('bgm_main');
const gifAlert = document.getElementById('gif-alert');
const gifOutcome = document.getElementById('gif-outcome');
let isMuted = false;
let ringLoopSource = null;
let bgmStarted = false;
let audioInitialized = false;
let activeSfx = new Map();
let gifTimers = {};

async function initAudio() {
    if (audioInitialized) return;
    audioInitialized = true;
    const load = async (id, url) => {
        try {
            const res = await fetch(url);
            const buf = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(buf);
        } catch(e) { console.warn('Audio fail:', id); }
    };
    await Promise.all([...document.querySelectorAll('audio')].map(el => load(el.id, el.src)));
}

function playSfx(id, rate=1, vol=1, loop=false) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (activeSfx.has(id) && !loop) {
        const existing = activeSfx.get(id);
        try { existing.stop(0); } catch (e) {}
        activeSfx.delete(id);
    }
    const buf = audioBuffers[id];
    if (!buf) { synthesizeSfx(id); return null; }
    
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    src.playbackRate.value = rate;
    src.loop = loop;
    gain.gain.value = vol;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.onended = () => {
        if (activeSfx.get(id) === src) activeSfx.delete(id);
    };
    src.start(0);
    if (loop || vol <= 0.6) activeSfx.set(id, src);
    return src;
}

function stopLoop(sourceRef) {
    if (!sourceRef) return null;
    try { sourceRef.stop(0); } catch (e) {}
    return null;
}

function ensureBgm() {
    if (bgmStarted) return;
    bgmStarted = true;
    playSfx('bgm_main', 1, 0.28, true);
}

function syncAudioForState() {
    if (gameState === 'GAMEOVER') {
        ringLoopSource = stopLoop(ringLoopSource);
        return;
    }
    if (gameState === 'OFFICE' || gameState === 'DRIVING' || gameState === 'ARREST' || gameState === 'DIALOGUE') {
        ensureBgm();
    }
}

function showGif(target, activeSrc, duration = 1500) {
    if (!target) return;
    if (gifTimers[target.id]) clearTimeout(gifTimers[target.id]);
    target.src = activeSrc;
    target.classList.add('active');
    gifTimers[target.id] = setTimeout(() => {
        target.classList.remove('active');
    }, duration);
}

function synthesizeSfx(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.2);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    }
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'vib-'+Date.now(), version: '1.0',
        params: { style }
    });
}

/**
 * §2 GAME LOGIC & STATE
 */
function initGame() {
    initialized = true;
    startPhase('OFFICE');
}

function startPhase(phase) {
    gameState = phase;
    stateTimer = 0;
    entities = [];
    particles = [];
    
    // UI Reset
    ['dialogue-box','action-controls','game-over-screen','timer-display'].forEach(id => 
        document.getElementById(id).classList.add('hidden'));
    document.getElementById('hud').classList.remove('hidden');

    if (phase === 'OFFICE') {
        // Setup Office Scene
        player = { x: cw/2, y: ch*0.6, w: 100, h: 100, shaking: false }; // Phone is focus
        createRain(100);
        ringLoopSource = stopLoop(ringLoopSource);
    } else if (phase === 'DRIVING') {
        player = { x: cw/2, y: ch-120, w: 40, h: 70, vx: 0 };
        phaseTime = 15; // 15s chase
        document.getElementById('timer-display').classList.remove('hidden');
    } else if (phase === 'ARREST') {
        suspect = { x: cw/2, y: ch*0.4, w: 60, h: 120, frame: 0 };
        phaseTime = window.gameConfig.reactionTime;
        document.getElementById('action-controls').classList.remove('hidden');
        document.getElementById('timer-display').classList.remove('hidden');
    }
}

function createRain(count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            vy: 10 + Math.random() * 20,
            l: 5 + Math.random() * 10,
            type: 'rain'
        });
    }
}

function update(dt) {
    stateTimer += dt;

    // Phase: OFFICE
    if (gameState === 'OFFICE') {
        if (stateTimer > 1.5 && !player.shaking) {
            player.shaking = true;
            if (!ringLoopSource) ringLoopSource = playSfx('sfx_ring', 1, 0.34, true);
            showGif(gifAlert, 'https://i.giphy.com/wBvdVGaSsamOxPy5qY.webp', 2200);
            vibrate('medium');
        }
        // Rain update
        particles.forEach(p => {
            if(p.type === 'rain') {
                p.y += p.vy * 60 * dt;
                if(p.y > ch) p.y = -20;
            }
        });
    }

    // Phase: DRIVING
    else if (gameState === 'DRIVING') {
        phaseTime -= dt;
        document.getElementById('phase-timer').innerText = `00:${Math.ceil(phaseTime).toString().padStart(2,'0')}`;
        
        // Player Movement
        const targetX = Math.max(30, Math.min(cw-30, pointerX));
        player.x += (targetX - player.x) * 5 * dt;

        // Road Particles (Lines)
        if (Math.random() < 0.2) {
            particles.push({ x: cw/3, y: -50, vy: window.gameConfig.chaseSpeed * 4, type: 'road', h: 40 });
            particles.push({ x: cw*2/3, y: -50, vy: window.gameConfig.chaseSpeed * 4, type: 'road', h: 40 });
        }
        
        // Traffic
        if (Math.random() < 0.02 * window.gameConfig.chaseSpeed/100) {
            entities.push({ 
                x: Math.random() > 0.5 ? cw*0.25 : cw*0.75, 
                y: -100, w: 40, h: 70, type: 'car', color: '#ef4444' 
            });
        }

        // Update Entities
        for (let i = entities.length-1; i>=0; i--) {
            let e = entities[i];
            e.y += window.gameConfig.chaseSpeed * 3 * dt;
            
            // Collision
            if (Math.abs(e.x - player.x) < 35 && Math.abs(e.y - player.y) < 60) {
                shakeScreen(20);
                playSfx('sfx_collision', 1, 0.55);
                showGif(gifOutcome, 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp', 1800);
                gameOver(false, "RUN LOST", "Your interceptor clipped civilian traffic.");
            }
            if (e.y > ch+100) entities.splice(i, 1);
        }

        if (phaseTime <= 0) startPhase('ARREST');
    }

    // Phase: ARREST
    else if (gameState === 'ARREST') {
        phaseTime -= dt;
        document.getElementById('phase-timer').innerText = phaseTime.toFixed(2);
        
        // Suspect Animation
        suspect.frame += dt * 5;
        suspect.x = cw/2 + Math.sin(stateTimer * 2) * 20;

        if (phaseTime <= 0) {
            playSfx('sfx_fail', 1, 0.5);
            showGif(gifOutcome, 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 1800);
            gameOver(false, "WINDOW MISSED", "The rogue mech fired before you committed.");
        }
    }

    // Global Particles
    for (let i = particles.length-1; i>=0; i--) {
        let p = particles[i];
        if (p.type === 'road') {
            p.y += p.vy * dt;
            if (p.y > ch) particles.splice(i, 1);
        }
    }

    // Shake Decay
    if (shakeIntensity > 0) {
        shakeIntensity *= 0.9;
        if (shakeIntensity < 0.5) shakeIntensity = 0;
    }
}

function draw() {
     // Clear & Shake
     const sceneGradient = ctx.createLinearGradient(0, 0, 0, ch);
     sceneGradient.addColorStop(0, '#07101f');
     sceneGradient.addColorStop(1, '#040814');
     ctx.fillStyle = sceneGradient;
     ctx.fillRect(0, 0, cw, ch);
    
    let dx = 0, dy = 0;
    if (shakeIntensity > 0) {
        dx = (Math.random()-0.5)*shakeIntensity;
        dy = (Math.random()-0.5)*shakeIntensity;
    }
    ctx.save();
    ctx.translate(dx, dy);

    if (gameState === 'OFFICE') drawOffice();
    else if (gameState === 'DRIVING') drawDriving();
    else if (gameState === 'ARREST') drawArrest();
    
    ctx.restore();
}

/**
 * §3 RENDERERS
 */
 function drawOffice() {
     const skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
     skyGrad.addColorStop(0, '#08162c');
     skyGrad.addColorStop(1, '#030712');
     ctx.fillStyle = skyGrad;
     ctx.fillRect(0, 0, cw, ch);

     const winW = cw * 0.42;
     const winH = ch * 0.32;
     const winX = cw * 0.08;
     const winY = ch * 0.08;

     const neonGlow = ctx.createLinearGradient(winX, winY, winX, winY + winH);
     neonGlow.addColorStop(0, 'rgba(82, 216, 255, 0.14)');
     neonGlow.addColorStop(1, 'rgba(8, 16, 32, 0.45)');
     ctx.fillStyle = neonGlow;
     ctx.fillRect(winX, winY, winW, winH);

     ctx.strokeStyle = 'rgba(99, 210, 255, 0.24)';
     ctx.lineWidth = 1.2;
     ctx.beginPath();
     particles.forEach(p => {
         if (p.type === 'rain' && p.x > winX && p.x < winX + winW && p.y > winY && p.y < winY + winH) {
             ctx.moveTo(p.x, p.y);
             ctx.lineTo(p.x - 2, p.y + p.l + 6);
         }
     });
     ctx.stroke();

     ctx.strokeStyle = '#10233d';
     ctx.lineWidth = 6;
     ctx.strokeRect(winX, winY, winW, winH);
     ctx.beginPath();
     ctx.moveTo(winX + winW / 2, winY);
     ctx.lineTo(winX + winW / 2, winY + winH);
     ctx.moveTo(winX, winY + winH / 2);
     ctx.lineTo(winX + winW, winY + winH / 2);
     ctx.stroke();

     const skylineY = ch * 0.23;
     for (let i = 0; i < 8; i++) {
         const bx = i * (cw / 7.2);
         const bw = 34 + (i % 3) * 16;
         const bh = 60 + (i % 4) * 26;
         ctx.fillStyle = i % 2 === 0 ? '#0d1a31' : '#132342';
         ctx.fillRect(bx, skylineY, bw, bh);
         ctx.fillStyle = 'rgba(255, 200, 87, 0.5)';
         for (let wy = skylineY + 8; wy < skylineY + bh - 4; wy += 14) {
             for (let wx = bx + 6; wx < bx + bw - 4; wx += 10) {
                 if ((wx + wy + i) % 3 === 0) ctx.fillRect(wx, wy, 4, 6);
             }
         }
     }

     ctx.fillStyle = '#020617';
     ctx.beginPath();
     ctx.arc(cw * 0.72, ch * 0.48, 42, 0, Math.PI * 2);
     ctx.fill();
     ctx.fillRect(cw * 0.62, ch * 0.43, 86, 12);
     ctx.fillRect(cw * 0.67, ch * 0.36, 44, 30);
     ctx.beginPath();
     ctx.ellipse(cw * 0.72, ch * 0.71, 84, 152, 0, Math.PI, 0);
     ctx.fill();

     const deskGrad = ctx.createLinearGradient(0, ch * 0.62, 0, ch);
     deskGrad.addColorStop(0, '#351206');
     deskGrad.addColorStop(1, '#190a05');
     ctx.fillStyle = deskGrad;
     ctx.beginPath();
     ctx.moveTo(0, ch);
     ctx.lineTo(0, ch * 0.6);
     ctx.lineTo(cw, ch * 0.62);
     ctx.lineTo(cw, ch);
     ctx.fill();

     const lampGlow = ctx.createRadialGradient(cw * 0.23, ch * 0.58, 10, cw * 0.23, ch * 0.82, 220);
     lampGlow.addColorStop(0, 'rgba(255, 200, 87, 0.5)');
     lampGlow.addColorStop(0.35, 'rgba(255, 200, 87, 0.18)');
     lampGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
     ctx.fillStyle = lampGlow;
     ctx.beginPath();
     ctx.moveTo(cw * 0.23, ch * 0.56);
     ctx.lineTo(cw * 0.54, ch);
     ctx.lineTo(-cw * 0.08, ch);
     ctx.closePath();
     ctx.fill();

     ctx.fillStyle = '#8f4d16';
     ctx.fillRect(cw * 0.17, ch * 0.55, 32, 42);
     ctx.fillStyle = '#ffd978';
     ctx.fillRect(cw * 0.18, ch * 0.58, 28, 10);

     const px = cw * 0.5;
     const py = ch * 0.7;
     const shake = player.shaking ? (Math.random() - 0.5) * 5 : 0;

     const phoneGlow = ctx.createRadialGradient(px, py, 12, px, py, 84);
     phoneGlow.addColorStop(0, 'rgba(98, 224, 255, 0.18)');
     phoneGlow.addColorStop(1, 'rgba(98, 224, 255, 0)');
     ctx.fillStyle = phoneGlow;
     ctx.beginPath();
     ctx.ellipse(px, py, 78, 52, 0, 0, Math.PI * 2);
     ctx.fill();

     ctx.fillStyle = '#070d18';
     ctx.beginPath();
     ctx.roundRect(px - 54, py - 10, 108, 38, 18);
     ctx.fill();

     ctx.fillStyle = '#101c32';
     ctx.beginPath();
     ctx.ellipse(px, py + 6, 46, 32, 0, 0, Math.PI * 2);
     ctx.fill();

     ctx.fillStyle = '#9bdfff';
     ctx.beginPath();
     ctx.arc(px, py - 2, 16, 0, Math.PI * 2);
     ctx.fill();

     ctx.fillStyle = '#07101f';
     for (let i = 0; i < 8; i++) {
         const ang = i * (Math.PI / 4);
         ctx.beginPath();
         ctx.arc(px + Math.cos(ang) * 10, py - 2 + Math.sin(ang) * 10, 2.2, 0, Math.PI * 2);
         ctx.fill();
     }

     ctx.save();
     ctx.translate(px + shake, py - 24 + shake);
     ctx.rotate(-0.12);
     const handsetGrad = ctx.createLinearGradient(-42, 0, 42, 0);
     handsetGrad.addColorStop(0, '#1d355f');
     handsetGrad.addColorStop(0.5, '#234e86');
     handsetGrad.addColorStop(1, '#132847');
     ctx.fillStyle = handsetGrad;
     ctx.beginPath();
     ctx.roundRect(-42, -12, 84, 24, 12);
     ctx.fill();

     ctx.fillStyle = '#234e86';
     ctx.beginPath();
     ctx.arc(-40, 0, 16, 0, Math.PI * 2);
     ctx.fill();
     ctx.beginPath();
     ctx.arc(40, 0, 16, 0, Math.PI * 2);
     ctx.fill();

     ctx.strokeStyle = 'rgba(98, 224, 255, 0.45)';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.moveTo(-18, -2);
     ctx.lineTo(18, -2);
     ctx.stroke();
     ctx.restore();

     if (player.shaking) {
         ctx.strokeStyle = 'rgba(255, 98, 125, 0.85)';
         ctx.lineWidth = 3;
         ctx.beginPath();
         ctx.arc(px, py - 16, 54 + Math.sin(stateTimer * 14) * 4, Math.PI * 1.1, Math.PI * 1.9);
         ctx.stroke();
         ctx.beginPath();
         ctx.arc(px, py - 16, 68 + Math.cos(stateTimer * 14) * 3, Math.PI * 1.15, Math.PI * 1.85);
         ctx.stroke();

             if (Math.floor(Date.now() / 200) % 2 === 0) {
                 ctx.fillStyle = '#ff627d';
                 ctx.font = '24px VT323, monospace';
                 ctx.fillText('RING', px + 42, py - 42);
             }
     }
 }

 function drawDriving() {
     const roadGrad = ctx.createLinearGradient(0, 0, 0, ch);
     roadGrad.addColorStop(0, '#203559');
     roadGrad.addColorStop(1, '#0f1b30');
     ctx.fillStyle = roadGrad;
     ctx.fillRect(0, 0, cw, ch);

     ctx.fillStyle = '#0f1828';
     ctx.fillRect(0, 0, 24, ch);
     ctx.fillRect(cw - 24, 0, 24, ch);

     ctx.strokeStyle = 'rgba(98, 224, 255, 0.16)';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.moveTo(cw * 0.33, 0);
     ctx.lineTo(cw * 0.33, ch);
     ctx.moveTo(cw * 0.66, 0);
     ctx.lineTo(cw * 0.66, ch);
     ctx.stroke();

     ctx.fillStyle = '#d7ecff';
     particles.forEach(p => {
         if (p.type === 'road') ctx.fillRect(p.x, p.y, 5, p.h);
     });

     ctx.fillStyle = '#3aa0ff';
     ctx.shadowBlur = 16;
     ctx.shadowColor = 'rgba(106, 182, 255, 0.75)';
     ctx.beginPath();
     ctx.roundRect(player.x - player.w / 2, player.y, player.w, player.h, 8);
     ctx.fill();
     ctx.fillStyle = '#a6e5ff';
     ctx.fillRect(player.x - player.w / 2 + 4, player.y + 10, player.w - 8, 16);
     ctx.fillStyle = '#62e0ff';
     ctx.fillRect(player.x - player.w / 2 + 8, player.y + player.h - 10, player.w - 16, 4);
     ctx.shadowBlur = 0;

     entities.forEach(e => {
         const enemyGrad = ctx.createLinearGradient(e.x - e.w / 2, e.y, e.x + e.w / 2, e.y + e.h);
         enemyGrad.addColorStop(0, '#ff6f83');
         enemyGrad.addColorStop(1, '#901b3a');
         ctx.fillStyle = enemyGrad;
         ctx.beginPath();
         ctx.roundRect(e.x - e.w / 2, e.y, e.w, e.h, 8);
         ctx.fill();
         ctx.fillStyle = '#ffb2c0';
         ctx.fillRect(e.x - e.w / 2 + 4, e.y + 10, e.w - 8, 12);
         ctx.fillStyle = '#ff627d';
         ctx.fillRect(e.x - e.w / 2 + 3, e.y + e.h - 6, 10, 5);
         ctx.fillRect(e.x + e.w / 2 - 13, e.y + e.h - 6, 10, 5);
     });
 }

 function drawArrest() {
     const alleyGrad = ctx.createLinearGradient(0, 0, 0, ch);
     alleyGrad.addColorStop(0, '#08111f');
     alleyGrad.addColorStop(1, '#02060f');
     ctx.fillStyle = alleyGrad;
     ctx.fillRect(0, 0, cw, ch);

     const spotlight = ctx.createRadialGradient(cw / 2, ch / 2, 50, cw / 2, ch / 2, cw);
     spotlight.addColorStop(0, 'rgba(98, 224, 255, 0.12)');
     spotlight.addColorStop(0.35, 'rgba(255,255,255,0.06)');
     spotlight.addColorStop(1, 'rgba(0,0,0,0.9)');
     ctx.fillStyle = spotlight;
     ctx.fillRect(0, 0, cw, ch);

     ctx.fillStyle = 'rgba(98, 224, 255, 0.08)';
     ctx.fillRect(cw * 0.16, 0, 8, ch);
     ctx.fillRect(cw * 0.82, 0, 10, ch);

     const sx = suspect.x;
     const sy = suspect.y;
     ctx.fillStyle = '#030712';
     ctx.fillRect(sx - 22, sy, 44, 84);
     ctx.beginPath();
     ctx.arc(sx, sy - 10, 15, 0, Math.PI * 2);
     ctx.fill();

     ctx.strokeStyle = '#030712';
     ctx.lineWidth = 9;
     ctx.beginPath();
     ctx.moveTo(sx + 14, sy + 20);
     ctx.lineTo(sx + 42, sy + 10);
     ctx.stroke();

     ctx.fillStyle = '#9cb0c9';
     ctx.fillRect(sx + 35, sy + 5, 15, 8);

     ctx.strokeStyle = 'rgba(98, 224, 255, 0.22)';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.arc(sx, sy + 18, 34 + Math.sin(stateTimer * 4) * 4, 0, Math.PI * 2);
     ctx.stroke();

     ctx.strokeStyle = '#ff627d';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.arc(cw / 2, ch * 0.4, 100 - (phaseTime * 10), 0, Math.PI * 2);
     ctx.stroke();
     ctx.beginPath();
     ctx.moveTo(cw / 2 - 18, ch * 0.4);
     ctx.lineTo(cw / 2 + 18, ch * 0.4);
     ctx.moveTo(cw / 2, ch * 0.4 - 18);
     ctx.lineTo(cw / 2, ch * 0.4 + 18);
     ctx.stroke();
 }

/**
 * §4 INPUT & CONTROL
 */
let pointerX = 0;

function handleGlobalInput(e) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    initAudio();
    syncAudioForState();

    if (gameState === 'GAMEOVER') { restartGame(); return; }
    
    if (gameState === 'OFFICE') {
        if (player.shaking) {
            // Answer Phone
            player.shaking = false;
            ringLoopSource = stopLoop(ringLoopSource);
            playSfx('sfx_confirm', 1, 0.4);
            showDialogue();
        }
    } else if (gameState === 'DIALOGUE') {
        startPhase('DRIVING');
    }
}

function showDialogue() {
    gameState = 'DIALOGUE';
    const box = document.getElementById('dialogue-box');
    box.classList.remove('hidden');
    document.getElementById('dialogue-text').innerText = "ROGUE UNIT ZERO BREACHED SECTOR 4.\nTHREAD THE TRAFFIC GRID.\nTAG OR BLAST ON CONTACT.";
    showGif(gifAlert, 'https://i.giphy.com/TytHun5lKuMdzUYVxl.webp', 1600);
    vibrate('light');
}

function gameOver(win, title, msg) {
    gameState = 'GAMEOVER';
    const screen = document.getElementById('game-over-screen');
    screen.classList.remove('hidden');
    document.getElementById('go-title').innerText = title;
    document.getElementById('go-title').className = `text-4xl font-bold mb-2 tracking-tighter uppercase ${win ? 'text-blue-500' : 'text-red-500'}`;
    document.getElementById('go-msg').innerText = msg;
    document.getElementById('go-icon').innerText = win ? '🛰️' : '⚠️';
    
    if (win) {
        playSfx('sfx_success', 1, 0.48);
        showGif(gifOutcome, 'https://i.giphy.com/10gLW3UdTnQzdu.webp', 2200);
    } else {
        playSfx('sfx_fail', 1, 0.5);
        showGif(gifOutcome, 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 2200);
        vibrate('heavy');
        shakeScreen(15);
    }
}

function shakeScreen(amt) {
    shakeIntensity = amt;
}

function restartGame() {
    initGame();
}

// Event Listeners
window.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
});
window.addEventListener('pointerdown', e => {
    handleGlobalInput(e);
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
}, { passive: false });

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    handleGlobalInput(e);
    restartGame();
});

document.getElementById('btn-arrest').addEventListener('click', (e) => {
    e.stopPropagation();
    if(gameState !== 'ARREST') return;
    playSfx('sfx_confirm', 0.94, 0.4);
    gameOver(true, "TARGET TAGGED", "Dispatch logged a clean capture.");
});

document.getElementById('btn-shoot').addEventListener('click', (e) => {
    e.stopPropagation();
    if(gameState !== 'ARREST') return;
    shakeScreen(20);
    playSfx('sfx_collision', 1.04, 0.5);
    showGif(gifOutcome, 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp', 1800);
    gameOver(true, "TARGET SCRAPPED", "The rogue unit was stopped cold.");
});

/**
 * §5 LOOP & INIT
 */
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (initialized && gameState !== 'GAMEOVER') {
        update(dt);
    }
    draw();
    requestAnimationFrame(loop);
}

const ro = new ResizeObserver(entries => {
    const r = entries[0].contentRect;
    canvas.width = r.width * window.devicePixelRatio;
    canvas.height = r.height * window.devicePixelRatio;
    cw = r.width;
    ch = r.height;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    if (!initialized) initGame();
    else if (gameState === 'OFFICE') startPhase('OFFICE'); // Redraw office on resize
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    requestAnimationFrame(loop);
});

</script>
