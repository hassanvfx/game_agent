<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Ghost Mall Dash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Exo+2:wght@400;600&display=swap');
        /* [agent-note][stage4] repaired: font-remap | title -> Creepster | ui -> Exo 2 from catalogs/fonts.json */
        :root {
            --bg: #14071d;
            --bg-deep: #07030d;
            --panel-border: rgba(146, 244, 255, 0.36);
            --panel-bg: rgba(23, 10, 39, 0.76);
            --panel-shadow: 0 0 42px rgba(58, 225, 255, 0.18);
            --text-soft: rgba(240, 248, 255, 0.78);
            --text-faint: rgba(207, 231, 255, 0.55);
            --purple-200: #f0d3ff;
            --purple-300: #e1a8ff;
            --purple-400: #c87cff;
            --purple-700: #7d2bc4;
            --purple-900: #341047;
            --cyan-100: #cffafe;
            --cyan-300: #77ecff;
            --cyan-500: #27d6ff;
            --red-500: #ff5d78;
            --green-400: #78ffbc;
            --yellow-400: #ffd968;
            --white: #ffffff;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at top, rgba(108, 56, 167, 0.38), transparent 34%),
                radial-gradient(circle at bottom, rgba(27, 214, 255, 0.2), transparent 28%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        .game-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(255,255,255,0.08), transparent 18%),
                linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%);
        }
        .game-root::before,
        .game-root::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .game-root::before {
            background:
                linear-gradient(90deg, transparent 0, rgba(119, 236, 255, 0.09) 50%, transparent 100%);
            opacity: 0.45;
            mix-blend-mode: screen;
        }
        .game-root::after {
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.02) 0,
                    rgba(255,255,255,0.02) 2px,
                    transparent 2px,
                    transparent 6px
                );
            opacity: 0.16;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(31, 12, 52, 0.9), rgba(13, 8, 28, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), transparent 30%),
                linear-gradient(180deg, transparent, rgba(39, 214, 255, 0.06));
            pointer-events: none;
        }
        .start-card,
        .game-over-card {
            pointer-events: auto;
            text-align: center;
            z-index: 10;
        }
        .start-card {
            padding: 2.2rem 2rem;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }
        .start-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 0 52px rgba(39, 214, 255, 0.22);
        }
        .game-over-card { padding: 2.2rem 2rem; }
        .title {
            margin: 0 0 0.35rem;
            color: var(--white);
            font-family: 'Creepster', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(3rem, 9vw, 5.4rem);
            line-height: 0.88;
            letter-spacing: 0.08em;
            text-shadow:
                0 0 12px rgba(255, 93, 120, 0.5),
                0 0 26px rgba(39, 214, 255, 0.22);
        }
        .subtitle {
            margin: 0 0 1.25rem;
            color: var(--cyan-300);
            font-size: clamp(0.9rem, 2.9vw, 1.15rem);
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }
        .instruction-list {
            margin: 0 0 1.6rem;
            padding: 1rem 1rem 0.85rem;
            color: var(--text-soft);
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            border: 1px solid rgba(200, 124, 255, 0.2);
            border-radius: 1rem;
            background: rgba(9, 9, 18, 0.28);
            text-transform: uppercase;
        }
        .instruction-list p { margin: 0.35rem 0; }
        .primary-btn,
        .secondary-btn {
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            padding: 0.95rem 2.1rem;
            font: 700 0.96rem 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.18em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }
        .primary-btn {
            background: linear-gradient(90deg, var(--cyan-500), var(--purple-400));
            color: #120b1d;
            box-shadow: 0 0 20px rgba(39, 214, 255, 0.35);
        }
        .primary-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 34px rgba(39, 214, 255, 0.52);
        }
        .secondary-btn {
            background: rgba(255,255,255,0.08);
            color: var(--white);
            box-shadow: 0 8px 24px rgba(0,0,0,0.28);
        }
        .secondary-btn:hover {
            background: rgba(255,255,255,0.14);
            color: var(--cyan-100);
        }
        .hidden { display: none !important; }
        .game-over-title {
            margin: 0 0 0.25rem;
            color: var(--red-500);
            font-family: 'Creepster', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(2.75rem, 8vw, 4.5rem);
            text-shadow: 0 0 14px rgba(255,93,120,0.75);
        }
        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 5.25rem;
            width: min(28vw, 8rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(119, 236, 255, 0.28);
            background: rgba(11, 8, 22, 0.55);
            box-shadow: 0 10px 28px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
            z-index: 4;
        }
        .feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }
        .feedback-gif.fail {
            right: auto;
            left: 1rem;
        }
        .game-over-copy {
            margin: 0 0 1.2rem;
            color: var(--text-soft);
            font-size: 0.96rem;
            letter-spacing: 0.04em;
        }
        .score-line {
            margin: 0 0 1.75rem;
            color: var(--white);
            font-size: clamp(1.35rem, 4vw, 1.8rem);
            font-weight: 700;
        }
        .score-value { color: var(--purple-300); }
        .hud {
            position: absolute;
            top: 1.5rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.2rem;
            pointer-events: none;
            gap: 0.75rem;
        }
        .hud-label,
        .status-text {
            padding: 0.7rem 0.95rem;
            border-radius: 999px;
            border: 1px solid rgba(119, 236, 255, 0.22);
            background: rgba(9, 7, 19, 0.44);
            box-shadow: 0 10px 24px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .hud-label {
            color: var(--white);
            font-size: clamp(0.85rem, 2.4vw, 1rem);
            font-weight: 700;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
            letter-spacing: 0.14em;
        }
        .hud-value { color: var(--purple-400); }
        .status-text {
            color: var(--text-soft);
            font-size: clamp(0.8rem, 2.3vw, 0.98rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-align: center;
        }
        .status-safe { color: var(--green-400); }
        .status-alert {
            color: var(--yellow-400);
            animation: pulse 1s ease-in-out infinite;
        }
        .status-stop { color: var(--red-500); }
        .controls-hint {
            position: absolute;
            bottom: 2rem;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(225, 168, 255, 0.2);
            background: rgba(9, 7, 19, 0.35);
            color: var(--text-faint);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            animation: pulse 1.6s ease-in-out infinite;
            text-transform: uppercase;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
        @media (max-width: 640px) {
            .start-card,
            .game-over-card {
                width: min(92vw, 28rem);
                padding: 1.5rem 1.15rem;
            }
            .title {
                font-size: clamp(2.4rem, 12vw, 4rem);
            }
            .subtitle {
                letter-spacing: 0.2em;
                margin-bottom: 1rem;
            }
            .instruction-list {
                font-size: 0.75rem;
                padding: 0.85rem 0.8rem 0.7rem;
                margin-bottom: 1.2rem;
            }
            .primary-btn,
            .secondary-btn {
                width: 100%;
                max-width: 100%;
                padding: 0.9rem 1rem;
                font-size: 0.86rem;
            }
            .hud {
                padding: 0 0.75rem;
                top: 0.85rem;
                gap: 0.5rem;
            }
            .hud-label,
            .status-text {
                padding: 0.55rem 0.75rem;
            }
            .controls-hint {
                bottom: 1.15rem;
                text-align: center;
                padding: 0.6rem 0.9rem;
            }
            .feedback-gif {
                width: min(24vw, 5.5rem);
                bottom: 4.5rem;
            }
        }
    </style>
</head>
    <body>
    <div id="game-container" class="game-root">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="ui-layer">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel start-card">
                <h1 class="title">GHOST MALL</h1>
                <p class="subtitle">Dash past the watcher</p>
                <div class="instruction-list">
                    <p>HOLD to drift toward the exit gate</p>
                    <p>RELEASE when the mall watcher turns around</p>
                </div>
                <button id="start-btn" class="primary-btn">START HAUNT</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel game-over-card">
                <h2 class="game-over-title">SPOTTED!</h2>
                <p class="game-over-copy">The mall watcher caught your glow in motion.</p>
                <div class="score-line">Gates Cleared: <span id="finalScore" class="score-value">0</span></div>
                <button id="restart-btn" class="secondary-btn">TRY AGAIN</button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="hud-label">GATE <span id="level-display" class="hud-value">1</span></div>
                <div class="status-text status-safe" id="status-text">COAST IS CLEAR</div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: warning/fail feedback -> catalogs/gifs.json compact corner overlays -->
            <img id="alert-gif" class="feedback-gif" alt="Watcher alert reaction" />
            <img id="fail-gif" class="feedback-gif fail" alt="Caught reaction" />

            <!-- Mobile Controls Hint -->
            <div id="controls-hint" class="controls-hint hidden">
                HOLD SCREEN TO DRIFT
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                alert: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                alert: "https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayAt = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.28;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    audio.volume = k === 'alert' ? 0.45 : 0.65;
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.enabled = true;
            }
            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, debounceMs = 140) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayAt[key] && now - this.lastPlayAt[key] < debounceMs) return;
                this.lastPlayAt[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const alertGif = document.getElementById('alert-gif');
        const failGif = document.getElementById('fail-gif');
        alertGif.src = ASSETS.gifs.alert;
        failGif.src = ASSETS.gifs.fail;
        let width, height;
        let gameActive = false;
        let level = 1;
        let isMoving = false; // User input state
        let frameCount = 0;
        let alertCuePlayed = false;
        let gifTimer = null;

        // Entities
        let player = { x: 50, y: 0, w: 40, h: 40, speed: 0 };
        let demon = { 
            state: 'IDLE', // IDLE (Safe), ALERT (Transition), WATCHING (Danger)
            timer: 0,
            cycleDuration: 200, // Frames
            alertDuration: 60,
            watchDuration: 120,
            eyeColor: '#ffffff'
        };
        let door = { x: 0, w: 60, h: 100, open: false };
        let particles = [];
        let clubLights = []; // Parallax bg

        /** 4. RESIZE & INIT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParallax();
        }
        window.addEventListener('resize', resize);

        function initParallax() {
            clubLights = [];
            for(let i=0; i<10; i++) {
                clubLights.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    w: Math.random() * 50 + 20,
                    h: height,
                    speed: Math.random() * 0.5 + 0.1,
                    alpha: Math.random() * 0.1
                });
            }
        }

        function initLevel() {
            hideGif(alertGif);
            hideGif(failGif);
            alertCuePlayed = false;
            player.x = 50;
            player.y = height - 150;
            player.speed = width * 0.006; // Responsive speed
            
            door.x = width - 120;
            door.open = false;

            // Demon logic gets harder per level
            demon.state = 'IDLE';
            demon.timer = 0;
            demon.cycleDuration = Math.max(60, 200 - (level * 10)); // Faster switching
            demon.watchDuration = Math.min(180, 100 + (level * 10)); // Stares longer
            
            particles = [];
            
            document.getElementById('level-display').innerText = level;
            updateStatusText();
        }

        /** 5. INPUT HANDLING */
        function showGif(element, duration = 1100) {
            clearTimeout(gifTimer);
            hideGif(alertGif);
            hideGif(failGif);
            element.classList.add('show');
            gifTimer = setTimeout(() => hideGif(element), duration);
        }

        function hideGif(element) {
            element.classList.remove('show');
        }

        const startMove = (e) => {
            if (!gameActive) return;
            if (e.type === 'touchstart') e.preventDefault();
            isMoving = true;
        };
        const endMove = (e) => {
            if (!gameActive) return;
            if (e.type === 'touchend' || e.type === 'touchcancel') e.preventDefault();
            isMoving = false;
        };

        // [agent-note][stage4] repaired: mobile-tap-actionability | scope touch suppression to gameplay surface so menu buttons still receive tap -> click
        canvas.addEventListener('mousedown', startMove);
        canvas.addEventListener('touchstart', startMove, { passive: false });
        window.addEventListener('mouseup', endMove);
        window.addEventListener('touchend', endMove, { passive: false });
        window.addEventListener('touchcancel', endMove, { passive: false });

        /** 6. GAME LOOP */
        function update() {
            if (!gameActive) return;
            frameCount++;

            // -- Player Logic --
            if (isMoving) {
                player.x += player.speed;
                // Add trail particles
                if(frameCount % 5 === 0) {
                    particles.push({
                        x: player.x, 
                        y: player.y + player.h, 
                        vx: -2, vy: (Math.random()-0.5)*2, 
                        life: 20, 
                        color: 'rgba(255, 255, 255, 0.5)'
                    });
                }
            }

            // -- Demon Logic --
            demon.timer++;
            
            // State Machine
            if (demon.state === 'IDLE') {
                if (demon.timer > demon.cycleDuration) {
                    demon.state = 'ALERT';
                    demon.timer = 0;
                    demon.eyeColor = '#fbbf24'; // Yellow warning
                    alertCuePlayed = false;
                    audio.playSFX('alert', 500);
                    showGif(alertGif, 900);
                    updateStatusText();
                }
            } else if (demon.state === 'ALERT') {
                if (demon.timer > demon.alertDuration) {
                    demon.state = 'WATCHING';
                    demon.timer = 0;
                    demon.eyeColor = '#ef4444'; // Red danger
                    updateStatusText();
                }
            } else if (demon.state === 'WATCHING') {
                if (!alertCuePlayed) {
                    audio.playSFX('alert', 500);
                    showGif(alertGif, 1200);
                    alertCuePlayed = true;
                }
                // DEATH CHECK
                if (isMoving) {
                    gameOver();
                    return;
                }
                if (demon.timer > demon.watchDuration) {
                    demon.state = 'IDLE';
                    demon.timer = 0;
                    demon.eyeColor = '#ffffff'; // White safe
                    alertCuePlayed = false;
                    hideGif(alertGif);
                    updateStatusText();
                }
            }

            // -- Win Check --
            if (player.x + player.w > door.x) {
                levelComplete();
            }

            // -- Particles --
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            });
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#0f0518'; // Dark Purple/Black
            ctx.fillRect(0, 0, width, height);

            // 1. Parallax Background (Club Lights)
            ctx.save();
            clubLights.forEach(light => {
                light.x -= light.speed;
                if(light.x + light.w < 0) light.x = width;
                
                const grad = ctx.createLinearGradient(light.x, 0, light.x + light.w, 0);
                grad.addColorStop(0, `rgba(147, 51, 234, 0)`);
                grad.addColorStop(0.5, `rgba(147, 51, 234, ${light.alpha})`);
                grad.addColorStop(1, `rgba(147, 51, 234, 0)`);
                
                ctx.fillStyle = grad;
                ctx.fillRect(light.x, 0, light.w, height);
            });
            ctx.restore();

            // 2. Floor Grid
            ctx.save();
            ctx.strokeStyle = '#4c1d95';
            ctx.lineWidth = 2;
            const gridSize = 50;
            const offset = isMoving ? (Date.now() / 5) % gridSize : 0; // Move grid only when running
            
            ctx.beginPath();
            // Horizontal lines
            for(let y = height - 150; y < height; y+=20) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            // Vertical lines (Perspective)
            for(let x = 0; x < width + gridSize; x+=gridSize) {
                // Slant them to look like 3D
                let xPos = x - offset;
                ctx.moveTo(xPos, height - 150);
                ctx.lineTo(xPos - (width/2 - xPos)*0.5, height); 
            }
            ctx.stroke();
            ctx.restore();

            // 3. Door
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#22d3ee';
            ctx.fillStyle = '#0891b2';
            ctx.fillRect(door.x, height - 250, door.w, 200);
            ctx.fillStyle = '#cffafe';
            ctx.fillRect(door.x + 10, height - 250 + 10, door.w - 20, 180);
            ctx.shadowBlur = 0;
            ctx.restore();

            // 4. Player (White Spirit)
            ctx.save();
            ctx.translate(player.x, player.y);

            // Bobbing animation
            const bob = Math.sin(frameCount * 0.2) * 5;

            const ghostGlow = ctx.createRadialGradient(20, 28 + bob, 6, 20, 28 + bob, 34);
            ghostGlow.addColorStop(0, '#ffffff');
            ghostGlow.addColorStop(0.55, '#b8fbff');
            ghostGlow.addColorStop(1, 'rgba(184, 251, 255, 0)');

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#8af2ff';
            ctx.fillStyle = ghostGlow;

            ctx.beginPath();
            ctx.arc(20, 20 + bob, 20, Math.PI, 0);
            ctx.lineTo(40, 48 + bob);
            ctx.quadraticCurveTo(35, 42 + bob, 30, 46 + bob);
            ctx.quadraticCurveTo(25, 52 + bob, 20, 46 + bob);
            ctx.quadraticCurveTo(15, 40 + bob, 10, 46 + bob);
            ctx.quadraticCurveTo(5, 52 + bob, 0, 48 + bob);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(13, 16 + bob, 7, Math.PI * 1.08, Math.PI * 1.9);
            ctx.fill();

            ctx.fillStyle = '#162030';
            ctx.beginPath();
            ctx.arc(12, 21 + bob, 3.2, 0, Math.PI * 2);
            ctx.arc(28, 21 + bob, 3.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff7aa8';
            ctx.beginPath();
            ctx.arc(20, 31 + bob, 3.8, 0.1, Math.PI - 0.1);
            ctx.fill();

            ctx.fillStyle = 'rgba(39, 214, 255, 0.18)';
            ctx.fillRect(5, 52 + bob, 30, 4);

            ctx.restore();

            // 5. Mall Watcher (Spiky Purple Sentinel)
            // Positioned in background near the exit gate
            drawDemon(width - 250, height - 400);

            // 6. Particles
            ctx.fillStyle = 'white';
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
            ctx.globalAlpha = 1;

            // 7. Danger Overlay (Vignette)
            if (demon.state === 'WATCHING') {
                const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
                grad.addColorStop(0, 'transparent');
                grad.addColorStop(1, 'rgba(239, 68, 68, 0.3)');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,width,height);
            }

            requestAnimationFrame(draw);
        }

        function drawDemon(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Scale breathing
            const breath = Math.sin(frameCount * 0.05) * 0.05 + 1;
            ctx.scale(breath, breath);

            // Body (Purple Spiky Blob)
            const watcherAura = ctx.createRadialGradient(100, 100, 26, 100, 100, 128);
            watcherAura.addColorStop(0, demon.state === 'WATCHING' ? '#ff93bb' : '#b08cff');
            watcherAura.addColorStop(0.5, '#6b21a8');
            watcherAura.addColorStop(1, '#250734');
            ctx.fillStyle = watcherAura;
            ctx.strokeStyle = demon.state === 'WATCHING' ? '#ff9dc3' : '#9ceeff';
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.moveTo(100, 0);
            // Spikes around body
            for(let i=0; i<Math.PI*2; i+=0.4) {
                let r = 100 + (Math.sin(frameCount * 0.06 + i) * 8) + (Math.random() * 3);
                if (demon.state === 'WATCHING') r += 18;
                let dx = Math.cos(i) * r;
                let dy = Math.sin(i) * r;
                ctx.lineTo(100 + dx, 100 + dy);
                ctx.lineTo(100 + Math.cos(i+0.2)*82, 100 + Math.sin(i+0.2)*82);
            }
            ctx.closePath();
            ctx.shadowBlur = demon.state === 'WATCHING' ? 24 : 12;
            ctx.shadowColor = demon.state === 'WATCHING' ? '#ff5d78' : '#32d8ff';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.stroke();

            // Reaching hands
            ctx.fillStyle = '#f0d3ff';
            // Left Claw
            ctx.beginPath();
            ctx.moveTo(20, 150);
            ctx.lineTo(0, 220);
            ctx.lineTo(40, 220);
            ctx.fill();
            // Right Claw
            ctx.beginPath();
            ctx.moveTo(180, 150);
            ctx.lineTo(160, 220);
            ctx.lineTo(200, 220);
            ctx.fill();

            // Face
            if (demon.state === 'IDLE') {
                // Back turned / Sleeping
                ctx.fillStyle = '#4c1d95';
                ctx.beginPath();
                ctx.arc(100, 100, 80, 0, Math.PI*2); // Back of head
                ctx.fill();
            } else {
                // Face visible
                const faceGlow = ctx.createRadialGradient(100, 94, 10, 100, 100, 90);
                faceGlow.addColorStop(0, '#3a0f5a');
                faceGlow.addColorStop(1, '#16051f');
                ctx.fillStyle = faceGlow;
                ctx.beginPath();
                ctx.arc(100, 100, 80, 0, Math.PI*2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = demon.eyeColor;
                ctx.shadowBlur = 20;
                ctx.shadowColor = demon.eyeColor;

                // Left Eye
                ctx.beginPath();
                ctx.ellipse(70, 90, 15, 25, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#14071d';
                ctx.beginPath();
                ctx.ellipse(70, 94, 6, 11, 0, 0, Math.PI*2);
                ctx.fill();

                // Right Eye
                ctx.fillStyle = demon.eyeColor;
                ctx.beginPath();
                ctx.ellipse(130, 90, 15, 25, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#14071d';
                ctx.beginPath();
                ctx.ellipse(130, 94, 6, 11, 0, 0, Math.PI*2);
                ctx.fill();

                // Mouth
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#05060c';
                ctx.beginPath();
                if (demon.state === 'WATCHING') {
                    // Open mouth
                    ctx.arc(100, 140, 30, 0, Math.PI, false);
                } else {
                    // Flat line
                    ctx.rect(80, 140, 40, 5);
                }
                ctx.fill();
            }

            // Threat pose while the watcher stares
            if (demon.state === 'WATCHING') {
                ctx.save();
                ctx.translate(220, 100);
                ctx.rotate(Math.sin(frameCount * 0.5) * 0.2); // Shake
                
                // Club Handle
                ctx.fillStyle = '#713f12';
                ctx.fillRect(0, 0, 20, 100);
                // Club Head (Spiky)
                ctx.fillStyle = '#9ca3af';
                ctx.beginPath();
                ctx.arc(10, 0, 40, 0, Math.PI*2);
                ctx.fill();
                // Spikes on club
                ctx.fillStyle = 'white';
                for(let i=0; i<8; i++) {
                    let angle = (i/8) * Math.PI*2;
                    let sx = 10 + Math.cos(angle)*40;
                    let sy = Math.sin(angle)*40;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + Math.cos(angle)*15, sy + Math.sin(angle)*15);
                    ctx.lineTo(sx + Math.cos(angle+0.2)*5, sy + Math.sin(angle+0.2)*5);
                    ctx.fill();
                }
                ctx.restore();
            }

            ctx.restore();
        }

        function updateStatusText() {
            const el = document.getElementById('status-text');
            if (demon.state === 'IDLE') {
                el.innerText = "COAST IS CLEAR";
                el.className = "status-text status-safe";
            } else if (demon.state === 'ALERT') {
                el.innerText = "WATCHER TURNING";
                el.className = "status-text status-alert";
            } else {
                el.innerText = "FREEZE!";
                el.className = "status-text status-stop";
            }
        }

        function levelComplete() {
            gameActive = false;
            isMoving = false; // Force stop
            audio.playSFX('win', 250);
            level++;
            setTimeout(() => {
                gameActive = true;
                initLevel();
            }, 1500);
        }

        function gameOver() {
            gameActive = false;
            isMoving = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            showGif(failGif, 1600);

            // Visual feedback of death (Club Smash)
            ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.fillRect(0,0,width,height);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls-hint').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = level - 1;
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive || demon.state !== 'IDLE') { // Keep drawing if just game over for a sec
                // requestAnimationFrame handled in draw
            }
        }

        /** 7. CONTROLS SETUP */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 250);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            resize();
            gameActive = true;
            initLevel();
            draw(); // Start loop
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', 250);
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            level = 1;
            gameActive = true;
            initLevel();
        });

        // Initial Draw
        resize();
        ctx.fillStyle = '#0f0518';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });
    </script>
</body>
</html>
