<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Signal Sprint</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap');

:root {
  --bg: #050816;
  --bg-deep: #02030c;
  --panel: rgba(8, 18, 44, 0.86);
  --panel-strong: rgba(10, 30, 66, 0.92);
  --cyan: #7af7ff;
  --cyan-strong: #28d8ff;
  --pink: #ff58c8;
  --gold: #ffd36b;
  --text: #f6fbff;
  --text-dim: rgba(205, 233, 255, 0.76);
  --grid-glow: rgba(122, 247, 255, 0.16);
  --hud-border: rgba(122, 247, 255, 0.3);
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 18%, rgba(40, 216, 255, 0.18), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(255, 88, 200, 0.12), transparent 28%),
    linear-gradient(180deg, #091126 0%, var(--bg) 45%, var(--bg-deep) 100%);
  font-family: 'Exo 2', system-ui, sans-serif;
}

body {
  color: var(--text);
}

#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#game-container::before,
#game-container::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#game-container::before {
  background:
    radial-gradient(circle at center, transparent 0 38%, rgba(122, 247, 255, 0.08) 60%, transparent 78%),
    linear-gradient(90deg, transparent 0 14%, rgba(122, 247, 255, 0.07) 14% 14.5%, transparent 14.5% 50%, rgba(255, 88, 200, 0.05) 50% 50.5%, transparent 50.5% 86%, rgba(122, 247, 255, 0.07) 86% 86.5%, transparent 86.5% 100%);
  opacity: 0.85;
}

#game-container::after {
  background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 18%, transparent 82%, rgba(122,247,255,0.08));
  mix-blend-mode: screen;
  opacity: 0.6;
}

canvas {
  display: block;
  touch-action: none;
  width: 100%;
  height: 100%;
}

#ui-layer {
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  user-select: none;
}

#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--cyan);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.hud-score {
  display: flex;
  align-items: center;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--hud-border);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(8, 18, 44, 0.88), rgba(3, 10, 26, 0.82));
  box-shadow: 0 0 18px rgba(40, 216, 255, 0.12);
  backdrop-filter: blur(8px);
}

.hud-score span:last-child {
  font-size: 1.45rem;
  margin-left: 8px;
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
}

.hud-center {
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
  font-size: 0.7rem;
  opacity: 0.86;
  letter-spacing: 0.22em;
  text-align: center;
  line-height: 1.4;
  padding: 10px 12px;
  border: 1px solid rgba(255, 211, 107, 0.22);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 211, 107, 0.12), rgba(122, 247, 255, 0.08));
  color: rgba(246, 251, 255, 0.92);
  box-shadow: 0 0 14px rgba(255, 211, 107, 0.12);
}

#start-tip {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  width: min(92vw, 500px);
  padding: 13px 16px;
  border: 1px solid rgba(122, 247, 255, 0.34);
  background: linear-gradient(180deg, rgba(5, 14, 32, 0.82), rgba(3, 8, 22, 0.92));
  color: rgba(234, 247, 255, 0.92);
  font-size: 0.74rem;
  line-height: 1.5;
  letter-spacing: 0.08em;
  text-align: center;
  backdrop-filter: blur(10px);
  border-radius: 14px;
  box-shadow: 0 0 22px rgba(40, 216, 255, 0.12);
}

#start-tip strong {
  color: var(--gold);
  display: block;
  margin-bottom: 4px;
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
}

.hidden {
  display: none !important;
}

.feedback-gif {
  position: absolute;
  z-index: 35;
  width: clamp(88px, 20vw, 140px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
  border: 1px solid rgba(122, 247, 255, 0.34);
  background: rgba(2, 8, 22, 0.78);
  box-shadow: 0 0 24px rgba(40, 216, 255, 0.18);
  opacity: 0;
  transform: scale(0.88);
  transition: opacity 180ms ease, transform 180ms ease;
  pointer-events: none;
}

.feedback-gif.is-visible {
  opacity: 0.92;
  transform: scale(1);
}

#celebration-gif {
  top: 78px;
  right: 14px;
}

#alert-gif {
  left: 14px;
  bottom: 94px;
}

.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 22%, rgba(40, 216, 255, 0.16), rgba(0, 0, 0, 0.95) 45%);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  backdrop-filter: blur(8px);
}

.overlay-panel {
  box-shadow: 0 0 32px rgba(40, 216, 255, 0.2), inset 0 0 26px rgba(122, 247, 255, 0.08);
  border: 2px solid var(--cyan);
  background: linear-gradient(180deg, var(--panel-strong), var(--panel));
  padding: 32px;
  border-radius: 18px;
  text-align: center;
  max-width: 320px;
  margin: 0 16px;
}

.overlay-title {
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
  font-size: 1.9rem;
  font-weight: 400;
  margin: 0 0 8px;
  letter-spacing: 0.12em;
}

.overlay-desc {
  color: var(--text-dim);
  font-size: 0.88rem;
  margin: 0 0 24px;
  letter-spacing: 0.06em;
  line-height: 1.5;
}

.neon-text {
  text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
}

.neon-box {
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.05);
  border: 2px solid var(--cyan);
  background: var(--panel);
}

#restart-btn {
  padding: 12px 28px;
  background: linear-gradient(180deg, rgba(255, 211, 107, 0.2), rgba(40, 216, 255, 0.18));
  border: 1px solid rgba(122, 247, 255, 0.9);
  color: var(--text);
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
  font-size: 0.78rem;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
  cursor: pointer;
  pointer-events: auto;
  border-radius: 999px;
  box-shadow: 0 0 14px rgba(40, 216, 255, 0.16);
}

#restart-btn:hover,
#restart-btn:focus-visible {
  background: linear-gradient(180deg, rgba(255, 211, 107, 0.3), rgba(40, 216, 255, 0.28));
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255, 211, 107, 0.18);
}

@media (max-width: 640px) {
  #hud {
    padding: 12px;
    font-size: 14px;
    letter-spacing: 0.14em;
  }

  .hud-score span:last-child {
    font-size: 1.15rem;
    margin-left: 6px;
  }

  .hud-center {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
  }

  #start-tip {
    bottom: 14px;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    padding: 10px 12px;
  }

  #celebration-gif {
    top: 70px;
    right: 10px;
  }

  #alert-gif {
    left: 10px;
    bottom: 82px;
  }

  .overlay-panel {
    padding: 24px 20px;
  }

  .overlay-title {
    font-size: 1.55rem;
  }
}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
<div id="hud">
<div class="hud-score neon-text" style="color: #7af7ff">YOU <span id="score-you">0</span></div>
<div class="hud-center">SIGNAL SPRINT<br>Guide the pulse skyward</div>
<div class="hud-score neon-text" style="color: #ff58c8">CPU <span id="score-cpu">0</span></div>
</div>
<div id="start-tip"><strong>Trace a clean route.</strong>Drag between neighboring nodes to open or cut links and push the pulse into the top goal before the CPU captures it below.</div>
<!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->
<img id="celebration-gif" class="feedback-gif hidden" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Victory reaction overlay">
<img id="alert-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Failure reaction overlay">
<div id="game-over-screen" class="hidden overlay">
<div class="overlay-panel neon-box">
<h2 id="game-over-title" class="overlay-title neon-text" style="color: #00f0ff">SIGNAL LOCKED</h2>
<p id="game-over-desc" class="overlay-desc">ROUTE UPDATE COMPLETE</p>
<button id="restart-btn">Run Again</button>
</div>
</div>
</div>
</div>

<script id="game-config" type="application/x-game-config">
{
  "gameSpeed": { "type": "number", "label": "Simulation Speed", "value": 1.2, "min": 0.5, "max": 3.0 },
  "neonColor": { "type": "color", "label": "Primary Neon", "value": "#00f0ff" }
}
</script>

<!-- [agent-note][stage3] resolved-audio: bgm/ui/goal/fail/connect -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_connect" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_goal" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = {
  hud: document.getElementById('hud'),
  gameOver: document.getElementById('game-over-screen'),
  title: document.getElementById('game-over-title'),
  desc: document.getElementById('game-over-desc'),
  scoreYou: document.getElementById('score-you'),
  scoreCpu: document.getElementById('score-cpu'),
  restart: document.getElementById('restart-btn'),
  celebrationGif: document.getElementById('celebration-gif'),
  alertGif: document.getElementById('alert-gif')
};
const bgm = document.getElementById('bgm_main');
const sfx = {
  connect: document.getElementById('sfx_connect'),
  goal: document.getElementById('sfx_goal'),
  fail: document.getElementById('sfx_fail'),
  start: document.getElementById('sfx_start')
};

let dpr = window.devicePixelRatio || 1;
let cw, ch;
let gameState = 'PLAYING';
let initialized = false;
let lastTime = 0;
let audioCtx;
let audioUnlocked = false;
let startCuePlayed = false;
let feedbackTimer = 0;

const COLS = 3;
const ROWS = 7;
let nodes = [];
let connections = [];
let ball = { c: 1, r: 6, moving: false, progress: 0, from: null, to: null };
let scores = { you: 0, cpu: 0 };
let flash = 0;
let gridOffset = 0;

const configScript = document.getElementById('game-config');
window.gameConfigDefs = JSON.parse(configScript.textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
window.updateGameConfig = (k,v) => { window.gameConfig[k] = v; };

function initAudio() {
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    bgm.volume = 0.2;
    sfx.connect.volume = 0.28;
    sfx.goal.volume = 0.42;
    sfx.fail.volume = 0.4;
    sfx.start.volume = 0.32;
  } catch(e) {}
}

function safePlay(media, reset = true) {
  if(!media) return;
  try {
    if(reset) media.currentTime = 0;
    media.play().catch(()=>{});
  } catch(e) {}
}

function showFeedback(kind) {
  const showCelebration = kind === 'goal';
  ui.celebrationGif.classList.toggle('hidden', !showCelebration);
  ui.alertGif.classList.toggle('hidden', showCelebration);
  ui.celebrationGif.classList.toggle('is-visible', showCelebration);
  ui.alertGif.classList.toggle('is-visible', !showCelebration);
  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => {
    ui.celebrationGif.classList.add('hidden');
    ui.alertGif.classList.add('hidden');
    ui.celebrationGif.classList.remove('is-visible');
    ui.alertGif.classList.remove('is-visible');
  }, 1400);
}

function unlockAudio() {
  if(audioUnlocked) return;
  audioUnlocked = true;
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  safePlay(bgm, false);
  if(!startCuePlayed) {
    startCuePlayed = true;
    safePlay(sfx.start);
  }
}

function playSfx(type) {
  if(!audioUnlocked) return;
  const media = sfx[type];
  if(media) safePlay(media);
}

function vibrate(style) {
  try {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({ action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style: style } });
  } catch(e) {}
  if(navigator.vibrate) navigator.vibrate(style === 'heavy' ? 200 : 50);
}

function setState(s) {
  gameState = s;
  if(s === 'PLAYING') {
    ui.gameOver.classList.add('hidden');
    ui.hud.classList.remove('hidden');
    if(audioUnlocked) safePlay(bgm, false);
  } else if(s === 'GAMEOVER') {
    ui.gameOver.classList.remove('hidden');
    ui.hud.classList.add('hidden');
    try { bgm.pause(); } catch(e) {}
  }
}

function resize(width, height) {
  cw = width;
  ch = height;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(initialized) {
    nodes.forEach(n => { n.x = (n.c + 0.5) * (cw / COLS); n.y = (n.r + 0.5) * (ch / ROWS); });
  }
}

function initGame() {
  nodes = [];
  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {
      let team = null;
      if(r === 0) team = 'goal-cpu';
      else if(r === ROWS - 1) team = 'goal-you';
      else if(r < 3) team = 'cpu';
      else if(r > 3) team = 'you';
      nodes.push({ c, r, team, x: (c + 0.5) * (cw / COLS), y: (r + 0.5) * (ch / ROWS) });
    }
  }
  connections = [];
  ball = { c: 1, r: ROWS - 1, moving: false, progress: 0, from: null, to: null };
  setState('PLAYING');
  if(audioUnlocked) {
    safePlay(bgm, false);
    if(startCuePlayed) playSfx('start');
  }
}

function getNode(c,r) { return nodes.find(n => n.c===c && n.r===r); }
function isAdjacent(n1,n2) { return Math.abs(n1.c-n2.c)+Math.abs(n1.r-n2.r)===1; }

function toggleConnection(n1, n2) {
  if(!isAdjacent(n1,n2)) return;
  const idx = connections.findIndex(c => (c.from===n1 && c.to===n2) || (c.from===n2 && c.to===n1));
  if(idx >= 0) {
    connections.splice(idx,1);
  } else {
    connections.push({ from: n1, to: n2, active: true });
  }
  playSfx('connect');
}

function resetBall() {
  ball.c = 1;
  ball.r = ROWS-1;
  ball.moving = false;
  ball.progress = 0;
  ball.from = null;
  ball.to = null;
}

function scoreGoal(who) {
  flash = 1;
  if(who === 'you') {
    scores.you++;
    ui.scoreYou.textContent = scores.you;
    ui.title.textContent = "SIGNAL DELIVERED";
    ui.title.style.color = "#00f0ff";
    ui.desc.textContent = "YOUR ROUTE REACHED THE TOP GRID";
    vibrate('heavy');
    playSfx('goal');
    showFeedback('goal');
  } else {
    scores.cpu++;
    ui.scoreCpu.textContent = scores.cpu;
    ui.title.textContent = "ROUTE JAMMED";
    ui.title.style.color = "#ff00a0";
    ui.desc.textContent = "THE CPU PULLED THE SIGNAL OFF COURSE";
    vibrate('medium');
    playSfx('fail');
    showFeedback('fail');
  }
  setTimeout(() => { resetBall(); }, 1000);
}

function update(dt) {
  if(gameState !== 'PLAYING') return;
  dt = Math.min(dt, 0.05);
  const speed = window.gameConfig.gameSpeed * dt * 2;

  gridOffset = (gridOffset + dt * 10) % 50;

  if(flash > 0) flash -= dt * 2;

  if(ball.moving) {
    ball.progress += speed;
    if(ball.progress >= 1) {
      ball.progress = 0;
      ball.moving = false;
      ball.from = null;
      ball.c = ball.to.c;
      ball.r = ball.to.r;
      ball.to = null;

      const currentNode = getNode(ball.c, ball.r);
      if(currentNode.team === 'goal-cpu') { scoreGoal('you'); }
      else if(currentNode.team === 'goal-you') { scoreGoal('cpu'); }
      else if(currentNode.team === 'cpu') { scoreGoal('cpu'); }
    }
  } else {
    const currentNode = getNode(ball.c, ball.r);
    const validConns = connections.filter(c => c.from === currentNode || c.to === currentNode);
    if(validConns.length > 0) {
      const conn = validConns[Math.floor(Math.random() * validConns.length)];
      ball.from = currentNode;
      ball.to = (conn.from === currentNode) ? conn.to : conn.from;
      ball.moving = true;
      ball.progress = 0;
    }
  }
}

function draw() {
  ctx.fillStyle = '#020205';
  ctx.fillRect(0,0,cw,ch);

  const cellW = cw/COLS;
  const cellH = ch/ROWS;

  ctx.save();
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=0; x<=cw; x+=cellW) { ctx.moveTo(x,0); ctx.lineTo(x,ch); }
  for(let y=0; y<=ch; y+=cellH) { ctx.moveTo(0,y); ctx.lineTo(cw,y); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 2;
  const off = gridOffset;
  for(let i=-1; i<COLS+2; i++) {
    ctx.beginPath();
    ctx.moveTo(i*cellW + off, 0);
    ctx.lineTo(i*cellW + off - 200, ch);
    ctx.stroke();
  }
  ctx.restore();

  connections.forEach(conn => {
    ctx.shadowBlur = 20;
    ctx.shadowColor = conn.from.team === 'you' ? '#00f0ff' : '#ff00a0';
    ctx.strokeStyle = conn.from.team === 'you' ? '#00f0ff' : '#ff00a0';
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(conn.from.x, conn.from.y);
    ctx.lineTo(conn.to.x, conn.to.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });

  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.team && n.team.includes('goal') ? 18 : 12, 0, Math.PI*2);
    if(n.team === 'you') {
      ctx.fillStyle = '#00f0ff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00f0ff';
    } else if(n.team === 'cpu') {
      ctx.fillStyle = '#ff00a0';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff00a0';
    } else if(n.team && n.team.includes('goal')) {
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#ffffff';
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  let bx, by;
  if(ball.moving && ball.from && ball.to) {
    bx = ball.from.x + (ball.to.x - ball.from.x) * ball.progress;
    by = ball.from.y + (ball.to.y - ball.from.y) * ball.progress;
  } else {
    const n = getNode(ball.c, ball.r);
    bx = n.x; by = n.y;
  }

  ctx.beginPath();
  ctx.arc(bx, by, 7, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#ffffff';
  ctx.fill();
  ctx.shadowBlur = 0;

  if(flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,flash*0.3)})`;
    ctx.fillRect(0,0,cw,ch);
  }
}

function gameLoop(timestamp) {
  try {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  } catch(e) { requestAnimationFrame(gameLoop); }
}

let dragStartNode = null;
function handleGlobalInput(e) {
  unlockAudio();
  if(gameState !== 'PLAYING') return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if(x < 0 || x > rect.width || y < 0 || y > rect.height) {
    if(e.type === 'pointerup') dragStartNode = null;
    return;
  }

  const cellW = cw/COLS;
  const cellH = ch/ROWS;
  const c = Math.floor(x/cellW);
  const r = Math.floor(y/cellH);
  const node = getNode(c,r);

  if(e.type === 'pointerdown' && node) {
    dragStartNode = node;
  } else if(e.type === 'pointerup' && dragStartNode) {
    if(node && node !== dragStartNode) {
      toggleConnection(dragStartNode, node);
    }
    dragStartNode = null;
  }
}

const ro = new ResizeObserver(entries => {
  const cr = entries[0].contentRect;
  resize(cr.width, cr.height);
  if(!initialized) {
    initGame();
    initialized = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
});

document.addEventListener('visibilitychange', () => {
  if(document.hidden) {
    try { bgm.pause(); } catch(e) {}
  } else if(audioUnlocked && gameState === 'PLAYING') {
    safePlay(bgm, false);
  }
});

window.addEventListener('DOMContentLoaded', () => {
  ro.observe(canvas);
  // [agent-note][stage4] repaired: mobile-action-scope | element: canvas/restart button | action: scoped gameplay pointer input off global window to avoid UI tap conflicts
  canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointercancel', () => { dragStartNode = null; }, { passive: true });
  ui.restart.addEventListener('click', () => {
    unlockAudio();
    if(gameState === 'GAMEOVER') initGame();
  });
});
</script>
</body>
</html>
