<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tall Clown Glow-Up</title>
<!-- [agent-note][stage4] repaired: required-font-remap | title/highlights -> Orbitron, ui/body -> Exo 2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #08111f;
        --panel: rgba(13, 24, 43, 0.7);
        --panel-strong: rgba(36, 14, 43, 0.84);
        --text: #f5f7ff;
        --pink: #ff4fa3;
        --pink-soft: #ff8fcc;
        --cyan: #6ee7ff;
        --cyan-deep: #0891b2;
        --yellow: #ffd54f;
        --white: #ffffff;
        --black: #000000;
        --shadow: rgba(4, 10, 23, 0.55);
        --glow: rgba(110, 231, 255, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(110, 231, 255, 0.14), transparent 32%),
            radial-gradient(circle at 20% 80%, rgba(255, 79, 163, 0.16), transparent 28%),
            linear-gradient(180deg, #0b1830 0%, #08111f 55%, #040910 100%);
        font-family: 'Exo 2', sans-serif;
        transition: background 1s ease;
    }

    body.romance-bg {
        background:
            radial-gradient(circle at top, rgba(255, 255, 255, 0.2), transparent 30%),
            radial-gradient(circle at 50% 20%, rgba(255, 79, 163, 0.22), transparent 34%),
            linear-gradient(180deg, #220d30 0%, #42123a 52%, #150a1f 100%);
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    button {
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
    }

    .hidden { display: none !important; }

    .game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
        touch-action: none;
    }

    .game-container::before,
    .game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .game-container::before {
        background:
            radial-gradient(circle at 50% 18%, rgba(255,255,255,0.09), transparent 16%),
            radial-gradient(circle at 15% 25%, rgba(110, 231, 255, 0.08), transparent 18%),
            radial-gradient(circle at 85% 28%, rgba(255, 79, 163, 0.12), transparent 22%);
        z-index: 1;
    }

    .game-container::after {
        background:
            repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.015) 0,
                rgba(255,255,255,0.015) 1px,
                transparent 1px,
                transparent 48px
            );
        opacity: 0.45;
        z-index: 1;
    }

    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
    }

    .hud {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.5s ease;
        opacity: 0;
        position: relative;
        z-index: 2;
    }

    .meter-shell {
        width: min(16rem, 70vw);
        height: 1.5rem;
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(183, 220, 255, 0.75));
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.85);
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px var(--shadow), 0 0 18px var(--glow);
    }

    .meter-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--cyan), var(--pink), #fff176);
        width: 0;
        transition: width 0.2s ease;
        box-shadow: inset 0 0 12px rgba(255,255,255,0.45);
    }

    .meter-label {
        margin: 0.35rem 0 0;
        color: var(--cyan);
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.16em;
        text-shadow: 0 2px 12px rgba(0,0,0,0.45);
        font-family: 'Orbitron', sans-serif;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: auto;
        padding: 1.5rem;
        z-index: 2;
    }

    .start-screen {
        background: linear-gradient(180deg, rgba(8, 17, 31, 0.42), rgba(8, 17, 31, 0.62));
        backdrop-filter: blur(8px);
    }

    .win-screen {
        background: linear-gradient(180deg, rgba(46, 15, 58, 0.78), rgba(24, 8, 32, 0.88));
        backdrop-filter: blur(14px);
        opacity: 0;
        transition: opacity 1s ease;
    }

    .title {
        margin: 0 0 1rem;
        font-family: 'Orbitron', sans-serif;
        color: var(--pink-soft);
        line-height: 0.9;
        letter-spacing: 0.05em;
        text-shadow: 0 4px 18px rgba(0,0,0,0.32), 0 0 26px rgba(255, 79, 163, 0.24);
        transform: rotate(-2deg);
        font-size: clamp(3rem, 13vw, 6.2rem);
        text-transform: uppercase;
    }

    .title-accent {
        display: inline-block;
        margin-top: 0.35rem;
        color: var(--cyan);
        font-size: 0.55em;
        letter-spacing: 0.22em;
        text-shadow: 0 0 16px rgba(110, 231, 255, 0.45);
    }

    .subtitle,
    .win-copy {
        margin: 0 0 2rem;
        color: var(--text);
        font-weight: 600;
        max-width: 28rem;
        background: linear-gradient(180deg, rgba(13, 24, 43, 0.78), rgba(21, 10, 31, 0.72));
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 1rem;
        padding: 0.9rem 1rem;
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .subtitle {
        font-size: clamp(1rem, 4vw, 1.2rem);
        animation: pulse-slow 2s infinite;
    }

    .win-copy {
        font-size: clamp(1rem, 4.5vw, 1.35rem);
    }

    .arcade-button {
        padding: 0.95rem 1.75rem;
        background: linear-gradient(180deg, #ffe57a, var(--yellow));
        border: 3px solid rgba(255,255,255,0.8);
        border-radius: 999px;
        color: #111827;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: clamp(1rem, 4.5vw, 1.35rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        pointer-events: auto;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35), 0 0 18px rgba(255, 213, 79, 0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, filter 0.15s ease;
    }

    .arcade-button:hover {
        background: linear-gradient(180deg, #fff2a8, #ffe15c);
        transform: translateY(-2px) scale(1.03);
        filter: brightness(1.03);
    }

    .arcade-button:active {
        box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        transform: translateY(2px) scale(0.99);
    }

    .win-button {
        background: linear-gradient(180deg, #ff67b3, #ec4899);
        color: #fff;
        border-radius: 999px;
        box-shadow: 0 10px 24px rgba(236,72,153,0.35), 0 0 18px rgba(255, 79, 163, 0.26);
    }

    .win-button:hover {
        background: linear-gradient(180deg, #ff8fcc, #f256ab);
    }

    .feedback-gif {
        position: absolute;
        width: clamp(5.5rem, 22vw, 8.5rem);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 2px solid rgba(255,255,255,0.7);
        box-shadow: 0 12px 30px rgba(0,0,0,0.3), 0 0 18px rgba(110, 231, 255, 0.22);
        pointer-events: none;
        opacity: 0;
        transform: scale(0.82) translateY(10px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 3;
    }

    .feedback-gif.is-visible {
        opacity: 0.94;
        transform: scale(1) translateY(0);
    }

    .feedback-gif--cheer {
        top: 1rem;
        right: 1rem;
    }

    .feedback-gif--win {
        bottom: 1rem;
        left: 1rem;
    }

    @keyframes pulse-slow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @media (max-width: 640px) {
        .ui-layer { padding: 1rem; }
        .subtitle, .win-copy {
            margin-bottom: 1.5rem;
            padding: 0.8rem 0.9rem;
            max-width: min(92vw, 28rem);
        }
        .arcade-button {
            width: min(18rem, 82vw);
        }
        .feedback-gif--cheer {
            top: auto;
            bottom: 7rem;
            right: 0.75rem;
        }
        .feedback-gif--win {
            left: 0.75rem;
            bottom: 0.75rem;
        }
    }
</style>

<body>

<div id="game-container" class="game-container">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: cheer + reveal overlays -> catalogs/gifs.json -->
    <img id="cheer-gif" class="feedback-gif feedback-gif--cheer" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Cheer reaction overlay" loading="lazy" decoding="async">
    <img id="win-gif" class="feedback-gif feedback-gif--win" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Reveal celebration overlay" loading="lazy" decoding="async">
    
    <!-- UI LAYER -->
    <div id="ui-layer" class="ui-layer">
        
        <!-- HUD -->
        <div id="hud" class="hud">
            <div class="meter-shell">
                <div id="love-bar" class="meter-fill"></div>
            </div>
            <p class="meter-label">CONFIDENCE</p>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="overlay start-screen">
            <h1 class="title">Tall Clown<br><span class="title-accent">Star Mode</span></h1>
            <p class="subtitle">Tap the clown to charge up the spotlight meter and land the full glam reveal.</p>
            <button id="start-btn" class="arcade-button">
                Start Cheering
            </button>
        </div>

        <!-- WIN SCREEN -->
        <div id="win-screen" class="overlay win-screen hidden">
            <h2 class="title">Runway<br><span class="title-accent">Unlocked</span></h2>
            <p class="win-copy">The cheers hit max power, the makeover lands clean, and the clown owns the spotlight.</p>
            <button id="restart-btn" class="arcade-button win-button">
                Cheer Again
            </button>
        </div>
    </div>

<script>
/**
 * CORE ENGINE & STATE MANAGEMENT
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let lastTime = 0;
let animationFrameId;

// Game State
const STATE = {
    IDLE: 0,
    PLAYING: 1,
    TRANSFORMING: 2,
    HANDSOME: 3
};
let currentState = STATE.IDLE;

// Config
let gameConfig = {
    hugsRequired: 20,
    clownColor: "#00BCD4",
    handsomeColor: "#212121"
};

// Gameplay Variables
let loveProgress = 0;
let shakeIntensity = 0;
let bgHue = 0;

// Entities
let particles = [];
let texts = [];
let hero = {
    x: 0,
    y: 0,
    height: 0, // Will be set relative to canvas
    width: 0,
    scale: 1,
    bobOffset: 0,
    bobSpeed: 2,
    phase: 'clown', // 'clown' or 'handsome'
    eyeOpen: 1,
    blinkTimer: 0
};

/**
 * AUDIO MANAGER
 */
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const sounds = {
    bgmClown: document.getElementById('bgm_clown'),
    bgmHandsome: document.getElementById('bgm_handsome'),
    sfxHug: document.getElementById('sfx_hug'),
    sfxSpray: document.getElementById('sfx_spray'),
    sfxUi: document.getElementById('sfx_ui'),
    sfxWin: document.getElementById('sfx_win')
};
const gifEls = {
    cheer: document.getElementById('cheer-gif'),
    win: document.getElementById('win-gif')
};
let audioUnlocked = false;
let bgmFadeInterval = null;
let lastCheerSoundAt = 0;
let activeGifTimers = [];

Object.entries(sounds).forEach(([id, el]) => {
    if (!el) return;
    if (id.startsWith('bgm')) {
        el.volume = id === 'bgmClown' ? 0.18 : 0.2;
    } else if (id === 'sfxUi') {
        el.volume = 0.5;
    } else if (id === 'sfxWin') {
        el.volume = 0.58;
    } else if (id === 'sfxSpray') {
        el.volume = 0.5;
    } else {
        el.volume = 0.45;
    }
});

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
}

function playSound(id, options = {}) {
    const el = sounds[id];
    if (el) {
        if (options.restart !== false) {
            el.currentTime = 0;
        }
        el.play().catch(() => {});
        return;
    }

    if (!audioCtx) return;
    if (id === 'sfx_hug') synthesizeTone(660, 'triangle', 0.08);
    if (id === 'sfx_spray') synthesizeNoise(0.35);
    if (id === 'sfx_ui') synthesizeTone(520, 'square', 0.07);
    if (id === 'sfx_win') synthesizeTone(880, 'sine', 0.18);
}

function pauseAllAudio() {
    Object.values(sounds).forEach((el) => {
        if (!el) return;
        el.pause();
    });
}

function switchBGM(toHandsome) {
    const next = toHandsome ? sounds.bgmHandsome : sounds.bgmClown;
    const prev = toHandsome ? sounds.bgmClown : sounds.bgmHandsome;
    if (!next || !audioUnlocked) return;

    if (bgmFadeInterval) {
        clearInterval(bgmFadeInterval);
        bgmFadeInterval = null;
    }

    if (prev) {
        prev.pause();
        prev.currentTime = 0;
    }

    const targetVolume = toHandsome ? 0.2 : 0.18;
    next.currentTime = 0;
    next.volume = 0;
    next.play().catch(() => {});
    let vol = 0;
    bgmFadeInterval = setInterval(() => {
        vol = Math.min(targetVolume, vol + 0.04);
        next.volume = vol;
        if (vol >= targetVolume) {
            clearInterval(bgmFadeInterval);
            bgmFadeInterval = null;
        }
    }, 90);
}

function showGif(name, duration = 1200) {
    const el = gifEls[name];
    if (!el) return;
    el.classList.add('is-visible');
    const timer = setTimeout(() => el.classList.remove('is-visible'), duration);
    activeGifTimers.push(timer);
}

function hideGifs() {
    Object.values(gifEls).forEach((el) => el && el.classList.remove('is-visible'));
    activeGifTimers.forEach(clearTimeout);
    activeGifTimers = [];
}

function synthesizeTone(freq, type, duration) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function synthesizeNoise(duration) {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
}

/**
 * INIT & RESIZE
 */
function init() {
    // Parse config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const parsed = JSON.parse(cfgEl.textContent);
            gameConfig.hugsRequired = parsed.hugsRequired.value;
            gameConfig.clownColor = parsed.clownColor.value;
            gameConfig.handsomeColor = parsed.handsomeColor.value;
        }
    } catch(e) { console.error("Config parse error", e); }

    window.addEventListener('resize', resize);
    resize();
    
    // Input
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', resetGame);
    
    // Loop
    requestAnimationFrame(gameLoop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Reset hero pos
    hero.x = window.innerWidth / 2;
    hero.y = window.innerHeight; // Anchored at bottom
    hero.width = Math.min(window.innerWidth * 0.4, 200);
    hero.height = window.innerHeight * 0.85; // 7ft tall feel
}

/**
 * GAME LOGIC
 */
function startGame() {
    unlockAudio();
    playSound('sfxUi');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('opacity-0');
    document.getElementById('hud').style.opacity = '1';
    currentState = STATE.PLAYING;
    switchBGM(false);
    resetHero();
}

function resetGame() {
    unlockAudio();
    playSound('sfxUi');
    document.getElementById('win-screen').classList.add('hidden');
    document.getElementById('win-screen').classList.remove('opacity-100');
    document.getElementById('win-screen').style.opacity = '0';
    document.body.classList.remove('romance-bg');
    resetHero();
    loveProgress = 0;
    updateHUD();
    currentState = STATE.PLAYING;
    hideGifs();
    switchBGM(false); // Back to clown music
}

function resetHero() {
    hero.phase = 'clown';
    hero.scale = 1;
    hero.bobOffset = 0;
    particles = [];
    texts = [];
    hideGifs();
}

function handleInput(e) {
    e.preventDefault();
    unlockAudio();
    if (currentState !== STATE.PLAYING) return;

    // Check click bounds (generous hit box)
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Simple distance check to center column
    if (Math.abs(x - hero.x) < hero.width * 1.5) {
        hugHero(x, y);
    }
}

function hugHero(x, y) {
    loveProgress++;
    updateHUD();
    const now = performance.now();
    if (now - lastCheerSoundAt > 90) {
        playSound('sfx_hug');
        lastCheerSoundAt = now;
    }
    if (loveProgress % 4 === 0) {
        showGif('cheer', 900);
    }
    
    // Visual feedback
    shakeIntensity = 10;
    hero.scale = 1.05; // Squash
    
    // Spawn hearts
    for(let i=0; i<5; i++) {
        spawnParticle(x, y, 'heart');
    }
    spawnFloatingText(x, y, "CHEER!");

    // Check Win
    if (loveProgress >= gameConfig.hugsRequired) {
        triggerTransformation();
    }
}

function updateHUD() {
    const pct = Math.min(100, (loveProgress / gameConfig.hugsRequired) * 100);
    document.getElementById('love-bar').style.width = pct + '%';
}

function triggerTransformation() {
    currentState = STATE.TRANSFORMING;
    playSound('sfx_spray');
    playSound('sfxWin');
    showGif('win', 2600);
    shakeIntensity = 30;
    
    // Reveal burst
    const cx = hero.x;
    const cy = hero.y - hero.height * 0.6;
    
    for (let i = 0; i < 150; i++) {
        spawnParticle(cx, cy, 'milk');
    }
    
    setTimeout(() => {
        hero.phase = 'handsome';
        currentState = STATE.HANDSOME;
        document.body.classList.add('romance-bg');
        switchBGM(true);
        
        // Show Win UI after short delay
        setTimeout(() => {
            const win = document.getElementById('win-screen');
            win.classList.remove('hidden');
            // Force reflow
            void win.offsetWidth;
            win.classList.add('opacity-100');
            win.style.opacity = '1';
        }, 1500);
    }, 500); // Delay for whiteout effect
}

/**
 * VISUALS
 */
function spawnParticle(x, y, type) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (type === 'milk' ? 5 : 2), // Upward bias
        life: 1.0,
        decay: Math.random() * 0.02 + 0.01,
        type: type,
        size: Math.random() * 10 + 5,
        color: type === 'heart' ? '#E91E63' : '#FFFFFF'
    });
}

function spawnFloatingText(x, y, text) {
    texts.push({
        x: x,
        y: y,
        text: text,
        life: 1.0,
        vy: -2
    });
}

function drawHero(dt, time) {
    const ctxW = canvas.width / window.devicePixelRatio; // Logic coordinates
    
    // Bobbing animation
    hero.bobOffset = Math.sin(time * 0.005) * 10;
    
    // Scale return
    hero.scale += (1 - hero.scale) * 0.1;

    // Shake
    let shakeX = (Math.random() - 0.5) * shakeIntensity;
    let shakeY = (Math.random() - 0.5) * shakeIntensity;
    if (shakeIntensity > 0) shakeIntensity *= 0.9;

    ctx.save();
    ctx.translate(hero.x + shakeX, hero.y + shakeY);
    ctx.scale(hero.scale, 2 - hero.scale); // Squash/Stretch preservation

    if (hero.phase === 'clown') {
        drawClown();
    } else {
        drawHandsome();
    }
    
    ctx.restore();
}

function drawClown() {
    const h = hero.height;
    const w = hero.width;
    
    // Stage shadow
    ctx.fillStyle = "rgba(4, 10, 23, 0.34)";
    ctx.beginPath();
    ctx.ellipse(0, h * 0.02, w * 0.52, w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs (striped show pants)
    ctx.fillStyle = "#ff7b54";
    ctx.fillRect(-w*0.4, -h*0.4, w*0.3, h*0.4);
    ctx.fillRect(w*0.1, -h*0.4, w*0.3, h*0.4);
    ctx.strokeStyle = "rgba(255, 230, 170, 0.75)";
    ctx.lineWidth = Math.max(2, w * 0.015);
    for (let i = 0; i < 3; i++) {
        const y = -h * 0.37 + i * h * 0.12;
        ctx.beginPath();
        ctx.moveTo(-w*0.4, y);
        ctx.lineTo(-w*0.1, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w*0.1, y);
        ctx.lineTo(w*0.4, y);
        ctx.stroke();
    }
    
    // Big star shoes
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath(); ctx.ellipse(-w*0.25, 0, w*0.25, w*0.15, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.25, 0, w*0.25, w*0.15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff3a0";
    ctx.beginPath(); ctx.arc(-w*0.25, -w*0.01, w*0.045, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.25, -w*0.01, w*0.045, 0, Math.PI*2); ctx.fill();

    // Torso (performer coat)
    ctx.fillStyle = gameConfig.clownColor;
    ctx.fillRect(-w*0.45, -h*0.8, w*0.9, h*0.4);
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(-w*0.12, -h*0.8, w*0.08, h*0.4);
    ctx.fillRect(w*0.04, -h*0.8, w*0.08, h*0.4);
    
    // Buttons
    ctx.fillStyle = "#ffef7a";
    ctx.beginPath(); ctx.arc(0, -h*0.7, w*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -h*0.6, w*0.08, 0, Math.PI*2); ctx.fill();
    
    // Neck ruff glow
    ctx.fillStyle = "#f8fbff";
    ctx.beginPath();
    for(let i=0; i<10; i++) {
        let ang = (i/10)*Math.PI*2;
        ctx.arc(Math.cos(ang)*w*0.3, -h*0.8 + Math.sin(ang)*w*0.1, w*0.1, 0, Math.PI*2);
    }
    ctx.fill();

    // Hair puffs
    ctx.fillStyle = "#ff4fa3";
    ctx.beginPath(); ctx.arc(-w*0.25, -h*0.93, w*0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.25, -h*0.93, w*0.12, 0, Math.PI*2); ctx.fill();

    // Head
    ctx.fillStyle = "#fffdfd";
    ctx.beginPath(); ctx.arc(0, -h*0.88, w*0.35, 0, Math.PI*2); ctx.fill();
    
    // Eyes
    ctx.fillStyle = "#08111f";
    ctx.beginPath(); ctx.arc(-w*0.15, -h*0.9, w*0.05, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.15, -h*0.9, w*0.05, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-w*0.13, -h*0.915, w*0.015, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.17, -h*0.915, w*0.015, 0, Math.PI*2); ctx.fill();
    
    // Nose
    ctx.fillStyle = "#ff355e";
    ctx.beginPath(); ctx.arc(0, -h*0.88, w*0.08, 0, Math.PI*2); ctx.fill();
    
    // Smile
    ctx.strokeStyle = "#ff355e";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, -h*0.875, w*0.2, 0.2, Math.PI-0.2); ctx.stroke();

    // Brow accents
    ctx.strokeStyle = "#6ee7ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w*0.22, -h*0.96);
    ctx.lineTo(-w*0.08, -h*0.945);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w*0.08, -h*0.945);
    ctx.lineTo(w*0.22, -h*0.96);
    ctx.stroke();

    // Hat
    ctx.fillStyle = "#7c3aed";
    ctx.beginPath();
    ctx.moveTo(-w*0.2, -h*0.95);
    ctx.lineTo(w*0.2, -h*0.95);
    ctx.lineTo(0, -h*1.05);
    ctx.fill();
    ctx.fillStyle = "#ffd54f";
    ctx.fillRect(-w*0.11, -h*0.97, w*0.22, h*0.02);
}

function drawHandsome() {
    const h = hero.height;
    const w = hero.width;
    
    // Stage shadow
    ctx.fillStyle = "rgba(9, 4, 18, 0.38)";
    ctx.beginPath();
    ctx.ellipse(0, h * 0.02, w * 0.48, w * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.fillStyle = "#161616";
    ctx.fillRect(-w*0.35, -h*0.4, w*0.3, h*0.4);
    ctx.fillRect(w*0.05, -h*0.4, w*0.3, h*0.4);
    
    // Torso (velvet suit)
    ctx.fillStyle = gameConfig.handsomeColor;
    ctx.fillRect(-w*0.4, -h*0.85, w*0.8, h*0.45);
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    ctx.fillRect(-w*0.34, -h*0.84, w*0.12, h*0.42);
    ctx.fillRect(w*0.22, -h*0.84, w*0.12, h*0.42);
    
    // Shirt V
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(-w*0.15, -h*0.85);
    ctx.lineTo(w*0.15, -h*0.85);
    ctx.lineTo(0, -h*0.65);
    ctx.fill();

    // Tie
    ctx.strokeStyle = "#ff4fa3";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -h*0.82); ctx.lineTo(0, -h*0.7); ctx.stroke();

    // Lapel lines
    ctx.strokeStyle = "#6ee7ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w*0.22, -h*0.8);
    ctx.lineTo(0, -h*0.67);
    ctx.lineTo(w*0.22, -h*0.8);
    ctx.stroke();

    // Head
    ctx.fillStyle = "#ffe0b2";
    ctx.beginPath(); 
    ctx.ellipse(0, -h*0.9, w*0.25, w*0.3, 0, 0, Math.PI*2); 
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = "#4a148c";
    ctx.beginPath(); ctx.arc(-w*0.1, -h*0.91, w*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.1, -h*0.91, w*0.03, 0, Math.PI*2); ctx.fill();
    
    // Sparkle in eye
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(w*0.11, -h*0.915, w*0.01, 0, Math.PI*2); ctx.fill();

    // Smile
    ctx.strokeStyle = "#d84315";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -h*0.89, w*0.1, 0.5, Math.PI-0.5); ctx.stroke();

    // Hair
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath();
    ctx.moveTo(-w*0.3, -h*0.92);
    ctx.quadraticCurveTo(0, -h*1.05, w*0.35, -h*0.88);
    ctx.quadraticCurveTo(w*0.4, -h*0.95, 0, -h*1.0);
    ctx.quadraticCurveTo(-w*0.4, -h*0.95, -w*0.3, -h*0.92);
    ctx.fill();

    // Shoulder sparkle accents
    ctx.fillStyle = "#fff8cc";
    ctx.beginPath(); ctx.arc(-w*0.28, -h*0.72, w*0.03, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w*0.28, -h*0.72, w*0.03, 0, Math.PI*2); ctx.fill();

    // Sparkles around head
    if (Math.random() > 0.8) {
        ctx.fillStyle = "#fff";
        const sx = (Math.random()-0.5)*w*1.5;
        const sy = -h*0.9 + (Math.random()-0.5)*w;
        ctx.fillRect(sx, sy, 4, 4);
    }
}

function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;

    // Clear
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Hero
    drawHero(dt, time);
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // Gravity
        p.life -= p.decay;
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        
        if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    // Texts
    ctx.font = "700 28px 'Orbitron'";
    ctx.textAlign = "center";
    ctx.fillStyle = "#E91E63";
    for (let i = texts.length - 1; i >= 0; i--) {
        let t = texts[i];
        t.y += t.vy;
        t.life -= 0.02;
        
        ctx.globalAlpha = Math.max(0, t.life);
        ctx.fillText(t.text, t.x, t.y);
        
        if (t.life <= 0) texts.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    // Reveal overlay flash
    if (currentState === STATE.TRANSFORMING) {
        if (particles.length > 50) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.8, particles.length/200)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    requestAnimationFrame(gameLoop);
}

// Boot
window.addEventListener('DOMContentLoaded', init);

// Config Hot Reload
window.gameConfigDefs = {
    "hugsRequired": { "type": "number", "label": "Cheers to Reveal", "value": 20, "min": 5, "max": 100 },
    "clownColor": { "type": "color", "label": "Clown Suit Color", "value": "#00BCD4" },
    "handsomeColor": { "type": "color", "label": "Spotlight Suit Color", "value": "#212121" }
};
window.gameConfig = gameConfig;
window.updateGameConfig = (key, val) => {
    if (gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
        if (key === 'hugsRequired') updateHUD();
    }
};

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        pauseAllAudio();
    } else if (currentState === STATE.PLAYING && audioUnlocked) {
        switchBGM(false);
    } else if (currentState === STATE.HANDSOME && audioUnlocked) {
        switchBGM(true);
    }
});
