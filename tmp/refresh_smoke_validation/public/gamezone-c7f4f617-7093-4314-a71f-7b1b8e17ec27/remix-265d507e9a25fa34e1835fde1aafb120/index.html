<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Swamp Swagger: Ogre Party Tap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--slime:#9bdc28;--mud:#6b3f18;--bog:#102416;--bog2:#1f3d1f;--gold:#ffd65a;--cream:#fff6d8;--panel:rgba(21,42,22,.78)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102416;color:var(--cream);font-family:Cinzel,serif}body.party-bg{background:radial-gradient(circle at 50% 10%,rgba(255,214,90,.25),transparent 32%),linear-gradient(#25471f,#102416 55%,#07140d)}button{font:inherit;touch-action:manipulation;cursor:pointer}.hidden{display:none!important}.game-container{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;touch-action:none;background:linear-gradient(#283f44 0 30%,#294c25 30% 58%,#153313 58% 100%)}canvas{display:block;width:100%;height:100%}.game-container:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 18%,rgba(255,230,120,.35) 0 2px,transparent 3px),radial-gradient(circle at 73% 28%,rgba(170,255,79,.22) 0 2px,transparent 3px),repeating-linear-gradient(90deg,transparent 0 34px,rgba(0,0,0,.07) 34px 35px);animation:fireflies 5s linear infinite;z-index:1}.game-container:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-2%;height:24%;pointer-events:none;background:radial-gradient(ellipse at 18% 84%,#314b1f 0 6%,transparent 7%),radial-gradient(ellipse at 72% 82%,#243d1a 0 9%,transparent 10%),linear-gradient(180deg,transparent,#08150b 65%);z-index:1}@keyframes fireflies{50%{filter:brightness(1.35);transform:translateY(-8px)}}.ui-layer{position:absolute;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,4vw,24px)}.hud{display:flex;align-items:center;flex-direction:column;gap:.35rem;opacity:0;transition:.25s}.meter-shell{width:min(78vw,330px);height:26px;border:3px solid #f7e6a0;border-radius:999px;background:rgba(15,28,13,.75);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 12px #07140d;overflow:hidden}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#7dcf19,#b8ff3b,#ffd65a);transition:width .18s}.meter-label{margin:0;font:400 clamp(17px,5vw,25px) Bangers,cursive;letter-spacing:.08em;color:#ffe880;text-shadow:2px 3px #21310c}.overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px;pointer-events:auto;background:linear-gradient(180deg,rgba(7,20,10,.45),rgba(7,20,10,.74));backdrop-filter:blur(7px)}.title{margin:0 0 12px;font:400 clamp(46px,15vw,92px) Bangers,cursive;line-height:.86;color:#aaff35;text-shadow:4px 5px #17320f,0 0 28px rgba(170,255,53,.35);transform:rotate(-2deg)}.title-accent{display:block;color:#ffd65a;font-size:.55em;letter-spacing:.08em}.subtitle,.win-copy{max-width:min(92vw,470px);margin:0 0 22px;padding:14px 16px;border:2px solid rgba(255,230,160,.45);border-radius:20px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.3);font-weight:700;font-size:clamp(15px,4.3vw,21px)}.arcade-button{min-width:min(84vw,300px);min-height:56px;padding:13px 22px;border-radius:999px;border:4px solid #fff2b2;background:linear-gradient(#ffe97a,#d39b28);color:#18300e;font:400 clamp(22px,7vw,34px) Bangers,cursive;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 10px 0 #6b3f18,0 20px 28px rgba(0,0,0,.35);pointer-events:auto}.arcade-button:active{transform:translateY(5px);box-shadow:0 5px 0 #6b3f18,0 12px 18px rgba(0,0,0,.32)}.feedback-gif{position:absolute;right:12px;bottom:82px;width:clamp(80px,24vw,126px);aspect-ratio:1;object-fit:cover;border:3px solid #ffe78f;border-radius:22px;box-shadow:0 12px 28px rgba(0,0,0,.38);opacity:0;transform:scale(.8) rotate(4deg);transition:.22s;pointer-events:none;z-index:7}.feedback-gif--win{left:12px;right:auto;bottom:12px}.feedback-gif.is-visible{opacity:.95;transform:scale(1) rotate(-3deg)}.swamp-sign{position:absolute;left:12px;bottom:18%;z-index:2;transform:rotate(-7deg);font:400 clamp(18px,5vw,26px) Bangers;color:#2a1608;background:#b8863b;border:3px solid #5b3212;border-radius:8px;padding:7px 10px;box-shadow:0 8px 0 #3b220e}.castle{position:absolute;right:7%;top:20%;z-index:0;width:92px;height:94px;opacity:.42;background:linear-gradient(#777,#333);clip-path:polygon(5% 100%,5% 42%,18% 42%,18% 20%,30% 36%,42% 20%,54% 36%,66% 20%,78% 42%,95% 42%,95% 100%)}@media(max-width:520px){.ui-layer{padding:12px}.subtitle,.win-copy{font-size:15px}.title{font-size:clamp(44px,16vw,74px)}}
</style>
<script id="game-config" type="application/x-game-config">{"hugsRequired":{"type":"number","label":"Burp Cheers to Party","value":20,"min":5,"max":100},"clownColor":{"type":"color","label":"Ogre Vest Color","value":"#8b5a2b"},"handsomeColor":{"type":"color","label":"Bog Legend Glow","value":"#ffd65a"}}</script>
<audio id="bgm_clown" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" preload="auto" loop></audio>
<audio id="bgm_handsome" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_02.mp3" preload="auto" loop></audio>
<audio id="sfx_hug" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio>
<audio id="sfx_spray" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_wind_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_npc_01.mp3" preload="auto"></audio>
<audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_02.mp3" preload="auto"></audio>
</head>
<body>
<div id="game-container" class="game-container">
  <div class="castle" aria-hidden="true"></div><div class="swamp-sign" aria-hidden="true">No Princess Parking</div>
  <canvas id="gameCanvas"></canvas>
  <img id="cheer-gif" class="feedback-gif feedback-gif--cheer" src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp" alt="funny companion cheer" loading="lazy" decoding="async">
  <img id="win-gif" class="feedback-gif feedback-gif--win" src="https://i.giphy.com/U89KtC4wdeKat7fH9X.webp" alt="party victory reaction" loading="lazy" decoding="async">
  <div id="ui-layer" class="ui-layer">
    <div id="hud" class="hud"><div class="meter-shell"><div id="love-bar" class="meter-fill"></div></div><p class="meter-label">SWAMP SWAGGER</p></div>
    <div id="start-screen" class="overlay start-screen"><h1 class="title">Swamp<br><span class="title-accent">Swagger</span></h1><p class="subtitle">Tap the lovable ogre to charge burp-cheers, annoy the castle, and unlock a gross-out fairy-tale party. No rescuing required.</p><button id="start-btn" class="arcade-button">Start the Stink</button></div>
    <div id="win-screen" class="overlay win-screen hidden"><h2 class="title">Bog<br><span class="title-accent">Legend!</span></h2><p class="win-copy">The swamp is loud, the crown is muddy, and every anti-princess joke landed. Friendship has layers.</p><button id="restart-btn" class="arcade-button win-button">Burp Again</button></div>
  </div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let lastTime=0;const STATE={IDLE:0,PLAYING:1,TRANSFORMING:2,HANDSOME:3};let currentState=STATE.IDLE;let gameConfig={hugsRequired:20,clownColor:'#8b5a2b',handsomeColor:'#ffd65a'};let loveProgress=0,shakeIntensity=0,particles=[],texts=[],animationFrameId;let hero={x:0,y:0,height:0,width:0,scale:1,bobOffset:0,phase:'clown'};
const AudioContextClass=window.AudioContext||window.webkitAudioContext;const audioCtx=AudioContextClass?new AudioContextClass():null;const sounds={bgmClown:document.getElementById('bgm_clown'),bgmHandsome:document.getElementById('bgm_handsome'),sfxHug:document.getElementById('sfx_hug'),sfxSpray:document.getElementById('sfx_spray'),sfxUi:document.getElementById('sfx_ui'),sfxWin:document.getElementById('sfx_win')};const gifEls={cheer:document.getElementById('cheer-gif'),win:document.getElementById('win-gif')};let audioUnlocked=false,bgmFadeInterval=null,lastCheerSoundAt=0,activeGifTimers=[];Object.entries(sounds).forEach(([id,el])=>{if(!el)return;el.volume=id.startsWith('bgm')?.18:.48});
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}function playSound(id,opt={}){const el=sounds[id];if(el){if(opt.restart!==false)el.currentTime=0;el.play().catch(()=>{});return}if(!audioCtx)return;synthesizeTone(520,'triangle',.08)}function pauseAllAudio(){Object.values(sounds).forEach(el=>{if(el)el.pause()})}function switchBGM(toParty){const next=toParty?sounds.bgmHandsome:sounds.bgmClown,prev=toParty?sounds.bgmClown:sounds.bgmHandsome;if(!next||!audioUnlocked)return;if(bgmFadeInterval)clearInterval(bgmFadeInterval);if(prev){prev.pause();prev.currentTime=0}next.currentTime=0;next.volume=0;next.play().catch(()=>{});let vol=0;bgmFadeInterval=setInterval(()=>{vol=Math.min(.18,vol+.04);next.volume=vol;if(vol>=.18)clearInterval(bgmFadeInterval)},90)}function showGif(name,duration=1100){const el=gifEls[name];if(!el)return;el.classList.add('is-visible');const timer=setTimeout(()=>el.classList.remove('is-visible'),duration);activeGifTimers.push(timer)}function hideGifs(){Object.values(gifEls).forEach(el=>el&&el.classList.remove('is-visible'));activeGifTimers.forEach(clearTimeout);activeGifTimers=[]}function synthesizeTone(freq,type,duration){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.09,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}
function init(){try{const parsed=JSON.parse(document.getElementById('game-config').textContent);gameConfig.hugsRequired=parsed.hugsRequired.value;gameConfig.clownColor=parsed.clownColor.value;gameConfig.handsomeColor=parsed.handsomeColor.value}catch(e){console.error('Config parse error',e)}window.addEventListener('resize',resize);resize();canvas.addEventListener('pointerdown',handleInput,{passive:false});document.getElementById('start-btn').addEventListener('click',startGame);document.getElementById('restart-btn').addEventListener('click',resetGame);animationFrameId=requestAnimationFrame(gameLoop)}function resize(){const dpr=window.devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);hero.x=innerWidth/2;hero.y=innerHeight;hero.width=Math.min(innerWidth*.42,210);hero.height=innerHeight*.82}
function startGame(){unlockAudio();playSound('sfxUi');document.getElementById('start-screen').classList.add('hidden');document.getElementById('hud').style.opacity='1';currentState=STATE.PLAYING;switchBGM(false);resetHero()}function resetGame(){unlockAudio();playSound('sfxUi');document.getElementById('win-screen').classList.add('hidden');document.getElementById('win-screen').style.opacity='0';document.body.classList.remove('party-bg');resetHero();loveProgress=0;updateHUD();currentState=STATE.PLAYING;switchBGM(false)}function resetHero(){hero.phase='clown';hero.scale=1;particles=[];texts=[];hideGifs()}function handleInput(e){e.preventDefault();unlockAudio();if(currentState!==STATE.PLAYING)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(Math.abs(x-hero.x)<hero.width*1.5)hugHero(x,y)}function hugHero(x,y){loveProgress++;updateHUD();const now=performance.now();if(now-lastCheerSoundAt>90){playSound('sfxHug');lastCheerSoundAt=now}if(loveProgress%4===0)showGif('cheer',900);shakeIntensity=10;hero.scale=1.05;for(let i=0;i<5;i++)spawnParticle(x,y,i%2?'bubble':'onion');spawnFloatingText(x,y,['BURP!','LAYERS!','MUD!','NOPE!'][loveProgress%4]);if(loveProgress>=gameConfig.hugsRequired)triggerTransformation()}function updateHUD(){document.getElementById('love-bar').style.width=Math.min(100,loveProgress/gameConfig.hugsRequired*100)+'%'}function triggerTransformation(){currentState=STATE.TRANSFORMING;playSound('sfxSpray');playSound('sfxWin');showGif('win',2600);shakeIntensity=30;const cx=hero.x,cy=hero.y-hero.height*.6;for(let i=0;i<150;i++)spawnParticle(cx,cy,i%3?'spark':'mud');setTimeout(()=>{hero.phase='handsome';currentState=STATE.HANDSOME;document.body.classList.add('party-bg');switchBGM(true);setTimeout(()=>{const win=document.getElementById('win-screen');win.classList.remove('hidden');void win.offsetWidth;win.style.opacity='1'},1500)},500)}
function spawnParticle(x,y,type){const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(type==='mud'?5:2),life:1,decay:Math.random()*.02+.01,type,size:Math.random()*10+5,color:type==='mud'?'#6b3f18':type==='spark'?'#ffd65a':type==='onion'?'#d8f49a':'#b8ffec'})}function spawnFloatingText(x,y,text){texts.push({x,y,text,life:1,vy:-2})}
function drawBg(time){const w=innerWidth,h=innerHeight;ctx.fillStyle='#294044';ctx.fillRect(0,0,w,h);ctx.fillStyle='#2f5c2a';ctx.fillRect(0,h*.33,w,h*.38);ctx.fillStyle='#163816';ctx.fillRect(0,h*.61,w,h*.39);ctx.fillStyle='rgba(20,60,22,.7)';for(let i=0;i<9;i++){let x=(i*w/8+(Math.sin(time*.0006+i)*18))%w;ctx.beginPath();ctx.ellipse(x,h*.69+Math.sin(i)*12,80,20,0,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#203818';ctx.lineWidth=5;for(let i=0;i<8;i++){let x=i*w/7;ctx.beginPath();ctx.moveTo(x,h*.72);ctx.quadraticCurveTo(x+12,h*.56,x+4,h*.47);ctx.stroke();ctx.fillStyle='#6b4d1d';ctx.fillRect(x-8,h*.48,16,28)}ctx.fillStyle='rgba(255,230,90,.7)';for(let i=0;i<18;i++){let x=(i*67+time*.015)%w,y=80+(i*43)%Math.max(120,h*.45);ctx.beginPath();ctx.arc(x,y,1.8+Math.sin(time*.004+i),0,Math.PI*2);ctx.fill()}}
function drawHero(dt,time){hero.bobOffset=Math.sin(time*.005)*10;hero.scale+=(1-hero.scale)*.1;let shakeX=(Math.random()-.5)*shakeIntensity,shakeY=(Math.random()-.5)*shakeIntensity;if(shakeIntensity>0)shakeIntensity*=.9;ctx.save();ctx.translate(hero.x+shakeX,hero.y+shakeY+hero.bobOffset);ctx.scale(hero.scale,2-hero.scale);hero.phase==='clown'?drawOgre():drawBogLegend();ctx.restore()}function drawOgre(){const h=hero.height,w=hero.width;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,h*.02,w*.58,w*.14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b3417';ctx.fillRect(-w*.36,-h*.39,w*.28,h*.39);ctx.fillRect(w*.08,-h*.39,w*.28,h*.39);ctx.fillStyle='#22160d';ctx.beginPath();ctx.ellipse(-w*.24,0,w*.25,w*.13,0,0,Math.PI*2);ctx.ellipse(w*.24,0,w*.25,w*.13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=gameConfig.clownColor;ctx.fillRect(-w*.48,-h*.77,w*.96,h*.36);ctx.fillStyle='#ead3a0';ctx.fillRect(-w*.24,-h*.77,w*.48,h*.36);ctx.fillStyle='#7bbf24';ctx.fillRect(-w*.58,-h*.75,w*.22,h*.26);ctx.fillRect(w*.36,-h*.75,w*.22,h*.26);ctx.fillStyle='#93cf35';ctx.beginPath();ctx.ellipse(0,-h*.88,w*.34,w*.28,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#83bd2f';ctx.beginPath();ctx.ellipse(-w*.35,-h*.9,w*.22,w*.07,-.3,0,Math.PI*2);ctx.ellipse(w*.35,-h*.9,w*.22,w*.07,.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3f1cf';ctx.beginPath();ctx.ellipse(-w*.18,-h*.91,w*.055,w*.04,0,0,Math.PI*2);ctx.ellipse(w*.18,-h*.91,w*.055,w*.04,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#16230f';ctx.beginPath();ctx.arc(-w*.18,-h*.91,w*.022,0,Math.PI*2);ctx.arc(w*.18,-h*.91,w*.022,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5f8f22';ctx.beginPath();ctx.ellipse(0,-h*.84,w*.1,w*.05,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b180a';ctx.beginPath();ctx.arc(0,-h*.8,w*.16,.05,Math.PI-.05);ctx.strokeStyle='#2b180a';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#fff4cc';ctx.fillRect(-w*.11,-h*.8,w*.035,w*.08);ctx.fillRect(w*.07,-h*.8,w*.035,w*.08)}function drawBogLegend(){const h=hero.height,w=hero.width;drawOgre();ctx.save();ctx.globalAlpha=.75;ctx.strokeStyle=gameConfig.handsomeColor;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-h*.9,w*.48,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.moveTo(-w*.18,-h*1.08);ctx.lineTo(-w*.08,-h*.98);ctx.lineTo(0,-h*1.1);ctx.lineTo(w*.08,-h*.98);ctx.lineTo(w*.18,-h*1.08);ctx.lineTo(w*.14,-h*.96);ctx.lineTo(-w*.14,-h*.96);ctx.closePath();ctx.fill();ctx.restore()}
function drawParticle(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;if(p.type==='onion'){ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*.8,p.size,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6a8c2b';ctx.stroke()}else if(p.type==='bubble'){ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.stroke()}else if(p.type==='mud'){ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*1.2,p.size*.65,Math.random(),0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*.55,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function gameLoop(time){const dt=time-lastTime;lastTime=time;drawBg(time);drawHero(dt,time);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=p.decay;drawParticle(p);if(p.life<=0)particles.splice(i,1)}ctx.font="400 30px Bangers";ctx.textAlign='center';ctx.fillStyle='#ffd65a';ctx.strokeStyle='#17320f';ctx.lineWidth=4;for(let i=texts.length-1;i>=0;i--){let t=texts[i];t.y+=t.vy;t.life-=.02;ctx.globalAlpha=Math.max(0,t.life);ctx.strokeText(t.text,t.x,t.y);ctx.fillText(t.text,t.x,t.y);if(t.life<=0)texts.splice(i,1)}ctx.globalAlpha=1;if(currentState===STATE.TRANSFORMING){ctx.fillStyle=`rgba(170,255,53,${Math.min(.72,particles.length/220)})`;ctx.fillRect(0,0,innerWidth,innerHeight)}animationFrameId=requestAnimationFrame(gameLoop)}
window.addEventListener('DOMContentLoaded',init);window.gameConfigDefs={hugsRequired:{type:'number',label:'Burp Cheers to Party',value:20,min:5,max:100},clownColor:{type:'color',label:'Ogre Vest Color',value:'#8b5a2b'},handsomeColor:{type:'color',label:'Bog Legend Glow',value:'#ffd65a'}};window.gameConfig=gameConfig;window.updateGameConfig=(key,val)=>{if(gameConfig.hasOwnProperty(key)){gameConfig[key]=val;if(key==='hugsRequired')updateHUD()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAllAudio();else if(currentState===STATE.PLAYING&&audioUnlocked)switchBGM(false);else if(currentState===STATE.HANDSOME&&audioUnlocked)switchBGM(true)});
</script>
</body>
</html>
