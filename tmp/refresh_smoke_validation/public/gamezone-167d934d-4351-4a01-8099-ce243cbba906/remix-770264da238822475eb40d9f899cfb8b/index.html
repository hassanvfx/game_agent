<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Quill Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bangers&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --void: #060014;
        --night: #10002c;
        --blue: #00a7ff;
        --quill: #005bff;
        --cyan: #34f7ff;
        --magenta: #ff2bd6;
        --gold: #ffd84d;
        --orange: #ff7a18;
        --paper: #f7fbff;
        --glass: rgba(10, 6, 34, 0.72);
        --line: rgba(52, 247, 255, 0.78);
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--paper); font-family: 'Exo 2', system-ui, sans-serif; }
    body { overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #070018; }
    .hidden { display: none !important; }
    #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; isolation: isolate; }
    #game-container::before, #game-container::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    #game-container::before {
        background:
            repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 5px),
            radial-gradient(circle at 50% 18%, rgba(0,167,255,0.28), transparent 34%),
            radial-gradient(circle at 12% 72%, rgba(255,43,214,0.16), transparent 28%);
        mix-blend-mode: screen;
    }
    #game-container::after { box-shadow: inset 0 0 70px rgba(0,0,0,.72), inset 0 0 140px rgba(255,43,214,.16); }
    #ui-layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: max(.8rem, env(safe-area-inset-top)) max(.8rem, env(safe-area-inset-right)) max(.9rem, env(safe-area-inset-bottom)) max(.8rem, env(safe-area-inset-left)); box-sizing: border-box; }
    .glass { background: linear-gradient(180deg, rgba(22, 7, 58, .84), rgba(5, 2, 24, .74)); border: 2px solid var(--line); box-shadow: 0 0 0 1px rgba(255,43,214,.28), 0 18px 46px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18), 0 0 32px rgba(52,247,255,.18); backdrop-filter: blur(12px); }
    .panel { position: relative; pointer-events: auto; width: min(90vw, 30rem); padding: clamp(1.1rem, 4.5vw, 2rem); border-radius: 1.4rem; text-align: center; overflow: hidden; box-sizing: border-box; }
    .panel::before { content:""; position:absolute; inset:-40%; background: conic-gradient(from 90deg, transparent, rgba(52,247,255,.18), transparent, rgba(255,43,214,.18), transparent); animation: panelSpin 7s linear infinite; z-index:-1; }
    .kicker { margin: 0 0 .2rem; font-family: 'Orbitron', sans-serif; color: var(--cyan); font-weight: 700; font-size: .8rem; letter-spacing: .26em; text-transform: uppercase; }
    .title { margin: 0; font-family: 'Bangers', 'Orbitron', sans-serif; font-size: clamp(3.2rem, 15vw, 5.8rem); line-height: .85; letter-spacing: .04em; color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.22); text-shadow: 4px 5px 0 var(--quill), -3px -2px 0 var(--magenta), 0 0 30px rgba(52,247,255,.55); }
    .subtitle { margin: .8rem 0 .3rem; color: var(--gold); font-size: clamp(1rem, 4vw, 1.25rem); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .microcopy { margin: .25rem auto 1.2rem; max-width: 26rem; color: #dcefff; font-size: clamp(.92rem, 3.5vw, 1.05rem); line-height: 1.42; font-weight: 700; }
    .btn { appearance: none; border: 0; border-radius: 999px; width: min(100%, 19rem); min-height: 3.25rem; padding: .9rem 1.35rem; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #170400; background: linear-gradient(180deg, #fff58e, var(--gold) 52%, var(--orange)); box-shadow: 0 7px 0 #9b3500, 0 0 24px rgba(255,216,77,.45); }
    .btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #9b3500, 0 0 20px rgba(255,216,77,.35); }
    .btn-restart { background: linear-gradient(180deg, #8ffcff, var(--cyan) 54%, #008eff); box-shadow: 0 7px 0 #004a8d, 0 0 24px rgba(52,247,255,.45); color: #001223; }
    #hud { position: absolute; top: calc(.75rem + env(safe-area-inset-top)); left: .75rem; right: .75rem; z-index: 55; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: .55rem; }
    .hud-badge { display: flex; align-items: center; gap: .5rem; padding: .48rem .68rem; border-radius: 999px; min-height: 2.25rem; box-sizing: border-box; }
    .hud-icon { width: 1.55rem; height: 1.55rem; border-radius: 50%; border: 4px solid var(--gold); box-sizing: border-box; box-shadow: inset 0 0 0 3px rgba(255,122,24,.75), 0 0 16px rgba(255,216,77,.55); }
    .hud-label { font-family: 'Orbitron', sans-serif; font-size: .62rem; color: var(--cyan); letter-spacing: .16em; text-transform: uppercase; display: block; line-height: 1; }
    #score { font-family: 'Orbitron', sans-serif; font-size: 1.18rem; color: #fff; font-weight: 700; text-shadow: 0 0 12px var(--cyan); line-height: 1.05; }
    .hint-pill { padding: .55rem .7rem; border-radius: 999px; color: #fff; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; max-width: 44vw; }
    .game-over-title { margin: 0 0 .8rem; font-family: 'Bangers', sans-serif; color: #fff; font-size: clamp(2.8rem, 12vw, 4.4rem); line-height: .9; text-shadow: 4px 4px 0 #c30052, 0 0 26px rgba(255,43,214,.7); }
    .stat-line { margin: .25rem 0; font-size: 1.18rem; font-weight: 800; color: #fff; }
    .stat-line.small { margin: 0 0 1.2rem; color: #cceeff; font-size: .98rem; }
    .accent { color: var(--gold); }
    #feedback-stack { position: absolute; right: .75rem; bottom: calc(.75rem + env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; gap: .55rem; pointer-events: none; align-items: flex-end; }
    .feedback-card { display: flex; align-items: center; gap: .55rem; max-width: min(54vw, 12rem); padding: .42rem .55rem; border-radius: 1rem; opacity: 0; transform: translateY(10px) scale(.96); transition: opacity .18s ease, transform .18s ease; }
    .feedback-card.show { opacity: 1; transform: translateY(0) scale(1); }
    .feedback-card img { width: 2.45rem; height: 2.45rem; border-radius: .75rem; object-fit: cover; }
    .feedback-card span { font-size: .78rem; font-weight: 900; color: #fff; letter-spacing: .05em; text-transform: uppercase; }
    @keyframes panelSpin { to { transform: rotate(360deg); } }
    @media (min-width: 700px) { #hud { left: 1rem; right: 1rem; } .hint-pill { max-width: none; } }
</style>
</head>
<body>
<script id="game-config" type="application/x-game-config">
{
    "scrollSpeed": { "type": "number", "label": "Scroll Speed", "value": 250, "min": 100, "max": 600 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 700, "min": 400, "max": 1200 },
    "gravity": { "type": "number", "label": "Gravity", "value": 1800, "min": 800, "max": 3000 },
    "themeColor": { "type": "color", "label": "Neon Void", "value": "#070018" }
}
</script>
<audio id="bgm_main" data-editable="audio" data-label="Neon Runner BGM Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="none" loop></audio>
<audio id="sfx_jump" data-editable="audio" data-label="Spin Boost SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
<audio id="sfx_land" data-editable="audio" data-label="Rail Landing SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
<audio id="sfx_coin" data-editable="audio" data-label="Ring Pickup SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="Start Dash SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" data-editable="audio" data-label="Restart UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_dead" data-editable="audio" data-label="Loop Missed SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<div id="game-container">
    <canvas id="gameCanvas" aria-label="Neon Quill Rush playfield"></canvas>
    <div id="ui-layer">
        <div id="start-screen" class="glass panel interactive">
            <p class="kicker">Portrait Speed Trial</p>
            <h1 class="title">NEON<br>QUILL RUSH</h1>
            <p class="subtitle">Rip loops. Hoard rings. Stay loud.</p>
            <p class="microcopy">Tap the track or press Space to spin boost. You get one air boost before you must hit a rail.</p>
            <button id="start-btn" class="btn btn-start">START DASH</button>
        </div>
        <div id="game-over-screen" class="hidden glass panel">
            <h2 class="game-over-title">LOOP MISSED!</h2>
            <div class="stat-line">Rings Banked: <span id="finalScore" class="accent">0</span></div>
            <div class="stat-line small">Best Dash: <span id="bestScore">0</span></div>
            <button id="restart-btn" class="btn btn-restart">RUN IT BACK</button>
        </div>
        <div id="hud" class="hidden">
            <div class="glass hud-badge">
                <div class="hud-icon" aria-hidden="true"></div>
                <div><span class="hud-label">Rings</span><span id="score">0</span></div>
            </div>
            <div class="glass hint-pill">Tap / Space: Spin Boost</div>
        </div>
        <div id="feedback-stack" aria-live="polite">
            <div id="pickup-feedback" class="feedback-card hidden glass" aria-hidden="true">
                <img src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Celebration reaction for ring pickup">
                <span>Ring rush!</span>
            </div>
            <div id="fail-feedback" class="feedback-card hidden glass" aria-hidden="true">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Comical loop miss reaction">
                <span>Loop missed!</span>
            </div>
        </div>
    </div>
</div>
<script>
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
window.updateGameConfig = (key, val) => { if (window.gameConfigDefs[key]) { window.gameConfig[key] = val; } };

document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const ui = { start: document.getElementById('start-screen'), over: document.getElementById('game-over-screen'), hud: document.getElementById('hud'), score: document.getElementById('score'), finalScore: document.getElementById('finalScore'), bestScore: document.getElementById('bestScore'), startBtn: document.getElementById('start-btn'), restartBtn: document.getElementById('restart-btn') };
    let lastTime = 0, gameState = 'START', score = 0, highScore = Number(localStorage.getItem('neon_quill_best') || 0), cameraX = 0, shake = 0;
    let player = { x: 100, y: 300, w: 40, h: 40, vy: 0, grounded: false, jumps: 0, rotation: 0, scaleY: 1 };
    let platforms = [], coins = [], particles = [];
    const feedback = { pickup: document.getElementById('pickup-feedback'), fail: document.getElementById('fail-feedback') };
    let feedbackTimers = {}, lastLandAt = 0, audioUnlocked = false;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = { bgm: document.getElementById('bgm_main'), jump: document.getElementById('sfx_jump'), land: document.getElementById('sfx_land'), coin: document.getElementById('sfx_coin'), start: document.getElementById('sfx_start'), restart: document.getElementById('sfx_restart'), dead: document.getElementById('sfx_dead') };
    const soundVolumes = { bgm: .18, jump: .4, land: .28, coin: .42, start: .36, restart: .3, dead: .42 };
    Object.entries(sounds).forEach(([key, el]) => { if (el) { el.volume = soundVolumes[key] ?? .35; if (key === 'bgm') el.loop = true; } });
    const ensureAudioReady = () => { audioUnlocked = true; if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); };
    const synthesize = (type) => { if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime; if (type === 'jump') { osc.type='square'; osc.frequency.setValueAtTime(330, now); osc.frequency.exponentialRampToValueAtTime(880, now+.11); gain.gain.setValueAtTime(.045, now); gain.gain.exponentialRampToValueAtTime(.01, now+.12); osc.start(); osc.stop(now+.12); } else if (type === 'land') { osc.type='sine'; osc.frequency.setValueAtTime(190, now); osc.frequency.exponentialRampToValueAtTime(120, now+.08); gain.gain.setValueAtTime(.045, now); gain.gain.exponentialRampToValueAtTime(.01, now+.1); osc.start(); osc.stop(now+.1); } else if (type === 'explosion') { osc.type='sawtooth'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(16, now+.3); gain.gain.setValueAtTime(.08, now); gain.gain.exponentialRampToValueAtTime(.01, now+.3); osc.start(); osc.stop(now+.3); } else { osc.type='triangle'; osc.frequency.setValueAtTime(760, now); osc.frequency.exponentialRampToValueAtTime(1220, now+.08); gain.gain.setValueAtTime(.05, now); gain.gain.exponentialRampToValueAtTime(.01, now+.09); osc.start(); osc.stop(now+.09); } };
    const playSound = (id) => { const el = sounds[id]; if (!el) return; if (id === 'bgm') { el.play().catch(() => {}); return; } try { el.pause(); el.currentTime = 0; el.play().catch(() => synthesize(id === 'dead' ? 'explosion' : id)); } catch (_) { synthesize(id === 'dead' ? 'explosion' : id); } };
    const syncBgm = () => { if (!sounds.bgm) return; if (gameState === 'PLAYING' && audioUnlocked) { if (sounds.bgm.paused) sounds.bgm.play().catch(() => {}); } else if (!sounds.bgm.paused) sounds.bgm.pause(); };
    const showFeedback = (type, label) => { const card = feedback[type]; if (!card) return; const text = card.querySelector('span'); if (text && label) text.textContent = label; card.classList.remove('hidden'); card.classList.add('show'); card.setAttribute('aria-hidden','false'); clearTimeout(feedbackTimers[type]); feedbackTimers[type] = setTimeout(() => { card.classList.remove('show'); card.setAttribute('aria-hidden','true'); setTimeout(() => card.classList.add('hidden'), 180); }, type === 'fail' ? 1700 : 950); };
    const resize = () => { const dpr = window.devicePixelRatio || 1; canvas.width = Math.floor(window.innerWidth * dpr); canvas.height = Math.floor(window.innerHeight * dpr); canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    window.addEventListener('resize', resize); resize();
    const burst = (x, y, color, count, power, size = 5) => { for (let i=0;i<count;i++) particles.push({ x, y, vx:(Math.random()-.5)*power, vy:(Math.random()-.55)*power, life:.45+Math.random()*.35, color, size:size+Math.random()*3, spin:Math.random()*Math.PI }); };
    const handleInput = (e) => { if (e.type !== 'keydown') e.preventDefault(); if (gameState === 'START' || gameState === 'GAMEOVER') return; ensureAudioReady(); if (player.jumps < 2) { player.vy = -window.gameConfig.jumpForce; player.jumps++; player.grounded = false; player.scaleY = .6; player.rotation = 0; burst(player.x + player.w/2 + cameraX, player.y + player.h, player.jumps === 1 ? '#34f7ff' : '#ff2bd6', 7, 240, 4); playSound('jump'); } };
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleInput(e); });
    const generatePlatform = (startX) => { const gap = 100 + Math.random() * 150; const w = 150 + Math.random() * 200; const vh = canvas.height / (window.devicePixelRatio || 1); const y = Math.min(Math.max(200, player.y + (Math.random() - .5) * 300), vh - 100); platforms.push({ x: startX + gap, y, w, h: 40, phase: Math.random()*Math.PI*2 }); if (Math.random() > .3) { const cw = 30; coins.push({ x: startX + gap + w/2 - cw/2, y: y - 60 - Math.random()*100, w: cw, h: cw, collected: false, offset: Math.random()*Math.PI }); } };
    const initGame = () => { player.y = canvas.height / 2 / (window.devicePixelRatio || 1); player.vy = 0; player.jumps = 0; player.grounded = false; player.rotation = 0; player.scaleY = 1; score = 0; cameraX = 0; platforms = []; coins = []; particles = []; shake = 0; platforms.push({ x: 50, y: player.y + 50, w: 400, h: 40, phase: 0 }); for (let i=0;i<5;i++) generatePlatform(platforms[platforms.length-1].x + platforms[platforms.length-1].w); gameState = 'PLAYING'; showFeedback('fail', 'Speed line live!'); ui.start.classList.add('hidden'); ui.over.classList.add('hidden'); ui.hud.classList.remove('hidden'); ui.score.textContent = '0'; syncBgm(); };
    const gameOver = () => { if (gameState === 'GAMEOVER') return; gameState = 'GAMEOVER'; shake = 20; playSound('dead'); showFeedback('fail','Loop missed!'); syncBgm(); if (score > highScore) { highScore = score; localStorage.setItem('neon_quill_best', highScore); } ui.finalScore.textContent = Math.floor(score); ui.bestScore.textContent = Math.floor(highScore); ui.hud.classList.add('hidden'); ui.over.classList.remove('hidden'); burst(player.x + player.w/2 + cameraX, player.y + player.h/2, '#ffd84d', 26, 560, 7); };
    const update = (dt) => { if (gameState !== 'PLAYING') return; const scroll = window.gameConfig.scrollSpeed * dt; cameraX += scroll; score += scroll * .01; ui.score.textContent = Math.floor(score); if (shake > 0) shake *= .9; if (shake < .5) shake = 0; player.vy += window.gameConfig.gravity * dt; player.y += player.vy * dt; if (!player.grounded) player.rotation += dt * 5; else player.rotation *= .8; player.scaleY += (1 - player.scaleY) * 10 * dt; player.grounded = false; const px = player.x + cameraX, pw = player.w, ph = player.h, py = player.y; platforms.forEach(p => { if (px < p.x + p.w && px + pw > p.x && py + ph > p.y && py + ph < p.y + 30 && player.vy > 0) { player.y = p.y - ph; player.vy = 0; player.grounded = true; player.jumps = 0; player.scaleY = .8; const now = performance.now(); if (now - lastLandAt > 180) { playSound('land'); lastLandAt = now; burst(px + pw/2, p.y, '#34f7ff', 5, 160, 3); } } }); if (player.y > canvas.height / (window.devicePixelRatio || 1) + 100) gameOver(); if (platforms[0] && platforms[0].x + platforms[0].w < cameraX - 100) { platforms.shift(); generatePlatform(platforms[platforms.length-1].x + platforms[platforms.length-1].w); } coins.forEach(c => { if (c.collected) return; const dx = (px+pw/2) - (c.x+c.w/2); const dy = (player.y+ph/2) - (c.y+c.h/2); if (Math.sqrt(dx*dx + dy*dy) < 40) { c.collected = true; score += 100; playSound('coin'); showFeedback('pickup','+100 ring rush!'); burst(c.x+c.w/2, c.y+c.h/2, '#ffd84d', 12, 340, 4); } }); coins = coins.filter(c => c.x > cameraX - 100 || !c.collected); particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.vy += 500 * dt; p.spin += dt * 8; }); particles = particles.filter(p => p.life > 0); };
    const roundRect = (x,y,w,h,r) => { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
    const drawBackground = (w,h,t) => { const g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#080019'); g.addColorStop(.5,'#150045'); g.addColorStop(1,'#05000e'); ctx.fillStyle = g; ctx.fillRect(0,0,w,h); ctx.save(); ctx.globalAlpha=.75; for (let layer=0; layer<3; layer++) { const speed = (.08 + layer*.05); const baseY = h*(.48 + layer*.1); const blockW = 46 + layer*18; ctx.fillStyle = layer===0 ? 'rgba(0,167,255,.16)' : layer===1 ? 'rgba(255,43,214,.14)' : 'rgba(5,0,26,.65)'; for (let i=-2;i<Math.ceil(w/blockW)+3;i++) { const x = ((i*blockW*1.4 - cameraX*speed) % (w+blockW*2)) - blockW; const bh = 30 + ((i*37 + layer*19) % 100); ctx.fillRect(x, baseY-bh, blockW, bh); } } ctx.restore(); ctx.save(); ctx.translate((-cameraX*.45)%(w/2),0); ctx.strokeStyle='rgba(52,247,255,.23)'; ctx.lineWidth=1; const horizon = h*.68; for (let y=horizon; y<h; y+=28) { ctx.beginPath(); ctx.moveTo(-w,y); ctx.lineTo(w*2,y + (y-horizon)*.16); ctx.stroke(); } for (let x=-w; x<w*2; x+=54) { ctx.beginPath(); ctx.moveTo(x,h); ctx.lineTo(w/2 + (x-w/2)*.18, horizon); ctx.stroke(); } ctx.restore(); ctx.save(); ctx.strokeStyle='rgba(255,43,214,.34)'; ctx.lineWidth=4; for (let i=0;i<4;i++) { const lx = ((i*360 - cameraX*.72) % (w+480)); const x = lx < -240 ? lx + w + 480 : lx; ctx.beginPath(); ctx.arc(x, h*.58, 82 + (i%2)*36, -Math.PI*.1, Math.PI*1.25); ctx.stroke(); ctx.strokeStyle = i%2 ? 'rgba(52,247,255,.32)' : 'rgba(255,43,214,.34)'; } ctx.restore(); ctx.strokeStyle='rgba(255,255,255,.36)'; ctx.lineWidth=2; for (let i=0;i<18;i++) { const x = ((i*97 - cameraX*(1.7+i%3*.3)) % (w+180)); const sx = x < -90 ? x+w+180 : x; const y = (i*53 + t*.05) % h; ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 34 + (i%3)*18, y); ctx.stroke(); } };
    const drawPlatform = (p) => { const y = p.y, x = p.x; ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = '#34f7ff'; const grad = ctx.createLinearGradient(x,y,x,y+p.h); grad.addColorStop(0,'#c8ffff'); grad.addColorStop(.18,'#34f7ff'); grad.addColorStop(.5,'#007cff'); grad.addColorStop(1,'#240052'); ctx.fillStyle = grad; roundRect(x,y,p.w,p.h,18); ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#ff2bd6'; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.85)'; roundRect(x+10,y+6,Math.max(20,p.w-20),7,5); ctx.fill(); ctx.strokeStyle='rgba(255,216,77,.95)'; ctx.lineWidth=3; for (let sx=x+24; sx<x+p.w-15; sx+=42) { ctx.beginPath(); ctx.moveTo(sx,y+p.h-9); ctx.lineTo(sx+13,y+p.h-21); ctx.lineTo(sx+26,y+p.h-9); ctx.stroke(); } ctx.restore(); };
    const drawRing = (c, t) => { const floatY = Math.sin(t/200 + c.offset)*10; const cx = c.x + c.w/2, cy = c.y + c.h/2 + floatY; ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(t/240 + c.offset)*.35); ctx.shadowBlur=18; ctx.shadowColor='#ffd84d'; ctx.lineWidth=7; ctx.strokeStyle='#ffd84d'; ctx.beginPath(); ctx.ellipse(0,0,14,18,0,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=2.5; ctx.strokeStyle='#fff8b7'; ctx.beginPath(); ctx.ellipse(0,0,8,11,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); };
    const drawPlayer = () => { const px = player.x + cameraX; ctx.save(); ctx.translate(px + player.w/2, player.y + player.h/2); ctx.rotate(player.rotation); ctx.scale(1, player.scaleY); ctx.shadowBlur=20; ctx.shadowColor='#34f7ff'; ctx.fillStyle='#004dff'; ctx.beginPath(); ctx.moveTo(-17,-7); ctx.lineTo(-34,-21); ctx.lineTo(-20,0); ctx.lineTo(-34,13); ctx.lineTo(-12,11); ctx.closePath(); ctx.fill(); const body = ctx.createRadialGradient(-9,-12,4,0,0,27); body.addColorStop(0,'#5fe8ff'); body.addColorStop(.32,'#008dff'); body.addColorStop(1,'#0031c7'); ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='#f2d4ad'; ctx.beginPath(); ctx.ellipse(7,5,10,13,.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(7,-7,6,9,-.22,0,Math.PI*2); ctx.ellipse(17,-7,5,8,-.1,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#06112b'; ctx.beginPath(); ctx.arc(9,-7,2.2,0,Math.PI*2); ctx.arc(18,-7,2,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-4,17); ctx.lineTo(-20,27); ctx.stroke(); ctx.beginPath(); ctx.moveTo(11,17); ctx.lineTo(30,25); ctx.stroke(); ctx.fillStyle='#ff263d'; roundRect(-30,23,22,9,5); ctx.fill(); roundRect(19,21,24,10,5); ctx.fill(); ctx.restore(); ctx.save(); ctx.globalAlpha=.55; ctx.strokeStyle='#34f7ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(px+20, player.y+20, 35, 24, -.15, 0, Math.PI*2); ctx.stroke(); ctx.restore(); };
    const draw = (timestamp=0) => { const cssW = canvas.width / (window.devicePixelRatio || 1), cssH = canvas.height / (window.devicePixelRatio || 1); drawBackground(cssW, cssH, timestamp); const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake; ctx.save(); ctx.translate(sx,sy); ctx.save(); ctx.translate(-cameraX,0); platforms.forEach(drawPlatform); coins.forEach(c => { if (!c.collected) drawRing(c, timestamp); }); drawPlayer(); particles.forEach(p => { ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x,p.y); ctx.rotate(p.spin); ctx.fillStyle = p.color; if (p.color === '#ffd84d') { ctx.lineWidth=3; ctx.strokeStyle=p.color; ctx.beginPath(); ctx.arc(0,0,p.size,0,Math.PI*2); ctx.stroke(); } else { ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); } ctx.restore(); }); ctx.restore(); ctx.restore(); };
    const loop = (timestamp) => { const dt = Math.min((timestamp - lastTime) / 1000, .1); lastTime = timestamp; try { update(dt); draw(timestamp); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
    ui.startBtn.addEventListener('click', () => { ensureAudioReady(); playSound('start'); initGame(); });
    ui.restartBtn.addEventListener('click', () => { ensureAudioReady(); playSound('restart'); initGame(); });
    requestAnimationFrame(loop);
});
</script>
