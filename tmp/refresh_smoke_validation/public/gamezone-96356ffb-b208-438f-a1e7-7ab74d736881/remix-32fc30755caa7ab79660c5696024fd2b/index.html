<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Voxel Worksite 3D</title>
    <!-- [agent-note][stage4] preserved: catalog-backed fonts | title: Audiowide | ui: Exo 2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #081629;
            --sky-mid: #12325a;
            --sky-bottom: #f4a94c;
            --panel-bg: rgba(8, 18, 34, 0.74);
            --panel-bg-strong: rgba(7, 16, 30, 0.9);
            --panel-border: rgba(129, 229, 255, 0.34);
            --panel-highlight: rgba(255, 214, 102, 0.28);
            --text-main: #f8fbff;
            --text-soft: rgba(248, 251, 255, 0.84);
            --text-faint: rgba(226, 240, 255, 0.74);
            --accent-yellow: #ffd35c;
            --accent-orange: #ff9f43;
            --accent-red: #ff6b5e;
            --accent-red-hover: #ff8479;
            --accent-green: #3bc87d;
            --accent-green-hover: #5fd992;
            --button-blue: #4ec8ff;
            --button-cyan: #73f2ff;
            --shadow-heavy: 0 14px 40px rgba(0, 0, 0, 0.4);
            --shadow-title: 0 4px 0 rgba(4, 9, 18, 0.7);
            --glow-cyan: 0 0 0 1px rgba(115, 242, 255, 0.18), 0 0 26px rgba(78, 200, 255, 0.18);
            --glow-gold: 0 0 0 1px rgba(255, 211, 92, 0.18), 0 0 24px rgba(255, 159, 67, 0.22);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(115, 242, 255, 0.18), transparent 34%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bottom) 100%);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        button {
            font: inherit;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 40, 70, 0.92), rgba(8, 18, 34, 0.86)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-heavy), var(--glow-cyan);
        }

        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-brand,
        .hud-actions,
        .hotbar,
        .start-card,
        .hint-grid {
            pointer-events: auto;
        }

        .hud-brand {
            padding: 10px 16px;
            border-radius: 16px;
            font-weight: 700;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.35));
            position: relative;
            overflow: hidden;
        }

        .brand-title {
            color: var(--accent-yellow);
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .feedback-stack {
            position: absolute;
            right: 16px;
            bottom: 112px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
            z-index: 30;
        }

        .feedback-banner,
        .gif-toast {
            max-width: min(42vw, 220px);
            border-radius: 18px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: var(--shadow-heavy);
            background: rgba(7, 16, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .feedback-banner.show,
        .gif-toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-banner {
            padding: 10px 14px;
            color: #fff;
            font-family: 'Audiowide', sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .feedback-banner.success {
            background: linear-gradient(135deg, rgba(51, 200, 125, 0.94), rgba(20, 96, 72, 0.9));
        }

        .feedback-banner.warning {
            background: linear-gradient(135deg, rgba(255, 172, 69, 0.96), rgba(149, 73, 16, 0.9));
        }

        .feedback-banner .feedback-copy {
            display: block;
            margin-top: 4px;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.01em;
            text-transform: none;
        }

        .gif-toast img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.06);
        }

        .gif-toast figcaption {
            padding: 8px 10px 10px;
            font-size: 0.82rem;
            color: var(--text-soft);
            background: linear-gradient(180deg, rgba(10, 20, 36, 0.95), rgba(7, 16, 30, 0.85));
        }

        .brand-hint {
            font-size: 12px;
            opacity: 0.82;
            margin-left: 10px;
        }

        .hud-brand::after {
            content: "🚧";
            position: absolute;
            right: 12px;
            top: 8px;
            font-size: 18px;
            opacity: 0.8;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
        }

        .hud-actions {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            background:
                linear-gradient(180deg, rgba(17, 35, 61, 0.94), rgba(8, 18, 34, 0.82)),
                var(--panel-bg-strong);
        }

        .mode-btn {
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            padding: 8px 14px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
        }

        .mode-btn:hover {
            transform: translateY(-1px);
        }

        #mode-mine {
            background: var(--accent-red);
        }

        #mode-mine:hover {
            background: var(--accent-red-hover);
        }

        #mode-build {
            background: var(--accent-green);
            border-color: #fff;
        }

        #mode-build:hover {
            background: var(--accent-green-hover);
        }

        .hotbar {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 10px;
            border-radius: 20px;
            overflow-x: auto;
            max-width: 90%;
            -ms-overflow-style: none;
            scrollbar-width: none;
            background:
                linear-gradient(180deg, rgba(17, 35, 61, 0.96), rgba(7, 16, 30, 0.84)),
                var(--panel-bg-strong);
        }

        .hotbar::-webkit-scrollbar {
            display: none;
        }

        .block-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            background: linear-gradient(180deg, rgba(63, 83, 111, 0.66), rgba(28, 39, 57, 0.88));
            transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
            flex: 0 0 auto;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .block-btn:hover {
            background: linear-gradient(180deg, rgba(78, 102, 138, 0.8), rgba(32, 46, 68, 0.94));
        }

        .block-btn.active {
            border-color: var(--accent-yellow);
            transform: scale(1.08);
            box-shadow: var(--glow-gold);
        }

        .block-preview {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 2px 8px rgba(0, 0, 0, 0.26);
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background:
                radial-gradient(circle at 50% 18%, rgba(115, 242, 255, 0.18), transparent 28%),
                rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }

        .start-card {
            width: min(100%, 440px);
            margin: 0 auto;
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .start-card:hover {
            transform: scale(1.03);
        }

        .start-title {
            margin: 0 0 8px;
            font-family: 'Audiowide', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            line-height: 1;
            letter-spacing: 0.06em;
            text-shadow: var(--shadow-title);
            color: #fff4d4;
        }

        .start-copy {
            margin: 0 0 24px;
            color: var(--text-soft);
            font-size: 1.1rem;
        }

        .start-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(140deg, rgba(255, 214, 102, 0.08), transparent 38%),
                linear-gradient(320deg, rgba(115, 242, 255, 0.08), transparent 42%);
            pointer-events: none;
        }

        .hint-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            text-align: left;
            color: var(--text-faint);
            font-size: 0.95rem;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hint-item b {
            color: #fff;
        }

        .start-btn {
            border: 0;
            border-radius: 999px;
            padding: 16px 40px;
            color: #082038;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            background: linear-gradient(90deg, #ffe27a, var(--button-cyan));
            box-shadow: 0 12px 30px rgba(78, 200, 255, 0.28);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .start-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 16px 36px rgba(78, 200, 255, 0.42);
        }

        @media (max-width: 720px) {
            .hud {
                flex-direction: column;
                align-items: stretch;
            }

            .hud-actions {
                align-self: flex-end;
            }

            .hint-grid {
                grid-template-columns: 1fr;
            }

            .start-card {
                padding: 24px;
            }
        }

        @media (max-width: 520px) {
            .hud {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .hud-brand,
            .hud-actions {
                width: 100%;
            }

            .hud-actions {
                justify-content: center;
            }

            .brand-hint {
                display: block;
                margin: 6px 0 0;
            }

            .hotbar {
                bottom: 20px;
                max-width: calc(100% - 20px);
            }

            .start-copy {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="hud" class="hud hidden">
                <div class="glass-panel hud-brand">
                    <span class="brand-title">Voxel Worksite</span>
                    <span class="brand-hint">Tap or click a block to act</span>
                </div>
                <div class="glass-panel hud-actions">
                    <button id="mode-mine" class="mode-btn">⛏️ Clear</button>
                    <button id="mode-build" class="mode-btn">🧱 Stack</button>
                </div>
            </div>

            <div id="hotbar" class="hidden glass-panel hotbar">
                <!-- [agent-note][stage1] role: future-emoji | element: block-selector | intent: add clearer material identity without changing controls -->
            </div>

            <div class="feedback-stack" aria-live="polite">
                <!-- [agent-note][stage3] resolved-gif: build-feedback + clear-feedback -> catalogs/gifs.json -->
                <div id="feedback-banner" class="feedback-banner hidden"></div>
                <figure id="gif-toast" class="gif-toast hidden">
                    <img id="gif-toast-image" alt="Shift reaction">
                    <figcaption id="gif-toast-caption"></figcaption>
                </figure>
            </div>

            <div id="start-screen" class="start-screen">
                <div class="glass-panel start-card">
                    <h1 class="start-title">VOXEL WORKSITE</h1>
                    <p class="start-copy">Run the sky-yard shift and sculpt a bright construction stack with crisp, toy-box voxel tools.</p>
                    <div class="hint-grid">
                        <div class="hint-item">🖱️ <b>Tap / Click</b>: clear or stack</div>
                        <div class="hint-item">🔄 <b>Mode</b>: switch in the top-right panel</div>
                    </div>
                    <button id="start-btn" class="start-btn">START SHIFT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                break: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
                place: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            },
            gifs: {
                build: {
                    src: "https://i.giphy.com/KlPcP1IGRihcoRF5CL.webp",
                    alt: "Celebration reaction for a fresh block stack",
                    caption: "Stack locked in."
                },
                clear: {
                    src: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                    alt: "Retro arcade impact burst for cleared blocks",
                    caption: "Debris cleared."
                }
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.sfxVolume = {
                    break: 0.42,
                    place: 0.5,
                    blocked: 0.36,
                    ui: 0.3,
                    start: 0.5
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = false) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (now - last < cooldown) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolume[key] ?? 0.45;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const feedbackBanner = document.getElementById('feedback-banner');
        const gifToast = document.getElementById('gif-toast');
        const gifToastImage = document.getElementById('gif-toast-image');
        const gifToastCaption = document.getElementById('gif-toast-caption');
        let feedbackTimer = null;
        let gifTimer = null;

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Voxel Engine Config
        const GRID_SIZE = 16;
        const WORLD_HEIGHT = 12;
        let TILE_WIDTH = 32;
        let TILE_HEIGHT = 16;

        // Block Palette
        const BLOCKS = {
            0: { name: 'Air', emoji: '', color: null },
            1: { name: 'Grass', emoji: '🌿', top: '#95dc63', side: '#5c8c31', side2: '#446928' },
            2: { name: 'Dirt', emoji: '🟫', top: '#b6763f', side: '#89542d', side2: '#6a3f1f' },
            3: { name: 'Stone', emoji: '🪨', top: '#b9c4cf', side: '#8492a1', side2: '#687585' },
            4: { name: 'Wood', emoji: '🪵', top: '#efc780', side: '#ab6a34', side2: '#874d22' },
            5: { name: 'Leaves', emoji: '🍃', top: '#5fc779', side: '#2b9c56', side2: '#1f7642' },
            6: { name: 'Brick', emoji: '🧱', top: '#d8745e', side: '#b2493d', side2: '#8f3129' },
            7: { name: 'Water', emoji: '💧', top: '#68deff', side: '#2da8ed', side2: '#1675c9', alpha: 0.7 }
        };

        // State
        let width, height;
        let gameActive = false;
        let world = [];
        let mouseX = 0, mouseY = 0;
        let hoveredBlock = null;
        let currentMode = 'build';
        let selectedBlockType = 1;
        let cameraOffset = { x: 0, y: 0 };
        let isMouseDown = false;

        // Init World Data
        function generateWorld() {
            world = [];
            for (let x = 0; x < GRID_SIZE; x++) {
                world[x] = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    world[x][y] = [];
                    const h = Math.floor(3 + Math.abs(Math.sin(x / 4) * Math.cos(y / 4) * 4));
                    for (let z = 0; z < WORLD_HEIGHT; z++) {
                        if (z < h) {
                            world[x][y][z] = (z === h - 1) ? 1 : 2;
                        } else if (z === h && Math.random() < 0.05) {
                            world[x][y][z] = 4;
                            if (z + 1 < WORLD_HEIGHT) world[x][y][z + 1] = 4;
                            if (z + 2 < WORLD_HEIGHT) world[x][y][z + 2] = 5;
                        } else {
                            world[x][y][z] = 0;
                        }
                    }
                }
            }
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    world[x][y][0] = 3;
                }
            }
        }

        /** 4. RENDERING ENGINE */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cameraOffset.x = width / 2;
            cameraOffset.y = height / 4;

            if (width < 600) {
                TILE_WIDTH = 32;
                TILE_HEIGHT = 16;
            } else {
                TILE_WIDTH = 48;
                TILE_HEIGHT = 24;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function isoToScreen(x, y, z) {
            return {
                x: (x - y) * TILE_WIDTH + cameraOffset.x,
                y: (x + y) * TILE_HEIGHT - (z * TILE_HEIGHT * 1.5) + cameraOffset.y
            };
        }

        function drawBlock(x, y, z, type, isHovered = false) {
            if (type === 0) return;
            const pos = isoToScreen(x, y, z);
            const def = BLOCKS[type];

            const hoverOffset = isHovered ? -4 : 0;
            const px = pos.x;
            const py = pos.y + hoverOffset;

            ctx.lineWidth = 1;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = isHovered ? 'white' : 'rgba(0,0,0,0.1)';

            ctx.beginPath();
            ctx.moveTo(px, py - TILE_HEIGHT);
            ctx.lineTo(px + TILE_WIDTH, py);
            ctx.lineTo(px, py + TILE_HEIGHT);
            ctx.lineTo(px - TILE_WIDTH, py);
            ctx.closePath();
            ctx.fillStyle = def.top;
            if (def.alpha) ctx.globalAlpha = def.alpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(px + TILE_WIDTH, py);
            ctx.lineTo(px + TILE_WIDTH, py + TILE_HEIGHT * 1.5);
            ctx.lineTo(px, py + TILE_HEIGHT * 2.5);
            ctx.lineTo(px, py + TILE_HEIGHT);
            ctx.closePath();
            ctx.fillStyle = def.side;
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(px - TILE_WIDTH, py);
            ctx.lineTo(px - TILE_WIDTH, py + TILE_HEIGHT * 1.5);
            ctx.lineTo(px, py + TILE_HEIGHT * 2.5);
            ctx.lineTo(px, py + TILE_HEIGHT);
            ctx.closePath();
            ctx.fillStyle = def.side2;
            ctx.fill();
            ctx.stroke();

            if (isHovered) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                ctx.beginPath();
                ctx.moveTo(px, py - TILE_HEIGHT);
                ctx.lineTo(px + TILE_WIDTH, py);
                ctx.lineTo(px + TILE_WIDTH, py + TILE_HEIGHT * 1.5);
                ctx.lineTo(px, py + TILE_HEIGHT * 2.5);
                ctx.lineTo(px - TILE_WIDTH, py + TILE_HEIGHT * 1.5);
                ctx.lineTo(px - TILE_WIDTH, py);
                ctx.closePath();
                ctx.stroke();
            }
        }

        function isPointInBlock(px, py, bx, by, bz) {
            const pos = isoToScreen(bx, by, bz);
            const dx = Math.abs(px - pos.x);
            const dy = py - pos.y;

            if (dy < -TILE_HEIGHT || dy > TILE_HEIGHT * 2.5) return false;
            if (dx > TILE_WIDTH) return false;

            return true;
        }

        /** 5. INPUT LOGIC */
        function getHoveredBlock() {
            for (let z = WORLD_HEIGHT - 1; z >= 0; z--) {
                for (let y = GRID_SIZE - 1; y >= 0; y--) {
                    for (let x = GRID_SIZE - 1; x >= 0; x--) {
                        if (world[x][y][z] !== 0) {
                            if (isPointInBlock(mouseX, mouseY, x, y, z)) {
                                return { x, y, z, type: world[x][y][z] };
                            }
                        }
                    }
                }
            }
            return null;
        }

        function showFeedback(kind, title, copy) {
            feedbackBanner.className = `feedback-banner ${kind}`;
            feedbackBanner.innerHTML = `${title}<span class="feedback-copy">${copy}</span>`;
            feedbackBanner.classList.remove('hidden');
            requestAnimationFrame(() => feedbackBanner.classList.add('show'));
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackBanner.classList.remove('show');
                setTimeout(() => feedbackBanner.classList.add('hidden'), 220);
            }, 1400);
        }

        function showGif(type) {
            const gif = ASSETS.gifs[type];
            if (!gif) return;
            gifToastImage.src = gif.src;
            gifToastImage.alt = gif.alt;
            gifToastCaption.textContent = gif.caption;
            gifToast.classList.remove('hidden');
            requestAnimationFrame(() => gifToast.classList.add('show'));
            clearTimeout(gifTimer);
            gifTimer = setTimeout(() => {
                gifToast.classList.remove('show');
                setTimeout(() => gifToast.classList.add('hidden'), 220);
            }, 1800);
        }

        function handleInteraction() {
            if (!hoveredBlock) return;

            if (currentMode === 'mine') {
                if (hoveredBlock.z > 0) {
                    world[hoveredBlock.x][hoveredBlock.y][hoveredBlock.z] = 0;
                    totalCleared += 1;
                    audio.playSFX('break', 110);
                    createParticles(hoveredBlock.x, hoveredBlock.y, hoveredBlock.z, BLOCKS[hoveredBlock.type].top);
                    if (totalCleared % 3 === 0) {
                        showFeedback('warning', 'Clear Streak', 'Heavy rubble moved off the lot.');
                        showGif('clear');
                    }
                } else {
                    audio.playSFX('blocked', 120);
                    showFeedback('warning', 'Bedrock Locked', 'Foundation blocks stay put.');
                }
            } else if (currentMode === 'build') {
                if (hoveredBlock.z < WORLD_HEIGHT - 1 && world[hoveredBlock.x][hoveredBlock.y][hoveredBlock.z + 1] === 0) {
                    world[hoveredBlock.x][hoveredBlock.y][hoveredBlock.z + 1] = selectedBlockType;
                    totalPlaced += 1;
                    audio.playSFX('place', 90);
                    if (totalPlaced % 4 === 0) {
                        showFeedback('success', 'Stack Bonus', 'Clean placement streak on the sky-yard.');
                        showGif('build');
                    }
                } else {
                    audio.playSFX('blocked', 120);
                    showFeedback('warning', 'No Clearance', 'Pick a top face with open space above it.');
                }
            }
        }

        let particles = [];
        let totalPlaced = 0;
        let totalCleared = 0;
        function createParticles(bx, by, bz, color) {
            const pos = isoToScreen(bx, by, bz);
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: pos.x,
                    y: pos.y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 1) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            ctx.globalAlpha = 1.0;
        }

        /** 6. GAME LOOP */
        function gameLoop() {
            if (!gameActive) return;

            hoveredBlock = getHoveredBlock();
            updateParticles();

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#081629');
            grad.addColorStop(0.55, '#12325a');
            grad.addColorStop(1, '#f4a94c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const sunGlow = ctx.createRadialGradient(width * 0.74, height * 0.2, 20, width * 0.74, height * 0.2, width * 0.3);
            sunGlow.addColorStop(0, 'rgba(255, 226, 122, 0.62)');
            sunGlow.addColorStop(0.35, 'rgba(255, 184, 94, 0.22)');
            sunGlow.addColorStop(1, 'rgba(255, 184, 94, 0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, width, height);

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let z = 0; z < WORLD_HEIGHT; z++) {
                        const type = world[x][y][z];
                        if (type !== 0) {
                            const isHovered = hoveredBlock && hoveredBlock.x === x && hoveredBlock.y === y && hoveredBlock.z === z;
                            drawBlock(x, y, z, type, isHovered);
                        }
                    }
                }
            }

            if (currentMode === 'build' && hoveredBlock && hoveredBlock.z < WORLD_HEIGHT - 1) {
                ctx.globalAlpha = 0.5;
                drawBlock(hoveredBlock.x, hoveredBlock.y, hoveredBlock.z + 1, selectedBlockType, false);
                ctx.globalAlpha = 1.0;
            }

            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        /** 7. UI LOGIC */
        function initUI() {
            const hotbar = document.getElementById('hotbar');
            hotbar.innerHTML = '<!-- [agent-note][stage1] role: future-emoji | element: block-selector | intent: add clearer material identity without changing controls -->';

            Object.keys(BLOCKS).forEach(key => {
                const k = parseInt(key);
                if (k === 0) return;
                const b = BLOCKS[k];

                const btn = document.createElement('div');
                btn.className = `block-btn ${k === selectedBlockType ? 'active' : ''}`;

                const preview = document.createElement('div');
                preview.className = 'block-preview';
                preview.style.backgroundColor = b.top;
                preview.title = b.name;
                preview.textContent = b.emoji;
                preview.style.display = 'flex';
                preview.style.alignItems = 'center';
                preview.style.justifyContent = 'center';
                preview.style.fontSize = '14px';
                btn.appendChild(preview);

                btn.setAttribute('aria-label', b.name);
                btn.title = b.name;

                btn.onclick = () => {
                    selectedBlockType = k;
                    document.querySelectorAll('.block-btn').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    audio.playSFX('ui', 70);
                    setMode('build');
                };

                hotbar.appendChild(btn);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            const mineBtn = document.getElementById('mode-mine');
            const buildBtn = document.getElementById('mode-build');

            if (mode === 'mine') {
                mineBtn.classList.add('active-mode');
                buildBtn.classList.remove('active-mode');
                mineBtn.style.borderColor = '#ffffff';
                buildBtn.style.borderColor = 'transparent';
                mineBtn.style.transform = 'scale(1.05)';
                buildBtn.style.transform = 'scale(1)';
            } else {
                buildBtn.classList.add('active-mode');
                mineBtn.classList.remove('active-mode');
                buildBtn.style.borderColor = '#ffffff';
                mineBtn.style.borderColor = 'transparent';
                buildBtn.style.transform = 'scale(1.05)';
                mineBtn.style.transform = 'scale(1)';
            }
        }

        canvas.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mousedown', () => {
            if (!gameActive) return;
            isMouseDown = true;
            handleInteraction();
        });

        canvas.addEventListener('mouseup', () => isMouseDown = false);

        canvas.addEventListener('touchstart', e => {
            if (!gameActive) return;
            // [agent-note][stage4] mobile-actionability: keep gesture suppression on the gameplay surface only
            e.preventDefault();
            const t = e.touches[0];
            mouseX = t.clientX;
            mouseY = t.clientY;
            isMouseDown = true;
            handleInteraction();
        }, { passive: false });

        document.getElementById('mode-mine').addEventListener('click', () => {
            audio.playSFX('ui', 70);
            setMode('mine');
        });
        document.getElementById('mode-build').addEventListener('click', () => {
            audio.playSFX('ui', 70);
            setMode('build');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopBGM(false);
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hotbar').classList.remove('hidden');

            generateWorld();
            initUI();
            setMode('build');
            gameActive = true;
            gameLoop();
        });
    });
    </script>
</body>
