<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Zone Sprint</title>
    <!-- [agent-note][stage4] repaired: catalog-font-link | action: remapped title/ui fonts to approved catalogs/fonts.json entries -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070818;
            --bg-mid: #111a38;
            --bg-glow: #202f68;
            --panel-bg: rgba(9, 15, 37, 0.78);
            --panel-border: rgba(120, 221, 255, 0.38);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --title-cyan: #8df6ff;
            --title-yellow: #ffe066;
            --danger-red: #ff5277;
            --accent-blue: #32a7ff;
            --accent-blue-dark: #1266d8;
            --accent-green: #49f59d;
            --accent-green-dark: #14a86a;
            --hud-shadow: rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(82, 201, 255, 0.22), transparent 30%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: #eef8ff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 35%),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 12px 32px rgba(0, 0, 0, 0.42),
                0 0 24px rgba(77, 196, 255, 0.15);
        }

        .screen-card {
            padding: clamp(1.4rem, 5vw, 2.5rem);
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            width: min(90vw, 34rem);
        }

        #start-screen {
            transition: transform 0.3s ease;
        }

        #start-screen:hover {
            transform: scale(1.03);
        }

        .title {
            margin: 0 0 0.35rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.5rem, 9vw, 4.6rem);
            line-height: 0.95;
            letter-spacing: 0.12em;
            color: var(--title-cyan);
            text-shadow:
                0 0 12px rgba(141, 246, 255, 0.6),
                0 0 28px rgba(50, 167, 255, 0.25);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: rgba(232, 247, 255, 0.94);
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            font-weight: 600;
            line-height: 1.45;
        }

        .result-label {
            margin: 0 0 1rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 1;
            letter-spacing: 0.08em;
            color: var(--danger-red);
            text-shadow: 0 0 16px rgba(255, 82, 119, 0.35);
        }

        .score-line {
            margin: 0 0 2rem;
            color: #ffffff;
            font-size: clamp(1.25rem, 5vw, 2rem);
            font-weight: 600;
        }

        .score-value {
            color: var(--title-yellow);
        }

        .game-button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-bottom: 4px solid transparent;
            color: #ffffff;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            letter-spacing: 0.1em;
            padding: 0.95rem 2rem;
            border-radius: 999px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .game-button:active {
            border-bottom-width: 0;
            transform: translateY(4px);
        }

        .button-primary {
            background: linear-gradient(180deg, #4ec8ff, var(--accent-blue));
            border-bottom-color: var(--accent-blue-dark);
        }

        .button-primary:hover {
            background: linear-gradient(180deg, #73d9ff, #2489ff);
            border-bottom-color: #1d4ed8;
            box-shadow: 0 0 18px rgba(80, 197, 255, 0.4);
        }

        .button-secondary {
            background: linear-gradient(180deg, #63ffb4, var(--accent-green));
            border-bottom-color: var(--accent-green-dark);
        }

        .button-secondary:hover {
            background: linear-gradient(180deg, #88ffc7, #36db8c);
            border-bottom-color: #16a34a;
            box-shadow: 0 0 18px rgba(72, 255, 168, 0.28);
        }

        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0.85rem;
            border-radius: 999px;
            background: rgba(6, 13, 33, 0.52);
            border: 1px solid rgba(132, 237, 255, 0.3);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
        }

        .ring-icon {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 999px;
            border: 4px solid var(--title-yellow);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0 25%, transparent 26%);
            box-shadow: 0 0 10px rgba(255, 224, 102, 0.35);
        }

        .hud-score {
            color: var(--title-yellow);
            font-size: clamp(1.1rem, 5vw, 1.6rem);
            font-weight: 600;
            text-shadow: 0 3px 8px var(--hud-shadow);
        }

        .accent-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            background: rgba(141, 246, 255, 0.12);
            border: 1px solid rgba(141, 246, 255, 0.32);
            color: var(--title-cyan);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .hud-label {
            color: rgba(216, 241, 255, 0.78);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .feedback-stack {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-end;
            width: min(36vw, 10rem);
            z-index: 3;
        }

        .feedback-gif {
            width: 100%;
            max-width: 9rem;
            border-radius: 1rem;
            border: 2px solid rgba(141, 246, 255, 0.34);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(8, 16, 36, 0.7);
            object-fit: cover;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            min-width: 6.5rem;
            max-width: 11rem;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            text-align: center;
            background: rgba(6, 13, 33, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #eef8ff;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .screen-card {
                width: min(92vw, 28rem);
            }

            .hud {
                top: 0.8rem;
                left: 0.8rem;
                gap: 0.55rem;
                padding: 0.45rem 0.7rem;
            }

            .feedback-stack {
                right: 0.75rem;
                bottom: 0.75rem;
                width: min(34vw, 7rem);
            }

            .feedback-caption {
                min-width: 5.75rem;
                max-width: 7rem;
                font-size: 0.62rem;
                padding: 0.42rem 0.62rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel screen-card">
                <div class="accent-chip">Neon Runner Protocol</div>
                <h1 class="title">ZONE SPRINT</h1>
                <p class="subtitle">Pilot the pulse orb, chain bright rings, and slip past crimson spike traps.</p>
                <button id="start-btn" class="game-button button-primary">START RUN</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen-card">
                <h2 class="result-label">RUN OVER</h2>
                <div class="score-line">Rings Banked: <span id="finalScore" class="score-value">0</span></div>
                <button id="restart-btn" class="game-button button-secondary">RUN AGAIN</button>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="ring-icon"></div>
                <span class="hud-label">rings</span>
                <span id="score" class="hud-score">0</span>
            </div>
        </div>

        <div class="feedback-stack" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: score/fail feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
            <img id="score-gif" class="feedback-gif" alt="score reaction" src="https://i.giphy.com/10gLW3UdTnQzdu.webp">
            <img id="fail-gif" class="feedback-gif" alt="fail reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
            <div id="feedback-caption" class="feedback-caption">Boost</div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                score: "https://i.giphy.com/10gLW3UdTnQzdu.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.volume = key === 'fail' ? 0.6 : 0.45;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 90) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreGif = document.getElementById('score-gif');
        const failGif = document.getElementById('fail-gif');
        const feedbackCaption = document.getElementById('feedback-caption');
        const gameContainer = document.getElementById('game-container');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 8;
        let feedbackTimeout = null;

        // Player
        let player = {
            x: 100,
            y: 0,
            radius: 20,
            dy: 0,
            jumpForce: -13,
            gravity: 0.6,
            grounded: false,
            rotation: 0,
            jumpCount: 0,
            maxJumps: 2,
            wasGrounded: false
        };

        // World
        let groundHeight = 100;
        let obstacles = [];
        let particles = [];
        let bgOffset = 0;
        let groundOffset = 0;
        let starField = [];

        function showFeedback(type, label) {
            clearTimeout(feedbackTimeout);
            scoreGif.classList.toggle('visible', type === 'score');
            failGif.classList.toggle('visible', type === 'fail');
            feedbackCaption.textContent = label;
            feedbackCaption.classList.add('visible');

            feedbackTimeout = setTimeout(() => {
                scoreGif.classList.remove('visible');
                failGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, type === 'fail' ? 1500 : 950);
        }

        function rebuildStarField() {
            starField = Array.from({ length: 28 }, (_, index) => ({
                x: (index / 28) * width,
                y: Math.random() * (height - groundHeight - 40),
                size: 1 + Math.random() * 2.2,
                alpha: 0.25 + Math.random() * 0.4
            }));
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            groundHeight = height * 0.25;
            rebuildStarField();
            if (player.y === 0) player.y = height - groundHeight - player.radius;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 8;
            frameCount = 0;
            obstacles = [];
            particles = [];
            bgOffset = 0;
            groundOffset = 0;
            player.y = height - groundHeight - player.radius;
            player.dy = 0;
            player.rotation = 0;
            player.jumpCount = 0;
            player.grounded = true;
            player.wasGrounded = true;
            document.getElementById('score').innerText = score;
            scoreGif.classList.remove('visible');
            failGif.classList.remove('visible');
            feedbackCaption.classList.remove('visible');
        }

        function spawnObstacle() {
            const isRing = Math.random() > 0.4;

            if (isRing) {
                const patternY = height - groundHeight - 40 - (Math.random() * 100);
                for (let i = 0; i < 3; i++) {
                    obstacles.push({
                        type: 'ring',
                        x: width + (i * 50),
                        y: patternY,
                        width: 30,
                        height: 30,
                        collected: false,
                        angle: 0
                    });
                }
            } else {
                obstacles.push({
                    type: 'spike',
                    x: width,
                    y: height - groundHeight - 40,
                    width: 40,
                    height: 40
                });
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.radius > height - groundHeight) {
                player.y = height - groundHeight - player.radius;
                player.dy = 0;
                player.grounded = true;
                player.jumpCount = 0;

                if (!player.wasGrounded) {
                    audio.playSFX('land', 120);
                }
            } else {
                player.grounded = false;
            }
            player.wasGrounded = player.grounded;

            player.rotation += 0.2 + (gameSpeed * 0.02);

            if (frameCount % 600 === 0) gameSpeed += 0.5;

            bgOffset -= gameSpeed * 0.2;
            groundOffset -= gameSpeed;
            if (groundOffset <= -100) groundOffset = 0;

            if (frameCount % Math.floor(10000 / (gameSpeed * 10)) === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                let dx = player.x - (obs.x + obs.width / 2);
                let dy = player.y - (obs.y + obs.height / 2);
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (obs.type === 'ring') {
                    obs.angle += 0.1;
                    if (!obs.collected && dist < player.radius + obs.width / 2) {
                        obs.collected = true;
                        score++;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('score', 80);
                        createParticles(obs.x, obs.y, '#FFD700');
                        showFeedback('score', score > 1 ? 'Ring Chain' : 'Boost');
                        obstacles.splice(i, 1);
                    }
                } else if (obs.type === 'spike') {
                    if (
                        player.x + player.radius > obs.x + 5 &&
                        player.x - player.radius < obs.x + obs.width - 5 &&
                        player.y + player.radius > obs.y + 10
                    ) {
                        gameOver();
                    }
                }

                if (obs.x < -100) obstacles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount++;
        }

        function draw() {
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#070818');
            grad.addColorStop(0.45, '#162456');
            grad.addColorStop(1, '#2e4f80');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.78, height * 0.18, 10, width * 0.78, height * 0.18, width * 0.45);
            glow.addColorStop(0, 'rgba(130, 245, 255, 0.38)');
            glow.addColorStop(1, 'rgba(130, 245, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            starField.forEach((star, index) => {
                const twinkle = 0.55 + Math.sin(frameCount * 0.05 + index) * 0.2;
                ctx.globalAlpha = star.alpha * twinkle;
                ctx.fillStyle = '#d6fbff';
                ctx.fillRect(((star.x + bgOffset * 0.12) % (width + 10) + width + 10) % (width + 10), star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1;

            const hillGrad = ctx.createLinearGradient(0, height - groundHeight - 120, 0, height);
            hillGrad.addColorStop(0, '#193468');
            hillGrad.addColorStop(1, '#0a1331');
            ctx.fillStyle = hillGrad;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 10) {
                let y = (height - groundHeight - 55) + Math.sin((x - bgOffset) * 0.005) * 40;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            ctx.strokeStyle = 'rgba(141, 246, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= width; x += 18) {
                let y = (height - groundHeight - 55) + Math.sin((x - bgOffset) * 0.005) * 40;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            let groundY = height - groundHeight;
            const trackGrad = ctx.createLinearGradient(0, groundY, 0, height);
            trackGrad.addColorStop(0, '#1b1230');
            trackGrad.addColorStop(1, '#050811');
            ctx.fillStyle = trackGrad;
            ctx.fillRect(0, groundY, width, groundHeight);

            let tileSize = 40;
            let rows = Math.ceil(groundHeight / tileSize);
            let cols = Math.ceil(width / tileSize) + 2;

            ctx.strokeStyle = 'rgba(100, 227, 255, 0.14)';
            ctx.lineWidth = 1;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let gx = (c * tileSize) + (groundOffset % tileSize);
                    let gy = groundY + (r * tileSize);
                    ctx.strokeRect(gx - tileSize, gy, tileSize, tileSize);
                }
            }

            ctx.fillStyle = '#52f3d4';
            ctx.fillRect(0, groundY, width, 10);

            ctx.strokeStyle = 'rgba(255, 224, 102, 0.2)';
            ctx.beginPath();
            for (let x = 0; x < width; x += 60) {
                ctx.moveTo(x + (groundOffset % 60), groundY + 12);
                ctx.lineTo(x + 20 + (groundOffset % 60), height);
            }
            ctx.stroke();

            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    const spikeGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.height);
                    spikeGrad.addColorStop(0, '#ff7b8f');
                    spikeGrad.addColorStop(1, '#8a1230');
                    ctx.fillStyle = spikeGrad;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 6, obs.y + obs.height - 4);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y + 6);
                    ctx.lineTo(obs.x + obs.width - 6, obs.y + obs.height - 4);
                    ctx.stroke();
                } else if (obs.type === 'ring') {
                    ctx.save();
                    ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
                    let scaleX = Math.abs(Math.cos(obs.angle));
                    ctx.scale(scaleX, 1);

                    ctx.strokeStyle = '#ffe066';
                    ctx.shadowColor = 'rgba(255, 224, 102, 0.55)';
                    ctx.shadowBlur = 12;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff9d1';
                    ctx.beginPath();
                    ctx.arc(6, -6, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);

            const bodyGrad = ctx.createRadialGradient(-6, -8, 4, 0, 0, player.radius + 8);
            bodyGrad.addColorStop(0, '#9efcff');
            bodyGrad.addColorStop(0.5, '#36a9ff');
            bodyGrad.addColorStop(1, '#123ca7');
            ctx.fillStyle = bodyGrad;
            ctx.shadowColor = 'rgba(82, 216, 255, 0.45)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0b1b53';
            ctx.beginPath();
            ctx.arc(-4, 1, player.radius - 8, 0, Math.PI * 2);
            ctx.fill();

            if (!player.grounded) {
                ctx.strokeStyle = 'rgba(141, 246, 255, 0.55)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, player.radius + 5, Math.PI * 0.2, Math.PI * 1.6);
                ctx.stroke();
            }

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(5, -6, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#101938';
            ctx.beginPath();
            ctx.arc(7, -5, 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8df6ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-2, 4, 9, 0.1, Math.PI * 0.95);
            ctx.stroke();

            ctx.restore();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, width, height);
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            showFeedback('fail', 'Run Over');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;
            if (player.jumpCount < player.maxJumps) {
                player.dy = player.jumpForce;
                player.jumpCount++;
                player.grounded = false;
                player.wasGrounded = false;
                audio.playSFX('jump', 80);
                if (player.jumpCount === 1) {
                    createParticles(player.x, player.y + player.radius, '#FFF');
                }
            }
        }

        /** 5. CONTROLS */
        function beginRun() {
            audio.unlock();
            audio.playSFX('start', 180);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        startBtn.addEventListener('click', beginRun);

        restartBtn.addEventListener('click', () => {
            beginRun();
        });

        window.addEventListener('mousedown', jump);
        // [agent-note][stage4] repaired: mobile-start-action | reason: scoped touch suppression to playfield so menu CTA taps still produce click events
        gameContainer.addEventListener('touchstart', (e) => {
            if (!gameActive || e.target.closest('button')) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (!gameActive && !document.getElementById('start-screen').classList.contains('hidden')) return;
                jump();
            }
        });

        // [agent-note][stage4] preserved: gameplay-loop | action: input repair only, no scoring/spawn/jump tuning
        // [agent-note][stage4] resolved-font: title -> Audiowide, ui/body -> Rajdhani via approved catalogs/fonts.json entries
        // [agent-note][stage3] resolved-audio: loop + start/jump/land/score/fail -> catalogs/audios.json
    });
    </script>
</body>
