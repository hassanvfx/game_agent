<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Moonlit Pact: Rain at Forks-ish High</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --ink: #fff7fb;
      --mist: rgba(255, 247, 251, 0.72);
      --violet: #8b5cf6;
      --rose: #fb7185;
      --blood: #b91c1c;
      --moss: #164e3b;
      --pine: #061912;
      --night: #05070d;
      --glass: rgba(13, 16, 27, 0.76);
      --line: rgba(255, 255, 255, 0.16);
      --display: "Cinzel", Georgia, serif;
      --ui: "Rajdhani", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--ui); touch-action: manipulation; user-select: none; }
    button { font: inherit; color: inherit; }
    .hidden { display: none !important; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #070815 0%, #08140f 58%, #020504 100%); }
    .forest { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .moon { position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -26px; top: calc(18px + var(--safe-top)); background: radial-gradient(circle at 32% 26%, #fff 0 8%, #fce7f3 24%, #c4b5fd 58%, rgba(124, 58, 237, .08) 72%); box-shadow: 0 0 44px rgba(216, 180, 254, .46), 0 0 130px rgba(251, 113, 133, .18); opacity: .92; }
    .cloud { position: absolute; height: 78px; border-radius: 999px; background: radial-gradient(circle at 20% 55%, rgba(42, 56, 67, .64), transparent 38%), radial-gradient(circle at 65% 38%, rgba(22, 27, 38, .84), transparent 46%); filter: blur(10px); animation: drift 18s linear infinite; opacity: .82; }
    .cloud.a { width: 250px; top: 80px; left: -80px; } .cloud.b { width: 310px; top: 164px; right: -170px; animation-duration: 26s; animation-direction: reverse; }
    .trees { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 0 12%, rgba(4, 21, 14, .78) 12% 16%, transparent 16% 24%, rgba(5, 35, 24, .58) 24% 28%, transparent 28% 41%, rgba(2, 16, 12, .84) 41% 47%, transparent 47% 63%, rgba(7, 45, 30, .54) 63% 68%, transparent 68%), linear-gradient(245deg, transparent 0 18%, rgba(2, 13, 10, .85) 18% 23%, transparent 23% 39%, rgba(13, 44, 33, .64) 39% 45%, transparent 45% 72%, rgba(3, 17, 13, .88) 72% 78%, transparent 78%); opacity: .95; }
    .ground { position: absolute; left: -10%; right: -10%; bottom: -9%; height: 32%; border-radius: 50% 50% 0 0; background: radial-gradient(ellipse at top, rgba(22, 78, 59, .72), transparent 55%), linear-gradient(180deg, rgba(7, 28, 21, .9), #010302); box-shadow: inset 0 22px 44px rgba(251, 113, 133, .08); }
    .rain { position: absolute; inset: -20% 0; background-image: repeating-linear-gradient(104deg, rgba(255,255,255,.2) 0 1px, transparent 1px 14px); background-size: 72px 72px; animation: rain 1s linear infinite; opacity: .24; }
    .sparkles { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.8px), radial-gradient(circle, rgba(251,113,133,.55) 0 1px, transparent 2px); background-size: 89px 133px, 144px 101px; animation: glimmer 5s ease-in-out infinite alternate; mix-blend-mode: screen; opacity: .18; }
    .center-screen { justify-content: center; align-items: center; padding: calc(20px + var(--safe-top)) 18px calc(20px + var(--safe-bottom)); text-align: center; }
    .app-card { position: relative; z-index: 2; width: min(92vw, 380px); padding: 22px 18px 20px; border: 1px solid rgba(252, 231, 243, .22); border-radius: 30px; background: linear-gradient(180deg, rgba(23, 18, 35, .82), rgba(4, 10, 8, .9)); box-shadow: 0 22px 60px rgba(0, 0, 0, .58), inset 0 1px 0 rgba(255,255,255,.08), 0 0 44px rgba(251, 113, 133, .12); backdrop-filter: blur(10px); overflow: hidden; }
    .app-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(251,113,133,.18), transparent 36%), linear-gradient(120deg, transparent, rgba(255,255,255,.06), transparent); pointer-events: none; }
    .crest { position: relative; width: 136px; height: 136px; margin: 0 auto 20px; }
    .crest .halo { position: absolute; inset: -12px; border: 1px dashed rgba(251, 113, 133, .36); border-radius: 50%; animation: pulse 3.6s ease-in-out infinite; }
    .locket { position: absolute; inset: 10px; border-radius: 52% 52% 58% 58%; background: radial-gradient(circle at 35% 25%, #fff7fb 0 4%, #fecdd3 14%, #fb7185 38%, #7f1d1d 100%); box-shadow: 0 0 34px rgba(251, 113, 133, .42), inset 0 -16px 30px rgba(64, 12, 21, .48); transform: rotate(-5deg); }
    .fang { position: absolute; top: 35px; width: 14px; height: 36px; background: linear-gradient(#fff, #fce7f3); clip-path: polygon(20% 0, 80% 0, 50% 100%); filter: drop-shadow(0 4px 3px rgba(0,0,0,.28)); }
    .fang.left { left: 45px; } .fang.right { right: 45px; }
    .wolf-moon { position: absolute; width: 44px; height: 44px; border-radius: 50%; right: 9px; bottom: 8px; background: #dbeafe; box-shadow: 0 0 20px rgba(191, 219, 254, .7); }
    .wolf-moon::after { content:""; position:absolute; inset:0 0 0 12px; border-radius:50%; background:#5b2138; }
    .title { position: relative; margin: 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: clamp(1.8rem, 8vw, 2.55rem); line-height: .98; text-shadow: 0 2px 0 #3f0f1b, 0 0 22px rgba(251,113,133,.34); }
    .subtitle { position: relative; margin: 11px 0 0; color: #fecdd3; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .92rem; }
    .mode-note { position: relative; margin: 12px auto 18px; max-width: 29ch; color: var(--mist); line-height: 1.35; font-size: 1.02rem; }
    .primary-btn, .restart-btn { position: relative; width: 100%; min-height: 54px; border: 0; border-radius: 18px; background: linear-gradient(135deg, #fb7185, #7c3aed 55%, #0f766e); box-shadow: 0 12px 28px rgba(251, 113, 133, .25), inset 0 1px 0 rgba(255,255,255,.3); font-weight: 700; letter-spacing: .11em; text-transform: uppercase; cursor: pointer; }
    .primary-btn:active, .restart-btn:active, .choice-btn:active { transform: translateY(2px) scale(.99); }
    .mini-row { position: relative; display:flex; gap: 8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top: 12px; color: rgba(255,255,255,.7); font-size: .88rem; }
    .pill, .sound-toggle { border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 6px 10px; background: rgba(255,255,255,.06); cursor:pointer; }
    .sound-toggle.off { opacity: .58; }
    .media-feedback-layer { position: fixed; inset: 0; z-index: 25; pointer-events:none; }
    .reaction-gif { position:absolute; right:12px; width:min(32vw,118px); border-radius:18px; border:1px solid rgba(255,255,255,.16); box-shadow:0 14px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(8px) scale(.94); transition:.22s ease; mix-blend-mode:screen; }
    .reaction-gif.show { opacity:.9; transform:translateY(0) scale(1); }
    .reaction-gif-positive { top: calc(76px + var(--safe-top)); } .reaction-gif-negative { bottom: calc(120px + var(--safe-bottom)); }
    .header { z-index: 4; min-height: calc(86px + var(--safe-top)); padding: calc(12px + var(--safe-top)) 12px 10px; display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 10px; align-items: center; background: linear-gradient(180deg, rgba(3,7,18,.88), rgba(3,7,18,.52)); border-bottom: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); }
    .header-icon { width:48px; height:48px; border-radius:18px; display:grid; place-items:center; background: linear-gradient(135deg, rgba(251,113,133,.28), rgba(124,58,237,.25)); border:1px solid rgba(255,255,255,.18); font-size: 1.45rem; }
    .header-name { font-family: var(--display); letter-spacing:.08em; font-size: 1.02rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .header-status { color:#fecdd3; font-size:.96rem; margin-top:2px; }
    .sync-shell { grid-column: 1 / -1; height: 11px; background: rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.12); border-radius:999px; overflow:hidden; }
    .sync-bar { width:50%; height:100%; background:linear-gradient(90deg, #7c3aed, #fb7185); transition: width .28s ease, background .28s ease; }
    .chat-log { position:relative; z-index:2; flex:1; overflow-y:auto; padding: 16px 12px 10px; scroll-behavior:smooth; }
    .spacer { height: 4px; }
    .msg-bubble { max-width: 86%; margin: 0 0 10px; padding: 12px 13px; border-radius: 20px; line-height:1.28; font-size: 1.04rem; box-shadow: 0 10px 22px rgba(0,0,0,.18); animation: slideUp .2s ease-out; white-space: pre-wrap; }
    .msg-ai { margin-right:auto; background: linear-gradient(180deg, rgba(252,231,243,.14), rgba(124,58,237,.12)); border:1px solid rgba(252,231,243,.18); border-top-left-radius:6px; }
    .msg-user { margin-left:auto; background: linear-gradient(135deg, rgba(251,113,133,.9), rgba(124,58,237,.78)); border-top-right-radius:6px; }
    .typing-area { z-index:3; min-height: 31px; padding-left: 13px; opacity:0; transition:opacity .15s; pointer-events:none; }
    .typing-pill { display:inline-flex; gap:5px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.1); }
    .typing-dot { width:6px; height:6px; border-radius:50%; background:#fecdd3; animation: typing .8s infinite; } .typing-dot:nth-child(2){animation-delay:.12s}.typing-dot:nth-child(3){animation-delay:.24s}
    .footer { z-index: 4; padding: 10px 12px calc(12px + var(--safe-bottom)); background: linear-gradient(0deg, rgba(2,6,23,.92), rgba(2,6,23,.5)); border-top: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); }
    .choices-container { display:flex; flex-direction:column; gap:9px; }
    .choice-btn { min-height: 48px; border: 1px solid rgba(252, 231, 243, .22); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.06)); text-align:left; padding: 11px 14px; line-height:1.18; cursor:pointer; box-shadow: 0 8px 20px rgba(0,0,0,.16); }
    .choice-btn::before { content: "✧ "; color:#fda4af; }
    .end-icon { position:relative; font-size: 3.1rem; filter: drop-shadow(0 0 18px rgba(251,113,133,.45)); }
    .end-title { position:relative; margin: 8px 0; font-family: var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:1.65rem; }
    .end-title.win { color:#fecdd3; } .end-title.lose { color:#fca5a5; }
    .end-msg { position:relative; color: var(--mist); font-size:1.05rem; line-height:1.34; }
    .particle { position: fixed; pointer-events:none; z-index:55; font-size:22px; animation: float 1s linear forwards; text-shadow:0 0 14px rgba(255,255,255,.42); }
    .glitch-effect { animation: shake .42s; }
    @keyframes rain { to { transform: translateY(72px); } }
    @keyframes drift { 0%{transform:translateX(-12%)} 100%{transform:translateX(42%)} }
    @keyframes glimmer { from{opacity:.11; transform:translateY(0)} to{opacity:.25; transform:translateY(-8px)} }
    @keyframes pulse { 0%,100%{transform:scale(.98); opacity:.4} 50%{transform:scale(1.06); opacity:.9} }
    @keyframes slideUp { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes typing { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes float { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-95px) scale(1.45);opacity:0} }
    @keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-2px,1px)} 40%{transform:translate(3px,-1px)} 60%{transform:translate(-1px,2px)} 80%{transform:translate(2px,1px)} }
    @media (min-aspect-ratio: 9/16) and (max-width: 700px) { .app-card { width:min(86vw,390px); } .msg-bubble{font-size:1rem} }
    @media (max-width: 360px) { .title{font-size:1.55rem}.choice-btn{font-size:.95rem}.header-name{font-size:.92rem} }
  </style>
</head>
<body>
  <div class="forest" aria-hidden="true"><div class="moon"></div><div class="cloud a"></div><div class="cloud b"></div><div class="trees"></div><div class="ground"></div><div class="rain"></div><div class="sparkles"></div></div>
  <div class="media-feedback-layer" aria-hidden="true">
    <img id="reaction-gif-positive" class="reaction-gif reaction-gif-positive" src="https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp" alt="" loading="eager" decoding="async">
    <img id="reaction-gif-negative" class="reaction-gif reaction-gif-negative" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="" loading="eager" decoding="async">
  </div>
  <main id="start-screen" class="screen center-screen">
    <section class="app-card" aria-labelledby="game-title">
      <div class="crest" aria-hidden="true"><div class="halo"></div><div class="locket"></div><div class="fang left"></div><div class="fang right"></div><div class="wolf-moon"></div></div>
      <h1 id="game-title" class="title">Moonlit Pact</h1>
      <p class="subtitle">Rain at Forks-ish High</p>
      <p class="mode-note">Text your immortal crush, manage the Yearning Meter, and survive one aggressively damp supernatural love triangle.</p>
      <button id="btn-start" class="primary-btn">Begin Forbidden Chat</button>
      <div class="mini-row"><span class="pill">Portrait ready</span><span id="sound-toggle" class="sound-toggle">Sound: ON</span></div>
    </section>
  </main>
  <section id="game-screen" class="screen hidden" aria-label="Moonlit Pact dialogue">
    <header class="header">
      <div class="header-icon" aria-hidden="true">🩸</div>
      <div class="header-copy"><div class="header-name">E.L.I.A.S. // eternal hallway lurker</div><div class="header-status">Yearning Meter: <span id="sync-val">50</span>%</div></div>
      <div class="sync-shell" aria-hidden="true"><div id="sync-bar" class="sync-bar"></div></div>
    </header>
    <div id="chat-log" class="chat-log"><div class="spacer"></div></div>
    <div id="typing-area" class="typing-area"><div class="typing-pill"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>
    <footer class="footer"><div id="choices-container" class="choices-container"></div></footer>
  </section>
  <section id="end-screen" class="screen center-screen hidden">
    <section class="app-card"><div id="end-icon" class="end-icon">🌙</div><h2 id="end-title" class="end-title">Pact Sealed</h2><p id="end-msg" class="end-msg">The yearning survived the rain.</p><button id="btn-restart" class="restart-btn">Replay the Melodrama</button></section>
  </section>
  <script>
    const CONFIG = { startSync: 50, winSync: 100, loseSync: 0, typingSpeedBase: 520, typingSpeedVariance: 260 };
    const DIALOGUE = [
      { id:0, text:"A silver Volvo idles outside the cafeteria. E.L.I.A.S. texts: 'Do not look at me like that. I am tragically calibrated for distance.'", choices:[
        {text:"Then stop sparkling directly in my emotional blind spot.", sync:10, next:1},
        {text:"Cool. I only date people with a pulse and hobbies.", sync:-15, next:2},
        {text:"Is this a safety warning or a dramatic diary entry?", sync:-5, next:1}] },
      { id:1, text:"Rain taps the windows like a judgmental chorus. He admits your heartbeat is 'loud, inconvenient, and frankly over-written.'", choices:[
        {text:"My heartbeat also has excellent taste.", sync:10, next:3},
        {text:"That is not romantic; that is a medical privacy issue.", sync:-10, next:2},
        {text:"Tell it to behave. I am busy choosing danger.", sync:15, next:3}] },
      { id:2, text:"A wolfish rival named JACE jogs by shirtless despite the freezing rain. The triangle becomes geometrically exhausting.", choices:[
        {text:"Everyone put on a jacket and use words.", sync:5, next:3},
        {text:"I reject the entire weather-based dating economy.", sync:-20, next:99},
        {text:"Reset the scene. I can brood more politely.", sync:0, next:1}] },
      { id:3, text:"E.L.I.A.S. confesses he has watched over you from a respectful, legally ambiguous distance. The forest sighs in italics.", choices:[
        {text:"Let us call it destiny and never mention zoning laws.", sync:15, next:4},
        {text:"Boundaries are hotter than immortality.", sync:-5, next:4},
        {text:"I appreciate the angst, but text before appearing in trees.", sync:10, next:4}] },
      { id:4, text:"He says every immortal instinct tells him to leave. Naturally, he has moved one inch closer under a cedar branch.", choices:[
        {text:"The branch ships us. I can tell.", sync:15, next:5},
        {text:"I, too, make bad choices near landscaping.", sync:5, next:5},
        {text:"Stay, but do not monologue longer than the thunder.", sync:10, next:5}] },
      { id:5, text:"JACE texts a moon emoji. E.L.I.A.S. sends one period. The supernatural love triangle reaches peak punctuation.", choices:[
        {text:"Choose me by using a complete sentence.", sync:20, next:6},
        {text:"I need a group chat and possibly a counselor.", sync:5, next:6},
        {text:"No. Keep this as study hall, not destiny hall.", sync:-20, next:2}] },
      { id:6, text:"You meet in the rain-soaked forest clearing. He offers eternal longing, mediocre prom plans, and one very cold hand.", choices:[
        {text:"Cold hands, warm melodrama. Acceptable.", sync:10, next:7},
        {text:"The clearing is nice, but the lighting is doing too much.", sync:0, next:7},
        {text:"Take my hand before the soundtrack changes key.", sync:20, next:7}] },
      { id:7, text:"Warning: Yearning Meter near maximum. The moon, the wolf boy, and the school gossip blog are all watching.", choices:[
        {text:"Let them watch. I brought lip gloss and consequences.", sync:15, next:8},
        {text:"Back off. This is moving faster than vampire baseball.", sync:-10, next:5},
        {text:"I choose this ridiculous immortal ache.", sync:20, next:8}] },
      { id:8, text:"E.L.I.A.S. whispers, 'This was forbidden.' You reply, correctly, that forbidden things should not be this well-lit by moonbeams.", choices:[
        {text:"Seal the pact, sparkly disaster.", sync:100, next:'WIN'},
        {text:"Slow down. I want a sequel, not an epilogue.", sync:-10, next:5}] }
    ];
    const MEDIA = { audio:{ start:"https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3", uiClick:"https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3", success:"https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3", fail:"https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3", messageIn:"https://gamezone-virid.vercel.app/assets/audios/sfx/forest_npc_01.mp3", messageOut:"https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3", win:"https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3", lose:"https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3", warning:"https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3", bgm:"https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" } };
    let state = { sync: CONFIG.startSync, currentNodeId:0, soundOn:true, isTyping:false, audioUnlocked:false };
    const screens = { start:document.getElementById('start-screen'), game:document.getElementById('game-screen'), end:document.getElementById('end-screen') };
    const ui = { chatLog:document.getElementById('chat-log'), choices:document.getElementById('choices-container'), typing:document.getElementById('typing-area'), syncVal:document.getElementById('sync-val'), syncBar:document.getElementById('sync-bar'), soundBtn:document.getElementById('sound-toggle'), endTitle:document.getElementById('end-title'), endMsg:document.getElementById('end-msg'), endIcon:document.getElementById('end-icon'), reactionPositive:document.getElementById('reaction-gif-positive'), reactionNegative:document.getElementById('reaction-gif-negative') };
    let audioEngine=null, activeReactionTimer=null, typingTimer=null, nodeAdvanceTimer=null, endTimer=null;
    function createAudioEngine(){ const assets={start:{src:MEDIA.audio.start,volume:.42},uiClick:{src:MEDIA.audio.uiClick,volume:.32},success:{src:MEDIA.audio.success,volume:.45},fail:{src:MEDIA.audio.fail,volume:.45},messageIn:{src:MEDIA.audio.messageIn,volume:.24},messageOut:{src:MEDIA.audio.messageOut,volume:.3},win:{src:MEDIA.audio.win,volume:.55},lose:{src:MEDIA.audio.lose,volume:.54},warning:{src:MEDIA.audio.warning,volume:.26}}; const sounds=Object.fromEntries(Object.entries(assets).map(([k,c])=>{const a=new Audio(c.src);a.preload='auto';a.volume=c.volume;return[k,a]})); const bgm=new Audio(MEDIA.audio.bgm); bgm.loop=true; bgm.preload='auto'; bgm.volume=.18; function playOneShot(k){ if(!state.soundOn||!state.audioUnlocked)return; const s=sounds[k]; if(!s)return; try{s.currentTime=0; const p=s.play(); if(p&&p.catch)p.catch(()=>{});}catch(e){} } function startLoop(){ if(!state.soundOn||!state.audioUnlocked||!bgm.paused)return; try{const p=bgm.play(); if(p&&p.catch)p.catch(()=>{});}catch(e){} } function stopLoop(){ try{bgm.pause(); bgm.currentTime=0;}catch(e){} } async function unlock(){ if(state.audioUnlocked)return; state.audioUnlocked=true; try{bgm.muted=true; await bgm.play(); bgm.pause(); bgm.currentTime=0; bgm.muted=false;}catch(e){} } function syncToggle(){ if(!state.soundOn){try{bgm.pause()}catch(e){}} else if(!screens.end.classList.contains('hidden')){} else startLoop(); } return {playOneShot,startLoop,stopLoop,unlock,syncToggle}; }
    function clearTimers(){ [typingTimer,nodeAdvanceTimer,endTimer,activeReactionTimer].forEach(t=>{if(t)clearTimeout(t)}); typingTimer=nodeAdvanceTimer=endTimer=activeReactionTimer=null; }
    function init(){ audioEngine=createAudioEngine(); document.getElementById('btn-start').addEventListener('click',startGame); document.getElementById('btn-restart').addEventListener('click',restartGame); ui.soundBtn.addEventListener('click',toggleSound); updateSoundUI(); showScreen('start'); }
    function updateSoundUI(){ ui.soundBtn.textContent=`Sound: ${state.soundOn?'ON':'OFF'}${state.audioUnlocked?'':' · tap arms audio'}`; ui.soundBtn.classList.toggle('off',!state.soundOn); }
    async function ensureAudioUnlocked(){ if(audioEngine) await audioEngine.unlock(); updateSoundUI(); }
    function toggleSound(){ state.soundOn=!state.soundOn; updateSoundUI(); if(audioEngine){audioEngine.playOneShot('uiClick'); audioEngine.syncToggle();} }
    function showScreen(name){ clearTimers(); Object.values(screens).forEach(s=>s.classList.add('hidden')); screens[name].classList.remove('hidden'); if(name==='start'){hideReactionGifs(); if(audioEngine)audioEngine.startLoop(); return;} if(name==='game'){state.sync=CONFIG.startSync; state.currentNodeId=0; ui.chatLog.innerHTML='<div class="spacer"></div>'; hideReactionGifs(); updateSyncUI(); if(audioEngine)audioEngine.startLoop(); processNode(0); return;} if(audioEngine)audioEngine.stopLoop(); }
    function updateSyncUI(){ const v=Math.round(state.sync); ui.syncVal.textContent=v; ui.syncBar.style.width=`${Math.max(0,Math.min(100,state.sync))}%`; if(state.sync<30){ui.syncBar.style.background='#b91c1c'; ui.syncBar.style.boxShadow='0 0 14px rgba(239,68,68,.5)';} else if(state.sync>80){ui.syncBar.style.background='linear-gradient(90deg,#fb7185,#fce7f3)'; ui.syncBar.style.boxShadow='0 0 14px rgba(251,113,133,.62)';} else {ui.syncBar.style.background='linear-gradient(90deg,#7c3aed,#fb7185,#0f766e)'; ui.syncBar.style.boxShadow='none';} document.body.dataset.yearning=v; }
    function spawnParticle(x,y,type){ const p=document.createElement('div'); p.className='particle'; p.textContent=type==='love'?'💘':'🖤'; p.style.left=x+'px'; p.style.top=y+'px'; document.body.appendChild(p); setTimeout(()=>p.remove(),1000); }
    function triggerShake(){ document.body.classList.add('glitch-effect'); setTimeout(()=>document.body.classList.remove('glitch-effect'),420); if(navigator.vibrate) navigator.vibrate(160); }
    function hideReactionGifs(){ ui.reactionPositive.classList.remove('show'); ui.reactionNegative.classList.remove('show'); }
    function flashReaction(type){ hideReactionGifs(); const target=type==='positive'?ui.reactionPositive:ui.reactionNegative; target.classList.add('show'); activeReactionTimer=setTimeout(()=>target.classList.remove('show'),1350); }
    function addMessage(text,sender){ const div=document.createElement('div'); div.className=`msg-bubble ${sender==='ai'?'msg-ai':'msg-user'}`; div.textContent=text; ui.chatLog.appendChild(div); ui.chatLog.scrollTop=ui.chatLog.scrollHeight; if(audioEngine) audioEngine.playOneShot(sender==='ai'?'messageIn':'messageOut'); }
    function processNode(id){ if(id==='WIN'||state.sync>=100){endGame(true);return;} if(state.sync<=0){endGame(false);return;} const node=DIALOGUE.find(n=>n.id===id); if(!node){endGame(false);return;} ui.choices.innerHTML=''; ui.typing.style.opacity='1'; if(audioEngine&&state.sync>80) audioEngine.playOneShot('warning'); const delay=CONFIG.typingSpeedBase+(Math.random()*CONFIG.typingSpeedVariance)+(node.text.length*7); typingTimer=setTimeout(()=>{ui.typing.style.opacity='0'; addMessage(node.text,'ai'); nodeAdvanceTimer=setTimeout(()=>renderChoices(node.choices),420);},delay); }
    function renderChoices(choices){ ui.choices.innerHTML=''; choices.forEach(choice=>{const btn=document.createElement('button'); btn.className='choice-btn'; btn.textContent=choice.text; btn.onclick=e=>handleChoice(choice,e); ui.choices.appendChild(btn);}); }
    function handleChoice(choice,event){ addMessage(choice.text,'user'); ui.choices.innerHTML=''; const prevSync=state.sync; state.sync=Math.max(0,Math.min(100,state.sync+choice.sync)); updateSyncUI(); const rect=event.currentTarget.getBoundingClientRect(); if(state.sync>prevSync){spawnParticle(rect.left+rect.width/2,rect.top,'love'); flashReaction('positive'); if(audioEngine)audioEngine.playOneShot(choice.sync>=15?'success':'uiClick');} else if(state.sync<prevSync){spawnParticle(rect.left+rect.width/2,rect.top,'break'); flashReaction('negative'); triggerShake(); if(audioEngine)audioEngine.playOneShot('fail');} else if(audioEngine) audioEngine.playOneShot('uiClick'); nodeAdvanceTimer=setTimeout(()=>processNode(choice.next),500); }
    function endGame(win){ endTimer=setTimeout(()=>{showScreen('end'); hideReactionGifs(); if(win){ui.endTitle.textContent='PACT SEALED'; ui.endMsg.textContent='The rain applauds. The triangle sulks. Your Yearning Meter survived forbidden attraction with theatrical dignity.'; ui.endIcon.textContent='💍'; ui.endTitle.className='end-title win'; ui.reactionPositive.classList.add('show'); if(audioEngine)audioEngine.playOneShot('win');} else {ui.endTitle.textContent='MOOD COLLAPSED'; ui.endMsg.textContent='The meter fell to zero, the forest unfollowed you, and E.L.I.A.S. retreated into premium brooding.'; ui.endIcon.textContent='🌧️'; ui.endTitle.className='end-title lose'; ui.reactionNegative.classList.add('show'); if(audioEngine)audioEngine.playOneShot('lose');}},900); }
    async function startGame(){ await ensureAudioUnlocked(); if(audioEngine){audioEngine.playOneShot('start'); audioEngine.startLoop();} showScreen('game'); }
    async function restartGame(){ await ensureAudioUnlocked(); if(audioEngine){audioEngine.playOneShot('uiClick'); audioEngine.startLoop();} showScreen('start'); }
    window.addEventListener('load', init);
  </script>
</body>
</html>
