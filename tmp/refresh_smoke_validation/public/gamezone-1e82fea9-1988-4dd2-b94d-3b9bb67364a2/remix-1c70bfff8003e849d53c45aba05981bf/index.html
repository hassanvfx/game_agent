<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Boardwalk Style Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
<style>
    :root {
        --pink: #ff92c5;
        --pink-dark: #ff5ca8;
        --pink-bright: #ffd2ef;
        --panel-bg: rgba(255, 249, 253, 0.84);
        --panel-edge: rgba(255, 255, 255, 0.72);
        --text-dark: #4d3d62;
        --text-soft: #725b8f;
        --shadow-soft: 0 10px 30px rgba(69, 26, 88, 0.18);
        --shadow-glow: 0 0 22px rgba(255, 126, 185, 0.24);
        --aqua: #6df2f6;
        --sun: #ffd86b;
        --sky-top: #82d7ff;
        --sky-mid: #c3f0ff;
        --sand-light: #fff4d4;
        --sand-dark: #f7d9aa;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 35%),
            linear-gradient(180deg, #eaf9ff 0%, #fff2e6 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    body {
        color: var(--text-dark);
        letter-spacing: 0.01em;
    }

    canvas {
        display: block;
        touch-action: none;
        width: 100%;
        height: 100%;
    }

    button {
        font-family: inherit;
        font-size: inherit;
        border: 0;
        cursor: pointer;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.94), var(--panel-bg));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--panel-edge);
        border-left: 1px solid rgba(255, 255, 255, 0.35);
        border-right: 1px solid rgba(255, 255, 255, 0.35);
    }

    .hidden { display: none !important; }

    .btn-press { transition: transform 0.1s; }
    .btn-press:active { transform: scale(0.95); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .tab-active {
        background: linear-gradient(180deg, var(--pink), var(--pink-dark));
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(255, 92, 168, 0.28);
    }

    .tab-inactive {
        background: rgba(255, 255, 255, 0.9);
        color: var(--text-soft);
        box-shadow: inset 0 0 0 1px rgba(255, 146, 197, 0.16);
    }

    .item-card {
        border: 3px solid transparent;
        transition: all 0.2s;
    }

    .item-card.selected {
        border-color: var(--pink);
        transform: scale(1.05);
        background-color: #FFF0F5;
    }

    .page {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        background:
            radial-gradient(circle at 50% 14%, rgba(255,255,255,0.8), rgba(255,255,255,0) 24%),
            linear-gradient(180deg, #95deff 0%, #d8f8ff 40%, #ffe8c6 100%);
    }

    .page::before,
    .page::after {
        content: '';
        position: absolute;
        pointer-events: none;
        z-index: 1;
    }

    .page::before {
        inset: 0;
        background:
            radial-gradient(circle at 18% 18%, rgba(255,255,255,0.55) 0 3px, transparent 4px),
            radial-gradient(circle at 78% 26%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
            radial-gradient(circle at 40% 10%, rgba(255,255,255,0.32) 0 2px, transparent 3px);
        opacity: 0.75;
    }

    .page::after {
        left: 0;
        right: 0;
        bottom: 37%;
        height: 12px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
        filter: blur(10px);
        opacity: 0.8;
    }

    .ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .hud {
        position: absolute;
        top: 1rem;
        right: 1rem;
        pointer-events: auto;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        z-index: 2;
    }

    .hint-chip,
    .look-meter {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 240, 249, 0.92));
        color: #7c3f66;
        border-radius: 999px;
        box-shadow: var(--shadow-soft);
        border: 1px solid rgba(255, 146, 197, 0.35);
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    .hint-chip {
        padding: 0.7rem 1rem;
        max-width: min(60vw, 260px);
    }

    .look-meter {
        padding: 0.68rem 0.9rem;
        font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: var(--pink-dark);
    }

    .photo-btn {
        background: linear-gradient(180deg, #fff9ff, #ffe0f0);
        color: var(--pink-dark);
        border-radius: 999px;
        padding: 0.85rem;
        box-shadow: var(--shadow-soft), var(--shadow-glow);
        border: 1px solid rgba(255, 146, 197, 0.32);
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .photo-btn svg {
        width: 1.5rem;
        height: 1.5rem;
        filter: drop-shadow(0 1px 0 rgba(255,255,255,0.55));
    }

    .editor-panel {
        width: 100%;
        height: 40%;
        border-radius: 1.5rem 1.5rem 0 0;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        box-shadow: 0 -10px 26px rgba(55, 29, 87, 0.16);
        transition: transform 0.3s;
        transform: translateY(0);
        position: relative;
        overflow: hidden;
    }

    .editor-panel::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--aqua), var(--pink), var(--sun));
        opacity: 0.95;
    }

    .translate-y-full { transform: translateY(100%); }

    .panel-header {
        padding: 1rem 1rem 0.4rem;
        text-align: center;
        position: relative;
        z-index: 1;
    }

    .panel-title,
    .overlay-title,
    .feedback-label {
        margin: 0;
        font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.06em;
        font-weight: 700;
        text-transform: uppercase;
    }

    .panel-title {
        color: var(--pink-dark);
        font-size: clamp(1.45rem, 4vw, 1.95rem);
        text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    }

    .panel-subtitle {
        margin: 0.25rem 0 0;
        font-size: 0.92rem;
        color: var(--text-soft);
        font-weight: 600;
    }

    .tabs {
        display: flex;
        justify-content: space-around;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem 0.2rem;
    }

    .tab-btn {
        padding: 0.65rem 0.95rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.86rem;
        min-width: 0;
        flex: 1;
        letter-spacing: 0.04em;
    }

    .item-grid {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
        align-content: start;
    }

    .item-card {
        aspect-ratio: 1 / 1;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff, #fff4fb);
        box-shadow: 0 6px 14px rgba(75, 61, 98, 0.09);
    }

    .swatch {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.92);
        box-shadow: 0 0 0 1px rgba(77, 61, 98, 0.16), inset 0 0 8px rgba(255,255,255,0.45);
    }

    .empty-label {
        font-size: 0.75rem;
        color: #9ca3af;
        font-weight: 600;
    }

    .photo-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
    }

    .overlay-card {
        position: relative;
        background: linear-gradient(180deg, #fffefe, #fff2fa);
        padding: 1.5rem;
        border-radius: 1.25rem;
        box-shadow: 0 25px 50px rgba(37, 16, 56, 0.28);
        text-align: center;
        width: min(90vw, 340px);
        border: 1px solid rgba(255,255,255,0.65);
        animation: bounce-in 0.45s ease-out;
        overflow: hidden;
    }

    .overlay-title {
        font-size: clamp(1.75rem, 6vw, 2.2rem);
        color: var(--pink-dark);
        margin-bottom: 0.4rem;
    }

    .overlay-text {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        color: var(--text-soft);
        font-weight: 600;
    }

    .overlay-button {
        background: linear-gradient(180deg, var(--pink), var(--pink-dark));
        color: white;
        padding: 0.9rem 1.5rem;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: var(--shadow-soft);
    }

    .feedback-gif {
        width: min(52vw, 180px);
        max-height: 120px;
        object-fit: cover;
        border-radius: 1rem;
        border: 2px solid rgba(255,255,255,0.78);
        box-shadow: 0 12px 24px rgba(55, 29, 87, 0.18);
        background: rgba(255,255,255,0.45);
    }

    .overlay-gif {
        margin: 0 auto 0.85rem;
        display: block;
    }

    .live-feedback {
        position: absolute;
        left: 1rem;
        bottom: calc(40% + 1rem);
        z-index: 3;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        max-width: min(42vw, 220px);
        opacity: 0;
        transform: translateY(12px) scale(0.96);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .live-feedback.show {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .feedback-card {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.7rem;
        border-radius: 1rem;
        background: rgba(255, 252, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 10px 24px rgba(55, 29, 87, 0.2);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .feedback-label {
        font-size: 0.78rem;
        color: var(--pink-dark);
    }

    .feedback-copy {
        font-size: 0.82rem;
        color: var(--text-soft);
        font-weight: 600;
    }

    @keyframes bounce-in {
        0% { transform: scale(0.85); opacity: 0; }
        60% { transform: scale(1.04); opacity: 1; }
        100% { transform: scale(1); }
    }

    @media (max-width: 520px) {
        .hud {
            top: 0.75rem;
            right: 0.75rem;
            left: 0.75rem;
            justify-content: space-between;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .hint-chip {
            max-width: 100%;
            font-size: 0.82rem;
            padding: 0.6rem 0.85rem;
            order: 3;
            width: 100%;
        }

        .look-meter {
            font-size: 0.72rem;
            padding: 0.55rem 0.75rem;
        }

        .tab-btn {
            font-size: 0.78rem;
            padding: 0.6rem 0.35rem;
        }

        .editor-panel { height: 42%; }

        .live-feedback {
            left: 0.75rem;
            bottom: calc(42% + 0.75rem);
            max-width: 43vw;
        }

        .feedback-gif {
            width: 100%;
            max-height: 88px;
        }
    }
</style>
</head>
<body>

<!-- Assets -->
<div id="assets" style="display: none;">
    <audio id="bgm_main" data-editable="audio" data-label="Boardwalk Ambient Loop" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_click" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_select" data-editable="audio" data-label="Look Saved" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_overlay_open" data-editable="audio" data-label="Menu Open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>
    <audio id="sfx_overlay_close" data-editable="audio" data-label="Menu Close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "skinColor": { "type": "color", "label": "Skin Color", "value": "#FFE0BD" },
    "bgColorTop": { "type": "color", "label": "Sky Color", "value": "#87CEEB" },
    "bgColorBottom": { "type": "color", "label": "Sand Color", "value": "#FFF8DC" }
}
</script>

<!-- Game Container -->
<div id="game-container" class="page">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Rajdhani from catalogs/fonts.json -->
    <!-- [agent-note][stage3] resolved-audio: ui + overlay + ambience loop -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: style-feedback + snapshot celebration -> catalogs/gifs.json -->
    <div id="live-feedback" class="live-feedback" aria-hidden="true">
        <div class="feedback-card">
            <img
                id="feedback-gif"
                class="feedback-gif"
                alt="Style reaction"
                src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp"
            >
            <div id="feedback-label" class="feedback-label">Style Glow</div>
            <div id="feedback-copy" class="feedback-copy">Fresh combo picked.</div>
        </div>
    </div>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="ui-layer">
        
        <!-- HUD: Snapshot Button -->
        <div id="hud" class="hud">
            <div id="look-meter" class="look-meter">Look meter 25%</div>
            <div class="hint-chip">Pick a lane, build a look, then tap the camera for a boardwalk snapshot.</div>
            <button id="photo-btn" class="photo-btn btn-press" aria-label="Open snapshot mode">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <!-- Editor Panel -->
        <div id="editor-panel" class="editor-panel glass">
            <div class="panel-header">
                <h1 class="panel-title">Boardwalk Style Studio</h1>
                <p class="panel-subtitle">Mix hair, tops, bottoms, and extras to stage the perfect beach-day outfit.</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn tab-active" data-cat="hair">Hair</button>
                <button class="tab-btn tab-inactive" data-cat="top">Top</button>
                <button class="tab-btn tab-inactive" data-cat="bottom">Bottom</button>
                <button class="tab-btn tab-inactive" data-cat="acc">Extras</button>
            </div>

            <!-- Grid -->
            <div id="item-grid" class="item-grid no-scrollbar">
                <!-- Items injected by JS -->
            </div>
        </div>

        <!-- Snapshot Overlay (Hidden by default) -->
        <div id="photo-overlay" class="photo-overlay hidden">
            <div class="overlay-card">
                <img
                    class="feedback-gif overlay-gif"
                    alt="Celebration reaction"
                    src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
                >
                <h2 class="overlay-title">Snapshot Ready!</h2>
                <p class="overlay-text">Your boardwalk look is set. Jump back in to try another combo.</p>
                <button id="back-btn" class="overlay-button btn-press">
                    Keep Styling
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §0 System Invariants & Config
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, PHOTO
let lastTime = 0;

// Config
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(window.gameConfigDefs).map(([k, v]) => [k, v.value]));

/**
 * §1 Audio System
 */
const bgmElement = document.getElementById('bgm_main');
const audioElements = {
    click: document.getElementById('sfx_click'),
    select: document.getElementById('sfx_select'),
    overlayOpen: document.getElementById('sfx_overlay_open'),
    overlayClose: document.getElementById('sfx_overlay_close')
};
const audioState = {
    unlocked: false,
    bgmStarted: false,
    sfxLastPlayed: {}
};

bgmElement.volume = 0.2;

Object.entries(audioElements).forEach(([key, el]) => {
    el.volume = key === 'click' ? 0.35 : 0.42;
});

function initAudio() {
    Object.values(audioElements).forEach((audio) => {
        audio.load();
    });
    bgmElement.load();
}

function unlockAudio() {
    if (!audioState.unlocked) {
        audioState.unlocked = true;
    }
    startBgm();
}

function startBgm() {
    if (!audioState.unlocked || audioState.bgmStarted) return;
    audioState.bgmStarted = true;
    bgmElement.currentTime = 0;
    bgmElement.play().catch(() => {
        audioState.bgmStarted = false;
    });
}

function pauseBgm() {
    bgmElement.pause();
    audioState.bgmStarted = false;
}

function playSfx(id, cooldown = 120) {
    if (!audioState.unlocked) return;
    const now = performance.now();
    if (audioState.sfxLastPlayed[id] && now - audioState.sfxLastPlayed[id] < cooldown) return;
    audioState.sfxLastPlayed[id] = now;
    const audio = audioElements[id];
    if (!audio) return;
    try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch (err) {
        // non-blocking audio failure
    }
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 50 : 20);
    }
}

/**
 * §2 Game Logic & State
 */

// Dress Up Data
const CATALOG = {
    hair: [
        { id: 'h0', color: '#8B4513', type: 'long', name: 'Brunette' },
        { id: 'h1', color: '#FFD700', type: 'bob', name: 'Blonde' },
        { id: 'h2', color: '#FF69B4', type: 'pigtails', name: 'Pink' },
        { id: 'h3', color: '#000000', type: 'long', name: 'Black' },
        { id: 'h4', color: '#ADD8E6', type: 'bob', name: 'Blue' },
        { id: 'h5', color: '#FFA07A', type: 'pigtails', name: 'Coral' },
        { id: 'h6', color: '#C0C0C0', type: 'long', name: 'Silver' },
        { id: 'h7', color: '#800080', type: 'bob', name: 'Purple' }
    ],
    top: [
        { id: 't0', color: '#FF69B4', type: 'bikini', name: 'Pink Bikini' },
        { id: 't1', color: '#40E0D0', type: 'tank', name: 'Teal Tank' },
        { id: 't2', color: '#FFFFFF', type: 'bikini', name: 'White Bikini' },
        { id: 't3', color: '#FFD700', type: 'tank', name: 'Yellow Tank' },
        { id: 't4', color: '#FF4500', type: 'bikini', name: 'Red Bikini' },
        { id: 't5', color: '#9370DB', type: 'tank', name: 'Purple Tank' }
    ],
    bottom: [
        { id: 'b0', color: '#FF69B4', type: 'bikini', name: 'Pink Bottom' },
        { id: 'b1', color: '#40E0D0', type: 'skirt', name: 'Teal Skirt' },
        { id: 'b2', color: '#FFFFFF', type: 'bikini', name: 'White Bottom' },
        { id: 'b3', color: '#FFD700', type: 'shorts', name: 'Yellow Shorts' },
        { id: 'b4', color: '#FF4500', type: 'bikini', name: 'Red Bottom' },
        { id: 'b5', color: '#9370DB', type: 'skirt', name: 'Purple Skirt' }
    ],
    acc: [
        { id: 'a0', type: 'none', name: 'None' },
        { id: 'a1', type: 'sunglasses', color: '#333', name: 'Shades' },
        { id: 'a2', type: 'flower', color: '#FFF', name: 'Flower' },
        { id: 'a3', type: 'hat', color: '#F5DEB3', name: 'Straw Hat' }
    ]
};

const FEEDBACK_THEMES = {
    hair: {
        label: 'Hair switch',
        copy: 'Fresh strands for the boardwalk breeze.',
        gif: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp'
    },
    top: {
        label: 'Top picked',
        copy: 'That fit adds instant promenade energy.',
        gif: 'https://i.giphy.com/WOORRezUTVbs9iST3f.webp'
    },
    bottom: {
        label: 'Bottom locked',
        copy: 'The silhouette is ready for a photo moment.',
        gif: 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp'
    },
    acc: {
        label: 'Extra sparkle',
        copy: 'Accessories sealed the vibe.',
        gif: 'https://i.giphy.com/OJVQOfitCNNkI.webp'
    }
};

let currentLook = {
    hair: CATALOG.hair[0],
    top: CATALOG.top[0],
    bottom: CATALOG.bottom[0],
    acc: CATALOG.acc[0]
};

let activeCategory = 'hair';
let charBounce = 0;
let particles = [];
let feedbackTimer = null;

const lookMeterEl = document.getElementById('look-meter');
const liveFeedbackEl = document.getElementById('live-feedback');
const feedbackGifEl = document.getElementById('feedback-gif');
const feedbackLabelEl = document.getElementById('feedback-label');
const feedbackCopyEl = document.getElementById('feedback-copy');

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5 - 2;
        this.life = 1.0;
        this.type = Math.random() > 0.5 ? 'heart' : 'sparkle';
        this.color = ['#fff3aa', '#ff98cf', '#7ef7ff', '#ffffff'][Math.floor(Math.random() * 4)];
        this.size = Math.random() * 10 + 5;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt * 1.5;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        if (this.type === 'heart') {
            const r = this.size;
            ctx.moveTo(this.x, this.y);
            ctx.bezierCurveTo(this.x - r / 2, this.y - r / 2, this.x - r, this.y + r / 3, this.x, this.y + r);
            ctx.bezierCurveTo(this.x + r, this.y + r / 3, this.x + r / 2, this.y - r / 2, this.x, this.y);
        } else {
            const r = this.size;
            ctx.moveTo(this.x, this.y - r);
            ctx.lineTo(this.x + r * 0.35, this.y - r * 0.35);
            ctx.lineTo(this.x + r, this.y);
            ctx.lineTo(this.x + r * 0.35, this.y + r * 0.35);
            ctx.lineTo(this.x, this.y + r);
            ctx.lineTo(this.x - r * 0.35, this.y + r * 0.35);
            ctx.lineTo(this.x - r, this.y);
            ctx.lineTo(this.x - r * 0.35, this.y - r * 0.35);
            ctx.closePath();
        }
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles() {
    for (let i = 0; i < 10; i++) {
        particles.push(new Particle(cw / 2, ch / 2));
    }
}

function getLookCompletion() {
    let score = 0;
    if (currentLook.hair) score += 25;
    if (currentLook.top) score += 25;
    if (currentLook.bottom) score += 25;
    if (currentLook.acc && currentLook.acc.type !== 'none') score += 25;
    return score;
}

function updateLookMeter() {
    lookMeterEl.textContent = `Look meter ${getLookCompletion()}%`;
}

function showFeedback(category) {
    const theme = FEEDBACK_THEMES[category] || FEEDBACK_THEMES.hair;
    feedbackGifEl.src = theme.gif;
    feedbackLabelEl.textContent = theme.label;
    feedbackCopyEl.textContent = theme.copy;
    liveFeedbackEl.classList.add('show');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        liveFeedbackEl.classList.remove('show');
    }, 1800);
}

function updateGameConfig(key, val) {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
    }
}

/**
 * §3 Drawing Logic (Procedural Character Art)
 */
function drawCharacter(ctx, x, y, scale) {
    const time = Date.now() / 1000;
    const breath = Math.sin(time * 2) * 0.02 + 1;
    const bounce = Math.sin(charBounce * Math.PI) * 0.1;
    const shimmer = Math.sin(time * 3.2) * 0.5 + 0.5;

    ctx.save();
    ctx.translate(x, y + bounce * 100);
    ctx.scale(scale * breath, scale * breath);

    // -- Back Hair --
    ctx.fillStyle = currentLook.hair.color;
    if (currentLook.hair.type === 'long') {
        ctx.beginPath();
        ctx.ellipse(0, 20, 75, 120, 0, 0, Math.PI * 2);
        ctx.fill();
    } else if (currentLook.hair.type === 'pigtails') {
        ctx.beginPath();
        ctx.arc(-60, 20, 40, 0, Math.PI * 2);
        ctx.arc(60, 20, 40, 0, Math.PI * 2);
        ctx.fill();
    }

    // -- Body (Skin) --
    ctx.fillStyle = window.gameConfig.skinColor;
    ctx.fillRect(-15, 60, 30, 30);
    ctx.beginPath();
    ctx.roundRect(-40, 80, 80, 100, 20);
    ctx.fill();
    ctx.fillRect(-35, 160, 25, 120);
    ctx.fillRect(10, 160, 25, 120);

    ctx.save();
    ctx.translate(-45, 90);
    ctx.rotate(0.2);
    ctx.roundRect(-15, 0, 30, 100, 15);
    ctx.fill();
    ctx.restore();
    
    ctx.save();
    ctx.translate(45, 90);
    ctx.rotate(-0.2);
    ctx.roundRect(-15, 0, 30, 100, 15);
    ctx.fill();
    ctx.restore();

    // -- Clothes: Bottom --
    ctx.fillStyle = currentLook.bottom.color;
    if (currentLook.bottom.type === 'bikini') {
        ctx.beginPath();
        ctx.moveTo(-35, 160);
        ctx.lineTo(35, 160);
        ctx.lineTo(0, 190);
        ctx.fill();
    } else if (currentLook.bottom.type === 'skirt') {
        ctx.beginPath();
        ctx.moveTo(-40, 150);
        ctx.lineTo(40, 150);
        ctx.lineTo(60, 220);
        ctx.lineTo(-60, 220);
        ctx.fill();
    } else if (currentLook.bottom.type === 'shorts') {
        ctx.fillRect(-40, 150, 80, 50);
        ctx.fillRect(-40, 190, 35, 30);
        ctx.fillRect(5, 190, 35, 30);
    }

    // -- Clothes: Top --
    ctx.fillStyle = currentLook.top.color;
    if (currentLook.top.type === 'bikini') {
        ctx.beginPath();
        ctx.arc(-20, 110, 20, 0, Math.PI * 2);
        ctx.arc(20, 110, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = currentLook.top.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-20, 95); ctx.lineTo(-15, 60);
        ctx.moveTo(20, 95); ctx.lineTo(15, 60);
        ctx.stroke();
    } else if (currentLook.top.type === 'tank') {
        ctx.fillRect(-40, 90, 80, 70);
        ctx.fillRect(-30, 80, 10, 20);
        ctx.fillRect(20, 80, 10, 20);
    }

    // -- Head (Skin) --
    ctx.fillStyle = window.gameConfig.skinColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, 65, 75, 0, 0, Math.PI * 2);
    ctx.fill();

    // -- Character aura --
    const aura = ctx.createRadialGradient(0, 70, 35, 0, 70, 170);
    aura.addColorStop(0, `rgba(255, 245, 170, ${0.2 + shimmer * 0.08})`);
    aura.addColorStop(0.5, `rgba(255, 146, 197, ${0.1 + shimmer * 0.08})`);
    aura.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.ellipse(0, 85, 140, 210, 0, 0, Math.PI * 2);
    ctx.fill();

    // -- Face --
    ctx.fillStyle = '#ffb8d0';
    ctx.beginPath();
    ctx.arc(-40, 10, 10, 0, Math.PI * 2);
    ctx.arc(40, 10, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2e1f45';
    ctx.beginPath();
    ctx.ellipse(-25, 0, 7, 8, 0, 0, Math.PI * 2);
    ctx.ellipse(25, 0, 7, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-22, -2, 2, 0, Math.PI * 2);
    ctx.arc(28, -2, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#7f375f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 16, 8, 0.1, Math.PI - 0.1, false);
    ctx.stroke();

    // -- Front Hair --
    ctx.fillStyle = currentLook.hair.color;
    if (currentLook.hair.type === 'long' || currentLook.hair.type === 'pigtails') {
        ctx.beginPath();
        ctx.arc(0, -30, 60, Math.PI * 0.8, Math.PI * 2.2);
        ctx.fill();
    } else if (currentLook.hair.type === 'bob') {
        ctx.beginPath();
        ctx.arc(0, -30, 65, Math.PI * 0.7, Math.PI * 2.3);
        ctx.lineTo(65, 60);
        ctx.lineTo(-65, 60);
        ctx.fill();
    }

    // -- Accessories --
    if (currentLook.acc.type === 'sunglasses') {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.roundRect(-50, -10, 45, 25, 5);
        ctx.roundRect(5, -10, 45, 25, 5);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-5, -5); ctx.lineTo(5, -5); ctx.stroke();
    } else if (currentLook.acc.type === 'flower') {
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(50, -40, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(50, -40, 5, 0, Math.PI * 2);
        ctx.fill();
    } else if (currentLook.acc.type === 'hat') {
        ctx.fillStyle = '#F5DEB3';
        ctx.beginPath();
        ctx.ellipse(0, -50, 80, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -60, 45, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#FF69B4';
        ctx.fillRect(-45, -60, 90, 10);
    }

    ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
    ctx.beginPath();
    ctx.ellipse(-18, -6, 18, 10, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawBackground(ctx) {
    const gradSky = ctx.createLinearGradient(0, 0, 0, ch * 0.62);
    gradSky.addColorStop(0, window.gameConfig.bgColorTop);
    gradSky.addColorStop(0.55, 'rgba(242, 251, 255, 1)');
    gradSky.addColorStop(1, '#fff4e6');
    ctx.fillStyle = gradSky;
    ctx.fillRect(0, 0, cw, ch);

    const sunGlow = ctx.createRadialGradient(cw * 0.82, ch * 0.18, 10, cw * 0.82, ch * 0.18, ch * 0.18);
    sunGlow.addColorStop(0, 'rgba(255, 239, 167, 0.9)');
    sunGlow.addColorStop(0.45, 'rgba(255, 213, 107, 0.38)');
    sunGlow.addColorStop(1, 'rgba(255, 213, 107, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, cw, ch);

    const time = Date.now() / 1000;
    const waveOffset1 = Math.sin(time) * 20;
    const waveOffset2 = Math.cos(time * 1.4) * 16;

    ctx.fillStyle = '#79eef5';
    ctx.beginPath();
    ctx.moveTo(0, ch * 0.55);
    ctx.quadraticCurveTo(cw * 0.25, ch * 0.53 + waveOffset1, cw * 0.5, ch * 0.57);
    ctx.quadraticCurveTo(cw * 0.75, ch * 0.6 + waveOffset2, cw, ch * 0.56);
    ctx.lineTo(cw, ch);
    ctx.lineTo(0, ch);
    ctx.fill();

    ctx.fillStyle = '#3bcad8';
    ctx.beginPath();
    ctx.moveTo(0, ch * 0.61);
    ctx.quadraticCurveTo(cw * 0.3, ch * 0.59 + waveOffset2, cw * 0.58, ch * 0.63);
    ctx.quadraticCurveTo(cw * 0.82, ch * 0.65 + waveOffset1, cw, ch * 0.62);
    ctx.lineTo(cw, ch);
    ctx.lineTo(0, ch);
    ctx.fill();

    ctx.fillStyle = window.gameConfig.bgColorBottom;
    ctx.beginPath();
    ctx.moveTo(0, ch * 0.7);
    ctx.quadraticCurveTo(cw / 2, ch * 0.66, cw, ch * 0.7);
    ctx.lineTo(cw, ch);
    ctx.lineTo(0, ch);
    ctx.fill();

    ctx.fillStyle = 'rgba(247, 217, 170, 0.32)';
    for (let i = 0; i < 9; i++) {
        const stripeX = (cw / 8) * i + ((time * 8) % 20);
        ctx.fillRect(stripeX, ch * 0.72, 8, ch * 0.28);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    const cloudX = (time * 20) % (cw + 200) - 100;
    ctx.beginPath();
    ctx.arc(cloudX, 100, 30, 0, Math.PI * 2);
    ctx.arc(cloudX + 40, 110, 40, 0, Math.PI * 2);
    ctx.arc(cloudX - 40, 110, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(cw * 0.22, ch * 0.16, 22, 0, Math.PI * 2);
    ctx.arc(cw * 0.26, ch * 0.18, 28, 0, Math.PI * 2);
    ctx.arc(cw * 0.18, ch * 0.18, 18, 0, Math.PI * 2);
    ctx.fill();
}

/**
 * §4 UI & Interaction
 */
function renderUI() {
    const grid = document.getElementById('item-grid');
    grid.innerHTML = '';
    
    const items = CATALOG[activeCategory];
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = `item-card ${currentLook[activeCategory].id === item.id ? 'selected' : ''}`;
        
        let innerHTML = '';
        if (item.color) {
            innerHTML = `<div class="swatch" style="background-color: ${item.color}"></div>`;
        } else {
            innerHTML = `<span class="empty-label">None</span>`;
        }
        
        div.innerHTML = innerHTML;
        div.onclick = (e) => {
            e.stopPropagation();
            unlockAudio();
            selectItem(item);
        };
        grid.appendChild(div);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.cat === activeCategory) {
            btn.classList.remove('tab-inactive');
            btn.classList.add('tab-active');
        } else {
            btn.classList.remove('tab-active');
            btn.classList.add('tab-inactive');
        }
    });

    updateLookMeter();
}

function selectItem(item) {
    if (currentLook[activeCategory].id === item.id) {
        playSfx('click');
        return;
    }
    currentLook[activeCategory] = item;
    playSfx('select');
    vibrate('light');
    charBounce = 1;
    spawnParticles();
    showFeedback(activeCategory);
    renderUI();
}

function setState(newState) {
    gameState = newState;
    const editor = document.getElementById('editor-panel');
    const hud = document.getElementById('hud');
    const overlay = document.getElementById('photo-overlay');

    if (newState === 'PLAYING') {
        editor.classList.remove('translate-y-full');
        hud.classList.remove('hidden');
        overlay.classList.add('hidden');
        playSfx('overlayClose', 180);
        startBgm();
    } else if (newState === 'PHOTO') {
        editor.classList.add('translate-y-full');
        hud.classList.add('hidden');
        overlay.classList.remove('hidden');
        spawnParticles();
        playSfx('overlayOpen', 180);
    }
}

function initGame() {
    if (initialized) return;
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            unlockAudio();
            activeCategory = btn.dataset.cat;
            playSfx('click');
            renderUI();
        });
    });

    document.getElementById('photo-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        setState('PHOTO');
    });

    document.getElementById('back-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        setState('PLAYING');
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            pauseBgm();
        } else if (audioState.unlocked && gameState === 'PLAYING') {
            startBgm();
        }
    });

    renderUI();
    initAudio();
    
    initialized = true;
    requestAnimationFrame(loop);
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (!cw || !ch) {
        requestAnimationFrame(loop);
        return;
    }

    if (charBounce > 0) charBounce = Math.max(0, charBounce - dt * 5);
    
    drawBackground(ctx);
    
    const charY = gameState === 'PLAYING' ? ch * 0.4 : ch * 0.5;
    const charScale = Math.min(cw, ch) / 400;
    drawCharacter(ctx, cw / 2, charY, charScale);

    particles = particles.filter((p) => {
        p.update(dt);
        p.draw(ctx);
        return p.life > 0;
    });

    requestAnimationFrame(loop);
}

/**
 * §5 Lifecycle & Resize
 */
function handleGlobalInput() {
    unlockAudio();
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('keydown', handleGlobalInput);

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initGame();
    }
}

const ro = new ResizeObserver(() => {
    resize();
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
});
</script>
</body>
