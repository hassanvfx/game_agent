<script>
/**
 * §2 Technical Contract & Core Logic
 */

// --- Global Config & State ---
window.gameConfig = {
    startMoney: 1000,
    salary: 200,
    themeColor: "#ef4444",
    gameSpeed: 1
};

// Editor Hook
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') initStyles();
    }
};

// Game State
let state = {
    screen: 'start', // start, playing, gameover
    money: 1000,
    netWorth: 1000,
    pos: 0, // 0-15
    targetPos: 0,
    isMoving: false,
    moveTimer: 0,
    properties: new Array(TILE_COUNT).fill(null).map(() => ({ level: 0, owner: null })),
    particles: [],
    popups: [],
    diceVal: 1,
    cameraShake: 0,
    gifTimer: null
};

const GIFS = {
    bonus: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp',
    fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
};

// Board Layout (16 tiles: 4x4 loop)
// 0: GO, 1-3: Bottom, 4: Jail, 5-7: Right, 8: Free Parking, 9-11: Top, 12: GoToJail, 13-15: Left
const TILE_COUNT = 16;
const TILES = [
    { type: 'corner', label: 'GO', color: '#a7f3d0' },
    { type: 'prop', label: 'B1', price: 60, rent: 10, color: '#93c5fd', group: 0 },
    { type: 'prop', label: 'B2', price: 60, rent: 15, color: '#93c5fd', group: 0 },
    { type: 'prop', label: 'B3', price: 80, rent: 20, color: '#93c5fd', group: 0 },
    { type: 'corner', label: 'JAIL', color: '#cbd5e1' },
    { type: 'prop', label: 'R1', price: 100, rent: 30, color: '#fca5a5', group: 1 },
    { type: 'prop', label: 'R2', price: 100, rent: 30, color: '#fca5a5', group: 1 },
    { type: 'prop', label: 'R3', price: 120, rent: 40, color: '#fca5a5', group: 1 },
    { type: 'corner', label: 'FREE', color: '#fde047' },
    { type: 'prop', label: 'Y1', price: 140, rent: 50, color: '#fcd34d', group: 2 },
    { type: 'prop', label: 'Y2', price: 140, rent: 50, color: '#fcd34d', group: 2 },
    { type: 'prop', label: 'Y3', price: 160, rent: 60, color: '#fcd34d', group: 2 },
    { type: 'corner', label: '->JAIL', color: '#f87171' },
    { type: 'prop', label: 'G1', price: 180, rent: 70, color: '#86efac', group: 3 },
    { type: 'prop', label: 'G2', price: 180, rent: 75, color: '#86efac', group: 3 },
    { type: 'prop', label: 'G3', price: 200, rent: 80, color: '#86efac', group: 3 }
];

// --- Audio Manager ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBuffers = {};
const audioFallbacks = {
    sfx_start: 'beep',
    sfx_click: 'beep',
    sfx_bonus: 'sparkle',
    sfx_success: 'chime',
    sfx_fail: 'noise',
    sfx_warning: 'alert',
    sfx_gameover: 'noise'
};
let audioReady = false;
let bgmStarted = false;
let lastSfxAt = 0;

async function loadSound(id) {
    const el = document.getElementById(id);
    if (!el) return;
    try {
        const response = await fetch(el.src);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (e) {
        console.warn('Audio load failed, using fallback', id);
        audioBuffers[id] = audioFallbacks[id] || 'beep';
    }
}

function playFallback(kind, volume = 0.2) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

    if (kind === 'noise') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.28);
    } else if (kind === 'alert') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(520, now + 0.08);
        osc.frequency.linearRampToValueAtTime(260, now + 0.26);
    } else if (kind === 'sparkle') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
    } else if (kind === 'chime') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.24);
    } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.18);
    }

    osc.start(now);
    osc.stop(now + 0.3);
}

function playSound(id, volume = 0.28) {
    if (!audioReady) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    const nowMs = performance.now();
    if (nowMs - lastSfxAt < 65 && id === 'sfx_click') return;
    lastSfxAt = nowMs;

    const buffer = audioBuffers[id];
    if (!buffer) return;

    if (typeof buffer === 'string') {
        playFallback(buffer, Math.min(volume, 0.22));
    } else {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = volume;
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    }
}

async function ensureAudioReady() {
    if (audioCtx.state === 'suspended') {
        try {
            await audioCtx.resume();
        } catch (e) {
            return;
        }
    }
    audioReady = true;
}

function playBGM() {
    const el = document.getElementById('bgm_main');
    if (!audioReady || !el) return;
    el.volume = 0.2;
    if (bgmStarted) return;
    bgmStarted = true;
    el.play().catch(() => {
        bgmStarted = false;
    });
}

function stopBGM() {
    const el = document.getElementById('bgm_main');
    if (!el) return;
    el.pause();
    el.currentTime = 0;
    bgmStarted = false;
}

function syncBGM() {
    if (state.screen === 'playing') {
        playBGM();
    } else {
        stopBGM();
    }
}

// --- Graphics & Math ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let bounds = { w: 0, h: 0, center: {x:0, y:0} };

function resize() {
    bounds.w = window.innerWidth;
    bounds.h = window.innerHeight;
    canvas.width = bounds.w * window.devicePixelRatio;
    canvas.height = bounds.h * window.devicePixelRatio;
    canvas.style.width = bounds.w + 'px';
    canvas.style.height = bounds.h + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

function getTilePos(index) {
    // Layout logic for 16 tiles in a square loop
    // Assume board is 80% of min screen dim
    const size = Math.min(bounds.w, bounds.h) * 0.85;
    const cellSize = size / 5;
    const startX = bounds.center.x - size/2 + cellSize/2;
    const startY = bounds.center.y + size/2 - cellSize/2;
    
    // 0 (Bottom Left) -> 4 (Bottom Right) -> 8 (Top Right) -> 12 (Top Left)
    // Actually indices:
    // 0: BL corner
    // 1-3: Bottom edge (L to R)
    // 4: BR corner
    // 5-7: Right edge (B to T)
    // 8: TR corner
    // 9-11: Top edge (R to L)
    // 12: TL corner
    // 13-15: Left edge (T to B)

    let x = 0, y = 0;
    
    if (index === 0) { x = 0; y = 4; }
    else if (index < 4) { x = index; y = 4; }
    else if (index === 4) { x = 4; y = 4; }
    else if (index < 8) { x = 4; y = 4 - (index - 4); }
    else if (index === 8) { x = 4; y = 0; }
    else if (index < 12) { x = 4 - (index - 8); y = 0; }
    else if (index === 12) { x = 0; y = 0; }
    else { x = 0; y = index - 12; }

    return {
        x: startX + x * cellSize,
        y: bounds.center.y - size/2 + cellSize/2 + y * cellSize,
        size: cellSize
    };
}

// --- Game Logic ---

function initGame() {
    state.money = window.gameConfig.startMoney;
    state.netWorth = state.money;
    state.pos = 0;
    state.targetPos = 0;
    state.isMoving = false;
    state.properties = new Array(TILE_COUNT).fill(null).map(() => ({ level: 0, owner: null }));
    state.screen = 'playing';
    
    updateHUD();
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    hideAllGifs();
    syncBGM();
}

function rollDice() {
    if (state.isMoving) return;
    
    playSound('sfx_click', 0.18);
    const roll = Math.floor(Math.random() * 6) + 1;
    state.diceVal = roll;
    state.targetPos = (state.pos + roll) % TILE_COUNT;
    
    // Check for passing GO
    if (state.targetPos < state.pos) {
        addMoney(window.gameConfig.salary);
        spawnPopup(getTilePos(0), `SUPPLY DROP +$${window.gameConfig.salary}`, '#10b981');
        playSound('sfx_bonus', 0.26);
        showGif('bonus');
    }
    
    state.isMoving = true;
    state.moveTimer = 0;
    
    // Disable button
    const btn = document.getElementById('roll-btn');
    btn.classList.add('opacity-50', 'cursor-not-allowed');
    btn.textContent = `VECTOR ${roll}!`;
}

function landOnTile(index) {
    const tile = TILES[index];
    const pos = getTilePos(index);
    
    if (tile.type === 'prop') {
        const propState = state.properties[index];
        if (propState.owner === null) {
            // Buy logic
            if (state.money >= tile.price) {
                state.money -= tile.price;
                propState.owner = 'player';
                propState.level = 1;
                state.netWorth += tile.price; // Asset value
                spawnPopup(pos, `CLAIMED -$${tile.price}`, '#ef4444');
                spawnParticles(pos.x, pos.y, tile.color);
                playSound('sfx_success', 0.24);
                showGif('bonus');
            }
        } else if (propState.owner === 'player') {
            // Upgrade logic
            const upgradeCost = Math.floor(tile.price * 0.5);
            if (state.money >= upgradeCost && propState.level < 4) {
                state.money -= upgradeCost;
                propState.level++;
                state.netWorth += upgradeCost;
                spawnPopup(pos, `REFIT -$${upgradeCost}`, '#3b82f6');
                spawnParticles(pos.x, pos.y, '#ffffff');
                playSound('sfx_success', 0.24);
            }
        }
    } else if (tile.type === 'corner') {
        if (tile.label === 'JAIL') {
            // Just visiting
        } else if (tile.label === '->JAIL') {
            state.pos = 4; // Move to Jail
            state.targetPos = 4;
            spawnPopup(pos, "QUARANTINE!", '#ef4444');
            state.cameraShake = 10;
            playSound('sfx_warning', 0.24);
            showGif('fail');
        } else if (tile.label === 'FREE') {
            const gift = 50;
            addMoney(gift);
            spawnPopup(pos, `SALVAGE +$${gift}`, '#fbbf24');
            playSound('sfx_bonus', 0.24);
            showGif('bonus');
        }
    }
    
    // Re-enable button
    state.isMoving = false;
    const btn = document.getElementById('roll-btn');
    btn.classList.remove('opacity-50', 'cursor-not-allowed');
    btn.textContent = "LAUNCH DIE";
    
    updateHUD();
    checkGameOver();
}

function addMoney(amount) {
    state.money += amount;
    state.netWorth += amount;
}

function checkGameOver() {
    if (state.money < 0) {
        state.screen = 'gameover';
        document.getElementById('final-score').textContent = state.netWorth;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('controls').classList.add('hidden');
        syncBGM();
        playSound('sfx_gameover', 0.3);
        showGif('fail');
    }
}

function updateHUD() {
    document.getElementById('money-display').textContent = state.money;
    document.getElementById('net-display').textContent = state.netWorth;
}

// --- Visual Effects ---
function spawnPopup(pos, text, color) {
    state.popups.push({
        x: pos.x,
        y: pos.y - 20,
        text: text,
        color: color,
        life: 1.5,
        vy: -50
    });
}

function spawnParticles(x, y, color) {
    for(let i=0; i<15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 100 + 50;
        state.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 6 + 2
        });
    }
}

// --- Main Loop ---
let lastTime = 0;
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        // Clear
        ctx.fillStyle = '#f0f4f8';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Shake
        let shakeX = 0, shakeY = 0;
        if (state.cameraShake > 0) {
            shakeX = (Math.random() - 0.5) * state.cameraShake;
            shakeY = (Math.random() - 0.5) * state.cameraShake;
            state.cameraShake = Math.max(0, state.cameraShake - dt * 30);
        }
        
        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Draw Board
        bounds.center = { x: canvas.width / 2 / window.devicePixelRatio, y: canvas.height / 2 / window.devicePixelRatio };
        
        // Draw Tiles
        for (let i = 0; i < TILE_COUNT; i++) {
            const tPos = getTilePos(i);
            const tile = TILES[i];
            const prop = state.properties[i];
            
            // Base
            ctx.fillStyle = tile.color;
            // If owned, darken slightly
            if (prop.owner) ctx.fillStyle = tile.color; 
            
            // Rounded Rect
            const r = 8;
            ctx.beginPath();
            ctx.roundRect(tPos.x - tPos.size/2 + 2, tPos.y - tPos.size/2 + 2, tPos.size - 4, tPos.size - 4, r);
            ctx.fill();
            
            // Border
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Label
        ctx.fillStyle = '#d8ecff';
        ctx.font = '700 12px "Exo 2"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tile.label, tPos.x, tPos.y - 10);
            
            if (tile.type === 'prop') {
                ctx.font = '600 10px "Exo 2"';
                ctx.fillText(`$${tile.price}`, tPos.x, tPos.y + 15);
                
                // Building Levels
                if (prop.owner) {
                    ctx.fillStyle = '#1e293b';
                    for(let b=0; b<prop.level; b++) {
                        ctx.fillRect(tPos.x - 10 + b*6, tPos.y + 2, 4, 8);
                    }
                }
            }
        }

        // Logic: Movement
        if (state.isMoving) {
            state.moveTimer += dt * 5 * window.gameConfig.gameSpeed;
            if (state.moveTimer >= 1) {
                state.moveTimer = 0;
                state.pos = (state.pos + 1) % TILE_COUNT;
                // Play step sound intentionally omitted to avoid rapid-fire stacking on mobile.
                
                if (state.pos === state.targetPos) {
                    landOnTile(state.pos);
                }
            }
        }

        // Draw Player
        // Interpolate position
        let currentVisPos;
        if (state.isMoving) {
            const prevPos = getTilePos((state.pos - 1 + TILE_COUNT) % TILE_COUNT);
            const nextPos = getTilePos(state.pos);
            // We want to hop between tiles. 
            // Simple approach: Render at current integer pos because we step discretely
            currentVisPos = getTilePos(state.pos);
            
            // Add hop animation
            // const hopHeight = Math.sin(state.moveTimer * Math.PI) * 10;
            // currentVisPos.y -= hopHeight;
        } else {
            currentVisPos = getTilePos(state.pos);
        }

        // Player Token
        const pulse = 1 + Math.sin(timestamp / 240) * 0.06;
        const ringRadius = 18 + Math.sin(timestamp / 180) * 1.2;
        ctx.shadowColor = 'rgba(95,247,255,0.42)';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(currentVisPos.x, currentVisPos.y, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(95,247,255,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#081529';
        ctx.beginPath();
        ctx.arc(currentVisPos.x, currentVisPos.y, 13 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = window.gameConfig.themeColor;
        ctx.beginPath();
        ctx.arc(currentVisPos.x, currentVisPos.y, 10.5 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(currentVisPos.x - 3.5, currentVisPos.y - 2.5, 2.2, 0, Math.PI * 2);
        ctx.arc(currentVisPos.x + 3.5, currentVisPos.y - 2.5, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#081529';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(currentVisPos.x, currentVisPos.y + 1.5, 4.5, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // Particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
            const p = state.particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 200 * dt; // gravity

            if (p.life <= 0) {
                state.particles.splice(i, 1);
                continue;
            }
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Popups
        for (let i = state.popups.length - 1; i >= 0; i--) {
            const p = state.popups[i];
            p.life -= dt;
            p.y += p.vy * dt;
            
            if (p.life <= 0) {
                state.popups.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = Math.min(1, p.life * 2);
            ctx.fillStyle = p.color;
            ctx.font = '700 16px "Orbitron"';
            ctx.strokeStyle = '#061220';
            ctx.lineWidth = 3;
            ctx.strokeText(p.text, p.x, p.y);
            ctx.fillText(p.text, p.x, p.y);
            ctx.globalAlpha = 1;
        }

        ctx.restore();

    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(loop);
}

// --- Input Handling ---

function showGif(type) {
    const el = document.getElementById(type === 'bonus' ? 'gif-bonus' : 'gif-fail');
    if (!el) return;
    const src = GIFS[type];
    if (!src) return;
    el.src = src;
    el.classList.remove('hidden');
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(state.gifTimer);
    state.gifTimer = setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.classList.add('hidden'), 220);
    }, 1400);
}

function hideAllGifs() {
    ['gif-bonus', 'gif-fail'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('show');
        el.classList.add('hidden');
    });
}

function initStyles() {
    // Dynamic styles if needed
}

document.addEventListener('DOMContentLoaded', () => {
    resize();
    window.addEventListener('resize', resize);
    
    // Load Audio
    ['sfx_start', 'sfx_click', 'sfx_bonus', 'sfx_success', 'sfx_fail', 'sfx_warning', 'sfx_gameover'].forEach((id) => loadSound(id));
    document.getElementById('gif-bonus').src = GIFS.bonus;
    document.getElementById('gif-fail').src = GIFS.fail;
    
    // Buttons
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const rollBtn = document.getElementById('roll-btn');
    let startTriggered = false;
    let restartTriggered = false;

    const handleStart = async (e) => {
        if (e) e.preventDefault();
        if (startTriggered || state.screen !== 'start') return;
        startTriggered = true;
        await ensureAudioReady();
        playSound('sfx_start', 0.26);
        initGame();
        requestAnimationFrame(() => {
            startTriggered = false;
        });
    };

    const handleRestart = async (e) => {
        if (e) e.preventDefault();
        if (restartTriggered || state.screen !== 'gameover') return;
        restartTriggered = true;
        await ensureAudioReady();
        playSound('sfx_click', 0.2);
        initGame();
        requestAnimationFrame(() => {
            restartTriggered = false;
        });
    };

    const handleRoll = (e) => {
        if (e) e.preventDefault();
        if (state.screen === 'playing') rollDice();
    };

    // [agent-note][stage4] repaired: mobile-actionability | element: primary CTA buttons | action: keep native click path alongside pointer taps
    startBtn.addEventListener('pointerdown', handleStart);
    startBtn.addEventListener('click', handleStart);
    restartBtn.addEventListener('pointerdown', handleRestart);
    restartBtn.addEventListener('click', handleRestart);
    rollBtn.addEventListener('pointerdown', handleRoll);
    rollBtn.addEventListener('click', handleRoll);

    requestAnimationFrame(loop);
});

</script>
