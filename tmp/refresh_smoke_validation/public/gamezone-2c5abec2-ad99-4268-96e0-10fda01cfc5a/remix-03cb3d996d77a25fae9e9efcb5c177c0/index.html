<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Escape Run</title>
    <link href="assets/fonts.googleapis.com/css2-family_Orbitron_wght_400_700_900_display_swap.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050510;
            --bg-mid: #100a24;
            --panel-bg: linear-gradient(180deg, rgba(12, 14, 38, 0.88), rgba(8, 10, 28, 0.84));
            --panel-border: rgba(112, 234, 255, 0.34);
            --panel-highlight: rgba(255, 82, 168, 0.2);
            --cyan: #70eaff;
            --cyan-bright: #c8fbff;
            --blue: #45b2ff;
            --pink: #ff52a8;
            --gold: #ffd166;
            --danger: #ff6b7a;
            --white: #ffffff;
            --muted: rgba(235, 245, 255, 0.78);
            --shadow-deep: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(73, 42, 132, 0.4), transparent 45%),
                linear-gradient(180deg, #02030a 0%, #090518 45%, #130a28 100%);
            color: var(--white);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(112, 234, 255, 0.12), transparent 18%),
                radial-gradient(circle at 82% 18%, rgba(255, 82, 168, 0.14), transparent 22%),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 7.5vw,
                    rgba(112, 234, 255, 0.045) 7.5vw 7.7vw
                );
            opacity: 0.75;
        }

        .game-container::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 10%, transparent 88%, rgba(98, 202, 255, 0.08)),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.02) 0 2px,
                    transparent 2px 6px
                );
            mix-blend-mode: screen;
            opacity: 0.32;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            position: relative;
            width: min(90vw, 36rem);
            padding: clamp(1.35rem, 4vw, 2.4rem);
            border-radius: 1.15rem;
            text-align: center;
            pointer-events: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 40px var(--shadow-deep),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 24px rgba(69, 178, 255, 0.16),
                inset 0 0 28px rgba(255, 82, 168, 0.08);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 30%),
                linear-gradient(180deg, transparent 65%, rgba(112, 234, 255, 0.08));
        }

        .panel::after {
            content: "";
            position: absolute;
            inset: 0.55rem;
            border-radius: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .title {
            margin: 0 0 0.55rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.4rem, 8.8vw, 4.4rem);
            line-height: 0.94;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(200, 251, 255, 0.65),
                0 0 22px rgba(69, 178, 255, 0.5),
                0 0 34px rgba(255, 82, 168, 0.42);
        }

        .subtitle {
            margin: 0 0 1.25rem;
            color: var(--cyan);
            font-size: clamp(1rem, 3vw, 1.45rem);
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            align-items: center;
        }

        .instruction {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sub-instruction {
            margin: -0.2rem 0 0.15rem;
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.94rem;
            letter-spacing: 0.04em;
        }

        .action-btn {
            min-width: 13rem;
            padding: 0.95rem 2.2rem;
            border: 1px solid rgba(200, 251, 255, 0.4);
            border-radius: 999px;
            cursor: pointer;
            color: var(--white);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background:
                linear-gradient(90deg, rgba(25, 64, 137, 0.95), rgba(31, 133, 219, 0.95) 50%, rgba(255, 82, 168, 0.92));
            box-shadow:
                0 0 18px rgba(69, 178, 255, 0.32),
                inset 0 0 20px rgba(255, 255, 255, 0.06);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px) scale(1.03);
            box-shadow:
                0 0 26px rgba(112, 234, 255, 0.42),
                0 10px 22px rgba(0, 0, 0, 0.24);
            filter: brightness(1.08);
            outline: none;
        }

        .status-title {
            margin: 0 0 0.75rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2rem, 7vw, 3.4rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .status-title.fail {
            color: var(--danger);
            text-shadow: 0 0 14px rgba(255, 107, 122, 0.6);
        }

        .metric-label {
            color: rgba(255, 255, 255, 0.84);
            font-size: 1.15rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .metric-value {
            margin: 0.45rem 0 1.45rem;
            color: var(--gold);
            font-size: clamp(2rem, 8vw, 3.4rem);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-weight: 400;
            text-shadow: 0 0 16px rgba(255, 209, 102, 0.24);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            pointer-events: none;
        }

        .hud-block {
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 0.45rem 0.6rem 0.5rem;
            border-radius: 0.85rem;
            background: linear-gradient(180deg, rgba(10, 14, 34, 0.72), rgba(7, 9, 24, 0.48));
            border: 1px solid rgba(112, 234, 255, 0.18);
            box-shadow:
                0 10px 18px rgba(0, 0, 0, 0.18),
                inset 0 0 20px rgba(112, 234, 255, 0.04);
        }

        .hud-block.right {
            align-items: flex-end;
        }

        .hud-label {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hud-label.cyan {
            color: var(--cyan);
        }

        .hud-label.pink {
            color: #ff8ec9;
        }

        .hud-value {
            margin-top: 0.2rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.4rem, 4.8vw, 2.6rem);
            font-weight: 400;
            color: var(--cyan-bright);
            text-shadow: 0 0 12px rgba(112, 234, 255, 0.42);
        }

        .speed-gauge {
            width: min(8rem, 32vw);
            height: 0.9rem;
            margin-top: 0.45rem;
            overflow: hidden;
            border: 1px solid rgba(200, 251, 255, 0.24);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(15, 18, 40, 0.95), rgba(33, 17, 54, 0.85));
            box-shadow:
                inset 0 0 10px rgba(0, 0, 0, 0.38),
                0 0 14px rgba(255, 82, 168, 0.1);
            transform: skewX(-12deg);
        }

        .speed-bar {
            height: 100%;
            width: 0;
            background:
                linear-gradient(90deg, #6cf7ff 0%, #48b7ff 35%, #ffd166 70%, #ff52a8 100%);
            box-shadow: 0 0 18px rgba(112, 234, 255, 0.5);
            transition: width 100ms linear;
        }

        .speed-text {
            margin-top: 0.35rem;
            font-size: 1.08rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.92);
        }

        .start-emblem {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.95rem;
            padding: 0.42rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 82, 168, 0.12);
            border: 1px solid rgba(255, 82, 168, 0.18);
            color: #ffd8ea;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .feedback-overlay {
            position: absolute;
            right: clamp(0.7rem, 2vw, 1rem);
            bottom: clamp(0.8rem, 3vw, 1.25rem);
            width: min(28vw, 9rem);
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 4;
            filter: drop-shadow(0 0 18px rgba(112, 234, 255, 0.32));
        }

        .feedback-overlay.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(5, 8, 20, 0.5);
        }

        .feedback-overlay.fail {
            left: 50%;
            right: auto;
            top: 50%;
            bottom: auto;
            width: min(44vw, 12rem);
            transform: translate(-50%, -50%) scale(0.88);
            z-index: 5;
            filter: drop-shadow(0 0 22px rgba(255, 82, 168, 0.4));
        }

        .feedback-overlay.fail.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-caption {
            margin-top: 0.35rem;
            text-align: center;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
        }

        .emblem-dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #70eaff 45%, #45b2ff 100%);
            box-shadow: 0 0 14px rgba(112, 234, 255, 0.7);
            animation: pulseBeacon 1.6s ease-in-out infinite;
        }

        @keyframes pulseBeacon {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.18); opacity: 1; }
        }

        @media (max-width: 640px) {
            .hud {
                padding-left: 0.9rem;
                padding-right: 0.9rem;
                gap: 0.55rem;
            }

            .panel {
                width: min(92vw, 34rem);
                padding: 1.2rem 1rem 1.35rem;
            }

            .instruction {
                font-size: 0.88rem;
            }

            .sub-instruction {
                font-size: 0.84rem;
            }

            .action-btn {
                min-width: 11.5rem;
                font-size: 0.92rem;
                padding: 0.9rem 1.5rem;
            }

            .hud-block {
                padding: 0.4rem 0.5rem 0.45rem;
            }

            .hud-label {
                font-size: 0.62rem;
            }

            .speed-text {
                font-size: 0.92rem;
            }

            .feedback-overlay {
                width: min(32vw, 7rem);
                bottom: max(0.7rem, env(safe-area-inset-bottom));
            }

            .feedback-overlay.fail {
                width: min(52vw, 10rem);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: boost/fail feedback -> catalogs/gifs.json | keep off-playfield for mobile safety -->
        <div id="boost-feedback" class="feedback-overlay" aria-hidden="true">
            <img src="https://i.giphy.com/443DE4MxVGnbM8vCi6.webp" alt="Boost feedback animation">
            <div class="feedback-caption">Boost Surge</div>
        </div>

        <div id="fail-feedback" class="feedback-overlay fail" aria-hidden="true">
            <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Failure feedback animation">
            <div class="feedback-caption">Hazard Hit</div>
        </div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel">
                <div class="start-emblem"><span class="emblem-dot"></span> Pulse Rider</div>
                <h1 class="title">Neon Escape</h1>
                <h2 class="subtitle">Outrun the hazard field</h2>
                <div class="stack">
                    <p class="instruction">Mouse / touch / arrows to steer</p>
                    <p class="sub-instruction">Hold touch, click, or ↑ to keep boosting through the lane.</p>
                    <button id="start-btn" class="action-btn">Start Run</button>
                </div>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <h2 class="status-title fail">Run Lost</h2>
                <div class="metric-label">Distance Escaped</div>
                <div class="metric-value"><span id="finalScore">0</span> m</div>
                <button id="restart-btn" class="action-btn">Run Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label cyan">Escape Distance</span>
                    <span id="score" class="hud-value">0</span>
                </div>
                <div class="hud-block right">
                    <span class="hud-label pink">Boost</span>
                    <div class="speed-gauge">
                        <div id="speed-bar" class="speed-bar"></div>
                    </div>
                    <span id="speed-text" class="speed-text">0 km/h</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                boost: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                tick: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [key, value] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(value);
                    audio.preload = 'auto';
                    audio.volume = key === 'fail' ? 0.7 : 0.55;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                const warmup = document.createElement('audio');
                warmup.volume = 0;
                const playAttempt = warmup.play();
                if (playAttempt && typeof playAttempt.catch === 'function') {
                    playAttempt.catch(() => {});
                }
                warmup.pause();
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, debounceMs = 0) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (debounceMs && now - last < debounceMs) return;
                this.lastPlayed.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const hud = document.getElementById('hud');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const boostFeedback = document.getElementById('boost-feedback');
        const failFeedback = document.getElementById('fail-feedback');

        let width = window.innerWidth;
        let height = window.innerHeight;

        let gameActive = false;
        let lastTime = 0;
        let score = 0;
        let bestScoreMilestone = 0;
        let boostGifTimer = 0;
        let failGifTimer = 0;

        const SEGMENT_LENGTH = 200;
        const RUMBLE_LENGTH = 3;
        const ROAD_WIDTH = 2000;
        const CAMERA_HEIGHT = 1000;
        const CAMERA_DEPTH = 0.84;
        const DRAW_DISTANCE = 300;
        const TOTAL_SEGMENTS = 2000;

        let segments = [];
        let playerX = 0;
        let position = 0;
        let speed = 0;
        const MAX_SPEED = 12000;
        const ACCEL = MAX_SPEED / 5;
        const BREAKING = -MAX_SPEED;
        const DECEL = -MAX_SPEED / 5;
        const OFF_ROAD_DECEL = -MAX_SPEED / 2;
        const OFF_ROAD_LIMIT = MAX_SPEED / 4;

        let keyLeft = false;
        let keyRight = false;
        let keyFaster = false;
        let touchX = null;
        let starfield = [];

        /** 4. RESIZE HANDLER */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            starfield = createStarfield();
        }
        window.addEventListener('resize', resize);
        resize();

        function createStarfield() {
            const count = Math.max(36, Math.floor(width / 18));
            return Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height * 0.72,
                size: Math.random() * 2.2 + 0.5,
                alpha: Math.random() * 0.6 + 0.2,
                twinkle: Math.random() * Math.PI * 2
            }));
        }

        function showFeedback(element, durationMs) {
            if (!element) return;
            element.classList.add('visible');
            clearTimeout(element._hideTimer);
            element._hideTimer = setTimeout(() => {
                element.classList.remove('visible');
            }, durationMs);
        }

        /** 5. INPUT HANDLERS */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keyLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keyRight = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keyFaster = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keyLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keyRight = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keyFaster = false;
        });

        canvas.addEventListener('pointerdown', (e) => {
            gameActive && (keyFaster = true);
            touchX = e.clientX;
        });
        canvas.addEventListener('pointermove', (e) => {
            if (gameActive) {
                const center = width / 2;
                const deadZone = 20;
                if (e.clientX < center - deadZone) {
                    keyLeft = true;
                    keyRight = false;
                } else if (e.clientX > center + deadZone) {
                    keyRight = true;
                    keyLeft = false;
                } else {
                    keyRight = false;
                    keyLeft = false;
                }
                touchX = e.clientX;
            }
        });
        const releasePointerControls = () => {
            keyFaster = false;
            keyLeft = false;
            keyRight = false;
            touchX = null;
        };

        canvas.addEventListener('pointerup', releasePointerControls);
        canvas.addEventListener('pointercancel', releasePointerControls);
        canvas.addEventListener('pointerleave', releasePointerControls);

        /** 6. PSEUDO-3D ENGINE UTILS */
        function createRoad() {
            segments = [];
            for (let n = 0; n < TOTAL_SEGMENTS; n++) {
                segments.push({
                    index: n,
                    p1: { world: { z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
                    p2: { world: { z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
                    curve: Math.sin(n * 0.05) * 3,
                    color: Math.floor(n / RUMBLE_LENGTH) % 2 ?
                           { road: '#1b1735', grass: '#050510', rumble: '#ff4da0', lane: '#d9f7ff' } :
                           { road: '#102646', grass: '#090617', rumble: '#4de8ff', lane: '#8ad4ff' },
                    sprites: []
                });

                if (n > 50 && n % 40 === 0 && Math.random() > 0.3) {
                    const offset = (Math.random() * 2 - 1) * 0.8;
                    segments[n].sprites.push({ source: 'rock', offset: offset });
                }
            }
        }

        function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
            p.camera.x = (p.world.x || 0) - cameraX;
            p.camera.y = (p.world.y || 0) - cameraY;
            p.camera.z = (p.world.z || 0) - cameraZ;

            if (p.camera.z < 0) {
                p.camera.z += TOTAL_SEGMENTS * SEGMENT_LENGTH;
            }

            p.screen.scale = cameraDepth / p.camera.z;
            p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
            p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
            p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
        }

        function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }

        /** 7. RENDER FUNCTIONS */
        function renderBackground() {
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#02030a');
            sky.addColorStop(0.32, '#120a28');
            sky.addColorStop(0.68, '#21123f');
            sky.addColorStop(1, '#14071f');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            for (const star of starfield) {
                const pulse = 0.65 + Math.sin(performance.now() * 0.0018 + star.twinkle) * 0.35;
                ctx.globalAlpha = star.alpha * pulse;
                ctx.fillStyle = '#d8f9ff';
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff52a8';
            const moon = ctx.createRadialGradient(width * 0.72, height * 0.27, 10, width * 0.72, height * 0.27, width * 0.13);
            moon.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            moon.addColorStop(0.35, 'rgba(255, 209, 102, 0.88)');
            moon.addColorStop(1, 'rgba(255, 82, 168, 0.08)');
            ctx.fillStyle = moon;
            ctx.beginPath();
            ctx.arc(width * 0.72, height * 0.27, width * 0.095, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = 'rgba(92, 215, 255, 0.12)';
            ctx.lineWidth = 1;
            for (let i = 0; i < height * 0.55; i += 18) {
                ctx.beginPath();
                ctx.moveTo(0, height * 0.2 + i);
                ctx.lineTo(width, height * 0.2 + i);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 6; i++) {
                const baseX = width * (0.1 + i * 0.16);
                const peak = height * (0.27 + (i % 2) * 0.04);
                ctx.fillStyle = i % 2 === 0 ? '#2f245d' : '#221945';
                ctx.beginPath();
                ctx.moveTo(baseX - width * 0.09, height * 0.64);
                ctx.lineTo(baseX, peak);
                ctx.lineTo(baseX + width * 0.09, height * 0.64);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function renderPlayer() {
            const carW = Math.min(width * 0.15, 130);
            const carH = Math.min(width * 0.08, 70);
            const drift = playerX * width * 0.03;
            const carX = (width / 2) - (carW / 2) + drift;
            const carY = height - carH - 20;
            const boostLevel = speed / MAX_SPEED;
            const hover = Math.sin(performance.now() * 0.01) * 1.5;

            ctx.save();
            ctx.translate(0, hover);

            const bodyGrad = ctx.createLinearGradient(carX, carY, carX + carW, carY + carH);
            bodyGrad.addColorStop(0, '#ff4da0');
            bodyGrad.addColorStop(0.5, '#8e5bff');
            bodyGrad.addColorStop(1, '#38d0ff');

            ctx.shadowBlur = 22;
            ctx.shadowColor = 'rgba(88, 214, 255, 0.8)';

            ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
            ctx.beginPath();
            ctx.ellipse(carX + carW * 0.5, carY + carH + 10, carW * 0.52, carH * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(carX + carW * 0.14, carY + carH * 0.12);
            ctx.quadraticCurveTo(carX + carW * 0.5, carY - carH * 0.2, carX + carW * 0.86, carY + carH * 0.12);
            ctx.lineTo(carX + carW * 0.98, carY + carH * 0.6);
            ctx.quadraticCurveTo(carX + carW * 0.75, carY + carH * 0.98, carX + carW * 0.5, carY + carH);
            ctx.quadraticCurveTo(carX + carW * 0.25, carY + carH * 0.98, carX + carW * 0.02, carY + carH * 0.6);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(216, 249, 255, 0.92)';
            ctx.lineWidth = 2;
            ctx.stroke();

            const canopy = ctx.createLinearGradient(carX, carY, carX, carY + carH);
            canopy.addColorStop(0, 'rgba(230, 250, 255, 0.95)');
            canopy.addColorStop(1, 'rgba(84, 198, 255, 0.18)');
            ctx.fillStyle = canopy;
            ctx.beginPath();
            ctx.moveTo(carX + carW * 0.32, carY + carH * 0.18);
            ctx.quadraticCurveTo(carX + carW * 0.5, carY - carH * 0.02, carX + carW * 0.68, carY + carH * 0.18);
            ctx.lineTo(carX + carW * 0.6, carY + carH * 0.52);
            ctx.lineTo(carX + carW * 0.4, carY + carH * 0.52);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(112, 234, 255, 0.55)';
            ctx.beginPath();
            ctx.moveTo(carX + carW * 0.5, carY + carH * 0.12);
            ctx.lineTo(carX + carW * 0.5, carY + carH * 0.52);
            ctx.stroke();

            ctx.fillStyle = '#ffd166';
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#ffd166';
            ctx.beginPath();
            ctx.arc(carX + carW * 0.22, carY + carH * 0.62, carW * 0.055, 0, Math.PI * 2);
            ctx.arc(carX + carW * 0.78, carY + carH * 0.62, carW * 0.055, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff6b7a';
            ctx.shadowColor = '#ff6b7a';
            ctx.fillRect(carX + carW * 0.12, carY + carH * 0.76, carW * 0.1, carH * 0.08);
            ctx.fillRect(carX + carW * 0.78, carY + carH * 0.76, carW * 0.1, carH * 0.08);

            if (speed > MAX_SPEED * 0.25) {
                const flameLength = carH * (0.28 + boostLevel * 0.7);
                const flicker = Math.sin(performance.now() * 0.05) * 4;
                ctx.shadowColor = '#70eaff';
                ctx.shadowBlur = 14;

                ['#70eaff', '#45b2ff', '#ff52a8'].forEach((color, index) => {
                    ctx.fillStyle = color;
                    const offset = index * 4;
                    ctx.beginPath();
                    ctx.moveTo(carX + carW * 0.38 + offset * 0.012, carY + carH * 0.94);
                    ctx.lineTo(carX + carW * 0.5, carY + carH + flameLength + flicker - offset);
                    ctx.lineTo(carX + carW * 0.62 - offset * 0.012, carY + carH * 0.94);
                    ctx.closePath();
                    ctx.fill();
                });
            }

            ctx.restore();
        }

        function renderSprite(sprite, scale, destX, destY, clipY) {
            const spriteW = 300 * scale * width / 1000;
            const spriteH = 300 * scale * width / 1000;
            const spriteX = destX - (spriteW / 2);
            const spriteY = destY - spriteH;
            const pulse = 0.75 + Math.sin(performance.now() * 0.005 + destX * 0.01) * 0.18;

            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff52a8';

            const rockGrad = ctx.createLinearGradient(spriteX, spriteY, spriteX, spriteY + spriteH);
            rockGrad.addColorStop(0, 'rgba(255, 82, 168, 0.95)');
            rockGrad.addColorStop(0.5, 'rgba(121, 67, 255, 0.92)');
            rockGrad.addColorStop(1, 'rgba(17, 13, 37, 0.98)');
            ctx.fillStyle = rockGrad;
            ctx.strokeStyle = 'rgba(216, 249, 255, 0.85)';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.moveTo(spriteX + spriteW * 0.5, spriteY);
            ctx.lineTo(spriteX + spriteW * 0.92, spriteY + spriteH * 0.3);
            ctx.lineTo(spriteX + spriteW * 0.76, spriteY + spriteH);
            ctx.lineTo(spriteX + spriteW * 0.24, spriteY + spriteH);
            ctx.lineTo(spriteX + spriteW * 0.08, spriteY + spriteH * 0.3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = `rgba(112, 234, 255, ${pulse})`;
            ctx.beginPath();
            ctx.moveTo(spriteX + spriteW * 0.48, spriteY + spriteH * 0.12);
            ctx.lineTo(spriteX + spriteW * 0.65, spriteY + spriteH * 0.42);
            ctx.lineTo(spriteX + spriteW * 0.54, spriteY + spriteH * 0.78);
            ctx.moveTo(spriteX + spriteW * 0.32, spriteY + spriteH * 0.48);
            ctx.lineTo(spriteX + spriteW * 0.68, spriteY + spriteH * 0.55);
            ctx.stroke();

            ctx.restore();
        }

        /** 8. GAME LOOP */
        function update(dt) {
            position += speed * dt;
            while (position >= TOTAL_SEGMENTS * SEGMENT_LENGTH) position -= TOTAL_SEGMENTS * SEGMENT_LENGTH;
            while (position < 0) position += TOTAL_SEGMENTS * SEGMENT_LENGTH;

            if (keyFaster || touchX !== null) {
                speed += ACCEL * dt;
            } else {
                speed += DECEL * dt;
            }

            if (!keyFaster && touchX === null && speed > 0) {
                speed += BREAKING * 0.02 * dt;
            }

            if (Math.abs(playerX) > 1.25 && speed > OFF_ROAD_LIMIT) {
                speed += OFF_ROAD_DECEL * 0.12 * dt;
            }

            if (keyLeft) playerX -= (speed / MAX_SPEED) * 2.5 * dt;
            if (keyRight) playerX += (speed / MAX_SPEED) * 2.5 * dt;

            playerX -= playerX * 0.1 * dt;

            if (speed > MAX_SPEED) speed = MAX_SPEED;
            if (speed < 0) speed = 0;
            if (playerX < -2.5) playerX = -2.5;
            if (playerX > 2.5) playerX = 2.5;

            const playerSegmentIndex = Math.floor((position + CAMERA_HEIGHT) / SEGMENT_LENGTH) % TOTAL_SEGMENTS;

            for (let i = 0; i < 5; i++) {
                const idx = (playerSegmentIndex + i) % TOTAL_SEGMENTS;
                const seg = segments[idx];
                for (let j = 0; j < seg.sprites.length; j++) {
                    const sprite = seg.sprites[j];
                    if (idx === playerSegmentIndex) {
                        const spriteW = 0.6;
                        if (playerX > sprite.offset - spriteW && playerX < sprite.offset + spriteW) {
                            if (speed > 1000) {
                                gameOver();
                            }
                        }
                    }
                }
            }

            if (speed > 0) score += (speed * dt) / 100;

            const currentMilestone = Math.floor(score / 150);
            if (currentMilestone > bestScoreMilestone) {
                bestScoreMilestone = currentMilestone;
                audio.playSFX('tick', 140);
            }

            const boostingHard = speed > MAX_SPEED * 0.72 && (keyFaster || touchX !== null);
            if (boostingHard && boostGifTimer <= 0) {
                boostGifTimer = 1.4;
                showFeedback(boostFeedback, 900);
                audio.playSFX('boost', 180);
            }
            boostGifTimer = Math.max(0, boostGifTimer - dt);

            failGifTimer = Math.max(0, failGifTimer - dt);
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            renderBackground();

            const startPos = position;
            const startNodeIndex = Math.floor(startPos / SEGMENT_LENGTH);
            const endNodeIndex = startNodeIndex + DRAW_DISTANCE;

            let maxY = height;
            let x = 0, dx = 0;

            for (let n = startNodeIndex; n < endNodeIndex; n++) {
                const currIndex = n % TOTAL_SEGMENTS;
                const segment = segments[currIndex];

                const loopOffset = (n >= TOTAL_SEGMENTS) ? TOTAL_SEGMENTS * SEGMENT_LENGTH : 0;

                project(segment.p1, (playerX * ROAD_WIDTH), CAMERA_HEIGHT, startPos - loopOffset, CAMERA_DEPTH, width, height, ROAD_WIDTH);
                project(segment.p2, (playerX * ROAD_WIDTH), CAMERA_HEIGHT, startPos - loopOffset, CAMERA_DEPTH, width, height, ROAD_WIDTH);

                x += dx;
                dx += segment.curve;

                if (segment.p1.camera.z <= CAMERA_DEPTH || segment.p2.screen.y >= maxY) continue;

                renderSegment(segment);
                maxY = segment.p1.screen.y;
            }

            for (let n = endNodeIndex - 1; n > startNodeIndex; n--) {
                const currIndex = n % TOTAL_SEGMENTS;
                const segment = segments[currIndex];

                for (let i = 0; i < segment.sprites.length; i++) {
                    const sprite = segment.sprites[i];
                    const spriteScale = segment.p1.screen.scale;
                    const spriteX = segment.p1.screen.x + (spriteScale * sprite.offset * ROAD_WIDTH * width / 2);
                    const spriteY = segment.p1.screen.y;
                    renderSprite(sprite.source, spriteScale, spriteX, spriteY, -1);
                }
            }

            renderPlayer();
            updateHUD();
        }

        function renderSegment(segment) {
            const x1 = segment.p1.screen.x;
            const y1 = segment.p1.screen.y;
            const w1 = segment.p1.screen.w;
            const x2 = segment.p2.screen.x;
            const y2 = segment.p2.screen.y;
            const w2 = segment.p2.screen.w;

            drawPolygon(ctx, 0, y1, width, y1, width, y2, 0, y2, segment.color.grass);
            drawPolygon(ctx, x1 - w1, y1, x2 - w2, y2, x2 + w2, y2, x1 + w1, y1, segment.color.road);

            const rumbleW1 = w1 * 0.15;
            const rumbleW2 = w2 * 0.15;
            drawPolygon(ctx, x1 - w1 - rumbleW1, y1, x2 - w2 - rumbleW2, y2, x2 - w2, y2, x1 - w1, y1, segment.color.rumble);
            drawPolygon(ctx, x1 + w1 + rumbleW1, y1, x2 + w2 + rumbleW2, y2, x2 + w2, y2, x1 + w1, y1, segment.color.rumble);

            if (segment.color.road === '#1b1735') {
                const laneW1 = w1 * 0.02;
                const laneW2 = w2 * 0.02;
                drawPolygon(ctx, x1 - laneW1, y1, x2 - laneW2, y2, x2 + laneW2, y2, x1 + laneW1, y1, segment.color.lane);
            }

            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = segment.color.rumble;
            ctx.lineWidth = Math.max(1, 2 * (w1 / width * 100));
            ctx.beginPath();
            ctx.moveTo(x1 - w1, y1);
            ctx.lineTo(x2 - w2, y2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x1 + w1, y1);
            ctx.lineTo(x2 + w2, y2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(112, 234, 255, 0.14)';
            ctx.lineWidth = Math.max(1, w1 * 0.007);
            ctx.beginPath();
            ctx.moveTo(x1 - w1 * 0.45, y1);
            ctx.lineTo(x2 - w2 * 0.45, y2);
            ctx.moveTo(x1 + w1 * 0.45, y1);
            ctx.lineTo(x2 + w2 * 0.45, y2);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function updateHUD() {
            document.getElementById('score').innerText = Math.floor(score);
            const speedKmh = Math.floor(speed / 100);
            document.getElementById('speed-text').innerText = speedKmh + " km/h";

            const pct = Math.min(100, (speed / MAX_SPEED) * 100);
            document.getElementById('speed-bar').style.width = pct + '%';
        }

        function gameLoop(time) {
            if (!gameActive) return;
            const dt = Math.min(1, (time - lastTime) / 1000);
            lastTime = time;

            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            createRoad();
            score = 0;
            speed = 0;
            position = 0;
            playerX = 0;
            bestScoreMilestone = 0;
            boostGifTimer = 0;
            failGifTimer = 0;
            boostFeedback.classList.remove('visible');
            failFeedback.classList.remove('visible');
            lastTime = performance.now();
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 120);
            showFeedback(failFeedback, 1600);
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('finalScore').innerText = Math.floor(score);
        }

        function startRun() {
            audio.unlock();
            audio.playSFX('start', 120);
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameActive = true;
            initGame();
            requestAnimationFrame(gameLoop);
        }

        /** 9. CONTROLS SETUP */
        document.getElementById('start-btn').addEventListener('click', startRun);

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 120);
            audio.playBGM();
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameActive = true;
            initGame();
            requestAnimationFrame(gameLoop);
        });
    });
    </script>
</body>
