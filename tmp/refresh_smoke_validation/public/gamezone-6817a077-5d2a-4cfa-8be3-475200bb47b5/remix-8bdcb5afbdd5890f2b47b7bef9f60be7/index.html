<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>SPEED PORTAS: WAVE</title>
    <!-- [agent-note][stage3] resolved-font: title-display -> Orbitron, ui-body -> Exo 2, retro accent -> Press Start 2P -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg-deep: #050510;
            --bg-panel: rgba(7, 10, 23, 0.92);
            --bg-panel-strong: rgba(8, 14, 28, 0.98);
            --line-soft: rgba(255, 255, 255, 0.1);
            --line-bright: rgba(111, 240, 255, 0.55);
            --cyan: #00f3ff;
            --pink: #ff0099;
            --yellow: #ffec00;
            --green: #00ff66;
            --void: #64748b;
            --text: #f4fbff;
            --text-dim: #9cb4d4;
            --shadow-deep: rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(0, 243, 255, 0.12), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 0, 153, 0.14), transparent 32%),
                linear-gradient(180deg, #03030a 0%, #050510 45%, #060818 100%);
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 243, 255, 0.1), transparent 20%),
                radial-gradient(circle at 85% 15%, rgba(255, 0, 153, 0.08), transparent 18%),
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(15, 22, 42, 0.95), rgba(5, 8, 18, 0.96)),
                rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--line-soft);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 18px 50px var(--shadow-deep),
                0 0 28px rgba(0, 243, 255, 0.12);
            border-radius: 0;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255,255,255,0.08), transparent 30%),
                linear-gradient(180deg, rgba(0,243,255,0.05), transparent 45%, rgba(255,0,153,0.04));
            pointer-events: none;
        }

        .text-glow {
            text-shadow: 0 0 15px currentColor;
        }

        .btn-push {
            transition: transform 0.05s linear, box-shadow 0.05s linear, filter 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }

        .btn-push:active {
            transform: translate(2px, 2px);
            box-shadow: none !important;
        }

        .cut-corners {
            clip-path: polygon(
                10px 0, 100% 0,
                100% calc(100% - 10px),
                calc(100% - 10px) 100%,
                0 100%,
                0 10px
            );
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.24) 50%,
                rgba(0,0,0,0.24)
            );
            background-size: 100% 4px;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0.26;
            mix-blend-mode: soft-light;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .screen-card {
            pointer-events: auto;
            width: min(100% - 2rem, 25rem);
        }

        .start-screen,
        .game-over-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            margin: 0 1rem;
            text-align: center;
        }

        .start-screen {
            border-left: 4px solid var(--cyan);
        }

        .shop-screen {
            display: flex;
            flex-direction: column;
            padding: 1rem;
            margin: 0 0.75rem;
            height: min(80vh, 40rem);
            border-right: 4px solid var(--yellow);
        }

        .game-over-screen {
            border-top: 4px solid var(--pink);
        }

        .hidden {
            display: none !important;
        }

        .hero-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.45rem;
        }

        .title-mark {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }

        .title-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--yellow);
            font-family: 'Press Start 2P', ui-monospace, monospace;
            font-size: 0.56rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .title-kicker::before,
        .title-kicker::after {
            content: "";
            width: 1.35rem;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--yellow), transparent);
            box-shadow: 0 0 8px rgba(255, 236, 0, 0.5);
        }

        .avatar-badge {
            position: relative;
            width: 5.5rem;
            height: 5.5rem;
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.22));
        }

        .avatar-badge::before,
        .avatar-badge::after {
            content: "";
            position: absolute;
            inset: 0.3rem;
            border: 1px solid rgba(255,255,255,0.08);
            transform: rotate(45deg);
        }

        .avatar-badge::after {
            inset: 1rem;
            border-color: rgba(255, 0, 153, 0.3);
        }

        .avatar-core {
            position: absolute;
            inset: 1rem;
            background: radial-gradient(circle at 35% 35%, #ffffff 0 14%, #8ff8ff 15%, #00f3ff 38%, #05233f 78%, #02040a 100%);
            transform: rotate(45deg);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.08),
                0 0 24px rgba(0, 243, 255, 0.45),
                0 0 34px rgba(255, 0, 153, 0.16);
        }

        .avatar-face {
            position: absolute;
            inset: 0;
        }

        .avatar-eye {
            position: absolute;
            top: 2.1rem;
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 999px;
            background: #03111a;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
        }

        .avatar-eye.left { left: 1.8rem; }
        .avatar-eye.right { right: 1.8rem; }

        .avatar-smile {
            position: absolute;
            left: 50%;
            bottom: 1.55rem;
            width: 1.4rem;
            height: 0.7rem;
            transform: translateX(-50%);
            border-bottom: 2px solid rgba(3, 17, 26, 0.9);
            border-radius: 0 0 1rem 1rem;
            opacity: 0.85;
        }

        .game-title {
            margin: 0;
            color: white;
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(2.4rem, 9vw, 3.65rem);
            line-height: 0.86;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .game-title .accent {
            color: var(--cyan);
        }

        .title-divider {
            height: 0.24rem;
            width: 7.2rem;
            background: linear-gradient(90deg, var(--pink), var(--cyan));
            box-shadow: 0 0 12px rgba(255, 0, 153, 0.7);
        }

        .directive-box,
        .stat-card {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .directive-box {
            width: 100%;
            padding: 0.95rem;
            text-align: left;
        }

        .directive-label,
        .hud-label,
        .micro-label {
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 700;
        }

        .directive-label {
            color: var(--yellow);
            font-size: 0.72rem;
            margin-bottom: 0.35rem;
        }

        .directive-copy {
            margin: 0;
            color: #c7d2e6;
            font-family: 'Press Start 2P', ui-monospace, monospace;
            font-size: 0.58rem;
            line-height: 1.9;
        }

        .menu-actions {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        .menu-actions > * {
            min-width: 0;
        }

        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: 1px solid transparent;
            cursor: pointer;
            touch-action: manipulation;
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            text-transform: uppercase;
            line-height: 1;
        }

        .button-secondary {
            flex: 1;
            background: linear-gradient(180deg, #1e293b, #0f172a);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 1rem 0.75rem;
            box-shadow: 4px 4px 0 0 rgba(255,255,255,0.18);
            border-color: rgba(148, 163, 184, 0.75);
        }

        .button-primary {
            flex: 2;
            background: linear-gradient(180deg, #9cfaff, var(--cyan));
            color: #03111a;
            font-size: 1.35rem;
            font-weight: 700;
            padding: 1rem 0.9rem;
            box-shadow: 4px 4px 0 0 rgba(0,243,255,0.4);
            letter-spacing: 0.08em;
            transform: skewX(-6deg);
        }

        .button-primary:hover,
        .button-secondary:hover,
        .button-dark:hover,
        .button-light:hover,
        .button-ghost:hover {
            filter: brightness(1.08);
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .screen-title {
            margin: 0;
            color: white;
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(1.65rem, 6vw, 2.2rem);
            line-height: 1;
            text-transform: uppercase;
        }

        .currency-chip {
            color: var(--yellow);
            font-family: 'Press Start 2P', ui-monospace, monospace;
            font-size: 0.72rem;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .shop-scroll {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 0.75rem;
            padding-right: 0.35rem;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .button-dark {
            width: 100%;
            background: linear-gradient(180deg, #334155, #1e293b);
            color: white;
            font-size: 0.98rem;
            font-weight: 700;
            padding: 1rem 0.75rem;
            box-shadow: 4px 4px 0 0 rgba(0,0,0,0.45);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            width: 100%;
        }

        .stat-card {
            padding: 0.75rem;
        }

        .micro-label {
            font-size: 0.6rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .micro-label.bits {
            color: var(--yellow);
        }

        .stat-value {
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            font-size: 1.8rem;
            line-height: 1;
            color: #fff;
        }

        .stat-value.bits {
            color: var(--yellow);
        }

        .button-light {
            width: 100%;
            background: linear-gradient(180deg, #ffffff, #dfe7ef);
            color: black;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 1rem 0.75rem;
            box-shadow: 4px 4px 0 0 rgba(255,255,255,0.4);
            letter-spacing: 0.06em;
        }

        .button-ghost {
            width: 100%;
            background: transparent;
            color: #cbd5e1;
            border: 2px solid #475569;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.85rem 0.75rem;
            letter-spacing: 0.08em;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .hud-cluster {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hud-cluster.end {
            align-items: flex-end;
        }

        .hud-label {
            margin-bottom: 0.2rem;
            padding: 0.16rem 0.4rem;
            background: rgba(0, 0, 0, 0.5);
            font-family: 'Press Start 2P', ui-monospace, monospace;
            font-size: 0.48rem;
            line-height: 1.5;
        }

        .hud-label.cyan {
            color: var(--cyan);
        }

        .hud-label.yellow {
            color: var(--yellow);
        }

        .hud-score {
            color: white;
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(2.1rem, 9vw, 3.2rem);
            line-height: 0.95;
            text-shadow: 2px 2px 0 rgba(0,0,0,1);
            font-style: italic;
        }

        .hud-bits {
            display: flex;
            align-items: center;
            gap: 0.28rem;
            color: var(--yellow);
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            font-size: clamp(1.15rem, 5vw, 1.55rem);
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 236, 0, 0.2);
        }

        .bit-glyph {
            font-size: 0.68rem;
        }

        .mute-btn {
            position: absolute;
            right: max(1rem, calc(env(safe-area-inset-right, 0px) + 1rem));
            bottom: max(1rem, calc(env(safe-area-inset-bottom, 0px) + 1rem));
            pointer-events: auto;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.78);
            font-size: 1.2rem;
            z-index: 20;
        }

        .mute-btn:hover {
            color: white;
        }

        .menu-caption {
            color: var(--text-dim);
            font-size: 0.96rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #event-gif-stack {
            position: absolute;
            left: 0.75rem;
            bottom: max(1rem, calc(env(safe-area-inset-bottom, 0px) + 1rem));
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: min(30vw, 5.5rem);
            pointer-events: none;
            z-index: 12;
        }

        .event-gif {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(5, 8, 18, 0.8);
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.16);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.92);
            transition: opacity 0.18s ease, transform 0.18s ease;
            filter: saturate(1.15);
        }

        .event-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .event-gif-crash {
            box-shadow: 0 0 16px rgba(255, 0, 153, 0.28);
        }

        @media (max-width: 480px) {
            .start-screen,
            .game-over-screen {
                padding: 1rem;
                gap: 0.85rem;
            }

            .shop-screen {
                width: min(100% - 1rem, 25rem);
                padding: 0.85rem;
                height: min(82vh, 38rem);
            }

            .game-title {
                font-size: clamp(2.1rem, 13vw, 3rem);
            }

            .title-kicker {
                font-size: 0.5rem;
            }

            .avatar-badge {
                width: 4.8rem;
                height: 4.8rem;
            }

            .avatar-eye {
                top: 1.8rem;
                width: 0.48rem;
                height: 0.48rem;
            }

            .avatar-eye.left { left: 1.55rem; }
            .avatar-eye.right { right: 1.55rem; }

            .avatar-smile {
                width: 1.15rem;
                bottom: 1.28rem;
            }

            .directive-copy {
                font-size: 0.52rem;
            }

            .menu-actions {
                gap: 0.55rem;
            }

            .button-secondary {
                font-size: 0.86rem;
                padding: 0.95rem 0.55rem;
            }

            .button-primary {
                font-size: 1.1rem;
                padding: 0.95rem 0.6rem;
            }

            .screen-title {
                font-size: 1.6rem;
            }

            .currency-chip {
                font-size: 0.62rem;
            }

            .shop-grid {
                gap: 0.65rem;
            }

            .hud {
                padding-left: 0.85rem;
                padding-right: 0.85rem;
            }

            .mute-btn {
                width: 2.75rem;
                height: 2.75rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>

        <div id="ui-layer" class="ui-layer">
            <div id="event-gif-stack" class="hidden" aria-live="polite">
                <!-- [agent-note][stage3] resolved-gif: collect-feedback + crash-feedback -> catalogs/gifs.json -->
                <img id="collect-gif" class="event-gif event-gif-collect" alt="Bits surge reaction" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp">
                <img id="crash-gif" class="event-gif event-gif-crash" alt="Crash impact reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
            </div>
            <div id="start-screen" class="glass-panel screen-card start-screen">
                <div class="hero-stack">
                    <div class="title-kicker">Signal Pilot</div>
                    <div class="avatar-badge" aria-hidden="true">
                        <div class="avatar-core"></div>
                        <div class="avatar-face">
                            <span class="avatar-eye left"></span>
                            <span class="avatar-eye right"></span>
                            <span class="avatar-smile"></span>
                        </div>
                    </div>
                    <div class="title-mark">
                        <h1 class="game-title text-glow">
                            Neon<br><span class="accent">Wave</span>
                        </h1>
                        <div class="title-divider"></div>
                    </div>
                    <div class="menu-caption">Guide the prism runner through hostile gates.</div>
                </div>

                <div class="directive-box">
                    <p class="directive-label">Directives</p>
                    <p class="directive-copy">
                        HOLD TO CLIMB.<br>RELEASE TO DIVE.<br>AVOID WALLS. COLLECT BITS.
                    </p>
                </div>

                <div class="menu-actions">
                    <button id="shop-btn" class="button button-secondary cut-corners btn-push">
                        Shop
                    </button>
                    <button id="start-btn" class="button button-primary cut-corners btn-push">
                        Run
                    </button>
                </div>
            </div>

            <div id="shop-screen" class="hidden glass-panel screen-card shop-screen">
                <div class="shop-header">
                    <h2 class="screen-title">Armory</h2>
                    <div class="currency-chip">
                        <span id="shop-currency">0</span> Bits
                    </div>
                </div>

                <div class="shop-scroll">
                    <div id="shop-items" class="shop-grid">
                    </div>
                </div>

                <button id="close-shop-btn" class="button button-dark cut-corners btn-push">
                    Return to Menu
                </button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen-card game-over-screen">
                <h2 class="screen-title text-glow" style="color: var(--pink); font-size: clamp(2.25rem, 10vw, 3.1rem);">
                    Critical<br>Error
                </h2>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="micro-label">Score</div>
                        <div id="finalScore" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="micro-label bits">Bits</div>
                        <div id="finalBits" class="stat-value bits">0</div>
                    </div>
                </div>

                <button id="restart-btn" class="button button-light cut-corners btn-push">
                    Reboot
                </button>
                <button id="menu-btn" class="button button-ghost cut-corners btn-push">
                    Main Menu
                </button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-cluster">
                    <div class="hud-label cyan">Gates</div>
                    <div class="hud-score"><span id="score">0</span></div>
                </div>
                <div class="hud-cluster end">
                    <div class="hud-label yellow">Bits</div>
                    <div class="hud-bits">
                        <span class="bit-glyph">◆</span> <span id="bits-display">0</span>
                    </div>
                </div>
            </div>

            <button id="mute-btn" class="mute-btn cut-corners btn-push">
                🔊
            </button>
        </div>
    </div>

    <script>
    /**
     * SPEED PORTAS: WAVE EDITION
     * Sharp movement, sharp edges, sharp shop.
     */

    const CONFIG = {
        baseSpeed: 7,
        speedIncrement: 0.2,
        verticalSpeed: 8,
        gateWidth: 60,
        gateGap: 260,
        gateSpacing: 400,
        colors: {
            bg: '#050510',
            gate: '#00f3ff',
            gateWarn: '#ff0099',
            bit: '#ffec00'
        }
    };

    const SHOP_ITEMS = [
        { id: 'cyan', name: 'CYAN PROTO', color: '#00f3ff', price: 0 },
        { id: 'pink', name: 'HOT PINK', color: '#ff0099', price: 50 },
        { id: 'green', name: 'TOXIC', color: '#00ff66', price: 100 },
        { id: 'yellow', name: 'SOLAR', color: '#ffec00', price: 200 },
        { id: 'white', name: 'GHOST', color: '#ffffff', price: 350 },
        { id: 'void', name: 'VOID', color: '#64748b', price: 500 },
    ];

    const STATE = {
        active: false,
        width: 0, height: 0,
        frames: 0,
        score: 0,
        runBits: 0,
        totalBits: parseInt(localStorage.getItem('wave_bits') || '0'),
        inventory: JSON.parse(localStorage.getItem('wave_inventory') || '["cyan"]'),
        equipped: localStorage.getItem('wave_equipped') || 'cyan',

        speed: CONFIG.baseSpeed,
        muted: false,
        inputActive: false,
        gameoverCooldown: 0,

        gates: [],
        bits: [],
        particles: [],
        stars: [],
        trail: [],

        themeColor: '#00f3ff'
    };

    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
        sfx: {
            pass: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
            collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
            ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
            equip: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3"
        }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {};
    let audioReady = false;
    let lastUiSoundAt = 0;
    let gifTimers = {};

    async function loadSound(key, url) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            sounds[key] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {}
    }
    Object.entries(ASSETS.sfx).forEach(([k, v]) => loadSound(k, v));

    const bgmAudio = new Audio(ASSETS.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.2;
    bgmAudio.preload = "auto";

    function ensureAudioReady() {
        if (audioReady) return;
        audioReady = true;
        audioCtx.resume().catch(() => {});
        bgmAudio.load();
    }

    function syncBgm() {
        if (STATE.muted || !STATE.active) {
            bgmAudio.pause();
            return;
        }
        bgmAudio.play().catch(() => {});
    }

    function playSound(key, pitch = 1.0, vol = 1.0) {
        if (STATE.muted || !sounds[key]) return;
        ensureAudioReady();
        if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = sounds[key];
        source.playbackRate.value = pitch;
        gain.gain.value = vol;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    }

    function playUiSound() {
        const now = performance.now();
        if (now - lastUiSoundAt < 90) return;
        lastUiSoundAt = now;
        playSound("ui", 1, 0.32);
    }

    function flashGif(kind, duration = 900) {
        const el = document.getElementById(`${kind}-gif`);
        const stack = document.getElementById("event-gif-stack");
        if (!el || !stack) return;
        stack.classList.remove("hidden");
        el.classList.add("show");
        clearTimeout(gifTimers[kind]);
        gifTimers[kind] = setTimeout(() => {
            el.classList.remove("show");
            if (![...stack.querySelectorAll(".event-gif")].some(node => node.classList.contains("show"))) {
                stack.classList.add("hidden");
            }
        }, duration);
    }

    function toggleMute() {
        STATE.muted = !STATE.muted;
        document.getElementById("mute-btn").innerText = STATE.muted ? "🔇" : "🔊";
        syncBgm();
    }

    const player = { x: 0, y: 0, w: 20, h: 20, rotation: 0 };

    class Gate {
        constructor(x) {
            this.x = x;
            this.w = CONFIG.gateWidth;
            this.passed = false;

            const lastGate = STATE.gates[STATE.gates.length - 1];
            const minGap = 100;
            const maxGap = STATE.height - CONFIG.gateGap - 100;

            if (lastGate) {
                const timeToReach = CONFIG.gateSpacing / STATE.speed;
                const maxYChange = timeToReach * CONFIG.verticalSpeed * 0.8;

                const minY = Math.max(minGap, lastGate.gapY - maxYChange);
                const maxY = Math.min(maxGap, lastGate.gapY + maxYChange);
                this.gapY = Math.random() * (maxY - minY) + minY;
            } else {
                this.gapY = STATE.height / 2 - CONFIG.gateGap / 2;
            }

            this.gapH = CONFIG.gateGap;
            this.type = Math.random() > 0.8 ? 'danger' : 'normal';
        }

        draw(ctx) {
            const color = this.type === 'danger' ? CONFIG.colors.gateWarn : '#334155';

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.rect(this.x, -50, this.w, this.gapY + 50);
            ctx.fill(); ctx.stroke();

            const botY = this.gapY + this.gapH;
            ctx.beginPath();
            ctx.rect(this.x, botY, this.w, STATE.height - botY + 50);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = color;
            ctx.fillRect(this.x, this.gapY - 5, this.w, 5);
            ctx.fillRect(this.x, botY, this.w, 5);
        }
    }

    class Bit {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = 16;
            this.collected = false;
            this.rot = 0;
        }
        update() {
            this.x -= STATE.speed;
            this.rot += 0.1;
        }
        draw(ctx) {
            if(this.collected) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            ctx.fillStyle = CONFIG.colors.bit;
            ctx.shadowColor = CONFIG.colors.bit;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, -this.size / 2);
            ctx.lineTo(this.size / 2, 0);
            ctx.lineTo(0, this.size / 2);
            ctx.lineTo(-this.size / 2, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    class Star {
        constructor() { this.reset(true); }
        reset(randomX = false) {
            this.x = randomX ? Math.random() * STATE.width : STATE.width;
            this.y = Math.random() * STATE.height;
            this.size = Math.random() * 2 + 1;
            this.speed = (Math.random() * 0.5 + 0.1) * (STATE.speed * 0.5);
        }
        update() {
            this.x -= this.speed * (STATE.speed / 2);
            if (this.x < 0) this.reset();
        }
        draw(ctx) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(this.x, this.y, this.size * 4, this.size);
        }
    }

    function spawnGate() {
        const last = STATE.gates[STATE.gates.length - 1];
        const startX = last ? last.x + CONFIG.gateSpacing : STATE.width + 400;
        const newGate = new Gate(startX);
        STATE.gates.push(newGate);

        if (Math.random() > 0.3) {
            const bitX = startX + CONFIG.gateSpacing / 2;
            const prevGapCenter = last ? last.gapY + last.gapH / 2 : STATE.height / 2;
            const currGapCenter = newGate.gapY + newGate.gapH / 2;
            const bitY = (prevGapCenter + currGapCenter) / 2;

            STATE.bits.push(new Bit(bitX, bitY));
        }
    }

    function updatePhysics() {
        const vy = STATE.inputActive ? -CONFIG.verticalSpeed : CONFIG.verticalSpeed;
        player.y += vy;

        player.rotation = STATE.inputActive ? -Math.PI / 4 : Math.PI / 4;

        if (player.y < 0) { player.y = 0; gameOver(); }
        if (player.y > STATE.height - player.h) { player.y = STATE.height - player.h; gameOver(); }

        if (STATE.frames % 3 === 0) {
            STATE.trail.push({x: player.x, y: player.y + player.h / 2});
            if (STATE.trail.length > 40) STATE.trail.shift();
        }
        for (const t of STATE.trail) t.x -= STATE.speed;

        if (STATE.gates.length === 0) spawnGate();
        const last = STATE.gates[STATE.gates.length - 1];
        if (last && last.x < STATE.width + CONFIG.gateSpacing) spawnGate();

        for (let i = STATE.gates.length - 1; i >= 0; i--) {
            const g = STATE.gates[i];
            g.x -= STATE.speed;

            if (!g.passed && g.x + g.w < player.x) {
                g.passed = true;
                STATE.score++;
                document.getElementById('score').innerText = STATE.score;
                playSound('pass', 1.0 + (STATE.score % 10) * 0.05, 0.3);

                if (STATE.score % 10 === 0) {
                    STATE.speed += CONFIG.speedIncrement;
                }
            }

            if (g.x + g.w < -100) STATE.gates.splice(i, 1);

            const p = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 8 };
            if (p.x + p.w > g.x && p.x < g.x + g.w) {
                if (p.y < g.gapY || p.y + p.h > g.gapY + g.gapH) {
                    gameOver();
                }
            }
        }

        for (let i = STATE.bits.length - 1; i >= 0; i--) {
            const b = STATE.bits[i];
            b.update();

            const dx = (player.x + player.w / 2) - b.x;
            const dy = (player.y + player.h / 2) - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < player.w + b.size / 2) {
                STATE.runBits++;
                STATE.totalBits++;
                document.getElementById("bits-display").innerText = STATE.runBits;
                playSound("collect", 1.15, 0.34);
                flashGif("collect", 820);
                for(let k = 0; k < 5; k++) {
                    STATE.particles.push({
                        x: b.x, y: b.y,
                        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                        life: 1.0, size: 4, color: CONFIG.colors.bit
                    });
                }
                STATE.bits.splice(i, 1);
            } else if (b.x < -50) {
                STATE.bits.splice(i, 1);
            }
        }

        STATE.stars.forEach(s => s.update());
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        STATE.width = window.innerWidth;
        STATE.height = window.innerHeight;
        canvas.width = STATE.width;
        canvas.height = STATE.height;
        STATE.stars = Array.from({length: 40}, () => new Star());
        if (!STATE.active) draw();
    }
    window.addEventListener('resize', resize);

    function drawPlayer() {
        if (STATE.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(STATE.trail[0].x, STATE.trail[0].y);
            for (let i = 1; i < STATE.trail.length; i++) ctx.lineTo(STATE.trail[i].x, STATE.trail[i].y);
            ctx.lineTo(player.x, player.y + player.h / 2);
            ctx.lineJoin = 'miter';
            ctx.lineWidth = 4;
            ctx.strokeStyle = STATE.themeColor;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        ctx.save();
        ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
        ctx.rotate(player.rotation);

        ctx.shadowBlur = 15;
        ctx.shadowColor = STATE.themeColor;
        ctx.fillStyle = STATE.themeColor;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-8, 8);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-8, -8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(4, 0);
        ctx.lineTo(-4, 3);
        ctx.lineTo(-2, 0);
        ctx.lineTo(-4, -3);
        ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    function draw() {
        ctx.fillStyle = CONFIG.colors.bg;
        ctx.fillRect(0, 0, STATE.width, STATE.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        const offset = (STATE.frames * STATE.speed) % 60;
        for (let x = -offset; x < STATE.width; x += 60) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, STATE.height);
            ctx.stroke();
        }

        STATE.stars.forEach(s => s.draw(ctx));
        STATE.gates.forEach(g => g.draw(ctx));
        STATE.bits.forEach(b => b.draw(ctx));

        if (STATE.active || STATE.gameoverCooldown > 0) drawPlayer();

        for (let i = STATE.particles.length - 1; i >= 0; i--) {
            const p = STATE.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) {
                STATE.particles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0;
    }

    function loop() {
        if (!STATE.active) return;
        STATE.frames++;
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    function initShop() {
        const grid = document.getElementById('shop-items');
        grid.innerHTML = '';

        SHOP_ITEMS.forEach(item => {
            const owned = STATE.inventory.includes(item.id);
            const equipped = STATE.equipped === item.id;
            const canAfford = STATE.totalBits >= item.price;

            const div = document.createElement('div');
            div.className = `glass-panel`;
            div.style.padding = '0.85rem';
            div.style.border = equipped ? '2px solid rgba(255,255,255,0.9)' : '2px solid rgba(51,65,85,1)';
            div.style.background = equipped
                ? 'linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05))'
                : 'linear-gradient(180deg, rgba(15,23,42,0.96), rgba(2,6,23,0.96))';
            div.style.display = 'flex';
            div.style.flexDirection = 'column';
            div.style.alignItems = 'center';
            div.style.gap = '0.45rem';
            div.style.transition = 'all 0.2s ease';

            div.innerHTML = `
                <div style="width: 2.75rem; height: 2.75rem; margin-bottom: 0.25rem; transform: rotate(45deg); background: ${item.color}; box-shadow: 0 0 16px ${item.color}, inset 0 0 0 2px rgba(255,255,255,0.2);"></div>
                <div style="font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: ${equipped ? '#ffffff' : '#94a3b8'}; text-align: center;">${item.name}</div>
                ${!owned ? `<div style="font-family: 'Press Start 2P', ui-monospace, monospace; font-size: 0.5rem; color: var(--yellow); line-height: 1.6;">${item.price} BITS</div>` : ''}
                <button class="button btn-push cut-corners" style="width: 100%; margin-top: 0.35rem; padding: 0.7rem 0.45rem; font-size: 0.62rem; letter-spacing: 0.12em; font-family: 'Press Start 2P', ui-monospace, monospace; ${
                    equipped ? 'background: #ffffff; color: #000000; border: 1px solid #ffffff;' :
                    owned ? 'background: #334155; color: #ffffff; border: 1px solid #475569;' :
                    canAfford ? 'background: #ffec00; color: #000000; border: 1px solid #fff5a6;' :
                    'background: #1e293b; color: #64748b; border: 1px solid #1e293b; cursor: not-allowed;'
                }">
                    ${equipped ? 'EQUIPPED' : owned ? 'EQUIP' : 'BUY'}
                </button>
            `;

            const btn = div.querySelector('button');
            btn.onclick = () => {
                if (equipped) return;
                if (owned) {
                    equipItem(item.id);
                } else if (canAfford) {
                    buyItem(item);
                }
            };

            grid.appendChild(div);
        });

        document.getElementById('shop-currency').innerText = STATE.totalBits;

        const item = SHOP_ITEMS.find(i => i.id === STATE.equipped);
        if (item) STATE.themeColor = item.color;
    }

    function buyItem(item) {
        STATE.totalBits -= item.price;
        STATE.inventory.push(item.id);
        saveData();
        playSound('collect', 1.5);
        initShop();
    }

    function equipItem(id) {
        STATE.equipped = id;
        saveData();
        playSound('pass', 2.0);
        initShop();
    }

    function saveData() {
        localStorage.setItem('wave_bits', STATE.totalBits);
        localStorage.setItem('wave_inventory', JSON.stringify(STATE.inventory));
        localStorage.setItem('wave_equipped', STATE.equipped);
    }

    function initGame() {
        const item = SHOP_ITEMS.find(i => i.id === STATE.equipped);
        STATE.themeColor = item ? item.color : '#00f3ff';

        STATE.active = true;
        STATE.score = 0;
        STATE.runBits = 0;
        STATE.speed = CONFIG.baseSpeed;
        STATE.frames = 0;
        STATE.gates = [];
        STATE.bits = [];
        STATE.particles = [];
        STATE.trail = [];
        STATE.inputActive = false;
        STATE.gameoverCooldown = 0;

        player.x = STATE.width * 0.2;
        player.y = STATE.height * 0.5;
        player.rotation = 0;

        spawnGate();

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('shop-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score').innerText = '0';
        document.getElementById('bits-display').innerText = '0';

        ensureAudioReady();
        playSound("start", 1, 0.36);
        if (!STATE.muted) {
            bgmAudio.currentTime = 0;
        }
        syncBgm();

        loop();
    }

    function gameOver() {
        if (STATE.gameoverCooldown > 0) return;
        STATE.active = false;
        STATE.gameoverCooldown = 1;

        bgmAudio.pause();
        playSound("crash", 1, 0.5);
        flashGif("crash", 1400);
        saveData();

        for(let i = 0; i < 40; i++) {
            STATE.particles.push({
                x: player.x, y: player.y,
                vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
                life: 1.0,
                size: Math.random() * 6 + 2,
                color: Math.random() > 0.5 ? STATE.themeColor : '#ffffff'
            });
        }
        draw();

        setTimeout(() => {
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = STATE.score;
            document.getElementById('finalBits').innerText = STATE.runBits;
        }, 800);
    }

    function openShop() {
        initShop();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('shop-screen').classList.remove('hidden');
    }

    function closeShop() {
        document.getElementById('shop-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function goToMenu() {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        draw();
    }

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const menuBtn = document.getElementById('menu-btn');
    const shopBtn = document.getElementById('shop-btn');
    const closeShopBtn = document.getElementById('close-shop-btn');
    const muteBtn = document.getElementById('mute-btn');

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
    menuBtn.addEventListener('click', goToMenu);
    shopBtn.addEventListener('click', openShop);
    closeShopBtn.addEventListener('click', closeShop);
    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

    const gameArea = document.getElementById('game-container');

    const handleStart = (e) => {
        if (!STATE.active) return;
        if (e.target.closest('button')) return;
        e.preventDefault();
        STATE.inputActive = true;
    };
    const handleEnd = (e) => {
        if (!STATE.active) return;
        if (e?.cancelable) {
            e.preventDefault();
        }
        STATE.inputActive = false;
    };

    gameArea.addEventListener('touchstart', handleStart, {passive: false});
    gameArea.addEventListener('touchend', handleEnd, {passive: false});
    gameArea.addEventListener('touchcancel', handleEnd, {passive: false});
    gameArea.addEventListener('mousedown', handleStart);
    gameArea.addEventListener('mouseup', handleEnd);

    resize();
    draw();
    </script>
</body>
</html>
