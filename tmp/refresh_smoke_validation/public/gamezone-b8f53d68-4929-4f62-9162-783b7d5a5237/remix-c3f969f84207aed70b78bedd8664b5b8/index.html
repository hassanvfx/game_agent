<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stickman Sword Gacha</title>
<!-- [agent-note][stage4] resolved-font: title/ui -> Orbitron + Rajdhani via catalogs/fonts.json approved URLs -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-top: #0f1226;
        --bg-bottom: #25133d;
        --panel: rgba(18, 23, 52, 0.78);
        --panel-strong: rgba(13, 18, 42, 0.94);
        --panel-border: rgba(112, 232, 255, 0.28);
        --text: #eef7ff;
        --muted: #9cb4d6;
        --accent: #71e7ff;
        --accent-strong: #00c8ff;
        --coin: #ffd95a;
        --danger: #ff5c8a;
        --success: #79ffae;
        --shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(89, 220, 255, 0.18), transparent 32%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text);
        font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    body::before {
        background:
            radial-gradient(circle at 18% 22%, rgba(113, 231, 255, 0.18), transparent 14%),
            radial-gradient(circle at 82% 14%, rgba(255, 217, 90, 0.14), transparent 12%),
            radial-gradient(circle at 55% 72%, rgba(199, 126, 255, 0.1), transparent 18%);
        opacity: 0.9;
    }

    body::after {
        background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 100% 22px;
        opacity: 0.22;
        mix-blend-mode: screen;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .screen-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .screen-root::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 24% 70%, rgba(113, 231, 255, 0.12), transparent 20%),
            radial-gradient(circle at 76% 34%, rgba(255, 105, 160, 0.1), transparent 18%);
        z-index: 0;
    }

    .glass {
        background: linear-gradient(180deg, rgba(30, 38, 84, 0.9), rgba(14, 18, 44, 0.9));
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
    }

    .capsule {
        border-radius: 20px;
    }

    .btn-press {
        transition: transform 0.08s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-press:active {
        transform: scale(0.96);
    }

    .glitch-text { animation: glitch 1s infinite; }

    .hud-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 12px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
    }

    .hud-card {
        min-width: 0;
        padding: 10px 14px;
        color: var(--text);
    }

    .label {
        font-size: 10px;
        line-height: 1.1;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        font-family: 'Orbitron', 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
    }

    .zone-value {
        margin-top: 4px;
        font-size: 20px;
        line-height: 1.05;
        font-weight: 700;
        text-shadow: 0 0 14px rgba(113, 231, 255, 0.25);
    }

    .coin-value {
        margin-top: 4px;
        font-size: 24px;
        line-height: 1;
        font-weight: 700;
        color: var(--coin);
        text-shadow: 0 0 14px rgba(255, 217, 90, 0.28);
    }

    .notification-area {
        position: absolute;
        top: 24%;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
    }

    #gif-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 1px;
    }

    #gif-overlay img {
        display: block;
        width: min(42vw, 180px);
        max-width: 100%;
        height: auto;
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.28));
    }

    #gif-overlay.show img {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    #gif-overlay.impact img {
        width: min(34vw, 132px);
    }

    .bottom-controls {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .weapon-panel {
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        overflow: hidden;
    }

    .weapon-panel::after {
        content: "";
        position: absolute;
        inset: auto -30% -70% 28%;
        height: 120px;
        background: radial-gradient(circle, rgba(113, 231, 255, 0.24), transparent 62%);
        pointer-events: none;
    }

    .weapon-icon {
        position: relative;
        width: 58px;
        height: 58px;
        flex: 0 0 58px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #fff;
        background: linear-gradient(145deg, rgba(255,255,255,0.24), rgba(255,255,255,0.08));
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 12px 24px rgba(0,0,0,0.22);
    }

    .weapon-icon::before {
        content: "⚔️";
        position: absolute;
        inset: -10px auto auto -10px;
        font-size: 14px;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .weapon-copy {
        position: relative;
        z-index: 1;
        flex: 1;
        min-width: 0;
    }

    .weapon-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.05;
        font-weight: 700;
    }

    .weapon-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
    }

    .button-row {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
    }

    .action-btn {
        position: relative;
        flex: 1;
        border: 0;
        border-radius: 18px;
        min-height: 72px;
        padding: 12px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        overflow: hidden;
        box-shadow: var(--shadow);
    }

    .action-btn:disabled {
        cursor: default;
    }

    .action-btn .btn-title {
        position: relative;
        z-index: 1;
        display: block;
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: 17px;
        line-height: 1.05;
        letter-spacing: 0.03em;
    }

    .action-btn .btn-subtitle {
        position: relative;
        z-index: 1;
        display: block;
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.15;
        color: inherit;
        opacity: 0.88;
    }

    .action-btn::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 17px;
        opacity: 0.9;
        pointer-events: none;
    }

    .action-btn.roll {
        color: #061321;
        background: linear-gradient(180deg, #77efff, #2bc4ff);
        border: 1px solid rgba(255,255,255,0.28);
        text-shadow: 0 1px 0 rgba(255,255,255,0.24);
    }

    .action-btn.zone {
        color: var(--text);
        background: linear-gradient(180deg, rgba(95, 103, 198, 0.92), rgba(52, 64, 145, 0.92));
        border: 1px solid rgba(144, 171, 255, 0.26);
    }

    .action-btn.zone::before {
        background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
    }

    .start-screen {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;

    }

    .start-shell {
        width: min(100%, 420px);
        padding: 24px 20px 22px;
        border-radius: 28px;
        position: relative;
        overflow: hidden;
    }

    .start-shell::before,
    .start-shell::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
    }

    .start-shell::before {
        width: 180px;
        height: 180px;
        top: -86px;
        right: -56px;
        background: radial-gradient(circle, rgba(113, 231, 255, 0.32), transparent 68%);
    }

    .start-shell::after {
        width: 180px;
        height: 180px;
        bottom: -92px;
        left: -48px;
        background: radial-gradient(circle, rgba(255, 92, 138, 0.22), transparent 68%);

        border: 1px solid rgba(255,255,255,0.18);

        box-shadow: 0 16px 40px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.15);
        position: relative;
    }

    .hero-badge .emoji {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        line-height: 1;
        filter: drop-shadow(0 0 10px rgba(113, 231, 255, 0.28));
    }

    .hero-badge .emoji.face {
        top: 18px;
        font-size: 34px;
    }

    .hero-badge .emoji.body {
        top: 50px;
        font-size: 36px;
    }

    .hero-badge .emoji.blade {
        top: 54px;
        left: calc(50% + 20px);
        font-size: 28px;
        transform: rotate(-18deg);
    }

    .title {
        margin: 0;
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: clamp(28px, 7vw, 44px);
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-shadow: 0 0 22px rgba(113, 231, 255, 0.28);
        position: relative;
        z-index: 1;
    }

    .subtitle {
        margin: 12px auto 18px;
        max-width: 280px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.35;
        position: relative;
        z-index: 1;
    }

    .start-btn {
        position: relative;
        z-index: 1;
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        min-width: 190px;
        color: #061321;
        background: linear-gradient(180deg, #ffd95a, #ffb82e);
        font-family: 'Orbitron', 'Rajdhani', sans-serif;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 16px 28px rgba(0,0,0,0.28), 0 0 18px rgba(255, 217, 90, 0.28);
        animation: floatPulse 1.7s ease-in-out infinite;
    }

    .shake {
        animation: nudge 0.2s linear 2;
    }

    @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
    }

    @keyframes floatPulse {
        0%, 100% { transform: translateY(0); box-shadow: 0 16px 28px rgba(0,0,0,0.28), 0 0 18px rgba(255, 217, 90, 0.28); }
        50% { transform: translateY(-3px); box-shadow: 0 20px 34px rgba(0,0,0,0.34), 0 0 24px rgba(255, 217, 90, 0.38); }
    }

    @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
    }

    @media (max-width: 640px) {
        .hud-layer {
            padding: 10px;
        }

        .hud-card {
            padding: 9px 12px;
        }

        .zone-value {
            font-size: 16px;
        }

        .coin-value {
            font-size: 21px;
        }

        .weapon-panel {
            max-width: none;
            padding: 10px;
            gap: 10px;
        }

        .weapon-icon {
            width: 52px;
            height: 52px;
            flex-basis: 52px;
            font-size: 24px;
        }

        .weapon-title {
            font-size: 18px;
        }

        .button-row {
            max-width: none;
            gap: 8px;
        }

        .action-btn {
            min-height: 68px;
            padding: 10px 10px 9px;
        }

        .action-btn .btn-title {
            font-size: 14px;
        }

        .action-btn .btn-subtitle {
            font-size: 11px;
        }

        .start-shell {
            padding: 22px 16px 20px;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 16px;
        }

        .start-btn {
            width: 100%;
            min-width: 0;
            font-size: 17px;
        }
    }
</style>
</head>

<script>
// §3.1 Config
window.gameConfigDefs = {
    "gameSpeed": { "type": "number", "label": "Game Speed", "value": 1, "min": 0.5, "max": 3 },
    "autoRoll": { "type": "boolean", "label": "Auto Roll Mode", "value": false }
};
window.gameConfig = { gameSpeed: 1, autoRoll: false };
window.updateGameConfig = (k, v) => {
    if(window.gameConfigDefs[k]) window.gameConfig[k] = v;
};

// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgm = document.getElementById('bgm_main');
        this.sfxMap = {
            'start': document.getElementById('sfx_start'),
            'roll': document.getElementById('sfx_roll'),
            'hit': document.getElementById('sfx_hit'),
            'coin': document.getElementById('sfx_coin'),
            'fail': document.getElementById('sfx_fail'),
            'win': document.getElementById('sfx_win')
        };
        this.unlocked = false;
        this.lastPlayed = new Map();
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgm.volume = 0.2;
        this.bgm.play().catch(() => {});
        this.unlocked = true;
    }

    playSfx(id) {
        if (!this.unlocked) return;
        const now = performance.now();
        const minInterval = id === 'hit' ? 90 : 140;
        if (now - (this.lastPlayed.get(id) || 0) < minInterval) return;
        this.lastPlayed.set(id, now);

        const sound = this.sfxMap[id];
        if (sound) {
            sound.pause();
            sound.currentTime = 0;
            sound.volume = id === 'hit' ? 0.42 : id === 'coin' ? 0.4 : 0.48;
            sound.play().catch(() => this.synthesize(id));
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'fail') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.16);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
}

// Game Data
const TIERS = [
    { id: 'wood', name: 'Wood Sword', color: '#8B4513', power: 10, cost: 10, chance: 100 },
    { id: 'iron', name: 'Iron Sword', color: '#71797E', power: 25, cost: 50, chance: 60 },
    { id: 'gold', name: 'Gold Sword', color: '#FFD700', power: 50, cost: 200, chance: 40 },
    { id: 'diamond', name: 'Diamond Sword', color: '#00FFFF', power: 100, cost: 1000, chance: 20 },
    { id: 'netherite', name: 'Netherite', color: '#313131', power: 250, cost: 5000, chance: 10 },
    { id: 'glitch', name: 'Glitched Sword', color: '#00FF00', power: 666, cost: 20000, chance: 5, effect: 'glitch' },
    { id: 'end', name: 'End Blade', color: '#9400D3', power: 1500, cost: 100000, chance: 2 },
    { id: 'laser', name: 'Laser 4.10', color: '#FF0000', power: 9999, cost: 1000000, chance: 0.1, effect: 'glow' }
];

const ZONES = [
    { name: "Wood Forest", bg: "#e8f5e9", enemyColor: "#4CAF50", hpMult: 1, coinMult: 1, req: 'wood' },
    { name: "Iron City", bg: "#eceff1", enemyColor: "#607D8B", hpMult: 3, coinMult: 2, req: 'iron' },
    { name: "Gold Mine", bg: "#fffde7", enemyColor: "#FBC02D", hpMult: 8, coinMult: 4, req: 'gold' },
    { name: "Diamond Cave", bg: "#e0f7fa", enemyColor: "#00BCD4", hpMult: 20, coinMult: 8, req: 'diamond' },
    { name: "Nether Wastes", bg: "#ffebee", enemyColor: "#D32F2F", hpMult: 50, coinMult: 16, req: 'netherite' },
    { name: "Glitch Void", bg: "#000000", enemyColor: "#00FF00", hpMult: 150, coinMult: 35, req: 'glitch' },
    { name: "The End", bg: "#f3e5f5", enemyColor: "#7B1FA2", hpMult: 500, coinMult: 100, req: 'end' },
    { name: "Final Reality", bg: "#ffffff", enemyColor: "#000000", hpMult: 2000, coinMult: 500, req: 'laser' }
];

const ZONE_STYLE = [
    { skyA: '#203b3f', skyB: '#0f1a20', fog: 'rgba(83, 220, 171, 0.18)', ground: '#203a2a', stripe: '#7be47d' },
    { skyA: '#233149', skyB: '#111622', fog: 'rgba(157, 210, 255, 0.18)', ground: '#1a212d', stripe: '#9ec8ff' },
    { skyA: '#4a3c10', skyB: '#18110b', fog: 'rgba(255, 213, 86, 0.2)', ground: '#3d2f0c', stripe: '#ffd95a' },
    { skyA: '#0a3841', skyB: '#09131d', fog: 'rgba(104, 245, 255, 0.2)', ground: '#122738', stripe: '#71e7ff' },
    { skyA: '#421217', skyB: '#18090a', fog: 'rgba(255, 102, 124, 0.18)', ground: '#301317', stripe: '#ff758f' },
    { skyA: '#050505', skyB: '#120019', fog: 'rgba(0, 255, 120, 0.12)', ground: '#080808', stripe: '#00ff88' },
    { skyA: '#2d183b', skyB: '#110919', fog: 'rgba(219, 144, 255, 0.18)', ground: '#29143a', stripe: '#da8eff' },
    { skyA: '#f5f7ff', skyB: '#d1d7ec', fog: 'rgba(0, 0, 0, 0.08)', ground: '#d9dce8', stripe: '#161926' }
];

// Game State
let state = {
    coins: 0,
    currentZone: 0,
    weaponIdx: 0,
    enemies: [],
    particles: [],
    texts: [],
    hero: { x: 0, y: 0, attackTimer: 0, target: null },
    screenShake: 0,
    lastTime: 0
};

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new AudioManager();
    
    // UI Elements
    const ui = {
        coins: document.getElementById('coin-display'),
        zone: document.getElementById('zone-display'),
        wName: document.getElementById('weapon-name'),
        wPower: document.getElementById('weapon-power'),
        wIcon: document.getElementById('weapon-icon'),
        rollBtn: document.getElementById('roll-btn'),
        rollCost: document.getElementById('roll-cost'),
        zoneBtn: document.getElementById('zone-btn'),
        zoneReq: document.getElementById('zone-req'),
        startScreen: document.getElementById('start-screen'),
        startBtn: document.getElementById('start-btn'),
        notify: document.getElementById('notification-area')
    };

    const gifOverlay = document.getElementById('gif-overlay');
    const GIFS = {
        rare: 'https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp',
        impact: 'https://i.giphy.com/rtxxvAkfoOALPS75m2.webp'
    };
    let activeGifTimer = null;
    let width, height;
    let lastActionAt = 0;

    function showGif(type, duration = 950) {
        if (!gifOverlay) return;
        clearTimeout(activeGifTimer);
        const src = GIFS[type];
        if (!src) return;
        gifOverlay.innerHTML = `<img src="${src}" alt="" />`;
        gifOverlay.className = `show ${type}`;
        activeGifTimer = setTimeout(() => {
            gifOverlay.className = '';
            gifOverlay.innerHTML = '';
        }, duration);
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        state.hero.x = width * 0.2;
        state.hero.y = height * 0.6;
    }
    window.addEventListener('resize', resize);
    resize();

    function runUiAction(action) {
        const now = performance.now();
        if (now - lastActionAt < 220) return;
        lastActionAt = now;
        action();
    }

    // Input Handling
    ui.startBtn.addEventListener('click', () => {
        if (ui.startScreen.style.display === 'none') return;
        ui.startScreen.style.display = 'none';
        audio.unlock();
        audio.playSfx('start');
        spawnEnemy();
        updateUI();
    });

    // [agent-note][stage4] repaired: mobile-action-path | reason: keep native click support and avoid pointer-only CTA dependence
    ui.rollBtn.addEventListener('click', () => {
        if (ui.rollBtn.disabled) return;
        runUiAction(attemptRoll);
    });
    ui.rollBtn.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') return;
        e.preventDefault();
    });

    ui.zoneBtn.addEventListener('click', () => {
        if (ui.zoneBtn.disabled) return;
        runUiAction(attemptZoneUpgrade);
    });
    ui.zoneBtn.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') return;
        e.preventDefault();
    });

    function attemptRoll() {
        let nextTierIdx = Math.min(state.weaponIdx + 1, TIERS.length - 1);
        let cost = TIERS[nextTierIdx].cost;
        
        if (state.weaponIdx >= TIERS.length - 1) cost = TIERS[TIERS.length - 1].cost;

        if (state.coins >= cost) {
            state.coins -= cost;
            audio.playSfx('roll');
            
            let roll = Math.random() * 100;
            let targetTier = TIERS[nextTierIdx];
            
            if (roll < targetTier.chance) {
                state.weaponIdx = nextTierIdx;
                spawnFloatingText("UPGRADE!", width / 2, height / 2, targetTier.color, 40);
                state.screenShake = 10;
                audio.playSfx('win');
                
                if (nextTierIdx >= 4) {
                    for (let i = 0; i < 20; i++) spawnParticle(width / 2, height / 2, targetTier.color);
                }
            } else {
                spawnFloatingText("FAIL", width / 2, height / 2, "#c9d2ff", 30);
                audio.playSfx('fail');
            }
                if (targetTier.chance <= 10 || targetTier.power >= 250) {
                    showGif('rare', 1200);
                }
            updateUI();
        } else {
            ui.rollBtn.classList.add('shake');
            audio.playSfx('fail');
            setTimeout(() => ui.rollBtn.classList.remove('shake'), 200);
        }
    }

    function attemptZoneUpgrade() {
        if (state.currentZone >= ZONES.length - 1) return;
        
        let nextZone = ZONES[state.currentZone + 1];
        let reqTier = TIERS.findIndex(t => t.id === nextZone.req);
        
        if (state.weaponIdx >= reqTier) {
            state.currentZone++;
            state.enemies = [];
            spawnFloatingText("ZONE UNLOCKED!", width / 2, height / 3, "#ffffff", 40);
            audio.playSfx('win');
            showGif('rare', 1100);
            updateUI();
        }
    }

    function updateUI() {
        ui.coins.innerText = Math.floor(state.coins);
        ui.zone.innerText = (state.currentZone + 1) + ". " + ZONES[state.currentZone].name;
        
        let w = TIERS[state.weaponIdx];
        ui.wName.innerText = w.name;
        ui.wName.style.color = w.color;
        ui.wPower.innerText = w.power;
        ui.wIcon.style.background = `linear-gradient(145deg, ${w.color}, rgba(255,255,255,0.16))`;
        ui.wIcon.style.boxShadow = `inset 0 1px 0 rgba(255,255,255,0.18), 0 0 18px ${w.color}55`;
        ui.wIcon.innerText = w.effect === 'laser' ? '💥' : (w.effect === 'glitch' ? '🌀' : '🗡️');
        
        if (w.effect === 'glitch') ui.wName.className = "weapon-title glitch-text";
        else if (w.effect === 'glow') ui.wName.className = "weapon-title";
        else ui.wName.className = "weapon-title";

        let nextIdx = Math.min(state.weaponIdx + 1, TIERS.length - 1);
        let nextTier = TIERS[nextIdx];
        let cost = nextTier.cost;
        if (state.weaponIdx >= TIERS.length - 1) {
            ui.rollBtn.innerHTML = `<span class="btn-title">MAX LEVEL</span>`;
            ui.rollBtn.disabled = true;
            ui.rollBtn.style.opacity = 0.5;
        } else {
            ui.rollBtn.innerHTML = `<span class="btn-title">ROLL ${nextTier.name.split(' ')[0].toUpperCase()}</span><span class="btn-subtitle">Cost: ${cost} (${nextTier.chance}%)</span>`;
            ui.rollBtn.style.opacity = state.coins >= cost ? 1 : 0.55;
            ui.rollBtn.disabled = false;
        }

        if (state.currentZone < ZONES.length - 1) {
            let nextZone = ZONES[state.currentZone + 1];
            let reqTier = TIERS.findIndex(t => t.id === nextZone.req);
            let canUpgrade = state.weaponIdx >= reqTier;
            ui.zoneBtn.innerHTML = `<span class="btn-title">NEXT ZONE</span><span id="zone-req" class="btn-subtitle">Req: ${TIERS[reqTier].name}</span>`;
            ui.zoneReq = document.getElementById('zone-req');
            ui.zoneBtn.style.opacity = canUpgrade ? 1 : 0.38;
            ui.zoneBtn.style.filter = canUpgrade ? 'saturate(1.15)' : 'grayscale(0.12)';
            ui.zoneBtn.disabled = false;
        } else {
            ui.zoneBtn.innerHTML = `<span class="btn-title">GAME COMPLETED</span>`;
            ui.zoneBtn.disabled = true;
            ui.zoneBtn.style.opacity = 0.5;
        }
    }

    function spawnEnemy() {
        let zone = ZONES[state.currentZone];
        let hp = 20 * zone.hpMult;
        state.enemies.push({
            x: width + 50,
            y: state.hero.y,
            hp: hp,
            maxHp: hp,
            speed: 1 + Math.random() * 1.5,
            color: zone.enemyColor,
            scale: 0.8 + Math.random() * 0.4
        });
    }

    function spawnParticle(x, y, color) {
        state.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1,
            color
        });
    }

    function spawnFloatingText(text, x, y, color, size = 20) {
        state.texts.push({
            text, x, y, color, size,
            life: 1, vy: -2
        });
    }

    function drawBackground(zoneStyle) {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
        skyGradient.addColorStop(0, zoneStyle.skyA);
        skyGradient.addColorStop(1, zoneStyle.skyB);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < 4; i++) {
            ctx.fillStyle = zoneStyle.fog;
            ctx.beginPath();
            ctx.ellipse(width * (0.18 + i * 0.26), height * (0.24 + (i % 2) * 0.1), 120 + i * 20, 48 + i * 8, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.strokeStyle = zoneStyle.stripe + '66';
        ctx.lineWidth = 1;
        for (let i = 0; i < 7; i++) {
            const y = height * 0.18 + i * 28;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }

        ctx.fillStyle = zoneStyle.ground;
        ctx.fillRect(0, state.hero.y + 30, width, height - (state.hero.y + 30));

        ctx.fillStyle = zoneStyle.stripe + '22';
        for (let i = 0; i < width; i += 36) {
            ctx.fillRect(i, state.hero.y + 30, 18, 5);
        }
    }

    function drawStickman(ctx, x, y, color, isHero, weaponTier) {
        const bob = isHero ? Math.sin(Date.now() / 180) * 1.5 : Math.sin((Date.now() + x * 9) / 240) * 1.2;
        const yPos = y + bob;

        if (isHero) {
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.fillStyle = color + '22';
            ctx.arc(x, yPos - 12, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.strokeStyle = color;
        ctx.lineWidth = isHero ? 4 : 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(x, yPos - 20);
        ctx.lineTo(x, yPos + 12);

        ctx.moveTo(x, yPos + 12);
        ctx.lineTo(x - 11, yPos + 32);
        ctx.moveTo(x, yPos + 12);
        ctx.lineTo(x + 12, yPos + 32);

        ctx.moveTo(x, yPos - 9);
        if (isHero) {
            let offset = Math.sin(Date.now() / 100) * 5;
            ctx.lineTo(x + 15 + offset, yPos - 6);

            let w = TIERS[weaponTier];
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.strokeStyle = w.color;
            ctx.lineWidth = w.effect === 'laser' ? 7 : 5;
            if (w.effect === 'glitch') ctx.lineWidth = Math.random() * 4 + 2;
            ctx.shadowBlur = w.effect === 'laser' || w.effect === 'glow' ? 16 : 8;
            ctx.shadowColor = w.color;
            ctx.moveTo(x + 15 + offset, yPos - 6);
            ctx.lineTo(x + 48 + offset, yPos - 18);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.moveTo(x + 15 + offset, yPos - 6);
            ctx.lineTo(x + 23 + offset, yPos - 10);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.moveTo(x, yPos - 9);
            ctx.lineTo(x - 10, yPos + 6);
        } else {
            ctx.lineTo(x - 10, yPos + 5);
            ctx.moveTo(x, yPos - 9);
            ctx.lineTo(x + 10, yPos + 5);
        }
        ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = isHero ? '#ffe4be' : '#f4f7ff';
        ctx.arc(x, yPos - 25, isHero ? 10 : 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = color;
        ctx.stroke();

        ctx.fillStyle = '#141414';
        ctx.beginPath();
        ctx.arc(x - 3, yPos - 26, 1.2, 0, Math.PI * 2);
        ctx.arc(x + 3, yPos - 26, 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = '#141414';
        ctx.lineWidth = 1.5;
        if (isHero) {
            ctx.moveTo(x - 3.5, yPos - 21);
            ctx.quadraticCurveTo(x, yPos - 18.5, x + 4, yPos - 21);
        } else {
            ctx.moveTo(x - 3.5, yPos - 20);
            ctx.quadraticCurveTo(x, yPos - 22.5, x + 4, yPos - 20);
        }
        ctx.stroke();
        ctx.restore();

        if (isHero) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x - 9, yPos - 34, 3, 0, Math.PI * 2);
            ctx.arc(x + 9, yPos - 34, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function gameLoop(timestamp) {
        try {
            if (!state.lastTime) state.lastTime = timestamp;
            const dt = (timestamp - state.lastTime) / 16.67;
            state.lastTime = timestamp;

            const gs = window.gameConfig.gameSpeed;
            const zoneStyle = ZONE_STYLE[state.currentZone];

            drawBackground(zoneStyle);
            
            if (state.screenShake > 0) {
                let dx = (Math.random() - 0.5) * state.screenShake;
                let dy = (Math.random() - 0.5) * state.screenShake;
                ctx.translate(dx, dy);
                state.screenShake *= 0.9;
                if (state.screenShake < 0.5) state.screenShake = 0;
            }

            ctx.beginPath();
            ctx.moveTo(0, state.hero.y + 30);
            ctx.lineTo(width, state.hero.y + 30);
            ctx.strokeStyle = zoneStyle.stripe;
            ctx.lineWidth = 2;
            ctx.stroke();

            drawStickman(ctx, state.hero.x, state.hero.y, "#eaf7ff", true, state.weaponIdx);

            if (state.enemies.length < 3 && Math.random() < 0.02 * gs) spawnEnemy();

            state.enemies.forEach((e, i) => {
                if (e.x > state.hero.x + 40) {
                    e.x -= e.speed * gs;
                }

                if (e.x < state.hero.x + 80) {
                    if (Math.random() < 0.1 * gs) {
                        let dmg = TIERS[state.weaponIdx].power;
                        e.hp -= dmg;
                        spawnFloatingText("-" + dmg, e.x, e.y - 40, "#ff8ba7", 24);
                        spawnParticle(e.x, e.y, "#fff");
                        audio.playSfx('hit');
                        state.screenShake = 2;
                        
                        if (e.hp <= 0) {
                            let zone = ZONES[state.currentZone];
                            let coins = Math.floor(10 * zone.coinMult * (1 + Math.random()));
                            state.coins += coins;
                            audio.playSfx('coin');
                            spawnFloatingText("+" + coins, e.x, e.y - 60, "#ffd95a", 30);
                            state.enemies.splice(i, 1);
                            updateUI();
                            showGif('impact', 700);
                            
                            for (let j = 0; j < 8; j++) spawnParticle(e.x, e.y, e.color);
                        }
                    }
                }

                drawStickman(ctx, e.x, e.y, e.color, false, 0);
                
                ctx.fillStyle = "rgba(35, 12, 22, 0.8)";
                ctx.fillRect(e.x - 18, e.y - 48, 36, 6);
                ctx.fillStyle = "#ff6488";
                ctx.fillRect(e.x - 18, e.y - 48, 36 * (Math.max(0, e.hp) / e.maxHp), 6);
            });

            state.particles.forEach((p, i) => {
                p.x += p.vx * gs;
                p.y += p.vy * gs;
                p.life -= 0.02 * gs;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
                if (p.life <= 0) state.particles.splice(i, 1);
            });

            state.texts.forEach((t, i) => {
                t.y += t.vy * gs;
                t.life -= 0.015 * gs;
                ctx.globalAlpha = Math.max(0, t.life);
                ctx.fillStyle = t.color;
                ctx.font = "bold " + t.size + "px 'Rajdhani'";
                ctx.textAlign = "center";
                ctx.fillText(t.text, t.x, t.y);
                ctx.globalAlpha = 1;
                if (t.life <= 0) state.texts.splice(i, 1);
            });

            ctx.textAlign = "start";
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

            void dt;
        } catch (e) {
            console.error(e);
        }
        requestAnimationFrame(gameLoop);
    }

    updateUI();
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
