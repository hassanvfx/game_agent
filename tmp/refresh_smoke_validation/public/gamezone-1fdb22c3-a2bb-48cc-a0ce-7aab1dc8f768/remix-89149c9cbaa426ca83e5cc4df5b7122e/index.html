<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Glam Lab - Style Loadout</title>
    <!-- [agent-note][stage4] remapped-fonts: ui/body -> Rajdhani, display/highlights -> Orbitron from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg-night: #090816;
            --bg-deep: #171331;
            --panel-core: rgba(18, 18, 34, 0.88);
            --panel-glow: rgba(92, 229, 255, 0.22);
            --accent-cyan: #78ecff;
            --accent-pink: #ff6eb8;
            --accent-gold: #ffd166;
            --accent-violet: #8b73ff;
            --text-soft: rgba(244, 246, 255, 0.8);
            --edge-light: rgba(255, 255, 255, 0.14);
        }

        /* Base & Reset */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background:
                radial-gradient(circle at top, rgba(120, 236, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-night));
            color: #ffffff;
            font-family: "Rajdhani", system-ui, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex: 1 1 auto; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .overflow-hidden { overflow: hidden; }
        .overflow-x-auto { overflow-x: auto; }
        .flex-shrink-0 { flex-shrink: 0; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-5 { gap: 1.25rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-5 { padding-top: 1.25rem; padding-bottom: 1.25rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .pt-safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .mb-1 { margin-bottom: 0.25rem; }

        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }

        .w-2 { width: 0.5rem; }
        .h-2 { height: 0.5rem; }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }
        .w-12 { width: 3rem; }
        .w-14 { width: 3.5rem; }
        .h-14 { height: 3.5rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .w-24 { width: 6rem; }
        .h-24 { height: 6rem; }
        .text-white { color: #fff; }
        .text-white\/90 { color: rgba(255,255,255,0.9); }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-white\/70 { color: rgba(255,255,255,0.7); }
        .text-gray-900 { color: #111827; }
        .text-gray-300 { color: #d1d5db; }
        .text-blue-400 { color: #60a5fa; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-\[9px\] { font-size: 9px; line-height: 1.1; }
        .text-\[10px\] { font-size: 10px; line-height: 1.1; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-5xl { font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1; }
        .font-light { font-weight: 300; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-thin { font-weight: 300; }
        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-wide { letter-spacing: 0.04em; }
        .tracking-tighter { letter-spacing: -0.04em; }
        .tracking-\[0\.15em\] { letter-spacing: 0.15em; }
        .tracking-\[0\.2em\] { letter-spacing: 0.2em; }
        .tracking-\[0\.25em\] { letter-spacing: 0.25em; }
        .opacity-40 { opacity: 0.4; }
        .opacity-80 { opacity: 0.8; }
        .rounded-full { border-radius: 9999px; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-t-\[2rem\] { border-top-left-radius: 2rem; border-top-right-radius: 2rem; }
        .bg-gray-900 { background-color: #111827; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-blue-500 { background-color: #3b82f6; }
        .bg-blue-100 { background-color: #dbeafe; }
        .bg-green-500 { background-color: #22c55e; }
        .bg-white { background-color: #fff; }
        .bg-white\/5 { background-color: rgba(255,255,255,0.05); }
        .bg-white\/10 { background-color: rgba(255,255,255,0.1); }
        .bg-white\/15 { background-color: rgba(255,255,255,0.15); }
        .border { border-width: 1px; border-style: solid; }
        .border-white\/10 { border-color: rgba(255,255,255,0.1); }
        .border-white\/5 { border-color: rgba(255,255,255,0.05); }
        .ring-1 { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
        .shadow-2xl { box-shadow: 0 25px 50px rgba(0,0,0,0.45); }
        .shadow-lg { box-shadow: 0 10px 24px rgba(37,99,235,0.35); }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .bg-gradient-to-b { background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
        .bg-gradient-to-t { background: linear-gradient(to top, #111827, rgba(17,24,39,0.5), transparent); }
        .bg-gradient-to-br { background: linear-gradient(135deg, #3b82f6, #4f46e5); }
        .from-black\/60 {}
        .to-transparent {}
        .from-blue-500 {}
        .to-indigo-600 {}
        .mix-blend-overlay { mix-blend-mode: overlay; }
        .bg-cover { background-size: cover; }
        .bg-center { background-position: center; }
        .filter { filter: saturate(1.1); }
        .drop-shadow-md { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
        .group { position: relative; }
        .hover\:bg-blue-500:hover { background-color: #3b82f6; }
        .hover\:bg-white\/10:hover { background-color: rgba(255,255,255,0.1); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .active\:bg-blue-700:active { background-color: #1d4ed8; }
        .active\:bg-white\/20:active { background-color: rgba(255,255,255,0.2); }
        .active\:scale-95:active { transform: scale(0.95); }
        .transition-colors { transition: background-color 0.2s ease, color 0.2s ease; }
        .transition-all { transition: all 0.3s ease; }
        .transition-opacity { transition: opacity 0.7s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .duration-700 { transition-duration: 0.7s; }
        .transform { transform-origin: center; }
        .scale-x-0 { transform: scaleX(0); }
        .origin-left { transform-origin: left; }

        button {
            border: 0;
            cursor: pointer;
            font-family: "Rajdhani", system-ui, sans-serif;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            color: inherit;
        }

        strong, h1, #label-category, #btn-save, #btn-start, .brand-mark, .reaction-caption {
            font-family: "Orbitron", system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        #label-variant,
        .tab-btn,
        .brand-badge,
        .reaction-chip,
        .status-copy {
            font-family: "Rajdhani", system-ui, sans-serif;
        }

        #mainCanvas {
            filter: saturate(1.08) contrast(1.03);
        }

        /* UI Components - Neon idol arcade */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(25, 22, 52, 0.96), rgba(9, 8, 22, 0.96)),
                radial-gradient(circle at top, rgba(120, 236, 255, 0.1), transparent 44%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--edge-light);
            box-shadow: 0 -14px 38px rgba(0, 0, 0, 0.42);
        }

        .arcade-frame {
            position: relative;
            overflow: hidden;
        }

        .arcade-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 20%, rgba(255, 110, 184, 0.18), transparent 18%),
                radial-gradient(circle at 82% 14%, rgba(120, 236, 255, 0.18), transparent 16%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 16%);
            mix-blend-mode: screen;
        }

        .sparkle-strip {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.6;
            background-image: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.14) 48%, transparent 55%);
            background-size: 220% 100%;
            animation: sheenShift 5.5s linear infinite;
        }

        .brand-badge {
            padding: 0.38rem 0.78rem;
            border-radius: 999px;
            border: 1px solid rgba(120, 236, 255, 0.28);
            background: rgba(8, 12, 30, 0.44);
            box-shadow: 0 0 18px rgba(120, 236, 255, 0.08);
        }

        .control-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-color: rgba(120, 236, 255, 0.2);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 0 18px rgba(120, 236, 255, 0.08);
        }
        .control-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.15);
        }

        .tab-btn {
            opacity: 0.4;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(0.95);
        }
        .tab-btn.active {
            opacity: 1.0;
            transform: scale(1.05) translateY(-2px);
            background: linear-gradient(180deg, rgba(120,236,255,0.16), rgba(255,110,184,0.08));
            border-color: rgba(120,236,255,0.3);
            box-shadow: 0 8px 18px rgba(0,0,0,0.26);
        }
        .tab-btn.active::after {
            content: '';
            width: 4px; height: 4px;
            background: var(--accent-cyan);
            border-radius: 50%;
            margin-top: 6px;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        #tabs-container {
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes sheenShift {
            0% { background-position: 200% 0; }
            100% { background-position: -40% 0; }
        }
        .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .reaction-stack {
            position: absolute;
            right: 1rem;
            bottom: calc(env(safe-area-inset-bottom) + 11.75rem);
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
            pointer-events: none;
        }

        .reaction-chip {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            max-width: min(48vw, 14rem);
            padding: 0.55rem 0.8rem;
            border-radius: 999px;
            background: rgba(8, 12, 30, 0.82);
            border: 1px solid rgba(120, 236, 255, 0.2);
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
            color: rgba(255,255,255,0.88);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .reaction-chip.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .reaction-chip img {
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 0.9rem;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(255,255,255,0.08);
        }

        .reaction-copy {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .reaction-caption {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent-gold);
        }

        .reaction-copy strong {
            font-size: 0.82rem;
            line-height: 1.15;
            color: #fff;
        }

        .status-copy {
            position: absolute;
            left: 1rem;
            bottom: calc(env(safe-area-inset-bottom) + 11.75rem);
            z-index: 12;
            pointer-events: none;
            padding: 0.6rem 0.85rem;
            border-radius: 1rem;
            background: rgba(8, 12, 30, 0.78);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.72rem;
            color: rgba(255,255,255,0.82);
            letter-spacing: 0.05em;
            max-width: min(46vw, 13rem);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .status-copy.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .reaction-stack {
                right: 0.75rem;
                bottom: calc(env(safe-area-inset-bottom) + 10.5rem);
            }

            .reaction-chip {
                max-width: min(54vw, 12rem);
                padding: 0.5rem 0.7rem;
            }

            .reaction-chip img {
                width: 2.35rem;
                height: 2.35rem;
            }

            .status-copy {
                left: 0.75rem;
                bottom: calc(env(safe-area-inset-bottom) + 10.5rem);
                max-width: 9.5rem;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

<!-- Audio Context -->
<div id="audio-placeholder" style="display:none;"></div>

<!-- Main App -->
<div class="relative w-full h-full flex flex-col arcade-frame">
    
    <!-- Canvas Layer -->

        <div id="start-screen" class="absolute inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center pointer-events-auto transition-opacity duration-700">

// --- Audio System ---
const AudioSys = {
    ctx: null,
    masterGain: null,
    ambientGain: null,
    initialized: false,
    players: {},
    lastPlayed: new Map(),
    init: async () => {
        try {
            if (!AudioSys.ctx) {
                AudioSys.ctx = new (window.AudioContext || window.webkitAudioContext)();
                AudioSys.masterGain = AudioSys.ctx.createGain();
                AudioSys.masterGain.gain.value = 0.8;
                AudioSys.masterGain.connect(AudioSys.ctx.destination);

                AudioSys.ambientGain = AudioSys.ctx.createGain();
                AudioSys.ambientGain.gain.value = 0.18;
                AudioSys.ambientGain.connect(AudioSys.masterGain);

                AudioSys.players.start = new Audio(MEDIA.audio.start);
                AudioSys.players.click = new Audio(MEDIA.audio.click);
                AudioSys.players.blocked = new Audio(MEDIA.audio.blocked);
                AudioSys.players.swap = new Audio(MEDIA.audio.swap);
                AudioSys.players.save = new Audio(MEDIA.audio.save);
                AudioSys.players.loop = new Audio(MEDIA.audio.loop);

                Object.entries(AudioSys.players).forEach(([key, player]) => {
                    player.preload = 'auto';
                    player.crossOrigin = 'anonymous';
                    player.playsInline = true;
                    player.volume = key === 'loop' ? 0.2 : (key === 'save' ? 0.42 : 0.35);
                    if (key !== 'loop') {
                        player.addEventListener('ended', () => {
                            player.currentTime = 0;
                        });
                    }
                });

                AudioSys.players.loop.loop = true;
            }

            if (AudioSys.ctx.state === 'suspended') {
                await AudioSys.ctx.resume();
            }

            AudioSys.initialized = true;
            if (state.sound) {
                AudioSys.startLoop();
            }
        } catch (error) {
            AudioSys.initialized = false;
        }
    },
    safePlay: (key, cooldown = 0) => {
        if (!state.sound || !AudioSys.initialized) return;
        const player = AudioSys.players[key];
        if (!player) return;

        const now = performance.now();
        const last = AudioSys.lastPlayed.get(key) || 0;
        if (cooldown && now - last < cooldown) return;
        AudioSys.lastPlayed.set(key, now);

        try {
            player.pause();
            player.currentTime = 0;
            const playback = player.play();
            if (playback && typeof playback.catch === 'function') {
                playback.catch(() => {});
            }
        } catch (error) {}
    },
    startLoop: () => {
        const player = AudioSys.players.loop;
        if (!player || !state.sound || !AudioSys.initialized) return;
        try {
            player.volume = 0.2;
            const playback = player.play();
            if (playback && typeof playback.catch === 'function') {
                playback.catch(() => {});
            }
        } catch (error) {}
    },
    stopLoop: () => {
        const player = AudioSys.players.loop;
        if (!player) return;
        try {
            player.pause();
            player.currentTime = 0;
        } catch (error) {}
    },
    click: () => AudioSys.safePlay('click', 60),
    blocked: () => AudioSys.safePlay('blocked', 120),
    swap: () => AudioSys.safePlay('swap', 120),
    start: () => AudioSys.safePlay('start', 120),
    save: () => AudioSys.safePlay('save', 250)
};

const canvas = document.getElementById('mainCanvas');

const Color = {
    hexToRgb: (hex) => {
        const bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    },
    shade: (hex, percent) => {
        let [r,g,b] = Color.hexToRgb(hex);
        r = Math.max(0, Math.min(255, r * (1 + percent)));
        g = Math.max(0, Math.min(255, g * (1 + percent)));
        b = Math.max(0, Math.min(255, b * (1 + percent)));
        return `rgb(${r|0},${g|0},${b|0})`;
    }
};

function createNoise() {
    const nc = document.createElement('canvas');
    nc.width = 256; nc.height = 256;
    const nctx = nc.getContext('2d');
    const idata = nctx.createImageData(256, 256);
    for(let i=0; i<idata.data.length; i+=4) {
        const v = Math.random() * 20;
        idata.data[i] = v; idata.data[i+1] = v; idata.data[i+2] = v; idata.data[i+3] = 30;
    }
    nctx.putImageData(idata, 0, 0);
    return ctx.createPattern(nc, 'repeat');
}

const Renderer = {
    clear: (w, h) => {
        const bg = CONFIG.colors.bg[state.bg].hex;
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, Color.shade(bg, 0.1));
        grad.addColorStop(1, Color.shade(bg, -0.3));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Vignette
        const rGrad = ctx.createRadialGradient(w/2, h/2, h*0.3, w/2, h/2, h*0.8);
        rGrad.addColorStop(0, 'rgba(0,0,0,0)');
        rGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = rGrad;
        ctx.fillRect(0,0,w,h);
    },

    head: (cx, cy, s) => {
        const skinColor = CONFIG.colors.skin[state.skin].hex;
        
        // Neck
        ctx.fillStyle = Color.shade(skinColor, -0.25);
        ctx.beginPath();
        const neckW = 50 * s;
        ctx.moveTo(cx - neckW, cy + 80*s);
        ctx.quadraticCurveTo(cx, cy + 90*s, cx + neckW, cy + 80*s);
        ctx.lineTo(cx + neckW, cy + 180*s);
        ctx.lineTo(cx - neckW, cy + 180*s);
        ctx.fill();

        // Shadow under chin
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 95*s, 45*s, 15*s, 0, 0, Math.PI*2);
        ctx.fill();

        // Face Shape
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.moveTo(cx - 65*s, cy - 20*s);
        ctx.quadraticCurveTo(cx - 72*s, cy + 40*s, cx - 55*s, cy + 85*s); // Cheek
        ctx.quadraticCurveTo(cx - 30*s, cy + 120*s, cx, cy + 120*s); // Chin
        ctx.quadraticCurveTo(cx + 30*s, cy + 120*s, cx + 55*s, cy + 85*s);
        ctx.quadraticCurveTo(cx + 72*s, cy + 40*s, cx + 65*s, cy - 20*s);
        ctx.bezierCurveTo(cx + 65*s, cy - 110*s, cx - 65*s, cy - 110*s, cx - 65*s, cy - 20*s); // Forehead
        ctx.fill();

        // Skin Noise/Texture
        if(noisePattern) {
            ctx.globalCompositeOperation = 'overlay';
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = noisePattern;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';
        }

        // Blush
        const blushColor = 'rgba(200, 50, 50, 0.08)';
        ctx.fillStyle = blushColor;
        ctx.beginPath(); ctx.ellipse(cx - 45*s, cy + 55*s, 20*s, 12*s, -0.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx + 45*s, cy + 55*s, 20*s, 12*s, 0.2, 0, Math.PI*2); ctx.fill();

        // Ears
        ctx.fillStyle = skinColor;
        const earY = cy + 10*s;
        [ -1, 1 ].forEach(dir => {
            const ex = cx + (68 * s * dir);
            ctx.beginPath();
            ctx.ellipse(ex, earY, 10*s, 18*s, dir*0.2, 0, Math.PI*2);
            ctx.fill();
            // Ear shadow
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.arc(ex, earY + 2*s, 6*s, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = skinColor;
        });
    },

    eyelashes: (ex, ey, ew, eh, s, dir) => {
        const style = state.lashes;
        if (style === 0) return;

        ctx.strokeStyle = '#111';
        ctx.lineCap = 'round';
        
        let density = 6;
        let lenBase = 5*s;
        let lenVar = 2*s;
        let thick = 0.8*s;

        if (style === 2) { density = 14; lenBase = 6*s; thick = 1.2*s; }
        else if (style === 3) { density = 9; lenBase = 9*s; lenVar = 5*s; thick = 0.6*s; }
        else if (style === 4) { density = 10; lenBase = 5*s; }

        const count = density * 2;
        
        for(let i=0; i<=count; i++) {
            const t = i/count;
            const mt = 1-t;
            const bx = mt*mt*(ex-ew) + 2*mt*t*ex + t*t*(ex+ew);
            const by = mt*mt*ey + 2*mt*t*(ey-eh) + t*t*ey;

            let currentLen = lenBase + Math.random() * lenVar;
            if (style === 4) {
                const isOuter = (dir === -1 && t < 0.4) || (dir === 1 && t > 0.6);
                if (isOuter) currentLen *= 1.8;
                else currentLen *= 0.7;
            }

            const angle = Math.atan2(by - (ey + 10*s), bx - ex);
            ctx.lineWidth = thick;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            const tipX = bx + Math.cos(angle) * currentLen;
            const tipY = by + Math.sin(angle) * currentLen;
            ctx.lineTo(tipX, tipY);
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
    },

    features: (cx, cy, s) => {
        // Nose
        const ny = cy + 25*s;
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.beginPath();
        ctx.arc(cx - 11*s, ny + 12*s, 5*s, 0, Math.PI*2);
        ctx.arc(cx + 11*s, ny + 12*s, 5*s, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - 9*s, ny + 10*s);
        ctx.quadraticCurveTo(cx, ny + 16*s, cx + 9*s, ny + 10*s);
        ctx.lineTo(cx, ny + 7*s);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath(); ctx.rect(cx - 3*s, cy - 15*s, 6*s, 35*s); ctx.fill();

        // Mouth
        const my = cy + 65*s;
        const mw = 24*s;
        const mType = state.mouth;
        const lipColor = '#D48686';
        ctx.fillStyle = Color.shade(lipColor, -0.1);
        ctx.beginPath();
        ctx.moveTo(cx - mw, my);
        ctx.quadraticCurveTo(cx - mw/2, my - (mType===2?15:10)*s, cx, my - 4*s);
        ctx.quadraticCurveTo(cx + mw/2, my - (mType===2?15:10)*s, cx + mw, my);
        ctx.quadraticCurveTo(cx, my + 2*s, cx - mw, my);
        ctx.fill();
        ctx.fillStyle = Color.shade(lipColor, 0.1);
        ctx.beginPath();
        ctx.moveTo(cx - mw, my);
        ctx.quadraticCurveTo(cx, my + (mType===2?26:16)*s, cx + mw, my);
        ctx.quadraticCurveTo(cx, my + 2*s, cx - mw, my);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,40,40,0.3)';
        ctx.lineWidth = 1.5*s;
        ctx.beginPath();
        ctx.moveTo(cx - mw, my);
        if (mType === 1) ctx.quadraticCurveTo(cx, my + 5*s, cx + mw, my);
        else ctx.lineTo(cx + mw, my);
        ctx.stroke();

        // Eyes
        const ey = cy - 12*s;
        const ew = 19*s;
        const eh = (state.eyes === 0 ? 11 : state.eyes === 1 ? 9 : 13) * s;
        const exOffset = 34*s;
        const irisColor = CONFIG.colors.eyes[state.eyeColor].hex;

        [ -1, 1 ].forEach(dir => {
            const ex = cx + (exOffset * dir);
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(ex - ew, ey);
            ctx.quadraticCurveTo(ex, ey - eh, ex + ew, ey);
            ctx.quadraticCurveTo(ex, ey + eh, ex - ew, ey);
            ctx.clip();
            ctx.fillStyle = '#F0F0F0'; 
            ctx.fillRect(ex - ew, ey - eh, ew*2, eh*2);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.arc(ex, ey, ew, 0, Math.PI*2); ctx.fill();
            const irisSize = 9.5*s;
            const igrad = ctx.createRadialGradient(ex, ey, 2*s, ex, ey, irisSize);
            igrad.addColorStop(0, Color.shade(irisColor, 0.3));
            igrad.addColorStop(0.7, irisColor);
            igrad.addColorStop(1, '#1a1a1a');
            ctx.fillStyle = igrad;
            ctx.beginPath(); ctx.arc(ex, ey, irisSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#050505';
            ctx.beginPath(); ctx.arc(ex, ey, 4.5*s, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath(); 
            ctx.ellipse(ex - 3*s, ey - 3*s, 3*s, 2*s, -0.5, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 1.5*s;
            ctx.beginPath();
            ctx.moveTo(ex - ew, ey - 3*s);
            ctx.quadraticCurveTo(ex, ey - eh - 4*s, ex + ew, ey - 3*s);
            ctx.stroke();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2.5*s;
            ctx.beginPath();
            ctx.moveTo(ex - ew*1.05, ey);
            ctx.quadraticCurveTo(ex, ey - eh, ex + ew*1.05, ey);
            ctx.stroke();
            Renderer.eyelashes(ex, ey, ew, eh, s, dir);
            ctx.strokeStyle = CONFIG.colors.hair[state.hairColor].hex;
            ctx.lineWidth = 2*s;
            ctx.lineCap = 'round';
            const by = ey - 22*s;
            for(let i=0; i<9; i++) {
                let bx = ex - ew + (i*4.5*s);
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.quadraticCurveTo(bx + 5*s, by - 6*s, bx + 11*s, by + 2*s);
                ctx.stroke();
            }
        });
    },

    hairStrand: (x, y, len, angle, curve, color, s, width=1) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width * s;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.moveTo(x, y);
        const endX = x + Math.cos(angle) * len;
        const endY = y + Math.sin(angle) * len;
        const cpX = x + Math.cos(angle + curve) * (len/2);
        const cpY = y + Math.sin(angle + curve) * (len/2);
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    },

    hair: (cx, cy, s, isFront) => {
        const type = state.hair;
        const color = CONFIG.colors.hair[state.hairColor].hex;
        const darkColor = Color.shade(color, -0.4);
        const lightColor = Color.shade(color, 0.3);

        if (!isFront) {
            if (type === 0) return;
            const grad = ctx.createLinearGradient(cx, cy-50*s, cx, cy+150*s);
            grad.addColorStop(0, color);
            grad.addColorStop(1, darkColor);
            ctx.fillStyle = grad;
            if (type === 1) { // Bob
                ctx.beginPath(); ctx.arc(cx, cy, 82*s, Math.PI, 0); ctx.lineTo(cx + 85*s, cy + 110*s); ctx.lineTo(cx - 85*s, cy + 110*s); ctx.fill();
            } else if (type === 2) { // Long
                ctx.beginPath(); ctx.arc(cx, cy, 88*s, Math.PI, 0); ctx.lineTo(cx + 95*s, cy + 220*s); ctx.quadraticCurveTo(cx, cy + 240*s, cx - 95*s, cy + 220*s); ctx.fill();
            } else if (type === 3) { // Afro
                 for(let i=0; i<25; i++) {
                     let a = (i/25) * Math.PI * 2; let r = 90*s;
                     ctx.beginPath(); ctx.arc(cx + Math.cos(a)*r, cy + Math.sin(a)*r - 10*s, 28*s, 0, Math.PI*2); ctx.fill();
                 }
            } else if (type === 4) { // Side
                ctx.beginPath(); ctx.moveTo(cx, cy - 80*s); ctx.quadraticCurveTo(cx + 100*s, cy, cx + 80*s, cy + 200*s); ctx.lineTo(cx - 40*s, cy + 100*s); ctx.fill();
            }
        } else {
            if (type === 0) { // Pixie
                for(let i=0; i<45; i++) {
                    let rx = cx + (Math.random()-0.5) * 130 * s; let ry = cy - 85 * s + Math.random() * 20 * s;
                    Renderer.hairStrand(rx, ry, 45*s, Math.PI/2 + (Math.random()-0.5), 0.5, (i%3==0?lightColor:color), s, 2.5);
                }
            } else if (type === 1) { // Bob Sides
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(cx - 70*s, cy - 30*s); ctx.quadraticCurveTo(cx - 85*s, cy + 80*s, cx - 60*s, cy + 110*s); ctx.lineTo(cx - 50*s, cy - 30*s); ctx.fill();
                ctx.beginPath(); ctx.moveTo(cx + 70*s, cy - 30*s); ctx.quadraticCurveTo(cx + 85*s, cy + 80*s, cx + 60*s, cy + 110*s); ctx.lineTo(cx + 50*s, cy - 30*s); ctx.fill();
            } else if (type === 3) { // Afro Front
                 for(let i=0; i<12; i++) {
                     let a = Math.PI + (i/12) * Math.PI; let r = 78*s;
                     ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx + Math.cos(a)*r, cy + Math.sin(a)*r - 12*s, 22*s, 0, Math.PI*2); ctx.fill();
                 }
            } else if (type === 4) { // Side Sweep
                ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(cx - 60*s, cy - 40*s); ctx.quadraticCurveTo(cx, cy + 30*s, cx + 90*s, cy + 120*s); ctx.lineTo(cx + 70*s, cy - 50*s); ctx.fill();
            }
        }
    },

    bangs: (cx, cy, s) => {
        const type = state.bangs;
        if (type === 0) return;
        const color = CONFIG.colors.hair[state.hairColor].hex;
        const lightColor = Color.shade(color, 0.3);
        const topY = cy - 95*s;

        if (type === 1) { // Blunt
            for(let i=0; i<55; i++) {
                let x = cx - 65*s + (i * (130*s/55)); let curve = (Math.random()-0.5) * 0.15; let len = 70*s + Math.random()*12*s;
                if (x < cx - 45*s || x > cx + 45*s) len += 15*s;
                Renderer.hairStrand(x, topY + Math.random()*10*s, len, Math.PI/2, curve, (i%4===0?lightColor:color), s, 2.8);
            }
        } else if (type === 2) { // Curtain
            for(let i=0; i<65; i++) {
                let side = i < 32 ? -1 : 1; let xOffset = (i % 32) * 3.5 * s; let startX = cx + (side * xOffset);
                Renderer.hairStrand(startX, topY + 12*s, 95*s + Math.random()*25*s, Math.PI/2 + (side * 0.45), side * 0.9, (i%3===0?lightColor:color), s, 2.2);
            }
        } else if (type === 3) { // Wispy
            for(let i=0; i<30; i++) {
                let x = cx - 55*s + (Math.random() * 110*s);
                Renderer.hairStrand(x, topY + 12*s, 55*s + Math.random()*22*s, Math.PI/2 + (Math.random()-0.5)*0.3, 0.1, (i%2===0?lightColor:color), s, 1.8);
            }
        } else if (type === 4) { // Side-Swept
            for(let i=0; i<50; i++) {
                let x = cx - 65*s + (i * 2.8 * s);
                Renderer.hairStrand(x, topY, 85*s, Math.PI/2 + 0.6, 0.9, (i%3===0?lightColor:color), s, 2.8);
            }
        }
    },

    accessory: (cx, cy, s) => {
        const type = state.accessory;
        if (type === 0) return;

        const mainColor = CONFIG.colors.clothes[state.accessoryColor].hex;
        const darkColor = Color.shade(mainColor, -0.2);
        const lightColor = Color.shade(mainColor, 0.3);

        if (type === 1) { // Headband
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 15 * s;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, cy + 15*s, 86*s, Math.PI + 0.5, 2*Math.PI - 0.5);
            ctx.stroke();
            
            // Detail
            ctx.strokeStyle = lightColor;
            ctx.lineWidth = 3 * s;
            ctx.beginPath();
            ctx.arc(cx, cy + 15*s, 86*s, Math.PI + 0.5, 2*Math.PI - 0.5);
            ctx.stroke();

        } else if (type === 2) { // Big Bow
            const by = cy - 110 * s;
            ctx.fillStyle = mainColor;
            
            // Left Loop
            ctx.beginPath();
            ctx.moveTo(cx, by);
            ctx.bezierCurveTo(cx - 30*s, by - 40*s, cx - 90*s, by - 30*s, cx - 80*s, by + 10*s);
            ctx.bezierCurveTo(cx - 70*s, by + 40*s, cx - 20*s, by + 30*s, cx, by);
            ctx.fill();
            
            // Right Loop
            ctx.beginPath();
            ctx.moveTo(cx, by);
            ctx.bezierCurveTo(cx + 30*s, by - 40*s, cx + 90*s, by - 30*s, cx + 80*s, by + 10*s);
            ctx.bezierCurveTo(cx + 70*s, by + 40*s, cx + 20*s, by + 30*s, cx, by);
            ctx.fill();

            // Center Knot
            ctx.fillStyle = darkColor;
            ctx.beginPath();
            ctx.arc(cx, by, 12*s, 0, Math.PI*2);
            ctx.fill();

        } else if (type === 3) { // Cat Ears
            const earY = cy - 95 * s;
            
            [ -1, 1 ].forEach(dir => {
                const ex = cx + (50 * s * dir);
                ctx.fillStyle = mainColor;
                ctx.beginPath();
                ctx.moveTo(ex - 25*s, earY);
                ctx.quadraticCurveTo(ex + (dir*10*s), earY - 60*s, ex + 25*s, earY);
                ctx.fill();

                // Inner Ear
                ctx.fillStyle = '#FFD1DC'; // Pinkish inner
                ctx.beginPath();
                ctx.moveTo(ex - 15*s, earY);
                ctx.quadraticCurveTo(ex + (dir*5*s), earY - 40*s, ex + 15*s, earY);
                ctx.fill();
            });

        } else if (type === 4) { // Flower Crown
            const fy = cy - 90 * s;
            const colors = [mainColor, '#F0F0F0', lightColor, darkColor];
            
            for(let i=0; i<7; i++) {
                const fx = cx - 75*s + (i * 25*s);
                const fOffset = Math.sin(i)*5*s;
                
                // Petals
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.arc(fx, fy + fOffset, 14*s, 0, Math.PI*2);
                ctx.fill();
                
                // Center
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(fx, fy + fOffset, 4*s, 0, Math.PI*2);
                ctx.fill();
            }

        } else if (type === 5) { // Tiara
            const ty = cy - 100 * s;
            ctx.strokeStyle = '#FFD700'; // Gold
            ctx.lineWidth = 4 * s;
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(cx - 60*s, ty + 20*s);
            ctx.lineTo(cx - 30*s, ty - 10*s);
            ctx.lineTo(cx, ty + 10*s);
            ctx.lineTo(cx + 30*s, ty - 10*s);
            ctx.lineTo(cx + 60*s, ty + 20*s);
            ctx.stroke();

            // Gems
            ctx.fillStyle = mainColor; // Gem color from selection
            [cx-30*s, cx, cx+30*s].forEach((gx, i) => {
                ctx.beginPath();
                ctx.arc(gx, ty - (i===1?-10:10)*s - 5*s, 5*s, 0, Math.PI*2);
                ctx.fill();
            });
        }
    },

    shirt: (cx, cy, s) => {
        const cColor = CONFIG.colors.clothes[state.shirtColor].hex;
        ctx.fillStyle = cColor;
        
        ctx.beginPath();
        const shW = 145 * s;
        const shY = cy + 165 * s;
        ctx.moveTo(cx, cy + 140*s);
        ctx.quadraticCurveTo(cx - 65*s, cy + 140*s, cx - shW, shY);
        ctx.lineTo(cx - shW, cy + 450*s);
        ctx.lineTo(cx + shW, cy + 450*s);
        ctx.lineTo(cx + shW, shY);
        ctx.quadraticCurveTo(cx + 65*s, cy + 140*s, cx, cy + 140*s);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.moveTo(cx-shW, shY); ctx.quadraticCurveTo(cx-shW+20*s, shY+50*s, cx-shW+10*s, shY+100*s); ctx.lineTo(cx-shW, shY+100*s); ctx.fill();
        ctx.beginPath(); ctx.moveTo(cx+shW, shY); ctx.quadraticCurveTo(cx+shW-20*s, shY+50*s, cx+shW-10*s, shY+100*s); ctx.lineTo(cx+shW, shY+100*s); ctx.fill();

        if (state.shirt === 0) { // V-Neck
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.moveTo(cx - 65*s, cy + 140*s); ctx.lineTo(cx, cy + 210*s); ctx.lineTo(cx + 65*s, cy + 140*s); ctx.fill();
        } else if (state.shirt === 1) { // Crew
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 3*s; ctx.beginPath(); ctx.ellipse(cx, cy + 140*s, 65*s, 22*s, 0, 0, Math.PI*2); ctx.stroke();
        } else if (state.shirt === 2) { // Hoodie
             ctx.beginPath(); ctx.moveTo(cx, cy + 180*s); ctx.lineTo(cx, cy + 450*s); ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 3*s; ctx.stroke();
             ctx.strokeStyle = '#EEE'; ctx.lineWidth = 2*s;
             ctx.beginPath(); ctx.moveTo(cx-20*s, cy+180*s); ctx.quadraticCurveTo(cx-25*s, cy+220*s, cx-20*s, cy+250*s); ctx.stroke();
             ctx.beginPath(); ctx.moveTo(cx+20*s, cy+180*s); ctx.quadraticCurveTo(cx+25*s, cy+220*s, cx+20*s, cy+250*s); ctx.stroke();
        } else if (state.shirt === 3) { // Pajamas
            ctx.fillStyle = Color.shade(cColor, 0.2); 
            ctx.beginPath(); ctx.moveTo(cx, cy + 190*s); ctx.lineTo(cx - 45*s, cy + 145*s); ctx.lineTo(cx - 90*s, cy + 170*s); ctx.lineTo(cx, cy + 250*s); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx, cy + 190*s); ctx.lineTo(cx + 45*s, cy + 145*s); ctx.lineTo(cx + 90*s, cy + 170*s); ctx.lineTo(cx, cy + 250*s); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2*s;
            ctx.beginPath(); ctx.moveTo(cx - 45*s, cy + 145*s); ctx.lineTo(cx - 90*s, cy + 170*s); ctx.lineTo(cx, cy + 250*s); ctx.moveTo(cx + 45*s, cy + 145*s); ctx.lineTo(cx + 90*s, cy + 170*s); ctx.lineTo(cx, cy + 250*s); ctx.stroke();
            ctx.fillStyle = '#EEE';
            for(let i=0; i<3; i++) {
                const by = cy + 280*s + (i*55*s);
                ctx.beginPath(); ctx.arc(cx, by, 7*s, 0, Math.PI*2); ctx.fill();
            }
        }
    }
};

function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    
    if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        noisePattern = createNoise();
    }
    
    ctx.resetTransform();
    ctx.scale(dpr, dpr);

    Renderer.clear(rect.width, rect.height);

    const cx = rect.width / 2;
    const cy = rect.height * 0.42;
    const s = Math.min(rect.width, rect.height) * 0.0024;

    Renderer.hair(cx, cy, s, false);
    Renderer.shirt(cx, cy, s);
    Renderer.head(cx, cy, s);
    Renderer.features(cx, cy, s);
    Renderer.hair(cx, cy, s, true);
    Renderer.bangs(cx, cy, s);
    Renderer.accessory(cx, cy, s); // Render accessories on top
}

// --- Interaction ---
function showReaction(kind, message) {
    const el = document.getElementById(`reaction-${kind}`);
    if (!el) return;
    if (message) {
        const strong = el.querySelector('strong');
        if (strong) strong.textContent = message;
    }
    el.classList.add('show');
    clearTimeout(reactionTimers[kind]);
    reactionTimers[kind] = setTimeout(() => el.classList.remove('show'), kind === 'save' ? 1800 : 1200);
}

function showStatus(message) {
    const el = document.getElementById('status-copy');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function initUI() {
    const tabs = document.getElementById('tabs-container');
    
    CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn flex-shrink-0 w-16 h-16 rounded-2xl bg-white/5 border border-white/10`;
        btn.innerHTML = `<span class="text-2xl mb-1 filter drop-shadow-md">${cat.icon}</span><span class="text-[9px] uppercase tracking-wider text-white/70 font-semibold">${cat.label}</span>`;
        btn.onclick = () => selectCategory(cat.id, btn);
        tabs.appendChild(btn);
    });

    const startTabIdx = CATEGORIES.findIndex(c => c.id === state.activeCat);
    selectCategory(state.activeCat, tabs.children[startTabIdx]);

    document.getElementById('btn-prev').onclick = () => changeItem(-1);
    document.getElementById('btn-next').onclick = () => changeItem(1);
    document.getElementById('btn-sound').onclick = async (e) => {
        if (!AudioSys.initialized) await AudioSys.init();
        state.sound = !state.sound;
        e.currentTarget.style.opacity = state.sound ? '1' : '0.5';
        e.currentTarget.innerText = state.sound ? '🔊' : '🔇';
        if (state.sound) {
            AudioSys.startLoop();
            AudioSys.click();
            showStatus('Soundcheck on. Arcade ambience live.');
        } else {
            AudioSys.stopLoop();
            showStatus('Sound muted. Visual remix stays active.');
        }
    };
    document.getElementById('btn-save').onclick = () => {
        AudioSys.save();
        showReaction('save', 'Runway lock confirmed');
        showStatus('Look locked with a spotlight flourish.');
        const btn = document.getElementById('btn-save');
        const originalText = btn.innerText;
        btn.innerText = "LOOK LOCKED";
        btn.classList.add('bg-green-500');
        setTimeout(() => {
            btn.innerText = originalText;
            btn.classList.remove('bg-green-500');
        }, 1500);
    };
}

function selectCategory(catId, btnEl) {
    AudioSys.click();
    state.activeCat = catId;
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-white/15'));
    btnEl.classList.add('active', 'bg-white/15');
    
    const catData = CATEGORIES.find(c => c.id === catId);
    document.getElementById('label-category').innerText = catData.label;
    updateLabel();
    
    btnEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function changeItem(dir) {
    const cat = state.activeCat;
    const before = getValue(cat);

    if (cat === 'skin') state.skin = wrap(state.skin + dir, CONFIG.colors.skin.length);
    else if (cat === 'hair') state.hair = wrap(state.hair + dir, 5);
    else if (cat === 'bangs') state.bangs = wrap(state.bangs + dir, CONFIG.styles.bangs.length);
    else if (cat === 'hairColor') state.hairColor = wrap(state.hairColor + dir, CONFIG.colors.hair.length);
    else if (cat === 'eyes') state.eyes = wrap(state.eyes + dir, 3);
    else if (cat === 'lashes') state.lashes = wrap(state.lashes + dir, CONFIG.styles.lashes.length);
    else if (cat === 'eyeColor') state.eyeColor = wrap(state.eyeColor + dir, CONFIG.colors.eyes.length);
    else if (cat === 'mouth') state.mouth = wrap(state.mouth + dir, 3);
    else if (cat === 'shirt') state.shirt = wrap(state.shirt + dir, 4);
    else if (cat === 'shirtColor') state.shirtColor = wrap(state.shirtColor + dir, CONFIG.colors.clothes.length);
    else if (cat === 'bg') state.bg = wrap(state.bg + dir, CONFIG.colors.bg.length);
    else if (cat === 'accessory') state.accessory = wrap(state.accessory + dir, CONFIG.styles.accessories.length);
    else if (cat === 'accessoryColor') state.accessoryColor = wrap(state.accessoryColor + dir, CONFIG.colors.clothes.length);

    if (before === getValue(cat)) {
        AudioSys.blocked();
        showStatus('That style lane is holding position.');
        return;
    }

    AudioSys.swap();
    showReaction('swap', `${CATEGORIES.find(c => c.id === cat)?.label || 'Style'} remixed`);
    showStatus('Swipe through options and build the next glam combo.');
    updateLabel();
    requestAnimationFrame(draw);
}

    function updateLabel() {
    let text = "Preset";
    const cat = state.activeCat;
    
    if (cat === 'skin') text = CONFIG.colors.skin[state.skin].name;
    else if (cat === 'hairColor') text = CONFIG.colors.hair[state.hairColor].name;
    else if (cat === 'eyeColor') text = CONFIG.colors.eyes[state.eyeColor].name;
    else if (cat === 'bg') text = CONFIG.colors.bg[state.bg].name;
    else if (cat === 'shirt') text = ["V-Neck", "Crew", "Hoodie", "Pajamas"][state.shirt];
    else if (cat === 'shirtColor') text = CONFIG.colors.clothes[state.shirtColor].name;
    else if (cat === 'hair') text = ["Pixie", "Bob", "Long", "Afro", "Side"][state.hair];
    else if (cat === 'bangs') text = CONFIG.styles.bangs[state.bangs];
    else if (cat === 'lashes') text = CONFIG.styles.lashes[state.lashes];
    else if (cat === 'accessory') text = CONFIG.styles.accessories[state.accessory];
    else if (cat === 'accessoryColor') text = CONFIG.colors.clothes[state.accessoryColor].name;
    else text = `Style ${getValue(cat) + 1}`;
    
    document.getElementById('label-variant').innerText = text;
}

function getValue(cat) {
    return state[cat] !== undefined ? state[cat] : 0;
}

function wrap(val, max) {
    if (val < 0) return max - 1;
    if (val >= max) return 0;
    return val;
}

// --- Init ---
window.onload = () => {
    initUI();
    noisePattern = createNoise();
    draw();

    const startScreen = document.getElementById('start-screen');
    document.getElementById('btn-start').onclick = async () => {
        await AudioSys.init();
        AudioSys.start();
        showStatus('Booth online. Pick a lane and remix the look.');
        startScreen.style.opacity = '0';
        setTimeout(() => startScreen.remove(), 700);
    };

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) AudioSys.stopLoop();
        else if (state.sound && AudioSys.initialized) AudioSys.startLoop();
    });

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(draw, 100);
    });
};
</script>
