<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Getaway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');

        :root {
            color-scheme: dark;
            --bg-deep: #090814;
            --bg-mid: #150f2f;
            --panel-top: rgba(28, 20, 54, 0.88);
            --panel-bottom: rgba(12, 10, 28, 0.92);
            --line-cyan: #72f7ff;
            --line-pink: #ff5cd6;
            --line-gold: #ffd66b;
            --text-main: #f6f4ff;
            --text-soft: #c4c2ef;
            --success: #8dff9f;
            --danger: #ff6f91;
            --road-dark: #16142b;
            --road-mid: #241f43;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(114, 247, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom, rgba(255, 92, 214, 0.15), transparent 28%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            background-color: var(--bg-deep);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            position: relative;
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(114, 247, 255, 0.35);
            box-shadow:
                0 0 0 1px rgba(255, 92, 214, 0.18) inset,
                0 16px 40px rgba(0, 0, 0, 0.35),
                0 0 28px rgba(114, 247, 255, 0.12);
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            width: min(92vw, 460px);
            margin: 16px;
            padding: 34px 24px 28px;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 38%),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 22px,
                    rgba(114, 247, 255, 0.05) 22px 23px
                );
            pointer-events: none;
        }

        .panel.hidden,
        .hud.hidden,
        .mobile-controls.hidden {
            display: none;
        }

        .start-screen {
            transition: transform 0.3s ease;
        }

        .start-screen:hover {
            transform: scale(1.03);
        }

        .title-main {
            position: relative;
            margin: 0 0 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.3rem, 8vw, 3.3rem);
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text-main);
            text-shadow: 0 0 8px rgba(114, 247, 255, 0.45), 0 0 22px rgba(255, 92, 214, 0.45);
        }

        .title-sub {
            margin: 0 0 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.92rem, 3.7vw, 1.35rem);
            letter-spacing: 0.16em;
            line-height: 1.45;
            color: var(--line-gold);
            text-transform: uppercase;
        }

        .subtitle,
        .control-label,
        .final-label,
        .hud-label {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--text-soft);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
            color: var(--text-soft);
            font-size: 0.9rem;
        }

        .control-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 88px;
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(114, 247, 255, 0.08);
            border: 1px solid rgba(114, 247, 255, 0.16);
        }

        .control-key {
            border: 1px solid rgba(255, 214, 107, 0.45);
            border-radius: 10px;
            padding: 6px 10px;
            color: var(--text-main);
            min-width: 40px;
            background: rgba(255, 214, 107, 0.09);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        .control-label {
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }

        .neon-btn,
        .restart-btn {
            width: 100%;
            border: 0;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.74rem, 2.5vw, 0.86rem);
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease, background 0.2s ease;
        }

        .neon-btn {
            padding: 16px 18px;
            color: #120b1f;
            background: linear-gradient(90deg, var(--line-gold), #ff9d5c, var(--line-pink));
            box-shadow: 0 10px 24px rgba(255, 92, 214, 0.28);
        }

        .neon-btn:hover {
            box-shadow: 0 0 30px rgba(255, 214, 107, 0.32);
            filter: brightness(1.06);
        }

        .neon-btn:active,
        .restart-btn:active {
            transform: scale(0.97);
        }

        .game-over-title {
            margin: 0 0 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.9rem, 6vw, 2.5rem);
            color: var(--danger);
            text-shadow: 0 0 18px rgba(255, 111, 145, 0.25);
        }

        .final-score {
            margin: 0 0 24px;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .final-score span {
            color: #4ade80;
            font-weight: 700;
        }

        .restart-btn {
            padding: 14px 18px;
            color: #0b1020;
            background: linear-gradient(90deg, #72f7ff, #a5ffea);
            box-shadow: 0 10px 20px rgba(114, 247, 255, 0.18);
        }

        .restart-btn:hover {
            filter: brightness(1.04);
        }

        .hud {
            position: absolute;
            top: 16px;
            right: 16px;
            text-align: right;
            padding: 10px 12px 8px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(17, 17, 34, 0.72), rgba(10, 10, 22, 0.52));
            border: 1px solid rgba(114, 247, 255, 0.18);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        }

        .score-display {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1rem, 4vw, 1.45rem);
            line-height: 1.4;
            font-weight: 400;
            color: var(--success);
            text-shadow: 0 0 16px rgba(141, 255, 159, 0.32);
        }

        .hud-label {
            margin-top: 6px;
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--line-cyan);
        }

        .mobile-controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 22px max(18px, env(safe-area-inset-bottom));
            color: rgba(255, 255, 255, 0.82);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.7rem, 3vw, 0.82rem);
            font-weight: 400;
            pointer-events: none;
        }

        .mobile-controls span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(10, 12, 24, 0.54);
            border: 1px solid rgba(255, 214, 107, 0.24);
            box-shadow: 0 0 16px rgba(255, 92, 214, 0.12);
        }

        .feedback-strip {
            position: absolute;
            left: 14px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            pointer-events: none;
            z-index: 2;
        }

        .feedback-gif {
            width: min(28vw, 104px);
            max-height: 84px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(114, 247, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
            background: rgba(10, 12, 24, 0.72);
        }

        @media (max-width: 520px) {
            .panel {
                padding: 28px 18px 22px;
            }

            .controls-row {
                gap: 10px;
            }

            .control-card {
                min-width: 0;
                flex: 1;
            }

            .hud {
                top: 10px;
                right: 10px;
                padding: 8px 10px 6px;
            }
        }

        @media (min-width: 768px) {
            .mobile-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel start-screen">
                <h1 class="title-main">NEON RUN</h1>
                <h2 class="title-sub">Emoji Heatwave</h2>
                <p class="subtitle">😎 Cruise the getaway lane, dodge patrols, and scoop every glowing cash pickup before the road closes in.</p>
                <div class="controls-row">
                    <div class="control-card">
                        <span class="control-key">←</span>
                        <span class="control-label">Drift Left</span>
                    </div>
                    <div class="control-card">
                        <span class="control-key">→</span>
                        <span class="control-label">Drift Right</span>
                    </div>
                </div>
                <button id="start-btn" class="neon-btn">Start Escape</button>
            </div>

            <div id="game-over-screen" class="panel hidden">
                <h2 class="game-over-title">ROADBLOCK</h2>
                <div class="final-score final-label">Cash Secured 🚨 <span id="finalScore">$0</span></div>
                <button id="restart-btn" class="restart-btn">Run Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="score-display">$<span id="score">0</span></div>
                <div class="hud-label">Heat Level: 😈 😈 😈 😈 😈</div>
            </div>

            <div id="mobile-controls" class="mobile-controls hidden">
                <span>⬅️ TAP</span>
                <span>TAP ➡️</span>
            </div>
            <div id="feedback-strip" class="feedback-strip" aria-live="polite">
                <!-- [agent-note][stage3] resolved-gif: pickup+crash feedback -> catalogs/gifs.json -->
                <img id="pickup-gif" class="feedback-gif hidden" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Cash pickup reaction">
                <img id="crash-gif" class="feedback-gif hidden" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash reaction">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.preload = 'auto';
                this.bgm.volume = 0.2;
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.72, debounceMs = 120) {
                const source = this.sfx[key];
                if (!source || !this.unlocked) return;

                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;

                const clone = source.cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pickupGif = document.getElementById('pickup-gif');
        const crashGif = document.getElementById('crash-gif');
        let pickupGifTimer = null;
        let crashGifTimer = null;

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;

        let keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };
        let touchX = null;

        let player = { x: 0, y: 0, w: 50, h: 80, speed: 7, color: '#ff5cd6' };
        let obstacles = [];
        let loot = [];
        let particles = [];
        let palms = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive) {
                player.x = width / 2 - player.w / 2;
                player.y = height - player.h - 100;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key] = true;
                if (e.key.toLowerCase() === 'a') keys.ArrowLeft = true;
                if (e.key.toLowerCase() === 'd') keys.ArrowRight = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key] = false;
                if (e.key.toLowerCase() === 'a') keys.ArrowLeft = false;
                if (e.key.toLowerCase() === 'd') keys.ArrowRight = false;
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
            handleTouch(touchX);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            touchX = e.touches[0].clientX;
            handleTouch(touchX);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
        });

        function handleTouch(tx) {
            if (tx < width / 2) {
                keys.ArrowLeft = true;
                keys.ArrowRight = false;
            } else {
                keys.ArrowLeft = false;
                keys.ArrowRight = true;
            }
        }

        function spawnObstacle() {
            const laneWidth = Math.min(400, width * 0.8);
            const roadLeft = (width - laneWidth) / 2;
            const obsW = 50;
            const obsX = roadLeft + Math.random() * (laneWidth - obsW);

            obstacles.push({
                x: obsX,
                y: -100,
                w: obsW,
                h: 80,
                speed: gameSpeed * 0.8 + Math.random() * 2,
                color: '#0055ff',
                sirenState: 0
            });
        }

        function spawnLoot() {
            const laneWidth = Math.min(400, width * 0.8);
            const roadLeft = (width - laneWidth) / 2;
            const lootW = 30;
            const lootX = roadLeft + Math.random() * (laneWidth - lootW);

            loot.push({
                x: lootX,
                y: -50,
                w: lootW,
                h: 30,
                active: true
            });
        }

        function spawnPalm() {
            const side = Math.random() > 0.5 ? 'left' : 'right';
            const laneWidth = Math.min(400, width * 0.8);
            const roadBoundary = (width - laneWidth) / 2;
            const xPos = side === 'left'
                ? Math.random() * (roadBoundary - 50)
                : (width - roadBoundary) + Math.random() * (roadBoundary - 50);

            if (roadBoundary < 20) return;

            palms.push({
                x: xPos,
                y: -100,
                size: 20 + Math.random() * 30,
                speed: gameSpeed
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                     r2.x + r2.w < r1.x ||
                     r2.y > r1.y + r1.h ||
                     r2.y + r2.h < r1.y);
        }

        function showFeedback(type) {
            const target = type === 'pickup' ? pickupGif : crashGif;
            const timerKey = type === 'pickup' ? 'pickupGifTimer' : 'crashGifTimer';

            target.classList.remove('hidden');
            clearTimeout(type === 'pickup' ? pickupGifTimer : crashGifTimer);
            const nextTimer = setTimeout(() => target.classList.add('hidden'), type === 'pickup' ? 900 : 1300);

            if (timerKey === 'pickupGifTimer') {
                pickupGifTimer = nextTimer;
            } else {
                crashGifTimer = nextTimer;
            }
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            obstacles = [];
            loot = [];
            particles = [];
            palms = [];
            player.x = width / 2 - player.w / 2;
            player.y = height - player.h - 50;
            document.getElementById('score').innerText = score;
            pickupGif.classList.add('hidden');
            crashGif.classList.add('hidden');

            if (width < 768) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            }
        }

        function drawRoad() {
            const laneWidth = Math.min(400, width * 0.8);
            const roadLeft = (width - laneWidth) / 2;

            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#120b28');
            sky.addColorStop(0.45, '#0b1021');
            sky.addColorStop(1, '#05060d');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            const sunGlow = ctx.createRadialGradient(width * 0.5, height * 0.2, 10, width * 0.5, height * 0.2, width * 0.28);
            sunGlow.addColorStop(0, 'rgba(255, 214, 107, 0.9)');
            sunGlow.addColorStop(0.3, 'rgba(255, 92, 214, 0.22)');
            sunGlow.addColorStop(1, 'rgba(255, 92, 214, 0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, width, height * 0.7);

            ctx.strokeStyle = 'rgba(114, 247, 255, 0.08)';
            ctx.lineWidth = 1;
            const gridOffset = (frameCount * gameSpeed * 0.5) % 50;
            for (let y = gridOffset; y < height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            for (let x = 0; x < width; x += 100) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            const roadGradient = ctx.createLinearGradient(roadLeft, 0, roadLeft + laneWidth, 0);
            roadGradient.addColorStop(0, '#121123');
            roadGradient.addColorStop(0.5, '#1f1d39');
            roadGradient.addColorStop(1, '#121123');
            ctx.fillStyle = roadGradient;
            ctx.fillRect(roadLeft, 0, laneWidth, height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(roadLeft + laneWidth * 0.25, 0, laneWidth * 0.08, height);
            ctx.fillRect(roadLeft + laneWidth * 0.67, 0, laneWidth * 0.06, height);

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#72f7ff';
            ctx.fillStyle = '#72f7ff';
            ctx.fillRect(roadLeft - 5, 0, 5, height);

            ctx.shadowColor = '#ff5cd6';
            ctx.fillStyle = '#ff5cd6';
            ctx.fillRect(roadLeft + laneWidth, 0, 5, height);
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 214, 107, 0.72)';
            const markerOffset = (frameCount * gameSpeed) % 80;
            for (let y = -80 + markerOffset; y < height; y += 80) {
                ctx.fillRect(width / 2 - 2, y, 4, 40);
            }
        }

        function drawCar(obj, isPlayer) {
            ctx.save();
            ctx.translate(obj.x + obj.w / 2, obj.y + obj.h / 2);

            const bob = isPlayer ? Math.sin(frameCount * 0.14) * 1.5 : Math.sin((frameCount + obj.x) * 0.08) * 0.8;
            ctx.translate(0, bob);

            ctx.fillStyle = 'rgba(0,0,0,0.36)';
            ctx.beginPath();
            ctx.ellipse(0, obj.h / 2 - 2, obj.w * 0.44, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            if (isPlayer) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = obj.color;
            }

            ctx.fillStyle = obj.color;
            ctx.beginPath();
            ctx.roundRect(-obj.w / 2, -obj.h / 2 + 6, obj.w, obj.h - 10, 12);
            ctx.fill();

            ctx.fillStyle = isPlayer ? '#ffd66b' : '#89a7ff';
            ctx.beginPath();
            ctx.roundRect(-obj.w / 2 + 8, -obj.h / 2 + 14, obj.w - 16, 14, 8);
            ctx.fill();

            ctx.fillStyle = '#0b0f1b';
            ctx.beginPath();
            ctx.roundRect(-obj.w / 2 + 7, -obj.h / 2 + 18, obj.w - 14, 24, 10);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(-obj.w / 2 + 11, -obj.h / 2 + 22, obj.w - 22, 4);

            ctx.fillStyle = isPlayer ? '#ffe89d' : '#ff7aa2';
            ctx.fillRect(-obj.w / 2 + 6, -obj.h / 2 + 8, 8, 8);
            ctx.fillRect(obj.w / 2 - 14, -obj.h / 2 + 8, 8, 8);

            ctx.fillStyle = '#101010';
            ctx.fillRect(-obj.w / 2 + 3, -obj.h / 2 + 12, 6, obj.h - 26);
            ctx.fillRect(obj.w / 2 - 9, -obj.h / 2 + 12, 6, obj.h - 26);

            ctx.fillStyle = '#241c39';
            ctx.fillRect(-obj.w / 2 + 9, obj.h / 2 - 18, obj.w - 18, 8);

            ctx.shadowBlur = isPlayer ? 10 : 8;
            if (isPlayer) {
                ctx.shadowColor = '#ff8fab';
                ctx.fillStyle = '#ff8fab';
                ctx.fillRect(-obj.w / 2 + 2, obj.h / 2 - 8, 12, 5);
                ctx.fillRect(obj.w / 2 - 14, obj.h / 2 - 8, 12, 5);

                ctx.shadowColor = '#72f7ff';
                ctx.fillStyle = '#72f7ff';
                ctx.beginPath();
                ctx.arc(0, -obj.h / 2 - 6, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = '16px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('😎', 0, -obj.h / 2 - 6);
            } else {
                ctx.shadowColor = '#ffe89d';
                ctx.fillStyle = '#ffe89d';
                ctx.fillRect(-obj.w / 2 + 2, obj.h / 2 - 8, 12, 5);
                ctx.fillRect(obj.w / 2 - 14, obj.h / 2 - 8, 12, 5);

                ctx.shadowColor = frameCount % 20 < 10 ? '#ff4d6d' : '#69a5ff';
                ctx.fillStyle = frameCount % 20 < 10 ? '#ff4d6d' : '#69a5ff';
                ctx.fillRect(-obj.w / 4, -obj.h / 4, obj.w / 2, 6);

                ctx.font = '15px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚓', 0, -obj.h / 2 - 4);
            }

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawLoot(obj) {
            ctx.save();
            ctx.translate(obj.x + obj.w / 2, obj.y + obj.h / 2);
            const scale = 1 + Math.sin(frameCount * 0.1) * 0.12;
            ctx.scale(scale, scale);

            ctx.shadowBlur = 16;
            ctx.shadowColor = '#8dff9f';
            ctx.fillStyle = '#17a56b';
            ctx.beginPath();
            ctx.roundRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h, 8);
            ctx.fill();

            ctx.fillStyle = '#d8ffd2';
            ctx.fillRect(-obj.w / 2 + 5, -2, obj.w - 10, 4);

            ctx.fillStyle = '#fff';
            ctx.font = '20px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💵', 0, 0);

            ctx.restore();
        }

        function drawPalm(obj) {
            ctx.fillStyle = '#61452d';
            ctx.fillRect(obj.x - 2, obj.y, 4, obj.size);

            ctx.fillStyle = '#12d07d';
            ctx.beginPath();
            ctx.arc(obj.x, obj.y, obj.size / 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = `${Math.max(18, obj.size * 0.9)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🌴', obj.x, obj.y + 4);
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;
            gameSpeed += 0.001;

            const laneWidth = Math.min(400, width * 0.8);
            const roadLeft = (width - laneWidth) / 2;
            const roadRight = roadLeft + laneWidth;

            if (keys.ArrowLeft && player.x > roadLeft) player.x -= player.speed;
            if (keys.ArrowRight && player.x + player.w < roadRight) player.x += player.speed;

            if (Math.random() < 0.015) spawnObstacle();
            if (Math.random() < 0.008) spawnLoot();
            if (Math.random() < 0.05) spawnPalm();

            ctx.clearRect(0, 0, width, height);
            drawRoad();

            palms.forEach((p, i) => {
                p.y += p.speed;
                drawPalm(p);
                if (p.y > height) palms.splice(i, 1);
            });

            loot.forEach((l, i) => {
                l.y += gameSpeed;
                drawLoot(l);

                if (rectIntersect(player, l)) {
                    audio.playSFX('pickup', 0.62, 100);
                    showFeedback('pickup');
                    score += 100;
                    document.getElementById('score').innerText = score;
                    createParticles(l.x + l.w / 2, l.y + l.h / 2, '#00ff00');
                    loot.splice(i, 1);
                } else if (l.y > height) {
                    loot.splice(i, 1);
                }
            });

            obstacles.forEach((obs, i) => {
                obs.y += obs.speed;
                drawCar(obs, false);

                if (rectIntersect(player, obs)) {
                    createParticles(player.x + player.w / 2, player.y, '#ff0000');
                    audio.playSFX('crash', 0.64, 300);
                    showFeedback('crash');
                    gameOver();
                }

                if (obs.y > height) obstacles.splice(i, 1);
            });

            drawCar(player, true);

            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0.72, 250);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = "$" + score;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.58, 250);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 0.54, 180);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
