<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Rush Hour Rescue</title>
    <!-- [agent-note][stage4] preserve: catalog-backed fonts remain approved | action: removed non-catalog fallback refs only -->
    <!-- [agent-note][stage3] resolved-font: title-display -> Bangers | ui-body-hud -> Orbitron -->
    <!-- [agent-note][stage3] resolved-audio: start/jump/pickup/crash -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: rescue/fail overlay -> catalogs/gifs.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap">
    <style>
        :root {
            --bg-top: #132347;
            --bg-mid: #264f8f;
            --bg-bottom: #f6ba57;
            --panel-bg: rgba(10, 24, 54, 0.8);
            --panel-border: rgba(255, 237, 160, 0.68);
            --panel-glow: rgba(65, 192, 255, 0.28);
            --hud-bg: rgba(7, 16, 38, 0.76);
            --text-main: #f8fcff;
            --text-soft: rgba(248, 252, 255, 0.84);
            --accent-gold: #ffd54f;
            --accent-sky: #7ce7ff;
            --accent-coral: #ff735c;
            --accent-lime: #8dff9c;
            --road-dark: #20283f;
            --road-line: #fff7b2;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Orbitron', sans-serif;
            background:
                radial-gradient(circle at top, rgba(124, 231, 255, 0.24), transparent 32%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom));
            color: var(--text-main);
        }

        button {
            font: inherit;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #7dd3fc;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(11, 28, 62, 0.92), rgba(9, 18, 42, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 38px rgba(4, 10, 26, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 22px var(--panel-glow);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.14), transparent 28%),
                radial-gradient(circle at top right, rgba(124, 231, 255, 0.18), transparent 30%);
            pointer-events: none;
        }

        .text-shadow {
            text-shadow: 0 3px 0 rgba(6, 12, 27, 0.55), 0 0 14px rgba(0,0,0,0.28);
        }

        .title-font {
            font-family: 'Bangers', sans-serif;
            letter-spacing: 0.06em;
        }

        .ui-caption {
            color: var(--text-soft);
            font-size: clamp(0.9rem, 2.8vw, 1.05rem);
            line-height: 1.35;
        }

        .route-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: rgba(124, 231, 255, 0.16);
            border: 1px solid rgba(124, 231, 255, 0.24);
            color: var(--accent-sky);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-bus {
            position: relative;
            width: 8.5rem;
            height: 5.4rem;
            margin: 0 auto 0.75rem;
            animation: busFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.3));
        }

        .hero-bus .bus-shell,
        .hero-bus .bus-window,
        .hero-bus .bus-light,
        .hero-bus .bus-wheel,
        .hero-bus .bus-smile {
            position: absolute;
        }

        .hero-bus .bus-shell {
            inset: 1rem 0.35rem 1rem;
            border-radius: 1.15rem 1.8rem 1rem 1rem;
            background: linear-gradient(180deg, #ffd85c, #ff9f43);
            border: 3px solid rgba(72, 46, 8, 0.7);
            box-shadow: inset 0 -0.45rem 0 rgba(123, 60, 12, 0.22);
        }

        .hero-bus .bus-window {
            top: 1.45rem;
            width: 1.15rem;
            height: 0.95rem;
            border-radius: 0.35rem;
            background: linear-gradient(180deg, #dff8ff, #72d7ff);
            border: 2px solid rgba(15, 54, 81, 0.45);
        }

        .hero-bus .bus-window.w1 { left: 1rem; }
        .hero-bus .bus-window.w2 { left: 2.45rem; }
        .hero-bus .bus-window.w3 { left: 3.9rem; }
        .hero-bus .bus-window.w4 {
            right: 0.95rem;
            width: 1.55rem;
            border-radius: 0.55rem 0.75rem 0.35rem 0.35rem;
        }

        .hero-bus .bus-light {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 999px;
            bottom: 1.35rem;
            background: #fff4a3;
            box-shadow: 0 0 12px rgba(255, 240, 111, 0.9);
        }

        .hero-bus .bus-light.l1 { left: 0.75rem; }
        .hero-bus .bus-light.l2 { right: 0.75rem; background: #ff8d6d; box-shadow: 0 0 10px rgba(255, 115, 92, 0.9); }

        .hero-bus .bus-wheel {
            bottom: 0.2rem;
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 999px;
            background: radial-gradient(circle, #9fdcff 0 22%, #20283f 24% 56%, #0a1123 58% 100%);
            border: 3px solid #09111f;
        }

        .hero-bus .bus-wheel.wh1 { left: 1rem; }
        .hero-bus .bus-wheel.wh2 { right: 1rem; }

        .hero-bus .bus-smile {
            right: 1.15rem;
            bottom: 1.75rem;
            width: 1rem;
            height: 0.5rem;
            border-bottom: 3px solid #4e2c0d;
            border-radius: 0 0 1rem 1rem;
            transform: rotate(-4deg);
        }

        .hero-bus .bus-star {
            position: absolute;
            font-size: 1rem;
            animation: sparkle 1.6s ease-in-out infinite;
        }

        .hero-bus .bus-star.s1 { top: 0; left: -0.15rem; }
        .hero-bus .bus-star.s2 { top: 0.65rem; right: -0.2rem; animation-delay: 0.4s; }

        .arcade-btn {
            position: relative;
            background: linear-gradient(180deg, #ffe36a, #ffb648);
            color: #152345;
            border: 0;
            box-shadow:
                0 6px 0 #aa6419,
                0 14px 24px rgba(0, 0, 0, 0.24);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            font-weight: 900;
            cursor: pointer;
        }

        .arcade-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #aa6419;
        }

        .screen-card {
            width: min(90vw, 28rem);
            max-width: 28rem;
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
        }

        #start-screen {
            border-top: 4px solid #fde047;
            transition: transform 300ms ease;
        }

        #start-screen:hover {
            transform: scale(1.05);
        }

        #game-over-screen {
            border-top: 4px solid #f87171;
        }

        .start-kicker {
            margin: 0 0 1rem;
        }

        .start-title {
            margin: 0 0 0.5rem;
            font-size: clamp(3rem, 8vw, 4rem);
            color: #fde047;
        }

        .start-subtitle {
            margin: 0 0 1rem;
            font-size: clamp(1.15rem, 3.8vw, 1.55rem);
            font-weight: 700;
            color: #a5f3fc;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .start-copy {
            margin: 0 0 1.75rem;
            font-weight: 500;
        }

        .primary-btn {
            padding: 1rem 2.5rem;
            border-radius: 999px;
            font-size: clamp(1.05rem, 3vw, 1.2rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .secondary-btn {
            padding: 0.85rem 2rem;
            border-radius: 999px;
            font-size: 1rem;
        }

        .end-icon {
            margin-bottom: 0.75rem;
            font-size: 3rem;
        }

        .end-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2.4rem, 7vw, 3.3rem);
            color: #fca5a5;
        }

        .end-label {
            margin-bottom: 0.5rem;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            color: rgba(241, 245, 249, 0.9);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .end-score {
            margin-bottom: 2rem;
            font-family: 'Bangers', sans-serif;
            font-size: clamp(3rem, 10vw, 4rem);
            color: #86efac;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.28);
        }

        .hud-shell {
            min-width: 10.5rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.08em;
            color: var(--accent-lime);
            background: linear-gradient(180deg, rgba(6, 16, 38, 0.88), rgba(13, 33, 66, 0.82));
            border: 1px solid rgba(141, 255, 156, 0.28);
            box-shadow: 0 10px 24px rgba(5, 10, 25, 0.35);
        }

        .hud-label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-soft);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .score-value {
            font-size: clamp(1.4rem, 4vw, 1.9rem);
            line-height: 1;
            font-weight: 700;
        }

        #hud {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.9rem 1.25rem;
            border-radius: 1.5rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #feedback-gif {
            position: absolute;
            left: 1rem;
            bottom: 1rem;
            width: min(28vw, 120px);
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.22);
            box-shadow: 0 10px 20px rgba(0,0,0,0.28);
            object-fit: cover;
            opacity: 0;
            transform: translateY(12px) scale(0.95);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 2;
        }

        #feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #feedback-gif.is-loss {
            left: auto;
            right: 1rem;
            bottom: 5.75rem;
            width: min(34vw, 140px);
        }

        .sparkline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkline span {
            position: absolute;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.7);
            box-shadow: 0 0 12px rgba(124, 231, 255, 0.7);
            animation: sparkFloat 2.2s ease-in-out infinite;
        }

        .sparkline span:nth-child(1) { left: 15%; top: 74%; }
        .sparkline span:nth-child(2) { left: 52%; top: 16%; animation-delay: 0.45s; }
        .sparkline span:nth-child(3) { left: 80%; top: 62%; animation-delay: 0.9s; }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.18; }
            50% { transform: translateY(-10px) scale(1.15); opacity: 0.9; }
        }

        @keyframes busFloat {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(0.9); opacity: 0.35; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        @media (max-width: 640px) {
            #hud {
                top: 1rem;
                right: 1rem;
                padding: 0.65rem 0.9rem;
            }

            .screen-card {
                width: min(92vw, 24rem);
                padding: 1.35rem;
            }

            #feedback-gif {
                width: min(25vw, 88px);
                bottom: 0.75rem;
                left: 0.75rem;
            }

            #feedback-gif.is-loss {
                right: 0.75rem;
                bottom: 4.75rem;
                width: min(30vw, 108px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <img id="feedback-gif" alt="Gameplay reaction overlay">

        <!-- UI Layer -->
        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen" class="screen-card glass-panel">
                <div class="sparkline" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="route-badge start-kicker">city rescue route</div>
                <div class="hero-bus" aria-hidden="true">
                    <div class="bus-shell"></div>
                    <div class="bus-window w1"></div>
                    <div class="bus-window w2"></div>
                    <div class="bus-window w3"></div>
                    <div class="bus-window w4"></div>
                    <div class="bus-light l1"></div>
                    <div class="bus-light l2"></div>
                    <div class="bus-wheel wh1"></div>
                    <div class="bus-wheel wh2"></div>
                    <div class="bus-smile"></div>
                    <div class="bus-star s1">✨</div>
                    <div class="bus-star s2">⭐</div>
                </div>
                <h1 class="title-font text-shadow start-title">RUSH HOUR RESCUE</h1>
                <h2 class="start-subtitle">Jump • Scoop • Survive</h2>
                <p class="ui-caption start-copy">Hop over traffic jams and sweep up waiting riders before the route gets blocked.</p>
                <button id="start-btn" class="arcade-btn primary-btn">Start Route</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen-card hidden glass-panel">
                <div class="end-icon">🚧</div>
                <h2 class="title-font text-shadow end-title">Route Blocked!</h2>
                <div class="end-label">Rescued Commuters</div>
                <div class="end-score"><span id="finalScore">0</span></div>
                <button id="restart-btn" class="arcade-btn secondary-btn">Try Another Run</button>
            </div>

            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud-shell hidden">
                <span class="hud-label">Route Score</span>
                <span class="score-value"><span id="score">0</span></span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. CATALOG-BACKED MEDIA */
        const MEDIA = {
            fonts: {
                title: "'Bangers', sans-serif",
                ui: "'Orbitron', sans-serif"
            },
            gifs: {
                rescue: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            },
            audio: {
                bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
                uiStart: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.unlocked = false;
                this.bgm = this.createAudio(MEDIA.audio.bgm, { loop: true, volume: 0.24 });
                this.sfx = {
                    uiStart: this.createAudio(MEDIA.audio.uiStart, { volume: 0.55 }),
                    jump: this.createAudio(MEDIA.audio.jump, { volume: 0.45 }),
                    land: this.createAudio(MEDIA.audio.land, { volume: 0.35 }),
                    pickup: this.createAudio(MEDIA.audio.pickup, { volume: 0.62 }),
                    fail: this.createAudio(MEDIA.audio.fail, { volume: 0.7 })
                };
            }

            createAudio(src, { loop = false, volume = 0.5 } = {}) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = volume;
                return audio;
            }

            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.enabled = true;

                const primers = [this.bgm, ...Object.values(this.sfx)];
                primers.forEach(audio => {
                    try {
                        audio.muted = true;
                        const playPromise = audio.play();
                        if (playPromise && typeof playPromise.then === 'function') {
                            playPromise
                                .then(() => {
                                    audio.pause();
                                    audio.currentTime = 0;
                                    audio.muted = false;
                                })
                                .catch(() => {
                                    audio.muted = false;
                                });
                        } else {
                            audio.pause();
                            audio.currentTime = 0;
                            audio.muted = false;
                        }
                    } catch (_) {}
                });
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { reset = true } = {}) {
                if (!this.enabled || !this.sfx[key]) return;
                const base = this.sfx[key];
                try {
                    if (reset) base.currentTime = 0;
                    base.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const feedbackGif = document.getElementById('feedback-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;
        let gifTimer = null;

        // Entities
        let bus = { x: 50, y: 0, w: 80, h: 40, dy: 0, grounded: true, jumpPower: -12 };
        let obstacles = [];
        let passengers = [];
        let particles = [];
        let buildings = [];
        let lastGroundedState = true;

        function showFeedbackGif(type) {
            feedbackGif.classList.remove('active', 'is-loss');
            if (gifTimer) clearTimeout(gifTimer);

            if (type === 'rescue') {
                feedbackGif.src = MEDIA.gifs.rescue;
                feedbackGif.alt = 'Rescue celebration overlay';
            } else {
                feedbackGif.src = MEDIA.gifs.fail;
                feedbackGif.alt = 'Crash reaction overlay';
                feedbackGif.classList.add('is-loss');
            }

            requestAnimationFrame(() => feedbackGif.classList.add('active'));
            gifTimer = setTimeout(() => {
                feedbackGif.classList.remove('active', 'is-loss');
            }, type === 'rescue' ? 950 : 1600);
        }

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            bus.groundY = height * 0.75;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. PARALLAX & DRAWING HELPERS */
        function initBuildings() {
            buildings = [];
            let currentX = 0;
            while (currentX < width * 2) {
                const bw = 50 + Math.random() * 100;
                const bh = 50 + Math.random() * 150;
                buildings.push({ x: currentX, w: bw, h: bh, color: `hsl(${220 + Math.random() * 18}, ${28 + Math.random() * 12}%, ${20 + Math.random() * 12}%)` });
                currentX += bw;
            }
        }

        function drawParallax() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#132347');
            grad.addColorStop(0.55, '#3f73bd');
            grad.addColorStop(1, '#f6ba57');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const sunGlow = ctx.createRadialGradient(width - 110, 110, 10, width - 110, 110, 70);
            sunGlow.addColorStop(0, 'rgba(255, 241, 177, 0.95)');
            sunGlow.addColorStop(0.45, 'rgba(255, 193, 95, 0.62)');
            sunGlow.addColorStop(1, 'rgba(255, 193, 95, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(width - 110, 110, 70, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 4; i++) {
                const starX = (i * width) / 4 + 40;
                const starY = 65 + (i % 2) * 24;
                ctx.beginPath();
                ctx.arc(starX, starY, 2 + (i % 2), 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.save();
            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                if (gameActive) b.x -= gameSpeed * 0.2;
                if (b.x + b.w < 0) b.x += width * 2;

                ctx.fillRect(b.x, bus.groundY - b.h, b.w, b.h);

                ctx.fillStyle = 'rgba(255,255,200, 0.3)';
                for (let wy = 10; wy < b.h - 10; wy += 20) {
                    for (let wx = 10; wx < b.w - 10; wx += 15) {
                        if (Math.random() > 0.3) ctx.fillRect(b.x + wx, bus.groundY - b.h + wy, 8, 12);
                    }
                }
            });
            ctx.restore();

            ctx.fillStyle = '#20283F';
            ctx.fillRect(0, bus.groundY, width, height - bus.groundY);

            ctx.fillStyle = 'rgba(255, 182, 66, 0.18)';
            ctx.fillRect(0, bus.groundY - 10, width, 10);

            ctx.strokeStyle = '#FFF7B2';
            ctx.lineWidth = 4;
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -frameCount * gameSpeed;
            ctx.beginPath();
            ctx.moveTo(0, bus.groundY + 40);
            ctx.lineTo(width, bus.groundY + 40);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawBus() {
            ctx.save();
            ctx.translate(bus.x, bus.y);

            const bounce = Math.sin(frameCount * 0.2) * 2;
            ctx.translate(0, bounce);

            const busGrad = ctx.createLinearGradient(0, 0, 0, bus.h);
            busGrad.addColorStop(0, '#FFE074');
            busGrad.addColorStop(1, '#FF9B38');
            ctx.fillStyle = busGrad;
            ctx.beginPath();
            ctx.roundRect(0, 0, bus.w, bus.h, 9);
            ctx.fill();
            ctx.strokeStyle = '#70410d';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#24304d';
            ctx.fillRect(0, bus.h / 2 + 5, bus.w, 5);

            const winGrad = ctx.createLinearGradient(0, 5, 0, 22);
            winGrad.addColorStop(0, '#E7FAFF');
            winGrad.addColorStop(1, '#65D8FF');
            ctx.fillStyle = winGrad;
            ctx.fillRect(6, 5, 15, 15);
            ctx.fillRect(26, 5, 15, 15);
            ctx.fillRect(46, 5, 15, 15);

            ctx.fillStyle = '#b6f2ff';
            ctx.beginPath();
            ctx.moveTo(64, 5);
            ctx.lineTo(bus.w - 4, 5);
            ctx.lineTo(bus.w - 4, 21);
            ctx.lineTo(64, 21);
            ctx.fill();

            ctx.strokeStyle = '#563313';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(bus.w - 13, 25, 5, 0.2, Math.PI - 0.2);
            ctx.stroke();

            ctx.fillStyle = '#09111f';
            ctx.beginPath();
            ctx.arc(15, bus.h, 9, 0, Math.PI * 2);
            ctx.arc(bus.w - 15, bus.h, 9, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#97def9';
            ctx.beginPath();
            ctx.arc(15, bus.h, 4, 0, Math.PI * 2);
            ctx.arc(bus.w - 15, bus.h, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff3a6';
            ctx.beginPath();
            ctx.arc(8, 26, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff7f6c';
            ctx.beginPath();
            ctx.arc(bus.w - 5, 26, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);

            const carGrad = ctx.createLinearGradient(0, 0, 0, obs.h);
            carGrad.addColorStop(0, '#ff7f6c');
            carGrad.addColorStop(1, '#9c2235');
            ctx.fillStyle = carGrad;
            ctx.beginPath();
            ctx.roundRect(0, 10, obs.w, obs.h - 10, 6);
            ctx.fill();

            ctx.fillStyle = '#601625';
            ctx.fillRect(10, 0, obs.w - 20, 15);

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(10, obs.h, 6, 0, Math.PI * 2);
            ctx.arc(obs.w - 10, obs.h, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawPassenger(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            ctx.fillStyle = '#8dff9c';
            ctx.beginPath();
            ctx.arc(10, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f7fbff';
            ctx.fillRect(5, 8, 10, 14);

            ctx.strokeStyle = '#1a2440';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(8, 22); ctx.lineTo(7, 30);
            ctx.moveTo(12, 22); ctx.lineTo(13, 30);
            ctx.stroke();

            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 15px Bangers';
            ctx.fillText('+5', 2, -15 + Math.sin(frameCount * 0.1) * 5);

            ctx.restore();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color
                });
            }
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            bus.y = bus.groundY - bus.h - 5;
            bus.dy = 0;
            bus.grounded = true;
            lastGroundedState = true;
            obstacles = [];
            passengers = [];
            particles = [];
            initBuildings();

            document.getElementById('score').innerText = score;
        }

        function spawnEntities() {
            if (frameCount % 120 === 0) {
                if (Math.random() > 0.3) {
                    obstacles.push({
                        x: width + 50,
                        y: bus.groundY - 35,
                        w: 60,
                        h: 30,
                        passed: false
                    });
                }
            }

            if (frameCount % 90 === 0) {
                if (Math.random() > 0.4) {
                    const isAir = Math.random() > 0.7;
                    passengers.push({
                        x: width + 50,
                        y: isAir ? bus.groundY - 120 : bus.groundY - 30,
                        w: 20,
                        h: 30,
                        collected: false
                    });
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            bus.dy += 0.6;
            bus.y += bus.dy;

            if (bus.y + bus.h >= bus.groundY) {
                bus.y = bus.groundY - bus.h;
                bus.dy = 0;
                bus.grounded = true;
            } else {
                bus.grounded = false;
            }

            if (!lastGroundedState && bus.grounded) {
                audio.playSFX('land');
            }
            lastGroundedState = bus.grounded;

            if (frameCount % 600 === 0) gameSpeed += 0.5;

            drawParallax();
            spawnEntities();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                drawObstacle(obs);

                if (
                    bus.x < obs.x + obs.w &&
                    bus.x + bus.w > obs.x &&
                    bus.y < obs.y + obs.h &&
                    bus.y + bus.h > obs.y
                ) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            for (let i = passengers.length - 1; i >= 0; i--) {
                const p = passengers[i];
                p.x -= gameSpeed;

                if (!p.collected) {
                    drawPassenger(p);
                    if (
                        bus.x < p.x + p.w &&
                        bus.x + bus.w > p.x &&
                        bus.y < p.y + p.h &&
                        bus.y + bus.h > p.y
                    ) {
                        p.collected = true;
                        score += 5;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('pickup');
                        showFeedbackGif('rescue');
                        createParticles(p.x, p.y, '#32CD32');
                    }
                } else {
                    passengers.splice(i, 1);
                }

                if (p.x + p.w < 0) passengers.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }

            drawBus();

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedbackGif('fail');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (gameActive && bus.grounded) {
                bus.dy = bus.jumpPower;
                bus.grounded = false;
                audio.playSFX('jump');
            }
        }

        function startRun() {
            audio.unlock();
            audio.playSFX('uiStart');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', startRun);

        document.getElementById('restart-btn').addEventListener('click', () => {
            startRun();
        });

        window.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && !audio.unlocked) {
                audio.unlock();
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        canvas.addEventListener('mousedown', () => {
            if (!audio.unlocked) audio.unlock();
            jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!audio.unlocked) audio.unlock();
            jump();
        }, { passive: false });
    });
    </script>
</body>
</html>
