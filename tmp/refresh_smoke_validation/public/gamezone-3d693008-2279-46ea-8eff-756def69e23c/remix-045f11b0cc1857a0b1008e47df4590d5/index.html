<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Meme Dash: Stonks Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <!-- [agent-note][stage4] preserved-font-map: title/display -> Audiowide | ui/body -> Rajdhani from catalogs/fonts.json -->
    <style>
        :root {
            color-scheme: dark;
            --bg-top: #120f2d;
            --bg-mid: #20154c;
            --bg-bottom: #09111f;
            --hud-panel: rgba(20, 16, 45, 0.72);
            --hud-border: rgba(123, 239, 255, 0.45);
            --hero: #ffe45e;
            --hero-shade: #ffb63f;
            --hero-glow: rgba(255, 228, 94, 0.42);
            --accent: #73f7ff;
            --accent-2: #8f5bff;
            --danger: #ff5b7a;
            --danger-dark: #a61d4b;
            --coin: #7dff9b;
            --coin-dark: #0a8f5a;
            --text-main: #f7fbff;
            --text-soft: rgba(247, 251, 255, 0.78);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(115, 247, 255, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bottom));
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .right-6 { right: 1.5rem; }
        .bottom-20 { bottom: 5rem; }
        .group { }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }
        .p-10 { padding: 2.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-sm { border-radius: 0.125rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-black { border-color: #000; }
        .border-green-700 { border-bottom: 4px solid #15803d; }
        .border-blue-700 { border-bottom: 4px solid #1d4ed8; }
        .bg-yellow-400 { background: #facc15; }
        .bg-green-500 { background: #22c55e; }
        .bg-blue-500 { background: #3b82f6; }
        .text-white { color: #fff; }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-yellow-400 { color: #facc15; }
        .text-yellow-200 { color: #fef08a; }
        .text-green-400 { color: #4ade80; }
        .text-red-500 { color: #ef4444; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .font-bold { font-weight: 700; }
        .italic { font-style: italic; }
        .shadow-lg { box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
        .transform { transform-origin: center; }
        .rotate-2 { transform: rotate(2deg); }
        .transition { transition: transform 0.2s ease, background-color 0.2s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(29, 21, 66, 0.92), rgba(10, 13, 34, 0.84)),
                rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--hud-border);
            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 0 24px rgba(115, 247, 255, 0.12);
        }
        .meme-text {
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 0 rgba(4, 7, 20, 0.9), 0 0 18px rgba(115, 247, 255, 0.25);
        }
        .subhead-text {
            font-family: 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.06em;
            font-weight: 600;
        }
        .hero-badge {
            position: relative;
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
            border: 4px solid #090b15;
            background:
                radial-gradient(circle at 35% 30%, #fff8a6 0 12%, var(--hero) 13% 58%, var(--hero-shade) 59% 100%);
            box-shadow:
                0 0 0 6px rgba(115, 247, 255, 0.14),
                0 0 28px rgba(255, 228, 94, 0.35);
        }
        .hero-badge::before,
        .hero-badge::after {
            content: "";
            position: absolute;
            top: 1.35rem;
            width: 1.1rem;
            height: 0.7rem;
            border-radius: 0.25rem;
            background: #05070f;
            box-shadow: 0 0 10px rgba(115, 247, 255, 0.18);
        }
        .hero-badge::before { left: 0.7rem; }
        .hero-badge::after { right: 0.7rem; }
        .hero-badge span {
            position: absolute;
            left: 50%;
            bottom: 0.95rem;
            width: 1.55rem;
            height: 0.8rem;
            transform: translateX(-50%);
            border-bottom: 3px solid #090b15;
            border-radius: 0 0 1rem 1rem;
        }
        .hud-chip {
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28), 0 0 18px rgba(115, 247, 255, 0.12);
        }
        .tutorial-pill {
            padding: 0.65rem 1rem;
            border-radius: 999px;
            background: rgba(11, 18, 38, 0.78);
            border: 1px solid rgba(143, 91, 255, 0.45);
            box-shadow: 0 0 18px rgba(143, 91, 255, 0.18);
        }
        .btn {
            border: none;
            border-bottom-width: 4px;
            color: #fff;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: inherit;
            font-weight: 700;
            cursor: pointer;
            padding: 1rem 2.5rem;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(0.95); }
        .status-stack {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            align-items: flex-end;
            max-width: min(32vw, 220px);
        }
        .status-card {
            min-width: 9rem;
            padding: 0.55rem 0.8rem;
            border-radius: 1rem;
            background: rgba(6, 10, 22, 0.72);
            border: 1px solid rgba(115, 247, 255, 0.28);
            color: var(--text-main);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: right;
        }
        .status-label {
            display: block;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-bottom: 0.25rem;
        }
        .status-value {
            display: block;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.05;
        }
        .feedback-gif {
            position: absolute;
            width: min(32vw, 150px);
            height: auto;
            border-radius: 1rem;
            border: 2px solid rgba(115, 247, 255, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
            background: rgba(6, 10, 22, 0.4);
        }
        .feedback-gif.is-visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        #pickup-gif {
            right: 1rem;
            bottom: 1rem;
        }
        #fail-gif {
            left: 50%;
            top: 1rem;
            transform: translateX(-50%) translateY(-12px) scale(0.92);
            width: min(56vw, 220px);
        }
        #fail-gif.is-visible {
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .animate-bounce { animation: bounce 1s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .text-6xl { font-size: 2.5rem; }
            .text-5xl { font-size: 2.25rem; }
            .text-3xl { font-size: 1.5rem; }
            .text-2xl { font-size: 1.25rem; }
            .text-xl { font-size: 1.125rem; }
            .top-6, .left-6 { top: 1rem; left: 1rem; }
            .right-6 { right: 1rem; }
            .bottom-20 { bottom: 2rem; }
            .status-stack {
                max-width: 42vw;
                gap: 0.55rem;
            }
            .status-card {
                min-width: 7.2rem;
                padding: 0.45rem 0.6rem;
            }
            .status-value { font-size: 1rem; }
            #pickup-gif {
                width: min(34vw, 120px);
                right: 0.75rem;
                bottom: 0.75rem;
            }
            #fail-gif {
                top: 0.75rem;
                width: min(52vw, 170px);
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto transform hover:scale-105 transition duration-300 flex flex-col items-center gap-4">
                <h1 class="text-6xl font-bold text-yellow-400 meme-text mb-2 rotate-2">Meme Dash</h1>
                <p class="text-white font-bold text-xl mb-6 subhead-text">Glide the smug little moon-face through every ban gate and cash in glowing stonk arrows.</p>
                <div class="hero-badge" aria-hidden="true"><span></span></div>
                <button id="start-btn" class="btn bg-green-500 border-green-700 rounded-xl shadow-lg transition text-2xl meme-text">
                    Start Run
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto">
                <h2 class="text-5xl font-bold text-red-500 meme-text mb-4">Run Ended</h2>
                <div class="text-3xl text-white mb-2 meme-text">Stonks Banked: <span id="finalScore">0</span></div>
                <p id="meme-comment" class="text-yellow-200 text-lg mb-8 italic subhead-text">"You clipped the filter wall."</p>
                <button id="restart-btn" class="btn bg-blue-500 border-blue-700 rounded-xl shadow-lg transition text-xl meme-text">
                    Run It Back
                </button>
            </div>
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-6 left-6 text-3xl font-bold text-white meme-text hidden hud-chip">
                Stonks Banked: <span id="score" class="text-green-400">0</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: pickup/fail feedback overlays -> catalogs/gifs.json | keep compact to protect mobile controls -->
            <div class="absolute top-6 right-6 status-stack pointer-events-none">
                <div class="status-card">
                    <span class="status-label">Audio</span>
                    <span id="audio-state" class="status-value subhead-text">Tap to arm</span>
                </div>
                <div class="status-card">
                    <span class="status-label">Mood</span>
                    <span id="mood-state" class="status-value subhead-text">Stonk calm</span>
                </div>
            </div>

            <img
                id="pickup-gif"
                class="feedback-gif hidden"
                src="https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp"
                alt="Celebration feedback"
                loading="lazy"
                decoding="async"
            >
            <img
                id="fail-gif"
                class="feedback-gif hidden"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                alt="Fail reaction feedback"
                loading="lazy"
                decoding="async"
            >
            
            <!-- Tap Hint -->
            <div id="tutorial" class="absolute bottom-20 text-white/80 animate-bounce hidden text-xl font-bold meme-text tutorial-pill">
                Tap or Press Space to Hop
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                pass: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.enabled = true;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = key === 'fail' ? 0.7 : key === 'ui' ? 0.45 : 0.58;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                if (this.ready || !this.enabled) return;
                this.ready = true;
            }

            playBGM() {
                if (!this.ready || !this.enabled) return;
                this.bgm.play().catch(() => {
                    this.enabled = false;
                    this.ready = false;
                });
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 90) {
                if (!this.ready || !this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed.has(key) && now - this.lastPlayed.get(key) < cooldown) return;
                this.lastPlayed.set(key, now);
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pickupGif = document.getElementById('pickup-gif');
        const failGif = document.getElementById('fail-gif');
        const audioState = document.getElementById('audio-state');
        const moodState = document.getElementById('mood-state');
        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let score = 0;
        let tutorialTimeout = null;
        let pickupGifTimeout = null;
        let failGifTimeout = null;
        
        // Physics & Entities
        let player = {
            x: 0,
            y: 0,
            radius: 25,
            velocity: 0,
            gravity: 0.6,
            jumpStrength: -10,
            rotation: 0
        };

        let obstacles = []; // The "Bans"
        let coins = []; // The "Stonks"
        let particles = []; // Explosion effects
        let clouds = []; // Background parallax

        // Colors
        const COLORS = {
            skyTop: '#120f2d',
            skyMid: '#22135b',
            skyBot: '#09111f',
            player: '#FFE45E',
            playerShade: '#FFB63F',
            playerGlow: 'rgba(255, 228, 94, 0.42)',
            obstacle: '#FF5B7A',
            obstacleEdge: '#A61D4B',
            coin: '#7DFF9B',
            coinEdge: '#0A8F5A',
            accent: '#73F7FF',
            accent2: '#8F5BFF'
        };

        function setAudioState(text) {
            audioState.textContent = text;
        }

        function setMoodState(text) {
            moodState.textContent = text;
        }

        function flashGif(element, timeoutRefName, mood, duration = 1300) {
            clearTimeout(timeoutRefName === 'pickup' ? pickupGifTimeout : failGifTimeout);
            element.classList.remove('hidden');
            requestAnimationFrame(() => element.classList.add('is-visible'));
            setMoodState(mood);
            const timeoutId = setTimeout(() => {
                element.classList.remove('is-visible');
                setTimeout(() => element.classList.add('hidden'), 280);
            }, duration);
            if (timeoutRefName === 'pickup') pickupGifTimeout = timeoutId;
            if (timeoutRefName === 'fail') failGifTimeout = timeoutId;
        }

        function clearFeedback() {
            [pickupGif, failGif].forEach((element) => {
                element.classList.remove('is-visible');
                element.classList.add('hidden');
            });
        }

        function armAudio() {
            audio.unlock();
            setAudioState(audio.enabled ? 'Audio hot' : 'Muted');
        }

        /** 4. RESIZE & INIT */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!gameActive) {
                player.x = width * 0.2;
                player.y = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function createCloud() {
            return {
                x: width + Math.random() * 200,
                y: Math.random() * (height * 0.6),
                size: 30 + Math.random() * 50,
                speed: 0.5 + Math.random() * 1
            };
        }

        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * width,
                y: Math.random() * (height * 0.6),
                size: 30 + Math.random() * 50,
                speed: 0.5 + Math.random() * 1
            });
        }

        function initGame() {
            score = 0;
            frameCount = 0;
            player.y = height / 2;
            player.velocity = 0;
            player.rotation = 0;
            player.x = width * 0.2;
            obstacles = [];
            coins = [];
            particles = [];
            document.getElementById('score').innerText = score;
            clearFeedback();
            setMoodState('Stonk calm');
            clearTimeout(tutorialTimeout);
            document.getElementById('tutorial').classList.remove('hidden');
            tutorialTimeout = setTimeout(() => document.getElementById('tutorial').classList.add('hidden'), 2000);
        }

        /** 5. GAME LOGIC */
        function spawnEntities() {
            if (frameCount % 100 === 0) {
                const gapHeight = 220;
                const gapY = Math.random() * (height - gapHeight - 100) + 50;
                
                obstacles.push({
                    x: width,
                    y: 0,
                    w: 60,
                    h: gapY,
                    type: 'wall',
                    scored: false
                });
                
                obstacles.push({
                    x: width,
                    y: gapY + gapHeight,
                    w: 60,
                    h: height - (gapY + gapHeight),
                    type: 'wall',
                    scored: false
                });

                if (Math.random() > 0.3) {
                    coins.push({
                        x: width + 30,
                        y: gapY + gapHeight / 2,
                        radius: 15,
                        collected: false,
                        wobble: Math.random() * Math.PI
                    });
                }
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            player.velocity += player.gravity;
            player.y += player.velocity;
            player.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (player.velocity * 0.1)));

            if (player.y + player.radius > height || player.y - player.radius < 0) {
                gameOver();
                return;
            }

            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.size < 0) {
                    c.x = width + c.size;
                    c.y = Math.random() * (height * 0.6);
                }
            });

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= 4 + (score * 0.05);

                let testX = player.x;
                let testY = player.y;

                if (player.x < obs.x) testX = obs.x;
                else if (player.x > obs.x + obs.w) testX = obs.x + obs.w;
                
                if (player.y < obs.y) testY = obs.y;
                else if (player.y > obs.y + obs.h) testY = obs.y + obs.h;

                let distX = player.x - testX;
                let distY = player.y - testY;
                let distance = Math.sqrt((distX * distX) + (distY * distY));

                if (distance <= player.radius - 5) {
                    gameOver();
                    return;
                }

                if (!obs.scored && obs.y === 0 && obs.x + obs.w < player.x) {
                    obs.scored = true;
                    audio.playSFX('pass', 180);
                    setMoodState('Thread dodged');
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.x -= 4 + (score * 0.05);
                c.wobble += 0.1;
                c.y += Math.sin(c.wobble) * 1;

                let dx = player.x - c.x;
                let dy = player.y - c.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + c.radius) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', 120);
                    createExplosion(c.x, c.y, COLORS.coin);
                    flashGif(pickupGif, 'pickup', 'Stonks up', 1100);
                    coins.splice(i, 1);
                } else if (c.x + c.radius < 0) {
                    coins.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            spawnEntities();
            frameCount++;
        }

        /** 6. RENDER */
        function draw() {
            ctx.clearRect(0, 0, width, height);

            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(0.55, COLORS.skyMid);
            grad.addColorStop(1, COLORS.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const halo = ctx.createRadialGradient(width * 0.35, height * 0.18, 20, width * 0.35, height * 0.18, width * 0.45);
            halo.addColorStop(0, 'rgba(115, 247, 255, 0.22)');
            halo.addColorStop(1, 'rgba(115, 247, 255, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 18; i++) {
                const x = (i * width) / 18 + ((frameCount * 0.35) % (width / 9));
                const y = ((i % 6) * height) / 6 + 30;
                ctx.fillStyle = 'rgba(143, 91, 255, 0.12)';
                ctx.fillRect(x, y, 2, 16);
            }

            clouds.forEach(c => {
                const cloudGrad = ctx.createRadialGradient(c.x, c.y, 5, c.x, c.y, c.size * 1.2);
                cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.94)');
                cloudGrad.addColorStop(1, 'rgba(115, 247, 255, 0.16)');
                ctx.fillStyle = cloudGrad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x - c.size * 0.5, c.y + c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.5, c.y + c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });

            obstacles.forEach(obs => {
                const wallGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y);
                wallGrad.addColorStop(0, COLORS.obstacleEdge);
                wallGrad.addColorStop(0.5, COLORS.obstacle);
                wallGrad.addColorStop(1, '#ff8ba0');
                ctx.fillStyle = wallGrad;
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                for (let y = obs.y + 16; y < obs.y + obs.h; y += 32) {
                    ctx.fillRect(obs.x + 7, y, obs.w - 14, 4);
                }

                ctx.fillStyle = 'rgba(10, 7, 20, 0.32)';
                ctx.font = '700 18px Audiowide';
                ctx.save();
                ctx.beginPath();
                ctx.rect(obs.x, obs.y, obs.w, obs.h);
                ctx.clip();
                ctx.fillText("BAN", obs.x + 9, obs.y + 28);
                ctx.fillText("VOID", obs.x + 8, obs.y + 68);
                ctx.restore();

                ctx.strokeStyle = COLORS.obstacleEdge;
                ctx.lineWidth = 3;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);

                ctx.strokeStyle = 'rgba(115, 247, 255, 0.22)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8);
            });

            coins.forEach(c => {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.shadowColor = 'rgba(125, 255, 155, 0.6)';
                ctx.shadowBlur = 18;

                ctx.fillStyle = COLORS.coin;
                ctx.beginPath();
                ctx.moveTo(0, -16);
                ctx.lineTo(16, 2);
                ctx.lineTo(7, 2);
                ctx.lineTo(7, 17);
                ctx.lineTo(-7, 17);
                ctx.lineTo(-7, 2);
                ctx.lineTo(-16, 2);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = COLORS.coinEdge;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(-2, -10, 4, 16);

                ctx.restore();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);

            ctx.shadowColor = COLORS.playerGlow;
            ctx.shadowBlur = 28;

            const faceGrad = ctx.createRadialGradient(-8, -10, 4, 0, 0, player.radius + 6);
            faceGrad.addColorStop(0, '#fff7ad');
            faceGrad.addColorStop(0.65, COLORS.player);
            faceGrad.addColorStop(1, COLORS.playerShade);

            ctx.fillStyle = faceGrad;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#090b15';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.24)';
            ctx.beginPath();
            ctx.arc(-9, -11, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#05070f';
            ctx.fillRect(-20, -10, 18, 10);
            ctx.fillRect(2, -10, 18, 10);
            ctx.fillRect(-2, -8, 4, 2);

            ctx.strokeStyle = '#05070f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 5, 11, 0.28, Math.PI - 0.3);
            ctx.stroke();

            ctx.fillStyle = '#ff8aa1';
            ctx.fillRect(-6, 10, 12, 3);

            ctx.restore();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            if (!gameActive) return;
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 200);
            flashGif(failGif, 'fail', 'Ban slammed', 1800);
            
            const comments = [
                "You clipped the filter wall.",
                "That hop came in a beat too late.",
                "Stonk run denied. Queue up another jump.",
                "The lane closed before you slipped through.",
                "You hit the ban wall before cashing out."
            ];
            document.getElementById('meme-comment').innerText = comments[Math.floor(Math.random() * comments.length)];

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            setAudioState(audio.enabled ? 'Loop parked' : 'Muted');
        }

        /** 7. INPUT HANDLING */
        function jump() {
            if (gameActive) {
                player.velocity = player.jumpStrength;
                audio.playSFX('jump', 110);
                setMoodState('Moon hop');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
                armAudio();
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        // [agent-note][stage4] repaired: mobile-action-path | scope touch suppression to canvas so CTA buttons keep native tap/click behavior
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            armAudio();
            jump();
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            armAudio();
            audio.playSFX('ui', 80);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            setAudioState(audio.enabled ? 'Loop live' : 'Muted');
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            armAudio();
            audio.playSFX('ui', 80);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            setAudioState(audio.enabled ? 'Loop live' : 'Muted');
            gameLoop();
        });

        pickupGif.src = ASSETS.gifs.pickup;
        failGif.src = ASSETS.gifs.fail;
        setAudioState('Tap to arm');
        setMoodState('Stonk calm');
    });
    </script>
</body>
