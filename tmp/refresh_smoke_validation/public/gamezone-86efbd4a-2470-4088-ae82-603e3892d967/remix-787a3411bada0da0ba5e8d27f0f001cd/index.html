<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Void Runner</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | title/ui=Orbitron via workspace catalog to remove non-bundled font refs -->
    <link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Orbitron_wght_400_700_900_display_swap.css">
    <style>
        :root {
            --bg-main: #070914;
            --bg-panel: rgba(12, 16, 34, 0.88);
            --panel-edge: rgba(117, 224, 255, 0.38);
            --text-main: #f4f8ff;
            --text-dim: #ced9f8;
            --text-muted: #8ea4d6;
            --cyan: #75e0ff;
            --cyan-strong: #45bfff;
            --cyan-soft: #c7f4ff;
            --violet: #a855f7;
            --violet-deep: #5b21b6;
            --amber: #ffbf5f;
            --red: #ef4444;
            --skyline-glow: rgba(69, 191, 255, 0.2);
            --hero-core: #75e0ff;
            --hero-trail: #c084fc;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(117, 224, 255, 0.1), transparent 30%),
                linear-gradient(180deg, #0a1024 0%, #070914 55%, #04050b 100%);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(117, 224, 255, 0.06), transparent 18%, transparent 82%, rgba(168, 85, 247, 0.08)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px);
            opacity: 0.4;
        }

        canvas {
            display: block;
            touch-action: none;
            margin: auto;
            border: 1px solid rgba(117, 224, 255, 0.25);
            border-radius: 1.2rem;
            box-shadow:
                0 0 0 1px rgba(199, 244, 255, 0.06),
                0 0 24px var(--skyline-glow),
                0 0 60px rgba(91, 33, 182, 0.18);
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(18, 24, 49, 0.96), rgba(8, 11, 24, 0.92));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(199, 244, 255, 0.06),
                0 18px 36px rgba(0, 0, 0, 0.34),
                0 0 30px rgba(69, 191, 255, 0.1);
        }

        .neon-text { text-shadow: 0 0 14px rgba(117, 224, 255, 0.8); color: var(--cyan-soft); }
        .neon-accent { text-shadow: 0 0 12px rgba(255, 191, 95, 0.65); color: var(--amber); }

        .neon-btn {
            background: linear-gradient(135deg, #14345f, #2466b3 60%, #4c9dfd);
            box-shadow: 0 0 18px rgba(69, 191, 255, 0.3);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            border: 2px solid rgba(199, 244, 255, 0.7);
            color: #fff;
            cursor: pointer;
            width: 100%;
            border-radius: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 700;
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(34, 197, 94, 0.6);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at 50% 0%, rgba(117, 224, 255, 0.08), transparent 28%),
                linear-gradient(180deg, #090d1d, #04050b);
        }

        #ui-layer {
            user-select: none;
            -webkit-user-select: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel {
            pointer-events: auto;
            width: min(90%, 24rem);
            padding: 2rem;
            border-radius: 1.25rem;
            text-align: center;
            transform: translateZ(0);
            transition: all 0.3s;
        }

        .panel-start { border-top: 4px solid var(--cyan); }
        .panel-over { border-top: 4px solid var(--red); }
        .hidden { display: none !important; }

        .title-main,
        .title-sub,
        .screen-title,
        .hud-score,
        .hud-speed {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .title-main {
            margin: 0 0 0.2rem;
            font-size: clamp(2.75rem, 8vw, 3.4rem);
            line-height: 0.9;
            letter-spacing: -0.04em;
        }

        .title-sub {
            display: inline-block;
            color: #fff;
            font-size: clamp(2rem, 6vw, 2.6rem);
        }

        .screen-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 6vw, 2.4rem);
            line-height: 1;
            letter-spacing: 0.06em;
        }

        .mission-block {
            margin: 1.5rem 0;
            display: grid;
            gap: 0.5rem;
        }

        .mission-copy {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-dim);
            letter-spacing: 0.06em;
            line-height: 1.45;
            font-weight: 600;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .chip {
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .chip-green {
            background: rgba(20, 55, 92, 0.62);
            color: #d8f7ff;
            border-color: rgba(117, 224, 255, 0.4);
        }

        .chip-purple {
            background: rgba(74, 29, 136, 0.48);
            color: #eee1ff;
            border-color: rgba(192, 132, 252, 0.34);
        }

        .primary-btn {
            padding: 0.9rem 1rem;
            font-size: 1.65rem;
        }

        .result-copy {
            margin: 1rem 0 2rem;
            font-size: 1.35rem;
            color: var(--text-dim);
            line-height: 1.45;
            font-weight: 600;
        }

        .result-score {
            color: var(--cyan-soft);
            font-weight: 700;
            font-size: 2.6rem;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
        }

        .hud-group-right { align-items: flex-end; }

        .hud-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .hud-score {
            font-size: clamp(1.9rem, 6vw, 2.4rem);
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(117, 224, 255, 0.75);
        }

        .hud-speed {
            font-size: 1.22rem;
            color: #d9c2ff;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .feedback-gif {
            position: absolute;
            right: clamp(0.75rem, 2vw, 1.4rem);
            width: clamp(96px, 20vw, 140px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(117, 224, 255, 0.35);
            box-shadow: 0 0 18px rgba(69, 191, 255, 0.22);
            background: rgba(7, 9, 20, 0.66);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 70;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #jump-gif {
            top: clamp(5.5rem, 12vw, 7.5rem);
        }

        #danger-gif {
            bottom: clamp(1rem, 3vw, 1.5rem);
        }

        .feedback-tag {
            position: absolute;
            right: clamp(0.75rem, 2vw, 1.4rem);
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            font-size: 0.82rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            color: #f8fbff;
            background: rgba(8, 12, 28, 0.8);
            border: 1px solid rgba(117, 224, 255, 0.35);
            box-shadow: 0 0 12px rgba(69, 191, 255, 0.18);
            pointer-events: none;
            z-index: 71;
        }

        #jump-tag {
            top: clamp(4.2rem, 9vw, 5.9rem);
        }

        #danger-tag {
            bottom: clamp(8.2rem, 18vw, 9.2rem);
            border-color: rgba(239, 68, 68, 0.35);
        }

        @media (max-width: 480px) {
            .panel { padding: 1.5rem; }
            .primary-btn { font-size: 1.2rem; }
            #hud { padding: 1rem; }
            .control-row { font-size: 0.82rem; gap: 0.5rem; }
            .chip { padding: 0.35rem 0.65rem; }
            .result-copy { font-size: 1.1rem; }
            .feedback-gif {
                width: 88px;
                right: 0.6rem;
            }
            #jump-gif {
                top: 5.8rem;
            }
            #danger-gif {
                bottom: 0.85rem;
            }
            #jump-tag {
                top: 4.6rem;
                right: 0.6rem;
                font-size: 0.72rem;
            }
            #danger-tag {
                bottom: 6.8rem;
                right: 0.6rem;
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<script id="game-config" type="application/x-game-config">

<!-- [agent-note][stage3] resolved-audio: jump/land/game-over/ui + gameplay loop from catalogs/audios.json -->
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
<audio id="sfx_land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="start-screen" class="glass panel panel-start">
            <h1 class="title-main neon-text">VOID<br><span class="title-sub">RUNNER</span></h1>
            <div class="mission-block">
                <p class="mission-copy">Guide a pulse-suited courier across the shattered skyline and keep the jet-trail alive.</p>
                <div class="control-row">
                    <span class="chip chip-green">TAP = JUMP</span>

        <!-- [agent-note][stage3] resolved-gif: jump-feedback + danger-feedback from catalogs/gifs.json -->

        <img id="danger-gif" class="feedback-gif hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Danger feedback animation">

</div>

<script>
window.gameConfig = {
    heroSpeed: 9,
    gravity: 0.55,
    jumpForce: 14,
    themeColor: "#4ade80"
};

class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmNode = document.getElementById('bgm_main');
        this.unlocked = false;
        this.muted = false;
        this.lastPlayTimes = {};
        this.sfxMap = {
            jump: { node: document.getElementById('sfx_jump'), volume: 0.42, debounceMs: 90 },
            land: { node: document.getElementById('sfx_land'), volume: 0.34, debounceMs: 110 },
            dead: { node: document.getElementById('sfx_fail'), volume: 0.55, debounceMs: 300 },
            ui: { node: document.getElementById('sfx_ui'), volume: 0.45, debounceMs: 120 }
        };
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    playBgm() {
        if (this.bgmNode && !this.muted) {
            this.bgmNode.volume = 0.2;
            this.bgmNode.play().catch(() => {});
        }
    }

    stopBgm() {
        if (this.bgmNode) {
            this.bgmNode.pause();
            this.bgmNode.currentTime = 0;
        }
    }

    playSfx(type) {
        if (this.muted || !this.unlocked) return;
        const entry = this.sfxMap[type];
        if (!entry || !entry.node) return;

        const now = performance.now();
        const last = this.lastPlayTimes[type] || 0;
        if (now - last < entry.debounceMs) return;
        this.lastPlayTimes[type] = now;

        try {
            entry.node.pause();
            entry.node.currentTime = 0;
            entry.node.volume = entry.volume;
            entry.node.play().catch(() => {});
        } catch (_) {}
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const ui = {
        start: document.getElementById('start-screen'),
        over: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud'),
        score: document.getElementById('score'),
        finalScore: document.getElementById('finalScore'),
        speed: document.getElementById('speed-display'),
        startBtn: document.getElementById('start-btn'),
        restartBtn: document.getElementById('restart-btn'),
        jumpGif: document.getElementById('jump-gif'),
        jumpTag: document.getElementById('jump-tag'),
        dangerGif: document.getElementById('danger-gif'),
        dangerTag: document.getElementById('danger-tag')
    };

    let audio = new AudioManager();
    let animId;
    let lastTime = 0;
    let jumpGifTimer;
    let dangerGifTimer;

    const LOGICAL_WIDTH = 720;
    const LOGICAL_HEIGHT = 1280;

    let state = {
        playing: false,
        score: 0,
        distance: 0,
        speed: 0,
        difficultyMultiplier: 1,
        cameraShake: 0,
        bgOffset: 0,
        lastDangerBand: -1
    };

    let hero = {
        x: 100,
        y: 0,
        w: 40, h: 60,
        vx: 0, vy: 0,
        grounded: false,
        doubleJump: true,
        rotation: 0,
        squash: 1,
        hovering: false
    };

    let platforms = [];
    let particles = [];
    let stars = [];

    function resize() {
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        const aspect = LOGICAL_WIDTH / LOGICAL_HEIGHT;
        let finalW = winW;
        let finalH = winW / aspect;

        if (finalH > winH) {
            finalH = winH;
            finalW = winH * aspect;
        }

        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;

        canvas.style.width = `${finalW}px`;
        canvas.style.height = `${finalH}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * LOGICAL_WIDTH,
            y: Math.random() * LOGICAL_HEIGHT,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.1,
            alpha: Math.random()
        });
    }

    function showGif(kind, duration = 900) {
        const gifNode = kind === 'danger' ? ui.dangerGif : ui.jumpGif;
        const tagNode = kind === 'danger' ? ui.dangerTag : ui.jumpTag;
        const timerKey = kind === 'danger' ? 'dangerGifTimer' : 'jumpGifTimer';

        gifNode.classList.remove('hidden');
        tagNode.classList.remove('hidden');
        requestAnimationFrame(() => {
            gifNode.classList.add('visible');
            tagNode.classList.add('visible');
        });

        clearTimeout(kind === 'danger' ? dangerGifTimer : jumpGifTimer);
        const timeoutId = setTimeout(() => {
            gifNode.classList.remove('visible');
            tagNode.classList.remove('visible');
            setTimeout(() => {
                gifNode.classList.add('hidden');
                tagNode.classList.add('hidden');
            }, 220);
        }, duration);

        if (timerKey === 'dangerGifTimer') {
            dangerGifTimer = timeoutId;
        } else {
            jumpGifTimer = timeoutId;
        }
    }

    function initGame() {
        state.playing = true;
        state.score = 0;
        state.distance = 0;
        state.speed = window.gameConfig.heroSpeed;
        state.difficultyMultiplier = 1;
        state.cameraShake = 0;
        state.lastDangerBand = -1;

        hero.y = LOGICAL_HEIGHT / 2;
        hero.vy = 0;
        hero.grounded = false;
        hero.doubleJump = true;
        hero.rotation = 0;
        hero.hovering = false;

        platforms = [];
        platforms.push({ x: 0, y: LOGICAL_HEIGHT - 300, w: LOGICAL_WIDTH * 1.5, h: 80, type: 'start' });

        particles = [];

        ui.start.classList.add('hidden');
        ui.over.classList.add('hidden');
        ui.hud.classList.remove('hidden');
        ui.dangerGif.classList.add('hidden');
        ui.dangerTag.classList.add('hidden');

        audio.unlock();
        audio.playSfx('ui');
        lastTime = performance.now();
        loop(lastTime);
    }

    let isTouching = false;

    function handleJump() {
        if (!state.playing) return;

        if (hero.grounded) {
            hero.vy = -window.gameConfig.jumpForce;
            hero.grounded = false;
            hero.doubleJump = true;
            hero.squash = 0.6;
            createParticles(hero.x + hero.w / 2, hero.y + hero.h, 10, '#4ade80');
            audio.playSfx('jump');
            showGif('jump', 720);
        } else if (hero.doubleJump) {
            hero.vy = -window.gameConfig.jumpForce * 0.9;
            hero.doubleJump = false;
            hero.rotation += Math.PI * 2;
            createParticles(hero.x + hero.w / 2, hero.y + hero.h / 2, 8, '#a855f7');
            audio.playSfx('jump');
            showGif('jump', 820);
        }
    }

    const onPointerDown = (e) => {
        if (!audio.unlocked) audio.unlock();
        e.preventDefault();
        isTouching = true;
        handleJump();
        hero.hovering = true;
    };

    const onPointerUp = (e) => {
        e.preventDefault();
        isTouching = false;
        hero.hovering = false;
        if (hero.vy < -5) {
            hero.vy *= 0.5;
        }
    };

    // [agent-note][stage4] repaired: mobile-actionability | element: #gameCanvas | action: scoped gesture prevention away from menu buttons
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    window.addEventListener('pointerup', onPointerUp, { passive: false });
    window.addEventListener('pointercancel', onPointerUp, { passive: false });

    ui.startBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });
    ui.restartBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });

    function loop(now) {
        if (!state.playing) return;

        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        update(dt);
        draw();

        animId = requestAnimationFrame(loop);
    }

    function update(dt) {
        state.difficultyMultiplier += dt * 0.015;
        const currentSpeed = state.speed * state.difficultyMultiplier * 60 * dt;

        state.distance += currentSpeed * dt * 5;

        let gravity = window.gameConfig.gravity;

        if (hero.hovering && !hero.grounded && hero.vy > 0) {
            gravity *= 0.2;
            hero.vy *= 0.95;
            if (Math.random() > 0.5) {
                createParticles(hero.x + hero.w / 2, hero.y + hero.h, 1, '#a855f7');
            }
        }

        hero.vy += gravity * 60 * dt;
        hero.y += hero.vy * 60 * dt;

        if (hero.rotation > 0) hero.rotation -= 15 * dt;
        hero.squash += (1 - hero.squash) * 10 * dt;

        if (platforms.length < 6) spawnPlatform();

        let onGround = false;

        platforms.forEach(p => {
            p.x -= currentSpeed;

            if (hero.x + hero.w * 0.6 > p.x && hero.x + hero.w * 0.4 < p.x + p.w) {
                if (hero.y + hero.h >= p.y && hero.y + hero.h <= p.y + 45 && hero.vy >= 0) {
                    hero.y = p.y - hero.h;
                    hero.vy = 0;
                    onGround = true;
                    if (!hero.grounded) {
                        hero.squash = 1.3;
                        createParticles(hero.x + hero.w / 2, hero.y + hero.h, 5, '#cbd5e1');
                        audio.playSfx('land');
                    }
                }
            }
        });

        hero.grounded = onGround;

        const dangerBand = Math.floor(state.distance / 150);
        if (dangerBand > state.lastDangerBand && dangerBand > 0) {
            state.lastDangerBand = dangerBand;
            showGif('danger', 1100);
        }

        if (hero.y > LOGICAL_HEIGHT + 100) {
            die();
        }

        platforms = platforms.filter(p => p.x + p.w > -200);

        state.score = Math.floor(state.distance);
        ui.score.textContent = state.score;
        ui.speed.textContent = Math.floor(state.difficultyMultiplier * 100);

        if (state.cameraShake > 0) state.cameraShake *= 0.9;

        updateParticles(dt);

        stars.forEach(s => {
            s.x -= currentSpeed * s.speed * 0.2;
            if (s.x < 0) s.x = LOGICAL_WIDTH;
        });
    }

    function spawnPlatform() {
        const last = platforms[platforms.length - 1];
        const minGap = 150 * state.difficultyMultiplier;
        const maxGap = 350 + (state.difficultyMultiplier * 50);
        const gap = minGap + Math.random() * (maxGap - minGap);

        const w = 150 + Math.random() * 300;

        let y = last.y + (Math.random() - 0.5) * 400;
        y = Math.max(200, Math.min(LOGICAL_HEIGHT - 200, y));

        platforms.push({ x: last.x + last.w + gap, y, w, h: 40, type: 'normal' });
    }

    function die() {
        state.playing = false;
        cancelAnimationFrame(animId);
        audio.playSfx('dead');
        audio.stopBgm();
        showGif('danger', 1600);

        ui.finalScore.textContent = state.score;
        ui.hud.classList.add('hidden');
        ui.over.classList.remove('hidden');
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0,
                color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * 60 * dt;
            p.y += p.vy * 60 * dt;
            p.life -= 2 * dt;
            p.size *= 0.95;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        const skyGradient = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
        skyGradient.addColorStop(0, '#081124');
        skyGradient.addColorStop(0.45, '#0b1630');
        skyGradient.addColorStop(1, '#04060d');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        const glowGradient = ctx.createRadialGradient(LOGICAL_WIDTH * 0.5, 160, 50, LOGICAL_WIDTH * 0.5, 160, 520);
        glowGradient.addColorStop(0, 'rgba(117, 224, 255, 0.14)');
        glowGradient.addColorStop(1, 'rgba(117, 224, 255, 0)');
        ctx.fillStyle = glowGradient;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${0.25 + s.alpha * 0.75})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = 'rgba(20, 29, 56, 0.85)';
        for (let i = 0; i < 7; i++) {
            const width = 90 + i * 18;
            const height = 160 + (i % 3) * 70;
            const x = ((i * 120) - (state.distance * 0.12)) % (LOGICAL_WIDTH + 120) - 120;
            const y = LOGICAL_HEIGHT - 250 - height;
            ctx.fillRect(x, y, width, height);
            ctx.fillStyle = 'rgba(117, 224, 255, 0.18)';
            for (let row = 0; row < 4; row++) {
                ctx.fillRect(x + 12, y + 18 + row * 28, width - 24, 6);
            }
            ctx.fillStyle = 'rgba(20, 29, 56, 0.85)';
        }

        ctx.save();
        const shakeX = (Math.random() - 0.5) * state.cameraShake;
        const shakeY = (Math.random() - 0.5) * state.cameraShake;
        ctx.translate(shakeX, shakeY);

        platforms.forEach(p => {
            const platformGradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            platformGradient.addColorStop(0, '#1d335a');
            platformGradient.addColorStop(1, '#10192d');
            ctx.fillStyle = platformGradient;
            ctx.fillRect(p.x, p.y, p.w, p.h);

            ctx.fillStyle = '#75e0ff';
            ctx.shadowColor = '#75e0ff';
            ctx.shadowBlur = 16;
            ctx.fillRect(p.x, p.y, p.w, 6);
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(199, 244, 255, 0.22)';
            ctx.fillRect(p.x + 10, p.y + 14, p.w - 20, 4);
        });

        ctx.save();
        ctx.translate(hero.x + hero.w / 2, hero.y + hero.h);
        ctx.scale(1 / hero.squash, hero.squash);
        ctx.rotate(hero.rotation);

        ctx.shadowColor = window.gameConfig.themeColor;
        ctx.shadowBlur = 24;
        ctx.fillStyle = window.gameConfig.themeColor;
        ctx.beginPath();
        ctx.ellipse(0, -hero.h + 20, 24, 26, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#12284d';
        ctx.fillRect(-17, -hero.h + 36, 34, 24);

        ctx.fillStyle = '#d7f9ff';
        ctx.beginPath();
        ctx.arc(-10, -hero.h + 18, 7, 0, Math.PI * 2);
        ctx.arc(10, -hero.h + 18, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#07111f';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(-10, -hero.h + 18, 3.5, 0, Math.PI * 2);
        ctx.arc(10, -hero.h + 18, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#07111f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -hero.h + 30, 8, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-13, -hero.h + 46);
        ctx.lineTo(-22, -hero.h + 58);
        ctx.moveTo(13, -hero.h + 46);
        ctx.lineTo(22, -hero.h + 58);
        ctx.stroke();

        ctx.strokeStyle = window.gameConfig.themeColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -hero.h + 4);
        ctx.lineTo(0, -hero.h - 14);
        ctx.stroke();

        ctx.fillStyle = '#ffbf5f';
        ctx.beginPath();
        ctx.arc(0, -hero.h - 16, 5, 0, Math.PI * 2);
        ctx.fill();

        if (hero.hovering && !hero.grounded) {
            ctx.fillStyle = 'rgba(192, 132, 252, 0.75)';
            ctx.beginPath();
            ctx.moveTo(-12, -hero.h + 60);
            ctx.lineTo(0, -hero.h + 88 + Math.random() * 8);
            ctx.lineTo(12, -hero.h + 60);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }
});
</script>
