<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Midnight Signal: 1% Chance</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] repaired: catalog-font-remap + mobile-tap-safety | ui=Rajdhani title=Orbitron accent=VT323 | keep native tap behavior on overlays/buttons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #070b18;
            --bg-bottom: #081123;
            --panel: rgba(9, 18, 39, 0.82);
            --panel-strong: rgba(8, 16, 34, 0.92);
            --panel-border: rgba(109, 246, 255, 0.24);
            --text-main: #eff7ff;
            --text-soft: #a6bdd8;
            --accent: #67f0ff;
            --accent-strong: #13d7ff;
            --accent-hot: #6cf7d1;
            --danger: #ff6b7b;
            --danger-soft: #ffb26f;
            --glow: rgba(19, 215, 255, 0.35);
            --shadow: rgba(0, 0, 0, 0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(17, 84, 119, 0.28), transparent 35%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.03) 0 1px, transparent 1px 100%),
                linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 100%);
            background-size: 100% 4px, 4px 100%;
            opacity: 0.28;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(12, 23, 50, 0.88), rgba(5, 12, 26, 0.92));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 14px 40px rgba(0,0,0,0.45),
                0 0 28px rgba(19, 215, 255, 0.12);
        }

        .hidden { display: none !important; }

        .title-font { font-family: 'Orbitron', 'Trebuchet MS', sans-serif; }
        .ui-font { font-family: 'Rajdhani', system-ui, sans-serif; }
        .accent-font { font-family: 'VT323', monospace; }

        .hud-shell {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        .hud-card {
            pointer-events: auto;
            min-width: 0;
            border-radius: 18px;
            padding: 10px 14px;
            background:
                linear-gradient(180deg, rgba(12, 24, 50, 0.84), rgba(6, 14, 31, 0.94));
            border: 1px solid rgba(103, 240, 255, 0.26);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.07),
                0 0 18px rgba(19, 215, 255, 0.14);
        }

        .score-label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 4px;
        }

        .score-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            color: var(--text-main);
            text-shadow: 0 0 14px rgba(103, 240, 255, 0.22);
        }

        .score-value {
            color: var(--accent);
            font-size: clamp(1.05rem, 3vw, 1.6rem);
        }

        .danger-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .danger-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1;
        }

        .danger-copy .label {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--text-soft);
            margin-bottom: 5px;
        }

        .danger-copy .state {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .danger-indicator {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 2px solid rgba(130, 146, 176, 0.5);
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.28), rgba(35, 46, 71, 0.96));
            box-shadow:
                inset 0 0 14px rgba(255,255,255,0.06),
                0 0 12px rgba(0,0,0,0.3);
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
            flex-shrink: 0;
        }

        .status-idle {
            border-color: rgba(110, 132, 167, 0.45);
            background: radial-gradient(circle at 35% 35%, rgba(169, 190, 214, 0.25), rgba(25, 37, 58, 0.96));
            box-shadow: inset 0 0 14px rgba(255,255,255,0.05), 0 0 10px rgba(6, 14, 31, 0.5);
        }

        .status-warning {
            border-color: rgba(255, 201, 109, 0.9);
            background: radial-gradient(circle at 35% 35%, rgba(255, 241, 190, 0.75), rgba(255, 143, 37, 0.92));
            box-shadow: 0 0 18px rgba(255, 180, 70, 0.48);
            animation: warning-pulse 0.75s infinite;
        }

        .status-danger {
            border-color: rgba(255, 133, 154, 0.9);
            background: radial-gradient(circle at 35% 35%, rgba(255, 219, 224, 0.76), rgba(255, 72, 89, 0.94));
            box-shadow: 0 0 20px rgba(255, 80, 102, 0.45);
            transform: scale(1.03);
        }

        .arc-panel {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            padding: 22px 18px 20px;
            max-width: min(92vw, 480px);
            margin: 0 14px;
            box-sizing: border-box;
        }

        .arc-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(103, 240, 255, 0.1), transparent 30%),
                radial-gradient(circle at top right, rgba(19, 215, 255, 0.18), transparent 34%);
        }

        .eyeline {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .eye {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 35%, #fff, #9ff6ff 40%, #0db6db 72%, #04526a 100%);
            box-shadow: 0 0 18px rgba(103, 240, 255, 0.45);
            animation: blink-rest 4s infinite;
        }

        .mascot-signal {
            width: min(44vw, 172px);
            height: min(44vw, 172px);
            max-width: 172px;
            max-height: 172px;
            margin: 0 auto 14px;
            border-radius: 32% 32% 38% 38%;
            position: relative;
            background:
                radial-gradient(circle at 50% 35%, rgba(103, 240, 255, 0.26), transparent 34%),
                linear-gradient(180deg, rgba(27, 52, 90, 0.98), rgba(10, 18, 33, 0.98));
            border: 1px solid rgba(109, 246, 255, 0.26);
            box-shadow:
                inset 0 -18px 32px rgba(0, 0, 0, 0.34),
                0 0 30px rgba(19, 215, 255, 0.14);
        }

        .mascot-signal::before,
        .mascot-signal::after {
            content: "";
            position: absolute;
            top: -16px;
            width: 34px;
            height: 34px;
            border-radius: 8px 16px 6px 18px;
            background: linear-gradient(180deg, rgba(23, 52, 84, 0.98), rgba(7, 16, 30, 0.98));
            border: 1px solid rgba(109, 246, 255, 0.2);
            box-shadow: 0 0 14px rgba(19, 215, 255, 0.14);
        }

        .mascot-signal::before { left: 26px; transform: rotate(-28deg); }
        .mascot-signal::after { right: 26px; transform: rotate(28deg); }

        .mascot-face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 10px;
        }

        .mascot-mouth {
            width: 44px;
            height: 12px;
            border-bottom: 3px solid rgba(183, 247, 255, 0.92);
            border-radius: 0 0 30px 30px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .signal-rings {
            position: absolute;
            inset: -12px;
            pointer-events: none;
        }

        .signal-rings span {
            position: absolute;
            inset: 10%;
            border: 1px solid rgba(103, 240, 255, 0.18);
            border-radius: 36%;
            animation: signal-wave 2.4s ease-out infinite;
        }

        .signal-rings span:nth-child(2) {
            inset: 2%;
            animation-delay: 0.8s;
        }

        .signal-rings span:nth-child(3) {
            inset: -6%;
            animation-delay: 1.6s;
        }

        .copy-kicker {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(103, 240, 255, 0.12);
            border: 1px solid rgba(103, 240, 255, 0.2);
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .panel-text {
            color: var(--text-soft);
            font-size: 1.05rem;
            line-height: 1.3;
            margin-bottom: 18px;
        }

        .cta-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(104, 246, 255, 0.28);
            background: linear-gradient(180deg, #1de3ff, #089ac7);
            color: #04121f;
            box-shadow: 0 10px 24px rgba(8, 154, 199, 0.36), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .cta-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.38), transparent);
            transform: translateX(-120%);
            animation: sheen 2.8s linear infinite;
        }

        .danger-screen {
            background:
                linear-gradient(180deg, rgba(63, 7, 18, 0.92), rgba(20, 3, 10, 0.95)),
                radial-gradient(circle at top, rgba(255, 116, 116, 0.15), transparent 40%);
        }

        .danger-title {
            color: #ff98a4;
            text-shadow: 0 0 20px rgba(255, 79, 104, 0.3);
        }

        .failure-card {
            margin-bottom: 18px;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 129, 148, 0.18);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        @keyframes warning-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(255, 180, 70, 0.3); }
            50% { transform: scale(1.07); box-shadow: 0 0 24px rgba(255, 180, 70, 0.55); }
        }

        @keyframes signal-wave {
            0% { transform: scale(0.92); opacity: 0; }
            35% { opacity: 0.35; }
            100% { transform: scale(1.08); opacity: 0; }
        }

        @keyframes blink-rest {
            0%, 46%, 52%, 100% { transform: scaleY(1); }
            49% { transform: scaleY(0.14); }
        }

        @keyframes sheen {
            to { transform: translateX(140%); }
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: min(32vw, 140px);
            height: min(32vw, 140px);
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 24px rgba(0,0,0,0.32);
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            background: rgba(5, 12, 26, 0.68);
        }

        .feedback-gif.visible {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.warning-gif {
            right: 12px;
            top: 92px;
        }

        .feedback-gif.fail-gif {
            left: 50%;
            bottom: 124px;
            transform: translate(-50%, 16px) scale(0.92);
            width: min(42vw, 180px);
            height: min(42vw, 180px);
        }

        .feedback-gif.fail-gif.visible {
            transform: translate(-50%, 0) scale(1);
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
            }

            .hud-card {
                padding: 9px 11px;
                border-radius: 16px;
            }

            .score-label,
            .danger-copy .label {
                font-size: 0.68rem;
            }

            .danger-copy .state {
                font-size: 0.84rem;
            }

            .danger-indicator {
                width: 38px;
                height: 38px;
            }

            .arc-panel {
                padding: 18px 14px 16px;
                border-radius: 24px;
                margin: 0 10px;
            }

            .panel-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/ui/warning/fail/broadcast mapped from catalogs/audios.json -->
<audio id="bgm_sneak" data-editable="audio" data-label="Night Shift BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Caught SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_win" data-editable="audio" data-label="Milestone SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx_warning" data-editable="audio" data-label="Patrol Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_click" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "baseDifficulty": { "type": "number", "label": "Parent Speed", "value": 1, "min": 0.5, "max": 3 },
    "scoreRate": { "type": "number", "label": "Score Rate", "value": 10, "min": 1, "max": 50 },
    "themeColor": { "type": "color", "label": "Glow Color", "value": "#06b6d4" }
}
</script>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    <div class="feedback-layer" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: warning+fail overlays via catalogs/gifs.json; kept off core touch zone -->
        <img
            id="warning-gif"
            class="feedback-gif warning-gif"
            alt=""
            src="https://i.giphy.com/TytHun5lKuMdzUYVxl.webp"
            loading="lazy"
            decoding="async"
        >
        <img
            id="fail-gif"
            class="feedback-gif fail-gif"
            alt=""
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            loading="lazy"
            decoding="async"
        >
    </div>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between p-4">
        
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled in place -->
        <!-- HUD -->
        <div id="hud" class="hidden hud-shell">
            <div class="hud-card">
                <span class="score-label ui-font">Broadcast</span>
                <div class="score-line title-font">
                    <span>SIGNAL</span>
                    <span id="score-display" class="score-value accent-font">0</span>
                    <span class="ui-font text-cyan-100 text-base">%</span>
                </div>
            </div>
            <div class="hud-card danger-wrap">
                <div class="danger-copy ui-font">
                    <span class="label">Patrol</span>
                    <span id="danger-text" class="state">Idle</span>
                </div>
                <div id="danger-indicator" class="danger-indicator status-idle"></div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center glass pointer-events-auto z-50">
            <div class="arc-panel text-center">
                <div class="copy-kicker title-font">Ghost channel online</div>
                <div class="mascot-signal" aria-hidden="true">
                    <div class="signal-rings">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="mascot-face">
                        <div class="eyeline">
                            <span class="eye"></span>
                            <span class="eye"></span>
                        </div>
                        <div class="mascot-mouth"></div>
                    </div>
                </div>
                <h1 class="title-font text-3xl md:text-5xl text-white font-bold mb-3 text-center tracking-[0.18em]" style="text-shadow: 0 0 20px rgba(19, 215, 255, 0.45);">
                    MIDNIGHT<br>SIGNAL
                </h1>
                <p class="panel-text ui-font px-1">
                    Hold to broadcast. Release to go dark.<br>
                    <span class="text-amber-300 font-semibold">Cut the glow before the hallway patrol locks on.</span>
                </p>
                <button id="start-btn" class="cta-btn title-font px-8 py-4 font-bold rounded-full text-base md:text-lg tracking-[0.2em] transform transition active:scale-95">
                    GO LIVE
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center glass danger-screen pointer-events-auto z-50">
            <div class="arc-panel text-center">
                <div class="copy-kicker title-font !text-red-200 !border-red-300/30 !bg-red-200/10">Patrol breach</div>
                <h2 class="danger-title title-font text-3xl md:text-5xl font-bold mb-3 tracking-[0.22em]">SIGNAL LOST</h2>
                <div class="failure-card ui-font text-lg md:text-xl">
                    Signal: <span id="final-score" class="text-cyan-200 accent-font">0</span>%
                </div>
                <button id="restart-btn" class="cta-btn title-font px-8 py-4 font-bold rounded-full text-base md:text-lg tracking-[0.16em] transform transition active:scale-95">
                    RECONNECT
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // Config
    let config = {
        baseDifficulty: 1,
        scoreRate: 10,
        themeColor: "#06b6d4"
    };

    // Parse Config
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        if(rawConfig) {
            config.baseDifficulty = rawConfig.baseDifficulty.value;
            config.scoreRate = rawConfig.scoreRate.value;
            config.themeColor = rawConfig.themeColor.value;
        }
    } catch(e) { console.error("Config parse error", e); }

    window.gameConfig = config; // Expose for editor
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.updateGameConfig = (key, val) => {
        if(config[key] !== undefined) config[key] = val;
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_sneak'),
        fail: document.getElementById('sfx_fail'),
        win: document.getElementById('sfx_win'),
        warning: document.getElementById('sfx_warning'),
        click: document.getElementById('sfx_click')
    };
    
    Object.assign(sounds.bgm, { volume: 0.2 });
    Object.assign(sounds.fail, { volume: 0.5 });
    Object.assign(sounds.win, { volume: 0.4 });
    Object.assign(sounds.warning, { volume: 0.34 });
    Object.assign(sounds.click, { volume: 0.28 });

    let isMuted = false;
    let warningSoundAt = 0;
    let lastBroadcastMilestone = 0;
    let warningGifTimeout = null;
    const warningGif = document.getElementById('warning-gif');
    const failGif = document.getElementById('fail-gif');

    const showReactionGif = (el, duration = 1200) => {
        if(!el) return;
        el.classList.add('visible');
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
    };

    const hideReactionGif = (el) => {
        if(!el) return;
        clearTimeout(el._hideTimer);
        el.classList.remove('visible');
    };

    const playSound = (id) => {
        if(isMuted) return;
        const el = sounds[id];
        if(el) {
            if(id === 'bgm') {
                el.play().catch(() => {});
                return;
            }
            if(el.currentTime > 0 && !el.paused) {
                el.pause();
            }
            el.currentTime = 0;
            el.play().catch(() => {});
        } else {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if(id === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            }
            gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.36);
        }
    };

    const unlockAudio = () => {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        playSound('bgm');
        document.removeEventListener('pointerdown', unlockAudio);
        document.removeEventListener('keydown', unlockAudio);
    };
    document.addEventListener('pointerdown', unlockAudio);
    document.addEventListener('keydown', unlockAudio);

    // --- Game State ---
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let lastTime = 0;
    let isHolding = false;
    
    // Parent AI
    const PARENT_STATES = {
        IDLE: 0,
        WARNING: 1,
        LOOKING: 2,
        COOLDOWN: 3
    };
    let parent = {
        state: PARENT_STATES.IDLE,
        timer: 0,
        doorOpen: 0, // 0 to 1
        anger: 0
    };

    // Particles
    let particles = [];

    const dangerIndicator = document.getElementById('danger-indicator');
    const dangerText = document.getElementById('danger-text');

    const setDangerStatus = (status, label) => {
        dangerIndicator.className = `danger-indicator ${status}`;
        dangerText.innerText = label;

        if(status === 'status-warning') {
            const now = performance.now();
            if(now - warningSoundAt > 650) {
                playSound('warning');
                warningSoundAt = now;
            }
            showReactionGif(warningGif, 1100);
        } else if(status === 'status-danger') {
            showReactionGif(warningGif, 1500);
        } else {
            clearTimeout(warningGifTimeout);
            warningGifTimeout = setTimeout(() => hideReactionGif(warningGif), 180);
        }
    };

    // --- Resize ---
    let width, height, dpr;
    const resize = () => {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input ---
    const handleStart = (e) => {
        e.preventDefault();
        if(gameState === 'PLAYING') isHolding = true;
    };
    const handleEnd = (e) => {
        e.preventDefault();
        isHolding = false;
    };

    canvas.addEventListener('pointerdown', handleStart, { passive: false });
    canvas.addEventListener('pointerup', handleEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleEnd, { passive: false });
    // Prevent context menu
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // --- Logic ---
    const resetGame = () => {
        score = 0;
        isHolding = false;
        lastBroadcastMilestone = 0;
        hideReactionGif(failGif);
        hideReactionGif(warningGif);
        parent = {
            state: PARENT_STATES.IDLE,
            timer: 2,
            doorOpen: 0,
            anger: 0
        };
        particles = [];
        document.getElementById('score-display').innerText = '0';
        setDangerStatus('status-idle', 'Idle');
    };

    const spawnParticle = (x, y, type) => {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 0.5,
            life: 1,
            type: type // 'zzz' or 'pixel'
        });
    };

    const update = (dt) => {
        if(gameState !== 'PLAYING') return;

        // Player Logic
        if(isHolding) {
            score += config.scoreRate * dt;
            document.getElementById('score-display').innerText = Math.floor(score);
            
            const milestone = Math.floor(score / 25);
            if(milestone > lastBroadcastMilestone) {
                lastBroadcastMilestone = milestone;
                playSound('win');
            }

            // Spawn fun particles
            if(Math.random() < 0.2) {
                spawnParticle(width * 0.3 + Math.random() * 100, height * 0.6, 'pixel');
            }
        } else {
            // Spawn Zzz particles
            if(Math.random() < 0.05) {
                spawnParticle(width * 0.2, height * 0.5, 'zzz');
            }
        }

        // Parent Logic
        parent.timer -= dt;
        
        switch(parent.state) {
            case PARENT_STATES.IDLE:
                parent.doorOpen = Math.max(0, parent.doorOpen - dt * 2);
                if(parent.timer <= 0) {
                    parent.state = PARENT_STATES.WARNING;
                    parent.timer = (Math.random() * 1.5 + 0.5) / config.baseDifficulty; // Random warning time
                    setDangerStatus('status-warning', 'Alert');
                }
                break;
                
            case PARENT_STATES.WARNING:
                // Door jiggles
                parent.doorOpen = Math.abs(Math.sin(Date.now() / 50)) * 0.1;
                if(parent.timer <= 0) {
                    parent.state = PARENT_STATES.LOOKING;
                    parent.timer = (Math.random() * 1.5 + 1.0); // Look duration
                    setDangerStatus('status-danger', 'Lock On');
                }
                break;
                
            case PARENT_STATES.LOOKING:
                parent.doorOpen = Math.min(1, parent.doorOpen + dt * 10); // Slam open
                
                // CHECK DEATH
                if(isHolding && parent.doorOpen > 0.5) {
                    gameOver();
                }
                
                if(parent.timer <= 0) {
                    parent.state = PARENT_STATES.COOLDOWN;
                    parent.timer = 1.0;
                    setDangerStatus('status-idle', 'Cooling');
                }
                break;
                
            case PARENT_STATES.COOLDOWN:
                parent.doorOpen = Math.max(0, parent.doorOpen - dt * 2);
                if(parent.timer <= 0) {
                    parent.state = PARENT_STATES.IDLE;
                    // Difficulty scaling: Less idle time as score increases
                    let difficultyMod = Math.min(2, 1 + score / 500);
                    parent.timer = (Math.random() * 3 + 1) / (config.baseDifficulty * difficultyMod);
                    setDangerStatus('status-idle', 'Idle');
                }
                break;
        }

        // Particles
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt;
        });
        particles = particles.filter(p => p.life > 0);
    };

    const gameOver = () => {
        gameState = 'GAMEOVER';
        playSound('fail');
        sounds.bgm.pause();
        showReactionGif(failGif, 2400);
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        
        // Shake effect
        canvas.style.transform = `translate(${Math.random()*10}px, ${Math.random()*10}px)`;
        setTimeout(() => canvas.style.transform = 'none', 200);
    };

    // --- Rendering ---
    const drawRoom = () => {
        const roomGlow = config.themeColor || '#06b6d4';

        // Background
        const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
        bgGrad.addColorStop(0, '#070b18');
        bgGrad.addColorStop(1, '#081123');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Ceiling haze
        const haze = ctx.createRadialGradient(width * 0.5, height * 0.12, 0, width * 0.5, height * 0.12, width * 0.55);
        haze.addColorStop(0, 'rgba(21, 87, 130, 0.22)');
        haze.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, 0, width, height);
        
        // Back wall panels
        ctx.fillStyle = '#101a31';
        ctx.fillRect(width * 0.06, height * 0.08, width * 0.58, height * 0.45);
        ctx.strokeStyle = 'rgba(103, 240, 255, 0.08)';
        ctx.lineWidth = 2;
        ctx.strokeRect(width * 0.06, height * 0.08, width * 0.58, height * 0.45);

        // Console strips
        for (let i = 0; i < 3; i++) {
            const y = height * (0.15 + i * 0.09);
            ctx.fillStyle = i % 2 === 0 ? 'rgba(17, 39, 71, 0.9)' : 'rgba(10, 25, 49, 0.9)';
            ctx.fillRect(width * 0.1, y, width * 0.24, height * 0.045);
            ctx.fillStyle = i === 1 ? roomGlow : 'rgba(140, 220, 255, 0.26)';
            ctx.fillRect(width * 0.115, y + 8, width * 0.05, 6);
        }

        // Floor
        const floorGrad = ctx.createLinearGradient(0, height * 0.58, 0, height);
        floorGrad.addColorStop(0, '#17233d');
        floorGrad.addColorStop(1, '#050a14');
        ctx.fillStyle = floorGrad;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.7);
        ctx.lineTo(width, height * 0.6);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Floor reflection rails
        ctx.strokeStyle = 'rgba(103, 240, 255, 0.08)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const y = height * (0.72 + i * 0.05);
            ctx.beginPath();
            ctx.moveTo(width * 0.12, y);
            ctx.lineTo(width * 0.88, y - height * 0.04);
            ctx.stroke();
        }
    };

    const drawBed = () => {
        const bedX = width * 0.1;
        const bedY = height * 0.5;
        const bedW = width * 0.5;
        const bedH = height * 0.3;

        // Bed base
        const baseGrad = ctx.createLinearGradient(bedX, bedY, bedX, bedY + bedH);
        baseGrad.addColorStop(0, '#223556');
        baseGrad.addColorStop(1, '#0d1528');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(bedX, bedY + bedH * 0.5, bedW, bedH * 0.5);

        // Bed edge light
        ctx.fillStyle = 'rgba(103, 240, 255, 0.15)';
        ctx.fillRect(bedX, bedY + bedH * 0.52, bedW, 4);

        // Blanket body (the main character silhouette)
        const blanketGrad = ctx.createLinearGradient(bedX, bedY, bedX + bedW, bedY + bedH);
        blanketGrad.addColorStop(0, '#426587');
        blanketGrad.addColorStop(0.55, '#2f5577');
        blanketGrad.addColorStop(1, '#11253e');
        ctx.fillStyle = blanketGrad;
        ctx.beginPath();
        ctx.moveTo(bedX, bedY + bedH * 0.5);
        ctx.quadraticCurveTo(bedX + bedW * 0.18, bedY + bedH * 0.08, bedX + bedW * 0.42, bedY + bedH * 0.14);
        ctx.quadraticCurveTo(bedX + bedW * 0.65, bedY + bedH * 0.02, bedX + bedW, bedY + bedH * 0.6);
        ctx.lineTo(bedX + bedW, bedY + bedH);
        ctx.lineTo(bedX, bedY + bedH);
        ctx.fill();

        // Character face on blanket
        const faceX = bedX + bedW * 0.36;
        const faceY = bedY + bedH * 0.38;
        ctx.save();
        ctx.globalAlpha = isHolding ? 1 : 0.88;
        ctx.fillStyle = 'rgba(220, 248, 255, 0.92)';
        ctx.beginPath();
        ctx.arc(faceX - 18, faceY, 7, 0, Math.PI * 2);
        ctx.arc(faceX + 18, faceY, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#052a38';
        ctx.beginPath();
        ctx.arc(faceX - 18, faceY, 3.2, 0, Math.PI * 2);
        ctx.arc(faceX + 18, faceY, 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = isHolding ? 'rgba(108, 247, 209, 0.95)' : 'rgba(210, 237, 255, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(faceX, faceY + 12, 14, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
        ctx.restore();

        // Device core and glow
        const glowX = bedX + bedW * 0.58;
        const glowY = bedY + bedH * 0.34;
        ctx.save();
        ctx.fillStyle = '#d9faff';
        ctx.beginPath();
        ctx.roundRect(glowX - 18, glowY - 14, 36, 28, 8);
        ctx.fill();

        ctx.fillStyle = '#071521';
        ctx.fillRect(glowX - 10, glowY - 6, 20, 12);

        // Antenna
        ctx.strokeStyle = 'rgba(200, 246, 255, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(glowX + 8, glowY - 14);
        ctx.lineTo(glowX + 16, glowY - 34);
        ctx.stroke();

        if(isHolding) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            
            const gradient = ctx.createRadialGradient(glowX, glowY, 10, glowX, glowY, 220);
            gradient.addColorStop(0, roomGlowToRgba(config.themeColor, 0.9));
            gradient.addColorStop(0.45, roomGlowToRgba(config.themeColor, 0.28));
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(glowX, glowY, 220, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = roomGlowToRgba(config.themeColor, 0.45 - i * 0.1);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(glowX, glowY, 28 + i * 14 + Math.sin(Date.now() / 180 + i) * 2, -0.8, 0.8);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.55 + Math.random() * 0.18;
            ctx.beginPath();
            ctx.arc(glowX, glowY, 16, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        ctx.restore();
    };

    const drawDoor = () => {
        const doorW = width * 0.2;
        const doorH = height * 0.6;
        const doorX = width * 0.75;
        const doorY = height * 0.15;

        // Door frame
        ctx.fillStyle = '#020617';
        ctx.fillRect(doorX - 7, doorY - 7, doorW + 14, doorH + 14);

        // Header panel
        ctx.fillStyle = '#0d1a30';
        ctx.fillRect(doorX - 4, doorY - 24, doorW + 8, 18);
        ctx.fillStyle = parent.state === PARENT_STATES.LOOKING ? '#ff7f91' : 'rgba(103, 240, 255, 0.4)';
        ctx.fillRect(doorX + doorW * 0.18, doorY - 18, doorW * 0.64, 6);

        if(parent.doorOpen > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(doorX, doorY, doorW, doorH);
            ctx.clip();

            const hallGrad = ctx.createLinearGradient(doorX, doorY, doorX + doorW, doorY);
            hallGrad.addColorStop(0, parent.state === PARENT_STATES.LOOKING ? '#ffae70' : '#31425f');
            hallGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = hallGrad;
            ctx.fillRect(doorX, doorY, doorW * parent.doorOpen, doorH);

            // Parent shadow figure
            if(parent.doorOpen > 0.3) {
                const pX = doorX + doorW * 0.16;
                const pY = doorY + doorH * 0.36;
                
                ctx.fillStyle = '#010205';
                ctx.beginPath();
                ctx.ellipse(pX, pY + 62, 34, 92, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.arc(pX, pY + 2, 24, 0, Math.PI * 2);
                ctx.fill();

                // Eyes + flashlight
                if(parent.state === PARENT_STATES.LOOKING) {
                    ctx.fillStyle = '#ff5266';
                    ctx.shadowColor = '#ff5266';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.arc(pX - 10, pY, 4.6, 0, Math.PI * 2);
                    ctx.arc(pX + 10, pY, 4.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = 'rgba(255, 239, 188, 0.28)';
                    ctx.beginPath();
                    ctx.moveTo(pX + 18, pY + 24);
                    ctx.lineTo(0, height);
                    ctx.lineTo(0, 0);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // Door slab
        const doorGrad = ctx.createLinearGradient(doorX, doorY, doorX + doorW, doorY + doorH);
        doorGrad.addColorStop(0, '#20334c');
        doorGrad.addColorStop(1, '#121b2b');
        ctx.fillStyle = doorGrad;
        const currentDoorW = doorW * (1 - parent.doorOpen);
        ctx.fillRect(doorX + doorW * parent.doorOpen, doorY, currentDoorW, doorH);

        // Panel lines
        ctx.strokeStyle = 'rgba(173, 225, 255, 0.08)';
        ctx.lineWidth = 2;
        ctx.strokeRect(doorX + doorW * parent.doorOpen + 8, doorY + 16, Math.max(0, currentDoorW - 16), doorH - 32);
        
        // Knob
        if(parent.doorOpen < 0.9) {
            ctx.fillStyle = '#b1c4d8';
            ctx.beginPath();
            ctx.arc(doorX + doorW * parent.doorOpen + 13, doorY + doorH * 0.5, 5, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const drawParticles = () => {
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            if(p.type === 'zzz') {
                ctx.fillStyle = '#d6ebff';
                ctx.font = '26px "VT323", monospace';
                ctx.fillText('Z', p.x, p.y);
            } else {
                ctx.fillStyle = config.themeColor;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.fillStyle = '#d7fbff';
                ctx.fillRect(p.x + 1, p.y + 1, 2, 2);
            }
            ctx.restore();
        });
    };

    const drawHUD = () => {
        if(parent.state === PARENT_STATES.WARNING) {
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, 'rgba(255, 162, 61, 0.26)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);
        }

        if(parent.state === PARENT_STATES.LOOKING) {
            const dangerGrad = ctx.createLinearGradient(0, 0, 0, height);
            dangerGrad.addColorStop(0, 'rgba(255, 61, 92, 0.12)');
            dangerGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
            dangerGrad.addColorStop(1, 'rgba(255, 61, 92, 0.08)');
            ctx.fillStyle = dangerGrad;
            ctx.fillRect(0, 0, width, height);
        }
    };

    const roomGlowToRgba = (hex, alpha) => {
        const safeHex = typeof hex === 'string' ? hex.replace('#', '') : '06b6d4';
        const normalized = safeHex.length === 3
            ? safeHex.split('').map(char => char + char).join('')
            : safeHex.padEnd(6, '0').slice(0, 6);
        const r = parseInt(normalized.slice(0, 2), 16);
        const g = parseInt(normalized.slice(2, 4), 16);
        const b = parseInt(normalized.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    const loop = (timestamp) => {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        if(gameState === 'PLAYING') {
            update(dt);
        }

        // Draw
        drawRoom();
        drawDoor();
        drawBed();
        drawParticles();
        drawHUD();

        requestAnimationFrame(loop);
    };

    // --- Init ---
    requestAnimationFrame(loop);

    // --- UI Handlers ---
    document.getElementById('start-btn').onclick = () => {
        playSound('click');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        gameState = 'PLAYING';
        resetGame();
        unlockAudio();
    };

    document.getElementById('restart-btn').onclick = () => {
        playSound('click');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        gameState = 'PLAYING';
        resetGame();
        sounds.bgm.currentTime = 0;
        playSound('bgm');
    };
});
</script>
</body>
