<style>

<script>
/* 
 * TURBO CARS - Single File Logic
 */

// --- Game Configuration ---
const CONFIG = {
    laneCount: 4,
    roadWidthPct: 0.85, // 85% of screen width
    baseSpeed: 500,     // Pixels per second (virtual)
    maxSpeed: 1500,
    accel: 15,          // Speed increase per second
    heroColor: '#ef4444', // Red
    spawnRate: 1.2,     // Seconds between spawns (base)
    carWidth: 0.12,     // % of screen width
    carHeight: 0.20     // % of screen width (aspect ratio)
};

// --- Audio System ---
const AudioSys = {
    ctx: null,
    enabled: false,
    bgm: document.getElementById('bgm'),
    sfxCrash: document.getElementById('sfx_crash'),
    sfxScore: document.getElementById('sfx_score'),
    sfxStart: document.getElementById('sfx_start'),
    sfxLane: document.getElementById('sfx_lane'),
    sfxNearmiss: document.getElementById('sfx_nearmiss'),
    init() {
        if(!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(this.ctx.state === 'suspended') {
            this.ctx.resume().catch(()=>{});
        }
        this.enabled = true;
    },
    play(media, volume = 0.5, restartThreshold = 0.08) {
        if (!media) return;
        media.volume = volume;
        if (media.paused || media.currentTime > restartThreshold) {
            media.currentTime = 0;
        }
        media.play().catch(()=>{});
    },
    playBGM() {
        if (!this.enabled) return;
        this.bgm.volume = 0.24;
        if (this.bgm.paused) {
            this.bgm.currentTime = 0;
            this.bgm.play().catch(()=>{});
        }
    },
    stopBGM() {
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },
    playCrash() {
        this.play(this.sfxCrash, 0.72, 0.04);
    },
    playScore() {
        this.play(this.sfxScore, 0.38, 0.08);
    },
    playStart() {
        this.play(this.sfxStart, 0.55, 0.02);
    },
    playLane() {
        this.play(this.sfxLane, 0.28, 0.04);
    },
    playNearmiss() {
        this.play(this.sfxNearmiss, 0.22, 0.12);
    }
};

// --- Game State ---
const State = {
    mode: 'START', // START, PLAY, GAMEOVER
    score: 0,
    speed: 0, // Current speed factor (1.0 = base)
    distance: 0,
    lastTime: 0,
    spawnTimer: 0,
    shake: 0,
    comboFlash: 0,
    crashFlash: 0,
    lastLaneSfxAt: 0,
    warnedTraffic: new WeakSet()
};

// --- Entities ---
let player = { x: 0.5, y: 0.8, targetX: 0.5, tilt: 0 };
let traffic = [];
let particles = [];
let roadOffset = 0;

// --- Canvas Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = window.innerWidth;
let ch = window.innerHeight;

function resize() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling ---
let isDragging = false;

function handleInput(clientX) {
    if (State.mode !== 'PLAY') return;
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    
    // Map screen X to road X (0.0 to 1.0 within road bounds)
    // Road occupies center CONFIG.roadWidthPct
    const roadW = cw * CONFIG.roadWidthPct;
    const roadX = (cw - roadW) / 2;
    
    // Clamp to road
    let normalizedX = (x - roadX) / roadW;
    normalizedX = Math.max(0.05, Math.min(0.95, normalizedX));
    
    if (Math.abs(player.targetX - normalizedX) > 0.12) {
        const now = performance.now();
        if (now - State.lastLaneSfxAt > 90) {
            AudioSys.playLane();
            State.lastLaneSfxAt = now;
        }
    }
    player.targetX = normalizedX;
}

canvas.addEventListener('pointerdown', e => {
    isDragging = true;
    AudioSys.init();
    handleInput(e.clientX);
});
canvas.addEventListener('pointermove', e => {
    if (isDragging) handleInput(e.clientX);
});
canvas.addEventListener('pointerup', () => isDragging = false);
canvas.addEventListener('pointercancel', () => isDragging = false);
// [agent-note][stage4] repaired: mobile tap path | action: keep gesture suppression scoped to gameplay canvas
canvas.addEventListener('touchmove', e => {
    if (State.mode === 'PLAY') {
        e.preventDefault();
    }
}, { passive: false });

// --- Helper: Drawing ---
function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawCar(ctx, x, y, w, h, color, isPlayer, tilt) {
    ctx.save();
    ctx.translate(x, y);
    if (isPlayer) ctx.rotate(tilt * 0.15);

    // Shadow
    ctx.fillStyle = isPlayer ? 'rgba(15,23,42,0.55)' : 'rgba(0,0,0,0.38)';
    drawRoundedRect(ctx, -w/2 + w*0.1, -h/2 + h*0.13, w, h, w*0.22);
    ctx.fill();

    // Aura for the hero courier
    if (isPlayer) {
        ctx.fillStyle = 'rgba(34, 211, 238, 0.14)';
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.8, h * 0.72, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Wheels
    ctx.fillStyle = '#05070d';
    const wheelW = w * 0.15;
    const wheelH = h * 0.2;
    const wheelOffX = w * 0.45;
    const wheelOffY = h * 0.25;
    
    ctx.fillRect(-wheelOffX - wheelW/2, -wheelOffY - wheelH/2, wheelW, wheelH);
    ctx.fillRect(wheelOffX - wheelW/2, -wheelOffY - wheelH/2, wheelW, wheelH);
    ctx.fillRect(-wheelOffX - wheelW/2, wheelOffY - wheelH/2, wheelW, wheelH);
    ctx.fillRect(wheelOffX - wheelW/2, wheelOffY - wheelH/2, wheelW, wheelH);

    // Chassis gradient
    const chassisGradient = ctx.createLinearGradient(0, -h/2, 0, h/2);
    chassisGradient.addColorStop(0, isPlayer ? '#fb7185' : '#ffffff');
    chassisGradient.addColorStop(0.15, color);
    chassisGradient.addColorStop(1, isPlayer ? '#991b1b' : '#1e293b');
    ctx.fillStyle = chassisGradient;
    drawRoundedRect(ctx, -w/2, -h/2, w, h, w*0.2);
    ctx.fill();

    // Edge shine
    ctx.strokeStyle = isPlayer ? 'rgba(103,232,249,0.85)' : 'rgba(255,255,255,0.28)';
    ctx.lineWidth = Math.max(2, w * 0.04);
    drawRoundedRect(ctx, -w/2 + 2, -h/2 + 2, w - 4, h - 4, w*0.18);
    ctx.stroke();

    // Cabin / Stripes
    if (isPlayer) {
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(-w*0.12, -h/2, w*0.24, h);

        ctx.fillStyle = '#10253f';
        ctx.beginPath();
        ctx.moveTo(-w*0.35, -h*0.1);
        ctx.lineTo(w*0.35, -h*0.1);
        ctx.lineTo(w*0.4, h*0.25);
        ctx.lineTo(-w*0.4, h*0.25);
        ctx.fill();

        ctx.fillStyle = '#10253f';
        ctx.fillRect(-w*0.35, -h*0.35, w*0.7, h*0.15);

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, -h * 0.18, w * 0.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(-w*0.25, h*0.04, w*0.5, h*0.05);
    } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-w*0.35, -h*0.2, w*0.7, h*0.4);

        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(-w*0.18, -h*0.32, w*0.36, h*0.1);

        ctx.fillStyle = color;
        ctx.globalAlpha = 0.88;
        ctx.fillRect(-w*0.3, -h*0.15, w*0.6, h*0.3);
        ctx.globalAlpha = 1.0;
    }

    // Lights
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#fef08a';
    ctx.shadowBlur = isPlayer ? 14 : 10;
    ctx.fillRect(-w*0.4, -h*0.48, w*0.2, h*0.05);
    ctx.fillRect(w*0.2, -h*0.48, w*0.2, h*0.05);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-w*0.4, h*0.43, w*0.25, h*0.05);
    ctx.fillRect(w*0.15, h*0.43, w*0.25, h*0.05);

    if (isPlayer) {
        ctx.fillStyle = 'rgba(34,211,238,0.35)';
        ctx.beginPath();
        ctx.moveTo(-w * 0.24, h * 0.5);
        ctx.lineTo(0, h * 0.8);
        ctx.lineTo(w * 0.24, h * 0.5);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

// --- Logic: Particles ---
function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 500,
            vy: (Math.random() - 0.5) * 500,
            life: 1.0,
            color: color,
            size: Math.random() * 5 + 2
        });
    }
}

// --- Core Game Functions ---
const comboGif = document.getElementById('combo-gif');
const crashGif = document.getElementById('crash-gif');

function showGif(el, ms) {
    if (!el) return;
    el.classList.remove('hidden');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.add('hidden'), ms);
}

function resetGame() {
    State.mode = 'PLAY';
    State.score = 0;
    State.speed = 1.0;
    State.distance = 0;
    State.shake = 0;
    State.spawnTimer = 0;
    State.comboFlash = 0;
    State.crashFlash = 0;
    State.lastLaneSfxAt = 0;
    State.warnedTraffic = new WeakSet();
    
    traffic = [];
    particles = [];
    player.x = 0.5;
    player.targetX = 0.5;
    player.tilt = 0;
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    comboGif.classList.add('hidden');
    crashGif.classList.add('hidden');
    
    AudioSys.playStart();
    AudioSys.playBGM();
}

function gameOver() {
    State.mode = 'GAMEOVER';
    State.shake = 30;
    State.crashFlash = 1.2;
    AudioSys.stopBGM();
    AudioSys.playCrash();
    
    // Explosion effect
    const roadW = cw * CONFIG.roadWidthPct;
    const roadX = (cw - roadW) / 2;
    const px = roadX + player.x * roadW;
    const py = player.y * ch;
    spawnParticles(px, py, '#ef4444', 30);
    spawnParticles(px, py, '#fbbf24', 20);

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('final-score').innerText = Math.floor(State.score);
    showGif(crashGif, 1800);
    
    setTimeout(() => {
        document.getElementById('game-over-screen').classList.remove('hidden');
    }, 800);
}

function update(dt) {
    if (State.mode !== 'PLAY') return;

    // Difficulty Ramp
    State.speed += (CONFIG.accel / CONFIG.baseSpeed) * dt;
    const currentPxSpeed = CONFIG.baseSpeed * State.speed;
    
    // Score & Distance
    State.distance += currentPxSpeed * dt;
    State.score += currentPxSpeed * dt * 0.01;
    
    // Road Scroll
    roadOffset += currentPxSpeed * dt;
    if (roadOffset > ch * 0.2) roadOffset = 0; // Loop dash pattern

    // Player Physics
    const lerpSpeed = 10;
    const diff = player.targetX - player.x;
    player.x += diff * Math.min(1, lerpSpeed * dt);
    player.tilt = -diff * 30; // Tilt visual

    // Spawn Traffic
    State.spawnTimer -= dt;
    if (State.spawnTimer <= 0) {
        const lane = Math.floor(Math.random() * CONFIG.laneCount);
        // Ensure traffic isn't too overlapping
        const laneWidth = 1.0 / CONFIG.laneCount;
        const tx = (lane * laneWidth) + (laneWidth * 0.5);
        
        // Random car type properties
        const isTruck = Math.random() > 0.8;
        const color = ['#3b82f6', '#22c55e', '#a855f7', '#f97316', '#64748b'][Math.floor(Math.random()*5)];
        const speedFactor = 0.6 + Math.random() * 0.3; // Slower than player
        
        traffic.push({
            x: tx,
            y: -0.2, // Start above screen
            w: isTruck ? CONFIG.carWidth * 1.2 : CONFIG.carWidth,
            h: isTruck ? CONFIG.carHeight * 1.4 : CONFIG.carHeight,
            speed: speedFactor,
            color: color,
            lane: lane
        });
        
        // Next spawn time (decreases as speed increases)
        State.spawnTimer = (CONFIG.spawnRate / State.speed) * (0.8 + Math.random() * 0.4);
    }

    // Update Traffic
    const roadW = cw * CONFIG.roadWidthPct;
    const roadX = (cw - roadW) / 2;
    const playerRealX = roadX + player.x * roadW;
    const playerRealY = player.y * ch;
    const playerW = cw * CONFIG.carWidth;
    const playerH = cw * CONFIG.carHeight; // Square-ish ratio based on width

    for (let i = traffic.length - 1; i >= 0; i--) {
        let t = traffic[i];
        // Traffic moves down relative to player (Player is "fast", traffic is "slow")
        // Relative speed: Player Speed - Traffic Speed
        // But visually, traffic moves DOWN the screen.
        // Let's say traffic moves at t.speed * Base. Player moves at State.speed * Base.
        // Relative downward velocity = (State.speed - t.speed) * Base
        
        const relativeSpeed = (State.speed - t.speed) * CONFIG.baseSpeed;
        t.y += (relativeSpeed / ch) * dt;

        // Collision Check (AABB)
        const tRealX = roadX + t.x * roadW;
        const tRealY = t.y * ch;
        const tW = cw * t.w;
        const tH = cw * t.h;

        // Shrink hitboxes slightly for fairness
        const hitMargin = 0.2; 
        if (
            playerRealX + playerW*hitMargin < tRealX + tW - tW*hitMargin &&
            playerRealX + playerW - playerW*hitMargin > tRealX + tW*hitMargin &&
            playerRealY + playerH*hitMargin < tRealY + tH - tH*hitMargin &&
            playerRealY + playerH - playerH*hitMargin > tRealY + tH*hitMargin
        ) {
            gameOver();
        }

        // Remove if off screen bottom
        const distanceToPlayer = Math.abs(t.y - player.y);
        const laneAligned = Math.abs(t.x - player.x) < 0.12;
        if (laneAligned && distanceToPlayer < 0.16 && !State.warnedTraffic.has(t)) {
            State.warnedTraffic.add(t);
            AudioSys.playNearmiss();
        }

        if (t.y > 1.2) {
            traffic.splice(i, 1);
            State.score += 50; // Overtake bonus
            State.comboFlash = 0.85;
            AudioSys.playScore();
            showGif(comboGif, 900);
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update HUD
    document.getElementById('score-val').innerText = Math.floor(State.score);
    document.getElementById('speed-val').innerText = Math.floor(currentPxSpeed / 10);
    
    // Shake decay
    State.shake = Math.max(0, State.shake - dt * 60);
    State.comboFlash = Math.max(0, State.comboFlash - dt);
    State.crashFlash = Math.max(0, State.crashFlash - dt);
}

function draw() {
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, '#050816');
    skyGradient.addColorStop(0.55, '#0b1124');
    skyGradient.addColorStop(1, '#120f2a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    if (State.comboFlash > 0) {
        ctx.fillStyle = `rgba(34, 211, 238, ${0.08 * State.comboFlash})`;
        ctx.fillRect(0, 0, cw, ch);
    }
    if (State.crashFlash > 0) {
        ctx.fillStyle = `rgba(239, 68, 68, ${0.12 * State.crashFlash})`;
        ctx.fillRect(0, 0, cw, ch);
    }

    // Decorative skyline glow
    ctx.fillStyle = 'rgba(59,130,246,0.08)';
    for (let i = 0; i < 9; i++) {
        const bw = cw * (0.05 + (i % 3) * 0.018);
        const bh = ch * (0.12 + (i % 4) * 0.045);
        const bx = (i / 8) * cw - bw * 0.25;
        const by = ch * 0.22 - bh;
        ctx.fillRect(bx, by, bw, bh);
    }

    // Shake transform
    ctx.save();
    if (State.shake > 0) {
        const dx = (Math.random() - 0.5) * State.shake;
        const dy = (Math.random() - 0.5) * State.shake;
        ctx.translate(dx, dy);
    }

    // Draw Road
    const roadW = cw * CONFIG.roadWidthPct;
    const roadX = (cw - roadW) / 2;

    // Neon shoulders
    const shoulderGradient = ctx.createLinearGradient(0, 0, 0, ch);
    shoulderGradient.addColorStop(0, '#09111f');
    shoulderGradient.addColorStop(1, '#07101a');
    ctx.fillStyle = shoulderGradient;
    ctx.fillRect(0, 0, roadX, ch);
    ctx.fillRect(roadX + roadW, 0, roadX, ch);

    for (let i = 0; i < 14; i++) {
        const y = (i / 14) * ch;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(103,232,249,0.08)' : 'rgba(168,85,247,0.08)';
        ctx.fillRect(roadX * 0.15, y, roadX * 0.5, 3);
        ctx.fillRect(cw - roadX * 0.65, y + 12, roadX * 0.5, 3);
    }

    // Asphalt
    const roadGradient = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
    roadGradient.addColorStop(0, '#243244');
    roadGradient.addColorStop(0.5, '#334155');
    roadGradient.addColorStop(1, '#243244');
    ctx.fillStyle = roadGradient;
    ctx.fillRect(roadX, 0, roadW, ch);

    const laneGlow = ctx.createLinearGradient(0, 0, 0, ch);
    laneGlow.addColorStop(0, 'rgba(34,211,238,0.1)');
    laneGlow.addColorStop(1, 'rgba(59,130,246,0.02)');
    ctx.fillStyle = laneGlow;
    ctx.fillRect(roadX, 0, roadW, ch);

    // Lane Markers
    ctx.strokeStyle = 'rgba(255,255,255,0.36)';
    ctx.lineWidth = 4;
    ctx.setLineDash([ch * 0.05, ch * 0.05]);
    ctx.lineDashOffset = -roadOffset;

    const laneW = roadW / CONFIG.laneCount;
    ctx.beginPath();
    for(let i=1; i<CONFIG.laneCount; i++) {
        const lx = roadX + i * laneW;
        ctx.moveTo(lx, -100);
        ctx.lineTo(lx, ch + 100);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Road Borders
    ctx.strokeStyle = '#fbbf24';
    ctx.shadowColor = 'rgba(250,204,21,0.4)';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(roadX, 0); ctx.lineTo(roadX, ch);
    ctx.moveTo(roadX + roadW, 0); ctx.lineTo(roadX + roadW, ch);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Draw Traffic
    traffic.forEach(t => {
        const tx = roadX + t.x * roadW;
        const ty = t.y * ch;
        const tw = cw * t.w;
        const th = cw * t.h;
        drawCar(ctx, tx, ty, tw, th, t.color, false, 0);
    });

    // Draw Player
    if (State.mode !== 'GAMEOVER') {
        const px = roadX + player.x * roadW;
        const py = player.y * ch;
        const pw = cw * CONFIG.carWidth;
        const ph = cw * CONFIG.carHeight;
        drawCar(ctx, px, py, pw, ph, CONFIG.heroColor, true, player.tilt);
    }

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Speed Lines (Overlay)
    if (State.speed > 1.5) {
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<3; i++) {
            const lx = Math.random() * cw;
            const ly = Math.random() * ch;
            const len = Math.random() * 50 + 50;
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + len);
        }
        ctx.stroke();
    }

    ctx.restore();
}

// --- Main Loop ---
function loop(timestamp) {
    const dt = Math.min((timestamp - State.lastTime) / 1000, 0.1);
    State.lastTime = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(loop);
}

// --- Initialization ---
document.getElementById('btn-start').onclick = () => {
    AudioSys.init();
    resetGame();
};
document.getElementById('btn-restart').onclick = () => {
    AudioSys.init();
    resetGame();
};

requestAnimationFrame(loop);

</script>
