<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rush Hour Dish Rescue</title>
<script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #1d1537;
  --bg-bottom: #100b1f;
  --panel: rgba(34, 26, 62, 0.86);
  --panel-border: rgba(255, 255, 255, 0.14);
  --text-main: #fff6dc;
  --text-muted: #d8c9ff;
  --mint: #77f7d4;
  --mint-strong: #43dfbe;
  --gold: #ffd86e;
  --orange: #ff9d5c;
  --danger: #ff6b7f;
  --shadow: rgba(8, 4, 20, 0.45);
  --font-display: 'Audiowide', 'Trebuchet MS', sans-serif;
  --font-ui: 'Exo 2', 'Arial', sans-serif;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at top, rgba(255, 190, 118, 0.22), transparent 28%),
    linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  color: var(--text-main);
  font-family: var(--font-ui);
}
body::before,
body::after {
  content: '';
  position: fixed;
  inset: auto auto 12% 6%;
  width: 7rem;
  height: 7rem;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(119, 247, 212, 0.18), transparent 65%);
  filter: blur(4px);
  pointer-events: none;
}
body::after {
  inset: 10% 8% auto auto;
  width: 9rem;
  height: 9rem;
  background: radial-gradient(circle, rgba(255, 216, 110, 0.12), transparent 65%);
}
#game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.clay-text {
  text-shadow: 0 2px 0 rgba(28, 13, 56, 0.95), 0 0 14px rgba(255, 210, 124, 0.24);
}
.clay-box {
  box-shadow: 0 10px 22px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.12);
  border-radius: 20px;
}
.stat-card,
.tutorial-card,
#game-over-panel {
  background: linear-gradient(180deg, rgba(40, 30, 72, 0.94), rgba(23, 17, 44, 0.9));
  border: 1px solid var(--panel-border);
  color: var(--text-main);
}
.stat-card {
  position: relative;
  min-width: 108px;
  padding: 0.8rem 0.9rem;
}
.stat-card::after,
.tutorial-card::after,
#game-over-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
}
.label-chip {
  font-family: var(--font-display);
  letter-spacing: 0.08em;
  font-size: 0.78rem;
  line-height: 1.1;
  text-transform: uppercase;
}
.stat-value {
  font-family: var(--font-display);
  letter-spacing: 0.04em;
  line-height: 0.95;
}
.tutorial-card {
  max-width: min(420px, calc(100vw - 2rem));
  position: relative;
  overflow: hidden;
  padding: 0.75rem 1rem;
}
.tutorial-card::before {
  content: '🫧';
  position: absolute;
  right: 0.7rem;
  top: 0.55rem;
  font-size: 1.55rem;
  opacity: 0.9;
}
.howto-copy {
  padding-right: 1.8rem;
}
#hud {
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
#game-over-screen {
  backdrop-filter: blur(8px);
}
#game-over-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  max-height: min(90vh, 640px);
  width: min(100%, 360px);
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(3, 2, 14, 0.55);
}
#game-over-panel .panel-content {
  overflow-y: auto;
  padding: 1.75rem 1.5rem 1.5rem;
}
#restart-btn {
  position: sticky;
  bottom: 0;
  font-family: var(--font-display);
  letter-spacing: 0.05em;
  box-shadow: 0 10px 18px rgba(255, 126, 58, 0.34);
}
#hud,
.tutorial-card,
#game-over-panel,
button {
  font-family: var(--font-ui);
}
.feedback-gif {
  position: absolute;
  z-index: 30;
  width: clamp(84px, 18vw, 124px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,0.22);
  box-shadow: 0 12px 22px rgba(6, 4, 18, 0.35);
  opacity: 0;
  transform: translateY(12px) scale(0.92);
  transition: opacity 180ms ease, transform 180ms ease;
  pointer-events: none;
}
.feedback-gif.visible {
  opacity: 0.94;
  transform: translateY(0) scale(1);
}
#celebration-gif {
  right: 14px;
  bottom: 124px;
}
#fail-gif {
  left: 14px;
  top: calc(max(12px, env(safe-area-inset-top)) + 76px);
}
@media (max-width: 480px) {
  #celebration-gif {
    right: 10px;
    bottom: 132px;
  }
  #fail-gif {
    left: 10px;
    top: calc(max(10px, env(safe-area-inset-top)) + 88px);
  }
}
@media (max-width: 480px) {
  .stat-card { min-width: 92px; padding: 0.7rem 0.8rem; }
  .label-chip { font-size: 0.82rem; }
  .stat-value { font-size: 1.7rem !important; }
  .tutorial-card { max-width: calc(100vw - 1.25rem); padding: 0.65rem 0.9rem; }
}
</style>
<script id="game-config" type="application/x-game-config">
{
  "scrubSpeed": { "type": "number", "label": "Scrub Speed", "value": 60, "min": 20, "max": 120 },
  "patienceTime": { "type": "number", "label": "Ingredient Freshness", "value": 8, "min": 4, "max": 15 }
}
</script>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
    <div id="hud" class="absolute inset-0 p-4 flex flex-col justify-between">
      <div class="flex justify-between items-start">
        <div class="stat-card clay-box">
          <div class="label-chip text-amber-300">Dishes Saved</div>
          <div id="score-display" class="stat-value text-3xl text-amber-50 clay-text">0</div>
        </div>
        <div class="stat-card clay-box text-right">
          <div class="label-chip text-cyan-300">Rush Streak</div>
          <div id="streak-display" class="stat-value text-2xl text-cyan-100">0</div>
        </div>
      </div>
      <div class="flex justify-center pb-4">
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div class="tutorial-card clay-box">
          <div class="label-chip text-emerald-300 text-center">How to Play</div>
          <div class="howto-copy text-slate-100 text-sm font-semibold text-center">Swipe fast to help the bubble buddy scrub each dish before it spoils.</div>
        </div>
      </div>
    </div>
    <!-- [agent-note][stage3] resolved-gif: clean-streak + fail-state -> catalogs/gifs.json -->
    <img id="celebration-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Celebration reaction" loading="lazy" decoding="async">
    <img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Fail reaction" loading="lazy" decoding="async">
    <div id="game-over-screen" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center pointer-events-auto">
      <div id="game-over-panel" class="clay-box text-center mx-4 rounded-3xl">
        <div class="panel-content">
          <h1 class="text-4xl text-amber-100 mb-2 clay-text" style="font-family:var(--font-display); letter-spacing:0.05em;">Service Stalled!</h1>
          <p class="text-orange-300 mb-2 text-lg font-bold">Dishes Saved: <span id="final-score" class="text-amber-50">0</span></p>
          <p class="text-violet-100/80 mb-6 text-sm">One order spoiled before your scrub buddy could finish the plate.</p>
          <button id="restart-btn" class="bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-300 hover:to-orange-400 text-white py-4 px-8 rounded-xl text-xl transition-transform transform active:scale-95 clay-box border-2 border-orange-600">START NEXT SHIFT</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- [agent-note][stage3] resolved-audio: scrub/pickup/fail/ui + loop -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const streakDisplay = document.getElementById('streak-display');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScore = document.getElementById('final-score');
const restartBtn = document.getElementById('restart-btn');
const bgm = document.getElementById('bgm_main');
const celebrationGif = document.getElementById('celebration-gif');
const failGif = document.getElementById('fail-gif');

let cw, ch, dpr, initialized = false;
let gameState = 'PLAYING';
let lastTime = 0;
let audioCtx;
let audioUnlocked = false;
let scrubCooldown = 0;
let warningPlayedForCurrentDish = false;
let activeGifTimeouts = {};
const SFX_URLS = {
  scrub: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
  clean: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
  fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3',
  warning: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3',
  ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
  start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3'
};

const configScript = document.getElementById('game-config');
const configData = JSON.parse(configScript.textContent);
window.gameConfigDefs = configData;
window.gameConfig = {};
for (const key in configData) window.gameConfig[key] = configData[key].value;
window.updateGameConfig = (key, val) => { if (window.gameConfigDefs[key]) window.gameConfig[key] = val; };

const AudioManager = {
  sfx: {},
  init() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    Object.entries(SFX_URLS).forEach(([id, url]) => {
      const audio = new Audio(url);
      audio.preload = 'auto';
      audio.crossOrigin = 'anonymous';
      this.sfx[id] = audio;
    });
    bgm.volume = 0.2;
  },
  playSfx(id, volume = 0.5) {
    const base = this.sfx[id];
    if (!base) return;
    try {
      const instance = base.cloneNode();
      instance.volume = volume;
      instance.play().catch(() => {});
    } catch (_) {}
  },
  playBgm() {
    bgm.volume = 0.2;
    bgm.play().catch(() => {});
  },
  stopBgm() {
    bgm.pause();
    bgm.currentTime = 0;
  }
};

function vibrate(style) {
  window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
  });
}

let ingredients = [];
let particles = [];
let score = 0, streak = 0;
let inputPos = { x: 0, y: 0 };
let lastInputPos = { x: 0, y: 0 };
let tool = { x: 0, y: 0, vx: 0, vy: 0, isScrubbing: false };
let spawnTimer = 0;

const foodTypes = ['burger', 'hotdog', 'chicken', 'sushi', 'pizza'];

function showFeedbackGif(el, duration = 1200) {
  if (!el) return;
  el.classList.add('visible');
  clearTimeout(activeGifTimeouts[el.id]);
  activeGifTimeouts[el.id] = setTimeout(() => el.classList.remove('visible'), duration);
}

function initGame(playStartCue = false) {
  ingredients = [];
  particles = [];
  score = 0; streak = 0;
  spawnTimer = 0;
  scrubCooldown = 0;
  warningPlayedForCurrentDish = false;
  tool.x = cw / 2;
  tool.y = ch * 0.7;
  lastInputPos.x = tool.x;
  lastInputPos.y = tool.y;
  inputPos.x = tool.x;
  inputPos.y = tool.y;
  scoreDisplay.textContent = '0';
  streakDisplay.textContent = '0';
  failGif.classList.remove('visible');
  celebrationGif.classList.remove('visible');
  spawnIngredient();
  setState('PLAYING');
  AudioManager.playBgm();
  if (playStartCue) AudioManager.playSfx('start', 0.42);
}

function spawnIngredient() {
  const type = foodTypes[Math.floor(Math.random() * foodTypes.length)];
  const margin = 60;
  warningPlayedForCurrentDish = false;
  ingredients.push({
    type,
    x: margin + Math.random() * (cw - margin * 2),
    y: ch * 0.6,
    r: 35,
    cleanliness: 0,
    maxClean: 100,
    timer: window.gameConfig.patienceTime || 8,
    maxTimer: window.gameConfig.patienceTime || 8,
    state: 'dirty',
    wobble: Math.random() * Math.PI * 2
  });
}

function setState(state) {
  gameState = state;
  if (state === 'PLAYING') {
    gameOverScreen.classList.add('hidden');
    failGif.classList.remove('visible');
  } else if (state === 'GAMEOVER') {
    gameOverScreen.classList.remove('hidden');
    finalScore.textContent = score;
    showFeedbackGif(failGif, 2400);
    AudioManager.playSfx('fail', 0.5);
    bgm.pause();
    vibrate('heavy');
  }
}

function resize(width, height) {
  cw = width;
  ch = height;
  dpr = window.devicePixelRatio || 1;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (initialized && ingredients.length > 0) {
    ingredients.forEach(ing => {
      ing.x = Math.min(Math.max(ing.x, ing.r), cw - ing.r);
    });
  }
}

const ro = new ResizeObserver(entries => {
  for (const entry of entries) {
    const cr = entry.contentRect;
    resize(cr.width, cr.height);
    if (!initialized) {
      AudioManager.init();
      initGame(false);
      initialized = true;
      requestAnimationFrame(loop);
    }
  }
});
ro.observe(canvas);

function unlockAudio() {
  if (!audioUnlocked) {
    audioCtx?.resume?.().catch(() => {});
    AudioManager.playBgm();
    audioUnlocked = true;
  }
}

function updateInputFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  inputPos.x = e.clientX - rect.left;
  inputPos.y = e.clientY - rect.top;
}

function handleCanvasInput(e) {
  unlockAudio();
  if (gameState !== 'PLAYING') return;
  e.preventDefault();
  updateInputFromEvent(e);
  if (e.type === 'pointerdown') {
    lastInputPos.x = inputPos.x;
    lastInputPos.y = inputPos.y;
  }
}

canvas.addEventListener('pointerdown', handleCanvasInput, { passive: false });
canvas.addEventListener('pointermove', (e) => {
  if (gameState !== 'PLAYING') return;
  e.preventDefault();
  updateInputFromEvent(e);
}, { passive: false });
canvas.addEventListener('pointerup', handleCanvasInput, { passive: false });
canvas.addEventListener('pointercancel', handleCanvasInput, { passive: false });
restartBtn.addEventListener('pointerdown', () => {
  unlockAudio();
  if (audioUnlocked) AudioManager.playSfx('ui', 0.42);
});
restartBtn.addEventListener('click', () => {
  unlockAudio();
  if (gameState === 'GAMEOVER') initGame(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    bgm.pause();
  } else if (audioUnlocked && gameState === 'PLAYING') {
    AudioManager.playBgm();
  }
});

function drawFood(ctx, ing) {
  const cleanRatio = ing.cleanliness / ing.maxClean;
  const timerRatio = ing.timer / ing.maxTimer;
  ctx.save();
  ctx.translate(ing.x, ing.y);
  const scale = 1 + Math.sin(ing.wobble) * 0.02;
  ctx.scale(scale, scale);

  ctx.shadowColor = 'rgba(5, 1, 22, 0.32)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 10;

  ctx.fillStyle = 'rgba(22, 14, 46, 0.28)';
  ctx.beginPath();
  ctx.ellipse(0, ing.r * 0.82, ing.r * 1.08, ing.r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();

  switch(ing.type) {
    case 'burger':
      ctx.fillStyle = '#ffca7a';
      ctx.beginPath(); ctx.arc(0, -6, ing.r * 0.96, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#7d3f22';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.7, -2, ing.r * 1.4, ing.r * 0.36, 10); ctx.fill();
      ctx.fillStyle = '#79d15f';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.64, -6, ing.r * 1.28, ing.r * 0.16, 7); ctx.fill();
      ctx.fillStyle = '#ff7a59';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.58, 2, ing.r * 1.16, ing.r * 0.18, 7); ctx.fill();
      ctx.fillStyle = '#f0a95c';
      ctx.beginPath(); ctx.arc(0, 11, ing.r * 0.82, 0, Math.PI); ctx.fill();
      break;
    case 'hotdog':
      ctx.fillStyle = '#efb66f';
      ctx.beginPath(); ctx.roundRect(-ing.r * 1.02, -ing.r * 0.52, ing.r * 2.04, ing.r * 1.04, 16); ctx.fill();
      ctx.fillStyle = '#cd5c5c';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.78, -ing.r * 0.28, ing.r * 1.56, ing.r * 0.56, 12); ctx.fill();
      ctx.strokeStyle = '#ffd86e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-ing.r * 0.6, 0);
      ctx.bezierCurveTo(-ing.r * 0.2, -ing.r * 0.28, ing.r * 0.2, ing.r * 0.28, ing.r * 0.6, 0);
      ctx.stroke();
      break;
    case 'chicken':
      ctx.fillStyle = '#d98233';
      ctx.beginPath();
      ctx.ellipse(2, 3, ing.r * 0.92, ing.r * 1.08, -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff0d5';
      ctx.beginPath(); ctx.arc(-ing.r * 0.58, -ing.r * 0.66, ing.r * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-ing.r * 0.86, -ing.r * 0.94, ing.r * 0.18, 0, Math.PI * 2); ctx.fill();
      break;
    case 'sushi':
      ctx.fillStyle = '#f7f6ff';
      ctx.beginPath(); ctx.roundRect(-ing.r, -ing.r * 0.62, ing.r * 2, ing.r * 1.24, 10); ctx.fill();
      ctx.fillStyle = '#17202d';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.96, -ing.r * 0.64, ing.r * 1.92, ing.r * 1.28, 10); ctx.fill();
      ctx.fillStyle = '#fffdf9';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.8, -ing.r * 0.48, ing.r * 1.6, ing.r * 0.96, 8); ctx.fill();
      ctx.fillStyle = '#ff7c74';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.5, -ing.r * 0.28, ing.r, ing.r * 0.56, 6); ctx.fill();
      break;
    case 'pizza':
      ctx.fillStyle = '#ffd25a';
      ctx.beginPath(); ctx.moveTo(0, -ing.r); ctx.lineTo(-ing.r, ing.r * 0.88); ctx.lineTo(ing.r, ing.r * 0.88); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#da8c42';
      ctx.beginPath(); ctx.roundRect(-ing.r * 0.86, ing.r * 0.66, ing.r * 1.72, ing.r * 0.22, 5); ctx.fill();
      ctx.fillStyle = '#ff6f61';
      ctx.beginPath(); ctx.arc(0, -2, ing.r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-ing.r * 0.34, ing.r * 0.22, ing.r * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ing.r * 0.32, ing.r * 0.24, ing.r * 0.16, 0, Math.PI * 2); ctx.fill();
      break;
  }

  if (cleanRatio < 1) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = `rgba(66, 38, 20, ${0.78 * (1 - cleanRatio)})`;
    ctx.fillRect(-ing.r * 1.1, -ing.r * 1.1, ing.r * 2.2, ing.r * 2.2);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.lineWidth = 2.5;
  ctx.strokeStyle = timerRatio < 0.25 ? '#ff6b7f' : '#77f7d4';
  ctx.globalAlpha = 0.18 + (1 - timerRatio) * 0.18;
  ctx.beginPath();
  ctx.arc(0, 0, ing.r + 8, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawTool(ctx) {
  ctx.save();
  ctx.translate(tool.x, tool.y);
  const bob = Math.sin(performance.now() * 0.01) * 1.5;
  ctx.translate(0, bob);

  ctx.shadowColor = 'rgba(39, 227, 191, 0.34)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 8;

  ctx.fillStyle = 'rgba(8, 20, 34, 0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 24, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  const bodyGradient = ctx.createRadialGradient(-6, -10, 4, 0, 0, 30);
  bodyGradient.addColorStop(0, '#d9fff6');
  bodyGradient.addColorStop(0.45, '#7df5db');
  bodyGradient.addColorStop(1, '#2eb7a8');
  ctx.fillStyle = bodyGradient;
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-7, -6, 5.5, 0, Math.PI * 2);
  ctx.arc(7, -6, 5.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1f2540';
  const eyeOffset = tool.isScrubbing ? 1.5 : 0;
  ctx.beginPath();
  ctx.arc(-7 + eyeOffset, -5, 2.1, 0, Math.PI * 2);
  ctx.arc(7 + eyeOffset, -5, 2.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#1f2540';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (tool.isScrubbing) {
    ctx.arc(0, 4, 7, 0.18 * Math.PI, 0.82 * Math.PI);
  } else {
    ctx.arc(0, 6, 6, 0.1 * Math.PI, 0.9 * Math.PI);
  }
  ctx.stroke();

  ctx.fillStyle = '#f5fff8';
  ctx.beginPath();
  ctx.roundRect(-12, 11, 24, 12, 6);
  ctx.fill();

  for (let i = -8; i <= 8; i += 8) {
    ctx.strokeStyle = '#54d9c8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i, 11);
    ctx.lineTo(i, 23);
    ctx.stroke();
  }

  if (tool.isScrubbing) {
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.45 - i * 0.12})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-24 + i * 8, -8 - i * 4, 8 + i * 2, 1.1 * Math.PI, 1.8 * Math.PI);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function update(dt) {
  if (gameState !== 'PLAYING') return;
  
  scrubCooldown = Math.max(0, scrubCooldown - dt);
  const lerpFactor = 0.2;
  tool.vx = (inputPos.x - tool.x) * lerpFactor;
  tool.vy = (inputPos.y - tool.y) * lerpFactor;
  tool.x += tool.vx;
  tool.y += tool.vy;
  
  const moveDist = Math.hypot(tool.x - lastInputPos.x, tool.y - lastInputPos.y);
  tool.isScrubbing = moveDist > 5;
  
  if (tool.isScrubbing) {
    const dx = tool.x - lastInputPos.x;
    const dy = tool.y - lastInputPos.y;
    const segments = Math.floor(moveDist / 5);
    for (let i = 0; i < segments; i++) {
      const t = i / segments;
      const px = lastInputPos.x + dx * t;
      const py = lastInputPos.y + dy * t;
      particles.push({
        x: px, y: py,
        vx: (Math.random() - 0.5) * 100,
        vy: -50 - Math.random() * 100,
        life: 0.3 + Math.random() * 0.2,
        r: 2 + Math.random() * 3,
        color: '#E0F7FA'
      });
    }
  }
  
  lastInputPos.x = tool.x;
  lastInputPos.y = tool.y;
  
  const scrubSpeed = window.gameConfig.scrubSpeed || 60;
  
  ingredients.forEach((ing, idx) => {
    ing.wobble += dt * 2;
    ing.timer -= dt;
    
    if (ing.state === 'dirty') {
      const d = Math.hypot(tool.x - ing.x, tool.y - ing.y);
      if (d < ing.r + 20 && tool.isScrubbing && ing.cleanliness < ing.maxClean) {
        ing.cleanliness += scrubSpeed * dt;
        vibrate('light');
        if (scrubCooldown <= 0) {
          AudioManager.playSfx('scrub', 0.18);
          scrubCooldown = 0.09;
        }
        if (Math.random() < 0.1) {
          particles.push({
            x: ing.x + (Math.random()-0.5)*ing.r,
            y: ing.y + (Math.random()-0.5)*ing.r,
            vx: (Math.random()-0.5)*200,
            vy: (Math.random()-0.5)*200,
            life: 0.4,
            r: 4,
            color: '#8B4513'
          });
        }
        if (ing.cleanliness >= ing.maxClean) {
          ing.cleanliness = ing.maxClean;
          ing.state = 'clean';
          AudioManager.playSfx('clean', 0.44);
          showFeedbackGif(celebrationGif, 1100);
          vibrate('medium');
          score++;
          streak++;
          scoreDisplay.textContent = score;
          streakDisplay.textContent = streak;
          for (let i = 0; i < 10; i++) {
            particles.push({
              x: ing.x, y: ing.y,
              vx: (Math.random()-0.5)*300,
              vy: (Math.random()-0.5)*300,
              life: 0.5,
              r: 4,
              color: '#FFD93D'
            });
          }
          setTimeout(() => {
            ingredients.splice(idx, 1);
            spawnIngredient();
          }, 300);
        }
      }
      
      if (ing.timer <= 0) {
        ing.timer = 0;
        setState('GAMEOVER');
      } else if (!warningPlayedForCurrentDish && ing.timer / ing.maxTimer < 0.28) {
        warningPlayedForCurrentDish = true;
        AudioManager.playSfx('warning', 0.35);
      }
    }
  });
  
  spawnTimer += dt;
  
  particles.forEach((p, pi) => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(pi, 1);
  });
  
  if (!isFinite(tool.x) || !isFinite(tool.y)) {
    tool.x = cw/2; tool.y = ch/2;
  }
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, ch);
  grad.addColorStop(0, '#1d1537');
  grad.addColorStop(0.58, '#171029');
  grad.addColorStop(1, '#0f0a1e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, cw, ch);

  const counterGrad = ctx.createLinearGradient(0, ch * 0.58, 0, ch);
  counterGrad.addColorStop(0, 'rgba(109, 73, 42, 0)');
  counterGrad.addColorStop(1, '#4d2d24');
  ctx.fillStyle = counterGrad;
  ctx.fillRect(0, ch * 0.58, cw, ch * 0.42);

  for (let i = 0; i < 6; i++) {
    const x = cw * (0.12 + i * 0.16);
    const y = ch * (0.18 + (i % 2) * 0.05);
    const r = 28 + i * 8;
    const bubble = ctx.createRadialGradient(x - 8, y - 10, 3, x, y, r);
    bubble.addColorStop(0, 'rgba(255,255,255,0.34)');
    bubble.addColorStop(0.45, 'rgba(119,247,212,0.11)');
    bubble.addColorStop(1, 'rgba(119,247,212,0)');
    ctx.fillStyle = bubble;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 3;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(0, ch * (0.58 + i * 0.08));
    ctx.quadraticCurveTo(cw * 0.3, ch * (0.55 + i * 0.08), cw, ch * (0.6 + i * 0.08));
    ctx.stroke();
  }

  ingredients.forEach(ing => {
    drawFood(ctx, ing);

    const timerRatio = ing.timer / ing.maxTimer;
    const barW = 64;
    const barH = 9;
    const barX = ing.x - barW/2;
    const barY = ing.y - ing.r - 22;

    ctx.fillStyle = 'rgba(7,4,20,0.42)';
    ctx.beginPath();
    ctx.roundRect(barX - 3, barY - 3, barW + 6, barH + 6, 6);
    ctx.fill();

    const timerGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
    if (timerRatio > 0.5) {
      timerGrad.addColorStop(0, '#77f7d4');
      timerGrad.addColorStop(1, '#43dfbe');
    } else if (timerRatio > 0.25) {
      timerGrad.addColorStop(0, '#ffd86e');
      timerGrad.addColorStop(1, '#ffb14f');
    } else {
      timerGrad.addColorStop(0, '#ff8b8f');
      timerGrad.addColorStop(1, '#ff5f7a');
    }
    ctx.fillStyle = timerGrad;
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * timerRatio, barH, 5);
    ctx.fill();
  });

  drawTool(ctx);

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 0.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0, p.r), 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function loop(timestamp) {
  try {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  } catch (e) {
    requestAnimationFrame(loop);
  }
}
</script>
