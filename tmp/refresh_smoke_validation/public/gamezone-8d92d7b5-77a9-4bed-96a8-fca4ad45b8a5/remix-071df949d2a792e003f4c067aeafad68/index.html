<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Heart Grid Arcade</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json using Audiowide + Exo 2 + Press Start 2P -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg: #140f28;
            --bg-glow: #26164d;
            --panel: rgba(28, 19, 53, 0.9);
            --panel-strong: rgba(41, 29, 77, 0.96);
            --ink: #f8f3ff;
            --muted: #c6bce8;
            --accent: #8a7dff;
            --accent-bright: #65f7ff;
            --accent-warm: #ff7ac6;
            --border: rgba(139, 125, 255, 0.48);
            --soft: rgba(255, 255, 255, 0.08);
            --select: rgba(101, 247, 255, 0.16);
            --danger: #ff6b8f;
            --danger-soft: rgba(255, 107, 143, 0.18);
            --shadow: rgba(5, 3, 16, 0.45);
            --safe-top: max(env(safe-area-inset-top), 0px);
            --safe-right: max(env(safe-area-inset-right), 0px);
            --safe-bottom: max(env(safe-area-inset-bottom), 0px);
            --safe-left: max(env(safe-area-inset-left), 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(101, 247, 255, 0.16), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 122, 198, 0.14), transparent 28%),
                linear-gradient(180deg, var(--bg-glow), var(--bg));
            color: var(--ink);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        .hud {
            position: absolute;
            top: calc(var(--safe-top) + 0.75rem);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 calc(1rem + var(--safe-right)) 0 calc(1rem + var(--safe-left));
            box-sizing: border-box;
            pointer-events: none;
        }

        .hud-title,
        .hud-status {
            background: linear-gradient(180deg, rgba(31, 21, 59, 0.92), rgba(18, 12, 37, 0.92));
            border: 1px solid var(--border);
            box-shadow: 0 10px 24px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(8px);
        }

        .hud-title {
            color: #fff6cb;
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-size: clamp(1rem, 2.8vw, 1.35rem);
            letter-spacing: 0.08em;
            padding: 0.6rem 0.9rem;
            border-radius: 16px;
            text-shadow: 0 0 12px rgba(255, 122, 198, 0.4);
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.45rem 0.8rem;
            border-radius: 16px;
        }

        .hearts-display {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            letter-spacing: 0.08em;
            filter: drop-shadow(0 0 8px rgba(255, 122, 198, 0.3));
        }

        .timer-display {
            color: var(--accent-bright);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            text-shadow: 0 0 10px rgba(101, 247, 255, 0.35);
        }

        .game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 8, 22, 0.72);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .hidden {
            display: none;
        }

        .paper-panel {
            background:
                radial-gradient(circle at top, rgba(101, 247, 255, 0.1), transparent 38%),
                linear-gradient(180deg, var(--panel-strong), rgba(17, 11, 35, 0.97));
            border: 1px solid var(--border);
            box-shadow: 0 18px 34px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1.8rem;
            text-align: center;
            width: min(80%, 22rem);
            box-sizing: border-box;
        }

        .overlay-title {
            margin: 0 0 0.75rem;
            color: #fff3b0;
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-size: clamp(1.5rem, 6vw, 2rem);
            line-height: 1.1;
            letter-spacing: 0.06em;
            text-shadow: 0 0 16px rgba(255, 122, 198, 0.28);
        }

        .overlay-message {
            margin: 0 0 1.25rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.35;
        }

        .paper-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 0.95rem 1rem;
            background: linear-gradient(180deg, var(--accent-bright), var(--accent));
            color: #190f34;
            box-shadow: 0 8px 16px rgba(101, 247, 255, 0.24);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            pointer-events: auto;
        }

        .paper-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(101, 247, 255, 0.2);
            filter: brightness(0.96);
        }

        .result-time {
            color: var(--accent-bright);
            font-weight: 600;
        }

        .feedback-stack {
            position: absolute;
            right: calc(0.8rem + var(--safe-right));
            bottom: calc(0.9rem + var(--safe-bottom));
            z-index: 65;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
            pointer-events: none;
        }

        .feedback-card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            max-width: min(42vw, 11rem);
            padding: 0.45rem 0.6rem;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 16px;
            background: rgba(17, 11, 35, 0.84);
            box-shadow: 0 10px 22px var(--shadow);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card img {
            width: 3rem;
            height: 3rem;
            border-radius: 12px;
            object-fit: cover;
            flex: none;
            background: rgba(255,255,255,0.06);
        }

        .feedback-copy {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .feedback-label {
            color: #fff6cb;
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
        }

        .feedback-text {
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.2;
        }

        @media (max-width: 640px) {
            .hud {
                top: calc(var(--safe-top) + 0.5rem);
                padding: 0 calc(0.7rem + var(--safe-right)) 0 calc(0.7rem + var(--safe-left));
                gap: 0.55rem;
            }

            .hud-title {
                padding: 0.48rem 0.7rem;
                font-size: clamp(0.92rem, 4.2vw, 1.08rem);
            }

            .hud-status {
                gap: 0.5rem;
                padding: 0.38rem 0.62rem;
            }

            .paper-panel {
                padding: 1.35rem;
                width: min(88%, 20rem);
                border-radius: 18px;
            }

            .overlay-message {
                font-size: 0.98rem;
            }

            .paper-btn {
                font-size: 0.72rem;
            }

            .feedback-stack {
                right: calc(0.55rem + var(--safe-right));
                bottom: calc(0.65rem + var(--safe-bottom));
                gap: 0.45rem;
            }

            .feedback-card {
                max-width: min(50vw, 9.25rem);
                padding: 0.38rem 0.45rem;
                border-radius: 14px;
            }

            .feedback-card img {
                width: 2.45rem;
                height: 2.45rem;
                border-radius: 10px;
            }

            .feedback-label {
                font-size: 0.7rem;
            }

            .feedback-text {
                font-size: 0.68rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "difficulty": { "type": "number", "label": "Missing Cells", "value": 40, "min": 20, "max": 60 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#5E8B7E" }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <div id="hud" class="hud">
                <div class="hud-title">Heart Grid Arcade ✨</div>
                <div class="hud-status">
                    <div id="hearts-display" class="hearts-display">❤️❤️❤️</div>
                    <div id="timer-display" class="timer-display">00:00</div>
                </div>
            </div>

             <div id="game-over-screen" class="hidden game-over-screen">
                 <div class="paper-panel">
                     <h2 id="go-title" class="overlay-title">Level Clear!</h2>
                     <p id="go-message" class="overlay-message">Grid restored in <span id="final-time" class="result-time">00:00</span></p>
                     <button id="restart-btn" class="paper-btn">Retry Run</button>
                 </div>
             </div>

             <!-- [agent-note][stage3] resolved-gif: win/fail feedback -> catalogs/gifs.json -->
             <div class="feedback-stack" aria-live="polite">
                 <div id="win-feedback" class="feedback-card hidden">
                     <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Celebration feedback">
                     <div class="feedback-copy">
                         <span class="feedback-label">Heart Sync</span>
                         <span class="feedback-text">Perfect grid energy restored.</span>
                     </div>
                 </div>
                 <div id="fail-feedback" class="feedback-card hidden">
                     <img src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Puzzle fail feedback">
                     <div class="feedback-copy">
                         <span class="feedback-label">Glitch Alert</span>
                         <span class="feedback-text">Bad match detected. Keep the combo alive.</span>
                     </div>
                 </div>
             </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-audio: bgm/ui/fail/win/select -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_select" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_place" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <audio id="sfx_loss" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let gameState = 'PLAYING';
        let lastTime = 0;

        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        for (let key in window.gameConfigDefs) window.gameConfig[key] = window.gameConfigDefs[key].value;
        window.updateGameConfig = (k, v) => { window.gameConfig[k] = v; };

        let lives = 3;
        let gameOutcome = 'win';

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioEls = {
            select: document.getElementById('sfx_select'),
            place: document.getElementById('sfx_place'),
            error: document.getElementById('sfx_error'),
            warning: document.getElementById('sfx_warning'),
            win: document.getElementById('sfx_win'),
            loss: document.getElementById('sfx_loss')
        };
        const feedbackEls = {
            win: document.getElementById('win-feedback'),
            fail: document.getElementById('fail-feedback')
        };
        let feedbackTimer = 0;
        const sfxLastPlay = new Map();

        bgm.volume = 0.2;
        audioEls.select.volume = 0.35;
        audioEls.place.volume = 0.4;
        audioEls.error.volume = 0.42;
        audioEls.warning.volume = 0.36;
        audioEls.win.volume = 0.45;
        audioEls.loss.volume = 0.45;

        function safePlayAudio(el, reset = true) {
            if (!el) return;
            try {
                if (reset) el.currentTime = 0;
                const playPromise = el.play();
                if (playPromise?.catch) playPromise.catch(() => {});
            } catch (_) {}
        }

        function playSfx(name, cooldown = 90) {
            const now = performance.now();
            const lastPlayed = sfxLastPlay.get(name) || 0;
            if (now - lastPlayed < cooldown) return;
            sfxLastPlay.set(name, now);
            safePlayAudio(audioEls[name]);
        }

        function setLoopState(shouldPlay) {
            if (!bgm) return;
            if (shouldPlay) {
                safePlayAudio(bgm, false);
            } else {
                bgm.pause();
            }
        }

        function showFeedback(type) {
            clearTimeout(feedbackTimer);
            Object.values(feedbackEls).forEach((el) => {
                el.classList.add('hidden');
                el.classList.remove('active');
            });
            const el = feedbackEls[type];
            if (!el) return;
            el.classList.remove('hidden');
            requestAnimationFrame(() => el.classList.add('active'));
            feedbackTimer = setTimeout(() => {
                el.classList.remove('active');
                setTimeout(() => el.classList.add('hidden'), 180);
            }, type === 'win' ? 2400 : 1300);
        }

        function initAudio() {
            if (AudioContext && !audioCtx) audioCtx = new AudioContext();
            if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
            if (!audioUnlocked) {
                setLoopState(true);
                audioUnlocked = true;
            }
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        let grid = [];
        let selectedCell = null;
        let cellSize = 0;
        let gridX = 0, gridY = 0;
        let numpad = [];
        let timeElapsed = 0;
        let timeTimer = 0;

        const BASE_SUDOKU = [
            [1,2,3,4,5,6,7,8,9],
            [4,5,6,7,8,9,1,2,3],
            [7,8,9,1,2,3,4,5,6],
            [2,3,1,5,6,4,8,9,7],
            [5,6,4,8,9,7,2,3,1],
            [8,9,7,2,3,1,5,6,4],
            [3,1,2,6,4,5,9,7,8],
            [6,4,5,9,7,8,3,1,2],
            [9,7,8,3,1,2,6,4,5]
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function generateSudoku() {
            let nums = [1,2,3,4,5,6,7,8,9];
            shuffleArray(nums);
            let map = [0, ...nums];

            let tempGrid = BASE_SUDOKU.map(row => row.map(val => map[val]));

            for (let band = 0; band < 3; band++) {
                let rows = [0,1,2].map(i => band * 3 + i);
                shuffleArray(rows);
                let bandRows = rows.map(r => [...tempGrid[r]]);
                for (let i = 0; i < 3; i++) tempGrid[band * 3 + i] = bandRows[i];
            }

            for (let stack = 0; stack < 3; stack++) {
                let cols = [0,1,2].map(i => stack * 3 + i);
                shuffleArray(cols);
                let newCols = tempGrid.map(row => cols.map(c => row[c]));
                for (let r = 0; r < 9; r++) {
                    for (let i = 0; i < 3; i++) tempGrid[r][stack * 3 + i] = newCols[r][i];
                }
            }

            grid = [];
            for (let r = 0; r < 9; r++) {
                grid[r] = [];
                for (let c = 0; c < 9; c++) {
                    grid[r][c] = {
                        answer: tempGrid[r][c],
                        val: tempGrid[r][c],
                        given: true,
                        error: false,
                        scale: 1.0
                    };
                }
            }

            let cellsToRemove = Math.max(20, Math.min(60, gameConfig.difficulty));
            let positions = [];
            for (let i = 0; i < 81; i++) positions.push(i);
            shuffleArray(positions);
            for (let i = 0; i < cellsToRemove; i++) {
                let r = Math.floor(positions[i] / 9);
                let c = positions[i] % 9;
                grid[r][c].val = 0;
                grid[r][c].given = false;
            }
        }

        function validateGrid() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    grid[r][c].error = false;
                }
            }

            let hasError = false;

            for (let i = 0; i < 9; i++) {
                let rowCounts = {}, colCounts = {};
                for (let j = 0; j < 9; j++) {
                    let rVal = grid[i][j].val;
                    if (rVal) {
                        if (rowCounts[rVal]) { grid[i][j].error = true; grid[i][rowCounts[rVal] - 1].error = true; hasError = true; }
                        else rowCounts[rVal] = j + 1;
                    }
                    let cVal = grid[j][i].val;
                    if (cVal) {
                        if (colCounts[cVal]) { grid[j][i].error = true; grid[colCounts[cVal] - 1][i].error = true; hasError = true; }
                        else colCounts[cVal] = j + 1;
                    }
                }
            }

            for (let br = 0; br < 3; br++) {
                for (let bc = 0; bc < 3; bc++) {
                    let blockCounts = {};
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            let r = br * 3 + i, c = bc * 3 + j;
                            let val = grid[r][c].val;
                            if (val) {
                                if (blockCounts[val]) {
                                    grid[r][c].error = true;
                                    grid[blockCounts[val].r][blockCounts[val].c].error = true;
                                    hasError = true;
                                } else {
                                    blockCounts[val] = { r, c };
                                }
                            }
                        }
                    }
                }
            }
            return hasError;
        }

        function updateHeartsDisplay() {
            const heartsEl = document.getElementById('hearts-display');
            if (heartsEl) {
                heartsEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
            }
        }

        function checkWin() {
            let complete = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c].val === 0 || grid[r][c].error) complete = false;
                }
            }
            if (complete) {
                gameOutcome = 'win';
                playSfx('win', 300);
                showFeedback('win');
                vibrate('heavy');
                setTimeout(() => {
                    document.getElementById('go-title').innerText = 'Level Clear!';
                    document.getElementById('go-message').innerHTML = 'Grid restored in <span id="final-time" class="result-time">00:00</span>';
                    document.getElementById('final-time').innerText = formatTime(timeElapsed);
                    setState('GAMEOVER');
                }, 500);
            }
        }

        function formatTime(s) {
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function calculateLayout() {
            const rootStyles = getComputedStyle(document.documentElement);
            const safeTop = parseFloat(rootStyles.getPropertyValue('--safe-top')) || 0;
            const safeBottom = parseFloat(rootStyles.getPropertyValue('--safe-bottom')) || 0;
            const topInset = safeTop + Math.min(ch * 0.12, 72);
            const bottomInset = safeBottom + Math.min(ch * 0.05, 42);
            const maxGridW = cw * 0.95;
            const availableHeight = Math.max(ch - topInset - bottomInset, 240);
            const gap = Math.max(8, Math.min(cw * 0.02, 16));
            let btnSize = Math.min(cw * 0.15, ch * 0.08);
            let maxGridH = Math.min(ch * 0.6, availableHeight - (btnSize * 2 + gap + 12));
            cellSize = Math.max(20, Math.floor(Math.min(maxGridW / 9, maxGridH / 9)));

            let gridW = cellSize * 9;
            let gridH = cellSize * 9;
            gridX = (cw - gridW) / 2;
            gridY = topInset;

            numpad = [];
            let padY = gridY + gridH + Math.min(ch * 0.05, 34);
            const remainingHeight = ch - safeBottom - padY;
            btnSize = Math.max(28, Math.min(btnSize, (remainingHeight - gap) / 2, (cw - gap * 4) / 5));
            padY = Math.min(padY, ch - safeBottom - (btnSize * 2 + gap));

            let r1W = 5 * btnSize + 4 * gap;
            let r1X = (cw - r1W) / 2;
            for (let i = 1; i <= 5; i++) {
                numpad.push({ val: i, x: r1X + (i - 1) * (btnSize + gap), y: padY, w: btnSize, h: btnSize });
            }

            let r2W = 5 * btnSize + 4 * gap;
            let r2X = (cw - r2W) / 2;
            for (let i = 6; i <= 9; i++) {
                numpad.push({ val: i, x: r2X + (i - 6) * (btnSize + gap), y: padY + btnSize + gap, w: btnSize, h: btnSize });
            }
            numpad.push({ val: 0, label: 'X', x: r2X + 4 * (btnSize + gap), y: padY + btnSize + gap, w: btnSize, h: btnSize });
        }

        function resize(entries) {
            for (let entry of entries) {
                const rect = entry.contentRect;
                cw = rect.width;
                ch = rect.height;
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (!initialized && cw > 0 && ch > 0) {
                    initGame();
                } else if (initialized) {
                    calculateLayout();
                }
            }
        }

        const ro = new ResizeObserver(resize);

        function setState(newState) {
            gameState = newState;
            document.getElementById('game-over-screen').classList.toggle('hidden', gameState !== 'GAMEOVER');
        }

        function initGame() {
            generateSudoku();
            selectedCell = null;
            timeElapsed = 0;
            timeTimer = 0;
            lives = 3;
            gameOutcome = 'win';
            updateHeartsDisplay();
            document.getElementById('timer-display').innerText = '00:00';
            calculateLayout();
            setState('PLAYING');
            if (audioUnlocked) setLoopState(true);
            initialized = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            initGame();
        }

        function handleGlobalInput(e) {
            initAudio();
            if (gameState === 'GAMEOVER') {
                if (e.target.id === 'restart-btn') {
                    playSfx('select', 120);
                    restartGame();
                }
                return;
            }
            if (gameState === 'PLAYING' && (e.type === 'pointerdown')) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (x >= gridX && x <= gridX + cellSize * 9 && y >= gridY && y <= gridY + cellSize * 9) {
                    let c = Math.floor((x - gridX) / cellSize);
                    let r = Math.floor((y - gridY) / cellSize);
                    if (r >= 0 && r < 9 && c >= 0 && c < 9) {
                        selectedCell = { r, c };
                        playSfx('select', 70);
                        vibrate('light');
                    }
                }

                for (let btn of numpad) {
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        if (selectedCell && !grid[selectedCell.r][selectedCell.c].given) {
                            let cell = grid[selectedCell.r][selectedCell.c];
                            if (cell.val !== btn.val) {
                                cell.val = btn.val;
                                cell.scale = 1.5;
                                let hasErr = validateGrid();

                                if (hasErr && cell.error) {
                                    lives--;
                                    updateHeartsDisplay();
                                    if (lives <= 0) {
                                        playSfx('loss', 280);
                                        showFeedback('fail');
                                        setLoopState(false);
                                        vibrate('heavy');
                                        gameOutcome = 'loss';
                                        setTimeout(() => {
                                            document.getElementById('go-title').innerText = 'Run Failed';
                                            document.getElementById('go-message').innerHTML = 'All hearts spent on bad matches.';
                                            setState('GAMEOVER');
                                        }, 500);
                                        return;
                                    }
                                }

                                if (hasErr) {
                                    showFeedback('fail');
                                    playSfx('error', 120);
                                    if (lives === 1) playSfx('warning', 260);
                                    vibrate('heavy');
                                } else {
                                    if (btn.val !== 0) {
                                        playSfx('place', 80);
                                        vibrate('medium');
                                    } else {
                                        playSfx('select', 120);
                                    }
                                }
                                checkWin();
                            }
                        }
                    }
                }
            }
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function render() {
            const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
            bgGrad.addColorStop(0, '#26164D');
            bgGrad.addColorStop(1, '#140F28');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, cw, ch);

            const glow = ctx.createRadialGradient(cw * 0.5, ch * 0.18, 0, cw * 0.5, ch * 0.18, Math.max(cw, ch) * 0.65);
            glow.addColorStop(0, 'rgba(101,247,255,0.16)');
            glow.addColorStop(1, 'rgba(101,247,255,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, cw, ch);

            const starCount = Math.max(12, Math.floor(cw / 55));
            for (let i = 0; i < starCount; i++) {
                const x = (i * 97) % cw;
                const y = ((i * 67) % Math.max(gridY - 12, 24)) + 8;
                const size = (i % 3) + 1;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.45)' : 'rgba(101,247,255,0.4)';
                ctx.fillRect(x, y, size, size);
            }

            ctx.shadowColor = 'rgba(0, 0, 0, 0.32)';
            ctx.shadowBlur = 24;
            ctx.shadowOffsetY = 12;
            ctx.fillStyle = 'rgba(16, 11, 33, 0.88)';
            drawRoundedRect(ctx, gridX, gridY, cellSize * 9, cellSize * 9, 18);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            let selVal = (selectedCell && grid[selectedCell.r][selectedCell.c].val) ? grid[selectedCell.r][selectedCell.c].val : 0;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let cx = gridX + c * cellSize;
                    let cy = gridY + r * cellSize;
                    let cell = grid[r][c];

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        ctx.fillStyle = 'rgba(101, 247, 255, 0.22)';
                        ctx.fillRect(cx, cy, cellSize, cellSize);
                    } else if (selVal && cell.val === selVal) {
                        ctx.fillStyle = 'rgba(138, 125, 255, 0.16)';
                        ctx.fillRect(cx, cy, cellSize, cellSize);
                    } else if (cell.error) {
                        ctx.fillStyle = 'rgba(255, 107, 143, 0.18)';
                        ctx.fillRect(cx, cy, cellSize, cellSize);
                    }

                    if (!cell.given && cell.val !== 0) {
                        ctx.fillStyle = 'rgba(101, 247, 255, 0.06)';
                        ctx.fillRect(cx + 2, cy + 2, cellSize - 4, cellSize - 4);
                    }

                    if (cell.val !== 0) {
                        ctx.save();
                        ctx.translate(cx + cellSize / 2, cy + cellSize / 2);
                        ctx.scale(cell.scale, cell.scale);

                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.font = `700 ${cellSize * 0.5}px 'Exo 2', system-ui, sans-serif`;

                        if (cell.error) ctx.fillStyle = '#FF6B8F';
                        else if (cell.given) ctx.fillStyle = '#FFF7D2';
                        else ctx.fillStyle = '#65F7FF';

                        ctx.fillText(cell.val, 0, cellSize * 0.05);
                        ctx.restore();
                    }
                }
            }

            ctx.beginPath();
            for (let i = 0; i <= 9; i++) {
                let x = gridX + i * cellSize;
                let y = gridY + i * cellSize;

                ctx.moveTo(x, gridY);
                ctx.lineTo(x, gridY + cellSize * 9);
                ctx.moveTo(gridX, y);
                ctx.lineTo(gridX + cellSize * 9, y);
            }
            ctx.strokeStyle = 'rgba(198, 188, 232, 0.26)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i <= 9; i += 3) {
                let x = gridX + i * cellSize;
                let y = gridY + i * cellSize;
                ctx.moveTo(x, gridY);
                ctx.lineTo(x, gridY + cellSize * 9);
                ctx.moveTo(gridX, y);
                ctx.lineTo(gridX + cellSize * 9, y);
            }
            ctx.strokeStyle = 'rgba(255, 122, 198, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.stroke();

            for (let btn of numpad) {
                const isClear = btn.val === 0;
                const btnGrad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
                if (isClear) {
                    btnGrad.addColorStop(0, '#FF94B1');
                    btnGrad.addColorStop(1, '#FF6B8F');
                } else {
                    btnGrad.addColorStop(0, '#2B1E56');
                    btnGrad.addColorStop(1, '#181034');
                }

                ctx.shadowColor = isClear ? 'rgba(255, 107, 143, 0.35)' : 'rgba(0, 0, 0, 0.22)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;

                ctx.fillStyle = btnGrad;
                drawRoundedRect(ctx, btn.x, btn.y, btn.w, btn.h, btn.w * 0.2);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = isClear ? 'rgba(255,255,255,0.28)' : 'rgba(101, 247, 255, 0.2)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `400 ${btn.h * 0.38}px 'Press Start 2P', 'Courier New', monospace`;
                ctx.fillStyle = isClear ? '#FFF5FA' : '#F3EEFF';
                ctx.fillText(btn.label || btn.val, btn.x + btn.w / 2, btn.y + btn.h / 2 + btn.h * 0.05);
            }
        }

        function gameLoop(timestamp) {
            try {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                if (gameState === 'PLAYING') {
                    timeTimer += dt;
                    if (timeTimer >= 1) {
                        timeElapsed++;
                        timeTimer -= 1;
                        document.getElementById('timer-display').innerText = formatTime(timeElapsed);
                    }

                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            if (grid[r][c].scale > 1.0) {
                                grid[r][c].scale -= dt * 3;
                                if (grid[r][c].scale < 1.0) grid[r][c].scale = 1.0;
                            }
                        }
                    }
                }

                render();
            } catch (e) {
                console.error('Loop error:', e);
            }
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);

             window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
             document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);

             document.addEventListener('visibilitychange', () => {
                 if (document.hidden) setLoopState(false);
                 else if (audioUnlocked && gameState === 'PLAYING') setLoopState(true);
             });

             document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
        });
    </script>
</body>
</html>
