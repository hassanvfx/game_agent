<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Shard Sprint: Light Run</title>
    <!-- [agent-note][stage4] font-remap: display=Audiowide, ui=Exo 2 from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-deep: #050816;
            --bg-mid: #10214a;
            --panel-top: rgba(15, 25, 58, 0.8);
            --panel-bottom: rgba(4, 10, 26, 0.88);
            --panel-border: rgba(113, 240, 255, 0.35);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #ecf8ff;
            --text-soft: rgba(217, 242, 255, 0.82);
            --accent-cyan: #73f2ff;
            --accent-blue: #4ea7ff;
            --accent-gold: #ffd76b;
            --danger: #ff6d8e;
            --button-shadow: rgba(64, 205, 255, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(73, 142, 255, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            border: 0;
            cursor: pointer;
            font-family: "Exo 2", system-ui, sans-serif;
            font-size: 1rem;
            line-height: 1.1;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            touch-action: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(113, 240, 255, 0.14), transparent 36%),
                linear-gradient(180deg, rgba(9, 15, 36, 0.45), rgba(9, 15, 36, 0));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 18% 24%, rgba(255, 215, 107, 0.16), transparent 0 18%),
                radial-gradient(circle at 82% 18%, rgba(115, 242, 255, 0.12), transparent 0 22%);
            opacity: 0.95;
        }

        #game-container::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 100% 32px, 32px 100%;
            mix-blend-mode: soft-light;
            opacity: 0.3;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .hidden { display: none !important; }

        .glass-panel {
            position: relative;
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 24px rgba(70, 169, 255, 0.15);
        }

        .screen-card {
            width: min(92vw, 460px);
            border-radius: 28px;
            padding: 24px 20px;
            text-align: center;
            pointer-events: auto;
            transform: translateZ(0);
        }

        #start-screen {
            transition: transform 220ms ease, box-shadow 220ms ease;
        }

        #start-screen:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 20px 48px rgba(1, 8, 25, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 28px rgba(115, 242, 255, 0.24);
        }

        .hero-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 215, 107, 0.2), rgba(115, 242, 255, 0.12));
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 18px rgba(115, 242, 255, 0.18);
            font-size: 2rem;
        }

        .display-font {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .title-glow {
            text-shadow: 0 0 18px rgba(115, 242, 255, 0.55), 0 0 34px rgba(78, 167, 255, 0.35);
        }

        .screen-title {
            margin: 0 0 10px;
            font-size: clamp(2rem, 8vw, 3rem);
            line-height: 1.02;
            color: #fffefc;
        }

        .screen-copy {
            margin: 0 auto 18px;
            max-width: 24ch;
            color: var(--text-soft);
            font-size: clamp(0.98rem, 3.6vw, 1.15rem);
            line-height: 1.35;
        }

        .chip-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0 0 18px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(115, 242, 255, 0.22);
            background: rgba(12, 26, 55, 0.5);
            color: rgba(226, 247, 255, 0.88);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            min-width: 180px;
            padding: 14px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #07111f;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 12px 24px var(--button-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow:
                0 16px 28px rgba(64, 205, 255, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
            filter: brightness(1.04);
            outline: none;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #fff5ef, #c7f2ff);
            color: #13233d;
        }

        .score-caption {
            margin: 0 0 4px;
            font-size: 1rem;
            color: var(--text-soft);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-value {
            margin: 0 0 20px;
            font-size: clamp(2.8rem, 12vw, 4.4rem);
            font-weight: 700;
            line-height: 1;
            color: var(--accent-cyan);
        }

        #hud {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            left: calc(12px + env(safe-area-inset-left));
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .hud-avatar {
            position: relative;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: radial-gradient(circle at 35% 35%, #fff4bf, #ffcf54 62%, #ff9d2d 100%);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.1),
                0 0 16px rgba(115, 242, 255, 0.32);
            font-size: 0.88rem;
        }

        .hud-label {
            color: rgba(223, 245, 255, 0.74);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hud-score {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1;
        }

        #tap-hint {
            position: absolute;
            bottom: calc(68px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(88vw, 340px);
            padding: 10px 14px;
            border-radius: 999px;
            text-align: center;
            color: rgba(227, 246, 255, 0.9);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            background: rgba(7, 14, 34, 0.42);
            border: 1px solid rgba(115, 242, 255, 0.16);
            box-shadow: 0 0 18px rgba(115, 242, 255, 0.12);
            animation: hintPulse 1.3s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.55; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-2px); }
        }

        .status-tone-danger { color: #ffc4d1; }

        .feedback-gif {
            position: absolute;
            right: calc(12px + env(safe-area-inset-right));
            width: clamp(88px, 24vw, 132px);
            border-radius: 18px;
            border: 1px solid rgba(115, 242, 255, 0.24);
            background: rgba(7, 14, 34, 0.34);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #pickup-gif {
            top: calc(16px + env(safe-area-inset-top));
            aspect-ratio: 1 / 1;
        }

        #fail-gif {
            bottom: calc(22px + env(safe-area-inset-bottom));
            aspect-ratio: 1 / 1;
        }

        @media (max-width: 640px) {
            .screen-card {
                width: min(94vw, 420px);
                padding: 20px 16px;
                border-radius: 24px;
            }

            .hero-mark {
                width: 56px;
                height: 56px;
                margin-bottom: 10px;
                font-size: 1.85rem;
            }

            .chip-row {
                margin-bottom: 16px;
                gap: 6px;
            }

            .chip {
                font-size: 0.68rem;
                padding: 5px 8px;
            }

            .action-btn {
                width: 100%;
                min-width: 0;
                font-size: 0.96rem;
            }

            .hud-pill {
                padding: 7px 12px;
            }

            .hud-score {
                font-size: 1.05rem;
            }

            #tap-hint {
                bottom: calc(52px + env(safe-area-inset-bottom));
                font-size: 0.78rem;
                padding: 9px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer">

            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel screen-card">
                <div class="hero-mark" aria-hidden="true">🧍✨</div>
                <h1 class="screen-title title-glow display-font">Shard Sprint</h1>
                <p class="screen-copy">Guide the glow-runner through static storms, harvest light shards, and keep the trail alive.</p>
                <div class="chip-row" aria-hidden="true">
                    <span class="chip">⚡ Light Trail</span>
                    <span class="chip">💎 Shard Chase</span>
                    <span class="chip">☁️ Static Dodge</span>
                </div>
                <button id="start-btn" class="action-btn">
                    Start Run
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel screen-card">
                <div class="hero-mark" aria-hidden="true">🌩️</div>
                <h2 class="screen-title display-font status-tone-danger">Signal Lost</h2>
                <p class="score-caption">Shards Banked</p>
                <div class="score-value title-glow"><span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-btn secondary">
                    Run Again
                </button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="glass-panel hud-pill">
                    <div class="hud-avatar" aria-hidden="true">✨</div>
                    <div>
                        <div class="hud-label">Shards</div>
                        <div class="hud-score" id="score">0</div>
                    </div>
                </div>
            </div>

            <!-- Tap Hint -->
            <div id="tap-hint" class="hidden">
                Tap to jump • tap again while falling to glide
            </div>

            <!-- [agent-note][stage3] resolved-gif: pickup/fail reactions from catalogs/gifs.json; keep compact off playfield -->
            <img id="pickup-gif" class="feedback-gif" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="Shard pickup reaction" aria-hidden="true">
            <img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Signal lost reaction" aria-hidden="true">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                glide: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                milestone: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.lastPlayed = new Map();
                this.bgm = this.makeAudio(ASSETS.bgm, 0.2, true);
                this.sfx = {
                    start: this.makeAudio(ASSETS.sfx.start, 0.5),
                    jump: this.makeAudio(ASSETS.sfx.jump, 0.4),
                    glide: this.makeAudio(ASSETS.sfx.glide, 0.34),
                    land: this.makeAudio(ASSETS.sfx.land, 0.3),
                    score: this.makeAudio(ASSETS.sfx.score, 0.46),
                    milestone: this.makeAudio(ASSETS.sfx.milestone, 0.5),
                    fail: this.makeAudio(ASSETS.sfx.fail, 0.52)
                };
            }

            makeAudio(src, volume, loop = false) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                return audio;
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((audio) => audio.load());
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 0) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const lastTime = this.lastPlayed.get(key) ?? -Infinity;
                if (now - lastTime < cooldown) return;
                this.lastPlayed.set(key, now);
                const sound = this.sfx[key];
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const pickupGif = document.getElementById('pickup-gif');
        const failGif = document.getElementById('fail-gif');
        let feedbackTimers = {};

        function pulseGif(element, duration = 900) {
            if (!element) return;
            element.classList.add('visible');
            clearTimeout(feedbackTimers[element.id]);
            feedbackTimers[element.id] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let frames = 0;
        let score = 0;
        let gameSpeed = 4;

        // Arcade sky phases for the light-run loop
        const PALETTES = [
            { name: "Dawn", top: "#0f172a", bottom: "#3b82f6", sun: "#fbbf24", particle: "leaf" },
            { name: "Day", top: "#38bdf8", bottom: "#bae6fd", sun: "#fde047", particle: "leaf" },
            { name: "Sunset", top: "#4c1d95", bottom: "#f472b6", sun: "#f87171", particle: "firefly" },
            { name: "Night", top: "#020617", bottom: "#1e1b4b", sun: "#e2e8f0", particle: "firefly" }
        ];
        let currentPaletteIndex = 0;
        let transitionProgress = 0; // 0 to 1

        // Entities: runner, hazards, and collectible shards
        let player = {
            x: 100, y: 0, width: 30, height: 50,
            dy: 0, jumpForce: 12, gravity: 0.6, grounded: false,
            color: '#fff', scarfPoints: []
        };

        let obstacles = [];
        let crystals = [];
        let particles = [];
        let terrainOffset = 0;
        let playerWasGrounded = false;

        /** 4. RESIZE HANDLER */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 150; // Reset player pos on resize
        }
        window.addEventListener('resize', resize);
        resize();

        /** 5. UTILS */
        function lerpColor(a, b, amount) {
            const ah = parseInt(a.replace(/#/g, ''), 16),
                ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                bh = parseInt(b.replace(/#/g, ''), 16),
                br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                rr = ar + amount * (br - ar),
                rg = ag + amount * (bg - ag),
                rb = ab + amount * (bb - ab);
            return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1);
        }

        /** 6. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 5;
            frames = 0;
            currentPaletteIndex = 0;
            transitionProgress = 0;

            player.y = height - 100;
            player.dy = 0;
            player.scarfPoints = [];
            for (let i = 0; i < 5; i++) player.scarfPoints.push({ x: player.x, y: player.y });

            obstacles = [];
            crystals = [];
            particles = [];
            playerWasGrounded = false;
            failGif.classList.remove('visible');
            pickupGif.classList.remove('visible');

            document.getElementById('score').innerText = score;
            document.getElementById('tap-hint').classList.remove('hidden');
            setTimeout(() => document.getElementById('tap-hint').classList.add('hidden'), 3000);
        }

        function spawnObstacle() {
            const type = Math.random() > 0.5 ? 'ground' : 'air';
            obstacles.push({
                x: width + 50,
                y: type === 'ground' ? height - 60 : height - 180,
                width: 40,
                height: 40,
                type: type,
                rotation: 0
            });
        }

        function spawnCrystal() {
            crystals.push({
                x: width + 50 + Math.random() * 100,
                y: height - 100 - Math.random() * 150,
                size: 15,
                oscillation: Math.random() * Math.PI
            });
        }

        function spawnParticle() {
            const pType = PALETTES[currentPaletteIndex].particle;
            particles.push({
                x: width + Math.random() * 50,
                y: Math.random() * height,
                vx: -(Math.random() * 2 + 1),
                vy: pType === 'leaf' ? Math.random() * 1 : (Math.random() - 0.5) * 0.5,
                size: Math.random() * 3 + 1,
                life: 1.0,
                type: pType
            });
        }

        function update() {
            frames++;
            gameSpeed += 0.001; // Slowly increase speed

            // Palette cycling keeps the endless run visually alive
            transitionProgress += 0.002;
            if (transitionProgress >= 1) {
                transitionProgress = 0;
                currentPaletteIndex = (currentPaletteIndex + 1) % PALETTES.length;
            }

            // Player Physics
            player.dy += player.gravity;
            player.y += player.dy;

            // Ground Collision
            if (player.y + player.height > height - 50) {
                player.y = height - 50 - player.height;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (player.grounded && !playerWasGrounded && frames > 2) {
                audio.playSFX('land', 120);
            }
            playerWasGrounded = player.grounded;

            // Trail physics sells speed without changing movement
            player.scarfPoints.unshift({ x: player.x, y: player.y + 10 });
            if (player.scarfPoints.length > 8) player.scarfPoints.pop();

            // Spawning
            if (frames % 120 === 0 && Math.random() > 0.3) spawnObstacle();
            if (frames % 90 === 0 && Math.random() > 0.4) spawnCrystal();
            if (frames % 10 === 0) spawnParticle();

            // Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.rotation += 0.05;

                // Collision
                if (
                    player.x < obs.x + obs.width - 10 &&
                    player.x + player.width > obs.x + 10 &&
                    player.y < obs.y + obs.height - 10 &&
                    player.y + player.height > obs.y + 10
                ) {
                    gameOver();
                }

                if (obs.x < -100) obstacles.splice(i, 1);
            }

            // Crystals
            for (let i = crystals.length - 1; i >= 0; i--) {
                let cry = crystals[i];
                cry.x -= gameSpeed;
                cry.oscillation += 0.1;
                cry.y += Math.sin(cry.oscillation) * 0.5;

                // Collection
                const dist = Math.hypot((player.x + player.width / 2) - cry.x, (player.y + player.height / 2) - cry.y);
                if (dist < 40) {
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', 80);
                    pulseGif(pickupGif, 720);
                    if (score % 5 === 0) audio.playSFX('milestone', 180);
                    // Visual Burst
                    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.fillRect(0, 0, width, height);
                    crystals.splice(i, 1);
                } else if (cry.x < -50) {
                    crystals.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x -= gameSpeed * 0.5 + Math.abs(p.vx);
                p.y += p.vy;
                p.life -= 0.005;
                if (p.x < -50 || p.life <= 0) particles.splice(i, 1);
            }

            terrainOffset += gameSpeed;
        }

        function draw() {
            // 1. Dynamic Background
            const p1 = PALETTES[currentPaletteIndex];
            const p2 = PALETTES[(currentPaletteIndex + 1) % PALETTES.length];

            const topColor = lerpColor(p1.top, p2.top, transitionProgress);
            const botColor = lerpColor(p1.bottom, p2.bottom, transitionProgress);
            const sunColor = lerpColor(p1.sun, p2.sun, transitionProgress);

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, topColor);
            grad.addColorStop(1, botColor);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Sun/Moon
            ctx.shadowBlur = 40;
            ctx.shadowColor = sunColor;
            ctx.fillStyle = sunColor;
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.2, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 3. Parallax Mountains (Far)
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 10) {
                const y = height - 150 - Math.sin((x + terrainOffset * 0.2) * 0.005) * 100;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // 4. Parallax Trees (Mid)
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            for (let x = -(terrainOffset * 0.5) % 200; x < width; x += 200) {
                // Simple tree shape
                ctx.beginPath();
                ctx.moveTo(x, height - 50);
                ctx.lineTo(x + 20, height - 250);
                ctx.lineTo(x + 40, height - 50);
                ctx.fill();
            }

            // 5. Particles (Behind Player)
            particles.forEach(p => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 6. Ground
            ctx.fillStyle = "#1e293b"; // Slate 800
            ctx.fillRect(0, height - 50, width, 50);
            // Grass details
            ctx.fillStyle = "#334155";
            for (let i = 0; i < width; i += 40) {
                let gx = (i - terrainOffset) % width;
                if (gx < 0) gx += width;
                ctx.fillRect(gx, height - 50, 20, 10);
            }

            // 7. Player (Light Runner)
            // Scarf
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 6;
            ctx.beginPath();
            player.scarfPoints.forEach((pt, i) => {
                if (i === 0) ctx.moveTo(pt.x + 10, pt.y + 10);
                else ctx.lineTo(pt.x - i * 4, pt.y + 10 + Math.sin(frames * 0.2 + i) * 5);
            });
            ctx.stroke();

            // Body
            ctx.fillStyle = "#f1f5f9"; // Slate 100
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Eye
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(player.x + 20, player.y + 10, 5, 5);
            // Glow
            ctx.globalCompositeOperation = 'lighter';
            const playerGrad = ctx.createRadialGradient(player.x + 15, player.y + 25, 0, player.x + 15, player.y + 25, 60);
            playerGrad.addColorStop(0, "rgba(255, 255, 255, 0.3)");
            playerGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.fillStyle = playerGrad;
            ctx.beginPath(); ctx.arc(player.x + 15, player.y + 25, 60, 0, Math.PI * 2); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // 8. Obstacles (Static bursts or floor spikes)
            obstacles.forEach(obs => {
                if (obs.type === 'ground') {
                    // Spike
                    ctx.fillStyle = "#94a3b8";
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.fill();
                } else {
                    // Floating Wisp
                    ctx.fillStyle = "#4c1d95";
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // Glow
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#8b5cf6";
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // 9. Shards
            crystals.forEach(cry => {
                ctx.save();
                ctx.translate(cry.x, cry.y);
                ctx.rotate(cry.oscillation);

                // Diamond shape
                ctx.fillStyle = "#22d3ee"; // Cyan
                ctx.beginPath();
                ctx.moveTo(0, -cry.size);
                ctx.lineTo(cry.size, 0);
                ctx.lineTo(0, cry.size);
                ctx.lineTo(-cry.size, 0);
                ctx.fill();

                // Strong Glow
                ctx.globalCompositeOperation = 'lighter';
                const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, 30);
                glow.addColorStop(0, "rgba(34, 211, 238, 0.8)");
                glow.addColorStop(1, "rgba(34, 211, 238, 0)");
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();

                ctx.restore();
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, width, height);
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            pulseGif(failGif, 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. INPUT HANDLING */
        function jump() {
            if (gameActive && player.grounded) {
                player.dy = -player.jumpForce;
                player.grounded = false;
                audio.playSFX('jump', 90);
            } else if (gameActive && !player.grounded && player.dy > 0) {
                // Glide mechanic (small boost)
                player.dy -= 2;
                audio.playSFX('glide', 140);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        window.addEventListener('pointerdown', (e) => {
            // [agent-note][stage4] repaired: mobile-action-path | scope gameplay jump away from tappable UI controls
            if (e.target.closest('button')) return;
            if (document.getElementById('start-screen').contains(e.target) || document.getElementById('game-over-screen').contains(e.target)) return;
            jump();
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
