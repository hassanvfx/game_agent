<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dino Grove Meetup</title>
<!-- [agent-note][stage4] catalog-fonts: title -> Audiowide, ui/body -> Exo 2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #0d1b3f;
        --sky-bottom: #24114c;
        --mist: rgba(137, 92, 255, 0.22);
        --panel: rgba(14, 20, 45, 0.82);
        --panel-strong: rgba(18, 27, 58, 0.92);
        --panel-border: rgba(135, 221, 255, 0.45);
        --text: #eef6ff;
        --muted: #b7c7ee;
        --green: #6af0a8;
        --green-dark: #22976c;
        --blue-soft: rgba(106, 205, 255, 0.18);
        --red-soft: rgba(255, 116, 167, 0.2);
        --glow: #84f6ff;
        --glow-strong: #b993ff;
        --hazard: #ff7490;
        --ground-light: #164d52;
        --ground-dark: #0b2730;
        --tree-leaf: #6ef6b8;
        --tree-shadow: #3bb081;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(131, 180, 255, 0.25), transparent 30%),
            linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        position: relative;
    }

    body::before,
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    body::before {
        background:
            radial-gradient(circle at 20% 18%, rgba(132, 246, 255, 0.18), transparent 18%),
            radial-gradient(circle at 80% 12%, rgba(185, 147, 255, 0.2), transparent 20%),
            radial-gradient(circle at 50% 70%, rgba(106, 240, 168, 0.08), transparent 28%);
        opacity: 0.95;
    }

    body::after {
        background:
            linear-gradient(180deg, transparent 0%, rgba(1, 6, 20, 0.08) 55%, rgba(1, 6, 20, 0.34) 100%),
            repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 80px);
        mix-blend-mode: screen;
        opacity: 0.35;
    }

    button {
        font: inherit;
        border: 0;
        cursor: pointer;
        touch-action: manipulation;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    #world-ui {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
    }

    .hidden {
        display: none !important;
    }

    .glass-panel {
        background:
            linear-gradient(180deg, rgba(32, 42, 84, 0.96), rgba(10, 17, 38, 0.92));
        backdrop-filter: blur(10px);
        border-radius: 20px;
        border: 2px solid var(--panel-border);
        box-shadow:
            0 16px 28px rgba(3, 8, 24, 0.45),
            inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .screen-cover {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at center, rgba(132, 246, 255, 0.18), transparent 36%),
            linear-gradient(180deg, rgba(7, 14, 36, 0.4), rgba(7, 14, 36, 0.7));
        pointer-events: auto;
    }

    .start-card {
        width: min(100% - 32px, 420px);
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
    }

    .title {
        margin: 0 0 8px;
        text-align: center;
        color: #a8fbff;
        font-family: 'Audiowide', sans-serif;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.15;
        letter-spacing: 0.08em;
        text-shadow: 0 0 18px rgba(132, 246, 255, 0.4);
    }

    .subtitle {
        margin: 0 0 24px;
        color: #ffd76a;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(255, 215, 106, 0.18);
    }

    .identity-panel {
        width: 100%;
        background:
            radial-gradient(circle at top, rgba(132, 246, 255, 0.18), transparent 55%),
            linear-gradient(180deg, rgba(25, 37, 73, 0.95), rgba(15, 24, 49, 0.95));
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 24px;
        text-align: center;
        box-shadow: inset 0 0 0 1px rgba(132, 246, 255, 0.16);
        box-sizing: border-box;
    }

    .identity-label {
        margin: 0 0 4px;
        color: #8fb5ff;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
    }

    .identity-name {
        margin: 0;
        color: var(--text);
        font-family: 'Audiowide', sans-serif;
        font-size: 1.5rem;
        font-weight: 400;
    }

    .intro-copy {
        width: 100%;
        margin: 0 0 20px;
        color: var(--text);
        font-size: 0.95rem;
        line-height: 1.4;
        text-align: center;
    }

    .primary-btn {
        width: 100%;
        background: linear-gradient(180deg, #7af7f1, #50d2ff);
        color: #081426;
        font-family: 'Audiowide', sans-serif;
        font-size: clamp(1rem, 3vw, 1.2rem);
        letter-spacing: 0.08em;
        padding: 18px 16px;
        border-radius: 16px;
        box-shadow: 0 6px 0 #2d7bb2, 0 0 22px rgba(80, 210, 255, 0.3);
        transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        pointer-events: auto;
    }

    .primary-btn:active {
        transform: translateY(6px);
        box-shadow: 0 0 0 var(--green-dark);
    }

    #hud {
        flex: 1;
        position: relative;
    }

    .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .status-pill {
        background: linear-gradient(180deg, rgba(18, 31, 68, 0.88), rgba(9, 18, 41, 0.82));
        backdrop-filter: blur(10px);
        padding: 10px 16px;
        border-radius: 999px;
        color: white;
        font-size: 0.95rem;
        font-weight: 700;
        border: 1px solid rgba(132, 246, 255, 0.25);
        box-shadow: 0 0 16px rgba(132, 246, 255, 0.15);
        pointer-events: none;
    }

    .menu-btn {
        pointer-events: auto;
        background: linear-gradient(180deg, rgba(33, 48, 98, 0.96), rgba(20, 29, 61, 0.96));
        color: var(--text);
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(185, 147, 255, 0.35);
        box-shadow: 0 8px 16px rgba(6, 10, 28, 0.22);
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.06em;
    }

    #morph-menu {
        position: absolute;
        top: 72px;
        right: 16px;
        width: 192px;
        background: linear-gradient(180deg, rgba(18, 29, 64, 0.98), rgba(10, 18, 40, 0.98));
        border-radius: 20px;
        box-shadow: 0 18px 32px rgba(3, 8, 24, 0.42);
        border: 1px solid rgba(132, 246, 255, 0.22);
        padding: 10px;
        pointer-events: auto;
        transform: translateX(120%);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .menu-label {
        font-size: 0.72rem;
        font-weight: 700;
        color: #91b9ff;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        padding: 4px 8px;
    }

    .morph-card {
        background: linear-gradient(180deg, rgba(26, 39, 79, 0.98), rgba(16, 24, 50, 0.98));
        border-radius: 12px;
        padding: 10px 8px;
        text-align: center;
        border: 2px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        pointer-events: auto;
    }

    .morph-card.active {
        border-color: #76f0c5;
        background: linear-gradient(180deg, rgba(38, 72, 89, 0.98), rgba(18, 45, 54, 0.98));
        box-shadow: 0 0 18px rgba(118, 240, 197, 0.18);
    }

    .morph-name {
        font-family: 'Audiowide', sans-serif;
        font-weight: 400;
    }

    .morph-name.raptor {
        color: #f97316;
    }

    .morph-name.trex {
        color: #16a34a;
    }

    .morph-name.trike {
        color: #3b82f6;
    }

    .morph-desc {
        font-size: 0.72rem;
        color: #b2c2e6;
        margin-top: 2px;
    }

    .controls-wrap {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 192px;
        pointer-events: none;
    }

    #joystick-zone {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 120px;
        height: 120px;
        pointer-events: auto;
    }

    #stick-bg {
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at center, rgba(132, 246, 255, 0.16), rgba(11, 20, 44, 0.55) 64%);
        border-radius: 50%;
        position: relative;
        border: 1px solid rgba(132, 246, 255, 0.24);
        box-shadow: 0 0 18px rgba(132, 246, 255, 0.12);
    }

    #stick-handle {
        width: 50px;
        height: 50px;
        background: linear-gradient(180deg, #d8fbff, #7feeff);
        border-radius: 50%;
        position: absolute;
        top: 35px;
        left: 35px;
        box-shadow: 0 4px 16px rgba(25, 45, 94, 0.42);
    }

    .actions {
        position: absolute;
        bottom: 40px;
        right: 32px;
        display: flex;
        gap: 16px;
        pointer-events: auto;
    }

    .btn-action {
        background: linear-gradient(180deg, rgba(33, 48, 98, 1), rgba(17, 28, 63, 1));
        border-radius: 50%;
        width: 64px;
        height: 64px;
        box-shadow: 0 4px 0 rgba(7, 12, 31, 0.72), 0 0 18px rgba(132, 246, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #eef6ff;
        font-size: 14px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.1s;
    }

    .btn-action:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #ccc;
    }

    .btn-chat {
        background:
            radial-gradient(circle at 30% 30%, rgba(132, 246, 255, 0.34), rgba(36, 78, 131, 0.95));
        color: #d9fbff;
        font-size: 1.5rem;
    }

    .btn-roar {
        background:
            radial-gradient(circle at 30% 30%, rgba(255, 116, 167, 0.36), rgba(114, 27, 67, 0.96));
        color: #fff2f5;
        font-family: 'Audiowide', sans-serif;
        font-size: 0.72rem;
        line-height: 1.1;
        letter-spacing: 0.06em;
    }

    .chat-bubble {
        position: absolute;
        background: rgba(246, 251, 255, 0.96);
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 14px;
        color: #17304f;
        font-weight: 700;
        pointer-events: none;
        box-shadow: 0 6px 16px rgba(0, 10, 24, 0.18);
        white-space: nowrap;
        transform: translate(-50%, -100%);
        margin-top: -20px;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .chat-bubble::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        margin-left: -6px;
        border-width: 6px 6px 0;
        border-style: solid;
        border-color: rgba(246, 251, 255, 0.96) transparent transparent transparent;
    }

    .feedback-stack {
        position: absolute;
        top: 92px;
        left: 50%;
        transform: translateX(-50%);
        width: min(100vw - 40px, 320px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        z-index: 40;
        align-items: center;
    }

    .feedback-banner {
        min-width: 180px;
        max-width: 100%;
        padding: 10px 14px;
        border-radius: 16px;
        background: rgba(10, 18, 40, 0.78);
        border: 1px solid rgba(132, 246, 255, 0.28);
        color: var(--text);
        text-align: center;
        font-family: 'Audiowide', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 20px rgba(4, 8, 24, 0.28);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .feedback-banner.show {
        opacity: 1;
        transform: translateY(0);
    }

    .feedback-banner.success {
        color: #eafff1;
        border-color: rgba(106, 240, 168, 0.48);
        background: rgba(16, 52, 46, 0.82);
    }

    .feedback-banner.info {
        color: #edf6ff;
        border-color: rgba(132, 246, 255, 0.34);
    }

    .feedback-banner.alert {
        color: #fff2f5;
        border-color: rgba(255, 116, 167, 0.45);
        background: rgba(62, 16, 38, 0.86);
    }

    .gif-toast {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%) scale(0.96);
        width: min(42vw, 180px);
        max-width: 180px;
        padding: 10px;
        border-radius: 18px;
        background: rgba(10, 18, 40, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 28px rgba(3, 8, 24, 0.42);
        opacity: 0;
        transition: opacity 0.24s ease, transform 0.24s ease;
        pointer-events: none;
        z-index: 39;
    }

    .gif-toast.show {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    .gif-toast img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        aspect-ratio: 1 / 1;
        object-fit: cover;
    }

    .gif-label {
        margin-top: 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    @media (max-width: 640px) {
        .start-card {
            padding: 24px 20px;
        }

        .top-bar {
            padding: 12px;
        }

        #morph-menu {
            top: 64px;
            right: 12px;
            width: 176px;
        }

        .feedback-stack {
            top: 78px;
            width: min(100vw - 32px, 280px);
        }

        .gif-toast {
            top: 132px;
            width: min(38vw, 140px);
        }

        #joystick-zone {
            left: 20px;
            bottom: 24px;
        }

        .actions {
            right: 20px;
            bottom: 24px;
            gap: 12px;
        }

        .btn-action {
            width: 60px;
            height: 60px;
        }
    }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="world-ui"></div>

    <div id="ui-layer">
        <div id="start-screen" class="screen-cover">
            <div class="glass-panel start-card">
                <h1 class="title">NEON DINO GROVE</h1>
                <p class="subtitle">Starlight Meetup Meadow</p>
                <div class="identity-panel">
                    <p class="identity-label">Ranger Tag</p>
                    <p class="identity-name" id="player-name-display">GuestDino</p>
                </div>
                <p class="intro-copy">Glide through the glow-grove, swap your dino form, and send out a bright roar or quick chatter.</p>
                <button id="start-btn" class="primary-btn">ENTER GROVE</button>
            </div>
        </div>

        <div id="hud" class="hidden">
            <div class="top-bar">
                <div class="status-pill">🦕 <span id="player-count">12</span> Dinosaurs Nearby</div>
                <button id="menu-toggle" class="menu-btn">FORMS</button>
            </div>

            <!-- [agent-note][stage3] resolved-gif: social/chat toast + roar impact toast from catalogs/gifs.json -->
            <div class="feedback-stack" id="feedback-stack"></div>
            <div class="gif-toast" id="gif-toast">
                <img id="gif-toast-image" alt="reaction animation" decoding="async" loading="eager">
                <div class="gif-label" id="gif-toast-label">Groove Ping</div>
            </div>

            <div id="morph-menu">
                <div class="menu-label">Choose Form</div>
                <div class="morph-card active" data-type="raptor">
                    <div class="morph-name raptor">RAPTOR</div>
                    <div class="morph-desc">Fast scout</div>
                </div>
                <div class="morph-card" data-type="trex">
                    <div class="morph-name trex">T-REX</div>
                    <div class="morph-desc">Big caller</div>
                </div>
                <div class="morph-card" data-type="trike">
                    <div class="morph-name trike">TRIKE</div>
                    <div class="morph-desc">Heavy walker</div>
                </div>
            </div>

            <div class="controls-wrap">
                <div id="joystick-zone">
                    <div id="stick-bg">
                        <div id="stick-handle"></div>
                    </div>
                </div>

                <div class="actions">
                    <button id="btn-chat" class="btn-action btn-chat">💬</button>
                    <button id="btn-roar" class="btn-action btn-roar">ROAR</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* --- 1. Engine & Setup --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const worldUI = document.getElementById('world-ui');

// Config
const CONFIG = {
    fov: 400,
    cameraHeight: 200,
    cameraDist: 300,
    renderDist: 2000
};

// State
let gameState = 'START';
let lastTime = 0;
let entities = [];
let particles = [];
let player = null;
let camera = { x: 0, y: 0, z: 0, ang: 0 };
let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0, id: null };
let input = { x: 0, y: 0 };
let hasStartedAudio = false;
let currentToastTimer = null;
let currentGifTimer = null;
let nextStepAt = 0;

// Names & Chat
const BOT_NAMES = ["RexKing", "DinoLover", "TrikeMike", "RawrXD", "JurassicJoe", "EggThief", "BigFoot", "TinyArms"];
const CHAT_PHRASES = ["Camp by the ferns?", "This grove is huge!", "Watch the rocks!", "Following the trail!", "Nice scales!", "Good roaming spot!", "Echo check!", "Rawr lol"];
const MORPHS = {
    raptor: { speed: 8, scale: 1, color: '#f97316', height: 40, label: "Raptor" },
    trex: { speed: 5, scale: 2.5, color: '#16a34a', height: 90, label: "T-Rex" },
    trike: { speed: 4, scale: 1.8, color: '#3b82f6', height: 50, label: "Trike" }
};

/* --- 2. Catalog-Backed Media --- */
// [agent-note][stage3] resolved-audio: start/menu/chat/roar/step/morph/background loop -> catalogs/audios.json
const MEDIA = {
    fonts: {
        title: 'Audiowide',
        ui: 'Exo 2'
    },
    gifs: {
        chat: {
            label: 'Groove Ping',
            src: 'https://i.giphy.com/bfPYlvbKB4Q1xCczLs.webp'
        },
        roar: {
            label: 'Roar Burst',
            src: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp'
        }
    },
    audio: {
        loop: new Audio('https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'),
        start: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'),
        menuOpen: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3'),
        menuClose: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3'),
        chat: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3'),
        morph: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3'),
        roar: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3'),
        step: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3')
    }
};

Object.values(MEDIA.audio).forEach((audio) => {
    audio.preload = 'auto';
    audio.crossOrigin = 'anonymous';
});

MEDIA.audio.loop.loop = true;
MEDIA.audio.loop.volume = 0.2;
MEDIA.audio.start.volume = 0.45;
MEDIA.audio.menuOpen.volume = 0.34;
MEDIA.audio.menuClose.volume = 0.34;
MEDIA.audio.chat.volume = 0.28;
MEDIA.audio.morph.volume = 0.34;
MEDIA.audio.roar.volume = 0.38;
MEDIA.audio.step.volume = 0.16;

function safePlay(audio, { reset = true } = {}) {
    if (!audio) return;
    try {
        if (reset) audio.currentTime = 0;
        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
        }
    } catch (_) {}
}

function ensureAudioReady() {
    if (hasStartedAudio) return;
    hasStartedAudio = true;
    safePlay(MEDIA.audio.loop, { reset: false });
}

function syncLoopAudio() {
    if (gameState === 'PLAY' && hasStartedAudio) {
        safePlay(MEDIA.audio.loop, { reset: false });
    } else {
        try { MEDIA.audio.loop.pause(); } catch (_) {}
    }
}

function playSfx(type) {
    const audio = MEDIA.audio[type];
    if (!audio) return;
    safePlay(audio);
}

function playStepSound(now) {
    if (now < nextStepAt) return;
    nextStepAt = now + 260;
    playSfx('step');
}

function showToast(message, tone = 'info', duration = 1200) {
    const stack = document.getElementById('feedback-stack');
    const toast = document.createElement('div');
    toast.className = `feedback-banner ${tone}`;
    toast.textContent = message;
    stack.innerHTML = '';
    stack.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add('show'));

    clearTimeout(currentToastTimer);
    currentToastTimer = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            if (stack.contains(toast)) stack.removeChild(toast);
        }, 220);
    }, duration);
}

function showGifToast(kind, duration = 1500) {
    const gifToast = document.getElementById('gif-toast');
    const gifImage = document.getElementById('gif-toast-image');
    const gifLabel = document.getElementById('gif-toast-label');
    const chosen = MEDIA.gifs[kind];
    if (!chosen) return;

    gifImage.src = chosen.src;
    gifLabel.textContent = chosen.label;
    gifToast.classList.add('show');

    clearTimeout(currentGifTimer);
    currentGifTimer = setTimeout(() => {
        gifToast.classList.remove('show');
    }, duration);
}

/* --- 3. Input Handling --- */
const stickHandle = document.getElementById('stick-handle');
const stickBg = document.getElementById('stick-bg');
const joystickZone = document.getElementById('joystick-zone');

joystickZone.addEventListener('pointerdown', e => {
    e.preventDefault();
    const rect = stickBg.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    joystick.active = true;
    joystick.id = e.pointerId;
    joystick.originX = centerX;
    joystick.originY = centerY;
    updateJoystick(e.clientX, e.clientY);
});

document.addEventListener('pointermove', e => {
    if (!joystick.active || e.pointerId !== joystick.id) return;
    updateJoystick(e.clientX, e.clientY);
});

document.addEventListener('pointerup', e => {
    if (e.pointerId !== joystick.id) return;
    joystick.active = false;
    input.x = 0;
    input.y = 0;
    stickHandle.style.transform = 'translate(0px, 0px)';
});

function updateJoystick(clientX, clientY) {
    const maxDist = 40;
    let dx = clientX - joystick.originX;
    let dy = clientY - joystick.originY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }

    stickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / maxDist;
    input.y = dy / maxDist;
}

/* --- 4. Game Logic --- */

class Entity {
    constructor(x, z, type = 'raptor', isBot = false) {
        this.x = x;
        this.y = 0;
        this.z = z;
        this.type = type;
        this.isBot = isBot;
        this.name = isBot ? BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)] : "You";
        this.angle = Math.random() * Math.PI * 2;
        this.morph = MORPHS[type];
        this.animTime = Math.random() * 100;
        this.state = 'IDLE';
        this.stateTimer = 0;
        this.chatTimer = 0;

        this.chatEl = document.createElement('div');
        this.chatEl.className = 'chat-bubble';
        worldUI.appendChild(this.chatEl);
    }

    setMorph(type) {
        this.type = type;
        this.morph = MORPHS[type];
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: this.x, y: 20, z: this.z,
                vx: (Math.random() - 0.5) * 10, vy: Math.random() * 10, vz: (Math.random() - 0.5) * 10,
                life: 1, color: '#fff'
            });
        }
    }

    say(text) {
        this.chatEl.innerText = text;
        this.chatEl.style.opacity = 1;
        this.chatTimer = 180;
        playSfx('chat');
    }

    update(dt) {
        this.animTime += dt * 0.1;
        if (this.chatTimer > 0) {
            this.chatTimer -= dt;
            if (this.chatTimer <= 0) this.chatEl.style.opacity = 0;
        }

        if (this.isBot) {
            this.stateTimer -= dt;
            if (this.stateTimer <= 0) {
                this.state = Math.random() > 0.4 ? 'WALK' : 'IDLE';
                this.stateTimer = 60 + Math.random() * 120;
                this.targetAngle = Math.random() * Math.PI * 2;

                if (Math.random() < 0.1) {
                    this.say(CHAT_PHRASES[Math.floor(Math.random() * CHAT_PHRASES.length)]);
                }
            }

            if (this.state === 'WALK') {
                let diff = this.targetAngle - this.angle;
                if (diff > Math.PI) diff -= Math.PI * 2;
                if (diff < -Math.PI) diff += Math.PI * 2;
                this.angle += diff * 0.05;

                const speed = this.morph.speed * 0.5;
                this.x += Math.sin(this.angle) * speed;
                this.z += Math.cos(this.angle) * speed;
                this.animTime += speed * 0.2;
            }
        } else if (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1) {
            const camAng = Math.atan2(camera.x - this.x, camera.z - this.z);
            const inputAng = Math.atan2(input.x, input.y);
            const targetAng = inputAng + camAng + Math.PI;

            let diff = targetAng - this.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            this.angle += diff * 0.2;

            const speed = this.morph.speed;
            this.x += Math.sin(this.angle) * speed;
            this.z += Math.cos(this.angle) * speed;
            this.animTime += speed * 0.2;
        }

        const LIMIT = 1000;
        if (this.x < -LIMIT) this.x = -LIMIT;
        if (this.x > LIMIT) this.x = LIMIT;
        if (this.z < -LIMIT) this.z = -LIMIT;
        if (this.z > LIMIT) this.z = LIMIT;
    }
}

class Prop {
    constructor(x, z, type) {
        this.x = x;
        this.y = 0;
        this.z = z;
        this.type = type;
        this.scale = 1 + Math.random();
    }
}

function initGame() {
    entities.forEach((ent) => {
        if (ent.chatEl && ent.chatEl.parentNode) ent.chatEl.parentNode.removeChild(ent.chatEl);
    });
    entities = [];
    particles = [];

    player = new Entity(0, 0, 'raptor', false);
    entities.push(player);

    for (let i = 0; i < 8; i++) {
        const types = Object.keys(MORPHS);
        const type = types[Math.floor(Math.random() * types.length)];
        const x = (Math.random() - 0.5) * 1000;
        const z = (Math.random() - 0.5) * 1000;
        entities.push(new Entity(x, z, type, true));
    }

    for (let i = 0; i < 20; i++) {
        const x = (Math.random() - 0.5) * 1800;
        const z = (Math.random() - 0.5) * 1800;
        if (x * x + z * z > 40000) {
            entities.push(new Prop(x, z, Math.random() > 0.3 ? 'tree' : 'rock'));
        }
    }
}

/* --- 5. Rendering (Pseudo 3D) --- */

function project(x, y, z) {
    const rx = x - camera.x;
    const ry = y - camera.y;
    const rz = z - camera.z;

    if (rz <= 10) return null;

    const scale = CONFIG.fov / rz;
    const sx = canvas.width / 2 + rx * scale;
    const sy = canvas.height / 2 - (ry - CONFIG.cameraHeight) * scale;

    return { x: sx, y: sy, scale: scale, dist: rz };
}

function drawShadow(ctx, p, scale) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 20 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawDino(ctx, ent, p) {
    const s = p.scale * ent.morph.scale;
    const c = ent.morph.color;
    const bob = Math.sin(ent.animTime) * 5 * s;
    const bodyY = p.y - 25 * s + bob;
    const legOff = Math.sin(ent.animTime) * 10 * s;
    const crestColor = shadeColor(c, 0.35);
    const bellyColor = shadeColor(c, 0.62);
    const spotColor = shadeColor(c, -0.26);

    drawShadow(ctx, p, s);

    ctx.save();
    ctx.lineWidth = 8 * s;
    ctx.strokeStyle = '#15213f';
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(p.x - 5 * s, p.y - 10 * s);
    ctx.lineTo(p.x - 7 * s, p.y + legOff);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x + 5 * s, p.y - 10 * s);
    ctx.lineTo(p.x + 7 * s, p.y - legOff);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x - 18 * s, bodyY - 1 * s);
    ctx.quadraticCurveTo(p.x - 46 * s, bodyY - 18 * s, p.x - 58 * s, bodyY - 10 * s);
    ctx.quadraticCurveTo(p.x - 44 * s, bodyY + 3 * s, p.x - 26 * s, bodyY + 5 * s);
    ctx.fillStyle = shadeColor(c, -0.18);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(p.x - 8 * s, bodyY + 4 * s, 28 * s, 17 * s, -0.08, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(p.x + 16 * s, bodyY - 14 * s, 16 * s, 12 * s, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = crestColor;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(p.x + 2 * s, bodyY + 7 * s, 16 * s, 7 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = bellyColor;
    ctx.fill();

    ctx.fillStyle = spotColor;
    [
        [p.x - 16 * s, bodyY - 6 * s, 3.2 * s],
        [p.x - 2 * s, bodyY - 10 * s, 2.7 * s],
        [p.x + 12 * s, bodyY - 4 * s, 2.4 * s]
    ].forEach(([x, y, r]) => {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = '#f8feff';
    ctx.beginPath();
    ctx.arc(p.x + 22 * s, bodyY - 17 * s, 3.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#03111f';
    ctx.beginPath();
    ctx.arc(p.x + 23 * s, bodyY - 17 * s, 1.4 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d7fbff';
    ctx.beginPath();
    ctx.moveTo(p.x + 18 * s, bodyY - 2 * s);
    ctx.lineTo(p.x + 25 * s, bodyY);
    ctx.lineTo(p.x + 19 * s, bodyY + 5 * s);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (ent.y === 0) {
        ctx.fillStyle = 'rgba(10, 19, 41, 0.9)';
        ctx.font = `700 ${12 * p.scale}px "Exo 2"`;
        ctx.textAlign = 'center';
        const nameY = bodyY - 40 * s;
        ctx.fillText(ent.name, p.x, nameY);

        if (ent.chatEl) {
            ent.chatEl.style.left = p.x + 'px';
            ent.chatEl.style.top = (nameY - 10) + 'px';
            ent.chatEl.style.transform = `translate(-50%, -100%) scale(${Math.min(1, p.scale)})`;
            ent.chatEl.style.zIndex = Math.floor(1000 - p.dist);
        }
    }
}

function drawProp(ctx, prop, p) {
    const s = p.scale * prop.scale;
    drawShadow(ctx, p, s);

    if (prop.type === 'tree') {
        ctx.fillStyle = '#4f2f45';
        ctx.fillRect(p.x - 5 * s, p.y - 40 * s, 10 * s, 40 * s);

        ctx.fillStyle = '#6ef6b8';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 50 * s, 25 * s, 0, Math.PI * 2);
        ctx.arc(p.x - 15 * s, p.y - 40 * s, 20 * s, 0, Math.PI * 2);
        ctx.arc(p.x + 15 * s, p.y - 40 * s, 20 * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(132, 246, 255, 0.25)';
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.arc(p.x, p.y - 50 * s, 25 * s, 0, Math.PI * 2);
        ctx.stroke();
    } else {
        ctx.fillStyle = '#7f93d9';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 5 * s, 15 * s, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = '#bfd8ff';
        ctx.beginPath();
        ctx.arc(p.x - 3 * s, p.y - 11 * s, 4 * s, 0, Math.PI * 2);
        ctx.fill();
    }
}

function shadeColor(color, percent) {
    const f = parseInt(color.slice(1), 16);
    const t = percent < 0 ? 0 : 255;
    const p = percent < 0 ? percent * -1 : percent;
    const R = f >> 16;
    const G = f >> 8 & 0x00FF;
    const B = f & 0x0000FF;
    return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
}

function draw() {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#091533');
    skyGradient.addColorStop(0.52, '#23144d');
    skyGradient.addColorStop(1, '#382269');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const moonGlow = ctx.createRadialGradient(canvas.width * 0.76, canvas.height * 0.18, 10, canvas.width * 0.76, canvas.height * 0.18, canvas.width * 0.22);
    moonGlow.addColorStop(0, 'rgba(180, 248, 255, 0.85)');
    moonGlow.addColorStop(0.25, 'rgba(180, 248, 255, 0.22)');
    moonGlow.addColorStop(1, 'rgba(180, 248, 255, 0)');
    ctx.fillStyle = moonGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const groundGradient = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
    groundGradient.addColorStop(0, '#1b7c76');
    groundGradient.addColorStop(0.4, '#11545c');
    groundGradient.addColorStop(1, '#0b2730');
    ctx.fillStyle = groundGradient;
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    for (let i = 0; i < 6; i++) {
        const y = canvas.height * (0.55 + i * 0.07);
        ctx.strokeStyle = `rgba(118, 240, 197, ${0.16 - i * 0.02})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    const renderList = [];

    [...entities, ...particles].forEach(ent => {
        const p = project(ent.x, ent.y, ent.z);
        if (p) renderList.push({ ent, p });
    });

    renderList.sort((a, b) => b.p.dist - a.p.dist);

    renderList.forEach(item => {
        if (item.ent instanceof Entity) {
            drawDino(ctx, item.ent, item.p);
        } else if (item.ent instanceof Prop) {
            drawProp(ctx, item.ent, item.p);
        } else {
            const s = item.p.scale;
            ctx.fillStyle = item.ent.color;
            ctx.globalAlpha = item.ent.life;
            ctx.beginPath();
            ctx.arc(item.p.x, item.p.y - item.ent.y * s, 5 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    });
}

function update(dt) {
    const targetCamX = player.x;
    const targetCamZ = player.z - CONFIG.cameraDist;

    camera.x += (targetCamX - camera.x) * 0.1;
    camera.z += (targetCamZ - camera.z) * 0.1;

    entities.forEach(ent => ent.update(dt));

    if (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1) {
        playStepSound(performance.now());
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;
        p.vy -= 0.5;
        if (p.y < 0) {
            p.y = 0;
            p.vy *= -0.5;
        }
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    if (gameState === 'PLAY') {
        update(dt);
        draw();
    }

    requestAnimationFrame(loop);
}

/* --- 6. UI Interaction --- */
const startBtn = document.getElementById('start-btn');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const menuToggle = document.getElementById('menu-toggle');
const morphMenu = document.getElementById('morph-menu');
const btnRoar = document.getElementById('btn-roar');
const btnChat = document.getElementById('btn-chat');

startBtn.addEventListener('click', () => {
    ensureAudioReady();
    startScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    gameState = 'PLAY';
    initGame();
    syncLoopAudio();
    playSfx('start');
    showToast('GROVE LINK LIVE', 'success', 1400);
});

let menuOpen = false;
menuToggle.addEventListener('click', () => {
    ensureAudioReady();
    menuOpen = !menuOpen;
    morphMenu.style.transform = menuOpen ? 'translateX(0)' : 'translateX(120%)';
    playSfx(menuOpen ? 'menuOpen' : 'menuClose');
    showToast(menuOpen ? 'FORM MENU OPEN' : 'FORM MENU CLOSED', 'info', 900);
});

document.querySelectorAll('.morph-card').forEach(card => {
    card.addEventListener('click', () => {
        if (!player) return;
        ensureAudioReady();
        document.querySelectorAll('.morph-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        player.setMorph(card.dataset.type);
        playSfx('morph');
        menuOpen = false;
        morphMenu.style.transform = 'translateX(120%)';
        showToast(`${MORPHS[card.dataset.type].label.toUpperCase()} ONLINE`, 'success', 1200);
    });
});

btnRoar.addEventListener('click', () => {
    if (!player) return;
    ensureAudioReady();
    playSfx('roar');
    player.say("Echo roar!");
    showToast('ROAR BURST', 'alert', 1000);
    showGifToast('roar', 1500);
    for (let i = 0; i < 8; i++) {
        const ang = (Math.PI * 2 / 8) * i;
        particles.push({
            x: player.x, y: 10, z: player.z,
            vx: Math.sin(ang) * 10, vy: 0, vz: Math.cos(ang) * 10,
            life: 1, color: '#fff'
        });
    }
});

btnChat.addEventListener('click', () => {
    if (!player) return;
    ensureAudioReady();
    const phrase = CHAT_PHRASES[Math.floor(Math.random() * CHAT_PHRASES.length)];
    player.say(phrase);
    showToast('CHAT PING', 'info', 900);
    showGifToast('chat', 1300);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        try { MEDIA.audio.loop.pause(); } catch (_) {}
    } else {
        syncLoopAudio();
    }
});

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

requestAnimationFrame(loop);
</script>
