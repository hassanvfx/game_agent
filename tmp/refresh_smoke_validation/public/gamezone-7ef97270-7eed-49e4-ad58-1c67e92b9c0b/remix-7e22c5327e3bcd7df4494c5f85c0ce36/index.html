<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bestie Bento Market Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff7dc;--ink:#3e2b3d;--pink:#ff8fc7;--rose:#ff5f93;--mint:#8effd2;--leaf:#7cc86d;--sky:#aee9ff;--banana:#ffe36e;--lilac:#c7a7ff;--panel:rgba(255,250,230,.88);--shadow:rgba(94,52,82,.22)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fce8b5;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;user-select:none;-webkit-user-select:none}button{font-family:Rajdhani,system-ui,sans-serif;touch-action:manipulation}#game{position:relative;width:100%;height:100%;isolation:isolate;background:linear-gradient(180deg,#bdefff 0%,#fff2bd 47%,#ffc6da 100%)}
#game:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 15% 18%,rgba(255,143,199,.45),transparent 18%),radial-gradient(circle at 86% 22%,rgba(142,255,210,.45),transparent 15%),radial-gradient(circle at 50% 105%,rgba(255,227,110,.45),transparent 34%)}
#skybits{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.cloud,.sticker{position:absolute;opacity:.85;filter:drop-shadow(0 5px 0 rgba(255,255,255,.35))}.cloud{width:110px;height:40px;border-radius:999px;background:#fff;animation:drift 22s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:48px;height:48px;left:18px;top:-19px}.cloud:after{width:62px;height:62px;right:10px;top:-28px}.c1{left:-130px;top:17%;animation-duration:29s}.c2{left:45%;top:9%;transform:scale(.7);animation-duration:36s}.sticker{font-size:32px;animation:bob 3.8s ease-in-out infinite}.s1{left:9%;top:73%}.s2{right:10%;top:68%;animation-delay:.7s}.s3{left:72%;top:35%;animation-delay:1.2s}@keyframes drift{to{transform:translateX(calc(100vw + 190px))}}@keyframes bob{50%{transform:translateY(-10px) rotate(5deg)}}
canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:5}.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0}.stack{display:flex;flex-direction:column;gap:8px}.pill,.panel{background:var(--panel);border:3px solid #fff;border-radius:22px;box-shadow:0 9px 0 var(--shadow),inset 0 2px 0 rgba(255,255,255,.9);backdrop-filter:blur(6px)}.pill{min-width:112px;padding:7px 11px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}.badge{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--banana),#ffad63);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}

h1{margin:0;font-family:Bangers,cursive;font-size:clamp(29px,8vw,52px);line-height:.9;letter-spacing:.03em;color:#ff4e97;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(87,42,90,.18);text-align:right}.tagline{margin-top:4px;font-size:13px;font-weight:800;text-align:right;color:#6d4b6f}.btn{pointer-events:auto;min-height:50px;border:3px solid #fff;border-radius:18px;padding:10px 17px;background:linear-gradient(180deg,#9affdf,#5eda9d);color:#322037;font-weight:900;font-size:18px;box-shadow:0 7px 0 #48a976,0 12px 16px rgba(93,57,76,.22);cursor:pointer}.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #48a976}.btn.bad{background:linear-gradient(180deg,#ff9bbb,#ff5f93);box-shadow:0 7px 0 #c34870}.btn:disabled{filter:grayscale(.45);opacity:.68}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(97,60,88,.22);backdrop-filter:blur(5px);pointer-events:auto}.hidden{display:none!important}.panel{width:min(92vw,390px);max-height:84vh;overflow:auto;padding:20px}.panel h2{font-family:Bangers,cursive;font-size:36px;line-height:1;margin:0 0 8px;color:#ff4e97;text-shadow:2px 2px 0 #fff}.shoprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:12px;border-radius:18px;background:rgba(255,255,255,.58);border:2px dashed rgba(255,95,147,.45)}.small{font-size:14px;font-weight:700;color:#71556f}.close{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;padding:0}.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.86);border:2px solid #fff;font-weight:900;box-shadow:0 5px 0 var(--shadow);opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,-8px)}#gifLayer{position:absolute;inset:0;pointer-events:none;z-index:4}.reaction{position:absolute;width:min(30vw,120px);aspect-ratio:1;object-fit:cover;border-radius:22px;border:3px solid #fff;box-shadow:0 8px 0 var(--shadow);opacity:0;transform:scale(.84);transition:.2s}.reaction.show{opacity:.94;transform:scale(1)}#yay{right:12px;top:110px}#oops{left:12px;bottom:90px}@media(max-width:430px){.hud{padding-left:9px;padding-right:9px}.pill{font-size:19px;min-width:100px}.btn{font-size:16px;padding:9px 13px}h1{font-size:31px}.tagline{font-size:12px}.panel{padding:16px}.panel h2{font-size:32px}}
</style>
</head>
<body>
<div id="game"><div id="skybits"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sticker s1">🌸</div><div class="sticker s2">🍓</div><div class="sticker s3">✨</div></div><canvas id="gameCanvas"></canvas>
<div id="gifLayer"><img id="yay" class="reaction" alt="" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp"><img id="oops" class="reaction" alt="" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"></div>
<div id="ui"><div class="hud"><div class="stack"><div class="pill"><span class="badge">🧾</span><span id="money">0</span></div><div class="pill"><span class="badge">🕘</span><span id="clock">08:00</span></div></div><div class="stack" style="align-items:flex-end"><h1>Bestie Bento<br>Market</h1><div class="tagline">supermarket simulator, real cozy tycoon</div><button id="shopBtn" class="btn">Decorate aisles</button></div></div></div>
<div id="shop" class="overlay hidden"><div class="panel" style="position:relative"><button id="closeShop" class="btn bad close" aria-label="Close shop">×</button><h2>Build more cute racks</h2><div class="small">Spend receipts on new shelves. More racks = more tiny besties shopping.</div><div id="shopItems"></div></div></div>
<div id="end" class="overlay hidden"><div class="panel" style="text-align:center"><h2>Weekend shift slayed</h2><div style="font-family:Bangers;font-size:68px;color:#ffb000;text-shadow:3px 3px 0 #fff">21:00</div><p class="small">The soft girl supermarket closes. Restock the dream tomorrow, bestie.</p><div class="pill" style="justify-content:center;margin:12px auto;width:max-content"><span>Receipts</span><span id="endMoney">$0</span></div><button id="nextDay" class="btn">Next cozy shift</button></div></div><div id="toast" class="toast">real</div>
<audio id="sfx_item" src="https://gamezone-virid.vercel.app/assets/audios/sfx/village_item_01.mp3" preload="auto"></audio><audio id="sfx_pay" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3" preload="auto"></audio><audio id="sfx_oops" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_defeat_01.mp3" preload="auto"></audio>
</div>
<script>

const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let cw=0,ch=0,dpr=devicePixelRatio||1,last=0,gameState='INIT',inited=false;const START=480,END=1260,SPEED=180;const $=id=>document.getElementById(id);const state={money:0,gameTime:START,day:1,player:{x:0,y:0,radius:18,stock:0,maxStock:5,z:0},supply:{x:0,y:0,w:104,h:64,z:20},checkout:{x:0,y:0,w:126,h:82,z:30,money:0},shelves:[],customers:[],floatingTexts:[],joystick:{active:false,origin:{x:0,y:0},current:{x:0,y:0}},renderList:[]};
const sounds={item:$('sfx_item'),pay:$('sfx_pay'),oops:$('sfx_oops')};let audioUnlocked=false;Object.values(sounds).forEach(a=>a.volume=.38);function unlockAudio(){audioUnlocked=true}function sfx(n){if(!audioUnlocked||!sounds[n])return;try{sounds[n].currentTime=0;sounds[n].play().catch(()=>{})}catch(e){}}function fmt(m){const h=Math.floor(m/60),mm=Math.floor(m%60);return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')}function toast(t,kind='yay'){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),900);const img=$(kind==='yay'?'yay':'oops');img.classList.add('show');clearTimeout(img._t);img._t=setTimeout(()=>img.classList.remove('show'),1100)}function vibrate(style='light'){window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}})}
new ResizeObserver(e=>{const r=e[0].contentRect;cw=r.width;ch=r.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!inited&&cw>0&&ch>0){initGame();inited=true;setState('PLAYING');requestAnimationFrame(loop)}else if(inited){if(state.player){state.player.x=Math.max(20,Math.min(cw-20,state.player.x));state.player.y=Math.max(20,Math.min(ch-20,state.player.y))}setupLayout()}}).observe(canvas);
function setupLayout(){state.supply.x=cw/2;state.supply.y=86;state.checkout.x=cw/2;state.checkout.y=ch-98;const startY=184,spacingY=100,col1=cw/2-62,col2=cw/2+62,costs=[0,50,150,300,600,1000];if(!state.shelves.length){for(let i=0;i<6;i++)state.shelves.push({id:i,x:i%2?col2:col1,y:startY+Math.floor(i/2)*spacingY,w:82,h:42,z:25,stock:0,maxStock:4,isBuilt:i===0,cost:costs[i],buildScale:i===0?1:0})}else state.shelves.forEach((s,i)=>{s.x=i%2?col2:col1;s.y=startY+Math.floor(i/2)*spacingY})}
function initGame(){state.money=0;state.gameTime=START;state.day=1;state.player.x=cw/2;state.player.y=ch/2;state.player.stock=0;state.checkout.money=0;state.customers=[];state.floatingTexts=[];state.shelves=[];setupLayout();updateHUD()}function updateHUD(){$('money').textContent=Math.floor(state.money);$('clock').textContent=fmt(state.gameTime)}
function setState(n){gameState=n;$('shop').classList.toggle('hidden',n!=='SHOP');$('end').classList.toggle('hidden',n!=='DAY_END');if(n==='SHOP')renderShop();if(n==='DAY_END'){$('endMoney').textContent='$'+Math.floor(state.money);toast('shift complete, real','yay');vibrate('medium')}}function renderShop(){const box=$('shopItems');box.innerHTML='';state.shelves.forEach((s,i)=>{if(s.isBuilt)return;const can=state.money>=s.cost;const row=document.createElement('div');row.className='shoprow';row.innerHTML=`<div><b>Kidcore rack ${i+1}</b><div class="small">Capacity: ${s.maxStock} bento snacks</div></div><button class="btn" ${can?'':'disabled'}>$${s.cost}</button>`;row.querySelector('button').onclick=()=>{if(!can){sfx('oops');toast('not enough receipts bestie','oops');return}state.money-=s.cost;s.isBuilt=true;sfx('pay');toast('new rack unlocked','yay');vibrate('medium');updateHUD();renderShop()};box.appendChild(row)});if(!box.innerHTML)box.innerHTML='<div class="small" style="text-align:center;padding:18px">All aisles are sparkling and built.</div>'}
function pointer(e){unlockAudio();if(gameState==='SHOP'||gameState==='DAY_END')return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(e.type==='pointerdown'){state.joystick.active=true;state.joystick.origin={x,y};state.joystick.current={x,y}}else if(e.type==='pointermove'&&state.joystick.active)state.joystick.current={x,y};else if(e.type==='pointerup'||e.type==='pointercancel')state.joystick.active=false}['pointerdown','pointermove','pointerup','pointercancel'].forEach(t=>window.addEventListener(t,pointer,{passive:false}));
$('shopBtn').onclick=()=>{unlockAudio();if(gameState==='PLAYING')setState('SHOP')};$('closeShop').onclick=()=>setState('PLAYING');$('nextDay').onclick=()=>{unlockAudio();state.gameTime=START;state.day++;state.customers=[];state.checkout.money=0;setState('PLAYING')};
let actionTimer=0,spawnTimer=0;function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}function update(dt){if(gameState!=='PLAYING')return;state.gameTime+=dt*5;if(state.gameTime>=END){state.gameTime=END;updateHUD();setState('DAY_END');return}updateHUD();if(state.joystick.active){const dx=state.joystick.current.x-state.joystick.origin.x,dy=state.joystick.current.y-state.joystick.origin.y,d=Math.hypot(dx,dy);if(d>5){const f=Math.min(d/40,1),a=Math.atan2(dy,dx),m=SPEED*f*dt;state.player.x=Math.max(20,Math.min(cw-20,state.player.x+Math.cos(a)*m));state.player.y=Math.max(20,Math.min(ch-20,state.player.y+Math.sin(a)*m))}}state.shelves.forEach(s=>{if(s.isBuilt&&s.buildScale<1)s.buildScale=Math.min(1,s.buildScale+dt*3)});actionTimer+=dt;if(actionTimer>.15){actionTimer=0;interact()}updateCustomers(dt);for(let i=state.floatingTexts.length-1;i>=0;i--){const f=state.floatingTexts[i];f.life-=dt;f.y-=30*dt;f.z+=20*dt;if(f.life<=0)state.floatingTexts.splice(i,1)}}
function interact(){const p=state.player;if(dist(p.x,p.y,state.supply.x,state.supply.y)<60){if(p.stock<p.maxStock){p.stock++;sfx('item');vibrate('light')}else{toast('hands full bestie','oops');sfx('oops')}return}for(const s of state.shelves){if(!s.isBuilt)continue;if(dist(p.x,p.y,s.x,s.y)<50){if(p.stock>0&&s.stock<s.maxStock){p.stock--;s.stock++;sfx('item');vibrate('light')}else{toast('rack says no','oops');sfx('oops')}return}}if(dist(p.x,p.y,state.checkout.x,state.checkout.y)<70){if(state.checkout.money>0){const amt=state.checkout.money;state.money+=amt;state.checkout.money=0;updateHUD();floatText(state.checkout.x,state.checkout.y-30,'+$'+amt,'#17a66b');sfx('pay');toast('receipt secured','yay');vibrate('medium')}else sfx('oops')}}
function updateCustomers(dt){const built=state.shelves.filter(s=>s.isBuilt),max=built.length*2;spawnTimer+=dt;if(spawnTimer>2&&state.customers.length<max){spawnTimer=0;if(Math.random()>.3)state.customers.push({x:cw/2+(Math.random()*100-50),y:ch+20,z:0,radius:14,state:'ENTER',target:null,hasItem:false,waitTime:0,hue:Math.random()})}const speed=80;for(let i=state.customers.length-1;i>=0;i--){const c=state.customers[i];if(c.state==='ENTER'){let s=built.find(x=>x.stock>0);if(!s)s=built[Math.floor(Math.random()*built.length)];if(s){c.target={x:s.x,y:s.y+30,shelf:s};c.state='GOTO_SHELF'}else c.state='LEAVE'}if(c.state==='GOTO_SHELF'&&move(c,c.target.x,c.target.y,speed*dt)){c.state='SHOPPING';c.waitTime=1}if(c.state==='SHOPPING'){c.waitTime-=dt;if(c.waitTime<=0){if(c.target.shelf.stock>0){c.target.shelf.stock--;c.hasItem=true;c.target={x:state.checkout.x+(Math.random()*40-20),y:state.checkout.y-30};c.state='GOTO_CHECKOUT'}else c.state='LEAVE'}}if(c.state==='GOTO_CHECKOUT'&&move(c,c.target.x,c.target.y,speed*dt)){c.state='PAYING';c.waitTime=.5}if(c.state==='PAYING'){c.waitTime-=dt;if(c.waitTime<=0){state.checkout.money+=15;c.hasItem=false;c.state='LEAVE'}}if(c.state==='LEAVE'&&move(c,cw/2,ch+30,speed*dt))state.customers.splice(i,1)}}function move(o,tx,ty,step){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=step){o.x=tx;o.y=ty;return true}if(d>0){o.x+=dx/d*step;o.y+=dy/d*step}return false}function floatText(x,y,text,color){state.floatingTexts.push({x,y,text,color,life:1,maxLife:1,z:40})}
function shade(color,p){const n=parseInt(color.slice(1),16),a=Math.round(2.55*p),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,(n>>8&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return'#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1)}function box(x,y,w,h,z,c,r=14){ctx.save();ctx.fillStyle='rgba(94,52,82,.18)';ctx.beginPath();ctx.ellipse(x+7,y+9+z,w*.55,h*.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=shade(c,-18);ctx.beginPath();ctx.roundRect(x-w/2,y-h/2+z,w,h,r);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2-z,w,h,r);ctx.fill();ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.roundRect(x-w/2+5,y-h/2-z+4,w-10,h*.42,r/2);ctx.fill();ctx.restore()}function snack(x,y,z,s=1){ctx.save();ctx.translate(x,y-z);ctx.scale(s,s);ctx.fillStyle='#ffe36e';ctx.beginPath();ctx.roundRect(-7,-7,14,14,4);ctx.fill();ctx.strokeStyle='#d68f31';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ff8fc7';ctx.fillRect(-2,-7,4,14);ctx.restore()}function face(x,y,z,r,c,kind='smile'){ctx.save();const g=ctx.createRadialGradient(x-r*.3,y-z-r*.35,2,x,y-z,r);g.addColorStop(0,shade(c,35));g.addColorStop(1,shade(c,-16));ctx.fillStyle='rgba(94,52,82,.18)';ctx.beginPath();ctx.ellipse(x+5,y+7+z,r,r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-z,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3e2b3d';ctx.beginPath();ctx.arc(x-r*.28,y-z-4,2.2,0,7);ctx.arc(x+r*.28,y-z-4,2.2,0,7);ctx.fill();ctx.strokeStyle='#3e2b3d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-z+2,6,.15,Math.PI-.15);ctx.stroke();ctx.restore()}
function drawBackground(){ctx.fillStyle='#fff5d0';ctx.fillRect(0,0,cw,ch);const grd=ctx.createLinearGradient(0,110,0,ch);grd.addColorStop(0,'#fff9df');grd.addColorStop(1,'#ffd4e7');ctx.fillStyle=grd;ctx.fillRect(0,110,cw,ch-110);ctx.strokeStyle='rgba(255,143,199,.28)';ctx.lineWidth=2;for(let y=130;y<ch;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(cw*.25,y+8,cw*.75,y-8,cw,y);ctx.stroke()}for(let x=20;x<cw;x+=52){ctx.fillStyle='rgba(142,255,210,.22)';ctx.beginPath();ctx.arc(x,148+(x%3)*36,12,0,7);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.72)';ctx.beginPath();ctx.roundRect(18,126,cw-36,ch-166,28);ctx.fill();ctx.strokeStyle='rgba(255,95,147,.25)';ctx.lineWidth=3;ctx.stroke()}function draw(){drawBackground();state.renderList=[];state.renderList.push({type:'supply',y:state.supply.y,obj:state.supply},{type:'checkout',y:state.checkout.y,obj:state.checkout});state.shelves.forEach(s=>{if(s.isBuilt)state.renderList.push({type:'shelf',y:s.y,obj:s})});state.customers.forEach(c=>state.renderList.push({type:'customer',y:c.y,obj:c}));state.renderList.push({type:'player',y:state.player.y,obj:state.player});state.floatingTexts.forEach(f=>state.renderList.push({type:'float',y:f.y,obj:f}));state.renderList.sort((a,b)=>a.y-b.y);state.renderList.forEach(it=>{const o=it.obj;if(it.type==='supply'){box(o.x,o.y,o.w,o.h,o.z,'#ff5f93');ctx.fillStyle='#fff';ctx.font='800 17px Rajdhani';ctx.textAlign='center';ctx.fillText('BENTO STOCK',o.x,o.y-o.z+5);ctx.fillText('🍱',o.x,o.y-o.z-14)}else if(it.type==='checkout'){box(o.x,o.y,o.w,o.h,o.z,'#72d477');ctx.fillStyle='#fff';ctx.font='900 18px Rajdhani';ctx.textAlign='center';ctx.fillText('RECEIPT NEST',o.x,o.y-o.z-4);if(o.money>0){ctx.fillStyle='#ffe36e';ctx.fillText('$'+o.money,o.x,o.y-o.z+18)}}else if(it.type==='shelf'){ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.buildScale,o.buildScale);box(0,0,o.w,o.h,o.z,'#c7a7ff');ctx.fillStyle='#fff';ctx.font='bold 16px Rajdhani';ctx.textAlign='center';ctx.fillText('AISLE',0,-o.z+3);for(let i=0;i<o.stock;i++)snack(-22+i*15,-6,o.z+10);ctx.restore()}else if(it.type==='customer'){face(o.x,o.y,o.z,o.radius,o.hue>.5?'#ffe36e':'#ffb8d8');if(o.hasItem)snack(o.x,o.y-15,o.z+20,.9)}else if(it.type==='player'){face(o.x,o.y,o.z,o.radius,'#63d89b');ctx.save();ctx.strokeStyle='#ff5f93';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y-o.z,o.radius+5,0,7);ctx.stroke();ctx.fillStyle='#ff8fc7';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🎀',o.x,o.y-o.z-o.radius-2);ctx.restore();for(let i=0;i<o.stock;i++)snack(o.x,o.y-21-i*8,o.z+15+i*5,.9)}else if(it.type==='float'){ctx.save();ctx.globalAlpha=o.life/o.maxLife;ctx.font='900 24px Rajdhani';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.fillStyle=o.color;ctx.strokeText(o.text,o.x,o.y-o.z);ctx.fillText(o.text,o.x,o.y-o.z);ctx.restore()}});if(state.joystick.active){ctx.save();ctx.globalAlpha=.24;ctx.fillStyle='#3e2b3d';ctx.beginPath();ctx.arc(state.joystick.origin.x,state.joystick.origin.y,40,0,7);ctx.fill();ctx.globalAlpha=.42;ctx.beginPath();ctx.arc(state.joystick.current.x,state.joystick.current.y,20,0,7);ctx.fill();ctx.restore()}}function loop(t){requestAnimationFrame(loop);if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;try{update(dt);draw()}catch(e){console.error('Loop error:',e)}}
window.__gameQA={state,setState,interact,updateCustomers,update,forceStock(){state.player.x=state.supply.x;state.player.y=state.supply.y;for(let i=0;i<6;i++)interact();return state.player.stock},forceShelf(){const s=state.shelves.find(x=>x.isBuilt);state.player.x=s.x;state.player.y=s.y;for(let i=0;i<6;i++)interact();return s.stock},forceSale(){const s=state.shelves.find(x=>x.isBuilt);s.stock=4;state.customers.push({x:s.x,y:s.y+30,z:0,radius:14,state:'SHOPPING',target:{shelf:s,x:s.x,y:s.y+30},hasItem:false,waitTime:.01,hue:.8});for(let i=0;i<180;i++)updateCustomers(.05);state.player.x=state.checkout.x;state.player.y=state.checkout.y;interact();return state.money},finishDay(){state.gameTime=END-.1;update(.05);return gameState},snapshot(){return{gameState,money:state.money,stock:state.player.stock,shelves:state.shelves.map(s=>({built:s.isBuilt,stock:s.stock})),customers:state.customers.length,time:fmt(state.gameTime)}}};
