<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Button Door Brave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #120914;
      --night: #08030d;
      --violet: #261137;
      --plum: #3e1a4e;
      --thread: #cbb7ff;
      --candle: #ffd789;
      --brave: #79f3e6;
      --danger: #c42155;
      --paper: #fbecdc;
      --panel: rgba(19, 9, 27, 0.78);
      --panel-border: rgba(203, 183, 255, 0.42);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--paper); }
    body { font-family: 'Rajdhani', system-ui, sans-serif; }

    #game-shell { position: fixed; inset: 0; overflow: hidden; background:
      radial-gradient(circle at 50% 13%, rgba(121,243,230,.16), transparent 20%),
      radial-gradient(circle at 50% 75%, rgba(196,33,85,.14), transparent 30%),
      linear-gradient(180deg, #130718 0%, #09030d 58%, #040207 100%); }

    #gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .wallpaper { position: absolute; inset: 0; pointer-events: none; opacity: .7; mix-blend-mode: screen; background-image:
      radial-gradient(circle, rgba(251,236,220,.12) 0 2px, transparent 3px),
      linear-gradient(90deg, transparent 0 47%, rgba(203,183,255,.06) 48% 52%, transparent 53%),
      repeating-linear-gradient(115deg, transparent 0 28px, rgba(203,183,255,.035) 29px 31px);
      background-size: 34px 34px, 90px 90px, 78px 78px; animation: breathe 9s ease-in-out infinite alternate; }
    .thread-web { position: absolute; inset: -5%; pointer-events: none; opacity: .45; background:
      linear-gradient(22deg, transparent 0 49.7%, rgba(203,183,255,.2) 50%, transparent 50.3%),
      linear-gradient(-28deg, transparent 0 49.7%, rgba(121,243,230,.11) 50%, transparent 50.3%),
      radial-gradient(circle at 50% 12%, rgba(255,215,137,.12), transparent 21%); animation: sway 7s ease-in-out infinite alternate; }
    .grain { position: absolute; inset: 0; pointer-events: none; opacity: .16; background-image: repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 0 1px, transparent 1px 4px); mix-blend-mode: overlay; }

    #hud { position: absolute; z-index: 5; left: 0; right: 0; top: 0; padding: max(12px, env(safe-area-inset-top)) 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: none; }
    .chip { min-height: 54px; border: 1px solid var(--panel-border); border-radius: 18px; padding: 8px 10px; background: linear-gradient(180deg, rgba(38,17,55,.78), rgba(11,4,16,.72)); box-shadow: 0 10px 28px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.04); backdrop-filter: blur(9px); }
    .chip:nth-child(2) { text-align: right; }
    .label { display: block; color: rgba(251,236,220,.72); font-size: clamp(11px, 3.2vw, 15px); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
    .value { display: block; color: var(--brave); font-family: 'Cinzel', serif; font-size: clamp(21px, 6vw, 32px); line-height: 1; text-shadow: 0 0 14px rgba(121,243,230,.5); }
    #hint { position: absolute; z-index: 4; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); text-align: center; pointer-events: none; color: rgba(251,236,220,.82); font-size: clamp(14px, 3.8vw, 18px); line-height: 1.15; text-shadow: 0 2px 10px #000; transition: opacity .3s; }
    #toast { position: absolute; z-index: 6; left: 50%; top: 78px; transform: translate(-50%, -8px); min-width: min(82vw, 360px); opacity: 0; pointer-events: none; border: 1px solid rgba(255,215,137,.36); border-radius: 999px; background: rgba(18,9,20,.78); color: var(--candle); text-align: center; padding: 8px 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; transition: opacity .22s, transform .22s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #game-over { position: absolute; z-index: 10; inset: 0; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(4,2,7,.76); backdrop-filter: blur(7px); }
    #game-over.visible { display: flex; }
    .modal { width: min(92vw, 410px); border-radius: 28px; padding: 24px 20px 20px; text-align: center; background:
      radial-gradient(circle at 50% 0%, rgba(196,33,85,.25), transparent 35%),
      linear-gradient(180deg, rgba(43,18,55,.96), rgba(10,4,16,.96)); border: 1px solid rgba(203,183,255,.45); box-shadow: 0 24px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06); }
    .button-mark { width: 74px; height: 74px; margin: 0 auto 12px; border-radius: 50%; background: radial-gradient(circle, #140913 38%, #0a0409 40% 100%); border: 4px solid #2d172d; box-shadow: 0 0 0 5px rgba(251,236,220,.07), 0 0 30px rgba(196,33,85,.34); position: relative; }
    .button-mark::before, .button-mark::after { content: ''; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); top: 28px; box-shadow: 0 0 9px rgba(251,236,220,.4); }
    .button-mark::before { left: 20px; } .button-mark::after { right: 20px; }
    h1 { margin: 0 0 4px; font-family: 'Cinzel', serif; font-size: clamp(34px, 10vw, 52px); line-height: .95; color: var(--paper); text-shadow: 0 0 22px rgba(196,33,85,.48); }
    .modal p { margin: 8px 0 18px; color: rgba(251,236,220,.78); font-size: clamp(16px, 4.4vw, 20px); }
    #restart-btn { width: 100%; min-height: 58px; border: 2px solid rgba(255,215,137,.8); border-radius: 20px; color: #180b12; background: linear-gradient(180deg, #ffe6a8, #d89747); font: 700 clamp(18px, 5vw, 23px) 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: .14em; box-shadow: 0 8px 0 #7a412a, 0 0 30px rgba(255,215,137,.22); cursor: pointer; touch-action: manipulation; }
    #restart-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #7a412a; }

    @keyframes breathe { from { transform: scale(1); filter: hue-rotate(0deg); } to { transform: scale(1.03); filter: hue-rotate(-12deg); } }
    @keyframes sway { from { transform: translateX(-1.5%); } to { transform: translateX(1.5%); } }
    @media (min-aspect-ratio: 10/16) { #hint { bottom: calc(74px + env(safe-area-inset-bottom)); } .chip { min-height: 48px; } }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Button Door Brave game">
    <div class="wallpaper"></div>
    <div class="thread-web"></div>
    <canvas id="gameCanvas"></canvas>
    <div class="grain"></div>
    <section id="hud" aria-live="polite">
      <div class="chip"><span class="label">Doors Sealed</span><span id="score" class="value">0</span></div>
      <div class="chip"><span class="label">Thread Left</span><span id="timer" class="value">30</span></div>
    </section>
    <div id="toast">Charm stitched tight</div>
    <div id="hint">Drag every brave charm onto its matching place before the Other Mother closes the button door.</div>
    <section id="game-over" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <div class="modal">
        <div class="button-mark" aria-hidden="true"></div>
        <h1 id="game-over-title">Door Shut</h1>
        <p>The buttons blinked first. Doors sealed: <strong id="final-score">0</strong></p>
        <button id="restart-btn" type="button">Try the Thread Again</button>
      </div>
    </section>
  </main>

  <audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="none" loop></audio>
  <audio id="sfx_pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="none"></audio>
  <audio id="sfx_success" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="none"></audio>
  <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="none"></audio>
  <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="none"></audio>
  <audio id="sfx_click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="none"></audio>

  <script id="game-config" type="application/json">{"baseTime":{"type":"number","label":"Start Time","value":30,"min":10,"max":60},"timeBonus":{"type":"number","label":"Time Bonus","value":5,"min":1,"max":10}}</script>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const overEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const toastEl = document.getElementById('toast');
    const hintEl = document.getElementById('hint');
    const bgmMain = document.getElementById('bgm_main');
    const audioEls = { pickup: document.getElementById('sfx_pickup'), success: document.getElementById('sfx_success'), fail: document.getElementById('sfx_fail'), gameOver: document.getElementById('sfx_game_over'), click: document.getElementById('sfx_click') };
    const configDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfigDefs = configDefs;
    window.gameConfig = Object.fromEntries(Object.entries(configDefs).map(([k, v]) => [k, v.value]));

    let cw = 0, ch = 0, dpr = 1, initialized = false;
    let gameState = 'PLAYING';
    let totalScore = 0, progressLevel = 0, timeLeft = 30, deathTimer = 0;
    const maxProgress = 4;
    let lastTime = 0, dt = 0, timeAcc = 0, toastTimer = 0;
    let audioUnlocked = false;
    const sfxCooldowns = new Map();
    const actor = { x: 0, y: 0, targetY: 0, baseColor: '#4b5879', bounce: 0, blink: 0, brave: false, trapped: false };
    const items = [], particles = [], redThreads = [], buttons = [];
    let dragItem = null;

    const itemTypes = [
      { type: 'moon-cap', w: 60, h: 70, slot: 'head', name: 'moon cap', color: '#536aa5' },
      { type: 'ember-heart', w: 50, h: 50, slot: 'belly', name: 'ember heart', color: '#c42155' },
      { type: 'key-ribbon', w: 60, h: 30, slot: 'neck', name: 'key ribbon', color: '#e3b768' },
      { type: 'candle', w: 40, h: 90, slot: 'hand', name: 'pocket candle', color: '#ffd789' }
    ];

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      cw = rect.width; ch = rect.height;
      canvas.width = Math.max(1, Math.floor(cw * dpr));
      canvas.height = Math.max(1, Math.floor(ch * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (initialized) {
        if (!['ANIMATING','DYING','GAMEOVER'].includes(gameState)) {
          actor.x = cw / 2; actor.y = ch / 2 - 40; actor.targetY = actor.y;
        }
        clampEntities();
      }
    }

    new ResizeObserver(() => {
      resize();
      if (!initialized && cw && ch) { initialized = true; initGame(); requestAnimationFrame(loop); }
    }).observe(canvas);

    function clampEntities() {
      items.forEach(item => {
        if (!item.placed && !item.dragging) {
          item.x = Math.max(item.w / 2, Math.min(cw - item.w / 2, item.x));
          item.y = Math.max(item.h / 2, Math.min(ch - item.h / 2, item.y));
        }
      });
    }

    function initAudio() {
      try {
        bgmMain.volume = 0.16;
        Object.values(audioEls).forEach(a => { if (a) { a.preload = 'auto'; a.load(); } });
      } catch (_) {}
    }
    function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; initAudio(); startBgm(); }
    function startBgm() { try { bgmMain.volume = 0.16; bgmMain.play().catch(() => {}); } catch (_) {} }
    function stopBgm() { try { bgmMain.pause(); } catch (_) {} }
    function playMediaSfx(key, volume = 0.55, cooldown = 0) {
      if (!audioUnlocked) return;
      const audio = audioEls[key]; if (!audio) return;
      const now = performance.now(); if (cooldown && now - (sfxCooldowns.get(key) || 0) < cooldown) return;
      sfxCooldowns.set(key, now);
      try { audio.pause(); audio.currentTime = 0; audio.volume = volume; audio.play().catch(() => {}); } catch (_) {}
    }
    function vibrate(style) { try { if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? [150,50,150,50,200] : style === 'medium' ? 60 : 20); } catch (_) {} }
    function toast(text) { toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1300); }

    function initGame() {
      totalScore = 0; timeLeft = window.gameConfig.baseTime; scoreEl.textContent = '0'; timerEl.textContent = Math.ceil(timeLeft);
      resetLevel(true); setState('PLAYING'); initAudio(); try { bgmMain.currentTime = 0; } catch (_) {}
      if (audioUnlocked) startBgm(); toast('Find the four brave charms');
    }

    function resetLevel(isFirst = false) {
      actor.x = cw / 2; actor.y = isFirst ? ch / 2 - 40 : ch + 100; actor.targetY = ch / 2 - 40;
      actor.brave = false; actor.trapped = false; actor.bounce = 0; actor.blink = 0;
      actor.baseColor = ['#40577b', '#5b4a75', '#395d63', '#60465f', '#47524d'][Math.floor(Math.random() * 5)];
      progressLevel = 0; particles.length = 0; redThreads.length = 0; items.length = 0;
      const startY = ch - Math.max(82, Math.min(110, ch * .12));
      [...itemTypes].sort(() => Math.random() - .5).forEach((type, i, arr) => {
        const spacingX = cw / (arr.length + 1);
        items.push({ ...type, x: spacingX * (i + 1), y: startY + (i % 2 === 0 ? 15 : -15), baseX: spacingX * (i + 1), baseY: startY + (i % 2 === 0 ? 15 : -15), dragging: false, placed: false, scale: 0, targetScale: 1, rotation: (Math.random() - .5) * .2 });
      });
      seedButtons();
    }

    function seedButtons() {
      buttons.length = 0;
      const count = Math.max(18, Math.floor((cw * ch) / 33000));
      for (let i = 0; i < count; i++) buttons.push({ x: Math.random() * cw, y: Math.random() * ch * .72 + ch * .08, r: 4 + Math.random() * 8, phase: Math.random() * 6.28 });
    }

    function setState(state) {
      gameState = state;
      if (state === 'PLAYING' || state === 'ANIMATING') { overEl.classList.remove('visible'); hintEl.style.opacity = state === 'PLAYING' ? '.92' : '.35'; if (audioUnlocked) startBgm(); }
      else if (state === 'DYING') { deathTimer = 1; hintEl.style.opacity = '0'; playMediaSfx('fail', .5, 500); toast('The button door is closing'); vibrate('medium'); }
      else if (state === 'GAMEOVER') { overEl.classList.add('visible'); finalScoreEl.textContent = totalScore; actor.trapped = true; spawnRedThreads(actor.x, actor.y, 150); playMediaSfx('gameOver', .55, 1000); stopBgm(); vibrate('heavy'); }
    }

    function spawnStitches(x, y, count = 10, color = '#cbb7ff') {
      for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - .5) * 125, vy: (Math.random() - .5) * 105 - 35, life: .85 + Math.random() * .55, color, size: Math.random() * 4 + 2, rot: Math.random() * 6.28, rotSpeed: (Math.random() - .5) * 6 });
    }
    function spawnRedThreads(x, y, count) {
      for (let i = 0; i < count; i++) redThreads.push({ x: x + (Math.random() - .5) * 55, y: y + (Math.random() - .5) * 65, vx: (Math.random() - .5) * 760, vy: (Math.random() - .5) * 760 - 300, size: Math.random() * 7 + 2, life: 3 + Math.random() * 2 });
    }

    function placementZones() {
      return {
        head: { x: actor.x, y: actor.y - 60, r: 60 },
        belly: { x: actor.x, y: actor.y + 30, r: 60 },
        neck: { x: actor.x, y: actor.y - 10, r: 40 },
        hand: { x: actor.x + 45, y: actor.y + 10, r: 50 }
      };
    }

    function checkPlacement(item) {
      const z = placementZones()[item.slot];
      const placed = z && Math.hypot(item.x - z.x, item.y - z.y) < z.r;
      if (placed && !item.placed) {
        item.placed = true; progressLevel++; playMediaSfx('pickup', .42, 90); vibrate('light'); spawnStitches(item.x, item.y, 12, item.slot === 'belly' ? '#ff7894' : '#cbb7ff'); actor.bounce = 15; toast(item.name + ' stitched tight');
        if (progressLevel >= maxProgress) { actor.brave = true; playMediaSfx('success', .58, 400); vibrate('medium'); spawnStitches(actor.x, actor.y, 28, '#79f3e6'); setState('ANIMATING'); }
      } else { item.targetScale = 1; toast('Wrong stitch — try another place'); }
    }

    function update(time) {
      dt = Math.min((time - lastTime) / 1000 || 0, .05); lastTime = time; timeAcc += dt;
      if (actor.bounce > 0) actor.bounce += (0 - actor.bounce) * 15 * dt;
      if (gameState === 'PLAYING') { timeLeft -= dt; timerEl.textContent = Math.max(0, Math.ceil(timeLeft)); actor.y += (actor.targetY - actor.y) * 10 * dt; if (timeLeft <= 0) setState('DYING'); }
      else if (gameState === 'DYING') { deathTimer -= dt; actor.x = cw / 2 + (Math.random() - .5) * 40; actor.y = ch / 2 - 40 + (Math.random() - .5) * 40; if (deathTimer <= 0) setState('GAMEOVER'); }
      else if (gameState === 'ANIMATING') { actor.y -= 300 * dt; if (actor.y < -150) { totalScore++; scoreEl.textContent = totalScore; timeLeft += window.gameConfig.timeBonus; resetLevel(false); setState('PLAYING'); } }

      items.forEach((item, idx) => {
        item.scale += (item.targetScale - item.scale) * 15 * dt;
        if (item.dragging) item.rotation += (Math.sin(timeAcc * 15) * .1 - item.rotation) * 10 * dt;
        else if (!item.placed) { const ty = item.baseY + Math.sin(timeAcc * 2 + idx) * 4; item.x += (item.baseX - item.x) * 10 * dt; item.y += (ty - item.y) * 10 * dt; item.rotation += (Math.sin(timeAcc * 1.5 + idx) * .05 - item.rotation) * 5 * dt; }
        else { let tx = actor.x, ty = actor.y; if (item.slot === 'head') ty -= 65; else if (item.slot === 'belly') ty += 30; else if (item.slot === 'neck') ty -= 10; else if (item.slot === 'hand') { tx += 45; ty += 10; } item.x = tx; item.y = ty - actor.bounce; item.rotation += (0 - item.rotation) * 15 * dt; }
      });
      actor.blink += dt; if (actor.blink > 3 + Math.random() * 2) actor.blink = 0;
      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt; p.rot += p.rotSpeed * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
      for (let i = redThreads.length - 1; i >= 0; i--) { const p = redThreads[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1800 * dt; p.life -= dt; if (p.life <= 0 || p.y > ch + 100) redThreads.splice(i, 1); }
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(cw/2, ch*.22, 10, cw/2, ch*.45, Math.max(cw,ch));
      g.addColorStop(0, '#33204c'); g.addColorStop(.42, '#1a0b25'); g.addColorStop(1, '#050207'); ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
      ctx.save();
      ctx.globalAlpha = .72; ctx.strokeStyle = 'rgba(203,183,255,.16)'; ctx.lineWidth = 1;
      for (let x = -40; x < cw + 40; x += 38) { ctx.beginPath(); ctx.moveTo(x + Math.sin(timeAcc + x) * 3, 0); ctx.bezierCurveTo(x + 22, ch*.25, x - 18, ch*.55, x + 5, ch); ctx.stroke(); }
      buttons.forEach(b => { const pulse = .7 + Math.sin(timeAcc * 1.4 + b.phase) * .25; ctx.fillStyle = `rgba(9,4,12,${.55*pulse})`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill(); ctx.fillStyle = `rgba(251,236,220,${.22*pulse})`; ctx.beginPath(); ctx.arc(b.x - b.r*.25, b.y, Math.max(1.2, b.r*.18), 0, 6.28); ctx.arc(b.x + b.r*.25, b.y, Math.max(1.2, b.r*.18), 0, 6.28); ctx.fill(); });
      ctx.restore();
      const floor = ctx.createLinearGradient(0, ch*.56, 0, ch); floor.addColorStop(0, 'rgba(44,24,40,0)'); floor.addColorStop(1, 'rgba(44,24,40,.86)'); ctx.fillStyle = floor; ctx.fillRect(0, ch*.42, cw, ch*.58);
      ctx.strokeStyle = 'rgba(255,215,137,.13)'; for (let i = 1; i < 5; i++) { const y = ch * (.58 + i*.075); ctx.beginPath(); ctx.moveTo(cw*.08, y); ctx.quadraticCurveTo(cw*.5, y - 20, cw*.92, y); ctx.stroke(); }
      drawDoor();
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0,0,cw,ch);
    }

    function drawDoor() {
      const w = Math.min(170, cw*.36), h = Math.min(250, ch*.32), x = cw/2 - w/2, y = ch*.16;
      ctx.save(); ctx.globalAlpha = .74;
      ctx.fillStyle = 'rgba(31,13,39,.72)'; roundRect(x, y, w, h, 36); ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,137,.23)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = 'rgba(6,3,8,.75)'; ctx.beginPath(); ctx.arc(cw/2, y + h*.44, 34 + Math.sin(timeAcc*1.5)*2, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(251,236,220,.62)'; [[-10,-5],[10,-5],[-10,12],[10,12]].forEach(([dx,dy]) => { ctx.beginPath(); ctx.arc(cw/2+dx, y+h*.44+dy, 3, 0, 6.28); ctx.fill(); });
      ctx.restore();
    }

    function drawActor() {
      ctx.save(); ctx.translate(actor.x, actor.y - actor.bounce);
      const aura = ctx.createRadialGradient(0, -8, 8, 0, -8, 130); aura.addColorStop(0, actor.brave ? 'rgba(121,243,230,.34)' : 'rgba(203,183,255,.22)'); aura.addColorStop(.62, 'rgba(121,243,230,.07)'); aura.addColorStop(1, 'rgba(121,243,230,0)'); ctx.fillStyle = aura; ctx.beginPath(); ctx.ellipse(0, 0, 110, 150, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(0, 108, 72, 18, 0, 0, 6.28); ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 12;
      ctx.fillStyle = actor.baseColor; ctx.beginPath(); ctx.ellipse(0, 32, 46, 62, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#2d2542'; ctx.beginPath(); ctx.moveTo(-35, -44); ctx.quadraticCurveTo(0, -85, 35, -44); ctx.quadraticCurveTo(18, -58, 0, -58); ctx.quadraticCurveTo(-18, -58, -35, -44); ctx.fill();
      ctx.fillStyle = actor.baseColor; ctx.beginPath(); ctx.ellipse(-45, 20, 14, 27, .45, 0, 6.28); ctx.ellipse(45, 20, 14, 27, -.45, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-24, 86, 19, 14, 0, 0, 6.28); ctx.ellipse(24, 86, 19, 14, 0, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -20, 45, 0, 6.28); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(251,236,220,.45)'; ctx.lineWidth = 2; for (let y = 2; y < 55; y += 14) { ctx.beginPath(); ctx.moveTo(-12, y); ctx.lineTo(12, y + 7); ctx.stroke(); }
      if (actor.trapped) { ctx.strokeStyle = '#090409'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-28,-34); ctx.lineTo(-10,-16); ctx.moveTo(-10,-34); ctx.lineTo(-28,-16); ctx.moveTo(10,-34); ctx.lineTo(28,-16); ctx.moveTo(28,-34); ctx.lineTo(10,-16); ctx.stroke(); ctx.beginPath(); ctx.arc(0,-5,14,Math.PI*1.1,Math.PI*1.9); ctx.stroke(); }
      else if (gameState === 'DYING') { drawButtonEye(-19,-25,11,'#c42155'); drawButtonEye(19,-25,11,'#c42155'); ctx.fillStyle = '#090409'; ctx.beginPath(); ctx.ellipse(0,-4,10,16,0,0,6.28); ctx.fill(); }
      else { if (actor.blink < .15 && !actor.brave) { ctx.strokeStyle = '#090409'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-27,-25); ctx.lineTo(-11,-25); ctx.moveTo(11,-25); ctx.lineTo(27,-25); ctx.stroke(); } else { drawButtonEye(-19,-25,10,'#080408'); drawButtonEye(19,-25,10,'#080408'); } ctx.strokeStyle = '#090409'; ctx.lineWidth = 3; ctx.beginPath(); actor.brave ? ctx.arc(0,-12,13,0,Math.PI,false) : (ctx.moveTo(-8,-12), ctx.lineTo(8,-12)); ctx.stroke(); }
      ctx.restore();
    }

    function drawButtonEye(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill(); ctx.fillStyle = 'rgba(251,236,220,.74)'; ctx.beginPath(); ctx.arc(x-r*.28,y,2,0,6.28); ctx.arc(x+r*.28,y,2,0,6.28); ctx.fill(); }

    function drawItem(item) {
      if (item.scale <= .01) return;
      ctx.save(); ctx.translate(item.x, item.y); ctx.rotate(item.rotation); ctx.scale(item.scale, item.scale);
      ctx.fillStyle = item.placed ? 'rgba(121,243,230,.18)' : 'rgba(255,215,137,.12)'; ctx.beginPath(); ctx.arc(0, 0, Math.max(item.w,item.h)*.44, 0, 6.28); ctx.fill();
      ctx.shadowColor = item.dragging ? 'rgba(121,243,230,.55)' : 'rgba(0,0,0,.55)'; ctx.shadowBlur = item.dragging ? 22 : 13; ctx.shadowOffsetY = item.dragging ? 14 : 8; ctx.fillStyle = item.color;
      if (item.type === 'moon-cap') { ctx.beginPath(); ctx.moveTo(0,-34); ctx.quadraticCurveTo(30,0,20,27); ctx.quadraticCurveTo(0,17,-22,27); ctx.quadraticCurveTo(-30,0,0,-34); ctx.fill(); ctx.fillStyle = '#f6e4ac'; ctx.beginPath(); ctx.arc(5,-18,9,0,6.28); ctx.fill(); }
      else if (item.type === 'ember-heart') { ctx.beginPath(); ctx.moveTo(0,18); ctx.bezierCurveTo(-28,-9,-25,-28,0,-20); ctx.bezierCurveTo(25,-28,28,-9,0,18); ctx.fill(); ctx.strokeStyle = '#170712'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(10,6); ctx.moveTo(-5,-10); ctx.lineTo(-5,1); ctx.moveTo(5,0); ctx.lineTo(5,11); ctx.stroke(); }
      else if (item.type === 'key-ribbon') { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-28,-16); ctx.lineTo(-28,16); ctx.closePath(); ctx.moveTo(0,0); ctx.lineTo(28,-16); ctx.lineTo(28,16); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#1a0b16'; ctx.fillRect(-4,-23,8,46); ctx.beginPath(); ctx.arc(0,-28,9,0,6.28); ctx.fill(); }
      else if (item.type === 'candle') { ctx.fillStyle = '#f2dfbc'; roundRect(-7,-24,14,62,5); ctx.fill(); ctx.fillStyle = '#ffd789'; ctx.beginPath(); ctx.moveTo(0,-45); ctx.quadraticCurveTo(14,-25,0,-18); ctx.quadraticCurveTo(-12,-27,0,-45); ctx.fill(); ctx.fillStyle = '#c42155'; ctx.fillRect(-6,10,12,4); }
      ctx.restore();
    }

    function drawEffects() {
      particles.forEach(p => { ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-p.size,0); ctx.lineTo(p.size,0); ctx.moveTo(0,-p.size); ctx.lineTo(0,p.size); ctx.stroke(); ctx.restore(); });
      ctx.fillStyle = '#c42155'; redThreads.forEach(p => { ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 3)); ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.28); ctx.fill(); }); ctx.globalAlpha = 1;
    }

    function draw() { drawBackground(); drawActor(); items.filter(i => i.placed).forEach(drawItem); items.filter(i => !i.placed && !i.dragging).forEach(drawItem); items.filter(i => i.dragging).forEach(drawItem); drawEffects(); }
    function loop(time) { try { update(time); draw(); } finally { requestAnimationFrame(loop); } }

    function getPointerPos(e) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
    function handleInput(e) {
      unlockAudio(); e.preventDefault(); const pos = getPointerPos(e); if (gameState !== 'PLAYING') return;
      if (e.type === 'pointerdown') { for (let i = items.length - 1; i >= 0; i--) { const item = items[i]; if (item.placed) continue; if (Math.abs(pos.x - item.x) < item.w && Math.abs(pos.y - item.y) < item.h) { dragItem = item; item.dragging = true; item.targetScale = 1.2; playMediaSfx('click', .32, 70); vibrate('light'); items.push(items.splice(i,1)[0]); break; } } }
      else if ((e.type === 'pointerup' || e.type === 'pointercancel') && dragItem) { dragItem.dragging = false; checkPlacement(dragItem); dragItem = null; }
      else if (e.type === 'pointermove' && dragItem) { dragItem.x = pos.x; dragItem.y = pos.y - 40; }
    }
    function restartGame() { initGame(); }
    function roundRect(x,y,w,h,r) { const rr = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', e => { e.stopPropagation(); unlockAudio(); playMediaSfx('click', .34, 120); toast('Thread rewound'); restartGame(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopBgm(); else if (audioUnlocked && gameState !== 'GAMEOVER') startBgm(); });
    window.updateGameConfig = (key, val) => { if (configDefs[key]) window.gameConfig[key] = configDefs[key].type === 'number' ? parseFloat(val) : val; };
    window.__gameDebug = { get state() { return { gameState, totalScore, progressLevel, timeLeft, itemCount: items.length, cw, ch, actor: { x: actor.x, y: actor.y }, items: items.map(i => ({ type: i.type, slot: i.slot, x: i.x, y: i.y, placed: i.placed })) }; }, completeFirstItem() { const item = items.find(i => !i.placed); if (!item) return false; const z = placementZones()[item.slot]; item.x = z.x; item.y = z.y; checkPlacement(item); return true; }, completeSet() { [...items].filter(i => !i.placed).forEach(i => { const z = placementZones()[i.slot]; i.x = z.x; i.y = z.y; checkPlacement(i); }); return true; }, forceTimeout() { timeLeft = .05; return true; }, restart: restartGame };
  })();
  </script>
</body>
