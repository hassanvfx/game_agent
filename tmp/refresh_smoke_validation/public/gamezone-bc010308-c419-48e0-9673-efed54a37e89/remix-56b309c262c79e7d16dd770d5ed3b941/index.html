<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cursed Plushie Ritual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
  <style>
    :root {
      --bg-core: #06010d;
      --bg-glow: #26103f;
      --panel-bg: rgba(13, 8, 24, 0.9);
      --panel-border: rgba(195, 93, 255, 0.72);
      --panel-highlight: rgba(107, 232, 255, 0.42);
      --text-main: #f7efff;
      --text-muted: #b7a7cf;
      --ritual-pink: #ff67c8;
      --ritual-cyan: #76f7ff;
      --ritual-gold: #ffd36f;
      --danger: #ff4066;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(118, 247, 255, 0.08), transparent 28%),
        radial-gradient(circle at bottom, rgba(255, 103, 200, 0.12), transparent 34%),
        linear-gradient(180deg, #14071d 0%, #08030f 45%, #030107 100%);
      color: var(--text-main);
      font-family: 'Exo 2', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 211, 111, 0.1), transparent 18%),
        radial-gradient(circle at 80% 22%, rgba(118, 247, 255, 0.08), transparent 16%),
        radial-gradient(circle at 50% 78%, rgba(255, 103, 200, 0.1), transparent 20%);
      opacity: 0.9;
    }

    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }

    .noir-ui {
      font-family: 'Exo 2', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .title-ritual {
      font-family: 'Creepster', cursive;
      letter-spacing: 0.12em;
      text-shadow: 0 0 12px rgba(255, 103, 200, 0.45), 0 0 28px rgba(118, 247, 255, 0.22);
    }

    .noir-panel {
      background:
        linear-gradient(180deg, rgba(35, 16, 58, 0.9), rgba(11, 7, 20, 0.94));
      border: 1px solid var(--panel-border);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 18px rgba(118, 247, 255, 0.14),
        0 0 22px rgba(195, 93, 255, 0.18);
      position: relative;
      backdrop-filter: blur(10px);
      border-radius: 16px;
    }

    .noir-panel::after {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 14px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .text-blood {
      color: var(--ritual-pink);
      text-shadow: 0 0 8px rgba(255, 103, 200, 0.55);
    }

    .text-ash {
      color: var(--text-muted);
    }

    .hud-value {
      color: var(--ritual-cyan);
      text-shadow: 0 0 10px rgba(118, 247, 255, 0.55);
    }

    .btn-noir {
      background: linear-gradient(180deg, rgba(37, 17, 57, 0.95), rgba(16, 9, 27, 0.95));
      border: 2px solid var(--ritual-pink);
      border-radius: 14px;
      color: var(--text-main);
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1), background 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 0 5px rgba(255,103,200,0.35);
      box-shadow: 0 0 16px rgba(255, 103, 200, 0.18);
    }

    .btn-noir:active {
      background: linear-gradient(180deg, rgba(255, 103, 200, 0.95), rgba(150, 57, 121, 0.95));
      color: #120414;
      transform: scale(0.97);
      box-shadow: 0 0 18px rgba(255, 103, 200, 0.45);
    }

    .hud-chip {
      min-width: 128px;
    }

    .ornament {
      position: absolute;
      border-radius: 999px;
      filter: blur(0.5px);
      opacity: 0.9;
      pointer-events: none;
    }

    .ornament.skull {
      font-size: 18px;
      text-shadow: 0 0 10px rgba(255, 103, 200, 0.6);
      animation: floatGlyph 3s ease-in-out infinite;
    }

    .ornament.spark {
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, rgba(255, 211, 111, 0.95), rgba(255, 211, 111, 0));
      animation: pulseSpark 1.8s ease-in-out infinite;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15)),
        linear-gradient(90deg, rgba(118, 247, 255, 0.03), transparent 18%, rgba(255, 103, 200, 0.03));
      background-size: 100% 4px, 100% 100%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.28;
      mix-blend-mode: screen;
    }

    .feedback-gif {
      position: absolute;
      right: 0.75rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      width: min(34vw, 128px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 24px rgba(118, 247, 255, 0.18);
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
      z-index: 55;
      background: rgba(8, 4, 14, 0.78);
      padding: 0.3rem;
      backdrop-filter: blur(8px);
    }

    .feedback-gif.visible {
      opacity: 0.96;
      transform: translateY(0) scale(1);
    }

    .feedback-gif img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
    }

    .feedback-gif-label {
      margin-top: 0.3rem;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-align: center;
      color: var(--text-main);
    }

    @keyframes floatGlyph {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.55; }
      50% { transform: translateY(-8px) scale(1.08); opacity: 1; }
    }

    @keyframes pulseSpark {
      0%, 100% { transform: scale(0.7); opacity: 0.2; }
      50% { transform: scale(1.3); opacity: 0.9; }
    }

    @media (max-width: 520px) {
      #hud {
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }

      .noir-panel {
        border-radius: 14px;
      }

      .hud-chip {
        min-width: 110px;
      }

      .noir-ui {
        letter-spacing: 0.12em;
      }

      .feedback-gif {
        width: min(38vw, 108px);
        right: 0.5rem;
        bottom: calc(0.75rem + env(safe-area-inset-bottom));
      }

      .feedback-gif-label {
        font-size: 0.54rem;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="scanline"></div>
    <div class="ornament skull" style="top: 12%; left: 8%;">💀</div>
    <div class="ornament skull" style="top: 18%; right: 10%; animation-delay: 0.9s;">🕯️</div>
    <div class="ornament skull" style="bottom: 22%; left: 12%; animation-delay: 1.4s;">🪡</div>
    <div class="ornament spark" style="top: 20%; left: 30%;"></div>
    <div class="ornament spark" style="top: 28%; right: 28%; animation-delay: 0.5s;"></div>
    <div class="ornament spark" style="bottom: 18%; right: 16%; animation-delay: 0.95s;"></div>
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between">
      
      <div id="hud" class="w-full px-4 pt-8 flex justify-between items-start transition-opacity duration-300">
        <div class="noir-panel hud-chip px-4 py-2 noir-ui pointer-events-auto">
          <span class="text-ash font-bold text-base sm:text-lg">RITUALS: <span id="score" class="hud-value text-lg sm:text-xl">0</span></span>
        </div>
        <div class="noir-panel hud-chip px-4 py-2 noir-ui pointer-events-auto text-right">
          <span class="text-ash font-bold text-base sm:text-lg">TIME: <span id="timer" class="hud-value text-lg sm:text-xl">30</span></span>
        </div>
      </div>

      <div id="game-over-screen" class="absolute inset-0 bg-black/80 flex items-center justify-center pointer-events-auto backdrop-blur-sm hidden">
        <div class="noir-panel p-6 sm:p-8 text-center max-w-sm mx-4 transform scale-100 w-full">
          <div class="title-ritual text-4xl mb-2">☠</div>
          <h2 class="text-4xl font-bold text-blood mb-2 title-ritual">RITUAL BROKEN</h2>
          <p class="text-ash mb-8 text-base sm:text-lg noir-ui font-semibold">Plushies restored: <span id="final-score" class="text-blood text-2xl font-bold">0</span></p>
          <button id="restart-btn" class="btn-noir font-bold py-4 px-8 text-lg sm:text-xl noir-ui tracking-wide w-full">
            RETRY RITUAL
          </button>
        </div>
      </div>

      <!-- [agent-note][stage3] resolved-gif: success/fail reaction overlays -> catalogs/gifs.json -->
      <div id="success-gif" class="feedback-gif" aria-hidden="true">
        <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Success reaction">
        <div class="feedback-gif-label noir-ui">RITUAL LOCKED IN</div>
      </div>
      <div id="fail-gif" class="feedback-gif" aria-hidden="true">
        <img src="https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp" alt="Fail reaction">
        <div class="feedback-gif-label noir-ui">CURSE BACKFIRED</div>
      </div>
    </div>
  </div>

  <!-- [agent-note][stage3] resolved-audio: bgm/sfx mapped to catalogs/audios.json -->
  <audio id="bgm_main" data-editable="audio" data-label="Ambient Ritual Loop" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3" preload="none" loop></audio>
  <audio id="sfx_pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="none"></audio>
  <audio id="sfx_success" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="none"></audio>
  <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="none"></audio>
  <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="none"></audio>
  <audio id="sfx_click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="none"></audio>

  <script id="game-config" type="application/x-game-config">
    {
      "baseTime": {"type": "number", "label": "Start Time", "value": 30, "min": 10, "max": 60},
      "timeBonus": {"type": "number", "label": "Time Bonus", "value": 5, "min": 1, "max": 10}
    }
  </script>

  <script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let cw, ch, dpr;
    let gameState = 'PLAYING'; // PLAYING, ANIMATING, DYING, GAMEOVER
    let initialized = false;
    let bgmMain = document.getElementById('bgm_main');
    const audioEls = {
      pickup: document.getElementById('sfx_pickup'),
      success: document.getElementById('sfx_success'),
      fail: document.getElementById('sfx_fail'),
      gameOver: document.getElementById('sfx_game_over'),
      click: document.getElementById('sfx_click')
    };
    const sfxCooldowns = new Map();
    let audioUnlocked = false;
    let activeGifTimer = 0;
    
    const configScript = document.getElementById('game-config');
    const configDefs = JSON.parse(configScript.textContent);
    window.gameConfigDefs = configDefs;
    window.gameConfig = {};
    for (let k in configDefs) window.gameConfig[k] = configDefs[k].value;
    
    let totalScore = 0;
    let progressLevel = 0;
    const maxProgress = 4;
    let timeLeft = 30;
    let deathTimer = 0;
    
    let lastTime = 0;
    let dt = 0;
    let timeAcc = 0;
    
    const plushie = { 
      x: 0, y: 0, targetY: 0, baseColor: '#444',
      bounce: 0, blink: 0, isHappy: false, isDead: false
    };
    const items = [];
    const particles = [];
    const bloodParticles = [];
    
    const itemTypes = [
      { type: 'hat', w: 60, h: 70, slot: 'head', name: 'hat', color: '#333' },
      { type: 'heart', w: 50, h: 50, slot: 'belly', name: 'heart', color: '#500' },
      { type: 'bowtie', w: 60, h: 30, slot: 'neck', name: 'bowtie', color: '#222' },
      { type: 'wand', w: 40, h: 90, slot: 'hand', name: 'wand', color: '#554' }
    ];
    
    function resize(width, height) {
      const rect = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      cw = rect.width;
      ch = rect.height;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      
      if (initialized) {
        if (gameState !== 'ANIMATING' && gameState !== 'DYING' && gameState !== 'GAMEOVER') {
          plushie.x = cw / 2;
          plushie.y = ch / 2 - 40;
          plushie.targetY = plushie.y;
        }
        clampEntities();
      }
    }
    
    const ro = new ResizeObserver((entries) => {
      for (let entry of entries) {
        resize(entry.contentRect.width, entry.contentRect.height);
        if (!initialized) {
          initialized = true;
          initGame();
          requestAnimationFrame(loop);
        }
      }
    });
    ro.observe(canvas);
    
    function clampEntities() {
      items.forEach(item => {
        if (!item.placed && !item.dragging) {
          item.x = Math.max(item.w/2, Math.min(cw - item.w/2, item.x));
          item.y = Math.max(item.h/2, Math.min(ch - item.h/2, item.y));
        }
      });
    }
    
    function initAudio() {
      try {
        bgmMain.volume = 0.2;
        Object.values(audioEls).forEach((audio) => {
          if (!audio) return;
          audio.preload = 'auto';
          audio.load();
        });
      } catch(e) {}
    }
    
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      initAudio();
      startBgm();
    }

    function startBgm() {
      try {
        bgmMain.volume = 0.2;
        bgmMain.play().catch(()=>{});
      } catch(e) {}
    }

    function stopBgm() {
      try {
        bgmMain.pause();
      } catch(e) {}
    }

    function playMediaSfx(key, volume = 0.6, cooldown = 0) {
      if (!audioUnlocked) return;
      const audio = audioEls[key];
      if (!audio) return;
      const now = performance.now();
      if (cooldown && now - (sfxCooldowns.get(key) || 0) < cooldown) return;
      sfxCooldowns.set(key, now);
      try {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = volume;
        audio.play().catch(()=>{});
      } catch(e) {}
    }

    function showFeedbackGif(kind) {
      const successGif = document.getElementById('success-gif');
      const failGif = document.getElementById('fail-gif');
      [successGif, failGif].forEach((el) => el?.classList.remove('visible'));
      clearTimeout(activeGifTimer);
      const target = kind === 'success' ? successGif : failGif;
      if (!target) return;
      target.classList.add('visible');
      activeGifTimer = window.setTimeout(() => {
        target.classList.remove('visible');
      }, kind === 'success' ? 1600 : 1900);
    }
    
    function vibrate(style) {
      try {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
          action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style: style }
        });
      } catch(e) {}
      if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? [150, 50, 150, 50, 200] : style === 'medium' ? 60 : 20);
    }
    
    function initGame() {
      totalScore = 0;
      timeLeft = gameConfig.baseTime;
      document.getElementById('score').textContent = totalScore;
      document.getElementById('timer').textContent = Math.ceil(timeLeft);
      
      resetLevel(true);
      setState('PLAYING');
      initAudio();
      bgmMain.currentTime = 0;
      if (audioUnlocked) startBgm();
      showFeedbackGif('success');
    }
    
    function resetLevel(isFirst = false) {
      plushie.x = cw / 2;
      plushie.y = isFirst ? ch / 2 - 40 : ch + 100;
      plushie.targetY = ch / 2 - 40;
      plushie.isHappy = false;
      plushie.isDead = false;
      plushie.bounce = 0;
      
      const colors = ['#4a4a4a', '#5c4b4b', '#4b5c54', '#3d3d4a', '#525244'];
      plushie.baseColor = colors[Math.floor(Math.random() * colors.length)];
      
      progressLevel = 0;
      particles.length = 0;
      bloodParticles.length = 0;
      items.length = 0;
      
      const startY = ch - 100;
      
      let types = [...itemTypes].sort(() => Math.random() - 0.5);
      
      types.forEach((type, i) => {
        const spacingX = cw / (types.length + 1);
        items.push({
          ...type,
          x: spacingX * (i + 1),
          y: startY + (i % 2 === 0 ? 15 : -15),
          baseX: spacingX * (i + 1),
          baseY: startY + (i % 2 === 0 ? 15 : -15),
          dragging: false,
          placed: false,
          scale: 0,
          targetScale: 1,
          rotation: (Math.random() - 0.5) * 0.2
        });
      });
    }
    
    function setState(state) {
      gameState = state;
      const hud = document.getElementById('hud');
      const over = document.getElementById('game-over-screen');
      
      if (state === 'PLAYING' || state === 'ANIMATING') {
        hud.style.opacity = '1';
        over.classList.add('hidden');
        if (audioUnlocked) startBgm();
      } else if (state === 'DYING') {
        hud.style.opacity = '0';
        deathTimer = 1.0;
        playMediaSfx('fail', 0.5, 500);
        showFeedbackGif('fail');
        vibrate('medium');
      } else if (state === 'GAMEOVER') {
        over.classList.remove('hidden');
        document.getElementById('final-score').textContent = totalScore;
        plushie.isDead = true;
        spawnBlood(plushie.x, plushie.y, 150);
        playMediaSfx('gameOver', 0.55, 1000);
        showFeedbackGif('fail');
        stopBgm();
        vibrate('heavy');
      }
    }
    
    function spawnAsh(x, y) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 100,
          vy: (Math.random() - 0.5) * 100 - 30,
          life: 1.0 + Math.random() * 0.5,
          color: Math.random() > 0.5 ? '#666' : '#444',
          size: Math.random() * 3 + 2,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 5
        });
      }
    }
    
    function spawnBlood(x, y, count) {
      for (let i = 0; i < count; i++) {
        bloodParticles.push({
          x: x + (Math.random() - 0.5) * 50,
          y: y + (Math.random() - 0.5) * 60,
          vx: (Math.random() - 0.5) * 800,
          vy: (Math.random() - 0.5) * 800 - 300,
          size: Math.random() * 8 + 3,
          life: 3 + Math.random() * 2
        });
      }
    }
    
    function checkPlacement(item) {
      const headZone = { x: plushie.x, y: plushie.y - 60, r: 60 };
      const bellyZone = { x: plushie.x, y: plushie.y + 30, r: 60 };
      const neckZone = { x: plushie.x, y: plushie.y - 10, r: 40 };
      const handZone = { x: plushie.x + 45, y: plushie.y + 10, r: 50 };
      
      let placed = false;
      if (item.slot === 'head' && Math.hypot(item.x - headZone.x, item.y - headZone.y) < headZone.r) placed = true;
      else if (item.slot === 'belly' && Math.hypot(item.x - bellyZone.x, item.y - bellyZone.y) < bellyZone.r) placed = true;
      else if (item.slot === 'neck' && Math.hypot(item.x - neckZone.x, item.y - neckZone.y) < neckZone.r) placed = true;
      else if (item.slot === 'hand' && Math.hypot(item.x - handZone.x, item.y - handZone.y) < handZone.r) placed = true;
      
      if (placed && !item.placed) {
        item.placed = true;
        progressLevel++;
        playMediaSfx('pickup', 0.42, 90);
        vibrate('light');
        spawnAsh(item.x, item.y);
        
        plushie.bounce = 15;
        
        if (progressLevel >= maxProgress) {
          plushie.isHappy = true;
          playMediaSfx('success', 0.58, 400);
          showFeedbackGif('success');
          vibrate('medium');
          spawnAsh(plushie.x, plushie.y);
          setState('ANIMATING');
        }
      } else {
        item.targetScale = 1;
      }
    }
    
    function update(time) {
      dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;
      timeAcc += dt;
      
      if (plushie.bounce > 0) plushie.bounce += (0 - plushie.bounce) * 15 * dt;
      
      if (gameState === 'PLAYING') {
        timeLeft -= dt;
        document.getElementById('timer').textContent = Math.max(0, Math.ceil(timeLeft));
        
        plushie.y += (plushie.targetY - plushie.y) * 10 * dt;
        
        if (timeLeft <= 0) {
          setState('DYING');
        }
      } else if (gameState === 'DYING') {
        deathTimer -= dt;
        // Violent shake
        plushie.x = cw / 2 + (Math.random() - 0.5) * 40;
        plushie.y = ch / 2 - 40 + (Math.random() - 0.5) * 40;
        
        if (deathTimer <= 0) {
          setState('GAMEOVER');
        }
      } else if (gameState === 'ANIMATING') {
        plushie.y -= 300 * dt;
        if (plushie.y < -150) {
          totalScore++;
          document.getElementById('score').textContent = totalScore;
          timeLeft += gameConfig.timeBonus;
          resetLevel(false);
          setState('PLAYING');
        }
      }
      
      items.forEach((item, idx) => {
        item.scale += (item.targetScale - item.scale) * 15 * dt;
        
        if (item.dragging) {
          item.rotation += (Math.sin(timeAcc * 15) * 0.1 - item.rotation) * 10 * dt;
        } else {
          if (!item.placed) {
            let ty = item.baseY + Math.sin(timeAcc * 2 + idx) * 4;
            item.x += (item.baseX - item.x) * 10 * dt;
            item.y += (ty - item.y) * 10 * dt;
            item.rotation += (Math.sin(timeAcc * 1.5 + idx) * 0.05 - item.rotation) * 5 * dt;
          } else {
            let targetX = plushie.x;
            let targetY = plushie.y;
            
            if (item.slot === 'head') targetY -= 65;
            else if (item.slot === 'belly') targetY += 30;
            else if (item.slot === 'neck') targetY -= 10;
            else if (item.slot === 'hand') { targetX += 45; targetY += 10; }
            
            item.x = targetX;
            item.y = targetY - plushie.bounce;
            item.rotation += (0 - item.rotation) * 15 * dt;
          }
        }
      });
      
      plushie.blink += dt;
      if (plushie.blink > 3 + Math.random() * 2) plushie.blink = 0;
      
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 100 * dt;
        p.rot += p.rotSpeed * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      
      for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const p = bloodParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 1800 * dt; // Heavy gravity
        p.life -= dt;
        if (p.life <= 0 || p.y > ch + 100) bloodParticles.splice(i, 1);
      }
    }
    
    function drawPlushie() {
      ctx.save();
      ctx.translate(plushie.x, plushie.y - plushie.bounce);

      const auraGlow = ctx.createRadialGradient(0, -10, 10, 0, -10, 125);
      auraGlow.addColorStop(0, plushie.isHappy ? 'rgba(118, 247, 255, 0.28)' : 'rgba(255, 103, 200, 0.22)');
      auraGlow.addColorStop(0.55, 'rgba(118, 247, 255, 0.08)');
      auraGlow.addColorStop(1, 'rgba(118, 247, 255, 0)');
      ctx.fillStyle = auraGlow;
      ctx.beginPath();
      ctx.ellipse(0, 0, 105, 145, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 108, 70, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 15;
      
      // Ears
      ctx.fillStyle = plushie.baseColor;
      ctx.beginPath(); ctx.arc(-35, -55, 22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(35, -55, 22, 0, Math.PI * 2); ctx.fill();
      
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.arc(-35, -55, 12, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(35, -55, 12, 0, Math.PI * 2); ctx.fill();
      
      // Body
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.fillStyle = plushie.baseColor;
      ctx.beginPath();
      ctx.ellipse(0, 30, 50, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Arms
      ctx.beginPath(); ctx.ellipse(-45, 20, 15, 25, Math.PI/6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(45, 20, 15, 25, -Math.PI/6, 0, Math.PI * 2); ctx.fill();
      
      // Feet
      ctx.beginPath(); ctx.ellipse(-25, 85, 20, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(25, 85, 20, 15, 0, 0, Math.PI * 2); ctx.fill();
      
      // Head
      ctx.beginPath();
      ctx.arc(0, -20, 45, 0, Math.PI * 2);
      ctx.fill();

      const faceGlow = ctx.createRadialGradient(0, -28, 4, 0, -22, 52);
      faceGlow.addColorStop(0, 'rgba(255,255,255,0.16)');
      faceGlow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = faceGlow;
      ctx.beginPath();
      ctx.arc(0, -20, 45, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowColor = 'transparent';
      
      if (plushie.isDead) {
        // Blood stains on body
        ctx.fillStyle = '#7a0000';
        ctx.beginPath(); ctx.arc(-15, 15, 18, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(20, 40, 25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -10, 20, 0, Math.PI*2); ctx.fill();
        
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';
        ctx.lineCap = 'round';
        
        // X_X Eyes
        ctx.beginPath(); ctx.moveTo(-28, -32); ctx.lineTo(-12, -16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-12, -32); ctx.lineTo(-28, -16); ctx.stroke();
        
        ctx.beginPath(); ctx.moveTo(12, -32); ctx.lineTo(28, -16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(28, -32); ctx.lineTo(12, -16); ctx.stroke();
        
        // Dead mouth
        ctx.beginPath(); ctx.arc(0, -5, 15, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
        
      } else if (gameState === 'DYING') {
        // Panicked eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-20, -25, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(20, -25, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-20, -25, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(20, -25, 3, 0, Math.PI * 2); ctx.fill();
        
        // Screaming mouth
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.ellipse(0, -5, 10, 15, 0, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#111';
        if (plushie.isHappy) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#111';
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(-18, -25, 8, Math.PI, 0); ctx.stroke();
          ctx.beginPath(); ctx.arc(18, -25, 8, Math.PI, 0); ctx.stroke();
        } else if (plushie.blink < 0.15) {
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#111';
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-25, -25); ctx.lineTo(-11, -25); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(11, -25); ctx.lineTo(25, -25); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(-18, -25, 6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(18, -25, 6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(-20, -27, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(16, -27, 1.5, 0, Math.PI * 2); ctx.fill();
        }
        
        ctx.fillStyle = 'rgba(255, 211, 111, 0.9)';
        ctx.beginPath(); ctx.arc(-8, -6, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -6, 3.5, 0, Math.PI * 2); ctx.fill();

        // Stitches (instead of blush)
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-32, -15); ctx.lineTo(-22, -15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-30, -18); ctx.lineTo(-30, -12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-26, -18); ctx.lineTo(-26, -12); ctx.stroke();
        
        ctx.beginPath(); ctx.moveTo(22, -15); ctx.lineTo(32, -15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(26, -18); ctx.lineTo(26, -12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(30, -18); ctx.lineTo(30, -12); ctx.stroke();
        
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (plushie.isHappy) {
          ctx.arc(0, -15, 12, 0, Math.PI, false);
        } else {
          ctx.moveTo(-8, -12);
          ctx.lineTo(8, -12);
        }
        ctx.stroke();
      }
      
      ctx.restore();
    }
    
    function drawItem(item) {
      if (item.scale <= 0.01) return;
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rotation);
      ctx.scale(item.scale, item.scale);

      ctx.fillStyle = item.placed ? 'rgba(118, 247, 255, 0.18)' : 'rgba(255, 211, 111, 0.1)';
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(item.w, item.h) * 0.42, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowColor = item.dragging ? 'rgba(118,247,255,0.45)' : 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = item.dragging ? 20 : 15;
      ctx.shadowOffsetY = item.dragging ? 15 : 8;
      
      ctx.fillStyle = item.color;
      
      if (item.name === 'hat') {
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(25, 25);
        ctx.lineTo(-25, 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.moveTo(-15, 5); ctx.lineTo(15, 5); ctx.lineTo(20, 15); ctx.lineTo(-20, 15); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(0, -30, 12, 0, Math.PI*2); ctx.fill();
      } else if (item.name === 'heart') {
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.bezierCurveTo(-25, -10, -25, -25, 0, -25);
        ctx.bezierCurveTo(25, -25, 25, -10, 0, 15);
        ctx.fill();
        // Stitches on heart
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(10, 5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-5, -10); ctx.lineTo(-5, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(5, 10); ctx.stroke();
      } else if (item.name === 'bowtie') {
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(-25, -15); ctx.lineTo(-25, 15); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(25, -15); ctx.lineTo(25, 15); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.fill();
      } else if (item.name === 'wand') {
        ctx.fillStyle = '#222';
        ctx.fillRect(-4, -20, 8, 60);
        ctx.fillStyle = item.color;
        ctx.translate(0, -25);
        ctx.beginPath();
        for(let i=0; i<5; i++) {
          ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*20, -Math.sin((18+i*72)*Math.PI/180)*20);
          ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8, -Math.sin((54+i*72)*Math.PI/180)*8);
        }
        ctx.closePath();
        ctx.fill();
      }
      
      ctx.restore();
    }
    
    function draw() {
      const bgGrad = ctx.createRadialGradient(cw/2, ch/2 - 80, 0, cw/2, ch/2, Math.max(cw, ch));
      bgGrad.addColorStop(0, '#2a1244');
      bgGrad.addColorStop(0.45, '#13081d');
      bgGrad.addColorStop(1, '#030107');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, ch);

      const floorGlow = ctx.createLinearGradient(0, ch * 0.55, 0, ch);
      floorGlow.addColorStop(0, 'rgba(255, 103, 200, 0)');
      floorGlow.addColorStop(1, 'rgba(255, 103, 200, 0.12)');
      ctx.fillStyle = floorGlow;
      ctx.fillRect(0, ch * 0.4, cw, ch * 0.6);

      ctx.strokeStyle = 'rgba(118, 247, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        const y = ch * (0.58 + i * 0.08);
        ctx.beginPath();
        ctx.moveTo(cw * 0.14, y);
        ctx.quadraticCurveTo(cw * 0.5, y - 18, cw * 0.86, y);
        ctx.stroke();
      }
      
      // Vignette noise overlay simulation
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.fillRect(0, 0, cw, ch);
      
      drawPlushie();
      
      items.filter(i => i.placed).forEach(drawItem);
      items.filter(i => !i.placed && !i.dragging).forEach(drawItem);
      items.filter(i => i.dragging).forEach(drawItem);
      
      particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      });
      
      ctx.fillStyle = '#a00';
      bloodParticles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    
    function loop(time) {
      try {
        update(time);
        draw();
        requestAnimationFrame(loop);
      } catch(e) { requestAnimationFrame(loop); }
    }
    
    let dragItem = null;
    
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }
    
    function handleInput(e) {
      unlockAudio();
      e.preventDefault();
      const pos = getPointerPos(e);
      
      if (gameState !== 'PLAYING') {
        return; 
      }
      
      if (e.type === 'pointerdown') {
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          if (item.placed) continue;
          const dx = pos.x - item.x;
          const dy = pos.y - item.y;
          if (Math.abs(dx) < item.w && Math.abs(dy) < item.h) {
            dragItem = item;
            item.dragging = true;
            item.targetScale = 1.2;
            playMediaSfx('click', 0.32, 70);
            vibrate('light');
            items.push(items.splice(i, 1)[0]);
            break;
          }
        }
      } else if ((e.type === 'pointerup' || e.type === 'pointercancel') && dragItem) {
        dragItem.dragging = false;
        checkPlacement(dragItem);
        dragItem = null;
      } else if (e.type === 'pointermove' && dragItem) {
        dragItem.x = pos.x;
        dragItem.y = pos.y - 40;
      }
    }
    
    function restartGame() {
      initGame();
    }
    
    // [agent-note][stage4] repaired: mobile-actionability | element: canvas input | action: scoped pointer suppression away from document-level UI controls
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    canvas.addEventListener('pointermove', handleInput, { passive: false });
    canvas.addEventListener('pointerup', handleInput, { passive: false });
    canvas.addEventListener('pointercancel', handleInput, { passive: false });
    
    document.getElementById('restart-btn')?.addEventListener('click', (e) => {
      e.stopPropagation();
      playMediaSfx('click', 0.34, 120);
      showFeedbackGif('success');
      restartGame();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopBgm();
      } else if (audioUnlocked && gameState !== 'GAMEOVER') {
        startBgm();
      }
    });
    
    window.updateGameConfig = (key, val) => {
      if (configDefs[key].type === 'number') val = parseFloat(val);
      window.gameConfig[key] = val;
    };
  })();
  </script>
</body>
