rder-radius:50%;background:var(--candle);box-shadow:0 0 16px var(--candle);opacity:.78;pointer-events:none;animation:twinkle 2.2s ease-in-out infinite}.hud{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}.chip{min-width:112px;padding:9px 10px;border:1px solid rgba(255,214,107,.62);border-radius:16px;background:linear-gradient(180deg,rgba(42,14,66,.84),rgba(10,3,18,.76));box-shadow:0 0 20px rgba(255,138,34,.15),inset 0 0 18px rgba(104,247,208,.06);backdrop-filter:blur(9px);text-transform:uppercase;letter-spacing:.08em;font-size:12px;line-height:1.2}.chip b{display:block;font-family:Bangers,cursive;color:var(--spell);font-size:25px;letter-spacing:.04em;text-shadow:0 0 11px rgba(104,247,208,.62)}.objective{position:absolute;left:50%;top:74px;transform:translateX(-50%);width:min(92%,420px);padding:8px 12px;text-align:center;border-radius:999px;border:1px solid rgba(255,98,188,.46);background:rgba(7,1,15,.55);font-size:12px;letter-spacing:.04em;z-index:4;pointer-events:none}.objective strong{color:var(--candle)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,0,9,.78);backdrop-filter:blur(8px);z-index:20}.overlay.hidden{display:none}.card{width:min(94vw,410px);border:2px solid rgba(255,214,107,.76);border-radius:24px;background:radial-gradient(circle at top,rgba(255,138,34,.18),transparent 32%),linear-gradient(180deg,rgba(49,13,72,.96),rgba(9,2,17,.96));box-shadow:0 0 50px rgba(255,98,188,.24),inset 0 0 28px rgba(104,247,208,.08);padding:24px;text-align:center}.sigil{font-size:46px;filter:drop-shadow(0 0 15px rgba(255,214,107,.6))}.title{font-family:Creepster,cursive;font-size:42px;line-height:.95;margin:6px 0;color:#ffbd4b;text-shadow:0 0 18px rgba(255,98,188,.55),0 0 35px rgba(104,247,208,.23);letter-spacing:.05em}.card p{margin:10px 0 18px;font-size:15px;line-height:1.45;color:#f7dfb1}.btn{appearance:none;width:100%;border:0;border-radius:18px;padding:15px 18px;background:linear-gradient(180deg,#ffcf62,#ff8422);color:#210512;font:700 20px Bangers,cursive;letter-spacing:.08em;box-shadow:0 8px 0 #7d2b0e,0 0 24px rgba(255,138,34,.33);touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #7d2b0e,0 0 16px rgba(255,138,34,.26)}.toast{position:absolute;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));width:min(34vw,124px);padding:6px;border-radius:18px;border:1px solid rgba(255,214,107,.42);background:rgba(12,3,19,.74);box-shadow:0 0 24px rgba(104,247,208,.18);opacity:0;transform:translateY(14px) scale(.94);transition:.22s;z-index:8;pointer-events:none}.toast.visible{opacity:.97;transform:translateY(0) scale(1)}.toast img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;display:block}.toast div{font:12px Bangers,cursive;color:var(--candle);letter-spacing:.08em;text-align:center;margin-top:4px}.stage{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:84%;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,138,34,.28),rgba(104,247,208,.08) 48%,transparent 72%);filter:blur(1px);pointer-events:none}@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.28}50%{transform:scale(1.25);opacity:1}}@keyframes fog{0%{transform:translateX(0)}50%{transform:translateX(4%)}100%{transform:translateX(0)}}@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@media(max-width:430px){.title{font-size:37px}.chip{min-width:102px;font-size:11px}.chip b{font-size:23px}.objective{top:68px;font-size:11px}.card{padding:21px}.toast{width:min(35vw,106px)}}

<body>
<div class="app" id="game-container">
<canvas id="gameCanvas"></canvas><div class="moon"></div><div class="bunting"></div><div class="fog"></div><div class="stage"></div>

<script id="game-config" type="application/x-game-config">{"baseTime":{"type":"number","label":"Start Time","value":30,"min":10,"max":60},"timeBonus":{"type":"number","label":"Time Bonus","value":5,"min":1,"max":10}}</script>
<script>
(function(){
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let cw=0,ch=0,dpr=1,initialized=false,lastTime=0,dt=0,timeAcc=0;let gameState='PLAYING',totalScore=0,progressLevel=0,timeLeft=30,deathTimer=0,dragItem=null,audioUnlocked=false,activeGifTimer=0;const configDefs=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=configDefs;window.gameConfig={};for(const k in configDefs)window.gameConfig[k]=configDefs[k].value;const familiar={x:0,y:0,targetY:0,baseColor:'#2a1538',bounce:0,blink:0,isHappy:false,isDead:false};const items=[],particles=[],curseParticles=[];const maxProgress=4;const itemTypes=[{type:'hat',w:62,h:72,slot:'head',name:'hat',label:'Sister Hat',color:'#8d42ff'},{type:'heart',w:54,h:54,slot:'belly',name:'heart',label:'Laughing Locket',color:'#ff3f89'},{type:'bowtie',w:64,h:34,slot:'neck',name:'bowtie',label:'Pumpkin Bow',color:'#ff8a22'},{type:'wand',w:44,h:94,slot:'hand',name:'wand',label:'Spark Wand',color:'#68f7d0'}];const bgmMain=document.getElementById('bgm_main');const audioEls={pickup:document.getElementById('sfx_pickup'),success:document.getElementById('sfx_success'),fail:document.getElementById('sfx_fail'),gameOver:document.getElementById('sfx_game_over'),click:document.getElementById('sfx_click')};const sfxCooldowns=new Map();
function resize(){const r=canvas.getBoundingClientRect();dpr=window.devicePixelRatio||1;cw=r.width;ch=r.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(initialized){if(!['ANIMATING','DYING','GAMEOVER'].includes(gameState)){familiar.x=cw/2;familiar.y=ch/2-35;familiar.targetY=familiar.y}clampEntities()}}
new ResizeObserver(()=>{resize();if(!initialized){initialized=true;initGame();requestAnimationFrame(loop)}}).observe(canvas);
function clampEntities(){items.forEach(item=>{if(!item.placed&&!item.dragging){item.x=Math.max(item.w/2,Math.min(cw-item.w/2,item.x));item.y=Math.max(item.h/2,Math.min(ch-item.h/2,item.y))}})}
function initAudio(){try{bgmMain.volume=.18;Object.values(audioEls).forEach(a=>{if(a){a.preload='auto';a.load()}})}catch(e){}}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;initAudio();startBgm()}
function startBgm(){try{bgmMain.volume=.18;bgmMain.play().catch(()=>{})}catch(e){}}
function stopBgm(){try{bgmMain.pause()}catch(e){}}
function playMediaSfx(key,volume=.55,cooldown=0){if(!audioUnlocked)return;const a=audioEls[key];if(!a)return;const now=performance.now();if(cooldown&&now-(sfxCooldowns.get(key)||0)<cooldown)return;sfxCooldowns.set(key,now);try{a.pause();a.currentTime=0;a.volume=volume;a.play().catch(()=>{})}catch(e){}}
function showFeedbackGif(kind){const s=document.getElementById('success-gif'),f=document.getElementById('fail-gif');[s,f].forEach(el=>el&&el.classList.remove('visible'));clearTimeout(activeGifTimer);const t=kind==='success'?s:f;if(!t)return;t.classList.add('visible');activeGifTimer=setTimeout(()=>t.classList.remove('visible'),kind==='success'?1500:1800)}
function vibrate(style){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}})}catch(e){}if(navigator.vibrate)navigator.vibrate(style==='heavy'?[150,50,150,50,200]:style==='medium'?60:20)}
function initGame(){totalScore=0;timeLeft=window.gameConfig.baseTime;document.getElementById('score').textContent=totalScore;document.getElementById('timer').textContent=Math.ceil(timeLeft);resetLevel(true);setState('PLAYING');initAudio();try{bgmMain.currentTime=0}catch(e){}if(audioUnlocked)startBgm();showFeedbackGif('success')}
function resetLevel(isFirst=false){familiar.x=cw/2;familiar.y=isFirst?ch/2-35:ch+100;familiar.targetY=ch/2-35;familiar.isHappy=false;familiar.isDead=false;familiar.bounce=0;const colors=['#241337','#2d173f','#1d2740','#33203a','#241c2f'];familiar.baseColor=colors[Math.floor(Math.random()*colors.length)];progressLevel=0;particles.length=0;curseParticles.length=0;items.length=0;const startY=ch-98;[...itemTypes].sort(()=>Math.random()-.5).forEach((type,i,arr)=>{const spacingX=cw/(arr.length+1);items.push({...type,x:spacingX*(i+1),y:startY+(i%2===0?15:-15),baseX:spacingX*(i+1),baseY:startY+(i%2===0?15:-15),dragging:false,placed:false,scale:0,targetScale:1,rotation:(Math.random()-.5)*.2})})}
function setState(state){gameState=state;const hud=document.getElementById('hud'),over=document.getElementById('game-over-screen');if(state==='PLAYING'||state==='ANIMATING'){hud.style.opacity='1';over.classList.add('hidden');if(audioUnlocked)startBgm()}else if(state==='DYING'){hud.style.opacity='0';deathTimer=1;playMediaSfx('fail',.5,500);showFeedbackGif('fail');vibrate('medium')}else if(state==='GAMEOVER'){over.classList.remove('hidden');document.getElementById('final-score').textContent=totalScore;familiar.isDead=true;spawnCurse(familiar.x,familiar.y,130);playMediaSfx('gameOver',.55,1000);showFeedbackGif('fail');stopBgm();vibrate('heavy')}}
function spawnSpark(x,y){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*110-35,life:.9+Math.random()*.55,color:Math.random()>.5?'#ffd66b':'#68f7d0',size:Math.random()*4+2,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*6})}
function spawnCurse(x,y,count){for(let i=0;i<count;i++)curseParticles.push({x:x+(Math.random()-.5)*55,y:y+(Math.random()-.5)*65,vx:(Math.random()-.5)*760,vy:(Math.random()-.5)*740-280,size:Math.random()*7+3,life:2.8+Math.random()*1.7,color:Math.random()>.42?'#f23768':'#8d42ff'})}
function checkPlacement(item){const zones={head:{x:familiar.x,y:familiar.y-60,r:60},belly:{x:familiar.x,y:familiar.y+30,r:60},neck:{x:familiar.x,y:familiar.y-10,r:40},hand:{x:familiar.x+45,y:familiar.y+10,r:50}};const z=zones[item.slot];const placed=Math.hypot(item.x-z.x,item.y-z.y)<z.r;if(placed&&!item.placed){item.placed=true;progressLevel++;playMediaSfx('pickup',.42,90);vibrate('light');spawnSpark(item.x,item.y);familiar.bounce=15;if(progressLevel>=maxProgress){familiar.isHappy=true;playMediaSfx('success',.58,400);showFeedbackGif('success');vibrate('medium');spawnSpark(familiar.x,familiar.y);setState('ANIMATING')}}else item.targetScale=1}
function update(time){dt=Math.min((time-lastTime)/1000,.05)||0;lastTime=time;timeAcc+=dt;if(familiar.bounce>0)familiar.bounce+=(0-familiar.bounce)*15*dt;if(gameState==='PLAYING'){timeLeft-=dt;document.getElementById('timer').textContent=Math.max(0,Math.ceil(timeLeft));familiar.y+=(familiar.targetY-familiar.y)*10*dt;if(timeLeft<=0)setState('DYING')}else if(gameState==='DYING'){deathTimer-=dt;familiar.x=cw/2+(Math.random()-.5)*40;familiar.y=ch/2-35+(Math.random()-.5)*40;if(deathTimer<=0)setState('GAMEOVER')}else if(gameState==='ANIMATING'){familiar.y-=300*dt;if(familiar.y<-150){totalScore++;document.getElementById('score').textContent=totalScore;timeLeft+=window.gameConfig.timeBonus;resetLevel(false);setState('PLAYING')}}items.forEach((item,idx)=>{item.scale+=(item.targetScale-item.scale)*15*dt;if(item.dragging){item.rotation+=(Math.sin(timeAcc*15)*.1-item.rotation)*10*dt}else if(!item.placed){let ty=item.baseY+Math.sin(timeAcc*2+idx)*4;item.x+=(item.baseX-item.x)*10*dt;item.y+=(ty-item.y)*10*dt;item.rotation+=(Math.sin(timeAcc*1.5+idx)*.05-item.rotation)*5*dt}else{let tx=familiar.x,ty=familiar.y;if(item.slot==='head')ty-=65;else if(item.slot==='belly')ty+=30;else if(item.slot==='neck')ty-=10;else if(item.slot==='hand'){tx+=45;ty+=10}item.x=tx;item.y=ty-familiar.bounce;item.rotation+=(0-item.rotation)*15*dt}});familiar.blink+=dt;if(familiar.blink>3+Math.random()*2)familiar.blink=0;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.rot+=p.rotSpeed*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=curseParticles.length-1;i>=0;i--){const p=curseParticles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1750*dt;p.life-=dt;if(p.life<=0||p.y>ch+100)curseParticles.splice(i,1)}}
function drawBackground(){const g=ctx.createRadialGradient(cw/2,ch*.42,0,cw/2,ch*.52,Math.max(cw,ch));g.addColorStop(0,'#33124f');g.addColorStop(.5,'#15051f');g.addColorStop(1,'#030108');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.globalAlpha=.2+.08*Math.sin(timeAcc);for(let i=0;i<3;i++){const x=cw*(.2+i*.3)+Math.sin(timeAcc*.35+i)*18;ctx.fillStyle=i===1?'rgba(255,98,188,.16)':'rgba(255,214,107,.14)';ctx.beginPath();ctx.ellipse(x,ch*.58,38,132,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,214,107,.45)';ctx.beginPath();ctx.moveTo(x,ch*.37);ctx.quadraticCurveTo(x-12,ch*.42,x,ch*.46);ctx.quadraticCurveTo(x+12,ch*.42,x,ch*.37);ctx.fill()}ctx.restore();ctx.strokeStyle='rgba(104,247,208,.13)';ctx.lineWidth=1.5;for(let i=0;i<5;i++){const y=ch*(.58+i*.075);ctx.beginPath();ctx.moveTo(cw*.1,y);ctx.quadraticCurveTo(cw*.5,y-22,cw*.9,y);ctx.stroke()}ctx.save();ctx.globalAlpha=.14;ctx.fillStyle='#ff8a22';for(let i=0;i<7;i++){const x=(i+.5)*cw/7+Math.sin(timeAcc*.6+i)*6;const y=ch*.82+Math.sin(i)*9;ctx.beginPath();ctx.ellipse(x,y,16,12,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x-2,y-18,4,12)}ctx.restore();ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(0,0,cw,ch)}
function drawFamiliar(){ctx.save();ctx.translate(familiar.x,familiar.y-familiar.bounce);const aura=ctx.createRadialGradient(0,-8,12,0,-8,132);aura.addColorStop(0,familiar.isHappy?'rgba(104,247,208,.32)':'rgba(255,98,188,.24)');aura.addColorStop(.55,'rgba(255,138,34,.09)');aura.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.ellipse(0,0,108,148,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,108,72,18,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='rgba(0,0,0,.72)';ctx.shadowBlur=20;ctx.shadowOffsetY=14;ctx.fillStyle=familiar.baseColor;ctx.beginPath();ctx.arc(-35,-55,22,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(35,-55,22,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#0b0611';ctx.beginPath();ctx.arc(-35,-55,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(35,-55,12,0,Math.PI*2);ctx.fill();ctx.shadowColor='rgba(0,0,0,.45)';ctx.fillStyle=familiar.baseColor;ctx.beginPath();ctx.ellipse(0,30,50,60,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-45,20,15,25,Math.PI/6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(45,20,15,25,-Math.PI/6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-25,85,20,15,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(25,85,20,15,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,-20,45,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='rgba(255,214,107,.75)';ctx.beginPath();ctx.moveTo(-10,-72);ctx.lineTo(0,-104);ctx.lineTo(10,-72);ctx.closePath();ctx.fill();ctx.fillStyle='#ff8a22';ctx.beginPath();ctx.arc(0,-101,5,0,Math.PI*2);ctx.fill();if(familiar.isDead){ctx.fillStyle='#5b0735';ctx.beginPath();ctx.arc(-15,15,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,40,24,0,Math.PI*2);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#ffd66b';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-28,-32);ctx.lineTo(-12,-16);ctx.moveTo(-12,-32);ctx.lineTo(-28,-16);ctx.moveTo(12,-32);ctx.lineTo(28,-16);ctx.moveTo(28,-32);ctx.lineTo(12,-16);ctx.stroke();ctx.beginPath();ctx.arc(0,-5,15,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}else if(gameState==='DYING'){ctx.fillStyle='#ffd66b';ctx.beginPath();ctx.arc(-20,-25,10,0,Math.PI*2);ctx.arc(20,-25,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,-5,10,15,0,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#05030a';if(familiar.isHappy){ctx.lineWidth=4;ctx.strokeStyle='#68f7d0';ctx.lineCap='round';ctx.beginPath();ctx.arc(-18,-25,8,Math.PI,0);ctx.stroke();ctx.beginPath();ctx.arc(18,-25,8,Math.PI,0);ctx.stroke()}else if(familiar.blink<.15){ctx.lineWidth=4;ctx.strokeStyle='#111';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-25,-25);ctx.lineTo(-11,-25);ctx.moveTo(11,-25);ctx.lineTo(25,-25);ctx.stroke()}else{ctx.beginPath();ctx.arc(-18,-25,6,0,Math.PI*2);ctx.arc(18,-25,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-20,-27,1.5,0,Math.PI*2);ctx.arc(16,-27,1.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,138,34,.95)';ctx.beginPath();ctx.arc(-8,-6,3.5,0,Math.PI*2);ctx.arc(8,-6,3.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#68f7d0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-32,-15);ctx.lineTo(-22,-15);ctx.moveTo(-30,-18);ctx.lineTo(-30,-12);ctx.moveTo(22,-15);ctx.lineTo(32,-15);ctx.moveTo(30,-18);ctx.lineTo(30,-12);ctx.stroke();ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();familiar.isHappy?ctx.arc(0,-15,12,0,Math.PI,false):(ctx.moveTo(-8,-12),ctx.lineTo(8,-12));ctx.stroke()}ctx.restore()}
function starPath(r1,r2,n=5){ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?r2:r1;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath()}
function drawItem(item){if(item.scale<=.01)return;ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.rotation);ctx.scale(item.scale,item.scale);ctx.fillStyle=item.placed?'rgba(104,247,208,.2)':'rgba(255,214,107,.13)';ctx.beginPath();ctx.arc(0,0,Math.max(item.w,item.h)*.43,0,Math.PI*2);ctx.fill();ctx.shadowColor=item.dragging?'rgba(104,247,208,.55)':'rgba(0,0,0,.55)';ctx.shadowBlur=item.dragging?22:15;ctx.shadowOffsetY=item.dragging?15:8;ctx.fillStyle=item.color;if(item.name==='hat'){ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(25,24);ctx.lineTo(-25,24);ctx.closePath();ctx.fill();ctx.fillStyle='#12071d';ctx.fillRect(-25,10,50,11);ctx.fillStyle='#ffd66b';ctx.beginPath();ctx.arc(0,-32,10,0,Math.PI*2);ctx.fill()}else if(item.name==='heart'){ctx.beginPath();ctx.moveTo(0,17);ctx.bezierCurveTo(-27,-9,-25,-27,0,-24);ctx.bezierCurveTo(25,-27,27,-9,0,17);ctx.fill();ctx.strokeStyle='#ffd66b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(10,5);ctx.moveTo(-5,-10);ctx.lineTo(-5,0);ctx.moveTo(5,0);ctx.lineTo(5,10);ctx.stroke()}else if(item.name==='bowtie'){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-28,-16);ctx.lineTo(-28,16);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(28,-16);ctx.lineTo(28,16);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd66b';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill()}else if(item.name==='wand'){ctx.fillStyle='#4b2b16';ctx.fillRect(-4,-18,8,62);ctx.fillStyle=item.color;ctx.translate(0,-26);starPath(21,8);ctx.fill()}ctx.restore()}
function draw(){drawBackground();drawFamiliar();items.filter(i=>i.placed).forEach(drawItem);items.filter(i=>!i.placed&&!i.dragging).forEach(drawItem);items.filter(i=>i.dragging).forEach(drawItem);particles.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;starPath(p.size,p.size*.42,5);ctx.fill();ctx.restore()});curseParticles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}
function loop(time){try{update(time);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
function getPointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function handleInput(e){unlockAudio();e.preventDefault();const pos=getPointerPos(e);if(gameState!=='PLAYING')return;if(e.type==='pointerdown'){for(let i=items.length-1;i>=0;i--){const item=items[i];if(item.placed)continue;const dx=pos.x-item.x,dy=pos.y-item.y;if(Math.abs(dx)<item.w&&Math.abs(dy)<item.h){dragItem=item;item.dragging=true;item.targetScale=1.2;playMediaSfx('click',.32,70);vibrate('light');items.push(items.splice(i,1)[0]);break}}}else if((e.type==='pointerup'||e.type==='pointercancel')&&dragItem){dragItem.dragging=false;checkPlacement(dragItem);dragItem=null}else if(e.type==='pointermove'&&dragItem){dragItem.x=pos.x;dragItem.y=pos.y-40}}
function restartGame(){initGame()}
canvas.addEventListener('pointerdown',handleInput,{passive:false});canvas.addEventListener('pointermove',handleInput,{passive:false});canvas.addEventListener('pointerup',handleInput,{passive:false});canvas.addEventListener('pointercancel',handleInput,{passive:false});document.getElementById('restart-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();playMediaSfx('click',.34,120);showFeedbackGif('success');restartGame()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBgm();else if(audioUnlocked&&gameState!=='GAMEOVER')startBgm()});window.updateGameConfig=(key,val)=>{if(configDefs[key].type==='number')val=parseFloat(val);window.gameConfig[key]=val};window.__gameDebug={get state(){return gameState},get items(){return items.map(i=>({name:i.name,slot:i.slot,x:i.x,y:i.y,placed:i.placed}))},get familiar(){return{x:familiar.x,y:familiar.y}},get score(){return totalScore},get timeLeft(){return timeLeft}};
})();
