<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: font-remap | title/ui -> Audiowide + Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060816;
            --ui-color: #eef6ff;
            --ui-dim: #9eb7d1;
            --accent-color: #52f7ff;
            --accent-secondary: #ff5fd2;
            --accent-gold: #ffd166;
            --panel-bg: rgba(10, 18, 39, 0.84);
            --panel-border: rgba(82, 247, 255, 0.3);
            --btn-bg: linear-gradient(180deg, rgba(20, 33, 69, 0.92), rgba(8, 14, 31, 0.96));
            --btn-active: rgba(82, 247, 255, 0.24);
            --grid-line: rgba(111, 166, 255, 0.12);
            --field-top: #091126;
            --field-bottom: #050814;
            --glow-soft: 0 0 24px rgba(82, 247, 255, 0.22);
            --glow-strong: 0 0 30px rgba(255, 95, 210, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(83, 129, 255, 0.24), transparent 38%),
                radial-gradient(circle at 20% 85%, rgba(255, 95, 210, 0.18), transparent 32%),
                linear-gradient(180deg, #0b1021 0%, #060816 48%, #04050d 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: var(--ui-color);
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
        }

        /* Header / HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, rgba(12, 20, 44, 0.92), rgba(7, 13, 28, 0.82));
            border-bottom: 1px solid rgba(82, 247, 255, 0.16);
            box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
        }

        .hud-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 8px 12px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(18, 30, 58, 0.92), rgba(8, 15, 31, 0.9));
            border: 1px solid rgba(82, 247, 255, 0.2);
            box-shadow: var(--glow-soft);
        }

        .hud-label {
            color: var(--ui-dim);
        }

        .hud-value {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(82, 247, 255, 0.45);
        }

        /* Canvas Area */
        #canvas-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, rgba(82, 247, 255, 0.08), transparent 46%),
                linear-gradient(180deg, rgba(2, 4, 10, 0.65), rgba(2, 3, 9, 0.92));
            position: relative;
            overflow: hidden;
        }

        #canvas-wrapper::before,
        #canvas-wrapper::after {
            content: "";
            position: absolute;
            pointer-events: none;
            inset: auto;
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.5;
        }

        #canvas-wrapper::before {
            width: 120px;
            height: 120px;
            top: 8%;
            left: 8%;
            background: rgba(82, 247, 255, 0.12);
        }

        #canvas-wrapper::after {
            width: 150px;
            height: 150px;
            right: 6%;
            bottom: 12%;
            background: rgba(255, 95, 210, 0.12);
        }

        canvas {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, var(--field-top), var(--field-bottom));
            border: 2px solid rgba(82, 247, 255, 0.18);
            border-radius: 18px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 12px 30px rgba(0,0,0,0.45), var(--glow-soft);
            touch-action: none;
        }

        /* Controls Area */
        #controls {
            height: 180px;
            background: linear-gradient(180deg, rgba(8, 14, 31, 0.98), rgba(5, 9, 20, 1));
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); /* Safe area */
            border-top: 1px solid rgba(82, 247, 255, 0.14);
            touch-action: manipulation;
        }

        .control-btn {
            background: var(--btn-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom-width: 3px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: var(--ui-color);
            text-shadow: 0 0 12px rgba(82, 247, 255, 0.4);
            user-select: none;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 18px rgba(0, 0, 0, 0.28);
        }

        .control-btn:active,
        .control-btn.is-active {
            background: linear-gradient(180deg, rgba(42, 78, 132, 0.98), rgba(12, 28, 58, 0.98));
            transform: scale(0.95);
            box-shadow: 0 0 18px rgba(82, 247, 255, 0.22);
        }

        /* Layout for D-Pad logic */
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-rotate {
            grid-column: 2;
            grid-row: 1;
            background: linear-gradient(180deg, rgba(49, 33, 92, 0.95), rgba(20, 10, 48, 0.95));
            border-color: rgba(255, 95, 210, 0.34);
            box-shadow: var(--glow-strong);
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            z-index: 10;
        }

        .screen {
            width: min(100%, 340px);
            background: linear-gradient(180deg, rgba(7, 13, 28, 0.94), rgba(5, 8, 18, 0.96));
            padding: 28px 22px;
            border-radius: 22px;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(82, 247, 255, 0.2);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42), var(--glow-soft);
            display: none;
        }

        .screen.active { display: block; }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 95, 210, 0.14);
            border: 1px solid rgba(255, 95, 210, 0.24);
            color: #ffd8f2;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px 0;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            font-size: clamp(26px, 7vw, 32px);
            line-height: 1.1;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-shadow: 0 0 18px rgba(82, 247, 255, 0.35);
        }

        p {
            font-size: 16px;
            line-height: 1.15;
            color: #d6def2;
            margin: 0 0 22px;
        }

        .hero-avatar {
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
            border-radius: 24px;
            position: relative;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0) 20%),
                linear-gradient(180deg, #55faff 0%, #4474ff 52%, #a346ff 100%);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 0 24px rgba(82, 247, 255, 0.28);
        }

        .hero-avatar::before,
        .hero-avatar::after {
            content: "";
            position: absolute;
            background: #07101f;
            border-radius: 999px;
        }

        .hero-avatar::before {
            width: 14px;
            height: 14px;
            top: 26px;
            left: 22px;
            box-shadow: 28px 0 0 #07101f;
        }

        .hero-avatar::after {
            width: 34px;
            height: 12px;
            bottom: 20px;
            left: 26px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 2px 0 rgba(255,255,255,0.18) inset;
        }

        .hero-avatar span {
            position: absolute;
            top: -14px;
            right: -10px;
            font-size: 26px;
            filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.65));
        }

        button.primary-btn {
            width: 100%;
            background: linear-gradient(180deg, #6ef6ff 0%, #35b8ff 100%);
            color: #07101f;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Rajdhani', system-ui, sans-serif;
            border-radius: 999px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 24px rgba(53, 184, 255, 0.28);
        }

        #mute-btn {
            position: static;
            min-width: 36px;
            min-height: 36px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.9;
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: 88px;
            height: 88px;
            border-radius: 18px;
            object-fit: cover;
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 12;
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34), 0 0 18px rgba(82, 247, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(4, 9, 20, 0.9);
        }

        .feedback-gif.is-visible {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }

        #combo-gif {
            top: 12px;
        }

        #status-gif {
            bottom: 12px;
        }

        @media (max-width: 420px) {
            #hud {
                padding: 10px;
                font-size: 12px;
            }

            #controls {
                height: 168px;
            }

            .screen {
                padding: 24px 18px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="hud-pill"><span class="hud-label">Stack</span><span class="hud-value" id="score">0</span></div>
        <div class="hud-pill" id="mute-btn" aria-label="Toggle sound">🔊</div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: line-clear + game-over reactions -> catalogs/gifs.json -->
        <img id="combo-gif" class="feedback-gif" alt="line clear reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
        <img id="status-gif" class="feedback-gif" alt="game over reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen" class="screen active">
                <div class="eyebrow">Shift Lead</div>
                <div class="hero-avatar" aria-hidden="true"><span>⚡</span></div>
                <h1>Neon Stack</h1>
                <p>Guide the smiling stack core and lock glowing blocks in place. Tap the controls or use Arrow Keys.</p>
                <button class="primary-btn" id="start-btn">Start Shift</button>
            </div>
            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen">
                <div class="eyebrow">Core Offline</div>
                <div class="hero-avatar" aria-hidden="true"><span>💥</span></div>
                <h1>Shift Over</h1>
                <p>Final Stack: <span id="final-score">0</span></p>
                <button class="primary-btn" id="restart-btn">Run Again</button>
            </div>
        </div>
    </div>

    <div id="controls">
        <!-- Grid layout handles positioning -->
        <div class="control-btn" id="btn-left">⬅️</div>
        <div class="control-btn" id="btn-rotate">↻</div>
        <div class="control-btn" id="btn-right">➡️</div>
        <div class="control-btn" id="btn-down">⬇️</div>
    </div>
</div>

<script>
/**
 * 1. AUDIO SYSTEM (Procedural Synthesis)
 * Since no assets were provided, we generate sounds using Web Audio API.
 */
const AudioSys = {
    ctx: null,
    isMuted: false,
    unlocked: false,
    masterGain: null,
    bgmGain: null,
    bgmOscillators: [],
    sources: {},
    lastPlayedAt: {},
    timers: new Set(),
    manifest: {
        bgm: {
            role: 'ambient background loop',
            url: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
        },
        move: {
            role: 'ui click button press',
            url: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3'
        },
        rotate: {
            role: 'powerup activation',
            url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3'
        },
        drop: {
            role: 'player landing ground contact',
            url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3'
        },
        clear: {
            role: 'bonus reward score boost',
            url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3'
        },
        blocked: {
            role: 'blocked invalid action',
            url: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3'
        },
        gameOver: {
            role: 'game over defeat',
            url: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3'
        },
        start: {
            role: 'start game',
            url: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'
        }
    },

    init() {
        try {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.7;
                this.masterGain.connect(this.ctx.destination);

                this.bgmGain = this.ctx.createGain();
                this.bgmGain.gain.value = 0.15;
                this.bgmGain.connect(this.masterGain);
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.unlocked = true;
            this.ensureBgm();
        } catch (error) {
            this.unlocked = false;
        }
    },

    createSource(url, volume = 0.35, loop = false) {
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.crossOrigin = 'anonymous';
        audio.loop = loop;
        audio.volume = volume;
        audio.playsInline = true;
        return audio;
    },

    preload() {
        Object.entries(this.manifest).forEach(([key, item]) => {
            if (!this.sources[key]) {
                const volume = key === 'bgm' ? 0.2 : 0.36;
                const loop = key === 'bgm';
                this.sources[key] = this.createSource(item.url, volume, loop);
            }
        });
    },

    ensureBgm() {
        if (!this.ctx || this.bgmOscillators.length) return;
        const now = this.ctx.currentTime;
        const pad = [
            { freq: 110, type: 'sine' },
            { freq: 164.81, type: 'triangle' },
            { freq: 220, type: 'sine' }
        ];
        pad.forEach((voice, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = voice.type;
            osc.frequency.setValueAtTime(voice.freq, now);
            gain.gain.value = index === 1 ? 0.018 : 0.012;
            osc.connect(gain);
            gain.connect(this.bgmGain);
            osc.start();
            this.bgmOscillators.push({ osc, gain });
        });
    },

    startBgm() {
        if (this.isMuted || !this.ctx || !this.bgmGain) return;
        this.ensureBgm();
        this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.bgmGain.gain.setTargetAtTime(0.15, this.ctx.currentTime, 0.2);
        const bgm = this.sources.bgm;
        if (bgm && bgm.paused) {
            bgm.currentTime = 0;
            bgm.play().catch(() => {});
        }
    },

    stopBgm() {
        if (this.ctx && this.bgmGain) {
            this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
            this.bgmGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.12);
        }
        const bgm = this.sources.bgm;
        if (bgm && !bgm.paused) {
            bgm.pause();
        }
    },

    playSfx(name, { debounce = 60, fallback = null } = {}) {
        if (this.isMuted) return;
        const now = performance.now();
        if ((this.lastPlayedAt[name] || 0) + debounce > now) return;
        this.lastPlayedAt[name] = now;

        const source = this.sources[name];
        if (source) {
            try {
                source.currentTime = 0;
                source.play().catch(() => {});
            } catch (error) {}
        }

        if (this.ctx && fallback) {
            fallback();
        }
    },

    playTone(freq, type, duration, vol = 0.08) {
        if (this.isMuted || !this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    sfxMove() {
        this.playSfx('move', {
            debounce: 45,
            fallback: () => this.playTone(300, 'square', 0.04, 0.03)
        });
    },
    sfxRotate() {
        this.playSfx('rotate', {
            debounce: 70,
            fallback: () => this.playTone(420, 'triangle', 0.07, 0.045)
        });
    },
    sfxDrop() {
        this.playSfx('drop', {
            debounce: 90,
            fallback: () => this.playTone(150, 'sawtooth', 0.09, 0.06)
        });
    },
    sfxClear() {
        this.playSfx('clear', {
            debounce: 180,
            fallback: () => {
                [440, 554, 659].forEach((freq, index) => {
                    const timer = setTimeout(() => {
                        this.timers.delete(timer);
                        this.playTone(freq, 'sine', index === 2 ? 0.3 : 0.18, 0.06);
                    }, index * 80);
                    this.timers.add(timer);
                });
            }
        });
    },
    sfxBlocked() {
        this.playSfx('blocked', {
            debounce: 100,
            fallback: () => this.playTone(180, 'square', 0.06, 0.04)
        });
    },
    sfxGameOver() {
        this.playSfx('gameOver', {
            debounce: 300,
            fallback: () => {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 1);
                gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1);
                osc.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1);
            }
        });
        this.stopBgm();
    },
    sfxStart() {
        this.playSfx('start', {
            debounce: 200,
            fallback: () => this.playTone(520, 'triangle', 0.12, 0.06)
        });
    },

    toggleMute() {
        this.isMuted = !this.isMuted;
        document.getElementById('mute-btn').innerText = this.isMuted ? '🔇' : '🔊';
        if (this.isMuted) {
            Object.values(this.sources).forEach((audio) => {
                try {
                    audio.pause();
                } catch (error) {}
            });
            if (this.masterGain) this.masterGain.gain.value = 0;
        } else {
            if (this.masterGain) this.masterGain.gain.value = 0.7;
            this.startBgm();
        }
    }
};

AudioSys.preload();

const GifFx = {
    comboEl: document.getElementById('combo-gif'),
    statusEl: document.getElementById('status-gif'),
    comboTimer: null,
    statusTimer: null,

    flash(el, duration = 1400) {
        if (!el) return;
        el.classList.add('is-visible');
        const timerKey = el === this.comboEl ? 'comboTimer' : 'statusTimer';
        if (this[timerKey]) clearTimeout(this[timerKey]);
        this[timerKey] = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    },

    showCombo() {
        this.flash(this.comboEl, 1400);
    },

    showGameOver() {
        this.flash(this.statusEl, 2200);
    },

    hideAll() {
        [this.comboEl, this.statusEl].forEach((el) => el && el.classList.remove('is-visible'));
    }
};

/**
 * 2. GAME CONSTANTS & LOGIC
 */
const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 25; // Base size, scaled by canvas
const COLORS = [
    null,
    '#ff5fd2', // T - Neon pink
    '#52f7ff', // I - Plasma cyan
    '#79ff9f', // S - Mint glow
    '#a86bff', // Z - Violet pulse
    '#ff9b54', // L - Sunset orange
    '#ffd166', // O - Signal gold
    '#5c8dff', // J - Electric blue
];

const SHAPES = [
    [],
    [[0, 1, 0], [1, 1, 1], [0, 0, 0]], // T
    [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]], // I
    [[0, 3, 3], [3, 3, 0], [0, 0, 0]], // S
    [[4, 4, 0], [0, 4, 4], [0, 0, 0]], // Z
    [[0, 0, 5], [5, 5, 5], [0, 0, 0]], // L
    [[6, 6], [6, 6]], // O
    [[7, 0, 0], [7, 7, 7], [0, 0, 0]], // J
];

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.grid = this.createGrid(COLS, ROWS);
        this.score = 0;
        this.dropCounter = 0;
        this.dropInterval = 1000;
        this.lastTime = 0;
        this.isRunning = false;
        
        this.player = {
            pos: {x: 0, y: 0},
            matrix: null,
            colorIndex: 0
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    createGrid(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    resize() {
        // Calculate available height for canvas
        const hudHeight = document.getElementById('hud').offsetHeight;
        const controlsHeight = document.getElementById('controls').offsetHeight;
        const availableHeight = window.innerHeight - hudHeight - controlsHeight - 20; // 20px padding
        
        // Maintain aspect ratio 10:20 (1:2)
        let h = availableHeight;
        let w = h / 2;
        
        // Ensure width fits
        if (w > window.innerWidth - 20) {
            w = window.innerWidth - 20;
            h = w * 2;
        }

        this.canvas.width = w;
        this.canvas.height = h;
        this.scale = w / COLS;
        
        // Redraw if paused
        if (!this.isRunning && this.player.matrix) {
            this.draw();
        }
    }

    spawnPiece() {
        const typeId = (Math.random() * 7 | 0) + 1;
        this.player.matrix = SHAPES[typeId];
        this.player.colorIndex = typeId;
        this.player.pos.y = 0;
        this.player.pos.x = (this.grid[0].length / 2 | 0) - (this.player.matrix[0].length / 2 | 0);

        if (this.collide(this.grid, this.player)) {
            this.gameOver();
        }
    }

    collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    rotate(dir) {
        const pos = this.player.pos.x;
        let offset = 1;
        this.rotateMatrix(this.player.matrix, dir);
        // Wall kick
        while (this.collide(this.grid, this.player)) {
            this.player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > this.player.matrix[0].length) {
                // If rotate fails, rotate back
                this.rotateMatrix(this.player.matrix, -dir);
                this.player.pos.x = pos;
                AudioSys.sfxBlocked();
                return;
            }
        }
        AudioSys.sfxRotate();
    }

    rotateMatrix(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    playerDrop() {
        this.player.pos.y++;
        if (this.collide(this.grid, this.player)) {
            this.player.pos.y--;
            this.merge(this.grid, this.player);
            AudioSys.sfxDrop();
            this.arenaSweep();
            this.spawnPiece();
        }
        this.dropCounter = 0;
    }

    playerMove(dir) {
        this.player.pos.x += dir;
        if (this.collide(this.grid, this.player)) {
            this.player.pos.x -= dir;
            AudioSys.sfxBlocked();
        } else {
            AudioSys.sfxMove();
        }
    }

    arenaSweep() {
        let rowCount = 1;
        let linesCleared = 0;
        outer: for (let y = this.grid.length - 1; y > 0; --y) {
            for (let x = 0; x < this.grid[y].length; ++x) {
                if (this.grid[y][x] === 0) {
                    continue outer;
                }
            }
            const row = this.grid.splice(y, 1)[0].fill(0);
            this.grid.unshift(row);
            ++y;
            this.score += rowCount * 10;
            rowCount *= 2;
            linesCleared++;
        }
        if (linesCleared > 0) {
            AudioSys.sfxClear();
            GifFx.showCombo();
            this.updateScore();
            // Speed up
            this.dropInterval = Math.max(100, 1000 - (this.score / 5));
        }
    }

    drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    const px = (x + offset.x) * this.scale;
                    const py = (y + offset.y) * this.scale;
                    const size = this.scale;
                    const base = COLORS[value];

                    this.ctx.save();

                    const blockGradient = this.ctx.createLinearGradient(px, py, px, py + size);
                    blockGradient.addColorStop(0, '#ffffff');
                    blockGradient.addColorStop(0.14, base);
                    blockGradient.addColorStop(1, 'rgba(5, 10, 25, 0.95)');
                    this.ctx.fillStyle = blockGradient;
                    this.ctx.fillRect(px + 1, py + 1, size - 2, size - 2);

                    this.ctx.strokeStyle = 'rgba(255,255,255,0.38)';
                    this.ctx.lineWidth = Math.max(1.5, size * 0.06);
                    this.ctx.strokeRect(px + 1.5, py + 1.5, size - 3, size - 3);

                    this.ctx.fillStyle = 'rgba(255,255,255,0.16)';
                    this.ctx.fillRect(px + size * 0.16, py + size * 0.12, size * 0.42, size * 0.14);

                    this.ctx.fillStyle = 'rgba(5,10,25,0.26)';
                    this.ctx.fillRect(px + size * 0.72, py + size * 0.72, size * 0.18, size * 0.18);

                    if (offset === this.player.pos && value === this.player.colorIndex) {
                        this.ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        this.ctx.beginPath();
                        this.ctx.arc(px + size * 0.34, py + size * 0.36, size * 0.07, 0, Math.PI * 2);
                        this.ctx.arc(px + size * 0.66, py + size * 0.36, size * 0.07, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.strokeStyle = 'rgba(7,16,31,0.9)';
                        this.ctx.lineWidth = Math.max(1, size * 0.05);
                        this.ctx.beginPath();
                        this.ctx.arc(px + size * 0.5, py + size * 0.58, size * 0.14, 0.15 * Math.PI, 0.85 * Math.PI);
                        this.ctx.stroke();
                    }

                    this.ctx.restore();
                }
            });
        });
    }

    draw() {
        // Clear
        const fieldGradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
        fieldGradient.addColorStop(0, '#0a1022');
        fieldGradient.addColorStop(1, '#04070f');
        this.ctx.fillStyle = fieldGradient;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = 0; i < 24; i++) {
            this.ctx.fillStyle = i % 2 === 0 ? 'rgba(82,247,255,0.025)' : 'rgba(255,95,210,0.02)';
            this.ctx.fillRect(0, (this.canvas.height / 24) * i, this.canvas.width, this.canvas.height / 24);
        }

        // Draw Grid Lines (Subtle)
        this.ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
        this.ctx.lineWidth = 1;
        for(let x=0; x<=COLS; x++) {
            this.ctx.beginPath();
            this.ctx.moveTo(x*this.scale, 0);
            this.ctx.lineTo(x*this.scale, this.canvas.height);
            this.ctx.stroke();
        }
        for(let y=0; y<=ROWS; y++) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, y*this.scale);
            this.ctx.lineTo(this.canvas.width, y*this.scale);
            this.ctx.stroke();
        }

        this.drawMatrix(this.grid, {x: 0, y: 0});
        this.drawMatrix(this.player.matrix, this.player.pos);
    }

    update(time = 0) {
        if (!this.isRunning) return;
        
        const deltaTime = time - this.lastTime;
        this.lastTime = time;

        this.dropCounter += deltaTime;
        if (this.dropCounter > this.dropInterval) {
            this.playerDrop();
        }

        this.draw();
        requestAnimationFrame(this.update.bind(this));
    }

    updateScore() {
        document.getElementById('score').innerText = this.score;
    }

    start() {
        this.grid = this.createGrid(COLS, ROWS);
        this.score = 0;
        this.dropInterval = 1000;
        this.updateScore();
        this.spawnPiece();
        this.isRunning = true;
        this.lastTime = performance.now();
        this.update();
        GifFx.hideAll();
        AudioSys.sfxStart();
        AudioSys.startBgm();
        
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-over-screen').classList.remove('active');
    }

    gameOver() {
        this.isRunning = false;
        AudioSys.sfxGameOver();
        GifFx.showGameOver();
        document.getElementById('final-score').innerText = this.score;
        document.getElementById('game-over-screen').classList.add('active');
    }
}

// Init Game
const game = new Game();

// Input Handling
function handleInput(action) {
    if (!game.isRunning) return;
    if (action === 'left') game.playerMove(-1);
    if (action === 'right') game.playerMove(1);
    if (action === 'rotate') game.rotate(1);
    if (action === 'down') {
        game.playerDrop();
        game.score += 1; // Bonus for fast drop
        game.updateScore();
    }
}

// Keyboard
document.addEventListener('keydown', event => {
    if (event.keyCode === 37) handleInput('left');
    else if (event.keyCode === 39) handleInput('right');
    else if (event.keyCode === 38) handleInput('rotate');
    else if (event.keyCode === 40) handleInput('down');
});

// Touch UI
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnRotate = document.getElementById('btn-rotate');
const btnDown = document.getElementById('btn-down');

// Prevent default context menu on long press
window.oncontextmenu = function(event) {
    event.preventDefault();
    event.stopPropagation();
    return false;
};

// Add touch listeners with passive: false to prevent scrolling
const addTouch = (elem, action) => {
    const activate = () => elem.classList.add('is-active');
    const deactivate = () => elem.classList.remove('is-active');

    elem.addEventListener('touchstart', (e) => {
        e.preventDefault();
        activate();
        handleInput(action);
        // For continuous drop
        if(action === 'down') {
            // Logic for hold-to-drop could go here, but tap is safer for MVP
        }
    }, {passive: false});

    elem.addEventListener('touchend', deactivate, {passive: true});
    elem.addEventListener('touchcancel', deactivate, {passive: true});
    elem.addEventListener('pointerdown', activate);
    elem.addEventListener('pointerup', deactivate);
    elem.addEventListener('pointerleave', deactivate);
};

addTouch(btnLeft, 'left');
addTouch(btnRight, 'right');
addTouch(btnRotate, 'rotate');
addTouch(btnDown, 'down');

// Start/Restart
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');

const startGame = () => {
    AudioSys.init();
    game.start();
};

startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
restartBtn.addEventListener('click', startGame);
restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });

// Mute
document.getElementById('mute-btn').addEventListener('click', () => AudioSys.toggleMute());

</script>
