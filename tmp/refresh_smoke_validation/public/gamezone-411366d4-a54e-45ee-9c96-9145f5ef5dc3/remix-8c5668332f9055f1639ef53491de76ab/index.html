<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>City Sprint: Drone Panic</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Audiowide&display=swap" rel="stylesheet">
    <!-- [agent-note][stage4] repaired: font-remap | title=Audiowide | ui=Rajdhani | hud=Orbitron via catalogs/fonts.json -->
    <style>
        :root {
            --sky: #1b1740;
            --sky-glow: #3f2a7d;
            --panel-bg: rgba(10, 15, 33, 0.76);
            --panel-border: rgba(111, 243, 255, 0.92);
            --panel-highlight: rgba(255, 74, 162, 0.72);
            --shadow-blue: #16113a;
            --score-gold: #ffe66d;
            --danger-red: #ff5c7c;
            --boss-red: #ff4a66;
            --ink-dark: #050816;
            --muted: #c9d6ff;
            --ui-cyan: #6ff3ff;
            --ui-purple: #8b5cf6;
            --ui-pink: #ff77c8;
            --road-shadow: rgba(5, 8, 22, 0.55);
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(111, 243, 255, 0.16), transparent 36%),
                linear-gradient(180deg, var(--sky) 0%, #0f1536 52%, #060912 100%);
            color: #f7fbff;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .gap-2 { gap: 0.5rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .z-10 { z-index: 10; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-sm { max-width: 24rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .overflow-hidden { overflow: hidden; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .font-extrabold { font-weight: 800; }
        .uppercase { text-transform: uppercase; }
        .transition-all { transition: all 0.15s ease; }
        .transition-transform { transition: transform 0.2s ease; }
        .duration-200 { transition-duration: 0.2s; }
        .border-4 { border-width: 4px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-white { border-color: #fff; }
        .border-yellow-400 { border-color: #facc15; }
        .bg-black { background: #000; }
        .bg-red-600 { background: #dc2626; }
        .bg-yellow-400 { background: #facc15; }
        .bg-blue-600 { background: #2563eb; }
        .bg-gray-800 { background: #1f2937; }
        .bg-red-600, .bg-yellow-400, .bg-blue-600 { color: inherit; }
        .text-white { color: #fff; }
        .text-blue-900 { color: #1e3a8a; }

        .text-gray-200 { color: #e5e7eb; }
        .text-gray-300 { color: var(--muted); }
        .text-red-500 { color: var(--danger-red); }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-1 { margin-top: 0.25rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: clamp(2.5rem, 6vw, 3.5rem); }
        .leading-tight { line-height: 1.15; }
        .drop-shadow-\[2px_2px_0_rgba\(0\,0\,0\,0\.8\)\] { text-shadow: 2px 2px 0 rgba(0,0,0,0.8); }
        .drop-shadow-\[2px_2px_0_rgba\(0\,0\,0\,1\)\] { text-shadow: 2px 2px 0 rgba(0,0,0,1); }
        .shadow-\[0_6px_0_rgb\(153\,27\,27\)\] { box-shadow: 0 6px 0 rgb(153,27,27); }
        .shadow-\[0_6px_0_rgb\(180\,83\,9\)\] { box-shadow: 0 6px 0 rgb(180,83,9); }
        .shadow-\[0_6px_0_rgb\(30\,58\,138\)\] { box-shadow: 0 6px 0 rgb(30,58,138); }
        .active\:shadow-none:active { box-shadow: none; }
        .active\:translate-y-2:active { transform: translateY(0.5rem); }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:bg-red-500:hover { background: #ef4444; }
        .hover\:bg-yellow-300:hover { background: #fde047; }
        .hover\:bg-blue-500:hover { background: #3b82f6; }
        .w-\[90\%\] { width: 90%; }
        .w-32 { width: 8rem; }
        .h-4 { height: 1rem; }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(19, 27, 57, 0.92), rgba(8, 13, 27, 0.88)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid var(--panel-border);
            box-shadow:
                0 16px 38px rgba(0, 0, 0, 0.42),
                0 0 0 2px rgba(255, 255, 255, 0.08) inset,
                0 0 24px rgba(111, 243, 255, 0.2);
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 45%, rgba(255, 119, 200, 0.12));
            pointer-events: none;
        }
        .sonic-font {
            font-family: 'Audiowide', 'Orbitron', sans-serif;
            text-shadow:
                0 4px 0 var(--shadow-blue),
                0 0 18px rgba(255, 119, 200, 0.28);
            letter-spacing: 0.06em;
            line-height: 0.9;
        }
        button {
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            cursor: pointer;
            letter-spacing: 0.08em;
            touch-action: manipulation;
        }
        .status-chip {
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(6, 9, 18, 0.45);
            color: var(--ui-cyan);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .panel-kicker {
            margin: 0 0 0.75rem;
            color: var(--ui-cyan);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .panel-copy {
            font-family: 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.05em;
        }
        #hud,
        .status-chip,
        .panel-kicker {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }
        .feedback-overlay {
            position: absolute;
            right: 0.75rem;
            bottom: calc(1rem + env(safe-area-inset-bottom));
            width: min(28vw, 140px);
            border: 2px solid rgba(111, 243, 255, 0.45);
            border-radius: 1rem;
            background: rgba(5, 8, 22, 0.58);
            box-shadow: 0 0 18px rgba(111, 243, 255, 0.18);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.18s ease, transform 0.18s ease;
            pointer-events: none;
        }
        .feedback-overlay.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .feedback-overlay img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: inherit;
        }
        .feedback-overlay.victory {
            left: 50%;
            right: auto;
            top: max(0.75rem, env(safe-area-inset-top));
            bottom: auto;
            width: min(40vw, 180px);
            transform: translate(-50%, -8px) scale(0.94);
        }
        .feedback-overlay.victory.active {
            transform: translate(-50%, 0) scale(1);
        }
        #hud {
            padding-top: max(1rem, env(safe-area-inset-top));
        }
        #hud > div {
            background: rgba(8, 13, 27, 0.58);
            border: 2px solid rgba(111, 243, 255, 0.35);
            box-shadow: 0 0 18px rgba(111, 243, 255, 0.14);
            border-radius: 1rem;
            padding: 0.55rem 0.8rem;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        /* Animation for boss damage */
        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .flash-anim {
            animation: flash 0.2s linear 3;
        }
        @media (max-width: 640px) {
            .p-8 { padding: 1.5rem; }
            .text-5xl { font-size: 2.2rem; }
            .text-3xl { font-size: 1.4rem; }
            .text-2xl { font-size: 1.15rem; }
            .py-4 { padding-top: 0.875rem; padding-bottom: 0.875rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full bg-black">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none z-10">\n            <!-- [agent-note][stage3] resolved-gif: stomp+victory overlays from catalogs/gifs.json | keep off playfield to protect controls -->\n            <div id="stomp-gif" class="feedback-overlay" aria-hidden="true"><img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt=""></div>\n            <div id="victory-gif" class="feedback-overlay victory" aria-hidden="true"><img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt=""></div>
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 rounded-3xl text-center pointer-events-auto max-w-sm w-[90%] transition-transform hover:scale-105 duration-200">
                <div class="panel-kicker">Neon rooftop chase</div>
                <div class="status-chip mb-4">⚡ Courier mode engaged</div>
                <h1 class="text-5xl font-extrabold text-yellow-400 mb-2 sonic-font">CITY<br>SPRINT</h1>
                <p class="text-white text-lg mb-6 font-bold leading-tight panel-copy">
                    KEEP MOVING.<br>STOMP SECURITY DRONES.<br>SHUT DOWN THE SKY BOSS!
                </p>
                <div class="flex justify-center">
                    <button id="start-btn" class="bg-red-600 hover:bg-red-500 text-white font-black py-4 px-12 rounded-full shadow-[0_6px_0_rgb(153,27,27)] active:shadow-none active:translate-y-2 transition-all text-2xl border-4 border-white uppercase">
                        START RUN
                    </button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-3xl text-center pointer-events-auto max-w-sm w-[90%]">
                <div class="panel-kicker">Signal lost</div>
                <h2 class="text-5xl font-black text-gray-200 mb-4 sonic-font">RUN LOST</h2>
                <div class="text-2xl text-white mb-2 panel-copy">Score: <span id="finalScore" class="text-yellow-400">0</span></div>
                <p class="text-gray-300 text-sm mb-6 panel-copy">Avoid drones and falling scrap.</p>
                <button id="restart-btn" class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-black py-4 px-10 rounded-full shadow-[0_6px_0_rgb(180,83,9)] active:shadow-none active:translate-y-2 transition-all text-xl border-4 border-white uppercase">
                    RUN AGAIN
                </button>
            </div>

            <!-- Victory Screen -->
            <div id="victory-screen" class="hidden glass-panel p-8 rounded-3xl text-center pointer-events-auto max-w-sm w-[90%] border-yellow-400">
                <div class="panel-kicker">Skyline secured</div>
                <h2 class="text-5xl font-black text-yellow-400 mb-4 sonic-font">DISTRICT SAFE</h2>
                <p class="text-white text-lg mb-6 font-bold panel-copy">THE COMMAND DRONE IS DOWN!</p>
                <div class="text-2xl text-white mb-8 panel-copy">Final Score: <span id="winScore" class="text-yellow-400">0</span></div>
                <button id="win-restart-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-4 px-10 rounded-full shadow-[0_6px_0_rgb(30,58,138)] active:shadow-none active:translate-y-2 transition-all text-xl border-4 border-white uppercase">
                    RESTART RUN
                </button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden pointer-events-none">
                <div class="flex flex-col items-start">
                    <div class="text-3xl font-black text-yellow-400 drop-shadow-[2px_2px_0_rgba(0,0,0,0.8)] flex items-center gap-2">
                        <span>SCORE</span>
                        <span id="score">0</span>
                    </div>
                </div>
                <!-- [agent-note][stage1] role: future-audio | trigger: boss-phase-shift | intent: emphasize rising pressure -->
                <!-- Boss Health Bar (Hidden until boss) -->
                <div id="boss-hud" class="hidden flex flex-col items-end">
                    <div class="text-xl font-black text-red-500 drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">COMMAND DRONE</div>
                    <div class="w-32 h-4 bg-gray-800 border-2 border-white rounded-full overflow-hidden mt-1">
                        <div id="boss-hp-bar" class="w-full h-full bg-red-600 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
     /**
      * CITY SPRINT: DRONE PANIC
      * Single-file implementation.
      */

    /* --- ASSETS & AUDIO --- */
    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
        sfx: {
            jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
            land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            enemyDefeat: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_defeat_02.mp3",
            projectile: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_02.mp3",
            bossHit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
            gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
            victory: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
            uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
        }
    };

    class AudioController {
        constructor() {
            this.enabled = true;
            this.started = false;
            this.lastPlayedAt = new Map();
            this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
            this.bgm.preload = 'auto';
            this.sfx = {};
            const volumes = {
                jump: 0.35,
                land: 0.22,
                enemyDefeat: 0.42,
                projectile: 0.28,
                bossHit: 0.4,
                gameOver: 0.5,
                victory: 0.5,
                uiClick: 0.32,
                start: 0.4,
                warning: 0.36
            };
            for (const [key, src] of Object.entries(ASSETS.sfx)) {
                this.sfx[key] = this.createAudio(src, volumes[key] ?? 0.35, false);
                this.sfx[key].preload = 'auto';
            }
        }

        createAudio(src, volume = 0.35, loop = false) {
            const audio = new Audio(src);
            audio.volume = volume;
            audio.loop = loop;
            audio.playsInline = true;
            return audio;
        }

        unlock() {
            this.started = true;
        }

        playBGM(reset = false) {
            if (!this.enabled || !this.started) return;
            if (reset) this.bgm.currentTime = 0;
            this.bgm.play().catch(() => {});
        }

        stopBGM() {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }

        pauseBGM() {
            this.bgm.pause();
        }

        playSFX(key, options = {}) {
            if (!this.enabled || !this.started) return;
            const base = this.sfx[key];
            if (!base) return;
            const now = performance.now();
            const minInterval = options.minInterval ?? 90;
            if ((this.lastPlayedAt.get(key) ?? 0) + minInterval > now) return;
            this.lastPlayedAt.set(key, now);

            const clone = base.cloneNode();
            clone.volume = options.volume ?? base.volume;
            clone.playbackRate = options.playbackRate ?? 1;
            clone.playsInline = true;
            clone.play().catch(() => {});
        }
    }
    const audio = new AudioController();

    /* --- GAME CONSTANTS --- */
    const GAME = {
        gravity: 0.8,
        groundHeightRatio: 0.2,
        bossDistance: 1000, // Distance to trigger boss
        colors: {
            skyTop: '#231b55',
            skyBot: '#5c3fa3',
            grass: '#6ff3ff',
            dirtLight: '#32215c',
            dirtDark: '#150d2e',
            player: '#3ec5ff',
            robot: '#ff5c7c',
            boss: '#ff4a66'
        }
    };

    /* --- MAIN VARIABLES --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height, groundY;
    let frame = 0;
    let score = 0;
    let gameSpeed = 8;
    let distanceTraveled = 0;
    let state = 'START'; // START, RUNNING, BOSS_WARNING, BOSS_FIGHT, GAME_OVER, VICTORY
    let landingArmed = false;
    let activeLoopId = null;
    let stompGifTimer = null;
    let victoryGifTimer = null;
    
    // Entities
    let player = {
        x: 0, y: 0, r: 20, dy: 0, 
        jumpForce: -16, grounded: false, angle: 0,
        flash: 0
    };
    
    let enemies = [];
    let particles = [];
    let projectiles = [];
    
    let boss = {
        active: false,
        x: 0, y: 0, w: 80, h: 60,
        hp: 3, maxHp: 3,
        phase: 'hover', // hover, attack, descend, vulnerable, hit
        timer: 0,
        dy: 0,
        flash: 0
    };

    /* --- RESIZE & INIT --- */
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        groundY = height - (height * GAME.groundHeightRatio);
        if(state === 'START') {
            player.x = width * 0.2;
            player.y = groundY - player.r;
        }
    }
    window.addEventListener('resize', resize);
    
    function showFeedbackGif(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('active');
        if (id === 'stomp-gif') {
            clearTimeout(stompGifTimer);
            stompGifTimer = setTimeout(() => el.classList.remove('active'), duration);
        } else if (id === 'victory-gif') {
            clearTimeout(victoryGifTimer);
            victoryGifTimer = setTimeout(() => el.classList.remove('active'), duration);
        }
    }

    function hideFeedbackGifs() {
        document.getElementById('stomp-gif')?.classList.remove('active');
        document.getElementById('victory-gif')?.classList.remove('active');
        clearTimeout(stompGifTimer);
        clearTimeout(victoryGifTimer);
    }

    function initGame() {
        resize();
        frame = 0;
        score = 0;
        distanceTraveled = 0;
        gameSpeed = 10;
        state = 'RUNNING';
        
        player.y = groundY - player.r;
        player.dy = 0;
        player.grounded = true;
        player.flash = 0;

        enemies = [];
        particles = [];
        projectiles = [];
        landingArmed = false;
        activeLoopId = null;
        hideFeedbackGifs();
        
        // Reset Boss
        boss.active = false;
        boss.hp = 3;
        boss.x = width + 200;
        boss.y = height * 0.2;
        boss.phase = 'hover';
        boss.timer = 0;

        updateUI();
        audio.playBGM(true);
    }

    /* --- INPUT --- */
    function jump() {
        if (state !== 'RUNNING' && state !== 'BOSS_FIGHT' && state !== 'BOSS_WARNING') return;
        
        if (player.grounded) {
            player.dy = player.jumpForce;
            player.grounded = false;
            audio.playSFX('jump', { minInterval: 140, playbackRate: 1 + Math.random() * 0.08 });
            landingArmed = true;
            createParticles(player.x, player.y + player.r, '#fff', 5);
        }
    }

    // [agent-note][stage4] repaired: mobile-actionability | scope touch jump input to gameplay surface so menu buttons keep native tap/click behavior
    const handleGameplayTouchStart = (e) => {
        if (state !== 'RUNNING' && state !== 'BOSS_FIGHT' && state !== 'BOSS_WARNING') return;
        e.preventDefault();
        jump();
    };
    canvas.addEventListener('touchstart', handleGameplayTouchStart, { passive: false });
    
    // Mouse for testing on PC (optional but good for dev)
    canvas.addEventListener('mousedown', () => {
        jump();
    });

    /* --- GAME LOGIC --- */
    function spawnEnemy() {
        if (state === 'BOSS_FIGHT' || state === 'BOSS_WARNING') return;
        
        // Random chance to spawn
        if (Math.random() < 0.02) {
            enemies.push({
                x: width + 50,
                y: groundY - 30, // Walking on ground
                w: 40, h: 30,
                type: 'robot',
                frameOffset: Math.random() * 10
            });
        }
    }

    function updatePlayer() {
        // Gravity
        player.dy += GAME.gravity;
        player.y += player.dy;

        // Ground Collision
        if (player.y + player.r >= groundY) {
            player.y = groundY - player.r;
            player.dy = 0;
            player.grounded = true;
            if (landingArmed) {
                audio.playSFX('land', { minInterval: 120 });
                landingArmed = false;
            }
            // Run animation
            player.angle = Math.sin(frame * 0.3) * 0.2;
        } else {
            player.grounded = false;
            // Spin animation
            player.angle += 0.4; 
        }

        if (player.flash > 0) player.flash--;
    }

    function updateBoss() {
        if (!boss.active) return;

        boss.timer++;

        // Boss Movement Logic
        // Target X position: Hover on right side
        let targetX = width - 100;
        boss.x += (targetX - boss.x) * 0.05;

        // Phases
        switch (boss.phase) {
            case 'hover':
                // Hover up and down slightly
                boss.y = (height * 0.2) + Math.sin(frame * 0.05) * 20;
                if (boss.timer > 180) { // 3 seconds
                    boss.phase = 'attack';
                    boss.timer = 0;
                }
                break;
            
            case 'attack':
                if (boss.timer === 30) {
                    // Throw projectile
                    projectiles.push({
                        x: boss.x,
                        y: boss.y + boss.h/2,
                        vx: -8 - (Math.random() * 4), // Throw left
                        vy: -4, // Arc up slightly
                        r: 15
                    });
                    audio.playSFX('projectile', { minInterval: 160, playbackRate: 0.98 + Math.random() * 0.08 });
                }
                if (boss.timer > 60) {
                    boss.phase = 'descend';
                    boss.timer = 0;
                }
                break;

            case 'descend':
                // Move down to be hit
                let targetY = groundY - 80; // Low enough to jump on
                boss.y += (targetY - boss.y) * 0.05;
                if (Math.abs(boss.y - targetY) < 5) {
                    boss.phase = 'vulnerable';
                    boss.timer = 0;
                }
                break;

            case 'vulnerable':
                // Stay low
                if (boss.timer > 180) { // 3 seconds window
                    boss.phase = 'retreat';
                    boss.timer = 0;
                }
                break;

            case 'retreat':
                // Go back up
                boss.y += ((height * 0.2) - boss.y) * 0.05;
                if (Math.abs(boss.y - (height * 0.2)) < 10) {
                    boss.phase = 'hover';
                    boss.timer = 0;
                }
                break;
            
            case 'hit':
                boss.y += (height * 0.2 - boss.y) * 0.1; // Recoil up
                if (boss.timer > 60) {
                    boss.phase = 'hover';
                    boss.timer = 0;
                    boss.flash = 0;
                }
                break;
        }

        if (boss.flash > 0) boss.flash--;
    }

    function checkCollisions() {
        // 1. Player vs Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            // Simple AABB vs Circle approximation
            // Enemy box: e.x, e.y, e.w, e.h
            // Player: player.x, player.y, player.r
            
            let closestX = Math.max(e.x, Math.min(player.x, e.x + e.w));
            let closestY = Math.max(e.y, Math.min(player.y, e.y + e.h));
            
            let dx = player.x - closestX;
            let dy = player.y - closestY;
            let distSq = dx*dx + dy*dy;

            if (distSq < player.r * player.r) {
                // Collision detected
                // Check if stomping (player bottom is above enemy center roughly, and falling)
                let isStomp = (player.dy > 0) && (player.y < e.y + 10);
                
                if (isStomp) {
                    // Kill Enemy
                    enemies.splice(i, 1);
                    player.dy = -10; // Bounce
                    score += 100;
                    audio.playSFX('enemyDefeat', { minInterval: 120, playbackRate: 0.96 + Math.random() * 0.12 });
                    showFeedbackGif('stomp-gif', 700);
                    createParticles(closestX, closestY, '#ef4444', 10);
                    createParticles(closestX, closestY, '#ffffff', 5);
                } else {
                    // Die
                    gameOver();
                }
            }
        }

        // 2. Player vs Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let dx = player.x - p.x;
            let dy = player.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < player.r + p.r) {
                gameOver();
            }
        }

        // 3. Player vs Boss
        if (boss.active && boss.phase !== 'hit') {
            // Boss Hitbox
            let bx = boss.x - boss.w/2;
            let by = boss.y - boss.h/2;
            
            let closestX = Math.max(bx, Math.min(player.x, bx + boss.w));
            let closestY = Math.max(by, Math.min(player.y, by + boss.h));
            
            let dx = player.x - closestX;
            let dy = player.y - closestY;
            
            if ((dx*dx + dy*dy) < player.r * player.r) {
                // Hit Logic
                // Must be falling and above center
                if (player.dy > 0 && player.y < boss.y && boss.phase === 'vulnerable') {
                    // Damage Boss
                    boss.hp--;
                    boss.phase = 'hit';
                    boss.timer = 0;
                    boss.flash = 30;
                    player.dy = -12; // Bounce off head
                    audio.playSFX('bossHit', { minInterval: 180, playbackRate: 0.92 });
                    showFeedbackGif('stomp-gif', 950);
                    createParticles(boss.x, boss.y, '#ffff00', 15);
                    
                    updateBossUI();

                    if (boss.hp <= 0) {
                        victory();
                    }
                } else if (boss.phase !== 'hit') {
                    // If touching boss body otherwise -> damage player
                    gameOver();
                }
            }
        }
    }

    function createParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function gameOver() {
        state = 'GAME_OVER';
        audio.playSFX('gameOver', { minInterval: 200 });
        hideFeedbackGifs();
        audio.stopBGM();
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = score;
    }

    function victory() {
        state = 'VICTORY';
        score += 1000;
        audio.playSFX('victory', { minInterval: 200 }); // Celebration sound
        showFeedbackGif('victory-gif', 2600);
        audio.stopBGM();
        
        // Big explosion visual
        createParticles(boss.x, boss.y, '#ff0000', 50);
        boss.active = false;

        setTimeout(() => {
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            document.getElementById('winScore').innerText = score;
        }, 1000);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
    }

    function updateBossUI() {
        const bar = document.getElementById('boss-hp-bar');
        const pct = (boss.hp / boss.maxHp) * 100;
        bar.style.width = pct + '%';
    }

    /* --- RENDERING --- */
    function drawBackground() {
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, GAME.colors.skyTop);
        grad.addColorStop(0.55, '#15153f');
        grad.addColorStop(1, '#060912');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        const moonGlow = ctx.createRadialGradient(width * 0.82, height * 0.2, 10, width * 0.82, height * 0.2, width * 0.2);
        moonGlow.addColorStop(0, 'rgba(255, 230, 109, 0.95)');
        moonGlow.addColorStop(0.18, 'rgba(255, 200, 90, 0.75)');
        moonGlow.addColorStop(1, 'rgba(255, 200, 90, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(width * 0.82, height * 0.2, Math.min(width, height) * 0.08, 0, Math.PI * 2);
        ctx.fill();

        const skylineOffset = (frame * 0.22) % 160;
        for (let layer = 0; layer < 2; layer++) {
            const baseY = groundY - 90 - layer * 65;
            const blockW = layer === 0 ? 78 : 54;
            const blockH = layer === 0 ? 110 : 70;
            for (let x = -skylineOffset; x < width + blockW; x += blockW + 20) {
                const h = blockH + ((x / (blockW + 20) + layer) % 3) * 18;
                ctx.fillStyle = layer === 0 ? 'rgba(10, 16, 34, 0.92)' : 'rgba(22, 26, 56, 0.78)';
                ctx.fillRect(x, baseY - h, blockW, h);
                ctx.fillStyle = layer === 0 ? 'rgba(111, 243, 255, 0.42)' : 'rgba(255, 119, 200, 0.28)';
                for (let wy = baseY - h + 10; wy < baseY - 8; wy += 16) {
                    for (let wx = x + 10; wx < x + blockW - 10; wx += 14) {
                        ctx.fillRect(wx, wy, 5, 7);
                    }
                }
            }
        }

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        let cloudOffset = (frame * 0.35) % width;
        [0.15, 0.45, 0.72].forEach((p, i) => {
            let cx = (width * p - cloudOffset + width) % width;
            let cy = height * 0.12 + (i * 38);
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, Math.PI * 2);
            ctx.arc(cx + 22, cy - 9, 32, 0, Math.PI * 2);
            ctx.arc(cx + 45, cy, 28, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawGround() {
        ctx.fillStyle = 'rgba(111, 243, 255, 0.95)';
        ctx.fillRect(0, groundY, width, 10);
        ctx.fillStyle = 'rgba(255, 119, 200, 0.95)';
        ctx.fillRect(0, groundY + 10, width, 6);

        let tileSize = 40;
        let moveSpeed = (state === 'VICTORY' || state === 'GAME_OVER') ? 0 : gameSpeed;
        let offset = (frame * moveSpeed) % (tileSize * 2);

        for (let y = groundY + 16; y < height; y += tileSize) {
            for (let x = -offset; x < width; x += tileSize) {
                let isDark = ((Math.floor((x + offset)/tileSize) + Math.floor(y/tileSize)) % 2 === 0);
                ctx.fillStyle = isDark ? GAME.colors.dirtDark : GAME.colors.dirtLight;
                ctx.fillRect(x, y, tileSize + 1, tileSize + 1);
            }
        }

        ctx.strokeStyle = 'rgba(111, 243, 255, 0.18)';
        ctx.lineWidth = 2;
        for (let x = -offset; x < width + tileSize; x += tileSize) {
            ctx.beginPath();
            ctx.moveTo(x, groundY + 16);
            ctx.lineTo(x + tileSize, height);
            ctx.stroke();
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        const heroColor = player.flash > 0 ? '#ffffff' : GAME.colors.player;

        if (!player.grounded) {
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 / 8) * i;
                ctx.fillStyle = i % 2 === 0 ? '#ff77c8' : '#6ff3ff';
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
                ctx.lineTo(Math.cos(a + 0.18) * 28, Math.sin(a + 0.18) * 28);
                ctx.lineTo(Math.cos(a - 0.18) * 28, Math.sin(a - 0.18) * 28);
                ctx.closePath();
                ctx.fill();
            }
        } else {
            for (let i = -1; i <= 1; i++) {
                ctx.fillStyle = i === 0 ? '#2f8fff' : '#7cecff';
                ctx.beginPath();
                ctx.moveTo(-8 + i * 8, -8);
                ctx.lineTo(-18 + i * 8, -22);
                ctx.lineTo(-2 + i * 8, -18);
                ctx.closePath();
                ctx.fill();
            }
        }

        ctx.fillStyle = heroColor;
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(4, -2, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(8, -7, 6, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(10, -7, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff5c7c';
        ctx.fillRect(-9, 10, 11, 8);
        ctx.fillStyle = '#ffe66d';
        ctx.fillRect(2, 10, 12, 8);

        ctx.strokeStyle = 'rgba(111, 243, 255, 0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, player.r + 4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    function drawEnemies() {
        enemies.forEach(e => {
            ctx.save();
            ctx.translate(e.x, e.y);

            ctx.fillStyle = '#1a1338';
            ctx.beginPath();
            ctx.roundRect(0, 0, e.w, e.h, 10);
            ctx.fill();

            ctx.fillStyle = GAME.colors.robot;
            ctx.beginPath();
            ctx.roundRect(4, 4, e.w - 8, e.h - 8, 8);
            ctx.fill();

            ctx.fillStyle = '#ffe66d';
            ctx.fillRect(e.w - 15, 8, 10, 6);
            ctx.fillStyle = '#111827';
            ctx.fillRect(7, 8, 10, 6);

            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(9, e.h - 8);
            ctx.lineTo(e.w - 9, e.h - 8);
            ctx.stroke();

            ctx.fillStyle = '#0b1022';
            ctx.beginPath();
            ctx.arc(e.w / 2, e.h + 1, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#6ff3ff';
            ctx.beginPath();
            ctx.arc(e.w / 2, e.h + 1, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        });
    }

    function drawBoss() {
        if (!boss.active) return;

        ctx.save();
        ctx.translate(boss.x, boss.y);

        if (boss.flash > 0 && Math.floor(frame / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }

        ctx.fillStyle = '#120c2d';
        ctx.beginPath();
        ctx.ellipse(0, 10, 44, 28, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#6ff3ff';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = GAME.colors.boss;
        ctx.beginPath();
        ctx.roundRect(-24, -34, 48, 28, 14);
        ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.fillRect(-24, -10, 48, 8);

        ctx.fillStyle = '#ffe66d';
        ctx.fillRect(-16, -26, 12, 8);
        ctx.fillRect(4, -26, 12, 8);

        ctx.fillStyle = '#ff77c8';
        ctx.fillRect(-26, -2, 18, 6);
        ctx.fillRect(8, -2, 18, 6);

        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-12, 10);
        ctx.lineTo(12, 10);
        ctx.stroke();

        if (boss.phase === 'hover' || boss.phase === 'attack') {
            ctx.fillStyle = '#ffe66d';
            ctx.beginPath();
            ctx.moveTo(-15, 38);
            ctx.lineTo(-3, 54 + Math.random() * 18);
            ctx.lineTo(4, 40);
            ctx.lineTo(14, 58 + Math.random() * 14);
            ctx.lineTo(19, 38);
            ctx.fill();
        }

        ctx.restore();
    }

    function drawProjectiles() {
        ctx.fillStyle = '#1f2937'; // Dark ball
        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fill();
            // Shine
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(p.x-4, p.y-4, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#1f2937'; // Reset
        });
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    /* --- MAIN LOOP --- */
    function loop() {
        // Clear
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawGround();

        if (state === 'RUNNING' || state === 'BOSS_WARNING' || state === 'BOSS_FIGHT') {
            frame++;
            distanceTraveled += gameSpeed / 10;
            score++;

            // Update Logic
            updatePlayer();

            // World Scrolling
            // Enemies move left
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].x -= gameSpeed;
                if (enemies[i].x < -100) enemies.splice(i, 1);
            }

            // Projectiles move
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity on ball
                if (p.y > height + 50 || p.x < -50) projectiles.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Boss Trigger
            if (state === 'RUNNING' && distanceTraveled > GAME.bossDistance) {
                state = 'BOSS_WARNING';
                if (activeLoopId !== 'warning') {
                    audio.playSFX('warning', { minInterval: 500, playbackRate: 1.02 });
                    activeLoopId = 'warning';
                }
                // Show Boss HUD
                document.getElementById('boss-hud').classList.remove('hidden');
                boss.active = true;
                state = 'BOSS_FIGHT';
            }

            // Spawning
            if (state === 'RUNNING') {
                spawnEnemy();
            }

            // Boss Logic
            if (state === 'BOSS_FIGHT') {
                updateBoss();
            }

            checkCollisions();
            updateUI();
        }

        // Draw Entities
        drawEnemies();
        drawBoss();
        drawProjectiles();
        drawPlayer();
        drawParticles();

        requestAnimationFrame(loop);
    }

    /* --- DOM BINDINGS --- */
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('start', { minInterval: 250 });
        audio.playSFX('uiClick', { minInterval: 250, volume: 0.24 });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initGame();
        loop();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('uiClick', { minInterval: 250 });
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('boss-hud').classList.add('hidden');
        initGame();
        // Loop is usually still running, but init resets state
    });

    document.getElementById('win-restart-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('uiClick', { minInterval: 250 });
        document.getElementById('victory-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('boss-hud').classList.add('hidden');
        initGame();
    });

    // Initial render
    resize();
    drawBackground();
    drawGround();
    // Draw static player
    player.x = width * 0.2;
    player.y = groundY - player.r;
    drawPlayer();

    </script>
</body>
