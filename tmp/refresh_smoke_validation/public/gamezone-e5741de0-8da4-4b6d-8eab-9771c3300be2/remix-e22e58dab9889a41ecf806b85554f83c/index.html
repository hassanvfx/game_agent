<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rage Invaders</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060816;
            --bg-deep: #050510;
            --panel: rgba(11, 16, 34, 0.84);
            --panel-strong: rgba(16, 22, 46, 0.94);
            --line: rgba(120, 242, 255, 0.35);
            --cyan: #78f2ff;
            --cyan-strong: #00e7ff;
            --mint: #61ff98;
            --danger: #ff466a;
            --danger-dark: #cc143f;
            --text: #f2f7ff;
            --muted: #afbbd6;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 231, 255, 0.12), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 70, 106, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Exo 2', sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(rgba(120, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: 0.35;
        }

        body::after {
            background: radial-gradient(circle at center, transparent 50%, rgba(0, 0, 0, 0.42) 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .font-game {
            font-family: 'Audiowide', sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: max(10px, env(safe-area-inset-right));
            bottom: max(18px, calc(env(safe-area-inset-bottom) + 18px));
            width: min(28vw, 120px);
            border-radius: 18px;
            border: 1px solid rgba(120, 242, 255, 0.24);
            background: rgba(8, 12, 24, 0.72);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 55;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            top: max(84px, calc(env(safe-area-inset-top) + 84px));
            bottom: auto;
            width: min(40vw, 168px);
            transform: translate(-50%, -8px) scale(0.96);
        }

        .feedback-gif.fail.visible {
            transform: translate(-50%, 0) scale(1);
        }

        .screen-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .hud-chip,
        .alert-chip {
            border-radius: 16px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(12, 18, 36, 0.86), rgba(8, 12, 24, 0.94));
            box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .hud-chip {
            padding: 10px 14px;
            min-width: min(78vw, 280px);
        }

        .hud-label {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: clamp(20px, 4vw, 30px);
            line-height: 1;
            font-weight: 800;
            color: var(--cyan);
            text-shadow: 0 0 14px rgba(0, 231, 255, 0.45);
        }

        .alert-chip {
            padding: 6px 12px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ffd7df;
            border-color: rgba(255, 70, 106, 0.38);
            box-shadow: 0 0 22px rgba(255, 70, 106, 0.18);
            animation: pulse-alert 0.7s ease-in-out infinite alternate;
        }

        .panel {
            width: min(92vw, 420px);
            padding: 18px;
            border-radius: 24px;
            border: 1px solid var(--line);
            background:
                radial-gradient(circle at top, rgba(120, 242, 255, 0.12), transparent 35%),
                linear-gradient(180deg, rgba(17, 24, 49, 0.94), rgba(7, 11, 24, 0.96));
            box-shadow: var(--shadow), 0 0 40px rgba(0, 231, 255, 0.08);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        .panel-frame {
            border-radius: 20px;
            border: 1px solid rgba(120, 242, 255, 0.12);
            padding: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
        }

        .panel-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(97, 255, 152, 0.1);
            border: 1px solid rgba(97, 255, 152, 0.26);
            color: var(--mint);
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .panel-eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 12px currentColor;
        }

        .title {
            margin: 0 0 10px;
            font-size: clamp(34px, 11vw, 62px);
            line-height: 0.92;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-shadow: 0 0 22px rgba(0, 231, 255, 0.2);
        }

        .title-accent {
            color: var(--mint);
            text-shadow: 0 0 24px rgba(97, 255, 152, 0.32);
        }

        .copy {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
            letter-spacing: 0.04em;
        }

        .character-card {
            position: relative;
            margin: 0 auto 16px;
            width: 132px;
            height: 132px;
            border-radius: 28px;
            border: 1px solid rgba(120, 242, 255, 0.22);
            background:
                radial-gradient(circle at 50% 38%, rgba(120, 242, 255, 0.28), transparent 36%),
                linear-gradient(180deg, rgba(8, 13, 31, 0.92), rgba(5, 9, 20, 0.98));
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(120, 242, 255, 0.08), 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .character-card::before,
        .character-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .character-card::before {
            inset: 16px;
            border: 1px dashed rgba(120, 242, 255, 0.24);
            animation: orbit-ring 8s linear infinite;
        }

        .character-card::after {
            width: 56px;
            height: 56px;
            left: 50%;
            top: 24px;
            transform: translateX(-50%);
            background:
                radial-gradient(circle at 30% 34%, #ffffff 0 10%, transparent 11%),
                radial-gradient(circle at 70% 34%, #ffffff 0 10%, transparent 11%),
                radial-gradient(circle at 32% 35%, #08111f 0 4%, transparent 5%),
                radial-gradient(circle at 68% 35%, #08111f 0 4%, transparent 5%),
                radial-gradient(circle at 50% 58%, rgba(120, 242, 255, 0.95), rgba(0, 231, 255, 0.55) 68%, transparent 70%);
            box-shadow: 0 0 26px rgba(0, 231, 255, 0.4);
            animation: hover-core 2.2s ease-in-out infinite;
        }

        .character-face {
            position: absolute;
            inset: 0;
        }

        .character-face .antenna,
        .character-face .antenna::after,
        .character-face .antenna::before {
            position: absolute;
            content: "";
        }

        .character-face .antenna {
            width: 4px;
            height: 28px;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, var(--cyan), rgba(120, 242, 255, 0.1));
        }

        .character-face .antenna::before {
            width: 18px;
            height: 18px;
            left: 50%;
            top: -10px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: radial-gradient(circle, #ffffff 0 24%, var(--mint) 25% 58%, rgba(97, 255, 152, 0.16) 59% 100%);
            box-shadow: 0 0 18px rgba(97, 255, 152, 0.5);
        }

        .character-face .antenna::after {
            width: 68px;
            height: 32px;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            border-bottom: 4px solid rgba(255, 255, 255, 0.82);
            border-radius: 0 0 40px 40px;
            opacity: 0.9;
        }

        .stats-row {
            display: flex;
            gap: 10px;
            margin: 0 0 16px;
        }

        .stat-box {
            flex: 1;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid rgba(120, 242, 255, 0.14);
            background: rgba(6, 10, 23, 0.56);
        }

        .stat-box strong {
            display: block;
            font-size: 17px;
            color: var(--cyan);
            margin-top: 2px;
        }

        .stat-box span {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .button {
            width: 100%;
            min-height: 52px;
            border: 0;
            border-radius: 999px;
            padding: 0 18px;
            cursor: pointer;
            color: var(--text);
            font: 800 18px/1 'Audiowide', sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease, background 140ms ease;
        }

        .button:active {
            transform: scale(0.97);
        }

        .button-primary {
            background: linear-gradient(180deg, var(--danger), var(--danger-dark));
            box-shadow: 0 12px 26px rgba(255, 70, 106, 0.28), 0 0 24px rgba(255, 70, 106, 0.18);
            animation: pulse-button 1.9s ease-in-out infinite;
        }

        .button-secondary {
            background: linear-gradient(180deg, rgba(120, 242, 255, 0.16), rgba(120, 242, 255, 0.08));
            border: 1px solid rgba(120, 242, 255, 0.28);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
        }

        .button:hover {
            filter: brightness(1.08);
        }

        .game-over .panel-eyebrow {
            background: rgba(255, 70, 106, 0.1);
            border-color: rgba(255, 70, 106, 0.24);
            color: #ff9ab0;
        }

        .game-over .title-accent,
        .danger-score {
            color: #ff8ca4;
            text-shadow: 0 0 24px rgba(255, 70, 106, 0.28);
        }

        .danger-score {
            margin: 0 0 18px;
            font-size: clamp(24px, 7vw, 34px);
            line-height: 1.05;
        }

        @keyframes pulse-button {
            0%, 100% { box-shadow: 0 12px 26px rgba(255, 70, 106, 0.24), 0 0 0 rgba(255, 70, 106, 0); }
            50% { box-shadow: 0 14px 30px rgba(255, 70, 106, 0.36), 0 0 0 10px rgba(255, 70, 106, 0.06); }
        }

        @keyframes pulse-alert {
            from { transform: translateY(0); box-shadow: 0 0 0 rgba(255, 70, 106, 0.16); }
            to { transform: translateY(-1px); box-shadow: 0 0 18px rgba(255, 70, 106, 0.24); }
        }

        @keyframes orbit-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes hover-core {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-4px); }
        }

        @media (max-width: 520px) {
            .panel {
                width: min(94vw, 400px);
                padding: 14px;
                border-radius: 20px;
            }

            .panel-frame {
                padding: 14px;
            }

            .copy {
                font-size: 13px;
            }

            .stats-row {
                gap: 8px;
            }

            .stat-box {
                padding: 9px 10px;
            }

            .hud-chip {
                min-width: min(76vw, 230px);
                padding: 9px 12px;
            }

            .alert-chip {
                font-size: 11px;
            }

            .button {
                min-height: 48px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "alienSpeed": { "type": "number", "label": "Alien Speed", "value": 3, "min": 1, "max": 10 },
    "spawnRate": { "type": "number", "label": "Spawn Rate (ms)", "value": 1500, "min": 500, "max": 3000 },
    "rageMultiplier": { "type": "number", "label": "Rage Speed Multiplier", "value": 2.5, "min": 1.5, "max": 5 }
}
</script>

<!-- [agent-note][stage3] resolved-font: title=Audiowide | ui=Exo 2 -> catalogs/fonts.json -->
<!-- [agent-note][stage3] resolved-audio: bgm/shoot/hit/warning/defeat/start -> catalogs/audios.json -->
<!-- [agent-note][stage3] resolved-gif: hit+fail feedback overlays -> catalogs/gifs.json -->
<audio id="bgm_battle" data-editable="audio" data-label="Battle BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="Start Shift SFX"></audio>
<audio id="sfx_shoot" data-editable="audio" data-label="Shoot SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3" preload="auto"></audio>
<audio id="sfx_hit" data-editable="audio" data-label="Agitate SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>
<audio id="sfx_warning" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_die" data-editable="audio" data-label="Defeat SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Game Over SFX"></audio>

<div id="game-container" class="screen-shell">
    <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <img
                id="gif-hit"
                class="feedback-gif"
                src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                alt="Arcade hit feedback"
                loading="lazy"
                decoding="async"
            >
            <img
                id="gif-fail"
                class="feedback-gif fail"
                src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
                alt="Game over reaction feedback"
                loading="lazy"
                decoding="async"
            >
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="hud" class="hud hidden">
            <div class="hud-chip">
                <div class="hud-label font-game">Threat Score</div>
                <div class="hud-value font-game"><span id="scoreVal">0</span></div>
            </div>
            <div class="alert-chip font-game hidden" id="rage-warning">Threat Agitated</div>
        </div>

        <div id="start-screen" class="panel">
            <div class="panel-frame">
                <div class="panel-eyebrow font-game">Calibration Bay</div>
                <div class="character-card" aria-hidden="true">
                    <div class="character-face">
                        <span class="antenna"></span>
                    </div>
                </div>
                <h1 class="title font-game">Calm<br><span class="title-accent">Breach</span></h1>
                <p class="copy">Tap each drone. The first hit agitates it. The second hit clears the breach before it crosses the red line.</p>
                <div class="stats-row" aria-hidden="true">
                    <div class="stat-box">
                        <span>Tag</span>
                        <strong class="font-game">Calm</strong>
                    </div>
                    <div class="stat-box">
                        <span>Tag Again</span>
                        <strong class="font-game">Purge</strong>
                    </div>
                </div>
                <button id="btn-start" class="button button-primary">Start Shift</button>
            </div>
        </div>

        <div id="game-over-screen" class="panel game-over hidden">
            <div class="panel-frame">
                <div class="panel-eyebrow font-game">Containment Lost</div>
                <h2 class="title font-game"><span class="title-accent">Barrier</span><br>Breached</h2>
                <div class="danger-score font-game">Threat Score: <span id="final-score">0</span></div>
                <button id="btn-restart" class="button button-secondary">Reset Grid</button>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = window.devicePixelRatio || 1;

let gameState = 'START';
let score = 0;
let lastTime = 0;
let spawnTimer = 0;
let shakeTime = 0;
let gridPulse = 0;

let aliens = [];
let particles = [];
let lasers = [];
let stars = [];

window.gameConfig = {
    alienSpeed: 3,
    spawnRate: 1500,
    rageMultiplier: 2.5
};
window.gameConfigDefs = {};

let audioCtx;
let lastWarningAt = 0;
let hitGifTimer = 0;
let failGifTimer = 0;

document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    resize();
    window.addEventListener('resize', resize);
    initStars();

    document.getElementById('btn-start').addEventListener('pointerdown', startGame);
    document.getElementById('btn-restart').addEventListener('pointerdown', resetGame);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });

    requestAnimationFrame(loop);
});

function parseConfig() {
    try {
        const script = document.getElementById('game-config');
        if (script) {
            const json = JSON.parse(script.textContent);
            window.gameConfigDefs = json;
            for (const key in json) {
                window.gameConfig[key] = json[key].value;
            }
        }
    } catch (e) {
        console.error('Config parse error', e);
    }
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const levels = {
        bgm_battle: 0.2,
        sfx_start: 0.45,
        sfx_shoot: 0.18,
        sfx_hit: 0.3,
        sfx_warning: 0.22,
        sfx_die: 0.34,
        sfx_fail: 0.4
    };

    Object.entries(levels).forEach(([id, volume]) => {
        const el = document.getElementById(id);
        if (el) el.volume = volume;
    });
}

function playMedia(id, reset = true) {
    const el = document.getElementById(id);
    if (!el) return false;
    if (reset) el.currentTime = 0;
    el.play().catch(() => {});
    return true;
}

function playSound(type) {
    if (!audioCtx) return;

    if (type === 'bgm') {
        playMedia('bgm_battle', false);
    } else if (type === 'start') {
        if (!playMedia('sfx_start')) synthHit();
    } else if (type === 'hit') {
        if (!playMedia('sfx_hit')) synthHit();
    } else if (type === 'warning') {
        if (!playMedia('sfx_warning')) synthHit();
    } else if (type === 'shoot') {
        if (!playMedia('sfx_shoot')) synthShoot();
    } else if (type === 'die') {
        if (!playMedia('sfx_die')) synthExplosion();
    } else if (type === 'fail') {
        if (!playMedia('sfx_fail')) synthExplosion();
    }
}

function synthShoot() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(820, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function synthHit() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.11);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.11);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.11);
}

function synthExplosion() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(12, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function initStars() {
    stars = [];
    for (let i = 0; i < 110; i++) {
        stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 2.3 + 0.2,
            speed: Math.random() * 0.55 + 0.08,
            alpha: Math.random() * 0.5 + 0.15
        });
    }
}

function startGame(e) {
    if (e) e.preventDefault();
    initAudio();
    playSound('start');
    playSound('bgm');

    gameState = 'PLAYING';
    score = 0;
    aliens = [];
    particles = [];
    lasers = [];
    spawnTimer = 0;
    gridPulse = 0;
    hitGifTimer = 0;
    failGifTimer = 0;
    toggleFeedbackGif('hit', false);
    toggleFeedbackGif('fail', false);

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('scoreVal').innerText = '0';
    document.getElementById('rage-warning').classList.add('hidden');
}

function resetGame(e) {
    if (e) e.preventDefault();
    startGame();
}

function gameOver() {
    if (gameState === 'GAMEOVER') return;
    gameState = 'GAMEOVER';
    playSound('fail');
    document.getElementById('bgm_battle').pause();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
    shakeTime = 20;
    showFeedbackGif('fail', 1600);
}

function handleInput(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const tx = e.clientX - rect.left;
    const ty = e.clientY - rect.top;

    playSound('shoot');
    lasers.push({ x: tx, y: ty, age: 0 });

    let hit = false;
    for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        const dx = tx - a.x;
        const dy = ty - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < a.radius + 20) {
            hitAlien(a, i);
            hit = true;
            break;
        }
    }

    if (!hit) {
        createParticles(tx, ty, '#78f2ff', 5);
    }
}

function hitAlien(alien, index) {
    if (!alien.isMad) {
        alien.isMad = true;
        alien.hp = 1;
        alien.color = '#ff466a';
        alien.glow = '#ff466a';
        alien.vx *= window.gameConfig.rageMultiplier;
        alien.vy *= window.gameConfig.rageMultiplier;
        playSound('hit');
        playWarningCue();
        createParticles(alien.x, alien.y, '#61ff98', 10);

        shakeTime = 5;
        showFeedbackGif('hit', 650);
        document.getElementById('rage-warning').classList.remove('hidden');
        setTimeout(() => document.getElementById('rage-warning').classList.add('hidden'), 500);
    } else {
        aliens.splice(index, 1);
        score += 100;
        document.getElementById('scoreVal').innerText = score;
        playSound('die');
        createParticles(alien.x, alien.y, '#ff466a', 20);
        shakeTime = 10;
        showFeedbackGif('hit', 850);
    }
}

function toggleFeedbackGif(type, visible) {
    const el = document.getElementById(type === 'fail' ? 'gif-fail' : 'gif-hit');
    if (el) {
        el.classList.toggle('visible', visible);
    }
}

function showFeedbackGif(type, duration) {
    if (type === 'hit') {
        hitGifTimer = duration;
        toggleFeedbackGif('hit', true);
    } else {
        failGifTimer = duration;
        toggleFeedbackGif('fail', true);
    }
}

function playWarningCue() {
    const now = performance.now();
    if (now - lastWarningAt < 450) return;
    lastWarningAt = now;
    playSound('warning');
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function update(dt) {
    gridPulse += dt * 0.0015;

    if (hitGifTimer > 0) {
        hitGifTimer -= dt;
        if (hitGifTimer <= 0) toggleFeedbackGif('hit', false);
    }

    if (failGifTimer > 0) {
        failGifTimer -= dt;
        if (failGifTimer <= 0) toggleFeedbackGif('fail', false);
    }

    if (gameState !== 'PLAYING') return;

    const w = window.innerWidth;
    const h = window.innerHeight;

    spawnTimer += dt;
    if (spawnTimer > window.gameConfig.spawnRate) {
        spawnTimer = 0;
        const r = 30;
        aliens.push({
            x: Math.random() * (w - 2 * r) + r,
            y: -r,
            vx: (Math.random() - 0.5) * window.gameConfig.alienSpeed * 10,
            vy: window.gameConfig.alienSpeed * 20,
            radius: r,
            isMad: false,
            hp: 2,
            color: '#61ff98',
            glow: '#61ff98',
            faceOffset: 0,
            pulse: Math.random() * Math.PI * 2
        });
    }

    for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        a.pulse += dt * 0.01;

        if (a.isMad) {
            a.x += a.vx * (dt / 16);
            a.y += a.vy * (dt / 16);

            if (a.x < a.radius || a.x > w - a.radius) a.vx *= -1;
            if (a.y < a.radius || a.y > h - a.radius) a.vy *= -1;

            a.faceOffset = (Math.random() - 0.5) * 5;
        } else {
            a.x += a.vx * (dt / 16) * 0.5;
            a.y += (a.vy * 0.5) * (dt / 16);
            a.faceOffset = Math.sin(Date.now() / 200) * 2;
        }

        if (a.y > h + 50) {
            if (!a.isMad) {
                aliens.splice(i, 1);
            }
        }

        if (a.y > h - 50) {
            gameOver();
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].age += dt;
        if (lasers[i].age > 200) lasers.splice(i, 1);
    }

    stars.forEach(s => {
        s.y += s.speed * (gameState === 'PLAYING' ? 1 : 0.1);
        if (s.y > h) {
            s.y = 0;
            s.x = Math.random() * w;
        }
    });

    if (shakeTime > 0) shakeTime--;
}

function drawGrid(w, h) {
    const spacing = 34;
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 242, 255, 0.07)';
    ctx.lineWidth = 1;

    for (let x = 0; x < w + spacing; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
    }

    for (let y = 0; y < h + spacing; y += spacing) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.16 + Math.sin(gridPulse) * 0.03;
    const gradient = ctx.createRadialGradient(w * 0.5, h * 0.14, 20, w * 0.5, h * 0.14, h * 0.9);
    gradient.addColorStop(0, 'rgba(120, 242, 255, 0.12)');
    gradient.addColorStop(0.5, 'rgba(13, 22, 48, 0.06)');
    gradient.addColorStop(1, 'rgba(5, 8, 16, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
}

function drawAlien(a) {
    const pulse = Math.sin(a.pulse) * 2;
    const bodyRadius = a.radius + pulse * 0.4;

    ctx.save();
    ctx.translate(a.x, a.y);

    ctx.strokeStyle = a.isMad ? 'rgba(255, 140, 164, 0.5)' : 'rgba(120, 242, 255, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, bodyRadius + 10 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowColor = a.glow;
    ctx.shadowBlur = a.isMad ? 24 : 16;
    const shell = ctx.createRadialGradient(-6, -8, 2, 0, 0, bodyRadius);
    shell.addColorStop(0, a.isMad ? '#ffd8e1' : '#f4ffff');
    shell.addColorStop(0.22, a.isMad ? '#ff93ac' : '#b1fff2');
    shell.addColorStop(0.75, a.color);
    shell.addColorStop(1, a.isMad ? '#b1153c' : '#139e63');
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.arc(0, 0, bodyRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = a.isMad ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 255, 255, 0.24)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -2, bodyRadius - 6, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();

    ctx.fillStyle = a.isMad ? '#ffb5c4' : '#dffeff';
    const eyeY = -4 + a.faceOffset * 0.35;

    ctx.beginPath();
    ctx.ellipse(-10, eyeY, 8, a.isMad ? 6 : 8, a.isMad ? 0.3 : 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(10, eyeY, 8, a.isMad ? 6 : 8, a.isMad ? -0.3 : 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#08111f';
    ctx.beginPath();
    ctx.arc(-10, eyeY, 3, 0, Math.PI * 2);
    ctx.arc(10, eyeY, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#08111f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (a.isMad) {
        ctx.moveTo(-10, 14);
        ctx.lineTo(10, 14);
        ctx.moveTo(-18, -16);
        ctx.lineTo(-2, -10);
        ctx.moveTo(18, -16);
        ctx.lineTo(2, -10);
    } else {
        ctx.arc(0, 5, 10, 0, Math.PI);
    }
    ctx.stroke();

    ctx.strokeStyle = a.isMad ? '#ff8ca4' : '#9cfed5';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -bodyRadius - 2);
    ctx.lineTo(0, -bodyRadius - 14);
    ctx.stroke();

    ctx.fillStyle = a.isMad ? '#ffcfda' : '#f9ffff';
    ctx.beginPath();
    ctx.arc(0, -bodyRadius - 18, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    let sx = 0;
    let sy = 0;
    if (shakeTime > 0) {
        sx = (Math.random() - 0.5) * shakeTime * 2;
        sy = (Math.random() - 0.5) * shakeTime * 2;
    }

    ctx.save();
    ctx.translate(sx, sy);

    const background = ctx.createLinearGradient(0, 0, 0, h);
    background.addColorStop(0, '#071022');
    background.addColorStop(0.45, '#060817');
    background.addColorStop(1, '#04050f');
    ctx.fillStyle = background;
    ctx.fillRect(-sx, -sy, w, h);

    drawGrid(w, h);

    stars.forEach(s => {
        ctx.globalAlpha = s.alpha + Math.sin((s.y + gridPulse * 60) * 0.03) * 0.08;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    aliens.forEach(drawAlien);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    lasers.forEach(l => {
        ctx.strokeStyle = '#78f2ff';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 1 - (l.age / 200);
        ctx.beginPath();
        ctx.moveTo(l.x - 18, l.y);
        ctx.lineTo(l.x + 18, l.y);
        ctx.moveTo(l.x, l.y - 18);
        ctx.lineTo(l.x, l.y + 18);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(l.x, l.y, l.age / 2, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.globalAlpha = 1;

    if (gameState === 'PLAYING') {
        ctx.strokeStyle = '#ff466a';
        ctx.lineWidth = 2;
        ctx.setLineDash([12, 9]);
        ctx.beginPath();
        ctx.moveTo(0, h - 50);
        ctx.lineTo(w, h - 50);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = 'rgba(255, 70, 106, 0.12)';
        ctx.fillRect(0, h - 50, w, 50);
    }

    ctx.restore();
}
