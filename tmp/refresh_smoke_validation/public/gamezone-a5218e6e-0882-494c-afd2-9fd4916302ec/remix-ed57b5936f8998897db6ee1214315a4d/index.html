<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tap the Lucky Orb</title>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #120f2f;
      --bg-bottom: #2d1657;
      --panel-dark: rgba(17, 14, 43, 0.86);
      --panel-mid: rgba(49, 30, 92, 0.88);
      --panel-bright: #62f2ff;
      --panel-warm: #ffd84d;
      --panel-pink: #ff7fd1;
      --line: #130f2f;
      --text-main: #f5f7ff;
      --text-dark: #130f2f;
      --spark-aqua: #8cf6ff;
      --spark-gold: #ffe46b;
      --spark-pink: #ff8de1;
      --glow: rgba(98, 242, 255, 0.35);
      --glow-strong: rgba(255, 141, 225, 0.28);
    }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 216, 77, 0.24), transparent 24%),
        radial-gradient(circle at 80% 12%, rgba(255, 127, 209, 0.22), transparent 20%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text-main);
      font-family: "Orbitron", "Trebuchet MS", system-ui, sans-serif;
    }

    #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .flex { display: flex; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .items-start { align-items: flex-start; }
    .items-center { align-items: center; }
    .gap-2 { gap: 0.5rem; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-4 { margin-top: 1rem; }
    .text-center { text-align: center; }
    .text-black { color: #111; }
    .rounded-xl { border-radius: 1rem; }
    .rounded-2xl { border-radius: 1.5rem; }
    .max-w-sm { max-width: 24rem; }
    .min-w-\[160px\] { min-width: 160px; }
    .min-h-\[52px\] { min-height: 52px; }
    .bg-lime-300 { background: #bef264; }
    .ui-top-pad { padding-top: max(12px, env(safe-area-inset-top)); }

    #ui-layer {
      pointer-events: none;
    }

    #hud,
    #game-over-screen {
      pointer-events: none;
    }

    #restart-btn {
      pointer-events: auto;
    }

    .memphis-card {
      border: 3px solid rgba(255,255,255,0.15);
      box-shadow:
        0 0 0 2px rgba(19, 15, 47, 0.85),
        0 14px 26px rgba(8, 7, 21, 0.34),
        0 0 22px var(--glow);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02)),
        linear-gradient(180deg, var(--panel-mid), rgba(13, 11, 33, 0.92));
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }

    .memphis-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.16), transparent 38%),
        repeating-linear-gradient(-45deg, rgba(140, 246, 255, 0.12) 0 8px, transparent 8px 16px);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .title-font {
      font-family: "Audiowide", "Orbitron", system-ui, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .ui-font {
      font-family: "Orbitron", "Trebuchet MS", system-ui, sans-serif;
      letter-spacing: 0.04em;
    }

    .mono-font {
      font-family: "Press Start 2P", "Courier New", monospace;
    }

    .hud-card {
      min-width: 122px;
      color: var(--text-main);
    }

    .hud-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 12px;
      line-height: 1.2;
      color: rgba(245, 247, 255, 0.92);
      text-shadow: 0 0 10px rgba(140, 246, 255, 0.22);
    }

    .hud-icon {
      font-size: 16px;
      filter: drop-shadow(0 0 8px rgba(255, 216, 77, 0.5));
    }

    .hud-value {
      margin-top: 0.2rem;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      color: white;
      text-shadow: 0 0 12px rgba(140, 246, 255, 0.18);
    }

    .spark-bank-card {
      background:
        radial-gradient(circle at top left, rgba(255, 216, 77, 0.26), transparent 35%),
        linear-gradient(180deg, rgba(49, 30, 92, 0.95), rgba(13, 11, 33, 0.94));
    }

    .time-card {
      background:
        radial-gradient(circle at top right, rgba(98, 242, 255, 0.28), transparent 34%),
        linear-gradient(180deg, rgba(49, 30, 92, 0.95), rgba(13, 11, 33, 0.94));
    }

    #intro-panel {
      max-width: 24rem;
      margin-top: 0.35rem;
      color: rgba(245, 247, 255, 0.94);
      background:
        radial-gradient(circle at top left, rgba(255, 127, 209, 0.18), transparent 32%),
        linear-gradient(180deg, rgba(29, 20, 63, 0.95), rgba(13, 11, 33, 0.92));
    }

    .intro-copy {
      font-size: 11px;
      line-height: 1.45;
    }

    .orbital-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orbital-frame span {
      position: absolute;
      border-radius: 999px;
      opacity: 0.6;
      animation: drift 8s ease-in-out infinite;
    }

    .orbital-frame span:nth-child(1) {
      top: 14%;
      left: 8%;
      width: 12px;
      height: 12px;
      background: var(--spark-gold);
      box-shadow: 0 0 18px rgba(255, 216, 77, 0.55);
    }

    .orbital-frame span:nth-child(2) {
      top: 22%;
      right: 10%;
      width: 8px;
      height: 8px;
      background: var(--spark-aqua);
      box-shadow: 0 0 16px rgba(140, 246, 255, 0.52);
      animation-delay: 1.2s;
    }

    .orbital-frame span:nth-child(3) {
      bottom: 18%;
      left: 14%;
      width: 10px;
      height: 10px;
      background: var(--spark-pink);
      box-shadow: 0 0 16px rgba(255, 141, 225, 0.55);
      animation-delay: 2.1s;
    }

    .orbital-frame span:nth-child(4) {
      bottom: 24%;
      right: 12%;
      width: 14px;
      height: 14px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 14px rgba(255,255,255,0.5);
      animation-delay: 0.6s;
    }

    .results-panel {
      color: var(--text-main);
      background:
        radial-gradient(circle at top center, rgba(98, 242, 255, 0.2), transparent 35%),
        linear-gradient(180deg, rgba(44, 28, 86, 0.96), rgba(13, 11, 33, 0.96));
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.12),
        0 18px 34px rgba(7, 7, 22, 0.4),
        0 0 24px var(--glow-strong);
    }

    .results-total {
      margin-top: 0.75rem;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .results-caption {
      margin: 0.4rem 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(245, 247, 255, 0.78);
    }

    #restart-btn {
      border: 0;
      color: var(--text-dark);
      background:
        linear-gradient(180deg, #ffe46b, #ffbf4d);
      box-shadow:
        0 0 0 2px rgba(19, 15, 47, 0.85),
        0 12px 24px rgba(7, 7, 22, 0.35),
        0 0 18px rgba(255, 216, 77, 0.35);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    #restart-btn:active {
      transform: scale(0.97);
      filter: brightness(1.05);
    }

    #impact-gif.is-visible,
    #result-gif.is-visible {
      opacity: 0.96 !important;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.45; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 0.85; }
    }

    @media (max-width: 420px) {
      .hud-card {
        min-width: 108px;
      }

      .hud-label {
        font-size: 11px;
      }

      .hud-value,
      .results-total {
        font-size: 22px;
      }

      .title-font {
        letter-spacing: 0.04em;
      }

      #intro-panel {
        max-width: min(15rem, calc(100vw - 2rem));
      }
    }
  </style>
</head>
<body>
  <div id="game-container" class="relative w-full h-full select-none">
    <div class="orbital-frame" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
      <div id="ui-layer" class="absolute inset-0 z-50">
        <div id="hud" class="p-3 ui-top-pad">
          <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="memphis-card spark-bank-card hud-card rounded-xl px-3 py-2">
                <div class="title-font hud-label"><span class="hud-icon">✨</span> Spark Bank</div>
                <div id="money-text" class="ui-font hud-value">0</div>
              </div>
              <div id="intro-panel" class="memphis-card rounded-xl px-3 py-2 mt-1">
                <div class="title-font intro-copy">Tap the lucky orb to shake loose sparks before the shift timer burns out.</div>
              </div>
            </div>
            <div class="memphis-card time-card hud-card rounded-xl px-3 py-2">
              <div class="title-font hud-label"><span class="hud-icon">⏱</span> Shift Time</div>
              <div id="time-text" class="ui-font hud-value">30.0</div>
            </div>
          </div>
        </div>
        <div id="game-over-screen" class="hidden absolute inset-0 items-center justify-center p-4">
          <div id="game-over-panel" class="memphis-card results-panel rounded-2xl p-5 w-full max-w-sm text-center">
            <h2 class="title-font" style="font-size:28px;line-height:1.1;margin:0;color:#fff;">Shift Complete</h2>
            <p class="ui-font results-total">Stored Sparks: <span id="final-money">0</span></p>
            <p class="ui-font results-caption">The orb cooled down, but your spark bank is ready for another rush.</p>
            <button id="restart-btn" class="mt-4 px-5 py-3 rounded-xl min-w-[160px] min-h-[52px] title-font" style="font-size:18px;line-height:1.1;">Run Again</button>
          </div>
        </div>
      </div>

      <!-- [agent-note][stage3] resolved-font: title/ui/accent -> catalogs/fonts.json (Audiowide, Orbitron, Press Start 2P) -->
      <!-- [agent-note][stage3] resolved-audio: gameplay loop + hit + collect + warning + results + restart -> catalogs/audios.json -->
      <!-- [agent-note][stage3] resolved-gif: impact + game-over reaction overlays -> catalogs/gifs.json -->
      <img id="asset_player" data-editable="image" data-label="Player Sprite" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_idle.png" hidden>
      <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
      <audio id="sfx_hit" data-editable="audio" data-label="Hit SFX URL Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
      <audio id="sfx_coin" data-editable="audio" data-label="Coin SFX URL Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
      <audio id="sfx_warning" data-editable="audio" data-label="Warning SFX URL Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
      <audio id="sfx_result" data-editable="audio" data-label="Result SFX URL Source" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
      <audio id="sfx_restart" data-editable="audio" data-label="Restart SFX URL Source" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
      <div id="feedback-gif-layer" class="absolute inset-0 z-50" style="pointer-events:none; overflow:hidden;">
        <img id="impact-gif" alt="" hidden style="position:absolute; left:50%; top:50%; width:min(34vw, 150px); transform:translate(-50%, -50%); opacity:0; transition:opacity 160ms ease; filter:drop-shadow(0 0 16px rgba(255,216,77,0.55));">
        <img id="result-gif" alt="" hidden style="position:absolute; right:12px; bottom:12px; width:min(32vw, 140px); max-width:140px; border-radius:16px; opacity:0; transition:opacity 220ms ease; box-shadow:0 10px 26px rgba(5,5,18,0.35);">
      </div>
    <script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 5, "min": 1, "max": 12 },
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#ffd93d" }
}
    </script>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const gameOverScreen = document.getElementById('game-over-screen');
    const moneyText = document.getElementById('money-text');
    const timeText = document.getElementById('time-text');
    const finalMoney = document.getElementById('final-money');
    const restartBtn = document.getElementById('restart-btn');
    const playerImg = document.getElementById('asset_player');
    const bgm = document.getElementById('bgm_main');
    const impactGif = document.getElementById('impact-gif');
    const resultGif = document.getElementById('result-gif');

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    for (const k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;
    window.updateGameConfig = (key, val) => {
      if (!(key in window.gameConfigDefs)) return;
      const def = window.gameConfigDefs[key];
      if (def.type === 'number') {
        const n = Number(val);
        if (!Number.isFinite(n)) return;
        window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
      } else if (def.type === 'color') {
        if (!/^#[0-9a-fA-F]{6}$/.test(String(val))) return;
        window.gameConfig[key] = String(val);
      } else {
        window.gameConfig[key] = val;
      }
    };

    let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1), initialized = false;
    let lastTime = 0;
    let gameState = 'PLAYING';
    let viewRect = {left:0, top:0, width:cw, height:ch};

    const state = {
      money: 0,
      timeLeft: 30,
      hero: null,
      coins: [],
      particles: [],
      bgShapes: [],
      shake: 0,
      combo: 0,
      comboTimer: 0,
      pointerDown: false,
      pointer: {x:0,y:0}
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sfxBuffers = {};
    const sfxElements = {};
    let audioUnlocked = false;
    let lowTimeCuePlayed = false;
    let lastHitSfxAt = 0;
    let hitGifTimer = null;
    let resultGifTimer = null;
    const uiFontStack = '700 13px "Press Start 2P"';
    const comboFontStack = '400 22px Audiowide';
    const gameSurface = canvas;

    const GIFS = {
      impact: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
      result: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
    };

    async function loadSfxBuffer(id){
      const el = document.getElementById(id);
      if (!el || !el.src) return;
      sfxElements[id] = el;
      try {
        const srcUrl = new URL(el.src, window.location.href);
        if (srcUrl.origin !== window.location.origin) return;
        const res = await fetch(srcUrl.href);
        const arr = await res.arrayBuffer();
        const buf = await audioCtx.decodeAudioData(arr);
        sfxBuffers[id] = buf;
      } catch (e) {}
    }

    function synthFallback(type){
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      if (type === 'hit'){
        o.type='square';
        o.frequency.setValueAtTime(180,t);
        o.frequency.exponentialRampToValueAtTime(90,t+0.08);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.15,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
        o.start(t); o.stop(t+0.11);
      } else {
        o.type='triangle';
        o.frequency.setValueAtTime(700,t);
        o.frequency.exponentialRampToValueAtTime(1200,t+0.06);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.12,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
        o.start(t); o.stop(t+0.09);
      }
    }

    function playSfx(id, options = {}){
      const now = performance.now();
      if (id === 'sfx_hit' && now - lastHitSfxAt < 80) return;
      if (id === 'sfx_hit') lastHitSfxAt = now;
      const volume = options.volume ?? ({ sfx_coin: 0.28, sfx_warning: 0.2, sfx_result: 0.32, sfx_restart: 0.22 }[id] ?? 0.3);
      const b = sfxBuffers[id];
      if (b){
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = b;
        gain.gain.value = volume;
        src.connect(gain); gain.connect(audioCtx.destination);
        src.start();
        return;
      }
      const el = sfxElements[id];
      if (el){
        try {
          const clone = el.cloneNode();
          clone.volume = Math.max(0, Math.min(1, volume));
          clone.play().catch(() => synthFallback(id === 'sfx_hit' ? 'hit':'coin'));
          return;
        } catch (e) {}
      }
      synthFallback(id === 'sfx_hit' ? 'hit':'coin');
    }

    function showImpactGif(x, y){
      if (!impactGif) return;
      impactGif.src = GIFS.impact;
      impactGif.hidden = false;
      impactGif.style.left = `${Math.max(58, Math.min(cw - 58, x))}px`;
      impactGif.style.top = `${Math.max(110, Math.min(ch - 92, y - 18))}px`;
      impactGif.classList.add('is-visible');
      clearTimeout(hitGifTimer);
      hitGifTimer = setTimeout(() => {
        impactGif.classList.remove('is-visible');
        impactGif.hidden = true;
      }, 380);
    }

    function setResultGif(visible){
      if (!resultGif) return;
      if (visible){
        resultGif.src = GIFS.result;
        resultGif.hidden = false;
        requestAnimationFrame(() => resultGif.classList.add('is-visible'));
      } else {
        resultGif.classList.remove('is-visible');
        clearTimeout(resultGifTimer);
        resultGifTimer = setTimeout(() => { resultGif.hidden = true; }, 220);
      }
    }

    function vibrate(style){
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action:'vibrate',
        requestId:'h5-' + Date.now(),
        version:'1.0',
        params:{style}
      });
    }

    function setState(next){
      gameState = next;
      if (gameState === 'PLAYING'){
        hud.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
        gameOverScreen.classList.remove('flex');
      } else {
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        gameOverScreen.classList.add('flex');
      }
    }

    function initGame(){
      state.money = 0;
      state.timeLeft = 30;
      state.coins.length = 0;
      state.particles.length = 0;
      state.combo = 0;
      state.comboTimer = 0;
      state.shake = 0;
      state.pointerDown = false;
      lowTimeCuePlayed = false;
      setResultGif(false);

      const r = Math.max(42, Math.min(cw, ch) * 0.12);
      state.hero = { x: cw*0.5, y: ch*0.58, r, squish:0, hitCD:0, vx: 120, vy: -90 };

      state.bgShapes = [];
      for (let i=0;i<16;i++){
        state.bgShapes.push({
          x: Math.random()*cw,
          y: Math.random()*ch,
          s: 12 + Math.random()*44,
          v: 8 + Math.random()*20,
          c: ['#8cf6ff','#ffe46b','#ff8de1','#8c7bff'][i%4]
        });
      }

      moneyText.textContent = '0';
      timeText.textContent = '30.0';
      finalMoney.textContent = '0';
      lastTime = 0;
    }

    function restartGame(){
      playSfx('sfx_restart');
      initGame();
      setState('PLAYING');
    }

    function unlockAudio(){
      if (!audioUnlocked){
        audioUnlocked = true;
      }
      audioCtx.resume().catch(()=>{});
      bgm.muted = false;
      bgm.volume = 0.2;
      bgm.play().catch(()=>{});
    }

    function spawnHitFx(x,y,r){
      for (let i=0;i<10;i++){
        const a = (Math.PI*2*i)/10 + Math.random()*0.3;
        const sp = 80 + Math.random()*180;
        state.particles.push({
          x,y,
          vx:Math.cos(a)*sp,
          vy:Math.sin(a)*sp,
          life:0.35,
          size:3+Math.random()*6,
          c:['#ffe46b','#8cf6ff','#ff8de1','#ffffff'][i%4]
        });
      }
      const cVal = 1 + Math.floor(Math.random()*4) + Math.min(5,Math.floor(state.combo/6));
      state.coins.push({x:x+(Math.random()*14-7),y:y-r*0.2,vx:(Math.random()*90-45),vy:-220-Math.random()*100,value:cVal,life:1.2});
      state.money += cVal;
      moneyText.textContent = String(state.money);
      state.shake = Math.min(8, state.shake + 2.8);
      state.combo++;
      state.comboTimer = 0.85;
      playSfx('sfx_hit');
      playSfx('sfx_coin');
      if (state.combo > 1 && state.combo % 5 === 0) playSfx('sfx_result', { volume: 0.18 });
      showImpactGif(x, y);
      vibrate('light');
    }

    function gameInput(e){
      if (!state.hero) return;
      const x = e.clientX - viewRect.left;
      const y = e.clientY - viewRect.top;
      state.pointer.x = x;
      state.pointer.y = y;
      if (e.type === 'pointerdown') state.pointerDown = true;
      if (e.type === 'pointerup' || e.type === 'pointercancel') state.pointerDown = false;

      if (e.type === 'pointerdown'){
        const hero = state.hero;
        const dx = x - hero.x, dy = y - hero.y;
        if (dx*dx + dy*dy <= hero.r*hero.r){
          hero.squish = 1;
          spawnHitFx(hero.x, hero.y, hero.r);
          const mag = Math.hypot(dx, dy) || 1;
          const nx = dx / mag, ny = dy / mag;
          const impulse = 260 + Math.min(500, window.gameConfig.heroSpeed * 45);
          hero.vx += nx * impulse;
          hero.vy += ny * impulse;
        }
      }
    }

    function inputRouter(e){
      unlockAudio();
      if (e && e.preventDefault) e.preventDefault();
      if (gameState === 'PLAYING') gameInput(e);
    }

    function handleRestartClick(e){
      unlockAudio();
      if (e && e.preventDefault) e.preventDefault();
      if (gameState === 'GAMEOVER') restartGame();
    }

    function resize(w,h,left,top){
      cw = w; ch = h;
      viewRect.left = left; viewRect.top = top; viewRect.width = w; viewRect.height = h;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);

      if (initialized && state.hero){
        const r = state.hero.r;
        state.hero.x = Math.max(r, Math.min(cw-r, state.hero.x));
        state.hero.y = Math.max(r+80, Math.min(ch-r, state.hero.y));
      }
    }

    function update(dt){
      dt = Math.min(dt, 0.05);
      if (gameState !== 'PLAYING') return;

      state.timeLeft -= dt;
      if (state.timeLeft <= 0){
        state.timeLeft = 0;
        finalMoney.textContent = String(state.money);
        setState('GAMEOVER');
        setResultGif(true);
        bgm.pause();
        playSfx('sfx_warning', { volume: 0.18 });
        playSfx('sfx_result', { volume: 0.34 });
        vibrate('heavy');
      }
      timeText.textContent = state.timeLeft.toFixed(1);
      if (!lowTimeCuePlayed && state.timeLeft <= 8 && state.timeLeft > 0){
        lowTimeCuePlayed = true;
        playSfx('sfx_warning', { volume: 0.2 });
      }

      const hero = state.hero;
      if (hero){
        if (!Number.isFinite(hero.x) || !Number.isFinite(hero.y)){
          hero.x = cw*0.5; hero.y = ch*0.58; hero.vx = 120; hero.vy = -90;
        }
        hero.squish = Math.max(0, hero.squish - dt*5.5);
        hero.hitCD = Math.max(0, hero.hitCD - dt);

        const speedScale = Math.min(12, window.gameConfig.heroSpeed) / 5;
        hero.x += hero.vx * dt * speedScale;
        hero.y += hero.vy * dt * speedScale;

        hero.vx *= Math.pow(0.998, dt * 60);
        hero.vy *= Math.pow(0.998, dt * 60);

        const r = hero.r;
        if (hero.x - r <= 0){ hero.x = r; hero.vx = Math.abs(hero.vx); state.shake = Math.min(8, state.shake + 1.2); playSfx('sfx_hit'); }
        if (hero.x + r >= cw){ hero.x = cw-r; hero.vx = -Math.abs(hero.vx); state.shake = Math.min(8, state.shake + 1.2); playSfx('sfx_hit'); }
        if (hero.y - r <= 70){ hero.y = 70+r; hero.vy = Math.abs(hero.vy); state.shake = Math.min(8, state.shake + 1.2); playSfx('sfx_hit'); }
        if (hero.y + r >= ch){ hero.y = ch-r; hero.vy = -Math.abs(hero.vy); state.shake = Math.min(8, state.shake + 1.2); playSfx('sfx_hit'); }
      }

      state.comboTimer -= dt;
      if (state.comboTimer <= 0) state.combo = 0;
      state.shake = Math.max(0, state.shake - dt*18);

      for (let i=state.coins.length-1;i>=0;i--){
        const c = state.coins[i];
        c.life -= dt;
        c.vy += 480*dt;
        c.x += c.vx*dt;
        c.y += c.vy*dt;
        const tx = 62, ty = 62;
        const dx = tx - c.x, dy = ty - c.y;
        const d = Math.hypot(dx,dy) || 1;
        if (c.life < 0.6){
          c.x += (dx/d)*220*dt;
          c.y += (dy/d)*220*dt;
        }
        if (d < 22 || c.life <= 0) state.coins.splice(i,1);
      }

      for (let i=state.particles.length-1;i>=0;i--){
        const p = state.particles[i];
        p.life -= dt;
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.vy += 380*dt;
        if (p.life <= 0) state.particles.splice(i,1);
      }

      for (const b of state.bgShapes){
        b.y += b.v*dt;
        if (b.y - b.s > ch) b.y = -b.s;
      }
    }

    function draw(){
      const sx = (Math.random()-0.5)*state.shake;
      const sy = (Math.random()-0.5)*state.shake;
      ctx.save();
      ctx.translate(sx, sy);

      const grad = ctx.createLinearGradient(0,0,0,ch);
      grad.addColorStop(0,'#130f34');
      grad.addColorStop(0.55,'#2d1657');
      grad.addColorStop(1,'#4e2366');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,cw,ch);

      const glow = ctx.createRadialGradient(cw*0.5, ch*0.4, 24, cw*0.5, ch*0.4, Math.max(cw, ch)*0.7);
      glow.addColorStop(0,'rgba(255, 216, 77, 0.14)');
      glow.addColorStop(0.45,'rgba(140, 246, 255, 0.08)');
      glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0,0,cw,ch);

      for (const b of state.bgShapes){
        ctx.fillStyle = b.c;
        ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.s * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      const hero = state.hero;
      if (hero){
        const r = Math.max(0, hero.r);
        const squash = 1 - hero.squish*0.28;
        const stretch = 1 + hero.squish*0.22;
        ctx.save();
        ctx.translate(hero.x, hero.y);
        ctx.scale(stretch, squash);

        const aura = ctx.createRadialGradient(0, 0, r*0.1, 0, 0, r*1.4);
        aura.addColorStop(0,'rgba(255,255,255,0.88)');
        aura.addColorStop(0.4,'rgba(255, 228, 107, 0.55)');
        aura.addColorStop(1,'rgba(255, 141, 225, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, r*1.45, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, r*0.95, r*0.8, r*0.22, 0, 0, Math.PI*2);
        ctx.fill();

        if (playerImg.complete && playerImg.naturalWidth > 0){
          ctx.save();
          ctx.shadowColor = 'rgba(140,246,255,0.45)';
          ctx.shadowBlur = 18;
          ctx.drawImage(playerImg, -r, -r, r*2, r*2);
          ctx.restore();
        } else {
          const orbGrad = ctx.createRadialGradient(-r*0.25, -r*0.3, r*0.2, 0, 0, r);
          orbGrad.addColorStop(0, '#fff6ba');
          orbGrad.addColorStop(0.55, window.gameConfig.themeColor);
          orbGrad.addColorStop(1, '#ff7fd1');
          ctx.fillStyle = orbGrad;
          ctx.beginPath();
          ctx.arc(0,0,r,0,Math.PI*2);
          ctx.fill();
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = Math.max(2, r*0.05);
        ctx.beginPath();
        ctx.arc(0,0,r*0.88,0,Math.PI*2);
        ctx.stroke();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(-r*0.28,-r*0.15,Math.max(0,r*0.12),0,Math.PI*2);
        ctx.arc(r*0.28,-r*0.15,Math.max(0,r*0.12),0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-r*0.31,-r*0.18,Math.max(0,r*0.04),0,Math.PI*2);
        ctx.arc(r*0.25,-r*0.18,Math.max(0,r*0.04),0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = Math.max(3, r*0.08);
        ctx.beginPath();
        ctx.arc(0,r*0.1,Math.max(0,r*0.28),0.1*Math.PI,0.9*Math.PI);
        ctx.stroke();

        ctx.restore();
      }

      for (const c of state.coins){
        const coinGrad = ctx.createRadialGradient(c.x-3, c.y-3, 2, c.x, c.y, 11);
        coinGrad.addColorStop(0, '#fff7c0');
        coinGrad.addColorStop(0.5, '#ffe46b');
        coinGrad.addColorStop(1, '#ffb347');
        ctx.fillStyle = coinGrad;
        ctx.beginPath();
        ctx.arc(c.x,c.y,Math.max(0,10),0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#130f2f';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#130f2f';
        ctx.font = uiFontStack;
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('+', c.x, c.y+0.5);
      }

      for (const p of state.particles){
        ctx.globalAlpha = Math.max(0,p.life/0.35);
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.5, p.size * 0.4), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (state.combo > 1 && gameState === 'PLAYING'){
        ctx.fillStyle = '#fff4be';
        ctx.font = comboFontStack;
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(19,15,47,0.9)';
        ctx.lineWidth = 5;
        ctx.strokeText('CHAIN x'+state.combo, cw*0.5, ch*0.2);
        ctx.fillText('CHAIN x'+state.combo, cw*0.5, ch*0.2);
      }

      ctx.restore();
    }

    function loop(ts){
      try{
        const now = ts * 0.001;
        const dt = lastTime ? (now - lastTime) : 0.016;
        lastTime = now;
        update(dt);
        draw();
      } catch (e){}
      requestAnimationFrame(loop);
    }

    // [agent-note][stage4] repaired: mobile-action-path | element: canvas + #restart-btn | action: scoped pointer suppression to gameplay surface so button taps keep native click behavior
    gameSurface.addEventListener('pointerdown', inputRouter, {passive:false});
    gameSurface.addEventListener('pointerup', inputRouter, {passive:false});
    gameSurface.addEventListener('pointercancel', inputRouter, {passive:false});
    gameSurface.addEventListener('pointermove', (e) => {
      if (gameState !== 'PLAYING') return;
      e.preventDefault();
      gameInput(e);
    }, {passive:false});
    if (restartBtn) restartBtn.addEventListener('click', handleRestartClick, {passive:false});

    const ro = new ResizeObserver(entries => {
      const entry = entries[0];
      const cr = entry.contentRect;
      const left = entry.target.offsetLeft || 0;
      const top = entry.target.offsetTop || 0;
      resize(cr.width, cr.height, left, top);

      if (!initialized){
        Promise.all([loadSfxBuffer('sfx_hit'), loadSfxBuffer('sfx_coin'), loadSfxBuffer('sfx_warning'), loadSfxBuffer('sfx_result'), loadSfxBuffer('sfx_restart')]).then(()=>{});
        initGame();
        setState('PLAYING');
        bgm.volume = 0.2;
        bgm.play().catch(()=>{});
        initialized = true;
        requestAnimationFrame(loop);
      }
    });
    ro.observe(canvas);
  });
  </script>
