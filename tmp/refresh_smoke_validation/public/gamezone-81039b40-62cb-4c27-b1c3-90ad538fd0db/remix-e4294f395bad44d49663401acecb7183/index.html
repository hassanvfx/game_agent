    <style>

        .feedback-gif.active {

        }
        .feedback-caption {

<body>

<!-- Asset Declaration -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: bgm/sfx -> catalogs/audios.json -->

<script>
/**
 * SKY SIGNAL SWEEP - Architecture
 * Tap matching flocks to clear the channel. Adjacent pigs act as bonus targets.
 */

// --- §0 Constants & Config ---
const CONFIG_DEFS = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.fromEntries(Object.entries(CONFIG_DEFS).map(([k, v]) => [k, v.value]));
window.gameConfigDefs = CONFIG_DEFS;

const CONSTANTS = {
    COLS: 6,
    ROWS: 8,
    TYPES: ['RED', 'YELLOW', 'BLACK', 'BLUE', 'PIG'],
    COLORS: {
        RED: '#ef4444',
        YELLOW: '#fbbf24',
        BLACK: '#1f2937',
        BLUE: '#3b82f6',
        PIG: '#4ade80'
    }
};

const FEEDBACK_GIFS = {
    combo: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp',
    gameover: 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp'
};

// --- §1 State Management ---
let canvas, ctx;
let cw = 0, ch = 0;
let dpr = 1;
let ro;
let initialized = false;
let lastTime = 0;
let gameState = 'PLAYING';

// Audio
let audioCtx;
let audioBuffers = {};
let bgmStarted = false;
let feedbackTimeout = null;
let lowTimeWarningAt = null;

// Game State
let grid = []; // 2D array [col][row]
let particles = [];
let score = 0;
let timeLeft = 0;
let shakeTime = 0;
let comboMultiplier = 1;

// --- §2 Audio System ---
async function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    
    const loadBuffer = async (id, url) => {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn(`Failed audio ${id}`, e); }
    };

    const sfxList = [
        { id: 'clear', el: 'sfx_clear' },
        { id: 'blocked', el: 'sfx_blocked' },
        { id: 'bonus', el: 'sfx_bonus' },
        { id: 'restart', el: 'sfx_restart' },
        { id: 'gameover', el: 'sfx_gameover' }
    ];
    await Promise.all(sfxList.map(s => loadBuffer(s.id, document.getElementById(s.el).src)));
}

function playSfx(id, pitch = 1.0) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

    const buffer = audioBuffers[id];
    if (buffer) {
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = pitch;
        const gain = audioCtx.createGain();
        const volumes = {
            clear: 0.42,
            blocked: 0.26,
            bonus: 0.34,
            restart: 0.28,
            gameover: 0.36
        };
        gain.gain.value = volumes[id] ?? 0.3;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const toneMap = {
            clear: 240,
            blocked: 520,
            bonus: 760,
            restart: 640,
            gameover: 180
        };
        osc.type = id === 'gameover' ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(toneMap[id] || 440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
    }
}

function startBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    bgm.volume = 0.2;
    if (!bgmStarted) {
        bgm.play().then(() => {
            bgmStarted = true;
        }).catch(() => {});
    } else if (bgm.paused) {
        bgm.play().catch(() => {});
    }
}

function stopBgm() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    bgm.pause();
    bgm.currentTime = 0;
    bgmStarted = false;
}

function unlockAudio() {
    initAudio().catch(() => {});
    if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
    startBgm();
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 200 : 50);
    }
}

function showFeedback(kind, label, duration = 900) {
    const gifEl = document.getElementById('feedback-gif');
    const captionEl = document.getElementById('feedback-caption');
    if (!gifEl || !captionEl) return;

    gifEl.src = FEEDBACK_GIFS[kind] || FEEDBACK_GIFS.combo;
    captionEl.textContent = label;
    gifEl.classList.add('active');
    captionEl.classList.add('active');

    clearTimeout(feedbackTimeout);
    feedbackTimeout = setTimeout(() => {
        gifEl.classList.remove('active');
        captionEl.classList.remove('active');
    }, duration);
}

// --- §3 Lifecycle ---
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    ro = new ResizeObserver(entries => {
        const { width, height } = entries[0].contentRect;
        resize(width, height);
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(loop);
        }
    });
    ro.observe(canvas);
    
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);
});

function resize(width, height) {
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cw = width;
    ch = height;
    if (initialized) calculateLayout();
}

// --- §4 Game Logic ---

class Bird {
    constructor(col, row, type) {
        this.col = col;
        this.row = row;
        this.type = type || this.randomType();
        this.x = 0;
        this.y = -100; // Spawn above
        this.targetY = 0;
        this.scale = 1;
        this.vy = 0;
        this.popped = false;
        this.blink = Math.random() * 10;
    }

    randomType() {
        if (Math.random() < window.gameConfig.pigChance) return 'PIG';
        const types = ['RED', 'YELLOW', 'BLACK', 'BLUE'];
        return types[Math.floor(Math.random() * types.length)];
    }

    update(dt, cellW, cellH, startX, startY) {
        const destX = startX + this.col * cellW + cellW / 2;
        const destY = startY + this.row * cellH + cellH / 2;
        
        this.x = destX;
        this.targetY = destY;

        if (this.y < this.targetY) {
            this.vy += window.gameConfig.fallSpeed * 100 * dt;
            this.y += this.vy * dt;
            if (this.y > this.targetY) {
                this.y = this.targetY;
                this.vy = 0;
                this.scale = 1.1; 
            }
        } else {
            this.y = this.targetY;
            this.vy = 0;
        }

        if (this.scale > 1) this.scale -= dt * 2;
        if (this.scale < 1) this.scale = 1;

        this.blink += dt;
    }

    draw(ctx, r) {
        const size = r * this.scale;
        const isPig = this.type === 'PIG';
        const isTriangle = this.type === 'YELLOW';
        
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = 'rgba(2, 6, 23, 0.28)';
        ctx.beginPath();
        ctx.ellipse(5, size * 0.95, size * 0.92, size * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(103, 232, 249, 0.12)';
        ctx.lineWidth = Math.max(2, size * 0.08);
        ctx.beginPath();
        ctx.arc(0, 0, size * 1.08, 0, Math.PI * 2);
        ctx.stroke();

        if (isTriangle) {
            const shellGradient = ctx.createLinearGradient(0, -size, 0, size);
            shellGradient.addColorStop(0, '#fde68a');
            shellGradient.addColorStop(1, '#f59e0b');
            ctx.fillStyle = shellGradient;
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(size * 0.92, size * 0.92);
            ctx.lineTo(-size * 0.92, size * 0.92);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.moveTo(-size * 0.16, -size * 0.72);
            ctx.lineTo(size * 0.44, size * 0.36);
            ctx.lineTo(0, size * 0.42);
            ctx.closePath();
            ctx.fill();
        } else {
            const shellGradient = ctx.createLinearGradient(-size, -size, size, size);
            const baseColor = CONSTANTS.COLORS[this.type];
            shellGradient.addColorStop(0, '#ffffff');
            shellGradient.addColorStop(0.18, baseColor);
            shellGradient.addColorStop(1, this.type === 'BLACK' ? '#0f172a' : baseColor);
            ctx.fillStyle = shellGradient;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.arc(-size * 0.28, -size * 0.34, size * 0.38, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = isPig ? 'rgba(15, 118, 110, 0.18)' : 'rgba(15, 23, 42, 0.16)';
        if (isTriangle) {
            ctx.beginPath();
            ctx.moveTo(-size * 0.64, size * 0.46);
            ctx.lineTo(size * 0.64, size * 0.46);
            ctx.lineTo(0, size * 0.9);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.ellipse(0, size * 0.42, size * 0.72, size * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        const blink = Math.sin(this.blink) > 0.98;
        if (!blink) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-size * 0.3, -size * 0.1, size * 0.24, 0, Math.PI * 2);
            ctx.arc(size * 0.3, -size * 0.1, size * 0.24, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-size * 0.28, -size * 0.08, size * 0.09, 0, Math.PI * 2);
            ctx.arc(size * 0.28, -size * 0.08, size * 0.09, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(-size * 0.32, -size * 0.13, size * 0.03, 0, Math.PI * 2);
            ctx.arc(size * 0.24, -size * 0.13, size * 0.03, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = Math.max(2, size * 0.08);
            ctx.beginPath();
            ctx.moveTo(-size * 0.48, -size * 0.08); ctx.lineTo(-size * 0.1, -size * 0.08);
            ctx.moveTo(size * 0.1, -size * 0.08); ctx.lineTo(size * 0.48, -size * 0.08);
            ctx.stroke();
        }

        if (this.type === 'RED' || this.type === 'BLACK') {
            ctx.strokeStyle = this.type === 'RED' ? '#7f1d1d' : '#020617';
            ctx.lineWidth = Math.max(3, size * 0.1);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-size * 0.56, -size * 0.38);
            ctx.lineTo(-size * 0.06, -size * 0.48);
            ctx.moveTo(size * 0.06, -size * 0.48);
            ctx.lineTo(size * 0.56, -size * 0.38);
            ctx.stroke();
        }
        if (this.type === 'BLUE') {
            ctx.strokeStyle = '#bfdbfe';
            ctx.lineWidth = Math.max(2, size * 0.08);
            ctx.beginPath();
            ctx.arc(0, -size * 0.55, size * 0.24, Math.PI, Math.PI * 2);
            ctx.stroke();
        }

        if (isPig) {
            ctx.fillStyle = '#bbf7d0';
            ctx.beginPath();
            ctx.ellipse(0, size * 0.22, size * 0.38, size * 0.28, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.arc(-size * 0.14, size * 0.22, size * 0.08, 0, Math.PI * 2);
            ctx.arc(size * 0.14, size * 0.22, size * 0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(-size * 0.68, -size * 0.42);
            ctx.lineTo(-size * 0.34, -size * 0.92);
            ctx.lineTo(-size * 0.08, -size * 0.38);
            ctx.closePath();
            ctx.moveTo(size * 0.68, -size * 0.42);
            ctx.lineTo(size * 0.34, -size * 0.92);
            ctx.lineTo(size * 0.08, -size * 0.38);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-size * 0.22, size * 0.08);
            ctx.lineTo(size * 0.22, size * 0.08);
            ctx.lineTo(0, size * 0.42);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 400;
        this.vy = (Math.random() - 0.5) * 400 - 200;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 5 + 3;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 800 * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

let layout = { cellW: 0, cellH: 0, startX: 0, startY: 0 };

function calculateLayout() {
    const margin = 20;
    const topOffset = 120;
    const availW = cw - margin * 2;
    const availH = ch - topOffset - margin;
    
    const cellW = availW / CONSTANTS.COLS;
    const cellH = Math.min(cellW, availH / CONSTANTS.ROWS);
    
    layout = {
        cellW, cellH,
        startX: margin + (availW - cellW * CONSTANTS.COLS) / 2,
        startY: topOffset + (availH - cellH * CONSTANTS.ROWS) / 2
    };
}

function initGame() {
    score = 0;
    timeLeft = window.gameConfig.timeLimit;
    grid = [];
    particles = [];
    lowTimeWarningAt = null;
    calculateLayout();
    
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        grid[c] = [];
        for (let r = 0; r < CONSTANTS.ROWS; r++) {
            grid[c][r] = new Bird(c, r);
            grid[c][r].y = -500 - Math.random() * 500;
        }
    }
    
    setState('PLAYING');
    updateUI();
}

function setState(state) {
    gameState = state;
    const go = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    
    if (state === 'PLAYING') {
        go.classList.add('hidden');
        hud.classList.remove('opacity-50');
        showFeedback('combo', 'channel online', 700);
    } else {
        go.classList.remove('hidden');
        hud.classList.add('opacity-50');
        document.getElementById('final-score').innerText = score;
        playSfx('gameover', 0.95);
        showFeedback('gameover', 'shift complete', 1800);
        vibrate('heavy');
    }
}

function handleGlobalInput(e) {
    unlockAudio();
    if (gameState === 'GAMEOVER') {
        if (e.target.id === 'restart-btn') {
            playSfx('restart', 1.05);
            initGame();
        }
        return;
    }
    if (gameState === 'PLAYING') handleGameInput(e);
}

function handleGameInput(e) {
    if (e.type !== 'pointerdown') return;
    e.preventDefault();
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const c = Math.floor((x - layout.startX) / layout.cellW);
    const r = Math.floor((y - layout.startY) / layout.cellH);
    
    if (c >= 0 && c < CONSTANTS.COLS && r >= 0 && r < CONSTANTS.ROWS) {
        attemptPop(c, r);
    }
}

function attemptPop(c, r) {
    const bird = grid[c][r];
    if (!bird || bird.popped || bird.type === 'PIG') {
        playSfx('blocked', 0.92);
        showFeedback('combo', 'bad lock', 450);
        return;
    }
    
    const matches = [];
    const visited = new Set();
    const queue = [{ c, r }];
    const type = bird.type;
    
    while (queue.length > 0) {
        const curr = queue.pop();
        const key = `${curr.c},${curr.r}`;
        if (visited.has(key)) continue;
        visited.add(key);
        
        const b = grid[curr.c][curr.r];
        if (b && !b.popped && b.type === type) {
            matches.push(b);
            if (curr.c > 0) queue.push({ c: curr.c - 1, r: curr.r });
            if (curr.c < CONSTANTS.COLS - 1) queue.push({ c: curr.c + 1, r: curr.r });
            if (curr.r > 0) queue.push({ c: curr.c, r: curr.r - 1 });
            if (curr.r < CONSTANTS.ROWS - 1) queue.push({ c: curr.c, r: curr.r + 1 });
        }
    }
    
    if (matches.length >= 2) {
        let pigHits = 0;
        matches.forEach(b => {
            b.popped = true;
            spawnParticles(b.x, b.y, CONSTANTS.COLORS[b.type]);
        });
        
        matches.forEach(b => {
            const neighbors = [
                { c: b.col - 1, r: b.row }, { c: b.col + 1, r: b.row },
                { c: b.col, r: b.row - 1 }, { c: b.col, r: b.row + 1 }
            ];
            neighbors.forEach(n => {
                if (n.c >= 0 && n.c < CONSTANTS.COLS && n.r >= 0 && n.r < CONSTANTS.ROWS) {
                    const neighborBird = grid[n.c][n.r];
                    if (neighborBird && neighborBird.type === 'PIG' && !neighborBird.popped) {
                        neighborBird.popped = true;
                        pigHits += 1;
                        spawnParticles(neighborBird.x, neighborBird.y, CONSTANTS.COLORS.PIG);
                        score += 50;
                        timeLeft += 2;
                    }
                }
            });
        });

        const points = matches.length * 10 * matches.length;
        score += points;
        timeLeft += matches.length * 0.2;
        
        playSfx('clear', 1.0 + Math.min(0.35, matches.length * 0.04));
        if (pigHits > 0) {
            playSfx('bonus', 1.05 + Math.min(0.2, pigHits * 0.05));
            showFeedback('combo', `bonus pig x${pigHits}`, 850);
        } else if (matches.length >= 4) {
            showFeedback('combo', `combo x${matches.length}`, 750);
        }
        vibrate(matches.length > 4 ? 'medium' : 'light');
        if (matches.length > 5) shakeTime = 0.2;
        
        updateUI();
    } else {
        playSfx('blocked');
        showFeedback('combo', 'need 2+', 450);
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function updateGrid(dt) {
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        for (let r = CONSTANTS.ROWS - 1; r >= 0; r--) {
            if (grid[c][r] && grid[c][r].popped) {
                grid[c][r] = null;
            }
        }
    }
    
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        for (let r = CONSTANTS.ROWS - 1; r >= 0; r--) {
            if (grid[c][r] === null) {
                for (let k = r - 1; k >= 0; k--) {
                    if (grid[c][k] !== null) {
                        grid[c][r] = grid[c][k];
                        grid[c][r].row = r;
                        grid[c][k] = null;
                        break;
                    }
                }
            }
        }
    }
    
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        for (let r = 0; r < CONSTANTS.ROWS; r++) {
            if (grid[c][r] === null) {
                grid[c][r] = new Bird(c, r);
                grid[c][r].y = layout.startY - 50;
            }
        }
    }
    
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        for (let r = 0; r < CONSTANTS.ROWS; r++) {
            grid[c][r].update(dt, layout.cellW, layout.cellH, layout.startX, layout.startY);
        }
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = score;
    const timeEl = document.getElementById('time-display');
    timeEl.innerText = Math.ceil(timeLeft);
    if (timeLeft < 5) {
        timeEl.classList.add('animate-pulse');
        const marker = Math.ceil(timeLeft);
        if (marker > 0 && marker !== lowTimeWarningAt) {
            lowTimeWarningAt = marker;
            playSfx('blocked', 1.15);
        }
    } else {
        timeEl.classList.remove('animate-pulse');
        lowTimeWarningAt = null;
    }
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    if (gameState === 'PLAYING') {
        timeLeft -= dt;
        if (timeLeft <= 0) {
            timeLeft = 0;
            setState('GAMEOVER');
        }
        updateGrid(dt);
        updateUI();
    }
    
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, '#081120');
    skyGradient.addColorStop(0.42, '#17305f');
    skyGradient.addColorStop(1, '#335fa8');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    const sunGlow = ctx.createRadialGradient(cw * 0.72, ch * 0.16, 0, cw * 0.72, ch * 0.16, Math.max(cw, ch) * 0.26);
    sunGlow.addColorStop(0, 'rgba(251, 191, 36, 0.22)');
    sunGlow.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, cw, ch);

    for (let i = 0; i < 5; i++) {
        const cx = ((timestamp * 0.05 + i * 200) % (cw + 400)) - 200;
        const cy = 100 + i * 150;
        const cloud = ctx.createLinearGradient(cx - 80, cy - 50, cx + 80, cy + 60);
        cloud.addColorStop(0, 'rgba(255,255,255,0.22)');
        cloud.addColorStop(1, 'rgba(191,219,254,0.1)');
        ctx.fillStyle = cloud;
        ctx.beginPath();
        ctx.arc(cx, cy, 60, 0, Math.PI * 2);
        ctx.arc(cx + 50, cy + 10, 70, 0, Math.PI * 2);
        ctx.arc(cx - 50, cy + 10, 50, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.save();
    ctx.strokeStyle = 'rgba(103, 232, 249, 0.12)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= CONSTANTS.COLS; c++) {
        const x = layout.startX + c * layout.cellW;
        ctx.beginPath();
        ctx.moveTo(x, layout.startY);
        ctx.lineTo(x, layout.startY + layout.cellH * CONSTANTS.ROWS);
        ctx.stroke();
    }
    for (let rLine = 0; rLine <= CONSTANTS.ROWS; rLine++) {
        const y = layout.startY + rLine * layout.cellH;
        ctx.beginPath();
        ctx.moveTo(layout.startX, y);
        ctx.lineTo(layout.startX + layout.cellW * CONSTANTS.COLS, y);
        ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.16)';
    ctx.lineWidth = 2;
    ctx.strokeRect(layout.startX, layout.startY, layout.cellW * CONSTANTS.COLS, layout.cellH * CONSTANTS.ROWS);
    ctx.restore();
    
    if (shakeTime > 0) {
        shakeTime -= dt;
        const mag = shakeTime * 20;
        ctx.save();
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    }
    
    const r = Math.min(layout.cellW, layout.cellH) * 0.4;
    for (let c = 0; c < CONSTANTS.COLS; c++) {
        for (let rIdx = 0; rIdx < CONSTANTS.ROWS; rIdx++) {
            if (grid[c][rIdx]) grid[c][rIdx].draw(ctx, r);
        }
    }
    
    if (shakeTime > 0) ctx.restore();
    
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    requestAnimationFrame(loop);
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig[key] !== undefined) {
        window.gameConfig[key] = val;
    }
};

</script>
