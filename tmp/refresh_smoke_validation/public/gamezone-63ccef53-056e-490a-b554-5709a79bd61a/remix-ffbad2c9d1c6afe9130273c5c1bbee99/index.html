<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Flux: Gravity Runner</title>
<link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Teko_wght_400_600_display_swap.css">
<style>
    :root {
        --bg: #050011;
        --bg-deep: #120024;
        --cyan: #00f3ff;
        --purple: #bc13fe;
        --red: #ff0055;
        --gold: #ffd700;
        --white: #ffffff;
        --panel: rgba(8, 10, 30, 0.82);
        --panel-border: rgba(0, 243, 255, 0.32);
        --mint: #84ffd7;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
            radial-gradient(circle at top, rgba(188, 19, 254, 0.22), transparent 28%),
            radial-gradient(circle at bottom, rgba(0, 243, 255, 0.14), transparent 32%),
            linear-gradient(180deg, var(--bg-deep), var(--bg));
        overflow: hidden;
        font-family: 'Teko', system-ui, sans-serif;
    }

    body {
        color: var(--white);
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            linear-gradient(90deg, transparent 0%, rgba(0, 243, 255, 0.08) 50%, transparent 100%);
        opacity: 0.45;
        mix-blend-mode: screen;
    }

    body::after {
        background: repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.045) 0 2px,
            transparent 2px 6px
        );
        opacity: 0.28;
    }

    canvas {
        display: block;
        touch-action: none;
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(14, 12, 42, 0.94), var(--panel));
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .neon-text {
        text-shadow: 0 0 10px currentColor;
    }

    .hidden {
        display: none !important;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
    }

    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 20% 22%, rgba(132, 255, 215, 0.18), transparent 0 18%),
            radial-gradient(circle at 82% 16%, rgba(188, 19, 254, 0.18), transparent 0 16%),
            radial-gradient(circle at 50% 82%, rgba(0, 243, 255, 0.12), transparent 0 20%);
        pointer-events: none;
        z-index: 0;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        letter-spacing: 1px;
        padding: 16px;
        box-sizing: border-box;
    }

    #ui-layer::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(180deg, rgba(0, 0, 0, 0.08), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.12));
        pointer-events: none;
    }

    #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 14px;
        min-width: 112px;
    }

    #hud .score-line {
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(0.8rem, 2.1vw, 1rem);
        line-height: 1.55;
        color: var(--cyan);
        font-weight: 400;
    }

    #hud .cubes-line {
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(0.72rem, 1.9vw, 0.88rem);
        line-height: 1.55;
        color: var(--gold);
    }

    .overlay-card {
        pointer-events: auto;
        position: relative;
        text-align: center;
        padding: 32px 28px;
        border-radius: 18px;
        width: min(92vw, 520px);
        overflow: hidden;
    }

    .overlay-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(135deg, rgba(132, 255, 215, 0.08), transparent 32%),
            linear-gradient(315deg, rgba(0, 243, 255, 0.08), transparent 38%);
        pointer-events: none;
    }

    .overlay-card > * {
        position: relative;
        z-index: 1;
    }

    #start-screen {
        transition: transform 300ms ease;
    }

    #start-screen:hover {
        transform: scale(1.03);
    }

    .screen-title {
        margin: 0 0 10px;
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(2.2rem, 8vw, 4.2rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .screen-subtitle {
        margin: 0 0 24px;
        font-size: clamp(0.95rem, 3vw, 1.2rem);
        opacity: 0.92;
        line-height: 1.5;
        max-width: 28rem;
        margin-inline: auto;
    }

    .character-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: clamp(72px, 18vw, 96px);
        height: clamp(72px, 18vw, 96px);
        margin-bottom: 18px;
        border-radius: 24px;
        border: 1px solid rgba(132, 255, 215, 0.45);
        background:
            radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.12) 18%, transparent 19%),
            radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.18), rgba(188, 19, 254, 0.12) 60%, transparent 61%),
            rgba(8, 16, 36, 0.88);
        box-shadow:
            0 0 28px rgba(0, 243, 255, 0.2),
            inset 0 0 24px rgba(132, 255, 215, 0.12);
        font-size: clamp(2rem, 8vw, 3rem);
    }

    .panel-kicker {
        display: inline-block;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(0.52rem, 1.8vw, 0.65rem);
        color: var(--mint);
        background: rgba(132, 255, 215, 0.08);
        border: 1px solid rgba(132, 255, 215, 0.22);
    }

    .result-line {
        margin: 0 0 8px;
        font-size: clamp(1rem, 3vw, 1.5rem);
        font-weight: 600;
    }

    .result-line.secondary {
        color: var(--gold);
        margin-bottom: 24px;
        font-size: clamp(0.95rem, 2.6vw, 1.2rem);
    }

    .action-btn {
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(0.95rem, 3vw, 1.15rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    }

    .action-btn:hover,
    .action-btn:focus-visible {
        transform: translateY(-1px);
        outline: none;
    }

    #start-btn {
        background: linear-gradient(180deg, #d652ff, #8d27ff);
        color: var(--white);
        box-shadow: 0 0 15px var(--purple);
    }

    #start-btn:hover,
    #start-btn:focus-visible {
        background: #d946ef;
    }

    #restart-btn {
        background: linear-gradient(180deg, #7cfdff, var(--cyan));
        color: #000000;
        box-shadow: 0 0 15px var(--cyan);
    }

    #restart-btn:hover,
    #restart-btn:focus-visible {
        background: #67e8f9;
    }

    .gif-feedback {
        position: absolute;
        right: 14px;
        width: min(24vw, 110px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 22px rgba(0, 243, 255, 0.18);
        background: rgba(5, 0, 17, 0.65);
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
        object-fit: cover;
        z-index: 55;
    }

    .gif-feedback.visible {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }

    #collect-gif {
        top: 92px;
    }

    #crash-gif {
        top: 214px;
    }

    .feedback-pill {
        position: absolute;
        right: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(8, 16, 36, 0.84);
        border: 1px solid rgba(132, 255, 215, 0.28);
        color: var(--mint);
        font-family: 'Teko', system-ui, sans-serif;
        font-size: clamp(0.68rem, 1.8vw, 0.8rem);
        letter-spacing: 0.08em;
        z-index: 56;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
    }

    .feedback-pill.visible {
        opacity: 1;
        transform: translateY(0);
    }

    #feedback-text {
        top: 56px;
    }

    @media (max-width: 640px) {
        #hud {
            top: 12px;
            left: 12px;
            padding: 8px 10px;
        }

        .overlay-card {
            padding: 24px 20px;
        }

        .screen-title {
            letter-spacing: 0.08em;
        }

        .gif-feedback,
        .feedback-pill {
            right: 12px;
        }

        #collect-gif {
            width: min(28vw, 92px);
            top: 86px;
        }

        #crash-gif {
            width: min(28vw, 92px);
            top: 190px;
        }
    }
</style>

<body>

<!-- [agent-note][stage4] repaired-font-remap: ui/title/hud switched to approved local Teko asset to remove non-catalog font refs -->

<audio id="bgm_main" data-editable="audio" data-label="BGM Tunnel Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- [agent-note][stage3] resolved-gif: collect/crash feedback overlays use catalogs/gifs.json and stay outside control lane -->
        <div id="feedback-text" class="feedback-pill">TUNNEL LIVE</div>
        <img id="collect-gif" class="gif-feedback" src="https://i.giphy.com/1zmG8avB83Uvm.webp" alt="Collection boost reaction" />
        <img id="crash-gif" class="gif-feedback" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash impact reaction" />

        <!-- HUD -->
        <div id="hud" class="hidden glass">
            <div class="score-line neon-text">SCORE: <span id="scoreVal">0</span></div>
            <div class="cubes-line neon-text">CUBES: <span id="cubesVal">0</span></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="glass overlay-card">
            <div class="panel-kicker">VOID SPRINTER</div>
            <div class="character-badge" aria-hidden="true">🤖</div>
            <h1 class="screen-title neon-text" style="color: var(--cyan);">NEON FLUX</h1>
            <p class="screen-subtitle">Guide the pulse-core courier through the tunnel. Tap, click, or press Space to flip gravity and thread incoming blockers.</p>
            <button id="start-btn" class="action-btn">
                START RUN
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden glass overlay-card">
            <div class="panel-kicker">CORE LOST</div>
            <h2 class="screen-title neon-text" style="color: var(--red); margin-bottom: 16px; letter-spacing: 0.08em;">SYSTEM FAILURE</h2>
            <div class="result-line">SCORE: <span id="finalScore">0</span></div>
            <div class="result-line secondary">CUBES: <span id="finalCubes">0</span></div>
            <button id="restart-btn" class="action-btn">
                RESTART RUN
            </button>
        </div>
    </div>
</div>

<script>
/** 
 * NEON FLUX: GRAVITY RUNNER
 * A pseudo-3D infinite runner using perspective projection logic on Canvas 2D.
 */

// --- §3 Configuration ---
const defaultConfig = {
    baseSpeed: 600,
    gravitySpeed: 15,
    neonCyan: "#00f3ff",
    neonPurple: "#bc13fe",
    hazardRed: "#ff0055"
};

window.gameConfig = { ...defaultConfig };
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

// --- §2 Technical Core ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on canvas bg

let state = {
    playing: false,
    gameOver: false,
    score: 0,
    cubes: 0,
    speed: 0,
    distance: 0,
    lastTime: 0,
    shake: 0,
    bgmStarted: false,
    nextSpawnZ: 2000
};

// 3D Projection Constants
const FOV = 400; // Field of View
const CAMERA_Y = -100; // Camera height offset
const CAMERA_Z = 0;
const TUNNEL_WIDTH = 600;
const TUNNEL_HEIGHT = 400;
const SEGMENT_DEPTH = 200;
const VISIBLE_SEGMENTS = 12;

// Entities
let player = { x: 0, y: 150, z: 200, radius: 20, targetY: 150, rotation: 0 };
let segments = []; // Tunnel segments
let obstacles = []; // Hazards and Collectibles
let particles = [];

const AudioContextCtor = window.AudioContext || window.webkitAudioContext;

class AudioManager {
    constructor() {
        this.ctx = AudioContextCtor ? new AudioContextCtor() : null;
        this.bgmNode = document.getElementById('bgm_main');
        this.nodes = {
            collect: document.getElementById('sfx_collect'),
            crash: document.getElementById('sfx_crash'),
            flip: document.getElementById('sfx_flip'),
            start: document.getElementById('sfx_start')
        };
        this.unlocked = false;
    }

    unlock() {
        if (this.unlocked) return Promise.resolve();
        if (!this.ctx) {
            this.unlocked = true;
            return Promise.resolve();
        }

        return this.ctx.resume()
            .then(() => {
                this.unlocked = true;
                if (state.playing) this.playBgm();
            })
            .catch(() => {});
    }

    playBgm() {
        this.bgmNode.volume = 0.2;
        if (!this.unlocked) return;
        if (this.bgmNode.paused) {
            this.bgmNode.play().catch(() => {});
        }
    }

    stopBgm(reset = false) {
        this.bgmNode.pause();
        if (reset) {
            this.bgmNode.currentTime = 0;
        }
    }

    playSfx(type) {
        if (!this.unlocked) return;
        const node = this.nodes[type];
        if (node) {
            try {
                node.pause();
                node.currentTime = 0;
                node.volume = type === 'crash' ? 0.52 : 0.42;
                node.play().catch(() => {});
                return;
            } catch (_) {}
        }

        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.24);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.24);
            return;
        }

        osc.type = type === 'collect' ? 'triangle' : 'square';
        osc.frequency.setValueAtTime(type === 'collect' ? 620 : 240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(type === 'collect' ? 1020 : 520, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
}

const audioManager = new AudioManager();
const feedbackText = document.getElementById('feedback-text');
const collectGif = document.getElementById('collect-gif');
const crashGif = document.getElementById('crash-gif');
let feedbackTimers = {};

function showFeedback(kind, label, duration = 900) {
    if (feedbackText) {
        feedbackText.textContent = label;
        feedbackText.classList.add('visible');
        clearTimeout(feedbackTimers.text);
        feedbackTimers.text = setTimeout(() => feedbackText.classList.remove('visible'), duration);
    }

    const gifMap = {
        collect: collectGif,
        crash: crashGif
    };

    const gifNode = gifMap[kind];
    if (!gifNode) return;

    gifNode.classList.add('visible');
    clearTimeout(feedbackTimers[kind]);
    feedbackTimers[kind] = setTimeout(() => gifNode.classList.remove('visible'), duration);
}

// --- Input Handling ---
function handleInput(e) {
    if (e.type === 'pointerdown') {
        if (!state.playing) return;
        e.preventDefault();
    }

    audioManager.unlock();

    if (!state.playing && !state.gameOver) {
        // Start Game
        startGame();
        return;
    }
    
    if (state.gameOver) {
        // Restart logic handled by button, but tap also works after delay
        return;
    }

    if (state.playing) {
        // Flip Gravity
        player.targetY = player.targetY === 150 ? -150 : 150;
        audioManager.playSfx('flip');
        showFeedback('collect', 'GRAVITY FLIP', 420);
        createParticles(player.x, 0, player.z, 10, '#ffffff'); // Burst at center
    }
}

// [agent-note][stage4] repaired: mobile-tap-action-path | element: #gameCanvas | action: scoped pointer suppression away from menu CTAs
canvas.addEventListener('pointerdown', handleInput, { passive: false });
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') handleInput(e);
});

// --- Game Logic ---

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    // We do NOT use scale() here because we want pixel control for 3D projection
}
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', resize);

function initGame() {
    state = {
        playing: false,
        gameOver: false,
        score: 0,
        cubes: 0,
        speed: window.gameConfig.baseSpeed,
        distance: 0,
        lastTime: performance.now(),
        shake: 0,
        bgmStarted: false,
        nextSpawnZ: 2000
    };

    player = { x: 0, y: 150, z: 300, radius: 15, targetY: 150, rotation: 0 };
    segments = [];
    obstacles = [];
    particles = [];

    // Pre-fill segments
    for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
        segments.push({ z: i * SEGMENT_DEPTH });
    }

    document.getElementById('hud').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    collectGif.classList.remove('visible');
    crashGif.classList.remove('visible');
    feedbackText.classList.remove('visible');
}

function startGame() {
    state.playing = true;
    state.gameOver = false;
    state.lastTime = performance.now();
    state.speed = window.gameConfig.baseSpeed;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');

    showFeedback('collect', 'RUN INITIATED', 900);
    audioManager.unlock();
    audioManager.playSfx('start');
    audioManager.playBgm();
}

function gameOver() {
    state.playing = false;
    state.gameOver = true;
    state.shake = 20;
    
    audioManager.stopBgm(true);
    audioManager.playSfx('crash');
    showFeedback('crash', 'SYSTEM FAILURE', 1600);
    
    document.getElementById('finalScore').innerText = Math.floor(state.score);
    document.getElementById('finalCubes').innerText = state.cubes;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
}

// --- 3D Helper Functions ---
function project(x, y, z) {
    // Basic Perspective Projection
    // Camera is at (0, 0, 0) looking down +Z (or we move world -Z)
    // Actually, let's keep camera static and move world towards it (-Z)
    // If z <= -FOV, it's behind camera.
    
    const scale = FOV / (FOV + z);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    
    return {
        x: cx + x * scale,
        y: cy + y * scale,
        scale: scale,
        visible: z > -FOV
    };
}

function spawnObstacle(z) {
    // 30% chance to spawn something
    if (Math.random() > 0.3) return;

    const type = Math.random();
    // 0.0-0.4: Floor Block, 0.4-0.8: Ceiling Block, 0.8-1.0: Cube
    
    let yPos = 0;
    let isHazard = true;
    
    if (type < 0.4) {
        yPos = 150; // Floor
    } else if (type < 0.8) {
        yPos = -150; // Ceiling
    } else {
        // Cube (Collectable) - can be anywhere, usually opposite to current hazard trend
        yPos = (Math.random() > 0.5 ? 150 : -150);
        isHazard = false;
    }

    obstacles.push({
        x: 0, // Center lane for now
        y: yPos,
        z: z,
        width: 60,
        height: 60,
        depth: 60,
        isHazard: isHazard,
        active: true,
        rotation: 0
    });
}

function createParticles(x, y, z, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 40,
            z: z,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            vz: (Math.random() - 0.5) * 200,
            life: 1.0,
            color: color
        });
    }
}

// --- Main Loop ---
function gameLoop(timestamp) {
    try {
        const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
        state.lastTime = timestamp;

        // Update
        if (state.playing) {
            // Speed progression
            state.speed += dt * 10; 
            state.distance += state.speed * dt;
            state.score += state.speed * dt * 0.01;

            // Player Physics (Lerp Y)
            const diff = player.targetY - player.y;
            player.y += diff * window.gameConfig.gravitySpeed * dt;
            player.rotation += dt * 5;

            // Move World (Segments)
            // We simulate infinite tunnel by recycling segments
            // The "world" moves -Z. 
            // Actually, easier: Keep segments relative to a 'scrollZ'
            //            
            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z -= state.speed * dt;
                obs.rotation += dt * 2;
                
                // Collision Detection
                // Simple AABB/Sphere check when Z is close
                if (obs.active && Math.abs(obs.z - player.z) < 50) {
                    // Check Y
                    if (Math.abs(obs.y - player.y) < 60) {
                        if (obs.isHazard) {
                            gameOver();
                        } else {
                            // Collect
                            obs.active = false;
                            state.cubes++;
                            state.score += 500;
                            audioManager.playSfx('collect');
                            showFeedback('collect', 'CUBE SECURED', 800);
                            createParticles(obs.x, obs.y, obs.z, 20, '#ffd700');
                        }
                    }
                }

                if (obs.z < -FOV) {
                    obstacles.splice(i, 1);
                }
            }

            // Recycle Segments
            // If the first segment is behind camera, move it to back
            if (segments[0].z < state.distance - FOV) {
                // This logic is tricky with absolute distance.
                // Let's make segments local Z and move them.
            }
        }

        // --- Render ---
        // Clear
        ctx.fillStyle = "#050011";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Shake
        let shakeX = 0, shakeY = 0;
        if (state.shake > 0) {
            shakeX = (Math.random() - 0.5) * state.shake;
            shakeY = (Math.random() - 0.5) * state.shake;
            state.shake *= 0.9;
            if (state.shake < 0.5) state.shake = 0;
        }
        
        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Calculate Scroll Offset
        const segmentOffset = state.distance % SEGMENT_DEPTH;

        // Draw Tunnel
        ctx.lineWidth = 2;
        
        // We draw from back to front (Painter's algo)
        // Generate visible segment positions relative to camera
        let renderSegments = [];
        for (let i = VISIBLE_SEGMENTS; i >= 0; i--) {
            let z = (i * SEGMENT_DEPTH) - segmentOffset;
            if (z < -100) continue; // Behind camera clipping
            renderSegments.push({ z: z, index: Math.floor((state.distance + z) / SEGMENT_DEPTH) });
        }

        // Draw connecting lines and frames
        for (let i = 0; i < renderSegments.length; i++) {
            const seg = renderSegments[i];
            const nextSeg = renderSegments[i+1]; // Closer segment (since we iterate far to near? No, array is far to near)
            
            // Project current
            const p = project(0, 0, seg.z);
            // We need 4 corners
            const w = TUNNEL_WIDTH;
            const h = TUNNEL_HEIGHT;
            
            // Corners: TL, TR, BR, BL
            const corners = [
                project(-w/2, -h/2, seg.z),
                project(w/2, -h/2, seg.z),
                project(w/2, h/2, seg.z),
                project(-w/2, h/2, seg.z)
            ];

            // Draw Wireframe Frame
            ctx.strokeStyle = `rgba(188, 19, 254, ${Math.min(1, 1000/(seg.z+500))})`; // Fade out far
            ctx.beginPath();
            ctx.moveTo(corners[0].x, corners[0].y);
            ctx.lineTo(corners[1].x, corners[1].y);
            ctx.lineTo(corners[2].x, corners[2].y);
            ctx.lineTo(corners[3].x, corners[3].y);
            ctx.closePath();
            ctx.stroke();

            // Draw Connecting Lines to previous (which is further away in the array? No wait)
            // Array is far to near. i=0 is furthest. i+1 is closer.
            // Actually let's draw lines from this segment to the next (closer) one
            if (nextSeg) {
                const nextCorners = [
                    project(-w/2, -h/2, nextSeg.z),
                    project(w/2, -h/2, nextSeg.z),
                    project(w/2, h/2, nextSeg.z),
                    project(-w/2, h/2, nextSeg.z)
                ];
                
                ctx.strokeStyle = `rgba(0, 243, 255, ${Math.min(0.3, 500/(seg.z+500))})`;
                for(let k=0; k<4; k++) {
                    ctx.beginPath();
                    ctx.moveTo(corners[k].x, corners[k].y);
                    ctx.lineTo(nextCorners[k].x, nextCorners[k].y);
                    ctx.stroke();
                }
            }
        }

        // Spawn logic needs to be tied to distance integer
        // Check if we passed a segment boundary
        const currentSegIndex = Math.floor(state.distance / SEGMENT_DEPTH);
        // We want to ensure obstacles exist for upcoming segments
        // Let's maintain obstacles array based on absolute Z logic relative to player
        
        // Quick fix: Just spawn randomly based on time/distance delta? 
        // Better: When distance crosses multiple of SEGMENT_DEPTH, spawn at Z = VISIBLE_SEGMENTS * SEGMENT_DEPTH
        // But we already have an obstacle array.
        // Let's just manage obstacles in the update loop: spawn at Z=2000 relative to player
        
        // Spawn Logic in loop
        if (state.playing) {
             // Spawn timer
             if (!state.nextSpawnZ) state.nextSpawnZ = state.distance + 2000;
             if (state.distance + 2000 > state.nextSpawnZ) {
                 spawnObstacle(2000); // Relative Z
                 state.nextSpawnZ += SEGMENT_DEPTH;
             }
        }

        // Draw Obstacles (Sort by Z far to near)
        obstacles.sort((a, b) => b.z - a.z);
        
        for (let obs of obstacles) {
            if (!obs.active) continue;
            // Project
            const p = project(obs.x, obs.y, obs.z);
            if (!p.visible) continue;
            
            const size = obs.width * p.scale;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            
            // Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = obs.isHazard ? window.gameConfig.hazardRed : '#ffd700';
            ctx.fillStyle = obs.isHazard ? window.gameConfig.hazardRed : '#ffd700';
            
            // Draw Cube/Rect
            if (obs.isHazard) {
                // Hazard Block
                ctx.fillRect(-size/2, -size/2, size, size);
                // Inner detail
                ctx.fillStyle = "#000";
                ctx.fillRect(-size/3, -size/3, size/1.5, size/1.5);
            } else {
                // Data Cube (Rotated)
                ctx.rotate(obs.rotation);
                ctx.fillRect(-size/3, -size/3, size/1.5, size/1.5);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.strokeRect(-size/2, -size/2, size, size);
            }
            
            ctx.restore();
        }

        // Draw Player
        if (state.playing || !state.gameOver) {
            const p = project(player.x, player.y, player.z);
            ctx.save();
            ctx.translate(p.x, p.y);
            
            // Trail effect (simple history? or just blur)
            // Speed lines
            
            // Player Sphere - preserve mechanics, boost identity for the pulse-core courier.
            const playerRadius = player.radius * p.scale;
            const glow = ctx.createRadialGradient(0, 0, playerRadius * 0.25, 0, 0, playerRadius * 1.35);
            glow.addColorStop(0, "rgba(255,255,255,0.95)");
            glow.addColorStop(0.35, "rgba(132,255,215,0.72)");
            glow.addColorStop(0.72, "rgba(0,243,255,0.22)");
            glow.addColorStop(1, "rgba(0,243,255,0)");

            ctx.shadowBlur = 26;
            ctx.shadowColor = window.gameConfig.neonCyan;
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, playerRadius * 1.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#040611";
            ctx.strokeStyle = window.gameConfig.neonCyan;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, playerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "rgba(132,255,215,0.9)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, playerRadius * 0.72, Math.PI * 0.18, Math.PI * 1.82);
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(-playerRadius * 0.2, -playerRadius * 0.15, playerRadius * 0.18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(132,255,215,0.95)";
            ctx.beginPath();
            ctx.arc(playerRadius * 0.16, playerRadius * 0.08, playerRadius * 0.24, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(188,19,254,0.95)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, playerRadius * 0.92, -Math.PI * 0.45, Math.PI * 0.1);
            ctx.stroke();
            
            ctx.restore();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let part = particles[i];
            part.x += part.vx * dt;
            part.y += part.vy * dt;
            part.z += part.vz * dt; // Particles move in 3D too
            part.z -= state.speed * dt; // Move with world
            part.life -= dt * 2;
            
            if (part.life <= 0 || part.z < -FOV) {
                particles.splice(i, 1);
                continue;
            }
            
            const pp = project(part.x, part.y, part.z);
            if (pp.visible) {
                ctx.globalAlpha = part.life;
                ctx.fillStyle = part.color;
                ctx.fillRect(pp.x, pp.y, 4 * pp.scale, 4 * pp.scale);
                ctx.globalAlpha = 1;
            }
        }

        // Speed Lines (Post Process)
        if (state.playing && state.speed > 800) {
            const cx = canvas.width/2;
            const cy = canvas.height/2;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let k=0; k<10; k++) {
                const angle = Math.random() * Math.PI * 2;
                const r1 = 100;
                const r2 = Math.max(canvas.width, canvas.height);
                ctx.moveTo(cx + Math.cos(angle)*r1, cy + Math.sin(angle)*r1);
                ctx.lineTo(cx + Math.cos(angle)*r2, cy + Math.sin(angle)*r2);
            }
            ctx.stroke();
        }

        ctx.restore();

        // UI Updates
        if(state.playing) {
            document.getElementById('scoreVal').innerText = Math.floor(state.score);
            document.getElementById('cubesVal').innerText = state.cubes;
        }

    } catch (e) {
        console.error(e);
    }
    
    requestAnimationFrame(gameLoop);
}

// Init
document.getElementById('start-btn').addEventListener('click', () => {
    audioManager.unlock();
    startGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
    audioManager.unlock();
    initGame();
    startGame();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        audioManager.stopBgm(false);
    } else if (state.playing) {
        audioManager.playBgm();
    }
});

initGame();
requestAnimationFrame(gameLoop);

</script>
