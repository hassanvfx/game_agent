<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Courier: Data Run</title>
    <!-- [agent-note][stage4] font-remap: title/ui copy use approved catalogs/fonts.json families -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #12071d;
            --bg-bottom: #041824;
            --panel: rgba(12, 16, 30, 0.82);
            --panel-border: rgba(99, 233, 255, 0.52);
            --panel-glow: rgba(255, 72, 179, 0.28);
            --text-main: #effbff;
            --text-soft: #9fd6f3;
            --accent: #63e9ff;
            --accent-2: #ff48b3;
            --warning: #ffdc5e;
            --danger: #ff5f7a;
            --shadow: rgba(3, 8, 15, 0.58);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(99, 233, 255, 0.18), transparent 28%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 18%, rgba(99, 233, 255, 0.08) 18% 18.4%, transparent 18.4% 50%, rgba(255, 72, 179, 0.07) 50% 50.3%, transparent 50.3% 82%, rgba(99, 233, 255, 0.08) 82% 82.35%, transparent 82.35% 100%);
            opacity: 0.55;
        }

        body::after {
            background:
                repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 6px);
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            isolation: isolate;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 14%, rgba(255, 220, 94, 0.16), transparent 18%),
                radial-gradient(circle at 20% 78%, rgba(99, 233, 255, 0.12), transparent 18%),
                radial-gradient(circle at 82% 22%, rgba(255, 72, 179, 0.14), transparent 20%);
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .glass {
            width: min(92vw, 420px);
            padding: 22px 20px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(20, 27, 47, 0.92), rgba(8, 11, 22, 0.92));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 40px var(--shadow),
                0 0 24px var(--panel-glow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .screen-title,
        .screen-subtitle,
        .hud-label,
        .action-btn {
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .screen-title {
            margin: 0 0 8px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.8rem, 8vw, 3rem);
            line-height: 0.96;
            color: var(--warning);
            text-shadow:
                0 0 10px rgba(255, 220, 94, 0.6),
                0 0 20px rgba(255, 72, 179, 0.38);
        }

        .screen-subtitle {
            margin: 0 0 18px;
            font-size: clamp(1rem, 4.8vw, 1.4rem);
            font-weight: 700;
            color: var(--text-soft);
        }

        .flavor-copy {
            margin: 0 0 20px;
            font-size: 0.95rem;
            line-height: 1.2;
            color: rgba(239, 251, 255, 0.78);
        }

        .action-btn {
            min-width: 168px;
            border: 1px solid rgba(99, 233, 255, 0.72);
            border-radius: 999px;
            padding: 14px 22px;
            background:
                linear-gradient(135deg, var(--accent-2), #ff7c66);
            color: white;
            font: 700 clamp(1rem, 4.2vw, 1.2rem) 'Exo 2', system-ui, sans-serif;
            box-shadow:
                0 10px 24px rgba(255, 72, 179, 0.32),
                inset 0 0 12px rgba(255, 255, 255, 0.14);
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .action-btn:active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .hud-panel {
            position: absolute;
            top: max(14px, env(safe-area-inset-top, 0px) + 10px);
            left: max(14px, env(safe-area-inset-left, 0px) + 10px);
            min-width: 120px;
            padding: 10px 14px;
            border-radius: 18px;
            background: rgba(8, 14, 28, 0.8);
            border: 1px solid rgba(99, 233, 255, 0.45);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
        }

        .hud-label {
            margin: 0;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.95rem, 3.8vw, 1.3rem);
            color: var(--warning);
            text-shadow: 0 0 10px rgba(255, 220, 94, 0.4);
        }

        .score-value,
        .final-score {
            color: var(--accent);
        }

        .status-title {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.6rem, 7vw, 2.6rem);
            color: #ff9eb7;
            text-shadow: 0 0 14px rgba(255, 95, 122, 0.42);
        }

        .status-copy {
            margin: 0 0 20px;
            font-size: clamp(1rem, 4.8vw, 1.4rem);
            font-weight: 600;
            color: var(--text-main);
        }

        .feedback-gif {
            position: absolute;
            right: max(12px, env(safe-area-inset-right, 0px) + 8px);
            bottom: max(18px, env(safe-area-inset-bottom, 0px) + 12px);
            width: clamp(92px, 20vw, 148px);
            aspect-ratio: 1;
            border-radius: 20px;
            border: 1px solid rgba(99, 233, 255, 0.36);
            box-shadow: 0 14px 28px rgba(2, 7, 14, 0.34);
            object-fit: cover;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 220ms ease, transform 220ms ease;
            pointer-events: none;
            z-index: 30;
            background: rgba(5, 12, 20, 0.55);
        }

        .feedback-gif.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 50%;
            right: auto;
            top: max(90px, env(safe-area-inset-top, 0px) + 78px);
            bottom: auto;
            width: min(48vw, 180px);
            transform: translate(-50%, -8px) scale(0.92);
        }

        .feedback-gif.fail.active {
            transform: translate(-50%, 0) scale(1);
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding: 12px;
            }

            .glass {
                width: min(94vw, 360px);
                padding: 18px 16px;
                border-radius: 20px;
            }

            .action-btn {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>

<!-- §3.1 Configuration Declaration -->
<script id="game-config" type="application/x-game-config">
{
    "baseSpeed": { "type": "number", "label": "Base Speed", "value": 10, "min": 5, "max": 25 },

</script>

<!-- §3.3 Media Declaration -->
<!-- Audio Assets -->
<!-- [agent-note][stage3] resolved-audio: start/collect/crash/lane -> catalogs/audios.json -->
<audio id="bgm_race" data-editable="audio" data-label="Racing BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_crash" data-editable="audio" data-label="Crash SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_score" data-editable="audio" data-label="Score SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>

<audio id="sfx_lane" data-editable="audio" data-label="Lane Shift SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<!-- UI Structure -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- Start Screen -->
        <div id="start-screen" class="glass">
            <h1 id="ui-title" class="screen-title">NEON COURIER</h1>
            <p class="screen-subtitle">Tap left or right to thread the courier through the signal lanes.</p>

            </button>

        <div id="hud" class="hud-panel hidden">

        <!-- [agent-note][stage3] resolved-gif: collect/fail feedback -> catalogs/gifs.json -->
        <img
            id="collect-gif"
            class="feedback-gif"

            id="fail-gif"
            class="feedback-gif fail"
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"

</div>

<script>
/**
 * §4 Iron Laws & Core Logic
 */

// --- Configuration ---
    window.gameConfigDefs = {
        "baseSpeed": { "type": "number", "label": "Base Speed", "value": 10, "min": 5, "max": 25 },
        "laneSpeed": { "type": "number", "label": "Lane Switch Speed", "value": 15, "min": 5, "max": 30 },
        "themeColor": { "type": "color", "label": "Accent Color", "value": "#DA251D" },
        "gameTitle": { "type": "text", "label": "Game Title", "value": "Neon Courier" }
    };

    window.gameConfig = {
        baseSpeed: 10,
        laneSpeed: 15,
        themeColor: "#DA251D",
        gameTitle: "Neon Courier"
    };

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') {
            const el = document.getElementById('ui-title');
            if(el) el.innerText = val;
            document.title = val;
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.mediaElements = {};
        this.bgmNode = null;
        this.bgmGain = null;
        this.bgmElement = null;
        this.initialized = false;
        this.lastPlayedAt = {};
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        this.ctx = new AudioContext();
        this.initialized = true;
        this.loadAssets();

        const unlock = () => {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);
    }

    loadAssets() {
        const sounds = [
            { id: 'bgm_race', loop: true },
            { id: 'sfx_crash' },
            { id: 'sfx_score' },
            { id: 'sfx_start' },
            { id: 'sfx_lane' }
        ];

        sounds.forEach(sound => {
            const el = document.getElementById(sound.id);
            if (!el || !el.src) return;

            this.mediaElements[sound.id] = el;
            el.volume = sound.id === 'bgm_race' ? 0.2 : 1;
            el.loop = Boolean(sound.loop);

            if (!this.ctx) return;

            fetch(el.src, { mode: 'cors' })
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`Failed to load ${sound.id}: ${res.status}`);
                    }
                    return res.arrayBuffer();
                })
                .then(data => this.ctx.decodeAudioData(data))
                .then(buffer => {
                    this.buffers[sound.id] = buffer;
                })
                .catch(() => {});
        });
    }

    playBgm() {
        this.stopBgm();

        if (this.ctx && this.buffers.bgm_race) {
            this.bgmNode = this.ctx.createBufferSource();
            this.bgmGain = this.ctx.createGain();
            this.bgmNode.buffer = this.buffers.bgm_race;
            this.bgmNode.loop = true;
            this.bgmGain.gain.value = 0.2;
            this.bgmNode.connect(this.bgmGain);
            this.bgmGain.connect(this.ctx.destination);
            this.bgmNode.start(0);
            return;
        }

        const el = this.mediaElements.bgm_race;
        if (el) {
            this.bgmElement = el;
            this.bgmElement.currentTime = 0;
            this.bgmElement.volume = 0.2;
            this.bgmElement.play().catch(() => {});
        }
    }

    stopBgm() {
        if (this.bgmNode) {
            try {
                this.bgmNode.stop();
            } catch (_) {}
            this.bgmNode.disconnect();
            this.bgmNode = null;
        }
        if (this.bgmGain) {
            this.bgmGain.disconnect();
            this.bgmGain = null;
        }
        if (this.bgmElement) {
            this.bgmElement.pause();
            this.bgmElement.currentTime = 0;
            this.bgmElement = null;
        }
    }

    playSfx(id, volume = 0.35, minGap = 90) {
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < minGap) return;
        this.lastPlayedAt[id] = now;

        if (this.ctx && this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[id];
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
            src.onended = () => {
                src.disconnect();
                gain.disconnect();
            };
            return;
        }

        const el = this.mediaElements[id];
        if (el) {
            const clone = el.cloneNode();
            clone.volume = Math.max(0, Math.min(1, volume));
            clone.play().catch(() => {});
            clone.addEventListener('ended', () => clone.remove(), { once: true });
            document.body.appendChild(clone);
            return;
        }

        if (this.ctx) {
            this.synthesize(id === 'sfx_crash' ? 'explosion' : 'beep', volume);
        }
    }

    synthesize(type, volume = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(16, this.ctx.currentTime + 0.45);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.45);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(680, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(920, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(volume * 0.7, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }
    }
}

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const collectGif = document.getElementById('collect-gif');
    const failGif = document.getElementById('fail-gif');

    // State
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let speedMultiplier = 1;
    let shake = 0;
    
    // Dimensions
    let cw, ch;
    let laneWidth;

    // Entities
    const lanes = [-1, 0, 1]; // Left, Center, Right
    let player = { lane: 0, x: 0, y: 0, targetX: 0, width: 0, height: 0, color: '#63E9FF' };
    let obstacles = [];
    let particles = [];
    let trackOffset = 0;
    let feedbackTimers = { collect: 0, fail: 0 };

    // --- Resizing ---
    function resize() {
        cw = window.innerWidth;
        ch = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        laneWidth = Math.min(cw / 3, 120);
        player.width = laneWidth * 0.6;
        player.height = player.width * 2.5;
        player.y = ch - player.height - 50;
        
        // Update player X immediately if not moving
        if (gameState !== 'PLAYING') {
            player.x = (cw / 2) + (player.lane * laneWidth);
            player.targetX = player.x;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Input ---
    function triggerGif(type, duration = 900) {
        const target = type === 'fail' ? failGif : collectGif;
        if (!target) return;
        target.classList.add('active');
        clearTimeout(feedbackTimers[type]);
        feedbackTimers[type] = window.setTimeout(() => {
            target.classList.remove('active');
        }, duration);
    }

    function handleInput(e) {
        if (gameState !== 'PLAYING') return;

        const previousLane = player.lane;
        const x = e.clientX - canvas.getBoundingClientRect().left;

        if (x < cw / 2) {
            if (player.lane > -1) player.lane--;
        } else {
            if (player.lane < 1) player.lane++;
        }

        if (player.lane !== previousLane) {
            audio.playSfx('sfx_lane', 0.18, 70);
        }

        player.targetX = (cw / 2) + (player.lane * laneWidth);
    }

    canvas.addEventListener('pointerdown', (e) => {
        handleInput(e);
        // Unlock audio on first interaction
        if (!audio.initialized) audio.init();
    }, { passive: false });

    // --- Game Loop Functions ---

    function spawnObstacle() {
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        const type = Math.random();
        let obs = {
            lane: lane,
            x: (cw / 2) + (lane * laneWidth),
            y: -200,
            width: laneWidth * 0.5,
            height: laneWidth * 0.5,
            speedOffset: 0,
            type: 'rock', // rock, train, coin
            color: '#555'
        };

        if (type > 0.9) {
            obs.type = 'coin';
            obs.color = '#FFFF00';
            obs.width = laneWidth * 0.3;
            obs.height = laneWidth * 0.3;
        } else if (type > 0.7) {
            obs.type = 'train';
            obs.color = '#333';
            obs.height = laneWidth * 3;
            obs.speedOffset = 5; // Oncoming fast
        } else if (type > 0.4) {
            obs.type = 'bike';
            obs.color = '#fff';
            obs.width = laneWidth * 0.4;
            obs.height = laneWidth * 0.8;
            obs.speedOffset = -2; // Moving slower than player
        } else {
            obs.type = 'buffalo';
            obs.color = '#6d4c41';
            obs.width = laneWidth * 0.7;
            obs.height = laneWidth * 0.5;
        }
        
        obstacles.push(obs);
    }

    function createExplosion(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color,
                size: Math.random() * 5 + 2
            });
        }
    }

    function resetGame() {
        score = 0;
        speedMultiplier = 1;
        player.lane = 0;
        player.targetX = (cw / 2);
        player.x = player.targetX;
        obstacles = [];
        particles = [];
        shake = 0;
        scoreEl.innerText = '0';
        gameState = 'PLAYING';

        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        collectGif?.classList.remove('active');
        failGif?.classList.remove('active');

        audio.playSfx('sfx_start', 0.28, 120);
        audio.playBgm();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        shake = 20;
        audio.stopBgm();
        audio.playSfx('sfx_crash', 0.42, 120);
        triggerGif('fail', 1500);
        finalScoreEl.innerText = Math.floor(score);
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        createExplosion(player.x, player.y, '#DA251D', 50);
    }

    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Difficulty ramping
        speedMultiplier += dt * 0.05;
        const currentSpeed = window.gameConfig.baseSpeed * 60 * dt * (1 + speedMultiplier * 0.1);

        // Player Movement
        const dx = player.targetX - player.x;
        player.x += dx * window.gameConfig.laneSpeed * dt;

        // Track Offset
        trackOffset += currentSpeed;
        if (trackOffset > 100) trackOffset = 0;

        // Obstacles
        if (Math.random() < 0.02 + (speedMultiplier * 0.005)) {
            spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.y += currentSpeed + (o.speedOffset * 60 * dt);

            // Collision
            // Simple AABB with slight padding
            const pPad = player.width * 0.2;
            if (
                player.x < o.x + o.width - pPad &&
                player.x + player.width > o.x + pPad &&
                player.y < o.y + o.height - pPad &&
                player.y + player.height > o.y + pPad
            ) {
                if (o.type === 'coin') {
                    score += 100;
                    scoreEl.innerText = Math.floor(score);
                    audio.playSfx('sfx_score', 0.24, 80);
                    triggerGif('collect', 850);
                    createExplosion(o.x, o.y, '#FFFF00', 10);
                    obstacles.splice(i, 1);
                    continue;
                } else {
                    gameOver();
                }
            }

            // Cleanup
            if (o.y > ch + 100) {
                obstacles.splice(i, 1);
                score += 10;
                scoreEl.innerText = Math.floor(score);
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Screen Shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    function draw() {
        // Clear
        const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
        bgGradient.addColorStop(0, '#12071d');
        bgGradient.addColorStop(0.45, '#0b1d31');
        bgGradient.addColorStop(1, '#041824');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = 'rgba(99, 233, 255, 0.06)';
        for (let i = 0; i < 4; i++) {
            const stripeX = (cw * (i + 1)) / 5;
            ctx.fillRect(stripeX, 0, 3, ch);
        }

        // Shake transform
        ctx.save();
        if (shake > 0) {
            const sx = (Math.random() - 0.5) * shake;
            const sy = (Math.random() - 0.5) * shake;
            ctx.translate(sx, sy);
        }

        // Draw Tracks (Neon data corridor)
        const trackWidth = laneWidth * 3.5;
        const trackX = (cw - trackWidth) / 2;
        const trackGradient = ctx.createLinearGradient(trackX, 0, trackX + trackWidth, 0);
        trackGradient.addColorStop(0, '#0d1430');
        trackGradient.addColorStop(0.5, '#18244b');
        trackGradient.addColorStop(1, '#0d1430');
        ctx.fillStyle = trackGradient;
        ctx.fillRect(trackX, 0, trackWidth, ch);

        ctx.strokeStyle = 'rgba(99, 233, 255, 0.25)';
        ctx.lineWidth = 2;
        ctx.strokeRect(trackX + 4, 0, trackWidth - 8, ch);

        // Rails
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#7ae7ff';
        for (let i = 0; i < 3; i++) {
            const lx = (cw / 2) + (lanes[i] * laneWidth);
            // Left rail
            ctx.beginPath();
            ctx.moveTo(lx - laneWidth*0.3, 0);
            ctx.lineTo(lx - laneWidth*0.3, ch);
            ctx.stroke();
            // Right rail
            ctx.beginPath();
            ctx.moveTo(lx + laneWidth*0.3, 0);
            ctx.lineTo(lx + laneWidth*0.3, ch);
            ctx.stroke();
        }

        // Pulse bars
        ctx.fillStyle = '#102546';
        const sleeperSpacing = 60;
        for (let y = (trackOffset % sleeperSpacing) - sleeperSpacing; y < ch; y += sleeperSpacing) {
            ctx.fillRect(trackX + 10, y, trackWidth - 20, 10);
            ctx.fillStyle = 'rgba(255, 72, 179, 0.24)';
            ctx.fillRect(trackX + 16, y + 2, trackWidth - 32, 3);
            ctx.fillStyle = '#102546';
        }

        // Shadows
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        // Player Shadow
        if (gameState !== 'GAMEOVER')
            ctx.fillRect(player.x - player.width/2 + 10, player.y + 10, player.width, player.height);
        
        // Obstacle Shadows
        obstacles.forEach(o => {
             ctx.fillRect(o.x - o.width/2 + 5, o.y + 5, o.width, o.height);
        });

        // Draw Obstacles
        obstacles.forEach(o => {
            ctx.fillStyle = o.color;
            if (o.type === 'coin') {
                ctx.fillStyle = '#ffdc5e';
                drawStar(ctx, o.x, o.y + o.height/2, 5, o.width/2, o.width/4);
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(o.x, o.y + o.height / 2, o.width * 0.72, 0, Math.PI * 2);
                ctx.stroke();
            } else if (o.type === 'buffalo') {
                ctx.beginPath();
                ctx.ellipse(o.x, o.y + o.height/2, o.width/2, o.height/2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffd9ee';
                ctx.fillRect(o.x - o.width/2, o.y, 10, 10);
                ctx.fillRect(o.x + o.width/2 - 10, o.y, 10, 10);
            } else if (o.type === 'train') {
                ctx.fillRect(o.x - o.width/2, o.y, o.width, o.height);
                ctx.fillStyle = '#ff5f7a';
                ctx.fillRect(o.x - o.width/2 + 6, o.y + 10, o.width - 12, 12);
                ctx.fillStyle = '#63e9ff';
                ctx.fillRect(o.x - o.width/2 + 8, o.y + 30, o.width - 16, 10);
            } else if (o.type === 'bike') {
                ctx.fillRect(o.x - o.width/2, o.y, o.width, o.height);
                ctx.fillStyle = '#63e9ff';
                ctx.fillRect(o.x - o.width/2 + 5, o.y + 8, o.width - 10, 8);
                ctx.fillStyle = '#fff';
                ctx.fillRect(o.x - o.width/2 + 6, o.y + o.height - 12, o.width - 12, 6);
            } else {
                ctx.fillRect(o.x - o.width/2, o.y, o.width, o.height);
            }
        });

        // Draw Player (Courier glider)
        if (gameState !== 'GAMEOVER') {
            const bodyX = player.x - player.width / 2;
            const canopyGradient = ctx.createLinearGradient(bodyX, player.y, bodyX + player.width, player.y + player.height);
            canopyGradient.addColorStop(0, '#ff48b3');
            canopyGradient.addColorStop(1, window.gameConfig.themeColor);

            ctx.fillStyle = canopyGradient;
            ctx.beginPath();
            ctx.roundRect(bodyX, player.y, player.width, player.height, 18);
            ctx.fill();

            ctx.fillStyle = '#63e9ff';
            ctx.beginPath();
            ctx.roundRect(bodyX + 6, player.y + 8, player.width - 12, 18, 12);
            ctx.fill();

            ctx.fillStyle = '#ffdc5e';
            ctx.fillRect(bodyX + 6, player.y + player.height * 0.36, player.width - 12, 8);

            ctx.fillStyle = '#041824';
            ctx.beginPath();
            ctx.arc(player.x, player.y + player.height * 0.72, player.width * 0.18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffdc5e';
            drawStar(ctx, player.x, player.y + player.height/2, 5, 10, 5);
        }

        // Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        // Speed Lines (Juice)
        if (gameState === 'PLAYING') {
            ctx.strokeStyle = 'rgba(99,233,255,0.22)';
            ctx.lineWidth = 2;
            for(let i=0; i<5; i++) {
                const lx = Math.random() * cw;
                const ly = Math.random() * ch;
                const len = Math.random() * 100 + 50;
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + len);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(loop);
    }

    // --- Button Listeners ---
    startBtn.addEventListener('click', () => {
        audio.init();
        resetGame();
    });

    restartBtn.addEventListener('click', () => {
        resetGame();
    });

    // Start Loop
    requestAnimationFrame(loop);
});
</script>
