<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pellet Panic: Neon Maze Run</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--ink:#f8fbff;--soft:#9bd7ff;--maze:#1829c9;--maze2:#0a147c;--pellet:#ffe66d;--power:#ff5bdb;--pac:#ffd22e;--danger:#ff476f;--cyan:#38e8ff;--panel:rgba(6,8,32,.82)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050612;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;touch-action:manipulation}body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none}body:before{background:radial-gradient(circle at 50% 9%,rgba(255,230,109,.18),transparent 20%),radial-gradient(circle at 18% 80%,rgba(56,232,255,.12),transparent 24%),linear-gradient(180deg,#09051c,#04091e 54%,#02030b)}body:after{opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.13) 8px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(56,232,255,.08) 32px);mix-blend-mode:screen}.wrap{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}.marquee{position:absolute;inset:-20% -10%;z-index:0;opacity:.22;background:conic-gradient(from 90deg at 50% 50%,transparent,rgba(24,41,201,.7),transparent,rgba(255,91,219,.42),transparent);animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}canvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}.chip{min-width:88px;padding:8px 10px;border:2px solid rgba(56,232,255,.55);border-radius:14px;background:linear-gradient(180deg,rgba(14,20,61,.88),rgba(4,6,26,.78));box-shadow:0 0 18px rgba(24,41,201,.35),inset 0 0 14px rgba(56,232,255,.08);font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.5vw,13px);line-height:1.55;text-shadow:0 0 8px rgba(56,232,255,.6)}.chip b{color:var(--pellet)}.objective{text-align:right;color:var(--soft)}.overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:16px;pointer-events:none}.card{width:min(92vw,430px);pointer-events:auto;text-align:center;border:2px solid rgba(56,232,255,.58);border-radius:24px;padding:22px 18px;background:linear-gradient(180deg,rgba(10,13,43,.94),rgba(3,5,22,.95));box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 28px rgba(255,91,219,.23),inset 0 0 0 1px rgba(255,255,255,.08)}.hidden{display:none!important}.title{margin:0 0 10px;font-family:'Press Start 2P',monospace;font-size:clamp(23px,7.2vw,38px);line-height:1.12;color:var(--pellet);text-shadow:3px 3px 0 #f0529f,0 0 18px rgba(255,210,46,.6)}.subtitle{margin:0 0 14px;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(16px,4.4vw,22px)}.copy{margin:0 auto 18px;max-width:31em;color:#d7eaff;font-size:clamp(15px,4vw,18px);line-height:1.25}.btn{appearance:none;border:0;border-radius:999px;padding:14px 22px;min-width:184px;background:linear-gradient(135deg,#ffe66d,#ff9f1c 45%,#ff4fb8);color:#17071d;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.5vw,15px);box-shadow:0 8px 0 #6b2357,0 0 22px rgba(255,230,109,.38);touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #6b2357}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 18px}.legend span{padding:8px 6px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;font-weight:700}.pac-icon{display:inline-block;width:1em;height:1em;border-radius:50%;background:var(--pac);clip-path:polygon(50% 50%,100% 18%,100% 82%)}.toast{position:absolute;z-index:6;left:50%;top:max(68px,env(safe-area-inset-top) + 58px);transform:translate(-50%,-12px) scale(.92);opacity:0;pointer-events:none;padding:8px 12px;border-radius:999px;background:rgba(255,230,109,.95);color:#160718;font-family:'Press Start 2P',monospace;font-size:11px;transition:.18s ease}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.touchHint{position:absolute;z-index:5;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;color:rgba(248,251,255,.5);font-family:'Press Start 2P',monospace;font-size:10px}.touchHint span{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 12px;background:rgba(0,0,0,.22)}@media (max-height:640px){.card{padding:16px 14px}.legend{margin:10px 0}.copy{margin-bottom:12px}.touchHint{display:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="marquee" aria-hidden="true"></div>
<canvas id="gameCanvas" aria-label="Pellet Panic arcade maze playfield"></canvas>
<div class="hud hidden" id="hud"><div class="chip">SCORE<br><b id="score">0</b></div><div class="chip objective" id="objective">PELLETS<br><b id="pellets">0</b></div></div>
<div class="toast" id="toast">PELLET!</div>
<div class="touchHint" aria-hidden="true"><span>◀ TAP LEFT</span><span>TAP RIGHT ▶</span></div>
<div class="overlay" id="uiLayer">
<section class="card" id="startScreen"><h1 class="title"><span class="pac-icon"></span> PELLET PANIC</h1><p class="subtitle">Neon Maze Run</p><p class="copy">Tap left or right to slide Pac through three glowing maze corridors. Chase pellets, dodge ghosts, and survive the speed-up.</p><div class="legend"><span>🟡 pellet +100</span><span>👻 ghost ends run</span><span>↔ lane taps</span></div><button class="btn" id="startBtn">START CHASE</button></section>
<section class="card hidden" id="gameOverScreen"><h2 class="title">GHOSTED!</h2><p class="copy">Final maze score: <b id="finalScore">0</b><br>Pellets cleared: <b id="finalPellets">0</b></p><button class="btn" id="restartBtn">CHASE AGAIN</button></section>
</div>
</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});
const hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),pelletsEl=document.getElementById('pellets'),startScreen=document.getElementById('startScreen'),gameOverScreen=document.getElementById('gameOverScreen'),startBtn=document.getElementById('startBtn'),restartBtn=document.getElementById('restartBtn'),finalScoreEl=document.getElementById('finalScore'),finalPelletsEl=document.getElementById('finalPellets'),toast=document.getElementById('toast');
const lanes=[-1,0,1];
let cw=0,ch=0,dpr=1,laneWidth=100,mazeWidth=350,mazeX=0,lastTime=0,state='MENU',score=0,pellets=0,speedMultiplier=1,trackOffset=0,shake=0,toastTimer=0,mouthPhase=0;
let player={lane:0,x:0,y:0,targetX:0,size:42,width:42,height:42};
let obstacles=[],particles=[];
class ArcadeAudio{constructor(){this.ctx=null;this.ready=false;this.last={}}init(){if(this.ready)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ctx=new A();this.ready=true;if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}tone(freq,dur=.08,type='square',vol=.05,slide=0){if(!this.ctx)return;const now=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),now+dur);gain.gain.setValueAtTime(vol,now);gain.gain.exponentialRampToValueAtTime(.0001,now+dur);osc.connect(gain);gain.connect(this.ctx.destination);osc.start(now);osc.stop(now+dur+.01);}sfx(name){const n=performance.now();if(this.last[name]&&n-this.last[name]<70)return;this.last[name]=n;this.init();if(name==='start'){this.tone(392,.08,'square',.055,250);setTimeout(()=>this.tone(784,.09,'square',.045,100),80)}else if(name==='pellet'){this.tone(880,.06,'triangle',.05,260)}else if(name==='lane'){this.tone(260,.05,'square',.028,120)}else if(name==='fail'){this.tone(170,.35,'sawtooth',.06,-120);setTimeout(()=>this.tone(75,.22,'sawtooth',.05,-40),110)}}}
const audio=new ArcadeAudio();
function resize(){cw=innerWidth;ch=innerHeight;dpr=devicePixelRatio||1;canvas.width=Math.floor(cw*dpr);canvas.height=Math.floor(ch*dpr);canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);laneWidth=Math.min(cw/3.15,118);mazeWidth=laneWidth*3.45;mazeX=(cw-mazeWidth)/2;player.size=Math.max(34,Math.min(54,laneWidth*.43));player.width=player.height=player.size;player.y=ch-player.size-78;player.targetX=cw/2+player.lane*laneWidth;if(state!=='PLAYING')player.x=player.targetX;obstacles.forEach(o=>{o.x=cw/2+o.lane*laneWidth;o.width=o.kind==='pellet'?laneWidth*.28:laneWidth*.5;o.height=o.kind==='train'?laneWidth*1.85:o.width;});}
addEventListener('resize',resize,{passive:true});resize();
function setHUD(){scoreEl.textContent=Math.floor(score);pelletsEl.textContent=pellets;}
function flashToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),620)}
function resetGame(){state='PLAYING';lastTime=0;score=0;pellets=0;speedMultiplier=1;trackOffset=0;shake=0;mouthPhase=0;player.lane=0;player.targetX=cw/2;player.x=player.targetX;obstacles=[];particles=[];setHUD();startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');hud.classList.remove('hidden');audio.sfx('start');}
function gameOver(){if(state!=='PLAYING')return;state='GAMEOVER';shake=22;hud.classList.add('hidden');finalScoreEl.textContent=Math.floor(score);finalPelletsEl.textContent=pellets;gameOverScreen.classList.remove('hidden');audio.sfx('fail');burst(player.x,player.y,'#ff476f',56);}
function moveLane(dir){if(state!=='PLAYING')return;const before=player.lane;player.lane=Math.max(-1,Math.min(1,player.lane+dir));if(before!==player.lane){player.targetX=cw/2+player.lane*laneWidth;audio.sfx('lane');}}
function handlePointer(e){if(state!=='PLAYING')return;e.preventDefault();const x=e.clientX-canvas.getBoundingClientRect().left;moveLane(x<cw/2?-1:1)}
canvas.addEventListener('pointerdown',handlePointer,{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);if(e.key==='ArrowRight'||e.key==='d')moveLane(1);if((e.key==='Enter'||e.key===' ')&&state!=='PLAYING')resetGame();});
startBtn.addEventListener('click',()=>{audio.init();resetGame();});restartBtn.addEventListener('click',()=>{audio.init();resetGame();});
function spawnObstacle(){const lane=lanes[Math.floor(Math.random()*lanes.length)],r=Math.random();let o={lane,x:cw/2+lane*laneWidth,y:-90,width:laneWidth*.5,height:laneWidth*.5,speedOffset:0,kind:'ghost',ghost:'#ff476f',phase:Math.random()*Math.PI*2};if(r>.88){o.kind='pellet';o.width=o.height=laneWidth*.28;}else if(r>.66){o.kind='train';o.height=laneWidth*1.85;o.speedOffset=4;o.ghost='#ff8a30';}else if(r>.43){o.kind='blueGhost';o.width=laneWidth*.42;o.height=laneWidth*.55;o.speedOffset=-1.8;o.ghost='#38e8ff';}else{o.kind='pinkGhost';o.width=laneWidth*.58;o.height=laneWidth*.48;o.ghost='#ff5bdb';}obstacles.push(o);}
function burst(x,y,color,count=20){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:1,size:Math.random()*4+2,color});}
function update(dt){if(state!=='PLAYING')return;speedMultiplier+=dt*.05;mouthPhase+=dt*9;const currentSpeed=10*60*dt*(1+speedMultiplier*.1);trackOffset=(trackOffset+currentSpeed)%72;player.x+=(player.targetX-player.x)*15*dt;if(Math.random()<.02+speedMultiplier*.005)spawnObstacle();for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.y+=currentSpeed+o.speedOffset*60*dt;o.phase+=dt*5;const pPad=player.width*.2,px=player.x-player.width/2,py=player.y-player.height/2,ox=o.x-o.width/2,oy=o.y;if(px<ox+o.width-pPad&&px+player.width>ox+pPad&&py<oy+o.height-pPad&&py+player.height>oy+pPad){if(o.kind==='pellet'){score+=100;pellets+=1;setHUD();audio.sfx('pellet');flashToast('WAKA +100');burst(o.x,o.y+o.height/2,'#ffe66d',14);obstacles.splice(i,1);continue;}gameOver();}if(o.y>ch+120){obstacles.splice(i,1);score+=10;setHUD();}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.life-=dt*2;if(p.life<=0)particles.splice(i,1);}if(shake>0)shake*=.88;if(shake<.45)shake=0;}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function drawMaze(){ctx.fillStyle='#040712';ctx.fillRect(0,0,cw,ch);const g=ctx.createLinearGradient(mazeX,0,mazeX+mazeWidth,0);g.addColorStop(0,'#07104e');g.addColorStop(.5,'#101b7f');g.addColorStop(1,'#07104e');ctx.fillStyle=g;roundRect(mazeX,54,mazeWidth,ch-92,24);ctx.strokeStyle='rgba(56,232,255,.34)';ctx.lineWidth=2;ctx.strokeRect(mazeX+8,62,mazeWidth-16,ch-108);ctx.save();ctx.shadowColor='#1829c9';ctx.shadowBlur=16;ctx.strokeStyle='#1e38ff';ctx.lineWidth=5;for(let i=0;i<3;i++){const lx=cw/2+lanes[i]*laneWidth;ctx.beginPath();ctx.moveTo(lx-laneWidth*.38,62);ctx.lineTo(lx-laneWidth*.38,ch-46);ctx.stroke();ctx.beginPath();ctx.moveTo(lx+laneWidth*.38,62);ctx.lineTo(lx+laneWidth*.38,ch-46);ctx.stroke();}ctx.restore();ctx.strokeStyle='rgba(255,230,109,.16)';ctx.lineWidth=3;for(let y=(trackOffset%72)-72;y<ch;y+=72){ctx.beginPath();ctx.moveTo(mazeX+20,y);ctx.lineTo(mazeX+mazeWidth-20,y);ctx.stroke();for(let l of lanes){ctx.fillStyle='rgba(255,230,109,.5)';ctx.beginPath();ctx.arc(cw/2+l*laneWidth,y+28,3.2,0,Math.PI*2);ctx.fill();}}ctx.fillStyle='rgba(255,91,219,.12)';for(let i=0;i<5;i++){const y=((trackOffset*0.45+i*150)%(ch+160))-90;ctx.fillRect(mazeX+14,y,mazeWidth-28,5);}}
function drawPac(){if(state==='GAMEOVER')return;const open=.22+Math.abs(Math.sin(mouthPhase))*.22,dir=player.targetX>player.x+1?0:player.targetX<player.x-1?Math.PI: -Math.PI/2;ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#ffe66d';ctx.shadowBlur=20;ctx.fillStyle='#ffd22e';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,player.size/2,dir+open,dir+Math.PI*2-open);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#3a2100';ctx.beginPath();ctx.arc(Math.cos(dir-Math.PI/2)*player.size*.16,Math.sin(dir-Math.PI/2)*player.size*.16-player.size*.13,player.size*.06,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawGhost(o){const x=o.x,y=o.y,w=o.width,h=o.height,bob=Math.sin(o.phase)*3;ctx.save();ctx.translate(x,y+bob);ctx.shadowColor=o.ghost;ctx.shadowBlur=15;ctx.fillStyle=o.ghost;ctx.beginPath();ctx.arc(0,h*.36,w*.5,Math.PI,0);ctx.lineTo(w*.5,h*.83);for(let i=2;i>=-2;i--)ctx.lineTo(i*w*.2,h*(i%2?1:.82));ctx.lineTo(-w*.5,h*.83);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.beginPath();ctx.arc(-w*.18,h*.34,w*.11,0,Math.PI*2);ctx.arc(w*.18,h*.34,w*.11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#09103b';ctx.beginPath();ctx.arc(-w*.16,h*.35,w*.055,0,Math.PI*2);ctx.arc(w*.2,h*.35,w*.055,0,Math.PI*2);ctx.fill();if(o.kind==='train'){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.strokeRect(-w*.34,h*.6,w*.68,h*.75);}ctx.restore();}
function drawPellet(o){const r=o.width*.48+Math.sin(o.phase)*2;ctx.save();ctx.translate(o.x,o.y+o.height/2);ctx.shadowColor='#ffe66d';ctx.shadowBlur=18;ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff5bdb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*1.7,0,Math.PI*2);ctx.stroke();ctx.restore();}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawMaze();obstacles.forEach(o=>o.kind==='pellet'?drawPellet(o):drawGhost(o));drawPac();drawParticles();if(state==='PLAYING'){ctx.strokeStyle='rgba(56,232,255,.16)';ctx.lineWidth=2;for(let i=0;i<6;i++){const x=Math.random()*cw,y=Math.random()*ch;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+Math.random()*80+30);ctx.stroke();}}ctx.restore();}
function loop(t){if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.1);lastTime=t;try{update(dt);draw();}catch(err){console.error(err)}requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
