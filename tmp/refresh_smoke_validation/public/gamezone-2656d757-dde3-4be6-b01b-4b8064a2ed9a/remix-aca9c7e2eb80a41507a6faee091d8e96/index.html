// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = document.getElementById('bgm_race');
        this.sfxBuffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.masterGain = null;
        this.bgmActive = false;
    }

    init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.72;
        this.masterGain.connect(this.ctx.destination);

        this.loadSound('crash', document.getElementById('sfx_crash').src, 'explosion');
        this.loadSound('pass', document.getElementById('sfx_pass').src, 'bonus');
        this.loadSound('ui', document.getElementById('sfx_ui').src, 'click');
        this.loadSound('gameOver', document.getElementById('sfx_game_over').src, 'alarm');
    }

    unlock() {
        if (!this.ctx) this.init();
        if (!this.ctx) return Promise.resolve();
        return this.ctx.resume()
            .then(() => {
                this.unlocked = true;
                this.playBgm();
            })
            .catch(() => {});
    }

    async loadSound(id, src, fallback) {
        if (!this.ctx) return;
        try {
            const res = await fetch(src);
            const arrayBuffer = await res.arrayBuffer();
            this.sfxBuffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback ${fallback}`);
            this.sfxBuffers[id] = fallback;
        }
    }

    playBgm() {
        if (!this.bgmNode || !this.unlocked) return;
        this.bgmNode.volume = 0.2;
        this.bgmNode.loop = true;
        this.bgmNode.play().then(() => {
            this.bgmActive = true;
        }).catch(() => {});
    }

    pauseBgm() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmActive = false;
    }

    stopBgm() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmNode.currentTime = 0;
        this.bgmActive = false;
    }

    playSfx(id, cooldown = 0) {
        if (!this.ctx || !this.unlocked) return;
        const now = performance.now();
        if (cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        const buffer = this.sfxBuffers[id];
        if (buffer && typeof buffer !== 'string') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = buffer;
            gain.gain.value = id === 'crash' ? 0.55 : 0.4;
            source.connect(gain);
            gain.connect(this.masterGain || this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(buffer || 'click');
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);

        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(24, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.48, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        } else if (type === 'bonus') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.14);
        } else if (type === 'alarm') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(190, this.ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.26);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.26);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(720, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(980, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
        }
    }
}

// Game Logic
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const tutorial = document.getElementById('tutorial');
    const scoreEl = document.getElementById('score-display');
    const finalScoreEl = document.getElementById('final-score');
    const speedEl = document.getElementById('speed-display');
    const comboGif = document.getElementById('combo-gif');
    const crashGif = document.getElementById('crash-gif');

    // State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let gameTime = 0;
    let speedMultiplier = 1;
    
    // Input
    const input = { x: 0, active: false };
    
    // Entities
    const player = { x: 0, y: 0, w: 40, h: 70, color: '#ff0055', targetX: 0 };
    let enemies = [];
    let particles = [];
    let roadOffset = 0;
    let feedbackTimers = {};

    // Assets
    const playerImg = document.getElementById('asset_player');
    const enemyImg = document.getElementById('asset_enemy');

    // Constants
    const LANE_WIDTH = 400; // Virtual width
    const ENEMY_COLORS = ['#00f3ff', '#ffe600', '#00ff66', '#ff6600'];
    const STARFIELD = Array.from({ length: 36 }, () => ({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2 + 0.6,
        speed: Math.random() * 0.4 + 0.2,
        alpha: Math.random() * 0.35 + 0.2
    }));

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Reset player position on resize
        player.x = window.innerWidth / 2;
        player.targetX = player.x;
        player.y = window.innerHeight - 150;
    }

    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        input.x = clientX - rect.left;
        input.active = true;
        
        // Audio unlock
        if (!audio.unlocked) audio.unlock();
    }

    canvas.addEventListener('pointerdown', (e) => {
        handleInput(e);
        player.targetX = input.x; // Instant snap on first touch
    }, { passive: false });
    
    canvas.addEventListener('pointermove', (e) => {
        handleInput(e);
        player.targetX = input.x;
    }, { passive: false });
    
    const endInput = () => { input.active = false; };
    canvas.addEventListener('pointerup', endInput);
    canvas.addEventListener('pointercancel', endInput);

    // Game Core
    function spawnEnemy() {
        const laneCount = 5;
        const laneWidth = window.innerWidth / laneCount;
        const lane = Math.floor(Math.random() * laneCount);
        
        // Ensure not overlapping too much
        const x = (lane * laneWidth) + (laneWidth / 2);
        const type = Math.floor(Math.random() * ENEMY_COLORS.length);
        
        enemies.push({
            x: x,
            y: -100,
            w: 35 + Math.random() * 10,
            h: 60 + Math.random() * 20,
            speed: 200 + Math.random() * 100 + (score * 2), // Gets faster
            color: ENEMY_COLORS[type],
            lane: lane
        });
    }

    function showFeedbackGif(node, duration = 1200) {
        if (!node) return;
        node.hidden = false;
        node.classList.add('is-visible');
        clearTimeout(feedbackTimers[node.id]);
        feedbackTimers[node.id] = setTimeout(() => {
            node.classList.remove('is-visible');
            node.hidden = true;
        }, duration);
    }

    function createExplosion(x, y, color) {
        audio.playSfx('crash', 250);
        showFeedbackGif(crashGif, 1500);
        // Screen shake
        ctx.save();
        ctx.translate(Math.random()*10 - 5, Math.random()*10 - 5);
        ctx.restore();

        for (let i = 0; i < 20; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 500,
                vy: (Math.random() - 0.5) * 500,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function resetGame() {
        score = 0;
        speedMultiplier = 1;
        enemies = [];
        particles = [];
        player.x = window.innerWidth / 2;
        player.targetX = player.x;
        player.y = window.innerHeight - 150;
        
        scoreEl.innerText = "0";
        speedEl.innerHTML = "900 <span class='text-sm'>KM/H</span>";
        
        gameState = 'PLAYING';
        hud.classList.remove('hidden');
        tutorial.classList.remove('hidden');
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        audio.init();
        audio.unlock();
        audio.playSfx('ui', 120);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        audio.pauseBgm();
        audio.playSfx('gameOver', 200);
        createExplosion(player.x, player.y, window.gameConfig.themeColor);
        
        finalScoreEl.innerText = score;
        hud.classList.add('hidden');
        tutorial.classList.add('hidden');
        
        setTimeout(() => {
            gameOverScreen.classList.remove('hidden');
        }, 1000);
    }

    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Difficulty scaling
        speedMultiplier = 1 + (score * 0.01);
        const effectiveSpeed = window.gameConfig.gameSpeed * speedMultiplier;

        // Player Movement
        const dx = player.targetX - player.x;
        // Smooth follow
        player.x += dx * Math.min(1, window.gameConfig.heroSpeed * dt);
        
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(window.innerWidth - player.w/2, player.x));

        // Road Scroll
        roadOffset += 800 * dt * effectiveSpeed;
        if (roadOffset > 100) roadOffset = 0;

        // Spawn Enemies
        // Higher density config = lower threshold
        const spawnThreshold = 1.0 / (window.gameConfig.trafficDensity * 0.5 + (score * 0.05));
        if (Math.random() < spawnThreshold * dt * 60) {
            // Simple check to prevent instant overlapping spawns
            const lastEnemy = enemies[enemies.length - 1];
            if (!lastEnemy || lastEnemy.y > 50) {
                spawnEnemy();
            }
        }

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            // Enemy moves slower than player (relative speed simulation)
            // Player is "900", enemies are "100". So enemies move DOWN fast relative to player
            e.y += (400 + e.speed) * dt * effectiveSpeed;

            // Collision
            if (Math.abs(player.x - e.x) < (player.w + e.w)/2 * 0.8 &&
                Math.abs(player.y - e.y) < (player.h + e.h)/2 * 0.8) {
                gameOver();
            }

            // Score & Remove
            if (e.y > window.innerHeight + 100) {
                enemies.splice(i, 1);
                score++;
                scoreEl.innerText = score;
                // Update speedometer visually
                let displaySpeed = 900 + Math.floor(score * 5);
                speedEl.innerHTML = `${displaySpeed} <span class='text-sm'>KM/H</span>`;
                
                if (score % 5 === 0) {
                    audio.playSfx('pass', 140);
                    showFeedbackGif(comboGif, 1100);
                }
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawRoadBackdrop() {
        const sky = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        sky.addColorStop(0, '#070b18');
        sky.addColorStop(0.45, '#0a1638');
        sky.addColorStop(1, '#04040b');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        STARFIELD.forEach((star, index) => {
            const twinkle = 0.65 + Math.sin((gameTime * 0.002) + index) * 0.35;
            const y = (star.y * window.innerHeight + gameTime * star.speed * 8) % window.innerHeight;
            ctx.fillStyle = `rgba(190, 235, 255, ${star.alpha * twinkle})`;
            ctx.fillRect(star.x * window.innerWidth, y, star.size, star.size);
        });

        ctx.fillStyle = 'rgba(73, 132, 255, 0.08)';
        ctx.beginPath();
        ctx.moveTo(0, window.innerHeight * 0.3);
        ctx.lineTo(window.innerWidth * 0.18, window.innerHeight * 0.18);
        ctx.lineTo(window.innerWidth * 0.34, window.innerHeight * 0.3);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(window.innerWidth, window.innerHeight * 0.28);
        ctx.lineTo(window.innerWidth * 0.8, window.innerHeight * 0.14);
        ctx.lineTo(window.innerWidth * 0.62, window.innerHeight * 0.28);
        ctx.closePath();
        ctx.fill();
    }

    function drawRoadGrid() {
        ctx.save();
        const centerX = window.innerWidth / 2;
        const roadWidthTop = window.innerWidth * 0.24;
        const roadWidthBottom = window.innerWidth * 1.1;

        const roadGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        roadGrad.addColorStop(0, 'rgba(10, 14, 32, 0.96)');
        roadGrad.addColorStop(1, 'rgba(4, 6, 16, 1)');
        ctx.fillStyle = roadGrad;
        ctx.beginPath();
        ctx.moveTo(centerX - roadWidthTop / 2, 0);
        ctx.lineTo(centerX + roadWidthTop / 2, 0);
        ctx.lineTo(centerX + roadWidthBottom / 2, window.innerHeight);
        ctx.lineTo(centerX - roadWidthBottom / 2, window.innerHeight);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(0, 243, 255, 0.24)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = -5; i <= 5; i++) {
            const x = centerX + (i * 100);
            ctx.moveTo(x, 0);
            ctx.lineTo(centerX + (i * 300), window.innerHeight);
        }
        for (let i = 0; i < 20; i++) {
            const y = (i * 100 + roadOffset) % (window.innerHeight + 100) - 50;
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
        }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 0, 85, 0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX - roadWidthTop / 2, 0);
        ctx.lineTo(centerX - roadWidthBottom / 2, window.innerHeight);
        ctx.moveTo(centerX + roadWidthTop / 2, 0);
        ctx.lineTo(centerX + roadWidthBottom / 2, window.innerHeight);
        ctx.stroke();
        ctx.restore();
    }

    function drawEnemyVehicle(e) {
        ctx.save();
        ctx.translate(e.x, e.y);

        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(-e.w/2 + 5, -e.h/2 + 7, e.w, e.h);

        if (enemyImg && enemyImg.complete && enemyImg.naturalWidth > 0) {
             ctx.drawImage(enemyImg, -e.w/2, -e.h/2, e.w, e.h);
        } else {
            const enemyGrad = ctx.createLinearGradient(0, -e.h/2, 0, e.h/2);
            enemyGrad.addColorStop(0, '#ffffff');
            enemyGrad.addColorStop(0.18, e.color);
            enemyGrad.addColorStop(1, 'rgba(0, 18, 36, 0.95)');
            ctx.fillStyle = enemyGrad;
            ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(-e.w/2 + 4, -e.h/2 + 6, e.w - 8, e.h * 0.18);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(-e.w/2 + 4, -e.h/2 + 12, e.w - 8, e.h * 0.16);

        ctx.fillStyle = '#ff355e';
        ctx.shadowColor = '#ff355e';
        ctx.shadowBlur = 12;
        ctx.fillRect(-e.w/2 + 2, e.h/2 - 6, 10, 6);
        ctx.fillRect(e.w/2 - 12, e.h/2 - 6, 10, 6);
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    function drawPlayerVehicle() {
        ctx.save();
        ctx.translate(player.x, player.y);

        const tilt = (player.targetX - player.x) * 0.05;
        ctx.rotate(tilt * Math.PI / 180);

        ctx.shadowColor = window.gameConfig.themeColor;
        ctx.shadowBlur = 20;

        if (playerImg && playerImg.complete && playerImg.naturalWidth > 0) {
            ctx.drawImage(playerImg, -player.w/2, -player.h/2, player.w, player.h);
        } else {
            const bodyGrad = ctx.createLinearGradient(0, -player.h/2, 0, player.h/2);
            bodyGrad.addColorStop(0, '#ffd6ea');
            bodyGrad.addColorStop(0.2, window.gameConfig.themeColor);
            bodyGrad.addColorStop(1, '#4a001a');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.moveTo(0, -player.h/2);
            ctx.lineTo(player.w/2, player.h/2);
            ctx.lineTo(-player.w/2, player.h/2);
            ctx.closePath();
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.moveTo(-player.w * 0.18, -player.h * 0.18);
        ctx.lineTo(player.w * 0.18, -player.h * 0.18);
        ctx.lineTo(player.w * 0.12, player.h * 0.05);
        ctx.lineTo(-player.w * 0.12, player.h * 0.05);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#00f3ff';
        const flameH = Math.random() * 20 + 10;
        ctx.beginPath();
        ctx.moveTo(-5, player.h/2);
        ctx.lineTo(5, player.h/2);
        ctx.lineTo(0, player.h/2 + flameH);
        ctx.fill();

        ctx.fillStyle = '#67e8f9';
        ctx.fillRect(-player.w * 0.18, player.h * 0.16, player.w * 0.12, 5);
        ctx.fillRect(player.w * 0.06, player.h * 0.16, player.w * 0.12, 5);

        ctx.restore();
    }

    function draw() {
        drawRoadBackdrop();
        drawRoadGrid();

        if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
            enemies.forEach(drawEnemyVehicle);

            if (gameState === 'PLAYING') {
                drawPlayerVehicle();
            }
        }

        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.translate(p.x, p.y);
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        });
    }

    function loop(timestamp) {
        try {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
            lastTime = timestamp;

            update(dt);
            draw();
            
            requestAnimationFrame(loop);
        } catch (e) {
            console.error("Game Loop Error:", e);
        }
    }

    // Init
    const startRun = () => {
        audio.init();
        audio.unlock();
        audio.playSfx('ui', 120);
        resetGame();
    };

    const restartRun = () => {
        audio.init();
        audio.unlock();
        audio.playSfx('ui', 120);
        resetGame();
    };

    const bindTapAndClick = (node, handler) => {
        if (!node) return;
        let touchHandled = false;
        node.addEventListener('touchend', (e) => {
            touchHandled = true;
            e.preventDefault();
            handler();
            window.setTimeout(() => {
                touchHandled = false;
            }, 350);
        }, { passive: false });
        node.addEventListener('click', () => {
            if (touchHandled) return;
            handler();
        });
    };

    // [agent-note][stage4] repaired: mobile-action-path | element: start/restart buttons | action: explicit touchend fallback without changing gameplay logic
    bindTapAndClick(document.getElementById('start-btn'), startRun);
    bindTapAndClick(document.getElementById('restart-btn'), restartRun);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseBgm();
        } else if (gameState === 'PLAYING') {
            audio.playBgm();
        }
    });

    // Start Loop
    requestAnimationFrame(loop);
});
</script>
