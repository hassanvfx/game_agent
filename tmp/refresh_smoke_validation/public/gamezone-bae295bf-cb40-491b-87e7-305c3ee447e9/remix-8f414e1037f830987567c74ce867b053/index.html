<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Neon Bestie Doodle Era — Drawing Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#332144; --paper:#fff4fb; --rose:#ff80bf; --cyan:#75f7ff; --mint:#93ffd7; --lemon:#fff07a;
      --lav:#caa7ff; --danger:#ff5c93; --glass:rgba(255,246,255,.78); --line:rgba(255,255,255,.45);
      --toolbar-h:126px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#130722;color:var(--ink);font-family:'Exo 2',system-ui,sans-serif;touch-action:none;user-select:none}
    body{position:fixed;inset:0}
    #app{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% -10%,#46366f 0,#241335 42%,#11061e 100%)}
    .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:
      radial-gradient(circle at 18% 10%,rgba(255,128,191,.34),transparent 23%),
      radial-gradient(circle at 84% 4%,rgba(117,247,255,.26),transparent 25%),
      linear-gradient(180deg,#24133e 0%,#301b4a 49%,#181022 100%)}
    .moon{position:absolute;right:9vw;top:5.5vh;width:min(26vw,118px);height:min(26vw,118px);border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#ffe7fb 42%,#ffc3ed 70%,rgba(255,128,191,.15));box-shadow:0 0 45px #fface8,0 0 90px rgba(117,247,255,.22);animation:bob 6s ease-in-out infinite}
    .cloud{position:absolute;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);filter:blur(.2px);border-radius:999px;animation:drift 22s linear infinite}
    .cloud.c1{top:13vh;left:-28vw;width:56vw;height:42px}.cloud.c2{top:26vh;left:62vw;width:42vw;height:34px;animation-duration:31s}.cloud.c3{top:41vh;left:8vw;width:36vw;height:25px;animation-duration:27s}
    .city{position:absolute;left:0;right:0;bottom:calc(var(--toolbar-h) - 10px);height:38vh;pointer-events:none;opacity:.92}
    .building{position:absolute;bottom:0;border:1px solid rgba(255,255,255,.12);border-bottom:0;background:linear-gradient(180deg,rgba(45,23,74,.95),rgba(17,7,31,.97));box-shadow:0 0 18px rgba(117,247,255,.12) inset}
    .building:before{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,240,122,.7) 10px 14px,transparent 14px 26px),repeating-linear-gradient(0deg,transparent 0 16px,rgba(117,247,255,.48) 16px 20px,transparent 20px 34px);opacity:.45}
    .b1{left:0;width:19%;height:50%}.b2{left:17%;width:22%;height:72%}.b3{left:37%;width:16%;height:43%}.b4{left:51%;width:25%;height:83%}.b5{left:73%;width:30%;height:60%}
    .sign{position:absolute;padding:4px 7px;border:2px solid currentColor;border-radius:9px;color:#75f7ff;background:rgba(16,6,30,.84);font:400 clamp(13px,3vw,18px) 'Bangers';letter-spacing:.05em;box-shadow:0 0 14px currentColor;transform:rotate(-4deg);animation:flicker 2.4s steps(2,end) infinite}
    .sign.s1{left:7%;top:20%;color:#ff80bf}.sign.s2{right:9%;top:12%;color:#93ffd7}.sign.s3{left:43%;top:46%;color:#fff07a}
    .stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#ffb9eb 0 1px,transparent 1.5px),radial-gradient(circle,#75f7ff 0 1.2px,transparent 1.8px);background-size:64px 64px,91px 91px,123px 123px;animation:twinkle 7s linear infinite;opacity:.46}
    .canvas-wrap{position:absolute;left:clamp(10px,3vw,22px);right:clamp(10px,3vw,22px);top:82px;bottom:calc(var(--toolbar-h) + 10px);border-radius:28px;overflow:hidden;background:linear-gradient(180deg,rgba(255,248,255,.94),rgba(246,238,255,.9));box-shadow:0 22px 70px rgba(0,0,0,.38),0 0 0 2px rgba(255,255,255,.35),0 0 38px rgba(255,128,191,.25) inset;touch-action:none}
    .canvas-wrap:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(117,247,255,.16) 1px,transparent 1px),linear-gradient(0deg,rgba(255,128,191,.16) 1px,transparent 1px);background-size:26px 26px;mix-blend-mode:multiply}
    .canvas-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.7),transparent 21%),linear-gradient(135deg,transparent 0 62%,rgba(255,128,191,.09) 63%,transparent 77%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;z-index:1}
    .hint{position:absolute;z-index:2;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none;text-align:center;color:rgba(51,33,68,.42);font-weight:600;line-height:1.55;text-shadow:0 1px 0 white}
    .hint b{display:block;font:400 clamp(26px,8vw,44px) 'Bangers';letter-spacing:.04em;color:rgba(255,92,147,.48)}
    .topbar{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
    .brand{min-width:0;padding:8px 12px;border-radius:19px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.18)}
    h1{margin:0;font:400 clamp(24px,7vw,43px)/.82 'Bangers';letter-spacing:.04em;color:#fff;text-shadow:0 2px 0 #ff5c93,0 0 16px #75f7ff;white-space:nowrap}
    .sub{margin-top:3px;font-size:clamp(11px,3vw,13px);font-weight:600;color:#ffe9fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 7px #241335}
    .stats{display:flex;gap:7px;align-items:center}
    .chip{pointer-events:auto;border:1px solid var(--line);border-radius:999px;padding:8px 10px;background:rgba(255,246,255,.82);box-shadow:0 8px 22px rgba(0,0,0,.18);font-size:12px;font-weight:800;color:#5a326f;white-space:nowrap}
    .toolbar{position:absolute;z-index:8;left:0;right:0;bottom:0;min-height:var(--toolbar-h);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:linear-gradient(180deg,rgba(255,244,252,.84),rgba(243,214,252,.96));border-top:2px solid rgba(255,255,255,.55);box-shadow:0 -14px 40px rgba(19,7,34,.34);backdrop-filter:blur(12px)}
    .tools-left{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-width:0}.tools-right{display:flex;gap:7px;align-items:center}
    button{font:700 13px 'Exo 2';border:0;border-radius:15px;min-width:44px;height:44px;display:inline-grid;place-items:center;background:rgba(255,255,255,.63);color:#4a265b;box-shadow:0 4px 0 rgba(82,43,98,.24),0 10px 20px rgba(82,43,98,.13);touch-action:manipulation;cursor:pointer}
    button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(82,43,98,.24)}
    .swatch{position:relative}.swatch i{width:27px;height:27px;border-radius:50%;display:block;box-shadow:0 0 0 3px rgba(255,255,255,.75) inset,0 0 14px currentColor}.swatch.active{outline:3px solid #fff;transform:translateY(-5px) rotate(-7deg);background:#fff}
    .brush-size span{border-radius:50%;background:currentColor;display:block}.brush-size.active,.eraser.active{background:#fff;color:#ff5c93;outline:3px solid rgba(255,128,191,.75)}
    .eraser.active{box-shadow:0 0 0 2px #fff inset,0 0 18px #ff80bf}.label-btn{padding:0 12px;font-family:'Bangers';letter-spacing:.05em;font-size:17px;color:#ff4e8c}.mode{grid-column:1/-1;margin-top:2px;font-size:12px;font-weight:700;color:#744589;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toast{position:absolute;z-index:11;left:50%;bottom:calc(var(--toolbar-h) + 18px);transform:translateX(-50%) scale(.94);padding:9px 13px;border-radius:18px;background:rgba(255,255,255,.88);color:#642d80;font-weight:800;border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.22s}
    .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
    .reaction{position:absolute;z-index:10;right:16px;bottom:calc(var(--toolbar-h) + 18px);width:88px;height:88px;border-radius:22px;object-fit:cover;border:3px solid rgba(255,255,255,.8);box-shadow:0 0 28px rgba(117,247,255,.38);opacity:0;pointer-events:none;transform:scale(.6) rotate(8deg);transition:.18s}
    .reaction.show{opacity:.96;transform:scale(1) rotate(-4deg)}
    .sprinkle{position:absolute;z-index:7;pointer-events:none;font-size:20px;animation:floatUp .8s ease-out forwards;text-shadow:0 0 10px currentColor}
    @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(130vw)}}@keyframes bob{50%{transform:translateY(8px)}}@keyframes twinkle{50%{opacity:.8;transform:translateY(4px)}}@keyframes flicker{40%{opacity:.72}42%{opacity:.25}44%{opacity:1}}@keyframes floatUp{to{opacity:0;transform:translateY(-55px) scale(1.55) rotate(18deg)}}
    @media (max-height:620px){:root{--toolbar-h:112px}.canvas-wrap{top:72px}.brand{padding:6px 10px}.chip{padding:6px 8px}.toolbar{padding-top:7px}button{height:40px;min-width:40px}.reaction{width:72px;height:72px}.mode{display:none}}
    @media (min-width:700px){#app{max-width:520px;margin:0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.1)}}
  </style>
</head>
<body>
  <main id="app" aria-label="Neon Bestie Doodle Era drawing game">
    <div class="sky"><div class="stars"></div><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
    <div class="city" aria-hidden="true">
      <div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div><div class="building b5"></div>
      <div class="sign s1">BESTIE</div><div class="sign s2">SOFT ERA</div><div class="sign s3">DRAW</div>
    </div>
    <header class="topbar">
      <section class="brand"><h1>Neon Bestie Doodle Era</h1><div class="sub">drawing game • pastel puzzle canvas • no wrong answers</div></section>
      <section class="stats"><div class="chip" id="strokeChip">0 strokes</div><button id="muteBtn" class="chip" aria-label="toggle sound">sound</button></section>
    </header>
    <section class="canvas-wrap" id="drawSurface" aria-label="drawing canvas; drag with one thumb to draw">
      <canvas id="canvas"></canvas>
      <div id="hint" class="hint"><b>draw, bestie</b>one-thumb neon sketchbook<br/>drag to leave soft-city lines</div>
    </section>
    <img id="reaction" class="reaction" alt="sparkly drawing reaction" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" />
    <div id="toast" class="toast">iconic line era ✦</div>
    <nav class="toolbar" id="toolbar" aria-label="drawing controls">
      <div class="tools-left" id="colors"></div>
      <div class="tools-right">
        <button id="undoBtn" aria-label="undo last stroke">↩</button>
        <button id="clearBtn" class="label-btn" aria-label="reset sketch">reset</button>
      </div>
      <div class="tools-left" id="sizes"></div>
      <div class="tools-right"><button id="eraserBtn" class="eraser" aria-label="toggle eraser">eraser</button></div>
      <div class="mode" id="modeText">soft brush active — make the city less anxious, bestie</div>
    </nav>
  </main>
  <script>
    (()=>{
      'use strict';
      const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), surface=document.getElementById('drawSurface');
      const hint=document.getElementById('hint'), strokeChip=document.getElementById('strokeChip'), reaction=document.getElementById('reaction'), toast=document.getElementById('toast');
      const modeText=document.getElementById('modeText'), colorsEl=document.getElementById('colors'), sizesEl=document.getElementById('sizes');
      const palette=[['Decora pink','#ff4fa3'],['Lo-fi cyan','#37dfff'],['Matcha mint','#42e6ad'],['Meme lemon','#ffe55f'],['Dream lilac','#b88cff']];
      const sizes=[4,10,20]; let color=palette[0][1], size=10, erasing=false, drawing=false, current=null, muted=false, bgmStarted=false;
      const strokes=[], sprites=['✦','♡','☆','bestie','era'];
      let audioCtx=null, ambientTimer=null;
      function tone(freq=440,dur=.08,type='sine',gain=.035){
        if(muted) return;
        try{
          audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
          const now=audioCtx.currentTime, osc=audioCtx.createOscillator(), vol=audioCtx.createGain();
          osc.type=type; osc.frequency.setValueAtTime(freq,now); vol.gain.setValueAtTime(0.0001,now);
          vol.gain.exponentialRampToValueAtTime(gain,now+.015); vol.gain.exponentialRampToValueAtTime(0.0001,now+dur);
          osc.connect(vol).connect(audioCtx.destination); osc.start(now); osc.stop(now+dur+.02);
        }catch{}
      }
      function play(k){
        if(k==='draw') tone(660,.055,'triangle',.025);
        else if(k==='reset') { tone(220,.12,'sine',.035); setTimeout(()=>tone(440,.1,'sine',.025),80); }
        else tone(880,.06,'sine',.025);
      }
      function startBgm(){
        if(bgmStarted) return; bgmStarted=true;
        ambientTimer=setInterval(()=>{ if(!muted) tone(180+Math.random()*80,.22,'sine',.012); },4200);
      }
      function resize(){ const r=surface.getBoundingClientRect(), d=Math.max(1,Math.min(3,window.devicePixelRatio||1)); canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d); canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px'; ctx.setTransform(d,0,0,d,0,0); redraw(); }
      function base(){ const w=surface.clientWidth,h=surface.clientHeight; ctx.clearRect(0,0,w,h); const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#fff8fd'); g.addColorStop(.55,'#f7edff'); g.addColorStop(1,'#ecfbff'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); ctx.save(); ctx.globalAlpha=.32; ctx.strokeStyle='#ff9bd5'; ctx.lineWidth=1; for(let y=34;y<h;y+=26){ctx.beginPath();ctx.moveTo(14,y);ctx.lineTo(w-14,y);ctx.stroke();} ctx.strokeStyle='#75f7ff'; for(let x=24;x<w;x+=52){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();} ctx.restore(); drawMascot(w,h); }
      function drawMascot(w,h){ ctx.save(); ctx.translate(w-78,62); ctx.globalAlpha=.18; ctx.fillStyle='#ff4fa3'; ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=.22; ctx.strokeStyle='#332144'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(-10,-5,4,0,Math.PI*2); ctx.arc(10,-5,4,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-13,11); ctx.quadraticCurveTo(0,22,15,10); ctx.stroke(); ctx.font='18px Bangers'; ctx.fillStyle='#332144'; ctx.fillText('mood',-20,48); ctx.restore(); }
      function drawStroke(s){ if(s.points.length<2) return; ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=s.size; if(s.erasing){ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)';} else {ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=s.color; ctx.shadowColor=s.color; ctx.shadowBlur=8; ctx.globalAlpha=.88;} ctx.beginPath(); ctx.moveTo(s.points[0].x,s.points[0].y); for(let i=1;i<s.points.length;i++){const a=s.points[i-1],b=s.points[i]; ctx.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2);} ctx.stroke(); ctx.restore(); }
      function redraw(){ base(); strokes.forEach(drawStroke); if(current) drawStroke(current); updateHud(); }
      function point(e){ const r=surface.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
      function down(e){ if(!e.isPrimary) return; e.preventDefault(); startBgm(); const p=point(e); current={points:[p],color,size,erasing}; drawing=true; surface.setPointerCapture?.(e.pointerId); hint.style.display='none'; play(erasing?'ui':'draw'); }
      function move(e){ if(!drawing||!current||!e.isPrimary) return; e.preventDefault(); const p=point(e), last=current.points[current.points.length-1]; const dx=p.x-last.x,dy=p.y-last.y; if(dx*dx+dy*dy>6){current.points.push(p); redraw(); if(current.points.length%10===0 && !erasing) sprinkle(p.x,p.y,color);} }
      function up(e){ if(!e.isPrimary||!drawing) return; e.preventDefault(); if(current&&current.points.length>1){strokes.push(current); showToast(erasing?'stress deleted ✦':'iconic line era ✦'); if(!erasing) showReaction();} current=null; drawing=false; redraw(); }
      function updateHud(){ strokeChip.textContent=strokes.length+' stroke'+(strokes.length===1?'':'s'); hint.style.display=strokes.length||drawing?'none':'block'; }
      function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'),900); }
      function showReaction(){ reaction.classList.add('show'); clearTimeout(showReaction.t); showReaction.t=setTimeout(()=>reaction.classList.remove('show'),820); }
      function sprinkle(x,y,c){ const el=document.createElement('div'); el.className='sprinkle'; el.textContent=sprites[Math.floor(Math.random()*sprites.length)]; el.style.left=(surface.offsetLeft+x-8)+'px'; el.style.top=(surface.offsetTop+y-8)+'px'; el.style.color=c; document.getElementById('app').appendChild(el); setTimeout(()=>el.remove(),850); }
      function buildControls(){ palette.forEach(([name,val])=>{ const b=document.createElement('button'); b.className='swatch'; b.setAttribute('aria-label','brush '+name); b.style.color=val; b.innerHTML='<i></i>'; b.onclick=()=>{color=val; erasing=false; play('ui'); sync();}; colorsEl.appendChild(b); }); sizes.forEach(v=>{ const b=document.createElement('button'); b.className='brush-size'; b.setAttribute('aria-label','brush size '+v); const dot=document.createElement('span'); dot.style.width=Math.max(9,v*1.25)+'px'; dot.style.height=Math.max(9,v*1.25)+'px'; b.appendChild(dot); b.onclick=()=>{size=v; erasing=false; play('ui'); sync();}; sizesEl.appendChild(b); }); sync(); }
      function sync(){ [...colorsEl.children].forEach((b,i)=>b.classList.toggle('active',palette[i][1]===color&&!erasing)); [...sizesEl.children].forEach((b,i)=>b.classList.toggle('active',sizes[i]===size&&!erasing)); document.getElementById('eraserBtn').classList.toggle('active',erasing); modeText.textContent=erasing?'eraser active — gently delete the anxious pixels':'soft brush active — make the city less anxious, bestie'; }
      document.getElementById('eraserBtn').onclick=()=>{erasing=!erasing; play('ui'); sync();};
      document.getElementById('undoBtn').onclick=()=>{strokes.pop(); play('ui'); redraw(); showToast('rewound, bestie ↩');};
      document.getElementById('clearBtn').onclick=()=>{strokes.length=0; current=null; play('reset'); redraw(); showToast('fresh pastel page ✕'); showReaction();};
      document.getElementById('muteBtn').onclick=()=>{muted=!muted; if(!muted) startBgm(); document.getElementById('muteBtn').textContent=muted?'muted':'sound';};
      surface.addEventListener('pointerdown',down,{passive:false}); surface.addEventListener('pointermove',move,{passive:false}); surface.addEventListener('pointerup',up,{passive:false}); surface.addEventListener('pointercancel',up,{passive:false});
      window.addEventListener('resize',resize); buildControls(); resize(); updateHud();
    })();
  </script>
</body>
</html>
