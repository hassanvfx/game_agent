<script>
/**
 * AUDIO MANAGER
 * Handles Web Audio API context, unlocking, and fallback synthesis.
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.isUnlocked = false;
        this.lastPlayedAt = {};
    }

    init() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            this.ctx = new AudioContext();
        }

        const unlock = () => {
            if (this.isUnlocked) return;
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            this.isUnlocked = true;
            this.playLoop('bgm_main', 0.2);
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
        };

        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { once: true }));
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.pauseLoop('bgm_main');
            } else if (gameState === 'PLAY' && this.isUnlocked) {
                this.playLoop('bgm_main', 0.2);
            }
        });
    }

    async loadSound(id, elementId) {
        const el = document.getElementById(elementId);
        if (!el || !el.src) return;
        if (!this.ctx) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using element or synth fallback.`);
        }
    }

    playLoop(elementId, volume = 0.3) {
        if (!this.isUnlocked) return;
        const el = document.getElementById(elementId);
        if (!el) return;
        el.volume = volume;
        el.currentTime = el.currentTime || 0;
        el.play().catch(() => {});
    }

    pauseLoop(elementId) {
        const el = document.getElementById(elementId);
        if (el) el.pause();
    }

    stopLoop(elementId) {
        const el = document.getElementById(elementId);
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, elementId = `sfx_${id}`, minGap = 90) {
        const now = performance.now();
        if ((this.lastPlayedAt[id] || 0) + minGap > now) return;
        this.lastPlayedAt[id] = now;

        if (!this.isUnlocked) return;
        const el = document.getElementById(elementId);

        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = id === 'win' ? 0.45 : 0.5;
                el.play().catch(() => {});
                return;
            } catch (e) {}
        }

        if (this.ctx && this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = id === 'win' ? 0.45 : 0.35;
            source.buffer = this.buffers[id];
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
            return;
        }

        this.synthesize(id);
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(760, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1220, this.ctx.currentTime + 0.11);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.22);
        } else if (type === 'change' || type === 'start') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(560, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(980, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        }
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioManager();

// Config
let config = {
    heroSpeed: 180,
    heroColor: '#FF4081',
    gameTitle: 'Gift Rush City'
};

// State
let gameState = 'START'; // START, PLAY, GAMEOVER
let lastTime = 0;
let score = 0;
let cameraY = 0;

// Input
const input = { x: 0, y: 0, active: false };

// Entities
const player = { x: 0, y: 0, r: 20, vx: 0, vy: 0, color: config.heroColor, outfit: 0, animTime: 0 };
let gifts = [];
let particles = [];
let scenery = [];
let gifTimers = {};

// Config Loader
function loadConfig() {
    try {
        const el = document.getElementById('game-config');
        if (el) {
            const parsed = JSON.parse(el.textContent);
            window.gameConfigDefs = parsed;
            window.gameConfig = {};
            for (const key in parsed) {
                window.gameConfig[key] = parsed[key].value;
            }
            // Sync initial values
            config.heroSpeed = window.gameConfig.heroSpeed;
            config.heroColor = window.gameConfig.heroColor;
            document.getElementById('ui-title').innerText = window.gameConfig.gameTitle;
        }
    } catch (e) {
        console.error("Config load error", e);
    }
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig) window.gameConfig[key] = val;
    if (key === 'heroSpeed') config.heroSpeed = val;
    if (key === 'heroColor') { config.heroColor = val; player.color = val; }
    if (key === 'gameTitle') document.getElementById('ui-title').innerText = val;
};

// Resize Handling
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Initialization
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Input Listeners
    const handleStart = (e) => {
        e.preventDefault();
        input.active = true;
        const pt = e.touches ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        input.x = pt.clientX - rect.left;
        input.y = pt.clientY - rect.top;
    };
    
    const handleMove = (e) => {
        e.preventDefault();
        if (!input.active) return;
        const pt = e.touches ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        input.x = pt.clientX - rect.left;
        input.y = pt.clientY - rect.top;
    };
    
    const handleEnd = (e) => {
        e.preventDefault();
        input.active = false;
    };

    canvas.addEventListener('pointerdown', handleStart, { passive: false });
    window.addEventListener('pointermove', handleMove, { passive: false });
    window.addEventListener('pointerup', handleEnd, { passive: false });
    window.addEventListener('pointercancel', handleEnd, { passive: false });

    // UI Bindings
    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('customize-btn').onclick = changeOutfit;
    
    loadConfig();
    audio.init();
    audio.loadSound('collect', 'sfx_collect');
    audio.loadSound('change', 'sfx_change');
    audio.loadSound('start', 'sfx_start');
    audio.loadSound('win', 'sfx_win');

    requestAnimationFrame(loop);
}

function startGame() {
    gameState = 'PLAY';
    score = 0;
    cameraY = 0;
    audio.playSfx('start');
    audio.playLoop('bgm_main', 0.2);
    showGif('collect', 1400);
    hideGif('win');
    
    // Reset Player
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight / 2;
    player.vx = 0;
    player.vy = 0;
    player.color = config.heroColor;
    
    // Reset World
    gifts = [];
    particles = [];
    scenery = [];
    
    // Generate initial scenery
    for(let i=0; i<20; i++) {
        spawnScenery(Math.random() * window.innerHeight * 2 - window.innerHeight);
    }

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    updateScore();
}

function changeOutfit() {
    if (gameState !== 'PLAY') return;
    player.outfit = (player.outfit + 1) % 4;
    const colors = ['#FF4081', '#7C4DFF', '#00BCD4', '#FFC107'];
    player.color = colors[player.outfit];
    audio.playSfx('change');
    
    // Burst particles
    for(let i=0; i<10; i++) {
        particles.push({
            x: player.x,
            y: player.y - cameraY, // relative to screen for particle logic simplicity? No, let's keep world coords
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: player.color,
            size: Math.random() * 5 + 2
        });
    }
}

function spawnScenery(yBase) {
    const type = Math.random() > 0.5 ? 'tree' : 'house';
    scenery.push({
        x: Math.random() * window.innerWidth,
        y: yBase,
        type: type,
        color: type === 'tree' ? '#81C784' : '#FFF176',
        scale: 0.5 + Math.random() * 0.5
    });
}

function spawnGift(yBase) {
    gifts.push({
        x: 50 + Math.random() * (window.innerWidth - 100),
        y: yBase,
        collected: false,
        oscOffset: Math.random() * Math.PI * 2
    });
}

function updateScore() {
    document.getElementById('score').innerText = score;
    document.getElementById('finalScore').innerText = score;
}

function showGif(id, duration = 1600) {
    const el = document.getElementById(`${id}-gif`);
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(gifTimers[id]);
    gifTimers[id] = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

function hideGif(id) {
    const el = document.getElementById(`${id}-gif`);
    if (!el) return;
    clearTimeout(gifTimers[id]);
    el.classList.remove('visible');
}

function finishRun() {
    if (gameState !== 'PLAY') return;
    gameState = 'GAMEOVER';
    audio.playSfx('win', 'sfx_win', 250);
    audio.pauseLoop('bgm_main');
    showGif('win', 4200);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt, timestamp);
    draw();

    requestAnimationFrame(loop);
}

function update(dt, time) {
    if (gameState !== 'PLAY') return;

    // Player Movement (Follow Input)
    if (input.active) {
        const dx = input.x - player.x;
        const dy = (input.y + cameraY) - player.y; // Convert screen input to world
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 5) {
            const speed = config.heroSpeed;
            player.vx = (dx / dist) * speed;
            player.vy = (dy / dist) * speed;
        } else {
            player.vx = 0;
            player.vy = 0;
        }
    } else {
        // Friction
        player.vx *= 0.9;
        player.vy *= 0.9;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.animTime += dt * (Math.abs(player.vx) + Math.abs(player.vy)) * 0.05;

    // Camera follow player Y
    const targetCamY = player.y - window.innerHeight * 0.6;
    cameraY += (targetCamY - cameraY) * 2 * dt;

    // Infinite World Generation
    // Remove old scenery
    scenery = scenery.filter(s => s.y > cameraY - 100);
    gifts = gifts.filter(g => g.y > cameraY - 100 && !g.collected);

    // Add new scenery
    const horizon = cameraY - window.innerHeight; // Top of screen in world coords is roughly here?
    // Actually we are moving UP (y decreases) usually? 
    // Let's assume standard coords: Y increases downwards. 
    // If we walk DOWN, Y increases.
    // Let's allow walking in any direction.
    
    // Dynamic spawning based on player position
    // Just keep a buffer around the player
    if (scenery.length < 30) {
        // Spawn ahead
        const spawnY = player.y + (Math.random() > 0.5 ? 1 : -1) * (window.innerHeight + Math.random() * 500);
        spawnScenery(spawnY);
    }
    if (gifts.length < 5) {
         const spawnY = player.y + (Math.random() > 0.5 ? 1 : -1) * (window.innerHeight * 0.5 + Math.random() * 500);
         spawnGift(spawnY);
    }

    // Collision Gift
    gifts.forEach(g => {
        if (g.collected) return;
        const dx = player.x - g.x;
        const dy = player.y - g.y;
        if (dx*dx + dy*dy < (player.r + 20)**2) {
            g.collected = true;
            score++;
            updateScore();
            audio.playSfx('collect');
            showGif('collect', 900);
            if (score >= 10) {
                finishRun();
                return;
            }
            
            // Particles
            for(let i=0; i<15; i++) {
                particles.push({
                    x: g.x,
                    y: g.y,
                    vx: (Math.random() - 0.5) * 300,
                    vy: (Math.random() - 0.5) * 300,
                    life: 0.8,
                    color: `hsl(${Math.random()*360}, 100%, 70%)`,
                    size: Math.random() * 6 + 3
                });
            }
        }
    });

    // Particles
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.vy += 200 * dt; // Gravity
    });
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    // Clear Background
    const backgroundGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    backgroundGradient.addColorStop(0, '#160f2a');
    backgroundGradient.addColorStop(0.55, '#2c1a58');
    backgroundGradient.addColorStop(1, '#4b2878');
    ctx.fillStyle = backgroundGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Save context for camera
    ctx.save();
    ctx.translate(0, -cameraY);

    // Draw neon avenue tiles for depth
    const gridSize = 100;
    const startY = Math.floor(cameraY / gridSize) * gridSize;
    for (let y = startY; y < cameraY + window.innerHeight + gridSize; y += gridSize) {
        for (let x = 0; x < window.innerWidth; x += gridSize) {
            ctx.fillStyle = ((x / gridSize + y / gridSize) % 2 === 0) ? '#33205f' : '#281948';
            ctx.fillRect(x, y, gridSize, gridSize);
            ctx.strokeStyle = 'rgba(89, 240, 255, 0.08)';
            ctx.strokeRect(x + 0.5, y + 0.5, gridSize - 1, gridSize - 1);
        }
    }

    // Sort entities by Y for pseudo-3D depth
    const renderList = [];
    
    // Scenery
    scenery.forEach(s => {
        renderList.push({type: 'scenery', obj: s, y: s.y});
    });

    // Gifts
    gifts.forEach(g => {
        if(!g.collected) renderList.push({type: 'gift', obj: g, y: g.y});
    });

    // Player
    renderList.push({type: 'player', obj: player, y: player.y});

    // Sort
    renderList.sort((a, b) => a.y - b.y);

    // Render Loop
    renderList.forEach(item => {
        if (item.type === 'scenery') drawScenery(item.obj);
        if (item.type === 'gift') drawGift(item.obj);
        if (item.type === 'player') drawPlayer(item.obj);
    });

    // Particles (on top)
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

function drawPlayer(p) {
    const bounce = Math.sin(p.animTime * 10) * 3;
    const idleGlow = 0.22 + Math.abs(Math.sin((Date.now() * 0.004) + p.animTime)) * 0.2;

    // Shadow
    ctx.fillStyle = 'rgba(5, 4, 14, 0.28)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 2, 18, 9, 0, 0, Math.PI*2);
    ctx.fill();

    // Aura
    ctx.fillStyle = `rgba(89, 240, 255, ${idleGlow})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 20 + bounce, 28, 0, Math.PI * 2);
    ctx.fill();

    // Delivery skates glow
    ctx.fillStyle = 'rgba(255, 210, 95, 0.75)';
    ctx.fillRect(p.x - 14, p.y - 2 + bounce, 10, 4);
    ctx.fillRect(p.x + 4, p.y - 2 + bounce, 10, 4);

    // Body
    ctx.fillStyle = p.color;
    ctx.beginPath();
    roundRect(ctx, p.x - 13, p.y - 30 + bounce, 26, 28, 11);
    ctx.fill();

    // Jacket stripe
    ctx.fillStyle = '#fff5fb';
    roundRect(ctx, p.x - 3, p.y - 28 + bounce, 6, 24, 3);
    ctx.fill();

    // Satchel
    ctx.fillStyle = '#ffd25f';
    ctx.beginPath();
    roundRect(ctx, p.x + 6, p.y - 20 + bounce, 11, 12, 4);
    ctx.fill();

    // Head
    ctx.fillStyle = '#FFE0B2';
    ctx.beginPath();
    ctx.arc(p.x, p.y - 38 + bounce, 14, 0, Math.PI*2);
    ctx.fill();

    // Hair
    ctx.fillStyle = '#4c2f68';
    ctx.beginPath();
    ctx.arc(p.x, p.y - 42 + bounce, 14, Math.PI, 0);
    ctx.fill();

    // Face
    ctx.fillStyle = '#2d2144';
    ctx.beginPath();
    ctx.arc(p.x - 5, p.y - 40 + bounce, 2, 0, Math.PI*2);
    ctx.arc(p.x + 5, p.y - 40 + bounce, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#2d2144';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 37 + bounce, 5, 0.2, Math.PI - 0.2);
    ctx.stroke();
    ctx.lineWidth = 1;

    // Outfit based on courier persona
    if (p.outfit === 1) { // Cap
        ctx.fillStyle = '#3F51B5';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 45 + bounce, 15, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(p.x - 15, p.y - 45 + bounce, 35, 5);
    } else if (p.outfit === 2) { // Headphones
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y - 40 + bounce, 16, Math.PI, 0);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.fillStyle = '#F44336';
        ctx.beginPath();
        ctx.arc(p.x - 16, p.y - 40 + bounce, 5, 0, Math.PI*2);
        ctx.arc(p.x + 16, p.y - 40 + bounce, 5, 0, Math.PI*2);
        ctx.fill();
    } else if (p.outfit === 3) { // Crown
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.moveTo(p.x - 10, p.y - 48 + bounce);
        ctx.lineTo(p.x - 5, p.y - 58 + bounce);
        ctx.lineTo(p.x, p.y - 48 + bounce);
        ctx.lineTo(p.x + 5, p.y - 58 + bounce);
        ctx.lineTo(p.x + 10, p.y - 48 + bounce);
        ctx.lineTo(p.x + 10, p.y - 45 + bounce);
        ctx.lineTo(p.x - 10, p.y - 45 + bounce);
        ctx.fill();
    }
}

function drawScenery(s) {
    if (s.type === 'tree') {
        ctx.fillStyle = '#4a3357';
        ctx.fillRect(s.x - 4 * s.scale, s.y - 18 * s.scale, 8 * s.scale, 18 * s.scale);

        ctx.fillStyle = '#59f0ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 28 * s.scale, 18 * s.scale, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#ff5ca8';
        ctx.beginPath();
        ctx.arc(s.x - 10*s.scale, s.y - 23*s.scale, 12*s.scale, 0, Math.PI*2);
        ctx.arc(s.x + 10*s.scale, s.y - 23*s.scale, 12*s.scale, 0, Math.PI*2);
        ctx.fill();
    } else {
        ctx.fillStyle = '#291537';
        ctx.fillRect(s.x - 20*s.scale, s.y - 30*s.scale, 40*s.scale, 30*s.scale);

        ctx.fillStyle = '#59f0ff';
        ctx.beginPath();
        ctx.moveTo(s.x - 25*s.scale, s.y - 30*s.scale);
        ctx.lineTo(s.x, s.y - 50*s.scale);
        ctx.lineTo(s.x + 25*s.scale, s.y - 30*s.scale);
        ctx.fill();

        ctx.fillStyle = '#ffd25f';
        ctx.fillRect(s.x - 5*s.scale, s.y - 15*s.scale, 10*s.scale, 15*s.scale);
        ctx.fillRect(s.x - 14*s.scale, s.y - 23*s.scale, 8*s.scale, 8*s.scale);
        ctx.fillRect(s.x + 6*s.scale, s.y - 23*s.scale, 8*s.scale, 8*s.scale);
    }
}

function drawGift(g) {
    const floatY = Math.sin(Date.now() / 200 + g.oscOffset) * 5;
    const size = 30;

    ctx.fillStyle = 'rgba(255, 210, 95, 0.22)';
    ctx.beginPath();
    ctx.arc(g.x, g.y - size / 2 + floatY, size * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffd25f';
    roundRect(ctx, g.x - size/2, g.y - size + floatY, size, size, 7);
    ctx.fill();

    ctx.fillStyle = '#ff5ca8';
    ctx.fillRect(g.x - size/6, g.y - size + floatY, size/3, size);
    ctx.fillRect(g.x - size/2, g.y - size/2 - size/6 + floatY, size, size/3);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(g.x - 5, g.y - size + 2 + floatY, 5, 0, Math.PI * 2);
    ctx.arc(g.x + 5, g.y - size + 2 + floatY, 5, 0, Math.PI * 2);
    ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// Start
document.addEventListener('DOMContentLoaded', init);

</script>
