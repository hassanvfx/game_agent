<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Neon Relay Runner</title>
    <!-- [agent-note][stage4] resolved-font: title/ui -> catalog-backed Orbitron + Exo 2 URLs -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #57f7ff;
            --neon-blue: #4f7cff;
            --neon-pink: #ff4fd8;
            --neon-lime: #d6ff57;
            --gray-300: #d1d5db;
            --white: #ffffff;
            --black: #000000;
            --red-500: #ef4444;
            --bg-top: #090b1d;
            --bg-bottom: #150522;
            --panel-bg: rgba(14, 18, 38, 0.72);
            --panel-border: rgba(135, 245, 255, 0.4);
            --panel-shadow: rgba(87, 247, 255, 0.18);
            --text-soft: rgba(226, 233, 255, 0.74);
        }

        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(87, 247, 255, 0.12), transparent 30%),
                radial-gradient(circle at 75% 20%, rgba(255, 79, 216, 0.12), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 58%, #04040b);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--white);
        }

        #game-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .hidden { display: none; }
        .w-full { width: 100%; }
        .max-w-sm { max-width: 24rem; }
        .p-3 { padding: 0.75rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .pb-12 { padding-bottom: 3rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-3xl { border-radius: 1.5rem; }
        .border { border-width: 1px; border-style: solid; }
        .border-t-4 { border-top-width: 4px; border-top-style: solid; }
        .border-neon-cyan { border-color: var(--neon-cyan); }
        .border-red-500 { border-color: var(--red-500); }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .font-semibold { font-weight: 600; }
        .uppercase { text-transform: uppercase; }
        .tracking-widest { letter-spacing: 0.2em; }
        .text-white { color: var(--white); }
        .text-black { color: var(--black); }
        .text-gray-300 { color: var(--gray-300); }
        .text-red-500 { color: var(--red-500); }
        .text-neon-cyan { color: var(--neon-cyan); }
        .drop-shadow-md { text-shadow: 0 4px 8px rgba(0, 0, 0, 0.45); }
        .opacity-0 { opacity: 0; }
        .transition-opacity { transition-property: opacity; }
        .duration-300 { transition-duration: 300ms; }
        .duration-500 { transition-duration: 500ms; }
        .transition { transition: all 0.2s ease; }
        .active\:bg-gray-200:active { background-color: #e5e7eb; }
        .active\:bg-white\/20:active { background-color: rgba(255, 255, 255, 0.2); }
        .z-10 { z-index: 10; }
        .bg-black-40 { background: rgba(0, 0, 0, 0.4); }
        .border-white-20 { border-color: rgba(255, 255, 255, 0.2); }
        .text-white-50 { color: rgba(255, 255, 255, 0.5); }
        .shadow-lg { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); }
        .gradient-title {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(25, 31, 64, 0.92), rgba(10, 14, 30, 0.9)),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 0 0 1px var(--panel-border),
                0 16px 40px rgba(0, 0, 0, 0.38),
                0 0 30px var(--panel-shadow);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(87, 247, 255, 0.86), 0 0 24px rgba(87, 247, 255, 0.35);
        }

        .signal-frame {
            position: relative;
            overflow: hidden;
        }

        .signal-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 32%),
                linear-gradient(180deg, rgba(87, 247, 255, 0.08), transparent 72%);
            pointer-events: none;
        }

        .signal-frame::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .hud-chip {
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(19, 27, 54, 0.84), rgba(6, 10, 24, 0.82));
            border: 1px solid rgba(87, 247, 255, 0.2);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
        }

        .hud-kicker,
        .tutorial-text {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .ui-body {
            color: var(--text-soft);
            letter-spacing: 0.02em;
        }

        .title-stack {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            line-height: 0.88;
        }

        .character-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 1rem;
            border-radius: 28px;
            position: relative;
            background:
                radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.02) 24%),
                linear-gradient(145deg, rgba(87, 247, 255, 0.95), rgba(79, 124, 255, 0.78) 55%, rgba(255, 79, 216, 0.78));
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.1),
                0 0 22px rgba(87, 247, 255, 0.35),
                inset 0 -10px 18px rgba(0, 0, 0, 0.28);
            animation: float 3s ease-in-out infinite;
        }

        .character-badge::before,
        .character-badge::after {
            content: "";
            position: absolute;
            top: 30px;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: #07101e;
            box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.14);
        }

        .character-badge::before { left: 20px; }
        .character-badge::after { right: 20px; }

        .character-badge span {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: 40px;
            height: 14px;
            border-radius: 0 0 20px 20px;
            border-bottom: 4px solid #07101e;
            opacity: 0.9;
        }

        .spark-row {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
            margin: 0.9rem 0 1.2rem;
        }

        .spark-row i {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: var(--neon-cyan);
            opacity: 0.75;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .spark-row i:nth-child(2) {
            background: var(--neon-pink);
            animation-delay: 0.2s;
        }

        .spark-row i:nth-child(3) {
            background: var(--neon-lime);
            animation-delay: 0.4s;
        }

        .neon-btn {
            background: linear-gradient(135deg, #7cf8ff 0%, #4f7cff 100%);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            border: 0;
            cursor: pointer;
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .neon-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.8);
            filter: brightness(1.08);
        }

        .reaction-panel {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(28vw, 132px);
            aspect-ratio: 1;
            border-radius: 1rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            border: 1px solid rgba(87, 247, 255, 0.45);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
            background: rgba(7, 12, 24, 0.84);
            pointer-events: none;
        }

        .reaction-panel.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .reaction-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .reaction-caption {
            position: absolute;
            left: 0.45rem;
            right: 0.45rem;
            bottom: 0.45rem;
            padding: 0.22rem 0.45rem;
            border-radius: 999px;
            background: rgba(6, 12, 24, 0.74);
            color: var(--white);
            font-size: 0.68rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }

        button {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: inherit;
            font-weight: inherit;
        }

        @media (max-width: 640px) {
            #hud {
                padding: 1rem;
            }

            #start-screen,
            #game-over-screen {
                padding: 1.4rem;
            }

            .character-badge {
                width: 72px;
                height: 72px;
                border-radius: 24px;
                margin-bottom: 0.8rem;
            }

            .title-stack {
                font-size: 2.6rem;
            }

            .reaction-panel {
                width: min(28vw, 92px);
                right: 0.75rem;
                bottom: 0.75rem;
            }

            .reaction-caption {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10">
        
        <div id="hud" class="w-full p-6 flex justify-between items-start opacity-0 transition-opacity duration-500">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe; styling only -->
            <div class="flex flex-col hud-chip">
                <span class="text-neon-cyan text-sm font-bold tracking-widest uppercase hud-kicker">Checkpoints</span>
                <span id="score-display" class="text-white text-4xl font-black neon-text">0</span>
            </div>
            <button id="mute-btn" class="pointer-events-auto bg-black-40 p-3 rounded-full border border-white-20 active:bg-white/20 transition" aria-label="Toggle sound">
                <svg id="icon-sound-on" class="w-6 h-6 text-neon-cyan" fill="currentColor" viewBox="0 0 20 20"><path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.972 7.972 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z"/></svg>
                <svg id="icon-sound-off" class="w-6 h-6 text-gray-300 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </button>
        </div>

        <div class="absolute inset-0 flex items-center justify-center p-6 pointer-events-none">
            
            <div id="start-screen" class="glass signal-frame w-full max-w-sm p-8 rounded-3xl text-center pointer-events-auto border-t-4 border-neon-cyan">
                <div class="character-badge" aria-hidden="true"><span></span></div>
                <div class="spark-row" aria-hidden="true"><i></i><i></i><i></i></div>
                <h1 class="text-5xl font-black gradient-title mb-2 neon-text title-stack">NOVA<br>RELAY</h1>
                <p class="text-gray-300 text-lg mb-8 font-medium ui-body">Guide the spark courier across neon towers and keep the city signal glowing.</p>
                <button id="start-btn" class="neon-btn text-black font-bold py-4 px-12 rounded-full text-xl w-full">
                    START RUN
                </button>
            </div>

            <div id="game-over-screen" class="glass signal-frame w-full max-w-sm p-8 rounded-3xl text-center pointer-events-auto hidden border-t-4 border-red-500">
                <div class="spark-row" aria-hidden="true"><i></i><i></i><i></i></div>
                <h2 class="text-4xl font-black text-red-500 mb-2 drop-shadow-md title-stack" style="font-size:2rem;">SIGNAL LOST</h2>
                <div class="text-white text-lg mb-6 ui-body">CHECKPOINTS: <span id="final-score" class="text-neon-cyan font-bold text-2xl">0</span></div>
                <button id="restart-btn" class="text-black font-bold py-4 px-12 rounded-full shadow-lg active:bg-gray-200 transition text-xl w-full neon-btn">
                    RELAY AGAIN
                </button>
            </div>

        </div>
        
        <div id="tutorial" class="w-full text-center pb-12 opacity-0 transition-opacity duration-300 pointer-events-none">
            <p class="text-white-50 text-sm font-semibold tracking-widest animate-pulse tutorial-text">TAP OR CLICK TO JUMP &bull; JUMP AGAIN IN AIR FOR A BOOST</p>
        </div>

        <!-- [agent-note][stage3] resolved-gif: checkpoint+fail feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div id="reaction-panel" class="reaction-panel" aria-live="polite" aria-hidden="true">
            <img id="reaction-gif" alt="Gameplay reaction">
            <div id="reaction-caption" class="reaction-caption">Combo</div>
        </div>
    </div>
</div>

<script>
const MEDIA = {
    audio: {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
        sfx: {
            jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
            land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            checkpoint: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
            streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
            ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3"
        }
    },
    gifs: {
        checkpoint: {
            src: "https://i.giphy.com/10gLW3UdTnQzdu.webp",
            alt: "Reward reaction animation",
            label: "Relay boost"
        },
        fail: {
            src: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp",
            alt: "Fail reaction animation",
            label: "Signal lost"
        }
    }
};

class AudioManager {
    constructor() {
        this.muted = false;
        this.unlocked = false;
        this.bgm = this.createAudio(MEDIA.audio.bgm, { loop: true, volume: 0.24 });
        this.sfx = Object.fromEntries(
            Object.entries(MEDIA.audio.sfx).map(([name, url]) => [name, this.createAudio(url, { volume: this.getVolume(name) })])
        );
        this.cooldowns = { jump: 90, land: 120, checkpoint: 120, streak: 250, fail: 400, ui: 120, blocked: 220 };
        this.lastPlay = {};

        this.btn = document.getElementById('mute-btn');
        this.iconOn = document.getElementById('icon-sound-on');
        this.iconOff = document.getElementById('icon-sound-off');

        this.btn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.toggleMute();
        });
    }

    createAudio(src, { loop = false, volume = 0.5 } = {}) {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.loop = loop;
        audio.volume = volume;
        return audio;
    }

    getVolume(name) {
        const volumes = {
            jump: 0.34,
            land: 0.26,
            checkpoint: 0.34,
            streak: 0.38,
            fail: 0.42,
            ui: 0.28,
            blocked: 0.24
        };
        return volumes[name] ?? 0.32;
    }

    unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        const unlockables = [this.bgm, ...Object.values(this.sfx)];
        unlockables.forEach((audio) => {
            try {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(() => {});
            } catch (_) {}
        });
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.bgm.pause();
            this.iconOn.classList.add('hidden');
            this.iconOff.classList.remove('hidden');
        } else {
            this.iconOn.classList.remove('hidden');
            this.iconOff.classList.add('hidden');
            if (gameState === 'PLAYING') this.playBGM();
        }
    }

    playBGM() {
        if (this.muted || !this.unlocked) return;
        this.bgm.play().catch(() => {});
    }

    stopBGM() {
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }

    playSFX(name) {
        if (this.muted || !this.unlocked || !this.sfx[name]) return;
        const now = performance.now();
        const cooldown = this.cooldowns[name] ?? 0;
        if (this.lastPlay[name] && now - this.lastPlay[name] < cooldown) return;
        this.lastPlay[name] = now;

        const base = this.sfx[name];
        const sound = base.cloneNode();
        sound.volume = base.volume;
        sound.play().catch(() => {});
    }
}

class ReactionManager {
    constructor() {
        this.panel = document.getElementById('reaction-panel');
        this.image = document.getElementById('reaction-gif');
        this.caption = document.getElementById('reaction-caption');
        this.timer = null;
    }

    show(type, duration = 1400) {
        const choice = MEDIA.gifs[type];
        if (!choice) return;
        this.image.src = choice.src;
        this.image.alt = choice.alt;
        this.caption.textContent = choice.label;
        this.panel.setAttribute('aria-hidden', 'false');
        this.panel.classList.add('show');
        clearTimeout(this.timer);
        this.timer = setTimeout(() => {
            this.panel.classList.remove('show');
            this.panel.setAttribute('aria-hidden', 'true');
        }, duration);
    }

    reset() {
        clearTimeout(this.timer);
        this.panel.classList.remove('show');
        this.panel.setAttribute('aria-hidden', 'true');
    }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioManager();
const reactions = new ReactionManager();

const LOGICAL_WIDTH = 720;
let scale = 1;
let width, height;

let gameState = 'START';
let score = 0;
let frameId;
let gameSpeed = 8;
let distance = 0;

const player = {
    x: 100,
    y: 0,
    w: 50,
    h: 50,
    dy: 0,
    jumpPower: -22,
    gravity: 1.2,
    grounded: false,
    wasGrounded: false,
    rotation: 0,
    jumps: 0,
    maxJumps: 2,
    blink: 0
};

let platforms = [];
let particles = [];
let stars = [];

const NEON_COLORS = ['#57f7ff', '#ff4fd8', '#d6ff57', '#7f7bff'];

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    scale = width / LOGICAL_WIDTH;
    if (scale > 1) scale = 1;
    
    initStars();
}
window.addEventListener('resize', resize);

function initStars() {
    stars = [];
    for(let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.1
        });
    }
}

function initGame() {
    score = 0;
    distance = 0;
    gameSpeed = 9 * scale;
    document.getElementById('score-display').innerText = score;
    
    player.w = 50 * scale;
    player.h = 50 * scale;
    player.x = width * 0.15;
    player.y = height / 2;
    player.dy = 0;
    player.jumps = 0;
    player.rotation = 0;
    player.blink = 0;
    player.wasGrounded = false;
    player.jumpPower = -20 * scale;
    player.gravity = 1.1 * scale;

    platforms = [];
    platforms.push({
        x: 0,
        y: height - (150 * scale),
        w: width * 1.5,
        h: 200 * scale,
        color: '#00f3ff'
    });

    particles = [];
    reactions.reset();
}

function spawnPlatform() {
    const lastP = platforms[platforms.length - 1];
    
    const minGap = 120 * scale;
    const maxGap = (250 * scale) + (distance * 0.01);
    const gap = Math.random() * (maxGap - minGap) + minGap;

    const w = (Math.random() * 300 + 200) * scale;
    const x = lastP.x + lastP.w + gap;
    
    const minH = height - (100 * scale);
    const maxH = height - (400 * scale);
    let y = Math.random() * (minH - maxH) + maxH;
    
    const maxDiff = 220 * scale;
    if (y < lastP.y - maxDiff) y = lastP.y - maxDiff;
    if (y > lastP.y + maxDiff) y = lastP.y + maxDiff;

    if (y > height - (50 * scale)) y = height - (100 * scale);
    if (y < (150 * scale)) y = (150 * scale);

    platforms.push({
        x: x,
        y: y,
        w: w,
        h: height,
        color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
        passed: false
    });
}

function createParticles(x, y, color, count = 10) {
    for(let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 15 * scale,
            vy: (Math.random() - 0.5) * 15 * scale,
            life: 1.0,
            color: color,
            size: (Math.random() * 4 + 2) * scale
        });
    }
}

function update() {
    distance += 1;
    if (distance % 500 === 0) gameSpeed += 0.2 * scale;

    player.dy += player.gravity;
    player.y += player.dy;
    
    player.blink += 0.08;
    if (!player.grounded) {
        player.rotation += 0.15;
    } else {
        player.rotation = player.rotation * 0.8; 
    }

    player.wasGrounded = player.grounded;
    player.grounded = false;

    if (platforms.length > 0) {
        if (platforms[platforms.length - 1].x < width + (500 * scale)) {
            spawnPlatform();
        }
    }

    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i];
        p.x -= gameSpeed;

        const px = player.x;
        const py = player.y;
        const pw = player.w;
        const ph = player.h;

        if (px + pw > p.x + (10 * scale) && px < p.x + p.w - (10 * scale)) {
            const prevY = py - player.dy;
            if (py + ph >= p.y && prevY + ph <= p.y + (25 * scale)) {
                player.grounded = true;
                player.dy = 0;
                player.y = p.y - ph;
                player.jumps = 0;
            }
        }
        
        if (px + pw > p.x && px < p.x + (20 * scale) && py + ph > p.y + (10 * scale)) {
            gameOver();
            return;
        }

        if (!p.passed && px > p.x + p.w) {
            p.passed = true;
            score++;
            document.getElementById('score-display').innerText = score;
            audio.playSFX('checkpoint');
            if (score % 5 === 0) {
                audio.playSFX('streak');
                reactions.show('checkpoint', 1500);
            }
        }

        if (p.x + p.w < -200) {
            platforms.splice(i, 1);
        }
    }

    if (player.grounded && !player.wasGrounded) {
        audio.playSFX('land');
    }

    if (player.y > height) {
        gameOver();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.04;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    
    stars.forEach(s => {
        s.x -= s.speed * (gameSpeed * 0.2);
        if (s.x < 0) s.x = width;
    });
}

function draw() {
    const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
    bgGradient.addColorStop(0, '#090b1d');
    bgGradient.addColorStop(0.55, '#150522');
    bgGradient.addColorStop(1, '#04040b');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    const horizonGlow = ctx.createRadialGradient(width * 0.5, height * 0.18, 10, width * 0.5, height * 0.18, width * 0.55);
    horizonGlow.addColorStop(0, 'rgba(87, 247, 255, 0.17)');
    horizonGlow.addColorStop(0.45, 'rgba(255, 79, 216, 0.08)');
    horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(87, 247, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) {
        const lineY = height * 0.22 + i * (height * 0.1);
        ctx.beginPath();
        ctx.moveTo(0, lineY);
        ctx.lineTo(width, lineY);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });

    platforms.forEach(p => {
        const towerGradient = ctx.createLinearGradient(p.x, p.y, p.x, height);
        towerGradient.addColorStop(0, 'rgba(28, 36, 72, 0.96)');
        towerGradient.addColorStop(0.16, 'rgba(12, 18, 42, 0.98)');
        towerGradient.addColorStop(1, 'rgba(4, 7, 18, 1)');
        ctx.shadowBlur = 16;
        ctx.shadowColor = p.color;
        ctx.fillStyle = towerGradient;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
        for (let band = 0; band < 4; band++) {
            ctx.fillRect(p.x + 8 * scale, p.y + (band * 18 + 10) * scale, Math.max(12 * scale, p.w - 16 * scale), 3 * scale);
        }

        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3 * scale;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.12;
        ctx.fillRect(p.x, p.y, p.w, 14 * scale);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    });

    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    ctx.rotate(player.rotation);

    ctx.shadowBlur = 24;
    ctx.shadowColor = '#57f7ff';

    const coreGradient = ctx.createLinearGradient(-player.w / 2, -player.h / 2, player.w / 2, player.h / 2);
    coreGradient.addColorStop(0, '#7cf8ff');
    coreGradient.addColorStop(0.55, '#4f7cff');
    coreGradient.addColorStop(1, '#ff4fd8');

    ctx.fillStyle = coreGradient;
    ctx.beginPath();
    ctx.roundRect(-player.w / 2, -player.h / 2, player.w, player.h, 14 * scale);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.86)';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(-player.w * 0.16, -player.h * 0.08, 4.5 * scale, 0, Math.PI * 2);
    ctx.arc(player.w * 0.16, -player.h * 0.08, 4.5 * scale, 0, Math.PI * 2);
    ctx.fill();

    const blinkOffset = Math.sin(player.blink) > 0.96 ? 0.6 * scale : 4.5 * scale;
    ctx.fillStyle = '#07101e';
    ctx.beginPath();
    ctx.ellipse(-player.w * 0.16, -player.h * 0.08, 2.4 * scale, blinkOffset, 0, 0, Math.PI * 2);
    ctx.ellipse(player.w * 0.16, -player.h * 0.08, 2.4 * scale, blinkOffset, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#07101e';
    ctx.lineWidth = 2.2 * scale;
    ctx.beginPath();
    ctx.arc(0, player.h * 0.08, player.w * 0.16, 0.15, Math.PI - 0.15);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-player.w * 0.08, player.h * 0.22, player.w * 0.16, player.h * 0.12);

    ctx.restore();

    particles.forEach(pt => {
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

function loop() {
    if (gameState === 'PLAYING') {
        update();
        draw();
        frameId = requestAnimationFrame(loop);
    }
}

function jump() {
    if (gameState !== 'PLAYING') {
        audio.playSFX('blocked');
        return;
    }

    if (player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
        player.jumps = 1;
        createParticles(player.x + player.w / 2, player.y + player.h, '#00f3ff');
        audio.playSFX('jump');
    } else if (player.jumps < player.maxJumps) {
        player.dy = player.jumpPower * 0.85;
        player.jumps++;
        createParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff00ff');
        audio.playSFX('jump');
    } else {
        audio.playSFX('blocked');
    }
}

function startGame() {
    audio.unlock();
    audio.playSFX('ui');
    gameState = 'PLAYING';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('opacity-0');
    document.getElementById('tutorial').classList.remove('opacity-0');
    
    setTimeout(() => {
        document.getElementById('tutorial').classList.add('opacity-0');
    }, 3000);

    audio.playBGM();
    initGame();
    loop();
}

function gameOver() {
    gameState = 'GAMEOVER';
    cancelAnimationFrame(frameId);
    audio.stopBGM();
    audio.playSFX('fail');
    reactions.show('fail', 1900);
    
    document.getElementById('hud').classList.add('opacity-0');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
}

/* [agent-note][stage4] mobile-actionability: keep gesture suppression on the gameplay canvas only so start/restart taps still emit click */
canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();
    audio.unlock();
    jump();
}, { passive: false });

canvas.addEventListener('mousedown', () => {
    audio.unlock();
    if (gameState === 'PLAYING') jump();
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

resize();
initStars();
draw();
</script>
</body>
