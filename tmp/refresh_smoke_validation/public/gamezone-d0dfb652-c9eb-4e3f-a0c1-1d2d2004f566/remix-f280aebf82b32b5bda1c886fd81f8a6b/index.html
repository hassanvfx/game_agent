<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meter Rush</title>
    <!-- [agent-note][stage4] repaired-font-plumbing: aligned title/UI fonts to exact catalogs/fonts.json entries -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <style>
        :root {
            --night-sky: #110f1f;
            --road-void: #1c1c28;
            --lane-glow: #8ef4ff;
            --taxi-gold: #ffd54a;
            --taxi-hot: #ff9f1c;
            --hazard-red: #ff5269;
            --panel-bg: rgba(10, 14, 28, 0.78);
            --panel-stroke: rgba(142, 244, 255, 0.5);
            --panel-glow: rgba(142, 244, 255, 0.18);
            --text-main: #f4f8ff;
        }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #1f2c52 0%, #141225 36%, #090811 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }
        body { position: fixed; inset: 0; }
        canvas { display: block; touch-action: none; }
        button {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: inherit;
            font-weight: inherit;
            cursor: pointer;
        }
        .glass {
            background:
                linear-gradient(180deg, rgba(19, 25, 46, 0.92), rgba(8, 12, 24, 0.84));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-stroke);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.45),
                0 0 18px var(--panel-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .text-shadow { text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 18px rgba(142, 244, 255, 0.22); }
        .text-outline { -webkit-text-stroke: 4px #05070d; paint-order: stroke fill; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(61, 98, 180, 0.35), transparent 40%),
                linear-gradient(180deg, #181827 0%, #090b13 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        #start-screen, #game-over-screen, button { pointer-events: auto; }

        #hud {
            position: absolute;
            top: 1rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 1rem;
        }

        #hud.hidden,
        #game-over-screen.hidden,
        #start-screen.hidden { display: none !important; }

        .hud-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 1rem;
        }
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only */

        .fare-card {
            padding: 0.75rem 1.5rem;
            transform: skewX(-12deg);
        }

        .fare-card > * { transform: skewX(12deg); }

        .damage-card { padding: 0.5rem 1rem; }

        .hud-label, .damage-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .hud-label { color: var(--lane-glow); }
        .damage-label { color: #fff4d6; margin-bottom: 0.35rem; }

        .hud-value {
            color: #fff;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .damage-dots { display: flex; gap: 0.25rem; }

        #start-screen, #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        #start-screen {
            flex-direction: column;
            background:
                linear-gradient(180deg, rgba(5, 8, 18, 0.56), rgba(4, 6, 14, 0.82)),
                radial-gradient(circle at 50% 18%, rgba(255, 213, 74, 0.16), transparent 28%);
            text-align: center;
        }

        .start-panel {
            position: relative;
            transform: translateY(-2.5rem);
            padding: 1.1rem 1rem 0;
        }
        .start-panel::before,
        .start-panel::after {
            content: "";
            position: absolute;
            inset: auto 50% -1.1rem;
            width: min(18rem, 72vw);
            height: 0.4rem;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, var(--lane-glow), transparent);
            opacity: 0.7;
            filter: blur(1px);
        }
        .start-panel::after {
            inset: -0.85rem 50% auto;
            width: min(12rem, 58vw);
            opacity: 0.55;
        }
        .game-title {
            margin: 0 0 0.5rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(3.1rem, 10vw, 6.4rem);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: 0.02em;
            color: var(--taxi-gold);
        }

        .game-title span { color: #fff; }

        .tagline {
            display: inline-block;
            margin: 0 0 1.5rem;
            padding: 0.75rem 1.2rem;
            border: 1px solid rgba(142, 244, 255, 0.5);
            border-radius: 999px;
            background: rgba(5, 10, 22, 0.75);
            color: #fff;
            font-size: clamp(0.95rem, 2.8vw, 1.2rem);
            font-weight: 700;
            box-shadow: 0 0 16px rgba(142, 244, 255, 0.14);
        }

        .hero-badge {
            position: relative;
            width: 6.75rem;
            height: 6.75rem;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--taxi-gold);
            border-radius: 1.6rem;
            background:
                radial-gradient(circle at 30% 30%, #2f467c, #121729 70%);
            box-shadow:
                0 12px 24px rgba(0,0,0,0.35),
                0 0 22px rgba(255, 213, 74, 0.18);
            font-size: 3rem;
        }
        .hero-badge::before {
            content: "★";
            position: absolute;
            top: 0.35rem;
            right: 0.45rem;
            color: var(--lane-glow);
            font-size: 0.9rem;
            text-shadow: 0 0 8px rgba(142, 244, 255, 0.7);
        }

        .warning-pill {
            display: inline-block;
            margin: 0;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            background: rgba(13, 8, 14, 0.9);
            color: #ff7387;
            font-size: 1rem;
            font-weight: 800;
            border: 1px solid rgba(255, 82, 105, 0.45);
            box-shadow: 0 0 14px rgba(255, 82, 105, 0.14);
        }

        #feedback-strip {
            margin-top: 1rem;
            min-height: 5.25rem;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            pointer-events: none;
        }

        .feedback-gif {
            width: min(8.5rem, 28vw);
            height: min(8.5rem, 28vw);
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(142, 244, 255, 0.55);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            background: rgba(8, 12, 24, 0.82);
        }

        #feedback-strip .hidden {
            display: none;
        }

        #game-over-screen { background: rgba(0, 0, 0, 0.8); }

        .game-over-card {
            width: min(22rem, calc(100vw - 2rem));
            margin: 1rem;
            padding: 2rem;
            border: 4px solid #FF4444;
            border-radius: 1.5rem;
            text-align: center;
        }

        .game-over-title {
            margin: 0 0 1rem;
            color: #FF4444;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            line-height: 0.95;
        }

        .game-over-label {
            margin-bottom: 0.25rem;
            color: #FFD700;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .final-score {
            margin-bottom: 2rem;
            color: #fff;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 900;
        }

        #restart-btn {
            width: 100%;
            border: none;
            border-bottom: 4px solid #b46b00;
            border-radius: 0.9rem;
            background: linear-gradient(180deg, #ffd54a, #ff9f1c);
            color: #130d02;
            font-size: 1.1rem;
            font-weight: 900;
            padding: 1rem 1.2rem;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 18px rgba(255, 159, 28, 0.2);
        }

        #restart-btn:hover { background: linear-gradient(180deg, #ffe27a, #ffb347); box-shadow: 0 12px 22px rgba(255, 159, 28, 0.28); }
        #restart-btn:active { transform: scale(0.98); }

        @keyframes rumble { 0% { transform: translate(0,0); } 25% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, 0); } 75% { transform: translate(0, -1px); } 100% { transform: translate(0,0); } }
        .animate-rumble { animation: rumble 0.2s linear infinite; }

        .damage-dot { width: 12px; height: 12px; border-radius: 50%; background: #26324d; border: 2px solid #5170a7; transition: all 0.3s; }
        .damage-dot.active { background: #FF4444; border-color: #FF0000; box-shadow: 0 0 8px #FF0000; }

        @media (max-width: 640px) {
            #hud { top: 0.75rem; padding: 0 0.75rem; gap: 0.75rem; }
            .fare-card { padding: 0.65rem 1rem; }
            .damage-card { padding: 0.5rem 0.75rem; }
            .hud-label, .damage-label { font-size: 0.72rem; }
            .warning-pill { font-size: 0.92rem; }
            .game-title { font-size: clamp(2.6rem, 15vw, 4.4rem); }
            .hero-badge { width: 5.8rem; height: 5.8rem; }
            .feedback-gif { width: min(6.4rem, 24vw); height: min(6.4rem, 24vw); }
            #restart-btn { font-size: 1rem; }
        }
    </style>
</head>

<script>
/**
 * Game Configuration
 */
window.gameConfigDefs = {
    "trafficSpeed": { "type": "number", "label": "Traffic Speed", "value": 500, "min": 300, "max": 800 },
    "steerSensitivity": { "type": "number", "label": "Steering", "value": 8, "min": 4, "max": 15 },
    "taxiColor": { "type": "color", "label": "Taxi Color", "value": "#FFD700" }
};

window.gameConfig = {
    trafficSpeed: 500,
    steerSensitivity: 8,
    taxiColor: "#FFD700"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

/**
 * Audio Manager
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgmNode = null;
        this.buffers = {};
        this.unlocked = false;
        this.muted = false;
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.45;
        this.masterGain.connect(this.ctx.destination);
        this.lastPlayedAt = {};
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        });
    }

    async loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = audioBuffer;
        } catch (e) {
            this.buffers[id] = fallbackType;
        }
    }

    playBgm() {
        if (this.bgmNode) return;
        const id = 'bgm_drive';
        if (this.buffers[id] && typeof this.buffers[id] !== 'string') {
            this.bgmNode = this.ctx.createBufferSource();
            this.bgmNode.buffer = this.buffers[id];
            this.bgmNode.loop = true;
            this.bgmNode.playbackRate.value = 1.04;
            const gain = this.ctx.createGain();
            gain.gain.value = 0.18;
            this.bgmNode.connect(gain);
            gain.connect(this.masterGain);
            this.bgmNode.start(0);
        }
    }

    stopBgm() {
        if (!this.bgmNode) return;
        try {
            this.bgmNode.stop(0);
        } catch (e) {}
        this.bgmNode.disconnect();
        this.bgmNode = null;
    }

    playSfx(id, options = {}) {
        if (this.muted || this.ctx.state === 'suspended') return;
        const nowMs = performance.now();
        const minInterval = options.minInterval ?? 90;
        if (this.lastPlayedAt[id] && nowMs - this.lastPlayedAt[id] < minInterval) return;
        this.lastPlayedAt[id] = nowMs;

        const buffer = this.buffers[id];
        if (buffer && typeof buffer !== 'string') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = buffer;
            gain.gain.value = options.volume ?? 0.55;
            source.connect(gain);
            gain.connect(this.masterGain);
            source.start(0);
        } else {
            this.synthesize(buffer || id, options.volume);
        }
    }

    synthesize(type, volume = 0.2) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);
        const now = this.ctx.currentTime;

        if (type === 'crash' || type === 'sfx_crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            gain.gain.setValueAtTime(Math.max(0.22, volume), now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start();
            osc.stop(now + 0.3);
        } else if (type === 'coin' || type === 'sfx_meter') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(Math.max(0.06, volume * 0.5), now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        } else if (type === 'warning' || type === 'sfx_warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.linearRampToValueAtTime(420, now + 0.18);
            gain.gain.setValueAtTime(Math.max(0.08, volume * 0.6), now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start();
            osc.stop(now + 0.2);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
            gain.gain.setValueAtTime(Math.max(0.05, volume * 0.45), now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start();
            osc.stop(now + 0.12);
        }
    }
}

/**
 * Game Engine
 */
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();
    
    // UI Refs
    const startScreen = document.getElementById('start-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score-display');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const comboGif = document.getElementById('combo-gif');
    const crashGif = document.getElementById('crash-gif');
    const damageDots = [
        document.getElementById('dmg-1'),
        document.getElementById('dmg-2'),
        document.getElementById('dmg-3'),
        document.getElementById('dmg-4'),
        document.getElementById('dmg-5')
    ];

    audio.loadSound('bgm_drive', 'bgm');
    audio.loadSound('sfx_crash', 'crash');
    audio.loadSound('sfx_meter', 'coin');
    audio.loadSound('sfx_start', 'start');
    audio.loadSound('sfx_restart', 'restart');
    audio.loadSound('sfx_gameover', 'gameover');
    audio.loadSound('sfx_warning', 'warning');

    // State
    let gameState = 'MENU';
    let lastTime = 0;
    let fare = 0.00;
    let damage = 0;
    const MAX_DAMAGE = 5;
    
    // Entities
    let taxi = { x: 0, y: 0, width: 40, height: 70, targetX: 0, angle: 0 };
    let traffic = [];
    let roadStripes = [];
    let particles = [];
    let floatingTexts = [];
    
    let shake = 0;
    let roadOffset = 0;
    let laneCount = 4;
    let laneWidth = 0;
    let meterMilestone = 0;
    let warningTriggered = false;
    let feedbackTimers = { combo: null, crash: null };

    // Resize
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        laneWidth = window.innerWidth / laneCount;
        
        if (gameState === 'MENU') {
            taxi.x = window.innerWidth / 2;
            taxi.y = window.innerHeight * 0.8;
            taxi.targetX = window.innerWidth / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    function showGif(el, key, duration = 1400) {
        if (!el) return;
        el.classList.remove('hidden');
        if (feedbackTimers[key]) clearTimeout(feedbackTimers[key]);
        feedbackTimers[key] = setTimeout(() => el.classList.add('hidden'), duration);
    }

    function hideAllGifs() {
        comboGif.classList.add('hidden');
        crashGif.classList.add('hidden');
        Object.values(feedbackTimers).forEach(timer => timer && clearTimeout(timer));
        feedbackTimers = { combo: null, crash: null };
    }

    // Input
    let isPointerDown = false;
    function handleInput(x) {
        if (gameState === 'MENU') startGame();
        if (gameState === 'PLAYING') {
            taxi.targetX = x;
        }
    }

    document.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        audio.unlock();
        handleInput(e.clientX);
    }, { passive: false });

    document.addEventListener('pointermove', (e) => {
        if (isPointerDown) {
            e.preventDefault();
            handleInput(e.clientX);
        }
    }, { passive: false });

    const endPointer = () => { isPointerDown = false; };
    document.addEventListener('pointerup', endPointer);
    document.addEventListener('pointercancel', endPointer);
    
    restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        audio.unlock();
        audio.playSfx('sfx_restart', { volume: 0.45, minInterval: 120 });
        resetGame();
    });

    // Logic
    function startGame() {
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        audio.playSfx('sfx_start', { volume: 0.42, minInterval: 120 });
        audio.playBgm();
        resetGameVars();
    }

    function resetGame() {
        gameState = 'PLAYING';
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        audio.playBgm();
        resetGameVars();
    }

    function resetGameVars() {
        fare = 0.00;
        damage = 0;
        traffic = [];
        particles = [];
        floatingTexts = [];
        shake = 0;
        meterMilestone = 0;
        warningTriggered = false;
        hideAllGifs();
        updateUI();
        
        taxi.x = window.innerWidth / 2;
        taxi.y = window.innerHeight * 0.8;
        taxi.targetX = window.innerWidth / 2;
        taxi.angle = 0;
        
        // Init road stripes
        roadStripes = [];
        for(let i=0; i<10; i++) {
            roadStripes.push({ y: i * 150 });
        }
    }
    
    function updateUI() {
        scoreEl.innerText = fare.toFixed(2);
        damageDots.forEach((dot, i) => {
            if (i < damage) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }

    function spawnTraffic() {
        const lane = Math.floor(Math.random() * laneCount);
        const x = (lane * laneWidth) + (laneWidth / 2);
        
        // Ensure no overlap on spawn
        const tooClose = traffic.some(t => Math.abs(t.y + 100) < 100 && Math.abs(t.x - x) < 50);
        if (tooClose) return;

        traffic.push({
            x: x,
            y: -100,
            width: 40,
            height: 70,
            speed: (Math.random() * 0.5 + 0.5) * window.gameConfig.trafficSpeed * 0.8, // Slower than player effective speed
            color: Math.random() > 0.5 ? '#FF4444' : '#4488FF',
            hit: false
        });
    }

    function spawnParticles(x, y, color, count, type = 'spark') {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 600,
                vy: (Math.random() - 0.5) * 600,
                life: 1.0,
                color: color,
                type: type
            });
        }
    }
    
    function spawnFloatingText(text, x, y, color) {
        floatingTexts.push({
            text: text,
            x: x,
            y: y,
            life: 1.5,
            color: color
        });
    }

    function update(dt) {
        if (gameState !== 'PLAYING') return;

        const speed = window.gameConfig.trafficSpeed;

        // Fare Accumulation
        fare += dt * 2.50; // $2.50 per second driving

        const nextMilestone = Math.floor(fare / 15);
        if (nextMilestone > meterMilestone) {
            meterMilestone = nextMilestone;
            audio.playSfx('sfx_meter', { volume: 0.26, minInterval: 180 });
            showGif(comboGif, 'combo', 1200);
            spawnFloatingText("METER UP!", taxi.x - 10, taxi.y - 90, "#8ef4ff");
        }

        if (damage >= MAX_DAMAGE - 1 && !warningTriggered) {
            warningTriggered = true;
            audio.playSfx('sfx_warning', { volume: 0.3, minInterval: 250 });
        } else if (damage < MAX_DAMAGE - 1) {
            warningTriggered = false;
        }

        updateUI();

        // Taxi Movement
        const dx = taxi.targetX - taxi.x;
        taxi.x += dx * window.gameConfig.steerSensitivity * dt;
        // Clamp to road
        taxi.x = Math.max(taxi.width/2, Math.min(window.innerWidth - taxi.width/2, taxi.x));
        
        // Tilt logic
        taxi.angle = (dx * 0.05) * (Math.PI / 180); 
        taxi.angle = Math.max(-0.3, Math.min(0.3, taxi.angle));

        // Road Stripes
        roadOffset += speed * dt;
        if (roadOffset > 100) roadOffset = 0;

        // Spawning
        if (Math.random() < 0.03) spawnTraffic();

        // Update Traffic
        for (let i = traffic.length - 1; i >= 0; i--) {
            let t = traffic[i];
            // Relative speed: Traffic moves down because we are faster
            t.y += speed * dt; 
            
            if (t.y > window.innerHeight + 100) {
                traffic.splice(i, 1);
                continue;
            }

            // Collision
            if (!t.hit) {
                const xOverlap = Math.abs(taxi.x - t.x) < (taxi.width + t.width) * 0.4;
                const yOverlap = Math.abs(taxi.y - t.y) < (taxi.height + t.height) * 0.4;

                if (xOverlap && yOverlap) {
                    t.hit = true;
                    handleCrash(t);
                }
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 3;
            if (p.life <= 0) particles.splice(i, 1);
        }
        
        // Floating Texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 50 * dt;
            ft.life -= dt;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        // Shake Decay
        if (shake > 0) shake = Math.max(0, shake - 30 * dt);
    }

    function handleCrash(enemy) {
        shake = 25;
        audio.playSfx('sfx_crash', { volume: 0.6, minInterval: 140 });
        showGif(crashGif, 'crash', 1600);
        
        // Penalty Logic
        fare -= 10.00;
        damage++;
        updateUI();
        
        // Visuals
        spawnParticles((taxi.x + enemy.x)/2, (taxi.y + enemy.y)/2, '#FF4444', 20);
        spawnParticles((taxi.x + enemy.x)/2, (taxi.y + enemy.y)/2, '#FFF', 10);
        spawnFloatingText("-$10.00", taxi.x, taxi.y - 50, "#FF4444");
        
        // Push enemy away
        enemy.x += (enemy.x - taxi.x) * 2;
        
        if (damage >= MAX_DAMAGE) {
            triggerGameOver();
        }
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        finalScoreEl.innerText = fare.toFixed(2);
        hud.classList.add('hidden');
        audio.stopBgm();
        audio.playSfx('sfx_gameover', { volume: 0.52, minInterval: 200 });
        showGif(crashGif, 'crash', 2200);
        setTimeout(() => {
            gameOverScreen.classList.remove('hidden');
        }, 500);
    }

    function draw() {
        // Background (Asphalt)
        ctx.fillStyle = '#2D2D2D';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        }

        // Parallax Sidewalks
        ctx.fillStyle = '#444';
        ctx.fillRect(0, 0, 20, canvas.height);
        ctx.fillRect(canvas.width - 20, 0, 20, canvas.height);

        // Road Stripes
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 4;
        ctx.setLineDash([40, 60]);
        ctx.lineDashOffset = -roadOffset;
        
        for (let i = 1; i < laneCount; i++) {
            const x = i * laneWidth;
            ctx.beginPath();
            ctx.moveTo(x, -100);
            ctx.lineTo(x, canvas.height + 100);
            ctx.stroke();
        }
        ctx.setLineDash([]); // Reset

        // Traffic
        traffic.forEach(t => {
            ctx.save();
            ctx.translate(t.x, t.y);
            
            // Body
            ctx.fillStyle = t.color;
            roundRect(ctx, -t.width/2, -t.height/2, t.width, t.height, 8);
            ctx.fill();
            
            // Roof
            ctx.fillStyle = '#222';
            ctx.fillRect(-t.width/2 + 4, -t.height/2 + 15, t.width - 8, t.height * 0.3);
            
            // Lights
            ctx.fillStyle = '#FF0000'; // Tail lights
            ctx.fillRect(-t.width/2 + 4, -t.height/2, 8, 4);
            ctx.fillRect(t.width/2 - 12, -t.height/2, 8, 4);
            
            ctx.restore();
        });

        if (gameState === 'PLAYING' || gameState === 'MENU') {
            // Player Taxi
            ctx.save();
            ctx.translate(taxi.x, taxi.y);
            ctx.rotate(taxi.angle);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            roundRect(ctx, -taxi.width/2 + 5, -taxi.height/2 + 5, taxi.width, taxi.height, 8);
            ctx.fill();

            // Body
            ctx.fillStyle = window.gameConfig.taxiColor;
            roundRect(ctx, -taxi.width/2, -taxi.height/2, taxi.width, taxi.height, 8);
            ctx.fill();

            // Checkers
            ctx.fillStyle = '#000';
            const checkSize = 6;
            for(let cx = -taxi.width/2; cx < taxi.width/2; cx+=checkSize*2) {
                ctx.fillRect(cx, -taxi.height/2, checkSize, checkSize);
                ctx.fillRect(cx + checkSize, -taxi.height/2 + checkSize, checkSize, checkSize);
                
                ctx.fillRect(cx, taxi.height/2 - checkSize*2, checkSize, checkSize);
                ctx.fillRect(cx + checkSize, taxi.height/2 - checkSize, checkSize, checkSize);
            }

            // Windshield/Roof
            ctx.fillStyle = '#333';
            ctx.fillRect(-taxi.width/2 + 4, -taxi.height/2 + 15, taxi.width - 8, 20); // Front window
            ctx.fillRect(-taxi.width/2 + 4, taxi.height/2 - 20, taxi.width - 8, 10); // Back window
            
            // Taxi Sign
            ctx.fillStyle = '#FFF';
            ctx.fillRect(-8, -10, 16, 8);
            ctx.fillStyle = '#000';
            ctx.font = '600 6px Rajdhani, system-ui, sans-serif';
            ctx.fillText('TAXI', -6, -4);
            
            // Headlights
            ctx.fillStyle = '#FFFFCC';
            ctx.beginPath();
            ctx.arc(-taxi.width/2 + 8, taxi.height/2, 4, 0, Math.PI*2);
            ctx.arc(taxi.width/2 - 8, taxi.height/2, 4, 0, Math.PI*2);
            ctx.fill();
            
            // Headlight beams
            ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
            ctx.beginPath();
            ctx.moveTo(-taxi.width/2 + 8, taxi.height/2);
            ctx.lineTo(-taxi.width/2 - 20, taxi.height/2 + 150);
            ctx.lineTo(-taxi.width/2 + 30, taxi.height/2 + 150);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(taxi.width/2 - 8, taxi.height/2);
            ctx.lineTo(taxi.width/2 - 30, taxi.height/2 + 150);
            ctx.lineTo(taxi.width/2 + 20, taxi.height/2 + 150);
            ctx.fill();

            ctx.restore();
        }

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.type === 'spark' ? 3 : 5, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        
        // Floating Texts
        floatingTexts.forEach(ft => {
            ctx.globalAlpha = Math.min(1, ft.life);
            ctx.fillStyle = ft.color;
            ctx.font = '700 24px Rajdhani';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.strokeText(ft.text, ft.x - 30, ft.y);
            ctx.fillText(ft.text, ft.x - 30, ft.y);
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.stopBgm();
        } else if (gameState === 'PLAYING' && audio.unlocked) {
            audio.playBgm();
        }
    });
    
    // Helper for rounded rects
    function roundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            update(dt);
            draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
