<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Midnight Chase</title>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide, ui=Rajdhani via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-white: rgba(245, 248, 255, 0.98);
            --ui-muted: rgba(202, 227, 255, 0.78);
            --panel-bg: rgba(10, 20, 48, 0.56);
            --panel-border: rgba(102, 224, 255, 0.36);
            --accent-cyan: #66e0ff;
            --accent-violet: #b36bff;
            --accent-hot: #ff4f8f;
            --shadow-deep: rgba(2, 5, 18, 0.72);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(179, 107, 255, 0.16), transparent 34%),
                radial-gradient(circle at 20% 80%, rgba(102, 224, 255, 0.12), transparent 30%),
                linear-gradient(180deg, #16081f 0%, #060814 58%, #02040c 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            color: var(--ui-white);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button { font: inherit; }

        .font-drama {
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(18, 27, 60, 0.78), rgba(8, 12, 28, 0.88)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 14px 40px var(--shadow-deep),
                0 0 24px rgba(102, 224, 255, 0.12);
        }

        .text-stroke {
            -webkit-text-stroke: 1px rgba(215, 244, 255, 0.82);
            color: transparent;
        }

        .text-glow {
            text-shadow:
                0 0 10px rgba(102, 224, 255, 0.32),
                0 0 18px rgba(179, 107, 255, 0.22);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        .pointer-auto { pointer-events: auto; }

        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        #ui-title {
            position: absolute;
            top: 15vh;
            width: 100%;
            margin: 0;
            text-align: center;
            font-size: clamp(2.9rem, 10vw, 6.2rem);
            line-height: 0.92;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 400;
            filter: drop-shadow(0 0 18px rgba(102, 224, 255, 0.24));
        }

        #ui-cta {
            position: absolute;
            bottom: 10vh;
            width: 100%;
            margin: 0;
            padding: 0 1.25rem;
            text-align: center;
            font-size: clamp(0.95rem, 2.8vw, 1.35rem);
            letter-spacing: 0.12em;
            color: var(--ui-muted);
        }

        #ui-cta span {
            display: inline-block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 0.25rem;
        }

        #hud {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            transition: opacity 0.5s;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 60;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(72px, 19vw, 140px);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
            will-change: opacity, transform;
        }

        .feedback-gif.active {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #collect-gif {
            right: 1rem;
            bottom: 5.25rem;
        }

        #fail-gif {
            left: 50%;
            bottom: min(18vh, 9rem);
            transform: translateX(-50%) translateY(12px) scale(0.92);
            width: clamp(92px, 28vw, 176px);
        }

        #fail-gif.active {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #status-chip {
            position: absolute;
            right: 1rem;
            top: 1rem;
            max-width: min(42vw, 16rem);
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(102, 224, 255, 0.26);
            background: rgba(8, 12, 28, 0.72);
            color: var(--ui-muted);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.88rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
            text-align: center;
        }

        #status-chip.active {
            opacity: 1;
            transform: translateY(0);
        }

        #hud .score-line {
            position: relative;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(102, 224, 255, 0.3);
            background: linear-gradient(180deg, rgba(11, 20, 48, 0.84), rgba(5, 10, 24, 0.9));
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        #hud.hidden,
        #game-over-screen.hidden,
        #start-screen.hidden {
            display: none;
        }

        #hud .score-line {
            font-size: clamp(0.88rem, 2.6vw, 1.25rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            transition: opacity 0.5s ease, transform 0.3s ease;
            opacity: 0;
        }

        #game-over-screen.opacity-100 { opacity: 1; }
        #game-over-screen.opacity-0 { opacity: 0; }

        #game-over-panel {
            width: min(92vw, 28rem);
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        #game-over-screen.opacity-100 #game-over-panel {
            transform: scale(1);
        }

        #game-over-panel h2 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.8rem, 6vw, 2.7rem);
            color: #ff8bb2;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(255, 79, 143, 0.28);
        }

        #game-over-panel .summary {
            margin-bottom: 1.5rem;
            font-size: clamp(1.1rem, 3vw, 1.45rem);
            opacity: 0.86;
        }

        #restart-btn {
            padding: 0.9rem 1.65rem;
            border: 1px solid rgba(102, 224, 255, 0.32);
            border-radius: 999px;
            background: linear-gradient(135deg, #ff4f8f, #8c5bff);
            color: #fff;
            cursor: pointer;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 28px rgba(34, 0, 59, 0.42);
            touch-action: manipulation;
        }

        #restart-btn:hover,
        #restart-btn:focus-visible {
            background: linear-gradient(135deg, #ff689d, #9f73ff);
            transform: translateY(-1px);
            box-shadow: 0 12px 32px rgba(58, 14, 100, 0.5);
            outline: none;
        }

        /* Breathing animation for title/cta inner spans */
        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .animate-breathe { animation: breathe 3s ease-in-out infinite; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .animate-pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

        @media (max-width: 640px) {
            #ui-title {
                top: 16vh;
                font-size: clamp(2.4rem, 14vw, 4.2rem);
                letter-spacing: 0.12em;
            }

            #ui-cta {
                bottom: 9vh;
                font-size: 0.88rem;
                letter-spacing: 0.08em;
            }

            #hud {
                top: 1rem;
                left: 1rem;
            }

            #status-chip {
                right: 0.85rem;
                top: 0.85rem;
                max-width: 11rem;
                padding: 0.45rem 0.65rem;
                font-size: 0.62rem;
            }

            #collect-gif {
                right: 0.6rem;
                bottom: 4.2rem;
                width: 84px;
            }

            #fail-gif {
                bottom: 6.5rem;
                width: 120px;
            }

            #hud .score-line {
                padding: 0.45rem 0.72rem;
                font-size: 0.8rem;
            }

            #game-over-panel {
                padding: 1.5rem;
            }

            #restart-btn {
                width: 100%;
                max-width: 16rem;
            }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Pulse Speed", "value": 6, "min": 1, "max": 15 },
    "spawnRate": { "type": "number", "label": "Storm Intensity", "value": 1.2, "min": 0.5, "max": 3.0 },
    "themeColor": { "type": "color", "label": "Signal Color", "value": "#ff0044" }
}
</script>

<!-- §3.3 Media Declaration -->
<!-- [agent-note][stage3] resolved-gif: collect/fail overlays use catalogs/gifs.json and stay off the playfield -->
<img id="collect-gif" class="feedback-gif" alt="Collected star celebration" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" hidden>
<img id="fail-gif" class="feedback-gif" alt="Stormed out reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" hidden>

<!-- Audio Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/start/collect/fail/ui -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Night Drive BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="Collect Signal" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Caught by the Storm" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="Start Run" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI Confirm" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="feedback-layer" aria-hidden="true">
            <div id="status-chip">tap to tune the neon pulse</div>
        </div>
        <div id="start-screen" class="pointer-auto">
            <h1 id="ui-title" class="font-drama">
                <span class="inline-block text-stroke animate-breathe">Midnight<br>Chase</span>
            </h1>
            <p id="ui-cta">
                <span class="animate-pulse-soft">GUIDE THE NEON HEART TO GATHER STARS AND SLIP PAST THE RAIN</span>
            </p>
        </div>

        <div id="hud" class="hidden">
            <div class="font-drama score-line text-glow">
                STARS: <span id="score">0</span>
            </div>
        </div>

        <div id="game-over-screen" class="hidden opacity-0">
            <div id="game-over-panel" class="glass">
                <h2 class="font-drama">STORMED OUT</h2>
                <div class="summary">Stars secured: <span id="finalScore"><span>0</span></span></div>
                <button id="restart-btn">
                    RUN AGAIN
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * MIDNIGHT CHASE - Game Logic
 */

const CONFIG = {
    heroSpeed: 6,
    spawnRate: 1.2,
    themeColor: '#ff0044',
    bgGradientTop: '#1a0510',
    bgGradientBottom: '#000000'
};

const state = {
    isPlaying: false,
    score: 0,
    frames: 0,
    lastTime: 0,
    entities: [],
    particles: [],
    shake: 0,
    width: 0,
    height: 0,
    hero: { x: 0, y: 0, r: 20, targetX: 0, targetY: 0 },
    pointer: { x: 0, y: 0, isDown: false },
    feedbackTimers: {},
    lastCollectAt: 0
};

class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.buffers = {};
        this.fallbackEls = {};
        this.bufferVolumes = {
            bgm_main: 0.2,
            sfx_collect: 0.48,
            sfx_fail: 0.5,
            sfx_start: 0.4,
            sfx_ui: 0.3
        };

        const unlock = () => {
            if (this.unlocked) return;
            this.initCtx();
            this.unlocked = true;
            this.playBgm();
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));
    }

    initCtx() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            ['sfx_collect', 'sfx_fail', 'sfx_start', 'sfx_ui'].forEach(id => this.loadSound(id));
        }

        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        ['bgm_main', 'sfx_collect', 'sfx_fail', 'sfx_start', 'sfx_ui'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.volume = this.bufferVolumes[id] || 0.4;
                this.fallbackEls[id] = el;
            }
        });
    }

    async loadSound(id) {
        const el = document.getElementById(id);
        if (!el || !el.src || !this.ctx) return;

        try {
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) {
                return;
            }

            const res = await fetch(srcUrl.href);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, using element or synth fallback', id);
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = this.bufferVolumes.bgm_main;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id) {
        if (this.ctx && this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = this.bufferVolumes[id] || 0.4;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
            return;
        }

        const el = this.fallbackEls[id] || document.getElementById(id);
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = this.bufferVolumes[id] || 0.4;
                el.play().catch(() => {});
                return;
            } catch (e) {}
        }

        this.synthesize(id === 'sfx_collect' || id === 'sfx_start' || id === 'sfx_ui' ? 'ping' : 'crash');
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'ping') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1160, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.22);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(52, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        }
    }
}

const audio = new AudioManager();

window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Pulse Speed", "value": 6, "min": 1, "max": 15 },
    "spawnRate": { "type": "number", "label": "Storm Intensity", "value": 1.2, "min": 0.5, "max": 3.0 },
    "themeColor": { "type": "color", "label": "Signal Color", "value": "#ff0044" }
};
window.gameConfig = {
    heroSpeed: 6,
    spawnRate: 1.2,
    themeColor: '#ff0044'
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') CONFIG.themeColor = val;
        if (key === 'heroSpeed') CONFIG.heroSpeed = val;
        if (key === 'spawnRate') CONFIG.spawnRate = val;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const parsed = JSON.parse(cfgEl.textContent);
            Object.keys(parsed).forEach(k => {
                window.gameConfig[k] = parsed[k].value;
                if (CONFIG.hasOwnProperty(k)) CONFIG[k] = parsed[k].value;
            });
        }
    } catch(e) {
        console.error('Config parse error', e);
    }

    initGame();
});

function initGame() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const resize = () => {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = state.width * dpr;
        canvas.height = state.height * dpr;
        canvas.style.width = state.width + 'px';
        canvas.style.height = state.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (state.hero.x === 0) {
            state.hero.x = state.width / 2;
            state.hero.y = state.height * 0.8;
            state.hero.targetX = state.hero.x;
            state.hero.targetY = state.hero.y;
        }
    };
    window.addEventListener('resize', resize);
    resize();

    const inputHandler = (e) => {
        e.preventDefault();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        const rect = canvas.getBoundingClientRect();
        state.pointer.x = clientX - rect.left;
        state.pointer.y = clientY - rect.top;
        state.pointer.isDown = true;

        if (!state.isPlaying && e.type === 'pointerdown') {
            if (!e.target.closest('button') && !e.target.closest('#game-over-screen')) {
                startGame();
            }
        }
    };

    const stopInput = () => { state.pointer.isDown = false; };

    window.addEventListener('pointerdown', inputHandler, { passive: false });
    window.addEventListener('pointermove', inputHandler, { passive: false });
    window.addEventListener('pointerup', stopInput);
    window.addEventListener('pointercancel', stopInput);

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audio.initCtx();
        audio.playSfx('sfx_ui');
        startGame();
    });

    let lastTime = performance.now();
    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        try {
            update(dt);
            render(ctx, dt);
        } catch (e) {
            console.error('Game Loop Error:', e);
        }

        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
}

function showFeedback(id, message, duration = 900) {
    const el = document.getElementById(id);
    const chip = document.getElementById('status-chip');
    if (!el) return;

    if (state.feedbackTimers[id]) {
        clearTimeout(state.feedbackTimers[id]);
    }

    el.hidden = false;
    el.classList.add('active');

    if (chip && message) {
        chip.textContent = message;
        chip.classList.add('active');
        if (state.feedbackTimers.statusChip) {
            clearTimeout(state.feedbackTimers.statusChip);
        }
        state.feedbackTimers.statusChip = setTimeout(() => {
            chip.classList.remove('active');
        }, duration);
    }

    state.feedbackTimers[id] = setTimeout(() => {
        el.classList.remove('active');
        setTimeout(() => {
            el.hidden = true;
        }, 220);
    }, duration);
}

function startGame() {
    state.isPlaying = true;
    state.score = 0;
    state.entities = [];
    state.particles = [];
    state.shake = 0;
    state.lastCollectAt = 0;
    state.hero.x = state.width / 2;
    state.hero.y = state.height * 0.8;
    state.hero.targetX = state.hero.x;
    state.hero.targetY = state.hero.y;

    document.getElementById('score').innerText = '0';
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('opacity-100');
    document.getElementById('game-over-screen').classList.add('opacity-0');
    document.getElementById('hud').classList.remove('hidden');

    audio.initCtx();
    audio.playSfx('sfx_start');
    audio.playBgm();
    showFeedback('collect-gif', 'run live', 650);
}

function gameOver() {
    state.isPlaying = false;
    state.shake = 20;
    audio.playSfx('sfx_fail');
    audio.stopBgm();
    showFeedback('fail-gif', 'storm breach', 1500);

    for (let i = 0; i < 30; i++) {
        spawnParticle(state.hero.x, state.hero.y, CONFIG.themeColor, 5);
    }

    setTimeout(() => {
        document.getElementById('finalScore').innerText = state.score;
        document.getElementById('game-over-screen').classList.remove('hidden');
        requestAnimationFrame(() => {
            document.getElementById('game-over-screen').classList.remove('opacity-0');
            document.getElementById('game-over-screen').classList.add('opacity-100');
        });
        document.getElementById('hud').classList.add('hidden');
    }, 500);
}

function update(dt) {
    if (state.shake > 0) {
        state.shake *= 0.9;
        if (state.shake < 0.5) state.shake = 0;
    }

    if (state.isPlaying) {
        if (state.pointer.isDown) {
            state.hero.targetX = state.pointer.x;
            state.hero.targetY = state.pointer.y;
            state.hero.targetX = Math.max(state.hero.r, Math.min(state.width - state.hero.r, state.hero.targetX));
            state.hero.targetY = Math.max(state.hero.r, Math.min(state.height - state.hero.r, state.hero.targetY));
        }

        const dx = state.hero.targetX - state.hero.x;
        const dy = state.hero.targetY - state.hero.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 1) {
            const speed = CONFIG.heroSpeed * 60;
            const step = Math.min(dist, speed * dt);
            state.hero.x += (dx / dist) * step;
            state.hero.y += (dy / dist) * step;
        }
    } else {
        const time = performance.now() / 1000;
        state.hero.y += Math.sin(time * 2) * 0.5;
    }

    if (state.isPlaying) {
        state.frames++;
        if (Math.random() < 0.02 * CONFIG.spawnRate) {
            state.entities.push({
                type: 'tear',
                x: Math.random() * state.width,
                y: -50,
                r: 10 + Math.random() * 10,
                speed: 100 + Math.random() * 150 * CONFIG.spawnRate,
                angle: Math.PI / 2
            });
        }
        if (Math.random() < 0.01) {
            state.entities.push({
                type: 'rose',
                x: Math.random() * (state.width - 40) + 20,
                y: -50,
                r: 15,
                speed: 80 + Math.random() * 50,
                angle: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 2
            });
        }
    }

    for (let i = state.entities.length - 1; i >= 0; i--) {
        const ent = state.entities[i];
        ent.y += ent.speed * dt;
        if (ent.type === 'rose') ent.angle += ent.rotSpeed * dt;

        if (state.isPlaying) {
            const dx = ent.x - state.hero.x;
            const dy = ent.y - state.hero.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = ent.r + state.hero.r * 0.8;

            if (dist < minDist) {
                if (ent.type === 'rose') {
                    state.score++;
                    document.getElementById('score').innerText = state.score;
                    audio.playSfx('sfx_collect');
                    const now = performance.now();
                    if (now - state.lastCollectAt > 180) {
                        showFeedback('collect-gif', state.score > 0 && state.score % 5 === 0 ? 'combo surge' : 'star secured', 720);
                        state.lastCollectAt = now;
                    }
                    for (let j = 0; j < 8; j++) {
                        spawnParticle(ent.x, ent.y, '#ffd700', 2);
                    }
                    state.entities.splice(i, 1);
                    continue;
                } else if (ent.type === 'tear') {
                    gameOver();
                    continue;
                }
            }
        }

        if (ent.y > state.height + 50) {
            state.entities.splice(i, 1);
        }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
}

function spawnParticle(x, y, color, speedMult) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 100 * speedMult;
    state.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.5 + Math.random() * 0.5,
        color: color,
        size: Math.random() * 4 + 2
    });
}

function render(ctx) {
    ctx.fillStyle = CONFIG.bgGradientTop;
    ctx.fillRect(0, 0, state.width, state.height);

    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, '#1a0b28');
    grad.addColorStop(0.45, '#0d1330');
    grad.addColorStop(1, '#03050d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    const moonGlow = ctx.createRadialGradient(state.width * 0.78, state.height * 0.18, 10, state.width * 0.78, state.height * 0.18, Math.min(state.width, state.height) * 0.22);
    moonGlow.addColorStop(0, 'rgba(141, 221, 255, 0.28)');
    moonGlow.addColorStop(0.4, 'rgba(179, 107, 255, 0.14)');
    moonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = moonGlow;
    ctx.fillRect(0, 0, state.width, state.height);

    const skylineBase = state.height * 0.74;
    ctx.save();
    ctx.fillStyle = 'rgba(8, 12, 28, 0.92)';
    for (let i = 0; i < 8; i++) {
        const x = (state.width / 7) * i - 18;
        const w = 32 + (i % 3) * 16;
        const h = 50 + (i % 4) * 28;
        ctx.fillRect(x, skylineBase - h, w, h);
        ctx.fillStyle = 'rgba(102, 224, 255, 0.2)';
        for (let j = 0; j < 3; j++) {
            ctx.fillRect(x + 7 + j * 8, skylineBase - h + 10, 3, Math.max(8, h - 22));
        }
        ctx.fillStyle = 'rgba(8, 12, 28, 0.92)';
    }
    ctx.restore();

    ctx.save();
    if (state.shake > 0) {
        const dx = (Math.random() - 0.5) * state.shake;
        const dy = (Math.random() - 0.5) * state.shake;
        ctx.translate(dx, dy);
    }

    state.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    state.entities.forEach(ent => {
        if (ent.type === 'tear') {
            const tearGrad = ctx.createLinearGradient(ent.x, ent.y - ent.r * 1.5, ent.x, ent.y + ent.r * 1.5);
            tearGrad.addColorStop(0, '#d6f3ff');
            tearGrad.addColorStop(1, '#4ca7ff');
            ctx.fillStyle = tearGrad;
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#7cd6ff';
            ctx.beginPath();
            ctx.moveTo(ent.x, ent.y - ent.r * 1.1);
            ctx.quadraticCurveTo(ent.x + ent.r * 0.85, ent.y - ent.r * 0.15, ent.x, ent.y + ent.r * 1.25);
            ctx.quadraticCurveTo(ent.x - ent.r * 0.85, ent.y - ent.r * 0.15, ent.x, ent.y - ent.r * 1.1);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.beginPath();
            ctx.ellipse(ent.x - ent.r * 0.2, ent.y - ent.r * 0.15, ent.r * 0.18, ent.r * 0.38, -0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else if (ent.type === 'rose') {
            ctx.save();
            ctx.translate(ent.x, ent.y);
            ctx.rotate(ent.angle);
            const starGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, ent.r);
            starGrad.addColorStop(0, '#fff9d6');
            starGrad.addColorStop(0.45, '#ffd86f');
            starGrad.addColorStop(1, '#ff8a00');
            ctx.fillStyle = starGrad;
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ffd56a';

            for (let k = 0; k < 5; k++) {
                ctx.save();
                ctx.rotate((Math.PI * 2 / 5) * k);
                ctx.beginPath();
                ctx.moveTo(0, -ent.r);
                ctx.lineTo(ent.r * 0.32, -ent.r * 0.22);
                ctx.lineTo(ent.r, 0);
                ctx.lineTo(ent.r * 0.32, ent.r * 0.22);
                ctx.lineTo(0, ent.r);
                ctx.lineTo(-ent.r * 0.32, ent.r * 0.22);
                ctx.lineTo(-ent.r, 0);
                ctx.lineTo(-ent.r * 0.32, -ent.r * 0.22);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            ctx.fillStyle = '#fffef6';
            ctx.beginPath();
            ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    });

    ctx.save();
    ctx.translate(state.hero.x, state.hero.y);

    const pulse = 1 + Math.sin(performance.now() * 0.01) * 0.05;
    ctx.scale(pulse, pulse);

    const r = state.hero.r;
    const heartGrad = ctx.createLinearGradient(-r, -r, r, r);
    heartGrad.addColorStop(0, '#ff83b1');
    heartGrad.addColorStop(0.55, CONFIG.themeColor);
    heartGrad.addColorStop(1, '#8a5bff');
    ctx.fillStyle = heartGrad;
    ctx.shadowBlur = 24;
    ctx.shadowColor = CONFIG.themeColor;

    ctx.beginPath();
    ctx.moveTo(0, -r * 0.48);
    ctx.bezierCurveTo(r * 0.58, -r * 1.12, r * 1.08, -r * 0.25, 0, r * 1.02);
    ctx.bezierCurveTo(-r * 1.08, -r * 0.25, -r * 0.58, -r * 1.12, 0, -r * 0.48);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.24, -r * 0.12, r * 0.16, r * 0.3, -0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(58, 7, 34, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-5, -4);
    ctx.quadraticCurveTo(-1, 1, -4, 6);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.beginPath();
    ctx.arc(-r * 0.22, -r * 0.05, 2.2, 0, Math.PI * 2);
    ctx.arc(r * 0.22, -r * 0.05, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.restore();
}
</script>
