<script>
// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.unlocked = false;
        this.sfx = {
            start: document.getElementById('sfx_start'),
            click: document.getElementById('sfx_click'),
            jump: document.getElementById('sfx_jump'),
            land: document.getElementById('sfx_land'),
            fail: document.getElementById('sfx_fail'),
            win: document.getElementById('sfx_win')
        };
        this.bgm = document.getElementById('bgm_loop');
        this.lastPlayedAt = {};
        this.volumes = {
            start: 0.45,
            click: 0.4,
            jump: 0.45,
            land: 0.35,
            fail: 0.42,
            win: 0.5,
            bgm: 0.2
        };

        Object.entries(this.sfx).forEach(([key, audioEl]) => {
            if (!audioEl) return;
            audioEl.volume = this.volumes[key] ?? 0.4;
        });

        if (this.bgm) {
            this.bgm.volume = this.volumes.bgm;
            this.bgm.loop = true;
        }
    }
    
    unlock() {
        this.unlocked = true;
        this.startBgm();
    }

    play(type, minGap = 90) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (this.lastPlayedAt[type] && now - this.lastPlayedAt[type] < minGap) return;

        const audioEl = this.sfx[type];
        if (!audioEl) return;

        this.lastPlayedAt[type] = now;
        try {
            audioEl.currentTime = 0;
            const playPromise = audioEl.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    }

    startBgm() {
        if (!this.unlocked || !this.bgm) return;
        try {
            if (this.bgm.paused) {
                const playPromise = this.bgm.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            }
        } catch (_) {}
    }

    stopBgm() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }
}

// --- Game Engine ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const winScreen = document.getElementById('win-screen');
    const finalScreen = document.getElementById('final-screen');
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls');
    const levelDisplay = document.getElementById('level-display');
    const reactionGif = document.getElementById('reaction-gif');
    const reactionCaption = document.getElementById('reaction-caption');
    
    // Buttons
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    // State
    let gameState = 'START'; // START, PLAYING, WIN_LEVEL, WIN_GAME
    let level = 1;
    const MAX_LEVELS = 30;
    let cameraX = 0;
    
    // Physics Constants
    const GRAVITY = 1500;
    const JUMP_FORCE = -650;
    const MOVE_SPEED = 350;
    const FRICTION = 0.8;
    
    // Entities
    let player = {
        x: 0, y: 0, w: 30, h: 30,
        vx: 0, vy: 0,
        grounded: false
    };
    
    let platforms = []; // {x, y, w, h}
    let goal = { x: 0, y: 0, w: 40, h: 80 };
    let mountains = []; // Background scenery
    let neonOrbs = [];

    // Input State
    let input = { left: false, right: false, jump: false, jumpPressed: false };
    let previousGrounded = false;
    let reactionTimer = null;

    function showReaction(kind) {
        if (!reactionGif || !reactionCaption) return;
        const reactionMap = {
            fail: {
                src: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
                label: 'ROUTE LOST'
            },
            win: {
                src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
                label: 'ZONE SYNCED'
            }
        };
        const choice = reactionMap[kind];
        if (!choice) return;

        reactionGif.src = choice.src;
        reactionGif.alt = choice.label;
        reactionCaption.textContent = choice.label;
        reactionGif.classList.add('visible');
        reactionCaption.classList.add('visible');

        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            reactionGif.classList.remove('visible');
            reactionCaption.classList.remove('visible');
        }, 1800);
    }

    // --- Input Handling ---
    const addTouch = (elem, key) => {
        const start = (e) => { e.preventDefault(); input[key] = true; if(key==='jump') input.jumpPressed = true; elem.classList.add('active'); };
        const end = (e) => { e.preventDefault(); input[key] = false; elem.classList.remove('active'); };
        elem.addEventListener('touchstart', start, {passive:false});
        elem.addEventListener('touchend', end);
        elem.addEventListener('mousedown', start);
        elem.addEventListener('mouseup', end);
        elem.addEventListener('mouseleave', end);
    };
    
    addTouch(btnLeft, 'left');
    addTouch(btnRight, 'right');
    addTouch(btnJump, 'jump');

    // --- Level Generation ---
    function generateLevel(lvl) {
        platforms = [];
        mountains = [];
        neonOrbs = [];
        
        // Difficulty scaling
        const length = 1500 + (lvl * 150); 
        const gapBase = 80 + (lvl * 3);
        const platformMinW = Math.max(60, 150 - lvl * 2);
        
        // Start Platform
        platforms.push({ x: 50, y: window.innerHeight - 150, w: 300, h: 50 });
        
        let currentX = 350;
        let currentY = window.innerHeight - 150;
        
        // Procedural Generation
        while (currentX < length) {
            const gap = gapBase + Math.random() * 40;
            const w = platformMinW + Math.random() * 150;
            const h = 50;
            
            // Height variation
            const yChange = (Math.random() - 0.5) * 150;
            let nextY = currentY + yChange;
            
            // Clamp height
            nextY = Math.max(200, Math.min(window.innerHeight - 100, nextY));
            
            platforms.push({ x: currentX + gap, y: nextY, w: w, h: h });
            
            currentX += gap + w;
            currentY = nextY;
        }
        
        // Goal Platform
        platforms.push({ x: currentX + 100, y: currentY, w: 200, h: 50 });
        goal.x = currentX + 150;
        goal.y = currentY - goal.h;
        
        // Reset Player
        player.x = 100;
        player.y = platforms[0].y - player.h - 10;
        player.vx = 0;
        player.vy = 0;
        cameraX = 0;

        // Generate Background Scenery
        const mountainCount = 10 + Math.floor(length / 200);
        for(let i=0; i<mountainCount; i++) {
            mountains.push({
                x: (Math.random() * length * 1.2) - 200,
                y: window.innerHeight,
                w: 200 + Math.random() * 400,
                h: 200 + Math.random() * 300,
                color: lvl >= 30 ? '#1f0614' : (lvl >= 10 ? '#2a1744' : '#12385c')
            });
        }

        const orbCount = 16 + Math.floor(length / 260);
        for (let i = 0; i < orbCount; i++) {
            neonOrbs.push({
                x: Math.random() * (length + window.innerWidth),
                y: 40 + Math.random() * Math.max(120, window.innerHeight * 0.45),
                r: 6 + Math.random() * 20,
                alpha: 0.08 + Math.random() * 0.18
            });
        }
    }

    // --- Core Logic ---
    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Horizontal Movement
        if (input.left) player.vx -= MOVE_SPEED * 8 * dt;
        if (input.right) player.vx += MOVE_SPEED * 8 * dt;
        
        // Friction & Limits
        player.vx *= FRICTION;
        
        // Jump
        if (input.jumpPressed && player.grounded) {
            player.vy = JUMP_FORCE;
            player.grounded = false;
            audio.play('jump', 120);
            input.jumpPressed = false; // Consume jump
        }
        input.jumpPressed = false; // Reset if not used

        // Gravity
        player.vy += GRAVITY * dt;

        // Apply Velocity
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Collision Detection
        player.grounded = false;
        
        // Floor Collision
        for (let p of platforms) {
            // Check AABB
            if (player.x < p.x + p.w &&
                player.x + player.w > p.x &&
                player.y < p.y + p.h &&
                player.y + player.h > p.y) {
                
                // Determine side
                const overlapX = (player.w + p.w) / 2 - Math.abs((player.x + player.w/2) - (p.x + p.w/2));
                const overlapY = (player.h + p.h) / 2 - Math.abs((player.y + player.h/2) - (p.y + p.h/2));

                if (overlapY < overlapX) {
                    // Vertical collision
                    if (player.vy > 0 && player.y + player.h/2 < p.y + p.h/2) {
                        // Land on top
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                        if (!previousGrounded) {
                            audio.play('land', 120);
                        }
                    } else if (player.vy < 0) {
                        // Hit bottom
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                } else {
                    // Horizontal collision
                    if (player.vx > 0) player.x = p.x - player.w;
                    else player.x = p.x + p.w;
                    player.vx = 0;
                }
            }
        }

        // Death Check (Fall)
        if (player.y > window.innerHeight + 100) {
            audio.play('fail', 200);
            showReaction('fail');
            resetLevel();
        }

        // Goal Check
        if (player.x < goal.x + goal.w &&
            player.x + player.w > goal.x &&
            player.y < goal.y + goal.h &&
            player.y + player.h > goal.y) {
            winLevel();
        }

        // Camera Follow
        const targetCamX = player.x - window.innerWidth / 3;
        cameraX += (targetCamX - cameraX) * 5 * dt;
        cameraX = Math.max(0, cameraX); // Don't look behind start
        previousGrounded = player.grounded;
    }

    function resetLevel() {
        player.x = 100;
        player.y = platforms[0].y - player.h - 10;
        player.vx = 0;
        player.vy = 0;
        cameraX = 0;
    }

    function winLevel() {
        gameState = 'WIN_LEVEL';
        audio.play('win', 300);
        showReaction('win');
        
        if (level >= MAX_LEVELS) {
            gameState = 'WIN_GAME';
            hud.classList.add('hidden');
            controls.classList.add('hidden');
            finalScreen.classList.remove('hidden');
        } else {
            hud.classList.add('hidden');
            controls.classList.add('hidden');
            winScreen.classList.remove('hidden');
        }
    }

    function nextLevel() {
        level++;
        levelDisplay.textContent = level;
        winScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
        generateLevel(level);
        gameState = 'PLAYING';
        audio.play('click', 120);
        audio.startBgm();
    }

    // --- Rendering ---
    function draw() {
        // Clear & Background
        let bgColor, grassColor, skyColor, playerGlow, orbColor, goalColor;
        
        // Biome Logic
        if (level >= 30) {
            skyColor = '#12010b';
            grassColor = '#ff507e';
            bgColor = '#260816';
            playerGlow = '#ff9bd0';
            orbColor = '#ff698f';
            goalColor = '#ff3d3d';
        } else if (level >= 10) {
            skyColor = '#220b48';
            grassColor = '#8d7dff';
            bgColor = '#3f1d77';
            playerGlow = '#7af7ff';
            orbColor = '#ffe369';
            goalColor = '#ffe35c';
        } else {
            skyColor = '#071a33';
            grassColor = '#75ff88';
            bgColor = '#164c78';
            playerGlow = '#74f5ff';
            orbColor = '#74f5ff';
            goalColor = '#ffd96a';
        }

        const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, skyColor);
        skyGradient.addColorStop(1, bgColor);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        neonOrbs.forEach(orb => {
            ctx.fillStyle = `${orbColor}${Math.round(orb.alpha * 255).toString(16).padStart(2, '0')}`;
            ctx.beginPath();
            ctx.arc((orb.x - cameraX * 0.2), orb.y, orb.r, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.save();
        ctx.translate(-cameraX, 0);

        mountains.forEach(m => {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(m.x + m.w/2, m.y - m.h);
            ctx.lineTo(m.x + m.w, m.y);
            ctx.fill();
        });

        platforms.forEach(p => {
            const blockGradient = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
            blockGradient.addColorStop(0, '#394760');
            blockGradient.addColorStop(1, '#182131');
            ctx.fillStyle = blockGradient;
            ctx.fillRect(p.x, p.y, p.w, p.h);

            ctx.fillStyle = grassColor;
            ctx.fillRect(p.x, p.y, p.w, 10);

            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fillRect(p.x + 6, p.y + 14, Math.max(18, p.w * 0.18), 4);
        });

        ctx.fillStyle = '#d4f7ff';
        ctx.fillRect(goal.x, goal.y, 5, goal.h);
        ctx.fillStyle = goalColor;
        ctx.beginPath();
        ctx.moveTo(goal.x + 5, goal.y);
        ctx.lineTo(goal.x + 40, goal.y + 15);
        ctx.lineTo(goal.x + 5, goal.y + 30);
        ctx.fill();

        ctx.fillStyle = playerGlow;
        ctx.fillRect(player.x - 3, player.y - 3, player.w + 6, player.h + 6);

        ctx.fillStyle = '#f8fbff';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        ctx.fillStyle = '#182033';
        ctx.fillRect(player.x + 5, player.y + 5, player.w - 10, 5);

        ctx.fillStyle = '#000';
        if (player.vx >= 0) {
            ctx.fillRect(player.x + 18, player.y + 8, 4, 4);
            ctx.fillRect(player.x + 24, player.y + 8, 4, 4);
        } else {
            ctx.fillRect(player.x + 2, player.y + 8, 4, 4);
            ctx.fillRect(player.x + 8, player.y + 8, 4, 4);
        }

        ctx.fillStyle = level >= 30 ? '#ff7aa6' : '#7cffc7';
        ctx.fillRect(player.x + 8, player.y + player.h - 6, player.w - 16, 4);

        ctx.restore();
    }

    // --- Loop ---
    let lastTime = 0;
    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    // --- Init & Resize ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Event Listeners ---
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
        generateLevel(1);
        gameState = 'PLAYING';
        audio.play('start', 200);
        requestAnimationFrame(loop);
    });

    document.getElementById('next-level-btn').addEventListener('click', () => {
        audio.play('click', 120);
        nextLevel();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.play('click', 120);
        level = 1;
        levelDisplay.textContent = 1;
        finalScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
        generateLevel(1);
        gameState = 'PLAYING';
    });
});
</script>
</body>
