<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcology Sandbox: Breach Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Audiowide + Exo 2) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #07111d;
            --bg-mid: #0e1f32;
            --bg-glow: #173454;
            --panel: rgba(10, 20, 34, 0.82);
            --panel-strong: rgba(14, 31, 50, 0.94);
            --panel-border: rgba(125, 223, 255, 0.28);
            --text: #edf8ff;
            --text-dim: #b8d2e4;
            --cyan: #7ee7ff;
            --cyan-strong: #25c8ff;
            --mint: #7dffb3;
            --amber: #ffd76a;
            --rose: #ff6f91;
            --danger: #ff5a7a;
            --shadow: rgba(0, 0, 0, 0.42);
            --font-display: 'Audiowide', system-ui, sans-serif;
            --font-ui: 'Exo 2', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: var(--font-ui);
            background:
                radial-gradient(circle at top, rgba(51, 157, 255, 0.22), transparent 32%),
                radial-gradient(circle at bottom, rgba(0, 255, 194, 0.12), transparent 26%),
                linear-gradient(180deg, var(--bg-glow), var(--bg-mid) 36%, var(--bg-deep));
            color: var(--text);
            letter-spacing: 0.03em;
        }

        button {
            font-family: var(--font-ui);
            font-size: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .relative {
            position: relative;
        }

        .absolute {
            position: absolute;
        }

        .fixed {
            position: fixed;
        }

        .inset-0 {
            inset: 0;
        }

        .w-full {
            width: 100%;
        }

        .h-full {
            height: 100%;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .justify-between {
            justify-content: space-between;
        }

        .justify-center {
            justify-content: center;
        }

        .items-start {
            align-items: flex-start;
        }

        .items-center {
            align-items: center;
        }

        .text-center {
            text-align: center;
        }

        .pointer-events-none {
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .z-50 {
            z-index: 50;
        }

        .group {
            position: relative;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 18% 24%, rgba(126, 231, 255, 0.08), transparent 14%),
                radial-gradient(circle at 80% 18%, rgba(125, 255, 179, 0.07), transparent 12%),
                radial-gradient(circle at 52% 84%, rgba(255, 111, 145, 0.06), transparent 16%);
        }

        #game-container::after {
            opacity: 0.28;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 36px 36px;
            mix-blend-mode: screen;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(17, 34, 55, 0.9), rgba(8, 18, 30, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 12px 30px var(--shadow),
                inset 0 0 0 1px rgba(255,255,255,0.03),
                0 0 18px rgba(37, 200, 255, 0.08);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .status-icon {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            font-size: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.04);
        }

        .status-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-dim);
            line-height: 1;
            margin-bottom: 2px;
        }

        .status-value {
            display: block;
            font-family: var(--font-display);
            font-size: 16px;
            line-height: 1.1;
        }

        .tool-btn {
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease, filter 0.18s ease;
            position: relative;
            overflow: hidden;
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--text);
            border: 1px solid rgba(185, 236, 255, 0.16);
            background: linear-gradient(180deg, rgba(20, 42, 66, 0.95), rgba(8, 17, 29, 0.92));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        .tool-btn::after {
            content: "";
            position: absolute;
            inset: auto -12px 0;
            height: 18px;
            background: radial-gradient(circle, rgba(126, 231, 255, 0.22), transparent 68%);
            opacity: 0.7;
            pointer-events: none;
        }

        .tool-btn:hover,
        .tool-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.34), 0 0 18px rgba(37, 200, 255, 0.13);
            outline: none;
        }

        .tool-btn.active {
            background: linear-gradient(180deg, rgba(37, 200, 255, 0.3), rgba(19, 67, 110, 0.92));
            color: white;
            transform: translateY(-2px) scale(1.05);
            border-color: rgba(126, 231, 255, 0.7);
            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.38),
                0 0 0 1px rgba(126, 231, 255, 0.25),
                0 0 20px rgba(126, 231, 255, 0.24);
        }

        .tool-btn:disabled {
            opacity: 0.34;
            cursor: not-allowed;
            filter: grayscale(100%);
            transform: none;
            box-shadow: none;
        }

        .tool-emoji {
            font-size: 26px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.18));
        }

        .tool-cost {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .tool-btn.active .tool-cost {
            color: rgba(255,255,255,0.88);
        }

        .tool-btn-danger {
            background: linear-gradient(180deg, rgba(120, 20, 48, 0.92), rgba(55, 6, 18, 0.94));
            border-color: rgba(255, 111, 145, 0.42);
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 18px;
            pointer-events: auto;
            z-index: 50;
            background:
                radial-gradient(circle at top, rgba(37, 200, 255, 0.12), transparent 32%),
                rgba(0, 6, 14, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-shell {
            width: min(100%, 460px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
        }

        .modal-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(126, 231, 255, 0.14), transparent 28%),
                radial-gradient(circle at bottom left, rgba(125, 255, 179, 0.08), transparent 24%);
            pointer-events: none;
        }

        .modal-content {
            position: relative;
            overflow-y: auto;
        }

        .title-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            color: var(--cyan);
            margin-bottom: 12px;
        }

        .title-kicker::before,
        .title-kicker::after {
            content: "";
            width: 16px;
            height: 1px;
            background: currentColor;
            opacity: 0.65;
        }

        .arcology-title {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: clamp(28px, 8vw, 54px);
            line-height: 0.98;
            color: #f5fbff;
            text-shadow: 0 0 18px rgba(126, 231, 255, 0.22);
        }

        .arcology-subtitle {
            margin: 0 0 18px;
            color: var(--text-dim);
            font-size: clamp(14px, 3.8vw, 18px);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .screen-copy {
            margin: 0 0 20px;
            color: rgba(237, 248, 255, 0.78);
            font-size: 14px;
            line-height: 1.35;
        }

        .character-badge {
            margin: 0 auto 20px;
            width: 104px;
            height: 104px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 32% 30%, rgba(255,255,255,0.34), transparent 26%),
                linear-gradient(180deg, rgba(126, 231, 255, 0.26), rgba(37, 200, 255, 0.08)),
                rgba(10, 20, 34, 0.9);
            border: 1px solid rgba(126, 231, 255, 0.3);
            box-shadow:
                0 16px 30px rgba(0, 0, 0, 0.34),
                0 0 24px rgba(126, 231, 255, 0.18);
        }

        .character-badge::before,
        .character-badge::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            border: 1px solid rgba(126, 231, 255, 0.24);
        }

        .character-badge::before {
            inset: 10px;
        }

        .character-badge::after {
            inset: -10px;
            opacity: 0.6;
        }

        .character-emoji {
            font-size: 48px;
            filter: drop-shadow(0 0 12px rgba(126, 231, 255, 0.26));
            animation: pulseBadge 2.4s ease-in-out infinite;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            background: linear-gradient(135deg, rgba(28, 53, 85, 0.98), rgba(11, 23, 37, 0.94));
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.26);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
        }

        .mode-btn:hover,
        .mode-btn:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 16px 26px rgba(0, 0, 0, 0.32), 0 0 16px rgba(126, 231, 255, 0.12);
            border-color: rgba(126, 231, 255, 0.28);
            outline: none;
        }

        .mode-btn-primary {
            background: linear-gradient(135deg, rgba(18, 93, 150, 0.96), rgba(15, 43, 72, 0.94));
        }

        .mode-btn-alt {
            background: linear-gradient(135deg, rgba(102, 41, 136, 0.96), rgba(46, 19, 72, 0.94));
        }

        .mode-title {
            display: block;
            font-family: var(--font-display);
            font-size: 18px;
            margin-bottom: 4px;
        }

        .mode-desc {
            display: block;
            font-size: 13px;
            color: rgba(237, 248, 255, 0.76);
            line-height: 1.25;
        }

        .mode-icon {
            font-size: 28px;
            flex: 0 0 auto;
            margin-left: 12px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.14));
        }

        .hud-wrap {
            display: none;
            width: 100%;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 14px;
            border-radius: 24px;
            max-width: calc(100% - 84px);
        }

        .menu-button {
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            background: linear-gradient(180deg, rgba(17, 34, 55, 0.94), rgba(8, 18, 30, 0.9));
            border-radius: 18px;
            padding: 10px 14px;
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.24);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .menu-button:hover,
        .menu-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 14px 22px rgba(0,0,0,0.28);
            border-color: rgba(126, 231, 255, 0.3);
            outline: none;
        }

        .toolbar-wrap {
            display: none;
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            padding: 8px;
            border-radius: 24px;
            gap: 8px;
            pointer-events: auto;
            max-width: calc(100vw - 20px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .toolbar-wrap::-webkit-scrollbar {
            display: none;
        }

        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 35;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 18vw, 148px);
            height: clamp(88px, 18vw, 148px);
            object-fit: cover;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(9, 15, 24, 0.4);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0.88) translateY(10px);
            transition: opacity 0.24s ease, transform 0.24s ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .feedback-gif--top {
            top: max(76px, env(safe-area-inset-top) + 52px);
            right: 12px;
        }

        .feedback-gif--bottom {
            left: 12px;
            bottom: calc(max(92px, env(safe-area-inset-bottom) + 84px));
        }

        .feedback-caption {
            position: absolute;
            left: 50%;
            bottom: calc(max(18px, env(safe-area-inset-bottom)) + 6px);
            transform: translateX(-50%) translateY(16px);
            min-width: min(84vw, 280px);
            max-width: min(84vw, 320px);
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(7, 17, 29, 0.82);
            border: 1px solid rgba(126, 231, 255, 0.22);
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
            color: var(--text);
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .game-over-title {
            margin: 0 0 10px;
            font-family: var(--font-display);
            font-size: clamp(28px, 8vw, 52px);
            color: #ffd8df;
            text-shadow: 0 0 18px rgba(255, 111, 145, 0.2);
        }

        .score-line {
            margin: 0 0 18px;
            font-size: 18px;
            color: var(--text);
        }

        .score-value {
            color: var(--cyan);
            font-family: var(--font-display);
        }

        .restart-btn {
            border: none;
            border-radius: 999px;
            padding: 14px 26px;
            color: #07111d;
            font-family: var(--font-display);
            font-size: 14px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #dff8ff, #8fdcff);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .restart-btn:hover,
        .restart-btn:focus-visible {
            transform: translateY(-2px);
            filter: brightness(1.05);
            outline: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pulseBadge {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.04); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @media (max-width: 640px) {
            .hud-wrap {
                padding: 10px;
                gap: 10px;
            }

            .hud-panel {
                gap: 10px;
                padding: 10px 12px;
                max-width: calc(100% - 76px);
                border-radius: 20px;
            }

            .status-icon {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }

            .status-label {
                font-size: 9px;
            }

            .status-value {
                font-size: 13px;
            }

            .menu-button {
                padding: 10px 12px;
                font-size: 11px;
            }

            .toolbar-wrap {
                gap: 6px;
                padding: 7px;
                border-radius: 20px;
            }

            .tool-btn {
                width: 58px;
                height: 58px;
                border-radius: 14px;
            }

            .tool-emoji {
                font-size: 23px;
            }

            .tool-cost {
                font-size: 9px;
            }

            .modal-shell {
                padding: 18px;
                border-radius: 22px;
            }

            .screen-copy {
                font-size: 13px;
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: impact + game-over reactions -> catalogs/gifs.json -->
        <div id="feedback-layer" class="feedback-layer" aria-hidden="true">
            <img id="impact-gif" class="feedback-gif feedback-gif--top" alt="impact reaction overlay">
            <img id="danger-gif" class="feedback-gif feedback-gif--bottom" alt="danger reaction overlay">
            <div id="feedback-caption" class="feedback-caption"></div>
        </div>

        <!-- [agent-note][stage2] preserve: hud-layout | reason: top status + bottom tool zone already mobile-safe -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none">
            <div id="hud" class="hud-wrap">
                <div class="glass-panel hud-panel" aria-label="game status">
                    <div class="status-pill">
                        <span class="status-icon" style="color: var(--amber);">⚡</span>
                        <span>
                            <span class="status-label">Charge</span>
                            <span id="mana-display" class="status-value">100</span>
                        </span>
                    </div>
                    <div class="status-pill">
                        <span class="status-icon" style="color: var(--cyan);">👷</span>
                        <span>
                            <span class="status-label">Crew</span>
                            <span id="pop-display" class="status-value">0</span>
                        </span>
                    </div>
                    <div class="status-pill">
                        <span class="status-icon" style="color: var(--rose);">🧟</span>
                        <span>
                            <span class="status-label">Breaches</span>
                            <span id="zombie-display" class="status-value">0</span>
                        </span>
                    </div>
                </div>

                <button id="menu-btn" class="glass-panel menu-button">Menu</button>
            </div>

            <div id="toolbar" class="glass-panel toolbar-wrap" aria-label="deployment tools">
                <button id="tool-human" class="tool-btn" onclick="selectTool('human')">
                    <span class="tool-emoji">👷</span>
                    <span class="tool-cost">10⚡</span>
                </button>
                <button id="tool-house" class="tool-btn" onclick="selectTool('house')">
                    <span class="tool-emoji">🏠</span>
                    <span class="tool-cost">50⚡</span>
                </button>
                <button id="tool-zombie" class="tool-btn" onclick="selectTool('zombie')">
                    <span class="tool-emoji">🧟</span>
                    <span class="tool-cost">Free</span>
                </button>
                <button id="tool-nuke" class="tool-btn tool-btn-danger" onclick="selectTool('nuke')">
                    <span class="tool-emoji">💥</span>
                    <span class="tool-cost">Nuke</span>
                </button>
            </div>

            <div id="start-screen" class="screen-overlay">
                <div class="glass-panel modal-shell text-center">
                    <div class="modal-content">
                        <div class="title-kicker">Breach Protocol</div>
                        <div class="character-badge" aria-hidden="true">
                            <span class="character-emoji">🛡️</span>
                        </div>
                        <h1 class="arcology-title">ARCOLOGY<br>SANDBOX</h1>
                        <p class="arcology-subtitle">Deploy • Sustain • Contain</p>
                        <p class="screen-copy">Command a compact defense crew, grow safe districts, and hold the glowing perimeter against breach swarms.</p>

                        <div class="mode-buttons">
                            <button id="btn-survival" class="mode-btn mode-btn-primary">
                                <span>
                                    <span class="mode-title">Containment Mode</span>
                                    <span class="mode-desc">Manage grid charge, unlock sectors, and survive escalating breach waves.</span>
                                </span>
                                <span class="mode-icon">🛡️</span>
                            </button>

                            <button id="btn-creative" class="mode-btn mode-btn-alt">
                                <span>
                                    <span class="mode-title">Simulation Mode</span>
                                    <span class="mode-desc">Unlimited charge and unrestricted sandbox control for rapid world shaping.</span>
                                </span>
                                <span class="mode-icon">✨</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="hidden screen-overlay">
                <div class="glass-panel modal-shell text-center">
                    <div class="modal-content">
                        <div class="title-kicker" style="color: var(--rose);">Containment Lost</div>
                        <h2 class="game-over-title">ARCOLOGY OVERRUN</h2>
                        <p class="score-line">Peak Crew Count: <span id="finalScore" class="score-value">0</span></p>
                        <button id="restart-btn" class="restart-btn">Reboot Run</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                deploy: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                build: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                menuOpen: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                menuClose: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                nuke: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                wave: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
            },
            gifs: {
                impact: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp",
                danger: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }
            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            pauseBGM() {
                this.bgm.pause();
            }
            playSFX(key, { volume = 0.62, cooldown = 120 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (now - (this.lastPlayed.get(key) || 0) < cooldown) return;
                this.lastPlayed.set(key, now);
                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const impactGif = document.getElementById('impact-gif');
        const dangerGif = document.getElementById('danger-gif');
        const feedbackCaption = document.getElementById('feedback-caption');
        impactGif.src = ASSETS.gifs.impact;
        dangerGif.src = ASSETS.gifs.danger;
        let width, height;

        let gameActive = false;
        let mode = 'survival';
        let entities = [];
        let particles = [];
        let mana = 100;
        let maxPopulationRecord = 0;
        let time = 0;
        let selectedTool = 'human';
        let spawnTimer = 0;
        let feedbackTimer = null;

        const CONFIG = {
            human: { speed: 1.5, color: '#66d7ff', radius: 6, cost: 10, health: 10 },
            zombie: { speed: 1.8, color: '#ff5a7a', radius: 6, cost: 0, health: 15 },
            house: { color: '#7dffb3', size: 24, cost: 50, health: 50 },
            waveInterval: 600
        };

        /** 4. ENTITY CLASSES */
        class Entity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.health = CONFIG[type].health;
                this.maxHealth = CONFIG[type].health;
                this.age = 0;
                this.dead = false;

                if (type === 'human') this.buildTimer = 0;
                if (type === 'house') this.spawnTimer = 0;
            }

            update() {
                this.age++;

                if (this.type === 'human') this.updateHuman();
                else if (this.type === 'zombie') this.updateZombie();
                else if (this.type === 'house') this.updateHouse();

                if (this.type !== 'house') {
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.x = Math.max(0, Math.min(width, this.x));
                    this.y = Math.max(0, Math.min(height, this.y));
                }
            }

            updateHuman() {
                if (Math.random() < 0.05) {
                    this.vx += (Math.random() - 0.5) * 0.5;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > CONFIG.human.speed) {
                    this.vx = (this.vx / speed) * CONFIG.human.speed;
                    this.vy = (this.vy / speed) * CONFIG.human.speed;
                }

                let nearestZombie = null;
                let minDist = 150;
                for (let e of entities) {
                    if (e.type === 'zombie') {
                        let d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            nearestZombie = e;
                        }
                    }
                }
                if (nearestZombie) {
                    this.vx = (this.x - nearestZombie.x) / minDist * CONFIG.human.speed * 1.5;
                    this.vy = (this.y - nearestZombie.y) / minDist * CONFIG.human.speed * 1.5;
                }

                if (this.age % 120 === 0 && mode === 'survival') {
                    addMana(1);
                    createParticle(this.x, this.y - 10, '#ffd76a', 'float');
                }

                if (mode === 'survival' && mana >= CONFIG.house.cost && Math.random() < 0.001) {
                    let clear = true;
                    for (let e of entities) {
                        if (e.type === 'house' && Math.hypot(e.x - this.x, e.y - this.y) < 50) clear = false;
                    }
                    if (clear) {
                        if (entities.filter(e => e.type === 'human').length > 5) {
                            addMana(-CONFIG.house.cost);
                            entities.push(new Entity(this.x, this.y, 'house'));
                            createParticle(this.x, this.y, '#7dffb3', 'burst');
                            audio.playSFX('build', { volume: 0.5, cooldown: 220 });
                            showFeedback('impact', 'District online', 1100);
                        }
                    }
                }
            }

            updateZombie() {
                let target = null;
                let minDist = 300;
                for (let e of entities) {
                    if (e.type === 'human' || e.type === 'house') {
                        let d = Math.hypot(e.x - this.x, e.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            target = e;
                        }
                    }
                }

                if (target) {
                    let dx = target.x - this.x;
                    let dy = target.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    this.vx = (dx / dist) * CONFIG.zombie.speed;
                    this.vy = (dy / dist) * CONFIG.zombie.speed;

                    if (dist < (CONFIG[target.type].radius || CONFIG.house.size / 2) + CONFIG.zombie.radius) {
                        if (this.age % 10 === 0) {
                            target.health -= 5;
                            audio.playSFX('hit', { volume: 0.48, cooldown: 90 });
                            createParticle(target.x, target.y, '#ff5a7a', 'spark');
                            if (target.health <= 0) {
                                target.dead = true;
                                showFeedback('danger', target.type === 'human' ? 'Crew breached' : 'District lost', 1200);
                                if (target.type === 'human') {
                                    entities.push(new Entity(target.x, target.y, 'zombie'));
                                }
                            }
                        }
                    }
                } else {
                    if (Math.random() < 0.05) {
                        this.vx += (Math.random() - 0.5);
                        this.vy += (Math.random() - 0.5);
                    }
                }
            }

            updateHouse() {
                this.spawnTimer++;
                if (this.spawnTimer > 300) {
                    this.spawnTimer = 0;
                    if (entities.length < 300) {
                        let h = new Entity(this.x + (Math.random() - 0.5) * 30, this.y + (Math.random() - 0.5) * 30, 'human');
                        entities.push(h);
                        createParticle(this.x, this.y, '#66d7ff', 'float');
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'human') {
                    const pulse = 1 + Math.sin(this.age * 0.12) * 0.08;
                    ctx.scale(pulse, pulse);

                    ctx.shadowColor = 'rgba(102, 215, 255, 0.35)';
                    ctx.shadowBlur = 14;

                    ctx.fillStyle = '#c9f6ff';
                    ctx.beginPath();
                    ctx.arc(0, -6, 4.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = CONFIG.human.color;
                    ctx.beginPath();
                    ctx.roundRect(-5.5, -2, 11, 14, 5);
                    ctx.fill();

                    ctx.fillStyle = '#9ef0ff';
                    ctx.fillRect(-6.5, 2, 2.2, 7);
                    ctx.fillRect(4.3, 2, 2.2, 7);
                    ctx.fillRect(-3.8, 11, 2.1, 6);
                    ctx.fillRect(1.7, 11, 2.1, 6);

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#08111c';
                    ctx.beginPath();
                    ctx.arc(-1.4, -6.6, 0.7, 0, Math.PI * 2);
                    ctx.arc(1.4, -6.6, 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(237,248,255,0.75)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-1.8, -3.6);
                    ctx.quadraticCurveTo(0, -2.3, 1.8, -3.6);
                    ctx.stroke();
                } else if (this.type === 'zombie') {
                    ctx.rotate(Math.sin(this.age * 0.08) * 0.06);

                    ctx.fillStyle = '#1c2d22';
                    ctx.beginPath();
                    ctx.arc(0, -6, 4.4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = CONFIG.zombie.color;
                    ctx.beginPath();
                    ctx.roundRect(-5.8, -2, 11.6, 14, 5);
                    ctx.fill();

                    ctx.fillStyle = '#445b4a';
                    ctx.fillRect(-7.1, 3, 2.2, 7);
                    ctx.fillRect(4.9, 3, 2.2, 7);
                    ctx.fillRect(-4.2, 11, 2.2, 6);
                    ctx.fillRect(2, 11, 2.2, 6);

                    ctx.shadowColor = 'rgba(255, 90, 122, 0.72)';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#fff0f4';
                    ctx.beginPath();
                    ctx.arc(-1.7, -6.8, 1.2, 0, Math.PI * 2);
                    ctx.arc(1.7, -6.8, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.strokeStyle = '#2d1018';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.moveTo(-2.2, -3.2);
                    ctx.lineTo(2.2, -4.6);
                    ctx.stroke();
                } else if (this.type === 'house') {
                    ctx.shadowColor = 'rgba(125, 255, 179, 0.2)';
                    ctx.shadowBlur = 14;

                    ctx.fillStyle = 'rgba(11, 28, 25, 0.96)';
                    ctx.beginPath();
                    ctx.roundRect(-CONFIG.house.size / 2, -CONFIG.house.size / 2 + 2, CONFIG.house.size, CONFIG.house.size - 2, 5);
                    ctx.fill();

                    ctx.fillStyle = CONFIG.house.color;
                    ctx.beginPath();
                    ctx.roundRect(-10, -6, 20, 18, 4);
                    ctx.fill();

                    ctx.fillStyle = '#0f2d27';
                    ctx.fillRect(-3, 2, 6, 10);
                    ctx.fillStyle = '#dcfff0';
                    ctx.fillRect(-7, -2, 5, 5);
                    ctx.fillRect(2, -2, 5, 5);

                    ctx.fillStyle = '#53c784';
                    ctx.beginPath();
                    ctx.moveTo(-14, -5);
                    ctx.lineTo(0, -17);
                    ctx.lineTo(14, -5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    if (this.health < CONFIG.house.health) {
                        ctx.fillStyle = 'rgba(46, 8, 17, 0.9)';
                        ctx.fillRect(-15, -25, 30, 4);
                        ctx.fillStyle = '#7dffb3';
                        ctx.fillRect(-15, -25, 30 * (this.health / CONFIG.house.health), 4);
                    }
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                if (type === 'float') this.vy = -1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /** 5. GAME ENGINE */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function addMana(amount) {
            if (mode === 'creative') return;
            mana += amount;
            updateUI();
        }

        function createParticle(x, y, color, type) {
            particles.push(new Particle(x, y, color, type));
        }

        function showFeedback(kind, label, duration = 1200) {
            const target = kind === 'danger' ? dangerGif : impactGif;
            const other = kind === 'danger' ? impactGif : dangerGif;
            other.classList.remove('visible');
            target.classList.add('visible');
            feedbackCaption.textContent = label;
            feedbackCaption.classList.add('visible');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                impactGif.classList.remove('visible');
                dangerGif.classList.remove('visible');
                feedbackCaption.classList.remove('visible');
            }, duration);
        }

        function spawnWave() {
            if (mode !== 'survival') return;
            let count = 1 + Math.floor(time / 1000);
            for (let i = 0; i < count; i++) {
                let side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = Math.random() * width; y = -20; }
                else if (side === 1) { x = width + 20; y = Math.random() * height; }
                else if (side === 2) { x = Math.random() * width; y = height + 20; }
                else { x = -20; y = Math.random() * height; }

                entities.push(new Entity(x, y, 'zombie'));
            }
            audio.playSFX('wave', { volume: 0.4, cooldown: 700 });
            showFeedback('danger', 'Breach wave detected', 1400);
        }

        function checkUnlocks(pop) {
            if (mode !== 'survival') return;

            const btnHouse = document.getElementById('tool-house');
            const btnZombie = document.getElementById('tool-zombie');

            if (pop >= 5) {
                btnHouse.disabled = false;
                btnHouse.querySelector('.tool-cost').innerText = "50⚡";
            } else {
                btnHouse.disabled = true;
                btnHouse.querySelector('.tool-cost').innerText = "Gate(5C)";
            }

            if (pop >= 50) {
                btnZombie.disabled = false;
                btnZombie.querySelector('.tool-cost').innerText = "100⚡";
            } else {
                btnZombie.disabled = true;
                btnZombie.querySelector('.tool-cost').innerText = "Gate(50C)";
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.fillStyle = '#07111d';
            ctx.fillRect(0, 0, width, height);

            const gridSize = 50;
            const offsetX = (Math.sin(time * 0.001) * 20);
            const offsetY = (Math.cos(time * 0.001) * 20);

            ctx.strokeStyle = 'rgba(126, 231, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x + offsetX, 0);
                ctx.lineTo(x + offsetX, height);
                ctx.stroke();
            }
            for (let y = 0; y <= height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y + offsetY);
                ctx.lineTo(width, y + offsetY);
                ctx.stroke();
            }

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.45, 0, width * 0.5, height * 0.45, Math.max(width, height) * 0.45);
            glow.addColorStop(0, 'rgba(37, 200, 255, 0.1)');
            glow.addColorStop(1, 'rgba(37, 200, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            time++;
            if (mode === 'survival') {
                spawnTimer++;
                if (spawnTimer > CONFIG.waveInterval) {
                    spawnWave();
                    spawnTimer = 0;
                }
            }

            entities = entities.filter(e => !e.dead);
            entities.forEach(e => {
                e.update();
                e.draw();
            });

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            const humans = entities.filter(e => e.type === 'human');
            const pop = humans.length;
            if (pop > maxPopulationRecord) maxPopulationRecord = pop;

            if (mode === 'survival' && pop === 0 && mana < 10 && entities.filter(e => e.type === 'house').length === 0 && time > 200) {
                gameOver();
            }

            document.getElementById('pop-display').innerText = pop;
            document.getElementById('zombie-display').innerText = entities.filter(e => e.type === 'zombie').length;
            checkUnlocks(pop);

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('mana-display').innerText = Math.floor(mana);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.72, cooldown: 400 });
            showFeedback('danger', 'Containment lost', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('toolbar').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = maxPopulationRecord;
        }

        /** 6. INPUT & CONTROLS */
        window.selectTool = (tool) => {
            selectedTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        };

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (selectedTool === 'nuke') {
                entities = entities.filter(ent => {
                    const dist = Math.hypot(ent.x - x, ent.y - y);
                    if (dist < 100) {
                        createParticle(ent.x, ent.y, '#ffffff', 'burst');
                        return false;
                    }
                    return true;
                });
                for (let i = 0; i < 20; i++) createParticle(x, y, 'orange', 'burst');
                audio.playSFX('nuke', { volume: 0.64, cooldown: 300 });
                showFeedback('impact', 'Purge pulse', 1000);
                return;
            }

            const cost = CONFIG[selectedTool].cost;

            if (mode === 'survival') {
                const pop = entities.filter(e => e.type === 'human').length;
                if (selectedTool === 'house' && pop < 5) return;
                if (selectedTool === 'zombie' && pop < 50) return;

                if (mana >= cost) {
                    addMana(-cost);
                    entities.push(new Entity(x, y, selectedTool));
                    audio.playSFX(selectedTool === 'house' ? 'build' : 'deploy', { volume: 0.54, cooldown: 120 });
                    if (selectedTool === 'human') {
                        audio.playSFX('pickup', { volume: 0.35, cooldown: 200 });
                    }
                    createParticle(x, y, '#ffffff', 'burst');
                } else {
                    document.getElementById('mana-display').closest('.hud-panel').classList.add('shake');
                    audio.playSFX('blocked', { volume: 0.5, cooldown: 180 });
                    showFeedback('danger', 'Insufficient charge', 950);
                    setTimeout(() => document.getElementById('mana-display').closest('.hud-panel').classList.remove('shake'), 500);
                }
            } else {
                entities.push(new Entity(x, y, selectedTool));
                audio.playSFX(selectedTool === 'house' ? 'build' : 'deploy', { volume: 0.54, cooldown: 120 });
                createParticle(x, y, '#ffffff', 'burst');
            }
        });

        function startGame(selectedMode) {
            audio.unlock();
            mode = selectedMode;
            gameActive = true;
            entities = [];
            particles = [];
            time = 0;
            mana = (mode === 'survival') ? 100 : 99999;
            maxPopulationRecord = 0;
            spawnTimer = 0;

            if (mode === 'survival') {
                entities.push(new Entity(width / 2 - 20, height / 2, 'human'));
                entities.push(new Entity(width / 2 + 20, height / 2, 'human'));
                document.getElementById('tool-house').disabled = true;
                document.getElementById('tool-zombie').disabled = true;
                document.getElementById('tool-human').disabled = false;
                document.getElementById('tool-nuke').classList.add('hidden');
                document.querySelector('#tool-zombie .tool-cost').innerText = "Gate(50C)";
                document.querySelector('#tool-house .tool-cost').innerText = "Gate(5C)";
                document.querySelector('#tool-human .tool-cost').innerText = "10⚡";
            } else {
                document.querySelectorAll('.tool-btn').forEach(b => b.disabled = false);
                document.getElementById('tool-nuke').classList.remove('hidden');
                document.querySelector('#tool-zombie .tool-cost').innerText = "Free";
                document.querySelector('#tool-house .tool-cost').innerText = "Free";
                document.querySelector('#tool-human .tool-cost').innerText = "Free";
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('toolbar').classList.remove('hidden');

            updateUI();
            selectTool('human');
            showFeedback('impact', mode === 'survival' ? 'Protocol engaged' : 'Sandbox engaged', 1000);
            audio.playSFX('menuClose', { volume: 0.45, cooldown: 200 });
            audio.playBGM();
            gameLoop();
        }

        document.getElementById('btn-survival').addEventListener('click', () => startGame('survival'));
        document.getElementById('btn-creative').addEventListener('click', () => startGame('creative'));

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.playSFX('menuOpen', { volume: 0.45, cooldown: 200 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            gameActive = false;
            audio.pauseBGM();
            audio.playSFX('menuOpen', { volume: 0.45, cooldown: 200 });
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('toolbar').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });
    });
    </script>
</body>
</html>
