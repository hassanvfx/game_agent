<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archive Rush 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070811;
            --bg-mid: #11182f;
            --panel-bg: rgba(8, 16, 35, 0.78);
            --panel-border: rgba(102, 224, 255, 0.65);
            --panel-glow: rgba(62, 182, 255, 0.26);
            --text-main: #ecf6ff;
            --text-soft: #a9d8ff;
            --alert: #ffd54d;
            --danger: #ff5d73;
        }

        /* Mobile Reset & Base */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top, rgba(52, 99, 181, 0.32), transparent 45%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 70%);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #game-container,
        #game-container canvas {
            touch-action: none;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .interactive { pointer-events: auto; }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, rgba(5, 10, 22, 0.78), transparent);
        }

        .stats-box {
            background: linear-gradient(180deg, rgba(16, 31, 62, 0.95), rgba(8, 16, 35, 0.82));
            border: 2px solid var(--panel-border);
            padding: 7px 12px;
            border-radius: 12px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 1px 0 rgba(0,0,0,0.6);
            font-family: 'Press Start 2P', monospace;
            line-height: 1.35;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px var(--panel-glow);
            backdrop-filter: blur(8px);
        }

        .hp-bar-bg {
            width: 88px;
            height: 10px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 999px;
            overflow: hidden;
        }

        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--danger), #ff9d4d);
            transition: width 0.2s;
            box-shadow: 0 0 10px rgba(255, 93, 115, 0.5);
        }

        /* Character Switcher */
        .char-switch { display: flex; gap: 6px; }

        .char-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.78);
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.12s, border-color 0.12s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
        }

        .char-btn::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .char-btn.active {
            transform: scale(1.12);
            border-color: #fff7a8;
            z-index: 10;
            box-shadow: 0 0 18px rgba(255, 242, 148, 0.55);
        }

        .char-btn:active { transform: scale(0.94); }

        /* Controls */
        .controls-bottom {
            width: 100%;
            height: 240px;
            position: relative;
            background: linear-gradient(to top, rgba(5, 10, 22, 0.82), transparent);
        }

        /* D-Pad */
        .dpad {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 140px;
            height: 140px;
        }

        .dpad-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: linear-gradient(180deg, rgba(59, 118, 207, 0.42), rgba(20, 44, 95, 0.8));
            border: 2px solid rgba(151, 227, 255, 0.45);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.28);
        }

        .dpad-btn:active { background: rgba(169, 237, 255, 0.85); color: #04101e; }
        #btn-up { top: 0; left: 47.5px; }
        #btn-down { bottom: 0; left: 47.5px; }
        #btn-left { top: 47.5px; left: 0; }
        #btn-right { top: 47.5px; right: 0; }

        /* Action Buttons */
        .actions {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .action-row { display: flex; gap: 12px; align-items: flex-end; }

        .btn-round {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(19, 35, 72, 0.92), rgba(10, 18, 38, 0.92));
            border: 2px solid rgba(255,255,255,0.8);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 18px rgba(0,0,0,0.36);
            backdrop-filter: blur(6px);
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-round:active { transform: scale(0.9); background: #fff; color: #000; }

        #shoot {
            background: radial-gradient(circle at 30% 30%, rgba(255, 174, 120, 0.9), rgba(188, 42, 67, 0.92));
            width: 65px;
            height: 65px;
            font-size: 30px;
            box-shadow: 0 0 18px rgba(255, 93, 115, 0.42);
        }

        #enterCar { background: linear-gradient(180deg, rgba(80, 166, 255, 0.95), rgba(31, 77, 182, 0.92)); }
        #camera { width: 45px; height: 45px; font-size: 20px; }

        /* Screens */
        #intro-screen, #wasted-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
            overflow: hidden;
        }

        #intro-screen::before, #wasted-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 25%, rgba(124, 230, 255, 0.16), transparent 22%),
                radial-gradient(circle at 78% 30%, rgba(255, 212, 77, 0.12), transparent 18%),
                linear-gradient(180deg, rgba(5, 10, 22, 0.8), rgba(2, 4, 12, 0.94));
            pointer-events: none;
        }

        #intro-screen::after {
            content: '📼';
            position: absolute;
            bottom: 8vh;
            right: 8vw;
            font-size: clamp(4rem, 12vw, 6.5rem);
            filter: drop-shadow(0 0 18px rgba(139, 231, 255, 0.35));
            opacity: 0.9;
        }

        #wasted-screen::after {
            content: '🗃️';
            position: absolute;
            bottom: 8vh;
            left: 8vw;
            font-size: clamp(4rem, 12vw, 6rem);
            filter: drop-shadow(0 0 18px rgba(255, 101, 122, 0.25));
            opacity: 0.8;
        }

        #intro-screen > *, #wasted-screen > * {
            position: relative;
            z-index: 1;
        }

        .hidden { display: none !important; }
        .fade-out { opacity: 0; pointer-events: none; }

        /* Intro Text */
        .intro-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.6rem, 9vw, 4rem);
            color: #8be7ff;
            text-transform: uppercase;
            letter-spacing: 4px;
            transform: perspective(500px) rotateX(16deg);
            text-shadow: 0 0 12px rgba(139, 231, 255, 0.9), 0 10px 24px rgba(0,0,0,0.55);
            animation: float 3s ease-in-out infinite;
            text-align: center;
            line-height: 0.95;
        }

        @keyframes float {
            0%, 100% { transform: perspective(500px) rotateX(16deg) translateY(0); }
            50% { transform: perspective(500px) rotateX(16deg) translateY(-20px); }
        }

        /* Wasted Text */
        .wasted-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 11vw, 5rem);
            color: #ff657a;
            text-shadow: 0 0 16px rgba(255, 101, 122, 0.65), 0 6px 16px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-main {
            padding: 15px 40px;
            background: linear-gradient(180deg, #fff4a5, #ffc84f);
            color: #04101e;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            border: 4px solid #0b1630;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.32);
        }

        .btn-main:active { background: #ccc; }

        .screen-copy {
            margin: 1rem 1.25rem 0;
            max-width: 28rem;
            color: #d8edff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
        }

        .screen-hint {
            margin-top: 2rem;
            color: #fff0a1;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            text-align: center;
            animation: pulse 1.6s ease-in-out infinite;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: min(28vw, 140px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(139, 231, 255, 0.55);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
            background: rgba(7, 8, 17, 0.5);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-gif.show {
            opacity: 0.95;
            transform: scale(1);
        }

        #intro-gif {
            top: max(72px, env(safe-area-inset-top) + 72px);
            right: 14px;
        }

        #danger-gif {
            top: max(132px, env(safe-area-inset-top) + 132px);
            left: 14px;
            border-color: rgba(255, 101, 122, 0.6);
        }

        .absolute-fill {
            position: absolute;
            inset: 0;
        }

        .row-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-label-muted {
            color: #9ddfff;
            letter-spacing: 0.08em;
        }

        .btn-disabled { opacity: 0.5; }

        @keyframes pulse {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./assets/unpkg.com/three_0.152.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="game-container" class="absolute-fill"></div>

    <!-- [agent-note][stage4] resolved-font: title/hud/body -> catalogs/fonts.json (Orbitron + Press Start 2P + Rajdhani) -->
    <!-- [agent-note][stage3] resolved-gif: intro-alert and archive-lost overlays -> catalogs/gifs.json -->
    <div id="feedback-layer" aria-hidden="true">
        <img id="intro-gif" class="feedback-gif hidden" alt="" />
        <img id="danger-gif" class="feedback-gif hidden" alt="" />
    </div>

    <div id="ui-layer">
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div class="hud-top interactive">
            <div class="stats-box">
                <div class="row-center">
                    <span class="hud-label-muted">ARCHIVE CORE</span>
                    <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill"></div></div>
                </div>
                <div id="wanted-text" style="color: #ffff00;">ALERT ★☆☆☆☆</div>
            </div>

            <div class="char-switch">
                <button id="char1" class="char-btn active" style="background:linear-gradient(180deg,#ffe4a3,#ffb347); color:#000;">🛰️</button>
                <button id="char2" class="char-btn" style="background:linear-gradient(180deg,#b3f0ff,#48b9ff); color:#000;">📘</button>
                <button id="char3" class="char-btn" style="background:linear-gradient(180deg,#ebc2ff,#b867ff); color:#000;">🧿</button>
            </div>
        </div>

        <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
        <div class="controls-bottom interactive">
            <div class="dpad">
                <div id="btn-up" class="dpad-btn">▲</div>
                <div id="btn-left" class="dpad-btn">◀</div>
                <div id="btn-right" class="dpad-btn">▶</div>
                <div id="btn-down" class="dpad-btn">▼</div>
            </div>

            <div class="actions">
                <div class="action-row">
                    <button id="camera" class="btn-round">📷</button>
                </div>
                <div class="action-row">
                    <button id="enterCar" class="btn-round">🚗</button>
                    <button id="shoot" class="btn-round">🔫</button>
                </div>
            </div>
        </div>
    </div>

    <div id="intro-screen" class="interactive">
        <div class="intro-text">ARCHIVE<br>RUSH 3D</div>
        <p class="screen-copy">Move between stacks, borrow carts, and use the scanner to keep hostile claimants away from the records.</p>
        <p class="screen-hint">TAP TO START</p>
    </div>

    <div id="wasted-screen" class="interactive hidden">
        <div class="wasted-text">ARCHIVE LOST</div>
        <p class="screen-copy">Your retrieval crew got overwhelmed. Restart the shift and secure the files again.</p>
        <button id="restart-btn" class="btn-main">RESTART SHIFT</button>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const config = {
            colors: {
                sky: 0x0d1b39,
                ground: 0x131d34,
                street: 0x25304f,
                building: 0x354472,
                laneGlow: 0x5ecbff,
                archiveTrim: 0x8be7ff,
                neutralHead: 0xffe0bd,
                char1: 0xffcc66,
                char2: 0x66ccff,
                char3: 0xcc66ff,
                civil: 0x79f2b4,
                gang: 0xff6b7c,
                cop: 0x76a9ff,
                bullet: 0xffe96a,
                carWindow: 0x0f1830
            },
            chars: [
                { color: 0xffcc66, hp: 100, name: "Orange" },
                { color: 0x66ccff, hp: 100, name: "Blue" },
                { color: 0xcc66ff, hp: 100, name: "Purple" }
            ]
        };

        const keys = { w: false, a: false, s: false, d: false };
        let player = {
            mesh: null,
            health: 100,
            maxHealth: 100,
            wanted: 0,
            charIndex: 0,
            armed: false
        };
        let inCar = false;
        let currentCar = null;
        let camAngleY = 0;
        let camMode = 0;
        let isGameOver = false;
        let gameActive = false;

        const bullets = [];
        const entities = {
            cars: [],
            civils: [],
            gangs: [],
            cops: [],
            buildings: []
        };

        const audioEls = {
            bgm: new Audio('https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'),
            start: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'),
            shoot: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3'),
            hit: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3'),
            damage: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3'),
            blocked: new Audio('https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3'),
            enterCar: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3'),
            restart: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3'),
            car: new Audio('https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'),
            gameOver: new Audio('https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3')
        };
        const audioReady = { unlocked: false, lastPlayed: {} };
        Object.entries(audioEls).forEach(([key, audio]) => {
            audio.preload = 'auto';
            audio.crossOrigin = 'anonymous';
            if (key === 'bgm') {
                audio.loop = true;
                audio.volume = 0.2;
            } else if (key === 'car') {
                audio.volume = 0.12;
            } else if (key === 'damage' || key === 'gameOver') {
                audio.volume = 0.45;
            } else if (key === 'shoot') {
                audio.volume = 0.34;
            } else {
                audio.volume = 0.38;
            }
        });

        const gifEls = {
            intro: document.getElementById('intro-gif'),
            danger: document.getElementById('danger-gif')
        };
        gifEls.intro.src = 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp';
        gifEls.danger.src = 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';

        function primeAudio() {
            if (audioReady.unlocked) return;
            audioReady.unlocked = true;
            Object.values(audioEls).forEach(audio => {
                audio.load();
                const playPromise = audio.play();
                if (playPromise && typeof playPromise.then === 'function') {
                    playPromise.then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(() => {});
                }
            });
        }

        function playSound(type, { reset = true, debounce = 0 } = {}) {
            const audio = audioEls[type];
            if (!audio) return;
            const now = performance.now();
            if (debounce && audioReady.lastPlayed[type] && now - audioReady.lastPlayed[type] < debounce) return;
            audioReady.lastPlayed[type] = now;
            try {
                if (reset) audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
            } catch (_) {}
        }

        function startBgm() {
            if (!gameActive || isGameOver) return;
            playSound('bgm', { reset: false, debounce: 250 });
        }

        let gifTimers = [];
        function showGif(type, ms = 1200) {
            const el = gifEls[type];
            if (!el) return;
            el.classList.remove('hidden');
            requestAnimationFrame(() => el.classList.add('show'));
            const timer = window.setTimeout(() => {
                el.classList.remove('show');
                window.setTimeout(() => el.classList.add('hidden'), 220);
            }, ms);
            gifTimers.push(timer);
        }

        function clearGifTimers() {
            gifTimers.forEach(timer => window.clearTimeout(timer));
            gifTimers = [];
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(config.colors.sky);
        scene.fog = new THREE.Fog(config.colors.sky, 20, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 50, 20);
        light.castShadow = true;
        light.shadow.camera.left = -50;
        light.shadow.camera.right = 50;
        light.shadow.camera.top = 50;
        light.shadow.camera.bottom = -50;
        light.shadow.mapSize.width = 1024;
        light.shadow.mapSize.height = 1024;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 0.6));

        function createCity() {
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({
                    color: config.colors.ground,
                    roughness: 0.88,
                    metalness: 0.08
                })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const streetMat = new THREE.MeshStandardMaterial({
                color: config.colors.street,
                emissive: config.colors.laneGlow,
                emissiveIntensity: 0.08,
                roughness: 0.72,
                metalness: 0.18
            });

            for (let i = -50; i <= 50; i += 10) {
                const s1 = new THREE.Mesh(new THREE.PlaneGeometry(200, 4), streetMat);
                s1.rotation.x = -Math.PI / 2;
                s1.position.set(0, 0.02, i);
                s1.receiveShadow = true;
                scene.add(s1);

                const s2 = new THREE.Mesh(new THREE.PlaneGeometry(4, 200), streetMat);
                s2.rotation.x = -Math.PI / 2;
                s2.position.set(i, 0.03, 0);
                s2.receiveShadow = true;
                scene.add(s2);

                for (let j = -50; j <= 50; j += 10) {
                    if (Math.random() < 0.6 && (Math.abs(i) > 2 || Math.abs(j) > 2)) {
                        const h = Math.random() * 6 + 3;
                        const geo = new THREE.BoxGeometry(4, h, 4);
                        const mat = new THREE.MeshStandardMaterial({
                            color: config.colors.building,
                            emissive: config.colors.archiveTrim,
                            emissiveIntensity: 0.08,
                            roughness: 0.7,
                            metalness: 0.2
                        });
                        const b = new THREE.Mesh(geo, mat);
                        b.position.set(i + 5, h / 2, j + 5);
                        b.castShadow = true;
                        b.receiveShadow = true;
                        scene.add(b);
                        entities.buildings.push(b);
                    }
                }
            }
        }

        function createPlayer() {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.42, 0.48, 1.2, 10);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: config.chars[0].color,
                emissive: config.chars[0].color,
                emissiveIntensity: 0.18,
                roughness: 0.45,
                metalness: 0.16
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.66;
            body.castShadow = true;
            group.add(body);
            group.userData.body = body;

            const chest = new THREE.Mesh(
                new THREE.BoxGeometry(0.46, 0.34, 0.2),
                new THREE.MeshStandardMaterial({ color: 0xf7fbff, emissive: 0x7fdcff, emissiveIntensity: 0.1 })
            );
            chest.position.set(0, 0.8, 0.36);
            body.add(chest);

            const headGeo = new THREE.SphereGeometry(0.35, 10, 10);
            const headMat = new THREE.MeshStandardMaterial({ color: config.colors.neutralHead });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.46;
            group.add(head);

            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(0.34, 0.14, 0.28),
                new THREE.MeshStandardMaterial({
                    color: 0x7ee3ff,
                    emissive: 0x7ee3ff,
                    emissiveIntensity: 0.45,
                    transparent: true,
                    opacity: 0.9
                })
            );
            visor.position.set(0, 1.45, 0.18);
            group.add(visor);

            const badge = new THREE.Mesh(
                new THREE.RingGeometry(0.12, 0.2, 18),
                new THREE.MeshBasicMaterial({ color: 0xffe96a, side: THREE.DoubleSide })
            );
            badge.position.set(0, 1.03, 0.44);
            badge.rotation.x = Math.PI / 2;
            group.add(badge);

            scene.add(group);
            player.mesh = group;
        }

        function spawnCar(x, z, color) {
            const group = new THREE.Group();
            const chassis = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.8, 3.5),
                new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.08,
                    roughness: 0.55,
                    metalness: 0.25
                })
            );
            chassis.position.y = 0.6;
            chassis.castShadow = true;
            group.add(chassis);

            const top = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.6, 2),
                new THREE.MeshStandardMaterial({
                    color: config.colors.carWindow,
                    emissive: config.colors.archiveTrim,
                    emissiveIntensity: 0.08
                })
            );
            top.position.y = 1.2;
            group.add(top);

            group.position.set(x, 0, z);
            group.userData = { speed: 0, steering: 0 };
            scene.add(group);
            entities.cars.push(group);
        }

        function spawnNPC(type, x, z) {
            const group = new THREE.Group();
            let color = config.colors.civil;
            let accent = 0xcaffea;

            if (type === 'gang') {
                color = config.colors.gang;
                accent = 0x2d0010;
            }

            if (type === 'cop') {
                color = config.colors.cop;
                accent = 0xe5f1ff;
            }

            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.38, 0.44, 1.2, 10),
                new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.14,
                    roughness: 0.55,
                    metalness: 0.12
                })
            );
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshStandardMaterial({ color: config.colors.neutralHead })
            );
            head.position.y = 1.4;
            group.add(head);

            const emblem = new THREE.Mesh(
                new THREE.BoxGeometry(0.18, 0.18, 0.1),
                new THREE.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.2 })
            );
            emblem.position.set(0, 0.8, 0.36);
            group.add(emblem);

            group.position.set(x, 0, z);
            scene.add(group);

            const npc = { mesh: group, type: type, dir: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize() };
            if (type === 'civil') entities.civils.push(npc);
            if (type === 'gang') entities.gangs.push(npc);
            if (type === 'cop') entities.cops.push(npc);
        }

        function checkCollision(x, z, radius = 0.5) {
            for (let b of entities.buildings) {
                const bx = b.position.x;
                const bz = b.position.z;
                const w = 2 + radius;
                if (Math.abs(x - bx) < w && Math.abs(z - bz) < w) return true;
            }
            return false;
        }

        function movePlayerLogic() {
            if (inCar) return;

            const speed = 0.15;
            let mx = 0, mz = 0;
            if (keys.w) mz -= 1;
            if (keys.s) mz += 1;
            if (keys.a) mx -= 1;
            if (keys.d) mx += 1;

            if (mx !== 0 || mz !== 0) {
                const len = Math.sqrt(mx * mx + mz * mz);
                mx /= len;
                mz /= len;

                const nx = player.mesh.position.x + mx * speed;
                const nz = player.mesh.position.z + mz * speed;

                if (!checkCollision(nx, nz)) {
                    player.mesh.position.x = nx;
                    player.mesh.position.z = nz;
                    player.mesh.lookAt(nx + mx, player.mesh.position.y, nz + mz);
                    camAngleY = Math.atan2(mx, mz);
                }
            }
        }

        function moveCarLogic() {
            if (!inCar || !currentCar) return;

            const car = currentCar;
            const accel = 0.03;
            const friction = 0.97;
            const turnSpeed = 0.04;

            if (keys.w) car.userData.speed += accel;
            if (keys.s) car.userData.speed -= accel;
            car.userData.speed *= friction;

            if (Math.abs(car.userData.speed) > 0.01) {
                const dir = Math.sign(car.userData.speed);
                if (keys.a) car.rotation.y += turnSpeed * dir;
                if (keys.d) car.rotation.y -= turnSpeed * dir;
                playSound('car', { debounce: 900 });
            }

            const nx = car.position.x + Math.sin(car.rotation.y) * car.userData.speed;
            const nz = car.position.z + Math.cos(car.rotation.y) * car.userData.speed;

            if (!checkCollision(nx, nz, 1.5)) {
                car.position.x = nx;
                car.position.z = nz;
            } else {
                car.userData.speed *= -0.5;
            }

            player.mesh.position.copy(car.position);
            player.mesh.rotation.copy(car.rotation);
        }

        function updateNPCs() {
            const pPos = player.mesh.position;

            entities.civils.forEach(npc => {
                if (npc.mesh.visible === false) return;
                const dist = pPos.distanceTo(npc.mesh.position);

                if (player.armed && dist < 10) {
                    const dx = npc.mesh.position.x - pPos.x;
                    const dz = npc.mesh.position.z - pPos.z;
                    npc.dir.set(dx, 0, dz).normalize();
                    npc.mesh.position.add(npc.dir.clone().multiplyScalar(0.1));
                } else {
                    if (Math.random() < 0.02) npc.dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() - 0.5);
                    const next = npc.mesh.position.clone().add(npc.dir.clone().multiplyScalar(0.04));
                    if (!checkCollision(next.x, next.z)) {
                        npc.mesh.position.copy(next);
                        npc.mesh.lookAt(next);
                    } else {
                        npc.dir.negate();
                    }
                }
            });

            entities.gangs.forEach(npc => {
                if (!npc.mesh.visible) return;
                const dist = pPos.distanceTo(npc.mesh.position);
                if (dist < 12) {
                    const dx = pPos.x - npc.mesh.position.x;
                    const dz = pPos.z - npc.mesh.position.z;
                    npc.mesh.position.x += (dx / dist) * 0.06;
                    npc.mesh.position.z += (dz / dist) * 0.06;
                    npc.mesh.lookAt(pPos);

                    if (dist < 1.5) {
                        damagePlayer(0.5);
                    }
                }
            });

            entities.cops.forEach(npc => {
                if (!npc.mesh.visible) return;
                if (player.wanted > 0) {
                    const dist = pPos.distanceTo(npc.mesh.position);
                    if (dist < 20) {
                        const dx = pPos.x - npc.mesh.position.x;
                        const dz = pPos.z - npc.mesh.position.z;
                        npc.mesh.position.x += (dx / dist) * 0.07;
                        npc.mesh.position.z += (dz / dist) * 0.07;
                        npc.mesh.lookAt(pPos);

                        if (dist < 1.5) {
                            damagePlayer(1);
                        }
                    }
                } else {
                    if (Math.random() < 0.02) npc.dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() - 0.5);
                    const next = npc.mesh.position.clone().add(npc.dir.clone().multiplyScalar(0.05));
                    if (!checkCollision(next.x, next.z)) {
                        npc.mesh.position.copy(next);
                        npc.mesh.lookAt(next);
                    } else {
                        npc.dir.negate();
                    }
                }
            });
        }

        function damagePlayer(amount) {
            player.health -= amount;
            playSound('damage', { debounce: 180 });
            if (player.health <= 35) showGif('danger', 1000);
            updateHUD();
            if (player.health <= 0 && !isGameOver) gameOver();
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.velocity);

                if (b.position.distanceTo(player.mesh.position) > 60) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                    continue;
                }

                let hit = false;
                const allNPCs = [...entities.civils, ...entities.gangs, ...entities.cops];
                for (let npc of allNPCs) {
                    if (npc.mesh.visible && b.position.distanceTo(npc.mesh.position) < 1.0) {
                        hit = true;
                        npc.mesh.visible = false;
                        npc.mesh.position.y = -50;
                        playSound('hit', { debounce: 80 });
                        player.wanted += (npc.type === 'cop' ? 2 : 1);
                        updateHUD();
                    }
                }

                if (hit) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function updateCamera() {
            const target = inCar ? currentCar.position : player.mesh.position;

            if (camMode === 0) {
                const offset = new THREE.Vector3(0, 8, 10);
                if (inCar) {
                    offset.set(Math.sin(currentCar.rotation.y) * 10, 8, Math.cos(currentCar.rotation.y) * 10);
                } else {
                    offset.set(0, 10, 10);
                }
                camera.position.lerp(target.clone().add(offset), 0.1);
                camera.lookAt(target);
            } else {
                camera.position.lerp(new THREE.Vector3(target.x, 30, target.z), 0.1);
                camera.lookAt(target);
                camera.rotation.z = 0;
            }
        }

        function shoot() {
            if (inCar) return;
            player.armed = true;
            playSound('shoot');
            const geo = new THREE.SphereGeometry(0.2);
            const mat = new THREE.MeshBasicMaterial({ color: config.colors.bullet });
            const b = new THREE.Mesh(geo, mat);
            b.position.copy(player.mesh.position);
            b.position.y = 1.2;

            const vel = new THREE.Vector3(0, 0, 1).applyEuler(player.mesh.rotation).multiplyScalar(0.8);
            b.velocity = vel;
            scene.add(b);
            bullets.push(b);

            player.wanted += 0.1;
            updateHUD();
        }

        function enterExitCar() {
            if (inCar) {
                inCar = false;
                player.mesh.visible = true;
                player.mesh.position.set(currentCar.position.x + 2, 0.6, currentCar.position.z);
                currentCar = null;
                document.getElementById('enterCar').innerText = '🚗';
                document.getElementById('shoot').classList.remove('btn-disabled');
                playSound('enterCar', { debounce: 80 });
            } else {
                let nearest = null;
                let minDst = 4;
                for (let c of entities.cars) {
                    const d = player.mesh.position.distanceTo(c.position);
                    if (d < minDst) {
                        minDst = d;
                        nearest = c;
                    }
                }
                if (nearest) {
                    inCar = true;
                    currentCar = nearest;
                    player.mesh.visible = false;
                    document.getElementById('enterCar').innerText = '🏃';
                    document.getElementById('shoot').classList.add('btn-disabled');
                    playSound('enterCar', { debounce: 80 });
                } else {
                    playSound('blocked', { debounce: 180 });
                }
            }
        }

        function switchChar(idx) {
            if (isGameOver) return;
            playSound('restart', { debounce: 120 });
            player.charIndex = idx;
            const data = config.chars[idx];
            player.mesh.userData.body.material.color.setHex(data.color);
            player.mesh.userData.body.material.emissive.setHex(data.color);

            player.health = Math.min(100, player.health + 20);
            updateHUD();

            [1, 2, 3].forEach(n => {
                const btn = document.getElementById('char' + n);
                if (n === idx + 1) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function updateHUD() {
            const pct = Math.max(0, player.health);
            document.getElementById('hp-bar').style.width = pct + '%';

            let stars = "☆☆☆☆☆";
            const w = Math.floor(player.wanted);
            if (w >= 1) stars = "★☆☆☆☆";
            if (w >= 5) stars = "★★☆☆☆";
            if (w >= 10) stars = "★★★☆☆";
            if (w >= 20) stars = "★★★★☆";
            if (w >= 50) stars = "★★★★★";
            document.getElementById('wanted-text').innerText = `ALERT ${stars}`;
        }

        function gameOver() {
            isGameOver = true;
            audioEls.bgm.pause();
            playSound('gameOver');
            showGif('danger', 1600);
            document.getElementById('wasted-screen').classList.remove('hidden');
        }

        function restartGame() {
            isGameOver = false;
            player.health = 100;
            player.wanted = 0;
            player.mesh.position.set(0, 0.6, 0);
            inCar = false;
            currentCar = null;
            player.mesh.visible = true;
            clearGifTimers();

            [...entities.civils, ...entities.gangs, ...entities.cops].forEach(npc => {
                npc.mesh.visible = true;
                npc.mesh.position.y = 0;
            });

            document.getElementById('wasted-screen').classList.add('hidden');
            playSound('restart');
            startBgm();
            updateHUD();
        }

        const dpadMap = { 'btn-up': 'w', 'btn-down': 's', 'btn-left': 'a', 'btn-right': 'd' };
        Object.entries(dpadMap).forEach(([id, k]) => {
            const el = document.getElementById(id);
            const set = (v) => {
                keys[k] = v;
                el.style.background = v ? 'rgba(169,237,255,0.85)' : '';
                el.style.color = v ? '#04101e' : '';
            };
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); set(true); });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); set(false); });
            el.addEventListener('pointerleave', (e) => { e.preventDefault(); set(false); });
        });

        document.getElementById('shoot').addEventListener('pointerdown', (e) => { e.preventDefault(); shoot(); });
        document.getElementById('enterCar').addEventListener('click', enterExitCar);
        document.getElementById('camera').addEventListener('click', () => {
            camMode = 1 - camMode;
            playSound('restart', { debounce: 120 });
        });

        document.getElementById('char1').addEventListener('click', () => switchChar(0));
        document.getElementById('char2').addEventListener('click', () => switchChar(1));
        document.getElementById('char3').addEventListener('click', () => switchChar(2));

        function startGameFromIntro() {
            if (gameActive) return;
            document.getElementById('intro-screen').classList.add('fade-out');
            primeAudio();
            gameActive = true;
            playSound('start');
            startBgm();
            showGif('intro', 1400);
        }

        const introScreen = document.getElementById('intro-screen');
        introScreen.addEventListener('click', startGameFromIntro);
        introScreen.addEventListener('pointerup', startGameFromIntro);

        const restartBtn = document.getElementById('restart-btn');
        restartBtn.addEventListener('click', restartGame);
        restartBtn.addEventListener('pointerup', restartGame);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audioEls.bgm.pause();
            } else if (gameActive && !isGameOver) {
                startBgm();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!gameActive) return;
            if (isGameOver) return;

            movePlayerLogic();
            moveCarLogic();
            updateNPCs();
            updateBullets();
            updateCamera();

            renderer.render(scene, camera);
        }

        createCity();
        createPlayer();

        spawnCar(10, 10, 0xff0000);
        spawnCar(-20, 20, 0x0000ff);
        spawnCar(30, -30, 0xffff00);
        spawnCar(-10, -40, 0xffffff);

        for (let i = 0; i < 10; i++) spawnNPC('civil', (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);
        for (let i = 0; i < 5; i++) spawnNPC('gang', (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);
        for (let i = 0; i < 3; i++) spawnNPC('cop', (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
