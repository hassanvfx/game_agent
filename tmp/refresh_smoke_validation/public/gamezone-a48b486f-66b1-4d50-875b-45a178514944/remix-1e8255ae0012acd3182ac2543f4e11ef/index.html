<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Turbo Timeline: Viral Cut Rush</title>
    <!-- [agent-note][stage3] resolved-font: display=Orbitron | ui=Exo 2 via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600;700&display=swap">
    <style>
        :root {
            --color-bg: #090916;
            --color-bg-2: #120f2c;
            --color-panel: rgba(15, 18, 42, 0.78);
            --color-panel-strong: rgba(18, 24, 54, 0.94);
            --color-border: rgba(132, 240, 255, 0.26);
            --color-muted: #a6accf;
            --color-light: #d8ddff;
            --color-white: #ffffff;
            --color-red: #ff5b4d;
            --color-pink: #ff2a8a;
            --color-cyan: #63f3ff;
            --color-gold: #ffd166;
            --font-display: 'Orbitron', 'Arial Black', sans-serif;
            --font-ui: 'Exo 2', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(99, 243, 255, 0.08), transparent 30%),
                radial-gradient(circle at bottom, rgba(255, 42, 138, 0.08), transparent 30%),
                linear-gradient(180deg, var(--color-bg), var(--color-bg-2));
            color: var(--color-white);
            font-family: var(--font-ui);
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 30%),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.015) 0,
                    rgba(255, 255, 255, 0.015) 1px,
                    transparent 1px,
                    transparent 4px
                );
            opacity: 0.7;
        }

        canvas { display: block; touch-action: none; }

        button {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            border: 0;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .hidden { display: none; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .z-30 { z-index: 30; }
        .p-4 { padding: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-7xl { font-size: 4.5rem; }
        .font-bold { font-weight: 700; }
        .tracking-widest { letter-spacing: 0.1em; }
        .tracking-wider { letter-spacing: 0.08em; }
        .leading-none { line-height: 1; }
        .uppercase { text-transform: uppercase; }
        .transition-colors { transition: background-color 150ms ease, color 150ms ease; }
        .bg-black\/90 { background: rgba(0, 0, 0, 0.9); }
        .text-white { color: var(--color-white); }
        .text-black { color: #000000; }
        .text-gray-300 { color: var(--color-light); }
        .text-gray-400 { color: var(--color-muted); }
        .text-gray-500 { color: #6b7280; }
        .text-\[\#ff0055\] { color: var(--color-pink); }
        .text-\[\#ff3b30\] { color: var(--color-red); }
        .text-\[\#00f0ff\] { color: #00f0ff; }
        .bg-\[\#ff3b30\] { background-color: var(--color-red); }
        .hover\:bg-white:hover { background-color: var(--color-white); }
        .md\:text-9xl { font-size: 6rem; }

        @media (min-width: 768px) {
            .md\:text-9xl { font-size: 8rem; }
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(24, 32, 71, 0.85), rgba(10, 12, 28, 0.9));
            backdrop-filter: blur(14px);
            border: 1px solid var(--color-border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 40px rgba(0, 0, 0, 0.42);
        }

        .neon-text {
            text-shadow:
                0 0 8px rgba(99, 243, 255, 0.6),
                0 0 22px rgba(99, 243, 255, 0.2);
        }

        .glitch-text { animation: glitch 1s linear infinite; }

        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }

        @keyframes pulse {
            50% { opacity: 0.58; }
        }

        @keyframes floatGlow {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-8px); opacity: 1; }
        }

        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        #ui-layer,
        #hud,
        #start-screen,
        #game-over-screen,
        #restart-btn {
            font-family: var(--font-display);
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(99, 243, 255, 0.1), transparent 24%),
                radial-gradient(circle at 85% 20%, rgba(255, 42, 138, 0.1), transparent 24%);
            z-index: 0;
        }

        #hud {
            gap: 0.75rem;
        }

        #hud > div {
            min-width: 0;
            padding: 0.5rem 0.7rem;
            border-radius: 0.95rem;
            background: linear-gradient(180deg, rgba(18, 24, 54, 0.88), rgba(11, 14, 31, 0.82));
            border: 1px solid rgba(99, 243, 255, 0.18);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
        }

        #hud .text-gray-400 {
            color: var(--color-muted);
            font-family: var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.16em;
            font-size: 0.75rem;
        }

        #scoreDisplay,
        #speedDisplay,
        #finalScore {
            text-shadow: 0 0 12px rgba(99, 243, 255, 0.25);
        }

        #start-screen,
        #game-over-screen {
            padding: 1.5rem;
        }

        #start-screen::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: 1rem;
            border-radius: 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .intro-avatar {
            position: relative;
            width: 5.5rem;
            height: 5.5rem;
            margin-bottom: 1.25rem;
            border-radius: 1.5rem;
            background: linear-gradient(180deg, rgba(99, 243, 255, 0.2), rgba(255, 42, 138, 0.16));
            border: 1px solid rgba(99, 243, 255, 0.3);
            box-shadow: 0 0 32px rgba(99, 243, 255, 0.2);
            animation: floatGlow 2.6s ease-in-out infinite;
        }

        .intro-avatar::before,
        .intro-avatar::after {
            content: "";
            position: absolute;
            border-radius: 999px;
        }

        .intro-avatar::before {
            width: 2.2rem;
            height: 2.2rem;
            left: 50%;
            top: 0.95rem;
            transform: translateX(-50%);
            background: linear-gradient(180deg, var(--color-cyan), #ffffff);
            box-shadow: 0 0 16px rgba(99, 243, 255, 0.45);
        }

        .intro-avatar::after {
            width: 3.2rem;
            height: 1.6rem;
            left: 50%;
            bottom: 1.05rem;
            transform: translateX(-50%);
            background: linear-gradient(180deg, var(--color-red), #ff8b5a);
            border-radius: 1rem 1rem 1.25rem 1.25rem;
        }

        .subtitle,
        .instruction {
            font-family: var(--font-ui);
            font-weight: 600;
        }

        #restart-btn {
            border-radius: 999px;
            box-shadow: 0 10px 18px rgba(255, 91, 77, 0.32);
        }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            width: min(28vw, 8rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(4, 6, 16, 0.68);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #success-gif {
            bottom: 5rem;
        }

        #fail-gif {
            top: 5.5rem;
        }

        @media (max-width: 640px) {
            .text-7xl { font-size: 2.9rem; }
            .text-6xl { font-size: 2.8rem; }
            .text-5xl { font-size: 2.35rem; }
            .text-4xl { font-size: 2rem; }
            .text-2xl { font-size: 1.2rem; }
            .text-xl { font-size: 1rem; }
            .p-4 { padding: 0.75rem; }

            #hud > div {
                padding: 0.42rem 0.58rem;
                border-radius: 0.8rem;
            }

            #start-screen,
            #game-over-screen {
                justify-content: center;
                text-align: center;
            }

            .feedback-gif {
                width: min(34vw, 6.5rem);
                right: 0.55rem;
            }

            #success-gif {
                bottom: 4.1rem;
            }

            #fail-gif {
                top: 4.7rem;
            }
        }

        #ui-layer { letter-spacing: 1px; }
    </style>
</head>

<script>
/**
 * §4 Iron Laws & Logic
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    const defaultConfig = {
        baseSpeed: 500,
        acceleration: 0.05,
        laneCount: 4,
        themeColor: "#00f0ff"
    };

    // Expose config to window for editor
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    
    // Initialize config values
    Object.keys(window.gameConfigDefs).forEach(k => {
        window.gameConfig[k] = window.gameConfigDefs[k].value;
    });

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            // Hot reload logic
            if (key === 'laneCount') initGame();
        }
    };

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
        bgm: document.getElementById('bgm_main'),
        score: document.getElementById('sfx_score'),
        crash: document.getElementById('sfx_crash'),
        start: document.getElementById('sfx_start'),
        lane: document.getElementById('sfx_lane'),
        warning: document.getElementById('sfx_warning')
    };

    const feedbackGifs = {
        success: document.getElementById('success-gif'),
        fail: document.getElementById('fail-gif')
    };

    let isMuted = false;
    let audioUnlocked = false;
    let lastLaneSoundAt = 0;
    let warningPlayedForRun = false;
    let gifTimers = { success: 0, fail: 0 };

    const unlockAudio = () => {
        if (audioUnlocked) return;
        audioUnlocked = true;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        Object.values(sounds).forEach((el) => {
            if (!el || el.dataset.primed === 'true') return;
            el.volume = el.id === 'bgm_main' ? 0.2 : 0.001;
            el.play().then(() => {
                el.pause();
                el.currentTime = 0;
                el.dataset.primed = 'true';
            }).catch(() => {});
        });
    };

    const showFeedbackGif = (type, duration = 900) => {
        const el = feedbackGifs[type];
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(gifTimers[type]);
        gifTimers[type] = setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
    };

    const playSound = (id) => {
        if (isMuted) return;
        const el = sounds[id];
        if (el) {
            if (id === 'bgm') {
                el.volume = 0.2;
                el.play().catch(() => {});
            } else {
                const clone = el.cloneNode();
                clone.volume = id === 'warning' ? 0.34 : (id === 'lane' ? 0.22 : 0.5);
                clone.play().catch(() => playOscillator(id));
            }
        } else {
            playOscillator(id);
        }
    };

    const stopBgm = () => {
        if (!sounds.bgm) return;
        sounds.bgm.pause();
        sounds.bgm.currentTime = 0;
    };

    const playOscillator = (type) => {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'score' || type === 'start') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(type === 'start' ? 620 : 880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'start' ? 1040 : 1760, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'lane') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(380, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(520, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.setValueAtTime(220, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.16);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    };

    const setBgmSpeed = (rate) => {
        if (sounds.bgm) {
            // Clamp rate for audio engine stability (0.5 to 4.0 is safe range usually)
            const safeRate = Math.max(0.5, Math.min(rate, 3.0));
            sounds.bgm.playbackRate = safeRate;
        }
    };

    // --- Game State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const restartBtn = document.getElementById('restart-btn');
    const uiFont = "'Exo 2', sans-serif";
    const displayFont = "'Orbitron', sans-serif";
    
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let gameSpeedMultiplier = 1.0;
    let distance = 0;
    
    // Entities
    let player = { y: 0, targetY: 0, lane: 1, height: 0 };
    let clips = [];
    let particles = [];
    let lanes = [];
    
    // Input
    let inputY = 0;
    let isDragging = false;

    // --- Resize & Init ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Update lane dimensions
        const laneH = window.innerHeight / window.gameConfig.laneCount;
        lanes = [];
        for(let i=0; i<window.gameConfig.laneCount; i++) {
            lanes.push({ y: i * laneH, h: laneH });
        }
        player.height = laneH * 0.8;
        // Reset player pos if needed
        if (gameState === 'START') {
            player.targetY = lanes[1].y + lanes[1].h/2;
            player.y = player.targetY;
        }
    };
    
    window.addEventListener('resize', resize);

    const initGame = () => {
        resize();
        clips = [];
        particles = [];
        score = 0;
        gameSpeedMultiplier = 1.0;
        distance = 0;
        warningPlayedForRun = false;
        ['success', 'fail'].forEach((key) => feedbackGifs[key]?.classList.remove('visible'));
        player.lane = Math.floor(window.gameConfig.laneCount / 2);
        player.targetY = lanes[player.lane].y + lanes[player.lane].h/2;
        player.y = player.targetY;
        
        if (sounds.bgm) {
            sounds.bgm.currentTime = 0;
            sounds.bgm.playbackRate = 1.0;
        }
    };

    // --- Input Handling ---
    const handleInput = (y) => {
        if (gameState !== 'PLAYING') return;
        const laneH = window.innerHeight / window.gameConfig.laneCount;
        let lane = Math.floor(y / laneH);
        lane = Math.max(0, Math.min(lane, window.gameConfig.laneCount - 1));
        if (lane !== player.lane) {
            const now = performance.now();
            if (now - lastLaneSoundAt > 90) {
                playSound('lane');
                lastLaneSoundAt = now;
            }
        }
        player.lane = lane;
        player.targetY = lanes[lane].y + lanes[lane].h/2;
    };

    const startRun = () => {
        if (gameState !== 'START') return;
        unlockAudio();
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        playSound('start');
        playSound('bgm');
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    };

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState === 'START') {
            startRun();
        } else if (gameState === 'PLAYING') {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientY - rect.top);
        }
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
        e.preventDefault();
        if (isDragging && gameState === 'PLAYING') {
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientY - rect.top);
        }
    }, { passive: false });

    const endDrag = (e) => {
        e.preventDefault();
        isDragging = false;
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // [agent-note][stage4] repaired: mobile-start-action | element: #start-screen | action: bind native tap/click on overlay so intro card does not block start path
    startScreen.addEventListener('click', startRun);
    startScreen.addEventListener('pointerup', (e) => {
        if (e.pointerType !== 'mouse') {
            e.preventDefault();
            startRun();
        }
    }, { passive: false });
    startScreen.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            startRun();
        }
    });

    restartBtn.addEventListener('click', () => {
        unlockAudio();
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameState = 'PLAYING';
        initGame();
        playSound('start');
        playSound('bgm');
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    });

    // --- Game Loop ---
    const spawnClip = () => {
        const laneIdx = Math.floor(Math.random() * window.gameConfig.laneCount);
        const type = Math.random() > 0.3 ? 'BAD' : 'GOOD';
        const w = 100 + Math.random() * 100;
        clips.push({
            x: window.innerWidth + 50,
            y: lanes[laneIdx].y + 10,
            w: w,
            h: lanes[laneIdx].h - 20,
            type: type,
            lane: laneIdx,
            processed: false
        });
    };

    const createParticles = (x, y, color) => {
        for(let i=0; i<10; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    };

    const drawRoundedRect = (x, y, w, h, radius) => {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
    };

    const drawBackground = () => {
        const bgGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        bgGradient.addColorStop(0, '#090916');
        bgGradient.addColorStop(0.45, '#12122d');
        bgGradient.addColorStop(1, '#06060f');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const scanOffset = -(distance * 0.35 % 80);
        for (let i = 0; i < 3; i++) {
            const glowY = window.innerHeight * (0.22 + i * 0.28);
            const glow = ctx.createLinearGradient(0, glowY - 30, 0, glowY + 30);
            glow.addColorStop(0, 'rgba(0,0,0,0)');
            glow.addColorStop(0.5, i === 1 ? 'rgba(99,243,255,0.08)' : 'rgba(255,42,138,0.07)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, glowY - 30, window.innerWidth, 60);
        }

        for (let x = scanOffset; x < window.innerWidth + 120; x += 80) {
            ctx.fillStyle = 'rgba(255,255,255,0.025)';
            ctx.fillRect(x, 0, 1, window.innerHeight);
        }
    };

    const drawClip = (c) => {
        if (c.processed) ctx.globalAlpha = 0.3;

        const isGood = c.type === 'GOOD';
        const mainColor = isGood ? window.gameConfig.themeColor : '#ff2a8a';
        const accentColor = isGood ? '#dffcff' : '#ffd0e2';
        const radius = Math.min(18, c.h * 0.24);
        const iconSize = Math.min(28, c.h * 0.35);

        ctx.shadowBlur = 18;
        ctx.shadowColor = mainColor;
        const blockGradient = ctx.createLinearGradient(c.x, c.y, c.x + c.w, c.y + c.h);
        blockGradient.addColorStop(0, isGood ? 'rgba(99,243,255,0.95)' : 'rgba(255,42,138,0.95)');
        blockGradient.addColorStop(1, isGood ? 'rgba(32,117,255,0.88)' : 'rgba(120,16,92,0.92)');
        ctx.fillStyle = blockGradient;
        drawRoundedRect(c.x, c.y, c.w, c.h, radius);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        drawRoundedRect(c.x, c.y, c.w, c.h, radius);
        ctx.stroke();

        const badgeX = c.x + 12;
        const badgeY = c.y + c.h / 2;
        ctx.fillStyle = 'rgba(6, 8, 18, 0.78)';
        ctx.beginPath();
        ctx.arc(badgeX + iconSize * 0.5, badgeY, iconSize * 0.72, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (isGood) {
            ctx.moveTo(badgeX + 5, badgeY);
            ctx.lineTo(badgeX + 10, badgeY + 6);
            ctx.lineTo(badgeX + 18, badgeY - 6);
        } else {
            ctx.moveTo(badgeX + 6, badgeY - 7);
            ctx.lineTo(badgeX + 17, badgeY + 7);
            ctx.moveTo(badgeX + 17, badgeY - 7);
            ctx.lineTo(badgeX + 6, badgeY + 7);
        }
        ctx.stroke();

        ctx.fillStyle = '#05070f';
        ctx.font = `600 ${Math.max(12, Math.min(18, c.h * 0.24))}px ${uiFont}`;
        ctx.textBaseline = 'middle';
        ctx.fillText(isGood ? 'CLEAN CUT' : 'TREND JAM', c.x + 48, c.y + c.h / 2);

        ctx.globalAlpha = 1.0;
    };

    const drawPlayer = (px) => {
        const bob = Math.sin(performance.now() / 120) * 3;
        const py = player.y + bob;
        const bodyW = 34;
        const bodyH = Math.max(26, player.height * 0.44);

        ctx.save();
        ctx.translate(px, py);

        ctx.shadowBlur = 24;
        ctx.shadowColor = 'rgba(99,243,255,0.7)';
        ctx.fillStyle = 'rgba(99,243,255,0.18)';
        ctx.beginPath();
        ctx.ellipse(0, 0, bodyW * 1.2, bodyH * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        const trailGradient = ctx.createLinearGradient(-40, 0, 16, 0);
        trailGradient.addColorStop(0, 'rgba(255,42,138,0)');
        trailGradient.addColorStop(1, 'rgba(255,42,138,0.55)');
        ctx.fillStyle = trailGradient;
        ctx.beginPath();
        ctx.moveTo(-48, -8);
        ctx.lineTo(-12, -4);
        ctx.lineTo(-12, 4);
        ctx.lineTo(-48, 8);
        ctx.closePath();
        ctx.fill();

        const bodyGradient = ctx.createLinearGradient(0, -bodyH, 0, bodyH);
        bodyGradient.addColorStop(0, '#f7feff');
        bodyGradient.addColorStop(0.4, '#63f3ff');
        bodyGradient.addColorStop(1, '#ff5b4d');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.moveTo(-10, -bodyH * 0.52);
        ctx.quadraticCurveTo(8, -bodyH * 0.9, 17, -6);
        ctx.quadraticCurveTo(20, 0, 17, 6);
        ctx.quadraticCurveTo(8, bodyH * 0.9, -10, bodyH * 0.52);
        ctx.quadraticCurveTo(-2, 0, -10, -bodyH * 0.52);
        ctx.fill();

        ctx.fillStyle = '#08111f';
        ctx.beginPath();
        ctx.arc(1, -4, 3, 0, Math.PI * 2);
        ctx.arc(1, 4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#08111f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(8, -7);
        ctx.lineTo(13, 0);
        ctx.lineTo(8, 7);
        ctx.stroke();

        ctx.restore();

        ctx.strokeStyle = 'rgba(255,209,102,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + 32, py - 12);
        ctx.lineTo(px + 32, py + 12);
        ctx.stroke();
    };

    const gameLoop = (timestamp) => {
        if (gameState !== 'PLAYING') return;
        
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        try {
            // Update Speed
            gameSpeedMultiplier += window.gameConfig.acceleration * dt;
            if (gameSpeedMultiplier > 100) gameSpeedMultiplier = 100;
            
            // Sync Audio
            setBgmSpeed(1.0 + (gameSpeedMultiplier - 1) * 0.05);
            if (!warningPlayedForRun && gameSpeedMultiplier >= 2.5) {
                warningPlayedForRun = true;
                playSound('warning');
            }

            const currentSpeed = window.gameConfig.baseSpeed * Math.sqrt(gameSpeedMultiplier);
            
            // Update Score
            distance += currentSpeed * dt;
            score = Math.floor(distance / 100);
            
            // Update UI
            document.getElementById('speedDisplay').innerText = gameSpeedMultiplier.toFixed(1) + 'x';
            const frames = score % 60;
            const seconds = Math.floor(score / 60) % 60;
            const minutes = Math.floor(score / 3600);
            document.getElementById('scoreDisplay').innerText = 
                `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}:${frames.toString().padStart(2,'0')}`;

            // Player Movement (Lerp)
            player.y += (player.targetY - player.y) * 15 * dt;

            // Spawn Logic
            if (Math.random() < 0.02 * Math.sqrt(gameSpeedMultiplier)) {
                spawnClip();
            }

            // Update Clips
            for (let i = clips.length - 1; i >= 0; i--) {
                let c = clips[i];
                c.x -= currentSpeed * dt;

                // Collision
                const playerX = window.innerWidth * 0.2;
                const playerW = 10;
                
                if (!c.processed && 
                    playerX < c.x + c.w && 
                    playerX + playerW > c.x &&
                    Math.abs(player.y - (c.y + c.h/2 + 10)) < c.h/2) {
                    
                    c.processed = true;
                    if (c.type === 'GOOD') {
                        playSound('score');
                        showFeedbackGif('success', 820);
                        createParticles(playerX, player.y, window.gameConfig.themeColor);
                        score += 100;
                    } else {
                        playSound('crash');
                        showFeedbackGif('fail', 1500);
                        createParticles(playerX, player.y, '#ff0055');
                        gameState = 'GAMEOVER';
                        stopBgm();
                        document.getElementById('finalScore').innerText = document.getElementById('scoreDisplay').innerText;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                        document.getElementById('hud').classList.add('hidden');
                        
                        canvas.style.transform = `translate(${Math.random()*10}px, ${Math.random()*10}px)`;
                        setTimeout(() => canvas.style.transform = 'none', 200);
                    }
                }

                if (c.x + c.w < -100) {
                    clips.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 2 * dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw
            drawBackground();

            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 1;
            lanes.forEach((l, index) => {
                ctx.beginPath();
                ctx.moveTo(0, l.y);
                ctx.lineTo(window.innerWidth, l.y);
                ctx.stroke();

                const laneGlow = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
                laneGlow.addColorStop(0, 'rgba(0,0,0,0)');
                laneGlow.addColorStop(0.5, index % 2 === 0 ? 'rgba(99,243,255,0.04)' : 'rgba(255,42,138,0.04)');
                laneGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = laneGlow;
                ctx.fillRect(0, l.y, window.innerWidth, l.h);

                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                const markerSpacing = 180;
                const offset = -(distance % markerSpacing);
                for(let x = offset; x < window.innerWidth; x += markerSpacing) {
                    ctx.fillRect(x, l.y + 10, 3, l.h - 20);
                }
            });

            clips.forEach(drawClip);

            const px = window.innerWidth * 0.2;

            ctx.strokeStyle = 'rgba(255,209,102,0.55)';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 10]);
            ctx.beginPath();
            ctx.moveTo(px, 0);
            ctx.lineTo(px, window.innerHeight);
            ctx.stroke();
            ctx.setLineDash([]);

            drawPlayer(px);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            if (gameSpeedMultiplier > 2 && Math.random() < (gameSpeedMultiplier / 200)) {
                const streak = ctx.createLinearGradient(0, 0, window.innerWidth, 0);
                streak.addColorStop(0, 'rgba(255,42,138,0)');
                streak.addColorStop(0.5, 'rgba(255,42,138,0.18)');
                streak.addColorStop(1, 'rgba(255,42,138,0)');
                ctx.fillStyle = streak;
                ctx.fillRect(0, Math.random() * window.innerHeight, window.innerWidth, 18);
            }

            requestAnimationFrame(gameLoop);

        } catch (err) {
            console.error(err);
        }
    };

    // Initial Setup
    initGame();
});
</script>
