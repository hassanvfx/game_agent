<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Stream Catcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | title/hud -> Orbitron, ui/body -> Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-glow: #132341;
            --panel: rgba(8, 18, 34, 0.82);
            --panel-strong: rgba(16, 35, 64, 0.94);
            --panel-border: rgba(110, 232, 255, 0.32);
            --text: #f8fbff;
            --muted: #bad6f2;
            --cyan: #6ee8ff;
            --cyan-strong: #3dc9ff;
            --blue: #3b82f6;
            --violet: #a855f7;
            --green: #7bffb2;
            --red: #ff5d7a;
            --red-deep: #ff3d5f;
            --gold: #ffe27a;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            --glow: 0 0 24px rgba(110, 232, 255, 0.28);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(61, 201, 255, 0.1), transparent 30%),
                linear-gradient(180deg, var(--bg-glow) 0%, var(--bg) 45%, #030712 100%);
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(168, 85, 247, 0.18), transparent 22%),
                radial-gradient(circle at 80% 20%, rgba(110, 232, 255, 0.12), transparent 24%),
                radial-gradient(circle at 50% 100%, rgba(123, 255, 178, 0.1), transparent 30%);
            opacity: 0.9;
        }

        #game-container::after {
            background-image:
                linear-gradient(rgba(110, 232, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(110, 232, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 44px, 44px 100%;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), transparent 100%);
            opacity: 0.22;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            width: min(100% - 24px, 380px);
            margin: 12px;
            padding: 24px 22px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 37, 66, 0.92), rgba(7, 17, 31, 0.92));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow), inset 0 0 20px rgba(110, 232, 255, 0.08);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 28%, transparent 72%, rgba(110, 232, 255, 0.1));
            pointer-events: none;
        }

            .screen-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 16px;
                padding: 6px 12px;
                border-radius: 999px;
                background: rgba(110, 232, 255, 0.12);
                border: 1px solid rgba(110, 232, 255, 0.25);
                color: var(--cyan);
                font-family: 'Orbitron', system-ui, sans-serif;
                font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .screen-icon {
            margin-bottom: 14px;
            font-size: 58px;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(110, 232, 255, 0.28));
        }

        .title {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.45rem);
            line-height: 1.1;
            letter-spacing: 0.05em;
            font-weight: 400;
            color: var(--cyan);
            text-shadow: 0 0 18px rgba(61, 201, 255, 0.25);
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .accent-good { color: var(--green); }
        .accent-bad { color: var(--red); }

        .button {
            width: 100%;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            font: inherit;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            pointer-events: auto;
        }

        .button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .button:active { transform: scale(0.97); }

        .button-primary {
            background: linear-gradient(135deg, var(--violet), var(--cyan-strong));
            color: white;
            box-shadow: 0 10px 24px rgba(61, 201, 255, 0.24);
        }

        .button-primary:hover { box-shadow: 0 12px 28px rgba(61, 201, 255, 0.3); }

        .button-secondary {
            background: linear-gradient(135deg, #f8fbff, #d7eaff);
            color: #08111f;
            box-shadow: 0 10px 22px rgba(215, 234, 255, 0.18);
        }

        .button-secondary:hover { background: linear-gradient(135deg, #ffffff, #c8defe); }

        .hidden { display: none !important; }

        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .hud-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-radius: 999px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: 0.04em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            background:
                linear-gradient(180deg, rgba(17, 38, 68, 0.92), rgba(7, 17, 31, 0.9));
            border: 1px solid rgba(110, 232, 255, 0.24);
            box-shadow: var(--glow);
        }

        .hud-icon {
            font-size: 1.05rem;
            filter: drop-shadow(0 0 8px rgba(255, 226, 122, 0.4));
        }

        .result {
            margin: 0 0 22px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1.5rem;
            color: white;
            letter-spacing: 0.04em;
        }

        .screen-flair {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: -4px 0 18px;
            font-size: 1.05rem;
            color: var(--gold);
            opacity: 0.9;
        }

        .subtitle,
        .button,
        #finalScore {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 14px;
            width: clamp(84px, 18vw, 132px);
            border-radius: 18px;
            border: 1px solid rgba(110, 232, 255, 0.28);
            background: rgba(7, 17, 31, 0.56);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(16px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #hype-gif {
            top: 84px;
        }

        #fail-gif {
            bottom: 18px;
        }

        @media (max-width: 480px) {
            .screen {
                width: min(100% - 18px, 360px);
                padding: 22px 18px;
                border-radius: 20px;
            }

            .screen-icon {
                font-size: 50px;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                padding: 13px 18px;
                font-size: 0.98rem;
            }

            #hud {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .hud-pill {
                padding: 8px 12px;
                font-size: 0.82rem;
            }

            .feedback-gif {
                right: 10px;
                width: clamp(72px, 22vw, 108px);
            }

            #hype-gif {
                top: 74px;
            }

            #fail-gif {
                bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: hype/fail overlays -> catalogs/gifs.json -->
            <img id="hype-gif" class="feedback-gif" src="https://i.giphy.com/4IyVaUiM8F3oTKYmLD.webp" alt="Hype reaction overlay">
            <img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction overlay">
            <div id="start-screen" class="screen glass-panel">
                <div class="screen-badge">Neon Feed Rush</div>
                <div class="screen-icon">🛸</div>
                <h1 class="title">Stream Catcher</h1>
                <div class="screen-flair"><span>LIVE</span><span>•</span><span>HYPE</span><span>•</span><span>BOOST</span></div>
                <p class="subtitle">Pilot the hype glider through the chat storm. Catch the <span class="accent-good">good reactions</span> and dodge the <span class="accent-bad">toxic drops</span>.</p>
                <button id="start-btn" class="button button-primary">GO LIVE</button>
            </div>

            <div id="game-over-screen" class="screen glass-panel hidden">
                <div class="screen-badge">Broadcast Lost</div>
                <h2 class="title" style="color: var(--red);">STREAM ENDED</h2>
                <div class="result">Hype: <span id="finalScore" style="color: var(--cyan);">0</span></div>
                <button id="restart-btn" class="button button-secondary">GO AGAIN</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-pill">
                    <span class="hud-icon">💖</span> <span id="score">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                hype: "https://i.giphy.com/4IyVaUiM8F3oTKYmLD.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp",
                victory: "https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp"
            }
        };

        const THEME = {
            bg: '#07111f',
            bgGlow: '#132341',
            cyan: '#6ee8ff',
            cyanStrong: '#3dc9ff',
            violet: '#a855f7',
            green: '#7bffb2',
            red: '#ff5d7a',
            redDeep: '#ff3d5f',
            gold: '#ffe27a',
            whiteSoft: 'rgba(255,255,255,0.85)'
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.started = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayedAt = {};
                this.volumes = {
                    start: 0.55,
                    score: 0.5,
                    streak: 0.6,
                    fail: 0.68,
                    gameOver: 0.72
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.started = true;
            }

            playBGM() {
                if (!this.started) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, debounceMs = 90) {
                if (!this.started || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.volumes[key] ?? 0.6;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hypeGif = document.getElementById('hype-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frame = 0;
        let speedMultiplier = 1;
        let activeGifTimer = null;

        // Player
        let player = { x: 0, y: 0, width: 50, height: 50, color: THEME.cyanStrong };

        // Entities
        let bubbles = [];
        let particles = [];
        let backgroundElements = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;

            // Re-init background elements on resize
            backgroundElements = [];
            for (let i = 0; i < 15; i++) {
                backgroundElements.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 40 + 20,
                    speed: Math.random() * 0.5 + 0.1,
                    text: Math.random() > 0.5 ? "LIVE" : "CHAT",
                    alpha: Math.random() * 0.25 + 0.08
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        function updatePlayerPos(clientX) {
            if (!gameActive) return;
            player.x = clientX;
            if (player.x < player.width / 2) player.x = player.width / 2;
            if (player.x > width - player.width / 2) player.x = width - player.width / 2;
        }

        canvas.addEventListener('mousemove', e => updatePlayerPos(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            updatePlayerPos(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC HELPERS */
        function spawnBubble() {
            const isGood = Math.random() > 0.3;
            const size = 45;
            const x = Math.random() * (width - size * 2) + size;

            const types = isGood
                ? ['💖', '👍', '🔥', '🥰']
                : ['😡', '💩', '👎', '🤬'];

            const text = types[Math.floor(Math.random() * types.length)];

            bubbles.push({
                x: x,
                y: -50,
                size: size,
                text: text,
                isGood: isGood,
                speed: (Math.random() * 2 + 3) * speedMultiplier,
                wobbleOffset: Math.random() * Math.PI * 2
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function showFeedbackGif(type, duration = 1400) {
            const target = type === 'fail' ? failGif : hypeGif;
            const other = type === 'fail' ? hypeGif : failGif;
            other.classList.remove('visible');
            target.src = type === 'victory' ? ASSETS.gifs.victory : ASSETS.gifs[type];
            target.classList.add('visible');
            clearTimeout(activeGifTimer);
            activeGifTimer = setTimeout(() => {
                target.classList.remove('visible');
            }, duration);
        }

        function hideFeedbackGifs() {
            clearTimeout(activeGifTimer);
            hypeGif.classList.remove('visible');
            failGif.classList.remove('visible');
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawPaperPlane(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);

            ctx.shadowColor = THEME.cyanStrong;
            ctx.shadowBlur = 24;

            const bodyGradient = ctx.createLinearGradient(-size / 2, 0, size / 2, 0);
            bodyGradient.addColorStop(0, '#eff9ff');
            bodyGradient.addColorStop(0.45, THEME.cyan);
            bodyGradient.addColorStop(1, THEME.violet);

            drawRoundedRect(ctx, -size * 0.14, -size * 0.48, size * 0.28, size * 0.9, 14);
            ctx.fillStyle = 'rgba(8, 17, 31, 0.28)';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -size / 2);
            ctx.lineTo(size / 2, size / 2);
            ctx.lineTo(size * 0.06, size * 0.16);
            ctx.lineTo(-size / 2, size / 2);
            ctx.closePath();
            ctx.fillStyle = bodyGradient;
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.65)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -size / 2);
            ctx.lineTo(size * 0.06, size * 0.16);
            ctx.lineTo(-size / 2, size / 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.24)';
            ctx.beginPath();
            ctx.moveTo(0, -size / 2);
            ctx.lineTo(size / 2, size / 2);
            ctx.lineTo(size * 0.14, size * 0.08);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = THEME.gold;
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(0, -size * 0.1, size * 0.09, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        /** 5. MAIN LOOP */
        function initGame() {
            score = 0;
            speedMultiplier = 1;
            bubbles = [];
            particles = [];
            frame = 0;
            hideFeedbackGifs();
            document.getElementById('score').innerText = score;
            player.x = width / 2;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, THEME.bgGlow);
            bgGradient.addColorStop(0.45, THEME.bg);
            bgGradient.addColorStop(1, '#030712');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 6; i++) {
                const pulseX = ((frame * (0.12 + i * 0.01)) + i * 160) % (width + 200) - 100;
                const pulseY = height * (0.15 + i * 0.12);
                const pulseGradient = ctx.createRadialGradient(pulseX, pulseY, 0, pulseX, pulseY, 110);
                pulseGradient.addColorStop(0, i % 2 === 0 ? 'rgba(61, 201, 255, 0.08)' : 'rgba(168, 85, 247, 0.08)');
                pulseGradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = pulseGradient;
                ctx.beginPath();
                ctx.arc(pulseX, pulseY, 110, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.font = "18px 'Orbitron', sans-serif";
            ctx.textAlign = "center";
            backgroundElements.forEach(bg => {
                bg.y += bg.speed;
                if (bg.y > height + 24) bg.y = -24;
                ctx.fillStyle = `rgba(110, 232, 255, ${bg.alpha})`;
                ctx.fillText(bg.text, bg.x, bg.y);
            });

            if (frame % 600 === 0) speedMultiplier += 0.1;

            if (frame % Math.max(20, 60 - Math.floor(score / 2)) === 0) {
                spawnBubble();
            }

            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];

                b.y += b.speed;
                let wobble = Math.sin(frame * 0.05 + b.wobbleOffset) * 2;

                ctx.save();
                ctx.translate(b.x + wobble, b.y);

                const bubbleGradient = ctx.createLinearGradient(0, -b.size / 2, 0, b.size / 2);
                if (b.isGood) {
                    bubbleGradient.addColorStop(0, '#b9ffe0');
                    bubbleGradient.addColorStop(1, '#22c55e');
                    ctx.shadowColor = 'rgba(123, 255, 178, 0.55)';
                } else {
                    bubbleGradient.addColorStop(0, '#ffb1bf');
                    bubbleGradient.addColorStop(1, THEME.redDeep);
                    ctx.shadowColor = 'rgba(255, 93, 122, 0.6)';
                }
                ctx.shadowBlur = 16;

                drawRoundedRect(ctx, -b.size / 2, -b.size / 2, b.size, b.size * 0.8, 12);
                ctx.fillStyle = bubbleGradient;
                ctx.fill();

                ctx.fillStyle = b.isGood ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.16)';
                drawRoundedRect(ctx, -b.size / 2 + 4, -b.size / 2 + 4, b.size - 8, b.size * 0.3, 10);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-b.size / 2 + 10, b.size / 2 * 0.8);
                ctx.lineTo(-b.size / 2, b.size / 2 * 0.8 + 10);
                ctx.lineTo(-b.size / 2 + 20, b.size / 2 * 0.8);
                ctx.fillStyle = bubbleGradient;
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.font = `${b.size * 0.5}px Arial`;
                ctx.textBaseline = 'middle';
                ctx.fillText(b.text, 0, -b.size * 0.05);

                ctx.restore();

                const dx = player.x - (b.x + wobble);
                const dy = player.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < (player.width / 2 + b.size / 2)) {
                    if (b.isGood) {
                        score++;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('score');
                        if (score % 5 === 0) {
                            audio.playSFX('streak', 180);
                            showFeedbackGif('victory', 1200);
                        } else {
                            showFeedbackGif('hype', 900);
                        }
                        createParticles(b.x, b.y, THEME.green);
                        bubbles.splice(i, 1);
                    } else {
                        createParticles(player.x, player.y, THEME.red);
                        gameOver();
                        return;
                    }
                } else if (b.y > height + 50) {
                    bubbles.splice(i, 1);
                }
            }

            drawPaperPlane(ctx, player.x, player.y, 60);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }

            frame++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            audio.playSFX('gameOver', 0);
            showFeedbackGif('fail', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
