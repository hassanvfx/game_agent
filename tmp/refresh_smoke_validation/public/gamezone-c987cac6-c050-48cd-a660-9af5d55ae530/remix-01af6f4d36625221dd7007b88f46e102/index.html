<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Safari Match Patrol</title>
    <!-- [agent-note][stage4] repaired: font-remap | title/buttons -> Russo One | ui/body -> Exo 2 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');
        
        :root {
            --sky-top: #10233d;
            --sky-bottom: #214b38;
            --sunset: #ffb347;
            --sunset-strong: #ff8a3d;
            --canopy: #2e6b3d;
            --canopy-dark: #193d29;
            --panel: rgba(11, 27, 34, 0.76);
            --panel-border: rgba(255, 223, 130, 0.56);
            --text-main: #fdf8e9;
            --text-soft: #dceac7;
            --danger: #ff6f61;
            --gold: #ffd86f;
            --card-back-1: #ffbf5a;
            --card-back-2: #ff8f3f;
            --card-face-1: #fff6d8;
            --card-face-2: #ffe8b5;
            --leaf-glow: rgba(176, 255, 154, 0.18);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            color: var(--text-main);
            font-family: 'Exo 2', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 220, 130, 0.28), transparent 18%),
                radial-gradient(circle at 15% 14%, rgba(255, 255, 255, 0.08), transparent 12%),
                radial-gradient(circle at 80% 12%, rgba(255, 255, 255, 0.06), transparent 10%),
                linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.08));
        }

        body::after {
            background:
                radial-gradient(circle at 12% 100%, rgba(22, 61, 30, 0.95), transparent 22%),
                radial-gradient(circle at 84% 100%, rgba(18, 54, 24, 0.94), transparent 24%),
                radial-gradient(circle at 50% 108%, rgba(24, 71, 31, 0.92), transparent 26%);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            padding: max(16px, env(safe-area-inset-top)) 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.45);
        }

        .hud-item {
            background:
                linear-gradient(180deg, rgba(35, 58, 41, 0.92), rgba(16, 31, 22, 0.86));
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 999px;
            backdrop-filter: blur(8px);
            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 0 0 1px rgba(9, 20, 13, 0.35);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            font-family: 'Exo 2', Arial, sans-serif;
        }

        #status-pill {
            min-width: 104px;
            text-align: center;
        }

        #feedback-strip {
            position: absolute;
            right: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            width: min(34vw, 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 12;
            pointer-events: none;
        }

        .feedback-gif {
            width: 100%;
            max-width: 120px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(255, 229, 154, 0.45);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.24s ease, transform 0.24s ease;
            background: rgba(10, 20, 16, 0.35);
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        #reaction-caption {
            font-family: 'Russo One', Arial, sans-serif;
            font-size: clamp(12px, 2.8vw, 15px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
            min-height: 1.2em;
            text-align: center;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(255, 208, 120, 0.18), transparent 30%),
                rgba(6, 16, 22, 0.86);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        #game-over-screen.visible {
            opacity: 1;
        }

        #game-over-screen.hidden {
            display: none;
        }

        h1 {
            font-family: 'Russo One', Arial, sans-serif;
            font-size: clamp(28px, 7vw, 44px);
            color: var(--gold);
            margin: 0 0 14px 0;
            text-align: center;
            text-shadow:
                0 4px 0 rgba(77, 42, 3, 0.8),
                0 10px 24px rgba(0,0,0,0.4);
            letter-spacing: 0.04em;
        }

        p {
            font-size: clamp(16px, 4.2vw, 22px);
            color: var(--text-soft);
            margin: 0 0 28px 0;
            text-align: center;
            font-weight: 600;
        }

        button {
            background: linear-gradient(180deg, var(--sunset), var(--sunset-strong));
            color: #fffaf0;
            border: 1px solid rgba(255, 242, 209, 0.45);
            padding: 14px 28px;
            font-size: 17px;
            font-family: 'Russo One', Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 999px;
            box-shadow:
                0 6px 0 #96531c,
                0 14px 24px rgba(0,0,0,0.28);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.16s ease;
            max-width: min(280px, 82vw);
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #96531c;
        }

        button:hover {
            filter: brightness(1.06);
        }

        #mute-btn {
            pointer-events: auto;
            cursor: pointer;
            font-size: 20px;
            min-width: 48px;
            text-align: center;
        }

        @media (max-width: 520px) {
            #hud {
                font-size: 12px;
            }

            .hud-item {
                padding: 9px 12px;
            }

            #feedback-strip {
                width: min(31vw, 96px);
                right: 10px;
                bottom: max(10px, env(safe-area-inset-bottom));
            }

            .feedback-gif {
                max-width: 96px;
                border-radius: 14px;
            }

            #reaction-caption {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
    "cardSpeed": { "type": "number", "label": "Flip Speed", "value": 12, "min": 5, "max": 20 },
    "bgGradientStart": { "type": "color", "label": "BG Top", "value": "#200122" },
    "bgGradientEnd": { "type": "color", "label": "BG Bottom", "value": "#6f0000" }
}
</script>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-item" id="score-display">Tracks: 0</div>
            <div class="hud-item" id="status-pill">Patrol Ready</div>
            <div class="hud-item" id="mute-btn">🔊</div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: match/win/fail overlays -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div id="feedback-strip" aria-hidden="true">
            <img id="feedback-gif-match" class="feedback-gif" alt="Match reaction">
            <img id="feedback-gif-fail" class="feedback-gif" alt="Mismatch reaction">
            <div id="reaction-caption"></div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>Safari Survey Complete!</h1>
            <p id="final-stats">Moves: 0</p>
            <button id="restart-btn">Scout Again</button>
        </div>
    </div>
</div>

<!-- Static Media Declarations -->
<img id="asset_placeholder" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" hidden>

<script>
/**
 * §0 CONSTANTS & CONFIG
 */
const EMOJIS = ['🐕', '🐈', '🐅', '🐎', '🐄', '🐖', '🐑', '🐘', '🦒', '🐢'];
const GRID_COLS = 4;
const GRID_ROWS = 5;
const CARD_GAP = 12;

const MEDIA = {
    fonts: {
        primary: '"Russo One", Arial, sans-serif',
        secondary: '"Exo 2", Arial, sans-serif'
    },
    audio: {
        flip: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        match: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
        mismatch: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3',
        win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3',
        loop: 'https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3'
    },
    gifs: {
        match: 'https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp',
        fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp'
    }
};

// Runtime Config
window.gameConfig = {
    cardSpeed: 12,
    bgGradientStart: "#200122",
    bgGradientEnd: "#6f0000"
};

// Parse Config
try {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let key in rawConfig) window.gameConfig[key] = rawConfig[key].value;
} catch(e) { console.error("Config parse failed", e); }

/**
 * §1 SYSTEM CORE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const scoreDisplay = document.getElementById('score-display');
const statusPill = document.getElementById('status-pill');
const feedbackGifMatch = document.getElementById('feedback-gif-match');
const feedbackGifFail = document.getElementById('feedback-gif-fail');
const reactionCaption = document.getElementById('reaction-caption');
let cw, ch;
let gameState = 'BOOT';
let lastTime = 0;
let screenShake = 0;

feedbackGifMatch.src = MEDIA.gifs.match;
feedbackGifFail.src = MEDIA.gifs.fail;

// Audio System
const AudioSys = {
    initialized: false,
    muted: false,
    started: false,
    sfx: {},
    bgm: null,

    init() {
        if (this.initialized) return;
        this.initialized = true;
        this.sfx = {
            flip: this.createAudio(MEDIA.audio.flip, 0.35),
            match: this.createAudio(MEDIA.audio.match, 0.4),
            mismatch: this.createAudio(MEDIA.audio.mismatch, 0.36),
            win: this.createAudio(MEDIA.audio.win, 0.46)
        };
        this.bgm = this.createAudio(MEDIA.audio.loop, 0.18, true);
    },

    createAudio(src, volume, loop = false) {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        audio.loop = loop;
        audio.playsInline = true;
        return audio;
    },

    unlock() {
        this.init();
        if (this.started || this.muted) return;
        this.started = true;
        this.playLoop();
    },

    playLoop() {
        if (this.muted || !this.bgm) return;
        this.bgm.currentTime = 0;
        this.bgm.play().catch(() => {});
    },

    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },

    pauseLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
    },

    resumeLoop() {
        if (this.muted || !this.bgm || !this.started || gameState !== 'PLAYING') return;
        this.bgm.play().catch(() => {});
    },

    play(name) {
        if (this.muted || !this.sfx[name]) return;
        const audio = this.sfx[name];
        try {
            audio.pause();
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    },

    setMuted(nextMuted) {
        this.muted = nextMuted;
        if (this.muted) {
            Object.values(this.sfx).forEach((audio) => audio.pause());
            this.pauseLoop();
        } else if (this.started && gameState === 'PLAYING') {
            this.resumeLoop();
        }
    }
};

const Feedback = {
    timeoutId: null,

    show(type, text, duration = 1200) {
        clearTimeout(this.timeoutId);
        const showMatch = type === 'match' || type === 'win';
        feedbackGifMatch.classList.toggle('visible', showMatch);
        feedbackGifFail.classList.toggle('visible', type === 'fail');
        reactionCaption.textContent = text || '';

        this.timeoutId = setTimeout(() => {
            feedbackGifMatch.classList.remove('visible');
            feedbackGifFail.classList.remove('visible');
            reactionCaption.textContent = '';
        }, duration);
    }
};

// Haptic System
const Haptic = {
    trigger(style) {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', 
                requestId: 'h5-' + Date.now(), 
                version: '1.0',
                params: { style }
            });
        } else if (navigator.vibrate) {
            navigator.vibrate(style === 'heavy' ? 50 : 20);
        }
    }
};

/**
 * §2 ENTITIES
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 300 + 100;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 1.5 + 0.5;
        this.size = Math.random() * 8 + 4;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 500 * dt;
        this.life -= this.decay * dt;
        return this.life > 0;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Card {
    constructor(emoji, index) {
        this.emoji = emoji;
        this.index = index;
        this.matched = false;
        this.flipped = false;
        this.scaleX = 1;
        this.scaleY = 1;
        this.targetScaleX = 1;
        this.animState = 'IDLE';
    }

    getBounds() {
        const safeW = cw - 40;
        const safeH = ch - 140;
        const cellW = (safeW - (GRID_COLS - 1) * CARD_GAP) / GRID_COLS;
        const cellH = (safeH - (GRID_ROWS - 1) * CARD_GAP) / GRID_ROWS;
        const size = Math.min(cellW, cellH, 100);

        const gridW = size * GRID_COLS + CARD_GAP * (GRID_COLS - 1);
        const gridH = size * GRID_ROWS + CARD_GAP * (GRID_ROWS - 1);
        
        const startX = (cw - gridW) / 2;
        const startY = (ch - gridH) / 2 + 40;

        const col = this.index % GRID_COLS;
        const row = Math.floor(this.index / GRID_COLS);

        return {
            x: startX + col * (size + CARD_GAP),
            y: startY + row * (size + CARD_GAP),
            w: size,
            h: size
        };
    }

    update(dt) {
        const speed = window.gameConfig.cardSpeed;
        
        if (this.animState !== 'IDLE') {
            const diff = this.targetScaleX - this.scaleX;
            if (Math.abs(diff) < 0.05) {
                this.scaleX = this.targetScaleX;
                if (this.animState === 'FLIPPING_IN') {
                    this.flipped = !this.flipped;
                    this.targetScaleX = 1;
                    this.animState = 'FLIPPING_OUT';
                } else {
                    this.animState = 'IDLE';
                }
            } else {
                this.scaleX += Math.sign(diff) * speed * dt;
            }
        }

        if (this.matched) {
            this.scaleY = 1 + Math.sin(Date.now() / 200) * 0.05;
        } else {
            this.scaleY = 1;
        }
    }

    draw(ctx) {
        const b = this.getBounds();
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(Math.abs(this.scaleX), this.scaleY);

        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;

        const isOpen = this.flipped || this.matched;
        const hoverBob = Math.sin(Date.now() / 260 + this.index) * (this.matched ? 2.5 : 1.2);

        const shell = ctx.createLinearGradient(-b.w/2, -b.h/2, b.w/2, b.h/2);
        if (isOpen) {
            shell.addColorStop(0, '#fff9e2');
            shell.addColorStop(1, '#ffe2a6');
        } else {
            shell.addColorStop(0, '#ffc55f');
            shell.addColorStop(1, '#ff8d43');
        }

        ctx.translate(0, hoverBob);

        ctx.fillStyle = shell;
        this.roundRect(ctx, -b.w/2, -b.h/2, b.w, b.h, 16);
        ctx.fill();

        ctx.lineWidth = Math.max(3, b.w * 0.045);
        ctx.strokeStyle = isOpen ? 'rgba(132, 80, 17, 0.42)' : 'rgba(109, 51, 16, 0.52)';
        ctx.stroke();

        ctx.fillStyle = isOpen ? 'rgba(255,255,255,0.38)' : 'rgba(255, 243, 208, 0.24)';
        this.roundRect(ctx, -b.w/2 + 6, -b.h/2 + 6, b.w - 12, b.h * 0.26, 12);
        ctx.fill();

        ctx.shadowColor = "transparent";
        if (isOpen) {
            ctx.fillStyle = 'rgba(30, 51, 34, 0.16)';
            ctx.beginPath();
            ctx.ellipse(0, b.h * 0.18, b.w * 0.24, b.h * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = `${b.w * 0.62}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, 0, 0);

            ctx.fillStyle = 'rgba(35, 76, 42, 0.68)';
            ctx.font = `${Math.max(10, b.w * 0.11)}px ${MEDIA.fonts.secondary}`;
            ctx.fillText('TRACKED', 0, b.h * 0.31);
        } else {
            ctx.strokeStyle = 'rgba(79, 42, 10, 0.26)';
            ctx.lineWidth = Math.max(1.5, b.w * 0.02);
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-b.w * 0.22, i * b.h * 0.12);
                ctx.lineTo(b.w * 0.22, i * b.h * 0.12);
                ctx.stroke();
            }

            ctx.fillStyle = "rgba(255,255,255,0.88)";
            ctx.font = `${b.w * 0.22}px ${MEDIA.fonts.primary}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("PAW", 0, -b.h * 0.08);

            ctx.font = `${b.w * 0.26}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            ctx.fillText("🐾", 0, b.h * 0.18);
        }

        ctx.restore();
    }

    roundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    flip() {
        if (this.animState !== 'IDLE') return;
        this.targetScaleX = 0;
        this.animState = 'FLIPPING_IN';
        AudioSys.play('flip');
        Haptic.trigger('light');
    }
}

/**
 * §3 GAME STATE
 */
let cards = [];
let particles = [];
let flippedCards = [];
let matchedCount = 0;
let moves = 0;
let inputLocked = false;

function updateStatus(text) {
    statusPill.textContent = text;
}

function initGame() {
    cards = [];
    particles = [];
    flippedCards = [];
    matchedCount = 0;
    moves = 0;
    inputLocked = false;
    screenShake = 0;
    
    scoreDisplay.innerText = "Tracks: 0";
    updateStatus('Patrol Ready');
    Feedback.show('match', 'Survey On', 900);
    setState('PLAYING');

    let deck = [...EMOJIS, ...EMOJIS];
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
        cards.push(new Card(deck[i], i));
    }
}

function setState(newState) {
    gameState = newState;
    const goScreen = document.getElementById('game-over-screen');
    
    if (newState === 'GAMEOVER') {
        AudioSys.pauseLoop();
        goScreen.classList.remove('hidden');
        setTimeout(() => goScreen.classList.add('visible'), 10);
    } else {
        goScreen.classList.remove('visible');
        setTimeout(() => {
            if (gameState !== 'GAMEOVER') goScreen.classList.add('hidden');
        }, 300);
        AudioSys.resumeLoop();
    }
}

function spawnConfetti(x, y) {
    const colors = ['#ffd86f', '#ff8a3d', '#c6ff8b', '#fff7dc', '#7bd389'];
    for (let i = 0; i < 30; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
}

function checkMatch() {
    const [c1, c2] = flippedCards;
    
    if (c1.emoji === c2.emoji) {
        c1.matched = true;
        c2.matched = true;
        matchedCount++;
        flippedCards = [];
        
        AudioSys.play('match');
        Haptic.trigger('medium');
        updateStatus('Match Found');
        Feedback.show('match', 'Wild Pair!', 1250);
        
        const b1 = c1.getBounds();
        const b2 = c2.getBounds();
        spawnConfetti(b1.x + b1.w/2, b1.y + b1.h/2);
        spawnConfetti(b2.x + b2.w/2, b2.y + b2.h/2);

        if (matchedCount === (GRID_COLS * GRID_ROWS) / 2) {
            setTimeout(() => {
                AudioSys.play('win');
                Haptic.trigger('heavy');
                Feedback.show('win', 'Safari Cleared!', 2200);
                updateStatus('Survey Complete');
                document.getElementById('final-stats').innerText = `Field Notes Logged: ${moves} moves`;
                setState('GAMEOVER');
            }, 800);
        }
    } else {
        inputLocked = true;
        AudioSys.play('mismatch');
        Haptic.trigger('light');
        updateStatus('False Trail');
        Feedback.show('fail', 'Wrong Tracks', 1350);
        screenShake = 10;
        
        setTimeout(() => {
            c1.flip();
            c2.flip();
            flippedCards = [];
            inputLocked = false;
            updateStatus('Keep Tracking');
        }, 1000);
    }

    moves++;
    scoreDisplay.innerText = `Tracks: ${moves}`;
}

/**
 * §4 INPUT & LOOP
 */
function handleGlobalInput(e) {
    e.preventDefault();
    AudioSys.unlock();

    if (gameState === 'GAMEOVER') {
        return;
    }

    if (gameState === 'PLAYING' && !inputLocked) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        for (let card of cards) {
            if (card.matched || card.flipped) continue;
            
            const b = card.getBounds();
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                card.flip();
                updateStatus('Trail Checked');
                flippedCards.push(card);
                if (flippedCards.length === 2) {
                    checkMatch();
                }
                break;
            }
        }
    }
}

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

function loop(timestamp) {
    try {
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (isNaN(dt)) dt = 0;
        dt = Math.min(dt, 0.1);

        const grad = ctx.createLinearGradient(0, 0, 0, ch);
        grad.addColorStop(0, window.gameConfig.bgGradientStart);
        grad.addColorStop(0.6, '#27563c');
        grad.addColorStop(1, window.gameConfig.bgGradientEnd);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, cw, ch);

        const sunGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.16, 12, cw * 0.5, ch * 0.16, ch * 0.35);
        sunGlow.addColorStop(0, 'rgba(255, 225, 138, 0.55)');
        sunGlow.addColorStop(0.28, 'rgba(255, 186, 81, 0.2)');
        sunGlow.addColorStop(1, 'rgba(255, 186, 81, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        for (let i = 0; i < 5; i++) {
            const x = (cw / 5) * i + ((i % 2) * 28);
            ctx.beginPath();
            ctx.arc(x + 60, ch * 0.18 + (i % 2) * 16, 18 + i * 2, 0, Math.PI * 2);
            ctx.arc(x + 86, ch * 0.18 + 6, 14 + i, 0, Math.PI * 2);
            ctx.arc(x + 38, ch * 0.18 + 8, 12 + i, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(20, 61, 32, 0.92)';
        ctx.beginPath();
        ctx.moveTo(0, ch);
        for (let i = 0; i <= 6; i++) {
            const x = (cw / 6) * i;
            const y = ch - 58 - (i % 2 === 0 ? 8 : 30);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(cw, ch);
        ctx.closePath();
        ctx.fill();

        if (screenShake > 0) {
            const dx = (Math.random() - 0.5) * screenShake;
            const dy = (Math.random() - 0.5) * screenShake;
            ctx.save();
            ctx.translate(dx, dy);
            screenShake = Math.max(0, screenShake - 30 * dt);
        }

        cards.forEach(c => {
            c.update(dt);
            c.draw(ctx);
        });

        for (let i = particles.length - 1; i >= 0; i--) {
            if (!particles[i].update(dt)) {
                particles.splice(i, 1);
            } else {
                particles[i].draw(ctx);
            }
        }

        if (screenShake > 0 || screenShake === 0 && ctx.getTransform().e !== 0) ctx.restore();

        requestAnimationFrame(loop);
    } catch (e) {
        console.error("Loop Error", e);
        requestAnimationFrame(loop);
    }
}

/**
 * §5 INITIALIZATION
 */
window.addEventListener('DOMContentLoaded', () => {
    AudioSys.init();
    
    window.addEventListener('resize', resize);
    window.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            AudioSys.pauseLoop();
        } else {
            AudioSys.resumeLoop();
        }
    });
    resize();
    
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        AudioSys.unlock();
        AudioSys.play('win');
        initGame();
    });
    
    document.getElementById('mute-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        AudioSys.setMuted(!AudioSys.muted);
        e.target.innerText = AudioSys.muted ? '🔇' : '🔊';
        updateStatus(AudioSys.muted ? 'Audio Muted' : 'Audio Live');
    });

    initGame();
    requestAnimationFrame(loop);
});
</script>
