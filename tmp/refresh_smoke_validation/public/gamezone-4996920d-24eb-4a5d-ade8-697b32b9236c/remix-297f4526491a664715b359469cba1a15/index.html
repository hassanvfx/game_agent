<style>
    /* [agent-note][stage3] resolved-font: title -> Audiowide, ui -> Exo 2 from catalogs/fonts.json */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

    :root {
        --bg-deep: #130f25;
        --bg-mid: #231846;
        --bg-glow: #3e2d7d;
        --panel: rgba(20, 17, 42, 0.72);

        --panel-border: rgba(158, 239, 255, 0.34);

        --text-soft: #bfd7f8;
        --accent: #75f0ff;
        --accent-2: #ff86d3;
        --accent-3: #ffe17a;
        --danger: #ff8d94;
        --success: #98f7b8;
        --shadow: rgba(5, 8, 20, 0.36);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(117, 240, 255, 0.18), transparent 28%),
            radial-gradient(circle at 80% 20%, rgba(255, 134, 211, 0.16), transparent 26%),
            linear-gradient(180deg, var(--bg-glow) 0%, var(--bg-mid) 34%, var(--bg-deep) 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.22;
        pointer-events: none;
    }

    canvas {
        display: block;
        touch-action: none;
    }

    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }

    .glass {
        background:

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(168, 238, 255, 0.25);
        box-shadow:
            0 18px 45px rgba(0, 0, 0, 0.3),
            inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .btn {
        pointer-events: auto;
        border: none;
        outline: none;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease, background 0.18s ease;
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        user-select: none;
        -webkit-user-select: none;
        letter-spacing: 0.06em;
    }

    .btn:active {
        transform: scale(0.95);
    }

    #start-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at 50% 30%, rgba(117, 240, 255, 0.12), transparent 32%),

        pointer-events: auto;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
    }

    #start-screen::before,
    #start-screen::after {
        content: '✨';
        position: absolute;
        font-size: 1.5rem;
        opacity: 0.75;
        animation: pulseFloat 2.6s ease-in-out infinite;
    }

    #start-screen::before {
        top: 22%;

    }

    #start-screen::after {
        right: 14%;
        bottom: 24%;
        animation-delay: 0.8s;
    }

    #title {
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(2rem, 9vw, 3.05rem);
        letter-spacing: 0.08em;
        color: #f6fbff;
        margin: 0;
        text-align: center;
        text-shadow: 0 0 18px rgba(117, 240, 255, 0.28);
    }

    #subtitle {
        font-size: clamp(1rem, 4vw, 1.2rem);
        color: var(--text-soft);
        margin: 0 0 1rem;
        animation: pulse 2s infinite;
    }

    #start-btn {

    #hud {

        align-items: flex-start;
        gap: 0.5rem;
    }

    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
    .hud-btn {
        padding: 0.5rem 0.95rem;
        border-radius: 999px;
        font-size: 0.82rem;

    .hud-btn:hover {

    .game-container {

    .hud-counter {
        padding: 0.34rem 0.85rem;

        border-radius: 9999px;
        color: var(--text-soft);

    }

    #controls {
        position: absolute;

        display: flex;

    }

    #hint {
        position: absolute;

    @keyframes pulse {
        0% { opacity: 0.62; }
        50% { opacity: 1; }

    @keyframes pulseFloat {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }

    #gif-feedback {

        display: flex;
        justify-content: flex-end;

        z-index: 11;
    }

    .gif-sticker {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 1rem;

    .gif-sticker.active {

    #combo-caption {
        position: absolute;

        color: var(--accent-3);
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(0.8rem, 2.8vw, 1rem);
        letter-spacing: 0.08em;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease, transform 0.22s ease;
        z-index: 12;
        text-shadow: 0 0 10px rgba(255, 225, 122, 0.3);

    #combo-caption.active {
        opacity: 1;

    .hidden { display: none !important; }

    @media (max-width: 640px) {
        #start-screen {

        .hud-btn,

<script>
window.gameConfigDefs = {
    "gravity": { "type": "number", "label": "Gravity", "value": 0.5, "min": 0, "max": 2 },
    "bounciness": { "type": "number", "label": "Bounciness", "value": 0.7, "min": 0.1, "max": 1.2 },
    "friction": { "type": "number", "label": "Air Resistance", "value": 0.99, "min": 0.90, "max": 1.0 },
    "spawnSize": { "type": "number", "label": "Spawn Size", "value": 30, "min": 10, "max": 60 }
};

window.gameConfig = {};
try {
    const parsed = JSON.parse(document.getElementById('game-config').textContent);
    for (const key in parsed) {
        window.gameConfig[key] = parsed[key].value;
        window.gameConfigDefs[key] = parsed[key];
    }
} catch (e) {
    console.error("Config parse error", e);
    window.gameConfig = { gravity: 0.5, bounciness: 0.7, friction: 0.99, spawnSize: 30 };
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

class AudioManager {
    constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioCtx ? new AudioCtx() : null;
        this.unlocked = false;
        this.cooldowns = new Map();
        this.activeElements = new Set();
    }

    unlock() {
        if (!this.ctx) {
            this.unlocked = true;
            this.playBgm();
            return;
        }
        if (this.unlocked) {
            this.playBgm();
            return;
        }
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {
            this.unlocked = true;
            this.playBgm();
        });
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.24;
        el.play().catch(() => {});
    }

    pauseBgm() {
        const el = document.getElementById('bgm_main');
        if (el) el.pause();
    }

    playSfx(id, options = {}) {
        if (!this.unlocked) return;
        const { volume = 0.55, cooldown = 0 } = options;
        const now = performance.now();
        const nextAllowed = this.cooldowns.get(id) || 0;
        if (now < nextAllowed) return;
        this.cooldowns.set(id, now + cooldown);

        const el = document.getElementById(id);
        if (el) {
            try {
                const clone = el.cloneNode();
                clone.volume = volume;
                const cleanup = () => {
                    clone.removeEventListener('ended', cleanup);
                    clone.removeEventListener('error', cleanup);
                    this.activeElements.delete(clone);
                };
                clone.addEventListener('ended', cleanup);
                clone.addEventListener('error', cleanup);
                this.activeElements.add(clone);
                clone.play().catch(cleanup);
            } catch (_) {}
        } else {
            this.synthesize('beep');
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        if (type === 'pop') {
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else {
            osc.frequency.setValueAtTime(200, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;
let lastTime = 0;
let isPlaying = false;
let audioManager = null;

let bodies = [];
let particles = [];
let nextId = 0;
let gravityEnabled = true;

let pointer = { x: 0, y: 0, isDown: false, id: null };
let comboCaptionTimeout = 0;
let gifHideTimeout = 0;
let dragTarget = null;
let lastPointerPos = { x: 0, y: 0 };
let throwVel = { x: 0, y: 0 };
let doubleTapTimer = 0;
let lastTapTarget = null;

const COLORS = ['#75f0ff', '#ff86d3', '#ffe17a', '#8ff7b7', '#8cb4ff'];

function shadeColor(color, percent) {
    const num = parseInt(color.slice(1), 16);
    const amt = Math.round(2.55 * percent);
    const r = Math.max(0, Math.min(255, (num >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return `rgb(${r}, ${g}, ${b})`;
}

class Body {
    constructor(x, y, r) {
        this.id = nextId++;
        this.x = x;
        this.y = y;
        this.r = r;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.scale = 0;
        this.targetScale = 1;
        this.blinkOffset = Math.random() * Math.PI * 2;
    }

    update(dt) {
        if (this.scale < this.targetScale) {
            this.scale += (this.targetScale - this.scale) * 10 * dt;
        }

        if (this === dragTarget) {
            this.vx = 0;
            this.vy = 0;
            return;
        }

        if (gravityEnabled) {
            this.vy += window.gameConfig.gravity * 60 * dt;
        }

        this.vx *= window.gameConfig.friction;
        this.vy *= window.gameConfig.friction;

        this.x += this.vx;
        this.y += this.vy;

        if (this.x - this.r < 0) {
            this.x = this.r;
            this.vx *= -window.gameConfig.bounciness;
        } else if (this.x + this.r > width) {
            this.x = width - this.r;
            this.vx *= -window.gameConfig.bounciness;
        }

        if (this.y - this.r < 0) {
            this.y = this.r;
            this.vy *= -window.gameConfig.bounciness;
        } else if (this.y + this.r > height) {
            this.y = height - this.r;
            this.vy *= -window.gameConfig.bounciness;
            if (Math.abs(this.vy) < 1) {
                this.vx *= 0.95;
            }
        }
    }

    draw(ctx, timestamp) {
        const r = this.r * this.scale;
        if (r <= 0) return;

        const gradient = ctx.createRadialGradient(
            this.x - r * 0.35,
            this.y - r * 0.45,
            Math.max(1, r * 0.18),
            this.x,
            this.y,
            r
        );
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.18, shadeColor(this.color, 28));
        gradient.addColorStop(0.58, this.color);
        gradient.addColorStop(1, shadeColor(this.color, -22));

        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = r * 0.32;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = Math.max(2, r * 0.08);
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        const blink = Math.sin(timestamp * 0.005 + this.blinkOffset);
        const eyeY = this.y - r * 0.12;
        const eyeOffsetX = r * 0.2;
        const eyeRadius = Math.max(1.6, r * 0.06);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#17203d';
        if (blink > -0.92) {
            ctx.beginPath();
            ctx.arc(this.x - eyeOffsetX, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.arc(this.x + eyeOffsetX, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.strokeStyle = '#17203d';
            ctx.lineWidth = Math.max(1.4, r * 0.045);
            ctx.beginPath();
            ctx.moveTo(this.x - eyeOffsetX - eyeRadius, eyeY);
            ctx.lineTo(this.x - eyeOffsetX + eyeRadius, eyeY);
            ctx.moveTo(this.x + eyeOffsetX - eyeRadius, eyeY);
            ctx.lineTo(this.x + eyeOffsetX + eyeRadius, eyeY);
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(23,32,61,0.86)';
        ctx.lineWidth = Math.max(1.4, r * 0.04);
        ctx.beginPath();
        ctx.arc(this.x, this.y + r * 0.08, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.arc(this.x - r * 0.28, this.y - r * 0.28, Math.max(0, r * 0.16), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 2 * dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function resolveCollisions() {
    for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
            let b1 = bodies[i];
            let b2 = bodies[j];
            
            if (b1 === dragTarget || b2 === dragTarget) continue;

            let dx = b2.x - b1.x;
            let dy = b2.y - b1.y;
            let distSq = dx * dx + dy * dy;
            let minDist = b1.r + b2.r;

            if (distSq < minDist * minDist) {
                let dist = Math.sqrt(distSq);
                if (dist === 0) dist = 0.01;
                let overlap = minDist - dist;
                
                let nx = dx / dist;
                let ny = dy / dist;

                let totalMass = b1.r + b2.r;
                let m1 = b2.r / totalMass;
                let m2 = b1.r / totalMass;

                b1.x -= nx * overlap * m1;
                b1.y -= ny * overlap * m1;
                b2.x += nx * overlap * m2;
                b2.y += ny * overlap * m2;

                let rvx = b2.vx - b1.vx;
                let rvy = b2.vy - b1.vy;
                let velAlongNormal = rvx * nx + rvy * ny;

                if (velAlongNormal > 0) continue;

                let e = window.gameConfig.bounciness;
                let jVal = -(1 + e) * velAlongNormal;
                jVal /= (1 / b1.r + 1 / b2.r);

                let impulseX = jVal * nx;
                let impulseY = jVal * ny;

                b1.vx -= impulseX / b1.r;
                b1.vy -= impulseY / b1.r;
                b2.vx += impulseX / b2.r;
                b2.vy += impulseY / b2.r;

                if (audioManager && Math.abs(velAlongNormal) > 1.8) {
                    audioManager.playSfx('sfx_collide', { volume: 0.2, cooldown: 90 });
                }
            }
        }
    }
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    for (let i = 0; i < 3; i++) {
        spawnBody(width / 2 + (Math.random() - 0.5) * 100, height / 3);
    }

    requestAnimationFrame(loop);
}

function showComboCaption(text) {
    const el = document.getElementById('combo-caption');
    if (!el) return;
    clearTimeout(comboCaptionTimeout);
    el.textContent = text;
    el.classList.add('active');
    comboCaptionTimeout = setTimeout(() => el.classList.remove('active'), 900);
}

function triggerReactionGif(type) {
    const gif = document.getElementById('reaction-gif');
    if (!gif) return;
    const src = type === 'clear' ? gif.dataset.clearSrc : gif.dataset.burstSrc;
    if (gif.getAttribute('src') !== src) {
        gif.setAttribute('src', src);
    }
    gif.classList.add('active');
    clearTimeout(gifHideTimeout);
    gifHideTimeout = setTimeout(() => gif.classList.remove('active'), 1400);
}

function spawnBody(x, y) {
    let r = window.gameConfig.spawnSize * (0.8 + Math.random() * 0.4);
    bodies.push(new Body(x, y, r));
    if (audioManager) audioManager.playSfx('sfx_spawn', { volume: 0.45, cooldown: 60 });
    updateObjCount();
}

function explode(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push(new Particle(x, y, color));
    }
    triggerReactionGif('burst');
    showComboCaption('Burst Bloom!');
    if (audioManager) audioManager.playSfx('sfx_burst', { volume: 0.5, cooldown: 120 });
}

function updateObjCount() {
    const el = document.getElementById('obj-count');
    if (el) el.innerText = bodies.length;
}

function drawBackground(timestamp) {
    const drift = (timestamp * 0.02) % 56;

    const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
    bgGradient.addColorStop(0, '#34256f');
    bgGradient.addColorStop(0.45, '#1e1848');
    bgGradient.addColorStop(1, '#110f26');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = 'rgba(117, 240, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(width * 0.15, height * 0.12, Math.min(width, height) * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 134, 211, 0.07)';
    ctx.beginPath();
    ctx.arc(width * 0.82, height * 0.18, Math.min(width, height) * 0.16, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(160, 215, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -56 + drift; x < width + 56; x += 56) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
    }
    for (let y = -56 + drift; y < height + 56; y += 56) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
    }
    ctx.stroke();

    const starCount = Math.max(14, Math.floor(width / 42));
    for (let i = 0; i < starCount; i++) {
        const x = (i * 79 + 37) % width;
        const y = ((i * 53) % Math.max(1, Math.floor(height * 0.55))) + 18;
        const pulse = 0.35 + 0.65 * Math.abs(Math.sin(timestamp * 0.0015 + i));
        ctx.fillStyle = `rgba(255,255,255,${0.15 + pulse * 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, 1.2 + (i % 3) * 0.45, 0, Math.PI * 2);
        ctx.fill();
    }
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (isPlaying) {
        bodies.forEach(b => b.update(dt));
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
        resolveCollisions();

        if (dragTarget) {
            let dx = pointer.x - dragTarget.x;
            let dy = pointer.y - dragTarget.y;
            dragTarget.x += dx * 15 * dt;
            dragTarget.y += dy * 15 * dt;
            
            throwVel.x = (pointer.x - lastPointerPos.x) / dt;
            throwVel.y = (pointer.y - lastPointerPos.y) / dt;
            lastPointerPos.x = pointer.x;
            lastPointerPos.y = pointer.y;
        }
    }

    drawBackground(timestamp);

    bodies.forEach(b => b.draw(ctx, timestamp));
    particles.forEach(p => p.draw(ctx));

    if (dragTarget) {
        ctx.beginPath();
        ctx.moveTo(dragTarget.x, dragTarget.y);
        ctx.lineTo(pointer.x, pointer.y);
        ctx.strokeStyle = 'rgba(117, 240, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    requestAnimationFrame(loop);
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!isPlaying) return;
    
    const pos = getPointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
    pointer.isDown = true;
    pointer.id = e.pointerId;
    lastPointerPos = { ...pointer };

    let clickedBody = null;
    for (let i = bodies.length - 1; i >= 0; i--) {
        let b = bodies[i];
        let dx = pointer.x - b.x;
        let dy = pointer.y - b.y;
        if (dx * dx + dy * dy < b.r * b.r) {
            clickedBody = b;
            break;
        }
    }

    const now = Date.now();
    if (clickedBody) {
        if (lastTapTarget === clickedBody && (now - doubleTapTimer) < 300) {
            explode(clickedBody.x, clickedBody.y, clickedBody.color);
            bodies = bodies.filter(b => b !== clickedBody);
            clickedBody = null;
            dragTarget = null;
            updateObjCount();
        } else {
            dragTarget = clickedBody;
            dragTarget.vx = 0;
            dragTarget.vy = 0;
            lastTapTarget = clickedBody;
            doubleTapTimer = now;
        }
    } else {
        spawnBody(pointer.x, pointer.y);
    }
    
    if (audioManager && !audioManager.unlocked) {
        audioManager.unlock();
    }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!isPlaying) return;
    if (e.pointerId !== pointer.id) return;
    
    const pos = getPointerPos(e);
    pointer.x = pos.x;
    pointer.y = pos.y;
}, { passive: false });

function handleUp(e) {
    e.preventDefault();
    if (e.pointerId !== pointer.id) return;
    
    pointer.isDown = false;
    pointer.id = null;

    if (dragTarget) {
        let speed = Math.sqrt(throwVel.x * throwVel.x + throwVel.y * throwVel.y);
        let maxSpeed = 30;
        if (speed > maxSpeed) {
            let scale = maxSpeed / speed;
            throwVel.x *= scale;
            throwVel.y *= scale;
        }
        
        dragTarget.vx = throwVel.x * 0.5;
        dragTarget.vy = throwVel.y * 0.5;
        dragTarget = null;
    }
}

canvas.addEventListener('pointerup', handleUp, { passive: false });
canvas.addEventListener('pointercancel', handleUp, { passive: false });

    document.addEventListener('DOMContentLoaded', () => {
        audioManager = new AudioManager();
        
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const hud = document.getElementById('hud');
        const hint = document.getElementById('hint');
        const clearBtn = document.getElementById('clear-btn');
        const gravBtn = document.getElementById('grav-btn');

        startBtn.addEventListener('click', () => {
            audioManager.unlock();
            audioManager.playSfx('sfx_start', { volume: 0.42, cooldown: 300 });
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            hud.style.display = 'flex';
            isPlaying = true;
            showComboCaption('Garden Live');
            
            hint.style.opacity = 1;
            setTimeout(() => hint.style.opacity = 0, 4000);
        });

        clearBtn.addEventListener('click', () => {
            if (!bodies.length) {
                audioManager.playSfx('sfx_ui', { volume: 0.4, cooldown: 120 });
                showComboCaption('Nothing to clear');
                triggerReactionGif('clear');
                return;
            }
            bodies.forEach(b => explode(b.x, b.y, b.color));
            bodies = [];
            updateObjCount();
            audioManager.playSfx('sfx_clear', { volume: 0.38, cooldown: 180 });
            showComboCaption('Field Reset');
            triggerReactionGif('clear');
        });

        gravBtn.addEventListener('click', () => {
            gravityEnabled = !gravityEnabled;
            audioManager.playSfx('sfx_ui', { volume: 0.4, cooldown: 120 });
            gravBtn.innerText = gravityEnabled ? "Gravity: ON" : "Gravity: OFF";
            gravBtn.style.background = gravityEnabled
                ? "linear-gradient(180deg, rgba(30, 36, 74, 0.92), rgba(20, 24, 50, 0.92))"
                : "linear-gradient(180deg, rgba(255, 141, 148, 0.94), rgba(223, 92, 134, 0.94))";
            gravBtn.style.color = gravityEnabled ? "var(--text-main)" : "#fff7fb";
            showComboCaption(gravityEnabled ? 'Gravity Restored' : 'Zero-G Drift');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audioManager.pauseBgm();
            } else if (isPlaying) {
                audioManager.playBgm();
            }
        });

        init();
    });
</script>
</body>
</html>
