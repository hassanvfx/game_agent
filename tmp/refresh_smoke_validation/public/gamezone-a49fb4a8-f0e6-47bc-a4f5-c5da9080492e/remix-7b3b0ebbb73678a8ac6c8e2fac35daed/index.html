<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Escape 3D</title>
    <link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Orbitron_wght_400_700_900_display_swap.css">
    <style>
        :root {
            --bg-deep: #04030d;
            --bg-mid: #12081d;
            --panel: rgba(14, 16, 32, 0.8);
            --panel-edge: rgba(109, 235, 255, 0.28);
            --panel-glow: rgba(96, 225, 255, 0.12);
            --cyan: #77f6ff;
            --cyan-strong: #34ddff;
            --magenta: #ff4fd8;
            --magenta-strong: #ff1dc4;
            --gold: #ffe36b;
            --danger: #ff566f;
            --danger-deep: #b31f3a;
            --text: #f5fbff;
            --muted: #8ca6c7;
            --shadow: rgba(0, 0, 0, 0.55);
            --hud-text: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(120, 60, 220, 0.2), transparent 38%),
                linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* [agent-note][stage4] repaired: font-remap | action: replaced prior non-local display/ui font stack with approved local Orbitron to keep sci-fi UI stable offline */
        .font-display,
        .font-micro,
        .font-ui {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .font-micro {
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 39, 191, 0.08), transparent 30%),
                linear-gradient(180deg, #02020a 0%, #050510 100%);
            overflow: hidden;
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                linear-gradient(180deg, rgba(119, 246, 255, 0.08), transparent 28%),
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.03) 0,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 5px
                );
            mix-blend-mode: screen;
            opacity: 0.5;
        }

        .game-shell::after {
            background: radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.36) 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
        }

        .overlay-card {
            position: relative;
            width: min(100%, 22rem);
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(23, 26, 47, 0.92), rgba(10, 10, 22, 0.88));
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 18px 50px var(--shadow),
                0 0 22px var(--panel-glow),
                inset 0 0 16px rgba(255, 255, 255, 0.05);
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .overlay-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(119, 246, 255, 0.12), transparent 35%),
                linear-gradient(315deg, rgba(255, 79, 216, 0.12), transparent 40%);
            pointer-events: none;
        }

        .start-card {
            border-top: 3px solid var(--cyan-strong);
            border-bottom: 3px solid var(--magenta-strong);
        }

        .game-over-card {
            border: 2px solid rgba(255, 86, 111, 0.65);
        }

        .hidden {
            display: none !important;
        }

        .title-stack {
            margin-bottom: 10px;
            text-align: center;
        }

        .title-main {
            margin: 0;
            line-height: 0.95;
            font-size: clamp(28px, 9vw, 44px);
            letter-spacing: 0.04em;
            color: var(--text);
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.8),
                0 0 16px rgba(119, 246, 255, 0.35),
                0 0 28px rgba(255, 79, 216, 0.4);
        }

        .title-sub {
            margin: 0 0 18px;
            text-align: center;
            color: var(--cyan);
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.42), transparent 24%),
                linear-gradient(180deg, rgba(255, 79, 216, 0.18), rgba(52, 221, 255, 0.12));
            box-shadow:
                0 0 18px rgba(255, 79, 216, 0.3),
                inset 0 0 18px rgba(255, 255, 255, 0.08);
            font-size: 36px;
            animation: badgePulse 2.2s ease-in-out infinite;
        }

        .instructions {
            margin: 0 0 18px;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .instruction-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 9px 10px;
            border: 1px solid rgba(119, 246, 255, 0.12);
            background: rgba(8, 11, 25, 0.56);
            color: #d4e4f7;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .instruction-chip {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            border-radius: 4px;
            box-shadow: 0 0 10px currentColor;
        }

        .chip-cyan { color: var(--cyan-strong); background: currentColor; }
        .chip-gold { color: var(--gold); background: currentColor; }
        .chip-danger { color: var(--danger); background: currentColor; }

        .arcade-btn,
        .secondary-btn {
            width: 100%;
            min-height: 52px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        .arcade-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, var(--magenta) 0%, #881884 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 29, 196, 0.28);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 18px;
            font-weight: 700;
        }

        .arcade-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent 45%);
            pointer-events: none;
        }

        .secondary-btn {
            background: linear-gradient(180deg, #ffffff 0%, #c9d4e7 100%);
            color: #111827;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .arcade-btn:active,
        .secondary-btn:active {
            transform: scale(0.97);
            filter: brightness(0.96);
        }

        .summary-score {
            margin: 0 0 18px;
            color: var(--text);
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
        }

        .summary-score span {
            color: var(--gold);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: none;
        }

        .hud-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .hud-block:last-child {
            width: 38%;
            align-items: flex-end;
        }

        .hud-label {
            color: var(--cyan);
            font-size: 10px;
            line-height: 1.2;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(119, 246, 255, 0.35);
        }

        .hud-value {
            color: white;
            font-size: clamp(22px, 6vw, 30px);
            line-height: 1;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
        }

        .integrity-label {
            color: #ff8b9d;
            text-align: right;
        }

        .bar-container {
            width: 100%;
            height: 14px;
            overflow: hidden;
            transform: skewX(-15deg);
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.72), rgba(18, 16, 32, 0.84));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow:
                inset 0 0 12px rgba(0, 0, 0, 0.55),
                0 0 14px rgba(255, 86, 111, 0.16);
        }

        .bar-fill {
            height: 100%;
            transition: width 0.1s linear;
            background: linear-gradient(90deg, var(--danger) 0%, #ff7c54 100%);
            box-shadow: 0 0 12px rgba(255, 86, 111, 0.42);
        }

        .bar-fill.low {
            background: linear-gradient(90deg, #ff334f 0%, #ff7c54 100%);
            animation: alertPulse 0.8s infinite alternate;
        }

        .hud-panel {
            padding: 8px 10px;
            border: 1px solid rgba(119, 246, 255, 0.12);
            background: rgba(8, 12, 24, 0.46);
            box-shadow: 0 0 14px rgba(0, 0, 0, 0.26);
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: translateY(0);
                box-shadow:
                    0 0 18px rgba(255, 79, 216, 0.3),
                    inset 0 0 18px rgba(255, 255, 255, 0.08);
            }
            50% {
                transform: translateY(-2px) scale(1.02);
                box-shadow:
                    0 0 28px rgba(119, 246, 255, 0.28),
                    0 0 24px rgba(255, 79, 216, 0.35),
                    inset 0 0 22px rgba(255, 255, 255, 0.12);
            }
        }

        @keyframes alertPulse {
            from { filter: saturate(0.92) brightness(0.92); }
            to { filter: saturate(1.15) brightness(1.08); }
        }

        .feedback-gif {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: min(28vw, 118px);
            border-radius: 16px;
            border: 1px solid rgba(119, 246, 255, 0.35);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.4);
            background: rgba(5, 8, 18, 0.72);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 8;
        }

        .feedback-gif.active {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.crash {
            right: auto;
            left: 14px;
            bottom: 90px;
        }

        .feedback-gif.fail {
            width: min(34vw, 132px);
            left: 50%;
            right: auto;
            bottom: 96px;
            transform: translate(-50%, 10px) scale(0.92);
        }

        .feedback-gif.fail.active {
            transform: translate(-50%, 0) scale(1);
        }

        @media (max-width: 480px) {
            .ui-layer {
                padding: 12px;
            }

            .overlay-card {
                padding: 16px;
            }

            .instruction-row {
                font-size: 10px;
                padding: 8px 9px;
            }

            .hud {
                padding: 12px;
            }

            .hud-block:last-child {
                width: 42%;
            }

            .bar-container {
                height: 12px;
            }

            .feedback-gif {
                width: min(26vw, 92px);
                right: 10px;
                bottom: 10px;
            }

            .feedback-gif.crash {
                left: 10px;
                bottom: 82px;
            }

            .feedback-gif.fail {
                width: min(32vw, 108px);
                bottom: 92px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-card start-card">
                <div class="hero-badge" aria-hidden="true">🏎️</div>
                <div class="title-stack">
                    <h1 class="title-main font-display">NEON<br>ESCAPE 3D</h1>
                </div>
                <p class="title-sub font-ui">Infinite lane survival</p>

                <ul class="instructions font-ui">
                    <li class="instruction-row">
                        <span class="instruction-chip chip-cyan"></span>
                        <span>Drag to swerve</span>
                    </li>
                    <li class="instruction-row">
                        <span class="instruction-chip chip-gold"></span>
                        <span>Dodge rival cars</span>
                    </li>
                    <li class="instruction-row">
                        <span class="instruction-chip chip-danger"></span>
                        <span>Keep your rig intact</span>
                    </li>
                </ul>

                <button id="start-btn" class="arcade-btn">
                    <span>Start Run</span>
                </button>
            </div>

            <div id="game-over-screen" class="overlay-card game-over-card hidden">
                <h2 class="title-main font-display" style="font-size: clamp(24px, 8vw, 36px); color: #ff8b9d; margin-bottom: 12px;">RUN OVER</h2>
                <p class="summary-score font-micro">
                    ROUTE:
                    <span id="finalScore">0</span>
                    M
                </p>
                <button id="restart-btn" class="secondary-btn">
                    Retry
                </button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-block">
                    <span class="hud-label font-ui">Route</span>
                    <div class="hud-panel">
                        <span id="score" class="hud-value font-micro">0</span>
                    </div>
                </div>

                <div class="hud-block">
                    <span class="hud-label integrity-label font-ui">Rig Integrity</span>
                    <div class="bar-container">
                        <div id="health-bar" class="bar-fill" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: crash/fail feedback overlays -> catalogs/gifs.json; kept off playfield center to protect controls -->
        <img
            id="crash-gif"
            class="feedback-gif crash"
            src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            alt="Crash reaction effect"
            loading="lazy"
            decoding="async"
            aria-hidden="true"
        >
        <img
            id="fail-gif"
            class="feedback-gif fail"
            src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            alt="Run over reaction effect"
            loading="lazy"
            decoding="async"
            aria-hidden="true"
        >
    </div>

    <script>
    /**
     * HIGHWAY CRASH 3D - REMAKE
     * Pseudo-3D implementation using 2D Canvas Context
     */

    // --- ASSETS & CONFIG ---
    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
        sfx: {
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
            warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
        },
        gifs: {
            crash: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
            fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
        }
    };

    const CONFIG = {
        roadWidth: 2000,
        segmentLength: 200,
        drawDistance: 50,
        fieldOfView: 100,
        cameraHeight: 1000,
        cameraDepth: 0.8,
        lanes: 3,
        playerSpeed: 200,
        maxSpeed: 600
    };

    class AudioController {
        constructor() {
            this.bgm = new Audio(ASSETS.bgm);
            this.bgm.loop = true;
            this.bgm.volume = 0.2;
            this.bgm.preload = 'auto';
            this.sfx = {};
            this.lastPlayedAt = {};
            this.muted = false;

            for (const [key, src] of Object.entries(ASSETS.sfx)) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                this.sfx[key] = audio;
            }
        }

        unlock() {
            if (this.muted) return;
            try {
                this.bgm.load();
                Object.values(this.sfx).forEach((audio) => audio.load());
            } catch (_) {}
        }

        playBGM() {
            if (this.muted) return;
            this.bgm.play().catch(() => {});
        }

        stopBGM(reset = true) {
            this.bgm.pause();
            if (reset) {
                this.bgm.currentTime = 0;
            }
        }

        playSFX(key, { volume = 0.55, debounce = 0 } = {}) {
            if (this.muted || !this.sfx[key]) return;

            const now = performance.now();
            if (debounce > 0 && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounce) {
                return;
            }
            this.lastPlayedAt[key] = now;

            const sample = this.sfx[key].cloneNode();
            sample.volume = volume;
            sample.play().catch(() => {});
        }
    }
    const audio = new AudioController();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width, height;
    let gameActive = false;
    let lastTime = 0;

    let playerX = 0;
    let playerZ = 0;
    let playerHealth = 100;
    let speed = 0;
    let score = 0;

    let segments = [];
    let cars = [];
    let particles = [];
    let screenShake = 0;
    let warningTriggered = false;
    let gifTimers = {};

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
        const cx = p.x - cameraX;
        const cy = p.y - cameraY;
        const cz = p.z - cameraZ;

        if (cz < 1) return { x: 0, y: 0, w: 0, scale: 0, visible: false };

        const scale = cameraDepth / cz;
        const x = Math.round((width / 2) + (cx * scale * width / 2));
        const y = Math.round((height / 2) - (cy * scale * width / 2));
        const w = Math.round((p.w * scale * width / 2));

        return { x, y, w, scale, visible: true };
    }

    class Car {
        constructor(z, lane) {
            this.z = z;
            this.x = (lane - 1) * 0.7 * CONFIG.roadWidth;
            this.y = 0;
            this.w = 300;
            this.h = 250;
            this.l = 400;

            this.speed = CONFIG.playerSpeed * (0.3 + Math.random() * 0.4);
            this.colorBody = ['#ff5fd0', '#33f2ff', '#ffe56b', '#8a7cff'][Math.floor(Math.random() * 4)];
            this.active = true;
            this.damaged = false;
        }

        update(dt, playerSpeed) {
            this.z += this.speed * dt;
        }

        draw(ctx, camX, camY, camZ) {
            const wx = this.x;
            const wy = this.y;
            const wz = this.z;

            const dw = this.w / 2;
            const dh = this.h;
            const dl = this.l;

            const rbl = { x: wx - dw, y: wy, z: wz };
            const rbr = { x: wx + dw, y: wy, z: wz };
            const rtl = { x: wx - dw, y: wy + dh, z: wz };
            const rtr = { x: wx + dw, y: wy + dh, z: wz };
            const ftl = { x: wx - dw, y: wy + dh, z: wz + dl };
            const ftr = { x: wx + dw, y: wy + dh, z: wz + dl };

            const p_rbl = project(rbl, camX, camY, camZ, CONFIG.cameraDepth);
            const p_rbr = project(rbr, camX, camY, camZ, CONFIG.cameraDepth);
            const p_rtl = project(rtl, camX, camY, camZ, CONFIG.cameraDepth);
            const p_rtr = project(rtr, camX, camY, camZ, CONFIG.cameraDepth);
            const p_ftl = project(ftl, camX, camY, camZ, CONFIG.cameraDepth);
            const p_ftr = project(ftr, camX, camY, camZ, CONFIG.cameraDepth);

            if (!p_rbl.visible) return;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.46)';
            ctx.beginPath();
            ctx.moveTo(p_rbl.x, p_rbl.y);
            ctx.lineTo(p_rbr.x, p_rbr.y);
            ctx.lineTo(p_ftr.x, p_ftr.y);
            ctx.lineTo(p_ftl.x, p_ftl.y);
            ctx.fill();

            const col = this.damaged ? '#5e5b6d' : this.colorBody;

            if (wx > camX) {
                ctx.fillStyle = shadeColor(col, -30);
                ctx.beginPath();
                ctx.moveTo(p_rbl.x, p_rbl.y);
                ctx.lineTo(p_rtl.x, p_rtl.y);
                ctx.lineTo(p_ftl.x, p_ftl.y);
                const fbl = { x: wx - dw, y: wy, z: wz + dl };
                const p_fbl = project(fbl, camX, camY, camZ, CONFIG.cameraDepth);
                ctx.lineTo(p_fbl.x, p_fbl.y);
                ctx.fill();
            } else {
                ctx.fillStyle = shadeColor(col, -30);
                const fbr = { x: wx + dw, y: wy, z: wz + dl };
                const p_fbr = project(fbr, camX, camY, camZ, CONFIG.cameraDepth);
                ctx.beginPath();
                ctx.moveTo(p_rbr.x, p_rbr.y);
                ctx.lineTo(p_rtr.x, p_rtr.y);
                ctx.lineTo(p_ftr.x, p_ftr.y);
                ctx.lineTo(p_fbr.x, p_fbr.y);
                ctx.fill();
            }

            ctx.fillStyle = shadeColor(col, 18);
            ctx.beginPath();
            ctx.moveTo(p_rtl.x, p_rtl.y);
            ctx.lineTo(p_rtr.x, p_rtr.y);
            ctx.lineTo(p_ftr.x, p_ftr.y);
            ctx.lineTo(p_ftl.x, p_ftl.y);
            ctx.fill();

            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(p_rbl.x, p_rbl.y);
            ctx.lineTo(p_rbr.x, p_rbr.y);
            ctx.lineTo(p_rtr.x, p_rtr.y);
            ctx.lineTo(p_rtl.x, p_rtl.y);
            ctx.fill();

            const w = p_rbr.x - p_rbl.x;
            const h = p_rbl.y - p_rtl.y;
            const padX = w * 0.1;
            const padY = h * 0.2;
            const lightW = w * 0.25;
            const lightH = h * 0.2;

            ctx.fillStyle = '#ff4965';
            ctx.shadowColor = '#ff4965';
            ctx.shadowBlur = 12;
            ctx.fillRect(p_rbl.x + padX, p_rtl.y + padY, lightW, lightH);
            ctx.fillRect(p_rbr.x - padX - lightW, p_rtl.y + padY, lightW, lightH);
            ctx.shadowBlur = 0;

            const emblemW = w * 0.18;
            const emblemH = Math.max(2, h * 0.07);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(p_rbl.x + (w - emblemW) / 2, p_rtl.y + h * 0.46, emblemW, emblemH);
        }
    }

    class Particle {
        constructor(x, y, z, color) {
            this.x = x;
            this.y = y;
            this.z = z;
            this.vx = (Math.random() - 0.5) * 500;
            this.vy = Math.random() * 500;
            this.vz = Math.random() * 500;
            this.color = color;
            this.life = 1.0;
        }
        update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.z += this.vz * dt;
            this.life -= dt * 2;
        }
        draw(ctx, camX, camY, camZ) {
            const p = project({ x: this.x, y: this.y, z: this.z, w: 20 }, camX, camY, camZ, CONFIG.cameraDepth);
            if (p.visible && p.scale > 0) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                const size = Math.max(2, 50 * p.scale);
                ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
                ctx.globalAlpha = 1.0;
            }
        }
    }

    function shadeColor(color, percent) {
        let R = parseInt(color.substring(1, 3), 16);
        let G = parseInt(color.substring(3, 5), 16);
        let B = parseInt(color.substring(5, 7), 16);

        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);

        R = (R < 255) ? R : 255;
        G = (G < 255) ? G : 255;
        B = (B < 255) ? B : 255;

        const RR = ((R.toString(16).length === 1) ? "0" + R.toString(16) : R.toString(16));
        const GG = ((G.toString(16).length === 1) ? "0" + G.toString(16) : G.toString(16));
        const BB = ((B.toString(16).length === 1) ? "0" + B.toString(16) : B.toString(16));

        return "#" + RR + GG + BB;
    }

    function setFeedbackVisible(id, visible) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('active', visible);
    }

    function triggerGif(key, duration = 900) {
        const id = `${key}-gif`;
        setFeedbackVisible(id, true);
        clearTimeout(gifTimers[id]);
        gifTimers[id] = setTimeout(() => setFeedbackVisible(id, false), duration);
    }

    function hideAllFeedback() {
        setFeedbackVisible('crash-gif', false);
        setFeedbackVisible('fail-gif', false);
    }

    function resetGame() {
        playerZ = 0;
        playerX = 0;
        score = 0;
        speed = CONFIG.playerSpeed;
        playerHealth = 100;
        cars = [];
        particles = [];
        screenShake = 0;
        warningTriggered = false;
        hideAllFeedback();

        for (let i = 0; i < 5; i++) {
            spawnEnemy(1000 + i * 1500);
        }

        updateHealthUI();
    }

    function spawnEnemy(zOffset) {
        const lane = Math.floor(Math.random() * 3);
        const z = (zOffset || (playerZ + CONFIG.drawDistance * CONFIG.segmentLength));

        const tooClose = cars.some(c => Math.abs(c.z - z) < 600);
        if (!tooClose) {
            cars.push(new Car(z, lane));
        }
    }

    function updateHealthUI() {
        const bar = document.getElementById('health-bar');
        bar.style.width = `${Math.max(0, playerHealth)}%`;

        if (playerHealth < 30) {
            bar.className = "bar-fill low";
            if (!warningTriggered && gameActive) {
                warningTriggered = true;
                audio.playSFX('warning', { volume: 0.5, debounce: 800 });
            }
        } else {
            bar.className = "bar-fill";
            warningTriggered = false;
        }
    }

    function update(dt) {
        if (!gameActive) return;

        const targetSpeed = CONFIG.maxSpeed * (1 + score / 10000);
        if (speed < targetSpeed) speed += dt * 10;

        playerZ += speed * dt;
        score += speed * dt * 0.01;
        document.getElementById('score').innerText = Math.floor(score);

        playerX = Math.max(-1, Math.min(1, playerX));

        if (screenShake > 0) screenShake -= dt * 20;
        if (screenShake < 0) screenShake = 0;

        if (Math.random() < 0.05) {
            spawnEnemy(playerZ + 8000 + Math.random() * 2000);
        }

        for (let i = cars.length - 1; i >= 0; i--) {
            let c = cars[i];
            c.update(dt, speed);

            if (c.z < playerZ - 500) {
                cars.splice(i, 1);
                continue;
            }

            const pWidth = 250;
            const pLength = 380;
            const pWX = playerX * CONFIG.roadWidth * 0.8;

            if (c.active && Math.abs(c.z - playerZ) < (c.l + pLength) / 2) {
                if (Math.abs(c.x - pWX) < (c.w + pWidth) / 2) {
                    handleCrash(c);
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    function handleCrash(enemy) {
        audio.playSFX('crash', { volume: 0.62, debounce: 140 });
        triggerGif('crash', 850);
        enemy.active = false;
        enemy.damaged = true;

        const pWX = playerX * CONFIG.roadWidth * 0.8;
        if (pWX < enemy.x) enemy.x += 200; else enemy.x -= 200;
        enemy.z += 200;

        screenShake = 20;
        playerHealth -= 25;
        updateHealthUI();

        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(enemy.x, 50, enemy.z, '#ffe36b'));
            particles.push(new Particle(enemy.x, 50, enemy.z, '#5e5b6d'));
        }

        if (playerHealth <= 0) {
            gameOver();
        }
    }

    function drawPlayerVehicle(camX, camY, camZ) {
        const p = {
            x: playerX * CONFIG.roadWidth * 0.8,
            y: 0,
            z: playerZ,
            w: 300,
            h: 220,
            l: 400
        };

        const dummy = new Car(0, 0);
        Object.assign(dummy, p, { colorBody: '#ff4fd8', damaged: false });
        dummy.draw(ctx, camX, camY, camZ);

        const rear = project({ x: p.x, y: 160, z: p.z + 30, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
        if (rear.visible) {
            const auraRadius = Math.max(12, 140 * rear.scale);
            const aura = ctx.createRadialGradient(rear.x, rear.y, 0, rear.x, rear.y, auraRadius);
            aura.addColorStop(0, 'rgba(119, 246, 255, 0.55)');
            aura.addColorStop(0.45, 'rgba(255, 79, 216, 0.22)');
            aura.addColorStop(1, 'rgba(255, 79, 216, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(rear.x, rear.y, auraRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.fillRect(rear.x - auraRadius * 0.12, rear.y - auraRadius * 0.42, auraRadius * 0.24, Math.max(2, auraRadius * 0.14));
        }
    }

    function draw() {
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, width, height);

        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;

        ctx.save();
        ctx.translate(sx, sy);

        const skyGrad = ctx.createLinearGradient(0, 0, 0, height / 2);
        skyGrad.addColorStop(0, '#05071d');
        skyGrad.addColorStop(0.5, '#190d30');
        skyGrad.addColorStop(1, '#2e1240');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height / 2);

        const sunX = width / 2;
        const sunY = height / 2 - 54;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 96);
        sunGlow.addColorStop(0, 'rgba(255, 227, 107, 0.88)');
        sunGlow.addColorStop(0.45, 'rgba(255, 79, 216, 0.58)');
        sunGlow.addColorStop(1, 'rgba(255, 79, 216, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 96, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff5fd0';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 58, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = '#281039';
            ctx.fillRect(sunX - 70, sunY - 46 + (i * 15), 140, 5);
        }

        const camX = playerX * CONFIG.roadWidth * 0.5;
        const camY = CONFIG.cameraHeight;
        const camZ = playerZ - 500;

        const startPos = Math.floor(camZ / CONFIG.segmentLength);
        const endPos = startPos + CONFIG.drawDistance;

        for (let n = endPos; n >= startPos; n--) {
            const z1 = n * CONFIG.segmentLength;
            const z2 = (n + 1) * CONFIG.segmentLength;

            const p1 = project({ x: -CONFIG.roadWidth, y: 0, z: z1, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
            const p2 = project({ x: CONFIG.roadWidth, y: 0, z: z1, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
            const p3 = project({ x: CONFIG.roadWidth, y: 0, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
            const p4 = project({ x: -CONFIG.roadWidth, y: 0, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);

            if (!p1.visible || !p3.visible) continue;

            const isDark = n % 2 === 0;
            const colorRoad = isDark ? '#181726' : '#211e31';
            const colorGrass = isDark ? '#090d19' : '#0f1425';

            ctx.fillStyle = colorGrass;
            ctx.fillRect(0, p3.y, width, p1.y - p3.y);

            const edgeGlow = ctx.createLinearGradient(0, p3.y, 0, p1.y);
            edgeGlow.addColorStop(0, 'rgba(52, 221, 255, 0.04)');
            edgeGlow.addColorStop(1, 'rgba(255, 79, 216, 0.1)');
            ctx.fillStyle = edgeGlow;
            ctx.fillRect(0, p3.y, width, p1.y - p3.y);

            ctx.fillStyle = colorRoad;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.fill();

            ctx.strokeStyle = isDark ? 'rgba(119, 246, 255, 0.58)' : 'rgba(255, 79, 216, 0.42)';
            ctx.lineWidth = Math.max(1, 3 * p1.scale * 10);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.moveTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.stroke();

            if (isDark) {
                const d1_p1 = project({ x: -CONFIG.roadWidth * 0.33, y: 0, z: z1, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
                const d1_p2 = project({ x: -CONFIG.roadWidth * 0.33, y: 0, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
                const d2_p1 = project({ x: CONFIG.roadWidth * 0.33, y: 0, z: z1, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
                const d2_p2 = project({ x: CONFIG.roadWidth * 0.33, y: 0, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);

                ctx.lineWidth = Math.max(1, 2 * p1.scale * 10);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
                ctx.beginPath();
                ctx.moveTo(d1_p1.x, d1_p1.y);
                ctx.lineTo(d1_p2.x, d1_p2.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(d2_p1.x, d2_p1.y);
                ctx.lineTo(d2_p2.x, d2_p2.y);
                ctx.stroke();
            }

            if (n % 3 === 0) {
                const leftRail = project({ x: -CONFIG.roadWidth * 1.1, y: 120, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
                const rightRail = project({ x: CONFIG.roadWidth * 1.1, y: 120, z: z2, w: 0 }, camX, camY, camZ, CONFIG.cameraDepth);
                if (leftRail.visible && rightRail.visible) {
                    ctx.fillStyle = 'rgba(119, 246, 255, 0.22)';
                    const postW = Math.max(2, 24 * leftRail.scale);
                    const postH = Math.max(6, 90 * leftRail.scale);
                    ctx.fillRect(leftRail.x - postW / 2, leftRail.y - postH, postW, postH);
                    ctx.fillStyle = 'rgba(255, 79, 216, 0.22)';
                    ctx.fillRect(rightRail.x - postW / 2, rightRail.y - postH, postW, postH);
                }
            }
        }

        let renderList = [];

        cars.forEach(c => {
            if (c.z > camZ + 10) renderList.push({ type: 'car', obj: c, z: c.z });
        });

        renderList.push({
            type: 'player',
            z: playerZ
        });

        particles.forEach(p => {
            if (p.z > camZ + 10) renderList.push({ type: 'particle', obj: p, z: p.z });
        });

        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            if (item.type === 'car') {
                item.obj.draw(ctx, camX, camY, camZ);
            } else if (item.type === 'player') {
                drawPlayerVehicle(camX, camY, camZ);
            } else if (item.type === 'particle') {
                item.obj.draw(ctx, camX, camY, camZ);
            }
        });

        ctx.restore();
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;

        update(dt);
        draw();

        if (gameActive) requestAnimationFrame(loop);
    }

    function gameOver() {
        gameActive = false;
        audio.stopBGM();
        audio.playSFX('fail', { volume: 0.58, debounce: 300 });
        triggerGif('fail', 1800);
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = Math.floor(score);
    }

    function handleInput(x) {
        if (!gameActive) return;
        const norm = (x / width) * 2 - 1;
        const target = Math.max(-1.2, Math.min(1.2, norm * 1.5));
        playerX += (target - playerX) * 0.2;
    }

    // [agent-note][stage4] repaired: mobile-action-path | action: restrict gesture prevention to canvas during active play so overlay buttons keep native tap/click behavior
    canvas.addEventListener('touchmove', (e) => {
        if (!gameActive || !e.touches.length) return;
        e.preventDefault();
        handleInput(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener('mousemove', (e) => {
        if (e.buttons === 1) handleInput(e.clientX);
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('start', { volume: 0.46, debounce: 300 });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        gameActive = true;
        resetGame();
        audio.playBGM();
        lastTime = 0;
        requestAnimationFrame(loop);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.unlock();
        audio.playSFX('restart', { volume: 0.44, debounce: 300 });
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        gameActive = true;
        resetGame();
        audio.playBGM();
        lastTime = 0;
        requestAnimationFrame(loop);
    });

    draw();
    </script>
</body>
