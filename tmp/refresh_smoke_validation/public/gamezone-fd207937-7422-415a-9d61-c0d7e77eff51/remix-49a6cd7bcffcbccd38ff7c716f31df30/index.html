<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Storm Corridor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: rgba(7, 16, 34, 0.84);
            --panel-border: rgba(125, 211, 252, 0.32);
            --text-main: #f8fbff;
            --text-muted: rgba(219, 234, 254, 0.78);
            --accent: #7dd3fc;
            --accent-strong: #38bdf8;
            --accent-warm: #facc15;
            --danger: #fb7185;
            --button-bg: linear-gradient(135deg, #0ea5e9, #2563eb);
            --button-bg-hover: linear-gradient(135deg, #38bdf8, #3b82f6);
            --shadow-blue: rgba(14, 165, 233, 0.38);
            --storm-top: #081120;
            --storm-bottom: #152a4b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.16), transparent 30%),
                linear-gradient(180deg, var(--storm-top), var(--storm-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-root {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .screen-root::before,
        .screen-root::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .screen-root::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(125, 211, 252, 0.2), transparent 24%),
                radial-gradient(circle at 78% 26%, rgba(250, 204, 21, 0.16), transparent 16%),
                linear-gradient(120deg, transparent 0 35%, rgba(148, 163, 184, 0.08) 48%, transparent 58% 100%);
            opacity: 0.9;
        }

        .screen-root::after {
            background:
                repeating-linear-gradient(90deg, rgba(148, 163, 184, 0.05) 0 1px, transparent 1px 70px),
                repeating-linear-gradient(180deg, rgba(148, 163, 184, 0.04) 0 1px, transparent 1px 70px);
            mix-blend-mode: screen;
            opacity: 0.28;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay-card {
            pointer-events: auto;
            width: min(92vw, 480px);
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(10, 22, 44, 0.94), rgba(12, 25, 48, 0.84)),
                var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 40px rgba(2, 8, 23, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 28px rgba(56, 189, 248, 0.12);
            z-index: 50;
        }

        .title-font {
            font-family: 'Audiowide', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .hero-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2.6rem, 8vw, 4.7rem);
            line-height: 0.95;
            color: var(--accent);
            text-shadow:
                0 0 22px rgba(125, 211, 252, 0.24),
                0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .hero-subtitle {
            margin: 0 0 1.2rem;
            font-size: clamp(1rem, 3.5vw, 1.45rem);
            font-weight: 700;
            color: rgba(226, 232, 240, 0.92);
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }

        .helper-text {
            margin: 0 0 1.8rem;
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--text-muted);
            animation: pulse 1.6s infinite;
        }

        .instruction-block {
            margin: 0 0 1.4rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            line-height: 1.35;
        }

        .action-button {
            border: 1px solid rgba(186, 230, 253, 0.6);
            border-radius: 999px;
            padding: 0.95rem 2rem;
            font: 700 1rem/1 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: white;
            background: var(--button-bg);
            box-shadow:
                0 0 20px var(--shadow-blue),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .action-button:hover,
        .action-button:focus-visible {
            background: var(--button-bg-hover);
            transform: translateY(-2px);
            box-shadow:
                0 0 26px rgba(56, 189, 248, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .action-button.secondary {
            background: linear-gradient(135deg, #e2e8f0, #ffffff);
            color: #0f172a;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
        }

        .action-button.secondary:hover,
        .action-button.secondary:focus-visible {
            background: #e5e7eb;
        }

        .hidden {
            display: none !important;
        }

        .game-over-title {
            margin: 0 0 1rem;
            font-size: clamp(2.7rem, 7vw, 4rem);
            color: var(--danger);
        }

        .result-row {
            margin-bottom: 0.35rem;
            font-size: 1.8rem;
            color: white;
        }

        .result-label {
            color: rgba(255, 255, 255, 0.82);
        }

        .result-value {
            color: var(--accent);
            font-weight: 700;
        }

        .best-row {
            margin-bottom: 1.7rem;
            color: #94a3b8;
            font-size: 1rem;
        }

        .hud {
            position: absolute;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            min-width: min(50vw, 260px);
            padding: 0.45rem 0.9rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(125, 211, 252, 0.4);
            background: linear-gradient(180deg, rgba(8, 18, 38, 0.8), rgba(8, 18, 38, 0.48));
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.1rem);
            font-weight: 700;
            color: white;
            text-align: center;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
            box-shadow: 0 10px 30px rgba(2, 8, 23, 0.3);
        }

        .hud-label {
            display: block;
            margin-bottom: 0.15rem;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            text-transform: uppercase;
        }

        .feedback-gif {
            position: absolute;
            z-index: 30;
            right: clamp(0.5rem, 2vw, 1.2rem);
            bottom: clamp(0.75rem, 3vw, 1.4rem);
            width: min(30vw, 130px);
            border-radius: 1rem;
            border: 1px solid rgba(125, 211, 252, 0.38);
            background: rgba(4, 10, 24, 0.7);
            box-shadow: 0 14px 30px rgba(2, 8, 23, 0.45);
            overflow: hidden;
            opacity: 0;
            transform: translateY(18px) scale(0.9);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-gif.score {
            bottom: clamp(5.5rem, 12vw, 7rem);
            right: clamp(0.5rem, 2vw, 1.25rem);
        }

        .feedback-caption {
            padding: 0.35rem 0.55rem 0.45rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 0.62rem;
            line-height: 1.2;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(248, 250, 252, 0.9);
            background: linear-gradient(180deg, rgba(10, 22, 44, 0.84), rgba(10, 22, 44, 0.62));
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        @media (max-width: 640px) {
            .overlay-card {
                padding: 1.5rem 1.25rem;
                border-radius: 1.25rem;
            }

            .hero-subtitle {
                letter-spacing: 0.18em;
            }

            .instruction-block {
                font-size: 0.96rem;
            }

            .action-button {
                width: 100%;
            }

            .hud {
                top: max(0.75rem, env(safe-area-inset-top));
                min-width: 150px;
                padding: 0.4rem 0.8rem 0.5rem;
                font-size: clamp(1.75rem, 9vw, 2.35rem);
            }

            .hud-label {
                font-size: 0.7rem;
                letter-spacing: 0.22em;
            }

            .feedback-gif {
                width: min(34vw, 108px);
                bottom: calc(max(0.75rem, env(safe-area-inset-bottom)) + 0.4rem);
            }

            .feedback-gif.score {
                bottom: clamp(4.8rem, 16vw, 5.8rem);
            }

            .feedback-caption {
                font-size: 0.52rem;
                letter-spacing: 0.12em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="screen-root">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="overlay-card">
                <h1 class="hero-title title-font">Storm Corridor</h1>
                <h2 class="hero-subtitle">Neon Courier Run</h2>
                <p class="instruction-block">Guide the courier drone through storm gates. Tap, click, Space, or ↑ to boost upward.</p>
                <p class="helper-text">Thread the lightning lanes as long as you can.</p>
                <button id="start-btn" class="action-button">Start Run</button>
            </div>

            <div id="game-over-screen" class="hidden overlay-card">
                <h2 class="game-over-title title-font">Signal Lost</h2>
                <div class="result-row"><span class="result-label">Gates Cleared:</span> <span id="finalScore" class="result-value">0</span></div>
                <div class="best-row">Best Route: <span id="bestScore">0</span></div>
                <button id="restart-btn" class="action-button secondary">Fly Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <span class="hud-label">Gates</span>
                <span id="score">0</span>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: score-surge + crash-feedback -> catalogs/gifs.json | keep off playfield -->
        <div id="score-gif" class="feedback-gif score hidden" aria-hidden="true">
            <img src="https://i.giphy.com/1zmG8avB83Uvm.webp" alt="Storm charge effect">
            <div class="feedback-caption">Gate Surge</div>
        </div>

        <div id="fail-gif" class="feedback-gif hidden" aria-hidden="true">
            <img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Arcade explosion effect">
            <div class="feedback-caption">Hull Breach</div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                flap: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                boost: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            images: {
                courier: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png",
                gate: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png",
                bg: "https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayedAt = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            }

            async unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach((audio) => audio.load());
                } catch (_) {}
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume = 0.65, debounceMs = 0 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;

                const now = performance.now();
                if (debounceMs && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) {
                    return;
                }
                this.lastPlayedAt[key] = now;

                try {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = volume;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const scoreNode = document.getElementById('score');
        const finalScoreNode = document.getElementById('finalScore');
        const bestScoreNode = document.getElementById('bestScore');
        const scoreGif = document.getElementById('score-gif');
        const failGif = document.getElementById('fail-gif');

        let scoreGifTimer = null;
        let failGifTimer = null;

        function showGif(node, duration = 1400) {
            if (!node) return;
            node.classList.remove('hidden');
            requestAnimationFrame(() => node.classList.add('visible'));
            const timerKey = node === scoreGif ? 'score' : 'fail';
            if (timerKey === 'score' && scoreGifTimer) clearTimeout(scoreGifTimer);
            if (timerKey === 'fail' && failGifTimer) clearTimeout(failGifTimer);

            const timeoutId = setTimeout(() => {
                node.classList.remove('visible');
                setTimeout(() => node.classList.add('hidden'), 220);
            }, duration);

            if (timerKey === 'score') scoreGifTimer = timeoutId;
            if (timerKey === 'fail') failGifTimer = timeoutId;
        }

        function hideFeedback() {
            [scoreGif, failGif].forEach((node) => {
                node.classList.remove('visible');
                node.classList.add('hidden');
            });
            if (scoreGifTimer) clearTimeout(scoreGifTimer);
            if (failGifTimer) clearTimeout(failGifTimer);
        }

        // Image Objects
        const imgCourier = new Image(); imgCourier.src = ASSETS.images.courier;
        const imgGate = new Image(); imgGate.src = ASSETS.images.gate;
        const imgBg = new Image(); imgBg.src = ASSETS.images.bg;

        let width, height;
        let gameActive = false;
        let frames = 0;
        let score = 0;
        let bestScore = localStorage.getItem('storm_corridor_best') || 0;
        bestScoreNode.innerText = bestScore;

        // Courier State
        // [agent-note][stage2] visual-intent: neon courier silhouette and storm-lane hazards | scope: canvas-only styling, gameplay preserved
        let bird = {
            x: 50,
            y: 150,
            w: 60,
            h: 30,
            velocity: 0,
            gravity: 0.25,
            jump: -4.6,
            rotation: 0
        };

        // Gate State
        let pipes = [];
        const pipeWidth = 70;
        const pipeGap = 160;
        const pipeSpawnRate = 120;

        // Background State
        let bgX = 0;
        const bgSpeed = 1.5;

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            bird.x = width * 0.2;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GAME LOGIC */
        function initGame() {
            score = 0;
            frames = 0;
            pipes = [];
            bird.y = height / 2;
            bird.velocity = 0;
            bird.rotation = 0;
            scoreNode.innerText = score;
            hideFeedback();
        }

        function update() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.velocity < 0) {
                bird.rotation = Math.max(-0.5, bird.rotation - 0.1);
            } else {
                bird.rotation = Math.min(0.5, bird.rotation + 0.05);
            }

            if (bird.y + bird.h >= height || bird.y <= 0) {
                gameOver();
                return;
            }

            if (frames % pipeSpawnRate === 0) {
                const minPipeLen = 50;
                const maxPos = height - pipeGap - minPipeLen;
                const topHeight = Math.floor(Math.random() * (maxPos - minPipeLen + 1) + minPipeLen);

                pipes.push({
                    x: width,
                    topHeight: topHeight,
                    passed: false
                });
            }

            for (let i = 0; i < pipes.length; i++) {
                const p = pipes[i];
                p.x -= 2.5;

                if (
                    bird.x + bird.w - 5 > p.x &&
                    bird.x + 5 < p.x + pipeWidth &&
                    bird.y + 5 < p.topHeight
                ) {
                    gameOver();
                    return;
                }

                if (
                    bird.x + bird.w - 5 > p.x &&
                    bird.x + 5 < p.x + pipeWidth &&
                    bird.y + bird.h - 5 > p.topHeight + pipeGap
                ) {
                    gameOver();
                    return;
                }

                if (p.x + pipeWidth < bird.x && !p.passed) {
                    score++;
                    p.passed = true;
                    scoreNode.innerText = score;
                    audio.playSFX('score', { volume: 0.6, debounceMs: 70 });

                    if (score % 5 === 0) {
                        audio.playSFX('boost', { volume: 0.68, debounceMs: 200 });
                        showGif(scoreGif, 1350);
                    }
                }

                if (p.x + pipeWidth < 0) {
                    pipes.shift();
                    i--;
                }
            }

            bgX -= bgSpeed;
            if (bgX <= -width) bgX = 0;

            frames++;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (imgBg.complete) {
                ctx.drawImage(imgBg, bgX, 0, width, height);
                ctx.drawImage(imgBg, bgX + width, 0, width, height);
            } else {
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 0, width, height);
            }

            ctx.fillStyle = "rgba(6, 12, 24, 0.34)";
            ctx.fillRect(0, 0, width, height);
            const horizonGlow = ctx.createLinearGradient(0, 0, 0, height);
            horizonGlow.addColorStop(0, "rgba(56, 189, 248, 0.08)");
            horizonGlow.addColorStop(0.55, "rgba(15, 23, 42, 0)");
            horizonGlow.addColorStop(1, "rgba(250, 204, 21, 0.1)");
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, width, height);

            for (const p of pipes) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(p.x, 0, pipeWidth, p.topHeight);
                ctx.clip();
                if (imgGate.complete) {
                    const segment = 80;
                    for (let y = p.topHeight - segment; y > -segment; y -= segment) {
                        ctx.drawImage(imgGate, p.x, y, pipeWidth, segment);
                    }
                } else {
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                }
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.rect(p.x, p.topHeight + pipeGap, pipeWidth, height - (p.topHeight + pipeGap));
                ctx.clip();
                if (imgGate.complete) {
                    const segment = 80;
                    for (let y = p.topHeight + pipeGap; y < height + segment; y += segment) {
                        ctx.drawImage(imgGate, p.x, y, pipeWidth, segment);
                    }
                } else {
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(p.x, p.topHeight + pipeGap, pipeWidth, height);
                }
                ctx.restore();

                const pipeGradientTop = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                pipeGradientTop.addColorStop(0, "rgba(14, 165, 233, 0.3)");
                pipeGradientTop.addColorStop(1, "rgba(250, 204, 21, 0.24)");
                ctx.fillStyle = pipeGradientTop;
                ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.fillRect(p.x, p.topHeight + pipeGap, pipeWidth, height - (p.topHeight + pipeGap));

                ctx.strokeStyle = "rgba(224, 242, 254, 0.9)";
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.strokeRect(p.x, p.topHeight + pipeGap, pipeWidth, height - (p.topHeight + pipeGap));

                ctx.strokeStyle = "rgba(125, 211, 252, 0.3)";
                ctx.lineWidth = 6;
                ctx.strokeRect(p.x + 3, 0, pipeWidth - 6, p.topHeight);
                ctx.strokeRect(p.x + 3, p.topHeight + pipeGap, pipeWidth - 6, height - (p.topHeight + pipeGap));
            }

            ctx.save();
            ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
            ctx.rotate(bird.rotation);

            ctx.shadowColor = "rgba(125, 211, 252, 0.45)";
            ctx.shadowBlur = 18;
            if (imgCourier.complete) {
                ctx.drawImage(imgCourier, -bird.w / 2, -bird.h / 2, bird.w, bird.h);
            } else {
                ctx.fillStyle = "#e0f2fe";
                ctx.fillRect(-bird.w / 2, -bird.h / 2, bird.w, bird.h);
            }
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(250, 204, 21, 0.8)";
            ctx.beginPath();
            ctx.arc(-bird.w * 0.15, -bird.h * 0.12, Math.max(2, bird.h * 0.08), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.beginPath();
            ctx.arc(bird.w * 0.18, 0, Math.max(4, bird.h * 0.18), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#082f49";
            ctx.beginPath();
            ctx.arc(bird.w * 0.2, 0, Math.max(2, bird.h * 0.08), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(56, 189, 248, 0.65)";
            ctx.fillRect(-bird.w * 0.5, bird.h * 0.1, bird.w * 0.92, Math.max(4, bird.h * 0.16));
            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.72, debounceMs: 200 });
            showGif(failGif, 1900);

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('storm_corridor_best', bestScore);
                bestScoreNode.innerText = bestScore;
            }

            finalScoreNode.innerText = score;
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        function flap() {
            if (!gameActive) return;
            bird.velocity = bird.jump;
            audio.playSFX('flap', { volume: 0.34, debounceMs: 90 });
        }

        function beginRun() {
            audio.playSFX('start', { volume: 0.62, debounceMs: 120 });
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            gameLoop();
        }

        /** 5. CONTROLS */
        // [agent-note][stage4] repaired: mobile-tap-risk | action: keep gesture suppression on gameplay surface, not whole UI
        canvas.addEventListener('mousedown', () => {
            if (gameActive) flap();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameActive) {
                e.preventDefault();
                flap();
            }
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameActive) {
                    flap();
                }
            }
        });

        document.getElementById('start-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            await audio.unlock();
            audio.playSFX('click', { volume: 0.5, debounceMs: 60 });
            beginRun();
        });

        document.getElementById('restart-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            await audio.unlock();
            audio.playSFX('click', { volume: 0.5, debounceMs: 60 });
            beginRun();
        });

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });
    </script>
</body>
</html>
