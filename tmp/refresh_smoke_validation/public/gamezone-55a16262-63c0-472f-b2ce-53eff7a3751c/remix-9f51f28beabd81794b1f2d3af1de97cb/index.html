<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Temple Courier: Easy Route</title>
    <!-- [agent-note][stage3] resolved-font: title/ui/accent -> catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Press+Start+2P&family=Bangers&display=swap">

    <style>
        :root {
            --font-title: 'Cinzel', serif;
            --font-ui: 'Press Start 2P', system-ui, sans-serif;
            --font-accent: 'Bangers', 'Press Start 2P', system-ui, sans-serif;
            --sky-top: #09111f;
            --sky-mid: #102238;
            --sky-bottom: #27412b;
            --panel-top: rgba(54, 103, 64, 0.92);
            --panel-bottom: rgba(20, 48, 27, 0.96);
            --panel-border: #d8b15f;
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #f8f1d4;
            --text-soft: rgba(244, 234, 194, 0.82);
            --gold: #f3c863;
            --gold-deep: #b77422;
            --jade: #82d98c;
            --jade-deep: #0f5132;
            --danger: #9e2f26;
            --danger-bright: #ff7357;
            --safe: #7ede76;
            --control-glow: rgba(242, 199, 99, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 217, 125, 0.15), transparent 28%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
            color: var(--text-main);
            font-family: var(--font-ui);
            touch-action: manipulation;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        h1,
        h2 {
            margin: 0;
            font-family: var(--font-title);
            letter-spacing: 0.08em;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.34);
        }

        button {
            border: 0;
            padding: 0;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 1rem;
            line-height: 1.1;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 214, 110, 0.08), transparent 0 20%),
                radial-gradient(circle at 85% 18%, rgba(162, 255, 176, 0.09), transparent 0 18%),
                linear-gradient(180deg, transparent 0%, rgba(5, 12, 17, 0.22) 100%);
            z-index: 0;
        }

        .hidden {
            display: none !important;
        }

        .overlay-root {
            position: absolute;
            z-index: 3;
        }

        .ui-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(133, 179, 95, 0.16), transparent 18%),
                linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
            border: 3px solid var(--panel-border);
            border-radius: 22px;
            box-shadow:
                inset 0 0 0 2px rgba(255, 236, 191, 0.15),
                0 10px 0 rgba(61, 38, 9, 0.7),
                0 18px 24px var(--panel-shadow);
            color: var(--text-main);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
        }

        .ui-panel::after {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(255, 241, 207, 0.14);
            border-radius: 16px;
            pointer-events: none;
        }

        .btn-action {
            min-height: 64px;
            background: linear-gradient(180deg, #ffe083 0%, var(--gold) 52%, #d99132 100%);
            border: 3px solid #7a4512;
            border-radius: 16px;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.42),
                0 6px 0 #6b3d10,
                0 10px 18px rgba(0, 0, 0, 0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            color: #452005;
            text-shadow: 0 1px 0 rgba(255, 248, 214, 0.65);
            font-family: var(--font-accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 18px;
        }

        .btn-action:active {
            transform: translateY(5px);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.42),
                0 1px 0 #6b3d10,
                0 4px 10px rgba(0, 0, 0, 0.25);
            filter: saturate(1.05);
        }

        .control-pad-btn {
            width: 96px;
            height: 96px;
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #fff9e4;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.16), transparent 30%),
                linear-gradient(180deg, rgba(35, 73, 48, 0.9) 0%, rgba(10, 24, 16, 0.95) 100%);
            border: 3px solid rgba(255, 221, 156, 0.58);
            box-shadow:
                inset 0 0 0 2px rgba(255, 246, 216, 0.08),
                0 0 24px var(--control-glow),
                0 8px 18px rgba(0, 0, 0, 0.32);
            transition: transform 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
        }

        .control-pad-btn:active {
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), transparent 30%),
                linear-gradient(180deg, rgba(48, 101, 67, 0.95) 0%, rgba(16, 37, 23, 0.98) 100%);
            box-shadow:
                inset 0 0 0 2px rgba(255, 246, 216, 0.12),
                0 0 28px rgba(246, 203, 84, 0.4),
                0 4px 10px rgba(0, 0, 0, 0.26);
        }

        .control-emoji {
            font-size: 1.7rem;
            line-height: 1;
            filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.28));
        }

        .control-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.09em;
        }

        .danger-bar-container {
            background: rgba(5, 9, 9, 0.7);
            border: 2px solid rgba(255, 240, 203, 0.35);
            border-radius: 999px;
            overflow: hidden;
            height: 24px;
            width: min(200px, 52vw);
            margin: 0 auto;
            position: relative;
            box-shadow:
                inset 0 1px 4px rgba(255, 255, 255, 0.05),
                0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .danger-marker {
            position: absolute;
            top: -1px;
            bottom: -1px;
            width: 5px;
            background: linear-gradient(180deg, #fff8db 0%, #ffffff 100%);
            box-shadow: 0 0 8px rgba(255, 248, 219, 0.9);
            border-radius: 999px;
            transition: left 0.1s linear;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.38; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-2px); }
        }

        #hud {
            top: 0;
            left: 0;
            width: 100%;
            padding: max(12px, env(safe-area-inset-top)) 14px 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hud-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .score-chip {
            min-width: 126px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(10, 18, 14, 0.62);
            border: 2px solid rgba(255, 233, 183, 0.34);
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.26);
            text-align: center;
            color: #fff5cf;
        }

        .score-value {
            display: block;
            font-family: var(--font-accent);
            font-size: 1.6rem;
            line-height: 1;
            letter-spacing: 0.06em;
        }

        .score-unit {
            display: block;
            margin-top: 3px;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .meter-label {
            margin-bottom: 4px;
            font-size: 0.72rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            text-align: center;
        }

        #controls {
            left: 0;
            bottom: 0;
            width: 100%;
            height: 170px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding:
                0 16px
                calc(16px + env(safe-area-inset-bottom))
                16px;
            pointer-events: none;
        }

        .control-wrap {
            pointer-events: auto;
            position: relative;
            z-index: 2;
        }

        .hint-text {
            position: absolute;
            left: 50%;
            bottom: calc(114px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: calc(100% - 108px);
            text-align: center;
            pointer-events: none;
            color: #fff1c4;
            font-family: var(--font-accent);
            font-size: clamp(1rem, 4vw, 1.2rem);
            letter-spacing: 0.08em;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.38);
            animation: pulseHint 1.8s ease-in-out infinite;
            opacity: 0.62;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 20px 14px max(20px, env(safe-area-inset-bottom));
        }

        .feedback-gif {
            position: absolute;
            z-index: 4;
            width: min(34vw, 144px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.34));
            border-radius: 18px;
            border: 2px solid rgba(255, 233, 183, 0.28);
            background: rgba(0, 0, 0, 0.24);
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #jump-gif {
            left: 14px;
            bottom: calc(182px + env(safe-area-inset-bottom));
        }

        #danger-gif {
            right: 14px;
            top: calc(84px + env(safe-area-inset-top));
        }

        #start-screen {
            background:
                radial-gradient(circle at top, rgba(248, 209, 108, 0.16), transparent 28%),
                rgba(5, 10, 11, 0.64);
            backdrop-filter: blur(7px);
        }

        #game-over-screen {
            background:
                radial-gradient(circle at top, rgba(255, 144, 109, 0.18), transparent 25%),
                rgba(88, 21, 17, 0.78);
            backdrop-filter: blur(9px);
        }

        .menu-card {
            width: min(100%, 400px);
            padding: 22px 18px 18px;
        }

        .menu-title {
            font-size: clamp(2rem, 10vw, 3rem);
            line-height: 0.96;
            margin-bottom: 4px;
            color: #ffd26d;
        }

        .menu-subtitle {
            margin: 0 0 18px;
            font-size: clamp(1.1rem, 4.6vw, 1.35rem);
            color: #d8f8c6;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .info-box {
            margin-bottom: 18px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 237, 192, 0.16);
            text-align: left;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: clamp(0.95rem, 4vw, 1.08rem);
            line-height: 1.15;
        }

        .info-row + .info-row {
            margin-top: 10px;
        }

        .info-icon {
            flex: 0 0 auto;
            width: 24px;
            text-align: center;
        }

        .final-score {
            margin: 4px 0 0;
            font-family: var(--font-accent);
            font-size: clamp(2.8rem, 15vw, 4.4rem);
            line-height: 1;
            color: #ffd26d;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.34);
        }

        .final-label {
            margin: 4px 0 18px;
            font-size: clamp(1rem, 4.5vw, 1.25rem);
            color: rgba(255, 255, 255, 0.82);
        }

        @media (max-width: 480px) {
            .menu-card {
                padding: 20px 14px 16px;
                border-radius: 18px;
            }

            #controls {
                height: 156px;
                padding-left: 12px;
                padding-right: 12px;
            }

            .control-pad-btn {
                width: 88px;
                height: 88px;
            }

            .hint-text {
                bottom: calc(102px + env(safe-area-inset-bottom));
                width: calc(100% - 88px);
            }

            .score-chip {
                min-width: 116px;
                padding: 9px 12px;
            }

            .danger-bar-container {
                width: min(188px, 54vw);
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: jump/danger feedback -> catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <img id="jump-gif" class="feedback-gif" alt="Vault reaction" src="https://i.giphy.com/3o6YgaiHLlJ9020xUc.webp">
        <img id="danger-gif" class="feedback-gif" alt="Guardian danger reaction" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="hud" class="overlay-root hidden">
            <div class="hud-row">
                <div class="score-chip">
                    <span class="score-value"><span id="scoreDisplay">0</span>m</span>
                    <span class="score-unit">Courier Distance</span>
                </div>
            </div>

            <div>
                <div class="meter-label">Guardian Gap</div>
                <div class="danger-bar-container">
                    <div style="position:absolute; inset:0; background:linear-gradient(90deg, #a9241f 0%, #db9b23 45%, #58b64f 100%); opacity:0.95;"></div>
                    <div id="dangerMarker" class="danger-marker" style="left: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
        <div id="controls" class="overlay-root hidden">
            <div class="control-wrap">
                <button id="btn-brake" class="control-pad-btn">
                    <span class="control-emoji">🛑</span>
                    <span class="control-label">BRAKE</span>
                </button>
            </div>

            <div class="hint-text">TAP TO VAULT</div>

            <div class="control-wrap">
                <button id="btn-sprint" class="control-pad-btn">
                    <span class="control-emoji">⚡</span>
                    <span class="control-label">SPRINT</span>
                </button>
            </div>
        </div>

        <div id="start-screen" class="screen">
            <div class="ui-panel menu-card animate-float">
                <h1 class="menu-title">TEMPLE COURIER</h1>
                <p class="menu-subtitle">Easy Route</p>

                <div class="info-box">
                    <div class="info-row">
                        <span class="info-icon">🗿</span>
                        <span>The stone guardian is closing in!</span>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">⚡</span>
                        <span>Hold <b>Sprint</b> to dash ahead</span>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">🛑</span>
                        <span>Hold <b>Brake</b> to steady your pace</span>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">👆</span>
                        <span><b>Tap Screen</b> to vault gaps</span>
                    </div>
                </div>

                <button id="start-btn" class="btn-action">Start Delivery</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <div class="ui-panel menu-card">
                <h2 id="death-reason" style="font-size:clamp(2rem, 9vw, 2.5rem); margin-bottom:8px; color:#fff5db;">OH NO!</h2>
                <div class="final-score" id="finalScore">0</div>
                <p class="final-label">Meters Delivered</p>

                <button id="restart-btn" class="btn-action">Retry Route</button>
            </div>
        </div>
    </div>

    <script type="module">
        /**
         * GAME ENGINE & LOGIC
         * Single-file implementation for "Ruins Run" (Easier Remake)
         */

        const ENABLE_ANIMATIONS = true;

        // --- ASSETS ---
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                sprint: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                brake: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"
            },
            images: {
                elephant: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png"
            },
            gifs: {
                jump: "https://i.giphy.com/3o6YgaiHLlJ9020xUc.webp",
                danger: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        // --- AUDIO SYSTEM ---
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
        const sounds = {};
        let audioReady = false;
        let bgmSource = null;
        let bgmGain = null;
        const sfxCooldowns = new Map();

        async function loadAudio(url) {
            if (!audioCtx) return null;
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                return await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn("Audio load failed", url);
                return null;
            }
        }

        async function initAudio() {
            if (!audioCtx || audioReady) return;
            try {
                if (audioCtx.state === 'suspended') await audioCtx.resume();
            } catch (e) {
                console.warn('Audio resume failed');
            }

            const entries = [
                ['bgm', ASSETS.bgm],
                ['jump', ASSETS.sfx.jump],
                ['land', ASSETS.sfx.land],
                ['sprint', ASSETS.sfx.sprint],
                ['brake', ASSETS.sfx.brake],
                ['start', ASSETS.sfx.start],
                ['fail', ASSETS.sfx.fail],
                ['warning', ASSETS.sfx.warning]
            ];

            await Promise.all(entries.map(async ([key, url]) => {
                sounds[key] = await loadAudio(url);
            }));

            audioReady = true;
        }

        function playBGM() {
            if (!audioCtx || !sounds.bgm) return;
            stopBGM();

            bgmSource = audioCtx.createBufferSource();
            bgmGain = audioCtx.createGain();
            bgmSource.buffer = sounds.bgm;
            bgmSource.loop = true;
            bgmGain.gain.value = 0.2;
            bgmSource.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmSource.start(0);
        }

        function stopBGM() {
            if (bgmSource) {
                try {
                    bgmSource.stop();
                } catch (e) {
                    console.warn('BGM stop failed');
                }
                bgmSource = null;
            }
            bgmGain = null;
        }

        function playSFX(name, volume = 0.45, cooldownMs = 0) {
            if (!audioCtx || !sounds[name]) return;
            const now = performance.now();
            const last = sfxCooldowns.get(name) || 0;
            if (cooldownMs && (now - last) < cooldownMs) return;
            sfxCooldowns.set(name, now);

            const src = audioCtx.createBufferSource();
            src.buffer = sounds[name];
            const gain = audioCtx.createGain();
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(0);
        }

        function fadeBGM(target) {
            if (!audioCtx || !bgmGain) return;
            bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
            bgmGain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 0.2);
        }

        // --- GAME STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let score = 0;

        // Configuration (Easier Mode)
        const CONFIG = {
            gravity: 0.55,
            jumpForce: -15.5,
            baseSpeed: 6.0,
            minSpeed: 3.5,
            maxSpeed: 9.0,
            elephantBaseSpeed: 4.2,
            elephantCatchup: 1.1,
            genGapChance: 0.1,
            genSpikeChance: 0.1,
            safeZone: 600
        };

        // Entities
        let player = { x: 0, y: 0, w: 40, h: 70, vx: 0, vy: 0, grounded: false };
        let elephant = { x: -500, y: 0, w: 180, h: 160, speed: 0 };
        let camera = { x: 0 };
        let platforms = [];
        let particles = [];
        let input = { brake: false, sprint: false };
        let lastGrounded = false;
        let dangerWarningActive = false;
        let feedbackTimers = {};

        // Images
        const eleImg = new Image();
        eleImg.src = ASSETS.images.elephant;

        // --- RESIZE ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- LEVEL GENERATION ---
        class Platform {
            constructor(x, y, w, h, type = 'ground') {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.type = type;
            }
        }

        let nextGenX = 0;

        function generateChunk() {
            const groundY = height - 120;
            let x = nextGenX;

            for (let i = 0; i < 3; i++) {
                const isSafe = score < CONFIG.safeZone;
                const gap = !isSafe && Math.random() < CONFIG.genGapChance;
                const pWidth = 300 + Math.random() * 400;

                if (!gap) {
                    platforms.push(new Platform(x, groundY, pWidth, 120, 'ground'));

                    if (!isSafe && Math.random() < CONFIG.genSpikeChance) {
                        const spikeW = 40;
                        const spikeX = x + pWidth / 2 - spikeW / 2;
                        platforms.push(new Platform(spikeX, groundY - 30, spikeW, 30, 'spike'));
                    }
                }

                const gapSize = gap ? (100 + Math.random() * 80) : 0;
                x += pWidth + gapSize;
            }
            nextGenX = x;
        }

        function showFeedbackGif(name, duration = 850) {
            const element = document.getElementById(`${name}-gif`);
            if (!element) return;
            element.classList.add('visible');
            clearTimeout(feedbackTimers[name]);
            feedbackTimers[name] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        function initGame() {
            score = 0;
            frameCount = 0;

            player.x = 200;
            player.y = height - 300;
            player.vx = CONFIG.baseSpeed;
            player.vy = 0;

            elephant.x = -600;
            elephant.y = height - 260;
            elephant.speed = CONFIG.elephantBaseSpeed;

            camera.x = 0;
            platforms = [];
            particles = [];
            lastGrounded = false;
            dangerWarningActive = false;
            document.getElementById('jump-gif').classList.remove('visible');
            document.getElementById('danger-gif').classList.remove('visible');

            platforms.push(new Platform(-500, height - 120, 2000, 120, 'ground'));
            nextGenX = 1500;

            updateDangerUI();
        }

        // --- PHYSICS & UPDATE ---
        function update() {
            let targetSpeed = CONFIG.baseSpeed;
            if (input.brake) targetSpeed = CONFIG.minSpeed;
            if (input.sprint) targetSpeed = CONFIG.maxSpeed;

            player.vx += (targetSpeed - player.vx) * 0.1;

            player.vy += CONFIG.gravity;
            player.x += player.vx;
            player.y += player.vy;

            const difficultyMultiplier = 1 + (score / 15000);
            let targetEleSpeed = CONFIG.elephantBaseSpeed * difficultyMultiplier;

            const dist = player.x - elephant.x;
            if (dist > 1000) targetEleSpeed *= 1.3;
            if (dist < 300) targetEleSpeed *= 0.8;

            elephant.speed += (targetEleSpeed - elephant.speed) * 0.05;
            elephant.x += elephant.speed;

            elephant.y = (height - 260) + Math.sin(frameCount * 0.1) * 10;

            camera.x = player.x - width * 0.25;

            player.grounded = false;

            for (let p of platforms) {
                if (p.x > camera.x + width + 100 || p.x + p.w < camera.x - 100) continue;

                if (player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h > p.y && player.y < p.y + p.h) {

                    if (p.type === 'spike') {
                        const grace = 5;
                        if (player.x + player.w - grace > p.x && player.x + grace < p.x + p.w &&
                            player.y + player.h - grace > p.y) {
                            die("TRAP TRIGGERED!");
                            return;
                        }
                    } else if (p.type === 'ground') {
                        if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 15) {
                            player.y = p.y - player.h;
                            player.vy = 0;
                            player.grounded = true;
                        }
                    }
                }
            }

            if (player.grounded && !lastGrounded) {
                playSFX('land', 0.34, 90);
            }
            lastGrounded = player.grounded;

            if (player.y > height) {
                die("ROUTE LOST!");
                return;
            }

            if (player.x < elephant.x + elephant.w * 0.7 &&
                player.x + player.w > elephant.x + elephant.w * 0.3) {
                die("THE GUARDIAN CAUGHT UP!");
                return;
            }

            if (player.x + width > nextGenX) {
                generateChunk();
                if (platforms.length > 20) platforms.splice(0, 5);
            }

            score = Math.floor(player.x / 10);
            document.getElementById('scoreDisplay').innerText = score;
            updateDangerUI();

            frameCount++;
        }

        function updateDangerUI() {
            const dist = player.x - elephant.x;
            const maxDist = 800;
            let pct = (dist / maxDist) * 100;
            pct = Math.max(0, Math.min(100, pct));

            document.getElementById('dangerMarker').style.left = pct + '%';

            const isDanger = pct < 36;
            if (isDanger && !dangerWarningActive && gameActive) {
                playSFX('warning', 0.32, 700);
                showFeedbackGif('danger', 1100);
            }
            dangerWarningActive = isDanger;
        }

        function die(reason) {
            gameActive = false;
            stopBGM();
            playSFX('fail', 0.5, 0);
            showFeedbackGif('danger', 1500);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('death-reason').innerText = reason;
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;

            if (player.grounded) {
                player.vy = CONFIG.jumpForce;
                player.grounded = false;
                playSFX('jump', 0.42, 90);
                showFeedbackGif('jump', 700);

                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x + player.w / 2,
                        y: player.y + player.h,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 20
                    });
                }
            } else {
                playSFX('brake', 0.24, 180);
            }
        }

        function setInputState(key, value) {
            const changed = input[key] !== value;
            input[key] = value;

            if (!changed || !gameActive) return;

            if (key === 'sprint' && value) {
                playSFX('sprint', 0.28, 180);
                fadeBGM(0.25);
            } else if (key === 'brake' && value) {
                playSFX('brake', 0.24, 180);
                fadeBGM(0.16);
            } else if (!input.sprint && !input.brake) {
                fadeBGM(0.2);
            }
        }

        function primeMedia() {
            initAudio().then(() => {
                playSFX('start', 0.36, 0);
            });
        }

        const startScreen = document.getElementById('start-screen');
        startScreen.addEventListener('pointerdown', primeMedia, { once: true });

        // --- RENDER ---
        function drawTempleCanopy() {
            const canopyBands = [
                { y: 0.15, color: 'rgba(33, 71, 42, 0.18)', height: 90, step: 180 },
                { y: 0.22, color: 'rgba(54, 97, 58, 0.14)', height: 64, step: 140 }
            ];

            canopyBands.forEach((band, index) => {
                const offsetX = (camera.x * (0.08 + index * 0.03)) % band.step;
                ctx.fillStyle = band.color;

                for (let i = -band.step; i < width + band.step; i += band.step) {
                    const baseX = i - offsetX;
                    const baseY = height * band.y;
                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.quadraticCurveTo(baseX + band.step * 0.25, baseY - band.height, baseX + band.step * 0.5, baseY);
                    ctx.quadraticCurveTo(baseX + band.step * 0.75, baseY + band.height * 0.22, baseX + band.step, baseY - 10);
                    ctx.lineTo(baseX + band.step, -20);
                    ctx.lineTo(baseX, -20);
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }

        function drawSunDisk() {
            const sunX = width * 0.82;
            const sunY = height * 0.16;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 84);
            sunGrad.addColorStop(0, 'rgba(255, 241, 185, 0.9)');
            sunGrad.addColorStop(0.45, 'rgba(246, 193, 96, 0.42)');
            sunGrad.addColorStop(1, 'rgba(246, 193, 96, 0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 84, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRuinsLayer(rate, color, detailColor, baseHeight, widthStep) {
            ctx.save();
            ctx.translate(-camera.x * rate, 0);
            ctx.fillStyle = color;

            const start = Math.floor((camera.x * rate) / widthStep) * widthStep - widthStep;
            const end = (camera.x * rate) + width + widthStep;

            for (let i = start; i < end; i += widthStep) {
                const pillarHeight = baseHeight + (Math.sin(i * 0.01) * 24);
                const pillarWidth = 72 + ((i / widthStep) % 2 === 0 ? 24 : 0);
                const pillarY = height - pillarHeight - 110;

                ctx.fillRect(i, pillarY, pillarWidth, pillarHeight);
                ctx.beginPath();
                ctx.arc(i + pillarWidth / 2, pillarY, pillarWidth / 2, Math.PI, 0);
                ctx.fill();

                ctx.fillStyle = detailColor;
                ctx.fillRect(i + 10, pillarY + 20, 8, pillarHeight - 28);
                ctx.fillRect(i + pillarWidth - 20, pillarY + 32, 8, pillarHeight - 40);
                ctx.fillStyle = color;
            }
            ctx.restore();
        }

        function drawGroundEmbers() {
            const grad = ctx.createLinearGradient(0, height - 160, 0, height);
            grad.addColorStop(0, 'rgba(255, 198, 99, 0)');
            grad.addColorStop(1, 'rgba(255, 173, 76, 0.12)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, height - 180, width, 180);
        }

        function drawPlatform(p) {
            if (p.type === 'ground') {
                const topGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                topGrad.addColorStop(0, '#7db459');
                topGrad.addColorStop(0.12, '#587d3e');
                topGrad.addColorStop(1, '#3d4130');
                ctx.fillStyle = topGrad;
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.fillStyle = '#a7d56e';
                ctx.fillRect(p.x, p.y, p.w, 12);

                ctx.fillStyle = 'rgba(255, 240, 182, 0.12)';
                ctx.fillRect(p.x + 8, p.y + 14, p.w - 16, 5);

                ctx.fillStyle = '#4f5b40';
                for (let bx = p.x + 10; bx < p.x + p.w - 10; bx += 42) {
                    ctx.fillRect(bx, p.y + 18, 3, p.h - 18);
                }

                ctx.fillStyle = '#30412d';
                for (let by = p.y + 34; by < p.y + p.h; by += 24) {
                    ctx.fillRect(p.x, by, p.w, 2);
                }

                ctx.fillStyle = 'rgba(16, 27, 18, 0.24)';
                ctx.fillRect(p.x, p.y + p.h - 10, p.w, 10);
            } else if (p.type === 'spike') {
                const spikeGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                spikeGrad.addColorStop(0, '#ff9a71');
                spikeGrad.addColorStop(1, '#8d241f');
                ctx.fillStyle = spikeGrad;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + p.h);
                ctx.lineTo(p.x + p.w / 2, p.y);
                ctx.lineTo(p.x + p.w, p.y + p.h);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 237, 207, 0.55)';
                ctx.beginPath();
                ctx.moveTo(p.x + 7, p.y + p.h);
                ctx.lineTo(p.x + p.w / 2, p.y + 7);
                ctx.lineTo(p.x + p.w - 7, p.y + p.h);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawElephant() {
            if (eleImg.complete && eleImg.naturalWidth > 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.32)';
                ctx.shadowBlur = 14;
                ctx.drawImage(eleImg, elephant.x, elephant.y, elephant.w, elephant.h);
                ctx.restore();

                ctx.save();
                ctx.fillStyle = 'rgba(150, 255, 188, 0.18)';
                ctx.beginPath();
                ctx.ellipse(elephant.x + elephant.w * 0.56, elephant.y + elephant.h * 0.58, elephant.w * 0.5, elephant.h * 0.38, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else {
                ctx.fillStyle = '#7b8576';
                ctx.fillRect(elephant.x, elephant.y, elephant.w, elephant.h);
            }
        }

        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.w;
            const h = player.h;
            const legSwing = Math.sin(frameCount * 0.3) * 10;
            const armSwing = Math.sin(frameCount * 0.3) * 10;
            const bob = player.grounded ? Math.sin(frameCount * 0.26) * 1.5 : -2;
            const cloakGlow = ENABLE_ANIMATIONS ? (0.75 + Math.sin(frameCount * 0.18) * 0.18) : 0.75;

            ctx.save();
            ctx.translate(0, bob);

            ctx.fillStyle = `rgba(245, 208, 99, ${0.14 * cloakGlow})`;
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h * 0.46, w * 0.72, h * 0.62, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#28170b';
            ctx.fillRect(x + 9, y + 5, w - 18, 8);

            ctx.fillStyle = '#f4c76d';
            ctx.fillRect(x + 8, y + 10, w - 16, 18);
            ctx.fillStyle = '#e39d41';
            ctx.fillRect(x + 10, y + 24, w - 20, 6);

            ctx.fillStyle = '#5f2617';
            ctx.fillRect(x + 3, y + 28, w - 6, 23);

            ctx.fillStyle = '#d9a53d';
            ctx.beginPath();
            ctx.moveTo(x + 2, y + 34);
            ctx.lineTo(x + w - 2, y + 34);
            ctx.lineTo(x + w / 2, y + 58);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f6cd78';
            ctx.fillRect(x - 7, y + 28 + armSwing, 7, 18);
            ctx.fillRect(x + w, y + 28 - armSwing, 7, 18);

            ctx.fillStyle = '#efba59';
            ctx.fillRect(x + 4, y + 51, w / 2 - 6, 20 + (player.grounded ? legSwing : -4));
            ctx.fillRect(x + w / 2 + 2, y + 51, w / 2 - 6, 20 + (player.grounded ? -legSwing : 4));

            ctx.fillStyle = '#5a2e11';
            ctx.fillRect(x + 2, y + h - 5, w / 2 - 3, 5);
            ctx.fillRect(x + w / 2 + 1, y + h - 5, w / 2 - 3, 5);

            ctx.fillStyle = '#111';
            ctx.fillRect(x + 13, y + 16, 4, 4);
            ctx.fillRect(x + w - 17, y + 16, 4, 4);

            ctx.fillStyle = '#fff2c5';
            ctx.fillRect(x + 14, y + 17, 1, 1);
            ctx.fillRect(x + w - 16, y + 17, 1, 1);

            ctx.fillStyle = '#7d2f20';
            ctx.fillRect(x + 15, y + 23, 10, 3);

            ctx.fillStyle = '#d4a036';
            ctx.beginPath();
            ctx.moveTo(x + w - 2, y + 30);
            ctx.lineTo(x + w + 10, y + 36);
            ctx.lineTo(x + w - 2, y + 42);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = `rgba(255, 234, 182, ${0.6 * cloakGlow})`;
            ctx.fillRect(x + w + 3, y + 37, 9, 4);

            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.fillStyle = `rgba(249, 205, 98, ${Math.max(0, p.life / 20)})`;
                ctx.fillRect(p.x, p.y, 4, 4);
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#08111d');
            sky.addColorStop(0.52, '#17314a');
            sky.addColorStop(1, '#35552a');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            drawSunDisk();
            drawTempleCanopy();
            drawRuinsLayer(0.16, 'rgba(33, 55, 65, 0.88)', 'rgba(84, 117, 122, 0.22)', 210, 340);
            drawRuinsLayer(0.32, 'rgba(52, 80, 78, 0.88)', 'rgba(175, 197, 173, 0.12)', 260, 290);
            drawGroundEmbers();

            ctx.save();
            ctx.translate(-camera.x, 0);

            for (let p of platforms) {
                drawPlatform(p);
            }

            drawElephant();
            drawPlayer();
            drawParticles();

            ctx.restore();
        }

        function loop() {
            if (gameActive) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }

        // --- INPUT HANDLERS ---
        const gameContainer = document.getElementById('game-container');
        const btnBrake = document.getElementById('btn-brake');
        const btnSprint = document.getElementById('btn-sprint');

        function bindBtn(btn, key) {
            const start = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setInputState(key, true);
                btn.style.transform = 'scale(0.9)';
            };
            const end = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setInputState(key, false);
                btn.style.transform = 'scale(1)';
            };

            btn.addEventListener('pointerdown', start);
            btn.addEventListener('pointerup', end);
            btn.addEventListener('pointercancel', end);
            btn.addEventListener('pointerleave', end);
        }

        bindBtn(btnBrake, 'brake');
        bindBtn(btnSprint, 'sprint');

        gameContainer.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.control-pad-btn')) return;
            if (!gameActive) return;
            jump();
        });

        document.addEventListener('visibilitychange', () => {
            if (!gameActive) return;
            if (document.hidden) {
                fadeBGM(0.08);
            } else {
                fadeBGM(input.sprint ? 0.25 : input.brake ? 0.16 : 0.2);
            }
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            await initAudio();
            playSFX('start', 0.36, 0);
            playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            initGame();
            loop();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await initAudio();
            playSFX('start', 0.3, 0);
            playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            initGame();
            loop();
        });
    </script>
</body>
