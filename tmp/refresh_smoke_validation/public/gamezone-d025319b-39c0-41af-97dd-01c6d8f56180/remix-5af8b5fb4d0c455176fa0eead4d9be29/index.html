<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Sweep</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        :root {
            --bg: #040814;
            --bg-grid: rgba(115, 238, 255, 0.08);
            --panel: rgba(8, 16, 34, 0.78);
            --panel-border: rgba(115, 238, 255, 0.3);
            --ink: #eefbff;
            --muted: #8ca7c2;
            --accent: #73eeff;
            --accent-strong: #29baff;
            --accent-hot: #ff4fb3;
            --glow: rgba(41, 186, 255, 0.28);
            --danger: #ff5470;
            --success: #89ffb8;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(17, 39, 84, 0.9), transparent 40%),
                linear-gradient(180deg, #081121 0%, var(--bg) 55%, #02040b 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body { color: var(--ink); }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; }
        .hidden { display: none !important; }

        .glass {
            background:
                linear-gradient(180deg, rgba(12, 28, 56, 0.92), rgba(7, 16, 34, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 16px 36px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(115, 238, 255, 0.08);
        }

        .text-shadow { text-shadow: 0 0 18px rgba(115, 238, 255, 0.24); }
        .title-font { font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif; letter-spacing: 0.08em; }
        .hud-value {
            font-size: clamp(1.6rem, 6vw, 2.5rem);
            line-height: 1;
            font-weight: 700;
            color: var(--ink);
        }
        .hud-label {
            margin-top: 0.45rem;
            font-size: 0.72rem;
            line-height: 1;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background:
                linear-gradient(90deg, transparent 24%, var(--bg-grid) 25%, transparent 26%, transparent 74%, var(--bg-grid) 75%, transparent 76%),
                linear-gradient(transparent 24%, var(--bg-grid) 25%, transparent 26%, transparent 74%, var(--bg-grid) 75%, transparent 76%);
            background-size: 72px 72px;
        }

        #gameCanvas { position: absolute; inset: 0; }
        #damage-overlay {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            background:
                radial-gradient(circle at center, rgba(255, 84, 112, 0.35), rgba(255, 84, 112, 0.05) 55%, transparent 80%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.1rem;
            pointer-events: none;
        }
        #ui-layer > * { pointer-events: auto; }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            transition: opacity 0.3s ease;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 0.9rem 1rem 0.82rem;
            border-radius: 1.15rem;
            background: linear-gradient(180deg, rgba(13, 27, 54, 0.88), rgba(7, 16, 34, 0.78));
            border: 1px solid rgba(115, 238, 255, 0.24);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.24),
                inset 0 0 20px rgba(115, 238, 255, 0.06);
        }

        .hud-group.end { align-items: flex-end; text-align: right; }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background: rgba(2, 6, 14, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .game-over-card {
            width: min(21rem, 100%);
            padding: 1.6rem 1.3rem 1.35rem;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.38);
        }

        .badge {
            width: 4.7rem;
            height: 4.7rem;
            margin-bottom: 1rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 30% 30%, #b6fbff, var(--accent) 48%, var(--accent-hot) 100%);
            color: #04111f;
            font-size: 2rem;
            box-shadow:
                0 0 28px rgba(41, 186, 255, 0.42),
                0 14px 28px rgba(255, 79, 179, 0.18);
        }

        .game-over-title {
            margin: 0 0 0.85rem;
            font-size: clamp(1.25rem, 4.6vw, 1.7rem);
            line-height: 1.25;
            font-weight: 400;
            color: var(--ink);
        }

        .game-over-copy {
            margin: 0 0 1.5rem;
            font-size: 0.98rem;
            color: #c0d7f1;
            font-weight: 700;
            line-height: 1.5;
        }

        .final-score {
            color: var(--success);
            font-size: 1.3em;
            font-weight: 700;
        }

        .restart-button {
            border: 1px solid rgba(115, 238, 255, 0.4);
            border-radius: 9999px;
            background: linear-gradient(180deg, var(--accent-strong), #117bc8);
            color: #f5fdff;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.9rem 2rem;
            box-shadow: 0 10px 24px rgba(41, 186, 255, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .restart-button:hover {
            filter: brightness(1.08);
            box-shadow: 0 14px 28px rgba(41, 186, 255, 0.32);
        }
        .restart-button:active { transform: scale(0.96); }

        .intro-copy {
            position: absolute;
            left: 1.1rem;
            bottom: 1.1rem;
            max-width: min(24rem, calc(100% - 2.2rem));
            padding: 0.9rem 1rem;
            border-radius: 1rem;
            color: #d7eeff;
            font-size: 0.84rem;
            line-height: 1.55;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .intro-copy strong {
            display: block;
            margin-bottom: 0.55rem;
            color: var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .intro-copy::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: inset 0 0 24px rgba(115, 238, 255, 0.08);
        }

        .reaction-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(30vw, 7.25rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(115, 238, 255, 0.28);
            background: rgba(3, 8, 18, 0.74);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            z-index: 35;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .reaction-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .reaction-gif.fail {
            top: 7.1rem;
            bottom: auto;
            width: min(22vw, 5.4rem);
            right: 1rem;
        }

        /* Animations */
        @keyframes pulse-red {
            0% { opacity: 0; }
            50% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        .damage-flash { animation: pulse-red 0.3s ease-out; }

        @media (max-width: 640px) {
            #ui-layer { padding: 0.85rem; }
            .hud-group {
                padding: 0.7rem 0.78rem 0.66rem;
                border-radius: 1rem;
            }
            .hud-value { font-size: clamp(1.2rem, 6.4vw, 1.9rem); }
            .hud-label {
                margin-top: 0.34rem;
                font-size: 0.6rem;
                letter-spacing: 0.18em;
            }
            .intro-copy {
                left: 0.85rem;
                right: 0.85rem;
                bottom: 0.85rem;
                max-width: none;
                font-size: 0.78rem;
                padding: 0.8rem 0.9rem;
            }
            .intro-copy strong { font-size: 0.84rem; }
            .game-over-card { padding: 1.35rem 1.05rem 1.15rem; }
            .game-over-copy { font-size: 0.92rem; }
            .reaction-gif {
                right: 0.85rem;
                bottom: 5.9rem;
                width: min(24vw, 5.2rem);
            }
            .reaction-gif.fail {
                top: 6.2rem;
                right: 0.85rem;
                width: min(20vw, 4.4rem);
            }
            .restart-button {
                width: 100%;
                max-width: 15rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_correct" data-editable="audio" data-label="Correct SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_wrong" data-editable="audio" data-label="Wrong SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_alert" data-editable="audio" data-label="Alert SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "initialTime": { "type": "number", "label": "Start Time (s)", "value": 30, "min": 10, "max": 60 },
    "timeBonus": { "type": "number", "label": "Time Bonus (s)", "value": 3, "min": 1, "max": 10 },
    "difficultyCurve": { "type": "number", "label": "Difficulty Factor", "value": 40, "min": 20, "max": 100 }
}
</script>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Damage Flash Overlay -->
    <div id="damage-overlay"></div>
    <img
        id="success-gif"
        class="reaction-gif hidden"
        src="https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp"
        alt="Celebration feedback animation"
        loading="lazy"
        decoding="async"
    >
    <img
        id="fail-gif"
        class="reaction-gif fail hidden"
        src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
        alt="Fail feedback animation"
        loading="lazy"
        decoding="async"
    >

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-group">
                <span class="hud-value text-shadow" id="score-display">0</span>
                <span class="hud-label">SECTORS</span>
            </div>
            <div class="hud-group end">
                <span class="hud-value text-shadow" id="time-display">30.0</span>
                <span class="hud-label">SCAN TIME</span>
            </div>
        </div>

        <div class="intro-copy glass">
            <strong class="title-font">SIGNAL SWEEP // NEON GRID</strong>
            Track the rogue pulse and tap the one tile that flickers off-pattern before the scan window collapses.
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <div class="glass game-over-card">
                <div class="badge">
                    ✦
                </div>
                <h2 class="game-over-title title-font">SCAN LOCKED</h2>
                <p class="game-over-copy">You isolated <span id="final-score" class="final-score">0</span> rogue sectors.</p>
                <button id="restart-btn" class="restart-button">
                    SWEEP AGAIN
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * §0 System Invariants & Utils
 */
const CONFIG_DEFAULT = { initialTime: 30, timeBonus: 3, difficultyCurve: 40 };
let gameConfig = { ...CONFIG_DEFAULT };

// Config Parser
try {
    const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
    window.gameConfigDefs = rawConfig;
    window.gameConfig = gameConfig;
} catch (e) { console.error("Config Parse Error", e); }

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    correct: document.getElementById('sfx_correct'),
    wrong: document.getElementById('sfx_wrong'),
    ui: document.getElementById('sfx_ui'),
    alert: document.getElementById('sfx_alert')
};
let audioUnlocked = false;
let bgmPrimed = false;
let lastSoundAt = { correct: 0, wrong: 0, ui: 0, alert: 0 };
let gifTimers = { success: 0, fail: 0 };

function syncLoopPlayback() {
    if (!audioUnlocked || !sounds.bgm) return;
    sounds.bgm.volume = 0.18;
    if (gameState === 'PLAYING') {
        sounds.bgm.play().catch(() => {});
    } else {
        sounds.bgm.pause();
    }
}

function unlockAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (!bgmPrimed) {
        sounds.bgm.volume = 0.18;
        bgmPrimed = true;
    }
    syncLoopPlayback();
}

function playSound(type) {
    const el = sounds[type];
    const now = performance.now();
    const minGap = type === 'correct' ? 80 : type === 'wrong' ? 140 : 180;
    if (lastSoundAt[type] && now - lastSoundAt[type] < minGap) return;
    lastSoundAt[type] = now;

    if (el && el.readyState >= 2) {
        el.pause();
        el.currentTime = 0;
        el.play().catch(() => playSynth(type));
    } else {
        playSynth(type);
    }
}

function playSynth(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'ui') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'alert') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(220, now + 0.18);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
    }
}

function showReaction(type, duration = 900) {
    const el = document.getElementById(type === 'success' ? 'success-gif' : 'fail-gif');
    const timerKey = type === 'success' ? 'success' : 'fail';
    clearTimeout(gifTimers[timerKey]);
    el.classList.remove('hidden');
    requestAnimationFrame(() => el.classList.add('visible'));
    gifTimers[timerKey] = window.setTimeout(() => {
        el.classList.remove('visible');
        window.setTimeout(() => el.classList.add('hidden'), 220);
    }, duration);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

/**
 * §1 Game State & Entities
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw, ch;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let lastTime = 0;

// Game State
let score = 0;
let timeLeft = 0;
let level = 1;
let gridSize = 2; // NxN
let oddIndex = 0; // The index of the different tile
let mainColor = { h: 0, s: 0, l: 0 };
let oddColor = { h: 0, s: 0, l: 0 };
let shake = 0;
let particles = [];
let tileScale = 0; // Animation for tiles appearing

// UI Elements
const ui = {
    hud: document.getElementById('hud'),
    gameOver: document.getElementById('game-over-screen'),
    score: document.getElementById('score-display'),
    time: document.getElementById('time-display'),
    finalScore: document.getElementById('final-score'),
    restartBtn: document.getElementById('restart-btn'),
    damageOverlay: document.getElementById('damage-overlay'),
    successGif: document.getElementById('success-gif'),
    failGif: document.getElementById('fail-gif')
};

/**
 * §2 Core Logic
 */
function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}

function initGame() {
    score = 0;
    level = 1;
    timeLeft = gameConfig.initialTime;
    particles = [];
    shake = 0;

    generateLevel();
    updateUI();
}

function generateLevel() {
    // Easier Progression:
    // Level 1-4: 2x2
    // Level 5-9: 3x3
    // Level 10-14: 4x4
    // Level 15+: 5x5 (Cap at 5)
    gridSize = Math.min(5, Math.floor((level - 1) / 5) + 2);

    // Color logic
    const h = 185 + Math.random() * 140;
    const s = 70 + Math.random() * 18;
    const l = 40 + Math.random() * 18;

    mainColor = { h, s, l };

    // Difficulty: Color difference
    // Starts large (easy), decreases slowly
    // Logic: Base 40, subtract small amount per level, floor at 8
    let diff = Math.max(8, gameConfig.difficultyCurve - (level * 1.2));

    const sign = Math.random() > 0.5 ? 1 : -1;

    // Ensure odd color doesn't go out of bounds (0-100 lightness)
    let newL = l + (diff * sign);
    if (newL < 15 || newL > 90) newL = l - (diff * sign);

    oddColor = {
        h: (h + (level > 10 ? 10 : 0)) % 360,
        s: Math.min(96, s + 4),
        l: newL
    };

    oddIndex = Math.floor(Math.random() * (gridSize * gridSize));
    tileScale = 0; // Trigger spawn animation
}

function setState(newState) {
    gameState = newState;
    if (newState === 'PLAYING') {
        ui.hud.classList.remove('hidden');
        ui.gameOver.classList.add('hidden');
        ui.hud.style.opacity = '1';
        syncLoopPlayback();
    } else if (newState === 'GAMEOVER') {
        ui.hud.style.opacity = '0.3';
        ui.gameOver.classList.remove('hidden');
        ui.finalScore.textContent = score;
        playSound('alert');
        showReaction('fail', 1400);
        syncLoopPlayback();
        vibrate('heavy');
    } else {
        syncLoopPlayback();
    }
}

function restartGame() {
    playSound('ui');
    initGame();
    setState('PLAYING');
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 16; i++) {
        const angle = (Math.PI * 2 * i) / 16;
        const speed = 3 + Math.random() * 5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: `hsl(${color.h}, ${color.s}%, ${color.l}%)`
        });
    }
}

function triggerDamage() {
    ui.damageOverlay.classList.remove('damage-flash');
    void ui.damageOverlay.offsetWidth;
    ui.damageOverlay.classList.add('damage-flash');
}

/**
 * §3 Input Handling
 */
function handleInput(e) {
    unlockAudio();
    if (gameState === 'GAMEOVER') return;
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Grid Geometry
    const margin = 24;
    const topOffset = 120;
    const availableWidth = cw - (margin * 2);
    const cellSize = availableWidth / gridSize;
    const gridHeight = cellSize * gridSize;

    // Hit Test
    if (mx < margin || mx > cw - margin || my < topOffset || my > topOffset + gridHeight) return;

    const col = Math.floor((mx - margin) / cellSize);
    const row = Math.floor((my - topOffset) / cellSize);
    const index = row * gridSize + col;

    if (index === oddIndex) {
        // Correct
        score++;
        level++;
        timeLeft = Math.min(60, timeLeft + gameConfig.timeBonus);

        // Visuals
        const cx = margin + col * cellSize + cellSize / 2;
        const cy = topOffset + row * cellSize + cellSize / 2;
        spawnParticles(cx, cy, oddColor);

        playSound('correct');
        showReaction('success', 820);
        vibrate('light');
        generateLevel();
    } else {
        // Wrong
        timeLeft = Math.max(0, timeLeft - 2);
        shake = 15;
        triggerDamage();
        playSound('wrong');
        showReaction('fail', 900);
        vibrate('heavy');
    }

    updateUI();
}

function updateUI() {
    ui.score.textContent = score;
}

window.addEventListener('pointerdown', handleInput, { passive: false });
ui.restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    unlockAudio();
    restartGame();
});
ui.restartBtn.addEventListener('pointerenter', () => playSound('ui'));

/**
 * §4 Render & Loop
 */
function update(dt) {
    if (gameState === 'PLAYING') {
        timeLeft -= dt;
        if (timeLeft <= 0) {
            timeLeft = 0;
            setState('GAMEOVER');
            playSound('wrong');
        }
        ui.time.textContent = timeLeft.toFixed(1);

        // Tile spawn animation
        tileScale = Math.min(1, tileScale + dt * 8);
    }

    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2.5;
        p.vy += 10 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Clear & Background
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#081121');
    bgGradient.addColorStop(0.52, '#040814');
    bgGradient.addColorStop(1, '#02040b');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Background Ambient Pulses
    const t = Date.now() * 0.00055;
    ctx.save();
    ctx.translate(cw / 2, ch / 2);

    const pulseA = ctx.createRadialGradient(Math.cos(t) * 45, Math.sin(t * 0.6) * 65, 0, Math.cos(t) * 45, Math.sin(t * 0.6) * 65, cw * 0.42);
    pulseA.addColorStop(0, 'rgba(41, 186, 255, 0.28)');
    pulseA.addColorStop(1, 'rgba(41, 186, 255, 0)');
    ctx.fillStyle = pulseA;
    ctx.beginPath();
    ctx.arc(Math.cos(t) * 45, Math.sin(t * 0.6) * 65, cw * 0.42, 0, Math.PI * 2);
    ctx.fill();

    const pulseB = ctx.createRadialGradient(Math.cos(t + 2.2) * 80, Math.sin(t * 0.7 + 1.2) * 55, 0, Math.cos(t + 2.2) * 80, Math.sin(t * 0.7 + 1.2) * 55, cw * 0.32);
    pulseB.addColorStop(0, 'rgba(255, 79, 179, 0.22)');
    pulseB.addColorStop(1, 'rgba(255, 79, 179, 0)');
    ctx.fillStyle = pulseB;
    ctx.beginPath();
    ctx.arc(Math.cos(t + 2.2) * 80, Math.sin(t * 0.7 + 1.2) * 55, cw * 0.32, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(115, 238, 255, 0.06)';
    ctx.lineWidth = 1;
    for (let x = -cw; x < cw; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, -ch);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    ctx.restore();

    // Shake Transform
    ctx.save();
    if (shake > 0) {
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
    }

    // Draw Grid
    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        const margin = 24;
        const topOffset = 120;
        const availableWidth = cw - (margin * 2);
        const cellSize = availableWidth / gridSize;
        const gap = Math.max(8, 20 - gridSize * 2);
        const tileSize = cellSize - gap;

        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                const idx = r * gridSize + c;
                const isOdd = idx === oddIndex;
                const color = isOdd ? oddColor : mainColor;

                const x = margin + c * cellSize + gap / 2;
                const y = topOffset + r * cellSize + gap / 2;

                const centerTileX = x + tileSize / 2;
                const centerTileY = y + tileSize / 2;

                ctx.save();
                ctx.translate(centerTileX, centerTileY);
                ctx.scale(tileScale, tileScale);
                ctx.translate(-centerTileX, -centerTileY);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
                drawRoundedRect(ctx, x, y + 7, tileSize, tileSize, 18);
                ctx.fill();

                const tileGradient = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
                tileGradient.addColorStop(0, `hsl(${color.h}, ${Math.min(100, color.s + 8)}%, ${Math.min(92, color.l + 10)}%)`);
                tileGradient.addColorStop(1, `hsl(${color.h}, ${color.s}%, ${Math.max(18, color.l - 8)}%)`);
                ctx.fillStyle = tileGradient;
                drawRoundedRect(ctx, x, y, tileSize, tileSize, 18);
                ctx.fill();

                ctx.strokeStyle = isOdd ? 'rgba(255, 255, 255, 0.55)' : 'rgba(115, 238, 255, 0.22)';
                ctx.lineWidth = isOdd ? 2.5 : 1.5;
                drawRoundedRect(ctx, x + 1, y + 1, tileSize - 2, tileSize - 2, 16);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.16)';
                ctx.beginPath();
                ctx.arc(x + tileSize * 0.26, y + tileSize * 0.24, tileSize * 0.16, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = isOdd ? 'rgba(255, 79, 179, 0.65)' : 'rgba(115, 238, 255, 0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + tileSize * 0.2, y + tileSize * 0.78);
                ctx.lineTo(x + tileSize * 0.8, y + tileSize * 0.22);
                ctx.stroke();

                ctx.restore();
            }
        }
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8 * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    // Time Bar
    if (gameState === 'PLAYING') {
        const barH = 8;
        const maxTime = 60;
        const pct = Math.min(1, timeLeft / maxTime);
        const barW = cw * pct;
        const hue = 120 * (Math.min(1, timeLeft / 10));
        const barGradient = ctx.createLinearGradient(0, 0, Math.max(0, barW), 0);
        barGradient.addColorStop(0, `hsl(${hue}, 100%, 62%)`);
        barGradient.addColorStop(1, 'rgba(115, 238, 255, 1)');
        ctx.fillStyle = barGradient;
        ctx.fillRect(0, 0, Math.max(0, barW), barH);
    }

    ctx.restore();
}

function drawRoundedRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    try {
        update(Math.min(dt, 0.1));
        draw();
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(loop);
}

// Lifecycle
window.addEventListener('DOMContentLoaded', () => {
    resize();
    window.addEventListener('resize', resize);

    initGame();
    setState('PLAYING');
    requestAnimationFrame(loop);
});

</script>
