<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORBIT PATROL: DEBRIS SWEEP</title>
    <link href="assets/fonts.googleapis.com/css2-family_Share_Tech_Mono_display_swap.css" rel="stylesheet">
    <style>
        :root {
            --color-pri: #6cf7ff;
            --color-sec: #ff7a18;
            --color-bg: #04111f;
            --color-panel: rgba(4, 18, 34, 0.84);
            --color-panel-strong: rgba(9, 28, 52, 0.92);
            --color-line: rgba(108, 247, 255, 0.35);
            --color-line-strong: rgba(108, 247, 255, 0.9);
            --color-spark: rgba(255, 255, 255, 0.85);
            --scan-color: rgba(108, 247, 255, 0.04);
            --font-display: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            --font-ui: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(24, 91, 137, 0.34), transparent 36%),
                radial-gradient(circle at bottom, rgba(255, 122, 24, 0.12), transparent 32%),
                linear-gradient(180deg, #071629 0%, #04111f 52%, #020b14 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-ui);
            color: var(--color-pri);
        }

        body {
            position: relative;
            letter-spacing: 0.03em;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(108, 247, 255, 0.18), transparent 18%),
                radial-gradient(circle at 82% 22%, rgba(255, 122, 24, 0.12), transparent 16%),
                radial-gradient(circle at 50% 82%, rgba(108, 247, 255, 0.1), transparent 24%);
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .font-bold { font-weight: 700; }
        .hidden { display: none !important; }
        .opacity-50 { opacity: 0.5; }
        .opacity-70 { opacity: 0.7; }
        .opacity-80 { opacity: 0.8; }
        .uppercase { text-transform: uppercase; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .leading-relaxed { line-height: 1.625; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .min-w-200 { min-width: 200px; }
        .safe-area-inset {
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-right: max(1rem, env(safe-area-inset-right));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
        }

        .h-px {
            height: 1px;
        }

        .bg-amber-line {
            background: var(--color-pri);
        }

        .border-amber-soft {
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

            border: 1px solid rgba(120, 60, 0, 0.8);

            background: rgba(0, 0, 0, 0.5);
        }

            color: #f87171;

        /* CRT Overlay Effect */
        .crt-overlay {
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* UI Components */
        .panel {
            background:
                linear-gradient(180deg, rgba(11, 31, 58, 0.95), rgba(4, 17, 31, 0.92)),
                var(--color-panel);
            border: 1px solid var(--color-line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 18px rgba(108, 247, 255, 0.12),
                0 18px 34px rgba(0, 0, 0, 0.38);
            position: relative;
            backdrop-filter: blur(4px);
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--color-pri);
            border-left: 2px solid var(--color-pri);
        }

        .panel::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--color-pri);
            border-right: 2px solid var(--color-pri);
        }

        .btn-tac {
            background: linear-gradient(180deg, rgba(108, 247, 255, 0.16), rgba(16, 48, 84, 0.82));
            border: 1px solid var(--color-line-strong);
            color: #e8fdff;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, background 0.12s ease;
            cursor: pointer;
            font-family: var(--font-ui);
            font-weight: 600;
            box-shadow: 0 0 14px rgba(108, 247, 255, 0.18);
        }

        .btn-tac:active {
            background: linear-gradient(180deg, var(--color-pri), #2ccde4);
            color: #03131e;
            transform: scale(0.97);
        }

        .bar-container {
            background: rgba(0, 8, 18, 0.8);
            border: 1px solid rgba(108, 247, 255, 0.24);
            height: 12px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #5af6ff, #a2ffff 45%, #ffb761 100%);
            transition: width 0.2s;
            box-shadow: 0 0 12px rgba(108, 247, 255, 0.42);
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--color-pri); }
            100% { opacity: 0.8; }
        }

        .anim-pulse {
            animation: pulse 2s infinite;
        }

        .hud-chip,
        .brief-label,
        .screen-subtitle {
            font-family: var(--font-ui);
            letter-spacing: 0.14em;
        }

        .title-brand,
        .score-display,
        .panel-title {
            font-family: var(--font-display);

        .hud-chip {
            padding: 0.28rem 0.6rem;
            border: 1px solid rgba(108, 247, 255, 0.25);

            background: rgba(6, 23, 41, 0.78);

        }

        .brief-label {
            color: rgba(232, 253, 255, 0.72);
        }

        .screen-subtitle {
            color: rgba(232, 253, 255, 0.84);
        }

        .feedback-gif-stack {
            position: absolute;
            right: max(0.75rem, env(safe-area-inset-right));
            bottom: max(5.5rem, calc(env(safe-area-inset-bottom) + 5rem));
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6rem;
            z-index: 18;
            pointer-events: none;
        }

        .feedback-gif {
            width: clamp(84px, 22vw, 120px);
            border-radius: 14px;
            border: 1px solid rgba(108, 247, 255, 0.4);
            background: rgba(4, 17, 31, 0.7);
            box-shadow: 0 0 16px rgba(108, 247, 255, 0.16);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.damage {
            border-color: rgba(248, 113, 113, 0.65);
            box-shadow: 0 0 18px rgba(248, 113, 113, 0.22);
        }

        .feedback-gif.victory {
            border-color: rgba(108, 247, 255, 0.75);
        }

<script>
/**
 * ORBIT PATROL: DEBRIS SWEEP
 * Single-file implementation
 */

const CONFIG = {
    winScore: 2500,
    playerSpeed: 1.5,
    fireRate: 150,
    colors: {
        pri: '#ffb000',
        sec: '#ff4400',
        bg: '#0a0a0a'
    }
};

// --- Audio System ---
const AudioSys = {
    ctx: null,
    buffers: {},
    lastPlayedAt: {},
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            [
                'sfx_laser',
                'sfx_hit',
                'sfx_explode',
                'sfx_damage',
                'sfx_warning',
                'sfx_start',
                'sfx_pause',
                'sfx_resume',
                'sfx_win',
                'sfx_die'
            ].forEach(id => this.load(id));
        }
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },
    async load(id) {
        const el = document.getElementById(id);
        if (!el || !this.ctx) return;
        try {
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(buf);
        } catch (e) {}
    },
    playBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.2;
            el.play().catch(() => {});
        }
    },
    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    },
    play(id, options = {}) {
        if (!this.ctx) return;
        const { volume = 0.22, debounceMs = 0 } = options;
        const now = performance.now();
        if (debounceMs && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < debounceMs) return;
        this.lastPlayedAt[id] = now;

        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[id];
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.type = id.includes('warning') ? 'square' : 'sawtooth';
            osc.frequency.setValueAtTime(id.includes('damage') ? 120 : 220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.18);
            g.gain.setValueAtTime(volume * 0.8, this.ctx.currentTime);
            g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
};

const FeedbackFx = {
    timers: {},
    show(id, duration = 1400) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => el.classList.remove('visible'), duration);
    },
    hideAll() {
        ['gif-damage', 'gif-victory'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('visible');
            clearTimeout(this.timers[id]);
        });
    }
};

// --- Game Engine ---
const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d', { alpha: false }),
    width: 0, height: 0,
    state: 'START', // START, PLAY, PAUSED, OVER
    lastTime: 0,

    // Entities
    player: { x:0, y:0, w:48, h:48, hp:100, maxHp:100, lastFire:0 },
    bullets: [],
    enemies: [],
    particles: [],
    stars: [],

    // State
    score: 0,
    shake: 0,
    spawnTimer: 0,
    gridOffset: 0,
    warningPlayed: false,

    // Input
    input: { active: false, x: 0, y: 0, lastX: 0, lastY: 0 },

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.bindInput();

        // Stars background
        for(let i=0; i<50; i++) {
            this.stars.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                s: Math.random() * 2,
                v: 0.5 + Math.random()
            });
        }

        requestAnimationFrame(t => this.loop(t));
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        if (this.state === 'START') {
            this.player.x = this.width / 2;
            this.player.y = this.height - 150;
        }
    },

    bindInput() {
        const onDown = (x, y) => {
            if (this.state !== 'PLAY') return;
            this.input.active = true;
            this.input.lastX = x;
            this.input.lastY = y;
        };
        const onMove = (x, y) => {
            if (!this.input.active) return;
            const dx = x - this.input.lastX;
            const dy = y - this.input.lastY;

            this.player.x += dx * CONFIG.playerSpeed;
            this.player.y += dy * CONFIG.playerSpeed;

            // Clamp
            this.player.x = Math.max(24, Math.min(this.width - 24, this.player.x));
            this.player.y = Math.max(24, Math.min(this.height - 24, this.player.y));

            this.input.lastX = x;
            this.input.lastY = y;
        };
        const onUp = () => { this.input.active = false; };

        this.canvas.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
        this.canvas.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.clientX, e.clientY); });
        this.canvas.addEventListener('pointerup', e => { e.preventDefault(); onUp(); });
        this.canvas.addEventListener('pointercancel', e => { e.preventDefault(); onUp(); });
        this.canvas.addEventListener('pointerleave', e => { e.preventDefault(); onUp(); });
    },

    start() {
        AudioSys.init();
        AudioSys.play('sfx_start', { volume: 0.2, debounceMs: 150 });
        AudioSys.playBgm();
        FeedbackFx.hideAll();
        this.state = 'PLAY';
        this.score = 0;
        this.player.hp = 100;
        this.player.x = this.width / 2;
        this.player.y = this.height - 150;
        this.enemies = [];
        this.bullets = [];
        this.particles = [];
        this.shake = 0;
        this.warningPlayed = false;

        this.updateUI();
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-end').classList.add('hidden');
        document.getElementById('screen-pause').classList.add('hidden');
        document.getElementById('hud-top').classList.remove('hidden');
        document.getElementById('hud-bottom').classList.remove('hidden');
    },

    pause() {
        if (this.state === 'PLAY') {
            this.state = 'PAUSED';
            AudioSys.play('sfx_pause', { volume: 0.2, debounceMs: 120 });
            AudioSys.stopBgm();
            document.getElementById('screen-pause').classList.remove('hidden');
        } else if (this.state === 'PAUSED') {
            this.state = 'PLAY';
            AudioSys.play('sfx_resume', { volume: 0.2, debounceMs: 120 });
            AudioSys.playBgm();
            document.getElementById('screen-pause').classList.add('hidden');
        }
    },

    end(win) {
        this.state = 'OVER';
        AudioSys.stopBgm();
        FeedbackFx.hideAll();
        if (win) {
            AudioSys.play('sfx_win', { volume: 0.24, debounceMs: 200 });
            FeedbackFx.show('gif-victory', 2600);
        } else {
            AudioSys.play('sfx_die', { volume: 0.24, debounceMs: 200 });
            FeedbackFx.show('gif-damage', 2200);
        }

        const title = document.getElementById('end-title');
        const reason = document.getElementById('end-reason');

        if (win) {
            title.innerText = "ORBIT CLEARED";
            title.style.color = CONFIG.colors.pri;
            reason.innerText = "DEBRIS FIELD CONTAINED";
            reason.style.color = CONFIG.colors.pri;
        } else {
            title.innerText = "SWEEP LOST";
            title.style.color = CONFIG.colors.sec;
            reason.innerText = "SHIELD NET COLLAPSED";
            reason.style.color = CONFIG.colors.sec;
        }

        document.getElementById('end-score').innerText = this.score;
        document.getElementById('hud-top').classList.add('hidden');
        document.getElementById('hud-bottom').classList.add('hidden');
        document.getElementById('screen-end').classList.remove('hidden');
    },

    spawnEnemy() {
        const size = 40;
        this.enemies.push({
            x: Math.random() * (this.width - size) + size/2,
            y: -50,
            w: size, h: size,
            hp: 2 + Math.floor(this.score / 500),
            vx: (Math.random() - 0.5) * 50,
            vy: 100 + (this.score * 0.05)
        });
    },

    explode(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 100 + 50;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    },

    update(dt) {
        if (this.state !== 'PLAY') return;

        // Auto Fire
        const now = performance.now();
        if (now - this.player.lastFire > CONFIG.fireRate) {
            this.bullets.push({ x: this.player.x, y: this.player.y - 20, w: 4, h: 16, vy: -800 });
            this.player.lastFire = now;
            AudioSys.play('sfx_laser', { volume: 0.08, debounceMs: 90 });
        }

        // Spawning
        this.spawnTimer += dt * 1000;
        const rate = Math.max(500, 1200 - this.score * 0.5);
        if (this.spawnTimer > rate) {
            this.spawnEnemy();
            this.spawnTimer = 0;
        }

        // Update Bullets
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i];
            b.y += b.vy * dt;
            if (b.y < -50) this.bullets.splice(i, 1);
        }

        // Update Enemies
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            let e = this.enemies[i];
            e.y += e.vy * dt;
            e.x += e.vx * dt;
            if (e.x < e.w/2 || e.x > this.width - e.w/2) e.vx *= -1;

            if (e.y > this.height + 50) {
                this.enemies.splice(i, 1);
                continue;
            }

            // Collision: Player
            const dist = Math.hypot(e.x - this.player.x, e.y - this.player.y);
            if (dist < 40) {
                this.explode(e.x, e.y, CONFIG.colors.sec, 15);
                this.player.hp -= 30;
                this.shake = 20;
                AudioSys.play('sfx_damage', { volume: 0.22, debounceMs: 180 });
                FeedbackFx.show('gif-damage', 900);
                this.enemies.splice(i, 1);
                this.updateUI();
                if (this.player.hp <= 0) this.end(false);
                continue;
            }

            // Collision: Bullets
            for (let j = this.bullets.length - 1; j >= 0; j--) {
                let b = this.bullets[j];
                if (Math.abs(b.x - e.x) < e.w/2 + 5 && Math.abs(b.y - e.y) < e.h/2 + 10) {
                    e.hp--;
                    this.bullets.splice(j, 1);
                    this.explode(b.x, b.y, '#fff', 3);

                    if (e.hp <= 0) {
                        this.explode(e.x, e.y, CONFIG.colors.pri, 10);
                        this.enemies.splice(i, 1);
                        this.score += 50;
                        AudioSys.play('sfx_explode', { volume: 0.18, debounceMs: 80 });
                        this.updateUI();
                        if (this.score >= CONFIG.winScore) this.end(true);
                    } else {
                        AudioSys.play('sfx_hit', { volume: 0.12, debounceMs: 40 });
                    }
                    break;
                }
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Shake
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 60);
    },

    updateUI() {
        document.getElementById('score-val').innerText = this.score.toString().padStart(4, '0');
        const hpPct = Math.max(0, this.player.hp);
        document.getElementById('hp-text').innerText = hpPct + '%';
        document.getElementById('hp-bar').style.width = hpPct + '%';

        if (hpPct < 30) {
            document.getElementById('hp-bar').style.backgroundColor = CONFIG.colors.sec;
            if (!this.warningPlayed && this.state === 'PLAY') {
                AudioSys.play('sfx_warning', { volume: 0.15, debounceMs: 700 });
                this.warningPlayed = true;
                FeedbackFx.show('gif-damage', 1100);
            }
        } else {
            document.getElementById('hp-bar').style.backgroundColor = '';
            this.warningPlayed = false;
        }
    },

    draw() {
        // Clear
        this.ctx.fillStyle = CONFIG.colors.bg;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Shake
        this.ctx.save();
        if (this.shake > 0) {
            this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        }

        // Grid
        this.gridOffset = (this.gridOffset + 2) % 40;
        this.ctx.strokeStyle = '#221100';
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        // Verticals
        for(let x=0; x<this.width; x+=40) {
            this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.height);
        }
        // Horizontals
        for(let y=this.gridOffset; y<this.height; y+=40) {
            this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y);
        }
        this.ctx.stroke();

        // Stars
        this.ctx.fillStyle = '#664400';
        this.stars.forEach(s => {
            s.y += s.v * (this.state === 'PLAY' ? 4 : 0.5);
            if(s.y > this.height) s.y = 0;
            this.ctx.fillRect(s.x, s.y, s.s, s.s);
        });

        // Bullets
        const imgBullet = document.getElementById('asset_bullet');
        this.bullets.forEach(b => {
            this.ctx.drawImage(imgBullet, b.x - 2, b.y - 8, 4, 16);
        });

        // Enemies
        const imgEnemy = document.getElementById('asset_enemy');
        this.enemies.forEach(e => {
            this.ctx.drawImage(imgEnemy, e.x - e.w/2, e.y - e.h/2, e.w, e.h);
        });

        // Player
        if (this.state === 'PLAY' || this.state === 'PAUSED') {
            const imgPlayer = document.getElementById('asset_player');
            this.ctx.save();
            this.ctx.translate(this.player.x, this.player.y);
            // Tilt
            if (this.input.active) {
                const tilt = (this.input.x - this.input.lastX) * 0.02;
                this.ctx.rotate(Math.max(-0.2, Math.min(0.2, tilt)));
            }
            this.ctx.drawImage(imgPlayer, -24, -24, 48, 48);

            // Engine Glow
            this.ctx.fillStyle = CONFIG.colors.pri;
            this.ctx.globalAlpha = 0.6 + Math.random()*0.4;
            this.ctx.beginPath();
            this.ctx.moveTo(-6, 20);
            this.ctx.lineTo(0, 35 + Math.random()*10);
            this.ctx.lineTo(6, 20);
            this.ctx.fill();
            this.ctx.restore();
        }

        // Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;
        this.ctx.restore();
    },

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        if (this.state !== 'PAUSED') {
            this.update(dt);
            this.draw();
        }

        requestAnimationFrame(t => this.loop(t));
    }
};

// --- Init ---
window.addEventListener('load', () => Game.init());

document.getElementById('btn-start').addEventListener('click', () => Game.start());
document.getElementById('btn-restart').addEventListener('click', () => Game.start());
document.getElementById('btn-pause').addEventListener('click', () => Game.pause());
document.getElementById('btn-resume').addEventListener('click', () => Game.pause());
document.getElementById('btn-quit').addEventListener('click', () => {
    AudioSys.stopBgm();
    FeedbackFx.hideAll();
    Game.state = 'START';
    document.getElementById('screen-pause').classList.add('hidden');
    document.getElementById('hud-top').classList.add('hidden');
    document.getElementById('hud-bottom').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
    Game.resize();
    Game.draw();
});
</script>
