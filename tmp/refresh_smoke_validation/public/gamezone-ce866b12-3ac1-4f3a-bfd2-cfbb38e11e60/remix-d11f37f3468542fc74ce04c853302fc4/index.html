<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Meme Arcade Maker</title>
<!-- [agent-note][stage4] repaired-font/mobile: remapped body ui font to Rajdhani from catalogs/fonts.json and removed global touch suppression that could block mobile UI taps -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* §1 Visual Philosophy & Reset */
    :root {
        --theme-accent: #44f2ff;
        --theme-accent-2: #8b5cf6;
        --theme-danger: #ff5d8f;
        --theme-success: #70f7a8;
        --theme-bg: #07111f;
        --theme-bg-deep: #040914;
        --panel-bg: rgba(8, 18, 34, 0.94);
        --glass-bg: rgba(14, 30, 54, 0.84);
        --line-soft: rgba(122, 226, 255, 0.18);
        --line-strong: rgba(122, 226, 255, 0.38);
        --text-main: #eff8ff;
        --text-soft: #d7e7ff;
        --text-muted: #91a9c7;
        --violet-300: #b794ff;
        --green-400: #70f7a8;
        --panel-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
        --panel-glow: 0 0 24px rgba(68, 242, 255, 0.14);
        --grid-line: rgba(84, 177, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(68, 242, 255, 0.12), transparent 34%),
            radial-gradient(circle at bottom, rgba(139, 92, 246, 0.18), transparent 30%),
            linear-gradient(180deg, var(--theme-bg), var(--theme-bg-deep));
        color: var(--text-main);
        font-family: 'Rajdhani', system-ui, sans-serif;
    }
    body {
        position: relative;
        background-attachment: fixed;
    }
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(84, 177, 255, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(84, 177, 255, 0.05) 1px, transparent 1px);
        background-size: 100% 56px, 56px 100%;
        opacity: 0.34;
        mix-blend-mode: screen;
    }
    canvas {
        display: block;
        touch-action: none;
        filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.28));
    }
    button {
        font: inherit;
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
    }
    h1, #panel-title {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        text-transform: uppercase;
    }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    #header {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        width: 100%;
        height: calc(56px + env(safe-area-inset-top, 0px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 0px) 16px 0;
    }
    #viewport {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 20%, rgba(68, 242, 255, 0.12), transparent 36%),
            linear-gradient(180deg, rgba(10, 23, 42, 0.92), rgba(4, 9, 20, 0.98));
    }
    #gallery-view {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        padding: 64px 16px 16px;
        overflow-y: auto;
        background:
            radial-gradient(circle at top, rgba(68, 242, 255, 0.09), transparent 24%),
            linear-gradient(180deg, rgba(7, 17, 31, 0.96), rgba(4, 9, 20, 0.98));
    }
    #gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding-bottom: 80px;
    }
    #btn-add-project {
        position: absolute;
        left: 50%;
        bottom: calc(32px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 20;
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--theme-accent), var(--theme-accent-2));
        color: #06101d;
        font-size: 2rem;
        font-weight: 700;
        box-shadow: 0 18px 36px rgba(68, 242, 255, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.32);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    #btn-add-project:active { transform: translateX(-50%) scale(0.92); }
    #editor-toolbar {
        position: absolute;
        bottom: 0;
        left: 0;
        z-index: 20;
        width: 100%;
        height: calc(80px + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 8px env(safe-area-inset-bottom, 0px);
        transition: transform 0.3s ease;
    }
    .tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px;
        color: var(--text-muted);
        min-width: 56px;
        transition: transform 0.16s ease, color 0.16s ease, filter 0.16s ease;
    }
    .tool-btn span:last-child { font-size: 10px; }
    .tool-icon-box {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 1px solid currentColor;
        box-shadow: inset 0 0 12px rgba(68, 242, 255, 0.12);
    }
    .tool-icon-svg {
        width: 24px;
        height: 24px;
        display: block;
    }
    #asset-panel {
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 30;
        width: 100%;
        height: min(40vh, 420px);
        min-height: 260px;
        display: flex;
        flex-direction: column;
        border-radius: 24px 24px 0 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        transition: transform 0.3s ease;
    }
    #asset-panel-header {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid rgba(51, 65, 85, 1);
    }
    #panel-title {
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--text-soft);
        letter-spacing: 0.06em;
    }
    #btn-close-panel {
        padding: 8px;
        color: var(--text-muted);
        font-size: 1rem;
    }
    #panel-content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        align-content: start;
    }
    #btn-back, #btn-save {
        padding: 8px;
        transition: opacity 0.2s ease;
    }
    #app-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--theme-accent);
        text-align: center;
        text-shadow: 0 0 16px rgba(68, 242, 255, 0.35);
    }
    #btn-save {
        color: var(--green-400);
        font-weight: 700;
        letter-spacing: 0.08em;
    }
    .glass {
        background: linear-gradient(180deg, rgba(15, 33, 57, 0.88), rgba(9, 21, 39, 0.92));
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--line-soft);
        box-shadow: var(--panel-shadow);
    }
    .panel-glass {
        background:
            linear-gradient(180deg, rgba(11, 24, 43, 0.97), rgba(6, 14, 28, 0.98)),
            radial-gradient(circle at top, rgba(68, 242, 255, 0.08), transparent 40%);
        backdrop-filter: blur(16px);
        box-shadow: var(--panel-shadow), var(--panel-glow);
        border: 1px solid rgba(122, 226, 255, 0.16);
        border-bottom: 0;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .btn-active {
        background: linear-gradient(135deg, rgba(68, 242, 255, 0.18), rgba(139, 92, 246, 0.24));
        color: var(--theme-accent);
        transform: scale(0.95);
        filter: brightness(1.15);
    }
    .color-swatch { border: 2px solid rgba(255,255,255,0.2); transition: transform 0.1s; }
    .color-swatch.active { border-color: white; transform: scale(1.1); }
    .hidden { display: none !important; }
    .opacity-0 { opacity: 0; }
    .pointer-events-none { pointer-events: none; }
    .translate-y-full { transform: translateY(100%); }
    .animate-pulse { animation: pulse 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pulse { from { opacity: 0.85; } to { opacity: 0; } }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    #header,
    #editor-toolbar,
    #asset-panel {
        border-color: var(--line-soft);
    }
    #header::after,
    #editor-toolbar::before,
    #asset-panel::before {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
        pointer-events: none;
    }
    #header::after {
        bottom: 0;
    }
    #editor-toolbar::before,
    #asset-panel::before {
        top: 0;
    }
    #editor-toolbar .tool-btn:active,
    #btn-add-project:hover,
    #btn-save:hover,
    #btn-back:hover {
        filter: brightness(1.12);
    }
    #editor-toolbar .tool-btn:active {
        transform: translateY(-1px) scale(0.96);
    }
    #panel-content button,
    #gallery-grid > div,
    #btn-save,
    #btn-back,
    #btn-close-panel {
        transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }
    #panel-content button {
        border-radius: 14px;
        background: rgba(19, 37, 63, 0.8);
        border: 1px solid rgba(122, 226, 255, 0.14);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    #panel-content button:active,
    #gallery-grid > div:active {
        transform: scale(0.96);
    }
    #gallery-grid > div {
        background:
            radial-gradient(circle at top, rgba(68, 242, 255, 0.08), transparent 50%),
            linear-gradient(180deg, rgba(16, 31, 53, 0.92), rgba(9, 18, 31, 0.96));
        border: 1px solid rgba(122, 226, 255, 0.18);
        box-shadow: var(--panel-shadow);
    }
    #gallery-hint,
    #editor-hint {
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(7, 17, 31, 0.72);
        border: 1px solid rgba(122, 226, 255, 0.12);
        box-shadow: var(--panel-glow);
    }
    #media-feedback {
        position: absolute;
        inset: 68px 16px auto;
        z-index: 18;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        pointer-events: none;
    }
    .feedback-gif {
        width: min(26vw, 120px);
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        object-fit: cover;
        opacity: 0;
        transform: translateY(-10px) scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
        border: 1px solid rgba(122, 226, 255, 0.26);
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.35);
        background: rgba(6, 14, 28, 0.88);
    }
    .feedback-gif.is-active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }
    #combo-toast {
        position: absolute;
        right: 16px;
        bottom: 104px;
        z-index: 25;
        max-width: min(52vw, 220px);
        padding: 10px 12px;
        border-radius: 16px;
        border: 1px solid rgba(112, 247, 168, 0.28);
        background: linear-gradient(180deg, rgba(8, 24, 18, 0.94), rgba(7, 17, 31, 0.94));
        color: var(--green-400);
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: 0.76rem;
        line-height: 1.35;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.32);
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
    }
    #combo-toast.is-active {
        opacity: 1;
        transform: translateY(0);
    }
    @media (max-width: 640px) {
        #media-feedback {
            inset: 64px 12px auto;
            gap: 8px;
        }
        .feedback-gif {
            width: min(24vw, 92px);
            border-radius: 14px;
        }
        #combo-toast {
            right: 12px;
            bottom: 96px;
            max-width: 58vw;
            font-size: 0.68rem;
        }
    }
</style>
</head>

];
const FILTERS = [
    'none', 'grayscale(1)', 'sepia(1)', 'saturate(2)', 'hue-rotate(90deg)', 'invert(1)', 
    'opacity(0.5)', 'brightness(1.5)', 'contrast(2)', 'blur(5px)', 
    'sepia(0.5) hue-rotate(-30deg) saturate(1.2)', 'contrast(1.5) brightness(0.8)', 
    'grayscale(1) contrast(3)', 'hue-rotate(180deg)', 'saturate(0)', 'blur(2px) contrast(1.2)',
    'brightness(0.5) sepia(1)', 'invert(0.8) hue-rotate(180deg)', 'saturate(3) hue-rotate(45deg)', 'grayscale(0.5) sepia(0.5)'
];

// Audio System
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const sfxBuffers = {};
const sfxCooldowns = {};
const gifTimers = {};
const bgmEl = document.getElementById('bgm_main');
const gifHype = document.getElementById('gif-hype');
const gifFail = document.getElementById('gif-fail');
const comboToast = document.getElementById('combo-toast');
const sfxElements = {
    click: document.getElementById('sfx_click'),
    save: document.getElementById('sfx_save'),
    panelOpen: document.getElementById('sfx_panel_open'),
    panelClose: document.getElementById('sfx_panel_close'),
    pickup: document.getElementById('sfx_pickup'),
    fail: document.getElementById('sfx_fail')
};
bgmEl.volume = 0.2;

async function initAudio() {
    return Promise.resolve();
}

function ensureAudioReady() {
    if (audioCtx?.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    if (bgmEl.paused) {
        bgmEl.play().catch(() => {});
    }
}

function setBgmState(shouldPlay) {
    if (shouldPlay) {
        ensureAudioReady();
    } else if (!bgmEl.paused) {
        bgmEl.pause();
    }
}

function playSfx(id, options = {}) {
    const { cooldown = 0, fallbackFreq = 600, gainLevel = 0.08 } = options;
    const now = performance.now();
    if (cooldown && sfxCooldowns[id] && now - sfxCooldowns[id] < cooldown) return;
    sfxCooldowns[id] = now;

    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }

    if (sfxBuffers[id]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = sfxBuffers[id];
        gain.gain.value = gainLevel;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        const mediaEl = sfxElements[id];
        if (mediaEl) {
            const instance = mediaEl.cloneNode();
            instance.volume = Math.min(gainLevel * 2.4, 0.2);
            instance.play().catch(() => {});
        } else {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(fallbackFreq, audioCtx.currentTime);
            gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.14);
        }
    }
}

function flashGif(el, duration = 1600) {
    if (!el) return;
    el.classList.add('is-active');
    clearTimeout(gifTimers[el.id]);
    gifTimers[el.id] = setTimeout(() => {
        el.classList.remove('is-active');
    }, duration);
}

function showToast(message, duration = 1500) {
    if (!comboToast) return;
    comboToast.textContent = message;
    comboToast.classList.add('is-active');
    clearTimeout(gifTimers.toast);
    gifTimers.toast = setTimeout(() => {
        comboToast.classList.remove('is-active');
    }, duration);
}

function vibrate(style = 'light') {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 50 : 10);
    }
}

// Project Management
function loadProjects() {
    try {
        const raw = localStorage.getItem('meme_arcade_projects');
        projects = raw ? JSON.parse(raw) : [];
    } catch(e) { projects = []; }
    renderGallery();
}

function saveProjects() {
    localStorage.setItem('meme_arcade_projects', JSON.stringify(projects));
}

function createNewProject() {
    return {
        id: Date.now(),
        bg: { type: 'color', val: '#1e293b' },
        layers: [], // { type: 'sticker'|'doodle'|'overlay', val, x, y, s, r, color, points }
        filter: 'none',
        thumbnail: null
    };
}

// Rendering Engine
function renderProject(proj, ctxTarget = ctx, w = LOGICAL_W, h = LOGICAL_H) {
    // 1. Background
    if (proj.bg.type === 'color') {
        ctxTarget.fillStyle = proj.bg.val;
        ctxTarget.fillRect(0, 0, w, h);
    } else if (proj.bg.type === 'image' && proj.bg.imgData) {
        // Image rendering requires loaded Image object. 
        // For simplicity in this constrained env, we assume bg.imgData is DataURL.
        // We need a cache or synchronous draw. 
        // Since we are in a loop, we can draw the cached image.
        if (!proj.bg._img) {
            const img = new Image();
            img.src = proj.bg.imgData;
            proj.bg._img = img;
        }
        if (proj.bg._img.complete) {
            drawImageCover(ctxTarget, proj.bg._img, w, h);
        }
    }

    // 2. Layers
    proj.layers.forEach(layer => {
        ctxTarget.save();
        if (layer.type === 'sticker' || layer.type === 'overlay') {
            ctxTarget.translate(layer.x, layer.y);
            ctxTarget.rotate(layer.r);
            ctxTarget.scale(layer.s, layer.s);
            ctxTarget.font = `${layer.type === 'overlay' ? 400 : 150}px serif`;
            ctxTarget.textAlign = 'center';
            ctxTarget.textBaseline = 'middle';
            if (layer.type === 'overlay') ctxTarget.globalCompositeOperation = 'overlay';
            ctxTarget.fillText(layer.val, 0, 0);
        } else if (layer.type === 'doodle') {
            ctxTarget.strokeStyle = layer.color;
            ctxTarget.lineWidth = layer.size;
            ctxTarget.lineCap = 'round';
            ctxTarget.lineJoin = 'round';
            ctxTarget.beginPath();
            if (layer.points.length > 0) {
                ctxTarget.moveTo(layer.points[0].x, layer.points[0].y);
                for (let i = 1; i < layer.points.length; i++) {
                    ctxTarget.lineTo(layer.points[i].x, layer.points[i].y);
                }
            }
            ctxTarget.stroke();
        }
        ctxTarget.restore();
    });

    // 3. Selection Highlight
    if (gameState === 'EDITOR' && selectedEntityId !== null) {
        const ent = proj.layers.find(l => l.id === selectedEntityId);
        if (ent && (ent.type === 'sticker' || ent.type === 'overlay')) {
            ctxTarget.save();
            ctxTarget.translate(ent.x, ent.y);
            ctxTarget.rotate(ent.r);
            ctxTarget.strokeStyle = '#8b5cf6';
            ctxTarget.lineWidth = 4;
            ctxTarget.strokeRect(-100 * ent.s, -100 * ent.s, 200 * ent.s, 200 * ent.s);
            ctxTarget.restore();
        }
    }
}

function drawImageCover(ctx, img, w, h) {
    const ratio = Math.max(w / img.width, h / img.height);
    const centerShift_x = (w - img.width * ratio) / 2;
    const centerShift_y = (h - img.height * ratio) / 2;
    ctx.drawImage(img, 0, 0, img.width, img.height, centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
}

// Game Loop
function loop() {
    if (!initialized) return;

    // Clear Screen
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'EDITOR' && currentProject) {
        // Setup Logical Transform
        ctx.setTransform(scaleFactor * dpr, 0, 0, scaleFactor * dpr, offsetX * dpr, offsetY * dpr);
        
        // Clip to logical area
        ctx.beginPath();
        ctx.rect(0, 0, LOGICAL_W, LOGICAL_H);
        ctx.clip();

        // Apply Global Filter (Simulated via layer)
        // Note: Real-time full-screen filter is expensive in canvas without WebGL or offscreen.
        // We will use ctx.filter if supported, else skip.
        if (currentProject.filter !== 'none') {
            ctx.filter = currentProject.filter;
        } else {
            ctx.filter = 'none';
        }

        renderProject(currentProject);
        
        ctx.filter = 'none'; // Reset
    }

    requestAnimationFrame(loop);
}

// Input Handling
let isDragging = false;
let lastX = 0, lastY = 0;

function handleInput(e) {
    ensureAudioReady();
    
    if (gameState !== 'EDITOR') return;

    const rect = canvas.getBoundingClientRect();
    // Convert to logical coordinates
    const lx = (e.clientX - rect.left - offsetX) / scaleFactor;
    const ly = (e.clientY - rect.top - offsetY) / scaleFactor;

    if (e.type === 'pointerdown') {
        if (activeTool === 'doodle') {
            isDragging = true;
            // Start new doodle layer
            const newLayer = {
                id: Date.now(),
                type: 'doodle',
                color: currentBrushColor,
                size: 15,
                points: [{x: lx, y: ly}]
            };
            currentProject.layers.push(newLayer);
            selectedEntityId = newLayer.id;
        } else {
            // Hit Test for Manipulation
            // Search reverse
            let hit = false;
            for (let i = currentProject.layers.length - 1; i >= 0; i--) {
                const l = currentProject.layers[i];
                if (l.type === 'sticker' || l.type === 'overlay') {
                    const dx = lx - l.x;
                    const dy = ly - l.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 100 * l.s) { // Approx hit radius
                        selectedEntityId = l.id;
                        isDragging = true;
                        hit = true;
                        // Bring to front
                        currentProject.layers.splice(i, 1);
                        currentProject.layers.push(l);
                        playSfx('pickup', { cooldown: 90, fallbackFreq: 740, gainLevel: 0.07 });
                        flashGif(gifHype, 900);
                        break;
                    }
                }
            }
            if (!hit) {
                selectedEntityId = null;
                isDragging = false;
            }
        }
        lastX = lx;
        lastY = ly;
    } else if (e.type === 'pointermove') {
        if (!isDragging) return;
        
        if (activeTool === 'doodle') {
            const layer = currentProject.layers.find(l => l.id === selectedEntityId);
            if (layer) layer.points.push({x: lx, y: ly});
        } else if (selectedEntityId) {
            const layer = currentProject.layers.find(l => l.id === selectedEntityId);
            if (layer) {
                layer.x += (lx - lastX);
                layer.y += (ly - lastY);
            }
        }
        lastX = lx;
        lastY = ly;
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        isDragging = false;
    }
}

// UI Logic
let currentBrushColor = '#ffffff';

function setupUI() {
    // Gallery
    document.getElementById('btn-add-project').onclick = () => {
        ensureAudioReady();
        playSfx('panelOpen', { cooldown: 120, fallbackFreq: 720, gainLevel: 0.08 });
        currentProject = createNewProject();
        enterEditor();
        showToast('Fresh meme slot ready');
    };

    // Editor Header
    document.getElementById('btn-back').onclick = () => {
        playSfx('panelClose', { cooldown: 120, fallbackFreq: 360, gainLevel: 0.08 });
        saveCurrentProject();
        exitEditor();
    };
    document.getElementById('btn-save').onclick = () => {
        playSfx('save', { cooldown: 180, fallbackFreq: 920, gainLevel: 0.09 });
        saveCurrentProject();
        vibrate('medium');
        flashGif(gifHype, 1800);
        showToast('Post uploaded to local gallery');
        // Flash effect
        const flash = document.createElement('div');
        flash.className = 'absolute inset-0 bg-white z-50 pointer-events-none animate-pulse';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    };

    // Toolbar
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.onclick = () => {
            playSfx('panelOpen', { cooldown: 120, fallbackFreq: 680, gainLevel: 0.08 });
            const tool = btn.dataset.tool;
            openAssetPanel(tool);
        };
    });

    document.getElementById('btn-close-panel').onclick = () => {
        playSfx('panelClose', { cooldown: 120, fallbackFreq: 320, gainLevel: 0.08 });
        closeAssetPanel();
    };

    // File Upload
    document.getElementById('file-upload').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
             reader.onload = (evt) => {
                 currentProject.bg = { type: 'image', imgData: evt.target.result, _img: null };
                 playSfx('pickup', { cooldown: 150, fallbackFreq: 860, gainLevel: 0.08 });
                 flashGif(gifHype, 1100);
                 showToast('Photo stage loaded');
             };
            reader.readAsDataURL(file);
        }
    };

    // Canvas Input
    canvas.addEventListener('pointerdown', handleInput, {passive: false});
    window.addEventListener('pointermove', handleInput, {passive: false});
    window.addEventListener('pointerup', handleInput, {passive: false});
}

function enterEditor() {
    gameState = 'EDITOR';
    document.getElementById('gallery-view').classList.add('hidden');
    document.getElementById('btn-add-project').classList.add('hidden');
    document.getElementById('editor-toolbar').classList.remove('translate-y-full');
    document.getElementById('btn-back').classList.remove('opacity-0', 'pointer-events-none');
    document.getElementById('btn-save').classList.remove('opacity-0', 'pointer-events-none');
    document.getElementById('gallery-hint').classList.add('hidden');
    document.getElementById('editor-hint').classList.remove('hidden');
    setBgmState(true);
    
    // Reset View
    resize();
}

function exitEditor() {
    gameState = 'GALLERY';
    document.getElementById('gallery-view').classList.remove('hidden');
    document.getElementById('btn-add-project').classList.remove('hidden');
    document.getElementById('editor-toolbar').classList.add('translate-y-full');
    document.getElementById('btn-back').classList.add('opacity-0', 'pointer-events-none');
    document.getElementById('btn-save').classList.add('opacity-0', 'pointer-events-none');
    document.getElementById('gallery-hint').classList.remove('hidden');
    document.getElementById('editor-hint').classList.add('hidden');
    closeAssetPanel();
    setBgmState(false);
    loadProjects();
}

function saveCurrentProject() {
    if (!currentProject) return;
    // Update thumbnail (simple color or placeholder text for now to save perf/space)
    // In real app, render to small canvas and toDataURL
    const idx = projects.findIndex(p => p.id === currentProject.id);
    if (idx >= 0) projects[idx] = currentProject;
    else projects.unshift(currentProject);
    saveProjects();
}

function renderGallery() {
    const grid = document.getElementById('gallery-grid');
    grid.innerHTML = '';
    projects.forEach(p => {
        const div = document.createElement('div');
        div.className = 'aspect-[9/16] bg-slate-800 rounded-lg overflow-hidden relative border border-slate-700 active:scale-95 transition-transform';
        
        // Preview
        if (p.bg.type === 'color') {
            div.style.backgroundColor = p.bg.val;
        } else {
            div.style.backgroundImage = `url(${p.bg.imgData})`;
            div.style.backgroundSize = 'cover';
        }
        
        // Count badge
        const badge = document.createElement('div');
        badge.className = 'absolute bottom-2 right-2 bg-black/50 px-2 py-1 rounded text-xs text-white';
        badge.innerText = `${p.layers.length} bits`;
        div.appendChild(badge);

        div.onclick = () => {
            playSfx('click');
            currentProject = p;
            // Restore images
            if (p.bg.type === 'image') p.bg._img = null;
            enterEditor();
        };
        grid.appendChild(div);
    });
}

function openAssetPanel(tool) {
    const panel = document.getElementById('asset-panel');
    const content = document.getElementById('panel-content');
    const title = document.getElementById('panel-title');
    
    content.innerHTML = '';
    panel.classList.remove('translate-y-full');
    activeTool = null; // Reset tool mode unless doodle

    if (tool === 'bg') {
        title.innerText = 'PICK A STAGE';
        // Add Photo Option
        const photoBtn = document.createElement('button');
        photoBtn.className = 'w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center text-xl';
        photoBtn.innerText = '📷';
        photoBtn.onclick = () => document.getElementById('file-upload').click();
        content.appendChild(photoBtn);
        
        // Colors
        COLORS.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'w-12 h-12 rounded-full border border-slate-600';
            btn.style.backgroundColor = c;
            btn.onclick = () => {
                currentProject.bg = { type: 'color', val: c };
                playSfx('pickup', { cooldown: 80, fallbackFreq: 780, gainLevel: 0.07 });
                flashGif(gifHype, 850);
            };
            content.appendChild(btn);
        });
    } else if (tool === 'sticker') {
        title.innerText = 'REACTIONS';
        STICKERS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'text-3xl hover:scale-125 transition-transform';
            btn.innerText = s;
            btn.onclick = () => {
                addLayer('sticker', s);
                playSfx('pickup', { cooldown: 70, fallbackFreq: 880, gainLevel: 0.08 });
                flashGif(gifHype, 1000);
                showToast('Reaction dropped');
                vibrate('light');
            };
            content.appendChild(btn);
        });
    } else if (tool === 'doodle') {
        title.innerText = 'SKETCH TONE';
        activeTool = 'doodle';
        // Eraser
        const eraser = document.createElement('button');
        eraser.className = 'w-12 h-12 bg-slate-700 rounded-full flex items-center justify-center text-xs';
        eraser.innerText = 'Eraser'; // Logic: Draw with bg color? Or delete?
        // Actually, eraser in canvas is tricky without layers. 
        // We'll just stick to colors for now, or implement 'undo'.
        // Let's add an Undo button instead of eraser for simplicity in this architecture.
        
        COLORS.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'w-12 h-12 rounded-full border border-slate-600';
            btn.style.backgroundColor = c;
            btn.onclick = () => {
                currentBrushColor = c;
                document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playSfx('pickup', { cooldown: 70, fallbackFreq: 700, gainLevel: 0.06 });
                showToast('Sketch color armed', 900);
            };
            content.appendChild(btn);
        });
    } else if (tool === 'overlay') {
        title.innerText = 'SCENE FX';
        OVERLAYS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'text-3xl opacity-80 hover:scale-125 transition-transform';
            btn.innerText = s;
            btn.onclick = () => {
                addLayer('overlay', s);
                playSfx('pickup', { cooldown: 70, fallbackFreq: 820, gainLevel: 0.08 });
                flashGif(gifHype, 1000);
                showToast('Scene effect layered');
                vibrate('light');
            };
            content.appendChild(btn);
        });
    } else if (tool === 'filter') {
        title.innerText = 'MOOD FILTERS';
        FILTERS.forEach((f, i) => {
            const btn = document.createElement('button');
            btn.className = 'w-full h-12 bg-slate-800 rounded text-xs overflow-hidden text-slate-300';
            btn.innerText = f === 'none' ? 'Normal' : `F${i}`;
            btn.style.filter = f;
            btn.onclick = () => {
                currentProject.filter = f;
                playSfx('pickup', { cooldown: 70, fallbackFreq: 620, gainLevel: 0.07 });
                if (f === 'none') {
                    flashGif(gifFail, 900);
                    showToast('Filter reset');
                } else {
                    flashGif(gifHype, 900);
                    showToast('Mood filter locked');
                }
            };
            content.appendChild(btn);
        });
    }
}

function closeAssetPanel() {
    document.getElementById('asset-panel').classList.add('translate-y-full');
    activeTool = null;
}

function addLayer(type, val) {
    const layer = {
        id: Date.now(),
        type: type,
        val: val,
        x: LOGICAL_W / 2,
        y: LOGICAL_H / 2,
        s: 1.0,
        r: 0
    };
    currentProject.layers.push(layer);
    selectedEntityId = layer.id;
}

// Initialization
function initGame() {
    if (initialized) return;
    loadProjects();
    initAudio();
    setupUI();
    requestAnimationFrame(loop);
    initialized = true;
}

// Resize Logic
function resize() {
    const cw = document.body.clientWidth;
    const ch = document.body.clientHeight;
    
    // Set actual canvas size
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';

    // Calculate scale to fit LOGICAL_W/H into cw/ch (Contain)
    const scaleX = cw / LOGICAL_W;
    const scaleY = ch / LOGICAL_H;
    scaleFactor = Math.min(scaleX, scaleY);
    
    offsetX = (cw - LOGICAL_W * scaleFactor) / 2;
    offsetY = (ch - LOGICAL_H * scaleFactor) / 2;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Lifecycle
const ro = new ResizeObserver(() => {
    resize();
    if (!initialized) initGame();
});

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.body);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            setBgmState(false);
        } else if (gameState === 'EDITOR') {
            setBgmState(true);
        }
    });
});
