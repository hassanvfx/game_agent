<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Hall Pass Dash</title>
    <!-- [agent-note][stage3] resolved-font: title->Bangers, ui->Orbitron from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap">
    <style>
        :root {
            --hallway-deep: #160f2d;
            --hallway-panel: rgba(29, 20, 57, 0.84);
            --hallway-panel-strong: rgba(41, 28, 82, 0.94);
            --hallway-panel-soft: rgba(255, 255, 255, 0.13);
            --hallway-cyan: #6df7ff;
            --hallway-cyan-strong: #2dd4ff;
            --hallway-gold: #ffd76a;
            --hallway-coral: #ff6b8d;
            --hallway-purple: #9b7cff;
            --hallway-lilac: #e9dbff;
            --hallway-ink: #120c24;
            --hallway-shadow: rgba(7, 7, 22, 0.42);
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(109, 247, 255, 0.18), transparent 30%),
                linear-gradient(180deg, #241548 0%, #120c24 100%);
            color: var(--hallway-lilac);
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        .hidden {
            display: none !important;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
            background:
                radial-gradient(circle at 50% 0%, rgba(109, 247, 255, 0.18), transparent 36%),
                linear-gradient(180deg, #25184e 0%, #140d29 100%);
        }

        .controls-layer {
            position: absolute;
            inset: 0;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }

        .glass-panel {
            background: linear-gradient(180deg, var(--hallway-panel) 0%, var(--hallway-panel-strong) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(109, 247, 255, 0.42);
            box-shadow:
                0 20px 40px var(--hallway-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem;
            text-align: center;
            width: min(90%, 360px);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .title-text {
            margin: 0 0 0.5rem;
            color: var(--hallway-gold);
            text-shadow: 0 0 18px rgba(255, 215, 106, 0.32);
            font-family: 'Bangers', impact, fantasy;
            font-size: clamp(2.2rem, 8vw, 3.4rem);
            line-height: 0.95;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--hallway-cyan);
            font-weight: 700;
            margin: 0 0 1rem;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        .section {
            margin-bottom: 1.5rem;
        }

        .helper-text {
            color: rgba(233, 219, 255, 0.8);
            font-size: 0.98rem;
            margin: 0 0 0.75rem;
        }

        .char-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .char-btn {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: inset 0 -8px 14px rgba(0, 0, 0, 0.18);
        }

        .char-btn.selected {
            border-color: var(--hallway-gold);
            box-shadow:
                0 0 0 3px rgba(255, 215, 106, 0.18),
                inset 0 -8px 14px rgba(0, 0, 0, 0.18);
            transform: scale(1.12);
        }

        .bg-blue-400 { background: #60a5fa; }
        .bg-green-400 { background: #4ade80; }
        .bg-yellow-400 { background: #facc15; }
        .bg-purple-400 { background: #c084fc; }

        .primary-btn,
        .secondary-btn {
            border: none;
            color: var(--hallway-ink);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
            pointer-events: auto;
            letter-spacing: 0.08em;
        }

        .primary-btn {
            background: linear-gradient(180deg, var(--hallway-gold), #ffae4f);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            box-shadow: 0 10px 18px rgba(255, 174, 79, 0.32);
        }

        .secondary-btn {
            background: linear-gradient(180deg, var(--hallway-cyan), var(--hallway-cyan-strong));
            padding: 0.85rem 2rem;
            font-size: 1rem;
            box-shadow: 0 10px 18px rgba(45, 212, 255, 0.22);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            filter: brightness(1.03);
            transform: scale(1.05);
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.97);
        }

        .secondary-btn:hover {
            filter: brightness(1.05);
        }

        .game-over-title {
            margin: 0 0 0.5rem;
            color: var(--hallway-coral);
            font-family: 'Bangers', impact, fantasy;
            font-size: clamp(2.2rem, 8vw, 3rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(109, 247, 255, 0.28);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .score-label {
            color: rgba(233, 219, 255, 0.65);
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            letter-spacing: 0.08em;
        }

        .score-value-large {
            color: var(--hallway-gold);
            font-size: 2.5rem;
            font-weight: 700;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 15;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(24vw, 112px);
            border-radius: 18px;
            border: 2px solid rgba(109, 247, 255, 0.35);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            object-fit: cover;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 14;
            background: rgba(17, 12, 34, 0.45);
        }

        .feedback-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #collect-gif {
            top: 5.5rem;
        }

        #crash-gif {
            bottom: 1rem;
        }

        .hud-pill,
        .mute-btn {
            background: rgba(21, 16, 44, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(109, 247, 255, 0.22);
            border-radius: 999px;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }

        .hud-pill {
            padding: 0.6rem 1rem;
        }

        .hud-label {
            color: var(--hallway-cyan);
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .hud-score {
            color: var(--white);
            font-weight: 700;
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .mute-btn {
            pointer-events: auto;
            padding: 0.65rem 0.8rem;
            font-size: 1.2rem;
            cursor: pointer;
            border-width: 0;
            color: var(--white);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(109, 247, 255, 0.16), transparent 28%),
                linear-gradient(315deg, rgba(255, 215, 106, 0.14), transparent 34%);
            pointer-events: none;
        }

        .badge-strip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: rgba(109, 247, 255, 0.12);
            border: 1px solid rgba(109, 247, 255, 0.3);
            color: var(--hallway-cyan);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-preview {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1rem;
            display: grid;
            place-items: center;
        }

        .hero-aura,
        .hero-avatar,
        .hero-shadow {
            position: absolute;
            border-radius: 50%;
        }

        .hero-shadow {
            width: 86px;
            height: 20px;
            bottom: 16px;
            background: rgba(0, 0, 0, 0.22);
            filter: blur(6px);
        }

        .hero-aura {
            width: 116px;
            height: 116px;
            background: radial-gradient(circle, color-mix(in srgb, var(--hero-color, #60a5fa) 70%, white 30%) 0%, rgba(255,255,255,0.08) 58%, transparent 72%);
            opacity: 0.9;
            animation: auraPulse 2.2s ease-in-out infinite;
        }

        .hero-avatar {
            width: 82px;
            height: 82px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--hero-color, #60a5fa) 72%, white 28%) 0%, var(--hero-color, #60a5fa) 100%);
            box-shadow:
                inset 0 -12px 0 rgba(0,0,0,0.16),
                0 0 24px color-mix(in srgb, var(--hero-color, #60a5fa) 50%, white 50%);
            animation: heroBob 1.5s ease-in-out infinite;
        }

        .hero-avatar::before {
            content: "";
            position: absolute;
            width: 46px;
            height: 18px;
            left: 18px;
            top: 18px;
            background:
                radial-gradient(circle at 12px 9px, #fff 0 7px, transparent 7.5px),
                radial-gradient(circle at 34px 9px, #fff 0 7px, transparent 7.5px);
            background-repeat: no-repeat;
        }

        .hero-avatar::after {
            content: "";
            position: absolute;
            left: 30px;
            top: 26px;
            width: 22px;
            height: 22px;
            background:
                radial-gradient(circle at 4px 7px, #140d29 0 2.5px, transparent 3px),
                radial-gradient(circle at 18px 7px, #140d29 0 2.5px, transparent 3px);
            background-repeat: no-repeat;
            border-bottom: 4px solid #140d29;
            border-radius: 0 0 20px 20px;
        }

        .hero-crown {
            position: absolute;
            top: 6px;
            width: 44px;
            height: 28px;
            background: linear-gradient(180deg, #fff0a6 0%, #ffd76a 100%);
            clip-path: polygon(0 100%, 14% 36%, 33% 74%, 50% 10%, 68% 74%, 86% 36%, 100% 100%);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.24));
            animation: heroBob 1.5s ease-in-out infinite;
        }

        @keyframes heroBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes auraPulse {
            0%, 100% { transform: scale(0.96); opacity: 0.72; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        #touch-left, #touch-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 10;
            touch-action: none;
        }

        #touch-left { left: 0; }
        #touch-right { right: 0; }

        @media (max-width: 480px) {
            .glass-panel {
                padding: 1.5rem 1.25rem;
            }

            .hud {
                padding: 1rem;
            }

            .feedback-gif {
                width: 86px;
                right: 0.65rem;
            }

            #collect-gif {
                top: 5.25rem;
            }

            #crash-gif {
                bottom: 0.75rem;
            }

            .primary-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="controls-layer" class="controls-layer hidden">
            <div id="touch-left"></div>
            <div id="touch-right"></div>
        </div>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel">
                <div class="badge-strip">🎒 Neon Hall Hero</div>
                <div class="hero-preview" id="hero-preview" style="--hero-color:#60a5fa">
                    <div class="hero-aura"></div>
                    <div class="hero-shadow"></div>
                    <div class="hero-avatar"></div>
                    <div class="hero-crown"></div>
                </div>
                <h1 class="title-text">Hall Pass<br>Dash</h1>
                <p class="subtitle">Rush to class • Dodge hallway hazards</p>

                <div class="section">
                    <p class="helper-text">Pick your runner:</p>
                    <div class="char-selector" id="char-selector">
                        <div class="char-btn bg-blue-400 selected" data-color="#60a5fa"></div>
                        <div class="char-btn bg-green-400" data-color="#4ade80"></div>
                        <div class="char-btn bg-yellow-400" data-color="#facc15"></div>
                        <div class="char-btn bg-purple-400" data-color="#c084fc"></div>
                    </div>
                </div>

                <div class="section">
                    <p class="helper-text">Tap left or right to switch lanes, avoid buses and homework, and grab hall passes.</p>
                </div>

                <button id="start-btn" class="primary-btn">
                    START RUN
                </button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel">
                <h2 class="game-over-title">BUSTED!</h2>
                <p class="helper-text">You got slowed down before the bell.</p>
                <div class="score-card">
                    <div class="score-label">Hall Pass Score</div>
                    <div id="finalScore" class="score-value-large">0</div>
                </div>
                <button id="restart-btn" class="secondary-btn">
                    Run Again
                </button>
            </div>
            
            <div id="hud" class="hud hidden">
                <div class="hud-pill">
                    <span class="hud-label">PASS SCORE:</span>
                    <span id="score" class="hud-score">0</span>
                </div>
                <button id="mute-btn" class="mute-btn">🔊</button>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/crash feedback overlays from catalogs/gifs.json -->
            <img id="collect-gif" class="feedback-gif" alt="Hall pass streak celebration" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp">
            <img id="crash-gif" class="feedback-gif" alt="Busted reaction overlay" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
        </div>
    </div>

    <script>
        /**
         * GAME CONFIGURATION & STATE
         */
        const CONFIG = {
            lanes: 3,
            laneWidthRatio: 0.25,
            baseSpeed: 400,
            maxSpeed: 1200,
            gravity: 0,
            colors: {
                road: '#fdf2f8',
                roadBorder: '#fbcfe8',
                laneLine: '#f9a8d4'
            }
        };

        const STATE = {
            active: false,
            score: 0,
            speed: CONFIG.baseSpeed,
            lastTime: 0,
            width: 0,
            height: 0,
            laneX: [],
            player: {
                lane: 1,
                x: 0,
                y: 0,
                targetX: 0,
                color: '#60a5fa',
                radius: 20,
                animTimer: 0
            },
            obstacles: [],
            particles: [],
            bgOffset: 0
        };

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                laneShift: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3"
            },
            gifs: {
                collect: "https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp",
                crash: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmNode = null;
        let isMuted = false;
        let audioInitialized = false;
        const sounds = {};
        const feedbackTimers = {};
        let lastLaneSfxAt = 0;
        let lastScoreSfxAt = 0;

        function createAudioClip(url, loop = false, volume = 0.5) {
            const audio = new Audio(url);
            audio.preload = 'auto';
            audio.loop = loop;
            audio.volume = volume;
            return audio;
        }

        async function initAudio() {
            if (audioInitialized) return;
            audioInitialized = true;
            sounds.bgm = createAudioClip(ASSETS.bgm, true, 0.2);
            sounds.laneShift = createAudioClip(ASSETS.sfx.laneShift, false, 0.22);
            sounds.collect = createAudioClip(ASSETS.sfx.collect, false, 0.5);
            sounds.score = createAudioClip(ASSETS.sfx.score, false, 0.26);
            sounds.crash = createAudioClip(ASSETS.sfx.crash, false, 0.72);
            sounds.start = createAudioClip(ASSETS.sfx.start, false, 0.32);
        }

        function showFeedbackGif(type, duration = 1200) {
            const el = document.getElementById(`${type}-gif`);
            if (!el) return;
            el.classList.add('show');
            clearTimeout(feedbackTimers[type]);
            feedbackTimers[type] = setTimeout(() => {
                el.classList.remove('show');
            }, duration);
        }

        function playSound(clip, loop = false, volume = 0.5) {
            if (isMuted || !clip) return null;

            try {
                clip.pause();
                clip.currentTime = 0;
                clip.loop = loop;
                clip.volume = loop ? Math.min(volume, 0.2) : volume;
                const playPromise = clip.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch((e) => console.warn("Audio playback failed, using fallback beep", e));
                }
                return clip;
            } catch (e) {
                console.warn("Audio playback failed, using fallback beep", e);
                return null;
            }
        }

        function playTone(freq, type = 'sine') {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            STATE.width = window.innerWidth;
            STATE.height = window.innerHeight;
            canvas.width = STATE.width;
            canvas.height = STATE.height;

            const laneStep = STATE.width * CONFIG.laneWidthRatio;
            const centerX = STATE.width / 2;
            STATE.laneX = [centerX - laneStep, centerX, centerX + laneStep];

            if (STATE.active) {
                STATE.player.targetX = STATE.laneX[STATE.player.lane];
                if (Math.abs(STATE.player.x - STATE.player.targetX) > 100) {
                    STATE.player.x = STATE.player.targetX;
                }
            }
            STATE.player.y = STATE.height - 150;
        }

        window.addEventListener('resize', resize);
        resize();

        function loop(timestamp) {
            if (!STATE.lastTime) STATE.lastTime = timestamp;
            const dt = (timestamp - STATE.lastTime) / 1000;
            STATE.lastTime = timestamp;

            if (STATE.active) {
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }
        }

        function update(dt) {
            STATE.speed = Math.min(CONFIG.maxSpeed, STATE.speed + (dt * 10));

            STATE.player.targetX = STATE.laneX[STATE.player.lane];
            const diff = STATE.player.targetX - STATE.player.x;
            STATE.player.x += diff * 15 * dt;
            STATE.player.animTimer += dt * 10;

            if (Math.random() < 1.5 * dt) {
                spawnEntity();
            }

            for (let i = STATE.obstacles.length - 1; i >= 0; i--) {
                const obs = STATE.obstacles[i];
                obs.y += STATE.speed * dt;

                const p = STATE.player;
                const dy = Math.abs(obs.y - p.y);
                const dx = Math.abs(obs.x - p.x);
                const hitDist = p.radius + obs.radius;

                if (dy < hitDist && dx < hitDist * 0.8) {
                    if (obs.type === 'bad') {
                        gameOver();
                    } else if (obs.type === 'good') {
                        STATE.score += 50;
                        updateScore();
                        spawnParticles(obs.x, obs.y, '#facc15');
                        showFeedbackGif('collect', 950);
                        if (sounds.collect) playSound(sounds.collect, false, 0.5);
                        else playTone(800, 'square');
                        STATE.obstacles.splice(i, 1);
                    }
                }

                if (obs.y > STATE.height + 50) {
                    STATE.obstacles.splice(i, 1);
                    if (obs.type === 'bad') {
                        STATE.score += 10;
                        updateScore();
                        if (performance.now() - lastScoreSfxAt > 180) {
                            if (sounds.score) playSound(sounds.score, false, 0.26);
                            lastScoreSfxAt = performance.now();
                        }
                    }
                }
            }

            for (let i = STATE.particles.length - 1; i >= 0; i--) {
                const part = STATE.particles[i];
                part.x += part.vx;
                part.y += part.vy;
                part.life -= dt;
                if (part.life <= 0) STATE.particles.splice(i, 1);
            }

            STATE.bgOffset += STATE.speed * dt;
        }

        function spawnEntity() {
            const laneIdx = Math.floor(Math.random() * 3);
            const x = STATE.laneX[laneIdx];
            const typeRand = Math.random();

            let type = 'bad';
            let color = '#ef4444';
            let radius = 25;
            let visual = 'bus';

            if (typeRand > 0.7) {
                type = 'good';
                color = '#ec4899';
                radius = 20;
                visual = 'pass';
            } else {
                if (Math.random() > 0.5) visual = 'homework';
                else visual = 'bus';
            }

            const tooClose = STATE.obstacles.some(o => Math.abs(o.y - (-50)) < 150 && o.lane === laneIdx);
            if (!tooClose) {
                STATE.obstacles.push({
                    x: x,
                    y: -100,
                    lane: laneIdx,
                    type: type,
                    color: color,
                    radius: radius,
                    visual: visual
                });
            }
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                STATE.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 200,
                    vy: (Math.random() - 0.5) * 200,
                    life: 0.5,
                    color: color
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, STATE.width, STATE.height);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, STATE.height);
            bgGradient.addColorStop(0, '#281553');
            bgGradient.addColorStop(1, '#130c28');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            for (let i = 0; i < 14; i++) {
                const x = (i * 91 + STATE.bgOffset * 0.12) % (STATE.width + 100) - 50;
                const y = (i * 57) % (STATE.height + 80) - 40;
                ctx.fillStyle = 'rgba(109, 247, 255, 0.08)';
                ctx.fillRect(x, y, 18, 3);
            }

            const roadW = (STATE.laneX[2] - STATE.laneX[0]) + 100;
            const roadX = (STATE.width - roadW) / 2;
            const roadGradient = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
            roadGradient.addColorStop(0, '#22163f');
            roadGradient.addColorStop(0.5, '#31225a');
            roadGradient.addColorStop(1, '#22163f');
            ctx.fillStyle = roadGradient;
            ctx.fillRect(roadX, 0, roadW, STATE.height);

            ctx.fillStyle = 'rgba(109, 247, 255, 0.08)';
            ctx.fillRect(roadX + 12, 0, 8, STATE.height);
            ctx.fillRect(roadX + roadW - 20, 0, 8, STATE.height);

            ctx.strokeStyle = '#9b7cff';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 30]);
            ctx.lineDashOffset = -STATE.bgOffset;

            ctx.beginPath();
            const mid1 = (STATE.laneX[0] + STATE.laneX[1]) / 2;
            const mid2 = (STATE.laneX[1] + STATE.laneX[2]) / 2;

            ctx.moveTo(mid1, -50);
            ctx.lineTo(mid1, STATE.height + 50);
            ctx.moveTo(mid2, -50);
            ctx.lineTo(mid2, STATE.height + 50);
            ctx.stroke();
            ctx.setLineDash([]);

            STATE.obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);

                if (obs.visual === 'pass') {
                    ctx.fillStyle = '#ff84c1';
                    ctx.shadowColor = 'rgba(255, 132, 193, 0.5)';
                    ctx.shadowBlur = 18;
                    ctx.fillRect(-18, -12, 36, 24);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-8, -4, 16, 8);
                    ctx.strokeStyle = '#7d2bff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-18, -12, 36, 24);
                } else if (obs.visual === 'bus') {
                    ctx.fillStyle = '#ffd76a';
                    ctx.beginPath();
                    ctx.roundRect(-20, -30, 40, 60, 8);
                    ctx.fill();
                    ctx.fillStyle = '#7be7ff';
                    ctx.fillRect(-15, -20, 30, 10);
                    ctx.fillRect(-15, 0, 30, 10);
                    ctx.fillStyle = '#2e254f';
                    ctx.fillRect(-12, 18, 8, 10);
                    ctx.fillRect(4, 18, 8, 10);
                } else {
                    ctx.fillStyle = '#f8fbff';
                    ctx.fillRect(-18, -20, 36, 40);
                    ctx.strokeStyle = '#8ba2ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-18, -20, 36, 40);
                    ctx.beginPath();
                    ctx.moveTo(-10, -10); ctx.lineTo(10, -10);
                    ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
                    ctx.moveTo(-10, 10); ctx.lineTo(10, 10);
                    ctx.stroke();
                    ctx.fillStyle = '#ff6b8d';
                    ctx.fillRect(8, -20, 6, 40);
                }
                ctx.restore();
            });

            const p = STATE.player;
            ctx.save();
            ctx.translate(p.x, p.y);

            const bounce = Math.sin(p.animTimer) * 5;

            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.beginPath();
            ctx.ellipse(0, 24, 22 - bounce / 2, 10 - bounce / 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(0, -bounce);

            const auraGradient = ctx.createRadialGradient(0, -2, 6, 0, -2, 34);
            auraGradient.addColorStop(0, 'rgba(255,255,255,0.34)');
            auraGradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = auraGradient;
            ctx.beginPath();
            ctx.arc(0, 0, p.radius + 12, 0, Math.PI * 2);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(0, -p.radius, 0, p.radius);
            bodyGradient.addColorStop(0, '#ffffff');
            bodyGradient.addColorStop(0.15, p.color);
            bodyGradient.addColorStop(1, '#1e153f');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd76a';
            ctx.beginPath();
            ctx.moveTo(-12, -16);
            ctx.lineTo(-3, -30);
            ctx.lineTo(0, -20);
            ctx.lineTo(4, -33);
            ctx.lineTo(12, -16);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-6, -2, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -2, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#120c24';
            ctx.beginPath(); ctx.arc(-6, -2, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -2, 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#120c24';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 7, 7, 0.2, Math.PI - 0.2);
            ctx.stroke();

            ctx.restore();

            STATE.particles.forEach(part => {
                ctx.fillStyle = part.color;
                ctx.globalAlpha = part.life;
                ctx.fillRect(part.x, part.y, 5, 5);
                ctx.globalAlpha = 1.0;
            });
        }

        function move(dir) {
            if (!STATE.active) return;

            const prevLane = STATE.player.lane;
            STATE.player.lane += dir;

            if (STATE.player.lane < 0) STATE.player.lane = 0;
            if (STATE.player.lane > 2) STATE.player.lane = 2;

            if (prevLane !== STATE.player.lane) {
                const now = performance.now();
                if (now - lastLaneSfxAt > 110) {
                    if (sounds.laneShift) playSound(sounds.laneShift, false, 0.22);
                    else playTone(300, 'triangle');
                    lastLaneSfxAt = now;
                }
            }
        }

        function startGame() {
            const wasActive = STATE.active;
            STATE.active = true;
            STATE.score = 0;
            STATE.speed = CONFIG.baseSpeed;
            STATE.obstacles = [];
            STATE.particles = [];
            STATE.player.lane = 1;
            STATE.player.x = STATE.laneX[1];

            updateScore();
            document.getElementById('collect-gif').classList.remove('show');
            document.getElementById('crash-gif').classList.remove('show');

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');

            if (!wasActive && sounds.start) {
                playSound(sounds.start, false, 0.32);
            }

            if (bgmNode) {
                bgmNode.pause();
                bgmNode.currentTime = 0;
                bgmNode = null;
            }

            if (sounds.bgm && !isMuted) {
                bgmNode = playSound(sounds.bgm, true, 0.2);
            }

            STATE.lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            STATE.active = false;
            showFeedbackGif('crash', 1800);

            if (sounds.crash) playSound(sounds.crash, false, 0.72);
            else playTone(100, 'sawtooth');

            if (bgmNode) {
                bgmNode.pause();
                bgmNode.currentTime = 0;
                bgmNode = null;
            }

            document.getElementById('controls-layer').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = STATE.score;
        }

        function updateScore() {
            document.getElementById('score').innerText = STATE.score;
        }

        document.querySelectorAll('.char-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                STATE.player.color = e.target.dataset.color;
                document.getElementById('hero-preview').style.setProperty('--hero-color', e.target.dataset.color);
            });
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            await initAudio();
            startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            await initAudio();
            startGame();
        });

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            isMuted = !isMuted;
            e.target.innerText = isMuted ? '🔇' : '🔊';
            if (isMuted && bgmNode) {
                bgmNode.pause();
                bgmNode.currentTime = 0;
                bgmNode = null;
            } else if (!isMuted && STATE.active && !bgmNode && sounds.bgm) {
                bgmNode = playSound(sounds.bgm, true, 0.2);
            }
        });

        const leftZone = document.getElementById('touch-left');
        const rightZone = document.getElementById('touch-right');

        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        leftZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            move(-1);
            leftZone.style.background = 'rgba(255,255,255,0.1)';
            setTimeout(() => leftZone.style.background = 'transparent', 100);
        });

        rightZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            move(1);
            rightZone.style.background = 'rgba(255,255,255,0.1)';
            setTimeout(() => rightZone.style.background = 'transparent', 100);
        });

        leftZone.addEventListener('mousedown', () => move(-1));
        rightZone.addEventListener('mousedown', () => move(1));
    </script>
</body>
</html>
