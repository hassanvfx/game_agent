<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PromptLab Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

    :root {
        --bg-main: #0b1020;
        --bg-panel: #11192d;
        --bg-card: rgba(16, 26, 48, 0.92);
        --bg-input: rgba(15, 23, 41, 0.94);
        --bg-muted: #233352;
        --text-main: #eef6ff;
        --text-muted: #9db7d8;
        --text-dim: #6f88ab;
        --border: rgba(110, 184, 255, 0.22);
        --accent: #62e7ff;
        --accent-2: #9b6bff;
        --accent-warm: #ffd166;
        --enemy: #ff6b8a;
        --shadow: 0 14px 32px rgba(0, 0, 0, 0.34);
        --grid-glow: rgba(98, 231, 255, 0.12);
        --font-display: 'Orbitron', sans-serif;
        --font-ui: 'Rajdhani', sans-serif;
        --font-terminal: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
            radial-gradient(circle at top, rgba(155, 107, 255, 0.2), transparent 34%),
            radial-gradient(circle at bottom right, rgba(98, 231, 255, 0.16), transparent 30%),
            linear-gradient(180deg, #0d1325 0%, var(--bg-main) 55%, #070b15 100%);
        color: var(--text-main);
        font-family: var(--font-ui);
        overflow: hidden;
        touch-action: manipulation;
    }

    body {
        display: flex;
        flex-direction: column;
        position: relative;
        user-select: none;
    }

    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            linear-gradient(90deg, transparent 0 49%, rgba(98, 231, 255, 0.04) 50%, transparent 51% 100%),
            linear-gradient(transparent 0 49%, rgba(98, 231, 255, 0.04) 50%, transparent 51% 100%);
        background-size: 26px 26px;
        opacity: 0.35;
        pointer-events: none;
    }

    button, input, textarea {
        font-family: var(--font-ui);
        font-size: 1rem;
        line-height: 1.2;
    }

    b { color: #ffffff; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-muted); border-radius: 3px; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    .msg-anim { animation: slideIn 0.3s ease-out forwards; }
    .typing-dot { animation: pulse-dot 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    .key-active { transform: scale(0.92); background-color: var(--bg-muted) !important; }

    #bgCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.1;
        pointer-events: none;
    }

    .app-header {
        height: 3rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(10, 18, 35, 0.98), rgba(12, 20, 38, 0.82));
        backdrop-filter: blur(10px);
        z-index: 10;
        flex-shrink: 0;
        padding: 0 0.75rem;
        text-align: center;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .app-header span {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 0.86rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f4fbff;
        text-shadow: 0 0 14px rgba(98, 231, 255, 0.28);
    }

    .app-header small {
        font-size: 0.62rem;
        opacity: 0.55;
        margin-left: 0.45rem;
    }

    #chat-container {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 1rem;
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        position: relative;
        z-index: 0;
    }

    .message-wrap {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    .avatar {
        width: 2rem;
        height: 2rem;
        border-radius: 0.28rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .avatar svg {
        width: 1.25rem;
        height: 1.25rem;
        color: #fff;
    }

    .message-card {
        flex: 1;
        min-width: 0;
        padding: 0.85rem;
        border-radius: 0.8rem;
        font-size: 0.92rem;
        line-height: 1.55;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        backdrop-filter: blur(8px);
    }

    .message-card.ai {
        background: linear-gradient(180deg, rgba(15, 27, 49, 0.96), rgba(12, 20, 37, 0.94));
    }

    .message-card.user {
        background: linear-gradient(180deg, rgba(31, 37, 67, 0.96), rgba(17, 22, 44, 0.96));
    }

    .toolbar-shell {
        flex-shrink: 0;
        background: linear-gradient(180deg, rgba(9, 16, 30, 0.94), rgba(12, 20, 37, 0.98));
        border-top: 1px solid var(--border);
        padding: 0.5rem;
        z-index: 20;
        box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.18);
    }

    .toolbar-inner {
        max-width: 42rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    #input-display {
        width: 100%;
        min-height: 40px;
        max-height: 100px;
        background: linear-gradient(180deg, rgba(8, 15, 28, 0.95), rgba(15, 24, 45, 0.9));
        border-radius: 0.65rem;
        padding: 0.6rem 0.8rem;
        font-size: 0.92rem;
        font-family: var(--font-terminal);
        color: #fff;
        word-break: break-all;
        overflow-y: auto;
        display: flex;
        align-items: center;
        border: 1px solid rgba(98, 231, 255, 0.25);
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 0 0 1px rgba(98, 231, 255, 0.06);
    }

    #cursor {
        display: inline-block;
        width: 0.5rem;
        height: 1rem;
        background: var(--accent);
        animation: pulse-dot 1s infinite;
        margin-left: 0.25rem;
    }

    .toolbar-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.2rem;
    }

    .meta-btn {
        background: transparent;
        border: 0;
        color: #9ca3af;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.25rem 0.45rem;
        cursor: pointer;
    }

    .meta-btn:hover { color: #fff; }

    .model-label {
        font-size: 0.8rem;
        color: var(--text-dim);
        font-family: var(--font-terminal);
        letter-spacing: 0.08em;
    }

    #keyboard-area {
        flex-shrink: 0;
        background: linear-gradient(180deg, rgba(15, 24, 43, 0.98), rgba(9, 15, 28, 1));
        padding: 0.25rem 0.25rem max(0.25rem, env(safe-area-inset-bottom));
        z-index: 30;
        transition: all 0.3s ease;
        border-top: 1px solid rgba(98, 231, 255, 0.16);
    }

    .keyboard-inner {
        max-width: 42rem;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.38rem;
        padding: 0.25rem;
    }

    .keyboard-row-shell,
    .keyboard-row-shell-offset,
    .keyboard-row-shell-third,
    .keyboard-row-shell-fourth {
        display: flex;
        gap: 0.25rem;
        justify-content: center;
        width: 100%;
    }

    .keyboard-row-shell-offset { padding: 0 1rem; }
    .keyboard-row-shell-fourth { height: 2.5rem; }

    .key-row {
        display: flex;
        gap: 0.25rem;
        width: 100%;
        justify-content: center;
    }

    .key-row.grow { flex: 1; }

    .key-btn {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 0.55rem;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(0,0,0,0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 2.5rem;
        transition: transform 0.08s ease, filter 0.2s ease, box-shadow 0.2s ease;
        touch-action: manipulation;
    }

    .key-btn:hover { filter: brightness(1.06); }

    .key-standard {
        flex: 1;
        background: linear-gradient(180deg, #f9fbff, #dce8ff);
        color: #071120;
        font-size: 1.05rem;
        font-weight: 600;
    }

    .key-special {
        background: linear-gradient(180deg, #202f4e, #15213a);
        color: var(--text-main);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
    }

    .key-special svg,
    .key-img svg {
        width: 1rem;
        height: 1rem;
    }

    .key-small { width: 3rem; }
    .key-medium { width: 4rem; }
    .key-flex { flex: 1; }

    .key-img {
        width: 3rem;
        background: linear-gradient(135deg, var(--accent-2), #3b82f6);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 700;
        gap: 0.25rem;
    }

    .key-space {
        flex: 1;
        background: linear-gradient(180deg, #32466f, #263757);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
    }

    .key-send {
        width: 4rem;
        background: linear-gradient(135deg, var(--accent), #2fd3af);
        color: #03131c;
        font-size: 0.75rem;
        font-weight: 700;
        text-shadow: 0 1px 0 rgba(255,255,255,0.28);
    }

    .thinking-box {
        display: flex;
        align-items: center;
        gap: 0.25rem;
    }

    .typing-dot-box {
        width: 0.5rem;
        height: 0.5rem;
        background: #9ca3af;
        border-radius: 999px;
    }

    .progress-label {
        font-size: 0.68rem;
        color: #9ca3af;
        margin-bottom: 0.35rem;
        letter-spacing: 0.08em;
    }

    .progress-track {
        width: 100%;
        height: 0.5rem;
        background: rgba(255,255,255,0.1);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(98, 231, 255, 0.15);
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 2s ease-in-out;
    }

    .generated-media {
        position: relative;
        cursor: pointer;
    }

    .generated-media img {
        display: block;
        width: 100%;
        max-width: 22rem;
        border-radius: 0.7rem;
        border: 1px solid rgba(98, 231, 255, 0.25);
        transition: opacity 0.2s ease;
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.3);
    }

    .feedback-deck {
        position: fixed;
        top: 3.5rem;
        right: 0.75rem;
        z-index: 25;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: min(9rem, 32vw);
        pointer-events: none;
    }

    .feedback-card {
        position: relative;
        border-radius: 0.8rem;
        overflow: hidden;
        border: 1px solid rgba(98, 231, 255, 0.22);
        background: rgba(7, 13, 26, 0.74);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
        transform: translateY(-0.5rem) scale(0.96);
        opacity: 0;
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .feedback-card.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .feedback-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
    }

    .feedback-card figcaption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0.25rem 0.4rem;
        background: linear-gradient(180deg, transparent, rgba(2, 7, 16, 0.92));
        color: #f4fbff;
        font-size: 0.46rem;
        line-height: 1.35;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: var(--font-terminal);
    }

    .feedback-card.success {
        border-color: rgba(47, 211, 175, 0.4);
    }

    .feedback-card.fail {
        border-color: rgba(255, 107, 138, 0.4);
    }

    .feedback-card.is-hidden {
        opacity: 0;
        transform: translateY(-0.4rem) scale(0.94);
    }

    .audio-status {
        position: fixed;
        left: 50%;
        top: 3.55rem;
        transform: translateX(-50%);
        z-index: 26;
        padding: 0.42rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(98, 231, 255, 0.2);
        background: rgba(5, 10, 20, 0.84);
        color: var(--text-muted);
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
        pointer-events: none;
    }

    .audio-status strong {
        color: #ffffff;
        font-family: var(--font-display);
        font-weight: 700;
    }

    .audio-status.is-on {
        color: #caffef;
        border-color: rgba(47, 211, 175, 0.3);
    }

    .audio-status.is-off {
        color: #ffd7de;
        border-color: rgba(255, 107, 138, 0.28);
    }

    .generated-media img {
        display: block;
        width: 100%;
        max-width: 22rem;
        border-radius: 0.7rem;
        border: 1px solid rgba(98, 231, 255, 0.25);
        transition: opacity 0.2s ease;
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.3);
    }

    .generated-media img:hover {
        opacity: 0.9;
    }

    .save-link {
        position: absolute;
        right: 0.5rem;
        bottom: 0.5rem;
        background: rgba(0,0,0,0.55);
        color: #fff;
        text-decoration: none;
        font-size: 0.68rem;
        padding: 0.3rem 0.55rem;
        border-radius: 0.35rem;
    }

    .save-link:hover {
        background: rgba(0,0,0,0.8);
    }

    @media (max-width: 640px) {
        .app-header span {
            font-size: 0.74rem;
        }

        .message-card {
            font-size: 0.86rem;
        }

        #chat-container {
            padding: 0.85rem;
        }

        .keyboard-row-shell-offset {
            padding: 0 0.35rem;
        }

        .key-standard {
            font-size: 0.96rem;
        }

        .feedback-deck {
            top: auto;
            bottom: calc(11.5rem + env(safe-area-inset-bottom));
            right: 0.5rem;
            width: min(7.5rem, 34vw);
        }

        .audio-status {
            top: auto;
            bottom: calc(10.7rem + env(safe-area-inset-bottom));
            max-width: calc(100% - 1rem);
            text-align: center;
        }
    }
</style>

<!-- Config -->

<body>

    <canvas id="bgCanvas"></canvas>
    <div id="audio-status" class="audio-status">AUDIO <strong>STANDBY</strong></div>
    <div id="feedback-deck" class="feedback-deck" aria-live="polite"></div>

    <header class="app-header">
        <span>PIXEL PILOT <small>PromptLab Terminal</small></span>
    </header>

    <main id="chat-container">
        <div class="message-wrap msg-anim">
            <div class="avatar accent-bg" style="background-color: var(--accent);">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="message-card ai">
                <b>Pixel Pilot</b> is online. Type with the virtual keys, launch a quick reply, or tap <b>IMG</b> to beam out a neon concept card.
            </div>
        </div>
        <!-- [agent-note][stage1] role: future-illustration | element: first-system-message | intent: stronger terminal identity without changing layout -->
    </main>

    <div class="toolbar-shell">
        <div class="toolbar-inner">
            <div id="input-display">
                <span id="cursor"></span>
            </div>

            <div class="toolbar-row">
                <button id="btn-clear" class="meta-btn">Clear Log</button>
                <div class="model-label">MODE: PROMPT SIM</div>
            </div>
        </div>
    </div>

    <div id="keyboard-area">
        <div class="keyboard-inner">
            <div class="keyboard-row-shell">
                <div class="key-row" id="row-1"></div>
            </div>

            <div class="keyboard-row-shell-offset">
                <div class="key-row" id="row-2"></div>
            </div>

            <div class="keyboard-row-shell-third">
                <button class="key-btn key-special key-small" data-key="SHIFT">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                </button>
                <div class="key-row grow" id="row-3"></div>
                <button class="key-btn key-special key-small" data-key="BACKSPACE">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10l2-2m0 0l2 2m-2-2v6"></path><path stroke="currentColor" stroke-width="2" d="M10 14l-2 2m2-2l2 2"></path></svg>
                    ⌫
                </button>
            </div>

            <div class="keyboard-row-shell-fourth">
                <button class="key-btn key-special key-small" data-key="123">123</button>
                <button class="key-btn key-img" data-key="IMG">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    IMG
                </button>
                <button class="key-btn key-space" data-key="SPACE">SPACE</button>
                <button class="key-btn key-send" data-key="SEND">SEND</button>
            </div>
        </div>
    </div>

<script>
window.gameConfigDefs = {
    "typingSpeed": { "type": "number", "label": "Reply Speed (ms)", "value": 30, "min": 10, "max": 100 },
    "themeColor": { "type": "color", "label": "Accent Color", "value": "#10a37f" },
    "userName": { "type": "text", "label": "Pilot Name", "value": "You" }
};
window.gameConfig = {
    typingSpeed: 30,
    themeColor: "#10a37f",
    userName: "You"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--accent', val);
            document.querySelectorAll('.accent-bg').forEach(el => el.style.backgroundColor = val);
            const cursor = document.getElementById('cursor');
            if (cursor) cursor.style.backgroundColor = val;
        }
    }
};

class AudioManager {
    constructor(statusEl) {
        this.ctx = null;
        this.unlocked = false;
        this.buffers = {};
        this.pendingLoads = new Map();
        this.statusEl = statusEl;
        this.bgmEl = document.getElementById('bgm_loop');
        this.bgmStarted = false;
        this.lastPlayedAt = {};
        this.fallbackVolumes = {
            click: 0.045,
            beep: 0.05,
            success: 0.06,
            error: 0.05,
            power: 0.055,
            hum: 0.03
        };

        const unlock = async () => {
            if (this.unlocked) return;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                await this.ctx.resume();
                this.unlocked = true;
                this.updateStatus('ONLINE', true);
                await Promise.all([
                    this.loadAsset('sfx_send', 'click'),
                    this.loadAsset('sfx_receive', 'success'),
                    this.loadAsset('sfx_clear', 'click'),
                    this.loadAsset('sfx_generate', 'power'),
                    this.loadAsset('sfx_invalid', 'error')
                ]);
                this.startLoop();
            } catch (e) {
                this.updateStatus('OFFLINE', false);
            }
            window.removeEventListener('pointerdown', unlock);
            window.removeEventListener('keydown', unlock);
        };
        window.addEventListener('pointerdown', unlock, { passive: true });
        window.addEventListener('keydown', unlock);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) this.stopLoop();
            else if (this.unlocked) this.startLoop();
        });
        window.addEventListener('blur', () => this.stopLoop());
        window.addEventListener('focus', () => {
            if (this.unlocked) this.startLoop();
        });
    }

    updateStatus(label, active) {
        if (!this.statusEl) return;
        this.statusEl.innerHTML = `AUDIO <strong>${label}</strong>`;
        this.statusEl.classList.toggle('is-on', !!active);
        this.statusEl.classList.toggle('is-off', active === false);
    }

    async loadAsset(id, fallback) {
        if (!this.ctx) return;
        if (this.pendingLoads.has(id)) return this.pendingLoads.get(id);

        const el = document.getElementById(id);
        if (!el) return;
        const loadPromise = (async () => {
            try {
                const res = await fetch(el.src);
                const buf = await res.arrayBuffer();
                this.buffers[id] = await this.ctx.decodeAudioData(buf);
            } catch (e) {
                console.warn('Audio load fail', id);
                this.buffers[id] = fallback;
            } finally {
                this.pendingLoads.delete(id);
            }
        })();

        this.pendingLoads.set(id, loadPromise);
        return loadPromise;
    }

    canPlay(id, cooldown = 90) {
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return false;
        this.lastPlayedAt[id] = now;
        return true;
    }

    play(id, fallbackType = 'beep', options = {}) {
        const { cooldown = 90, volume = 0.2 } = options;
        if (!this.ctx || !this.unlocked || !this.canPlay(id, cooldown)) return;

        if (this.buffers[id] && typeof this.buffers[id] !== 'string') {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(fallbackType);
        }
    }

    startLoop() {
        if (!this.bgmEl || this.bgmStarted || document.hidden) return;
        this.bgmEl.volume = 0.14;
        const attempt = this.bgmEl.play();
        if (attempt && typeof attempt.catch === 'function') {
            attempt.then(() => {
                this.bgmStarted = true;
                this.updateStatus('ONLINE', true);
            }).catch(() => {
                this.bgmStarted = false;
                this.updateStatus('READY', true);
                this.synthesize('hum');
            });
        }
    }

    stopLoop() {
        if (!this.bgmEl) return;
        this.bgmEl.pause();
        this.bgmStarted = false;
    }

    synthesize(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'click') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
            gain.gain.setValueAtTime(this.fallbackVolumes.click, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            osc.start(now);
            osc.stop(now + 0.06);
        } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(1080, now + 0.18);
            gain.gain.setValueAtTime(this.fallbackVolumes.success, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.18);
            gain.gain.setValueAtTime(this.fallbackVolumes.error, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'power') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.22);
            gain.gain.setValueAtTime(this.fallbackVolumes.power, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
        } else if (type === 'hum') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, now);
            gain.gain.setValueAtTime(this.fallbackVolumes.hum, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(this.fallbackVolumes.beep, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const audioStatus = document.getElementById('audio-status');
    const feedbackDeck = document.getElementById('feedback-deck');
    const audio = new AudioManager(audioStatus);
    const chatContainer = document.getElementById('chat-container');
    const inputDisplay = document.getElementById('input-display');
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = bgCanvas.getContext('2d');

    let inputBuffer = "";
    let isShift = false;
    let isCaps = false;
    let isGenerating = false;
    let firstImageGenerated = false;

    let particles = [];
    let w, h;

    function showFeedbackGif(type, label) {
        const card = document.createElement('figure');
        const gifSrc = type === 'success'
            ? 'https://i.giphy.com/Da3QKzDMWZFIaXxEYQ.webp'
            : 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp';

        card.className = `feedback-card ${type}`;
        card.innerHTML = `
            <img src="${gifSrc}" alt="${label}">
            <figcaption>${label}</figcaption>
        `;
        feedbackDeck.appendChild(card);
        requestAnimationFrame(() => card.classList.add('is-visible'));
        setTimeout(() => {
            card.classList.add('is-hidden');
            setTimeout(() => card.remove(), 250);
        }, 1800);
    }

    function resize() {
        w = bgCanvas.width = window.innerWidth * window.devicePixelRatio;
        h = bgCanvas.height = window.innerHeight * window.devicePixelRatio;
        bgCanvas.style.width = window.innerWidth + 'px';
        bgCanvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        particles = Array.from({ length: 30 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: Math.random() * 2 + 1
        }));
    }
    window.addEventListener('resize', resize);
    resize();

    function drawBg() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.fillStyle = gameConfig.themeColor;

        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = window.innerWidth;
            if (p.x > window.innerWidth) p.x = 0;
            if (p.y < 0) p.y = window.innerHeight;
            if (p.y > window.innerHeight) p.y = 0;

            ctx.globalAlpha = 0.1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.strokeStyle = gameConfig.themeColor;
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    ctx.globalAlpha = (1 - dist / 100) * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(drawBg);
    }
    drawBg();

    const rows = [
        "qwertyuiop".split(""),
        "asdfghjkl".split(""),
        "zxcvbnm".split("")
    ];

    function renderKeyboard() {
        const createKey = (char) => {
            const btn = document.createElement('button');
            btn.className = "key-btn key-standard";
            btn.textContent = isShift ? char.toUpperCase() : char;
            btn.dataset.char = char;

            const handler = (e) => {
                e.preventDefault();
                e.stopPropagation();
                audio.play('sfx_send', 'click', { cooldown: 35, volume: 0.18 });
                btn.classList.add('key-active');
                setTimeout(() => btn.classList.remove('key-active'), 100);

                inputBuffer += isShift ? char.toUpperCase() : char;
                if (isShift && !isCaps) {
                    isShift = false;
                    renderKeyboard();
                }
                updateInputDisplay();
            };

            btn.addEventListener('pointerdown', handler);
            return btn;
        };

        ['row-1', 'row-2', 'row-3'].forEach((id, idx) => {
            const container = document.getElementById(id);
            container.innerHTML = '';
            rows[idx].forEach(char => container.appendChild(createKey(char)));
        });
    }

    function updateInputDisplay() {
        inputDisplay.innerHTML = inputBuffer + '<span id="cursor"></span>';
        document.getElementById('cursor').style.backgroundColor = gameConfig.themeColor;
        inputDisplay.scrollTop = inputDisplay.scrollHeight;
    }

    const specialKeys = document.querySelectorAll('[data-key]');
    specialKeys.forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.play('sfx_send', 'click', { cooldown: 35, volume: 0.18 });
            btn.classList.add('key-active');
            setTimeout(() => btn.classList.remove('key-active'), 100);

            const key = btn.dataset.key;

            if (key === 'SPACE') {
                inputBuffer += " ";
                updateInputDisplay();
            } else if (key === 'BACKSPACE') {
                inputBuffer = inputBuffer.slice(0, -1);
                updateInputDisplay();
            } else if (key === 'SHIFT') {
                isShift = !isShift;
                renderKeyboard();
            } else if (key === 'SEND') {
                if (inputBuffer.trim().length > 0) {
                    sendMessage(inputBuffer);
                    inputBuffer = "";
                    updateInputDisplay();
                }
            } else if (key === 'IMG') {
                handleImageGeneration();
            } else if (key === '123') {
                inputBuffer += Math.floor(Math.random() * 10).toString();
                updateInputDisplay();
            }
        });
    });

    function addMessage(text, isUser, isImage = false) {
        const div = document.createElement('div');
        div.className = "message-wrap msg-anim";

        const avatarColor = isUser ? gameConfig.themeColor : '#62e7ff';
        const avatarIcon = isUser
            ? '<span style="font-size:1.1rem; line-height:1;">🧑‍🚀</span>'
            : '<span style="font-size:1.1rem; line-height:1;">🤖</span>';

        div.innerHTML = `
            <div class="avatar accent-bg" style="background-color: ${isUser ? '#565869' : avatarColor}">
                ${avatarIcon}
            </div>
            <div class="message-card ${isUser ? 'user' : 'ai'}">
                ${isImage ? text : escapeHtml(text)}
            </div>
        `;

        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        if (isUser) audio.play('sfx_send', 'click', { cooldown: 120, volume: 0.22 });
        else audio.play('sfx_receive', 'success', { cooldown: 120, volume: 0.22 });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function sendMessage(text) {
        addMessage(text, true);

        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = "message-wrap msg-anim";
        thinkingDiv.id = "thinking-indicator";
        thinkingDiv.innerHTML = `
            <div class="avatar" style="background-color:#10a37f;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="message-card ai thinking-box">
                <div class="typing-dot typing-dot-box"></div>
                <div class="typing-dot typing-dot-box"></div>
                <div class="typing-dot typing-dot-box"></div>
            </div>
        `;
        chatContainer.appendChild(thinkingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        setTimeout(() => {
            thinkingDiv.remove();

            const lower = text.toLowerCase();
            let response = "";

            if (lower.includes("image") || lower.includes("draw") || lower.includes("create")) {
                response = "Use the IMG key to render a concept card from your current prompt.";
            } else if (lower.includes("hello") || lower.includes("hi")) {
                response = "Pixel Pilot online. Send a phrase or tap IMG to preview a generated concept.";
            } else {
                const phrases = [
                    "Prompt received. I am tuning the neon relay into a compact reply.",
                    "Signal understood. Feed in another line to keep the cockpit active.",
                    "That prompt tracks. I can answer in text or beam it into an image card.",
                    "Input logged. Tap IMG when you want a quick visual transmission.",
                    "Session stable. Keep typing to test the simulator."
                ];
                response = phrases[Math.floor(Math.random() * phrases.length)];
            }

            typeWriterEffect(response);
        }, 1000 + Math.random() * 1000);
    }

    function typeWriterEffect(text) {
        const div = document.createElement('div');
        div.className = "message-wrap msg-anim";
        div.innerHTML = `
            <div class="avatar" style="background-color:#10a37f;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="message-card ai content-area"></div>
        `;
        chatContainer.appendChild(div);

        const contentArea = div.querySelector('.content-area');
        let i = 0;
        const interval = setInterval(() => {
            contentArea.textContent += text.charAt(i);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            i++;
            if (i >= text.length) {
                clearInterval(interval);
                audio.play('sfx_receive', 'success', { cooldown: 140, volume: 0.24 });
            }
        }, gameConfig.typingSpeed);
    }

    function handleImageGeneration() {
        if (isGenerating) {
            audio.play('sfx_invalid', 'error', { cooldown: 140, volume: 0.2 });
            showFeedbackGif('fail', 'Renderer busy');
            return;
        }
        isGenerating = true;

        let prompt = inputBuffer.trim();
        if (!firstImageGenerated) {
            prompt = "Signal Boost";
        } else if (prompt === "") {
            prompt = "Neon Concept";
        }

        audio.play('sfx_generate', 'power', { cooldown: 150, volume: 0.24 });

        if (inputBuffer.trim().length > 0) {
            addMessage(`Render concept: "${prompt}"`, true);
            inputBuffer = "";
            updateInputDisplay();
        } else {
            addMessage(`Render concept...`, true);
        }

        const progressDiv = document.createElement('div');
        progressDiv.className = "message-wrap msg-anim";
        progressDiv.innerHTML = `
            <div class="avatar" style="background-color:#10a37f;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="animation:spin 1s linear infinite;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </div>
            <div class="message-card ai">
                <div class="progress-label">RENDERING CONCEPT...</div>
                <div class="progress-track">
                    <div class="progress-bar"></div>
                </div>
            </div>
        `;
        chatContainer.appendChild(progressDiv);

        const bar = progressDiv.querySelector('.progress-bar');
        setTimeout(() => { bar.style.width = "100%"; }, 50);

        setTimeout(() => {
            progressDiv.remove();

            const imgCanvas = document.createElement('canvas');
            imgCanvas.width = 512;
            imgCanvas.height = 512;
            const ictx = imgCanvas.getContext('2d');

            const hue = Math.random() * 360;
            const grad = ictx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, `hsl(${hue}, 60%, 20%)`);
            grad.addColorStop(1, `hsl(${hue + 40}, 60%, 10%)`);
            ictx.fillStyle = grad;
            ictx.fillRect(0, 0, 512, 512);

            for (let k = 0; k < 20; k++) {
                ictx.fillStyle = `hsla(${Math.random() * 360}, 70%, 50%, 0.1)`;
                ictx.beginPath();
                ictx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 100 + 50, 0, Math.PI * 2);
                ictx.fill();
            }

            ictx.strokeStyle = "rgba(255,255,255,0.1)";
            ictx.lineWidth = 2;
            for (let i = 0; i < 512; i += 40) {
                ictx.beginPath(); ictx.moveTo(i, 0); ictx.lineTo(i, 512); ictx.stroke();
                ictx.beginPath(); ictx.moveTo(0, i); ictx.lineTo(512, i); ictx.stroke();
            }

            ictx.font = "bold 60px Orbitron, sans-serif";
            ictx.textAlign = "center";
            ictx.textBaseline = "middle";
            ictx.shadowColor = "black";
            ictx.shadowBlur = 20;
            ictx.fillStyle = "white";

            const words = prompt.split(' ');
            if (words.length > 3) {
                ictx.fillText(prompt.substring(0, 15) + "...", 256, 256);
            } else {
                ictx.fillText(prompt, 256, 256);
            }

            ictx.font = "20px 'Press Start 2P', monospace";
            ictx.fillStyle = "rgba(255,255,255,0.7)";
            ictx.fillText("PIXEL PILOT", 256, 480);

            const dataUrl = imgCanvas.toDataURL();

            const imgHTML = `
                <div class="generated-media">
                    <img src="${dataUrl}" alt="Generated concept card">
                    <a href="${dataUrl}" download="promptlab-concept.png" class="save-link">SAVE</a>
                </div>
            `;

            addMessage(imgHTML, false, true);
            showFeedbackGif('success', 'Concept link locked');
            audio.play('sfx_receive', 'success', { cooldown: 140, volume: 0.24 });
            isGenerating = false;
            firstImageGenerated = true;
        }, 2000);
    }

    document.getElementById('btn-clear').addEventListener('click', () => {
        chatContainer.innerHTML = '';
        audio.play('sfx_clear', 'click', { cooldown: 140, volume: 0.22 });
        showFeedbackGif('fail', 'Log flushed');
        addMessage("Session log cleared.", false);
    });

    renderKeyboard();
    updateInputDisplay();
});
</script>
</body>
</html>
