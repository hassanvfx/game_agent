<![CDATA[<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
        <title>Signal Core</title>
        <!-- [agent-note][stage4] repaired: catalog-font-remap | title-display -> Orbitron | hud-ui -> Rajdhani -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
        <style>
        :root {
            --bg: #060816;
            --bg-deep: #03040b;
            --panel-bg: rgba(13, 18, 38, 0.7);
            --panel-border: rgba(118, 248, 255, 0.18);
            --panel-glow: rgba(71, 234, 255, 0.18);
            --text: #edf7ff;
            --muted: rgba(208, 232, 255, 0.78);
            --dim: rgba(196, 235, 255, 0.35);
            --bar-bg: rgba(113, 164, 212, 0.18);
            --bar-fill: linear-gradient(90deg, #7df9ff 0%, #69a7ff 52%, #cf6dff 100%);
            --bar-fill-low: linear-gradient(90deg, #ff846e 0%, #ff3f75 100%);
            --accent: #78f4ff;
            --accent-2: #7d8dff;
            --warning: #ff5f7e;
            --spark: rgba(125, 244, 255, 0.8);
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(76, 120, 255, 0.12), transparent 28%),
                radial-gradient(circle at bottom, rgba(159, 97, 255, 0.14), transparent 30%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                linear-gradient(rgba(120, 244, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 244, 255, 0.05) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.75));
            opacity: 0.45;
        }

        .game-container::after {
            background:
                radial-gradient(circle at 50% 50%, rgba(118, 248, 255, 0.1), transparent 24%),
                radial-gradient(circle at 50% 50%, rgba(125, 141, 255, 0.12), transparent 42%);
            opacity: 0.9;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .panel {
            position: relative;
            background: linear-gradient(180deg, rgba(17, 24, 50, 0.82), rgba(8, 12, 27, 0.9));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 50px var(--shadow),
                inset 0 0 0 1px rgba(237, 247, 255, 0.04),
                0 0 24px var(--panel-glow);
            color: var(--text);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .start-screen {
            padding: 2.2rem 1.4rem 1.5rem;
            border-radius: 2rem;
            text-align: center;
            pointer-events: auto;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            width: min(90vw, 26rem);
            overflow: hidden;
        }

        .start-screen:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.52),
                0 0 28px rgba(120, 244, 255, 0.24);
        }

        .avatar-frame {
            width: 8.5rem;
            height: 8.5rem;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            position: relative;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95), rgba(125, 244, 255, 0.45) 22%, rgba(82, 112, 255, 0.08) 48%, transparent 50%),
                radial-gradient(circle at center, rgba(125, 141, 255, 0.24), rgba(5, 8, 24, 0.1) 68%, transparent 72%);
            box-shadow:
                0 0 0 8px rgba(125, 244, 255, 0.06),
                0 0 42px rgba(120, 244, 255, 0.22);
        }

        .avatar-frame::before,
        .avatar-frame::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            inset: -0.6rem;
            border: 1px solid rgba(120, 244, 255, 0.24);
            animation: spin 10s linear infinite;
        }

        .avatar-frame::after {
            inset: -1rem;
            border-style: dashed;
            border-color: rgba(145, 120, 255, 0.18);
            animation-direction: reverse;
            animation-duration: 16s;
        }

        .core-face {
            position: relative;
            width: 5.9rem;
            height: 5.9rem;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #ffffff 0%, #b7faff 16%, #7cf4ff 32%, #6c94ff 65%, #1d295b 100%);
            box-shadow:
                0 0 32px rgba(124, 244, 255, 0.55),
                inset 0 -10px 16px rgba(12, 17, 44, 0.42);
        }

        .core-face::before,
        .core-face::after {
            content: "";
            position: absolute;
            top: 2.1rem;
            width: 0.82rem;
            height: 1.02rem;
            border-radius: 50%;
            background: #08203a;
            box-shadow: 0 0 12px rgba(3, 10, 28, 0.55);
        }

        .core-face::before { left: 1.48rem; }
        .core-face::after { right: 1.48rem; }

        .core-smile {
            position: absolute;
            left: 50%;
            bottom: 1.28rem;
            width: 2.1rem;
            height: 1rem;
            transform: translateX(-50%);
            border-bottom: 0.2rem solid #08203a;
            border-radius: 0 0 1.2rem 1.2rem;
            opacity: 0.88;
        }

        .signal-rings {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .signal-rings span {
            position: absolute;
            border-radius: 999px;
            border: 2px solid rgba(125, 244, 255, 0.25);
            animation: ping 2.4s ease-out infinite;
        }

        .signal-rings span:nth-child(1) {
            inset: 0.55rem;
        }

        .signal-rings span:nth-child(2) {
            inset: -0.1rem;
            animation-delay: 0.6s;
            border-color: rgba(125, 141, 255, 0.22);
        }

        .signal-rings span:nth-child(3) {
            inset: -0.75rem;
            animation-delay: 1.2s;
            border-color: rgba(207, 109, 255, 0.18);
        }

        .title {
            margin: 0 0 0.3rem;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.15rem, 7vw, 3.2rem);
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 18px rgba(120, 244, 255, 0.32);
        }

        .subtitle {
            margin: 0 0 0.8rem;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }

        .instructions {
            margin: 0 0 1.4rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.4;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .primary-button {
            appearance: none;
            border: 1px solid rgba(125, 244, 255, 0.35);
            background: linear-gradient(180deg, rgba(133, 249, 255, 0.2), rgba(70, 99, 255, 0.22));
            color: #f8fdff;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 0.88rem 1.5rem;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, background 0.18s ease;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 18px rgba(120, 244, 255, 0.18);
        }

        .primary-button:hover {
            filter: brightness(1.08);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                0 0 24px rgba(120, 244, 255, 0.28);
        }

        .primary-button:active,
        .primary-button.is-pressed {
            transform: scale(0.97);
        }

        .game-over-screen {
            display: none;
            padding: 2rem 1.4rem 1.5rem;
            border-radius: 1.6rem;
            text-align: center;
            pointer-events: auto;
            width: min(88vw, 24rem);
        }

        .game-over-screen.visible,
        .hud.visible {
            display: block;
        }

        .game-over-title {
            margin: 0 0 0.45rem;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffd1da;
        }

        .game-over-copy {
            margin: 0 0 0.95rem;
            color: var(--muted);
            font-size: 0.98rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .final-score {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.2rem);
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.35rem;
            text-shadow: 0 0 20px rgba(120, 244, 255, 0.22);
        }

        .restart-button {
            background: linear-gradient(180deg, rgba(255, 146, 174, 0.22), rgba(140, 95, 255, 0.28));
            border-color: rgba(255, 152, 181, 0.4);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 1rem;
            width: 100%;
            text-align: center;
            display: none;
            pointer-events: none;
        }

        .score-label {
            margin: 0 0 0.2rem;
            color: rgba(193, 229, 255, 0.7);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .score-display {
            color: rgba(237, 247, 255, 0.96);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(3.2rem, 16vw, 6rem);
            font-weight: 700;
            line-height: 0.96;
            user-select: none;
            text-shadow:
                0 0 16px rgba(120, 244, 255, 0.18),
                0 0 26px rgba(120, 244, 255, 0.08);
        }

        .energy-wrap {
            margin: 0.55rem auto 0;
            width: min(15rem, 68vw);
            padding: 0.7rem 0.8rem 0.8rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(12, 18, 39, 0.62), rgba(7, 10, 24, 0.82));
            border: 1px solid rgba(120, 244, 255, 0.12);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .energy-label {
            margin: 0 0 0.42rem;
            color: rgba(193, 229, 255, 0.78);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .energy-track {
            width: 100%;
            height: 0.58rem;
            background: var(--bar-bg);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .energy-bar {
            height: 100%;
            width: 100%;
            background: var(--bar-fill);
            transition: width 0.1s linear, background 0.1s linear;
            box-shadow: 0 0 14px rgba(120, 244, 255, 0.45);
        }

        .feedback-gifs {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(4.5rem, 18vw, 7rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(120, 244, 255, 0.22);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28), 0 0 18px rgba(120, 244, 255, 0.14);
            opacity: 0;
            transform: translateY(0.8rem) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            background: rgba(5, 8, 24, 0.5);
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif-success {
            top: 6.8rem;
            right: 1rem;
        }

        .feedback-gif-fail {
            left: 1rem;
            bottom: 1rem;
        }

        .hidden {
            display: none !important;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }

        @keyframes ping {
            0% {
                transform: scale(0.92);
                opacity: 0.2;
            }
            65% {
                opacity: 0.4;
            }
            100% {
                transform: scale(1.14);
                opacity: 0;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .breathe {
            animation: breathe 2.8s infinite ease-in-out;
        }

        @media (max-width: 600px) {
            .start-screen,
            .game-over-screen {
                padding: 1.5rem 1rem 1.2rem;
                border-radius: 1.5rem;
            }

            .avatar-frame {
                width: 7rem;
                height: 7rem;
                margin-bottom: 1rem;
            }

            .core-face {
                width: 4.85rem;
                height: 4.85rem;
            }

            .core-face::before,
            .core-face::after {
                top: 1.72rem;
                width: 0.7rem;
                height: 0.86rem;
            }

            .core-face::before { left: 1.2rem; }
            .core-face::after { right: 1.2rem; }

            .core-smile {
                width: 1.75rem;
                bottom: 1rem;
            }

            .title {
                letter-spacing: 0.1em;
                font-size: clamp(2rem, 9vw, 2.5rem);
            }

            .instructions,
            .game-over-copy {
                font-size: 0.9rem;
                letter-spacing: 0.04em;
            }

            .subtitle,
            .score-label,
            .energy-label {
                letter-spacing: 0.14em;
            }

            .primary-button {
                width: 100%;
                max-width: 14.5rem;
                font-size: 0.84rem;
                padding-inline: 1rem;
            }

            .hud {
                top: 0.85rem;
            }

            .energy-wrap {
                width: min(14rem, 74vw);
                padding: 0.62rem 0.72rem 0.72rem;
            }

            .feedback-gif-success {
                top: 7.5rem;
                right: 0.7rem;
            }

            .feedback-gif-fail {
                left: 0.7rem;
                bottom: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="panel start-screen">
                <div class="avatar-frame" aria-hidden="true">
                    <div class="signal-rings">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="core-face">
                        <div class="core-smile"></div>
                    </div>
                </div>
                <h1 class="title">SIGNAL</h1>
                <p class="subtitle breathe">Guardian core online</p>
                <p class="instructions">Tap or click to cheer the core back to full power.<br>Every pulse keeps your glowing buddy online a little longer.</p>
                <button id="start-btn" class="primary-button">Boot Sequence</button>
            </div>

            <div id="game-over-screen" class="panel game-over-screen">
                <h2 class="game-over-title">Signal Lost</h2>
                <p class="game-over-copy">The core's smile flickered out.<br>Final pulses recorded:</p>
                <div class="final-score"><span id="finalScore">0</span></div>
                <button id="restart-btn" class="primary-button restart-button">Reconnect</button>
            </div>

            <div id="hud" class="hud">
                <!-- [agent-note][stage3] resolved-gif: charge-burst + fail-reaction from catalogs/gifs.json; keep overlays off center playfield -->
                <div id="feedback-gifs" class="feedback-gifs" aria-hidden="true">
                    <img id="success-gif" class="feedback-gif feedback-gif-success" alt="" decoding="async">
                    <img id="fail-gif" class="feedback-gif feedback-gif-fail" alt="" decoding="async">
                </div>
                <p class="score-label">Uptime Pulses</p>
                <div class="score-display" id="score-display">0</div>
                <div class="energy-wrap">
                    <p class="energy-label">Core Charge</p>
                    <div class="energy-track">
                        <div id="energy-bar" class="energy-bar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ENABLE_ANIMATIONS = true;

        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            gifs: {
                success: "https://i.giphy.com/I4OBmAtUfI5MBOiSV5.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            },
            sfx: {
                charge: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                tap: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.audioReady = false;
                this.lastPlayedAt = {};
                this.poolSize = 3;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = Array.from({ length: this.poolSize }, () => {
                        const sound = new Audio(src);
                        sound.preload = 'auto';
                        sound.volume = key === 'warning' ? 0.45 : 0.58;
                        return sound;
                    });
                }
            }

            unlock() {
                this.audioReady = true;
                const warmup = [this.bgm, ...Object.values(this.sfx).flat()];
                warmup.forEach((sound) => {
                    try {
                        sound.load();
                    } catch (_) {}
                });
            }

            playBGM() {
                if (!this.audioReady) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) {
                    this.bgm.currentTime = 0;
                }
            }

            playSFX(key, { debounce = 80 } = {}) {
                const pool = this.sfx[key];
                if (!this.audioReady || !pool) return;

                const now = performance.now();
                if ((this.lastPlayedAt[key] || 0) + debounce > now) return;
                this.lastPlayedAt[key] = now;

                const sound = pool.find((item) => item.paused || item.ended) || pool[0];
                try {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const energyBar = document.getElementById('energy-bar');
        const primaryButtons = document.querySelectorAll('.primary-button');
        const successGif = document.getElementById('success-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let energy = 100;
        let particles = [];
        let warningTriggered = false;
        let gifTimeoutId = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX / PARTICLES */
        class Particle {
            constructor(layer) {
                this.layer = layer;
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = this.layer === 0 ? Math.random() * 1.1 + 0.5 : Math.random() * 2.4 + 1;
                this.speed = this.layer === 0 ? Math.random() * 0.24 + 0.14 : Math.random() * 0.6 + 0.34;
                this.alpha = this.layer === 0 ? Math.random() * 0.2 + 0.08 : Math.random() * 0.3 + 0.18;
                this.tint = this.layer === 0 ? '125, 244, 255' : '149, 166, 255';
            }

            update() {
                this.y -= this.speed;
                if (this.y < -10) this.reset();
            }

            draw() {
                ctx.fillStyle = `rgba(${this.tint}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 50; i++) particles.push(new Particle(0));
            for (let i = 0; i < 20; i++) particles.push(new Particle(1));
        }

        /** 5. GAME LOGIC */
        function showGif(type, duration = 900) {
            const target = type === 'fail' ? failGif : successGif;
            if (!target) return;

            clearTimeout(gifTimeoutId);
            target.classList.add('is-visible');
            gifTimeoutId = window.setTimeout(() => {
                target.classList.remove('is-visible');
            }, duration);
        }

        function hideFeedbackGifs() {
            successGif.classList.remove('is-visible');
            failGif.classList.remove('is-visible');
            clearTimeout(gifTimeoutId);
        }

        function initGame() {
            score = 0;
            energy = 100;
            warningTriggered = false;
            hideFeedbackGifs();
            updateHUD();
            resize();
        }

        function updateHUD() {
            scoreDisplay.innerText = score;
            energyBar.style.width = `${Math.max(0, energy)}%`;
            energyBar.style.background = energy < 30 ? 'var(--bar-fill-low)' : 'var(--bar-fill)';

            if (gameActive && energy < 28 && !warningTriggered) {
                warningTriggered = true;
                audio.playSFX('warning', { debounce: 900 });
                showGif('fail', 1000);
            } else if (energy >= 40) {
                warningTriggered = false;
            }
        }

        function drawBackground() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#050816');
            bgGradient.addColorStop(1, '#02030a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(120, 244, 255, 0.06)';
            ctx.lineWidth = 1;
            const spacing = Math.max(26, Math.floor(width / 16));
            for (let x = 0; x < width; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawCore() {
            const pulse = Math.sin(Date.now() / 500) * 10;
            const radius = 50 + (energy / 2) + pulse;
            const centerX = width / 2;
            const centerY = height / 2;

            const aura = ctx.createRadialGradient(centerX, centerY, radius * 0.15, centerX, centerY, radius * 1.65);
            aura.addColorStop(0, `rgba(255, 255, 255, ${0.18 + (energy / 100) * 0.32})`);
            aura.addColorStop(0.18, `rgba(125, 244, 255, ${0.22 + energy / 360})`);
            aura.addColorStop(0.42, `rgba(109, 143, 255, ${0.16 + energy / 600})`);
            aura.addColorStop(1, 'rgba(125, 141, 255, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.65, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(centerX, centerY);

            if (ENABLE_ANIMATIONS) {
                ctx.rotate(Math.sin(Date.now() / 1800) * 0.04);
            }

            ctx.strokeStyle = 'rgba(125, 244, 255, 0.24)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.22, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(207, 109, 255, 0.18)';
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.42, 0, Math.PI * 2);
            ctx.stroke();

            const shell = ctx.createRadialGradient(-radius * 0.28, -radius * 0.32, radius * 0.18, 0, 0, radius);
            shell.addColorStop(0, '#ffffff');
            shell.addColorStop(0.14, '#dffeff');
            shell.addColorStop(0.33, '#7ef7ff');
            shell.addColorStop(0.64, '#7195ff');
            shell.addColorStop(1, '#18224f');
            ctx.fillStyle = shell;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.beginPath();
            ctx.arc(-radius * 0.25, -radius * 0.32, radius * 0.22, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#061b32';
            ctx.beginPath();
            ctx.ellipse(-radius * 0.28, -radius * 0.05, radius * 0.12, radius * 0.16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(radius * 0.28, -radius * 0.05, radius * 0.12, radius * 0.16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = Math.max(2, radius * 0.04);
            ctx.strokeStyle = '#061b32';
            ctx.beginPath();
            ctx.arc(0, radius * 0.12, radius * 0.26, 0.18 * Math.PI, 0.82 * Math.PI, false);
            ctx.stroke();

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            drawBackground();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            const drainRate = 0.2 + (score * 0.005);
            energy -= drainRate;

            if (energy <= 0) {
                gameOver();
                return;
            }

            drawCore();
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { debounce: 0 });
            showGif('fail', 1500);
            document.getElementById('hud').classList.remove('visible');
            document.getElementById('game-over-screen').classList.add('visible');
            document.getElementById('finalScore').innerText = score;
        }

        function handleInput() {
            if (!gameActive) return;

            const previousEnergy = energy;
            energy = Math.min(100, energy + 15);
            score++;

            ctx.fillStyle = 'rgba(125, 244, 255, 0.08)';
            ctx.fillRect(0, 0, width, height);

            audio.playSFX('tap', { debounce: 40 });
            audio.playSFX('score', { debounce: 80 });

            if (previousEnergy < 82 && energy >= 82) {
                audio.playSFX('charge', { debounce: 350 });
                showGif('success', 900);
            }
        }

        /** 6. CONTROLS */
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', () => {
            handleInput();
        }, { passive: false });

        primaryButtons.forEach((button) => {
            button.addEventListener('pointerdown', () => {
                button.classList.add('is-pressed');
                audio.playSFX('tap', { debounce: 80 });
            });
            button.addEventListener('pointerup', () => button.classList.remove('is-pressed'));
            button.addEventListener('pointerleave', () => button.classList.remove('is-pressed'));
            button.addEventListener('pointercancel', () => button.classList.remove('is-pressed'));
        });

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            audio.playSFX('start', { debounce: 0 });
            audio.playBGM();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('visible');
            document.getElementById('hud').classList.add('visible');
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            audio.unlock();
            document.getElementById('game-over-screen').classList.remove('visible');
            document.getElementById('hud').classList.add('visible');
            audio.playSFX('start', { debounce: 0 });
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        successGif.src = ASSETS.gifs.success;
        failGif.src = ASSETS.gifs.fail;

        resize();
        drawBackground();
        drawCore();
    });
    </script>
</body>
</html>
