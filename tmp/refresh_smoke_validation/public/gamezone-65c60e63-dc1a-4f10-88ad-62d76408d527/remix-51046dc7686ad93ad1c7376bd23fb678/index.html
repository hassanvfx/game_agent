<script>
/**
 * §0 System Constants & State
 */
const CONFIG_DEFAULT = { heroSpeed: 8, themeColor: '#5865f2', flowSpeed: 3 };
let gameConfig = { ...CONFIG_DEFAULT };
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;

// Game State
let gameState = 'INIT';
let lastTime = 0;
let score = 0;
let lives = 3;
let viralMeter = 0; // 0 to 100
let initialized = false;
let frameCount = 0;

// Entities
let player = { x: 0, y: 0, r: 28, targetX: 0, targetY: 0 };
let bullets = []; // Replies
let enemies = []; // Messages (Friends/Spam/Games)
let particles = [];
let floaters = []; // Background text

// Audio Context
let audioCtx = null;
let sfxBuffers = {};
let bgmEl = document.getElementById('bgm_main');
let bgmStarted = false;
let lastShootSfxAt = 0;
let lastUiSfxAt = 0;
let gifTimeout = 0;
const successGifEl = document.getElementById('success-gif');
const dangerGifEl = document.getElementById('danger-gif');

// Assets
const AVATAR_SVG = new Image();
AVATAR_SVG.src = document.getElementById('asset_player').src;

/**
 * §1 Initialization & Lifecycle
 */
document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    try {
        const cfgEl = document.getElementById('game-config');
        if (cfgEl) {
            const parsed = JSON.parse(cfgEl.textContent);
            Object.keys(parsed).forEach(k => gameConfig[k] = parsed[k].value);
        }
    } catch(e) { console.error('Config parse error', e); }

    // Setup ResizeObserver
    const ro = new ResizeObserver(entries => {
        const entry = entries[0];
        const rect = entry.contentRect;
        resize(rect.width, rect.height);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(gameLoop);
        }
    });
    ro.observe(canvas);

    // Input Binding
    // [agent-note][stage4] repaired: mobile-actionability | element: #gameCanvas | action: scoped pointer suppression to gameplay surface so CTA/button taps keep native click behavior
    canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    canvas.addEventListener('pointermove', handleGameInput, { passive: false });
    canvas.addEventListener('pointerup', handlePointerRelease, { passive: false });
    canvas.addEventListener('pointercancel', handlePointerRelease, { passive: false });
    
    document.getElementById('restart-btn')?.addEventListener('click', handleGlobalInput);
    document.getElementById('post-btn')?.addEventListener('click', handlePostAction);
});

function resize(width, height) {
    dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cw = width;
    ch = height;

    if (initialized) {
        player.x = Math.max(player.r, Math.min(cw - player.r, player.x));
        player.y = Math.max(player.r, Math.min(ch - player.r, player.y));
    }
}

function initGame() {
    initAudio();

    score = 0;
    lives = 3;
    viralMeter = 0;
    bullets = [];
    enemies = [];
    particles = [];
    floaters = [];
    
    player.x = cw / 2;
    player.y = ch - 150;
    player.targetX = player.x;
    player.targetY = player.y;

    updateUI();
    setState('PLAYING');
}

function restartGame() {
    playSfx('ui');
    initGame();
}

/**
 * §2 Input System
 */
function handleGlobalInput(e) {
    const target = e.target;
    if (target?.id === 'post-btn' || target?.closest?.('#post-btn')) return;

    const isCanvasInput = target === canvas;
    const restartBtn = document.getElementById('restart-btn');
    const isRestartInput = target === restartBtn || restartBtn?.contains(target);

    if (isCanvasInput && gameState === 'PLAYING') {
        e.preventDefault();
    }

    unlockAudio();

    if (gameState === 'GAMEOVER') {
        if (isRestartInput) {
            e.preventDefault();
            restartGame();
        }
        return;
    }

    if (gameState === 'PLAYING' && isCanvasInput) {
        updatePlayerTarget(e);
    }
}

function handleGameInput(e) {
    if (gameState !== 'PLAYING') return;
    e.preventDefault();
    updatePlayerTarget(e);
}

function handlePointerRelease(e) {
    if (gameState === 'PLAYING') {
        e.preventDefault();
    }
}

function handlePostAction(e) {
    e.stopPropagation();
    unlockAudio();
    if (gameState !== 'PLAYING') return;
    
    if (viralMeter >= 100) {
        triggerViralPost();
    }
}

function updatePlayerTarget(e) {
    const rect = canvas.getBoundingClientRect();
    const tx = e.clientX - rect.left;
    const ty = e.clientY - rect.top;
    
    player.targetX = Math.max(player.r, Math.min(cw - player.r, tx));
    // Allow more vertical movement for "chat" feel, but keep bottom padding
    player.targetY = Math.max(ch * 0.4, Math.min(ch - player.r - 20, ty));
}

/**
 * §3 Game Logic
 */
function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const actionBar = document.getElementById('action-bar');
    const gameOverScreen = document.getElementById('game-over-screen');

    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        actionBar.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
    } else if (newState === 'GAMEOVER') {
        document.getElementById('final-score').innerText = Math.floor(score);
        gameOverScreen.classList.remove('hidden');
        actionBar.classList.add('hidden');
        playSfx('error');
        showFeedbackGif('danger');
        stopBgm();
    }
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            update(dt);
        }
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    frameCount++;

    // Player Movement (Smooth Lerp)
    const speed = gameConfig.heroSpeed;
    player.x += (player.targetX - player.x) * speed * dt;
    player.y += (player.targetY - player.y) * speed * dt;

    if (!isFinite(player.x) || !isFinite(player.y)) {
        player.x = cw / 2;
        player.y = ch - 150;
    }

    // Auto Reply (Shooting)
    // Slower fire rate for "typing" feel
    if (frameCount % 18 === 0) {
        bullets.push({ 
            x: player.x, 
            y: player.y - 40, 
            vy: -700, 
            active: true,
            txt: getRandomReply(),
            color: gameConfig.themeColor
        });
        playSfx('shoot');
    }

    // Update Bullets
    bullets.forEach(b => {
        b.y += b.vy * dt;
        if (b.y < -50) b.active = false;
    });
    bullets = bullets.filter(b => b.active);

    // Spawn Messages (Enemies)
    if (Math.random() < 0.02 + (score * 0.00003)) {
        const rand = Math.random();
        let type = 'FRIEND';
        if (rand > 0.85) type = 'SPAM'; // 15% Spam
        else if (rand > 0.75) type = 'GAME'; // 10% Game Invites

        const width = type === 'SPAM' ? 110 : (type === 'GAME' ? 130 : 90);
        
        enemies.push({
            x: Math.random() * (cw - 60) + 30,
            y: -60,
            type: type,
            vx: (Math.random() - 0.5) * 20,
            vy: (gameConfig.flowSpeed * 40) + (Math.random() * 30),
            r: 30,
            w: width,
            h: 45,
            hp: type === 'SPAM' ? 2 : 1,
            txt: type === 'SPAM' ? getRandomSpamText() : (type === 'GAME' ? getRandomGameText() : getRandomFriendText()),
            color: type === 'SPAM' ? '#ef4444' : (type === 'GAME' ? '#0ea5e9' : '#22c55e'),
            active: true
        });
    }

    // Update Messages
    enemies.forEach(e => {
        e.y += e.vy * dt;
        e.x += e.vx * dt;
        
        // Bounce off walls
        if (e.x < e.w/2 || e.x > cw - e.w/2) e.vx *= -1;
        if (e.y > ch + 100) e.active = false;

        // Collision with Player
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < player.r + e.r - 10) { // Slightly forgiving collision
            if (e.type === 'FRIEND') {
                score += 100;
                viralMeter = Math.min(100, viralMeter + 5);
                playSfx('collect');
                showFeedbackGif('success');
                spawnParticles(e.x, e.y, '#22c55e', 8, '❤️');
                vibrate('light');
                updateUI();
            } else if (e.type === 'GAME') {
                score += 250;
                viralMeter = Math.min(100, viralMeter + 10);
                playSfx('collect');
                showFeedbackGif('success');
                spawnParticles(e.x, e.y, '#0ea5e9', 12, '🎮');
                vibrate('medium');
                updateUI();
            } else {
                // Spam hit
                lives--;
                viralMeter = Math.max(0, viralMeter - 20);
                playSfx('error');
                showFeedbackGif('danger');
                spawnParticles(e.x, e.y, '#ef4444', 15, '🚫');
                vibrate('heavy');
                updateUI();
                if (lives <= 0) setState('GAMEOVER');
            }
            e.active = false;
        }

        // Collision with Replies (Bullets)
        if (e.type === 'SPAM') {
            bullets.forEach(b => {
                if (!b.active) return;
                // Box collision
                if (b.x > e.x - e.w/2 && b.x < e.x + e.w/2 &&
                    b.y > e.y - e.h/2 && b.y < e.y + e.h/2) {
                    
                    e.hp--;
                    b.active = false;
                    spawnParticles(b.x, b.y, '#ffffff', 3, '•');
                    
                    if (e.hp <= 0) {
                        e.active = false;
                        score += 50;
                        viralMeter = Math.min(100, viralMeter + 2);
                        playSfx('collect'); // Satisfying pop when blocking
                        showFeedbackGif('success');
                        spawnParticles(e.x, e.y, '#ef4444', 8, '🗑️');
                        updateUI();
                    }
                }
            });
        }
    });
    enemies = enemies.filter(e => e.active);

    // Particles
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2.5;
        p.size *= 0.95;
    });
    particles = particles.filter(p => p.life > 0);

    // Background Floaters
    if (Math.random() < 0.05) {
        floaters.push({
            x: 20 + Math.random() * (cw - 40),
            y: -30,
            text: getRandomBgText(),
            speed: 50 + Math.random() * 50,
            opacity: 0.1 + Math.random() * 0.2,
            size: 10 + Math.random() * 6
        });
    }
    floaters.forEach(f => {
        f.y += f.speed * dt;
    });
    floaters = floaters.filter(f => f.y < ch + 50);
}

function triggerViralPost() {
    viralMeter = 0;
    updateUI();
    
    // Clear screen effect
    enemies.forEach(e => {
        e.active = false;
        score += 50;
        spawnParticles(e.x, e.y, e.color, 6, '✨');
    });
    
    // Visual Pulse
    const overlay = document.createElement('div');
    overlay.className = 'absolute inset-0 bg-white/50 z-40 pointer-events-none transition-opacity duration-700';
    document.getElementById('ui-layer').appendChild(overlay);
    setTimeout(() => overlay.remove(), 700);
    
    playSfx('boost');
    showFeedbackGif('success');
    vibrate('heavy');
}

function draw() {
    // Clear & Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
    bgGrad.addColorStop(0, '#171330');
    bgGrad.addColorStop(0.55, '#0f1634');
    bgGrad.addColorStop(1, '#090c1b');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cw, ch);

    for (let i = 0; i < 18; i++) {
        const x = (i * 67 + frameCount * 0.35) % (cw + 120) - 60;
        const y = (i * 93) % ch;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(92,225,255,0.08)' : 'rgba(124,92,255,0.08)';
        ctx.fillRect(x, y, 28, 2);
    }

    // Draw Floaters (Timeline)
    ctx.save();
    ctx.textAlign = 'left';
    floaters.forEach(f => {
        ctx.fillStyle = `rgba(191, 205, 255, ${f.opacity})`;
        ctx.font = `${f.size}px "Exo 2"`;
        ctx.fillText(f.text, f.x, f.y);
    });
    ctx.restore();

    // Draw Player
    ctx.save();
    ctx.translate(player.x, player.y);
    const aura = ctx.createRadialGradient(0, 0, 8, 0, 0, 44);
    aura.addColorStop(0, 'rgba(255,255,255,0.28)');
    aura.addColorStop(0.45, 'rgba(92,225,255,0.22)');
    aura.addColorStop(1, 'rgba(92,225,255,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    ctx.fill();
    if (AVATAR_SVG.complete && AVATAR_SVG.naturalHeight !== 0) {
        ctx.shadowColor = 'rgba(92, 225, 255, 0.45)';
        ctx.shadowBlur = 18;
        ctx.drawImage(AVATAR_SVG, -32, -32, 64, 64);
        ctx.shadowBlur = 0;
    } else {
        ctx.fillStyle = gameConfig.themeColor;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#65f5b6';
    ctx.beginPath();
    ctx.arc(22, 22, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#0f1634';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    // Draw Replies (Bullets)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 14px "Exo 2"';
    bullets.forEach(b => {
        // Chat Bubble shape
        ctx.fillStyle = b.color;
        roundRect(ctx, b.x - 28, b.y - 16, 56, 32, 16);
        ctx.fill();
        // Tail
        ctx.beginPath();
        ctx.moveTo(b.x + 10, b.y + 10);
        ctx.lineTo(b.x + 20, b.y + 20);
        ctx.lineTo(b.x + 0, b.y + 14);
        ctx.fill();
        
        // Text
        ctx.fillStyle = '#f8fbff';
        ctx.fillText(b.txt, b.x, b.y);
    });

    // Draw Messages (Enemies)
    enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        
        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        // Bubble Body
        ctx.fillStyle = 'rgba(239, 245, 255, 0.96)';
        if (e.type === 'SPAM') ctx.fillStyle = 'rgba(58, 18, 35, 0.96)';
        if (e.type === 'GAME') ctx.fillStyle = 'rgba(15, 40, 67, 0.96)';
        
        roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 16);
        ctx.fill();
        
        // Border
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Text
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = e.type === 'SPAM' ? '#ffe0ea' : '#e8f4ff';
        ctx.font = '600 14px "Exo 2"';
        ctx.fillText(e.txt, 0, 0);
        
        // Icon Badge
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(-e.w/2, -e.h/2, 10, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = '#fff';
        ctx.font = '700 12px Orbitron';
        let icon = '💬';
        if (e.type === 'SPAM') icon = '!';
        if (e.type === 'GAME') icon = '🎮';
        ctx.fillText(icon, -e.w/2, -e.h/2 + 1);

        ctx.restore();
    });

    // Draw Particles
    particles.forEach(p => {
        if (p.char) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.font = `${p.size * 2}px "Exo 2"`;
            ctx.fillText(p.char, p.x, p.y);
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
    });
    ctx.globalAlpha = 1.0;
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function spawnParticles(x, y, color, count, char) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 0.6 + Math.random() * 0.4,
            color: color,
            size: 8 + Math.random() * 8,
            char: char
        });
    }
}

function updateUI() {
    document.getElementById('score-display').innerText = Math.floor(score);
    
    // Lives
    const livesContainer = document.getElementById('lives-display');
    livesContainer.innerHTML = '';
    for(let i=0; i<lives; i++) {
        const heart = document.createElement('div');
        heart.className = 'w-4 h-4 rounded-full shadow-sm';
        heart.style.background = 'radial-gradient(circle at 35% 35%, #ff9ab7, #ff5c8a 68%, #9f244d)';
        heart.style.boxShadow = '0 0 10px rgba(255,92,138,0.45)';
        livesContainer.appendChild(heart);
    }

    // Viral Meter
    const bar = document.getElementById('viral-bar');
    const btn = document.getElementById('post-btn');
    const txt = document.getElementById('meter-text');
    
    bar.style.width = `${viralMeter}%`;
    txt.innerText = `${Math.floor(viralMeter)}%`;
    
    if (viralMeter >= 100) {
        btn.classList.remove('opacity-50', 'cursor-not-allowed', 'translate-y-8');
        btn.classList.add('animate-ring');
        btn.querySelector('span:first-child').innerText = "BOOST POST";
    } else {
        btn.classList.add('opacity-50', 'cursor-not-allowed', 'translate-y-8');
        btn.classList.remove('animate-ring');
        btn.querySelector('span:first-child').innerText = "CHARGING...";
    }
}

// Text Generators
function getRandomReply() {
    const txt = ["lol", "ratio", "mood", "no cap", "bet", "wild", "sheesh", "🔥"];
    return txt[Math.floor(Math.random() * txt.length)];
}
function getRandomSpamText() {
    const txt = ["BOT RAID", "CLICKBAIT", "FREE COINS", "FAKE DROP", "VERIFY NOW", "SCAM LINK", "TREND TRAP"];
    return txt[Math.floor(Math.random() * txt.length)];
}
function getRandomFriendText() {
    const txt = ["fresh meme!", "clip dropped", "new remix", "look at this", "send this", "instant classic", "too good"];
    return txt[Math.floor(Math.random() * txt.length)];
}
function getRandomGameText() {
    const txt = ["duet this?", "stitch live", "collab open", "remix room", "co-op trend", "jump in"];
    return txt[Math.floor(Math.random() * txt.length)];
}
function getRandomBgText() {
    const txt = ["fresh post loading", "chat is reacting...", "trend radar rising", "clip queue updated", "new remix spotted"];
    return txt[Math.floor(Math.random() * txt.length)];
}

/**
 * §4 Audio System
 */
function initAudio() {
    if ((!window.AudioContext && !window.webkitAudioContext) || audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    ['sfx_collect', 'sfx_shoot', 'sfx_error', 'sfx_boost', 'sfx_ui'].forEach(id => {
        const el = document.getElementById(id);
        if (el && el.src) {
            fetch(el.src)
                .then(r => r.arrayBuffer())
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(decoded => { sfxBuffers[id] = decoded; })
                .catch(() => {});
        }
    });

    bgmEl.volume = 0.32;
}

function unlockAudio() {
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    startBgm();
}

function playSfx(type) {
    if (!audioCtx) return;
    
    let id = '';
    if (type === 'collect') id = 'sfx_collect';
    if (type === 'shoot') id = 'sfx_shoot';
    if (type === 'error') id = 'sfx_error';
    if (type === 'boost') id = 'sfx_boost';
    if (type === 'ui') id = 'sfx_ui';

    const now = performance.now();
    if (type === 'shoot' && now - lastShootSfxAt < 120) return;
    if (type === 'ui' && now - lastUiSfxAt < 160) return;
    if (type === 'shoot') lastShootSfxAt = now;
    if (type === 'ui') lastUiSfxAt = now;
    
    if (sfxBuffers[id]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = sfxBuffers[id];
        src.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.value = type === 'shoot' ? 0.16 : type === 'boost' ? 0.28 : type === 'error' ? 0.24 : 0.22;
        if (type === 'collect') src.playbackRate.value = 0.94 + Math.random() * 0.14;
        src.start(0);
    } else {
        synthesizeSfx(type);
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'shoot' || type === 'ui') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'ui' ? 720 : 600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'boost' || type === 'collect') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'boost' ? 420 : 520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(type === 'boost' ? 860 : 740, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(type === 'boost' ? 0.08 : 0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
    }
}

function startBgm() {
    if (!bgmEl || bgmStarted || gameState !== 'PLAYING') return;
    bgmStarted = true;
    bgmEl.currentTime = 0;
    bgmEl.play().catch(() => {
        bgmStarted = false;
    });
}

function stopBgm() {
    if (!bgmEl) return;
    bgmEl.pause();
    bgmStarted = false;
}

function showFeedbackGif(type) {
    const target = type === 'danger' ? dangerGifEl : successGifEl;
    const other = type === 'danger' ? successGifEl : dangerGifEl;
    if (!target) return;
    window.clearTimeout(gifTimeout);
    other?.classList.remove('show');
    target.classList.add('show');
    gifTimeout = window.setTimeout(() => {
        target.classList.remove('show');
    }, type === 'danger' ? 1300 : 1000);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}
