<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matchday Manager</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Orbitron:wght@400;700&family=Audiowide&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-night: #07111d;
            --panel-dark: rgba(8, 19, 34, 0.82);
            --panel-border: rgba(141, 220, 255, 0.3);
            --text-main: #f4fbff;
            --text-soft: rgba(230, 246, 255, 0.78);
            --aqua: #7be7ff;
            --aqua-strong: #3fc7f5;
            --gold: #ffd65a;
            --pitch-light: #1f7c4f;
            --pitch-dark: #195f3f;
            --danger: #ff6d6d;
            --home-primary: #ffe27a;
            --home-secondary: #1a2740;
            --away-primary: #ff6b83;
            --away-secondary: #fff4fb;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(63, 199, 245, 0.18), transparent 38%),
                linear-gradient(180deg, #0b1b2c 0%, var(--bg-night) 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 214, 90, 0.08), transparent 22%),
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(13, 29, 51, 0.92), rgba(7, 16, 29, 0.96));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 -10px 24px rgba(0,0,0,0.26);
        }
        .hud-card {
            background: linear-gradient(180deg, rgba(10, 27, 47, 0.88), rgba(4, 14, 25, 0.96));
            border: 1px solid var(--panel-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.22);
        }
        .hud-label {
            color: var(--text-soft);
            letter-spacing: 0.22em;
            text-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }
        .hud-value {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.04em;
        }
        .panel-title, .fx-font {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.06em;
        }
        .panel-title {
            color: #f8f2da;
            text-shadow: 0 2px 0 rgba(0,0,0,0.35);
        }
        .btn-press {
            transition: transform 0.08s ease, filter 0.12s ease, box-shadow 0.12s ease;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 18px rgba(0,0,0,0.22);
        }
        .btn-press:active {
            transform: scale(0.95);
            filter: brightness(1.08);
        }
        .action-card-home {
            background: linear-gradient(180deg, #f5b528, #cf7a16);
        }
        .action-card-away {
            background: linear-gradient(180deg, #46a4ff, #2f62dc);
        }
        .accent-note {
            color: rgba(209, 240, 255, 0.72);
        }
        .no-select { user-select: none; -webkit-user-select: none; }
        .feedback-strip {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: min(42vw, 144px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 8px 22px rgba(0,0,0,0.28);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 3;
        }
        .feedback-strip.show {
            opacity: 0.88;
            transform: translateX(-50%) translateY(0);
        }
        .feedback-strip img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            aspect-ratio: 1.4 / 1;
        }
        .feedback-caption {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 7px;
            padding: 4px 7px;
            border-radius: 999px;
            background: rgba(5, 10, 18, 0.68);
            color: #f8f2da;
            font-family: 'Audiowide', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-align: center;
            text-transform: uppercase;
        }
        .feedback-strip.goal-burst {
            top: 130px;
        }
        .feedback-strip.goal-burst.show {
            opacity: 0.96;
            transform: translateX(-50%) scale(1.02);
        }
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling only */
        /* [agent-note][stage4] repaired: font-remap | action: catalog-backed Rajdhani/Audiowide/Orbitron replaced prior non-catalog usage refs */
        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */
    </style>
</head>
<body>

<div id="assets" style="display: none;">
    <audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" loop preload="auto"></audio>
    <audio id="sfx_money" data-editable="audio" data-label="Money SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>

<div id="game-container" class="relative w-full h-full no-select bg-green-800">
    <canvas id="gameCanvas"></canvas>
    <div id="tap-feedback" class="feedback-strip" aria-hidden="true">
        <img src="https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp" alt="Crowd reaction">

    </div>

        <img src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp" alt="Goal celebration">
        <div class="feedback-caption">Goal burst</div>
    </div>
    
    <!-- HUD -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between">
        <!-- Top Bar -->
            <div class="p-4 flex justify-between items-start gap-3">
                <div class="hud-card rounded-xl px-4 py-2 flex flex-col items-center min-w-[100px]">
                    <span class="hud-label text-[11px] font-bold uppercase">Match Funds</span>

                    <span class="font-semibold text-base leading-none">Train Squad</span>
                    <span id="cost-player" class="hud-value text-xs opacity-90 mt-1">$100</span>
                    <span class="text-[10px] opacity-80 uppercase tracking-[0.18em]">+Goal Pressure</span>
                </button>

            <div class="mt-4 text-center accent-note text-xs uppercase tracking-[0.18em]">Tap the pitch to sell tickets • Goals pay big bonuses</div>
        </div>

<script>
/**
 * §2 System Invariants & Architecture
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimization
const dpr = window.devicePixelRatio || 1;

// Single Source of Truth
let gameState = 'INIT'; // INIT, PLAYING
let initialized = false;
let cw = 0, ch = 0;
let lastTime = 0;

// Config Proxy
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = new Proxy({}, {
    get: (target, prop) => gameConfigDefs[prop]?.value
});

// Game Data
const gameData = {
    money: 0,
    goals: 0,
    ticketLevel: 1,
    teamLevel: 1,
    seatCost: 50,
    playerCost: 100
};

// Audio System (Web Audio API)
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
const sfxBuffers = {};
const bgmEl = document.getElementById('bgm_main');
let bgmUnlocked = false;
let lastTapSfxAt = 0;
let lastBlockedSfxAt = 0;
let activeFeedbackTimer = 0;
let activeGoalTimer = 0;
const feedbackEls = {
    tap: document.getElementById('tap-feedback'),
    goal: document.getElementById('goal-feedback')
};

// Entities
const players = [];
const particles = [];
let ball = { x: 0, y: 0, vx: 0, vy: 0, owner: null };
let shake = 0;

/**
 * §3.5 Audio System Implementation
 */
function ensureAudioContext() {
    if (!audioCtx && AudioContextCtor) {
        audioCtx = new AudioContextCtor();
    }
    return audioCtx;
}

async function initAudio() {
    const ctxRef = ensureAudioContext();
    if (!ctxRef || initAudio.loaded) return;
    initAudio.loaded = true;

    const loadBuffer = async (id, url) => {
        try {
            const res = await fetch(url);
            const arrayBuffer = await res.arrayBuffer();
            sfxBuffers[id] = await ctxRef.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn('SFX Load Fail:', id); }
    };

    const sfxList = [
        { id: 'money', el: 'sfx_money' },
        { id: 'click', el: 'sfx_click' },
        { id: 'success', el: 'sfx_success' },
        { id: 'blocked', el: 'sfx_blocked' },
        { id: 'goal', el: 'sfx_goal' }
    ];
    
    await Promise.all(sfxList.map(s => loadBuffer(s.id, document.getElementById(s.el).src)));
}

function playSfx(id) {
    const ctxRef = ensureAudioContext();
    if (!ctxRef) return;
    if (ctxRef.state === 'suspended') ctxRef.resume().catch(() => {});
    
    const buffer = sfxBuffers[id];
    if (buffer) {
        const source = ctxRef.createBufferSource();
        const gain = ctxRef.createGain();
        source.buffer = buffer;
        gain.gain.value = id === 'goal' ? 0.2 : id === 'blocked' ? 0.11 : 0.16;
        source.connect(gain);
        gain.connect(ctxRef.destination);
        source.start(0);
    } else {
        const osc = ctxRef.createOscillator();
        const gain = ctxRef.createGain();
        osc.connect(gain);
        gain.connect(ctxRef.destination);
        if (id === 'money') {
            osc.frequency.setValueAtTime(900, ctxRef.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1280, ctxRef.currentTime + 0.08);
        } else if (id === 'blocked') {
            osc.frequency.setValueAtTime(240, ctxRef.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, ctxRef.currentTime + 0.12);
        } else if (id === 'goal' || id === 'success') {
            osc.frequency.setValueAtTime(700, ctxRef.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctxRef.currentTime + 0.14);
        } else {
            osc.frequency.setValueAtTime(420, ctxRef.currentTime);
        }
        gain.gain.setValueAtTime(0.08, ctxRef.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctxRef.currentTime + 0.14);
        osc.start();
        osc.stop(ctxRef.currentTime + 0.14);
    }
}

function unlockBgm() {
    if (bgmUnlocked) return;
    bgmUnlocked = true;
    bgmEl.volume = 0.2;
    bgmEl.play().catch(() => {});
}

function showFeedback(type, duration = 900) {
    const el = feedbackEls[type];
    if (!el) return;
    const timerKey = type === 'goal' ? 'activeGoalTimer' : 'activeFeedbackTimer';
    clearTimeout(window[timerKey]);
    el.classList.add('show');
    window[timerKey] = setTimeout(() => el.classList.remove('show'), duration);
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 50 : 10);
    }
}

/**
 * §3.3 Character & Simulation System
 */
class Player {
    constructor(team) {
        this.team = team; // 0 = Home (Green/White), 1 = Away (Red/White)
        this.reset();
    }

    reset() {
        // Spawn in own half
        this.x = this.team === 0 ? cw * 0.25 : cw * 0.75;
        this.y = ch * 0.2 + Math.random() * (ch * 0.6);
        this.speed = (2 + Math.random()) * (this.team === 0 ? 1 + (gameData.teamLevel * 0.1) : 1);
        this.targetX = this.x;
        this.targetY = this.y;
        this.state = 'IDLE';
        this.timer = 0;
    }

    update(dt) {
        // Simple AI
        this.timer -= dt;
        
        // If ball is free, chase it
        const dx = ball.x - this.x;
        const dy = ball.y - this.y;
        const distToBall = Math.sqrt(dx*dx + dy*dy);

        if (ball.owner === null) {
            if (distToBall < 200) {
                this.targetX = ball.x;
                this.targetY = ball.y;
            }
        } else if (ball.owner === this) {
            // I have the ball, run to goal
            this.targetX = this.team === 0 ? cw - 50 : 50;
            this.targetY = ch / 2;
        } else {
            // Reposition
            if (this.timer <= 0) {
                this.targetX = Math.random() * cw;
                this.targetY = ch * 0.1 + Math.random() * (ch * 0.8);
                this.timer = 2;
            }
        }

        // Move
        const tx = this.targetX - this.x;
        const ty = this.targetY - this.y;
        const dist = Math.sqrt(tx*tx + ty*ty);
        
        if (dist > 5) {
            const moveSpeed = this.speed * gameConfig.matchSpeed * 60 * dt;
            this.x += (tx / dist) * moveSpeed;
            this.y += (ty / dist) * moveSpeed;
        }

        // Clamp
        this.x = Math.max(10, Math.min(cw - 10, this.x));
        this.y = Math.max(10, Math.min(ch - 10, this.y));

        // Ball Interaction
        if (ball.owner === null && distToBall < 15) {
            ball.owner = this;
        }
    }

    draw(ctx) {
        const isHome = this.team === 0;
        const primary = isHome ? '#ffe27a' : '#ff6b83';
        const secondary = isHome ? '#17233d' : '#fff4fb';
        const accent = isHome ? '#8cf7ff' : '#ffd1dc';

        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 9, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = primary;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = secondary;
        ctx.beginPath();
        ctx.arc(this.x, this.y - 2, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - 4.5, this.y + 1.5);
        ctx.lineTo(this.x + 4.5, this.y + 1.5);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.78)';
        ctx.beginPath();
        ctx.arc(this.x - 2.5, this.y - 3.5, 1.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.life = 1.0;
        this.vy = -2;
    }
    update(dt) {
        this.y += this.vy * 60 * dt;
        this.life -= dt;
        this.vy *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = '#FFD65A';
        ctx.strokeStyle = 'rgba(10, 19, 33, 0.65)';
        ctx.lineWidth = 4;
        ctx.font = "24px 'Audiowide'";
        ctx.textAlign = 'center';
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function updateBall(dt) {
    if (ball.owner) {
        ball.x = ball.owner.x + 5; // Dribble offset
        ball.y = ball.owner.y + 5;
        
        // Goal Check
        if ((ball.owner.team === 0 && ball.x > cw - 60) || (ball.owner.team === 1 && ball.x < 60)) {
            if (Math.abs(ball.y - ch/2) < 100) {
                scoreGoal(ball.owner.team);
            }
        }
    } else {
        // Friction if loose
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.95;
        ball.vy *= 0.95;
    }
    
    // Clamp Ball
    ball.x = Math.max(0, Math.min(cw, ball.x));
    ball.y = Math.max(0, Math.min(ch, ball.y));
}

function scoreGoal(team) {
    if (team === 0) {
        gameData.goals++;
        gameData.money += 100 * gameData.ticketLevel;
        updateUI();
        shake = 20;
        vibrate('heavy');
        playSfx('goal');
        showFeedback('goal', 1500);
        // Confetti
        for(let i=0; i<10; i++) {
            particles.push(new Particle(cw/2 + (Math.random()-0.5)*100, ch/2 + (Math.random()-0.5)*100, "GOAL!"));
        }
    }
    
    // Reset
    ball.owner = null;
    ball.x = cw/2;
    ball.y = ch/2;
    ball.vx = 0;
    ball.vy = 0;
    players.forEach(p => p.reset());
}

/**
 * §3.1 Viewport & Canvas
 */
const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    const { width, height } = entry.contentRect;
    
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    
    cw = width;
    ch = height;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initGame();
    } else {
        // Clamp entities
        players.forEach(p => p.reset());
        ball.x = cw/2; ball.y = ch/2;
    }
});

/**
 * §3.4 Lifecycle
 */
function initGame() {
    if (initialized) return;
    
    // Init Entities
    for(let i=0; i<5; i++) players.push(new Player(0)); // Home
    for(let i=0; i<5; i++) players.push(new Player(1)); // Away
    ball.x = cw/2; ball.y = ch/2;

    // Audio will unlock from first user gesture
    initAudio();

    // Start Loop
    initialized = true;
    gameState = 'PLAYING';
    
    requestAnimationFrame(loop);
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Shake decay
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;

    players.forEach(p => p.update(dt));
    updateBall(dt);
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, '#0f253b');
    skyGradient.addColorStop(0.2, '#123754');
    skyGradient.addColorStop(0.2001, gameConfig.themeColor);
    skyGradient.addColorStop(1, '#195f3f');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    // Shake Transform
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // Stadium frame and pitch pattern
    ctx.fillStyle = 'rgba(3, 8, 15, 0.28)';
    ctx.fillRect(0, 0, cw, Math.min(ch * 0.16, 120));
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const stripeSize = 46;
    for(let y=0; y<ch; y+=stripeSize*2) {
        ctx.fillRect(0, y, cw, stripeSize);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    for (let x = 0; x < cw; x += 24) {
        ctx.fillRect(x, 0, 2, ch);
    }

    // Pitch Markings
    ctx.strokeStyle = 'rgba(236,248,255,0.52)';
    ctx.lineWidth = 2;
    
    // Center Circle
    ctx.beginPath();
    ctx.arc(cw/2, ch/2, 50, 0, Math.PI*2);
    ctx.stroke();
    
    // Center Line
    ctx.beginPath();
    ctx.moveTo(0, ch/2); // Actually let's do vertical pitch for portrait?
    // Wait, football is usually horizontal. Let's draw it as a vertical pitch view for mobile portrait.
    // Re-orienting markings for vertical play
    
    // Actually, let's stick to the simulation logic (x is horizontal).
    // Let's draw the center line vertically for a horizontal pitch view fit into portrait?
    // No, let's make the pitch vertical.
    // Center Line
    ctx.beginPath();
    ctx.moveTo(0, ch/2);
    ctx.lineTo(cw, ch/2);
    ctx.stroke();

    // Goals
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(cw/2 - 60, 0, 120, 40);
    ctx.fillRect(cw/2 - 60, ch - 40, 120, 40);
    ctx.strokeRect(cw/2 - 60, 0, 120, 40); // Top Goal
    ctx.strokeRect(cw/2 - 60, ch - 40, 120, 40); // Bottom Goal

    // Stadium glow lanes
    const sideGlow = ctx.createLinearGradient(0, 0, cw, 0);
    sideGlow.addColorStop(0, 'rgba(123,231,255,0.08)');
    sideGlow.addColorStop(0.5, 'rgba(255,214,90,0.02)');
    sideGlow.addColorStop(1, 'rgba(123,231,255,0.08)');
    ctx.fillStyle = sideGlow;
    ctx.fillRect(0, 0, cw, ch);

    // Entities
    players.forEach(p => p.draw(ctx));
    
    // Ball
    const ballGradient = ctx.createRadialGradient(ball.x - 1, ball.y - 2, 1, ball.x, ball.y, 8);
    ballGradient.addColorStop(0, '#ffffff');
    ballGradient.addColorStop(0.45, '#ffe27a');
    ballGradient.addColorStop(1, '#d28d1b');
    ctx.fillStyle = ballGradient;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(16, 22, 34, 0.9)';
    ctx.lineWidth = 1.25;
    ctx.stroke();

    // Particles
    particles.forEach(p => p.draw(ctx));

    ctx.restore();
}

/**
 * §3.2 Input System
 */
function handleGlobalInput(e) {
    const ctxRef = ensureAudioContext();
    if (ctxRef && ctxRef.state === 'suspended') {
        ctxRef.resume().catch(() => {});
    }
    initAudio();
    unlockBgm();

    if (e.target.closest('button')) return; // Let buttons handle themselves

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Tap Logic: Sell Ticket
        const value = Math.floor(gameConfig.ticketPrice * gameData.ticketLevel);
        gameData.money += value;
        updateUI();
        
        // Feedback
        if (performance.now() - lastTapSfxAt > 90) {
            playSfx('money');
            lastTapSfxAt = performance.now();
        }
        vibrate('light');
        particles.push(new Particle(x, y, `+$${value}`));
        showFeedback('tap', 720);
        
        // Visual Ripple (Simple)
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(x, y, 30, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
}

// UI Handling
function updateUI() {
    document.getElementById('score-display').textContent = '$' + gameData.money;
    document.getElementById('goals-display').textContent = gameData.goals;
    
    // Update Button States
    const btnSeats = document.getElementById('btn-upgrade-seats');
    const btnPlayer = document.getElementById('btn-sign-player');
    
    btnSeats.style.opacity = gameData.money >= gameData.seatCost ? '1' : '0.5';
    btnPlayer.style.opacity = gameData.money >= gameData.playerCost ? '1' : '0.5';
    
    document.getElementById('cost-seats').textContent = '$' + gameData.seatCost;
    document.getElementById('cost-player').textContent = '$' + gameData.playerCost;
}

function buyUpgrade(type) {
    playSfx('click');
    let purchased = false;
    if (type === 'seats') {
        if (gameData.money >= gameData.seatCost) {
            gameData.money -= gameData.seatCost;
            gameData.ticketLevel += 0.5;
            gameData.seatCost = Math.floor(gameData.seatCost * 1.5);
            purchased = true;
        }
    } else if (type === 'player') {
        if (gameData.money >= gameData.playerCost) {
            gameData.money -= gameData.playerCost;
            gameData.teamLevel += 1;
            gameData.playerCost = Math.floor(gameData.playerCost * 1.8);
            purchased = true;
            // Visual feedback: flash players
            players.forEach(p => { if(p.team===0) p.speed *= 1.1; });
        }
    }
    if (purchased) {
        updateUI();
        vibrate('medium');
        playSfx('success');
        showFeedback('tap', 900);
    } else if (performance.now() - lastBlockedSfxAt > 180) {
        playSfx('blocked');
        lastBlockedSfxAt = performance.now();
    }
}

// Event Bindings
document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    
    document.getElementById('btn-upgrade-seats').addEventListener('click', () => buyUpgrade('seats'));
    document.getElementById('btn-sign-player').addEventListener('click', () => buyUpgrade('player'));
    
    updateUI();
});

</script>
