<script>
// --- CORE ENGINE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let animationId;
let lastTime = 0;

// Config Access
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if(window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if(key === 'gameTitle') document.getElementById('ui-title').innerText = val;
    }
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    bgm: document.getElementById('bgm_main'),
    sfx: {
        collect: document.getElementById('sfx_collect'),
        crash: document.getElementById('sfx_crash'),
        warning: document.getElementById('sfx_warning'),
        ui: document.getElementById('sfx_ui'),
        gameover: document.getElementById('sfx_gameover')
    },
    osc: null,
    gain: null,
    lastPlay: {},
    
    init() {
        if(!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            // Engine Drone
            this.osc = this.ctx.createOscillator();
            this.gain = this.ctx.createGain();
            this.osc.type = 'sawtooth';
            this.osc.frequency.value = 50;
            this.gain.gain.value = 0;
            this.osc.connect(this.gain);
            this.gain.connect(this.ctx.destination);
            this.osc.start();
        }
        if(this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    },

    playBgm() {
        this.bgm.volume = 0.2;
        if(this.bgm.paused) {
            this.bgm.currentTime = 0;
        }
        this.bgm.play().catch(() => {});
    },

    stopBgm() {
        this.bgm.pause();
        if(this.ctx && this.gain) {
            this.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
        }
    },

    playSfx(type, volume = 0.6, cooldown = 90) {
        const now = performance.now();
        if(this.lastPlay[type] && now - this.lastPlay[type] < cooldown) return;
        this.lastPlay[type] = now;

        if(this.sfx[type]) {
            const s = this.sfx[type].cloneNode();
            s.volume = volume;
            s.play().catch(() => {});
        } else if(this.ctx) {
            // Fallback Synth
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g); g.connect(this.ctx.destination);
            if(type === 'collect' || type === 'ui') {
                o.frequency.setValueAtTime(800, this.ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                g.gain.setValueAtTime(0.2, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                o.start(); o.stop(this.ctx.currentTime + 0.1);
            } else {
                o.type = 'square';
                o.frequency.setValueAtTime(100, this.ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.3);
                g.gain.setValueAtTime(0.28, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                o.start(); o.stop(this.ctx.currentTime + 0.3);
            }
        }
    },

    updateEngine(speedRatio) {
        if(this.ctx && this.gain) {
            const baseFreq = 60 + (speedRatio * 200);
            this.osc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.1);
            
            // Modulation for "throbbing" engine
            const vol = 0.03 + (speedRatio * 0.08);
            this.gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);
        }
    }
};

// --- GAME STATE ---
const State = {
    active: false,
    over: false,
    distance: 0,
    speed: 0,
    maxSpeed: 2000,
    heat: 0,
    overheated: false,
    playerX: 0, // -1 to 1
    inputX: 0,
    holding: false,
    shake: 0,
    objects: [],
    stars: [],
    colors: {
        bg: '#050510',
        grid: '#233567',
        glow: '#22d3ee',
        hazard: '#ff0055',
        reward: '#ffe600',
        lane: '#8b5cf6'
    },
    units: ['km', 'AU', 'LY', 'pc', 'kpc', 'Mpc', 'Gpc', 'INF'],
    gifTimers: {
        collect: 0,
        crash: 0
    },
    spawnTimer: null
};

// --- ENTITIES ---
class Star {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = (Math.random() - 0.5) * canvas.width * 2;
        this.y = (Math.random() - 0.5) * canvas.height * 2;
        this.z = Math.random() * 2000 + 500;
        this.size = Math.random() * 2;
        this.color = Math.random() > 0.9 ? window.gameConfig.heroColor : '#ffffff';
    }
    update(dt, speed) {
        this.z -= speed * dt * 10;
        if(this.z <= 1) this.reset();
    }
    draw(ctx, cx, cy) {
        const k = 500 / this.z;
        const px = this.x * k + cx;
        const py = this.y * k + cy;
        const s = this.size * k;
        
        if(px < 0 || px > canvas.width || py < 0 || py > canvas.height) return;

        // Trail effect based on speed
        const len = (State.speed / State.maxSpeed) * 40 * k;
        
        ctx.globalAlpha = Math.min(1, k);
        ctx.fillStyle = this.color;
        
        if(len > 2) {
            const angle = Math.atan2(py - cy, px - cx);
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px - Math.cos(angle)*len, py - Math.sin(angle)*len);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = s;
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(px, py, s, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

class Obstacle {
    constructor() {
        this.reset();
    }
    reset() {
        this.active = false;
        this.x = 0;
        this.y = 0;
        this.z = 2000;
        this.type = Math.random() > 0.7 ? 'good' : 'bad'; // 30% good
        this.lane = (Math.random() - 0.5) * 1.5; // -0.75 to 0.75
    }
    spawn() {
        this.active = true;
        this.z = 3000;
        this.lane = (Math.random() - 0.5) * 2.5; 
        this.type = Math.random() > 0.8 ? 'good' : 'bad';
    }
    update(dt, speed) {
        if(!this.active) return;
        this.z -= speed * dt * 10;
        
        // Collision
        if(this.z < 100 && this.z > 0) {
            // Simple lane collision
            if(Math.abs(this.lane - State.playerX) < 0.4) {
                if(this.type === 'bad') hitObstacle();
                else collectItem();
                this.active = false;
            }
        }

        if(this.z <= 0) this.active = false;
    }
    draw(ctx, cx, cy) {
        if(!this.active) return;
        const k = 500 / this.z;
        const px = (this.lane * canvas.width * 0.5) * k + cx;
        const py = (200) * k + cy; // Floor level
        const s = 40 * k;

        ctx.globalAlpha = Math.min(1, k * 2);
        
        if(this.type === 'bad') {
            ctx.fillStyle = State.colors.hazard;
            ctx.shadowColor = State.colors.hazard;
            ctx.shadowBlur = 20;
            // Draw Spike shard
            ctx.beginPath();
            ctx.moveTo(px, py - s);
            ctx.lineTo(px - s/2, py + s/2);
            ctx.lineTo(px + s/2, py + s/2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.beginPath();
            ctx.moveTo(px, py - s * 0.55);
            ctx.lineTo(px - s * 0.14, py + s * 0.1);
            ctx.lineTo(px + s * 0.14, py + s * 0.1);
            ctx.fill();
        } else {
            ctx.fillStyle = State.colors.reward;
            ctx.shadowColor = State.colors.reward;
            ctx.shadowBlur = 20;
            // Draw orb core
            ctx.beginPath();
            ctx.arc(px, py, s/2, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.arc(px - s * 0.12, py - s * 0.12, s * 0.12, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
}

// --- LOGIC ---
function setGifState(type, active) {
    const el = document.getElementById(`gif-${type}`);
    if(!el) return;
    el.classList.toggle('visible', active);
}

function triggerFeedback(type, duration = 700) {
    State.gifTimers[type] = duration;
    setGifState(type, true);
}

function initGame() {
    State.distance = 0;
    State.speed = 0;
    State.heat = 0;
    State.overheated = false;
    State.playerX = 0;
    State.inputX = 0;
    State.gifTimers.collect = 0;
    State.gifTimers.crash = 0;
    setGifState('collect', false);
    setGifState('crash', false);
    State.stars = Array(150).fill().map(() => new Star());
    State.objects = Array(10).fill().map(() => new Obstacle());
    
    // Object pooling spawn logic
    if(State.spawnTimer) clearInterval(State.spawnTimer);
    State.spawnTimer = setInterval(() => {
        if(!State.active) return;
        const idle = State.objects.find(o => !o.active);
        if(idle && Math.random() < (0.05 + State.speed/5000)) idle.spawn();
    }, 100);

    document.getElementById('score-display').innerHTML = '0 <span class="text-sm text-cyan-400">km</span>';
    document.getElementById('heat-bar-fill').style.width = '0%';
    document.getElementById('heat-bar-fill').className = 'h-full bg-cyan-400 w-0';
    document.getElementById('heat-warning').classList.add('hidden');
    document.getElementById('tutorial-hint').classList.remove('hidden');
}

function hitObstacle() {
    State.speed = 10;
    State.shake = 20;
    triggerFeedback('crash', 850);
    AudioSys.playSfx('crash', 0.55, 180);
    // Flash Red
    const flash = document.createElement('div');
    flash.className = 'absolute inset-0 bg-red-500 opacity-50 z-40 pointer-events-none';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 100);
}

function collectItem() {
    State.heat = Math.max(0, State.heat - 30);
    State.distance += 1000; // Bonus distance
    triggerFeedback('collect', 700);
    AudioSys.playSfx('collect', 0.5, 120);
}

function gameOver() {
    State.active = false;
    State.over = true;
    AudioSys.stopBgm();
    AudioSys.playSfx('gameover', 0.62, 300);
    triggerFeedback('crash', 1200);
    
    const unitIndex = Math.floor(Math.log10(Math.max(1, State.distance)) / 3);
    const displayDist = (State.distance / Math.pow(10, unitIndex * 3)).toFixed(2);
    const unit = State.units[Math.min(unitIndex, State.units.length-1)] || 'km';
    
    document.getElementById('final-score').innerText = `${displayDist} ${unit}`;
    document.getElementById('game-container').classList.add('blur-sm');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function update(dt) {
    if(!State.active) return;

    // Heat Logic
    if(State.holding && !State.overheated) {
        State.speed += dt * 500;
        State.heat += dt * 25;
        document.getElementById('tutorial-hint').classList.add('hidden');
    } else {
        State.speed -= dt * 300;
        State.heat -= dt * 15;
    }

    // Clamp
    State.speed = Math.max(0, Math.min(State.speed, State.maxSpeed));
    State.heat = Math.max(0, Math.min(State.heat, 100));

    // Overheat check
    if(State.heat >= 100 && !State.overheated) {
        State.overheated = true;
        State.speed = 100; // Penalty
        triggerFeedback('crash', 950);
        AudioSys.playSfx('warning', 0.58, 500);
        document.getElementById('heat-warning').classList.remove('hidden');
        document.getElementById('heat-bar-fill').classList.remove('bg-cyan-400');
        document.getElementById('heat-bar-fill').classList.add('bg-red-500');
        setTimeout(() => {
            State.overheated = false;
            State.heat = 50;
            document.getElementById('heat-warning').classList.add('hidden');
            document.getElementById('heat-bar-fill').classList.add('bg-cyan-400');
            document.getElementById('heat-bar-fill').classList.remove('bg-red-500');
        }, 2000);
    }

    Object.keys(State.gifTimers).forEach(key => {
        if(State.gifTimers[key] > 0) {
            State.gifTimers[key] -= dt * 1000;
            if(State.gifTimers[key] <= 0) setGifState(key, false);
        }
    });

    // Movement
    State.playerX += (State.inputX - State.playerX) * dt * 5;
    State.playerX = Math.max(-1, Math.min(1, State.playerX));

    // Distance
    // Scale distance exponentially based on speed to simulate "Light Speed"
    // speed 0-2000. Real scale factor.
    let speedFactor = 1;
    if(State.speed > 1000) speedFactor = Math.pow((State.speed - 1000)/100 + 1, 3);
    
    State.distance += (State.speed * dt * speedFactor) / 10;

    // Audio Engine
    AudioSys.updateEngine(State.speed / State.maxSpeed);

    // Entities
    State.stars.forEach(s => s.update(dt, State.speed + 50)); // Stars always move a bit
    State.objects.forEach(o => o.update(dt, State.speed + 50));

    // Shake decay
    if(State.shake > 0) State.shake *= 0.9;

    // UI Updates
    const hBar = document.getElementById('heat-bar-fill');
    hBar.style.width = `${State.heat}%`;
    
    // Formatting big numbers
    const unitIndex = Math.floor(Math.log10(Math.max(1, State.distance)) / 4); // Every 10000x change unit
    const displayDist = (State.distance / Math.pow(10, unitIndex * 4)).toFixed(1);
    const unit = State.units[Math.min(unitIndex, State.units.length-1)] || 'km';
    document.getElementById('score-display').innerHTML = `${displayDist} <span class="text-sm text-cyan-400">${unit}</span>`;
    
    const c = (State.speed/20).toFixed(0);
    document.getElementById('speed-display').innerHTML = `${c} <span class="text-sm">c</span>`;
}

function draw() {
    // Clear
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#08061b');
    bgGrad.addColorStop(0.55, State.colors.bg);
    bgGrad.addColorStop(1, '#020208');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Shake
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    if(State.shake > 0.5) {
        cx += (Math.random() - 0.5) * State.shake;
        cy += (Math.random() - 0.5) * State.shake;
    }

    const speedRatio = State.speed / State.maxSpeed;

    // Nebula halo
    const halo = ctx.createRadialGradient(cx, cy * 0.7, 20, cx, cy * 0.7, canvas.width * 0.7);
    halo.addColorStop(0, 'rgba(34, 211, 238, 0.14)');
    halo.addColorStop(0.45, 'rgba(139, 92, 246, 0.10)');
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Tunnel floor glow
    const floorGrad = ctx.createLinearGradient(0, cy, 0, canvas.height);
    floorGrad.addColorStop(0, 'rgba(34, 211, 238, 0)');
    floorGrad.addColorStop(1, 'rgba(34, 211, 238, 0.12)');
    ctx.fillStyle = floorGrad;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(0, canvas.height);
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fill();

    // Grid / Tunnel floor
    ctx.save();
    ctx.strokeStyle = State.colors.grid;
    ctx.lineWidth = 2;
    ctx.shadowColor = State.colors.glow;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    for(let i=-5; i<=5; i++) {
        const x = cx + i * canvas.width * 0.4;
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, canvas.height);
    }
    ctx.stroke();

    const offset = (Date.now() * (0.08 + speedRatio * 0.6)) % 1;
    for(let i=0; i<7; i++) {
        const t = ((i / 7) + offset) % 1;
        const y = cy + Math.pow(t, 1.9) * (canvas.height - cy);
        const width = Math.max(40, (y - cy) * 1.45);
        ctx.beginPath();
        ctx.moveTo(cx - width, y);
        ctx.lineTo(cx + width, y);
        ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 + t * 0.25})`;
        ctx.stroke();
    }
    ctx.restore();

    // Stars
    State.stars.forEach(s => s.draw(ctx, cx, cy));

    // Objects
    const renderList = [...State.objects].sort((a,b) => b.z - a.z);
    renderList.forEach(o => o.draw(ctx, cx, cy));

    // Player
    const px = cx + State.playerX * canvas.width * 0.4;
    const py = cy + 200;
    const size = 30;

    // Character aura
    const aura = ctx.createRadialGradient(px, py, 8, px, py, 70 + speedRatio * 30);
    aura.addColorStop(0, 'rgba(255,255,255,0.14)');
    aura.addColorStop(0.35, 'rgba(34, 211, 238, 0.22)');
    aura.addColorStop(1, 'rgba(34, 211, 238, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(px, py, 70 + speedRatio * 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(px, py);
    const bank = (State.inputX - State.playerX) * -0.5;
    ctx.rotate(bank);

    ctx.shadowColor = window.gameConfig.heroColor;
    ctx.shadowBlur = 20 + (State.speed/50);

    // Ship wings
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.moveTo(-size * 0.9, size * 0.45);
    ctx.lineTo(-size * 0.2, -size * 0.15);
    ctx.lineTo(-size * 0.15, size * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(size * 0.9, size * 0.45);
    ctx.lineTo(size * 0.2, -size * 0.15);
    ctx.lineTo(size * 0.15, size * 0.35);
    ctx.closePath();
    ctx.fill();

    // Ship body
    const bodyGrad = ctx.createLinearGradient(0, -size, 0, size);
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(0.35, window.gameConfig.heroColor);
    bodyGrad.addColorStop(1, '#0ea5e9');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(0, -size * 1.15);
    ctx.lineTo(-size * 0.18, -size * 0.15);
    ctx.lineTo(-size * 0.52, size * 0.45);
    ctx.lineTo(0, size * 0.25);
    ctx.lineTo(size * 0.52, size * 0.45);
    ctx.lineTo(size * 0.18, -size * 0.15);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.ellipse(0, -size * 0.35, size * 0.16, size * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();

    // Engine core
    ctx.fillStyle = State.overheated ? '#ff7a7a' : '#fef08a';
    ctx.beginPath();
    ctx.arc(0, size * 0.1, size * 0.11, 0, Math.PI * 2);
    ctx.fill();

    // Engine flame
    if(State.holding && !State.overheated) {
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-size/4, size/2);
        ctx.lineTo(0, size + 18 + Math.random()*20);
        ctx.lineTo(size/4, size/2);
        ctx.fill();

        ctx.fillStyle = '#67e8f9';
        ctx.beginPath();
        ctx.moveTo(-size/8, size/2);
        ctx.lineTo(0, size + 6 + Math.random()*10);
        ctx.lineTo(size/8, size/2);
        ctx.fill();
    }

    ctx.restore();
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    animationId = requestAnimationFrame(loop);
}

// --- INPUT ---
function handleInput(x, isDown) {
    if(State.over) return;
    State.holding = isDown;
    
    // Normalize x to -1...1
    const normX = (x / canvas.width) * 2 - 1;
    // Apply sensitivity
    State.inputX = normX * window.gameConfig.sensitivity;
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    AudioSys.init();
    handleInput(e.clientX, true);
});
canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    handleInput(e.clientX, State.holding);
});
canvas.addEventListener('pointerup', e => {
    e.preventDefault();
    State.holding = false;
});
canvas.addEventListener('pointercancel', e => {
    State.holding = false;
});

// --- LIFECYCLE ---
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();
    document.getElementById('ui-title').innerText = window.gameConfig.gameTitle;
    
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('game-container').classList.remove('blur-sm');
        AudioSys.init();
        AudioSys.playSfx('ui', 0.42, 100);
        AudioSys.playBgm();
        initGame();
        State.active = true;
        lastTime = performance.now();
        loop(lastTime);
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('game-container').classList.remove('blur-sm');
        AudioSys.init();
        AudioSys.playSfx('ui', 0.42, 100);
        AudioSys.playBgm();
        initGame();
        State.active = true;
        State.over = false;
    });
});

</script>
