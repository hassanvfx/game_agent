<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Rueglass: Glitter Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fd8;--cyan:#62e8ff;--violet:#8f5bff;--gold:#ffd36b;--ink:#07020f;--panel:rgba(16,5,31,.72);--line:rgba(255,255,255,.16);--text:#fff3fb;--muted:#d8a8d8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05010b;color:var(--text);font-family:Rajdhani,system-ui,sans-serif}button,input{font:inherit}#stage{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 4%,rgba(255,79,216,.25),transparent 27%),linear-gradient(180deg,#15041f,#08010e 62%,#020006)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}.set-dressing{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.9}.mirror{position:absolute;left:50%;top:7.2rem;width:min(76vw,22rem);height:58vh;transform:translateX(-50%);border:1px solid rgba(255,255,255,.14);border-radius:34% 34% 24px 24px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(98,232,255,.04));box-shadow:0 0 80px rgba(255,79,216,.18),inset 0 0 45px rgba(98,232,255,.08)}.mirror:before{content:"";position:absolute;inset:-1.2rem;border-radius:inherit;background:repeating-radial-gradient(circle at 50% 0,rgba(255,211,107,.65)0 5px,transparent 6px 42px);filter:blur(.2px);opacity:.38}.lockers{position:absolute;left:-10%;right:-10%;bottom:5.8rem;height:34vh;background:repeating-linear-gradient(90deg,rgba(255,79,216,.08)0 2px,transparent 2px 38px),linear-gradient(180deg,transparent,rgba(98,232,255,.07));transform:skewY(-4deg)}.ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}.top{min-height:4.55rem;padding:.72rem .9rem;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(19,3,35,.86),rgba(14,3,28,.56));border-bottom:1px solid rgba(255,79,216,.28);backdrop-filter:blur(16px);pointer-events:auto}.brand{display:flex;gap:.75rem;align-items:center;min-width:0}.avatar{width:3rem;height:3rem;border-radius:1.05rem;position:relative;flex:0 0 auto;background:radial-gradient(circle at 35% 24%,#fff 0 8%,var(--gold) 9% 14%,transparent 15%),linear-gradient(145deg,var(--pink),var(--violet) 54%,var(--cyan));box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 28px rgba(255,79,216,.7);overflow:hidden}.avatar:before{content:"";position:absolute;left:25%;top:22%;width:50%;height:57%;border:2px solid rgba(255,255,255,.85);border-radius:45% 45% 30% 30%;box-shadow:0 0 18px rgba(98,232,255,.85),inset 0 -12px 0 rgba(5,1,11,.42)}.avatar:after{content:"♥";position:absolute;right:.18rem;bottom:-.22rem;color:#fff;font-size:1.15rem;text-shadow:0 0 12px var(--pink)}h1{margin:0;font-family:Audiowide,sans-serif;font-size:1rem;line-height:1.1;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 18px rgba(255,79,216,.75)}.sub{display:flex;gap:.38rem;align-items:center;margin-top:.22rem;color:var(--muted);font-size:.73rem;letter-spacing:.12em;text-transform:uppercase}.dot{width:.52rem;height:.52rem;border-radius:50%;background:#74ffbe;box-shadow:0 0 14px #74ffbe;animation:pulse 1.6s infinite}.stats{font-size:.78rem;color:var(--gold);text-align:right;letter-spacing:.09em}.music{width:2.55rem;height:2.55rem;border:1px solid rgba(98,232,255,.28);border-radius:999px;background:rgba(6,2,16,.66);color:var(--cyan);box-shadow:0 0 18px rgba(98,232,255,.22);margin-left:.5rem}.feed{flex:1;overflow-y:auto;padding:1rem .9rem 1.1rem;display:flex;flex-direction:column;gap:.72rem;pointer-events:auto;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.stamp{align-self:center;padding:.28rem .72rem;border:1px solid rgba(255,211,107,.23);border-radius:999px;background:rgba(255,211,107,.08);font-family:Audiowide,sans-serif;font-size:.64rem;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}.bubble{max-width:86%;padding:.78rem .92rem;border:1px solid var(--line);font-size:.94rem;line-height:1.42;box-shadow:0 14px 30px rgba(0,0,0,.28);animation:rise .28s ease both;word-break:break-word;position:relative;overflow:hidden}.bubble:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),transparent 48%);pointer-events:none}.me{align-self:flex-end;border-radius:22px 22px 5px 22px;background:linear-gradient(135deg,#ff8ee9,var(--pink) 45%,#7b4dff);color:#170018;font-weight:700}.rue{align-self:flex-start;border-radius:22px 22px 22px 5px;background:linear-gradient(160deg,rgba(20,4,36,.9),rgba(9,2,21,.78));border-color:rgba(98,232,255,.2)}.typing{width:4.1rem;display:flex;gap:.25rem;justify-content:center}.typing i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:bounce 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}.composer{padding:.78rem .86rem calc(.78rem + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,3,35,.45),rgba(13,1,24,.92));border-top:1px solid rgba(255,79,216,.22);backdrop-filter:blur(18px);pointer-events:auto}.hint{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0 0 .35rem .35rem}.form{display:flex;gap:.55rem}#msg{flex:1;min-width:0;border:1px solid rgba(255,79,216,.25);border-radius:999px;background:rgba(5,1,12,.78);color:var(--text);padding:.92rem 1rem;outline:0;box-shadow:inset 0 0 20px rgba(0,0,0,.28)}#msg:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(98,232,255,.24),inset 0 0 20px rgba(0,0,0,.28)}#send{width:3.15rem;height:3.15rem;border:0;border-radius:50%;background:conic-gradient(from 210deg,var(--cyan),var(--pink),var(--gold),var(--cyan));color:#120017;font-size:1.35rem;font-weight:800;box-shadow:0 0 28px rgba(255,79,216,.55)}#send:active,.music:active{transform:scale(.94)}.burst{position:absolute;z-index:4;right:1.1rem;top:5.4rem;width:6.2rem;height:6.2rem;border-radius:50%;pointer-events:none;opacity:0;transform:scale(.7) rotate(-10deg);background:radial-gradient(circle,#fff 0 4%,var(--gold) 5% 12%,transparent 13%),conic-gradient(from 0deg,transparent,var(--pink),transparent,var(--cyan),transparent);filter:drop-shadow(0 0 20px var(--pink));transition:.3s}.burst.show{opacity:.78;transform:scale(1) rotate(18deg)}.mood{position:absolute;left:.9rem;bottom:6.35rem;z-index:4;max-width:7.2rem;padding:.5rem .62rem;border:1px solid rgba(98,232,255,.25);border-radius:1rem;background:rgba(8,1,18,.78);color:var(--cyan);font-size:.74rem;line-height:1.15;box-shadow:0 0 24px rgba(98,232,255,.2);opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}.mood.show{opacity:1;transform:none}@media(max-width:380px){h1{font-size:.88rem}.bubble{font-size:.88rem;max-width:88%}.stats{font-size:.7rem}.avatar{width:2.75rem;height:2.75rem}.top{padding-left:.68rem;padding-right:.68rem}}@keyframes pulse{50%{transform:scale(1.18);opacity:.72}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes bounce{50%{transform:translateY(-5px) scale(1.15)}}
</style></head><body><div id="stage"><canvas id="fx"></canvas><div class="set-dressing"><div class="mirror"></div><div class="lockers"></div></div><div id="burst" class="burst"></div><div id="mood" class="mood">read receipt shimmering</div><main class="ui"><header class="top"><div class="brand"><div class="avatar" aria-hidden="true"></div><div><h1>Rueglass</h1><div class="sub"><span class="dot"></span><span>mood online</span></div></div></div><div style="display:flex;align-items:center"><div class="stats"><span id="count">0</span> confessions<br><span id="phase">afterparty quiet</span></div><button id="music" class="music" type="button" aria-label="Toggle soundtrack">♪</button></div></header><section id="feed" class="feed" aria-live="polite"><div class="stamp">glitter feed · 1:17 am</div></section><footer class="composer"><p class="hint">text the mirror; it texts back</p><form id="form" class="form"><label style="position:absolute;width:1px;height:1px;overflow:hidden" for="msg">Confession</label><input id="msg" autocomplete="off" placeholder="type the thing you almost posted…"><button id="send" type="submit" aria-label="Send confession">➤</button></form></footer></main></div>
<script>
const feed=document.getElementById('feed'),form=document.getElementById('form'),msg=document.getElementById('msg'),countEl=document.getElementById('count'),phaseEl=document.getElementById('phase'),burst=document.getElementById('burst'),mood=document.getElementById('mood'),music=document.getElementById('music');let confessions=0,typing=false,ctxUnlocked=false,audioCtx=null,bgmOn=false,drone=null,droneGain=null;const delay=1450;
const pats=[[/hello|hi|hey/i,["hey. the mirror is awake. no screenshots, just truth.","hi beautiful disaster. what's glowing too loud tonight?"]],[/love|crush|kiss|boyfriend|girlfriend|ex/i,["wanting them is not the same as being safe with them.","romance can feel like neon: gorgeous, hot, and impossible to stare at forever.","if their attention is the drug, your boundary is the antidote."]],[/sad|cry|bad|alone|empty/i,["stay with me. one breath, then one sentence. you are not the rumor about you.","glitter can sit on grief. both can be real.","your softness survived the hallway. that's not nothing."]],[/who|identity|me|name/i,["you are not the version they keep forwarding.","identity crisis logged: temporary static, permanent soul."]],[/party|night|dance|high/i,["the bathroom light tells the truth the dance floor edits out.","nightlife is loud because everyone is hiding a quiet ache."]],[/\?/,["ask it again, but this time ask like you deserve an answer.","the question is glowing. what would future-you text back?"]]];const defs=["read receipt: i hear the subtext.","say the messy part. the mirror can hold it.","that sentence has mascara under it.","soft boundary suggested. neon heart still intact.","your vulnerability just changed the lighting."];
function unlock(){if(ctxUnlocked)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();ctxUnlocked=true;audioCtx.resume().catch(()=>{})}function play(id,fallback='sine'){if(!ctxUnlocked)return;tone(fallback)}function tone(type){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type;o.frequency.value=type==='triangle'?220:760;g.gain.setValueAtTime(.09,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.2)}function startDrone(){if(!audioCtx||drone)return;drone=audioCtx.createOscillator();droneGain=audioCtx.createGain();drone.type='sine';drone.frequency.value=92;droneGain.gain.value=.025;drone.connect(droneGain);droneGain.connect(audioCtx.destination);drone.start();bgmOn=true;music.style.color='#62e8ff'}function stopDrone(){if(drone){drone.stop();drone.disconnect();drone=null}bgmOn=false;music.style.color='#d8a8d8'}
music.addEventListener('click',()=>{unlock();if(bgmOn){stopDrone();tone('triangle')}else{startDrone();tone('sine')}});
function response(t){for(const [re,arr] of pats)if(re.test(t))return arr[Math.floor(Math.random()*arr.length)];return defs[Math.floor(Math.random()*defs.length)]}function scroll(){feed.scrollTop=feed.scrollHeight}function bubble(text,me){let d=document.createElement('div');d.className='bubble '+(me?'me':'rue');d.textContent=text;feed.appendChild(d);scroll();if(me){confessions++;countEl.textContent=confessions;phaseEl.textContent=confessions<2?'afterparty quiet':confessions<4?'read receipts burning':'identity weather';flash('sent in glitter');spark(innerWidth-58,innerHeight-92,'#ff4fd8')}else{play('sfxReply','sine');flash('rueglass replied');spark(62,116,'#62e8ff')}}function showTyping(){if(typing)return;typing=true;let d=document.createElement('div');d.id='typing';d.className='bubble rue typing';d.innerHTML='<i></i><i></i><i></i>';feed.appendChild(d);scroll()}function hideTyping(){let t=document.getElementById('typing');if(t)t.remove();typing=false}function flash(txt){mood.textContent=txt;burst.classList.add('show');mood.classList.add('show');setTimeout(()=>burst.classList.remove('show'),850);setTimeout(()=>mood.classList.remove('show'),1300)}form.addEventListener('submit',e=>{e.preventDefault();let t=msg.value.trim();if(!t){play('sfxErr','triangle');flash('empty text, loud feeling');return}play('sfxSend','sine');msg.value='';bubble(t,true);setTimeout(()=>{showTyping();setTimeout(()=>{hideTyping();bubble(response(t),false)},delay)},520)});
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,dpr,parts=[],rain=[];function size(){W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);rain=Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H,l:20+Math.random()*60,s:.6+Math.random()*1.8,h:Math.random()<.5?'#ff4fd8':'#62e8ff'}))}function spark(px,py,col){for(let i=0;i<16;i++){let a=Math.random()*Math.PI*2,v=1.4+Math.random()*4;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col,s:2+Math.random()*5})}}c.addEventListener('pointerdown',e=>{unlock();spark(e.clientX,e.clientY,'#ffd36b')});function draw(){requestAnimationFrame(draw);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160421');g.addColorStop(.58,'#080111');g.addColorStop(1,'#030006');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.7;rain.forEach(r=>{x.strokeStyle=r.h;x.lineWidth=1;x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x+8,r.y+r.l);x.stroke();r.y+=r.s;if(r.y>H+70){r.y=-70;r.x=Math.random()*W}});x.globalAlpha=1;x.strokeStyle='rgba(255,255,255,.08)';for(let i=0;i<6;i++){x.beginPath();x.arc(W*.5,H*.18,60+i*34,0,Math.PI*2);x.stroke()}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=.026;p.s*=.965;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fill();if(p.life<=0)parts.splice(i,1)}x.globalAlpha=1}addEventListener('resize',size);size();draw();setTimeout(()=>bubble("Rueglass is live. Send one honest line; I'll answer from the neon between vulnerability and bad decisions.",false),650);
</script></body></html>
