<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Grove</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap');

        :root {
            --bg-deep: #090412;
            --bg-mid: #160822;
            --bg-glow: #261347;
            --panel-fill: rgba(18, 10, 34, 0.76);
            --panel-stroke: rgba(144, 224, 255, 0.42);
            --title-pink: #ff71d1;
            --title-cyan: #7df9ff;
            --coin-gold: #ffd76c;
            --ui-text: #f5ecff;
            --ui-soft: #d8c8ff;
            --mint: #87ffd2;
            --button-a: #fe4ccf;
            --button-b: #6b34ff;
            --shadow-deep: rgba(7, 3, 20, 0.58);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(125, 249, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 42%, #11061f 100%);
            font-family: 'Exo 2', Arial, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 50% 10%, rgba(255, 113, 209, 0.16), transparent 22%),
                radial-gradient(circle at 50% 100%, rgba(125, 249, 255, 0.14), transparent 30%),
                linear-gradient(to bottom, #090412 0%, #180928 55%, #22113a 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(125, 249, 255, 0.13) 0 2px, transparent 3px),
                radial-gradient(circle at 78% 22%, rgba(255, 113, 209, 0.15) 0 2px, transparent 3px),
                radial-gradient(circle at 32% 34%, rgba(135, 255, 210, 0.14) 0 3px, transparent 4px),
                radial-gradient(circle at 68% 58%, rgba(125, 249, 255, 0.12) 0 2px, transparent 3px),
                radial-gradient(circle at 24% 72%, rgba(255, 215, 108, 0.12) 0 2px, transparent 3px),
                radial-gradient(circle at 84% 78%, rgba(255, 113, 209, 0.1) 0 2px, transparent 3px);
            opacity: 0.9;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent 0%, rgba(7, 3, 20, 0.08) 55%, rgba(7, 3, 20, 0.28) 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        .hud-top {
            padding: 16px 18px 8px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.22);
        }

        .money-display,
        .stats-display {
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(8px);
            background: var(--panel-fill);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 10px 28px var(--shadow-deep),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .money-display {
            position: relative;
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            color: var(--coin-gold);
            font-weight: 600;
            margin-bottom: 8px;
            padding: 12px 16px 10px;
            border-radius: 22px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .money-display::before {
            content: "Glowbank";
            display: block;
            margin-bottom: 4px;
            color: var(--title-cyan);
            font-size: 0.5em;
            letter-spacing: 0.18em;
        }

        .stats-display {
            font-size: clamp(0.94rem, 3vw, 1.08rem);
            color: var(--ui-soft);
            opacity: 0.96;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.45;
            font-family: 'Exo 2', Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .hud-bottom {
            padding: 16px 18px 34px;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--button-a), var(--button-b));
            border: 2px solid rgba(255, 255, 255, 0.28);
            color: white;
            padding: 14px 24px;
            border-radius: 999px;
            font-size: clamp(1rem, 4vw, 1.15rem);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            box-shadow:
                0 10px 24px rgba(107, 52, 255, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.12);
            transition: transform 0.1s, filter 0.1s, box-shadow 0.1s;
            width: min(82%, 320px);
            text-align: center;
            text-transform: uppercase;
        }

        .btn-main:active {
            transform: scale(0.95);
            filter: brightness(1.08);
        }

        .btn-main.disabled {
            background: linear-gradient(135deg, rgba(68, 52, 95, 0.92), rgba(34, 27, 50, 0.98));
            border-color: rgba(202, 186, 255, 0.22);
            color: rgba(236, 228, 255, 0.52);
            box-shadow: none;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 18%, rgba(125, 249, 255, 0.16), transparent 22%),
                rgba(9, 4, 18, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.3s;
            padding: 24px;
            box-sizing: border-box;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2.5rem, 11vw, 4.25rem);
            color: var(--title-pink);
            margin-bottom: 12px;
            text-shadow:
                0 0 20px rgba(255, 113, 209, 0.65),
                0 0 34px rgba(125, 249, 255, 0.28);
            text-align: center;
            line-height: 0.95;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        p {
            color: var(--ui-text);
            font-size: clamp(1rem, 3.8vw, 1.1rem);
            max-width: min(80%, 420px);
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.55;
            padding: 14px 16px;
            border-radius: 20px;
            background: rgba(18, 10, 34, 0.72);
            border: 1px solid rgba(125, 249, 255, 0.18);
            box-shadow: 0 10px 30px var(--shadow-deep);
            font-family: 'Exo 2', Arial, sans-serif;
            font-weight: 600;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--button-a), var(--button-b));
            color: white;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: clamp(1.1rem, 5vw, 1.35rem);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            border: 2px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 20px rgba(255, 113, 209, 0.35);
            cursor: pointer;
            text-transform: uppercase;
        }

        .floater {
            position: absolute;
            color: var(--mint);
            font-weight: 700;
            font-size: 1rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 12px rgba(125, 249, 255, 0.75);
            letter-spacing: 0.06em;
            font-family: 'Exo 2', Arial, sans-serif;
        }

        .mood-reel {
            position: absolute;
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom) + 96px);
            width: min(28vw, 108px);
            min-width: 72px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(125, 249, 255, 0.32);
            box-shadow: 0 12px 28px rgba(7, 3, 20, 0.42);
            background: rgba(18, 10, 34, 0.55);
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 40;
        }

        .mood-reel.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .mood-reel img {
            width: 100%;
            display: block;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .mood-reel--success {
            left: 14px;
            right: auto;
            bottom: calc(env(safe-area-inset-bottom) + 116px);
        }

        .mood-reel__label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 4px 6px;
            text-align: center;
            color: white;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, transparent, rgba(9, 4, 18, 0.85));
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.95); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.14); opacity: 0; }
        }

        @media (max-width: 480px) {
            .hud-top {
                padding: 14px 12px 8px;
            }

            .money-display {
                border-radius: 18px;
                padding: 10px 14px 9px;
            }

            .stats-display {
                padding: 9px 12px;
            }

            .hud-bottom {
                padding: 12px 14px 26px;
            }

            .btn-main,
            .btn-start {
                width: min(100%, 320px);
            }

            .mood-reel {
                width: 76px;
                bottom: calc(env(safe-area-inset-bottom) + 88px);
            }

            .mood-reel--success {
                bottom: calc(env(safe-area-inset-bottom) + 106px);
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: fail-feedback -> catalogs/gifs.json | success-feedback -> catalogs/gifs.json -->
    <div id="failReel" class="mood-reel" aria-hidden="true">
        <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Funny fail reaction">
        <span class="mood-reel__label">Need spores</span>
    </div>
    <div id="successReel" class="mood-reel mood-reel--success" aria-hidden="true">
        <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Reward unlocked reaction">
        <span class="mood-reel__label">Glow up</span>
    </div>

    <div class="ui-layer" id="gameUI">
        <div class="hud-top">
            <div class="money-display">$<span id="scoreVal">0</span></div>
            <div class="stats-display">Caps online: <span id="shroomVal">1</span> | Glowflow: $<span id="rateVal">0</span>/s</div>
        </div>

        <div class="hud-bottom">
            <button id="btnBuy" class="btn-main disabled" onclick="game.buySpore()">
                Clone Cap ($100)
            </button>
        </div>
    </div>

    <div id="startScreen" class="screen">
        <h1>Neon<br>Grove</h1>
        <p>Build a glowing mushroom grove.<br>Each cap earns cash over time.<br>Tap anywhere to harvest extra glow.</p>
        <button class="btn-start" onclick="game.start()">Enter the Grove</button>
    </div>
</div>

<script>
const CONFIG = {
    initialMoney: 0,
    initialMushrooms: 1,
    sporeCost: 100,
    incomePerMushroom: 2,
    tapIncome: 1,
    colors: [
        '#d946ef',
        '#8b5cf6',
        '#06b6d4',
        '#10b981',
        '#f43f5e'
    ]
};

const MEDIA = {
    audio: {
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        tap: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        buy: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        ambience: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
    },
    gifs: {
        fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
        success: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
    }
};

function randomRange(min, max) { return Math.random() * (max - min) + min; }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

class AudioManager {
    constructor() {
        this.enabled = false;
        this.started = false;
        this.sounds = new Map();
        this.loop = null;
        this.loopKey = 'ambience';
        this.cooldowns = new Map();

        this.registerOneShot('start', MEDIA.audio.start, 0.4);
        this.registerOneShot('tap', MEDIA.audio.tap, 0.18);
        this.registerOneShot('buy', MEDIA.audio.buy, 0.3);
        this.registerOneShot('blocked', MEDIA.audio.blocked, 0.26);
        this.registerLoop(this.loopKey, MEDIA.audio.ambience, 0.18);
    }

    registerOneShot(key, url, volume) {
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.volume = volume;
        this.sounds.set(key, audio);
    }

    registerLoop(key, url, volume) {
        const audio = new Audio(url);
        audio.preload = 'auto';
        audio.loop = true;
        audio.volume = volume;
        this.sounds.set(key, audio);
        if (key === this.loopKey) {
            this.loop = audio;
        }
    }

    async unlock() {
        if (this.started) return;
        this.started = true;
        this.enabled = true;
        if (this.loop) {
            this.loop.currentTime = 0;
            try {
                await this.loop.play();
            } catch (err) {
                this.enabled = false;
            }
        }
    }

    play(key, cooldownMs = 0) {
        if (!this.enabled) return;
        const now = performance.now();
        const nextAllowed = this.cooldowns.get(key) || 0;
        if (now < nextAllowed) return;
        if (cooldownMs > 0) {
            this.cooldowns.set(key, now + cooldownMs);
        }

        const source = this.sounds.get(key);
        if (!source) return;

        try {
            if (source.loop) {
                if (source.paused) {
                    source.play().catch(() => {
                        this.enabled = false;
                    });
                }
                return;
            }

            const clone = source.cloneNode();
            clone.volume = source.volume;
            clone.play().catch(() => {});
        } catch (err) {
            this.enabled = false;
        }
    }

    pauseLoop() {
        if (this.loop && !this.loop.paused) {
            this.loop.pause();
        }
    }

    resumeLoop() {
        if (this.enabled && this.loop && this.loop.paused) {
            this.loop.play().catch(() => {});
        }
    }
}

class Mushroom {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.age = 0;
        this.maxAge = 1;
        this.scale = 0;
        this.type = randomInt(0, 2);
        this.color = pickRandom(CONFIG.colors);
        this.height = randomRange(40, 80);
        this.capWidth = randomRange(30, 50);
        this.swayOffset = randomRange(0, 100);
        this.glowPhase = randomRange(0, Math.PI * 2);
        this.sparkleOffset = randomRange(0, Math.PI * 2);
    }

    update(dt, time) {
        if (this.age < this.maxAge) {
            this.age += dt;
            const p = Math.min(this.age / this.maxAge, 1);
            this.scale = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
        }

        this.currentSway = Math.sin(time * 2 + this.swayOffset) * 2;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        const pulse = Math.sin(Date.now() / 500 + this.glowPhase);
        ctx.shadowBlur = 18 + pulse * 6;
        ctx.shadowColor = this.color;

        const stemGradient = ctx.createLinearGradient(0, 0, 0, -this.height);
        stemGradient.addColorStop(0, '#fff7ed');
        stemGradient.addColorStop(0.45, '#f8fafc');
        stemGradient.addColorStop(1, '#d8b4fe');
        ctx.fillStyle = stemGradient;
        ctx.beginPath();
        ctx.moveTo(-3, 0);
        ctx.quadraticCurveTo(this.currentSway, -this.height / 2, -2 + this.currentSway * 0.5, -this.height);
        ctx.lineTo(2 + this.currentSway * 0.5, -this.height);
        ctx.quadraticCurveTo(this.currentSway, -this.height / 2, 3, 0);
        ctx.fill();

        ctx.translate(this.currentSway * 0.5, -this.height);

        ctx.beginPath();
        if (this.type === 0) {
            ctx.ellipse(0, 0, this.capWidth / 2, this.capWidth * 0.8, 0, Math.PI, 0);
        } else if (this.type === 1) {
            ctx.arc(0, 0, this.capWidth / 2, Math.PI, 0);
        } else {
            ctx.ellipse(0, 0, this.capWidth / 2, this.capWidth * 0.3, 0, Math.PI, 0);
        }
        const capGradient = ctx.createRadialGradient(
            -this.capWidth * 0.12,
            -this.capWidth * 0.18,
            this.capWidth * 0.12,
            0,
            0,
            this.capWidth * 0.72
        );
        capGradient.addColorStop(0, '#ffffff');
        capGradient.addColorStop(0.18, this.color);
        capGradient.addColorStop(1, 'rgba(12, 6, 24, 0.95)');
        ctx.fillStyle = capGradient;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(-this.capWidth / 4, -this.capWidth / 4, 2, 0, Math.PI * 2);
        ctx.arc(this.capWidth / 5, -this.capWidth / 3, 3, 0, Math.PI * 2);
        ctx.arc(0, -this.capWidth / 5, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(23, 14, 38, 0.78)';
        ctx.beginPath();
        ctx.arc(-this.capWidth * 0.1, this.capWidth * 0.08, 1.2, 0, Math.PI * 2);
        ctx.arc(this.capWidth * 0.1, this.capWidth * 0.08, 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(23, 14, 38, 0.72)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, this.capWidth * 0.16, this.capWidth * 0.09, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        const sparkleY = -this.capWidth * 0.18 + Math.sin(Date.now() / 260 + this.sparkleOffset) * 1.5;
        ctx.fillStyle = 'rgba(125, 249, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(this.capWidth * 0.22, sparkleY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = randomRange(-0.5, 0.5);
        this.vy = randomRange(-0.5, -2);
        this.life = 1.0;
        this.size = randomRange(1, 3);
        this.color = 'rgba(255, 255, 255, 0.5)';
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt * 0.5;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.money = CONFIG.initialMoney;
        this.mushrooms = [];
        this.particles = [];

        this.lastTime = 0;
        this.isRunning = false;
        this.audio = new AudioManager();
        this.gifTimers = {};
        this.lastBlockedAt = 0;

        this.scoreEl = document.getElementById('scoreVal');
        this.shroomEl = document.getElementById('shroomVal');
        this.rateEl = document.getElementById('rateVal');
        this.btnBuy = document.getElementById('btnBuy');
        this.startScreen = document.getElementById('startScreen');
        this.failReel = document.getElementById('failReel');
        this.successReel = document.getElementById('successReel');

        this.resize();
        window.addEventListener('resize', () => this.resize());
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.audio.pauseLoop();
            } else if (this.isRunning) {
                this.audio.resumeLoop();
            }
        });

        // [agent-note][stage4] repaired: mobile-tap-safety | element: body/canvas | action: keep native button taps, scope gesture suppression to gameplay surface
        this.canvas.style.touchAction = 'none';
        this.canvas.addEventListener('pointerdown', (e) => this.handleTap(e));
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    }

    start() {
        this.startScreen.classList.add('hidden');
        this.isRunning = true;
        this.lastTime = performance.now();
        this.money = CONFIG.initialMoney;
        this.mushrooms = [];
        this.particles = [];
        this.updateUI();

        this.audio.unlock().finally(() => {
            this.audio.play('start', 250);
            this.audio.resumeLoop();
        });

        this.spawnMushroom();
        this.loop(this.lastTime);
    }

    spawnMushroom() {
        const margin = 50;
        const x = randomRange(margin, this.width - margin);
        const y = randomRange(this.height * 0.7, this.height - 50);

        this.mushrooms.push(new Mushroom(x, y));
        this.mushrooms.sort((a, b) => a.y - b.y);

        for (let i = 0; i < 10; i++) {
            this.particles.push(new Particle(x, y));
        }
    }

    buySpore() {
        if (!this.isRunning) return;

        if (this.money >= CONFIG.sporeCost) {
            this.money -= CONFIG.sporeCost;
            this.spawnMushroom();
            this.updateUI();
            this.audio.play('buy', 200);
            this.showReaction('success', 1400);
        } else {
            const now = performance.now();
            if (now - this.lastBlockedAt > 500) {
                this.lastBlockedAt = now;
                this.audio.play('blocked', 350);
                this.showReaction('fail', 1200);
            }
        }
    }

    handleTap(e) {
        if (!this.isRunning) return;

        this.money += CONFIG.tapIncome;

        const x = e.clientX;
        const y = e.clientY;
        this.spawnFloater(x, y, `+$${CONFIG.tapIncome}`);

        for (let i = 0; i < 3; i++) {
            this.particles.push(new Particle(x, y));
        }

        this.audio.play('tap', 90);
        this.updateUI();
    }

    showReaction(type, duration) {
        const el = type === 'success' ? this.successReel : this.failReel;
        if (!el) return;

        el.classList.add('is-visible');
        clearTimeout(this.gifTimers[type]);
        this.gifTimers[type] = setTimeout(() => {
            el.classList.remove('is-visible');
        }, duration);
    }

    spawnFloater(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floater';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    update(dt) {
        const time = Date.now() / 1000;

        const income = this.mushrooms.length * CONFIG.incomePerMushroom * dt;
        this.money += income;

        this.mushrooms.forEach((m) => m.update(dt, time));

        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) {
                this.particles.splice(i, 1);
            }
        }

        if (Math.random() < 0.05) {
            this.particles.push(new Particle(randomRange(0, this.width), this.height + 10));
        }

        this.updateUI();
    }

    draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        this.mushrooms.forEach((m) => m.draw(this.ctx));
        this.particles.forEach((p) => p.draw(this.ctx));
    }

    updateUI() {
        this.scoreEl.textContent = Math.floor(this.money).toLocaleString();
        this.shroomEl.textContent = this.mushrooms.length;
        this.rateEl.textContent = (this.mushrooms.length * CONFIG.incomePerMushroom).toFixed(1);

        if (this.money >= CONFIG.sporeCost) {
            this.btnBuy.classList.remove('disabled');
            this.btnBuy.textContent = `Clone Cap ($${CONFIG.sporeCost})`;
        } else {
            this.btnBuy.classList.add('disabled');
            this.btnBuy.textContent = `Need $${CONFIG.sporeCost}`;
        }
    }

    loop(timestamp) {
        if (!this.isRunning) return;

        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
    }
}
