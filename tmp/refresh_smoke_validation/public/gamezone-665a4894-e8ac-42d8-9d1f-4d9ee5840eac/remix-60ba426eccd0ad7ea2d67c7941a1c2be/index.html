<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bestie Pop-Up Tycoon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&family=VT323&display=swap');
:root{
  --ink:#2d174d;--cream:#fff8ff;--bubble:#ff8bdf;--aqua:#7df9ff;--lime:#b8ff6d;--sun:#ffe56b;--grape:#7b4dff;--hot:#ff4db8;--panel:rgba(255,248,255,.82);--line:rgba(45,23,77,.22);--shadow:rgba(65,20,98,.24)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffd6f5;color:var(--ink);font-family:'Exo 2',Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game-container{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(180deg,#fff0fd 0%,#ffd5f7 34%,#c8f6ff 68%,#fff3b0 100%)}
.bg-grid,.bg-stickers,.bg-window{position:absolute;inset:0;pointer-events:none}.bg-grid{background-image:linear-gradient(rgba(123,77,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(123,77,255,.16) 1px,transparent 1px);background-size:34px 34px;transform:perspective(280px) rotateX(58deg) translateY(20%);transform-origin:50% 100%;animation:gridDrift 7s linear infinite;opacity:.65}.bg-window{inset:7% 5% 18%;border:3px solid rgba(255,255,255,.86);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));box-shadow:0 26px 60px rgba(123,77,255,.18),inset 0 0 0 2px rgba(255,139,223,.18)}.bg-window:before{content:'BESTIE_BROWSER.EXE  tycoon // idle // real';position:absolute;left:16px;right:16px;top:12px;height:28px;border-radius:16px;background:linear-gradient(90deg,var(--hot),var(--aqua));color:white;text-shadow:0 1px 0 rgba(0,0,0,.15);font-family:'VT323',monospace;font-size:20px;line-height:28px;padding-left:14px;letter-spacing:.04em}.bg-stickers:before,.bg-stickers:after{content:'✿ ★ ♡ ☺ ☆';position:absolute;font-family:'VT323',monospace;font-size:clamp(40px,12vw,76px);color:rgba(255,77,184,.22);animation:floaty 6s ease-in-out infinite}.bg-stickers:before{left:5%;top:16%}.bg-stickers:after{right:5%;bottom:23%;color:rgba(123,77,255,.22);animation-delay:-2s}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui-layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hud-top{padding:14px 14px 8px;text-align:center}.money-display,.stats-display,.tip-chip{max-width:350px;margin-left:auto;margin-right:auto;background:var(--panel);border:2px solid rgba(255,255,255,.8);box-shadow:0 12px 30px var(--shadow),inset 0 0 0 2px rgba(255,139,223,.2);backdrop-filter:blur(9px)}.money-display{position:relative;border-radius:24px;padding:10px 14px 8px;color:#7430d8;font-family:'Orbitron','Exo 2',sans-serif;font-size:clamp(1.75rem,7vw,2.65rem);font-weight:700;letter-spacing:.04em}.money-display:before{content:'clout wallet';display:block;font-family:'VT323',monospace;text-transform:uppercase;color:#ff3faf;font-size:.58em;letter-spacing:.12em}.stats-display{margin-top:7px;border-radius:18px;padding:8px 12px;color:#3f226c;font-weight:700;font-size:clamp(.9rem,3.4vw,1.06rem);line-height:1.35}.tip-chip{margin-top:7px;width:max-content;max-width:min(86vw,350px);border-radius:999px;padding:6px 12px;color:#6a2fb1;font-family:'VT323',monospace;font-size:clamp(1rem,4vw,1.25rem);letter-spacing:.02em}.hud-bottom{padding:10px 16px 28px;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}.btn-main,.btn-start{border:0;border-radius:999px;background:linear-gradient(135deg,#ff4db8,#7b4dff 56%,#41e9ff);color:white;font-family:'Orbitron','Exo 2',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 28px rgba(123,77,255,.32),inset 0 0 0 2px rgba(255,255,255,.42);cursor:pointer}.btn-main{width:min(88vw,340px);min-height:56px;padding:14px 20px;font-size:clamp(.98rem,3.9vw,1.12rem)}.btn-main:active,.btn-start:active{transform:scale(.96)}.btn-main.disabled{background:linear-gradient(135deg,#c9b8d8,#a79ab6);color:rgba(255,255,255,.74);box-shadow:0 8px 20px rgba(45,23,77,.14);pointer-events:none}.screen{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.92),rgba(255,214,245,.92) 45%,rgba(198,246,255,.94));pointer-events:auto;transition:opacity .28s}.screen.hidden{opacity:0;pointer-events:none}.logo-pet{width:min(48vw,176px);aspect-ratio:1;margin-bottom:10px;filter:drop-shadow(0 18px 18px rgba(123,77,255,.22))}.screen h1{margin:0 0 10px;text-align:center;font-family:'Orbitron','Exo 2',sans-serif;font-size:clamp(2.2rem,10.5vw,4rem);line-height:.96;letter-spacing:.04em;text-transform:uppercase;color:#ff36ad;text-shadow:3px 3px 0 #7df9ff,0 10px 28px rgba(123,77,255,.2)}.screen p{max-width:min(88vw,440px);margin:0 0 22px;padding:14px 16px;border-radius:24px;background:rgba(255,255,255,.74);border:2px solid rgba(255,255,255,.88);box-shadow:0 14px 32px rgba(123,77,255,.16);font-weight:700;line-height:1.45;text-align:center;color:#432267}.btn-start{min-height:58px;padding:15px 28px;font-size:clamp(1.04rem,4.5vw,1.28rem)}.floater{position:absolute;z-index:45;pointer-events:none;color:#ff2ea6;font-family:'Orbitron','Exo 2',sans-serif;font-weight:700;text-shadow:2px 2px 0 white,0 0 12px rgba(125,249,255,.75);animation:floatUp 1s ease-out forwards}.mood-reel{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:min(26vw,96px);min-width:72px;border-radius:22px;overflow:hidden;border:2px solid rgba(255,255,255,.9);box-shadow:0 12px 28px rgba(123,77,255,.26);background:white;opacity:0;transform:translateY(12px) rotate(3deg) scale(.94);transition:opacity .22s,transform .22s;pointer-events:none;z-index:40}.mood-reel.is-visible{opacity:.94;transform:translateY(0) rotate(0) scale(1)}.mood-reel img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}.mood-reel--success{left:14px;right:auto;bottom:calc(env(safe-area-inset-bottom) + 112px);transform:translateY(12px) rotate(-3deg) scale(.94)}.mood-reel__label{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;text-align:center;color:white;background:linear-gradient(180deg,transparent,rgba(45,23,77,.82));font-family:'VT323',monospace;font-size:1rem;text-transform:uppercase}.badge-row{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;pointer-events:none}.badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:white;border:2px solid rgba(255,139,223,.8);box-shadow:0 7px 18px rgba(123,77,255,.18);font-size:18px;animation:floaty 3.5s ease-in-out infinite}.badge:nth-child(2){animation-delay:-1.1s}.badge:nth-child(3){animation-delay:-2.2s}
@keyframes gridDrift{to{background-position:0 34px,34px 0}}@keyframes floaty{50%{transform:translateY(-10px) rotate(3deg)}}@keyframes floatUp{0%{transform:translateY(0) scale(.94);opacity:1}100%{transform:translateY(-54px) scale(1.16);opacity:0}}
@media(max-width:480px){.hud-top{padding:12px 10px 6px}.hud-bottom{padding:10px 14px 24px}.bg-window{inset:9% 4% 18%;border-radius:24px}.bg-window:before{font-size:17px;left:12px;right:12px}.tip-chip{display:none}.mood-reel{width:74px}.screen p{font-size:.98rem}}
</style>
</head>
<body>
<div id="game-container">
  <div class="bg-window"></div><div class="bg-grid"></div><div class="bg-stickers"></div>
  <canvas id="gameCanvas" aria-label="Tap the playfield to farm clout coins"></canvas>
  <div class="badge-row" aria-hidden="true"><span class="badge">♡</span><span class="badge">★</span><span class="badge">✿</span></div>
  <div id="failReel" class="mood-reel" aria-hidden="true"><img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Not enough coins reaction"><span class="mood-reel__label">not real yet</span></div>
  <div id="successReel" class="mood-reel mood-reel--success" aria-hidden="true"><img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Upgrade reaction"><span class="mood-reel__label">slay ROI</span></div>
  <div class="ui-layer" id="gameUI">
    <div class="hud-top">
      <div class="money-display">$<span id="scoreVal">0</span></div>
      <div class="stats-display">Pets online: <span id="shroomVal">1</span> | Passive drip: $<span id="rateVal">0</span>/s</div>
      <div class="tip-chip">tap the browser to farm +$1, bestie</div>
    </div>
    <div class="hud-bottom"><button id="btnBuy" class="btn-main disabled" onclick="game.buySpore()">Need $100</button></div>
  </div>
  <div id="startScreen" class="screen">
    <svg class="logo-pet" viewBox="0 0 140 140" role="img" aria-label="smiling Y2K desktop pet kiosk"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff4db8"/><stop offset=".52" stop-color="#7b4dff"/><stop offset="1" stop-color="#7df9ff"/></linearGradient></defs><rect x="18" y="25" width="104" height="82" rx="26" fill="url(#g)" stroke="white" stroke-width="6"/><circle cx="52" cy="66" r="8" fill="#2d174d"/><circle cx="88" cy="66" r="8" fill="#2d174d"/><path d="M52 86 Q70 100 88 86" fill="none" stroke="#2d174d" stroke-width="6" stroke-linecap="round"/><path d="M34 38 h72" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".55"/><rect x="52" y="107" width="36" height="11" rx="5" fill="#2d174d"/><path d="M30 18 l10 14 M110 18 l-10 14" stroke="#ffe56b" stroke-width="7" stroke-linecap="round"/></svg>
    <h1>Bestie<br>Pop-Up Tycoon</h1>
    <p>Run a cozy Y2K desktop-pet empire. Each pet earns idle cash. Tap anywhere for tiny clout. Buy another pop-up when the wallet hits $100. Real.</p>
    <button class="btn-start" onclick="game.start()">Start Tycoon</button>
  </div>
</div>
<script>
const CONFIG={initialMoney:0,initialMushrooms:1,sporeCost:100,incomePerMushroom:2,tapIncome:1,colors:['#ff4db8','#7b4dff','#7df9ff','#b8ff6d','#ffe56b']};
const MEDIA={audio:{start:'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',tap:'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',buy:'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',blocked:'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',ambience:'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'},gifs:{fail:'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',success:'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'}};
const randomRange=(min,max)=>Math.random()*(max-min)+min;const randomInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;const pickRandom=arr=>arr[Math.floor(Math.random()*arr.length)];
class AudioManager{constructor(){this.enabled=false;this.started=false;this.sounds=new Map();this.loop=null;this.loopKey='ambience';this.cooldowns=new Map();this.registerOneShot('start',MEDIA.audio.start,.38);this.registerOneShot('tap',MEDIA.audio.tap,.16);this.registerOneShot('buy',MEDIA.audio.buy,.3);this.registerOneShot('blocked',MEDIA.audio.blocked,.25);this.registerLoop(this.loopKey,MEDIA.audio.ambience,.16)}registerOneShot(k,u,v){const a=new Audio(u);a.preload='auto';a.volume=v;this.sounds.set(k,a)}registerLoop(k,u,v){const a=new Audio(u);a.preload='auto';a.loop=true;a.volume=v;this.sounds.set(k,a);if(k===this.loopKey)this.loop=a}async unlock(){if(this.started)return;this.started=true;this.enabled=true;if(this.loop){this.loop.currentTime=0;try{await this.loop.play()}catch(e){this.enabled=false}}}play(k,cooldownMs=0){if(!this.enabled)return;const now=performance.now();const next=this.cooldowns.get(k)||0;if(now<next)return;if(cooldownMs>0)this.cooldowns.set(k,now+cooldownMs);const src=this.sounds.get(k);if(!src)return;try{if(src.loop){if(src.paused)src.play().catch(()=>{this.enabled=false});return}const clone=src.cloneNode();clone.volume=src.volume;clone.play().catch(()=>{})}catch(e){this.enabled=false}}pauseLoop(){if(this.loop&&!this.loop.paused)this.loop.pause()}resumeLoop(){if(this.enabled&&this.loop&&this.loop.paused)this.loop.play().catch(()=>{})}}
class Mushroom{constructor(x,y){this.x=x;this.y=y;this.age=0;this.maxAge=1;this.scale=0;this.type=randomInt(0,2);this.color=pickRandom(CONFIG.colors);this.height=randomRange(48,84);this.capWidth=randomRange(38,58);this.swayOffset=randomRange(0,100);this.glowPhase=randomRange(0,Math.PI*2);this.sparkleOffset=randomRange(0,Math.PI*2)}update(dt,time){if(this.age<this.maxAge){this.age+=dt;const p=Math.min(this.age/this.maxAge,1);this.scale=p===1?1:1-Math.pow(2,-10*p)}this.currentSway=Math.sin(time*2+this.swayOffset)*2}draw(ctx){ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.scale,this.scale);const pulse=Math.sin(Date.now()/500+this.glowPhase);ctx.shadowBlur=18+pulse*6;ctx.shadowColor=this.color;ctx.fillStyle='rgba(255,255,255,.78)';roundRect(ctx,-this.capWidth*.45,-this.height,this.capWidth*.9,this.height*.92,16);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(45,23,77,.2)';ctx.lineWidth=2;ctx.stroke();ctx.translate(this.currentSway*.5,-this.height*.82);const grad=ctx.createLinearGradient(-this.capWidth/2,-this.capWidth/2,this.capWidth/2,this.capWidth/2);grad.addColorStop(0,'#fff');grad.addColorStop(.22,this.color);grad.addColorStop(1,'#7b4dff');ctx.fillStyle=grad;ctx.beginPath();if(this.type===0){ctx.roundRect(-this.capWidth/2,-this.capWidth/2,this.capWidth,this.capWidth*.82,14)}else if(this.type===1){ctx.ellipse(0,-this.capWidth*.1,this.capWidth*.55,this.capWidth*.42,0,0,Math.PI*2)}else{ctx.moveTo(0,-this.capWidth*.58);ctx.lineTo(this.capWidth*.55,0);ctx.lineTo(0,this.capWidth*.38);ctx.lineTo(-this.capWidth*.55,0);ctx.closePath()}ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.stroke();ctx.fillStyle='#2d174d';ctx.beginPath();ctx.arc(-this.capWidth*.18,-this.capWidth*.08,2.4,0,Math.PI*2);ctx.arc(this.capWidth*.18,-this.capWidth*.08,2.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2d174d';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,this.capWidth*.05,this.capWidth*.13,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.fillStyle='rgba(255,229,107,.95)';ctx.font=`${Math.max(12,this.capWidth*.3)}px serif`;ctx.textAlign='center';ctx.fillText(['♡','★','✿'][this.type],0,-this.capWidth*.24+Math.sin(Date.now()/260+this.sparkleOffset)*1.5);ctx.restore()}}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
class Particle{constructor(x,y){this.x=x;this.y=y;this.vx=randomRange(-.7,.7);this.vy=randomRange(-.6,-2.2);this.life=1;this.size=randomRange(2,5);this.color=pickRandom(['#ff4db8','#7df9ff','#ffe56b','#b8ff6d','#ffffff'])}update(dt){this.x+=this.vx;this.y+=this.vy;this.life-=dt*.5}draw(ctx){ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;ctx.translate(this.x,this.y);ctx.rotate(this.life*Math.PI);ctx.beginPath();for(let i=0;i<5;i++){ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*this.size,Math.sin((18+i*72)/180*Math.PI)*this.size);ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*this.size*.45,Math.sin((54+i*72)/180*Math.PI)*this.size*.45)}ctx.closePath();ctx.fill();ctx.restore()}}
class Game{constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.width=innerWidth;this.height=innerHeight;this.money=CONFIG.initialMoney;this.mushrooms=[];this.particles=[];this.lastTime=0;this.isRunning=false;this.audio=new AudioManager();this.gifTimers={};this.lastBlockedAt=0;this.scoreEl=document.getElementById('scoreVal');this.shroomEl=document.getElementById('shroomVal');this.rateEl=document.getElementById('rateVal');this.btnBuy=document.getElementById('btnBuy');this.startScreen=document.getElementById('startScreen');this.failReel=document.getElementById('failReel');this.successReel=document.getElementById('successReel');this.resize();addEventListener('resize',()=>this.resize());document.addEventListener('visibilitychange',()=>{if(document.hidden)this.audio.pauseLoop();else if(this.isRunning)this.audio.resumeLoop()});this.canvas.addEventListener('pointerdown',e=>this.handleTap(e))}resize(){this.width=innerWidth;this.height=innerHeight;this.canvas.width=this.width;this.canvas.height=this.height}start(){this.startScreen.classList.add('hidden');this.isRunning=true;this.lastTime=performance.now();this.money=CONFIG.initialMoney;this.mushrooms=[];this.particles=[];this.updateUI();this.audio.unlock().finally(()=>{this.audio.play('start',250);this.audio.resumeLoop()});this.spawnMushroom();this.loop(this.lastTime)}spawnMushroom(){const margin=50;const x=randomRange(margin,this.width-margin);const y=randomRange(this.height*.7,this.height-50);this.mushrooms.push(new Mushroom(x,y));this.mushrooms.sort((a,b)=>a.y-b.y);for(let i=0;i<10;i++)this.particles.push(new Particle(x,y))}buySpore(){if(!this.isRunning)return;if(this.money>=CONFIG.sporeCost){this.money-=CONFIG.sporeCost;this.spawnMushroom();this.updateUI();this.audio.play('buy',200);this.showReaction('success',1400)}else{const now=performance.now();if(now-this.lastBlockedAt>500){this.lastBlockedAt=now;this.audio.play('blocked',350);this.showReaction('fail',1200)}}}handleTap(e){if(!this.isRunning)return;this.money+=CONFIG.tapIncome;const x=e.clientX,y=e.clientY;this.spawnFloater(x,y,`+$${CONFIG.tapIncome}`);for(let i=0;i<3;i++)this.particles.push(new Particle(x,y));this.audio.play('tap',90);this.updateUI()}showReaction(type,duration){const el=type==='success'?this.successReel:this.failReel;if(!el)return;el.classList.add('is-visible');clearTimeout(this.gifTimers[type]);this.gifTimers[type]=setTimeout(()=>el.classList.remove('is-visible'),duration)}spawnFloater(x,y,text){const el=document.createElement('div');el.className='floater';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}update(dt){const time=Date.now()/1000;const income=this.mushrooms.length*CONFIG.incomePerMushroom*dt;this.money+=income;this.mushrooms.forEach(m=>m.update(dt,time));for(let i=this.particles.length-1;i>=0;i--){this.particles[i].update(dt);if(this.particles[i].life<=0)this.particles.splice(i,1)}if(Math.random()<.05)this.particles.push(new Particle(randomRange(0,this.width),this.height+10));this.updateUI()}drawScene(){const ctx=this.ctx;ctx.save();ctx.globalAlpha=.24;ctx.font='22px VT323, monospace';ctx.fillStyle='#7b4dff';for(let y=this.height*.22;y<this.height*.68;y+=38){for(let x=18;x<this.width;x+=96){ctx.fillText(['real','bestie','idle','tycoon','Y2K'][Math.floor((x+y+Date.now()/800)%5)],x,y)}}ctx.restore()}draw(){this.ctx.clearRect(0,0,this.width,this.height);this.drawScene();this.mushrooms.forEach(m=>m.draw(this.ctx));this.particles.forEach(p=>p.draw(this.ctx))}updateUI(){this.scoreEl.textContent=Math.floor(this.money).toLocaleString();this.shroomEl.textContent=this.mushrooms.length;this.rateEl.textContent=(this.mushrooms.length*CONFIG.incomePerMushroom).toFixed(1);if(this.money>=CONFIG.sporeCost){this.btnBuy.classList.remove('disabled');this.btnBuy.textContent=`Open Pop-Up ($${CONFIG.sporeCost})`}else{this.btnBuy.classList.add('disabled');this.btnBuy.textContent=`Need $${CONFIG.sporeCost}`}}loop(timestamp){if(!this.isRunning)return;const dt=Math.min((timestamp-this.lastTime)/1000,.05);this.lastTime=timestamp;this.update(dt);this.draw();requestAnimationFrame(t=>this.loop(t))}}
const game=new Game();window.game=game;
</script>
</body>
</html>
