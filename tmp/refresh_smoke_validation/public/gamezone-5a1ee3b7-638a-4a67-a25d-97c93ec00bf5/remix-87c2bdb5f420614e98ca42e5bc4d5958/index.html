<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Chroma Core</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-deep: #04050d;
            --bg-mid: #0a1230;
            --panel-bg: rgba(9, 17, 42, 0.7);
            --panel-border: rgba(110, 217, 255, 0.28);
            --panel-shadow: rgba(0, 0, 0, 0.5);
            --text-main: #f5fbff;
            --text-soft: #b8cfe7;
            --cyan: #67e8f9;
            --blue: #60a5fa;
            --magenta: #ff4fd8;
            --gold: #ffd66b;
            --danger: #ff5f7d;
            --success: #6df6b3;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(77, 155, 255, 0.18), transparent 30%),
                radial-gradient(circle at bottom, rgba(255, 79, 216, 0.14), transparent 36%),
                linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 60%, #020307 100%);
        }

        body {
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #game-container,
        #gameCanvas {
            touch-action: none;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none; }
        .z-10 { z-index: 10; }
        .p-10 { padding: 2.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .font-bold { font-weight: 700; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .tracking-wider { letter-spacing: 0.05em; }
        .text-white { color: #fff; }
        .text-gray-300 { color: var(--text-soft); }
        .text-gray-900 { color: #111827; }
        .text-indigo-900 { color: #172554; }
        .text-yellow-400 { color: var(--gold); }
        .text-cyan-400 { color: var(--cyan); }
        .text-red-500 { color: var(--danger); }
        .bg-white { background: #fff; }
        .text-transparent { color: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .bg-gradient-to-r { background-image: linear-gradient(to right, #67e8f9, #60a5fa, #ff4fd8); }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0, 0, 0, 0.25); }
        .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.35)); }
        .transition { transition: all 0.2s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .transform { transform: translateZ(0); }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(15, 26, 62, 0.92), rgba(7, 12, 30, 0.84)),
                var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 48px var(--panel-shadow),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255,255,255,0.16), transparent 28%, transparent 72%, rgba(103,232,249,0.08)),
                radial-gradient(circle at 15% 20%, rgba(103, 232, 249, 0.18), transparent 24%);
            pointer-events: none;
        }

        .title-text {
            font-family: 'Audiowide', system-ui, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .action-text, #hud, .feedback-caption {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .cta-button,
        .secondary-button {
            min-height: 3.25rem;
            padding: 0.95rem 2.2rem;
            border-radius: 999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease, background 160ms ease;
        }

        .cta-button {
            background: linear-gradient(135deg, #d9fbff, #67e8f9 48%, #60a5fa);
            box-shadow: 0 0 18px rgba(103, 232, 249, 0.35);
        }

        .cta-button:hover,
        .cta-button:active {
            box-shadow: 0 0 26px rgba(103, 232, 249, 0.52);
            transform: translateY(-0.2rem) scale(1.02);
            filter: brightness(1.03);
        }

        .secondary-button {
            background: linear-gradient(135deg, #f5fbff, #dbeafe);
        }

        .secondary-button:hover,
        .secondary-button:active {
            background: linear-gradient(135deg, #ffffff, #bfdbfe);
            transform: translateY(-0.15rem);
        }

        .glass-panel:hover {
            transform: scale(1.03);
        }

        .neon-text {
            text-shadow:
                0 0 12px rgba(103, 232, 249, 0.24),
                0 0 26px rgba(96, 165, 250, 0.14);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 50% 50%, rgba(103, 232, 249, 0.08), transparent 24%),
                radial-gradient(circle at 50% 50%, rgba(255, 79, 216, 0.06), transparent 44%);
            z-index: 0;
        }

        #game-container::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.24;
            mix-blend-mode: screen;
            z-index: 0;
        }

        .screen-copy {
            position: relative;
            z-index: 1;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            font-size: clamp(0.95rem, 2.8vw, 1.45rem);
            line-height: 1;
            letter-spacing: 0.12em;
            padding: 0.7rem 0.95rem;
            border-radius: 999px;
            border: 1px solid rgba(103, 232, 249, 0.22);
            background: rgba(6, 14, 36, 0.62);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-label {
            color: #d7efff;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 0.9rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .status-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--cyan), var(--blue));
            box-shadow: 0 0 12px rgba(103, 232, 249, 0.5);
            animation: pulseDot 1.8s ease-in-out infinite;
        }

        .feedback-stack {
            position: absolute;
            inset: auto 1rem max(1rem, env(safe-area-inset-bottom)) 1rem;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 9;
        }

        .feedback-card {
            width: min(18rem, calc(100vw - 2rem));
            padding: 0.75rem;
            border-radius: 1.2rem;
            background: rgba(8, 14, 36, 0.72);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(1rem) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease, border-color 180ms ease;
        }

        .feedback-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card.success {
            border-color: rgba(109, 246, 179, 0.4);
        }

        .feedback-card.fail {
            border-color: rgba(255, 95, 125, 0.38);
        }

        .feedback-gif {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 0.9rem;
            background: rgba(255,255,255,0.05);
        }

        .feedback-caption {
            margin-top: 0.55rem;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .text-6xl { font-size: 2.5rem; }
            .text-5xl { font-size: 2.25rem; }
            .text-3xl { font-size: 1.4rem; }
            .text-lg { font-size: 1rem; line-height: 1.5rem; }
            .top-6, .left-6 { top: 1rem; left: 1rem; }

            .cta-button,
            .secondary-button {
                width: 100%;
                max-width: 18rem;
                padding-inline: 1.2rem;
            }

            #start-screen,
            #game-over-screen {
                width: min(92vw, 26rem);
            }

            .feedback-stack {
                inset: auto 0.75rem max(0.75rem, env(safe-area-inset-bottom)) 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">

            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto hover:scale-105 transition duration-300 z-10">
                <div class="screen-copy">
                    <h1 class="title-text text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r mb-4 neon-text">CHROMA CORE</h1>
                    <p class="text-gray-300 text-lg mb-8">Tap to cycle the core signal.<br>Absorb matching incoming orbs.</p>
                    <button id="start-btn" class="action-text cta-button bg-white text-indigo-900 font-bold rounded-full transition transform">Engage Core</button>
                    <div class="status-chip" aria-hidden="true"><span class="status-dot"></span> Prism defense online</div>
                </div>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto z-10">
                <div class="screen-copy">
                    <h2 class="title-text text-5xl font-bold text-red-500 mb-2 neon-text">System Failure</h2>
                    <div class="text-2xl text-white mb-8">Signals Stabilized: <span id="finalScore" class="text-yellow-400">0</span></div>
                    <button id="restart-btn" class="action-text secondary-button bg-white text-gray-900 font-bold rounded-full shadow-lg transition">Reboot System</button>
                </div>
            </div>

            <div id="hud" class="absolute top-6 left-6 font-bold hidden tracking-wider">
                <span class="hud-label">Signals:</span> <span id="score" class="text-cyan-400">0</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: success/fail-feedback -> catalogs/gifs.json -->
            <div class="feedback-stack">
                <div id="feedback-card" class="feedback-card hidden">
                    <img id="feedback-gif" class="feedback-gif" alt="Gameplay feedback animation">
                    <div id="feedback-caption" class="feedback-caption"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                cycle: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                impact: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = this.createAudio(ASSETS.bgm, 0.22, true);
                this.sfx = {
                    start: this.createAudio(ASSETS.sfx.start, 0.62),
                    cycle: this.createAudio(ASSETS.sfx.cycle, 0.28),
                    score: this.createAudio(ASSETS.sfx.score, 0.62),
                    impact: this.createAudio(ASSETS.sfx.impact, 0.38),
                    fail: this.createAudio(ASSETS.sfx.fail, 0.75)
                };
                this.lastPlayed = new Map();
            }

            createAudio(src, volume, loop = false) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = loop;
                audio.volume = volume;
                return audio;
            }

            async unlock() {
                if (this.ready) return;
                this.ready = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach(audio => audio.load());
                } catch (_) {}
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 0) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (now - last < minGap) return;
                this.lastPlayed.set(key, now);

                try {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = this.sfx[key].volume;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();

        /** 3. FEEDBACK MEDIA */
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackCaption = document.getElementById('feedback-caption');
        let feedbackTimer = null;

        function showFeedback(type, caption) {
            feedbackGif.src = type === 'success' ? ASSETS.gifs.success : ASSETS.gifs.fail;
            feedbackCaption.textContent = caption;
            feedbackCard.classList.remove('hidden', 'visible', 'success', 'fail');
            feedbackCard.classList.add(type);

            requestAnimationFrame(() => {
                feedbackCard.classList.add('visible');
            });

            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackCard.classList.remove('visible');
                setTimeout(() => feedbackCard.classList.add('hidden'), 180);
            }, type === 'success' ? 900 : 1600);
        }

        /** 4. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;

        const COLORS = [
            { name: 'RED', hex: '#FF3366' },
            { name: 'GREEN', hex: '#33FF66' },
            { name: 'BLUE', hex: '#3366FF' }
        ];

        let core = {
            colorIndex: 0,
            radius: 40,
            pulse: 0
        };

        let enemies = [];
        let particles = [];
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }
        window.addEventListener('resize', resize);

        /** 5. PARALLAX & VISUALS */
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1,
                    alpha: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                const cx = width / 2;
                const cy = height / 2;
                const dx = star.x - cx;
                const dy = star.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) + 0.0005 * star.speed;

                star.x = cx + Math.cos(angle) * dist;
                star.y = cy + Math.sin(angle) * dist;
            });
            ctx.globalAlpha = 1.0;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        /** 6. GAME LOGIC */
        function initGame() {
            score = 0;
            enemies = [];
            particles = [];
            core.colorIndex = 0;
            frameCount = 0;
            document.getElementById('score').innerText = score;
            resize();
        }

        function spawnEnemy() {
            const spawnRate = Math.max(30, 100 - score * 2);

            if (frameCount % Math.floor(spawnRate) === 0) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.max(width, height) / 1.5;
                const colorIdx = Math.floor(Math.random() * 3);

                enemies.push({
                    x: width / 2 + Math.cos(angle) * radius,
                    y: height / 2 + Math.sin(angle) * radius,
                    colorIndex: colorIdx,
                    speed: 2 + (score * 0.1),
                    radius: 15
                });
            }
        }

        function update() {
            frameCount++;
            const cx = width / 2;
            const cy = height / 2;

            core.pulse = Math.sin(frameCount * 0.1) * 5;
            spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dx = cx - e.x;
                const dy = cy - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const angle = Math.atan2(dy, dx);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (dist < core.radius + e.radius) {
                    if (e.colorIndex === core.colorIndex) {
                        score++;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('impact', 45);
                        audio.playSFX('score', 70);
                        if (score <= 2 || score % 4 === 0) {
                            showFeedback('success', 'Signal Matched');
                        }
                        createExplosion(e.x, e.y, COLORS[e.colorIndex].hex);
                        enemies.splice(i, 1);
                    } else {
                        createExplosion(cx, cy, '#FFFFFF');
                        gameOver();
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawCoreShell(cx, cy, colorHex) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.shadowBlur = 36;
            ctx.shadowColor = colorHex;

            const outerRadius = core.radius + core.pulse;
            const ringRadius = core.radius + 12 + core.pulse * 0.15;

            const gradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, outerRadius + 18);
            gradient.addColorStop(0, 'rgba(255,255,255,0.95)');
            gradient.addColorStop(0.2, colorHex);
            gradient.addColorStop(0.72, 'rgba(14,22,52,0.82)');
            gradient.addColorStop(1, 'rgba(14,22,52,0)');

            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.rotate(frameCount * 0.003);
            for (let i = 0; i < 3; i++) {
                const angle = (Math.PI * 2 / 3) * i;
                const px = cx + Math.cos(angle) * 24;
                const py = cy + Math.sin(angle) * 24;
                ctx.beginPath();
                ctx.arc(px, py, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fill();
            }

            ctx.restore();

            ctx.beginPath();
            ctx.arc(cx, cy, core.radius - 12, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 8 + Math.max(0, core.pulse * 0.3), 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        function drawEnemyOrb(e) {
            const enemyColor = COLORS[e.colorIndex].hex;
            const glow = ctx.createRadialGradient(e.x, e.y, 1, e.x, e.y, e.radius + 12);
            glow.addColorStop(0, 'rgba(255,255,255,0.92)');
            glow.addColorStop(0.3, enemyColor);
            glow.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.save();
            ctx.shadowColor = enemyColor;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius + 2, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius - 2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(e.x - e.radius * 0.24, e.y - e.radius * 0.24, Math.max(2, e.radius * 0.18), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 6, 18, 0.28)';
            ctx.fillRect(0, 0, width, height);

            drawStars();

            const cx = width / 2;
            const cy = height / 2;
            const colorHex = COLORS[core.colorIndex].hex;

            drawCoreShell(cx, cy, colorHex);
            enemies.forEach(drawEnemyOrb);

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedback('fail', 'Core Destabilized');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. CONTROLS */
        function switchColor() {
            if (!gameActive) return;
            core.colorIndex = (core.colorIndex + 1) % 3;
            audio.playSFX('cycle', 45);
        }

        // [agent-note][stage4] repaired: mobile-action-risk | element: gameplay input | action: scoped pointer handlers to canvas so menu buttons keep native tap/click behavior
        canvas.addEventListener('mousedown', switchColor);
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            switchColor();
        }, { passive: false });

        async function startRound() {
            await audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        document.getElementById('start-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            await startRound();
        });

        document.getElementById('restart-btn').addEventListener('click', async (e) => {
            e.stopPropagation();
            await startRound();
        });

        resize();
    });
    </script>
</body>
</html>
