:root{--pink:#ff2fd6;--blue:#31e8ff;--violet:#7b3cff;--ink:#080612;--panel:rgba(15,9,32,.78);--line:rgba(255,255,255,.22);--text:#fff7ff;--soft:#d8c8ff;--danger:#ff4d7d;--truth:#65ffe1;--display:Orbitron,system-ui,sans-serif;--ui:Rajdhani,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020d;color:var(--text);font-family:var(--ui)}button{font-family:var(--ui)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.shell{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;touch-action:none;background:radial-gradient(circle at 50% 8%,rgba(255,47,214,.25),transparent 32%),linear-gradient(180deg,#070311,#130725 55%,#030208)}.shell:before{content:"";position:absolute;inset:-20%;pointer-events:none;z-index:1;background:repeating-linear-gradient(100deg,transparent 0 28px,rgba(49,232,255,.05) 29px 31px),radial-gradient(circle at 12% 18%,rgba(255,47,214,.20),transparent 18%),radial-gradient(circle at 82% 28%,rgba(49,232,255,.16),transparent 20%);animation:drift 14s linear infinite}.shell:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.54)),repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px)}@keyframes drift{to{transform:translate3d(-4%,3%,0)}}.glitter{position:absolute;inset:0;z-index:3;pointer-events:none}.g{position:absolute;width:.42rem;height:.42rem;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--pink),0 0 28px var(--blue);opacity:.25;animation:float 4.5s ease-in-out infinite}.g:nth-child(1){left:9%;top:14%}.g:nth-child(2){left:28%;top:31%;animation-delay:.8s}.g:nth-child(3){left:76%;top:18%;animation-delay:1.4s}.g:nth-child(4){left:88%;top:45%;animation-delay:2.2s}.g:nth-child(5){left:47%;top:10%;animation-delay:3s}.g:nth-child(6){left:18%;top:67%;animation-delay:1.9s}@keyframes float{50%{transform:translateY(-18px) scale(1.35);opacity:.78}}.ui{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;pointer-events:auto;background:radial-gradient(circle at 50% 18%,rgba(255,47,214,.23),transparent 34%),rgba(4,2,12,.56);backdrop-filter:blur(8px)}.hidden{display:none}.card{width:min(100%,29rem);padding:1.35rem;border-radius:1.6rem;text-align:center;background:linear-gradient(180deg,rgba(27,12,53,.92),rgba(8,5,18,.88));border:1px solid rgba(255,255,255,.22);box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 34px rgba(255,47,214,.22),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.16),transparent 35%),radial-gradient(circle at 82% 18%,rgba(49,232,255,.22),transparent 21%);pointer-events:none}.badge,.chip{position:relative;display:inline-flex;gap:.5rem;align-items:center;border-radius:999px;border:1px solid rgba(255,255,255,.19);background:rgba(255,255,255,.09);color:var(--soft);text-transform:uppercase;letter-spacing:.1em}.badge{padding:.42rem .9rem;margin-bottom:.9rem;font-size:.74rem}.title{position:relative;margin:.15rem 0 .6rem;font-family:var(--display);font-size:clamp(2.15rem,10vw,4.2rem);line-height:.92;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 12px var(--pink),0 0 34px rgba(49,232,255,.45)}.title span{display:block;background:linear-gradient(180deg,#fff 0%,#ff83e8 45%,#61f3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.copy{position:relative;margin:.8rem auto 1.2rem;max-width:23rem;font-size:clamp(1rem,4vw,1.18rem);line-height:1.45;color:rgba(255,247,255,.88)}.avatar-pill{position:relative;display:inline-flex;align-items:center;gap:.65rem;margin:.2rem 0 1rem;padding:.65rem .9rem;border-radius:1rem;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.16)}.emoji{font-size:1.65rem;filter:drop-shadow(0 0 12px var(--pink))}.label{display:block;text-align:left;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:#bfaaff}.name{display:block;text-align:left;font-family:var(--display);font-size:.92rem;color:#fff}.btn{position:relative;min-height:3.25rem;padding:.9rem 1.35rem;border:0;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--violet) 55%,var(--blue));color:#fff;font-family:var(--display);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 14px 34px rgba(255,47,214,.28),inset 0 1px 0 rgba(255,255,255,.3);cursor:pointer}.btn:active,.choice:active{transform:scale(.97)}.vn{height:100%;width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 .85rem max(.85rem,env(safe-area-inset-bottom));pointer-events:auto}.choices{display:flex;flex-direction:column;align-items:center;gap:.65rem;margin-bottom:.8rem}.choice{width:min(100%,36rem);min-height:3.15rem;padding:.85rem 1rem;border-radius:1.1rem;border:1px solid rgba(255,255,255,.28);font-weight:600;font-size:clamp(1rem,4vw,1.08rem);color:#12051f;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,214,249,.94));box-shadow:0 12px 32px rgba(0,0,0,.26),0 0 22px rgba(255,47,214,.16);cursor:pointer}.dialogue{width:100%;min-height:10rem;padding:1.15rem 1rem 2.75rem;border-radius:1.45rem;position:relative;cursor:pointer;background:linear-gradient(180deg,rgba(18,8,38,.78),rgba(7,4,16,.92));border:1px solid rgba(255,255,255,.24);box-shadow:0 18px 52px rgba(0,0,0,.45),0 0 26px rgba(49,232,255,.18);backdrop-filter:blur(12px)}.speaker{position:absolute;top:-1rem;left:1rem;max-width:calc(100% - 2rem);padding:.45rem .9rem;border-radius:999px;background:linear-gradient(135deg,var(--danger),var(--violet));font-family:var(--display);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.text{margin:.85rem 0 0;font-size:clamp(1.04rem,4.45vw,1.32rem);line-height:1.55;color:#fff}.prompt{position:absolute;right:1rem;bottom:.85rem;display:flex;gap:.35rem;align-items:center;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:rgba(229,219,255,.78)}.dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--blue);box-shadow:0 0 9px var(--blue);animation:blink 1s infinite}.chip{position:absolute;top:.8rem;right:.85rem;padding:.42rem .65rem;font-size:.66rem}.cursor:after{content:"▼";margin-left:.35rem;color:#ff9df0;animation:blink 1s infinite}.feedback{position:absolute;right:.7rem;bottom:calc(12rem + env(safe-area-inset-bottom));width:min(29vw,7.6rem);aspect-ratio:1;object-fit:cover;border-radius:1rem;border:1px solid rgba(255,255,255,.3);opacity:0;transform:translateY(10px) scale(.9);transition:.18s;z-index:8;pointer-events:none;box-shadow:0 16px 34px rgba(0,0,0,.38),0 0 24px rgba(255,47,214,.24)}.feedback.visible{opacity:.9;transform:none}@keyframes blink{50%{opacity:.25}}@media(min-width:760px){.vn{padding-left:clamp(1rem,6vw,5rem);padding-right:clamp(1rem,6vw,5rem)}}@media(max-width:430px){.card{padding:1.15rem;border-radius:1.35rem}.dialogue{min-height:9.7rem}.speaker{left:.75rem;right:.75rem;max-width:none}.feedback{width:4.7rem;bottom:calc(12.2rem + env(safe-area-inset-bottom))}}
</style></head><body><div id="game-container" class="shell"><canvas id="gameCanvas"></canvas><div class="glitter" aria-hidden="true"><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i></div><img id="feedback-gif" class="feedback" alt="" aria-hidden="true"><div class="ui"><div id="start-screen" class="overlay"><section class="card"><div class="badge"><span>Episode 01</span><span>💔</span></div><div class="avatar-pill"><span class="emoji">📱</span><span><b class="label">phone-lit lead</b><b class="name">Nova in Afterglow</b></span></div><h1 class="title"><span>Afterglow</span><span>Static</span></h1><p class="copy">A neon teen-drama visual novel about one afterparty, one unread message, and two ways to survive being seen.</p><button id="start-btn" class="btn">Enter the night</button></section></div><div id="game-over-screen" class="overlay hidden"><section class="card"><div class="badge"><span>Memory archived</span><span>✨</span></div><h2 id="end-title" class="title" style="font-size:clamp(1.65rem,7vw,2.8rem)">The End</h2><p id="end-desc" class="copy">Replay the same night and choose the other confession.</p><button id="restart-btn" class="btn">Restart the night</button></section></div><div id="vn-interface" class="vn hidden"><div id="choices-container" class="choices"></div><div id="dialogue-panel" class="dialogue"><div id="speaker-name" class="speaker">???</div><div class="chip" id="scene-chip"><span>Neon hallway</span><span>🪩</span></div><p id="dialogue-text" class="text"></p><div class="prompt"><span class="dot"></span><span>Tap to continue</span></div></div></div></div></div><script>
document.addEventListener('DOMContentLoaded',()=>{const ASSETS={gifs:{romance:'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp',celebration:'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp',mystery:'https://i.giphy.com/JIX9t2j0ZTN9S.webp'}};class AudioController{constructor(){this.ctx=null;this.last={}}unlock(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}playBGM(){this.unlock()}stopBGM(){}playSFX(k,vol=.18,cool=90){this.unlock();if(!this.ctx)return;const now=performance.now();if(this.last[k]&&now-this.last[k]<cool)return;this.last[k]=now;const map={start:392,next:520,choice:660,reveal:300,end_good:740,end_bad:180,restart:430};try{const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=k==='end_bad'?'sawtooth':'sine';osc.frequency.value=map[k]||480;gain.gain.setValueAtTime(0.0001,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(vol,this.ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+.18);osc.connect(gain).connect(this.ctx.destination);osc.start();osc.stop(this.ctx.currentTime+.2)}catch(e){}}}const audio=new AudioController(),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),dialoguePanel=document.getElementById('dialogue-panel'),speakerName=document.getElementById('speaker-name'),dialogueText=document.getElementById('dialogue-text'),choicesContainer=document.getElementById('choices-container'),startScreen=document.getElementById('start-screen'),gameOverScreen=document.getElementById('game-over-screen'),vnInterface=document.getElementById('vn-interface'),endTitle=document.getElementById('end-title'),feedbackGif=document.getElementById('feedback-gif'),sceneChip=document.getElementById('scene-chip');let width=0,height=0,gameActive=false,frameCount=0,currentSceneId='start',dialogueIndex=0,isTyping=false,currentText='',displayedText='',typeInterval=null,characterVisible=false,shards=[];const SCRIPT={start:{bg:'hallway',lines:[{speaker:'Nova',text:'The party is three floors above the school parking lot, but my phone makes it feel closer than skin.'},{speaker:'Nova',text:'Everyone is glowing. Everyone is filming. I am trying to decide which version of me gets posted tonight.'},{speaker:'Unknown DM',text:'you came? thought you were done with me.'},{speaker:'Nova',text:'My heart answers before I do.'}],next:'meet_jules'},meet_jules:{bg:'mirror',character:true,lines:[{speaker:'Jules',text:'You disappeared into the bathroom like a tragic music video.'},{speaker:'Nova',text:'I needed one minute without somebody turning my face into content.'},{speaker:'Jules',text:'Then choose what happens next. Chase the person who keeps breaking you, or tell me the truth before it eats you.'},{speaker:'Nova',text:'The mirror flickers. Both versions of me look exhausted.'}],choices:[{text:'Open the toxic DM and follow the glitter spiral',target:'toxic_dm'},{text:'Stay with Jules and say the vulnerable thing',target:'truth_rooftop'}]},toxic_dm:{bg:'club',character:true,lines:[{speaker:'Nova',text:'I type “where are you?” and watch the little dots perform intimacy.'},{speaker:'Ex',text:'roof. don’t bring your friend. i just miss us.'},{speaker:'Nova',text:'The bass makes every red flag look like a love song.'},{speaker:'Nova',text:'I go anyway, because wanting can be louder than knowing.'}],next:'ending_toxic'},truth_rooftop:{bg:'roof',character:true,lines:[{speaker:'Nova',text:'I hand Jules the phone instead of answering it.'},{speaker:'Jules',text:'You are allowed to be wanted without being managed.'},{speaker:'Nova',text:'The city keeps flashing, but for once it is not asking me to perform.'},{speaker:'Nova',text:'I breathe like a person with a future.'}],next:'ending_truth'},ending_toxic:{bg:'club',character:true,lines:[{speaker:'System',text:'Nova follows the message into the strobe and archives another beautiful mistake.'},{speaker:'Nova',text:'Maybe tomorrow I call it closure. Tonight I call it chemistry.'}],end:'Glitter Spiral Route Complete',endType:'bad'},ending_truth:{bg:'roof',character:true,lines:[{speaker:'System',text:'Nova lets the unread message become background noise.'},{speaker:'Jules',text:'Stay. We can be honest for one whole song.'},{speaker:'Nova',text:'For once, being seen does not feel like being hunted.'}],end:'Vulnerable Static Route Complete',endType:'good'}};function resize(){width=canvas.width=innerWidth;height=canvas.height=innerHeight;initShards()}addEventListener('resize',resize);function initShards(){shards=[];for(let i=0;i<18;i++)shards.push({x:Math.random()*width,y:Math.random()*height,w:28+Math.random()*82,s:.18+Math.random()*.55,a:.12+Math.random()*.18})}function updateChip(scene){const map={hallway:['Neon hallway','🪩'],mirror:['mirror crisis','🪞'],club:['DM spiral','💌'],roof:['rooftop truth','🌃']},m=map[scene.bg]||map.hallway;sceneChip.innerHTML='<span>'+m[0]+'</span><span>'+m[1]+'</span>'}function showGif(k){const s=ASSETS.gifs[k];if(!s)return;feedbackGif.src=s;feedbackGif.classList.add('visible')}function hideGif(){feedbackGif.classList.remove('visible')}function bg(ctx){const scene=SCRIPT[currentSceneId],bg=scene.bg,g=ctx.createLinearGradient(0,0,0,height);if(bg==='roof'){g.addColorStop(0,'#12072c');g.addColorStop(.55,'#251154');g.addColorStop(1,'#05020b')}else if(bg==='club'){g.addColorStop(0,'#210225');g.addColorStop(.45,'#6b1057');g.addColorStop(1,'#05020c')}else if(bg==='mirror'){g.addColorStop(0,'#090d2e');g.addColorStop(.5,'#2d1246');g.addColorStop(1,'#07030d')}else{g.addColorStop(0,'#0b0730');g.addColorStop(.55,'#240d4b');g.addColorStop(1,'#08030f')}ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(const sh of shards){sh.y-=sh.s;if(sh.y<-30){sh.y=height+30;sh.x=Math.random()*width}ctx.save();ctx.globalAlpha=sh.a;ctx.translate(sh.x,sh.y);ctx.rotate(-.25);ctx.fillStyle=bg==='club'?'#ff2fd6':'#31e8ff';ctx.fillRect(0,0,sh.w,2);ctx.restore()}ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;for(let y=height*.18;y<height;y+=42){ctx.beginPath();ctx.moveTo(0,y+Math.sin(frameCount*.02+y)*5);ctx.lineTo(width,y+Math.cos(frameCount*.018+y)*5);ctx.stroke()}if(bg==='roof'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,height*.72,width,height*.28);for(let x=0;x<width;x+=42){ctx.fillStyle=x%84?'#31e8ff':'#ff2fd6';ctx.globalAlpha=.35;ctx.fillRect(x,height*.55+Math.sin(x)*20,18,80);ctx.globalAlpha=1}}else{ctx.fillStyle='rgba(255,255,255,.08)';for(let x=width*.18;x<width;x+=width*.22){ctx.fillRect(x,0,2,height*.75)}ctx.strokeStyle=bg==='mirror'?'rgba(255,255,255,.28)':'rgba(255,47,214,.28)';ctx.lineWidth=3;ctx.strokeRect(width*.18,height*.12,width*.64,height*.66);if(bg==='mirror'){ctx.beginPath();ctx.moveTo(width*.5,height*.12);ctx.lineTo(width*.44,height*.42);ctx.lineTo(width*.57,height*.68);ctx.stroke()}}}function character(ctx){if(!characterVisible)return;const s=Math.min(width,height)*.00155,cx=width/2,cy=height;ctx.save();ctx.translate(cx,cy+Math.sin(frameCount*.05)*5);ctx.scale(s,s);const glow=ctx.createRadialGradient(0,-210,20,0,-210,290);glow.addColorStop(0,'rgba(255,47,214,.35)');glow.addColorStop(.55,'rgba(49,232,255,.14)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.ellipse(0,-150,250,360,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#141026';ctx.beginPath();ctx.moveTo(-95,-170);ctx.lineTo(95,-170);ctx.lineTo(150,390);ctx.lineTo(-150,390);ctx.closePath();ctx.fill();ctx.strokeStyle='#31e8ff';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-92,-145);ctx.quadraticCurveTo(0,-72,92,-145);ctx.stroke();ctx.fillStyle='#f1b7ac';ctx.beginPath();ctx.arc(0,-302,72,0,Math.PI*2);ctx.fill();ctx.fillStyle='#201025';ctx.beginPath();ctx.arc(0,-340,94,Math.PI,0);ctx.quadraticCurveTo(95,-300,76,-230);ctx.quadraticCurveTo(0,-260,-76,-230);ctx.quadraticCurveTo(-95,-300,-94,-340);ctx.fill();ctx.fillStyle='#ff2fd6';ctx.fillRect(-44,-314,22,8);ctx.fillStyle='#31e8ff';ctx.fillRect(22,-314,22,8);ctx.strokeStyle='#7d344b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-286,18,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.fillStyle='#05020b';ctx.fillRect(92,-235,58,98);ctx.strokeStyle='#ff2fd6';ctx.lineWidth=5;ctx.strokeRect(92,-235,58,98);ctx.fillStyle='rgba(49,232,255,.9)';ctx.fillRect(103,-218,36,6);ctx.fillStyle='rgba(255,47,214,.8)';ctx.fillRect(103,-200,27,6);ctx.restore()}function initGame(){currentSceneId='start';dialogueIndex=0;loadScene()}function loadScene(){const scene=SCRIPT[currentSceneId];characterVisible=!!scene.character;updateChip(scene);if(currentSceneId==='toxic_dm')showGif('romance');else if(currentSceneId==='truth_rooftop')showGif('mystery');else hideGif();if(scene.end){setTimeout(()=>showGameOver(scene.end,scene.endType),500);return}const line=scene.lines[dialogueIndex];speakerName.innerText=line.speaker;currentText=line.text;displayedText='';dialogueText.innerText='';dialogueText.classList.add('cursor');choicesContainer.innerHTML='';dialoguePanel.style.pointerEvents='auto';isTyping=true;let i=0;if(typeInterval)clearInterval(typeInterval);typeInterval=setInterval(()=>{displayedText+=currentText[i];dialogueText.innerText=displayedText;i++;if(i>=currentText.length){clearInterval(typeInterval);isTyping=false;dialogueText.classList.remove('cursor');if(dialogueIndex===scene.lines.length-1&&scene.choices){audio.playSFX('reveal',.38,140);showChoices(scene.choices)}}},28)}function advanceStory(){if(isTyping){clearInterval(typeInterval);dialogueText.innerText=currentText;isTyping=false;dialogueText.classList.remove('cursor');const scene=SCRIPT[currentSceneId];if(dialogueIndex===scene.lines.length-1&&scene.choices)showChoices(scene.choices);return}const scene=SCRIPT[currentSceneId];if(dialogueIndex===scene.lines.length-1&&scene.choices)return;audio.playSFX('next');if(dialogueIndex<scene.lines.length-1){dialogueIndex++;loadScene()}else if(scene.next){currentSceneId=scene.next;dialogueIndex=0;loadScene()}else if(scene.end)showGameOver(scene.end,scene.endType)}function showChoices(choices){choicesContainer.innerHTML='';dialoguePanel.style.pointerEvents='none';choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerText=c.text;b.onclick=e=>{e.stopPropagation();audio.playSFX('choice',.52,120);currentSceneId=c.target;dialogueIndex=0;loadScene()};choicesContainer.appendChild(b)})}function loop(){if(!gameActive)return;frameCount++;ctx.clearRect(0,0,width,height);bg(ctx);character(ctx);requestAnimationFrame(loop)}function showGameOver(title,type){gameActive=false;audio.stopBGM();if(type==='good'){audio.playSFX('end_good',.62,180);showGif('celebration')}else{audio.playSFX('end_bad',.58,180);showGif('romance')}vnInterface.classList.add('hidden');gameOverScreen.classList.remove('hidden');endTitle.innerText=title}document.getElementById('start-btn').addEventListener('click',()=>{audio.unlock();audio.playSFX('start',.6,120);audio.playBGM();hideGif();startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');vnInterface.classList.remove('hidden');gameActive=true;resize();initGame();loop()});document.getElementById('restart-btn').addEventListener('click',()=>{audio.unlock();audio.playSFX('restart',.56,120);gameOverScreen.classList.add('hidden');vnInterface.classList.remove('hidden');hideGif();audio.playBGM();gameActive=true;initGame();loop()});dialoguePanel.addEventListener('click',advanceStory);resize()});
