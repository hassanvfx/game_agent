<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Azure Bay: A Summer Memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Audiowide + Exo 2) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --font-display: "Audiowide", "Trebuchet MS", sans-serif;
            --font-ui: "Exo 2", "Segoe UI", system-ui, sans-serif;
            --font-accent: "Audiowide", "Courier New", monospace;
            --color-night: #08142f;
            --color-panel: rgba(7, 26, 62, 0.72);
            --color-panel-strong: rgba(4, 17, 42, 0.9);
            --color-line: rgba(180, 241, 255, 0.42);
            --color-text: #f4fbff;
            --color-soft: #bfe8ff;
            --color-sun: #ffd976;
            --color-coral: #ff8e88;
            --color-cyan: #7ee7ff;
            --color-sea: #16c6db;
            --color-violet: #8e7dff;
            --shadow-glow: 0 0 24px rgba(126, 231, 255, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: var(--font-ui);
            background:
                radial-gradient(circle at top, rgba(120, 225, 255, 0.2), transparent 40%),
                linear-gradient(180deg, #06122a 0%, #102753 48%, #183b70 100%);
            color: var(--color-text);
        }

        button {
            font-family: var(--font-ui);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            touch-action: none;
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 226, 121, 0.18), transparent 18%),
                radial-gradient(circle at 82% 20%, rgba(126, 231, 255, 0.16), transparent 16%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 28%);
            z-index: 1;
        }

        .game-shell::after {
            background:
                linear-gradient(180deg, rgba(7, 24, 57, 0.12), rgba(7, 24, 57, 0) 22%, rgba(1, 8, 23, 0.32) 100%);
            z-index: 1;
        }

        .spark-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .spark {
            position: absolute;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 12px rgba(126, 231, 255, 0.8);
            animation: sparkFloat 4.4s ease-in-out infinite;
            opacity: 0.3;
        }

        .spark:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
        .spark:nth-child(2) { left: 28%; top: 34%; animation-delay: 1s; }
        .spark:nth-child(3) { left: 78%; top: 22%; animation-delay: 1.8s; }
        .spark:nth-child(4) { left: 86%; top: 46%; animation-delay: 2.4s; }
        .spark:nth-child(5) { left: 48%; top: 12%; animation-delay: 3.1s; }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 3;
        }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            bottom: calc(11.5rem + env(safe-area-inset-bottom));
            width: min(30vw, 8rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.32);
            background: rgba(7, 20, 47, 0.6);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), var(--shadow-glow);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 4;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            pointer-events: auto;
            z-index: 50;
        }

        .start-screen {
            background:
                linear-gradient(180deg, rgba(3, 8, 19, 0.22), rgba(3, 8, 19, 0.7)),
                radial-gradient(circle at top, rgba(126, 231, 255, 0.16), transparent 30%);
            backdrop-filter: blur(6px);
        }

        .game-over-screen {
            background: rgba(2, 8, 21, 0.86);
        }

        .hidden {
            display: none;
        }

        .glass-panel {
            width: min(100%, 28rem);
            padding: 1.5rem;
            border-radius: 1.75rem;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(16, 48, 98, 0.9), rgba(8, 25, 58, 0.86));
            border: 1px solid var(--color-line);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                var(--shadow-glow);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 35%),
                radial-gradient(circle at 82% 24%, rgba(255, 217, 118, 0.22), transparent 20%);
            pointer-events: none;
        }

        .hero-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.9rem;
            margin-bottom: 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-soft);
        }

        .hero-badge span:last-child {
            font-size: 1rem;
        }

        .title {
            position: relative;
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 10vw, 4rem);
            line-height: 0.95;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(126, 231, 255, 0.5),
                0 0 24px rgba(126, 231, 255, 0.22);
        }

        .title-gradient {
            display: block;
            background: linear-gradient(180deg, #fef7c8 0%, #8ce8ff 48%, #66b6ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-copy,
        .end-copy {
            position: relative;
            margin: 0.8rem auto 1.3rem;
            max-width: 22rem;
            font-size: clamp(0.95rem, 3.7vw, 1.15rem);
            line-height: 1.5;
            color: rgba(244, 251, 255, 0.9);
        }

        .character-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.65rem 1rem;
            margin-bottom: 1.15rem;
            border-radius: 1rem;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .portrait-emoji {
            font-size: 1.6rem;
            filter: drop-shadow(0 0 10px rgba(255, 230, 138, 0.35));
        }

        .pill-text {
            text-align: left;
            line-height: 1.15;
        }

        .pill-label {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(191, 232, 255, 0.7);
        }

        .pill-name {
            display: block;
            font-family: var(--font-display);
            letter-spacing: 0.04em;
            color: #fff6d9;
        }

        .arcade-button {
            position: relative;
            min-height: 3.25rem;
            padding: 0.95rem 1.4rem;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #1fd4f4 0%, #427eff 100%);
            color: white;
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 12px 30px rgba(41, 123, 255, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            cursor: pointer;
        }

        .arcade-button:hover,
        .arcade-button:focus-visible {
            transform: translateY(-2px) scale(1.01);
            box-shadow:
                0 16px 34px rgba(41, 123, 255, 0.42),
                0 0 24px rgba(126, 231, 255, 0.28);
            filter: brightness(1.05);
            outline: none;
        }

        .arcade-button:active,
        .choice-btn:active {
            transform: scale(0.97);
        }

        .end-title {
            margin: 0 0 0.75rem;
            padding: 0 1rem;
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 8vw, 3rem);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: white;
            text-align: center;
        }

        .vn-interface {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            width: 100%;
            padding: 0 0.9rem max(0.85rem, env(safe-area-inset-bottom));
            pointer-events: auto;
        }

        .choices-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.8rem;
        }

        .choice-btn {
            width: min(100%, 36rem);
            min-height: 3rem;
            padding: 0.9rem 1rem;
            border: 1px solid rgba(175, 235, 255, 0.42);
            border-radius: 1.1rem;
            background:
                linear-gradient(180deg, rgba(249, 254, 255, 0.96), rgba(220, 246, 255, 0.92));
            color: #0f3e7e;
            font-family: var(--font-ui);
            font-size: clamp(0.96rem, 3.9vw, 1.05rem);
            font-weight: 600;
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.16),
                0 0 18px rgba(126, 231, 255, 0.14);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
            cursor: pointer;
        }

        .choice-btn:hover,
        .choice-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.2),
                0 0 22px rgba(126, 231, 255, 0.2);
            filter: brightness(1.02);
            outline: none;
        }

        .dialogue-panel {
            width: 100%;
            min-height: 10rem;
            padding: 1.15rem 1rem 2.75rem;
            border-radius: 1.5rem;
            position: relative;
            cursor: pointer;
            background:
                linear-gradient(180deg, rgba(3, 13, 31, 0.72), rgba(7, 25, 57, 0.88));
            border: 1px solid var(--color-line);
            box-shadow:
                0 16px 44px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                var(--shadow-glow);
            backdrop-filter: blur(10px);
            transition: background 160ms ease, border-color 160ms ease;
        }

        .dialogue-panel:hover {
            background:
                linear-gradient(180deg, rgba(5, 17, 41, 0.76), rgba(9, 29, 63, 0.92));
            border-color: rgba(196, 244, 255, 0.56);
        }

        .speaker-name {
            position: absolute;
            top: -1rem;
            left: 1rem;
            max-width: calc(100% - 2rem);
            padding: 0.45rem 0.95rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #fe9b8d 0%, #7869ff 100%);
            color: white;
            font-family: var(--font-display);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(120, 105, 255, 0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dialogue-text {
            margin: 0.8rem 0 0;
            font-size: clamp(1rem, 4.3vw, 1.28rem);
            line-height: 1.6;
            color: white;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.32);
        }

        .prompt-line {
            position: absolute;
            right: 1rem;
            bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(215, 243, 255, 0.72);
        }

        .prompt-line .tap-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: var(--color-cyan);
            box-shadow: 0 0 8px rgba(126, 231, 255, 0.8);
            animation: blink 1s infinite;
        }

        .scene-chip {
            position: absolute;
            top: 0.9rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            background: rgba(7, 20, 47, 0.56);
            border: 1px solid rgba(189, 241, 255, 0.24);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(220, 247, 255, 0.82);
        }

        .scene-chip span:last-child {
            font-size: 0.95rem;
        }

        .cursor::after {
            content: "▼";
            animation: blink 1s infinite;
            margin-left: 0.35rem;
            color: #fff0aa;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.28; }
        }

        @keyframes sparkFloat {
            0%, 100% {
                transform: translateY(0) scale(0.95);
                opacity: 0.18;
            }
            50% {
                transform: translateY(-14px) scale(1.2);
                opacity: 0.78;
            }
        }

        @media (min-width: 768px) {
            .glass-panel {
                padding: 2rem;
            }

            .vn-interface {
                padding-left: clamp(1rem, 5vw, 5rem);
                padding-right: clamp(1rem, 5vw, 5rem);
                padding-bottom: max(1.2rem, env(safe-area-inset-bottom));
            }

            .dialogue-panel {
                padding: 1.3rem 1.4rem 2.9rem;
            }
        }

        @media (max-width: 480px) {
            .glass-panel {
                padding: 1.2rem;
                border-radius: 1.4rem;
            }

            .dialogue-panel {
                min-height: 9.5rem;
                border-radius: 1.3rem;
            }

            .speaker-name {
                left: 0.8rem;
                right: 0.8rem;
                max-width: none;
            }

            .scene-chip {
                top: 0.7rem;
                right: 0.8rem;
                font-size: 0.68rem;
            }

            .prompt-line {
                right: 0.8rem;
                bottom: 0.8rem;
                font-size: 0.66rem;
            }

            .hero-copy,
            .end-copy {
                margin-bottom: 1rem;
            }

            .feedback-gif {
                right: 0.65rem;
                bottom: calc(12.25rem + env(safe-area-inset-bottom));
                width: 4.6rem;
                border-radius: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <div class="spark-layer" aria-hidden="true">
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
        </div>

        <!-- [agent-note][stage3] resolved-gif: romance/finale feedback -> catalogs/gifs.json -->
        <img id="feedback-gif" class="feedback-gif" alt="" aria-hidden="true">

        <!-- [agent-note][stage2] preserve: dialogue-stack | reason: already mobile-safe, styling upgraded without shifting tap flow -->
        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="screen-overlay start-screen">
                <div class="glass-panel">
                    <div class="hero-badge"><span>Summer route</span><span>🌊</span></div>
                    <div class="character-pill" aria-hidden="true">
                        <span class="portrait-emoji">👒</span>
                        <span class="pill-text">
                            <span class="pill-label">Featured lead</span>
                            <span class="pill-name">Lena of Azure Bay</span>
                        </span>
                    </div>
                    <h1 class="title"><span class="title-gradient">Azure Bay</span></h1>
                    <p class="hero-copy">A glowing seaside arrival story with one unforgettable first meeting and two warm summer routes.</p>
                    <button id="start-btn" class="arcade-button">Start Day One</button>
                </div>
            </div>

            <div id="game-over-screen" class="screen-overlay game-over-screen hidden">
                <div class="glass-panel">
                    <div class="hero-badge"><span>Memory saved</span><span>✨</span></div>
                    <h2 id="end-title" class="end-title">The End</h2>
                    <p id="end-desc" class="end-copy">Replay the same arrival and try the other conversation path.</p>
                    <button id="restart-btn" class="arcade-button">Restart Arrival</button>
                </div>
            </div>

            <div id="vn-interface" class="vn-interface hidden">
                <div id="choices-container" class="choices-container">
                    <!-- Buttons injected here -->
                </div>

                <div id="dialogue-panel" class="dialogue-panel">
                    <div id="speaker-name" class="speaker-name">???</div>
                    <div class="scene-chip" aria-hidden="true"><span>Boardwalk mood</span><span>☀️</span></div>
                    <p id="dialogue-text" class="dialogue-text"></p>
                    <div class="prompt-line"><span class="tap-dot"></span><span>Tap to continue</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3",
            sfx: {
                next: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                choice: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                reveal: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
                end_good: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3",
                end_bad: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3"
            },
            gifs: {
                romance: "https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp",
                celebration: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
                mystery: "https://i.giphy.com/12GxI1Eqg7S6f6.webp"
            }
        };

        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.bgmStarted = false;
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [key, value] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(value);
                    sound.preload = 'auto';
                    this.sfx[key] = sound;
                }
            }

            unlock() {
                if (this.bgmStarted) return;
                this.bgmStarted = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sound => sound.load());
            }

            playBGM() {
                this.unlock();
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, volume = 0.58, cooldown = 90) {
                const source = this.sfx[key];
                if (!source) return;

                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldown) return;
                this.lastPlayedAt[key] = now;

                try {
                    const clone = source.cloneNode();
                    clone.volume = volume;
                    clone.play().catch(() => {});
                } catch (_) {}
            }
        }

        const audio = new AudioController();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialoguePanel = document.getElementById('dialogue-panel');
        const speakerName = document.getElementById('speaker-name');
        const dialogueText = document.getElementById('dialogue-text');
        const choicesContainer = document.getElementById('choices-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const vnInterface = document.getElementById('vn-interface');
        const endTitle = document.getElementById('end-title');
        const feedbackGif = document.getElementById('feedback-gif');

        let width, height;
        let gameActive = false;
        let frameCount = 0;

        let currentSceneId = 'start';
        let dialogueIndex = 0;
        let isTyping = false;
        let currentText = "";
        let displayedText = "";
        let typeInterval = null;
        let characterVisible = false;
        let clouds = [];

        const SCRIPT = {
            start: {
                bg: 'beach_day',
                lines: [
                    { speaker: "You", text: "The bus ride was long, but the ocean air makes the detour worth it." },
                    { speaker: "You", text: "Azure Bay... one summer stop, two possible first impressions." },
                    { speaker: "???", text: "Heads up!" },
                    { speaker: "You", text: "Whoa!" }
                ],
                next: 'meet_lena'
            },
            meet_lena: {
                bg: 'beach_day',
                character: true,
                lines: [
                    { speaker: "Girl", text: "Sorry! My beach ball had other plans." },
                    { speaker: "Girl", text: "Wait... are you the new transfer student everyone keeps mentioning?" },
                    { speaker: "You", text: "Word travels fast in a beach town." },
                    { speaker: "Lena", text: "I'm Lena. Welcome to Azure Bay. Want to pick the vibe for your first afternoon?" }
                ],
                choices: [
                    { text: "Ask about the old lighthouse", target: 'lighthouse' },
                    { text: "Ask for the best ice cream stop", target: 'ice_cream' }
                ]
            },
            lighthouse: {
                bg: 'beach_sunset',
                character: true,
                lines: [
                    { speaker: "You", text: "I saw an old lighthouse on the hill. Is it abandoned?" },
                    { speaker: "Lena", text: "The lighthouse? ...Yeah. People say it's haunted." },
                    { speaker: "Lena", text: "But honestly? It has the best view of the sunset. Want to see?" },
                    { speaker: "You", text: "Sure, lead the way." }
                ],
                next: 'ending_mystery'
            },
            ice_cream: {
                bg: 'beach_day',
                character: true,
                lines: [
                    { speaker: "You", text: "I'm dying of heat. Where can I get some ice cream?" },
                    { speaker: "Lena", text: "Ooh! 'Scoops' is just down the boardwalk. Their mango sorbet is legendary." },
                    { speaker: "Lena", text: "If you buy me one, I'll give you a tour of the town!" },
                    { speaker: "You", text: "Deal." }
                ],
                next: 'ending_romance'
            },
            ending_mystery: {
                bg: 'beach_sunset',
                character: true,
                lines: [
                    { speaker: "System", text: "You and Lena spend the evening scouting the old lighthouse overlook." },
                    { speaker: "Lena", text: "See? Less haunted mystery, more perfect sunset checkpoint." },
                    { speaker: "You", text: "You were right. This was the best first route." }
                ],
                end: "Lighthouse Route Complete",
                endType: "good"
            },
            ending_romance: {
                bg: 'beach_day',
                character: true,
                lines: [
                    { speaker: "System", text: "The ice cream stop turns into a fast, messy tour of the boardwalk." },
                    { speaker: "Lena", text: "Best first day in town? I vote yes." },
                    { speaker: "You", text: "Easy yes." }
                ],
                end: "Boardwalk Route Complete",
                endType: "good"
            }
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initClouds();
        }

        window.addEventListener('resize', resize);

        function initClouds() {
            clouds = [];
            for (let index = 0; index < 8; index++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.4),
                    r: 30 + Math.random() * 50,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
        }

        function drawBackground(context) {
            const scene = SCRIPT[currentSceneId];
            const gradient = context.createLinearGradient(0, 0, 0, height);

            if (scene.bg === 'beach_sunset') {
                gradient.addColorStop(0, '#3c1c51');
                gradient.addColorStop(0.48, '#c56dc4');
                gradient.addColorStop(1, '#ff9b6d');
            } else {
                gradient.addColorStop(0, '#3d8cff');
                gradient.addColorStop(0.45, '#43d8ff');
                gradient.addColorStop(1, '#8ef3ff');
            }

            context.fillStyle = gradient;
            context.fillRect(0, 0, width, height);

            const aurora = context.createRadialGradient(width * 0.72, height * 0.18, 20, width * 0.72, height * 0.18, width * 0.38);
            aurora.addColorStop(0, scene.bg === 'beach_sunset' ? 'rgba(255, 219, 147, 0.34)' : 'rgba(255, 255, 255, 0.28)');
            aurora.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = aurora;
            context.fillRect(0, 0, width, height);

            context.beginPath();
            if (scene.bg === 'beach_sunset') {
                context.arc(width * 0.5, height * 0.68, 82, 0, Math.PI * 2);
                context.fillStyle = 'rgba(255, 210, 95, 0.88)';
            } else {
                context.arc(width * 0.84, height * 0.16, 60, 0, Math.PI * 2);
                context.fillStyle = 'rgba(255, 250, 208, 0.96)';
            }
            context.fill();

            context.fillStyle = 'rgba(255, 255, 255, 0.64)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x < -100) cloud.x = width + 100;

                context.beginPath();
                context.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
                context.arc(cloud.x + cloud.r * 0.7, cloud.y - cloud.r * 0.5, cloud.r * 0.8, 0, Math.PI * 2);
                context.arc(cloud.x + cloud.r * 1.2, cloud.y, cloud.r * 0.9, 0, Math.PI * 2);
                context.fill();
            });

            const oceanHeight = height * 0.3;
            context.fillStyle = scene.bg === 'beach_sunset' ? '#211b58' : '#0b6c97';
            context.beginPath();
            context.moveTo(0, height);
            context.lineTo(0, height - oceanHeight);

            for (let x = 0; x <= width; x += 10) {
                const y = Math.sin(x * 0.01 + frameCount * 0.02) * 10;
                context.lineTo(x, height - oceanHeight + y);
            }

            context.lineTo(width, height);
            context.fill();

            context.fillStyle = 'rgba(255,255,255,0.18)';
            for (let x = 0; x < width; x += 48) {
                const y = Math.sin(x * 0.014 + frameCount * 0.03) * 4;
                context.fillRect(x, height - oceanHeight + 16 + y, 22, 2);
            }

            context.fillStyle = scene.bg === 'beach_sunset' ? '#3d285e' : '#f4d48c';
            context.beginPath();
            context.moveTo(0, height);
            context.lineTo(0, height - oceanHeight * 0.24);
            context.quadraticCurveTo(width * 0.38, height - oceanHeight * 0.05, width * 0.68, height - oceanHeight * 0.2);
            context.quadraticCurveTo(width * 0.82, height - oceanHeight * 0.28, width, height - oceanHeight * 0.16);
            context.lineTo(width, height);
            context.closePath();
            context.fill();

            context.fillStyle = 'rgba(255, 255, 255, 0.22)';
            for (let x = 18; x < width; x += 34) {
                context.beginPath();
                context.arc(x, height - oceanHeight * 0.18 + Math.sin((x + frameCount * 2) * 0.02) * 2, 1.8, 0, Math.PI * 2);
                context.fill();
            }
        }

        function drawCharacter(context) {
            if (!characterVisible) return;

            const centerX = width / 2;
            const centerY = height;
            const scale = Math.min(width, height) * 0.0015;

            context.save();
            context.translate(centerX, centerY + Math.sin(frameCount * 0.05) * 5);
            context.scale(scale, scale);

            const waveGlow = context.createRadialGradient(0, -170, 18, 0, -170, 260);
            waveGlow.addColorStop(0, 'rgba(255, 250, 216, 0.2)');
            waveGlow.addColorStop(1, 'rgba(255, 250, 216, 0)');
            context.fillStyle = waveGlow;
            context.beginPath();
            context.ellipse(0, -90, 240, 320, 0, 0, Math.PI * 2);
            context.fill();

            context.fillStyle = '#f7d96f';
            context.beginPath();
            context.arc(0, -350, 110, Math.PI, 0);
            context.bezierCurveTo(128, -346, 158, -110, 185, 18);
            context.lineTo(-185, 18);
            context.bezierCurveTo(-158, -110, -128, -346, -110, -350);
            context.fill();

            context.fillStyle = '#fff9f0';
            context.beginPath();
            context.moveTo(-60, -200);
            context.lineTo(60, -200);
            context.lineTo(100, 0);
            context.lineTo(142, 400);
            context.lineTo(-142, 400);
            context.lineTo(-100, 0);
            context.fill();

            context.fillStyle = '#6bdaf4';
            context.beginPath();
            context.moveTo(-68, -195);
            context.lineTo(68, -195);
            context.lineTo(55, -135);
            context.lineTo(-55, -135);
            context.closePath();
            context.fill();

            context.fillStyle = '#ffdbb0';
            context.beginPath();
            context.arc(0, -300, 70, 0, Math.PI * 2);
            context.fill();

            context.fillStyle = '#f7d96f';
            context.beginPath();
            context.moveTo(-72, -340);
            context.quadraticCurveTo(0, -275, 72, -340);
            context.lineTo(72, -386);
            context.lineTo(-72, -386);
            context.fill();

            context.fillStyle = '#ffeab7';
            context.beginPath();
            context.ellipse(0, -384, 142, 30, 0, 0, Math.PI * 2);
            context.fill();
            context.beginPath();
            context.arc(0, -384, 72, Math.PI, 0);
            context.fill();

            context.strokeStyle = '#ff8f95';
            context.lineWidth = 10;
            context.beginPath();
            context.moveTo(-70, -384);
            context.lineTo(70, -384);
            context.stroke();

            context.fillStyle = '#3062ff';
            context.beginPath();
            context.arc(-24, -308, 8, 0, Math.PI * 2);
            context.arc(24, -308, 8, 0, Math.PI * 2);
            context.fill();

            context.strokeStyle = '#74423d';
            context.lineWidth = 4;
            context.beginPath();
            context.arc(0, -285, 20, 0.18 * Math.PI, 0.82 * Math.PI);
            context.stroke();

            context.fillStyle = '#ffefe5';
            context.beginPath();
            context.ellipse(0, -120, 94, 24, 0, 0, Math.PI * 2);
            context.fill();

            context.fillStyle = 'rgba(255, 255, 255, 0.62)';
            context.beginPath();
            context.arc(110, -365, 14, 0, Math.PI * 2);
            context.fill();
            context.beginPath();
            context.arc(132, -340, 8, 0, Math.PI * 2);
            context.fill();

            context.restore();
        }

        function initGame() {
            currentSceneId = 'start';
            dialogueIndex = 0;
            loadScene();
        }

        function updateSceneChip(scene) {
            const chip = dialoguePanel.querySelector('.scene-chip');
            if (!chip) return;
            chip.innerHTML = scene.bg === 'beach_sunset'
                ? '<span>Lighthouse glow</span><span>🌇</span>'
                : '<span>Boardwalk mood</span><span>☀️</span>';
        }

        function showFeedbackGif(kind) {
            const src = ASSETS.gifs[kind];
            if (!feedbackGif || !src) return;
            feedbackGif.src = src;
            feedbackGif.classList.add('visible');
        }

        function hideFeedbackGif() {
            if (!feedbackGif) return;
            feedbackGif.classList.remove('visible');
        }

        function loadScene() {
            const scene = SCRIPT[currentSceneId];
            characterVisible = !!scene.character;
            updateSceneChip(scene);

            if (currentSceneId === 'ice_cream') {
                showFeedbackGif('romance');
            } else if (currentSceneId === 'lighthouse') {
                showFeedbackGif('mystery');
            } else {
                hideFeedbackGif();
            }

            if (scene.end) {
                setTimeout(() => showGameOver(scene.end, scene.endType), 500);
                return;
            }

            const line = scene.lines[dialogueIndex];
            speakerName.innerText = line.speaker;

            currentText = line.text;
            displayedText = "";
            dialogueText.innerText = "";
            dialogueText.classList.add('cursor');

            choicesContainer.innerHTML = '';
            dialoguePanel.style.pointerEvents = 'auto';

            isTyping = true;
            let charIndex = 0;
            if (typeInterval) clearInterval(typeInterval);

            typeInterval = setInterval(() => {
                displayedText += currentText[charIndex];
                dialogueText.innerText = displayedText;
                charIndex++;
                if (charIndex >= currentText.length) {
                    clearInterval(typeInterval);
                    isTyping = false;
                    dialogueText.classList.remove('cursor');

                    if (dialogueIndex === scene.lines.length - 1 && scene.choices) {
                        audio.playSFX('reveal', 0.42, 140);
                        showChoices(scene.choices);
                    }
                }
            }, 30);
        }

        function advanceStory() {
            if (isTyping) {
                clearInterval(typeInterval);
                dialogueText.innerText = currentText;
                isTyping = false;
                dialogueText.classList.remove('cursor');

                const scene = SCRIPT[currentSceneId];
                if (dialogueIndex === scene.lines.length - 1 && scene.choices) {
                    showChoices(scene.choices);
                }
                return;
            }

            const scene = SCRIPT[currentSceneId];

            if (dialogueIndex === scene.lines.length - 1 && scene.choices) {
                return;
            }

            audio.playSFX('next');

            if (dialogueIndex < scene.lines.length - 1) {
                dialogueIndex++;
                loadScene();
            } else {
                if (scene.next) {
                    currentSceneId = scene.next;
                    dialogueIndex = 0;
                    loadScene();
                } else if (scene.end) {
                    showGameOver(scene.end, scene.endType);
                }
            }
        }

        function showChoices(choices) {
            choicesContainer.innerHTML = '';
            dialoguePanel.style.pointerEvents = 'none';

            choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.innerText = choice.text;
                button.onclick = event => {
                    event.stopPropagation();
                    audio.playSFX('choice', 0.52, 120);
                    currentSceneId = choice.target;
                    dialogueIndex = 0;
                    loadScene();
                };
                choicesContainer.appendChild(button);
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            frameCount++;
            ctx.clearRect(0, 0, width, height);

            drawBackground(ctx);
            drawCharacter(ctx);

            requestAnimationFrame(gameLoop);
        }

        function showGameOver(title, type) {
            gameActive = false;
            audio.stopBGM();
            if (type === 'good') {
                audio.playSFX('end_good', 0.62, 180);
                showFeedbackGif(currentSceneId === 'ending_romance' ? 'romance' : 'celebration');
            } else {
                audio.playSFX('end_bad', 0.58, 180);
                showFeedbackGif('mystery');
            }

            vnInterface.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            endTitle.innerText = title;
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.6, 120);
            audio.playBGM();
            hideFeedbackGif();
            startScreen.classList.add('hidden');
            vnInterface.classList.remove('hidden');
            gameActive = true;
            resize();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('restart', 0.56, 120);
            gameOverScreen.classList.add('hidden');
            vnInterface.classList.remove('hidden');
            hideFeedbackGif();
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        dialoguePanel.addEventListener('click', advanceStory);

        resize();
    });
    </script>
</body>
</html>
