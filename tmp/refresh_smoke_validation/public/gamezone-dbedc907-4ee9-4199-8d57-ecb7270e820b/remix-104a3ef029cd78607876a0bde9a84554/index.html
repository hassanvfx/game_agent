<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Meme Arcade: Thread Boss Takedown</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        :root {
            --bg-top: #12061d;
            --bg-mid: #1a1038;
            --bg-bottom: #090b1f;
            --panel: rgba(17, 14, 36, 0.76);
            --panel-strong: rgba(28, 19, 58, 0.92);
            --line: rgba(133, 102, 255, 0.48);
            --glow: rgba(108, 237, 255, 0.28);
            --glow-strong: rgba(255, 86, 193, 0.4);
            --text: #f7f6ff;
            --muted: #c9c2f0;
            --accent: #6cedff;
            --accent-2: #ff56c1;
            --accent-3: #ffd166;
            --danger: #ff6b7a;
            --success: #7dffb2;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: auto;
            background: #090b1f;
            color: var(--text);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            width: 38vmax;
            height: 38vmax;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        body::before {
            top: -12vmax;
            left: -10vmax;
            background: rgba(108, 237, 255, 0.14);
        }

        body::after {
            right: -12vmax;
            bottom: -14vmax;
            background: rgba(255, 86, 193, 0.14);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .w-full { width: 100%; }
        .h-full { width: 100vw; height: 100vh; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .max-w-md { max-width: 28rem; }
        .max-w-sm { max-width: 24rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .text-white { color: #fff; }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-900 { color: #111827; }
        .text-green-400 { color: var(--success); }
        .text-red-400 { color: var(--danger); }
        .text-sm { font-size: 0.9rem; }
        .text-lg { font-size: 1.1rem; }
        .text-4xl { font-size: clamp(2rem, 5vw, 2.5rem); }
        .text-5xl { font-size: clamp(2.4rem, 7vw, 3.35rem); }
        .font-bold { font-weight: 700; }
        .shadow-lg { box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
        .transition { transition: all 0.25s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .drop-shadow-lg { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }
        .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }

        #game-container {
            isolation: isolate;
            background:
                radial-gradient(circle at 20% 20%, rgba(108, 237, 255, 0.08), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(255, 86, 193, 0.1), transparent 22%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom));
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(40, 28, 84, 0.82), rgba(13, 12, 35, 0.92));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(150, 124, 255, 0.35);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 30px rgba(108, 237, 255, 0.14);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), transparent 32%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 14px);
            pointer-events: none;
        }

        .glass-panel h1,
        .glass-panel h2 {
            margin-top: 0;
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #hud {
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.04em;
            z-index: 3;
        }

        .hud-card {
            background: linear-gradient(180deg, rgba(26, 22, 58, 0.92), rgba(9, 10, 27, 0.92));
            border: 1px solid rgba(108, 237, 255, 0.35);
            box-shadow:
                0 12px 24px rgba(0,0,0,0.34),
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 0 20px rgba(108, 237, 255, 0.12);
            border-radius: 18px;
            padding: 0.75rem 0.9rem;
        }

        .hud-label-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.64rem;
            color: #fef7ff;
            margin-bottom: 0.4rem;
            text-shadow: 0 0 8px rgba(108, 237, 255, 0.25);
        }

        .hud-label-row span:last-child {
            color: var(--accent-3);
        }

        .title-gradient {
            background: linear-gradient(90deg, #6cedff, #a98cff 45%, #ff56c1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            color: var(--muted);
            max-width: 20rem;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.45;
        }

        .microcopy {
            color: #b4abd9;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.8rem;
            margin-bottom: 1rem;
            border-radius: 999px;
            background: rgba(108, 237, 255, 0.1);
            border: 1px solid rgba(108, 237, 255, 0.28);
            color: #d7fbff;
            font-size: 0.74rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .emoji-badge {
            font-size: 1.15rem;
            filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.45));
        }

        .primary-btn, .secondary-btn {
            border: none;
            font: inherit;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.9rem 2.25rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-width: 12rem;
            max-width: 100%;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(28vw, 120px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 14px 28px rgba(0,0,0,0.32);
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 2;
            background: rgba(12, 10, 28, 0.82);
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 1rem;
            right: auto;
        }

        .primary-btn {
            background: linear-gradient(90deg, #14d7ff, #8a6bff 52%, #ff56c1);
            color: #0c0820;
            box-shadow: 0 12px 24px rgba(108, 237, 255, 0.22);
        }

        .secondary-btn {
            background: linear-gradient(180deg, #fff4fe, #dfe7ff);
            color: #111827;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
        }

        .primary-btn:hover, .secondary-btn:hover,
        .primary-btn:active, .secondary-btn:active {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .screen-stack {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .character-preview {
            position: relative;
            margin: 0 auto 1.2rem;
            width: 8rem;
            height: 8rem;
            border-radius: 28px;
            background:
                radial-gradient(circle at 30% 28%, rgba(255,255,255,0.42), transparent 20%),
                linear-gradient(180deg, rgba(108, 237, 255, 0.22), rgba(255, 86, 193, 0.15)),
                rgba(16, 12, 36, 0.95);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow:
                inset 0 0 30px rgba(108, 237, 255, 0.14),
                0 0 28px rgba(108, 237, 255, 0.12),
                0 18px 36px rgba(0,0,0,0.35);
        }

        .character-preview::before,
        .character-preview::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: #fff;
            top: 2.4rem;
            width: 0.8rem;
            height: 0.8rem;
            box-shadow: 0 0 12px rgba(108, 237, 255, 0.35);
        }

        .character-preview::before { left: 2.3rem; }
        .character-preview::after { right: 2.3rem; }

        .character-face {
            position: absolute;
            inset: 1.15rem;
            border-radius: 24px;
            background:
                linear-gradient(180deg, rgba(99, 102, 241, 0.22), rgba(20, 215, 255, 0.1)),
                rgba(17, 20, 50, 0.95);
            border: 2px solid rgba(108, 237, 255, 0.3);
        }

        .character-mouth {
            position: absolute;
            left: 50%;
            bottom: 2.05rem;
            width: 2rem;
            height: 0.8rem;
            margin-left: -1rem;
            border-bottom: 4px solid #ff56c1;
            border-radius: 0 0 999px 999px;
            box-shadow: 0 8px 16px rgba(255, 86, 193, 0.18);
        }

        .character-horns {
            position: absolute;
            inset: 0;
        }

        .character-horns::before,
        .character-horns::after {
            content: "";
            position: absolute;
            top: 0.85rem;
            width: 1.2rem;
            height: 1.9rem;
            background: linear-gradient(180deg, #ffd166, #ff8f4d);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            filter: drop-shadow(0 4px 8px rgba(255, 209, 102, 0.35));
        }

        .character-horns::before { left: 1.45rem; transform: rotate(-18deg); }
        .character-horns::after { right: 1.45rem; transform: rotate(18deg); }

        .boss-bar-container,
        .player-bar-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: rgba(4, 6, 14, 0.9);
        }

        .boss-bar-container {
            height: 18px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.4);
        }

        .player-bar-container {
            width: min(200px, 52vw);
            height: 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            margin-top: 5px;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.38);
        }

        .boss-bar-fill,
        .player-bar-fill {
            height: 100%;
            width: 100%;
            position: relative;
            transition: width 0.1s linear;
        }

        .boss-bar-fill {
            background: linear-gradient(90deg, #ff7b7b, #ff56c1 50%, #ff9248);
        }

        .player-bar-fill {
            background: linear-gradient(90deg, #6cedff, #4d7fff 52%, #9d8bff);
        }

        .boss-bar-fill::after,
        .player-bar-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.8s linear infinite;
        }

        .status-pill-row {
            display: flex;
            justify-content: center;
            gap: 0.55rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .status-pill {
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f2eefe;
            font-size: 0.82rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.7; transform: translateY(-2px); }
        }

        @keyframes shimmer {
            to { transform: translateX(100%); }
        }

        @media (max-width: 600px) {
            .p-8 { padding: 1.25rem; }
            .text-lg { font-size: 1rem; }
            .primary-btn, .secondary-btn {
                width: 100%;
                min-width: 0;
                padding: 0.9rem 1rem;
                font-size: 0.92rem;
            }
            .character-preview {
                width: 6.9rem;
                height: 6.9rem;
                margin-bottom: 1rem;
            }
            .character-preview::before,
            .character-preview::after {
                top: 2rem;
                width: 0.68rem;
                height: 0.68rem;
            }
            .character-preview::before { left: 1.95rem; }
            .character-preview::after { right: 1.95rem; }
            .character-mouth {
                width: 1.6rem;
                margin-left: -0.8rem;
                bottom: 1.7rem;
            }
            .hud-label-row {
                font-size: 0.55rem;
                gap: 0.6rem;
            }
            .status-pill {
                font-size: 0.76rem;
            }

            .feedback-gif {
                width: min(30vw, 92px);
                bottom: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <img id="hit-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="impact reaction overlay" aria-hidden="true">
        <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="fail reaction overlay" aria-hidden="true">

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
        <!-- [agent-note][stage3] resolved-gif: hit/fail overlays -> catalogs/gifs.json -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 pointer-events-none hidden flex flex-col items-center">
            <div class="w-full max-w-md hud-card">
                <div class="hud-label-row">
                    <span>TREND BOSS</span>
                    <span id="boss-hp-text">100%</span>
                </div>
                <div class="boss-bar-container">
                    <div id="boss-hp-bar" class="boss-bar-fill"></div>
                </div>
            </div>

            <div class="mt-4">
                <div class="player-bar-container">
                    <div id="player-hp-bar" class="player-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            <div id="start-screen" class="glass-panel p-8 rounded-2xl text-center pointer-events-auto transition duration-300 max-w-sm mx-4">
                <div class="screen-stack">
                    <div class="hero-badge"><span class="emoji-badge">👾</span><span>meme arcade broadcast</span></div>
                    <div class="character-preview" aria-hidden="true">
                        <div class="character-face"></div>
                        <div class="character-mouth"></div>
                        <div class="character-horns"></div>
                    </div>
                    <h1 class="text-5xl font-bold title-gradient mb-2 drop-shadow-lg">Thread Hunter</h1>
                    <p class="tagline text-lg mb-6 animate-pulse">Pilot the neon reply-bot and cool the chaos storm before the boss thread goes critical.</p>
                    <div class="microcopy text-sm mb-2">drag to dodge • auto-post counters</div>
                    <button id="start-btn" class="primary-btn rounded-full shadow-lg">Drop In</button>
                    <div class="status-pill-row" aria-hidden="true">
                        <span class="status-pill">⚡ fast dodge</span>
                        <span class="status-pill">💥 hot takes</span>
                        <span class="status-pill">🛡️ clean feed</span>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-2xl text-center pointer-events-auto max-w-sm mx-4">
                <div class="screen-stack">
                    <h2 id="go-title" class="text-4xl font-bold text-white mb-2">Round Over</h2>
                    <p id="go-message" class="text-gray-300 mb-6">The boss kept the timeline in chaos.</p>
                    <button id="restart-btn" class="secondary-btn rounded-full shadow-lg transition">Queue Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3",
                damage: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"
            },
            gifs: {
                hit: "https://i.giphy.com/1AjEBGWggGXh9onllB.webp",
                fail: "https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayed = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }
            enable() {
                this.enabled = true;
            }
            playBGM() {
                if (!this.enabled) return;
                if (!this.bgm.paused) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, volume = 0.55, cooldown = 120) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
                this.lastPlayed[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const hitGif = document.getElementById('hit-gif');
        const failGif = document.getElementById('fail-gif');
        let gifTimers = {};

        /** 3. GAME STATE & VARIABLES */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let frameCount = 0;

        // Game Objects
        let player = { x: 0, y: 0, w: 60, h: 60, hp: 100, maxHp: 100, tilt: 0 };
        let boss = { x: 0, y: 0, w: 120, h: 100, hp: 1000, maxHp: 1000, dir: 1, phase: 1 };
        let bullets = [];
        let particles = [];
        let stars = [];
        let dataStreams = [];

        /** 4. RESIZE & INIT */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (stars.length === 0) {
                for (let i = 0; i < 50; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 1.8 + 0.4
                    });
                }
            }
            if (dataStreams.length === 0) {
                for (let i = 0; i < 12; i++) {
                    dataStreams.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        len: Math.random() * 90 + 30,
                        speed: Math.random() * 2 + 1,
                        alpha: Math.random() * 0.25 + 0.05
                    });
                }
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            player.hp = 100;
            player.maxHp = 100;
            player.x = width / 2;
            player.y = height - 100;
            player.tilt = 0;

            boss.hp = 2000;
            boss.maxHp = 2000;
            boss.x = width / 2;
            boss.y = 100;
            boss.dir = 1;

            bullets = [];
            particles = [];
            frameCount = 0;

            updateUI();
        }

        /** 5. INPUT */
        let inputX = width / 2;

        canvas.addEventListener('mousemove', (e) => {
            inputX = e.clientX;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            inputX = e.touches[0].clientX;
        }, { passive: false });

        /** 6. GAME LOGIC HELPERS */
        function spawnBullet(x, y, dx, dy, type) {
            bullets.push({
                x, y, dx, dy,
                r: type === 'player' ? 4 : 6,
                type,
                color: type === 'player' ? '#6cedff' : '#ff6b7a'
            });
        }

        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color
                });
            }
        }

        function showGif(type, duration = 520) {
            const target = type === 'fail' ? failGif : hitGif;
            if (!target) return;
            target.classList.add('visible');
            clearTimeout(gifTimers[type]);
            gifTimers[type] = setTimeout(() => target.classList.remove('visible'), duration);
        }

        function updateUI() {
            const bossPct = Math.max(0, (boss.hp / boss.maxHp) * 100);
            const playerPct = Math.max(0, (player.hp / player.maxHp) * 100);

            document.getElementById('boss-hp-bar').style.width = `${bossPct}%`;
            document.getElementById('boss-hp-text').innerText = `${Math.floor(bossPct)}%`;
            document.getElementById('player-hp-bar').style.width = `${playerPct}%`;
        }

        function roundRectPath(x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#12061d');
            grad.addColorStop(0.5, '#1a1038');
            grad.addColorStop(1, '#090b1f');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            dataStreams.forEach((stream, index) => {
                stream.y += stream.speed;
                if (stream.y - stream.len > height) {
                    stream.y = -40;
                    stream.x = Math.random() * width;
                }
                const hue = index % 2 === 0 ? '108, 237, 255' : '255, 86, 193';
                ctx.strokeStyle = `rgba(${hue}, ${stream.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(stream.x, stream.y);
                ctx.lineTo(stream.x, stream.y - stream.len);
                ctx.stroke();
            });
            ctx.restore();

            stars.forEach((star, index) => {
                star.y += star.speed;
                if (star.y > height + 4) {
                    star.y = -4;
                    star.x = Math.random() * width;
                }
                ctx.globalAlpha = 0.28 + (index % 4) * 0.12;
                ctx.fillStyle = index % 6 === 0 ? '#ffd166' : '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            const gridSize = Math.max(28, Math.floor(width / 12));
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawBoss() {
            const pulse = Math.sin(frameCount * 0.08) * 0.06;
            ctx.save();
            ctx.translate(boss.x, boss.y);
            ctx.scale(1 + pulse, 1 - pulse * 0.3);

            ctx.shadowBlur = 28;
            ctx.shadowColor = 'rgba(255, 86, 193, 0.55)';
            roundRectPath(-boss.w / 2, -boss.h / 2, boss.w, boss.h, 24);
            const bossGrad = ctx.createLinearGradient(0, -boss.h / 2, 0, boss.h / 2);
            bossGrad.addColorStop(0, '#35135f');
            bossGrad.addColorStop(0.55, '#8f2c71');
            bossGrad.addColorStop(1, '#ff7a59');
            ctx.fillStyle = bossGrad;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            roundRectPath(-boss.w / 2 + 8, -boss.h / 2 + 8, boss.w - 16, boss.h - 16, 18);
            ctx.fill();

            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.moveTo(-34, -boss.h / 2 - 10);
            ctx.lineTo(-18, -boss.h / 2 + 18);
            ctx.lineTo(-44, -boss.h / 2 + 18);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(34, -boss.h / 2 - 10);
            ctx.lineTo(18, -boss.h / 2 + 18);
            ctx.lineTo(44, -boss.h / 2 + 18);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-22, -8, 10, 0, Math.PI * 2);
            ctx.arc(22, -8, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#12061d';
            ctx.beginPath();
            ctx.arc(-20 + Math.sin(frameCount * 0.07) * 1.6, -7, 4.5, 0, Math.PI * 2);
            ctx.arc(24 + Math.sin(frameCount * 0.07) * 1.6, -7, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#12061d';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-24, 22);
            ctx.quadraticCurveTo(0, 40 + Math.sin(frameCount * 0.13) * 4, 24, 22);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(-boss.w / 2 + 12, -boss.h / 2 + 14, boss.w - 24, 8);

            ctx.restore();
        }

        function drawPlayer() {
            player.tilt = (inputX - player.x) * 0.02;
            const bounce = Math.sin(frameCount * 0.18) * 3;

            ctx.save();
            ctx.translate(player.x, player.y + bounce);
            ctx.rotate(Math.max(-0.22, Math.min(0.22, player.tilt)));

            ctx.shadowBlur = 24;
            ctx.shadowColor = 'rgba(108, 237, 255, 0.55)';
            roundRectPath(-player.w / 2, -player.h / 2, player.w, player.h, 18);
            const playerGrad = ctx.createLinearGradient(0, -player.h / 2, 0, player.h / 2);
            playerGrad.addColorStop(0, '#0ef0ff');
            playerGrad.addColorStop(0.55, '#4d7fff');
            playerGrad.addColorStop(1, '#7b5cff');
            ctx.fillStyle = playerGrad;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(11, 19, 46, 0.85)';
            roundRectPath(-player.w / 2 + 6, -player.h / 2 + 8, player.w - 12, player.h - 16, 14);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-10, -4, 7, 0, Math.PI * 2);
            ctx.arc(10, -4, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#16162a';
            ctx.beginPath();
            ctx.arc(-9, -4, 3.2, 0, Math.PI * 2);
            ctx.arc(11, -4, 3.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff56c1';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-12, 12);
            ctx.quadraticCurveTo(0, 20, 12, 12);
            ctx.stroke();

            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.moveTo(-20, -player.h / 2 - 6);
            ctx.lineTo(-8, -player.h / 2 + 10);
            ctx.lineTo(-28, -player.h / 2 + 10);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(20, -player.h / 2 - 6);
            ctx.lineTo(8, -player.h / 2 + 10);
            ctx.lineTo(28, -player.h / 2 + 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawBullets() {
            bullets.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.shadowBlur = 12;
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;

                if (b.type === 'player') {
                    ctx.beginPath();
                    ctx.moveTo(0, -8);
                    ctx.lineTo(6, 6);
                    ctx.lineTo(0, 10);
                    ctx.lineTo(-6, 6);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.65)';
                    ctx.beginPath();
                    ctx.arc(0, 0, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, b.r + 1.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-5, -5);
                    ctx.lineTo(5, 5);
                    ctx.moveTo(5, -5);
                    ctx.lineTo(-5, 5);
                    ctx.stroke();
                }
                ctx.restore();
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            ctx.globalAlpha = 1.0;
        }

        /** 7. MAIN LOOP */
        function gameLoop() {
            if (!gameActive) return;
            frameCount++;

            player.x += (inputX - player.x) * 0.15;
            if (player.x < player.w / 2) player.x = player.w / 2;
            if (player.x > width - player.w / 2) player.x = width - player.w / 2;

            boss.x = (width / 2) + Math.sin(frameCount * 0.02) * (width * 0.35);
            boss.y = 100 + Math.sin(frameCount * 0.05) * 20;

            if (frameCount % 10 === 0) {
                spawnBullet(player.x, player.y - 30, 0, -12, 'player');
            }

            if (frameCount % 50 === 0) {
                for (let i = -2; i <= 2; i++) {
                    spawnBullet(boss.x, boss.y + 40, i * 1.5, 6, 'enemy');
                }
            }
            if (frameCount % 120 === 0) {
                const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                const speed = 8;
                spawnBullet(boss.x, boss.y + 40, Math.cos(angle) * speed, Math.sin(angle) * speed, 'enemy');
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.y < -50 || b.y > height + 50 || b.x < -50 || b.x > width + 50) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (b.type === 'player') {
                    if (b.x > boss.x - boss.w / 2 && b.x < boss.x + boss.w / 2 &&
                        b.y > boss.y - boss.h / 2 && b.y < boss.y + boss.h / 2) {

                        boss.hp -= 10;
                        createExplosion(b.x, b.y, '#ffffff', 2);
                        audio.playSFX('hit', 0.45, 90);
                        showGif('hit', 320);
                        bullets.splice(i, 1);
                        updateUI();

                        if (boss.hp <= boss.maxHp * 0.25 && boss.hp > 0) {
                            audio.playSFX('warning', 0.34, 1400);
                        }

                        if (boss.hp <= 0) {
                            endGame(true);
                            return;
                        }
                    }
                } else if (b.type === 'enemy') {
                    const dx = b.x - player.x;
                    const dy = b.y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < player.w / 3 + b.r) {
                        player.hp -= 10;
                        createExplosion(b.x, b.y, '#ff6b7a', 5);
                        audio.playSFX('damage', 0.52, 180);
                        showGif('fail', 720);
                        bullets.splice(i, 1);
                        updateUI();

                        if (player.hp <= 0) {
                            endGame(false);
                            return;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            ctx.clearRect(0, 0, width, height);
            drawBackground();
            drawBoss();
            drawPlayer();
            drawBullets();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function endGame(victory) {
            gameActive = false;
            audio.stopBGM();
            hitGif.classList.remove('visible');
            failGif.classList.remove('visible');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');

            const title = document.getElementById('go-title');
            const msg = document.getElementById('go-message');
            const btn = document.getElementById('restart-btn');

            if (victory) {
                audio.playSFX('win');
                title.innerText = "Feed Stabilized";
                title.className = "text-4xl font-bold text-green-400 mb-2";
                msg.innerText = "Your neon reply-bot cooled the thread and locked the chaos boss out.";
                btn.innerText = "Run It Back";
            } else {
                audio.playSFX('fail');
                title.innerText = "Post Wiped";
                title.className = "text-4xl font-bold text-red-400 mb-2";
                msg.innerText = "The boss thread overran the lane before cleanup could land.";
                btn.innerText = "Try Again";
            }
        }

        /** 8. CONTROLS */
        function startRound() {
            audio.enable();
            audio.playSFX('start', 0.5, 100);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        function restartRound() {
            audio.enable();
            audio.playSFX('click', 0.46, 100);
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        }

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // [agent-note][stage4] repaired: mobile-cta-actionability | scope: UI buttons retain native tap/click while gameplay touch suppression stays on canvas
        startBtn.addEventListener('click', startRound);
        restartBtn.addEventListener('click', restartRound);
        startBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            startRound();
        }, { passive: false });
        restartBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            restartRound();
        }, { passive: false });
    });
    </script>
</body>
