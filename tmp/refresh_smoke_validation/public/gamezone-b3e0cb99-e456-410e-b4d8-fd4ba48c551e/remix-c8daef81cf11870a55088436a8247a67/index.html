<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Epoch Clicker & Farm</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title -> Audiowide, ui/body -> Exo 2 from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-night: #07111f;
            --bg-deep: #0f2441;
            --sky-glow: rgba(91, 228, 255, 0.18);
            --glass-bg: rgba(8, 23, 43, 0.82);
            --glass-border: rgba(124, 236, 255, 0.24);
            --farm-glass: rgba(244, 252, 255, 0.88);
            --farm-border: rgba(13, 78, 92, 0.14);
            --farm-highlight: #22c55e;
            --ink: #e6f7ff;
            --ink-soft: #9ec9dd;
            --gold: #fbbf24;
            --gold-deep: #f59e0b;
            --danger: #fb7185;
            --accent: #67e8f9;
            --accent-strong: #22d3ee;
            --panel-shadow: 0 18px 40px rgba(1, 10, 24, 0.45);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Exo 2', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(34, 211, 238, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-night), #020812 70%);
            color: white; 
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 0; 
            touch-action: none;
        }

        /* UI Utilities */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(12, 31, 56, 0.96), rgba(5, 15, 29, 0.88));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--panel-shadow);
            color: var(--ink);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before,
        .farm-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 35%, transparent 65%, rgba(103,232,249,0.1));
            opacity: 0.75;
        }

        .farm-panel {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.94), rgba(223, 248, 233, 0.9));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--farm-border);
            box-shadow: 0 14px 30px rgba(22, 101, 52, 0.14);
            color: #134e4a;
            position: relative;
            overflow: hidden;
        }

        .title-font { font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif; letter-spacing: 0.08em; }
        .label-font { font-family: 'Exo 2', system-ui, sans-serif; letter-spacing: 0.14em; }
        .hud-chip {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .arcade-action {
            box-shadow: 0 14px 28px rgba(21, 94, 117, 0.45), inset 0 1px 0 rgba(255,255,255,0.24);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes floatText {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.1); }
        }
        .floating-text {
            position: absolute;
            pointer-events: none;
            animation: floatText 1.0s ease-out forwards;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 30;
            white-space: nowrap;
        }

        /* Shop Drawer Transition */
        #shop-panel { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .shop-open { transform: translateY(0%); }
        .shop-closed { transform: translateY(calc(100% - 70px)); }

        .btn-press:active { transform: scale(0.95); }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; pointer-events: none; transform: scale(0.95); }
        .modal-active { opacity: 1; pointer-events: auto; transform: scale(1); }
        .transition-all-fast { transition: all 0.2s ease-out; }

        /* Tab Active State */
        .tab-active { background-color: #16a34a; color: white; }
        .tab-inactive { background-color: #e2e8f0; color: #64748b; }

        /* Progress Bar for Growth */
        .growth-bar-container {
            position: absolute;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            display: none;
        }
        .growth-bar-fill {
            height: 100%;
            background: #84cc16;
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s linear;
        }

        #start-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.26), transparent 20%),
                radial-gradient(circle at 80% 15%, rgba(251, 191, 36, 0.22), transparent 18%),
                radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.18), transparent 22%);
            pointer-events: none;
        }

        .feedback-gif {
            position: absolute;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s ease;
            filter: drop-shadow(0 12px 24px rgba(2, 6, 23, 0.45));
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #click-feedback-gif {
            left: 50%;
            top: 18%;
            width: min(34vw, 180px);
            transform: translateX(-50%) translateY(12px) scale(0.92);
        }

        #click-feedback-gif.is-visible {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #farm-feedback-gif {
            right: 12px;
            bottom: calc(108px + var(--safe-bottom));
            width: min(30vw, 140px);
        }

        @media (max-width: 640px) {
            #click-feedback-gif {
                top: 14%;
                width: min(38vw, 140px);
            }

            #farm-feedback-gif {
                right: 8px;
                bottom: calc(104px + var(--safe-bottom));
                width: min(28vw, 108px);
            }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- [agent-note][stage3] resolved-gif: click streak + farm reward overlays -> catalogs/gifs.json -->
    <img id="click-feedback-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Harvest click feedback">
    <img id="farm-feedback-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Farm reward feedback">

    <!-- CLICKER UI LAYER -->
    <div id="ui-clicker" class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10 transition-opacity duration-500">
        
        <!-- Top HUD -->
        <div class="w-full p-4 flex justify-between items-start pt-[max(1rem,env(safe-area-inset-top))]">
            <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex flex-col min-w-[140px]">
                <div class="text-[10px] text-cyan-100/70 uppercase tracking-widest font-bold label-font">Total Wealth</div>
                <div class="text-2xl font-bold text-amber-300 flex items-center gap-2 title-font">
                    <span class="score-display">0</span>
                </div>
                <div class="text-xs text-emerald-300 font-semibold mt-1 flex items-center gap-1">
                    ⚡ <span id="dps">0</span> /s
                </div>
            </div>

            <div class="flex flex-col gap-2 items-end">
                <button id="mute-btn" class="glass-panel hud-chip w-10 h-10 rounded-full flex items-center justify-center pointer-events-auto btn-press text-cyan-100/70 hover:text-white">🔊</button>
            </div>
        </div>

        <!-- Floating Farm Button -->
        <div class="absolute right-4 bottom-28 pointer-events-auto z-20">
            <button id="to-farm-btn" class="arcade-action w-16 h-16 rounded-full bg-gradient-to-br from-emerald-300 via-lime-400 to-emerald-600 shadow-lg shadow-emerald-950/60 flex items-center justify-center text-3xl btn-press border-2 border-white/30 relative">
                🚜
                <span id="farm-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-[10px] flex items-center justify-center font-bold hidden">!</span>
            </button>
            <div class="text-center text-[10px] font-bold text-cyan-50 mt-1 shadow-black drop-shadow-md label-font">FARM</div>
        </div>

        <!-- Shop Drawer (Clicker) -->
        <div id="shop-panel" class="glass-panel w-full max-w-lg mx-auto rounded-t-3xl absolute bottom-0 left-0 right-0 h-[55%] flex flex-col pointer-events-auto shop-closed pb-[var(--safe-bottom)]">
            <div id="shop-toggle" class="h-[70px] flex items-center justify-between px-6 border-b border-white/10 cursor-pointer bg-white/5 hover:bg-white/10 transition rounded-t-3xl shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-yellow-500 w-2 h-2 rounded-full animate-pulse"></div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg tracking-wide title-font text-cyan-100">UPGRADES</span>
                        <span class="text-[10px] text-cyan-100/60 uppercase label-font">Clicker Tech</span>
                    </div>
                </div>
                <div class="bg-white/10 rounded-full p-2">
                    <svg id="chevron" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </div>
            </div>
            <div id="shop-list" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3"></div>
        </div>
    </div>

    <!-- FARM UI LAYER (Hidden by default) -->
    <div id="ui-farm" class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10 opacity-0 hidden transition-opacity duration-500">
        
        <!-- Top HUD -->
        <div class="w-full p-4 flex justify-between items-start pt-[max(1rem,env(safe-area-inset-top))]">
            <!-- Return Button -->
            <button id="return-btn" class="farm-panel px-4 py-3 rounded-2xl pointer-events-auto btn-press flex items-center gap-2 font-bold text-teal-800 shadow-sm">
                ⬅ Back
            </button>

            <!-- Wealth (Shared) -->
            <div class="farm-panel px-5 py-3 rounded-2xl pointer-events-auto flex flex-col min-w-[120px] text-right shadow-sm">
                <div class="text-[10px] text-teal-700/70 uppercase tracking-widest font-bold label-font">Treasury</div>
                <div class="text-xl font-bold text-amber-500 title-font">
                    <span class="score-display">0</span> 💰
                </div>
                <div class="text-xs text-green-600 font-semibold mt-1">
                    +<span id="farm-yield">0</span>/s (Farm)
                </div>
            </div>
        </div>

        <!-- Hint -->
        <div class="absolute top-28 w-full text-center pointer-events-none opacity-60">
            <p class="text-teal-900 font-bold text-xs bg-white/55 inline-block px-3 py-1 rounded-full backdrop-blur-sm shadow-sm label-font">Plants grow over time to produce Gold</p>
        </div>

        <!-- Farm Controls -->
        <div class="w-full p-4 flex justify-center pb-[calc(20px+var(--safe-bottom))] pointer-events-auto">
            <button id="open-farm-shop" class="arcade-action bg-gradient-to-r from-teal-500 via-emerald-500 to-lime-500 text-white px-8 py-4 rounded-full font-bold text-lg shadow-xl shadow-green-900/20 btn-press flex items-center gap-2 border-2 border-white/20 title-font">
                🏪 Garden Shop
            </button>
        </div>
    </div>

    <!-- Farm Shop Modal -->
    <div id="farm-shop-modal" class="absolute inset-0 z-50 hidden flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm modal-enter transition-all-fast">
        <div class="bg-white w-full max-w-md h-[85%] sm:h-[75%] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 title-font">Garden Center</h2>
                    <p class="text-xs text-slate-500">Plant seeds & decorate</p>
                </div>
                <button id="close-farm-shop" class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 font-bold hover:bg-gray-300 transition">✕</button>
            </div>
            
            <!-- Tabs -->
            <div class="flex p-2 gap-2 bg-white shrink-0">
                <button class="flex-1 py-2 rounded-lg font-bold text-sm tab-active transition" onclick="UI.switchFarmTab('plants')">🌱 Seeds</button>
                <button class="flex-1 py-2 rounded-lg font-bold text-sm tab-inactive transition" onclick="UI.switchFarmTab('buildings')">🏠 Decor</button>
            </div>

            <!-- List -->
            <div id="farm-shop-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 pb-[var(--safe-bottom)]">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md p-6">
            <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full border border-cyan-300/20 shadow-2xl shadow-cyan-950/40">
                <div class="text-6xl mb-4">🚜</div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-br from-cyan-200 via-amber-200 to-lime-300 mb-2 title-font">EPOCH FARM</h1>
                <p class="text-cyan-100/70 text-sm mb-2 uppercase tracking-[0.35em] label-font">Click • Grow • Upgrade</p>
                <p class="text-cyan-50/80 text-sm mb-8">A neon harvest loop with a star pilot at the center of your empire.</p>
                <button id="start-btn" class="arcade-action w-full py-4 bg-gradient-to-r from-cyan-500 via-sky-500 to-emerald-500 rounded-xl font-bold text-lg active:scale-95 transition text-white title-font">
                    START EMPIRE
                </button>
                <p class="mt-4 text-xs text-cyan-100/45 label-font">v4.0 • Auto-Save Enabled</p>
            </div>
    </div>

    <script>
        /**
         * CONFIGURATION & DATA
         */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3",
            sfx: {
                click: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                buy: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                pop: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                grow: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                uiOpen: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                uiClose: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            }
        };

        const CLICKER_BUILDINGS = [
            { id: 'cursor', name: 'Auto-Clicker', baseCost: 15, baseIncome: 0.5, icon: '👆' },
            { id: 'miner', name: 'Stone Miner', baseCost: 100, baseIncome: 5, icon: '⛏️' },
            { id: 'drill', name: 'Steam Drill', baseCost: 1100, baseIncome: 18, icon: '⚙️' },
            { id: 'factory', name: 'Gold Factory', baseCost: 12000, baseIncome: 65, icon: '🏭' },
            { id: 'bank', name: 'Crypto Bank', baseCost: 130000, baseIncome: 250, icon: '🏦' },
            { id: 'ai', name: 'AI Overlord', baseCost: 1400000, baseIncome: 1200, icon: '🤖' }
        ];

        // Plants have growth stages. Income is per second ONLY when fully grown.
        const FARM_CATALOG = {
            plants: [
                { id: 'wheat', name: 'Wheat', cost: 100, icon: '🌾', scale: 1.0, growthTime: 5, yield: 2 },
                { id: 'carrot', name: 'Carrot', cost: 500, icon: '🥕', scale: 0.8, growthTime: 10, yield: 8 },
                { id: 'rose', name: 'Magic Rose', cost: 2500, icon: '🌹', scale: 1.0, growthTime: 20, yield: 25 },
                { id: 'sunflower', name: 'Solar Flower', cost: 8000, icon: '🌻', scale: 1.2, growthTime: 45, yield: 60 },
                { id: 'tree', name: 'Money Tree', cost: 25000, icon: '🌳', scale: 2.5, growthTime: 90, yield: 150 },
                { id: 'pumpkin', name: 'Giant Pumpkin', cost: 75000, icon: '🎃', scale: 1.8, growthTime: 180, yield: 400 }
            ],
            buildings: [
                { id: 'fence', name: 'Fence', cost: 500, icon: '🪵', scale: 1.0, decor: true },
                { id: 'rock', name: 'Big Rock', cost: 1000, icon: '🪨', scale: 1.2, decor: true },
                { id: 'dog', name: 'Guard Dog', cost: 15000, icon: '🐕', scale: 1.0, decor: true },
                { id: 'scarecrow', name: 'Scarecrow', cost: 20000, icon: '🎎', scale: 1.5, decor: true },
                { id: 'tractor', name: 'Tractor', cost: 120000, icon: '🚜', scale: 2.5, decor: true },
                { id: 'barn', name: 'Red Barn', cost: 500000, icon: '🏠', scale: 4.0, decor: true }
            ]
        };

        /**
         * AUDIO SYSTEM
         */
        const AudioSys = {
            bgm: null,
            sfx: {},
            muted: false,
            ready: false,
            lastPlayed: {},
            sfxVolumes: {
                click: 0.22,
                buy: 0.36,
                pop: 0.24,
                grow: 0.3,
                blocked: 0.3,
                uiOpen: 0.24,
                uiClose: 0.22,
                start: 0.38
            },
            init() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }
            },
            unlock() {
                this.ready = true;
            },
            playBGM() {
                if (this.muted || !this.ready || !this.bgm) return;
                this.bgm.play().catch(() => {});
            },
            pauseBGM() {
                if (this.bgm) this.bgm.pause();
            },
            playSFX(key, minInterval = 90) {
                if (this.muted || !this.ready || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayed[key] && now - this.lastPlayed[key] < minInterval) return;
                this.lastPlayed[key] = now;
                const sound = this.sfx[key].cloneNode();
                sound.volume = this.sfxVolumes[key] ?? 0.3;
                sound.play().catch(() => {});
            },
            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) this.pauseBGM();
                else this.playBGM();
                return this.muted;
            }
        };

        /**
         * GAME STATE
         */
        const Game = {
            active: false,
            mode: 'clicker', // 'clicker' or 'farm'
            lastTime: 0,
            
            // Economy
            gold: 0,
            lifetimeGold: 0,
            
            // Clicker Progression
            clickUpgrades: 0,
            buildings: {},
            
            // Farm Progression
            // Item: { uid, id, x, y, icon, scale, type, stage, maxStage, growthTimer, maxGrowthTime, yield, isDecor }
            farmItems: [], 
            
            // Visuals
            era: 0,
            clickScale: 1.0,
            particles: [],

            init() {
                CLICKER_BUILDINGS.forEach(b => {
                    if (typeof this.buildings[b.id] === 'undefined') this.buildings[b.id] = 0;
                });
                this.load();
            },

            getClickerIncome() {
                let base = 0;
                CLICKER_BUILDINGS.forEach(b => {
                    base += (this.buildings[b.id] || 0) * b.baseIncome;
                });
                return base;
            },

            getFarmIncome() {
                let income = 0;
                this.farmItems.forEach(item => {
                    if (!item.isDecor && item.stage === item.maxStage) {
                        income += (item.yield || 0);
                    }
                });
                return income;
            },

            getTotalIncome() {
                return this.getClickerIncome() + this.getFarmIncome();
            },

            getClickPower() {
                let base = 1 + (this.clickUpgrades * 1.5);
                const totalBuildings = Object.values(this.buildings).reduce((a, b) => a + b, 0);
                base += Math.floor(totalBuildings / 10);
                return base;
            },

            getBuildingCost(id) {
                const b = CLICKER_BUILDINGS.find(x => x.id === id);
                return Math.floor(b.baseCost * Math.pow(1.15, this.buildings[id]));
            },

            getClickUpgradeCost() {
                return Math.floor(25 * Math.pow(1.6, this.clickUpgrades));
            },

            buyFarmItem(item) {
                if (this.gold >= item.cost) {
                    this.gold -= item.cost;
                    // Place randomly in center area
                    const x = (Renderer.width / 2) + (Math.random() - 0.5) * 200;
                    const y = (Renderer.height / 2) + (Math.random() - 0.5) * 200;
                    
                    const newItem = {
                        uid: Date.now() + Math.random(),
                        id: item.id,
                        icon: item.icon,
                        scale: item.scale,
                        x: x,
                        y: y,
                        isDecor: !!item.decor
                    };

                    if (!newItem.isDecor) {
                        // Plant logic
                        newItem.stage = 0; // 0=Seed, 1=Sprout, 2=Young, 3=Mature
                        newItem.maxStage = 3;
                        newItem.growthTimer = 0; // Seconds accumulated
                        newItem.maxGrowthTime = item.growthTime || 10; // Seconds per stage
                        newItem.yield = item.yield || 0;
                    }

                    this.farmItems.push(newItem);
                    
                    AudioSys.playSFX('buy');
                    UI.showGif('farm', 1100);
                    this.save();
                    return true;
                }
                AudioSys.playSFX('blocked', 180);
                return false;
            },

            updateFarm(dt) {
                let grew = false;
                this.farmItems.forEach(item => {
                    if (!item.isDecor && item.stage < item.maxStage) {
                        item.growthTimer += dt;
                        const timePerStage = item.maxGrowthTime / item.maxStage;
                        
                        if (item.growthTimer >= timePerStage * (item.stage + 1)) {
                            item.stage++;
                            grew = true;
                            // Visual pop
                            Game.particles.push({
                                x: item.x, y: item.y, vx: 0, vy: -50,
                                life: 1.0, size: 5, color: '#84cc16'
                            });
                        }
                    }
                });
                if (grew) {
                    AudioSys.playSFX('grow', 260);
                    UI.showGif('farm', 900);
                }
            },

            save() {
                const data = {
                    gold: this.gold,
                    lifetimeGold: this.lifetimeGold,
                    buildings: this.buildings,
                    clickUpgrades: this.clickUpgrades,
                    farmItems: this.farmItems,
                    time: Date.now()
                };
                localStorage.setItem('epochFarm_v4', JSON.stringify(data));
            },

            load() {
                try {
                    const raw = localStorage.getItem('epochFarm_v4');
                    if (raw) {
                        const data = JSON.parse(raw);
                        this.gold = data.gold || 0;
                        this.lifetimeGold = data.lifetimeGold || 0;
                        this.clickUpgrades = data.clickUpgrades || 0;
                        if (data.buildings) this.buildings = { ...this.buildings, ...data.buildings };
                        if (data.farmItems) this.farmItems = data.farmItems;

                        // Offline Income Calculation
                        if (data.time) {
                            const seconds = (Date.now() - data.time) / 1000;
                            if (seconds > 60) {
                                // Simulate growth offline
                                this.farmItems.forEach(item => {
                                    if (!item.isDecor && item.stage < item.maxStage) {
                                        item.growthTimer += seconds;
                                        const timePerStage = item.maxGrowthTime / item.maxStage;
                                        const potentialStage = Math.floor(item.growthTimer / timePerStage);
                                        item.stage = Math.min(item.maxStage, potentialStage);
                                    }
                                });

                                const income = this.getTotalIncome() * seconds * 0.5; // 50% efficiency
                                if (income > 10) {
                                    this.gold += income;
                                    this.lifetimeGold += income;
                                    setTimeout(() => UI.spawnText(Renderer.width/2, Renderer.height/2, `Offline: +${UI.format(income)}`), 1000);
                                }
                            }
                        }
                    }
                } catch (e) { console.error(e); }
            }
        };

        /**
         * RENDERER
         */
        const Renderer = {
            canvas: document.getElementById('gameCanvas'),
            ctx: document.getElementById('gameCanvas').getContext('2d', { alpha: false }),
            width: 0,
            height: 0,

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            },

            draw() {
                if (Game.mode === 'clicker') this.drawClicker();
                else this.drawFarm();
            },

            drawClicker() {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;

                // Determine Era
                if (Game.lifetimeGold > 1000000) Game.era = 2;
                else if (Game.lifetimeGold > 5000) Game.era = 1;
                else Game.era = 0;

                // BG
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                if (Game.era === 0) { grad.addColorStop(0, '#163968'); grad.addColorStop(1, '#071526'); }
                else if (Game.era === 1) { grad.addColorStop(0, '#4c1d95'); grad.addColorStop(0.55, '#0f4c81'); grad.addColorStop(1, '#092033'); }
                else { grad.addColorStop(0, '#020617'); grad.addColorStop(0.5, '#0f2850'); grad.addColorStop(1, '#03111f'); }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                const t = Date.now() * 0.001;
                const cx = w / 2;
                const cy = h / 2 - 50;
                const size = 100 * Game.clickScale;

                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                for (let i = 0; i < 36; i++) {
                    const starX = (i * 137.5) % w;
                    const starY = ((i * 79.3) + t * 14) % h;
                    ctx.beginPath();
                    ctx.arc(starX, starY, (i % 3) + 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(cx, cy + 22);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 0, size * 1.05, size * 0.34, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Particles
                this.drawParticles(ctx);

                // Central Object: mascot-like chrono harvester
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(Math.sin(t * 2.6) * 0.04);
                ctx.shadowBlur = 28;
                ctx.shadowColor = Game.era === 2 ? 'rgba(34,211,238,0.65)' : 'rgba(251,191,36,0.4)';

                const bodyGrad = ctx.createLinearGradient(0, -size, 0, size);
                if (Game.era === 0) {
                    bodyGrad.addColorStop(0, '#fcd34d');
                    bodyGrad.addColorStop(1, '#f59e0b');
                } else if (Game.era === 1) {
                    bodyGrad.addColorStop(0, '#fb7185');
                    bodyGrad.addColorStop(1, '#f97316');
                } else {
                    bodyGrad.addColorStop(0, '#67e8f9');
                    bodyGrad.addColorStop(1, '#22d3ee');
                }

                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(-size * 0.58, -size * 0.72, size * 1.16, size * 1.34, size * 0.32);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.22)';
                ctx.beginPath();
                ctx.roundRect(-size * 0.46, -size * 0.58, size * 0.92, size * 0.28, size * 0.14);
                ctx.fill();

                ctx.fillStyle = '#082032';
                ctx.beginPath();
                ctx.arc(-size * 0.22, -size * 0.1, size * 0.12, 0, Math.PI * 2);
                ctx.arc(size * 0.22, -size * 0.1, size * 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-size * 0.18, -size * 0.14, size * 0.045, 0, Math.PI * 2);
                ctx.arc(size * 0.26, -size * 0.14, size * 0.045, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#082032';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-size * 0.22, size * 0.14);
                ctx.quadraticCurveTo(0, size * 0.34 + Math.sin(t * 5) * 3, size * 0.22, size * 0.14);
                ctx.stroke();

                ctx.strokeStyle = Game.era === 2 ? '#a5f3fc' : '#fef3c7';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(0, -size * 0.86, size * 0.38, Math.PI * 0.12, Math.PI * 0.88);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-size * 0.72, -size * 0.12);
                ctx.lineTo(-size * 0.98, size * 0.26);
                ctx.moveTo(size * 0.72, -size * 0.12);
                ctx.lineTo(size * 0.98, size * 0.26);
                ctx.stroke();

                ctx.fillStyle = Game.era === 0 ? '#65a30d' : Game.era === 1 ? '#22c55e' : '#22d3ee';
                ctx.beginPath();
                ctx.arc(-size * 0.98, size * 0.3, size * 0.12, 0, Math.PI * 2);
                ctx.arc(size * 0.98, size * 0.3, size * 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.cos(t * 1.8 + i * 2.1) * size * 1.28, Math.sin(t * 1.8 + i * 2.1) * size * 0.92, size * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            },

            drawFarm() {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;

                // Grass BG
                const farmGrad = ctx.createLinearGradient(0, 0, 0, h);
                farmGrad.addColorStop(0, '#dcfce7');
                farmGrad.addColorStop(0.58, '#86efac');
                farmGrad.addColorStop(1, '#3f6212');
                ctx.fillStyle = farmGrad;
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = 'rgba(255,255,255,0.24)';
                for (let i = 0; i < 6; i++) {
                    ctx.beginPath();
                    ctx.ellipse((i + 1) * (w / 7), 100 + Math.sin(Date.now() * 0.0006 + i) * 18, 68, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Grid Pattern
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 1;
                const gridSize = 60;
                ctx.beginPath();
                for(let x=0; x<w; x+=gridSize) { ctx.moveTo(x,0); ctx.lineTo(x,h); }
                for(let y=0; y<h; y+=gridSize) { ctx.moveTo(0,y); ctx.lineTo(w,y); }
                ctx.stroke();

                // Sort items by Y for depth
                Game.farmItems.sort((a, b) => a.y - b.y);

                // Draw Items
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                Game.farmItems.forEach(item => {
                    let displayIcon = item.icon;
                    let displayScale = item.scale;
                    let opacity = 1.0;

                    // Growth Logic Visuals
                    if (!item.isDecor) {
                        if (item.stage === 0) { displayIcon = '🌱'; displayScale = 0.8; }
                        else if (item.stage === 1) { displayIcon = '🌿'; displayScale = 1.0; }
                        else if (item.stage === 2) { displayScale = item.scale * 0.7; } // Young version
                        // Stage 3 is full size
                    }

                    const size = 30 * displayScale;
                    
                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(item.x, item.y + size/2, size, size*0.4, 0, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y - size * 0.12, size * 1.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Icon
                    ctx.font = `${size * 2}px serif`;
                    ctx.fillStyle = `rgba(0,0,0,${opacity})`;
                    ctx.fillText(displayIcon, item.x, item.y);

                    // Growth Bar
                    if (!item.isDecor && item.stage < item.maxStage) {
                        const barW = 40;
                        const barH = 6;
                        const timePerStage = item.maxGrowthTime / item.maxStage;
                        const progressInStage = (item.growthTimer % timePerStage) / timePerStage;
                        
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(item.x - barW/2, item.y - size - 15, barW, barH);
                        
                        ctx.fillStyle = '#84cc16';
                        ctx.fillRect(item.x - barW/2, item.y - size - 15, barW * progressInStage, barH);
                    }

                    // Income Indicator (Mature)
                    if (!item.isDecor && item.stage === item.maxStage) {
                        if (Math.floor(Date.now() / 1000) % 2 === 0) {
                            ctx.fillStyle = '#eab308';
                            ctx.font = '12px sans-serif';
                            ctx.fillText('💰', item.x + size/2, item.y - size);
                        }
                    }

                    // Selection highlight
                    if (Input.dragItem === item) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(item.x, item.y, size*1.5, 0, Math.PI*2);
                        ctx.stroke();
                    }
                });
            },

            drawParticles(ctx) {
                for (let i = Game.particles.length - 1; i >= 0; i--) {
                    const p = Game.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 2.0; // Gravity
                    p.life -= 0.02;
                    if (p.life <= 0) { Game.particles.splice(i, 1); continue; }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }
        };

        /**
         * UI MANAGER
         */
        const UI = {
            activeTab: 'plants',
            gifTimers: {},
            els: {
                clickerLayer: document.getElementById('ui-clicker'),
                farmLayer: document.getElementById('ui-farm'),
                shopPanel: document.getElementById('shop-panel'),
                shopList: document.getElementById('shop-list'),
                chevron: document.getElementById('chevron'),
                scoreDisplays: document.querySelectorAll('.score-display'),
                farmShopModal: document.getElementById('farm-shop-modal'),
                farmShopList: document.getElementById('farm-shop-list'),
                farmYield: document.getElementById('farm-yield'),
                clickFeedbackGif: document.getElementById('click-feedback-gif'),
                farmFeedbackGif: document.getElementById('farm-feedback-gif')
            },
            isShopOpen: false,

            format(num) {
                if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
                if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
                if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
                return Math.floor(num).toString();
            },

            spawnText(x, y, text) {
                const el = document.createElement('div');
                el.className = 'floating-text';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.innerText = text;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            },

            showGif(key, duration = 950) {
                const el = key === 'farm' ? this.els.farmFeedbackGif : this.els.clickFeedbackGif;
                if (!el) return;
                el.classList.add('is-visible');
                clearTimeout(this.gifTimers[key]);
                this.gifTimers[key] = setTimeout(() => el.classList.remove('is-visible'), duration);
            },

            toggleMode(mode) {
                const previousMode = Game.mode;
                Game.mode = mode;
                if (mode === 'farm') {
                    this.els.clickerLayer.classList.add('hidden', 'opacity-0');
                    this.els.farmLayer.classList.remove('hidden');
                    setTimeout(() => this.els.farmLayer.classList.remove('opacity-0'), 50);
                    if (previousMode !== mode) AudioSys.playSFX('uiOpen', 180);
                } else {
                    this.els.farmLayer.classList.add('opacity-0');
                    setTimeout(() => this.els.farmLayer.classList.add('hidden'), 500);
                    this.els.clickerLayer.classList.remove('hidden', 'opacity-0');
                    if (previousMode !== mode) AudioSys.playSFX('uiClose', 180);
                }
            },

            toggleClickerShop() {
                this.isShopOpen = !this.isShopOpen;
                if (this.isShopOpen) {
                    this.els.shopPanel.classList.replace('shop-closed', 'shop-open');
                    this.els.chevron.style.transform = 'rotate(180deg)';
                    AudioSys.playSFX('uiOpen', 180);
                } else {
                    this.els.shopPanel.classList.replace('shop-open', 'shop-closed');
                    this.els.chevron.style.transform = 'rotate(0deg)';
                    AudioSys.playSFX('uiClose', 180);
                }
            },

            toggleFarmShop(show) {
                if (show) {
                    this.els.farmShopModal.classList.remove('hidden');
                    setTimeout(() => this.els.farmShopModal.classList.add('modal-active'), 10);
                    this.renderFarmShop();
                    AudioSys.playSFX('uiOpen', 180);
                } else {
                    this.els.farmShopModal.classList.remove('modal-active');
                    setTimeout(() => this.els.farmShopModal.classList.add('hidden'), 200);
                    AudioSys.playSFX('uiClose', 180);
                }
            },

            switchFarmTab(tab) {
                this.activeTab = tab;
                const tabs = document.querySelectorAll('#farm-shop-modal button[onclick*="switchFarmTab"]');
                tabs.forEach(t => {
                    if (t.innerText.toLowerCase().includes(tab.includes('plants') ? 'seeds' : 'decor')) {
                        t.className = 'flex-1 py-2 rounded-lg font-bold text-sm tab-active transition';
                    } else {
                        t.className = 'flex-1 py-2 rounded-lg font-bold text-sm tab-inactive transition';
                    }
                });
                this.renderFarmShop();
            },

            renderClickerShop() {
                this.els.shopList.innerHTML = '';
                
                // Click Upgrade
                const clickCost = Game.getClickUpgradeCost();
                const canAfford = Game.gold >= clickCost;
                
                const div = document.createElement('div');
                div.className = `glass-panel p-3 rounded-xl flex justify-between items-center cursor-pointer active:scale-95 transition ${canAfford?'':'opacity-60'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-2xl bg-white/10 w-10 h-10 rounded-lg flex items-center justify-center">💪</div>
                        <div><div class="font-bold text-sm">Power Click</div><div class="text-xs text-gray-400">Lvl ${Game.clickUpgrades}</div></div>
                    </div>
                    <div class="text-right"><div class="font-bold text-sm ${canAfford?'text-yellow-400':'text-red-400'}">${this.format(clickCost)}</div></div>
                `;
                div.onclick = () => {
                    if (Game.gold >= clickCost) {
                        Game.gold -= clickCost;
                        Game.clickUpgrades++;
                        AudioSys.playSFX('buy');
                        this.showGif('click', 820);
                        this.renderClickerShop();
                    } else {
                        AudioSys.playSFX('blocked', 180);
                    }
                };
                this.els.shopList.appendChild(div);

                // Buildings
                CLICKER_BUILDINGS.forEach(b => {
                    const cost = Game.getBuildingCost(b.id);
                    const canBuy = Game.gold >= cost;
                    const el = document.createElement('div');
                    el.className = `glass-panel p-3 rounded-xl flex justify-between items-center cursor-pointer active:scale-95 transition ${canBuy?'':'opacity-60'}`;
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="text-2xl bg-white/10 w-10 h-10 rounded-lg flex items-center justify-center">${b.icon}</div>
                            <div><div class="font-bold text-sm">${b.name}</div><div class="text-xs text-gray-400">Owned: ${Game.buildings[b.id]}</div></div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm ${canBuy?'text-yellow-400':'text-red-400'}">${this.format(cost)}</div>
                            <div class="text-xs text-green-400">+${this.format(b.baseIncome)}/s</div>
                        </div>
                    `;
                    el.onclick = () => {
                        if (Game.gold >= cost) {
                            Game.gold -= cost;
                            Game.buildings[b.id]++;
                            AudioSys.playSFX('buy');
                            this.showGif('click', 820);
                            this.renderClickerShop();
                        } else {
                            AudioSys.playSFX('blocked', 180);
                        }
                    };
                    this.els.shopList.appendChild(el);
                });
            },

            renderFarmShop() {
                const list = this.els.farmShopList;
                list.innerHTML = '';
                const items = FARM_CATALOG[this.activeTab];

                items.forEach(item => {
                    const canAfford = Game.gold >= item.cost;
                    const isPlant = !item.decor;
                    const el = document.createElement('div');
                    el.className = `bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer active:scale-95 transition ${canAfford?'':'opacity-60 grayscale'}`;
                    
                    let subText = isPlant ? `Yield: ${item.yield}/s` : 'Decor';
                    let iconBg = isPlant ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700';

                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="text-2xl ${iconBg} w-10 h-10 rounded-lg flex items-center justify-center">${item.icon}</div>
                            <div>
                                <div class="font-bold text-sm text-slate-800">${item.name}</div>
                                <div class="text-xs text-slate-500 font-semibold">${subText}</div>
                            </div>
                        </div>
                        <div class="font-bold text-sm ${canAfford?'text-green-600':'text-red-400'}">${this.format(item.cost)} 💰</div>
                    `;
                    el.onclick = () => {
                        if (Game.buyFarmItem(item)) {
                            this.toggleFarmShop(false);
                            UI.spawnText(Renderer.width/2, Renderer.height/2, "Planted!");
                        }
                    };
                    list.appendChild(el);
                });
            },

            refresh() {
                this.els.scoreDisplays.forEach(el => el.innerText = this.format(Game.gold));
                const totalIncome = Game.getTotalIncome();
                document.getElementById('dps').innerText = this.format(totalIncome);
                this.els.farmYield.innerText = this.format(Game.getFarmIncome());
            }
        };

        /**
         * INPUT & DRAG SYSTEM
         */
        const Input = {
            dragItem: null,
            dragOffset: { x:0, y:0 },

            handleDown(e) {
                if (!Game.active) return;
                const rect = Renderer.canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

                if (Game.mode === 'clicker') {
                    // Clicker Logic
                    const cx = Renderer.width / 2;
                    const cy = Renderer.height / 2 - 50;
                    const dist = Math.sqrt((x-cx)**2 + (y-cy)**2);
                    if (dist < 150) {
                        e.preventDefault(); 
                        const power = Game.getClickPower();
                        Game.gold += power;
                        Game.lifetimeGold += power;
                        Game.clickScale = 0.9;
                        AudioSys.playSFX('click', 60);
                        UI.showGif('click', 650);
                        UI.spawnText(x + rect.left, y + rect.top - 50, "+" + UI.format(power));
                        
                        // Particles
                        const color = Game.era===2 ? '#00ffff' : (Game.era===1 ? '#fbbf24' : '#e2e8f0');
                        for(let i=0; i<4; i++) {
                            Game.particles.push({
                                x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                                life: 1.0, size: Math.random()*4+2, color: color
                            });
                        }
                    }
                } else {
                    // Farm Logic (Drag)
                    // Check collision with farm items (reverse order)
                    for (let i = Game.farmItems.length - 1; i >= 0; i--) {
                        const item = Game.farmItems[i];
                        const size = 30 * item.scale;
                        const dist = Math.sqrt((x - item.x)**2 + (y - item.y)**2);
                        if (dist < size * 1.5) {
                            e.preventDefault();
                            Input.dragItem = item;
                            Input.dragOffset.x = x - item.x;
                            Input.dragOffset.y = y - item.y;
                            AudioSys.playSFX('pop');
                            break;
                        }
                    }
                }
            },

            handleMove(e) {
                if (Game.mode === 'farm' && Input.dragItem) {
                    e.preventDefault();
                    const rect = Renderer.canvas.getBoundingClientRect();
                    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                    
                    Input.dragItem.x = x - Input.dragOffset.x;
                    Input.dragItem.y = y - Input.dragOffset.y;
                }
            },

            handleUp(e) {
                if (Input.dragItem) {
                    Input.dragItem = null;
                    Game.save();
                }
            }
        };

        /**
         * MAIN LOOP
         */
        function loop() {
            if (!Game.active) return;
            
            const now = Date.now();
            const dt = (now - Game.lastTime) / 1000;
            Game.lastTime = now;

            // Income (Clicker + Farm)
            const income = Game.getTotalIncome() * dt;
            if (income > 0) {
                Game.gold += income;
                Game.lifetimeGold += income;
            }

            // Update Farm Growth
            Game.updateFarm(dt);

            // Recovery
            if (Game.clickScale < 1.0) Game.clickScale += 3 * dt;
            if (Game.clickScale > 1.0) Game.clickScale = 1.0;

            Renderer.draw();
            UI.refresh();

            if (Math.floor(now / 1000) % 5 === 0) Game.save();
            requestAnimationFrame(loop);
        }

        /**
         * INITIALIZATION
         */
        window.addEventListener('load', () => {
            AudioSys.init();
            Game.init();
            Renderer.resize();
            window.addEventListener('resize', () => Renderer.resize());

            // Start
            document.getElementById('start-btn').addEventListener('click', () => {
                AudioSys.unlock();
                document.getElementById('start-screen').classList.add('hidden');
                AudioSys.playSFX('start', 250);
                AudioSys.playBGM();
                Game.active = true;
                Game.lastTime = Date.now();
                UI.renderClickerShop();
                loop();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) AudioSys.pauseBGM();
                else if (Game.active && !AudioSys.muted) AudioSys.playBGM();
            });

            // Canvas Inputs
            // [agent-note][stage4] repaired: mobile-actionability | element: body/canvas | action: gesture suppression scoped to gameplay surface so UI taps keep native click behavior
            const cvs = document.getElementById('gameCanvas');
            cvs.addEventListener('pointerdown', Input.handleDown);
            cvs.addEventListener('pointermove', Input.handleMove);
            cvs.addEventListener('pointerup', Input.handleUp);
            cvs.addEventListener('pointercancel', Input.handleUp);
            cvs.addEventListener('pointerleave', Input.handleUp);

            // Clicker UI Events
            document.getElementById('shop-toggle').addEventListener('click', () => UI.toggleClickerShop());
            document.getElementById('mute-btn').addEventListener('click', function() {
                this.innerText = AudioSys.toggleMute() ? '🔇' : '🔊';
            });
            document.getElementById('to-farm-btn').addEventListener('click', () => UI.toggleMode('farm'));

            // Farm UI Events
            document.getElementById('return-btn').addEventListener('click', () => UI.toggleMode('clicker'));
            document.getElementById('open-farm-shop').addEventListener('click', () => UI.toggleFarmShop(true));
            document.getElementById('close-farm-shop').addEventListener('click', () => UI.toggleFarmShop(false));
        });

    </script>
</body>
</html>
