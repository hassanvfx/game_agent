<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Run: OMEGA</title>
    <!-- [agent-note][stage4] repaired: font-remap | action: swapped required font candidates to approved catalog alternatives -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --theme-color: #00f2fe;
            --danger-color: #ff0055;
            --bg-color: #000;
            --ui-white: rgba(255, 255, 255, 0.96);
            --ui-muted: rgba(255, 255, 255, 0.7);
            --panel-bg: rgba(6, 14, 34, 0.58);
            --panel-border: rgba(126, 234, 255, 0.32);
            --panel-shadow: rgba(0, 242, 254, 0.18);
            --gold-accent: #ffe27a;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 242, 254, 0.08), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 0, 85, 0.08), transparent 28%),
                var(--bg-color);
            color: var(--ui-white);
            font-family: 'Rajdhani', system-ui, sans-serif;
            touch-action: auto;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: relative;
        }

        /* [agent-note][stage4] repaired: mobile-action-path | action: keep native taps on UI, limit gesture suppression to game surface */
        #game-container,
        canvas {
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hud-text {
            text-shadow: 0 0 10px currentColor;
        }

        .panel-chip {
            padding: 12px 14px 10px;
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(12, 28, 57, 0.82), rgba(5, 12, 28, 0.55)),
                var(--panel-bg);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.06),
                0 0 18px var(--panel-shadow);
            backdrop-filter: blur(8px);
        }

        .glitch {
            animation: glitch 0.2s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .scanline {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.28) 50%, rgba(0,0,0,0.28)),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03), transparent 32%, rgba(255, 0, 85, 0.03));
            background-size: 100% 3px, 100% 100%;
            opacity: 0.92;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 11;
            background: radial-gradient(circle, transparent 38%, rgba(0, 0, 0, 0.2) 62%, rgba(0, 0, 0, 0.9) 100%);
        }

        .hidden {
            display: none !important;
        }

        #media-overlay {
            position: absolute;
            inset: 0;
            z-index: 24;
            pointer-events: none;
        }

        .feedback-gif {
            position: absolute;
            right: 18px;
            width: clamp(84px, 18vw, 140px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(9, 18, 36, 0.42);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.24s ease, transform 0.24s ease;
            object-fit: cover;
        }

        .feedback-gif.show {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #gif-surge {
            top: max(96px, env(safe-area-inset-top) + 72px);
        }

        #gif-overdrive {
            bottom: max(84px, env(safe-area-inset-bottom) + 68px);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.12), transparent 28%),
                linear-gradient(180deg, #060913 0%, #020307 48%, #070111 100%);
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 226, 122, 0.15), transparent 18%),
                radial-gradient(circle at 80% 28%, rgba(0, 242, 254, 0.14), transparent 20%),
                radial-gradient(circle at 50% 76%, rgba(255, 0, 85, 0.1), transparent 24%);
            opacity: 0.9;
        }

        #game-container::after {
            background:
                linear-gradient(135deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 18px),
                linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 18px);
            background-size: 18px 18px;
            mix-blend-mode: screen;
            opacity: 0.08;
        }

        #hud {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
            padding-top: 8px;
        }

        .hud-label {
            font-size: 0.72rem;
            letter-spacing: 0.24em;
            opacity: 0.82;
            color: rgba(214, 247, 255, 0.92);
            text-transform: uppercase;
        }

        #score-disp {
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 0.95;
            font-weight: 600;
            color: var(--theme-color);
            font-family: 'Audiowide', system-ui, sans-serif;
            text-shadow: 0 0 18px rgba(0, 242, 254, 0.42);
        }

        .thrust-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .thrust-bar-shell {
            height: 6px;

            overflow: hidden;
            transform: skewX(12deg);
            border-radius: 999px;

        #thrust-bar {
            height: 100%;

        .hud-right {

        #speed-disp {
            font-size: clamp(1.75rem, 4.5vw, 3rem);

            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.04em;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
        }

        #mach-disp {
            font-size: clamp(1.15rem, 3vw, 1.5rem);
            font-weight: 600;
            color: var(--danger-color);
            opacity: 0;
            margin-top: 6px;
            letter-spacing: 0.08em;
        }

        #warning-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(100%, 700px);
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #warning-msg-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 400;
            font-style: normal;
            line-height: 0.9;
            letter-spacing: 0.02em;

        .hud-bottom {

        #prompt {

            background:
                radial-gradient(circle at 50% 28%, rgba(0, 242, 254, 0.12), transparent 24%),

            backdrop-filter: blur(8px);

        }

        #title {
            margin: 0;
            font-size: clamp(3.2rem, 12vw, 8rem);
            font-weight: 400;
            font-style: normal;
            letter-spacing: 0.02em;
            line-height: 0.9;
            color: #fff;
            font-family: 'Audiowide', system-ui, sans-serif;
            text-shadow:
                0 0 30px rgba(0, 242, 254, 0.55),

        #subtitle {

            margin: 0 0 32px;

            padding: 14px 16px;
            border: 1px solid rgba(126, 234, 255, 0.18);
            border-radius: 18px;

            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);

        #btn-start {
            position: relative;
            padding: 18px 36px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(0, 242, 254, 0.16), rgba(255, 0, 85, 0.12));
            color: #fff;
            font-family: "Audiowide", system-ui, sans-serif;
            font-size: clamp(1.05rem, 3.8vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            overflow: hidden;
            cursor: pointer;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 24px rgba(0, 242, 254, 0.18);
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        #btn-start:hover {
            background: linear-gradient(180deg, rgba(0, 242, 254, 0.24), rgba(255, 0, 85, 0.18));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                0 0 28px rgba(0, 242, 254, 0.24);
        }

        #btn-start:active {
            transform: scale(0.95);
        }

        @media (max-width: 720px) {
            #hud {
                padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            }

            .hud-top {
                gap: 16px;
            }

            .panel-chip {
                padding: 10px 12px 9px;
                border-radius: 16px;
            }

            .hud-label {
                font-size: 0.62rem;
            }

            #prompt {
                letter-spacing: 0.22em;
            }

            #subtitle {
                letter-spacing: 0.24em;
            }

            #instructions {
                padding: 12px 14px;
            }

            #btn-start {
                width: min(100%, 280px);
                padding: 16px 24px;
            }

            .feedback-gif {
                right: 12px;
                width: clamp(72px, 22vw, 108px);
            }

            #gif-surge {
                top: max(84px, env(safe-area-inset-top) + 60px);
            }

            #gif-overdrive {
                bottom: max(72px, env(safe-area-inset-bottom) + 62px);
            }
        }
    </style>

    <script id="game-config" type="application/x-game-config">

</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm + ui + layer + warning -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_start" data-editable="audio" data-label="Start SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<audio id="sfx_boost" data-editable="audio" data-label="Boost SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="scanline"></div>
    <div class="vignette"></div>
    <!-- [agent-note][stage3] resolved-gif: surge + overdrive feedback overlays -> catalogs/gifs.json -->
    <div id="media-overlay" aria-hidden="true">
        <img
            id="gif-surge"
            class="feedback-gif"
            alt=""
            src="https://i.giphy.com/I4OBmAtUfI5MBOiSV5.webp"
            data-fallback="https://i.giphy.com/I4OBmAtUfI5MBOiSV5.gif"
        >
        <img
            id="gif-overdrive"
            class="feedback-gif"
            alt=""
            src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp"
            data-fallback="https://i.giphy.com/8Adr5r4FEMTqj5tU23.gif"
        >
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <div class="hud-top">
            <div class="panel-chip">
                <div class="hud-label">Signal Height</div>
                <div id="score-disp" class="hud-text">0</div>
                <div class="thrust-wrap">
                    <div class="thrust-bar-shell">
                        <div id="thrust-bar"></div>
                    </div>
                </div>
            </div>
            <div class="hud-right panel-chip">
                <div class="hud-label">Boost Rate</div>
                <div id="speed-disp">0</div>
                <div id="mach-disp">LOW BAND</div>
            </div>
        </div>

        <div id="warning-msg" class="hidden">
            <div id="warning-msg-text">SIGNAL<br>SURGE</div>
        </div>

        <div class="hud-bottom">
            <div id="prompt">Hold to Boost</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1 id="title">SIGNAL<br>OMEGA</h1>
        <div id="subtitle">Keep the transmission rising</div>
        <p id="instructions">Hold anywhere to boost the relay upward. Release to let the signal drift and watch each new band light up.</p>
        <button id="btn-start">Start Run</button>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * §1 CONFIG & STATE
 * ------------------------------------------------------------------
 */
const CONFIG = {
    warpPower: 1.02, // Multiplier per frame
    drag: 0.95,
    layers: [
        { h: 0, name: "GROUND BAND", color: "#87CEEB" },
        { h: 1e4, name: "CLOUD BAND", color: "#000044" },
        { h: 1e7, name: "SOLAR BAND", color: "#110022" },
        { h: 1e10, name: "DEEP BAND", color: "#4B0082" },
        { h: 1e15, name: "PULSE BAND", color: "#FF0055" },
        { h: 1e25, name: "VOID BAND", color: "#00FF00" },
        { h: 1e40, name: "NEXUS BAND", color: "#FFFFFF" },
        { h: 1e60, name: "OMEGA BAND", color: "#00f2fe" }
    ]
};

const STATE = {
    playing: false,
    touching: false,
    altitude: 0,
    velocity: 0,
    layerIdx: 0,
    shake: 0,
    lastTime: 0,
    particles: [],
    tunnels: [],
    colorOffset: 0,
    flash: 0
};

// Config Protocol
window.gameConfigDefs = {
    "warpPower": { "type": "number", "label": "Warp Power", "value": 1.02, "min": 1.001, "max": 1.1 },
    "themeColor": { "type": "color", "label": "Theme Color", "value": "#00f2fe" },
    "shakeIntensity": { "type": "number", "label": "Shake FX", "value": 1.0, "min": 0.0, "max": 2.0 }
};
window.gameConfig = { warpPower: 1.02, themeColor: "#00f2fe", shakeIntensity: 1.0 };

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'warpPower') CONFIG.warpPower = val;
        if (key === 'themeColor') document.documentElement.style.setProperty('--theme-color', val);
    }
};

/**
 * ------------------------------------------------------------------
 * §2 AUDIO SYSTEM
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    bgm: null,
    sfxStart: null,
    sfxBreach: null,
    sfxWarning: null,
    sfxBoost: null,
    osc: null,
    gainNode: null,
    unlocked: false,
    lastBoostAt: 0,
    lastWarningAt: 0,
    lastBreachAt: 0,

    init() {
        this.bgm = document.getElementById('bgm_main');
        this.sfxStart = document.getElementById('sfx_start');
        this.sfxBreach = document.getElementById('sfx_breach');
        this.sfxWarning = document.getElementById('sfx_warning');
        this.sfxBoost = document.getElementById('sfx_boost');

        if (this.bgm) {
            this.bgm.volume = 0.22;
            this.bgm.playbackRate = 1;
        }
        if (this.sfxStart) this.sfxStart.volume = 0.45;
        if (this.sfxBreach) this.sfxBreach.volume = 0.42;
        if (this.sfxWarning) this.sfxWarning.volume = 0.32;
        if (this.sfxBoost) this.sfxBoost.volume = 0.24;
    },

    unlock() {
        if (this.unlocked) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!this.ctx) this.ctx = new AudioContext();

        this.ctx.resume().then(() => {
            this.unlocked = true;
            if (this.bgm && STATE.playing) this.bgm.play().catch(() => {});

            // Create Engine Rumble
            this.osc = this.ctx.createOscillator();
            this.gainNode = this.ctx.createGain();
            this.osc.type = 'sawtooth';
            this.osc.frequency.value = 50;
            this.gainNode.gain.value = 0;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 200;

            this.osc.connect(filter);
            filter.connect(this.gainNode);
            this.gainNode.connect(this.ctx.destination);
            this.osc.start();
        }).catch(() => {});
    },

    playClip(clip, reset = true) {
        if (!this.unlocked || !clip) return;
        if (reset) clip.currentTime = 0;
        clip.play().catch(() => {});
    },

    playStart() {
        this.playClip(this.sfxStart);
    },

    playBreach() {
        if (performance.now() - this.lastBreachAt < 220) return;
        this.lastBreachAt = performance.now();
        this.playClip(this.sfxBreach);
    },

    playWarning() {
        if (performance.now() - this.lastWarningAt < 1800) return;
        this.lastWarningAt = performance.now();
        this.playClip(this.sfxWarning);
    },

    playBoost() {
        if (performance.now() - this.lastBoostAt < 300) return;
        this.lastBoostAt = performance.now();
        this.playClip(this.sfxBoost);
    },

    updateEngine(speedRatio) {
        if (!this.unlocked || !this.gainNode || !this.ctx || !this.osc) return;
        const vol = Math.min(0.22, speedRatio * 0.22);
        this.gainNode.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);

        const freq = 50 + Math.min(200, speedRatio * 100);
        this.osc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);

        if (this.bgm) {
            const rate = 1.0 + Math.min(0.35, speedRatio * 0.25);
            this.bgm.playbackRate = rate;
            this.bgm.volume = 0.16 + speedRatio * 0.1;
        }
    }
};

/**
 * ------------------------------------------------------------------
 * §3 RENDERER & PARTICLES
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const gifSurge = document.getElementById('gif-surge');
const gifOverdrive = document.getElementById('gif-overdrive');
let W, H;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
}

function initParticles() {
    STATE.particles = [];
    for (let i = 0; i < 200; i++) {
        STATE.particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            z: Math.random() * 2 + 0.5,
            size: Math.random() * 2 + 1,
            color: Math.random() > 0.5 ? '#fff' : 'rgba(200,255,255,0.5)'
        });
    }
    STATE.tunnels = [];
    for (let i = 0; i < 10; i++) {
        STATE.tunnels.push({ r: i * 100, speed: Math.random() * 2 + 1 });
    }
}

/**
 * ------------------------------------------------------------------
 * §4 GAME LOOP
 * ------------------------------------------------------------------
 */
function loop(timestamp) {
    if (!STATE.playing) return;
    const dt = Math.min((timestamp - STATE.lastTime) / 1000, 0.1);
    STATE.lastTime = timestamp;

    update(dt);
    draw(dt);
    requestAnimationFrame(loop);
}

function update(dt) {
    if (STATE.touching) {
        if (STATE.velocity < 10) STATE.velocity = 10;
        STATE.velocity *= Math.pow(CONFIG.warpPower, dt * 60);
        if (STATE.velocity > 75) AudioSys.playBoost();
    } else {
        STATE.velocity *= Math.pow(CONFIG.drag, dt * 60);
    }

    if (STATE.velocity < 0.1) STATE.velocity = 0;
    STATE.altitude += STATE.velocity * dt;

    checkLayer();

    if (STATE.velocity > 1000) {
        const chaos = Math.log10(STATE.velocity) * window.gameConfig.shakeIntensity;
        STATE.shake = Math.min(20, chaos);
    } else {
        STATE.shake *= 0.9;
    }

    const speedRatio = Math.min(1, Math.log10(STATE.velocity + 1) / 20);
    AudioSys.updateEngine(speedRatio);

    if (STATE.velocity > 1e15) {
        AudioSys.playWarning();
    }

    if (STATE.flash > 0) STATE.flash -= dt * 2;
}

function checkLayer() {
    let newIdx = 0;
    for (let i = 0; i < CONFIG.layers.length; i++) {
        if (STATE.altitude >= CONFIG.layers[i].h) newIdx = i;
    }

    if (newIdx !== STATE.layerIdx) {
        STATE.layerIdx = newIdx;
        STATE.shake = 40;
        STATE.flash = 1;
        AudioSys.playBreach();

        const hud = document.getElementById('hud');
        hud.classList.add('glitch');
        setTimeout(() => hud.classList.remove('glitch'), 500);
    }
}

function formatNum(n) {
    if (n < 10000) return Math.floor(n).toLocaleString();
    const s = ["", "k", "M", "B", "T", "Qd", "Qn", "Sx", "Sp", "Oc", "No", "Dc", "UD", "DD", "TD", "Omega"];
    const e = Math.floor(Math.log10(n) / 3);
    if (e >= s.length) return "∞";
    return (n / Math.pow(1000, e)).toFixed(2) + s[e];
}

/**
 * ------------------------------------------------------------------
 * §5 DRAWING
 * ------------------------------------------------------------------
 */
function draw(dt) {
    let dx = (Math.random() - 0.5) * STATE.shake;
    let dy = (Math.random() - 0.5) * STATE.shake;

    const zoom = 1 + Math.min(0.1, STATE.velocity / 1e15);

    ctx.save();
    ctx.translate(W / 2 + dx, H / 2 + dy);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -H / 2);

    const layer = CONFIG.layers[STATE.layerIdx];
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    const speedAlpha = Math.min(0.6, Math.log10(STATE.velocity + 1) / 30);
    ctx.fillStyle = layer.color;
    ctx.globalAlpha = speedAlpha * 0.3;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1.0;

    drawTunnel(dt);
    drawParticles(dt);
    drawPlayer();

    if (STATE.flash > 0) {
        ctx.fillStyle = "#fff";
        ctx.globalAlpha = STATE.flash;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();

    updateHUD();
}

function drawTunnel(dt) {
    if (STATE.velocity < 1000) return;

    ctx.strokeStyle = window.gameConfig.themeColor;
    ctx.lineWidth = 2;
    const cx = W / 2;
    const cy = H / 2;

    STATE.tunnels.forEach(t => {
        t.r += (STATE.velocity * 0.001 + 50) * dt;
        if (t.r > Math.max(W, H)) t.r = 0;

        const alpha = Math.max(0, 1 - t.r / (W * 0.6));
        ctx.globalAlpha = alpha * 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, t.r, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;
}

function drawParticles(dt) {
    const warp = Math.min(H, STATE.velocity * 0.05);
    const speedScale = 100 + STATE.velocity * 0.1;

    ctx.lineWidth = Math.min(4, 1 + STATE.velocity / 1e6);

    STATE.particles.forEach(p => {
        p.y += speedScale * p.z * dt;
        if (p.y > H + warp) {
            p.y = -warp;
            p.x = Math.random() * W;
            p.z = Math.random() * 2 + 0.5;
        }

        const tailY = p.y - (p.size + warp * p.z);

        let col = p.color;
        if (STATE.velocity > 1e9) col = '#00f2fe';
        if (STATE.velocity > 1e15) col = '#ff0055';
        if (STATE.velocity > 1e25) col = '#fff';

        ctx.strokeStyle = col;
        ctx.fillStyle = col;

        if (warp > 10) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x, tailY);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawPlayer() {
    const cx = W / 2;
    const cy = H * 0.75;
    const pulse = 0.88 + Math.sin(performance.now() * 0.008) * 0.05;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, 1 + (pulse - 0.9) * 0.35);

    if (STATE.velocity > 1000) {
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.lineTo(52, 102);
        ctx.lineTo(-52, 102);
        ctx.closePath();

        const shieldOpacity = 0.18 + Math.random() * 0.08;
        ctx.fillStyle = `rgba(0, 242, 254, ${shieldOpacity})`;
        ctx.fill();
    }

    ctx.fillStyle = "rgba(0, 242, 254, 0.18)";
    ctx.beginPath();
    ctx.ellipse(0, 2, 28, 46, 0, 0, Math.PI * 2);
    ctx.fill();

    const hullGradient = ctx.createLinearGradient(0, -42, 0, 30);
    hullGradient.addColorStop(0, "#ffffff");
    hullGradient.addColorStop(0.48, "#b8f6ff");
    hullGradient.addColorStop(1, "#4ad7ff");
    ctx.fillStyle = hullGradient;
    ctx.beginPath();
    ctx.moveTo(0, -42);
    ctx.lineTo(18, -6);
    ctx.lineTo(16, 20);
    ctx.lineTo(7, 26);
    ctx.lineTo(0, 14);
    ctx.lineTo(-7, 26);
    ctx.lineTo(-16, 20);
    ctx.lineTo(-18, -6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#07111f";
    ctx.beginPath();
    ctx.moveTo(0, -23);
    ctx.lineTo(8, -2);
    ctx.lineTo(0, 8);
    ctx.lineTo(-8, -2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffe27a";
    ctx.beginPath();
    ctx.arc(0, -6, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.beginPath();
    ctx.moveTo(-4, -25);
    ctx.lineTo(0, -36);
    ctx.lineTo(4, -25);
    ctx.closePath();
    ctx.fill();

    if (STATE.touching || STATE.velocity > 100) {
        const flameLen = 40 + Math.min(200, Math.log10(STATE.velocity + 1) * 30) + Math.random() * 20;

        ctx.fillStyle = "rgba(255,255,255,0.96)";
        ctx.beginPath();
        ctx.moveTo(-5, 20);
        ctx.lineTo(0, 20 + flameLen * 0.58);
        ctx.lineTo(5, 20);
        ctx.fill();

        const flameGradient = ctx.createLinearGradient(0, 20, 0, 20 + flameLen);
        flameGradient.addColorStop(0, "#fff7d1");
        flameGradient.addColorStop(0.45, window.gameConfig.themeColor);
        flameGradient.addColorStop(1, STATE.velocity > 1e12 ? "#ff0055" : "#7a52ff");
        ctx.fillStyle = flameGradient;
        ctx.globalAlpha = 0.84;
        ctx.beginPath();
        ctx.moveTo(-11, 20);
        ctx.lineTo(0, 20 + flameLen);
        ctx.lineTo(11, 20);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function setGifState(node, active) {
    if (!node) return;
    node.classList.toggle('show', active);
}

[gifSurge, gifOverdrive].forEach((gifNode) => {
    if (!gifNode) return;
    gifNode.addEventListener('error', () => {
        const fallback = gifNode.dataset.fallback;
        if (fallback && gifNode.src !== fallback) {
            gifNode.src = fallback;
        } else {
            gifNode.classList.remove('show');
        }
    });
});

function updateHUD() {
    document.getElementById('score-disp').innerText = formatNum(STATE.altitude) + " m";
    document.getElementById('speed-disp').innerText = formatNum(STATE.velocity) + " u/s";

    const barPct = Math.min(100, (Math.log10(STATE.velocity + 1) / 30) * 100);
    document.getElementById('thrust-bar').style.width = barPct + '%';

    const machDiv = document.getElementById('mach-disp');
    const c = 299792458;

    if (STATE.velocity > c) {
        machDiv.style.opacity = 1;
        machDiv.style.color = '#00f2fe';
        const cMult = STATE.velocity / c;
        machDiv.innerText = formatNum(cMult) + " c";
        machDiv.classList.add('glitch');
    } else if (STATE.velocity > 343) {
        machDiv.style.opacity = 1;
        machDiv.style.color = '#ff0055';
        machDiv.innerText = "BAND " + formatNum(STATE.velocity / 343);
        machDiv.classList.remove('glitch');
    } else {
        machDiv.style.opacity = 0;
    }

    const warn = document.getElementById('warning-msg');
    if (STATE.velocity > 1e15) {
        warn.classList.remove('hidden');
        warn.classList.add('glitch');
    } else {
        warn.classList.add('hidden');
    }

    document.getElementById('prompt').style.opacity = STATE.touching ? 0 : 0.8;

    setGifState(gifSurge, STATE.flash > 0.15 || STATE.layerIdx >= 3);
    setGifState(gifOverdrive, STATE.velocity > 1e15);
}

/**
 * ------------------------------------------------------------------
 * §6 INPUT
 * ------------------------------------------------------------------
 */
const container = document.getElementById('game-container');

function onPointerDown(e) {
    if (e.target.id === 'btn-start') return;
    e.preventDefault();
    STATE.touching = true;
    AudioSys.unlock();
}

function onPointerUp(e) {
    e.preventDefault();
    STATE.touching = false;
}

container.addEventListener('pointerdown', onPointerDown, { passive: false });
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

document.getElementById('btn-start').addEventListener('click', () => {
    AudioSys.unlock();
    AudioSys.playStart();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    STATE.playing = true;
    STATE.lastTime = performance.now();
    if (AudioSys.bgm) AudioSys.bgm.play().catch(() => {});
    resize();
    requestAnimationFrame(loop);
});

window.addEventListener('DOMContentLoaded', () => {
    resize();
    AudioSys.init();
    window.addEventListener('resize', resize);
});
</script>
