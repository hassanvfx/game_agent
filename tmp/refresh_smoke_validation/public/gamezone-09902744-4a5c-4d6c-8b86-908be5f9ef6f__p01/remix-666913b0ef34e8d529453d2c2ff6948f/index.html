<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Dusty Clover and the Snack-Tab Shrine</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Bangers&display=swap");
    :root { --sky:#f7b56b; --dusk:#8c4a5f; --mesa:#7b3f29; --ink:#351c12; --paper:#f8dfaa; --sage:#4f8b59; --gold:#f7c65a; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#3a2418; color:var(--paper); font-family:"Cinzel", Georgia, serif; }
    #game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    #sceneMist { position:fixed; inset:0; pointer-events:none; overflow:hidden; background:radial-gradient(circle at 50% 18%, rgba(255,245,186,.22), transparent 28%), linear-gradient(180deg, rgba(255,220,128,.08), rgba(77,34,30,.18)); mix-blend-mode:screen; }
    #sceneMist::before, #sceneMist::after { content:""; position:absolute; inset:-10%; pointer-events:none; }
    #sceneMist::before { background:repeating-linear-gradient(90deg, transparent 0 54px, rgba(255,222,143,.08) 55px 57px), repeating-linear-gradient(0deg, transparent 0 44px, rgba(80,47,27,.09) 45px 47px); opacity:.55; transform:rotate(-2deg); animation:drift 14s linear infinite; }
    #sceneMist::after { background:radial-gradient(circle at 18% 72%, rgba(255,255,255,.22) 0 1px, transparent 3px), radial-gradient(circle at 64% 32%, rgba(255,255,255,.2) 0 1px, transparent 3px), radial-gradient(circle at 82% 78%, rgba(255,245,170,.18) 0 1px, transparent 3px); opacity:.8; animation:floatDust 9s ease-in-out infinite alternate; }
    @keyframes drift { from{ transform:translateX(0) rotate(-2deg);} to{ transform:translateX(-58px) rotate(-2deg);} }
    @keyframes floatDust { from{ transform:translateY(0);} to{ transform:translateY(-18px);} }
    .bark { position:absolute; left:100%; white-space:nowrap; font-family:"Bangers", cursive; font-size:clamp(20px, 5vw, 42px); letter-spacing:1px; color:#ffe4a3; text-shadow:0 3px 0 #5b241b, 0 0 14px rgba(255,222,143,.6); animation:barkFly linear forwards; user-select:none; }
    @keyframes barkFly { from{ transform:translateX(0) rotate(-2deg);} to{ transform:translateX(-145vw) rotate(2deg);} }
    #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 12px); transform:translateX(-50%); max-width:min(92vw,520px); background:linear-gradient(180deg, rgba(255,229,172,.96), rgba(208,142,79,.96)); color:#3b1d12; border:2px solid rgba(86,45,19,.65); border-radius:999px; padding:8px 15px; font-family:"Bangers", cursive; font-size:18px; letter-spacing:.04em; box-shadow:0 9px 20px rgba(48,20,11,.32); opacity:0; transition:opacity .22s; pointer-events:none; z-index:10; text-align:center; }
    #toast.show { opacity:1; }
    #startHint { position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); max-width:min(58vw,240px); font:700 12px "Cinzel", serif; color:#3b1d12; background:rgba(248,223,170,.92); border:2px solid rgba(86,45,19,.48); border-radius:14px; padding:9px 11px; pointer-events:none; z-index:8; box-shadow:0 8px 18px rgba(36,18,9,.28); }
    .charm { position:fixed; right:10px; width:min(26vw,104px); height:min(26vw,104px); border-radius:18px; border:2px solid rgba(92,50,24,.5); background:linear-gradient(145deg, rgba(250,218,136,.92), rgba(124,69,39,.92)); box-shadow:0 10px 22px rgba(0,0,0,.28); opacity:0; transform:scale(.85) translateY(10px); transition:opacity .18s, transform .18s; pointer-events:none; z-index:9; display:grid; place-items:center; font-size:44px; }
    .charm.show { opacity:.96; transform:scale(1) translateY(0); }
    #comboCharm { top:calc(env(safe-area-inset-top) + 78px); }
    #failCharm { bottom:calc(env(safe-area-inset-bottom) + 58px); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="sceneMist"></div>
  <div id="toast"></div>
  <div id="startHint">Tap the shrine board to wake the campfire tunes 🔊</div>
  <div id="comboCharm" class="charm" aria-hidden="true">✨</div>
  <div id="failCharm" class="charm" aria-hidden="true">🥾</div>
  <audio id="bgm" preload="auto" loop src="https://gamezone-virid.vercel.app/assets/audios/bgm/desert_bgm_01.mp3"></audio>
  <audio id="sfxSwap" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_character_01.mp3"></audio>
  <audio id="sfxCollect" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3"></audio>
  <audio id="sfxCombo" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_02.mp3"></audio>
  <audio id="sfxFail" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_defeat_01.mp3"></audio>
  <audio id="sfxGameOver" preload="auto" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_wind_01.mp3"></audio>
<script>
(() => {
  "use strict";
  const COLS = 6, ROWS = 8, GAME_SECONDS = 60, BASE_MATCH_SCORE = 100;
  const SWAP_TIME = 150, FALL_TIME = 180, SPAWN_TIME = 190, CLEAR_TIME = 110;
  const COMBO_TEXTS = ["Rupee Roundup!", "Canyon Tidy!", "Boot-Scoot Chain!", "Prairie Blessin'!", "Outlaw Order!", "Snack-Tab Settled!"];
  const RELICS = [
    { emoji:"🤠", label:"hat", base:"#b66a37", glow:"rgba(247,198,90,.42)", accent:"#ffe0a0", family:"outlaw" },
    { emoji:"💚", label:"heart", base:"#3f9a63", glow:"rgba(103,216,118,.42)", accent:"#d9ffd6", family:"zelda" },
    { emoji:"🧲", label:"shoe", base:"#7d8792", glow:"rgba(216,223,220,.34)", accent:"#f1f0df", family:"ranch" },
    { emoji:"🌵", label:"cactus", base:"#3d8f57", glow:"rgba(91,191,97,.34)", accent:"#d7ffc5", family:"canyon" },
    { emoji:"🥾", label:"boot", base:"#8d4a2b", glow:"rgba(191,101,45,.35)", accent:"#ffd09b", family:"outlaw" },
    { emoji:"🏺", label:"jar", base:"#d28a51", glow:"rgba(248,176,88,.36)", accent:"#fff1bf", family:"shrine" }
  ];
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d"), overlay = document.getElementById("sceneMist"), toast = document.getElementById("toast"), startHint = document.getElementById("startHint"), comboCharm = document.getElementById("comboCharm"), failCharm = document.getElementById("failCharm"), bgm = document.getElementById("bgm");
  const sfx = { swap:document.getElementById("sfxSwap"), collect:document.getElementById("sfxCollect"), combo:document.getElementById("sfxCombo"), fail:document.getElementById("sfxFail"), gameOver:document.getElementById("sfxGameOver") };
  let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)), W = 0, H = 0, boardX = 0, boardY = 0, tileSize = 0, hudH = 98;
  let audioCtx = null, sfxReady = false, soundUnlocked = false, seed = 0xC10A57;
  const state = { grid:[], selected:null, pointerDownCell:null, score:0, timeLeft:GAME_SECONDS, comboChain:0, lastTs:performance.now(), resolving:false, gameOver:false };
  function rng(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function randInt(max){ return Math.floor(rng() * max); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function showToast(msg, ms = 900){ toast.textContent = msg; toast.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove("show"), ms); }
  function flashCharm(el, glyph, ms = 1300){ if(!el) return; if(glyph) el.textContent = glyph; el.classList.add("show"); clearTimeout(el._hideTimer); el._hideTimer = setTimeout(() => el.classList.remove("show"), ms); }
  function spawnBark(text, combo = 1){ const el = document.createElement("div"); el.className = "bark"; el.textContent = text; const topMin = hudH + 10, topMax = H - 62; const y = Math.floor(lerp(topMin, topMax, rng())); const dur = clamp(5200 - combo * 280 + rng() * 700, 2800, 5600); el.style.top = `${y}px`; el.style.animationDuration = `${dur}ms`; overlay.appendChild(el); setTimeout(() => el.remove(), dur + 80); }
  function playSfx(name, volume = .5){ if(!soundUnlocked) return; const base = sfx[name]; if(!base) return; try{ const instance = base.cloneNode(); instance.volume = volume; instance.play().catch(()=>{}); }catch(_){} }
  function syncBgmState(){ if(!soundUnlocked) return; bgm.volume = .18; if(!state.gameOver) bgm.play().catch(()=>{}); }
  function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); sfxReady = true; if(!soundUnlocked){ soundUnlocked = true; syncBgmState(); playSfx("swap", .25); startHint.style.display = "none"; } }
  function blip(freq = 520, dur = .08, type = "triangle", gain = .025){ if(!sfxReady || !audioCtx) return; const t0 = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + .01); }
  function playEliminateSfx(chain = 0){ const base = 420 + chain * 42; playSfx("collect", .32); blip(base, .07, "triangle", .022); setTimeout(() => blip(base * 1.45, .06, "sine", .018), 45); }
  function playComboSfx(chain = 2){ playSfx("combo", .36); [600,760,910 + chain * 30].forEach((n,i)=>setTimeout(()=>blip(n,.09,"triangle",.024), i*55)); }
  function makeTile(type,row,col){ return { type,row,col,x:boardX + col * tileSize,y:boardY + row * tileSize,scale:1,alpha:1 }; }
  function resize(){ W = window.innerWidth; H = window.innerHeight; dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr); canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr,0,0,dpr,0,0); hudH = Math.max(94, Math.min(118, H * .14)); const usableH = H - hudH - 22; tileSize = Math.floor(Math.min((W - 24) / COLS, usableH / ROWS)); const boardW = tileSize * COLS, boardH = tileSize * ROWS; boardX = Math.floor((W - boardW) / 2); boardY = Math.floor(hudH + (usableH - boardH) / 2); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const t = state.grid[r] && state.grid[r][c]; if(t){ t.x = boardX + c * tileSize; t.y = boardY + r * tileSize; } } }
  function randomType(){ return randInt(RELICS.length); }
  function createsMatchAt(grid,row,col,type){ let count=1; for(let c=col-1;c>=0;c--){ const t=grid[row][c]; if(!t||t.type!==type) break; count++; } for(let c=col+1;c<COLS;c++){ const t=grid[row][c]; if(!t||t.type!==type) break; count++; } if(count>=3) return true; count=1; for(let r=row-1;r>=0;r--){ const t=grid[r][col]; if(!t||t.type!==type) break; count++; } for(let r=row+1;r<ROWS;r++){ const t=grid[r][col]; if(!t||t.type!==type) break; count++; } return count>=3; }
  function initBoard(){ state.grid = Array.from({length:ROWS},()=>Array(COLS).fill(null)); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ let t; do { t = randomType(); } while(createsMatchAt(state.grid,r,c,t)); state.grid[r][c] = makeTile(t,r,c); } }
  function drawRoundedRect(x,y,w,h,r){ const rr = Math.min(r,w*.5,h*.5); ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }
  function drawBackground(){ const sky = ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#f7b56b"); sky.addColorStop(.46,"#c86f59"); sky.addColorStop(1,"#3a2418"); ctx.fillStyle = sky; ctx.fillRect(0,0,W,H); ctx.fillStyle = "rgba(255,236,154,.76)"; ctx.beginPath(); ctx.arc(W*.78,H*.13,Math.max(42,W*.11),0,Math.PI*2); ctx.fill(); function mesa(y, color, amp){ ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,y); for(let x=0;x<=W;x+=W/8){ ctx.lineTo(x, y + Math.sin(x*.011 + 1.3)*amp + ((x/W>.58&&x/W<.74)?-amp*1.8:0)); } ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); } mesa(H*.48,"#824330",24); mesa(H*.58,"#5f3127",20); ctx.fillStyle="rgba(50,27,18,.72)"; for(let x=-20;x<W+40;x+=72){ ctx.fillRect(x,H*.72,8,H*.1); ctx.fillRect(x-12,H*.745,64,5); } for(let i=0;i<26;i++){ const x=(i*83 + (performance.now()*.012))%(W+90)-45, y=H*.18 + ((i*47)%Math.max(1,H*.62)); ctx.fillStyle = `rgba(255,229,163,${.08 + (i%5)*.025})`; ctx.beginPath(); ctx.arc(x,y,1.2 + (i%3),0,Math.PI*2); ctx.fill(); } }
  function drawDusty(){ const x = Math.max(50, boardX - Math.min(88, W*.2)), y = Math.min(H - 72, boardY + tileSize * 2.3), s = Math.max(28, Math.min(54, tileSize*.8)); ctx.save(); ctx.translate(x,y); ctx.shadowColor="rgba(0,0,0,.28)"; ctx.shadowBlur=12; ctx.fillStyle="#7b3f29"; drawRoundedRect(-s*.35,s*.18,s*.7,s*.8,10); ctx.fill(); ctx.fillStyle="#f1ba75"; ctx.beginPath(); ctx.arc(0,0,s*.33,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#4f8b59"; ctx.beginPath(); ctx.moveTo(-s*.24,s*.34); ctx.lineTo(s*.24,s*.34); ctx.lineTo(0,s*.58); ctx.closePath(); ctx.fill(); ctx.fillStyle="#6b3a22"; ctx.fillRect(-s*.5,-s*.32,s, s*.14); ctx.beginPath(); ctx.ellipse(0,-s*.4,s*.35,s*.18,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#2b160d"; ctx.fillRect(-s*.12,-s*.02,s*.08,s*.05); ctx.fillRect(s*.08,-s*.02,s*.08,s*.05); ctx.strokeStyle="#2b160d"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,s*.09,s*.13,0,Math.PI); ctx.stroke(); ctx.restore(); }
  function drawHUD(){ const pad=12, barW=W-pad*2, scoreH=30, timerH=18; ctx.save(); ctx.fillStyle="rgba(72,37,19,.28)"; drawRoundedRect(pad-3,10,barW+6,66,16); ctx.fill(); drawRoundedRect(pad,14,barW,scoreH,13); ctx.fillStyle="rgba(248,223,170,.9)"; ctx.fill(); ctx.strokeStyle="rgba(61,31,15,.55)"; ctx.lineWidth=2; ctx.stroke(); const scoreProgress=clamp((state.score%5000)/5000,0,1); drawRoundedRect(pad+4,18,(barW-8)*Math.max(.08,scoreProgress),scoreH-8,10); const g=ctx.createLinearGradient(pad,17,pad+barW,17); g.addColorStop(0,"#4f8b59"); g.addColorStop(1,"#f7c65a"); ctx.fillStyle=g; ctx.fill(); ctx.fillStyle="#3b1d12"; ctx.font='700 15px "Cinzel", Georgia, serif'; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(`SNACK TAB ${state.score}`, pad+10, 14+scoreH/2); ctx.font='400 13px "Bangers", cursive'; ctx.textAlign="right"; ctx.fillText("DUSTY CLOVER", pad+barW-10, 14+scoreH/2); drawRoundedRect(pad,52,barW,timerH,10); ctx.fillStyle="rgba(74,39,22,.72)"; ctx.fill(); const tRate=clamp(state.timeLeft/GAME_SECONDS,0,1); drawRoundedRect(pad+3,55,(barW-6)*tRate,timerH-6,8); ctx.fillStyle=tRate<.25?"#c94a3b":"#4f8b59"; ctx.fill(); ctx.fillStyle="#fff4c8"; ctx.font='700 11px "Cinzel", Georgia, serif'; ctx.textAlign="center"; ctx.fillText(`SUNDOWN IN ${Math.ceil(state.timeLeft)}S`, W/2, 61); ctx.restore(); }
  function drawBoardFrame(){ const bw=COLS*tileSize,bh=ROWS*tileSize; ctx.save(); drawRoundedRect(boardX-10,boardY-10,bw+20,bh+20,18); ctx.fillStyle="rgba(64,33,18,.84)"; ctx.shadowColor="rgba(0,0,0,.38)"; ctx.shadowBlur=24; ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle="rgba(248,223,170,.62)"; ctx.lineWidth=3; ctx.stroke(); for(let r=1;r<ROWS;r++){ const y=boardY+r*tileSize; ctx.strokeStyle="rgba(248,223,170,.15)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(boardX,y); ctx.lineTo(boardX+bw,y); ctx.stroke(); } for(let c=1;c<COLS;c++){ const x=boardX+c*tileSize; ctx.beginPath(); ctx.moveTo(x,boardY); ctx.lineTo(x,boardY+bh); ctx.stroke(); } ctx.restore(); }
  function drawTile(t){ const x=t.x,y=t.y,s=tileSize,inset=4,w=s-inset*2,h=s-inset*2,relic=RELICS[t.type%RELICS.length]; ctx.save(); ctx.globalAlpha=t.alpha; ctx.translate(x+s*.5,y+s*.5); ctx.scale(t.scale,t.scale); ctx.translate(-s*.5,-s*.5); const tg=ctx.createLinearGradient(inset,inset,inset+w,inset+h); tg.addColorStop(0,"rgba(255,255,255,.32)"); tg.addColorStop(.22,relic.base); tg.addColorStop(1,"rgba(84,43,22,.96)"); drawRoundedRect(inset,inset,w,h,Math.max(10,s*.16)); ctx.fillStyle=tg; ctx.shadowColor=relic.glow; ctx.shadowBlur=13; ctx.fill(); ctx.shadowBlur=0; drawRoundedRect(inset+3,inset+3,w-6,h-6,Math.max(8,s*.13)); ctx.fillStyle="rgba(255,229,173,.16)"; ctx.fill(); const pulse=((performance.now()*.003)+(t.row+t.col)*.45)%(Math.PI*2); const coreR=Math.max(10,s*.18+Math.sin(pulse)*1.7), cx=inset+w*.5, cy=inset+h*.35; const core=ctx.createRadialGradient(cx,cy,coreR*.15,cx,cy,coreR*1.65); core.addColorStop(0,relic.accent); core.addColorStop(.52,relic.base); core.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=core; ctx.beginPath(); ctx.arc(cx,cy,coreR*1.55,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#fff8dc"; ctx.font=`${Math.floor(s*.48)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(relic.emoji,inset+w*.5,inset+h*.55); ctx.font=`${Math.max(9,Math.floor(s*.115))}px "Cinzel", Georgia, serif`; ctx.fillStyle="rgba(255,244,200,.9)"; ctx.fillText(relic.label.toUpperCase(), inset+w*.5, inset+h-Math.max(9,s*.12)); ctx.restore(); }
  function drawSelection(){ if(!state.selected) return; const {row,col}=state.selected, x=boardX+col*tileSize,y=boardY+row*tileSize; ctx.save(); ctx.shadowColor="rgba(255,232,129,.8)"; ctx.shadowBlur=15; drawRoundedRect(x+3,y+3,tileSize-6,tileSize-6,10); ctx.strokeStyle="rgba(255,232,129,.98)"; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); }
  function render(){ ctx.clearRect(0,0,W,H); drawBackground(); drawDusty(); drawHUD(); drawBoardFrame(); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const t=state.grid[r][c]; if(t) drawTile(t); } drawSelection(); if(state.gameOver){ ctx.save(); ctx.fillStyle="rgba(45,22,12,.62)"; ctx.fillRect(0,0,W,H); drawRoundedRect(W*.08,H*.34,W*.84,H*.28,24); ctx.fillStyle="rgba(248,223,170,.94)"; ctx.fill(); ctx.strokeStyle="rgba(77,39,19,.7)"; ctx.lineWidth=3; ctx.stroke(); ctx.fillStyle="#3b1d12"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font='400 35px "Bangers", cursive'; ctx.fillText("Sundown Bell!", W/2, H*.42); ctx.font='700 22px "Cinzel", Georgia, serif'; ctx.fillText(`Snack Tab ${state.score}`, W/2, H*.50); ctx.font='700 15px "Cinzel", Georgia, serif'; ctx.fillText("Tap to shuffle another harmless chore", W/2, H*.57); ctx.restore(); } }
  function animateTo(tile,toRow,toCol,ms){ const fromX=tile.x,fromY=tile.y,toX=boardX+toCol*tileSize,toY=boardY+toRow*tileSize; return new Promise(resolve=>{ const st=performance.now(); function step(now){ const t=clamp((now-st)/ms,0,1), e=t<.5?2*t*t:-1+(4-2*t)*t; tile.x=lerp(fromX,toX,e); tile.y=lerp(fromY,toY,e); if(t<1) requestAnimationFrame(step); else { tile.x=toX; tile.y=toY; tile.row=toRow; tile.col=toCol; resolve(); } } requestAnimationFrame(step); }); }
  function areAdjacent(a,b){ return Math.abs(a.row-b.row)+Math.abs(a.col-b.col)===1; }
  function findMatches(grid){ const mark=Array.from({length:ROWS},()=>Array(COLS).fill(false)), groups=[]; for(let r=0;r<ROWS;r++){ let c=0; while(c<COLS){ const cur=grid[r][c]; if(!cur){ c++; continue; } let c2=c+1; while(c2<COLS && grid[r][c2] && grid[r][c2].type===cur.type) c2++; const len=c2-c; if(len>=3){ const cells=[]; for(let k=c;k<c2;k++){ mark[r][k]=true; cells.push({row:r,col:k}); } groups.push({len,cells,dir:"h"}); } c=c2; } } for(let c=0;c<COLS;c++){ let r=0; while(r<ROWS){ const cur=grid[r][c]; if(!cur){ r++; continue; } let r2=r+1; while(r2<ROWS && grid[r2][c] && grid[r2][c].type===cur.type) r2++; const len=r2-r; if(len>=3){ const cells=[]; for(let k=r;k<r2;k++){ mark[k][c]=true; cells.push({row:k,col:c}); } groups.push({len,cells,dir:"v"}); } r=r2; } } const cells=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(mark[r][c]) cells.push({row:r,col:c}); return {cells,groups}; }
  function calcScore(groups,chain){ let gained=0; for(const g of groups){ let mult=1; if(g.len>=5) mult=3; else if(g.len===4) mult=2; gained += BASE_MATCH_SCORE * g.len * mult; } if(chain>1) gained = Math.floor(gained * (1 + (chain - 1) * .25)); return gained; }
  async function swapCells(a,b,ms=SWAP_TIME){ const ta=state.grid[a.row][a.col], tb=state.grid[b.row][b.col]; state.grid[a.row][a.col]=tb; state.grid[b.row][b.col]=ta; await Promise.all([animateTo(ta,b.row,b.col,ms), animateTo(tb,a.row,a.col,ms)]); }
  async function clearMatches(match){ const fades=[]; for(const cell of match.cells){ const t=state.grid[cell.row][cell.col]; if(!t) continue; fades.push(new Promise(resolve=>{ const st=performance.now(); function step(now){ const p=clamp((now-st)/CLEAR_TIME,0,1); t.alpha=1-p; t.scale=1-.25*p; if(p<1) requestAnimationFrame(step); else resolve(); } requestAnimationFrame(step); })); } await Promise.all(fades); for(const cell of match.cells) state.grid[cell.row][cell.col]=null; }
  async function collapseBoard(){ const moves=[]; for(let c=0;c<COLS;c++){ let write=ROWS-1; for(let r=ROWS-1;r>=0;r--){ const t=state.grid[r][c]; if(!t) continue; if(write!==r){ state.grid[write][c]=t; state.grid[r][c]=null; moves.push(animateTo(t,write,c,FALL_TIME)); } write--; } for(let r=write;r>=0;r--){ const type=randomType(), t=makeTile(type,r,c); t.y=boardY-(write-r+1)*tileSize-8; state.grid[r][c]=t; moves.push(animateTo(t,r,c,SPAWN_TIME)); } } await Promise.all(moves); }
  async function resolveBoardFromCurrent(chainStart=1){ state.resolving=true; let chain=chainStart; while(true){ const match=findMatches(state.grid); if(!match.cells.length) break; const gain=calcScore(match.groups,chain); state.score += gain; playEliminateSfx(chain-1); if(chain>=2){ playComboSfx(chain); flashCharm(comboCharm,"✨",1500); const text=COMBO_TEXTS[randInt(COMBO_TEXTS.length)]; spawnBark(`${text} x${chain}`,chain); showToast(`Chain x${chain}! +${gain} tabs`); } else showToast(`+${gain} tabs settled`); await clearMatches(match); await collapseBoard(); chain++; } state.resolving=false; }
  function cellFromPoint(x,y){ if(x<boardX || y<boardY) return null; const c=Math.floor((x-boardX)/tileSize), r=Math.floor((y-boardY)/tileSize); if(r<0||r>=ROWS||c<0||c>=COLS) return null; return {row:r,col:c}; }
  async function trySwap(a,b){ if(state.resolving || state.gameOver) return; if(!areAdjacent(a,b)) return; state.resolving=true; playSfx("swap",.32); await swapCells(a,b,SWAP_TIME); const match=findMatches(state.grid); if(!match.cells.length){ playSfx("fail",.38); flashCharm(failCharm,"🥾",1200); playEliminateSfx(0); await swapCells(a,b,SWAP_TIME); showToast("No chore there, partner!"); state.resolving=false; return; } state.resolving=false; await resolveBoardFromCurrent(1); }
  function restartGame(){ seed = 0xC10A57; state.score=0; state.timeLeft=GAME_SECONDS; state.resolving=false; state.selected=null; state.pointerDownCell=null; state.gameOver=false; initBoard(); syncBgmState(); resolveBoardFromCurrent(1).then(()=>{ state.resolving=false; }); }
  function onPointerDown(e){ const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top; ensureAudio(); if(state.gameOver){ restartGame(); return; } const cell=cellFromPoint(x,y); state.pointerDownCell=cell; if(!cell || state.resolving) return; if(!state.selected) state.selected=cell; else { if(cell.row===state.selected.row && cell.col===state.selected.col) state.selected=null; else if(areAdjacent(state.selected,cell)){ const a=state.selected; state.selected=null; trySwap(a,cell); } else state.selected=cell; } }
  function onPointerMove(e){ if(!state.pointerDownCell || state.resolving || state.gameOver) return; const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top, cell=cellFromPoint(x,y); if(!cell) return; const start=state.pointerDownCell; if(areAdjacent(start,cell)){ state.pointerDownCell=null; state.selected=null; trySwap(start,cell); } }
  function onPointerUp(){ state.pointerDownCell=null; }
  function tick(now){ const dt=Math.min(.05,(now-state.lastTs)/1000); state.lastTs=now; if(!state.gameOver){ state.timeLeft -= dt; if(state.timeLeft<=0){ state.timeLeft=0; state.gameOver=true; bgm.pause(); playSfx("gameOver",.42); flashCharm(failCharm,"🌙",1800); spawnBark("Sundown Bell!",3); showToast("Snack window closed!"); } } render(); requestAnimationFrame(tick); }
  async function boot(){ resize(); window.addEventListener("resize",resize); canvas.addEventListener("pointerdown",onPointerDown,{passive:true}); canvas.addEventListener("pointermove",onPointerMove,{passive:true}); window.addEventListener("pointerup",onPointerUp,{passive:true}); bgm.volume=.18; initBoard(); resolveBoardFromCurrent(1); requestAnimationFrame(t=>{ state.lastTs=t; tick(t); }); }
  window.__prairieDebug = { state, constants:{COLS,ROWS,GAME_SECONDS}, metrics:()=>({boardX,boardY,tileSize,hudH,W,H}), findMatches:()=>findMatches(state.grid), forceMatch:async()=>{ while(state.resolving) await new Promise(r=>setTimeout(r,30)); state.grid[0][0].type=0; state.grid[0][1].type=0; state.grid[0][2].type=0; await resolveBoardFromCurrent(1); return state.score; }, forceGameOver:()=>{ state.timeLeft=0; } };
  boot();
})();
