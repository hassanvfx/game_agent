<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Puzzle Master: All Done</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title-ui: Orbitron | body-ui: Rajdhani -->
    <style>
        :root {
            --bg-night: #08111f;
            --bg-deep: #10233f;
            --sky-glow: #37c8ff;
            --violet-glow: #8467ff;
            --sun-pop: #ffd95a;
            --danger-pop: #ff6b7d;
            --panel-bg: rgba(8, 18, 40, 0.72);
            --panel-border: rgba(160, 228, 255, 0.38);
            --panel-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
            --text-main: #f6fbff;
            --text-soft: rgba(236, 247, 255, 0.8);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(55, 200, 255, 0.18), transparent 28%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-night));
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(14, 33, 65, 0.92), rgba(8, 17, 31, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 36%),
                linear-gradient(180deg, rgba(55, 200, 255, 0.08), transparent 60%);
        }

        .title-font,
        #start-btn,
        #restart-btn,
        #hint-btn {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.06em;
        }

        .ui-chip {
            border: 1px solid rgba(157, 230, 255, 0.32);
            background: linear-gradient(180deg, rgba(17, 46, 88, 0.92), rgba(9, 24, 48, 0.96));
            color: var(--text-main);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.26);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(30vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(0.75rem) scale(0.95);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            object-fit: cover;
            background: rgba(11, 22, 46, 0.7);
        }

        .feedback-gif.show {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.win {
            right: 50%;
            bottom: 1.25rem;
            width: min(38vw, 8.5rem);
            transform: translate(50%, 0.75rem) scale(0.95);
        }

        .feedback-gif.win.show {
            transform: translate(50%, 0) scale(1);
        }

        .screen-shell {
            width: min(100%, 25rem);
            padding: 1.5rem;
            border-radius: 1.6rem;
        }

        .spark-banner {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            background: rgba(255, 217, 90, 0.18);
            color: #ffe691;
            border: 1px solid rgba(255, 217, 90, 0.28);
        }

        .badge-glow {
            animation: glow 1.9s infinite alternate;
        }

        .cta-button {
            border: 0;
            outline: none;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .cta-button:hover {
            filter: brightness(1.06);
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(255, 217, 90, 0.45), 0 0 24px rgba(132, 103, 255, 0.22); }
            to { box-shadow: 0 0 18px rgba(255, 217, 90, 0.72), 0 0 30px rgba(55, 200, 255, 0.24); }
        }

        @media (max-width: 480px) {
            #ui-layer { padding: 0.85rem; }
            .screen-shell { padding: 1.15rem; border-radius: 1.3rem; }
            #start-screen h1 { font-size: 2.55rem; }
            #game-over-screen h2 { font-size: 2rem; }
            #start-screen p,
            #game-over-screen p { font-size: 0.95rem; }
            #hint-btn { padding-inline: 0.95rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full overflow-hidden bg-slate-950">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: hint/win feedback -> catalogs/gifs.json -->
        <img id="hint-gif" class="feedback-gif" alt="Hint reaction" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp">
        <img id="win-gif" class="feedback-gif win" alt="Victory reaction" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
        
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between pointer-events-none p-4">
            <div id="top-bar" class="flex justify-between items-start w-full hidden">
                <div class="ui-chip px-4 py-2 rounded-full text-sm font-bold drop-shadow-md">
                    Tiles: <span id="pieces-count">0/9</span>
                </div>
                <button id="hint-btn" class="cta-button pointer-events-auto ui-chip text-cyan-50 font-bold py-2 px-5 rounded-full flex items-center gap-2">
                    <span>✨ Hint</span>
                    <span id="hints-left" class="bg-cyan-200/20 text-cyan-100 text-xs px-2 py-0.5 rounded-full border border-cyan-200/20">5</span>
                </button>
            </div>
            <div></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center z-50 bg-slate-950/65 backdrop-blur-sm transition-opacity duration-500">
            <div class="glass-panel screen-shell text-center mx-4">
                <div class="spark-banner mb-4"><span>🌆</span><span>Postcard Patrol</span></div>
                <h1 class="title-font text-5xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-300 to-violet-400 mb-4 drop-shadow-lg">SKYLINE SNAP</h1>
                <p class="text-[15px] sm:text-lg text-white/85 mb-7 leading-relaxed">Patch the city postcard back together.<br>Drag the glowing skyline tiles onto the grid.</p>
                <button id="start-btn" class="cta-button title-font bg-gradient-to-r from-cyan-500 to-violet-600 text-white text-xl py-3.5 px-9 rounded-full shadow-xl border border-white/15">
                    START SORTING
                </button>
            </div>
        </div>

        <!-- Win Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center z-50 bg-slate-950/78 backdrop-blur-md">
            <div class="glass-panel screen-shell text-center mx-4">
                <div class="inline-block mb-6 relative">
                    <div class="w-28 h-28 sm:w-32 sm:h-32 bg-gradient-to-br from-yellow-300 via-amber-300 to-orange-500 rounded-full flex items-center justify-center border-4 border-white/90 shadow-2xl badge-glow mx-auto">
                        <span class="text-4xl">🏆</span>
                    </div>
                    <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-cyan-600 text-white font-bold px-4 py-1 rounded-full text-[11px] sm:text-sm whitespace-nowrap border border-cyan-300/60 shadow-lg">
                        SKYLINE FIXED
                    </div>
                </div>
                <h2 class="title-font text-4xl text-white mb-2">Nice Save!</h2>
                <p class="text-white/75 mb-7 text-sm sm:text-base">The postcard glow is back in place.</p>
                <button id="restart-btn" class="cta-button title-font bg-white text-sky-950 py-3 px-8 rounded-full shadow-lg flex items-center gap-2 mx-auto">
                    <span>🔁</span>
                    <span>Start Over</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                hint: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                snap: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                dropFail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.unlocked = false;
                this.sfx = {};
                this.lastPlayedAt = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = this.bgm.currentTime || 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM(reset = false) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, { volume, debounceMs = 90 } = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
                this.lastPlayedAt[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = volume ?? (key === 'win' ? 0.78 : 0.58);
                clone.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const hintGif = document.getElementById('hint-gif');
        const winGif = document.getElementById('win-gif');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        
        const GRID_ROWS = 3;
        const GRID_COLS = 3;
        let pieces = [];
        let puzzleImageCanvas = document.createElement('canvas');
        let puzzleOffsetX = 0;
        let puzzleOffsetY = 0;
        let pieceWidth = 0;
        let pieceHeight = 0;
        
        let draggedPiece = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let hintsRemaining = 5;
        let hintActivePiece = null;
        let hintTimer = 0;

        let bgParticles = [];
        let hintGifTimer = null;
        let winGifTimer = null;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            const puzzleSize = Math.min(width, height) * 0.7;
            const puzzleW = puzzleSize;
            const puzzleH = puzzleSize;
            
            pieceWidth = puzzleW / GRID_COLS;
            pieceHeight = puzzleH / GRID_ROWS;

            puzzleOffsetX = (width - puzzleW) / 2;
            puzzleOffsetY = (height - puzzleH) / 2;

            puzzleImageCanvas.width = puzzleW;
            puzzleImageCanvas.height = puzzleH;
            generatePuzzleImage(puzzleImageCanvas.getContext('2d'), puzzleW, puzzleH);

            if (gameActive) {
                pieces.forEach(p => {
                    p.targetX = puzzleOffsetX + p.col * pieceWidth;
                    p.targetY = puzzleOffsetY + p.row * pieceHeight;
                    if (p.isLocked) {
                        p.x = p.targetX;
                        p.y = p.targetY;
                    } else {
                        p.x = Math.min(width - pieceWidth, Math.max(0, p.x));
                        p.y = Math.min(height - pieceHeight, Math.max(0, p.y));
                    }
                    p.width = pieceWidth;
                    p.height = pieceHeight;
                });
            }
        }
        
        window.addEventListener('resize', resize);

        function generatePuzzleImage(pCtx, w, h) {
            pCtx.clearRect(0, 0, w, h);

            const skyGrad = pCtx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, '#0f2c62');
            skyGrad.addColorStop(0.45, '#1a5f9f');
            skyGrad.addColorStop(1, '#f49b6c');
            pCtx.fillStyle = skyGrad;
            pCtx.fillRect(0, 0, w, h);

            const aurora = pCtx.createLinearGradient(0, h * 0.05, w, h * 0.5);
            aurora.addColorStop(0, 'rgba(55, 200, 255, 0.35)');
            aurora.addColorStop(0.5, 'rgba(132, 103, 255, 0.18)');
            aurora.addColorStop(1, 'rgba(255, 217, 90, 0)');
            pCtx.fillStyle = aurora;
            pCtx.fillRect(0, 0, w, h * 0.55);

            for (let i = 0; i < 10; i++) {
                const starX = (0.08 + i * 0.09) * w;
                const starY = (0.11 + (i % 3) * 0.07) * h;
                pCtx.beginPath();
                pCtx.arc(starX, starY, w * 0.006, 0, Math.PI * 2);
                pCtx.fillStyle = 'rgba(255,255,255,0.9)';
                pCtx.fill();
            }

            pCtx.beginPath();
            pCtx.arc(w * 0.8, h * 0.2, w * 0.1, 0, Math.PI * 2);
            pCtx.fillStyle = '#ffd95a';
            pCtx.shadowColor = '#ffd95a';
            pCtx.shadowBlur = 26;
            pCtx.fill();
            pCtx.shadowBlur = 0;

            pCtx.fillStyle = 'rgba(11, 22, 46, 0.72)';
            pCtx.fillRect(0, h * 0.73, w, h * 0.27);

            const buildings = [
                { x: 0.08, w: 0.12, h: 0.25, c: '#162744' },
                { x: 0.19, w: 0.09, h: 0.34, c: '#20365f' },
                { x: 0.3, w: 0.16, h: 0.45, c: '#11213b' },
                { x: 0.47, w: 0.09, h: 0.31, c: '#1c3157' },
                { x: 0.58, w: 0.11, h: 0.5, c: '#132542' },
                { x: 0.71, w: 0.1, h: 0.39, c: '#213c68' },
                { x: 0.82, w: 0.09, h: 0.28, c: '#162744' }
            ];

            buildings.forEach((b, idx) => {
                const bx = b.x * w;
                const bw = b.w * w;
                const bh = b.h * h;
                const by = h * 0.73 - bh;

                pCtx.fillStyle = b.c;
                pCtx.fillRect(bx, by, bw, bh);

                pCtx.fillStyle = idx % 2 === 0 ? '#37c8ff' : '#ffd95a';
                const cols = Math.max(2, Math.floor(bw / (w * 0.03)));
                const rows = Math.max(3, Math.floor(bh / (h * 0.08)));
                for (let cy = 0; cy < rows; cy++) {
                    for (let cx = 0; cx < cols; cx++) {
                        if ((cx + cy + idx) % 2 !== 0) continue;
                        const wx = bx + bw * 0.12 + cx * (bw * 0.22);
                        const wy = by + bh * 0.12 + cy * (bh * 0.17);
                        pCtx.globalAlpha = 0.85;
                        pCtx.fillRect(wx, wy, bw * 0.09, bh * 0.05);
                    }
                }
                pCtx.globalAlpha = 1;
            });

            pCtx.beginPath();
            pCtx.moveTo(0, h * 0.9);
            pCtx.quadraticCurveTo(w * 0.25, h * 0.82, w * 0.55, h * 0.88);
            pCtx.quadraticCurveTo(w * 0.75, h * 0.92, w, h * 0.84);
            pCtx.lineTo(w, h);
            pCtx.lineTo(0, h);
            pCtx.closePath();
            pCtx.fillStyle = '#091427';
            pCtx.fill();

            pCtx.strokeStyle = 'rgba(255,255,255,0.22)';
            pCtx.lineWidth = 2;
            pCtx.beginPath();
            for (let i = 1; i < GRID_COLS; i++) {
                pCtx.moveTo(i * (w / GRID_COLS), 0);
                pCtx.lineTo(i * (w / GRID_COLS), h);
            }
            for (let i = 1; i < GRID_ROWS; i++) {
                pCtx.moveTo(0, i * (h / GRID_ROWS));
                pCtx.lineTo(w, i * (h / GRID_ROWS));
            }
            pCtx.stroke();
        }

        function initBackground() {
            bgParticles = [];
            for (let i = 0; i < 20; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 50 + 20,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.32,
                    color: i % 2 === 0
                        ? `rgba(55, 200, 255, ${Math.random() * 0.12 + 0.06})`
                        : `rgba(132, 103, 255, ${Math.random() * 0.09 + 0.04})`
                });
            }
        }

        function initGame() {
            resize();
            pieces = [];
            hintsRemaining = 5;
            document.getElementById('hints-left').innerText = hintsRemaining;
            document.getElementById('pieces-count').innerText = `0/${GRID_ROWS * GRID_COLS}`;
            
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const targetX = puzzleOffsetX + c * pieceWidth;
                    const targetY = puzzleOffsetY + r * pieceHeight;
                    const spawnX = Math.random() * (width - pieceWidth);
                    const spawnY = Math.random() * (height - pieceHeight);

                    pieces.push({
                        id: r * GRID_COLS + c,
                        row: r,
                        col: c,
                        x: spawnX,
                        y: spawnY,
                        width: pieceWidth,
                        height: pieceHeight,
                        targetX: targetX,
                        targetY: targetY,
                        isLocked: false,
                        isDragging: false
                    });
                }
            }
        }

        function update() {
            bgParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < -100) p.x = width + 100;
                if (p.x > width + 100) p.x = -100;
                if (p.y < -100) p.y = height + 100;
                if (p.y > height + 100) p.y = -100;
            });

            if (hintTimer > 0) {
                hintTimer--;
                if (hintTimer <= 0) hintActivePiece = null;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#071429');
            bgGrad.addColorStop(1, '#040914');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            bgParticles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            ctx.save();
            ctx.fillStyle = 'rgba(6, 13, 28, 0.58)';
            ctx.fillRect(puzzleOffsetX - 16, puzzleOffsetY - 16, puzzleImageCanvas.width + 32, puzzleImageCanvas.height + 32);

            const boardGrad = ctx.createLinearGradient(puzzleOffsetX, puzzleOffsetY, puzzleOffsetX, puzzleOffsetY + puzzleImageCanvas.height);
            boardGrad.addColorStop(0, 'rgba(36, 91, 150, 0.34)');
            boardGrad.addColorStop(1, 'rgba(13, 31, 58, 0.42)');
            ctx.fillStyle = boardGrad;
            ctx.fillRect(puzzleOffsetX, puzzleOffsetY, puzzleImageCanvas.width, puzzleImageCanvas.height);

            ctx.strokeStyle = 'rgba(160, 228, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.strokeRect(puzzleOffsetX, puzzleOffsetY, puzzleImageCanvas.width, puzzleImageCanvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 1; i <= GRID_COLS - 1; i++) {
                ctx.moveTo(puzzleOffsetX + i * pieceWidth, puzzleOffsetY);
                ctx.lineTo(puzzleOffsetX + i * pieceWidth, puzzleOffsetY + puzzleImageCanvas.height);
            }
            for (let i = 1; i <= GRID_ROWS - 1; i++) {
                ctx.moveTo(puzzleOffsetX, puzzleOffsetY + i * pieceHeight);
                ctx.lineTo(puzzleOffsetX + puzzleImageCanvas.width, puzzleOffsetY + i * pieceHeight);
            }
            ctx.stroke();
            ctx.restore();

            if (hintActivePiece) {
                ctx.fillStyle = 'rgba(255, 217, 90, 0.34)';
                ctx.fillRect(hintActivePiece.targetX, hintActivePiece.targetY, pieceWidth, pieceHeight);
                ctx.strokeStyle = '#ffd95a';
                ctx.lineWidth = 4;
                ctx.strokeRect(hintActivePiece.targetX, hintActivePiece.targetY, pieceWidth, pieceHeight);
            }

            const renderOrder = [...pieces].sort((a, b) => {
                if (a.isDragging) return 1;
                if (b.isDragging) return -1;
                if (a.isLocked && !b.isLocked) return -1;
                if (!a.isLocked && b.isLocked) return 1;
                return 0;
            });

            renderOrder.forEach(p => {
                const sx = p.col * (puzzleImageCanvas.width / GRID_COLS);
                const sy = p.row * (puzzleImageCanvas.height / GRID_ROWS);
                const sw = puzzleImageCanvas.width / GRID_COLS;
                const sh = puzzleImageCanvas.height / GRID_ROWS;

                ctx.save();
                
                if (!p.isLocked) {
                    ctx.shadowColor = p.isDragging ? 'rgba(55, 200, 255, 0.6)' : 'rgba(0, 0, 0, 0.45)';
                    ctx.shadowBlur = p.isDragging ? 18 : 7;
                    ctx.shadowOffsetY = p.isDragging ? 10 : 3;
                }

                ctx.drawImage(puzzleImageCanvas, sx, sy, sw, sh, p.x, p.y, p.width, p.height);

                const edgeGrad = ctx.createLinearGradient(p.x, p.y, p.x + p.width, p.y + p.height);
                edgeGrad.addColorStop(0, p.isLocked ? 'rgba(255,255,255,0.22)' : 'rgba(255, 248, 220, 0.95)');
                edgeGrad.addColorStop(1, p.isLocked ? 'rgba(55, 200, 255, 0.3)' : 'rgba(55, 200, 255, 0.72)');
                ctx.strokeStyle = edgeGrad;
                ctx.lineWidth = p.isDragging ? 3 : 2;
                ctx.strokeRect(p.x, p.y, p.width, p.height);

                if (!p.isLocked) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(p.x + 3, p.y + 3, p.width - 6, p.height - 6);
                }

                ctx.restore();
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function showGif(element, duration = 1800) {
            if (!element) return;
            element.classList.add('show');
            const timerKey = element === hintGif ? 'hint' : 'win';
            if (timerKey === 'hint' && hintGifTimer) clearTimeout(hintGifTimer);
            if (timerKey === 'win' && winGifTimer) clearTimeout(winGifTimer);
            const timer = setTimeout(() => element.classList.remove('show'), duration);
            if (timerKey === 'hint') hintGifTimer = timer;
            if (timerKey === 'win') winGifTimer = timer;
        }

        function hideFeedback() {
            hintGif.classList.remove('show');
            winGif.classList.remove('show');
        }

        function checkWin() {
            const lockedCount = pieces.filter(p => p.isLocked).length;
            document.getElementById('pieces-count').innerText = `${lockedCount}/${pieces.length}`;
            
            if (lockedCount === pieces.length) {
                gameActive = false;
                audio.stopBGM();
                audio.playSFX('win', { volume: 0.78, debounceMs: 250 });
                showGif(winGif, 2600);
                document.getElementById('top-bar').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(e) {
            if (!gameActive) return;
            if (e.type === 'touchstart') e.preventDefault();
            
            const pos = getPointerPos(e);
            const clickedPiece = [...pieces].reverse().find(p => {
                return !p.isLocked && 
                       pos.x >= p.x && pos.x <= p.x + p.width &&
                       pos.y >= p.y && pos.y <= p.y + p.height;
            });

            if (clickedPiece) {
                draggedPiece = clickedPiece;
                draggedPiece.isDragging = true;
                dragOffsetX = pos.x - draggedPiece.x;
                dragOffsetY = pos.y - draggedPiece.y;
                
                pieces = pieces.filter(p => p !== draggedPiece);
                pieces.push(draggedPiece);
            }
        }

        function handleMove(e) {
            if (!gameActive || !draggedPiece) return;
            if (e.type === 'touchmove') e.preventDefault();

            const pos = getPointerPos(e);
            draggedPiece.x = pos.x - dragOffsetX;
            draggedPiece.y = pos.y - dragOffsetY;
        }

        function handleEnd() {
            if (!gameActive || !draggedPiece) return;
            
            draggedPiece.isDragging = false;
            
            const snapDist = pieceWidth * 0.3;
            const dist = Math.hypot(draggedPiece.x - draggedPiece.targetX, draggedPiece.y - draggedPiece.targetY);

            if (dist < snapDist) {
                draggedPiece.x = draggedPiece.targetX;
                draggedPiece.y = draggedPiece.targetY;
                draggedPiece.isLocked = true;
                audio.playSFX('snap', { volume: 0.52, debounceMs: 80 });
                checkWin();
            } else {
                draggedPiece.x = Math.min(width - pieceWidth, Math.max(0, draggedPiece.x));
                draggedPiece.y = Math.min(height - pieceHeight, Math.max(0, draggedPiece.y));
                audio.playSFX('dropFail', { volume: 0.42, debounceMs: 140 });
            }

            draggedPiece = null;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd);

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.62, debounceMs: 200 });
            audio.playBGM();
            hideFeedback();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('top-bar').classList.remove('hidden');
            gameActive = true;
            initBackground();
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.56, debounceMs: 200 });
            hideFeedback();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('top-bar').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('hint-btn').addEventListener('click', () => {
            if (hintsRemaining > 0 && gameActive) {
                const unlocked = pieces.filter(p => !p.isLocked);
                if (unlocked.length > 0) {
                    hintsRemaining--;
                    document.getElementById('hints-left').innerText = hintsRemaining;
                    const randomPiece = unlocked[Math.floor(Math.random() * unlocked.length)];
                    hintActivePiece = randomPiece;
                    hintTimer = 60;
                    audio.playSFX('hint', { volume: 0.5, debounceMs: 120 });
                    showGif(hintGif, 1400);
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopBGM();
            } else if (gameActive) {
                audio.playBGM();
            }
        });

        resize();
    });
    </script>
</body>
</html>
