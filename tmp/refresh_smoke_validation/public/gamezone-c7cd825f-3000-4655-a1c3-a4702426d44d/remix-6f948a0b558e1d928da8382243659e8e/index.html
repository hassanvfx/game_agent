    <!-- [agent-note][stage4] remapped-fonts: display -> Audiowide, ui/body -> Rajdhani | source: catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --accent: #ff6b7d;
            --accent-strong: #ff3d8f;
            --success: #7af3b6;
            --success-strong: #2de28a;
            --text-dark: #211a2f;
            --text-soft: rgba(33, 26, 47, 0.74);
            --panel-bg: rgba(255, 248, 253, 0.64);
            --panel-border: rgba(255, 255, 255, 0.78);
            --panel-shadow: rgba(96, 43, 93, 0.22);
            --sparkle: rgba(255, 255, 255, 0.78);
            --glow-core: rgba(255, 125, 196, 0.52);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #ffe6f0 0%, #ffd8cb 40%, #ffc9b8 72%, #f8b8aa 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            position: relative;
            color: var(--text-dark);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.65) 0 4%, transparent 5%),
                radial-gradient(circle at 80% 12%, rgba(255, 202, 231, 0.45) 0 9%, transparent 10%),
                radial-gradient(circle at 68% 72%, rgba(255, 255, 255, 0.3) 0 5%, transparent 6%);
            opacity: 0.9;
        }

        body::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 22%),
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.3), transparent 40%);
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 12px 30px rgba(255, 255, 255, 0.24) inset,
                0 12px 28px var(--panel-shadow);
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(0) scale(0.92); opacity: 0.3; }
            50% { transform: translateY(-10px) scale(1.08); opacity: 0.88; }
        }

        @keyframes heroPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 107, 125, 0.1)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(255, 107, 125, 0.35)); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
            pointer-events: none;
            box-sizing: border-box;
        }

        .interactive {
            pointer-events: auto;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        .hud-pill {
            position: relative;
            padding: 10px 16px;
            border-radius: 999px;
            color: var(--text-dark);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(0.82rem, 2vw, 1.02rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 6px 16px rgba(255, 255, 255, 0.22) inset,
                0 4px 14px rgba(110, 51, 108, 0.16);
        }

        .hud-pill::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.28);
            pointer-events: none;
        }

        .hud-value {
            color: var(--accent-strong);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
            box-sizing: border-box;
        }

        #start-screen,
        #level-screen {
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.76), rgba(255, 244, 250, 0.58) 55%, rgba(255, 227, 216, 0.68) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .spark-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .spark {
            position: absolute;
            width: 10px;
            height: 10px;

            background: var(--sparkle);

            animation: sparkleFloat 2.4s ease-in-out infinite;

        .spark:nth-child(1) { left: 18%; top: 28%; animation-delay: 0s; }
        .spark:nth-child(2) { left: 80%; top: 22%; animation-delay: 0.45s; width: 7px; height: 7px; }
        .spark:nth-child(3) { left: 26%; top: 74%; animation-delay: 0.9s; width: 8px; height: 8px; }

        @media (max-width: 640px) {

<script>
/**
 * §4 Iron Laws & Logic
 */

// --- Configuration ---
window.gameConfigDefs = {
    "popSensitivity": { "type": "number", "label": "Pop Sensitivity", "value": 15, "min": 5, "max": 30 },
    "particleCount": { "type": "number", "label": "Burst Particles", "value": 12, "min": 5, "max": 30 },
    "themeColor": { "type": "color", "label": "UI Accent", "value": "#FF6B6B" }
};
window.gameConfig = {
    popSensitivity: 15,
    particleCount: 12,
    themeColor: "#FF6B6B"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            const root = document.documentElement;
            root.style.setProperty('--accent', val);
            root.style.setProperty('--accent-strong', val);
            const title = document.querySelector('h1');
            if (title) title.style.color = val;
            const btn = document.getElementById('start-btn');
            if (btn) btn.style.background = `linear-gradient(135deg, ${val} 0%, ${val} 100%)`;
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgm = document.getElementById('bgm_main');
        this.sfxStart = document.getElementById('sfx_start');
        this.sfxPop = document.getElementById('sfx_pop');
        this.sfxScrub = document.getElementById('sfx_scrub');
        this.sfxClean = document.getElementById('sfx_clean');
        this.unlocked = false;
        this.masterGain = this.ctx.createGain();
        this.masterGain.connect(this.ctx.destination);
        this.masterGain.gain.value = 0.6;
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    playFromElement(audioEl, fallbackType, volume = 1) {
        if (!audioEl) {
            if (fallbackType) this.synthesize(fallbackType);
            return;
        }
        audioEl.volume = volume;
        audioEl.currentTime = 0;
        const playResult = audioEl.play();
        if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(() => {
                if (fallbackType) this.synthesize(fallbackType);
            });
        }
    }

    playBgm() {
        if (!this.bgm) return;
        this.bgm.volume = 0.34;
        if (this.ctx.state === 'running') {
            const playResult = this.bgm.play();
            if (playResult && typeof playResult.catch === 'function') {
                playResult.catch(() => {});
            }
        }
    }

    pauseBgm() {
        if (this.bgm && !this.bgm.paused) {
            this.bgm.pause();
        }
    }

    playStart() {
        this.playFromElement(this.sfxStart, 'chime', 0.55);
    }

    playPop() {
        this.playFromElement(this.sfxPop, 'pop', 0.5);
    }

    playScrub() {
        this.playFromElement(this.sfxScrub, 'rub', 0.28);
    }

    playClean() {
        this.playFromElement(this.sfxClean, 'chime', 0.58);
    }

    synthesize(type) {
        if (this.ctx.state !== 'running') return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        const now = this.ctx.currentTime;
        if (type === 'pop') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'rub') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'chime') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }
}

// --- Game Engine ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startScreen = document.getElementById('start-screen');
    const levelScreen = document.getElementById('level-screen');
    const hud = document.getElementById('hud');
    const zoneNameEl = document.getElementById('zone-name');
    const progressEl = document.getElementById('progress-text');
    const pressableButtons = document.querySelectorAll('.primary-btn');
    const collectGif = document.getElementById('collect-gif');
    const winGif = document.getElementById('win-gif');

    pressableButtons.forEach((button) => {
        button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
        const release = () => button.classList.remove('is-pressed');
        button.addEventListener('pointerup', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('pointercancel', release);
    });

    let audioManager = new AudioManager();
    let lastTime = 0;
    let gameState = 'MENU'; // MENU, PLAYING, LEVEL_END
    let width, height;
    let dpr = 1;

    // Game Objects
    let blemishes = [];
    let particles = [];
    let currentZone = 0;
    let skinColor = '#FFDCB1';
    let scrubSfxCooldown = 0;
    let activeGifTimeouts = [];

    const ZONES = [
        { name: "NOSE", type: "pimples", color: "#f4c6b7", count: 8 },
        { name: "CHEEK", type: "mixed", color: "#ffd7c5", count: 12 },
        { name: "FOREHEAD", type: "oily", color: "#e7bfaa", count: 15 },
        { name: "BACK", type: "acne", color: "#dca58f", count: 18 },
        { name: "ARM", type: "dirt", color: "#c88c71", count: 10 }
    ];

    // --- Resizing ---
    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Classes ---
    class Particle {
        constructor(x, y, color, speed) {
            this.x = x;
            this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * speed + 2;
            this.vx = Math.cos(angle) * velocity;
            this.vy = Math.sin(angle) * velocity;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 4 + 2;
            this.gravity = 0.2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    class Blemish {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'pimple', 'dirt'
            this.radius = type === 'pimple' ? 25 : 40;
            this.health = 100;
            this.popped = false;
            this.scale = 0;
            this.targetScale = 1;
            this.wobble = Math.random() * Math.PI * 2;
        }

        update(dt) {
            if (this.scale < this.targetScale) {
                this.scale += dt * 5;
                if (this.scale > this.targetScale) this.scale = this.targetScale;
            }
            this.wobble += dt * 2;
        }

        draw(ctx) {
            if (this.popped) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);

            if (this.type === 'pimple') {
                const pulse = Math.sin(this.wobble) * 2;

                ctx.shadowColor = 'rgba(255, 115, 176, 0.55)';
                ctx.shadowBlur = 22;
                ctx.fillStyle = '#ff7da6';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffd6e3';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.72, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff7fb';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.36, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.72)';
                ctx.beginPath();
                ctx.arc(-this.radius * 0.34, -this.radius * 0.36, this.radius * 0.16, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.92, Math.PI * 1.1, Math.PI * 1.85);
                ctx.stroke();
            } else if (this.type === 'dirt') {
                ctx.globalAlpha = this.health / 100;
                ctx.fillStyle = '#7f5560';
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const r = this.radius * (0.8 + Math.sin(this.wobble + i) * 0.2);
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 228, 236, 0.26)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.55, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        interact(x, y, isTap) {
            if (this.popped) return false;
            const dist = Math.hypot(x - this.x, y - this.y);

            if (this.type === 'pimple' && isTap && dist < this.radius * 1.5) {
                this.pop();
                return true;
            }

            if (this.type === 'dirt' && !isTap && dist < this.radius) {
                this.scrub();
                return true;
            }
            return false;
        }

        pop() {
            this.popped = true;
            audioManager.playPop();
            showReactionGif(collectGif, 720);
            for (let i = 0; i < window.gameConfig.particleCount; i++) {
                particles.push(new Particle(this.x, this.y, '#fff6fb', 5));
                particles.push(new Particle(this.x, this.y, '#ff7da6', 3));
            }
            checkLevelComplete();
        }

        scrub() {
            this.health -= 5;
            if (scrubSfxCooldown <= 0 && Math.random() > 0.55) {
                audioManager.playScrub();
                scrubSfxCooldown = 90;
            }
            if (this.health <= 0) {
                this.popped = true;
                showReactionGif(collectGif, 900);
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(this.x, this.y, '#d7b4bc', 2));
                }
                checkLevelComplete();
            }
        }
    }

    // --- Game Logic ---
    function showReactionGif(target, duration = 1200) {
        if (!target) return;
        target.hidden = false;
        target.classList.add('active');
        const timeoutId = window.setTimeout(() => {
            target.classList.remove('active');
            window.setTimeout(() => {
                target.hidden = true;
            }, 280);
        }, duration);
        activeGifTimeouts.push(timeoutId);
    }

    function clearReactionGifs() {
        activeGifTimeouts.forEach((timeoutId) => window.clearTimeout(timeoutId));
        activeGifTimeouts = [];
        [collectGif, winGif].forEach((gif) => {
            if (!gif) return;
            gif.classList.remove('active');
            gif.hidden = true;
        });
    }

    function initLevel() {
        blemishes = [];
        particles = [];
        const zone = ZONES[currentZone % ZONES.length];
        skinColor = zone.color;
        document.body.style.background = `radial-gradient(circle at top, #ffe7f0 0%, ${skinColor} 55%, #f0b19e 100%)`;
        zoneNameEl.innerText = zone.name;
        zoneNameEl.style.color = currentZone % 2 === 0 ? 'var(--accent-strong)' : 'var(--success-strong)';

        for (let i = 0; i < zone.count; i++) {
            const margin = 50;
            const x = margin + Math.random() * (width - margin * 2);
            const y = margin + Math.random() * (height - margin * 2);

            let type = 'pimple';
            if (zone.type === 'dirt') type = 'dirt';
            else if (zone.type === 'mixed') type = Math.random() > 0.5 ? 'pimple' : 'dirt';
            else if (zone.type === 'oily') type = Math.random() > 0.7 ? 'pimple' : 'dirt';

            let overlap = false;
            for (let b of blemishes) {
                if (Math.hypot(b.x - x, b.y - y) < 60) overlap = true;
            }
            if (!overlap) blemishes.push(new Blemish(x, y, type));
        }

        gameState = 'PLAYING';
        clearReactionGifs();
        audioManager.playBgm();
        hud.classList.remove('hidden');
        levelScreen.classList.add('hidden');
        updateProgress();
    }

    function updateProgress() {
        const total = blemishes.length;
        const remaining = blemishes.filter(b => !b.popped).length;
        const percent = Math.floor(((total - remaining) / total) * 100);
        progressEl.innerText = percent + "%";
    }

    function checkLevelComplete() {
        updateProgress();
        const remaining = blemishes.filter(b => !b.popped).length;
        if (remaining === 0) {
            setTimeout(() => {
                gameState = 'LEVEL_END';
                audioManager.playClean();
                showReactionGif(winGif, 2200);
                levelScreen.classList.remove('hidden');
                hud.classList.add('hidden');

                for (let i = 0; i < 50; i++) {
                    particles.push(new Particle(width / 2, height / 2, ['#ffd4e6', '#ffffff', '#7af3b6'][Math.floor(Math.random() * 3)], 10));
                }
            }, 500);
        }
    }

    // --- Input Handling ---
    let isPointerDown = false;

    function handleInput(e, type) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;

        if (gameState !== 'PLAYING') return;

        if (type === 'down') {
            isPointerDown = true;
            for (let b of blemishes) {
                if (b.interact(x, y, true)) break;
            }
        } else if (type === 'move' && isPointerDown) {
            for (let b of blemishes) {
                b.interact(x, y, false);
            }
        } else if (type === 'up') {
            isPointerDown = false;
        }
    }

    // Unified Pointer Events
    canvas.addEventListener('pointerdown', e => {
        audioManager.unlock();
        handleInput(e, 'down');
    }, { passive: false });

    canvas.addEventListener('pointermove', e => {
        handleInput(e, 'move');
    }, { passive: false });

    canvas.addEventListener('pointerup', e => handleInput(e, 'up'), { passive: false });
    canvas.addEventListener('pointercancel', e => handleInput(e, 'up'), { passive: false });

    // UI Buttons
    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playStart();
        startScreen.classList.add('hidden');
        initLevel();
    });

    document.getElementById('next-level-btn').addEventListener('click', () => {
        audioManager.playStart();
        currentZone++;
        initLevel();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audioManager.pauseBgm();
        } else if (gameState === 'PLAYING') {
            audioManager.playBgm();
        }
    });

    // --- Main Loop ---
    function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
        lastTime = timestamp;
        if (scrubSfxCooldown > 0) scrubSfxCooldown -= dt * 1000;

        ctx.fillStyle = skinColor;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 16; i++) {
            const rx = Math.random() * width;
            const ry = Math.random() * height;
            const rs = Math.random() * 2.4;
            ctx.beginPath();
            ctx.arc(rx, ry, rs, 0, Math.PI * 2);
            ctx.fill();
        }

        if (gameState === 'PLAYING' || gameState === 'LEVEL_END') {
            for (let b of blemishes) {
                b.update(dt);
                b.draw(ctx);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
