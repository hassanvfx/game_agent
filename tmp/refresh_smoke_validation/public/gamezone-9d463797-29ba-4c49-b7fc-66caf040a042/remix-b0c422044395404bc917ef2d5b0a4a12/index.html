<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json using Orbitron + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg-color: #0a1024;
      --bg-glow: #111a3b;
      --grid-color: rgba(120, 209, 255, 0.12);
      --ui-bg: rgba(7, 15, 36, 0.78);
      --ui-bg-strong: rgba(12, 23, 52, 0.92);
      --accent: #78d1ff;
      --accent-strong: #9af7ff;
      --accent-soft: rgba(120, 209, 255, 0.18);
      --ink-color: #f5fbff;
      --ball-color: #ff4f9a;
      --goal-color: #5b7cff;
      --goal-glow: rgba(91, 124, 255, 0.32);
      --danger-color: #ff5e63;
      --panel-border: rgba(154, 247, 255, 0.55);
      --line-color: #d8f6ff;
      --title-font: 'Orbitron', 'Trebuchet MS', sans-serif;
      --ui-font: 'Rajdhani', 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at top, rgba(120, 209, 255, 0.18), transparent 34%),
        radial-gradient(circle at 20% 80%, rgba(255, 79, 154, 0.12), transparent 25%),
        linear-gradient(180deg, var(--bg-glow), var(--bg-color) 45%, #050814);
      font-family: var(--ui-font);
      color: var(--ink-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none; /* [agent-note][stage4] repaired: scoped touch suppression to gameplay surface so mobile UI taps still trigger */
    }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none; /* Let touches pass through to canvas when playing */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(5, 8, 20, 0.92), rgba(5, 8, 20, 0.2));
      pointer-events: auto;
    }

    .ink-meter-container {
      flex-grow: 1;
      margin: 0;
      height: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(154, 247, 255, 0.32);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 14px rgba(120, 209, 255, 0.14);
    }

    .ink-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 12px rgba(120, 209, 255, 0.7);
      transition: width 0.1s linear, background 0.2s ease;
    }

    .level-text {
      color: white;
      font-family: var(--title-font);
      font-size: clamp(15px, 3.5vw, 18px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(120, 209, 255, 0.45);
      white-space: nowrap;
    }

    .bottom-controls {
      padding: 14px 14px max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: auto;
    }

    .btn {
      background: linear-gradient(180deg, rgba(18, 34, 76, 0.95), rgba(8, 16, 38, 0.92));
      border: 1px solid var(--panel-border);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-family: var(--title-font);
      font-size: clamp(14px, 3.8vw, 17px);
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24), inset 0 0 0 1px rgba(255,255,255,0.05);
      transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
      min-width: 84px;
      text-align: center;
      text-transform: uppercase;
    }

    .btn:active {
      transform: scale(0.95);
      filter: brightness(1.08);
      box-shadow: 0 0 0 3px rgba(120, 209, 255, 0.12), 0 8px 16px rgba(0,0,0,0.22);
    }

    .btn-go {
      background: linear-gradient(180deg, var(--accent-strong), var(--accent));
      color: #07101f;
      border-color: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(120, 209, 255, 0.34), 0 10px 24px rgba(0, 0, 0, 0.24);
      min-width: 108px;
    }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      padding: 24px 18px;
      background:
        radial-gradient(circle at top, rgba(120, 209, 255, 0.16), transparent 32%),
        linear-gradient(180deg, rgba(5, 9, 22, 0.96), rgba(6, 12, 28, 0.94));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: opacity 0.3s;
      text-align: center;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    h1 {
      color: var(--accent-strong);
      font-family: var(--title-font);
      font-size: clamp(28px, 9vw, 48px);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 0 10px rgba(120, 209, 255, 0.5), 0 0 24px rgba(120, 209, 255, 0.2);
    }

    p {
      color: rgba(235, 246, 255, 0.82);
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 600;
      max-width: min(80%, 28rem);
      text-align: center;
      line-height: 1.5;
      margin: 0.3rem 0;
    }

    .big-btn {
      margin-top: 24px;
      padding: 15px 30px;
      font-size: clamp(16px, 4.8vw, 22px);
      font-family: var(--title-font);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--accent-strong), var(--accent));
      color: #07101f;
      border: 1px solid rgba(255,255,255,0.92);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(120, 209, 255, 0.3);
    }

    /* Tutorial overlay */
    #tutorial {
      position: absolute;
      top: 18%;
      width: 100%;
      padding: 0 20px;
      text-align: center;
      color: rgba(235, 246, 255, 0.72);
      font-family: var(--title-font);
      font-size: clamp(16px, 4.5vw, 24px);
      letter-spacing: 0.06em;
      pointer-events: none;
      z-index: 5;
      text-shadow: 0 0 10px rgba(120, 209, 255, 0.35);
      animation: pulse 2s infinite;
    }

    .feedback-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      overflow: hidden;
    }

    .feedback-gif {
      position: absolute;
      width: clamp(88px, 24vw, 160px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(154, 247, 255, 0.45);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.26);
      opacity: 0;
      transform: translateY(12px) scale(0.92);
      transition: opacity 0.22s ease, transform 0.22s ease;
      background: rgba(5, 10, 22, 0.55);
    }

    .feedback-gif.visible {
      opacity: 0.92;
      transform: translateY(0) scale(1);
    }

    #impactGif {
      right: 12px;
      top: 88px;
    }

    #resultGif {
      left: 12px;
      bottom: calc(88px + env(safe-area-inset-bottom));
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 0.9; transform: translateY(-3px); }
      100% { opacity: 0.3; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .top-bar {
        padding: 10px 10px 6px;
      }

      .bottom-controls {
        gap: 8px;
        padding-inline: 10px;
      }

      .btn {
        min-width: 0;
        flex: 1 1 0;
        padding-inline: 10px;
      }

      #impactGif {
        top: 74px;
        right: 8px;
      }

      #resultGif {
        left: 8px;
        bottom: calc(84px + env(safe-area-inset-bottom));
      }
    }

  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="level-text" id="levelDisplay">Zone 1</div>
      <div class="ink-meter-container">
        <div class="ink-fill" id="inkMeter"></div>
      </div>
    </div>
    
    <div id="tutorial" class="hidden">Draw rails to route the drone core!</div>

    <!-- [agent-note][stage3] resolved-gif: impact + result overlays -> catalogs/gifs.json -->
    <div class="feedback-layer" aria-hidden="true">
      <img
        id="impactGif"
        class="feedback-gif"
        alt=""
        src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp">
      <img
        id="resultGif"
        class="feedback-gif"
        alt=""
        src="https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp">
    </div>

    <div class="bottom-controls">
      <div class="btn" id="clearBtn">Erase</div>
      <div class="btn btn-go" id="goBtn">LAUNCH</div>
      <div class="btn" id="resetBtn">Reset</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="screen">
    <h1>NEON ROUTE</h1>
    <p>Draw rails to guide the drone core into the blue dock.</p>
    <p>Watch your charge meter.</p>
    <button class="big-btn" id="startBtn">START RUN</button>
  </div>

  <!-- Win Screen -->
  <div id="winScreen" class="screen hidden">
    <h1>DOCKED!</h1>
    <p>The drone core reached the dock.</p>
    <button class="big-btn" id="nextLevelBtn">Next Zone</button>
  </div>

  <!-- Game Over Screen -->
  <div id="loseScreen" class="screen hidden">
    <h1 style="color:var(--danger-color)">CORE LOST</h1>
    <p>The drone core drifted off-grid.</p>
    <button class="big-btn" id="retryLevelBtn">Retry Run</button>
  </div>

  <script>
    /**
     * Game State & Config
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const uiInkMeter = document.getElementById('inkMeter');
    const uiLevelDisplay = document.getElementById('levelDisplay');
    const startScreen = document.getElementById('startScreen');
    const winScreen = document.getElementById('winScreen');
    const loseScreen = document.getElementById('loseScreen');
    const tutorialText = document.getElementById('tutorial');
    const impactGif = document.getElementById('impactGif');
    const resultGif = document.getElementById('resultGif');

    // Buttons
    const startBtn = document.getElementById('startBtn');
    const nextLevelBtn = document.getElementById('nextLevelBtn');
    const retryLevelBtn = document.getElementById('retryLevelBtn');
    const clearBtn = document.getElementById('clearBtn');
    const goBtn = document.getElementById('goBtn');
    const resetBtn = document.getElementById('resetBtn');

    startBtn.addEventListener('click', startGame);
    nextLevelBtn.addEventListener('click', nextLevel);
    retryLevelBtn.addEventListener('click', resetLevel);
    clearBtn.addEventListener('click', clearLines);
    goBtn.addEventListener('click', toggleSimulation);
    resetBtn.addEventListener('click', resetLevel);

    // Physics Constants
    const GRAVITY = 0.5;
    const BOUNCE = 0.4;
    const FRICTION = 0.98;
    const BALL_RADIUS = 12;

    // Game Variables
    let width, height;
    let isSimulating = false;
    let isDrawing = false;
    let currentLevelIdx = 0;
    let animationId;
    let tutorialTimer;
    let impactCooldownUntil = 0;
    let warnedLowInk = false;

    // Entities
    let ball = { x: 0, y: 0, vx: 0, vy: 0, active: false };
    let goal = { x: 0, y: 0, w: 60, h: 60 };
    let obstacles = []; // {x, y, w, h}

    // Drawing
    let lines = []; // array of {p1: {x,y}, p2: {x,y}}
    let currentStroke = []; // points
    let maxInk = 1000;
    let usedInk = 0;

    // Levels
    const levels = [
      { // Level 1: Simple drop
        spawn: {x: 0.2, y: 0.1}, // % of screen
        goal: {x: 0.8, y: 0.8},
        obstacles: [],
        ink: 800
      },
      { // Level 2: Obstacle in middle
        spawn: {x: 0.1, y: 0.1},
        goal: {x: 0.9, y: 0.6},
        obstacles: [{x: 0.4, y: 0.3, w: 0.2, h: 0.05}],
        ink: 1000
      },
      { // Level 3: Zig Zag
        spawn: {x: 0.5, y: 0.1},
        goal: {x: 0.5, y: 0.85},
        obstacles: [
          {x: 0.2, y: 0.3, w: 0.3, h: 0.05},
          {x: 0.5, y: 0.5, w: 0.3, h: 0.05}
        ],
        ink: 1200
      },
      { // Level 4: The Gap
        spawn: {x: 0.1, y: 0.2},
        goal: {x: 0.9, y: 0.2},
        obstacles: [
          {x: 0.45, y: 0.4, w: 0.1, h: 0.6} // vertical wall
        ],
        ink: 1500
      }
    ];

    const media = {
      fonts: {
        title: 'Orbitron',
        ui: 'Rajdhani'
      },
      gifs: {
        impact: {
          src: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
          query: 'strong impact collision hit effect game gif'
        },
        result: {
          src: 'https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp',
          query: 'dramatic reveal unlock moment game gif'
        }
      },
      audio: {
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        drawBlocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        launch: 'https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3',
        collision: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
        clear: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3',
        reset: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
        win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        lose: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
        lowInk: 'https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3'
      }
    };

    // [agent-note][stage3] resolved-audio: bgm + sfx -> catalogs/audios.json with gesture-safe startup
    const audioManager = (() => {
      let unlocked = false;
      const sounds = new Map();

      function getSound(key, { loop = false, volume = 0.5 } = {}) {
        if (!sounds.has(key)) {
          const audio = new Audio(media.audio[key]);
          audio.preload = 'auto';
          audio.loop = loop;
          audio.volume = volume;
          sounds.set(key, audio);
        }
        const audio = sounds.get(key);
        audio.loop = loop;
        audio.volume = volume;
        return audio;
      }

      async function unlock() {
        if (unlocked) return;
        unlocked = true;
        try {
          const bgm = getSound('bgm', { loop: true, volume: 0.22 });
          bgm.muted = true;
          await bgm.play();
          bgm.pause();
          bgm.currentTime = 0;
          bgm.muted = false;
        } catch (err) {
          // Silent fail keeps controls responsive.
        }
      }

      function play(key, options = {}) {
        if (!unlocked) return;
        const {
          volume = 0.5,
          loop = false,
          restart = true
        } = options;

        try {
          const audio = getSound(key, { loop, volume });
          if (restart) audio.currentTime = 0;
          const playResult = audio.play();
          if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(() => {});
          }
        } catch (err) {
          // Ignore audio failures.
        }
      }

      function startLoop(key, options = {}) {
        play(key, { loop: true, restart: false, volume: options.volume ?? 0.22 });
      }

      function stop(key) {
        const audio = sounds.get(key);
        if (!audio) return;
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (err) {
          // Ignore audio failures.
        }
      }

      return { unlock, play, startLoop, stop };
    })();

    function primeMedia() {
      impactGif.src = media.gifs.impact.src;
      resultGif.src = media.gifs.result.src;
    }

    function flashGif(element, duration = 1200) {
      element.classList.add('visible');
      clearTimeout(element._hideTimer);
      element._hideTimer = setTimeout(() => {
        element.classList.remove('visible');
      }, duration);
    }

    function hideFeedback() {
      impactGif.classList.remove('visible');
      resultGif.classList.remove('visible');
      clearTimeout(impactGif._hideTimer);
      clearTimeout(resultGif._hideTimer);
    }

    function markInteraction() {
      audioManager.unlock();
      audioManager.startLoop('bgm', { volume: 0.2 });
    }

    [startBtn, nextLevelBtn, retryLevelBtn, clearBtn, goBtn, resetBtn].forEach((button) => {
      button.addEventListener('pointerdown', () => {
        markInteraction();
        audioManager.play('uiClick', { volume: 0.4 });
      }, { passive: true });
    });

    canvas.addEventListener('pointerdown', markInteraction, { passive: true });

    /**
     * Initialization & Resizing
     */
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      loadLevel(currentLevelIdx); // Reload to adjust positions
    }
    window.addEventListener('resize', resize);

    function init() {
      primeMedia();
      resize();
      bindInput();
      loop();
    }

    function showTutorial() {
      tutorialText.classList.remove('hidden');
      clearTimeout(tutorialTimer);
      tutorialTimer = setTimeout(() => tutorialText.classList.add('hidden'), 4000);
    }

    function startGame() {
      markInteraction();
      audioManager.play('start', { volume: 0.5 });
      startScreen.classList.add('hidden');
      currentLevelIdx = 0;
      loadLevel(0);
      showTutorial();
    }

    function loadLevel(idx) {
      if (idx >= levels.length) idx = 0; // Loop back
      currentLevelIdx = idx;

      const lvl = levels[idx];

      // Reset State
      isSimulating = false;
      goBtn.textContent = 'LAUNCH';
      lines = [];
      usedInk = 0;
      warnedLowInk = false;
      maxInk = lvl.ink;
      updateInkUI();
      uiLevelDisplay.textContent = `Zone ${idx + 1}`;

      // Set Positions scaled to screen
      ball.x = lvl.spawn.x * width;
      ball.y = lvl.spawn.y * height;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;

      goal.x = lvl.goal.x * width - (goal.w/2);
      goal.y = lvl.goal.y * height - (goal.h/2);

      obstacles = lvl.obstacles.map(obs => ({
        x: obs.x * width,
        y: obs.y * height,
        w: obs.w * width,
        h: obs.h * height
      }));

      // Hide overlays
      winScreen.classList.add('hidden');
      loseScreen.classList.add('hidden');
      hideFeedback();
    }

    function nextLevel() {
      loadLevel(currentLevelIdx + 1);
    }

    function resetLevel() {
      const lvl = levels[currentLevelIdx];
      ball.x = lvl.spawn.x * width;
      ball.y = lvl.spawn.y * height;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;
      isSimulating = false;
      goBtn.textContent = 'LAUNCH';

      winScreen.classList.add('hidden');
      loseScreen.classList.add('hidden');
      hideFeedback();
      audioManager.play('reset', { volume: 0.42 });
    }

    function clearLines() {
      if (isSimulating) resetLevel();
      lines = [];
      usedInk = 0;
      warnedLowInk = false;
      updateInkUI();
      audioManager.play('clear', { volume: 0.35 });
    }

    function toggleSimulation() {
      if (isSimulating) {
        resetLevel();
      } else {
        isSimulating = true;
        ball.active = true;
        goBtn.textContent = 'ABORT';
        tutorialText.classList.add('hidden');
        audioManager.play('launch', { volume: 0.45 });
      }
    }

    function updateInkUI() {
      const pct = Math.max(0, (1 - usedInk / maxInk) * 100);
      uiInkMeter.style.width = `${pct}%`;
      if (pct < 10) uiInkMeter.style.backgroundColor = '#f03e3e';
      else uiInkMeter.style.backgroundColor = '#4cc9f0';

      if (pct < 15 && !warnedLowInk && !isSimulating) {
        warnedLowInk = true;
        audioManager.play('lowInk', { volume: 0.3 });
      }
    }

    function triggerImpactFeedback() {
      const now = performance.now();
      if (now < impactCooldownUntil) return;
      impactCooldownUntil = now + 180;
      flashGif(impactGif, 700);
      audioManager.play('collision', { volume: 0.26 });
    }

    /**
     * Input Handling
     */
    function bindInput() {
      const start = (e) => {
        if (isSimulating) return;
        if (e.target !== canvas) return;
        e.preventDefault();
        isDrawing = true;
        const {x, y} = getPos(e);
        currentStroke = [{x, y}];
      };

      const move = (e) => {
        if (!isDrawing || isSimulating) return;
        e.preventDefault();
        const {x, y} = getPos(e);

        // Distance check
        const last = currentStroke[currentStroke.length - 1];
        const dist = Math.hypot(x - last.x, y - last.y);

        if (dist > 5) {
          if (usedInk + dist < maxInk) {
            currentStroke.push({x, y});
            usedInk += dist;
            updateInkUI();
          } else {
            audioManager.play('drawBlocked', { volume: 0.28 });
          }
        }
      };

      const end = () => {
        if (!isDrawing) return;
        isDrawing = false;

        // Convert stroke to line segments
        for (let i = 0; i < currentStroke.length - 1; i++) {
          lines.push({
            p1: currentStroke[i],
            p2: currentStroke[i+1]
          });
        }
        currentStroke = [];
      };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);

      canvas.addEventListener('touchstart', start, {passive: false});
      canvas.addEventListener('touchmove', move, {passive: false});
      window.addEventListener('touchend', end);
    }

    function getPos(e) {
      if (e.touches) {
        return {x: e.touches[0].clientX, y: e.touches[0].clientY};
      }
      return {x: e.clientX, y: e.clientY};
    }

    /**
     * Physics Engine
     */
    function updatePhysics() {
      if (!isSimulating || !ball.active) return;

      // Gravity
      ball.vy += GRAVITY;
      ball.vx *= FRICTION;
      ball.vy *= FRICTION;

      // Move
      let nextX = ball.x + ball.vx;
      let nextY = ball.y + ball.vy;

      // 1. Screen Bounds
      if (nextX < BALL_RADIUS) {
        nextX = BALL_RADIUS;
        ball.vx *= -BOUNCE;
        triggerImpactFeedback();
      }
      if (nextX > width - BALL_RADIUS) {
        nextX = width - BALL_RADIUS;
        ball.vx *= -BOUNCE;
        triggerImpactFeedback();
      }

      // 2. Obstacles (AABB)
      obstacles.forEach(obs => {
        let closestX = Math.max(obs.x, Math.min(nextX, obs.x + obs.w));
        let closestY = Math.max(obs.y, Math.min(nextY, obs.y + obs.h));

        let dx = nextX - closestX;
        let dy = nextY - closestY;
        let distSq = dx*dx + dy*dy;

        if (distSq < BALL_RADIUS * BALL_RADIUS) {
          triggerImpactFeedback();
          let dist = Math.sqrt(distSq);
          if (dist === 0) {
             ball.vx *= -1;
             ball.vy *= -1;
          } else {
             let nx = dx / dist;
             let ny = dy / dist;
             nextX = closestX + nx * BALL_RADIUS;
             nextY = closestY + ny * BALL_RADIUS;

             let dot = ball.vx * nx + ball.vy * ny;
             ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE;
             ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE;
          }
        }
      });

      // 3. User Lines (Segment Collision)
      lines.forEach(line => {
        const {p1, p2} = line;

        const ldx = p2.x - p1.x;
        const ldy = p2.y - p1.y;
        const lenSq = ldx*ldx + ldy*ldy;
        if (lenSq === 0) return;

        let t = ((nextX - p1.x) * ldx + (nextY - p1.y) * ldy) / lenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = p1.x + t * ldx;
        const cy = p1.y + t * ldy;

        const dx = nextX - cx;
        const dy = nextY - cy;
        const dist = Math.hypot(dx, dy);

        if (dist < BALL_RADIUS) {
          let nx = dx / dist;
          let ny = dy / dist;

          if (dist === 0) { nx = 0; ny = -1; }

          nextX = cx + nx * BALL_RADIUS;
          nextY = cy + ny * BALL_RADIUS;

          const dot = ball.vx * nx + ball.vy * ny;

          if (dot < 0) {
            ball.vx = (ball.vx - 2 * dot * nx) * BOUNCE;
            ball.vy = (ball.vy - 2 * dot * ny) * BOUNCE;
            ball.vx += nx * 0.1;
            ball.vy += ny * 0.1;
            triggerImpactFeedback();
          }
        }
      });

      ball.x = nextX;
      ball.y = nextY;

      checkWinLose();
    }

    function checkWinLose() {
      const inGoalX = ball.x > goal.x && ball.x < goal.x + goal.w;
      const inGoalY = ball.y > goal.y && ball.y < goal.y + goal.h;

      if (inGoalX && inGoalY) {
        ball.vx *= 0.8;
        ball.vy *= 0.8;
        if (Math.abs(ball.vx) < 0.5 && Math.abs(ball.vy) < 0.5) {
          endGame(true);
        }
      }

      if (ball.y > height + 50) {
        endGame(false);
      }
    }

    function endGame(win) {
      isSimulating = false;
      goBtn.textContent = 'LAUNCH';
      flashGif(resultGif, 1800);
      audioManager.play(win ? 'win' : 'lose', { volume: 0.45 });

      if (win) {
        winScreen.classList.remove('hidden');
      } else {
        loseScreen.classList.remove('hidden');
      }
    }

    /**
     * Rendering
     */
    function draw() {
       const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
       skyGradient.addColorStop(0, '#0f1a3b');
       skyGradient.addColorStop(0.52, '#0a1024');
       skyGradient.addColorStop(1, '#040713');
       ctx.fillStyle = skyGradient;
       ctx.fillRect(0, 0, width, height);

       const bloom = ctx.createRadialGradient(width * 0.5, height * 0.15, 0, width * 0.5, height * 0.15, width * 0.6);
       bloom.addColorStop(0, 'rgba(120, 209, 255, 0.18)');
       bloom.addColorStop(1, 'rgba(120, 209, 255, 0)');
       ctx.fillStyle = bloom;
       ctx.fillRect(0, 0, width, height);

       // Grid
       ctx.strokeStyle = 'rgba(120, 209, 255, 0.12)';
       ctx.lineWidth = 1;
       const gridSize = 40;
       ctx.beginPath();
       for(let x=0; x<width; x+=gridSize) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
       for(let y=0; y<height; y+=gridSize) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
       ctx.stroke();

       // Ambient lane bands
       ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
       ctx.lineWidth = 2;
       ctx.beginPath();
       for (let y = gridSize / 2; y < height; y += gridSize * 2) {
         ctx.moveTo(0, y);
         ctx.lineTo(width, y);
       }
       ctx.stroke();

       // Dock zone
       ctx.save();
       ctx.shadowColor = 'rgba(91, 124, 255, 0.5)';
       ctx.shadowBlur = 18;
       ctx.fillStyle = 'rgba(91, 124, 255, 0.22)';
       ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
       ctx.strokeStyle = '#5b7cff';
       ctx.lineWidth = 3;
       ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
       ctx.restore();

       ctx.strokeStyle = 'rgba(154, 247, 255, 0.7)';
       ctx.lineWidth = 1;
       ctx.strokeRect(goal.x + 6, goal.y + 6, goal.w - 12, goal.h - 12);

       // Goal Text
       ctx.fillStyle = '#cfe7ff';
       ctx.font = '12px Orbitron';
       ctx.fillText('DOCK', goal.x + 8, goal.y - 8);

       // Obstacles
       obstacles.forEach(o => {
         const obstacleGradient = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
         obstacleGradient.addColorStop(0, '#ff6a78');
         obstacleGradient.addColorStop(1, '#a41e39');
         ctx.fillStyle = obstacleGradient;
         ctx.fillRect(o.x, o.y, o.w, o.h);

         ctx.strokeStyle = 'rgba(255, 220, 220, 0.36)';
         ctx.lineWidth = 1.5;
         ctx.strokeRect(o.x, o.y, o.w, o.h);

         ctx.beginPath();
         ctx.strokeStyle = 'rgba(14, 4, 11, 0.34)';
         ctx.lineWidth = 2;
         for(let i=0; i<o.w+o.h; i+=12) {
           ctx.moveTo(o.x + i, o.y);
           ctx.lineTo(o.x + i - 12, o.y + 12);
         }
         ctx.stroke();
       });

       // Start Point
       const lvl = levels[currentLevelIdx];
       const spawnX = lvl.spawn.x * width;
       const spawnY = lvl.spawn.y * height;
       if (!isSimulating) {
         ctx.save();
         ctx.fillStyle = 'rgba(255, 79, 154, 0.14)';
         ctx.beginPath();
         ctx.arc(spawnX, spawnY, BALL_RADIUS + 14, 0, Math.PI*2);
         ctx.fill();

         ctx.strokeStyle = 'rgba(255, 79, 154, 0.42)';
         ctx.lineWidth = 2;
         ctx.beginPath();
         ctx.arc(spawnX, spawnY, BALL_RADIUS + 6, 0, Math.PI*2);
         ctx.stroke();
         ctx.restore();
       }

       // User Lines
       ctx.strokeStyle = '#d8f6ff';
       ctx.lineCap = 'round';
       ctx.lineJoin = 'round';
       ctx.lineWidth = 4;
       ctx.shadowColor = 'rgba(120, 209, 255, 0.45)';
       ctx.shadowBlur = 8;
       ctx.beginPath();
       lines.forEach(l => {
         ctx.moveTo(l.p1.x, l.p1.y);
         ctx.lineTo(l.p2.x, l.p2.y);
       });
       ctx.stroke();

       // Current Stroke
       if (currentStroke.length > 0) {
         ctx.beginPath();
         ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
         for(let i=1; i<currentStroke.length; i++) {
           ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
         }
         ctx.stroke();
       }
       ctx.shadowBlur = 0;

       // Ball
       const coreGradient = ctx.createRadialGradient(ball.x - 4, ball.y - 5, 2, ball.x, ball.y, BALL_RADIUS + 3);
       coreGradient.addColorStop(0, '#ffd2e7');
       coreGradient.addColorStop(0.4, '#ff6eb0');
       coreGradient.addColorStop(1, '#d91d73');
       ctx.save();
       ctx.shadowColor = 'rgba(255, 79, 154, 0.6)';
       ctx.shadowBlur = 18;
       ctx.fillStyle = coreGradient;
       ctx.beginPath();
       ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
       ctx.fill();
       ctx.restore();

       ctx.strokeStyle = 'rgba(255,255,255,0.65)';
       ctx.lineWidth = 1.5;
       ctx.beginPath();
       ctx.arc(ball.x, ball.y, BALL_RADIUS - 2, 0, Math.PI*2);
       ctx.stroke();

       ctx.fillStyle = 'rgba(255,255,255,0.7)';
       ctx.beginPath();
       ctx.arc(ball.x - 3, ball.y - 4, BALL_RADIUS/3, 0, Math.PI*2);
       ctx.fill();
    }

    function loop() {
      updatePhysics();
      draw();
      animationId = requestAnimationFrame(loop);
    }

    // Start
    init();

  </script>
</body>
