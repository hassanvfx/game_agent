        :root {
            --bg-base: #07000f;
            --bg-violet: #140a29;
            --panel-fill: rgba(18, 8, 34, 0.84);
            --panel-stroke: rgba(96, 240, 255, 0.32);
            --panel-shadow: rgba(0, 247, 255, 0.18);
            --hero-pink: #ff4bc1;
            --hero-cyan: #52f8ff;
            --hero-gold: #ffbe55;
            --hero-violet: #aa5dff;
            --text-main: #f5f7ff;
            --text-dim: #b8b6d8;
            --danger: #ff4d7b;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(82, 248, 255, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-violet) 0%, var(--bg-base) 100%);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* CRT / VHS Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            opacity: 0.5;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 20;
        }

        .vignette {
            background:
                radial-gradient(circle at center, rgba(0,0,0,0) 48%, rgba(0,0,0,0.82) 100%),
                radial-gradient(circle at 50% 12%, rgba(255, 75, 193, 0.16), transparent 26%);
            pointer-events: none;
            z-index: 21;
        }

        #game-container::before,
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 190, 85, 0.08), transparent 16%),
                radial-gradient(circle at 80% 10%, rgba(82, 248, 255, 0.08), transparent 18%),
                radial-gradient(circle at 52% 84%, rgba(170, 93, 255, 0.1), transparent 20%);
            z-index: 2;
        }

        #game-container::after {
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.6) 0 1px, transparent 1.5px);
            background-size: 120px 120px;
            opacity: 0.12;
            z-index: 3;
        }

        /* UI Panels */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(28, 17, 54, 0.94), var(--panel-fill)),
                radial-gradient(circle at top, rgba(82, 248, 255, 0.12), transparent 55%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 0 24px var(--panel-shadow),
                inset 0 0 0 1px rgba(255,255,255,0.06),
                inset 0 0 40px rgba(6, 2, 20, 0.5);
        }

        .neon-text {
            text-shadow: 0 0 6px currentColor, 0 0 18px currentColor;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4.5rem;
            height: 4.5rem;
            margin-bottom: 0.75rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.12);
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.24), transparent 32%),
                linear-gradient(145deg, rgba(255, 75, 193, 0.9), rgba(82, 248, 255, 0.7));
            box-shadow:
                0 0 24px rgba(82, 248, 255, 0.24),
                inset 0 -8px 18px rgba(0,0,0,0.2);
            font-size: 2rem;
        }

        .menu-subtitle,
        .hud-kicker,
        .results-kicker {
            color: var(--text-dim);
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .hud-shell {
            position: absolute;
            inset: 0;
        }

        .hud-panel {
            background: linear-gradient(180deg, rgba(8, 12, 24, 0.86), rgba(8, 12, 24, 0.35));
            border-bottom: 1px solid rgba(82, 248, 255, 0.14);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
        }

        .signal-meter-shell {
            padding: 0.45rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(9, 11, 22, 0.6);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.28);
        }

        .signal-meter-track {
            width: 6rem;
            height: 0.55rem;
            background: rgba(10, 12, 22, 0.9);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .signal-meter-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--hero-pink), var(--hero-gold), var(--hero-cyan));
            box-shadow: 0 0 16px rgba(255, 75, 193, 0.75);
            transition: width 75ms linear, opacity 75ms linear;
        }

        .combo-ring {
            min-width: 8rem;
            padding: 0.75rem 1rem 0.65rem;
            border-radius: 999px;
            background: rgba(6, 8, 20, 0.54);
            border: 1px solid rgba(82, 248, 255, 0.18);
            box-shadow: 0 0 26px rgba(82, 248, 255, 0.14);
        }

        /* Buttons */
        .btn-primary,
        .btn-secondary {
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9f4dff 0%, #ff4bc1 100%);
            border: 1px solid rgba(255, 199, 235, 0.6);
            box-shadow: 0 0 18px rgba(255, 75, 193, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 0 8px rgba(255, 75, 193, 0.4);
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #52f8ff 0%, #4f89ff 100%);
            border: 1px solid rgba(219, 255, 255, 0.85);
            box-shadow: 0 0 15px rgba(82, 248, 255, 0.26);
            color: #08223f;
        }

        .btn-secondary:active {
            transform: scale(0.96);
            filter: brightness(1.06);
        }

        .btn-muted {
            background: rgba(19, 23, 37, 0.9);
            color: rgba(184, 182, 216, 0.7);
            border: 1px solid rgba(100, 104, 134, 0.55);
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.3);
        }

        .rec-pill {
            background: rgba(255, 77, 123, 0.92);
            color: white;
            box-shadow: 0 0 20px rgba(255, 77, 123, 0.45);
        }

        .lane-hit-anim {
            animation: flashLane 0.15s ease-out forwards;
        }

        @keyframes flashLane {
            0% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        @media (max-width: 640px) {
            #main-menu,
            #results-screen {
                padding: 1.35rem;
                gap: 0.9rem;
            }

            .hero-badge {
                width: 3.75rem;
                height: 3.75rem;
                font-size: 1.7rem;
                margin-bottom: 0.5rem;
            }

            .signal-meter-track {
                width: 4.6rem;
            }

            .combo-ring {
                min-width: 6.4rem;
                padding: 0.6rem 0.8rem 0.55rem;
            }
        }
    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- CRT Overlays -->
        <div class="scanlines absolute inset-0"></div>
        <div class="vignette absolute inset-0"></div>


        <!-- [agent-note][stage3] resolved-gif: combo/fail overlays -> catalogs/gifs.json -->
        <div id="reaction-overlay" class="hidden absolute inset-x-0 top-[18%] z-20 flex justify-center pointer-events-none px-4">
            <div class="glass-panel rounded-2xl px-3 py-3 max-w-[11rem] sm:max-w-[12rem]">
                <img id="reaction-gif" src="" alt="" class="w-full h-auto rounded-xl border border-white/10 shadow-[0_0_24px_rgba(82,248,255,0.15)] object-cover">
                <div id="reaction-label" class="mt-2 text-center text-[10px] tracking-[0.32em] uppercase font-mono text-synth-cyan">Combo Pulse</div>
            </div>
        </div>

        <!-- Start/Menu Layer -->
        <div id="ui-layer" class="absolute inset-0 z-30 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Main Menu -->
            <div id="main-menu" class="glass-panel p-8 rounded-2xl text-center pointer-events-auto w-[85%] max-w-md flex flex-col gap-5 transform transition-all duration-300">
                <div class="mb-2">
                    <div class="hero-badge" aria-hidden="true">🎛️</div>
                    <h1 class="text-5xl font-display text-white neon-text tracking-tight">SIGNAL<span class="text-synth-cyan">GATE</span></h1>
                    <p class="menu-subtitle text-xs mt-2 font-mono">DJ HERO // TAP NOTES TO KEEP THE FEED LIVE</p>
                </div>

                <button id="btn-endless" class="btn-primary text-white font-bold py-4 px-6 rounded-lg text-xl uppercase tracking-widest font-display">
                    Endless Broadcast
                </button>

                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-record" class="btn-secondary font-bold py-3 px-2 rounded-lg text-sm uppercase tracking-wider font-mono">
                        Record Pattern
                    </button>
                    <button id="btn-play-custom" class="btn-muted font-bold py-3 px-2 rounded-lg text-sm uppercase tracking-wider font-mono" disabled>
                        No Pattern
                    </button>
                </div>
                
                <div class="text-[10px] text-gray-400 mt-2 tracking-[0.22em] uppercase">
                    Recommended: use headphones<br>Tap to start the signal
                </div>
            </div>

            <!-- Gameplay HUD -->
            <div id="game-hud" class="hidden absolute top-0 w-full h-full pointer-events-none hud-shell">
                <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
                <!-- Top Bar -->
                <div class="absolute top-0 w-full p-4 flex justify-between items-start hud-panel">
                    <div class="flex flex-col">
                        <span class="hud-kicker text-[10px]">Score</span>
                        <span id="score-display" class="text-3xl font-display text-white neon-text">0</span>
                    </div>

                    <!-- Music Gate Indicator -->
                    <div class="flex flex-col items-center">
                        <div class="hud-kicker text-[10px] mb-1">Feed</div>
                        <div class="signal-meter-shell">
                            <div id="signal-meter" class="signal-meter-track">
                                <div id="signal-bar" class="signal-meter-fill"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col items-end pointer-events-auto">
                        <button id="btn-quit" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded border border-white/20 text-xs font-bold backdrop-blur-sm">
                            EXIT
                        </button>
                    </div>
                </div>

                <!-- Combo Center -->
                <div class="absolute top-1/4 w-full text-center flex flex-col items-center justify-center opacity-0 transition-opacity duration-200" id="combo-container">
                    <div class="combo-ring">
                        <span id="combo-display" class="text-6xl font-display text-synth-cyan neon-text drop-shadow-xl">0</span>
                        <span class="block text-[11px] font-mono text-white tracking-[0.42em] mt-[-1px] uppercase">Combo</span>
                    </div>
                </div>

                <!-- Recording Indicator -->
                <div id="record-indicator" class="hidden absolute top-20 w-full flex justify-center">
                    <div class="rec-pill px-4 py-1 rounded-full text-xs font-bold animate-pulse border border-red-300">
                        ● REC
                    </div>
                </div>

                <!-- Stop Record Button -->
                <div id="record-controls" class="hidden absolute bottom-32 w-full flex justify-center pointer-events-auto">
                    <button id="btn-stop-record" class="bg-red-600 text-white px-8 py-3 rounded-full font-bold border-2 border-red-400 shadow-lg hover:scale-105 transition-transform">
                        STOP RECORDING
                    </button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-screen" class="hidden glass-panel p-8 rounded-2xl text-center pointer-events-auto w-[85%] max-w-md">
                <div class="hero-badge mx-auto" aria-hidden="true">📡</div>
                <h2 id="results-title" class="text-4xl font-display text-white mb-3 neon-text">COMPLETE</h2>
                
                <p class="results-kicker text-[11px] mb-5">Broadcast performance log</p>
                <div class="space-y-4 mb-8">
                    <div class="flex justify-between items-end border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-xs tracking-widest">FINAL SIGNAL</span>
                        <span id="res-score" class="text-2xl text-synth-cyan font-bold font-mono">0</span>
                    </div>
                    <div class="flex justify-between items-end border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-xs tracking-widest">BEST STREAK</span>
                        <span id="res-combo" class="text-2xl text-synth-pink font-bold font-mono">0</span>
                    </div>
                    <div class="flex justify-between items-end border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-xs tracking-widest">SYNC RATE</span>
                        <span id="res-acc" class="text-2xl text-white font-bold font-mono">0%</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-menu" class="flex-1 btn-primary text-white font-bold py-3 rounded-lg text-sm uppercase">
                        Menu
                    </button>
                    <button id="btn-replay" class="flex-1 btn-secondary font-bold py-3 rounded-lg text-sm uppercase">
                        Replay
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        // --- CONSTANTS & CONFIG ---
        const CONFIG = {
            lanes: 4, // 4 lanes is better for mobile thumbs
            colors: ['#ff00aa', '#00f7ff', '#00f7ff', '#ff00aa'],
            hitPosition: 0.85, // 85% down the screen
            audio: {
                bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                miss: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                stop: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3",
                lose: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                combo: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            },
            travelTime: 1.5, // Seconds from top to hit line
            gateDecay: 0.4, // Seconds for music to fade out after hit
            hitWindow: 0.15 // Seconds +/- for a valid hit
        };

        // --- STATE ---
        const STATE = {
            mode: 'MENU', // MENU, ENDLESS, RECORD, PLAY_CUSTOM
            active: false,
            score: 0,
            combo: 0,
            maxCombo: 0,
            hits: 0,
            misses: 0,
            
            // Audio State
            bgmVolume: 0,
            lastHitTime: 0,
            
            // Objects
            notes: [],
            particles: [],
            
            // Recording
            recordedNotes: [],
            recordStartTime: 0,
            
            // Custom Playback
            trackData: [],
            trackIndex: 0,
            
            // Endless
            nextSpawnTime: 0,
            
            // Input
            lanePressed: [false, false, false, false],

            // FX
            activeReaction: null,
            reactionTimer: null
        };

        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null,
            buffers: new Map(),
            htmlAudioPool: new Map(),
            bgmSource: null,
            bgmGain: null,
            bgmElement: null,
            masterGain: null,
            startedAt: 0,
            bgmStartOffset: 0,
            lastPlayed: new Map(),

            async init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.8;
                    this.masterGain.connect(this.ctx.destination);

                    const assets = Object.values(CONFIG.audio);
                    await Promise.all(assets.map((url) => this.ensureBuffer(url)));
                }
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume();
                }
            },

            ensureHtmlAudio(url) {
                let audio = this.htmlAudioPool.get(url);
                if (!audio) {
                    audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.crossOrigin = 'anonymous';
                    this.htmlAudioPool.set(url, audio);
                }
                return audio;
            },

            async ensureBuffer(url) {
                if (this.buffers.has(url)) return this.buffers.get(url);
                try {
                    const res = await fetch(url, { mode: 'cors' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const buf = await res.arrayBuffer();
                    const audioBuffer = await this.ctx.decodeAudioData(buf);
                    this.buffers.set(url, audioBuffer);
                    return audioBuffer;
                } catch (error) {
                    console.warn('audio-load-failed-fallback-html-audio', url, error);
                    this.buffers.set(url, null);
                    this.ensureHtmlAudio(url);
                    return null;
                }
            },

            playBGM(loop = true, forceVolume = false) {
                const buffer = this.buffers.get(CONFIG.audio.bgm);
                if (this.bgmSource || this.bgmElement) this.stopBGM();

                if (buffer) {
                    this.bgmSource = this.ctx.createBufferSource();
                    this.bgmSource.buffer = buffer;
                    this.bgmSource.loop = loop;

                    this.bgmGain = this.ctx.createGain();
                    this.bgmGain.gain.value = forceVolume ? 0.2 : 0;

                    this.bgmSource.connect(this.bgmGain);
                    this.bgmGain.connect(this.masterGain);

                    this.bgmSource.start(0);
                    this.startedAt = this.ctx.currentTime;
                    this.bgmStartOffset = 0;
                    return;
                }

                const audio = this.ensureHtmlAudio(CONFIG.audio.bgm);
                audio.loop = loop;
                audio.currentTime = 0;
                audio.volume = forceVolume ? 0.2 : 0;
                audio.play().catch((error) => console.warn('bgm-html-audio-play-failed', error));
                this.bgmElement = audio;
                this.startedAt = performance.now() / 1000;
                this.bgmStartOffset = 0;
            },

            stopBGM() {
                if (this.bgmSource) {
                    try { this.bgmSource.stop(); } catch(e){}
                    this.bgmSource = null;
                }
                if (this.bgmGain) {
                    this.bgmGain.disconnect();
                    this.bgmGain = null;
                }
                if (this.bgmElement) {
                    this.bgmElement.pause();
                    this.bgmElement.currentTime = 0;
                    this.bgmElement = null;
                }
            },

            play(url, { volume = 0.5, rate = 1, jitter = 0, debounceMs = 0 } = {}) {
                if (!this.ctx) return;

                const stamp = performance.now();
                const last = this.lastPlayed.get(url) ?? 0;
                if (debounceMs && stamp - last < debounceMs) return;
                this.lastPlayed.set(url, stamp);

                const buffer = this.buffers.get(url);
                if (buffer) {
                    const src = this.ctx.createBufferSource();
                    src.buffer = buffer;
                    src.playbackRate.value = rate + (jitter ? ((Math.random() * 2 - 1) * jitter) : 0);

                    const gain = this.ctx.createGain();
                    gain.gain.value = volume;

                    src.connect(gain);
                    gain.connect(this.masterGain);
                    src.start(0);
                    return;
                }

                const fallback = this.ensureHtmlAudio(url).cloneNode();
                fallback.volume = Math.max(0, Math.min(volume, 1));
                fallback.playbackRate = Math.max(0.5, rate + (jitter ? ((Math.random() * 2 - 1) * jitter) : 0));
                fallback.play().catch((error) => console.warn('sfx-html-audio-play-failed', url, error));
            },

            playHit() {
                this.play(CONFIG.audio.hit, { volume: 0.42, rate: 1, jitter: 0.05, debounceMs: 45 });
            },

            playMiss() {
                this.play(CONFIG.audio.miss, { volume: 0.28, rate: 1, jitter: 0.02, debounceMs: 90 });
            },

            playBonus() {
                this.play(CONFIG.audio.bonus, { volume: 0.38, rate: 1.04, jitter: 0.04, debounceMs: 80 });
            },

            playUI() {
                this.play(CONFIG.audio.ui, { volume: 0.24, rate: 1, jitter: 0.03, debounceMs: 80 });
            },

            playStart() {
                this.play(CONFIG.audio.start, { volume: 0.32, rate: 1, debounceMs: 140 });
            },

            playStop() {
                this.play(CONFIG.audio.stop, { volume: 0.26, rate: 1, debounceMs: 140 });
            },

            playResult(kind) {
                this.play(kind === 'win' ? CONFIG.audio.win : CONFIG.audio.lose, { volume: 0.36, rate: 1, debounceMs: 250 });
            },

            gateOpen() {
                if (this.bgmGain && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.bgmGain.gain.cancelScheduledValues(now);
                    this.bgmGain.gain.setValueAtTime(Math.max(this.bgmGain.gain.value, 0.08), now);
                    this.bgmGain.gain.linearRampToValueAtTime(0.2, now + 0.03);
                    this.bgmGain.gain.linearRampToValueAtTime(0, now + CONFIG.gateDecay);
                    STATE.bgmVolume = 1.0;
                    return;
                }

                if (!this.bgmElement) return;
                this.bgmElement.volume = 0.2;
                clearTimeout(this.bgmFadeTimer);
                this.bgmFadeTimer = setTimeout(() => {
                    if (this.bgmElement) this.bgmElement.volume = 0;
                }, CONFIG.gateDecay * 1000);
                STATE.bgmVolume = 1.0;
            },

            getTime() {
                if (this.ctx && this.bgmSource) {
                    return this.ctx.currentTime - this.startedAt;
                }
                if (this.bgmElement) {
                    return this.bgmElement.currentTime;
                }
                return 0;
            }
        };

        function showReaction(type, label, duration = 900) {
            const overlay = document.getElementById('reaction-overlay');
            const gif = document.getElementById('reaction-gif');
            const reactionLabel = document.getElementById('reaction-label');
            if (!overlay || !gif || !reactionLabel) return;

            const src = type === 'fail' ? CONFIG.gifs.fail : CONFIG.gifs.combo;
            gif.src = src;
            gif.alt = label;
            reactionLabel.textContent = label;
            overlay.classList.remove('hidden');

            clearTimeout(STATE.reactionTimer);
            STATE.activeReaction = type;
            STATE.reactionTimer = setTimeout(() => {
                overlay.classList.add('hidden');
                STATE.activeReaction = null;
            }, duration);
        }

        function hideReaction() {
            const overlay = document.getElementById('reaction-overlay');
            if (overlay) overlay.classList.add('hidden');
            clearTimeout(STATE.reactionTimer);
            STATE.activeReaction = null;
        }

        // --- CANVAS & RESIZE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, laneWidth;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            laneWidth = width / CONFIG.lanes;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- STORAGE ---
        function saveTrack() {
            localStorage.setItem('synthgate_track', JSON.stringify(STATE.recordedNotes));
            checkSavedTrack();
        }
        function loadTrack() {
            const raw = localStorage.getItem('synthgate_track');
            return raw ? JSON.parse(raw) : null;
        }
        function checkSavedTrack() {
            const track = loadTrack();
            const btn = document.getElementById('btn-play-custom');
            if (track && track.length > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-gray-800', 'text-gray-500', 'border-gray-700');
                btn.classList.add('btn-secondary', 'cursor-pointer');
                btn.innerText = "PLAY MY PATTERN";
            } else {
                btn.disabled = true;
                btn.classList.add('bg-gray-800', 'text-gray-500', 'border-gray-700');
                btn.classList.remove('btn-secondary', 'cursor-pointer');
                btn.innerText = "NO PATTERN";
            }
        }

        // --- GAME LOGIC ---
        async function startGame(mode) {
            await AudioEngine.init();
            
            STATE.mode = mode;
            STATE.active = true;
            STATE.score = 0;
            STATE.combo = 0;
            STATE.maxCombo = 0;
            STATE.hits = 0;
            STATE.misses = 0;
            STATE.notes = [];
            STATE.particles = [];
            STATE.lanePressed.fill(false);
            
            // UI
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            document.getElementById('record-indicator').classList.add('hidden');
            document.getElementById('record-controls').classList.add('hidden');
            
            updateScoreUI();
            hideReaction();
            AudioEngine.playStart();

            if (mode === 'RECORD') {
                STATE.recordedNotes = [];
                document.getElementById('record-indicator').classList.remove('hidden');
                document.getElementById('record-controls').classList.remove('hidden');
                // In record mode, music is ALWAYS ON so user can hear the beat
                AudioEngine.playBGM(true, true);
                STATE.recordStartTime = AudioEngine.ctx.currentTime;
            } 
            else if (mode === 'PLAY_CUSTOM') {
                STATE.trackData = loadTrack();
                STATE.trackData.sort((a,b) => a.time - b.time);
                STATE.trackIndex = 0;
                // In play mode, music is GATED (starts silent)
                AudioEngine.playBGM(false, false);
                AudioEngine.bgmSource.onended = () => {
                    if (STATE.mode === 'PLAY_CUSTOM' && STATE.active) finishGame();
                };
            }
            else {
                // Endless
                STATE.nextSpawnTime = AudioEngine.getTime() + 2.0;
                AudioEngine.playBGM(true, false);
            }

            requestAnimationFrame(gameLoop);
        }

        function stopRecording() {
            STATE.active = false;
            AudioEngine.playStop();
            AudioEngine.stopBGM();
            hideReaction();
            saveTrack();
            document.getElementById('game-hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function finishGame() {
            STATE.active = false;
            AudioEngine.stopBGM();
            
            const total = STATE.hits + STATE.misses;
            const acc = total > 0 ? Math.round((STATE.hits / total) * 100) : 0;
            
            document.getElementById('game-hud').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('res-score').innerText = STATE.score;
            document.getElementById('res-combo').innerText = STATE.maxCombo;
            document.getElementById('res-acc').innerText = acc + "%";
            const resultKind = STATE.mode === 'ENDLESS' ? "lose" : "win";
            document.getElementById('results-title').innerText = resultKind === "lose" ? "SIGNAL LOST" : "PATTERN LOCKED";
            AudioEngine.playResult(resultKind);
            showReaction(resultKind === 'lose' ? 'fail' : 'combo', resultKind === 'lose' ? 'Signal Lost' : 'Pattern Locked', 2200);
        }

        function spawnNote(lane, time) {
            STATE.notes.push({
                lane,
                targetTime: time,
                y: -100,
                hit: false,
                missed: false
            });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                STATE.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        function handleInput(lane, isDown) {
            if (!STATE.active) return;
            STATE.lanePressed[lane] = isDown;
            
            if (!isDown) return; // Only process touches, not releases

            const now = AudioEngine.getTime();

            if (STATE.mode === 'RECORD') {
                // Record the tap relative to BGM start
                STATE.recordedNotes.push({
                    lane,
                    time: now
                });
                AudioEngine.playHit();
                AudioEngine.playBonus();
                showReaction('combo', 'Recording Live', 650);
                createParticles((lane + 0.5) * laneWidth, height * CONFIG.hitPosition, CONFIG.colors[lane]);
                return;
            }

            // Gameplay Hit Detection
            // Find closest note in this lane
            const hitWindow = CONFIG.hitWindow;
            const hittableNotes = STATE.notes.filter(n => 
                n.lane === lane && !n.hit && !n.missed &&
                Math.abs(n.targetTime - now) <= hitWindow
            );

            if (hittableNotes.length > 0) {
                // Hit closest
                const note = hittableNotes.reduce((a, b) => 
                    Math.abs(a.targetTime - now) < Math.abs(b.targetTime - now) ? a : b
                );
                
                note.hit = true;
                
                // TRIGGER THE MUSIC GATE
                AudioEngine.gateOpen();
                AudioEngine.playHit();
                
                // Score & FX
                STATE.score += 100 + (STATE.combo * 10);
                STATE.combo++;
                if (STATE.combo > 0 && STATE.combo % 5 === 0) {
                    AudioEngine.playBonus();
                    showReaction('combo', `Combo x${STATE.combo}`, 800);
                }
                STATE.hits++;
                if (STATE.combo > STATE.maxCombo) STATE.maxCombo = STATE.combo;
                
                createParticles((lane + 0.5) * laneWidth, height * CONFIG.hitPosition, CONFIG.colors[lane]);
                updateScoreUI();

                // Combo Animation
                const comboEl = document.getElementById('combo-container');
                comboEl.style.opacity = '1';
                comboEl.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    comboEl.style.transform = 'scale(1)';
                    if(STATE.combo < 2) comboEl.style.opacity = '0'; // Hide if low combo
                }, 100);

            } else {
                AudioEngine.playMiss();
                showReaction('fail', 'Off Beat', 700);
            }
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = STATE.score;
            document.getElementById('combo-display').innerText = STATE.combo;
        }

        // --- MAIN LOOP ---
        function gameLoop() {
            if (!STATE.active) return;

            const now = AudioEngine.getTime();
            const hitY = height * CONFIG.hitPosition;
            
            // 1. Spawning
            if (STATE.mode === 'ENDLESS') {
                if (now > STATE.nextSpawnTime) {
                    const lane = Math.floor(Math.random() * CONFIG.lanes);
                    spawnNote(lane, now + CONFIG.travelTime);
                    // Rhythmic spawning
                    const beat = 0.428; // approx 140bpm
                    STATE.nextSpawnTime = now + beat * (Math.random() > 0.7 ? 2 : 1);
                }
            }
            else if (STATE.mode === 'PLAY_CUSTOM') {
                while (STATE.trackIndex < STATE.trackData.length) {
                    const nextNote = STATE.trackData[STATE.trackIndex];
                    // Spawn if it should arrive in travelTime seconds
                    if (nextNote.time <= now + CONFIG.travelTime) {
                        spawnNote(nextNote.lane, nextNote.time);
                        STATE.trackIndex++;
                    } else {
                        break;
                    }
                }
            }

            // 2. Update Notes
            // Pixels per second speed
            const speed = hitY / CONFIG.travelTime;

            for (let i = STATE.notes.length - 1; i >= 0; i--) {
                const note = STATE.notes[i];
                
                if (note.hit) {
                    STATE.notes.splice(i, 1);
                    continue;
                }

                // Calculate Y position
                // If now == targetTime, Y = hitY
                note.y = hitY - (note.targetTime - now) * speed;

                // Check Miss
                if (note.y > hitY + height * 0.15) {
                    note.missed = true;
                    STATE.combo = 0;
                    STATE.misses++;
                    document.getElementById('combo-container').style.opacity = '0';
                    STATE.notes.splice(i, 1);
                    AudioEngine.playMiss();
                    showReaction('fail', 'Feed Dropped', 850);
                }
            }

            // 3. Update Visual Gate Meter
            if (AudioEngine.bgmGain) {
                // We can't read the exact gain value easily from AudioParam in all browsers without analyzer
                // So we approximate based on time since gateOpen
                // This is purely visual
                let visualVol = 0;
                if (STATE.mode === 'RECORD') visualVol = 1;
                else if (AudioEngine.bgmGain.gain.value) { 
                     // This property reads the base value, not the computed ramp value in some browsers
                     // Let's use a simple decay logic for the UI bar
                }
            }
            // Simpler UI update:
            const bar = document.getElementById('signal-bar');
            if (STATE.mode === 'RECORD') {
                bar.style.width = '100%';
                bar.style.opacity = 0.5 + Math.random()*0.5;
            } else {
                // If gain was set recently
                // We don't have exact gain, but we know when we hit
                // Use the last hit time to estimate volume
                // Not tracked perfectly in state, let's just use a decay visual
                // Actually, we can just use the fact that we set a ramp
                // It's fine to just animate CSS based on hits.
                // Let's degrade the width every frame
                let currentW = parseFloat(bar.style.width) || 0;
                if (currentW > 0) currentW -= 5;
                if (currentW < 0) currentW = 0;
                bar.style.width = currentW + '%';
            }

            // 4. Draw
            draw(now, hitY);

            requestAnimationFrame(gameLoop);
        }

        // Override gateOpen to update UI
        const originalGate = AudioEngine.gateOpen;
        AudioEngine.gateOpen = function() {
            originalGate.call(AudioEngine);
            const bar = document.getElementById('signal-bar');
            bar.style.width = '100%';
            bar.style.opacity = '1';
        };

        function draw(now, hitY) {
            // Background
            ctx.fillStyle = '#090014';
            ctx.fillRect(0, 0, width, height);

            // Moving Grid Floor
            // Perspective grid
            const horizon = height * 0.3;
            const timeOffset = (now * 100) % 40;
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(189, 0, 255, 0.15)';
            ctx.lineWidth = 1;

            // Vertical lines (perspective)
            for (let i = 0; i <= CONFIG.lanes; i++) {
                const x = i * laneWidth;
                // Draw line from bottom to vanishing point (center top approx)
                // Actually just parallel for this 2D style is cleaner for gameplay
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            ctx.stroke();

            // Horizontal moving lines
            for (let y = 0; y < height; y += 40) {
                const drawY = y + timeOffset;
                if(drawY > height) continue;
                ctx.beginPath();
                ctx.moveTo(0, drawY);
                ctx.lineTo(width, drawY);
                ctx.strokeStyle = `rgba(0, 247, 255, ${0.05 + (drawY/height)*0.1})`;
                ctx.stroke();
            }

            // Hit Line
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f7ff';
            ctx.strokeStyle = '#00f7ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, hitY);
            ctx.lineTo(width, hitY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Lane Presses (Feedback)
            for (let i = 0; i < CONFIG.lanes; i++) {
                if (STATE.lanePressed[i]) {
                    const x = i * laneWidth;
                    // Gradient beam
                    const grad = ctx.createLinearGradient(x, hitY, x, 0);
                    grad.addColorStop(0, CONFIG.colors[i]);
                    grad.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(x, 0, laneWidth, hitY);
                    
                    // Hit flash
                    ctx.fillStyle = '#fff';
                    ctx.globalAlpha = 0.5;
                    ctx.fillRect(x, hitY - 10, laneWidth, 20);
                    ctx.globalAlpha = 1.0;
                }
            }

            // Notes
            for (const note of STATE.notes) {
                const x = note.lane * laneWidth;
                const color = CONFIG.colors[note.lane];
                const w = laneWidth * 0.7;
                const margin = laneWidth * 0.15;
                const h = laneWidth * 0.3; // Note height

                // Note Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = color;
                ctx.fillStyle = color;
                
                // Draw Note
                // Rounded Rect
                ctx.beginPath();
                ctx.roundRect(x + margin, note.y - h/2, w, h, 8);
                ctx.fill();
                
                // Inner White Core
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(x + margin + 4, note.y - h/2 + 4, w - 8, h - 8, 4);
                ctx.fill();
            }

            // Particles
            for (let i = STATE.particles.length - 1; i >= 0; i--) {
                const p = STATE.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                
                if (p.life <= 0) {
                    STATE.particles.splice(i, 1);
                    continue;
                }
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- INPUT BINDINGS ---
        function bindInput() {
            const handle = (e, isDown) => {
                e.preventDefault();
                const touches = e.changedTouches;
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    // Simple lane detection
                    const lane = Math.floor(t.clientX / laneWidth);
                    if (lane >= 0 && lane < CONFIG.lanes) {
                        handleInput(lane, isDown);
                    }
                }
            };
            
            canvas.addEventListener('touchstart', (e) => handle(e, true), { passive: false });
            canvas.addEventListener('touchend', (e) => handle(e, false), { passive: false });
            // Handle cancel/leave as up
            canvas.addEventListener('touchcancel', (e) => handle(e, false), { passive: false });
        }
        bindInput();

        // --- UI BINDINGS ---
        document.getElementById('btn-endless').addEventListener('click', () => startGame('ENDLESS'));
        
        document.getElementById('btn-record').addEventListener('click', () => {
             if(confirm("Overwrite previous pattern?")) startGame('RECORD');
        });
        
        document.getElementById('btn-play-custom').addEventListener('click', () => {
            AudioEngine.init().then(() => AudioEngine.playUI()).catch(() => {});
            startGame('PLAY_CUSTOM');
        });
        
        document.getElementById('btn-stop-record').addEventListener('click', () => {
            AudioEngine.init().then(() => AudioEngine.playUI()).catch(() => {});
            stopRecording();
        });
        
        document.getElementById('btn-quit').addEventListener('click', () => {
            AudioEngine.init().then(() => AudioEngine.playStop()).catch(() => {});
            STATE.active = false;
            AudioEngine.stopBGM();
            hideReaction();
            document.getElementById('game-hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        });

        const resetToMenu = () => {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        };

        document.getElementById('btn-menu').addEventListener('click', () => {
            AudioEngine.init().then(() => AudioEngine.playUI()).catch(() => {});
            hideReaction();
            resetToMenu();
        });
        document.getElementById('btn-replay').addEventListener('click', () => {
            AudioEngine.init().then(() => AudioEngine.playUI()).catch(() => {});
            hideReaction();
            startGame(STATE.mode);
        });

        // [agent-note][stage3] resolved-audio: bgm + hit/miss/bonus/ui/result cues -> catalogs/audios.json
        // Init
        document.querySelectorAll('button').forEach((button) => {
            button.addEventListener('pointerdown', () => {
                AudioEngine.init().then(() => AudioEngine.playUI()).catch(() => {});
            }, { passive: true });
        });

        checkSavedTrack();

    </script>
</body>
</html>
