<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Intercept: Gridline 30</title>
    <!-- [agent-note][stage4] preserved-font-remap: display -> Orbitron | ui -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050510;
            --bg-deep: #09061b;
            --panel: rgba(10, 15, 30, 0.8);
            --panel-strong: rgba(18, 24, 46, 0.92);
            --border: rgba(0, 243, 255, 0.3);
            --cyan: #00f3ff;
            --cyan-soft: #b6fbff;
            --violet: #9b7cff;
            --violet-soft: #d9c8ff;
            --gray: #8a93a8;
            --white: #ffffff;
            --danger: #ff0055;
            --gold: #ffd166;
            --font-display: 'Orbitron', system-ui, sans-serif;
            --font-ui: 'Rajdhani', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top, rgba(0, 243, 255, 0.09), transparent 34%),
                radial-gradient(circle at 50% 18%, rgba(155, 124, 255, 0.13), transparent 36%),
                linear-gradient(180deg, var(--bg-deep), var(--bg));
            overflow: hidden;
            font-family: var(--font-ui);
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            color: var(--white);
            letter-spacing: 0.03em;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(20, 28, 56, 0.92), rgba(8, 12, 24, 0.78)),
                var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            box-shadow:
                0 0 18px rgba(0, 243, 255, 0.12),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .neon-text {
            text-shadow:
                0 0 8px rgba(0, 243, 255, 0.8),
                0 0 18px rgba(155, 124, 255, 0.34);
        }

        .action-btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.16s ease, border-color 0.16s ease;
            touch-action: manipulation;
            transform: translateZ(0);
            cursor: pointer;
        }

        .action-btn:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        .action-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 25%, rgba(255, 255, 255, 0.22) 50%, transparent 75%);
            transform: translateX(-120%);
            transition: transform 0.28s ease;
            pointer-events: none;
        }

        .action-btn:hover::after,
        .action-btn:focus-visible::after {
            transform: translateX(120%);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding:
                max(16px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(16px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .steer-zone {
            position: absolute;
            inset-block: 0;
            right: 0;
            width: 50%;
            background: radial-gradient(circle at center, rgba(0,243,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 0;
        }

        .steer-active .steer-zone {
            opacity: 1;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        .hud-card {
            padding: 10px 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .hud-label {
            font-size: 11px;
            color: var(--cyan-soft);
            letter-spacing: 0.28em;
            font-weight: 600;
        }

        .hud-value {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            font-family: var(--font-display);
            text-shadow: 0 0 14px rgba(0, 243, 255, 0.2);
        }

        .hud-unit {
            font-size: 0.8rem;
            margin-left: 4px;
            color: var(--gray);
        }

        #mission-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            font-family: var(--font-display);
            color: var(--violet-soft);
            text-shadow: 0 0 18px rgba(155, 124, 255, 0.32);
        }

        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(0, 243, 255, 0.08), transparent 44%),
                rgba(2, 3, 9, 0.82);
            backdrop-filter: blur(6px);
            z-index: 50;
        }

        .start-panel {
            text-align: center;
            padding: 24px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 20px;
            background:
                linear-gradient(180deg, rgba(9, 14, 32, 0.92), rgba(4, 7, 16, 0.88));
            box-shadow:
                0 0 30px rgba(0, 243, 255, 0.14),
                0 0 0 1px rgba(155, 124, 255, 0.16);
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }

        .start-panel::before,
        .start-panel::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .start-panel::before {
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(0, 243, 255, 0.16), transparent 34%),
                radial-gradient(circle at bottom left, rgba(155, 124, 255, 0.2), transparent 38%);
            opacity: 0.9;
        }

        .start-panel::after {
            inset: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
        }

        .start-panel > * {
            position: relative;
            z-index: 1;
        }

        .start-title {
            margin: 0 0 8px;
            font-size: clamp(2.5rem, 10vw, 4.2rem);
            font-weight: 700;
            line-height: 0.95;
            color: transparent;
            background: linear-gradient(180deg, #fff, #99f6ff 48%, #8b5cf6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-transform: uppercase;
            font-family: var(--font-display);
        }

        .start-subtitle {
            margin: 0 0 12px;
            font-size: 0.95rem;
            color: var(--cyan-soft);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .start-instruction {
            margin: 0 0 22px;
            font-size: 1.05rem;
            color: #d7faff;
            line-height: 1.3;
            max-width: 30ch;
            margin-inline: auto;
        }

        .primary-btn {
            padding: 14px 28px;
            background: linear-gradient(180deg, #0ea5e9, #2563eb);
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 12px;
            border: 1px solid #7dd3fc;
            box-shadow:

                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-family: var(--font-display);
        }

        #game-controls {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            left: max(16px, env(safe-area-inset-left));
            width: min(160px, calc(100vw - max(32px, env(safe-area-inset-left) + env(safe-area-inset-right))));
            z-index: 40;
        }

        #game-controls.hidden,
        #start-screen.hidden {
            display: none;
        }

        .controls-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .support-label {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 2px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: var(--font-display);
        }

        .siren-btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border-left: 4px solid #ef4444;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.15);
        }

        .siren-title {
            color: var(--white);
            font-weight: 700;
            font-size: 1rem;
            line-height: 1;
            text-transform: uppercase;
            font-family: var(--font-display);
            letter-spacing: 0.08em;
        }

        .siren-caption,
        .steer-copy {
            font-size: 10px;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
        }

        .steer-copy {
            text-align: left;
            margin-top: 4px;
        }

        .gif-overlay {
            position: absolute;
            right: 12px;
            width: min(26vw, 132px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(6, 10, 22, 0.68);
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.14);
            overflow: hidden;
            opacity: 0;
            transform: translate3d(24px, 0, 0) scale(0.9);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 25;
        }

        .gif-overlay.visible {
            opacity: 0.88;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .gif-overlay img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        #gif-alert {
            top: 92px;
        }

        #gif-impact {
            top: 238px;
        }

        .gif-tag {
            position: absolute;
            inset-inline: 8px;
            bottom: 8px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(5, 8, 18, 0.76);
            color: var(--white);
            font-family: var(--font-display);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
            }

            .hud-card {
                padding: 9px 12px;
            }

            .hud-value {
                font-size: 2rem;
            }

            #mission-name {
                font-size: 0.95rem;
                letter-spacing: 0.12em;
            }

            .start-panel {
                margin: 0 12px;
                padding: 20px;
            }

            #game-controls {
                width: 148px;
                bottom: 16px;
                left: 12px;
            }

            .gif-overlay {
                right: 8px;
                width: 92px;
            }

            #gif-alert {
                top: 88px;
            }

            #gif-impact {
                top: 192px;
            }

            .gif-tag {
                font-size: 0.56rem;
                padding: 3px 6px;
            }
        }
    </style>
</head>

<script>
window.gameConfig = {
    heroSpeed: 15,
    themeColor: "#00f3ff",
    gameTitle: "GRIDLINE 30"
};

window.gameConfigDefs = {
    "heroSpeed": { "type": "number", "label": "Intercept Speed", "value": 15, "min": 10, "max": 30 },
    "themeColor": { "type": "color", "label": "Beacon Color", "value": "#00f3ff" },
    "gameTitle": { "type": "text", "label": "Callsign", "value": "GRIDLINE 30" }
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') document.getElementById('mission-name').innerText = val;
    }
};

const AudioSys = {
    ctx: null,
    buffers: {},
    muted: false,
    sirenOsc: null,
    sirenLFO: null,
    sirenGain: null,
    bgmSource: null,
    bgmGain: null,
    lastPlayed: {},
    isReady: false,

    init() {
        if (this.ctx) return;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        ['bgm_main', 'sfx_alert', 'sfx_hit', 'sfx_ui', 'sfx_start'].forEach(id => {
            const el = document.getElementById(id);
            if (el && el.src) {
                fetch(el.src)
                    .then(r => r.arrayBuffer())
                    .then(b => this.ctx.decodeAudioData(b))
                    .then(data => this.buffers[id] = data)
                    .catch(() => {});
            }
        });
    },

    async unlock() {
        this.init();
        if (!this.ctx) return;
        try {
            if (this.ctx.state === 'suspended') {
                await this.ctx.resume();
            }
            this.isReady = true;
        } catch (_) {}
    },

    resume() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.playBGM();
    },

    playBGM() {
        if (this.muted || !this.ctx || !this.buffers['bgm_main']) return;
        if (this.bgmSource) return;

        const src = this.ctx.createBufferSource();
        src.buffer = this.buffers['bgm_main'];
        src.loop = true;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.2;

        src.connect(gain).connect(this.ctx.destination);
        src.start(0);

        src.onended = () => {
            if (this.bgmSource === src) {
                this.bgmSource = null;
                this.bgmGain = null;
            }
        };

        this.bgmSource = src;
        this.bgmGain = gain;
    },

    stopBGM() {
        if (!this.bgmSource) return;
        try {
            this.bgmSource.stop();
        } catch (_) {}
        this.bgmSource = null;
        this.bgmGain = null;
    },

    playSiren() {
        if (this.muted || !this.ctx) return;
        if (this.sirenOsc) return;

        const t = this.ctx.currentTime;

        this.sirenOsc = this.ctx.createOscillator();
        this.sirenOsc.type = 'sawtooth';
        this.sirenOsc.frequency.value = 800;

        this.sirenLFO = this.ctx.createOscillator();
        this.sirenLFO.type = 'sine';
        this.sirenLFO.frequency.value = 2;

        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 400;

        this.sirenGain = this.ctx.createGain();
        this.sirenGain.gain.value = 0.12;

        this.sirenLFO.connect(lfoGain);
        lfoGain.connect(this.sirenOsc.frequency);

        this.sirenOsc.connect(this.sirenGain);
        this.sirenGain.connect(this.ctx.destination);

        this.sirenOsc.start(t);
        this.sirenLFO.start(t);
    },

    stopSiren() {
        if (this.sirenOsc) {
            const t = this.ctx.currentTime;
            try {
                this.sirenGain?.gain.cancelScheduledValues(t);
                this.sirenGain?.gain.setValueAtTime(this.sirenGain.gain.value, t);
                this.sirenGain?.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
                this.sirenOsc.stop(t + 0.12);
                this.sirenLFO.stop(t + 0.12);
            } catch (_) {}
            this.sirenOsc = null;
            this.sirenLFO = null;
        }
    },

    toggleSiren() {
        if (this.sirenOsc) this.stopSiren();
        else this.playSiren();
    },

    playSFX(id, cooldown = 120, volume = 0.5) {
        if (this.muted || !this.ctx) return;

        const now = performance.now();
        if (this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
        this.lastPlayed[id] = now;

        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.buffers[id];
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            src.connect(gain).connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthFallback(id, volume);
        }
    },

    synthFallback(type, volume = 0.4) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.ctx.destination);

        const t = this.ctx.currentTime;
        if (type === 'sfx_hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(70, t + 0.18);
            gain.gain.setValueAtTime(volume, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
            osc.start(t);
            osc.stop(t + 0.22);
        } else if (type === 'sfx_alert') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(720, t);
            osc.frequency.exponentialRampToValueAtTime(420, t + 0.14);
            gain.gain.setValueAtTime(volume * 0.7, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
            osc.start(t);
            osc.stop(t + 0.18);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(360, t + 0.12);
            gain.gain.setValueAtTime(volume * 0.6, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
            osc.start(t);
            osc.stop(t + 0.16);
        }
    }
};

const FxOverlay = {
    timers: new Map(),

    flash(id, duration = 1100) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(this.timers.get(id));
        this.timers.set(id, setTimeout(() => {
            el.classList.remove('visible');
        }, duration));
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const distVal = document.getElementById('dist-val');

let state = {
    active: false,
    t: 0,
    speed: 0,
    roadOffset: 0,
    shake: 0,
    lastTime: 0,
    distance: 30,
    nearMissPulseAt: 0,
    lockPulseAt: 0
};

let player = { x: 0.5, y: 0.85 };
let thief = { x: 0.5, y: 0.35, offset: 0 };
let houses = [];
let traffic = [];

let input = { active: false, startX: 0, dragX: 0 };

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function init() {
    AudioSys.init();
    resize();
    window.addEventListener('resize', resize);

    document.getElementById('btn-start').addEventListener('click', async () => {
        await AudioSys.unlock();
        AudioSys.playSFX('sfx_ui', 60, 0.42);
        startGame();
    });

    document.getElementById('btn-siren').addEventListener('pointerdown', async (e) => {
        e.stopPropagation();
        await AudioSys.unlock();
        AudioSys.playSFX('sfx_ui', 60, 0.32);
        AudioSys.toggleSiren();
    });

    canvas.addEventListener('pointerdown', async e => {
        input.active = true;
        input.startX = e.clientX;
        input.dragX = 0;
        document.body.classList.add('steer-active');
        if (state.active) {
            await AudioSys.unlock();
            AudioSys.resume();
        }
    }, { passive: false });

    window.addEventListener('pointermove', e => {
        if (!input.active) return;
        input.dragX = e.clientX - input.startX;
        input.startX = e.clientX;
        e.preventDefault();
    }, { passive: false });

    const endInput = () => {
        input.active = false;
        document.body.classList.remove('steer-active');
    };
    window.addEventListener('pointerup', endInput);
    window.addEventListener('pointercancel', endInput);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            AudioSys.stopSiren();
            AudioSys.stopBGM();
        } else if (state.active) {
            AudioSys.resume();
        }
    });

    requestAnimationFrame(loop);
}

function startGame() {
    state.active = true;
    state.speed = 0;
    state.t = 0;
    state.shake = 0;
    state.lastTime = 0;
    state.distance = 30;
    state.nearMissPulseAt = 0;
    state.lockPulseAt = 0;
    houses = [];
    traffic = [];
    player.x = 0.5;
    thief.x = 0.5;

    for (let i = 0; i < 20; i++) {
        spawnHouse(i * 50);
    }

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-controls').classList.remove('hidden');
    distVal.textContent = state.distance.toFixed(0);

    AudioSys.resume();
    AudioSys.playSFX('sfx_start', 60, 0.5);
    AudioSys.playSiren();
    FxOverlay.flash('gif-alert', 1300);
}

function spawnHouse(zStart) {
    houses.push({ side: -1, z: zStart || 1000, h: 50 + Math.random() * 100 });
    houses.push({ side: 1, z: zStart || 1000, h: 50 + Math.random() * 100 });
}

function spawnTraffic() {
    if (Math.random() > 0.05) return;
    traffic.push({
        x: Math.random() * 0.8 + 0.1,
        y: -0.2,
        speed: state.speed * 0.5,
        color: ['#ffcc00', '#ffffff', '#888888'][Math.floor(Math.random() * 3)]
    });
}

function update(dt) {
    if (!state.active) return;

    state.t += dt;

    const targetSpeed = window.gameConfig.heroSpeed * 20;
    state.speed += (targetSpeed - state.speed) * dt;

    if (input.active) {
        player.x += (input.dragX / window.innerWidth) * 3.0;
    }
    player.x = Math.max(0.15, Math.min(0.85, player.x));

    thief.offset = Math.sin(state.t * 1.5) * 0.4;
    let thiefTargetX = player.x + thief.offset * 0.5;
    thief.x += (thiefTargetX - thief.x) * dt * 1.5;
    thief.x = Math.max(0.15, Math.min(0.85, thief.x));

    state.distance = Math.max(0, 30 - (Math.abs(player.x - thief.x) * 34));
    distVal.textContent = state.distance.toFixed(0);

    const gap = Math.abs(player.x - thief.x);
    const now = performance.now();

    if (gap > 0.23 && now - state.nearMissPulseAt > 1800) {
        state.nearMissPulseAt = now;
        AudioSys.playSFX('sfx_alert', 500, 0.34);
        FxOverlay.flash('gif-alert', 1000);
    } else if (gap < 0.08 && now - state.lockPulseAt > 950) {
        state.lockPulseAt = now;
        AudioSys.playSFX('sfx_hit', 220, 0.28);
        state.shake = 4;
        FxOverlay.flash('gif-impact', 820);
    }

    let moveZ = state.speed * dt * 20;

    for (let i = houses.length - 1; i >= 0; i--) {
        houses[i].z -= moveZ;
        if (houses[i].z < 10) {
            houses.splice(i, 1);
            spawnHouse(1000);
        }
    }

    for (let i = traffic.length - 1; i >= 0; i--) {
        let t = traffic[i];
        t.y += (state.speed - t.speed) * dt * 0.005;
        if (t.y > 1.2) traffic.splice(i, 1);
    }
    if (traffic.length < 3) spawnTraffic();

    state.shake *= 0.9;
}

function draw() {
    const W = canvas.width / (window.devicePixelRatio || 1);
    const H = canvas.height / (window.devicePixelRatio || 1);

    const skyGradient = ctx.createLinearGradient(0, 0, 0, H);
    skyGradient.addColorStop(0, '#04030c');
    skyGradient.addColorStop(0.45, '#0a1030');
    skyGradient.addColorStop(1, '#09040f');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, W, H);

    const aurora = ctx.createRadialGradient(W * 0.5, H * 0.14, 0, W * 0.5, H * 0.14, W * 0.5);
    aurora.addColorStop(0, 'rgba(0, 243, 255, 0.14)');
    aurora.addColorStop(0.45, 'rgba(155, 124, 255, 0.1)');
    aurora.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aurora;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    const hz = H * 0.4;

    houses.sort((a, b) => b.z - a.z);
    houses.forEach(h => drawHouse(ctx, W, H, h, hz));

    drawRoad(ctx, W, H, hz);

    const thiefW = W * 0.12;
    const thiefH = thiefW * 0.6;
    drawCar(ctx, thief.x * W, H * 0.45, thiefW, thiefH, '#111', false, true);

    traffic.forEach(t => {
        const scale = 0.2 + (t.y * 0.8);
        const tw = W * 0.15 * scale;
        const th = tw * 0.6;
        drawCar(ctx, t.x * W, hz + t.y * (H - hz), tw, th, t.color, false, false);
    });

    const playerW = W * 0.22;
    const playerH = playerW * 0.6;
    drawCar(ctx, player.x * W, H * 0.85, playerW, playerH, window.gameConfig.themeColor, true, false);

    ctx.restore();
}

function drawHouse(ctx, W, H, house, hz) {
    const fov = 300;
    const scale = fov / (house.z + 10);
    const roadWidth = 800;
    const worldX = house.side * (roadWidth / 2 + 200);

    const screenX = W / 2 + worldX * scale;
    const screenY = hz + 100 * scale;
    const w = 300 * scale;
    const h = house.h * 4 * scale;

    const buildingGlow = house.side < 0 ? 'rgba(0,243,255,0.7)' : 'rgba(155,124,255,0.72)';
    ctx.fillStyle = house.side < 0 ? '#0b1022' : '#140d26';
    ctx.strokeStyle = buildingGlow;
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.rect(screenX - w / 2, screenY - h, w, h);
    ctx.fill();

    if (scale > 0.1) {
        ctx.stroke();
        ctx.shadowColor = buildingGlow;
        ctx.shadowBlur = 8;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 209, 102, 0.38)' : 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(screenX - w / 4, screenY - h / 2, w / 2, h / 4);
        ctx.shadowBlur = 0;
    }
}

function drawRoad(ctx, W, H, hz) {
    const roadGradient = ctx.createLinearGradient(0, hz, 0, H);
    roadGradient.addColorStop(0, '#1b1534');
    roadGradient.addColorStop(0.45, '#121522');
    roadGradient.addColorStop(1, '#090a10');
    ctx.fillStyle = roadGradient;
    ctx.beginPath();
    ctx.moveTo(W / 2, hz);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0, 243, 255, 0.42)';
    ctx.lineWidth = 4;
    ctx.beginPath();

    let speed = state.speed * 20;
    let offset = (state.t * speed) % 100;

    ctx.shadowColor = 'rgba(0, 243, 255, 0.24)';
    ctx.shadowBlur = 10;
    ctx.moveTo(W / 2, hz);
    ctx.lineTo(0, H);
    ctx.moveTo(W / 2, hz);
    ctx.lineTo(W, H);

    for (let i = 0; i < 10; i++) {
        let p = (offset + i * 100) / 1000;
        if (p > 1) p -= 1;

        let yExp = hz + Math.pow(p, 3) * (H - hz);
        let wExp = W * Math.pow(p, 3) * 2;

        if (yExp < H) {
            ctx.moveTo(W / 2 - wExp / 2, yExp);
            ctx.lineTo(W / 2 + wExp / 2, yExp);
        }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawCar(ctx, x, y, w, h, color, isPolice, isThief) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, h / 2, w / 2 + 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = isPolice ? 'rgba(0, 243, 255, 0.45)' : (isThief ? 'rgba(255, 0, 85, 0.35)' : 'rgba(255,255,255,0.12)');
    ctx.shadowBlur = isPolice ? 18 : 8;

    const bodyGradient = ctx.createLinearGradient(0, -h, 0, h * 0.3);
    bodyGradient.addColorStop(0, isPolice ? '#e7fbff' : (isThief ? '#3a3653' : '#f5f7ff'));
    bodyGradient.addColorStop(0.45, color);
    bodyGradient.addColorStop(1, isPolice ? '#0c6f88' : (isThief ? '#151025' : '#6b7280'));

    ctx.fillStyle = bodyGradient;
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.lineTo(-w / 2 + w * 0.1, -h);
    ctx.lineTo(w / 2 - w * 0.1, -h);
    ctx.lineTo(w / 2, 0);
    ctx.lineTo(w / 2, h * 0.3);
    ctx.lineTo(-w / 2, h * 0.3);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = isPolice ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1.25;
    ctx.stroke();

    ctx.fillStyle = '#08101a';
    ctx.beginPath();
    ctx.moveTo(-w / 3, -h * 0.2);
    ctx.lineTo(-w / 4, -h * 0.8);
    ctx.lineTo(w / 4, -h * 0.8);
    ctx.lineTo(w / 3, -h * 0.2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(-w * 0.28, -h * 0.68, w * 0.18, h * 0.08);

    if (isPolice) {
        const blink = Math.floor(state.t * 10) % 2 === 0;

        ctx.fillStyle = blink ? '#38bdf8' : '#0f3d73';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = blink ? 22 : 0;
        ctx.fillRect(-w / 3, -h * 1.1, w / 3, h * 0.3);

        ctx.fillStyle = !blink ? '#fb7185' : '#5a1020';
        ctx.shadowColor = '#fb7185';
        ctx.shadowBlur = !blink ? 22 : 0;
        ctx.fillRect(0, -h * 1.1, w / 3, h * 0.3);

        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(-w * 0.34, -h * 0.08, h * 0.08, 0, Math.PI * 2);
        ctx.arc(w * 0.34, -h * 0.08, h * 0.08, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = isThief ? '#ff7a9d' : '#ff4d6d';
    ctx.shadowColor = isThief ? '#ff7a9d' : '#ff4d6d';
    ctx.shadowBlur = 10;
    ctx.fillRect(-w / 2 + 4, h * 0.1, w * 0.2, h * 0.15);
    ctx.fillRect(w / 2 - w * 0.2 - 4, h * 0.1, w * 0.2, h * 0.15);
    ctx.shadowBlur = 0;

    if (isThief) {
        ctx.fillStyle = '#ffd166';
        ctx.font = '600 10px var(--font-ui)';
        ctx.textAlign = 'center';
        ctx.fillText('RUNNER', 0, h * 0.2);
    }

    ctx.restore();
}

function loop(now) {
    const dt = Math.min((now - state.lastTime || now) / 1000, 0.1);
    state.lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
