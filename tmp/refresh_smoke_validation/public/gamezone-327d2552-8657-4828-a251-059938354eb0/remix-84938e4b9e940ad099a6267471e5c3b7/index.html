<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archive Escape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&family=Material+Symbols+Sharp" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #04070f;
            --bg-mid: #07111f;
            --panel-bg: rgba(7, 16, 32, 0.82);
            --panel-border: rgba(115, 228, 255, 0.34);
            --panel-glow: rgba(85, 211, 255, 0.18);
            --signal: #73e4ff;
            --signal-strong: #d9fbff;
            --warning: #ff6f6f;
            --warning-dim: #7c1423;
            --gold: #f4cf62;
            --text-main: #eef8ff;
            --text-dim: #9cb2c9;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(38, 79, 130, 0.22), transparent 40%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 65%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(115, 228, 255, 0.08), transparent 22%),
                radial-gradient(circle at 80% 0%, rgba(244, 207, 98, 0.08), transparent 18%);
            pointer-events: none;
        }

        canvas { display: block; touch-action: none; }

        .glitch-text { animation: glitch 0.3s infinite; }

        .tech-title {
            font-family: 'Orbitron', sans-serif;
        }

        #timer,
        .signal-chip,
        .status-dot + span,
        #narrative-text {
            font-family: 'Press Start 2P', monospace;
        }

        .material-symbols-sharp {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.05em;
            line-height: 1;
            vertical-align: middle;
        }

        .panel-shell {
            border: 1px solid var(--panel-border);
            background:
                linear-gradient(180deg, rgba(12, 24, 46, 0.94), rgba(5, 10, 22, 0.94)),
                rgba(7, 16, 32, 0.82);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 24px var(--panel-glow),
                0 20px 40px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(10px);
        }

        .screen-frame::before,
        .screen-frame::after {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(115, 228, 255, 0.12);
            pointer-events: none;
        }

        .screen-frame::after {
            inset: auto 10px 10px 10px;
            height: 3px;
            border: 0;
            background: linear-gradient(90deg, transparent, rgba(115, 228, 255, 0.45), transparent);
            box-shadow: 0 0 12px rgba(115, 228, 255, 0.45);
        }

        .signal-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.25rem 0.7rem;
            border: 1px solid rgba(115, 228, 255, 0.28);
            background: rgba(115, 228, 255, 0.08);
            color: var(--signal);
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }

        .arcade-btn {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(244, 207, 98, 0.72);
            background: linear-gradient(180deg, rgba(244, 207, 98, 0.96), rgba(183, 121, 33, 0.96));
            color: #081018;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset, 0 10px 22px rgba(183, 121, 33, 0.22);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 0 18px rgba(244, 207, 98, 0.28);
        }

        .arcade-btn:active {
            transform: translateY(1px) scale(0.985);
        }

        .vhs-overlay {
            background:
                linear-gradient(180deg, rgba(115, 228, 255, 0.025), rgba(0,0,0,0)),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.12), rgba(0,0,0,0.12) 1px, transparent 1px, transparent 2px);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .scanline {
            width: 100%;
            height: 110px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0), rgba(115,228,255,0.1), rgba(0,0,0,0));
            opacity: 0.22;
            position: absolute;
            bottom: 100%;
            animation: scanline 9s linear infinite;
            pointer-events: none;
        }

        .hud-card {
            min-width: 118px;
            border: 1px solid rgba(115, 228, 255, 0.24);
            background: rgba(5, 12, 24, 0.72);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.3);
        }

        .feedback-gif {
            position: absolute;
            z-index: 35;
            width: min(32vw, 180px);
            max-width: 180px;
            border: 1px solid rgba(115, 228, 255, 0.28);
            background: rgba(4, 7, 15, 0.72);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.32);
            border-radius: 0.4rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: auto;
        }

        .feedback-gif--alert {
            top: 1rem;
            left: 1rem;
        }

        .feedback-gif--danger {
            right: 1rem;
            bottom: 1rem;
        }

        .feedback-label {
            padding: 0.28rem 0.45rem;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--signal-strong);
            background: rgba(3, 9, 18, 0.88);
            border-top: 1px solid rgba(115, 228, 255, 0.18);
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: #ff4d6d;
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.85);
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        @media (max-width: 640px) {
            #start-screen {
                max-width: calc(100vw - 1.5rem);
                padding: 1.1rem;
            }

            #game-over-screen h1 {
                font-size: 2.45rem;
            }

            #hud {
                top: 0.75rem;
                right: 0.75rem;
            }

            .feedback-gif {
                width: min(38vw, 132px);
            }

            .feedback-gif--alert {
                top: 0.75rem;
                left: 0.75rem;
            }

            .feedback-gif--danger {
                right: 0.75rem;
                bottom: 5rem;
            }
        }
    </style>
</head>
<body>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "walkSpeed": { "type": "number", "label": "Walk Speed", "value": 3, "min": 1, "max": 10 },
    "runSpeed": { "type": "number", "label": "Run Speed", "value": 6, "min": 4, "max": 15 },
    "flashlightRadius": { "type": "number", "label": "Light Radius", "value": 250, "min": 100, "max": 500 }
}
</script>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: start/chase/death/collision -> catalogs/audios.json -->
<audio id="bgm_chase" data-editable="audio" data-label="Chase Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_jumpscare" data-editable="audio" data-label="Jumpscare Sound" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_start" data-editable="audio" data-label="Start Run" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_warning" data-editable="audio" data-label="Tracker Warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_blocked" data-editable="audio" data-label="Wall Impact" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3" preload="auto"></audio>
<audio id="sfx_restart" data-editable="audio" data-label="Retry Button" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<!-- UI Structure -->
<div id="game-container" class="relative w-full h-full select-none bg-black">
    <canvas id="gameCanvas"></canvas>
    
    <!-- VHS Effects -->
    <div class="absolute inset-0 vhs-overlay z-10"></div>
    <div class="scanline"></div>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center">
        <!-- [agent-note][stage3] resolved-gif: alert/fail overlays -> catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <div id="feedback-alert" class="feedback-gif feedback-gif--alert" aria-hidden="true">
            <img src="https://i.giphy.com/MFPZ483I4x41W.webp" alt="Signal alert animation">
            <div class="feedback-label">tracker ping</div>
        </div>
        <div id="feedback-danger" class="feedback-gif feedback-gif--danger" aria-hidden="true">
            <img src="https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp" alt="Danger glitch animation">
            <div class="feedback-label">breach spike</div>
        </div>
        
        <!-- Start Screen -->
        <div id="start-screen" class="screen-frame panel-shell pointer-events-auto text-center p-8 max-w-md w-full rounded-sm relative">
            <div class="signal-chip text-[10px] mb-5"><span class="material-symbols-sharp" aria-hidden="true">api</span> archive breach</div>
            <h1 class="tech-title text-4xl text-[#d9fbff] mb-2 font-bold tracking-[0.08em] uppercase">ARCHIVE ESCAPE</h1>
            <p class="text-[11px] text-[#8fa9c0] mb-6 tracking-[0.38em] uppercase">SURVEILLANCE_RUN_0921</p>
            <p class="text-base text-[#d7e5f3] mb-6 max-w-xs mx-auto leading-tight">Drag anywhere to move through the file corridor before the tracker closes in.</p>
            <div class="text-[11px] text-[#73e4ff] uppercase tracking-[0.26em] mb-6 flex items-center justify-center gap-2">
                <span class="material-symbols-sharp" aria-hidden="true">sync</span>
                Signal corridor primed
            </div>
            <button id="start-btn" class="arcade-btn px-8 py-3 font-bold uppercase tracking-[0.28em] text-sm rounded-sm">
                Start Run
            </button>
        </div>

        <!-- Narrative Text Overlay -->
        <div id="narrative-box" class="hidden absolute top-1/3 w-full text-center pointer-events-none px-4">
            <p id="narrative-text" class="panel-shell inline-block text-[#eef8ff] text-lg sm:text-xl font-semibold tracking-[0.2em] uppercase drop-shadow-md px-4 py-3 max-w-md"></p>
        </div>

        <!-- End Screen -->
        <div id="game-over-screen" class="hidden pointer-events-auto absolute inset-0 bg-[rgba(2,5,10,0.96)] flex flex-col justify-center items-center z-50 px-4">
            <div class="panel-shell screen-frame w-full max-w-xl text-center px-5 py-8">
                <div class="signal-chip text-[10px] mb-5 !text-[#ff8f8f] !border-[rgba(255,111,111,0.28)] !bg-[rgba(255,111,111,0.09)]">
                    <span class="material-symbols-sharp" aria-hidden="true">warning</span> tracker breach
                </div>
                <h1 class="tech-title text-5xl md:text-7xl text-[#ff6f6f] font-bold tracking-[0.04em] mb-4 glitch-text text-center leading-none">RUN LOST:<br>TRACKER CAUGHT UP</h1>
                <p class="text-[#9aa8b6] text-xs mb-8 tracking-[0.5em] uppercase">Archive feed terminated</p>
                <button id="restart-btn" class="px-6 py-2 border border-[#7c1423] text-[#ff9ca7] hover:bg-[#7c1423] hover:text-white transition-colors text-xs uppercase tracking-[0.28em] rounded-sm">
                    Retry Run
                </button>
            </div>
        </div>

        <!-- HUD -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="hud" class="absolute top-4 right-4 hidden text-right">
            <div class="hud-card px-3 py-2 rounded-sm">
                <div class="text-[#73e4ff] text-[10px] uppercase tracking-[0.28em] flex items-center justify-end gap-2">
                    <span class="status-dot" aria-hidden="true"></span>
                    Live Feed
                </div>
                <div id="timer" class="text-[#eef8ff] text-sm opacity-90 mt-1">00:00:00</div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Core Systems ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const ui = {
        start: document.getElementById('start-screen'),
        gameOver: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud'),
        narrativeBox: document.getElementById('narrative-box'),
        narrativeText: document.getElementById('narrative-text'),
        timer: document.getElementById('timer'),
        feedbackAlert: document.getElementById('feedback-alert'),
        feedbackDanger: document.getElementById('feedback-danger')
    };

    // --- Config & State ---
    window.gameConfigDefs = {
        walkSpeed: { type: "number", label: "Walk Speed", value: 3, min: 1, max: 10 },
        runSpeed: { type: "number", label: "Run Speed", "value": 6, "min": 4, "max": 15 },
        flashlightRadius: { type: "number", label: "Light Radius", value: 250, "min": 100, "max": 500 }
    };
    
    window.gameConfig = {
        walkSpeed: 3,
        runSpeed: 6,
        flashlightRadius: 250
    };

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    let gameState = 'INIT'; // INIT, INTRO, PLAY, CHASE, DEAD, END
    let lastTime = 0;
    let frameId = null;
    let timeElapsed = 0;
    
    // Player
    let player = { x: 0, y: 0, angle: 0, vx: 0, vy: 0 };
    let input = { x: 0, y: 0, active: false };
    
    // World
    let walls = [];
    let particles = [];
    let entity = { x: 0, y: 0, active: false, speed: 0, noise: 0 };
    let camera = { x: 0, y: 0, shake: 0 };

    // Audio Context
    let audioCtx;
    let bgmNode = null;
    const sfxCooldowns = new Map();
    const feedbackTimers = new Map();
    let chaseWarningPlayed = false;

    // --- Audio System ---
    const initAudio = () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    };

    const playBgm = () => {
        const el = document.getElementById('bgm_chase');
        if (el) {
            el.volume = 0.2;
            if (el.paused) {
                el.currentTime = 0;
            }
            el.play().catch(() => {});
        }
    };

    const stopBgm = () => {
        const el = document.getElementById('bgm_chase');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    };

    const playSfx = (id, cooldown = 0) => {
        const now = performance.now();
        const nextAllowed = sfxCooldowns.get(id) || 0;
        if (cooldown > 0 && now < nextAllowed) return;
        if (cooldown > 0) {
            sfxCooldowns.set(id, now + cooldown);
        }

        const el = document.getElementById(id);
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => playSynthFallback('noise'));
        } else {
            playSynthFallback('noise');
        }
    };

    const showFeedback = (key, duration = 1200) => {
        const el = key === 'danger' ? ui.feedbackDanger : ui.feedbackAlert;
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(feedbackTimers.get(key));
        feedbackTimers.set(key, setTimeout(() => {
            el.classList.remove('visible');
        }, duration));
    };

    const playSynthFallback = (type) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'noise') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    };

    // --- Level Generation ---
    const generateMaze = () => {
        walls = [];
        // Infinite corridor feel with rooms
        const cellSize = 100;
        const width = 20;
        const height = 100; // Long corridor
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                // Main corridor
                if (x > 8 && x < 12) continue;
                
                // Side rooms
                if (Math.random() > 0.8) continue;

                // Walls
                walls.push({
                    x: x * cellSize,
                    y: y * cellSize,
                    w: cellSize,
                    h: cellSize
                });
            }
        }
        
        // Bounding walls
        walls.push({ x: 800, y: -1000, w: 20, h: 12000 }); // Left
        walls.push({ x: 1200, y: -1000, w: 20, h: 12000 }); // Right
        
        player.x = 1000; // Center of corridor
        player.y = 100;
    };

    // --- Input Handling ---
    const handleInput = (x, y, active) => {
        if (!active) {
            input.active = false;
            input.x = 0;
            input.y = 0;
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        
        const dx = x - cx;
        const dy = y - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 10) {
            input.active = true;
            input.x = dx / dist;
            input.y = dy / dist;
            player.angle = Math.atan2(dy, dx);
        }
    };

    canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        initAudio();
        const rect = canvas.getBoundingClientRect();
        handleInput(e.clientX - rect.left, e.clientY - rect.top, true);
    });

    canvas.addEventListener('pointermove', e => {
        e.preventDefault();
        if (input.active) {
            const rect = canvas.getBoundingClientRect();
            handleInput(e.clientX - rect.left, e.clientY - rect.top, true);
        }
    });

    const stopInput = (e) => {
        e.preventDefault();
        handleInput(0, 0, false);
    };

    canvas.addEventListener('pointerup', stopInput);
    canvas.addEventListener('pointercancel', stopInput);

    // --- Game Logic ---
    const typeWriter = (text, callback) => {
        ui.narrativeBox.classList.remove('hidden');
        ui.narrativeText.innerHTML = '';
        let i = 0;
        ui.narrativeText.style.color = '#fff';
        
        const interval = setInterval(() => {
            ui.narrativeText.textContent += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(interval);
                setTimeout(() => {
                    ui.narrativeBox.classList.add('hidden');
                    if (callback) callback();
                }, 2000);
            }
        }, 50);
    };

    const startGame = () => {
        ui.start.classList.add('hidden');
        ui.gameOver.classList.add('hidden');
        ui.hud.classList.add('hidden');
        
        gameState = 'INTRO';
        generateMaze();
        chaseWarningPlayed = false;
        playSfx('sfx_start', 120);
        
        // Narrative sequence
        setTimeout(() => {
            typeWriter("CONTROL: Keep moving. The tracker is locking onto your signal.", () => {
                gameState = 'PLAY';
                ui.hud.classList.remove('hidden');
                initAudio(); // Ensure audio context is ready
            });
        }, 500);
    };

    const triggerChase = () => {
        if (gameState !== 'PLAY') return;
        gameState = 'CHASE';
        entity.active = true;
        entity.x = player.x;
        entity.y = player.y - 600; // Spawn behind
        entity.speed = window.gameConfig.runSpeed * 1.1; // Slightly faster than player
        playBgm();
        playSfx('sfx_warning', 300);
        showFeedback('alert', 1800);
        chaseWarningPlayed = true;
        
        // Visual flare
        camera.shake = 20;
    };

    const die = () => {
        if (gameState === 'DEAD') return;
        gameState = 'DEAD';
        stopBgm();
        playSfx('sfx_jumpscare', 250);
        showFeedback('danger', 2200);
        
        // Intense shake
        camera.shake = 50;
        
        setTimeout(() => {
            gameState = 'END';
            ui.hud.classList.add('hidden');
            ui.gameOver.classList.remove('hidden');
        }, 1500); // Short death sequence
    };

    const update = (dt) => {
        timeElapsed += dt;
        
        // Timer update
        if (gameState === 'PLAY' || gameState === 'CHASE') {
            const mins = Math.floor(timeElapsed / 60000).toString().padStart(2, '0');
            const secs = Math.floor((timeElapsed % 60000) / 1000).toString().padStart(2, '0');
            const ms = Math.floor((timeElapsed % 1000) / 10).toString().padStart(2, '0');
            ui.timer.textContent = `${mins}:${secs}:${ms}`;
        }

        // Trigger chase after 5 seconds of walking
        if (gameState === 'PLAY' && timeElapsed > 5000) {
            triggerChase();
        }

        if (gameState === 'PLAY' || gameState === 'CHASE') {
            // Movement
            const speed = gameState === 'CHASE' ? window.gameConfig.runSpeed : window.gameConfig.walkSpeed;
            
            if (input.active) {
                player.vx = input.x * speed;
                player.vy = input.y * speed;
            } else {
                player.vx *= 0.8;
                player.vy *= 0.8;
            }

            // Collision Detection (Simple AABB vs Walls)
            let nextX = player.x + player.vx * (dt/16);
            let nextY = player.y + player.vy * (dt/16);
            let collided = false;

            for (let w of walls) {
                if (nextX > w.x && nextX < w.x + w.w && nextY > w.y && nextY < w.y + w.h) {
                    collided = true;
                    break;
                }
            }

            if (!collided) {
                player.x = nextX;
                player.y = nextY;
            } else if (input.active) {
                playSfx('sfx_blocked', 180);
                if (gameState === 'CHASE') {
                    showFeedback('danger', 700);
                }
            }
            
            // Camera Follow
            camera.x += (player.x - camera.x) * 0.1;
            camera.y += (player.y - camera.y) * 0.1;

            // Camera Shake Decay
            if (camera.shake > 0) camera.shake *= 0.9;
        }

        // Entity Logic
        if (gameState === 'CHASE') {
            const dx = player.x - entity.x;
            const dy = player.y - entity.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            entity.x += (dx / dist) * entity.speed * (dt/16);
            entity.y += (dy / dist) * entity.speed * (dt/16);
            
            // Catch condition
            if (dist < 30) {
                die();
            }
            
            // Proximity Noise
            if (dist < 300) {
                camera.shake += (300 - dist) * 0.05;
            }

            if (dist < 220) {
                showFeedback('danger', 500);
            } else if (dist < 420 && chaseWarningPlayed) {
                showFeedback('alert', 450);
            }
        }
    };

    const draw = () => {
        // Clear
        ctx.fillStyle = '#02050b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'END') return; // UI handles end screen

        ctx.save();
        
        // Camera Transform
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        // Shake
        const sx = (Math.random() - 0.5) * camera.shake;
        const sy = (Math.random() - 0.5) * camera.shake;
        
        ctx.translate(cx - camera.x + sx, cy - camera.y + sy);

        // Draw Floor (Infinite look)
        const floorGradient = ctx.createLinearGradient(0, camera.y - cy, 0, camera.y + cy);
        floorGradient.addColorStop(0, '#07111f');
        floorGradient.addColorStop(0.55, '#0d1b2d');
        floorGradient.addColorStop(1, '#050a14');
        ctx.fillStyle = floorGradient;
        ctx.fillRect(camera.x - cx, camera.y - cy, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(115, 228, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let lineY = Math.floor((camera.y - cy) / 80) * 80; lineY < camera.y + cy + 80; lineY += 80) {
            ctx.beginPath();
            ctx.moveTo(camera.x - cx, lineY);
            ctx.lineTo(camera.x + cx, lineY);
            ctx.stroke();
        }

        const laneGradient = ctx.createLinearGradient(960, 0, 1040, 0);
        laneGradient.addColorStop(0, 'rgba(115, 228, 255, 0)');
        laneGradient.addColorStop(0.5, 'rgba(115, 228, 255, 0.08)');
        laneGradient.addColorStop(1, 'rgba(115, 228, 255, 0)');
        ctx.fillStyle = laneGradient;
        ctx.fillRect(940, camera.y - cy, 120, canvas.height);

        // Draw Walls
        const wallGradient = ctx.createLinearGradient(0, 0, 100, 100);
        wallGradient.addColorStop(0, '#16314f');
        wallGradient.addColorStop(1, '#0a1628');
        ctx.fillStyle = wallGradient;
        for (let w of walls) {
            // Only draw visible walls
            if (w.x + w.w < camera.x - cx - 100 || w.x > camera.x + cx + 100 || 
                w.y + w.h < camera.y - cy - 100 || w.y > camera.y + cy + 100) continue;
            
            ctx.fillRect(w.x, w.y, w.w, w.h);

            ctx.strokeStyle = 'rgba(115, 228, 255, 0.16)';
            ctx.lineWidth = 2;
            ctx.strokeRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);

            // Wall detailing (data-panel strips)
            ctx.strokeStyle = 'rgba(115, 228, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=14; i<w.w; i+=18) {
                ctx.moveTo(w.x + i, w.y + 8);
                ctx.lineTo(w.x + i, w.y + w.h - 8);
            }
            ctx.stroke();
        }

        // Draw Player
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle || 0);
        const playerAura = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
        playerAura.addColorStop(0, 'rgba(217, 251, 255, 0.9)');
        playerAura.addColorStop(1, 'rgba(217, 251, 255, 0)');
        ctx.fillStyle = playerAura;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d9fbff';
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(-8, -9);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-8, 9);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#73e4ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-3, -6);
        ctx.lineTo(8, 0);
        ctx.lineTo(-3, 6);
        ctx.stroke();

        ctx.fillStyle = '#081018';
        ctx.beginPath();
        ctx.arc(3, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Draw Entity
        if (entity.active) {
            ctx.save();
            ctx.translate(entity.x, entity.y);

            const pulse = 0.8 + Math.sin(timeElapsed * 0.02) * 0.08;
            const halo = ctx.createRadialGradient(0, 0, 4, 0, 0, 48);
            halo.addColorStop(0, 'rgba(255, 111, 111, 0.42)');
            halo.addColorStop(1, 'rgba(255, 111, 111, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, 48 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#08090f';
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(22, -8);
            ctx.lineTo(18, 28);
            ctx.lineTo(0, 42);
            ctx.lineTo(-18, 28);
            ctx.lineTo(-22, -8);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 111, 111, 0.65)';
            ctx.lineWidth = 2;
            ctx.stroke();

            for(let i=0; i<4; i++) {
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 111, 111, 0.18)' : 'rgba(115, 228, 255, 0.08)';
                const w = 18 + Math.random() * 14;
                const h = 10 + Math.random() * 20;
                ctx.fillRect(-w / 2 + (Math.random() - 0.5) * 20, -20 + i * 12, w, h);
            }

            ctx.fillStyle = '#ff6f6f';
            ctx.beginPath();
            ctx.arc(-7, -2, 3, 0, Math.PI * 2);
            ctx.arc(7, -2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.moveTo(-10, 14);
            ctx.lineTo(0, 8 + Math.random() * 4);
            ctx.lineTo(10, 14);
            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();

        // Lighting System (Flashlight + Vignette)
        if (gameState !== 'DEAD') {
            const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, window.gameConfig.flashlightRadius);
            grad.addColorStop(0, 'rgba(10,22,38,0)');
            grad.addColorStop(0.7, 'rgba(3,8,18,0.44)');
            grad.addColorStop(1, 'rgba(0,0,0,0.985)');
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            // Death Glitch Overlay
            ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.5})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Static noise
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for(let i=0; i<data.length; i+=4) {
                if (Math.random() > 0.8) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i+1] = val;
                    data[i+2] = val;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
    };

    const loop = (timestamp) => {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        try {
            if (gameState !== 'INIT') {
                update(dt);
                draw();
            }
        } catch (e) {
            console.error(e);
        }
        
        frameId = requestAnimationFrame(loop);
    };

    // --- Init ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    window.addEventListener('resize', resize);
    resize();
    frameId = requestAnimationFrame(loop);

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        initAudio();
        startGame();
    });
    
    document.getElementById('restart-btn').addEventListener('click', () => {
        initAudio();
        playSfx('sfx_restart', 120);
        gameState = 'INIT';
        timeElapsed = 0;
        camera.shake = 0;
        entity.active = false;
        chaseWarningPlayed = false;
        ui.feedbackAlert.classList.remove('visible');
        ui.feedbackDanger.classList.remove('visible');
        ui.gameOver.classList.add('hidden');
        ui.start.classList.remove('hidden');
    });
});
</script>
</body>
</html>
