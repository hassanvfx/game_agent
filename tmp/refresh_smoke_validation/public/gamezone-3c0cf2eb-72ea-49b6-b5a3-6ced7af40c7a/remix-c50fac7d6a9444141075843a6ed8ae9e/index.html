<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Golden Abyss: Infinite Catch</title>
<!-- [agent-note][stage4] remapped-font: title/highlights->Orbitron, ui/body->Rajdhani from catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --c-bg: #07111d;
        --c-bg-deep: #030814;
        --c-panel: rgba(6, 18, 34, 0.86);
        --c-panel-strong: rgba(9, 26, 45, 0.94);
        --c-border: rgba(250, 204, 21, 0.45);
        --c-accent: #fbbf24;
        --c-accent-soft: #fde68a;
        --c-sec: #2dd4bf;
        --c-danger: #f97316;
        --c-gold: #f59e0b;
        --c-text: #f8fafc;
        --c-muted: #bfd3ea;
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden; background:
            radial-gradient(circle at top, rgba(45, 212, 191, 0.12), transparent 28%),
            linear-gradient(180deg, #0a1830 0%, var(--c-bg) 26%, var(--c-bg-deep) 100%);
        font-family: 'Rajdhani', sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
        color: var(--c-text);
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 15%, rgba(251, 191, 36, 0.16), transparent 18%),
            radial-gradient(circle at 80% 20%, rgba(45, 212, 191, 0.14), transparent 20%),
            linear-gradient(180deg, rgba(255,255,255,0.04), transparent 25%);
        opacity: 0.9;
        z-index: 0;
    }

    canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

    /* UI LAYOUT */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
        z-index: 10;
    }

    #ui-layer::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 50% -10%, rgba(255,255,255,0.14), transparent 30%),
            linear-gradient(180deg, rgba(3, 8, 20, 0.08), transparent 18%, rgba(3, 8, 20, 0.2));
        z-index: -1;
    }

    .pointer-auto { pointer-events: auto; }
    .hidden { display: none !important; }

    /* HUD */
    #hud {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 16px; width: 100%;
    }
    .hud-box {
        background: linear-gradient(180deg, rgba(13, 34, 58, 0.92), rgba(6, 15, 28, 0.96));
        border: 1px solid var(--c-border);
        border-radius: 12px;
        padding: 9px 16px;
        box-shadow: 0 8px 28px rgba(2, 8, 18, 0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
        display: flex; align-items: center; gap: 10px;
        backdrop-filter: blur(10px);
    }
    
    .score-label { font-size: 11px; color: var(--c-muted); text-transform: uppercase; letter-spacing: 1.6px; }
    .score-text { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--c-accent); text-shadow: 0 0 14px rgba(251, 191, 36, 0.24); }
    
    .hud-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .info-tag {
        background: linear-gradient(180deg, rgba(4, 13, 25, 0.94), rgba(9, 26, 45, 0.94));
        border: 1px solid rgba(45, 212, 191, 0.35);
        color: var(--c-accent-soft);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    }

    /* SHOP PANEL */
    #shop-panel {
        position: absolute; bottom: 0; left: 0; width: 100%;
        display: flex; flex-direction: column; justify-content: flex-end;
        pointer-events: none;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 20;
    }
    .shop-content {
        background:
            linear-gradient(180deg, rgba(11, 26, 45, 0.96), rgba(4, 12, 22, 0.98)),
            var(--c-panel);
        border-top: 2px solid var(--c-accent);
        width: 100%; max-width: 600px; margin: 0 auto;
        pointer-events: auto;
        padding-bottom: calc(var(--safe-bottom) + 10px);
        box-shadow: 0 -14px 46px rgba(0,0,0,0.72);
        backdrop-filter: blur(14px);
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
        overflow: hidden;
    }
    
    .shop-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px;
        background: linear-gradient(90deg, rgba(251,191,36,0.18), rgba(45,212,191,0.07) 60%, transparent);
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .shop-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--c-accent); letter-spacing: 1px; }
    .toggle-btn {
        background: rgba(255,255,255,0.02); border: 1px solid var(--c-accent); color: var(--c-accent);
        font-size: 12px; font-weight: 700; padding: 6px 16px;
        font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
        border-radius: 20px;
        box-shadow: inset 0 0 12px rgba(251,191,36,0.08);
    }

    .tabs { display: flex; background: rgba(0,0,0,0.26); }
    .tab-btn {
        flex: 1; background: none; border: none; color: #94a3b8;
        padding: 14px; font-size: 14px; font-weight: 700; text-transform: uppercase;
        border-bottom: 2px solid transparent; font-family: 'Rajdhani', sans-serif;
        letter-spacing: 1.2px;
        transition: all 0.2s;
    }
    .tab-btn.active { color: var(--c-accent); background: rgba(251,191,36,0.05); border-bottom-color: var(--c-accent); }

    .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
    
    .item-btn {
        position: relative;
        background:
            linear-gradient(180deg, rgba(21, 44, 70, 0.92), rgba(7, 17, 29, 0.98));
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 10px 4px;
        display: flex; flex-direction: column; align-items: center;
        color: #fff; font-family: 'Rajdhani', sans-serif;
        transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        overflow: hidden;
    }
    .item-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 38%);
        pointer-events: none;
    }
    .item-btn:active { transform: scale(0.96); border-color: var(--c-accent); box-shadow: 0 0 18px rgba(251,191,36,0.14); }
    
    .item-name { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; }
    .item-val { font-size: 18px; font-weight: 700; margin-bottom: 4px; line-height: 1; color: var(--c-accent); }
    .item-cost {
        font-family: 'Rajdhani', sans-serif; font-size: 11px;
        background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 999px;
        color: var(--c-sec); border: 1px solid rgba(45, 212, 191, 0.2);
        letter-spacing: 0.8px;
    }
    
    /* START SCREEN */
    #start-screen {
        position: absolute; inset: 0;
        background:
            radial-gradient(circle at 50% 18%, rgba(251, 191, 36, 0.22), transparent 20%),
            radial-gradient(circle at center, rgba(12, 30, 52, 0.96), #020617 72%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 100; pointer-events: auto;
        text-align: center; padding: 20px;
        overflow: hidden;
    }
    .title-main {
        font-family: 'Orbitron', sans-serif; font-size: 64px; line-height: 0.94;
        background: linear-gradient(to bottom, #fff3c4 0%, #fcd34d 45%, #b45309 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        margin-bottom: 10px; filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.32));
        text-transform: uppercase;
        letter-spacing: 1.5px;
        position: relative;
        z-index: 1;
    }
    .subtitle {
        font-size: 18px; color: var(--c-accent-soft); letter-spacing: 5px; margin-bottom: 24px;
        font-family: 'Rajdhani', sans-serif; text-transform: uppercase; opacity: 0.92;
        position: relative;
        z-index: 1;
    }
    .start-desc { color: #d9e6f4; font-size: 16px; margin-bottom: 32px; line-height: 1.55; max-width: 320px; position: relative; z-index: 1; }
    .btn-start {
        background: linear-gradient(180deg, #ffe08a, #f59e0b);
        border: 1px solid rgba(255,255,255,0.35); color: #30200a; font-size: 20px; font-weight: 700;
        font-family: 'Rajdhani', sans-serif;
        padding: 15px 56px; border-radius: 999px;
        box-shadow: 0 0 30px rgba(251, 191, 36, 0.32), 0 8px 24px rgba(0,0,0,0.35);
        animation: pulse 2s infinite;
        cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
        position: relative;
        z-index: 1;
    }

    .hero-character {
        width: min(62vw, 240px);
        aspect-ratio: 1;
        margin-bottom: 18px;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 0 30px rgba(45, 212, 191, 0.16));
    }

    .hero-character::before,
    .hero-character::after {
        content: "";
        position: absolute;
        border-radius: 50%;
    }

    .hero-character::before {
        inset: 10% 20%;
        background: radial-gradient(circle at 50% 40%, rgba(251, 191, 36, 0.42), transparent 52%);
        filter: blur(8px);
    }

    .abyssal-catcher {
        position: absolute;
        inset: 0;
    }

    .abyssal-catcher .crest {
        position: absolute;
        left: 50%;
        top: 4%;
        width: 26%;
        height: 18%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #ffe08a, #d97706);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        box-shadow: 0 0 18px rgba(251,191,36,0.26);
    }

    .abyssal-catcher .body {
        position: absolute;
        left: 50%;
        top: 16%;
        width: 52%;
        height: 56%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #173152, #0a1628 72%);
        border: 3px solid rgba(251, 191, 36, 0.72);
        border-radius: 46% 46% 40% 40% / 34% 34% 56% 56%;
        box-shadow: inset 0 -14px 30px rgba(0,0,0,0.38), 0 0 26px rgba(45,212,191,0.12);
    }

    .abyssal-catcher .window {
        position: absolute;
        left: 50%;
        top: 32%;
        width: 24%;
        height: 14%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, rgba(45,212,191,0.2), rgba(191, 255, 244, 0.95), rgba(45,212,191,0.25));
        border: 2px solid rgba(255,255,255,0.62);
        border-radius: 999px;
        box-shadow: 0 0 18px rgba(125, 211, 252, 0.35);
    }

    .abyssal-catcher .arm {
        position: absolute;
        top: 42%;
        width: 14%;
        height: 26%;
        background: linear-gradient(180deg, #1d4368, #0d1c31);
        border: 2px solid rgba(251, 191, 36, 0.5);
        border-radius: 999px;
        transform-origin: top center;
    }

    .abyssal-catcher .arm.left { left: 18%; transform: rotate(24deg); }
    .abyssal-catcher .arm.right { right: 18%; transform: rotate(-24deg); }

    .abyssal-catcher .claw {
        position: absolute;
        bottom: -12%;
        left: 50%;
        width: 72%;
        height: 28%;
        transform: translateX(-50%);
        border-top: 3px solid rgba(251, 191, 36, 0.85);
    }

    .abyssal-catcher .claw::before,
    .abyssal-catcher .claw::after {
        content: "";
        position: absolute;
        top: 0;
        width: 36%;
        height: 100%;
        border: 3px solid rgba(251, 191, 36, 0.85);
        border-top: none;
        border-radius: 0 0 16px 16px;
    }

    .abyssal-catcher .claw::before { left: 2%; transform: skewX(16deg); }
    .abyssal-catcher .claw::after { right: 2%; transform: skewX(-16deg); }

    .abyssal-catcher .core {
        position: absolute;
        left: 50%;
        top: 49%;
        width: 14%;
        height: 14%;
        transform: translateX(-50%);
        background: radial-gradient(circle, #99f6e4, #0ea5e9 70%);
        border-radius: 50%;
        box-shadow: 0 0 18px rgba(45,212,191,0.55);
    }

    .sparkle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.75);
        animation: sparkleDrift 2.4s ease-in-out infinite;
    }

    .sparkle.one { left: 18%; top: 28%; animation-delay: 0s; }
    .sparkle.two { right: 20%; top: 18%; animation-delay: 0.6s; }
    .sparkle.three { left: 28%; bottom: 18%; animation-delay: 1.2s; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes sparkleDrift {
        0%, 100% { transform: translateY(0) scale(0.7); opacity: 0.25; }
        50% { transform: translateY(-10px) scale(1); opacity: 0.9; }
    }
    #feedback-layer {
        position: absolute;
        top: calc(var(--safe-top) + 86px);
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 18;
        align-items: flex-end;
    }

    .feedback-card {
        width: min(34vw, 112px);
        min-width: 80px;
        padding: 6px;
        border-radius: 16px;
        border: 1px solid rgba(251, 191, 36, 0.4);
        background: rgba(4, 12, 22, 0.72);
        box-shadow: 0 10px 28px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        transition: opacity 0.25s ease, transform 0.25s ease;
        pointer-events: none;
    }

    .feedback-card.show {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .feedback-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 5px;
    }

    .feedback-card span {
        display: block;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 9px;
        letter-spacing: 0.8px;
        color: var(--c-accent-soft);
        text-transform: uppercase;
    }

    .minimized { transform: translateY(calc(100% - 46px)); }

    @media (max-width: 640px) {
        .title-main { font-size: 44px; }
        .subtitle { font-size: 15px; letter-spacing: 3px; }
        #feedback-layer {
            top: auto;
            bottom: calc(var(--safe-bottom) + 210px);
            right: 8px;
        }
        .feedback-card {
            width: min(28vw, 92px);
            min-width: 72px;
            padding: 5px;
        }
        .shop-grid { gap: 6px; padding: 10px; }
        .item-btn { padding: 10px 2px; }
        .item-val { font-size: 16px; }
        .score-text { font-size: 20px; }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <!-- [agent-note][stage3] resolved-gif: catch streak + launch reaction from catalogs/gifs.json; kept off playfield edges for mobile safety -->
    <div id="feedback-layer" aria-live="polite">
        <div id="feedback-catch" class="feedback-card">
            <img src="https://i.giphy.com/vf5RXzqGIWrZu.webp" alt="Catch streak celebration" loading="lazy">
            <span>Treasure haul!</span>
        </div>
        <div id="feedback-launch" class="feedback-card">
            <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Launch reaction" loading="lazy">
            <span>Descent engaged</span>
        </div>
    </div>
    <div id="hud" class="hidden">
        <div class="hud-box">
            <div>
                <div class="score-label">Budget</div>
                <div id="money-val" class="score-text">∞</div>
            </div>
        </div>
        <div class="hud-right">
            <div class="info-tag">Depth: <span id="depth-val">0</span>m</div>
            <div class="info-tag" style="border-color:#10b981; color:#10b981">Catch: <span id="score-val">0</span></div>
        </div>
    </div>

    <div id="shop-panel" class="hidden">
        <div class="shop-content">
            <div class="shop-header" id="shop-header">
                <div class="shop-title">⚜️ Deck Console</div>
                <button class="toggle-btn" id="shop-toggle">Hide</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" id="tab-gear">Gear</button>
                <button class="tab-btn" id="tab-pets">Crew</button>
            </div>

            <div id="content-gear" class="shop-grid">
                <button class="item-btn" id="btn-depth">
                    <span class="item-name">Cable</span>
                    <span class="item-val" id="val-depth">Lvl 1</span>
                    <span class="item-cost">FREE</span>
                </button>
                <button class="item-btn" id="btn-luck">
                    <span class="item-name">Radar</span>
                    <span class="item-val" id="val-luck">Lvl 1</span>
                    <span class="item-cost">FREE</span>
                </button>
                <button class="item-btn" id="btn-cap">
                    <span class="item-name">Hooks</span>
                    <span class="item-val" id="val-cap">x1</span>
                    <span class="item-cost">FREE</span>
                </button>
            </div>

            <div id="content-pets" class="shop-grid hidden">
                <button class="item-btn" id="btn-pet-baby">
                    <span class="item-name">Auto Skiff</span>
                    <span class="item-val" id="count-pet-baby">x0</span>
                    <span class="item-cost">FREE</span>
                </button>
                <button class="item-btn" id="btn-pet-guard">
                    <span class="item-name">Escort Drone</span>
                    <span class="item-val" id="count-pet-guard">x0</span>
                    <span class="item-cost">FREE</span>
                </button>
                <button class="item-btn" id="btn-pet-super">
                    <span class="item-name">Gold Drone</span>
                    <span class="item-val" id="count-pet-super">x0</span>
                    <span class="item-cost">FREE</span>
                </button>
            </div>
        </div>
    </div>

    <div id="start-screen">
        <div class="hero-character" aria-hidden="true">
            <div class="abyssal-catcher">
                <div class="crest"></div>
                <div class="body"></div>
                <div class="window"></div>
                <div class="arm left"><div class="claw"></div></div>
                <div class="arm right"><div class="claw"></div></div>
                <div class="core"></div>
            </div>
            <span class="sparkle one"></span>
            <span class="sparkle two"></span>
            <span class="sparkle three"></span>
        </div>
        <h1 class="title-main">GOLDEN<br>ABYSS</h1>
        <div class="subtitle">Infinite Catch</div>
        <p class="start-desc">
            Command the abyssal catcher and haul up every fish you can.<br>
            Spend your unlimited budget on better gear and helper drones.<br>
            <span style="color:var(--c-accent); font-size:14px; margin-top:10px; display:block;">Hold to descend. Release to reel in.</span>
        </p>
        <button class="btn-start" id="btn-start">Launch</button>
    </div>
</div>

<script>
/* --- CONFIG & STATE --- */
const CONFIG = {
    baseReelSpeed: 500,
    baseSpawnRate: 3.0
};

const FISH_TYPES = [
    { id: 'minnow', val: 100, color: '#94a3b8', min: 50, max: 600, spd: 2, scale: 0.7, r: 8 },
    { id: 'goldfish', val: 500, color: '#fbbf24', min: 100, max: 2000, spd: 2.5, scale: 1.0, r: 14 },
    { id: 'emerald', val: 2000, color: '#10b981', min: 400, max: 5000, spd: 1.5, scale: 1.2, r: 16 },
    { id: 'ruby', val: 10000, color: '#ef4444', min: 1000, max: Infinity, spd: 3.5, scale: 1.8, r: 25 },
    { id: 'diamond', val: 100000, color: '#38bdf8', min: 2000, max: Infinity, spd: 1.0, scale: 2.2, r: 30 }
];

const UPGRADES = {
    depth: { lvl: 1 },
    luck: { lvl: 1 },
    cap: { lvl: 1 }
};

const PETS = {
    baby: { count: 0 },
    guard: { count: 0 },
    super: { count: 0 }
};

const STATE = {
    mode: 'MENU', 
    w: 0, h: 0,
    money: Infinity, // Infinite Money
    score: 0,        // Tracking caught value just for fun
    time: 0,
    shopOpen: true,
    shopTab: 'GEAR',
    touching: false
};

const boat = { x: 0, y: 100 };
const hook = { x: 0, y: 100, state: 'IDLE', caught: [] };
let fishes = [];
let activePets = [];
let particles = [];
let floats = [];

/* --- AUDIO --- */
/* [agent-note][stage3] resolved-audio: catch/ui/blocked/start + ambient loop wired from catalogs/audios.json */
const AUDIO_MAP = {
    catch: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
    buy: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',
    blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
    loop: 'https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3'
};

const AudioSys = {
    enabled: false,
    sfx: {},
    loop: null,
    lastPlayed: {},
    init() {
        if (this.enabled) return;
        this.enabled = true;
        Object.entries(AUDIO_MAP).forEach(([key, url]) => {
            const audio = new Audio(url);
            audio.preload = 'auto';
            if (key === 'loop') {
                audio.loop = true;
                audio.volume = 0.2;
                this.loop = audio;
            } else {
                audio.volume = key === 'catch' ? 0.38 : 0.46;
                this.sfx[key] = audio;
            }
        });
    },
    play(type) {
        if (!this.enabled) return;
        const base = this.sfx[type];
        if (!base) return;
        const now = performance.now();
        const cooldown = type === 'catch' ? 110 : 160;
        if ((this.lastPlayed[type] || 0) + cooldown > now) return;
        this.lastPlayed[type] = now;
        try {
            const audio = base.cloneNode();
            audio.volume = base.volume;
            audio.play().catch(() => {});
        } catch (_) {}
    },
    startLoop() {
        if (!this.enabled || !this.loop) return;
        this.loop.currentTime = 0;
        this.loop.play().catch(() => {});
    },
    stopLoop() {
        if (!this.loop) return;
        this.loop.pause();
        this.loop.currentTime = 0;
    }
};

/* --- DOM REFS --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const els = {
    start: document.getElementById('start-screen'),
    hud: document.getElementById('hud'),
    shop: document.getElementById('shop-panel'),
    score: document.getElementById('score-val'),
    depth: document.getElementById('depth-val'),
    feedback: {
        catch: document.getElementById('feedback-catch'),
        launch: document.getElementById('feedback-launch')
    },
    shopToggle: document.getElementById('shop-toggle'),
    tabs: { gear: document.getElementById('tab-gear'), pets: document.getElementById('tab-pets') },
    content: { gear: document.getElementById('content-gear'), pets: document.getElementById('content-pets') },
    btns: {
        depth: document.getElementById('btn-depth'),
        luck: document.getElementById('btn-luck'),
        cap: document.getElementById('btn-cap'),
        baby: document.getElementById('btn-pet-baby'),
        guard: document.getElementById('btn-pet-guard'),
        super: document.getElementById('btn-pet-super')
    },
    vals: {
        depth: document.getElementById('val-depth'),
        luck: document.getElementById('val-luck'),
        cap: document.getElementById('val-cap')
    },
    counts: {
        baby: document.getElementById('count-pet-baby'),
        guard: document.getElementById('count-pet-guard'),
        super: document.getElementById('count-pet-super')
    }
};

/* --- INIT & LOOP --- */
function resize() {
    STATE.w = window.innerWidth;
    STATE.h = window.innerHeight;
    canvas.width = STATE.w;
    canvas.height = STATE.h;
    boat.x = STATE.w / 2;
    if (hook.state === 'IDLE') hook.x = boat.x;
}

window.addEventListener('resize', resize);
document.addEventListener('DOMContentLoaded', () => {
    resize();
    requestAnimationFrame(loop);
    updateShopUI();
    for(let i=0; i<15; i++) spawnFish(true);
});

let lastTime = 0;
function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.1);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

/* --- LOGIC --- */
function getMaxDepth() {
    return 500 + (UPGRADES.depth.lvl - 1) * 500;
}

function update(dt) {
    STATE.time += dt;

    if (STATE.mode === 'MENU') {
        boat.y = 100 + Math.sin(STATE.time * 2) * 5;
        hook.y = boat.y + 20;
        hook.x = boat.x;
        updateFish(dt);
        return;
    }

    // Hook Logic
    const currentMaxDepth = getMaxDepth();
    
    // Controls: Hold to go DOWN, Release to go UP
    if (STATE.touching && hook.state === 'IDLE') hook.state = 'DOWN';
    else if (!STATE.touching && hook.state === 'DOWN') hook.state = 'UP';

    if (hook.state === 'DOWN') {
        hook.y += CONFIG.baseReelSpeed * dt;
        if (hook.y >= currentMaxDepth) {
            hook.y = currentMaxDepth;
            hook.state = 'UP';
        }
    } else if (hook.state === 'UP') {
        const load = 1 - (hook.caught.length * 0.05); // Less penalty for load in sandbox
        hook.y -= CONFIG.baseReelSpeed * 1.5 * Math.max(0.5, load) * dt;
        if (hook.y <= boat.y + 20) {
            hook.y = boat.y + 20;
            hook.state = 'IDLE';
            processCatch(hook.caught);
            hook.caught = [];
        }
    }
    hook.x = boat.x;
    els.depth.innerText = Math.floor((hook.y - 100) / 10);

    // Dynamic spawn rate based on pets to keep swarm fed
    let spawnRate = CONFIG.baseSpawnRate + (activePets.length * 0.2);
    if (Math.random() < spawnRate * dt) spawnFish();
    
    updateFish(dt);
    updatePets(dt);
    updateParticles(dt);
    updateFloats(dt);
}

function updateFish(dt) {
    for (let i = fishes.length - 1; i >= 0; i--) {
        let f = fishes[i];
        if (!f.caughtBy) {
            f.x += f.vx * dt * 60;
        }
        
        // Despawn
        if ((f.vx > 0 && f.x > STATE.w + 200) || (f.vx < 0 && f.x < -200)) {
            fishes.splice(i, 1);
            continue;
        }

        // Hook Collision
        if (STATE.mode === 'PLAYING' && hook.state !== 'UP' && !f.caughtBy && hook.caught.length < UPGRADES.cap.lvl) {
            const dx = f.x - hook.x;
            const dy = f.y - hook.y;
            if (Math.sqrt(dx*dx + dy*dy) < f.r + 15) {
                hook.caught.push(f);
                fishes.splice(i, 1);
                AudioSys.play('catch');
                addParticle(hook.x, hook.y, 5, '#fbbf24');
                if (hook.caught.length >= UPGRADES.cap.lvl) hook.state = 'UP';
            }
        }
    }
}

function updatePets(dt) {
    // Ensure activePets matches counts
    ['baby', 'guard', 'super'].forEach(type => {
        const count = PETS[type].count;
        const current = activePets.filter(p => p.type === type).length;
        if (current < count) {
            // Spawn new
            let p = { type: type, x: boat.x + (Math.random()-0.5)*100, y: boat.y, state: 'IDLE', t: Math.random()*2 };
            if (type === 'guard') { p.state = 'FOLLOW'; p.ang = Math.random() * 6.28; p.dist = 50 + Math.random()*100; }
            if (type === 'super') { p.state = 'FOLLOW'; p.ang = Math.random() * 6.28; p.dist = 80 + Math.random()*200; }
            activePets.push(p);
        }
    });

    activePets.forEach(p => {
        if (p.type === 'baby') updateBaby(p, dt);
        else if (p.type === 'guard') updateGuard(p, dt);
        else updateSuper(p, dt);
    });
}

function updateBaby(p, dt) {
    // Baby Seal: Dives, hunts, returns
    if (p.state === 'IDLE') {
        p.y = boat.y; 
        p.x += (boat.x - 40 - p.x) * dt; 
        p.t -= dt;
        if (p.t <= 0) { p.state = 'DIVE'; p.targetY = 200 + Math.random()*400; }
    } else if (p.state === 'DIVE') {
        p.y += 200 * dt;
        if (p.y >= p.targetY) { p.state = 'HUNT'; p.t = 5; }
    } else if (p.state === 'HUNT') {
        p.t -= dt;
        // Find nearest fish
        let target = null;
        let minD = 300;
        for (let f of fishes) {
            if (!f.caughtBy && Math.abs(f.y - p.y) < 100) {
                let d = Math.abs(f.x - p.x);
                if (d < minD) { minD = d; target = f; }
            }
        }
        
        if (target) {
            p.x += (target.x - p.x) * 3 * dt;
            p.y += (target.y - p.y) * 3 * dt;
            if (Math.hypot(target.x - p.x, target.y - p.y) < 15) {
                target.caughtBy = p; p.held = target; p.state = 'RETURN';
                AudioSys.play('catch');
            }
        } else {
            p.x += Math.sin(STATE.time*3 + p.y)*50*dt;
        }
        if (p.t <= 0) p.state = 'RETURN';
    } else if (p.state === 'RETURN') {
        p.y -= 300 * dt;
        if (p.held) { p.held.x = p.x; p.held.y = p.y + 10; }
        if (p.y <= boat.y) {
            if (p.held) { processCatch([p.held]); fishes = fishes.filter(f => f !== p.held); p.held = null; }
            p.state = 'IDLE'; p.t = 2 + Math.random()*3;
        }
    }
}

function updateGuard(p, dt) {
    // Guardian: Circles hook, chases nearby fish
    if (p.state === 'FOLLOW') {
        let ty = Math.min(hook.y, getMaxDepth());
        p.ang += 1.5 * dt;
        let tx = hook.x + Math.cos(p.ang) * p.dist;
        let tY = ty + Math.sin(p.ang) * 20;
        p.x += (tx - p.x) * 4 * dt;
        p.y += (tY - p.y) * 4 * dt;
        
        // Look for fish
        for (let f of fishes) {
            if (!f.caughtBy && !hook.caught.includes(f)) {
                let d = Math.hypot(f.x - p.x, f.y - p.y);
                if (d < 150) { p.state = 'CHASE'; p.targetF = f; break; }
            }
        }
    } else if (p.state === 'CHASE') {
        let f = p.targetF;
        if (!f || fishes.indexOf(f) === -1 || f.caughtBy || hook.caught.includes(f)) { p.state = 'FOLLOW'; return; }
        let dist = Math.hypot(f.x - p.x, f.y - p.y);
        p.x += ((f.x - p.x)/dist) * 400 * dt;
        p.y += ((f.y - p.y)/dist) * 400 * dt;
        if (dist < 15) {
            f.caughtBy = p; p.held = f; p.state = 'RETURN';
            AudioSys.play('catch');
        }
    } else if (p.state === 'RETURN') {
        p.y -= 500 * dt;
        if (p.held) { p.held.x = p.x; p.held.y = p.y + 10; }
        if (p.y <= boat.y) {
            if (p.held) { processCatch([p.held]); fishes = fishes.filter(f => f !== p.held); p.held = null; }
            p.state = 'FOLLOW';
        }
    }
}

function updateSuper(p, dt) {
    // Super Seal: Just like Guard but faster and wider range
    updateGuard(p, dt); // Re-use logic for now but with different stats implicit in init
}

function spawnFish(menuMode = false) {
    let type = FISH_TYPES[0];
    if (menuMode) {
        type = FISH_TYPES[Math.floor(Math.random()*2)];
    } else {
        // Luck determines better fish
        let roll = Math.random() * (1 + UPGRADES.luck.lvl * 0.5);
        const currentMaxDepth = getMaxDepth();
        let valid = FISH_TYPES.filter(t => t.min <= currentMaxDepth);
        if (valid.length > 0) type = valid[Math.min(Math.floor(roll * valid.length), valid.length-1)];
    }
    
    let maxSpawn = Math.min(type.max, getMaxDepth());
    let y = menuMode ? 200 + Math.random()*300 : type.min + Math.random() * (maxSpawn - type.min);
    
    let left = Math.random() < 0.5;
    fishes.push({
        id: type.id, val: type.val, color: type.color,
        x: left ? -50 : STATE.w + 50,
        y: y,
        vx: (left ? 1 : -1) * type.spd,
        scale: type.scale, r: type.r,
        caughtBy: null
    });
}

function processCatch(list) {
    let tot = 0;
    list.forEach(f => {
        tot += 1; // Just count fish caught
        addFloat(`+1`, boat.x, boat.y - 50, '#10b981');
    });
    STATE.score += tot; // Increase score
    if (tot > 0) {
        AudioSys.play('buy');
        showFeedback('catch');
    }
    // Money is infinite, so we don't add to it
    updateShopUI();
}

function showFeedback(type) {
    const node = els.feedback[type];
    if (!node) return;
    node.classList.add('show');
    clearTimeout(node._hideTimer);
    node._hideTimer = setTimeout(() => node.classList.remove('show'), 1400);
}

function addParticle(x, y, n, c) {
    for(let i=0; i<n; i++) particles.push({ x, y, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, l:1, c, r:Math.random()*3+2 });
}
function updateParticles(dt) {
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x+=p.vx; p.y+=p.vy; p.l-=dt*2;
        if(p.l<=0) particles.splice(i,1);
    }
}
function addFloat(s, x, y, c) { floats.push({s,x,y,c,t:1.0}); }
function updateFloats(dt) {
    for(let i=floats.length-1; i>=0; i--) {
        let f = floats[i];
        f.y-=60*dt; f.t-=dt;
        if(f.t<=0) floats.splice(i,1);
    }
}

/* --- DRAW --- */
function draw() {
    // Camera
    let camY = 0;
    const mid = STATE.h * 0.4;
    if (hook.y > mid) camY = -hook.y + mid;

    // Background: Deep Abyss
    const g = ctx.createLinearGradient(0, 0, 0, STATE.h * 2);
    g.addColorStop(0, '#153053');
    g.addColorStop(0.25, '#0a1830');
    g.addColorStop(0.7, '#07111d');
    g.addColorStop(1, '#02060f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, STATE.w, STATE.h);

    for (let i = 0; i < 18; i++) {
        const px = (i * 137 + (STATE.time * 18)) % (STATE.w + 120) - 60;
        const py = (i * 211 + STATE.time * 28) % (STATE.h + 180) - 90;
        ctx.fillStyle = `rgba(255,255,255,${0.03 + (i % 3) * 0.015})`;
        ctx.beginPath();
        ctx.arc(px, py, 2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(0, camY);

    // Depth Markers
    const currentMaxDepth = getMaxDepth();
    const viewportTop = -camY - 100;
    const viewportBottom = -camY + STATE.h + 100;
    let startD = Math.max(100, Math.floor(viewportTop / 100) * 100);
    let endD = Math.min(currentMaxDepth, Math.ceil(viewportBottom / 100) * 100);

    ctx.font = '600 14px "Rajdhani"';
    ctx.textAlign = 'right';
    for(let d = startD; d <= endD; d += 100) {
        ctx.fillStyle = 'rgba(45, 212, 191, 0.08)';
        ctx.fillRect(0, d, STATE.w, 1);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.46)';
        ctx.fillText(`${d}m`, STATE.w-20, d+5);
    }

    // Line
    ctx.beginPath();
    ctx.moveTo(boat.x, boat.y);
    ctx.lineTo(hook.x, hook.y);
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.24)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Hook (Abyssal catcher core)
    ctx.fillStyle = '#dbeafe';
    ctx.beginPath(); 
    ctx.moveTo(hook.x, hook.y - 12);
    ctx.lineTo(hook.x - 10, hook.y - 2);
    ctx.lineTo(hook.x - 4, hook.y + 12);
    ctx.lineTo(hook.x + 4, hook.y + 12);
    ctx.lineTo(hook.x + 10, hook.y - 2);
    ctx.fill();

    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath(); ctx.arc(hook.x, hook.y, 5, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(251,191,36,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hook.x - 8, hook.y + 2);
    ctx.lineTo(hook.x - 12, hook.y + 13);
    ctx.moveTo(hook.x + 8, hook.y + 2);
    ctx.lineTo(hook.x + 12, hook.y + 13);
    ctx.stroke();

    // Fish
    [...fishes, ...hook.caught].forEach(f => {
        if (hook.caught.includes(f)) return;
        if (!f.caughtBy && (f.y+camY > -100 && f.y+camY < STATE.h+100)) drawFish(f, f.x, f.y);
    });
    
    // Caught Fish
    hook.caught.forEach((f, i) => drawFish(f, hook.x, hook.y + 10 + i*12, true));

    // Pets
    activePets.forEach(p => {
        drawPet(p);
        if (p.held) drawFish(p.held, p.x, p.y + 10, true);
    });

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.c;
        ctx.globalAlpha = p.l;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });

    ctx.restore();

    // Boat
    ctx.save();
    ctx.translate(0, camY);

    ctx.fillStyle = 'rgba(251, 191, 36, 0.16)';
    ctx.beginPath();
    ctx.ellipse(boat.x, boat.y + 8, 52, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hull
    ctx.fillStyle = '#0f2743';
    ctx.beginPath();
    ctx.moveTo(boat.x - 34, boat.y);
    ctx.quadraticCurveTo(boat.x, boat.y + 22, boat.x + 34, boat.y);
    ctx.lineTo(boat.x + 24, boat.y - 12);
    ctx.lineTo(boat.x - 24, boat.y - 12);
    ctx.closePath();
    ctx.fill();

    // Trim
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(boat.x - 28, boat.y - 10, 56, 4);

    // Cabin / crane
    ctx.fillStyle = '#dbeafe';
    ctx.fillRect(boat.x - 11, boat.y - 27, 22, 16);
    ctx.fillStyle = '#93c5fd';
    ctx.fillRect(boat.x - 4, boat.y - 34, 8, 8);
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(boat.x + 10, boat.y - 12);
    ctx.lineTo(boat.x + 18, boat.y - 28);
    ctx.lineTo(boat.x + 8, boat.y - 28);
    ctx.stroke();
    ctx.restore();

    // UI Floats
    ctx.save();
    ctx.translate(0, camY);
    floats.forEach(t => {
        ctx.font = '700 20px "Rajdhani"';
        ctx.fillStyle = t.c;
        ctx.fillText(t.s, t.x, t.y);
    });
    ctx.restore();
}

/* --- ENTITY DRAWING --- */
function drawFish(f, x, y, caught=false) {
    ctx.save();
    ctx.translate(x, y);
    if (caught) ctx.rotate(-Math.PI/2);
    else if (f.vx < 0) ctx.scale(-1, 1);
    
    const s = f.scale || 1;
    ctx.scale(s, s);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(-2, 5, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.quadraticCurveTo(3, -10, -10, -4);
    ctx.quadraticCurveTo(-16, 0, -10, 4);
    ctx.quadraticCurveTo(3, 10, 14, 0);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath();
    ctx.moveTo(3, -3);
    ctx.quadraticCurveTo(-2, -6, -8, -3);
    ctx.quadraticCurveTo(-1, -2, 3, -3);
    ctx.fill();

    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-18, -7); ctx.lineTo(-18, 7); ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.beginPath(); ctx.arc(6, -2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#082032';
    ctx.beginPath(); ctx.arc(6.5, -2, 1, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

function drawPet(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.x > boat.x) ctx.scale(-1, 1);

    const shell = p.type === 'super' ? '#fbbf24' : (p.type === 'guard' ? '#94a3b8' : '#dbeafe');
    const trim = p.type === 'super' ? '#fff3c4' : (p.type === 'guard' ? '#cbd5e1' : '#99f6e4');

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 8, 14, 4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = shell;
    ctx.beginPath(); ctx.roundRect(-12, -7, 24, 16, 8); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -3, 7, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = trim;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -1);
    ctx.lineTo(10, -1);
    ctx.stroke();

    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath(); ctx.roundRect(5, -6, 8, 4, 2); ctx.fill();

    ctx.fillStyle = trim;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-18, -5); ctx.lineTo(-18, 5); ctx.fill();

    ctx.fillStyle = '#082032';
    ctx.beginPath(); ctx.arc(10, -3, 1.1, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

/* --- INPUT & UI --- */
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); STATE.touching = true; });
window.addEventListener('pointerup', () => STATE.touching = false);

els.btns.depth.onclick = () => buy('depth');
els.btns.luck.onclick = () => buy('luck');
els.btns.cap.onclick = () => buy('cap');
els.btns.baby.onclick = () => buyPet('baby');
els.btns.guard.onclick = () => buyPet('guard');
els.btns.super.onclick = () => buyPet('super');

    els.shopToggle.onclick = () => {
        STATE.shopOpen = !STATE.shopOpen;
        els.shop.classList.toggle('minimized', !STATE.shopOpen);
        els.shopToggle.innerText = STATE.shopOpen ? 'Hide' : 'Show';
        AudioSys.play(STATE.shopOpen ? 'buy' : 'blocked');
    };

els.tabs.gear.onclick = () => setTab('GEAR');
els.tabs.pets.onclick = () => setTab('PETS');

document.getElementById('btn-start').onclick = () => {
    AudioSys.init();
    AudioSys.play('start');
    AudioSys.startLoop();
    showFeedback('launch');
    els.start.classList.add('hidden');
    els.hud.classList.remove('hidden');
    els.shop.classList.remove('hidden');
    STATE.mode = 'PLAYING';
};

document.addEventListener('visibilitychange', () => {
    if (document.hidden) AudioSys.stopLoop();
    else if (STATE.mode === 'PLAYING') AudioSys.startLoop();
});

function setTab(t) {
    STATE.shopTab = t;
    els.tabs.gear.classList.toggle('active', t==='GEAR');
    els.tabs.pets.classList.toggle('active', t==='PETS');
    els.content.gear.classList.toggle('hidden', t!=='GEAR');
    els.content.pets.classList.toggle('hidden', t!=='PETS');
}

function buy(k) {
    // Infinite Money = Always Buy
    UPGRADES[k].lvl++;
    AudioSys.play('buy');
    updateShopUI();
}

function buyPet(k) {
    // Infinite Money = Always Buy
    PETS[k].count++;
    AudioSys.play('buy');
    updateShopUI();
}

function updateShopUI() {
    els.score.innerText = STATE.score;
    // Money is static Infinity
    
    els.vals.depth.innerText = 'Lvl ' + UPGRADES.depth.lvl;
    els.vals.luck.innerText = 'Lvl ' + UPGRADES.luck.lvl;
    els.vals.cap.innerText = 'x' + UPGRADES.cap.lvl;

    els.counts.baby.innerText = 'x' + PETS.baby.count;
    els.counts.guard.innerText = 'x' + PETS.guard.count;
    els.counts.super.innerText = 'x' + PETS.super.count;
}
