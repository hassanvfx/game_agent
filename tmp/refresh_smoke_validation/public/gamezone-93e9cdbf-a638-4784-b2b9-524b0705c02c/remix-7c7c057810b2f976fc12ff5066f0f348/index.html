<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Lockdown</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-core: #05070f;
            --bg-grid: #0d1330;
            --panel-bg: rgba(11, 16, 34, 0.78);
            --panel-border: rgba(110, 229, 255, 0.34);
            --text-main: #f4f8ff;
            --text-soft: #9cb2d9;
            --accent-cyan: #69f4ff;
            --accent-blue: #5c8dff;
            --accent-magenta: #ff4fd8;
            --accent-danger: #ff5067;
            --accent-warning: #ffc857;
            --shadow-glow: 0 0 24px rgba(92, 141, 255, 0.26);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #17204d 0%, #090b17 38%, #04050a 100%);
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
            color: var(--text-main);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .ui-tech {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .ui-copy {
            font-family: 'Exo 2', sans-serif;
        }
        .glass-panel {
            background: linear-gradient(180deg, rgba(19, 29, 59, 0.88), rgba(8, 12, 26, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 16px 42px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .hud-shell {
            background: linear-gradient(180deg, rgba(8, 12, 26, 0.9), rgba(9, 17, 34, 0.58));
            border: 1px solid rgba(105, 244, 255, 0.2);
            border-radius: 18px;
            padding: 0.7rem 0.85rem 0.8rem;
            box-shadow: var(--shadow-glow);
        }
        .hud-title {
            text-shadow: 0 0 16px rgba(255, 79, 216, 0.5);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff4fd8 0%, #744bff 45%, #2eb8ff 100%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 18px rgba(116, 75, 255, 0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 0 8px rgba(92, 141, 255, 0.8);
            filter: brightness(1.06);
        }
        .scan-line {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(105,244,255,0.08) 50%, rgba(255,255,255,0));
            animation: scan 4s linear infinite;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        .hud-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(105, 244, 255, 0.18), transparent 48%),
                radial-gradient(circle at 50% 100%, rgba(255, 79, 216, 0.12), transparent 40%);
            opacity: 0.9;
        }
        .spark-field {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .spark-field span {
            position: absolute;
            width: 0.3rem;
            height: 0.3rem;
            border-radius: 999px;
            background: rgba(105, 244, 255, 0.8);
            box-shadow: 0 0 10px rgba(105, 244, 255, 0.8);
            animation: sparkFloat 2.4s ease-in-out infinite;
        }
        .spark-field span:nth-child(1) { left: 14%; top: 72%; animation-delay: 0s; }
        .spark-field span:nth-child(2) { left: 50%; top: 56%; animation-delay: 0.55s; background: rgba(255, 79, 216, 0.78); box-shadow: 0 0 12px rgba(255, 79, 216, 0.78); }
        .spark-field span:nth-child(3) { left: 82%; top: 68%; animation-delay: 1.1s; }
        .character-card {
            position: relative;
            overflow: hidden;
        }
        .character-card::before {
            content: "";
            position: absolute;
            inset: auto -12% -38% auto;
            width: 8rem;
            height: 8rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,79,216,0.4), transparent 68%);
            pointer-events: none;
        }
        .signal-avatar {
            width: 6.5rem;
            height: 6.5rem;
            margin: 0 auto 1rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.16);
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0 8%, transparent 9%),
                radial-gradient(circle at 65% 30%, rgba(255,255,255,0.95) 0 8%, transparent 9%),
                linear-gradient(180deg, rgba(130,245,255,0.95), rgba(102,113,255,0.95));
            box-shadow:
                0 0 0 4px rgba(105, 244, 255, 0.1),
                0 0 26px rgba(105, 244, 255, 0.35);
            position: relative;
        }
        .signal-avatar::before {
            content: "";
            position: absolute;
            inset: 18% 18% auto 18%;
            height: 2.3rem;
            border-radius: 999px;
            background: rgba(5, 7, 15, 0.45);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .signal-avatar::after {
            content: "";
            position: absolute;
            left: 22%;
            right: 22%;
            bottom: 18%;
            height: 1rem;
            border-radius: 0 0 1rem 1rem;
            border-bottom: 0.34rem solid rgba(255,255,255,0.82);
            border-left: 0.2rem solid transparent;
            border-right: 0.2rem solid transparent;
        }
        .phase-chip {
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 0.32rem 0.7rem;
            background: rgba(255,255,255,0.04);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }
        .feedback-overlay {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
            transform: translateX(-50%);
            width: min(34vw, 9rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(8, 12, 26, 0.5);
            box-shadow: 0 0 24px rgba(105, 244, 255, 0.25);
            opacity: 0;
            pointer-events: none;
            z-index: 35;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .feedback-overlay.is-visible {
            opacity: 0.92;
            transform: translateX(-50%) translateY(-0.2rem);
        }
        .feedback-caption {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 0.25rem);
            transform: translateX(-50%);
            z-index: 36;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(7, 10, 20, 0.78);
            border: 1px solid rgba(105, 244, 255, 0.22);
            color: #c6f7ff;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            opacity: 0;
            transition: opacity 0.18s ease;
            pointer-events: none;
        }
        .feedback-caption.is-visible {
            opacity: 1;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(0.92); opacity: 0.18; }
            50% { transform: translateY(-10px) scale(1.2); opacity: 0.95; }
        }
        .pulse-text {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 79, 216, 0.5); color: #ff6dde; }
            50% { text-shadow: 0 0 20px rgba(105, 244, 255, 0.8); color: #fff; }
        }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }
    </style>
</head>

<script>
const CONFIG = {
    civilianCount: 40,
    bossHpBase: 100,
    bossHpRage: 200,
    rageSpeedMult: 3.5,
    colors: {
        bg: '#060914',
        grid: '#16213f',
        civilian: '#5a6b8f',
        civilianGlow: '#7be8ff',
        boss: '#8af8ff',
        bossRage: '#ff4fd8',
        bossFace: '#d6f3ff',
        particle: '#fbbf24',
        particleAlt: '#ff4fd8'
    }
};

const STATE = {
    mode: 'MENU',
    width: 0,
    height: 0,
    lastTime: 0,
    shake: 0,
    flash: 0,
    boss: null,
    civilians: [],
    particles: [],
    bullets: [],
    phase: 1
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let audioCtx = null;
let audioUnlocked = false;
let lastMissSoundAt = 0;
let lastScanSoundAt = 0;
let reactionTimer = null;

const SOUNDS = {
    bgm: document.getElementById('bgm'),
    voice: document.getElementById('voice_transform'),
    hit: document.getElementById('sfx_hit'),
    scan: document.getElementById('sfx_scan'),
    miss: document.getElementById('sfx_miss'),
    start: document.getElementById('sfx_start'),
    win: document.getElementById('sfx_win')
};

const REACTION_GIFS = {
    hit: {
        src: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',
        label: 'SIGNAL HIT'
    },
    win: {
        src: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',
        label: 'GRID SECURED'
    }
};

function ensureAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function initAudio() {
    const ctxRef = ensureAudioContext();
    if (ctxRef.state === 'suspended') {
        ctxRef.resume().catch(() => {});
    }
    const buffer = ctxRef.createBuffer(1, 1, 22050);
    const source = ctxRef.createBufferSource();
    source.buffer = buffer;
    source.connect(ctxRef.destination);
    source.start(0);
    audioUnlocked = true;
}

function playSound(id, options = {}) {
    const el = SOUNDS[id];
    if (!el || !audioUnlocked) return;
    if (typeof options.volume === 'number') {
        el.volume = options.volume;
    }
    if (options.restart !== false) {
        el.currentTime = 0;
    }
    el.play().catch(() => {});
}

function playShotSound() {
    if (!audioUnlocked) return;
    const ctxRef = ensureAudioContext();
    if (ctxRef.state === 'suspended') return;

    const osc = ctxRef.createOscillator();
    const gain = ctxRef.createGain();
    osc.connect(gain);
    gain.connect(ctxRef.destination);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, ctxRef.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctxRef.currentTime + 0.08);
    osc.frequency.exponentialRampToValueAtTime(0.01, ctxRef.currentTime + 0.2);

    gain.gain.setValueAtTime(0.12, ctxRef.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctxRef.currentTime + 0.2);

    osc.start();
    osc.stop(ctxRef.currentTime + 0.2);
}

function playScanCue() {
    const now = performance.now();
    if (now - lastScanSoundAt < 90) return;
    lastScanSoundAt = now;
    playSound('scan', { volume: 0.32 });
    playShotSound();
}

function playMissCue() {
    const now = performance.now();
    if (now - lastMissSoundAt < 250) return;
    lastMissSoundAt = now;
    playSound('miss', { volume: 0.24 });
}

function startMusic() {
    if (!audioUnlocked) return;
    SOUNDS.bgm.volume = 0.22;
    SOUNDS.bgm.play().catch(() => {});
}

function stopMusic(reset = true) {
    SOUNDS.bgm.pause();
    if (reset) {
        SOUNDS.bgm.currentTime = 0;
    }
}

function showReaction(type, duration = 1100) {
    const reaction = REACTION_GIFS[type];
    const gif = document.getElementById('reaction-gif');
    const caption = document.getElementById('reaction-caption');
    if (!reaction || !gif || !caption) return;

    gif.src = reaction.src;
    caption.textContent = reaction.label;
    gif.classList.add('is-visible');
    caption.classList.add('is-visible');

    clearTimeout(reactionTimer);
    reactionTimer = setTimeout(() => {
        gif.classList.remove('is-visible');
        caption.classList.remove('is-visible');
    }, duration);
}

class Entity {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.dead = false;
    }
}

class Civilian extends Entity {
    constructor(w, h) {
        super(Math.random() * w, Math.random() * (h - 200) + 100);
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.w = 25;
        this.h = 55;
        this.color = `hsl(${205 + Math.random() * 35}, ${28 + Math.random() * 20}%, ${34 + Math.random() * 16}%)`;
        this.accent = Math.random() > 0.5 ? CONFIG.colors.civilianGlow : '#ff8ae8';
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -30) this.x = STATE.width + 30;
        if (this.x > STATE.width + 30) this.x = -30;
        if (this.y < 50 || this.y > STATE.height - 100) this.vy *= -1;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = 'rgba(105, 244, 255, 0.12)';
        ctx.beginPath();
        ctx.ellipse(0, 6, this.w * 0.75, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-this.w / 2, -this.h, this.w, this.h, 8);
        ctx.fill();

        ctx.fillStyle = this.accent;
        ctx.fillRect(-this.w / 2 + 4, -this.h + 10, this.w - 8, 4);
        ctx.fillRect(-3, -this.h + 18, 6, this.h - 22);

        ctx.fillStyle = '#0a1020';
        ctx.beginPath();
        ctx.arc(0, -this.h - 10, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#8af8ff';
        ctx.fillRect(-8, -this.h - 12, 16, 4);

        ctx.restore();
    }
}

class Boss extends Entity {
    constructor(x, y) {
        super(x, y);
        this.w = 35;
        this.h = 75;
        this.maxHp = CONFIG.bossHpBase;
        this.hp = this.maxHp;
        this.vx = 2;
        this.vy = 1;
        this.phase = 1;
        this.color = CONFIG.colors.boss;
    }

    update(dt) {
        const speed = this.phase === 2 ? CONFIG.rageSpeedMult : 1;

        if (this.phase === 1) {
            this.x += this.vx;
            if (this.x > STATE.width + 50) this.x = -50;
        } else {
            this.x += Math.cos(Date.now() / 200) * 8 + (this.vx * speed);
            this.y += Math.sin(Date.now() / 300) * 4;

            if (this.x < 50 || this.x > STATE.width - 50) this.vx *= -1;
            this.y = Math.max(100, Math.min(STATE.height - 200, this.y));
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const pulse = Math.sin(Date.now() / 180) * 0.5 + 0.5;
        if (this.phase === 2) {
            ctx.shadowColor = CONFIG.colors.bossRage;
            ctx.shadowBlur = 24 + pulse * 14;
        } else {
            ctx.shadowColor = CONFIG.colors.boss;
            ctx.shadowBlur = 18;
        }

        ctx.fillStyle = this.phase === 2 ? 'rgba(255, 79, 216, 0.22)' : 'rgba(105, 244, 255, 0.18)';
        ctx.beginPath();
        ctx.ellipse(0, 12, this.w * 1.2, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.phase === 2 ? '#40103b' : '#16244e';
        ctx.beginPath();
        ctx.roundRect(-this.w / 2, -this.h, this.w, this.h, 11);
        ctx.fill();

        ctx.fillStyle = this.phase === 2 ? '#ff7be8' : '#8af8ff';
        ctx.fillRect(-this.w / 2 + 4, -this.h + 10, this.w - 8, 5);
        ctx.fillRect(-4, -this.h + 18, 8, this.h - 24);

        ctx.fillStyle = this.phase === 2 ? '#ff4fd8' : '#2be0ff';
        ctx.beginPath();
        ctx.moveTo(0, -this.h + 18);
        ctx.lineTo(-8, -this.h + 48);
        ctx.lineTo(0, -this.h + 58);
        ctx.lineTo(8, -this.h + 48);
        ctx.fill();

        ctx.fillStyle = CONFIG.colors.bossFace;
        ctx.beginPath();
        ctx.arc(0, -this.h - 14, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#09101d';
        ctx.fillRect(-12, -this.h - 18, 24, 7);

        ctx.fillStyle = this.phase === 2 ? '#ffcf4d' : '#ffffff';
        ctx.fillRect(-9, -this.h - 8, 18, 2);

        ctx.strokeStyle = this.phase === 2 ? '#ff4fd8' : '#69f4ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -this.h - 14, 20 + pulse * 4, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color, speed) {
        this.x = x;
        this.y = y;
        this.color = color;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * speed;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.vy += 0.2;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1.0;
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        STATE.particles.push(new Particle(x, y, color, 10));
    }
}

function resize() {
    STATE.width = window.innerWidth;
    STATE.height = window.innerHeight;
    canvas.width = STATE.width;
    canvas.height = STATE.height;
}

function updateHUD() {
    if (!STATE.boss) return;
    const hpPct = Math.max(0, (STATE.boss.hp / STATE.boss.maxHp) * 100);
    document.getElementById('hp-fill').style.width = hpPct + '%';

    const label = document.getElementById('phase-label');
    if (STATE.mode === 'PLAY') {
        if (STATE.phase === 1) {
            label.innerText = 'TAG SIGNAL';
            label.className = 'ui-tech text-xs sm:text-lg text-cyan-200 tracking-[0.22em] phase-chip';
        } else {
            label.innerText = 'PURGE GLITCH';
            label.className = 'ui-tech text-xs sm:text-lg text-fuchsia-300 font-bold tracking-[0.22em] phase-chip animate-pulse';
        }
    } else if (STATE.mode === 'TRANSFORM') {
        label.innerText = 'SIGNAL SPIKE...';
        label.className = 'ui-tech text-xs sm:text-lg text-rose-400 font-bold tracking-[0.22em] phase-chip';
    }
}

function handleInput(e) {
    if (STATE.mode !== 'PLAY') return;

    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    STATE.shake = 15;
    playScanCue();

    const flash = document.getElementById('flash-overlay');
    flash.style.opacity = '0.4';
    setTimeout(() => { flash.style.opacity = '0'; }, 50);

    spawnParticles(STATE.width / 2, STATE.height, CONFIG.colors.particle, 20);

    checkHit(x, y);
}

function checkHit(x, y) {
    const hitRad = 60;

    const dx = x - STATE.boss.x;
    const dy = y - (STATE.boss.y - STATE.boss.h / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < hitRad) {
        spawnParticles(STATE.boss.x, STATE.boss.y - 40, CONFIG.colors.particleAlt, 15);
        playSound('hit', { volume: 0.38 });
        showReaction('hit', 900);

        STATE.boss.hp -= 10;

        if (STATE.phase === 1) {
            STATE.civilians.forEach(c => {
                c.vx = (c.x - STATE.width / 2 > 0) ? 5 : -5;
                c.vy *= 2;
            });
        }

        if (STATE.boss.hp <= 0) {
            if (STATE.phase === 1) {
                triggerTransformation();
            } else {
                triggerWin();
            }
        }
    } else {
        spawnParticles(x, y, '#6d7fa8', 5);
        playMissCue();
    }
}

function triggerTransformation() {
    STATE.mode = 'TRANSFORM';
    stopMusic(false);

    STATE.boss.hp = 0;
    updateHUD();

    const voice = SOUNDS.voice;
    voice.volume = 0.3;
    voice.currentTime = 0;
    voice.play().catch(() => setTimeout(enterRage, 1800));

    voice.onended = () => {
        enterRage();
    };

    setTimeout(() => {
        if (STATE.mode === 'TRANSFORM') enterRage();
    }, 4000);
}

function enterRage() {
    STATE.mode = 'PLAY';
    STATE.phase = 2;
    STATE.boss.maxHp = CONFIG.bossHpRage;
    STATE.boss.hp = CONFIG.bossHpRage;
    STATE.boss.phase = 2;
    startMusic();

    const flash = document.getElementById('flash-overlay');
    flash.style.backgroundColor = 'red';
    flash.style.opacity = '0.5';
    setTimeout(() => {
        flash.style.opacity = '0';
        flash.style.backgroundColor = 'white';
    }, 500);
}

function triggerWin() {
    STATE.mode = 'WIN';
    stopMusic();
    playSound('win', { volume: 0.4 });
    showReaction('win', 2600);
    document.getElementById('ui-layer').classList.remove('pointer-events-none');
    document.getElementById('end-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('end-title').innerText = 'GRID SECURED';
    document.getElementById('end-subtitle').innerText = 'The rogue signal has been neutralized.';
    document.getElementById('end-title').className = 'ui-tech text-4xl sm:text-5xl font-bold mb-4 text-emerald-300 text-center';
}

function resetGame() {
    STATE.mode = 'PLAY';
    STATE.phase = 1;
    STATE.shake = 0;
    STATE.particles = [];
    clearTimeout(reactionTimer);
    document.getElementById('reaction-gif').classList.remove('is-visible');
    document.getElementById('reaction-caption').classList.remove('is-visible');

    STATE.civilians = [];
    for (let i = 0; i < CONFIG.civilianCount; i++) {
        STATE.civilians.push(new Civilian(STATE.width, STATE.height));
    }
    STATE.boss = new Boss(STATE.width / 2, STATE.height / 2);

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('ui-layer').classList.add('pointer-events-none');

    startMusic();
}

function loop(timestamp) {
    if (!STATE.lastTime) STATE.lastTime = timestamp;
    const dt = timestamp - STATE.lastTime;
    STATE.lastTime = timestamp;

    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, STATE.width, STATE.height);

    ctx.save();
    if (STATE.shake > 0) {
        const dx = (Math.random() - 0.5) * STATE.shake;
        const dy = (Math.random() - 0.5) * STATE.shake;
        ctx.translate(dx, dy);
        STATE.shake *= 0.9;
        if (STATE.shake < 0.5) STATE.shake = 0;
    }

    const bgGrad = ctx.createLinearGradient(0, 0, 0, STATE.height);
    bgGrad.addColorStop(0, '#091020');
    bgGrad.addColorStop(0.55, '#070a14');
    bgGrad.addColorStop(1, '#020307');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, STATE.width, STATE.height);

    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x < STATE.width; x += 48) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, STATE.height);
    }
    for (let y = STATE.height * 0.18; y < STATE.height; y += 52) {
        ctx.moveTo(0, y);
        ctx.lineTo(STATE.width, y);
    }
    ctx.stroke();

    const skylineY = STATE.height * 0.2;
    for (let i = 0; i < 12; i++) {
        const bx = i * (STATE.width / 11) - 30;
        const bw = 26 + (i % 3) * 18;
        const bh = 40 + (i % 5) * 18;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(92, 141, 255, 0.14)' : 'rgba(255, 79, 216, 0.11)';
        ctx.fillRect(bx, skylineY - bh, bw, bh);
        ctx.fillStyle = 'rgba(105, 244, 255, 0.28)';
        ctx.fillRect(bx + 5, skylineY - bh + 8, 4, 4);
        ctx.fillRect(bx + bw - 10, skylineY - bh + 18, 4, 4);
    }

    if (STATE.mode === 'PLAY' || STATE.mode === 'TRANSFORM') {
        STATE.civilians.forEach(c => {
            c.update(dt);
            c.draw(ctx);
        });

        if (STATE.boss) {
            if (STATE.mode === 'PLAY') STATE.boss.update(dt);
            STATE.boss.draw(ctx);
        }

        STATE.particles = STATE.particles.filter(p => p.life > 0);
        STATE.particles.forEach(p => {
            p.update();
            p.draw(ctx);
        });

        updateHUD();
    }

    ctx.restore();

    const grad = ctx.createRadialGradient(STATE.width / 2, STATE.height / 2, STATE.height / 3, STATE.width / 2, STATE.height / 2, STATE.height);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, STATE.width, STATE.height);

    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopMusic(false);
    } else if (STATE.mode === 'PLAY') {
        startMusic();
    }
});
document.addEventListener('DOMContentLoaded', () => {
    resize();
    requestAnimationFrame(loop);

    const startBtn = document.getElementById('btn-start');
    const restartBtn = document.getElementById('btn-restart');

    const startGame = () => {
        initAudio();
        playSound('start', { volume: 0.3 });
        resetGame();
    };

    const restartGame = () => {
        playSound('start', { volume: 0.24 });
        resetGame();
    };

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);
    // [agent-note][stage4] repaired: mobile-action-path | element: start/restart buttons | action: direct touchend fallback without global touch suppression
    startBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (STATE.mode === 'MENU') startGame();
    }, { passive: false });
    restartBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (STATE.mode === 'WIN') restartGame();
    }, { passive: false });

    canvas.addEventListener('touchstart', handleInput, { passive: false });
    canvas.addEventListener('mousedown', handleInput);
});
</script>
</body>
</html>
