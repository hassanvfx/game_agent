<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pastel Avatar Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --sky-top: #1a1038;
        --sky-bottom: #3a1d6a;
        --panel-bg: rgba(35, 19, 74, 0.72);
        --panel-stroke: rgba(255, 221, 136, 0.72);
        --text-main: #f8f4ff;
        --text-muted: #d9d2f6;
        --accent-pink: #ff77c8;
        --accent-cyan: #7be7ff;
        --accent-gold: #ffd76a;
        --accent-lime: #bdfd7d;
        --shadow-deep: rgba(11, 4, 34, 0.42);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 214, 122, 0.18), transparent 30%),
            linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        font-family: 'Rajdhani', system-ui, sans-serif;
        touch-action: manipulation;
    }
    body { color: var(--text-main); }
    #game-container { position: relative; width: 100%; height: 100%; user-select: none; }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .hidden { display: none !important; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-end { justify-content: flex-end; }
    .justify-between { justify-content: space-between; }
    .text-center { text-align: center; }
    .w-full { width: 100%; }
    .w-5\/6 { width: 83.333333%; }
    .max-w-sm { max-width: 24rem; }
    .flex-1 { flex: 1 1 0%; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .pt-4 { padding-top: 1rem; }
    .pb-8 { padding-bottom: 2rem; }
    .pb-12 { padding-bottom: 3rem; }
    .p-8 { padding: 2rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .py-5 { padding-top: 1.25rem; padding-bottom: 1.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .font-bold { font-weight: 700; }
    .font-black { font-weight: 900; }
    .text-pink-500 { color: #ff9be3; }
    .text-blue-500 { color: #7be7ff; }
    .text-green-500 { color: #caff8a; }
    .text-purple-600 { color: #d7a9ff; }
    .text-gray-500 { color: var(--text-muted); }
    .bg-gradient-to-r {
        background-image: linear-gradient(to right, var(--grad-from, #ffffff), var(--grad-to, #ffffff));
    }
    .from-pink-100 { --grad-from: #fce7f3; }
    .to-purple-100 { --grad-to: #f3e8ff; }

    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
    .clay-btn {
        position: relative;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.08)),
            linear-gradient(180deg, rgba(69, 35, 129, 0.96), rgba(31, 15, 71, 0.96));
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        box-shadow:
            0 10px 22px var(--shadow-deep),
            inset 0 1px 0 rgba(255,255,255,0.25),
            inset 0 -4px 10px rgba(0,0,0,0.18);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        color: var(--text-main);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
        text-shadow: 0 2px 0 rgba(22, 10, 48, 0.5);
        cursor: pointer;
    }
    .clay-btn::before {
        content: '';
        position: absolute;
        inset: 2px;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 42%);
        pointer-events: none;
    }
    .clay-btn:active {
        box-shadow:
            0 4px 10px rgba(7, 3, 22, 0.45),
            inset 0 4px 10px rgba(0,0,0,0.3);
        transform: scale(0.98);
        filter: brightness(1.08);
    }
    .clay-panel {
        background:
            linear-gradient(180deg, rgba(48, 24, 101, 0.88), rgba(28, 14, 63, 0.92));
        backdrop-filter: blur(10px);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(6, 2, 23, 0.4);
        border: 2px solid rgba(255, 230, 157, 0.45);
    }
    .result-title {
        font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 1px;
    }
    #hud {
        position: relative;
    }
    #hud::before {
        content: '';
        position: absolute;
        inset: -8px 14px 14px;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(74, 41, 143, 0.22), rgba(18, 9, 42, 0));
        pointer-events: none;
    }

    @media (max-width: 480px) {
        .px-6 { padding-left: 1rem; padding-right: 1rem; }
        .py-5 { padding-top: 1rem; padding-bottom: 1rem; }
        .text-3xl { font-size: 1.625rem; line-height: 2rem; }
    }
    #sparkles {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }
    #sparkles::before,
    #sparkles::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle, rgba(255,255,255,0.9) 0 2px, transparent 3px),
            radial-gradient(circle, rgba(255,214,106,0.7) 0 2px, transparent 3px),
            radial-gradient(circle, rgba(123,231,255,0.65) 0 1.5px, transparent 2.5px);
        background-size: 140px 140px, 180px 180px, 220px 220px;
        background-position: 12% 18%, 80% 28%, 35% 68%;
        opacity: 0.6;
        animation: driftGlow 12s linear infinite;
    }
    #sparkles::after {
        opacity: 0.35;
        transform: scale(1.08);
        animation-duration: 18s;
        animation-direction: reverse;
    }
    @keyframes driftGlow {
        from { transform: translateY(0); }
        50% { transform: translateY(8px); }
        to { transform: translateY(0); }
    }
    .feedback-gif {
        position: absolute;
        width: min(32vw, 150px);
        max-width: 150px;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 22px;
        border: 2px solid rgba(255, 233, 173, 0.72);
        box-shadow: 0 14px 32px rgba(10, 4, 30, 0.32);
        opacity: 0;
        transform: translateY(8px) scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
        background: rgba(32, 14, 68, 0.68);
    }
    .feedback-gif.active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }
    #style-gif {
        top: clamp(1rem, 7vh, 4rem);
        right: clamp(0.75rem, 4vw, 2rem);
    }
    #result-gif {
        left: 50%;
        bottom: calc(11.5rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(8px) scale(0.92);
    }
    #result-gif.active {
        transform: translateX(-50%) translateY(0) scale(1);
    }

    @media (max-width: 480px) {
        .feedback-gif {
            width: min(36vw, 120px);
            border-radius: 18px;
        }
        #result-gif {
            bottom: calc(10.25rem + env(safe-area-inset-bottom, 0px));
        }
    }

</style>
</head>
<body>

<script id="game-config" type="application/x-game-config">
{
  "skinColor": { "type": "color", "label": "Skin Color", "value": "#ffcdb2" },
  "bgColor1": { "type": "color", "label": "BG Color Top", "value": "#fff0f5" },
  "bgColor2": { "type": "color", "label": "BG Color Bottom", "value": "#ffd1dc" }
}
</script>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-end">
            <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
                <div id="sparkles"></div>
            </div>
            <!-- [agent-note][stage3] resolved-gif: style-change + result-celebration -> catalogs/gifs.json -->
            <img id="style-gif" class="feedback-gif" src="https://i.giphy.com/DX3i6ABlOz0mYVcLj9.webp" alt="Cute style reaction" aria-hidden="true">
            <img id="result-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Celebration reaction" aria-hidden="true">
        
        <!-- HUD: Controls -->
        <div id="hud" class="w-full px-6 pb-8 pt-4 flex flex-col gap-4 pointer-events-auto">
            <div class="flex justify-between gap-3">
                <button data-cat="head" class="clay-btn flex-1 py-4 text-sm text-pink-500">Headwear</button>
                <button data-cat="top" class="clay-btn flex-1 py-4 text-sm text-blue-500">Top</button>
                <button data-cat="bottom" class="clay-btn flex-1 py-4 text-sm text-green-500">Bottom</button>
            </div>
            <button id="btn-finish" class="clay-btn w-full py-5 text-lg text-purple-600 mt-2 bg-gradient-to-r from-pink-100 to-purple-100">Save Look ✨</button>
        </div>

        <!-- Game Over / Photo Result -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col items-center justify-end pb-12 pointer-events-auto">
            <div class="clay-panel p-8 flex flex-col items-center text-center w-5/6 max-w-sm mb-8">
                <h2 class="result-title text-3xl font-black text-purple-600 mb-2">Style Locked In!</h2>
                <p class="text-gray-500 font-bold mb-6">Your pastel avatar card is ready.</p>
                <button id="restart-btn" class="clay-btn w-full py-4 text-lg text-pink-500">Create Another ↺</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ==========================================================================
   SYSTEM INVARIANTS (L0) & CONFIG
   ========================================================================== */
const configEl = document.getElementById('game-config');
window.gameConfigDefs = configEl ? JSON.parse(configEl.textContent) : {};
window.gameConfig = {};
for (const [k, v] of Object.entries(window.gameConfigDefs)) {
    window.gameConfig[k] = v.value;
}
window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

let canvas, ctx, ro;
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let lastTime = 0;

/* [agent-note][stage3] resolved-audio: ui-click, pickup, success, fail, bgm -> catalogs/audios.json */
const AUDIO_MAP = {
    uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
    pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
    success: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
    fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
};

const GIF_DISPLAY_MS = 2200;

// Audio System
let audioCtx = null;
let audioUnlocked = false;
let bgmAudio = null;
const sfxCache = new Map();
const sfxLastPlayed = new Map();
let styleGifTimeout = 0;
let resultGifTimeout = 0;

// Game State
const state = {
    head: 0,
    top: 0,
    bottom: 0,
    bounce: 1.0,
    cyOffset: -60,
    particles: []
};

const OUTFIT_COUNTS = { head: 4, top: 4, bottom: 4 };
const COLORS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#c7f464', '#ff9f43', '#54a0ff'];

/* ==========================================================================
   INITIALIZATION & RESIZE
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    ro = new ResizeObserver(entries => {
        const rect = entries[0].contentRect;
        cw = rect.width;
        ch = rect.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) {
            initGame();
            initialized = true;
            requestAnimationFrame(gameLoop);
        }
    });
    ro.observe(canvas);
});

function initGame() {
    state.head = Math.floor(Math.random() * OUTFIT_COUNTS.head);
    state.top = Math.floor(Math.random() * OUTFIT_COUNTS.top);
    state.bottom = Math.floor(Math.random() * OUTFIT_COUNTS.bottom);
    state.bounce = 1.0;
    state.cyOffset = -80;
    state.particles = [];
    setState('PLAYING');
}

function restartGame() {
    playMappedSfx('uiClick');
    initGame();
}

function ensureBgm() {
    if (bgmAudio) return bgmAudio;
    bgmAudio = new Audio(AUDIO_MAP.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.18;
    bgmAudio.preload = 'auto';
    return bgmAudio;
}

function startBgm() {
    if (!audioUnlocked) return;
    const loop = ensureBgm();
    if (!loop.paused) return;
    const playPromise = loop.play();
    if (playPromise?.catch) {
        playPromise.catch(() => {});
    }
}

function stopBgm() {
    if (!bgmAudio) return;
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
}

function getSfxAudio(key) {
    if (sfxCache.has(key)) {
        return sfxCache.get(key);
    }
    const audio = new Audio(AUDIO_MAP[key]);
    audio.preload = 'auto';
    audio.volume = key === 'success' ? 0.34 : key === 'fail' ? 0.22 : 0.28;
    sfxCache.set(key, audio);
    return audio;
}

function playMappedSfx(key, debounceMs = 90) {
    if (!audioUnlocked) return;
    const now = performance.now();
    const last = sfxLastPlayed.get(key) || 0;
    if (now - last < debounceMs) return;
    sfxLastPlayed.set(key, now);

    try {
        const baseAudio = getSfxAudio(key);
        baseAudio.pause();
        baseAudio.currentTime = 0;
        const playPromise = baseAudio.play();
        if (playPromise?.catch) {
            playPromise.catch(() => {});
        }
    } catch (_) {}
}

function flashGif(id, timeoutHandleName) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(timeoutHandleName === 'style' ? styleGifTimeout : resultGifTimeout);
    el.classList.add('active');
    const timeoutId = window.setTimeout(() => {
        el.classList.remove('active');
    }, GIF_DISPLAY_MS);
    if (timeoutHandleName === 'style') {
        styleGifTimeout = timeoutId;
    } else {
        resultGifTimeout = timeoutId;
    }
}

/* ==========================================================================
   STATE & UI MANAGEMENT
   ========================================================================== */
function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const goScreen = document.getElementById('game-over-screen');
    const resultGif = document.getElementById('result-gif');
    
    if (gameState === 'PLAYING') {
        hud.classList.remove('hidden');
        goScreen.classList.add('hidden');
        resultGif?.classList.remove('active');
        startBgm();
    } else if (gameState === 'GAMEOVER') {
        hud.classList.add('hidden');
        goScreen.classList.remove('hidden');
        stopBgm();
    }
}

/* ==========================================================================
   INPUT & AUDIO ROUTING
   ========================================================================== */
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });

function handleGlobalInput(e) {
    unlockAudio();

    const target = e.target;
    const restartBtn = target.closest('#restart-btn');
    if (gameState === 'GAMEOVER') {
        if (restartBtn) {
            e.preventDefault();
            restartGame();
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    const categoryBtn = target.closest('[data-cat]');
    if (categoryBtn) {
        e.preventDefault();
        changeOutfit(categoryBtn.getAttribute('data-cat'));
        return;
    }

    const finishBtn = target.closest('#btn-finish');
    if (finishBtn) {
        e.preventDefault();
        finishGame();
        return;
    }

    if (target.closest('#hud, #game-over-screen')) {
        return;
    }

    // [agent-note][stage4] repaired: mobile-action-risk | element: global pointer handler | action: keep canvas taps from hijacking HUD button presses
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnParticles(x, y, 5);
    playSfx('tap');
}

function unlockAudio() {
    audioUnlocked = true;
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    startBgm();
}

function playSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'tada') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.1);
        osc.frequency.setValueAtTime(659, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
    } else if (type === 'tap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    }
}

function vibrate(style) {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: style }
    });
}

/* ==========================================================================
   GAME LOGIC
   ========================================================================== */
function changeOutfit(category) {
    state[category] = (state[category] + 1) % OUTFIT_COUNTS[category];
    state.bounce = 1.25;
    playSfx('pop');
    playMappedSfx('pickup', 120);
    vibrate('light');
    flashGif('style-gif', 'style');
    
    // Spawn particles at avatar center
    const cx = cw / 2;
    const cy = ch / 2 + state.cyOffset;
    spawnParticles(cx, cy, 15);
}

function finishGame() {
    const completedLook = state.head !== 0 && state.top !== 0 && state.bottom !== 0;
    if (!completedLook) {
        playMappedSfx('fail', 180);
        flashGif('style-gif', 'style');
        vibrate('light');
        return;
    }

    setState('GAMEOVER');
    playSfx('tada');
    playMappedSfx('success', 140);
    flashGif('result-gif', 'result');
    vibrate('heavy');
    spawnParticles(cw/2, ch/2, 50);
}

function spawnParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 600,
            vy: (Math.random() - 0.5) * 600 - 200,
            life: 1.0,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            size: Math.random() * 6 + 4
        });
    }
}

/* ==========================================================================
   DRAWING & RENDER LOOP
   ========================================================================== */
function drawRoundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
}

function setClayStyle(ctx, color, shadowColor = 'rgba(0,0,0,0.15)') {
    ctx.fillStyle = color;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 5;
    ctx.shadowOffsetX = 0;
}

function clearClayStyle(ctx) {
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
}

function drawAvatar(ctx, cx, cy, scale) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    
    const skin = gameConfig.skinColor;
    const hairPalette = ['#5a3d2b', '#ff8fab', '#6c5ce7', '#2ec4b6'];
    const topPalette = ['#ffd166', '#ffffff', '#6ee7b7', '#1f2937'];
    const bottomPalette = ['#f8fafc', '#4b7bec', '#ff9ff3', '#feca57'];

    ctx.fillStyle = 'rgba(19, 8, 48, 0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 108, 62, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    clearClayStyle(ctx);
    ctx.fillStyle = hairPalette[state.head];
    if (state.head === 1) {
        ctx.beginPath();
        ctx.arc(0, -76, 43, Math.PI * 0.98, Math.PI * 2.02);
        ctx.fill();
    } else if (state.head === 2) {
        ctx.beginPath();
        ctx.ellipse(0, -76, 40, 36, 0, Math.PI, Math.PI * 2);
        ctx.fill();
    } else if (state.head === 3) {
        ctx.beginPath();
        ctx.arc(0, -74, 41, Math.PI * 0.98, Math.PI * 2.02);
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.ellipse(0, -78, 40, 34, 0, Math.PI, Math.PI * 2);
        ctx.fill();
    }
    
    // --- LEGS ---
    setClayStyle(ctx, skin);
    drawRoundRect(ctx, -25, 40, 18, 50, 9); // Left Leg
    drawRoundRect(ctx, 7, 40, 18, 50, 9);   // Right Leg
    
    // Bottoms
    clearClayStyle(ctx);
    if (state.bottom === 1) { // Jeans
        setClayStyle(ctx, '#4b7bec');
        drawRoundRect(ctx, -27, 40, 22, 55, 5);
        drawRoundRect(ctx, 5, 40, 22, 55, 5);
        drawRoundRect(ctx, -32, 20, 64, 30, 8);
    } else if (state.bottom === 2) { // Skirt
        setClayStyle(ctx, '#ff9ff3');
        ctx.beginPath();
        ctx.moveTo(-25, 20);
        ctx.lineTo(-45, 65);
        ctx.lineTo(45, 65);
        ctx.lineTo(25, 20);
        ctx.fill();
    } else if (state.bottom === 3) { // Shorts
        setClayStyle(ctx, '#feca57');
        drawRoundRect(ctx, -28, 20, 24, 45, 8);
        drawRoundRect(ctx, 4, 20, 24, 45, 8);
        drawRoundRect(ctx, -30, 20, 60, 25, 8);
    } else { // Undies
        setClayStyle(ctx, bottomPalette[0]);
        drawRoundRect(ctx, -28, 20, 56, 30, 10);
    }
    
    // --- ARMS (Back) ---
    setClayStyle(ctx, skin);
    drawRoundRect(ctx, -48, -10, 18, 65, 9); // Left Arm
    drawRoundRect(ctx, 30, -10, 18, 65, 9);  // Right Arm
    
    // --- BODY ---
    setClayStyle(ctx, skin);
    drawRoundRect(ctx, -35, -25, 70, 75, 25);
    
    // Tops
    clearClayStyle(ctx);
    if (state.top === 1) { // T-Shirt
        setClayStyle(ctx, topPalette[1]);
        drawRoundRect(ctx, -37, -27, 74, 60, 20); // Body
        drawRoundRect(ctx, -50, -12, 25, 30, 10); // L Sleeve
        drawRoundRect(ctx, 25, -12, 25, 30, 10);  // R Sleeve
    } else if (state.top === 2) { // Sweater
        setClayStyle(ctx, topPalette[2]);
        drawRoundRect(ctx, -40, -30, 80, 65, 25); // Body
        drawRoundRect(ctx, -55, -15, 28, 70, 14); // L Sleeve
        drawRoundRect(ctx, 27, -15, 28, 70, 14);  // R Sleeve
    } else if (state.top === 3) { // Suit
        setClayStyle(ctx, topPalette[3]);
        drawRoundRect(ctx, -38, -28, 76, 65, 20); // Body
        drawRoundRect(ctx, -52, -12, 24, 65, 10); // L Sleeve
        drawRoundRect(ctx, 28, -12, 24, 65, 10);  // R Sleeve
        // Tie
        setClayStyle(ctx, '#ee5253', 'transparent');
        ctx.beginPath(); ctx.moveTo(-5, -25); ctx.lineTo(5, -25); ctx.lineTo(0, 15); ctx.fill();
    }
    
    // --- HEAD ---
    setClayStyle(ctx, skin);
    ctx.beginPath();
    ctx.arc(0, -65, 45, 0, Math.PI * 2);
    ctx.fill();

    clearClayStyle(ctx);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(-10, -76, 26, Math.PI * 1.1, Math.PI * 1.85);
    ctx.stroke();

    // Face
    clearClayStyle(ctx);
    ctx.fillStyle = '#2d2347';
    ctx.beginPath(); ctx.arc(-15, -60, 4, 0, Math.PI*2); ctx.fill(); // L Eye
    ctx.beginPath(); ctx.arc(15, -60, 4, 0, Math.PI*2); ctx.fill();  // R Eye
    ctx.strokeStyle = '#2d2347';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -50, 6, 0, Math.PI, false); ctx.stroke(); // Smile

    // Blushes
    ctx.fillStyle = 'rgba(255, 124, 190, 0.55)';
    ctx.beginPath(); ctx.arc(-25, -55, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(25, -55, 6, 0, Math.PI*2); ctx.fill();

    // Sparkle badge on chest for character-first identity
    ctx.fillStyle = 'rgba(255, 230, 122, 0.92)';
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(4, 4);
    ctx.lineTo(16, 4);
    ctx.lineTo(6, 12);
    ctx.lineTo(10, 24);
    ctx.lineTo(0, 16);
    ctx.lineTo(-10, 24);
    ctx.lineTo(-6, 12);
    ctx.lineTo(-16, 4);
    ctx.lineTo(-4, 4);
    ctx.closePath();
    ctx.fill();
    
    // Hats
    clearClayStyle(ctx);
    if (state.head === 1) { // Cap
        setClayStyle(ctx, '#ff6b6b');
        ctx.beginPath(); ctx.arc(0, -75, 46, Math.PI, 0); ctx.fill();
        drawRoundRect(ctx, -45, -75, 70, 12, 6); // Brim
    } else if (state.head === 2) { // Crown
        setClayStyle(ctx, '#feca57');
        ctx.beginPath();
        ctx.moveTo(-35, -95);
        ctx.lineTo(-45, -140);
        ctx.lineTo(-15, -115);
        ctx.lineTo(0, -145);
        ctx.lineTo(15, -115);
        ctx.lineTo(45, -140);
        ctx.lineTo(35, -95);
        ctx.closePath();
        ctx.fill();
    } else if (state.head === 3) { // Beanie
        setClayStyle(ctx, '#0abde3');
        ctx.beginPath(); ctx.arc(0, -70, 46, Math.PI, 0); ctx.fill();
        drawRoundRect(ctx, -48, -75, 96, 18, 9);
        setClayStyle(ctx, '#ffffff');
        ctx.beginPath(); ctx.arc(0, -120, 15, 0, Math.PI*2); ctx.fill(); // Pompom
    }
    
    ctx.restore();
}

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.05) dt = 0.05;
    
    try {
        // Background Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, ch);
        grad.addColorStop(0, gameConfig.bgColor1);
        grad.addColorStop(1, gameConfig.bgColor2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, cw, ch);

        const aurora = ctx.createRadialGradient(cw * 0.5, ch * 0.15, 10, cw * 0.5, ch * 0.15, ch * 0.7);
        aurora.addColorStop(0, 'rgba(255, 236, 171, 0.24)');
        aurora.addColorStop(0.45, 'rgba(123, 231, 255, 0.12)');
        aurora.addColorStop(1, 'rgba(123, 231, 255, 0)');
        ctx.fillStyle = aurora;
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 10; i++) {
            const sx = (i * 137.5 + timestamp * 0.015) % (cw + 160) - 80;
            const sy = 40 + (i % 4) * 42;
            ctx.beginPath();
            ctx.arc(sx, sy, 2 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Update State
        state.bounce += (1.0 - state.bounce) * 15 * dt;
        
        let targetCyOffset = gameState === 'PLAYING' ? -80 : 0;
        state.cyOffset += (targetCyOffset - state.cyOffset) * 8 * dt;
        
        // Draw Avatar
        const cx = Math.max(0, cw / 2);
        const cy = Math.max(0, ch / 2 + state.cyOffset);
        
        // Photo frame if game over
        if (gameState === 'GAMEOVER') {
            ctx.save();
            setClayStyle(ctx, '#ffffff');
            drawRoundRect(ctx, cx - 140, cy - 180, 280, 340, 20);
            ctx.restore();
        }
        
        drawAvatar(ctx, cx, cy, state.bounce);
        
        // Particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
            let p = state.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 1200 * dt; // Gravity
            p.life -= dt * 1.2;
            
            if (p.life <= 0 || !isFinite(p.x) || !isFinite(p.y)) {
                state.particles.splice(i, 1);
                continue;
            }
            
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        
    } catch (e) {
        console.error("Loop error:", e);
        // Loop resilience: reset state on fatal render error
        state.particles = [];
        state.bounce = 1.0;
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        bgmAudio?.pause();
        return;
    }
    if (gameState === 'PLAYING') {
        startBgm();
    }
});
</script>
