<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
<title>Copper Valley: Night Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<style>
    /* CORE RESET & LAYOUT */
    :root {
        --bg-color: #090d16;
        --bg-deep: #04070d;
        --ui-bg: rgba(9, 15, 27, 0.88);
        --ui-border: rgba(117, 197, 255, 0.38);
        --ui-border-strong: rgba(157, 225, 255, 0.78);
        --panel-edge: rgba(255, 173, 92, 0.72);
        --accent: #ffb45e;
        --accent-2: #6ce6ff;
        --accent-soft: #b5f6ff;
        --danger: #ef5f6e;
        --success: #79dc88;
        --text-main: #eef7ff;
        --text-dim: #a9bed0;
        --shadow-deep: rgba(0, 0, 0, 0.42);
        --glow-soft: 0 0 18px rgba(108, 230, 255, 0.18);
    }
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        background:
            radial-gradient(circle at top, rgba(108, 230, 255, 0.08), transparent 34%),
            linear-gradient(180deg, #111827 0%, var(--bg-color) 30%, var(--bg-deep) 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    
    /* GAME CONTAINER */
    #game-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 10%, rgba(255, 180, 94, 0.1), transparent 28%),
            linear-gradient(180deg, #0e1726 0%, #09111d 45%, #05080f 100%);
    }
    canvas {
        display: block;
        width: 100%; height: 100%;
        image-rendering: pixelated;
        touch-action: none;
    }

    /* UI LAYER */
    #ui-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* HUD */
    #hud {
        padding: 10px;
        padding-top: max(10px, env(safe-area-inset-top));
        display: flex;
        justify-content: space-between;
        pointer-events: auto;
        width: 100%;
        box-sizing: border-box;
    }
    .hud-group {
        display: flex;
        gap: 8px;
    }
    .hud-box {
        background:
            linear-gradient(180deg, rgba(20, 33, 53, 0.98), rgba(9, 16, 28, 0.95));
        border: 1px solid var(--ui-border);
        color: var(--accent-soft);
        padding: 4px 10px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        font-weight: 700;
        box-shadow: 0 6px 18px var(--shadow-deep), inset 0 0 0 1px rgba(255,255,255,0.05);
        font-size: 13px;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        backdrop-filter: blur(6px);
    }
    .icon-box { width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; }
    .icon-box canvas { width: 100%; height: 100%; object-fit: contain; }
    
    #clock-box {
        min-width: 60px;
        justify-content: center;
        color: var(--accent);
        border-color: var(--panel-edge);
        box-shadow: 0 0 0 1px rgba(255,180,94,0.15), 0 6px 18px var(--shadow-deep), 0 0 18px rgba(255,180,94,0.18);
    }

    /* CONTROLS */
    #controls-area {
        width: 100%;
        height: 40%;
        padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        box-sizing: border-box;
    }
    
    /* JOYSTICK */
    #joystick-zone {
        width: 140px; height: 140px;
        position: relative;
        pointer-events: auto;
        touch-action: none;
    }
    #joystick-base {
        width: 100%; height: 100%;
        border-radius: 50%;
        background:
            radial-gradient(circle at 35% 35%, rgba(108, 230, 255, 0.16), rgba(7, 13, 23, 0.78));
        border: 2px solid rgba(108, 230, 255, 0.16);
        box-shadow: inset 0 0 26px rgba(108, 230, 255, 0.08), 0 10px 20px rgba(0, 0, 0, 0.28);
        position: absolute; top: 0; left: 0;
    }
    #joystick-knob {
        width: 60px; height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffd8ad, var(--accent) 45%, #c96c1f 100%);
        border: 1px solid rgba(255,255,255,0.45);
        box-shadow: 0 4px 0 #7a4312, 0 0 16px rgba(255,180,94,0.28);
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    /* ACTION BUTTONS */
    #btn-group {
        position: relative;
        width: 180px; height: 180px;
        pointer-events: none;
    }
    .action-btn {
        position: absolute;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: 700;
        box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 20px rgba(108, 230, 255, 0.12);
        background-size: 60%;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: auto;
        touch-action: manipulation;
        transition: transform 0.05s, box-shadow 0.05s, filter 0.12s ease;
        border: 2px solid rgba(255,255,255,0.92);
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }
    .action-btn:active, .action-btn.pressed {
        transform: translateY(4px);
        box-shadow: 0 0 0 rgba(0,0,0,0.5);
        filter: brightness(0.9);
    }

    #btn-jump {
        width: 65px; height: 65px;
        background: radial-gradient(circle at 30% 30%, #befac8, var(--success) 52%, #2d8c49);
        bottom: 0; right: 0;
        font-size: 13px;
    }
    #btn-mine {
        width: 80px; height: 80px;
        background: radial-gradient(circle at 30% 30%, #ffb0a8, var(--danger) 52%, #8e2938);
        bottom: 20px; right: 80px;
        font-size: 24px;
        z-index: 20;
    }
    #btn-inv {
        width: 44px; height: 44px;
        background: linear-gradient(180deg, #f0c777, #a97822);
        top: -10px; right: 0;
        border-radius: 12px;
        font-size: 20px;
    }
    #btn-craft {
        width: 44px; height: 44px;
        background: linear-gradient(180deg, #82dfff, #2d74b8);
        top: -10px; right: 55px;
        border-radius: 12px;
        font-size: 20px;
    }

    /* MODALS */
    .modal {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(1,4,10,0.88);
        z-index: 50;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        padding: 12px;
        box-sizing: border-box;
    }
    .modal-content {
        background:
            linear-gradient(180deg, rgba(23, 34, 52, 0.98), rgba(10, 17, 28, 0.98));
        border: 2px solid var(--ui-border-strong);
        padding: 18px;
        border-radius: 16px;
        width: 90%;
        max-width: 360px;
        max-height: 80%;
        overflow-y: auto;
        color: var(--text-main);
        box-shadow: 0 18px 40px rgba(0,0,0,0.48), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .modal-title {
        color: var(--accent); 
        text-align: center; 
        margin: 0 0 15px 0;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(108,230,255,0.2);
        padding-bottom: 10px;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        letter-spacing: 0.08em;
    }
    
    /* INVENTORY GRID */
    #inv-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin: 15px 0;
    }
    .inv-slot {
        aspect-ratio: 1;
        background: rgba(0,0,0,0.3);
        border: 2px solid #5e4c35;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        position: relative;
        cursor: pointer;
    }
    .inv-slot.selected {
        border-color: #fff;
        background: #5e4c35;
        box-shadow: 0 0 10px var(--accent);
    }
    .inv-count {
        position: absolute;
        bottom: 2px; right: 2px;
        font-size: 10px; color: #fff;
        background: rgba(0,0,0,0.5);
        padding: 1px 3px;
        border-radius: 4px;
    }

    /* CRAFTING LIST */
    .craft-item {
        display: flex;
        align-items: center;
        background: rgba(0,0,0,0.2);
        border: 1px solid #5e4c35;
        margin-bottom: 8px;
        padding: 8px;
        border-radius: 6px;
    }
    .craft-icon { width: 32px; height: 32px; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-right: 10px; background: rgba(0,0,0,0.3); border-radius: 4px; }
    .craft-info { flex: 1; }
    .craft-name { font-weight: 700; color: #fff; font-size: 14px; }
    .craft-req { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .craft-btn {
        background: linear-gradient(180deg, #98f6a3, #49a05b); color: white; border: none;
        padding: 8px 12px; border-radius: 8px; font-weight: 700;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        font-size: 11px;
        letter-spacing: 0.06em;
    }
    .craft-btn:disabled { background: #444; color: #888; }

    .close-btn {
        width: 100%; padding: 12px;
        background: linear-gradient(180deg, #ff8b96, #cf4557); color: white;
        border: none; font-weight: 700;
        font-size: 16px; border-radius: 10px;
        margin-top: 10px;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        letter-spacing: 0.06em;
    }

    /* TUTORIAL */
    #tutorial-msg {
        position: absolute;
        top: 15%;
        width: 100%;
        text-align: center;
        color: #f6fbff;
        font-size: 16px;
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        pointer-events: none;
        animation: float 2s infinite ease-in-out;
        display: none;
        padding: 0 20px;
        z-index: 20;
        box-sizing: border-box;
        font-family: 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.05em;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    
    #damage-flash {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: red;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
        z-index: 30;
    }

    /* START SCREEN */
    #start-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background:
            radial-gradient(circle at 50% 22%, rgba(108,230,255,0.15), transparent 28%),
            radial-gradient(circle at 50% 80%, rgba(255,180,94,0.16), transparent 32%),
            linear-gradient(180deg, rgba(7, 10, 18, 0.96), rgba(3, 6, 12, 0.98));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        color: white;
        text-align: center;
        overflow: hidden;
    }
    h1 {
        font-size: clamp(40px, 9vw, 68px);
        color: #ffd29b;
        text-shadow: 0 0 18px rgba(255,180,94,0.35), 0 4px 0 #000;
        margin: 0 0 16px 0;
        line-height: 0.92;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        letter-spacing: 3px;
    }
    .start-btn {
        background: linear-gradient(180deg, #90f6a7, #42a55b);
        color: white;
        border: 3px solid #fff;
        padding: 18px 38px;
        font-size: 22px;
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        font-weight: 700;
        margin-top: 24px;
        cursor: pointer;
        box-shadow: 0 6px 0 #1f5f2f, 0 0 18px rgba(121,220,136,0.24);
        border-radius: 14px;
        letter-spacing: 0.08em;
    }
    .start-btn:active {
        transform: translateY(6px);
        box-shadow: none;
    }
    #media-layer {
        position: absolute;
        inset: 0;
        z-index: 35;
        pointer-events: none;
        overflow: hidden;
    }
    .reaction-gif {
        position: absolute;
        width: min(32vw, 132px);
        opacity: 0;
        transform: scale(0.72);
        transition: opacity 0.2s ease, transform 0.2s ease;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.45));
        border-radius: 16px;
    }
    .reaction-gif.visible {
        opacity: 0.9;
        transform: scale(1);
    }
    #impact-gif {
        right: 12px;
        bottom: max(210px, calc(env(safe-area-inset-bottom) + 190px));
    }
    #haul-gif {
        left: 12px;
        top: max(88px, calc(env(safe-area-inset-top) + 74px));
    }
    .feedback-banner {
        position: absolute;
        left: 50%;
        bottom: max(190px, calc(env(safe-area-inset-bottom) + 166px));
        transform: translateX(-50%) translateY(18px);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(5, 12, 22, 0.84);
        border: 1px solid rgba(157, 225, 255, 0.42);
        color: var(--accent-soft);
        font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.16s ease, transform 0.16s ease;
        box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        white-space: nowrap;
        max-width: min(88vw, 320px);
        text-overflow: ellipsis;
        overflow: hidden;
    }
    .feedback-banner.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 600px) {
        .reaction-gif {
            width: min(28vw, 108px);
        }
        #impact-gif {
            bottom: max(190px, calc(env(safe-area-inset-bottom) + 170px));
        }
        .feedback-banner {
            bottom: max(176px, calc(env(safe-area-inset-bottom) + 152px));
            font-size: 11px;
            padding: 9px 14px;
        }
    }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="damage-flash"></div>
    <div id="media-layer" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: impact/haul feedback -> catalogs/gifs.json -->
        <img id="impact-gif" class="reaction-gif" alt="" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
        <img id="haul-gif" class="reaction-gif" alt="" src="https://i.giphy.com/KlPcP1IGRihcoRF5CL.webp">
        <div id="feedback-banner" class="feedback-banner"></div>
    </div>

    <div id="ui-layer">
        <div id="hud">
            <div class="hud-group">
                <div class="hud-box">
                    <div class="icon-box" id="tool-icon-container"></div>
                    <span id="tool-name">Scanner</span>
                </div>
                <div class="hud-box" id="health-box" style="color:var(--danger); letter-spacing:2px;">
                    ♥♥♥♥♥
                </div>
            </div>
            <div class="hud-box" id="clock-box">08:00</div>
        </div>
        
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling only -->
        <div id="tutorial-msg"></div>

        <div id="controls-area">
            <div id="joystick-zone">
                <div id="joystick-base"></div>
                <div id="joystick-knob"></div>
            </div>
            <div id="btn-group">
                <div id="btn-craft" class="action-btn"><span class="material-symbols-rounded">construction</span></div>
                <div id="btn-inv" class="action-btn"><span class="material-symbols-rounded">backpack</span></div>
                <div id="btn-mine" class="action-btn"></div>
                <div id="btn-jump" class="action-btn">HOP</div>
            </div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-overlay">
        <div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; opacity:0.7; background:
            radial-gradient(circle at 18% 24%, rgba(108,230,255,0.2) 0 4px, transparent 5px),
            radial-gradient(circle at 80% 20%, rgba(108,230,255,0.18) 0 3px, transparent 4px),
            radial-gradient(circle at 26% 72%, rgba(255,180,94,0.14) 0 5px, transparent 6px),
            radial-gradient(circle at 76% 76%, rgba(255,180,94,0.14) 0 4px, transparent 5px);"></div>
        <div style="position:relative; width:min(88vw, 360px); padding:24px 20px 22px; border-radius:22px; background:linear-gradient(180deg, rgba(16,27,42,0.9), rgba(8,13,22,0.92)); border:1px solid rgba(157,225,255,0.3); box-shadow:0 16px 36px rgba(0,0,0,0.42), inset 0 0 0 1px rgba(255,255,255,0.04);">
            <div aria-hidden="true" style="font-size:52px; line-height:1; margin-bottom:10px; filter:drop-shadow(0 0 10px rgba(255,180,94,0.28));">🤠⛏️</div>
            <h1>COPPER<br>VALLEY</h1>
            <p style="font-size:15px; opacity:0.92; margin:0 0 16px; color:var(--accent-soft); letter-spacing:0.18em; font-family:'Audiowide', 'Trebuchet MS', sans-serif;">NIGHT SHIFT</p>
            <div style="background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)); padding:14px 15px; border-radius:14px; font-size:14px; max-width:300px; line-height:1.45; text-align:left; margin:0 auto; border:1px solid rgba(255,255,255,0.06); color:var(--text-main);">
                • <strong>Left Stick:</strong> Move & Aim<br>
                • <strong>Right Button:</strong> Extract / Deploy<br>
                • <strong>Goal:</strong> Salvage, gear up, outlast the shift.
            </div>
            <button class="start-btn" id="start-btn">START SHIFT</button>
        </div>
    </div>

    <!-- INVENTORY -->
    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">FIELD PACK</h2>
            <div id="inv-grid"></div>
            <button class="close-btn" id="inv-close">SEAL</button>
        </div>
    </div>

    <!-- CRAFTING -->
    <div id="craft-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">FIELD BENCH</h2>
            <div id="craft-list"></div>
            <button class="close-btn" id="craft-close">SEAL</button>
        </div>
    </div>
</div>

<script>
/**
 * =========================================
 * ASSETS & SPRITES
 * =========================================
 */
const SpriteGen = {
    palettes: {
        'sword': ['#00000000', '#2d241b', '#8B4513', '#dcdcdc', '#999999', '#DAA520'],
        'pick':  ['#00000000', '#2d241b', '#8B4513', '#808080', '#505050', '#DAA520'],
        'axe':   ['#00000000', '#2d241b', '#8B4513', '#A9A9A9', '#696969', '#8B0000']
    },
    designs: {
        'sword': [
            "............", ".......+....", "......+++...", ".....+-++...",
            "....+--+....", "...+--+.....", "..+--+......", "..*#*.......",
            ".#.|.#......", "..|||.......", "...|........", "............"
        ],
        'pick': [
            "............", ".....###....", "...##+++##..", "..#--+++--#.",
            "..#--.|.--#.", "......|.....", "......|.....", "......|.....",
            "......|.....", "......|.....", "......|.....", "............"
        ],
        'axe': [
            "............", "....####....", "...#+++-##..", "..#++++---|.",
            "..#++++---|.", "...#+++---|.", "....####..|.", "......|...|.",
            "......|.....", "......|.....", "......|.....", "............"
        ]
    },
    create(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 24; canvas.height = 24;
        const ctx = canvas.getContext('2d');
        const design = this.designs[type];
        const pal = this.palettes[type];
        const charMap = {'.':0, '#':1, '|':2, '+':3, '-':4, '*':5};
        
        for(let y=0; y<12; y++) {
            for(let x=0; x<12; x++) {
                const char = design[y][x] || '.';
                const colorIdx = charMap[char];
                if(colorIdx > 0) {
                    ctx.fillStyle = pal[colorIdx];
                    ctx.fillRect(x*2, y*2, 2, 2);
                }
            }
        }
        return canvas;
    }
};

const SPRITES = {
    sword: SpriteGen.create('sword'),
    pick:  SpriteGen.create('pick'),
    axe:   SpriteGen.create('axe')
};

/**
 * =========================================
 * GAME DATA
 * =========================================
 */
const TILE = 32;
const GRAVITY = 0.6;
const WORLD_W = 200;
const WORLD_H = 120;
const REACH_DIST = 2 * TILE; // 2 blocks range

const BLOCKS = {
    AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, 
    WOOD: 4, LEAVES: 5, COAL: 6, GOLD: 7, TORCH: 8, BEDROCK: 99
};

const HARDNESS = {
    [BLOCKS.GRASS]: 300, [BLOCKS.DIRT]: 300, [BLOCKS.STONE]: 600,
    [BLOCKS.WOOD]: 500, [BLOCKS.LEAVES]: 100, [BLOCKS.COAL]: 800,
    [BLOCKS.GOLD]: 1200, [BLOCKS.TORCH]: 10, [BLOCKS.BEDROCK]: Infinity
};

const ITEMS = {
    'sword': { name: 'Copper Sword', sprite: SPRITES.sword, type: 'tool', dmg: 3 },
    'pick':  { name: 'Pickaxe',      sprite: SPRITES.pick,  type: 'tool', dmg: 1 },
    'axe':   { name: 'Axe',          sprite: SPRITES.axe,   type: 'tool', dmg: 2 },

/**
 * =========================================
 * AUDIO + FEEDBACK SYSTEMS
 * =========================================
 */
/* [agent-note][stage3] resolved-audio: loop/ui/action cues -> catalogs/audios.json */
/* [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json */
const AudioSys = {
    ctx: null,
    master: null,
    musicGain: null,
    sfxGain: null,
    ambienceOsc: null,
    ambienceLfo: null,
    buffers: {},
    activeNodes: new Set(),
    inited: false,
    muted: false,
    init() {
        try {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
            }
            if (!this.master) {
                this.master = this.ctx.createGain();
                this.musicGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();
                this.master.gain.value = 0.9;
                this.musicGain.gain.value = 0.18;
                this.sfxGain.gain.value = 0.5;
                this.musicGain.connect(this.master);
                this.sfxGain.connect(this.master);
                this.master.connect(this.ctx.destination);
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
            if (!this.inited) {
                this.inited = true;
                this.prime();
                this.startLoop();
            }
        } catch(e) {}
    },
    prime() {
        const tone = (name, frequencies, duration, options = {}) => {
            this.buffers[name] = { frequencies, duration, ...options };
        };
        tone('jump', [260, 360], 0.16, { type: 'square', volume: 0.16 });
        tone('pickup', [880, 1180], 0.18, { type: 'triangle', volume: 0.15 });
        tone('place', [180, 130], 0.09, { type: 'triangle', volume: 0.12 });
        tone('hit', [120, 80], 0.12, { type: 'sawtooth', volume: 0.16 });
        tone('menu', [540, 760], 0.12, { type: 'sine', volume: 0.1 });
        tone('close', [760, 520], 0.11, { type: 'sine', volume: 0.09 });
        tone('start', [330, 440, 660], 0.32, { type: 'triangle', volume: 0.12, step: 0.09 });
        tone('respawn', [220, 180, 260], 0.42, { type: 'sawtooth', volume: 0.11, step: 0.14 });
        tone('blocked', [150, 110], 0.1, { type: 'square', volume: 0.08 });
    },
    ensureReady() {
        if (!this.ctx) this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    startLoop() {
        if (!this.ctx || this.ambienceOsc) return;
        const now = this.ctx.currentTime;
        this.ambienceOsc = this.ctx.createOscillator();
        this.ambienceLfo = this.ctx.createOscillator();
        const ambienceGain = this.ctx.createGain();
        const lfoGain = this.ctx.createGain();
        this.ambienceOsc.type = 'triangle';
        this.ambienceOsc.frequency.setValueAtTime(92, now);
        this.ambienceLfo.type = 'sine';
        this.ambienceLfo.frequency.setValueAtTime(0.14, now);
        ambienceGain.gain.setValueAtTime(0.0001, now);
        ambienceGain.gain.linearRampToValueAtTime(0.045, now + 1.4);
        lfoGain.gain.value = 0.012;
        this.ambienceLfo.connect(lfoGain);
        lfoGain.connect(ambienceGain.gain);
        this.ambienceOsc.connect(ambienceGain);
        ambienceGain.connect(this.musicGain);
        this.ambienceOsc.start(now);
        this.ambienceLfo.start(now);
        this.activeNodes.add(this.ambienceOsc);
        this.activeNodes.add(this.ambienceLfo);
    },
    stopLoop() {
        if (!this.ctx || !this.ambienceOsc) return;
        try {
            const now = this.ctx.currentTime;
            this.musicGain.gain.cancelScheduledValues(now);
            this.musicGain.gain.setTargetAtTime(0.0001, now, 0.2);
            setTimeout(() => {
                try { this.ambienceOsc.stop(); } catch(e) {}
                try { this.ambienceLfo.stop(); } catch(e) {}
                this.activeNodes.delete(this.ambienceOsc);
                this.activeNodes.delete(this.ambienceLfo);
                this.ambienceOsc = null;
                this.ambienceLfo = null;
                this.musicGain.gain.value = 0.18;
            }, 320);
        } catch(e) {}
    },
    play(type) {
        if (this.muted) return;
        this.ensureReady();
        const preset = this.buffers[type];
        if (!this.ctx || !preset) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = preset.type || 'sine';
            osc.connect(gain);
            gain.connect(this.sfxGain);
            const step = preset.step || (preset.duration / Math.max(preset.frequencies.length, 1));
            preset.frequencies.forEach((freq, index) => {
                osc.frequency.setValueAtTime(freq, now + index * step);
            });
            gain.gain.setValueAtTime((preset.volume || 0.12), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + preset.duration);
            osc.start(now);
            osc.stop(now + preset.duration);
        } catch(e) {}
    }
};

const FeedbackFx = {
    timers: {},
    hitGif: document.getElementById('impact-gif'),
    haulGif: document.getElementById('haul-gif'),
    banner: document.getElementById('feedback-banner'),
    pulse(which, label, duration = 850) {
        const el = which === 'haul' ? this.haulGif : this.hitGif;
        if (!el) return;
        clearTimeout(this.timers[which]);
        el.classList.add('visible');
        this.showBanner(label, Math.max(600, duration - 120));
        this.timers[which] = setTimeout(() => el.classList.remove('visible'), duration);
    },
    showBanner(text, duration = 820) {
        if (!this.banner) return;
        clearTimeout(this.timers.banner);
        this.banner.textContent = text;
        this.banner.classList.add('visible');
        this.timers.banner = setTimeout(() => this.banner.classList.remove('visible'), duration);
    }
};

/**
 * =========================================
 * INPUT HANDLING
 * =========================================
 */
const Input = {
    x: 0, y: 0, jump: false, mine: false,
    init() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const center = { x: 0, y: 0 };
        let active = false;

        const updateJoy = (cx, cy) => {
            const dx = cx - center.x;
            const dy = cy - center.y;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            knob.style.transform = `translate(-50%, -50%) translate(${kx}px, ${ky}px)`;
            this.x = kx / 40;
            this.y = ky / 40;
        };

        const startJoy = (e) => {
            e.preventDefault(); active = true;
            const r = zone.getBoundingClientRect();
            center.x = r.left + r.width/2; center.y = r.top + r.height/2;
            const touch = e.touches ? e.touches[0] : e;
            updateJoy(touch.clientX, touch.clientY);
        };

        const moveJoy = (e) => {
            if(active) { 
                e.preventDefault(); 
                const touch = e.touches ? e.touches[0] : e;
                updateJoy(touch.clientX, touch.clientY);
            }
        };

        const endJoy = (e) => {
            e.preventDefault(); active = false; this.x = 0; this.y = 0;
            knob.style.transform = `translate(-50%, -50%)`;
        };

        zone.addEventListener('touchstart', startJoy, {passive:false});
        zone.addEventListener('touchmove', moveJoy, {passive:false});
        zone.addEventListener('touchend', endJoy, {passive:false});
        zone.addEventListener('mousedown', startJoy);
        window.addEventListener('mousemove', moveJoy);
        window.addEventListener('mouseup', endJoy);

        // Buttons
        const bind = (id, prop) => {
            const btn = document.getElementById(id);
            const press = (e) => { e.preventDefault(); this[prop] = true; btn.classList.add('pressed'); };
            const release = (e) => { if(e.cancelable) e.preventDefault(); this[prop] = false; btn.classList.remove('pressed'); };
            
            btn.addEventListener('touchstart', press, {passive:false});
            btn.addEventListener('touchend', release, {passive:false});
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        };

        bind('btn-jump', 'jump');
        bind('btn-mine', 'mine');

        // UI Toggles
        document.getElementById('btn-inv').onclick = () => {
            AudioSys.play('menu');
            document.getElementById('inv-modal').style.display = 'flex';
            Inventory.render();
            FeedbackFx.showBanner('Field pack online');
        };
        document.getElementById('inv-close').onclick = () => {
            AudioSys.play('close');
            document.getElementById('inv-modal').style.display = 'none';
        };

        document.getElementById('btn-craft').onclick = () => {
            AudioSys.play('menu');
            document.getElementById('craft-modal').style.display = 'flex';
            Crafting.render();
            FeedbackFx.showBanner('Bench warmed up');
        };
        document.getElementById('craft-close').onclick = () => {
            AudioSys.play('close');
            document.getElementById('craft-modal').style.display = 'none';
        };
    }
};

const Inventory = {
    slots: Array(20).fill(null),
    selected: 0,
    init() {
        this.add('sword', 1);
        this.add('pick', 1);
        this.add('torch', 2);
        this.updateHUD();
    },
    add(id, qty=1) {
        const existing = this.slots.find(s => s && s.id === id);
        if (existing && ITEMS[id].type === 'mat') {
            existing.qty += qty;
        } else {
            const empty = this.slots.findIndex(s => s === null);
            if (empty !== -1) this.slots[empty] = { id, qty };
        }
        this.updateHUD();
    },
    hasItem(id, qty) {
        const item = this.slots.find(s => s && s.id === id);
        return item && item.qty >= qty;
    },
    removeItem(id, qty) {
        const item = this.slots.find(s => s && s.id === id);
        if(item) {
            item.qty -= qty;
            if(item.qty <= 0) this.slots[this.slots.indexOf(item)] = null;
        }
        this.updateHUD();
    },
    consume() {
        const item = this.slots[this.selected];
        if(item) {
            item.qty--;
            if(item.qty <= 0) this.slots[this.selected] = null;
            this.updateHUD();
        }
    },
    select(idx) {
        this.selected = idx;
        this.render();
        this.updateHUD();
    },
    getActive() { return this.slots[this.selected]; },
    updateHUD() {
        const item = this.getActive();
        const iconContainer = document.getElementById('tool-icon-container');
        const name = document.getElementById('tool-name');
        const btn = document.getElementById('btn-mine');
        iconContainer.innerHTML = ''; btn.innerHTML = '';

        if (item) {
            const data = ITEMS[item.id];
            name.textContent = data.name;
            if(data.sprite) {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 24;
                c.getContext('2d').drawImage(data.sprite,0,0);
                iconContainer.appendChild(c);
                const c2 = c.cloneNode();
                c2.style.width = '60%'; c2.style.height = '60%';
                btn.appendChild(c2);
            } else {
                iconContainer.textContent = data.icon;
                btn.textContent = data.icon; 
            }
        } else {
            iconContainer.textContent = '✋';
            name.textContent = 'Scanner';
            btn.textContent = '✋';
        }
    },
    render() {
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = '';
        this.slots.forEach((s, i) => {
            const el = document.createElement('div');
            el.className = 'inv-slot' + (i === this.selected ? ' selected' : '');
            if (s) {
                const data = ITEMS[s.id];
                if(data.sprite) {
                    const c = document.createElement('canvas');
                    c.width = 24; c.height = 24;
                    c.getContext('2d').drawImage(data.sprite, 0, 0);
                    el.appendChild(c);
                } else {
                    el.textContent = data.icon;
                }
                if (s.qty > 1) {
                    const n = document.createElement('span');
                    n.className = 'inv-count';
                    n.textContent = s.qty;
                    el.appendChild(n);
                }
            }
            el.onclick = () => this.select(i);
            grid.appendChild(el);
        });
    }
};

const Crafting = {
    render() {
        const list = document.getElementById('craft-list');
        list.innerHTML = '';
        RECIPES.forEach(r => {
            const itemData = ITEMS[r.id];
            const div = document.createElement('div');
            div.className = 'craft-item';
            
            const icon = document.createElement('div');
            icon.className = 'craft-icon';
            icon.textContent = itemData.icon || '⚒️';
            div.appendChild(icon);

            const info = document.createElement('div');
            info.className = 'craft-info';
            const name = document.createElement('div');
            name.className = 'craft-name';
            name.textContent = `${itemData.name} x${r.outQty}`;
            info.appendChild(name);
            
            const reqs = document.createElement('div');
            reqs.className = 'craft-req';
            const reqStr = r.req.map(rq => `${ITEMS[rq.id].name} (${rq.qty})`).join(', ');
            reqs.textContent = reqStr;
            info.appendChild(reqs);
            div.appendChild(info);

const Background = {
    canvas: null,
    init() {
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1000;
        this.canvas.height = 600;
        const ctx = this.canvas.getContext('2d');
        
        // Sky gradient for base
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, 'rgba(20,24,36,0)');
        grad.addColorStop(1, 'rgba(20,24,36,0.2)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,1000,600);

        // Generate large detailed trees
        for(let i=0; i<8; i++) {
            const x = Math.random() * 1000;
            const y = 400 + Math.random() * 100;
            this.drawTree(ctx, x, y);
        }
    },
    drawTree(ctx, x, y) {
        // Trunk
        ctx.fillStyle = '#2d241b';
        const w = 20 + Math.random()*15;
        const h = 150 + Math.random()*100;
        ctx.fillRect(x - w/2, y - h, w, h);
        
        // Branches
        ctx.strokeStyle = '#2d241b';
        ctx.lineWidth = w * 0.6;
        ctx.beginPath();
        ctx.moveTo(x, y - h * 0.6);
        ctx.lineTo(x - 60, y - h * 0.8);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(x, y - h * 0.7);
        ctx.lineTo(x + 60, y - h * 0.9);
        ctx.stroke();

        // Leaves (Clusters of circles)
        ctx.fillStyle = '#1e3828'; // Dark green
        for(let i=0; i<15; i++) {
            const lx = x + (Math.random()-0.5) * 160;
            const ly = y - h - (Math.random() * 100) + 20;
            const r = 30 + Math.random() * 20;
            ctx.beginPath();
            ctx.arc(lx, ly, r, 0, Math.PI*2);
            ctx.fill();
        }
    }
};

/**
 * =========================================
 * GAME ENGINE

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d'),
    map: [],
    particles: [],
    enemies: [],
    drops: [],
    cam: { x: 0, y: 0 },
    started: false,
    
    // Time System
    gameTime: 480, // Start at 8:00 AM
    daySpeed: 0.15,
    
    // State
    miningState: { x: -1, y: -1, progress: 0, lastHit: 0 },
    player: { x: 0, y: 0, w: 20, h: 40, vx: 0, vy: 0, facing: 1, swing: 0, walkAnim: 0, hp: 5, maxHp: 5, invuln: 0 },
    target: { x: 0, y: 0, valid: false },

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.genWorld();
        Background.init();
        
        // Spawn
        this.player.x = 20 * TILE;
        this.player.y = 0;
        
        Input.init();
        Inventory.init();
        this.updateHealthUI();
        
        // Loop
        this.lastTime = performance.now();
        requestAnimationFrame(t => this.loop(t));

        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('start-overlay');
        
        const startGame = (e) => {
            if (this.started) return;
            if (e?.cancelable) e.preventDefault();
            AudioSys.init();
            AudioSys.play('start');
            FeedbackFx.showBanner('Night shift rolling', 1200);
            overlay.style.display = 'none';
            this.started = true;
            this.setTutorial("Sweep the valley with the left stick.");
            setTimeout(() => this.setTutorial(""), 4000);
        };

        /* [agent-note][stage4] repaired: mobile-start-cta | action: preserve native tap/click path, avoid duplicate touchstart trigger */
        startBtn.addEventListener('click', startGame);
    },

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.ctx.imageSmoothingEnabled = false;
    },

    genWorld() {
        this.map = [];
        for(let y=0; y<WORLD_H; y++) {
            let row = [];
            for(let x=0; x<WORLD_W; x++) {
                // Terrain generation
                let h = 20 + Math.floor(Math.sin(x*0.03)*3 + Math.sin(x*0.01)*5);
                let t = BLOCKS.AIR;
                
                if(y > WORLD_H-2) t = BLOCKS.BEDROCK;
                else if(y > h+15) {
                    t = BLOCKS.STONE;
                    if(Math.random()>0.95) t = BLOCKS.COAL;
                    if(y>80 && Math.random()>0.97) t = BLOCKS.GOLD;
                }
                else if(y > h) t = BLOCKS.DIRT;
                else if(y === h) t = BLOCKS.GRASS;
                
                if(y === h && t === BLOCKS.GRASS && Math.random()<0.05 && x>5 && x<WORLD_W-5) {
                    this.spawnTree(x, y);
                }
                row.push(t);
            }
            this.map.push(row);
        }
    },

    spawnTree(x, y) {
        const height = 4 + Math.floor(Math.random() * 3);
        for(let i=1; i<=height; i++) {
            if(y-i >= 0) this.map[y-i][x] = BLOCKS.WOOD;
        }
        for(let ly=y-height-2; ly<=y-height+1; ly++) {
            for(let lx=x-2; lx<=x+2; lx++) {
                if(ly>=0 && lx>=0 && lx<WORLD_W && ly<WORLD_H) {
                    if(this.map[ly][lx] === BLOCKS.AIR) this.map[ly][lx] = BLOCKS.LEAVES;
                }
            }
        }
    },

    setTutorial(msg) {
        const el = document.getElementById('tutorial-msg');
        if(msg) { el.textContent = msg; el.style.display = 'block'; }
        else { el.style.display = 'none'; }
    },

    update(dt) {
        if (!this.started) return;
        
        // Time Update
        this.gameTime += this.daySpeed * (dt/16);
        if(this.gameTime >= 1440) this.gameTime = 0;
        
        const hours = Math.floor(this.gameTime / 60);
        const mins = Math.floor(this.gameTime % 60);
        document.getElementById('clock-box').textContent = 
            `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}`;

        const p = this.player;
        if(p.invuln > 0) p.invuln -= dt;

        // PHYSICS
        p.vx = Input.x * 4;
        p.vy += GRAVITY;
        if(Math.abs(p.vx) > 0.1) {
            p.facing = Math.sign(p.vx);
            p.walkAnim += dt * 0.015;
        } else {
            p.walkAnim = 0;
        }

        p.x += p.vx;
        this.collideEntity(p, true);
        p.y += p.vy;
        const grounded = this.collideEntity(p, false);

        if(Input.jump && grounded) {
            p.vy = -9;
            AudioSys.play('jump');
        }

        // ENEMIES
        let spawnChance = (this.gameTime > 1080 || this.gameTime < 360) ? 0.003 : 0.0005;
        if(Math.random() < spawnChance && this.enemies.length < 8) this.spawnEnemy();
        
        this.updateEnemies(dt);
        this.updateDrops(dt);

        // TARGETING (RAYCAST)
        // Raycast from player center in direction of joystick
        // Stops at first solid block or reaches max range
        const cx = p.x + p.w/2;
        const cy = p.y + p.h/2;
        
        // Default target is just in front if no input
        let aimX = Input.x;
        let aimY = Input.y;
        if(Math.abs(aimX) < 0.1 && Math.abs(aimY) < 0.1) {
            aimX = p.facing; aimY = 0;
        }

        const angle = Math.atan2(aimY, aimX);
        // Calculate max reach based on joystick magnitude or default short range
        const joyMag = Math.sqrt(Input.x**2 + Input.y**2);
        // If joystick is pushed, scale range by push, max 2 tiles
        // If no joystick, default to 1.5 tiles
        let maxDist = (joyMag > 0.1) ? Math.min(joyMag * 100, REACH_DIST) : REACH_DIST * 0.8;
        
        // Raycast steps
        let hit = false;
        let finalX = cx, finalY = cy;
        
        for(let r=0; r<=maxDist; r+=8) {
            const tx = cx + Math.cos(angle) * r;
            const ty = cy + Math.sin(angle) * r;
            
            // Check collision with map
            const gx = Math.floor(tx / TILE);
            const gy = Math.floor(ty / TILE);
            
            if(gx >= 0 && gx < WORLD_W && gy >= 0 && gy < WORLD_H) {
                const t = this.map[gy][gx];
                if(t !== BLOCKS.AIR && t !== BLOCKS.TORCH) {
                    // Hit solid
                    finalX = tx; finalY = ty;
                    hit = true;
                    break;
                }
            }
            finalX = tx; finalY = ty;
        }
        
        this.target.x = Math.floor(finalX / TILE);
        this.target.y = Math.floor(finalY / TILE);
        this.target.valid = (this.target.x >= 0 && this.target.x < WORLD_W && this.target.y >= 0 && this.target.y < WORLD_H);

        // ACTION
        if(p.swing > 0) p.swing -= dt * 0.005;
        if(Input.mine) this.handleAction(dt);
        else { this.miningState.progress = 0; this.miningState.x = -1; }

        // CAMERA
        this.cam.x += (p.x - this.canvas.width/2 - this.cam.x) * 0.1;
        this.cam.y += (p.y - this.canvas.height/2 - this.cam.y) * 0.1;
        this.cam.x = Math.max(0, Math.min(this.cam.x, WORLD_W*TILE - this.canvas.width));
        this.cam.y = Math.max(-100, Math.min(this.cam.y, WORLD_H*TILE - this.canvas.height));

        // PARTICLES
        for(let i=this.particles.length-1; i>=0; i--) {
            const pt = this.particles[i];
            pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.5;
            pt.life -= dt;
            if(pt.life <= 0) this.particles.splice(i, 1);
        }
    },

    spawnEnemy() {
        const offset = (Math.random() > 0.5 ? 1 : -1) * (this.canvas.width/2 + Math.random()*200);
        let x = (this.player.x + offset);
        if(x < 0) x = 0; if(x > WORLD_W * TILE) x = WORLD_W * TILE;

        const tx = Math.floor(x / TILE);
        let ty = 0;
        while(ty < WORLD_H && this.map[ty][tx] === BLOCKS.AIR) ty++;
        
        if(ty < WORLD_H) {
             const y = (ty - 1) * TILE;
             this.enemies.push({ x, y, w: 24, h: 24, vx: 0, vy: 0, hp: 3, jumpTimer: 0 });
        }
    },

    updateEnemies(dt) {
        for(let i=this.enemies.length-1; i>=0; i--) {
            const e = this.enemies[i];
            e.vy += GRAVITY;
            e.x += e.vx; this.collideEntity(e, true);
            e.y += e.vy; const grounded = this.collideEntity(e, false);
            if(grounded) e.vx *= 0.8;

            e.jumpTimer -= dt;
            if(e.jumpTimer <= 0 && grounded) {
                const dir = Math.sign(this.player.x - e.x);
                e.vx = dir * 2; e.vy = -6;
                e.jumpTimer = 1000 + Math.random()*1000;
            }

            if(this.checkOverlap(this.player, e)) {
                if (this.player.invuln <= 0) {
                    const dir = Math.sign(this.player.x - e.x) || 1;
                    this.player.vx = dir * 8;
                    this.player.vy = -5;
                    this.takeDamage(1);
                }
            }

            if(e.hp <= 0) {
                this.spawnParticles(e.x+12, e.y+12, '#0f0', 10);
                this.spawnDrop(e.x, e.y, 'slime');
                this.enemies.splice(i, 1);
            }
        }
    },

    updateDrops(dt) {
        for(let i=this.drops.length-1; i>=0; i--) {
            const d = this.drops[i];
            d.vy += GRAVITY;
            d.x += d.vx; this.collideEntity(d, true);
            d.y += d.vy; const grounded = this.collideEntity(d, false);
            if(grounded) d.vx *= 0.8;

            if(this.checkOverlap(this.player, d)) {
                Inventory.add(d.id);
                AudioSys.play('pickup');
                FeedbackFx.pulse('haul', `${ITEMS[d.id].name} secured`, 900);
                this.drops.splice(i, 1);
                continue;
            }
            d.life -= dt;
            if(d.life <= 0) this.drops.splice(i, 1);
        }
    },

    spawnDrop(x, y, id) {
        this.drops.push({ x, y, w: 16, h: 16, id, vx: (Math.random()-0.5)*4, vy: -4, life: 30000 });
    },

    takeDamage(amt) {
        this.player.hp -= amt;
        this.player.invuln = 1500;
        AudioSys.play('hit');
        FeedbackFx.pulse('impact', 'Hull breach', 920);
        this.updateHealthUI();
        const flash = document.getElementById('damage-flash');
        flash.style.opacity = 0.5;
        setTimeout(() => flash.style.opacity = 0, 100);
        if(this.player.hp <= 0) this.respawn();
    },

    respawn() {
        this.player.hp = this.player.maxHp;
        this.player.invuln = 0;
        this.updateHealthUI();
        this.player.x = 20 * TILE;
        this.player.y = 0;
        this.gameTime = 480;
        this.enemies = [];
        AudioSys.play('respawn');
        FeedbackFx.pulse('impact', 'Shift reset', 1200);
        this.setTutorial("SHIFT RESET");
        setTimeout(() => this.setTutorial(""), 2000);
    },

    updateHealthUI() {
        let h = "";
        for(let i=0; i<this.player.maxHp; i++) h += (i < this.player.hp) ? "♥" : "♡";
        document.getElementById('health-box').textContent = h;
    },

    collideEntity(ent, xAxis) {
        let grounded = false;
        const sx = Math.floor(ent.x / TILE);
        const ex = Math.floor((ent.x + ent.w - 0.01) / TILE);
        const sy = Math.floor(ent.y / TILE);
        const ey = Math.floor((ent.y + ent.h - 0.01) / TILE);

        for(let y=sy; y<=ey; y++) {
            for(let x=sx; x<=ex; x++) {
                if(y>=0 && y<WORLD_H && x>=0 && x<WORLD_W) {
                    const t = this.map[y][x];
                    if(t !== BLOCKS.AIR && t !== BLOCKS.LEAVES && t !== BLOCKS.WOOD && t !== BLOCKS.TORCH) {
                        if(xAxis) {
                            if(ent.vx > 0) ent.x = x*TILE - ent.w;
                            else if(ent.vx < 0) ent.x = (x+1)*TILE;
                            ent.vx = 0;
                        } else {
                            if(ent.vy > 0) {
                                ent.y = y*TILE - ent.h;
                                ent.vy = 0;
                                grounded = true;
                            } else if(ent.vy < 0) {
                                ent.y = (y+1)*TILE;
                                ent.vy = 0;
                            }
                        }
                    }
                }
            }
        }
        return grounded;
    },

    checkOverlap(a, b) {
        return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
    },

    handleAction(dt) {
        const t = this.target;
        if (!t.valid) return;
        const p = this.player;
        const item = Inventory.getActive();

        // Combat
        const targetRect = { x: t.x * TILE, y: t.y * TILE, w: TILE, h: TILE };
        for(let e of this.enemies) {
            if(this.checkOverlap(targetRect, e)) {
                if(p.swing <= 0) {
                    p.swing = 1;
                    const dmg = (item && ITEMS[item.id].dmg) || 1;
                    e.hp -= dmg;
                    e.vx = p.facing * 5; e.vy = -3;
                    AudioSys.play('hit');
                    FeedbackFx.pulse('impact', 'Target cracked', 760);
                    this.spawnParticles(e.x+12, e.y+12, '#f00', 3);
                }
                return;
            }
        }

        // Place
        const block = this.map[t.y][t.x];
        if (item && ITEMS[item.id].type === 'mat') {
            if (p.swing > 0) return;
            const placeId = ITEMS[item.id].placeId;
            const pxStart = Math.floor(p.x/TILE), pxEnd = Math.floor((p.x+p.w)/TILE);
            const pyStart = Math.floor(p.y/TILE), pyEnd = Math.floor((p.y+p.h)/TILE);
            const inPlayer = (t.x >= pxStart && t.x <= pxEnd && t.y >= pyStart && t.y <= pyEnd);
            
            // Allow placing in air or replacing non-solid blocks (torch, leaves)
            if((block === BLOCKS.AIR || block === BLOCKS.LEAVES || block === BLOCKS.TORCH) && !inPlayer) {
                this.map[t.y][t.x] = placeId;
                Inventory.consume();
                AudioSys.play('place');
                FeedbackFx.showBanner(`${ITEMS[item.id].name} deployed`, 760);
                p.swing = 1;
            } else if (p.swing <= 0) {
                AudioSys.play('blocked');
            }
            return;
        }

        // Mine
        if (block === BLOCKS.AIR || block === BLOCKS.BEDROCK) {
            if (p.swing <= 0) {
                p.swing = 1;
                AudioSys.play('blocked');
            }
            return;
        }

        if (this.miningState.x !== t.x || this.miningState.y !== t.y) {
            this.miningState.x = t.x; this.miningState.y = t.y; this.miningState.progress = 0;
        }

        this.miningState.progress += dt;
        p.swing = 0.8;
        if (performance.now() - this.miningState.lastHit > 150) {
            AudioSys.play('place');
            this.spawnParticles(t.x*TILE+16, t.y*TILE+16, this.getColor(block), 1);
            this.miningState.lastHit = performance.now();
        }

        const max = HARDNESS[block] || 500;
        if (this.miningState.progress >= max) {
            this.map[t.y][t.x] = BLOCKS.AIR;
            this.spawnParticles(t.x*TILE+16, t.y*TILE+16, this.getColor(block), 6);
            FeedbackFx.pulse('impact', 'Vein shattered', 820);
            
            let drop = null;
            if(block===BLOCKS.WOOD) drop='wood';
            else if(block===BLOCKS.STONE) drop='stone';
            else if(block===BLOCKS.COAL) drop='coal';
            else if(block===BLOCKS.GOLD) drop='gold';
            else if(block===BLOCKS.DIRT || block===BLOCKS.GRASS) drop='dirt';
            else if(block===BLOCKS.TORCH) drop='torch';
            
            if(drop) this.spawnDrop(t.x*TILE+8, t.y*TILE+8, drop);
            this.miningState.progress = 0;
            p.swing = 0;
        }
    },

    spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            this.particles.push({ x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 200, color });
        }
    },

    getColor(t) {
        switch(t) {
            case BLOCKS.GRASS: return '#5d9b5d';
            case BLOCKS.DIRT: return '#5e4c35';
            case BLOCKS.STONE: return '#555';
            case BLOCKS.WOOD: return '#6d4c41';
            case BLOCKS.LEAVES: return '#2e7d32';
            case BLOCKS.COAL: return '#222';
            case BLOCKS.GOLD: return '#ffd700';
            case BLOCKS.TORCH: return '#ffaa00';
            default: return '#fff';
        }
    },

    getSkyColor(min) {
        if (min >= 360 && min < 1080) return '#6b90b5'; // Day
        if (min >= 1080 && min < 1140) return '#566a7a'; // Dusk
        if (min >= 1140 || min < 300) return '#0f111a'; // Night
        return '#566a7a'; // Dawn
    },

    getDarkness(min) {
        if (min >= 360 && min < 1080) return 0; // Day
        if (min >= 1080 && min < 1200) return (min-1080)/120 * 0.85; // Dusk transition
        if (min >= 1200 || min < 240) return 0.85; // Full night
        if (min >= 240 && min < 360) return 0.85 - (min-240)/120 * 0.85; // Dawn transition
        return 0;
    },

    draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        
        // 1. Sky
        ctx.fillStyle = this.getSkyColor(this.gameTime);
        ctx.fillRect(0, 0, w, h);

        // 2. Parallax Background (Detailed Trees)
        if(Background.canvas) {
            const bgX = (this.cam.x * 0.2) % 1000;
            // Draw twice to loop
            ctx.drawImage(Background.canvas, -bgX, 0);
            ctx.drawImage(Background.canvas, -bgX + 1000, 0);
        }

        const sx = Math.floor(this.cam.x / TILE);
        const ex = sx + (w / TILE) + 2;
        const sy = Math.floor(this.cam.y / TILE);
        const ey = sy + (h / TILE) + 2;

        let visibleTorches = [];

        // 3. World
        for(let y=sy; y<=ey; y++) {
            for(let x=sx; x<=ex; x++) {
                if(y>=0 && y<WORLD_H && x>=0 && x<WORLD_W) {
                    const t = this.map[y][x];
                    const px = Math.floor(x*TILE - this.cam.x);
                    const py = Math.floor(y*TILE - this.cam.y);
                    if(t !== BLOCKS.AIR) {
                        ctx.fillStyle = this.getColor(t);
                        if(t === BLOCKS.TORCH) {
                            ctx.fillStyle = '#8B4513'; ctx.fillRect(px+14, py+10, 4, 10);
                            ctx.fillStyle = '#FFD700'; ctx.fillRect(px+13, py+6, 6, 6);
                            visibleTorches.push({x: px+16, y: py+10});
                        } else {
                            ctx.fillRect(px, py, TILE, TILE);
                            if(t === BLOCKS.GRASS) { ctx.fillStyle = '#4caf50'; ctx.fillRect(px, py, TILE, 4); }
                            if(t === BLOCKS.STONE) { ctx.fillStyle = '#444'; ctx.fillRect(px, py+28, TILE, 4); }
                        }
                    }
                }
            }
        }

        // Entities
        this.drops.forEach(d => {
            const item = ITEMS[d.id];
            ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(item.icon, d.x - this.cam.x + 8, d.y - this.cam.y + 8);
        });

        this.enemies.forEach(e => {
            const ex = e.x - this.cam.x;
            const ey = e.y - this.cam.y;
            ctx.fillStyle = '#32cd32'; ctx.beginPath(); ctx.arc(ex+12, ey+12, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(ex+6, ey+10, 4, 4); ctx.fillRect(ex+14, ey+10, 4, 4);
        });

        this.particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.fillRect(p.x - this.cam.x, p.y - this.cam.y, 4, 4);
        });

        // Player with Animated Legs
        const p = this.player;
        if (p.invuln <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
            const px = Math.floor(p.x - this.cam.x);
            const py = Math.floor(p.y - this.cam.y);
            const cx = px + p.w/2;
            const cy = py + p.h/2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(p.facing, 1);
            
            // Legs Animation
            const legOffset = Math.sin(p.walkAnim) * 5;
            ctx.fillStyle = '#30346d'; 
            // Back leg
            ctx.fillRect(-2 + legOffset, 10, 4, 10);
            // Front leg
            ctx.fillRect(-2 - legOffset, 10, 4, 10);

            ctx.fillStyle = '#d95763'; ctx.fillRect(-6, -10, 12, 20); // Body
            ctx.fillStyle = '#ffccaa'; ctx.fillRect(-8, -22, 16, 12); // Head
            ctx.fillStyle = '#4a3b2a'; ctx.fillRect(-8, -26, 16, 4); // Hair

            // Arm
            ctx.save();
            ctx.translate(0, -5);
            let armAngle = Math.cos(p.walkAnim) * 0.5;
            if(p.swing > 0) armAngle = -1.5 + Math.sin(performance.now()*0.02)*0.5;
            ctx.rotate(armAngle);
            ctx.fillStyle = '#d95763'; ctx.fillRect(-3, 0, 6, 10);
            ctx.fillStyle = '#ffccaa'; ctx.fillRect(-3, 10, 6, 4);
            
            const item = Inventory.getActive();
            if(item) {
                const data = ITEMS[item.id];
                ctx.save(); ctx.translate(0, 12); ctx.rotate(Math.PI/2);
                if(data.sprite) ctx.drawImage(data.sprite, 0, -12, 24, 24);
                else { ctx.font='16px sans'; ctx.fillText(data.icon, 0, 0); }
                ctx.restore();
            }
            ctx.restore();
            ctx.restore();
        }

        // Target Cursor
        if (this.target.valid) {
            const tx = this.target.x * TILE - this.cam.x;
            const ty = this.target.y * TILE - this.cam.y;
            
            // Cursor style
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; 
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(tx, ty, TILE, TILE);
            ctx.stroke();
            
            // Mining progress bar
            if(this.miningState.x === this.target.x && this.miningState.y === this.target.y && this.miningState.progress > 0) {
                const block = this.map[this.target.y][this.target.x];
                const pct = this.miningState.progress / (HARDNESS[block]||500);
                ctx.fillStyle = '#0f0'; ctx.fillRect(tx, ty+TILE-4, TILE*pct, 4);
            }
        }

        // 4. Darkness Overlay (Night Cycle)
        const darkAlpha = this.getDarkness(this.gameTime);
        if(darkAlpha > 0) {
            ctx.fillStyle = `rgba(0,0,10,${darkAlpha})`;
            ctx.beginPath();
            ctx.rect(0, 0, w, h);
            
            // Cut holes for lights
            const px = p.x - this.cam.x + p.w/2;
            const py = p.y - this.cam.y + p.h/2;
            ctx.arc(px, py, 120, 0, Math.PI*2, true);
            
            visibleTorches.forEach(t => {
                ctx.arc(t.x, t.y, 80, 0, Math.PI*2, true);
            });
            
            ctx.fill();
        }
    },

    loop(now) {
        const dt = Math.min(now - this.lastTime, 50);
        this.lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame(t => this.loop(t));
    }
};

window.onload = () => Game.init();
</script>
