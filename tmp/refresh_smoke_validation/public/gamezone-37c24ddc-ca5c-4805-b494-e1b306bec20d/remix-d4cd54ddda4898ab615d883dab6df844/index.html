<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nebula Salvage Run</title>
    <!-- [agent-note][stage3] resolved-font: title=Orbitron ui=Rajdhani via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050011;
            --panel: rgba(11, 18, 42, 0.78);
            --panel-edge: rgba(129, 228, 255, 0.34);
            --ink: #effbff;
            --hero: #6cf6ff;
            --hero-soft: rgba(108, 246, 255, 0.24);
            --hazard: #ff4d8c;
            --coin: #ffd76a;
            --title-font: 'Orbitron', system-ui, sans-serif;
            --ui-font: 'Rajdhani', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(76, 29, 149, 0.35), transparent 34%),
                radial-gradient(circle at 80% 0%, rgba(8, 145, 178, 0.22), transparent 26%),
                linear-gradient(180deg, #090018 0%, #050011 50%, #02000b 100%);
            font-family: var(--ui-font);
        }
        body {
            color: var(--ink);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 12%, transparent 88%, rgba(255,255,255,0.04)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
            opacity: 0.3;

        canvas { display: block; touch-action: none; }
        .glass {
            background:
                linear-gradient(180deg, rgba(20, 30, 63, 0.92), rgba(7, 11, 29, 0.88)),
                var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .neon-text {
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.75), 0 0 26px rgba(0, 243, 255, 0.28);
        }
        .neon-danger { text-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px rgba(255, 77, 140, 0.3); }
        .ui-btn {
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease, background 0.18s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            border: 0;

        .ui-btn:active { transform: scale(0.95); }
        .relative { position: relative; }

        .text-black { color: #03131a; }

        .bg-gray-800 { background: #1f2937; }
        .rounded-full { border-radius: 9999px; }
        .overflow-hidden { overflow: hidden; }
        .border { border-width: 1px; border-style: solid; }
        .border-white\/20 { border-color: rgba(255, 255, 255, 0.2); }
        .bg-cyan-400 { background: #22d3ee; }
        .shadow-\[0_0_10px_\#00f3ff\] { box-shadow: 0 0 10px #00f3ff; }

            padding-top: max(1rem, env(safe-area-inset-top));

            font-family: var(--title-font);
            font-size: clamp(0.9rem, 3.6vw, 1.5rem);
        }
        #hud .h-2 {
            height: 0.6rem;
            background: rgba(12, 18, 36, 0.92);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 12px rgba(108, 246, 255, 0.12);
        }
        #energy-bar {
            background: linear-gradient(90deg, #72f8ff 0%, #35d5ff 50%, #00a6ff 100%);
            box-shadow: 0 0 14px rgba(108, 246, 255, 0.7);
        }
        #ui-title,
        #game-over-screen h2 {
            font-family: var(--title-font);
        }
        #start-screen p,

        }
        #start-btn,
        #restart-btn {
            min-height: 3.4rem;
        }
        .status-stack {
            position: absolute;
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
            z-index: 55;
            pointer-events: none;
        }
        .feedback-card {
            width: min(38vw, 9rem);
            min-width: 4.75rem;
            padding: 0.45rem;
            border-radius: 0.9rem;
            border: 1px solid rgba(255,255,255,0.22);
            background: linear-gradient(180deg, rgba(6, 12, 27, 0.9), rgba(11, 18, 42, 0.8));
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.14);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
            overflow: hidden;
        }
        .feedback-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-card.fail.active {
            box-shadow: 0 0 24px rgba(255, 77, 140, 0.28);
        }
        .feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.04);
        }
        .feedback-label {
            margin-top: 0.35rem;
            font-family: var(--title-font);
            font-size: 0.64rem;
            letter-spacing: 0.18em;
            text-align: center;
            color: rgba(239, 251, 255, 0.86);
        }
    </style>
</head>
<body>

<!-- Config Definition -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Steering Sensitivity", "value": 6, "min": 1, "max": 15 },

    "enemyColor": { "type": "color", "label": "Hazard Color", "value": "#ff0055" },

}
</script>

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/collect/crash/ui -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="BGM Gameplay Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_collect" data-editable="audio" data-label="SFX Collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
<audio id="sfx_crash" data-editable="audio" data-label="SFX Crash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3" preload="auto"></audio>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center text-white">
        
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <!-- HUD -->
        <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start hidden">
            <div class="text-3xl tracking-widest neon-text">SALVAGE: <span id="score">0</span></div>
            <div class="h-2 w-32 bg-gray-800 rounded-full overflow-hidden border border-white/20">
                <div id="energy-bar" class="h-full bg-cyan-400 w-full shadow-[0_0_10px_#00f3ff]"></div>
            </div>

        <!-- Start Screen -->
        <div id="start-screen" class="glass p-10 rounded-xl text-center pointer-events-auto flex flex-col items-center gap-6 ui-card">

            <p class="text-cyan-100 text-lg opacity-80">Guide the rescue dart through the drift lane • recover bright cores • avoid debris.</p>
            <!-- [agent-note][stage1] role: future-audio | trigger: core-collect | intent: reward each salvage pickup with a brighter confirm tone -->
            <button id="start-btn" class="ui-btn bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-2xl py-4 px-12 mt-4 w-full">Launch Run</button>
        </div>

        <div id="game-over-screen" class="hidden glass p-10 rounded-xl text-center pointer-events-auto flex flex-col items-center gap-6 ui-card">

            <div class="text-2xl">Recovered: <span id="finalScore" class="text-cyan-400 font-bold">0</span></div>
            <button id="restart-btn" class="ui-btn bg-pink-600 hover:bg-pink-500 text-white font-bold text-2xl py-4 px-12 mt-4 w-full">Retry Route</button>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: pickup+crash feedback -> catalogs/gifs.json -->
    <div class="status-stack" aria-hidden="true">
        <div id="pickup-badge" class="feedback-card success">
            <img src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="">
            <div class="feedback-label">CORE SECURED</div>
        </div>
        <div id="crash-badge" class="feedback-card fail">
            <img src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="">
            <div class="feedback-label">DEBRIS HIT</div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- §3 Configuration ---
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    Object.keys(window.gameConfigDefs).forEach(k => {
        window.gameConfig[k] = window.gameConfigDefs[k].value;
    });

    // Hot Reload Support
    window.updateGameConfig = (key, val) => {
        if (window.gameConfigDefs[key]) {
            window.gameConfig[key] = val;
            if (key === 'gameTitle') document.getElementById('ui-title').innerText = val;
        }
    };

    document.getElementById('ui-title').innerText = window.gameConfig.gameTitle;

    // --- §A Audio System ---
    class AudioManager {
        constructor() {
            this.ctx = null;
            this.bgmNode = document.getElementById('bgm_main');
            this.sfxBuffers = {};
            this.unlocked = false;
            this.lastPlayTimes = {};
            this.masterGain = null;
        }

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.72;
                this.masterGain.connect(this.ctx.destination);
            }
        }

        async unlock() {
            this.init();
            if (!this.ctx) return;
            try {
                if (this.ctx.state !== 'running') {
                    await this.ctx.resume();
                }
                this.unlocked = true;
                this.playBgm();
                return Promise.all([
                    this.loadSfx('sfx_collect'),
                    this.loadSfx('sfx_crash'),
                    this.loadSfx('sfx_start'),
                    this.loadSfx('sfx_restart')
                ]);
            } catch (e) {
                console.warn('Audio unlock failed, fallback enabled', e);
            }
        }

        async loadSfx(id) {
            if (!this.ctx || this.sfxBuffers[id]) return;
            const el = document.getElementById(id);
            if (!el || !el.src) return;
            try {
                const res = await fetch(el.src);
                const buf = await res.arrayBuffer();
                this.sfxBuffers[id] = await this.ctx.decodeAudioData(buf.slice(0));
            } catch (e) {
                console.warn('Audio load failed, fallback enabled', e);
            }
        }

        playBgm() {
            if (this.bgmNode) {
                this.bgmNode.volume = 0.28;
                if (this.bgmNode.paused) {
                    this.bgmNode.play().catch(() => {});
                }
            }
        }

        stopBgm() {
            if (this.bgmNode && !this.bgmNode.paused) {
                this.bgmNode.pause();
                this.bgmNode.currentTime = 0;
            }
        }

        playSfx(id, fallbackType = 'beep', cooldown = 80) {
            if (!this.ctx || this.ctx.state !== 'running') return;
            const now = performance.now();
            if (this.lastPlayTimes[id] && now - this.lastPlayTimes[id] < cooldown) return;
            this.lastPlayTimes[id] = now;

            if (this.sfxBuffers[id]) {
                const src = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                src.buffer = this.sfxBuffers[id];
                gain.gain.value = id === 'sfx_crash' ? 0.55 : 0.4;
                src.connect(gain);
                gain.connect(this.masterGain || this.ctx.destination);
                src.start(0);
            } else {
                this.synthesize(fallbackType);
            }
        }

        synthesize(type) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.masterGain || this.ctx.destination);

            if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            } else if (type === 'ui') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(540, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(860, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }
    }

    class FeedbackManager {
        constructor() {
            this.pickupBadge = document.getElementById('pickup-badge');
            this.crashBadge = document.getElementById('crash-badge');
            this.timers = new Map();
        }

        pulse(type) {
            const target = type === 'pickup' ? this.pickupBadge : this.crashBadge;
            if (!target) return;
            target.classList.add('active');
            clearTimeout(this.timers.get(type));
            this.timers.set(type, setTimeout(() => {
                target.classList.remove('active');
            }, type === 'pickup' ? 900 : 1400));
        }
    }

    const audio = new AudioManager();
    const feedback = new FeedbackManager();

    // --- Core Game Logic ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let state = 'MENU'; // MENU, PLAYING, GAMEOVER
    let lastTime = 0;
    let score = 0;
    let gameSpeed = 300;
    let distance = 0;
    
    // Viewport
    let width, height, dpr;
    
    // Entities
    let player = { x: 0.5, y: 0.85, radius: 0.03, tilt: 0, pulse: 0 };
    let enemies = [];
    let coins = [];
    let particles = [];
    let stars = [];
    let nebulas = [];
    
    // Input
    let pointerX = 0.5;
    let isPointerDown = false;
    let shake = 0;
    let warnedLowEnergy = false;

    function resize() {
        dpr = window.devicePixelRatio || 1;
        const rect = document.getElementById('game-container').getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        // Init stars if empty
        if (stars.length === 0) {
            for(let i=0; i<80; i++) {
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    z: Math.random() * 2 + 0.5, // speed multiplier
                    size: Math.random() * 2
                });
            }
            // Init nebulas
            for(let i=0; i<5; i++) {
                nebulas.push({
                    x: Math.random(),
                    y: Math.random(),
                    r: 0.3 + Math.random() * 0.4,
                    color: i % 2 === 0 ? '#4c1d95' : '#0e7490', // violet / cyan dark
                    speed: 0.05 + Math.random() * 0.05
                });
            }
        }
    }
    
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    const handlePointer = (e) => {
        if (state !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / width;
        pointerX = Math.max(0, Math.min(1, x));
        isPointerDown = true;
        
        // Unlock audio on first interaction
        audio.unlock();
    };

    canvas.addEventListener('pointerdown', handlePointer, { passive: false });
    canvas.addEventListener('pointermove', (e) => {
        if (isPointerDown) handlePointer(e);
        e.preventDefault();
    }, { passive: false });
    
    const endPointer = (e) => { isPointerDown = false; };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    // --- Game Loop Components ---

    function spawnEnemy() {
        const size = 0.04 + Math.random() * 0.04;
        enemies.push({
            x: Math.random() * 0.8 + 0.1,
            y: -0.2,
            radius: size,
            speed: 0.3 + Math.random() * 0.3,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 4,
            sides: Math.floor(Math.random() * 3) + 3 // Triangles to Pentagons
        });
    }

    function spawnCoin() {
        coins.push({
            x: Math.random() * 0.8 + 0.1,
            y: -0.2,
            radius: 0.025,
            wobble: Math.random() * Math.PI * 2
        });
    }

    function createExplosion(x, y, color, count = 15) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 0.5 + 0.2;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: Math.random() * 0.01 + 0.005
            });
        }
    }

    function resetGame() {
        enemies = [];
        coins = [];
        particles = [];
        score = 0;
        gameSpeed = 0.4; // Base vertical speed ratio
        player.x = 0.5;
        player.tilt = 0;
        player.pulse = 0;
        pointerX = 0.5;
        distance = 0;
        shake = 0;
        warnedLowEnergy = false;
        document.getElementById('score').innerText = '0';
        document.getElementById('energy-bar').style.width = '100%';
        document.getElementById('pickup-badge')?.classList.remove('active');
        document.getElementById('crash-badge')?.classList.remove('active');
    }

    function gameOver() {
        state = 'GAMEOVER';
        shake = 20;
        audio.playSfx('sfx_crash', 'explosion', 220);
        audio.stopBgm();
        feedback.pulse('crash');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = Math.floor(score);
    }

    function update(dt) {
        if (state !== 'PLAYING') return;

        // Difficulty scaling
        gameSpeed += dt * 0.01;
        distance += dt;
        
        // Player Movement (Lerp)
        const targetX = pointerX;
        const diff = targetX - player.x;
        const moveSpeed = window.gameConfig.heroSpeed || 5;
        
        // Clamp step to prevent overshooting
        const step = diff * Math.min(1, dt * moveSpeed); 
        player.x += step;
        
        // Tilt effect based on velocity
        player.tilt = -step * 20; // Visual tilt
        player.pulse += dt * 6;

        // Spawn Logic
        if (Math.random() < 2 * dt) spawnEnemy();
        if (Math.random() < 0.8 * dt) spawnCoin();

        // Update Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.y += (gameSpeed + e.speed) * dt;
            e.rot += e.rotSpeed * dt;

            // Collision Player
            const dx = (player.x * width) - (e.x * width);
            const dy = (player.y * height) - (e.y * height);
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = (player.radius * width) + (e.radius * width * 0.8);

            if (dist < minDist) {
                createExplosion(player.x, player.y, window.gameConfig.themeColor, 30);
                gameOver();
            }

            if (e.y > 1.2) enemies.splice(i, 1);
        }

        // Update Coins
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.y += gameSpeed * dt;
            c.wobble += dt * 5;
            
            const dx = (player.x * width) - (c.x * width);
            const dy = (player.y * height) - (c.y * height);
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < (player.radius + c.radius) * width * 1.5) {
                // Collect
                score += 100;
                document.getElementById('score').innerText = Math.floor(score);
                audio.playSfx('sfx_collect', 'beep', 90);
                feedback.pulse('pickup');
                createExplosion(c.x, c.y, '#ffd700', 10);
                coins.splice(i, 1);
            } else if (c.y > 1.2) {
                coins.splice(i, 1);
            }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Update Stars/Nebula (Parallax)
        stars.forEach(s => {
            s.y += dt * 0.1 * s.z * (1 + gameSpeed);
            if(s.y > 1) { s.y = 0; s.x = Math.random(); }
        });
        
        nebulas.forEach(n => {
            n.y += dt * n.speed;
            if(n.y > 1.5) { n.y = -0.5; n.x = Math.random(); }
        });

        // Score tick
        score += dt * 10;
        document.getElementById('score').innerText = Math.floor(score);

        const energyWidth = Math.max(18, 100 - Math.min(82, distance * 3.6));
        document.getElementById('energy-bar').style.width = energyWidth + '%';
        if (energyWidth < 38 && !warnedLowEnergy) {
            audio.playSfx('sfx_restart', 'ui', 500);
            warnedLowEnergy = true;
        } else if (energyWidth >= 45) {
            warnedLowEnergy = false;
        }
        
        // Shake decay
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    function draw() {
        // Clear & Background
        ctx.fillStyle = '#050011';
        ctx.fillRect(0, 0, width, height);

        // Screen Shake Apply
        ctx.save();
        if (shake > 0) {
            const sx = (Math.random() - 0.5) * shake;
            const sy = (Math.random() - 0.5) * shake;
            ctx.translate(sx, sy);
        }

        // Draw Nebula (Background Layer)
        ctx.globalCompositeOperation = 'lighter';
        nebulas.forEach(n => {
            const grad = ctx.createRadialGradient(
                n.x * width, n.y * height, 0,
                n.x * width, n.y * height, n.r * width
            );
            grad.addColorStop(0, n.color + '66'); // alpha 40
            grad.addColorStop(1, '#00000000');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(n.x * width, n.y * height, n.r * width, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';

        // Draw Stars
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            const alpha = Math.min(1, s.z * 0.5);
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Player Trail
        if (state === 'PLAYING') {
            particles.push({
                x: player.x, 
                y: player.y + 0.04, 
                vx: (Math.random() - 0.5) * 0.1, 
                vy: 0.5, 
                life: 0.4, 
                color: window.gameConfig.themeColor,
                size: 0.015
            });
        }

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x * width, p.y * height, p.size * width, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Player
        if (state === 'PLAYING') {
            const px = player.x * width;
            const py = player.y * height;
            const pr = player.radius * width;
            const pulse = 1 + Math.sin(player.pulse) * 0.06;
            
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(player.tilt);
            
            ctx.shadowColor = window.gameConfig.themeColor;
            ctx.shadowBlur = 24;
            const bodyGrad = ctx.createLinearGradient(0, -pr, 0, pr);
            bodyGrad.addColorStop(0, '#ffffff');
            bodyGrad.addColorStop(0.45, '#ddfbff');
            bodyGrad.addColorStop(1, '#7fe9ff');
            ctx.fillStyle = bodyGrad;
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = Math.max(2, pr * 0.08);
            
            ctx.beginPath();
            ctx.moveTo(0, -pr * 1.18);
            ctx.quadraticCurveTo(pr * 0.76, -pr * 0.12, pr * 0.6, pr * 0.96);
            ctx.lineTo(pr * 0.18, pr * 0.62);
            ctx.lineTo(0, pr * 0.92);
            ctx.lineTo(-pr * 0.18, pr * 0.62);
            ctx.lineTo(-pr * 0.6, pr * 0.96);
            ctx.quadraticCurveTo(-pr * 0.76, -pr * 0.12, 0, -pr * 1.18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Wing accents
            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.beginPath();
            ctx.moveTo(-pr * 0.52, pr * 0.1);
            ctx.lineTo(-pr * 0.95, pr * 0.88);
            ctx.lineTo(-pr * 0.3, pr * 0.58);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pr * 0.52, pr * 0.1);
            ctx.lineTo(pr * 0.95, pr * 0.88);
            ctx.lineTo(pr * 0.3, pr * 0.58);
            ctx.closePath();
            ctx.fill();
            
            // Core canopy
            ctx.fillStyle = '#07253a';
            ctx.beginPath();
            ctx.ellipse(0, -pr * 0.05, pr * 0.24, pr * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = window.gameConfig.themeColor;
            ctx.globalAlpha = 0.95;
            ctx.beginPath();
            ctx.ellipse(0, -pr * 0.05, pr * 0.16 * pulse, pr * 0.24 * pulse, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.arc(0, pr * 0.72, pr * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            
            // Engine flare
            const flareGrad = ctx.createLinearGradient(0, pr * 0.42, 0, pr * 1.55);
            flareGrad.addColorStop(0, 'rgba(255,255,255,0.75)');
            flareGrad.addColorStop(0.4, window.gameConfig.themeColor);
            flareGrad.addColorStop(1, 'rgba(255, 77, 140, 0)');
            ctx.fillStyle = flareGrad;
            ctx.beginPath();
            ctx.moveTo(-pr * 0.18, pr * 0.44);
            ctx.quadraticCurveTo(0, pr * 1.25 + Math.sin(player.pulse * 1.3) * pr * 0.18, pr * 0.18, pr * 0.44);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        // Draw Enemies
        const enemyColor = window.gameConfig.enemyColor || '#ff0055';
        ctx.strokeStyle = enemyColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = enemyColor;
        ctx.shadowBlur = 10;
        
        enemies.forEach(e => {
            const ex = e.x * width;
            const ey = e.y * height;
            const er = e.radius * width;
            
            ctx.save();
            ctx.translate(ex, ey);
            ctx.rotate(e.rot);
            
            ctx.beginPath();
            for(let i=0; i<e.sides; i++) {
                const angle = (i / e.sides) * Math.PI * 2;
                const spike = i % 2 === 0 ? 1 : 0.72;
                const x = Math.cos(angle) * er * spike;
                const y = Math.sin(angle) * er * spike;
                if(i===0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
            
            const enemyGrad = ctx.createRadialGradient(0, 0, er * 0.08, 0, 0, er);
            enemyGrad.addColorStop(0, 'rgba(255,255,255,0.28)');
            enemyGrad.addColorStop(0.4, enemyColor + '88');
            enemyGrad.addColorStop(1, enemyColor + '18');
            ctx.fillStyle = enemyGrad;
            ctx.fill();
            
            ctx.fillStyle = '#15000a';
            ctx.beginPath();
            ctx.arc(0, 0, er * 0.22, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        });
        ctx.shadowBlur = 0;

        // Draw Coins
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 15;
        coins.forEach(c => {
            const cx = c.x * width;
            const cy = c.y * height;
            const cr = c.radius * width;
            const offset = Math.sin(c.wobble) * 5;
            
            const coinGrad = ctx.createRadialGradient(cx, cy + offset, cr * 0.2, cx, cy + offset, cr);
            coinGrad.addColorStop(0, '#fff8cf');
            coinGrad.addColorStop(0.55, '#ffd76a');
            coinGrad.addColorStop(1, '#ffac33');
            ctx.fillStyle = coinGrad;
            ctx.beginPath();
            ctx.arc(cx, cy + offset, cr, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = Math.max(1.5, cr * 0.18);
            ctx.beginPath();
            ctx.arc(cx, cy + offset, cr * 0.74, 0, Math.PI * 2);
            ctx.stroke();
            
            // Shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx - cr*0.3, cy + offset - cr*0.3, cr*0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffd700';
        });
        ctx.shadowBlur = 0;

        ctx.restore(); // Restore shake
    }

    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        try {
            update(Math.min(dt, 0.1)); // Cap dt to prevent huge jumps
            draw();
        } catch (e) {
            console.error("Game Loop Error", e);
        }
        
        requestAnimationFrame(loop);
    }

    // --- Interaction ---
    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        state = 'PLAYING';
        await audio.unlock();
        audio.playSfx('sfx_start', 'ui', 120);
    });

    document.getElementById('restart-btn').addEventListener('click', async () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        state = 'PLAYING';
        await audio.unlock();
        audio.playSfx('sfx_restart', 'ui', 120);
    });

    // Start Loop
    requestAnimationFrame(loop);
});
</script>
