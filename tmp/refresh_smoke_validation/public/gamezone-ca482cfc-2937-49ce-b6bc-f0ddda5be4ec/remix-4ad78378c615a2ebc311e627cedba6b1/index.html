<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grand Hotel 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #140f27;
            --bg-mid: #26193f;
            --bg-light: #3f2b63;
            --panel: rgba(25, 18, 47, 0.88);
            --panel-strong: rgba(47, 29, 82, 0.96);
            --border: rgba(154, 126, 255, 0.45);
            --gold: #ffd76a;
            --gold-dark: #b97918;
            --gold-text: #432400;
            --accent-cyan: #98f4ff;
            --accent-pink: #ff7dc2;
            --text-main: #fbf7ff;
            --text-dim: #ddd6fe;
            --text-muted: #b8a9dd;
            --shadow-deep: rgba(3, 2, 10, 0.52);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 125, 194, 0.18), transparent 28%),
                radial-gradient(circle at 20% 20%, rgba(152, 244, 255, 0.12), transparent 26%),
                linear-gradient(180deg, var(--bg-dark) 0%, #21153c 52%, var(--bg-light) 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text-main);
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        button {
            font: inherit;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)),
                var(--panel);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            box-shadow:
                0 18px 38px var(--shadow-deep),
                inset 0 1px 0 rgba(255,255,255,0.12);
            color: var(--text-main);
        }

        .hud {
            position: absolute;
            top: max(env(safe-area-inset-top, 20px), 20px);
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .funds-panel {
            min-width: 132px;
            padding: 10px 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(255, 215, 106, 0.14), rgba(152, 244, 255, 0.04)),
                var(--panel-strong);
        }

        .hud-label {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hud-value {
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 400;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(255, 215, 106, 0.35);
        }

        .tool-row {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .tool-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.18s ease, color 0.18s ease;
            border: 1px solid rgba(152, 244, 255, 0.22);
            border-bottom: 4px solid var(--border);
            color: var(--text-dim);
            background:
                linear-gradient(180deg, rgba(152, 244, 255, 0.12), rgba(255, 125, 194, 0.05)),
                rgba(38, 25, 63, 0.94);
            width: 72px;
            padding: 12px 6px 10px;
            border-radius: 16px;
            box-shadow:
                0 8px 18px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.08);
            cursor: pointer;
            font-weight: 700;
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        .tool-btn.active {
            background:
                linear-gradient(180deg, #ffe8a6, var(--gold)),
                var(--gold);
            color: var(--gold-text);
            border-color: var(--gold-dark);
            transform: translateY(-4px);
            box-shadow:
                0 6px 0 #854d0e,
                0 0 22px rgba(255, 215, 106, 0.35);
        }

        .tool-icon {
            display: block;
            font-size: 24px;
            line-height: 1;
        }

        .tool-label {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background:
                radial-gradient(circle at top, rgba(255, 215, 106, 0.12), transparent 34%),
                rgba(12, 9, 24, 0.84);
            backdrop-filter: blur(10px);
        }

        .start-card {
            position: relative;
            max-width: 460px;
            width: min(100%, 460px);
            padding: 32px;
            border-radius: 28px;
            text-align: center;
            overflow: hidden;
            border: 3px solid rgba(255, 215, 106, 0.78);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(152, 244, 255, 0.1);
        }

        .start-bg {
            position: absolute;
            inset: 0;
            opacity: 0.95;
            background:
                radial-gradient(circle at top, rgba(255, 215, 106, 0.28), transparent 38%),
                radial-gradient(circle at 18% 18%, rgba(152, 244, 255, 0.2), transparent 22%),
                linear-gradient(135deg, rgba(248, 250, 252, 0.12), transparent 60%),
                linear-gradient(180deg, rgba(20, 15, 39, 0.22), rgba(20, 15, 39, 0.78));
        }

        .start-content {
            position: relative;
            z-index: 1;
        }

        .title-main,
        .title-sub {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
        }

        .title-main {
            font-size: clamp(48px, 9vw, 72px);
            line-height: 0.95;
            color: var(--gold);
            text-shadow:
                0 3px 0 rgba(0,0,0,0.18),
                0 0 22px rgba(255, 215, 106, 0.22);
        }

        .title-sub {
            margin-top: 4px;
            font-size: clamp(28px, 6vw, 44px);
            letter-spacing: 0.18em;
            color: var(--accent-cyan);
        }

        .start-copy {
            margin: 20px 0 24px;
            color: var(--text-dim);
            font-size: 24px;
            line-height: 1.15;
            font-weight: 600;
            text-shadow: 0 2px 12px rgba(0,0,0,0.28);
        }

        .start-copy .copy-detail {
            display: block;
            font-size: 20px;
            margin-top: 10px;
            color: #e2e8f0;
        }

        .start-btn {
            width: 100%;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(180deg, #fff0b8, var(--gold));
            color: #422006;
            font-size: 26px;
            font-weight: 700;
            padding: 16px 20px;
            cursor: pointer;
            box-shadow:
                0 6px 0 #854d0e,
                0 0 20px rgba(255, 215, 106, 0.28);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
            animation: pulse-glow 1.8s infinite;
        }

        .start-btn:hover {
            background: #facc15;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow:
                    0 6px 0 #854d0e,
                    0 0 18px rgba(255, 215, 106, 0.22);
            }
            50% {
                box-shadow:
                    0 6px 0 #854d0e,
                    0 0 28px rgba(255, 215, 106, 0.4);
            }
        }

        .reaction-overlay {
            position: absolute;
            right: 14px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            width: min(30vw, 140px);
            padding: 8px;
            border-radius: 18px;
            pointer-events: none;
            z-index: 12;
            opacity: 0;
            transform: translateY(14px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(18, 10, 34, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
        }

        .reaction-overlay.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .reaction-overlay img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
        }

        .reaction-caption {
            margin-top: 6px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            line-height: 1.5;
            color: var(--accent-cyan);
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .hud {
                left: 10px;
                right: 10px;
                gap: 8px;
                align-items: stretch;
            }

            .tool-row {
                gap: 6px;
            }

            .tool-btn {
                width: 64px;
                padding: 10px 4px 8px;
            }

            .start-card {
                padding: 24px 20px;
            }

            .start-copy {
                font-size: 20px;
            }

            .start-copy .copy-detail {
                font-size: 17px;
            }

            .start-btn {
                font-size: 22px;
            }
        }
    </style>
</head>

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayTimes = {};
    }

    unlock() {
        if (this.unlocked) return Promise.resolve();
        return this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {});
    }

    async loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            const buffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers[id] = { buffer, fallback: fallbackType };
        } catch (e) {
            console.warn('Audio load failed, using fallback', e);
            this.buffers[id] = { fallback: fallbackType, error: true };
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        el.play().catch(() => {});
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, cooldown = 90) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (this.lastPlayTimes[id] && now - this.lastPlayTimes[id] < cooldown) return;
        this.lastPlayTimes[id] = now;

        const sound = this.buffers[id];
        if (sound && sound.buffer && !sound.error) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = 0.32;
            source.buffer = sound.buffer;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (sound) {
            this.synthesize(sound.fallback);
        }
    }

    synthesize(type) {
        if (!this.unlocked) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;

        if (type === 'build') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.22);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.22);
            osc.start();
            osc.stop(now + 0.22);
        } else if (type === 'bell') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.linearRampToValueAtTime(1320, now + 0.15);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
            osc.start();
            osc.stop(now + 0.42);
        } else if (type === 'clean') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(460, now + 0.24);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.28);
            osc.start();
            osc.stop(now + 0.28);
        } else if (type === 'cash') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(960, now);
            osc.frequency.setValueAtTime(1440, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start();
            osc.stop(now + 0.18);
        } else if (type === 'error') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(160, now + 0.18);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start();
            osc.stop(now + 0.2);
        }
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = {
    stayTime: 5,
    rentPrice: 150,
    buildCost: 300,
    gridSize: 4
};

// State
let money = 600;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'build';
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 72;
const WALL_HEIGHT = 60;
const COLORS = {
    void: '#0f172a',
    floorBase: '#334155',
    carpet: '#9f1239',
    carpetLight: '#be123c',
    wall: '#f1f5f9',
    wallDark: '#94a3b8',
    bed: '#f8fafc',
    bedGold: '#fbbf24'
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const reactionOverlay = document.getElementById('reaction-overlay');
const reactionGif = document.getElementById('reaction-gif');
const reactionCaption = document.getElementById('reaction-caption');
const gifMap = {
    celebrate: { src: 'https://i.giphy.com/34HAaqlL2oCUo.webp', label: 'Guest payout!' },
    fail: { src: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp', label: 'Lobby fail!' }
};
let reactionTimer = null;

// Initialize
function init() {
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
    } catch (e) {}

    [
        ['sfx_build', 'build'],
        ['sfx_checkin', 'bell'],
        ['sfx_collect', 'cash'],
        ['sfx_clean', 'clean'],
        ['sfx_error', 'error'],
        ['sfx_start', 'bell']
    ].forEach(([id, fallback]) => audioManager.loadSound(id, fallback));

    updateScore();
    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });

    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playSfx('sfx_start', 0);
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGrid();
        requestAnimationFrame(gameLoop);
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audioManager.stopBgm();
        } else if (audioManager.unlocked) {
            audioManager.playBgm();
        }
    });
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 3);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'empty_lot',
                timer: 0,
                scale: 0,
                heightOffset: 0,
                variant: Math.random()
            };
        }
    }
}

function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;

    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;

    return { x: Math.floor(gx), y: Math.floor(gy) };
}

function updateScore() {
    scoreEl.textContent = money;
}

function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];

            if (cell.heightOffset > 0) {
                cell.heightOffset = Math.max(0, cell.heightOffset - dt * 100);
            }

            if (cell.state === 'room_occupied') {
                cell.timer += dt;
                cell.scale = Math.min(1, cell.timer / gameConfig.stayTime);

                if (cell.timer >= gameConfig.stayTime) {
                    cell.state = 'room_ready';
                    cell.scale = 1;
                    cell.heightOffset = 15;
                }
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2;
        if (p.z < 0) {
            p.z = 0;
            p.vz *= -0.5;
        }
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 50;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawHotelRoom(x, y, grid[x][y]);
        }
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const size = p.size * (p.life / 0.8);
        ctx.fillRect(p.x, p.y - p.z, size, size);
    });

    ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Rajdhani"';
    floatingTexts.forEach(t => {
        ctx.fillStyle = `rgba(255, 255, 255, ${t.life * 2})`;
        ctx.strokeStyle = `rgba(0, 0, 0, ${t.life * 0.5})`;
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
}

function drawHotelRoom(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    const x = pos.x;
    const y = pos.y + cell.heightOffset;
    const w = TILE_SIZE * 2;
    const h = TILE_SIZE;

    const isBuilt = cell.state !== 'empty_lot';

    ctx.fillStyle = isBuilt ? COLORS.carpet : COLORS.floorBase;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w / 2, y + h / 2);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w / 2, y + h / 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (isBuilt) {
        const wallH = WALL_HEIGHT;
        const wallColor = COLORS.wall;
        const wallDark = COLORS.wallDark;

        ctx.fillStyle = wallColor;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + h / 2);
        ctx.lineTo(x, y);
        ctx.lineTo(x, y - wallH);
        ctx.lineTo(x - w / 2, y + h / 2 - wallH);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = wallDark;
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y + h / 2);
        ctx.lineTo(x, y);
        ctx.lineTo(x, y - wallH);
        ctx.lineTo(x + w / 2, y + h / 2 - wallH);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + h / 2 - wallH);
        ctx.lineTo(x, y - wallH);
        ctx.lineTo(x + w / 2, y + h / 2 - wallH);
        ctx.lineTo(x, y - wallH - 10);
        ctx.lineTo(x, y - wallH - 4);
        ctx.lineTo(x - w / 2, y + h / 2 - wallH - 4);
        ctx.fill();

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + h / 2 - 2);
        ctx.lineTo(x, y - 2);
        ctx.lineTo(x + w / 2, y + h / 2 - 2);
        ctx.stroke();
        ctx.lineWidth = 1;

        drawRoomContents(x, y, cell);
    } else {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.arc(x, y + h / 2, 10, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawRoomContents(x, y, cell) {
    const bedX = x - 15;
    const bedY = y + 20;

    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(bedX - 2, bedY - 25, 24, 15);

    ctx.fillStyle = COLORS.bed;
    ctx.fillRect(bedX, bedY - 15, 20, 20);

    ctx.fillStyle = COLORS.bedGold;
    ctx.fillRect(bedX + 2, bedY - 18, 16, 6);

    if (cell.state === 'room_occupied') {
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(x + 5, y + 15, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(x + 2, y + 20, 8, 12);

        const barW = 40;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - barW / 2, y - WALL_HEIGHT - 20, barW, 6);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x - barW / 2 + 1, y - WALL_HEIGHT - 19, (barW - 2) * cell.scale, 4);
    } else if (cell.state === 'room_ready') {
        const floatY = y - WALL_HEIGHT - 40 + Math.sin(Date.now() / 200) * 5;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x, floatY, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#78350f';
        ctx.font = '16px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', x, floatY + 1);
    } else if (cell.state === 'room_dirty') {
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.arc(x + 10, y + 20, 8, 0, Math.PI * 2);
        ctx.fill();

        const floatY = y - WALL_HEIGHT - 30;
        ctx.font = '24px Arial';
        ctx.fillText('🧹', x, floatY);
    }
}

function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;

    const iso = screenToIso(sx, sy);

    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function showReaction(type) {
    const reaction = gifMap[type];
    if (!reaction || !reactionOverlay || !reactionGif || !reactionCaption) return;
    reactionGif.src = reaction.src;
    reactionCaption.textContent = reaction.label;
    reactionOverlay.classList.add('visible');
    clearTimeout(reactionTimer);
    reactionTimer = setTimeout(() => reactionOverlay.classList.remove('visible'), 1600);
}

function interact(x, y) {
    const cell = grid[x][y];
    const pos = isoToScreen(x, y);
    let success = false;
    let msg = '';

    if (cell.state === 'room_ready') {
        cell.state = 'room_dirty';
        money += gameConfig.rentPrice;
        spawnParticles(pos.x, pos.y, '#fbbf24', 12);
        addFloatingText(pos.x, pos.y - 80, `+$${gameConfig.rentPrice}`);
        audioManager.playSfx('sfx_collect');
        showReaction('celebrate');
        cell.heightOffset = 10;
        updateScore();
        return;
    }

    if (currentTool === 'build') {
        if (cell.state === 'empty_lot') {
            if (money >= gameConfig.buildCost) {
                money -= gameConfig.buildCost;
                cell.state = 'room_empty';
                spawnParticles(pos.x, pos.y, '#f1f5f9', 10);
                addFloatingText(pos.x, pos.y - 60, `-$${gameConfig.buildCost}`);
                audioManager.playSfx('sfx_build');
                success = true;
            } else {
                msg = 'Need Funds!';
            }
        }
    } else if (currentTool === 'reception') {
        if (cell.state === 'room_empty') {
            cell.state = 'room_occupied';
            cell.timer = 0;
            spawnParticles(pos.x, pos.y, '#3b82f6', 6);
            addFloatingText(pos.x, pos.y - 60, 'Checked In');
            audioManager.playSfx('sfx_checkin');
            success = true;
        } else if (cell.state === 'empty_lot') {
            msg = 'Build First!';
        }
    } else if (currentTool === 'maid') {
        if (cell.state === 'room_dirty') {
            cell.state = 'room_empty';
            spawnParticles(pos.x, pos.y, '#ffffff', 8);
            addFloatingText(pos.x, pos.y - 60, 'Cleaned');
            audioManager.playSfx('sfx_clean');
            success = true;
        }
    }

    if (success) {
        cell.heightOffset = 8;
        updateScore();
    } else if (msg) {
        addFloatingText(pos.x, pos.y - 60, msg);
        audioManager.playSfx('sfx_error');
        showReaction('fail');
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y - 20,
            z: 20,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            vz: Math.random() * 6 + 4,
            life: 1.0,
            color: color,
            size: Math.random() * 6 + 4
        });
    }
}

function addFloatingText(x, y, text) {
    floatingTexts.push({
        x: x,
        y: y,
        text: text,
        life: 0.8
    });
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.playSfx('sfx_build', 0);
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) {
            btn.classList.add('active');
        }
    });
};

document.addEventListener('DOMContentLoaded', init);
</script>
</body></html>
