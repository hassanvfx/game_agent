.skyline{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,rgba(9,5,27,.06),rgba(9,5,27,.72))}.skyline:before{content:"";position:absolute;left:-8%;right:-8%;bottom:0;height:48%;background:linear-gradient(90deg,transparent 0 2%,rgba(151,255,214,.08) 2% 3%,transparent 3% 8%),linear-gradient(180deg,transparent 0 18%,rgba(10,5,31,.9) 18%);clip-path:polygon(0 100%,0 46%,5% 46%,5% 24%,11% 24%,11% 55%,16% 55%,16% 34%,24% 34%,24% 12%,31% 12%,31% 52%,38% 52%,38% 27%,45% 27%,45% 62%,53% 62%,53% 18%,61% 18%,61% 44%,68% 44%,68% 8%,78% 8%,78% 58%,86% 58%,86% 31%,93% 31%,93% 48%,100% 48%,100% 100%);filter:drop-shadow(0 -16px 28px rgba(255,130,215,.12))}.skyline:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,230,109,.8) 0 1px,transparent 2px),radial-gradient(circle,rgba(151,255,214,.55) 0 1px,transparent 2px);background-size:72px 90px,108px 126px;background-position:0 0,40px 20px;animation:twinkle 5s linear infinite;opacity:.46}.moon{position:absolute;top:8%;left:50%;width:min(26vw,140px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fffbe9 0 18%,#ffe66d 42%,rgba(255,230,109,.12) 72%);box-shadow:0 0 48px rgba(255,230,109,.36);transform:translateX(-50%);opacity:.76}.cloud{position:absolute;border-radius:999px;background:rgba(255,247,223,.12);filter:blur(2px);animation:drift 16s linear infinite}.cloud.c1{width:160px;height:34px;top:18%;left:-180px}.cloud.c2{width:210px;height:42px;top:32%;left:72%;animation-duration:23s}.fairy{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint),18px -8px 0 rgba(255,130,215,.55),-16px 10px 0 rgba(141,247,255,.5);animation:floaty 4.5s ease-in-out infinite}.fairy.f1{top:30%;left:14%}.fairy.f2{top:58%;right:11%;animation-delay:1.2s}.fairy.f3{top:16%;right:26%;animation-delay:2s}@keyframes twinkle{50%{opacity:.75;transform:translateY(-4px)}}@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}@keyframes floaty{50%{transform:translateY(-14px) scale(1.2)}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.015)),var(--panel);backdrop-filter:blur(12px);border:2px solid var(--border);box-shadow:0 18px 38px var(--shadow),inset 0 1px 0 rgba(255,255,255,.14)}.hud{position:absolute;top:max(env(safe-area-inset-top,18px),18px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:10;pointer-events:none}.funds-panel{min-width:132px;padding:10px 14px;border-radius:18px;pointer-events:auto;background:linear-gradient(160deg,rgba(255,230,109,.19),rgba(151,255,214,.06)),var(--panel-strong)}.hud-label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}.hud-value{font-family:'Press Start 2P',monospace;font-size:clamp(18px,5.2vw,27px);line-height:1.25;color:var(--gold);text-shadow:0 0 12px rgba(255,230,109,.38)}.hint-pill{position:absolute;left:12px;right:12px;top:calc(max(env(safe-area-inset-top,18px),18px) + 74px);z-index:9;margin:auto;width:min(92vw,420px);padding:8px 12px;border-radius:999px;text-align:center;font-weight:700;color:#140920;background:linear-gradient(90deg,var(--mint),var(--gold),var(--pink));box-shadow:0 12px 24px rgba(0,0,0,.25);pointer-events:none}.tool-row{display:flex;gap:7px;pointer-events:auto}.tool-btn{width:70px;min-height:68px;padding:9px 4px 7px;border-radius:18px;border:1px solid rgba(141,247,255,.25);border-bottom:4px solid rgba(151,255,214,.35);cursor:pointer;color:var(--cream);background:linear-gradient(180deg,rgba(141,247,255,.14),rgba(255,130,215,.08)),rgba(28,20,64,.94);box-shadow:0 8px 18px rgba(0,0,0,.26);transition:transform .1s ease,background .15s ease,color .15s ease}.tool-btn:active{transform:scale(.96)}.tool-btn.active{background:linear-gradient(180deg,#fff4a8,var(--gold));color:#3b2400;border-color:#b97918;transform:translateY(-4px);box-shadow:0 6px 0 #84500e,0 0 24px rgba(255,230,109,.36)}.tool-icon{display:block;font-size:24px;line-height:1}.tool-label{display:block;margin-top:4px;font-size:10px;line-height:1.04;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.start-screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 12%,rgba(255,230,109,.16),transparent 34%),rgba(9,5,27,.82);backdrop-filter:blur(10px)}.start-card{position:relative;width:min(100%,460px);padding:28px 24px;border-radius:30px;text-align:center;overflow:hidden;border:3px solid rgba(255,230,109,.76);box-shadow:0 26px 64px rgba(0,0,0,.46),0 0 44px rgba(141,247,255,.14)}.start-card:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 180deg,transparent,rgba(151,255,214,.18),transparent,rgba(255,130,215,.18),transparent);animation:spin 12s linear infinite}.start-content{position:relative;z-index:1}.mascot{width:92px;height:92px;margin:0 auto 12px;position:relative;border-radius:24px;background:linear-gradient(160deg,#fff7df,#ffe66d 48%,#ff82d7);box-shadow:0 0 28px rgba(255,230,109,.35);transform:rotate(-5deg)}.mascot:before,.mascot:after{content:"";position:absolute;background:#100920}.mascot:before{width:54px;height:18px;border-radius:999px;left:19px;top:30px;box-shadow:0 24px 0 -4px #100920}.mascot:after{width:18px;height:18px;border-radius:50%;left:17px;top:-8px;box-shadow:40px 0 0 #97ffd6}.title-main{margin:0;font-family:'Orbitron',sans-serif;font-size:clamp(38px,9vw,62px);line-height:.95;text-transform:uppercase;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.18),0 0 24px rgba(255,230,109,.28)}.title-sub{margin:6px 0 0;font-family:'Press Start 2P',monospace;font-size:clamp(14px,3.4vw,20px);line-height:1.45;color:var(--cyan);text-transform:uppercase}.start-copy{margin:18px 0 22px;color:var(--dim);font-size:22px;line-height:1.15;font-weight:700}.copy-detail{display:block;font-size:18px;margin-top:10px;color:#fff7df}.start-btn{width:100%;border:0;border-radius:18px;background:linear-gradient(180deg,#fff8be,var(--gold));color:#3b2400;font-size:25px;font-weight:700;padding:16px 18px;cursor:pointer;box-shadow:0 6px 0 #84500e,0 0 22px rgba(255,230,109,.3);animation:pulse 1.8s infinite}.start-btn:active{transform:translateY(6px);box-shadow:none;animation:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 6px 0 #84500e,0 0 34px rgba(255,230,109,.48)}}
.reaction-overlay{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(31vw,138px);padding:8px;border-radius:18px;pointer-events:none;z-index:12;opacity:0;transform:translateY(14px) scale(.94);transition:opacity .22s ease,transform .22s ease;background:rgba(18,10,34,.82)}.reaction-overlay.visible{opacity:1;transform:translateY(0) scale(1)}.reaction-overlay img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:rgba(255,255,255,.06)}.reaction-caption{margin-top:6px;font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.5;color:var(--cyan);text-align:center;text-transform:uppercase}.toast{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:14;transform:translate(-50%,18px);opacity:0;padding:8px 14px;border-radius:999px;font-weight:700;color:#140920;background:linear-gradient(90deg,var(--gold),var(--mint));transition:.2s ease;pointer-events:none}.toast.visible{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.hud{left:8px;right:8px}.funds-panel{padding:9px 10px;min-width:112px}.tool-row{gap:5px}.tool-btn{width:62px;min-height:62px}.tool-icon{font-size:21px}.tool-label{font-size:9px}.start-card{padding:24px 18px}.start-copy{font-size:19px}.copy-detail{font-size:16px}.start-btn{font-size:21px}.hint-pill{font-size:14px;top:calc(max(env(safe-area-inset-top,18px),18px) + 68px)}}

<script id="game-config" type="application/x-game-config">{"stayTime":{"type":"number","label":"Shift Duration (sec)","value":5},"rentPrice":{"type":"number","label":"Dream Coin Payout ($)","value":150},"buildCost":{"type":"number","label":"Kiosk Cost ($)","value":300},"gridSize":{"type":"number","label":"City Grid","value":4}}</script>
<div id="game-container" class="game-container">
  <div class="skyline" aria-hidden="true"><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="fairy f1"></div><div class="fairy f2"></div><div class="fairy f3"></div></div>

  <div id="toast" class="toast" aria-live="polite">main character energy</div>
  <div id="start-screen" class="start-screen">
    <div class="glass start-card"><div class="start-content"><div class="mascot" aria-hidden="true"></div><h1 class="title-main">Moonlit</h1><h2 class="title-sub">Money Tycoon</h2><p class="start-copy">Cozy neon city, tiny idle stacks.<span class="copy-detail">Build kiosks, hire sleepy main characters, collect dream coins, reset for more. fr fr.</span></p><button id="start-btn" class="start-btn">Start Stacking</button></div></div>
  </div>

<script>
class AudioManager{constructor(){this.ctx=null;this.buffers={};this.unlocked=false;this.lastPlayTimes={}}ensure(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()}unlock(){this.ensure();if(this.unlocked)return Promise.resolve();return this.ctx.resume().then(()=>{this.unlocked=true;this.playBgm()}).catch(()=>{})}async loadSound(id,fallbackType){this.buffers[id]={fallback:fallbackType}}playBgm(){const el=document.getElementById('bgm_main');if(!el)return;el.volume=.14;el.play().catch(()=>{})}stopBgm(){const el=document.getElementById('bgm_main');if(!el)return;el.pause();el.currentTime=0}playSfx(id,cooldown=90){if(!this.unlocked)return;const now=performance.now();if(this.lastPlayTimes[id]&&now-this.lastPlayTimes[id]<cooldown)return;this.lastPlayTimes[id]=now;const sound=this.buffers[id]||{fallback:'bell'};const el=document.getElementById(id);if(el){try{el.volume=.3;el.currentTime=0;const result=el.play();if(result&&result.catch)result.catch(()=>this.synthesize(sound.fallback));return}catch(e){this.synthesize(sound.fallback);return}}this.synthesize(sound.fallback)}synthesize(type){if(!this.unlocked)return;this.ensure();const osc=this.ctx.createOscillator();const gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);const now=this.ctx.currentTime;if(type==='build'){osc.type='sawtooth';osc.frequency.setValueAtTime(150,now);osc.frequency.exponentialRampToValueAtTime(320,now+.08);osc.frequency.exponentialRampToValueAtTime(.01,now+.22);gain.gain.setValueAtTime(.18,now);gain.gain.linearRampToValueAtTime(0,now+.22);osc.start();osc.stop(now+.22)}else if(type==='bell'){osc.type='sine';osc.frequency.setValueAtTime(880,now);osc.frequency.linearRampToValueAtTime(1320,now+.15);gain.gain.setValueAtTime(.12,now);gain.gain.exponentialRampToValueAtTime(.01,now+.42);osc.start();osc.stop(now+.42)}else if(type==='clean'){osc.type='triangle';osc.frequency.setValueAtTime(220,now);osc.frequency.linearRampToValueAtTime(460,now+.24);gain.gain.setValueAtTime(.14,now);gain.gain.linearRampToValueAtTime(0,now+.28);osc.start();osc.stop(now+.28)}else if(type==='cash'){osc.type='square';osc.frequency.setValueAtTime(960,now);osc.frequency.setValueAtTime(1440,now+.08);gain.gain.setValueAtTime(.12,now);gain.gain.linearRampToValueAtTime(0,now+.18);osc.start();osc.stop(now+.18)}else if(type==='error'){osc.type='square';osc.frequency.setValueAtTime(220,now);osc.frequency.linearRampToValueAtTime(160,now+.18);gain.gain.setValueAtTime(.1,now);gain.gain.linearRampToValueAtTime(0,now+.2);osc.start();osc.stop(now+.2)}}}
const audioManager=new AudioManager();let gameConfig={stayTime:5,rentPrice:150,buildCost:300,gridSize:4};let money=600,grid=[],particles=[],floatingTexts=[],currentTool='build',lastTime=0,camera={x:0,y:0};const TILE_SIZE=72,WALL_HEIGHT=60;const COLORS={void:'#100920',floorBase:'#27184e',floorEdge:'#5a3b91',carpet:'#2eecc2',carpetLight:'#8df7ff',wall:'#fff7df',wallDark:'#7c63ff',bed:'#ff82d7',bedGold:'#ffe66d'};const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('scoreVal'),startScreen=document.getElementById('start-screen'),hud=document.getElementById('hud'),hint=document.getElementById('hint'),reactionOverlay=document.getElementById('reaction-overlay'),reactionGif=document.getElementById('reaction-gif'),reactionCaption=document.getElementById('reaction-caption'),toast=document.getElementById('toast');const gifMap={celebrate:{src:'https://i.giphy.com/34HAaqlL2oCUo.webp',label:'coin aura fr fr'},fail:{src:'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',label:'not enough stacks'}};let reactionTimer=null,toastTimer=null;
function init(){try{const rawConfig=JSON.parse(document.getElementById('game-config').textContent);for(let k in rawConfig)gameConfig[k]=rawConfig[k].value}catch(e){}[['sfx_build','build'],['sfx_checkin','bell'],['sfx_collect','cash'],['sfx_clean','clean'],['sfx_error','error'],['sfx_start','bell']].forEach(([id,fallback])=>audioManager.loadSound(id,fallback));updateScore();resize();window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',handleInput,{passive:false});document.getElementById('start-btn').addEventListener('click',()=>{audioManager.unlock();audioManager.playSfx('sfx_start',0);startScreen.classList.add('hidden');hud.classList.remove('hidden');hint.classList.remove('hidden');initGrid();lastTime=performance.now();requestAnimationFrame(gameLoop);setTimeout(()=>hint.classList.add('hidden'),5200)});document.addEventListener('visibilitychange',()=>{if(document.hidden)audioManager.stopBgm();else if(audioManager.unlocked)audioManager.playBgm()})}
function resize(){const dpr=window.devicePixelRatio||1;canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);camera.x=window.innerWidth/2;camera.y=window.innerHeight/2-(gameConfig.gridSize*TILE_SIZE/3)+18}
function initGrid(){grid=[];const size=gameConfig.gridSize;for(let x=0;x<size;x++){grid[x]=[];for(let y=0;y<size;y++){grid[x][y]={state:'empty_lot',timer:0,scale:0,heightOffset:0,variant:Math.random()}}}}
function isoToScreen(gx,gy){const tileW=TILE_SIZE,tileH=TILE_SIZE/2;return{x:(gx-gy)*tileW+camera.x,y:(gx+gy)*tileH+camera.y}}
function screenToIso(sx,sy){const adjX=sx-camera.x,adjY=sy-camera.y,tileW=TILE_SIZE,tileH=TILE_SIZE/2;const gy=((adjY/tileH)-(adjX/tileW))/2,gx=((adjY/tileH)+(adjX/tileW))/2;return{x:Math.floor(gx),y:Math.floor(gy)}}
function updateScore(){scoreEl.textContent=money}
function gameLoop(timestamp){const dt=(timestamp-lastTime)/1000;lastTime=timestamp;update(dt);draw();requestAnimationFrame(gameLoop)}
function update(dt){for(let x=0;x<gameConfig.gridSize;x++){for(let y=0;y<gameConfig.gridSize;y++){const cell=grid[x][y];if(cell.heightOffset>0)cell.heightOffset=Math.max(0,cell.heightOffset-dt*100);if(cell.state==='room_occupied'){cell.timer+=dt;cell.scale=Math.min(1,cell.timer/gameConfig.stayTime);if(cell.timer>=gameConfig.stayTime){cell.state='room_ready';cell.scale=1;cell.heightOffset=15}}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.z+=p.vz*dt*60;p.vz-=dt*2;if(p.z<0){p.z=0;p.vz*=-.5}if(p.life<=0)particles.splice(i,1)}for(let i=floatingTexts.length-1;i>=0;i--){const t=floatingTexts[i];t.life-=dt;t.y-=dt*50;if(t.life<=0)floatingTexts.splice(i,1)}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawGroundGlow();for(let x=0;x<gameConfig.gridSize;x++)for(let y=0;y<gameConfig.gridSize;y++)drawMoneyPod(x,y,grid[x][y]);particles.forEach(p=>{ctx.save();ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;const size=p.size*(p.life/.8);if(p.shape==='coin'){ctx.beginPath();ctx.arc(p.x,p.y-p.z,size,0,Math.PI*2);ctx.fill()}else ctx.fillRect(p.x,p.y-p.z,size,size);ctx.restore()});ctx.textAlign='center';ctx.font='bold 22px Rajdhani';floatingTexts.forEach(t=>{ctx.fillStyle=`rgba(255,247,223,${Math.min(1,t.life*2)})`;ctx.strokeStyle=`rgba(16,9,32,${t.life*.65})`;ctx.lineWidth=5;ctx.strokeText(t.text,t.x,t.y);ctx.fillText(t.text,t.x,t.y)})}
function drawGroundGlow(){ctx.save();const grad=ctx.createRadialGradient(window.innerWidth/2,window.innerHeight*.58,20,window.innerWidth/2,window.innerHeight*.58,Math.min(window.innerWidth,window.innerHeight)*.7);grad.addColorStop(0,'rgba(151,255,214,.14)');grad.addColorStop(1,'rgba(255,130,215,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,window.innerWidth,window.innerHeight);ctx.restore()}
function diamond(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x,y+h);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function drawMoneyPod(gx,gy,cell){const pos=isoToScreen(gx,gy);const x=pos.x,y=pos.y+cell.heightOffset,w=TILE_SIZE*2,h=TILE_SIZE;const isBuilt=cell.state!=='empty_lot';const pulse=.5+Math.sin(Date.now()/360+cell.variant*6)*.5;ctx.save();ctx.shadowColor=isBuilt?'rgba(151,255,214,.34)':'rgba(255,130,215,.18)';ctx.shadowBlur=isBuilt?18:8;diamond(x,y,w,h,isBuilt?COLORS.carpet:COLORS.floorBase,isBuilt?'rgba(151,255,214,.72)':'rgba(255,130,215,.28)');ctx.shadowBlur=0;diamond(x,y+6,w*.74,h*.68,isBuilt?'rgba(16,9,32,.28)':'rgba(141,247,255,.06)',null);if(isBuilt){const wallH=WALL_HEIGHT;ctx.fillStyle=COLORS.wall;ctx.beginPath();ctx.moveTo(x-w/2,y+h/2);ctx.lineTo(x,y);ctx.lineTo(x,y-wallH);ctx.lineTo(x-w/2,y+h/2-wallH);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(151,255,214,.45)';ctx.stroke();ctx.fillStyle=COLORS.wallDark;ctx.beginPath();ctx.moveTo(x+w/2,y+h/2);ctx.lineTo(x,y);ctx.lineTo(x,y-wallH);ctx.lineTo(x+w/2,y+h/2-wallH);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,230,109,.92)';ctx.beginPath();ctx.moveTo(x-w/2,y+h/2-wallH);ctx.lineTo(x,y-wallH-12);ctx.lineTo(x+w/2,y+h/2-wallH);ctx.lineTo(x,y-wallH-4);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,130,215,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w/2,y+h/2-2);ctx.lineTo(x,y-2);ctx.lineTo(x+w/2,y+h/2-2);ctx.stroke();drawPodContents(x,y,cell,pulse)}else{ctx.strokeStyle=`rgba(151,255,214,${.25+pulse*.35})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+h/2,13+pulse*3,0,Math.PI*2);ctx.stroke();ctx.font='18px Arial';ctx.fillStyle='rgba(255,247,223,.75)';ctx.fillText('＋',x,y+h/2+7)}ctx.restore()}
function drawPodContents(x,y,cell,pulse){const deskX=x-18,deskY=y+18;ctx.fillStyle='rgba(255,130,215,.9)';ctx.fillRect(deskX-8,deskY-18,42,14);ctx.fillStyle=COLORS.bedGold;ctx.fillRect(deskX-4,deskY-23,34,7);ctx.fillStyle='rgba(16,9,32,.62)';ctx.fillRect(deskX,deskY-30,22,10);ctx.fillStyle="#97ffd6";if(cell.state==='room_occupied'){ctx.fillStyle='#100920';ctx.beginPath();ctx.arc(x+5,y+15,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#97ffd6';ctx.fillRect(x+1,y+20,10,13);ctx.fillStyle='#ff82d7';ctx.beginPath();ctx.arc(x+5,y+11,8,Math.PI,0);ctx.fill();const barW=44;ctx.fillStyle='rgba(16,9,32,.8)';ctx.fillRect(x-barW/2,y-WALL_HEIGHT-24,barW,7);ctx.fillStyle='#ffe66d';ctx.fillRect(x-barW/2+1,y-WALL_HEIGHT-23,(barW-2)*cell.scale,5);ctx.font='13px Arial';ctx.fillText('💤',x+26,y-WALL_HEIGHT-18)}else if(cell.state==='room_ready'){const floatY=y-WALL_HEIGHT-42+Math.sin(Date.now()/190)*5;ctx.shadowColor='#ffe66d';ctx.shadowBlur=22;ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(x,floatY,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#3b2400';ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',x,floatY+1);ctx.textBaseline='alphabetic'}else if(cell.state==='room_dirty'){ctx.fillStyle='rgba(90,59,145,.85)';ctx.beginPath();ctx.arc(x+10,y+20,9,0,Math.PI*2);ctx.fill();ctx.font='23px Arial';ctx.fillText('🫧',x,y-WALL_HEIGHT-29)}else{ctx.font='17px Arial';ctx.fillStyle='rgba(255,247,223,.9)';ctx.fillText('✨',x+24,y+15)}}
function handleInput(e){e.preventDefault();const rect=canvas.getBoundingClientRect();const sx=e.clientX-rect.left,sy=e.clientY-rect.top;const iso=screenToIso(sx,sy);if(iso.x>=0&&iso.x<gameConfig.gridSize&&iso.y>=0&&iso.y<gameConfig.gridSize)interact(iso.x,iso.y)}
function showReaction(type){const reaction=gifMap[type];if(!reaction||!reactionOverlay||!reactionGif||!reactionCaption)return;reactionGif.src=reaction.src;reactionCaption.textContent=reaction.label;reactionOverlay.classList.add('visible');clearTimeout(reactionTimer);reactionTimer=setTimeout(()=>reactionOverlay.classList.remove('visible'),1600)}
function showToast(text){toast.textContent=text;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),1400)}
function interact(x,y){const cell=grid[x][y],pos=isoToScreen(x,y);let success=false,msg='';if(cell.state==='room_ready'){cell.state='room_dirty';money+=gameConfig.rentPrice;spawnParticles(pos.x,pos.y,'#ffe66d',12,'coin');addFloatingText(pos.x,pos.y-80,`+$${gameConfig.rentPrice}`);audioManager.playSfx('sfx_collect');showReaction('celebrate');showToast('passive income main character');cell.heightOffset=10;updateScore();return}if(currentTool==='build'){if(cell.state==='empty_lot'){if(money>=gameConfig.buildCost){money-=gameConfig.buildCost;cell.state='room_empty';spawnParticles(pos.x,pos.y,'#97ffd6',10);addFloatingText(pos.x,pos.y-60,`-$${gameConfig.buildCost}`);audioManager.playSfx('sfx_build');success=true;showToast('kiosk unlocked')}else msg='Need stacks!'}}else if(currentTool==='reception'){if(cell.state==='room_empty'){cell.state='room_occupied';cell.timer=0;spawnParticles(pos.x,pos.y,'#ff82d7',6);addFloatingText(pos.x,pos.y-60,'Hired!');audioManager.playSfx('sfx_checkin');success=true;showToast('sleep shift started')}else if(cell.state==='empty_lot')msg='Build first!'}else if(currentTool==='maid'){if(cell.state==='room_dirty'){cell.state='room_empty';spawnParticles(pos.x,pos.y,'#fff7df',8);addFloatingText(pos.x,pos.y-60,'Reset!');audioManager.playSfx('sfx_clean');success=true;showToast('pod cozy again')}}if(success){cell.heightOffset=8;updateScore()}else if(msg){addFloatingText(pos.x,pos.y-60,msg);audioManager.playSfx('sfx_error');showReaction('fail');showToast(msg)}}
function spawnParticles(x,y,color,count,shape='spark'){for(let i=0;i<count;i++)particles.push({x:x,y:y-20,z:20,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,vz:Math.random()*6+4,life:1,color:color,size:Math.random()*6+4,shape})}
function addFloatingText(x,y,text){floatingTexts.push({x,y,text,life:.8})}
window.selectTool=(tool)=>{currentTool=tool;audioManager.playSfx('sfx_build',0);document.querySelectorAll('.tool-btn').forEach(btn=>{btn.classList.remove('active');if(btn.id===`tool-${tool}`)btn.classList.add('active')})};document.addEventListener('DOMContentLoaded',init);
</script>
