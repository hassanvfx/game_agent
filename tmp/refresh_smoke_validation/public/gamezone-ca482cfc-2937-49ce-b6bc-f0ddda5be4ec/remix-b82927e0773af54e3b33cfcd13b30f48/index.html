<style>
:root{--night:#10221b;--swamp:#17442d;--moss:#6bd35c;--moss2:#9cff75;--mud:#7a4c26;--cream:#fff5c8;--gold:#ffd34f;--coin:#ffea75;--pink:#ff95d8;--cyan:#92fff0;--panel:rgba(20,42,29,.88);--line:rgba(255,245,200,.32)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1d17;color:var(--cream);font-family:Rajdhani,system-ui,sans-serif;touch-action:none}button{font:inherit}.game-container{position:relative;width:100%;height:100%;isolation:isolate;user-select:none;background:radial-gradient(circle at 50% 8%,rgba(255,211,79,.18),transparent 18%),linear-gradient(180deg,#172d24 0%,#10221b 58%,#0b1713 100%)}
.bg-magic{position:absolute;inset:0;z-index:-2;overflow:hidden}.moon{position:absolute;top:8%;left:50%;width:min(34vw,150px);height:min(34vw,150px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7ae,#f7c948 58%,#d58b23);box-shadow:0 0 42px rgba(255,211,79,.38)}.moon:before,.moon:after{content:"";position:absolute;border-radius:50%;background:rgba(122,76,38,.18)}.moon:before{width:34%;height:34%;left:18%;top:24%}.moon:after{width:22%;height:22%;right:22%;bottom:22%}.hills{position:absolute;left:-8%;right:-8%;bottom:-4%;height:42%;background:radial-gradient(80% 75% at 12% 100%,#23653e 0 54%,transparent 55%),radial-gradient(78% 82% at 50% 108%,#1b5638 0 58%,transparent 59%),radial-gradient(70% 80% at 88% 104%,#224d33 0 56%,transparent 57%)}.fireflies{position:absolute;inset:0;background-image:radial-gradient(circle,#fff2a8 0 2px,transparent 2.5px),radial-gradient(circle,#aaff8d 0 1.5px,transparent 2px),radial-gradient(circle,#ffb7e5 0 1.5px,transparent 2px);background-size:120px 150px,170px 130px,210px 180px;animation:drift 12s linear infinite;opacity:.45}@keyframes drift{to{transform:translate3d(35px,-28px,0)}}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.hidden{display:none!important}.cash-card,.tip-card{pointer-events:auto;border:2px solid var(--line);border-bottom:5px solid rgba(38,86,48,.9);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),var(--panel);box-shadow:0 14px 30px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(10px)}.cash-card{min-width:126px;padding:9px 12px}.hud-label{display:block;color:#bcf7b6;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.hud-value{display:block;margin-top:4px;font-family:'Press Start 2P',monospace;font-size:20px;line-height:1.2;color:var(--coin);text-shadow:0 0 12px rgba(255,211,79,.45)}.tip-card{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:8px 10px;text-align:center;color:#dfffd8;font-size:14px;font-weight:700;z-index:9;pointer-events:none}.tool-row{display:flex;gap:6px;pointer-events:auto}.tool-btn{width:66px;min-height:60px;border:2px solid rgba(255,245,200,.2);border-bottom:5px solid #234827;border-radius:17px;padding:7px 3px 5px;background:linear-gradient(180deg,rgba(156,255,117,.13),rgba(255,149,216,.06)),rgba(17,49,31,.92);color:#eaffde;box-shadow:0 9px 18px rgba(0,0,0,.28);cursor:pointer;font-weight:800}.tool-btn:active{transform:translateY(3px)}.tool-btn.active{background:linear-gradient(180deg,#fff18a,#ffd34f);color:#472b0b;border-color:#a36817;border-bottom-color:#7c470e;transform:translateY(-3px);box-shadow:0 8px 0 #7c470e,0 0 22px rgba(255,211,79,.28)}
.tool-icon{display:block;font-size:23px;line-height:1}.tool-label{display:block;margin-top:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}.start-screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,rgba(9,22,17,.7),rgba(9,22,17,.9));backdrop-filter:blur(9px)}.start-card{width:min(94vw,460px);position:relative;overflow:hidden;text-align:center;padding:26px 20px 22px;border:3px solid rgba(255,211,79,.72);border-radius:30px;background:radial-gradient(circle at 50% 0%,rgba(255,211,79,.28),transparent 35%),linear-gradient(180deg,rgba(35,101,62,.96),rgba(20,42,29,.98));box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 0 8px rgba(107,211,92,.08)}.ogre-mark{width:92px;height:78px;margin:0 auto 8px;position:relative;filter:drop-shadow(0 8px 0 rgba(0,0,0,.17))}.ogre-head{position:absolute;left:12px;right:12px;bottom:0;height:58px;border-radius:35% 35% 42% 42%;background:linear-gradient(180deg,#9cff75,#4ea93e);border:3px solid #153d24}.ogre-ear{position:absolute;top:25px;width:26px;height:17px;background:#74c854;border:3px solid #153d24;border-radius:50%}.ogre-ear.left{left:0;transform:rotate(-20deg)}.ogre-ear.right{right:0;transform:rotate(20deg)}.ogre-eye{position:absolute;top:31px;width:8px;height:8px;background:#10221b;border-radius:50%}.ogre-eye.l{left:34px}.ogre-eye.r{right:34px}.ogre-smile{position:absolute;left:37px;top:45px;width:18px;height:8px;border-bottom:3px solid #10221b;border-radius:50%}.title-main{font-family:Cinzel,serif;font-size:clamp(34px,9vw,58px);line-height:.95;margin:0;color:var(--coin);text-transform:uppercase;text-shadow:0 3px 0 #70440c,0 0 24px rgba(255,211,79,.35)}.title-sub{font-family:'Press Start 2P',monospace;font-size:clamp(13px,3.7vw,21px);line-height:1.35;margin:9px 0 0;color:var(--cyan);text-transform:uppercase}.start-copy{font-size:20px;line-height:1.15;font-weight:700;color:#e8ffda;margin:18px 0}.copy-detail{display:block;margin-top:9px;font-size:16px;color:#c5f8bb}.start-btn{width:100%;border:0;border-radius:18px;background:linear-gradient(180deg,#fff6a6,#ffd34f);color:#442706;font-size:22px;font-weight:900;padding:15px 16px;box-shadow:0 7px 0 #8a520e,0 0 22px rgba(255,211,79,.28);cursor:pointer;animation:pulse 1.8s infinite}.start-btn:active{transform:translateY(6px);box-shadow:none}@keyframes pulse{50%{filter:brightness(1.12)}}.reaction{position:absolute;right:12px;bottom:calc(54px + env(safe-area-inset-bottom));z-index:14;max-width:min(44vw,180px);padding:10px 12px;border-radius:18px;border:2px solid rgba(255,211,79,.45);background:rgba(20,42,29,.9);color:#fff7b0;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.55;box-shadow:0 13px 28px rgba(0,0,0,.34);opacity:0;transform:translateY(14px) scale(.94);transition:.2s;pointer-events:none}.reaction.visible{opacity:1;transform:translateY(0) scale(1)}@media (min-width:650px){.tool-btn{width:82px}.tip-card{left:50%;right:auto;transform:translateX(-50%);width:min(520px,60vw)}}@media (max-height:620px){.start-card{padding:18px}.ogre-mark{width:78px;height:65px}.start-copy{font-size:17px;margin:12px 0}.copy-detail{font-size:14px}.tool-btn{min-height:54px}.tip-card{font-size:12px}}
</style></head><body>
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" preload="auto" loop></audio><audio id="sfx_build" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_character_01.mp3" preload="auto"></audio><audio id="sfx_checkin" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_npc_01.mp3" preload="auto"></audio><audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/joyful_item_01.mp3" preload="auto"></audio><audio id="sfx_clean" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3" preload="auto"></audio><audio id="sfx_error" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_defeat_01.mp3" preload="auto"></audio><audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio>
<script id="game-config" type="application/x-game-config">{"stayTime":{"type":"number","label":"Brew Duration (sec)","value":5},"rentPrice":{"type":"number","label":"Swamp Payout ($)","value":150},"buildCost":{"type":"number","label":"Kiosk Cost ($)","value":300},"gridSize":{"type":"number","label":"Bog Grid","value":4}}</script>
<div id="game-container" class="game-container"><div class="bg-magic" aria-hidden="true"><div class="moon"></div><div class="fireflies"></div><div class="hills"></div></div><canvas id="gameCanvas"></canvas><div id="hud" class="hud hidden"><div class="cash-card"><span class="hud-label">Swamp Stacks</span><span class="hud-value">$<span id="scoreVal">600</span></span></div><div class="tool-row" aria-label="Tycoon tools"><button id="tool-build" class="tool-btn active" onclick="selectTool('build')"><span class="tool-icon">🧅</span><span class="tool-label">Build</span></button><button id="tool-reception" class="tool-btn" onclick="selectTool('reception')"><span class="tool-icon">🧚</span><span class="tool-label">Hire</span></button><button id="tool-maid" class="tool-btn" onclick="selectTool('maid')"><span class="tool-icon">🫧</span><span class="tool-label">Reset</span></button></div></div><div id="tip-card" class="tip-card hidden">Tap a lily parcel with Build. Same tycoon loop, swampier profits fr fr.</div><div id="reaction" class="reaction" aria-live="polite">Moss Boss says: main character money.</div><div id="start-screen" class="start-screen"><div class="start-card"><div class="ogre-mark" aria-hidden="true"><div class="ogre-ear left"></div><div class="ogre-ear right"></div><div class="ogre-head"></div><div class="ogre-eye l"></div><div class="ogre-eye r"></div><div class="ogre-smile"></div></div><h1 class="title-main">Money Tycoon</h1><h2 class="title-sub">Swamp Stack fr fr</h2><p class="start-copy">Be the cozy bog main character.<span class="copy-detail">Build kiosks, hire fairy shoppers, wait for idle payout bags, collect, then reset the mud.</span></p><button id="start-btn" class="start-btn">Start Stacking</button></div></div></div>
<script>
class AudioManager{constructor(){this.ctx=null;this.unlocked=false;this.last={}}unlock(){if(this.unlocked)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.ctx.resume();this.unlocked=true;const b=document.getElementById('bgm_main');if(b){b.volume=.14;b.play().catch(()=>{})}}catch(e){this.unlocked=false}}playSfx(id,cool=80){if(!this.unlocked)return;const now=performance.now();if(this.last[id]&&now-this.last[id]<cool)return;this.last[id]=now;const el=document.getElementById(id);if(el){try{el.currentTime=0;el.volume=.28;el.play().catch(()=>this.beep(id))}catch(e){this.beep(id)}}else this.beep(id)}beep(id){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);const now=this.ctx.currentTime;const map={sfx_build:260,sfx_checkin:760,sfx_collect:1120,sfx_clean:460,sfx_error:170,sfx_start:880};o.type=id==='sfx_error'?'square':'triangle';o.frequency.setValueAtTime(map[id]||500,now);o.frequency.exponentialRampToValueAtTime((map[id]||500)*1.35,now+.1);g.gain.setValueAtTime(.09,now);g.gain.linearRampToValueAtTime(0,now+.2);o.start();o.stop(now+.22)}stopBgm(){const b=document.getElementById('bgm_main');if(b){b.pause();b.currentTime=0}}}
const audioManager=new AudioManager();let gameConfig={stayTime:5,rentPrice:150,buildCost:300,gridSize:4};let money=600,grid=[],particles=[],floatingTexts=[],currentTool='build',lastTime=0,camera={x:0,y:0},started=false;const TILE_SIZE=72,WALL_HEIGHT=60;const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('scoreVal'),startScreen=document.getElementById('start-screen'),hud=document.getElementById('hud'),tipCard=document.getElementById('tip-card'),reaction=document.getElementById('reaction');
function init(){try{const raw=JSON.parse(document.getElementById('game-config').textContent);for(let k in raw)gameConfig[k]=raw[k].value}catch(e){}updateScore();resize();window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',handleInput,{passive:false});document.getElementById('start-btn').addEventListener('click',()=>{audioManager.unlock();audioManager.playSfx('sfx_start',0);startScreen.classList.add('hidden');hud.classList.remove('hidden');tipCard.classList.remove('hidden');initGrid();started=true;lastTime=performance.now();requestAnimationFrame(gameLoop)});document.addEventListener('visibilitychange',()=>{if(document.hidden)audioManager.stopBgm();else if(audioManager.unlocked){const b=document.getElementById('bgm_main');if(b)b.play().catch(()=>{})}})}
function resize(){const dpr=window.devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);camera.x=innerWidth/2;camera.y=innerHeight/2-(gameConfig.gridSize*TILE_SIZE/3)+(innerHeight<650?26:4);if(!started)drawSplashGrid()}
function initGrid(){grid=[];for(let x=0;x<gameConfig.gridSize;x++){grid[x]=[];for(let y=0;y<gameConfig.gridSize;y++){grid[x][y]={state:'empty_lot',timer:0,scale:0,heightOffset:0,variant:Math.random()}}}}
function isoToScreen(gx,gy){return{x:(gx-gy)*TILE_SIZE+camera.x,y:(gx+gy)*(TILE_SIZE/2)+camera.y}}function screenToIso(sx,sy){const ax=sx-camera.x,ay=sy-camera.y,tw=TILE_SIZE,th=TILE_SIZE/2;return{x:Math.floor((ay/th+ax/tw)/2),y:Math.floor((ay/th-ax/tw)/2)}}function updateScore(){scoreEl.textContent=money}
function gameLoop(t){const dt=Math.min(.05,(t-lastTime)/1000);lastTime=t;update(dt);draw();requestAnimationFrame(gameLoop)}
function update(dt){for(let x=0;x<gameConfig.gridSize;x++)for(let y=0;y<gameConfig.gridSize;y++){const c=grid[x][y];if(c.heightOffset>0)c.heightOffset=Math.max(0,c.heightOffset-dt*100);if(c.state==='room_occupied'){c.timer+=dt;c.scale=Math.min(1,c.timer/gameConfig.stayTime);if(c.timer>=gameConfig.stayTime){c.state='room_ready';c.scale=1;c.heightOffset=15;showReaction('Payout bag spawned. collect the rent, main character.')}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.z+=p.vz*dt*60;p.vz-=dt*2;if(p.z<0){p.z=0;p.vz*=-.45}if(p.life<=0)particles.splice(i,1)}for(let i=floatingTexts.length-1;i>=0;i--){const f=floatingTexts[i];f.life-=dt;f.y-=dt*48;if(f.life<=0)floatingTexts.splice(i,1)}}
function drawSplashGrid(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let x=0;x<4;x++)for(let y=0;y<4;y++)drawParcel(x,y,{state:'empty_lot',heightOffset:0,variant:(x+y)/8,scale:0},true)}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);drawSceneProps();for(let x=0;x<gameConfig.gridSize;x++)for(let y=0;y<gameConfig.gridSize;y++)drawParcel(x,y,grid[x][y]);particles.forEach(p=>{const s=p.size*(p.life/.95);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillRect(p.x-s/2,p.y-p.z-s/2,s,s);ctx.shadowBlur=0});ctx.textAlign='center';ctx.font='bold 22px Rajdhani';floatingTexts.forEach(t=>{ctx.globalAlpha=Math.max(0,t.life/.8);ctx.lineWidth=5;ctx.strokeStyle='rgba(22,36,20,.7)';ctx.fillStyle=t.color||'#fff5c8';ctx.strokeText(t.text,t.x,t.y);ctx.fillText(t.text,t.x,t.y);ctx.globalAlpha=1})}
function drawSceneProps(){const time=Date.now()/1000;ctx.save();ctx.globalAlpha=.45;for(let i=0;i<7;i++){const x=(i*83+time*9)%(innerWidth+90)-45,y=innerHeight*.62+Math.sin(time+i)*18+i%3*34;ctx.fillStyle=i%2?'#193c29':'#245637';ctx.beginPath();ctx.ellipse(x,y,36,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9fda';ctx.fillRect(x-3,y-35,6,34);ctx.beginPath();ctx.arc(x,y-42,13,Math.PI,0);ctx.fill()}ctx.restore()}
function diamond(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x,y+h);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function drawParcel(gx,gy,cell,ghost=false){const pos=isoToScreen(gx,gy),x=pos.x,y=pos.y+cell.heightOffset,w=TILE_SIZE*2,h=TILE_SIZE,built=cell.state!=='empty_lot';diamond(x,y,w,h,built?'#5e3d22':'#276b46','#112b1e');ctx.save();ctx.globalAlpha=ghost?.35:1;diamond(x,y+5,w*.82,h*.72,built?'#254f2f':'#2d7d4e',null);ctx.fillStyle='#9cff75';for(let i=0;i<4;i++){ctx.fillRect(x-34+i*22,y+31+(i%2)*3,13,3)}if(built)drawKiosk(x,y,cell);else drawEmptyLot(x,y);ctx.restore()}
function drawEmptyLot(x,y){ctx.fillStyle='rgba(255,245,200,.2)';ctx.beginPath();ctx.ellipse(x,y+36,18,7,0,0,Math.PI*2);ctx.fill();ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('🪷',x,y+41)}
function drawKiosk(x,y,cell){const wallH=WALL_HEIGHT;ctx.fillStyle='#5d381c';ctx.beginPath();ctx.moveTo(x-TILE_SIZE,y+TILE_SIZE/2);ctx.lineTo(x,y);ctx.lineTo(x,y-wallH);ctx.lineTo(x-TILE_SIZE,y+TILE_SIZE/2-wallH);ctx.fill();ctx.strokeStyle='#26170d';ctx.stroke();ctx.fillStyle='#7f4f24';ctx.beginPath();ctx.moveTo(x+TILE_SIZE,y+TILE_SIZE/2);ctx.lineTo(x,y);ctx.lineTo(x,y-wallH);ctx.lineTo(x+TILE_SIZE,y+TILE_SIZE/2-wallH);ctx.fill();ctx.stroke();ctx.fillStyle='#9cff75';ctx.beginPath();ctx.moveTo(x-TILE_SIZE,y+TILE_SIZE/2-wallH);ctx.lineTo(x,y-wallH-16);ctx.lineTo(x+TILE_SIZE,y+TILE_SIZE/2-wallH);ctx.lineTo(x,y+TILE_SIZE/2-wallH+10);ctx.closePath();ctx.fill();ctx.strokeStyle='#153d24';ctx.stroke();ctx.fillStyle='#ffd34f';ctx.fillRect(x-20,y-wallH-5,40,12);ctx.fillStyle='#472b0b';ctx.font='10px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('$',x,y-wallH+5);ctx.fillStyle='#2f1d11';ctx.fillRect(x-15,y+5,30,32);ctx.fillStyle='#ff95d8';ctx.fillRect(x-28,y+9,12,16);ctx.fillStyle='#92fff0';ctx.fillRect(x+16,y+10,12,15);if(cell.state==='room_occupied'){drawWorker(x,y,cell);drawProgress(x,y,cell)}else if(cell.state==='room_ready'){drawMoneyBag(x,y)}else if(cell.state==='room_dirty'){drawDirty(x,y)}}
function drawWorker(x,y,cell){ctx.fillStyle='#fff5c8';ctx.beginPath();ctx.arc(x+6,y+20,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6bd35c';ctx.fillRect(x+2,y+25,10,13);ctx.fillStyle='rgba(146,255,240,.55)';ctx.beginPath();ctx.ellipse(x-3,y+26,9,5,-.5,0,Math.PI*2);ctx.ellipse(x+17,y+26,9,5,.5,0,Math.PI*2);ctx.fill()}function drawProgress(x,y,cell){const bw=48;ctx.fillStyle='rgba(14,26,19,.9)';ctx.fillRect(x-bw/2,y-WALL_HEIGHT-28,bw,7);ctx.fillStyle='#ffd34f';ctx.fillRect(x-bw/2+2,y-WALL_HEIGHT-26,(bw-4)*cell.scale,3);ctx.font='12px "Press Start 2P"';ctx.fillStyle='#fff5c8';ctx.textAlign='center';ctx.fillText('IDLE',x,y-WALL_HEIGHT-34)}function drawMoneyBag(x,y){const fy=y-WALL_HEIGHT-42+Math.sin(Date.now()/180)*5;ctx.shadowColor='#ffd34f';ctx.shadowBlur=22;ctx.fillStyle='#ffd34f';ctx.beginPath();ctx.ellipse(x,fy+7,16,18,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x-7,fy-12,14,8);ctx.shadowBlur=0;ctx.fillStyle='#472b0b';ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('$',x,fy+12)}function drawDirty(x,y){ctx.font='23px serif';ctx.textAlign='center';ctx.fillText('🫧',x,y-WALL_HEIGHT-25);ctx.fillStyle='#3b2a1c';ctx.beginPath();ctx.arc(x+12,y+22,9,0,Math.PI*2);ctx.fill()}
function handleInput(e){e.preventDefault();if(!started)return;const r=canvas.getBoundingClientRect(),iso=screenToIso(e.clientX-r.left,e.clientY-r.top);if(iso.x>=0&&iso.x<gameConfig.gridSize&&iso.y>=0&&iso.y<gameConfig.gridSize)interact(iso.x,iso.y)}
function showReaction(text){reaction.textContent='Moss Boss: '+text;reaction.classList.add('visible');clearTimeout(showReaction.t);showReaction.t=setTimeout(()=>reaction.classList.remove('visible'),1600)}
function interact(x,y){const cell=grid[x][y],pos=isoToScreen(x,y);let success=false,msg='';if(cell.state==='room_ready'){cell.state='room_dirty';money+=gameConfig.rentPrice;spawnParticles(pos.x,pos.y,'#ffd34f',14);addFloatingText(pos.x,pos.y-82,`+$${gameConfig.rentPrice}`,'#fff18a');audioManager.playSfx('sfx_collect');showReaction('rent bag secured fr fr.');cell.heightOffset=10;updateScore();return}if(currentTool==='build'){if(cell.state==='empty_lot'){if(money>=gameConfig.buildCost){money-=gameConfig.buildCost;cell.state='room_empty';spawnParticles(pos.x,pos.y,'#9cff75',12);addFloatingText(pos.x,pos.y-60,`-$${gameConfig.buildCost}`,'#ffec90');audioManager.playSfx('sfx_build');success=true;showReaction('new onion kiosk unlocked.')}else msg='Need more stacks!'}}else if(currentTool==='reception'){if(cell.state==='room_empty'){cell.state='room_occupied';cell.timer=0;cell.scale=0;spawnParticles(pos.x,pos.y,'#92fff0',8);addFloatingText(pos.x,pos.y-60,'Hired fairy','#bffff7');audioManager.playSfx('sfx_checkin');success=true;showReaction('idle brew started.')}else if(cell.state==='empty_lot')msg='Build first!'}else if(currentTool==='maid'){if(cell.state==='room_dirty'){cell.state='room_empty';spawnParticles(pos.x,pos.y,'#ffffff',10);addFloatingText(pos.x,pos.y-60,'Reset mud','#e9ffdf');audioManager.playSfx('sfx_clean');success=true;showReaction('clean swamp, clean profits.')}else msg='No mud yet!'}if(success){cell.heightOffset=8;updateScore()}else if(msg){addFloatingText(pos.x,pos.y-60,msg,'#ffb0b0');audioManager.playSfx('sfx_error');showReaction(msg.toLowerCase())}}
function spawnParticles(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y:y-20,z:20,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,vz:Math.random()*6+4,life:.95,color,size:Math.random()*6+4})}function addFloatingText(x,y,text,color){floatingTexts.push({x,y,text,life:.8,color})}
window.selectTool=tool=>{currentTool=tool;audioManager.playSfx('sfx_build',0);document.querySelectorAll('.tool-btn').forEach(b=>{b.classList.toggle('active',b.id===`tool-${tool}`)});const tips={build:'Tap empty lily parcels to build $300 onion kiosks.',reception:'Tap built kiosks to hire fairy shoppers and start the 5s idle brew.',maid:'Tap muddy kiosks after payout to reset them for the next bag.'};tipCard.textContent=tips[tool]||'Tap a parcel.'};document.addEventListener('DOMContentLoaded',init);
</script></body></html>
