<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Flag Signal Sprint</title>
    <!-- [agent-note][stage4] repaired: approved-font-remap | roles: title -> Bangers, ui -> Orbitron -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap">
    <style>
        :root {
            --bg-top: #07111f;
            --bg-mid: #102449;
            --bg-bottom: #1d1047;
            --panel: rgba(9, 18, 36, 0.76);
            --panel-strong: rgba(16, 26, 51, 0.92);
            --panel-soft: rgba(24, 40, 76, 0.7);
            --line: rgba(130, 192, 255, 0.22);
            --cyan: #7de7ff;
            --sky: #5bb8ff;
            --gold: #ffd36a;
            --rose: #ff6b8f;
            --emerald: #31d28c;
            --text: #eef7ff;
            --muted: rgba(220, 234, 255, 0.72);
            --shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
            --glow: 0 0 28px rgba(125, 231, 255, 0.24);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(93, 184, 255, 0.18), transparent 24%),
                radial-gradient(circle at 80% 18%, rgba(255, 107, 143, 0.16), transparent 22%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 52%, var(--bg-bottom));
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            touch-action: manipulation;
        }

        button {
            appearance: none;
            border: 0;
            font: inherit;
            color: inherit;
            background: none;
            padding: 0;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .bottom-0 { bottom: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-lg { max-width: 32rem; }
        .max-w-sm { max-width: 22rem; }
        .max-w-xs { max-width: 20rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .text-center { text-align: center; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: 1fr; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .safe-area-inset {
            padding-top: env(safe-area-inset-top, 0);
            padding-right: env(safe-area-inset-right, 0);
            padding-bottom: env(safe-area-inset-bottom, 0);
            padding-left: env(safe-area-inset-left, 0);
        }
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }

        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .pt-8 { padding-top: 2rem; }
        .pb-12 { padding-bottom: 3rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-8 { margin-top: 2rem; }
        .gap-1 { gap: 0.25rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }

        .rounded-full { border-radius: 999px; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-2xl { border-radius: 1.35rem; }
        .rounded-3xl { border-radius: 1.9rem; }

        .shadow-lg { box-shadow: var(--shadow); }
        .shadow-2xl { box-shadow: 0 24px 54px rgba(0, 0, 0, 0.5); }
        .drop-shadow-md { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.32)); }
        .drop-shadow-sm { filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.24)); }

        .text-xs { font-size: 0.78rem; }
        .text-sm { font-size: 0.92rem; }
        .text-lg { font-size: 1.1rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.8rem; }
        .text-3xl { font-size: 2rem; }
        .text-5xl { font-size: clamp(2rem, 8vw, 3.2rem); }
        .text-6xl { font-size: clamp(2.8rem, 14vw, 4.4rem); }
        .text-7xl { font-size: clamp(3.6rem, 18vw, 5rem); }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .uppercase { text-transform: uppercase; }
        .tracking-tight { letter-spacing: -0.03em; }
        .tracking-wide { letter-spacing: 0.08em; }
        .tracking-wider { letter-spacing: 0.13em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .leading-tight { line-height: 1.1; }

        .text-white { color: var(--text); }
        .text-white\/80 { color: rgba(238, 247, 255, 0.8); }
        .text-white\/90 { color: rgba(238, 247, 255, 0.9); }
        .text-white\/40 { color: rgba(238, 247, 255, 0.4); }
        .text-slate-400 { color: rgba(188, 205, 228, 0.82); }
        .text-slate-500 { color: rgba(158, 176, 202, 0.72); }
        .text-blue-200\/80 { color: rgba(173, 234, 255, 0.82); }
        .bg-white { background: #f4fbff; }
        .text-slate-900 { color: #0e1b2f; }
        .bg-black\/20 { background: rgba(0, 0, 0, 0.2); }
        .bg-black\/30 { background: rgba(0, 0, 0, 0.3); }
        .bg-slate-700\/50 { background: rgba(53, 80, 121, 0.5); }
        .bg-slate-800\/50 { background: rgba(15, 28, 52, 0.5); }
        .bg-slate-900 { background: linear-gradient(180deg, #081320, #101d38 60%, #120f33); }
        .bg-slate-900\/90 { background: rgba(7, 15, 28, 0.9); }
        .bg-slate-900\/95 { background: rgba(7, 15, 28, 0.95); }
        .hover\:bg-gray-100:hover { background: #e8f1f8; }

        .backdrop-blur-sm { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .backdrop-blur-md { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .backdrop-blur-xl { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }

        .border-2 { border-width: 2px; border-style: solid; }
        .border-l-4 { border-left: 4px solid var(--sky); }
        .border-t-4 { border-top: 4px solid var(--rose); }
        .border-purple-400\/30 { border-color: rgba(192, 132, 252, 0.3); }

        .group:hover .group-hover\:bg-black\/30 { background: rgba(0, 0, 0, 0.3); }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(23, 36, 68, 0.88), rgba(10, 18, 35, 0.82));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .btn-press {
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), filter 0.18s ease, box-shadow 0.18s ease;
        }

        .btn-press:active {
            transform: scale(0.965);
            filter: brightness(1.08);
        }

        .option-btn {
            min-height: 7.6rem;
            background:
                linear-gradient(180deg, rgba(34, 53, 95, 0.94), rgba(13, 24, 48, 0.96));
            border: 2px solid rgba(127, 231, 255, 0.16);
            color: var(--text);
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', system-ui, sans-serif;
            box-shadow: var(--shadow);
        }

        .option-btn::before,
        .mode-btn::before,
        .signal-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent 42%, transparent 58%, rgba(125,231,255,0.12));
            pointer-events: none;
        }

        .option-btn.correct {
            background: linear-gradient(180deg, #1f9f62, #0f7d4a) !important;
            border-color: #82f3b7 !important;
            box-shadow: 0 0 24px rgba(49, 210, 140, 0.44);
        }

        .option-btn.wrong {
            background: linear-gradient(180deg, #c53d60, #922043) !important;
            border-color: #ff9ab0 !important;
            box-shadow: 0 0 18px rgba(255, 107, 143, 0.34);
        }

        .mode-btn {
            position: relative;
            overflow: hidden;
            text-align: left;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .bg-emerald-500 { background: linear-gradient(180deg, #24bf82, #138f61); }
        .bg-emerald-500:hover,
        .hover\:bg-emerald-600:hover { background: linear-gradient(180deg, #2adf97, #119667); }

        .bg-blue-500 { background: linear-gradient(180deg, #3e9dff, #1767db); }
        .bg-blue-500:hover,
        .hover\:bg-blue-600:hover { background: linear-gradient(180deg, #58b8ff, #1a71ee); }

        .bg-rose-500 { background: linear-gradient(180deg, #ff698f, #d83663); }
        .bg-rose-500:hover,
        .hover\:bg-rose-600:hover { background: linear-gradient(180deg, #ff7fa1, #e33f6d); }

        .bg-purple-600 { background: linear-gradient(180deg, #9657ff, #6d29d8); }
        .bg-purple-600:hover,
        .hover\:bg-purple-700:hover { background: linear-gradient(180deg, #aa71ff, #7a36ea); }

        .signal-card {
            position: relative;
            border-radius: 1.6rem;
            background: linear-gradient(180deg, rgba(8, 19, 38, 0.72), rgba(8, 15, 31, 0.9));
            border: 1px solid rgba(125, 231, 255, 0.12);
            box-shadow: var(--shadow), var(--glow);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating { animation: float 4s ease-in-out infinite; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(91, 184, 255, 0.28); }
            50% { box-shadow: 0 0 26px rgba(125, 231, 255, 0.62); }
        }

        .glow-effect { animation: pulse-glow 2s infinite; }

        @keyframes beaconPulse {
            0%, 100% { opacity: 0.18; transform: scale(0.95); }
            50% { opacity: 0.46; transform: scale(1.04); }
        }

        .beacon-ring {
            position: absolute;
            inset: 50% auto auto 50%;
            width: 14rem;
            height: 14rem;
            margin-left: -7rem;
            margin-top: -8.5rem;
            border-radius: 999px;
            border: 1px solid rgba(125, 231, 255, 0.14);
            box-shadow: 0 0 32px rgba(125, 231, 255, 0.12);
            animation: beaconPulse 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .beacon-ring::after {
            content: "";
            position: absolute;
            inset: 1rem;
            border-radius: 999px;
            border: 1px dashed rgba(255, 211, 106, 0.26);
        }

        #hud {
            gap: 1rem;
        }

        #mode-display {
            font-family: 'Bangers', 'Orbitron', sans-serif;
            color: var(--cyan);
            letter-spacing: 0.14em;
        }

        #instruction-text {
            text-shadow: 0 0 14px rgba(125, 231, 255, 0.22);
        }

        #timer-bar {
            background: linear-gradient(90deg, var(--cyan), var(--sky));
            box-shadow: 0 0 16px rgba(125, 231, 255, 0.36);
            border-radius: 999px;
            height: 100%;
            width: 100%;
            transition: width 75ms linear, background 120ms ease;
        }

        #start-screen h1 {
            font-family: 'Bangers', 'Orbitron', sans-serif;
            text-shadow: 0 0 18px rgba(125, 231, 255, 0.28);
            letter-spacing: 0.06em;
        }

        #game-over-screen .glass-panel,
        #hud .glass-panel {
            border-color: rgba(125, 231, 255, 0.18);
        }

        #menu-btn {
            transition: transform 0.12s ease, box-shadow 0.16s ease, background-color 0.16s ease;
        }

        #menu-btn:active {
            transform: scale(0.96);
        }

        .animate-pulse {
            animation: pulseText 1.4s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        .feedback-gif {
            position: absolute;
            z-index: 25;
            width: min(36vw, 8rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.32);
            background: rgba(8, 15, 31, 0.55);
            opacity: 0;
            transform: translateY(0.5rem) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #celebration-gif {
            top: 5.8rem;
            right: 0.9rem;
        }

        #fail-gif {
            left: 0.9rem;
            bottom: 12.5rem;
        }

        @media (max-width: 640px) {
            .feedback-gif {
                width: min(31vw, 6.25rem);
            }

            #celebration-gif {
                top: 5.1rem;
                right: 0.7rem;
            }

            #fail-gif {
                left: 0.7rem;
                bottom: 11.4rem;
            }

            #hud {
                padding: 0.9rem;
                padding-top: 1.35rem;
            }

            #game-ui {
                padding: 1rem;
                padding-bottom: calc(1.3rem + env(safe-area-inset-bottom, 0px));
                gap: 0.85rem;
            }

            #start-screen,
            #game-over-screen {
                padding: 1rem;
            }

            .grid-cols-2 {
                gap: 0.75rem;
            }

            .option-btn {
                min-height: 6.7rem;
                padding-top: 1rem;
                padding-bottom: 1rem;
            }

            .text-lg { font-size: 1rem; }
            .text-2xl { font-size: 1.5rem; }
            .text-3xl { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full bg-slate-900">
        <canvas id="gameCanvas"></canvas>

        <div class="beacon-ring" aria-hidden="true"></div>

        <!-- [agent-note][stage3] resolved-gif: success/fail reactions -> catalogs/gifs.json compact corner overlays -->
        <img
            id="celebration-gif"
            class="feedback-gif"
            src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            alt="Celebration reaction"
            loading="lazy"
            decoding="async"
            aria-hidden="true"
        >
        <img
            id="fail-gif"
            class="feedback-gif"
            src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            alt="Fail reaction"
            loading="lazy"
            decoding="async"
            aria-hidden="true"
        >

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none safe-area-inset">
            <!-- HUD -->
            <div id="hud" class="absolute top-0 w-full p-4 pt-8 flex justify-between items-center hidden z-20">
                <div class="flex flex-col gap-1">
                    <div class="glass-panel px-4 py-1 rounded-full text-white/80 text-xs font-bold tracking-wider uppercase" id="mode-display">
                        MODE
                    </div>
                    <div class="glass-panel px-4 py-2 rounded-2xl text-white font-bold text-2xl drop-shadow-md border-l-4">
                        <span id="score">0</span>
                    </div>
                </div>
                <div class="flex gap-1 bg-black/20 p-2 rounded-full backdrop-blur-sm" id="lives-container">
                    <!-- Hearts injected by JS -->
                </div>
            </div>

            <!-- Main Game UI (Answer Buttons) -->
            <div id="game-ui" class="absolute bottom-0 w-full p-6 pb-12 flex flex-col gap-4 pointer-events-auto hidden z-20">
                <div class="signal-card p-4">
                    <div class="w-full" style="height: 0.55rem; background: rgba(34, 51, 82, 0.7); border-radius: 999px; overflow: hidden; margin-bottom: 0.7rem;">
                        <div id="timer-bar"></div>
                    </div>

                    <div class="text-center text-blue-200/80 text-sm font-semibold tracking-wide animate-pulse" id="instruction-text">Tap the correct answer</div>

                    <div class="grid grid-cols-2 gap-4 w-full max-w-lg mx-auto" style="margin-top: 0.95rem;">
                        <button id="btn-A" class="option-btn btn-press rounded-2xl py-8 text-lg font-bold shadow-lg flex flex-col items-center justify-center">
                            <span class="text-[10px] uppercase tracking-widest text-white/40 mb-1">Option A</span>
                            <span id="text-A" class="leading-tight px-2">Country A</span>
                        </button>
                        <button id="btn-B" class="option-btn btn-press rounded-2xl py-8 text-lg font-bold shadow-lg flex flex-col items-center justify-center">
                            <span class="text-[10px] uppercase tracking-widest text-white/40 mb-1">Option B</span>
                            <span id="text-B" class="leading-tight px-2">Country B</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Start Screen (Mode Selection) -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-auto z-50 bg-slate-900/90 backdrop-blur-md p-6">
                <div class="text-center mb-8 floating">
                    <div class="text-7xl mb-2" style="filter: drop-shadow(0 0 18px rgba(125, 231, 255, 0.24));">🚩</div>
                    <h1 class="text-5xl font-bold text-white mb-1 tracking-tight">FLAG SIGNAL</h1>
                    <p class="text-slate-400 text-lg font-medium">Decode the world at arcade speed</p>
                </div>

                <div class="w-full max-w-xs grid grid-cols-1 gap-3">
                    <button data-mode="easy" class="mode-btn btn-press bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-xl font-bold text-xl shadow-lg flex items-center justify-between group">
                        <span>Easy</span>
                        <span class="text-xs bg-black/20 px-2 py-1 rounded text-white/90 group-hover:bg-black/30">Scout Pace</span>
                    </button>

                    <button data-mode="medium" class="mode-btn btn-press bg-blue-500 hover:bg-blue-600 text-white p-4 rounded-xl font-bold text-xl shadow-lg flex items-center justify-between group glow-effect">
                        <span>Medium</span>
                        <span class="text-xs bg-black/20 px-2 py-1 rounded text-white/90 group-hover:bg-black/30">Field Pace</span>
                    </button>

                    <button data-mode="hard" class="mode-btn btn-press bg-rose-500 hover:bg-rose-600 text-white p-4 rounded-xl font-bold text-xl shadow-lg flex items-center justify-between group">
                        <span>Hard</span>
                        <span class="text-xs bg-black/20 px-2 py-1 rounded text-white/90 group-hover:bg-black/30">One Miss</span>
                    </button>

                    <button data-mode="territory" class="mode-btn btn-press bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-xl font-bold text-xl shadow-lg flex items-center justify-between group mt-2 border-2 border-purple-400/30">
                        <span>Territory</span>
                        <span class="text-xs bg-black/20 px-2 py-1 rounded text-white/90 group-hover:bg-black/30">Capital Callouts</span>
                    </button>
                </div>

                <div class="mt-8 text-slate-500 text-xs text-center">
                    Best run saved in this session
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-auto z-50 hidden bg-slate-900/95 backdrop-blur-xl p-8">
                <div class="glass-panel p-8 w-full max-w-sm rounded-3xl text-center border-t-4 shadow-2xl">
                    <h2 class="text-3xl font-bold text-white mb-2" style="font-family: 'Bangers', 'Orbitron', sans-serif; letter-spacing: 0.06em;">Signal Lost</h2>
                    <p class="text-slate-400 text-sm uppercase tracking-widest mb-6" id="end-mode-label">MEDIUM MODE</p>

                    <div class="bg-slate-800/50 rounded-2xl p-6 mb-8">
                        <div class="text-slate-400 text-xs mb-1">FLAGS CLEARED</div>
                        <div class="text-6xl font-bold text-white"><span id="finalScore">0</span></div>
                    </div>

                    <button id="menu-btn" class="w-full bg-white text-slate-900 font-bold py-4 px-8 rounded-xl shadow-lg hover:bg-gray-100 btn-press">
                        Back to Briefing
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                menu: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3"
            }
        };

        const MODES = {
            easy: { time: 20000, lives: 5, label: "Easy", type: "country" },
            medium: { time: 10000, lives: 3, label: "Medium", type: "country" },
            hard: { time: 5000, lives: 1, label: "Hard", type: "country" },
            territory: { time: 15000, lives: 3, label: "Territory", type: "capital" }
        };

        const COUNTRIES = [
            { name: "USA", flag: "🇺🇸", capital: "Washington D.C." },
            { name: "UK", flag: "🇬🇧", capital: "London" },
            { name: "Japan", flag: "🇯🇵", capital: "Tokyo" },
            { name: "Germany", flag: "🇩🇪", capital: "Berlin" },
            { name: "France", flag: "🇫🇷", capital: "Paris" },
            { name: "Italy", flag: "🇮🇹", capital: "Rome" },
            { name: "Spain", flag: "🇪🇸", capital: "Madrid" },
            { name: "Brazil", flag: "🇧🇷", capital: "Brasília" },
            { name: "Canada", flag: "🇨🇦", capital: "Ottawa" },
            { name: "Australia", flag: "🇦🇺", capital: "Canberra" },
            { name: "India", flag: "🇮🇳", capital: "New Delhi" },
            { name: "China", flag: "🇨🇳", capital: "Beijing" },
            { name: "S. Korea", flag: "🇰🇷", capital: "Seoul" },
            { name: "Mexico", flag: "🇲🇽", capital: "Mexico City" },
            { name: "Argentina", flag: "🇦🇷", capital: "Buenos Aires" },
            { name: "Russia", flag: "🇷🇺", capital: "Moscow" },
            { name: "Turkey", flag: "🇹🇷", capital: "Ankara" },
            { name: "Sweden", flag: "🇸🇪", capital: "Stockholm" },
            { name: "Norway", flag: "🇳🇴", capital: "Oslo" },
            { name: "Finland", flag: "🇫🇮", capital: "Helsinki" },
            { name: "Denmark", flag: "🇩🇰", capital: "Copenhagen" },
            { name: "Poland", flag: "🇵🇱", capital: "Warsaw" },
            { name: "Ukraine", flag: "🇺🇦", capital: "Kyiv" },
            { name: "Greece", flag: "🇬🇷", capital: "Athens" },
            { name: "Egypt", flag: "🇪🇬", capital: "Cairo" },
            { name: "S. Africa", flag: "🇿🇦", capital: "Pretoria" },
            { name: "Kenya", flag: "🇰🇪", capital: "Nairobi" },
            { name: "Thailand", flag: "🇹🇭", capital: "Bangkok" },
            { name: "Vietnam", flag: "🇻🇳", capital: "Hanoi" },
            { name: "Indonesia", flag: "🇮🇩", capital: "Jakarta" },
            { name: "New Zealand", flag: "🇳🇿", capital: "Wellington" },
            { name: "Ireland", flag: "🇮🇪", capital: "Dublin" },
            { name: "Portugal", flag: "🇵🇹", capital: "Lisbon" },
            { name: "Belgium", flag: "🇧🇪", capital: "Brussels" },
            { name: "Netherlands", flag: "🇳🇱", capital: "Amsterdam" },
            { name: "Switzerland", flag: "🇨🇭", capital: "Bern" },
            { name: "Austria", flag: "🇦🇹", capital: "Vienna" },
            { name: "Croatia", flag: "🇭🇷", capital: "Zagreb" },
            { name: "Serbia", flag: "🇷🇸", capital: "Belgrade" },
            { name: "Chile", flag: "🇨🇱", capital: "Santiago" },
            { name: "Colombia", flag: "🇨🇴", capital: "Bogotá" },
            { name: "Peru", flag: "🇵🇪", capital: "Lima" }
        ];

        class AudioController {
            constructor() {
                this.enabled = true;
                this.started = false;
                this.sfx = {};
                this.lastPlayedAt = {};
                this.channels = {
                    bgm: this.createTrack(ASSETS.bgm, 0.2, true),
                    stinger: this.createTrack(ASSETS.victoryLoop, 0.18, true)
                };

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const sound = new Audio(src);
                    sound.preload = 'auto';
                    this.sfx[key] = sound;
                }
            }

            createTrack(src, volume, loop = false) {
                const track = new Audio(src);
                track.preload = 'auto';
                track.loop = loop;
                track.volume = volume;
                return track;
            }

            unlock() {
                if (this.started || !this.enabled) return;
                this.started = true;
                Object.values(this.channels).forEach((track) => {
                    track.load();
                });
            }

            async playLoop(name) {
                if (!this.enabled || !this.started || !this.channels[name]) return;
                const active = this.channels[name];
                Object.entries(this.channels).forEach(([key, track]) => {
                    if (key !== name) {
                        track.pause();
                        track.currentTime = 0;
                    }
                });

                try {
                    await active.play();
                } catch (_) {}
            }

            stopLoop(name) {
                const track = this.channels[name];
                if (!track) return;
                track.pause();
                track.currentTime = 0;
            }

            stopAllLoops() {
                Object.keys(this.channels).forEach((name) => this.stopLoop(name));
            }

            playSFX(key, options = {}) {
                if (!this.enabled || !this.started || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = options.cooldown ?? 120;
                const lastPlayed = this.lastPlayedAt[key] ?? 0;
                if (now - lastPlayed < cooldown) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? 0.58;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let currentMode = 'medium';
        let score = 0;
        let lives = 3;
        let roundData = null;
        let particles = [];
        let timerMs = 0;
        let maxTimeMs = 10000;
        let lastTime = 0;
        let animationId;
        let warningTriggered = false;
        let gifTimeouts = {};

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.tint = Math.random() > 0.5 ? '125, 231, 255' : '255, 211, 106';
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.y = height + 10;
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }
            draw() {
                ctx.fillStyle = `rgba(${this.tint}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }

        function showReactionGif(id, duration = 1100) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('visible');
            clearTimeout(gifTimeouts[id]);
            gifTimeouts[id] = setTimeout(() => {
                el.classList.remove('visible');
            }, duration);
        }

        function hideReactionGifs() {
            ['celebration-gif', 'fail-gif'].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('visible');
                clearTimeout(gifTimeouts[id]);
            });
        }

        function initGame(modeKey) {
            currentMode = modeKey;
            const config = MODES[modeKey];

            score = 0;
            lives = config.lives;
            maxTimeMs = config.time;
            warningTriggered = false;

            document.getElementById('mode-display').innerText = config.label;
            document.getElementById('instruction-text').innerText =
                config.type === 'capital' ? "Tap the capital that matches the flag" : "Tap the country that matches the flag";

            updateLivesUI();
            updateScoreUI();
            initParticles();
            hideReactionGifs();
            audio.playLoop('bgm');
            nextRound();
        }

        function nextRound() {
            const speedUp = Math.min(score * 200, MODES[currentMode].time * 0.5);
            maxTimeMs = MODES[currentMode].time - speedUp;
            timerMs = maxTimeMs;
            warningTriggered = false;

            const correctIndex = Math.floor(Math.random() * COUNTRIES.length);
            const correctCountry = COUNTRIES[correctIndex];

            let wrongIndex;
            do {
                wrongIndex = Math.floor(Math.random() * COUNTRIES.length);
            } while (wrongIndex === correctIndex);
            const wrongCountry = COUNTRIES[wrongIndex];

            const isA = Math.random() > 0.5;
            roundData = {
                correct: correctCountry,
                wrong: wrongCountry,
                correctBtn: isA ? 'A' : 'B'
            };

            const btnA = document.getElementById('btn-A');
            const btnB = document.getElementById('btn-B');
            const txtA = document.getElementById('text-A');
            const txtB = document.getElementById('text-B');

            btnA.className = "option-btn btn-press rounded-2xl py-8 text-lg font-bold shadow-lg flex flex-col items-center justify-center";
            btnB.className = "option-btn btn-press rounded-2xl py-8 text-lg font-bold shadow-lg flex flex-col items-center justify-center";
            btnA.disabled = false;
            btnB.disabled = false;

            const useCapital = MODES[currentMode].type === 'capital';
            const valCorrect = useCapital ? correctCountry.capital : correctCountry.name;
            const valWrong = useCapital ? wrongCountry.capital : wrongCountry.name;

            if (isA) {
                txtA.innerText = valCorrect;
                txtB.innerText = valWrong;
            } else {
                txtA.innerText = valWrong;
                txtB.innerText = valCorrect;
            }
        }

        function handleAnswer(choice) {
            const btnA = document.getElementById('btn-A');
            const btnB = document.getElementById('btn-B');
            btnA.disabled = true;
            btnB.disabled = true;

            const isCorrect = choice === roundData.correctBtn;
            const selectedBtn = choice === 'A' ? btnA : btnB;
            const correctBtn = roundData.correctBtn === 'A' ? btnA : btnB;

            if (isCorrect) {
                audio.playSFX('score', { volume: 0.5, cooldown: 90 });
                audio.playSFX('bonus', { volume: 0.38, cooldown: 120 });
                selectedBtn.classList.add('correct');
                score++;
                updateScoreUI();
                createBurst(width / 2, height / 2);
                showReactionGif('celebration-gif', 950);
                setTimeout(nextRound, 600);
            } else {
                audio.playSFX('fail', { volume: 0.55, cooldown: 140 });
                selectedBtn.classList.add('wrong');
                correctBtn.classList.add('correct');
                lives--;
                updateLivesUI();
                showReactionGif('fail-gif', 1200);

                const canvasEl = document.getElementById('game-container');
                canvasEl.style.transform = "translate(5px, 0)";
                setTimeout(() => canvasEl.style.transform = "translate(-5px, 0)", 50);
                setTimeout(() => canvasEl.style.transform = "translate(5px, 0)", 100);
                setTimeout(() => canvasEl.style.transform = "translate(0, 0)", 150);

                if (lives <= 0) {
                    setTimeout(gameOver, 1000);
                } else {
                    setTimeout(nextRound, 1200);
                }
            }
        }

        function updateLivesUI() {
            const container = document.getElementById('lives-container');
            container.innerHTML = '';
            for (let i = 0; i < MODES[currentMode].lives; i++) {
                if (i < lives) {
                    const heart = document.createElement('span');
                    heart.innerText = '❤️';
                    heart.className = "text-xl drop-shadow-sm";
                    container.appendChild(heart);
                }
            }
            if (lives === 0) container.innerHTML = '<span class="text-xl">💀</span>';
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
        }

        function createBurst(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x,
                    y,
                    size: Math.random() * 4 + 1,
                    speedY: Math.random() * 1.4 + 0.8,
                    speedX: (Math.random() - 0.5) * 2,
                    alpha: 0.9,
                    tint: Math.random() > 0.5 ? '125, 231, 255' : '255, 211, 106',
                    life: 18,
                    update() {
                        this.x += this.speedX;
                        this.y -= this.speedY;
                        this.alpha *= 0.93;
                        this.life--;
                    },
                    draw() {
                        ctx.fillStyle = `rgba(${this.tint}, ${this.alpha})`;
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                    }
                });
            }
        }

        function drawGame(timestamp) {
            if (!gameActive) return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, width, height);

            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#07111f');
            gradient.addColorStop(0.55, '#102449');
            gradient.addColorStop(1, '#1d1047');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const glowGradient = ctx.createRadialGradient(width * 0.2, height * 0.2, 0, width * 0.2, height * 0.2, width * 0.35);
            glowGradient.addColorStop(0, 'rgba(93, 184, 255, 0.18)');
            glowGradient.addColorStop(1, 'rgba(93, 184, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(0, 0, width, height);

            particles = particles.filter(p => p.life === undefined || p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            if (lives > 0 && roundData) {
                timerMs -= dt;
                if (timerMs <= 0) {
                    timerMs = maxTimeMs;
                    lives--;
                    audio.playSFX('fail', { volume: 0.55, cooldown: 180 });
                    updateLivesUI();
                    showReactionGif('fail-gif', 1200);
                    if (lives <= 0) gameOver();
                    else nextRound();
                }

                const pct = Math.max(0, (timerMs / maxTimeMs) * 100);
                if (pct < 32 && !warningTriggered) {
                    warningTriggered = true;
                    audio.playSFX('warning', { volume: 0.42, cooldown: 400 });
                }
                const bar = document.getElementById('timer-bar');
                bar.style.width = `${pct}%`;
                bar.style.background = pct < 30
                    ? "linear-gradient(90deg, #ff7b98, #ff5151)"
                    : "linear-gradient(90deg, #7de7ff, #5bb8ff)";
            }

            if (roundData) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const fontSize = Math.min(width, height) * 0.45;
                const floatY = Math.sin(timestamp / 400) * 15;

                ctx.beginPath();
                ctx.arc(width / 2, height * 0.39, fontSize * 0.46, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(125, 231, 255, 0.06)';
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 211, 106, 0.16)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(width / 2, height * 0.39, fontSize * 0.52, 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = `${fontSize}px Arial`;
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 30;
                ctx.shadowOffsetY = 20;
                ctx.fillText(roundData.correct.flag, width / 2, (height * 0.4) + floatY);
                ctx.restore();
            }

            animationId = requestAnimationFrame(drawGame);
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            audio.stopAllLoops();
            audio.playSFX('gameOver', { volume: 0.62, cooldown: 600 });
            hideReactionGifs();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('end-mode-label').innerText = MODES[currentMode].label + " MODE";
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                const mode = target.getAttribute('data-mode');

                audio.unlock();
                audio.playSFX('start', { volume: 0.52, cooldown: 300 });
                audio.playSFX('ui', { volume: 0.32, cooldown: 120 });
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('hud').classList.remove('hidden');
                document.getElementById('game-ui').classList.remove('hidden');

                gameActive = true;
                lastTime = performance.now();
                initGame(mode);
                requestAnimationFrame(drawGame);
            });
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            audio.playSFX('menu', { volume: 0.4, cooldown: 200 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        document.getElementById('btn-A').addEventListener('click', () => {
            if (gameActive && !document.getElementById('btn-A').disabled) handleAnswer('A');
        });

        document.getElementById('btn-B').addEventListener('click', () => {
            if (gameActive && !document.getElementById('btn-B').disabled) handleAnswer('B');
        });

        document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });
    });
    </script>
