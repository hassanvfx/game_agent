<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Saturn Ring Shift</title>
<!-- [agent-note][stage4] repaired: catalog-font-remap | title-display -> Orbitron | ui/body -> Exo 2 | reason: keep approved sci-fi styling while removing flagged Rajdhani usage -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #06040f;
        --bg-deep: #120924;
        --glass-border: rgba(168, 247, 255, 0.24);
        --glass-bg: rgba(17, 15, 35, 0.62);
        --panel-shadow: rgba(14, 10, 32, 0.58);
        --accent: #8cf0ff;
        --accent-strong: #5ad8ff;
        --accent-soft: #d7fbff;
        --highlight: #ffd36d;
        --warning: #ff8fb5;
        --planet-core: #f6cb7d;
        --planet-shadow: #6d4f8c;
        --white: #ffffff;
        --muted: #b7c2da;
        --yellow-200: #fff0b0;
        --yellow-300: #ffe28f;
        --yellow-500: #f4bc4e;
        --yellow-600: #d18a2e;
        --amber-500: #ff8d42;
        --amber-600: #f7683c;
        --black: #000000;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(140, 240, 255, 0.12), transparent 28%),
            radial-gradient(circle at 20% 80%, rgba(255, 141, 66, 0.12), transparent 24%),
            linear-gradient(180deg, var(--bg-color), var(--bg-deep));
        font-family: 'Exo 2', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    button {
        font: inherit;
        border: 0;
        touch-action: manipulation;
    }

    h1, h2, h3, .hud-label, #score-display, #start-btn {
        font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .hidden { display: none !important; }
    .interactive { pointer-events: auto; cursor: pointer; }
    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .btn-press:active { transform: scale(0.92); transition: transform 0.1s; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .glass {
        background:
            linear-gradient(180deg, rgba(33, 28, 62, 0.88), rgba(12, 12, 29, 0.72)),
            var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        box-shadow:
            0 4px 30px rgba(0, 0, 0, 0.3),
            0 0 24px rgba(90, 216, 255, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    #game-container::before {
        background:
            radial-gradient(circle at 50% 40%, rgba(122, 94, 197, 0.18), transparent 18%),
            radial-gradient(circle at 18% 14%, rgba(140, 240, 255, 0.14), transparent 14%),
            radial-gradient(circle at 78% 16%, rgba(255, 211, 109, 0.12), transparent 12%);
    }

    #game-container::after {
        background-image:
            radial-gradient(circle, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.2px);
        background-size: 90px 90px;
        opacity: 0.2;
        animation: driftStars 22s linear infinite;
    }

    #ui-layer {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
    }

    .top-bar {
        padding: 2rem 1rem 1rem;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    @keyframes driftStars {
        from { transform: translateY(0); }
        to { transform: translateY(90px); }
    }

    #hud-stats {
        color: var(--white);
        border-radius: 1rem;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 80px;
        position: relative;
        overflow: hidden;
    }

    #hud-stats::after {
        content: "";
        position: absolute;
        inset: auto -20% -50% auto;
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, rgba(140, 240, 255, 0.35), transparent 70%);
        pointer-events: none;
    }

    .hud-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        opacity: 0.85;
        color: var(--accent-soft);
        text-shadow: 0 0 10px rgba(140, 240, 255, 0.28);
    }

    #score-display {
        font-size: 1.9rem;
        line-height: 1;
        font-weight: 700;
        color: var(--highlight);
        text-shadow: 0 0 18px rgba(255, 211, 109, 0.3);
    }

    #flux-btn {
        width: 3rem;
        height: 3rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-soft);
        background: transparent;
        box-shadow: 0 0 18px rgba(90, 216, 255, 0.1);
    }

    #start-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        background:
            radial-gradient(circle at center, rgba(58, 35, 104, 0.5), transparent 35%),
            rgba(5, 4, 15, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .intro-copy {
        margin-bottom: 2rem;
        max-width: 24rem;
        padding: 1.2rem 1.15rem;
        border-radius: 1.4rem;
        background: linear-gradient(180deg, rgba(17, 20, 43, 0.72), rgba(10, 10, 24, 0.38));
        border: 1px solid rgba(140, 240, 255, 0.2);
        box-shadow:
            0 20px 45px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .intro-title {
        margin: 0 0 0.5rem;
        color: var(--white);
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 0.92;
        font-weight: 700;
        letter-spacing: -0.04em;
        text-shadow:
            0 0 30px rgba(140, 240, 255, 0.3),
            0 0 48px rgba(122, 94, 197, 0.32);
    }

    .intro-title span {
        color: var(--accent);
    }

    .intro-text {
        margin: 1rem auto 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
        max-width: 20rem;
    }

    .intro-text strong {
        color: var(--accent-soft);
        font-weight: 700;
    }

    #start-btn {
        color: #09101a;
        font-weight: 700;
        padding: 1rem 2.75rem;
        border-radius: 999px;
        font-size: 1.05rem;
        letter-spacing: 0.08em;
        background: linear-gradient(90deg, var(--accent), var(--highlight));
        box-shadow:
            0 0 20px rgba(90, 216, 255, 0.38),
            0 10px 24px rgba(0, 0, 0, 0.3);
        transform: scale(1);
        transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }

    #start-btn:hover {
        filter: brightness(1.06);
        transform: scale(1.05);
        box-shadow:
            0 0 28px rgba(90, 216, 255, 0.52),
            0 12px 28px rgba(0, 0, 0, 0.34);
    }

    #start-btn:active {
        transform: scale(0.95);
    }

    .flux-active {
        background: var(--highlight) !important;
        color: var(--black) !important;
        box-shadow:
            0 0 20px rgba(255, 211, 109, 0.5),
            0 0 32px rgba(255, 143, 181, 0.28) !important;
    }

    @media (max-width: 640px) {
        .top-bar {
            padding-top: calc(env(safe-area-inset-top, 0px) + 1rem);
        }

        #hud-stats {
            min-width: 72px;
            padding: 0.65rem;
        }

        #score-display {
            font-size: 1.5rem;
        }

        #start-btn {
            width: min(84vw, 320px);
        }
    }
    #feedback-layer {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        overflow: hidden;
    }

    .feedback-gif {
        position: absolute;
        width: clamp(84px, 18vw, 132px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
        opacity: 0;
        transform: scale(0.85) translateY(10px);
        transition: opacity 0.22s ease, transform 0.22s ease;
        mix-blend-mode: screen;
    }

    .feedback-gif.visible {
        opacity: 0.88;
        transform: scale(1) translateY(0);
    }

    #pickup-gif {
        left: 1rem;
        bottom: max(5.5rem, env(safe-area-inset-bottom, 0px) + 4.5rem);
    }

    #message-gif {
        right: 1rem;
        top: max(6rem, env(safe-area-inset-top, 0px) + 5rem);
    }

    @media (max-width: 640px) {
        .feedback-gif {
            width: 84px;
        }

        #pickup-gif {
            left: 0.75rem;
            bottom: max(5rem, env(safe-area-inset-bottom, 0px) + 4.25rem);
        }

        #message-gif {
            right: 0.75rem;
            top: max(5.5rem, env(safe-area-inset-top, 0px) + 4.75rem);
        }
    }
</style>
</head>
<body>

<div id="game-container">
    <!-- [agent-note][stage3] resolved-gif: pickup-feedback + comms-alert -> catalogs/gifs.json -->
    <div id="feedback-layer" aria-hidden="true">
        <img id="pickup-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="">
        <img id="message-gif" class="feedback-gif" src="https://i.giphy.com/MFPZ483I4x41W.webp" alt="">
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div id="hud-stats" class="glass hidden">
                <div class="hud-label">Sync</div>
                <div id="score-display">0</div>
            </div>

            <button id="flux-btn" class="interactive glass hidden btn-press" aria-label="Toggle scan mode">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>
        </div>

        <div id="start-screen" class="interactive">
            <div class="intro-copy">

                <p class="intro-text">
                    Guide the <strong>ring warden</strong> through a calm orbital shift.<br>
                    Tap the ice cache to raise Sync.<br>
                    Tap the comms pad for messages and the monitor to cycle feeds.
                </p>
            </div>
            <button id="start-btn">
                BEGIN SHIFT
            </button>
        </div>
    </div>
</div>

<!-- [agent-note][stage3] resolved-audio: bgm/start/collect/message/flux from catalogs/audios.json -->
<audio id="bgm_chill" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
<audio id="sfx_notify" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
<audio id="sfx_flux" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<script>
/*
 * ------------------------------------------------------------------
 * AUDIO ENGINE
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    unlocked: false,
    sounds: {},
    lastPlayed: {},

    init() {
        this.sounds.bgm = document.getElementById('bgm_chill');
        this.sounds.start = document.getElementById('sfx_start');
        this.sounds.collect = document.getElementById('sfx_collect');
        this.sounds.notify = document.getElementById('sfx_notify');
        this.sounds.flux = document.getElementById('sfx_flux');

        const unlock = () => {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();

            this.sounds.bgm.volume = 0.2;
            this.unlocked = true;
            this.startLoop();

            window.removeEventListener('pointerdown', unlock);
            window.removeEventListener('touchstart', unlock);
        };

        window.addEventListener('pointerdown', unlock, { once: true });
        window.addEventListener('touchstart', unlock, { once: true });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.stopLoop();
            } else if (this.unlocked && Game.isPlaying) {
                this.startLoop();
            }
        });
    },

    startLoop() {
        const bgm = this.sounds.bgm;
        if (!bgm || !this.unlocked || !Game.isPlaying) return;
        bgm.currentTime = bgm.currentTime || 0;
        bgm.play().catch(() => {});
    },

    stopLoop() {
        const bgm = this.sounds.bgm;
        if (!bgm) return;
        bgm.pause();
    },

    play(key, volume = 0.45, cooldown = 90) {
        const sound = this.sounds[key];
        if (!this.unlocked || !sound) return;

        const now = performance.now();
        if (this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
        this.lastPlayed[key] = now;

        const s = sound.cloneNode();
        s.volume = volume;
        s.play().catch(() => {});
    }
};

/*
 * ------------------------------------------------------------------
 * GAME CONFIG & STATE
 * ------------------------------------------------------------------
 */
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    isPlaying: false,
    fluxMode: false,
    gifTimers: {},

    score: 0,

    particles: [],
    messages: [],

    moons: [
        { name: "Pan", r: 1.8, size: 3, speed: 3.5, angle: 0, color: "#d6d6d6", type: "shepherd" },
        { name: "Mimas", r: 2.4, size: 5, speed: 2.8, angle: 1, color: "#a8a8a8", type: "crater" },
        { name: "Enceladus", r: 3.0, size: 5, speed: 2.2, angle: 2.5, color: "#ffffff", type: "ice" },
        { name: "Tethys", r: 3.8, size: 6, speed: 1.8, angle: 4, color: "#e0e0e0", type: "round" },
        { name: "Dione", r: 4.6, size: 6, speed: 1.5, angle: 5.5, color: "#c9c9c9", type: "wispy" },
        { name: "Rhea", r: 5.5, size: 8, speed: 1.2, angle: 0.5, color: "#d4d4d4", type: "ringed" },
        { name: "Titan", r: 7.5, size: 14, speed: 0.8, angle: 3, color: "#e3a857", type: "haze" },
        { name: "Iapetus", r: 9.5, size: 7, speed: 0.5, angle: 2, color: "#555", type: "twotone" },
        { name: "Phoebe", r: 11.5, size: 4, speed: -0.3, angle: 6, color: "#333", type: "irregular" }
    ],

    zones: {
        tv: { x: 0, y: 0, w: 0, h: 0, hit: false },
        snack: { x: 0, y: 0, w: 0, h: 0, hit: false },
        phone: { x: 0, y: 0, w: 0, h: 0, hit: false }
    },

    tvChannel: 0,
    senders: ["Jupiter Relay", "Mars Desk", "Earth Ops", "NASA", "Cassini Ghost"],
    texts: [
        "Ring drift detected.",
        "Titan lane looks hazy.",
        "Refill the ice cache.",
        "Hexagon storm reading is rising.",
        "Status ping requested.",
        "Outer sectors say hello.",
        "Watch the debris band.",
        "A-ring spacing looks clean."
    ]
};

/*
 * ------------------------------------------------------------------
 * CORE FUNCTIONS
 * ------------------------------------------------------------------
 */

function init() {
    Game.canvas = document.getElementById('gameCanvas');
    Game.ctx = Game.canvas.getContext('2d', { alpha: false });

    resize();
    window.addEventListener('resize', resize);

    Game.canvas.addEventListener('pointerdown', handleInput, { passive: false });

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('flux-btn').addEventListener('click', toggleFlux);

    AudioSys.init();

    requestAnimationFrame(loop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    Game.width = window.innerWidth;
    Game.height = window.innerHeight;

    Game.canvas.width = Game.width * dpr;
    Game.canvas.height = Game.height * dpr;

    Game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Game.canvas.style.width = `${Game.width}px`;
    Game.canvas.style.height = `${Game.height}px`;
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud-stats').classList.remove('hidden');
    document.getElementById('hud-stats').classList.add('fade-in');
    document.getElementById('flux-btn').classList.remove('hidden');
    document.getElementById('flux-btn').classList.add('fade-in');

    Game.isPlaying = true;
    Game.score = 0;
    updateScore(0);
    AudioSys.startLoop();
    AudioSys.play('start', 0.42, 250);
}

function toggleFlux() {
    Game.fluxMode = !Game.fluxMode;
    const btn = document.getElementById('flux-btn');
    btn.classList.toggle('flux-active', Game.fluxMode);
    btn.classList.toggle('glass', !Game.fluxMode);
    AudioSys.play('flux', 0.3, 120);
}

function updateScore(amount) {
    Game.score += amount;
    document.getElementById('score-display').innerText = Game.score;
}

/*
 * ------------------------------------------------------------------
 * GAME LOGIC
 * ------------------------------------------------------------------
 */

function spawnParticle(x, y, color) {
    const count = Game.fluxMode ? 4 : 8;
    for (let i = 0; i < count; i++) {
        Game.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function showGif(id, duration = 1400) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(Game.gifTimers[id]);
    Game.gifTimers[id] = setTimeout(() => {
        el.classList.remove('visible');
    }, duration);
}

function spawnMessage() {
    const sender = Game.senders[Math.floor(Math.random() * Game.senders.length)];
    const text = Game.texts[Math.floor(Math.random() * Game.texts.length)];

    if (Game.messages.length > 2) Game.messages.shift();

    Game.messages.push({
        text: `${sender}: ${text}`,
        life: 3.5,
        x: Game.zones.phone.x + Game.zones.phone.w / 2,
        y: Game.zones.phone.y - 20,
        dy: 0
    });
    AudioSys.play('notify', 0.36, 180);
    showGif('message-gif', 1600);
}

function handleInput(e) {
    if (!Game.isPlaying) return;
    e.preventDefault();

    const rect = Game.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const z = Game.zones;

    if (hitTest(x, y, z.snack)) {
        z.snack.hit = true;
        updateScore(10);
        spawnParticle(x, y, '#e3c98d');
        AudioSys.play('collect', 0.5, 120);
        showGif('pickup-gif', 1200);
        setTimeout(() => z.snack.hit = false, 150);
    }

    if (hitTest(x, y, z.phone)) {
        z.phone.hit = true;
        spawnMessage();
        setTimeout(() => z.phone.hit = false, 150);
    }

    if (hitTest(x, y, z.tv)) {
        z.tv.hit = true;
        Game.tvChannel = (Game.tvChannel + 1) % 3;
        spawnParticle(x, y, '#00ffff');
        setTimeout(() => z.tv.hit = false, 150);
    }
}

function hitTest(x, y, zone) {
    return (x >= zone.x && x <= zone.x + zone.w && y >= zone.y && y <= zone.y + zone.h);
}

function update(dt) {
    if (!Game.isPlaying) return;

    Game.moons.forEach(m => {
        m.angle += dt * m.speed * 0.4;
    });

    for (let i = Game.particles.length - 1; i >= 0; i--) {
        let p = Game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 1.5;
        if (p.life <= 0) Game.particles.splice(i, 1);
    }

    for (let i = Game.messages.length - 1; i >= 0; i--) {
        let m = Game.messages[i];
        m.life -= dt;
        m.dy += dt * 30;
        if (m.life <= 0) Game.messages.splice(i, 1);
    }
}

/*
 * ------------------------------------------------------------------
 * RENDERING
 * ------------------------------------------------------------------
 */

function draw(dt) {
    const ctx = Game.ctx;
    const w = Game.width;
    const h = Game.height;

    if (Game.fluxMode) {
        ctx.fillStyle = '#050200';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#332a00';
        ctx.lineWidth = 1;
        const step = 40;
        const off = (Date.now() / 50) % step;
        for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = off; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    } else {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#070512');
        grad.addColorStop(0.52, '#160d28');
        grad.addColorStop(1, '#21162b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        const nebula = ctx.createRadialGradient(w * 0.5, h * 0.35, 20, w * 0.5, h * 0.35, h * 0.45);
        nebula.addColorStop(0, 'rgba(140, 240, 255, 0.12)');
        nebula.addColorStop(0.55, 'rgba(122, 94, 197, 0.16)');
        nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 60; i++) {
            const sx = (Math.sin(i * 123.4) * w + w) % w;
            const sy = (Math.cos(i * 456.7) * h + h) % h;
            const a = Math.abs(Math.sin(Date.now() * 0.001 + i));
            const r = 0.7 + (i % 3) * 0.45;
            ctx.globalAlpha = a * 0.7;
            ctx.fillStyle = i % 7 === 0 ? '#8cf0ff' : '#ffffff';
            ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    const cx = w / 2;
    const cy = h * 0.4;
    const saturnRadius = Math.min(w, h) * 0.09;

    Game.moons.forEach(m => {
        const orbitR = saturnRadius * m.r;
        ctx.beginPath();
        ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
        ctx.strokeStyle = Game.fluxMode ? 'rgba(255, 200, 0, 0.2)' : 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        if (Game.fluxMode) ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    });

    const ringInner = saturnRadius * 1.3;
    const ringOuter = saturnRadius * 2.3;
    const tilt = 0.3;

    ctx.save();
    ctx.translate(cx, cy);

    if (Game.fluxMode) {
        ctx.scale(1, tilt);
        ctx.beginPath(); ctx.arc(0, 0, ringOuter, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, ringInner, Math.PI, 0); ctx.stroke();
        ctx.scale(1, 1 / tilt);
    } else {
        ctx.scale(1, tilt);
        const ringColors = ['#ad9f82', '#8c7e63', '#5e523e'];
        const ringSteps = [2.3, 2.0, 1.6, 1.3];

        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, saturnRadius * ringSteps[i], Math.PI, 0);
            ctx.arc(0, 0, saturnRadius * ringSteps[i + 1], 0, Math.PI, true);
            ctx.fillStyle = ringColors[i];
            ctx.fill();
        }
        ctx.scale(1, 1 / tilt);
    }

    if (Game.fluxMode) {
        ctx.strokeStyle = '#ffdd00';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, saturnRadius, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, 0, saturnRadius, saturnRadius * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -saturnRadius); ctx.lineTo(0, saturnRadius); ctx.stroke();
    } else {
        const planetGrad = ctx.createRadialGradient(-saturnRadius * 0.35, -saturnRadius * 0.4, saturnRadius * 0.3, 0, 0, saturnRadius * 1.15);
        planetGrad.addColorStop(0, '#fff2bf');
        planetGrad.addColorStop(0.4, '#f6cb7d');
        planetGrad.addColorStop(1, '#b57bd6');
        ctx.beginPath(); ctx.arc(0, 0, saturnRadius, 0, Math.PI * 2);
        ctx.fillStyle = planetGrad;
        ctx.fill();

        ctx.save();
        ctx.clip();

        const bands = [
            { y: -0.72, h: 0.22, c: '#ffe7a9' },
            { y: -0.28, h: 0.12, c: '#f9c563' },
            { y: 0.02, h: 0.18, c: '#ffd8a2' },
            { y: 0.38, h: 0.24, c: '#9e77cf' }
        ];

        bands.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.fillRect(-saturnRadius, b.y * saturnRadius, saturnRadius * 2, b.h * saturnRadius);
        });

        const grad = ctx.createRadialGradient(-saturnRadius * 0.4, -saturnRadius * 0.4, saturnRadius * 0.35, 0, 0, saturnRadius * 1.2);
        grad.addColorStop(0, 'rgba(255,255,255,0.22)');
        grad.addColorStop(0.55, 'rgba(140,240,255,0.08)');
        grad.addColorStop(1, 'rgba(38,12,59,0.66)');
        ctx.fillStyle = grad;
        ctx.fillRect(-saturnRadius, -saturnRadius, saturnRadius * 2, saturnRadius * 2);

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-saturnRadius * 0.22, -saturnRadius * 0.1, saturnRadius * 0.18, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    if (Game.fluxMode) {
        ctx.scale(1, tilt);
        ctx.beginPath(); ctx.arc(0, 0, ringOuter, 0, Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, ringInner, 0, Math.PI); ctx.stroke();
        ctx.scale(1, 1 / tilt);
    } else {
        ctx.scale(1, tilt);
        const ringColors = ['#ad9f82', '#8c7e63', '#5e523e'];
        const ringSteps = [2.3, 2.0, 1.6, 1.3];

        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, saturnRadius * ringSteps[i], 0, Math.PI);
            ctx.arc(0, 0, saturnRadius * ringSteps[i + 1], Math.PI, 0, true);
            ctx.fillStyle = ringColors[i];
            ctx.fill();
        }
        ctx.scale(1, 1 / tilt);
    }

    ctx.restore();

    Game.moons.forEach(m => {
        const orbitR = saturnRadius * m.r;
        const mx = cx + Math.cos(m.angle) * orbitR;
        const my = cy + Math.sin(m.angle) * orbitR;

        ctx.save();
        ctx.translate(mx, my);

        if (Game.fluxMode) {
            ctx.fillStyle = '#000';
            ctx.strokeStyle = m.color;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, m.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.arc(0, 0, m.size, 0, Math.PI * 2); ctx.fill();

            if (m.type === 'ringed') {
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.ellipse(0, 0, m.size * 1.8, m.size * 0.5, -0.2, 0, Math.PI * 2);
                ctx.stroke();
            } else if (m.type === 'twotone') {
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(0, 0, m.size, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
            } else if (m.type === 'haze') {
                ctx.fillStyle = 'rgba(255, 160, 50, 0.4)';
                ctx.beginPath(); ctx.arc(0, 0, m.size * 1.3, 0, Math.PI * 2); ctx.fill();
            } else if (m.type === 'crater') {
                ctx.fillStyle = '#888';
                ctx.beginPath(); ctx.arc(-m.size * 0.3, -m.size * 0.3, m.size * 0.4, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.arc(0, 0, m.size, 1.5, 4.7); ctx.fill();
        }
        ctx.restore();
    });

    drawInteractiveItems(ctx, w, h);

    Game.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.font = "600 16px 'Exo 2', system-ui, sans-serif";
    ctx.textAlign = 'center';
    Game.messages.forEach(m => {
        ctx.globalAlpha = Math.min(1, m.life);
        const tw = ctx.measureText(m.text).width + 24;

        if (Game.fluxMode) {
            ctx.strokeStyle = '#00ff00';
            ctx.strokeRect(m.x - tw / 2, m.y - m.dy - 25, tw, 30);
            ctx.fillStyle = '#00ff00';
        } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(m.x - tw / 2, m.y - m.dy - 25, tw, 30, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(m.x, m.y - m.dy + 5);
            ctx.lineTo(m.x - 5, m.y - m.dy - 5);
            ctx.lineTo(m.x + 5, m.y - m.dy - 5);
            ctx.fill();

            ctx.fillStyle = '#000';
        }

        ctx.fillText(m.text, m.x, m.y - m.dy - 5);
    });
    ctx.globalAlpha = 1;
}

function drawInteractiveItems(ctx, w, h) {
    const floorH = h * 0.25;
    const baseY = h - floorH * 0.6;

    const tvW = w * 0.22;
    const tvH = tvW * 0.75;
    const tvX = w * 0.15;
    Game.zones.tv = { x: tvX, y: baseY - tvH / 2, w: tvW, h: tvH };

    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ff00ff';
        ctx.strokeRect(tvX, baseY - tvH / 2, tvW, tvH);
        ctx.fillStyle = '#ff00ff';
        ctx.fillText("SCAN", tvX + tvW / 2, baseY + 5);
    } else {
        const tvGrad = ctx.createLinearGradient(tvX, baseY - tvH / 2, tvX, baseY + tvH / 2);
        tvGrad.addColorStop(0, '#4b355d');
        tvGrad.addColorStop(1, '#1c1029');
        ctx.fillStyle = tvGrad;
        ctx.beginPath();
        ctx.roundRect(tvX, baseY - tvH / 2, tvW, tvH, 14);
        ctx.fill();

        if (Game.tvChannel === 0) {
            const screenGrad = ctx.createLinearGradient(tvX, baseY - tvH / 2, tvX + tvW, baseY + tvH / 2);
            screenGrad.addColorStop(0, '#71e4ff');
            screenGrad.addColorStop(1, '#342668');
            ctx.fillStyle = screenGrad;
        } else if (Game.tvChannel === 1) {
            ctx.fillStyle = `rgb(${120 + Math.random() * 135},${90 + Math.random() * 135},${150 + Math.random() * 105})`;
        } else {
            ctx.fillStyle = '#14091e';
        }
        ctx.beginPath();
        ctx.roundRect(tvX + 6, baseY - tvH / 2 + 6, tvW - 12, tvH - 12, 10);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(tvX + 12, baseY - tvH / 2 + 12, tvW * 0.18, tvH - 24);

        ctx.strokeStyle = '#a5adff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(tvX + tvW / 2, baseY - tvH / 2); ctx.lineTo(tvX + tvW / 2 - 10, baseY - tvH / 2 - 15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tvX + tvW / 2, baseY - tvH / 2); ctx.lineTo(tvX + tvW / 2 + 10, baseY - tvH / 2 - 15); ctx.stroke();
    }
    if (Game.zones.tv.hit) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(tvX, baseY - tvH / 2, tvW, tvH);
    }
    ctx.restore();

    const snkW = w * 0.18;
    const snkH = snkW;
    const snkX = w * 0.5 - snkW / 2;
    Game.zones.snack = { x: snkX, y: baseY - snkH / 2, w: snkW, h: snkH };

    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#ffff00';
        ctx.strokeRect(snkX, baseY - snkH / 2, snkW, snkH);
        ctx.fillStyle = '#ffff00';
        ctx.fillText("SYNC", snkX + snkW / 2, baseY + 5);
    } else {
        const crystalGrad = ctx.createLinearGradient(snkX, baseY - snkH / 2, snkX, baseY + snkH / 2);
        crystalGrad.addColorStop(0, '#f8ffff');
        crystalGrad.addColorStop(0.5, '#97ecff');
        crystalGrad.addColorStop(1, '#6284ff');
        ctx.fillStyle = '#36264f';
        ctx.beginPath();
        ctx.arc(snkX + snkW / 2, baseY, snkW / 2, 0, Math.PI, false);
        ctx.fill();
        ctx.fillStyle = crystalGrad;
        ctx.beginPath(); ctx.arc(snkX + snkW / 2, baseY - 5, snkW / 2 - 5, Math.PI, 0, false); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.arc(snkX + snkW / 2 - 5, baseY - 10, 5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.15;
        ctx.fillRect(snkX + snkW * 0.18, baseY - snkH * 0.38, snkW * 0.1, snkH * 0.2);
        ctx.globalAlpha = 1;
    }
    if (Game.zones.snack.hit) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#fff';
        ctx.fillRect(snkX, baseY - snkH / 2, snkW, snkH);
        ctx.globalAlpha = 1;
    }
    ctx.restore();

    const phW = w * 0.14;
    const phH = phW * 1.8;
    const phX = w * 0.85 - phW;
    Game.zones.phone = { x: phX, y: baseY - phH / 2, w: phW, h: phH };

    ctx.save();
    if (Game.fluxMode) {
        ctx.strokeStyle = '#00ff00';
        ctx.strokeRect(phX, baseY - phH / 2, phW, phH);
        ctx.fillStyle = '#00ff00';
        ctx.fillText("COMMS", phX + phW / 2, baseY + 5);
    } else {
        const shellGrad = ctx.createLinearGradient(phX, baseY - phH / 2, phX + phW, baseY + phH / 2);
        shellGrad.addColorStop(0, '#312349');
        shellGrad.addColorStop(1, '#0d0b19');
        ctx.fillStyle = shellGrad;
        ctx.beginPath(); ctx.roundRect(phX, baseY - phH / 2, phW, phH, 12); ctx.fill();
        ctx.fillStyle = Game.zones.phone.hit ? '#eefbff' : '#16233f';
        ctx.fillRect(phX + 5, baseY - phH / 2 + 8, phW - 10, phH - 18);
        ctx.fillStyle = '#8cf0ff';
        ctx.globalAlpha = 0.75;
        ctx.fillRect(phX + phW * 0.34, baseY + phH * 0.3, phW * 0.32, 3);
        ctx.globalAlpha = 1;
    }
    ctx.restore();
}

function loop(timestamp) {
    const dt = (timestamp - Game.lastTime) / 1000 || 0;
    Game.lastTime = timestamp;

    update(dt);
    draw(dt);

    requestAnimationFrame(loop);
}

window.onload = init;
</script>
</body>
