<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Ring Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --panel-bg: rgba(15, 24, 56, 0.74);
            --panel-border: rgba(125, 211, 252, 0.28);
            --panel-shadow: 0 14px 34px rgba(0, 10, 30, 0.46);
            --text-main: rgba(244, 249, 255, 0.97);
            --text-muted: rgba(207, 226, 255, 0.8);
            --accent-yellow: #facc15;
            --accent-blue-1: #2563eb;
            --accent-blue-2: #60a5fa;
            --accent-green-1: #22c55e;
            --accent-green-2: #34d399;
            --accent-red: #ef4444;
            --accent-cyan: #67e8f9;
            --accent-violet: #818cf8;
            --sky-top: #071126;
            --sky-mid: #173067;
            --sky-bottom: #7dd3fc;
            --ground-dark: #5b3416;
            --ground-mid: #8b5a2b;
            --cloud-glow: rgba(255, 255, 255, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Orbitron', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.18), transparent 36%),
                linear-gradient(180deg, var(--sky-top) 0%, #0b1735 28%, var(--sky-mid) 58%, var(--sky-bottom) 100%);
            background-color: #09101f;
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 24px; }
        .left-6 { left: 24px; }
        .right-6 { right: 24px; }
        .bottom-6 { bottom: 24px; }
        .hidden { display: none !important; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .gap-6 { gap: 24px; }
        .space-y-4 > * + * { margin-top: 16px; }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 35, 76, 0.88), rgba(12, 22, 48, 0.84));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px;
            max-width: min(92vw, 460px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .group:hover .hover-scale-card,
        .glass-panel:hover {
            transform: scale(1.03);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(140deg, rgba(103, 232, 249, 0.18), transparent 42%),
                radial-gradient(circle at 82% 18%, rgba(250, 204, 21, 0.16), transparent 24%);
            pointer-events: none;
        }

        .title-font {
            font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-shadow: 0 0 18px rgba(103, 232, 249, 0.4), 0 4px 0 rgba(10, 24, 56, 0.85);
        }

        .screen-title {
            margin: 0 0 10px;
            font-size: clamp(2.2rem, 7vw, 4rem);
            line-height: 1.05;
            color: #fde68a;
        }

        .screen-subtitle {
            margin: 0 0 28px;
            font-size: clamp(1rem, 2.8vw, 1.35rem);
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.04em;
        }

        .instruction-text {
            margin: 0;
            font-size: clamp(0.95rem, 2.6vw, 1.15rem);
            color: var(--text-main);
            line-height: 1.45;
        }

        .pulse {
            animation: pulse 1.6s ease-in-out infinite;
        }

        .primary-button,
        .secondary-button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 15px 34px;
            min-width: 220px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .primary-button {
            background: linear-gradient(90deg, #2563eb, #38bdf8);
        }

        .secondary-button {
            background: linear-gradient(90deg, #0f766e, #22c55e);
        }

        .primary-button:hover,
        .secondary-button:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.08);
        }

        .game-over-title {
            margin: 0 0 16px;
            font-size: clamp(2.3rem, 7vw, 3.2rem);
            color: var(--accent-red);
        }

        .results-line {
            margin: 0 0 8px;
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            color: var(--text-main);
            font-weight: 700;
        }

        .results-subline {
            margin: 0 0 18px;
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--text-muted);
        }

        .highlight-yellow {
            color: var(--accent-yellow);
        }

        .hud {
            font-family: 'Press Start 2P', 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.6rem, 1.7vw, 0.82rem);
            font-weight: 400;
            color: white;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .hud-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(10, 25, 58, 0.82), rgba(6, 17, 37, 0.88));
            border: 1px solid rgba(125, 211, 252, 0.25);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(8px);
        }

        .ring-icon {
            width: 24px;
            height: 24px;
            border: 4px solid var(--accent-yellow);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.42);
        }

        .hud-label {
            color: var(--text-muted);
            margin-right: 6px;
        }

        .hud-value {
            color: #fef3c7;
        }

        .feedback-overlay {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: min(30vw, 164px);
            min-width: 104px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.32);
            background: rgba(7, 17, 38, 0.7);
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            z-index: 3;
        }

        .feedback-overlay.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            display: block;
            width: 100%;
            height: auto;
        }

        .feedback-caption {
            padding: 8px 10px 10px;
            font-size: clamp(0.7rem, 1.8vw, 0.86rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e0f2fe;
            text-align: center;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.72));
        }

        .status-chip {
            position: absolute;
            right: 24px;
            top: 24px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(8, 16, 35, 0.72);
            border: 1px solid rgba(103, 232, 249, 0.24);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.24);
            font-size: clamp(0.72rem, 1.9vw, 0.9rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fef3c7;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .status-chip.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        @media (max-width: 640px) {
            .glass-panel {
                padding: 28px 22px;
                border-radius: 24px;
            }

            .primary-button,
            .secondary-button {
                width: 100%;
                min-width: 0;
            }

            .hud {
                font-size: 0.52rem;
            }

            .hud-pill {
                padding: 8px 12px;
                gap: 8px;
            }

            .ring-icon {
                width: 18px;
                height: 18px;
                border-width: 3px;
            }

            .feedback-overlay {
                right: 12px;
                bottom: 12px;
                width: min(34vw, 120px);
                min-width: 88px;
            }

            .feedback-caption {
                padding: 6px 6px 8px;
                font-size: 0.56rem;
            }

            .status-chip {
                right: 12px;
                top: 12px;
                padding: 8px 11px;
                font-size: 0.62rem;
                max-width: 42vw;
                text-align: center;
            }

            .top-6 { top: 16px; }
            .left-6 { left: 16px; }
            .right-6 { right: 16px; }
            .bottom-6 { bottom: 16px; }
            .gap-6 { gap: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            <div id="start-screen" class="glass-panel hover-scale-card text-center pointer-events-auto">
                <h1 class="screen-title title-font">SKY RING RUSH</h1>
                <h2 class="screen-subtitle">Jet through the neon skyline, dodge storm debris, and scoop every ring in sight.</h2>
                <div class="space-y-4">
                    <p class="instruction-text pulse">Tap, click, or press Space / Up to kick the courier drone skyward.</p>
                    <button id="start-btn" class="primary-button">Launch Run</button>
                </div>
                <!-- [agent-note][stage4] resolved-font: title=Press Start 2P | ui=Orbitron via catalog-backed font setup -->
                <!-- [agent-note][stage3] resolved-audio: bgm+jump+pickup+land+fail+ui clicks from catalogs/audios.json -->
            </div>

            <div id="game-over-screen" class="hidden glass-panel text-center pointer-events-auto">
                <h2 class="game-over-title title-font">RUN ENDED</h2>
                <p class="results-line">Rings Secured: <span id="finalScore" class="highlight-yellow">0</span></p>
                <p class="results-subline">Distance Covered: <span id="finalDistance">0</span>m</p>
                <button id="restart-btn" class="secondary-button">Relaunch</button>
            </div>

            <div id="hud" class="hud absolute top-6 left-6 flex gap-6 hidden">
                <div class="hud-pill">
                    <span class="ring-icon" aria-hidden="true"></span>
                    <span><span class="hud-label">Rings</span><span id="score" class="hud-value">0</span></span>
                </div>
                <div class="hud-pill">
                    <span><span class="hud-label">Distance</span><span id="distance" class="hud-value">0</span>m</span>
                </div>
            </div>

            <div id="status-chip" class="status-chip">Skyline synced</div>

            <div id="feedback-overlay" class="feedback-overlay" aria-live="polite">
                <img id="feedback-gif" alt="Game reaction overlay">
                <div id="feedback-caption" class="feedback-caption">Ring streak</div>
            </div>
            <!-- [agent-note][stage3] resolved-gif: collect reaction + fail reaction from catalogs/gifs.json as compact bottom-right overlays -->
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. CATALOG-BACKED MEDIA */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                ring: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            },
            gifs: {
                collect: {
                    src: "https://i.giphy.com/eSUNxzWS0fI9dnqoCv.webp",
                    label: "Ring streak"
                },
                fail: {
                    src: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp",
                    label: "Storm wipeout"
                }
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayed = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = key === 'fail' ? 0.6 : key === 'ring' ? 0.42 : 0.35;
                    this.sfx[key] = audio;
                }

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseBGM();
                    } else if (this.enabled && gameActive) {
                        this.playBGM();
                    }
                });
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }

            pauseBGM() {
                this.bgm.pause();
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { debounce = 0 } = {}) {
                if (!this.enabled || !this.sfx[key]) return;

                const now = performance.now();
                const lastTime = this.lastPlayed.get(key) ?? 0;
                if (debounce && now - lastTime < debounce) return;
                this.lastPlayed.set(key, now);

                const source = this.sfx[key];
                const instance = source.cloneNode();
                instance.volume = source.volume;
                instance.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreNode = document.getElementById('score');
        const distanceNode = document.getElementById('distance');
        const finalScoreNode = document.getElementById('finalScore');
        const finalDistanceNode = document.getElementById('finalDistance');
        const statusChip = document.getElementById('status-chip');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackCaption = document.getElementById('feedback-caption');

        let width, height;
        let gameActive = false;
        let frameCount = 0;
        let gameSpeed = 6;
        let score = 0;
        let distance = 0;
        let collectBurstTimer = 0;
        let collisionFlashTimer = 0;
        let statusTimeout = 0;
        let overlayTimeout = 0;

        let player = {
            x: 100,
            y: 0,
            radius: 20,
            dy: 0,
            jumpForce: -15,
            gravity: 0.8,
            grounded: false,
            wasGrounded: false,
            rotation: 0,
            color: '#3b82f6',
            trail: []
        };

        let obstacles = [];
        let rings = [];
        let clouds = [];
        let hills = [];

        function showStatus(text, duration = 950) {
            statusChip.textContent = text;
            statusChip.classList.add('active');
            window.clearTimeout(statusTimeout);
            statusTimeout = window.setTimeout(() => {
                statusChip.classList.remove('active');
            }, duration);
        }

        function showFeedback(type, duration = 1200) {
            const gif = ASSETS.gifs[type];
            if (!gif) return;
            feedbackGif.src = gif.src;
            feedbackGif.alt = gif.label;
            feedbackCaption.textContent = gif.label;
            feedbackOverlay.classList.add('active');
            window.clearTimeout(overlayTimeout);
            overlayTimeout = window.setTimeout(() => {
                feedbackOverlay.classList.remove('active');
            }, duration);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = Math.min(player.y || height - 150, height - 150);
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GENERATION LOGIC */
        function spawnCloud() {
            clouds.push({
                x: width + 100,
                y: Math.random() * (height / 2),
                w: 60 + Math.random() * 100,
                h: 30 + Math.random() * 40,
                speed: 1 + Math.random() * 1.5
            });
        }

        function spawnHill() {
            const h = 100 + Math.random() * 150;
            hills.push({
                x: width + 100,
                y: height - 100,
                r: h,
                color: Math.random() > 0.5 ? '#166534' : '#15803d'
            });
        }

        function spawnObstacle() {
            const type = Math.random() > 0.7 ? 'spike' : 'block';
            obstacles.push({
                x: width,
                y: height - 100,
                w: 40,
                h: 40,
                type,
                passed: false
            });
        }

        function spawnRings() {
            const patternY = height - 100 - (50 + Math.random() * 100);
            for (let i = 0; i < 3; i++) {
                rings.push({
                    x: width + (i * 50),
                    y: patternY,
                    r: 10,
                    collected: false,
                    offset: Math.random() * Math.PI
                });
            }
        }

        /** 5. GAME LOOP */
        function initGame() {
            score = 0;
            distance = 0;
            gameSpeed = 8;
            frameCount = 0;
            collectBurstTimer = 0;
            collisionFlashTimer = 0;

            player.y = height - 150;
            player.dy = 0;
            player.rotation = 0;
            player.trail = [];
            player.grounded = false;
            player.wasGrounded = false;

            obstacles = [];
            rings = [];
            clouds = [];
            hills = [];

            scoreNode.innerText = score;
            distanceNode.innerText = distance;

            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    w: 60 + Math.random() * 100,
                    h: 30 + Math.random() * 40,
                    speed: 1 + Math.random() * 1.5
                });
            }

            for (let i = 0; i < 3; i++) {
                hills.push({
                    x: (i * (width / 3)),
                    y: height - 100,
                    r: 150,
                    color: '#166534'
                });
            }
        }

        function update() {
            gameSpeed += 0.002;
            distance += Math.floor(gameSpeed / 5);
            frameCount++;
            if (collectBurstTimer > 0) collectBurstTimer--;
            if (collisionFlashTimer > 0) collisionFlashTimer--;

            player.wasGrounded = player.grounded;
            player.dy += player.gravity;
            player.y += player.dy;

            const groundLevel = height - 100 - player.radius;
            if (player.y > groundLevel) {
                player.y = groundLevel;
                player.dy = 0;
                player.grounded = true;
                player.rotation = Math.round(player.rotation / (Math.PI * 2)) * Math.PI * 2;
                if (!player.wasGrounded) {
                    audio.playSFX('land', { debounce: 140 });
                }
            } else {
                player.grounded = false;
                player.rotation += 0.3;
            }

            if (frameCount % 3 === 0) {
                player.trail.push({ x: player.x, y: player.y, alpha: 0.8 });
            }
            player.trail.forEach(t => {
                t.x -= gameSpeed;
                t.alpha -= 0.1;
            });
            player.trail = player.trail.filter(t => t.alpha > 0);

            if (frameCount % 120 === 0 && Math.random() > 0.3) spawnCloud();
            if (frameCount % 150 === 0) spawnHill();

            if (frameCount % Math.max(60, Math.floor(1500 / gameSpeed)) === 0) {
                if (Math.random() > 0.3) spawnObstacle();
                else spawnRings();
            }

            clouds.forEach(c => c.x -= c.speed);
            hills.forEach(h => h.x -= gameSpeed * 0.5);
            obstacles.forEach(o => o.x -= gameSpeed);
            rings.forEach(r => {
                r.x -= gameSpeed;
                r.offset += 0.1;
            });

            clouds = clouds.filter(c => c.x + c.w > -100);
            hills = hills.filter(h => h.x + h.r > -100);
            obstacles = obstacles.filter(o => o.x > -100);
            rings = rings.filter(r => r.x > -100);

            for (const o of obstacles) {
                if (
                    player.x + player.radius > o.x &&
                    player.x - player.radius < o.x + o.w &&
                    player.y + player.radius > o.y - o.h &&
                    player.y - player.radius < o.y
                ) {
                    if (o.type === 'spike') {
                        const dx = player.x - (o.x + o.w / 2);
                        const dy = player.y - (o.y - o.h / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < player.radius + 15) {
                            collisionFlashTimer = 18;
                            gameOver();
                            return;
                        }
                    } else {
                        collisionFlashTimer = 18;
                        gameOver();
                        return;
                    }
                }
            }

            for (const r of rings) {
                if (r.collected) continue;
                const dx = player.x - r.x;
                const dy = player.y - r.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < player.radius + r.r) {
                    r.collected = true;
                    score++;
                    collectBurstTimer = 16;
                    audio.playSFX('ring', { debounce: 75 });
                    scoreNode.innerText = score;
                    if (score % 3 === 0) {
                        showFeedback('collect', 900);
                        showStatus('Ring streak');
                    }
                }
            }

            distanceNode.innerText = distance;
        }

        function draw() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#071126');
            grad.addColorStop(0.4, '#173067');
            grad.addColorStop(1, '#7dd3fc');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.78, height * 0.18, 20, width * 0.78, height * 0.18, width * 0.4);
            glow.addColorStop(0, 'rgba(250, 204, 21, 0.55)');
            glow.addColorStop(0.45, 'rgba(96, 165, 250, 0.16)');
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 28; i++) {
                const starX = ((i * 127) + frameCount * 0.25) % (width + 40) - 20;
                const starY = (i * 53) % Math.max(height * 0.55, 1);
                const twinkle = 0.25 + ((Math.sin(frameCount * 0.05 + i) + 1) * 0.18);
                ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
                ctx.fillRect(starX, starY, 2, 2);
            }

            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
                ctx.beginPath();
                ctx.ellipse(c.x + 10, c.y + 4, c.w, c.h, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            hills.forEach(h => {
                const hillGradient = ctx.createLinearGradient(h.x, h.y - h.r * 0.7, h.x, h.y + 120);
                hillGradient.addColorStop(0, 'rgba(30, 64, 175, 0.9)');
                hillGradient.addColorStop(1, h.color);
                ctx.fillStyle = hillGradient;
                ctx.beginPath();
                ctx.arc(h.x, h.y + 100, h.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(103, 232, 249, 0.08)';
                ctx.beginPath();
                ctx.arc(h.x - h.r * 0.18, h.y + 80, h.r * 0.55, 0, Math.PI * 2);
                ctx.fill();
            });

            const groundY = height - 100;
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
            groundGrad.addColorStop(0, '#8b5a2b');
            groundGrad.addColorStop(1, '#5b3416');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, width, 100);

            const tileSize = 40;
            const offset = (frameCount * gameSpeed) % (tileSize * 2);

            ctx.fillStyle = '#34d399';
            ctx.fillRect(0, groundY, width, 20);

            for (let x = -offset; x < width; x += tileSize) {
                if (Math.floor((x + offset) / tileSize) % 2 === 0) {
                    ctx.fillStyle = '#0f766e';
                    ctx.fillRect(x, groundY, tileSize, 20);
                }
            }

            for (let x = -offset * 0.8; x < width + 40; x += 70) {
                ctx.strokeStyle = 'rgba(125, 211, 252, 0.18)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, groundY + 12);
                ctx.lineTo(x + 24, groundY + 32);
                ctx.stroke();
            }

            obstacles.forEach(o => {
                if (o.type === 'spike') {
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.moveTo(o.x, groundY);
                    ctx.lineTo(o.x + o.w / 2, groundY - o.h);
                    ctx.lineTo(o.x + o.w, groundY);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(254, 242, 242, 0.55)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(o.x + 6, groundY - 2);
                    ctx.lineTo(o.x + o.w / 2, groundY - o.h + 6);
                    ctx.lineTo(o.x + o.w - 6, groundY - 2);
                    ctx.stroke();
                } else {
                    const blockGradient = ctx.createLinearGradient(o.x, groundY - o.h, o.x, groundY);
                    blockGradient.addColorStop(0, '#64748b');
                    blockGradient.addColorStop(1, '#1e293b');
                    ctx.fillStyle = blockGradient;
                    ctx.fillRect(o.x, groundY - o.h, o.w, o.h);

                    ctx.strokeStyle = 'rgba(103, 232, 249, 0.35)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(o.x + 3, groundY - o.h + 3, o.w - 6, o.h - 6);
                }
            });

            rings.forEach(r => {
                if (r.collected) return;
                const pulse = 1 + Math.sin(r.offset * 2) * 0.14;

                ctx.strokeStyle = `rgba(250, 204, 21, ${collectBurstTimer > 0 ? 0.5 : 0.3})`;
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r * pulse, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#fff7ed';
                ctx.beginPath();
                ctx.arc(r.x - 3, r.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            player.trail.forEach(t => {
                ctx.fillStyle = `rgba(56, 189, 248, ${t.alpha * 0.65})`;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.radius * 0.9, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);

            const playerGlow = ctx.createRadialGradient(-4, -4, 6, 0, 0, player.radius + 10);
            playerGlow.addColorStop(0, 'rgba(255,255,255,0.95)');
            playerGlow.addColorStop(0.45, collectBurstTimer > 0 ? '#fde047' : '#67e8f9');
            playerGlow.addColorStop(1, collisionFlashTimer > 0 ? '#ef4444' : '#2563eb');
            ctx.fillStyle = playerGlow;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius - 5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
            ctx.beginPath();
            ctx.arc(-5, 6, player.radius * 0.7, 0, Math.PI * 2);
            ctx.fill();

            if (player.grounded) {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(8, -5, 8, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(10, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(2, 6, 7, 0.15, Math.PI - 0.15);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath();
                ctx.arc(-4, -8, 4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                for (let i = 0; i < 4; i++) {
                    ctx.rotate(Math.PI / 2);
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(10, -5);
                    ctx.lineTo(27, 0);
                    ctx.lineTo(10, 5);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(250, 204, 21, 0.95)';
                ctx.beginPath();
                ctx.moveTo(-18, 0);
                ctx.lineTo(-32, -6);
                ctx.lineTo(-32, 6);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            if (collisionFlashTimer > 0) {
                ctx.fillStyle = `rgba(239, 68, 68, ${collisionFlashTimer / 40})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, width, height);

            update();
            draw();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedback('fail', 1600);
            showStatus('Run wiped', 1400);

            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');

            finalScoreNode.innerText = score;
            finalDistanceNode.innerText = distance;

            let deathY = player.y;
            let deathDy = -10;
            function deathAnim() {
                if (gameActive) return;
                ctx.clearRect(0, 0, width, height);
                draw();

                deathDy += 0.5;
                deathY += deathDy;

                ctx.save();
                ctx.translate(player.x, deathY);
                ctx.fillStyle = '#60a5fa';
                ctx.beginPath();
                ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (deathY < height + 50) requestAnimationFrame(deathAnim);
            }
            deathAnim();
        }

        /** 6. CONTROLS */
        function jump() {
            if (!gameActive) return;
            if (player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                audio.playSFX('jump', { debounce: 100 });
                showStatus('Boost');
            }
        }

        function startRun() {
            audio.unlock();
            audio.playSFX('ui');
            audio.playSFX('start');
            audio.playBGM();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            feedbackOverlay.classList.remove('active');
            showStatus('Skyline synced');
            gameActive = true;
            initGame();
            gameLoop();
        }

        startBtn.addEventListener('click', startRun);

        restartBtn.addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui');
            startRun();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (!gameActive && !startScreen.classList.contains('hidden')) {
                    startRun();
                } else {
                    jump();
                }
            }
        });

        // [agent-note][stage4] repaired: mobile-tap-actionability | scope: gameplay touch suppression only on canvas to preserve CTA taps
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        window.addEventListener('mousedown', () => {
            if (!gameActive && !startScreen.classList.contains('hidden')) {
                startRun();
                return;
            }
            jump();
        });
    });
    </script>
</body>
