<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover" />
  <title>Neon Loop Rush</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    :root {
      --night: #07051b;
      --deep: #111044;
      --blue: #1c6bff;
      --cyan: #39f8ff;
      --yellow: #ffd72e;
      --pink: #ff3cf2;
      --red: #ff364f;
      --green: #39ff94;
      --panel: rgba(7, 9, 32, .78);
      --stroke: rgba(57, 248, 255, .36);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 0%, rgba(57,248,255,.18), transparent 36%), linear-gradient(180deg, #07051b, #130b46 58%, #33105a);
      color: #fff;
      font-family: Orbitron, system-ui, sans-serif;
      touch-action: manipulation;
    }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    .panel {
      width: min(92vw, 460px);
      border: 1px solid var(--stroke);
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(11,17,58,.92), rgba(11,8,36,.82));
      box-shadow: 0 24px 60px rgba(0,0,0,.46), inset 0 0 34px rgba(57,248,255,.11);
      text-align: center;
      padding: clamp(24px, 7vw, 42px) clamp(18px, 6vw, 36px);
      pointer-events: auto;
      position: relative;
      overflow: hidden;
    }
    .panel:before {
      content: ""; position: absolute; inset: -2px;
      background: repeating-linear-gradient(135deg, transparent 0 16px, rgba(255,60,242,.09) 17px 20px), radial-gradient(circle at 82% 18%, rgba(255,215,46,.22), transparent 26%);
      pointer-events: none;
    }
    .panel > * { position: relative; z-index: 1; }
    .title {
      font-family: 'Press Start 2P', Orbitron, sans-serif;
      font-size: clamp(2rem, 8vw, 3.55rem);
      line-height: 1.06; margin: 0 0 14px;
      color: var(--yellow);
      text-shadow: 0 4px 0 #0d195c, 0 0 22px rgba(255,215,46,.5), 0 0 38px rgba(57,248,255,.38);
      letter-spacing: .04em;
    }
    .subtitle { margin: 0 0 22px; color: rgba(238,249,255,.94); font-weight: 700; font-size: clamp(.94rem, 3.4vw, 1.15rem); line-height: 1.45; }
    .hint { margin: 0 0 24px; color: rgba(196,245,255,.88); line-height: 1.55; font-size: clamp(.86rem, 3.1vw, 1rem); }
    button {
      width: min(100%, 300px); min-height: 52px; border: 0; border-radius: 999px;
      background: linear-gradient(90deg, #1c6bff, #39f8ff 52%, #ff3cf2);
      color: #060720; font: 700 .95rem Orbitron, system-ui, sans-serif;
      letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 14px 28px rgba(0,0,0,.34), 0 0 22px rgba(57,248,255,.34);
      cursor: pointer;
    }
    .hidden { display: none !important; }
    .hud {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; pointer-events: none;
      font-family: 'Press Start 2P', Orbitron, sans-serif; font-size: clamp(.52rem, 2.4vw, .72rem); text-transform: uppercase;
    }
    .pill {
      min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 8px; border-radius: 999px; background: rgba(4,8,28,.76); border: 1px solid rgba(57,248,255,.3);
      box-shadow: inset 0 0 18px rgba(57,248,255,.12), 0 8px 18px rgba(0,0,0,.28); text-shadow: 0 2px 6px #000;
    }
    .ringIcon { width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--yellow); box-shadow: 0 0 12px var(--yellow); display:inline-block; }
    .label { color: rgba(187,236,255,.76); margin-right: 4px; }
    .value { color: #fff4a6; }
    #status {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 18px);
      background: rgba(7,9,32,.78); border: 1px solid rgba(255,60,242,.38); border-radius: 999px; padding: 10px 16px;
      color: #e8fbff; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: 0; transition: .18s ease; pointer-events: none;
      box-shadow: 0 0 18px rgba(255,60,242,.22); font-size: clamp(.7rem, 2.8vw, .9rem);
    }
    #status.active { opacity: 1; transform: translate(-50%, 0); }
    #burst {
      position: fixed; right: 12px; bottom: max(70px, calc(env(safe-area-inset-bottom) + 70px)); width: min(31vw, 128px); aspect-ratio: 1;
      border-radius: 24px; border: 1px solid rgba(255,215,46,.36); background: rgba(6,8,28,.72); display: grid; place-items: center;
      opacity: 0; transform: translateY(12px) scale(.9); transition: .2s ease; pointer-events: none; overflow: hidden;
    }
    #burst.active { opacity: 1; transform: translateY(0) scale(1); }
    #burst .ring-big { width: 58%; height: 58%; border: 10px solid var(--yellow); border-radius: 50%; box-shadow: 0 0 22px var(--yellow), inset 0 0 10px rgba(255,255,255,.5); animation: spin .7s linear infinite; }
    #burst.fail .ring-big { border-color: var(--red); box-shadow: 0 0 22px var(--red); border-radius: 24%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-aspect-ratio: 1/1) { .hud { max-width: 520px; margin: 0 auto; } .panel { transform: scale(.94); } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Neon Loop Rush endless runner canvas"></canvas>
  <div id="hud" class="hud hidden">
    <div class="pill"><span class="ringIcon"></span><span><span class="label">Rings</span><span id="score" class="value">0</span></span></div>
    <div class="pill"><span><span class="label">Meters</span><span id="distance" class="value">0</span>m</span></div>
  </div>
  <div class="ui">
    <section id="start" class="panel">
      <h1 class="title">NEON<br>LOOP RUSH</h1>
      <p class="subtitle">A blue speed rebel tears through a vertical arcade loopway, grabbing rings before the breaker grid bites.</p>
      <p class="hint">Tap, click, Space, or ↑ to launch. Jump only when your shoes touch the checker rail.</p>
      <button id="startBtn">Start Speed Run</button>
    </section>
    <section id="over" class="panel hidden">
      <h2 class="title">RUN<br>WIPED</h2>
      <p class="subtitle">Rings Banked: <span id="finalScore" class="value">0</span><br>Distance Burned: <span id="finalDistance" class="value">0</span>m</p>
      <button id="restartBtn">Retry Loop</button>
    </section>
  </div>
  <div id="status">Loop synced</div>
  <div id="burst" aria-live="polite"><div class="ring-big"></div></div>
  <script>
  (() => {
    'use strict';
    const ASSETS = {
      bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
      sfx: {
        jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3',
        land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
        ring: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
        fail: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
        ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'
      }
    };
    class AudioController {
      constructor(){
        this.enabled=false; this.last=new Map(); this.sfx={};
        this.bgm=new Audio(ASSETS.bgm); this.bgm.loop=true; this.bgm.volume=.18; this.bgm.preload='auto';
        Object.entries(ASSETS.sfx).forEach(([k,src])=>{ const a=new Audio(src); a.preload='auto'; a.volume=k==='fail'?.58:k==='ring'?.42:.34; this.sfx[k]=a; });
        document.addEventListener('visibilitychange',()=>{ if(document.hidden) this.pauseBGM(); else if(this.enabled&&gameActive) this.playBGM(); });
      }
      unlock(){ this.enabled=true; }
      playBGM(){ if(this.enabled) this.bgm.play().catch(()=>{}); }
      pauseBGM(){ this.bgm.pause(); }
      stopBGM(){ this.bgm.pause(); this.bgm.currentTime=0; }
      playSFX(k,{debounce=0}={}){ if(!this.enabled||!this.sfx[k]) return; const now=performance.now(); if(debounce && now-(this.last.get(k)||0)<debounce) return; this.last.set(k,now); const i=this.sfx[k].cloneNode(); i.volume=this.sfx[k].volume; i.play().catch(()=>{}); }
    }
    const audio = new AudioController();
    const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
    const start=document.getElementById('start'), over=document.getElementById('over'), hud=document.getElementById('hud');
    const startBtn=document.getElementById('startBtn'), restartBtn=document.getElementById('restartBtn');
    const scoreNode=document.getElementById('score'), distanceNode=document.getElementById('distance'), finalScoreNode=document.getElementById('finalScore'), finalDistanceNode=document.getElementById('finalDistance');
    const status=document.getElementById('status'), burst=document.getElementById('burst');
    let width=0, height=0, gameActive=false, frameCount=0, gameSpeed=6, score=0, distance=0, collectBurstTimer=0, collisionFlashTimer=0, statusTimeout=0, burstTimeout=0;
    const player={ x:100, y:0, radius:20, dy:0, jumpForce:-15, gravity:.8, grounded:false, wasGrounded:false, rotation:0, trail:[] };
    let obstacles=[], rings=[], clouds=[], hills=[], loopArcs=[];
    function resize(){ width=innerWidth; height=innerHeight; canvas.width=width*devicePixelRatio; canvas.height=height*devicePixelRatio; canvas.style.width=width+'px'; canvas.style.height=height+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); player.y=Math.min(player.y||height-150,height-150); }
    addEventListener('resize',resize); resize();
    function showStatus(text,duration=950){ status.textContent=text; status.classList.add('active'); clearTimeout(statusTimeout); statusTimeout=setTimeout(()=>status.classList.remove('active'),duration); }
    function showBurst(type,duration=900){ burst.classList.toggle('fail',type==='fail'); burst.classList.add('active'); clearTimeout(burstTimeout); burstTimeout=setTimeout(()=>burst.classList.remove('active'),duration); }
    function spawnCloud(){ clouds.push({x:width+100,y:Math.random()*(height/2),w:60+Math.random()*100,h:30+Math.random()*40,speed:1+Math.random()*1.5}); }
    function spawnHill(){ const h=100+Math.random()*150; hills.push({x:width+100,y:height-100,r:h,color:Math.random()>.5?'#251171':'#0b659e'}); }
    function spawnLoopArc(){ loopArcs.push({x:width+120,y:height-126,r:70+Math.random()*56,speed:.72+Math.random()*.55,phase:Math.random()*6.28}); }
    function spawnObstacle(){ const type=Math.random()>.7?'spike':'block'; obstacles.push({x:width,y:height-100,w:40,h:40,type,passed:false}); }
    function spawnRings(){ const patternY=height-100-(50+Math.random()*100); for(let i=0;i<3;i++) rings.push({x:width+i*50,y:patternY,r:10,collected:false,offset:Math.random()*Math.PI}); }
    function initGame(){
      score=0; distance=0; gameSpeed=8; frameCount=0; collectBurstTimer=0; collisionFlashTimer=0;
      player.y=height-150; player.dy=0; player.rotation=0; player.trail=[]; player.grounded=false; player.wasGrounded=false;
      obstacles=[]; rings=[]; clouds=[]; hills=[]; loopArcs=[]; scoreNode.textContent=score; distanceNode.textContent=distance;
      for(let i=0;i<5;i++) clouds.push({x:Math.random()*width,y:Math.random()*(height/2),w:60+Math.random()*100,h:30+Math.random()*40,speed:1+Math.random()*1.5});
      for(let i=0;i<3;i++) hills.push({x:i*(width/3),y:height-100,r:150,color:'#101b75'});
      for(let i=0;i<3;i++) loopArcs.push({x:i*(width/2)+120,y:height-126,r:82,speed:.8,phase:i});
    }
    function update(){
      gameSpeed+=.002; distance+=Math.floor(gameSpeed/5); frameCount++; if(collectBurstTimer>0) collectBurstTimer--; if(collisionFlashTimer>0) collisionFlashTimer--;
      player.wasGrounded=player.grounded; player.dy+=player.gravity; player.y+=player.dy;
      const groundLevel=height-100-player.radius;
      if(player.y>groundLevel){ player.y=groundLevel; player.dy=0; player.grounded=true; player.rotation=Math.round(player.rotation/(Math.PI*2))*Math.PI*2; if(!player.wasGrounded) audio.playSFX('land',{debounce:140}); }
      else { player.grounded=false; player.rotation+=.3; }
      if(frameCount%3===0) player.trail.push({x:player.x,y:player.y,alpha:.8});
      player.trail.forEach(t=>{t.x-=gameSpeed; t.alpha-=.1;}); player.trail=player.trail.filter(t=>t.alpha>0);
      if(frameCount%120===0&&Math.random()>.3) spawnCloud(); if(frameCount%150===0) spawnHill(); if(frameCount%180===0) spawnLoopArc();
      if(frameCount%Math.max(60,Math.floor(1500/gameSpeed))===0){ if(Math.random()>.3) spawnObstacle(); else spawnRings(); }
      clouds.forEach(c=>c.x-=c.speed); hills.forEach(h=>h.x-=gameSpeed*.5); loopArcs.forEach(a=>{a.x-=gameSpeed*a.speed; a.phase+=.02;}); obstacles.forEach(o=>o.x-=gameSpeed); rings.forEach(r=>{r.x-=gameSpeed; r.offset+=.1;});
      clouds=clouds.filter(c=>c.x+c.w>-100); hills=hills.filter(h=>h.x+h.r>-100); loopArcs=loopArcs.filter(a=>a.x+a.r>-120); obstacles=obstacles.filter(o=>o.x>-100); rings=rings.filter(r=>r.x>-100);
      for(const o of obstacles){
        if(player.x+player.radius>o.x && player.x-player.radius<o.x+o.w && player.y+player.radius>o.y-o.h && player.y-player.radius<o.y){
          if(o.type==='spike'){ const dx=player.x-(o.x+o.w/2), dy=player.y-(o.y-o.h/2), dist=Math.sqrt(dx*dx+dy*dy); if(dist<player.radius+15){ collisionFlashTimer=18; gameOver(); return; } }
          else { collisionFlashTimer=18; gameOver(); return; }
        }
      }
      for(const r of rings){ if(r.collected) continue; const dx=player.x-r.x, dy=player.y-r.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<player.radius+r.r){ r.collected=true; score++; collectBurstTimer=16; audio.playSFX('ring',{debounce:75}); scoreNode.textContent=score; if(score%3===0){ showBurst('collect',900); showStatus('Ring streak'); } } }
      distanceNode.textContent=distance;
    }
    function line(x1,y1,x2,y2,color,w=2){ ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    function drawBackground(){
      const grad=ctx.createLinearGradient(0,0,0,height); grad.addColorStop(0,'#07051b'); grad.addColorStop(.48,'#111044'); grad.addColorStop(1,'#39105f'); ctx.fillStyle=grad; ctx.fillRect(0,0,width,height);
      const phase=Math.min(1, distance/1400); const glow=ctx.createRadialGradient(width*.72,height*.18,10,width*.72,height*.18,width*.55); glow.addColorStop(0,`rgba(255,60,242,${.28+phase*.18})`); glow.addColorStop(.45,'rgba(57,248,255,.14)'); glow.addColorStop(1,'transparent'); ctx.fillStyle=glow; ctx.fillRect(0,0,width,height);
      for(let i=0;i<36;i++){ const x=((i*97)+frameCount*(.7+phase))%(width+60)-30, y=(i*61)%Math.max(height*.62,1), a=.22+Math.sin(frameCount*.05+i)*.15; ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fillRect(x,y,2,2); }
      clouds.forEach(c=>{ ctx.fillStyle='rgba(57,248,255,.08)'; ctx.beginPath(); ctx.ellipse(c.x+10,c.y+6,c.w,c.h,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,60,242,.16)'; ctx.lineWidth=2; ctx.stroke(); });
      hills.forEach(h=>{ const g=ctx.createLinearGradient(h.x,h.y-h.r*.7,h.x,h.y+120); g.addColorStop(0,'rgba(28,107,255,.5)'); g.addColorStop(1,h.color); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y+100,h.r,0,Math.PI*2); ctx.fill(); });
      loopArcs.forEach(a=>{ ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(Math.sin(a.phase)*.06); ctx.strokeStyle='rgba(57,248,255,.22)'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(0,-a.r*.2,a.r,Math.PI*.18,Math.PI*1.72); ctx.stroke(); ctx.strokeStyle='rgba(255,215,46,.28)'; ctx.lineWidth=3; ctx.setLineDash([10,12]); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); });
    }
    function drawGround(){
      const groundY=height-100, tile=40, offset=(frameCount*gameSpeed)%(tile*2);
      const g=ctx.createLinearGradient(0,groundY,0,height); g.addColorStop(0,'#28205f'); g.addColorStop(1,'#09071e'); ctx.fillStyle=g; ctx.fillRect(0,groundY,width,100);
      ctx.fillStyle='#39ff94'; ctx.fillRect(0,groundY,width,20); ctx.fillStyle='rgba(255,215,46,.92)'; ctx.fillRect(0,groundY+20,width,4);
      for(let x=-offset;x<width;x+=tile){ ctx.fillStyle=(Math.floor((x+offset)/tile)%2===0)?'#121b4f':'#39f8ff'; ctx.globalAlpha=.72; ctx.fillRect(x,groundY,tile,20); ctx.globalAlpha=1; }
      for(let x=-offset*.8;x<width+40;x+=70) line(x,groundY+12,x+24,groundY+32,'rgba(255,60,242,.28)',2);
      for(let x=-(frameCount*gameSpeed*1.7%120);x<width+120;x+=120) line(x,groundY+60,x+58,groundY+92,'rgba(57,248,255,.18)',3);
    }
    function drawObstacles(){ const groundY=height-100; obstacles.forEach(o=>{ if(o.type==='spike'){ const grd=ctx.createLinearGradient(o.x,groundY-o.h,o.x,groundY); grd.addColorStop(0,'#ff90a0'); grd.addColorStop(.35,'#ff364f'); grd.addColorStop(1,'#650619'); ctx.fillStyle=grd; ctx.beginPath(); ctx.moveTo(o.x,groundY); ctx.lineTo(o.x+o.w/2,groundY-o.h); ctx.lineTo(o.x+o.w,groundY); ctx.fill(); line(o.x+6,groundY-2,o.x+o.w/2,groundY-o.h+6,'rgba(255,255,255,.68)',3); line(o.x+o.w/2,groundY-o.h+6,o.x+o.w-6,groundY-2,'rgba(255,255,255,.68)',3); } else { const grd=ctx.createLinearGradient(o.x,groundY-o.h,o.x,groundY); grd.addColorStop(0,'#39f8ff'); grd.addColorStop(1,'#15143e'); ctx.fillStyle=grd; ctx.fillRect(o.x,groundY-o.h,o.w,o.h); ctx.strokeStyle='rgba(255,60,242,.75)'; ctx.lineWidth=3; ctx.strokeRect(o.x+3,groundY-o.h+3,o.w-6,o.h-6); line(o.x+7,groundY-o.h+10,o.x+o.w-7,groundY-10,'rgba(255,215,46,.45)',2); } }); }
    function drawRings(){ rings.forEach(r=>{ if(r.collected) return; const pulse=1+Math.sin(r.offset*2)*.14; ctx.strokeStyle=`rgba(255,215,46,${collectBurstTimer > 0 ? .58 : .32})`; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(r.x,r.y,r.r*pulse,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle='#ffd72e'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#fffbe0'; ctx.beginPath(); ctx.arc(r.x-3,r.y-3,2,0,Math.PI*2); ctx.fill(); }); }
    function drawPlayer(){
      player.trail.forEach(t=>{ ctx.fillStyle=`rgba(57,248,255,${t.alpha*.55})`; ctx.beginPath(); ctx.ellipse(t.x-8,t.y,player.radius*1.25,player.radius*.72,0,0,Math.PI*2); ctx.fill(); });
      ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.rotation);
      const body=ctx.createRadialGradient(-5,-8,5,0,0,player.radius+12); body.addColorStop(0,'#eaffff'); body.addColorStop(.36,collectBurstTimer>0?'#ffd72e':'#39f8ff'); body.addColorStop(1,collisionFlashTimer>0?'#ff364f':'#1c6bff'); ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,player.radius,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0e4de6'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-10,-8+i*8); ctx.lineTo(-34,-18+i*10); ctx.lineTo(-20,2+i*5); ctx.closePath(); ctx.fill(); }
      if(player.grounded){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(8,-6,8,10,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#09071e'; ctx.beginPath(); ctx.arc(11,-6,3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#09071e'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(2,6,7,.15,Math.PI-.15); ctx.stroke(); ctx.fillStyle='#ff364f'; ctx.beginPath(); ctx.ellipse(-4,18,15,5,-.08,0,Math.PI*2); ctx.fill(); } else { for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.fillStyle='#39f8ff'; ctx.beginPath(); ctx.moveTo(10,-5); ctx.lineTo(28,0); ctx.lineTo(10,5); ctx.fill(); } ctx.fillStyle='rgba(255,215,46,.95)'; ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-34,-7); ctx.lineTo(-34,7); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
    function draw(){ drawBackground(); drawGround(); drawObstacles(); drawRings(); drawPlayer(); if(collisionFlashTimer>0){ ctx.fillStyle=`rgba(255,54,79,${collisionFlashTimer/40})`; ctx.fillRect(0,0,width,height); } }
    function gameLoop(){ if(!gameActive) return; ctx.clearRect(0,0,width,height); update(); draw(); requestAnimationFrame(gameLoop); }
    function gameOver(){ gameActive=false; audio.stopBGM(); audio.playSFX('fail'); showBurst('fail',1600); showStatus('Run wiped',1400); hud.classList.add('hidden'); over.classList.remove('hidden'); finalScoreNode.textContent=score; finalDistanceNode.textContent=distance; let deathY=player.y, deathDy=-10; function deathAnim(){ if(gameActive) return; ctx.clearRect(0,0,width,height); draw(); deathDy+=.5; deathY+=deathDy; ctx.save(); ctx.translate(player.x,deathY); ctx.fillStyle='#1c6bff'; ctx.beginPath(); ctx.arc(0,0,player.radius,0,Math.PI*2); ctx.fill(); ctx.restore(); if(deathY<height+50) requestAnimationFrame(deathAnim); } deathAnim(); }
    function jump(){ if(!gameActive) return; if(player.grounded){ player.dy=player.jumpForce; player.grounded=false; audio.playSFX('jump',{debounce:100}); showStatus('Boost'); } }
    function startRun(){ audio.unlock(); audio.playSFX('ui'); audio.playSFX('start'); audio.playBGM(); start.classList.add('hidden'); over.classList.add('hidden'); hud.classList.remove('hidden'); burst.classList.remove('active'); showStatus('Loop synced'); gameActive=true; initGame(); gameLoop(); }
    startBtn.addEventListener('click',startRun); restartBtn.addEventListener('click',()=>{ audio.unlock(); audio.playSFX('ui'); startRun(); });
    addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ if(!gameActive&&!start.classList.contains('hidden')) startRun(); else jump(); } });
    canvas.addEventListener('touchstart',e=>{ if(!gameActive) return; e.preventDefault(); jump(); },{passive:false});
    addEventListener('mousedown',e=>{ if(e.target.closest('button')) return; if(!gameActive&&!start.classList.contains('hidden')) { startRun(); return; } jump(); });
    draw();
    window.__NEON_LOOP_RUSH_STATE__=()=>({gameActive,score,distance,gameSpeed,player:{x:player.x,y:player.y,grounded:player.grounded},obstacles:obstacles.length,rings:rings.length,frameCount});
  })();
  </script>
</body>
