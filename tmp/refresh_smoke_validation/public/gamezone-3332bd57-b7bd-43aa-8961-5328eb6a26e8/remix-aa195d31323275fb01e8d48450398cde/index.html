<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Abyss Salvager</title>
    <!-- [agent-note][stage3] resolved-font: title -> Orbitron | ui/body -> Rajdhani -->
    <!-- [agent-note][stage4] preserved-font-role: title/display -> Orbitron | ui/body -> Rajdhani from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #06132a;
            --bg-mid: #081a37;
            --bg-bottom: #010611;
            --panel: rgba(8, 24, 52, 0.76);
            --panel-border: rgba(117, 228, 255, 0.34);
            --panel-shadow: rgba(0, 0, 0, 0.52);
            --text-main: #e9fbff;
            --text-soft: rgba(202, 242, 255, 0.82);
            --accent: #6ef0ff;
            --accent-strong: #3cb6ff;
            --accent-gold: #ffd96f;
            --danger: #ff728f;
            --danger-strong: #ff4f73;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(45, 109, 168, 0.22), transparent 42%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                radial-gradient(circle at 12% 22%, rgba(110, 240, 255, 0.18), transparent 18%),
                radial-gradient(circle at 80% 18%, rgba(60, 182, 255, 0.12), transparent 20%),
                radial-gradient(circle at 50% 82%, rgba(255, 217, 111, 0.08), transparent 24%);
            mix-blend-mode: screen;
        }

        .game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 16%, transparent 84%, rgba(0,0,0,0.28)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 6px);
            opacity: 0.35;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }

        .screen-panel {
            width: min(92vw, 420px);
            padding: 24px;
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(12, 31, 63, 0.94), rgba(5, 15, 34, 0.88)),
                var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 42px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 26px rgba(110, 240, 255, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .screen-panel.hidden,
        .hidden {
            display: none !important;
        }

        .title {
            margin: 0 0 10px;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(30px, 8vw, 58px);
            line-height: 0.92;
            letter-spacing: 0.08em;
            color: #baf7ff;
            text-shadow:
                0 0 12px rgba(110, 240, 255, 0.72),
                0 0 34px rgba(60, 182, 255, 0.34);
        }

        .subtitle {
            margin: 0 0 22px;
            font-size: clamp(14px, 4vw, 20px);
            line-height: 1.35;
            color: var(--text-soft);
        }

        .mission-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #d6fdff;
            background: rgba(110, 240, 255, 0.1);
            border: 1px solid rgba(110, 240, 255, 0.25);
            box-shadow: 0 0 18px rgba(110, 240, 255, 0.12);
        }

        .mission-pill::before {
            content: "🐠";
            font-size: 16px;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(110, 240, 255, 0.7);
        }

        .primary-btn,
        .secondary-btn {
            min-width: 180px;
            min-height: 52px;
            padding: 14px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .primary-btn {
            color: #07203f;
            background: linear-gradient(135deg, #7ef8ff, #47c4ff 52%, #8a7cff);
            box-shadow:
                0 14px 30px rgba(24, 147, 230, 0.32),
                inset 0 1px 0 rgba(255,255,255,0.5);
        }

        .secondary-btn {
            color: #fff5f7;
            background: linear-gradient(135deg, var(--danger), var(--danger-strong));
            box-shadow:
                0 14px 30px rgba(255, 79, 115, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.35);
        }

        .primary-btn:hover,
        .secondary-btn:hover,
        .primary-btn:focus-visible,
        .secondary-btn:focus-visible {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.04);
            outline: none;
        }

        .hud {
            /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
            position: absolute;
            top: calc(max(16px, env(safe-area-inset-top)) + 8px);
            left: calc(max(16px, env(safe-area-inset-left)) + 8px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(13px, 3.4vw, 22px);
            letter-spacing: 0.08em;
            background: rgba(4, 18, 38, 0.72);
            border: 1px solid rgba(126, 248, 255, 0.28);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud .salvage-core {
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff6b8, #ffd96f 55%, #f1a718 100%);
            box-shadow: 0 0 12px rgba(255, 217, 111, 0.9);
        }

        .depth-hud {
            position: absolute;
            top: calc(max(16px, env(safe-area-inset-top)) + 10px);
            right: calc(max(16px, env(safe-area-inset-right)) + 8px);
            padding: 10px 14px;
            border-radius: 16px;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(214, 252, 255, 0.84);
            background: rgba(4, 18, 38, 0.58);
            border: 1px solid rgba(126, 248, 255, 0.18);
            box-shadow: 0 10px 24px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .results-score {
            margin: 0 0 22px;
            font-size: clamp(18px, 5vw, 28px);
            color: #fff;
        }

        .results-score strong {
            color: var(--accent-gold);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        #media-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(92px, 22vw, 156px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: scale(0.86) translateY(10px);
            transition: opacity 180ms ease, transform 220ms ease;
            mix-blend-mode: screen;
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        .feedback-gif-collect {
            right: min(4vw, 24px);
            bottom: min(16vh, 104px);
        }

        .feedback-gif-fail {
            left: 50%;
            top: 18%;
            transform: translateX(-50%) scale(0.86);
        }

        .feedback-gif-fail.show {
            transform: translateX(-50%) scale(1);
        }

        .panel-copy {
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        .panel-copy {
            margin: 0 0 18px;
            font-size: 14px;
            line-height: 1.45;
            color: rgba(218, 244, 255, 0.72);
        }

        @media (max-width: 640px) {
            .screen-panel {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .mission-pill {
                margin-bottom: 14px;
                padding: 7px 11px;
                font-size: 11px;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
                min-width: 0;
                font-size: 15px;
            }

            .hud {
                padding: 9px 12px;
                gap: 8px;
            }

            .depth-hud {
                padding: 9px 11px;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="media-overlay" class="hidden" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: collect-burst + fail-reaction from catalogs/gifs.json -->
            <img id="collect-gif" class="feedback-gif feedback-gif-collect hidden" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Salvage burst reaction">
            <img id="fail-gif" class="feedback-gif feedback-gif-fail hidden" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Mission fail reaction">
        </div>

        <!-- UI Layer -->
        <div id="ui-layer">

            <!-- Start Screen -->
            <div id="start-screen" class="screen-panel">
                <div class="mission-pill">Neon Reef Recovery</div>
                <h1 class="title">ABYSS<br>SALVAGER</h1>
                <p class="subtitle glow-text">Pilot the lantern-sub, scoop glowing salvage, and slip past reef predators.</p>
                <button id="start-btn" class="primary-btn">Start Salvage</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen-panel hidden">
                <div class="mission-pill">Signal Lost</div>
                <h2 class="title" style="font-size: clamp(28px, 7vw, 48px); color: #ffc6d2; text-shadow: 0 0 12px rgba(255, 114, 143, 0.55), 0 0 28px rgba(255, 79, 115, 0.26);">Mission Lost</h2>
                <p class="panel-copy">Predators closed in before the salvage run was complete.</p>
                <p class="results-score">Salvage Secured: <strong id="finalScore">0</strong></p>
                <button id="restart-btn" class="secondary-btn">Redeploy</button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="salvage-core"></div>
                <span id="score">0</span>
            </div>

            <!-- Depth Indicator (Cosmetic) -->
            <div id="depth-hud" class="depth-hud hidden">
                Sector: <span id="depth-meter">1200</span>m
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        /** 2. AUDIO + FEEDBACK SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = new Map();
                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.volume = key === 'danger' ? 0.42 : 0.58;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.ready = true;
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 0) {
                if (!this.ready || !this.sfx[key]) return;
                const now = performance.now();
                if (cooldown > 0) {
                    const lastPlayed = this.cooldowns.get(key) ?? 0;
                    if (now - lastPlayed < cooldown) return;
                    this.cooldowns.set(key, now);
                }
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.overlay = document.getElementById('media-overlay');
                this.collectGif = document.getElementById('collect-gif');
                this.failGif = document.getElementById('fail-gif');
                this.timers = new Map();
            }

            flash(type, duration = 1200) {
                const target = type === 'collect' ? this.collectGif : this.failGif;
                if (!target) return;
                this.overlay.classList.remove('hidden');
                target.classList.remove('hidden');
                target.classList.add('show');

                if (this.timers.has(type)) {
                    clearTimeout(this.timers.get(type));
                }

                const timer = setTimeout(() => {
                    target.classList.remove('show');
                    target.classList.add('hidden');
                    if (!this.collectGif.classList.contains('show') && !this.failGif.classList.contains('show')) {
                        this.overlay.classList.add('hidden');
                    }
                }, duration);

                this.timers.set(type, timer);
            }

            reset() {
                this.overlay.classList.add('hidden');
                this.collectGif.classList.add('hidden');
                this.collectGif.classList.remove('show');
                this.failGif.classList.add('hidden');
                this.failGif.classList.remove('show');
                for (const timer of this.timers.values()) {
                    clearTimeout(timer);
                }
                this.timers.clear();
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let depth = 1200;
        let previousScore = 0;

        // Player
        let player = { x: 0, y: 0, radius: 20, targetX: 0, targetY: 0, angle: 0 };

        // Entities
        let enemies = [];
        let treasures = [];
        let bubbles = [];

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (!gameActive) {
                player.x = width / 2;
                player.y = height / 2;
                player.targetX = width / 2;
                player.targetY = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        const handleInput = (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        };

        window.addEventListener('mousemove', handleInput);
        canvas.addEventListener('touchmove', handleInput, { passive: false });
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        /** 4. GAME LOGIC */
        function initGame() {
            previousScore = score;
            score = 0;
            depth = 1200;
            frameCount = 0;
            enemies = [];
            treasures = [];
            bubbles = [];

            player.x = width / 2;
            player.y = height / 2;
            player.targetX = width / 2;
            player.targetY = height / 2;
            player.angle = 0;

            // Pre-populate bubbles
            for(let i = 0; i < 50; i++) {
                bubbles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    speed: Math.random() * 1 + 0.5,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }

            document.getElementById('score').innerText = score;
            document.getElementById('depth-meter').innerText = depth;
            feedback.reset();
        }

        function spawnEnemy() {
            const size = Math.random() * 20 + 20;
            const speed = Math.random() * 3 + 2 + (score * 0.1);
            const side = Math.random() < 0.5 ? -1 : 1;

            enemies.push({
                x: side === -1 ? -50 : width + 50,
                y: Math.random() * height,
                vx: side === -1 ? speed : -speed,
                radius: size,
                type: Math.random() > 0.7 ? 'shark' : 'fish',
                phase: Math.random() * Math.PI * 2
            });
        }

        function spawnTreasure() {
            treasures.push({
                x: Math.random() * (width - 60) + 30,
                y: -50,
                vy: Math.random() * 1 + 1,
                radius: 12,
                angle: 0
            });
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#04162f');
            gradient.addColorStop(0.55, '#041026');
            gradient.addColorStop(1, '#00040d');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 5; i++) {
                const y = ((frameCount * 0.22) + i * height * 0.28) % (height + 160) - 80;
                const arc = ctx.createLinearGradient(0, y, width, y + 120);
                arc.addColorStop(0, 'rgba(110, 240, 255, 0)');
                arc.addColorStop(0.5, 'rgba(110, 240, 255, 0.8)');
                arc.addColorStop(1, 'rgba(110, 240, 255, 0)');
                ctx.strokeStyle = arc;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-40, y);
                ctx.quadraticCurveTo(width * 0.5, y + 40, width + 40, y - 10);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = 0.25;
            for (let i = 0; i < 30; i++) {
                const pearlX = (i * 137) % width;
                const pearlY = (i * 91 + frameCount * 0.08) % height;
                ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 217, 111, 0.12)' : 'rgba(110, 240, 255, 0.08)';
                ctx.beginPath();
                ctx.arc(pearlX, pearlY, (i % 4) + 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawBubbles() {
            bubbles.forEach((b, index) => {
                b.y -= b.speed;
                b.x += Math.sin((frameCount * 0.02) + index) * 0.18;
                if (b.y < -10) {
                    b.y = height + 10;
                    b.x = Math.random() * width;
                }

                ctx.save();
                ctx.globalAlpha = b.alpha;
                const bubbleGradient = ctx.createRadialGradient(b.x - 1, b.y - 1, 0, b.x, b.y, b.size * 2);
                bubbleGradient.addColorStop(0, 'rgba(255,255,255,0.8)');
                bubbleGradient.addColorStop(0.4, 'rgba(160, 240, 255, 0.45)');
                bubbleGradient.addColorStop(1, 'rgba(160, 240, 255, 0)');
                ctx.fillStyle = bubbleGradient;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size * 1.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawPlayer() {
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            player.x += dx * 0.08;
            player.y += dy * 0.08;

            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                player.angle = Math.atan2(dy, dx);
            }

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            const pulse = Math.sin(frameCount * 0.12);
            const finPulse = Math.sin(frameCount * 0.45) * 3;

            const lightGrad = ctx.createRadialGradient(18, 0, 10, 155, 0, 72);
            lightGrad.addColorStop(0, 'rgba(255, 246, 184, 0.58)');
            lightGrad.addColorStop(0.45, 'rgba(110, 240, 255, 0.18)');
            lightGrad.addColorStop(1, 'rgba(255, 255, 200, 0)');
            ctx.fillStyle = lightGrad;
            ctx.beginPath();
            ctx.moveTo(8, -14);
            ctx.lineTo(205, -56);
            ctx.lineTo(205, 56);
            ctx.lineTo(8, 14);
            ctx.closePath();
            ctx.fill();

            ctx.save();
            ctx.shadowColor = 'rgba(110, 240, 255, 0.6)';
            ctx.shadowBlur = 18;

            ctx.fillStyle = '#0f2f58';
            ctx.beginPath();
            ctx.ellipse(-4, 0, 32, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(-30, -12, 26, 16);
            bodyGradient.addColorStop(0, '#66f6ff');
            bodyGradient.addColorStop(0.55, '#2fc0ff');
            bodyGradient.addColorStop(1, '#1762b5');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 28, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.fillStyle = '#89fbff';
            ctx.beginPath();
            ctx.moveTo(-4, -14);
            ctx.lineTo(-22, -26 + pulse * 0.7);
            ctx.lineTo(-14, -8);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-6, 14);
            ctx.lineTo(-22, 25 - pulse * 0.7);
            ctx.lineTo(-10, 7);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffd96f';
            ctx.beginPath();
            ctx.ellipse(6, 0, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            const glassGradient = ctx.createRadialGradient(12, -4, 1, 10, -4, 11);
            glassGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
            glassGradient.addColorStop(0.55, 'rgba(149, 242, 255, 0.92)');
            glassGradient.addColorStop(1, 'rgba(27, 93, 154, 0.95)');
            ctx.fillStyle = glassGradient;
            ctx.beginPath();
            ctx.arc(10, -4, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#07305e';
            ctx.beginPath();
            ctx.arc(10, -4, 3.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#b9f9ff';
            ctx.fillRect(-31, -2 + finPulse, 7, 4);
            ctx.fillRect(-33, -10 + finPulse, 3, 20);

            ctx.fillStyle = '#8df7ff';
            ctx.beginPath();
            ctx.moveTo(12, 15);
            ctx.lineTo(4, 25 + pulse);
            ctx.lineTo(24, 14);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawSharkEnemy(e) {
            const bodyGradient = ctx.createLinearGradient(-34, 0, 20, 0);
            bodyGradient.addColorStop(0, '#1f314d');
            bodyGradient.addColorStop(1, '#08131f');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.moveTo(22, 0);
            ctx.quadraticCurveTo(-6, -16, -34, 0);
            ctx.quadraticCurveTo(-6, 16, 22, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-6, -6);
            ctx.lineTo(-15, -25);
            ctx.lineTo(-21, -6);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-30, 0);
            ctx.lineTo(-46, -12);
            ctx.lineTo(-40, 0);
            ctx.lineTo(-46, 12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#6ef0ff';
            ctx.beginPath();
            ctx.arc(12, -5, 2.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(4, 2);
            ctx.lineTo(16, 2);
            ctx.stroke();
        }

        function drawFishEnemy(e) {
            const bodyGradient = ctx.createRadialGradient(-5, -6, 3, 0, 0, e.radius + 6);
            bodyGradient.addColorStop(0, '#ff9fb5');
            bodyGradient.addColorStop(0.58, '#8b2a56');
            bodyGradient.addColorStop(1, '#2b1024');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#48152f';
            ctx.beginPath();
            ctx.moveTo(-e.radius + 4, 0);
            ctx.lineTo(-e.radius - 12, -11);
            ctx.lineTo(-e.radius - 10, 0);
            ctx.lineTo(-e.radius - 12, 11);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff0f4';
            ctx.beginPath();
            ctx.arc(9, -4, 3.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff5172';
            ctx.beginPath();
            ctx.arc(10, -4, 1.8, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTreasure(t) {
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.angle);

            const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, 24);
            halo.addColorStop(0, 'rgba(255, 245, 180, 0.55)');
            halo.addColorStop(1, 'rgba(255, 217, 111, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 18;
            ctx.shadowColor = 'rgba(255, 217, 111, 0.9)';
            const crystalGradient = ctx.createLinearGradient(-10, -10, 10, 10);
            crystalGradient.addColorStop(0, '#fff5b7');
            crystalGradient.addColorStop(0.55, '#ffd96f');
            crystalGradient.addColorStop(1, '#ff9f1a');
            ctx.fillStyle = crystalGradient;
            ctx.beginPath();
            ctx.moveTo(0, -11);
            ctx.lineTo(10, 0);
            ctx.lineTo(0, 11);
            ctx.lineTo(-10, 0);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.42)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(5, 0);
            ctx.lineTo(0, 8);
            ctx.lineTo(-5, 0);
            ctx.closePath();
            ctx.stroke();

            ctx.restore();
        }

        function updateEntities() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;
                e.phase += 0.06;
                e.y += Math.sin(e.phase) * (e.type === 'shark' ? 0.5 : 0.8);

                ctx.save();
                ctx.translate(e.x, e.y);
                if (e.vx < 0) ctx.scale(-1, 1);

                if (e.type === 'shark') {
                    drawSharkEnemy(e);
                } else {
                    drawFishEnemy(e);
                }
                ctx.restore();

                const dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.radius + e.radius - 5) {
                    gameOver();
                }

                if ((e.vx > 0 && e.x > width + 100) || (e.vx < 0 && e.x < -100)) {
                    enemies.splice(i, 1);
                }
            }

            for (let i = treasures.length - 1; i >= 0; i--) {
                let t = treasures[i];
                t.y += t.vy;
                t.angle += 0.05;

                drawTreasure(t);

                const dist = Math.hypot(player.x - t.x, player.y - t.y);
                if (dist < player.radius + t.radius + 10) {
                    previousScore = score;
                    score += 100;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('collect', 120);
                    feedback.flash('collect', 950);
                    treasures.splice(i, 1);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 50, 0, Math.PI * 2);
                    ctx.fill();
                } else if (t.y > height + 50) {
                    treasures.splice(i, 1);
                }
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            frameCount++;

            if (frameCount % 60 === 0) {
                depth += 1;
                document.getElementById('depth-meter').innerText = depth;
            }

            drawBackground();
            drawBubbles();

            if (frameCount % 60 === 0) {
                if (Math.random() > 0.3) spawnEnemy();
            }
            if (frameCount % 90 === 0) {
                spawnTreasure();
            }

            drawPlayer();
            updateEntities();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('danger', 0);
            audio.playSFX('fail', 0);
            feedback.flash('fail', 1800);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('depth-hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('depth-hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('depth-hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
