<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Core Tycoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050b14;
            --bg-mid: #0b1527;
            --panel: rgba(9, 16, 30, 0.84);
            --panel-strong: rgba(14, 24, 45, 0.94);
            --line: rgba(98, 221, 255, 0.24);
            --line-strong: rgba(143, 240, 255, 0.72);
            --glow-cyan: rgba(0, 243, 255, 0.38);
            --glow-pink: rgba(255, 0, 209, 0.28);
            --text-main: #f5fbff;
            --text-soft: rgba(214, 240, 255, 0.84);
            --text-dim: rgba(171, 198, 224, 0.68);
            --success: #6dffb2;
            --warning: #ffd76d;
            --action: #ff4fd8;
            --action-strong: #ff77e4;
            --action-muted: rgba(255, 79, 216, 0.2);
            --core-shell: #0f172a;
            --core-detail: #d8fbff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 243, 255, 0.08), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 0, 209, 0.08), transparent 30%),
                var(--bg-deep);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        button {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 1rem;
            border: 0;
            cursor: pointer;
        }

        .neon-text {
            text-shadow: 0 0 14px rgba(0, 243, 255, 0.45);
        }

        .hud-title,
        .hero-title,
        .currency-display,
        .upgrade-name {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        .backdrop-fx,
        .backdrop-fx::before,
        .backdrop-fx::after {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .backdrop-fx::before,
        .backdrop-fx::after {
            content: "";
        }

        .backdrop-fx::before {
            background:
                radial-gradient(circle at 22% 18%, rgba(0, 243, 255, 0.14), transparent 18%),
                radial-gradient(circle at 78% 20%, rgba(255, 0, 209, 0.11), transparent 18%),
                radial-gradient(circle at 52% 88%, rgba(109, 255, 178, 0.08), transparent 20%);
            filter: blur(8px);
            opacity: 0.9;
        }

        .backdrop-fx::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 120px 120px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 88%);
            opacity: 0.22;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 14px 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .hud-panel {
            min-width: min(92vw, 360px);
            padding: 12px 16px 10px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, rgba(11, 21, 39, 0.92), rgba(7, 14, 26, 0.82));
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 18px 32px rgba(0, 0, 0, 0.26),
                0 0 28px rgba(0, 243, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .hud-title {
            font-size: 12px;
            color: rgba(166, 237, 255, 0.86);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 6px;
        }

        .currency-display {
            font-size: clamp(32px, 9vw, 54px);
            font-weight: 700;
            line-height: 0.95;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .hud-rate {
            margin-top: 6px;
            text-align: center;
            font-size: 18px;
            color: var(--success);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .hero-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(56vw, 260px);
            height: min(56vw, 260px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(143, 240, 255, 0.16);
            box-shadow:
                0 0 30px rgba(0, 243, 255, 0.1),
                inset 0 0 30px rgba(0, 243, 255, 0.04);
            pointer-events: none;
            z-index: 1;
        }

        .hero-ring::before,
        .hero-ring::after {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .hero-ring::after {
            inset: -10%;
            border-style: solid;
            border-color: rgba(255, 0, 209, 0.14);
            opacity: 0.8;
        }

        /* [agent-note][stage2] preserve: upgrade-sheet-position | reason: already mobile-safe bottom-sheet layout */
        .upgrade-menu {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 33.333%;
            display: flex;
            flex-direction: column;
            z-index: 20;
            pointer-events: auto;
            transform: translateY(100%);
            transition: transform 300ms ease;
            border-radius: 26px 26px 0 0;
            border: 1px solid rgba(143, 240, 255, 0.18);
            border-bottom: 0;
            background:
                linear-gradient(180deg, rgba(15, 25, 45, 0.94), rgba(7, 12, 24, 0.98));
            box-shadow:
                0 -20px 36px rgba(0, 0, 0, 0.34),
                0 0 30px rgba(0, 243, 255, 0.08);
            backdrop-filter: blur(14px);
        }

        .upgrade-menu.is-open {
            transform: translateY(0);
        }

        .menu-handle {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 8px 0 4px;
        }

        .menu-handle-bar {
            width: 52px;
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.45), rgba(255, 0, 209, 0.45));
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.18);
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px calc(18px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(143, 240, 255, 0.12);
            background:
                linear-gradient(180deg, rgba(18, 30, 54, 0.82), rgba(10, 17, 30, 0.82));
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.02) inset,
                0 10px 16px rgba(0, 0, 0, 0.16);
        }

        .upgrade-main {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .upgrade-icon {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 26px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 60%),
                linear-gradient(180deg, rgba(0, 243, 255, 0.18), rgba(255, 0, 209, 0.18));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 0 18px rgba(0, 243, 255, 0.09);
        }

        .upgrade-copy {
            min-width: 0;
        }

        .upgrade-name {
            color: #8df0ff;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.05;
        }

        .upgrade-meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 600;
            line-height: 1.2;
        }

        .btn-upgrade {
            min-width: 92px;
            padding: 11px 12px;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(180deg, var(--action-strong), var(--action));
            box-shadow: 0 8px 18px rgba(255, 79, 216, 0.24);
            transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
        }

        .btn-upgrade:active {
            transform: scale(0.96);
        }

        .btn-upgrade:disabled {
            opacity: 0.55;
            filter: grayscale(0.25);
            cursor: not-allowed;
            box-shadow: none;
            background: linear-gradient(180deg, rgba(91, 111, 142, 0.65), rgba(49, 62, 84, 0.65));
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 45%, rgba(0, 243, 255, 0.08), transparent 26%),
                rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(12px);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            margin-bottom: 14px;
            border-radius: 999px;
            background: rgba(11, 21, 39, 0.85);
            border: 1px solid rgba(143, 240, 255, 0.18);
            color: rgba(173, 236, 255, 0.9);
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.08);
        }

        .hero-title {
            margin: 0;
            font-size: clamp(40px, 13vw, 72px);
            line-height: 0.95;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(90deg, #8df0ff 0%, #b6e6ff 40%, #ff7ce8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.18));
        }

        .hero-subtitle {
            margin: 12px 0 20px;
            max-width: 320px;
            font-size: clamp(15px, 4vw, 20px);
            color: var(--text-soft);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .hero-copy {
            max-width: 320px;
            margin: 0 0 24px;
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1.3;
        }

        .start-btn {
            position: relative;
            padding: 14px 26px;
            border-radius: 18px;
            color: #fff;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #0ec7ff, #995bff 55%, #ff4fd8);
            box-shadow:
                0 0 24px rgba(14, 199, 255, 0.28),
                0 12px 24px rgba(0, 0, 0, 0.24);
            transition: transform 140ms ease, filter 140ms ease;
        }

        .feedback-stack {
            position: absolute;
            right: 12px;
            bottom: calc(34% + 16px);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .feedback-gif {
            width: min(26vw, 108px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid rgba(143, 240, 255, 0.18);
            background: rgba(6, 12, 24, 0.72);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 18px rgba(0, 243, 255, 0.12);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.is-visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            min-width: 148px;
            max-width: min(44vw, 220px);
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid rgba(143, 240, 255, 0.16);
            background: rgba(8, 15, 28, 0.84);
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: right;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-caption.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .start-btn:active {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .hero-caption {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(189, 212, 232, 0.7);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .pulse {
            animation: pulseGlow 1.8s ease-in-out infinite;
        }

        .float {
            animation: gentleFloat 3.2s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.72; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @media (max-width: 480px) {
            .hud {
                padding-inline: 10px;
            }

            .hud-panel {
                min-width: min(94vw, 340px);
                padding: 10px 12px 9px;
                border-radius: 20px;
            }

            .hud-rate {
                font-size: 16px;
            }

            .upgrade-menu {
                height: 36%;
                border-radius: 24px 24px 0 0;
            }

            .upgrade-list {
                padding-inline: 10px;
                gap: 8px;
            }

            .upgrade-card {
                padding: 10px;
                gap: 8px;
            }

            .upgrade-icon {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
                font-size: 23px;
            }

            .upgrade-name {
                font-size: 15px;
            }

            .upgrade-meta {
                font-size: 12px;
            }

            .btn-upgrade {
                min-width: 84px;
                padding: 10px 10px;
                font-size: 14px;
            }

            .hero-copy {
                font-size: 14px;
            }

            .feedback-stack {
                right: 8px;
                bottom: calc(36% + 12px);
                gap: 8px;
            }

            .feedback-gif {
                width: min(22vw, 88px);
                border-radius: 14px;
            }

            .feedback-caption {
                min-width: 120px;
                max-width: min(48vw, 180px);
                padding: 8px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>

<script>
/**
 * AUDIO MANAGER
 * Handles BGM and SFX with Web Audio API fallback
 */
class AudioManager {
    constructor() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioContextClass ? new AudioContextClass() : null;
        this.bgmNode = document.getElementById('bgm_main');
        this.sfxMap = {
            coin: document.getElementById('sfx_coin'),
            upgrade: document.getElementById('sfx_upgrade'),
            start: document.getElementById('sfx_start'),
            fail: document.getElementById('sfx_fail')
        };
        this.sfxVolumes = {
            coin: 0.4,
            upgrade: 0.55,
            start: 0.5,
            fail: 0.45
        };
        this.lastPlayedAt = {};
        this.isUnlocked = false;
    }

    unlock() {
        if (this.isUnlocked) return;
        if (!this.ctx) {
            this.isUnlocked = true;
            this.playBgm();
            return;
        }
        this.ctx.resume().then(() => {
            this.isUnlocked = true;
            this.playBgm();
        }).catch(() => {
            this.isUnlocked = true;
            this.playBgm();
        });
    }

    playBgm() {
        if (this.bgmNode) {
            this.bgmNode.volume = Math.max(0, Math.min(0.2, Number(window.gameConfig.bgmVolume) || 0.2));
            this.bgmNode.play().catch(() => {});
        }
    }

    stopBgm() {
        if (this.bgmNode) {
            this.bgmNode.pause();
            this.bgmNode.currentTime = 0;
        }
    }

    playSfx(id, debounceMs = 90) {
        if (!this.isUnlocked) return;
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < debounceMs) return;
        this.lastPlayedAt[id] = now;

        const el = this.sfxMap[id];
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = this.sfxVolumes[id] ?? 0.5;
                el.play().catch(() => this.synthesize(id));
            } catch (e) {
                this.synthesize(id);
            }
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(820, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else if (type === 'upgrade' || type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(type === 'start' ? 320 : 240, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(type === 'start' ? 760 : 680, this.ctx.currentTime + 0.28);
            gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.28);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(260, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(130, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
        }
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let audioManager;
let lastTime = 0;
let width, height;
let feedbackTimeout;

// Game State
const state = {
    money: 0,
    clickPower: 1,
    autoRate: 0,
    orbiters: 0,
    coreScale: 1,
    coreRotation: 0,
    particles: [],
    floaters: [],
    upgrades: [
        { id: 'click1', name: 'Pulse Amplifier', type: 'click', baseCost: 15, basePower: 1, count: 0, costMult: 1.5, icon: '⚡' },
        { id: 'auto1', name: 'Relay Drone', type: 'auto', baseCost: 50, basePower: 2, count: 0, costMult: 1.4, icon: '🛰️' },
        { id: 'click2', name: 'Resonance Tap', type: 'click', baseCost: 250, basePower: 5, count: 0, costMult: 1.6, icon: '⚛️' },
        { id: 'auto2', name: 'Beacon Bot', type: 'auto', baseCost: 1000, basePower: 15, count: 0, costMult: 1.5, icon: '🤖' },
        { id: 'auto3', name: 'Solar Uplink', type: 'auto', baseCost: 5000, basePower: 80, count: 0, costMult: 1.6, icon: '☀️' }
    ]
};

// Config Handling
window.gameConfigDefs = {
    "coreColor": { "type": "color", "label": "Core Color", "value": "#00f3ff" },
    "orbiterColor": { "type": "color", "label": "Orbiter Color", "value": "#ff00ff" },
    "bgmVolume": { "type": "number", "label": "Music Volume", "value": 0.4, "min": 0, "max": 1 },
    "startMoney": { "type": "number", "label": "Starting Cash", "value": 0, "min": 0, "max": 1000 }
};
window.gameConfig = {
    coreColor: "#00f3ff",
    orbiterColor: "#ff00ff",
    bgmVolume: 0.2,
    startMoney: 0
};

function sanitizeGameConfigValue(key, val) {
    const rawValue = (val && typeof val === 'object' && 'value' in val) ? val.value : val;
    if (key === 'bgmVolume') {
        const numeric = Number(rawValue);
        if (!Number.isFinite(numeric)) return 0.2;
        return Math.max(0, Math.min(0.2, numeric));
    }
    if (key === 'startMoney') {
        const numeric = Number(rawValue);
        return Number.isFinite(numeric) ? numeric : 0;
    }
    return rawValue;
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        const normalizedValue = sanitizeGameConfigValue(key, val);
        window.gameConfig[key] = normalizedValue;
        if (key === 'bgmVolume' && audioManager && audioManager.bgmNode) {
            audioManager.bgmNode.volume = normalizedValue;
        }
        if (key === 'startMoney' && state.money === 0) {
            state.money = normalizedValue;
        }
    }
};

// Resize Handling
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// Logic
function getUpgradeCost(u) {
    return Math.floor(u.baseCost * Math.pow(u.costMult, u.count));
}

function showFeedback(kind, message) {
    const caption = document.getElementById('feedback-caption');
    const successGif = document.getElementById('gif-success');
    const failGif = document.getElementById('gif-fail');
    if (!caption || !successGif || !failGif) return;

    caption.textContent = message;
    caption.classList.add('is-visible');
    successGif.classList.toggle('is-visible', kind === 'success');
    failGif.classList.toggle('is-visible', kind === 'fail');

    clearTimeout(feedbackTimeout);
    feedbackTimeout = setTimeout(() => {
        caption.classList.remove('is-visible');
        successGif.classList.remove('is-visible');
        failGif.classList.remove('is-visible');
    }, 1400);
}

function buyUpgrade(index) {
    const u = state.upgrades[index];
    const cost = getUpgradeCost(u);
    if (state.money >= cost) {
        state.money -= cost;
        u.count++;

        if (u.type === 'click') {
            state.clickPower += u.basePower;
        } else {
            state.autoRate += u.basePower;
            state.orbiters++;
        }

        audioManager.playSfx('upgrade', 120);
        createParticles(width / 2, height / 2, 20, '#ffffff');
        showFeedback('success', `${u.name} synced`);
        updateUI();
    } else {
        audioManager.playSfx('fail', 140);
        showFeedback('fail', 'Insufficient signal');
    }
}

function addMoney(amount, x, y, source = 'tap') {
    state.money += amount;

    state.floaters.push({
        x: x,
        y: y,
        text: `+$${Math.floor(amount)}`,
        life: 1.0,
        vy: -50
    });

    if (source === 'tap') {
        state.coreScale = 0.9;
        createParticles(x, y, 5, window.gameConfig.coreColor);
        audioManager.playSfx('coin');
    }
}

// Particle System
function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 100 + 50;
        state.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

// Render Loop
function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (state.autoRate > 0) {
        const amount = state.autoRate * dt;
        state.money += amount;

        if (Math.random() < 0.1 * state.orbiters) {
            createParticles(width / 2 + (Math.random() - 0.5) * 100, height / 2 + (Math.random() - 0.5) * 100, 1, window.gameConfig.orbiterColor);
        }
    }

    state.coreScale += (1 - state.coreScale) * 10 * dt;
    state.coreRotation += dt * 0.5;

    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) state.particles.splice(i, 1);
    }

    for (let i = state.floaters.length - 1; i >= 0; i--) {
        const f = state.floaters[i];
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0) state.floaters.splice(i, 1);
    }

    const cx = width / 2;
    const cy = height / 2;

    const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
    bgGradient.addColorStop(0, '#07101d');
    bgGradient.addColorStop(0.55, '#050b14');
    bgGradient.addColorStop(1, '#03070d');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    const horizon = ctx.createRadialGradient(cx, cy * 0.85, 40, cx, cy, Math.max(width, height) * 0.78);
    horizon.addColorStop(0, 'rgba(0, 243, 255, 0.1)');
    horizon.addColorStop(0.35, 'rgba(255, 0, 209, 0.06)');
    horizon.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = horizon;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.strokeStyle = 'rgba(30, 68, 120, 0.62)';
    ctx.lineWidth = 1;
    const gridOffset = (timestamp * 0.02) % 50;
    ctx.beginPath();
    for (let x = 0; x < width; x += 50) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
    }
    for (let y = gridOffset; y < height; y += 50) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
    }
    ctx.stroke();
    ctx.restore();

    ctx.save();
    for (let i = 0; i < 18; i++) {
        const starX = ((i * 131.7) + (timestamp * 0.01)) % width;
        const starY = (i * 83.4) % height;
        ctx.globalAlpha = 0.3 + ((i % 4) * 0.12);
        ctx.fillStyle = i % 3 === 0 ? 'rgba(141, 240, 255, 0.85)' : 'rgba(255,255,255,0.78)';
        ctx.beginPath();
        ctx.arc(starX, starY, i % 2 === 0 ? 1.2 : 1.8, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    if (state.orbiters > 0) {
        const orbitRadius = 120;
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 0, 209, 0.18)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = window.gameConfig.orbiterColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
        ctx.stroke();

        const orbiterCount = Math.min(state.orbiters, 20);
        for (let i = 0; i < orbiterCount; i++) {
            const angle = state.coreRotation * 2 + (i / orbiterCount) * Math.PI * 2;
            const ox = cx + Math.cos(angle) * orbitRadius;
            const oy = cy + Math.sin(angle) * orbitRadius;

            const orbiterGlow = ctx.createRadialGradient(ox, oy, 0, ox, oy, 16);
            orbiterGlow.addColorStop(0, 'rgba(255,255,255,0.95)');
            orbiterGlow.addColorStop(0.35, window.gameConfig.orbiterColor);
            orbiterGlow.addColorStop(1, 'rgba(255, 0, 209, 0)');
            ctx.fillStyle = orbiterGlow;
            ctx.beginPath();
            ctx.arc(ox, oy, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f7fbff';
            ctx.beginPath();
            ctx.arc(ox, oy, 3.8, 0, Math.PI * 2);
            ctx.fill();

            if (Math.random() < 0.05) {
                ctx.beginPath();
                ctx.moveTo(ox, oy);
                ctx.lineTo(cx, cy);
                ctx.strokeStyle = `rgba(255, 0, 255, ${Math.random() * 0.6})`;
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(state.coreScale, state.coreScale);
    ctx.rotate(state.coreRotation);

    const shellGlow = ctx.createRadialGradient(0, 0, 12, 0, 0, 120);
    shellGlow.addColorStop(0, 'rgba(255,255,255,0.26)');
    shellGlow.addColorStop(0.22, window.gameConfig.coreColor);
    shellGlow.addColorStop(0.8, 'rgba(0, 243, 255, 0.04)');
    shellGlow.addColorStop(1, 'rgba(0, 243, 255, 0)');
    ctx.fillStyle = shellGlow;
    ctx.beginPath();
    ctx.arc(0, 0, 120, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 34;
    ctx.shadowColor = window.gameConfig.coreColor;

    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const r = 60;
        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    const shellGradient = ctx.createLinearGradient(-60, -60, 60, 60);
    shellGradient.addColorStop(0, '#16253f');
    shellGradient.addColorStop(1, '#09111f');
    ctx.fillStyle = shellGradient;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = window.gameConfig.coreColor;
    ctx.stroke();

    ctx.rotate(-state.coreRotation * 1.7);
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    const coreGradient = ctx.createRadialGradient(-8, -10, 2, 0, 0, 34);
    coreGradient.addColorStop(0, '#ffffff');
    coreGradient.addColorStop(0.28, '#d8fbff');
    coreGradient.addColorStop(0.65, window.gameConfig.coreColor);
    coreGradient.addColorStop(1, 'rgba(0, 243, 255, 0.25)');
    ctx.fillStyle = coreGradient;
    ctx.fill();

    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();

    ctx.restore();

    ctx.shadowBlur = 0;
    for (const p of state.particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = '700 28px "Audiowide"';
    ctx.textAlign = 'center';
    for (const f of state.floaters) {
        ctx.fillStyle = `rgba(255, 215, 109, ${f.life})`;
        ctx.fillText(f.text, f.x, f.y);
    }

    if (timestamp % 10 < 1) {
        document.getElementById('score-display').textContent = Math.floor(state.money).toLocaleString();
        document.getElementById('mps-display').textContent = state.autoRate.toFixed(1);
        updateUpgradeButtons();
    }

    requestAnimationFrame(loop);
}

// DOM UI Generation
function initUI() {
    const list = document.getElementById('upgrade-menu').querySelector('.upgrade-list');
    list.innerHTML = '';

    state.upgrades.forEach((u, index) => {
        const item = document.createElement('div');
        item.className = 'upgrade-card';
        item.innerHTML = `
            <div class="upgrade-main">
                <div class="upgrade-icon">${u.icon}</div>
                <div class="upgrade-copy">
                    <div class="upgrade-name">${u.name}</div>
                    <div class="upgrade-meta">Lvl <span id="lvl-${index}">0</span> • +${u.basePower} ${u.type === 'click' ? '/tap' : '/sec'}</div>
                    <!-- [agent-note][stage1] role: future-audio | trigger: upgrade-purchase | intent: emphasize network expansion -->
                </div>
            </div>
            <button id="btn-${index}" class="btn-upgrade" onclick="buyUpgrade(${index})">
                $${getUpgradeCost(u)}
            </button>
        `;
        list.appendChild(item);
    });
}

function updateUpgradeButtons() {
    state.upgrades.forEach((u, index) => {
        const btn = document.getElementById(`btn-${index}`);
        const lvl = document.getElementById(`lvl-${index}`);
        const cost = getUpgradeCost(u);

        if (btn) {
            btn.innerHTML = `$${cost.toLocaleString()}`;
            btn.disabled = state.money < cost;
        }
        if (lvl) lvl.innerText = u.count;
    });
}

function updateUI() {
    document.getElementById('score-display').textContent = Math.floor(state.money).toLocaleString();
    updateUpgradeButtons();
}

// Input Handling
function handleInput(e) {
    e.preventDefault();
    if (!audioManager.isUnlocked) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cx = width / 2;
    const cy = height / 2;
    const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);

    if (dist < 150) {
        addMoney(state.clickPower, x, y, 'tap');
    }
}

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    try {
        const saved = JSON.parse(document.getElementById('game-config').textContent);
        Object.keys(saved).forEach((key) => {
            if (window.gameConfig.hasOwnProperty(key)) {
                window.gameConfig[key] = sanitizeGameConfigValue(key, saved[key]);
            }
        });
    } catch (e) {}

    audioManager = new AudioManager();
    resize();
    initUI();

    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.playSfx('start', 0);
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('upgrade-menu').classList.add('is-open');
        showFeedback('success', 'Neon core online');

        state.money = window.gameConfig.startMoney || 0;

        requestAnimationFrame(loop);
    });

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
});
</script>
