        :root {
            --stone-100: #f5f5f4;
            --stone-300: #d6d3d1;
            --stone-400: #a8a29e;
            --stone-500: #78716c;
            --stone-600: #57534e;
            --stone-700: #44403c;
            --stone-800: #292524;
            --stone-900: #1c1917;
            --stone-950: #0c0a09;
            --gold-100: #fef3c7;
            --gold-400: #fbbf24;
            --gold-500: #f59e0b;
            --gold-600: #d97706;
            --green-400: #4ade80;
            --red-400: #f87171;
            --purple-400: #c084fc;
            --black: #000000;
            --white: #ffffff;
            --space-950: #050816;
            --space-900: #0a1024;
            --space-800: #111a38;
            --nebula-cyan: #7dd3fc;
            --nebula-blue: #60a5fa;
            --nebula-violet: #a78bfa;
            --reactor-gold: #fbbf24;
            --reactor-ember: #fb7185;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(125, 211, 252, 0.14), transparent 28%),
                radial-gradient(circle at bottom, rgba(167, 139, 250, 0.12), transparent 30%),
                linear-gradient(180deg, var(--space-950), var(--space-900) 45%, #070b18 100%);
            color: var(--stone-100);
            font-family: 'Exo 2', sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(125, 211, 252, 0.12), transparent 18%),
                radial-gradient(circle at 80% 18%, rgba(251, 191, 36, 0.1), transparent 16%),
                radial-gradient(circle at 50% 82%, rgba(167, 139, 250, 0.12), transparent 22%);
            opacity: 0.9;
        }

        body::after {
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.75) 0 1px, transparent 1.2px),
                radial-gradient(circle, rgba(125,211,252,0.45) 0 1px, transparent 1.4px);
            background-size: 120px 120px, 180px 180px;
            background-position: 0 0, 40px 60px;
            opacity: 0.18;
        }

        /* UI Glassmorphism */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(20, 28, 58, 0.88), rgba(9, 14, 30, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(125, 211, 252, 0.2);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        .text-gold-gradient {
            background: linear-gradient(180deg, #fef3c7 0%, #fbbf24 45%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(251, 191, 36, 0.25));
        }

        .hud-shell {
            position: relative;
            overflow: hidden;
        }

        .hud-shell::after {
            content: "";
            position: absolute;
            inset: auto -10% -35% auto;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(125, 211, 252, 0.2), transparent 68%);
            pointer-events: none;
        }

        .core-frame {
            position: relative;
            width: min(70vw, 21rem);
            aspect-ratio: 1;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle, rgba(251, 191, 36, 0.14), rgba(10, 16, 36, 0.08) 45%, transparent 70%);
            box-shadow:
                0 0 0 1px rgba(125, 211, 252, 0.1),
                0 0 40px rgba(96, 165, 250, 0.12);
        }

        .core-frame::before,
        .core-frame::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            border: 1px solid rgba(125, 211, 252, 0.16);
            pointer-events: none;
        }

        .core-frame::before {
            inset: 10%;
            box-shadow: 0 0 24px rgba(125, 211, 252, 0.08);
        }

        .core-frame::after {
            inset: 1%;
            border-color: rgba(251, 191, 36, 0.14);
        }

        .core-pulse {
            position: absolute;
            inset: 18%;
            border-radius: 999px;
            background:
                radial-gradient(circle, rgba(251, 191, 36, 0.22), rgba(251, 113, 133, 0.08) 45%, transparent 70%);
            filter: blur(4px);
            animation: corePulse 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        .core-runes {
            position: absolute;
            inset: 6%;
            border-radius: 999px;
            border: 1px dashed rgba(167, 139, 250, 0.26);
            animation: spinHalo 16s linear infinite;
            pointer-events: none;
        }

        .core-runes::before,
        .core-runes::after {
            content: "✦";
            position: absolute;
            color: rgba(125, 211, 252, 0.8);
            font-size: 0.95rem;
            text-shadow: 0 0 12px rgba(125, 211, 252, 0.4);
        }

        .core-runes::before {
            top: 6%;
            left: 48%;
        }

        .core-runes::after {
            right: 12%;
            top: 50%;
        }

        .title-display {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .font-serif {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .upgrade-chip {
            position: absolute;
            top: 0.55rem;
            right: 0.75rem;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(125, 211, 252, 0.82);
        }

        /* Roman Numeral Stacking Logic */
        .vinculum {
            border-top: 2px solid currentColor;
            display: inline-block;
            line-height: 0.7;
            margin-top: 0.3em;
            padding: 0 2px;
        }
        .roman-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Interactive Elements */
        .btn-upgrade {
            position: relative;
            overflow: hidden;
            transition: all 0.15s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-upgrade:active { transform: scale(0.96); }
        .btn-upgrade:disabled { 
            opacity: 0.5; 
            filter: grayscale(1);
            transform: none;
            cursor: not-allowed;
        }

        .numeral-glow {
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
            transition: transform 0.05s;
        }
        .numeral-glow:active { transform: scale(0.92); }

        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-weight: 900;
            color: #fbbf24;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            z-index: 100;
            text-shadow: 0 2px 10px rgba(0,0,0,0.55);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<!-- Overlays -->
<div id="start-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-500">

<script>
/**
 * AUDIO SYSTEM (Web Audio + Fallback)
 */
class SoundManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.muted = false;
        this.initialized = false;
        this.lastPlayedAt = {};
        
        // Asset Map
        this.assets = {
            bgm: document.getElementById('bgm_main').src,
            click: document.getElementById('sfx_click').src,
            upgrade: document.getElementById('sfx_upgrade').src,
            win: document.getElementById('sfx_win').src,
            blocked: document.getElementById('sfx_blocked').src,
            start: document.getElementById('sfx_start').src,
            menu: document.getElementById('sfx_menu').src
        };
    }

    async init() {
        if (this.initialized) return;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            this.ctx = new AudioContext();
            // Preload SFX
            for (const [key, url] of Object.entries(this.assets)) {
                if (key !== 'bgm') this.loadBuffer(key, url);
            }
        }
        this.initialized = true;
    }

    async loadBuffer(key, url) {
        try {
            const res = await fetch(url);
            const arr = await res.arrayBuffer();
            this.buffers[key] = await this.ctx.decodeAudioData(arr);
        } catch (e) {
            console.warn('Audio load failed, using synth fallback', e);
        }
    }

    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playBGM() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        if (this.muted) {
            el.pause();
            return;
        }
        el.play().catch(() => {});
    }

    stopBGM() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSFX(key) {
        if (this.muted) return;

        const nowMs = performance.now();
        const debounceWindow = key === 'click' ? 45 : 120;
        if (this.lastPlayedAt[key] && nowMs - this.lastPlayedAt[key] < debounceWindow) {
            return;
        }
        this.lastPlayedAt[key] = nowMs;

        // Web Audio Path
        if (this.ctx && this.buffers[key]) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.buffers[key];
            const gain = this.ctx.createGain();
            const volumeMap = { click: 0.45, upgrade: 0.65, blocked: 0.5, win: 0.72, start: 0.6, menu: 0.45 };
            gain.gain.value = volumeMap[key] || 0.55;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } 
        // Fallback: HTML Audio
        else {
            const el = document.getElementById(`sfx_${key}`);
            if (el) {
                el.currentTime = 0;
                const volumeMap = { click: 0.45, upgrade: 0.65, blocked: 0.5, win: 0.72, start: 0.6, menu: 0.45 };
                el.volume = volumeMap[key] || 0.55;
                el.play().catch(() => {});
            } else {
                this.synthFallback(key);
            }
        }
    }

    synthFallback(key) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        const now = this.ctx.currentTime;
        if (key === 'click') {
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    toggleMute() {
        this.muted = !this.muted;
        const el = document.getElementById('bgm_main');
        if (this.muted) el.pause();
        else {
            if (this.ctx) this.ctx.resume();
            if (state.isPlaying) this.playBGM();
        }
        document.getElementById('icon-sound-on').classList.toggle('hidden', this.muted);
        document.getElementById('icon-sound-off').classList.toggle('hidden', !this.muted);
    }
}

const sound = new SoundManager();
let feedbackTimers = {};

/**
 * GAME LOGIC
 */
const CONFIG = {
    numerals: ["I", "V", "X", "L", "C", "D", "M"],
    winGoal: 1000000000000
};

const state = {
    score: 0,
    clickPower: 1,
    autoRate: 0,
    isPlaying: false,
    lastTime: 0,
    accumulator: 0,
    numeralIndex: 0,
    upgrades: [
        { id: 'click2', name: 'Twin Pulse', icon: '⚔️', type: 'mult', val: 2, cost: 50, level: 0, costMult: 3.5, desc: 'x2 Core Charge' },
        { id: 'auto1', name: 'Micro Drone', icon: '🛡️', type: 'auto', val: 1, cost: 100, level: 0, costMult: 1.4, desc: '+1 / sec' },
        { id: 'mega', name: 'Nova Burst', icon: '🔥', type: 'mult', val: 5, cost: 25000, level: 0, costMult: 5, desc: 'x5 Core Charge', color: 'text-red-400' },
        { id: 'auto2', name: 'Fabricator', icon: '🏛️', type: 'auto', val: 10, cost: 1000, level: 0, costMult: 1.4, desc: '+10 / sec' },
        { id: 'super', name: 'Quasar Tap', icon: '⚡', type: 'mult', val: 10, cost: 10000000, level: 0, costMult: 10, desc: 'x10 Core Charge', color: 'text-purple-400' },
        { id: 'auto3', name: 'Orbital Array', icon: '👑', type: 'auto', val: 50, cost: 5000, level: 0, costMult: 1.5, desc: '+50 / sec' },
        { id: 'auto4', name: 'Dyson Ring', icon: '🦅', type: 'auto', val: 10000, cost: 1000000, level: 0, costMult: 1.6, desc: '+10K / sec' }
    ]
};

// Recursive Roman Numeral Generator
function toRoman(num) {
    if (num <= 0) return "NULLA";
    if (num >= 4000) {
        const thousands = Math.floor(num / 1000);
        const remainder = num % 1000;
        const remStr = remainder > 0 ? toRoman(remainder) : "";
        return `<span class="vinculum">${toRoman(thousands)}</span>${remStr}`;
    }
    
    const map = [
        {v:1000,c:'M'}, {v:900,c:'CM'}, {v:500,c:'D'}, {v:400,c:'CD'},
        {v:100,c:'C'}, {v:90,c:'XC'}, {v:50,c:'L'}, {v:40,c:'XL'},
        {v:10,c:'X'}, {v:9,c:'IX'}, {v:5,c:'V'}, {v:4,c:'IV'}, {v:1,c:'I'}
    ];
    let res = '';
    for (let r of map) {
        while (num >= r.v) { res += r.c; num -= r.v; }
    }
    return res;
}

function showFeedback(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    clearTimeout(feedbackTimers[id]);
    feedbackTimers[id] = setTimeout(() => el.classList.remove('show'), duration);
}

function initUpgrades() {
    const list = document.getElementById('upgrade-list');
    state.upgrades.forEach((u, idx) => {
        const btn = document.createElement('button');
        btn.id = `btn-${u.id}`;
        btn.className = 'btn-upgrade w-full bg-stone-800/60 hover:bg-stone-800 rounded-xl p-3 flex items-center gap-4 group';
        btn.innerHTML = `
            <div class="w-12 h-12 rounded-lg bg-stone-900/50 flex items-center justify-center border border-white/10 text-2xl group-active:scale-90 transition shadow-inner">
                ${u.icon}
            </div>
            <div class="flex-1 text-left overflow-hidden">
                <div class="upgrade-chip">Forge</div>
                <div class="font-bold text-stone-200 truncate ${u.color || ''}">${u.name}</div>
                <div class="text-xs text-stone-400">${u.desc}</div>
            </div>
            <div class="text-right min-w-[80px]">
                <div class="text-sm font-bold text-gold-400 roman-text" id="cost-${u.id}"></div>
                <div class="text-[10px] text-stone-500">LVL <span id="lvl-${u.id}" class="roman-text"></span></div>
            </div>
        `;
        
        // Touch handling
        const buy = () => {
            if (state.score >= u.cost) {
                state.score -= u.cost;
                u.level++;
                
                if (u.type === 'mult') {
                    state.clickPower *= u.val;
                } else {
                    state.autoRate += u.val;
                }
                
                u.cost = Math.floor(u.cost * u.costMult);
                sound.playSFX('upgrade');
                showFeedback('feedback-burst', 700);
                updateUI();
            } else {
                sound.playSFX('blocked');
            }
        };

        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            buy();
        });
        
        list.appendChild(btn);
    });
}

function updateUI() {
    document.getElementById('score-display').innerHTML = toRoman(Math.floor(state.score));
    document.getElementById('gps-display').innerHTML = toRoman(state.autoRate);
    
    state.upgrades.forEach(u => {
        const btn = document.getElementById(`btn-${u.id}`);
        btn.disabled = state.score < u.cost;
        document.getElementById(`cost-${u.id}`).innerHTML = toRoman(u.cost);
        document.getElementById(`lvl-${u.id}`).innerHTML = toRoman(u.level);
    });
}

function spawnFloat(x, y, val) {
    const el = document.createElement('div');
    el.className = 'float-text text-2xl';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = '+' + toRoman(val);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

/**
 * CANVAS & RENDERER
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let bgRotation = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);

function createParticle(x, y) {
    for(let i=0; i<6; i++) {
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*15,
            vy: (Math.random()-0.5)*15,
            life: 1.0,
            color: Math.random()>0.5 ? '#fbbf24' : '#fff'
        });
    }
}

function drawBackground(dt) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const cx = w/2;
    const cy = h/2;
    
    bgRotation += 0.1 * dt;

    // Layer 1: Parallax Stars
    ctx.fillStyle = '#fff';
    for(let i=0; i<30; i++) {
        const a = i * 0.5 + bgRotation * 0.2;
        const r = 100 + i * 15;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        ctx.globalAlpha = 0.1;
        ctx.beginPath();
        ctx.arc(px, py, 1, 0, Math.PI*2);
        ctx.fill();
    }

    // Layer 2: Armillary Rings
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1;
    
    // Ring 1
    ctx.globalAlpha = 0.05;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 150, Math.max(1, Math.abs(150 * Math.sin(bgRotation))), bgRotation, 0, Math.PI*2);
    ctx.stroke();

    // Ring 2
    ctx.beginPath();
    ctx.ellipse(cx, cy, 250, Math.max(1, Math.abs(250 * Math.cos(bgRotation*0.5))), -bgRotation*0.5, 0, Math.PI*2);
    ctx.stroke();

    // Ring 3
    ctx.globalAlpha = 0.03;
    ctx.beginPath();
    ctx.arc(cx, cy, 350 + Math.sin(bgRotation)*20, 0, Math.PI*2);
    ctx.stroke();
}

function loop(t) {
    if (!state.isPlaying) return;
    
    const dt = Math.min((t - state.lastTime) / 1000, 0.1);
    state.lastTime = t;

    // Logic
    if (state.autoRate > 0) {
        state.accumulator += state.autoRate * dt;
        if (state.accumulator >= 1) {
            const gain = Math.floor(state.accumulator);
            state.score += gain;
            state.accumulator -= gain;
            updateUI();
        }
    }

    if (state.score >= CONFIG.winGoal) {
        state.isPlaying = false;
        sound.stopBGM();
        sound.playSFX('win');
        showFeedback('feedback-victory', 2600);
        document.getElementById('victory-screen').classList.remove('hidden');
    }

    // Render
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    drawBackground(dt);

    // Particles
    for (let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 2.0 * dt;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
}

/**
 * INIT
 */
document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    const cfgScript = document.getElementById('game-config');
    if (cfgScript) {
        try {
            const cfg = JSON.parse(cfgScript.textContent);
            if (cfg.winGoal) CONFIG.winGoal = cfg.winGoal.value;
            if (cfg.gameTitle) document.title = cfg.gameTitle.value;
        } catch(e) {}
    }

    resize();
    initUpgrades();
    
    // Pointer Events
    const zone = document.getElementById('click-zone');
    zone.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sound.unlock();
        
        // Logic
        state.score += state.clickPower;
        sound.playSFX('click');
        showFeedback('feedback-burst', 420);
        
        // Visuals
        const rect = zone.getBoundingClientRect();
        const x = e.clientX - rect.left + rect.left; // Global coords
        const y = e.clientY - rect.top + rect.top;
        createParticle(x, y);
        spawnFloat(x, y, state.clickPower);
        
        state.numeralIndex = (state.numeralIndex + 1) % CONFIG.numerals.length;
        document.getElementById('main-numeral').innerText = CONFIG.numerals[state.numeralIndex];
        
        updateUI();
    });

    document.getElementById('btn-start').addEventListener('click', () => {
        sound.init().then(() => {
            sound.unlock();
            sound.playSFX('start');
            sound.playBGM();
        });
        document.getElementById('start-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('start-screen').classList.add('hidden'), 500);
        state.isPlaying = true;
        state.lastTime = performance.now();
        requestAnimationFrame(loop);
    });

    document.getElementById('btn-restart').addEventListener('click', () => location.reload());
    document.getElementById('btn-mute').addEventListener('click', () => {
        sound.playSFX('menu');
        sound.toggleMute();
    });
});

</script>
