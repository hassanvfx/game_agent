<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Puppy Panic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        :root {
            --rose-200: #fecdd3;
            --rose-400: #fb7185;
            --rose-500: #f43f5e;
            --rose-600: #e11d48;
            --rose-700: #be123c;
            --pink-100: #fce7f3;
            --pink-200: #fbcfe8;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --blue-300: #93c5fd;
            --blue-400: #60a5fa;
            --blue-500: #3b82f6;
            --blue-700: #1d4ed8;
            --gold-300: #fcd34d;
            --gold-400: #fbbf24;
            --cream: #fff7ed;
            --ink: #3c2348;
            --white-50: rgba(255, 255, 255, 0.5);
            --white-60: rgba(255, 255, 255, 0.6);
            --panel-shadow: 0 18px 50px -18px rgba(190, 36, 76, 0.38);
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
            font-family: 'Rajdhani', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.85), transparent 35%),
                linear-gradient(180deg, #ffe4ef 0%, #ffd4e3 45%, #ffc6d6 100%);
            background-color: #FDF2F8;
            color: var(--ink);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.85), transparent 20%),
                radial-gradient(circle at 80% 10%, rgba(255,255,255,0.65), transparent 18%),
                linear-gradient(to bottom, #ffe8f2 0%, var(--pink-100) 28%, var(--rose-200) 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 10% 78%, rgba(255,255,255,0.25), transparent 14%),
                radial-gradient(circle at 86% 72%, rgba(255,255,255,0.22), transparent 18%);
            opacity: 0.9;
        }

        #game-container::after {
            inset: auto 0 0;
            height: 26%;
            background:
                radial-gradient(circle at 12% 40%, rgba(255,255,255,0.18), transparent 22%),
                linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.12) 25%, rgba(255, 228, 184, 0.4) 26%, rgba(255, 214, 122, 0.7) 100%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 3;
        }

        .feedback-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(1rem);
            top: calc(env(safe-area-inset-top, 0px) + 0.9rem);
            background: rgba(255, 247, 237, 0.92);
            color: var(--rose-700);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            padding: 0.55rem 1rem;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 10px 30px -16px rgba(190, 36, 76, 0.55);
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .feedback-badge.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reaction-gif {
            position: absolute;
            width: min(34vw, 9rem);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1.25rem;
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 16px 30px -18px rgba(60, 35, 72, 0.55);
            opacity: 0;
            transform: scale(0.82);
            transition: opacity 0.22s ease, transform 0.22s ease;
            background: rgba(255,255,255,0.4);
        }

        .reaction-gif.show {
            opacity: 0.95;
            transform: scale(1);
        }

        #celebration-gif {
            right: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.6rem);
        }

        #oops-gif {
            left: 1rem;
            bottom: max(1rem, env(safe-area-inset-bottom, 0px) + 0.6rem);
        }

        #hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem 1.5rem 0;
        }

        #hud.hidden,
        .hidden {
            display: none !important;
        }

        #score-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateZ(0);
            transition: transform 0.2s ease;
        }

        #lives-container {
            display: flex;
            gap: 0.25rem;
        }

        .screen-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .screen-card {
            text-align: center;
            pointer-events: auto;
            width: min(100%, 24rem);
            padding: 2rem;
            border-radius: 2rem;
        }

        .floating-card {
            animation: float 3s ease-in-out infinite;
        }

        .hero-icon {
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 8px 12px rgba(190, 36, 76, 0.2));
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: 'Bangers', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            line-height: 0.9;
            letter-spacing: 0.08em;
            color: var(--rose-500);
            text-shadow: 0 2px 6px rgba(255,255,255,0.45);
        }

        .body-copy {
            margin: 0 0 2rem;
            color: var(--gray-600);
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 0.03em;
        }

        .action-btn {
            width: 100%;
            border: 0;
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.35rem;
            letter-spacing: 0.06em;
            padding: 1rem;
            border-radius: 0.9rem;
            box-shadow: 0 10px 18px -10px rgba(0, 0, 0, 0.35);
            transform: translateZ(0);
            transition: transform 0.15s ease, background-color 0.15s ease, filter 0.15s ease;
            cursor: pointer;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn-primary {
            background: var(--rose-500);
            border-bottom: 4px solid var(--rose-700);
        }

        .action-btn-primary:hover {
            background: var(--rose-400);
        }

        .action-btn-secondary {
            background: var(--blue-500);
            border-bottom: 4px solid var(--blue-700);
        }

        .action-btn-secondary:hover {
            background: var(--blue-400);
        }

        .result-title {
            margin: 0 0 0.5rem;
            color: var(--gray-700);
            font-family: 'Bangers', cursive;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: 0.06em;
        }

        .result-copy {
            margin: 0 0 1.5rem;
            color: var(--gray-500);
            font-size: 1.05rem;
            line-height: 1.4;
            letter-spacing: 0.03em;
        }

        .score-panel {
            background: var(--white-50);
            border: 1px solid var(--white-60);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .score-label {
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
        }

        .score-value {
            color: var(--rose-500);
            font-family: 'Bangers', cursive;
            font-size: clamp(2.8rem, 10vw, 4rem);
            line-height: 1;
        }

        .hud-pill {
            min-width: 5.5rem;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
        }

        .hud-score {
            color: var(--rose-700);
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            line-height: 1;
        }

        .hud-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 3px 4px rgba(255,255,255,0.5));
        }

        .heart-icon {
            font-size: 1.9rem;
            filter: drop-shadow(0 4px 6px rgba(255,255,255,0.55));
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .screen-card::before {
            content: "";
            position: absolute;
            inset: 0.6rem;
            border-radius: 1.45rem;
            border: 2px dashed rgba(255,255,255,0.45);
            pointer-events: none;
        }

        .screen-card {
            position: relative;
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }

        .screen-card > * {
            position: relative;
            z-index: 1;
        }

        .screen-card::after {
            content: "";
            position: absolute;
            inset: auto -10% -15% auto;
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.42), rgba(255,255,255,0));
            pointer-events: none;
        }

        .action-btn:hover {
            filter: brightness(1.06);
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 246, 251, 0.62));
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(244, 114, 182, 0.5);
        }

        .heart-beat { animation: heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .float-anim { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Safe area for notched phones */
        .safe-padding {
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        @media (max-width: 640px) {
            #hud {
                padding: 0.8rem 0.9rem 0;
            }

            .screen-card {
                width: min(100%, 21rem);
                padding: 1.5rem 1.2rem;
                border-radius: 1.5rem;
            }

            .hero-icon {
                font-size: 3.8rem;
            }

            .body-copy {
                font-size: 1rem;
            }

            .action-btn {
                font-size: 1.15rem;
                padding: 0.9rem;
            }

            .hud-pill {
                min-width: 4.8rem;
                padding: 0.45rem 0.9rem;
            }

            .hud-score,
            .hud-icon,
            .heart-icon {
                font-size: 1.5rem;
            }

            .feedback-badge {
                top: calc(env(safe-area-inset-top, 0px) + 0.7rem);
                padding: 0.45rem 0.75rem;
                font-size: 0.8rem;
            }

            .reaction-gif {
                width: min(32vw, 6.6rem);
                border-radius: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="feedback-layer" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: affection/fail feedback -> catalogs/gifs.json -->
            <div id="feedback-badge" class="feedback-badge">Ready to cheer!</div>
            <img id="celebration-gif" class="reaction-gif" alt="Celebration reaction">
            <img id="oops-gif" class="reaction-gif" alt="Oops reaction">
        </div>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="safe-padding">
            
            <!-- HUD -->
            <div id="hud" class="hidden">
                <!-- Score -->
                <div class="glass-panel hud-pill" id="score-container">
                    <span class="hud-icon">🦴</span> 
                    <span id="score" class="hud-score">0</span>
                </div>
                
                <!-- Lives -->
                <div id="lives-container">
                    <span class="heart-icon">❤️</span>
                    <span class="heart-icon">❤️</span>
                    <span class="heart-icon">❤️</span>
                </div>
            </div>

            <!-- Center Content (Start/End) -->
            <div class="screen-wrap">
                
                <!-- Start Screen -->
                <div id="start-screen" class="glass-panel screen-card floating-card">
                    <div class="hero-icon heart-beat">🐶</div>
                    <h1 class="title">Puppy Panic</h1>
                    <p class="body-copy">
                        Cheer up every puppy on patrol.<br>
                        Tap fast before they wander off.<br>
                        Miss three and the round is over.
                    </p>
                    <button id="start-btn" class="action-btn action-btn-primary">
                        START ROUND
                    </button>
                </div>

                <!-- Game Over Screen -->
                <div id="game-over-screen" class="hidden glass-panel screen-card">
                    <div class="hero-icon">💔</div>
                    <h2 class="result-title">Shift Over</h2>
                    <p class="result-copy">Too many puppies slipped away before you could cheer them up.</p>
                    
                    <div class="score-panel">
                        <div class="score-label">Pups Saved</div>
                        <div class="score-value" id="finalScore">0</div>
                    </div>

                    <button id="restart-btn" class="action-btn action-btn-secondary">
                        PLAY AGAIN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    /** 
     * PUPPY PANIC
     * Core Loop: Whac-A-Mole style. Tap puppies to cheer them up before they wander off.
     */
    
    document.addEventListener('DOMContentLoaded', () => {
        // --- ASSETS ---
        const ASSETS = {
            // [agent-note][stage3] resolved-audio: loop + ui + collect + fail from catalogs/audios.json
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            gifs: {
                cheer: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                oops: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            },
            sfx: {
                pet: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                combo: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
                lifeLost: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            }
        };

        // --- AUDIO SYSTEM ---
        class AudioController {
            constructor() {
                this.enabled = true;
                this.unlocked = false;
                this.poolSize = 3;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {};
                this.sfxPools = {};
                this.sfxVolumes = {
                    pet: 0.42,
                    combo: 0.42,
                    lifeLost: 0.5,
                    warning: 0.35,
                    start: 0.45,
                    restart: 0.34,
                    gameOver: 0.46
                };

                for (const [key, src] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(src, { volume: this.sfxVolumes[key] ?? 0.4 });
                    this.sfxPools[key] = Array.from({ length: this.poolSize }, () =>
                        this.createAudio(src, { volume: this.sfxVolumes[key] ?? 0.4 })
                    );
                }
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.loop = Boolean(options.loop);
                audio.volume = options.volume ?? 0.4;
                return audio;
            }

            unlock() {
                if (!this.enabled || this.unlocked) return;
                this.unlocked = true;
                this.bgm.load();
                Object.values(this.sfx).forEach(sample => sample.load());
            }

            playBGM() {
                if (!this.enabled || !this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.unlocked || !this.sfxPools[key]) return;
                const pool = this.sfxPools[key];
                const candidate = pool.find(sample => sample.paused || sample.ended) || pool[0];
                try {
                    candidate.currentTime = 0;
                    candidate.play().catch(() => {});
                } catch (_) {}
            }
        }
        const audio = new AudioController();

        // --- CANVAS & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        
        let width, height;
        let gameActive = false;
        let frame = 0;
        let score = 0;
        let lives = 3;
        
        // Difficulty Parameters
        let spawnRate = 100; // Frames between spawns
        let dogStayDuration = 180; // How long dogs stay
        
        // Entities
        let dogs = [];
        let particles = [];
        let clouds = [];
        let feedbackTimeout;
        let celebrationTimeout;
        let oopsTimeout;

        // --- RESIZE HANDLING ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Re-init clouds if needed or just let them be
            if(clouds.length === 0) initClouds();
        }
        window.addEventListener('resize', resize);

        // --- CLASSES ---

        class Cloud {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.3);
                this.speed = 0.1 + Math.random() * 0.2;
                this.size = 30 + Math.random() * 40;
                this.opacity = 0.5 + Math.random() * 0.3;
            }
            update() {
                this.x += this.speed;
                if (this.x > width + 100) this.x = -100;
            }
            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.8, this.y + this.size * 0.1, this.size * 0.7, 0, Math.PI * 2);
                ctx.arc(this.x - this.size * 0.8, this.y + this.size * 0.1, this.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -2 - Math.random() * 3;
                this.life = 1.0;
                this.type = type; // 'love', 'sad'
                this.size = 20 + Math.random() * 10;
                this.rotation = Math.random() * 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
                this.rotation += 0.05;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (this.type === 'love') ctx.fillText('❤️', 0, 0);
                else if (this.type === 'sad') ctx.fillText('💔', 0, 0);
                else ctx.fillText('✨', 0, 0);
                
                ctx.restore();
            }
        }

        class Dog {
            constructor() {
                this.x = Math.random() * (width - 100) + 50;
                this.y = Math.random() * (height - 250) + 150;
                this.radius = 45;
                
                // Visual traits
                const colors = ['#D97706', '#92400E', '#FBBF24', '#E5E7EB', '#78350F']; // Amber, Brown, Yellow, White, Dark
                this.mainColor = colors[Math.floor(Math.random() * colors.length)];
                this.earType = Math.random() > 0.5 ? 'floppy' : 'pointy';
                this.bandanaColor = ['#ef4444', '#f472b6', '#60a5fa', '#34d399'][Math.floor(Math.random() * 4)];
                
                // Lifecycle: 0=popIn, 1=wait, 2=popOut, 3=done
                this.state = 0; 
                this.scale = 0;
                this.timer = 0;
                this.maxWait = dogStayDuration; 
                this.wobbleOffset = Math.random() * 100;
                
                this.isPetted = false;
            }

            update() {
                // Bobbing
                this.yOffset = Math.sin((frame + this.wobbleOffset) * 0.1) * 5;

                if (this.state === 0) { // Pop In
                    this.scale += 0.1;
                    if (this.scale >= 1.1) {
                        this.scale = 1.0;
                        this.state = 1; // Wait
                    }
                } else if (this.state === 1) { // Wait
                    this.timer++;
                    // Shake if about to leave
                    if (this.timer > this.maxWait * 0.7) {
                        this.x += (Math.random() - 0.5) * 2; // Nervous shake
                    }
                    if (this.timer >= this.maxWait) {
                        this.state = 2; // Leave (Sad)
                    }
                } else if (this.state === 2) { // Pop Out
                    this.scale -= 0.1;
                    if (this.scale <= 0) {
                        this.scale = 0;
                        this.state = 3; // Done
                    }
                }
            }

            draw(ctx) {
                if (this.scale <= 0) return;
                
                ctx.save();
                ctx.translate(this.x, this.y + this.yOffset);
                ctx.scale(this.scale, this.scale);

                // Shadow
                ctx.fillStyle = 'rgba(125, 67, 42, 0.14)';
                ctx.beginPath();
                ctx.ellipse(0, 54, 30, 11, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = this.mainColor; 
                // Darken ears slightly
                ctx.filter = 'brightness(0.9)';
                if (this.earType === 'floppy') {
                    ctx.beginPath(); ctx.ellipse(-35, -10, 15, 30, 0.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(35, -10, 15, 30, -0.5, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(-20, -30); ctx.lineTo(-45, -60); ctx.lineTo(-50, -20); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(20, -30); ctx.lineTo(45, -60); ctx.lineTo(50, -20); ctx.fill();
                }
                ctx.filter = 'none';

                // Head
                const headGradient = ctx.createRadialGradient(-10, -18, 6, 0, 0, 50);
                headGradient.addColorStop(0, '#fff7ed');
                headGradient.addColorStop(0.18, this.mainColor);
                headGradient.addColorStop(1, this.mainColor);
                ctx.fillStyle = headGradient;
                ctx.beginPath();
                ctx.arc(0, 0, 45, 0, Math.PI * 2);
                ctx.fill();

                // Cheeks
                ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
                ctx.beginPath();
                ctx.arc(-18, 13, 7, 0, Math.PI * 2);
                ctx.arc(18, 13, 7, 0, Math.PI * 2);
                ctx.fill();

                // Snout area
                ctx.fillStyle = '#FFF7ED'; // Cream
                ctx.beginPath();
                ctx.ellipse(0, 15, 22, 16, 0, 0, Math.PI * 2);
                ctx.fill();

                // Nose
                ctx.fillStyle = '#374151'; // Dark gray
                ctx.beginPath();
                ctx.arc(0, 10, 6, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#1F2937';
                ctx.beginPath();
                ctx.arc(-18, -5, 6, 0, Math.PI * 2);
                ctx.arc(18, -5, 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Eye Shine
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(-16, -7, 2, 0, Math.PI * 2);
                ctx.arc(20, -7, 2, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                ctx.beginPath();
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.arc(0, 20, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Bandana
                ctx.fillStyle = this.bandanaColor;
                ctx.beginPath();
                ctx.moveTo(-22, 26);
                ctx.lineTo(22, 26);
                ctx.lineTo(12, 38);
                ctx.lineTo(-12, 38);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.26)';
                ctx.fillRect(-16, 28, 32, 4);

                // Tongue (if waiting long)
                if (this.state === 1 && this.timer > 20) {
                     ctx.fillStyle = '#FB7185';
                     ctx.beginPath();
                     ctx.arc(0, 26, 5, 0, Math.PI, false);
                     ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- GAME LOGIC ---

        function initClouds() {
            clouds = [];
            for(let i=0; i<6; i++) clouds.push(new Cloud());
        }

        resize();

        function showBadge(message, mood = 'cheer') {
            const badge = document.getElementById('feedback-badge');
            badge.textContent = message;
            badge.style.color = mood === 'oops' ? 'var(--blue-700)' : 'var(--rose-700)';
            badge.classList.add('show');
            clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => badge.classList.remove('show'), 900);
        }

        function showReaction(kind) {
            const id = kind === 'oops' ? 'oops-gif' : 'celebration-gif';
            const gif = document.getElementById(id);
            gif.src = kind === 'oops' ? ASSETS.gifs.oops : ASSETS.gifs.cheer;
            gif.classList.add('show');
            const timerName = kind === 'oops' ? 'oopsTimeout' : 'celebrationTimeout';
            clearTimeout(timerName === 'oopsTimeout' ? oopsTimeout : celebrationTimeout);
            const timer = setTimeout(() => gif.classList.remove('show'), 1100);
            if (timerName === 'oopsTimeout') oopsTimeout = timer;
            else celebrationTimeout = timer;
        }

        function initGame() {
            score = 0;
            lives = 3;
            frame = 0;
            spawnRate = 90;
            dogStayDuration = 180;
            dogs = [];
            particles = [];
            document.getElementById('feedback-badge').classList.remove('show');
            document.getElementById('celebration-gif').classList.remove('show');
            document.getElementById('oops-gif').classList.remove('show');
            
            updateHUD();
            showBadge('Cheer every puppy!', 'cheer');
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            const hearts = document.querySelectorAll('.heart-icon');
            hearts.forEach((h, i) => {
                h.style.opacity = i < lives ? '1' : '0.2';
                h.style.transform = i < lives ? 'scale(1)' : 'scale(0.8)';
            });
        }

        function spawnDog() {
            let d = new Dog();
            // Simple overlap check
            let safe = true;
            for (let other of dogs) {
                let dist = Math.hypot(d.x - other.x, d.y - other.y);
                if (dist < 110) safe = false; // 45 radius * 2 + buffer
            }
            if (safe) {
                dogs.push(d);
            }
        }

        function loseLife(x, y) {
            lives--;
            updateHUD();
            audio.playSFX('lifeLost');
            if (lives === 1) audio.playSFX('warning');
            showBadge(lives > 0 ? 'A pup slipped away!' : 'Shift is over!', 'oops');
            showReaction('oops');
            
            // Spawn broken heart
            particles.push(new Particle(x, y, 'sad'));

            // Screen shake effect
            const container = document.getElementById('game-container');
            container.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
            setTimeout(() => container.style.transform = 'none', 100);

            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            showBadge('Puppies need a new round', 'oops');
        }

        function gameLoop() {
            if (!gameActive) return;
            frame++;

            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Clouds
            clouds.forEach(c => { c.update(); c.draw(ctx); });

            // Difficulty Scaling
            if (frame % 300 === 0) {
                if (spawnRate > 40) spawnRate -= 5;
                if (dogStayDuration > 60) dogStayDuration -= 5;
            }

            // Spawning
            if (frame % Math.floor(spawnRate) === 0) {
                spawnDog();
            }

            // Update Dogs (Sort by Y for depth)
            dogs.sort((a, b) => a.y - b.y);
            
            for (let i = dogs.length - 1; i >= 0; i--) {
                let d = dogs[i];
                d.update();
                d.draw(ctx);

                // Check if dog left unloved
                if (d.state === 3) {
                    if (!d.isPetted) {
                        loseLife(d.x, d.y);
                    }
                    dogs.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function handleInput(e) {
            if (!gameActive) return;
            
            // Get coordinates
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.changedTouches) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Check hits (topmost first)
            let hit = false;
            for (let i = dogs.length - 1; i >= 0; i--) {
                let d = dogs[i];
                // Only tappable if visible
                if (d.scale > 0.5 && !d.isPetted) {
                    let dx = x - d.x;
                    let dy = y - (d.y + d.yOffset);
                    let dist = Math.hypot(dx, dy);

                    if (dist < 60) { // Generous hitbox
                        // Success
                        d.isPetted = true;
                        d.state = 2; // Force leave immediately (Happy)
                        d.scale = 1.2; // Pop effect
                        
                        score++;
                        updateHUD();
                        audio.playSFX('pet');
                        if (score % 5 === 0) audio.playSFX('combo');
                        showBadge(score % 5 === 0 ? 'Puppy combo!' : 'Tail wag saved!', 'cheer');
                        showReaction('cheer');
                        
                        // Spawn particles
                        for(let k=0; k<5; k++) particles.push(new Particle(d.x, d.y, 'love'));
                        
                        hit = true;
                        break; // One tap per dog
                    }
                }
            }
        }

        // --- CONTROLS ---
        // Mouse
        canvas.addEventListener('mousedown', handleInput);
        // Touch
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scroll/zoom
            handleInput(e);
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('restart');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            gameLoop();
        });
    });
    </script>
</body>
</html>
