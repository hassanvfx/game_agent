<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Defense</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | title=Orbitron ui=Exo 2 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060816;
            --bg-deep: #03040b;
            --panel: rgba(10, 16, 34, 0.82);
            --panel-strong: rgba(14, 24, 48, 0.94);
            --accent: #31f3ff;
            --accent-soft: #9af8ff;
            --signal: #7af542;
            --warn: #ff5d8f;
            --bolt: #ffe76a;
            --text: #f4fbff;
            --muted: #89a7bf;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(49, 243, 255, 0.18), transparent 34%),
                radial-gradient(circle at bottom, rgba(122, 245, 66, 0.10), transparent 30%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 4px);
            opacity: 0.18;
            mix-blend-mode: screen;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            background:
                linear-gradient(180deg, rgba(20, 30, 59, 0.88), rgba(5, 10, 22, 0.92));
            backdrop-filter: blur(14px);
            border: 1px solid rgba(154, 248, 255, 0.22);
            box-shadow:
                0 0 0 1px rgba(49, 243, 255, 0.06) inset,
                0 0 28px rgba(49, 243, 255, 0.14);
        }
        .neon-text {
            text-shadow:
                0 0 10px currentColor,
                0 0 18px rgba(49, 243, 255, 0.22);
        }
        .hidden { display: none !important; }
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            margin-bottom: 0.35rem;
            border: 1px solid rgba(154, 248, 255, 0.16);
            background: rgba(8, 13, 28, 0.78);
            box-shadow: 0 0 16px rgba(49, 243, 255, 0.1);
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.06em;
        }
        .hud-label {
            color: var(--muted);
            font-size: 0.95rem;
        }
        .hud-value {
            color: var(--accent-soft);
            font-size: 1.15rem;
        }
        .hero-frame {
            position: relative;
            width: min(42vw, 14rem);
            aspect-ratio: 1;
            margin-bottom: 1rem;
            border-radius: 999px;
            border: 2px solid rgba(154, 248, 255, 0.32);
            background:
                radial-gradient(circle at 35% 30%, rgba(154, 248, 255, 0.3), transparent 32%),
                radial-gradient(circle at 50% 50%, rgba(49, 243, 255, 0.15), transparent 58%),
                rgba(4, 10, 24, 0.82);
            box-shadow:
                0 0 36px rgba(49, 243, 255, 0.22),
                inset 0 0 24px rgba(154, 248, 255, 0.1);
            overflow: hidden;
        }
        .hero-frame::before,
        .hero-frame::after {
            content: "";
            position: absolute;
            inset: 14%;
            border-radius: 999px;
            border: 1px solid rgba(154, 248, 255, 0.18);
        }
        .hero-frame::after {
            inset: 24%;
            border-style: dashed;
            animation: spin-halo 10s linear infinite;
        }
        .hero-core,
        .hero-core::before,
        .hero-core::after {
            position: absolute;
            border-radius: 999px;
        }
        .hero-core {
            inset: 32%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0 16%, var(--accent-soft) 16% 42%, #0ac2d0 42% 100%);
            box-shadow: 0 0 28px rgba(49, 243, 255, 0.55);
        }
        .hero-core::before {
            content: "";
            inset: -34%;
            border: 0.45rem solid rgba(49, 243, 255, 0.78);
            border-right-color: transparent;
            border-bottom-color: rgba(122, 245, 66, 0.85);
            animation: spin-halo 3.8s linear infinite;
        }
        .hero-core::after {
            content: "";
            inset: -70%;
            border: 0.18rem solid rgba(255, 231, 106, 0.5);
            border-left-color: transparent;
            animation: spin-halo 5.4s linear infinite reverse;
        }
        .hero-face {
            position: absolute;
            inset: 0;
        }
        .hero-eye {
            position: absolute;
            top: 38%;
            width: 0.5rem;
            height: 0.9rem;
            border-radius: 999px;
            background: #04243b;
            box-shadow: 0 0 10px rgba(255,255,255,0.35);
            animation: blink-eye 4.8s infinite;
        }
        .hero-eye.left { left: 34%; }
        .hero-eye.right { right: 34%; }
        .hero-smile {
            position: absolute;
            left: 50%;
            bottom: 28%;
            width: 1.6rem;
            height: 0.9rem;
            transform: translateX(-50%);
            border-bottom: 0.2rem solid #04243b;
            border-radius: 0 0 1rem 1rem;
            opacity: 0.85;
        }
        .spark-ring {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .spark-ring span {
            position: absolute;
            width: 0.42rem;
            height: 0.42rem;
            border-radius: 999px;
            background: rgba(255, 231, 106, 0.85);
            box-shadow: 0 0 14px rgba(255, 231, 106, 0.65);
            animation: spark-float 1.8s ease-in-out infinite;
        }
        .spark-ring span:nth-child(1) { left: 14%; top: 54%; }
        .spark-ring span:nth-child(2) { right: 18%; top: 26%; animation-delay: 0.4s; }
        .spark-ring span:nth-child(3) { left: 48%; bottom: 12%; animation-delay: 0.8s; }
        .title-display {
            font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .sub-copy {
            max-width: min(88vw, 26rem);
            text-align: center;
            line-height: 1.15;
            letter-spacing: 0.08em;
            color: var(--accent-soft);
        }
        .ui-copy {
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }
        .feedback-gif {
            position: absolute;
            right: clamp(0.75rem, 3vw, 1.5rem);
            width: clamp(4.75rem, 18vw, 7rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            border: 1px solid rgba(154, 248, 255, 0.24);
            background: rgba(6, 10, 22, 0.82);
            box-shadow: 0 0 18px rgba(49, 243, 255, 0.16);
            object-fit: cover;
            opacity: 0;
            transform: translateY(0.6rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 35;
        }
        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #hit-gif {
            top: 5rem;
        }
        #danger-gif {
            bottom: 5rem;
        }
        @media (max-width: 640px) {
            .feedback-gif {
                width: 4.5rem;
                right: 0.6rem;
            }
            #hit-gif {
                top: 5.75rem;
            }
            #danger-gif {
                bottom: 5.25rem;
            }
        }
        /* Custom Animations */
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.84; transform: scale(0.97); } }
        @keyframes spin-halo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spark-float { 0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.3; } 50% { transform: translateY(-10px) scale(1.15); opacity: 1; } }
        @keyframes blink-eye {
            0%, 44%, 48%, 100% { transform: scaleY(1); }
            46% { transform: scaleY(0.15); }
        }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
    </style>
</head>

<!-- Audio Assets -->

<audio id="bgm_battle" data-editable="audio" data-label="Battle Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="none" loop></audio>
<audio id="sfx_shoot" data-editable="audio" data-label="Turret Shot SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3" preload="auto"></audio>
<audio id="sfx_hit" data-editable="audio" data-label="Enemy Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>

<div id="game-container" class="relative w-full h-full select-none">

<script>
/**
 * §2 & §4 Technical Core & Iron Laws
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    window.gameConfigDefs = {};
    window.gameConfig = {};
    
    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const defs = JSON.parse(configElement.textContent);
            window.gameConfigDefs = defs;
            for (const key in defs) {
                window.gameConfig[key] = defs[key].value;
            }
        }
    } catch (e) {
        console.error("Config parse error:", e);
        // Fallbacks
        window.gameConfig = { heroSpeed: 12, fireRate: 150, enemySpawnRate: 60, themeColor: "#06b6d4" };
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') {
                document.getElementById('start-screen').querySelector('h1').style.color = val;
                document.getElementById('hud').querySelector('div').style.color = val;
            }
        }
    };

    // --- Audio System ---
    class AudioManager {
        constructor() {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.buffers = {};
            this.unlocked = false;
            this.lastPlayedAt = new Map();
        }

        unlock() {
            if (this.unlocked) return;
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            this.unlocked = true;
            this.playBgm();
        }

        async loadSound(id) {
            const el = document.getElementById(id);
            if (!el || !el.src) return;
            try {
                const srcUrl = new URL(el.src, window.location.href);
                if (srcUrl.origin !== window.location.origin) {
                    return;
                }
                const res = await fetch(srcUrl.href);
                const arrayBuffer = await res.arrayBuffer();
                this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.warn(`Audio load failed for ${id}, using fallback.`);
            }
        }

        playBgm() {
            const el = document.getElementById('bgm_battle');
            if (!el) return;
            el.volume = 0.2;
            if (el.paused) {
                el.play().catch(() => {});
            }
        }

        stopBgm() {
            const el = document.getElementById('bgm_battle');
            if (!el) return;
            el.pause();
            el.currentTime = 0;
        }

        playSfx(id, fallbackType = 'beep', cooldown = 0) {
            const now = performance.now();
            const last = this.lastPlayedAt.get(id) || 0;
            if (cooldown && now - last < cooldown) return;
            this.lastPlayedAt.set(id, now);

            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            if (this.buffers[id]) {
                const source = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                gain.gain.value = id === 'sfx_fail' ? 0.58 : 0.4;
                source.buffer = this.buffers[id];
                source.connect(gain);
                gain.connect(this.ctx.destination);
                source.start(0);
                return;
            }

            const el = document.getElementById(id);
            if (el?.src) {
                const clone = el.cloneNode();
                clone.volume = id === 'sfx_fail' ? 0.58 : 0.4;
                clone.play().catch(() => this.synthesize(fallbackType));
                return;
            }

            this.synthesize(fallbackType);
        }

        synthesize(type) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }
    }

    const audio = new AudioManager();
    audio.loadSound('sfx_shoot');
    audio.loadSound('sfx_hit');
    audio.loadSound('sfx_defeat');
    audio.loadSound('sfx_fail');
    audio.loadSound('sfx_ui_start');

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const hitGif = document.getElementById('hit-gif');
    const dangerGif = document.getElementById('danger-gif');

    // State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let wave = 1;
    let frameCount = 0;
    let lastTime = 0;
    let shake = 0;

    // Input
    const input = { x: 0, y: 0, active: false };
    
    // Entities
    let player = { x: 0, y: 0, r: 15, hp: 100 };
    let enemies = [];
    let bullets = [];
    let particles = [];
    let lastShotTime = 0;
    let hitGifTimer = null;
    let dangerGifTimer = null;

    // Resize Handler
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (gameState === 'START') {
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight / 2;
            input.x = player.x;
            input.y = player.y;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Listeners
    function handleInputStart(e) {
        if (gameState !== 'PLAYING') return;
        input.active = true;
        input.x = e.clientX - canvas.getBoundingClientRect().left;
        input.y = e.clientY - canvas.getBoundingClientRect().top;
        audio.unlock();
    }
    
    function handleInputMove(e) {
        if (!input.active) return;
        input.x = e.clientX - canvas.getBoundingClientRect().left;
        input.y = e.clientY - canvas.getBoundingClientRect().top;
    }

    function handleInputEnd(e) {
        input.active = false;
    }

    canvas.addEventListener('pointerdown', handleInputStart, { passive: false });
    canvas.addEventListener('pointermove', handleInputMove, { passive: false });
    canvas.addEventListener('pointerup', handleInputEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleInputEnd, { passive: false });
    canvas.addEventListener('pointerleave', handleInputEnd, { passive: false });

    // Game Logic
    function initGame() {
        score = 0;
        wave = 1;
        shake = 0;
        enemies = [];
        bullets = [];
        particles = [];
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight / 2;
        player.hp = 100;
        input.x = player.x;
        input.y = player.y;
        input.active = false; // Require tap to start moving
        
        scoreEl.innerText = '0';
        waveEl.innerText = '1';
        
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        hitGif?.classList.remove('visible');
        dangerGif?.classList.remove('visible');
        
        audio.unlock();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        finalScoreEl.innerText = score;
        hud.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');
        flashGif(dangerGif, 'danger', 1800);
        audio.stopBgm();
        audio.playSfx('sfx_fail', 'explosion', 250);
        shake = 20;
    }

    function spawnEnemy() {
        const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
        let x, y;
        const pad = 50;
        
        if (edge === 0) { x = Math.random() * window.innerWidth; y = -pad; }
        else if (edge === 1) { x = window.innerWidth + pad; y = Math.random() * window.innerHeight; }
        else if (edge === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + pad; }
        else { x = -pad; y = Math.random() * window.innerHeight; }

        enemies.push({
            x: x,
            y: y,
            r: 12,
            speed: 2 + Math.random() * 2 + (wave * 0.1),
            hp: 2 + Math.floor(wave / 5)
        });
    }

    function createExplosion(x, y, color, count = 10) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 1
            });
        }
    }

    function flashGif(el, slot, duration = 900) {
        if (!el) return;
        el.classList.add('visible');
        if (slot === 'hit') {
            clearTimeout(hitGifTimer);
            hitGifTimer = setTimeout(() => el.classList.remove('visible'), duration);
        } else {
            clearTimeout(dangerGifTimer);
            dangerGifTimer = setTimeout(() => el.classList.remove('visible'), duration);
        }
    }

    // --- Render Helpers ---
        function drawGrid(time) {
            const horizon = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
            horizon.addColorStop(0, '#07101f');
            horizon.addColorStop(1, '#03050d');
            ctx.fillStyle = horizon;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            const gridSize = 52;
            const offset = (time * 0.025) % gridSize;
            ctx.strokeStyle = 'rgba(49, 243, 255, 0.12)';
            ctx.lineWidth = 1;

            for (let x = 0; x < window.innerWidth; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, window.innerHeight);
                ctx.stroke();
            }
            for (let y = offset; y < window.innerHeight; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(window.innerWidth, y);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(122, 245, 66, 0.08)';
            ctx.beginPath();
            ctx.moveTo(0, window.innerHeight * 0.7);
            ctx.lineTo(window.innerWidth, window.innerHeight * 0.7);
            ctx.stroke();
        }

        function drawCharacter(x, y, type) {
            ctx.save();
            ctx.translate(x, y);

            if (type === 'player') {
                const pulse = 1 + Math.sin(Date.now() / 220) * 0.06;
                const angle = Date.now() / 240;

                ctx.scale(pulse, pulse);
                ctx.shadowBlur = 24;
                ctx.shadowColor = window.gameConfig.themeColor;

                ctx.fillStyle = '#081525';
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                const coreGlow = ctx.createRadialGradient(-4, -5, 1, 0, 0, 14);
                coreGlow.addColorStop(0, '#ffffff');
                coreGlow.addColorStop(0.25, '#b6fbff');
                coreGlow.addColorStop(0.7, window.gameConfig.themeColor);
                coreGlow.addColorStop(1, '#0891b2');
                ctx.fillStyle = coreGlow;
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(182, 251, 255, 0.95)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 19, angle, angle + Math.PI * 1.35);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 231, 106, 0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 25, -angle * 0.8, -angle * 0.8 + Math.PI * 0.75);
                ctx.stroke();

                ctx.fillStyle = '#05253d';
                ctx.beginPath();
                ctx.arc(-3.2, -2.5, 1.5, 0, Math.PI * 2);
                ctx.arc(3.2, -2.5, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#05253d';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 2, 3.8, 0.15, Math.PI - 0.15);
                ctx.stroke();
            } else if (type === 'enemy') {
                const sway = Math.sin((Date.now() + x * 4) / 180) * 0.15;
                ctx.rotate(sway);
                ctx.shadowBlur = 16;
                ctx.shadowColor = '#ff5d8f';

                ctx.fillStyle = '#130818';
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff5d8f';
                ctx.beginPath();
                ctx.moveTo(0, -16);
                ctx.lineTo(13, -3);
                ctx.lineTo(9, 14);
                ctx.lineTo(0, 18);
                ctx.lineTo(-9, 14);
                ctx.lineTo(-13, -3);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#260814';
                ctx.beginPath();
                ctx.arc(-4, -2, 1.7, 0, Math.PI * 2);
                ctx.arc(4, -2, 1.7, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#260814';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(-4, 7);
                ctx.lineTo(0, 3);
                ctx.lineTo(4, 7);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 231, 106, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-8, 12);
                ctx.lineTo(-3, 8);
                ctx.lineTo(0, 13);
                ctx.lineTo(3, 8);
                ctx.lineTo(8, 12);
                ctx.stroke();
            }

            ctx.restore();
        }

    // --- Main Loop ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
        lastTime = timestamp;

        try {
            // Clear & Shake
            ctx.save();
            
            if (shake > 0) {
                const dx = (Math.random() - 0.5) * shake;
                const dy = (Math.random() - 0.5) * shake;
                ctx.translate(dx, dy);
                shake *= 0.9;
                if (shake < 0.5) shake = 0;
            }

            drawGrid(timestamp);

            if (gameState === 'PLAYING') {
                frameCount++;

                // 1. Player Logic
                if (input.active) {
                    // Smooth follow
                    const dx = input.x - player.x;
                    const dy = input.y - player.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist > 1) {
                        const moveSpeed = window.gameConfig.heroSpeed * 20 * dt; // Scale speed
                        const step = Math.min(dist, moveSpeed);
                        player.x += (dx / dist) * step;
                        player.y += (dy / dist) * step;
                    }
                }
                
                // Clamp player to screen
                player.x = Math.max(20, Math.min(window.innerWidth - 20, player.x));
                player.y = Math.max(20, Math.min(window.innerHeight - 20, player.y));

                // 2. Shooting Logic
                if (timestamp - lastShotTime > window.gameConfig.fireRate) {
                    // Find nearest enemy
                    let nearest = null;
                    let minDist = 400; // Range

                    for (const e of enemies) {
                        const d = Math.hypot(e.x - player.x, e.y - player.y);
                        if (d < minDist) {
                            minDist = d;
                            nearest = e;
                        }
                    }

                    if (nearest) {
                        const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                        bullets.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(angle) * 800,
                            vy: Math.sin(angle) * 800
                        });
                        lastShotTime = timestamp;
                        audio.playSfx('sfx_shoot', 'shoot', 70);
                        shake = 3;
                    }
                }

                // 3. Enemy Spawning
                const spawnRate = Math.max(20, window.gameConfig.enemySpawnRate - (wave * 2));
                if (frameCount % Math.floor(spawnRate) === 0) {
                    spawnEnemy();
                }

                // 4. Update Entities
                // Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    
                    // Draw Bullet
                    ctx.fillStyle = '#fef08a';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Remove offscreen
                    if (b.x < 0 || b.x > window.innerWidth || b.y < 0 || b.y > window.innerHeight) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    // Collision with Enemies
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < e.r + 5) {
                            e.hp--;
                            bullets.splice(i, 1);
                            createExplosion(e.x, e.y, '#fff', 3);
                            audio.playSfx('sfx_hit', 'shoot', 80);
                            if (e.hp <= 0) {
                                enemies.splice(j, 1);
                                score += 10;
                                scoreEl.innerText = score;
                                createExplosion(e.x, e.y, '#f43f5e', 15);
                                flashGif(hitGif, 'hit', score % 100 === 0 ? 1200 : 650);
                                audio.playSfx('sfx_defeat', 'explosion', 120);
                                if (score % 100 === 0) {
                                    wave++;
                                    waveEl.innerText = wave;
                                }
                            }
                            break; // Bullet hit one enemy
                        }
                    }
                }

                // Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * 60 * dt;
                    e.y += Math.sin(angle) * e.speed * 60 * dt;

                    drawCharacter(e.x, e.y, 'enemy');

                    // Collision with Player
                    const dist = Math.hypot(player.x - e.x, player.y - e.y);
                    if (dist < player.r + e.r) {
                        gameOver();
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 2 * dt;
                    
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.globalAlpha = 1.0;

                    if (p.life <= 0) particles.splice(i, 1);
                }

                // Draw Player
                drawCharacter(player.x, player.y, 'player');
            }

            ctx.restore();

        } catch (e) {
            console.error("Game Loop Error:", e);
        }

        requestAnimationFrame(gameLoop);
    }

    // Start
    startBtn.addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui_start', 'shoot', 150);
        initGame();
    });

    restartBtn.addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui_start', 'shoot', 150);
        initGame();
    });

    requestAnimationFrame(gameLoop);
});
</script>
