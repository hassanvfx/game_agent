<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Pulse Route Studio</title>
    <!-- [agent-note][stage3] resolved-font: title/ui/hud -> catalogs/fonts.json (Russo One, Exo 2, Press Start 2P) -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060816;
            --bg-glow: #101835;
            --panel: rgba(12, 20, 42, 0.82);
            --panel-strong: rgba(18, 30, 58, 0.94);
            --panel-border: rgba(112, 243, 255, 0.24);
            --text: #f7fbff;
            --text-dim: rgba(214, 235, 255, 0.72);
            --green: #6df7c1;
            --green-dark: #06342b;
            --blue: #7ec8ff;
            --blue-dark: #0e2b58;
            --cyan: #70f3ff;
            --gold: #ffd76a;
            --warning: #ff7b92;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(112, 243, 255, 0.18), transparent 32%),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 106, 0.14), transparent 20%),
                linear-gradient(180deg, var(--bg-glow) 0%, var(--bg) 56%, #03040a 100%);
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed-fill, .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, rgba(112, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(112, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.95));
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 16%, rgba(112, 243, 255, 0.18), transparent 18%),
                radial-gradient(circle at 82% 24%, rgba(255, 123, 146, 0.14), transparent 16%),
                radial-gradient(circle at 50% 80%, rgba(255, 215, 106, 0.12), transparent 24%);
            opacity: 0.9;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 30, 58, 0.94), rgba(7, 12, 26, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 20px rgba(112, 243, 255, 0.12);
        }

        .menu-panel {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 320px;
            padding: 34px;
            border-radius: 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .menu-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(112, 243, 255, 0.16), transparent 30%),
                linear-gradient(135deg, rgba(255, 215, 106, 0.08), transparent 45%);
            pointer-events: none;
        }

        .title {
            margin: 0 0 8px;
            position: relative;
            z-index: 1;
            font-family: 'Russo One', system-ui, sans-serif;
            font-size: clamp(2.35rem, 7vw, 4.2rem);
            line-height: 0.95;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fdf4bf 0%, #ffd76a 38%, #70f3ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(112, 243, 255, 0.12);
        }

        .subtitle {
            margin: 0 0 8px;
            position: relative;
            z-index: 1;
            font-size: 0.76rem;
            letter-spacing: 0.42em;
            color: var(--cyan);
            text-transform: uppercase;
        }

        .menu-copy {
            margin: 0 0 18px;
            position: relative;
            z-index: 1;
            max-width: 26rem;
            color: rgba(236, 247, 255, 0.84);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .btn-primary,
        .btn-secondary,
        .btn-icon,
        .tool-btn,
        .text-button {
             border: none;
             font-family: 'Exo 2', system-ui, sans-serif;
             cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #76ffd0 0%, #22c55e 100%);
            color: var(--green-dark);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            padding: 15px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            box-shadow:
                0 10px 24px rgba(34, 197, 94, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(109, 247, 193, 0.34);
            filter: brightness(1.04);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background: linear-gradient(135deg, #86d5ff 0%, #3b82f6 100%);
            color: var(--blue-dark);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 0.98rem;
            box-shadow:
                0 10px 24px rgba(59, 130, 246, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.34);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(126, 200, 255, 0.34);
            filter: brightness(1.05);
        }

        .btn-icon {
            background: rgba(12, 20, 42, 0.75);
            border: 1px solid rgba(112, 243, 255, 0.24);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .btn-icon:hover,
        .btn-icon:focus-visible {
            background: rgba(28, 43, 76, 0.92);
            transform: translateY(-1px);
            box-shadow: 0 0 14px rgba(112, 243, 255, 0.22);
        }

        #editor-ui {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(112, 243, 255, 0.08), transparent 26%),
                linear-gradient(180deg, #0a1024, #050813 62%, #04060d);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }

        .editor-topbar {
            height: 64px;
            background: rgba(9, 14, 30, 0.94);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(112, 243, 255, 0.18);
            gap: 16px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        }

        .editor-topbar-title {
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.92rem;
            text-align: center;
            flex: 1;
        }

        .editor-back {
            color: white;
            font-weight: 700;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .editor-back:hover { color: #f87171; }

        .editor-stage {
            flex: 1;
            overflow: hidden;
            position: relative;
            background:
                linear-gradient(180deg, rgba(5, 8, 19, 0.8), rgba(5, 8, 19, 0.96)),
                #030712;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #grid-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 16px;
            display: flex;
            align-items: center;
        }

        #editor-grid {
            display: grid;
            gap: 1px;
            background-color: rgba(112,243,255,0.08);
            overflow-x: auto;
            padding-bottom: 10px;
            box-shadow: 0 0 0 1px rgba(112, 243, 255, 0.12);
        }

        .editor-cell {
            width: 40px;
            height: 40px;
            background: rgba(6, 10, 22, 0.85);
            border: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .editor-cell:hover { background: rgba(32, 48, 82, 0.86); transform: scale(0.98); }
        .cell-1 { background: linear-gradient(180deg, #76ffd0, #1aba78) !important; }
        .cell-2 { background: linear-gradient(180deg, #ff98a7, #ff4e73) !important; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .cell-3 { background: linear-gradient(180deg, #ddb4ff, #9d66ff) !important; border-radius: 50%; box-shadow: 0 0 10px rgba(192,132,252,0.45); }
        .cell-4 { background: linear-gradient(180deg, #ffe690, #ffbe0b) !important; border-radius: 50%; box-shadow: 0 0 10px rgba(255,215,106,0.4); }
        .cell-5 { background: linear-gradient(180deg, #9cf7ff, #10bcd6) !important; border-radius: 50%; box-shadow: 0 0 10px rgba(34,211,238,0.4); }

        .editor-toolbar {
            min-height: 80px;
            background: rgba(9, 14, 30, 0.96);
            border-top: 1px solid rgba(112, 243, 255, 0.18);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
        }

        .tools-label {
            font-size: 0.72rem;
            color: #9ca3af;
            margin-right: 8px;
            letter-spacing: 0.16em;
        }

        .tool-btn {
            width: 48px;
            height: 48px;
            background: rgba(29, 39, 67, 0.92);
            border-radius: 12px;
            border: 1px solid rgba(112, 243, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .tool-btn:hover { background: rgba(47, 62, 104, 0.96); }

        .tool-chip {
            width: 24px;
            height: 24px;
        }

        .chip-block { background: #4ade80; }
        .chip-spike { background: #f87171; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .chip-text-purple { color: #d8b4fe; font-weight: 700; font-size: 0.7rem; }
        .chip-text-yellow { color: #fde047; font-weight: 700; font-size: 0.7rem; }
        .chip-text-cyan { color: #67e8f9; font-weight: 700; font-size: 0.7rem; }
        .chip-clear { color: #ef4444; font-weight: 800; }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hud-controls {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .pause-button {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .progress-readout {
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Press Start 2P', monospace;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.12em;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(112, 243, 255, 0.2);
            background: rgba(7, 12, 26, 0.68);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .gif-overlay {
            position: absolute;
            right: 12px;
            bottom: 18px;
            z-index: 6;
            width: min(28vw, 132px);
            border-radius: 18px;
            border: 1px solid rgba(112, 243, 255, 0.24);
            background: rgba(6, 10, 22, 0.72);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
        }

        .gif-overlay.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .gif-overlay img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .gif-overlay-top {
            bottom: auto;
            top: 82px;
        }

        .overlay-panel {
            pointer-events: auto;
            z-index: 50;
            text-align: center;
            padding: 28px 24px;
            border-radius: 24px;
            max-width: min(420px, calc(100vw - 28px));
        }

        .overlay-title {
            margin: 0 0 16px;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .overlay-copy {
            margin: 0;
            color: rgba(255,255,255,0.75);
            font-size: 0.92rem;
        }

        .pause-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .round-btn {
            width: 64px;
            height: 64px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .pause-note {
            margin-top: 16px;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        .game-over-title {
            margin: 0 0 8px;
            font-size: 2.1rem;
            font-weight: 800;
            color: #ff7389;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .game-over-copy {
            margin: 0 0 24px;
            color: white;
        }

        .text-button {
            margin-top: 16px;
            display: block;
            width: 100%;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 0.82rem;
            letter-spacing: 0.08em;
        }

        .text-button:hover { color: white; }

        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        @media (max-width: 640px) {
            .menu-panel {
                min-width: min(320px, calc(100vw - 24px));
                width: calc(100vw - 24px);
                padding: 28px 20px;
            }

            .menu-copy {
                font-size: 0.88rem;
            }

            .editor-topbar {
                height: auto;
                min-height: 64px;
                flex-wrap: wrap;
                padding: 10px 12px;
            }

            .editor-topbar-title {
                order: 3;
                width: 100%;
                flex: unset;
            }

            .editor-toolbar {
                justify-content: center;
            }

            .progress-readout {
                font-size: 1.25rem;
            }

            .overlay-panel {
                width: calc(100vw - 28px);
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">

            <div id="main-menu" class="glass-panel menu-panel">
                <h1 class="title">Pulse Route</h1>
                <p class="subtitle">Neon Courier Build</p>
                <p class="menu-copy">Guide the courier through the signal lane, then sketch your own training run in the route editor.</p>

                <button id="play-btn" class="btn-primary">Run Test Route</button>
                <button id="editor-btn" class="btn-secondary">Open Route Editor</button>
            </div>

            <div id="editor-ui" class="hidden">
                <div class="editor-topbar">
                    <button id="editor-back" class="editor-back">← Menu</button>
                    <div class="editor-topbar-title">Route Editor</div>
                    <button id="editor-play" class="btn-primary" style="padding: 8px 20px; font-size: 0.85rem;">Test Route</button>
                </div>
                <div class="editor-stage">
                    <div id="grid-container">
                        <div id="editor-grid"></div>
                    </div>
                </div>
                <div class="editor-toolbar">
                    <div class="tools-label">TOOLS</div>
                    <button class="tool-btn" data-type="1" aria-label="Solid tile"><div class="tool-chip chip-block"></div></button>
                    <button class="tool-btn" data-type="2" aria-label="Hazard tile"><div class="tool-chip chip-spike"></div></button>
                    <button class="tool-btn" data-type="3" aria-label="Glider gate"><div class="chip-text-purple">GLIDE</div></button>
                    <button class="tool-btn" data-type="4" aria-label="Runner gate"><div class="chip-text-yellow">RUN</div></button>
                    <button class="tool-btn" data-type="5" aria-label="Bounce gate"><div class="chip-text-cyan">HOP</div></button>
                    <button class="tool-btn" data-type="0" aria-label="Clear tile"><div class="chip-clear">X</div></button>
                </div>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-controls">
                    <button id="pause-btn" class="btn-icon pause-button">||</button>
                </div>
                <div class="progress-readout"><span id="percent">0</span>% synced</div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: fail + momentum reaction overlays -> catalogs/gifs.json -->
            <div id="reaction-gif" class="gif-overlay" aria-hidden="true">
                <img src="https://i.giphy.com/RPPgfntVAIhsRzSBgG.webp" alt="Momentum reaction overlay">
            </div>
            <div id="crash-gif" class="gif-overlay gif-overlay-top" aria-hidden="true">
                <img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Crash reaction overlay">
            </div>

            <div id="pause-menu" class="hidden glass-panel overlay-panel">
                <h2 class="overlay-title">Route Paused</h2>
                <div class="pause-actions">
                    <button id="resume-btn" class="btn-icon round-btn" aria-label="Resume">▶</button>
                    <button id="restart-btn" class="btn-icon round-btn" aria-label="Restart">↻</button>
                    <button id="exit-btn" class="btn-icon round-btn" style="color:#f87171;" aria-label="Exit">✕</button>
                </div>
                <div class="pause-note">Simulation safe mode remains active.</div>
            </div>

            <div id="game-over" class="hidden glass-panel overlay-panel">
                <h2 class="game-over-title">Route Lost</h2>
                <p class="game-over-copy">Signal held for <span id="final-percent">0</span>% of the course.</p>
                <button id="retry-btn" class="btn-primary" style="padding: 12px 32px; border-radius: 999px;">Retry Route</button>
                <button id="menu-btn" class="text-button">Return to Menu</button>
            </div>

        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- ASSETS ---
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
            land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            modeShift: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
            click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
            pause: "https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3",
            resume: "https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
        };

        // --- AUDIO SYSTEM ---
        class AudioController {
            constructor() {
                this.ready = false;
                this.lastPlayed = new Map();
                this.sfx = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
            }

            unlock() {
                if (this.ready) return;
                const sfxVolumes = {
                    jump: 0.45,
                    land: 0.3,
                    modeShift: 0.4,
                    click: 0.28,
                    start: 0.38,
                    pause: 0.32,
                    resume: 0.32,
                    crash: 0.5
                };

                Object.entries(sfxVolumes).forEach(([key, volume]) => {
                    const audio = new Audio(ASSETS[key]);
                    audio.volume = volume;
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                });

                this.ready = true;
            }

            playBGM() {
                this.unlock();
                this.bgm.currentTime = this.bgm.currentTime || 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM(reset = true) {
                this.bgm.pause();
                if (reset) this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 90) {
                this.unlock();
                const sample = this.sfx[key];
                if (!sample) return;
                const now = performance.now();
                const last = this.lastPlayed.get(key) || 0;
                if (now - last < minGap) return;
                this.lastPlayed.set(key, now);
                const clone = sample.cloneNode();
                clone.volume = sample.volume;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();
        const reactionGif = document.getElementById('reaction-gif');
        const crashGif = document.getElementById('crash-gif');
        let gifTimers = {};
        let wasGrounded = false;

        function pulseGif(element, duration = 850) {
            if (!element) return;
            clearTimeout(gifTimers[element.id]);
            element.classList.add('visible');
            gifTimers[element.id] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        // --- GAME CONSTANTS ---
        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d');
        const TILE_SIZE = 50;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -11;
        const SHIP_THRUST = -0.4;
        const SHIP_GRAVITY = 0.3;
        const UFO_JUMP = -9;
        const SPEED = 7;

        let WIDTH, HEIGHT;
        let gameState = 'MENU'; // MENU, EDITOR, GAME, PAUSE, GAMEOVER
        let animationFrameId;

        // --- GAME STATE ---
        let player = {
            x: 200, y: 0, w: 40, h: 40,
            vy: 0,
            angle: 0,
            mode: 'CUBE', // CUBE, SHIP, UFO
            onGround: false,
            dead: false
        };

        let cameraX = 0;
        let levelData = []; // 2D array of tile IDs
        let currentLevelWidth = 0;
        let selectedTool = 1;

        // Default demo route
        // 0: Empty, 1: Block, 2: Spike, 3: Ship, 4: Cube, 5: UFO
        const DEMO_LEVEL_LENGTH = 200;
        const demoLevel = [];
        for (let x = 0; x < DEMO_LEVEL_LENGTH; x++) {
            let col = new Array(12).fill(0);
            col[9] = 1; col[10] = 1; col[11] = 1;

            if (x > 15 && x < 20) col[8] = 2;
            if (x === 25) col[8] = 1;
            if (x === 30) col[5] = 3;

            if (x > 35 && x < 80) {
                col[9] = 0;
                col[10] = 0;
                col[11] = 1;
                if (x % 10 === 0) col[2] = 1;
            }

            if (x === 85) col[5] = 4;
            if (x > 90 && x < 100) col[8] = 2;

            if (x === 110) col[5] = 5;
            if (x > 120 && x < 160) {
                if (x % 8 === 0) col[6] = 1;
            }

            demoLevel.push(col);
        }

        // --- RESIZE ---
        function resize() {
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            CANVAS.width = WIDTH;
            CANVAS.height = HEIGHT;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- INPUT HANDLING ---
        let inputActive = false;
        const gameSurface = document.getElementById('game-container');

        const handleInputStart = (e) => {
            if (e.target.closest('button')) return;
            if ((e.type === 'mousedown' || e.type === 'touchstart') && !e.target.closest('#game-container')) return;
            if (e.cancelable) e.preventDefault();
            inputActive = true;
            if (gameState === 'GAME' && !player.dead) {
                if (player.mode === 'CUBE' && player.onGround) {
                    player.vy = JUMP_FORCE;
                    player.onGround = false;
                    audio.playSFX('jump');
                } else if (player.mode === 'UFO' && !player.dead) {
                    player.vy = UFO_JUMP;
                    audio.playSFX('jump');
                }
            }
        };

        const handleInputEnd = () => { inputActive = false; };

        // [agent-note][stage4] repaired: mobile-cta-actionability | action: scoped gameplay gesture suppression to the game surface so menu and modal buttons keep native tap/click behavior
        gameSurface.addEventListener('mousedown', handleInputStart);
        gameSurface.addEventListener('touchstart', handleInputStart, { passive: false });
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchend', handleInputEnd);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInputStart(e);
            if (e.code === 'Escape') togglePause();
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInputEnd();
        });

        // --- PHYSICS & LOGIC ---
        function resetGame(level) {
            levelData = level || demoLevel;
            currentLevelWidth = levelData.length * TILE_SIZE;

            player = {
                x: 200,
                y: (levelData[0].findIndex(t => t === 1) - 1) * TILE_SIZE,
                w: 40, h: 40,
                vy: 0,
                angle: 0,
                mode: 'CUBE',
                onGround: false,
                dead: false
            };

            cameraX = 0;
            inputActive = false;
        }

        function updatePhysics() {
            if (player.dead) return;

            const startedGrounded = player.onGround;

            player.x += SPEED;
            cameraX = player.x - 200;

            if (player.mode === 'CUBE') {
                player.vy += GRAVITY;
                if (!player.onGround) player.angle += 0.15;
                else {
                    const nearest90 = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
                    player.angle += (nearest90 - player.angle) * 0.2;
                }
            } else if (player.mode === 'SHIP') {
                if (inputActive) player.vy += SHIP_THRUST;
                player.vy += SHIP_GRAVITY;
                player.vy = Math.max(Math.min(player.vy, 8), -8);
                player.angle = player.vy * 0.1;
            } else if (player.mode === 'UFO') {
                player.vy += GRAVITY;
                player.angle = player.vy * 0.05;
            }

            player.y += player.vy;
            checkCollisions();

            if (!startedGrounded && player.onGround) {
                audio.playSFX('land', 120);
            }

            if (player.x > currentLevelWidth) {
                resetGame(levelData);
            }

            if (player.y > HEIGHT + 100 || player.y < -500) crash();
        }

        function checkCollisions() {
            player.onGround = false;

            const startCol = Math.floor(player.x / TILE_SIZE);
            const endCol = startCol + 2;
            const startRow = Math.floor(player.y / TILE_SIZE);
            const endRow = startRow + 2;

            for (let c = startCol; c <= endCol; c++) {
                if (!levelData[c]) continue;
                for (let r = 0; r < levelData[c].length; r++) {
                    const tile = levelData[c][r];
                    if (tile === 0) continue;

                    const tx = c * TILE_SIZE;
                    const ty = r * TILE_SIZE;

                    if (player.x < tx + TILE_SIZE &&
                        player.x + player.w > tx &&
                        player.y < ty + TILE_SIZE &&
                        player.y + player.h > ty) {

                        if (tile === 1) {
                            resolveSolidCollision(tx, ty, r);
                        } else if (tile === 2) {
                            const px = player.x + player.w / 2;
                            const py = player.y + player.h / 2;
                            if (px > tx + 10 && px < tx + TILE_SIZE - 10 &&
                                py > ty + 10 && py < ty + TILE_SIZE) {
                                crash();
                            }
                        } else if (tile === 3) {
                            switchMode('SHIP');
                        } else if (tile === 4) {
                            switchMode('CUBE');
                        } else if (tile === 5) {
                            switchMode('UFO');
                        }
                    }
                }
            }
        }

        function resolveSolidCollision(tx, ty, row) {
            const overlapX = (player.x + player.w / 2) - (tx + TILE_SIZE / 2);
            const overlapY = (player.y + player.h / 2) - (ty + TILE_SIZE / 2);

            const hWidths = (player.w + TILE_SIZE) / 2;
            const hHeights = (player.h + TILE_SIZE) / 2;

            const ox = hWidths - Math.abs(overlapX);
            const oy = hHeights - Math.abs(overlapY);

            if (ox >= oy) {
                if (overlapY > 0) {
                    player.y = ty + TILE_SIZE;
                    player.vy = 0;
                    crash();
                } else {
                    player.y = ty - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    if (player.mode === 'CUBE') player.angle = 0;
                }
            } else {
                crash();
            }
        }

        function switchMode(newMode) {
            if (player.mode !== newMode) {
                player.mode = newMode;
                player.angle = 0;
                player.vy = 0;
                audio.playSFX('modeShift', 180);
                pulseGif(reactionGif, 720);
            }
        }

        function crash() {
            if (player.dead) return;
            player.dead = true;
            audio.playSFX('crash', 200);
            audio.stopBGM();
            pulseGif(crashGif, 1100);

            setTimeout(() => {
                showGameOver();
            }, 500);
        }

        // --- RENDER ---
        function draw() {
            CTX.clearRect(0, 0, WIDTH, HEIGHT);

            drawBackground();

            CTX.save();
            CTX.translate(-cameraX, 0);

            const startCol = Math.floor(cameraX / TILE_SIZE);
            const endCol = startCol + Math.ceil(WIDTH / TILE_SIZE) + 1;

            for (let c = startCol; c <= endCol; c++) {
                if (!levelData[c]) continue;
                for (let r = 0; r < levelData[c].length; r++) {
                    const tile = levelData[c][r];
                    if (tile === 0) continue;

                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    if (tile === 1) {
                        CTX.fillStyle = '#0a1327';
                        CTX.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                        const blockGlow = CTX.createLinearGradient(x, y, x, y + TILE_SIZE);
                        blockGlow.addColorStop(0, '#76ffd0');
                        blockGlow.addColorStop(1, '#129d77');
                        CTX.strokeStyle = blockGlow;
                        CTX.lineWidth = 2;
                        CTX.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);

                        CTX.fillStyle = 'rgba(112,243,255,0.12)';
                        CTX.fillRect(x + 5, y + 5, TILE_SIZE - 10, 10);
                        CTX.fillStyle = 'rgba(255,255,255,0.08)';
                        CTX.fillRect(x + 6, y + 20, TILE_SIZE - 12, TILE_SIZE - 26);
                    } else if (tile === 2) {
                        const spikeGradient = CTX.createLinearGradient(x, y, x, y + TILE_SIZE);
                        spikeGradient.addColorStop(0, '#ffb0b9');
                        spikeGradient.addColorStop(1, '#ff4e73');
                        CTX.fillStyle = '#18040a';
                        CTX.beginPath();
                        CTX.moveTo(x, y + TILE_SIZE);
                        CTX.lineTo(x + TILE_SIZE / 2, y);
                        CTX.lineTo(x + TILE_SIZE, y + TILE_SIZE);
                        CTX.closePath();
                        CTX.fill();

                        CTX.strokeStyle = spikeGradient;
                        CTX.lineWidth = 2.5;
                        CTX.stroke();

                        CTX.beginPath();
                        CTX.moveTo(x + 10, y + TILE_SIZE - 1);
                        CTX.lineTo(x + TILE_SIZE / 2, y + 14);
                        CTX.lineTo(x + TILE_SIZE - 10, y + TILE_SIZE - 1);
                        CTX.strokeStyle = 'rgba(255,255,255,0.8)';
                        CTX.lineWidth = 1.5;
                        CTX.stroke();
                    } else {
                        let color = '#fff';
                        let symbol = 'S';
                        if (tile === 3) { color = '#b882ff'; symbol = 'SHIP'; }
                        if (tile === 4) { color = '#ffd76a'; symbol = 'RUN'; }
                        if (tile === 5) { color = '#70f3ff'; symbol = 'HOP'; }

                        CTX.save();
                        CTX.translate(x + TILE_SIZE / 2, y + TILE_SIZE / 2);

                        CTX.fillStyle = 'rgba(6, 10, 22, 0.9)';
                        CTX.beginPath();
                        CTX.arc(0, 0, TILE_SIZE / 1.9, 0, Math.PI * 2);
                        CTX.fill();

                        CTX.strokeStyle = color;
                        CTX.lineWidth = 3;
                        CTX.beginPath();
                        CTX.arc(0, 0, TILE_SIZE / 2.15, 0, Math.PI * 2);
                        CTX.stroke();

                        CTX.fillStyle = color;
                        CTX.font = '700 10px "Exo 2"';
                        CTX.textAlign = 'center';
                        CTX.textBaseline = 'middle';
                        CTX.fillText(symbol, 0, 1);
                        CTX.restore();
                    }
                }
            }

            if (!player.dead || Math.random() > 0.5) {
                CTX.save();
                CTX.translate(player.x + player.w / 2, player.y + player.h / 2);
                CTX.rotate(player.angle);

                if (player.mode === 'SHIP') {
                    CTX.fillStyle = '#091328';
                    CTX.beginPath();
                    CTX.moveTo(-21, 10);
                    CTX.lineTo(15, 12);
                    CTX.lineTo(22, 0);
                    CTX.lineTo(12, -12);
                    CTX.lineTo(-12, -15);
                    CTX.lineTo(-22, -2);
                    CTX.closePath();
                    CTX.fill();

                    const shipGradient = CTX.createLinearGradient(-20, -14, 20, 12);
                    shipGradient.addColorStop(0, '#ffe38a');
                    shipGradient.addColorStop(1, '#ff8c42');
                    CTX.strokeStyle = shipGradient;
                    CTX.lineWidth = 2.5;
                    CTX.stroke();

                    CTX.fillStyle = '#70f3ff';
                    CTX.beginPath();
                    CTX.moveTo(-6, -3);
                    CTX.lineTo(12, 0);
                    CTX.lineTo(-6, 3);
                    CTX.closePath();
                    CTX.fill();

                    if (inputActive) {
                        CTX.fillStyle = 'rgba(255,123,146,0.95)';
                        CTX.beginPath();
                        CTX.moveTo(-22, -1);
                        CTX.lineTo(-34, 0);
                        CTX.lineTo(-22, 5);
                        CTX.closePath();
                        CTX.fill();
                    }
                } else if (player.mode === 'UFO') {
                    CTX.fillStyle = '#091328';
                    CTX.beginPath();
                    CTX.ellipse(0, 4, 20, 10, 0, 0, Math.PI * 2);
                    CTX.fill();
                    CTX.strokeStyle = '#70f3ff';
                    CTX.lineWidth = 2.2;
                    CTX.stroke();

                    CTX.fillStyle = '#ffd76a';
                    CTX.beginPath();
                    CTX.arc(0, -4, 11, Math.PI, 0);
                    CTX.fill();

                    CTX.fillStyle = 'rgba(255,255,255,0.65)';
                    CTX.beginPath();
                    CTX.arc(-4, -6, 3, 0, Math.PI * 2);
                    CTX.arc(4, -6, 3, 0, Math.PI * 2);
                    CTX.fill();
                } else {
                    CTX.fillStyle = '#091328';
                    CTX.fillRect(-20, -20, 40, 40);

                    const courierGradient = CTX.createLinearGradient(-20, -20, 20, 20);
                    courierGradient.addColorStop(0, '#ffe38a');
                    courierGradient.addColorStop(1, '#ff9f43');
                    CTX.strokeStyle = courierGradient;
                    CTX.lineWidth = 2.5;
                    CTX.strokeRect(-20, -20, 40, 40);

                    CTX.fillStyle = '#70f3ff';
                    CTX.fillRect(-12, -10, 8, 8);
                    CTX.fillRect(4, -10, 8, 8);
                    CTX.fillStyle = '#76ffd0';
                    CTX.fillRect(-10, 5, 20, 6);
                    CTX.fillStyle = 'rgba(255,255,255,0.28)';
                    CTX.fillRect(-15, -16, 30, 5);
                }

                CTX.restore();
            }

            CTX.strokeStyle = '#fff';
            CTX.lineWidth = 2;
            CTX.beginPath();
            CTX.moveTo(cameraX, Math.floor(HEIGHT / TILE_SIZE) * TILE_SIZE);
            CTX.lineTo(cameraX + WIDTH, Math.floor(HEIGHT / TILE_SIZE) * TILE_SIZE);
            CTX.stroke();

            CTX.restore();

            const pct = Math.min(100, Math.floor((player.x / currentLevelWidth) * 100));
            document.getElementById('percent').innerText = pct;
        }

        function drawBackground() {
            const skyGradient = CTX.createLinearGradient(0, 0, 0, HEIGHT);
            skyGradient.addColorStop(0, '#0b1330');
            skyGradient.addColorStop(0.5, '#071021');
            skyGradient.addColorStop(1, '#03050c');
            CTX.fillStyle = skyGradient;
            CTX.fillRect(0, 0, WIDTH, HEIGHT);

            const bgSpeed = 0.2;
            const offset = (cameraX * bgSpeed) % WIDTH;

            for (let i = -1; i < 7; i++) {
                const glowX = ((i * 220) - offset * 0.6) % (WIDTH + 220);
                CTX.fillStyle = 'rgba(112,243,255,0.06)';
                CTX.fillRect(glowX, 0, 2, HEIGHT);
            }

            CTX.strokeStyle = 'rgba(112,243,255,0.08)';
            CTX.lineWidth = 1;
            for (let i = 0; i < WIDTH; i += 96) {
                let x = (i - offset);
                if (x < 0) x += WIDTH;
                CTX.beginPath();
                CTX.moveTo(x, 0);
                CTX.lineTo(x, HEIGHT);
                CTX.stroke();
            }

            CTX.strokeStyle = 'rgba(112,243,255,0.05)';
            for (let y = 0; y < HEIGHT; y += 72) {
                CTX.beginPath();
                CTX.moveTo(0, y);
                CTX.lineTo(WIDTH, y);
                CTX.stroke();
            }

            CTX.fillStyle = 'rgba(255,215,106,0.08)';
            CTX.beginPath();
            CTX.arc(WIDTH * 0.82, HEIGHT * 0.18, 54, 0, Math.PI * 2);
            CTX.fill();

            CTX.fillStyle = 'rgba(112,243,255,0.08)';
            CTX.fillRect(0, HEIGHT - 220, WIDTH, 220);
        }

        function gameLoop() {
            if (gameState === 'GAME') {
                updatePhysics();
            }
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- UI LOGIC ---
        function startGame(fromEditor = false) {
            gameState = 'GAME';
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('editor-ui').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('pause-menu').classList.add('hidden');
            crashGif.classList.remove('visible');

            audio.playSFX('start', 150);
            audio.playBGM();

            if (fromEditor) {
                resetGame(editorLevel);
            } else {
                resetGame(demoLevel);
            }
        }

        function togglePause() {
            if (gameState === 'GAME') {
                gameState = 'PAUSE';
                audio.playSFX('pause', 120);
                audio.stopBGM(false);
                document.getElementById('pause-menu').classList.remove('hidden');
            } else if (gameState === 'PAUSE') {
                gameState = 'GAME';
                audio.playSFX('resume', 120);
                audio.playBGM();
                document.getElementById('pause-menu').classList.add('hidden');
            }
        }

        function showGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-percent').innerText = document.getElementById('percent').innerText;
        }

        // --- EDITOR LOGIC ---
        let editorLevel = [];
        const EDITOR_ROWS = 12;
        const EDITOR_COLS = 100;

        function initEditor() {
            const grid = document.getElementById('editor-grid');
            grid.style.gridTemplateColumns = `repeat(${EDITOR_COLS}, 40px)`;
            grid.style.gridTemplateRows = `repeat(${EDITOR_ROWS}, 40px)`;
            grid.innerHTML = '';

            editorLevel = [];
            for (let x = 0; x < EDITOR_COLS; x++) {
                let col = new Array(EDITOR_ROWS).fill(0);
                col[9] = 1; col[10] = 1; col[11] = 1;
                editorLevel.push(col);
            }

            renderEditorGrid();
        }

        function renderEditorGrid() {
            const grid = document.getElementById('editor-grid');
            grid.innerHTML = '';

            for (let y = 0; y < EDITOR_ROWS; y++) {
                for (let x = 0; x < EDITOR_COLS; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'editor-cell';
                    const val = editorLevel[x][y];
                    if (val > 0) cell.classList.add(`cell-${val}`);

                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    cell.addEventListener('mousedown', () => {
                        editorLevel[x][y] = (editorLevel[x][y] === selectedTool) ? 0 : selectedTool;
                        renderEditorGrid();
                    });

                    grid.appendChild(cell);
                }
            }
        }

        // --- EVENT LISTENERS ---
        document.getElementById('play-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 60);
            startGame(false);
            if (!animationFrameId) gameLoop();
        });

        document.getElementById('editor-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 60);
            gameState = 'EDITOR';
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('editor-ui').classList.remove('hidden');
            initEditor();
        });

        document.getElementById('editor-back').addEventListener('click', () => {
            audio.playSFX('click', 60);
            document.getElementById('editor-ui').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        });

        document.getElementById('editor-play').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 60);
            startGame(true);
            if (!animationFrameId) gameLoop();
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                audio.playSFX('click', 50);
                document.querySelectorAll('.tool-btn').forEach(b => b.style.borderColor = '#4b5563');
                e.currentTarget.style.borderColor = '#fff';
                selectedTool = parseInt(e.currentTarget.dataset.type);
            });
        });

        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        document.getElementById('restart-btn').addEventListener('click', () => {
            togglePause();
            resetGame(levelData);
            audio.playSFX('start', 120);
            audio.playBGM();
        });

        document.getElementById('exit-btn').addEventListener('click', () => {
            location.reload();
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'GAME';
            resetGame(levelData);
            audio.playSFX('start', 120);
            audio.playBGM();
            crashGif.classList.remove('visible');
        });

        document.getElementById('menu-btn').addEventListener('click', () => {
            location.reload();
        });
    });
    </script>
</body>
