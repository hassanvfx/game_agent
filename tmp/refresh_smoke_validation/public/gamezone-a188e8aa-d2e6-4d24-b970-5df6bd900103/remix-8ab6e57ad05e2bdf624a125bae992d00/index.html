<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grand Hotel Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [agent-note][stage4] repaired: font-remap | action: moved ui/display fonts to approved workspace catalog choices -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #130f28;
            --bg-bottom: #251138;
            --panel-fill: rgba(33, 20, 53, 0.88);
            --panel-stroke: rgba(255, 212, 117, 0.78);
            --panel-glow: rgba(102, 229, 255, 0.25);
            --text-main: #fff5da;
            --text-muted: #dac8ff;
            --accent-gold: #ffca57;
            --accent-cyan: #7cf3ff;
            --accent-pink: #ff79c6;
            --danger: #ff6f91;
            --desk-shadow: rgba(8, 5, 19, 0.42);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(124, 243, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%);
            background-size: 24px 24px, 24px 24px;
            opacity: 0.32;
            mix-blend-mode: screen;
        }

        canvas { display: block; touch-action: none; width: 100%; height: 100%; }

        .glass {
            background:
                linear-gradient(180deg, rgba(45, 25, 72, 0.95), rgba(20, 14, 37, 0.92));
            backdrop-filter: blur(10px);
            border: 2px solid var(--panel-stroke);
            box-shadow:
                0 14px 40px rgba(0,0,0,0.32),
                0 0 20px var(--panel-glow),
                inset 0 1px 0 rgba(255,255,255,0.18);
            color: var(--text-main);
        }

        .hud-pill {
            border-radius: 999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 0 18px rgba(124, 243, 255, 0.18),
                inset 0 1px 0 rgba(255,255,255,0.16);
        }

        .screen-title,
        .screen-subtitle,
        .btn-burst,
        .feedback-copy {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
        }

        .screen-title {
            text-shadow: 0 4px 0 rgba(72, 23, 16, 0.55), 0 0 16px rgba(255, 121, 198, 0.2);
        }

        .btn-gold,
        .btn-burst {
            background: linear-gradient(135deg, var(--accent-gold), #ff8f5a);
            color: #2e1638;
            border: none;
            box-shadow:
                0 5px 0 #b35f37,
                0 0 18px rgba(255, 202, 87, 0.28);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        }

        .btn-gold:active,
        .btn-burst:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b35f37;
            filter: brightness(1.05);
        }

        .screen-card {
            position: relative;
            overflow: hidden;
        }

        .screen-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(124, 243, 255, 0.16), transparent 28%),
                radial-gradient(circle at 84% 14%, rgba(255, 121, 198, 0.18), transparent 26%);
        }

        .mascot-badge {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1rem;
            border-radius: 1.4rem;
            display: grid;
            place-items: center;
            font-size: 2.2rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(124,243,255,0.1));
            border: 2px solid rgba(255, 212, 117, 0.55);
            box-shadow: 0 0 20px rgba(124, 243, 255, 0.24);
        }

        .status-copy {
            color: var(--text-muted);
            line-height: 1.4;
            text-wrap: balance;
        }

        #ui-layer { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .hidden { display: none !important; }

        .feedback-dock {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            z-index: 45;
            width: min(34vw, 150px);
            min-width: 92px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .feedback-card {
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            background: rgba(18, 12, 32, 0.84);
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 8px 28px rgba(0,0,0,0.28);
            backdrop-filter: blur(6px);
        }

        .feedback-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: rgba(0,0,0,0.12);
        }

        .feedback-copy {
            padding: 0.4rem 0.5rem 0.55rem;
            font-size: 0.72rem;
            line-height: 1.1;
            text-align: center;
            color: var(--text-main);
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .feedback-dock {
                width: min(30vw, 112px);
                right: 0.5rem;
                bottom: 0.5rem;
            }

            .feedback-copy {
                font-size: 0.62rem;
            }
        }
    </style>
</head>

<script>
// §3.2 Configuration Interface
window.gameConfigDefs = {
    "guestSpeed": { "type": "number", "label": "Guest Speed", "value": 100, "min": 50, "max": 300 },
    "spawnRate": { "type": "number", "label": "Spawn Rate (ms)", "value": 2000, "min": 500, "max": 5000 },
    "themeColor": { "type": "color", "label": "Carpet Color", "value": "#A52A2A" }
};

window.gameConfig = {
    guestSpeed: 100,
    spawnRate: 2000,
    themeColor: "#A52A2A"
};

window.updateGameConfig = function(key, val) {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            // picked up next frame
        }
    }
};

// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.isUnlocked = false;
        this.lastPlayedAt = {};
        this.bgmEl = null;
        this.bgmStarted = false;
    }

    init() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                this.ctx = new AudioContext();
            } catch (_) {
                this.ctx = null;
            }
        }

        this.bgmEl = document.getElementById('bgm_main');

        const unlock = () => {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.isUnlocked = true;
            if (isPlaying) {
                this.playBgm();
            }
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };

        document.addEventListener('pointerdown', unlock, { passive: true });
        document.addEventListener('keydown', unlock);
    }

    playBgm() {
        if (!this.bgmEl || !this.isUnlocked) return;
        this.bgmEl.volume = 0.2;
        this.bgmEl.loop = true;
        this.bgmStarted = true;
        this.bgmEl.play().catch(() => {});
    }

    stopBgm() {
        if (!this.bgmEl) return;
        this.bgmEl.pause();
        this.bgmEl.currentTime = 0;
        this.bgmStarted = false;
    }

    playSfx(id, fallbackType = 'beep', options = {}) {
        if (!this.isUnlocked) return;
        const now = performance.now();
        const minInterval = options.minInterval ?? 80;
        if (now - (this.lastPlayedAt[id] || 0) < minInterval) return;
        this.lastPlayedAt[id] = now;

        const el = document.getElementById(id);
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = options.volume ?? 0.55;
                el.play().catch(() => this.synthesize(fallbackType));
                return;
            } catch (_) {
                // fall through
            }
        }

        this.synthesize(fallbackType);
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'pickup') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(980, this.ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        } else if (type === 'warning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(360, this.ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        }
    }
}

const audioManager = new AudioManager();

// Game State
let canvas, ctx;
let lastTime = 0;
let isPlaying = false;
let score = 0;
let guests = [];
let particles = [];
let spawnTimer = 0;
let gameWidth = 0;
let gameHeight = 0;
let dpr = 1;
let feedbackTimeouts = {};
let introSoundPlayed = false;

// Entities
class Guest {
    constructor() {
        this.y = gameHeight - 150;
        this.x = -60;
        this.width = 50;
        this.height = 90;
        this.state = 'walking_in';
        this.targetX = gameWidth * 0.3;
        this.color = `hsl(${Math.random() * 360}, 60%, 50%)`;
        this.timer = 0;
        this.patience = 5000;
        this.checkedIn = false;
        this.warningTriggered = false;
    }

    update(dt) {
        const speed = window.gameConfig.guestSpeed;
        
        if (this.state === 'walking_in') {
            if (this.x < this.targetX) {
                this.x += speed * dt;
            } else {
                this.x = this.targetX;
                this.state = 'waiting';
            }
        } else if (this.state === 'waiting') {
            this.timer += dt * 1000;
            if (!this.warningTriggered && this.timer > this.patience * 0.65) {
                this.warningTriggered = true;
                audioManager.playSfx('sfx_alert', 'warning', { volume: 0.38, minInterval: 350 });
            }
            if (this.timer > this.patience) {
                this.state = 'leaving_angry';
                audioManager.playSfx('sfx_fail', 'fail', { volume: 0.55, minInterval: 250 });
                showFeedback('fail');
                createParticles(this.x, this.y - 50, 'sad');
                endGame();
            }
        } else if (this.state === 'walking_elevator') {
            const elevatorX = gameWidth * 0.8;
            if (this.x < elevatorX) {
                this.x += speed * 1.5 * dt;
            } else {
                this.state = 'done';
            }
        } else if (this.state === 'leaving_angry') {
            this.x -= speed * 0.5 * dt;
            if (this.x < -100) this.state = 'done';
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        const bob = Math.sin(Date.now() / 150) * 3;
        ctx.translate(0, -this.height / 2 + bob);

        const isAngry = this.state === 'leaving_angry';
        const bodyColor = isAngry ? '#6f647b' : this.color;
        const trimColor = isAngry ? '#ff9a6b' : '#ffca57';

        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.roundRect(-17, -32, 34, 64, 8);
        ctx.fill();

        ctx.fillStyle = trimColor;
        ctx.beginPath();
        ctx.moveTo(-5, -28);
        ctx.lineTo(0, -8);
        ctx.lineTo(5, -28);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#FFD1AA';
        ctx.beginPath();
        ctx.arc(0, -42, 13, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#24142f';
        ctx.beginPath();
        ctx.arc(0, -45, 13, Math.PI, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#31204c';
        ctx.fillRect(-15, -54, 30, 6);
        ctx.fillRect(-10, -64, 20, 11);
        ctx.fillStyle = trimColor;
        ctx.fillRect(-4, -61, 8, 4);

        ctx.strokeStyle = '#3b1f29';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-4, -43, 1.4, 0, Math.PI * 2);
        ctx.arc(4, -43, 1.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        if (isAngry) {
            ctx.moveTo(-5, -35);
            ctx.lineTo(0, -37);
            ctx.lineTo(5, -35);
        } else {
            ctx.arc(0, -35, 4, 0.15 * Math.PI, 0.85 * Math.PI);
        }
        ctx.stroke();

        ctx.strokeStyle = '#f7d08a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-16, -16);
        ctx.lineTo(-24, 4);
        ctx.moveTo(16, -16);
        ctx.lineTo(24, 4);
        ctx.stroke();

        if (this.state === 'waiting') {
            const pct = 1 - (this.timer / this.patience);
            ctx.fillStyle = 'rgba(28, 12, 45, 0.88)';
            ctx.beginPath();
            ctx.roundRect(-24, -76, 48, 10, 5);
            ctx.fill();
            ctx.fillStyle = pct < 0.3 ? '#ff6f91' : '#7cf3ff';
            ctx.beginPath();
            ctx.roundRect(-22, -74, 44 * Math.max(0, pct), 6, 3);
            ctx.fill();

            if (Date.now() % 1000 < 500) {
                ctx.font = "700 18px 'Orbitron'";
                ctx.fillStyle = '#ffca57';
                ctx.fillText('!', 27, -39);
            }
        }

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1.0;
        this.vx = (Math.random() - 0.5) * 50;
        this.vy = -Math.random() * 100 - 50;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = "700 20px 'Orbitron'";
        ctx.fillText(this.type === 'heart' ? '✨' : '⚡', this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

function showFeedback(type) {
    const card = document.getElementById(type === 'success' ? 'feedback-success' : 'feedback-fail');
    if (!card) return;
    card.classList.add('visible');
    clearTimeout(feedbackTimeouts[type]);
    feedbackTimeouts[type] = setTimeout(() => {
        card.classList.remove('visible');
    }, type === 'success' ? 1200 : 1600);
}

function hideFeedback() {
    ['feedback-success', 'feedback-fail'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('visible');
    });
}

function createParticles(x, y, type) {
    for (let i = 0; i < 3; i++) {
        particles.push(new Particle(x, y, type));
    }
}

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    resize();
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    audioManager.init();
    
    requestAnimationFrame(gameLoop);
}

function resize() {
    gameWidth = window.innerWidth;
    gameHeight = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    
    canvas.width = gameWidth * dpr;
    canvas.height = gameHeight * dpr;
    canvas.style.width = gameWidth + 'px';
    canvas.style.height = gameHeight + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    hideFeedback();
    
    score = 0;
    document.getElementById('score').innerText = score;
    guests = [];
    particles = [];
    spawnTimer = 250;
    isPlaying = true;
    lastTime = performance.now();
    
    if (audioManager.isUnlocked) {
        audioManager.playSfx('sfx_start', 'beep', { volume: 0.5, minInterval: 200 });
        introSoundPlayed = true;
    }
    audioManager.playBgm();
}

function endGame() {
    isPlaying = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('finalScore').innerText = score;
    audioManager.stopBgm();
}

function handleInput(e) {
    e.preventDefault();
    if (!isPlaying) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    for (const g of guests) {
        if (g.state === 'waiting') {
            if (Math.abs(x - g.x) < 60 && Math.abs(y - (g.y - 45)) < 60) {
                g.state = 'walking_elevator';
                score++;
                document.getElementById('score').innerText = score;
                createParticles(g.x, g.y - 80, 'heart');
                showFeedback('success');
                audioManager.playSfx('sfx_bell', 'pickup', { volume: 0.55, minInterval: 90 });
                return;
            }
        }
    }
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        if (isPlaying) {
            spawnTimer -= dt * 1000;
            if (spawnTimer <= 0) {
                guests.push(new Guest());
                spawnTimer = window.gameConfig.spawnRate;
            }

            for (let i = guests.length - 1; i >= 0; i--) {
                guests[i].update(dt);
                if (guests[i].state === 'done') {
                    guests.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        const wallGrad = ctx.createLinearGradient(0, 0, 0, gameHeight);
        wallGrad.addColorStop(0, '#1b1635');
        wallGrad.addColorStop(0.55, '#2c1744');
        wallGrad.addColorStop(1, '#41204d');
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        const glow = ctx.createRadialGradient(gameWidth * 0.5, gameHeight * 0.12, 20, gameWidth * 0.5, gameHeight * 0.12, gameWidth * 0.5);
        glow.addColorStop(0, 'rgba(124,243,255,0.22)');
        glow.addColorStop(1, 'rgba(124,243,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        for (let i = 0; i < 5; i++) {
            const lampX = ((i + 0.5) / 5) * gameWidth;
            ctx.fillStyle = 'rgba(255, 202, 87, 0.65)';
            ctx.fillRect(lampX - 25, 32, 50, 8);
            const beam = ctx.createLinearGradient(0, 40, 0, gameHeight * 0.55);
            beam.addColorStop(0, 'rgba(255, 202, 87, 0.18)');
            beam.addColorStop(1, 'rgba(255, 202, 87, 0)');
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.moveTo(lampX - 30, 40);
            ctx.lineTo(lampX + 30, 40);
            ctx.lineTo(lampX + 120, gameHeight * 0.55);
            ctx.lineTo(lampX - 120, gameHeight * 0.55);
            ctx.closePath();
            ctx.fill();
        }

        const floorY = gameHeight - 150;
        const floorGrad = ctx.createLinearGradient(0, floorY, 0, gameHeight);
        floorGrad.addColorStop(0, '#35203f');
        floorGrad.addColorStop(1, '#150d22');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, floorY, gameWidth, 150);

        ctx.fillStyle = window.gameConfig.themeColor;
        ctx.fillRect(0, floorY + 20, gameWidth, 110);
        ctx.strokeStyle = '#ffca57';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, floorY + 25);
        ctx.lineTo(gameWidth, floorY + 25);
        ctx.moveTo(0, floorY + 125);
        ctx.lineTo(gameWidth, floorY + 125);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(124,243,255,0.2)';
        ctx.lineWidth = 2;
        for (let i = 0; i < gameWidth; i += 56) {
            ctx.beginPath();
            ctx.moveTo(i, floorY + 38);
            ctx.lineTo(i + 26, floorY + 108);
            ctx.stroke();
        }

        const elevatorX = gameWidth * 0.8;
        const elevatorGrad = ctx.createLinearGradient(elevatorX - 40, floorY - 120, elevatorX + 40, floorY);
        elevatorGrad.addColorStop(0, '#1f203d');
        elevatorGrad.addColorStop(1, '#0b1127');
        ctx.fillStyle = elevatorGrad;
        ctx.fillRect(elevatorX - 40, floorY - 120, 80, 120);
        ctx.fillStyle = '#ffca57';
        ctx.fillRect(elevatorX - 40, floorY - 120, 10, 120);
        ctx.fillRect(elevatorX + 30, floorY - 120, 10, 120);
        ctx.fillStyle = '#ff8f5a';
        ctx.fillRect(elevatorX - 40, floorY - 130, 80, 10);
        ctx.fillStyle = '#7cf3ff';
        ctx.fillRect(elevatorX - 8, floorY - 105, 16, 4);

        const deskX = gameWidth * 0.3;

        guests.forEach(g => g.draw(ctx));

        ctx.fillStyle = 'rgba(9, 5, 26, 0.34)';
        ctx.fillRect(deskX - 10, floorY - 15, 175, 45);

        const deskGrad = ctx.createLinearGradient(0, floorY - 40, 0, floorY + 20);
        deskGrad.addColorStop(0, '#7141a8');
        deskGrad.addColorStop(1, '#38214f');
        ctx.fillStyle = deskGrad;
        ctx.fillRect(deskX, floorY - 40, 150, 60);

        ctx.fillStyle = '#261432';
        ctx.fillRect(deskX - 10, floorY - 50, 170, 15);
        ctx.fillStyle = '#ffca57';
        ctx.fillRect(deskX, floorY - 36, 150, 4);

        ctx.fillStyle = '#ffca57';
        ctx.beginPath();
        ctx.arc(deskX + 80, floorY - 56, 7, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(deskX + 73, floorY - 56, 14, 5);
        ctx.fillStyle = '#7cf3ff';
        ctx.fillRect(deskX + 78, floorY - 65, 4, 4);

        ctx.font = "600 15px 'Exo 2'";
        ctx.fillStyle = '#fff5da';
        ctx.fillText('VIP DESK', deskX + 42, floorY - 14);

        particles.forEach(p => p.draw(ctx));

        const grad = ctx.createRadialGradient(gameWidth / 2, gameHeight / 2, gameHeight / 2, gameWidth / 2, gameHeight / 2, gameHeight);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, gameWidth, gameHeight);
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
