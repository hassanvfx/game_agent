<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover"><title>Dead Tide: The Ninth Break</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=VT323&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020405;color:#f6e7cf;font-family:VT323,monospace}body{touch-action:auto}.stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 76% 13%,rgba(130,255,215,.18),transparent 11%),linear-gradient(#020304,#07141b 48%,#15120f)}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);pointer-events:none;z-index:2}.stage:after{content:"The surf report was wrong. The ninth break remembers.";position:absolute;left:50%;bottom:.6rem;transform:translateX(-50%);max-width:92vw;text-align:center;font-size:clamp(.9rem,3vw,1.2rem);color:rgba(246,231,207,.48);z-index:5}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}.ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6}.panel{width:min(90vw,430px);padding:1.35rem 1.1rem;border:1px solid rgba(120,255,207,.42);border-radius:24px;text-align:center;background:linear-gradient(rgba(5,18,23,.84),rgba(6,8,10,.78));box-shadow:0 24px 70px #000,0 0 34px rgba(120,255,207,.09);backdrop-filter:blur(12px);pointer-events:auto}.brand{margin:0 0 .35rem;font:700 clamp(2.45rem,10vw,4.15rem)/.9 Cinzel,serif;letter-spacing:.05em;color:#eafdf5;text-shadow:0 0 14px rgba(120,255,207,.5),0 3px #061013}.brand span,.result{color:#ff4d6d;text-shadow:0 0 18px rgba(255,77,109,.6)}.sub{margin:.35rem auto 1rem;max-width:31ch;font-size:clamp(1.05rem,4.1vw,1.35rem);line-height:1.15}.note{margin:.75rem auto 1.05rem;padding:.6rem .75rem;border:1px dashed rgba(201,255,244,.28);border-radius:14px;color:rgba(201,255,244,.88);font-size:clamp(.92rem,3.3vw,1.05rem);background:rgba(0,0,0,.18)}button{border:0;border-radius:999px;min-height:50px;padding:.82rem 1.35rem;font:700 1rem Cinzel,serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#031010;background:linear-gradient(#c9fff4,#78ffcf 65%,#43b99a);box-shadow:0 14px 32px rgba(120,255,207,.22)}button:active{transform:translateY(1px) scale(.98)}.ghost{background:linear-gradient(#fff0f3,#ff8aa0 62%,#ff4d6d)}.hidden{display:none!important}.hud{position:absolute;top:.75rem;left:.75rem;display:flex;gap:.48rem;align-items:center;padding:.45rem .72rem;border-radius:999px;border:1px solid rgba(120,255,207,.34);background:rgba(1,8,10,.62);font-size:clamp(1rem,3.8vw,1.2rem);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.hud b{color:#78ffcf;font-weight:400;text-shadow:0 0 9px rgba(120,255,207,.55)}.sigil{width:1.05rem;height:1.05rem;border:2px solid #78ffcf;border-radius:50%;box-shadow:0 0 10px rgba(120,255,207,.6);position:relative}.sigil:after{content:"";position:absolute;left:50%;top:-7px;width:2px;height:26px;background:rgba(120,255,207,.45);transform:translateX(-50%) rotate(38deg)}.fb{position:absolute;right:.75rem;top:.75rem;max-width:min(44vw,220px);padding:.45rem .6rem;border:1px solid rgba(246,231,207,.28);border-radius:14px;background:rgba(0,0,0,.55);color:#c9fff4;font-size:clamp(.9rem,3.3vw,1.1rem);opacity:0;transform:translateY(-8px);transition:.22s;pointer-events:none}.fb.show{opacity:1;transform:translateY(0)}.result{margin:0 0 .45rem;font:700 clamp(2rem,8vw,3rem) Cinzel,serif}.scoreline{font-size:clamp(1.15rem,4vw,1.45rem);margin:.25rem 0 1.1rem}@media(max-width:480px){.panel{width:92vw}.fb{top:3.35rem}}
</style></head><body><div class="stage"><canvas id="gameCanvas"></canvas><div class="ui"><section id="start-screen" class="panel"><h1 class="brand">DEAD <span>TIDE</span></h1><p class="sub">Drag the cursed surf relic backward. Release it through the hollow break before the beach claims it.</p><div class="note">One pull. One arc. If the relic falls quiet in the sand, the Ninth Break writes your name.</div><button id="start-btn">Enter the Break</button></section><section id="game-over-screen" class="panel hidden"><h2 class="result">THE BEACH ANSWERS</h2><div class="scoreline">Hollow Breaks: <span id="finalScore">0</span></div><button id="restart-btn" class="ghost">Try the Tide Again</button></section><div id="hud" class="hud hidden"><span class="sigil"></span>Breaks: <b id="score">0</b></div><div id="feedback" class="fb"></div></div></div><script>
document.addEventListener('DOMContentLoaded',()=>{const ASSETS={bgm:'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',sfx:{launch:'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',rim:'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',score:'https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3',land:'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',ui:'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3'}};class AudioC{constructor(){this.enabled=false;this.bgm=this.mk(ASSETS.bgm,.18,true);this.sfx={};this.last={};Object.entries(ASSETS.sfx).forEach(([k,u])=>this.sfx[k]=this.mk(u,k==='fail'?.48:.62,false))}mk(s,v,l){let a=new Audio(s);a.preload='auto';a.volume=v;a.loop=l;return a}unlock(){this.enabled=true}playBGM(){if(this.enabled){this.bgm.currentTime=0;this.bgm.play().catch(()=>{})}}stopBGM(){this.bgm.pause();this.bgm.currentTime=0}playSFX(k,c=90){if(!this.enabled||!this.sfx[k])return;let n=performance.now();if(this.last[k]&&n-this.last[k]<c)return;this.last[k]=n;let p=this.sfx[k].cloneNode();p.volume=this.sfx[k].volume;p.play().catch(()=>{})}}const audio=new AudioC(),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),finalScoreEl=document.getElementById('finalScore'),hud=document.getElementById('hud'),startScreen=document.getElementById('start-screen'),overScreen=document.getElementById('game-over-screen'),fb=document.getElementById('feedback');let width=0,height=0,gameActive=false,score=0,frameCount=0,landedThisShot=false,hasScoredThisShot=false,fbTimer=null;const GRAVITY=.6,DRAG_POWER=.18,MAX_POWER=25;let ball={x:0,y:0,vx:0,vy:0,radius:20,state:'idle',startX:0,startY:0},hoop={x:0,y:0,width:100,rimY:0},input={active:false,startX:0,startY:0,currX:0,currY:0},rocks=[],waves=[],particles=[],targetIndex=0;function seed(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}let rnd=seed(9131987);function resize(){width=canvas.width=innerWidth;height=canvas.height=innerHeight;genBeach();if(!gameActive){resetBall();randomizeHoop()}}addEventListener('resize',resize);function genBeach(){rocks=[];waves=[];for(let i=0;i<18;i++)rocks.push({x:rnd()*width,y:height*(.62+rnd()*.28),r:8+rnd()*28,t:rnd()*Math.PI});for(let i=0;i<7;i++)waves.push({base:height*(.38+i*.055),amp:8+rnd()*12,phase:rnd()*6.28,speed:.007+i*.0018})}function resetBall(){ball.radius=Math.min(width,height)*.04;ball.x=width*.2;ball.y=height-ball.radius-50;ball.vx=ball.vy=0;ball.state='idle';ball.startX=ball.x;ball.startY=ball.y}function randomizeHoop(){let p=[.64,.76,.86,.69,.82],h=[.33,.42,.28,.51,.37];hoop.x=width*p[targetIndex%p.length];hoop.y=height*h[targetIndex%h.length];targetIndex++;hoop.width=ball.radius*3.5;hoop.rimY=hoop.y+50}function initGame(){score=0;targetIndex=0;hasScoredThisShot=landedThisShot=false;scoreEl.innerText=score;particles=[];resetBall();randomizeHoop()}function msg(t,bad){fb.textContent=t;fb.style.borderColor=bad?'rgba(255,77,109,.55)':'rgba(120,255,207,.5)';fb.classList.add('show');clearTimeout(fbTimer);fbTimer=setTimeout(()=>fb.classList.remove('show'),1350)}function parts(x,y,c){for(let i=0;i<18;i++)particles.push({x,y,vx:(rnd()-.5)*10,vy:(rnd()-.7)*9,life:1,c,spin:rnd()*6})}function update(){if(ball.state==='flying'){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=GRAVITY;if(ball.x<ball.radius||ball.x>width-ball.radius){ball.vx*=-.6;ball.x=ball.x<ball.radius?ball.radius:width-ball.radius}if(ball.y>height-ball.radius){ball.y=height-ball.radius;ball.vy*=-.5;ball.vx*=.8;if(!landedThisShot){landedThisShot=true;audio.playSFX('land',160);msg('wet sand heard the impact',true)}if(Math.abs(ball.vy)<2&&Math.abs(ball.vx)<1)gameOver()}let L=hoop.x-hoop.width/2,R=hoop.x+hoop.width/2;if(ball.vy>0){let py=ball.y-ball.vy;if(py<hoop.rimY&&ball.y>=hoop.rimY&&ball.x>L&&ball.x<R){score++;hasScoredThisShot=true;scoreEl.innerText=score;audio.playSFX('score',220);msg('the hollow break opened',false);parts(ball.x,ball.y,'#78ffcf');setTimeout(()=>{resetBall();randomizeHoop();hasScoredThisShot=landedThisShot=false},500)}}if(ball.x+ball.radius>R&&ball.x-ball.radius<R+10&&ball.y>hoop.rimY-80&&ball.y<hoop.rimY){ball.vx*=-.7;ball.x=R-ball.radius;audio.playSFX('rim',120);parts(ball.x,ball.y,'#ff4d6d')}}}function bg(){let g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#020304');g.addColorStop(.45,'#071d27');g.addColorStop(1,'#15120f');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);ctx.save();ctx.globalAlpha=.42;ctx.fillStyle='#dffdf5';ctx.beginPath();ctx.arc(width*.78,height*.16,Math.min(width,height)*.075,0,6.29);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(width*.81,height*.145,Math.min(width,height)*.07,0,6.29);ctx.fill();ctx.restore();ctx.fillStyle='#061014';ctx.beginPath();ctx.moveTo(0,height*.58);ctx.lineTo(width*.16,height*.43);ctx.lineTo(width*.33,height*.59);ctx.lineTo(width*.48,height*.5);ctx.lineTo(width*.64,height*.61);ctx.lineTo(width,height*.49);ctx.lineTo(width,height*.67);ctx.lineTo(0,height*.67);ctx.fill();waves.forEach((w,i)=>{ctx.beginPath();for(let x=0;x<=width+8;x+=8){let y=w.base+Math.sin(x*.018+frameCount*w.speed+w.phase)*w.amp+Math.sin(x*.043-frameCount*.006)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=i%2?'rgba(120,255,207,.16)':'rgba(201,255,244,.25)';ctx.lineWidth=i<2?1.5:2.4;ctx.stroke()});let y=height*.76,sg=ctx.createLinearGradient(0,y,0,height);sg.addColorStop(0,'rgba(55,38,31,.55)');sg.addColorStop(1,'rgba(13,10,8,.96)');ctx.fillStyle=sg;ctx.fillRect(0,y,width,height-y);rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.t);ctx.fillStyle='rgba(12,14,13,.7)';ctx.beginPath();ctx.ellipse(0,0,r.r*1.35,r.r*.55,0,0,6.29);ctx.fill();ctx.restore()})}function target(){let L=hoop.x-hoop.width/2,R=hoop.x+hoop.width/2,post=R+8,top=hoop.rimY-92;ctx.save();ctx.shadowColor='rgba(120,255,207,.45)';ctx.shadowBlur=18;ctx.strokeStyle='rgba(201,255,244,.72)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(post,top);ctx.quadraticCurveTo(post+18,hoop.rimY-44,post,hoop.rimY+54);ctx.stroke();ctx.strokeStyle='#78ffcf';ctx.beginPath();ctx.moveTo(L,hoop.rimY);ctx.bezierCurveTo(hoop.x-hoop.width*.2,hoop.rimY+12,hoop.x+hoop.width*.2,hoop.rimY+12,R,hoop.rimY);ctx.stroke();ctx.restore();ctx.strokeStyle='rgba(201,255,244,.42)';ctx.lineWidth=1.3;for(let i=0;i<=4;i++){let x=L+hoop.width/4*i;ctx.beginPath();ctx.moveTo(x,hoop.rimY);ctx.lineTo(hoop.x-hoop.width/3+hoop.width/6*i,hoop.rimY+40);ctx.stroke()}ctx.fillStyle='rgba(255,77,109,.62)';ctx.font=`${Math.max(14,ball.radius*.75)}px VT323`;ctx.textAlign='center';ctx.fillText('NINTH BREAK',hoop.x,hoop.rimY-58)}function relic(){let r=ball.radius;ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(frameCount*.03+ball.vx*.02);ctx.shadowColor='rgba(120,255,207,.52)';ctx.shadowBlur=18;let g=ctx.createRadialGradient(-r*.25,-r*.3,r*.1,0,0,r*1.15);g.addColorStop(0,'#eafff8');g.addColorStop(.48,'#78ffcf');g.addColorStop(1,'#0b5d51');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,6.29);ctx.fill();ctx.strokeStyle='rgba(2,8,9,.9)';ctx.lineWidth=2.2;ctx.stroke();ctx.strokeStyle='rgba(4,16,18,.9)';ctx.beginPath();ctx.arc(0,0,r*.42,0,6.29);ctx.stroke();ctx.fillStyle='rgba(255,77,109,.72)';ctx.beginPath();ctx.arc(-r*.28,-r*.25,r*.12,0,6.29);ctx.fill();ctx.restore()}function dots(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.03;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin+p.life*5);ctx.fillRect(-3,-3,6,6);ctx.restore();ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}}function aim(){if(ball.state==='idle'){ctx.save();ctx.strokeStyle=`rgba(120,255,207,${.44+Math.sin(frameCount*.08)*.14})`;ctx.lineWidth=2;ctx.setLineDash([7,9]);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius+11,0,6.29);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(246,231,207,.52)';ctx.font=`${Math.max(16,ball.radius*.8)}px VT323`;ctx.textAlign='center';ctx.fillText('pull against the tide',ball.x+ball.radius*2.4,ball.y-ball.radius*.75);ctx.restore()}if(input.active&&ball.state==='idle'){ctx.save();ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+(ball.x-input.currX),ball.y+(ball.y-input.currY));ctx.strokeStyle='rgba(120,255,207,.78)';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.stroke();let sx=ball.x,sy=ball.y,vx=(ball.x-input.currX)*DRAG_POWER,vy=(ball.y-input.currY)*DRAG_POWER,m=Math.hypot(vx,vy);if(m>MAX_POWER){vx=vx/m*MAX_POWER;vy=vy/m*MAX_POWER}ctx.setLineDash([]);for(let i=0;i<15;i++){sx+=vx;sy+=vy;vy+=GRAVITY;ctx.globalAlpha=.45-i*.02;ctx.fillStyle=i%2?'#78ffcf':'#f6e7cf';ctx.beginPath();ctx.arc(sx,sy,Math.max(2.5,4-i*.12),0,6.29);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}}function draw(){bg();dots();target();relic();aim()}function loop(){if(!gameActive)return;ctx.clearRect(0,0,width,height);update();draw();frameCount++;requestAnimationFrame(loop)}function gameOver(){gameActive=false;audio.stopBGM();audio.playSFX('fail');msg('the legend keeps the relic',true);hud.classList.add('hidden');overScreen.classList.remove('hidden');finalScoreEl.innerText=score}function hStart(x,y){if(!gameActive||ball.state!=='idle')return;input.active=true;input.startX=x;input.startY=y;input.currX=x;input.currY=y}function hMove(x,y){if(input.active){input.currX=x;input.currY=y}}function hEnd(){if(input.active){input.active=false;ball.state='flying';let vx=(ball.x-input.currX)*DRAG_POWER,vy=(ball.y-input.currY)*DRAG_POWER,m=Math.hypot(vx,vy);if(m>MAX_POWER){vx=vx/m*MAX_POWER;vy=vy/m*MAX_POWER}ball.vx=vx;ball.vy=vy;hasScoredThisShot=landedThisShot=false;audio.playSFX('launch',120);msg('the relic leaves your hand',false)}}canvas.addEventListener('mousedown',e=>hStart(e.clientX,e.clientY));canvas.addEventListener('mousemove',e=>hMove(e.clientX,e.clientY));canvas.addEventListener('mouseup',hEnd);canvas.addEventListener('mouseleave',hEnd);canvas.addEventListener('touchstart',e=>{e.preventDefault();hStart(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();hMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();hEnd()},{passive:false});function start(){audio.unlock();audio.playSFX('ui',60);audio.playBGM();startScreen.classList.add('hidden');overScreen.classList.add('hidden');hud.classList.remove('hidden');gameActive=true;resize();initGame();loop()}document.getElementById('start-btn').addEventListener('click',start);document.getElementById('restart-btn').addEventListener('click',()=>{audio.unlock();audio.playSFX('ui',60);overScreen.classList.add('hidden');hud.classList.remove('hidden');audio.playBGM();gameActive=true;initGame();loop()});resize();draw()});
</script></body></html>
