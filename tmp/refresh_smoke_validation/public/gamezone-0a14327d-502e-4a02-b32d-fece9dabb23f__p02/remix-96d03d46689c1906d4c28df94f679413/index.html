:root{--ink:#08050f;--red:#ff315d;--gold:#ffd23f;--cyan:#29f4ff;--lime:#71ff7b;--paper:#fff6dc}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08050f;color:var(--paper);font-family:Rajdhani,system-ui,sans-serif;user-select:none}body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 18% 14%,#ff315d55,transparent 20%),radial-gradient(circle at 84% 18%,#29f4ff44,transparent 22%)}#game-container{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#0c0618,#1c1235 45%,#4b304a)}canvas{display:block;width:100%;height:100%;touch-action:none}.hidden{display:none!important}.persona{font-family:Bangers,cursive;letter-spacing:.055em;text-transform:uppercase;text-shadow:3px 3px 0 #07040c,5px 5px 0 #ff315d88}#ui-layer{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(10px,3vw,18px)}.hud-row{display:flex;justify-content:space-between;gap:10px}.slash-card{pointer-events:auto;border:3px solid #07040c;background:#fff6dc;color:#07040c;box-shadow:7px 7px 0 #ff315de0,-3px -3px 0 #29f4ffb3;transform:skew(-7deg);padding:8px 12px;min-width:118px}.slash-card>*{transform:skew(7deg)}.kicker{font-family:Bangers,cursive;font-size:.9rem;letter-spacing:.08em;color:#ff315d}.value{display:block;font-family:Bangers,cursive;font-size:1.85rem;line-height:.9}.right-card{text-align:right;box-shadow:7px 7px 0 #29f4ffc7,-3px -3px 0 #ffd23fa6}#next-unlock{font-weight:700;font-size:.76rem;color:#34215f}.bottom-controls{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}.world-badge{border:2px solid #07040c;background:#08050f;color:#ffd23f;border-radius:999px;padding:6px 13px;font-weight:700;box-shadow:4px 4px 0 #ff315d;font-size:.9rem}.btn{width:min(92vw,345px);border:4px solid #07040c;border-radius:18px;padding:13px 16px;font-family:Bangers,cursive;font-size:1.12rem;letter-spacing:.055em;text-transform:uppercase;color:#07040c;box-shadow:6px 7px 0 #07040c;touch-action:manipulation}.btn:active{transform:translate(4px,4px);box-shadow:2px 3px 0 #07040c}#build-btn{background:linear-gradient(135deg,#ffd23f,#ff8b2d 52%,#ff315d)}#build-lasso-btn{background:linear-gradient(135deg,#29f4ff,#71ff7b 54%,#fff6dc)}#upgrade-modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#08050f99;backdrop-filter:blur(4px);padding:14px}.modal-shell{width:min(92vw,430px);border:4px solid #07040c;background:#fff6dc;color:#07040c;box-shadow:12px 12px 0 #ff315d,-8px -8px 0 #29f4ff;transform:rotate(-1deg);padding:18px}.modal-copy{font-size:.95rem;font-weight:600;color:#34215f}.modal-actions{display:grid;gap:10px;margin-top:14px}.upgrade{width:100%;border:3px solid #07040c;border-radius:14px;background:#ffd23f;color:#07040c;font-family:Bangers,cursive;font-size:1.05rem;letter-spacing:.05em;padding:12px;display:flex;justify-content:space-between;box-shadow:4px 5px 0 #07040c}.upgrade.value{background:#29f4ff}.close{width:100%;border:2px solid #07040c;border-radius:12px;background:#17102c;color:#fff6dc;font-weight:700;padding:12px;margin-top:14px}.burst{position:absolute;right:12px;bottom:132px;z-index:18;pointer-events:none;opacity:0;transform:scale(.65) rotate(-9deg);transition:.18s;background:#fff6dc;color:#07040c;border:3px solid #07040c;box-shadow:6px 6px 0 #ff315d;padding:8px 13px;font-family:Bangers,cursive}.burst.active{opacity:1;transform:scale(1) rotate(-9deg)}@media(max-width:440px){.slash-card{min-width:104px;padding:7px 10px}.value{font-size:1.55rem}.btn{font-size:1rem;padding:12px}.burst{bottom:122px;right:9px}}
</style></head><body><div id="assets" hidden><audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/bgm/desert_bgm_01.mp3" loop preload="auto"></audio><audio id="sfx_cash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio><audio id="sfx_click" src="https://gamezone-virid.vercel.app/assets/audios/sfx/desert_character_01.mp3" preload="auto"></audio><audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio><audio id="sfx_alert" src="https://gamezone-virid.vercel.app/assets/audios/sfx/desert_enemy_01.mp3" preload="auto"></audio><audio id="sfx_modal" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio></div><script id="game-config" type="application/x-game-config">{"baseTreatmentTime":{"value":3},"patientSpawnRate":{"value":2},"mentalUnlockLevel":{"value":25},"paddedUnlockLevel":{"value":28}}</script><div id="game-container"><canvas id="gameCanvas"></canvas><div id="ui-layer"><div class="hud-row"><div class="slash-card"><div><span class="kicker">Street Cash</span><span id="score-display" class="value">300</span></div></div><div class="slash-card right-card"><div><span class="kicker">Block <span id="level-display">1</span></span><div id="next-unlock">Next: Shadow Crew Lv 25</div></div></div></div><div class="bottom-controls"><div class="world-badge">🤠 toy cowboy runs the curb</div><button id="build-btn" class="btn">Drop Pop-Up Stall <span id="build-cost">($100)</span></button><button id="build-lasso-btn" class="btn hidden">Open Lasso Lounge <span id="build-lasso-cost">($500)</span></button></div></div><div id="fx-burst" class="burst">YEE-HAW!</div><div id="upgrade-modal" class="hidden"><div class="modal-shell"><div class="world-badge">Toy Cowboy Ledger</div><h1 id="modal-title" class="persona" style="font-size:2rem;margin:10px 0 4px">Stall Details</h1><p class="modal-copy">Tune the hustle speed or boost the curb payout without changing the route.</p><div class="modal-actions"><button id="upgrade-speed-btn" class="upgrade"><span>Boot Spur Lv <span id="lvl-speed">1</span></span><span id="cost-speed">$75</span></button><button id="upgrade-value-btn" class="upgrade value"><span>Gold Star Lv <span id="lvl-value">1</span></span><span id="cost-value">$75</span></button></div><button id="close-modal-btn" class="close">Back to the Block</button></div></div></div><script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let cw=0,ch=0,lastTime=0,initialized=false,gameState='PLAYING';const defs=JSON.parse(document.getElementById('game-config').textContent);const gameConfig=Object.fromEntries(Object.entries(defs).map(([k,v])=>[k,v.value]));const FLOOR_HEIGHT=120,ROOM_WIDTH=142;const world={money:300,rooms:[],patients:[],particles:[],cameraY:0,targetCameraY:0,maxScroll:0,nextPatientTime:0,selectedRoom:null,mentalUnlocked:false,paddedUnlocked:false,seed:7};const bgm=document.getElementById('bgm_main');let audioUnlocked=false;function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;bgm.volume=.16;bgm.play().catch(()=>{})}function playSfx(id){if(!audioUnlocked)return;const a=document.getElementById('sfx_'+id);if(a){try{a.currentTime=0;a.volume=id==='alert'?.18:.22;a.play().catch(()=>{})}catch(e){}}}function burst(text,kind='good'){const b=document.getElementById('fx-burst');b.textContent=text;b.style.boxShadow=`6px 6px 0 ${kind==='bad'?'#29f4ff':'#ff315d'}`;b.classList.add('active');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('active'),900)}
class Stall{constructor(id,type,floor,side){this.id=id;this.type=type;this.floor=floor;this.side=side;this.levelSpeed=1;this.levelValue=1;this.state='IDLE';this.timer=0;this.patient=null;this.anim=0}get x(){return cw/2+this.side*(cw/2.22)}get y(){return ch-80-this.floor*FLOOR_HEIGHT}get treatmentTime(){return Math.max(.5,gameConfig.baseTreatmentTime*Math.pow(.9,this.levelSpeed-1))}get value(){return Math.floor((this.type==='lasso'?25:10)*Math.pow(1.2,this.levelValue-1))}get upgradeCostSpeed(){return Math.floor(50*Math.pow(1.5,this.levelSpeed))}get upgradeCostValue(){return Math.floor(50*Math.pow(1.5,this.levelValue))}}
class CrewKid{constructor(shadow=false){this.x=cw/2;this.y=ch+20;this.targetRoom=null;this.state='ENTERING';this.speed=100;this.type=shadow?'shadow':'normal';this.sanity=100;this.mentalState='GREEN';this.attackTarget=null;this.phase=(world.seed++%9)*.7}get color(){if(this.type==='shadow'){if(this.mentalState==='RED')return '#ff315d';if(this.mentalState==='YELLOW')return '#ffd23f';return '#71ff7b'}return '#29f4ff'}}class Particle{constructor(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color;this.life=1;this.vy=-50}}
function initGame(){if(initialized)return;world.rooms.push(new Stall(0,'reception',0,0));updateUI();requestAnimationFrame(loop);initialized=true}function getBuildCost(type){if(type==='lasso'){const c=world.rooms.filter(r=>r.type==='lasso').length;return Math.floor(500*Math.pow(1.5,c))}const c=world.rooms.filter(r=>r.type==='stall').length;return Math.floor(100*Math.pow(1.4,c))}function spawnPatient(){if(world.patients.length>25)return;const shadow=world.mentalUnlocked&&((world.seed*37)%10<3);world.seed++;world.patients.push(new CrewKid(shadow))}function buildRoom(type='stall'){const cost=getBuildCost(type);unlockAudio();if(world.money>=cost){world.money-=cost;playSfx('click');const count=world.rooms.filter(r=>r.type!=='reception').length;const floor=Math.floor(count/2)+1,side=count%2===0?-1:1;const r=new Stall(Date.now()+count,type,floor,side);world.rooms.push(r);spawnParticles(r.x,r.y-world.cameraY,type==='lasso'?'LASSO!':'NEW STALL!','#ffd23f');burst(type==='lasso'?'LASSO LOUNGE!':'POP-UP DROPPED!');updateUI()}else{playSfx('fail');burst('SHORT CASH','bad')}}function upgradeRoom(kind){const r=world.selectedRoom;if(!r)return;const cost=kind==='speed'?r.upgradeCostSpeed:r.upgradeCostValue;if(world.money>=cost){world.money-=cost;if(kind==='speed')r.levelSpeed++;else r.levelValue++;playSfx('cash');spawnParticles(r.x,r.y-world.cameraY,'STYLE UP!','#29f4ff');burst('STYLE UP!')}else{playSfx('fail');burst('NO CASH','bad')}updateModal();updateUI()}function spawnParticles(x,y,text,color){world.particles.push(new Particle(x,y,text,color))}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}function moveTo(e,tx,ty,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d>1){const m=Math.min(d,e.speed*dt);e.x+=dx/d*m;e.y+=dy/d*m}}function assignRoom(p){let type='stall';if(p.type==='shadow'&&p.mentalState==='YELLOW')type='lasso';const r=world.rooms.find(x=>x.type===type&&x.state==='IDLE'&&!x.patient);if(r){p.targetRoom=r;r.patient=p;p.state='WALKING_TO'}else p.state='WAITING'}
function update(dt){const lvl=world.rooms.length;if(lvl>=gameConfig.mentalUnlockLevel)world.mentalUnlocked=true;if(lvl>=gameConfig.paddedUnlockLevel)world.paddedUnlocked=true;world.nextPatientTime-=dt;if(world.nextPatientTime<=0){spawnPatient();world.nextPatientTime=gameConfig.patientSpawnRate}world.cameraY+=(world.targetCameraY-world.cameraY)*10*dt;const maxFloor=Math.max(...world.rooms.map(r=>r.floor));world.maxScroll=Math.max(0,maxFloor*FLOOR_HEIGHT+300-ch);world.targetCameraY=Math.max(0,Math.min(world.targetCameraY,world.maxScroll));world.rooms.forEach(r=>{if(r.state==='TREATING'){r.timer-=dt;r.anim+=dt*10;if(r.timer<=0){if(r.patient){const p=r.patient;p.state='LEAVING';if(r.type==='lasso'){p.sanity=100;p.mentalState='GREEN';spawnParticles(r.x,r.y-world.cameraY,'CHILL','#71ff7b')}else spawnParticles(r.x,r.y-world.cameraY,'+$'+r.value,'#ffd23f');world.money+=r.value;playSfx('cash');updateUI()}r.patient=null;r.state='IDLE'}}});for(let i=world.patients.length-1;i>=0;i--){const p=world.patients[i];if(p.type==='shadow'&&p.state!=='TREATING'&&p.state!=='LEAVING'){p.sanity-=dt*5;if(p.sanity<=0){p.mentalState='RED';if(p.state!=='ATTACKING'){p.state='ATTACKING';if(p.targetRoom){p.targetRoom.patient=null;p.targetRoom=null}}}else if(p.sanity<50){p.mentalState='YELLOW';if(p.state==='WAITING'||(p.state==='WALKING_TO'&&p.targetRoom?.type==='stall')){const l=world.rooms.find(r=>r.type==='lasso'&&r.state==='IDLE'&&!r.patient);if(l){if(p.targetRoom)p.targetRoom.patient=null;p.targetRoom=l;l.patient=p;p.state='WALKING_TO'}}}else p.mentalState='GREEN'}if(p.state==='ATTACKING'){if(!p.attackTarget||!world.patients.includes(p.attackTarget))p.attackTarget=world.patients.find(v=>v!==p&&v.state!=='LEAVING'&&v.state!=='ATTACKING');if(p.attackTarget){moveTo(p,p.attackTarget.x,p.attackTarget.y,dt*1.5);if(dist(p.x,p.y,p.attackTarget.x,p.attackTarget.y)<10){playSfx('alert');spawnParticles(p.x,p.y-world.cameraY,'BEEF!','#ff315d');burst('BEEF ON BLOCK','bad');const idx=world.patients.indexOf(p.attackTarget);if(idx>-1)world.patients.splice(idx,1);world.patients.splice(i,1);continue}}else p.x+=Math.sin(lastTime*.01+p.phase)}else if(p.state==='ENTERING'){const r=world.rooms[0];moveTo(p,r.x,r.y,dt);if(dist(p.x,p.y,r.x,r.y)<5)assignRoom(p)}else if(p.state==='WAITING')assignRoom(p);else if(p.state==='WALKING_TO'){if(!p.targetRoom){p.state='WAITING';continue}moveTo(p,p.targetRoom.x,p.targetRoom.y,dt);if(dist(p.x,p.y,p.targetRoom.x,p.targetRoom.y)<5){p.state='TREATING';p.targetRoom.state='TREATING';p.targetRoom.timer=p.targetRoom.treatmentTime}}else if(p.state==='LEAVING'){moveTo(p,cw/2,ch+50,dt);if(p.y>ch+40)world.patients.splice(i,1)}}for(let i=world.particles.length-1;i>=0;i--){const p=world.particles[i];p.life-=dt;p.y+=p.vy*dt;if(p.life<=0)world.particles.splice(i,1)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke()}function drawStar(x,y,r,c){ctx.save();ctx.translate(x,y);ctx.rotate(-.2);ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:r*.45;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.restore()}function drawBackground(){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#10071f');g.addColorStop(.48,'#241541');g.addColorStop(1,'#4b304a');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.globalAlpha=.55;for(let i=0;i<9;i++){const x=((i*97+lastTime*.012)%(cw+120))-60;ctx.fillStyle=i%2?'#ff315d':'#29f4ff';ctx.fillRect(x,72+(i%3)*72,70,12);ctx.fillStyle='#08050f';ctx.font='20px Bangers';ctx.fillText(i%2?'WANTED':'TOY',x+5,82+(i%3)*72)}ctx.globalAlpha=.22;ctx.strokeStyle='#fff6dc';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<cw;x+=38){ctx.moveTo(x,0);ctx.lineTo(x,ch)}for(let y=0;y<ch;y+=38){ctx.moveTo(0,y);ctx.lineTo(cw,y)}ctx.stroke();ctx.restore();ctx.fillStyle='#15111a';ctx.fillRect(0,ch-64,cw,64);ctx.fillStyle='#ffd23f';for(let x=-60;x<cw+80;x+=90)ctx.fillRect(x+(lastTime*.03%90),ch-34,48,5)}function drawStall(r){const rw=r.type==='reception'?202:ROOM_WIDTH,rh=80,rx=r.x-rw/2,ry=r.y-rh/2;ctx.save();ctx.shadowColor=r===world.selectedRoom?'#29f4ff':'rgba(0,0,0,.45)';ctx.shadowBlur=r===world.selectedRoom?20:8;ctx.fillStyle=r.type==='lasso'?'#71ff7b':r.type==='reception'?'#ffd23f':'#fff6dc';ctx.strokeStyle='#08050f';ctx.lineWidth=4;rr(rx,ry,rw,rh,12);ctx.shadowBlur=0;ctx.fillStyle=r.type==='lasso'?'#29f4ff':'#ff315d';ctx.fillRect(rx,ry+rh-13,rw,13);ctx.fillStyle='#08050f';ctx.font='18px Bangers';ctx.textAlign='center';const label=r.type==='reception'?'TOY SHERIFF HQ':r.type==='lasso'?'LASSO LOUNGE '+r.floor:'CURB STALL '+r.floor;ctx.fillText(label,r.x,r.y-12);drawStar(r.x-38,r.y+16,9,'#ffd23f');ctx.fillText('x '+(r.levelSpeed+r.levelValue-1),r.x+3,r.y+22);if(r.type!=='reception'){const ay=r.y+Math.sin(r.anim)*3;ctx.fillStyle='#c57535';ctx.fillRect(r.x+30,ay-5,18,20);ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(r.x+39,ay-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08050f';ctx.fillRect(r.x+29,ay-22,20,5);ctx.fillRect(r.x+34,ay-29,10,9)}ctx.restore()}function drawCowboy(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,15,14,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c87538';ctx.fillRect(-8,-1,16,17);ctx.fillStyle='#ffd59a';ctx.beginPath();ctx.arc(0,-10,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08050f';ctx.fillRect(-11,-20,22,5);ctx.fillRect(-6,-29,12,10);ctx.fillStyle='#ff315d';ctx.fillRect(-8,0,16,4);ctx.fillStyle='#08050f';ctx.fillRect(-4,-12,2,2);ctx.fillRect(3,-12,2,2);ctx.strokeStyle='#08050f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-6,4,0,Math.PI);ctx.stroke();ctx.restore()}function drawKid(p){let px=p.x,py=p.y;if(p.mentalState==='YELLOW')px+=Math.sin(lastTime*.06+p.phase)*2;if(p.mentalState==='RED')px+=Math.sin(lastTime*.12+p.phase)*5;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(px,py+13,10,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(px-8,py,16,17,6);ctx.fill();ctx.fillStyle='#fff6dc';ctx.beginPath();ctx.arc(px,py-6,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08050f';ctx.fillRect(px-4,py-8,2,2);ctx.fillRect(px+3,py-8,2,2);if(p.type==='shadow'){ctx.strokeStyle=p.mentalState==='RED'?'#ff315d':'#ffd23f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py-6,12,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#08050f';ctx.fillRect(px-10,py-20,20,3);ctx.fillStyle=p.color;ctx.fillRect(px-9,py-19,18*(p.sanity/100),2)}}function draw(){drawBackground();ctx.save();ctx.translate(0,world.cameraY);const maxFloor=Math.max(...world.rooms.map(r=>r.floor)),shaftHeight=maxFloor*FLOOR_HEIGHT+200;ctx.fillStyle='#08050f';ctx.fillRect(cw/2-22,ch-80-shaftHeight,44,shaftHeight);ctx.fillStyle='#ff315d';ctx.fillRect(cw/2-6,ch-80-shaftHeight,12,shaftHeight);for(let f=0;f<=maxFloor+2;f++){ctx.fillStyle='rgba(255,246,220,.20)';ctx.fillRect(0,ch-80-f*FLOOR_HEIGHT,cw,3)}if(world.rooms.length<gameConfig.mentalUnlockLevel){const lockY=ch-80-((world.rooms.length+2)*FLOOR_HEIGHT);ctx.fillStyle='rgba(8,5,15,.42)';ctx.fillRect(0,lockY-95,cw,96);ctx.fillStyle='#ffd23f';ctx.font='24px Bangers';ctx.textAlign='center';ctx.fillText('SHADOW CREW AT BLOCK 25',cw/2,lockY-40)}world.rooms.forEach(drawStall);world.patients.forEach(drawKid);drawCowboy(cw/2,ch-105,.9);world.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.font='24px Bangers';ctx.textAlign='center';ctx.strokeStyle='#08050f';ctx.lineWidth=4;ctx.strokeText(p.text,p.x,p.y);ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1});ctx.restore()}function loop(t){const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;if(gameState==='PLAYING')update(dt);draw();requestAnimationFrame(loop)}
let isDragging=false,startY=0,startCameraY=0,clickStartTime=0;function handleInput(e){unlockAudio();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(e.type==='pointerdown'){isDragging=true;startY=y;startCameraY=world.targetCameraY;clickStartTime=Date.now()}else if(e.type==='pointermove'&&isDragging){const dy=y-startY;world.targetCameraY=startCameraY+dy;if(Math.abs(dy)>10)clickStartTime=0}else if(e.type==='pointerup'||e.type==='pointercancel'){isDragging=false;if(Date.now()-clickStartTime<200&&clickStartTime!==0)handleTap(x,y)}}function handleTap(x,y){const wy=y-world.cameraY;let hit=null;world.rooms.forEach(r=>{const rw=r.type==='reception'?202:ROOM_WIDTH,rh=80;if(x>=r.x-rw/2&&x<=r.x+rw/2&&wy>=r.y-rh/2&&wy<=r.y+rh/2)hit=r});if(hit&&hit.type!=='reception'){world.selectedRoom=hit;openModal()}else world.selectedRoom=null}function updateUI(){document.getElementById('score-display').textContent=world.money;document.getElementById('level-display').textContent=world.rooms.length;document.getElementById('build-cost').textContent=`($${getBuildCost('stall')})`;const lvl=world.rooms.length,n=document.getElementById('next-unlock');if(lvl<25)n.textContent='Next: Shadow Crew Lv 25';else if(lvl<28)n.textContent='Next: Lasso Lounge Lv 28';else n.textContent='Block fully live';if(world.paddedUnlocked){document.getElementById('build-lasso-btn').classList.remove('hidden');document.getElementById('build-lasso-cost').textContent=`($${getBuildCost('lasso')})`}}function openModal(){const r=world.selectedRoom;document.getElementById('upgrade-modal').classList.remove('hidden');document.getElementById('modal-title').textContent=r.type==='lasso'?'Lasso Lounge '+r.floor:'Curb Stall '+r.floor;playSfx('modal');updateModal();gameState='MODAL';bgm.pause()}function updateModal(){const r=world.selectedRoom;if(!r)return;document.getElementById('lvl-speed').textContent=r.levelSpeed;document.getElementById('cost-speed').textContent='$'+r.upgradeCostSpeed;document.getElementById('lvl-value').textContent=r.levelValue;document.getElementById('cost-value').textContent='$'+r.upgradeCostValue;document.getElementById('upgrade-speed-btn').style.opacity=world.money>=r.upgradeCostSpeed?1:.48;document.getElementById('upgrade-value-btn').style.opacity=world.money>=r.upgradeCostValue?1:.48}function closeModal(){document.getElementById('upgrade-modal').classList.add('hidden');world.selectedRoom=null;gameState='PLAYING';playSfx('modal');if(audioUnlocked)bgm.play().catch(()=>{})}canvas.addEventListener('pointerdown',handleInput,{passive:false});canvas.addEventListener('pointermove',handleInput,{passive:false});canvas.addEventListener('pointerup',handleInput,{passive:false});canvas.addEventListener('pointercancel',handleInput,{passive:false});document.getElementById('build-btn').addEventListener('click',e=>{e.stopPropagation();buildRoom('stall')});document.getElementById('build-lasso-btn').addEventListener('click',e=>{e.stopPropagation();buildRoom('lasso')});document.getElementById('upgrade-speed-btn').addEventListener('click',e=>{e.stopPropagation();upgradeRoom('speed')});document.getElementById('upgrade-value-btn').addEventListener('click',e=>{e.stopPropagation();upgradeRoom('value')});document.getElementById('close-modal-btn').addEventListener('click',e=>{e.stopPropagation();closeModal()});const ro=new ResizeObserver(entries=>{const rect=entries[0].contentRect;canvas.width=rect.width*devicePixelRatio;canvas.height=rect.height*devicePixelRatio;canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';cw=rect.width;ch=rect.height;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);if(!initialized)initGame()});document.addEventListener('DOMContentLoaded',()=>ro.observe(canvas));
</script></body></html>
