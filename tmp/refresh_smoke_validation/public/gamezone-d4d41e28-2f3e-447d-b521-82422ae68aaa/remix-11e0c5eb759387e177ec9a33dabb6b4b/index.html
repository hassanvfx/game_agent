<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Skyline Sprint</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #0f1635;
            --sky-mid: #17285d;
            --sky-bottom: #1b4e91;
            --city-glow: #7dd3fc;
            --track-top: #1d4ed8;
            --track-bottom: #081226;
            --lane-line: rgba(125, 211, 252, 0.32);
            --panel-bg: rgba(8, 18, 38, 0.76);
            --panel-border: rgba(125, 211, 252, 0.42);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --shadow: rgba(2, 6, 23, 0.42);
            --hero: #facc15;
            --hero-accent: #fb7185;
            --hazard: #ef4444;
            --hazard-edge: #7f1d1d;
            --text-main: #eff6ff;
            --text-muted: #cbd5e1;
            --hud-chip: rgba(15, 23, 42, 0.7);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(125, 211, 252, 0.18), transparent 30%),
                linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .hidden { display: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-10 { padding: 2.5rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-5xl { font-size: clamp(2.25rem, 6vw, 3rem); }
        .text-6xl { font-size: clamp(3rem, 8vw, 4.5rem); }
        .text-white { color: #fff; }
        .drop-shadow-md { text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35); }
        .drop-shadow-sm { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25); }
        .shadow-xl { box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25); }
        .transform { transform: translateZ(0); }
        .transition { transition: all 0.2s ease; }

        .glass-panel {
            background:
                linear-gradient(180deg, var(--panel-highlight), transparent 28%),
                var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 18px 38px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            max-width: min(92vw, 34rem);
        }

        .title-text {
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            line-height: 0.95;
            text-transform: uppercase;
        }

        .subtitle-text,
        .hud-text,
        .result-text,
        .action-button {
            font-family: 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.03em;
        }

        .title-stroke {
            color: var(--text-main);
            text-shadow:
                0 0 0 #000,
                0 4px 0 rgba(8, 18, 38, 0.9),
                0 0 24px rgba(125, 211, 252, 0.45);
        }

        .result-stroke {
            text-shadow:
                0 2px 0 rgba(255, 255, 255, 0.15),
                0 0 16px rgba(251, 113, 133, 0.28);
        }

        .action-button {
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 700;
            padding: 1rem 2.5rem;
            min-width: 12rem;
            color: var(--text-main);
            text-transform: uppercase;
            box-shadow:
                0 12px 20px rgba(2, 6, 23, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .button-primary {
            background: linear-gradient(180deg, #facc15, #f59e0b);
            color: #1f2937;
            border-bottom: 4px solid #b45309;
        }

        .button-primary:hover {
            background: linear-gradient(180deg, #fde047, #fbbf24);
            border-bottom-color: #d97706;
        }

        .button-secondary {
            background: linear-gradient(180deg, #38bdf8, #2563eb);
            color: #eff6ff;
            border-bottom: 4px solid #1d4ed8;
        }

        .button-secondary:hover {
            background: linear-gradient(180deg, #67e8f9, #3b82f6);
        }

        .action-button:active {
            transform: translateY(1px);
            border-bottom-width: 0;
        }

        .hud-panel {
            padding: 0.65rem 1rem;
            border-radius: 999px;
            background: var(--hud-chip);
            border: 1px solid rgba(125, 211, 252, 0.28);
            box-shadow: 0 10px 20px rgba(2, 6, 23, 0.22);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        .feedback-overlay {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(26vw, 128px);
            aspect-ratio: 1;
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid rgba(125, 211, 252, 0.35);
            background: rgba(8, 18, 38, 0.68);
            box-shadow: 0 12px 24px rgba(2, 6, 23, 0.28);
            opacity: 0;
            transform: translateY(8px) scale(0.94);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 3;
        }

        .feedback-overlay.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feedback-badge {
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            padding: 0.3rem 0.5rem;
            border-radius: 999px;
            background: rgba(8, 18, 38, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* [agent-note][stage4] repaired: catalog-font-remap | title=Orbitron ui=Exo 2 */
        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .top-6 { top: 1rem; }
            .left-6 { left: 1rem; }
            .text-3xl { font-size: 1.5rem; }
            .action-button {
                width: 100%;
                min-width: 0;
            }

            .feedback-overlay {
                width: min(32vw, 104px);
                right: 0.75rem;
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto transform transition">
                <h1 class="title-text title-stroke text-6xl text-white mb-4">SKYLINE SPRINT</h1>
                <p class="subtitle-text text-white text-xl mb-2 font-bold drop-shadow-md">Dash through the neon skyline and vault every blockade.</p>
                <p class="subtitle-text" style="color:var(--text-muted); margin:0 0 2rem; font-size:0.95rem;">Pilot the glowing courier cube, keep your rhythm, and clear the route.</p>
                <button id="start-btn" class="action-button button-primary rounded-xl shadow-xl text-2xl">START RUN</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto transform transition">
                <h2 class="title-text result-stroke text-5xl mb-2" style="color:#fb7185;">RUN ENDED</h2>
                <div class="result-text text-3xl text-white mb-8 font-bold drop-shadow-md">Route Cleared: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-button button-secondary rounded-xl shadow-xl text-xl">RUN AGAIN</button>
            </div>

            <div id="hud" class="hud-panel subtitle-text absolute top-6 left-6 text-3xl font-bold text-white hidden">
                Route Cleared: <span id="score">0</span>
            </div>

            <div id="feedback-overlay" class="feedback-overlay hidden pointer-events-none" aria-hidden="true">
                <span id="feedback-badge" class="feedback-badge">Boost</span>
                <img id="feedback-gif" alt="Gameplay reaction">
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            },
            gifs: {
                boost: "https://i.giphy.com/09YpqSjkbY8DrZXgQz.gif",
                crash: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.gif"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = new Map();
                this.lastPlayedAt = new Map();
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                if (!this.bgm.paused) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, { volume = 0.58, cooldown = 0 } = {}) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const last = this.lastPlayedAt.get(key) || 0;
                if (now - last < cooldown) return;
                this.lastPlayedAt.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackGif = document.getElementById('feedback-gif');
        const feedbackBadge = document.getElementById('feedback-badge');
        let feedbackTimer = null;

        function showFeedback(type) {
            const config = type === 'crash'
                ? { src: ASSETS.gifs.crash, label: 'Crash' }
                : { src: ASSETS.gifs.boost, label: 'Boost' };

            feedbackGif.src = config.src;
            feedbackBadge.textContent = config.label;
            feedbackOverlay.classList.remove('hidden');
            requestAnimationFrame(() => feedbackOverlay.classList.add('visible'));
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackOverlay.classList.remove('visible');
                feedbackOverlay.classList.add('hidden');
            }, type === 'crash' ? 1800 : 900);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const gameContainer = document.getElementById('game-container');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 6;
        let wasGrounded = false;

        // Entities
        let player = {
            x: 100,
            y: 0,
            w: 40,
            h: 40,
            dy: 0,
            jumpForce: -13,
            gravity: 0.6,
            grounded: false,
            color: '#fbbf24'
        };

        let obstacles = [];
        let clouds = [];
        let particles = [];

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. HELPERS & RENDERING */

        function drawBlock(x, y, w, h, color, isStudded = false) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x, y, w, 4);
            ctx.fillRect(x, y, 4, h);

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y + h - 4, w, 4);
            ctx.fillRect(x + w - 4, y, 4, h);

            if (isStudded) {
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                const spacing = 16;
                for (let sx = x + 4; sx < x + w; sx += spacing) {
                    for (let sy = y + 4; sy < y + h; sy += spacing) {
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function createCloud() {
            return {
                x: width + Math.random() * 200,
                y: Math.random() * (height / 2),
                w: 60 + Math.random() * 60,
                h: 30 + Math.random() * 20,
                speed: 0.5 + Math.random() * 1
            };
        }

        function createObstacle() {
            const h = 40 + Math.random() * 40;
            return {
                x: width,
                y: height - 100 - h,
                w: 40,
                h: h,
                passed: false
            };
        }

        function createParticle(x, y, color) {
            return {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 1.0,
                color: color
            };
        }

        /** 5. GAME LOGIC */
        function initGame() {
            score = 0;
            gameSpeed = 6;
            player.y = height - 100 - player.h;
            player.dy = 0;
            obstacles = [];
            particles = [];
            clouds = [];
            frameCount = 0;
            for (let i = 0; i < 5; i++) {
                let c = createCloud();
                c.x = Math.random() * width;
                clouds.push(c);
            }
            wasGrounded = true;
            document.getElementById('score').innerText = score;
        }

        function update() {
            frameCount++;
            gameSpeed += 0.001;

            player.dy += player.gravity;
            player.y += player.dy;

            const groundY = height - 100;
            if (player.y + player.h > groundY) {
                player.y = groundY - player.h;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            if (!wasGrounded && player.grounded) {
                audio.playSFX('land', { volume: 0.34, cooldown: 120 });
            }
            wasGrounded = player.grounded;

            if (frameCount % Math.floor(1000 / (gameSpeed * 2)) === 0) {
                if (Math.random() > 0.3) obstacles.push(createObstacle());
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.h > obs.y
                ) {
                    gameOver();
                }

                if (!obs.passed && obs.x + obs.w < player.x) {
                    score++;
                    obs.passed = true;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', { volume: 0.46, cooldown: 70 });
                    showFeedback('boost');
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }

            if (Math.random() < 0.01) clouds.push(createCloud());
            for (let i = clouds.length - 1; i >= 0; i--) {
                let c = clouds[i];
                c.x -= c.speed;
                if (c.x + c.w < 0) clouds.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
            skyGradient.addColorStop(0, '#0f1635');
            skyGradient.addColorStop(0.55, '#17285d');
            skyGradient.addColorStop(1, '#1b4e91');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(125, 211, 252, 0.08)';
            for (let i = 0; i < width; i += 90) {
                const beamHeight = 40 + (i % 180);
                ctx.fillRect(i, height * 0.18, 18, beamHeight);
            }

            const skylineBase = height - 100;
            for (let i = 0; i < width + 80; i += 70) {
                const towerHeight = 80 + ((i / 70) % 4) * 35;
                ctx.fillStyle = i % 140 === 0 ? 'rgba(15, 23, 42, 0.52)' : 'rgba(30, 41, 59, 0.65)';
                ctx.fillRect(i, skylineBase - towerHeight, 54, towerHeight);
                ctx.fillStyle = 'rgba(125, 211, 252, 0.18)';
                for (let wy = skylineBase - towerHeight + 10; wy < skylineBase - 10; wy += 16) {
                    ctx.fillRect(i + 10, wy, 8, 6);
                    ctx.fillRect(i + 28, wy, 8, 6);
                }
            }

            clouds.forEach(c => {
                drawBlock(c.x, c.y, c.w, c.h, 'rgba(224,242,254,0.78)');
                drawBlock(c.x + 20, c.y - 15, c.w - 30, c.h, 'rgba(224,242,254,0.72)');
            });

            const groundH = 100;
            const blockSize = 50;
            const offset = (frameCount * gameSpeed) % blockSize;
            const roadGradient = ctx.createLinearGradient(0, height - groundH, 0, height);
            roadGradient.addColorStop(0, '#1d4ed8');
            roadGradient.addColorStop(1, '#081226');

            for (let x = -offset; x < width; x += blockSize) {
                drawBlock(x, height - groundH, blockSize, groundH, x % 100 === 0 ? '#1e3a8a' : '#1d4ed8', true);
            }

            ctx.fillStyle = roadGradient;
            ctx.fillRect(0, height - groundH, width, groundH);
            ctx.fillStyle = 'rgba(125, 211, 252, 0.28)';
            for (let x = -offset; x < width; x += 80) {
                ctx.fillRect(x, height - groundH / 2, 40, 6);
            }

            obstacles.forEach(obs => {
                drawBlock(obs.x, obs.y, obs.w, obs.h, '#ef4444');
                ctx.fillStyle = 'rgba(255, 245, 245, 0.28)';
                ctx.fillRect(obs.x + 6, obs.y + 8, obs.w - 12, 6);
                ctx.fillStyle = '#7f1d1d';
                ctx.fillRect(obs.x, obs.y + obs.h - 10, obs.w, 10);
            });

            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            if (!player.grounded) {
                ctx.rotate((player.dy * 0.1));
            }
            ctx.translate(-(player.x + player.w / 2), -(player.y + player.h / 2));
            drawBlock(player.x, player.y, player.w, player.h, player.color);
            ctx.fillStyle = '#fb7185';
            ctx.fillRect(player.x + 6, player.y + 6, player.w - 12, 8);
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(player.x + 8, player.y + 18, 10, 10);
            ctx.fillRect(player.x + 24, player.y + 18, 10, 10);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.x + 12, player.y + 22, 4, 4);
            ctx.fillRect(player.x + 28, player.y + 22, 4, 4);
            ctx.fillStyle = '#7c2d12';
            ctx.fillRect(player.x + 14, player.y + 32, 12, 3);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x - 4, player.y + 12, 4, 16);
            ctx.fillRect(player.x + player.w, player.y + 12, 4, 16);

            ctx.restore();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 6, 6);
                ctx.globalAlpha = 1.0;
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.64, cooldown: 0 });
            showFeedback('crash');

            for (let i = 0; i < 20; i++) {
                particles.push(createParticle(player.x + player.w / 2, player.y + player.h / 2, '#eab308'));
                particles.push(createParticle(player.x + player.w / 2, player.y + player.h / 2, '#ef4444'));
            }
            draw();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;
            if (player.grounded) {
                player.dy = player.jumpForce;
                player.grounded = false;
                audio.playSFX('jump', { volume: 0.42, cooldown: 90 });

                for (let i = 0; i < 5; i++) {
                    particles.push(createParticle(player.x + player.w / 2, player.y + player.h, '#fff'));
                }
            } else {
                audio.playSFX('blocked', { volume: 0.22, cooldown: 180 });
            }
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.45, cooldown: 0 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.45, cooldown: 0 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        // [agent-note][stage4] repaired: mobile-start-action | element: #start-btn | action: scoped touch suppression to gameplay surface
        gameContainer.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            if (e.target.closest('button')) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        gameContainer.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            if (e.target.closest('button')) return;
            jump();
        });
    });
    </script>
</body>
</html>
