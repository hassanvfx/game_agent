<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Courier Showdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            color-scheme: dark;
            --sky-top: #160f33;
            --sky-bottom: #041223;
            --panel-bg: rgba(12, 19, 40, 0.78);
            --panel-border: rgba(124, 212, 255, 0.3);
            --glow-cyan: #82f6ff;
            --glow-gold: #ffd36b;
            --pilot-blue: #59b8ff;
            --rival-magenta: #ff6f91;
            --text-main: #f5fbff;
            --text-soft: #c4d4f8;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(96, 72, 221, 0.35), transparent 35%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        button,
        h1,
        h2,
        #hud {
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .bottom-20 { bottom: 5rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .p-10 { padding: 2.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .text-white { color: #ffffff; }
        .text-lg { font-size: 1.125rem; line-height: 1.4; }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-2xl { font-size: 1.5rem; line-height: 1.3; }
        .text-3xl { font-size: 1.875rem; line-height: 1.2; }
        .text-5xl { font-size: clamp(2.4rem, 5vw, 3.3rem); line-height: 1.1; }
        .text-6xl { font-size: clamp(3rem, 7vw, 4.5rem); line-height: 1.05; }
        .text-sm { font-size: 0.95rem; line-height: 1.4; }
        .uppercase { text-transform: uppercase; }
        .tracking-wider { letter-spacing: 0.08em; }
        .rounded-2xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-lg { box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35); }
        .drop-shadow-sm { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35)); }
        .drop-shadow-md { filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45)); }
        .text-transparent { color: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .bg-gradient-to-r { background-image: linear-gradient(to right, #fb923c, #dc2626); }
        .from-orange-400 {}
        .to-red-600 {}
        .text-gray-300 { color: #d1d5db; }
        .text-gray-400 { color: #9ca3af; }
        .text-blue-400 { color: #60a5fa; }
        .text-red-400 { color: #f87171; }
        .text-green-400 { color: #4ade80; }
        .text-red-500 { color: #ef4444; }
        .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(17, 26, 50, 0.9), rgba(8, 13, 32, 0.86)),
                radial-gradient(circle at top, rgba(130, 246, 255, 0.12), transparent 55%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 24px rgba(130, 246, 255, 0.08);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 35%, transparent 65%, rgba(255,211,107,0.08));
            opacity: 0.8;
        }

        .btn-grad {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
            background-image: linear-gradient(110deg, #ff9f43 0%, #ff5fa2 45%, #7cf3ff 100%);
            color: #07111f;
            text-shadow: none;
            transition: background-position 0.5s ease, transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
            background-size: 180% auto;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.3), 0 0 22px rgba(124, 243, 255, 0.14);
        }

        .btn-grad:hover { background-position: right center; }
        .btn-grad:active { transform: scale(0.98); }
        .btn-grad:focus-visible {
            outline: 2px solid var(--glow-cyan);
            outline-offset: 3px;
            filter: brightness(1.04);
        }

        #tutorial {
            color: rgba(196, 212, 248, 0.82);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 14px rgba(130, 246, 255, 0.28);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 18%, rgba(255,255,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 42% 10%, rgba(130,246,255,0.4) 0 1.5px, transparent 3px),
                radial-gradient(circle at 73% 22%, rgba(255,211,107,0.35) 0 2px, transparent 3px),
                radial-gradient(circle at 86% 9%, rgba(255,255,255,0.24) 0 1.5px, transparent 3px),
                radial-gradient(circle at 63% 30%, rgba(255,255,255,0.15) 0 1.5px, transparent 3px);
            opacity: 0.9;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent 0%, transparent 65%, rgba(7, 14, 29, 0.38) 100%);
        }

        #hud {
            padding-top: max(1rem, env(safe-area-inset-top));
            font-size: clamp(1rem, 2.5vw, 1.5rem);
        }

        #hud > div {
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: rgba(10, 16, 33, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.2);
        }

        #start-screen,
        #game-over-screen {
            position: relative;
            width: min(92vw, 34rem);
        }

        #start-screen h1,
        #game-over-screen h2 {
            letter-spacing: 0.08em;
        }

        .feedback-badge {
            position: absolute;
            top: calc(max(1rem, env(safe-area-inset-top)) + 4.6rem);
            right: clamp(0.75rem, 2vw, 1.4rem);
            width: clamp(4.8rem, 16vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(7, 13, 30, 0.48);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(-0.5rem) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 5;
        }

        .feedback-badge.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-badge.loss {
            left: clamp(0.75rem, 2vw, 1.4rem);
            right: auto;
        }

        .feedback-badge img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: inherit;
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.4rem; }
            .px-8 { padding-left: 0.9rem; padding-right: 0.9rem; }
            .text-3xl { font-size: 1rem; }
            .text-2xl { font-size: 1.15rem; }
            .text-xl { font-size: 1rem; }
            .text-lg { font-size: 0.95rem; }
            .bottom-20 { bottom: 3.5rem; }
            .feedback-badge {
                top: calc(max(0.75rem, env(safe-area-inset-top)) + 3.7rem);
                width: 4.6rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="win-gif" class="feedback-badge" aria-hidden="true">
            <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Victory courier reaction">
        </div>
        <div id="loss-gif" class="feedback-badge loss" aria-hidden="true">
            <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Rival score reaction">
        </div>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- HUD -->
            <div id="hud" class="absolute top-4 w-full flex justify-between px-8 text-3xl font-bold text-white drop-shadow-md hidden">
                <div class="text-blue-400">YOU: <span id="scorePlayer">0</span></div>
                <div class="text-red-400">RIVAL: <span id="scoreEnemy">0</span></div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-2xl text-center pointer-events-auto flex flex-col items-center gap-4">
                <h1 class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-600 mb-2 drop-shadow-sm">SKY COURIER</h1>
                <p class="text-gray-300 text-lg">Drag to sprint for the parcel. Hold, then release, to leap and launch it.</p>
                <p class="text-gray-400 text-sm mb-4">Beat the rival courier to 3 clean deliveries.</p>
                <button id="start-btn" class="btn-grad font-bold py-4 px-12 rounded-full shadow-lg text-xl uppercase tracking-wider">Start Route</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-2xl text-center pointer-events-auto">
                <h2 id="winnerText" class="text-5xl font-bold text-white mb-4">ROUTE COMPLETE</h2>
                <div class="text-2xl text-gray-300 mb-8">Delivery Count: <span id="finalScoreDisplay">0 - 0</span></div>
                <button id="restart-btn" class="btn-grad font-bold py-3 px-10 rounded-full shadow-lg text-lg">Run Again</button>
            </div>
            
            <!-- Tutorial Hint -->
            <div id="tutorial" class="absolute bottom-20 text-sm animate-pulse hidden">
                Leap near the drop zone for an instant handoff.
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            defeatLoop: "https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                launch: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3",
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                block: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                button: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = this.createLoop(ASSETS.bgm, 0.2);
                this.resultLoops = {
                    win: this.createLoop(ASSETS.victoryLoop, 0.2),
                    lose: this.createLoop(ASSETS.defeatLoop, 0.2)
                };
                this.sfx = {};
                this.lastPlayedAt = {};
                this.cooldowns = {
                    block: 110,
                    pickup: 160,
                    land: 140,
                    jump: 180
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                    this.sfx[k].volume = ({
                        start: 0.55,
                        jump: 0.5,
                        land: 0.45,
                        launch: 0.55,
                        pickup: 0.5,
                        score: 0.58,
                        fail: 0.52,
                        block: 0.48,
                        button: 0.4
                    })[k] ?? 0.5;
                }
            }

            createLoop(src, volume) {
                const track = new Audio(src);
                track.loop = true;
                track.preload = 'auto';
                track.volume = volume;
                return track;
            }

            unlock() {
                this.enabled = true;
            }

            stopAllLoops() {
                [this.bgm, ...Object.values(this.resultLoops)].forEach(track => {
                    track.pause();
                    track.currentTime = 0;
                });
            }

            playBGM() {
                if (!this.enabled) return;
                this.stopAllLoops();
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() {
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playResultLoop(kind) {
                if (!this.enabled) return;
                this.stopAllLoops();
                const track = this.resultLoops[kind];
                track?.play().catch(() => {});
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = this.cooldowns[key] ?? 0;
                if (cooldown && now - (this.lastPlayedAt[key] || 0) < cooldown) return;
                this.lastPlayedAt[key] = now;

                const sample = this.sfx[key].cloneNode();
                sample.volume = this.sfx[key].volume;
                sample.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let gameActive = false;
        
        // Game State
        let playerScore = 0;
        let enemyScore = 0;
        const WIN_SCORE = 3;
        
        // Physics Constants
        const GRAVITY = 0.6;
        const FRICTION = 0.9;
        const BOUNCE = 0.7;
        const JUMP_FORCE = -15;
        const MOVE_SPEED = 6;
        
        // Entities
        let player = { x: 100, y: 0, w: 40, h: 80, vx: 0, vy: 0, color: '#3b82f6', onGround: false, holdingBall: false, charge: 0 };
        let enemy = { x: 0, y: 0, w: 40, h: 80, vx: 0, vy: 0, color: '#ef4444', onGround: false, holdingBall: false, state: 'chase', reactionTimer: 0 };
        let ball = { x: 0, y: 0, r: 12, vx: 0, vy: 0, owner: null };
        let hoop = { x: 0, y: 0, r: 25 }; // Drop zone position

        // Input
        let input = { x: 0, y: 0, isDown: false, chargeStart: 0, wasDownInAir: false };
        let previousPlayerOnGround = false;
        let previousEnemyOnGround = false;
        let previousBallOwner = null;
        let feedbackTimer = null;

        /** 4. INITIALIZATION & RESIZE */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Reposition drop zone based on screen size
            hoop.x = width - 80;
            hoop.y = height - 250;
        }
        window.addEventListener('resize', resize);
        resize();

        function showFeedback(type) {
            const badge = document.getElementById(type === 'win' ? 'win-gif' : 'loss-gif');
            if (!badge) return;
            clearTimeout(feedbackTimer);
            badge.classList.add('show');
            feedbackTimer = setTimeout(() => badge.classList.remove('show'), 1300);
        }

        function resetRound() {
            // Reset positions
            player.x = 100;
            player.y = height - 100;
            player.vx = 0;
            player.vy = 0;
            player.holdingBall = false;
            player.charge = 0;

            enemy.x = width - 100;
            enemy.y = height - 100;
            enemy.vx = 0;
            enemy.vy = 0;
            enemy.holdingBall = false;

            // Parcel spawns in middle, drops from sky
            ball.x = width / 2;
            ball.y = 100;
            ball.vx = 0;
            ball.vy = 0;
            ball.owner = null;
        }

        function initGame() {
            playerScore = 0;
            enemyScore = 0;
            updateHUD();
            resetRound();
        }

        /** 5. GAME LOGIC */
        function updateHUD() {
            document.getElementById('scorePlayer').innerText = playerScore;
            document.getElementById('scoreEnemy').innerText = enemyScore;
        }

        function checkCollision(rect1, rect2) {
            return (rect1.x < rect2.x + rect2.w &&
                    rect1.x + rect1.w > rect2.x &&
                    rect1.y < rect2.y + rect2.h &&
                    rect1.y + rect1.h > rect2.y);
        }

        function dist(x1, y1, x2, y2) {
            return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
        }

        function updatePhysics() {
            const floorY = height - 50;
            previousPlayerOnGround = player.onGround;
            previousEnemyOnGround = enemy.onGround;
            previousBallOwner = ball.owner;

            const targetX = Math.min(Math.max(input.x, 0), width);
            const dx = targetX - (player.x + player.w / 2);
            
            if (Math.abs(dx) > 5) {
                player.vx = Math.sign(dx) * MOVE_SPEED;
            } else {
                player.vx = 0;
            }

            if (input.isDown && player.onGround) {
                player.charge = Math.min(player.charge + 1, 20);
                player.vx *= 0.5;
            } else if (!input.isDown && player.charge > 0) {
                player.vy = JUMP_FORCE - (player.charge * 0.5);
                player.charge = 0;
                player.onGround = false;
                audio.playSFX('jump');
            }

            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            if (player.y + player.h > floorY) {
                player.y = floorY - player.h;
                player.vy = 0;
                player.onGround = true;
            }
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > width) player.x = width - player.w;

            let targetEnemyX = enemy.x;
            
            if (ball.owner === 'enemy') {
                targetEnemyX = hoop.x - 100;
                
                if (Math.abs(enemy.x - targetEnemyX) < 50 && enemy.onGround) {
                    enemy.vy = JUMP_FORCE - 5;
                    enemy.onGround = false;
                }
                if (enemy.vy > -2 && enemy.vy < 2 && !enemy.onGround) {
                    shootBall(enemy, hoop);
                }

            } else if (ball.owner === 'player') {
                targetEnemyX = player.x + 50;
                
                if (player.y < floorY - 100 && enemy.onGround && Math.random() < 0.05) {
                    enemy.vy = JUMP_FORCE;
                    enemy.onGround = false;
                }
            } else {
                targetEnemyX = ball.x;
            }

            const edx = targetEnemyX - (enemy.x + enemy.w / 2);
            if (Math.abs(edx) > 5) {
                enemy.vx = Math.sign(edx) * (MOVE_SPEED * 0.9);
            } else {
                enemy.vx = 0;
            }

            enemy.vy += GRAVITY;
            enemy.x += enemy.vx;
            enemy.y += enemy.vy;

            if (enemy.y + enemy.h > floorY) {
                enemy.y = floorY - enemy.h;
                enemy.vy = 0;
                enemy.onGround = true;
            }
            if (enemy.x < 0) enemy.x = 0;
            if (enemy.x + enemy.w > width) enemy.x = width - enemy.w;

            if (ball.owner) {
                let holder = ball.owner === 'player' ? player : enemy;
                ball.x = holder.x + (holder.w / 2) + (ball.owner === 'player' ? 10 : -10);
                ball.y = holder.y + holder.h / 2;
                ball.vx = holder.vx;
                ball.vy = holder.vy;
                
                if (ball.owner === 'player' && !input.isDown && !player.onGround && input.wasDownInAir) {
                    shootBall(player, hoop);
                    input.wasDownInAir = false;
                }
                
                if (ball.owner === 'player' && input.isDown && !player.onGround) {
                    input.wasDownInAir = true;
                }

            } else {
                ball.vy += GRAVITY;
                ball.x += ball.vx;
                ball.y += ball.vy;

                if (ball.y + ball.r > floorY) {
                    ball.y = floorY - ball.r;
                    ball.vy *= -BOUNCE;
                    ball.vx *= FRICTION;
                }
                if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
                if (ball.x + ball.r > width) { ball.x = width - ball.r; ball.vx *= -1; }

                if (checkCircleRect(ball, player)) {
                    ball.owner = 'player';
                    audio.playSFX(previousBallOwner ? 'block' : 'pickup');
                } else if (checkCircleRect(ball, enemy)) {
                    ball.owner = 'enemy';
                }

                if (ball.x > hoop.x - hoop.r && ball.x < hoop.x + hoop.r &&
                    ball.y > hoop.y - 10 && ball.y < hoop.y + 10 && ball.vy > 0) {
                    
                    if (ball.lastOwner === 'player') {
                        playerScore++;
                        audio.playSFX('score');
                        showFeedback('win');
                        checkWin();
                    } else if (ball.lastOwner === 'enemy') {
                        enemyScore++;
                        audio.playSFX('fail');
                        showFeedback('loss');
                        checkWin();
                    }
                    resetRound();
                }
                
                if (dist(ball.x, ball.y, hoop.x - 30, hoop.y) < ball.r + 5) {
                    ball.vx *= -1;
                    ball.vy *= -1;
                    audio.playSFX('block');
                }
            }
            
            if (ball.owner === 'player' && checkCircleRect(ball, enemy)) {
                if (Math.random() > 0.5) {
                    ball.owner = null;
                    ball.vx = -10;
                    ball.vy = -5;
                    audio.playSFX('block');
                }
            }
            if (ball.owner === 'enemy' && checkCircleRect(ball, player)) {
                ball.owner = null;
                ball.vx = 10;
                ball.vy = -5;
                audio.playSFX('block');
            }

            if (!previousPlayerOnGround && player.onGround) {
                audio.playSFX('land');
            }
            if (!previousEnemyOnGround && enemy.onGround && Math.abs(enemy.vy) > 4) {
                audio.playSFX('land');
            }
        }

        function shootBall(shooter, target) {
            ball.owner = null;
            ball.lastOwner = shooter === player ? 'player' : 'enemy';
            audio.playSFX('launch');
             
            let dx = target.x - ball.x;
            let dy = target.y - ball.y;
            
            const distToHoop = dist(shooter.x, shooter.y, target.x, target.y);
            const isDunk = distToHoop < 150 && shooter.y < target.y;

            if (isDunk) {
                ball.vx = dx * 0.15;
                ball.vy = dy * 0.15;
            } else {
                let force = Math.min(distToHoop * 0.045, 25);
                ball.vx = (dx / distToHoop) * force * 1.5;
                ball.vy = -12 - (Math.abs(dy) * 0.05);
            }
            
            ball.vx += shooter.vx * 0.5;
        }

        function checkCircleRect(circle, rect) {
            let testX = circle.x;
            let testY = circle.y;
            if (circle.x < rect.x) testX = rect.x;
            else if (circle.x > rect.x + rect.w) testX = rect.x + rect.w;
            if (circle.y < rect.y) testY = rect.y;
            else if (circle.y > rect.y + rect.h) testY = rect.y + rect.h;
            let distX = circle.x - testX;
            let distY = circle.y - testY;
            return (distX * distX + distY * distY) <= (circle.r * circle.r);
        }

        function checkWin() {
            updateHUD();
            if (playerScore >= WIN_SCORE || enemyScore >= WIN_SCORE) {
                gameActive = false;
                audio.stopBGM();
                
                const won = playerScore >= WIN_SCORE;
                document.getElementById('winnerText').innerText = won ? "SHIFT CLEARED!" : "ROUTE LOST!";
                document.getElementById('winnerText').className = won ? "text-5xl font-bold text-green-400 mb-4" : "text-5xl font-bold text-red-500 mb-4";
                document.getElementById('finalScoreDisplay').innerText = `${playerScore} - ${enemyScore}`;
                
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                
                if (won) {
                    audio.playSFX('score');
                    showFeedback('win');
                    audio.playResultLoop('win');
                } else {
                    audio.playSFX('fail');
                    showFeedback('loss');
                    audio.playResultLoop('lose');
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#160f33');
            grad.addColorStop(0.45, '#0a1d38');
            grad.addColorStop(1, '#041223');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const horizonGlow = ctx.createRadialGradient(width * 0.5, height * 0.28, 20, width * 0.5, height * 0.28, width * 0.55);
            horizonGlow.addColorStop(0, 'rgba(255, 214, 120, 0.18)');
            horizonGlow.addColorStop(1, 'rgba(255, 214, 120, 0)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 18; i++) {
                const starX = ((i * 137) % width) + ((input.x || 0) * 0.015);
                const starY = 30 + ((i * 79) % Math.max(height * 0.4, 1));
                const twinkle = 1.5 + ((i % 3) * 0.7);
                ctx.fillStyle = i % 4 === 0 ? 'rgba(255, 217, 122, 0.75)' : 'rgba(205, 241, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(starX % width, starY, twinkle, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#102542';
            for (let i = 0; i < 10; i++) {
                let h = 100 + Math.sin(i * 132) * 50;
                let w = width / 8;
                ctx.fillRect(i * w - (input.x * 0.05), height - 50 - h, w + 2, h);
                ctx.fillStyle = 'rgba(130, 246, 255, 0.08)';
                ctx.fillRect(i * w - (input.x * 0.05) + w * 0.2, height - 50 - h + 18, w * 0.14, h * 0.5);
                ctx.fillStyle = '#102542';
            }

            ctx.strokeStyle = 'rgba(100, 191, 255, 0.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < width; i += 40) {
                ctx.moveTo(i - (input.x * 0.2), height - 200);
                ctx.lineTo(i + 20 - (input.x * 0.2), height - 50);
                ctx.moveTo(i + 20 - (input.x * 0.2), height - 200);
                ctx.lineTo(i - (input.x * 0.2), height - 50);
            }
            ctx.stroke();

            const floorGrad = ctx.createLinearGradient(0, height - 50, 0, height);
            floorGrad.addColorStop(0, '#25344a');
            floorGrad.addColorStop(1, '#141b29');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, height - 50, width, 50);

            ctx.strokeStyle = '#f4fbff';
            ctx.lineWidth = 4;
            ctx.shadowColor = 'rgba(124, 243, 255, 0.28)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(width - 250, height - 50);
            ctx.quadraticCurveTo(width - 250, height - 200, width, height - 200);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#7dc7ff';
            ctx.fillRect(hoop.x + 20, hoop.y, 10, height - hoop.y - 50);

            ctx.fillStyle = '#f4fbff';
            ctx.fillRect(hoop.x + 15, hoop.y - 40, 5, 60);
            ctx.strokeStyle = '#ff6f91';
            ctx.strokeRect(hoop.x + 15, hoop.y - 25, 5, 30);

            ctx.strokeStyle = '#ffb14a';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(hoop.x + 15, hoop.y);
            ctx.lineTo(hoop.x - 30, hoop.y);
            ctx.stroke();

            ctx.strokeStyle = '#e6f7ff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(hoop.x + 15, hoop.y);
            ctx.lineTo(hoop.x + 5, hoop.y + 30);
            ctx.lineTo(hoop.x - 20, hoop.y + 30);
            ctx.lineTo(hoop.x - 30, hoop.y);
            ctx.stroke();

            const drawCourier = (entity, accent, visor, isPlayer) => {
                ctx.save();
                ctx.translate(entity.x, entity.y);

                ctx.fillStyle = accent;
                ctx.beginPath();
                ctx.roundRect(6, 20, entity.w - 12, entity.h - 26, 12);
                ctx.fill();

                ctx.fillStyle = '#d7efff';
                ctx.beginPath();
                ctx.arc(entity.w / 2, 14, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = visor;
                ctx.beginPath();
                ctx.roundRect(entity.w / 2 - 12, 10, 24, 9, 5);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(entity.w / 2, 34);
                ctx.lineTo(entity.w / 2, entity.h - 16);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(entity.w / 2 - 10, entity.h - 10);
                ctx.lineTo(entity.w / 2 - 2, entity.h + 2);
                ctx.moveTo(entity.w / 2 + 10, entity.h - 10);
                ctx.lineTo(entity.w / 2 + 2, entity.h + 2);
                ctx.stroke();

                ctx.strokeStyle = accent;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(entity.w - 6, 30);
                ctx.lineTo(entity.w + 12, 22);
                ctx.lineTo(entity.w + 3, 38);
                ctx.stroke();

                if (isPlayer && entity.charge > 0) {
                    const meter = (entity.charge / 20) * entity.w;
                    const barGrad = ctx.createLinearGradient(0, -16, entity.w, -16);
                    barGrad.addColorStop(0, '#82f6ff');
                    barGrad.addColorStop(1, '#ffd36b');
                    ctx.fillStyle = 'rgba(2, 8, 21, 0.65)';
                    ctx.beginPath();
                    ctx.roundRect(0, -18, entity.w, 10, 6);
                    ctx.fill();
                    ctx.fillStyle = barGrad;
                    ctx.beginPath();
                    ctx.roundRect(0, -18, meter, 10, 6);
                    ctx.fill();
                }

                ctx.restore();
            };

            drawCourier(player, '#59b8ff', '#82f6ff', true);
            drawCourier(enemy, '#ff6f91', '#ffd36b', false);

            const ballGlow = ctx.createRadialGradient(ball.x - 3, ball.y - 5, 3, ball.x, ball.y, ball.r * 1.6);
            ballGlow.addColorStop(0, '#fff2bf');
            ballGlow.addColorStop(0.45, '#ffb14a');
            ballGlow.addColorStop(1, '#c76118');
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = ballGlow;
            ctx.fill();
            ctx.strokeStyle = '#261403';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(38, 20, 3, 0.85)';
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.r, ball.y);
            ctx.lineTo(ball.x + ball.r, ball.y);
            ctx.moveTo(ball.x, ball.y - ball.r);
            ctx.lineTo(ball.x, ball.y + ball.r);
            ctx.stroke();
        }

        function gameLoop() {
            if (!gameActive) return;
            
            updatePhysics();
            draw();
            
            requestAnimationFrame(gameLoop);
        }

        /** 6. CONTROLS */
        function handleInputStart(e) {
            if (!gameActive) return;
            if (e.cancelable) e.preventDefault();
            input.isDown = true;
            updateInputPos(e);
        }
        function handleInputEnd(e) {
            if (!gameActive) return;
            if (e?.cancelable) e.preventDefault();
            input.isDown = false;
        }
        function handleInputMove(e) {
            if (!gameActive) return;
            if (e.cancelable) e.preventDefault();
            updateInputPos(e);
        }
        function updateInputPos(e) {
            const point = e.touches?.[0] ?? e.changedTouches?.[0] ?? e;
            input.x = point.clientX;
            input.y = point.clientY;
        }

        // [agent-note][stage4] repaired: mobile-actionability | element: #gameCanvas | action: scoped gesture suppression to gameplay surface so start/restart taps keep native click behavior.
        canvas.addEventListener('mousedown', handleInputStart);
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('mousemove', handleInputMove);
        canvas.addEventListener('touchstart', handleInputStart, { passive: false });
        canvas.addEventListener('touchend', handleInputEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleInputEnd, { passive: false });
        canvas.addEventListener('touchmove', handleInputMove, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            setTimeout(() => document.getElementById('tutorial').classList.add('hidden'), 5000);
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('button');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.playBGM();
            }
        });
        
    });
    </script>
