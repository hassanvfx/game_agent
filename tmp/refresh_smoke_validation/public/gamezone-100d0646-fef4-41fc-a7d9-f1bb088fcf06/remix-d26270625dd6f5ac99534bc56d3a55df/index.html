<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Conference Room Cold Open</title><link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--paper:#f6f1df;--ink:#2b2b24;--felt:#2f5d50;--mustard:#d9a441;--bad:#c94c43;--good:#3b8f70;--panel:rgba(255,250,229,.93);--line:rgba(43,43,36,.22)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#d7d0ba;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hidden{display:none!important}#app{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:clamp(12px,3vw,22px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.panel{width:min(94vw,430px);border:3px solid #2d2920;border-radius:28px;background:var(--panel);box-shadow:0 18px 0 rgba(43,43,36,.18),0 28px 50px rgba(0,0,0,.25);position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}.start,.over{padding:28px 22px;text-align:center}.brand{font-family:Bangers,cursive;font-size:clamp(38px,12vw,62px);line-height:.9;letter-spacing:.03em;margin:8px 0;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.12)}.kicker{font-weight:600;letter-spacing:.18em;text-transform:uppercase;background:#2d2920;color:var(--paper);display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px}.logline{font-size:18px;line-height:1.25;margin:14px auto 22px;max-width:330px}.btn,button{font:700 18px Rajdhani,sans-serif;border:3px solid #2d2920;border-radius:18px;background:linear-gradient(#fff3b8,#e7bd51);color:#211d18;padding:15px 16px;width:100%;box-shadow:0 7px 0 #2d2920;touch-action:manipulation;cursor:pointer}.btn:active,button:active{transform:translateY(5px);box-shadow:0 2px 0 #2d2920}.hero{width:126px;height:126px;margin:0 auto 10px;border:4px solid #2d2920;border-radius:28px;background:linear-gradient(145deg,#f8e1bd,#fff7d5);display:grid;place-items:center;position:relative;animation:float 2.8s ease-in-out infinite}.hero .head{font-size:74px;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.13))}.hero:after{content:"CONFIDENTIAL";position:absolute;right:-18px;bottom:10px;transform:rotate(-13deg);font:700 12px Rajdhani;color:#a9302b;border:2px solid #a9302b;padding:3px 6px;background:rgba(255,255,255,.65)}#hud{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,430px);display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:none}.meter{background:rgba(255,250,229,.92);border:2px solid #2d2920;border-radius:16px;padding:7px;box-shadow:0 5px 0 rgba(43,43,36,.2)}.meter label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.track{height:12px;border:2px solid #2d2920;border-radius:20px;overflow:hidden;background:#ddd2b5}.fill{height:100%;width:100%;transition:width .45s cubic-bezier(.3,1.4,.4,1)}#bar-health{background:linear-gradient(90deg,#e35a4d,#ffb86b)}#bar-mood{background:linear-gradient(90deg,#448b70,#6ec7a8)}#story-card{padding:70px 18px 18px;min-height:min(68vh,620px);display:flex;flex-direction:column;margin-top:36px}.badge{position:absolute;top:-47px;left:50%;transform:translateX(-50%);width:106px;height:106px;border:4px solid #2d2920;border-radius:26px;background:#fff7d5;display:grid;place-items:center;font-size:58px;box-shadow:0 9px 0 rgba(43,43,36,.18)}.badge:after{content:"CAM 2";position:absolute;top:8px;right:7px;font:700 10px Rajdhani;background:#c94c43;color:white;border-radius:8px;padding:2px 5px}.caption{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6e6555;margin-bottom:8px}.storybox{flex:1;min-height:180px;background:rgba(255,255,255,.5);border:2px dashed rgba(43,43,36,.35);border-radius:20px;padding:17px;overflow:auto}.storybox p{font-size:clamp(20px,5.3vw,25px);line-height:1.27;font-weight:700;margin:0}.cursor:after{content:"|";animation:blink 1s steps(2) infinite;color:#a9302b}.choices{display:grid;gap:12px;margin-top:16px;opacity:0;transition:opacity .25s}.choice{background:linear-gradient(#ffffff,#f4ecd3);display:flex;align-items:center;justify-content:space-between;text-align:left;gap:10px;font-size:17px}.choice small{display:block;font-size:12px;color:#766d5a;font-weight:600;margin-top:2px}.arrow{font-size:24px}.toast{position:fixed;z-index:5;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,120%);width:min(92vw,400px);background:#2d2920;color:var(--paper);border:3px solid var(--paper);border-radius:18px;padding:10px 14px;text-align:center;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s}.toast.show{transform:translate(-50%,0)}.shake{animation:shake .45s}.endstamp{font-family:Bangers;font-size:54px;line-height:.9;color:#a9302b}.rank{border:2px solid #2d2920;background:#fff7d5;border-radius:18px;padding:10px;margin:16px 0}.camera-dot{position:fixed;right:18px;top:18px;z-index:3;font-weight:700;background:rgba(255,255,255,.65);border:2px solid #2d2920;border-radius:999px;padding:5px 9px;font-size:12px}.camera-dot:before{content:"";display:inline-block;width:9px;height:9px;background:#c94c43;border-radius:50%;margin-right:6px;animation:rec 1.2s infinite}@keyframes float{50%{transform:translateY(-7px) rotate(-1deg)}}@keyframes blink{50%{opacity:0}}@keyframes rec{50%{opacity:.25}}@keyframes shake{20%,80%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}@media(max-height:690px){#story-card{min-height:58vh;padding-top:58px}.badge{width:88px;height:88px;font-size:48px;top:-39px}.storybox{min-height:132px}.start,.over{padding:18px}.hero{width:96px;height:96px}.hero .head{font-size:58px}.brand{font-size:40px}.logline{font-size:16px;margin-bottom:14px}}
</style></head><body><canvas id="bg"></canvas><div class="camera-dot">DOCUMENTARY CREW HIDING</div><div id="hud" class="hidden"><div class="meter"><label><span>Composure</span><span id="hval">100</span></label><div class="track"><div id="bar-health" class="fill"></div></div></div><div class="meter"><label><span>Credibility</span><span id="mval">100</span></label><div class="track"><div id="bar-mood" class="fill"></div></div></div></div><main id="app"><section id="start-screen" class="panel start"><div class="hero"><div class="head">🧑‍💼</div></div><div class="kicker">Portrait cringe simulator</div><h1 class="brand">Conference Room<br>Cold Open</h1><p class="logline">Survive one workday of dead air, office politics, and tiny choices that somehow become performance reviews.</p><button id="btn-start">START THE DOCUMENTARY</button></section><section id="story-card" class="panel hidden"><div id="story-emoji" class="badge">📋</div><div class="caption" id="scene-label">Cold open</div><div class="storybox"><p id="story-text"></p></div><div id="choices-container" class="choices"></div></section><section id="game-over" class="panel over hidden"><div id="end-emoji" style="font-size:68px">🏁</div><h2 id="end-title" class="endstamp">CUT TO BLACK</h2><p id="end-reason" class="logline">The crew has enough footage.</p><div class="rank"><div class="caption">Ending Reached</div><strong id="end-rank">Assistant to the Assistant</strong></div><button id="btn-restart">ROLL ANOTHER TAKE</button></section></main><div id="toast" class="toast"></div><script>
(()=>{const cfg={textSpeed:22};const $=id=>document.getElementById(id);const els={start:$('start-screen'),card:$('story-card'),over:$('game-over'),text:$('story-text'),choices:$('choices-container'),emoji:$('story-emoji'),hud:$('hud'),h:$('bar-health'),m:$('bar-mood'),hval:$('hval'),mval:$('mval'),toast:$('toast'),label:$('scene-label'),end:{emoji:$('end-emoji'),title:$('end-title'),reason:$('end-reason'),rank:$('end-rank')}};let state={health:100,mood:100,node:'start'},timer=null,toastTimer=null,audio=null;const nodes={start:{label:'8:59 AM • bullpen',text:'The documentary crew catches you reheating fish before the all-hands. Your manager asks if you are “ready to be normal today.”',emoji:'🐟',choices:[{txt:'Claim it is team-building aromatherapy',sub:'Bold. Possibly a crime.',next:'standup',dh:-8,dm:7,msg:'The room records three seconds of silence.'},{txt:'Apologize and open every window',sub:'Humble, drafty, survivable.',next:'standup',dh:4,dm:-3,msg:'A pigeon attends the meeting.'}]},standup:{label:'9:07 AM • stand-up circle',text:'Daily stand-up begins. A coworker says “quick sync” and looks directly into the camera like they know the genre.',emoji:'👀',choices:[{txt:'Say “blocking blockers” with confidence',sub:'Nobody knows what it means.',next:'printer',dh:-5,dm:12,msg:'Corporate fog successfully deployed.'},{txt:'Admit you have no updates',sub:'Radical honesty, terrible timing.',next:'printer',dh:8,dm:-12,msg:'The intern nods like a therapist.'}]},printer:{label:'10:13 AM • printer shrine',text:'The printer jams during someone’s birthday banner. Paper emerges reading “HAP Y BIR HDA, GREG.” Everyone turns to you.',emoji:'🖨️',choices:[{txt:'Perform open-printer surgery',sub:'Tiny plastic doors everywhere.',next:'birthday',dh:-18,dm:8,msg:'Toner fingerprints imply a suspect.'},{txt:'Declare the printer is “on a journey”',sub:'Management loves journeys.',next:'birthday',dh:0,dm:-8,msg:'Greg looks unconvinced.'}]},birthday:{label:'11:41 AM • break room',text:'Birthday cake appears. It says “Great Q3, Gary.” There is no Gary. The camera slowly zooms toward your fork.',emoji:'🎂',choices:[{txt:'Lead a song for Greg anyway',sub:'Wrong name, full commitment.',next:'lunch',dh:-6,dm:15,msg:'Greg forgives nobody but respects volume.'},{txt:'Quietly scrape off Gary',sub:'Frosting concealment protocol.',next:'lunch',dh:5,dm:-6,msg:'The evidence is under your thumbnail.'}]},lunch:{label:'12:30 PM • parking lot picnic',text:'Lunch becomes a negotiation. Accounting offers gossip in exchange for your chair and half a pickle.',emoji:'🥒',choices:[{txt:'Trade the chair for scandal',sub:'Information economy unlocked.',next:'afternoon',dh:-7,dm:18,msg:'You now know too much about copier leases.'},{txt:'Keep chair. Lose alliance.',sub:'Ergonomic but lonely.',next:'afternoon',dh:8,dm:-12,msg:'Accounting will remember this sitting down.'}]},afternoon:{label:'2:16 PM • conference room B',text:'A mandatory fun icebreaker asks everyone to describe their weekend as a spreadsheet function.',emoji:'📊',choices:[{txt:'Say =IF(Awkward,Smile,Run)',sub:'Relatable. Concerning.',next:'finale',dh:-12,dm:20,msg:'The documentary crew audibly breathes.'},{txt:'Pass and sip empty coffee',sub:'Minimal participation theater.',next:'finale',dh:7,dm:-14,msg:'The cup has been empty since 9:12.'}]},finale:{label:'4:58 PM • exit interview',text:'Your manager blocks the door for one last “two-minute chat.” It is never two minutes. The boom mic lowers.',emoji:'🎙️',choices:[{txt:'Compliment the meeting culture',sub:'Weaponized sincerity.',next:'win_work',dh:-5,dm:18,msg:'A promotion-shaped rumor forms.'},{txt:'Fake a phone call from your dentist',sub:'Cowardly. Efficient.',next:'win_escape',dh:10,dm:-10,msg:'Your dentist is named Mom now.'}]},fired:{end:1,title:'RESTRUCTURED OUT',reason:'You became a cost-saving anecdote in a leadership deck.',rank:'Former Culture Fit',emoji:'📦'},win_work:{end:1,title:'EMPLOYEE OF THE TAKE',reason:'You survived the workday and gave the crew a perfect awkward freeze-frame.',rank:'Lovably Incompetent MVP',emoji:'🏆'},win_escape:{end:1,title:'PARKING LOT LIBERATION',reason:'You escaped with only moderate reputational damage.',rank:'Cringe Timing Specialist',emoji:'🚗'},burnout:{end:1,title:'BURNOUT B-ROLL',reason:'Composure hit zero. The camera respectfully zoomed into the carpet.',rank:'Break Room Ghost',emoji:'🫠'},drained:{end:1,title:'CREDIBILITY INCIDENT',reason:'Credibility hit zero. HR called it a learning opportunity.',rank:'Agenda Item Seven',emoji:'📉'}};function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}function beep(type){try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.connect(g);g.connect(c.destination);o.type=type==='bad'?'sawtooth':'triangle';o.frequency.setValueAtTime(type==='good'?520:type==='start'?360:170,n);o.frequency.exponentialRampToValueAtTime(type==='bad'?80:type==='start'?720:880,n+.16);g.gain.setValueAtTime(.08,n);g.gain.linearRampToValueAtTime(0,n+.18);o.start(n);o.stop(n+.2)}catch(e){}}function toast(msg,bad){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.style.background=bad?'#7d2e28':'#2d2920';els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1400)}function update(){state.health=Math.max(0,Math.min(100,state.health));state.mood=Math.max(0,Math.min(100,state.mood));els.h.style.width=state.health+'%';els.m.style.width=state.mood+'%';els.hval.textContent=state.health;els.mval.textContent=state.mood}function render(id){state.node=id;const n=nodes[id];if(n.end)return end(n);if(state.health<=0)return end(nodes.burnout);if(state.mood<=0)return end(nodes.drained);els.emoji.textContent=n.emoji;els.label.textContent=n.label;els.choices.innerHTML='';els.choices.style.opacity=0;els.text.textContent='';els.text.classList.add('cursor');let i=0;clearInterval(timer);timer=setInterval(()=>{els.text.textContent+=n.text.charAt(i++);if(i>=n.text.length){clearInterval(timer);els.text.classList.remove('cursor');showChoices(n.choices)}},cfg.textSpeed)}function showChoices(arr){arr.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+c.txt+'<small>'+c.sub+'</small></span><span class="arrow">›</span>';b.onclick=()=>choose(c,b);els.choices.appendChild(b)});els.choices.style.opacity=1}function choose(c,b){beep(c.dh<0||c.dm<0?'bad':'good');const bad=c.dh<0||c.dm<0;if(bad)document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),480);burst(b.getBoundingClientRect(),bad);state.health+=c.dh;state.mood+=c.dm;update();toast(c.msg,bad);setTimeout(()=>render(c.next),320)}function end(n){beep(n.title.includes('EMPLOYEE')?'good':'bad');els.card.classList.add('hidden');els.hud.classList.add('hidden');els.over.classList.remove('hidden');els.end.title.textContent=n.title;els.end.reason.textContent=n.reason;els.end.rank.textContent=n.rank;els.end.emoji.textContent=n.emoji}function start(){state={health:100,mood:100,node:'start'};update();els.start.classList.add('hidden');els.over.classList.add('hidden');els.card.classList.remove('hidden');els.hud.classList.remove('hidden');beep('start');render('start')}document.addEventListener('pointerdown',()=>{try{ctx()}catch(e){}},{once:true});$('btn-start').onclick=start;$('btn-restart').onclick=start;const cv=$('bg'),x=cv.getContext('2d');let W,H,dpr,parts=[];function size(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();function burst(r,bad){for(let i=0;i<16;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:1,c:bad?'#c94c43':'#3b8f70'})}let t=0;function draw(){t+=.01;x.fillStyle='#d7d0ba';x.fillRect(0,0,W,H);x.fillStyle='#b9ad8d';for(let y=70;y<H;y+=92){x.fillRect(0,y,W,3)}x.fillStyle='#8b816b';for(let i=0;i<8;i++){let px=(i*97+Math.sin(t+i)*18)%W;x.fillRect(px,0,42,H)}x.fillStyle='rgba(47,93,80,.24)';for(let i=0;i<10;i++){x.beginPath();x.roundRect((i*61+Math.sin(t+i)*30)%W,45+(i%5)*105,70,42,8);x.fill()}x.font='700 16px Rajdhani';x.fillStyle='rgba(43,43,36,.32)';['TPS REPORTS','SYNERGY','MUGS','BUDGET','GARY?'].forEach((s,i)=>x.fillText(s,20+(i*83)%W,60+i*96));for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.035;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.c;x.fillRect(p.x,p.y,7*p.life,7*p.life);if(p.life<=0)parts.splice(i,1)}x.globalAlpha=1;requestAnimationFrame(draw)}draw();})();
</script></body></html>
