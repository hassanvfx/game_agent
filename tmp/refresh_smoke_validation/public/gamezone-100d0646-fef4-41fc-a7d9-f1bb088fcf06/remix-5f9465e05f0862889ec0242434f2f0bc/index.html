<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monday Mode: The Story</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0c1026;
            --bg-bottom: #23143e;
            --panel-top: rgba(24, 30, 60, 0.92);
            --panel-bottom: rgba(50, 31, 90, 0.9);
            --panel-border: rgba(135, 244, 255, 0.5);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text-main: #f6f3ff;
            --text-soft: #cabff2;
            --accent: #8f7cff;
            --accent-hot: #ff7ad9;
            --accent-cyan: #86f8ff;
            --danger: #ff708f;
            --success: #89f57c;
            --theme-color: #6c5ce7;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(143, 124, 255, 0.2), transparent 35%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(134, 248, 255, 0.14), transparent 20%),
                radial-gradient(circle at 80% 15%, rgba(255, 122, 217, 0.16), transparent 18%),
                radial-gradient(circle at 50% 75%, rgba(143, 124, 255, 0.18), transparent 26%);
        }

        body::after {
            opacity: 0.16;
            background-image:
                linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: linear-gradient(180deg, rgba(255,255,255,0.35), transparent 78%);
            -webkit-mask-image: linear-gradient(180deg, rgba(255,255,255,0.35), transparent 78%);
        }

        canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 0; }

        /* UI Components */
        .glass {
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow:
                0 18px 42px var(--panel-shadow),
                inset 0 1px 0 rgba(255,255,255,0.14),
                0 0 24px rgba(143, 124, 255, 0.22);
            border: 1px solid var(--panel-border);
        }

        .btn-choice {
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(22, 31, 70, 0.92), rgba(15, 20, 42, 0.95));
            border: 1px solid rgba(134, 248, 255, 0.24);
            color: var(--text-main);
            box-shadow: 0 10px 18px rgba(7, 10, 25, 0.28);
        }

        .btn-choice:hover {
            transform: translateY(-1px);
            background: linear-gradient(180deg, rgba(35, 48, 108, 0.98), rgba(19, 25, 54, 0.98));
            box-shadow: 0 14px 26px rgba(7, 10, 25, 0.34);
            border-color: rgba(255, 122, 217, 0.35);
        }

        .btn-choice:active { transform: scale(0.98); }

        .story-title,
        .screen-title,
        .ending-title {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.04em;
            text-shadow: 0 4px 18px rgba(143, 124, 255, 0.3);
        }

        .screen-kicker,
        .hud-label,
        .ending-label {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        #story-text,
        .btn-choice,
        #end-reason,
        #end-rank,
        #btn-start,
        #btn-restart {
            font-family: 'Exo 2', ui-sans-serif, system-ui, sans-serif;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(34vw, 144px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            opacity: 0;
            transform: translateY(12px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 25;
            background: rgba(13, 18, 41, 0.85);
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 18px;
        }

        .feedback-gif--fail {
            right: auto;
            left: 1rem;
            bottom: 1rem;
        }

        .hero-badge {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.92), rgba(255,255,255,0.16) 42%, transparent 43%),
                linear-gradient(180deg, rgba(142, 248, 255, 0.5), rgba(143, 124, 255, 0.2)),
                linear-gradient(180deg, rgba(13, 18, 41, 0.96), rgba(34, 19, 72, 0.98));
            border: 2px solid rgba(134, 248, 255, 0.55);
            box-shadow:
                0 12px 30px rgba(3, 6, 18, 0.4),
                0 0 28px rgba(134, 248, 255, 0.26),
                inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .hero-badge::after {
            content: "";
            position: absolute;
            inset: 10% 16%;
            border-radius: 999px;
            background: radial-gradient(circle at center, rgba(255, 122, 217, 0.26), transparent 62%);
            pointer-events: none;
        }

        .floating-hero { animation: heroFloat 2.8s ease-in-out infinite; }
        .pulse-glow { animation: pulseGlow 2.2s ease-in-out infinite; }
        .story-text-panel {
            background: linear-gradient(180deg, rgba(6, 11, 30, 0.36), rgba(11, 16, 40, 0.12));
            border-radius: 20px;
            border: 1px solid rgba(143, 124, 255, 0.18);
            padding: 1rem 1rem 0.25rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .hud-meter {
            background: rgba(6, 12, 34, 0.55);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.22);
        }

        .stat-bar {
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
            box-shadow: 0 0 14px currentColor;
        }

        #bar-health {
            color: rgba(255, 112, 143, 0.75);
            background: linear-gradient(90deg, #ff708f, #ff9e80);
        }

        #bar-mood {
            color: rgba(134, 248, 255, 0.78);
            background: linear-gradient(90deg, #70d7ff, #8f7cff);
        }

        /* Animations */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-2px, 0, 0); } 
            20%, 80% { transform: translate3d(4px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 
            40%, 60% { transform: translate3d(8px, 0, 0); } 
        }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(143,124,255,0.15)); }
            50% { filter: drop-shadow(0 0 14px rgba(134,248,255,0.42)); }
        }
        
        /* Cursor Blink */
        .cursor::after { content: '|'; animation: blink 1s step-end infinite; margin-left: 2px; color: var(--accent-cyan); }
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 640px) {
            #start-screen,
            #story-card,
            #game-over {
                border-radius: 22px;
            }

            #story-card {
                min-height: 58vh;
            }

            #story-text {
                font-size: 1.15rem;
                line-height: 1.5;
            }

            .feedback-gif {
                width: min(30vw, 110px);
                bottom: 0.75rem;
                right: 0.75rem;
            }

            .feedback-gif--fail {
                left: 0.75rem;
            }
        }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<audio id="bgm_main" data-editable="audio" data-label="BGM Arcade Loop" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_click" data-editable="audio" data-label="UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" data-editable="audio" data-label="Fail Cue" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>

<div id="game-container" class="relative w-full h-full select-none overflow-hidden">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col items-center justify-center p-4">
        
        <!-- HUD -->
        <div id="hud" class="absolute top-0 left-0 right-0 p-4 flex justify-between items-start hidden max-w-lg mx-auto w-full">
            <!-- Health -->
            <div class="flex flex-col w-1/3">
                <div class="flex items-center gap-1 mb-1">
                    <span class="text-xl">❤️</span>

                </div>
                <div class="hud-meter h-4 w-full rounded-full overflow-hidden">

            <!-- Mood -->
            <div class="flex flex-col w-1/3 items-end">
                <div class="flex items-center gap-1 mb-1">
                    <span class="hud-label text-xs font-bold text-pink-100">Mood</span>

                </div>

        <!-- Start Screen -->
        <div id="start-screen" class="glass p-8 text-center max-w-sm w-full pointer-events-auto shadow-2xl transform transition-all">

            <p class="screen-kicker text-violet-100/80 mb-3 mt-4 text-xs font-semibold">CHAOS ARCADE</p>
            <p class="text-violet-100/80 mb-8 text-sm font-medium">A storybook scramble through meetings,<br>mood swings, and Monday survival.</p>
            <button id="btn-start" class="w-full bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500 text-slate-950 font-bold py-4 rounded-xl text-lg shadow-xl hover:scale-[1.02] transition-all">
                START STORY
            </button>
        </div>

        <!-- Story Card -->
        <div id="story-card" class="glass p-6 w-full max-w-md hidden pointer-events-auto flex flex-col min-h-[60vh] relative shadow-2xl">
            <!-- Emoji Header -->
            <div class="absolute -top-12 left-0 right-0 flex justify-center pointer-events-none">
                <div id="story-emoji" class="hero-badge floating-hero text-7xl drop-shadow-md rounded-full p-2 w-24 h-24 flex items-center justify-center shadow-lg">⏰</div>

            <!-- Text Area -->
            <div class="story-text-panel mt-12 flex-grow overflow-y-auto mb-6">
                <p id="story-text" class="text-xl font-bold text-white leading-relaxed cursor"></p>
            </div>

            <!-- Choices -->
            <div id="choices-container" class="grid gap-3 opacity-0 transition-opacity duration-500">
                <!-- Dynamic Buttons -->
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json -->
        <div id="gif-success" class="feedback-gif hidden" aria-hidden="true">
            <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction">
        </div>

        <!-- Game Over -->
        <div id="game-over" class="hidden glass p-8 text-center max-w-sm w-full pointer-events-auto z-50">

            <h2 id="end-title" class="ending-title text-3xl text-white mb-2">THE END</h2>
            <p id="end-reason" class="text-violet-100/85 mb-6 font-medium">That's how it ends.</p>
            <div class="bg-slate-950/35 rounded-lg p-3 mb-6 border border-cyan-200/15">
                <span class="ending-label text-xs text-cyan-100/70 font-bold">Ending Reached</span>

                TRY AGAIN
            </button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- §6 Config System ---
    window.gameConfig = {
        textSpeed: 25,
        themeColor: "#6c5ce7",
        heroName: "Kevin"
    };

    try {
        const parsed = JSON.parse(document.getElementById('game-config').textContent);
        for(let k in parsed) window.gameConfig[k] = parsed[k].value;
    } catch(e) { console.error("Config parse failed", e); }

    window.updateGameConfig = (k, v) => {
        if(window.gameConfig.hasOwnProperty(k)) window.gameConfig[k] = v;
        if(k === 'themeColor') document.documentElement.style.setProperty('--theme-color', v);
    };

    // --- §5 Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const assets = {
        bgm: document.getElementById('bgm_main'),
        click: document.getElementById('sfx_click'),
        fail: document.getElementById('sfx_fail'),
        success: document.getElementById('sfx_success'),
        warning: document.getElementById('sfx_warning'),
        start: document.getElementById('sfx_start')
    };
    const sfxCooldowns = new Map();

    const primeAudio = (media, volume) => {
        if (!media) return;
        media.preload = 'auto';
        media.volume = volume;
    };

    primeAudio(assets.bgm, 0.2);
    primeAudio(assets.click, 0.5);
    primeAudio(assets.fail, 0.6);
    primeAudio(assets.success, 0.52);
    primeAudio(assets.warning, 0.42);
    primeAudio(assets.start, 0.54);

    const playSound = (id) => {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }

        if (id === 'bgm') {
            if (assets.bgm && assets.bgm.paused) {
                assets.bgm.currentTime = 0;
                assets.bgm.play().catch(() => {});
            }
            return;
        }

        const nowMs = performance.now();
        const cooldown = id === 'click' ? 70 : 180;
        if (sfxCooldowns.has(id) && nowMs - sfxCooldowns.get(id) < cooldown) return;
        sfxCooldowns.set(id, nowMs);

        const src = assets[id];
        if (src) {
            src.pause();
            src.currentTime = 0;
            src.play().catch(() => synthSound(id));
        } else {
            synthSound(id);
        }
    };

    const stopBgm = () => {
        if (!assets.bgm) return;
        assets.bgm.pause();
        assets.bgm.currentTime = 0;
    };

    const synthSound = (type) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'click' || type === 'start') {
            osc.frequency.setValueAtTime(type === 'start' ? 420 : 600, now);
            osc.frequency.exponentialRampToValueAtTime(type === 'start' ? 920 : 1200, now + 0.12);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'success') {
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.22);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
        } else if (type === 'warning') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.linearRampToValueAtTime(220, now + 0.18);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    };

    // --- §2 Visuals: Parallax Canvas ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let bgShapes = [];

    // Init Background Shapes
    for(let i=0; i<8; i++) {
        bgShapes.push({
            x: Math.random() * 100, // percent
            y: Math.random() * 100, // percent
            r: 50 + Math.random() * 100,
            speed: 0.2 + Math.random() * 0.3,
            phase: Math.random() * Math.PI * 2
        });
    }

    const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Particle System
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 12;
            this.vy = (Math.random() - 0.5) * 12;
            this.life = 1.0;
            this.color = color;
            this.size = 4 + Math.random() * 6;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.4; // Gravity
            this.life -= 0.03;
            this.size *= 0.92;
        }
        draw(c) {
            c.globalAlpha = Math.max(0, this.life);
            c.fillStyle = this.color;
            c.beginPath();
            c.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI*2);
            c.fill();
            c.globalAlpha = 1.0;
        }
    }

    const spawnParticles = (x, y, color) => {
        for(let i=0; i<12; i++) particles.push(new Particle(x, y, color));
    };

    let time = 0;
    const loop = () => {
        try {
            time += 0.01;
            
            // Clear
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#090d1f');
            gradient.addColorStop(0.55, '#16193d');
            gradient.addColorStop(1, '#241347');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Layer 1: Background Shapes (Parallax Slow)
            ctx.fillStyle = 'rgba(134, 248, 255, 0.12)';
            bgShapes.forEach(s => {
                const x = (s.x / 100) * width + Math.sin(time * s.speed + s.phase) * 30;
                const y = (s.y / 100) * height + Math.cos(time * s.speed + s.phase) * 30;
                ctx.beginPath();
                ctx.arc(x, y, Math.max(0, s.r), 0, Math.PI*2);
                ctx.fill();
            });

            // Layer 2: Active Particles
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if(particles[i].life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        } catch(e) { console.error(e); }
    };
    requestAnimationFrame(loop);

    // --- Game Logic ---
    let state = {
        health: 100,
        mood: 100,
        node: 'start'
    };

    const storyNodes = {
        'start': {
            text: "The alarm rings. It's Monday, 6:00 AM. Your head is pounding.",
            emoji: "🤹",
            choices: [
                { txt: "Get up now", next: 'bathroom', dh: -5, dm: -5, msg: "Discipline hurts." },
                { txt: "Snooze (5 min)", next: 'panic', dh: 5, dm: 5, msg: "Just a little longer..." }
            ]
        },
        'panic': {
            text: "You wake up. It's 7:30 AM! You have to be there in 10 minutes!",
            emoji: "🤯",
            choices: [
                { txt: "Throw clothes on", next: 'commute_rush', dh: -10, dm: -20, msg: "Your socks don't even match." },
                { txt: "Call in sick", next: 'home_chill', dh: 10, dm: 10, msg: "A day just for you." }
            ]
        },
        'bathroom': {
            text: "The mirror shows a monster. Brush your teeth?",
            emoji: "🦷",
            choices: [
                { txt: "Brush properly", next: 'commute_calm', dh: 0, dm: 5, msg: "Fresh breath, fresh mind." },
                { txt: "Gum is enough", next: 'commute_calm', dh: -5, dm: -5, msg: "Hopefully nobody notices." }
            ]
        },
        'commute_rush': {
            text: "The bus is pulling away! You sprint like a maniac.",
            emoji: "🏃",
            choices: [
                { txt: "Chase it down", next: 'office_sweaty', dh: -20, dm: -10, msg: "You catch it, but you're drenched." },
                { txt: "Give up", next: 'park_sad', dh: 0, dm: -30, msg: "The bus is gone." }
            ]
        },
        'commute_calm': {
            text: "You reach the station on time. A street musician is playing.",
            emoji: "🎷",
            choices: [
                { txt: "Tip them", next: 'office_good', dh: 0, dm: 15, msg: "Good karma!" },
                { txt: "Ignore them", next: 'office_neutral', dh: 0, dm: -5, msg: "You feel a little cheap." }
            ]
        },
        'home_chill': {
            text: "Your boss calls: 'Where are you?!'",
            emoji: "📱",
            choices: [
                { txt: "Don't answer", next: 'fired', dh: 10, dm: -50, msg: "This will cause trouble." },
                { txt: "Lie (car broke down)", next: 'netflix', dh: -5, dm: -10, msg: "He believes it... maybe." }
            ]
        },
        'office_sweaty': {
            text: "You arrive at the meeting soaked in sweat. Everyone stares.",
            emoji: "🥵",
            choices: [
                { txt: "Crack a joke", next: 'lunch', dh: 0, dm: 10, msg: "They laugh. Saved." },
                { txt: "Sit down quietly", next: 'lunch', dh: 0, dm: -20, msg: "Painful silence." }
            ]
        },
        'office_good': {
            text: "The boss praises your punctuality. A miracle!",
            emoji: "🏆",
            choices: [
                { txt: "Ask for a raise", next: 'fired', dh: 0, dm: -100, msg: "Too greedy." },
                { txt: "Say thanks", next: 'lunch', dh: 5, dm: 20, msg: "A strong start." }
            ]
        },
        'office_neutral': {
            text: "The printer explodes. Paper flies everywhere.",
            emoji: "💥",
            choices: [
                { txt: "Fix it", next: 'lunch', dh: -10, dm: -10, msg: "Toner all over your hands." },
                { txt: "Walk away", next: 'lunch', dh: 0, dm: 10, msg: "Not my problem." }
            ]
        },
        'lunch': {
            text: "Lunch break. What are you eating?",
            emoji: "🍔",
            choices: [
                { txt: "Loaded kebab", next: 'afternoon_tired', dh: -10, dm: 30, msg: "Food coma incoming." },
                { txt: "Salad", next: 'afternoon_fit', dh: 10, dm: -10, msg: "Healthy, but boring." }
            ]
        },
        'netflix': {
            text: "You spend the whole day on the couch.",
            emoji: "🛋️",
            choices: [
                { txt: "One more episode", next: 'win_lazy', dh: 5, dm: 20, msg: "Life is good." },
                { txt: "Feel guilty", next: 'win_lazy', dh: -10, dm: -20, msg: "Back to work tomorrow." }
            ]
        },
        'afternoon_tired': {
            text: "You nearly fall asleep at your desk.",
            emoji: "☕",
            choices: [
                { txt: "Coffee IV", next: 'win_work', dh: -10, dm: 10, msg: "Heart racing, but awake." },
                { txt: "Bathroom power nap", next: 'win_work', dh: 10, dm: 10, msg: "Refreshed." }
            ]
        },
        'afternoon_fit': {
            text: "You still have energy! You get everything done.",
            emoji: "⚡",
            choices: [
                { txt: "Leave early", next: 'win_work', dh: 0, dm: 20, msg: "Clock out!" },
                { txt: "Help coworkers", next: 'win_hero', dh: -10, dm: 40, msg: "You become the office hero." }
            ]
        },
        'park_sad': {
            text: "You sit in the park feeding pigeons.",
            emoji: "🌧️",
            choices: [
                { txt: "Reflect", next: 'win_philosopher', dh: 10, dm: 10, msg: "Deep thoughts." },
                { txt: "Cry", next: 'game_over_sad', dh: -10, dm: -50, msg: "Everything is awful." }
            ]
        },
        // Endings
        'fired': { end: true, title: "FIRED", reason: "Looks like you need to find a new job.", rank: "Unemployed" },
        'win_lazy': { end: true, title: "COUCH POTATO", reason: "A full day of pure relaxation.", rank: "Lounger" },
        'win_work': { end: true, title: "SURVIVED", reason: "The workday is over. You made it.", rank: "Employee of the Month" },
        'win_hero': { end: true, title: "OFFICE HERO", reason: "Everyone loves you. A promotion might be next.", rank: "Legend" },
        'win_philosopher': { end: true, title: "ESCAPIST", reason: "You realized work isn't everything.", rank: "Philosopher" },
        'game_over_sad': { end: true, title: "MELTDOWN", reason: "Monday finally defeated you.", rank: "Monday Casualty" }
    };

    const els = {
        start: document.getElementById('start-screen'),
        card: document.getElementById('story-card'),
        over: document.getElementById('game-over'),
        text: document.getElementById('story-text'),
        choices: document.getElementById('choices-container'),
        emoji: document.getElementById('story-emoji'),
        hud: document.getElementById('hud'),
        gifs: {
            success: document.getElementById('gif-success'),
            fail: document.getElementById('gif-fail')
        },
        bars: { h: document.getElementById('bar-health'), m: document.getElementById('bar-mood') },
        end: { title: document.getElementById('end-title'), reason: document.getElementById('end-reason'), rank: document.getElementById('end-rank'), emoji: document.getElementById('end-emoji') }
    };

    let typingTimer = null;
    let feedbackTimer = null;

    const showFeedbackGif = (type) => {
        const active = els.gifs[type];
        if (!active) return;
        clearTimeout(feedbackTimer);
        Object.values(els.gifs).forEach(gif => {
            gif.classList.add('hidden');
            gif.classList.remove('visible');
        });
        active.classList.remove('hidden');
        requestAnimationFrame(() => active.classList.add('visible'));
        feedbackTimer = setTimeout(() => {
            active.classList.remove('visible');
            setTimeout(() => active.classList.add('hidden'), 220);
        }, 1500);
    };

    const renderNode = (nodeId) => {
        state.node = nodeId;
        const node = storyNodes[nodeId];

        // Check for Ending
        if (node.end) {
            endGame(node);
            return;
        }

        // Check Stats Death
        if (state.health <= 0) { endGame({title: "EXHAUSTED", reason: "You have no strength left.", rank: "Burnout", emoji: "🏥"}); return; }
        if (state.mood <= 0) { endGame({title: "DRAINED", reason: "You lost all hope.", rank: "Gloom Cloud", emoji: "🌧️"}); return; }

        // Setup UI
        els.emoji.textContent = node.emoji;
        els.choices.innerHTML = '';
        els.choices.style.opacity = '0';
        els.text.textContent = '';
        els.text.classList.add('cursor');

        // Typing Effect
        let i = 0;
        if(typingTimer) clearInterval(typingTimer);
        typingTimer = setInterval(() => {
            els.text.textContent += node.text.charAt(i);
            i++;
            if (i >= node.text.length) {
                clearInterval(typingTimer);
                els.text.classList.remove('cursor');
                showChoices(node.choices);
            }
        }, window.gameConfig.textSpeed);
    };

    const showChoices = (choices) => {
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = "btn-choice w-full bg-white/80 hover:bg-white text-gray-800 font-bold py-4 px-5 rounded-xl border border-gray-200 text-left flex justify-between items-center shadow-sm";
            btn.innerHTML = `<span>${c.txt}</span> <span class="text-indigo-400">➜</span>`;
            btn.addEventListener('click', () => handleChoice(c, btn));
            els.choices.appendChild(btn);
        });
        els.choices.style.opacity = '1';
    };

    const handleChoice = (choice, buttonEl) => {
        playSound('click');
        
        // Juice: Particles
        const rect = buttonEl.getBoundingClientRect();
        spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, window.gameConfig.themeColor);

        // Feedback
        const positiveChoice = choice.dh > 0 || choice.dm > 0;
        const negativeChoice = choice.dh < 0 || choice.dm < 0;
        if (negativeChoice) {
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
            playSound('warning');
            showFeedbackGif('fail');
        } else if (positiveChoice) {
            playSound('success');
            showFeedbackGif('success');
        }

        // Update Stats
        state.health = Math.min(100, Math.max(0, state.health + choice.dh));
        state.mood = Math.min(100, Math.max(0, state.mood + choice.dm));
        
        els.bars.h.style.width = state.health + '%';
        els.bars.m.style.width = state.mood + '%';
        els.bars.h.parentElement.classList.toggle('shake', choice.dh < -10);

        // Next
        setTimeout(() => renderNode(choice.next), 300);
    };

    const endGame = (data) => {
        const isWin = data.reason.includes("made it") || data.rank === "Legend" || data.rank === "Philosopher" || data.rank === "Lounger";
        if (isWin) {
            playSound('success');
            showFeedbackGif('success');
        } else {
            playSound('fail');
            showFeedbackGif('fail');
        }
        stopBgm();
        els.card.classList.add('hidden');
        els.over.classList.remove('hidden');
        els.hud.classList.add('hidden');
        
        els.end.title.textContent = data.title;
        els.end.reason.textContent = data.reason;
        els.end.rank.textContent = data.rank;
        els.end.emoji.textContent = data.emoji || "🏁";
    };

    const startGame = () => {
        state = { health: 100, mood: 100, node: 'start' };
        els.bars.h.style.width = '100%';
        els.bars.m.style.width = '100%';
        
        els.start.classList.add('hidden');
        els.over.classList.add('hidden');
        els.card.classList.remove('hidden');
        els.hud.classList.remove('hidden');
        Object.values(els.gifs).forEach(gif => {
            gif.classList.add('hidden');
            gif.classList.remove('visible');
        });
        
        playSound('start');
        playSound('bgm');
        renderNode('start');
    };

    // --- Input Binding ---
    // [agent-note][stage4] repaired: mobile-action-path | element: start/restart/choice buttons | action: use native click flow to avoid suppressed taps
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);

    // Audio Unlock
    const unlock = () => {
        if(audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        document.removeEventListener('pointerdown', unlock);
        document.removeEventListener('keydown', unlock);
    };
    document.addEventListener('pointerdown', unlock);
    document.addEventListener('keydown', unlock);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (assets.bgm) assets.bgm.pause();
        } else if (!els.start.classList.contains('hidden') || !els.over.classList.contains('hidden')) {
            return;
        } else {
            playSound('bgm');
        }
    });
});
</script>
</body>
</html>
