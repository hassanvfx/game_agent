<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Element Wardens Arcade</title>
  <!-- [agent-note][stage3] resolved-font: title -> Cinzel, ui/body -> Orbitron | catalogs/fonts.json -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #08111f;
      --bg-mid: #112344;
      --bg-glow: #1e446d;
      --panel: rgba(9, 16, 35, 0.82);
      --panel-strong: rgba(18, 28, 54, 0.94);
      --panel-border: #88e7ff;
      --panel-shadow: rgba(3, 10, 24, 0.45);
      --text-main: #f3fbff;
      --text-dim: #b7d7ef;
      --accent-sun: #ffd96a;
      --accent-lava: #ff7a5c;
      --accent-tide: #69d4ff;
      --accent-storm: #bb8dff;
      --accent-victory: #8effb6;
      --danger: #ff6d7c;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(126, 228, 255, 0.18), transparent 32%),
        linear-gradient(180deg, #050b16 0%, #0b1630 48%, #050914 100%);
    }
    body {
      font-family: 'Orbitron', sans-serif;
      color: var(--text-main);
    }
    #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #game-container::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 217, 106, 0.2), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 24%, transparent 76%, rgba(255,255,255,0.03));
      opacity: 0.9;
    }
    #game-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 100% 24px, 24px 100%;
      mix-blend-mode: screen;
      opacity: 0.18;
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    .title-font {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ui-font {
      font-family: 'Orbitron', sans-serif;
      pointer-events: none;
    }
    .mem-card {
      border: 2px solid var(--panel-border);
      box-shadow:
        0 12px 24px var(--panel-shadow),
        inset 0 0 0 1px rgba(255,255,255,0.12);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(21, 32, 62, 0.96), rgba(9, 16, 35, 0.92));
      backdrop-filter: blur(6px);
      color: var(--text-main);
    }
    .mem-btn {
      border: 2px solid rgba(255,255,255,0.14);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.08);
      border-radius: 12px;
      transform: translateY(0);
      transition: transform .08s, filter .12s, box-shadow .12s;
      cursor: pointer;
      color: #07101f;
      min-height: 42px;
    }
    .mem-btn:active {
      transform: translateY(2px) scale(0.99);
      filter: brightness(1.06);
    }
    .mem-btn:hover {
      filter: brightness(1.04);
      box-shadow: 0 10px 18px rgba(0,0,0,0.34), 0 0 16px rgba(136,231,255,0.16);
    }
    .hud-banner {
      position: relative;
      overflow: hidden;
    }
    .hud-banner::after {
      content: '✦';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.58);
      font-size: 0.8rem;
    }
    .status-panel {
      background:
        linear-gradient(180deg, rgba(31, 15, 54, 0.92), rgba(10, 18, 40, 0.96));
    }
    .modal-panel {
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-actions {
      flex-wrap: wrap;
      justify-content: center;
    }
    #hud {
      pointer-events: none;
    }
    #hud .mem-btn,
    #hud #statusText,
    #game-over-screen,
    #game-over-screen .mem-btn {
      pointer-events: auto;
    }
    .reaction-gif {
      position: absolute;
      z-index: 45;
      width: min(30vw, 124px);
      border: 2px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.32);
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
      object-fit: cover;
      background: rgba(7, 16, 31, 0.45);
    }
    .reaction-gif.visible {
      opacity: 0.95;
      transform: translateY(0) scale(1);
    }
    #impact-gif {
      right: 0.75rem;
      bottom: 4.8rem;
      aspect-ratio: 1 / 1;
    }
    #result-gif {
      left: 50%;
      top: 1rem;
      transform: translateX(-50%) translateY(8px) scale(0.92);
      width: min(42vw, 160px);
      max-width: 160px;
      aspect-ratio: 1 / 1;
    }
    #result-gif.visible {
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .role-fire { background: linear-gradient(180deg, #ffb57d, var(--accent-lava)); }
    .role-water { background: linear-gradient(180deg, #93efff, var(--accent-tide)); }
    .role-lightning { background: linear-gradient(180deg, #d4b5ff, var(--accent-storm)); }
    .bg-yellow-300 { background: linear-gradient(180deg, #ffe38f, var(--accent-sun)); color: #1d1400; }
    .bg-white { background: linear-gradient(180deg, #f8fdff, #d7eefb); color: #07111e; }
    .bg-pink-300 { background: linear-gradient(180deg, #4a2c71, #21143e); color: var(--text-main); }
    .bg-green-300 { background: linear-gradient(180deg, #beffc8, var(--accent-victory)); }
    .bg-cyan-300 { background: linear-gradient(180deg, #a1f6ff, var(--accent-tide)); }
    .bg-orange-300 { background: linear-gradient(180deg, #ffd0a3, #ffaf5e); }
    .bg-red-300 { background: linear-gradient(180deg, #ffb4bd, var(--danger)); }
    .bg-blue-300 { background: linear-gradient(180deg, #b8f0ff, #5eb5ff); }
    .bg-violet-300 { background: linear-gradient(180deg, #dfc6ff, var(--accent-storm)); }
    .bg-black\/60 { background: rgba(2, 8, 20, 0.72); backdrop-filter: blur(8px); }
    .hidden { display: none !important; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .top-3 { top: 0.75rem; }
    .top-14 { top: 3.5rem; }
    .right-3 { right: 0.75rem; }
    .left-3 { left: 0.75rem; }
    .bottom-3 { bottom: 0.75rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .max-w-sm { max-width: 24rem; }
    .inline-block { display: inline-block; }
    .block { display: block; }
    .flex { display: flex; }
    .grid { display: grid; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .p-2 { padding: 0.5rem; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-5xl { font-size: 3rem; line-height: 1; }
    .font-black { font-weight: 900; }
    .select-none { user-select: none; -webkit-user-select: none; }
    @media (max-width: 420px) {
      .text-5xl { font-size: 2.3rem; }
      .top-14 { top: 3.65rem; }
      .mem-btn { min-height: 40px; padding-left: 0.55rem; padding-right: 0.55rem; }
    }
  </style>
</head>
<body>
<div id="game-container" class="relative w-full h-full select-none">
  <canvas id="gameCanvas"></canvas>

  <!-- [agent-note][stage3] resolved-audio: bgm/ui/hit/win/blocked -> catalogs/audios.json -->
  <audio id="bgm_menu" data-editable="audio" data-label="Menu BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="auto" loop></audio>
  <audio id="bgm_game" data-editable="audio" data-label="Gameplay BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" preload="auto" loop></audio>
  <audio id="bgm_shop" data-editable="audio" data-label="Shop BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
  <audio id="sfx_click_src" data-editable="audio" data-label="Click SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
  <audio id="sfx_hit_src" data-editable="audio" data-label="Hit SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3" preload="auto"></audio>
  <audio id="sfx_win_src" data-editable="audio" data-label="Win SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
  <audio id="sfx_fail_src" data-editable="audio" data-label="Fail SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
  <audio id="sfx_damage_src" data-editable="audio" data-label="Damage SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3" preload="auto"></audio>
  <audio id="sfx_blocked_src" data-editable="audio" data-label="Blocked SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>
  <audio id="sfx_bonus_src" data-editable="audio" data-label="Bonus SFX Source" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>

  <div id="ui-layer" class="absolute inset-0 z-50 ui-font">
      <div id="hud" class="absolute inset-0 p-3">
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe; refreshed via styling only -->
        <div class="mem-card hud-banner bg-yellow-300 px-4 py-1 inline-block title-font text-2xl">WARDEN</div>
        <div class="absolute top-3 right-3 mem-card bg-white px-3 py-1 text-sm font-black">Shards: <span id="coinText">0</span></div>
        <div class="absolute top-14 left-3 right-3 mem-card status-panel bg-pink-300 p-2">
          <div class="flex gap-2">
            <button class="mem-btn bg-green-300 px-3 py-2 font-black flex-1" data-action="play">DEPLOY</button>
            <button class="mem-btn bg-cyan-300 px-3 py-2 font-black flex-1" data-action="shop">ARMORY</button>
            <button class="mem-btn bg-orange-300 px-3 py-2 font-black flex-1" data-action="menu">HUB</button>
          </div>
          <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
            <button class="mem-btn role-fire p-2 font-black" data-role="fire">FIRE CORE</button>
            <button class="mem-btn role-water p-2 font-black" data-role="water">TIDE CORE</button>
            <button id="lightningBtn" class="mem-btn role-lightning p-2 font-black" data-role="lightning">STORM CORE (100)</button>
          </div>
          <div id="statusText" class="mt-2 text-xs font-black">Safe hub online. Tap DEPLOY to begin the elemental drill.</div>
        </div>
         <div class="absolute left-3 right-3 bottom-3 flex gap-2 items-center">
           <div class="mem-card bg-white px-3 py-2 text-xs font-black flex-1">Shield: <span id="hpText">100</span></div>
           <div class="mem-card bg-white px-3 py-2 text-xs font-black flex-1">Wave: <span id="roundText">1</span></div>
         </div>
         <!-- [agent-note][stage3] resolved-gif: impact + result overlays -> catalogs/gifs.json -->
         <img id="impact-gif" class="reaction-gif" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="Impact reaction" />
       </div>

    <div id="game-over-screen" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center p-4">
      <div id="game-over-panel" class="mem-card bg-white modal-panel p-4 w-full max-w-sm text-center">
        <div id="resultTitle" class="title-font text-5xl mb-2">SIM LOST</div>
         <img id="result-gif" class="reaction-gif" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp" alt="Result reaction" />
         <div id="resultDesc" class="font-black text-sm mb-4">Your warden was overwhelmed.</div>
         <div id="goButtons" class="modal-actions flex gap-2 justify-center">
          <button id="restart-btn" class="mem-btn bg-red-300 px-4 py-2 font-black" data-action="retry">Retry Drill</button>
          <button id="menu-btn" class="mem-btn bg-yellow-300 px-4 py-2 font-black" data-action="to-menu">Return to Hub</button>
          <button id="victory-menu-btn" class="hidden mem-btn bg-green-300 px-4 py-2 font-black" data-action="to-menu">Back to Hub</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script id="game-config" type="application/x-game-config">
{
  "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 5, "min": 1, "max": 12 },
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff4d6d" }
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const hud = document.getElementById('hud');
  const over = document.getElementById('game-over-screen');
  const coinText = document.getElementById('coinText');
  const hpText = document.getElementById('hpText');
  const roundText = document.getElementById('roundText');
  const statusText = document.getElementById('statusText');
  const lightningBtn = document.getElementById('lightningBtn');
   const resultTitle = document.getElementById('resultTitle');
   const resultDesc = document.getElementById('resultDesc');
   const restartBtn = document.getElementById('restart-btn');
   const menuBtn = document.getElementById('menu-btn');
   const victoryMenuBtn = document.getElementById('victory-menu-btn');
   const impactGif = document.getElementById('impact-gif');
   const resultGif = document.getElementById('result-gif');

  const bgmMenu = document.getElementById('bgm_menu');
  const bgmGame = document.getElementById('bgm_game');
  const bgmShop = document.getElementById('bgm_shop');

  window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
  window.gameConfig = {};
  Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
  window.updateGameConfig = (key, val) => {
    if (!(key in window.gameConfigDefs)) return;
    const def = window.gameConfigDefs[key];
    if (def.type === 'number') {
      const n = Number(val);
      if (Number.isFinite(n)) window.gameConfig[key] = Math.max(def.min, Math.min(def.max, n));
    } else if (def.type === 'color') {
      if (/^#[0-9a-fA-F]{6}$/.test(val)) window.gameConfig[key] = val;
    }
  };

  let cw = 360, ch = 640, dpr = Math.max(1, window.devicePixelRatio || 1);
  let initialized = false;
  let gameState = 'PLAYING';
  let mode = 'MENU';
  let outcome = 'LOSE';
  let audioUnlocked = false;
  let lastTs = 0;
  let flash = 0, shake = 0, spawnCd = 0, enemyShotCd = 0;
  let coins = 0, round = 1, unlockedLightning = false;

  const roleColor = { fire:'#ff7a5c', water:'#69d4ff', lightning:'#bb8dff' };
  const roleGlow = { fire:'rgba(255,122,92,0.32)', water:'rgba(105,212,255,0.3)', lightning:'rgba(187,141,255,0.34)' };
  const beats = [{y:0,s:22,a:.08},{y:.35,s:16,a:.06},{y:.7,s:30,a:.05}];

  const hero = { x:0, y:0, r:16, hp:100, role:'fire', speed:5 };
  const enemies = [];
  const playerShots = [];
  const enemyShots = [];
  const particles = [];

  const audioManager = {
    ctx: null, buffers: {}, inited: false,
    async init(){
      if (this.inited) return;
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
       const pairs = [
         ['click', document.getElementById('sfx_click_src')],
         ['hit', document.getElementById('sfx_hit_src')],
         ['win', document.getElementById('sfx_win_src')],
         ['fail', document.getElementById('sfx_fail_src')],
         ['damage', document.getElementById('sfx_damage_src')],
         ['blocked', document.getElementById('sfx_blocked_src')],
         ['bonus', document.getElementById('sfx_bonus_src')]
       ];
      for (const [key, el] of pairs) {
        try {
          const arr = await fetch(el.src).then(r=>r.arrayBuffer());
          this.buffers[key] = await this.ctx.decodeAudioData(arr);
        } catch(_) {}
      }
      this.inited = true;
    },
    playSfx(name){
      try{
        if (!this.ctx) return;
         const b = this.buffers[name];
         if (b) {
           const s = this.ctx.createBufferSource(); s.buffer = b;
           const g = this.ctx.createGain();
           const gainMap = { click: 0.26, hit: 0.3, win: 0.34, fail: 0.3, damage: 0.28, blocked: 0.24, bonus: 0.32 };
           g.gain.value = gainMap[name] ?? 0.28;
           s.connect(g).connect(this.ctx.destination); s.start(0);
         } else this.synth(name);
      }catch(_){}
    },
    synth(name){
      try{
         const o = this.ctx.createOscillator(), g = this.ctx.createGain();
         o.type = name === 'hit' || name === 'fail' ? 'square' : 'triangle';
         o.frequency.value = name === 'win' || name === 'bonus' ? 880 : (name === 'hit' || name === 'damage' ? 140 : (name === 'blocked' ? 220 : 520));
        g.gain.value = 0.0001; o.connect(g).connect(this.ctx.destination);
        const t = this.ctx.currentTime;
        g.gain.exponentialRampToValueAtTime(0.15, t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
        o.start(t); o.stop(t+0.14);
      }catch(_){}
    }
  };

   function vibrate(style){
     window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
       action:'vibrate', requestId:'h5-'+Date.now(), version:'1.0', params:{style}
     });
   }

   let impactGifTimer = null;
   let resultGifTimer = null;
   let lastBlockedSfxAt = 0;
   let lastDamageSfxAt = 0;

   function showReactionGif(el, src, duration = 1100){
     if (!el) return;
     el.src = src;
     el.classList.add('visible');
     const timerProp = el === impactGif ? 'impactGifTimer' : 'resultGifTimer';
     if (timerProp === 'impactGifTimer' && impactGifTimer) clearTimeout(impactGifTimer);
     if (timerProp === 'resultGifTimer' && resultGifTimer) clearTimeout(resultGifTimer);
     const timer = setTimeout(() => el.classList.remove('visible'), duration);
     if (timerProp === 'impactGifTimer') impactGifTimer = timer;
     else resultGifTimer = timer;
   }

   function playBgmTrack(track){
    [bgmMenu,bgmGame,bgmShop].forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(_){} });
    const t = track === 'GAME' ? bgmGame : (track === 'SHOP' ? bgmShop : bgmMenu);
    t.volume = 0.2; t.play().catch(()=>{});
  }

  function unlockAudio(){
    if (!audioUnlocked) {
      audioUnlocked = true;
      audioManager.ctx?.resume?.().catch(()=>{});
      playBgmTrack(mode === 'PLAY' ? 'GAME' : (mode === 'SHOP' ? 'SHOP' : 'MENU'));
    } else {
      audioManager.ctx?.resume?.().catch(()=>{});
    }
  }

  function setState(next){
    gameState = next;
    if (next === 'PLAYING') {
      hud.classList.remove('hidden');
      over.classList.add('hidden');
    } else {
      hud.classList.add('hidden');
      over.classList.remove('hidden');
    }
  }

  function getOppositeRole(role){ return role === 'fire' ? 'water' : (role === 'water' ? 'fire' : 'water'); }

  function initGame(){
    hero.x = Math.max(hero.r, Math.min(cw-hero.r, cw*0.5));
    hero.y = Math.max(hero.r, Math.min(ch-hero.r, ch*0.8));
    hero.hp = 100;
    hero.speed = window.gameConfig.heroSpeed;
    enemies.length = 0; playerShots.length = 0; enemyShots.length = 0; particles.length = 0;
    spawnCd = 0.5; enemyShotCd = 0.8; flash = 0; shake = 0;
    round = 1;
    mode = 'MENU';
    outcome = 'LOSE';
    updateHudText();
    refreshShopButton();
    statusText.textContent = 'Safe hub online. Tap DEPLOY to begin the elemental drill.';
    playBgmTrack('MENU');
  }

  function restartGame(){ initGame(); setState('PLAYING'); }

  function refreshShopButton(){
    lightningBtn.textContent = unlockedLightning ? 'STORM CORE (Owned)' : 'STORM CORE (100)';
  }

  function updateHudText(){
    coinText.textContent = String(coins);
    hpText.textContent = String(Math.max(0, Math.floor(hero.hp)));
    roundText.textContent = String(round);
  }

  function shootTowards(x,y){
    const dx = x - hero.x, dy = y - hero.y;
    const len = Math.hypot(dx,dy) || 1;
    const speed = 360;
    playerShots.push({x:hero.x,y:hero.y,vx:dx/len*speed,vy:dy/len*speed,r:7,role:hero.role});
    audioManager.playSfx('click');
    vibrate('light');
  }

   function damageHero(d){
     hero.hp -= d;
     flash = 0.2; shake = 0.2;
     const now = performance.now();
     if (now - lastDamageSfxAt > 140) {
       audioManager.playSfx('damage');
       lastDamageSfxAt = now;
     }
     showReactionGif(impactGif, 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp', 900);
    vibrate('medium');
    if (hero.hp <= 0){
      hero.hp = 0;
      outcome = 'LOSE';
       resultTitle.textContent = 'SIM LOST';
       resultDesc.textContent = 'Opposing cores broke your shield.';
       audioManager.playSfx('fail');
       showReactionGif(resultGif, 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 2200);
      restartBtn.classList.remove('hidden');
      menuBtn.classList.remove('hidden');
      victoryMenuBtn.classList.add('hidden');
      setState('GAMEOVER');
      vibrate('heavy');
    }
  }

  function winRound(){
    outcome = 'WIN';
    coins += 50;
     audioManager.playSfx('win');
     audioManager.playSfx('bonus');
     vibrate('light');
     showReactionGif(resultGif, 'https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp', 2200);
    resultTitle.textContent = 'DRILL CLEAR';
    resultDesc.textContent = 'Wave cleared. +50 shards secured.';
    restartBtn.classList.add('hidden');
    menuBtn.classList.add('hidden');
    victoryMenuBtn.classList.remove('hidden');
    setState('GAMEOVER');
  }

  function enterPlay(){
    mode = 'PLAY';
    enemies.length = 0; enemyShots.length = 0; playerShots.length = 0; particles.length = 0;
    hero.hp = 100; round = 1; spawnCd = 0.3; enemyShotCd = 0.8;
    statusText.textContent = 'Live drill: counter the opposing core before it hits your shield.';
    playBgmTrack('GAME');
    updateHudText();
  }

  function enterMenu(){
    mode = 'MENU';
    statusText.textContent = 'Safe hub online. Tap DEPLOY to begin the elemental drill.';
    playBgmTrack('MENU');
  }

  function enterShop(){
    mode = 'SHOP';
    statusText.textContent = 'Armory: unlock the Storm Core for 100 shards.';
    playBgmTrack('SHOP');
  }

  function tryBuyLightning(){
    if (!unlockedLightning && coins >= 100) {
      coins -= 100;
      unlockedLightning = true;
       refreshShopButton();
       updateHudText();
       audioManager.playSfx('bonus');
       showReactionGif(resultGif, 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp', 1600);
       statusText.textContent = 'Storm Core unlocked. You can equip it now.';
    }
  }

  function handleUIButton(target){
    const action = target?.dataset?.action;
    const role = target?.dataset?.role;
     if (action === 'play') enterPlay();
     if (action === 'menu' || action === 'to-menu') { enterMenu(); if (gameState === 'GAMEOVER') setState('PLAYING'); }
     if (action === 'shop') enterShop();
     if (action === 'retry') { restartGame(); enterPlay(); }
     if (role) {
       if (role === 'lightning' && !unlockedLightning) {
         if (mode === 'SHOP') tryBuyLightning();
         const now = performance.now();
         if (now - lastBlockedSfxAt > 180) {
           audioManager.playSfx('blocked');
           lastBlockedSfxAt = now;
         }
         showReactionGif(impactGif, 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp', 950);
         return;
       }
      hero.role = role;
      const roleLabel = role === 'fire' ? 'FIRE CORE' : (role === 'water' ? 'TIDE CORE' : 'STORM CORE');
      statusText.textContent = `Core equipped: ${roleLabel}`;
      audioManager.playSfx('click');
    }
    if (mode === 'SHOP' && role !== 'lightning') tryBuyLightning();
    updateHudText();
  }

  function handleGameInput(e){
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    if (mode === 'PLAY') shootTowards(x,y);
  }

  function handleGlobalInput(e){
    unlockAudio();
    const t = e.target;
    if (t && (t.dataset?.action || t.dataset?.role)) {
      handleUIButton(t);
      return;
    }
    if (gameState === 'GAMEOVER') return;
    if (gameState === 'PLAYING' && t === canvas && e.type !== 'pointerup' && e.type !== 'pointercancel') {
      e.preventDefault?.();
      handleGameInput(e);
    }
  }

  function spawnEnemy(){
    const role = getOppositeRole(hero.role);
    const ex = Math.random()*(cw-40)+20;
    enemies.push({x:ex,y:-20,r:14,hp:2,role,v:55+Math.random()*20});
  }

  function update(dt){
    dt = Math.min(dt, 0.05);
    hero.speed = window.gameConfig.heroSpeed;
    if (!Number.isFinite(hero.x) || !Number.isFinite(hero.y)) { hero.x = cw*0.5; hero.y = ch*0.8; }

    flash = Math.max(0, flash - dt);
    shake = Math.max(0, shake - dt);

    if (mode === 'PLAY' && gameState === 'PLAYING') {
      spawnCd -= dt;
      if (spawnCd <= 0) { spawnEnemy(); spawnCd = Math.max(0.25, 0.9 - round*0.03); }

      enemyShotCd -= dt;
      if (enemyShotCd <= 0 && enemies.length) {
        const e = enemies[(Math.random()*enemies.length)|0];
        const dx = hero.x - e.x, dy = hero.y - e.y, L = Math.hypot(dx,dy)||1;
        enemyShots.push({x:e.x,y:e.y,vx:dx/L*180,vy:dy/L*180,r:6,role:e.role});
        enemyShotCd = 0.7;
      }

      for (const e of enemies){ e.y += e.v*dt; if (e.y > ch+30) e.hp = 0; }
      for (const s of playerShots){ s.x += s.vx*dt; s.y += s.vy*dt; }
      for (const s of enemyShots){ s.x += s.vx*dt; s.y += s.vy*dt; }

      for (const s of playerShots){
        for (const e of enemies){
          const d = Math.hypot(s.x-e.x, s.y-e.y);
           if (d < s.r + e.r) {
             s.dead = true; e.hp -= 1;
             audioManager.playSfx('hit');
             showReactionGif(impactGif, 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp', 720);
             particles.push({x:e.x,y:e.y,t:0.25,c:roleColor[s.role]});
           }
        }
      }

      for (const s of enemyShots){
        const d = Math.hypot(s.x-hero.x, s.y-hero.y);
        if (d < s.r + hero.r) { s.dead = true; damageHero(12); }
      }

      for (const p of particles) p.t -= dt;
      for (let i=enemies.length-1;i>=0;i--) if (enemies[i].hp<=0) enemies.splice(i,1);
      for (let i=playerShots.length-1;i>=0;i--) if (playerShots[i].dead || playerShots[i].y<-30 || playerShots[i].y>ch+30 || playerShots[i].x<-30 || playerShots[i].x>cw+30) playerShots.splice(i,1);
      for (let i=enemyShots.length-1;i>=0;i--) if (enemyShots[i].dead || enemyShots[i].y>ch+40 || enemyShots[i].x<-40 || enemyShots[i].x>cw+40) enemyShots.splice(i,1);
      for (let i=particles.length-1;i>=0;i--) if (particles[i].t<=0) particles.splice(i,1);

      round += dt*0.45;
      if (round >= 6) winRound();
      updateHudText();
    }
  }

  function draw(){
    const sx = shake>0 ? (Math.random()-0.5)*8 : 0;
    const sy = shake>0 ? (Math.random()-0.5)*8 : 0;
    ctx.save();
    ctx.translate(sx, sy);

    const g = ctx.createLinearGradient(0,0,0,ch);
    g.addColorStop(0,'#07101f');
    g.addColorStop(.38,'#102445');
    g.addColorStop(.72,'#142f55');
    g.addColorStop(1,'#07101a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,cw,ch);

    const halo = ctx.createRadialGradient(cw*0.5, ch*0.18, 20, cw*0.5, ch*0.18, ch*0.55);
    halo.addColorStop(0,'rgba(255,217,106,0.26)');
    halo.addColorStop(0.45,'rgba(121,224,255,0.12)');
    halo.addColorStop(1,'rgba(4,10,24,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0,0,cw,ch);

    for (const b of beats){
      ctx.fillStyle = `rgba(255,255,255,${b.a})`;
      const y = ((performance.now()*0.014)+ch*b.y)%ch;
      ctx.fillRect(0,y,cw,b.s);
    }

    ctx.strokeStyle = 'rgba(136,231,255,0.12)';
    ctx.lineWidth = 1;
    for (let y = 0; y < ch; y += 28) {
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(cw, y + 0.5);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(16, ch*0.2, 8, ch*0.68);
    ctx.fillRect(cw-24, ch*0.26, 8, ch*0.62);

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(8, 0, 4, ch);
    ctx.fillRect(cw-12, 0, 4, ch);

    for (const e of enemies){
      ctx.save();
      ctx.shadowColor = roleGlow[e.role];
      ctx.shadowBlur = 16;
      ctx.fillStyle = roleColor[e.role];
      ctx.strokeStyle = '#061120';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(e.x,e.y,Math.max(0,e.r),0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#061120';
      ctx.fillRect(e.x-10,e.y-2,20,4);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(e.x-4,e.y-8,8,3);
      ctx.restore();
    }
    for (const s of playerShots){
      ctx.save();
      ctx.shadowColor = roleGlow[s.role];
      ctx.shadowBlur = 14;
      ctx.fillStyle = roleColor[s.role];
      ctx.beginPath();
      ctx.arc(s.x,s.y,Math.max(0,s.r),0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    for (const s of enemyShots){
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.18)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#dbeaff';
      ctx.beginPath();
      ctx.arc(s.x,s.y,Math.max(0,s.r),0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    for (const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0,p.t/0.25);
      ctx.fillStyle = p.c;
      ctx.shadowColor = p.c;
      ctx.shadowBlur = 12;
      ctx.fillRect(p.x-6,p.y-6,12,12);
      ctx.restore();
    }

    const pulse = 1 + Math.sin(performance.now() * 0.01) * 0.04;
    ctx.save();
    ctx.translate(hero.x, hero.y);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = roleGlow[hero.role];
    ctx.shadowBlur = 20;
    ctx.fillStyle = roleColor[hero.role];
    ctx.strokeStyle = '#f3fbff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0,0,Math.max(0,hero.r+2),0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-5,-4,3,0,Math.PI*2);
    ctx.arc(5,-4,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#07101f';
    ctx.beginPath();
    ctx.arc(-5,-4,1.3,0,Math.PI*2);
    ctx.arc(5,-4,1.3,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = '#07101f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0,3,6,0,Math.PI);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(-6,-7,4,0,Math.PI*2);
    ctx.fill();

     ctx.fillStyle = '#f3fbff';
     ctx.font = '700 10px "Orbitron"';
    ctx.textAlign='center';
    ctx.fillText(hero.role[0].toUpperCase(), 0, hero.r + 14);
    ctx.restore();

    if (flash > 0){
      ctx.fillStyle = `rgba(255,109,124,${flash*0.34})`;
      ctx.fillRect(0,0,cw,ch);
    }
    ctx.restore();
  }

  function loop(ts){
    try{
      const dt = (ts - lastTs) / 1000 || 0;
      lastTs = ts;
      update(dt);
      draw();
    }catch(_){}
    requestAnimationFrame(loop);
  }

  function clampEntities(){
    hero.x = Math.max(hero.r, Math.min(cw-hero.r, hero.x));
    hero.y = Math.max(hero.r, Math.min(ch-hero.r, hero.y));
    enemies.forEach(e=>{ e.x=Math.max(e.r,Math.min(cw-e.r,e.x)); e.y=Math.max(-40,Math.min(ch+40,e.y)); });
  }

  function resize(w,h){
    cw = w; ch = h; dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (initialized) clampEntities();
  }

  const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    resize(rect.width, rect.height);
    if (!initialized){
      audioManager.init().then(()=>{});
      initGame();
      setState('PLAYING');
      bgmMenu.play().catch(()=>{});
      initialized = true;
      requestAnimationFrame(loop);
    }
  });
  ro.observe(canvas);

  window.addEventListener('pointerdown', handleGlobalInput, { passive:false });
  window.addEventListener('pointermove', (e)=>{ if (e.buttons===1 && gameState==='PLAYING' && mode==='PLAY') handleGlobalInput(e); }, { passive:false });
  window.addEventListener('pointerup', handleGlobalInput, { passive:false });
  window.addEventListener('pointercancel', handleGlobalInput, { passive:false });

  if (restartBtn) restartBtn.addEventListener('click', handleGlobalInput, { passive:false });
  if (menuBtn) menuBtn.addEventListener('click', handleGlobalInput, { passive:false });
  if (victoryMenuBtn) victoryMenuBtn.addEventListener('click', handleGlobalInput, { passive:false });
});
</script>
</body>
</html>
