<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>RPG Chase: Neon Escape</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --bg-top: #050816;
            --bg-mid: #0f1330;
            --bg-bottom: #190d2f;
            --panel-bg: rgba(9, 14, 34, 0.82);
            --panel-border: rgba(110, 231, 255, 0.32);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --text-main: #eef8ff;
            --text-soft: #b6c5f1;
            --accent-cyan: #65e7ff;
            --accent-blue: #54a6ff;
            --accent-pink: #ff6bb5;
            --accent-red: #ff5c7c;
            --accent-gold: #ffd56a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(101, 231, 255, 0.18), transparent 28%),
                radial-gradient(circle at 80% 18%, rgba(255, 107, 181, 0.15), transparent 24%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
            font-family: 'Exo 2', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-main);
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(17, 26, 56, 0.94), var(--panel-bg)),
                rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 24px rgba(84, 166, 255, 0.12),
                inset 0 1px 0 var(--panel-highlight);
        }

        .title-font {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .neon-text-red {
            color: #ff7d93;
            text-shadow: 0 0 10px rgba(255, 92, 124, 0.9), 0 0 20px rgba(255, 107, 181, 0.35);
        }

        .neon-text-blue {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(101, 231, 255, 0.85), 0 0 20px rgba(84, 166, 255, 0.35);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }

        .animate-pulse-fast {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        .animate-pulse {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            border: 2px solid #fca5a5;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transition: transform 0.1s ease;
            cursor: pointer;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: var(--safe-top) 16px 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .hud-card {
            min-width: 124px;
            padding: 10px 12px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(13, 19, 44, 0.92), rgba(9, 14, 34, 0.78));
            border: 1px solid rgba(101, 231, 255, 0.2);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        #hud:not(.opacity-0) {
            opacity: 1;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
        }

        .hud-group.right {
            align-items: flex-end;
            text-align: right;
        }

        .hud-label {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            margin-bottom: 0.15rem;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
        }

        .hud-label.blue {
            color: #8fdcff;
        }

        .hud-label.red {
            color: #ff93ad;
        }

        #score-display {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .hud-value-alert {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .modal-screen {
            width: min(100% - 32px, 420px);
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            transform: transition-all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .modal-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(101, 231, 255, 0.12), transparent 36%),
                linear-gradient(135deg, rgba(255, 107, 181, 0.09), transparent 45%);
            pointer-events: none;
        }

        .modal-screen > * {
            position: relative;
            z-index: 1;
        }

        .screen-title {
            margin: 0 0 8px 0;
            font-size: clamp(2.6rem, 10vw, 3.2rem);
            line-height: 1;
        }

        .screen-subtitle {
            margin: 0 0 24px 0;
            color: var(--text-soft);
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .character-marquee {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 0 0 24px 0;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(7, 12, 29, 0.74);
            border: 1px solid rgba(101, 231, 255, 0.18);
        }

        .hero-avatar {
            width: 68px;
            height: 68px;
            flex: 0 0 68px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 2rem;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.32), transparent 22%),
                linear-gradient(145deg, rgba(101, 231, 255, 0.9), rgba(84, 166, 255, 0.55) 60%, rgba(255, 107, 181, 0.65));
            box-shadow:
                0 0 22px rgba(84, 166, 255, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.45);
        }

        .hero-avatar-text {
            text-align: left;
        }

        .hero-avatar-text strong {
            display: block;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            color: var(--text-main);
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .hero-avatar-text span {
            display: block;
            color: #9dd6ff;
            font-size: 0.78rem;
            letter-spacing: 0.16em;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
        }

        .instruction-list {
            display: grid;
            gap: 16px;
            margin: 0 0 32px 0;
        }

        .instruction-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #d7def4;
            font-size: 0.875rem;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
        }

        .instruction-key {
            background: rgba(30, 64, 175, 0.5);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(101, 231, 255, 0.32);
            min-width: 72px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .main-button,
        .secondary-button {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            border: 0;
        }

        .secondary-button {
            background: linear-gradient(135deg, #fefefe 0%, #d9ebff 100%);
            color: #111827;
            box-shadow: 0 0 20px rgba(101, 231, 255, 0.3);
            cursor: pointer;
        }

        .secondary-button:active {
            transform: scale(0.95);
        }

        #game-over-screen {
            border-top: 4px solid #dc2626;
        }

        .over-label {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 4px;
            letter-spacing: 0.08em;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
        }

        #final-score {
            font-size: clamp(2.2rem, 8vw, 3rem);
            font-weight: 700;
            margin-bottom: 24px;
        }

        #warning {
            position: absolute;
            pointer-events: none;
        }

        .warning-ring {
            width: 48px;
            height: 48px;
            border: 4px solid #ef4444;
            border-radius: 999px;
            animation: pulse-glow 1s infinite ease-in-out;
            position: absolute;
        }

        .warning-core {
            width: 48px;
            height: 48px;
            background: rgba(220, 38, 38, 0.5);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(255, 92, 124, 0.45);
        }

        .feedback-overlay {
            position: absolute;
            right: 12px;
            bottom: calc(var(--safe-bottom) + 12px);
            width: min(32vw, 120px);
            max-height: 120px;
            padding: 6px;
            border-radius: 18px;
            background: rgba(8, 14, 32, 0.68);
            border: 1px solid rgba(101, 231, 255, 0.18);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            overflow: hidden;
        }

        .feedback-overlay.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .feedback-overlay.fail {
            left: 50%;
            right: auto;
            top: 50%;
            bottom: auto;
            width: min(48vw, 180px);
            max-height: 180px;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(34, 8, 20, 0.82);
            border-color: rgba(255, 107, 181, 0.4);
            z-index: 3;
        }

        .feedback-overlay.fail.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-caption {
            margin-top: 6px;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: #cff5ff;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .modal-screen {
                padding: 24px;
            }

            .main-button,
            .secondary-button {
                font-size: 1.05rem;
                letter-spacing: 0.12em;
            }

            .screen-subtitle {
                font-size: 1rem;
            }

            .feedback-overlay {
                width: min(36vw, 104px);
                bottom: calc(var(--safe-bottom) + 10px);
                right: 10px;
            }

            .feedback-overlay.fail {
                width: min(54vw, 160px);
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">

            <div id="hud" class="opacity-0">
                <div class="hud-group hud-card">
                    <span class="hud-label blue">DISTANCE</span>
                    <span id="score-display" class="title-font">0m</span>
                </div>
                <div class="hud-group right hud-card">
                    <span class="hud-label red animate-pulse">THREAT LEVEL</span>
                    <span class="hud-value-alert">CRITICAL</span>
                </div>
            </div>

            <div id="start-screen" class="interactive glass-panel modal-screen">
                <h1 class="screen-title title-font neon-text-red">RPG CHASE</h1>
                <p class="screen-subtitle">ESCAPE THE MECHA</p>

                <div class="character-marquee" aria-hidden="true">
                    <div class="hero-avatar">🛡️</div>
                    <div class="hero-avatar-text">
                        <strong>NEON RUNNER</strong>
                        <span>BOOST READY</span>
                    </div>
                </div>

                <div class="instruction-list">
                    <div class="instruction-row">
                        <span class="instruction-key">TAP</span>
                        <span>TO JUMP</span>
                    </div>
                    <div class="instruction-row">
                        <span class="instruction-key">TAP x2</span>
                        <span>TO DOUBLE JUMP</span>
                    </div>
                </div>

                <button id="start-btn" class="btn-primary main-button animate-pulse-fast">
                    RUN
                </button>
            </div>

            <div id="game-over-screen" class="interactive hidden glass-panel modal-screen">
                <h2 class="screen-title title-font">TERMINATED</h2>
                <div class="over-label">FINAL DISTANCE</div>
                <div id="final-score" class="neon-text-blue title-font">0m</div>

                <div id="fail-gif" class="feedback-overlay fail hidden" aria-hidden="true">
                    <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Defeat reaction animation">
                    <div class="feedback-caption">SYSTEM BREACH</div>
                </div>

                <button id="restart-btn" class="secondary-button">
                    RETRY
                </button>
            </div>

            <div id="warning" class="hidden">
                <div class="warning-ring"></div>
                <div class="warning-core">!</div>
            </div>

            <div id="danger-gif" class="feedback-overlay hidden" aria-hidden="true">
                <img src="https://i.giphy.com/TytHun5lKuMdzUYVxl.webp" alt="Danger alert animation">
                <div class="feedback-caption">MISSILE LOCK</div>
            </div>

        </div>
    </div>

    <script>
        /*
         * RPG Chase: Neon Escape
         * Single File Mobile Remake
         */

        // --- Assets ---
        // [agent-note][stage4] repaired: mobile-tap-safety | element: body/canvas/start-btn | action: scoped touch suppression to gameplay surface only
        // [agent-note][stage4] repaired: font-remap | element: head link tags | action: catalog-backed Audiowide + Exo 2 stylesheet refs
        // [agent-note][stage3] resolved-font: title=Audiowide body-ui=Exo 2 via catalogs/fonts.json
        // [agent-note][stage3] resolved-audio: start/jump/land/warn/score/fail/bgm via catalogs/audios.json
        // [agent-note][stage3] resolved-gif: warning/fail overlays via catalogs/gifs.json
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
            land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
            score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
        };

        // --- Audio System ---
        const AudioSys = {
            ctx: null,
            bgmNode: null,
            buffers: {},
            muted: false,
            lastPlayedAt: {},
            audioEls: {},

            init: function() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }

                Object.entries(ASSETS).forEach(([key, url]) => {
                    if (!this.audioEls[key]) {
                        const audio = new Audio(url);
                        audio.preload = 'auto';
                        audio.crossOrigin = 'anonymous';
                        this.audioEls[key] = audio;
                    }
                });
            },

            ensureReady: async function() {
                if (!this.ctx) return false;
                if (this.ctx.state === 'suspended') {
                    try {
                        await this.ctx.resume();
                    } catch (e) {
                        return false;
                    }
                }
                return true;
            },

            playSFX: async function(key, options = {}) {
                if (this.muted) return;
                const ready = await this.ensureReady();
                if (!ready) return;

                const audio = this.audioEls[key];
                if (!audio) return;

                const now = performance.now();
                const minGap = options.minGap ?? 0;
                if (minGap && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
                this.lastPlayedAt[key] = now;

                try {
                    const shot = audio.cloneNode();
                    shot.volume = Math.max(0, Math.min(1, options.volume ?? 0.45));
                    shot.play().catch(() => {});
                } catch (e) {
                    console.warn('Audio play error', key, e);
                }
            },

            playBGM: async function() {
                if (this.muted) return;
                const ready = await this.ensureReady();
                if (!ready) return;

                if (this.bgmNode) return;

                const audio = this.audioEls.bgm;
                if (!audio) return;

                this.bgmNode = audio;
                this.bgmNode.loop = true;
                this.bgmNode.volume = 0.2;
                this.bgmNode.currentTime = 0;
                this.bgmNode.play().catch(() => {});
            },

            stopBGM: function() {
                if (this.bgmNode) {
                    this.bgmNode.pause();
                    this.bgmNode.currentTime = 0;
                    this.bgmNode = null;
                }
            }
        };

        // --- GIF Feedback ---
        const GifFX = {
            timeouts: {},

            show(id, duration = 1200) {
                const el = document.getElementById(id);
                if (!el) return;
                clearTimeout(this.timeouts[id]);
                el.classList.remove('hidden');
                requestAnimationFrame(() => el.classList.add('visible'));
                this.timeouts[id] = setTimeout(() => {
                    el.classList.remove('visible');
                    setTimeout(() => el.classList.add('hidden'), 180);
                }, duration);
            },

            hide(id) {
                const el = document.getElementById(id);
                if (!el) return;
                clearTimeout(this.timeouts[id]);
                el.classList.remove('visible');
                el.classList.add('hidden');
            }
        };

        // --- Game Engine ---
        const Game = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            frame: 0,
            active: false,
            state: 'MENU',

            gravity: 0.6,
            groundHeight: 0,
            baseSpeed: 6,
            speed: 6,
            score: 0,

            player: {
                x: 0, y: 0, w: 40, h: 60,
                vy: 0, jumpForce: -14,
                grounded: true,
                wasGrounded: true,
                jumps: 0, maxJumps: 2
            },

            monster: {
                x: 0, y: 0, w: 140, h: 160,
                yOffset: 0,
                shootTimer: 0,
                shootInterval: 150
            },

            rockets: [],
            particles: [],
            stars: [],
            warningActive: false,

            init: function() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                const touchHandler = (e) => {
                    if (e.cancelable) e.preventDefault();
                    this.handleInput();
                };

                this.canvas.addEventListener('touchstart', touchHandler, { passive: false });
                this.canvas.addEventListener('mousedown', () => this.handleInput());

                this.initStars();
                this.loop();
            },

            resize: function() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.groundHeight = this.height * 0.15;

                if (this.state === 'MENU') {
                    this.player.x = this.width * 0.65;
                    this.player.y = this.height - this.groundHeight - this.player.h;
                    this.monster.x = this.width * 0.05;
                    this.monster.y = this.height - this.groundHeight - this.monster.h;
                }
            },

            initStars: function() {
                this.stars = [];
                for (let i = 0; i < 60; i++) {
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        size: Math.random() * 2 + 0.5,
                        speed: Math.random() * 0.5 + 0.1
                    });
                }
            },

            reset: function() {
                this.state = 'PLAYING';
                this.score = 0;
                this.speed = this.baseSpeed;
                this.frame = 0;
                this.warningActive = false;

                this.player.x = this.width * 0.65;
                this.player.y = this.height - this.groundHeight - this.player.h;
                this.player.vy = 0;
                this.player.jumps = 0;
                this.player.grounded = true;
                this.player.wasGrounded = true;

                this.monster.x = this.width * 0.05;
                this.monster.y = this.height - this.groundHeight - this.monster.h;
                this.monster.shootTimer = 100;
                this.monster.shootInterval = 150;

                this.rockets = [];
                this.particles = [];

                document.getElementById('score-display').innerText = '0m';
                document.getElementById('warning').style.display = 'none';
                GifFX.hide('danger-gif');
                GifFX.hide('fail-gif');

                AudioSys.playBGM();
            },

            handleInput: function() {
                if (this.state === 'PLAYING') {
                    if (this.player.jumps < this.player.maxJumps) {
                        this.player.vy = this.player.jumpForce;
                        this.player.grounded = false;
                        this.player.jumps++;
                        this.spawnParticles(this.player.x + this.player.w / 2, this.player.y + this.player.h, 5, '#38bdf8');
                        AudioSys.playSFX('jump', { volume: 0.34, minGap: 110 });
                    }
                }
            },

            spawnRocket: function() {
                const gunY = this.monster.y + this.monster.h * 0.4;
                const gunX = this.monster.x + this.monster.w - 20;

                this.rockets.push({
                    x: gunX,
                    y: gunY,
                    w: 30, h: 12,
                    vx: this.speed * 1.5 + 2,
                    passed: false
                });

                this.spawnParticles(gunX, gunY, 10, '#ef4444');
            },

            spawnParticles: function(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        life: 1.0,
                        color: color
                    });
                }
            },

            update: function() {
                if (this.state !== 'PLAYING') return;

                this.frame++;
                this.score += this.speed * 0.05;
                document.getElementById('score-display').innerText = Math.floor(this.score) + 'm';

                if (this.frame % 600 === 0) {
                    this.speed += 0.5;
                    this.monster.shootInterval = Math.max(60, this.monster.shootInterval - 10);
                }

                this.player.wasGrounded = this.player.grounded;
                this.player.vy += this.gravity;
                this.player.y += this.player.vy;

                const floorY = this.height - this.groundHeight - this.player.h;
                if (this.player.y > floorY) {
                    this.player.y = floorY;
                    this.player.vy = 0;
                    this.player.grounded = true;
                    if (!this.player.wasGrounded) {
                        AudioSys.playSFX('land', { volume: 0.25, minGap: 140 });
                    }
                    this.player.jumps = 0;
                } else {
                    this.player.grounded = false;
                }

                this.monster.yOffset = Math.sin(this.frame * 0.05) * 10;
                this.monster.shootTimer++;

                const warnEl = document.getElementById('warning');
                const inWarningWindow = this.monster.shootInterval - this.monster.shootTimer < 40;
                if (inWarningWindow) {
                    warnEl.style.display = 'block';
                    warnEl.style.top = (this.monster.y + this.monster.h * 0.4 - 20) + 'px';
                    warnEl.style.left = (this.monster.x + this.monster.w + 10) + 'px';
                    if (!this.warningActive) {
                        this.warningActive = true;
                        AudioSys.playSFX('warning', { volume: 0.22, minGap: 400 });
                        GifFX.show('danger-gif', 900);
                    }
                } else {
                    warnEl.style.display = 'none';
                    this.warningActive = false;
                }

                if (this.monster.shootTimer >= this.monster.shootInterval) {
                    this.spawnRocket();
                    this.monster.shootTimer = 0;
                }

                for (let i = this.rockets.length - 1; i >= 0; i--) {
                    const r = this.rockets[i];
                    r.x += r.vx;

                    if (this.frame % 3 === 0) {
                        this.particles.push({
                            x: r.x, y: r.y + r.h / 2,
                            vx: -2, vy: (Math.random() - 0.5),
                            life: 0.4,
                            color: '#fca5a5'
                        });
                    }

                    if (this.checkCollision(this.player, r)) {
                        this.gameOver();
                    }

                    if (!r.passed && r.x > this.player.x + this.player.w) {
                        r.passed = true;
                        this.score += 50;
                        AudioSys.playSFX('score', { volume: 0.4, minGap: 90 });
                    }

                    if (r.x > this.width) this.rockets.splice(i, 1);
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.03;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            },

            checkCollision: function(p, r) {
                const padding = 5;
                return (
                    p.x + padding < r.x + r.w &&
                    p.x + p.w - padding > r.x &&
                    p.y + padding < r.y + r.h &&
                    p.y + p.h - padding > r.y
                );
            },

            gameOver: function() {
                this.state = 'GAMEOVER';
                AudioSys.stopBGM();
                AudioSys.playSFX('fail', { volume: 0.5, minGap: 250 });

                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 400);
                this.spawnParticles(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 30, '#fff');
                GifFX.show('fail-gif', 1600);

                document.getElementById('hud').classList.add('opacity-0');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = Math.floor(this.score) + 'm';
            },

            draw: function() {
                const sky = this.ctx.createLinearGradient(0, 0, 0, this.height);
                sky.addColorStop(0, '#050816');
                sky.addColorStop(0.45, '#101735');
                sky.addColorStop(1, '#1b0f31');
                this.ctx.fillStyle = sky;
                this.ctx.fillRect(0, 0, this.width, this.height);

                for (let i = 0; i < 3; i++) {
                    const bandY = this.height * (0.18 + i * 0.12);
                    this.ctx.strokeStyle = i === 1 ? 'rgba(101, 231, 255, 0.12)' : 'rgba(255, 107, 181, 0.08)';
                    this.ctx.lineWidth = i === 1 ? 2 : 1;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, bandY);
                    this.ctx.quadraticCurveTo(this.width * 0.35, bandY - 24, this.width, bandY + 12);
                    this.ctx.stroke();
                }

                this.ctx.fillStyle = '#ffffff';
                this.stars.forEach((s) => {
                    this.ctx.globalAlpha = Math.random() * 0.5 + 0.2;
                    this.ctx.beginPath();
                    this.ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    if (this.state === 'PLAYING') {
                        s.x -= s.speed * (this.speed * 0.2);
                        if (s.x < 0) s.x = this.width;
                    }
                });
                this.ctx.globalAlpha = 1.0;

                const groundY = this.height - this.groundHeight;
                const grad = this.ctx.createLinearGradient(0, groundY, 0, this.height);
                grad.addColorStop(0, '#161a40');
                grad.addColorStop(0.55, '#140f2d');
                grad.addColorStop(1, '#090d1f');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, groundY, this.width, this.groundHeight);

                this.ctx.fillStyle = 'rgba(101, 231, 255, 0.08)';
                for (let x = 0; x < this.width; x += 48) {
                    this.ctx.fillRect(x, groundY + this.groundHeight * 0.16, 22, 2);
                }

                this.ctx.strokeStyle = '#65e7ff';
                this.ctx.globalAlpha = 0.3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, groundY);
                this.ctx.lineTo(this.width, groundY);
                this.ctx.stroke();

                const lineSpacing = 80;
                const offset = (this.frame * this.speed) % lineSpacing;
                for (let x = -lineSpacing; x < this.width + lineSpacing; x += lineSpacing) {
                    const drawX = x - offset;
                    this.ctx.beginPath();
                    this.ctx.moveTo(drawX, groundY);
                    this.ctx.lineTo(drawX - 100, this.height);
                    this.ctx.stroke();
                }
                this.ctx.globalAlpha = 1.0;

                this.ctx.save();
                this.ctx.translate(this.monster.x, this.monster.y + this.monster.yOffset);

                this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
                this.ctx.beginPath();
                this.ctx.ellipse(this.monster.w / 2, this.monster.h, 40, 10, 0, 0, Math.PI * 2);
                this.ctx.fill();

                const mechShell = this.ctx.createLinearGradient(20, 40, 120, 140);
                mechShell.addColorStop(0, '#421133');
                mechShell.addColorStop(0.6, '#8b1e4f');
                mechShell.addColorStop(1, '#23113d');
                this.ctx.fillStyle = mechShell;
                this.ctx.beginPath();
                this.ctx.roundRect(18, 38, 102, 104, 18);
                this.ctx.fill();

                this.ctx.fillStyle = 'rgba(255,255,255,0.08)';
                this.ctx.fillRect(34, 52, 62, 8);

                this.ctx.shadowBlur = 20;
                this.ctx.shadowColor = '#ff5c7c';
                this.ctx.fillStyle = '#ffd56a';
                this.ctx.beginPath();
                this.ctx.arc(98, 62, 9, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                this.ctx.strokeStyle = '#ff8da7';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(35, 120);
                this.ctx.lineTo(72, 120);
                this.ctx.lineTo(88, 104);
                this.ctx.lineTo(118, 104);
                this.ctx.stroke();

                this.ctx.fillStyle = '#25385e';
                this.ctx.beginPath();
                this.ctx.roundRect(78, 78, 62, 28, 10);
                this.ctx.fill();
                this.ctx.fillStyle = '#090b13';
                this.ctx.fillRect(139, 82, 6, 20);

                this.ctx.restore();

                if (this.state !== 'GAMEOVER') {
                    this.ctx.save();
                    this.ctx.translate(this.player.x, this.player.y);

                    this.ctx.shadowBlur = 18;
                    this.ctx.shadowColor = '#65e7ff';

                    const runnerBody = this.ctx.createLinearGradient(0, 0, this.player.w, this.player.h);
                    runnerBody.addColorStop(0, '#6ee7ff');
                    runnerBody.addColorStop(0.45, '#55b7ff');
                    runnerBody.addColorStop(1, '#8b5cf6');
                    this.ctx.fillStyle = runnerBody;

                    this.ctx.beginPath();
                    this.ctx.moveTo(10, 0);
                    this.ctx.quadraticCurveTo(this.player.w, 6, this.player.w - 2, 18);
                    this.ctx.lineTo(this.player.w - 8, this.player.h - 4);
                    this.ctx.lineTo(8, this.player.h);
                    this.ctx.quadraticCurveTo(-2, this.player.h * 0.55, 10, 0);
                    this.ctx.fill();

                    this.ctx.fillStyle = 'rgba(255,255,255,0.28)';
                    this.ctx.beginPath();
                    this.ctx.moveTo(12, 8);
                    this.ctx.lineTo(this.player.w - 10, 14);
                    this.ctx.lineTo(this.player.w - 14, 20);
                    this.ctx.lineTo(16, 16);
                    this.ctx.closePath();
                    this.ctx.fill();

                    this.ctx.fillStyle = '#fff';
                    this.ctx.beginPath();
                    this.ctx.roundRect(this.player.w - 17, 12, 13, 7, 3);
                    this.ctx.fill();

                    this.ctx.fillStyle = '#ff6bb5';
                    this.ctx.beginPath();
                    this.ctx.arc(13, this.player.h - 10, 5, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.restore();
                }

                this.rockets.forEach((r) => {
                    this.ctx.save();
                    this.ctx.translate(r.x, r.y);

                    this.ctx.shadowBlur = 12;
                    this.ctx.shadowColor = '#ff5c7c';

                    const rocketGrad = this.ctx.createLinearGradient(0, 0, r.w, r.h);
                    rocketGrad.addColorStop(0, '#fff1f2');
                    rocketGrad.addColorStop(1, '#ff9ab0');
                    this.ctx.fillStyle = rocketGrad;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(r.w, r.h / 2);
                    this.ctx.lineTo(0, r.h);
                    this.ctx.fill();

                    this.ctx.fillStyle = '#ff4f78';
                    this.ctx.beginPath();
                    this.ctx.arc(r.w / 2, r.h / 2, 4, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.restore();
                });

                this.particles.forEach((p) => {
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1.0;
            },

            loop: function() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        };

        window.onload = () => {
            Game.init();

            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const startScreen = document.getElementById('start-screen');
            const hud = document.getElementById('hud');
            const gameOverScreen = document.getElementById('game-over-screen');

            startBtn.addEventListener('click', () => {
                AudioSys.init();
                AudioSys.playSFX('start', { volume: 0.4, minGap: 180 });
                AudioSys.playBGM();

                startScreen.classList.add('hidden');
                hud.classList.remove('opacity-0');

                Game.reset();
            });

            restartBtn.addEventListener('click', () => {
                gameOverScreen.classList.add('hidden');
                hud.classList.remove('opacity-0');
                GifFX.hide('fail-gif');
                AudioSys.playSFX('start', { volume: 0.34, minGap: 180 });
                Game.reset();
            });
        };
    </script>
</body>
</html>
