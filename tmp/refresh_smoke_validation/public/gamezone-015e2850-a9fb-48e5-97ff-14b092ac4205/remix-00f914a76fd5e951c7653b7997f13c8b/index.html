	<style type="text/css">
		:root {
			--bg-deep: #190a33;
			--bg-top: #3b136b;
			--bg-bottom: #10051e;
			--panel: rgba(42, 12, 73, 0.76);
			--panel-strong: rgba(83, 19, 119, 0.88);
			--text: #fff8ff;
			--accent-cyan: #8cf8ff;
			--accent-pink: #ff74b7;
			--accent-gold: #ffd96f;
			--accent-purple: #c58dff;
			--shadow: rgba(8, 2, 18, 0.48);
		}

		* {
			padding: 0;
			margin: 0;
			box-sizing: border-box;
		}

		html, body {
			background:
				radial-gradient(circle at top, rgba(255, 132, 197, 0.28), transparent 28%),
				radial-gradient(circle at 20% 20%, rgba(140, 248, 255, 0.25), transparent 18%),
				linear-gradient(180deg, var(--bg-top) 0%, var(--bg-deep) 42%, var(--bg-bottom) 100%);
			color: var(--text);
			overflow: hidden;
			font-family: "Rajdhani", system-ui, sans-serif;
			min-height: 100%;
		}

		body {
			position: relative;
		}

		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}

		#c2canvasdiv {
			position: relative;
			width: 100vw;
			height: 100vh;
			z-index: 2;
		}

		#c2canvas {
			position: relative;
			z-index: 3;
			filter: drop-shadow(0 0 22px rgba(255, 116, 183, 0.25)) drop-shadow(0 0 36px rgba(140, 248, 255, 0.12));
		}

		.candy-sky,
		.candy-frame,
		.character-badge {
			pointer-events: none;
			user-select: none;
		}

		.candy-sky {
			position: fixed;
			inset: 0;
			overflow: hidden;
			z-index: 0;
		}

		.candy-sky__glow,
		.candy-sky__spark,
		.candy-sky__stripe {
			position: absolute;
			border-radius: 999px;
		}

		.candy-sky__glow {
			filter: blur(8px);
			opacity: 0.65;
			animation: floatGlow 8s ease-in-out infinite;
		}

		.candy-sky__glow--a {
			width: 28vmin;
			height: 28vmin;
			top: 10%;
			left: -6%;
			background: radial-gradient(circle, rgba(255, 116, 183, 0.88), rgba(255, 116, 183, 0));
		}

		.candy-sky__glow--b {
			width: 24vmin;
			height: 24vmin;
			top: 64%;
			right: -4%;
			background: radial-gradient(circle, rgba(140, 248, 255, 0.88), rgba(140, 248, 255, 0));
			animation-delay: -3s;
		}

		.candy-sky__glow--c {
			width: 18vmin;
			height: 18vmin;
			top: 28%;
			right: 20%;
			background: radial-gradient(circle, rgba(255, 217, 111, 0.7), rgba(255, 217, 111, 0));
			animation-delay: -1.5s;
		}

		.candy-sky__stripe {
			height: 2px;
			background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
			opacity: 0.35;
			transform: rotate(-12deg);
			animation: stripePulse 5s ease-in-out infinite;
		}

		.candy-sky__stripe--a {
			width: 42vmax;
			top: 18%;
			left: -10%;
		}

		.candy-sky__stripe--b {
			width: 34vmax;
			bottom: 21%;
			right: -8%;
			animation-delay: -2.6s;
		}

		.candy-sky__spark {
			width: 0.55rem;
			height: 0.55rem;
			background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.15));
			box-shadow: 0 0 12px rgba(255, 255, 255, 0.75);
			animation: sparkle 2.6s ease-in-out infinite;
		}

		.candy-sky__spark:nth-child(7) {
			top: 18%;
			left: 18%;
		}

		.candy-sky__spark:nth-child(8) {
			top: 30%;
			left: 78%;
			animation-delay: -0.9s;
		}

		.candy-sky__spark:nth-child(9) {
			top: 74%;
			left: 15%;
			animation-delay: -1.6s;
		}

		.candy-sky__spark:nth-child(10) {
			top: 62%;
			left: 68%;
			animation-delay: -0.35s;
		}

		.character-badge {
			position: fixed;
			top: max(10px, env(safe-area-inset-top));
			left: max(10px, env(safe-area-inset-left));
			z-index: 1;
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.5rem 0.75rem 0.5rem 0.55rem;
			border: 2px solid rgba(255, 255, 255, 0.14);
			border-radius: 999px;
			background: linear-gradient(135deg, rgba(255, 116, 183, 0.22), rgba(89, 35, 151, 0.74));
			backdrop-filter: blur(10px);
			box-shadow: 0 12px 28px var(--shadow);
			max-width: min(68vw, 250px);
		}

		.character-badge__avatar {
			position: relative;
			flex: 0 0 auto;
			width: 2.6rem;
			height: 2.6rem;
			border-radius: 50%;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at 32% 32%, #fff3a6, #ff93bf 55%, #a64fff 100%);
			box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), 0 0 18px rgba(255, 116, 183, 0.45);
			animation: mascotBounce 2.5s ease-in-out infinite;
			font-size: 1.35rem;
		}

		.character-badge__avatar::before,
		.character-badge__avatar::after {
			content: "";
			position: absolute;
			top: 0.62rem;
			width: 0.3rem;
			height: 0.3rem;
			background: #53276f;
			border-radius: 50%;
			box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
		}

		.character-badge__avatar::before {
			left: 0.72rem;
		}

		.character-badge__avatar::after {
			right: 0.72rem;
		}

		.character-badge__shine {
			position: absolute;
			top: 0.3rem;
			left: 0.45rem;
			width: 0.8rem;
			height: 0.35rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.5);
			transform: rotate(-22deg);
		}

		.character-badge__copy {
			min-width: 0;
		}

		.character-badge__title {
			display: block;
			font-family: "Bangers", "Trebuchet MS", sans-serif;
			font-size: clamp(1rem, 2.7vw, 1.25rem);
			letter-spacing: 0.06em;
			line-height: 1;
			color: #fff6fc;
			text-shadow: 0 2px 12px rgba(255, 116, 183, 0.45);
		}

		.character-badge__subtitle {
			display: flex;
			align-items: center;
			gap: 0.3rem;
			margin-top: 0.15rem;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.05em;
			color: rgba(255, 245, 252, 0.88);
			text-transform: uppercase;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.character-badge .material-symbols-rounded {
			font-size: 1rem;
			font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
		}

		.media-hud,
		.media-feedback {
			position: fixed;
			right: max(10px, env(safe-area-inset-right));
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 0.65rem;
			z-index: 5;
			pointer-events: none;
		}

		.media-hud {
			top: max(10px, env(safe-area-inset-top));
			max-width: min(42vw, 260px);
		}

		.media-chip,
		.media-feedback__card {
			border: 1px solid rgba(255, 255, 255, 0.14);
			background: rgba(27, 9, 48, 0.72);
			backdrop-filter: blur(10px);
			box-shadow: 0 12px 28px var(--shadow);
			color: var(--text);
		}

		.media-chip {
			display: inline-flex;
			align-items: center;
			gap: 0.45rem;
			padding: 0.55rem 0.8rem;
			border-radius: 999px;
			font: 700 0.72rem/1 "Rajdhani", system-ui, sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.media-chip .material-symbols-rounded {
			font-size: 1rem;
			color: var(--accent-gold);
		}

		.media-feedback {
			bottom: max(12px, calc(env(safe-area-inset-bottom) + 12px));
			max-width: min(46vw, 250px);
		}

		.media-feedback__card {
			width: 100%;
			padding: 0.55rem;
			border-radius: 1rem;
			overflow: hidden;
			opacity: 0;
			transform: translateY(18px) scale(0.96);
			transition: opacity 180ms ease, transform 180ms ease;
		}

		.media-feedback__card.is-active {
			opacity: 1;
			transform: translateY(0) scale(1);
		}

		.media-feedback__label {
			display: flex;
			align-items: center;
			gap: 0.35rem;
			margin-bottom: 0.45rem;
			font: 700 0.72rem/1 "Rajdhani", system-ui, sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: rgba(255, 248, 255, 0.92);
		}

		.media-feedback__gif {
			display: block;
			width: 100%;
			aspect-ratio: 1.2 / 1;
			object-fit: cover;
			border-radius: 0.75rem;
			background: rgba(255, 255, 255, 0.06);
		}

		.media-feedback__hint {
			margin-top: 0.45rem;
			font: 600 0.7rem/1.3 "Rajdhani", system-ui, sans-serif;
			color: rgba(255, 245, 252, 0.78);
		}

		.candy-frame {
			position: fixed;
			inset: 0;
			z-index: 4;
			border: 12px solid transparent;
			border-image: linear-gradient(135deg, rgba(255, 217, 111, 0.72), rgba(255, 116, 183, 0.75), rgba(140, 248, 255, 0.72)) 1;
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), inset 0 0 42px rgba(255, 255, 255, 0.04);
		}

		.candy-frame::before,
		.candy-frame::after {
			content: "";
			position: absolute;
			inset: 0.45rem;
			border-radius: 1.1rem;
			border: 1px solid rgba(255, 255, 255, 0.1);
		}

		.candy-frame::after {
			inset: auto 1rem 1rem 1rem;
			height: 0.45rem;
			border: none;
			border-radius: 999px;
			background: linear-gradient(90deg, rgba(255, 116, 183, 0.18), rgba(255, 217, 111, 0.25), rgba(140, 248, 255, 0.18));
			filter: blur(1px);
		}

		@media (max-width: 768px) {
			.candy-frame {
				border-width: 8px;
			}

			.character-badge {
				max-width: min(74vw, 225px);
				padding: 0.46rem 0.65rem 0.46rem 0.5rem;
			}

			.character-badge__avatar {
				width: 2.3rem;
				height: 2.3rem;
				font-size: 1.15rem;
			}

			.media-hud {
				top: auto;
				bottom: max(86px, calc(env(safe-area-inset-bottom) + 86px));
				max-width: min(58vw, 220px);
			}

			.media-feedback {
				max-width: min(44vw, 180px);
			}
		}

		@media (max-width: 480px) {
			.character-badge {
				top: max(8px, env(safe-area-inset-top));
				left: max(8px, env(safe-area-inset-left));
				gap: 0.45rem;
				max-width: min(76vw, 210px);
			}

			.character-badge__title {
				font-size: 0.92rem;
			}

			.character-badge__subtitle {
				font-size: 0.68rem;
			}

			.candy-frame {
				border-width: 6px;
			}

			.candy-frame::before {
				inset: 0.3rem;
				border-radius: 0.8rem;
			}

			.media-hud {
				right: max(8px, env(safe-area-inset-right));
				bottom: max(72px, calc(env(safe-area-inset-bottom) + 72px));
				max-width: min(60vw, 180px);
				gap: 0.45rem;
			}

			.media-chip {
				padding: 0.45rem 0.65rem;
				font-size: 0.64rem;
			}

			.media-feedback {
				right: max(8px, env(safe-area-inset-right));
				bottom: max(8px, calc(env(safe-area-inset-bottom) + 8px));
				max-width: min(42vw, 150px);
			}

			.media-feedback__card {
				padding: 0.42rem;
				border-radius: 0.8rem;
			}

			.media-feedback__label {
				font-size: 0.62rem;
			}

			.media-feedback__hint {
				font-size: 0.62rem;
			}
		}

		@keyframes sparkle {
			0%, 100% {
				transform: translateY(0) scale(0.85);
				opacity: 0.25;
			}
			50% {
				transform: translateY(-5px) scale(1.2);
				opacity: 1;
			}
		}

		@keyframes floatGlow {
			0%, 100% {
				transform: translateY(0) scale(1);
			}
			50% {
				transform: translateY(-12px) scale(1.08);
			}
		}

		@keyframes stripePulse {
			0%, 100% {
				opacity: 0.16;
				transform: rotate(-12deg) translateX(0);
			}
			50% {
				opacity: 0.4;
				transform: rotate(-12deg) translateX(12px);
			}
		}

		@keyframes mascotBounce {
			0%, 100% {
				transform: translateY(0) rotate(-6deg);
			}
			50% {
				transform: translateY(-3px) rotate(6deg);
			}
		}
    </style>

	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->

    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
		const ENABLE_ANIMATIONS = true;

		const MEDIA_MAP = {
			fonts: {
				title: "Bangers",
				ui: "Rajdhani"
			},
			audio: {
				bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
				collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
				combo: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
				blocked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
				success: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3"
			},
			gifs: {
				celebrate: {
					src: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
					alt: "Candy celebration reaction"
				},
				fail: {
					src: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp",
					alt: "Funny fail reaction"
				}
			}
		};

		function createMediaDirector() {
			const state = {
				unlocked: false,
				hidden: false,
				lastPointerAt: 0,
				lastComboAt: 0,
				lastCollectAt: 0,
				lastBlockedAt: 0,
				lastSuccessAt: 0,
				idleTimer: null,
				hideTimer: null
			};

			const statusText = document.getElementById("mediaStatusText");
			const eventText = document.getElementById("mediaEventText");
			const feedbackCard = document.getElementById("mediaFeedbackCard");
			const feedbackTitle = document.getElementById("mediaFeedbackTitle");
			const feedbackHint = document.getElementById("mediaFeedbackHint");
			const feedbackIcon = document.getElementById("mediaFeedbackIcon");
			const feedbackGif = document.getElementById("mediaFeedbackGif");

			const bgm = new Audio(MEDIA_MAP.audio.bgm);
			bgm.loop = true;
			bgm.preload = "none";
			bgm.volume = 0.2;

			const sfxPool = Object.fromEntries(
				Object.entries({
					collect: { src: MEDIA_MAP.audio.collect, volume: 0.34 },
					combo: { src: MEDIA_MAP.audio.combo, volume: 0.38 },
					blocked: { src: MEDIA_MAP.audio.blocked, volume: 0.28 },
					success: { src: MEDIA_MAP.audio.success, volume: 0.4 }
				}).map(([key, config]) => {
					const audio = new Audio(config.src);
					audio.preload = "auto";
					audio.volume = config.volume;
					return [key, audio];
				})
			);

			function updateStatus(text) {
				if (statusText) {
					statusText.textContent = text;
				}
			}

			function updateEvent(text) {
				if (eventText) {
					eventText.textContent = text;
				}
			}

			function unlockAudio() {
				if (state.unlocked) {
					return;
				}

				state.unlocked = true;
				updateStatus("arcade ambience online");

				const bgmPromise = bgm.play();
				if (bgmPromise && typeof bgmPromise.catch === "function") {
					bgmPromise.catch(function () {
						updateStatus("audio ready after next tap");
						state.unlocked = false;
					});
				}

				playSfx("success");
			}

			function playSfx(name) {
				const audio = sfxPool[name];
				if (!audio || !state.unlocked) {
					return;
				}

				try {
					audio.currentTime = 0;
					const playPromise = audio.play();
					if (playPromise && typeof playPromise.catch === "function") {
						playPromise.catch(function () {});
					}
				} catch (err) {}
			}

			function showFeedback(kind, title, hint) {
				const gif = MEDIA_MAP.gifs[kind] || MEDIA_MAP.gifs.celebrate;
				if (feedbackGif) {
					feedbackGif.src = gif.src;
					feedbackGif.alt = gif.alt;
				}
				if (feedbackTitle) {
					feedbackTitle.textContent = title;
				}
				if (feedbackHint) {
					feedbackHint.textContent = hint;
				}
				if (feedbackIcon) {
					feedbackIcon.textContent = kind === "fail" ? "sentiment_dissatisfied" : "celebration";
				}
				if (feedbackCard) {
					feedbackCard.classList.add("is-active");
				}

				window.clearTimeout(state.hideTimer);
				state.hideTimer = window.setTimeout(function () {
					if (feedbackCard) {
						feedbackCard.classList.remove("is-active");
					}
				}, 2200);
			}

			function onBoardAction() {
				state.lastPointerAt = Date.now();

				if (!state.unlocked) {
					unlockAudio();
				}

				window.clearTimeout(state.idleTimer);
				state.idleTimer = window.setTimeout(function () {
					const now = Date.now();
					if (now - state.lastPointerAt > 1800) {
						state.lastBlockedAt = now;
						updateEvent("shuffle stalled — try a new candy lane");
						playSfx("blocked");
						showFeedback("fail", "board jam", "No blocker overlay on the grid — the reaction pops beside it instead.");
					}
				}, 2200);
			}

			function onCombo() {
				const now = Date.now();
				if (now - state.lastComboAt < 1800) {
					return;
				}
				state.lastComboAt = now;
				updateEvent("sweet chain landed");
				playSfx("combo");
				showFeedback("celebrate", "sugar rush", "Combo pop mapped from the approved reaction catalog.");
			}

			function onCollect() {
				const now = Date.now();
				if (now - state.lastCollectAt < 650) {
					return;
				}
				state.lastCollectAt = now;
				updateEvent("candies collected");
				playSfx("collect");
			}

			function onVisibilityChange(hidden) {
				state.hidden = hidden;
				if (hidden) {
					if (!bgm.paused) {
						bgm.pause();
					}
					updateStatus("arcade ambience paused");
				} else if (state.unlocked) {
					const resumePromise = bgm.play();
					if (resumePromise && typeof resumePromise.catch === "function") {
						resumePromise.catch(function () {});
					}
					updateStatus("arcade ambience online");
				}
			}

			document.addEventListener("pointerdown", onBoardAction, { passive: true });
			document.addEventListener("keydown", unlockAudio, { once: true });
			document.addEventListener("pointerdown", unlockAudio, { once: true, passive: true });

			document.addEventListener("pointerup", function () {
				const now = Date.now();
				if (now - state.lastPointerAt < 420) {
					onCollect();
				}
			}, { passive: true });

			document.addEventListener("click", function () {
				const now = Date.now();
				if (now - state.lastSuccessAt > 3200) {
					state.lastSuccessAt = now;
					onCombo();
				}
			}, { passive: true });

			return {
				onVisibilityChange
			};
		}

		const mediaDirector = createMediaDirector();

		// Size the canvas to fill the browser viewport.
		jQuery(window).resize(function() {
			cr_sizeCanvas(jQuery(window).width(), jQuery(window).height());
		});
		
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			cr_createRuntime("c2canvas");

			if (!ENABLE_ANIMATIONS) {
				jQuery(".candy-sky__glow, .candy-sky__spark, .character-badge__avatar, .candy-sky__stripe").css("animation", "none");
			}
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			const hidden = document.hidden || document.mozHidden || document.webkitHidden || document.msHidden;
			mediaDirector.onVisibilityChange(hidden);

			if (hidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
    </script>

<script id="__ios_canvas_guard_js__">
(function () {
    const prevent = e => e.preventDefault();
    const canvas = document.getElementById("c2canvas");

    if (!canvas) {
        return;
    }

    ["touchstart", "touchmove", "touchend", "contextmenu"].forEach(type => {
        canvas.addEventListener(type, prevent, { passive: false });
    });

    ["gesturestart", "gesturechange", "gestureend"].forEach(type => {
        canvas.addEventListener(type, prevent, { passive: false });
    });
})();
</script>
