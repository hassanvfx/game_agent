<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Midnight Broadcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage4] remap: title/display -> Audiowide, ui/body -> Exo 2 from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap">
    <style>
        :root {
            --signal-cyan: #7cf5ff;
            --broadcast-violet: #8a4dff;
            --hazard-pink: #ff4f9f;
            --deep-space: #070312;

            margin: 0;

                radial-gradient(circle at top, #1d1036 0%, #090511 42%, #020106 100%);

        .left-0 {

        .justify-between {

        .items-start {

        @keyframes pulse {

        /* CRT / VHS Overlay Effects */
        .crt-lines {
            position: absolute;

            z-index: 20;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),

                radial-gradient(circle at center, rgba(124, 245, 255, 0.02) 0%, rgba(0, 0, 0, 0) 40%, rgba(2, 1, 8, 0.86) 100%),
                radial-gradient(circle at bottom, rgba(138, 77, 255, 0.18), rgba(0, 0, 0, 0) 40%);

        /* UI Styling */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(20, 16, 44, 0.92), rgba(8, 8, 22, 0.95)),
                var(--panel-ink);
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 0 28px rgba(124, 245, 255, 0.18),

            color: var(--hazard-pink);
            text-shadow: 0 0 10px rgba(255, 79, 159, 0.8), 3px 0 0 rgba(124, 245, 255, 0.35);

        @keyframes pulse-signal {
            0%, 100% { box-shadow: 0 0 18px rgba(124, 245, 255, 0.45); }
            50% { box-shadow: 0 0 34px rgba(138, 77, 255, 0.55); }
        }

        .btn-start {
            background: linear-gradient(180deg, rgba(124, 245, 255, 0.2) 0%, rgba(138, 77, 255, 0.24) 100%);
            border: 2px solid var(--panel-border);
            color: white;
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            animation: pulse-signal 2s infinite;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.08);
            touch-action: manipulation;
        }

        .btn-start:active {
            transform: scale(0.95);
            background: linear-gradient(180deg, rgba(255, 79, 159, 0.35), rgba(138, 77, 255, 0.5));
        }

        #glitch-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
            display: none;
            mix-blend-mode: screen;
        }

        #hud {
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        .signal-shell {
            width: min(12rem, 44vw);
            height: 1.5rem;
            background: rgba(4, 4, 10, 0.88);
            border: 1px solid rgba(124, 245, 255, 0.35);
            position: relative;
            margin-top: 0.25rem;
            overflow: hidden;
            border-radius: 999px;
            box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.8), 0 0 12px rgba(124, 245, 255, 0.18);
        }

        .signal-shell::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .signal-chip {
            display: inline-block;
            margin-bottom: 0.25rem;
            padding: 0.35rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(124, 245, 255, 0.3);
            background: rgba(12, 16, 36, 0.72);
            box-shadow: 0 0 12px rgba(124, 245, 255, 0.12);
        }

        .signal-status {
            color: #ff9fc6;
            text-shadow: 0 0 10px rgba(255, 79, 159, 0.35);
        }
    </style>

<body>

<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>

    <div class="crt-lines"></div>
    <div class="vignette"></div>
    <div id="glitch-layer"></div>

    <div id="signal-gif-wrap" class="absolute left-0 bottom-20 w-full pointer-events-none z-30 flex justify-center hidden" aria-hidden="true">
        <img id="signal-gif" alt="" style="max-width: min(9rem, 30vw); border-radius: 12px; border: 2px solid rgba(124, 245, 255, 0.35); box-shadow: 0 0 18px rgba(124, 245, 255, 0.28); opacity: 0; transform: translateY(8px) scale(0.92); transition: opacity 180ms ease, transform 180ms ease;" />
    </div>

    <div id="hud" class="absolute top-0 left-0 w-full p-4 z-30 hidden flex justify-between items-start pointer-events-none">
        <div class="flex flex-col">
            <span class="text-white text-xl tracking-widest opacity-70 font-ui-title signal-chip">SIGNAL</span>
            <div class="signal-shell">
                <div id="signal-bar" style="height: 100%; background: linear-gradient(90deg, #7cf5ff, #8a4dff 70%, #ff4f9f); box-shadow: 0 0 14px rgba(124, 245, 255, 0.7); transition: all 200ms; width: 100%; border-radius: 999px;"></div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-[#ffd700] text-3xl font-ui-title" style="filter: drop-shadow(0 0 8px rgba(124, 245, 255, 0.45));" id="timer">00:00</div>
            <div class="text-xs tracking-widest animate-pulse font-body signal-status">LIVE FEED</div>
        </div>
    </div>

    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90">
        <div class="glass-panel p-8 flex flex-col items-center max-w-sm text-center mx-4">
            <h1 class="text-6xl text-[#f05] font-display mb-2 neon-text tracking-widest">MIDNIGHT</h1>
            <h2 class="text-4xl text-white font-ui-title mb-6 tracking-widest">BROADCAST</h2>
            <p class="text-gray-300 font-body text-xl mb-8 leading-tight">
                Stay inside the engineer's glow.<br>
                The roaming dead zone is hunting your feed.<br>
                Keep the signal alive as long as you can.
            </p>
            <button id="start-btn" class="btn-start" style="padding: 1rem 2.5rem; font-size: 1.5rem; border-radius: 0.25rem; width: 100%;">GO LIVE</button>
        </div>
    </div>

    <div id="game-over-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/95">
        <h1 class="text-7xl text-red-600 font-display mb-4 glitch-text text-center">FEED DOWN</h1>
        <p class="text-white font-body text-2xl mb-8">Broadcast held for: <span id="final-time" class="text-[#ffd700]">0s</span></p>
        <button id="restart-btn" class="btn-start" style="padding: 0.75rem 2rem; font-size: 1.25rem; border-radius: 0.25rem;">RUN IT BACK</button>
    </div>

    <div id="joystick-hint" class="absolute bottom-20 w-full text-center text-white/30 text-sm font-body pointer-events-none z-30 animate-pulse">
        DRAG TO MOVE
    </div>
</div>

<!-- [agent-note][stage1] role: future-audio | trigger: dead-zone-spawn | intent: emphasize incoming threat -->
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" loop preload="auto"></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
<audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
<audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>

<script>
/*
 * MIDNIGHT BROADCAST
 * Survive by staying near the engineer and avoiding the dead zone.
 */

// --- CONFIG ---
const CONFIG = {
    heroSpeed: 220,
    angelSpeed: 190,
    demonSpeed: 260,
    sanityDrainDark: 8,
    sanityRegenLight: 15,
    lightRadius: 180,
    demonSpawnRate: 10
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    started: false,
    bgm: document.getElementById('bgm'),
    sfxWarning: document.getElementById('sfx_warning'),
    sfxHit: document.getElementById('sfx_hit'),
    sfxFail: document.getElementById('sfx_fail'),
    sfxStart: document.getElementById('sfx_start'),

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    },

    unlockAndStart() {
        this.init();
        if (!this.ctx) return;
        this.ctx.resume().catch(() => {});
        if (!this.started) {
            this.started = true;
            this.bgm.volume = 0.2;
            this.bgm.currentTime = 0;
        }
        this.bgm.play().catch(() => {});
    },

    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    },

    playElement(el, volume = 0.5, restartThreshold = 0.08) {
        if (!el) return;
        try {
            if (el.currentTime < restartThreshold || el.paused || el.ended) {
                el.currentTime = 0;
            }
            el.volume = volume;
            el.play().catch(() => {});
        } catch (_) {}
    },

    playStart() {
        this.playElement(this.sfxStart, 0.52);
    },

    playWarning() {
        this.playElement(this.sfxWarning, 0.42);
    },

    playHit() {
        this.playElement(this.sfxHit, 0.58);
    },

    playFail() {
        this.playElement(this.sfxFail, 0.6);
    }
};

// --- INPUT SYSTEM (Virtual Joystick) ---
const Input = {
    x: 0, y: 0, active: false,
    originX: 0, originY: 0,
    initialized: false,

    init(canvas) {
        if (this.initialized) return;
        this.initialized = true;

        const handleStart = (e) => {
            if (!Game.isPlaying) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            this.active = true;
            this.originX = touch.clientX;
            this.originY = touch.clientY;
            this.x = 0;
            this.y = 0;
            document.getElementById('joystick-hint').style.opacity = '0';
        };

        const handleMove = (e) => {
            if (!this.active || !Game.isPlaying) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - this.originX;
            const dy = touch.clientY - this.originY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 60;

            const clamp = Math.min(dist, maxDist);
            if (dist > 0) {
                this.x = (dx / dist) * (clamp / maxDist);
                this.y = (dy / dist) * (clamp / maxDist);
            }
        };

        const handleEnd = (e) => {
            if (!this.active) return;
            e.preventDefault();
            this.active = false;
            this.x = 0;
            this.y = 0;
        };

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // [agent-note][stage4] repaired: mobile-tap-risk | scope: gameplay canvas only | action: avoid blocking menu CTA tap lifecycle
        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleEnd, { passive: false });
    }
};

// --- GAME STATE ---
const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d', { alpha: false }),

    width: 0, height: 0,
    lastTime: 0,
    isPlaying: false,

    camera: { x: 0, y: 0 },

    hero: { x: 0, y: 0, angle: 0 },
    angel: { x: 0, y: 0, legs: [] },
    demon: { x: -9999, y: -9999, active: false, cooldown: 0, state: 'idle' },

    sanity: 100,
    timeSurvived: 0,
    difficultyMultiplier: 1,

    particles: [],
    glitchIntensity: 0,
    lowSignalActive: false,
    lastWarningLevel: 100,
    gifTimeout: null,

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    },

    start() {
        this.resize();
        this.hero = { x: 0, y: 0, angle: 0 };
        this.angel = { x: -50, y: 0, legs: Array(8).fill(0).map(() => ({ x: 0, y: 0 })) };
        this.demon = { x: -9999, y: -9999, active: false, cooldown: 5, state: 'idle' };
        this.sanity = 100;
        this.timeSurvived = 0;
        this.particles = [];
        this.isPlaying = true;
        this.lowSignalActive = false;
        this.lastWarningLevel = 100;
        this.lastTime = performance.now();

        Input.init(this.canvas);
        AudioSys.unlockAndStart();
        AudioSys.playStart();

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('hud').classList.add('flex');

        requestAnimationFrame((t) => this.loop(t));
    },

    gameOver() {
        this.isPlaying = false;
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-time').innerText = Math.floor(this.timeSurvived) + "s";
        AudioSys.playFail();
        AudioSys.stopLoop();
        this.showReactionGif('https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp', 2200);
    },

    spawnParticle(x, y, color, type) {
        this.particles.push({
            x, y, color, type,
            vx: (Math.random() - 0.5) * 100,
            vy: (Math.random() - 0.5) * 100,
            life: 1.0,
            size: Math.random() * 4 + 2
        });
    },

    showReactionGif(src, duration = 1200) {
        const wrap = document.getElementById('signal-gif-wrap');
        const img = document.getElementById('signal-gif');
        if (!wrap || !img) return;
        clearTimeout(this.gifTimeout);
        img.src = src;
        wrap.classList.remove('hidden');
        requestAnimationFrame(() => {
            img.style.opacity = '0.95';
            img.style.transform = 'translateY(0) scale(1)';
        });
        this.gifTimeout = setTimeout(() => {
            img.style.opacity = '0';
            img.style.transform = 'translateY(8px) scale(0.92)';
            setTimeout(() => wrap.classList.add('hidden'), 180);
        }, duration);
    },

    update(dt) {
        this.timeSurvived += dt;
        this.difficultyMultiplier = 1 + (this.timeSurvived / 60);

        const speed = CONFIG.heroSpeed * dt;
        this.hero.x += Input.x * speed;
        this.hero.y += Input.y * speed;

        if (Math.abs(Input.x) > 0.1 || Math.abs(Input.y) > 0.1) {
            this.hero.angle = Math.atan2(Input.y, Input.x);
        }

        this.camera.x += (this.hero.x - this.width / 2 - this.camera.x) * 0.1;
        this.camera.y += (this.hero.y - this.height / 2 - this.camera.y) * 0.1;

        const dx = this.hero.x - this.angel.x;
        const dy = this.hero.y - this.angel.y;
        const distToHero = Math.sqrt(dx * dx + dy * dy);
        const stopDist = 70;

        if (distToHero > stopDist) {
            const moveX = (dx / distToHero);
            const moveY = (dy / distToHero);
            this.angel.x += moveX * CONFIG.angelSpeed * dt;
            this.angel.y += moveY * CONFIG.angelSpeed * dt;
        }

        if (distToHero < CONFIG.lightRadius * 0.8) {
            this.sanity = Math.min(100, this.sanity + CONFIG.sanityRegenLight * dt);
        } else {
            this.sanity = Math.max(0, this.sanity - CONFIG.sanityDrainDark * dt);
        }

        if (this.sanity <= 0) this.gameOver();

        if (this.sanity <= 35 && !this.lowSignalActive) {
            this.lowSignalActive = true;
            AudioSys.playWarning();
        } else if (this.sanity > 42) {
            this.lowSignalActive = false;
        }

        document.getElementById('signal-bar').style.width = this.sanity + '%';
        document.getElementById('signal-bar').style.opacity = (this.sanity / 100) * 0.8 + 0.2;
        document.getElementById('timer').innerText = new Date(this.timeSurvived * 1000).toISOString().substr(14, 5);

        if (this.demon.active) {
            this.demon.cooldown -= dt;

            const ddx = this.hero.x - this.demon.x;
            const ddy = this.hero.y - this.demon.y;
            const dDist = Math.sqrt(ddx * ddx + ddy * ddy);

            this.demon.x += (ddx / dDist) * CONFIG.demonSpeed * dt * this.difficultyMultiplier;
            this.demon.y += (ddy / dDist) * CONFIG.demonSpeed * dt * this.difficultyMultiplier;

            this.glitchIntensity = Math.max(0, 1 - (dDist / 400));

            if (dDist < 40) {
                this.sanity -= 40;
                this.demon.active = false;
                this.demon.cooldown = CONFIG.demonSpawnRate / this.difficultyMultiplier;
                this.spawnParticle(this.hero.x, this.hero.y, '#f00', 'blood');
                AudioSys.playHit();
                this.glitchIntensity = 1.0;
                this.showReactionGif('https://i.giphy.com/roB5nN2qNNfhUKcprN.webp', 950);
            }

            if (this.demon.cooldown <= 0) {
                this.demon.active = false;
                this.demon.cooldown = 5 + Math.random() * 5;
            }
        } else {
            this.demon.cooldown -= dt;
            this.glitchIntensity *= 0.9;

            if (this.demon.cooldown <= 0) {
                const angle = Math.random() * Math.PI * 2;
                const r = 500;
                this.demon.x = this.hero.x + Math.cos(angle) * r;
                this.demon.y = this.hero.y + Math.sin(angle) * r;
                this.demon.active = true;
                this.demon.cooldown = 8;
                AudioSys.playWarning();
            }
        }

        this.particles.forEach((p) => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
        });
        this.particles = this.particles.filter((p) => p.life > 0);

        const glitchEl = document.getElementById('glitch-layer');
        if (this.glitchIntensity > 0.1) {
            glitchEl.style.display = 'block';
            glitchEl.style.background = `rgba(255, 0, 0, ${this.glitchIntensity * 0.3})`;
            glitchEl.style.transform = `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px)`;
        } else {
            glitchEl.style.display = 'none';
        }
    },

    draw() {
        const { ctx, width, height, camera } = this;

        const skyGlow = ctx.createLinearGradient(0, 0, 0, height);
        skyGlow.addColorStop(0, '#1b1238');
        skyGlow.addColorStop(0.48, '#090511');
        skyGlow.addColorStop(1, '#020106');
        ctx.fillStyle = skyGlow;
        ctx.fillRect(0, 0, width, height);

        ctx.save();

        if (this.glitchIntensity > 0.2) {
            const shake = this.glitchIntensity * 20;
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        ctx.translate(-camera.x, -camera.y);

        const tileSize = 200;
        const startCol = Math.floor(camera.x / tileSize);
        const endCol = startCol + (width / tileSize) + 1;
        const startRow = Math.floor(camera.y / tileSize);
        const endRow = startRow + (height / tileSize) + 1;

        for (let c = startCol; c <= endCol; c++) {
            for (let r = startRow; r <= endRow; r++) {
                const x = c * tileSize;
                const y = r * tileSize;

                ctx.fillStyle = ((c + r) % 2 === 0) ? '#130d28' : '#0b0819';
                ctx.fillRect(x, y, tileSize, tileSize);

                ctx.strokeStyle = 'rgba(124, 245, 255, 0.16)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + tileSize);
                ctx.quadraticCurveTo(x + tileSize / 2, y, x + tileSize, y + tileSize);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(138, 77, 255, 0.12)';
                ctx.beginPath();
                ctx.moveTo(x, y + tileSize * 0.2);
                ctx.lineTo(x + tileSize, y + tileSize * 0.2);
                ctx.stroke();

                if ((c * r) % 7 === 0) {
                    ctx.fillStyle = '#1d1036';
                    ctx.beginPath();
                    ctx.ellipse(x + tileSize / 2, y + tileSize / 2, 20, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#7cf5ff';
                    ctx.beginPath();
                    ctx.arc(x + tileSize / 2, y + tileSize / 2, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        [this.hero, this.angel, this.demon].forEach((e) => {
            if (e === this.demon && !e.active) return;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y + 10, 20, 10, 0, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.save();
        ctx.translate(this.angel.x, this.angel.y);
        ctx.strokeStyle = '#c3faff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        const time = performance.now() / 100;
        for (let i = 0; i < 6; i++) {
            const side = i < 3 ? -1 : 1;
            const offset = (i % 3) * 20;
            const legMove = Math.sin(time + i) * 5;
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(side * 20, -10, side * (30 + legMove), offset - 20);
            ctx.stroke();
        }
        ctx.shadowColor = 'rgba(124, 245, 255, 0.5)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#f7f9ff';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7cf5ff';
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f7f9ff';
        ctx.beginPath();
        ctx.arc(0, -5, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8a4dff';
        ctx.beginPath();
        ctx.arc(-4, -5, 2, 0, Math.PI * 2);
        ctx.arc(4, -5, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff4f9f';
        ctx.beginPath();
        ctx.arc(0, 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(this.hero.x, this.hero.y);
        ctx.rotate(this.hero.angle + Math.PI / 2);
        ctx.shadowColor = 'rgba(255, 79, 159, 0.5)';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#2a1b58';
        ctx.beginPath();
        ctx.roundRect(-13, -11, 26, 22, 8);
        ctx.fill();
        ctx.fillStyle = '#101429';
        ctx.beginPath();
        ctx.roundRect(-8, -16, 16, 12, 6);
        ctx.fill();
        ctx.fillStyle = '#f7f9ff';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7cf5ff';
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI, true);
        ctx.fill();
        ctx.fillStyle = '#ff4f9f';
        ctx.beginPath();
        ctx.arc(0, -2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (this.demon.active) {
            ctx.save();
            ctx.translate(this.demon.x, this.demon.y);
            ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);

            ctx.shadowColor = '#ff4f9f';
            ctx.shadowBlur = 24;

            ctx.fillStyle = '#16051f';
            ctx.beginPath();
            ctx.moveTo(0, -34);
            ctx.lineTo(-18, 22);
            ctx.lineTo(18, 22);
            ctx.fill();

            ctx.fillStyle = '#6d133f';
            ctx.beginPath();
            ctx.arc(0, -10, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, -20); ctx.lineTo(-15, -40); ctx.lineTo(-5, -35);
            ctx.moveTo(5, -20); ctx.lineTo(15, -40); ctx.lineTo(5, -35);
            ctx.stroke();

            ctx.fillStyle = '#7cf5ff';
            ctx.beginPath();
            ctx.arc(0, -5, 10, 0, Math.PI, false);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-10, -5); ctx.lineTo(10, -5);
            for (let i = -8; i < 10; i += 4) {
                ctx.moveTo(i, -5); ctx.lineTo(i, 5);
            }
            ctx.stroke();

            ctx.fillStyle = '#ff4f9f';
            ctx.beginPath();
            ctx.arc(-6, -12, 4, 0, Math.PI * 2);
            ctx.arc(6, -12, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(124,245,255,0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -10, 30 + Math.sin(time * 2) * 5, -Math.PI / 2, Math.PI / 2);
            ctx.arc(0, -10, 30 + Math.sin(time * 2) * 5, Math.PI / 2, -Math.PI / 2);
            ctx.stroke();

            ctx.restore();
        }

        this.particles.forEach((p) => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();

        const heroScreenX = this.hero.x - camera.x;
        const heroScreenY = this.hero.y - camera.y;
        const angelScreenX = this.angel.x - camera.x;
        const angelScreenY = this.angel.y - camera.y;

        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = '#444';
        ctx.fillRect(0, 0, width, height);

        const drawLight = (x, y, r, color) => {
            const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
            g.addColorStop(0, color);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle = g;
            ctx.fillRect(x - r, y - r, r * 2, r * 2);
        };

        ctx.globalCompositeOperation = 'screen';
        drawLight(heroScreenX, heroScreenY, 200, '#5a46aa');
        drawLight(angelScreenX, angelScreenY, CONFIG.lightRadius, '#7cf5ff');

        if (this.demon.active) {
            const demonScreenX = this.demon.x - camera.x;
            const demonScreenY = this.demon.y - camera.y;
            drawLight(demonScreenX, demonScreenY, 250, '#ff4f9f');
        }

        ctx.globalCompositeOperation = 'source-over';
    },

    loop(now) {
        if (!this.isPlaying) return;
        const dt = Math.min((now - this.lastTime) / 1000, 0.1);
        this.lastTime = now;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
    }
};

window.addEventListener('resize', () => Game.resize());
window.addEventListener('load', () => Game.resize());

document.getElementById('start-btn').addEventListener('click', () => Game.start());
document.getElementById('restart-btn').addEventListener('click', () => Game.start());
</script>
</body>
