<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meme Button Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #14081f;
            --bg-bottom: #2f1a53;
            --hud-border: #20143a;
            --hud-shadow: rgba(15, 6, 31, 0.42);
            --hud-text: #fff7ff;
            --panel-glow: rgba(255, 88, 171, 0.24);
            --accent-cyan: #82f7ff;
            --accent-pink: #ff58ab;
            --accent-gold: #ffe27a;
            --accent-violet: #a28fff;
            --card-face: #ffd34d;
            --card-highlight: #fff0a7;
            --card-shadow: #180924;
            --card-ink: #22113c;
            --chip: #ffeff9;
            --chip-line: rgba(34, 17, 60, 0.35);
            --particle-outline: #2a1646;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #4a2a74 0%, var(--bg-top) 42%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            font-family: 'Orbitron', 'Trebuchet MS', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 18% 20%, rgba(130, 247, 255, 0.18), transparent 20%),
                radial-gradient(circle at 82% 18%, rgba(255, 88, 171, 0.16), transparent 22%),
                radial-gradient(circle at 50% 78%, rgba(162, 143, 255, 0.15), transparent 24%);
            z-index: 0;
        }

        body::after {
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: 0.18;
            mix-blend-mode: screen;
            z-index: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        #game-container::before {
            inset: auto auto 10% -12%;
            width: 48vw;
            height: 48vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(130, 247, 255, 0.18) 0%, transparent 70%);
        }

        #game-container::after {
            inset: 8% -10% auto auto;
            width: 38vw;
            height: 38vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 88, 171, 0.16) 0%, transparent 72%);
        }

        canvas {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: max(1rem, env(safe-area-inset-top, 0px) + 0.9rem);
            pointer-events: none;
        }

        #feedback-layer {
            position: absolute;
            inset: auto 0 max(1rem, env(safe-area-inset-bottom, 0px) + 0.85rem) 0;
            z-index: 55;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .feedback-stack {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(0.55rem, 2vw, 1rem);
            width: min(92vw, 520px);
        }

        .feedback-card {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            min-height: 78px;
            padding: 0.6rem 0.8rem;
            border: 3px solid rgba(32, 20, 58, 0.92);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05)),
                linear-gradient(180deg, rgba(44, 21, 73, 0.92), rgba(21, 10, 39, 0.96));
            box-shadow:
                0 10px 22px rgba(15, 6, 31, 0.34),
                0 0 16px rgba(130, 247, 255, 0.15);
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            transition: opacity 180ms ease, transform 180ms ease, box-shadow 180ms ease;
            overflow: hidden;
            flex: 1;
            max-width: 250px;
        }

        .feedback-card.is-active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .feedback-card--celebrate.is-active {
            box-shadow:
                0 10px 22px rgba(15, 6, 31, 0.34),
                0 0 18px rgba(255, 226, 122, 0.34);
        }

        .feedback-card--streak.is-active {
            box-shadow:
                0 10px 22px rgba(15, 6, 31, 0.34),
                0 0 18px rgba(255, 88, 171, 0.32);
        }

        .feedback-card img {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.2);
            flex: 0 0 auto;
        }

        .feedback-copy {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }

        .feedback-label {
            font-family: 'Orbitron', 'Trebuchet MS', sans-serif;
            font-size: clamp(11px, 2.2vw, 14px);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent-cyan);
        }

        .feedback-text {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: clamp(8px, 1.9vw, 10px);
            line-height: 1.55;
            color: #fff7ff;
            word-break: break-word;
        }

        #hud {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: min(92vw, 620px);
        }

        .hud-panel {
            color: var(--hud-text);
            font-size: clamp(12px, 1.65vw, 16px);
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border: 3px solid var(--hud-border);
            border-radius: 16px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)),
                linear-gradient(180deg, rgba(51, 24, 86, 0.9), rgba(25, 12, 47, 0.96));
            padding: 0.75rem 0.95rem;
            box-shadow:
                0 10px 24px var(--hud-shadow),
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 0 18px var(--panel-glow);
            text-align: center;
            max-width: min(92vw, 620px);
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
        }

        .hud-panel--score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
        }

        .hud-panel--score .score-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.3em;
            padding: 0.25rem 0.55rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--accent-gold), #ffad33);
            color: #291239;
            box-shadow: 0 0 12px rgba(255, 226, 122, 0.45);
        }

        .hud-panel--compact {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: clamp(15px, 3.5vw, 20px);
            letter-spacing: 0.06em;
            color: #fff3bd;
            text-shadow: 0 2px 0 rgba(34, 17, 60, 0.4);
            padding: 0.7rem 0.95rem;
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding-top: max(0.8rem, env(safe-area-inset-top, 0px) + 0.55rem);
            }

            #hud {
                gap: 0.5rem;
                width: min(94vw, 620px);
            }

            .hud-panel {
                border-radius: 14px;
                padding: 0.68rem 0.82rem;
                font-size: 12px;
            }

            .hud-panel--compact {
                font-size: 11px;
            }

            #feedback-layer {
                inset: auto 0 max(0.65rem, env(safe-area-inset-bottom, 0px) + 0.55rem) 0;
            }

            .feedback-stack {
                width: min(94vw, 520px);
                gap: 0.45rem;
            }

            .feedback-card {
                min-height: 68px;
                padding: 0.45rem 0.55rem;
                max-width: 46vw;
            }

            .feedback-card img {
                width: 52px;
                height: 52px;
            }

            .feedback-text {
                font-size: 7px;
                line-height: 1.5;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "cardColor": { "type": "color", "label": "Card Color", "value": "#FFD700" },
        "bgColor": { "type": "color", "label": "Background Color", "value": "#E5E5E5" }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
                <!-- [agent-note][stage4] repaired: mobile-input-risk | action: removed global touch suppression and kept gesture capture on canvas -->
                <!-- [agent-note][stage4] resolved-font: title/ui -> Orbitron + Press Start 2P from catalogs/fonts.json -->
                <div class="hud-panel hud-panel--score">
                    Meme Taps: <span class="score-badge" id="score-display">0</span>
                </div>
                <div class="hud-panel hud-panel--compact">
                    Smash the hype card to farm instant reactions.
                </div>
            </div>
        </div>
        <div id="feedback-layer" aria-hidden="true">
            <div class="feedback-stack">
                <!-- [agent-note][stage3] resolved-gif: celebrate/streak overlays -> catalogs/gifs.json -->
                <div class="feedback-card feedback-card--celebrate" id="celebrate-card">
                    <img id="celebrate-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="">
                    <div class="feedback-copy">
                        <span class="feedback-label">Meme Drop</span>
                        <span class="feedback-text" id="celebrate-text">Hype chain booting...</span>
                    </div>
                </div>
                <div class="feedback-card feedback-card--streak" id="streak-card">
                    <img id="streak-gif" src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp" alt="">
                    <div class="feedback-copy">
                        <span class="feedback-label">Impact Cam</span>
                        <span class="feedback-text" id="streak-text">Tap streak warming up...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assets -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="none" loop></audio>
    <audio id="sfx_tap" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="none"></audio>
    <audio id="sfx_bonus" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="none"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="none"></audio>
    <audio id="sfx_streak" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="none"></audio>

    <script>
        // --- System & Config ---
        let gameConfig = {
            cardColor: '#FFD700',
            bgColor: '#E5E5E5'
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const dpr = window.devicePixelRatio || 1;

        let cw = 0, ch = 0;
        let initialized = false;
        let gameState = 'PLAYING';
        let lastTime = performance.now();

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const sfx = {
            tap: document.getElementById('sfx_tap'),
            bonus: document.getElementById('sfx_bonus'),
            ui: document.getElementById('sfx_ui'),
            streak: document.getElementById('sfx_streak')
        };
        const sfxCooldowns = new Map();
        const BGM_VOLUME = 0.2;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                audioCtx = new AudioContext();
            }
        }

        function syncLoopState() {
            if (!bgm) return;
            if (gameState === 'PLAYING' && audioUnlocked) {
                bgm.volume = BGM_VOLUME;
                bgm.play().catch(() => {});
            } else {
                bgm.pause();
                bgm.currentTime = 0;
            }
        }

        function primeAudioElement(el, volume) {
            if (!el) return;
            el.volume = volume;
            try {
                el.load();
            } catch (e) {}
        }

        function playSfx(name, cooldown = 0) {
            const el = sfx[name];
            if (!audioUnlocked || !el) return;
            const now = performance.now();
            const last = sfxCooldowns.get(name) || 0;
            if (cooldown && now - last < cooldown) return;
            sfxCooldowns.set(name, now);
            try {
                el.pause();
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (e) {
                // fail silently to protect gameplay
            }
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            primeAudioElement(bgm, BGM_VOLUME);
            primeAudioElement(sfx.tap, 0.55);
            primeAudioElement(sfx.bonus, 0.62);
            primeAudioElement(sfx.ui, 0.35);
            primeAudioElement(sfx.streak, 0.5);
            audioUnlocked = true;
            playSfx('ui', 0);
            syncLoopState();
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
        }

        // --- Game Entities ---
        let card = {
            x: 0, y: 0, w: 0, h: 0,
            isPressed: false,
            pressOffset: 0,
            targetOffset: 0
        };
        let clicks = 0;
        let bestCombo = 0;
        let lastTapAt = 0;
        let particles = [];
        const particleChars = ['LOL', 'OMG', 'VIBE', '+1', 'HYPE', 'YAS'];
        const celebrateCard = document.getElementById('celebrate-card');
        const celebrateText = document.getElementById('celebrate-text');
        const streakCard = document.getElementById('streak-card');
        const streakText = document.getElementById('streak-text');
        let celebrateTimer = 0;
        let streakTimer = 0;

        function showFeedback(cardEl, textEl, message, duration = 1200) {
            if (!cardEl || !textEl) return;
            textEl.textContent = message;
            cardEl.classList.add('is-active');
            const timer = window.setTimeout(() => {
                cardEl.classList.remove('is-active');
            }, duration);
            return timer;
        }

        function pulseCelebrate(message, duration = 1400) {
            if (celebrateTimer) window.clearTimeout(celebrateTimer);
            celebrateTimer = showFeedback(celebrateCard, celebrateText, message, duration);
        }

        function pulseStreak(message, duration = 900) {
            if (streakTimer) window.clearTimeout(streakTimer);
            streakTimer = showFeedback(streakCard, streakText, message, duration);
        }


        function initGame() {
            parseConfig();

            card.w = Math.min(cw * 0.85, 400);
            card.h = card.w / 1.586;
            card.x = cw / 2;
            card.y = ch / 2;

            initialized = true;
            setState('PLAYING');
            pulseCelebrate('Tap once to kick on the arcade loop.', 1800);
            requestAnimationFrame(gameLoop);
        }

        function parseConfig() {
            try {
                const configScript = document.getElementById('game-config');
                if (configScript) {
                    const defs = JSON.parse(configScript.textContent);
                    window.gameConfigDefs = defs;
                    for (let key in defs) {
                        gameConfig[key] = defs[key].value;
                    }
                }
            } catch (e) {
                console.error("Config parse error", e);
            }
        }

        window.updateGameConfig = function(key, val) {
            gameConfig[key] = val;
        };

        function setState(state) {
            gameState = state;
            syncLoopState();
        }

        function spawnParticles(x, y) {
            const count = 5 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 200 + Math.random() * 300;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    maxLife: 1.0,
                    char: particleChars[Math.floor(Math.random() * particleChars.length)],
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 10,
                    color: ['#82f7ff', '#ff58ab', '#ffe27a', '#ffffff'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function handleGameInput(e) {
            unlockAudio();

            if (e.type === 'pointerdown') {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const halfW = card.w / 2;
                const halfH = card.h / 2;
                const isCardTap = x >= card.x - halfW && x <= card.x + halfW &&
                    y >= card.y - halfH && y <= card.y + halfH;

                if (isCardTap) {
                    const now = performance.now();
                    const rapidTap = now - lastTapAt < 500;
                    lastTapAt = now;

                    card.isPressed = true;
                    card.targetOffset = 12;
                    clicks++;
                    bestCombo = rapidTap ? bestCombo + 1 : 1;
                    document.getElementById('score-display').innerText = clicks;

                    playSfx('tap', 60);
                    if (clicks % 5 === 0) {
                        playSfx('bonus', 140);
                        pulseCelebrate(`Combo cash-out x${clicks}! Meme economy booming.`, 1500);
                    } else if (bestCombo >= 3) {
                        playSfx('streak', 180);
                        pulseStreak(`Rapid-fire streak x${bestCombo}!`, 950);
                    }

                    if (clicks === 1) {
                        pulseCelebrate('Arcade loop live. Farm those reactions.', 1500);
                    } else if (clicks % 8 === 0) {
                        pulseStreak(`Impact cam locked on ${clicks} taps.`, 1200);
                    }

                    vibrate('light');
                    spawnParticles(x, y);
                }
            } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
                card.isPressed = false;
                card.targetOffset = 0;
            }
        }

        canvas.addEventListener('pointerdown', handleGameInput, { passive: false });
        canvas.addEventListener('pointerup', handleGameInput, { passive: false });
        canvas.addEventListener('pointercancel', handleGameInput, { passive: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgm.pause();
            } else {
                syncLoopState();
            }
        });

        function resize(w, h) {
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cw = w;
            ch = h;

            if (!initialized) {
                initGame();
            } else {
                card.w = Math.min(cw * 0.85, 400);
                card.h = card.w / 1.586;
                card.x = cw / 2;
                card.y = ch / 2;
                if (!isFinite(card.x) || !isFinite(card.y)) {
                    card.x = 0;
                    card.y = 0;
                }
            }
        }

        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                resize(entry.contentRect.width, entry.contentRect.height);
            }
        });

        function drawBackground() {
            const pulse = performance.now() * 0.001;

            const glowA = ctx.createRadialGradient(cw * 0.2, ch * 0.25, 0, cw * 0.2, ch * 0.25, Math.max(cw, ch) * 0.35);
            glowA.addColorStop(0, 'rgba(130, 247, 255, 0.18)');
            glowA.addColorStop(1, 'rgba(130, 247, 255, 0)');

            const glowB = ctx.createRadialGradient(cw * 0.82, ch * 0.18, 0, cw * 0.82, ch * 0.18, Math.max(cw, ch) * 0.32);
            glowB.addColorStop(0, 'rgba(255, 88, 171, 0.16)');
            glowB.addColorStop(1, 'rgba(255, 88, 171, 0)');

            ctx.fillStyle = gameConfig.bgColor;
            ctx.fillRect(0, 0, cw, ch);

            ctx.fillStyle = glowA;
            ctx.fillRect(0, 0, cw, ch);

            ctx.fillStyle = glowB;
            ctx.fillRect(0, 0, cw, ch);

            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            const gridSize = 30;
            const offset = (pulse * 10) % gridSize;
            for (let x = -gridSize; x < cw + gridSize; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x + offset, 0);
                ctx.lineTo(x + offset, ch);
                ctx.stroke();
            }
            for (let y = -gridSize; y < ch + gridSize; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y + offset * 0.5);
                ctx.lineTo(cw, y + offset * 0.5);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawCard() {
            const halfW = card.w / 2;
            const halfH = card.h / 2;
            const maxShadow = 12;

            const cx = card.x + card.pressOffset;
            const cy = card.y + card.pressOffset;
            const left = cx - halfW;
            const top = cy - halfH;

            ctx.save();

            const shadowGlow = ctx.createRadialGradient(cx, cy, card.w * 0.12, cx, cy, card.w * 0.9);
            shadowGlow.addColorStop(0, 'rgba(255, 88, 171, 0.18)');
            shadowGlow.addColorStop(0.55, 'rgba(130, 247, 255, 0.14)');
            shadowGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = shadowGlow;
            ctx.fillRect(left - card.w * 0.6, top - card.h * 0.8, card.w * 2.2, card.h * 2.2);

            ctx.fillStyle = '#14081f';
            ctx.beginPath();
            ctx.roundRect(card.x + maxShadow - halfW, card.y + maxShadow - halfH, card.w, card.h, 22);
            ctx.fill();

            const faceGradient = ctx.createLinearGradient(left, top, left, top + card.h);
            faceGradient.addColorStop(0, 'rgba(255, 240, 167, 1)');
            faceGradient.addColorStop(0.45, gameConfig.cardColor);
            faceGradient.addColorStop(1, '#ffb347');

            ctx.fillStyle = faceGradient;
            ctx.strokeStyle = '#20143a';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(left, top, card.w, card.h, 22);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(left, top, card.w, card.h, 22);
            ctx.clip();

            const streak = ctx.createLinearGradient(left, top, left + card.w, top + card.h);
            streak.addColorStop(0, 'rgba(255,255,255,0.55)');
            streak.addColorStop(0.18, 'rgba(255,255,255,0.16)');
            streak.addColorStop(0.42, 'rgba(255,255,255,0)');
            ctx.fillStyle = streak;
            ctx.fillRect(left - 10, top, card.w * 0.75, card.h);

            ctx.globalAlpha = 0.12;
            for (let i = 0; i < 6; i++) {
                const bandY = top + (card.h / 6) * i;
                ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#ff58ab';
                ctx.fillRect(left, bandY, card.w, card.h / 12);
            }
            ctx.restore();

            const chipW = card.w * 0.17;
            const chipH = chipW * 0.82;
            const chipX = left + card.w * 0.085;
            const chipY = top + card.h * 0.26;

            const chipGradient = ctx.createLinearGradient(chipX, chipY, chipX, chipY + chipH);
            chipGradient.addColorStop(0, '#fffdf3');
            chipGradient.addColorStop(1, '#ffcaef');
            ctx.fillStyle = chipGradient;
            ctx.beginPath();
            ctx.roundRect(chipX, chipY, chipW, chipH, 8);
            ctx.fill();
            ctx.strokeStyle = 'rgba(32, 20, 58, 0.45)';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(34, 17, 60, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(chipX + chipW * 0.3, chipY);
            ctx.lineTo(chipX + chipW * 0.3, chipY + chipH);
            ctx.moveTo(chipX + chipW * 0.7, chipY);
            ctx.lineTo(chipX + chipW * 0.7, chipY + chipH);
            ctx.moveTo(chipX, chipY + chipH * 0.5);
            ctx.lineTo(chipX + chipW, chipY + chipH * 0.5);
            ctx.stroke();

            const stickerRadius = Math.max(20, card.w * 0.09);
            const stickerX = left + card.w * 0.86;
            const stickerY = top + card.h * 0.24;
            ctx.fillStyle = '#82f7ff';
            ctx.beginPath();
            ctx.arc(stickerX, stickerY, stickerRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#20143a';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#20143a';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `700 ${Math.max(12, card.w * 0.042)}px "Orbitron", "Trebuchet MS", sans-serif`;
            ctx.fillText('LIVE', stickerX, stickerY - 2);

            ctx.fillStyle = '#20143a';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = `700 ${Math.max(12, card.w * 0.06)}px "Orbitron", "Trebuchet MS", sans-serif`;
            ctx.fillText('MEME GRID', left + card.w * 0.06, top + card.h * 0.14);

            ctx.font = `${Math.max(16, card.w * 0.12)}px "Press Start 2P", "Courier New", monospace`;
            ctx.textAlign = 'center';
            ctx.fillText('TAP FOR MEMES', cx, cy + card.h * 0.02);

            ctx.textAlign = 'left';
            ctx.font = `700 ${Math.max(10, card.w * 0.048)}px "Orbitron", "Trebuchet MS", sans-serif`;
            ctx.fillText('REACTION STORM', left + card.w * 0.06, top + card.h * 0.73);

            ctx.font = `700 ${Math.max(9, card.w * 0.036)}px "Orbitron", "Trebuchet MS", sans-serif`;
            ctx.fillStyle = '#6d2d63';
            ctx.fillText('0001 2026 VIRAL 9999', left + card.w * 0.06, top + card.h * 0.88);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#20143a';
            ctx.font = `${Math.max(16, card.w * 0.09)}px "Press Start 2P", "Courier New", monospace`;
            ctx.fillText('🔥', left + card.w * 0.93, top + card.h * 0.82);

            ctx.restore();
        }

        function updateAndDrawParticles(dt) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 800 * dt;
                p.rot += p.vRot * dt;
                p.life -= dt;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                const scale = p.life / p.maxLife;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.font = `${Math.max(10, 28 * scale)}px "Press Start 2P", "Courier New", monospace`;
                ctx.globalAlpha = scale;
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(42, 22, 70, 0.55)';
                ctx.strokeText(p.char, 0, 0);
                ctx.fillStyle = p.color;
                ctx.fillText(p.char, 0, 0);
                ctx.restore();
            }
            ctx.globalAlpha = 1.0;
        }

        function gameLoop(timestamp) {
            try {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                drawBackground();

                const lerpSpeed = 25;
                card.pressOffset += (card.targetOffset - card.pressOffset) * lerpSpeed * dt;

                drawCard();
                updateAndDrawParticles(dt);

            } catch (e) {
                console.error("Loop error", e);
            }

            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            ro.observe(canvas);
        });
    </script>
</body>
</html>
