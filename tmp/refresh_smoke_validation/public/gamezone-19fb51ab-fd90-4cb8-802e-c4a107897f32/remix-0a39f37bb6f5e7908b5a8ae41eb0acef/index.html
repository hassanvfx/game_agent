<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sitrus's Perch</title>
<script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-night: #050510;
        --bg-deep: #0d1022;
        --panel: rgba(16, 21, 40, 0.78);
        --panel-border: rgba(120, 226, 255, 0.28);
        --panel-shadow: rgba(0, 0, 0, 0.55);
        --sitrus-gold: #ffd54f;
        --signal-cyan: #78e2ff;
        --signal-pink: #ff5f9e;
        --signal-violet: #a874ff;
        --text-main: #eef7ff;
        --text-soft: #a3b6d9;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
            radial-gradient(circle at top, rgba(89, 126, 255, 0.15), transparent 34%),
            radial-gradient(circle at bottom, rgba(255, 95, 158, 0.12), transparent 30%),
            linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-night) 72%);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.02)),
            repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px);
        opacity: 0.5;
        mix-blend-mode: screen;
    }

    canvas {
        display: block;
        touch-action: none;
    }

    .glass {
        background: linear-gradient(180deg, rgba(22, 31, 56, 0.92), rgba(9, 14, 28, 0.88));
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.05) inset,
            0 14px 24px var(--panel-shadow),
            0 0 18px rgba(120, 226, 255, 0.15);
    }

    .neon-text {
        text-shadow:
            0 0 10px currentColor,
            0 0 22px rgba(255, 213, 79, 0.3);
    }

    .display-font {
        font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
    }

    .ui-font {
        font-family: 'Rajdhani', system-ui, sans-serif;
    }

    .glitch-anim { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; }

    .hud-chip {
        min-width: 0;
        padding: 0.55rem 0.85rem;
        border-radius: 0.9rem;
        background: linear-gradient(180deg, rgba(14, 19, 38, 0.92), rgba(8, 10, 20, 0.84));
        border: 1px solid rgba(120, 226, 255, 0.25);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.04) inset,
            0 0 16px rgba(120, 226, 255, 0.08);
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        border-radius: 999px;
        padding: 0.28rem 0.72rem;
        background: rgba(120, 226, 255, 0.1);
        border: 1px solid rgba(120, 226, 255, 0.25);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.75rem;
    }

    .signal-dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: var(--signal-cyan);
        box-shadow: 0 0 12px rgba(120, 226, 255, 0.8);
        animation: pulseDot 1.8s ease-in-out infinite;
    }

    .intro-shell {
        position: relative;
        width: min(92vw, 40rem);
        padding: 1.25rem;
        border-radius: 1.6rem;
        overflow: hidden;
    }

    .intro-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 0%, rgba(255, 213, 79, 0.16), transparent 35%),
            radial-gradient(circle at 20% 80%, rgba(120, 226, 255, 0.12), transparent 30%),
            linear-gradient(135deg, rgba(255,255,255,0.05), transparent 50%);
        pointer-events: none;
    }

    .start-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        padding: 1.6rem 1.25rem 1.35rem;
        border-radius: 1.25rem;
        text-align: center;
        background: linear-gradient(180deg, rgba(9, 12, 26, 0.92), rgba(5, 7, 15, 0.94));
        border: 1px solid rgba(255, 213, 79, 0.2);
        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,0.03),
            0 20px 40px rgba(0,0,0,0.45);
    }

    .sitrus-badge {
        position: relative;
        width: 6rem;
        height: 6rem;
        border-radius: 50%;
        background:
            radial-gradient(circle at 50% 40%, rgba(255, 213, 79, 0.14), rgba(20, 20, 28, 0.1) 46%, transparent 47%),
            radial-gradient(circle at 50% 50%, rgba(16, 18, 32, 0.9), rgba(5, 6, 12, 0.98));
        border: 1px solid rgba(255, 213, 79, 0.22);
        box-shadow:
            0 0 0 4px rgba(255, 213, 79, 0.06),
            0 0 24px rgba(255, 213, 79, 0.16);
        animation: perchFloat 3.6s ease-in-out infinite;
    }

    .sitrus-badge::before,
    .sitrus-badge::after {
        content: "";
        position: absolute;
        top: 2.15rem;
        width: 0.78rem;
        height: 1.2rem;
        border-radius: 999px;
        background: var(--sitrus-gold);
        box-shadow: 0 0 12px rgba(255, 213, 79, 0.8);
    }

    .sitrus-badge::before { left: 1.7rem; }
    .sitrus-badge::after { right: 1.7rem; }

    .sitrus-badge span {
        position: absolute;
        inset: auto 1.5rem 1.3rem;
        height: 0.8rem;
        border-bottom: 2px solid rgba(255, 213, 79, 0.9);
        border-radius: 0 0 999px 999px;
        opacity: 0.8;
    }

    .signal-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.55rem;
        max-width: 100%;
    }

    .signal-tag {
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        border: 1px solid rgba(168, 116, 255, 0.24);
        background: rgba(168, 116, 255, 0.1);
        color: #d7c2ff;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        text-transform: uppercase;
    }

    #start-btn {
        min-width: min(16rem, 100%);
        border-radius: 999px;
        letter-spacing: 0.18em;
        text-shadow: 0 0 8px rgba(255, 213, 79, 0.25);
        box-shadow:
            0 0 0 1px rgba(255, 213, 79, 0.2) inset,
            0 0 24px rgba(255, 213, 79, 0.12);
    }

    #start-btn:active {
        transform: scale(0.97);
    }

    .small-copy {
        color: var(--text-soft);
        font-size: 0.95rem;
        line-height: 1.2;
    }

    .reaction-stack {
        position: absolute;
        right: max(clamp(0.75rem, 3vw, 1.4rem), env(safe-area-inset-right));
        bottom: max(clamp(0.75rem, 3vw, 1.35rem), env(safe-area-inset-bottom));
        z-index: 45;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.6rem;
        pointer-events: none;
        width: min(34vw, 11rem);
    }

    .reaction-card {
        width: 100%;
        opacity: 0;
        transform: translateY(0.8rem) scale(0.96);
        transition: opacity 180ms ease, transform 180ms ease;
        border-radius: 1rem;
        overflow: hidden;
        border: 1px solid rgba(120, 226, 255, 0.22);
        background: rgba(5, 9, 20, 0.75);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34);
    }

    .reaction-card.active {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .reaction-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
    }

    .reaction-caption {
        padding: 0.45rem 0.65rem 0.55rem;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #dcefff;
        background: linear-gradient(180deg, rgba(6, 12, 22, 0.2), rgba(6, 12, 22, 0.82));
    }

    @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
    }

    @keyframes pulseDot {
        0%, 100% { transform: scale(0.92); opacity: 0.65; }
        50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes perchFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    @media (max-width: 640px) {
        #hud {
            padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) 0.75rem max(0.75rem, env(safe-area-inset-left));
            gap: 0.55rem;
        }

        .hud-chip {
            padding: 0.5rem 0.7rem;
        }

        .intro-shell {
            width: min(94vw, 28rem);
            padding: 0.8rem;
        }

        .start-card {
            padding: 1.1rem 0.9rem 1rem;
            gap: 0.7rem;
        }

        .sitrus-badge {
            width: 4.9rem;
            height: 4.9rem;
        }

        .sitrus-badge::before,
        .sitrus-badge::after {
            top: 1.7rem;
            width: 0.62rem;
            height: 0.98rem;
        }

        .sitrus-badge::before { left: 1.35rem; }
        .sitrus-badge::after { right: 1.35rem; }

        .sitrus-badge span {
            inset: auto 1.15rem 1rem;
            height: 0.7rem;
        }

        .reaction-stack {
            width: min(38vw, 8rem);
            gap: 0.45rem;
        }

        .reaction-caption {
            font-size: 0.58rem;
            padding: 0.36rem 0.45rem 0.44rem;
            letter-spacing: 0.12em;
        }
    }
</style>
</head>

<script>
// §3.2 Config Interface
window.gameConfigDefs = {
    "chatSpeed": { "type": "number", "label": "Chat Speed", "value": 1, "min": 0.5, "max": 3 },
    "glitchIntensity": { "type": "number", "label": "Scary Factor", "value": 5, "min": 1, "max": 10 },
    "sitrusColor": { "type": "color", "label": "Sitrus Eye Color", "value": "#FFD700" }
};
window.gameConfig = {
    chatSpeed: 1,
    glitchIntensity: 5,
    sitrusColor: "#FFD700"
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'sitrusColor') {
            // Trigger visual update if needed
        }
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const parsed = JSON.parse(configElement.textContent);
            for (const k in parsed) {
                if (window.gameConfig.hasOwnProperty(k)) {
                    window.gameConfig[k] = parsed[k].value;
                    window.gameConfigDefs[k] = parsed[k];
                }
            }
        }
    } catch (e) { console.error("Config parse error", e); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const uiStart = document.getElementById('start-screen');
    const btnStart = document.getElementById('start-btn');
    const hud = document.getElementById('hud');
    const moodDisplay = document.getElementById('mood-meter');
    const bgmEl = document.getElementById('bgm_main');
    const reactionChat = document.getElementById('reaction-chat');
    const reactionGlitch = document.getElementById('reaction-glitch');

    // §A.2 Audio Manager
    class AudioManager {
        constructor() {
            this.ctx = null;
            this.buffers = {};
            this.unlocked = false;
            this.masterGain = null;
            this.bgmGain = null;
            this.sfxGain = null;
            this.lastPlayed = {};
            this.bgmStarted = false;
        }

        ensureContext() {
            if (this.ctx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.bgmGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.72;
            this.bgmGain.gain.value = 0.28;
            this.sfxGain.gain.value = 0.55;
            this.bgmGain.connect(this.masterGain);
            this.sfxGain.connect(this.masterGain);
            this.masterGain.connect(this.ctx.destination);
        }

        async loadSound(id, fallbackType) {
            const el = document.getElementById(id);
            if (!el || !el.src) return;
            try {
                this.ensureContext();
                if (!this.ctx) throw new Error('No audio context available');
                const res = await fetch(el.src);
                const buf = await res.arrayBuffer();
                this.buffers[id] = await this.ctx.decodeAudioData(buf);
            } catch (e) {
                console.warn(`Audio load failed: ${id}, using fallback`);
                this.buffers[id] = fallbackType;
            }
        }

        async unlock() {
            if (this.unlocked) {
                this.playBgm();
                return;
            }

            this.ensureContext();
            try {
                if (this.ctx && this.ctx.state !== 'running') {
                    await this.ctx.resume();
                }
            } catch (e) {
                console.warn('Audio resume failed', e);
            }

            this.unlocked = true;
            this.playBgm();
        }

        playBgm() {
            if (!this.unlocked || !bgmEl) return;
            bgmEl.volume = 0.22;
            bgmEl.loop = true;
            if (this.bgmStarted && !bgmEl.paused) return;
            const playPromise = bgmEl.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
            this.bgmStarted = true;
        }

        stopBgm() {
            if (!bgmEl) return;
            bgmEl.pause();
            bgmEl.currentTime = 0;
            this.bgmStarted = false;
        }

        playSfx(id) {
            if (!this.unlocked) return;
            const now = performance.now();
            if (this.lastPlayed[id] && now - this.lastPlayed[id] < 90) return;
            this.lastPlayed[id] = now;

            const buffer = this.buffers[id];
            if (buffer && typeof buffer !== 'string' && this.ctx && this.sfxGain) {
                const src = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                gain.gain.value = id === 'sfx_glitch' ? 0.42 : id === 'sfx_ripple' ? 0.32 : 0.36;
                src.buffer = buffer;
                src.connect(gain);
                gain.connect(this.sfxGain);
                src.start(0);
            } else {
                this.synthesize(buffer || 'beep');
            }

            const mediaEl = document.getElementById(id);
            if (mediaEl instanceof HTMLAudioElement) {
                try {
                    mediaEl.currentTime = 0;
                    mediaEl.volume = id === 'sfx_glitch' ? 0.38 : id === 'sfx_ripple' ? 0.24 : 0.3;
                    const p = mediaEl.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } catch (e) {
                    // Fail silently
                }
            }
        }

        synthesize(type) {
            if (!this.ctx || !this.sfxGain) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.sfxGain);

            if (type === 'glitch' || type === 'impact') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(48, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } else if (type === 'sparkle') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(660, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(980, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        }
    }

    const audio = new AudioManager();
    audio.loadSound('sfx_start', 'beep');
    audio.loadSound('sfx_chat', 'beep');
    audio.loadSound('sfx_glitch', 'impact');
    audio.loadSound('sfx_ripple', 'sparkle');

    let reactionTimers = {
        chat: null,
        glitch: null
    };

    function showReaction(type) {
        const card = type === 'glitch' ? reactionGlitch : reactionChat;
        if (!card) return;
        card.classList.add('active');
        card.setAttribute('aria-hidden', 'false');
        clearTimeout(reactionTimers[type]);
        reactionTimers[type] = setTimeout(() => {
            card.classList.remove('active');
            card.setAttribute('aria-hidden', 'true');
        }, type === 'glitch' ? 1200 : 900);
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (bgmEl) bgmEl.pause();
        } else if (isPlaying) {
            audio.playBgm();
        }
    });

    // Game State
    let width, height;
    let lastTime = 0;
    let isPlaying = false;
    let glitchTimer = 0;
    let glitchActive = false;

    // Entities
    const characters = [
        { name: "N", color: "#F0F0F0", eye: "#FFE700", x: 0.2, y: 0.6, type: "DD" },
        { name: "V", color: "#E0E0E0", eye: "#FFE700", x: 0.35, y: 0.55, type: "DD" },
        { name: "Sitrus", color: "#333333", eye: "#FFD700", x: 0.5, y: 0.45, type: "DD_PLAYER" },
        { name: "J", color: "#CCCCCC", eye: "#FFE700", x: 0.65, y: 0.55, type: "DD" },
        { name: "Uzi", color: "#222233", eye: "#9D00FF", x: 0.8, y: 0.7, type: "WD" }
    ];

    const dialogues = {
        "N": ["Biscuits!", "I love doing anything!", "Did I do good?", "Sitrus, nice wings!", "Oil is warm today."],
        "V": ["Bored.", "Can we kill yet?", "Ugh.", "Nice claws, Sitrus.", "Watching you."],
        "J": ["Synergy!", "Branded pens.", "Quarterly goals.", "Don't slack off.", "JCJenson approved."],
        "Uzi": ["Bite me!", "Absolute Solver.", "Railgun charging...", "Humans are cringe.", "Dad is useless."],
        "Sitrus": ["...", "*Stares*", "*Tail twitch*", "System Normal.", "Target Acquired... Jk."]
    };

    let activeChats = [];
    let particles = [];
    let cameraShake = { x: 0, y: 0 };

    // Resize
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Input
    canvas.addEventListener('pointerdown', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        let tapped = false;
        characters.forEach(c => {
            const cx = c.x * width;
            const cy = c.y * height;
            const dist = Math.hypot(x - cx, y - cy);
            if (dist < 60) {
                spawnChat(c);
                tapped = true;

                if (c.name === "Sitrus") {
                    triggerGlitch();
                }
            }
        });

        if (!tapped) {
            createRipple(x, y);
        }
    }, { passive: false });

    function spawnChat(char) {
        audio.playSfx('sfx_chat');
        showReaction('chat');
        const lines = dialogues[char.name];
        const text = lines[Math.floor(Math.random() * lines.length)];

        activeChats.push({
            text: text,
            x: char.x * width,
            y: char.y * height - 80,
            life: 3.0,
            color: char.eye,
            name: char.name
        });
    }

    function triggerGlitch() {
        glitchTimer = 0.5;
        glitchActive = true;
        audio.playSfx('sfx_glitch');
        showReaction('glitch');
        moodDisplay.innerText = "STATUS: GLITCHED";
        moodDisplay.style.color = "#ff6f8f";
        moodDisplay.style.textShadow = "0 0 14px rgba(255, 95, 158, 0.85)";
        setTimeout(() => {
            moodDisplay.innerText = "STATUS: STABLE";
            moodDisplay.style.color = "#eef7ff";
            moodDisplay.style.textShadow = "none";
        }, 500);
    }

    function createRipple(x, y) {
        audio.playSfx('sfx_ripple');
        for(let i = 0; i < 5; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1.0,
                size: Math.random() * 3 + 1,
                color: "#baf5ff"
            });
        }
    }

    // Drawing Helpers
    function drawDrone(c, time) {
        const cx = c.x * width;
        const cy = c.y * height;
        const bob = Math.sin(time * 2 + c.x * 10) * 5;
        const isSitrus = c.name === "Sitrus";
        const eyeColor = isSitrus ? window.gameConfig.sitrusColor : c.eye;
        const wingTint = isSitrus ? "rgba(255, 213, 79, 0.68)" : c.name === "Uzi" ? "rgba(168, 116, 255, 0.58)" : "rgba(120, 226, 255, 0.44)";

        ctx.save();
        ctx.translate(cx, cy + bob);

        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.beginPath();
        ctx.ellipse(0, 48, isSitrus ? 30 : 22, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        if (isSitrus) {
            const haloPulse = 0.7 + Math.sin(time * 3.5) * 0.18;
            ctx.strokeStyle = `rgba(255, 213, 79, ${0.35 + haloPulse * 0.2})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 2, 34 + haloPulse * 3, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (c.type.includes("DD")) {
            const wingFlap = Math.sin(time * 5) * 0.1;
            ctx.strokeStyle = wingTint;
            ctx.lineWidth = isSitrus ? 5 : 3;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-68, -44 + wingFlap * 50);
            ctx.lineTo(-42, 14);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(15, 5);
            ctx.lineTo(68, -44 + wingFlap * 50);
            ctx.lineTo(42, 14);
            ctx.stroke();

            ctx.strokeStyle = isSitrus ? "#ffe6a6" : "#8f9ab7";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-60, -40 + wingFlap * 50);
            ctx.lineTo(-40, 10);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(15, 5);
            ctx.lineTo(60, -40 + wingFlap * 50);
            ctx.lineTo(40, 10);
            ctx.stroke();
        }

        const headGradient = ctx.createRadialGradient(-6, -8, 2, 0, 0, 26);
        headGradient.addColorStop(0, isSitrus ? "#41414f" : c.name === "Uzi" ? "#36335a" : "#2a3148");
        headGradient.addColorStop(1, "#090b13");
        ctx.fillStyle = headGradient;
        ctx.beginPath();
        ctx.arc(0, 0, isSitrus ? 24 : 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = isSitrus ? "rgba(255, 213, 79, 0.45)" : "rgba(120, 226, 255, 0.24)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, isSitrus ? 24 : 20, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = glitchActive && isSitrus ? "rgba(255, 70, 70, 0.18)" : `${eyeColor}22`;
        ctx.beginPath();
        ctx.ellipse(0, -1, isSitrus ? 18 : 15, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = eyeColor;
        if (isSitrus && glitchActive) {
            ctx.strokeStyle = "#ff5f5f";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
            ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 10, 10, 0, Math.PI, false);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.ellipse(-8, -2, 6, 8, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -2, 6, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.beginPath();
            ctx.arc(-10, -5, 1.6, 0, Math.PI * 2);
            ctx.arc(6, -5, 1.6, 0, Math.PI * 2);
            ctx.fill();
        }

        if (c.type === "DD" || c.type === "DD_PLAYER") {
            ctx.fillStyle = "#1e2336";
            ctx.fillRect(-22, -25, 44, 10);
            for(let i = 0; i < 5; i++) {
                ctx.fillStyle = (isSitrus && glitchActive) ? "#ff4a70" : (isSitrus ? "#ffd54f" : "#9cecff");
                ctx.beginPath();
                ctx.arc(-15 + i * 7.5, -20, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (isSitrus) {
            ctx.fillStyle = "rgba(255, 213, 79, 0.75)";
            ctx.beginPath();
            ctx.moveTo(-4, -24);
            ctx.lineTo(0, -35);
            ctx.lineTo(4, -24);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-12, -20);
            ctx.lineTo(-8, -30);
            ctx.lineTo(-4, -19);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(12, -20);
            ctx.lineTo(8, -30);
            ctx.lineTo(4, -19);
            ctx.closePath();
            ctx.fill();
        }

        if (c.name === "Uzi") {
            ctx.fillStyle = "#5a2e8a";
            ctx.beginPath();
            ctx.arc(0, -18, 21, Math.PI, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -38, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = isSitrus ? "#ffe59a" : "#e5efff";
            ctx.font = `700 ${isSitrus ? 18 : 16}px Orbitron`;
        ctx.textAlign = "center";
        ctx.shadowColor = isSitrus ? "rgba(255, 213, 79, 0.6)" : "rgba(120, 226, 255, 0.3)";
        ctx.shadowBlur = 10;
        ctx.fillText(c.name, 0, 44);
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    function drawTree(time) {
        const trunkX = width * 0.5;
        const trunkY = height;

        const treeGlow = ctx.createRadialGradient(trunkX, height * 0.58, 10, trunkX, height * 0.58, height * 0.42);
        treeGlow.addColorStop(0, "rgba(120, 226, 255, 0.12)");
        treeGlow.addColorStop(1, "rgba(120, 226, 255, 0)");
        ctx.fillStyle = treeGlow;
        ctx.fillRect(0, height * 0.15, width, height * 0.85);

        ctx.strokeStyle = "#2c3346";
        ctx.lineWidth = 14;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(trunkX, trunkY);
        ctx.quadraticCurveTo(trunkX, height * 0.6, width * 0.5, height * 0.4);
        ctx.stroke();

        ctx.strokeStyle = "rgba(120, 226, 255, 0.2)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(trunkX, trunkY);
        ctx.quadraticCurveTo(trunkX, height * 0.6, width * 0.5, height * 0.4);
        ctx.stroke();

        const branches = [
            { sx: 0.5, sy: 0.4, ex: 0.2, ey: 0.6 },
            { sx: 0.5, sy: 0.45, ex: 0.35, ey: 0.55 },
            { sx: 0.5, sy: 0.4, ex: 0.65, ey: 0.55 },
            { sx: 0.5, sy: 0.5, ex: 0.8, ey: 0.7 },
        ];

        branches.forEach((b, index) => {
            ctx.strokeStyle = "#31384c";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(b.sx * width, b.sy * height);
            ctx.lineTo(b.ex * width, b.ey * height);
            ctx.stroke();

            ctx.strokeStyle = index === 3 ? "rgba(168, 116, 255, 0.22)" : "rgba(120, 226, 255, 0.18)";
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(b.sx * width, b.sy * height);
            ctx.lineTo(b.ex * width, b.ey * height);
            ctx.stroke();
        });

        const orbit = Math.sin(time * 0.0015) * 8;
        for (let i = 0; i < 3; i++) {
            const angle = time * 0.001 + i * ((Math.PI * 2) / 3);
            const px = width * 0.5 + Math.cos(angle) * (34 + i * 6);
            const py = height * 0.45 + Math.sin(angle) * (10 + i * 4) - 44 + orbit;
            ctx.fillStyle = i === 0 ? "#ffd54f" : (i === 1 ? "#78e2ff" : "#ff7db0");
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(px, py, 2.5 + i * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Game Loop
    function loop(time) {
        const dt = (time - lastTime) / 1000;
        lastTime = time;

        if (glitchTimer > 0) {
            glitchTimer -= dt;
            if (glitchTimer <= 0) glitchActive = false;
            cameraShake.x = (Math.random() - 0.5) * window.gameConfig.glitchIntensity * 2;
            cameraShake.y = (Math.random() - 0.5) * window.gameConfig.glitchIntensity * 2;
        } else {
            cameraShake.x = 0;
            cameraShake.y = 0;
        }

        ctx.save();
        if (glitchActive) {
            ctx.translate(cameraShake.x, cameraShake.y);
            ctx.fillStyle = "#14020a";
        } else {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, "#11162f");
            bgGradient.addColorStop(0.45, "#0a1020");
            bgGradient.addColorStop(1, "#04050b");
            ctx.fillStyle = bgGradient;
        }
        ctx.fillRect(0, 0, width, height);

        for(let i = 0; i < 60; i++) {
            const px = ((time * 0.012 + i * 53) % width);
            const py = ((time * 0.02 + i * 137) % height);
            const size = (i % 3) + 1;
            ctx.globalAlpha = 0.12 + (i % 5) * 0.05;
            ctx.fillStyle = i % 6 === 0 ? "#78e2ff" : "#ffffff";
            ctx.fillRect(px, py, size, size);
        }
        ctx.globalAlpha = 1.0;

        const haze = ctx.createLinearGradient(0, height * 0.52, 0, height);
        haze.addColorStop(0, "rgba(120, 226, 255, 0)");
        haze.addColorStop(1, "rgba(8, 14, 28, 0.45)");
        ctx.fillStyle = haze;
        ctx.fillRect(0, height * 0.52, width, height * 0.48);

        drawTree(time);
        characters.forEach(c => drawDrone(c, time / 1000));

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;

        for (let i = activeChats.length - 1; i >= 0; i--) {
            let c = activeChats[i];
            c.life -= dt * window.gameConfig.chatSpeed;
            c.y -= 10 * dt;

            ctx.font = "600 22px Rajdhani";
            const textW = ctx.measureText(c.text).width + 26;

            const bx = c.x - textW / 2;
            const by = c.y - 32;

            const bubbleGradient = ctx.createLinearGradient(0, by, 0, by + 42);
            bubbleGradient.addColorStop(0, "rgba(15, 20, 40, 0.95)");
            bubbleGradient.addColorStop(1, "rgba(6, 8, 16, 0.92)");
            ctx.fillStyle = bubbleGradient;
            ctx.strokeStyle = c.color;
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.roundRect(bx, by, textW, 42, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = c.color;
            ctx.textAlign = "center";
            ctx.shadowColor = `${c.color}99`;
            ctx.shadowBlur = 10;
            ctx.fillText(c.text, c.x, c.y);
            ctx.shadowBlur = 0;

            if (c.life <= 0) activeChats.splice(i, 1);
        }

        if (glitchActive) {
            ctx.fillStyle = `rgba(255, 0, 85, ${Math.random() * 0.16})`;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
            for(let i = 0; i < 10; i++) {
                const ly = Math.random() * height;
                const lh = Math.random() * 5 + 1;
                ctx.fillRect(0, ly, width, lh);
            }
        }

        ctx.restore();
        requestAnimationFrame(loop);
    }

    // Start
    btnStart.addEventListener('click', async () => {
        await audio.unlock();
        audio.playSfx('sfx_start');
        uiStart.style.display = 'none';
        hud.classList.remove('hidden');
        isPlaying = true;
        requestAnimationFrame(loop);
    });

    // Initial Render
    resize();
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, width, height);
});
</script>
</body>
