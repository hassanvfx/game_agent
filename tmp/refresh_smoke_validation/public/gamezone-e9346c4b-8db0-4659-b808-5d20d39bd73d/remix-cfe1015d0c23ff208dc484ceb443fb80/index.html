<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Data Run</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] remapped-fonts: display -> Audiowide, ui -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060814;
            --bg-mid: #09172c;
            --road-core: #0d1220;
            --road-edge: #35f2ff;
            --hero-core: #64f4ff;
            --hero-glow: rgba(100, 244, 255, 0.55);
            --enemy-core: #ff4b8b;
            --enemy-glow: rgba(255, 75, 139, 0.38);
            --orb-core: #89ffe1;
            --text-main: #ecf8ff;
            --text-dim: rgba(236, 248, 255, 0.72);
            --panel-bg: rgba(10, 16, 32, 0.7);
            --panel-border: rgba(83, 235, 255, 0.34);
            --panel-shadow: 0 0 24px rgba(28, 176, 255, 0.18);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(50, 175, 255, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 58%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(83, 235, 255, 0.18), transparent 18%),
                radial-gradient(circle at 85% 15%, rgba(255, 75, 139, 0.16), transparent 20%),
                linear-gradient(180deg, transparent, rgba(5, 14, 32, 0.28));
        }

        body::after {
            background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 100% 6px;
            opacity: 0.16;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass {
            background: linear-gradient(180deg, rgba(12, 20, 38, 0.92), rgba(7, 13, 24, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(83, 235, 255, 0.7), 0 0 22px rgba(83, 235, 255, 0.28);
        }

        .display-font {
            font-family: 'Audiowide', sans-serif;
        }

        .hud-card {
            min-width: 5.5rem;
            padding: 0.5rem 0.75rem 0.55rem;
            border: 1px solid var(--panel-border);
            border-radius: 1rem;
            background: var(--panel-bg);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(10px);
        }

        .hud-label {
            font-family: 'Audiowide', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .hud-value {
            font-family: 'Audiowide', sans-serif;
            line-height: 0.9;
        }

        .center-banner {
            padding: 0.5rem 0.75rem;
            border: 1px solid rgba(137, 255, 225, 0.18);
            border-radius: 999px;
            background: rgba(8, 16, 32, 0.56);
            box-shadow: 0 0 18px rgba(137, 255, 225, 0.09);
            backdrop-filter: blur(8px);
            color: rgba(236, 248, 255, 0.84);
            font-size: 0.8rem;
            line-height: 1.15;
        }

        .restart-btn {
            font-family: 'Audiowide', sans-serif;
            background: linear-gradient(180deg, #85fff0, #40d9ff);
            box-shadow: 0 0 18px rgba(64, 217, 255, 0.45);
        }

        .restart-btn:active {
            transform: scale(0.97);
        }

        .modal-shell {
            max-height: min(88vh, 40rem);
            display: flex;
            flex-direction: column;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(24vw, 8.5rem);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 22px rgba(0, 243, 255, 0.2);
            background: rgba(7, 14, 28, 0.72);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif.visible {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }

        #collect-gif {
            top: 5.4rem;
        }

        #crash-gif {
            bottom: 1.25rem;
            width: min(28vw, 10rem);
        }

        .hidden { display: none !important; }

        @media (max-width: 640px) {
            #hud {
                top: 0.75rem;
                left: 0.75rem;
                right: 0.75rem;
                gap: 0.5rem;
                align-items: flex-start;
            }

            .hud-card {
                min-width: 4.6rem;
                padding: 0.45rem 0.55rem 0.5rem;
                border-radius: 0.85rem;
            }

            .hud-label {
                font-size: 0.6rem;
                letter-spacing: 0.2em;
            }

            .center-banner {
                max-width: 9.5rem;
                padding: 0.45rem 0.55rem;
                font-size: 0.7rem;
            }

            #score-display {
                font-size: 2rem;
            }

            #speed-display {
                font-size: 1.55rem;
            }

            .feedback-gif {
                right: 0.75rem;
                width: min(30vw, 5.5rem);
                border-radius: 0.8rem;
            }

            #collect-gif {
                top: 5rem;
            }

            #crash-gif {
                bottom: 0.85rem;
                width: min(34vw, 6.75rem);
            }

            #game-over-screen .glass {
                width: calc(100% - 2rem);
                padding: 1.25rem;
                border-radius: 1rem;
            }

            #game-over-screen h2 {
                font-size: 2.25rem;
            }

            #game-over-screen p {
                font-size: 1rem;
            }

            #game-over-screen .final-score-text {
                font-size: 1.5rem;
            }

            #restart-btn {
                font-size: 1rem;
                padding-top: 0.95rem;
                padding-bottom: 0.95rem;
            }
        }
    </style>
</head>

<!-- Assets -->

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">

        <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start">

<script>
/** 
 * §2 System Invariants & Architecture 
 */
const CONFIG = {
    laneCount: 4,
    roadWidthPct: 0.85,
    heroYPct: 0.85,
    baseSpeed: 500, // pixels per sec
};

let canvas, ctx;
let cw = 0, ch = 0;
let dpr = 1;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let score = 0;
let gameSpeed = 1;
let distance = 0;

// Entities
let hero = { x: 0, y: 0, w: 0, h: 0, lane: 0, targetX: 0, tilt: 0 };
let enemies = [];
let particles = [];
let roadStripes = [];
let collectables = [];

// Audio Context
let audioCtx;
let isAudioUnlocked = false;
let lastMoveSfxTime = 0;

// Config Accessors
const getVal = (key) => window.gameConfig?.[key] ?? window.gameConfigDefs[key].value;

/**
 * §3.5 Audio System
 */
const AudioSys = {
    init: () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();

        ['bgm_race', 'sfx_collect', 'sfx_crash', 'sfx_restart', 'sfx_swipe'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            if (id === 'bgm_race') {
                el.volume = 0.2;
            } else if (id === 'sfx_crash') {
                el.volume = 0.35;
            } else if (id === 'sfx_swipe') {
                el.volume = 0.14;
            } else {
                el.volume = 0.28;
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                AudioSys.pauseLoop();
            } else if (gameState === 'PLAYING' && isAudioUnlocked) {
                AudioSys.resumeLoop();
            }
        });
    },
    unlock: () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        if (isAudioUnlocked) {
            if (gameState === 'PLAYING') AudioSys.resumeLoop();
            return;
        }
        isAudioUnlocked = true;
        AudioSys.resumeLoop();
    },
    resumeLoop: () => {
        const bgm = document.getElementById('bgm_race');
        if (!bgm) return;
        bgm.play().catch(() => {});
    },
    pauseLoop: () => {
        const bgm = document.getElementById('bgm_race');
        if (bgm) bgm.pause();
    },
    playSfx: (id, fallback = 'beep') => {
        if (!isAudioUnlocked) return;
        const el = document.getElementById(id);
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
            } catch (_) {}
            el.play().catch(() => AudioSys.synthFallback(fallback));
        } else {
            AudioSys.synthFallback(fallback);
        }
    },
    synthFallback: (type) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'ui') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(740, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    }
};

const FeedbackFx = {
    timers: {},
    show(id, duration = 850) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
    },
    hideAll() {
        ['collect-gif', 'crash-gif'].forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('visible');
            clearTimeout(this.timers[id]);
        });
    }
};

const Vibe = {
    trigger: (style) => {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
            });
        } else if (navigator.vibrate) {
            navigator.vibrate(style === 'heavy' ? 200 : 50);
        }
    }
};

/**
 * §3.4 Lifecycle
 */
window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // Initial Setup
    AudioSys.init();
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGameInput, { passive: false });
    window.addEventListener('pointerup', handleInputEnd, { passive: false });
    window.addEventListener('pointercancel', handleInputEnd, { passive: false });
    document.getElementById('restart-btn').addEventListener('click', handleGlobalInput);
    
    initGame();
    setState('PLAYING');
    requestAnimationFrame(loop);
});

function parseConfig() {
    const el = document.getElementById('game-config');
    if (el) {
        try {
            window.gameConfigDefs = JSON.parse(el.textContent);
            window.gameConfig = {};
            for (let k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;
        } catch(e) { console.error('Config parse error', e); }
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = document.body.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cw = rect.width;
    ch = rect.height;
    
    // Re-calc hero Y if game is running to keep it on screen
    if (hero) hero.y = ch * CONFIG.heroYPct;
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const go = document.getElementById('game-over-screen');
    
    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        go.classList.add('hidden');
        FeedbackFx.hideAll();
        if (isAudioUnlocked) AudioSys.resumeLoop();
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        go.classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        AudioSys.pauseLoop();
    }
}

function initGame() {
    if (cw === 0) resize();
    
    score = 0;
    distance = 0;
    gameSpeed = 1;
    FeedbackFx.hideAll();
    
    const roadW = cw * CONFIG.roadWidthPct;
    const laneW = roadW / CONFIG.laneCount;
    
    hero = {
        x: cw / 2,
        y: ch * CONFIG.heroYPct,
        w: laneW * 0.5,
        h: laneW * 0.9,
        targetX: cw / 2,
        tilt: 0,
        color: getVal('themeColor')
    };
    
    enemies = [];
    particles = [];
    collectables = [];
    
    // Pre-warm road stripes
    roadStripes = [];
    for (let i=0; i<10; i++) {
        roadStripes.push({ y: i * (ch/5), h: ch/10 });
    }
}

function restartGame() {
    initGame();
    setState('PLAYING');
    AudioSys.playSfx('sfx_restart', 'ui');
}

/**
 * §3.2 Input System
 */
let isDragging = false;
let dragStartX = 0;
let heroStartX = 0;

function handleGlobalInput(e) {
    // L2 Audio Unlock
    AudioSys.unlock();
    
    if (gameState === 'GAMEOVER') {
        restartGame();
        return;
    }
    
    if (gameState === 'PLAYING') {
        isDragging = true;
        dragStartX = e.clientX;
        heroStartX = hero.x;
    }
}

function handleGameInput(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING' || !isDragging) return;
    
    const dx = e.clientX - dragStartX;
    const sensitivity = getVal('sensitivity') * 2.5; // Multiplier for feel
    
    let newX = heroStartX + dx * sensitivity;
    
    // Clamp to road
    const roadW = cw * CONFIG.roadWidthPct;
    const margin = (cw - roadW) / 2;
    newX = Math.max(margin + hero.w/2, Math.min(cw - margin - hero.w/2, newX));
    
    if (Math.abs(newX - hero.targetX) > 14 && performance.now() - lastMoveSfxTime > 130) {
        AudioSys.playSfx('sfx_swipe', 'ui');
        lastMoveSfxTime = performance.now();
    }

    hero.targetX = newX;
}

function handleInputEnd() {
    isDragging = false;
}

/**
 * §3.3 Game Logic
 */
function loop(timestamp) {
    try {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
        lastTime = timestamp;
        
        if (gameState === 'PLAYING') {
            update(dt);
        }
        
        draw();
        requestAnimationFrame(loop);
    } catch (err) {
        console.error("Game Loop Error:", err);
        // Attempt recovery
        initGame();
        requestAnimationFrame(loop);
    }
}

function update(dt) {
    // Difficulty scaling
    gameSpeed += dt * 0.02;
    distance += gameSpeed * dt * 100;
    score += gameSpeed * dt * 10;
    
    // Hero Movement
    const lerpFactor = 15 * dt;
    const prevX = hero.x;
    hero.x += (hero.targetX - hero.x) * lerpFactor;
    
    // Tilt calculation based on dx
    const dx = hero.x - prevX;
    hero.tilt = -dx * 1.5; // Visual tilt
    
    // Safety check
    if (!isFinite(hero.x)) hero.x = cw/2;

    // Road Stripes
    const stripeSpeed = CONFIG.baseSpeed * gameSpeed;
    roadStripes.forEach(s => {
        s.y += stripeSpeed * dt;
        if (s.y > ch) s.y -= ch * 2; // Wrap around
    });
    
    // Spawning
    const trafficVal = getVal('trafficSpeed');
    if (Math.random() < 0.02 * trafficVal * gameSpeed) spawnEnemy();
    if (Math.random() < 0.01) spawnCollectable();
    
    // Entities Update
    updateEnemies(dt);
    updateCollectables(dt);
    updateParticles(dt);
    
    // UI Update
    document.getElementById('score-display').innerText = Math.floor(score);
    document.getElementById('speed-display').innerText = Math.floor(120 + gameSpeed * 50) + " KM/H";
}

function spawnEnemy() {
    const roadW = cw * CONFIG.roadWidthPct;
    const laneW = roadW / CONFIG.laneCount;
    const margin = (cw - roadW) / 2;
    const lane = Math.floor(Math.random() * CONFIG.laneCount);
    
    const ex = margin + lane * laneW + laneW/2;
    const ey = -100;
    
    // Don't spawn if too close to another
    for(let e of enemies) {
        if (Math.abs(e.y - ey) < 150 && Math.abs(e.x - ex) < 10) return;
    }
    
    enemies.push({
        x: ex, y: ey, w: hero.w, h: hero.h,
        speed: CONFIG.baseSpeed * (0.5 + Math.random() * 0.3), // Slower than hero
        color: '#ff4b8b',
        accent: '#ffc1d8',
        droneGlow: Math.random() * 0.4 + 0.6
    });
}

function spawnCollectable() {
    const roadW = cw * CONFIG.roadWidthPct;
    const laneW = roadW / CONFIG.laneCount;
    const margin = (cw - roadW) / 2;
    const lane = Math.floor(Math.random() * CONFIG.laneCount);
    
    collectables.push({
        x: margin + lane * laneW + laneW/2,
        y: -50,
        r: 15,
        active: true,
        pulse: Math.random() * Math.PI * 2
    });
}

function updateEnemies(dt) {
    const relSpeed = CONFIG.baseSpeed * gameSpeed; // Relative speed since hero is "fixed"
    
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        // Move down relative to camera
        e.y += (relSpeed - e.speed * 0.2) * dt; 
        
        // Collision
        if (checkRectCollide(hero, e, 10)) {
            gameOver();
        }
        
        if (e.y > ch + 100) enemies.splice(i, 1);
    }
}

function updateCollectables(dt) {
    const speed = CONFIG.baseSpeed * gameSpeed;
    for (let i = collectables.length - 1; i >= 0; i--) {
        let c = collectables[i];
        c.y += speed * dt;
        
        // Circular collision
        const dx = hero.x - c.x;
        const dy = hero.y - c.y; // Center to center approx
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < (hero.w/2 + c.r)) {
            // Collect
            score += 500;
            AudioSys.playSfx('sfx_collect', 'beep');
            FeedbackFx.show('collect-gif', 900);
            Vibe.trigger('light');
            spawnParticles(c.x, c.y, '#00f3ff', 10);
            collectables.splice(i, 1);
        } else if (c.y > ch + 50) {
            collectables.splice(i, 1);
        }
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Hero exhaust
    if (gameState === 'PLAYING') {
        if (Math.random() < 0.5) {
            particles.push({
                x: hero.x + (Math.random()-0.5)*10,
                y: hero.y + hero.h/2,
                vx: (Math.random()-0.5)*20,
                vy: 100 + Math.random()*100,
                life: 0.3,
                color: 'rgba(100, 244, 255, 0.5)',
                size: 2 + Math.random()*2
            });
        }
    }
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.3,
            color: color,
            size: 3 + Math.random() * 3
        });
    }
}

function checkRectCollide(r1, r2, padding) {
    return (
        r1.x - r1.w/2 + padding < r2.x + r2.w/2 - padding &&
        r1.x + r1.w/2 - padding > r2.x - r2.w/2 + padding &&
        r1.y - r1.h/2 + padding < r2.y + r2.h/2 - padding &&
        r1.y + r1.h/2 - padding > r2.y - r2.h/2 + padding
    );
}

function gameOver() {
    if (gameState === 'GAMEOVER') return;
    setState('GAMEOVER');
    Vibe.trigger('heavy');
    AudioSys.playSfx('sfx_crash', 'crash');
    FeedbackFx.show('crash-gif', 1500);
    
    // Explosion
    spawnParticles(hero.x, hero.y, '#ff0055', 50);
    spawnParticles(hero.x, hero.y, '#ffffff', 20);
    
    // Shake effect (simple CSS)
    canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
    setTimeout(() => canvas.style.transform = 'none', 200);
}

/**
 * §3.1 Rendering
 */
function draw() {
    // Background
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#08101f');
    bgGradient.addColorStop(0.5, '#071427');
    bgGradient.addColorStop(1, '#04070f');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);

    // City glow rails
    ctx.save();
    for (let i = 0; i < 6; i++) {
        const y = (distance * 0.25 + i * ch / 5) % (ch + 120) - 60;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(83, 235, 255, 0.08)' : 'rgba(255, 75, 139, 0.06)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y - 40);
        ctx.stroke();
    }
    ctx.restore();
    
    // Grid/Perspective effect (Fake)
    const roadW = cw * CONFIG.roadWidthPct;
    const margin = (cw - roadW) / 2;
    
    // Draw Road
    const roadGradient = ctx.createLinearGradient(margin, 0, cw - margin, 0);
    roadGradient.addColorStop(0, '#090f1b');
    roadGradient.addColorStop(0.5, '#11182a');
    roadGradient.addColorStop(1, '#090f1b');
    ctx.fillStyle = roadGradient;
    ctx.fillRect(margin, 0, roadW, ch);

    ctx.fillStyle = 'rgba(92, 231, 255, 0.05)';
    for (let i = 0; i < 16; i++) {
        const y = (distance * 0.7 + i * 64) % (ch + 64) - 64;
        ctx.fillRect(margin, y, roadW, 1.5);
    }
    
    // Road Borders (Neon)
    ctx.strokeStyle = getVal('themeColor');
    ctx.lineWidth = 4;
    ctx.shadowBlur = 18;
    ctx.shadowColor = getVal('themeColor');
    
    ctx.beginPath();
    ctx.moveTo(margin, 0);
    ctx.lineTo(margin, ch);
    ctx.moveTo(cw - margin, 0);
    ctx.lineTo(cw - margin, ch);
    ctx.stroke();
    
    // Moving Stripes
    ctx.strokeStyle = 'rgba(83, 235, 255, 0.26)';
    ctx.lineWidth = 2;
    ctx.setLineDash([40, 60]);
    ctx.lineDashOffset = -distance % 100;
    
    const laneW = roadW / CONFIG.laneCount;
    for(let i=1; i<CONFIG.laneCount; i++) {
        const x = margin + i * laneW;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    // Draw Collectables
    collectables.forEach(c => {
        const pulse = 1 + Math.sin(distance * 0.03 + c.pulse) * 0.08;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#5dffdf';
        ctx.shadowBlur = 26;
        ctx.shadowColor = '#5dffdf';
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-c.r * 0.55, 0);
        ctx.lineTo(c.r * 0.55, 0);
        ctx.moveTo(0, -c.r * 0.55);
        ctx.lineTo(0, c.r * 0.55);
        ctx.stroke();
        
        // Inner core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, c.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
    ctx.shadowBlur = 0;

    // Draw Enemies
    enemies.forEach(e => {
        drawCar(e.x, e.y, e.w, e.h, e.color, 0);
    });

    // Draw Hero
    if (gameState !== 'GAMEOVER') {
        drawCar(hero.x, hero.y, hero.w, hero.h, getVal('themeColor'), hero.tilt);
    }
    
    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawCar(x, y, w, h, color, tilt) {
    const isHero = color === getVal('themeColor');
    const shellColor = isHero ? '#0c2032' : '#2a1120';
    const canopyColor = isHero ? '#9af6ff' : '#ffd4e3';
    const lightColor = isHero ? '#5dffdf' : '#ff7ca8';

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt * 0.05); // Slight rotation on turn
    
    // Glow
    ctx.shadowBlur = isHero ? 24 : 18;
    ctx.shadowColor = color;

    // Character silhouette
    ctx.beginPath();
    ctx.moveTo(0, -h/2);
    ctx.lineTo(w/2, -h/6);
    ctx.lineTo(w/2.2, h/2);
    ctx.lineTo(-w/2.2, h/2);
    ctx.lineTo(-w/2, -h/6);
    ctx.closePath();
    ctx.fillStyle = shellColor;
    ctx.fill();

    // Core trim
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Center spine
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(-w * 0.06, -h * 0.32, w * 0.12, h * 0.62);

    // Cockpit / visor
    ctx.fillStyle = canopyColor;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.roundRect(-w * 0.22, -h * 0.24, w * 0.44, h * 0.28, w * 0.08);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Side fins
    ctx.fillStyle = color;
    ctx.fillRect(-w * 0.48, -h * 0.05, w * 0.12, h * 0.28);
    ctx.fillRect(w * 0.36, -h * 0.05, w * 0.12, h * 0.28);

    // Nose highlight gives the hero a stronger face-like read
    ctx.fillStyle = isHero ? '#d9ffff' : '#ffe4ef';
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.44);
    ctx.lineTo(w * 0.12, -h * 0.18);
    ctx.lineTo(-w * 0.12, -h * 0.18);
    ctx.closePath();
    ctx.fill();

    // Engine lights
    ctx.fillStyle = lightColor;
    ctx.shadowColor = lightColor;
    ctx.shadowBlur = 14;
    ctx.fillRect(-w/2 + 2, h/2 - 7, 8, 5);
    ctx.fillRect(w/2 - 10, h/2 - 7, 8, 5);

    if (isHero) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fillRect(-w * 0.18, h * 0.12, w * 0.36, h * 0.08);
    }

    ctx.restore();
}
