<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #14061c;
            --bg-bottom: #05010c;
            --panel: rgba(19, 8, 29, 0.82);
            --panel-edge: rgba(73, 250, 255, 0.2);
            --accent: #49faff;

            --danger: #ff4d8d;
            --gold: #ffe082;
            --text: #f6f2ff;
            --muted: #b7abc9;

        html, body {
            width: 100%;
            height: 100%;

            overflow: hidden;
            background:

        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%, transparent 82%, rgba(255,255,255,0.03)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 4px);
            mix-blend-mode: screen;
            opacity: 0.45;

        canvas { display: block; touch-action: none; width: 100%; height: 100%; }

        .glass {

            backdrop-filter: blur(12px);
            border: 1px solid rgba(141, 77, 255, 0.28);

                inset 0 0 0 1px rgba(73, 250, 255, 0.08),

        .ui-btn {

            transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.18s ease;
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.12em;
            border-radius: 0.6rem;
        }

        .ui-btn:active { transform: skewX(-10deg) scale(0.95); filter: brightness(1.12); }
        .ui-btn,
        button {
            touch-action: manipulation;

        .hidden { display: none !important; }

        .hud-card {

            border: 1px solid rgba(73, 250, 255, 0.22);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 0 18px rgba(73, 250, 255, 0.1);
            border-radius: 1rem;
        }

        .hud-label,
        .hud-tip,
        .ui-subtitle,

            font-family: 'Rajdhani', sans-serif;
        }

        .hud-label {
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.42em;
            text-transform: uppercase;
        }

        .hud-tip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            align-self: center;
            color: rgba(246, 242, 255, 0.78);
            background: rgba(8, 4, 16, 0.54);
            border: 1px solid rgba(73, 250, 255, 0.14);
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hp-display {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            min-height: 2.2rem;
        }

        .hp-pip {
            width: 1.05rem;
            height: 1.05rem;
            background: radial-gradient(circle at 35% 35%, #fff7ff 0%, #ff8ce1 28%, #ff4d8d 68%, #7a123f 100%);
            clip-path: polygon(50% 92%, 2% 46%, 18% 16%, 37% 20%, 50% 34%, 63% 20%, 82% 16%, 98% 46%);
            filter: drop-shadow(0 0 6px rgba(255, 77, 141, 0.5));
        }

        .boss-name,
        .screen-title {
            font-family: 'Audiowide', sans-serif;
            text-transform: uppercase;
        }

        .screen-title {
            line-height: 0.9;
        }

        .screen-frame {
            position: absolute;
            inset: 1.2rem;
            border: 1px solid rgba(73, 250, 255, 0.12);
            border-radius: 1.5rem;
            pointer-events: none;
            box-shadow: inset 0 0 60px rgba(73, 250, 255, 0.05);
        }

        @media (max-width: 768px) {
            #hud { padding: 0.85rem; }
            .hud-card { border-radius: 0.8rem; }
            .hud-label { font-size: 0.58rem; letter-spacing: 0.3em; }
            .hud-tip { font-size: 0.66rem; padding: 0.28rem 0.55rem; letter-spacing: 0.14em; }
            .hp-pip { width: 0.9rem; height: 0.9rem; }
            .screen-frame { inset: 0.7rem; border-radius: 1rem; }
        }
    </style>
</head>

<script>
/**
 * §2 Visual & Interaction Philosophy: High Energy, Neon, Fast
 * §3 Technical Core: Fixed Viewport, Pointer Events Only, Dpr Scaling
 */

// --- Configuration & State ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, VICTORY
let lastTime = 0;
let gameConfig = {};

// Default Config (Fallback)
const defaultConfig = {
    heroSpeed: 8, jumpForce: 14, gravity: 0.8,
    themeColor: '#b026ff', dragonHp: 15
};

const mediaState = {
    lastLandAt: 0,
    gifTimers: { hit: null, victory: null }
};

// --- Audio System (Robust & Fallback Ready) ---
const AudioSys = {
    ctx: null,
    unlocked: false,
    bgmStarted: false,
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
    },
    unlock() {
        if (!this.ctx) this.init();
        const afterUnlock = () => {
            this.unlocked = true;
            this.playBgm();
        };
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().then(afterUnlock).catch(() => {});
        } else {
            afterUnlock();
        }
    },
    playBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.2;
            if (gameState === 'PLAYING' && !this.bgmStarted) {
                this.bgmStarted = true;
                el.currentTime = 0;
            }
            if (gameState === 'PLAYING') {
                el.play().catch(() => {});
            }
        }
    },
    pauseBgm() {
        const el = document.getElementById('bgm_main');
        if (el) el.pause();
    },
    playSfx(id, synthType, options = {}) {
        if(!this.ctx) this.init();
        const el = document.getElementById(id);
        if (el && el.readyState >= 2) {
            if (!el.paused && !options.allowOverlap) {
                el.pause();
            }
            el.currentTime = 0;
            if (typeof options.volume === 'number') el.volume = options.volume;
            el.play().catch(() => this.synth(synthType));
        } else {
            this.synth(synthType);
        }
    },
    synth(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        const t = this.ctx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, t);
            osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.3);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
        } else if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.linearRampToValueAtTime(1200, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        }
    }
};

// --- Game Entities ---
let player = { x: 100, y: 0, w: 30, h: 50, vy: 0, grounded: false, hp: 3, jumps: 0, trail: [] };
let platforms = [];
let particles = [];
let projectiles = [];
let collectibles = [];
let bgStars = [];
let bgDebris = [];
let dragon = { x: 0, y: 0, w: 140, h: 90, hp: 10, maxHp: 10, t: 0, shootTimer: 0 };
let shake = 0;

function initEntities() {
    player = { x: 100, y: 200, w: 30, h: 50, vy: 0, grounded: false, wasGrounded: false, hp: 3, jumps: 0, trail: [] };
    platforms = [{ x: 0, y: canvas.height - 150, w: canvas.width, h: 150 }];
    particles = [];
    projectiles = [];
    collectibles = [];
    dragon.hp = dragon.maxHp = gameConfig.dragonHp || 15;
    dragon.x = canvas.width - 200;
    dragon.y = 100;
    shake = 0;
    
    // Init Parallax Layers
    bgStars = Array.from({length: 40}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: 0.2 + Math.random() * 0.5
    }));
    bgDebris = Array.from({length: 15}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 5 + Math.random() * 20,
        speed: 2 + Math.random() * 3,
        rot: Math.random() * Math.PI
    }));
    
    updateHUD();
}

function spawnPlatform() {
    const last = platforms[platforms.length - 1];
    const gap = 120 + Math.random() * 120;
    const w = 200 + Math.random() * 400;
    let y = last.y + (Math.random() * 160 - 80);
    y = Math.max(200, Math.min(canvas.height - 100, y)); // Clamp Y
    
    platforms.push({ x: last.x + last.w + gap, y: y, w: w, h: 60 });
    
    // Spawn Collectible (Energy Crystal)
    if (Math.random() < 0.5) {
        collectibles.push({
            x: last.x + last.w + gap + w/2,
            y: y - 60,
            w: 20, h: 20,
            active: true
        });
    }
}

// --- Physics & Logic ---
function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    const cfg = gameConfig;
    
    // Player Physics
    player.vy += cfg.gravity;
    player.y += player.vy;
    
    // Trail logic
    if (frames % 3 === 0) {
        player.trail.push({x: player.x, y: player.y, alpha: 0.6});
        if (player.trail.length > 5) player.trail.shift();
    }
    
    // Platform Collision
    player.wasGrounded = player.grounded;
    player.grounded = false;
    platforms.forEach(p => {
        if (player.vy > 0 && 
            player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 10) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
            player.jumps = 0;
        }
    });

    if (!player.wasGrounded && player.grounded) {
        const now = performance.now();
        if (now - mediaState.lastLandAt > 180) {
            mediaState.lastLandAt = now;
            AudioSys.playSfx('sfx_land', null, { volume: 0.32 });
        }
    }

    // Void Death
    if (player.y > canvas.height + 100) gameOver("LOST IN THE VOID");

    // Scroll World
    const speed = cfg.heroSpeed;
    platforms.forEach(p => p.x -= speed);
    collectibles.forEach(c => c.x -= speed);
    projectiles.forEach(p => p.x -= (speed + 8));
    
    // Parallax Update
    bgStars.forEach(s => {
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
    });
    bgDebris.forEach(d => {
        d.x -= d.speed;
        d.rot += 0.02;
        if (d.x < -50) {
            d.x = canvas.width + 50;
            d.y = Math.random() * canvas.height;
        }
    });

    // Cleanup & Spawn
    if (platforms[0].x + platforms[0].w < -100) platforms.shift();
    if (platforms.length < 4) spawnPlatform();
    
    // Dragon AI
    dragon.t += dt * 0.003;
    dragon.y = 100 + Math.sin(dragon.t) * 80;
    dragon.shootTimer -= dt;
    if (dragon.shootTimer <= 0) {
        dragon.shootTimer = 1500 + Math.random() * 1000;
        projectiles.push({ x: dragon.x, y: dragon.y + 40, w: 30, h: 30 });
        AudioSys.playSfx('sfx_shoot', null, { volume: 0.22 });
        shake = 5;
    }
    
    // Collisions
    // 1. Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        if (rectIntersect(player, p)) {
            player.hp--;
            shake = 20;
            AudioSys.playSfx('sfx_hit', 'hit', { volume: 0.42 });
            triggerGif('hit-gif', 800);
            projectiles.splice(i, 1);
            updateHUD();
            if (player.hp <= 0) gameOver("BURNED BY VOID FIRE");
        } else if (p.x < -50) {
            projectiles.splice(i, 1);
        }
    }
    
    // 2. Collectibles (Damage Dragon)
    for (let i = collectibles.length - 1; i >= 0; i--) {
        let c = collectibles[i];
        if (c.active && rectIntersect(player, c)) {
            c.active = false;
            dragon.hp--;
            AudioSys.playSfx('sfx_collect', 'collect', { volume: 0.34 });
            addParticles(c.x, c.y, 10, '#fff');
            updateHUD();
            if (dragon.hp <= 0) victory();
        } else if (c.x < -50) {
            collectibles.splice(i, 1);
        }
    }
    
    // Particles
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if(p.life <= 0) particles.splice(i, 1);
    });
    
    if (shake > 0) shake *= 0.9;
    if (shake < 0.5) shake = 0;
}

function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}

function addParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
            life: 1, color, size: Math.random()*4+2
        });
    }
}

// --- Drawing ---
function draw() {
    // Clear & Shake
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d0412';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.translate(sx, sy);
    
    // Parallax Layer 1 (Stars)
    ctx.fillStyle = '#ffffff';
    bgStars.forEach(s => {
        ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    });
    
    // Parallax Layer 2 (Debris - Geometric)
    ctx.fillStyle = '#2a1a35';
    bgDebris.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.beginPath();
        ctx.moveTo(-d.size, -d.size);
        ctx.lineTo(d.size, -d.size);
        ctx.lineTo(0, d.size);
        ctx.fill();
        ctx.restore();
    });
    ctx.globalAlpha = 1.0;

    // Platforms (Neon Edges)
    ctx.shadowBlur = 0;
    platforms.forEach(p => {
        ctx.fillStyle = '#000';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = gameConfig.themeColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    });
    
    // Player (Trail + Body)
    ctx.fillStyle = gameConfig.themeColor;
    player.trail.forEach(t => {
        ctx.globalAlpha = t.alpha;
        ctx.fillRect(t.x, t.y, player.w, player.h);
        t.alpha -= 0.05;
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // Visor
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(player.x + 15, player.y + 10, 15, 10);
    
    // Dragon
    if (dragon.hp > 0) {
        const dx = dragon.x, dy = dragon.y;
        ctx.fillStyle = '#111';
        // Wings
        ctx.beginPath();
        ctx.moveTo(dx + 40, dy + 20);
        ctx.lineTo(dx - 60, dy - 40 + Math.sin(Date.now()*0.01)*30);
        ctx.lineTo(dx + 20, dy + 60);
        ctx.fill();
        // Head
        ctx.fillStyle = '#222';
        ctx.fillRect(dx, dy, 100, 60);
        ctx.fillStyle = gameConfig.themeColor;
        ctx.shadowBlur = 20;
        ctx.shadowColor = gameConfig.themeColor;
        ctx.fillRect(dx - 10, dy + 20, 20, 10); // Eye
        ctx.shadowBlur = 0;
    }
    
    // Projectiles
    ctx.fillStyle = '#ff0055';
    projectiles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();
    });
    
    // Collectibles
    ctx.fillStyle = '#00ffff';
    collectibles.forEach(c => {
        if(!c.active) return;
        const cy = c.y + Math.sin(Date.now()*0.005)*5;
        ctx.beginPath();
        ctx.moveTo(c.x, cy + 10);
        ctx.lineTo(c.x + 10, cy);
        ctx.lineTo(c.x + 20, cy + 10);
        ctx.lineTo(c.x + 10, cy + 20);
        ctx.fill();
    });
    
    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

// --- Game Loop ---
function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    frames++;
    
    try {
        update(dt);
        draw();
    } catch (e) { console.error(e); }
    
    requestAnimationFrame(gameLoop);
}
let frames = 0;

// --- Interaction & Events ---
function jump() {
    if (gameState !== 'PLAYING') return;
    AudioSys.unlock();
    
    if (player.grounded || player.jumps < 2) {
        player.vy = -gameConfig.jumpForce;
        player.jumps++;
        player.grounded = false;
        AudioSys.playSfx('sfx_jump', 'jump', { volume: 0.3 });
        addParticles(player.x + player.w/2, player.y + player.h, 8, '#fff');
    }
}

function triggerGif(id, duration = 1200) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('hidden');
    clearTimeout(mediaState.gifTimers[id]);
    mediaState.gifTimers[id] = setTimeout(() => {
        el.classList.add('hidden');
    }, duration);
}

function gameOver(msg) {
    gameState = 'GAMEOVER';
    AudioSys.pauseBgm();
    AudioSys.playSfx('sfx_game_over', null, { volume: 0.38 });
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('go-title').innerText = "SYNC LOST";
    document.getElementById('go-msg').innerText = msg;
    document.getElementById('victory-gif').classList.add('hidden');
}

function victory() {
    gameState = 'VICTORY';
    AudioSys.pauseBgm();
    AudioSys.playSfx('sfx_victory', null, { volume: 0.4 });
    triggerGif('victory-gif', 3200);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('go-title').innerText = "WYRM DISRUPTED";
    document.getElementById('go-msg').innerText = "THE BREACH GOES QUIET";
}

function updateHUD() {
    const hpEl = document.getElementById('playerHp');
    hpEl.innerHTML = "";
    for (let i = 0; i < player.hp; i++) {
        const pip = document.createElement('span');
        pip.className = 'hp-pip';
        pip.setAttribute('aria-hidden', 'true');
        hpEl.appendChild(pip);
    }
    if (player.hp <= 0) {
        hpEl.textContent = "";
    }
    const pct = Math.max(0, (dragon.hp / dragon.maxHp) * 100);
    document.getElementById('bossBar').style.width = pct + "%";
}

// --- Initialization ---
window.addEventListener('DOMContentLoaded', () => {
    // 1. Parse Config
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        Object.keys(raw).forEach(k => gameConfig[k] = raw[k].value);
    } catch(e) { gameConfig = defaultConfig; }
    
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.updateGameConfig = (k, v) => { if(gameConfig.hasOwnProperty(k)) gameConfig[k] = v; };

    // 2. Resize
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', resize);
    resize();
    initEntities();

    // 3. Input Binding
    const bindBtn = (id, cb) => {
        const el = document.getElementById(id);
        if (!el) return;
        let handledPointer = false;
        const activate = () => cb();

        // [agent-note][stage4] repaired: mobile-action-path | element: start/restart buttons | action: pointer primary + click fallback without double-trigger
        el.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary) return;
            handledPointer = true;
            e.preventDefault();
            e.stopPropagation();
            activate();
            setTimeout(() => {
                handledPointer = false;
            }, 350);
        });

        el.addEventListener('click', (e) => {
            if (handledPointer) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            e.preventDefault();
            e.stopPropagation();
            activate();
        });
    };

    // Start Button
    bindBtn('start-btn', () => {
        AudioSys.playSfx('sfx_ui_start', null, { volume: 0.32 });
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        initEntities();
        gameState = 'PLAYING';
        AudioSys.unlock();
    });

    // Restart Button
    bindBtn('restart-btn', () => {
        AudioSys.playSfx('sfx_ui_restart', null, { volume: 0.28 });
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('victory-gif').classList.add('hidden');
        initEntities();
        gameState = 'PLAYING';
        AudioSys.unlock();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            AudioSys.pauseBgm();
        } else if (gameState === 'PLAYING' && AudioSys.unlocked) {
            AudioSys.playBgm();
        }
    });

    // Jump Input (Canvas)
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        jump();
    });

    // Start Loop
    requestAnimationFrame(gameLoop);
});
</script>
