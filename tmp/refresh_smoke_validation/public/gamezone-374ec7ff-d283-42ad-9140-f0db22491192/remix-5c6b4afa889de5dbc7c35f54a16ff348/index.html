<script>
/* 
 * PET PARK RUSH - Core Logic
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = window.devicePixelRatio || 1;

// State
let gameState = 'START';
let lastTime = 0;
let money = 0;
let incomeRate = 0;
let incomeTimer = 0;
let entities = [];
let particles = [];
let floatingTexts = [];
let camX = 0, camY = 0;
let worldBounds = 1200;

// Input
const input = { x: 0, y: 0, active: false, startX: 0, startY: 0 };

// Config
const CONFIG = {
    heroSpeed: 7,
    enemySpeed: 3.5,
    spawnRate: 40,
    treeCount: 40,
    grassCount: 80
};

// Data
const PETS = [
    { id: 'cat', name: 'Cat Walker', cost: 50, income: 15, color: '#9ca3af', h: 12 },
    { id: 'dog', name: 'Dog Duo', cost: 120, income: 35, color: '#d97706', h: 14 },
    { id: 'fox', name: 'Fox Friend', cost: 300, income: 60, color: '#f97316', h: 13 },
    { id: 'panda', name: 'Panda Pal', cost: 600, income: 100, color: '#1f2937', h: 15 }
];

// Audio
const AudioMgr = {
    ctx: null,
    sounds: {},
    initialized: false,
    lastPlayed: {},
    init() {
        if (this.initialized) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
            this.load('bgm', 'bgm_main', 0.2);
            this.load('coin', 'sfx_coin', 0.55);
            this.load('buy', 'sfx_buy', 0.48);
            this.load('hit', 'sfx_hit', 0.5);
            this.load('fail', 'sfx_fail', 0.52);
            this.load('start', 'sfx_start', 0.46);
            this.initialized = true;
        } catch(e) {}
    },
    load(key, id, volume = 0.5) {
        const el = document.getElementById(id);
        if(!el) return;
        el.volume = volume;
        if(key === 'bgm') {
            this.sounds[key] = { el, type: 'bgm' };
        } else {
            this.sounds[key] = { el, type: 'sfx', volume };
        }
    },
    play(key, minGap = 0) {
        if(!this.ctx) return;
        const now = performance.now();
        if (minGap && this.lastPlayed[key] && now - this.lastPlayed[key] < minGap) return;
        this.lastPlayed[key] = now;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const s = this.sounds[key];
        if(!s) return;
        if(s.type === 'bgm') {
            s.el.currentTime = s.el.currentTime || 0;
            s.el.play().catch(()=>{});
        } else if(s.type === 'sfx' && s.el) {
            const clip = s.el.cloneNode();
            clip.volume = s.volume ?? 0.5;
            clip.play().catch(()=>{});
        }
    },
    stop(key) {
        const s = this.sounds[key];
        if (s?.type === 'bgm') s.el.pause();
    }
};

// Utils
function darken(col, amt) {
    let usePound = false;
    if (col[0] == "#") { col = col.slice(1); usePound = true; }
    let num = parseInt(col, 16);
    let r = (num >> 16) + amt * -1;
    let b = ((num >> 8) & 0x00FF) + amt * -1;
    let g = (num & 0x0000FF) + amt * -1;
    if (r > 255) r = 255; else if (r < 0) r = 0;
    if (b > 255) b = 255; else if (b < 0) b = 0;
    if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6,'0');
}

// Drawing Voxel
function drawVoxel(ctx, x, y, z, w, h, d, color, shadow=true) {
    const sx = x - w/2;
    const sy = y - h/2 - z;
    
    // Shadow
    if (shadow && z < 10) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y, w/1.4, h/2.5, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // Front
    ctx.fillStyle = darken(color, 20);
    ctx.fillRect(sx, sy - d, w, d);
    
    // Top
    ctx.fillStyle = color;
    ctx.fillRect(sx, sy - d - h, w, h);
    
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(sx, sy - d - h, w, h*0.2);
}

// Entities
class Entity {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.z = 0;
        this.vz = 0;
        this.w = 30; this.h = 30; this.d = 30;
        this.color = '#fff';
        this.del = false;
        
        if (type === 'player') {
            this.color = '#4d7cff';
            this.d = 40;
            this.radius = 20;
        } else if (type === 'coin') {
            this.color = '#ffe066';
            this.w = 16; this.h = 16; this.d = 6;
            this.z = 10;
        } else if (type === 'tree') {
            this.w = 16; this.h = 16; this.d = 20; // Trunk dims
            this.radius = 25; // Collision radius
        } else if (type === 'grass_tuft') {
            this.w = 8; this.h = 8; this.d = 6;
            this.color = '#22c55e'; // Darker green
        } else if (type === 'enemy') {
            this.color = '#ff5f70';
            this.w = 34; this.h = 34; this.d = 34;
            this.radius = 20;
        } else {
            // Pet
            const p = PETS.find(pt => pt.id === type);
            if(p) {
                this.color = p.color;
                this.w = 20; this.h = 20; this.d = p.h * 2;
            }
        }
    }

    update(dt) {
        if (this.type === 'player') {
            if (input.active) {
                const len = Math.sqrt(input.x * input.x + input.y * input.y);
                if (len > 0) {
                    let nx = this.x + (input.x / len) * CONFIG.heroSpeed;
                    let ny = this.y + (input.y / len) * CONFIG.heroSpeed;
                    
                    // Tree Collision
                    let collided = false;
                    entities.forEach(e => {
                        if (e.type === 'tree') {
                            const dx = nx - e.x;
                            const dy = ny - e.y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const minD = this.radius + e.radius;
                            if (dist < minD) {
                                // Push out
                                const push = minD - dist;
                                nx += (dx/dist) * push;
                                ny += (dy/dist) * push;
                            }
                        }
                    });

                    this.x = Math.max(-worldBounds, Math.min(worldBounds, nx));
                    this.y = Math.max(-worldBounds, Math.min(worldBounds, ny));
                }
            }
            camX += (this.x - camX) * 0.1;
            camY += (this.y - camY) * 0.1;

        } else if (this.type === 'coin') {
            this.z = 8 + Math.sin(Date.now()/200) * 3;
            // Magnet
            const p = entities[0]; // Player is always 0
            const dx = this.x - p.x;
            const dy = this.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
                this.x -= dx * 0.1;
                this.y -= dy * 0.1;
            }
            if (dist < 40) this.collect();

        } else if (this.type === 'enemy') {
            const p = entities[0];
            const dx = p.x - this.x;
            const dy = p.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Simple pathfinding (avoid trees slightly)
            let moveX = (dx/dist);
            let moveY = (dy/dist);
            
            this.x += moveX * CONFIG.enemySpeed;
            this.y += moveY * CONFIG.enemySpeed;
            
            // Hop
            if (this.z <= 0 && Math.random() < 0.02) this.vz = 6;
            this.z += this.vz;
            this.vz -= 0.5;
            if (this.z < 0) { this.z = 0; this.vz = 0; }

            if (dist < 35) {
                hitPlayer();
                this.x -= dx * 3; 
                this.y -= dy * 3;
            }

        } else if (this.type === 'tree' || this.type === 'grass_tuft') {
            // Static
        } else {
            // Pet
            const p = entities[0];
            const dx = (p.x + Math.sin(Date.now()/600 + this.x)*70) - this.x;
            const dy = (p.y + Math.cos(Date.now()/600 + this.y)*70) - this.y;
            this.x += dx * 0.08;
            this.y += dy * 0.08;
            
            if (this.z <= 0 && Math.random() < 0.03) this.vz = 4;
            this.z += this.vz;
            this.vz -= 0.5;
            if (this.z < 0) { this.z = 0; this.vz = 0; }
        }
    }

    collect() {
        this.del = true;
        addMoney(10 + Math.floor(Math.random()*15));
        AudioMgr.play('coin');
        spawnParticles(this.x, this.y, '#fbbf24', 8);
    }

    draw(ctx) {
        if (this.type === 'tree') {
            drawVoxel(ctx, this.x, this.y, 0, this.w, this.h, this.d, '#6b3a17');
            drawVoxel(ctx, this.x, this.y, this.d, 50, 50, 40, '#0f8a53', false);
            ctx.fillStyle = 'rgba(187,247,255,0.08)';
            ctx.fillRect(this.x - 25, this.y - this.d - 52, 50, 10);
        } else if (this.type === 'grass_tuft') {
            drawVoxel(ctx, this.x, this.y, 0, 10, 10, 8, '#0b5f3b', false);
        } else {
            if (this.type === 'player') {
                ctx.save();
                ctx.shadowColor = '#4d7cff';
                ctx.shadowBlur = 24;
                drawVoxel(ctx, this.x, this.y, this.z, this.w, this.h, this.d, this.color);
                ctx.restore();
                const sx = this.x - this.w/2;
                const sy = this.y - this.h/2 - this.z - this.d;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(sx + 7, sy + 5, 4, 4);
                ctx.fillRect(sx + this.w - 11, sy + 5, 4, 4);
                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(sx + 9, sy + 11, this.w - 18, 3);
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.fillRect(sx + 4, sy + 2, this.w - 8, 4);
            } else if (this.type === 'coin') {
                ctx.save();
                ctx.shadowColor = '#ffe066';
                ctx.shadowBlur = 18;
                drawVoxel(ctx, this.x, this.y, this.z, this.w, this.h, this.d, this.color);
                ctx.restore();
                const sx = this.x - this.w/2;
                const sy = this.y - this.h/2 - this.z - this.d;
                ctx.fillStyle = '#b45309';
                ctx.fillRect(sx + 5, sy + 4, this.w - 10, 2);
                ctx.fillRect(sx + 7, sy + 8, this.w - 14, 2);
            } else {
                drawVoxel(ctx, this.x, this.y, this.z, this.w, this.h, this.d, this.color);
                if (this.type !== 'coin') {
                    const sx = this.x - this.w/2;
                    const sy = this.y - this.h/2 - this.z - this.d;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(sx + 6, sy + 6, 4, 4);
                    ctx.fillRect(sx + this.w - 10, sy + 6, 4, 4);
                    if (this.type === 'enemy') {
                        ctx.fillStyle = '#7f1d1d';
                        ctx.fillRect(sx + 8, sy + 13, this.w - 16, 3);
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.18)';
                        ctx.fillRect(sx + 5, sy + 3, this.w - 10, 3);
                    }
                }
            }
        }
    }
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y, z: 10,
            vx: (Math.random()-0.5)*12,
            vy: (Math.random()-0.5)*12,
            vz: Math.random()*12,
            life: 1.0,
            color
        });
    }
}

function showFeedbackGif(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('active');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('active'), duration);
}

function addMoney(amt) {
    money += amt;
    updateUI();
    const p = entities[0];
    floatingTexts.push({
        x: p.x, y: p.y - 60, z: 60,
        text: (amt>=0?"+":"")+"$"+amt,
        life: 1.0,
        color: amt>=0?'#fbbf24':'#ef4444'
    });
    if (amt > 0) {
        showFeedbackGif('celebration-gif', 780);
    } else if (amt < 0) {
        showFeedbackGif('danger-gif', 950);
    }
}

function hitPlayer() {
    AudioMgr.play('hit', 160);
    AudioMgr.play('fail', 240);
    addMoney(-50);
    camX += (Math.random()-0.5)*30;
    camY += (Math.random()-0.5)*30;
    spawnParticles(entities[0].x, entities[0].y, '#ef4444', 15);
    if(money < 0) gameOver();
}

function buyPet(id) {
    const p = PETS.find(x => x.id === id);
    if (money >= p.cost) {
        money -= p.cost;
        incomeRate += p.income;
        AudioMgr.play('buy', 120);
        const hero = entities[0];
        const pet = new Entity(id, hero.x, hero.y - 100);
        pet.z = 100;
        entities.push(pet);
        spawnParticles(hero.x, hero.y, p.color, 20);
        showFeedbackGif('celebration-gif', 1100);
        updateUI();
    } else {
        AudioMgr.play('fail', 220);
        showFeedbackGif('danger-gif', 900);
    }
}

function updateUI() {
    document.getElementById('scoreVal').innerText = money;
    document.getElementById('incomeVal').innerText = incomeRate;
    document.getElementById('finalScore').innerText = money;
    
    const shopDiv = document.getElementById('shop-bar');
    shopDiv.innerHTML = '';
    PETS.forEach(pet => {
        const btn = document.createElement('div');
        btn.className = `shop-item ${money < pet.cost ? 'disabled' : ''}`;
        btn.innerHTML = `
            <div style="width:24px; height:24px; background:${pet.color}; border-radius:4px; margin-bottom:4px; box-shadow:0 2px 0 rgba(0,0,0,0.2);"></div>
            <div class="font-bold text-xs mb-1">${pet.name}</div>
            <div class="shop-price">$${pet.cost}</div>
            <div class="shop-income">+${pet.income}/s</div>
        `;
        btn.onclick = (e) => {
            e.stopPropagation();
            buyPet(pet.id);
        };
        shopDiv.appendChild(btn);
    });
}

function gameOver() {
    gameState = 'GAMEOVER';
    AudioMgr.stop('bgm');
    AudioMgr.play('fail', 300);
    showFeedbackGif('danger-gif', 1400);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('shop-bar').classList.add('hidden');
}

function resetGame() {
    money = 0;
    incomeRate = 0;
    
    // Reset Entities: Player first
    entities = [new Entity('player', 0, 0)];
    
    // Spawn Trees
    for(let i=0; i<CONFIG.treeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * (worldBounds - 150);
        entities.push(new Entity('tree', Math.cos(angle)*dist, Math.sin(angle)*dist));
    }
    
    // Spawn Grass Tufts
    for(let i=0; i<CONFIG.grassCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * worldBounds;
        entities.push(new Entity('grass_tuft', Math.cos(angle)*dist, Math.sin(angle)*dist));
    }

    particles = [];
    floatingTexts = [];
    camX = 0; camY = 0;
    gameState = 'PLAY';
    
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('shop-bar').classList.remove('hidden');
    updateUI();
}

// Main Loop
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    if (gameState === 'PLAY') {
        incomeTimer += dt;
        if (incomeTimer >= 1.0) {
            if (incomeRate > 0) {
                money += incomeRate;
                updateUI();
                floatingTexts.push({
                    x: entities[0].x, y: entities[0].y - 60, z: 60,
                    text: "+$" + incomeRate, life: 1.0, color: '#10b981'
                });
            }
            incomeTimer = 0;
        }

        // Spawn Coins
        if (Math.random() < CONFIG.spawnRate * 0.001) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 400;
            entities.push(new Entity('coin', entities[0].x + Math.cos(angle)*dist, entities[0].y + Math.sin(angle)*dist));
        }
        // Spawn Enemies
        if (Math.random() < 0.003) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 500 + Math.random() * 300;
            entities.push(new Entity('enemy', entities[0].x + Math.cos(angle)*dist, entities[0].y + Math.sin(angle)*dist));
        }

        entities.forEach(e => e.update(dt));
        entities = entities.filter(e => !e.del);
        
        // Z-Sort
        entities.sort((a, b) => a.y - b.y);

        // Particles
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.z += p.vz;
            p.vz -= 0.5;
            if (p.z < 0) { p.z = 0; p.vz *= -0.5; p.vx *= 0.8; p.vy *= 0.8; }
            p.life -= dt;
        });
        particles = particles.filter(p => p.life > 0);

        // Text
        floatingTexts.forEach(t => { t.z += 30*dt; t.life -= dt; });
        floatingTexts = floatingTexts.filter(t => t.life > 0);
    }

    // Render
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Clear with Grass Green
    const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / dpr);
    bgGradient.addColorStop(0, '#76f2aa');
    bgGradient.addColorStop(0.5, '#39cf7b');
    bgGradient.addColorStop(1, '#137546');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const cx = canvas.width / dpr / 2;
    const cy = canvas.height / dpr / 2;
    
    ctx.save();
    ctx.translate(cx - camX, cy - camY);

    // Draw Lawn Grid
    ctx.strokeStyle = 'rgba(12, 111, 68, 0.38)';
    ctx.lineWidth = 2;
    const gridSize = 100;
    const startX = Math.floor((camX - cx)/gridSize)*gridSize;
    const startY = Math.floor((camY - cy)/gridSize)*gridSize;
    const endX = startX + canvas.width/dpr + gridSize*2;
    const endY = startY + canvas.height/dpr + gridSize*2;
    
    ctx.beginPath();
    for(let x=startX; x<endX; x+=gridSize) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
    for(let y=startY; y<endY; y+=gridSize) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
    ctx.stroke();

    // Draw Objects
    entities.forEach(e => e.draw(ctx));

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const s = p.life * 6;
        ctx.fillRect(p.x - s/2, p.y - p.z - s/2, s, s);
    });

    // Draw Text
    ctx.font = "700 20px 'Exo 2'";
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth = 3;
    floatingTexts.forEach(t => {
        ctx.save();
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life;
        ctx.strokeText(t.text, t.x, t.y - t.z);
        ctx.fillText(t.text, t.x, t.y - t.z);
        ctx.restore();
    });

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

// Input
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');

function handleStart(x, y) {
    if (gameState !== 'PLAY') return;
    input.active = true;
    input.startX = x;
    input.startY = y;
    
    joyKnob.style.display = 'block';
    joyKnob.style.transform = `translate(-50%, -50%)`;
    joyKnob.style.left = x + 'px';
    joyKnob.style.top = y + 'px';
}

function handleMove(x, y) {
    if (!input.active) return;
    const dx = x - input.startX;
    const dy = y - input.startY;
    input.x = dx;
    input.y = dy;
    
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = 40;
    const vx = (dist > maxDist ? (dx/dist)*maxDist : dx);
    const vy = (dist > maxDist ? (dy/dist)*maxDist : dy);
    
    joyKnob.style.transform = `translate(calc(-50% + ${vx}px), calc(-50% + ${vy}px))`;
}

function handleEnd() {
    input.active = false;
    input.x = 0; input.y = 0;
    joyKnob.style.display = 'none';
}

const gameplaySurface = document.getElementById('game-container');
const shouldHandleGameplayPointer = (target) => {
    if (gameState !== 'PLAY') return false;
    if (target.closest('#shop-bar, #start-screen, #game-over-screen, button')) return false;
    return !!target.closest('#gameCanvas, #joystick-zone');
};

gameplaySurface.addEventListener('pointerdown', e => {
    if (!shouldHandleGameplayPointer(e.target)) return;
    e.preventDefault();
    handleStart(e.clientX, e.clientY);
    AudioMgr.play('bgm');
}, { passive: false });

gameplaySurface.addEventListener('pointermove', e => {
    if (!input.active) return;
    e.preventDefault();
    handleMove(e.clientX, e.clientY);
}, { passive: false });

window.addEventListener('pointerup', handleEnd);
window.addEventListener('pointercancel', handleEnd);

// Init
window.addEventListener('DOMContentLoaded', () => {
    const resize = () => {
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
    };
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('start-btn').onclick = () => {
        AudioMgr.init();
        AudioMgr.play('start', 200);
        AudioMgr.play('bgm');
        resetGame();
    };
    document.getElementById('restart-btn').onclick = () => {
        AudioMgr.init();
        AudioMgr.play('start', 200);
        AudioMgr.play('bgm');
        resetGame();
    };
    
    requestAnimationFrame(gameLoop);
});
</script>
