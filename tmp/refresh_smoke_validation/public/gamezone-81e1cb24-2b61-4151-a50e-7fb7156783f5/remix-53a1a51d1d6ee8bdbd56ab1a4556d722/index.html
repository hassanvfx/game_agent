<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panda Pickup Patrol</title>
<link rel="stylesheet" href="assets/fonts.googleapis.com/css2-family_Fredoka_wght_400_600_display_swap.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
    :root {
        --sky-top: #0f173c;
        --sky-bottom: #182c66;
        --grass: #173c2b;
        --road: #2e3554;
        --road-edge: #7ad3ff;
        --lane: #f6f1a8;
        --glass-bg: rgba(12, 20, 48, 0.72);
        --glass-border: rgba(122, 211, 255, 0.62);
        --text-dark: #eef7ff;
        --text-muted: #bfd4ef;
        --accent: #ffdd57;
        --accent-strong: #ff9e3d;
        --accent-soft: #7affc8;
        --overlay: rgba(2, 6, 23, 0.62);
        --shadow: rgba(3, 10, 26, 0.48);
        --gif-glow: rgba(255, 221, 87, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        font-family: 'Fredoka', system-ui, sans-serif;
    }

    body {
        position: relative;
        color: var(--text-dark);
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 50% 18%, rgba(122, 211, 255, 0.16), transparent 26%),
            radial-gradient(circle at 20% 8%, rgba(255, 221, 87, 0.1), transparent 18%),
            linear-gradient(180deg, transparent, rgba(3, 10, 26, 0.14));
        pointer-events: none;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .glass {
        background: linear-gradient(180deg, rgba(17, 28, 63, 0.88), rgba(8, 15, 36, 0.76));
        backdrop-filter: blur(10px);
        border: 2px solid var(--glass-border);
        box-shadow:
            0 12px 28px var(--shadow),
            inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .hidden { display: none !important; }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
    }

    #game-container::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 78%, rgba(122, 255, 200, 0.1), transparent 24%),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 74px);
        pointer-events: none;
        opacity: 0.85;
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        pointer-events: none;
    }

    #ui-layer > * { pointer-events: auto; }

    #hud {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        gap: 12px;
    }

    .score-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
    }

    .score-icon {
        font-size: 1.9rem;
        line-height: 1;
        filter: drop-shadow(0 0 8px rgba(255, 221, 87, 0.35));
    }

    #score-display {
        font-family: 'Press Start 2P', monospace;
        font-size: 1.15rem;
        line-height: 1.2;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(255, 221, 87, 0.35);
        min-width: 2.6ch;
    }

    #tutorial {
        padding: 10px 14px;
        border-radius: 16px;
        text-align: center;
        animation: pulse 1.3s ease-in-out infinite;
        max-width: min(52vw, 320px);
    }

    .tutorial-label,
    .result-copy {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        text-transform: uppercase;
        font-family: 'Fredoka', system-ui, sans-serif;
    }

    .feedback-stack {
        position: absolute;
        right: 12px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        z-index: 65;
        pointer-events: none;
    }

    .feedback-gif {
        width: clamp(76px, 18vw, 116px);
        height: clamp(76px, 18vw, 116px);
        object-fit: cover;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.14);
        background: rgba(5, 10, 26, 0.5);
        box-shadow: 0 10px 22px var(--shadow), 0 0 18px var(--gif-glow);
        opacity: 0;
        transform: translateY(8px) scale(0.94);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .feedback-gif.is-visible {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }

    .feedback-gif.fail-gif {
        width: clamp(90px, 22vw, 132px);
        height: clamp(90px, 22vw, 132px);
        border-color: rgba(255, 158, 61, 0.32);
    }

    #game-over-screen {
        position: absolute;
        inset: 0;
        background: var(--overlay);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(6px);
        padding: 16px;
    }

    .game-over-card {
        width: min(100%, 320px);
        max-height: 90vh;
        padding: 28px 22px;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
    }

    .wiggle { animation: wiggle 2s linear infinite; }

    .result-icon {
        font-size: 4rem;
        line-height: 1;
        filter: drop-shadow(0 0 14px rgba(122, 211, 255, 0.4));
    }

    .result-title {
        margin: 0;
        color: var(--text-dark);
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: clamp(1.3rem, 5vw, 1.8rem);
        line-height: 1.25;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    #final-score {
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(2rem, 8vw, 2.8rem);
        line-height: 1.25;
        font-weight: 400;
        color: var(--accent-soft);
        text-shadow: 0 0 12px rgba(122, 255, 200, 0.3);
        margin: 8px 0 0;
    }

    #restart-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffd95a, #ff9e3d);
        color: #1f2336;
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.4;
        letter-spacing: 0.05em;
        padding: 16px 18px;
        box-shadow: 0 10px 24px rgba(255, 158, 61, 0.3);
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
    }

    #restart-btn:hover {
        filter: brightness(1.05);
    }

    #restart-btn:active {
        transform: scale(0.97);
    }

    @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.9; }
    }

    @media (max-width: 560px) {
        #ui-layer { padding: 12px; }
        #hud { gap: 8px; }
        .score-pill { padding: 8px 14px; }
        #score-display { font-size: 0.95rem; }
        #tutorial { max-width: 58vw; padding: 8px 12px; }
        .tutorial-label { font-size: 0.84rem; }
        .game-over-card { padding: 24px 18px; }
        #restart-btn { font-size: 0.88rem; }
        .feedback-stack {
            right: 10px;
            bottom: 12px;
        }
    }
</style>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud">
            <div class="glass score-pill">
                <span class="score-icon">🐼</span>

            </div>

                <span class="tutorial-label">Slide to steer the patrol bus.</span>

        <!-- [agent-note][stage4] repaired-font: title/ui/body -> Fredoka local mirror, counters -> Press Start 2P catalog -->

<script>
// --- §0 Core Systems & Constants ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;

// State
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameTime = 0;
let score = 0;
let lastTime = 0;
let frameCount = 0;

// Config
window.gameConfig = { busSpeed: 6, spawnRate: 1.5, themeColor: "#FFD700" };
window.gameConfigDefs = {};

// Entities
let bus = { x: 0, y: 0, w: 0, h: 0, targetX: 0, tilt: 0 };
let entities = []; // obstacles and collectibles
let particles = [];
let roadOffset = 0;

// Audio
let bgmStarted = false;
let audioUnlocked = false;
const sfxCooldowns = new Map();
const gifTimers = new Map();

// --- §1 Lifecycle & Initialization ---

window.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    resize();
    initGame();
    setState('PLAYING');
    requestAnimationFrame(loop);
});

window.addEventListener('resize', () => {
    resize();
    if (gameState === 'PLAYING') {
        bus.y = ch - bus.h - ch * 0.1;
    }
});

document.addEventListener('visibilitychange', () => {
    const bgm = document.getElementById('bgm_main');
    if (!bgm) return;
    if (document.hidden) {
        bgm.pause();
    } else if (audioUnlocked && gameState === 'PLAYING') {
        safePlayLoop();
    }
});

function parseConfig() {
    try {
        const el = document.getElementById('game-config');
        if (el) {
            const parsed = JSON.parse(el.textContent);
            window.gameConfigDefs = parsed;
            for (let key in parsed) {
                window.gameConfig[key] = parsed[key].value;
            }
        }
    } catch (e) { console.error("Config parse failed", e); }
}

function resize() {
    cw = document.documentElement.clientWidth;
    ch = document.documentElement.clientHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initGame() {
    score = 0;
    gameTime = 0;
    entities = [];
    particles = [];
    roadOffset = 0;
    hideFeedback('gif_collect');
    hideFeedback('gif_fail');

    const busW = Math.min(cw * 0.25, 120);
    const busH = busW * 1.6;
    bus = {
        x: cw / 2,
        y: ch - busH - ch * 0.15,
        w: busW,
        h: busH,
        targetX: cw / 2,
        tilt: 0,
        color: window.gameConfig.themeColor
    };

    updateHUD();
}

function setState(newState) {
    gameState = newState;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const tutorial = document.getElementById('tutorial');

    if (newState === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        tutorial.classList.remove('hidden');
        setTimeout(() => tutorial.classList.add('hidden'), 3000);
        if (audioUnlocked) safePlayLoop();
    } else if (newState === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        safePauseLoop();
        playSfx('sfx_gameover', 'gameOver');
        showFeedback('gif_fail', 1800);
    }
}

function restartGame() {
    playSfx('sfx_ui', 'ui');
    initGame();
    setState('PLAYING');
}

// --- §2 Input Handling ---

function handleGameplayPointerDown(e) {
    if (e.pointerType !== 'mouse') {
        unlockAudio();
    }

    if (gameState === 'PLAYING') {
        updateBusTarget(e);
    }
}

function updateBusTarget(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.clientX;
    if (e.type.startsWith('touch') && e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
    }

    const x = clientX - rect.left;
    const roadMargin = cw * 0.1;
    bus.targetX = Math.max(roadMargin + bus.w / 2, Math.min(cw - roadMargin - bus.w / 2, x));
}

canvas.addEventListener('pointerdown', handleGameplayPointerDown, { passive: true });
canvas.addEventListener('pointermove', (e) => {
    if (gameState === 'PLAYING' && e.buttons !== 0) {
        e.preventDefault();
        updateBusTarget(e);
    }
}, { passive: false });

document.getElementById('restart-btn')?.addEventListener('click', () => {
    unlockAudio();
    restartGame();
});

// --- §3 Game Logic ---

function loop(timestamp) {
    requestAnimationFrame(loop);
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    frameCount++;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Loop Error:", e);
        bus.x = cw / 2;
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    gameTime += dt;

    const lerpSpeed = 10 * dt;
    const diff = bus.targetX - bus.x;
    bus.x += diff * lerpSpeed;
    bus.tilt = diff * -0.05;

    if (!isFinite(bus.x)) bus.x = cw / 2;

    const speed = window.gameConfig.busSpeed * 60;
    roadOffset = (roadOffset + speed * dt) % 100;

    const spawnInterval = 3.5 / window.gameConfig.spawnRate;
    if (gameTime % spawnInterval < dt) {
        spawnEntity();
    }

    for (let i = entities.length - 1; i >= 0; i--) {
        let e = entities[i];
        e.y += speed * dt;

        if (checkCollision(bus, e)) {
            if (e.type === 'panda') {
                collectPanda(e);
                entities.splice(i, 1);
            } else if (e.type === 'obstacle') {
                crashBus();
            }
        } else if (e.y > ch + 100) {
            entities.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function spawnEntity() {
    const roadMargin = cw * 0.1;
    const roadW = cw - roadMargin * 2;
    const lanes = 3;
    const laneW = roadW / lanes;
    const lane = Math.floor(Math.random() * lanes);
    const spawnX = roadMargin + lane * laneW + laneW / 2;

    const type = Math.random() > 0.4 ? 'panda' : 'obstacle';

    entities.push({
        type: type,
        x: spawnX,
        y: -100,
        r: type === 'panda' ? 25 : 30,
        w: 50, h: 50
    });
}

function checkCollision(player, ent) {
    const dx = player.x - ent.x;
    const dy = (player.y + player.h / 2) - ent.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return dist < (player.w / 2 + ent.r - 10);
}

function collectPanda(ent) {
    score++;
    updateHUD();
    playSfx('sfx_collect', 'collect', 120);
    vibrate('light');
    showFeedback('gif_collect', 900);

    for (let i = 0; i < 8; i++) {
        particles.push({
            x: ent.x, y: ent.y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300,
            life: 0.8,
            color: '#FF69B4',
            type: 'heart'
        });
    }
}

function crashBus() {
    playSfx('sfx_crash', 'crash', 350);
    vibrate('heavy');

    for (let i = 0; i < 20; i++) {
        particles.push({
            x: bus.x, y: bus.y + bus.h / 2,
            vx: (Math.random() - 0.5) * 500,
            vy: (Math.random() - 0.5) * 500,
            life: 1.0,
            color: '#555',
            type: 'smoke'
        });
    }

    setState('GAMEOVER');
}

function updateHUD() {
    const el = document.getElementById('score-display');
    if (el) el.innerText = score;
}

// --- §4 Rendering ---

function draw() {
    const skyGradient = ctx.createLinearGradient(0, 0, 0, ch);
    skyGradient.addColorStop(0, '#0f173c');
    skyGradient.addColorStop(0.45, '#1c3775');
    skyGradient.addColorStop(1, '#14234f');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, cw, ch);

    const horizonY = ch * 0.24;
    ctx.fillStyle = 'rgba(122, 211, 255, 0.08)';
    for (let i = 0; i < 10; i++) {
        const w = cw * (0.05 + (i % 3) * 0.02);
        const x = (i / 10) * cw;
        const h = ch * (0.08 + (i % 4) * 0.03);
        ctx.fillRect(x, horizonY - h, w, h);
    }

    const roadMargin = cw * 0.1;
    const vergeGradient = ctx.createLinearGradient(0, 0, 0, ch);
    vergeGradient.addColorStop(0, '#205538');
    vergeGradient.addColorStop(1, '#102f1f');
    ctx.fillStyle = vergeGradient;
    ctx.fillRect(0, 0, roadMargin, ch);
    ctx.fillRect(cw - roadMargin, 0, roadMargin, ch);

    const roadGradient = ctx.createLinearGradient(roadMargin, 0, cw - roadMargin, 0);
    roadGradient.addColorStop(0, '#252d49');
    roadGradient.addColorStop(0.5, '#353f63');
    roadGradient.addColorStop(1, '#252d49');
    ctx.fillStyle = roadGradient;
    ctx.fillRect(roadMargin, 0, cw - roadMargin * 2, ch);

    ctx.strokeStyle = 'rgba(122, 211, 255, 0.5)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(roadMargin + 3, 0);
    ctx.lineTo(roadMargin + 3, ch);
    ctx.moveTo(cw - roadMargin - 3, 0);
    ctx.lineTo(cw - roadMargin - 3, ch);
    ctx.stroke();

    ctx.strokeStyle = '#f6f1a8';
    ctx.lineWidth = 4;
    ctx.setLineDash([34, 28]);
    ctx.lineDashOffset = -roadOffset;

    const roadW = cw - roadMargin * 2;
    const laneW = roadW / 3;

    ctx.beginPath();
    ctx.moveTo(roadMargin + laneW, -50);
    ctx.lineTo(roadMargin + laneW, ch + 50);
    ctx.moveTo(roadMargin + laneW * 2, -50);
    ctx.lineTo(roadMargin + laneW * 2, ch + 50);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
        const y = (roadOffset * 2 + i * (ch / 6)) % (ch + 120) - 60;
        ctx.beginPath();
        ctx.moveTo(roadMargin + 18, y);
        ctx.lineTo(cw - roadMargin - 18, y + 24);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0, 6, 18, 0.35)';
    entities.forEach(e => {
        ctx.beginPath();
        ctx.ellipse(e.x, e.y + e.r + 6, e.r * 1.1, e.r / 2, 0, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.beginPath();
    ctx.ellipse(bus.x, bus.y + bus.h - 3, bus.w / 2, bus.w / 4, 0, 0, Math.PI * 2);
    ctx.fill();

    entities.forEach(e => drawEntity(e));
    drawBus();

    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.type === 'heart') {
            drawHeart(p.x, p.y, 10);
        } else {
            ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

function drawEntity(e) {
    if (e.type === 'panda') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(e.x, e.y + 3, 21, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.beginPath(); ctx.arc(e.x - 14, e.y - 14, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e.x + 14, e.y - 14, 8, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#d7f7ff';
        ctx.beginPath(); ctx.arc(e.x, e.y + 1, 15, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.beginPath(); ctx.ellipse(e.x - 7, e.y - 1, 5, 7, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(e.x + 7, e.y - 1, 5, 7, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e.x, e.y + 7, 3, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = 'rgba(122, 255, 200, 0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y + 3, 26, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(122, 255, 200, 0.22)';
        ctx.beginPath();
        ctx.arc(e.x, e.y + 3, 31, 0, Math.PI * 2);
        ctx.fill();
    } else {
        const coneGradient = ctx.createLinearGradient(e.x, e.y - 30, e.x, e.y + 20);
        coneGradient.addColorStop(0, '#ff8a3d');
        coneGradient.addColorStop(1, '#ff4d37');
        ctx.fillStyle = coneGradient;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - 30);
        ctx.lineTo(e.x - 22, e.y + 22);
        ctx.lineTo(e.x + 22, e.y + 22);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff7d1';
        ctx.fillRect(e.x - 12, e.y - 10, 24, 7);
        ctx.fillRect(e.x - 16, e.y + 5, 32, 7);

        ctx.fillStyle = '#20273f';
        ctx.fillRect(e.x - 24, e.y + 20, 48, 8);

        ctx.strokeStyle = 'rgba(255, 158, 61, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y - 30);
        ctx.lineTo(e.x - 22, e.y + 22);
        ctx.lineTo(e.x + 22, e.y + 22);
        ctx.closePath();
        ctx.stroke();
    }
}

function drawBus() {
    ctx.save();
    ctx.translate(bus.x, bus.y + bus.h / 2);
    ctx.rotate(bus.tilt);
    ctx.translate(-bus.x, -(bus.y + bus.h / 2));

    ctx.fillStyle = 'rgba(122, 211, 255, 0.18)';
    roundRect(ctx, bus.x - bus.w / 2 - 8, bus.y - 8, bus.w + 16, bus.h + 16, 26);
    ctx.fill();

    const busGradient = ctx.createLinearGradient(bus.x - bus.w / 2, bus.y, bus.x + bus.w / 2, bus.y + bus.h);
    busGradient.addColorStop(0, '#ffe47a');
    busGradient.addColorStop(0.5, bus.color);
    busGradient.addColorStop(1, '#ff9a39');
    ctx.fillStyle = busGradient;
    roundRect(ctx, bus.x - bus.w / 2, bus.y, bus.w, bus.h, 24);
    ctx.fill();

    ctx.fillStyle = '#1f2947';
    roundRect(ctx, bus.x - bus.w / 2 + 6, bus.y + 8, bus.w - 12, 16, 8);
    ctx.fill();

    const windowGradient = ctx.createLinearGradient(0, bus.y + 40, 0, bus.y + bus.h * 0.62);
    windowGradient.addColorStop(0, '#a8efff');
    windowGradient.addColorStop(1, '#5bbdff');
    ctx.fillStyle = windowGradient;
    roundRect(ctx, bus.x - bus.w / 2 + 10, bus.y + 34, bus.w - 20, bus.h / 3.2, 10);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(bus.x - bus.w / 2 + 12, bus.y + 4, 15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bus.x + bus.w / 2 - 12, bus.y + 4, 15, 0, Math.PI * 2); ctx.fill();

    const faceY = bus.y + bus.h - 44;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(bus.x, faceY, 32, 26, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.ellipse(bus.x - 11, faceY - 5, 8, 10, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bus.x + 11, faceY - 5, 8, 10, 0.2, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#7affc8';
    ctx.beginPath(); ctx.arc(bus.x, faceY + 4, 5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1b2340';
    roundRect(ctx, bus.x - bus.w / 2 + 14, bus.y + bus.h - 26, bus.w - 28, 12, 6);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    roundRect(ctx, bus.x - bus.w / 2 + 8, bus.y + bus.h - 12, bus.w - 16, 8, 4);
    ctx.fill();

    ctx.fillStyle = '#ff5d73';
    ctx.beginPath(); ctx.arc(bus.x - bus.w / 2 + 12, bus.y + bus.h - 16, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bus.x + bus.w / 2 - 12, bus.y + bus.h - 16, 5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#fff5b2';
    ctx.beginPath(); ctx.arc(bus.x - bus.w / 2 + 18, bus.y + bus.h * 0.52, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bus.x + bus.w / 2 - 18, bus.y + bus.h * 0.52, 4, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawHeart(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-size, -size, -size * 1.5, size / 3, 0, size);
    ctx.bezierCurveTo(size * 1.5, size / 3, size, -size, 0, 0);
    ctx.fill();
    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// --- §5 Audio, GIF Feedback & Vibration ---

function unlockAudio() {
    audioUnlocked = true;
    safePlayLoop();
}

function safePlayLoop() {
    const bgm = document.getElementById('bgm_main');
    if (!bgm || gameState !== 'PLAYING') return;
    if (!bgmStarted) {
        bgm.volume = 0.2;
        bgmStarted = true;
    }
    if (bgm.paused) {
        bgm.play().catch(() => {});
    }
}

function safePauseLoop() {
    const bgm = document.getElementById('bgm_main');
    if (bgm && !bgm.paused) {
        bgm.pause();
    }
}

function playSfx(id, key = id, cooldownMs = 0) {
    const now = performance.now();
    const previous = sfxCooldowns.get(key) || 0;
    if (cooldownMs && now - previous < cooldownMs) return;
    sfxCooldowns.set(key, now);

    const el = document.getElementById(id);
    if (!el) return;

    try {
        el.pause();
        el.currentTime = 0;
        if (id === 'sfx_collect') el.volume = 0.55;
        if (id === 'sfx_crash') el.volume = 0.7;
        if (id === 'sfx_ui' || id === 'sfx_gameover') el.volume = 0.45;
        el.play().catch(() => {});
    } catch (e) {
        console.warn('SFX playback skipped', e);
    }
}

function showFeedback(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(gifTimers.get(id));
    el.classList.add('is-visible');
    gifTimers.set(id, setTimeout(() => {
        el.classList.remove('is-visible');
    }, duration));
}

function hideFeedback(id) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(gifTimers.get(id));
    el.classList.remove('is-visible');
}

function vibrate(style) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate',
            requestId: 'h5-' + Date.now(),
            version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}
