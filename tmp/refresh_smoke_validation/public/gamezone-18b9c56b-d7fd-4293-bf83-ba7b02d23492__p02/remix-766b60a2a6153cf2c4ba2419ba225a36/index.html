n:focus-visible{filter:brightness(1.08);outline:none}.btn:active{transform:translateY(7px);box-shadow:0 0 0 #553816}.btn.green{background:linear-gradient(180deg,#9be66f,#4d9c3f);box-shadow:0 7px 0 #214c28;color:#07130e}.btn.red{background:linear-gradient(180deg,#ff8b65,#c54a35);box-shadow:0 7px 0 #5d2019;color:#fff4c7}#hud{padding:16px 14px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}#hud button{pointer-events:auto;min-width:min(42vw,150px);white-space:nowrap}.counter{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;padding:8px 12px;border-radius:999px;background:rgba(7,19,14,.72);border:1px solid rgba(240,200,93,.45);box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.05);font-family:'Cinzel',serif;font-size:clamp(.72rem,2.9vw,.95rem);font-weight:700;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}.counter:before{content:"𓃭";margin-right:8px;color:var(--gold)}#feedback-layer{position:absolute;inset:0;z-index:12;overflow:hidden;pointer-events:none}.temple-badge{position:absolute;right:14px;min-width:min(48vw,190px);max-width:min(58vw,230px);padding:10px 12px;border-radius:16px;background:rgba(8,23,16,.84);border:1px solid rgba(240,200,93,.42);box-shadow:0 12px 22px rgba(0,0,0,.3);font-family:'Cinzel',serif;font-size:clamp(.64rem,2.4vw,.82rem);line-height:1.25;text-transform:uppercase;color:#fff4c7;opacity:0;transform:translateY(12px) scale(.95);transition:opacity .22s,transform .22s}.temple-badge.visible{opacity:1;transform:translateY(0) scale(1)}.temple-badge:before{content:"";display:inline-block;width:34px;height:34px;margin-right:8px;vertical-align:middle;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 36% 38%,#fff4c7 0 7%,transparent 8%),radial-gradient(circle at 64% 38%,#fff4c7 0 7%,transparent 8%),linear-gradient(180deg,#4d9c3f,#173b2a);box-shadow:0 -7px 0 -3px #f0c85d,0 0 14px rgba(128,184,90,.4)}#c <body>
<div id="game-stage">
  <canvas id="canvas"></canvas><div class="vines"></div><div class="grain"></div>
  <div id="ui-layer">
    <div id="feedback-layer" aria-live="polite"><div id="combo-badge" class="temple-badge hidden" role="status">Tiny titan tremor!</div><div id="chaos-badge" class="temple-badge hidden" role="status">Vault sealed.</div></div>
    <div class="counter hidden" id="score-display">RELICS AWAKE: 0</div>
    <div id="start-screen" class="panel">
      <div class="title-kicker">Jungle Temple Scale Incident</div>
      <h1>Tiny Titan <span class="headline-accent">Temple</span></h1>
      <p class="intro-copy"><strong>KORU IS A GIANT MONSTER.</strong><br>Unfortunately, Koru is pebble-sized.<br><span style="color:var(--gold)">→</span> Summon odd relics<br><span style="color:var(--gold)">→</span> Drag idols together<br><span style="color:var(--gold)">→</span> Make little tremors</p>
      <button id="start-btn" class="btn green"><span>𓃭</span> Wake Koru</button>
    </div>
    <div id="hud" class="hidden"><button id="reset-btn" class="btn red"><span>✦</span> Seal Vault</button><button id="spawn-btn" class="btn"><span>☘</span> Summon Relic</button></div>
  </div>
</div>
<script>
const CONFIG={gravity:0,friction:.92,bounce:.6,spawnPadding:50};
const THEME={sky:'#123c2b',deep:'#07130e',leaf:'#226044',moss:'#80b85a',gold:'#f0c85d',amber:'#ff9d46',stone:'#756d58',stone2:'#b2a77c',cream:'#fff4c7',danger:'#f35f49',shadow:'rgba(0,0,0,.34)'};

  BUS:{w:50,h:90,color:'#f0c85d',label:'TITAN'},
  WOOD:{w:20,h:60,color:'#6b8a43',label:'VINE'},
  BALL:{w:36,h:36,color:'#ff9d46',label:'SUN',shape:'circle'},
  MILK:{w:30,h:40,color:'#fff4c7',label:'SAP'},
  PENCIL:{w:10,h:60,color:'#e07248',label:'SPIRE'}

const ITEM_KEYS=Object.keys(ITEMS);
const AUDIO_MAP={start:'https://gamezone-virid.vercel.app/assets/audios/sfx/ruins_npc_01.mp3',spawn:'https://gamezone-virid.vercel.app/assets/audios/sfx/ruins_item_01.mp3',drag:'https://gamezone-virid.vercel.app/assets/audios/sfx/ruins_character_01.mp3',collision:'https://gamezone-virid.vercel.app/assets/audios/sfx/ruins_enemy_01.mp3',milkCollision:'https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3',reset:'https://gamezone-virid.vercel.app/assets/audios/sfx/ruins_defeat_01.mp3',bgm:'https://gamezone-virid.vercel.app/assets/audios/bgm/ruins_bgm_01.mp3'};
const Sfx={ctx:null,unlocked:false,sounds:{},bgm:null,bgmFailed:false,useSynthOnly:['127.0.0.1','localhost'].includes(location.hostname),lastPlayed:{},init(){if(this.unlocked){this.ctx&&this.ctx.state==='suspended'&&this.ctx.resume().catch(()=>{});this.startLoop();return}const AC=window.AudioContext||window.webkitAudioContext;if(AC){try{this.ctx=new AC()}catch(e){this.ctx=null}}if(!this.useSynthOnly){Object.entries(AUDIO_MAP).forEach(([k,u])=>{const a=new Audio(u);a.preload=k==='bgm'?'auto':'none';a.crossOrigin='anonymous';a.addEventListener('error',()=>{if(k==='bgm'){this.bgmFailed=true;this.bgm=null}else if(this.sounds[k]===a)delete this.sounds[k]});if(k==='bgm'){a.loop=true;a.volume=.18;this.bgm=a}else{a.volume=k==='drag'?.16:.34;this.sounds[k]=a}})}this.unlocked=true;this.startLoop()},ensureReady(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},play(name,cooldown=0){if(!this.unlocked)return;const now=performance.now();if(cooldown&&this.lastPlayed[name]&&now-this.lastPlayed[name]<cooldown)return;this.lastPlayed[name]=now;const base=this.sounds[name];if(!base){this.playSynth(name);return}try{const clip=base.cloneNode();clip.volume=base.volume;clip.play().catch(()=>this.playSynth(name))}catch(e){this.playSynth(name)}},playSynth(name){if(!this.ctx)return;this.ensureReady();const p={start:['triangle',392,587,.055,.18],spawn:['sine',520,720,.04,.09],drag:['square',210,160,.025,.045],collision:['sawtooth',170,70,.06,.14],milkCollision:['triangle',640,330,.045,.12],reset:['sine',230,110,.052,.18]}[name];if(!p)return;const t=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=p[0];osc.frequency.setValueAtTime(p[1],t);osc.frequency.exponentialRampToValueAtTime(Math.max(40,p[2]),t+p[4]);gain.gain.setValueAtTime(p[3],t);gain.gain.exponentialRampToValueAtTime(.001,t+p[4]);osc.connect(gain);gain.connect(this.ctx.destination);osc.start(t);osc.stop(t+p[4])},startLoop(){if(!this.bgm||this.bgmFailed)return;this.ensureReady();this.bgm.currentTime=0;this.bgm.play().catch(()=>{this.bgmFailed=true;this.bgm=null})},stopLoop(){if(!this.bgm)return;this.bgm.pause();this.bgm.currentTime=0},playCrash(isSap){this.play(isSap?'milkCollision':'collision',140);if(!this.ctx)return;this.ensureReady();const t=this.ctx.currentTime,gain=this.ctx.createGain(),len=this.ctx.sampleRate*(isSap ? .22 : .18),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const noise=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter();noise.buffer=buf;filter.type=isSap?'lowpass':'bandpass';filter.frequency.value=isSap?520:980;gain.gain.setValueAtTime(isSap ? .08 : .11,t);gain.gain.exponentialRampToValueAtTime(.01,t+(isSap ? .22 : .18));noise.connect(filter);filter.connect(gain);gain.connect(this.ctx.destination);noise.start();noise.stop(t+(isSap ? .22 : .18))},playSpawn(){this.play('spawn',90)},playDrag(){this.play('drag',70)},playStart(){this.play('start')},playReset(){this.play('reset')}};
const Feedback={comboEl:null,chaosEl:null,timers:{},init(){this.comboEl=document.getElementById('combo-badge');this.chaosEl=document.getElementById('chaos-badge')},flash(type,label){const el=type==='chaos'?this.chaosEl:this.comboEl;if(!el)return;if(label)el.textContent=label;el.classList.remove('hidden');requestAnimationFrame(()=>el.classList.add('visible'));clearTimeout(this.timers[type]);this.timers[type]=setTimeout(()=>{el.classList.remove('visible');setTimeout(()=>el.classList.add('hidden'),220)},type==='chaos'?1400:950)}};
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let width,height,entities=[],particles=[],running=false,activeDrag=null,dragOffset={x:0,y:0},collisionBurstCount=0,time=0;
function resize(){width=innerWidth;height=innerHeight;canvas.width=width;canvas.height=height}addEventListener('resize',resize);resize();
function roundRectPath(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function fillRoundRect(x,y,w,h,r,c){roundRectPath(x,y,w,h,r);ctx.fillStyle=c;ctx.fill()}function strokeRoundRect(x,y,w,h,r,c,l=2){roundRectPath(x,y,w,h,r);ctx.lineWidth=l;ctx.strokeStyle=c;ctx.stroke()}
function drawGlyph(x,y,s,c){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.moveTo(0,-12);ctx.lineTo(0,12);ctx.stroke();ctx.restore()}
function drawTinyFace(w,y=0){ctx.save();ctx.globalAlpha=.9;ctx.fillStyle='#07130e';ctx.fillRect(-w/4-4,-5+y,4,4);ctx.fillRect(w/4,-5+y,4,4);ctx.fillRect(-5,3+y,10,2);ctx.restore()}
function horn(x,y,flip){ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+flip*5,y-15,x+flip*15,y-17);ctx.quadraticCurveTo(x+flip*8,y-5,x,y);ctx.fill()}
class Entity{constructor(x,y,typeKey){this.x=x;this.y=y;this.type=typeKey;this.def=ITEMS[typeKey];this.w=this.def.w;this.h=this.def.h;this.angle=Math.random()*.5-.25;this.vx=0;this.vy=0;this.isDragging=false}update(){if(this.isDragging)return;this.x+=this.vx;this.y+=this.vy;this.vx*=CONFIG.friction;this.vy*=CONFIG.friction;if(this.x<0){this.x=0;this.vx*=-CONFIG.bounce}if(this.x>width){this.x=width;this.vx*=-CONFIG.bounce}if(this.y<0){this.y=0;this.vy*=-CONFIG.bounce}if(this.y>height){this.y=height;this.vy*=-CONFIG.bounce}}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);const drag=this.isDragging;ctx.fillStyle='rgba(0,0,0,.34)';if(this.def.shape==='circle'){ctx.beginPath();ctx.ellipse(5,7,this.w/2,this.h/2,0,0,Math.PI*2);ctx.fill()}else fillRoundRect(-this.w/2+4,-this.h/2+6,this.w,this.h,8,'rgba(0,0,0,.3)');ctx.shadowColor=drag?'rgba(240,200,93,.55)':'rgba(128,184,90,.22)';ctx.shadowBlur=drag?18:10;if(this.type==='BUS'){this.drawKoru()}else if(this.type==='DOOR'){this.drawGate()}else if(this.type==='WOOD'){this.drawVineTotem()}else if(this.type==='BALL'){this.drawSunSeed()}else if(this.type==='MILK'){this.drawSapJar()}else if(this.type==='PENCIL'){this.drawSpire()}ctx.shadowBlur=0;if(drag){ctx.strokeStyle='rgba(240,200,93,.78)';ctx.lineWidth=2;if(this.def.shape==='circle'){ctx.beginPath();ctx.arc(0,0,this.w/2+5,0,Math.PI*2);ctx.stroke()}else strokeRoundRect(-this.w/2-3,-this.h/2-3,this.w+6,this.h+6,10,'rgba(240,200,93,.78)',2)}ctx.restore()}drawKoru(){const g=ctx.createLinearGradient(0,-this.h/2,0,this.h/2);g.addColorStop(0,'#a8e978');g.addColorStop(.65,'#4d9c3f');g.addColorStop(1,'#1d4b2d');fillRoundRect(-this.w/2,-this.h/2,this.w,this.h,16,g);ctx.fillStyle=THEME.gold;horn(-this.w/2+6,-this.h/2+8,-1);horn(this.w/2-6,-this.h/2+8,1);strokeRoundRect(-this.w/2,-this.h/2,this.w,this.h,16,'rgba(7,19,14,.55)',2);ctx.fillStyle='rgba(255,244,199,.2)';fillRoundRect(-this.w/2+8,-this.h/2+18,this.w-16,14,5,'rgba(255,244,199,.22)');drawTinyFace(this.w,-10);ctx.fillStyle=THEME.gold;ctx.font='700 12px Cinzel';ctx.textAlign='center';ctx.fillText('tiny',0,this.h/2-12)}drawGate(){const g=ctx.createLinearGradient(-this.w/2,0,this.w/2,0);g.addColorStop(0,'#5d5748');g.addColorStop(.5,'#9b8d68');g.addColorStop(1,'#4b4438');fillRoundRect(-this.w/2,-this.h/2,this.w,this.h,8,g);strokeRoundRect(-this.w/2,-this.h/2,this.w,this.h,8,'rgba(255,244,199,.22)',2);fillRoundRect(-this.w/2+7,-this.h/2+9,this.w-14,this.h-18,5,'rgba(7,19,14,.22)');drawGlyph(0,-6,.8,THEME.gold);ctx.fillStyle=THEME.moss;ctx.fillRect(-this.w/2+3,-this.h/2+8,5,this.h-14);drawTinyFace(this.w-6,18)}drawVineTotem(){const g=ctx.createLinearGradient(-this.w/2,0,this.w/2,0);g.addColorStop(0,'#3d6334');g.addColorStop(.5,'#78a653');g.addColorStop(1,'#24472c');fillRoundRect(-this.w/2,-this.h/2,this.w,this.h,8,g);strokeRoundRect(-this.w/2,-this.h/2,this.w,this.h,8,'rgba(7,19,14,.5)',2);ctx.strokeStyle='#c4e48e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-this.h/2+8);ctx.quadraticCurveTo(8,-8,-3,this.h/2-8);ctx.stroke();ctx.fillStyle=THEME.gold;ctx.fillRect(-3,-5,6,4);ctx.fillRect(-3,8,6,4)}drawSunSeed(){const rg=ctx.createRadialGradient(-8,-9,2,0,0,this.w/2);rg.addColorStop(0,'#fff4c7');rg.addColorStop(.5,'#ffb24e');rg.addColorStop(1,'#b64e25');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,this.w/2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(86,40,10,.72)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*(this.w/2-3),Math.sin(a)*(this.w/2-3))}ctx.stroke();ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(-7,-8,5,0,Math.PI*2);ctx.fill();drawTinyFace(this.w,5)}drawSapJar(){const g=ctx.createLinearGradient(0,-this.h/2,0,this.h/2);g.addColorStop(0,'#fff9d8');g.addColorStop(.72,'#dff0a7');g.addColorStop(1,'#93aa60');fillRoundRect(-this.w/2,-this.h/2+2,this.w,this.h-2,7,g);strokeRoundRect(-this.w/2,-this.h/2+2,this.w,this.h-2,7,'rgba(55,80,38,.4)',2);ctx.fillStyle='#77b75b';fillRoundRect(-this.w/2+4,-5,this.w-8,12,4,'#77b75b');ctx.beginPath();ctx.moveTo(-this.w/2+2,-this.h/2+3);ctx.lineTo(0,-this.h/2-6);ctx.lineTo(this.w/2-2,-this.h/2+3);ctx.closePath();ctx.fillStyle='#fff4c7';ctx.fill();ctx.fillStyle='#2b4d28';ctx.font='700 12px Rajdhani';ctx.textAlign='center';ctx.fillText('SAP',0,4)}drawSpire(){const g=ctx.createLinearGradient(0,-this.h/2,0,this.h/2);g.addColorStop(0,'#ffd874');g.addColorStop(.6,'#d36c47');g.addColorStop(1,'#722f2c');fillRoundRect(-this.w/2,-this.h/2,this.w,this.h-10,4,g);ctx.fillStyle='#f0c85d';ctx.beginPath();ctx.moveTo(-this.w/2,this.h/2-10);ctx.lineTo(this.w/2,this.h/2-10);ctx.lineTo(0,this.h/2);ctx.closePath();ctx.fill();ctx.fillStyle='#07130e';ctx.fillRect(-2,-this.h/2+10,4,this.h-25)}getBounds(){return{x:this.x,y:this.y,r:Math.max(this.w,this.h)/2}}}
class Particle{constructor(x,y,type){this.x=x;this.y=y;this.life=1;this.type=type;const speed=Math.random()*5+2,ang=Math.random()*Math.PI*2;this.vx=Math.cos(ang)*speed;this.vy=Math.sin(ang)*speed;if(type==='MILK'){this.size=Math.random()*6+2;this.color='#fff4c7';this.drag=.96}else{this.size=Math.random()*8+4;this.color=`hsl(${38+Math.random()*50},85%,60%)`;this.drag=.9}}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=this.drag;this.vy*=this.drag;this.life-=.02;this.size*=.95}draw(){ctx.save();ctx.globalAlpha=this.life;ctx.shadowColor=this.type==='MILK'?'rgba(255,244,199,.55)':'rgba(255,157,70,.5)';ctx.shadowBlur=10;fillRoundRect(this.x,this.y,this.size,this.size,2,this.color);ctx.restore()}}
function spawnItem(){const key=ITEM_KEYS[Math.floor(Math.random()*ITEM_KEYS.length)],pad=CONFIG.spawnPadding,x=pad+Math.random()*(width-pad*2),y=pad+Math.random()*(height-pad*2);entities.push(new Entity(x,y,key));Sfx.playSpawn();updateUI()}
function explode(entity){const count=entity.type==='MILK'?40:15,pType=entity.type==='MILK'?'MILK':'FIRE';for(let i=0;i<count;i++)particles.push(new Particle(entity.x,entity.y,pType));Sfx.playCrash(entity.type==='MILK');collisionBurstCount++}
function checkCollisions(){const toRemove=new Set();for(let i=0;i<entities.length;i++){for(let j=i+1;j<entities.length;j++){const a=entities[i],b=entities[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy),minDist=(Math.min(a.w,a.h)+Math.min(b.w,b.h))/1.5;if(dist<minDist){toRemove.add(i);toRemove.add(j)}}}if(toRemove.size>0){collisionBurstCount=0;Array.from(toRemove).sort((a,b)=>b-a).forEach(idx=>{const ent=entities[idx];explode(ent);if(ent===activeDrag)activeDrag=null;entities.splice(idx,1)});if(collisionBurstCount>=2)Feedback.flash('combo',collisionBurstCount>=4?'POCKET TITAN QUAKE x'+collisionBurstCount:'TINY TITAN TREMOR x'+collisionBurstCount);updateUI()}}
function updateUI(){document.getElementById('score-display').innerText=`RELICS AWAKE: ${entities.length}`}
function drawBackground(){time+=.016;const g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,'#16442f');g.addColorStop(.58,'#0d261b');g.addColorStop(1,'#07130e');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);const sun=ctx.createRadialGradient(width*.5,height*.13,10,width*.5,height*.13,width*.55);sun.addColorStop(0,'rgba(240,200,93,.2)');sun.addColorStop(.4,'rgba(128,184,90,.07)');sun.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sun;ctx.fillRect(0,0,width,height);ctx.fillStyle='rgba(7,19,14,.22)';for(let x=-60+(time*10%120);x<width+120;x+=120){ctx.beginPath();ctx.moveTo(x,height);ctx.quadraticCurveTo(x+24,height*.55,x+9,0);ctx.lineTo(x+22,0);ctx.quadraticCurveTo(x+40,height*.55,x+54,height);ctx.fill()}ctx.fillStyle='rgba(104,99,77,.42)';const baseY=height*.78;for(let i=0;i<5;i++){const w=width*(.92-i*.13),h=34+i*5,x=(width-w)/2,y=baseY-i*42;fillRoundRect(x,y,w,h,8,'rgba(117,109,88,.55)');ctx.strokeStyle='rgba(240,200,93,.12)';ctx.strokeRect(x+8,y+7,w-16,h-14)}ctx.fillStyle='rgba(240,200,93,.13)';for(let i=0;i<7;i++){const x=width*.18+i*width*.11,y=height*.3+Math.sin(time+i)*8;drawGlyph(x,y,.45,'rgba(240,200,93,.25)')}ctx.strokeStyle='rgba(255,244,199,.08)';ctx.lineWidth=1;const step=Math.max(58,Math.min(82,width/7));ctx.beginPath();for(let x=0;x<width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,height)}for(let y=0;y<height;y+=step){ctx.moveTo(0,y);ctx.lineTo(width,y)}ctx.stroke();ctx.fillStyle='rgba(128,184,90,.5)';for(let i=0;i<18;i++){const x=(i*97+time*18)%(width+80)-40,y=(i*53+Math.sin(time+i)*24)%(height*.72);ctx.beginPath();ctx.arc(x,y,1.4+(i%3),0,Math.PI*2);ctx.fill()}ctx.save();ctx.globalAlpha=.12;ctx.translate(width*.5,height*.54);ctx.scale(1+.03*Math.sin(time),1);ctx.fillStyle='#07130e';ctx.beginPath();ctx.ellipse(0,80,width*.24,46,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#143724';ctx.beginPath();ctx.moveTo(-34,-70);ctx.quadraticCurveTo(-64,-122,-96,-104);ctx.quadraticCurveTo(-58,-70,-52,-28);ctx.lineTo(-52,55);ctx.quadraticCurveTo(0,92,52,55);ctx.lineTo(52,-28);ctx.quadraticCurveTo(58,-70,96,-104);ctx.quadraticCurveTo(64,-122,34,-70);ctx.closePath();ctx.fill();ctx.restore()}
function loop(){if(!running)return;drawBackground();entities.forEach(e=>e.update());checkCollisions();entities.sort((a,b)=>a.y-b.y);entities.forEach(e=>e.draw());for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(particles[i].life<=0)particles.splice(i,1)}requestAnimationFrame(loop)}
function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}}function onStart(e){if(!running)return;const p=getPos(e);for(let i=entities.length-1;i>=0;i--){const ent=entities[i],dx=p.x-ent.x,dy=p.y-ent.y;if(Math.abs(dx)<ent.w&&Math.abs(dy)<ent.h){activeDrag=ent;ent.isDragging=true;dragOffset.x=dx;dragOffset.y=dy;entities.splice(i,1);entities.push(ent);Sfx.playDrag();break}}}function onMove(e){if(!activeDrag)return;const p=getPos(e);activeDrag.x=p.x-dragOffset.x;activeDrag.y=p.y-dragOffset.y;activeDrag.vx=(p.x-dragOffset.x-activeDrag.x)*.2;activeDrag.vy=(p.y-dragOffset.y-activeDrag.y)*.2}function onEnd(){if(activeDrag){activeDrag.isDragging=false;activeDrag=null}}
canvas.addEventListener('mousedown',onStart);addEventListener('mousemove',onMove);addEventListener('mouseup',onEnd);canvas.style.touchAction='none';canvas.addEventListener('touchstart',e=>{e.preventDefault();onStart(e)},{passive:false});addEventListener('touchmove',e=>{if(!activeDrag)return;e.preventDefault();onMove(e)},{passive:false});addEventListener('touchend',onEnd);addEventListener('touchcancel',onEnd);
Feedback.init();function bootGame(){Sfx.init();Sfx.playStart();document.getElementById('start-screen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('score-display').classList.remove('hidden');running=true;for(let i=0;i<3;i++)spawnItem();loop()}document.getElementById('start-btn').addEventListener('click',bootGame);document.getElementById('spawn-btn').addEventListener('click',()=>{spawnItem();if(entities.length>=8)Feedback.flash('combo','TEMPLE TOO CROWDED')});document.getElementById('reset-btn').addEventListener('click',()=>{if(!entities.length){Feedback.flash('chaos','VAULT ALREADY SEALED');Sfx.playReset();return}Feedback.flash('chaos','VAULT SEALED IN A RUMBLE');Sfx.playReset();entities.forEach(e=>explode(e));entities=[];updateUI()});document.addEventListener('visibilitychange',()=>{if(document.hidden)Sfx.stopLoop();else if(running)Sfx.startLoop()});
</script>
