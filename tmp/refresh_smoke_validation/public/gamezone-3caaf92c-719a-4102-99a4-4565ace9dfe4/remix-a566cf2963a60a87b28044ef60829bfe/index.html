<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Arcade Feed Frenzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-500: #ff4fa3;
      --pink-600: #ff2f8f;
      --pink-700: #ca1f71;
      --indigo-600: #5f6dff;
      --cyan-400: #61f0ff;
      --gold-400: #ffd36f;
      --slate-200: #24304d;
      --slate-600: #9bb0d9;
      --slate-700: #dfe9ff;
      --white: #ffffff;
      --ink: #09111f;
      --panel: rgba(11, 18, 36, 0.76);
      --panel-border: rgba(132, 218, 255, 0.44);
      --grid-glow: rgba(97, 240, 255, 0.26);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 113, 193, 0.34) 0%, rgba(255, 113, 193, 0) 28%),
        radial-gradient(circle at 82% 14%, rgba(97, 240, 255, 0.28) 0%, rgba(97, 240, 255, 0) 24%),
        linear-gradient(180deg, #070d1c 0%, #121a34 48%, #1a0f2f 100%);
      color: var(--white);
    }

    button, input, textarea, select {
      font: inherit;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      touch-action: none;
      width: 100%;
      height: 100%;
    }

    .hidden { display: none !important; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { inset: 0; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .p-3 { padding: 0.75rem; }
    .p-5 { padding: 1.25rem; }
    .p-6 { padding: 1.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .text-center { text-align: center; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }
    .overflow-hidden { overflow: hidden; }
    .max-w-sm { max-width: 24rem; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .flex { display: flex; }
    .active\:scale-95:active { transform: scale(0.95); }

    .glass {
      background:
        linear-gradient(180deg, rgba(21, 32, 60, 0.92), rgba(11, 18, 36, 0.84)),
        var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.32),
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 0 18px rgba(97, 240, 255, 0.12);
    }

    .stroke {
      text-shadow: 0 2px 0 rgba(0,0,0,0.26);
    }

    .hud-card {
      max-width: 34rem;
      margin: 0 auto;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .meter {
      width: 100%;
      height: 0.75rem;
      background: rgba(123, 145, 196, 0.18);
      border: 1px solid rgba(132, 218, 255, 0.18);
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.22);
    }

    .meter-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.12s linear;
      box-shadow: 0 0 12px rgba(255,255,255,0.26);
    }

    .text-pink-600 { color: #ff85c2; }
    .text-indigo-600 { color: #8ed8ff; }
    .text-slate-600 { color: var(--slate-600); }
    .text-slate-700 { color: var(--slate-700); }
    .text-white { color: var(--white); }

    .action-btn {
      padding: 0.9rem 1.25rem;
      border: 1px solid rgba(255, 211, 111, 0.7);
      border-radius: 1rem;
      background: linear-gradient(180deg, #ff5fb0, #ff2f8f);
      color: var(--white);
      font-family: 'Bangers', 'Trebuchet MS', sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 12px 24px rgba(255, 47, 143, 0.32),
        0 0 18px rgba(255, 211, 111, 0.22);
    }

    .action-btn:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.35);
      outline-offset: 2px;
    }

    #game-over-screen {
      background: rgba(4, 8, 20, 0.46);
    }

    #game-over-panel h2,
    #restart-btn {
      font-family: 'Bangers', 'Trebuchet MS', sans-serif;
      letter-spacing: 0.04em;
    }

    .hud-title,
    .text-xs,
    .bullet-font {
      font-family: 'Bangers', 'Trebuchet MS', sans-serif;
      letter-spacing: 0.04em;
    }

    .gif-overlay {
      position: absolute;
      right: 0.8rem;
      bottom: 0.8rem;
      width: min(30vw, 112px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 1rem;
      background: rgba(9, 17, 31, 0.55);
      box-shadow: 0 10px 24px rgba(0,0,0,0.26);
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
      z-index: 55;
    }

    .gif-overlay.is-visible {
      opacity: 0.96;
      transform: translateY(0) scale(1);
    }

    .gif-overlay img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: inherit;
    }

    .gif-overlay--score {
      top: 5.8rem;
      right: 0.8rem;
      bottom: auto;
    }

    .gif-overlay--fail {
      right: auto;
      left: 0.8rem;
    }

    @media (max-width: 640px) {
      .p-3 { padding: 0.625rem; }
      .p-6 { padding: 1.125rem; }
      .text-3xl { font-size: 1.55rem; line-height: 1.9rem; }
      .text-lg { font-size: 1rem; line-height: 1.4rem; }
      .hud-row { gap: 0.4rem; }
      .action-btn { width: 100%; font-size: 0.78rem; }
      .gif-overlay {
        width: min(26vw, 82px);
        right: 0.45rem;
        bottom: 0.45rem;
      }
      .gif-overlay--score {
        top: 6.4rem;
        right: 0.45rem;
      }
      .gif-overlay--fail {
        left: 0.45rem;
      }
    }
  </style>
</head>
<body>
  <div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>

    <img id="asset_meme_0" data-editable="image" data-label="Feed Tile Runner" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>
    <img id="asset_meme_1" data-editable="image" data-label="Feed Tile Coin" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png" hidden>
    <img id="asset_meme_2" data-editable="image" data-label="Feed Tile Magnet" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/magnet.png" hidden>
    <img id="asset_meme_3" data-editable="image" data-label="Feed Tile Spike" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png" hidden>

    <audio id="bgm_main" data-editable="audio" data-label="Main BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
    <audio id="sfx_elim" data-editable="audio" data-label="Match Elimination SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_combo" data-editable="audio" data-label="Combo Boost SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
    <audio id="sfx_blocked" data-editable="audio" data-label="Blocked Move SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3" preload="auto"></audio>
    <audio id="sfx_gameover" data-editable="audio" data-label="Game Over SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="Restart UI SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

    <script id="game-config" type="application/x-game-config">
    {
      "heroSpeed": { "type": "number", "label": "Swap Speed", "value": 8, "min": 1, "max": 12 },
      "themeColor": { "type": "color", "label": "Theme Color", "value": "#ff4da6" }
    }
    </script>

    <div id="ui-layer" class="absolute inset-0 z-50">
      <div id="hud" class="p-3">
        <div class="glass rounded-2xl p-3 hud-card">
          <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe; styling-only neon remix -->
          <div class="hud-row">
            <div class="font-bold text-pink-600 text-lg stroke hud-title">Trend Score: <span id="score-text">0</span></div>
            <div class="font-bold text-indigo-600 text-lg stroke hud-title">Streak x<span id="combo-text">1</span></div>
          </div>
          <div class="mb-2">
            <div class="text-xs font-semibold text-slate-600">Viral Momentum</div>
            <div class="meter">
              <div id="score-bar" class="meter-fill" style="width:0%; background: linear-gradient(90deg, #ff5ea8, #ffc46b);"></div>
            </div>
          </div>
          <div>
            <div class="text-xs font-semibold text-slate-600">Feed Window</div>
            <div class="meter">
              <div id="timer-bar" class="meter-fill" style="width:100%; background: linear-gradient(90deg, #4ac7ff, #5eff9f);"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- [agent-note][stage3] resolved-gif: score-overlay + fail-overlay -> catalogs/gifs.json -->
      <div id="score-gif" class="gif-overlay gif-overlay--score" aria-hidden="true">
        <img src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="">
      </div>
      <div id="fail-gif" class="gif-overlay gif-overlay--fail" aria-hidden="true">
        <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="">
      </div>

      <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center p-5">
        <div id="game-over-panel" class="glass rounded-3xl p-6 text-center w-full max-w-sm">
          <h2 class="text-3xl font-bold text-pink-600 stroke mb-2">Feed Closed!</h2>
          <p class="text-slate-700 font-semibold mb-3">Trend Score: <span id="final-score">0</span></p>
          <p class="text-slate-600 text-xs mb-3">Tap neighboring tiles to chain a hotter streak before the timer drains.</p>
          <!-- [agent-note][stage1] role: future-audio | trigger: results-screen | intent: add upbeat arcade sting when the run ends -->
          <button id="restart-btn" class="action-btn active:scale-95">Post Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rawConfigText = document.getElementById('game-config')?.textContent || '{}';
      let parsedDefs = {};
      try { parsedDefs = JSON.parse(rawConfigText); } catch (_) { parsedDefs = {}; }
      window.gameConfigDefs = parsedDefs;
      const extracted = {};
      Object.keys(parsedDefs).forEach((k) => {
        extracted[k] = parsedDefs[k]?.value;
      });
      if (typeof extracted.heroSpeed !== 'number') extracted.heroSpeed = 6;
      if (!/^#[0-9a-fA-F]{6}$/.test(String(extracted.themeColor || ''))) extracted.themeColor = '#ff4da6';
      window.gameConfig = extracted;
      window.updateGameConfig = (key, val) => {
        if (!window.gameConfigDefs[key]) return;
        if (window.gameConfigDefs[key].type === 'color') {
          if (!/^#[0-9a-fA-F]{6}$/.test(String(val))) return;
          window.gameConfig[key] = val;
        } else {
          window.gameConfig[key] = val;
        }
      };

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const bgm = document.getElementById('bgm_main');
      const scoreGif = document.getElementById('score-gif');
      const failGif = document.getElementById('fail-gif');
      const scoreText = document.getElementById('score-text');
      const comboText = document.getElementById('combo-text');
      const scoreBar = document.getElementById('score-bar');
      const timerBar = document.getElementById('timer-bar');
      const finalScoreText = document.getElementById('final-score');
      const hud = document.getElementById('hud');
      const gameOverScreen = document.getElementById('game-over-screen');

      const memeImgs = [
        document.getElementById('asset_meme_0'),
        document.getElementById('asset_meme_1'),
        document.getElementById('asset_meme_2'),
        document.getElementById('asset_meme_3')
      ].filter(Boolean);

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioEls = {
        elim: document.getElementById('sfx_elim'),
        combo: document.getElementById('sfx_combo'),
        blocked: document.getElementById('sfx_blocked'),
        gameover: document.getElementById('sfx_gameover'),
        restart: document.getElementById('sfx_restart')
      };
      const audioState = {
        unlocked: false,
        buffers: {},
        ready: false,
        lastPlayedAt: {},
        gifTimer: 0
      };

      const config = {
        cols: 6,
        rows: 8,
        roundTime: 70,
        gravitySpeed: 18,
        swapBaseSpeed: Math.max(1, Math.min(12, window.gameConfig.heroSpeed)),
        tilePad: 4
      };

      const state = {
        gameState: 'PLAYING',
        score: 0,
        bestCascade: 1,
        timeLeft: config.roundTime,
        board: [],
        selected: null,
        swapping: null,
        reverting: null,
        clearing: null,
        falling: false,
        cascadeCount: 0,
        activeMatches: [],
        particles: [],
        bullets: [],
        shake: 0,
        lastTs: 0,
        targetScoreBar: 0
      };

      let cw = 1, ch = 1, dpr = Math.max(1, window.devicePixelRatio || 1);
      let initialized = false;
      let animationId = 0;

      const boardRect = { x: 0, y: 0, w: 0, h: 0, size: 0 };
      const memeTexts = ['Trend Spike!', 'Feed Locked!', 'Hot Take!', 'No Skip!', 'Big Share!', 'Main Feed!', 'Instant Viral!'];

      function setState(next) {
        state.gameState = next;
        if (!hud || !gameOverScreen) return;
        if (next === 'PLAYING') {
          hud.classList.remove('hidden');
          gameOverScreen.classList.add('hidden');
          hideGif(scoreGif);
          hideGif(failGif);
        } else {
          hud.classList.add('hidden');
          gameOverScreen.classList.remove('hidden');
        }
      }

      function vibrate(style) {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
          action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
        });
      }

      async function preloadSfx() {
        const entries = Object.entries(audioEls).map(([id, el]) => ({ id, el }));
        for (const item of entries) {
          try {
            const src = item.el?.src;
            if (!src) continue;
            const audioUrl = new URL(src, window.location.href);
            if (audioUrl.origin !== window.location.origin) continue;
            const res = await fetch(audioUrl.href);
            const arr = await res.arrayBuffer();
            const buf = await audioCtx.decodeAudioData(arr.slice(0));
            audioState.buffers[item.id] = buf;
          } catch (_) {
          }
        }
        audioState.ready = true;
      }

      function playSfx(id) {
        const now = audioCtx.currentTime;
        const minGap = id === 'elim' ? 0.07 : 0.18;
        if (audioState.lastPlayedAt[id] && now - audioState.lastPlayedAt[id] < minGap) return;
        audioState.lastPlayedAt[id] = now;
        const level = id === 'combo' ? 0.18 : id === 'gameover' ? 0.16 : 0.12;
        const buf = audioState.buffers[id];
        if (buf) {
          const src = audioCtx.createBufferSource();
          const gain = audioCtx.createGain();
          gain.gain.value = level;
          src.buffer = buf;
          src.connect(gain);
          gain.connect(audioCtx.destination);
          src.start(now);
          return;
        }
        const mediaEl = audioEls[id];
        if (mediaEl?.src) {
          const clone = mediaEl.cloneNode();
          clone.volume = level;
          clone.play().catch(() => {});
          return;
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = id === 'combo' ? 'triangle' : id === 'blocked' ? 'sawtooth' : 'square';
        osc.frequency.value = id === 'combo' ? 740 : id === 'gameover' ? 260 : id === 'restart' ? 620 : id === 'blocked' ? 210 : 480;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(level, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }

      function unlockAudio() {
        if (!audioState.unlocked) {
          audioState.unlocked = true;
        }
        audioCtx.resume().catch(() => {});
        if (bgm) {
          bgm.volume = 0.2;
          if (state.gameState === 'PLAYING') bgm.play().catch(() => {});
        }
      }

      function showGif(el, ms = 1200) {
        if (!el) return;
        el.classList.add('is-visible');
        window.clearTimeout(audioState.gifTimer);
        audioState.gifTimer = window.setTimeout(() => hideGif(el), ms);
      }

      function hideGif(el) {
        el?.classList.remove('is-visible');
      }

      function resize(width, height) {
        cw = Math.max(1, width);
        ch = Math.max(1, height);
        dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const topHudH = Math.min(130, ch * 0.2);
        const maxBoardW = Math.min(cw - 24, 560);
        const sizeByW = maxBoardW / config.cols;
        const sizeByH = (ch - topHudH - 24) / config.rows;
        boardRect.size = Math.max(24, Math.floor(Math.min(sizeByW, sizeByH)));
        boardRect.w = boardRect.size * config.cols;
        boardRect.h = boardRect.size * config.rows;
        boardRect.x = Math.floor((cw - boardRect.w) / 2);
        boardRect.y = Math.floor(topHudH + Math.max(8, (ch - topHudH - boardRect.h) * 0.08));

        if (initialized) clampBoardVisuals();
      }

      function clampBoardVisuals() {
        state.particles.forEach((p) => {
          if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) {
            p.x = cw * 0.5; p.y = ch * 0.5;
          }
          p.x = Math.max(0, Math.min(cw, p.x));
          p.y = Math.max(0, Math.min(ch, p.y));
        });
      }

      function randType() {
        return Math.floor(Math.random() * Math.max(1, memeImgs.length));
      }

      function makeTile(c, r, forcedType = null) {
        return {
          c, r,
          x: boardRect.x + c * boardRect.size,
          y: boardRect.y + r * boardRect.size,
          type: forcedType === null ? randType() : forcedType,
          offsetX: 0,
          offsetY: 0,
          removing: false,
          removeT: 0,
          mark: false
        };
      }

      function initBoard() {
        state.board = Array.from({ length: config.rows }, (_, r) =>
          Array.from({ length: config.cols }, (_, c) => makeTile(c, r))
        );
        let guard = 0;
        while (findMatches().length > 0 && guard < 40) {
          findMatches().forEach((m) => {
            m.cells.forEach(({ c, r }) => {
              state.board[r][c].type = randType();
            });
          });
          guard++;
        }
      }

      function initGame() {
        state.score = 0;
        state.timeLeft = config.roundTime;
        state.selected = null;
        state.swapping = null;
        state.reverting = null;
        state.clearing = null;
        state.falling = false;
        state.cascadeCount = 0;
        state.activeMatches = [];
        state.particles = [];
        state.bullets = [];
        state.shake = 0;
        state.bestCascade = 1;
        state.targetScoreBar = 0;
        initBoard();
        updateHud();
        initialized = true;
      }

      function restartGame() {
        initialized = false;
        setState('PLAYING');
        initGame();
        playSfx('restart');
        bgm?.play().catch(() => {});
        if (!animationId) animationId = requestAnimationFrame(loop);
      }

      function inBounds(c, r) {
        return c >= 0 && c < config.cols && r >= 0 && r < config.rows;
      }

      function areAdjacent(a, b) {
        return Math.abs(a.c - b.c) + Math.abs(a.r - b.r) === 1;
      }

      function findMatches() {
        const matches = [];
        for (let r = 0; r < config.rows; r++) {
          let start = 0;
          while (start < config.cols) {
            const t = state.board[r][start].type;
            let end = start + 1;
            while (end < config.cols && state.board[r][end].type === t) end++;
            const len = end - start;
            if (len >= 3) {
              const cells = [];
              for (let c = start; c < end; c++) cells.push({ c, r });
              matches.push({ cells, len });
            }
            start = end;
          }
        }
        for (let c = 0; c < config.cols; c++) {
          let start = 0;
          while (start < config.rows) {
            const t = state.board[start][c].type;
            let end = start + 1;
            while (end < config.rows && state.board[end][c].type === t) end++;
            const len = end - start;
            if (len >= 3) {
              const cells = [];
              for (let r = start; r < end; r++) cells.push({ c, r });
              matches.push({ cells, len });
            }
            start = end;
          }
        }
        return matches;
      }

      function markAndScore(matches) {
        const unique = new Set();
        let gain = 0;
        let bonusText = '';
        matches.forEach((m) => {
          let mult = 1;
          if (m.len === 4) { mult = 2; bonusText = 'x2 BOOST!'; }
          else if (m.len >= 5) { mult = 3; bonusText = 'x3 VIRAL!'; }
          gain += m.len * 60 * mult * Math.max(1, state.cascadeCount);
          m.cells.forEach((cell) => unique.add(cell.c + ',' + cell.r));
        });
        unique.forEach((key) => {
          const [c, r] = key.split(',').map(Number);
          const t = state.board[r][c];
          t.removing = true;
          t.removeT = 0;
          t.mark = true;
          spawnBurst(c, r);
        });
        state.score += gain;
        state.targetScoreBar = Math.min(1, state.score / 12000);
        state.bestCascade = Math.max(state.bestCascade, state.cascadeCount);
        if (bonusText || state.cascadeCount > 1) {
          spawnBullet(bonusText || memeTexts[(Math.random() * memeTexts.length) | 0]);
          playSfx('combo');
          vibrate('medium');
        } else {
          playSfx('elim');
          vibrate('light');
        }
      }

      function spawnBurst(c, r) {
        const cx = boardRect.x + c * boardRect.size + boardRect.size * 0.5;
        const cy = boardRect.y + r * boardRect.size + boardRect.size * 0.5;
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 40 + Math.random() * 120;
          state.particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0.55 + Math.random() * 0.3, age: 0, s: 2 + Math.random() * 4 });
        }
      }

      function spawnBullet(text) {
        state.bullets.push({
          text,
          x: cw + 20,
          y: boardRect.y + Math.random() * Math.max(40, boardRect.h - 20),
          vx: -(130 + Math.random() * 120),
          life: 2.6,
          age: 0,
          hue: Math.floor(Math.random() * 360)
        });
      }

      function swapTiles(a, b) {
        const ta = state.board[a.r][a.c];
        const tb = state.board[b.r][b.c];
        state.board[a.r][a.c] = tb;
        state.board[b.r][b.c] = ta;
        const ac = ta.c, ar = ta.r;
        ta.c = tb.c; ta.r = tb.r;
        tb.c = ac; tb.r = ar;
      }

      function beginSwap(a, b, isRevert = false) {
        state.swapping = {
          a: { c: a.c, r: a.r },
          b: { c: b.c, r: b.r },
          t: 0,
          dur: Math.max(0.08, 0.22 - window.gameConfig.heroSpeed * 0.01),
          revert: isRevert
        };
        swapTiles(a, b);
      }

      function applyGravity() {
        let moved = false;
        for (let c = 0; c < config.cols; c++) {
          let write = config.rows - 1;
          for (let r = config.rows - 1; r >= 0; r--) {
            const tile = state.board[r][c];
            if (tile && !tile.mark) {
              if (write !== r) {
                state.board[write][c] = tile;
                tile.r = write;
                moved = true;
              }
              write--;
            }
          }
          while (write >= 0) {
            const nt = makeTile(c, write, randType());
            nt.y = boardRect.y - (write + 1) * boardRect.size;
            state.board[write][c] = nt;
            moved = true;
            write--;
          }
        }
        for (let r = 0; r < config.rows; r++) {
          for (let c = 0; c < config.cols; c++) {
            const tile = state.board[r][c];
            tile.c = c; tile.r = r; tile.mark = false; tile.removing = false;
          }
        }
        return moved;
      }

      function boardPosFromPointer(x, y) {
        const c = Math.floor((x - boardRect.x) / boardRect.size);
        const r = Math.floor((y - boardRect.y) / boardRect.size);
        if (!inBounds(c, r)) return null;
        return { c, r };
      }

      function handleGameInput(e) {
        if (state.swapping || state.clearing || state.falling || state.reverting) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cell = boardPosFromPointer(x, y);
        if (!cell) { state.selected = null; return; }
        if (!state.selected) {
          state.selected = cell;
          return;
        }
        if (state.selected.c === cell.c && state.selected.r === cell.r) {
          state.selected = null;
          return;
        }
        if (!areAdjacent(state.selected, cell)) {
          state.selected = cell;
          playSfx('blocked');
          showGif(failGif, 900);
          return;
        }
        beginSwap(state.selected, cell, false);
        state.selected = null;
      }

      function handleGlobalInput(e) {
        unlockAudio();
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        if (state.gameState === 'GAMEOVER') { restartGame(); return; }
        if (state.gameState === 'PLAYING') handleGameInput(e);
      }

      function updateHud() {
        scoreText.textContent = String(Math.floor(state.score));
        comboText.textContent = String(Math.max(1, state.cascadeCount));
        scoreBar.style.width = Math.floor(state.targetScoreBar * 100) + '%';
        timerBar.style.width = Math.max(0, Math.floor((state.timeLeft / config.roundTime) * 100)) + '%';
      }

      function update(dt) {
        dt = Math.min(0.05, Math.max(0.001, dt));
        if (state.gameState !== 'PLAYING') return;

        state.timeLeft -= dt;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          finalScoreText.textContent = String(Math.floor(state.score));
          setState('GAMEOVER');
          playSfx('gameover');
          bgm?.pause();
          showGif(failGif, 1800);
          vibrate('heavy');
          return;
        }

        state.shake = Math.max(0, state.shake - dt * 4);

        if (state.swapping) {
          state.swapping.t += dt;
          const p = Math.min(1, state.swapping.t / state.swapping.dur);
          if (p >= 1) {
            const matches = findMatches();
            if (!state.swapping.revert && matches.length === 0) {
              const a = state.swapping.a;
              const b = state.swapping.b;
              state.swapping = null;
              beginSwap(a, b, true);
              state.shake = 0.35;
              spawnBullet('NO TREND!');
              playSfx('blocked');
              showGif(failGif, 1000);
            } else {
              const justReverted = state.swapping.revert;
              state.swapping = null;
              if (!justReverted && matches.length > 0) {
                state.cascadeCount += 1;
                state.activeMatches = matches;
                markAndScore(matches);
                state.clearing = { t: 0, dur: 0.2 };
              } else if (justReverted) {
                state.cascadeCount = 0;
              }
            }
          }
        } else if (state.clearing) {
          state.clearing.t += dt;
          if (state.clearing.t >= state.clearing.dur) {
            applyGravity();
            state.clearing = null;
            state.falling = true;
          }
        } else if (state.falling) {
          let done = true;
          for (let r = 0; r < config.rows; r++) {
            for (let c = 0; c < config.cols; c++) {
              const tile = state.board[r][c];
              const targetY = boardRect.y + r * boardRect.size;
              if (!Number.isFinite(tile.x) || !Number.isFinite(tile.y)) {
                tile.x = boardRect.x + c * boardRect.size;
                tile.y = targetY;
              }
              const dy = targetY - tile.y;
              if (Math.abs(dy) > 1) {
                tile.y += dy * Math.min(1, config.gravitySpeed * dt);
                done = false;
              } else {
                tile.y = targetY;
              }
              tile.x = boardRect.x + c * boardRect.size;
            }
          }
          if (done) {
            const next = findMatches();
            if (next.length > 0) {
              state.cascadeCount += 1;
              markAndScore(next);
              state.clearing = { t: 0, dur: 0.22 };
            } else {
              state.falling = false;
              state.cascadeCount = 0;
            }
          }
        }

        state.particles = state.particles.filter((p) => {
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 180 * dt;
          return p.age < p.t;
        });

        state.bullets = state.bullets.filter((b) => {
          b.age += dt;
          b.x += b.vx * dt;
          return b.age < b.life && b.x > -220;
        });

        if (state.cascadeCount >= 2) {
          showGif(scoreGif, 1000);
        }
        updateHud();
      }

      function drawTile(tile) {
        const pad = config.tilePad;
        const x = tile.x + pad;
        const y = tile.y + pad;
        const s = boardRect.size - pad * 2;
        const radius = Math.max(0, s * 0.16);
        ctx.save();
        if (tile.removing) {
          const t = Math.min(1, tile.removeT += 0.12);
          const scale = 1 - t * 0.6;
          ctx.translate(x + s / 2, y + s / 2);
          ctx.scale(scale, scale);
          ctx.translate(-x - s / 2, -y - s / 2);
          ctx.globalAlpha = 1 - t;
        }
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + s, y, x + s, y + s, radius);
        ctx.arcTo(x + s, y + s, x, y + s, radius);
        ctx.arcTo(x, y + s, x, y, radius);
        ctx.arcTo(x, y, x + s, y, radius);
        ctx.closePath();
        ctx.clip();
        const img = memeImgs[tile.type % memeImgs.length];
        if (img && img.complete) {
          ctx.drawImage(img, x, y, s, s);
        } else {
          const g = ctx.createLinearGradient(x, y, x + s, y + s);
          g.addColorStop(0, '#ffd5ea');
          g.addColorStop(1, '#8be5ff');
          ctx.fillStyle = g;
          ctx.fillRect(x, y, s, s);
        }
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.92)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(97, 240, 255, 0.35)';
        ctx.shadowBlur = 8;
        ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, cw, ch);

        const bg = ctx.createLinearGradient(0, 0, 0, ch);
        bg.addColorStop(0, '#060b18');
        bg.addColorStop(0.45, '#141d37');
        bg.addColorStop(1, '#1c1031');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, cw, ch);

        const pulse = performance.now() * 0.001;
        for (let i = 0; i < 24; i++) {
          const px = ((i * 137) % (cw + 120)) - 60;
          const py = (i * 89 + pulse * 42) % (ch + 120) - 60;
          const glow = 18 + (i % 3) * 6;
          const orb = ctx.createRadialGradient(px, py, 0, px, py, glow * 2.6);
          orb.addColorStop(0, i % 2 ? 'rgba(255, 95, 176, 0.18)' : 'rgba(97, 240, 255, 0.16)');
          orb.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = orb;
          ctx.beginPath();
          ctx.arc(px, py, glow * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = 0; i < 18; i++) {
          const yy = (i * 58 + performance.now() * 0.03) % (ch + 90) - 45;
          ctx.fillStyle = i % 2 ? 'rgba(97, 240, 255, 0.06)' : 'rgba(255, 255, 255, 0.04)';
          ctx.fillRect(0, yy, cw, 10);
        }

        const sx = (Math.random() - 0.5) * state.shake * 8;
        const sy = (Math.random() - 0.5) * state.shake * 8;
        ctx.save();
        ctx.translate(sx, sy);

        ctx.fillStyle = 'rgba(5, 10, 24, 0.44)';
        ctx.fillRect(boardRect.x - 10, boardRect.y - 10, boardRect.w + 20, boardRect.h + 20);

        const gridGrad = ctx.createLinearGradient(boardRect.x, boardRect.y, boardRect.x + boardRect.w, boardRect.y + boardRect.h);
        gridGrad.addColorStop(0, 'rgba(19, 31, 61, 0.96)');
        gridGrad.addColorStop(1, 'rgba(12, 18, 39, 0.88)');
        ctx.fillStyle = gridGrad;
        ctx.fillRect(boardRect.x, boardRect.y, boardRect.w, boardRect.h);

        ctx.strokeStyle = 'rgba(97, 240, 255, 0.22)';
        ctx.lineWidth = 2;
        ctx.strokeRect(boardRect.x + 1, boardRect.y + 1, boardRect.w - 2, boardRect.h - 2);

        for (let r = 0; r < config.rows; r++) {
          for (let c = 0; c < config.cols; c++) {
            drawTile(state.board[r][c]);
          }
        }

        if (state.selected) {
          const x = boardRect.x + state.selected.c * boardRect.size + 4;
          const y = boardRect.y + state.selected.r * boardRect.size + 4;
          const s = boardRect.size - 8;
          ctx.lineWidth = 4;
          ctx.strokeStyle = window.gameConfig.themeColor;
          ctx.strokeRect(x, y, s, s);
        }

        state.particles.forEach((p) => {
          const a = 1 - p.age / p.t;
          ctx.fillStyle = `rgba(255, ${120 + (Math.random()*100|0)}, ${140 + (Math.random()*100|0)}, ${a})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, p.s * a), 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();

        state.bullets.forEach((b) => {
          const alpha = Math.max(0, 1 - b.age / b.life);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '400 22px "Bangers"';
          ctx.shadowColor = 'rgba(97, 240, 255, 0.55)';
          ctx.shadowBlur = 12;
          ctx.fillStyle = `hsl(${b.hue} 92% 62%)`;
          ctx.strokeStyle = 'rgba(10,16,28,0.88)';
          ctx.lineWidth = 6;
          ctx.strokeText(b.text, b.x, b.y);
          ctx.fillText(b.text, b.x, b.y);
          ctx.restore();
        });
      }

      function loop(ts) {
        try {
          if (!state.lastTs) state.lastTs = ts;
          const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
          state.lastTs = ts;
          update(dt);
          render();
          animationId = requestAnimationFrame(loop);
        } catch (_) {
          animationId = requestAnimationFrame(loop);
        }
      }

      const ro = new ResizeObserver((entries) => {
        const entry = entries[0];
        if (!entry) return;
        const w = entry.contentRect.width;
        const h = entry.contentRect.height;
        resize(w, h);
        if (!initialized) {
          initGame();
          setState('PLAYING');
          bgm?.play().catch(() => {});
          if (!animationId) animationId = requestAnimationFrame(loop);
        }
      });
      ro.observe(canvas);

      // [agent-note][stage4] repaired: mobile-action-path | element: canvas/restart-btn | action: scoped gameplay input to the game surface so UI taps do not double-fire
      canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
      document.getElementById('restart-btn')?.addEventListener('click', handleGlobalInput);

      preloadSfx();
    });
  </script>
</body>
