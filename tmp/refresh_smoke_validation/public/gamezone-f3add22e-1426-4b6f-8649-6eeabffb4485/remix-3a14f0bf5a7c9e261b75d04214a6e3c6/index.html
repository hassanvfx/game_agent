<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pocket Biomes: Meme Arcade</title>
<!-- [agent-note][stage4] resolved-font: ui/title kept on approved catalog fonts only -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root {
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
        --bg-deep: #050816;
        --bg-mid: #0c1430;
        --panel: rgba(10, 18, 38, 0.84);
        --panel-strong: rgba(16, 28, 56, 0.94);
        --panel-border: rgba(140, 215, 255, 0.24);
        --accent: #7df9ff;
        --accent-strong: #37d7ff;
        --accent-warm: #ffd166;
        --accent-danger: #ff6b8a;
        --text-main: #f5fbff;
        --text-dim: #9db3d3;
        --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.45);
        --shadow-glow: 0 0 18px rgba(55, 215, 255, 0.24);
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 999px;
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 28%),
            linear-gradient(180deg, #08111f 0%, #020617 100%);
        color: var(--text-main);
        font-family: 'Audiowide', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            radial-gradient(circle at 20% 18%, rgba(125, 249, 255, 0.16), transparent 18%),
            radial-gradient(circle at 82% 14%, rgba(255, 209, 102, 0.1), transparent 16%),
            radial-gradient(circle at 50% 100%, rgba(168, 85, 247, 0.12), transparent 22%);
    }

    body::after {
        opacity: 0.16;
        background-image:
            linear-gradient(rgba(125, 249, 255, 0.12) 1px, transparent 1px),
            linear-gradient(90deg, rgba(125, 249, 255, 0.12) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(180deg, transparent, black 20%, black 80%, transparent);
    }

    canvas {
        display: block;
        image-rendering: pixelated;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
        touch-action: none;
    }

    button {
        font: inherit;
        border: 0;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .pixel-font { font-family: 'Press Start 2P', 'Audiowide', monospace; }

    .ui-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        overflow: hidden;
    }

    .world-frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        box-shadow:
            inset 0 0 0 1px rgba(125, 249, 255, 0.12),
            inset 0 0 40px rgba(8, 17, 31, 0.9);
    }

    .world-frame::before,
    .world-frame::after {
        content: "";
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 24px;
    }

    .world-frame::after {
        inset: auto 0 90px 0;
        height: 120px;
        border: 0;
        background: linear-gradient(180deg, transparent, rgba(3, 8, 18, 0.8));
    }

    .glass-panel {
        background: linear-gradient(180deg, rgba(18, 28, 54, 0.96), rgba(9, 15, 32, 0.88));
        backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 12px;
        padding-top: calc(var(--safe-top) + 8px);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        pointer-events: none;
        z-index: 20;
    }

    .hud-card {
        pointer-events: auto;
        border-radius: 18px;
        padding: 10px 14px;
    }

    .stats-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 120px;
    }

    .stat-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .stat-badge {
        min-width: 44px;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
    }

    .stat-badge.is-gold { color: var(--accent-warm); }
    .stat-badge.is-cyan { color: #73c8ff; }

    .stat-value {
        font-size: 12px;
        color: var(--text-main);
        text-shadow: 0 0 8px rgba(125, 249, 255, 0.16);
    }

    .controls-cluster {
        display: flex;
        gap: 8px;
        padding: 6px;
        border-radius: 18px;
        pointer-events: auto;
    }

    .hud-btn {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
        color: var(--accent-warm);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
        font-size: 16px;
        font-weight: 700;
    }

    .hud-btn:active {
        transform: scale(0.94);
    }

    .hud-btn:hover {
        background: linear-gradient(180deg, rgba(38, 53, 78, 0.96), rgba(22, 31, 49, 0.96));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 12px rgba(255, 209, 102, 0.18);
    }

    .hud-btn.text-btn {
        font-size: 13px;
        letter-spacing: 0.04em;
    }

    .toast-area {
        position: absolute;
        top: 112px;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        z-index: 18;
        padding: 0 16px;
    }

    .toast-enter { animation: slide-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    .toast-chip {
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-main);
        border: 1px solid rgba(255,255,255,0.08);
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast-yellow { color: var(--accent-warm); }
    .toast-red { color: #ff8ca2; }
    .toast-purple { color: #d7a5ff; }
    .toast-slate { color: #d3e4ff; }
    .toast-green { color: #7ff0b5; }

    .reaction-layer {
        position: absolute;
        top: calc(var(--safe-top) + 76px);
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        z-index: 19;
        pointer-events: none;
        max-width: min(34vw, 132px);
    }

    .reaction-card {
        width: min(30vw, 120px);
        min-width: 84px;
        padding: 6px;
        border-radius: 16px;
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
        transition: opacity 180ms ease, transform 180ms ease;
        overflow: hidden;
    }

    .reaction-card.show {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .reaction-card img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        background: rgba(8, 15, 32, 0.88);
    }

    .reaction-label {
        margin-top: 6px;
        font-size: 8px;
        line-height: 1.3;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-warm);
        text-align: center;
    }

    .dock {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding-bottom: var(--safe-bottom);
        padding-top: 44px;
        display: flex;
        flex-direction: column;
        z-index: 20;
        background: linear-gradient(180deg, transparent, rgba(2, 6, 23, 0.4) 18%, rgba(1, 4, 12, 0.95) 44%, rgba(1, 4, 12, 0.98) 100%);
    }

    .tool-scroll {
        display: flex;
        overflow-x: auto;
        gap: 12px;
        padding: 0 16px 14px;
        width: 100%;
        align-items: flex-end;
        min-height: 84px;
    }

    .cat-row {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding: 6px 16px 14px;
    }

    .tool-scroll,
    .cat-row {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .tool-scroll::-webkit-scrollbar,
    .cat-row::-webkit-scrollbar {
        display: none;
    }

    .tool-btn {
        flex: 0 0 auto;
        width: 72px;
        min-height: 72px;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        background: linear-gradient(180deg, rgba(18, 28, 54, 0.96), rgba(10, 17, 34, 0.96));
        border: 1px solid rgba(125, 249, 255, 0.12);
        color: var(--text-main);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.26);
        transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .tool-btn:active { transform: scale(0.92); }

    .tool-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 45%);
        opacity: 0.7;
        pointer-events: none;
    }

    .tool-btn.active {
        background: linear-gradient(180deg, rgba(24, 48, 82, 0.98), rgba(10, 22, 42, 0.98));
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 0 1px rgba(125, 249, 255, 0.22), 0 0 18px rgba(125, 249, 255, 0.28);
    }

    .tool-btn.active::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 6px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .tool-icon {
        font-size: 25px;
        line-height: 1;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.34));
    }

    .tool-label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.8;
    }

    .cat-pill {
        flex: 0 0 auto;
        transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease, color 0.18s ease;
        opacity: 0.72;
        white-space: nowrap;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        background: rgba(255,255,255,0.06);
        color: var(--text-dim);
        border: 1px solid rgba(255,255,255,0.08);
    }

    .cat-pill.active {
        opacity: 1;
        background: rgba(125, 249, 255, 0.14);
        color: var(--text-main);
        border-color: rgba(125, 249, 255, 0.35);
        transform: scale(1.04);
        box-shadow: 0 0 14px rgba(125, 249, 255, 0.16);
    }

    .cat-pill.is-chaos {
        background: rgba(255, 80, 120, 0.12);
        color: #ff8ca2;
        border-color: rgba(255, 80, 120, 0.22);
    }

    .start-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        background:
            radial-gradient(circle at 50% 18%, rgba(125, 249, 255, 0.18), transparent 24%),
            linear-gradient(180deg, rgba(3, 7, 19, 0.96), rgba(2, 6, 23, 0.98));
        overflow-y: auto;
    }

    .hero-shell {
        width: 100%;
        max-width: 360px;
        padding: 18px 18px 20px;
        border-radius: 28px;
        position: relative;
    }

    .hero-shell::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .title-stack {
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
    }

    .mascot-orbit {
        width: 110px;
        height: 110px;
        margin: 0 auto 18px;
        border-radius: 50%;
        position: relative;
        background:
            radial-gradient(circle at 35% 35%, rgba(255,255,255,0.38), transparent 20%),
            radial-gradient(circle at 50% 50%, rgba(125, 249, 255, 0.22), rgba(14, 30, 58, 0.86) 68%);
        border: 1px solid rgba(125, 249, 255, 0.28);
        box-shadow: 0 0 24px rgba(125, 249, 255, 0.25), inset 0 0 26px rgba(125, 249, 255, 0.08);
        display: grid;
        place-items: center;
    }

    .mascot-orbit::before,
    .mascot-orbit::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        border: 1px dashed rgba(125, 249, 255, 0.18);
    }

    .mascot-orbit::before {
        inset: -10px;
        animation: spin 14s linear infinite;
    }

    .mascot-orbit::after {
        inset: -18px;
        animation: spinReverse 18s linear infinite;
    }

    .mascot-face {
        font-size: 48px;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.45));
        transform: translateY(-1px);
    }

    .title {
        margin: 0;
        font-size: clamp(28px, 8vw, 34px);
        line-height: 1.2;
        color: var(--accent-warm);
        text-shadow:
            0 4px 0 rgba(122, 58, 9, 0.95),
            0 0 16px rgba(255, 209, 102, 0.22);
    }

    .subtitle {
        margin-top: 10px;
        font-size: 10px;
        font-weight: 700;
        color: #6f86a7;
        letter-spacing: 0.48em;
        text-transform: uppercase;
    }

    .hero-copy {
        margin: 0 auto 18px;
        max-width: 260px;
        font-size: 12px;
        line-height: 1.5;
        color: #d7e6f8;
    }

    .hero-copy strong {
        color: var(--accent);
    }

    .select-title {
        margin-bottom: 12px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #92a8c8;
    }

    .biome-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
        margin-bottom: 18px;
    }

    .biome-btn {
        border: 1px solid rgba(125, 249, 255, 0.12);
        border-radius: 18px;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        padding: 12px 10px;
        background: linear-gradient(180deg, rgba(17, 24, 39, 0.95), rgba(8, 14, 28, 0.95));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-height: 92px;
        position: relative;
        overflow: hidden;
    }

    .biome-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 55%);
        pointer-events: none;
    }

    .biome-btn.selected {
        border-color: var(--accent-warm);
        background: linear-gradient(180deg, rgba(64, 44, 9, 0.94), rgba(27, 20, 8, 0.96));
        box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.18), 0 0 18px rgba(255, 209, 102, 0.18);
        transform: scale(1.03);
    }

    .biome-emoji {
        font-size: 26px;
        line-height: 1;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    .biome-name {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-main);
    }

    .biome-note {
        font-size: 9px;
        color: var(--text-dim);
        letter-spacing: 0.04em;
    }

    .start-btn {
        width: 100%;
        max-width: 240px;
        margin: 0 auto;
        padding: 14px 18px;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffd966, #f4b93e);
        color: #111827;
        box-shadow: 0 7px 0 #a46111, 0 0 16px rgba(255, 209, 102, 0.22);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    .start-btn:active {
        transform: translateY(6px);
        box-shadow: 0 1px 0 #a46111;
    }

    .start-btn-label {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 12px;
    }

    .footer-copy {
        margin-top: 16px;
        font-size: 10px;
        color: #64748b;
    }

    .animate-float { animation: float 3s ease-in-out infinite; }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
    }

    @keyframes slide-in {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @media (max-width: 420px) {
        .hud {
            padding: 10px;
            padding-top: calc(var(--safe-top) + 6px);
        }

        .hud-card {
            padding: 9px 12px;
        }

        .controls-cluster {
            gap: 6px;
            padding: 5px;
        }

        .hud-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
        }

        .dock {
            padding-top: 40px;
        }

        .tool-scroll {
            gap: 10px;
            min-height: 80px;
            padding: 0 14px 12px;
        }

        .tool-btn {
            width: 68px;
            min-height: 68px;
        }

        .cat-row {
            gap: 8px;
            padding: 4px 14px 12px;
        }

        .hero-shell {
            padding: 16px 14px 18px;
        }

        .reaction-layer {
            top: calc(var(--safe-top) + 88px);
            right: 10px;
            max-width: 112px;
        }

        .reaction-card {
            width: min(28vw, 104px);
            min-width: 76px;
        }
    }
</style>
</head>
<body>

<!-- Audio -->
<!-- [agent-note][stage3] resolved-audio: loop + sfx -> catalogs/audios.json -->
<audio id="bgm" loop preload="none" crossorigin="anonymous">
    <source src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" type="audio/mpeg">
</audio>
<audio id="sfx-ui" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"></audio>
<audio id="sfx-build" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3"></audio>
<audio id="sfx-shoot" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_02.mp3"></audio>
<audio id="sfx-impact" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3"></audio>
<audio id="sfx-danger" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3"></audio>
<audio id="sfx-event" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3"></audio>

<div id="app" class="ui-shell">
    <canvas id="gameCanvas"></canvas>
    <div class="world-frame" aria-hidden="true"></div>

    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
    <div class="hud">
        <div class="glass-panel hud-card stats-stack">
            <div class="stat-row">
                <span class="stat-badge is-gold">Loop</span>
                <span id="year-display" class="pixel-font stat-value">1</span>
            </div>
            <div class="stat-row">
                <span class="stat-badge is-cyan">Mobs</span>
                <span id="pop-display" class="pixel-font stat-value">0</span>
            </div>
        </div>

        <div class="glass-panel controls-cluster">
            <button id="speed-btn" class="hud-btn text-btn" aria-label="Change speed">1x</button>
            <button id="pause-btn" class="hud-btn" aria-label="Pause or resume">⏸️</button>
            <button id="menu-btn" class="hud-btn" aria-label="Open menu">⚙️</button>
        </div>
    </div>

    <div id="toast-area" class="toast-area"></div>

    <!-- [agent-note][stage3] resolved-gif: combat + chaos feedback -> catalogs/gifs.json -->
    <div id="reaction-layer" class="reaction-layer" aria-live="polite">
        <div id="reaction-chaos" class="glass-panel reaction-card" aria-hidden="true">
            <img src="https://i.giphy.com/CITHEXm15BmhHVGZHq.webp" alt="Chaotic biome reaction" loading="lazy" decoding="async">
            <div class="reaction-label pixel-font">chaos ping</div>
        </div>
        <div id="reaction-impact" class="glass-panel reaction-card" aria-hidden="true">
            <img src="https://i.giphy.com/xbRW3zH8awEC3xZ0yh.webp" alt="Impact reaction" loading="lazy" decoding="async">
            <div class="reaction-label pixel-font">impact pop</div>
        </div>
    </div>

    <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
    <div class="dock">
        <div id="tool-scroll" class="tool-scroll">
            <!-- Tools injected JS -->
        </div>

        <div class="cat-row">
            <button class="cat-pill active" data-cat="nature">Nature</button>
            <button class="cat-pill" data-cat="civ">Civ</button>
            <button class="cat-pill" data-cat="life">Life</button>
            <button class="cat-pill is-chaos" data-cat="chaos">Chaos</button>
        </div>
    </div>

    <div id="start-screen" class="start-screen">
        <div class="glass-panel hero-shell">
            <div class="title-stack">
                <div class="mascot-orbit" aria-hidden="true">
                    <div class="mascot-face">🪐</div>
                </div>
                <h1 class="pixel-font title">POCKET<br>BIOMES</h1>
                <div class="subtitle">Meme Arcade Sandbox</div>
            </div>

            <p class="hero-copy">
                Shape a <strong>tiny living biome</strong>, stir up drama, and watch your pocket world spin into meme-fueled chaos.
            </p>

            <div class="select-title">Select Meme Map</div>
            <div class="biome-grid">
                <button class="biome-btn selected" data-biome="normal">
                    <span class="biome-emoji">🌲</span>
                    <span class="biome-name">Classic</span>
                    <span class="biome-note">lush + balanced</span>
                </button>
                <button class="biome-btn" data-biome="desert">
                    <span class="biome-emoji">🌵</span>
                    <span class="biome-name">Desert</span>
                    <span class="biome-note">dry + spicy</span>
                </button>
                <button class="biome-btn" data-biome="winter">
                    <span class="biome-emoji">❄️</span>
                    <span class="biome-name">Winter</span>
                    <span class="biome-note">frost + calm</span>
                </button>
                <button class="biome-btn" data-biome="hell">
                    <span class="biome-emoji">🌋</span>
                    <span class="biome-name">Chaos</span>
                    <span class="biome-note">lava + panic</span>
                </button>

            <button id="start-btn" class="start-btn pixel-font">
                <span class="start-btn-label">🚀 <span>Drop In</span></span>
            </button>

            <p class="footer-copy">Drag to remix the map • Tap tools below</p>
        </div>
    </div>
</div>

<script>
/*
 * POCKET BIOMES: MEME ARCADE SANDBOX
 */

// --- Engine Config ---
const CFG = {
    w: 64, h: 96, // Simulation resolution
    fps: 30,
    colors: {
        deep: '#172554', water: '#3b82f6', sand: '#fde047', mud: '#78350f',
        grass: '#4ade80', forest: '#16a34a', cactus: '#15803d', mountain: '#57534e',
        snow: '#f8fafc', ice: '#cffafe', lava: '#ef4444',
        stone: '#78716c', ash: '#292524', road: '#525252', wall: '#e5e5e5', gold: '#fbbf24',
        // Units
        civ1: '#f87171', civ2: '#60a5fa', civ3: '#c084fc', civ4: '#fbbf24',
        monster: '#be185d', wolf: '#475569', cow: '#d97706', chicken: '#fca5a5', sheep: '#fff',
        zombie: '#65a30d', dragon: '#a855f7',
        tornado: '#94a3b8', projectile: '#fff'
    }
};

const TILES = {
    DEEP:0, WATER:1, SAND:2, MUD:3, GRASS:4, FOREST:5,
    MOUNTAIN:6, SNOW:7, ICE:8, LAVA:9, STONE:10, ASH:11,
    ROAD:12, WALL:13, GOLD:14, CACTUS:15
};

// --- State Management ---
const State = {
    map: new Uint8Array(CFG.w * CFG.h),
    fire: new Uint8Array(CFG.w * CFG.h),
    units: [],     // {x, y, type, civId, hp, target, age, timer, ...}
    buildings: [], // {x, y, civId, hp, type}
    particles: [], // {x, y, color, life, vx, vy}
    projectiles: [], // {x, y, tx, ty, speed, damage, color}
    villages: [],  // {id, x, y, color, pop, atWarWith}

    tick: 0,
    year: 1,
    speed: 1,
    paused: false,

    selectedTool: 'inspect',
    selectedCat: 'nature',
    selectedBiome: 'normal',

    eventTimer: 0,
    nextEvent: 300
};

// --- Audio / Reactions ---
const REACTION_GIFS = {
    impact: { el: null, timeout: null, cooldown: 0 },
    chaos: { el: null, timeout: null, cooldown: 0 }
};

const AudioSys = {
    enabled: false,
    unlocked: false,
    bgmEl: null,
    sfxEls: {},
    cooldowns: new Map(),
    init() {
        if(this.unlocked) return;
        this.unlocked = true;
        this.enabled = true;
        this.bgmEl = document.getElementById('bgm');
        this.sfxEls = {
            ui: document.getElementById('sfx-ui'),
            build: document.getElementById('sfx-build'),
            shoot: document.getElementById('sfx-shoot'),
            impact: document.getElementById('sfx-impact'),
            danger: document.getElementById('sfx-danger'),
            event: document.getElementById('sfx-event')
        };
        Object.values(this.sfxEls).forEach((audio) => {
            if(!audio) return;
            audio.volume = 0.38;
            audio.load?.();
        });
        if(this.bgmEl) {
            this.bgmEl.volume = 0.2;
            this.bgmEl.load?.();
        }
    },
    unlock() {
        this.init();
        this.resumeLoop();
    },
    canPlay(key, cooldown = 120) {
        const now = performance.now();
        if((this.cooldowns.get(key) || 0) > now) return false;
        this.cooldowns.set(key, now + cooldown);
        return true;
    },
    play(key, cooldown = 120, restart = true) {
        if(!this.enabled || !this.unlocked || !this.canPlay(key, cooldown)) return;
        const audio = this.sfxEls[key];
        if(!audio) return;
        try {
            if(restart) audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    },
    startLoop() {
        if(!this.enabled || !this.unlocked || !this.bgmEl) return;
        try {
            this.bgmEl.play().catch(() => {});
        } catch (_) {}
    },
    stopLoop() {
        if(!this.bgmEl) return;
        this.bgmEl.pause();
    },
    resumeLoop() {
        if(State.paused) return;
        this.startLoop();
    },
    syncLoop() {
        if(State.paused) this.stopLoop();
        else this.resumeLoop();
    },
    playEvent(type) {
        if(type === 'war') {
            this.play('danger', 420);
            this.play('event', 520);
        } else if(type === 'fire' || type === 'boom') {
            this.play('danger', 240);
        } else if(type === 'monster') {
            this.play('danger', 320);
        } else if(type === 'build' || type === 'magic') {
            this.play('build', 110);
        } else if(type === 'shoot') {
            this.play('shoot', 90);
        } else if(type === 'impact') {
            this.play('impact', 80);
        } else if(type === 'ui') {
            this.play('ui', 90);
        } else if(type === 'start') {
            this.play('event', 250);
        } else if(type === 'pause' || type === 'resume') {
            this.play('ui', 160);
        }
    }
};

function flashReaction(type, duration = 1500) {
    const reaction = REACTION_GIFS[type];
    if(!reaction?.el) return;
    const now = performance.now();
    if(reaction.cooldown > now) return;
    reaction.cooldown = now + 240;
    reaction.el.classList.add('show');
    reaction.el.setAttribute('aria-hidden', 'false');
    clearTimeout(reaction.timeout);
    reaction.timeout = setTimeout(() => {
        reaction.el.classList.remove('show');
        reaction.el.setAttribute('aria-hidden', 'true');
    }, duration);
}

// --- World Generation ---
function generateWorld(biome = 'normal') {
    const { w, h } = CFG;
    const noise = (x, y, scale) => Math.sin(x*scale)*Math.cos(y*scale) + Math.sin((x+y)*scale*2)*0.5;

    // 1. Terrain
    const seed = Math.random() * 100;
    for(let y=0; y<h; y++) {
        for(let x=0; x<w; x++) {
            const idx = y*w+x;
            const dx = x/w - 0.5, dy = y/h - 0.5;
            const dist = Math.sqrt(dx*dx + dy*dy) * 2.2;

            let val = noise(x+seed, y+seed, 0.1) - dist;
            val += Math.random()*0.1;

            let t = TILES.DEEP;

            if (biome === 'hell') {
                if(val < -0.3) t = TILES.LAVA;
                else if(val < 0.2) t = TILES.ASH;
                else if(val < 0.4) t = TILES.STONE;
                else t = TILES.MOUNTAIN;
            }
            else if (biome === 'desert') {
                if(val < -0.4) t = TILES.WATER;
                else if(val < 0.6) t = TILES.SAND;
                else if(val < 0.7) t = TILES.CACTUS;
                else t = TILES.MOUNTAIN;
            }
            else if (biome === 'winter') {
                if(val < -0.2) t = TILES.ICE;
                else if(val < 0.5) t = TILES.SNOW;
                else if(val < 0.7) t = TILES.FOREST; // Pine trees
                else t = TILES.MOUNTAIN;
            }
            else { // Normal
                if(val < -0.25) t = TILES.DEEP;
                else if(val < 0.0) t = TILES.WATER;
                else if(val < 0.1) t = TILES.SAND;
                else if(val < 0.15 && Math.random() < 0.3) t = TILES.MUD;
                else if(val < 0.5) t = TILES.GRASS;
                else if(val < 0.7) t = TILES.FOREST;
                else if(val < 0.85) t = Math.random() < 0.05 ? TILES.GOLD : TILES.MOUNTAIN;
                else t = TILES.SNOW;
            }

            State.map[idx] = t;
            State.fire[idx] = 0;
        }
    }

    // 2. Clear Entities
    State.units = [];
    State.buildings = [];
    State.villages = [];
    State.particles = [];
    State.projectiles = [];

    // 3. Spawn Villages (if habitable)
    const colors = [CFG.colors.civ1, CFG.colors.civ2, CFG.colors.civ3, CFG.colors.civ4];
    for(let i=0; i<4; i++) {
        let placed = false, attempts = 0;
        while(!placed && attempts < 100) {
            const x = Math.floor(Math.random()*(w-10)+5);
            const y = Math.floor(Math.random()*(h-10)+5);
            const t = State.map[y*w+x];

            const habitable = (t === TILES.GRASS || t === TILES.FOREST || t === TILES.SAND || t === TILES.SNOW || t === TILES.ASH);

            if(habitable && !State.villages.some(v => Math.hypot(v.x-x, v.y-y) < 15)) {
                // Clear area
                for(let dy=-2; dy<=2; dy++) {
                    for(let dx=-2; dx<=2; dx++) {
                        const ni = (y+dy)*w+(x+dx);
                        if(State.map[ni] === TILES.FOREST || State.map[ni] === TILES.CACTUS) State.map[ni] = TILES.GRASS;
                    }
                }

                State.buildings.push({x, y, civId: i, hp: 500, type: 'hall'});
                State.villages.push({id: i, x, y, color: colors[i], pop: 0, atWarWith: null});
                for(let u=0; u<5; u++) spawnUnit(x, y, i, 'human');
                placed = true;
            }
            attempts++;
        }
    }

    // 4. Wild Animals
    for(let i=0; i<10; i++) {
        const x = Math.floor(Math.random()*w), y = Math.floor(Math.random()*h);
        const t = State.map[y*w+x];
        if(t !== TILES.WATER && t !== TILES.LAVA && t !== TILES.DEEP) spawnUnit(x, y, -1, 'cow');
    }

    State.year = 1;
    State.tick = 0;
    State.eventTimer = 0;
}

function spawnUnit(x, y, civId, type='human') {
    let hp = 20;
    if(type === 'monster') hp = 400;
    if(type === 'dragon') hp = 1000;
    if(type === 'zombie') hp = 30;
    if(type === 'cow') hp = 30;
    if(type === 'wolf') hp = 40;
    if(type === 'chicken') hp = 5;
    if(type === 'tornado') hp = 200;

    State.units.push({
        x: x + (Math.random()-0.5)*2,
        y: y + (Math.random()-0.5)*2,
        tx: x, ty: y,
        civId, type, hp,
        age: 0,
        timer: Math.random()*10,
        plagued: false
    });
}

// --- Simulation ---
function update() {
    if(State.paused) return;

    const steps = State.speed === 3 ? 4 : State.speed;

    for(let s=0; s<steps; s++) {
        State.tick++;
        if(State.tick % 30 === 0) State.year++;

        updateUnits();
        updateBuildings();
        updateProjectiles();
        updateWorld();

        // Event Director
        State.eventTimer++;
        if(State.eventTimer > State.nextEvent) {
            triggerRandomEvent();
            State.eventTimer = 0;
            State.nextEvent = 400 + Math.random() * 400;
        }
    }

    updateParticles();

    document.getElementById('year-display').textContent = State.year;
    document.getElementById('pop-display').textContent = State.units.filter(u=>u.type==='human').length;
}

function updateBuildings() {
    // Towers Logic
    if(State.tick % 30 !== 0) return;

    State.buildings.forEach(b => {
        if(b.type === 'tower') {
            // Find target
            const target = State.units.find(u => {
                if(u.civId === b.civId) return false; // Friendly
                if(u.type === 'human' && State.villages[b.civId].atWarWith !== u.civId) return false; // Neutral human
                if(u.type === 'cow' || u.type === 'sheep' || u.type === 'chicken') return false; // Passive
                return Math.hypot(u.x-b.x, u.y-b.y) < 8; // In Range
            });

            if(target) {
                State.projectiles.push({
                    x: b.x, y: b.y, tx: target.x, ty: target.y,
                    speed: 0.5, damage: 10, color: '#fff'
                });
                AudioSys.playEvent('shoot');
            }
        }
        else if(b.type === 'farm') {
            if(Math.random() < 0.05) spawnUnit(b.x, b.y, b.civId, 'human');
        }
    });
}

function updateProjectiles() {
    for(let i=State.projectiles.length-1; i>=0; i--) {
        const p = State.projectiles[i];
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 0.5) {
            // Hit logic
            State.units.forEach(u => {
                if(Math.hypot(u.x-p.tx, u.y-p.ty) < 1.5) {
                    u.hp -= p.damage;
                    spawnParticle(u.x, u.y, '#fff');
                    AudioSys.playEvent('impact');
                    flashReaction('impact', 1100);
                }
            });
            State.projectiles.splice(i, 1);
        } else {
            p.x += (dx/dist) * p.speed;
            p.y += (dy/dist) * p.speed;
            spawnParticle(p.x, p.y, p.color, 0.3);
        }
    }
}

function updateUnits() {
    const { w, h } = CFG;

    for(let i=State.units.length-1; i>=0; i--) {
        const u = State.units[i];

        // Life & Death
        if(u.type !== 'tornado') u.age++;

        // Plague
        if(u.plagued) {
            if(State.tick % 20 === 0) {
                u.hp -= 1;
                spawnParticle(u.x, u.y, '#10b981');
                // Spread
                State.units.forEach(other => {
                    if(other !== u && !other.plagued && Math.hypot(other.x-u.x, other.y-u.y) < 1.5) {
                        other.plagued = true;
                    }
                });
            }
        }

        // Tornado
        if(u.type === 'tornado') {
            u.hp--;
            if(u.hp <= 0) { State.units.splice(i, 1); continue; }
            const ix = Math.round(u.x), iy = Math.round(u.y);
            if(ix>=0 && ix<w && iy>=0 && iy<h) {
                const idx = iy*w+ix;
                if(State.map[idx] !== TILES.WATER && State.map[idx] !== TILES.DEEP) State.map[idx] = TILES.SAND;
                const bIdx = State.buildings.findIndex(b => Math.abs(b.x-ix)<1 && Math.abs(b.y-iy)<1);
                if(bIdx !== -1) {
                    State.buildings.splice(bIdx, 1);
                    spawnParticle(ix, iy, '#fbbf24');
                    AudioSys.playEvent('impact');
                    flashReaction('chaos', 1500);
                }
            }
            State.units.forEach(other => {
                if(other !== u && Math.hypot(other.x-u.x, other.y-u.y) < 3) {
                    other.x += (Math.random()-0.5)*4;
                    other.y += (Math.random()-0.5)*4;
                    other.hp -= 5;
                }
            });
        }
        else if(u.hp <= 0 || (u.type !== 'monster' && u.type !== 'dragon' && u.age > 1500)) {
            // On Death
            if(u.type === 'human' && u.plagued) {
                // Chance to rise as zombie
                if(Math.random() < 0.5) spawnUnit(u.x, u.y, -1, 'zombie');
            }
            State.units.splice(i, 1);
            continue;
        }

        // AI Logic
        u.timer--;
        if(u.timer <= 0) {
            u.timer = 5 + Math.random()*5;

            if(u.type === 'dragon') {
                // Dragon flies randomly, breathes fire
                u.tx = u.x + (Math.random()-0.5)*20;
                u.ty = u.y + (Math.random()-0.5)*20;
                if(Math.random() < 0.1) {
                    ignite(Math.floor(u.x), Math.floor(u.y), 2);
                    AudioSys.playEvent('fire');
                }
            }
            else if(u.type === 'tornado') {
                u.tx = u.x + (Math.random()-0.5)*6;
                u.ty = u.y + (Math.random()-0.5)*6;
            }
            else if(['wolf','monster','zombie'].includes(u.type)) {
                // Predator Logic
                let closest = null, minDist = 20;
                State.units.forEach(other => {
                    if(other === u) return;
                    let isPrey = false;
                    if(u.type === 'wolf') isPrey = ['sheep','cow','chicken','human'].includes(other.type);
                    if(u.type === 'zombie') isPrey = other.type === 'human';
                    if(u.type === 'monster') isPrey = other.type !== 'monster';

                    if(isPrey) {
                        const d = Math.hypot(other.x-u.x, other.y-u.y);
                        if(d < minDist) { minDist = d; closest = other; }
                    }
                });

                if(closest) {
                    u.tx = closest.x;
                    u.ty = closest.y;
                    if(minDist < 1.5) {
                        closest.hp -= (u.type==='monster'?10:5);
                        spawnParticle(closest.x, closest.y, '#f00');
                        AudioSys.playEvent('impact');
                        flashReaction('impact', 900);
                        // Zombie conversion
                        if(u.type === 'zombie' && closest.hp <= 0 && closest.type === 'human') {
                            spawnUnit(closest.x, closest.y, -1, 'zombie');
                        }
                    }
                } else {
                    u.tx = u.x + (Math.random()-0.5)*10;
                    u.ty = u.y + (Math.random()-0.5)*10;
                }
            } else if(u.type === 'human') {
                // Human Logic
                const village = State.villages[u.civId];
                if(village && village.atWarWith !== null) {
                    const enemyV = State.villages[village.atWarWith];
                    if(enemyV) {
                        u.tx = enemyV.x + (Math.random()-0.5)*5;
                        u.ty = enemyV.y + (Math.random()-0.5)*5;
                        const enemy = State.units.find(e => e.civId === enemyV.id && Math.hypot(e.x-u.x, e.y-u.y) < 2);
                        if(enemy) {
                            enemy.hp -= 5;
                            spawnParticle(enemy.x, enemy.y, '#fff');
                            AudioSys.playEvent('impact');
                            u.timer = 10;
                        }
                    }
                } else {
                    // Build/Wander
                    if(Math.random() < 0.05 && State.buildings.length < 200) {
                        const ix = Math.round(u.x), iy = Math.round(u.y);
                        const t = State.map[iy*w+ix];
                        if((t===TILES.GRASS || t===TILES.SAND || t===TILES.SNOW) && !State.buildings.some(b=>Math.abs(b.x-ix)<1 && Math.abs(b.y-iy)<1)) {
                            // Decide building type
                            let bType = 'house';
                            if(Math.random() < 0.1) bType = 'tower';
                            if(Math.random() < 0.1) bType = 'farm';

                            State.buildings.push({x: ix, y: iy, civId: u.civId, hp: 50, type: bType});
                            if(bType === 'house') spawnUnit(ix, iy, u.civId); // Breed
                        }
                    }
                    if(Math.random() < 0.2 && village) {
                        u.tx = village.x + (Math.random()-0.5)*20;
                        u.ty = village.y + (Math.random()-0.5)*20;
                    }
                }
            } else {
                // Passive Animal Logic
                u.tx = u.x + (Math.random()-0.5)*8;
                u.ty = u.y + (Math.random()-0.5)*8;
            }
        }

        // Move
        const dx = u.tx - u.x;
        const dy = u.ty - u.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist > 0.1) {
            // Determine Speed
            let baseSpeed = 0.08;
            if(u.type === 'monster') baseSpeed = 0.06;
            if(u.type === 'dragon') baseSpeed = 0.15;
            if(u.type === 'zombie') baseSpeed = 0.05;
            if(u.type === 'cow') baseSpeed = 0.04;
            if(u.type === 'chicken') baseSpeed = 0.12;
            if(u.type === 'wolf') baseSpeed = 0.11;
            if(u.type === 'tornado') baseSpeed = 0.2;

            // Terrain Modifiers (Dragon/Tornado fly)
            const cx = Math.floor(u.x), cy = Math.floor(u.y);
            if(u.type !== 'dragon' && u.type !== 'tornado' && cx>=0 && cx<w && cy>=0 && cy<h) {
                const tile = State.map[cy*w+cx];
                if(tile === TILES.ROAD) baseSpeed *= 1.5;
                if(tile === TILES.MUD) baseSpeed *= 0.5;
                if(tile === TILES.SNOW) baseSpeed *= 0.8;
                if(tile === TILES.WATER || tile === TILES.DEEP || tile === TILES.LAVA) baseSpeed *= 0.3;
            }

            const moveX = (dx/dist) * baseSpeed;
            const moveY = (dy/dist) * baseSpeed;

            // Wall Collision
            const nextX = Math.floor(u.x + moveX * 2);
            const nextY = Math.floor(u.y + moveY * 2);
            let blocked = false;
            if(u.type !== 'dragon' && u.type !== 'tornado' && nextX>=0 && nextX<w && nextY>=0 && nextY<h) {
                if(State.map[nextY*w+nextX] === TILES.WALL) blocked = true;
            }

            if(!blocked) {
                u.x += moveX;
                u.y += moveY;
            } else {
                u.tx = u.x - dx;
                u.ty = u.y - dy;
            }
        }

        u.x = Math.max(0, Math.min(w-1, u.x));
        u.y = Math.max(0, Math.min(h-1, u.y));
    }
}

function updateWorld() {
    const { w, h } = CFG;
    for(let i=0; i<60; i++) {
        const idx = Math.floor(Math.random() * w * h);

        // Fire Logic
        if(State.fire[idx] > 0) {
            State.fire[idx]--;
            if(State.fire[idx] === 0) {
                State.map[idx] = TILES.ASH;
            } else if(Math.random() < 0.2) {
                const n = idx + (Math.random()<0.5?1:-1) * (Math.random()<0.5?1:w);
                if(n>=0 && n<w*h) {
                   const t = State.map[n];
                   if(t===TILES.FOREST || t===TILES.GRASS || t===TILES.CACTUS) State.fire[n] = 100;
                }
            }
            if(Math.random()<0.1) spawnParticle((idx%w), Math.floor(idx/w), '#f97316');
        }

        // Regrowth
        if(State.map[idx] === TILES.ASH && Math.random() < 0.005) State.map[idx] = TILES.GRASS;
        if(State.map[idx] === TILES.GRASS && Math.random() < 0.002) State.map[idx] = TILES.FOREST;
        if(State.map[idx] === TILES.MUD && Math.random() < 0.005) State.map[idx] = TILES.GRASS;
    }
}

function updateParticles() {
    for(let i=State.particles.length-1; i>=0; i--) {
        const p = State.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if(p.life <= 0) State.particles.splice(i, 1);
    }
}

function spawnParticle(x, y, color, life=1.0) {
    if(State.particles.length > 80) return;
    State.particles.push({
        x, y, color, life,
        vx: (Math.random()-0.5)*0.2,
        vy: (Math.random()-0.5)*0.2 - 0.1
    });
}

function triggerRandomEvent() {

    if(r < 0.25) {

        const v1 = State.villages[Math.floor(Math.random()*State.villages.length)];
        const v2 = State.villages.find(v => v !== v1);
        if(v1 && v2) {

            v2.atWarWith = v1.id;

// --- Rendering ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

function resize() {
    const r = document.getElementById('app').getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

function render() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scale = Math.min(canvas.width / CFG.w, canvas.height / CFG.h);
    const ox = (canvas.width - CFG.w*scale)/2;
    const oy = (canvas.height - CFG.h*scale)/2;

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    // Draw Map
    const { w, h } = CFG;
    for(let y=0; y<h; y++) {
        for(let x=0; x<w; x++) {
            const idx = y*w+x;
            const t = State.map[idx];
            const f = State.fire[idx];

            if(f > 0) {
                ctx.fillStyle = Math.random()<0.5 ? '#fbbf24' : '#ef4444';
            } else {
                switch(t) {
                    case TILES.DEEP: ctx.fillStyle = CFG.colors.deep; break;
                    case TILES.WATER: ctx.fillStyle = CFG.colors.water; break;
                    case TILES.SAND: ctx.fillStyle = CFG.colors.sand; break;
                    case TILES.MUD: ctx.fillStyle = CFG.colors.mud; break;
                    case TILES.GRASS: ctx.fillStyle = CFG.colors.grass; break;
                    case TILES.FOREST: ctx.fillStyle = CFG.colors.forest; break;
                    case TILES.CACTUS: ctx.fillStyle = CFG.colors.cactus; break;
                    case TILES.MOUNTAIN: ctx.fillStyle = CFG.colors.mountain; break;
                    case TILES.SNOW: ctx.fillStyle = CFG.colors.snow; break;
                    case TILES.ICE: ctx.fillStyle = CFG.colors.ice; break;
                    case TILES.LAVA: ctx.fillStyle = CFG.colors.lava; break;
                    case TILES.STONE: ctx.fillStyle = CFG.colors.stone; break;
                    case TILES.ASH: ctx.fillStyle = CFG.colors.ash; break;
                    case TILES.ROAD: ctx.fillStyle = CFG.colors.road; break;
                    case TILES.WALL: ctx.fillStyle = CFG.colors.wall; break;
                    case TILES.GOLD: ctx.fillStyle = CFG.colors.gold; break;
                }
            }
            ctx.fillRect(x, y, 1, 1);

            if(t === TILES.FOREST || t === TILES.CACTUS) {
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fillRect(x, y, 1, 0.25);
            } else if(t === TILES.WATER || t === TILES.DEEP) {
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fillRect(x, y, 0.45, 0.2);
            } else if(t === TILES.SNOW || t === TILES.ICE) {
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.fillRect(x + 0.15, y + 0.15, 0.25, 0.25);
            }
        }
    }

    // Draw Buildings
    State.buildings.forEach(b => {
        const v = State.villages[b.civId];
        if(b.type === 'hall') {
            ctx.fillStyle = (v ? v.color : '#fff');
            ctx.fillRect(b.x, b.y, 1, 1);
            ctx.fillStyle = '#111827';
            ctx.fillRect(b.x + 0.2, b.y + 0.2, 0.24, 0.24);
            ctx.fillRect(b.x + 0.56, b.y + 0.2, 0.24, 0.24);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(b.x + 0.38, b.y - 0.1, 0.24, 0.16);
        } else if(b.type === 'tower') {
            ctx.fillStyle = '#6b7280';
            ctx.fillRect(b.x, b.y, 1, 1);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(b.x+0.2, b.y+0.15, 0.6, 0.25);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(b.x+0.38, b.y-0.15, 0.24, 0.22);
        } else if(b.type === 'farm') {
            ctx.fillStyle = '#fcd34d';
            ctx.fillRect(b.x, b.y, 1, 1);
            ctx.fillStyle = '#65a30d';
            ctx.fillRect(b.x + 0.12, b.y + 0.12, 0.18, 0.76);
            ctx.fillRect(b.x + 0.42, b.y + 0.12, 0.18, 0.76);
            ctx.fillRect(b.x + 0.72, b.y + 0.12, 0.16, 0.76);
        } else {
            ctx.fillStyle = '#713f12';
            ctx.fillRect(b.x, b.y, 1, 1);
            ctx.fillStyle = '#f5deb3';
            ctx.fillRect(b.x + 0.15, b.y + 0.42, 0.7, 0.43);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(b.x + 0.1, b.y + 0.1, 0.8, 0.22);
        }
    });

    // Draw Units
    State.units.forEach(u => {
        if(u.plagued) {
            ctx.fillStyle = '#10b981';
        } else if(u.type === 'monster') {
            ctx.fillStyle = CFG.colors.monster;
        } else if(u.type === 'dragon') {
            ctx.fillStyle = CFG.colors.dragon;
        } else if(u.type === 'zombie') {
            ctx.fillStyle = CFG.colors.zombie;
        } else if(u.type === 'tornado') {
            ctx.fillStyle = CFG.colors.tornado;
        } else if(u.type === 'wolf') {
            ctx.fillStyle = CFG.colors.wolf;
        } else if(u.type === 'cow') {
            ctx.fillStyle = CFG.colors.cow;
        } else if(u.type === 'chicken') {
            ctx.fillStyle = CFG.colors.chicken;
        } else if(u.type === 'sheep') {
            ctx.fillStyle = CFG.colors.sheep;
        } else {
            const v = State.villages[u.civId];
            ctx.fillStyle = v ? v.color : '#fff';
        }

        if(u.type === 'dragon') {
            ctx.fillRect(u.x-1, u.y-0.75, 2, 1.6);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(u.x+0.35, u.y-0.45, 0.22, 0.22);
            ctx.fillStyle = '#6d28d9';
            ctx.fillRect(u.x-0.8, u.y+0.2, 1.6, 0.18);
        } else if(u.type === 'monster') {
            ctx.fillRect(u.x-0.5, u.y-0.5, 2, 2);
            ctx.fillStyle = '#111827';
            ctx.fillRect(u.x-0.15, u.y, 0.22, 0.22);
            ctx.fillRect(u.x+0.65, u.y, 0.22, 0.22);
        } else if(u.type === 'tornado') {
            ctx.fillRect(u.x-0.35, u.y-0.65, 1.3, 0.45);
            ctx.fillRect(u.x-0.5, u.y-0.1, 1.6, 0.38);
            ctx.fillRect(u.x-0.2, u.y+0.35, 0.9, 0.3);
        } else if(u.type === 'wolf') {
            ctx.fillRect(u.x, u.y, 1, 1);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(u.x+0.62, u.y+0.18, 0.16, 0.16);
        } else if(u.type === 'cow') {
            ctx.fillRect(u.x, u.y, 1, 1);
            ctx.fillStyle = '#fff7ed';
            ctx.fillRect(u.x+0.16, u.y+0.2, 0.2, 0.2);
            ctx.fillRect(u.x+0.62, u.y+0.2, 0.2, 0.2);
        } else if(u.type === 'zombie') {
            ctx.fillRect(u.x, u.y, 1, 1);
            ctx.fillStyle = '#052e16';
            ctx.fillRect(u.x+0.15, u.y+0.18, 0.18, 0.18);
            ctx.fillRect(u.x+0.62, u.y+0.18, 0.18, 0.18);
        } else if(u.type === 'human') {
            ctx.fillRect(u.x, u.y, 1, 1);
            ctx.fillStyle = '#111827';
            ctx.fillRect(u.x+0.18, u.y+0.16, 0.14, 0.14);
            ctx.fillRect(u.x+0.66, u.y+0.16, 0.14, 0.14);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(u.x+0.4, u.y+0.52, 0.2, 0.22);
        } else {
            ctx.fillRect(u.x, u.y, 1, 1);
        }
    });

    // Projectiles
    State.projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 0.5, 0.5);
    });

    // Particles
    State.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 1, 1);
    });
    ctx.globalAlpha = 1;

    ctx.restore();
}

function setTile(x, y, t) {
    if(x>=0 && x<CFG.w && y>=0 && y<CFG.h) {
        State.map[y*CFG.w+x] = t;
        State.fire[y*CFG.w+x] = 0;
        if(t===TILES.WATER || t===TILES.DEEP || t===TILES.LAVA) {
            const bIdx = State.buildings.findIndex(b => Math.abs(b.x-x)<1 && Math.abs(b.y-y)<1);
            if(bIdx !== -1) State.buildings.splice(bIdx, 1);
        }
        AudioSys.playEvent('build');
    }
}

function spawnBuilding(x, y, type='house') {
    if(x>=0 && x<CFG.w && y>=0 && y<CFG.h) {
        State.buildings.push({x, y, civId: Math.floor(Math.random()*4), hp: 100, type});
        AudioSys.playEvent('build');
    }
}

function ignite(x, y, r=1) {
    for(let dy=-r; dy<=r; dy++) {
        for(let dx=-r; dx<=r; dx++) {
            const ni = (y+dy)*CFG.w+(x+dx);
            if(ni>=0 && ni<CFG.w*CFG.h) State.fire[ni] = 100;
        }
    }
    AudioSys.playEvent('fire');
}

function rain(x, y) {
    const r = 3;
    for(let dy=-r; dy<=r; dy++) {
        for(let dx=-r; dx<=r; dx++) {
            const ni = (y+dy)*CFG.w+(x+dx);
            if(ni>=0 && ni<CFG.w*CFG.h) {
                State.fire[ni] = 0; // Extinguish
                if(State.map[ni] === TILES.ASH || State.map[ni] === TILES.MUD) State.map[ni] = TILES.GRASS;
                if(State.map[ni] === TILES.SAND && Math.random()<0.1) State.map[ni] = TILES.GRASS;
            }
        }
    }
    AudioSys.playEvent('magic');
}

function lightning(x, y) {
    ignite(x, y, 0);
    State.units.forEach(u => {
        if(Math.hypot(u.x-x, u.y-y) < 2) {
            u.hp = 0;
            spawnParticle(u.x, u.y, '#fbbf24');
        }
    });
    AudioSys.playEvent('war');
}

function explode(x, y, r=2) {
    for(let dy=-r; dy<=r; dy++) {
        for(let dx=-r; dx<=r; dx++) {
            if(dx*dx+dy*dy <= r*r) {
                setTile(x+dx, y+dy, TILES.SAND);
                State.units = State.units.filter(u => Math.hypot(u.x-(x+dx), u.y-(y+dy)) > 1);
                State.buildings = State.buildings.filter(b => Math.hypot(b.x-(x+dx), b.y-(y+dy)) > 1);
                spawnParticle(x+dx, y+dy, '#fbbf24');
            }
        }
    }
    AudioSys.playEvent('boom');
    flashReaction('impact', 1400);
}

function meteor(x, y) {
    explode(x, y, 5);
    ignite(x, y, 4);
    setTile(x, y, TILES.LAVA);
    showToast("☄️ METEOR IMPACT", "toast-red");
    flashReaction('chaos', 1800);
}

function infect(x, y) {
    let count = 0;
    State.units.forEach(u => {
        if(Math.hypot(u.x-x, u.y-y) < 5) {
            u.plagued = true;
            count++;
        }
    });
    if(count > 0) {
        showToast("🦠 PLAGUE RELEASED", "toast-green");
        flashReaction('chaos', 1700);
    }
    AudioSys.playEvent('magic');
}

function nuke(x, y) {
    explode(x, y, 8);
    ignite(x, y, 6);
    for(let dy=-3; dy<=3; dy++) {
        for(let dx=-3; dx<=3; dx++) {
            if(dx*dx+dy*dy < 9) setTile(x+dx, y+dy, TILES.LAVA);
        }
    }
    showToast("☢️ NUCLEAR LAUNCH DETECTED", "toast-red");
    flashReaction('chaos', 2000);
}

// Input Handling
// [agent-note][stage4] repaired: mobile-cta-risk | action: confine gesture suppression to canvas so menu/start taps keep native click behavior
let isDrawing = false;
function handleInput(e) {
    if(!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;

    const scale = Math.min(canvas.width / CFG.w, canvas.height / CFG.h);
    const ox = (canvas.width - CFG.w*scale)/2;
    const oy = (canvas.height - CFG.h*scale)/2;

    const x = Math.floor((touch.clientX - rect.left - ox) / scale);
    const y = Math.floor((touch.clientY - rect.top - oy) / scale);

    const tool = Object.values(Tools).flat().find(t => t.id === State.selectedTool);
    if(tool) tool.act(x, y);
}

canvas.addEventListener('pointerdown', e => { isDrawing=true; handleInput(e); });
canvas.addEventListener('pointermove', handleInput);
canvas.addEventListener('pointerup', () => isDrawing=false);

    REACTION_GIFS.impact.el = document.getElementById('reaction-impact');
    REACTION_GIFS.chaos.el = document.getElementById('reaction-chaos');

    window.addEventListener('keydown', armAudio, { once: true });

    biomeBtns.forEach(btn => {
        btn.onclick = () => {
            AudioSys.playEvent('ui');
            biomeBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            State.selectedBiome = btn.dataset.biome;
        };
    });

    // Tool Selection
    function renderTools(cat) {
        scroll.innerHTML = '';
        Tools[cat].forEach(t => {
            const btn = document.createElement('button');

            btn.innerHTML = `<span class="tool-icon">${t.icon}</span><span class="tool-label">${t.label}</span>`;

                btn.classList.add('active');

            cats.forEach(x => x.classList.remove('active'));

            renderTools(c.dataset.cat);

    });

        this.innerText = State.speed + 'x';

    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').style.display = 'none';

        AudioSys.playEvent('start');

        AudioSys.syncLoop();
        flashReaction('chaos', 1200);

        setTimeout(() => showToast(`🌍 ${State.selectedBiome.toUpperCase()} MAP LOADED`), 500);
    };
}

function showToast(msg, colorClass='toast-yellow') {
    const el = document.createElement('div');
    el.className = `toast-enter glass-panel toast-chip ${colorClass}`;
    el.innerText = msg;
    const area = document.getElementById('toast-area');
    area.appendChild(el);
    if(area.children.length > 3) area.firstChild.remove();
    setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-10px)';
        setTimeout(() => el.remove(), 300);
    }, 3000);
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

initUI();
loop();

</script>
</body>
</html>
