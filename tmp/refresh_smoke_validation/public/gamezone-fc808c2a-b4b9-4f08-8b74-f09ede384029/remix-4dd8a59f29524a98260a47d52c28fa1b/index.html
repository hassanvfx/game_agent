<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Courier Rush</title>
<script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
<!-- [agent-note][stage3] resolved-font: title -> Audiowide, ui/hud -> Exo 2 from catalogs/fonts.json -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* CORE SETUP */
    :root {
        --c-bg: #060913;
        --c-bg-deep: #040611;
        --c-panel: rgba(12, 18, 38, 0.9);
        --c-panel-2: rgba(20, 28, 56, 0.94);
        --c-primary: #52d6ff;
        --c-primary-strong: #8cf3ff;
        --c-accent: #ff5fd0;
        --c-accent-2: #ffb347;
        --c-danger: #ff5f7a;
        --c-success: #9eff6e;
        --c-text: #f8fbff;
        --c-muted: #a8b3d6;
        --c-line: rgba(140, 243, 255, 0.28);
        --shadow-glow: 0 0 0 1px rgba(140, 243, 255, 0.12), 0 14px 30px rgba(0, 0, 0, 0.38), 0 0 28px rgba(82, 214, 255, 0.16);
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    html, body { 
        width: 100%; height: 100%; margin: 0; padding: 0; 
        overflow: hidden; background:
            radial-gradient(circle at top, rgba(82, 214, 255, 0.18), transparent 32%),
            radial-gradient(circle at 20% 80%, rgba(255, 95, 208, 0.14), transparent 28%),
            linear-gradient(180deg, #0b1020 0%, var(--c-bg) 55%, var(--c-bg-deep) 100%);
        font-family: 'Exo 2', system-ui, sans-serif; 
        -webkit-user-select: none; user-select: none;
        color: var(--c-text);
    }

    #game-container {
        touch-action: manipulation;
    }

    #gameCanvas {
        touch-action: none;
    }

    h1, h2, .btn, .badge-chip {
        font-family: 'Audiowide', system-ui, sans-serif;
    }

    .hud-mono,
    #score-display {
        font-family: 'Exo 2', system-ui, sans-serif;
        letter-spacing: 0.06em;
    }

    .feedback-gif {
        position: absolute;
        right: 1rem;
        bottom: calc(var(--safe-bottom) + 1rem);
        width: min(28vw, 124px);
        max-width: 124px;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 20px;
        border: 2px solid rgba(140, 243, 255, 0.38);
        background: rgba(4, 9, 23, 0.78);
        box-shadow: 0 12px 24px rgba(0,0,0,0.28);
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
        z-index: 45;
    }

    .feedback-gif.show {
        opacity: 0.95;
        transform: translateY(0) scale(1);
    }

    .feedback-gif--left {
        right: auto;
        left: 1rem;
    }

    @media (max-width: 640px) {
        .feedback-gif {
            width: min(26vw, 88px);
            bottom: calc(var(--safe-bottom) + 0.5rem);
            border-radius: 16px;
        }

        .feedback-gif--left {
            left: 0.75rem;
        }

        .feedback-gif:not(.feedback-gif--left) {
            right: 0.75rem;
        }
    }
    
    canvas { display: block; width: 100%; height: 100%; transition: transform 120ms ease; }

    body::before,
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    body::before {
        background:
            linear-gradient(rgba(140, 243, 255, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(140, 243, 255, 0.06) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,1));
        opacity: 0.35;
    }

    body::after {
        background: radial-gradient(circle at center, transparent 50%, rgba(2, 6, 17, 0.55) 100%);
    }

    /* UI COMPONENTS - NEON ARCADE STYLE */
    .panel { 
        position: relative;
        background: linear-gradient(180deg, rgba(18, 26, 52, 0.96), rgba(8, 13, 30, 0.94)); 
        border: 2px solid var(--c-line); 
        box-shadow: var(--shadow-glow);
        border-radius: 24px;
        backdrop-filter: blur(12px);
        overflow: hidden;
    }

    .panel::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(140, 243, 255, 0.12), transparent 38%, transparent 62%, rgba(255, 95, 208, 0.12));
        pointer-events: none;
    }
    
    .btn { 
        position: relative;
        border: none; outline: none;
        font-weight: 900; text-transform: uppercase;
        letter-spacing: 0.08em;
        transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease, border-color 0.14s ease;
        touch-action: manipulation;
        cursor: pointer;
        transform: translateY(0);
        overflow: hidden;
    }

    .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.18) 45%, transparent 70%);
        transform: translateX(-120%);
        transition: transform 0.22s ease;
        pointer-events: none;
    }

    .btn:hover::after,
    .btn:focus-visible::after {
        transform: translateX(120%);
    }
    
    .btn:active { 
        transform: translateY(2px) scale(0.985); 
        box-shadow: 0px 0px 0px transparent !important;
        filter: brightness(1.06);
    }

    .btn-primary {
        background: linear-gradient(180deg, #5be3ff 0%, #2ea9ff 100%); color: #02111f;
        border: 2px solid rgba(140, 243, 255, 0.7);
        box-shadow: 0 10px 18px rgba(46, 169, 255, 0.28), 0 0 18px rgba(82, 214, 255, 0.22);
        border-radius: 18px;
    }

    .btn-accent {
        background: linear-gradient(180deg, #ff71d7 0%, #ff4f8b 100%); color: white;
        border: 2px solid rgba(255, 179, 71, 0.55);
        box-shadow: 0 10px 18px rgba(255, 79, 139, 0.25), 0 0 18px rgba(255, 95, 208, 0.18);
        border-radius: 18px;
    }
    
    .btn-icon {
        background: linear-gradient(180deg, rgba(42, 55, 95, 0.96), rgba(17, 25, 49, 0.96)); color: white;
        border: 2px solid rgba(140, 243, 255, 0.24);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.24);
        border-radius: 16px;
    }

    .hidden { display: none !important; }
    
    .menu-hero {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        margin: 0 auto 0.5rem;
        border-radius: 24px;
        background: radial-gradient(circle at 35% 30%, #fff7c0 0%, #ffd56a 24%, #ff8e3c 48%, #5b2cff 100%);
        box-shadow: 0 0 26px rgba(255, 179, 71, 0.32), inset 0 0 12px rgba(255,255,255,0.18);
        position: relative;
        animation: courier-float 2.8s ease-in-out infinite;
    }

    .menu-hero::before,
    .menu-hero::after {
        content: '';
        position: absolute;
        border-radius: 999px;
        background: #09101f;
        top: 30px;
        width: 10px;
        height: 16px;
    }

    .menu-hero::before { left: 24px; }
    .menu-hero::after { right: 24px; }

    .menu-hero span {
        font-size: 2.6rem;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.28));
        transform: translateY(2px);
    }

    .badge-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.38rem 0.72rem;
        border-radius: 999px;
        border: 1px solid rgba(140, 243, 255, 0.24);
        background: rgba(6, 10, 24, 0.58);
        color: var(--c-primary-strong);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.14em;
    }

    .route-card-glow::before {
        content: '';
        position: absolute;
        inset: -20% auto auto -30%;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(255,255,255,0.26), transparent 70%);
        opacity: 0.55;
        pointer-events: none;
    }

    .char-card {
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 18px rgba(0,0,0,0.24);
    }

    .char-card::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.18);
        border-radius: inherit;
        pointer-events: none;
    }

    .hud-pill {
        background: rgba(4, 9, 23, 0.74);
        border: 1px solid rgba(140, 243, 255, 0.22);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(8px);
    }

    /* ANIMATIONS */
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes courier-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.03); } }
    .anim-bounce { animation: bounce-slow 3s infinite ease-in-out; }

    /* UTILS */
    .safe-pt { padding-top: var(--safe-top); }
    .safe-pb { padding-bottom: var(--safe-bottom); }
</style>
</head>
<body>

<!-- ASSETS -->
<div id="assets" style="display:none;">
    <img id="asset_bg_sunset" src="https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/desert.png" alt="">
    <audio id="bgm_menu" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" loop preload="auto"></audio>
    <audio id="bgm_game" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_coin" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3" preload="auto"></audio>
    <audio id="sfx_land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_pause" src="https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3" preload="auto"></audio>
    <audio id="sfx_resume" src="https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
</div>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full bg-slate-900 overflow-hidden">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: fail -> confused player reaction, win -> character dance celebration -->
    <img id="gif-fail" class="feedback-gif feedback-gif--left" src="https://i.giphy.com/HdMNmMm7tHd1bs4VeQ.webp" alt="Fail reaction feedback">
    <img id="gif-win" class="feedback-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Victory celebration feedback">

    <!-- UI LAYER -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center safe-pt safe-pb">
        
        <!-- MAIN MENU -->
        <div id="menu-screen" class="panel p-8 text-center pointer-events-auto flex flex-col gap-6 w-80 max-w-[90%]">
            <div>
                <div class="menu-hero" aria-hidden="true"><span>🚀</span></div>
                <div class="badge-chip mb-3">NEON DISPATCH</div>
                <h1 class="text-5xl font-black text-cyan-200 drop-shadow-md tracking-tighter" data-i18n="title">SKY COURIER</h1>
                <p class="text-slate-300 text-sm font-bold uppercase tracking-widest mt-2" data-i18n="subtitle">Dash the route, clear the drones.</p>
            </div>
            
            <button id="btn-play-menu" class="btn btn-primary py-5 text-2xl w-full" data-i18n="play">START RUN</button>
            
            <div class="flex gap-4 w-full">
                <button id="btn-chars" class="btn btn-icon flex-1 py-4 flex flex-col items-center gap-1">
                    <span class="text-2xl">🦸</span>
                    <span class="text-xs font-bold" data-i18n="hero">COURIER</span>
                </button>
                <button id="btn-settings" class="btn btn-icon flex-1 py-4 flex flex-col items-center gap-1">
                    <span class="text-2xl">⚙️</span>
                    <span class="text-xs font-bold" data-i18n="setup">SYSTEMS</span>
                </button>
            </div>
        </div>

        <!-- LEVEL SELECT -->
        <div id="level-screen" class="hidden panel p-6 text-center pointer-events-auto w-80 max-w-[90%]">
            <h2 class="text-2xl font-black mb-6 text-white uppercase" data-i18n="select_act">Select Route</h2>
            <div class="grid grid-cols-1 gap-4">
                <button id="lvl-1" class="btn route-card-glow relative overflow-hidden rounded-2xl h-24 group border-2 border-cyan-300/40 bg-gradient-to-r from-sky-500 to-cyan-400 shadow-[0_12px_20px_rgba(14,165,233,0.28)]">
                    <div class="relative z-10 flex items-center justify-between px-6 h-full text-white">
                        <div class="text-left">
                            <div class="text-xs font-bold uppercase opacity-80">Route 1</div>
                            <div class="text-2xl font-black" data-i18n="morning">SKYLINE</div>
                        </div>
                        <span class="text-4xl">☀️</span>
                    </div>
                </button>
                
                <button id="lvl-2" class="btn route-card-glow relative overflow-hidden rounded-2xl h-24 group border-2 border-amber-300/40 bg-gradient-to-r from-orange-500 to-pink-500 shadow-[0_12px_20px_rgba(249,115,22,0.28)]">
                    <div class="relative z-10 flex items-center justify-between px-6 h-full text-white">
                        <div class="text-left">
                            <div class="text-xs font-bold uppercase opacity-80">Route 2</div>
                            <div class="text-2xl font-black" data-i18n="sunset">DUSK RUN</div>
                        </div>
                        <span class="text-4xl">🌅</span>
                    </div>
                </button>
            </div>
            <button id="btn-back-level" class="mt-6 text-slate-400 hover:text-white font-bold py-2 px-6 uppercase" data-i18n="back">Back</button>
        </div>

        <!-- CHARACTER SELECT -->
        <div id="char-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 class="text-2xl font-black mb-6 uppercase" data-i18n="choose_hero">Pick Courier</h2>
            <div class="flex justify-center gap-4 mb-8">
                <div id="char-0" class="char-card w-20 h-20 bg-gradient-to-br from-rose-400 to-orange-400 rounded-2xl border-4 border-white shadow-lg cursor-pointer transform hover:scale-105 transition flex items-center justify-center text-3xl">🛸</div>
                <div id="char-1" class="char-card w-20 h-20 bg-gradient-to-br from-cyan-300 to-blue-500 rounded-full border-4 border-transparent opacity-50 shadow-lg cursor-pointer transform hover:scale-105 transition flex items-center justify-center text-3xl">🛰️</div>
                <div id="char-2" class="char-card w-20 h-20 bg-gradient-to-br from-yellow-300 to-fuchsia-500 rounded-2xl border-4 border-transparent opacity-50 shadow-lg cursor-pointer transform hover:scale-105 transition rotate-6 flex items-center justify-center text-3xl">🌟</div>
            </div>
            <button id="btn-back-char" class="btn btn-primary px-8 py-3 w-full" data-i18n="confirm">CONFIRM</button>
        </div>

        <!-- SETTINGS -->
        <div id="settings-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 class="text-2xl font-black mb-6 uppercase" data-i18n="settings">Systems</h2>
            
            <div class="bg-slate-800 rounded-xl p-4 mb-4 border-2 border-slate-700">
                <p class="text-xs text-slate-400 mb-2 uppercase tracking-wide font-bold" data-i18n="audio">Audio</p>
                <button id="btn-toggle-sound" class="btn w-full bg-emerald-500 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">
                    <span id="snd-icon">🔊</span> <span id="snd-text" data-i18n="sound_on">Audio: ON</span>
                </button>
            </div>

            <div class="bg-slate-800 rounded-xl p-4 mb-6 border-2 border-slate-700">
                <p class="text-xs text-slate-400 mb-2 uppercase tracking-wide font-bold" data-i18n="language">Language</p>
                <div class="flex gap-2">
                    <button class="lang-btn btn flex-1 bg-slate-600 py-2 rounded-lg text-sm font-bold border-b-4 border-slate-800 active:border-b-0 active:translate-y-1" data-lang="en">ENGLISH</button>
                    <button class="lang-btn btn flex-1 bg-slate-600 py-2 rounded-lg text-sm font-bold border-b-4 border-slate-800 active:border-b-0 active:translate-y-1" data-lang="es">SPANISH</button>
                </div>
            </div>

            <button id="btn-back-settings" class="btn text-slate-400 hover:text-white font-bold py-2" data-i18n="back">Back</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex flex-col items-center pointer-events-none safe-pt">
            <!-- Progress Bar -->
            <div class="w-64 max-w-[80%] h-6 hud-pill rounded-full overflow-hidden mb-3">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-yellow-400 to-orange-500 w-0 transition-all duration-100 ease-linear"></div>
            </div>
            <div class="flex justify-between w-full px-2 items-center">
                <div class="hud-pill hud-mono px-4 py-1 rounded-full text-xl font-black text-cyan-200 shadow-md">
                    <span id="score-display">0</span>
                </div>
                <button id="btn-pause" class="pointer-events-auto hud-pill text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl active:scale-90 transition">||</button>
            </div>
        </div>

        <!-- PAUSE MENU -->
        <div id="pause-screen" class="hidden panel p-8 text-center pointer-events-auto w-72">
            <h2 class="text-3xl font-black mb-6 text-yellow-400" data-i18n="paused">PAUSED</h2>
            <div class="flex flex-col gap-4">
                <button id="btn-resume" class="btn btn-primary py-3 text-lg" data-i18n="resume">Resume</button>
                <button id="btn-quit" class="btn btn-accent py-3 text-lg" data-i18n="quit">Abort Run</button>
            </div>
        </div>

        <!-- GAME OVER -->
        <div id="game-over-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-red-500">
            <h2 class="text-4xl font-black text-red-500 mb-2 drop-shadow-sm" data-i18n="crashed">ROUTE LOST!</h2>
            <p class="text-slate-300 mb-6 font-bold" data-i18n="try_again">Tap to redeploy the courier.</p>
            <div class="flex gap-4 justify-center">
                <button id="btn-home-fail" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-fail" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">↺</button>
            </div>
        </div>

        <!-- VICTORY -->
        <div id="victory-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-yellow-400">
            <div class="text-6xl mb-2">🏆</div>
            <h2 class="text-4xl font-black text-yellow-400 mb-2" data-i18n="goal">DELIVERY MADE!</h2>
            <p class="text-white text-lg mb-6 font-bold" data-i18n="level_complete">Route complete. Queue the next drop.</p>
            <div class="flex gap-4 justify-center">
                <button id="btn-home-win" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-win" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">➜</button>
            </div>
        </div>

    </div>
</div>

<script>
/**
 * SKY COURIER RUSH
 */

// --- LOCALIZATION ---
const LANG = {
    current: 'en',
    data: {
        en: {
            title: "SKY COURIER",
            subtitle: "Dash the route, clear the drones.",
            play: "START RUN",
            hero: "COURIER",
            setup: "SYSTEMS",
            select_act: "SELECT ROUTE",
            morning: "SKYLINE",
            sunset: "DUSK RUN",
            back: "BACK",
            choose_hero: "PICK COURIER",
            confirm: "CONFIRM",
            settings: "SYSTEMS",
            audio: "AUDIO",
            sound_on: "Audio: ON",
            sound_off: "Audio: OFF",
            language: "LANGUAGE",
            paused: "PAUSED",
            resume: "RESUME",
            quit: "ABORT RUN",
            crashed: "ROUTE LOST!",
            try_again: "Tap to redeploy the courier.",
            goal: "DELIVERY MADE!",
            level_complete: "Route complete. Queue the next drop."
        },
        es: {
            title: "SKY COURIER",
            subtitle: "Dash the route, clear the drones.",
            play: "START RUN",
            hero: "COURIER",
            setup: "SYSTEMS",
            select_act: "SELECT ROUTE",
            morning: "SKYLINE",
            sunset: "DUSK RUN",
            back: "BACK",
            choose_hero: "PICK COURIER",
            confirm: "CONFIRM",
            settings: "SYSTEMS",
            audio: "AUDIO",
            sound_on: "Audio: ON",
            sound_off: "Audio: OFF",
            language: "LANGUAGE",
            paused: "PAUSED",
            resume: "RESUME",
            quit: "ABORT RUN",
            crashed: "ROUTE LOST!",
            try_again: "Tap to redeploy the courier.",
            goal: "DELIVERY MADE!",
            level_complete: "Route complete. Queue the next drop."
        }
    },
    
    update() {
        const dict = this.data[this.current];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) el.innerText = dict[key];
        });
        
        // Update active buttons
        document.querySelectorAll('.lang-btn').forEach(btn => {
            const isActive = btn.dataset.lang === this.current;
            if (isActive) {
                btn.classList.add('bg-indigo-500', 'border-indigo-700');
                btn.classList.remove('bg-slate-600', 'border-slate-800');
            } else {
                btn.classList.add('bg-slate-600', 'border-slate-800');
                btn.classList.remove('bg-indigo-500', 'border-indigo-700');
            }
        });
    }
};

// --- CONFIGURATION ---
const CONFIG = {
    gravity: 0.7,
    jumpForce: 13,
    baseSpeed: 6,
    levels: {
        1: { id: 1, goal: 2000, color: "#38bdf8", ground: "#166534", track: "game", rate: 1.0 },
        2: { id: 2, goal: 3000, color: "#1e1b4b", ground: "#451a03", track: "game", rate: 0.85 }
    }
};

// --- STATE ---
const State = {
    screen: 'menu',
    level: 1,
    isPlaying: false,
    isPaused: false,
    score: 0,
    distance: 0,
    frames: 0,
    soundOn: true,
    hero: { type: 0, color: '#ef4444' }
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    tracks: {},
    lastPlayedAt: {},
    
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.tracks.menu = document.getElementById('bgm_menu');
            this.tracks.game = document.getElementById('bgm_game');
            this.tracks.fail = document.getElementById('sfx_fail');
            this.tracks.coin = document.getElementById('sfx_coin');
            this.tracks.jump = document.getElementById('sfx_jump');
            this.tracks.land = document.getElementById('sfx_land');
            this.tracks.ui = document.getElementById('sfx_ui');
            this.tracks.pause = document.getElementById('sfx_pause');
            this.tracks.resume = document.getElementById('sfx_resume');
            this.tracks.win = document.getElementById('sfx_win');
        }
    },

    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },

    playBGM(type, rate = 1.0) {
        if (!State.soundOn) return;
        
        this.tracks.menu.pause();
        this.tracks.game.pause();
        
        let track = null;
        if (type === 'menu') track = this.tracks.menu;
        else if (type === 'game') track = this.tracks.game;

        if (track) {
            track.currentTime = 0;
            track.volume = 0.2;
            track.playbackRate = rate; 
            track.play().catch(() => {});
        }
    },

    stopBGM() {
        this.tracks.menu.pause();
        this.tracks.game.pause();
    },

    playSFX(type, options = {}) {
        if (!State.soundOn) return;
        const sfx = this.tracks[type];
        if (sfx) {
            const now = performance.now();
            const minGap = options.minGap ?? 90;
            if (this.lastPlayedAt[type] && now - this.lastPlayedAt[type] < minGap) return;
            this.lastPlayedAt[type] = now;
            sfx.pause();
            sfx.currentTime = 0;
            sfx.volume = options.volume ?? 0.62;
            sfx.playbackRate = options.rate ?? 1.0;
            sfx.play().catch(() => {});
        } else {
            this.synthTone(options.frequency ?? 400, options.duration ?? 0.1);
        }
    },

    synthTone(frequency = 400, duration = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.frequency.value = frequency;
        osc.start();
        g.gain.setValueAtTime(0.05, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.stop(this.ctx.currentTime + duration);
    }
};

// --- GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    player: { x: 50, y: 0, w: 40, h: 40, vy: 0, grounded: false },
    obstacles: [],
    particles: [],
    finishLine: null,
    lastGrounded: false,
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.canvas.addEventListener('pointerdown', (e) => this.handleInput(e));
        
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    },

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },

    reset(lvl) {
        State.level = lvl;
        State.score = 0;
        State.distance = 0;
        State.frames = 0;
        State.isPlaying = true;
        State.isPaused = false;
        
        this.player.y = 0;
        this.player.vy = 0;
        this.obstacles = [];
        this.particles = [];
        this.finishLine = null;
        this.lastGrounded = false;
        
        UI.updateHUD();
        
        // Play appropriate BGM with Speed Mod
        const lvlCfg = CONFIG.levels[lvl];
        AudioSys.playBGM(lvlCfg.track, lvlCfg.rate);
    },

    handleInput(e) {
        e.preventDefault();
        AudioSys.unlock();
        if (State.screen === 'menu') return;
        
        if (State.isPlaying && !State.isPaused) {
            if (this.player.grounded) {
                this.player.vy = -CONFIG.jumpForce;
                this.player.grounded = false;
                this.spawnParticles(this.player.x + this.player.w/2, this.player.y + this.player.h, 10, '#fff');
                AudioSys.playSFX('jump', { volume: 0.5, minGap: 120 });
            }
        }
    },

    loop() {
        requestAnimationFrame(this.loop);
        if (State.isPlaying && !State.isPaused) this.update();
        this.render();
    },

    update() {
        State.frames++;
        const lvlConfig = CONFIG.levels[State.level];
        const speed = CONFIG.baseSpeed + (State.distance * 0.001);
        
        State.distance += speed * 0.1;
        
        // Win Logic
        if (State.distance >= lvlConfig.goal && !this.finishLine) {
            this.finishLine = { x: this.width + 100 };
        }
        
        // Physics
        this.player.vy += CONFIG.gravity;
        this.player.y += this.player.vy;
        
        const groundY = this.height - 120;
        if (this.player.y + this.player.h > groundY) {
            this.player.y = groundY - this.player.h;
            this.player.vy = 0;
            this.player.grounded = true;
            if (!this.lastGrounded) {
                AudioSys.playSFX('land', { volume: 0.35, minGap: 140 });
            }
        } else {
            this.player.grounded = false;
        }
        this.lastGrounded = this.player.grounded;

        // Spawn Obstacles
        if (!this.finishLine && State.frames % Math.max(50, 100 - Math.floor(speed * 2)) === 0) {
            if (Math.random() > 0.3) {
                const type = Math.random() > 0.6 ? 'bird' : 'box';
                this.obstacles.push({
                    x: this.width,
                    y: type === 'bird' ? groundY - 110 : groundY - 50,
                    w: 50, h: 50,
                    type: type, passed: false
                });
            }
        }

        // Update Obstacles
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.x -= speed;
            
            if (this.checkRectCollide(this.player, ob)) {
                this.gameOver();
            }
            
            if (!ob.passed && ob.x + ob.w < this.player.x) {
                State.score += 10;
                ob.passed = true;
                UI.updateHUD();
                AudioSys.playSFX('coin');
            }
            
            if (ob.x < -100) this.obstacles.splice(i, 1);
        }

        // Finish Line
        if (this.finishLine) {
            this.finishLine.x -= speed;
            if (this.finishLine.x < this.player.x) this.victory();
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
        
        UI.updateProgress(State.distance / lvlConfig.goal);
    },

    render() {
        const w = this.width;
        const h = this.height;
        const lvlConfig = CONFIG.levels[State.level];

        this.ctx.clearRect(0, 0, w, h);

        // Background
        if (State.level === 1) {
            // Skyline route
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#38bdf8');
            grad.addColorStop(1, '#bae6fd');
            this.ctx.fillStyle = grad;
            this.ctx.fillRect(0, 0, w, h);
            
            this.ctx.fillStyle = '#fde047';
            this.ctx.beginPath();
            this.ctx.arc(w - 60, 80, 40, 0, Math.PI*2);
            this.ctx.fill();
        } else {
            // Dusk route background
            const img = document.getElementById('asset_bg_sunset');
            if (img && img.complete) {
                const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
                const iw = img.naturalWidth * scale;
                const ih = img.naturalHeight * scale;
                this.ctx.drawImage(img, (w - iw)/2, (h - ih)/2, iw, ih);
            } else {
                this.ctx.fillStyle = '#7c2d12';
                this.ctx.fillRect(0, 0, w, h);
            }
            // Purple tint supports the dusk-run route framing.
            this.ctx.fillStyle = 'rgba(76, 29, 149, 0.3)';
            this.ctx.fillRect(0, 0, w, h);
        }

        // Ground
        this.ctx.fillStyle = lvlConfig.ground;
        this.ctx.fillRect(0, h - 120, w, 120);
        this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
        this.ctx.fillRect(0, h - 120, w, 10);

        if (State.isPlaying || State.screen === 'gameover' || State.screen === 'victory') {
            // Finish Line
            if (this.finishLine) {
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.finishLine.x, h - 300, 10, 180);
                this.ctx.fillRect(this.finishLine.x + 100, h - 300, 10, 180);
                this.ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#fbbf24' : '#000';
                this.ctx.fillRect(this.finishLine.x, h - 300, 110, 40);
            }

            // Player
            this.ctx.save();
            this.ctx.translate(this.player.x + this.player.w/2, this.player.y + this.player.h/2);
            const bob = Math.sin(State.frames * 0.22) * 1.5;
            this.ctx.translate(0, bob);
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = 'rgba(140,243,255,0.45)';
            this.ctx.fillStyle = State.hero.color;

            if (State.hero.type === 1) {
                this.ctx.beginPath();
                this.ctx.arc(0, 0, this.player.w/2, 0, Math.PI*2);
                this.ctx.fill();
                this.ctx.fillStyle = 'rgba(255,255,255,0.22)';
                this.ctx.beginPath();
                this.ctx.arc(-6, -8, 10, 0, Math.PI*2);
                this.ctx.fill();
            } else if (State.hero.type === 2) {
                this.ctx.rotate(State.frames * 0.06);
                this.ctx.beginPath();
                this.ctx.moveTo(0, -22);
                this.ctx.lineTo(16, -2);
                this.ctx.lineTo(8, 20);
                this.ctx.lineTo(-8, 20);
                this.ctx.lineTo(-16, -2);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.fillStyle = '#fff7c2';
                this.ctx.beginPath();
                this.ctx.arc(0, -2, 5, 0, Math.PI * 2);
                this.ctx.fill();
            } else {
                this.ctx.fillRect(-this.player.w/2, -this.player.h/2, this.player.w, this.player.h);
                this.ctx.fillStyle = 'rgba(255,255,255,0.2)';
                this.ctx.fillRect(-this.player.w/2 + 4, -this.player.h/2 + 4, this.player.w * 0.35, this.player.h * 0.28);
            }

            this.ctx.shadowBlur = 0;
            if (State.hero.type !== 2) {
                this.ctx.fillStyle = '#fff';
                this.ctx.beginPath();
                this.ctx.arc(6, -6, 5, 0, Math.PI*2);
                this.ctx.arc(-7, -6, 4, 0, Math.PI*2);
                this.ctx.fill();
                this.ctx.fillStyle = '#09101f';
                this.ctx.beginPath();
                this.ctx.arc(7, -5, 2, 0, Math.PI*2);
                this.ctx.arc(-6, -5, 1.7, 0, Math.PI*2);
                this.ctx.fill();
            }
            this.ctx.fillStyle = 'rgba(255,255,255,0.3)';
            this.ctx.fillRect(-4, 18, 8, 6);
            this.ctx.restore();

            // Obstacles
            this.obstacles.forEach(ob => {
                this.ctx.save();
                this.ctx.shadowBlur = 14;
                this.ctx.shadowColor = ob.type === 'bird' ? 'rgba(255,95,122,0.38)' : 'rgba(255,179,71,0.32)';
                if (ob.type === 'bird') {
                    this.ctx.fillStyle = '#ff5f7a';
                    this.ctx.beginPath();
                    this.ctx.moveTo(ob.x + 4, ob.y + ob.h * 0.7);
                    this.ctx.lineTo(ob.x + ob.w * 0.55, ob.y + 6);
                    this.ctx.lineTo(ob.x + ob.w - 4, ob.y + ob.h * 0.7);
                    this.ctx.lineTo(ob.x + ob.w * 0.55, ob.y + ob.h - 6);
                    this.ctx.closePath();
                    this.ctx.fill();
                } else {
                    this.ctx.fillStyle = '#ffb347';
                    this.ctx.fillRect(ob.x + 4, ob.y + 4, ob.w - 8, ob.h - 8);
                    this.ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    this.ctx.fillRect(ob.x + 10, ob.y + 10, ob.w * 0.22, ob.h * 0.22);
                }
                this.ctx.shadowBlur = 0;
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = 'rgba(9,16,31,0.36)';
                this.ctx.strokeRect(ob.x + 3, ob.y + 3, ob.w - 6, ob.h - 6);
                this.ctx.restore();
            });

            // Particles
            this.particles.forEach(p => {
                this.ctx.fillStyle = p.color;
                this.ctx.globalAlpha = p.life / 20;
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                this.ctx.fill();
                this.ctx.globalAlpha = 1;
            });
        }
    },

    checkRectCollide(p, o) {
        const pad = 8;
        return (p.x + pad < o.x + o.w - pad &&
                p.x + p.w - pad > o.x + pad &&
                p.y + pad < o.y + o.h - pad &&
                p.y + p.h - pad > o.y + pad);
    },

    spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 20 + Math.random() * 10,
                color: color,
                r: 2 + Math.random() * 4
            });
        }
    },

    gameOver() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('fail', { volume: 0.68, minGap: 200 });
        UI.showReaction('fail');
        UI.showScreen('gameover');
        this.canvas.style.transform = 'translate(5px, 5px)';
        setTimeout(() => this.canvas.style.transform = 'none', 100);
    },

    victory() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('win', { volume: 0.72, minGap: 200 });
        setTimeout(() => AudioSys.playSFX('coin', { volume: 0.55, minGap: 50 }), 180);
        UI.showReaction('win');
        UI.showScreen('victory');
        this.spawnParticles(this.width/2, this.height/2, 50, '#fbbf24');
    }
};

// --- UI MANAGER ---
const UI = {
    reactionTimeout: null,
    screens: {
        menu: document.getElementById('menu-screen'),
        level: document.getElementById('level-screen'),
        char: document.getElementById('char-screen'),
        settings: document.getElementById('settings-screen'),
        hud: document.getElementById('hud'),
        pause: document.getElementById('pause-screen'),
        gameover: document.getElementById('game-over-screen'),
        victory: document.getElementById('victory-screen')
    },

    init() {
        // Navigation
        const bind = (id, fn, sfx = 'ui') => {
            document.getElementById(id).onclick = () => {
                AudioSys.playSFX(sfx, { volume: 0.45, minGap: 80 });
                fn();
            };
        };
        
        bind('btn-play-menu', () => this.showScreen('level'));
        bind('btn-chars', () => this.showScreen('char'));
        bind('btn-settings', () => this.showScreen('settings'));
        bind('btn-back-level', () => this.showScreen('menu'));
        bind('btn-back-char', () => this.showScreen('menu'));
        bind('btn-back-settings', () => this.showScreen('menu'));
        
        bind('lvl-1', () => this.startGame(1), 'ui');
        bind('lvl-2', () => this.startGame(2), 'ui');
        
        bind('btn-pause', () => { State.isPaused = true; this.showScreen('pause'); }, 'pause');
        bind('btn-resume', () => { State.isPaused = false; this.showScreen('hud'); }, 'resume');
        bind('btn-quit', () => { AudioSys.playBGM('menu'); this.showScreen('menu'); });
        
        bind('btn-home-fail', () => { AudioSys.playBGM('menu'); this.showScreen('menu'); });
        bind('btn-home-win', () => { AudioSys.playBGM('menu'); this.showScreen('menu'); });
        
        bind('btn-restart-fail', () => this.startGame(State.level), 'resume');
        bind('btn-restart-win', () => this.startGame(State.level === 1 ? 2 : 1), 'resume');

        // Character Select
        [0,1,2].forEach(idx => {
            document.getElementById(`char-${idx}`).onclick = (e) => {
                AudioSys.playSFX('ui', { volume: 0.38, minGap: 70 });
                State.hero.type = idx;
                State.hero.color = idx === 0 ? '#ef4444' : (idx === 1 ? '#3b82f6' : '#facc15');
                document.querySelectorAll('[id^="char-"]').forEach(card => {
                    card.style.opacity = '0.5';
                    card.style.borderColor = 'transparent';
                });
                e.currentTarget.style.opacity = '1';
                e.currentTarget.style.borderColor = 'white';
            };
        });

        // Settings
        bind('btn-toggle-sound', () => {
            State.soundOn = !State.soundOn;
            const dict = LANG.data[LANG.current];
            document.getElementById('snd-text').innerText = State.soundOn ? dict.sound_on : dict.sound_off;
            document.getElementById('snd-icon').innerText = State.soundOn ? "🔊" : "🔇";
            const btn = document.getElementById('btn-toggle-sound');
            btn.classList.toggle('bg-emerald-500', State.soundOn);
            btn.classList.toggle('bg-red-500', !State.soundOn);
            
            AudioSys.playSFX('ui', { volume: 0.32, minGap: 70 });
            if (State.soundOn) AudioSys.playBGM('menu');
            else AudioSys.stopBGM();
        });

        // Language Buttons
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.onclick = () => {
                AudioSys.playSFX('ui', { volume: 0.32, minGap: 70 });
                LANG.current = btn.dataset.lang;
                LANG.update();
                // Refresh sound text manually since it's dynamic
                const dict = LANG.data[LANG.current];
                document.getElementById('snd-text').innerText = State.soundOn ? dict.sound_on : dict.sound_off;
            };
        });
        
        // Init Lang
        LANG.update();
    },

    showScreen(id) {
        State.screen = id;
        Object.values(this.screens).forEach(s => s.classList.add('hidden'));
        if (this.screens[id]) this.screens[id].classList.remove('hidden');
        if (id === 'hud') {
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('hud').classList.add('flex');
        }
        if (id !== 'gameover' && id !== 'victory') {
            this.hideReactions();
        }
    },

    showReaction(type) {
        this.hideReactions();
        const target = document.getElementById(type === 'win' ? 'gif-win' : 'gif-fail');
        if (!target) return;
        target.classList.add('show');
        clearTimeout(this.reactionTimeout);
        this.reactionTimeout = setTimeout(() => target.classList.remove('show'), 2200);
    },

    hideReactions() {
        document.getElementById('gif-win')?.classList.remove('show');
        document.getElementById('gif-fail')?.classList.remove('show');
    },

    startGame(lvl) {
        AudioSys.unlock();
        Game.reset(lvl);
        this.showScreen('hud');
    },

    updateHUD() {
        document.getElementById('score-display').innerText = State.score;
    },

    updateProgress(pct) {
        const p = Math.min(Math.max(pct, 0), 1) * 100;
        document.getElementById('progress-fill').style.width = `${p}%`;
    }
};

// --- BOOTSTRAP ---
window.onload = () => {
    AudioSys.init();
    Game.init();
    UI.init();
    
    // Auto-unlock audio
    document.body.addEventListener('pointerdown', () => {
        if (AudioSys.ctx && AudioSys.ctx.state === 'suspended') AudioSys.unlock();
    }, { once: true });
    
    setTimeout(() => AudioSys.playBGM('menu'), 500);
};
