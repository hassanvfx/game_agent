<style>
  :root {
    --bg-top: #120f2f;
    --bg-bottom: #2c1257;
    --panel-bg: rgba(16, 11, 44, 0.82);
    --panel-border: #7cf6ff;
    --panel-shadow: rgba(1, 8, 28, 0.45);
    --text-main: #f5f2ff;
    --text-soft: #c7d6ff;
    --accent-gold: #ffd166;
    --accent-pink: #ff5da2;
    --accent-cyan: #79f7ff;
    --danger: #ff5b6e;
  }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at top, #3d1882 0%, rgba(61, 24, 130, 0) 35%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }
  body {
    font-family: 'Exo 2', system-ui, sans-serif;
    color: var(--text-main);
  }
  #game-container { position: relative; width: 100%; height: 100%; user-select: none; overflow: hidden; }
  #game-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 18%, rgba(121, 247, 255, 0.14), transparent 18%),
      radial-gradient(circle at 78% 12%, rgba(255, 93, 162, 0.18), transparent 20%),
      radial-gradient(circle at 48% 86%, rgba(255, 209, 102, 0.14), transparent 24%);
    z-index: 0;
  }
  #game-container::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    z-index: 0;
  }
  canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 1; }
  #ui-layer {
    position: absolute;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(0.8rem, env(safe-area-inset-top)) max(0.8rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
    box-sizing: border-box;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
  }
  .hud-side {
    text-align: right;
    line-height: 1.2;
  }
  .hud-label {
    display: block;
    font-size: 0.72rem;
    margin-bottom: 0.3rem;
    color: var(--text-soft);
    letter-spacing: 0.18em;
    font-family: 'Exo 2', system-ui, sans-serif;
    font-weight: 600;
  }
  #score-display,
  #next-display {
    display: block;
    font-size: clamp(1.65rem, 5vw, 2.75rem);
  }
  .memphis-text {
    color: var(--text-main);
    text-shadow: 0 0 10px rgba(121, 247, 255, 0.2);
    letter-spacing: 0.08em;
  }
  .brand-text {
    font-family: 'Bangers', 'Exo 2', system-ui, sans-serif;
    letter-spacing: 0.08em;
  }
  .memphis-panel {
    background: linear-gradient(180deg, rgba(33, 22, 79, 0.96), rgba(12, 10, 37, 0.94));
    border: 2px solid var(--panel-border);
    box-shadow:
      0 14px 30px var(--panel-shadow),
      inset 0 0 0 1px rgba(255,255,255,0.08),
      0 0 24px rgba(124, 246, 255, 0.18);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .memphis-btn {
    background: linear-gradient(180deg, #ffe27f, var(--accent-gold));
    border: 2px solid rgba(22, 11, 41, 0.95);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.32);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    pointer-events: auto;
    width: 100%;
    border-radius: 999px;
    padding: 0.9rem 1.25rem;
    cursor: pointer;
    color: #271139;
  }
  .memphis-btn:active {
    transform: translateY(2px) scale(0.99);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    filter: brightness(0.98);
  }
  .instruction-card {
    align-self: center;
    max-width: 26rem;
    width: 100%;
    padding: 0.85rem 1rem;
    margin-top: 0.75rem;
    text-align: center;
    color: var(--text-soft);
    line-height: 1.45;
    font-size: 0.7rem;
    font-family: 'Exo 2', system-ui, sans-serif;
    font-weight: 600;
  }
  .feedback-gif {
    position: absolute;
    z-index: 55;
    width: min(32vw, 130px);
    max-width: 130px;
    opacity: 0;
    transform: translateY(12px) scale(0.92);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
  }
  .feedback-gif.visible {
    opacity: 0.94;
    transform: translateY(0) scale(1);
  }
  #merge-gif {
    right: 0.8rem;
    bottom: 5.5rem;
  }
  #gameover-gif {
    left: 0.8rem;
    bottom: 5.5rem;
  }
  #game-over-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #game-over-screen.hidden {
    display: none;
  }
  #game-over-panel {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 20rem;
    width: min(100%, 20rem);
    max-height: 90vh;
    box-sizing: border-box;
  }
  .game-over-title {
    font-size: clamp(2rem, 8vw, 3rem);
    margin: 0 0 0.75rem;
    color: #ff82bc;
  }
  .game-over-score {
    font-size: 1rem;
    margin: 0 0 1.25rem;
    color: var(--accent-cyan);
    line-height: 1.6;
  }
  @media (max-width: 480px) {
    #ui-layer {
      padding: max(0.7rem, env(safe-area-inset-top)) max(0.7rem, env(safe-area-inset-right)) max(0.7rem, env(safe-area-inset-bottom)) max(0.7rem, env(safe-area-inset-left));
    }
    #hud {
      gap: 0.65rem;
    }
    .hud-label {
      font-size: 0.62rem;
    }
    #score-display,
    #next-display {
      font-size: clamp(1.35rem, 7vw, 2rem);
    }
    .instruction-card {
      padding: 0.75rem 0.85rem;
      font-size: 0.62rem;
    }
    #game-over-panel {
      padding: 1.15rem;
    }
  }
</style>
<script id="game-config" type="application/x-game-config">
{

<div id="game-container">

<!-- Media Assets -->
<!-- [agent-note][stage3] resolved-audio: loop/drop/merge/gameover/restart -> catalogs/audios.json -->
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3" preload="auto" loop></audio>
<audio id="sfx_drop" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3" preload="auto"></audio>
<audio id="sfx_merge" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>

<script>
// --- L0: Single Source of Truth & Configuration ---
window.gameConfigDefs = {};
window.gameConfig = {};
try {
  const cfgEl = document.getElementById('game-config');
  if (cfgEl) {
    window.gameConfigDefs = JSON.parse(cfgEl.textContent);
    for (let k in window.gameConfigDefs) {
      window.gameConfig[k] = window.gameConfigDefs[k].value;
    }
  }
} catch (e) { console.error('Config parse error', e); }

window.updateGameConfig = (key, val) => {
  if (window.gameConfigDefs[key]) {
    window.gameConfig[key] = val;
  }
};

// --- L0: Core Variables ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER
let score = 0;
let shakeTime = 0;

// --- Physics & Entities ---
let balls = [];
let particles = [];
let mergesThisFrame = [];
let baseScale = 1;

const BASE_TIERS = [
  { r: 16, emoji: '🐁', color: '#EF476F' },
  { r: 24, emoji: '🐹', color: '#FFD166' },
  { r: 34, emoji: '🐰', color: '#06D6A0' },
  { r: 46, emoji: '🦊', color: '#118AB2' },
  { r: 60, emoji: '🐶', color: '#073B4C' },
  { r: 76, emoji: '🐱', color: '#F78C6B' },
  { r: 94, emoji: '😿', color: '#83D483' },
  { r: 114, emoji: '🐈', color: '#0CB0A9' },
  { r: 136, emoji: '👽', color: '#FF9F1C' }, // Bingus
  { r: 160, emoji: '🐆', color: '#E71D36' }, // Floppa
  { r: 190, emoji: '👑', color: '#FFC436' }  // King
];
let TIERS = [];

let dropper = {
  x: 0,
  tier: 0,
  nextTier: 1,
  canDrop: true,
  cooldown: 0,
  y: 60
};

const TOP_BOUND = 120;

// --- L2: Audio System ---
let audioCtx = null;
let audioUnlocked = false;
const bgm = document.getElementById('bgm_main');
const sfxEls = {
  drop: document.getElementById('sfx_drop'),
  merge: document.getElementById('sfx_merge'),
  gameover: document.getElementById('sfx_gameover'),
  restart: document.getElementById('sfx_restart')
};
const gifState = { merge: 0, gameover: 0 };
const feedbackEls = {
  merge: document.getElementById('merge-gif'),
  gameover: document.getElementById('gameover-gif')
};

Object.values(sfxEls).forEach((el) => {
  if (el) el.volume = 0.45;
});
bgm.volume = 0.2;

function unlockAudio() {
  if (audioUnlocked) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    bgm.play().catch(()=>{});
    audioUnlocked = true;
  } catch (e) {}
}

function safePlayMedia(el, reset = true) {
  if (!audioUnlocked || !el) return;
  try {
    if (reset) el.currentTime = 0;
    el.play().catch(()=>{});
  } catch (e) {}
}

function playTone(freq, type, duration, vol=0.1) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (type === 'sine') {
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);
    } else {
      osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
    }
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function showFeedbackGif(kind, duration = 1100) {
  const el = feedbackEls[kind];
  if (!el) return;
  gifState[kind] += 1;
  const token = gifState[kind];
  el.classList.add('visible');
  const baseSrc = el.dataset.baseSrc || el.getAttribute('src');
  el.dataset.baseSrc = baseSrc;
  el.src = `${baseSrc}${baseSrc.includes('?') ? '&' : '?'}t=${Date.now()}`;
  window.setTimeout(() => {
    if (gifState[kind] === token) {
      el.classList.remove('visible');
    }
  }, duration);
}

function vibrate(style = 'light') {
  try {
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
      action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
      params: { style }
    });
  } catch(e){}
}

// --- L0: Viewport & Resize ---
function resize(w, h) {
  cw = w; ch = h;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  baseScale = Math.min(1.5, Math.max(0.8, cw / 400));
  TIERS = BASE_TIERS.map(t => ({...t, r: t.r * baseScale}));
  
  dropper.y = TOP_BOUND - 40 * baseScale;
  
  balls.forEach(b => {
    b.r = TIERS[b.tier].r;
    if (b.x < b.r) b.x = b.r;
    if (b.x > cw - b.r) b.x = cw - b.r;
  });

  if (!initialized) {
    initGame();
    initialized = true;
    requestAnimationFrame(loop);
  }
}

const ro = new ResizeObserver(entries => {
  if (entries.length > 0) {
    let rect = entries[0].contentRect;
    if(rect.width > 0 && rect.height > 0) resize(rect.width, rect.height);
  }
});
ro.observe(canvas);

// --- Game Logic ---
function initGame() {
  balls = [];
  particles = [];
  score = 0;
  shakeTime = 0;
  pickNext();
  pickNext(); // shift to current
  dropper.x = cw / 2;
  dropper.canDrop = true;
  dropper.cooldown = 0;
  updateHUD();
  setState('PLAYING');
  safePlayMedia(sfxEls.restart);
  if (audioUnlocked) {
    bgm.currentTime = 0;
    safePlayMedia(bgm, false);
  }
}

function pickNext() {
  dropper.tier = dropper.nextTier;
  // Random tier 0-2 (weighted)
  let r = Math.random();
  if (r < 0.5) dropper.nextTier = 0;
  else if (r < 0.8) dropper.nextTier = 1;
  else dropper.nextTier = 2;
  document.getElementById('next-display').innerText = BASE_TIERS[dropper.nextTier].emoji;
}

function setState(state) {
  gameState = state;
  const goScreen = document.getElementById('game-over-screen');
  if (state === 'PLAYING') {
    goScreen.classList.add('hidden');
  } else if (state === 'GAMEOVER') {
    goScreen.classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
    vibrate('heavy');
    playTone(150, 'sawtooth', 1.0, 0.18);
    safePlayMedia(sfxEls.gameover);
    if (audioUnlocked) bgm.pause();
    showFeedbackGif('gameover', 1800);
    shakeTime = 0.5;
  }
}

function updateHUD() {
  document.getElementById('score-display').innerText = score;
}

function spawnParticles(x, y, color) {
  for(let i=0; i<10; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = Math.random() * 150 + 50;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      color
    });
  }
}

function dropItem() {
  let r = TIERS[dropper.tier].r;
  let spawnX = Math.max(r, Math.min(cw - r, dropper.x));
  balls.push({
    x: spawnX, y: dropper.y,
    vx: 0, vy: 0,
    tier: dropper.tier,
    r: r,
    dead: false,
    settleTimer: 0
  });
  dropper.canDrop = false;
  dropper.cooldown = 1.0;
  playTone(300 + dropper.tier*20, 'triangle', 0.08, 0.06);
  safePlayMedia(sfxEls.drop);
  vibrate('light');
  pickNext();
}

// --- Input Routing ---
function handleGlobalInput(e) {
  unlockAudio();
  if (e.target.id === 'restart-btn') {
    if (gameState === 'GAMEOVER') initGame();
    return;
  }
  
  if (gameState !== 'PLAYING') return;
  
  let rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  
  if (e.type === 'pointerdown' || e.type === 'pointermove') {
    if (dropper.canDrop) {
      let r = TIERS[dropper.tier].r;
      dropper.x = Math.max(r, Math.min(cw - r, x));
    }
  } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
    if (dropper.canDrop) {
      dropItem();
    }
  }
}

window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

// --- Physics Loop ---
function update(dt) {
  if (dropper.cooldown > 0) {
    dropper.cooldown -= dt;
    if (dropper.cooldown <= 0) dropper.canDrop = true;
  }

  if (shakeTime > 0) shakeTime -= dt;

  let g = gameConfig.gravity;
  
  // Gravity & Integration
  balls.forEach(b => {
    if(b.dead) return;
    b.vy += g * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    // Air friction
    b.vx *= 0.99;
    b.vy *= 0.99;
  });

  mergesThisFrame = [];

  // Collisions (multiple iterations for stability)
  const iterations = 4;
  for(let iter=0; iter<iterations; iter++) {
    for (let i = 0; i < balls.length; i++) {
      let a = balls[i];
      if(a.dead) continue;

      // Walls
      if (a.x - a.r < 0) { a.x = a.r; a.vx *= -gameConfig.bounciness; }
      if (a.x + a.r > cw) { a.x = cw - a.r; a.vx *= -gameConfig.bounciness; }
      if (a.y + a.r > ch) { a.y = ch - a.r; a.vy *= -gameConfig.bounciness; }

      for (let j = i + 1; j < balls.length; j++) {
        let b = balls[j];
        if(b.dead) continue;

        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let distSq = dx*dx + dy*dy;
        let minDist = a.r + b.r;

        if (distSq < minDist * minDist) {
          let dist = Math.sqrt(distSq);
          if(dist === 0) { dx=1; dy=0; dist=1; }
          
          if (a.tier === b.tier && a.tier < TIERS.length - 1) {
            a.dead = true;
            b.dead = true;
            mergesThisFrame.push({x: (a.x+b.x)/2, y: (a.y+b.y)/2, tier: a.tier + 1});
            break; // Stop processing 'a'
          }

          let overlap = minDist - dist;
          let nx = dx / dist;
          let ny = dy / dist;
          
          // Position correction
          let massRatio = 0.5;
          a.x -= nx * overlap * massRatio;
          a.y -= ny * overlap * massRatio;
          b.x += nx * overlap * massRatio;
          b.y += ny * overlap * massRatio;

          // Velocity
          let kx = a.vx - b.vx;
          let ky = a.vy - b.vy;
          let p = 2.0 * (nx * kx + ny * ky) / 2;
          let bounce = gameConfig.bounciness;
          a.vx = (a.vx - p * nx) * bounce;
          a.vy = (a.vy - p * ny) * bounce;
          b.vx = (b.vx + p * nx) * bounce;
          b.vy = (b.vy + p * ny) * bounce;
        }
      }
    }
  }

  // Process merges
  mergesThisFrame.forEach(m => {
    balls.push({
      x: m.x, y: m.y,
      vx: 0, vy: 0,
      tier: m.tier,
      r: TIERS[m.tier].r,
      dead: false,
      settleTimer: 0
    });
    score += (m.tier * 10);
    spawnParticles(m.x, m.y, TIERS[m.tier].color);
    playTone(400 + m.tier*50, 'sine', 0.12, 0.08);
    safePlayMedia(sfxEls.merge);
    if (m.tier >= 3) showFeedbackGif('merge', 900);
    vibrate('medium');
    updateHUD();
  });

  balls = balls.filter(b => !b.dead);

  // Particles
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2;
  });
  particles = particles.filter(p => p.life > 0);

  // Game Over Check
  let isGameOver = false;
  balls.forEach(b => {
    if (Math.abs(b.vx) < 5 && Math.abs(b.vy) < 5) {
      b.settleTimer += dt;
    } else {
      b.settleTimer = 0;
    }
    if (b.settleTimer > 1.5 && (b.y - b.r) < TOP_BOUND) {
      isGameOver = true;
    }
  });

  if (isGameOver) {
    setState('GAMEOVER');
  }
}

// --- Render ---
function drawMemphisBg() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
  bgGrad.addColorStop(0, '#1a1146');
  bgGrad.addColorStop(0.48, '#26195d');
  bgGrad.addColorStop(1, '#110a2a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  const glowA = ctx.createRadialGradient(cw * 0.2, ch * 0.18, 0, cw * 0.2, ch * 0.18, Math.max(cw, ch) * 0.35);
  glowA.addColorStop(0, 'rgba(121, 247, 255, 0.22)');
  glowA.addColorStop(1, 'rgba(121, 247, 255, 0)');
  ctx.fillStyle = glowA;
  ctx.fillRect(0, 0, cw, ch);

  const glowB = ctx.createRadialGradient(cw * 0.82, ch * 0.12, 0, cw * 0.82, ch * 0.12, Math.max(cw, ch) * 0.28);
  glowB.addColorStop(0, 'rgba(255, 93, 162, 0.18)');
  glowB.addColorStop(1, 'rgba(255, 93, 162, 0)');
  ctx.fillStyle = glowB;
  ctx.fillRect(0, 0, cw, ch);
  ctx.restore();

  ctx.strokeStyle = 'rgba(124, 246, 255, 0.08)';
  ctx.lineWidth = 1.5;
  for (let i = -ch; i < cw + ch; i += 34) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + ch, ch);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  for (let y = 0; y < ch; y += 34) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cw, y);
    ctx.stroke();
  }
}

function draw() {
  ctx.save();
  if (shakeTime > 0) {
    let mag = 10 * shakeTime;
    ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
    if(gameState === 'GAMEOVER') {
       ctx.fillStyle = 'rgba(255,0,0,0.2)';
       ctx.fillRect(0,0,cw,ch);
    }
  }

  drawMemphisBg();

  // Top Bound Line
  ctx.strokeStyle = '#ff5b6e';
  ctx.lineWidth = 4;
  ctx.shadowColor = 'rgba(255, 91, 110, 0.5)';
  ctx.shadowBlur = 12;
  ctx.setLineDash([15, 15]);
  ctx.beginPath();
  ctx.moveTo(0, TOP_BOUND);
  ctx.lineTo(cw, TOP_BOUND);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  // Dropper
  if (gameState === 'PLAYING' && dropper.canDrop) {
    let t = TIERS[dropper.tier];
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(dropper.x, dropper.y);
    ctx.lineTo(dropper.x, ch);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1.0;

    drawBall(dropper.x, dropper.y, t);
  }

  // Balls
  balls.forEach(b => {
    if(isFinite(b.x) && isFinite(b.y)) {
      drawBall(b.x, b.y, TIERS[b.tier]);
    }
  });

  // Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    // Memphis shapes: mix of circles and squares
    if(Math.random()>0.5) {
      ctx.arc(p.x, p.y, 6*baseScale, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x-5, p.y-5, 10*baseScale, 10*baseScale);
    }
    ctx.globalAlpha = 1.0;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  ctx.restore();
}

function drawBall(x, y, t) {
  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.arc(x + 5, y + 7, t.r * 0.98, 0, Math.PI*2);
  ctx.fill();

  // Outer glow
  ctx.save();
  ctx.shadowColor = t.color;
  ctx.shadowBlur = Math.max(12, t.r * 0.35);
  const ringGrad = ctx.createRadialGradient(x - t.r * 0.25, y - t.r * 0.3, t.r * 0.15, x, y, t.r);
  ringGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
  ringGrad.addColorStop(0.2, t.color);
  ringGrad.addColorStop(1, 'rgba(12, 10, 30, 0.95)');
  ctx.fillStyle = ringGrad;
  ctx.beginPath();
  ctx.arc(x, y, t.r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Face plate
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(x - t.r * 0.18, y - t.r * 0.24, t.r * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // Border
  ctx.strokeStyle = 'rgba(10, 8, 26, 0.95)';
  ctx.lineWidth = Math.max(3, t.r * 0.08);
  ctx.stroke();

  // Emoji
  ctx.font = `${t.r * 1.08}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t.emoji, x, y + t.r*0.08);

  // Spark accent
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = Math.max(1.5, t.r * 0.04);
  ctx.beginPath();
  ctx.arc(x + t.r * 0.2, y - t.r * 0.15, t.r * 0.18, Math.PI * 1.1, Math.PI * 1.75);
  ctx.stroke();
}

// --- Main Loop ---
let lastTime = performance.now();
function loop(time) {
  requestAnimationFrame(loop);
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;

  try {
    if (gameState === 'PLAYING') {
      update(dt);
    }
    draw();
  } catch (e) {
    console.error('Loop error', e);
  }
}
</script>
