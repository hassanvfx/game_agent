function ensureAudioContext(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audioCtx=new A()}return audioCtx}function configureAudio(){sounds.bgm.volume=.22;sounds.win.volume=.7;sounds.die.volume=.58;sounds.jump.volume=.42;sounds.place.volume=.34;sounds.menu.volume=.38}function unlockAudio(){if(audioUnlocked)return;const c=ensureAudioContext(),start=()=>{audioUnlocked=true;startBgm()};if(c&&c.state==='suspended')c.resume().then(start).catch(start);else start()}function startBgm(){if(!audioUnlocked)return;sounds.bgm.currentTime=0;sounds.bgm.play().catch(()=>{})}function stopBgm(){sounds.bgm.pause();sounds.bgm.currentTime=0}function playMediaSound(a,restart=true){if(!audioUnlocked||!a)return;try{if(restart)a.currentTime=0;a.play().catch(()=>{})}catch(_){}}function playUiSound(){const n=performance.now();if(n<uiSoundCooldownUntil)return;uiSoundCooldownUntil=n+90;playMediaSound(sounds.menu)}function playSound(t){if(!audioUnlocked)return;const n=performance.now();if(t==='jump'){if(n<jumpSoundCooldownUntil)return;jumpSoundCooldownUntil=n+140;playMediaSound(sounds.jump)}else if(t==='place'){if(n<placeSoundCooldownUntil)return;placeSoundCooldownUntil=n+70;playMediaSound(sounds.place)}else if(t==='win')playMediaSound(sounds.win);else if(t==='die')playMediaSound(sounds.die)}function showFeedbackGif(type){const el=feedbackGifs[type];if(!el)return;if(gifTimers[type])clearTimeout(gifTimers[type]);el.classList.add('visible');gifTimers[type]=setTimeout(()=>el.classList.remove('visible'),type==='win'?2200:1500)}

function handlePointer(e,type){if(appState!=='EDITOR')return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(type==='down'){if(y<60||y>innerHeight-100)return;isDragging=true;placeTileAt(x,y)}else if(type==='move'){if(isDragging)placeTileAt(x,y)}else if(type==='up')isDragging=false}function placeTileAt(sx,sy){const renderScale=innerHeight/VIEW_H,wx=sx/renderScale+editorCam.x,wy=sy/renderScale+editorCam.y,tx=Math.floor(wx/TILE_SIZE),ty=Math.floor(wy/TILE_SIZE),key=tx+','+ty;if(selectedTile===0){if(editorLevel[key]){delete editorLevel[key];playSound('place')}}else if(editorLevel[key]!==selectedTile){editorLevel[key]=selectedTile;playSound('place');for(let i=0;i<5;i++)particles.push({x:tx*TILE_SIZE+20,y:ty*TILE_SIZE+20,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,color:getColor(selectedTile)})}}

function updatePhysics(){if(player.dead||player.win)return;if(input.left)player.vx-=1;if(input.right)player.vx+=1;player.vx*=.85;if(Math.abs(player.vx)<.1)player.vx=0;if(player.vx>window.gameConfig.playerSpeed)player.vx=window.gameConfig.playerSpeed;if(player.vx<-window.gameConfig.playerSpeed)player.vx=-window.gameConfig.playerSpeed;player.x+=player.vx;checkCollision('x');player.vy+=window.gameConfig.gravity;player.y+=player.vy;player.grounded=false;checkCollision('y');if(input.jump&&player.grounded){player.vy=-window.gameConfig.jumpForce;player.grounded=false;playSound('jump');for(let i=0;i<5;i++)particles.push({x:player.x+12,y:player.y+24,vx:(Math.random()-.5)*5,vy:Math.random()*2,life:.5,color:'#fff8cc'})}if(player.y>2000)die();const tx=player.x-VIEW_W/2+player.w/2,ty=player.y-VIEW_H/2+player.w/2;camera.x+=(tx-camera.x)*.1;camera.y+=(ty-camera.y)*.1}
function checkCollision(axis){const sx=Math.floor(player.x/TILE_SIZE),ex=Math.floor((player.x+player.w)/TILE_SIZE),sy=Math.floor(player.y/TILE_SIZE),ey=Math.floor((player.y+player.h)/TILE_SIZE);for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++){const tile=currentLevelData[x+','+y];if(tile){if(tile===1){if(axis==='x'){if(player.vx>0)player.x=x*TILE_SIZE-player.w-.1;else if(player.vx<0)player.x=x*TILE_SIZE+TILE_SIZE+.1;player.vx=0}else{if(player.vy>0){player.y=y*TILE_SIZE-player.h-.1;player.grounded=true;player.vy=0}else if(player.vy<0){player.y=y*TILE_SIZE+TILE_SIZE+.1;player.vy=0}}}else if(tile===2){const hx=x*TILE_SIZE+10,hy=y*TILE_SIZE+10;if(rectIntersect(player.x,player.y,player.w,player.h,hx,hy,20,20))die()}else if(tile===3)win()}}}function rectIntersect(x1,y1,w1,h1,x2,y2,w2,h2){return x2<x1+w1&&x2+w2>x1&&y2<y1+h1&&y2+h2>y1}function die(){if(player.dead)return;player.dead=true;playSound('die');showFeedbackGif('fail');for(let i=0;i<20;i++)particles.push({x:player.x+12,y:player.y+12,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,life:1.5,color:'#ffd84f'});setTimeout(()=>{if(appState==='GAME_TEST'||appState==='GAME')resetPlayer()},1000)}function win(){if(player.win)return;player.win=true;playSound('win');showFeedbackGif('win');document.getElementById('win-screen').classList.remove('hidden')}
function gameLoop(t){lastTime=t;if(appState==='GAME'||appState==='GAME_TEST')updatePhysics();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.02;if(p.life<=0)particles.splice(i,1)}const scale=innerHeight/VIEW_H,viewW=innerWidth/scale;drawScene(scale,viewW,t);requestAnimationFrame(gameLoop)}function drawScene(scale,viewW,t){ctx.fillStyle='#66c8ff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(scale,scale);drawBackground(viewW,t);const camX=appState==='EDITOR'?editorCam.x:camera.x,camY=appState==='EDITOR'?editorCam.y:camera.y;ctx.translate(-camX,-camY);const level=appState==='EDITOR'?editorLevel:currentLevelData;for(const k in level){const a=k.split(',').map(Number);drawTile(a[0]*TILE_SIZE,a[1]*TILE_SIZE,level[k],t)}if(appState==='GAME'||appState==='GAME_TEST')drawPlayer(t);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.restore()}
function drawBackground(viewW,t){const g=ctx.createLinearGradient(0,0,0,VIEW_H);g.addColorStop(0,'#66c8ff');g.addColorStop(.65,'#c7f2ff');g.addColorStop(1,'#8edc68');ctx.fillStyle=g;ctx.fillRect(0,0,viewW,VIEW_H);ctx.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<5;i++){const x=((t*.012+i*190)%(viewW+160))-80,y=45+(i%3)*45;cloudShape(x,y,60+i*8)}ctx.fillStyle='#61bd56';for(let i=-1;i<8;i++){ctx.beginPath();ctx.arc(i*170+60,390,120,Math.PI,0);ctx.fill()}ctx.fillStyle='#3c9e47';ctx.fillRect(0,386,viewW,70);ctx.fillStyle='rgba(255,255,255,.18)';for(let x=0;x<viewW;x+=40)ctx.fillRect(x,396,20,4)}function cloudShape(x,y,s){ctx.beginPath();ctx.arc(x,y,s*.28,0,Math.PI*2);ctx.arc(x+s*.27,y-s*.13,s*.34,0,Math.PI*2);ctx.arc(x+s*.58,y,s*.26,0,Math.PI*2);roundRect(ctx,x-s*.08,y,s*.78,s*.22,12,true,false)}
function drawPlayer(t){if(player.dead)return;const x=player.x,y=player.y+Math.sin(t*.012)*1.3,facing=player.vx>=0?1:-1;ctx.save();ctx.translate(x+12,y+12);ctx.scale(facing,1);ctx.fillStyle='rgba(255,216,79,.38)';ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f66d5';roundRect(ctx,-9,-1,18,17,4,true,false);ctx.fillStyle='#f0b082';roundRect(ctx,-9,-13,18,14,5,true,false);ctx.fillStyle='#e4312e';roundRect(ctx,-13,-20,25,10,7,true,false);ctx.fillRect(-8,-24,17,8);ctx.fillStyle='white';ctx.beginPath();ctx.arc(1,-19,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4312e';ctx.font='10px Bangers';ctx.textAlign='center';ctx.fillText('M',1,-16);ctx.fillStyle='#2b160f';ctx.beginPath();ctx.arc(5,-8,1.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b2b17';ctx.fillRect(1,-3,10,3);ctx.fillStyle='#6b351d';ctx.fillRect(-9,16,7,5);ctx.fillRect(3,16,7,5);ctx.restore()}
function drawTile(x,y,type,t){if(type===1){ctx.fillStyle='#7b3f22';roundRect(ctx,x,y,TILE_SIZE,TILE_SIZE,5,true,false);const grad=ctx.createLinearGradient(x,y,x,y+TILE_SIZE);grad.addColorStop(0,'#f0a04a');grad.addColorStop(1,'#b75d2b');ctx.fillStyle=grad;roundRect(ctx,x+2,y+2,TILE_SIZE-4,TILE_SIZE-4,4,true,false);ctx.strokeStyle='rgba(94,39,16,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+2,y+16);ctx.lineTo(x+38,y+16);ctx.moveTo(x+2,y+29);ctx.lineTo(x+38,y+29);ctx.moveTo(x+20,y+2);ctx.lineTo(x+20,y+16);ctx.moveTo(x+12,y+16);ctx.lineTo(x+12,y+29);ctx.moveTo(x+28,y+29);ctx.lineTo(x+28,y+38);ctx.stroke()}else if(type===2){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x+20,y+22,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+20,y+22,18,Math.PI*1.15,Math.PI*1.55);ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(x+15,y+18,3,0,Math.PI*2);ctx.arc(x+25,y+18,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e44635';ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(x+20,y+6);ctx.lineTo(x+35,y+34);ctx.lineTo(x+5,y+34);ctx.closePath();ctx.fill();ctx.globalAlpha=1}else if(type===3){const fy=Math.sin(t*.006)*4;ctx.fillStyle='#2f9c45';ctx.fillRect(x+10,y+5,6,34);ctx.fillStyle='#e4312e';ctx.beginPath();ctx.moveTo(x+16,y+6+fy);ctx.lineTo(x+37,y+13+fy);ctx.lineTo(x+16,y+22+fy);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd84f';ctx.beginPath();drawStar(ctx,x+23,y+26+fy,5,10,5);ctx.fill()}else if(type===4){ctx.fillStyle='rgba(255,216,79,.4)';ctx.beginPath();ctx.arc(x+20,y+21,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4312e';roundRect(ctx,x+9,y+14,22,14,8,true,false);ctx.fillRect(x+14,y+9,12,8);ctx.fillStyle='white';ctx.beginPath();ctx.arc(x+20,y+18,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e4312e';ctx.font='10px Bangers';ctx.textAlign='center';ctx.fillText('M',x+20,y+21)}}function getColor(t){return t===1?'#f0a04a':t===2?'#e44635':t===3?'#ffd84f':'#fff'}function drawStar(ctx,cx,cy,spikes,outerRadius,innerRadius){let rot=Math.PI/2*3,x=cx,y=cy,step=Math.PI/spikes;ctx.beginPath();ctx.moveTo(cx,cy-outerRadius);for(let i=0;i<spikes;i++){x=cx+Math.cos(rot)*outerRadius;y=cy+Math.sin(rot)*outerRadius;ctx.lineTo(x,y);rot+=step;x=cx+Math.cos(rot)*innerRadius;y=cy+Math.sin(rot)*innerRadius;ctx.lineTo(x,y);rot+=step}ctx.lineTo(cx,cy-outerRadius);ctx.closePath()}function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke()}addEventListener('DOMContentLoaded',init);
</script></body></html>
