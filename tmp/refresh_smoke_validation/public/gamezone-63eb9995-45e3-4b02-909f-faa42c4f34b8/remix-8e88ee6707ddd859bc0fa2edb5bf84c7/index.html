<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Toadstool Trail Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--sky:#75d7ff;--sky2:#b8f1ff;--leaf:#4fd66d;--hill:#9eed7b;--brick:#d67735;--brick2:#f4a04d;--cream:#fff4cf;--red:#e94735;--gold:#ffd447;--ink:#2b1c18;--panel:rgba(255,247,207,.94);--blue:#2388ff;--shadow:0 14px 28px rgba(79,65,29,.24)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#79dcff,#d9fbff 72%,#70d957);font-family:'Press Start 2P',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}button,textarea{font:inherit;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:none}.hidden{display:none!important}.btn{border:0;border-radius:999px;min-height:48px;padding:12px 16px;background:linear-gradient(#ffe987,#ffc22e);color:#522b10;box-shadow:0 6px 0 #b36d16,var(--shadow);cursor:pointer;text-transform:uppercase;letter-spacing:.02em}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b36d16}.ui{position:absolute;inset:0;pointer-events:none}.card{pointer-events:auto;background:var(--panel);border:4px solid #fff;border-radius:28px;box-shadow:0 0 0 4px #c46b31,var(--shadow);padding:22px;position:relative}.card:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(179,109,22,.25);border-radius:20px;pointer-events:none}.center{display:flex;align-items:center;justify-content:center;padding:18px}.menu{width:min(92vw,430px);text-align:center;display:flex;flex-direction:column;gap:14px}.logo{font-family:Bangers,cursive;font-size:clamp(3rem,14vw,5.6rem);line-height:.82;color:#e94735;text-shadow:3px 3px 0 #fff,6px 6px 0 #7b3f1f;margin:2px 0 8px}.tag{font-size:.62rem;line-height:1.6;color:#74543a}.mush-row{display:flex;justify-content:center;gap:10px;font-size:1.8rem}.top-hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.badge{background:rgba(255,247,207,.92);border:3px solid #fff;border-radius:18px;box-shadow:0 4px 0 #c46b31;padding:8px 10px;font-size:.56rem;line-height:1.35}.controls{position:absolute;inset:0;pointer-events:none}.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}.pad.left{left:16px}.pad.right{right:16px}.control{width:68px;height:62px;border-radius:22px;border:4px solid #fff;background:linear-gradient(#ffe987,#ffa92f);box-shadow:0 7px 0 #a85b19;color:#512200;font-size:1.15rem}.control.jump{width:82px;height:82px;border-radius:50%;background:linear-gradient(#ff7a65,#e5382a);color:white;box-shadow:0 8px 0 #9c201a}.exit{pointer-events:auto;position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;width:48px;height:48px;padding:0;border-radius:16px;background:linear-gradient(#fff,#ffd67c)}
.map{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:none}.map .card{width:min(92vw,460px);max-height:86vh;display:flex;flex-direction:column;gap:12px}.map-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.map h2,.editor-title{font-family:Bangers,cursive;font-size:2.3rem;letter-spacing:.04em;margin:0;color:#e94735;text-shadow:2px 2px #fff}.route{display:flex;justify-content:space-between;align-items:center;gap:10px;border:3px solid #ffde77;border-radius:18px;background:#fff8da;padding:14px;cursor:pointer;font-size:.66rem;line-height:1.35}.route span:last-child{font-size:1.4rem}.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(83,178,255,.28);padding:18px;pointer-events:auto}.modal .card{width:min(92vw,430px);display:flex;flex-direction:column;gap:12px;text-align:center}.win-title{font-family:Bangers,cursive;font-size:3.4rem;color:#e94735;text-shadow:3px 3px #fff;margin:0}

.editorbar{position:absolute;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 10px 10px;background:linear-gradient(rgba(255,247,207,.96),rgba(255,247,207,.72));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:auto;border-bottom:4px solid #e79a3e}.editorbar .btn{font-size:.58rem;min-height:40px;padding:9px 11px}.palette{position:absolute;left:0;right:0;bottom:0;padding:12px 8px max(14px,env(safe-area-inset-bottom));background:linear-gradient(rgba(255,247,207,.72),rgba(255,247,207,.98));display:flex;justify-content:center;gap:8px;pointer-events:auto;border-top:4px solid #e79a3e}.tilebtn{width:55px;height:55px;border:4px solid #fff;border-radius:17px;background:#ffe68a;box-shadow:0 4px 0 #bd7628;font-size:1.25rem}.tilebtn.sel{outline:4px solid #2388ff}textarea{width:100%;min-height:112px;border:3px solid #c46b31;border-radius:16px;padding:12px;background:#fff8da;color:#432412;font-size:.62rem;line-height:1.5}.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#fff8da;border:3px solid #fff;border-radius:999px;padding:10px 14px;box-shadow:0 4px 0 #c46b31;font-size:.55rem;pointer-events:none;opacity:0;transition:.2s}.toast.show{opacity:1}.gif{position:absolute;right:12px;top:78px;width:92px;height:92px;object-fit:contain;pointer-events:none;opacity:0;transform:scale(.6);transition:.2s}.gif.visible{opacity:1;transform:scale(1)}@media (max-width:390px){.control{width:60px;height:56px}.control.jump{width:74px;height:74px}.badge{font-size:.49rem}.btn{font-size:.62rem}.tilebtn{width:50px;height:50px}.logo{font-size:3.2rem}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" loop preload="auto"></audio>
<audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_character_01.mp3" preload="auto"></audio>
<audio id="sfx_win" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio>
<audio id="sfx_die" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_defeat_01.mp3" preload="auto"></audio>
<audio id="sfx_place" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_02.mp3" preload="auto"></audio>
<img id="winGif" class="gif" src="https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp" alt="win cheer">
<img id="failGif" class="gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="bonk reaction">
<div id="ui" class="ui center"><section id="menu" class="card menu"><div class="mush-row">🍄 ⭐ 🌼</div><h1 class="logo">Toadstool<br>Trail</h1><p class="tag">Build bright routes, leap with momentum, dodge wobble-goombas, and grab the star flag.</p><button id="btnStory" class="btn">Adventure Map</button><button id="btnCreate" class="btn">Make Secret Course</button><button id="btnImport" class="btn">Load Route Code</button></section></div>
<div id="hud" class="top-hud hidden"><div class="badge">COURSE<br><span id="courseName">Mushroom Meadows</span></div><div class="badge">GOAL<br>Reach the star flag</div></div>
<div id="controls" class="controls hidden"><button id="gameExit" class="btn exit">×</button><div class="pad left"><button id="left" class="control">◀</button><button id="right" class="control">▶</button></div><div class="pad right"><button id="jump" class="control jump">JUMP</button></div></div>
<div id="map" class="map hidden"><section class="card"><div class="map-head"><h2>Adventure Map</h2><button id="mapBack" class="btn">Menu</button></div><div id="levelList"></div></section></div>
<div id="editor" class="hidden"><div class="editorbar"><button id="edExit" class="btn">←</button><div class="editor-title">Secret Blocks</div><div><button id="edCode" class="btn">Code</button><button id="edPlay" class="btn">Test</button></div></div><div class="palette"><button class="tilebtn sel" data-t="1">❔</button><button class="tilebtn" data-t="2">🍄</button><button class="tilebtn" data-t="3">⭐</button><button class="tilebtn" data-t="4">🚩</button><button class="tilebtn" data-t="0">🧽</button></div></div>
<div id="codeModal" class="modal hidden"><section class="card"><h2 class="editor-title">Route Code</h2><textarea id="codeOut" readonly></textarea><button id="codeClose" class="btn">Close</button></section></div>
<div id="importModal" class="modal hidden"><section class="card"><h2 class="editor-title">Load Course</h2><textarea id="codeIn" placeholder="Paste route code"></textarea><button id="importGo" class="btn">Play</button><button id="importCancel" class="btn">Cancel</button></section></div>
<div id="winModal" class="modal hidden"><section class="card"><h2 class="win-title">Star Found!</h2><p class="tag">The trail is cleared for the mushroom parade.</p><button id="winBack" class="btn">Next Stop</button></section></div>
<div id="toast" class="toast">Ready!</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});
const TILE=40,VIEW_H=520,GRAVITY=.8,JUMP=14,SPEED=6;
let state='MENU',last=0,camera={x:0,y:0},editorCam={x:-160,y:0},selected=1,drag=false,particles=[],toastTimer=null,audioOn=false;
let level={},editorLevel={},input={left:false,right:false,jump:false};
let player={x:0,y:0,vx:0,vy:0,w:24,h:24,grounded:false,dead:false,win:false};
const $=id=>document.getElementById(id);
const aud={bgm:$('bgm'),jump:$('sfx_jump'),win:$('sfx_win'),die:$('sfx_die'),place:$('sfx_place')};
const gifs={win:$('winGif'),die:$('failGif')};
const story=[
 {name:'1. Mushroom Meadows',icon:'🍄',data:'eyIwLDEwIjoxLCIxLDEwIjoxLCIyLDEwIjoxLCIzLDEwIjoxLCI0LDEwIjoxLCI1LDEwIjoxLCI2LDEwIjoxLCI3LDEwIjoxLCI4LDEwIjoxLCI5LDEwIjoxLCIxMCwxMCI6MSwiMTEsMTAiOjEsIjEyLDEwIjoxLCIxMywxMCI6MSwiMTQsMTAiOjEsIjE1LDEwIjoxLCIxNiwxMCI6MSwiMTcsMTAiOjEsIjE4LDEwIjoxLCIxOSwxMCI6MSwiMjAsMTAiOjEsIjUsOSI6MSwiOCw4IjoxLCIxMSw3IjoxLCIxNSw2IjoxLCIyMCw5IjozLCIyLDkiOjR9'},
 {name:'2. Wobble-Goomba Garden',icon:'🌼',data:'eyIwLDEwIjoxLCIxLDEwIjoxLCIyLDEwIjoxLCIzLDEwIjoxLCI0LDEwIjoxLCI1LDEwIjoyLCI2LDEwIjoyLCI3LDEwIjoyLCI4LDEwIjoxLCI5LDEwIjoxLCIxMCwxMCI6MSwiMTEsMTAiOjEsIjEyLDEwIjoyLCIxMywxMCI6MiwxNCwxMCI6MSwiMTUsMTAiOjEsIjE2LDEwIjoxLCIxNywxMCI6MSwiMTgsMTAiOjEsIjE5LDEwIjoxLCIyMCwxMCI6MSwiMjEsMTAiOjEsIjIsOSI6NCwiMjAsOSI6MywiNCw3IjoxLCI4LDYiOjEsIjEyLDUiOjF9'},
 {name:'3. Sky-Beanstalk Sprint',icon:'⭐',data:'eyIwLDE1IjoxLCIxLDE1IjoxLCIyLDE1IjoxLCIzLDE1IjoxLCIyLDE0Ijo0LCI1LDEzIjoxLCI4LDExIjoxLCIxMSw5IjoxLCIxNCw3IjoxLCIxMSw1IjoxLCI4LDMiOjEsIjUsMyI6MywiNSw0IjoxLCIxNywxNSI6MSwiMTgsMTUiOjEsIjE5LDE1IjoxLCIyMCwxNSI6MSwiMjEsMTUiOjEsIjIyLDE1IjoxLCIyMywxNSI6MSwiMjQsMTUiOjF9'}
];
function resize(){const dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function unlock(){if(audioOn)return;audioOn=true;aud.bgm.volume=.22;aud.jump.volume=.42;aud.win.volume=.62;aud.die.volume=.62;aud.place.volume=.38;aud.bgm.play().catch(()=>{})}
function sfx(k){if(!audioOn||!aud[k])return;try{aud[k].currentTime=0;aud[k].play().catch(()=>{})}catch(e){}}
function flash(kind){const el=gifs[kind];if(!el)return;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),kind==='win'?1800:1200)}
function note(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function renderList(){const list=$('levelList');list.innerHTML='';story.forEach(l=>{const d=document.createElement('div');d.className='route';d.innerHTML=`<span>${l.name}<br><small>Tap to run the course</small></span><span>${l.icon}</span>`;d.onclick=()=>loadLevel(l.data,l.name);list.appendChild(d)})}
function show(s){state=s;['menu','map','editor','controls','hud','winModal'].forEach(id=>$(id).classList.add('hidden'));$('ui').classList.add('hidden');if(s==='MENU'){$('ui').classList.remove('hidden');$('menu').classList.remove('hidden')}if(s==='MAP')$('map').classList.remove('hidden');if(s==='EDITOR'){$('editor').classList.remove('hidden');editorCam={x:-160,y:-80}}if(s==='GAME'||s==='TEST'){$('controls').classList.remove('hidden');$('hud').classList.remove('hidden');resetPlayer()}if(s==='MENU'||s==='MAP')aud.bgm.pause()}
function resetPlayer(){let sx=100,sy=100;for(const k in level){if(level[k]===4){const [x,y]=k.split(',').map(Number);sx=x*TILE;sy=y*TILE;break}}player={x:sx,y:sy,vx:0,vy:0,w:24,h:24,grounded:false,dead:false,win:false};camera.x=sx-160;camera.y=sy-250;input.left=input.right=input.jump=false}


function loadLevel(b64,name='Secret Course'){try{level=JSON.parse(atob(b64));$('courseName').textContent=name;show('GAME');unlock();aud.bgm.play().catch(()=>{});note('Leap to the star flag!')}catch(e){note('Invalid route code')}}
function testLevel(){let ok=false;for(const k in editorLevel)if(editorLevel[k]===4)ok=true;if(!ok){note('Place a flag start first!');return}level=JSON.parse(JSON.stringify(editorLevel));$('courseName').textContent='Your Secret Course';show('TEST')}
function exportLevel(){$('codeOut').value=btoa(JSON.stringify(editorLevel));$('codeModal').classList.remove('hidden')}
function placeAt(sx,sy){const scale=innerHeight/VIEW_H,wx=sx/scale+editorCam.x,wy=sy/scale+editorCam.y,tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE),key=tx+','+ty;if(selected===0)delete editorLevel[key];else editorLevel[key]=selected;sfx('place');for(let i=0;i<4;i++)particles.push({x:tx*TILE+20,y:ty*TILE+20,vx:(Math.random()-.5)*8,vy:(Math.random()-.7)*8,life:1,c:color(selected)})}
function pointer(e,type){unlock();if(state!=='EDITOR')return;const y=e.clientY;if(y<76||y>innerHeight-86)return;if(type==='down'){drag=true;placeAt(e.clientX,y)}if(type==='move'&&drag)placeAt(e.clientX,y);if(type==='up')drag=false}
function init(){resize();addEventListener('resize',resize);renderList();$('btnStory').onclick=()=>show('MAP');$('btnCreate').onclick=()=>show('EDITOR');$('btnImport').onclick=()=>{$('importModal').classList.remove('hidden');$('codeIn').value=''};$('mapBack').onclick=()=>show('MENU');$('edExit').onclick=()=>show('MENU');$('edPlay').onclick=testLevel;$('edCode').onclick=exportLevel;$('codeClose').onclick=()=>$('codeModal').classList.add('hidden');$('importCancel').onclick=()=>$('importModal').classList.add('hidden');$('importGo').onclick=()=>{loadLevel($('codeIn').value);$('importModal').classList.add('hidden')};$('gameExit').onclick=()=>show(state==='TEST'?'EDITOR':'MENU');$('winBack').onclick=()=>show(state==='TEST'?'EDITOR':'MAP');document.querySelectorAll('.tilebtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tilebtn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.t});bind('left','left');bind('right','right');bind('jump','jump');document.addEventListener('pointerdown',e=>pointer(e,'down'),{passive:true});document.addEventListener('pointermove',e=>pointer(e,'move'),{passive:true});document.addEventListener('pointerup',e=>pointer(e,'up'),{passive:true});requestAnimationFrame(loop)}
function bind(id,k){const b=$(id);['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();unlock();input[k]=true},{passive:false}));['pointerup','pointerleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();input[k]=false},{passive:false}))}
function update(){if(player.dead||player.win)return;if(input.left)player.vx-=1;if(input.right)player.vx+=1;player.vx*=.85;if(Math.abs(player.vx)<.1)player.vx=0;player.vx=Math.max(-SPEED,Math.min(SPEED,player.vx));player.x+=player.vx;collide('x');player.vy+=GRAVITY;player.y+=player.vy;player.grounded=false;collide('y');if(input.jump&&player.grounded){player.vy=-JUMP;player.grounded=false;sfx('jump');for(let i=0;i<7;i++)particles.push({x:player.x+12,y:player.y+24,vx:(Math.random()-.5)*7,vy:Math.random()*3,life:.7,c:'#fff7b0'})}if(player.y>2000)die();camera.x+=(player.x-VIEW_H/2-camera.x)*.1;camera.y+=(player.y-VIEW_H/2-camera.y)*.1}
function collide(axis){const sx=Math.floor(player.x/TILE),ex=Math.floor((player.x+player.w)/TILE),sy=Math.floor(player.y/TILE),ey=Math.floor((player.y+player.h)/TILE);for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++){const t=level[x+','+y];if(!t)continue;if(t===1){if(axis==='x'){if(player.vx>0)player.x=x*TILE-player.w-.1;else if(player.vx<0)player.x=x*TILE+TILE+.1;player.vx=0}else{if(player.vy>0){player.y=y*TILE-player.h-.1;player.grounded=true;player.vy=0}else if(player.vy<0){player.y=y*TILE+TILE+.1;player.vy=0;pop(x*TILE+20,y*TILE+40,'#ffd447')}}}else if(t===2){if(hit(player.x,player.y,player.w,player.h,x*TILE+10,y*TILE+10,20,20))die()}else if(t===3)win()}}
function hit(x1,y1,w1,h1,x2,y2,w2,h2){return x2<x1+w1&&x2+w2>x1&&y2<y1+h1&&y2+h2>y1}
function die(){if(player.dead)return;player.dead=true;sfx('die');flash('die');pop(player.x+12,player.y+12,'#e94735',24);setTimeout(()=>{if(state==='GAME'||state==='TEST')resetPlayer()},900)}
function win(){if(player.win)return;player.win=true;sfx('win');flash('win');pop(player.x+12,player.y+12,'#ffd447',36);$('winModal').classList.remove('hidden')}

function loop(t){last=t;if(state==='GAME'||state==='TEST')update();particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025;return p.life>0});draw(t);requestAnimationFrame(loop)}
function draw(t){const scale=innerHeight/VIEW_H,viewW=innerWidth/scale,camX=state==='EDITOR'?editorCam.x:camera.x,camY=state==='EDITOR'?editorCam.y:camera.y;ctx.fillStyle='#83ddff';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.scale(scale,scale);drawScene(camX,camY,viewW,t);ctx.translate(-camX,-camY);const data=state==='EDITOR'?editorLevel:level;for(const k in data){const [x,y]=k.split(',').map(Number);tile(x*TILE,y*TILE,data[k],t)}if(state==='GAME'||state==='TEST')hero(t);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.life,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.restore()}
function drawScene(camX,camY,viewW,t){const g=ctx.createLinearGradient(0,0,0,VIEW_H);g.addColorStop(0,'#72d7ff');g.addColorStop(.65,'#d9fbff');g.addColorStop(1,'#6fd95d');ctx.fillStyle=g;ctx.fillRect(0,0,viewW,VIEW_H);for(let i=0;i<6;i++){const x=(i*170-(camX*.18)%170)-40,y=70+(i%3)*38;cloud(x,y,t+i*400)}for(let i=-1;i<8;i++){ctx.fillStyle=i%2?'#93e665':'#71d957';ctx.beginPath();ctx.arc(i*150-(camX*.28)%150,510,120,Math.PI,0);ctx.fill();ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(i*150+20-(camX*.28)%150,470,38,0,Math.PI*2);ctx.fill()}for(let x=Math.floor(camX/TILE)*TILE;x<camX+viewW+TILE;x+=TILE){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-camX,0);ctx.lineTo(x-camX,VIEW_H);ctx.stroke()}}
function cloud(x,y,t){ctx.fillStyle='rgba(255,255,255,.88)';ctx.beginPath();ctx.arc(x+Math.sin(t*.001)*4,y,20,0,7);ctx.arc(x+24,y-10,25,0,7);ctx.arc(x+55,y,20,0,7);ctx.fill()}
function tile(x,y,type,t){if(type===1){ctx.fillStyle='#d67735';round(x,y,TILE,TILE,8);ctx.fillStyle='#f4a04d';round(x+4,y+4,TILE-8,12,5);ctx.fillStyle='rgba(94,46,18,.28)';ctx.fillRect(x+6,y+24,TILE-12,5);ctx.fillStyle='#fff0a8';ctx.font='18px serif';ctx.fillText('?',x+14,y+27)}else if(type===2){ctx.fillStyle='#73401e';ctx.beginPath();ctx.ellipse(x+20,y+26,15,12,0,0,7);ctx.fill();ctx.fillStyle='#9b6a36';ctx.beginPath();ctx.arc(x+20,y+14,18,Math.PI,0);ctx.lineTo(x+38,y+28);ctx.lineTo(x+2,y+28);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.arc(x+14,y+18,3,0,7);ctx.arc(x+26,y+18,3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(x+13,y+18,2,2);ctx.fillRect(x+25,y+18,2,2)}else if(type===3){const fy=Math.sin(t*.006)*5;ctx.fillStyle='rgba(255,212,71,.35)';ctx.beginPath();ctx.arc(x+20,y+20+fy,25,0,7);ctx.fill();ctx.fillStyle='#ffd447';star(x+20,y+20+fy,13,6);ctx.fillStyle='#fff8bd';star(x+20,y+20+fy,6,3)}else if(type===4){ctx.strokeStyle='#2388ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+14,y+34);ctx.lineTo(x+14,y+4);ctx.stroke();ctx.fillStyle='#e94735';ctx.beginPath();ctx.moveTo(x+14,y+5);ctx.lineTo(x+36,y+13);ctx.lineTo(x+14,y+22);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+8,y+34,17,5)}}
function hero(t){if(player.dead)return;const x=player.x,y=player.y+Math.sin(t*.013)*1.2,face=player.vx>=0?1:-1;ctx.save();ctx.translate(x+12,y+12);ctx.scale(face,1);ctx.fillStyle='#2d65ff';round(-9,2,18,12,5);ctx.fillStyle='#f2b26c';round(-8,-5,16,13,6);ctx.fillStyle='#e94735';ctx.beginPath();ctx.arc(0,-9,12,Math.PI,0);ctx.lineTo(12,-8);ctx.lineTo(-12,-8);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-1,2.5,0,7);ctx.arc(4,-1,2.5,0,7);ctx.fill();ctx.fillStyle='#211';ctx.fillRect(-3,-1,1.5,2);ctx.fillRect(5,-1,1.5,2);ctx.strokeStyle='#6d2a14';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,5,4,0,Math.PI);ctx.stroke();ctx.restore()}

function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.fill()}
function star(cx,cy,ro,ri){ctx.beginPath();let a=-Math.PI/2;for(let i=0;i<10;i++){const r=i%2?ri:ro;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);a+=Math.PI/5}ctx.closePath();ctx.fill()}
function pop(x,y,c,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.8)*12,life:1,c})}
function color(t){return t===1?'#d67735':t===2?'#73401e':t===3?'#ffd447':'#2388ff'}
addEventListener('DOMContentLoaded',init);
</script>
