<style>
    :root {
        --bg-top: #0d1736;
        --bg-bottom: #060b17;
        --panel: rgba(11, 22, 48, 0.82);
        --panel-strong: rgba(17, 31, 66, 0.94);
        --panel-border: rgba(126, 225, 255, 0.34);
        --text-main: #edf7ff;
        --text-muted: #9bb6d1;
        --cyan: #64e8ff;
        --cyan-strong: #29d6ff;
        --violet: #8b7bff;
        --pink: #ff6bb7;
        --gold: #ffd95a;
        --danger: #ff6b79;
        --success: #5ef0a3;
        --shadow: 0 16px 36px rgba(0, 0, 0, 0.34);
    }
    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(75, 122, 255, 0.24), transparent 34%),
            radial-gradient(circle at 80% 18%, rgba(100, 232, 255, 0.15), transparent 24%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text-main);
        font-family: 'Exo 2', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }
    html, body, button, textarea {
        touch-action: manipulation;
    }
    body { position: relative; }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.18;
        mix-blend-mode: screen;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    #game-container, #ui-layer, #editor-ui, #game-controls, #story-map,
    #code-modal, #import-modal, #win-screen {
        position: absolute;
    }
    #game-container {
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    #ui-layer, #editor-ui, #game-controls, #story-map, #code-modal, #import-modal, #win-screen { inset: 0; }
    #ui-layer {
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 18px;
    }
    .glass {
        background: linear-gradient(180deg, rgba(16, 33, 70, 0.92), rgba(8, 17, 36, 0.92));
        backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
        color: var(--text-main);
    }
    .btn {
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        font-family: 'Audiowide', 'Exo 2', sans-serif;
        letter-spacing: 0.04em;
        border: none;
        cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.95); }
    .hidden { display: none !important; }
    h1, h2 { font-family: 'Audiowide', 'Exo 2', sans-serif; letter-spacing: 0.06em; margin: 0; }
    p { margin: 0; }
    textarea, button { font: inherit; }
    #menu-screen {
        width: min(92vw, 420px);
        padding: 28px 24px;
        border-radius: 28px;
        text-align: center;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
        overflow: hidden;
    }
    #menu-screen::before {
        content: "📦";
        position: absolute;
        top: 14px;
        right: 18px;
        font-size: 2rem;
        opacity: 0.85;
        filter: drop-shadow(0 0 10px rgba(100, 232, 255, 0.35));
    }
    #menu-screen h1 {
        font-size: clamp(1.9rem, 7vw, 3rem);
        color: #f6fbff;
        text-shadow: 0 0 18px rgba(100, 232, 255, 0.28);
    }
    #menu-screen p {
        color: var(--text-muted);
        font-size: 0.92rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    #btn-story, #btn-create, #btn-online, #code-close, #import-cancel, #import-go, #win-back, #map-back, #ed-code, #ed-play, #ed-exit, #game-exit {
        min-height: 44px;
        border-radius: 999px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.22);
    }
    #btn-story, #btn-create, #btn-online, #win-back {
        color: #06111f;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 18px;
    }
    #btn-story { background: linear-gradient(135deg, #7ee1ff, #3cbcff); }
    #btn-create { background: linear-gradient(135deg, #82ffcc, #37d98e); }
    #btn-online { background: linear-gradient(135deg, #b9a8ff, #7c78ff); color: #f7fbff; }
    #editor-ui { width: 100%; height: 100%; pointer-events: none; }
    #editor-ui > div:first-child {
        top: 0;
        left: 0;
        width: 100%;
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        pointer-events: auto;
        background: linear-gradient(180deg, rgba(6,11,23,0.92), rgba(6,11,23,0.42));
    }
    #editor-ui > div:first-child > div { display: flex; gap: 8px; }
    #ed-exit, #game-exit {
        width: 42px;
        height: 42px;
        background: rgba(10, 22, 50, 0.86);
        color: var(--text-main);
        border: 1px solid rgba(255,255,255,0.18);
    }
    #ed-code, #ed-play, #map-back, #import-cancel, #import-go, #code-close {
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 700;
    }
    #ed-code { background: linear-gradient(135deg, #877bff, #5f8bff); color: white; }
    #ed-play, #import-go { background: linear-gradient(135deg, #7ee1ff, #31b8ff); color: #04101d; }
    #import-cancel, #code-close, #map-back { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid rgba(255,255,255,0.14); }
    #editor-ui > div:last-child {
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        padding: 14px 12px max(14px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(10,22,50,0.72), rgba(5,12,26,0.96));
        border-top-left-radius: 26px;
        border-top-right-radius: 26px;
        display: flex;
        justify-content: center;
        gap: 10px;
        pointer-events: auto;
        box-shadow: 0 -12px 28px rgba(0,0,0,0.32);
    }
    .palette-item {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.14);
        background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.45rem;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 18px rgba(0,0,0,0.24);
    }
    .palette-item:hover { transform: translateY(-2px); }
    #game-controls { pointer-events: none; }
    #game-controls > div { pointer-events: auto; }
    #game-controls > div:first-child { top: max(14px, env(safe-area-inset-top)); left: 14px; }
    #game-controls > div:nth-child(2) {
        left: 18px;
        bottom: max(22px, env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
    }
    #game-controls > div:nth-child(3) {
        right: 18px;
        bottom: max(18px, env(safe-area-inset-bottom));
    }
    #btn-left, #btn-right, #btn-jump {
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        color: #f7fbff;
        text-shadow: 0 0 10px rgba(100, 232, 255, 0.25);
    }
    #btn-left, #btn-right {
        width: 64px;
        height: 64px;
        background: rgba(8, 22, 44, 0.52);
        backdrop-filter: blur(10px);
        font-size: 1.7rem;
    }
    #btn-jump {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle at 30% 30%, #86eeff, #2fa9ff 68%, #1278db);
        box-shadow: 0 14px 30px rgba(24, 115, 255, 0.3);
        font-size: 2rem;
    }
    #code-modal, #import-modal {
        background: rgba(2, 6, 14, 0.68);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 50;
        padding: 16px;
    }
    #code-modal > div, #import-modal > div {
        width: min(92vw, 420px);
        max-height: 90vh;
        padding: 22px;
        border-radius: 22px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    #code-output, #import-input {
        width: 100%;
        min-height: 128px;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid rgba(126, 225, 255, 0.24);
        background: rgba(244, 250, 255, 0.92);
        color: #10203d;
        font-family: 'Exo 2', system-ui, sans-serif;
        font-size: 0.9rem;
        resize: vertical;
    }
    #import-modal .flex, #code-modal .flex {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    #win-screen {
        background:
            radial-gradient(circle at top, rgba(94, 240, 163, 0.2), transparent 35%),
            linear-gradient(180deg, rgba(8, 26, 33, 0.94), rgba(8, 35, 25, 0.96));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 50;
        color: white;
        padding: 18px;
        text-align: center;
    }
    #win-screen h1 {
        font-size: clamp(2.2rem, 11vw, 4rem);
        color: #d4ffe7;
        margin-bottom: 10px;
    }
    #win-screen p { color: #c8ffdd; font-size: 1rem; margin-bottom: 20px; }
    #win-back { background: linear-gradient(135deg, #d8fff0, #8cf0c8); font-size: 1rem; }
    #story-map {
        background:
            linear-gradient(180deg, rgba(6,11,23,0.96), rgba(9,20,42,0.98));
        color: var(--text-main);
        pointer-events: auto;
        overflow-y: auto;
    }
    #story-map > div {
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
        max-width: 420px;
        margin: 0 auto;
    }
    #story-map .flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }
    #story-map h2 { font-size: clamp(1.6rem, 7vw, 2.2rem); }
    #level-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .route-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 15px 16px;
        border-radius: 18px;
        border: 1px solid rgba(126, 225, 255, 0.18);
        background: linear-gradient(180deg, rgba(15, 32, 67, 0.96), rgba(8, 19, 40, 0.96));
        box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        transition: transform 0.14s ease, filter 0.14s ease;
        cursor: pointer;
    }
    .route-card:active { transform: scale(0.98); }
    .route-card .route-name {
        color: #dff7ff;
        font-size: 1rem;
        font-weight: 700;
    }
    .route-card .route-icon {
        font-size: 1.35rem;
        color: var(--gold);
    }
    .feedback-gif {
        position: fixed;
        z-index: 55;
        right: 14px;
        top: max(14px, env(safe-area-inset-top));
        width: min(24vw, 94px);
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 14px 24px rgba(0,0,0,0.28);
        object-fit: cover;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-10px) scale(0.9);
        transition: opacity 0.25s ease, transform 0.25s ease;
        background: rgba(6, 11, 23, 0.66);
    }
    .feedback-gif.visible {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    #fail-gif {
        top: auto;
        right: auto;
        left: 14px;
        bottom: max(110px, calc(env(safe-area-inset-bottom) + 94px));
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(133, 182, 255, 0.55); border-radius: 3px; }
    @media (max-width: 640px) {
        #menu-screen { padding: 24px 18px; }
        #btn-story, #btn-create, #btn-online { font-size: 0.96rem; }
        #editor-ui > div:last-child {
            gap: 8px;
            padding-left: 8px;
            padding-right: 8px;
            justify-content: space-between;
        }
        .palette-item {
            width: 52px;
            height: 52px;
            font-size: 1.25rem;
        }
        #btn-left, #btn-right { width: 60px; height: 60px; }
        #btn-jump { width: 76px; height: 76px; }
        .feedback-gif {
            width: min(26vw, 82px);
            border-radius: 16px;
        }
        #fail-gif {
            bottom: max(100px, calc(env(safe-area-inset-bottom) + 88px));
        }
    }
</style>

<!-- Canvas Layer -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <img id="win-gif" class="feedback-gif" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp" alt="Celebration sticker">

    <!-- UI Layer -->

            <h1>DreamBlock Courier</h1>

            <button id="btn-story" class="btn">Delivery Route</button>

                <button id="ed-exit" class="btn">←</button>

        <!-- Game Controls (Mobile) -->
        <div id="game-controls" class="hidden">
            <div>
                <button id="game-exit" class="btn">✕</button>

                <h2>Route Code</h2>

        <!-- Import Modal -->
        <div id="import-modal" class="hidden">
            <div class="glass">
                <h2>Enter Route Code</h2>
                <textarea id="import-input" placeholder="Paste route code here..."></textarea>
                <div class="flex">
                    <button id="import-cancel" class="btn">Cancel</button>
                    <button id="import-go" class="btn">Play!</button>
                </div>
            </div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="hidden">
            <h1>DELIVERED!</h1>
            <p>Parcel route complete</p>
            <button id="win-back" class="btn">Next Stop</button>
        </div>

        <!-- Story Map -->
        <div id="story-map" class="hidden">
            <div>
                <div class="flex">
                    <h2>Delivery Map</h2>
                    <button id="map-back" class="btn">Menu</button>
                </div>
                <div id="level-list">
                    <!-- Levels injected via JS -->
                </div>
            </div>
        </div>

    </div>
</div>

/**
 * § Audio System
 */
function ensureAudioContext() {
    if (!audioCtx) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        audioCtx = new AudioCtor();
    }
    return audioCtx;
}

function configureAudio() {
    sounds.bgm.volume = 0.24;
    sounds.win.volume = 0.72;
    sounds.die.volume = 0.62;
    sounds.jump.volume = 0.42;
    sounds.place.volume = 0.34;
    sounds.menu.volume = 0.4;
}

function unlockAudio() {
    if (audioUnlocked) return;
    const ctxRef = ensureAudioContext();
    const startPlayback = () => {
        audioUnlocked = true;
        startBgm();
    };
    if (ctxRef && ctxRef.state === 'suspended') {
        ctxRef.resume().then(startPlayback).catch(() => {
            audioUnlocked = true;
            startBgm();
        });
    } else {
        startPlayback();
    }
}

function startBgm() {
    if (!audioUnlocked) return;
    sounds.bgm.currentTime = 0;
    sounds.bgm.play().catch(() => {});
}

function stopBgm() {
    sounds.bgm.pause();
    sounds.bgm.currentTime = 0;
}

function playMediaSound(audioEl, restart = true) {
    if (!audioUnlocked || !audioEl) return;
    try {
        if (restart) audioEl.currentTime = 0;
        audioEl.play().catch(() => {});
    } catch (_) {}
}

function playUiSound() {
    const now = performance.now();
    if (now < uiSoundCooldownUntil) return;
    uiSoundCooldownUntil = now + 90;
    playMediaSound(sounds.menu);
}

function playSound(type) {
    if (!audioUnlocked) return;
    const now = performance.now();
    if (type === 'jump') {
        if (now < jumpSoundCooldownUntil) return;
        jumpSoundCooldownUntil = now + 140;
        playMediaSound(sounds.jump);
    } else if (type === 'place') {
        if (now < placeSoundCooldownUntil) return;
        placeSoundCooldownUntil = now + 70;
        playMediaSound(sounds.place);
    } else if (type === 'win') {
        playMediaSound(sounds.win);
    } else if (type === 'die') {
        playMediaSound(sounds.die);
    }
}

function showFeedbackGif(type) {
    const el = feedbackGifs[type];
    if (!el) return;
    if (gifTimers[type]) clearTimeout(gifTimers[type]);
    el.classList.add('visible');
    gifTimers[type] = setTimeout(() => {
        el.classList.remove('visible');
    }, type === 'win' ? 2200 : 1500);
}

/**
 * § Init & Resize
 */
function init() {
    configureAudio();
    resize();
    window.addEventListener('resize', resize);
    
    // Listeners
    setupInput();
    
    // Start Loop
    requestAnimationFrame(gameLoop);
    
    // Parse Config
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const parsed = JSON.parse(configEl.textContent);
            for(let k in parsed) window.gameConfig[k] = parsed[k].value;
        } catch(e) {}
    }

    // Render Story Levels
    renderStoryList();
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function renderStoryList() {
    const list = document.getElementById('level-list');
    list.innerHTML = '';
    STORY_LEVELS.forEach((lvl, idx) => {
        const div = document.createElement('div');
        div.className = "route-card";
        div.innerHTML = `<span class="route-name">${lvl.name}</span> <span class="route-icon">✦</span>`;
        div.onclick = () => loadLevel(lvl.data);
        list.appendChild(div);
    });
}

/**
 * § Input Handling
 */
function setupInput() {
    // Global Touch
    document.addEventListener('pointerdown', (e) => {
        unlockAudio();
        handlePointer(e, 'down');
    }, { passive: false });
    
    document.addEventListener('pointermove', (e) => {
        handlePointer(e, 'move');
    }, { passive: false });
    
    document.addEventListener('pointerup', (e) => {
        handlePointer(e, 'up');
    }, { passive: false });

    // UI Bindings
    document.getElementById('btn-create').onclick = () => {
        playUiSound();
        switchState('EDITOR');
    };
    document.getElementById('btn-story').onclick = () => {
        playUiSound();
        switchState('MAP');
    };
    document.getElementById('btn-online').onclick = () => {
        playUiSound();
        document.getElementById('import-modal').classList.remove('hidden');
        document.getElementById('import-input').value = '';
    };
    
    document.getElementById('ed-exit').onclick = () => {
        playUiSound();
        switchState('MENU');
    };
    document.getElementById('ed-play').onclick = () => {
        playUiSound();
        testLevel();
    };
    document.getElementById('ed-code').onclick = () => {
        playUiSound();
        exportLevel();
    };
    
    document.getElementById('game-exit').onclick = () => {
        playUiSound();
        if (appState === 'GAME_TEST') switchState('EDITOR');
        else switchState('MENU');
    };
    
    document.getElementById('code-close').onclick = () => {
        playUiSound();
        document.getElementById('code-modal').classList.add('hidden');
    };
    
    document.getElementById('import-cancel').onclick = () => {
        playUiSound();
        document.getElementById('import-modal').classList.add('hidden');
    };
    document.getElementById('import-go').onclick = () => {
        playUiSound();
        const code = document.getElementById('import-input').value;
        if(code) {
            loadLevel(code);
            document.getElementById('import-modal').classList.add('hidden');
        }
    };
    
    document.getElementById('map-back').onclick = () => {
        playUiSound();
        switchState('MENU');
    };
    document.getElementById('win-back').onclick = () => {
        playUiSound();
        document.getElementById('win-screen').classList.add('hidden');
        if (appState === 'GAME_TEST') switchState('EDITOR');
        else switchState('MAP');
    };

    // Palette
    document.querySelectorAll('.palette-item').forEach(el => {
        el.onclick = () => {
            playUiSound();
            document.querySelectorAll('.palette-item').forEach(i => i.style.borderColor = '#e2e8f0');
            el.style.borderColor = '#38bdf8';
            selectedTile = parseInt(el.dataset.type);
        };
    });

    // Game Controls
    const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); input[key] = false; });
        btn.addEventListener('pointerleave', (e) => { e.preventDefault(); input[key] = false; });
    };
    bindBtn('btn-left', 'left');
    bindBtn('btn-right', 'right');
    bindBtn('btn-jump', 'jump');
}

function handlePointer(e, type) {
    if (appState !== 'EDITOR') return;
    // Editor Logic
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Convert to logical coords
    const scale = Math.min(canvas.width / VIEW_W, canvas.height / VIEW_H); // Approx scale
    // Actually, we render with ctx.scale later, but for input we need to map screen -> world
    // Simple approach: The editor camera logic needs to be robust.
    
    // Let's rely on visual center.
    // Editor Camera is just offset.
    // WorldX = (ScreenX / Scale) + CamX
    
    // Simplified: Just use raw screen coords relative to center for now? No, full scrolling.
    
    // Editor Interactions
    if (type === 'down') {
        if (y < 60 || y > window.innerHeight - 100) return; // Ignore UI areas
        isDragging = true;
        lastDragPos = { x, y };
        placeTileAt(x, y);
    } else if (type === 'move') {
        if (isDragging) {
            // If dragging far, pan camera? Or paint?
            // Let's do Paint for now. Panning requires two fingers or a mode switch.
            // For simplicity: One finger paints.
            placeTileAt(x, y);
        }
    } else if (type === 'up') {
        isDragging = false;
    }
}

function placeTileAt(sx, sy) {
    // Map screen to world
    const scaleX = canvas.width / window.innerWidth; // DPR
    // We render based on VIEW_H fitting height usually
    const renderScale = window.innerHeight / VIEW_H;
    
    const wx = (sx / renderScale) + editorCam.x;
    const wy = (sy / renderScale) + editorCam.y;
    
    const tx = Math.floor(wx / TILE_SIZE);
    const ty = Math.floor(wy / TILE_SIZE);
    
    const key = `${tx},${ty}`;
    
    if (selectedTile === 0) {
        if (editorLevel[key]) {
            delete editorLevel[key];
            playSound('place');
        }
    } else {
        if (editorLevel[key] !== selectedTile) {
            editorLevel[key] = selectedTile;
            playSound('place');
            // Particle
            for(let i=0; i<5; i++) {
                particles.push({
                    x: tx * TILE_SIZE + TILE_SIZE/2,
                    y: ty * TILE_SIZE + TILE_SIZE/2,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10,
                    life: 1,
                    color: getColor(selectedTile)
                });
            }
        }
    }
}

/**
 * § Game Logic
 */
function switchState(newState) {
    const previousState = appState;
    appState = newState;
    
    // UI Toggles
    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('editor-ui').classList.add('hidden');
    document.getElementById('game-controls').classList.add('hidden');
    document.getElementById('story-map').classList.add('hidden');
    document.getElementById('win-screen').classList.add('hidden');
    
    if (newState === 'MENU') {
        document.getElementById('menu-screen').classList.remove('hidden');
    } else if (newState === 'EDITOR') {
        document.getElementById('editor-ui').classList.remove('hidden');
        // Reset Editor Cam
        editorCam = { x: -VIEW_W/2, y: -VIEW_H/2 }; 
    } else if (newState === 'GAME' || newState === 'GAME_TEST') {
        document.getElementById('game-controls').classList.remove('hidden');
        resetPlayer();
    } else if (newState === 'MAP') {
        document.getElementById('story-map').classList.remove('hidden');
    }

    if (newState === 'MENU' || newState === 'MAP') {
        stopBgm();
        if (audioUnlocked && previousState !== newState) startBgm();
    }
}

function resetPlayer() {
    // Find start pos
    let startX = 100, startY = 100;
    for (let key in currentLevelData) {
        if (currentLevelData[key] === 4) {
            const [tx, ty] = key.split(',').map(Number);
            startX = tx * TILE_SIZE;
            startY = ty * TILE_SIZE;
            break;
        }
    }
    player = { 
        x: startX, y: startY, 
        vx: 0, vy: 0, 
        w: 24, h: 24, 
        grounded: false, dead: false, win: false 
    };
    camera.x = startX - VIEW_W/2;
    camera.y = startY - VIEW_H/2;
}

function testLevel() {
    currentLevelData = JSON.parse(JSON.stringify(editorLevel));
    // Validate start
    let hasStart = false;
    for(let k in currentLevelData) if(currentLevelData[k] === 4) hasStart = true;
    if(!hasStart) {
        alert("Place a Dispatch Point (🙂) first!");
        return;
    }
    switchState('GAME_TEST');
}

function loadLevel(b64) {
    try {
        const json = atob(b64);
        currentLevelData = JSON.parse(json);
        switchState('GAME');
    } catch(e) {
        alert("Invalid Route Code");
    }
}

function exportLevel() {
    const str = JSON.stringify(editorLevel);
    const b64 = btoa(str);
    document.getElementById('code-output').value = b64;
    document.getElementById('code-modal').classList.remove('hidden');
}

function updatePhysics() {
    if (player.dead || player.win) return;
    
    // Horizontal
    if (input.left) player.vx -= 1;
    if (input.right) player.vx += 1;
    player.vx *= 0.85; // Friction
    
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
    if (player.vx > window.gameConfig.playerSpeed) player.vx = window.gameConfig.playerSpeed;
    if (player.vx < -window.gameConfig.playerSpeed) player.vx = -window.gameConfig.playerSpeed;
    
    player.x += player.vx;
    checkCollision('x');
    
    // Vertical
    player.vy += window.gameConfig.gravity;
    player.y += player.vy;
    player.grounded = false;
    checkCollision('y');
    
    // Jump
    if (input.jump && player.grounded) {
        player.vy = -window.gameConfig.jumpForce;
        player.grounded = false;
        playSound('jump');
        // Dust
        for(let i=0; i<5; i++) particles.push({x: player.x+12, y: player.y+24, vx: (Math.random()-0.5)*5, vy: Math.random()*2, life: 0.5, color: '#fff'});
    }
    
    // Death Plane
    if (player.y > 2000) die();
    
    // Camera Follow
    const targetX = player.x - VIEW_W/2 + player.w/2;
    const targetY = player.y - VIEW_H/2 + player.w/2;
    camera.x += (targetX - camera.x) * 0.1;
    camera.y += (targetY - camera.y) * 0.1;
}

function checkCollision(axis) {
    // Simple AABB vs Grid
    const startX = Math.floor(player.x / TILE_SIZE);
    const endX = Math.floor((player.x + player.w) / TILE_SIZE);
    const startY = Math.floor(player.y / TILE_SIZE);
    const endY = Math.floor((player.y + player.h) / TILE_SIZE);
    
    for (let y = startY; y <= endY; y++) {
        for (let x = startX; x <= endX; x++) {
            const key = `${x},${y}`;
            const tile = currentLevelData[key];
            if (tile) {
                if (tile === 1) { // Wall
                    if (axis === 'x') {
                        if (player.vx > 0) player.x = x * TILE_SIZE - player.w - 0.1;
                        else if (player.vx < 0) player.x = x * TILE_SIZE + TILE_SIZE + 0.1;
                        player.vx = 0;
                    } else {
                        if (player.vy > 0) { // Landing
                            player.y = y * TILE_SIZE - player.h - 0.1;
                            player.grounded = true;
                            player.vy = 0;
                        } else if (player.vy < 0) { // Ceiling
                            player.y = y * TILE_SIZE + TILE_SIZE + 0.1;
                            player.vy = 0;
                        }
                    }
                } else if (tile === 2) { // Spike
                    // Precise hit box for spike (smaller)
                    const sx = x * TILE_SIZE + 10;
                    const sy = y * TILE_SIZE + 10;
                    const sw = 20;
                    const sh = 20;
                    if (rectIntersect(player.x, player.y, player.w, player.h, sx, sy, sw, sh)) {
                        die();
                    }
                } else if (tile === 3) { // Goal
                    win();
                }
            }
        }
    }
}

function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
}

function die() {
    if (player.dead) return;
    player.dead = true;
    playSound('die');
    showFeedbackGif('fail');
    // Explosion
    for(let i=0; i<20; i++) {
        particles.push({
            x: player.x + player.w/2,
            y: player.y + player.h/2,
            vx: (Math.random()-0.5)*15,
            vy: (Math.random()-0.5)*15,
            life: 1.5,
            color: '#FACC15'
        });
    }
    setTimeout(() => {
        if (appState === 'GAME_TEST' || appState === 'GAME') resetPlayer();
    }, 1000);
}

function win() {
    if (player.win) return;
    player.win = true;
    playSound('win');
    showFeedbackGif('win');
    document.getElementById('win-screen').classList.remove('hidden');
}

/**
 * § Rendering
 */
function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    // Logic
    if (appState === 'GAME' || appState === 'GAME_TEST') {
        updatePhysics();
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw
    const scale = window.innerHeight / VIEW_H;
    const viewW = window.innerWidth / scale;
    
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#101b3c');
    skyGradient.addColorStop(0.55, '#132a59');
    skyGradient.addColorStop(1, '#060b17');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.scale(scale, scale);
    
    // Grid Background
    ctx.strokeStyle = 'rgba(111, 213, 255, 0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const camX = (appState === 'EDITOR') ? editorCam.x : camera.x;
    const camY = (appState === 'EDITOR') ? editorCam.y : camera.y;
    
    const offsetX = -camX % TILE_SIZE;
    const offsetY = -camY % TILE_SIZE;
    
    for (let x = offsetX; x < viewW; x += TILE_SIZE) {
        ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H);
    }
    for (let y = offsetY; y < VIEW_H; y += TILE_SIZE) {
        ctx.moveTo(0, y); ctx.lineTo(viewW, y);
    }
    ctx.stroke();

    // World Transform
    ctx.translate(-camX, -camY);

    // Draw Level
    const levelToDraw = (appState === 'EDITOR') ? editorLevel : currentLevelData;
    
    // Optimization: Only draw visible tiles
    // For this simple game, we can iterate all keys (small levels) or calculate range.
    // Iterating keys is fine for < 1000 blocks.
    
    for (let key in levelToDraw) {
        const [tx, ty] = key.split(',').map(Number);
        const type = levelToDraw[key];
        const px = tx * TILE_SIZE;
        const py = ty * TILE_SIZE;
        
        drawTile(px, py, type);
    }

    // Draw Player
    if (appState === 'GAME' || appState === 'GAME_TEST') {
        if (!player.dead) {
            const bob = Math.sin(timestamp * 0.012) * 1.5;
            const courierX = player.x;
            const courierY = player.y + bob;
            const courierGlow = ctx.createRadialGradient(courierX + player.w / 2, courierY + player.h / 2, 4, courierX + player.w / 2, courierY + player.h / 2, 28);
            courierGlow.addColorStop(0, 'rgba(255, 235, 120, 0.42)');
            courierGlow.addColorStop(1, 'rgba(255, 235, 120, 0)');
            ctx.fillStyle = courierGlow;
            ctx.beginPath();
            ctx.arc(courierX + player.w / 2, courierY + player.h / 2, 28, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd95a';
            roundRect(ctx, courierX, courierY, player.w, player.h, 8, true, false);

            ctx.fillStyle = '#ff9ac8';
            roundRect(ctx, courierX + 4, courierY - 6, player.w - 8, 10, 5, true, false);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(courierX + 9, courierY + 10, 3, 0, Math.PI * 2);
            ctx.arc(courierX + 17, courierY + 10, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#18243d';
            const eyeOffset = player.vx >= 0 ? 0.5 : -2.5;
            ctx.beginPath();
            ctx.arc(courierX + 9 + eyeOffset, courierY + 10, 1.4, 0, Math.PI * 2);
            ctx.arc(courierX + 17 + eyeOffset, courierY + 10, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#18243d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(courierX + 13, courierY + 15, 4.5, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.fillStyle = '#7ee1ff';
            roundRect(ctx, courierX + player.w - 8, courierY + 8, 8, 10, 3, true, false);

            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.fillRect(courierX + 6, courierY + 5, 10, 3);
        }
    }

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

function drawTile(x, y, type) {
    if (type === 1) { // Wall
        const blockGradient = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        blockGradient.addColorStop(0, '#7ee1ff');
        blockGradient.addColorStop(1, '#2b75ff');
        ctx.fillStyle = blockGradient;
        ctx.shadowColor = 'rgba(41, 214, 255, 0.45)';
        ctx.shadowBlur = 12;
        roundRect(ctx, x, y, TILE_SIZE, TILE_SIZE, 10, true, false);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.26)';
        roundRect(ctx, x + 5, y + 5, TILE_SIZE - 10, 9, 4, true, false);
        ctx.fillStyle = 'rgba(7, 21, 54, 0.32)';
        ctx.fillRect(x + 7, y + 22, TILE_SIZE - 14, 10);
    } else if (type === 2) { // Spike
        ctx.fillStyle = '#ff6b79';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE/2, y + 5);
        ctx.lineTo(x + TILE_SIZE - 5, y + TILE_SIZE - 4);
        ctx.lineTo(x + 5, y + TILE_SIZE - 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE/2, y + 10);
        ctx.lineTo(x + TILE_SIZE - 12, y + TILE_SIZE - 8);
        ctx.lineTo(x + 12, y + TILE_SIZE - 8);
        ctx.closePath();
        ctx.fill();
    } else if (type === 3) { // Goal
        const time = Date.now() * 0.005;
        const floatY = Math.sin(time) * 5;
        const coreX = x + TILE_SIZE/2;
        const coreY = y + TILE_SIZE/2 + floatY;
        const glow = ctx.createRadialGradient(coreX, coreY, 3, coreX, coreY, 18);
        glow.addColorStop(0, 'rgba(255, 235, 120, 0.95)');
        glow.addColorStop(1, 'rgba(255, 235, 120, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(coreX, coreY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8b7bff';
        ctx.beginPath();
        drawStar(ctx, coreX, coreY, 5, 12, 6);
        ctx.fill();
        ctx.fillStyle = '#fff4b5';
        ctx.beginPath();
        drawStar(ctx, coreX, coreY, 5, 6, 3);
        ctx.fill();
    } else if (type === 4) { // Start
        ctx.fillStyle = 'rgba(126, 225, 255, 0.2)';
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, 14, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#7ee1ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, 11, 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = '#dff7ff';
        ctx.font = "700 10px Audiowide";
        ctx.fillText("DROP", x + 2, y - 4);
    }
}

function getColor(type) {
    if (type === 1) return '#4ADE80';
    if (type === 2) return '#F87171';
    if (type === 3) return '#A78BFA';
    return '#fff';
}

function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

// Init
window.addEventListener('DOMContentLoaded', init);

</script>
