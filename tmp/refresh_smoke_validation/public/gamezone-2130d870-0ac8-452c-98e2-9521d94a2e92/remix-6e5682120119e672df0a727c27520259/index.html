<style>
:root {
  --bg-top: #12091f;
  --bg-mid: #1d1235;
  --bg-bottom: #04030a;
  --panel-ink: #130b24;
  --panel-surface: rgba(26, 14, 44, 0.82);
  --panel-border: rgba(122, 240, 255, 0.82);
  --hud-glow: rgba(80, 225, 255, 0.25);
  --hero-core: #7cf7ff;
  --hero-accent: #a78bfa;
  --clue-gold: #ffd86b;
  --hazard-hot: #ff6b8f;
  --text-main: #f8f7ff;
  --text-muted: #d7d2ef;
}
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background:
    radial-gradient(circle at top, rgba(122, 240, 255, 0.14), transparent 30%),
    linear-gradient(180deg, var(--bg-top), var(--bg-mid) 58%, var(--bg-bottom));
  font-family: 'Exo 2', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-main);
}
#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 50% 15%, rgba(123, 97, 255, 0.18), transparent 28%),
    radial-gradient(circle at 15% 20%, rgba(71, 240, 255, 0.14), transparent 24%);
}
#game-container::before,
#game-container::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#game-container::before {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
    radial-gradient(circle at 70% 22%, rgba(123, 240, 255, 0.18) 0 1px, transparent 2px),
    radial-gradient(circle at 80% 58%, rgba(255,255,255,0.1) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 35% 72%, rgba(169, 139, 250, 0.14) 0 1px, transparent 2px);
  background-size: 180px 180px, 220px 220px, 260px 260px, 200px 200px;
  opacity: 0.9;
}
#game-container::after {
  background: linear-gradient(180deg, rgba(4, 3, 10, 0) 58%, rgba(5, 3, 12, 0.5) 100%);
}
canvas {
  display: block;
  touch-action: none;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 50% 10%, rgba(105, 89, 255, 0.2) 0, rgba(10, 9, 22, 0) 38%),
    linear-gradient(180deg, #1a1032 0, #0a1023 42%, #04030b 100%);
}
#ui-layer { pointer-events: none; }
#hud, #game-over-screen, #game-over-screen * { pointer-events: auto; }
.badge {
  border-radius: 9999px;
  border: 1px solid rgba(123, 240, 255, 0.7);
  background:
    linear-gradient(180deg, rgba(20, 13, 38, 0.94), rgba(9, 8, 22, 0.92));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 0 18px var(--hud-glow);
  backdrop-filter: blur(8px);
}
.memphis-chip {
  border-radius: 9999px;
  border: 1px solid rgba(255, 216, 107, 0.42);
  background: linear-gradient(135deg, rgba(255, 216, 107, 0.92), rgba(255, 130, 205, 0.88));
  box-shadow: 0 6px 18px rgba(255, 114, 182, 0.22);
}
.memphis-panel {
  border-radius: 24px;
  border: 2px solid rgba(122, 240, 255, 0.8);
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,0.12) 0, transparent 48%),
    radial-gradient(circle at 80% 120%, rgba(255, 130, 205, 0.16) 0, transparent 60%),
    linear-gradient(180deg, rgba(32, 18, 57, 0.96), rgba(12, 9, 26, 0.96));
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 16px 36px rgba(4, 4, 12, 0.66),
    0 0 28px rgba(123, 240, 255, 0.2);
  backdrop-filter: blur(10px);
}
.memphis-button {
  border-radius: 9999px;
  border: 1px solid rgba(123, 240, 255, 0.6);
  background: linear-gradient(135deg, #73f3ff, #a78bfa 55%, #ff72b6);
  color: #130b24;
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  box-shadow:
    0 6px 0 rgba(86, 61, 161, 0.95),
    0 14px 24px rgba(7, 7, 16, 0.55);
  transform: translateY(0);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.12s ease-out;
}
.memphis-button:active {
  transform: translateY(4px);
  box-shadow:
    0 2px 0 rgba(86, 61, 161, 0.95),
    0 7px 12px rgba(7, 7, 16, 0.45);
}
.memphis-button:hover {
  filter: brightness(1.05);
}
.symbol-pulse {
  animation: symbolPulse 0.35s ease-out;
}
@keyframes symbolPulse {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); opacity: 0.2; }
}
.shake {
  animation: shakeAnim 0.35s cubic-bezier(.36,.07,.19,.97);
}
@keyframes shakeAnim {
  10%, 90% { transform: translate3d(-2px, 0, 0); }
  20%, 80% { transform: translate3d(4px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
  40%, 60% { transform: translate3d(8px, 0, 0); }
}
.flash-red {
  animation: flashRed 0.25s ease-out;
}
@keyframes flashRed {
  0% { background-color: rgba(248,113,113,0.0); }
  30% { background-color: rgba(248,113,113,0.22); }
  100% { background-color: rgba(248,113,113,0); }

.feedback-gif {
  width: min(46vw, 160px);
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 20px;
  border: 2px solid rgba(122, 240, 255, 0.55);

  background: rgba(13, 10, 24, 0.7);
}
.feedback-gif-frame {

}
.hud-title,
.panel-title {
  font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif;
  letter-spacing: 0.08em;
}
body, button, #hud, #game-over-screen, #timer-text, #clue-count {
  font-family: 'Exo 2', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
</style>

<script>
(function() {
  'use strict';

  // ---------- Config System ----------
  window.gameConfigDefs = {};
  window.gameConfig = {};
  function parseConfig() {
    const el = document.getElementById('game-config');
    if (!el) return;
    try {
      const defs = JSON.parse(el.textContent.trim());
      window.gameConfigDefs = defs;
      const cfg = {};
      Object.keys(defs).forEach(key => {
        const def = defs[key];
        if (def.type === 'number') {
          cfg[key] = Number(def.value) || 0;
        } else if (def.type === 'color') {
          const val = String(def.value || '').trim();
          if (/^#[0-9a-fA-F]{6}$/.test(val)) {
            cfg[key] = val;
          }
        } else {
          cfg[key] = def.value;
        }
      });
      window.gameConfig = cfg;
    } catch (e) {
      console.error('Config parse failed', e);
      window.gameConfig = { heroSpeed: 5, themeColor: '#22c55e' };
    }
  }
  window.updateGameConfig = function(key, val) {
    if (!(key in window.gameConfigDefs)) return;
    const def = window.gameConfigDefs[key];
    if (def.type === 'number') {
      const num = Number(val);
      if (Number.isFinite(num)) {
        window.gameConfig[key] = num;
      }
    } else if (def.type === 'color') {
      if (/^#[0-9a-fA-F]{6}$/.test(String(val))) {
        window.gameConfig[key] = val;
        rebuildTheme();
      }
    } else {
      window.gameConfig[key] = val;
    }
  };

  function rebuildTheme() {
    const color = window.gameConfig.themeColor || '#22c55e';
    document.documentElement.style.setProperty('--theme-color', color);
  }

  // ---------- Audio Manager ----------
  const AudioManager = (function() {
    let audioCtx = null;
    let sfxBuffers = {};
    let unlocked = false;
    let bgm;
    let lastSfxAt = {};
    function init() {
      bgm = document.getElementById('bgm_main');
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
      if (audioCtx) {
        const sfxEls = [
          document.getElementById('sfx_tap'),
          document.getElementById('sfx_hit'),
          document.getElementById('sfx_ui'),
          document.getElementById('sfx_fail'),
          document.getElementById('sfx_win')
        ];
        sfxEls.forEach(el => {
          if (!el) return;
          const id = el.id;
          const url = el.getAttribute('src');
          if (!url) return;
          fetch(url).then(r => r.arrayBuffer()).then(buf => {
            if (!audioCtx) return;
            return audioCtx.decodeAudioData(buf);
          }).then(decoded => {
            if (decoded) {
              sfxBuffers[id] = decoded;
            }
          }).catch(() => {
            // fallback will synthesize
          });
        });
      }
    }
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(()=>{});
      }
      if (bgm) {
        bgm.volume = 0.2;
        bgm.play().catch(()=>{});
      }
    }
    function playBgm() {
      if (bgm) {
        bgm.volume = 0.2;
        bgm.play().catch(()=>{});
      }
    }
    function stopBgm() {
      if (bgm) {
        bgm.pause();
        bgm.currentTime = 0;
      }
    }
    function playSfx(id, options) {
      const now = performance.now();
      const minGap = options?.minGap ?? 90;
      if (lastSfxAt[id] && now - lastSfxAt[id] < minGap) return;
      lastSfxAt[id] = now;
      if (!audioCtx) {
        synthFallback(id);
        return;
      }
      const buffer = sfxBuffers[id];
      if (buffer) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = buffer;
        gain.gain.value = options?.volume ?? 0.34;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
      } else {
        synthFallback(id);
      }
    }
    function synthFallback(id) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const presets = {
        sfx_hit: { type: 'square', freq: 190, dur: 0.18, vol: 0.16 },
        sfx_fail: { type: 'sawtooth', freq: 150, dur: 0.28, vol: 0.12 },
        sfx_win: { type: 'triangle', freq: 740, dur: 0.32, vol: 0.12 },
        sfx_ui: { type: 'triangle', freq: 520, dur: 0.12, vol: 0.08 },
        sfx_tap: { type: 'triangle', freq: 660, dur: 0.15, vol: 0.1 }
      };
      const preset = presets[id] || presets.sfx_ui;
      osc.type = preset.type;
      osc.frequency.value = preset.freq;
      gain.gain.setValueAtTime(preset.vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + preset.dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + preset.dur);
    }
    return {
      init,
      unlock,
      playBgm,
      stopBgm,
      playSfx
    };
  })();

  // ---------- Vibration ----------
  function vibrate(style) {
    try {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style: style || 'light' }
      });
    } catch (e) { /* silent */ }
  }

  // ---------- Game State ----------
  let canvas, ctx;
  let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
  let initialized = false;
  let gameState = 'PLAYING'; // PLAYING | GAMEOVER

  const hero = {
    x: 0,
    y: 0,
    r: 18,
    targetX: 0,
    targetY: 0,
    color: '#22c55e'
  };

  const inputState = {
    dragging: false,
    lastX: 0,
    lastY: 0
  };

  let clues = [];
  let hazards = [];
  let particles = [];

  const LEVEL = {
    totalTime: 35,
    elapsed: 0,
    clueCollected: 0,
    gameOverReason: ''
  };

  const spawnTimers = {
    clue: 0,
    hazard: 0
  };

  // depth layers parallax
  const bgTreesFar = [];
  const bgTreesNear = [];

  // HUD elements
  let timerTextEl, clueCountEl, finalMessageEl, finalCluesEl, finalTimeEl, gameOverScreenEl, hudEl, victoryGifEl, defeatGifEl;

  function setState(next) {
    if (next === gameState) return;
    gameState = next;
    if (!hudEl || !gameOverScreenEl) return;
    if (next === 'PLAYING') {
      hudEl.classList.remove('hidden');
      gameOverScreenEl.classList.add('hidden');
    } else if (next === 'GAMEOVER') {
      hudEl.classList.add('hidden');
      gameOverScreenEl.classList.remove('hidden');
    }
  }

  // ---------- Init Game Objects ----------
  function initGame() {
    const themeColor = window.gameConfig.themeColor || '#22c55e';
    hero.r = 18;
    hero.x = cw * 0.5;
    hero.y = ch * 0.7;
    hero.targetX = hero.x;
    hero.targetY = hero.y;
    hero.color = themeColor;

    LEVEL.elapsed = 0;
    LEVEL.clueCollected = 0;
    LEVEL.gameOverReason = '';

    spawnTimers.clue = 0;
    spawnTimers.hazard = 0;

    clues = [];
    hazards = [];
    particles = [];

    buildTrees();

    if (clueCountEl) clueCountEl.textContent = '0';
    if (timerTextEl) timerTextEl.textContent = '0.0';

    setState('PLAYING');
    try {
      AudioManager.playBgm();
    } catch(e) {}
  }

  function buildTrees() {
    bgTreesFar.length = 0;
    bgTreesNear.length = 0;
    const cols = 10;
    for (let i = 0; i < cols; i++) {
      bgTreesFar.push({
        x: (i / (cols - 1)) * cw,
        h: ch * (0.35 + Math.random() * 0.1),
        w: 24 + Math.random() * 12,
        offset: Math.random()
      });
    }
    for (let i = 0; i < cols; i++) {
      bgTreesNear.push({
        x: (i / (cols - 1)) * cw + (Math.random() - 0.5) * 30,
        h: ch * (0.45 + Math.random() * 0.12),
        w: 30 + Math.random() * 18,
        offset: Math.random()
      });
    }
  }

  // ---------- Utility ----------
  function clamp(v, min, max) {
    return v < min ? min : (v > max ? max : v);
  }

  function safeHero() {
    hero.x = clamp(hero.x, hero.r, cw - hero.r);
    hero.y = clamp(hero.y, hero.r, ch - hero.r);
    if (!isFinite(hero.x) || !isFinite(hero.y)) {
      hero.x = cw * 0.5;
      hero.y = ch * 0.7;
      hero.targetX = hero.x;
      hero.targetY = hero.y;
    }
  }

  function spawnClue() {
    const margin = 30;
    clues.push({
      x: margin + Math.random() * (cw - margin * 2),
      y: margin + Math.random() * (ch * 0.65 - margin),
      r: 14 + Math.random() * 6,
      type: Math.random() < 0.33 ? 'triangle' : (Math.random() < 0.5 ? 'eye' : 'question'),
      pulse: 0
    });
  }

  function spawnHazard() {
    const margin = 20;
    const size = 16 + Math.random() * 12;
    hazards.push({
      x: margin + Math.random() * (cw - margin * 2),
      y: -size,
      r: size,
      vy: 60 + Math.random() * 50,
      wobblePhase: Math.random() * Math.PI * 2
    });
  }

  function addParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 60;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.4 + Math.random() * 0.2,
        age: 0,
        color
      });
    }
  }

  // ---------- Input ----------
  function handleGameInput(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
      inputState.dragging = true;
      inputState.lastX = x;
      inputState.lastY = y;

      // tap to collect if close to clue
      let collectedIdx = -1;
      for (let i = 0; i < clues.length; i++) {
        const c = clues[i];
        const dx = x - c.x;
        const dy = y - c.y;
        if (dx*dx + dy*dy <= (c.r + 12) * (c.r + 12)) {
          collectedIdx = i;
          break;
        }
      }
      if (collectedIdx >= 0) {
        const c = clues[collectedIdx];
        clues.splice(collectedIdx, 1);
        LEVEL.clueCollected++;
        if (clueCountEl) clueCountEl.textContent = String(LEVEL.clueCollected);
        c.pulse = 1;
        addParticles(c.x, c.y, '#facc15');
        AudioManager.playSfx('sfx_tap');
        vibrate('light');
      } else {
        // move hero target toward touch
        hero.targetX = clamp(x, hero.r, cw - hero.r);
        hero.targetY = clamp(y, hero.r, ch - hero.r);
      }
    } else if (e.type === 'pointermove') {
      if (inputState.dragging) {
        hero.targetX = clamp(x, hero.r, cw - hero.r);
        hero.targetY = clamp(y, hero.r, ch - hero.r);
        inputState.lastX = x;
        inputState.lastY = y;
      }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
      inputState.dragging = false;
    }
  }

  function restartGame() {
    AudioManager.playSfx('sfx_ui', { volume: 0.22, minGap: 120 });
    initGame();
  }

  function unlockAudioFromGesture() {
    AudioManager.unlock();
  }

  function handleGlobalInput(e) {
    if (gameState !== 'PLAYING') {
      return;
    }
    try {
      e.preventDefault();
    } catch(_) {}
    handleGameInput(e);
  }

  // ---------- Resize ----------
  function handleResize(entries) {
    for (const entry of entries) {
      if (entry.target !== canvas) continue;
      const cr = entry.contentRect;
      const width = cr.width;
      const height = cr.height;
      if (width <= 0 || height <= 0) return;
      dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      cw = width;
      ch = height;
      if (!ctx) {
        ctx = canvas.getContext('2d');
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!initialized) {
        initialized = true;
        initGame();
        requestAnimationFrame(gameLoop);
      } else {
        hero.x = clamp(hero.x, hero.r, cw - hero.r);
        hero.y = clamp(hero.y, hero.r, ch - hero.r);
        buildTrees();
      }
    }
  }

  // ---------- Game Loop ----------
  let lastTime = 0;

  function update(dt) {
    const dtClamped = Math.min(dt, 0.05);

    if (gameState !== 'PLAYING') {
      return;
    }

    LEVEL.elapsed += dtClamped;
    const remaining = clamp(LEVEL.totalTime - LEVEL.elapsed, 0, LEVEL.totalTime);
    if (timerTextEl) {
      timerTextEl.textContent = remaining.toFixed(1);
    }

    // hero movement
    const speed = clamp(window.gameConfig.heroSpeed || 5, 1, 12);
    const lerp = clamp(dtClamped * speed * 1.8, 0, 1);
    hero.x += (hero.targetX - hero.x) * lerp;
    hero.y += (hero.targetY - hero.y) * lerp;
    safeHero();

    // spawn logic
    spawnTimers.clue -= dtClamped;
    spawnTimers.hazard -= dtClamped;
    if (spawnTimers.clue <= 0) {
      spawnClue();
      spawnTimers.clue = 2.4 + Math.random() * 1.3;
    }
    if (spawnTimers.hazard <= 0) {
      spawnHazard();
      spawnTimers.hazard = 1.2 + Math.random() * 0.8;
    }

    // update hazards
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.y += h.vy * dtClamped;
      h.wobblePhase += dtClamped * 4;
      if (h.y - h.r > ch + 40) {
        hazards.splice(i, 1);
      }
    }

    // update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dtClamped;
      if (p.age >= p.life) {
        particles.splice(i, 1);
      } else {
        p.x += p.vx * dtClamped;
        p.y += p.vy * dtClamped;
      }
    }

    // collisions
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      const dx = hero.x - h.x;
      const dy = hero.y - h.y;
      const rad = hero.r + h.r * 0.7;
      if (dx*dx + dy*dy <= rad * rad) {
        hazards.splice(i, 1);
        LEVEL.gameOverReason = 'The patrol got overwhelmed.';
        AudioManager.playSfx('sfx_hit');
        vibrate('heavy');
        flashHit();
        endGame(false);
        return;
      }
    }

    if (remaining <= 0) {
      LEVEL.gameOverReason = 'You made it to dawn.';
      endGame(true);
    }
  }

  function endGame(victory) {
    setState('GAMEOVER');
    AudioManager.stopBgm();
    AudioManager.playSfx(victory ? 'sfx_win' : 'sfx_fail', { volume: victory ? 0.32 : 0.28, minGap: 200 });
    if (victoryGifEl) {
      victoryGifEl.classList.toggle('hidden', !victory);
    }
    if (defeatGifEl) {
      defeatGifEl.classList.toggle('hidden', victory);
    }
    if (finalMessageEl) {
      if (victory) {
        finalMessageEl.textContent = 'You held the route until sunrise and secured the loose case files.';
      } else {
        finalMessageEl.textContent = 'A rogue hazard broke your route. Try a cleaner patrol line.';
      }
    }
    if (finalCluesEl) {
      finalCluesEl.textContent = String(LEVEL.clueCollected);
    }
    if (finalTimeEl) {
      finalTimeEl.textContent = LEVEL.elapsed.toFixed(1) + 's';
    }
  }

  function flashHit() {
    const gc = document.getElementById('game-container');
    if (!gc) return;
    gc.classList.remove('shake');
    void gc.offsetWidth;
    gc.classList.add('shake');
    canvas.classList.remove('flash-red');
    void canvas.offsetWidth;
    canvas.classList.add('flash-red');
    setTimeout(() => {
      gc.classList.remove('shake');
      canvas.classList.remove('flash-red');
    }, 400);
  }

  function drawBackground() {
     // sky gradient handled by canvas CSS; draw ground and fog
     const groundTop = ch * 0.75;
     const groundGrad = ctx.createLinearGradient(0, groundTop, 0, ch);
     groundGrad.addColorStop(0, '#24103c');
     groundGrad.addColorStop(1, '#090412');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundTop, cw, ch - groundTop);

    // far trees
    ctx.save();
    ctx.translate(0, ch * 0.1);
    ctx.globalAlpha = 0.45;
    bgTreesFar.forEach(t => {
      const wobble = Math.sin((LEVEL.elapsed * 0.3) + t.offset * 10) * 5;
      const x = t.x + wobble * 0.3;
      const yBase = groundTop - t.h;
       ctx.fillStyle = '#13091d';
      ctx.beginPath();
      ctx.moveTo(x, yBase + t.h);
      ctx.lineTo(x - t.w * 0.45, yBase + t.h * 0.3);
      ctx.lineTo(x, yBase);
      ctx.lineTo(x + t.w * 0.45, yBase + t.h * 0.3);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();

    // near trees
    ctx.save();
    ctx.translate(0, ch * 0.05);
    ctx.globalAlpha = 0.7;
    bgTreesNear.forEach(t => {
      const wobble = Math.sin((LEVEL.elapsed * 0.6) + t.offset * 10) * 6;
      const x = t.x + wobble;
      const yBase = groundTop - t.h;
      const trunkW = t.w * 0.25;
       ctx.fillStyle = '#170f29';
       ctx.fillRect(x - trunkW/2, yBase + t.h * 0.45, trunkW, t.h * 0.6);
       ctx.fillStyle = '#26184a';
      ctx.beginPath();
      ctx.moveTo(x, yBase);
      ctx.lineTo(x - t.w * 0.5, yBase + t.h * 0.45);
      ctx.lineTo(x + t.w * 0.5, yBase + t.h * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, yBase + t.h * 0.25);
      ctx.lineTo(x - t.w * 0.4, yBase + t.h * 0.65);
      ctx.lineTo(x + t.w * 0.4, yBase + t.h * 0.65);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();

    // fog layer
    const fogGrad = ctx.createLinearGradient(0, groundTop - 60, 0, groundTop + 40);
     fogGrad.addColorStop(0, 'rgba(160,180,255,0)');
     fogGrad.addColorStop(0.6, 'rgba(120,170,255,0.16)');
     fogGrad.addColorStop(1, 'rgba(15,10,32,0)');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, groundTop - 80, cw, 140);
  }

  function drawHero() {
    const r = Math.max(0, hero.r);
    ctx.save();
    ctx.translate(hero.x, hero.y);
    const bob = Math.sin(LEVEL.elapsed * 6) * 2;
    ctx.translate(0, bob);
    ctx.shadowColor = 'rgba(15,23,42,0.9)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;

     // body
     ctx.fillStyle = '#e9ecff';
    const bodyW = r * 1.4;
    const bodyH = r * 1.6;
    ctx.beginPath();
    const x = -bodyW/2;
    const y = -bodyH/2;
    const radius = 12;
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + bodyW - radius, y);
    ctx.quadraticCurveTo(x + bodyW, y, x + bodyW, y + radius);
    ctx.lineTo(x + bodyW, y + bodyH - radius);
    ctx.quadraticCurveTo(x + bodyW, y + bodyH, x + bodyW - radius, y + bodyH);
    ctx.lineTo(x + radius, y + bodyH);
    ctx.quadraticCurveTo(x, y + bodyH, x, y + bodyH - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();

     // visor crest
     const crestGrad = ctx.createLinearGradient(-r, y - 6, r, y + bodyH * 0.2);
     crestGrad.addColorStop(0, hero.color);
     crestGrad.addColorStop(1, '#a78bfa');
     ctx.fillStyle = crestGrad;
     ctx.beginPath();
     ctx.moveTo(0, y - 5);
     ctx.lineTo(-r * 0.68, y + bodyH * 0.18);
     ctx.lineTo(r * 0.68, y + bodyH * 0.18);
     ctx.closePath();
     ctx.fill();
    // side fins for stronger silhouette
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.62, y + bodyH * 0.25);
    ctx.lineTo(-bodyW * 0.95, y + bodyH * 0.42);
    ctx.lineTo(-bodyW * 0.5, y + bodyH * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.62, y + bodyH * 0.25);
    ctx.lineTo(bodyW * 0.95, y + bodyH * 0.42);
    ctx.lineTo(bodyW * 0.5, y + bodyH * 0.55);
    ctx.closePath();
    ctx.fill();

     // eyes
     ctx.fillStyle = '#140c22';
    const eyeY = y + bodyH * 0.35;
    ctx.beginPath();
    ctx.arc(-r * 0.32, eyeY, 3, 0, Math.PI * 2);
    ctx.arc(r * 0.32, eyeY, 3, 0, Math.PI * 2);
    ctx.fill();

     // mouth
     ctx.strokeStyle = '#140c22';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.moveTo(-r * 0.22, y + bodyH * 0.6);
     ctx.quadraticCurveTo(0, y + bodyH * 0.76, r * 0.22, y + bodyH * 0.6);
     ctx.stroke();
    // chest core
    ctx.fillStyle = '#72f1ff';
    ctx.beginPath();
    ctx.roundRect(-r * 0.32, y + bodyH * 0.48, r * 0.64, r * 0.5, 4);
    ctx.fill();

    ctx.restore();

    // shadow on ground
    const groundY = ch * 0.75;
    ctx.save();
    ctx.fillStyle = 'rgba(15,23,42,0.6)';
    ctx.beginPath();
    ctx.ellipse(hero.x, groundY + 10, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawClues() {
     clues.forEach(c => {
       ctx.save();
       ctx.translate(c.x, c.y);
       const t = Math.sin(LEVEL.elapsed * 5 + c.r) * 2;
       ctx.translate(0, t);
       const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, c.r * 2.2);
       glow.addColorStop(0, 'rgba(255, 216, 107, 0.26)');
       glow.addColorStop(1, 'rgba(255, 216, 107, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0, c.r * 2.2), 0, Math.PI * 2);
      ctx.fill();

       ctx.shadowColor = 'rgba(255,216,107,0.95)';
       ctx.shadowBlur = 18;

       const baseColor = '#ffd86b';
       ctx.fillStyle = baseColor;
       ctx.strokeStyle = '#24103c';
      ctx.lineWidth = 2;

      if (c.type === 'triangle') {
        const size = c.r * 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.9);
        ctx.lineTo(-size, size * 0.8);
        ctx.lineTo(size, size * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // exclamation
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.5);
        ctx.lineTo(0, size * 0.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, size * 0.35, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
      } else if (c.type === 'eye') {
        const rx = c.r * 1.4;
        const ry = c.r * 0.9;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, c.r * 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e5e7eb';
        ctx.beginPath();
        ctx.arc(-c.r * 0.15, -c.r * 0.15, c.r * 0.25, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // question mark
        const size = c.r * 1.2;
        ctx.beginPath();
        ctx.arc(0, -size * 0.2, size * 0.7, Math.PI * 0.9, Math.PI * 2.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, size * 0.4);
        ctx.lineTo(0, size * 0.1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, size * 0.6, 2.6, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
      }

      ctx.restore();
    });
  }

  function drawHazards() {
    hazards.forEach(h => {
      ctx.save();
      const wobble = Math.sin(h.wobblePhase) * 4;
      const y = h.y;
      const x = h.x + wobble;
      ctx.translate(x, y);
       ctx.shadowColor = 'rgba(255,107,143,0.9)';
       ctx.shadowBlur = 18;
       ctx.fillStyle = '#ff6b8f';
       ctx.strokeStyle = '#551a3f';
      ctx.lineWidth = 2.2;

      const r = Math.max(0, h.r);
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.9, r * 0.1);
      ctx.lineTo(0, r);
      ctx.lineTo(-r * 0.9, r * 0.1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    });
  }

  function drawParticles(dt) {
    particles.forEach(p => {
      const t = p.age / p.life;
      const alpha = 1 - t;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color || '#fbbf24';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2 + (1 - t) * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function render(dt) {
    ctx.clearRect(0, 0, cw, ch);
    drawBackground();
    drawClues();
    drawHazards();
    drawHero();
    drawParticles(dt);
  }

  function gameLoop(timestamp) {
    try {
      const t = timestamp / 1000;
      const dt = lastTime ? (t - lastTime) : 0;
      lastTime = t;
      update(dt);
      render(dt);
    } catch (e) {
      console.error('Game loop error', e);
    }
    requestAnimationFrame(gameLoop);
  }

  // ---------- DOMContentLoaded ----------
  document.addEventListener('DOMContentLoaded', function() {
    parseConfig();
    rebuildTheme();
    canvas = document.getElementById('gameCanvas');
    timerTextEl = document.getElementById('timer-text');
    clueCountEl = document.getElementById('clue-count');
    finalMessageEl = document.getElementById('final-message');
    finalCluesEl = document.getElementById('final-clues');
    finalTimeEl = document.getElementById('final-time');
    gameOverScreenEl = document.getElementById('game-over-screen');
    hudEl = document.getElementById('hud');
    victoryGifEl = document.getElementById('victory-gif');
    defeatGifEl = document.getElementById('defeat-gif');

    AudioManager.init();

    if (canvas) {
      const ro = new ResizeObserver(handleResize);
      ro.observe(canvas);
    }

    // [agent-note][stage4] repaired: mobile-action-risk | element: canvas/restart-btn | action: scoped gameplay pointer suppression to canvas so UI taps still trigger click
    document.addEventListener('pointerdown', unlockAudioFromGesture, { passive: true });
    if (canvas) {
      canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
      canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
      canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
      canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });
    }

    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) {
      restartBtn.addEventListener('click', function() {
        AudioManager.unlock();
        restartGame();
      });
    }
  });
})();
</script>
</body>
</html>
