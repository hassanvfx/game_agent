            --bg-deep: #120c1f;
            --bg-mid: #25133d;
            --bg-glow: #43206c;
            --panel: rgba(21, 14, 40, 0.86);
            --panel-strong: rgba(38, 20, 64, 0.92);

            --text-soft: #e6d7ff;
            --text-muted: #b9afcf;
            --accent-gold: #ffb938;
            --accent-coral: #ff6b5f;
            --accent-mint: #72ffd2;
            --accent-purple: #8a5cff;
            --shadow-deep: rgba(5, 1, 13, 0.55);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 164, 71, 0.18), transparent 32%),
                radial-gradient(circle at 20% 20%, rgba(114, 255, 210, 0.14), transparent 20%),
                linear-gradient(180deg, var(--bg-glow) 0%, var(--bg-mid) 38%, var(--bg-deep) 100%);
            color: var(--text-main);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.35;
        }

        body::after {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 188, 98, 0.14), transparent 0 16%),
                radial-gradient(circle at 84% 14%, rgba(138, 92, 255, 0.16), transparent 0 14%),
                radial-gradient(circle at 50% 90%, rgba(114, 255, 210, 0.12), transparent 0 18%);
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(55, 34, 89, 0.92), rgba(24, 15, 44, 0.92));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 201, 92, 0.72);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.28),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset,
                0 0 18px rgba(255, 185, 56, 0.15);
        }

        .glass--hero {
            background:
                linear-gradient(180deg, rgba(68, 34, 88, 0.96), rgba(25, 15, 43, 0.96));
            border-color: rgba(255, 201, 92, 0.88);
            box-shadow:
                0 24px 50px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.12) inset,
                0 0 32px rgba(255, 144, 84, 0.22);
        }

        .panel-caption,
        .tool-label,
        .title-kicker,
        .score-label {
            font-family: 'Russo One', 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .btn-bounce:active { transform: scale(0.95); }

        .tool-btn {
            transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease, border-color 0.14s ease, filter 0.14s ease;
            border: 2px solid rgba(255, 237, 202, 0.28);
            border-bottom-width: 5px;
            border-bottom-color: rgba(0, 0, 0, 0.34);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,240,225,0.88));
            color: #3d2445;
            position: relative;
            overflow: hidden;
        }

        .tool-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent 45%);
            pointer-events: none;
        }

        .tool-btn.active {
            background:
                linear-gradient(180deg, #ffd06b 0%, #ff944f 100%);
            color: #fff9ef;
            border-color: rgba(255, 244, 214, 0.78);
            border-bottom-color: #7e2e1b;
            transform: translateY(-4px);
            box-shadow:

            filter: saturate(1.05);

        .tool-icon {
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.18));
        }

            position: absolute;
            right: 0.9rem;
            bottom: 0.9rem;
            width: min(28vw, 7.5rem);
            border-radius: 1rem;
            border: 2px solid rgba(255, 201, 92, 0.48);
            background: rgba(16, 10, 30, 0.8);

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.unlocked = false;
        this.masterGain = null;
        this.musicGain = null;
        this.musicOscillators = [];
        this.activeSfx = new Map();
    }

    ensureContext() {
        if (this.ctx) return this.ctx;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.72;
        this.musicGain = this.ctx.createGain();
        this.musicGain.gain.value = 0;
        this.musicGain.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);
        return this.ctx;
    }

    unlock() {
        const ctx = this.ensureContext();
        if (!ctx) return Promise.resolve(false);
        return ctx.resume().then(() => {
            this.unlocked = true;
            this.startMusic();
            return true;
        }).catch(() => false);
    }

    createVoice(type = 'sine') {
        const ctx = this.ensureContext();
        if (!ctx || !this.unlocked) return null;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(this.masterGain);
        return { ctx, osc, gain };
    }

    triggerSfx(type) {
        if (this.activeSfx.get(type)) return;
        const voiceMap = {
            seat: () => this.playSeat(),
            serve: () => this.playServe(),
            done: () => this.playDone(),
            coin: () => this.playCoin(),
            ui: () => this.playUi(),
            error: () => this.playError()
        };
        const runner = voiceMap[type];
        if (!runner) return;
        this.activeSfx.set(type, true);
        runner();
        window.setTimeout(() => this.activeSfx.delete(type), 120);
    }

    playSeat() {
        const voice = this.createVoice('sine');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(620, t);
        osc.frequency.exponentialRampToValueAtTime(960, t + 0.08);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
        osc.start(t);
        osc.stop(t + 0.28);
    }

    playServe() {
        const voice = this.createVoice('triangle');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(140, t + 0.18);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        osc.start(t);
        osc.stop(t + 0.24);
    }

    playDone() {
        const voice = this.createVoice('square');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.setValueAtTime(560, t + 0.08);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.32);
    }

    playCoin() {
        const voice = this.createVoice('square');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(980, t);
        osc.frequency.setValueAtTime(1460, t + 0.06);
        osc.frequency.setValueAtTime(1760, t + 0.12);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.1, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
        osc.start(t);
        osc.stop(t + 0.28);
    }

    playUi() {
        const voice = this.createVoice('sine');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.linearRampToValueAtTime(700, t + 0.09);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.035, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.13);
    }

    playError() {
        const voice = this.createVoice('sawtooth');
        if (!voice) return;
        const { ctx, osc, gain } = voice;
        const t = ctx.currentTime;
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.linearRampToValueAtTime(118, t + 0.12);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.065, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.19);
    }

    startMusic() {
        const ctx = this.ensureContext();
        if (!ctx || !this.unlocked || this.musicOscillators.length) return;
        const t = ctx.currentTime;
        const notes = [196, 246.94, 293.66];
        notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = index === 1 ? 'triangle' : 'sine';
            osc.frequency.value = freq;
            gain.gain.value = index === 0 ? 0.018 : 0.012;
            osc.connect(gain);
            gain.connect(this.musicGain);
            osc.start(t);
            this.musicOscillators.push({ osc, gain });
        });
        this.musicGain.gain.cancelScheduledValues(t);
        this.musicGain.gain.setValueAtTime(0.0001, t);
        this.musicGain.gain.exponentialRampToValueAtTime(0.24, t + 1.2);
    }
}

/**
 * GAME ENGINE
 */
const audioManager = new AudioManager();

// Config
let gameConfig = {
    eatingSpeed: 4,
    dishPrice: 25,
    gridSize: 5
};

// State
let money = 0;
let grid = [];
let particles = [];
let floatingTexts = [];
let currentTool = 'seat'; // seat, serve, bill
let lastTime = 0;
let camera = { x: 0, y: 0 };

// Constants
const TILE_SIZE = 64; 
const BLOCK_HEIGHT = 12;
const COLORS = {
    floor1: '#291744',
    floor2: '#140b26',
    floorRed: '#50306e',
    table: '#ff8f52',
    tableCloth: '#ffd66e',
    chair: '#2d3748',
    skin: ['#f6ad55', '#fbd38d', '#feb2b2', '#90cdf4'],
    shirt: ['#ff6b5f', '#72ffd2', '#8a5cff', '#ffd447', '#60a5fa']
};

// DOM
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
const startScreen = document.getElementById('start-screen');
const hud = document.getElementById('hud');
const tutorialText = document.getElementById('tutorial-text');
const feedbackOverlay = document.getElementById('feedback-overlay');
const feedbackGif = document.getElementById('feedback-gif');
const feedbackLabel = document.getElementById('feedback-label');
const GIFS = {
    success: {
        src: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
        label: 'TIP RUSH'
    },
    fail: {
        src: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
        label: 'WHOOPS'
    }
};
let feedbackTimeout = null;

// Initialize
function init() {
    // Load config from block if needed
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
    } catch(e) {}

    resize();
    window.addEventListener('resize', resize);
    
    // Input
    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    
    // Start
    document.getElementById('start-btn').addEventListener('click', () => {
        audioManager.unlock();
        audioManager.triggerSfx('ui');
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        initGrid();
        requestAnimationFrame(gameLoop);
    });
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Center camera
    camera.x = window.innerWidth / 2;
    camera.y = window.innerHeight / 2 - (gameConfig.gridSize * TILE_SIZE / 4);
}

function initGrid() {
    grid = [];
    const size = gameConfig.gridSize;
    for (let x = 0; x < size; x++) {
        grid[x] = [];
        for (let y = 0; y < size; y++) {
            grid[x][y] = {
                state: 'empty', // empty, waiting, eating, done
                timer: 0,
                maxTime: gameConfig.eatingSpeed,
                bounce: 0,
                customer: null
            };
        }
    }
}

function createCustomer() {
    return {
        skinColor: COLORS.skin[Math.floor(Math.random() * COLORS.skin.length)],
        shirtColor: COLORS.shirt[Math.floor(Math.random() * COLORS.shirt.length)],
        height: 0 // For spawn animation
    };
}

// Isometric Maths
function isoToScreen(gx, gy) {
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    return {
        x: (gx - gy) * tileW + camera.x,
        y: (gx + gy) * tileH + camera.y
    };
}

function screenToIso(sx, sy) {
    const adjX = sx - camera.x;
    const adjY = sy - camera.y;
    const tileW = TILE_SIZE;
    const tileH = TILE_SIZE / 2;
    const gy = ((adjY / tileH) - (adjX / tileW)) / 2;
    const gx = ((adjY / tileH) + (adjX / tileW)) / 2;
    return { x: Math.floor(gx), y: Math.floor(gy) };
}

// Game Loop
function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Update Grid
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            const cell = grid[x][y];
            
            // Bounce animation return
            if (cell.bounce > 0) {
                cell.bounce = Math.max(0, cell.bounce - dt * 60);
            }

            // Customer spawn anim
            if (cell.customer && cell.customer.height < 1) {
                cell.customer.height = Math.min(1, cell.customer.height + dt * 5);
            }

            // Eating Logic
            if (cell.state === 'eating') {
                cell.timer += dt;
                if (cell.timer >= cell.maxTime) {
                    cell.state = 'done';
                    cell.bounce = 10;
                    // Sparkle
                    spawnParticles(isoToScreen(x, y).x, isoToScreen(x, y).y - 40, '#FFD700', 3);
                    audioManager.triggerSfx('done');
                    showFeedback('success');
                }
            }
        }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.z += p.vz * dt * 60;
        p.vz -= dt * 2; // Gravity
        if (p.z < 0) { p.z = 0; p.vz *= -0.5; }
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Floating Text
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.life -= dt;
        t.y -= dt * 40;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function draw() {
    // Clear
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackdrop();

    // Draw Grid (Painter's Algorithm)
    for (let x = 0; x < gameConfig.gridSize; x++) {
        for (let y = 0; y < gameConfig.gridSize; y++) {
            drawCell(x, y, grid[x][y]);
        }
    }

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        const size = p.size * (p.life / 0.8); 
        ctx.fillRect(p.x, p.y - p.z, size, size);
    });

    // Draw Floating Text
    ctx.textAlign = 'center';
    ctx.font = '24px "Russo One", "Orbitron", system-ui, sans-serif';
    floatingTexts.forEach(t => {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = t.color || '#fff';
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
    });
}

function drawBackdrop() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#2f1650');
    sky.addColorStop(0.45, '#1b1236');
    sky.addColorStop(1, '#120c1f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.globalAlpha = 0.16;
    for (let i = 0; i < 5; i++) {
        const height = 70 + i * 26;
        ctx.fillStyle = i % 2 === 0 ? '#ff7e5f' : '#8a5cff';
        ctx.beginPath();
        ctx.moveTo(-40, h * 0.3 + i * 28);
        ctx.lineTo(w * 0.18, h * 0.16 + i * 12);
        ctx.lineTo(w * 0.42, h * 0.28 + i * 22);
        ctx.lineTo(w * 0.7, h * 0.14 + i * 16);
        ctx.lineTo(w + 40, h * 0.26 + i * 18);
        ctx.lineTo(w + 40, h * 0.26 + i * 18 + height);
        ctx.lineTo(-40, h * 0.3 + i * 28 + height);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 191, 71, 0.1)';
    ctx.lineWidth = 1;
    for (let y = h * 0.58; y < h; y += 22) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawPrism(x, y, w, h, z, colorTop, colorSide) {
    // Top
    ctx.fillStyle = colorTop;
    ctx.beginPath();
    ctx.moveTo(x, y - z);
    ctx.lineTo(x + w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x - w, y + h/2 - z);
    ctx.fill();

    // Sides
    ctx.fillStyle = colorSide;
    ctx.beginPath();
    ctx.moveTo(x + w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x, y + h); // bottom point
    ctx.lineTo(x + w, y + h/2);
    ctx.fill();

    ctx.fillStyle = adjustColor(colorSide, -20); // Darker side
    ctx.beginPath();
    ctx.moveTo(x - w, y + h/2 - z);
    ctx.lineTo(x, y + h - z);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - w, y + h/2);
    ctx.fill();
}

function adjustColor(col, amt) {
    return col; 
}

function drawCell(gx, gy, cell) {
    const pos = isoToScreen(gx, gy);
    let x = pos.x;
    let y = pos.y + cell.bounce; 
    
    // Floor
    const isRed = (gx + gy) % 2 === 0;
    const floorColor = isRed ? COLORS.floor1 : COLORS.floorRed;
    const floorDark = isRed ? COLORS.floor2 : '#1f1135';
    
    drawPrism(x, y, TILE_SIZE, TILE_SIZE/2, 4, floorColor, floorDark);

    const laneGlow = ctx.createLinearGradient(x, y - 14, x, y + 16);
    laneGlow.addColorStop(0, 'rgba(255, 196, 84, 0.22)');
    laneGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = laneGlow;
    ctx.beginPath();
    ctx.moveTo(x, y - 2);
    ctx.lineTo(x + TILE_SIZE * 0.8, y + TILE_SIZE / 2 - 2);
    ctx.lineTo(x, y + TILE_SIZE - 4);
    ctx.lineTo(x - TILE_SIZE * 0.8, y + TILE_SIZE / 2 - 2);
    ctx.closePath();
    ctx.fill();

    // Table
    const tableH = 20;
    const tableW = TILE_SIZE * 0.6;
    const tableY = y - 10;
    
    // Table Leg
    drawPrism(x, tableY, 8, 4, tableH, '#3f2a67', '#1a1231');
    
    // Table Top
    drawPrism(x, tableY, tableW, tableW/2, tableH + 5, COLORS.tableCloth, '#e58a5c');

    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath();
    ctx.ellipse(x, tableY + 4, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Customer
    if (cell.state !== 'empty' && cell.customer) {
        const ch = 30 * cell.customer.height;
        const cy = tableY - tableH - 5;
        
        // Character shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.beginPath();
        ctx.ellipse(x, cy + 12, 13, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        drawPrism(x, cy, 12, 6, ch, cell.customer.shirtColor, '#2b1745');
        // Head
        drawPrism(x, cy - ch, 8, 4, 12, cell.customer.skinColor, '#ae5d3a');

        // Hair cap / visor for stronger silhouette
        const headY = cy - ch - 12;
        drawPrism(x, headY, 8, 4, 4, '#2c183d', '#150c20');

        // Face glow / eyes
        ctx.fillStyle = '#fff7d6';
        ctx.fillRect(x - 4, cy - ch - 6, 2, 2);
        ctx.fillRect(x + 2, cy - ch - 6, 2, 2);

        // Apron / chest badge
        ctx.fillStyle = '#fff1bf';
        ctx.fillRect(x - 2, cy + 3, 4, Math.max(4, ch * 0.35));
    }

    // State Icons / Food
    const iconY = y - 80 - cell.bounce;
    
    if (cell.state === 'waiting') {
        drawBubble(x, iconY, '🍜');
    } else if (cell.state === 'eating') {
        const foodY = tableY - tableH - 5;
        drawPrism(x, foodY, 10, 5, 5, '#72ffd2', '#2fa786');
        
        // Steam
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(x + i * 5, foodY - 6);
            ctx.quadraticCurveTo(x + i * 4 + 3, foodY - 15, x + i * 5, foodY - 22);
            ctx.stroke();
        }
        ctx.restore();
        
        // Progress bar
        const pct = cell.timer / cell.maxTime;
        ctx.fillStyle = '#1b1236';
        ctx.fillRect(x - 15, iconY, 30, 6);
        ctx.fillStyle = '#72ffd2';
        ctx.fillRect(x - 14, iconY + 1, 28 * pct, 4);
    } else if (cell.state === 'done') {
        drawBubble(x, iconY, '💸');
    }
}

function drawBubble(x, y, char) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y + 20, 10, 5, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Bubble
    const bubbleGrad = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, 22);
    bubbleGrad.addColorStop(0, '#fff9dc');
    bubbleGrad.addColorStop(1, '#ffb96d');
    ctx.fillStyle = bubbleGrad;
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff3cc';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '20px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.fillText(char, x, y + 2);
}

// Input Handling
function handleInput(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    
    const iso = screenToIso(sx, sy);
    
    if (iso.x >= 0 && iso.x < gameConfig.gridSize && iso.y >= 0 && iso.y < gameConfig.gridSize) {
        interact(iso.x, iso.y);
    }
}

function interact(x, y) {
    const cell = grid[x][y];
    const pos = isoToScreen(x, y);
    let success = false;

    if (currentTool === 'seat') {
        if (cell.state === 'empty') {
            cell.state = 'waiting';
            cell.customer = createCustomer();
            cell.bounce = 15;
            audioManager.triggerSfx('seat');
            spawnParticles(pos.x, pos.y, '#fff', 5);
            success = true;
        }
    } else if (currentTool === 'serve') {
        if (cell.state === 'waiting') {
            cell.state = 'eating';
            cell.timer = 0;
            cell.bounce = 10;
            audioManager.triggerSfx('serve');
            spawnParticles(pos.x, pos.y, '#72ffd2', 5);
            success = true;
        }
    } else if (currentTool === 'bill') {
        if (cell.state === 'done') {
            cell.state = 'empty';
            cell.customer = null;
            
            money += gameConfig.dishPrice;
            scoreEl.textContent = money;
            scoreEl.parentElement.classList.add('animate-pulse');
            setTimeout(() => scoreEl.parentElement.classList.remove('animate-pulse'), 200);

            addFloatingText(pos.x, pos.y - 60, `+$${gameConfig.dishPrice}`, '#ffdf75');
            spawnParticles(pos.x, pos.y, '#ffdf75', 8); // Money particles
            audioManager.triggerSfx('coin');
            showFeedback('success');
            success = true;
        }
    }

    if (!success) {
        // Feedback for wrong tool
        audioManager.triggerSfx('error');
        cell.bounce = 5;
        showFeedback('fail');
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            z: 20,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            vz: Math.random() * 5 + 3,
            life: 1.0,
            color: color,
            size: Math.random() * 6 + 3
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        life: 1.0
    });
}

// UI Logic
function showFeedback(type) {
    const config = GIFS[type];
    if (!config) return;
    feedbackGif.src = config.src;
    feedbackLabel.textContent = config.label;
    feedbackOverlay.classList.add('active');
    if (feedbackTimeout) window.clearTimeout(feedbackTimeout);
    feedbackTimeout = window.setTimeout(() => {
        feedbackOverlay.classList.remove('active');
    }, 1100);
}

window.selectTool = (tool) => {
    currentTool = tool;
    audioManager.triggerSfx('ui');
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.id === `tool-${tool}`) {
            btn.classList.add('active');
        }
    });

    // Update tutorial text
     let txt = "";
     if (tool === 'seat') txt = "Tap an open booth to wave in the next neon regular.";
     if (tool === 'serve') txt = "Tap waiting booths (🍜) to slide over a hot order.";
     if (tool === 'bill') txt = "Tap finished booths (💸) to lock in glowing tips.";
    tutorialText.textContent = txt;
};

// Start
document.addEventListener('DOMContentLoaded', init);
