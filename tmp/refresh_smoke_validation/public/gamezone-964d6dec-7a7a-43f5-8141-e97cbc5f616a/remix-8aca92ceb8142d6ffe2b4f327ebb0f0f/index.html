<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EchoTamer: Prism Trail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&display=swap">
<link rel="preconnect" href="https://gamezone-virid.vercel.app" crossorigin>
<style>
    :root {
        --bg: #eafff4;
        --bg-deep: #7adcf5;
        --road: #8be36f;
        --road-edge: #4bbd73;
        --panel: rgba(255, 255, 255, 0.88);
        --panel-strong: rgba(255, 255, 255, 0.96);
        --line: rgba(32, 142, 112, 0.24);
        --cyan: #2bb7f0;
        --cyan-strong: #0ba7df;
        --amber: #ffb347;
        --danger: #ff5875;
        --lime: #58d67c;
        --text: #213142;
        --muted: #5b7b82;
        --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --font-ui: 'Rajdhani', system-ui, sans-serif;
        --font-display: 'Bangers', 'Arial Black', cursive;
        --font-accent: 'Rajdhani', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(24, 201, 255, 0.12), transparent 42%),
            linear-gradient(180deg, #9ee9ff 0%, #fef7d2 55%, #b9f7b5 100%);
        color: var(--text);
        font-family: var(--font-ui);
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(90deg, transparent 0%, rgba(102, 230, 255, 0.03) 50%, transparent 100%),
            repeating-linear-gradient(
                180deg,
                rgba(255,255,255,0.015) 0 2px,
                transparent 2px 6px
            );
        mix-blend-mode: screen;
        opacity: 0.55;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .hidden { display: none !important; }
    .teko, .font-display { font-family: var(--font-display); }
    .font-accent { font-family: var(--font-accent); }
    .neon-text { text-shadow: 0 0 10px currentColor; }

    .glass {
        background:
            linear-gradient(180deg, rgba(255,255,255,0.92), rgba(231,255,240,0.88));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--line);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.06),
            0 0 0 1px rgba(24, 201, 255, 0.04),
            var(--shadow);
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        user-select: none;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 0%, rgba(102, 230, 255, 0.08), transparent 32%),
            linear-gradient(180deg, #8ce7ff 0%, #fff3bd 45%, #97ec91 100%);
    }

    #game-container::before,
    #game-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    #game-container::before {
        background:
            radial-gradient(circle at 18% 24%, rgba(255,255,255,0.44) 0 3px, transparent 4px),
            radial-gradient(circle at 80% 18%, rgba(255,255,255,0.36) 0 4px, transparent 5px),
            linear-gradient(90deg, rgba(68, 196, 111, 0.12), transparent 16%, transparent 84%, rgba(68, 196, 111, 0.12)),
            linear-gradient(180deg, transparent 0%, rgba(52, 128, 75, 0.12) 100%);
        opacity: 0.95;
    }

    #game-container::after {
        background:
            radial-gradient(circle at 50% 100%, rgba(255, 198, 87, 0.18), transparent 30%),
            repeating-linear-gradient(55deg, rgba(255,255,255,0.12) 0 2px, transparent 2px 42px);
        animation: trailSparkle 8s linear infinite;
    }

    @keyframes trailSparkle {
        from { transform: translateY(0); }
        to { transform: translateY(42px); }
    }

    #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
    }

    #hud {
        width: 100%;
        padding: 14px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        z-index: 40;
    }

    .hud-card {
        padding: 10px 12px;
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 144px;
        pointer-events: auto;
        position: relative;
    }

    .hud-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: inset 0 0 18px rgba(102, 230, 255, 0.08);
    }

    .fuel-row,
    .score-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .score-row {
        justify-content: space-between;
        margin-top: 2px;
    }

    .label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-weight: 700;
        white-space: nowrap;
    }

    .fuel-shell {
        flex: 1;
        height: 10px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.4);
    }

    #fuel-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ffe27a, var(--amber));
        border-radius: inherit;
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.45);
        transition: width 0.2s ease, background-color 0.2s ease;
    }

    .score-value {
        font-size: 22px;
        font-family: var(--font-display);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #fff;
        text-shadow: 0 0 12px rgba(102, 230, 255, 0.28);
    }

    #score-val { color: var(--amber); }

    .icon-button {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--text);
        cursor: pointer;
        transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease;
    }

    .icon-button:hover,
    .icon-button:active {
        transform: scale(0.96);
        background: rgba(255,255,255,0.08);
        border-color: rgba(102, 230, 255, 0.3);
    }

    .screen {
        position: absolute;
        inset: 0;
        pointer-events: auto;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #menu-screen {
        background: linear-gradient(180deg, rgba(0,0,0,0.78), rgba(0, 7, 16, 0.88));
        backdrop-filter: blur(12px);
    }

    #menu-screen h1,
    #game-over-screen h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        color: white;
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        text-shadow: 0 0 22px rgba(102, 230, 255, 0.3);
    }

    #menu-screen h1 {
        font-size: clamp(56px, 16vw, 112px);
        transform: skewX(-8deg);
    }

    .menu-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(78vw, 288px);
        margin-top: 30px;
    }

    .arcade-button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        min-height: 58px;
        padding: 14px 18px;
        font-family: var(--font-display);
        font-size: clamp(22px, 7vw, 38px);
        line-height: 1;
        color: white;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }

    .arcade-button:hover,
    .arcade-button:active {
        transform: translateY(1px) scale(0.99);
        filter: brightness(1.05);
    }

    .btn-primary {
        background: linear-gradient(180deg, #ffe27a, #ffbd3d);
        color: #241100;
        box-shadow: 0 12px 30px rgba(255, 190, 61, 0.22);
    }

    .btn-secondary {
        background:
            linear-gradient(180deg, rgba(25, 43, 70, 0.96), rgba(11, 21, 36, 0.96));
        color: white;
        border: 1px solid rgba(102, 230, 255, 0.2);
    }

    .btn-danger {
        background: linear-gradient(180deg, #ff687b, #d93f52);
        color: white;
        box-shadow: 0 12px 30px rgba(255, 93, 115, 0.24);
    }

    #index-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        background:
            radial-gradient(circle at top, rgba(24, 201, 255, 0.1), transparent 30%),
            linear-gradient(180deg, #081220 0%, #040912 100%);
    }

    .index-topbar {
        padding: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: relative;
        z-index: 10;
    }

    .index-title {
        font-size: clamp(34px, 10vw, 52px);
        line-height: 0.9;
        margin: 0;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: -0.04em;
    }

    .index-subtitle {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
    }

    .close-button {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.07);
        color: white;
        font-size: 22px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0,0,0,0.28);
    }

    .rarity-legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 12px;
        padding: 10px 8px;
        background: rgba(0,0,0,0.34);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    #index-grid {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        padding-bottom: 124px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        align-content: start;
    }

    .index-cell {
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.03);
        color: rgba(255,255,255,0.2);
        font-size: 18px;
        font-weight: 700;
    }

    .index-cell.has-car {
        text-shadow: 0 0 10px currentColor;
    }

    .index-id {
        font-family: var(--font-accent);
        font-size: clamp(10px, 3vw, 13px);
        line-height: 1;
    }

    #game-over-screen {
        background: linear-gradient(180deg, rgba(65, 3, 14, 0.9), rgba(17, 3, 9, 0.94));
        backdrop-filter: blur(16px);
    }

    #game-over-screen h2 {
        font-size: clamp(46px, 14vw, 88px);
        transform: skewX(-8deg);
    }

    .game-over-score {
        margin: 10px 0 28px;
        font-family: var(--font-display);
        font-size: clamp(20px, 6vw, 34px);
        color: var(--amber);
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    #btn-restart {
        min-width: min(84vw, 320px);
    }

    #quest-banner {
        position: absolute;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 28;
        pointer-events: none;
        width: min(86vw, 360px);
        padding: 9px 12px;
        border-radius: 18px;
        text-align: center;
        color: #214047;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(255,255,255,0.72);
        box-shadow: 0 12px 24px rgba(62, 139, 97, 0.16);
    }

    .quest-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(24px, 8vw, 38px);
        line-height: 0.88;
        color: #ff5875;
        text-shadow: 0 2px 0 #fff3bd;
    }

    .quest-subtitle {
        margin-top: 3px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #39716c;
    }

    #toast-container {
        position: absolute;
        top: 146px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 30;
        pointer-events: none;
        padding: 0 12px;
    }

    .toast-card {
        padding: 10px 18px;
        border-radius: 18px;
        border-left: 4px solid white;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 18px 30px rgba(0,0,0,0.35);
        max-width: min(88vw, 320px);
    }

    #reaction-layer {
        position: absolute;
        right: 12px;
        bottom: 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        width: min(34vw, 120px);
        z-index: 35;
        pointer-events: none;
    }

    .reaction-badge {
        width: min(28vw, 96px);
        max-height: 96px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(4, 9, 18, 0.78);
        box-shadow: 0 12px 28px rgba(0,0,0,0.3);
        object-fit: cover;
        opacity: 0;
        transform: translateY(8px) scale(0.94);
        transition: opacity 180ms ease, transform 180ms ease;
    }

    .reaction-badge.show {
        opacity: 0.94;
        transform: translateY(0) scale(1);
    }
    .toast-title {
        font-family: var(--font-display);
        font-size: clamp(22px, 6vw, 30px);
        line-height: 1;
        color: white;
        margin: 0;
    }

    .toast-meta {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 700;
        margin-top: 4px;
        text-align: center;
    }

    @keyframes pulse-scale { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .anim-pulse { animation: pulse-scale 1s infinite ease-in-out; }

    @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .anim-slide { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes flash-new {
        0% { opacity: 0; transform: scale(0.5); }
        20% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 1; transform: scale(1); }
    }
    .anim-pop { animation: flash-new 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #112033; }
    ::-webkit-scrollbar-thumb { background: #2e4d69; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #456a8b; }

    .text-divine {
        background: linear-gradient(to right, #ff5f7a, #ffd166, #77f2c8, #66e6ff, #b88cff, #ff5f7a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
        animation: rainbow 3s linear infinite;
        background-size: 200% auto;
    }

    @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    @media (max-width: 480px) {
        #hud { padding: 10px; }
        .hud-card { min-width: 132px; padding: 9px 10px; }
        .score-value { font-size: 18px; }
        .icon-button { width: 44px; height: 44px; border-radius: 14px; }
        .menu-actions { width: min(84vw, 280px); }
        .arcade-button { min-height: 54px; }
        #index-grid { gap: 5px; padding: 8px; padding-bottom: 116px; }
        .index-cell { border-radius: 10px; }
    }
</style>
</head>
<body>

<!-- Assets -->
<div id="assets" hidden>
    <audio id="bgm_race" data-editable="audio" data-label="BGM Prism Trail" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" loop preload="auto"></audio>
    <audio id="sfx_crash" data-editable="audio" data-label="SFX Rival Clash" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_enemy_01.mp3" preload="auto"></audio>
    <audio id="sfx_collect" data-editable="audio" data-label="SFX Befriend" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio>
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "tamerFocus": { "type": "number", "label": "Tamer Focus", "value": 8, "min": 1, "max": 15 },
    "encounterDensity": { "type": "number", "label": "Encounter Flow", "value": 1.6, "min": 0.5, "max": 3.0 },
    "gameSpeed": { "type": "number", "label": "Game Speed", "value": 1.1, "min": 0.5, "max": 2.0 }
}
</script>

<!-- Game Container -->
<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
        <div id="hud">
            <div class="glass hud-card">
                <div class="fuel-row">
                    <div class="label">Bond</div>
                    <div class="fuel-shell">
                        <div id="fuel-bar"></div>
                    </div>
                </div>
                <div class="score-row">
                    <span class="label">Dex Team</span>
                    <span class="score-value"><span id="score-val">0</span>/500</span>
                </div>
            </div>

            <button id="btn-menu" class="glass icon-button" aria-label="Open menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <div id="quest-banner" aria-hidden="true">
            <h1 class="quest-title">EchoTamer</h1>
            <div class="quest-subtitle">Swipe the trail • befriend before your rival does</div>
        </div>

        <div id="toast-container">
            <!-- Dynamic Toasts Injected Here -->
        </div>

        <!-- [agent-note][stage3] resolved-gif: collectible + fuel-empty reactions via catalogs/gifs.json -->
        <div id="reaction-layer" aria-hidden="true">
            <img id="gif-collect" class="reaction-badge" alt="" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp">
            <img id="gif-fail" class="reaction-badge" alt="" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
        </div>

        <div id="menu-screen" class="hidden screen anim-slide">
            <h1>Trail Camp</h1>

            <div class="menu-actions">
                <button id="btn-resume" class="arcade-button btn-primary">Continue</button>
                <button id="btn-index" class="arcade-button btn-secondary">Dex Team</button>
                <button id="btn-restart-menu" class="arcade-button btn-danger">New Trek</button>
            </div>
        </div>

        <div id="index-screen" class="hidden anim-slide">
            <div class="glass index-topbar">
                <div>
                    <h2 class="index-title">Dex Team</h2>
                    <div class="index-subtitle">Catalog 500 Elemental Pals</div>
                </div>
                <button id="btn-close-index" class="close-button" aria-label="Close garage">✕</button>
            </div>

            <div class="rarity-legend">
                <span style="color:#b2bec3">Leaf</span>
                <span style="color:#55efc4">Spark</span>
                <span style="color:#0984e3">Tide</span>
                <span style="color:#a29bfe">Ember</span>
                <span style="color:#fdcb6e">Myth</span>
                <span style="color:#ff7675">Rival</span>
                <span class="text-divine">Prism</span>
            </div>

            <div id="index-grid">
                <!-- Generated via JS -->
            </div>
        </div>

        <div id="game-over-screen" class="hidden screen">
            <h2>Out of Bond</h2>
            <div class="game-over-score">Dex Logged: <span id="final-score">0</span>/500</div>
            <button id="btn-restart" class="arcade-button btn-primary">Try Again</button>
        </div>
    </div>
</div>

<script>
/* --- §0 System Invariants & Config --- */
const CONFIG = {
    canvas: null, ctx: null,
    cw: 0, ch: 0, dpr: 1,
    state: 'BOOT', // BOOT, PLAYING, PAUSED, INDEX, GAMEOVER
    lastTime: 0,
    audioUnlocked: false
};

const FONT_DISPLAY = "'Bangers', 'Arial Black', cursive";
const FONT_ACCENT = "'Rajdhani', system-ui, sans-serif";

// 7 Rarity Tiers
const RARITY = {
    COMMON:    { id: 0, label: 'LEAF',  color: '#6bcf77', prob: 0.50, range: [0, 199] },
    UNCOMMON:  { id: 1, label: 'SPARK', color: '#ffd166', prob: 0.25, range: [200, 349] },
    RARE:      { id: 2, label: 'TIDE',  color: '#2bb7f0', prob: 0.15, range: [350, 429] },
    EPIC:      { id: 3, label: 'EMBER', color: '#ff8a4c', prob: 0.07, range: [430, 469] },
    LEGENDARY: { id: 4, label: 'MYTH',  color: '#a56cff', prob: 0.02, range: [470, 489] },
    MYTHIC:    { id: 5, label: 'RIVAL', color: '#ff5875', prob: 0.008, range: [490, 498] },
    DIVINE:    { id: 6, label: 'PRISM', color: '#ffffff', prob: 0.002, range: [499, 499] }
};

const STATE = {
    hero: { x: 0, y: 0, w: 44, h: 78, targetX: 0 },
    cars: [],
    particles: [],
    roadOffset: 0,
    fuel: 100,
    collection: new Set(),
    shake: 0,
    gameSpeedMod: 1.0
};

// QA-visible references; does not alter mechanics or ownership.
window.CONFIG = CONFIG;
window.STATE = STATE;
window.RARITY = RARITY;

// Persistence
try {
    const saved = localStorage.getItem('echotamer_prism_trail');
    if (saved) JSON.parse(saved).forEach(id => STATE.collection.add(id));
} catch (e) { console.error('Save load failed', e); }

/* --- §1 Audio System --- */
const AUDIO = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    bgm: document.getElementById('bgm_race'),
    assets: {
        collect: document.getElementById('sfx_collect'),
        crash: document.getElementById('sfx_crash')
    },
    uiTick: 0,
    warningActive: false,

    unlock() {
        if (CONFIG.audioUnlocked) return;
        CONFIG.audioUnlocked = true;
        this.ctx.resume().then(() => {
            this.bgm.volume = 0.2;
            this.bgm.play().catch(() => {});
        }).catch(() => {});
    },

    playTone(freq, type, dur, vol = 0.1) {
        if (!CONFIG.audioUnlocked) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
    },

    playElement(name, volume = 0.32) {
        const el = this.assets[name];
        if (!CONFIG.audioUnlocked || !el) return;
        try {
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            el.play().catch(() => {});
        } catch (_) {}
    },

    click() {
        if (!CONFIG.audioUnlocked) return;
        const now = performance.now();
        if (now - this.uiTick < 90) return;
        this.uiTick = now;
        this.playTone(620, 'square', 0.05, 0.045);
    },

    pause() {
        this.playTone(220, 'triangle', 0.08, 0.05);
    },

    resume() {
        this.playTone(460, 'triangle', 0.08, 0.05);
    },

    warning() {
        if (!CONFIG.audioUnlocked || this.warningActive) return;
        this.warningActive = true;
        this.playTone(760, 'square', 0.08, 0.055);
        setTimeout(() => {
            this.playTone(520, 'square', 0.09, 0.045);
            this.warningActive = false;
        }, 120);
    },

    collect(rarityId, isNew) {
        const baseFreq = 420 + (rarityId * 70);
        this.playElement('collect', isNew ? 0.34 : 0.26);
        this.playTone(baseFreq, 'sine', 0.12, isNew ? 0.09 : 0.06);
        if (isNew) {
            setTimeout(() => this.playTone(baseFreq * 1.35, 'triangle', 0.14, 0.06), 70);
        }
    },

    crash() {
        this.playElement('crash', 0.38);
        this.playTone(120, 'sawtooth', 0.28, 0.12);
    },

    syncForState(state) {
        if (state === 'PLAYING') {
            if (CONFIG.audioUnlocked) this.bgm.play().catch(() => {});
            return;
        }
        this.bgm.pause();
    }
};

/* --- §2 Visual Engine --- */
function resize() {
    const c = CONFIG.canvas;
    CONFIG.cw = c.clientWidth;
    CONFIG.ch = c.clientHeight;
    CONFIG.dpr = window.devicePixelRatio || 1;
    c.width = CONFIG.cw * CONFIG.dpr;
    c.height = CONFIG.ch * CONFIG.dpr;
    CONFIG.ctx = c.getContext('2d');
    CONFIG.ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);

    STATE.hero.y = CONFIG.ch - 160;
    if (STATE.hero.x === 0) {
        STATE.hero.x = CONFIG.cw / 2;
        STATE.hero.targetX = CONFIG.cw / 2;
    }
}

function getRarity(id) {
    if (id === 499) return RARITY.DIVINE;
    if (id >= 490) return RARITY.MYTHIC;
    if (id >= 470) return RARITY.LEGENDARY;
    if (id >= 430) return RARITY.EPIC;
    if (id >= 350) return RARITY.RARE;
    if (id >= 200) return RARITY.UNCOMMON;
    return RARITY.COMMON;
}

function pseudoRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

function drawCar(ctx, x, y, w, h, id, isHero = false) {
    ctx.save();
    ctx.translate(x, y);

    let rarity = isHero ? RARITY.COMMON : getRarity(id);
    let baseColor = isHero ? '#2ebdf4' : rarity.color;
    const seed = id * 1337;
    const ears = Math.floor(pseudoRandom(seed) * 3);
    const tail = Math.floor(pseudoRandom(seed + 1) * 4);
    const mark = Math.floor(pseudoRandom(seed + 2) * 4);
    const t = Date.now() * 0.006 + id;

    if (!isHero && rarity === RARITY.DIVINE) {
        const r = Math.sin(t) * 110 + 145;
        const g = Math.sin(t + 2) * 110 + 145;
        const b = Math.sin(t + 4) * 110 + 145;
        baseColor = `rgb(${r},${g},${b})`;
        ctx.shadowColor = baseColor;
        ctx.shadowBlur = 22;
    } else if (!isHero && rarity.id >= 4) {
        ctx.shadowColor = baseColor;
        ctx.shadowBlur = 14;
    }

    if (isHero) {
        ctx.shadowColor = 'rgba(28, 162, 255, 0.48)';
        ctx.shadowBlur = 20;
    }

    ctx.fillStyle = 'rgba(39, 83, 56, 0.22)';
    ctx.beginPath();
    ctx.ellipse(4, h/2 - 2, w * 0.62, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (isHero) {
        // Tamer kid with cap and companion badge; same hitbox as old hero vehicle.
        ctx.fillStyle = '#24546b';
        ctx.beginPath();
        ctx.roundRect(-w * 0.28, -h * 0.05, w * 0.56, h * 0.48, 12);
        ctx.fill();
        ctx.fillStyle = '#ffd39b';
        ctx.beginPath();
        ctx.arc(0, -h * 0.2, w * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff5d73';
        ctx.beginPath();
        ctx.arc(0, -h * 0.34, w * 0.31, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(-w * 0.08, -h * 0.38, w * 0.38, 6);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-w * 0.09, -h * 0.22, 2.5, 0, Math.PI * 2);
        ctx.arc(w * 0.09, -h * 0.22, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(0, h * 0.16, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, h * 0.16, 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#203a4c';
        ctx.font = `bold 10px ${FONT_ACCENT}`;
        ctx.textAlign = 'center';
        ctx.fillText('TAMER', 0, h * 0.36);
        ctx.restore();
        return;
    }

    // Elemental companion silhouette: body, ears, tail, elemental crest.
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.ellipse(0, 3, w * 0.48, h * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = baseColor;
    if (ears === 0) {
        ctx.beginPath(); ctx.moveTo(-w * 0.26, -h * 0.18); ctx.lineTo(-w * 0.42, -h * 0.46); ctx.lineTo(-w * 0.08, -h * 0.32); ctx.fill();
        ctx.beginPath(); ctx.moveTo(w * 0.26, -h * 0.18); ctx.lineTo(w * 0.42, -h * 0.46); ctx.lineTo(w * 0.08, -h * 0.32); ctx.fill();
    } else if (ears === 1) {
        ctx.beginPath(); ctx.ellipse(-w * 0.28, -h * 0.28, 7, 15, -0.35, 0, Math.PI * 2); ctx.ellipse(w * 0.28, -h * 0.28, 7, 15, 0.35, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.beginPath(); ctx.arc(-w * 0.26, -h * 0.28, 9, 0, Math.PI * 2); ctx.arc(w * 0.26, -h * 0.28, 9, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = baseColor;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const tailSide = tail % 2 ? 1 : -1;
    ctx.moveTo(tailSide * w * 0.34, h * 0.08);
    ctx.quadraticCurveTo(tailSide * w * 0.72, -h * 0.18, tailSide * w * 0.46, -h * 0.36);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(-w * 0.13, -h * 0.07, 4, 0, Math.PI * 2);
    ctx.arc(w * 0.13, -h * 0.07, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#253142';
    ctx.beginPath();
    ctx.arc(-w * 0.13, -h * 0.07, 1.8, 0, Math.PI * 2);
    ctx.arc(w * 0.13, -h * 0.07, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff6d4';
    ctx.globalAlpha = 0.72;
    if (mark === 0) { ctx.beginPath(); ctx.arc(0, h * 0.08, 8, 0, Math.PI * 2); ctx.fill(); }
    if (mark === 1) ctx.fillRect(-4, -h * 0.24, 8, h * 0.44);
    if (mark === 2) { ctx.beginPath(); ctx.moveTo(0, -h * 0.25); ctx.lineTo(8, 0); ctx.lineTo(0, h * 0.22); ctx.lineTo(-8, 0); ctx.fill(); }
    if (mark === 3) { ctx.beginPath(); ctx.arc(0, h * 0.07, 10, 0, Math.PI); ctx.fill(); }
    ctx.globalAlpha = 1;

    const elementIcon = ['✦','⚡','≈','🔥','★','!','◆'][rarity.id] || '✦';
    ctx.fillStyle = rarity.id >= 5 ? '#253142' : '#ffffff';
    ctx.font = `bold 13px ${FONT_DISPLAY}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(elementIcon, 0, h * 0.3);

    if (!STATE.collection.has(id)) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.ellipse(0, 3, w * 0.55, h * 0.4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.restore();
}

/* --- §3 Game Logic --- */
function initGame() {
    STATE.hero.x = CONFIG.cw / 2;
    STATE.hero.targetX = CONFIG.cw / 2;
    STATE.hero.y = CONFIG.ch - 160;
    STATE.cars = [];
    STATE.particles = [];
    STATE.fuel = 100;
    STATE.shake = 0;
    STATE.gameSpeedMod = 1.0;

    for(let i=0; i<5; i++) {
        spawnCar(-i * 220 - 300);
    }
}

function spawnCar(yPos) {
    const lanes = [0.2, 0.5, 0.8];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const r = Math.random();
    let tier = RARITY.COMMON;

    if (r < RARITY.DIVINE.prob) tier = RARITY.DIVINE;
    else if (r < RARITY.MYTHIC.prob + RARITY.DIVINE.prob) tier = RARITY.MYTHIC;
    else if (r < 0.05) tier = RARITY.LEGENDARY;
    else if (r < 0.12) tier = RARITY.EPIC;
    else if (r < 0.27) tier = RARITY.RARE;
    else if (r < 0.52) tier = RARITY.UNCOMMON;

    const id = Math.floor(Math.random() * (tier.range[1] - tier.range[0] + 1)) + tier.range[0];

    STATE.cars.push({
        x: lane * CONFIG.cw,
        y: yPos,
        w: 44,
        h: 78,
        id: id,
        rarity: tier,
        speed: 100 + Math.random() * 150,
        isNew: !STATE.collection.has(id)
    });
}

function update(dt) {
    if (CONFIG.state !== 'PLAYING') return;

    if (STATE.shake > 0) STATE.shake *= 0.9;
    if (STATE.shake < 0.5) STATE.shake = 0;

    STATE.gameSpeedMod += dt * 0.01;
    const speed = (window.gameConfig?.gameSpeed || 1.1) * 400 * STATE.gameSpeedMod;

    STATE.roadOffset = (STATE.roadOffset + speed * dt) % 80;

    const sens = window.gameConfig?.tamerFocus || 8;
    STATE.hero.x += (STATE.hero.targetX - STATE.hero.x) * sens * dt;
    STATE.hero.x = Math.max(30, Math.min(CONFIG.cw - 30, STATE.hero.x));

    STATE.fuel -= 4.0 * dt;
    if (STATE.fuel < 22 && STATE.fuel + 4.0 * dt >= 22) {
        AUDIO.warning();
    }
    if (STATE.fuel <= 0) {
        haptic('heavy');
        AUDIO.crash();
        setState('GAMEOVER');
    }

    const density = window.gameConfig?.encounterDensity || 1.6;
    const minSpacing = 180 / density;

    let minY = CONFIG.ch;
    STATE.cars.forEach(c => minY = Math.min(minY, c.y));

    if (minY > -150) {
        spawnCar(minY - minSpacing - Math.random() * 120);
    }

    for (let i = STATE.cars.length - 1; i >= 0; i--) {
        const car = STATE.cars[i];
        car.y += (speed * 0.85 + car.speed * 0.15) * dt;

        const dx = Math.abs(STATE.hero.x - car.x);
        const dy = Math.abs(STATE.hero.y - car.y);

        if (dx < (STATE.hero.w + car.w)/2 * 0.85 && dy < (STATE.hero.h + car.h)/2 * 0.85) {
            collectCar(car);
            STATE.cars.splice(i, 1);
            continue;
        }

        if (car.y > CONFIG.ch + 100) STATE.cars.splice(i, 1);
    }

    for (let i = STATE.particles.length - 1; i >= 0; i--) {
        const p = STATE.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 2.0 * dt;
        if (p.life <= 0) STATE.particles.splice(i, 1);
    }

    const fb = document.getElementById('fuel-bar');
    fb.style.width = Math.max(0, STATE.fuel) + '%';
    fb.style.backgroundColor = STATE.fuel < 25 ? '#ff5d73' : '#ffd166';
    document.getElementById('score-val').innerText = STATE.collection.size;
}

function collectCar(car) {
    const isNew = !STATE.collection.has(car.id);
    const rarity = car.rarity;

    STATE.shake = isNew ? 25 : 10;
    createParticles(car.x, car.y, rarity.color, isNew ? 20 : 8);
    AUDIO.collect(rarity.id, isNew);
    haptic(isNew ? 'heavy' : 'light');
    if (isNew) showReaction('collect', 1250);

    if (isNew) {
        STATE.collection.add(car.id);
        localStorage.setItem('echotamer_prism_trail', JSON.stringify([...STATE.collection]));
        showToast(car);
        STATE.fuel = Math.min(100, STATE.fuel + 30);
    } else {
        STATE.fuel = Math.min(100, STATE.fuel + 15);
    }
}

window.collectCar = collectCar;

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        STATE.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20,
            life: 1.0,
            color,
            size: Math.random() * 5 + 2
        });
    }
}

function showToast(car) {
    const c = document.getElementById('toast-container');
    const div = document.createElement('div');
    const rarity = car.rarity;

    div.className = "glass toast-card anim-pop";
    div.style.borderLeftColor = rarity.color;

    div.innerHTML = `
        <div class="toast-title">NEW PAL!</div>
        <div class="toast-meta" style="color:${rarity.color}">
            #${car.id} • ${rarity.label}
        </div>
    `;

    c.appendChild(div);
    setTimeout(() => {
        div.style.opacity = '0';
        div.style.transform = 'translateX(100px)';
        div.style.transition = 'all 0.5s';
        setTimeout(() => div.remove(), 500);
    }, 2500);
}

const reactionTimers = {};

function showReaction(type, duration = 1000) {
    const el = document.getElementById(`gif-${type}`);
    if (!el) return;
    clearTimeout(reactionTimers[type]);
    el.classList.add('show');
    reactionTimers[type] = setTimeout(() => {
        el.classList.remove('show');
    }, duration);
}

function render() {
    const ctx = CONFIG.ctx;
    const w = CONFIG.cw;
    const h = CONFIG.ch;

    ctx.save();
    if (STATE.shake > 0) ctx.translate((Math.random()-0.5)*STATE.shake, (Math.random()-0.5)*STATE.shake);

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#87e7ff');
    sky.addColorStop(0.46, '#fff4bc');
    sky.addColorStop(1, '#96ef8b');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // Distant coming-of-age route map hills.
    ctx.fillStyle = 'rgba(69, 180, 107, 0.36)';
    ctx.beginPath();
    ctx.moveTo(0, h * 0.32);
    for (let x = 0; x <= w; x += 32) ctx.lineTo(x, h * 0.32 + Math.sin(x * 0.025) * 18);
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();

    const pathGrad = ctx.createLinearGradient(w * 0.5, 0, w * 0.5, h);
    pathGrad.addColorStop(0, 'rgba(255, 231, 147, 0.72)');
    pathGrad.addColorStop(1, 'rgba(219, 162, 87, 0.92)');
    ctx.fillStyle = pathGrad;
    ctx.beginPath();
    ctx.moveTo(w * 0.24, -80);
    ctx.quadraticCurveTo(w * 0.5, h * 0.42, w * 0.18, h + 120);
    ctx.lineTo(w * 0.82, h + 120);
    ctx.quadraticCurveTo(w * 0.5, h * 0.42, w * 0.76, -80);
    ctx.closePath();
    ctx.fill();

    const laneW = w / 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.38)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 24]);
    ctx.lineDashOffset = -STATE.roadOffset * 0.55;
    ctx.beginPath();
    ctx.moveTo(laneW, -100); ctx.lineTo(laneW, h + 100);
    ctx.moveTo(laneW * 2, -100); ctx.lineTo(laneW * 2, h + 100);
    ctx.stroke();
    ctx.setLineDash([]);

    for (let i = 0; i < 14; i++) {
        const y = ((i * 110) + STATE.roadOffset * 0.65) % (h + 140) - 70;
        const side = i % 2 ? w - 30 : 30;
        ctx.fillStyle = i % 3 === 0 ? '#ffb347' : '#4fc36c';
        ctx.beginPath();
        if (i % 3 === 0) {
            ctx.arc(side, y, 7, 0, Math.PI * 2);
        } else {
            ctx.ellipse(side, y, 7, 16, 0.25, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.fillRect(side - 1, y + 8, 2, 18);
    }

    for (let i = 0; i < 9; i++) {
        const y = ((i * 150) + STATE.roadOffset * 0.45) % (h + 170) - 80;
        const x = i % 2 ? w * 0.12 : w * 0.88;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.font = `18px ${FONT_DISPLAY}`;
        ctx.textAlign = 'center';
        ctx.fillText(['✦','⚡','◆'][i % 3], x, y);
    }

    STATE.cars.forEach(car => {
        drawCar(ctx, car.x, car.y, car.w, car.h, car.id);

        if (CONFIG.state === 'PLAYING' && car.isNew) {
            const scale = 1 + Math.sin(Date.now() * 0.01) * 0.2;
            ctx.save();
            ctx.translate(car.x, car.y - 60);
            ctx.scale(scale, scale);
            ctx.font = `bold 20px ${FONT_DISPLAY}`;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff';
            ctx.shadowColor = car.rarity.color;
            ctx.shadowBlur = 15;
            ctx.fillText("NEW!", 0, 0);
            ctx.restore();
        }
    });

    STATE.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    if (CONFIG.state !== 'GAMEOVER') {
        drawCar(ctx, STATE.hero.x, STATE.hero.y, STATE.hero.w, STATE.hero.h, 0, true);
    }

    ctx.restore();
}

function loop(time) {
    const dt = Math.min((time - CONFIG.lastTime) / 1000, 0.05);
    CONFIG.lastTime = time;
    try {
        update(dt);
        render();
    } catch (e) { console.error(e); }
    requestAnimationFrame(loop);
}

/* --- §4 Input & State --- */
function setState(s) {
    CONFIG.state = s;
    ['hud','menu-screen','index-screen','game-over-screen'].forEach(id =>
        document.getElementById(id).classList.add('hidden'));

    if (s === 'PLAYING') document.getElementById('hud').classList.remove('hidden');
    if (s === 'PAUSED') document.getElementById('menu-screen').classList.remove('hidden');
    if (s === 'INDEX') {
        document.getElementById('index-screen').classList.remove('hidden');
        renderIndex();
    }
    if (s === 'GAMEOVER') {
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = STATE.collection.size;
        showReaction('fail', 1800);
    }
    AUDIO.syncForState(s);
}

function handleInput(e) {
    if (CONFIG.state === 'PLAYING') {
        e.preventDefault();
        AUDIO.unlock();
        const rect = CONFIG.canvas.getBoundingClientRect();
        STATE.hero.targetX = e.clientX - rect.left;
    }
}

function renderIndex() {
    const grid = document.getElementById('index-grid');
    grid.innerHTML = '';

    const frag = document.createDocumentFragment();

    for(let i=0; i<500; i++) {
        const has = STATE.collection.has(i);
        const rarity = getRarity(i);
        const div = document.createElement('div');

        div.className = 'index-cell';

        if (has) {
            div.classList.add('has-car');
            div.style.borderColor = rarity.color;
            div.style.backgroundColor = rarity.color + '22';
            div.style.color = rarity.color;
            div.innerHTML = `<span class="index-id">${i}</span>`;
            if (rarity === RARITY.DIVINE) div.classList.add('text-divine');
        } else {
            div.textContent = '?';
        }
        frag.appendChild(div);
    }
    grid.appendChild(frag);
}

function haptic(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

window.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    handleInput(e);
    if (CONFIG.state === 'PLAYING') window.addEventListener('pointermove', handleInput, { passive: false });
}, { passive: false });
window.addEventListener('pointerup', () => window.removeEventListener('pointermove', handleInput));
window.addEventListener('pointercancel', () => window.removeEventListener('pointermove', handleInput));

const click = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
click('btn-menu', () => { AUDIO.click(); AUDIO.pause(); setState('PAUSED'); });
click('btn-resume', () => { AUDIO.click(); AUDIO.resume(); setState('PLAYING'); });
click('btn-index', () => { AUDIO.click(); setState('INDEX'); });
click('btn-close-index', () => { AUDIO.click(); setState('PAUSED'); });
click('btn-restart-menu', () => { AUDIO.click(); AUDIO.resume(); initGame(); setState('PLAYING'); });
click('btn-restart', () => { AUDIO.click(); AUDIO.resume(); initGame(); setState('PLAYING'); });

document.addEventListener('DOMContentLoaded', () => {
    CONFIG.canvas = document.getElementById('gameCanvas');

    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = Object.fromEntries(Object.entries(cfg).map(([k,v]) => [k, v.value]));
    } catch(e) {}

    resize();
    window.addEventListener('resize', resize);

    initGame();
    setState('PLAYING');

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
