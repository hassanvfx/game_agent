<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Moonseed Grove</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#bfdcbc;color:#26351f;font-family:Rajdhani,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.hidden{display:none!important}#ui{position:fixed;inset:0;z-index:3;pointer-events:none}.tap{pointer-events:auto}#start,#end{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,rgba(224,239,196,.25),rgba(75,99,60,.22));backdrop-filter:blur(2px)}.card{width:min(89vw,390px);padding:22px 18px;text-align:center;border:2px solid rgba(75,107,60,.55);border-radius:28px;background:linear-gradient(180deg,rgba(255,248,220,.95),rgba(241,219,173,.9));box-shadow:0 24px 60px rgba(36,52,31,.24),inset 0 1px 0 #fff;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.7),transparent 18%),radial-gradient(circle at 70% 70%,rgba(126,165,98,.18),transparent 24%)}.card>*{position:relative}.crest{width:76px;height:76px;margin:0 auto 12px;border-radius:48% 52% 55% 45%;background:radial-gradient(circle at 37% 29%,#fff8c8 0 10%,transparent 11%),radial-gradient(circle,#e9b95d 0 33%,#91bb72 34% 58%,#496b3d 59%);border:3px solid rgba(255,246,209,.9);box-shadow:0 8px 20px rgba(73,107,61,.28);animation:bob 2.8s ease-in-out infinite}h1{font-family:Cinzel,serif;margin:.1rem 0 .55rem;font-size:clamp(2rem,9vw,3.2rem);line-height:.98;color:#385538;letter-spacing:.05em;text-shadow:0 2px 0 rgba(255,255,255,.75)}p{margin:0 auto 18px;max-width:31ch;font-size:clamp(1rem,4.2vw,1.22rem);font-weight:600;line-height:1.25;color:#5d6841}.chip{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.76rem 1.05rem;border:2px solid rgba(73,107,61,.45);border-radius:999px;background:linear-gradient(180deg,#fff4c8,#e9c978);box-shadow:0 8px 18px rgba(91,122,66,.2);font-family:Cinzel,serif;font-weight:700;color:#31502f;letter-spacing:.04em}button.chip{width:100%;font-size:1rem}.motifs{position:absolute;inset:0;pointer-events:none;overflow:hidden}.motifs span{position:absolute;font-size:clamp(1.2rem,5vw,2rem);opacity:.48;animation:drift 6s ease-in-out infinite}.motifs span:nth-child(1){left:9%;top:17%}.motifs span:nth-child(2){right:10%;top:22%;animation-delay:-2s}.motifs span:nth-child(3){left:14%;bottom:18%;animation-delay:-3s}.motifs span:nth-child(4){right:13%;bottom:20%;animation-delay:-4s}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.hud{background:rgba(255,241,201,.9);border:2px solid rgba(88,111,67,.48);border-radius:18px;padding:9px 11px;box-shadow:0 8px 22px rgba(55,74,44,.16);font-family:Cinzel,serif;font-size:clamp(.75rem,3.4vw,.95rem);line-height:1.1;color:#32482e;letter-spacing:.04em}.hud small{display:block;font-family:Rajdhani,sans-serif;font-weight:600;text-transform:uppercase;color:#69724e;font-size:.68em}.hint{text-align:right;max-width:42vw}.hint b{color:#9d6741}#end h2{font-family:Cinzel,serif;margin:.15rem 0 .5rem;font-size:clamp(1.55rem,7vw,2.35rem);color:#3f663e}.result{font-size:clamp(1rem,4.2vw,1.35rem);font-weight:600;margin-bottom:14px}.result b{color:#a96d28}@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}@keyframes drift{50%{transform:translateY(-15px) rotate(7deg);opacity:.75}}
</style></head><body><canvas id="game"></canvas><div id="ui"><section id="start" class="tap"><div class="motifs"><span>🍃</span><span>✨</span><span>🌙</span><span>🌱</span></div><div class="card"><div class="crest"></div><h1>Moonseed<br>Grove</h1><p>Guide a shy moonseed through hanging vine-charms into the forest spirit’s tea bowl.</p><div class="chip">Swipe through vines to begin</div></div></section><div id="hud" class="hidden"><div class="hud"><small>Dew charms</small><span id="score">0</span></div><div class="hud hint"><small>Gesture</small><b>slice vines</b></div></div><section id="end" class="hidden tap"><div class="card"><div class="crest"></div><h2 id="endTitle">The spirit smiles</h2><div class="result">Dew gathered: <b id="finalScore">0</b></div><button id="restart" class="chip tap">Wander again</button></div></section></div><audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" preload="auto" loop></audio><audio id="pick" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio><audio id="cut" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_character_01.mp3" preload="auto"></audio><audio id="win" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio><audio id="fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio><script>
const CFG={gravity:.5,friction:.99,ropeStiffness:5};window.gameConfigDefs={gravity:{type:'number',label:'Gravity',value:.5,min:.1,max:1.5},friction:{type:'number',label:'Air Resistance',value:.99,min:.9,max:.999},ropeStiffness:{type:'number',label:'Vine Stiffness',value:5,min:1,max:20}};window.gameConfig={...CFG};window.updateGameConfig=(k,v)=>{if(k in gameConfig)gameConfig[k]=v};
class AudioBus{constructor(){this.ready=false;this.ctx=null;this.el={bgm:bgm,pick:pick,cut:cut,win:win,fail:fail}}unlock(){if(this.ready)return;this.ready=true;this.ctx=new (AudioContext||webkitAudioContext)();this.el.bgm.volume=.18;this.el.bgm.play().catch(()=>{})}play(n){try{let e=this.el[n];e.currentTime=0;e.volume=n=='cut'?.22:.34;e.play().catch(()=>this.tone(n))}catch(_){this.tone(n)}}tone(n){if(!this.ctx)return;let o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.connect(g);g.connect(this.ctx.destination);o.type=n=='fail'?'sawtooth':'sine';o.frequency.setValueAtTime(n=='cut'?620:n=='pick'?1180:n=='win'?660:160,t);o.frequency.exponentialRampToValueAtTime(n=='fail'?55:n=='win'?990:1500,t+.18);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24)}pause(){this.el.bgm.pause()}}
class VPoint{constructor(x,y,p=false){this.x=x;this.y=y;this.oldx=x;this.oldy=y;this.pinned=p}update(dt,g,f){if(this.pinned)return;let vx=(this.x-this.oldx)*f,vy=(this.y-this.oldy)*f;this.oldx=this.x;this.oldy=this.y;this.x+=vx;this.y+=vy+g*dt}}
class VStick{constructor(a,b,l){this.p1=a;this.p2=b;this.length=l||Math.hypot(b.x-a.x,b.y-a.y);this.active=true;this.width=4}update(){if(!this.active)return;let dx=this.p2.x-this.p1.x,dy=this.p2.y-this.p1.y,d=Math.hypot(dx,dy)||.0001,q=(this.length-d)/d/2,ox=dx*q,oy=dy*q;if(!this.p1.pinned){this.p1.x-=ox;this.p1.y-=oy}if(!this.p2.pinned){this.p2.x+=ox;this.p2.y+=oy}}draw(c){if(!this.active)return;c.save();c.lineCap='round';c.shadowBlur=10;c.shadowColor='rgba(255,245,182,.45)';c.strokeStyle='rgba(255,249,210,.85)';c.lineWidth=7;c.beginPath();c.moveTo(this.p1.x,this.p1.y);c.lineTo(this.p2.x,this.p2.y);c.stroke();c.shadowBlur=0;c.strokeStyle='#6f8f53';c.lineWidth=4;c.stroke();c.strokeStyle='#d5b364';c.lineWidth=1.4;c.stroke();c.restore()}}
class Game{constructor(){this.cv=game;this.c=game.getContext('2d');this.audio=new AudioBus();this.dpr=Math.min(devicePixelRatio||1,2);this.state='START';this.points=[];this.sticks=[];this.stars=[];this.parts=[];this.trail=[];this.score=0;this.shake=0;this.resize();addEventListener('resize',()=>this.resize());this.bind();this.createLevel(true);requestAnimationFrame(t=>this.loop(t))}resize(){this.w=innerWidth;this.h=innerHeight;this.cv.width=this.w*this.dpr;this.cv.height=this.h*this.dpr;this.c.setTransform(this.dpr,0,0,this.dpr,0,0)}bind(){document.body.addEventListener('pointerdown',e=>this.down(e),{passive:false});document.body.addEventListener('pointermove',e=>this.move(e),{passive:false});document.body.addEventListener('pointerup',()=>this.up(),{passive:false});document.body.addEventListener('pointercancel',()=>this.up(),{passive:false});restart.onclick=e=>{e.stopPropagation();this.startLevel()}}startGame(){if(this.state=='PLAYING')return;this.audio.unlock();start.classList.add('hidden');end.classList.add('hidden');hud.classList.remove('hidden');this.score=0;this.setScore(0);this.startLevel()}startLevel(){this.audio.unlock();this.state='PLAYING';end.classList.add('hidden');hud.classList.remove('hidden');this.createLevel(false)}createLevel(demo=false){this.points=[];this.sticks=[];this.stars=[];this.parts=[];this.trail=[];let cx=this.w/2,sy=this.h*.3;this.seed=new VPoint(cx,sy);this.points.push(this.seed);let rc=demo?1:1+Math.floor(Math.random()*2);for(let i=0;i<rc;i++){let px=cx+(Math.random()-.5)*(this.w*.8),py=this.h*.1+Math.random()*50,peg=new VPoint(px,py,true);this.points.push(peg);let dist=Math.hypot(cx-px,sy-py),segs=Math.max(5,Math.floor(dist/20)),prev=peg;for(let j=1;j<=segs;j++){let p;if(j==segs)p=this.seed;else{let q=j/segs;p=new VPoint(px+(cx-px)*q,py+(sy-py)*q);this.points.push(p)}this.sticks.push(new VStick(prev,p));prev=p}}this.goal={x:cx+(Math.random()-.5)*(this.w*.6),y:demo?this.h+200:this.h-80,r:40};if(!demo)for(let i=0;i<3;i++)this.stars.push({x:cx+(Math.random()-.5)*(this.w*.7),y:this.h*.4+Math.random()*(this.h*.4),collected:false,rot:Math.random()*6})}down(e){if(e.target.id=='restart')return;if(this.state!='PLAYING'){e.preventDefault();this.startGame();return}e.preventDefault();this.audio.unlock();this.cutting=true;this.trail=[this.pos(e)]}move(e){if(!this.cutting||this.state!='PLAYING')return;e.preventDefault();let p=this.pos(e),l=this.trail[this.trail.length-1];if(l)this.checkCut(l.x,l.y,p.x,p.y);this.trail.push(p);if(this.trail.length>10)this.trail.shift()}up(){this.cutting=false;this.trail=[]}pos(e){let r=this.cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}checkCut(x1,y1,x2,y2){for(let i=this.sticks.length-1;i>=0;i--){let s=this.sticks[i];if(s.active&&this.inter(x1,y1,x2,y2,s.p1.x,s.p1.y,s.p2.x,s.p2.y)){s.active=false;this.shake=5;this.audio.play('cut');this.burst((s.p1.x+s.p2.x)/2,(s.p1.y+s.p2.y)/2,8,['#f7e8a7','#9fc878','#fff'])}}}inter(a,b,c,d,e,f,g,h){let s1x=c-a,s1y=d-b,s2x=g-e,s2y=h-f,den=-s2x*s1y+s1x*s2y;if(!den)return false;let s=(-s1y*(a-e)+s1x*(b-f))/den,t=(s2x*(b-f)-s2y*(a-e))/den;return s>=0&&s<=1&&t>=0&&t<=1}burst(x,y,n,cs){for(let i=0;i<n;i++)this.parts.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*10,life:1+Math.random()*.5,c:cs[i%cs.length],r:2+Math.random()*3})}setScore(v){this.score+=v;score.textContent=this.score}endGame(w){this.state=w?'WIN':'GAMEOVER';this.audio.pause();this.audio.play(w?'win':'fail');if(w)this.burst(this.goal.x,this.goal.y,56,['#fff3b1','#b8d49b','#e7b85b','#fff']);endTitle.textContent=w?'The spirit smiles':'The seed drifted away';restart.textContent=w?'Wander again':'Call another seed';finalScore.textContent=this.score;setTimeout(()=>end.classList.remove('hidden'),850)}update(dt){this.points.forEach(p=>p.update(dt,gameConfig.gravity,gameConfig.friction));for(let k=0;k<gameConfig.ropeStiffness;k++)this.sticks.forEach(s=>s.update());if(this.state=='PLAYING'){this.stars.forEach(s=>{if(!s.collected&&Math.hypot(this.seed.x-s.x,this.seed.y-s.y)<40){s.collected=true;this.setScore(100);this.audio.play('pick');this.burst(s.x,s.y,12,['#fff4b4','#d7836b','#b8d49b'])}});if(Math.hypot(this.seed.x-this.goal.x,this.seed.y-this.goal.y)<this.goal.r+15)this.endGame(true);if(this.seed.y>this.h+100||this.seed.x<-100||this.seed.x>this.w+100)this.endGame(false)}for(let i=this.parts.length-1;i>=0;i--){let p=this.parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.02;if(p.life<=0)this.parts.splice(i,1)}this.shake=this.shake>.5?this.shake*.9:0}bg(c){let phase=Math.min(4,Math.floor(this.score/100)),p=[['#bcdcca','#e2edbd','#f3d599'],['#a9d0c1','#dce8b0','#eccb87'],['#9cc6c6','#cfe0ad','#e9bc7b'],['#86acbe','#b7d09b','#d7a66d'],['#718fae','#a8bf86','#c8915e']][phase],g=c.createLinearGradient(0,0,0,this.h);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);c.fillStyle=g;c.fillRect(0,0,this.w,this.h);let now=performance.now();c.save();c.globalAlpha=.42;for(let i=0;i<22;i++){let x=this.w*((i*37)%100)/100+Math.sin(now*.00022+i)*18,y=this.h*(.14+(i%7)*.085)+Math.cos(now*.0003+i)*7;c.fillStyle=i%3?'rgba(255,246,204,.55)':'rgba(255,255,255,.45)';c.beginPath();c.ellipse(x,y,3+i%4,8+i%5,Math.sin(i),0,7);c.fill()}c.restore();for(let l=0;l<3;l++){c.fillStyle=["rgba(68,103,61,.28)","rgba(50,83,53,.38)","rgba(35,67,49,.55)"][l];let base=this.h*(.74+l*.065);c.beginPath();c.moveTo(0,this.h);for(let x=-20;x<=this.w+20;x+=28){let y=base+Math.sin(x*.018+now*.00025+l)*18-l*18;c.quadraticCurveTo(x+14,y-42,x+28,y)}c.lineTo(this.w,this.h);c.fill()}for(let i=0;i<7;i++){let x=this.w*(-.05+i*.18)+Math.sin(now*.00018+i)*8,base=this.h*.88;c.fillStyle='rgba(59,83,47,.52)';c.fillRect(x+15,base-86,13,86);c.beginPath();c.fillStyle='rgba(82,123,64,.55)';c.ellipse(x+21,base-104,42,72,Math.sin(i)*.25,0,7);c.fill()}}drawGoal(c){if(!this.goal||this.state=='START')return;let g=this.goal,b=Math.sin(performance.now()*.004)*2;c.save();c.translate(g.x,g.y+b);c.shadowBlur=18;c.shadowColor='rgba(255,238,166,.45)';let gr=c.createLinearGradient(0,-35,0,40);gr.addColorStop(0,'#f7d78b');gr.addColorStop(.45,'#8fb96f');gr.addColorStop(1,'#45683d');c.fillStyle=gr;c.beginPath();c.ellipse(0,10,g.r*1.08,g.r*.78,0,0,7);c.fill();c.shadowBlur=0;c.strokeStyle='rgba(255,246,207,.9)';c.lineWidth=4;c.stroke();c.fillStyle='#2d4d32';c.beginPath();c.ellipse(0,-7,g.r*.72,12,0,0,7);c.fill();c.strokeStyle='#6b4a2a';c.lineWidth=3;c.beginPath();c.moveTo(-30,-25);c.quadraticCurveTo(-8,-43,13,-28);c.quadraticCurveTo(26,-18,36,-27);c.stroke();c.restore()}drawSeed(c){if(!this.seed)return;c.save();c.translate(this.seed.x,this.seed.y);c.rotate((this.seed.x-this.seed.oldx)*.08);let flap=Math.sin(performance.now()*.012)*4;c.fillStyle='rgba(242,252,214,.92)';c.strokeStyle='rgba(97,128,75,.7)';c.lineWidth=1.5;[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*14,-3);c.quadraticCurveTo(s*34,-18-flap,s*48,-2);c.quadraticCurveTo(s*33,12+flap,s*14,8);c.closePath();c.fill();c.stroke()});let rg=c.createRadialGradient(-5,-6,2,0,0,19);rg.addColorStop(0,'#fff8c9');rg.addColorStop(.45,'#e7b85b');rg.addColorStop(1,'#a86d2c');c.fillStyle=rg;c.shadowBlur=16;c.shadowColor='rgba(255,238,166,.55)';c.beginPath();c.arc(0,0,19,0,7);c.fill();c.shadowBlur=0;c.strokeStyle='rgba(255,255,255,.58)';c.lineWidth=3;c.beginPath();c.arc(1,1,11,0,4.9);c.stroke();c.restore()}draw(){let c=this.c;this.bg(c);c.save();if(this.shake)c.translate((Math.random()-.5)*this.shake,(Math.random()-.5)*this.shake);this.drawGoal(c);this.sticks.forEach(s=>s.draw(c));this.points.forEach(p=>{if(!p.pinned)return;c.fillStyle='#6b7f4e';c.beginPath();c.arc(p.x,p.y,7,0,7);c.fill();c.strokeStyle='#fff1b5';c.lineWidth=2;c.stroke()});this.stars.forEach(s=>{if(s.collected)return;c.save();c.translate(s.x,s.y);c.rotate(s.rot+performance.now()*.002);c.fillStyle='#fff0a8';c.shadowBlur=12;c.shadowColor='#fff0a8';c.beginPath();for(let i=0;i<6;i++){c.lineTo(Math.cos(i*Math.PI/3)*18,Math.sin(i*Math.PI/3)*18);c.lineTo(Math.cos(i*Math.PI/3+Math.PI/6)*8,Math.sin(i*Math.PI/3+Math.PI/6)*8)}c.closePath();c.fill();c.shadowBlur=0;c.strokeStyle='#d7836b';c.lineWidth=2;c.stroke();c.restore()});this.drawSeed(c);this.parts.forEach(p=>{c.globalAlpha=Math.max(0,p.life);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1});if(this.trail.length>1){c.beginPath();c.moveTo(this.trail[0].x,this.trail[0].y);for(let i=1;i<this.trail.length;i++)c.lineTo(this.trail[i].x,this.trail[i].y);c.strokeStyle='rgba(255,248,195,.92)';c.lineWidth=5;c.shadowBlur=12;c.shadowColor='#fff2a6';c.stroke();c.shadowBlur=0}c.restore()}loop(ts){let dt=Math.min((ts-(this.last||ts))/16.67,2);this.last=ts;try{this.update(dt);this.draw()}catch(e){console.error(e)}requestAnimationFrame(t=>this.loop(t))}}
addEventListener('DOMContentLoaded',()=>{window.game=new Game()});
</script></body></html>
