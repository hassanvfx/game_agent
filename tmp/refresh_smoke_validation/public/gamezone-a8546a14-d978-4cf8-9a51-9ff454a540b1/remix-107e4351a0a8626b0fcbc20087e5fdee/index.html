<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Castle Charm Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#121028; --violet:#2b1f4b; --plum:#4b2148; --parchment:#f5e5bd; --gold:#d9b85f;
  --amber:#fff0a4; --red:#7e2636; --green:#1f6a4b; --blue:#244b79; --ink:#2a1a10;
  --panel:rgba(245,229,189,.92); --line:rgba(217,184,95,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#120f25;color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;touch-action:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(255,240,164,.36),transparent 38%),linear-gradient(180deg,#101126,#2b1f4b 54%,#614a3b);}
#game{position:relative;width:100%;height:100%;isolation:isolate;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;position:absolute;inset:0;z-index:1}
#ui{position:absolute;inset:0;z-index:4;pointer-events:none}
#start-screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:auto;padding:clamp(14px,4vw,28px);background:linear-gradient(180deg,rgba(13,12,31,.30),rgba(43,31,75,.46) 54%,rgba(245,229,189,.76));}
.start-card{width:min(92vw,430px);border:2px solid var(--line);border-radius:28px;padding:22px 18px 18px;background:linear-gradient(180deg,rgba(245,229,189,.96),rgba(218,188,114,.84));box-shadow:0 24px 70px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.8);position:relative;overflow:hidden}
.start-card:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent,rgba(126,38,54,.16),transparent,rgba(31,106,75,.18),transparent);animation:slowspin 16s linear infinite;}
.start-inner{position:relative;z-index:1}.crest{width:74px;height:74px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--amber);background:conic-gradient(#7e2636,#d9b85f,#1f6a4b,#244b79,#7e2636);box-shadow:0 0 24px rgba(255,240,164,.72);display:grid;place-items:center;color:#fff;font-size:36px;text-shadow:0 2px 4px #000}
h1{font-family:Cinzel,Georgia,serif;margin:0;color:#3a2115;font-size:clamp(2rem,9vw,3.4rem);line-height:.96;letter-spacing:.06em;text-shadow:0 2px 0 rgba(255,255,255,.58)}
.subtitle{margin:10px auto 14px;max-width:31ch;font-size:clamp(1rem,4vw,1.22rem);font-weight:600;line-height:1.18;color:#4b3218}.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border:0;border-radius:999px;background:linear-gradient(180deg,#fff0a4,#d9b85f);box-shadow:0 11px 22px rgba(75,33,72,.22),inset 0 1px 0 #fff;color:#2a1a10;font:700 clamp(.88rem,3.6vw,1.08rem) Cinzel,serif;letter-spacing:.05em;text-transform:uppercase;animation:breathe 2.2s ease-in-out infinite}.hint{margin:12px 0 0;font-size:.95rem;font-weight:600;color:#56361c}.float-runes{position:absolute;inset:0;pointer-events:none;overflow:hidden}.float-runes span{position:absolute;font-size:clamp(18px,6vw,32px);filter:drop-shadow(0 4px 8px rgba(255,240,164,.55));opacity:.62;animation:float 6s ease-in-out infinite}.float-runes span:nth-child(1){left:9%;top:16%;animation-delay:-1s}.float-runes span:nth-child(2){right:9%;top:23%;animation-delay:-3s}.float-runes span:nth-child(3){left:14%;bottom:18%;animation-delay:-4s}.float-runes span:nth-child(4){right:15%;bottom:16%;animation-delay:-2s}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}.hud-chip{border:2px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(245,229,189,.94),rgba(218,188,114,.82));box-shadow:0 10px 22px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.72);padding:9px 11px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(.72rem,2.8vw,.93rem);letter-spacing:.05em;line-height:1.15}.hud-chip small{display:block;font-family:Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6e4421;font-size:.72em}.hidden{display:none!important}.score{color:#7e2636}.objective{max-width:42vw;text-align:right}.objective b{color:#1f6a4b}
#feedback{position:absolute;top:84px;right:12px;z-index:5;pointer-events:none}.feedback-gif{width:clamp(74px,22vw,118px);border-radius:18px;border:2px solid rgba(255,255,255,.8);box-shadow:0 12px 28px rgba(0,0,0,.24);background:rgba(245,229,189,.5);animation:pop .22s ease-out}
#game-over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,12,37,.38);backdrop-filter:blur(5px);pointer-events:auto;padding:18px}.result{width:min(88vw,390px);border:2px solid var(--line);border-radius:28px;padding:22px 18px;text-align:center;background:linear-gradient(180deg,rgba(245,229,189,.96),rgba(218,188,114,.88));box-shadow:0 24px 70px rgba(0,0,0,.35)}#result-title{font-family:Cinzel,Georgia,serif;margin:0 0 8px;font-size:clamp(1.55rem,6vw,2.25rem);letter-spacing:.06em}.win{color:#1f6a4b}.fail{color:#7e2636}.result p{margin:0 0 16px;font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}#restart{width:100%;min-height:54px;border:0;border-radius:999px;background:linear-gradient(180deg,#2d9064,#1f6a4b);color:white;font:700 1rem Cinzel,serif;letter-spacing:.06em;box-shadow:0 12px 22px rgba(31,106,75,.32)}#restart:active{transform:translateY(1px) scale(.99)}
@keyframes breathe{50%{transform:scale(1.035)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-16px) rotate(8deg)}}@keyframes slowspin{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.82)}to{opacity:1;transform:none}}
@media (min-aspect-ratio: 9/14){.start-card{max-width:380px;padding:18px 16px}.crest{width:60px;height:60px;font-size:30px}.subtitle{margin:8px auto 10px}.cta,#restart{min-height:48px}}
</style>
</head>
<body>
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/mystical_bgm_01.mp3" preload="auto" loop></audio>
<audio id="sfx-cut" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_enemy_01.mp3" preload="auto"></audio>
<audio id="sfx-pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_item_01.mp3" preload="auto"></audio>
<audio id="sfx-win" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_npc_01.mp3" preload="auto"></audio>
<audio id="sfx-fail" src="https://gamezone-virid.vercel.app/assets/audios/sfx/mystical_defeat_01.mp3" preload="auto"></audio>
<div id="game">
  <canvas id="gameCanvas" aria-label="Castle Charm Drop playfield"></canvas>
  <div id="ui">
    <div id="hud" class="hidden">
      <div class="hud-chip"><small>House Points</small><span id="score" class="score">0</span></div>
      <div class="hud-chip objective"><small>Lesson</small><b>Cut bindings</b><br>guide the owl-orb</div>
    </div>
    <div id="feedback"></div>
    <section id="start-screen" role="button" aria-label="Start Castle Charm Drop">
      <div class="float-runes" aria-hidden="true"><span>✦</span><span>🪄</span><span>☾</span><span>✧</span></div>
      <div class="start-card"><div class="start-inner"><div class="crest" aria-hidden="true">🦉</div><h1>Castle<br>Charm Drop</h1><p class="subtitle">A chosen apprentice guides a golden familiar through spell bindings in the candlelit castle classroom.</p><button class="cta" type="button">Begin Charms Class</button><p class="hint">Tap, then swipe through glowing bindings.</p></div></div>
    </section>
    <section id="game-over" class="hidden" aria-live="polite">
      <div class="result"><h2 id="result-title">Charm Complete</h2><p>House Points Earned: <span id="finalScore">0</span></p><button id="restart" type="button">Cast Again</button></div>
    </section>
  </div>
</div>
<script>
const CONFIG={gravity:.5,friction:.99,ropeStiffness:5};
window.gameConfigDefs={gravity:{type:'number',label:'Gravity',value:.5,min:.1,max:1.5},friction:{type:'number',label:'Air Resistance',value:.99,min:.9,max:.999},ropeStiffness:{type:'number',label:'Binding Stiffness',value:5,min:1,max:20}};
window.gameConfig={...CONFIG}; window.updateGameConfig=(k,v)=>{if(k in window.gameConfig)window.gameConfig[k]=v};
class AudioManager{constructor(){this.ctx=null;this.unlocked=false;this.last={};this.bgm=document.getElementById('bgm');this.bgm.volume=.18;['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>this.unlock(),{once:false,passive:true}))}unlock(){if(this.unlocked)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();this.ctx.resume();this.unlocked=true;this.bgm.play().catch(()=>{});}catch(e){}}play(id,cool=80){const n=performance.now();if(this.last[id]&&n-this.last[id]<cool)return;this.last[id]=n;const el=document.getElementById('sfx-'+id);if(el){try{el.currentTime=0;el.volume=.28;el.play().catch(()=>this.synth(id));return;}catch(e){}}this.synth(id)}pause(){this.bgm.pause()}resume(){if(this.unlocked)this.bgm.play().catch(()=>{})}synth(id){try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();const o=this.ctx.createOscillator(),g=this.ctx.createGain(),now=this.ctx.currentTime;o.connect(g);g.connect(this.ctx.destination);const map={cut:[900,190,.13,'triangle'],pickup:[1220,1900,.22,'sine'],win:[440,720,.55,'square'],fail:[150,48,.36,'sawtooth']};const m=map[id]||map.pickup;o.type=m[3];o.frequency.setValueAtTime(m[0],now);o.frequency.linearRampToValueAtTime(m[1],now+m[2]);g.gain.setValueAtTime(.18,now);g.gain.linearRampToValueAtTime(.001,now+m[2]);o.start(now);o.stop(now+m[2]);}catch(e){}}}
class VPoint{constructor(x,y,pinned=false){this.x=x;this.y=y;this.oldx=x;this.oldy=y;this.pinned=pinned}update(dt,g,f){if(this.pinned)return;const vx=(this.x-this.oldx)*f,vy=(this.y-this.oldy)*f;this.oldx=this.x;this.oldy=this.y;this.x+=vx;this.y+=vy+g*dt}}
class VStick{constructor(p1,p2,len){this.p1=p1;this.p2=p2;this.length=len||Math.hypot(p2.x-p1.x,p2.y-p1.y);this.active=true;this.width=4;this.color='#d9b85f'}update(){if(!this.active)return;const dx=this.p2.x-this.p1.x,dy=this.p2.y-this.p1.y,dist=Math.hypot(dx,dy)||.0001,diff=this.length-dist,percent=diff/dist/2,ox=dx*percent,oy=dy*percent;if(!this.p1.pinned){this.p1.x-=ox;this.p1.y-=oy}if(!this.p2.pinned){this.p2.x+=ox;this.p2.y+=oy}}draw(ctx){if(!this.active)return;ctx.save();ctx.lineCap='round';ctx.shadowBlur=14;ctx.shadowColor='rgba(255,240,164,.65)';ctx.strokeStyle='rgba(255,245,190,.92)';ctx.lineWidth=this.width+2;ctx.beginPath();ctx.moveTo(this.p1.x,this.p1.y);ctx.lineTo(this.p2.x,this.p2.y);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=this.color;ctx.lineWidth=this.width-1;ctx.stroke();ctx.restore()}}
class Game{constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.audio=new AudioManager();this.dpr=Math.min(devicePixelRatio||1,2);this.state='START';this.points=[];this.sticks=[];this.stars=[];this.particles=[];this.trail=[];this.score=0;this.isCutting=false;this.shake=0;this.lastTime=0;this.feedbackTimer=0;this.resize();addEventListener('resize',()=>this.resize());const layer=document.getElementById('game');layer.addEventListener('pointerdown',e=>this.onDown(e),{passive:false});layer.addEventListener('pointermove',e=>this.onMove(e),{passive:false});layer.addEventListener('pointerup',e=>this.onUp(e),{passive:false});layer.addEventListener('pointercancel',e=>this.onUp(e),{passive:false});document.getElementById('restart').addEventListener('click',e=>{e.stopPropagation();this.startLevel()});this.createLevel(true);requestAnimationFrame(t=>this.loop(t))}
resize(){this.width=innerWidth;this.height=innerHeight;this.canvas.width=this.width*this.dpr;this.canvas.height=this.height*this.dpr;this.canvas.style.width=this.width+'px';this.canvas.style.height=this.height+'px';this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0)}
startGame(){if(this.state==='PLAYING')return;this.state='PLAYING';document.getElementById('start-screen').classList.add('hidden');document.getElementById('game-over').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');this.score=0;this.updateScore(0);this.audio.play('pickup',0);this.audio.resume();this.startLevel()}
startLevel(){this.state='PLAYING';document.getElementById('game-over').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');this.audio.resume();this.audio.play('pickup',0);this.createLevel(false)}
createLevel(demo=false){this.points=[];this.sticks=[];this.stars=[];this.particles=[];const cx=this.width/2,candyX=cx,candyY=this.height*.30;this.candy=new VPoint(candyX,candyY);this.points.push(this.candy);const ropes=demo?1:1+Math.floor(Math.random()*2);for(let i=0;i<ropes;i++){const pegX=cx+(Math.random()-.5)*(this.width*.8),pegY=this.height*.1+Math.random()*50,peg=new VPoint(pegX,pegY,true);this.points.push(peg);const dist=Math.hypot(candyX-pegX,candyY-pegY),segments=Math.max(5,Math.floor(dist/20));let prev=peg;for(let j=1;j<=segments;j++){let p;if(j===segments)p=this.candy;else{const t=j/segments;p=new VPoint(pegX+(candyX-pegX)*t,pegY+(candyY-pegY)*t);this.points.push(p)}this.sticks.push(new VStick(prev,p));prev=p}}
this.goal={x:cx+(Math.random()-.5)*(this.width*.6),y:this.height-82,r:40};if(demo)this.goal.y=this.height+220;if(!demo){for(let i=0;i<3;i++)this.stars.push({x:cx+(Math.random()-.5)*(this.width*.7),y:this.height*.4+Math.random()*(this.height*.38),collected:false,rot:Math.random()*6})}}
onDown(e){if(this.state==='START'){this.startGame();return}if(this.state==='GAMEOVER'||this.state==='WIN'){if(e.target.id!=='restart')this.startLevel();return}e.preventDefault();this.isCutting=true;this.trail=[];const r=this.canvas.getBoundingClientRect();this.trail.push({x:e.clientX-r.left,y:e.clientY-r.top})}
onMove(e){if(!this.isCutting||this.state!=='PLAYING')return;e.preventDefault();const r=this.canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,last=this.trail[this.trail.length-1];if(last)this.checkCut(last.x,last.y,x,y);this.trail.push({x,y});if(this.trail.length>10)this.trail.shift()}
onUp(){this.isCutting=false;this.trail=[]}
checkCut(x1,y1,x2,y2){for(let i=this.sticks.length-1;i>=0;i--){const s=this.sticks[i];if(!s.active)continue;if(this.intersect(x1,y1,x2,y2,s.p1.x,s.p1.y,s.p2.x,s.p2.y)){s.active=false;this.shake=5;this.burst((s.p1.x+s.p2.x)/2,(s.p1.y+s.p2.y)/2,9,['#fff0a4','#d9b85f','#ffffff']);this.audio.play('cut',45)}}}
intersect(p0x,p0y,p1x,p1y,p2x,p2y,p3x,p3y){const s1x=p1x-p0x,s1y=p1y-p0y,s2x=p3x-p2x,s2y=p3y-p2y,den=(-s2x*s1y+s1x*s2y);if(Math.abs(den)<.00001)return false;const s=(-s1y*(p0x-p2x)+s1x*(p0y-p2y))/den,t=(s2x*(p0y-p2y)-s2y*(p0x-p2x))/den;return s>=0&&s<=1&&t>=0&&t<=1}
burst(x,y,n,colors){for(let i=0;i<n;i++)this.particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.7)*10,life:1,color:colors[i%colors.length],r:2+Math.random()*3})}
updateScore(v){this.score+=v;document.getElementById('score').textContent=this.score}
showFeedback(kind){const box=document.getElementById('feedback');box.innerHTML='<img class="feedback-gif" alt="'+(kind==='win'?'celebration':'oops')+' reaction" src="'+(kind==='win'?'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp':'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp')+'">';clearTimeout(this.feedbackTimer);this.feedbackTimer=setTimeout(()=>box.innerHTML='',2400)}
endGame(win){if(this.state==='WIN'||this.state==='GAMEOVER')return;this.state=win?'WIN':'GAMEOVER';this.audio.pause();this.audio.play(win?'win':'fail',0);if(win)this.burst(this.goal.x,this.goal.y,55,['#fff0a4','#d9b85f','#7e2636','#1f6a4b']);this.showFeedback(win?'win':'fail');document.getElementById('result-title').textContent=win?'Charm Mastered!':'Charm Drifted Away';document.getElementById('result-title').className=win?'win':'fail';document.getElementById('restart').textContent=win?'Cast Again':'Try Again';document.getElementById('finalScore').textContent=this.score;setTimeout(()=>document.getElementById('game-over').classList.remove('hidden'),900)}
update(dt){this.points.forEach(p=>p.update(dt,window.gameConfig.gravity,window.gameConfig.friction));for(let k=0;k<window.gameConfig.ropeStiffness;k++)this.sticks.forEach(s=>s.update());if(this.state==='PLAYING'){this.stars.forEach(s=>{if(s.collected)return;const dx=this.candy.x-s.x,dy=this.candy.y-s.y;if(dx*dx+dy*dy<1600){s.collected=true;this.updateScore(100);this.audio.play('pickup',90);this.burst(s.x,s.y,8,['#fff0a4','#d9b85f','#fff'])}});const dx=this.candy.x-this.goal.x,dy=this.candy.y-this.goal.y;if(Math.hypot(dx,dy)<this.goal.r+15)this.endGame(true);if(this.candy.y>this.height+100||this.candy.x<-100||this.candy.x>this.width+100)this.endGame(false)}for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=.02;if(p.life<=0)this.particles.splice(i,1)}if(this.shake>0)this.shake*=.9;if(this.shake<.5)this.shake=0}
drawBackground(){const ctx=this.ctx,w=this.width,h=this.height,phase=Math.min(4,Math.floor(this.score/100)),pals=[['#121028','#2b1f4b','#6b4b3c'],['#11172d','#473153','#86643a'],['#0f2845','#1f6a4b','#c8a95c'],['#0c1d2f','#173c36','#5f6b62'],['#160f2b','#5b1d34','#d9b85f']],pal=pals[phase];let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,pal[0]);g.addColorStop(.56,pal[1]);g.addColorStop(1,pal[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const now=Date.now();ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#fff0a4';ctx.lineWidth=1.2;for(let i=0;i<5;i++){const x=w*(.12+i*.2)+Math.sin(now*.00025+i)*16,y=h*(.22+(i%2)*.13)+Math.cos(now*.00034+i)*9;ctx.beginPath();ctx.arc(x,y,22+i*4,0,Math.PI*2);ctx.moveTo(x-30,y);ctx.lineTo(x+30,y);ctx.moveTo(x,y-30);ctx.lineTo(x,y+30);ctx.stroke()}ctx.restore();ctx.fillStyle='rgba(10,9,28,.58)';const base=h*.84;for(let i=0;i<8;i++){const x=w*(-.06+i*.16)+Math.sin(now*.00016+i)*5,tw=30+(i%3)*8,th=78+(i%5)*20;ctx.fillRect(x,base-th,tw,th);ctx.beginPath();ctx.moveTo(x-7,base-th);ctx.lineTo(x+tw/2,base-th-40);ctx.lineTo(x+tw+7,base-th);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,240,164,.32)';ctx.fillRect(x+tw*.38,base-th+22,5,13);ctx.fillRect(x+tw*.62,base-th+48,5,10);ctx.fillStyle='rgba(10,9,28,.58)'}ctx.strokeStyle='rgba(217,184,95,.20)';ctx.lineWidth=phase>1?8:5;for(let i=0;i<4;i++){const y=h*(.36+i*.1)+Math.sin(now*.0003+i)*4;ctx.beginPath();ctx.moveTo(-30,y);ctx.lineTo(w*.82,y-75);ctx.stroke()}const banner=['#7e2636','#1f6a4b','#244b79','#d9b85f'];for(let i=0;i<4;i++){const x=w*(.18+i*.21);ctx.fillStyle=banner[i];ctx.fillRect(x-9,h*.16,18,52);ctx.beginPath();ctx.moveTo(x-9,h*.16+52);ctx.lineTo(x,h*.16+66);ctx.lineTo(x+9,h*.16+52);ctx.fill()}ctx.fillStyle='rgba(255,240,164,.62)';for(let i=0;i<15;i++){const x=(w*(.035+i*.072)+Math.sin(now*.0007+i)*9)%(w+40),y=h*(.11+(i%6)*.058)+Math.cos(now*.0008+i)*3;ctx.fillRect(x-2,y,4,16);ctx.beginPath();ctx.arc(x,y-5,4,0,Math.PI*2);ctx.fill()}}
drawGoal(){if(!this.goal||this.state==='START')return;const ctx=this.ctx,g=this.goal,bob=Math.sin(Date.now()*.004)*2;ctx.save();ctx.translate(g.x,g.y+bob);let grad=ctx.createLinearGradient(0,-g.r,0,g.r);grad.addColorStop(0,'#3f7d5d');grad.addColorStop(.75,'#17402e');grad.addColorStop(1,'#071b12');ctx.shadowBlur=18;ctx.shadowColor='rgba(31,106,75,.55)';ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,8,g.r*1.08,g.r*.82,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=4;ctx.strokeStyle='#d9b85f';ctx.stroke();ctx.fillStyle='#071b12';ctx.beginPath();const open=Math.min(18,3000/(Math.hypot(this.candy.x-g.x,this.candy.y-g.y)+1));ctx.ellipse(0,-8,g.r*.78,Math.max(10,open),0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,240,164,.66)';ctx.beginPath();ctx.ellipse(0,-10,g.r*.54,Math.max(5,open*.35),0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3218';ctx.beginPath();ctx.moveTo(-34,-28);ctx.quadraticCurveTo(-8,-49,9,-32);ctx.quadraticCurveTo(26,-18,36,-30);ctx.quadraticCurveTo(14,-19,-34,-28);ctx.fill();ctx.strokeStyle='rgba(217,184,95,.7)';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
drawStar(s){const ctx=this.ctx;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot+Date.now()*.002);ctx.shadowBlur=16;ctx.shadowColor='rgba(217,184,95,.75)';ctx.fillStyle='#d9b85f';ctx.beginPath();for(let i=0;i<5;i++){ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*20,-Math.sin((18+i*72)*Math.PI/180)*20);ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8,-Math.sin((54+i*72)*Math.PI/180)*8)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#7e2636';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.76)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();ctx.restore()}
drawOwl(){if(!this.candy)return;const ctx=this.ctx,c=this.candy,ang=(c.x-c.oldx)*.1,flap=Math.sin(Date.now()*.012)*4;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);ctx.fillStyle='#f6e8bd';ctx.strokeStyle='rgba(217,184,95,.75)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-18,-4);ctx.quadraticCurveTo(-36,-19-flap,-47,-2);ctx.quadraticCurveTo(-35,12+flap,-18,8);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(18,-4);ctx.quadraticCurveTo(36,-19-flap,47,-2);ctx.quadraticCurveTo(35,12+flap,18,8);ctx.fill();ctx.stroke();let grad=ctx.createRadialGradient(-6,-7,2,0,0,20);grad.addColorStop(0,'#fff5bd');grad.addColorStop(.45,'#d9b85f');grad.addColorStop(1,'#8b5a13');ctx.shadowBlur=18;ctx.shadowColor='rgba(255,240,164,.55)';ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(42,26,16,.72)';ctx.beginPath();ctx.arc(-7,-5,3,0,Math.PI*2);ctx.arc(7,-5,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7e2636';ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(-4,5);ctx.lineTo(4,5);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*1.45);ctx.stroke();ctx.restore()}
draw(){const ctx=this.ctx;this.drawBackground();ctx.save();if(this.shake>0)ctx.translate((Math.random()-.5)*this.shake,(Math.random()-.5)*this.shake);this.drawGoal();this.sticks.forEach(s=>s.draw(ctx));this.points.forEach(p=>{if(!p.pinned)return;ctx.fillStyle='#7e2636';ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d9b85f';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff0a4';ctx.font='10px Cinzel';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',p.x,p.y+1)});this.stars.forEach(s=>{if(!s.collected)this.drawStar(s)});this.drawOwl();this.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r||3,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(this.trail.length>1){ctx.beginPath();ctx.moveTo(this.trail[0].x,this.trail[0].y);for(let i=1;i<this.trail.length;i++)ctx.lineTo(this.trail[i].x,this.trail[i].y);ctx.strokeStyle='rgba(255,240,164,.9)';ctx.lineWidth=4;ctx.shadowBlur=12;ctx.shadowColor='#d9b85f';ctx.stroke();ctx.shadowBlur=0}ctx.restore()}
loop(t){const dt=Math.min((t-this.lastTime)/16.67,2);this.lastTime=t;try{this.update(dt);this.draw()}catch(e){console.error(e)}requestAnimationFrame(x=>this.loop(x))}}
addEventListener('DOMContentLoaded',()=>{window.game=new Game()});
</script>
