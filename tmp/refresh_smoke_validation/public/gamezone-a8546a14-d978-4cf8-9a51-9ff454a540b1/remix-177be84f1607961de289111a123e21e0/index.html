<!DOCTYPE html>
<html lang="en">
<head>

<title>Portal Candy Drop</title>
<!-- [agent-note][stage4] repaired: removed broken local Tailwind CDN path; minimal utilities below preserve existing layout/actionability. -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-cream: #071119;
        --bg-peach: #111533;
        --bg-strawberry: #6B2DD7;
        --panel: rgba(8, 18, 28, 0.78);
        --panel-border: rgba(83, 255, 119, 0.42);
        --ink: #D8FFE2;
        --ink-deep: #F1FFF5;
        --berry: #53FF77;
        --berry-dark: #17D35F;
        --mint: #30F2B1;
        --mint-dark: #06A86F;
        --gold: #D9FF48;
        --gold-deep: #90D61F;
        --portal-purple: #8B5CF6;
        --void: #05070D;
        --shadow: rgba(0, 255, 120, 0.18);
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 18%, rgba(83,255,119,0.22), transparent 28%),
            radial-gradient(circle at 18% 78%, rgba(139,92,246,0.22), transparent 30%),
            linear-gradient(180deg, var(--bg-cream) 0%, #101632 52%, var(--void) 100%);
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--ink);
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 20% 25%, rgba(83, 255, 119, 0.18), transparent 20%),
            radial-gradient(circle at 80% 15%, rgba(139, 92, 246, 0.18), transparent 18%),
            radial-gradient(circle at 70% 75%, rgba(48, 242, 177, 0.13), transparent 22%);
        opacity: 0.9;
    }
    canvas { display: block; touch-action: none; }
    /* [agent-note][stage4] local utility subset replacing unavailable Tailwind runtime; do not expand into a framework. */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .top-3 { top: 0.75rem; }
    .right-3 { right: 0.75rem; }
    .top-4 { top: 1rem; }
    .left-4 { left: 1rem; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .text-center { text-align: center; }
    .transform { transform: translateZ(0); }
    .transition-all { transition-property: all; transition-duration: 150ms; transition-timing-function: ease; }
    .scale-100 { transform: scale(1); }
    .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .text-white { color: #fff; }
    .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
    .font-bold { font-weight: 700; }
    .mb-4 { margin-bottom: 1rem; }
    #ui-layer { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .glass {
        background: linear-gradient(180deg, rgba(7,17,25,0.92), rgba(15,24,48,0.84));
        backdrop-filter: blur(10px);
        border: 2px solid var(--panel-border);
        box-shadow:
            0 12px 32px rgba(0, 255, 120, 0.16),
            inset 0 1px 0 rgba(139,92,246,0.28);
    }
    #start-screen {
        background:
            linear-gradient(180deg, rgba(7,17,25,0.08), rgba(7,17,25,0.38) 70%, rgba(5,7,13,0.78)),
            radial-gradient(circle at top, rgba(83,255,119,0.22), transparent 40%);
    }
    #ui-title {
        position: absolute;
        top: 12vh;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(1.9rem, 6vw, 3.6rem);
        line-height: 1.1;
        color: var(--berry);
        letter-spacing: 0.08em;
        text-shadow:
            0 0 10px rgba(83,255,119,0.72),
            0 10px 24px rgba(48, 242, 177, 0.24);
        padding: 0 1rem;
    }
    #ui-title .title-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        background: rgba(8,18,28,0.72);
        border: 2px solid rgba(83,255,119,0.48);
        box-shadow: 0 10px 24px rgba(83,255,119,0.16);
    }
    #ui-cta {
        position: absolute;
        bottom: 10vh;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: clamp(1rem, 3.8vw, 1.35rem);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-deep);
        width: min(88vw, 24rem);
    }
    .cta-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.8rem 1rem;
        background: rgba(8,18,28,0.82);
        border: 2px solid rgba(83,255,119,0.54);
        border-radius: 999px;
        box-shadow: 0 10px 20px rgba(0, 255, 120, 0.16);
    }
    .breathing { animation: breathe 2s infinite ease-in-out; display: inline-block; }
    .sparkle-float {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .sparkle-float span {
        position: absolute;
        font-size: clamp(1rem, 3vw, 1.6rem);
        opacity: 0.5;
        animation: floatSweet 6s ease-in-out infinite;
        filter: drop-shadow(0 4px 6px rgba(255,255,255,0.45));
    }
    .sparkle-float span:nth-child(1) { left: 10%; top: 20%; animation-delay: -1s; }
    .sparkle-float span:nth-child(2) { left: 80%; top: 24%; animation-delay: -3s; }
    .sparkle-float span:nth-child(3) { left: 18%; top: 74%; animation-delay: -2.4s; }
    .sparkle-float span:nth-child(4) { left: 78%; top: 68%; animation-delay: -4.5s; }
    #hud {
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(0.78rem, 2.4vw, 0.96rem);
        line-height: 1.2;
        color: var(--ink-deep);
        padding: 0.8rem 0.95rem;
        border-radius: 1rem;
        background: rgba(8,18,28,0.78);
        border: 2px solid rgba(83,255,119,0.48);
        box-shadow: 0 8px 20px rgba(0, 255, 120, 0.16);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    #hud .hud-accent {
        color: var(--gold);
    }
    #game-over-screen {
        background: linear-gradient(180deg, rgba(5, 7, 13, 0.32), rgba(5, 7, 13, 0.58));
    }
    #game-over-panel {
        width: min(86vw, 23rem);
        padding: 1.4rem 1.2rem 1.2rem;
        border-radius: 1.6rem;
    }
    #go-title {
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: clamp(1.3rem, 4.5vw, 2rem);
        line-height: 1.2;
        margin-bottom: 1rem;
        text-shadow: 0 0 14px rgba(83,255,119,0.5);
    }
    .result-copy {
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-weight: 600;
        font-size: clamp(1rem, 4vw, 1.4rem);
        color: var(--ink);
        margin-bottom: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
    #restart-btn {
        width: 100%;
        min-height: 3.2rem;
        border: 0;
        border-radius: 999px;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: clamp(0.8rem, 3vw, 0.95rem);
        line-height: 1.2;
        background: linear-gradient(180deg, #53FF77, var(--mint-dark));
        box-shadow: 0 10px 20px rgba(0, 255, 120, 0.24);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }
    #restart-btn:hover,
    #restart-btn:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(32, 138, 82, 0.3);
        filter: brightness(1.04);
    }
    #restart-btn:active {
        transform: translateY(1px) scale(0.98);
    }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes floatSweet {
        0%, 100% { transform: translateY(0) rotate(-6deg); opacity: 0.35; }
        50% { transform: translateY(-14px) rotate(6deg); opacity: 0.75; }
    }
    .feedback-gif {
        width: clamp(72px, 22vw, 120px);
        border-radius: 1rem;
        border: 2px solid rgba(255,255,255,0.85);
        box-shadow: 0 10px 24px rgba(109, 76, 65, 0.18);
        background: rgba(255,255,255,0.5);
    }
    .gif-pop {
        animation: gifPop 220ms ease-out;
    }
    @keyframes gifPop {
        0% { transform: scale(0.82) translateY(6px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .hidden { display: none !important; }
</style>

<!-- [agent-note][visuals_unified] Rick & Morty procedural visual pass: CSS/DOM-only, pointer-events none, preserve gameplay mechanics. -->
<style id="rick-morty-visuals-unified">
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@500;700;900&display=swap');

  :root {
    --rm-space: #070912;
    --rm-space-2: #101631;
    --rm-portal: #7cff27;
    --rm-portal-2: #18f2b2;
    --rm-slime: #b9ff3d;
    --rm-cyan: #3ff7ff;
    --rm-yellow: #ffe65c;
    --rm-pink: #ff4fd8;
    --rm-danger: #ff5b54;
    --rm-panel: rgba(8, 18, 31, .78);
    --rm-panel-2: rgba(19, 39, 52, .72);
    --rm-line: rgba(124, 255, 39, .62);
    --rm-glass: rgba(255, 255, 255, .09);
    --rm-shadow: rgba(0, 0, 0, .45);
  }

  html, body {
    min-height: 100%;
    background:
      radial-gradient(circle at 22% 18%, rgba(124, 255, 39, .20), transparent 24rem),
      radial-gradient(circle at 82% 76%, rgba(63, 247, 255, .16), transparent 22rem),
      linear-gradient(160deg, var(--rm-space), #12112a 54%, #081d23);
    color: #eefcff;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    opacity: .70;
    background:
      radial-gradient(circle at 18% 18%, transparent 0 2.1rem, rgba(124, 255, 39, .35) 2.15rem 2.35rem, transparent 2.42rem),
      radial-gradient(circle at 78% 28%, transparent 0 1.25rem, rgba(63, 247, 255, .30) 1.3rem 1.5rem, transparent 1.58rem),
      radial-gradient(circle at 70% 72%, transparent 0 1.75rem, rgba(255, 230, 92, .24) 1.82rem 2rem, transparent 2.08rem),
      repeating-linear-gradient(90deg, rgba(124,255,39,.055) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(0deg, rgba(63,247,255,.045) 0 1px, transparent 1px 38px);
    animation: rmDrift 22s linear infinite;
    mix-blend-mode: screen;
  }

  body::after {
    background:
      linear-gradient(115deg, transparent 0 42%, rgba(124, 255, 39, .10) 47%, transparent 54%),
      radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.38) 100%);
    animation: rmScan 6s ease-in-out infinite alternate;
  }

  @keyframes rmDrift {
    0% { transform: translate3d(0,0,0) rotate(0deg); filter: hue-rotate(0deg); }
    50% { transform: translate3d(-18px, 12px, 0) rotate(.7deg); filter: hue-rotate(18deg); }
    100% { transform: translate3d(0,0,0) rotate(0deg); filter: hue-rotate(0deg); }
  }

  @keyframes rmScan {
    from { opacity: .45; transform: translateY(-1.5%); }
    to { opacity: .82; transform: translateY(1.5%); }
  }

  #rm-procedural-stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
    contain: layout paint style;
  }

  #rm-procedural-stage .rm-portal {
    position: absolute;
    width: clamp(120px, 30vw, 260px);
    aspect-ratio: 1;
    border-radius: 50%;
    opacity: .62;
    background:
      radial-gradient(circle, rgba(245,255,190,.85) 0 8%, rgba(124,255,39,.70) 9% 13%, transparent 14% 23%, rgba(24,242,178,.76) 24% 29%, transparent 30% 42%, rgba(124,255,39,.52) 43% 47%, transparent 48%),
      conic-gradient(from 0deg, rgba(124,255,39,.15), rgba(63,247,255,.52), rgba(255,230,92,.42), rgba(124,255,39,.15));
    box-shadow: 0 0 38px rgba(124,255,39,.34), inset 0 0 36px rgba(24,242,178,.34);
    filter: blur(.15px) saturate(1.35);
    animation: rmPortalSpin 14s linear infinite, rmPortalPulse 3.8s ease-in-out infinite;
  }

  #rm-procedural-stage .rm-portal.portal-a { left: -58px; top: 9vh; }
  #rm-procedural-stage .rm-portal.portal-b {
    right: -70px;
    bottom: 9vh;
    width: clamp(100px, 24vw, 210px);
    animation-duration: 18s, 4.6s;
    opacity: .46;
  }

  @keyframes rmPortalSpin { to { transform: rotate(360deg); } }
  @keyframes rmPortalPulse {
    0%, 100% { scale: .96; }
    50% { scale: 1.04; }
  }

  #rm-procedural-stage .rm-spaceship {
    position: absolute;
    top: 8%;
    left: 54%;
    width: 86px;
    height: 42px;
    transform: rotate(-8deg);
    border-radius: 46% 54% 45% 55% / 58% 60% 40% 42%;
    background:
      radial-gradient(circle at 30% 42%, rgba(255,255,255,.88), transparent 0 9%, transparent 10%),
      linear-gradient(180deg, #d9f8ff, #6bb5c5 54%, #36515b 55% 100%);
    border: 2px solid rgba(255,255,255,.46);
    box-shadow: 0 10px 22px rgba(0,0,0,.32), 0 0 24px rgba(63,247,255,.24);
    animation: rmShipFloat 7s ease-in-out infinite;
  }

  #rm-procedural-stage .rm-spaceship::before {
    content: "";
    position: absolute;
    left: 28px;
    top: -18px;
    width: 38px;
    height: 27px;
    border-radius: 50% 50% 42% 42%;
    background: radial-gradient(circle at 42% 38%, rgba(255,255,255,.9), rgba(120,236,255,.65) 45%, rgba(34,72,92,.62) 100%);
    border: 2px solid rgba(255,255,255,.50);
  }

  #rm-procedural-stage .rm-spaceship::after {
    content: "";
    position: absolute;
    left: 2px;
    bottom: -14px;
    width: 24px;
    height: 17px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,230,92,.95), rgba(255,91,84,.70) 45%, transparent 70%);
    filter: blur(1px);
    animation: rmThruster .45s ease-in-out infinite alternate;
  }

  @keyframes rmShipFloat {
    0%,100% { transform: translate3d(0,0,0) rotate(-8deg); }
    50% { transform: translate3d(22px,12px,0) rotate(5deg); }
  }

  @keyframes rmThruster { to { transform: scaleX(1.45); opacity: .55; } }

  #rm-procedural-stage .rm-pickle {
    position: absolute;
    right: 8%;
    top: 24%;
    width: 34px;
    height: 88px;
    border-radius: 44% 48% 45% 48%;
    background:
      radial-gradient(circle at 34% 28%, #d7ff6a 0 4px, transparent 5px),
      radial-gradient(circle at 62% 44%, #e4ff89 0 3px, transparent 4px),
      radial-gradient(circle at 42% 70%, #e4ff89 0 3px, transparent 4px),
      linear-gradient(90deg, #4f9d1f, #9deb36 52%, #3f8b1d);
    border: 2px solid rgba(11,70,20,.65);
    box-shadow: inset 4px 0 rgba(255,255,255,.22), 0 0 22px rgba(124,255,39,.25);
    animation: rmPickleWobble 5.5s ease-in-out infinite;
  }

  #rm-procedural-stage .rm-pickle::before,
  #rm-procedural-stage .rm-pickle::after {
    content: "";
    position: absolute;
    top: 25px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #101914;
    box-shadow: 0 10px 0 -1px rgba(16,25,20,.86);
  }
  #rm-procedural-stage .rm-pickle::before { left: 9px; }
  #rm-procedural-stage .rm-pickle::after { right: 9px; }

  @keyframes rmPickleWobble {
    0%,100% { transform: rotate(8deg) translateY(0); }
    50% { transform: rotate(-7deg) translateY(14px); }
  }

  #rm-procedural-stage .rm-orb {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rm-slime);
    box-shadow: 0 0 10px var(--rm-portal);
    opacity: .72;
    animation: rmOrbRise var(--d, 9s) linear infinite;
  }

  @keyframes rmOrbRise {
    from { transform: translateY(110vh) translateX(0); opacity: 0; }
    12% { opacity: .72; }
    80% { opacity: .50; }
    to { transform: translateY(-18vh) translateX(var(--x, 24px)); opacity: 0; }
  }

  body > *:not(#rm-procedural-stage) {
    position: relative;
    z-index: 2;
  }

  canvas, #game, .game, .game-container, #game-container, .board, #board, main {
    border-radius: clamp(14px, 3vw, 24px);
    box-shadow:
      0 0 0 2px rgba(124,255,39,.28),
      0 0 0 7px rgba(63,247,255,.08),
      0 22px 52px rgba(0,0,0,.42),
      inset 0 0 36px rgba(124,255,39,.08);
  }

  canvas {
    background-color: rgba(5, 10, 20, .92);
    max-width: 100%;
    touch-action: none;
  }

  h1, .title, #title {
    font-family: Bangers, Inter, system-ui, sans-serif;
    letter-spacing: .04em;
    color: #f6ff8b;
    text-shadow:
      2px 2px 0 rgba(20, 94, 64, .95),
      0 0 16px rgba(124,255,39,.55),
      0 0 30px rgba(63,247,255,.34);
  }

  h2, h3, .subtitle {
    color: #c9fff0;
    text-shadow: 0 0 12px rgba(24,242,178,.28);
  }

  button, .button, [role="button"], input[type="button"], input[type="submit"], a.button {
    min-height: 42px;
    border: 1px solid rgba(183,255,67,.72) !important;
    border-radius: 999px !important;
    color: #07130c !important;
    font-family: Inter, system-ui, sans-serif !important;
    font-weight: 900 !important;
    letter-spacing: .03em;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,.95), transparent 22%),
      linear-gradient(135deg, #dfff44, #55ff5f 42%, #1ae9dd 100%) !important;
    box-shadow:
      0 0 0 4px rgba(124,255,39,.12),
      0 10px 24px rgba(0,0,0,.28),
      inset 0 -2px 0 rgba(0,0,0,.20) !important;
    text-shadow: none !important;
    transform-origin: center;
    transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
  }

  button:hover, .button:hover, [role="button"]:hover, a.button:hover {
    filter: saturate(1.22) brightness(1.04);
    transform: translateY(-1px);
  }

  button:active, .button:active, [role="button"]:active, a.button:active {
    transform: translateY(1px) scale(.98);
  }

  .hud, #hud, .score, #score, .stats, .panel, .modal, dialog, .overlay, .menu, #menu,
  [class*="hud"], [class*="score"], [class*="panel"], [class*="modal"], [class*="menu"] {
    border-color: rgba(124,255,39,.42) !important;
    color: #eefcff;
    background:
      linear-gradient(135deg, rgba(255,255,255,.10), transparent 34%),
      repeating-linear-gradient(90deg, rgba(124,255,39,.045) 0 1px, transparent 1px 12px),
      linear-gradient(180deg, var(--rm-panel), var(--rm-panel-2)) !important;
    box-shadow:
      0 0 0 1px rgba(63,247,255,.16),
      0 14px 34px rgba(0,0,0,.30),
      inset 0 1px 0 rgba(255,255,255,.10) !important;
    backdrop-filter: blur(8px) saturate(1.2);
  }

  .score, #score, [class*="score"], .hud, #hud, [class*="hud"] {
    font-size: clamp(12px, 2.7vw, 15px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  p, li, label, .instructions, #instructions {
    color: rgba(238,252,255,.92);
  }

  .rm-badge {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    padding: .28rem .58rem;
    border-radius: 999px;
    color: #08140c;
    background: linear-gradient(135deg, var(--rm-yellow), var(--rm-slime));
    border: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 0 18px rgba(124,255,39,.28);
    font-weight: 900;
    letter-spacing: .04em;
  }

  @media (max-width: 520px) {
    body { font-size: 14px; }
    h1, .title, #title { font-size: clamp(28px, 11vw, 42px); }
    button, .button, [role="button"] {
      min-height: 44px;
      padding-left: 16px;
      padding-right: 16px;
    }
    #rm-procedural-stage .rm-spaceship { opacity: .55; transform: scale(.78) rotate(-8deg); }
    #rm-procedural-stage .rm-pickle { opacity: .50; right: 4%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>

</head>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayed = {};
        this.bgm = document.getElementById('bgm_main');
        this.bgm.volume = 0.2;

        const soundEls = {
            win: document.getElementById('sfx_win'),
            fail: document.getElementById('sfx_fail'),
            cut: document.getElementById('sfx_cut'),
            collect: document.getElementById('sfx_collect'),
            ui: document.getElementById('sfx_ui')
        };

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));

        Object.entries(soundEls).forEach(([id, el]) => {
            if (el?.src) this.loadSound(id, el.src);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.pauseBgm();
            } else if (this.unlocked) {
                this.playBgm();
            }
        });
    }

    async loadSound(id, src) {
        try {
            const url = new URL(src, window.location.href);
            if (url.origin !== window.location.origin) {
                // [agent-note][stage4] avoid reproducible CORS console errors for optional catalog audio; synth fallback preserves SFX.
                return;
            }
            const res = await fetch(url.href);
            if (!res.ok) return;
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, using synth fallback', id);
        }
    }

    async ensureReady() {
        if (this.ctx.state === 'suspended') {
            try {
                await this.ctx.resume();
            } catch (_) {}
        }
    }

    async playBgm() {
        await this.ensureReady();
        if (!this.bgm) return;
        this.bgm.currentTime = this.bgm.currentTime || 0;
        this.bgm.play().catch(() => {});
    }

    pauseBgm() {
        if (this.bgm && !this.bgm.paused) this.bgm.pause();
    }

    playSfx(id, cooldown = 80) {
        const now = performance.now();
        if (this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
        this.lastPlayed[id] = now;

        this.ensureReady();
        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = { cut: 0.35, collect: 0.32, ui: 0.24, win: 0.34, fail: 0.28 }[id] || 0.25;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'cut') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'collect' || type === 'ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(type === 'ui' ? 900 : 1200, now);
            osc.frequency.linearRampToValueAtTime(type === 'ui' ? 1200 : 1800, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.35);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    }
}

/**
 * PHYSICS ENGINE (Verlet)
 */
class VPoint {
    constructor(x, y, pinned = false) {
        this.x = x;
        this.y = y;
        this.oldx = x;
        this.oldy = y;
        this.pinned = pinned;
    }
    
    update(dt, gravity, friction) {
        if (this.pinned) return;
        const vx = (this.x - this.oldx) * friction;
        const vy = (this.y - this.oldy) * friction;
        this.oldx = this.x;
        this.oldy = this.y;
        this.x += vx;
        this.y += vy;
        this.y += gravity * dt; // Simple gravity
    }

    constrain(width, height) {
        if (this.pinned) return;
        // Simple bounds to keep things somewhat on screen if needed, 
        // but for this game we want things to fall off
    }
}

class VStick {
    constructor(p1, p2, length) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = length || Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.active = true;
        this.color = '#53FF77';
        this.width = 4;
    }

    update() {
        if (!this.active) return;
        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const dist = Math.hypot(dx, dy);
        const diff = this.length - dist;
        const percent = diff / dist / 2;
        const offsetX = dx * percent;
        const offsetY = dy * percent;

        if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
}

/**
 * GAME LOGIC
 */
const CONFIG = {
    gravity: 0.5,

    ropeStiffness: 5
};

// Global Config Hook
window.gameConfigDefs = {
    "gravity": { "type": "number", "label": "Gravity", "value": 0.5, "min": 0.1, "max": 1.5 },
    "friction": { "type": "number", "label": "Air Resistance", "value": 0.99, "min": 0.9, "max": 0.999 },
    "ropeStiffness": { "type": "number", "label": "Rope Stiffness", "value": 5, "min": 1, "max": 20 }
};
window.gameConfig = {
    gravity: 0.5,
    friction: 0.99,
    ropeStiffness: 5
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();
        
        this.state = 'START'; // START, PLAYING, GAMEOVER, WIN
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio, 2);
        
        this.points = [];
        this.sticks = [];
        this.particles = [];
        this.stars = [];
        this.candy = null;
        this.goal = null;
        
        this.score = 0;
        this.trail = [];
        this.isCutting = false;
        this.shake = 0;
        this.bgPulse = 0;
        this.feedbackTimer = 0;
        this.activeFeedback = null;
        
        this.lastTime = 0;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input
        const inputLayer = document.getElementById('game-container'); // Capture on container
        inputLayer.addEventListener('pointerdown', e => this.onPointerDown(e), { passive: false });
        inputLayer.addEventListener('pointermove', e => this.onPointerMove(e), { passive: false });
        inputLayer.addEventListener('pointerup', e => this.onPointerUp(e), { passive: false });
        inputLayer.addEventListener('pointercancel', e => this.onPointerUp(e), { passive: false });
        
        document.getElementById('restart-btn').addEventListener('click', () => this.startLevel());
        
        // Init Start Screen Sim
        this.createLevel(true);
        this.loop(0);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }

    startGame() {
        if (this.state === 'PLAYING') return;
        this.state = 'PLAYING';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.score = 0;
        this.updateScore(0);
        this.audio.playSfx('ui', 0);
        this.startLevel();
    }

    startLevel() {
        this.state = 'PLAYING';
        document.getElementById('game-over-screen').classList.add('hidden');
        this.audio.playSfx('ui', 0);
        this.createLevel(false);
    }

    createLevel(isDemo = false) {
        this.points = [];
        this.sticks = [];
        this.stars = [];
        this.particles = [];
        this.bgPulse = 0;
        
        const cx = this.width / 2;
        const cy = this.height / 2;
        
        // Create Candy
        const candyX = cx;
        const candyY = this.height * 0.3;
        this.candy = new VPoint(candyX, candyY);
        this.points.push(this.candy);
        
        // Create Ropes (1 to 3 ropes)
        const ropeCount = isDemo ? 1 : 1 + Math.floor(Math.random() * 2); 
        
        for (let i = 0; i < ropeCount; i++) {
            const pegX = cx + (Math.random() - 0.5) * (this.width * 0.8);
            const pegY = this.height * 0.1 + Math.random() * 50;
            const peg = new VPoint(pegX, pegY, true);
            this.points.push(peg);
            
            // Generate rope segments
            const dist = Math.hypot(candyX - pegX, candyY - pegY);
            const segments = Math.max(5, Math.floor(dist / 20));
            
            let prevPoint = peg;
            for (let j = 1; j <= segments; j++) {
                const t = j / segments;
                const px = pegX + (candyX - pegX) * t;
                const py = pegY + (candyY - pegY) * t;
                
                let p;
                if (j === segments) {
                    p = this.candy;
                } else {
                    p = new VPoint(px, py);
                    this.points.push(p);
                }
                
                this.sticks.push(new VStick(prevPoint, p));
                prevPoint = p;
            }
        }
        
        // Goal
        this.goal = {
            x: cx + (Math.random() - 0.5) * (this.width * 0.6),
            y: this.height - 80,
            r: 40,
            angle: 0
        };
        if (isDemo) this.goal.y = this.height + 200; // Hide goal in demo
        
        // Stars
        if (!isDemo) {
            for (let i = 0; i < 3; i++) {
                this.stars.push({
                    x: cx + (Math.random() - 0.5) * (this.width * 0.7),
                    y: this.height * 0.4 + Math.random() * (this.height * 0.4),
                    collected: false,
                    scale: 1,
                    rot: Math.random()
                });
            }
        }
    }

    onPointerDown(e) {
        if (this.state === 'START' || this.state === 'GAMEOVER') {
            if (e.target.id !== 'restart-btn') {
                this.startGame();
            }
            return;
        }
        this.isCutting = true;
        this.trail = [];
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        this.trail.push({x, y});
    }

    onPointerMove(e) {
        if (!this.isCutting || this.state !== 'PLAYING') return;
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const last = this.trail[this.trail.length - 1];
        if (last) {
            this.checkCut(last.x, last.y, x, y);
        }
        this.trail.push({x, y});
        if (this.trail.length > 10) this.trail.shift();
    }

    onPointerUp(e) {
        this.isCutting = false;
        this.trail = [];
    }

    checkCut(x1, y1, x2, y2) {
        // Line segment intersection
        for (let i = this.sticks.length - 1; i >= 0; i--) {
            const s = this.sticks[i];
            if (!s.active) continue;
            
            if (this.getLineIntersection(x1, y1, x2, y2, s.p1.x, s.p1.y, s.p2.x, s.p2.y)) {
                s.active = false;
                this.createCutParticles((s.p1.x + s.p2.x)/2, (s.p1.y + s.p2.y)/2);
                this.audio.playSfx('cut', 45);
                // Small shake
                this.shake = 5;
            }
        }
    }

    getLineIntersection(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
        const s1_x = p1_x - p0_x;
        const s1_y = p1_y - p0_y;
        const s2_x = p3_x - p2_x;
        const s2_y = p3_y - p2_y;
        const s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / (-s2_x * s1_y + s1_x * s2_y);
        const t = ( s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / (-s2_x * s1_y + s1_x * s2_y);
        return (s >= 0 && s <= 1 && t >= 0 && t <= 1);
    }

    createCutParticles(x, y) {
        for(let i=0; i<8; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: '#53FF77'
            });
        }
    }

    createWinParticles() {
        for(let i=0; i<50; i++) {
            this.particles.push({
                x: this.goal.x, 
                y: this.goal.y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 1) * 20,
                life: 2.0,
                color: `hsl(${Math.random()*360}, 80%, 60%)`
            });
        }
    }

    updateScore(val) {
        this.score += val;
        document.getElementById('score').innerText = this.score;
    }

    showFeedback(kind) {
        const winGif = document.getElementById('gif-win');
        const failGif = document.getElementById('gif-fail');
        const target = kind === 'win' ? winGif : failGif;
        const other = kind === 'win' ? failGif : winGif;
        other.classList.add('hidden');
        target.classList.remove('hidden');
        target.classList.remove('gif-pop');
        void target.offsetWidth;
        target.classList.add('gif-pop');
        this.activeFeedback = kind;
        clearTimeout(this.feedbackTimer);
        this.feedbackTimer = setTimeout(() => {
            target.classList.add('hidden');
            if (this.activeFeedback === kind) this.activeFeedback = null;
        }, 2400);
    }

    endGame(win) {
        this.state = win ? 'WIN' : 'GAMEOVER';
        this.audio.pauseBgm();
        
        if (win) {
            this.audio.playSfx('win', 0);
            this.createWinParticles();
            this.showFeedback('win');
            document.getElementById('go-title').innerText = "MAW FED!";
            document.getElementById('go-title').className = "text-4xl font-bold text-[#53FF77] mb-4";
            document.getElementById('restart-btn').innerText = "OPEN NEXT RIFT";
        } else {
            this.audio.playSfx('fail', 0);
            this.showFeedback('fail');
            document.getElementById('go-title').innerText = "LOST IN THE VOID!";
            document.getElementById('go-title').className = "text-4xl font-bold text-[#8B5CF6] mb-4";
            document.getElementById('restart-btn').innerText = "RECALIBRATE";
        }
        
        document.getElementById('finalScore').innerText = this.score;
        setTimeout(() => {
            document.getElementById('game-over-screen').classList.remove('hidden');
        }, 1000);
    }

    update(dt) {
        // Physics
        const steps = window.gameConfig.ropeStiffness;
        const subDt = 1; // Fixed step for stability in Verlet logic usually, but here we just iterate constraints
        
        // Update Points
        this.points.forEach(p => p.update(dt, window.gameConfig.gravity, window.gameConfig.friction));
        
        // Solve Constraints
        for (let k = 0; k < steps; k++) {
            this.sticks.forEach(s => s.update());
            // Keep candy in bounds horizontally? No, let it swing freely.
        }

        // Logic
        if (this.state === 'PLAYING') {
            // Check Stars
            this.stars.forEach(s => {
                if (s.collected) return;
                const dx = this.candy.x - s.x;
                const dy = this.candy.y - s.y;
                if (dx*dx + dy*dy < 1600) { // 40px radius
                    s.collected = true;
                    this.updateScore(100);
                    this.audio.playSfx('collect', 90);
                    // Sparkle
                    for(let i=0; i<5; i++) {
                        this.particles.push({
                            x: s.x, y: s.y,
                            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                            life: 0.5, color: '#D9FF48'
                        });
                    }
                }
            });

            // Check Win
            const dx = this.candy.x - this.goal.x;
            const dy = this.candy.y - this.goal.y;
            if (Math.hypot(dx, dy) < this.goal.r + 15) {
                this.endGame(true);
            }

            // Check Fail (Out of bounds)
            if (this.candy.y > this.height + 100 || this.candy.x < -100 || this.candy.x > this.width + 100) {
                this.endGame(false);
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life -= 0.02;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Shake decay
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;
        this.bgPulse += 0.02;
    }

    draw() {
        // Authored portal-lab background only; noninteractive and intentionally behind mechanics.
        this.ctx.fillStyle = '#071119';
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, '#071119');
        skyGrad.addColorStop(0.52, '#101632');
        skyGrad.addColorStop(1, '#05070D');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const now = Date.now();
        const portalX = this.width * 0.5;
        const portalY = this.height * 0.22;
        for(let i=0; i<5; i++) {
            const t = now * 0.0007 + i * 0.9;
            this.ctx.save();
            this.ctx.translate(portalX + Math.sin(t) * 10, portalY + Math.cos(t * 0.8) * 7);
            this.ctx.rotate(t * 0.42);
            this.ctx.strokeStyle = `rgba(${i % 2 ? '139,92,246' : '83,255,119'}, ${0.30 - i * 0.035})`;
            this.ctx.lineWidth = 7 - i * 0.7;
            this.ctx.beginPath();
            this.ctx.ellipse(0, 0, 112 + i * 24, 42 + i * 11, 0.18, 0, Math.PI * 2);
            this.ctx.stroke();
            this.ctx.restore();
        }

        this.ctx.fillStyle = 'rgba(83, 255, 119, 0.11)';
        for(let i=0; i<18; i++) {
            const t = now * 0.00035 + i * 1.7;
            this.ctx.beginPath();
            this.ctx.arc(
                (this.width * ((i * 0.173) % 1) + Math.sin(t) * 26 + this.width) % this.width,
                this.height * (0.16 + ((i * 0.097) % 0.72)) + Math.cos(t) * 12,
                2 + (i % 3), 0, Math.PI*2
            );
            this.ctx.fill();
        }

        this.ctx.fillStyle = 'rgba(8, 18, 28, 0.62)';
        this.ctx.fillRect(0, this.height - 58, this.width, 58);
        this.ctx.fillStyle = 'rgba(48, 242, 177, 0.14)';
        for (let i = 0; i < 7; i++) {
            const x = this.width * (0.08 + i * 0.15);
            const h = 28 + (i % 3) * 18;
            this.ctx.fillRect(x, this.height - 58 - h, 26, h);
            this.ctx.fillRect(x + 5, this.height - 65 - h, 16, 6);
        }

        this.ctx.save();
        if (this.shake > 0) {
            this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        }

        // Draw Goal (Monster Mouth)
        if (this.goal && this.state !== 'START') {
            const g = this.goal;
            // Body
            const bob = Math.sin(Date.now() * 0.004) * 2;
            const bodyGrad = this.ctx.createLinearGradient(g.x, g.y - g.r, g.x, g.y + g.r);
            bodyGrad.addColorStop(0, '#7BF2A7');
            bodyGrad.addColorStop(1, '#2DAE62');
            this.ctx.fillStyle = bodyGrad;
            this.ctx.beginPath();
            this.ctx.arc(g.x, g.y + bob, g.r, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(255,255,255,0.32)';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 10, g.y - 14 + bob, 12, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = 'rgba(42,117,67,0.5)';
            this.ctx.lineWidth = 3;
            this.ctx.stroke();
            // Eyes
            this.ctx.fillStyle = 'white';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 15, g.y - 10 + bob, 10, 0, Math.PI*2);
            this.ctx.arc(g.x + 15, g.y - 10 + bob, 10, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#1E1B1A';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 15 + Math.sin(Date.now()*0.005)*2, g.y - 10 + bob, 4, 0, Math.PI*2);
            this.ctx.arc(g.x + 15 + Math.sin(Date.now()*0.005)*2, g.y - 10 + bob, 4, 0, Math.PI*2);
            this.ctx.fill();
            // Brows / cheeks
            this.ctx.strokeStyle = '#208A52';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.moveTo(g.x - 25, g.y - 26 + bob);
            this.ctx.lineTo(g.x - 8, g.y - 22 + bob);
            this.ctx.moveTo(g.x + 8, g.y - 22 + bob);
            this.ctx.lineTo(g.x + 25, g.y - 26 + bob);
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255, 145, 174, 0.5)';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 23, g.y + 4 + bob, 6, 0, Math.PI * 2);
            this.ctx.arc(g.x + 23, g.y + 4 + bob, 6, 0, Math.PI * 2);
            this.ctx.fill();
            // Mouth Open
            const mouthOpen = Math.min(15, 3000 / (Math.hypot(this.candy.x - g.x, this.candy.y - g.y) + 1));
            this.ctx.fillStyle = '#3E2723';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y + 15 + bob, 15, mouthOpen, 0, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#FF8FA9';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y + 18 + bob, 10, Math.max(4, mouthOpen * 0.55), 0, 0, Math.PI);
            this.ctx.fill();
        }

        // Draw Sticks (Ropes)
        this.sticks.forEach(s => {
            if (!s.active) return;
            this.ctx.save();
            this.ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            this.ctx.lineWidth = s.width + 3;
            this.ctx.lineCap = 'round';
            this.ctx.beginPath();
            this.ctx.moveTo(s.p1.x, s.p1.y);
            this.ctx.lineTo(s.p2.x, s.p2.y);
            this.ctx.stroke();
            this.ctx.restore();
            s.draw(this.ctx);
        });

        this.points.forEach(p => {
            if (!p.pinned) return;
            this.ctx.fillStyle = '#8D6E63';
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(255,255,255,0.4)';
            this.ctx.beginPath();
            this.ctx.arc(p.x - 1.5, p.y - 1.5, 2, 0, Math.PI * 2);
            this.ctx.fill();
        });

        // Draw Stars
        this.stars.forEach(s => {
            if (s.collected) return;
            this.ctx.save();
            this.ctx.translate(s.x, s.y);
            this.ctx.rotate(s.rot + Date.now() * 0.002);
            this.ctx.scale(s.scale, s.scale);
            this.ctx.shadowBlur = 16;
            this.ctx.shadowColor = 'rgba(83, 255, 119, 0.72)';
            this.ctx.fillStyle = '#D9FF48';
            this.ctx.beginPath();
            for(let i=0; i<5; i++) {
                this.ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*20, -Math.sin((18+i*72)*Math.PI/180)*20);
                this.ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8, -Math.sin((54+i*72)*Math.PI/180)*8);
            }
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.strokeStyle = '#53FF77';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255,255,255,0.55)';
            this.ctx.beginPath();
            this.ctx.arc(-3, -5, 4, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        });

        // Draw Candy
        if (this.candy) {
            this.ctx.save();
            this.ctx.translate(this.candy.x, this.candy.y);
            // Rotate based on movement?
            const angle = (this.candy.x - this.candy.oldx) * 0.1;
            this.ctx.rotate(angle);
            
            // Candy wings
            this.ctx.fillStyle = '#8B5CF6';
            this.ctx.beginPath();
            this.ctx.moveTo(-20, -4);
            this.ctx.lineTo(-34, -12);
            this.ctx.lineTo(-38, 0);
            this.ctx.lineTo(-34, 12);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.beginPath();
            this.ctx.moveTo(20, -4);
            this.ctx.lineTo(34, -12);
            this.ctx.lineTo(38, 0);
            this.ctx.lineTo(34, 12);
            this.ctx.closePath();
            this.ctx.fill();

            // Candy Body
            const grad = this.ctx.createRadialGradient(-5, -5, 2, 0, 0, 20);
            grad.addColorStop(0, '#D9FF48');
            grad.addColorStop(0.45, '#53FF77');
            grad.addColorStop(1, '#138A48');
            this.ctx.fillStyle = grad;
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = 'rgba(83, 255, 119, 0.42)';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 20, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;

            this.ctx.fillStyle = 'rgba(255,255,255,0.24)';
            this.ctx.beginPath();
            this.ctx.arc(-6, -7, 8, 0, Math.PI * 2);
            this.ctx.fill();

            // Swirl
            this.ctx.strokeStyle = 'rgba(5,7,13,0.55)';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 12, 0, Math.PI*1.5);
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(216, 255, 226, 0.72)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(2, 1, 7, 0, Math.PI*1.2);
            this.ctx.stroke();
            
            this.ctx.restore();
        }

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;

        // Draw Trail
        if (this.trail.length > 1) {
            this.ctx.beginPath();
            this.ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for(let i=1; i<this.trail.length; i++) {
                this.ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            this.ctx.lineWidth = 4;
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = 'white';
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
        }

        this.ctx.restore();
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 16.67, 2); // Cap dt
        this.lastTime = timestamp;

        try {
            this.update(dt);
            this.draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(t => this.loop(t));
    }
}

// Init
window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});

</script>

<script id="rick-morty-procedural-layer">
(function () {
  if (document.getElementById('rm-procedural-stage')) return;
  var stage = document.createElement('div');
  stage.id = 'rm-procedural-stage';
  stage.setAttribute('aria-hidden', 'true');
  stage.innerHTML =
    '<div class="rm-portal portal-a"></div>' +
    '<div class="rm-portal portal-b"></div>' +
    '<div class="rm-spaceship"></div>' +
    '<div class="rm-pickle"></div>';
  for (var i = 0; i < 22; i += 1) {
    var orb = document.createElement('i');
    orb.className = 'rm-orb';
    orb.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    orb.style.setProperty('--d', (7 + Math.random() * 8).toFixed(2) + 's');
    orb.style.setProperty('--x', ((Math.random() * 80) - 40).toFixed(1) + 'px');
    orb.style.animationDelay = (-Math.random() * 10).toFixed(2) + 's';
    stage.appendChild(orb);
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.body.prepend(stage);
    var title = document.querySelector('h1, .title, #title');
    if (title && !title.querySelector('.rm-badge')) {
      var badge = document.createElement('span');
      badge.className = 'rm-badge';
      badge.textContent = 'Portal Run';
      badge.style.marginLeft = '.45rem';
      badge.style.fontSize = 'clamp(11px, 2.5vw, 13px)';
      title.appendChild(badge);
    }
  });
}());
</script>
