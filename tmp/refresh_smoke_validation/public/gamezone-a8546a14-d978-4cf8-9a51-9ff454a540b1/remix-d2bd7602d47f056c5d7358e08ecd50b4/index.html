<style>

        --sky-top: #78D7FF;
        --sky-mid: #BDEEFF;
        --sky-bottom: #FFF0B8;
        --cloud: #FFFFFF;
        --cloud-shadow: #DDF4FF;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-border: rgba(255, 255, 255, 0.96);
        --ink: #23405A;
        --ink-deep: #142D44;
        --berry: #FF5B8A;

        --pipe-shadow: #208A52;

    html, body {

        overflow: hidden;

            radial-gradient(circle at 50% 6%, rgba(255,255,255,0.85), transparent 26%),

    canvas { display: block; touch-action: none; }

    .absolute { position: absolute; }

<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayed = {};
        this.bgm = document.getElementById('bgm_main');
        if (this.bgm) this.bgm.volume = 0.2;

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.pauseBgm();
            } else if (this.unlocked) {
                this.playBgm();
            }
        });
    }

    async loadSound(id, src) {
        try {
            const res = await fetch(src);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, using synth fallback', id);
        }
    }

    async ensureReady() {
        if (this.ctx.state === 'suspended') {
            try {
                await this.ctx.resume();
            } catch (_) {}
        }
    }

    async playBgm() {
        await this.ensureReady();
    }

    pauseBgm() {
        if (this.bgm && !this.bgm.paused) this.bgm.pause();
    }

    playSfx(id, cooldown = 80) {
        const now = performance.now();
        if (this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
        this.lastPlayed[id] = now;

        this.ensureReady();
        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = { cut: 0.35, collect: 0.32, ui: 0.24, win: 0.34, fail: 0.28 }[id] || 0.25;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'cut') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'collect' || type === 'ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(type === 'ui' ? 900 : 1200, now);
            osc.frequency.linearRampToValueAtTime(type === 'ui' ? 1200 : 1800, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.35);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    }
}

/**
 * PHYSICS ENGINE (Verlet)
 */
class VPoint {
    constructor(x, y, pinned = false) {
        this.x = x;
        this.y = y;
        this.oldx = x;
        this.oldy = y;
        this.pinned = pinned;
    }
    
    update(dt, gravity, friction) {
        if (this.pinned) return;
        const vx = (this.x - this.oldx) * friction;
        const vy = (this.y - this.oldy) * friction;
        this.oldx = this.x;
        this.oldy = this.y;
        this.x += vx;
        this.y += vy;
        this.y += gravity * dt; // Simple gravity
    }

    constrain(width, height) {
        if (this.pinned) return;
        // Simple bounds to keep things somewhat on screen if needed, 
        // but for this game we want things to fall off
    }
}

class VStick {
    constructor(p1, p2, length) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = length || Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.active = true;
        this.color = '#7EDCF8';
        this.width = 5;
    }

    update() {
        if (!this.active) return;
        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const dist = Math.hypot(dx, dy);
        const diff = this.length - dist;
        const percent = diff / dist / 2;
        const offsetX = dx * percent;
        const offsetY = dy * percent;

        if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
}

/**
 * GAME LOGIC
 */
const CONFIG = {
    gravity: 0.5,
    friction: 0.99,
    ropeStiffness: 5
};

// Global Config Hook
window.gameConfigDefs = {
    "gravity": { "type": "number", "label": "Gravity", "value": 0.5, "min": 0.1, "max": 1.5 },
    "friction": { "type": "number", "label": "Air Resistance", "value": 0.99, "min": 0.9, "max": 0.999 },
    "ropeStiffness": { "type": "number", "label": "Rope Stiffness", "value": 5, "min": 1, "max": 20 }
};
window.gameConfig = {
    gravity: 0.5,
    friction: 0.99,
    ropeStiffness: 5
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();
        
        this.state = 'START'; // START, PLAYING, GAMEOVER, WIN
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio, 2);
        
        this.points = [];
        this.sticks = [];
        this.particles = [];
        this.stars = [];
        this.candy = null;
        this.goal = null;
        
        this.score = 0;
        this.trail = [];
        this.isCutting = false;
        this.shake = 0;
        this.bgPulse = 0;
        this.feedbackTimer = 0;
        this.activeFeedback = null;
        this.gameOverTimer = 0;
        
        this.lastTime = 0;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input
        const inputLayer = document.getElementById('game-container'); // Capture on container
        inputLayer.addEventListener('pointerdown', e => this.onPointerDown(e), { passive: false });
        inputLayer.addEventListener('pointermove', e => this.onPointerMove(e), { passive: false });
        inputLayer.addEventListener('pointerup', e => this.onPointerUp(e), { passive: false });
        inputLayer.addEventListener('pointercancel', e => this.onPointerUp(e), { passive: false });
        
        document.getElementById('restart-btn').addEventListener('click', () => this.startLevel());
        
        // Init Start Screen Sim
        this.createLevel(true);
        this.loop(0);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }

    startGame() {
        if (this.state === 'PLAYING') return;
        clearTimeout(this.gameOverTimer);
        this.state = 'PLAYING';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.score = 0;
        this.updateScore(0);
        this.audio.playSfx('ui', 0);
        this.startLevel();
    }

    startLevel() {
        clearTimeout(this.gameOverTimer);
        this.state = 'PLAYING';
        document.getElementById('game-over-screen').classList.add('hidden');
        this.audio.playSfx('ui', 0);
        this.createLevel(false);
    }

    createLevel(isDemo = false) {
        this.points = [];
        this.sticks = [];
        this.stars = [];
        this.particles = [];
        this.bgPulse = 0;
        
        const cx = this.width / 2;
        const cy = this.height / 2;
        
        // Create Candy
        const candyX = cx;
        const candyY = this.height * 0.3;
        this.candy = new VPoint(candyX, candyY);
        this.points.push(this.candy);
        
        // Create Ropes (1 to 3 ropes)
        const ropeCount = isDemo ? 1 : 1 + Math.floor(Math.random() * 2); 
        
        for (let i = 0; i < ropeCount; i++) {
            const pegX = cx + (Math.random() - 0.5) * (this.width * 0.8);
            const pegY = this.height * 0.1 + Math.random() * 50;
            const peg = new VPoint(pegX, pegY, true);
            this.points.push(peg);
            
            // Generate rope segments
            const dist = Math.hypot(candyX - pegX, candyY - pegY);
            const segments = Math.max(5, Math.floor(dist / 20));
            
            let prevPoint = peg;
            for (let j = 1; j <= segments; j++) {
                const t = j / segments;
                const px = pegX + (candyX - pegX) * t;
                const py = pegY + (candyY - pegY) * t;
                
                let p;
                if (j === segments) {
                    p = this.candy;
                } else {
                    p = new VPoint(px, py);
                    this.points.push(p);
                }
                
                this.sticks.push(new VStick(prevPoint, p));
                prevPoint = p;
            }
        }
        
        // Goal
        this.goal = {
            x: cx + (Math.random() - 0.5) * (this.width * 0.6),
            y: this.height - 80,
            r: 40,
            angle: 0
        };
        if (isDemo) this.goal.y = this.height + 200; // Hide goal in demo
        
        // Stars
        if (!isDemo) {
            for (let i = 0; i < 3; i++) {
                this.stars.push({
                    x: cx + (Math.random() - 0.5) * (this.width * 0.7),
                    y: this.height * 0.4 + Math.random() * (this.height * 0.4),
                    collected: false,
                    scale: 1,
                    rot: Math.random()
                });
            }
        }
    }

    onPointerDown(e) {
        if (this.state === 'START' || this.state === 'GAMEOVER') {
            if (e.target.id !== 'restart-btn') {
                this.startGame();
            }
            return;
        }
        this.isCutting = true;
        this.trail = [];
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        this.trail.push({x, y});
    }

    onPointerMove(e) {
        if (!this.isCutting || this.state !== 'PLAYING') return;
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const last = this.trail[this.trail.length - 1];
        if (last) {
            this.checkCut(last.x, last.y, x, y);
        }
        this.trail.push({x, y});
        if (this.trail.length > 10) this.trail.shift();
    }

    onPointerUp(e) {
        this.isCutting = false;
        this.trail = [];
    }

    checkCut(x1, y1, x2, y2) {
        // Line segment intersection
        for (let i = this.sticks.length - 1; i >= 0; i--) {
            const s = this.sticks[i];
            if (!s.active) continue;
            
            if (this.getLineIntersection(x1, y1, x2, y2, s.p1.x, s.p1.y, s.p2.x, s.p2.y)) {
                s.active = false;
                this.createCutParticles((s.p1.x + s.p2.x)/2, (s.p1.y + s.p2.y)/2);
                this.audio.playSfx('cut', 45);
                // Small shake
                this.shake = 5;
            }
        }
    }

    getLineIntersection(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
        const s1_x = p1_x - p0_x;
        const s1_y = p1_y - p0_y;
        const s2_x = p3_x - p2_x;
        const s2_y = p3_y - p2_y;
        const s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / (-s2_x * s1_y + s1_x * s2_y);
        const t = ( s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / (-s2_x * s1_y + s1_x * s2_y);
        return (s >= 0 && s <= 1 && t >= 0 && t <= 1);
    }

    createCutParticles(x, y) {
        for(let i=0; i<8; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: '#DDF4FF'
            });
        }
    }

    createWinParticles() {
        for(let i=0; i<50; i++) {
            this.particles.push({
                x: this.goal.x, 
                y: this.goal.y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 1) * 20,
                life: 2.0,
                color: Math.random() > 0.45 ? '#FFD54F' : (Math.random() > 0.5 ? '#FFFFFF' : '#FF5B8A')
            });
        }
    }

    updateScore(val) {
        this.score += val;
        document.getElementById('score').innerText = this.score;
    }

    showFeedback(kind) {
        const winGif = document.getElementById('gif-win');
        const failGif = document.getElementById('gif-fail');
        const target = kind === 'win' ? winGif : failGif;
        const other = kind === 'win' ? failGif : winGif;
        other.classList.add('hidden');
        target.classList.remove('hidden');
        target.classList.remove('gif-pop');
        void target.offsetWidth;
        target.classList.add('gif-pop');
        this.activeFeedback = kind;
        clearTimeout(this.feedbackTimer);
        this.feedbackTimer = setTimeout(() => {
            target.classList.add('hidden');
            if (this.activeFeedback === kind) this.activeFeedback = null;
        }, 2400);
    }

    endGame(win) {
        this.state = win ? 'WIN' : 'GAMEOVER';
        this.audio.pauseBgm();
        
        if (win) {
            this.audio.playSfx('win', 0);
            this.createWinParticles();
            this.showFeedback('win');
            document.getElementById('go-title').innerText = "NEST LANDED!";
            document.getElementById('go-title').className = "result-title win-title";
            document.getElementById('restart-btn').innerText = "FLY AGAIN";
        } else {
            this.audio.playSfx('fail', 0);
            this.showFeedback('fail');
            document.getElementById('go-title').innerText = "LOST IN THE CLOUDS!";
            document.getElementById('go-title').className = "result-title fail-title";
            document.getElementById('restart-btn').innerText = "TRY THE SKY AGAIN";
        }
        
        document.getElementById('finalScore').innerText = this.score;
        clearTimeout(this.gameOverTimer);
        this.gameOverTimer = setTimeout(() => {
            if (this.state === 'WIN' || this.state === 'GAMEOVER') {
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
        }, 1000);
    }

    update(dt) {
        // Physics
        const steps = window.gameConfig.ropeStiffness;
        const subDt = 1; // Fixed step for stability in Verlet logic usually, but here we just iterate constraints
        
        // Update Points
        this.points.forEach(p => p.update(dt, window.gameConfig.gravity, window.gameConfig.friction));
        
        // Solve Constraints
        for (let k = 0; k < steps; k++) {
            this.sticks.forEach(s => s.update());
            // Keep candy in bounds horizontally? No, let it swing freely.
        }

        // Logic
        if (this.state === 'PLAYING') {
            // Check Stars
            this.stars.forEach(s => {
                if (s.collected) return;
                const dx = this.candy.x - s.x;
                const dy = this.candy.y - s.y;
                if (dx*dx + dy*dy < 1600) { // 40px radius
                    s.collected = true;
                    this.updateScore(100);
                    this.audio.playSfx('collect', 90);
                    // Sparkle
                    for(let i=0; i<5; i++) {
                        this.particles.push({
                            x: s.x, y: s.y,
                            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                            life: 0.5, color: '#FFD700'
                        });
                    }
                }
            });

            // Check Win
            const dx = this.candy.x - this.goal.x;
            const dy = this.candy.y - this.goal.y;
            if (Math.hypot(dx, dy) < this.goal.r + 15) {
                this.endGame(true);
            }

            // Check Fail (Out of bounds)
            if (this.candy.y > this.height + 100 || this.candy.x < -100 || this.candy.x > this.width + 100) {
                this.endGame(false);
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life -= 0.02;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Shake decay
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;
        this.bgPulse += 0.02;
    }

    draw() {
        // Procedural Flappy Candy sky: animated clouds, faded pipe-gates, and warm flight route.
        const phase = (this.score >= 300 ? 4 : this.score >= 200 ? 3 : this.score >= 100 ? 2 : 1);
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, phase >= 4 ? '#29345F' : '#78D7FF');
        skyGrad.addColorStop(0.48, phase >= 3 ? '#FFDCA4' : '#BDEEFF');
        skyGrad.addColorStop(1, phase >= 4 ? '#FFB547' : '#FFF0B8');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const now = Date.now() * 0.001;
        this.ctx.fillStyle = phase >= 4 ? 'rgba(255, 213, 79, 0.18)' : 'rgba(255,255,255,0.24)';
        this.ctx.beginPath();
        this.ctx.arc(this.width * 0.78, this.height * 0.16, 46 + Math.sin(now) * 2, 0, Math.PI * 2);
        this.ctx.fill();

        // Faded pipe silhouettes are scenery only; they do not affect collision.
        for (let i = 0; i < 4; i++) {
            const px = ((this.width * (0.08 + i * 0.31)) + Math.sin(now * 0.28 + i) * 18) % (this.width + 80) - 40;
            const topH = this.height * (0.18 + (i % 2) * 0.08);
            this.ctx.fillStyle = 'rgba(32, 138, 82, 0.10)';
            this.ctx.fillRect(px, 0, 54, topH);
            this.ctx.fillRect(px - 8, topH - 16, 70, 16);
            this.ctx.fillRect(px, this.height - topH * 0.72, 54, topH);
            this.ctx.fillRect(px - 8, this.height - topH * 0.72, 70, 16);
        }

        for (let i = 0; i < 7; i++) {
            const cloudX = (this.width * (0.08 + i * 0.17) + Math.sin(now * 0.18 + i) * 22) % (this.width + 150) - 60;
            const cloudY = this.height * (0.10 + (i % 4) * 0.075);
            this.ctx.fillStyle = 'rgba(255,255,255,0.58)';
            this.ctx.beginPath();
            this.ctx.ellipse(cloudX, cloudY + 9, 30, 16, 0, 0, Math.PI * 2);
            this.ctx.arc(cloudX + 24, cloudY, 22, 0, Math.PI * 2);
            this.ctx.arc(cloudX + 50, cloudY + 8, 25, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(221,244,255,0.38)';
            this.ctx.beginPath();
            this.ctx.ellipse(cloudX + 28, cloudY + 18, 38, 9, 0, 0, Math.PI * 2);
            this.ctx.fill();
        }

        this.ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        this.ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
            const gy = this.height * (0.34 + i * 0.11) + Math.sin(now * 0.45 + i) * 8;
            this.ctx.beginPath();
            this.ctx.moveTo(-20, gy);
            this.ctx.bezierCurveTo(this.width * 0.28, gy - 24, this.width * 0.62, gy + 26, this.width + 20, gy - 6);
            this.ctx.stroke();
        }

        this.ctx.save();
        if (this.shake > 0) {
            this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        }

        // Draw Goal (Monster Mouth)
        if (this.goal && this.state !== 'START') {
            const g = this.goal;
            // Friendly nest-chick landing target; circular win radius is unchanged.
            const bob = Math.sin(Date.now() * 0.004) * 2;
            this.ctx.strokeStyle = 'rgba(116, 78, 38, 0.55)';
            this.ctx.lineWidth = 5;
            for (let i = 0; i < 5; i++) {
                this.ctx.beginPath();
                this.ctx.arc(g.x, g.y + bob + 16, g.r + 7 - i * 2, Math.PI * (1.02 + i * 0.025), Math.PI * (1.98 - i * 0.025));
                this.ctx.stroke();
            }
            const bodyGrad = this.ctx.createLinearGradient(g.x, g.y - g.r, g.x, g.y + g.r);
            bodyGrad.addColorStop(0, '#7BF2A7');
            bodyGrad.addColorStop(1, '#2DAE62');
            this.ctx.fillStyle = bodyGrad;
            this.ctx.beginPath();
            this.ctx.arc(g.x, g.y + bob, g.r, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(255,255,255,0.32)';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 10, g.y - 14 + bob, 12, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = 'rgba(42,117,67,0.5)';
            this.ctx.lineWidth = 3;
            this.ctx.stroke();
            // Eyes
            this.ctx.fillStyle = 'white';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 15, g.y - 10 + bob, 10, 0, Math.PI*2);
            this.ctx.arc(g.x + 15, g.y - 10 + bob, 10, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#1E1B1A';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 15 + Math.sin(Date.now()*0.005)*2, g.y - 10 + bob, 4, 0, Math.PI*2);
            this.ctx.arc(g.x + 15 + Math.sin(Date.now()*0.005)*2, g.y - 10 + bob, 4, 0, Math.PI*2);
            this.ctx.fill();
            // Brows / cheeks
            this.ctx.strokeStyle = '#208A52';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.moveTo(g.x - 25, g.y - 26 + bob);
            this.ctx.lineTo(g.x - 8, g.y - 22 + bob);
            this.ctx.moveTo(g.x + 8, g.y - 22 + bob);
            this.ctx.lineTo(g.x + 25, g.y - 26 + bob);
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255, 145, 174, 0.5)';
            this.ctx.beginPath();
            this.ctx.arc(g.x - 23, g.y + 4 + bob, 6, 0, Math.PI * 2);
            this.ctx.arc(g.x + 23, g.y + 4 + bob, 6, 0, Math.PI * 2);
            this.ctx.fill();
            // Mouth Open
            const mouthOpen = Math.min(15, 3000 / (Math.hypot(this.candy.x - g.x, this.candy.y - g.y) + 1));
            this.ctx.fillStyle = '#3E2723';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y + 15 + bob, 15, mouthOpen, 0, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = '#FF8FA9';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y + 18 + bob, 10, Math.max(4, mouthOpen * 0.55), 0, 0, Math.PI);
            this.ctx.fill();
        }

        // Draw Sticks (Ropes)
        this.sticks.forEach(s => {
            if (!s.active) return;
            this.ctx.save();
            this.ctx.strokeStyle = 'rgba(255,255,255,0.72)';
            this.ctx.lineWidth = s.width + 5;
            this.ctx.lineCap = 'round';
            this.ctx.beginPath();
            this.ctx.moveTo(s.p1.x, s.p1.y);
            this.ctx.lineTo(s.p2.x, s.p2.y);
            this.ctx.stroke();
            this.ctx.restore();
            s.draw(this.ctx);
        });

        this.points.forEach(p => {
            if (!p.pinned) return;
            this.ctx.fillStyle = 'rgba(255,255,255,0.92)';
            this.ctx.beginPath();
            this.ctx.ellipse(p.x, p.y + 2, 10, 6, 0, 0, Math.PI * 2);
            this.ctx.arc(p.x - 5, p.y, 5, 0, Math.PI * 2);
            this.ctx.arc(p.x + 3, p.y - 2, 6, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = 'rgba(35,64,90,0.26)';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
        });

        // Draw Stars
        this.stars.forEach(s => {
            if (s.collected) return;
            this.ctx.save();
            this.ctx.translate(s.x, s.y);
            this.ctx.rotate(s.rot + Date.now() * 0.002);
            this.ctx.scale(s.scale, s.scale);
            this.ctx.shadowBlur = 16;
            this.ctx.shadowColor = 'rgba(255, 213, 79, 0.72)';
            this.ctx.fillStyle = '#FFD54F';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -23);
            this.ctx.bezierCurveTo(13, -10, 14, 9, 0, 23);
            this.ctx.bezierCurveTo(-14, 9, -13, -10, 0, -23);
            this.ctx.fill();
            this.ctx.strokeStyle = '#F9A825';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
            this.ctx.strokeStyle = 'rgba(255,255,255,0.68)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(0, -15);
            this.ctx.quadraticCurveTo(-4, -2, 0, 14);
            this.ctx.moveTo(0, -4);
            this.ctx.lineTo(8, -9);
            this.ctx.moveTo(-1, 5);
            this.ctx.lineTo(-8, 0);
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255,255,255,0.7)';
            this.ctx.beginPath();
            this.ctx.arc(-4, -8, 4, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        });

        // Draw Candy
        if (this.candy) {
            this.ctx.save();
            this.ctx.translate(this.candy.x, this.candy.y);
            // Rotate based on movement?
            const angle = (this.candy.x - this.candy.oldx) * 0.1;
            this.ctx.rotate(angle);
            
            // Flappy Candy courier wings
            const wingFlap = Math.sin(Date.now() * 0.012) * 4;
            this.ctx.fillStyle = '#FFE8F0';
            this.ctx.strokeStyle = 'rgba(35,64,90,0.2)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(-17, -5);
            this.ctx.quadraticCurveTo(-36, -20 - wingFlap, -43, -2);
            this.ctx.quadraticCurveTo(-34, 14 + wingFlap, -17, 9);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.stroke();
            this.ctx.beginPath();
            this.ctx.moveTo(17, -5);
            this.ctx.quadraticCurveTo(36, -20 - wingFlap, 43, -2);
            this.ctx.quadraticCurveTo(34, 14 + wingFlap, 17, 9);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(255,91,138,0.45)';
            this.ctx.beginPath();
            this.ctx.moveTo(-23, -2);
            this.ctx.lineTo(-35, 5);
            this.ctx.moveTo(23, -2);
            this.ctx.lineTo(35, 5);
            this.ctx.stroke();

            // Candy Body
            const grad = this.ctx.createRadialGradient(-5, -5, 2, 0, 0, 20);
            grad.addColorStop(0, '#FFB1CC');
            grad.addColorStop(0.4, '#FF5B8A');
            grad.addColorStop(1, '#C51162');
            this.ctx.fillStyle = grad;
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = 'rgba(255, 51, 102, 0.32)';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 20, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;

            this.ctx.fillStyle = '#FFD54F';
            this.ctx.beginPath();
            this.ctx.moveTo(18, -3);
            this.ctx.lineTo(31, 2);
            this.ctx.lineTo(18, 8);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.strokeStyle = 'rgba(35,64,90,0.24)';
            this.ctx.lineWidth = 1.5;
            this.ctx.stroke();

            this.ctx.fillStyle = 'rgba(255,255,255,0.24)';
            this.ctx.beginPath();
            this.ctx.arc(-6, -7, 8, 0, Math.PI * 2);
            this.ctx.fill();

            // Swirl
            this.ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 12, 0, Math.PI*1.5);
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(255, 230, 238, 0.6)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(2, 1, 7, 0, Math.PI*1.2);
            this.ctx.stroke();

            this.ctx.fillStyle = '#FFFFFF';
            this.ctx.beginPath();
            this.ctx.arc(9, -7, 5, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = '#23405A';
            this.ctx.beginPath();
            this.ctx.arc(11, -7, 2, 0, Math.PI * 2);
            this.ctx.fill();
            
            this.ctx.restore();
        }

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;

        // Draw Trail
        if (this.trail.length > 1) {
            this.ctx.beginPath();
            this.ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for(let i=1; i<this.trail.length; i++) {
                this.ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
            this.ctx.lineWidth = 5;
            this.ctx.shadowBlur = 12;
            this.ctx.shadowColor = '#DDF4FF';
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
        }

        this.ctx.restore();
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 16.67, 2); // Cap dt
        this.lastTime = timestamp;

        try {
            this.update(dt);
            this.draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(t => this.loop(t));
    }
}

// Init
window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});
