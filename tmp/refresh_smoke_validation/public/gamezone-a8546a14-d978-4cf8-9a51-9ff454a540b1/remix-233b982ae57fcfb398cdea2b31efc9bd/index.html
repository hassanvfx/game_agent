<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayed = {};
        this.bgm = document.getElementById('bgm_main');
        this.bgm.volume = 0.2;

        const soundEls = {
            win: document.getElementById('sfx_win'),
            fail: document.getElementById('sfx_fail'),
            cut: document.getElementById('sfx_cut'),
            collect: document.getElementById('sfx_collect'),
            ui: document.getElementById('sfx_ui')
        };

        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock));

        Object.entries(soundEls).forEach(([id, el]) => {
            if (el?.src) this.loadSound(id, el.src);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                this.pauseBgm();
            } else if (this.unlocked) {
                this.playBgm();
            }
        });
    }

    async loadSound(id, src) {
        try {
            const url = new URL(src, window.location.href);
            if (url.origin !== window.location.origin) {
                // [agent-note][stage4] repaired: avoid CORS-fetch console errors for approved remote audio; synth fallback preserves optional SFX.
                return;
            }
            const res = await fetch(url.href);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, using synth fallback', id);
        }
    }

    async ensureReady() {
        if (this.ctx.state === 'suspended') {
            try {
                await this.ctx.resume();
            } catch (_) {}
        }
    }

    async playBgm() {
        await this.ensureReady();
        if (!this.bgm) return;
        this.bgm.currentTime = this.bgm.currentTime || 0;
        this.bgm.play().catch(() => {});
    }

    pauseBgm() {
        if (this.bgm && !this.bgm.paused) this.bgm.pause();
    }

    playSfx(id, cooldown = 80) {
        const now = performance.now();
        if (this.lastPlayed[id] && now - this.lastPlayed[id] < cooldown) return;
        this.lastPlayed[id] = now;

        this.ensureReady();
        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = { cut: 0.35, collect: 0.32, ui: 0.24, win: 0.34, fail: 0.28 }[id] || 0.25;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'cut') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'collect' || type === 'ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(type === 'ui' ? 900 : 1200, now);
            osc.frequency.linearRampToValueAtTime(type === 'ui' ? 1200 : 1800, now + 0.1);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.35);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    }
}

/**
 * PHYSICS ENGINE (Verlet)
 */
class VPoint {
    constructor(x, y, pinned = false) {
        this.x = x;
        this.y = y;
        this.oldx = x;
        this.oldy = y;
        this.pinned = pinned;
    }
    
    update(dt, gravity, friction) {
        if (this.pinned) return;
        const vx = (this.x - this.oldx) * friction;
        const vy = (this.y - this.oldy) * friction;
        this.oldx = this.x;
        this.oldy = this.y;
        this.x += vx;
        this.y += vy;
        this.y += gravity * dt; // Simple gravity
    }

    constrain(width, height) {
        if (this.pinned) return;
        // Simple bounds to keep things somewhat on screen if needed, 
        // but for this game we want things to fall off
    }
}

class VStick {
    constructor(p1, p2, length) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = length || Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.active = true;
        this.color = '#D6B45F';
        this.width = 4;
    }

    update() {
        if (!this.active) return;
        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const dist = Math.hypot(dx, dy);
        const diff = this.length - dist;
        const percent = diff / dist / 2;
        const offsetX = dx * percent;
        const offsetY = dy * percent;

        if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255, 242, 168, 0.56)';
        ctx.strokeStyle = 'rgba(255, 242, 168, 0.9)';
        ctx.lineWidth = this.width + 1.5;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = Math.max(2, this.width - 1);
        ctx.stroke();
        ctx.restore();
    }
}

    gravity: 0.5,
    friction: 0.99,
    ropeStiffness: 5
};
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioManager();
        
        this.state = 'START'; // START, PLAYING, GAMEOVER, WIN
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio, 2);
        
        this.points = [];
        this.sticks = [];
        this.particles = [];
        this.stars = [];
        this.candy = null;
        this.goal = null;
        
        this.score = 0;
        this.trail = [];
        this.isCutting = false;
        this.shake = 0;
        this.bgPulse = 0;
        this.feedbackTimer = 0;
        this.activeFeedback = null;
        
        this.lastTime = 0;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input
        const inputLayer = document.getElementById('game-container'); // Capture on container
        inputLayer.addEventListener('pointerdown', e => this.onPointerDown(e), { passive: false });
        inputLayer.addEventListener('pointermove', e => this.onPointerMove(e), { passive: false });
        inputLayer.addEventListener('pointerup', e => this.onPointerUp(e), { passive: false });
        inputLayer.addEventListener('pointercancel', e => this.onPointerUp(e), { passive: false });
        
        document.getElementById('restart-btn').addEventListener('click', () => this.startLevel());
        
        // Init Start Screen Sim
        this.createLevel(true);
        this.loop(0);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }

    startGame() {
        if (this.state === 'PLAYING') return;
        this.state = 'PLAYING';
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        this.score = 0;
        this.updateScore(0);
        this.audio.playSfx('ui', 0);
        this.startLevel();
    }

    startLevel() {
        this.state = 'PLAYING';
        document.getElementById('game-over-screen').classList.add('hidden');
        this.audio.playSfx('ui', 0);
        this.createLevel(false);
    }

    createLevel(isDemo = false) {
        this.points = [];
        this.sticks = [];
        this.stars = [];
        this.particles = [];
        this.bgPulse = 0;
        
        const cx = this.width / 2;
        const cy = this.height / 2;
        
        // Create enchanted Snitch-like treat (mechanics preserved as candy point)
        const candyX = cx;
        const candyY = this.height * 0.3;
        this.candy = new VPoint(candyX, candyY);
        this.points.push(this.candy);
        
        // Create spell bindings (mechanics preserved as rope sticks)
        const ropeCount = isDemo ? 1 : 1 + Math.floor(Math.random() * 2); 
        
        for (let i = 0; i < ropeCount; i++) {
            const pegX = cx + (Math.random() - 0.5) * (this.width * 0.8);
            const pegY = this.height * 0.1 + Math.random() * 50;
            const peg = new VPoint(pegX, pegY, true);
            this.points.push(peg);
            
            // Generate rope segments
            const dist = Math.hypot(candyX - pegX, candyY - pegY);
            const segments = Math.max(5, Math.floor(dist / 20));
            
            let prevPoint = peg;
            for (let j = 1; j <= segments; j++) {
                const t = j / segments;
                const px = pegX + (candyX - pegX) * t;
                const py = pegY + (candyY - pegY) * t;
                
                let p;
                if (j === segments) {
                    p = this.candy;
                } else {
                    p = new VPoint(px, py);
                    this.points.push(p);
                }
                
                this.sticks.push(new VStick(prevPoint, p));
                prevPoint = p;
            }
        }
        
        // Goal
        this.goal = {
            x: cx + (Math.random() - 0.5) * (this.width * 0.6),
            y: this.height - 80,
            r: 40,
            angle: 0
        };
        if (isDemo) this.goal.y = this.height + 200; // Hide goal in demo
        
        // House-point sigils (mechanics preserved as stars)
        if (!isDemo) {
            for (let i = 0; i < 3; i++) {
                this.stars.push({
                    x: cx + (Math.random() - 0.5) * (this.width * 0.7),
                    y: this.height * 0.4 + Math.random() * (this.height * 0.4),
                    collected: false,
                    scale: 1,
                    rot: Math.random()
                });
            }
        }
    }

    onPointerDown(e) {
        if (this.state === 'START' || this.state === 'GAMEOVER') {
            if (e.target.id !== 'restart-btn') {
                this.startGame();
            }
            return;
        }
        this.isCutting = true;
        this.trail = [];
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        this.trail.push({x, y});
    }

    onPointerMove(e) {
        if (!this.isCutting || this.state !== 'PLAYING') return;
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const last = this.trail[this.trail.length - 1];
        if (last) {
            this.checkCut(last.x, last.y, x, y);
        }
        this.trail.push({x, y});
        if (this.trail.length > 10) this.trail.shift();
    }

    onPointerUp(e) {
        this.isCutting = false;
        this.trail = [];
    }

    checkCut(x1, y1, x2, y2) {
        // Line segment intersection
        for (let i = this.sticks.length - 1; i >= 0; i--) {
            const s = this.sticks[i];
            if (!s.active) continue;
            
            if (this.getLineIntersection(x1, y1, x2, y2, s.p1.x, s.p1.y, s.p2.x, s.p2.y)) {
                s.active = false;
                this.createCutParticles((s.p1.x + s.p2.x)/2, (s.p1.y + s.p2.y)/2);
                this.audio.playSfx('cut', 45);
                // Small shake
                this.shake = 5;
            }
        }
    }

    getLineIntersection(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
        const s1_x = p1_x - p0_x;
        const s1_y = p1_y - p0_y;
        const s2_x = p3_x - p2_x;
        const s2_y = p3_y - p2_y;
        const s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / (-s2_x * s1_y + s1_x * s2_y);
        const t = ( s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / (-s2_x * s1_y + s1_x * s2_y);
        return (s >= 0 && s <= 1 && t >= 0 && t <= 1);
    }

    createCutParticles(x, y) {
        for(let i=0; i<8; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: i % 2 ? '#FFF2A8' : '#D6B45F'
            });
        }
    }

    createWinParticles() {
        for(let i=0; i<50; i++) {
            this.particles.push({
                x: this.goal.x, 
                y: this.goal.y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 1) * 20,
                life: 2.0,
                color: ['#FFF2A8', '#D6B45F', '#7B1F2D', '#2F6F4E'][i % 4]
            });
        }
    }

    updateScore(val) {
        this.score += val;
        document.getElementById('score').innerText = this.score;
    }

    showFeedback(kind) {
        const winGif = document.getElementById('gif-win');
        const failGif = document.getElementById('gif-fail');
        const target = kind === 'win' ? winGif : failGif;
        const other = kind === 'win' ? failGif : winGif;
        other.classList.add('hidden');
        target.classList.remove('hidden');
        target.classList.remove('gif-pop');
        void target.offsetWidth;
        target.classList.add('gif-pop');
        this.activeFeedback = kind;
        clearTimeout(this.feedbackTimer);
        this.feedbackTimer = setTimeout(() => {
            target.classList.add('hidden');
            if (this.activeFeedback === kind) this.activeFeedback = null;
        }, 2400);
    }

    endGame(win) {
        this.state = win ? 'WIN' : 'GAMEOVER';
        this.audio.pauseBgm();
        
        if (win) {
            this.audio.playSfx('win', 0);
            this.createWinParticles();
            this.showFeedback('win');
            document.getElementById('go-title').innerText = "SPELL COMPLETE";
            document.getElementById('go-title').className = "spell-win";
            document.getElementById('restart-btn').innerText = "CAST AGAIN";
        } else {
            this.audio.playSfx('fail', 0);
            this.showFeedback('fail');
            document.getElementById('go-title').innerText = "SPELL MISSED";
            document.getElementById('go-title').className = "spell-fail";
            document.getElementById('restart-btn').innerText = "TRY AGAIN";
        }
        
        document.getElementById('finalScore').innerText = this.score;
        setTimeout(() => {
            document.getElementById('game-over-screen').classList.remove('hidden');
        }, 1000);
    }

    update(dt) {
        // Physics
        const steps = window.gameConfig.ropeStiffness;
        const subDt = 1; // Fixed step for stability in Verlet logic usually, but here we just iterate constraints
        
        // Update Points
        this.points.forEach(p => p.update(dt, window.gameConfig.gravity, window.gameConfig.friction));
        
        // Solve Constraints
        for (let k = 0; k < steps; k++) {
            this.sticks.forEach(s => s.update());
            // Keep the treat in bounds horizontally? No, let it swing freely.
        }

        // Logic
        if (this.state === 'PLAYING') {
            // Check Stars
            this.stars.forEach(s => {
                if (s.collected) return;
                const dx = this.candy.x - s.x;
                const dy = this.candy.y - s.y;
                if (dx*dx + dy*dy < 1600) { // 40px radius
                    s.collected = true;
                    this.updateScore(100);
                    this.audio.playSfx('collect', 90);
                    // Sparkle
                    for(let i=0; i<5; i++) {
                        this.particles.push({
                            x: s.x, y: s.y,
                            vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                            life: 0.5, color: '#FFD700'
                        });
                    }
                }
            });

            // Check Win
            const dx = this.candy.x - this.goal.x;
            const dy = this.candy.y - this.goal.y;
            if (Math.hypot(dx, dy) < this.goal.r + 15) {
                this.endGame(true);
            }

            // Check Fail (Out of bounds)
            if (this.candy.y > this.height + 100 || this.candy.x < -100 || this.candy.x > this.width + 100) {
                this.endGame(false);
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // gravity
            p.life -= 0.02;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Shake decay
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;
        this.bgPulse += 0.02;
    }

    draw() {
        // Clear
        this.ctx.fillStyle = '#1A1733';
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        // Authored Hogwarts procedural backdrop; decorative only, never mechanic-bearing.
        const phase = Math.min(4, Math.floor(this.score / 100));
        const phasePalettes = [
            ['#17142E', '#2D2047', '#F6E7C8'],
            ['#161729', '#312844', '#C8A45D'],
            ['#17345A', '#2F6F4E', '#E2C78B'],
            ['#0F2230', '#17402E', '#5D6F70'],
            ['#17142E', '#4B1020', '#D6B45F']
        ];
        const pal = phasePalettes[phase];
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, pal[0]);
        skyGrad.addColorStop(0.48, pal[1]);
        skyGrad.addColorStop(1, pal[2]);
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const now = Date.now();
        this.ctx.save();
        this.ctx.globalAlpha = 0.22;
        this.ctx.strokeStyle = '#FFF2A8';
        this.ctx.lineWidth = 1.2;
        for(let i=0; i<4; i++) {
            const t = now * 0.00028 + i * 1.7;
            const x = this.width * (0.18 + i * 0.22) + Math.sin(t) * 18;
            const y = this.height * (0.26 + (i % 2) * 0.16) + Math.cos(t * 0.8) * 10;
            this.ctx.beginPath();
            this.ctx.arc(x, y, 26 + i * 5, 0, Math.PI * 2);
            this.ctx.moveTo(x - 34, y);
            this.ctx.lineTo(x + 34, y);
            this.ctx.moveTo(x, y - 34);
            this.ctx.lineTo(x, y + 34);
            this.ctx.stroke();
        }
        this.ctx.restore();

        this.ctx.fillStyle = 'rgba(18, 15, 33, 0.58)';
        const baseY = this.height * 0.84;
        for (let i = 0; i < 7; i++) {
            const towerX = this.width * (-0.04 + i * 0.17) + Math.sin(now * 0.00018 + i) * 5;
            const towerH = 78 + (i % 4) * 24;
            this.ctx.fillRect(towerX, baseY - towerH, 34, towerH);
            this.ctx.beginPath();
            this.ctx.moveTo(towerX - 5, baseY - towerH);
            this.ctx.lineTo(towerX + 17, baseY - towerH - 38);
            this.ctx.lineTo(towerX + 39, baseY - towerH);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(255, 242, 168, 0.34)';
            this.ctx.fillRect(towerX + 10, baseY - towerH + 22, 6, 12);
            this.ctx.fillRect(towerX + 20, baseY - towerH + 45, 5, 10);
            this.ctx.fillStyle = 'rgba(18, 15, 33, 0.58)';
        }

        if (phase === 1) {
            this.ctx.strokeStyle = 'rgba(214, 180, 95, 0.2)';
            this.ctx.lineWidth = 10;
            for (let i = 0; i < 4; i++) {
                const y = this.height * (0.35 + i * 0.1) + Math.sin(now * 0.00035 + i) * 4;
                this.ctx.beginPath();
                this.ctx.moveTo(-30, y);
                this.ctx.lineTo(this.width * 0.7, y - 70);
                this.ctx.stroke();
            }
        } else if (phase === 2) {
            this.ctx.strokeStyle = 'rgba(214, 180, 95, 0.42)';
            this.ctx.lineWidth = 4;
            for (let i = 0; i < 3; i++) {
                const x = this.width * (0.2 + i * 0.28);
                this.ctx.beginPath();
                this.ctx.ellipse(x, this.height * 0.56, 18, 42, 0, 0, Math.PI * 2);
                this.ctx.stroke();
            }
        } else if (phase === 3) {
            this.ctx.fillStyle = 'rgba(12, 32, 25, 0.45)';
            for (let i = 0; i < 8; i++) {
                const x = this.width * (i / 7);
                this.ctx.beginPath();
                this.ctx.moveTo(x, baseY);
                this.ctx.lineTo(x + 18, this.height * 0.48);
                this.ctx.lineTo(x + 36, baseY);
                this.ctx.closePath();
                this.ctx.fill();
            }
        } else if (phase === 4) {
            const bannerColors = ['#7B1F2D', '#2F6F4E', '#2D2047', '#A77723'];
            for (let i = 0; i < 4; i++) {
                const x = this.width * (0.16 + i * 0.22);
                this.ctx.fillStyle = bannerColors[i];
                this.ctx.fillRect(x - 10, this.height * 0.18, 20, 58);
                this.ctx.beginPath();
                this.ctx.moveTo(x - 10, this.height * 0.18 + 58);
                this.ctx.lineTo(x, this.height * 0.18 + 72);
                this.ctx.lineTo(x + 10, this.height * 0.18 + 58);
                this.ctx.closePath();
                this.ctx.fill();
            }
        }

        this.ctx.fillStyle = 'rgba(255, 238, 166, 0.62)';
        for (let i = 0; i < 12; i++) {
            const candleX = (this.width * (0.04 + i * 0.085) + Math.sin(now * 0.0006 + i) * 9) % (this.width + 60);
            const candleY = this.height * (0.12 + (i % 5) * 0.065) + Math.cos(now * 0.0008 + i) * 3;
            this.ctx.fillRect(candleX - 2, candleY, 4, 15);
            this.ctx.beginPath();
            this.ctx.arc(candleX, candleY - 4, 4, 0, Math.PI * 2);
            this.ctx.fill();
        }

        this.ctx.save();
        if (this.shake > 0) {
            this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        }

        // Draw Goal (enchanted cauldron / target mouth)
        if (this.goal && this.state !== 'START') {
            const g = this.goal;
            const bob = Math.sin(Date.now() * 0.004) * 2;
            const bodyGrad = this.ctx.createLinearGradient(g.x, g.y - g.r, g.x, g.y + g.r);
            bodyGrad.addColorStop(0, '#3F6D54');
            bodyGrad.addColorStop(0.72, '#17402E');
            bodyGrad.addColorStop(1, '#0C2419');
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = 'rgba(47, 111, 78, 0.45)';
            this.ctx.fillStyle = bodyGrad;
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y + bob + 8, g.r * 1.05, g.r * 0.82, 0, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.strokeStyle = 'rgba(214,180,95,0.9)';
            this.ctx.lineWidth = 4;
            this.ctx.stroke();

            this.ctx.strokeStyle = 'rgba(214,180,95,0.72)';
            this.ctx.lineWidth = 5;
            this.ctx.beginPath();
            this.ctx.arc(g.x - g.r * 0.85, g.y + bob + 7, 13, Math.PI * 0.45, Math.PI * 1.55);
            this.ctx.arc(g.x + g.r * 0.85, g.y + bob + 7, 13, -Math.PI * 0.55, Math.PI * 0.55);
            this.ctx.stroke();

            const mouthOpen = Math.min(18, 3000 / (Math.hypot(this.candy.x - g.x, this.candy.y - g.y) + 1));
            this.ctx.fillStyle = '#0B2117';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y - 8 + bob, g.r * 0.78, Math.max(10, mouthOpen), 0, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.fillStyle = 'rgba(255,242,168,0.62)';
            this.ctx.beginPath();
            this.ctx.ellipse(g.x, g.y - 10 + bob, g.r * 0.55, Math.max(5, mouthOpen * 0.35), 0, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = '#4B3218';
            this.ctx.beginPath();
            this.ctx.moveTo(g.x - 33, g.y - 28 + bob);
            this.ctx.quadraticCurveTo(g.x - 8, g.y - 48 + bob, g.x + 8, g.y - 32 + bob);
            this.ctx.quadraticCurveTo(g.x + 25, g.y - 18 + bob, g.x + 35, g.y - 30 + bob);
            this.ctx.quadraticCurveTo(g.x + 12, g.y - 20 + bob, g.x - 33, g.y - 28 + bob);
            this.ctx.fill();
            this.ctx.strokeStyle = 'rgba(214,180,95,0.7)';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
        }

        // Draw Sticks (spell bindings)
        this.sticks.forEach(s => {
            if (!s.active) return;
            this.ctx.save();
            this.ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            this.ctx.lineWidth = s.width + 3;
            this.ctx.lineCap = 'round';
            this.ctx.beginPath();
            this.ctx.moveTo(s.p1.x, s.p1.y);
            this.ctx.lineTo(s.p2.x, s.p2.y);
            this.ctx.stroke();
            this.ctx.restore();
            s.draw(this.ctx);
        });

        this.points.forEach(p => {
            if (!p.pinned) return;
            this.ctx.fillStyle = '#7B1F2D';
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = '#D6B45F';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255,242,168,0.65)';
            this.ctx.beginPath();
            this.ctx.arc(p.x - 1.5, p.y - 1.5, 2.2, 0, Math.PI * 2);
            this.ctx.fill();
        });

        // Draw House-point sigils
        this.stars.forEach(s => {
            if (s.collected) return;
            this.ctx.save();
            this.ctx.translate(s.x, s.y);
            this.ctx.rotate(s.rot + Date.now() * 0.002);
            this.ctx.scale(s.scale, s.scale);
            this.ctx.shadowBlur = 16;
            this.ctx.shadowColor = 'rgba(214, 180, 95, 0.72)';
            this.ctx.fillStyle = '#D6B45F';
            this.ctx.beginPath();
            for(let i=0; i<5; i++) {
                this.ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*20, -Math.sin((18+i*72)*Math.PI/180)*20);
                this.ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*8, -Math.sin((54+i*72)*Math.PI/180)*8);
            }
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.strokeStyle = '#7B1F2D';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(255,242,168,0.72)';
            this.ctx.lineWidth = 1.5;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 11, 0, Math.PI * 2);
            this.ctx.stroke();
            this.ctx.fillStyle = 'rgba(255,255,255,0.62)';
            this.ctx.beginPath();
            this.ctx.arc(-3, -5, 4, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        });

        // Draw enchanted Snitch-like treat
        if (this.candy) {
            this.ctx.save();
            this.ctx.translate(this.candy.x, this.candy.y);
            // Rotate based on movement?
            const angle = (this.candy.x - this.candy.oldx) * 0.1;
            this.ctx.rotate(angle);
            
            // Snitch-like treat wings
            const wingFlap = Math.sin(Date.now() * 0.012) * 4;
            this.ctx.fillStyle = '#F4E6B0';
            this.ctx.strokeStyle = 'rgba(214,180,95,0.72)';
            this.ctx.lineWidth = 1.5;
            this.ctx.beginPath();
            this.ctx.moveTo(-18, -4);
            this.ctx.quadraticCurveTo(-34, -18 - wingFlap, -44, -3);
            this.ctx.quadraticCurveTo(-34, 10 + wingFlap, -18, 7);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.stroke();
            this.ctx.beginPath();
            this.ctx.moveTo(18, -4);
            this.ctx.quadraticCurveTo(34, -18 - wingFlap, 44, -3);
            this.ctx.quadraticCurveTo(34, 10 + wingFlap, 18, 7);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(123,31,45,0.42)';
            this.ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                this.ctx.beginPath();
                this.ctx.moveTo(-22, -1 + i * 3);
                this.ctx.lineTo(-39, -5 + i * 4);
                this.ctx.moveTo(22, -1 + i * 3);
                this.ctx.lineTo(39, -5 + i * 4);
                this.ctx.stroke();
            }

            // Enchanted golden treat body
            const grad = this.ctx.createRadialGradient(-5, -5, 2, 0, 0, 20);
            grad.addColorStop(0, '#FFF2A8');
            grad.addColorStop(0.4, '#D6B45F');
            grad.addColorStop(1, '#8A5A12');
            this.ctx.fillStyle = grad;
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = 'rgba(214, 180, 95, 0.42)';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 20, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;

            this.ctx.fillStyle = 'rgba(255,255,255,0.24)';
            this.ctx.beginPath();
            this.ctx.arc(-6, -7, 8, 0, Math.PI * 2);
            this.ctx.fill();

            // Swirl
            this.ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 12, 0, Math.PI*1.5);
            this.ctx.stroke();
            this.ctx.strokeStyle = 'rgba(255, 241, 174, 0.68)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(2, 1, 7, 0, Math.PI*1.2);
            this.ctx.stroke();
            
            this.ctx.restore();
        }

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1;

        // Draw Trail
        if (this.trail.length > 1) {
            this.ctx.beginPath();
            this.ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for(let i=1; i<this.trail.length; i++) {
                this.ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            this.ctx.strokeStyle = 'rgba(255, 232, 142, 0.88)';
            this.ctx.lineWidth = 4;
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = '#D6B45F';
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
        }

        this.ctx.restore();
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 16.67, 2); // Cap dt
        this.lastTime = timestamp;

        try {
            this.update(dt);
            this.draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(t => this.loop(t));
    }
}

// Init
window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});

</script>
