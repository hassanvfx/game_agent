<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Match Rush</title>
    <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] remapped-font: display -> Bangers, hud/ui -> Orbitron from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #130f2f;
            --bg-bottom: #050711;
            --panel: rgba(18, 24, 52, 0.82);
            --panel-strong: rgba(11, 16, 37, 0.92);
            --border: #73f0ff;
            --accent: #7cffb2;
            --danger: #ff6f91;
            --warning: #ffd45c;
            --text-main: #eff9ff;
            --text-soft: #b7cfff;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(59, 103, 255, 0.22), transparent 35%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 18% 22%, rgba(124, 255, 178, 0.16) 0, rgba(124, 255, 178, 0.16) 0.45rem, transparent 0.55rem),
                radial-gradient(circle at 82% 30%, rgba(115, 240, 255, 0.14) 0, rgba(115, 240, 255, 0.14) 0.5rem, transparent 0.6rem),
                radial-gradient(circle at 12% 84%, rgba(255, 111, 145, 0.14) 0, rgba(255, 111, 145, 0.14) 0.42rem, transparent 0.52rem),
                radial-gradient(circle at 88% 78%, rgba(255, 212, 92, 0.16) 0, rgba(255, 212, 92, 0.16) 0.48rem, transparent 0.58rem);
            opacity: 0.95;
        }

        body::after {
            background:
                linear-gradient(transparent 0%, rgba(126, 237, 255, 0.06) 48%, transparent 50%),
                linear-gradient(90deg, rgba(124, 255, 178, 0.05) 0%, transparent 28%, transparent 72%, rgba(255, 111, 145, 0.05) 100%);
            background-size: 100% 0.32rem, 100% 100%;
            mix-blend-mode: screen;
            opacity: 0.7;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 20%, rgba(115, 240, 255, 0.12), transparent 28%),
                radial-gradient(circle at 50% 84%, rgba(124, 255, 178, 0.1), transparent 30%);
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .hidden { display: none !important; }

        .hud-card {
            position: relative;
            min-width: 8.5rem;
            padding: 0.7rem 0.95rem 0.68rem;
            border-radius: 1rem;
            background: linear-gradient(180deg, rgba(22, 31, 67, 0.96), rgba(11, 16, 37, 0.94));
            border: 2px solid rgba(115, 240, 255, 0.9);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 1rem rgba(115, 240, 255, 0.18),
                0 0.5rem 1.1rem var(--shadow);
            backdrop-filter: blur(8px);
        }

        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0.3rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(124, 255, 178, 0.18);
            pointer-events: none;
        }

        .hud-label {
            display: block;
            font-size: 0.62rem;
            line-height: 1;
            letter-spacing: 0.22em;
            color: var(--text-soft);
            margin-bottom: 0.32rem;
            text-transform: uppercase;
        }

        .hud-value {
            display: block;
            font-size: clamp(1.2rem, 3.5vw, 1.9rem);
            line-height: 1;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 0 0.8rem rgba(115, 240, 255, 0.36);
        }

        .hud-value.score { color: var(--warning); }
        .hud-value.time { color: var(--accent); }

        .game-over-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(17, 24, 54, 0.97), rgba(8, 12, 29, 0.96));
            border: 2px solid rgba(124, 255, 178, 0.75);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.07) inset,
                0 0 1.4rem rgba(115, 240, 255, 0.2),
                0 1rem 2rem rgba(0, 0, 0, 0.35);
        }

        .game-over-panel::before {
            content: "⭐ SHIFT COMPLETE ⭐";
            position: absolute;
            top: -0.85rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.16rem 0.8rem;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--warning), #ff9f43);
            color: #281313;
            font-family: 'Bangers', sans-serif;
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            white-space: nowrap;
            box-shadow: 0 0.4rem 0.8rem rgba(255, 159, 67, 0.35);
        }

        .arcade-title {
            font-family: 'Bangers', sans-serif;
            letter-spacing: 0.08em;
            color: #fff4cf;
            text-shadow:
                0 0.15rem 0 #ff6f91,
                0 0 0.8rem rgba(255, 111, 145, 0.45);
        }

        .arcade-subtitle {
            color: var(--text-soft);
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .arcade-button {
            min-width: 12rem;
            border: 0;
            border-radius: 1rem;
            background: linear-gradient(180deg, #7cffb2, #33d99a);
            color: #07231f;
            font-family: 'Bangers', sans-serif;
            letter-spacing: 0.08em;
            box-shadow:
                0 0.45rem 0 #179f6f,
                0 0 1rem rgba(124, 255, 178, 0.28);
        }

        .arcade-button:active {
            transform: translateY(0.24rem);
            box-shadow:
                0 0.22rem 0 #179f6f,
                0 0 0.8rem rgba(124, 255, 178, 0.25);
        }

        .hud-badge {
            position: absolute;
            right: 0.65rem;
            top: 0.52rem;
            width: 0.54rem;
            height: 0.54rem;
            border-radius: 999px;
            background: radial-gradient(circle, #ffffff 0%, var(--border) 45%, transparent 70%);
            opacity: 0.88;
            box-shadow: 0 0 0.75rem rgba(115, 240, 255, 0.42);
        }

        .reaction-gif {
            position: absolute;
            right: clamp(0.65rem, 2vw, 1.1rem);
            width: clamp(4.5rem, 18vw, 7rem);
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(9, 14, 31, 0.58);
            box-shadow: 0 0.6rem 1.2rem rgba(0, 0, 0, 0.3);
            object-fit: cover;
            opacity: 0;
            transform: translateY(0.5rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 55;
        }

        .reaction-gif.is-visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #combo-gif {
            top: clamp(4.9rem, 14vh, 7rem);
        }

        #fail-gif {
            bottom: clamp(1rem, 3vh, 1.25rem);
        }

        @media (max-width: 640px) {
            #hud {
                padding: max(0.85rem, env(safe-area-inset-top)) 0.85rem 0.75rem;
                gap: 0.7rem;
            }

            .hud-card {
                min-width: 0;
                flex: 1 1 0;
                padding: 0.62rem 0.8rem 0.6rem;
            }

            .hud-label {
                font-size: 0.56rem;
                letter-spacing: 0.18em;
            }

            .game-over-panel {
                padding: 2.6rem 1.2rem 1.3rem;
            }

            .arcade-title {
                font-size: 3.15rem;
            }

            .arcade-button {
                min-width: 0;
                width: 100%;
                font-size: 1.8rem;
                padding: 0.95rem 1rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "swapSpeed": { "type": "number", "label": "Swap Speed", "value": 15, "min": 5, "max": 30 },
        "gameDuration": { "type": "number", "label": "Game Duration (s)", "value": 60, "min": 30, "max": 120 }
    }
    </script>
</head>
<body>
    <div id="game-container" class="select-none">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: combo/fail feedback -> catalogs/gifs.json -->
        <img id="combo-gif" class="reaction-gif" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction" loading="lazy" decoding="async">
        <img id="fail-gif" class="reaction-gif" src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Fail reaction" loading="lazy" decoding="async">
        <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-between">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <!-- HUD -->
            <div id="hud" class="w-full p-4 flex justify-between items-center gap-3 pointer-events-auto">
                <div class="hud-card">
                    <span class="hud-badge" aria-hidden="true"></span>
                    <span class="hud-label">Score Drive</span>
                    <span id="score-display" class="hud-value score">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-badge" aria-hidden="true"></span>
                    <span class="hud-label">Time Fuel</span>
                    <span id="time-display" class="hud-value time">60</span>
                </div>
            </div>
            
            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 bg-black/65 backdrop-blur-sm pointer-events-auto flex items-center justify-center px-4">
                <div class="game-over-panel p-8 rounded-3xl flex flex-col items-center max-w-sm w-[90%] max-h-[90vh]">
                    <div class="w-full overflow-y-auto flex flex-col items-center">
                        <h1 class="arcade-title text-6xl mb-3 text-center leading-none">Shift Over!</h1>
                        <p class="arcade-subtitle text-lg mb-1 text-center">Total Matches</p>
                        <p id="final-score" class="text-6xl text-[#ffd45c] mb-7 [text-shadow:0_0_18px_rgba(255,212,92,0.35)]">0</p>
                        <button id="restart-btn" class="arcade-button text-3xl py-4 px-8 transition-all">
                            Run Again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assets -->
    <img id="meme_1" data-editable="image" data-label="Meme 1" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>
    <img id="meme_2" data-editable="image" data-label="Meme 2" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png" hidden>
    <img id="meme_3" data-editable="image" data-label="Meme 3" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/spike.png" hidden>
    <img id="meme_4" data-editable="image" data-label="Meme 4" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/magnet.png" hidden>
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/match/fail -> catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_swap" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_match" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_bonus" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_error" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>

    <script>
        // --- Core System & Config ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let lastTime = 0;
        
        window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfig = {};
        for (let key in gameConfigDefs) window.gameConfig[key] = gameConfigDefs[key].value;
        window.updateGameConfig = (key, val) => { window.gameConfig[key] = val; };

        // --- Audio System ---
        let audioUnlocked = false;
        const bgm = document.getElementById('bgm_main');
        const audioMap = {
            swap: { el: document.getElementById('sfx_swap'), volume: 0.34, cooldown: 70 },
            match: { el: document.getElementById('sfx_match'), volume: 0.45, cooldown: 90 },
            bonus: { el: document.getElementById('sfx_bonus'), volume: 0.5, cooldown: 180 },
            error: { el: document.getElementById('sfx_error'), volume: 0.42, cooldown: 180 },
            gameover: { el: document.getElementById('sfx_gameover'), volume: 0.5, cooldown: 400 },
            restart: { el: document.getElementById('sfx_restart'), volume: 0.42, cooldown: 250 }
        };
        const audioLastPlayed = {};
        let activeGifTimer = null;

        bgm.volume = 0.24;

        function startBgm() {
            bgm.currentTime = bgm.currentTime || 0;
            bgm.play().catch(() => {});
        }

        function stopBgm() {
            bgm.pause();
        }

        function unlockAudio() {
            if (!audioUnlocked) {
                audioUnlocked = true;
                startBgm();
            } else if (bgm.paused && gameState === 'PLAYING') {
                startBgm();
            }
        }

        function playSfx(type) {
            if (!audioUnlocked || !audioMap[type]) return;
            const { el, volume, cooldown = 0 } = audioMap[type];
            const now = performance.now();
            if (audioLastPlayed[type] && now - audioLastPlayed[type] < cooldown) return;
            audioLastPlayed[type] = now;
            try {
                el.pause();
                el.currentTime = 0;
                el.volume = volume;
                el.play().catch(() => {});
            } catch (_) {}
        }

        function showReactionGif(kind, duration = 1300) {
            const comboGif = document.getElementById('combo-gif');
            const failGif = document.getElementById('fail-gif');
            comboGif.classList.remove('is-visible');
            failGif.classList.remove('is-visible');
            if (activeGifTimer) clearTimeout(activeGifTimer);

            const target = kind === 'fail' ? failGif : comboGif;
            target.classList.add('is-visible');
            activeGifTimer = setTimeout(() => {
                target.classList.remove('is-visible');
            }, duration);
        }

        function vibrate(style = 'light') {
            window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                params: { style }
            });
            if (navigator.vibrate) {
                if (style === 'light') navigator.vibrate(10);
                else if (style === 'medium') navigator.vibrate(30);
                else navigator.vibrate([50, 50, 50]);
            }
        }

        // --- Game State & UI ---
        let gameState = 'PLAYING'; // PLAYING, GAMEOVER
        let score = 0;
        let timeLeft = 0;
        let timerInterval = null;

        function setState(next) {
            gameState = next;
            const goScreen = document.getElementById('game-over-screen');
            if (next === 'PLAYING') {
                goScreen.classList.add('hidden');
                if (audioUnlocked) startBgm();
            } else if (next === 'GAMEOVER') {
                goScreen.classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                clearInterval(timerInterval);
                stopBgm();
                playSfx('gameover');
                showReactionGif('fail', 2200);
            }
        }

        // --- Match-3 Logic & Entities ---
        const COLS = 6;
        const ROWS = 8;
        let cellSize = 0;
        let boardOffsetX = 0;
        let boardOffsetY = 0;
        
        const memeImages = [
            document.getElementById('meme_1'),
            document.getElementById('meme_2'),
            document.getElementById('meme_3'),
            document.getElementById('meme_4')
        ];

        const tileThemes = [
            {
                frame: '#ff6f91',
                glow: 'rgba(255, 111, 145, 0.42)',
                inner: '#341027',
                outline: '#ffd6e1',
                spark: '#ffd45c',
                glyph: '🏃'
            },
            {
                frame: '#ffd45c',
                glow: 'rgba(255, 212, 92, 0.38)',
                inner: '#2b2448',
                outline: '#fff0bd',
                spark: '#ffffff',
                glyph: '🪙'
            },
            {
                frame: '#7a5cff',
                glow: 'rgba(122, 92, 255, 0.38)',
                inner: '#1b173a',
                outline: '#d5cdff',
                spark: '#ff97b5',
                glyph: '⚡'
            },
            {
                frame: '#7cffb2',
                glow: 'rgba(124, 255, 178, 0.36)',
                inner: '#112f2b',
                outline: '#c8ffe1',
                spark: '#73f0ff',
                glyph: '🧲'
            }
        ];
        
        let grid = []; // 2D array: grid[col][row]
        let boardState = 'IDLE'; // IDLE, SWAPPING, REVERTING, MATCHING, FALLING
        let selectedTile = null;
        let swapPair = null;
        let danmaku = [];
        let particles = [];
        let comboCount = 0;

        const DANMAKU_TEXTS = ["HOT STREAK!", "CLEAN SWAP!", "FAST HANDS!", "BONUS!", "CHAIN UP!", "LOCKED IN!", "NICE MOVE!", "BIG MATCH!"];

        class Tile {
            constructor(c, r, type) {
                this.c = c;
                this.r = r;
                this.type = type;
                this.visX = c;
                this.visY = r;
                this.scale = 1;
                this.alpha = 1;
                this.markedForDeath = false;
            }
        }

        function createGrid() {
            grid = [];
            for (let c = 0; c < COLS; c++) {
                grid[c] = [];
                for (let r = 0; r < ROWS; r++) {
                    let type;
                    do {
                        type = Math.floor(Math.random() * memeImages.length);
                    } while (
                        (c >= 2 && grid[c-1][r] && grid[c-2][r] && grid[c-1][r].type === type && grid[c-2][r].type === type) ||
                        (r >= 2 && grid[c][r-1] && grid[c][r-2] && grid[c][r-1].type === type && grid[c][r-2].type === type)
                    );
                    grid[c][r] = new Tile(c, r, type);
                }
            }
        }

        function getMatches() {
            let matches = new Set();
            // Horizontal
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 2; c++) {
                    let t1 = grid[c][r], t2 = grid[c+1][r], t3 = grid[c+2][r];
                    if (t1 && t2 && t3 && t1.type === t2.type && t2.type === t3.type) {
                        matches.add(t1); matches.add(t2); matches.add(t3);
                        let extC = c + 3;
                        while(extC < COLS && grid[extC][r] && grid[extC][r].type === t1.type) {
                            matches.add(grid[extC][r]);
                            extC++;
                        }
                    }
                }
            }
            // Vertical
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 2; r++) {
                    let t1 = grid[c][r], t2 = grid[c][r+1], t3 = grid[c][r+2];
                    if (t1 && t2 && t3 && t1.type === t2.type && t2.type === t3.type) {
                        matches.add(t1); matches.add(t2); matches.add(t3);
                        let extR = r + 3;
                        while(extR < ROWS && grid[c][extR] && grid[c][extR].type === t1.type) {
                            matches.add(grid[c][extR]);
                            extR++;
                        }
                    }
                }
            }
            return Array.from(matches);
        }

        function spawnDanmaku(text, y) {
            danmaku.push({
                text: text,
                x: cw,
                y: y,
                vx: - (cw * 0.5 + Math.random() * cw * 0.3),
                color: ['#ff6f91', '#7cffb2', '#73f0ff', '#ffd45c'][Math.floor(Math.random()*4)],
                life: 3
            });
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*cw*0.5,
                    vy: (Math.random()-0.5)*cw*0.5,
                    life: 0.5, maxLife: 0.5,
                    color: color
                });
            }
        }

        function processMatches() {
            let matches = getMatches();
            if (matches.length > 0) {
                boardState = 'MATCHING';
                comboCount++;
                let pts = matches.length * 10 * comboCount;
                if (matches.length >= 4) pts *= 2;
                if (matches.length >= 5) pts *= 3;
                score += pts;
                document.getElementById('score-display').innerText = score;
                
                playSfx(matches.length >= 4 ? 'bonus' : 'match');
                vibrate(matches.length >= 4 ? 'heavy' : 'medium');
                
                if (comboCount > 1 || matches.length >= 4) {
                    spawnDanmaku(DANMAKU_TEXTS[Math.floor(Math.random()*DANMAKU_TEXTS.length)], boardOffsetY + Math.random()*ROWS*cellSize);
                    showReactionGif('combo', 1500);
                }

                matches.forEach(t => {
                    t.markedForDeath = true;
                    spawnParticles(boardOffsetX + (t.c + 0.5)*cellSize, boardOffsetY + (t.r + 0.5)*cellSize, tileThemes[t.type % tileThemes.length].spark);
                });
            } else {
                boardState = 'IDLE';
                comboCount = 0;
            }
        }

        function updateBoard(dt) {
            let isAnimating = false;
            let speed = gameConfig.swapSpeed;

            // Update tiles
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    let t = grid[c][r];
                    if (!t) continue;

                    // Lerp position
                    if (Math.abs(t.visX - t.c) > 0.01) { t.visX += (t.c - t.visX) * speed * dt; isAnimating = true; }
                    else { t.visX = t.c; }
                    
                    if (Math.abs(t.visY - t.r) > 0.01) { t.visY += (t.r - t.visY) * speed * dt; isAnimating = true; }
                    else { t.visY = t.r; }

                    // Death animation
                    if (t.markedForDeath) {
                        t.scale -= 5 * dt;
                        t.alpha -= 5 * dt;
                        isAnimating = true;
                        if (t.scale <= 0) {
                            grid[c][r] = null;
                        }
                    }
                }
            }

            if (!isAnimating) {
                if (boardState === 'SWAPPING') {
                    let matches = getMatches();
                    if (matches.length > 0) {
                        processMatches();
                    } else {
                        // Revert swap
                        boardState = 'REVERTING';
                        playSfx('error');
                        let t1 = grid[swapPair[0].c][swapPair[0].r];
                        let t2 = grid[swapPair[1].c][swapPair[1].r];
                        
                        // Swap back in grid
                        let tmpC = t1.c, tmpR = t1.r;
                        t1.c = t2.c; t1.r = t2.r;
                        t2.c = tmpC; t2.r = tmpR;
                        grid[t1.c][t1.r] = t1;
                        grid[t2.c][t2.r] = t2;
                    }
                } else if (boardState === 'REVERTING') {
                    boardState = 'IDLE';
                } else if (boardState === 'MATCHING') {
                    boardState = 'FALLING';
                    // Apply gravity
                    for (let c = 0; c < COLS; c++) {
                        let emptySpaces = 0;
                        for (let r = ROWS - 1; r >= 0; r--) {
                            if (!grid[c][r]) {
                                emptySpaces++;
                            } else if (emptySpaces > 0) {
                                let t = grid[c][r];
                                grid[c][r] = null;
                                t.r += emptySpaces;
                                grid[c][t.r] = t;
                            }
                        }
                        // Spawn new
                        for (let i = 0; i < emptySpaces; i++) {
                            let type = Math.floor(Math.random() * memeImages.length);
                            let t = new Tile(c, i, type);
                            t.visY = i - emptySpaces; // Start above board
                            grid[c][i] = t;
                        }
                    }
                } else if (boardState === 'FALLING') {
                    processMatches();
                }
            }
        }

        // --- Input Handling ---
        let startPointer = null;

        function handleGameInput(e) {
            if (boardState !== 'IDLE') return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (e.type === 'pointerdown') {
                let c = Math.floor((x - boardOffsetX) / cellSize);
                let r = Math.floor((y - boardOffsetY) / cellSize);
                if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
                    selectedTile = grid[c][r];
                    startPointer = { x, y };
                    vibrate('light');
                }
            } else if ((e.type === 'pointermove' || e.type === 'pointerup') && selectedTile) {
                if (!startPointer) return;
                let dx = x - startPointer.x;
                let dy = y - startPointer.y;
                
                if (Math.abs(dx) > cellSize * 0.5 || Math.abs(dy) > cellSize * 0.5) {
                    let dc = 0, dr = 0;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        dc = dx > 0 ? 1 : -1;
                    } else {
                        dr = dy > 0 ? 1 : -1;
                    }
                    
                    let targetC = selectedTile.c + dc;
                    let targetR = selectedTile.r + dr;
                    
                    if (targetC >= 0 && targetC < COLS && targetR >= 0 && targetR < ROWS) {
                        let targetTile = grid[targetC][targetR];
                        
                        // Swap in grid
                        let tmpC = selectedTile.c, tmpR = selectedTile.r;
                        selectedTile.c = targetTile.c; selectedTile.r = targetTile.r;
                        targetTile.c = tmpC; targetTile.r = tmpR;
                        
                        grid[selectedTile.c][selectedTile.r] = selectedTile;
                        grid[targetTile.c][targetTile.r] = targetTile;
                        
                        swapPair = [selectedTile, targetTile];
                        boardState = 'SWAPPING';
                        playSfx('swap');
                    }
                    selectedTile = null;
                    startPointer = null;
                }
            }
            
            if (e.type === 'pointerup' || e.type === 'pointercancel') {
                selectedTile = null;
                startPointer = null;
            }
        }

        function handleGlobalInput(e) {
            unlockAudio();
            if (gameState === 'GAMEOVER') {
                if (e.target.id === 'restart-btn') restartGame();
                return;
            }
            if (gameState === 'PLAYING') {
                handleGameInput(e);
            }
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        window.addEventListener('pointermove', handleGlobalInput, { passive: false });
        window.addEventListener('pointerup', handleGlobalInput, { passive: false });
        window.addEventListener('pointercancel', handleGlobalInput, { passive: false });

        function drawArcadeBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, ch);
            gradient.addColorStop(0, '#130f2f');
            gradient.addColorStop(0.55, '#0b1230');
            gradient.addColorStop(1, '#050711');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, cw, ch);

            const starCount = Math.max(18, Math.floor(cw / 28));
            for (let i = 0; i < starCount; i++) {
                const x = (i * 137) % cw;
                const y = ((i * 89) % ch);
                const radius = ((i % 3) + 1) * dpr * 0.7;
                ctx.fillStyle = i % 4 === 0 ? 'rgba(124, 255, 178, 0.45)' : 'rgba(115, 240, 255, 0.34)';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.lineWidth = 2 * dpr;
            for (let i = 0; i <= 8; i++) {
                const y = ch * 0.2 + i * (ch * 0.09);
                ctx.strokeStyle = `rgba(115, 240, 255, ${0.12 - i * 0.01})`;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(cw, y);
                ctx.stroke();
            }

            for (let i = 0; i < 10; i++) {
                const x = cw * 0.1 + i * (cw * 0.08);
                ctx.strokeStyle = `rgba(124, 255, 178, ${0.06 - i * 0.003})`;
                ctx.beginPath();
                ctx.moveTo(x, ch * 0.18);
                ctx.lineTo(cw / 2, ch * 0.92);
                ctx.stroke();
            }
        }

        function drawBoardShell() {
            const boardW = COLS * cellSize;
            const boardH = ROWS * cellSize;

            ctx.save();
            ctx.shadowColor = 'rgba(115, 240, 255, 0.28)';
            ctx.shadowBlur = 20 * dpr;
            ctx.fillStyle = 'rgba(7, 12, 28, 0.9)';
            ctx.fillRect(boardOffsetX - 10, boardOffsetY - 10, boardW + 20, boardH + 20);
            ctx.restore();

            const boardGradient = ctx.createLinearGradient(boardOffsetX, boardOffsetY, boardOffsetX, boardOffsetY + boardH);
            boardGradient.addColorStop(0, '#101936');
            boardGradient.addColorStop(1, '#0a1023');
            ctx.fillStyle = boardGradient;
            ctx.fillRect(boardOffsetX, boardOffsetY, boardW, boardH);

            for (let c = 0; c <= COLS; c++) {
                const gx = boardOffsetX + c * cellSize;
                ctx.strokeStyle = 'rgba(115, 240, 255, 0.14)';
                ctx.lineWidth = 1.5 * dpr;
                ctx.beginPath();
                ctx.moveTo(gx, boardOffsetY);
                ctx.lineTo(gx, boardOffsetY + boardH);
                ctx.stroke();
            }

            for (let r = 0; r <= ROWS; r++) {
                const gy = boardOffsetY + r * cellSize;
                ctx.strokeStyle = 'rgba(124, 255, 178, 0.1)';
                ctx.lineWidth = 1.5 * dpr;
                ctx.beginPath();
                ctx.moveTo(boardOffsetX, gy);
                ctx.lineTo(boardOffsetX + boardW, gy);
                ctx.stroke();
            }

            ctx.strokeStyle = '#73f0ff';
            ctx.lineWidth = 4 * dpr;
            ctx.strokeRect(boardOffsetX, boardOffsetY, boardW, boardH);

            ctx.strokeStyle = 'rgba(124, 255, 178, 0.6)';
            ctx.lineWidth = 1.5 * dpr;
            ctx.strokeRect(boardOffsetX + 6, boardOffsetY + 6, boardW - 12, boardH - 12);
        }

        function drawTileFrame(size, theme, isSelected) {
            const radius = size * 0.18;

            ctx.save();
            ctx.shadowColor = theme.glow;
            ctx.shadowBlur = (isSelected ? 20 : 12) * dpr;
            ctx.fillStyle = theme.frame;
            ctx.beginPath();
            ctx.roundRect(-size / 2, -size / 2, size, size, radius);
            ctx.fill();
            ctx.restore();

            const innerSize = size * 0.82;
            ctx.fillStyle = theme.inner;
            ctx.beginPath();
            ctx.roundRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize, radius * 0.8);
            ctx.fill();

            const topGlow = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
            topGlow.addColorStop(0, 'rgba(255,255,255,0.28)');
            topGlow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = topGlow;
            ctx.beginPath();
            ctx.roundRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize * 0.62, radius * 0.8);
            ctx.fill();

            ctx.strokeStyle = theme.outline;
            ctx.lineWidth = 2 * dpr;
            ctx.beginPath();
            ctx.roundRect(-innerSize / 2, -innerSize / 2, innerSize, innerSize, radius * 0.8);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 1 * dpr;
            ctx.beginPath();
            ctx.moveTo(-size * 0.18, -size * 0.18);
            ctx.lineTo(size * 0.18, size * 0.18);
            ctx.moveTo(size * 0.18, -size * 0.18);
            ctx.lineTo(-size * 0.18, size * 0.18);
            ctx.stroke();
        }

        function drawCharacterAccent(theme, size, glyph) {
            ctx.font = `${Math.round(size * 0.26)}px "Bangers"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = theme.outline;
            ctx.globalAlpha = 0.9;
            ctx.fillText(glyph, 0, size * 0.3);
            ctx.globalAlpha = 1;
        }

        // --- Main Loop & Rendering ---
        function draw(dt) {
            // Background
            drawArcadeBackground();

            // Board Background
            drawBoardShell();

            // Tiles
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    let t = grid[c][r];
                    if (!t) continue;
                    
                    let px = boardOffsetX + t.visX * cellSize;
                    let py = boardOffsetY + t.visY * cellSize;
                    let pad = cellSize * 0.07;
                    let size = cellSize - pad * 2;
                    const theme = tileThemes[t.type % tileThemes.length];
                    
                    ctx.save();
                    ctx.translate(px + cellSize/2, py + cellSize/2);
                    if (t === selectedTile) ctx.scale(1.1, 1.1);
                    ctx.scale(Math.max(0, t.scale), Math.max(0, t.scale));
                    ctx.globalAlpha = Math.max(0, t.alpha);

                    drawTileFrame(size, theme, t === selectedTile);
                    
                    // Image
                    let img = memeImages[t.type];
                    if (img && img.complete && img.naturalWidth > 0) {
                        const imgSize = size * 0.7;
                        ctx.save();
                        ctx.shadowColor = theme.glow;
                        ctx.shadowBlur = 10 * dpr;
                        ctx.drawImage(img, -imgSize/2, -imgSize/2 - size * 0.06, imgSize, imgSize);
                        ctx.restore();
                    }

                    drawCharacterAccent(theme, size, theme.glyph);

                    if (t === selectedTile) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2 * dpr;
                        ctx.beginPath();
                        ctx.roundRect(-size / 2 - 4, -size / 2 - 4, size + 8, size + 8, size * 0.22);
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4 * dpr, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Danmaku
            ctx.font = `700 ${30 * dpr}px "Bangers"`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let i = danmaku.length - 1; i >= 0; i--) {
                let d = danmaku[i];
                d.x += d.vx * dt;
                d.life -= dt;
                if (d.life <= 0) { danmaku.splice(i, 1); continue; }
                
                ctx.fillStyle = '#091223';
                ctx.fillText(d.text, d.x + 2*dpr, d.y + 2*dpr);
                ctx.fillStyle = d.color;
                ctx.fillText(d.text, d.x, d.y);
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            dt = Math.min(dt, 0.05);

            try {
                if (gameState === 'PLAYING') {
                    updateBoard(dt);
                }
                draw(dt);
            } catch (e) {
                console.error("Loop error:", e);
            }

            requestAnimationFrame(loop);
        }

        // --- Lifecycle ---
        function initGame() {
            score = 0;
            comboCount = 0;
            timeLeft = gameConfig.gameDuration;
            document.getElementById('score-display').innerText = score;
            document.getElementById('time-display').innerText = timeLeft;
            
            createGrid();
            // Ensure no initial matches
            while(getMatches().length > 0) {
                createGrid();
            }
            
            boardState = 'IDLE';
            danmaku = [];
            particles = [];
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    timeLeft--;
                    document.getElementById('time-display').innerText = timeLeft;
                    if (timeLeft <= 0) {
                        setState('GAMEOVER');
                    }
                }
            }, 1000);
        }

        function restartGame() {
            playSfx('restart');
            initGame();
            setState('PLAYING');
        }

        function resize(width, height) {
            cw = width;
            ch = height;
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            
            // Calculate board dimensions
            let maxW = cw * 0.95;
            let maxH = ch * 0.7; // Leave room for HUD
            cellSize = Math.min(maxW / COLS, maxH / ROWS);
            boardOffsetX = (cw - COLS * cellSize) / 2;
            boardOffsetY = (ch - ROWS * cellSize) / 2 + ch * 0.1; // Shift down slightly
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (!initialized) {
                initGame();
                setState('PLAYING');
                initialized = true;
                requestAnimationFrame(loop);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    resize(entry.contentRect.width, entry.contentRect.height);
                }
            });
            ro.observe(canvas);
        });

    </script>
