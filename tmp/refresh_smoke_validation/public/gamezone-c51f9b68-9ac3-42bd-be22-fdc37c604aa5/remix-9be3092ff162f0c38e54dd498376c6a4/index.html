<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Egg Run</title>
    <!-- [agent-note][stage3] resolved-font: title->Bangers, ui->Exo 2 via catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #130f2d;
            --bg-bottom: #35206d;
            --panel: rgba(18, 15, 43, 0.78);
            --panel-border: rgba(154, 230, 255, 0.32);
            --hud-bg: rgba(13, 15, 36, 0.72);
            --hud-highlight: #8cf3ff;
            --text-main: #f7f7ff;
            --text-soft: rgba(247, 247, 255, 0.78);
            --egg-glow: #ffe893;
            --hero-main: #69f0ae;
            --hero-shadow: #18865e;
            --hero-crest: #fff2a8;
            --hazard-main: #6d7a8f;
            --hazard-shadow: #3f475c;
            --ground-top: #6dd85d;
            --ground-mid: #2b9f65;
            --ground-low: #6f4120;
            --button-top: #7df7ff;
            --button-bottom: #25b3ff;
            --button-text: #0c1632;
            --danger: #ff7d98;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(160, 116, 255, 0.24), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .p-8 { padding: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .text-center { text-align: center; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .font-bold { font-weight: 700; }
        .text-white { color: #fff; }
        .text-white\/80 { color: rgba(255, 255, 255, 0.8); }
        .text-gray-900 { color: #111827; }
        .text-green-400 { color: #4ade80; }
        .text-red-400 { color: #f87171; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-4xl { font-size: clamp(2rem, 5vw, 2.5rem); line-height: 1.1; }
        .text-5xl { font-size: clamp(2.45rem, 8vw, 3.7rem); line-height: 1; }
        .text-lg { font-size: 1.125rem; line-height: 1.5rem; }
        .drop-shadow-lg, .drop-shadow-md { text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45); }
        .transition, .transform, .duration-300, .hover\:scale-105, .hover\:shadow-2xl, .hover\:bg-gray-100 {
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .shadow-lg { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28); }
        .bg-white { background: #fff; }
        .bg-gradient-to-r { background: linear-gradient(90deg, #22c55e, #059669); }

        #game-container {
            min-height: 100vh;
            isolation: isolate;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.2), transparent 10%),
                radial-gradient(circle at 72% 12%, rgba(255, 238, 153, 0.16), transparent 12%),
                radial-gradient(circle at 85% 28%, rgba(140, 243, 255, 0.12), transparent 9%);
            opacity: 0.9;
        }

        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%, transparent 82%, rgba(10, 15, 34, 0.28));
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(39, 29, 82, 0.94), rgba(14, 19, 49, 0.92));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 44px rgba(0, 0, 0, 0.36),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            width: min(90vw, 28rem);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), transparent 35%),
                radial-gradient(circle at top right, rgba(255, 232, 147, 0.12), transparent 30%);
            pointer-events: none;
        }

        button {
            border: 0;
            cursor: pointer;
            font-family: "Exo 2", system-ui, sans-serif;
            font-size: inherit;
            line-height: inherit;
        }

        .title-text {
            font-family: 'Bangers', system-ui, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .panel-copy {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.8rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--egg-glow);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .pulse-text {
            animation: pulse 1.6s ease-in-out infinite;
        }

        .arcade-btn {
            min-height: 3rem;
            padding: 0.82rem 1.8rem;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--button-top), var(--button-bottom));
            color: var(--button-text);
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            box-shadow:
                0 10px 22px rgba(17, 134, 195, 0.38),
                inset 0 1px 0 rgba(255,255,255,0.65);
        }

        .arcade-btn:active {
            transform: scale(0.97);
        }

        .arcade-btn.secondary {
            background: linear-gradient(180deg, #fff4ae, #ffd369);
            box-shadow:
                0 10px 22px rgba(255, 196, 74, 0.28),
                inset 0 1px 0 rgba(255,255,255,0.6);
        }

        #hud {
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            background: var(--hud-bg);
            border: 1px solid rgba(140, 243, 255, 0.28);
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.24),
                inset 0 1px 0 rgba(255,255,255,0.08);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(0.84rem, 2.8vw, 1rem);
            line-height: 1.2;
            letter-spacing: 0.04em;
        }

        .hud-icon {
            filter: drop-shadow(0 0 8px rgba(255, 232, 147, 0.55));
        }

        .hud-score {
            color: var(--hud-highlight);
        }

        .panel-score {
            color: var(--egg-glow);
            font-family: 'Bangers', system-ui, sans-serif;
        }

        .support-copy {
            max-width: 20rem;
            margin: 0 auto;
            color: var(--text-soft);
            font-size: 1rem;
        }

        .screen-emoji {
            font-size: 1.75rem;
            line-height: 1;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.3));
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(30vw, 7rem);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.26);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
            background: rgba(14, 19, 49, 0.5);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            right: auto;
            left: 1rem;
            bottom: 5.25rem;
            width: min(28vw, 6.25rem);
        }

        @media (max-width: 480px) {
            .p-8 {
                padding: 1.35rem;
            }

            .glass-panel {
                width: min(92vw, 26rem);
            }

            .support-copy {
                font-size: 0.96rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">

            <div id="start-screen" class="glass-panel p-8 rounded-2xl text-center pointer-events-auto">
                <div class="panel-copy">
                    <div class="hero-badge"><span class="screen-emoji">🥚</span> Shell Sprint</div>
                    <h1 class="title-text text-5xl font-bold text-green-400 mb-2 drop-shadow-lg">Egg Run</h1>
                    <p class="text-white/80 text-lg mb-6 pulse-text support-copy">Guide the neon hatchling past jagged rocks and scoop up every glowing egg.</p>
                    <button id="start-btn" class="arcade-btn transition transform shadow-lg">Start Run</button>
                </div>
            </div>

            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-2xl text-center pointer-events-auto">
                <div class="panel-copy">
                    <div class="hero-badge"><span class="screen-emoji">💥</span> Nest Break</div>
                    <h2 class="title-text text-4xl font-bold text-red-400 mb-2">Run Over</h2>
                    <div class="text-2xl text-white mb-6">Eggs secured: <span id="finalScore" class="panel-score">0</span></div>
                    <button id="restart-btn" class="arcade-btn secondary transition shadow-lg">Run Again</button>
                </div>
            </div>

            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="absolute top-4 left-4 text-2xl font-bold text-white drop-shadow-md hidden flex items-center gap-2">
                <span class="hud-icon">🥚</span> Eggs: <span id="score" class="hud-score">0</span>
            </div>
            <!-- [agent-note][stage3] resolved-gif: collect/fail overlays via catalogs/gifs.json; keep compact to protect controls -->
            <img id="collect-gif" class="feedback-gif pointer-events-none" alt="Egg combo reaction" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp">
            <img id="fail-gif" class="feedback-gif fail pointer-events-none" alt="Run over reaction" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                collect: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                fail: "https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp"
            }
        };

        class AudioController {
            constructor() {
                this.enabled = false;
                this.activeClones = new Set();
                this.lastPlayedAt = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                const source = this.sfx[key];
                if (!source || !this.enabled) return;

                const now = performance.now();
                const cooldown = options.cooldown ?? 0;
                const lastPlayed = this.lastPlayedAt.get(key) ?? 0;
                if (cooldown && now - lastPlayed < cooldown) return;
                this.lastPlayedAt.set(key, now);

                const clone = source.cloneNode();
                clone.volume = options.volume ?? 0.65;
                this.activeClones.add(clone);

                const cleanup = () => {
                    this.activeClones.delete(clone);
                    clone.removeEventListener('ended', cleanup);
                    clone.removeEventListener('error', cleanup);
                };

                clone.addEventListener('ended', cleanup);
                clone.addEventListener('error', cleanup);
                clone.play().catch(cleanup);
            }
        }

        class FeedbackController {
            constructor() {
                this.collectGif = document.getElementById('collect-gif');
                this.failGif = document.getElementById('fail-gif');
                this.collectGif.src = ASSETS.gifs.collect;
                this.failGif.src = ASSETS.gifs.fail;
                this.collectTimer = null;
                this.failTimer = null;
            }

            showCollect() {
                this.collectGif.classList.add('show');
                clearTimeout(this.collectTimer);
                this.collectTimer = setTimeout(() => {
                    this.collectGif.classList.remove('show');
                }, 900);
            }

            showFail() {
                this.failGif.classList.add('show');
                clearTimeout(this.failTimer);
                this.failTimer = setTimeout(() => {
                    this.failGif.classList.remove('show');
                }, 1500);
            }

            reset() {
                this.collectGif.classList.remove('show');
                this.failGif.classList.remove('show');
                clearTimeout(this.collectTimer);
                clearTimeout(this.failTimer);
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;

        const ENABLE_ANIMATIONS = true;

        let dino = {
            x: 50,
            y: 0,
            width: 40,
            height: 60,
            vy: 0,
            jumpStrength: -12,
            gravity: 0.6,
            grounded: false,
            color: '#69f0ae'
        };

        let groundHeight = 100;
        let obstacles = [];
        let eggs = [];
        let particles = [];

        let bgOffset1 = 0;
        let bgOffset2 = 0;
        let cloudOffset = 0;
        let starTwinkle = 0;
        let wasGrounded = true;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            groundHeight = height * 0.2;
            if (dino.y === 0) dino.y = height - groundHeight - dino.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawRoundedRect(x, y, w, h, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
            ctx.fill();
        }

        function drawMountains(offset, yBase, heightScale, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, height);

            const peakWidth = 200;
            const totalWidth = width + peakWidth * 2;

            for (let x = -peakWidth; x < totalWidth; x += peakWidth) {
                let drawX = (x - offset) % (peakWidth * 10);
                if (drawX < -peakWidth) drawX += totalWidth + peakWidth;

                ctx.lineTo(drawX, height - yBase);
                ctx.lineTo(drawX + peakWidth / 2, height - yBase - heightScale);
                ctx.lineTo(drawX + peakWidth, height - yBase);
            }

            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawClouds() {
            const clouds = [
                { x: (120 - cloudOffset * 0.3) % (width + 220), y: height * 0.18, s: 1 },
                { x: (width * 0.55 - cloudOffset * 0.24) % (width + 260), y: height * 0.12, s: 1.15 },
                { x: (width * 0.88 - cloudOffset * 0.18) % (width + 280), y: height * 0.24, s: 0.85 }
            ];

            clouds.forEach(cloud => {
                const x = cloud.x < -100 ? cloud.x + width + 280 : cloud.x;
                const y = cloud.y;
                const scale = cloud.s;
                ctx.fillStyle = 'rgba(255,255,255,0.14)';
                ctx.beginPath();
                ctx.arc(x, y, 28 * scale, 0, Math.PI * 2);
                ctx.arc(x + 26 * scale, y - 10 * scale, 24 * scale, 0, Math.PI * 2);
                ctx.arc(x + 52 * scale, y, 22 * scale, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawAurora() {
            const aurora = ctx.createLinearGradient(0, 0, width, height * 0.55);
            aurora.addColorStop(0, 'rgba(125, 247, 255, 0.02)');
            aurora.addColorStop(0.45, 'rgba(150, 255, 178, 0.16)');
            aurora.addColorStop(1, 'rgba(255, 232, 147, 0.02)');
            ctx.fillStyle = aurora;
            ctx.beginPath();
            ctx.moveTo(0, height * 0.12);
            ctx.bezierCurveTo(width * 0.2, height * 0.02, width * 0.35, height * 0.24, width * 0.52, height * 0.1);
            ctx.bezierCurveTo(width * 0.72, 0, width * 0.84, height * 0.18, width, height * 0.08);
            ctx.lineTo(width, 0);
            ctx.lineTo(0, 0);
            ctx.closePath();
            ctx.fill();
        }

        function drawStars() {
            const stars = [
                [0.14, 0.16, 2.2], [0.24, 0.09, 1.4], [0.42, 0.18, 1.6], [0.63, 0.11, 2.1],
                [0.79, 0.2, 1.8], [0.9, 0.1, 1.4], [0.58, 0.05, 1.2], [0.33, 0.21, 1.3]
            ];

            stars.forEach(([sx, sy, r], index) => {
                const alpha = 0.4 + Math.sin(starTwinkle + index) * 0.18;
                ctx.fillStyle = `rgba(255, 248, 220, ${alpha})`;
                ctx.beginPath();
                ctx.arc(width * sx, height * sy, r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawDino() {
            const bounce = dino.grounded && ENABLE_ANIMATIONS ? Math.sin(frameCount * 0.24) * 1.5 : 0;
            const bodyX = dino.x;
            const bodyY = dino.y + bounce;

            ctx.save();
            ctx.shadowColor = 'rgba(105, 240, 174, 0.35)';
            ctx.shadowBlur = 16;

            ctx.fillStyle = '#10261f';
            ctx.beginPath();
            ctx.ellipse(bodyX + 20, bodyY + dino.height + 8, 24, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fff5b0';
            ctx.beginPath();
            ctx.ellipse(bodyX + 19, bodyY + 26, 19, 23, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = dino.color;
            ctx.beginPath();
            ctx.ellipse(bodyX + 20, bodyY + 30, 20, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(bodyX + 40, bodyY + 4, 16, 15, -0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff0a0';
            ctx.beginPath();
            ctx.moveTo(bodyX + 31, bodyY - 6);
            ctx.lineTo(bodyX + 40, bodyY - 18);
            ctx.lineTo(bodyX + 48, bodyY - 5);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffdd70';
            ctx.beginPath();
            ctx.moveTo(bodyX + 23, bodyY + 6);
            ctx.lineTo(bodyX + 28, bodyY - 8);
            ctx.lineTo(bodyX + 34, bodyY + 7);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(bodyX + 45, bodyY + 2, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(bodyX + 43.5, bodyY + 1, 1.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff9f5c';
            ctx.beginPath();
            ctx.moveTo(bodyX + 52, bodyY + 5);
            ctx.lineTo(bodyX + 62, bodyY + 8);
            ctx.lineTo(bodyX + 51, bodyY + 12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffe893';
            const wingLift = dino.grounded ? Math.sin(frameCount * 0.25) * 4 : -6;
            ctx.beginPath();
            ctx.ellipse(bodyX + 17, bodyY + 29 + wingLift * 0.12, 8, 14, -0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#18865e';
            ctx.beginPath();
            ctx.moveTo(bodyX + 1, bodyY + 34);
            ctx.quadraticCurveTo(bodyX - 18, bodyY + 25, bodyX - 6, bodyY + 12);
            ctx.quadraticCurveTo(bodyX + 4, bodyY + 19, bodyX + 5, bodyY + 29);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffbd59';
            const legOffset = dino.grounded ? Math.sin(frameCount * 0.28) * 6 : -2;
            ctx.fillRect(bodyX + 9, bodyY + dino.height - 2, 7, 11 + legOffset);
            ctx.fillRect(bodyX + 24, bodyY + dino.height - 2, 7, 11 - legOffset);

            ctx.fillStyle = '#7c4a18';
            ctx.fillRect(bodyX + 8, bodyY + dino.height + 8 + legOffset, 10, 3);
            ctx.fillRect(bodyX + 23, bodyY + dino.height + 8 - legOffset, 10, 3);

            ctx.restore();
        }

        function drawRock(obs) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.18)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#2f3545';
            ctx.beginPath();
            ctx.moveTo(obs.x - 1, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w * 0.18, obs.y + obs.h * 0.36);
            ctx.lineTo(obs.x + obs.w * 0.52, obs.y);
            ctx.lineTo(obs.x + obs.w * 0.92, obs.y + obs.h * 0.34);
            ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#6d7a8f';
            ctx.beginPath();
            ctx.moveTo(obs.x + 2, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w * 0.2, obs.y + obs.h * 0.4);
            ctx.lineTo(obs.x + obs.w * 0.49, obs.y + 4);
            ctx.lineTo(obs.x + obs.w * 0.84, obs.y + obs.h * 0.38);
            ctx.lineTo(obs.x + obs.w - 3, obs.y + obs.h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#93a1b3';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.w * 0.35, obs.y + obs.h * 0.24);
            ctx.lineTo(obs.x + obs.w * 0.55, obs.y + obs.h * 0.5);
            ctx.lineTo(obs.x + obs.w * 0.42, obs.y + obs.h * 0.82);
            ctx.stroke();
            ctx.restore();
        }

        function drawEgg(egg) {
            ctx.save();
            ctx.shadowColor = 'rgba(255, 232, 147, 0.55)';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#fff7d0';
            ctx.beginPath();
            ctx.ellipse(egg.x + egg.w / 2, egg.y + egg.h / 2, egg.w / 2, egg.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd66b';
            ctx.beginPath();
            ctx.arc(egg.x + egg.w * 0.38, egg.y + egg.h * 0.35, 2.5, 0, Math.PI * 2);
            ctx.arc(egg.x + egg.w * 0.62, egg.y + egg.h * 0.56, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(egg.x + egg.w * 0.32, egg.y + egg.h * 0.22, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function createParticle(x, y, color) {
            particles.push({
                x,
                y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 30,
                color
            });
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function initGame() {
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            eggs = [];
            particles = [];
            frameCount = 0;
            dino.y = height - groundHeight - dino.height;
            dino.vy = 0;
            dino.grounded = true;
            wasGrounded = true;
            feedback.reset();
            document.getElementById('score').innerText = score;
        }

        function spawnObjects() {
            if (frameCount % 120 === 0) {
                if (Math.random() > 0.3) {
                    obstacles.push({
                        x: width,
                        y: height - groundHeight - 40,
                        w: 30 + Math.random() * 20,
                        h: 40 + Math.random() * 20,
                        type: 'rock'
                    });
                }
            }

            if (frameCount % 150 === 0) {
                let yPos = height - groundHeight - 40;
                if (Math.random() > 0.5) yPos -= 80;

                eggs.push({
                    x: width,
                    y: yPos,
                    w: 25,
                    h: 30,
                    collected: false
                });
            }
        }

        function updatePhysics() {
            dino.vy += dino.gravity;
            dino.y += dino.vy;

            const floorY = height - groundHeight - dino.height;
            if (dino.y >= floorY) {
                dino.y = floorY;
                dino.vy = 0;
                dino.grounded = true;
                if (!wasGrounded) {
                    audio.playSFX('land', { volume: 0.35, cooldown: 120 });
                }
            } else {
                dino.grounded = false;
            }
            wasGrounded = dino.grounded;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    dino.x < obs.x + obs.w &&
                    dino.x + dino.width > obs.x &&
                    dino.y < obs.y + obs.h &&
                    dino.y + dino.height > obs.y
                ) {
                    gameOver();
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            for (let i = eggs.length - 1; i >= 0; i--) {
                const egg = eggs[i];
                egg.x -= gameSpeed;

                if (
                    !egg.collected &&
                    dino.x < egg.x + egg.w &&
                    dino.x + dino.width > egg.x &&
                    dino.y < egg.y + egg.h &&
                    dino.y + dino.height > egg.y
                ) {
                    egg.collected = true;
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('collect', { volume: 0.58, cooldown: 90 });
                    feedback.showCollect();
                    for (let k = 0; k < 5; k++) createParticle(egg.x + egg.w / 2, egg.y + egg.h / 2, '#ffe48a');
                    eggs.splice(i, 1);
                } else if (egg.x + egg.w < 0) {
                    eggs.splice(i, 1);
                }
            }
        }

        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#130f2d');
            grad.addColorStop(0.48, '#3a2e83');
            grad.addColorStop(1, '#89ddff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            drawAurora();
            drawStars();
            drawClouds();
        }

        function drawGround() {
            const groundGrad = ctx.createLinearGradient(0, height - groundHeight, 0, height);
            groundGrad.addColorStop(0, '#4ad86d');
            groundGrad.addColorStop(0.18, '#259d63');
            groundGrad.addColorStop(1, '#6f4120');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, height - groundHeight, width, groundHeight);

            ctx.fillStyle = '#c8ff83';
            ctx.fillRect(0, height - groundHeight, width, 8);

            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            for (let x = -20; x < width + 40; x += 26) {
                ctx.fillRect(x + (frameCount % 26), height - groundHeight + 16, 8, 4);
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            frameCount++;
            bgOffset1 += gameSpeed * 0.2;
            bgOffset2 += gameSpeed * 0.5;
            cloudOffset += gameSpeed * 0.18;
            starTwinkle += 0.04;
            gameSpeed += 0.001;

            spawnObjects();
            updatePhysics();

            ctx.clearRect(0, 0, width, height);

            drawSky();

            ctx.save();
            ctx.translate(-(bgOffset1 % 2000), 0);
            drawMountains(0, groundHeight + 34, 170, 'rgba(39, 34, 88, 0.95)');
            drawMountains(-2000, groundHeight + 34, 170, 'rgba(39, 34, 88, 0.95)');
            ctx.restore();

            ctx.save();
            ctx.translate(-(bgOffset2 % 2000), 0);
            drawMountains(100, groundHeight - 4, 88, 'rgba(79, 190, 143, 0.92)');
            drawMountains(-1900, groundHeight - 4, 88, 'rgba(79, 190, 143, 0.92)');
            ctx.restore();

            drawGround();

            obstacles.forEach(drawRock);
            eggs.forEach(drawEgg);
            drawDino();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', { volume: 0.72, cooldown: 200 });
            feedback.showFail();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        function jump() {
            if (!gameActive) return;
            if (dino.grounded) {
                dino.vy = dino.jumpStrength;
                dino.grounded = false;
                audio.playSFX('jump', { volume: 0.44, cooldown: 120 });
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.5, cooldown: 150 });
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.5, cooldown: 150 });
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            jump();
        });

        resize();
    });
    </script>
</body>
</html>
