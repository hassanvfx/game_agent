<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Stream Sprint</title>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide, hud/ui=Rajdhani via catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-top: #0a1025;
            --bg-bottom: #1b0f38;
            --panel-top: rgba(18, 24, 56, 0.86);
            --panel-bottom: rgba(42, 18, 73, 0.82);
            --panel-border: rgba(130, 239, 255, 0.4);
            --text-main: #f7f3ff;
            --text-soft: rgba(235, 240, 255, 0.82);
            --accent-cyan: #67e8f9;
            --accent-pink: #ff5fd2;
            --accent-gold: #ffd75e;
            --danger: #ff6b7d;
            --success: #63f59b;
            --shadow-deep: rgba(0, 0, 0, 0.42);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.12), transparent 32%),
                radial-gradient(circle at 80% 15%, rgba(255, 95, 210, 0.14), transparent 22%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            transition: transform 120ms ease;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 1rem;
        }

        .panel {
            position: relative;
            width: min(22rem, calc(100vw - 2rem));
            padding: 1.4rem 1.1rem 1.2rem;
            text-align: center;
            border-radius: 1.5rem;
            pointer-events: auto;
            background:
                linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 1rem 2.2rem var(--shadow-deep),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(10px);
            opacity: 0.7;
        }

        .panel::before {
            width: 8rem;
            height: 8rem;
            top: -3rem;
            right: -2rem;
            background: radial-gradient(circle, rgba(103, 232, 249, 0.35), transparent 65%);
        }

        .panel::after {
            width: 7rem;
            height: 7rem;
            left: -2rem;
            bottom: -2rem;
            background: radial-gradient(circle, rgba(255, 95, 210, 0.25), transparent 65%);
        }

        .brand-row {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.75rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            background: rgba(7, 11, 30, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--accent-cyan);
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .streamer-badge {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            border-radius: 999px;
            font-size: 1.1rem;
            background: linear-gradient(180deg, #ffe27a, #ff9d4d);
            box-shadow: 0 0 0 3px rgba(255, 215, 94, 0.15);
        }

        .title,
        .results-title {
            margin: 0;
            font-family: "Audiowide", system-ui, sans-serif;
            font-weight: 400;
            letter-spacing: 0.08em;
            line-height: 0.92;
            text-shadow: 0 0.35rem 1rem rgba(0, 0, 0, 0.4);
        }

        .title {
            margin-bottom: 0.8rem;
            font-size: clamp(2.5rem, 10vw, 4rem);
            color: #fff;
        }

        .gradient-text {
            background: linear-gradient(180deg, #ffffff 0%, #c9f7ff 35%, #ff86dd 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 0 0 1.35rem;
            color: var(--text-soft);
            font-size: 0.98rem;
            line-height: 1.45;
            letter-spacing: 0.02em;
        }

        .subtitle strong {
            color: #fff;
            font-weight: 700;
        }

        .floating-prompt {
            display: inline-block;
            color: var(--accent-gold);
            animation: bounce 1.6s infinite;
        }

        .flavor-strip {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            margin: 0 0 1.15rem;
        }

        .flavor-chip {
            padding: 0.38rem 0.72rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .button-row {
            display: flex;
            justify-content: center;
        }

        .button {
            min-width: 12rem;
            border: 0;
            border-radius: 999px;
            padding: 0.9rem 1.35rem;
            font: 700 1rem 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease, background 160ms ease;
        }

        .button:hover,
        .button:focus-visible {
            transform: translateY(-2px);
            filter: brightness(1.04);
            outline: none;
        }

        .button:active {
            transform: scale(0.97);
        }

        .button-primary {
            background: linear-gradient(90deg, #ff5fd2, #8b5cf6);
            box-shadow: 0 0.9rem 1.6rem rgba(139, 92, 246, 0.35);
        }

        .button-secondary {
            background: linear-gradient(90deg, #67e8f9, #60a5fa);
            color: #111827;
            box-shadow: 0 0.9rem 1.6rem rgba(96, 165, 250, 0.28);
        }

        .results-title {
            margin-bottom: 0.8rem;
            font-size: clamp(2.2rem, 8vw, 3.1rem);
            color: #fff;
        }

        .results-score {
            margin-bottom: 0.45rem;
            font-size: 1.45rem;
            font-weight: 700;
            color: #fff;
        }

        .score-accent {
            color: var(--accent-gold);
        }

        .results-copy {
            margin: 0 0 1.3rem;
            color: var(--text-soft);
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .reaction-gif {
            position: absolute;
            right: max(0.85rem, env(safe-area-inset-right, 0px));
            bottom: max(1rem, env(safe-area-inset-bottom, 0px));
            width: min(30vw, 8rem);
            aspect-ratio: 1 / 1;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0.9rem 2rem rgba(0, 0, 0, 0.32);
            background: rgba(9, 13, 31, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 3;
        }

        .reaction-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .reaction-gif img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .reaction-caption {
            position: absolute;
            left: 0.4rem;
            right: 0.4rem;
            bottom: 0.4rem;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            background: rgba(5, 10, 25, 0.62);
            color: #fff;
            font: 700 0.68rem 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
        }

        .hidden { display: none !important; }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: max(0.9rem, env(safe-area-inset-top, 0px));
            left: max(0.9rem, env(safe-area-inset-left, 0px));
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.55rem 0.85rem;
            border-radius: 999px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            background: rgba(6, 10, 30, 0.54);
            border: 1px solid rgba(103, 232, 249, 0.25);
            box-shadow: 0 0.5rem 1.3rem rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .hud-icon {
            font-size: 1rem;
            filter: drop-shadow(0 0 0.35rem rgba(255, 215, 94, 0.4));
        }

        .hud-label {
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.66rem;
        }

        .hud-score {
            color: var(--accent-gold);
            font-size: 1rem;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-overlay span {
            position: absolute;
            display: block;
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 1rem rgba(103, 232, 249, 0.42);
            animation: sparkle 4s ease-in-out infinite;
            opacity: 0.2;
        }

        .ambient-overlay span:nth-child(1) { top: 12%; left: 16%; animation-delay: 0s; }
        .ambient-overlay span:nth-child(2) { top: 25%; right: 18%; animation-delay: 1.1s; }
        .ambient-overlay span:nth-child(3) { bottom: 22%; left: 22%; animation-delay: 2.3s; }
        .ambient-overlay span:nth-child(4) { bottom: 16%; right: 14%; animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        @keyframes sparkle {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.18; }
            50% { transform: translateY(-12px) scale(1.25); opacity: 0.72; }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 1.2rem 0.9rem 1rem;
            }

            .subtitle,
            .results-copy {
                font-size: 0.88rem;
            }

            .button {
                min-width: 11rem;
                font-size: 0.92rem;
                padding: 0.82rem 1.2rem;
            }

            .hud {
                font-size: 0.88rem;
                padding: 0.48rem 0.75rem;
            }

            .reaction-gif {
                width: min(34vw, 5.8rem);
                bottom: max(5.5rem, calc(env(safe-area-inset-bottom, 0px) + 1rem));
            }

            .reaction-caption {
                font-size: 0.56rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        <div class="ambient-overlay" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
        </div>
        <div id="ui-layer" class="screen">
            <div id="start-screen" class="panel">
                <div class="brand-row"><span class="streamer-badge">😎</span> Neon creator mode</div>
                <h1 class="title gradient-text">STREAM SPRINT</h1>
                <p class="subtitle"><span class="floating-prompt">Catch the hype clips 🎵</span><br><strong>Dodge the meltdown drops ❌</strong></p>
                <div class="flavor-strip" aria-hidden="true">
                    <span class="flavor-chip">Glow beats</span>
                    <span class="flavor-chip">Chat chaos</span>
                    <span class="flavor-chip">Fast reflexes</span>
                </div>
                <div class="button-row">
                    <button id="start-btn" class="button button-primary">Go Live</button>
                </div>
            </div>

            <div id="game-over-screen" class="hidden panel">
                <div class="brand-row"><span class="streamer-badge">📡</span> Stream summary</div>
                <h2 class="results-title gradient-text">STREAM DROPPED</h2>
                <div class="results-score">Highlights banked: <span id="finalScore" class="score-accent">0</span></div>
                <p class="results-copy">The chat storm hit your channel. Reset the lights and chase a cleaner combo run.</p>
                <div class="button-row">
                    <button id="restart-btn" class="button button-secondary">Restart Stream</button>
                </div>
            </div>
            
            <div id="hud" class="hud hidden" aria-live="polite">
                <span class="hud-icon">🎵</span>
                <span class="hud-label">Score</span>
                <span id="score" class="hud-score">0</span>
            </div>
            <!-- [agent-note][stage3] resolved-gif: collect/fail reactions -> catalogs/gifs.json -->
            <div id="reaction-gif" class="reaction-gif hidden" aria-hidden="true">
                <img id="reaction-gif-image" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="">
                <div id="reaction-gif-caption" class="reaction-caption">Chat loves that</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ENABLE_ANIMATIONS = true;

        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                collect: {
                    src: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                    alt: "Celebration reaction",
                    caption: "Chat loves that"
                },
                fail: {
                    src: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp",
                    alt: "Streamer rage reaction",
                    caption: "Stream imploded"
                }
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.bgm = this.createAudio(ASSETS.bgm, 0.16, true);
                this.masterReady = false;
                this.sfx = Object.fromEntries(
                    Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.getVolume(key), false)])
                );
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                return {
                    collect: 0.45,
                    bonus: 0.55,
                    start: 0.4,
                    click: 0.35,
                    fail: 0.65
                }[key] ?? 0.5;
            }

            unlock() {
                if (this.masterReady) return;
                this.masterReady = true;
                const unlockables = [this.bgm, ...Object.values(this.sfx)];
                unlockables.forEach((audio) => {
                    try {
                        audio.load();
                    } catch (_) {}
                });
            }

            playBGM() {
                this.unlock();
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                const audio = this.sfx[key];
                if (!audio) return;
                try {
                    audio.pause();
                    audio.currentTime = 0;
                } catch (_) {}
                audio.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionGif = document.getElementById('reaction-gif');
        const reactionGifImage = document.getElementById('reaction-gif-image');
        const reactionGifCaption = document.getElementById('reaction-gif-caption');
        
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let hue = 0;
        let reactionGifTimer = null;

        const palette = {
            bgTop: '#091223',
            bgBottom: '#2a0f3e',
            glowA: '#67e8f9',
            glowB: '#ff5fd2',
            gold: '#ffd75e',
            note: '#63f59b',
            danger: '#ff6b7d',
            avatarSkin: '#ffd56b',
            avatarOutline: '#ff9d3f',
            avatarHair: '#8b5cf6',
            avatarMic: '#8ef5ff'
        };

        // Entities
        let player = { x: 0, y: 0, radius: 30, targetX: 0 };
        let items = [];
        let particles = [];
        let bgOrbs = [];

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            if (!gameActive) player.x = width / 2;
            
            bgOrbs = [];
            for (let i = 0; i < 20; i++) {
                bgOrbs.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 50 + 10,
                    speed: Math.random() * 2 + 0.5,
                    layer: Math.random() > 0.5 ? 'far' : 'near'
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. INPUT HANDLING */
        // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: scoped touch suppression to gameplay surface
        let isDragging = false;
        
        function handleInput(clientX) {
            if (!gameActive) return;
            player.targetX = clientX;
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; handleInput(e.clientX); });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) handleInput(e.clientX); });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDragging = true;
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging) handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; });

        /** 5. GAME LOGIC HELPER CLASSES */
        class Item {
            constructor() {
                this.r = 20;
                this.x = Math.random() * (width - 40) + 20;
                this.y = -50;
                this.speed = Math.random() * 3 + 3 + (score * 0.05);
                this.type = Math.random() > 0.2 ? 'note' : 'hater';
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.2;
            }
            update() {
                this.y += this.speed;
                this.angle += this.spin;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                if (this.type === 'note') {
                    ctx.shadowColor = palette.note;
                    ctx.shadowBlur = 16;
                    ctx.fillStyle = palette.note;
                    ctx.font = "700 28px Rajdhani, system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("♪", 0, 0);

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.shadowColor = palette.danger;
                    ctx.shadowBlur = 18;

                    ctx.beginPath();
                    ctx.moveTo(0, -18);
                    ctx.lineTo(16, 14);
                    ctx.lineTo(-16, 14);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 107, 125, 0.92)';
                    ctx.fill();

                    ctx.font = "700 18px Rajdhani, system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = '#fff7fb';
                    ctx.fillText("!", 0, 4);
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 4 + 3;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /** 6. CORE GAME FUNCTIONS */
        function showReaction(type) {
            const entry = ASSETS.gifs[type];
            if (!entry) return;
            reactionGifImage.src = entry.src;
            reactionGifImage.alt = entry.alt;
            reactionGifCaption.textContent = entry.caption;
            reactionGif.classList.remove('hidden');
            requestAnimationFrame(() => reactionGif.classList.add('visible'));
            clearTimeout(reactionGifTimer);
            reactionGifTimer = setTimeout(() => {
                reactionGif.classList.remove('visible');
                setTimeout(() => reactionGif.classList.add('hidden'), 180);
            }, type === 'fail' ? 1900 : 1100);
        }

        function initGame() {
            score = 0;
            items = [];
            particles = [];
            player.x = width / 2;
            player.targetX = width / 2;
            document.getElementById('score').innerText = score;
            frameCount = 0;
            reactionGif.classList.add('hidden');
            reactionGif.classList.remove('visible');
        }

        function drawBackground() {
            hue = (hue + 0.35) % 360;
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, palette.bgTop);
            gradient.addColorStop(0.55, `hsl(${(hue + 225) % 360}, 60%, 15%)`);
            gradient.addColorStop(1, palette.bgBottom);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const beamGradient = ctx.createRadialGradient(width * 0.5, height * 0.2, 20, width * 0.5, height * 0.2, width * 0.55);
            beamGradient.addColorStop(0, 'rgba(103, 232, 249, 0.13)');
            beamGradient.addColorStop(0.55, 'rgba(255, 95, 210, 0.08)');
            beamGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = beamGradient;
            ctx.fillRect(0, 0, width, height);

            bgOrbs.forEach((orb, index) => {
                orb.y -= orb.speed;
                if (orb.y < -50) {
                    orb.y = height + 50;
                    orb.x = Math.random() * width;
                }

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
                ctx.fillStyle = orb.layer === 'far'
                    ? 'rgba(255, 255, 255, 0.04)'
                    : (index % 2 === 0 ? 'rgba(103, 232, 249, 0.08)' : 'rgba(255, 95, 210, 0.08)');
                ctx.fill();
            });

            for (let i = 0; i < 5; i++) {
                const x = ((frameCount * (0.9 + i * 0.12)) + i * 170) % (width + 160) - 80;
                ctx.fillStyle = i % 2 === 0 ? 'rgba(103, 232, 249, 0.06)' : 'rgba(255, 215, 94, 0.045)';
                ctx.fillRect(x, 0, 18, height);
            }
        }

        function drawPlayer() {
            player.x += (player.targetX - player.x) * 0.15;

            ctx.save();
            ctx.translate(player.x, player.y);
            
            const bounce = ENABLE_ANIMATIONS ? Math.sin(frameCount * 0.1) * 5 : 0;
            ctx.translate(0, bounce);

            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 16;

            // Glow aura
            const aura = ctx.createRadialGradient(0, 0, 8, 0, 0, player.radius + 18);
            aura.addColorStop(0, 'rgba(255, 215, 94, 0.3)');
            aura.addColorStop(0.5, 'rgba(255, 95, 210, 0.16)');
            aura.addColorStop(1, 'rgba(255, 95, 210, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius + 18, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = palette.avatarSkin;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = palette.avatarOutline;
            ctx.stroke();

            // Hair cap
            ctx.beginPath();
            ctx.arc(0, -6, player.radius - 6, Math.PI, 0);
            ctx.lineTo(player.radius - 6, -6);
            ctx.lineTo(-(player.radius - 6), -6);
            ctx.closePath();
            ctx.fillStyle = palette.avatarHair;
            ctx.fill();

            // Headset arc
            ctx.strokeStyle = '#d7f9ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, -2, player.radius + 4, Math.PI * 1.08, Math.PI * 1.92);
            ctx.stroke();

            ctx.fillStyle = '#1f2937';
            ctx.beginPath(); ctx.arc(-25, 2, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(25, 2, 6, 0, Math.PI * 2); ctx.fill();

            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-10, -4, 7, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -5, 7, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#111827';
            ctx.beginPath(); ctx.arc(-9, -3, 2.7, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(11, -4, 2.7, 0, Math.PI * 2); ctx.fill();

            // Blush
            ctx.fillStyle = 'rgba(255, 95, 146, 0.35)';
            ctx.beginPath(); ctx.ellipse(-18, 6, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(18, 7, 5, 3, 0, 0, Math.PI * 2); ctx.fill();

            // Mouth
            ctx.beginPath();
            ctx.arc(0, 9, 9, 0.12, Math.PI - 0.12, false);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#8a1237';
            ctx.stroke();

            // Microphone
            ctx.strokeStyle = '#bffaff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(20, 8);
            ctx.lineTo(30, 12);
            ctx.stroke();

            ctx.fillStyle = palette.avatarMic;
            ctx.beginPath();
            ctx.ellipse(33, 13, 6, 4.5, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, width, height);
            frameCount++;

            drawBackground();
            drawPlayer();

            if (frameCount % 40 === 0) {
                items.push(new Item());
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                const dx = player.x - item.x;
                const dy = player.y - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + item.r) {
                    if (item.type === 'note') {
                        score += 10;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect');
                        if (score % 50 === 0) {
                            audio.playSFX('bonus');
                        }
                        showReaction('collect');
                        for (let j = 0; j < 8; j++) particles.push(new Particle(item.x, item.y, palette.note));
                    } else {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                } else if (item.y > height + 50) {
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showReaction('fail');
            
            canvas.style.transform = "translate(5px, 5px)";
            setTimeout(() => canvas.style.transform = "none", 100);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 7. UI CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
