<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Escape the Rising Melt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- [agent-note][stage4] remapped-font: title/buttons=Russo One, ui/body=Rajdhani from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --sky-top: #1f2d77;
            --sky-mid: #8840a8;
            --sky-glow: #ff9f6e;
            --sky-bottom: #ffd36a;

        }

        .title-text,

        .screen-card {

            max-height: min(82vh, 34rem);
            overflow-y: auto;

        .screen-card::before {

            pointer-events: none;
        }

        .hud-pill {
            border-radius: 999px;
            min-width: 0;
        }

        #ui-layer {
            padding:
                max(1rem, env(safe-area-inset-top))
                max(0.75rem, env(safe-area-inset-right))
                max(1rem, env(safe-area-inset-bottom))
                max(0.75rem, env(safe-area-inset-left));
            box-sizing: border-box;
        }

        #hud {
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            right: max(1rem, env(safe-area-inset-right));
        }

        #start-btn,
        #restart-btn {
            min-height: 3.5rem;
            touch-action: manipulation;
        }

        @media (max-width: 640px) {
            .p-8 { padding: 1.25rem; }
            .text-2xl { font-size: 1.2rem; }
            .body-copy { max-width: 16rem; line-height: 1.2; }
            .reaction-gif.collect { top: 6rem; }
            .reaction-gif.fail { bottom: 0.75rem; }
        }

        .wiggle { animation: wiggle 2s linear infinite; }

        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0); }
            15% { transform: rotateZ(-5deg); }
            20% { transform: rotateZ(3deg); }
            25% { transform: rotateZ(-5deg); }
            30% { transform: rotateZ(2deg); }
            35%, 100% { transform: rotateZ(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .reaction-layer {
            position: absolute;
            inset: 0;
            z-index: 35;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-gif {
            position: absolute;
            right: 0.8rem;
            width: clamp(84px, 22vw, 128px);
            border-radius: 16px;
            border: 3px solid rgba(255, 248, 190, 0.85);
            box-shadow: 0 10px 24px rgba(10, 5, 25, 0.35);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            background: rgba(21, 14, 52, 0.55);
        }

        .reaction-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .reaction-gif.collect {
            top: 5.5rem;
        }

        .reaction-gif.fail {
            bottom: 1.25rem;
        }
    </style>

<script>
/**
 * §2 & §3 Core Engine & Config
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Config Management
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
for (const key in window.gameConfigDefs) {
    window.gameConfig[key] = window.gameConfigDefs[key].value;
}

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'heroColor') {
             // Will be picked up next frame
        }
    }
};

// Audio Manager
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = document.getElementById('bgm_main');
        this.sfxStart = document.getElementById('sfx_start');
        this.sfxJump = document.getElementById('sfx_jump');
        this.sfxLand = document.getElementById('sfx_land');
        this.sfxCollect = document.getElementById('sfx_collect');
        this.sfxDie = document.getElementById('sfx_die');
        this.unlocked = false;
        this.userPrimed = false;
        this.sfxCooldowns = new Map();
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        this.unlocked = true;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.startLoop();
    }

    primeFromGesture() {
        this.userPrimed = true;
        this.init();
    }

    startLoop() {
        if (!this.bgmNode || !this.userPrimed) return;
        this.bgmNode.volume = 0.2;
        if (gameState === 'PLAYING') {
            this.bgmNode.play().catch(() => {});
        }
    }

    stopLoop() {
        if (!this.bgmNode) return;
        this.bgmNode.pause();
        this.bgmNode.currentTime = 0;
    }

    setLoopPaused(paused) {
        if (!this.bgmNode) return;
        if (paused) {
            this.bgmNode.pause();
        } else if (this.userPrimed && gameState === 'PLAYING') {
            this.bgmNode.play().catch(() => {});
        }
    }

    playNode(node, volume = 0.5) {
        if (!node || !this.userPrimed) return;
        node.volume = volume;
        try {
            node.pause();
            node.currentTime = 0;
            node.play().catch(() => {});
        } catch (_) {}
    }

    canPlay(key, delayMs = 120) {
        const now = performance.now();
        const nextAllowed = this.sfxCooldowns.get(key) || 0;
        if (now < nextAllowed) return false;
        this.sfxCooldowns.set(key, now + delayMs);
        return true;
    }

    playSfx(type) {
        if (!this.userPrimed) return;
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        if (type === 'start' && this.canPlay('start', 250)) {
            this.playNode(this.sfxStart, 0.5);
        } else if (type === 'jump' && this.canPlay('jump', 90)) {
            this.playNode(this.sfxJump, 0.32);
        } else if (type === 'land' && this.canPlay('land', 110)) {
            this.playNode(this.sfxLand, 0.22);
        } else if (type === 'collect' && this.canPlay('collect', 140)) {
            this.playNode(this.sfxCollect, 0.4);
        } else if (type === 'die' && this.canPlay('die', 300)) {
            this.playNode(this.sfxDie, 0.55);
        }
    }

    synthJump() {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    synthCoin() {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2000, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }
    
    synthExplosion() {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
}

const audio = new AudioManager();

/**
 * Game Logic
 */
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let lastTime = 0;
let cameraY = 0;
let lavaY = 0;
let highScore = 0;

// Entities
const player = {
    x: 0, y: 0, vx: 0, vy: 0, 
    width: 40, height: 40, 
    onGround: false,
    faceDir: 1,
    squash: 1
};

let platforms = [];
let particles = [];
let tokens = [];
let skyDrift = 0;
let previousOnGround = false;
let reactionTimers = {};

// Input
let inputActive = false;
let inputX = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function initGame() {
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight - 200;
    player.vx = 0;
    player.vy = 0;
    player.squash = 1;
    
    platforms = [];
    tokens = [];
    particles = [];
    
    // Initial platforms
    platforms.push({ x: window.innerWidth/2 - 100, y: window.innerHeight - 100, w: 200, h: 20, type: 'ground' });
    for(let i=1; i<10; i++) {
        spawnPlatform(window.innerHeight - 100 - (i * 120));
    }
    
    cameraY = 0;
    lavaY = window.innerHeight + 100;
    score = 0;
    previousOnGround = false;
    hideReaction('collect');
    hideReaction('fail');
    
    document.getElementById('score').innerText = score;
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    gameState = 'PLAYING';
    lastTime = performance.now();
    
    audio.init();
    requestAnimationFrame(gameLoop);
}

function spawnPlatform(y) {
    const w = 80 + Math.random() * 100;
    const x = Math.random() * (window.innerWidth - w);
    platforms.push({ x, y, w, h: 20, type: 'normal' });
    
    // Chance to spawn token
    if (Math.random() > 0.7) {
        tokens.push({ x: x + w/2, y: y - 30, collected: false, wobble: Math.random() * Math.PI });
    }
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 5 + 2
        });
    }
}

function showReaction(type, duration = 900) {
    const node = document.getElementById(type + '-gif');
    if (!node) return;
    node.classList.add('show');
    clearTimeout(reactionTimers[type]);
    reactionTimers[type] = setTimeout(() => hideReaction(type), duration);
}

function hideReaction(type) {
    const node = document.getElementById(type + '-gif');
    if (!node) return;
    node.classList.remove('show');
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    skyDrift += dt * 0.015;

    // Physics
    const gravity = window.gameConfig.gravity;
    player.vy += gravity;
    
    // Horizontal Movement (Tilt/Touch follow)
    if (inputActive) {
        const targetX = inputX;
        const diff = targetX - player.x;
        player.vx = diff * 0.1;
        player.faceDir = diff > 0 ? 1 : -1;
    } else {
        player.vx *= 0.9;
    }
    
    player.x += player.vx;
    player.y += player.vy;
    
    // Squash recover
    player.squash += (1 - player.squash) * 0.1;

    // Boundaries
    if (player.x < 0) { player.x = 0; player.vx *= -0.5; }
    if (player.x > window.innerWidth) { player.x = window.innerWidth; player.vx *= -0.5; }

    // Platform Collision
    player.onGround = false;
    if (player.vy > 0) { // Only check when falling
        for (let p of platforms) {
            if (player.x > p.x - player.width/2 && 
                player.x < p.x + p.w + player.width/2 &&
                player.y + player.height/2 >= p.y &&
                player.y + player.height/2 <= p.y + p.h + player.vy + 2) {
                
                player.y = p.y - player.height/2;
                player.vy = 0;
                player.onGround = true;
                player.squash = 1.2; // Land squash
                break;
            }
        }
    }

    if (player.onGround && !previousOnGround) {
        audio.playSfx('land');
    }
    previousOnGround = player.onGround;

    // Camera follow
    const targetCamY = -player.y + window.innerHeight * 0.6;
    if (targetCamY > cameraY) {
        cameraY += (targetCamY - cameraY) * 0.1;
    }

    // Lava Logic
    lavaY -= window.gameConfig.lavaSpeed * (1 + score * 0.001); // Lava rises (y decreases in world space)
    // Convert lava world Y to screen Y for check
    const screenLavaY = lavaY + cameraY;
    
    // Death Check
    if (player.y > -cameraY + window.innerHeight + 50 || player.y > lavaY) {
        die();
    }

    // Platform Management
    // Remove platforms below lava
    platforms = platforms.filter(p => p.y < lavaY + window.innerHeight); // Keep some under lava for visual
    
    // Spawn new platforms
    const highestPlat = platforms.reduce((min, p) => p.y < min ? p.y : min, Infinity);
    if (highestPlat > -cameraY - 100) {
        spawnPlatform(highestPlat - 100 - Math.random() * 50);
    }

    // Tokens
    tokens.forEach(t => {
        t.wobble += dt * 5;
        if (!t.collected) {
            const dx = player.x - t.x;
            const dy = player.y - t.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 40) {
                t.collected = true;
                score += 100;
                audio.playSfx('collect');
                showReaction('collect', 850);
                createParticles(t.x, t.y, '#FFD700', 10);
                document.getElementById('score').innerText = score;
            }
        }
    });
    tokens = tokens.filter(t => !t.collected && t.y < lavaY + window.innerHeight);

    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Score based on height
    const heightScore = Math.floor((-player.y + window.innerHeight)/10);
    if (heightScore > score) {
        score = heightScore;
        document.getElementById('score').innerText = score;
    }
}

function die() {
    gameState = 'GAMEOVER';
    audio.setLoopPaused(true);
    audio.playSfx('die');
    showReaction('fail', 1800);
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function jump() {
    if (gameState !== 'PLAYING') return;
    if (player.onGround) {
        player.vy = -window.gameConfig.jumpForce;
        player.squash = 0.6; // Jump stretch
        createParticles(player.x, player.y + 20, '#fff', 5);
        audio.playSfx('jump');
    }
}

function draw() {
    // Clear
    const skyGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    skyGradient.addColorStop(0, '#1f2d77');
    skyGradient.addColorStop(0.52, '#8840a8');
    skyGradient.addColorStop(0.8, '#ff9f6e');
    skyGradient.addColorStop(1, '#ffd36a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 6; i++) {
        const driftX = (i * 90 + skyDrift * (12 + i * 2)) % (window.innerWidth + 160) - 80;
        const driftY = 90 + i * 70;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.ellipse(driftX, driftY, 44, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(driftX + 26, driftY - 8, 34, 12, 0, 0, Math.PI * 2);
        ctx.ellipse(driftX - 24, driftY - 6, 28, 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.save();
    // Apply Camera
    ctx.translate(0, cameraY);

    // Draw Platforms
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#2d1737';
    platforms.forEach(p => {
        const platformTop = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
        if (p.type === 'ground') {
            platformTop.addColorStop(0, '#8d4a2d');
            platformTop.addColorStop(1, '#5b2d1f');
        } else {
            platformTop.addColorStop(0, '#fff9d6');
            platformTop.addColorStop(1, '#ffcb85');
        }

        ctx.fillStyle = 'rgba(28, 14, 44, 0.28)';
        ctx.fillRect(p.x + 5, p.y + 7, p.w, p.h + 2);

        ctx.fillStyle = platformTop;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = p.type === 'ground' ? '#b7ff74' : '#fff6ef';
        ctx.fillRect(p.x + 8, p.y + 4, Math.max(20, p.w - 16), 4);

        ctx.fillStyle = '#6f3751';
        ctx.beginPath();
        ctx.arc(p.x + 10, p.y + 10, 2.5, 0, Math.PI * 2);
        ctx.arc(p.x + p.w - 10, p.y + 10, 2.5, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Tokens
    tokens.forEach(t => {
        const yOff = Math.sin(t.wobble) * 5;
        ctx.fillStyle = 'rgba(255, 222, 130, 0.2)';
        ctx.beginPath();
        ctx.arc(t.x, t.y + yOff, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.arc(t.x, t.y + yOff, 15, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff8ef';
        ctx.font = 'bold 16px "Russo One"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', t.x, t.y + yOff + 1);
    });

    // Draw Player (hero sprout)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.scale(player.faceDir, player.squash);

    ctx.strokeStyle = '#2d1737';
    ctx.lineWidth = 3;

    if (player.onGround) {
        ctx.beginPath(); ctx.moveTo(-10, 18); ctx.lineTo(-11, 30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(11, 30); ctx.stroke();
    } else {
        ctx.beginPath(); ctx.moveTo(-10, 18); ctx.lineTo(-17, 27); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(17, 27); ctx.stroke();
    }

    const heroGradient = ctx.createLinearGradient(0, -28, 0, 28);
    heroGradient.addColorStop(0, '#9dff89');
    heroGradient.addColorStop(0.55, window.gameConfig.heroColor);
    heroGradient.addColorStop(1, '#3a9d47');

    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 8, 28, 24, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = heroGradient;
    ctx.beginPath();
    ctx.moveTo(0, -27);
    ctx.bezierCurveTo(25, -25, 28, 18, 0, 26);
    ctx.bezierCurveTo(-28, 18, -25, -25, 0, -27);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#7be26c';
    ctx.beginPath();
    ctx.ellipse(-7, -22, 7, 14, -0.8, 0, Math.PI * 2);
    ctx.ellipse(7, -22, 7, 14, 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(38, 86, 39, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.quadraticCurveTo(-2, -2, 0, 18);
    ctx.stroke();

    ctx.strokeStyle = '#2d1737';
    ctx.lineWidth = 3;
    ctx.fillStyle = '#2d1737';
    ctx.beginPath(); ctx.arc(-8, -5, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -5, 3.2, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7, -6, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -6, 1.2, 0, Math.PI*2); ctx.fill();

    ctx.beginPath();
    if (player.vy < -5) {
        ctx.arc(0, 5, 5, 0, Math.PI*2);
        ctx.stroke();
    } else {
        ctx.arc(0, 4, 8, 0.1, Math.PI - 0.1, false);
        ctx.stroke();
    }

    ctx.restore();

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.rect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
    
    // Draw Lava
    const time = performance.now() * 0.002;
    const lavaGradient = ctx.createLinearGradient(0, lavaY - 40, 0, lavaY + 220);
    lavaGradient.addColorStop(0, '#ffef8d');
    lavaGradient.addColorStop(0.18, '#ff8b4d');
    lavaGradient.addColorStop(0.65, '#ff4d38');
    lavaGradient.addColorStop(1, '#9c1d28');
    ctx.fillStyle = lavaGradient;
    ctx.beginPath();
    ctx.moveTo(-100, lavaY);
    for(let x=0; x<=window.innerWidth; x+=20) {
        ctx.lineTo(x, lavaY + Math.sin(x * 0.02 + time) * 20);
    }
    ctx.lineTo(window.innerWidth, lavaY + 1000);
    ctx.lineTo(0, lavaY + 1000);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 252, 204, 0.55)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-100, lavaY);
    for(let x=0; x<=window.innerWidth; x+=20) {
        ctx.lineTo(x, lavaY + Math.sin(x * 0.02 + time) * 20 - 4);
    }
    ctx.stroke();
    
    // Lava bubbles
    ctx.fillStyle = '#ffd54f';
    for(let i=0; i<5; i++) {
        const bx = (time * 50 + i * 100) % window.innerWidth;
        const by = lavaY + 40 + Math.sin(time + i) * 10;
        ctx.beginPath();
        ctx.arc(bx, by, 5 + Math.sin(time*2 + i)*2, 0, Math.PI*2);
        ctx.fill();
    }
    
    ctx.restore();
}

function gameLoop() {
    const now = performance.now();
    const dt = (now - lastTime) / 1000 * 60; // Normalize to 60fps
    lastTime = now;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    
    requestAnimationFrame(gameLoop);
}

// Event Listeners
const handleStart = (e) => {
    audio.primeFromGesture();
    // e.preventDefault(); // Removed to allow button clicks
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        const target = e.target;
        if (target.id === 'start-btn' || target.id === 'restart-btn') {
            audio.playSfx('start');
            initGame();
        }
    } else if (gameState === 'PLAYING') {
        inputActive = true;
        inputX = e.clientX || e.touches[0].clientX;
        jump();
    }
};

const handleMove = (e) => {
    if (gameState === 'PLAYING') {
        inputActive = true;
        inputX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
    }
};

const handleEnd = (e) => {
    // Keep moving in last direction or stop? 
    // For this game, let's keep moving towards last touch or stop if we want precise control.
    // Actually, "The Floor is Lava" usually requires precise jumps. 
    // Let's stop movement on release for better control.
    inputActive = false;
};

// Unified Pointer Events
canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleStart(e);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
    e.preventDefault();
    handleMove(e);
}, { passive: false });

canvas.addEventListener('pointerup', (e) => {
    e.preventDefault();
    handleEnd(e);
}, { passive: false });

// UI Button bindings
document.getElementById('start-btn').addEventListener('click', () => {
    audio.primeFromGesture();
    audio.playSfx('start');
    initGame();
});
document.getElementById('restart-btn').addEventListener('click', () => {
    audio.primeFromGesture();
    audio.playSfx('start');
    initGame();
});

// Init
resize();
document.addEventListener('DOMContentLoaded', () => {
    resize();
    // Initial draw
    const introGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    introGradient.addColorStop(0, '#1f2d77');
    introGradient.addColorStop(0.52, '#8840a8');
    introGradient.addColorStop(0.8, '#ff9f6e');
    introGradient.addColorStop(1, '#ffd36a');
    ctx.fillStyle = introGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});

</script>
