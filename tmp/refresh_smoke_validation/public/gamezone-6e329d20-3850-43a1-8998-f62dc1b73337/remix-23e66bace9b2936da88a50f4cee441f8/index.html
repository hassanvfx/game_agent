<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Loop Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap">
<style>
:root{--ink:#050617;--blue:#16b8ff;--blue2:#125bff;--gold:#ffd63f;--hot:#ff2bc2;--lime:#7cff6b;--panel:rgba(4,8,28,.78);--edge:rgba(89,239,255,.78);--white:#f6fbff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050617;color:var(--white);font-family:Rajdhani,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none;background:#050617}#game-container{position:relative;width:100%;height:100%;overflow:hidden}
#ui-layer{position:absolute;inset:0;z-index:20;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:center}.panel{pointer-events:auto;width:min(88vw,430px);max-height:84vh;overflow:auto;border:2px solid var(--edge);border-radius:26px;background:linear-gradient(160deg,rgba(5,9,32,.92),rgba(18,5,50,.84));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 22px 70px rgba(0,0,0,.55),0 0 34px rgba(22,184,255,.2);padding:clamp(20px,6vw,34px);text-align:center;position:relative}.panel:before{content:"";position:absolute;inset:10px;border-radius:20px;border:1px dashed rgba(255,214,63,.24);pointer-events:none}.hidden{display:none!important}
h1,h2,.brand{font-family:Audiowide,system-ui,sans-serif;letter-spacing:.02em;text-transform:uppercase;margin:0;text-shadow:0 0 16px rgba(22,184,255,.6),0 3px 0 #00154a}.title{font-size:clamp(2.35rem,10vw,4.4rem);line-height:.92}.subtitle{font-size:clamp(1.18rem,4.7vw,1.6rem);line-height:1.05;margin:16px auto 8px;color:#d8fbff;max-width:19rem;font-weight:600}.callout{color:var(--gold);font-weight:700}.btn{font-family:Audiowide,system-ui,sans-serif;min-height:58px;border:0;border-radius:18px;padding:15px 28px;margin-top:18px;color:#03102c;background:linear-gradient(180deg,#fff477,#ffb800);box-shadow:0 8px 0 #7d3a00,0 0 22px rgba(255,214,63,.45);font-size:clamp(1.05rem,4.4vw,1.45rem);text-transform:uppercase;touch-action:manipulation}.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #7d3a00}
#hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.pill{background:var(--panel);border:1.5px solid var(--edge);border-radius:999px;padding:8px 12px;box-shadow:0 0 18px rgba(22,184,255,.22);font-family:Audiowide,system-ui,sans-serif;font-size:clamp(.72rem,3.2vw,.95rem);white-space:nowrap}.pill strong{color:var(--gold)}#tip{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(86vw,390px);text-align:center;color:#d8fbff;background:rgba(3,6,21,.5);border:1px solid rgba(124,255,107,.36);border-radius:999px;padding:8px 12px;font-weight:600;pointer-events:none}.flash{position:absolute;right:14px;top:86px;z-index:30;pointer-events:none;font-family:Audiowide,system-ui,sans-serif;color:var(--gold);opacity:0;transform:translateY(8px) scale(.92);transition:.18s;text-shadow:0 0 10px #ffb800}.flash.show{opacity:1;transform:translateY(0) scale(1)}
@media (min-aspect-ratio:9/14){.panel{width:min(80vw,430px)}#tip{bottom:12px}.title{font-size:clamp(2rem,7vw,3.7rem)}}
</style>
</head>
<body>
<div id="game-container"><canvas id="gameCanvas" aria-label="Neon Loop Rush playable canvas"></canvas><div id="ring-flash" class="flash">+100 RINGS</div><div id="ui-layer"><section id="start-screen" class="panel"><h1 class="title">Neon<br>Loop Rush</h1><p class="subtitle">Pilot the blue quill rebel upward through sky rails. <span class="callout">Tap to jump</span>, drag to steer, grab rings, outrun the glitch surge.</p><button id="start-btn" class="btn">Start Rush</button></section><section id="game-over-screen" class="panel hidden"><h2 class="title">Surge<br>Caught You</h2><p class="subtitle">Run score: <span class="callout" id="finalScore">0</span></p><button id="restart-btn" class="btn">Retry Rush</button></section><div id="hud" class="hidden"><div class="pill">RUSH <strong id="score">0</strong></div><div class="pill">RINGS + HEIGHT</div></div><div id="tip" class="hidden">Hold left/right to steer • tap while grounded to spring</div></div></div>
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" preload="none" loop></audio><audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio><audio id="sfx_jump" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3" preload="auto"></audio><audio id="sfx_land" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3" preload="auto"></audio><audio id="sfx_collect" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio><audio id="sfx_die" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
<script>

const CONFIG={jumpForce:16,gravity:.8,lavaSpeed:1.5,heroColor:'#16b8ff'};
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight,DPR=1,lastTime=0,gameState='START',score=0,cameraY=0,lavaY=0,skyDrift=0,previousOnGround=false,inputActive=false,inputX=0,loopStarted=false,flashTimer=0;
const player={x:0,y:0,vx:0,vy:0,width:40,height:40,onGround:false,faceDir:1,squash:1,spin:0};let platforms=[],tokens=[],particles=[];const $=id=>document.getElementById(id);
class AudioManager{constructor(){this.ctx=null;this.userPrimed=false;this.nodes={bgm:$('bgm_main'),start:$('sfx_start'),jump:$('sfx_jump'),land:$('sfx_land'),collect:$('sfx_collect'),die:$('sfx_die')};this.cool=new Map()}prime(){this.userPrimed=true;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=this.ctx||new AC();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}catch(_){}}playNode(n,v=.4){if(!this.userPrimed||!n)return;n.volume=v;try{n.pause();n.currentTime=0;n.play().catch(()=>{})}catch(_){}}play(type){const now=performance.now(),next=this.cool.get(type)||0;if(now<next)return;this.cool.set(type,now+120);this.playNode(this.nodes[type],type==='die'?.55:type==='jump'?.32:.42)}loop(on){const n=this.nodes.bgm;if(!n||!this.userPrimed)return;n.volume=.18;if(on)n.play().catch(()=>{});else n.pause()}}
const audio=new AudioManager();function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);
function initGame(){player.x=W/2;player.y=H-200;player.vx=0;player.vy=0;player.squash=1;player.spin=0;platforms=[];tokens=[];particles=[];platforms.push({x:W/2-100,y:H-100,w:200,h:20,type:'ground'});for(let i=1;i<10;i++)spawnPlatform(H-100-i*120);cameraY=0;lavaY=H+100;score=0;previousOnGround=false;inputActive=false;skyDrift=0;$('score').textContent='0';$('hud').classList.remove('hidden');$('tip').classList.remove('hidden');$('start-screen').classList.add('hidden');$('game-over-screen').classList.add('hidden');$('ring-flash').classList.remove('show');gameState='PLAYING';lastTime=performance.now();audio.loop(true);if(!loopStarted){loopStarted=true;requestAnimationFrame(gameLoop)}}
function spawnPlatform(y){const w=80+Math.random()*100;const x=Math.max(8,Math.random()*(W-w-16)+8);const loop=Math.random()>.72;platforms.push({x,y,w,h:20,type:loop?'loop':'normal'});if(Math.random()>.7)tokens.push({x:x+w/2,y:y-30,collected:false,wobble:Math.random()*Math.PI})}
function createParticles(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,color,size:Math.random()*5+2})}
function showFlash(){const f=$('ring-flash');f.classList.add('show');clearTimeout(flashTimer);flashTimer=setTimeout(()=>f.classList.remove('show'),700)}
function update(dt){if(gameState!=='PLAYING')return;skyDrift+=dt*.015;player.vy+=CONFIG.gravity;if(inputActive){const diff=inputX-player.x;player.vx=diff*.1;if(Math.abs(diff)>2)player.faceDir=diff>0?1:-1}else player.vx*=.9;player.x+=player.vx;player.y+=player.vy;player.spin+=Math.abs(player.vx)*.045+Math.max(0,-player.vy)*.02;player.squash+=(1-player.squash)*.1;if(player.x<0){player.x=0;player.vx*=-.5}if(player.x>W){player.x=W;player.vx*=-.5}player.onGround=false;if(player.vy>0){for(const p of platforms){if(player.x>p.x-player.width/2&&player.x<p.x+p.w+player.width/2&&player.y+player.height/2>=p.y&&player.y+player.height/2<=p.y+p.h+player.vy+2){player.y=p.y-player.height/2;player.vy=0;player.onGround=true;player.squash=1.2;break}}}if(player.onGround&&!previousOnGround)audio.play('land');previousOnGround=player.onGround;const targetCamY=-player.y+H*.6;if(targetCamY>cameraY)cameraY+=(targetCamY-cameraY)*.1;lavaY-=CONFIG.lavaSpeed*(1+score*.001);if(player.y>-cameraY+H+50||player.y>lavaY)die();platforms=platforms.filter(p=>p.y<lavaY+H);const highest=platforms.reduce((m,p)=>p.y<m?p.y:m,Infinity);if(highest>-cameraY-100)spawnPlatform(highest-100-Math.random()*50);tokens.forEach(t=>{t.wobble+=dt*5;if(!t.collected){const dx=player.x-t.x,dy=player.y-t.y;if(Math.hypot(dx,dy)<40){t.collected=true;score+=100;audio.play('collect');showFlash();createParticles(t.x,t.y,'#ffd63f',12);$('score').textContent=score}}});tokens=tokens.filter(t=>!t.collected&&t.y<lavaY+H);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.02});particles=particles.filter(p=>p.life>0);const heightScore=Math.floor((-player.y+H)/10);if(heightScore>score){score=heightScore;$('score').textContent=score}}
function die(){if(gameState!=='PLAYING')return;gameState='GAMEOVER';audio.loop(false);audio.play('die');$('finalScore').textContent=score;$('game-over-screen').classList.remove('hidden');$('hud').classList.add('hidden');$('tip').classList.add('hidden');createParticles(player.x,player.y,'#ff2bc2',28)}function jump(){if(gameState==='PLAYING'&&player.onGround){player.vy=-CONFIG.jumpForce;player.squash=.6;createParticles(player.x,player.y+20,'#7cff6b',8);audio.play('jump')}}

function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#061343');g.addColorStop(.45,'#10003c');g.addColorStop(1,'#24062f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.55;for(let i=0;i<14;i++){const y=(i*86+(skyDrift*22)%86)-60;ctx.strokeStyle=i%2?'rgba(255,43,194,.2)':'rgba(22,184,255,.24)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.28,y+38,W*.65,y-38,W,y+24);ctx.stroke()}ctx.globalAlpha=.8;for(let i=0;i<7;i++){const x=(i*92-skyDrift*(18+i*2))%(W+140)-70,y=90+i*82;ctx.strokeStyle='rgba(255,214,63,.16)';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(x,y,46,22,.35,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawPlatform(p){ctx.save();ctx.lineWidth=3;ctx.strokeStyle=p.type==='loop'?'#ffd63f':'#59efff';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=14;if(p.type==='loop'){ctx.beginPath();ctx.ellipse(p.x+p.w/2,p.y-8,p.w*.38,34,0,0,Math.PI*2);ctx.stroke()}const gr=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y);gr.addColorStop(0,p.type==='ground'?'#0d3cff':'#123bff');gr.addColorStop(.5,'#16b8ff');gr.addColorStop(1,p.type==='loop'?'#ff2bc2':'#7cff6b');ctx.fillStyle=gr;ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,10);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(p.x+10,p.y+4,Math.max(12,p.w-20),3);ctx.restore()}
function drawRing(t){const y=t.y+Math.sin(t.wobble)*5;ctx.save();ctx.translate(t.x,y);ctx.rotate(Math.sin(t.wobble)*.25);ctx.shadowColor='#ffd63f';ctx.shadowBlur=16;ctx.lineWidth=6;ctx.strokeStyle='#ffd63f';ctx.beginPath();ctx.ellipse(0,0,15,19,0,0,Math.PI*2);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff7a8';ctx.beginPath();ctx.ellipse(0,-1,9,12,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.scale(player.faceDir,player.squash);ctx.rotate(player.onGround?0:player.spin);ctx.shadowColor='#16b8ff';ctx.shadowBlur=18;const body=ctx.createRadialGradient(-7,-8,4,0,0,28);body.addColorStop(0,'#d9ffff');body.addColorStop(.25,'#16b8ff');body.addColorStop(1,'#123bff');ctx.fillStyle=body;ctx.strokeStyle='#02103b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#0b58ff';for(let i=0;i<5;i++){ctx.save();ctx.rotate(-1.9+i*.55);ctx.beginPath();ctx.moveTo(-3,-17);ctx.lineTo(-5,-42);ctx.lineTo(8,-18);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(6,-6,9,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#061343';ctx.beginPath();ctx.arc(9,-6,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(4,6,9,.1,Math.PI-.15);ctx.stroke();ctx.fillStyle='#ffef78';ctx.fillRect(-18,15,14,7);ctx.fillRect(5,15,16,7);ctx.restore()}
function drawSurge(){const time=performance.now()*.002;const y=lavaY;ctx.save();ctx.shadowColor='#ff2bc2';ctx.shadowBlur=22;const gr=ctx.createLinearGradient(0,y-45,0,y+210);gr.addColorStop(0,'#fff477');gr.addColorStop(.2,'#ff2bc2');gr.addColorStop(.65,'#6114ff');gr.addColorStop(1,'#050617');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-40,y);for(let x=0;x<=W+40;x+=18)ctx.lineTo(x,y+Math.sin(x*.028+time)*18);ctx.lineTo(W+40,y+900);ctx.lineTo(-40,y+900);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=18){const yy=y+Math.sin(x*.028+time)*18-5;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke();ctx.restore()}
function draw(){drawBackground();ctx.save();ctx.translate(0,cameraY);platforms.forEach(drawPlatform);tokens.forEach(drawRing);drawPlayer();particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.rect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.fill();ctx.globalAlpha=1});drawSurge();ctx.restore()}
function gameLoop(){const now=performance.now();const dt=(now-lastTime)/1000*60;lastTime=now;try{update(Math.min(dt,2));draw()}catch(e){console.error(e)}requestAnimationFrame(gameLoop)}
function pointerX(e){return e.clientX??(e.touches&&e.touches[0]?e.touches[0].clientX:W/2)}function playInput(e){if(gameState!=='PLAYING')return;inputActive=true;inputX=pointerX(e);jump()}canvas.addEventListener('pointerdown',e=>{e.preventDefault();playInput(e)},{passive:false});canvas.addEventListener('pointermove',e=>{if(gameState==='PLAYING'){e.preventDefault();inputActive=true;inputX=pointerX(e)}},{passive:false});canvas.addEventListener('pointerup',e=>{e.preventDefault();inputActive=false},{passive:false});canvas.addEventListener('pointercancel',()=>inputActive=false,{passive:true});
function startFromButton(){audio.prime();audio.play('start');initGame()}$('start-btn').addEventListener('click',startFromButton);$('restart-btn').addEventListener('click',startFromButton);
resize();draw();
</script>
</body>
</html>
