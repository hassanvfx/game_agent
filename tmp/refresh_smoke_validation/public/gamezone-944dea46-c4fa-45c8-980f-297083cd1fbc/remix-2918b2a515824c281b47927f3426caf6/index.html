    <style>
        :root {
            --bg-deep: #050816;
            --bg-mid: #0b1533;
            --panel: rgba(8, 15, 37, 0.78);

            --cyan-strong: #2dd4ff;
            --magenta: #ff4d94;
            --amber: #ffd166;
            --road-glow: rgba(96, 245, 255, 0.12);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:

            user-select: none;
            -webkit-user-select: none;

            color: var(--text-main);
        }
        body::before {
            content: '';

            inset: 0;
            pointer-events: none;
            background:

            .hud-card { min-width: 108px; }

        @media (max-width: 420px) {

<body>

<!-- Assets Declaration -->
<img id="asset_player" data-editable="image" data-label="Interceptor Vehicle" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" hidden>

<audio id="bgm_main" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>

<!-- Game Container -->

<script>
/**
 * AUDIO SYSTEM (Web Audio API + Zero DOM Overhead)
 */
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
const audioBuffers = {};
const bgmEl = document.getElementById('bgm_main');
const sfxEls = {
    impact: document.getElementById('sfx_impact'),
    score: document.getElementById('sfx_score'),
    warning: document.getElementById('sfx_warning'),
    restart: document.getElementById('sfx_restart')
};
const feedbackEls = {
    score: document.getElementById('gif-score'),
    fail: document.getElementById('gif-fail')
};
const audioGainConfig = {
    impact: 0.4,
    score: 0.26,
    warning: 0.22,
    restart: 0.28
};
let audioReady = false;
let bgmStarted = false;
let warningCooldown = 0;
let bgmSourceNode = null;

function isSameOriginMedia(src) {
    if (!src) return false;
    try {
        return new URL(src, window.location.href).origin === window.location.origin;
    } catch (e) {
        return false;
    }
}

function createGainNode(level = 1) {
    if (!audioCtx) return null;
    const gain = audioCtx.createGain();
    gain.gain.value = level;
    gain.connect(audioCtx.destination);
    return gain;
}

async function initAudio() {
    if (!audioCtx || audioReady) return;
    const loadBuffer = async (id, src) => {
        if (!src || !isSameOriginMedia(src)) return;
        try {
            const res = await fetch(src);
            if (!res.ok) return;
            const arrayBuffer = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {}
    };

    await Promise.all([
        loadBuffer('impact', sfxEls.impact?.src),
        loadBuffer('score', sfxEls.score?.src),
        loadBuffer('warning', sfxEls.warning?.src),
        loadBuffer('restart', sfxEls.restart?.src),
        loadBuffer('bgm', bgmEl?.src)
    ]);
    audioReady = true;
}

function triggerFeedback(type) {
    const el = feedbackEls[type];
    if (!el) return;
    el.classList.add('is-active');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => {
        el.classList.remove('is-active');
    }, type === 'score' ? 900 : 1100);
}

function playSfx(id) {
    const mediaEl = sfxEls[id];
    if (!audioCtx) {
        if (mediaEl) {
            mediaEl.volume = audioGainConfig[id] ?? 0.25;
            mediaEl.currentTime = 0;
            mediaEl.play().catch(() => {});
        }
        return;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

    const buffer = audioBuffers[id];
    if (buffer) {
        const source = audioCtx.createBufferSource();
        const gain = createGainNode(audioGainConfig[id] ?? 0.25);
        if (!gain) return;
        source.buffer = buffer;
        source.connect(gain);
        source.start(0);
        return;
    }

    if (mediaEl) {
        mediaEl.volume = audioGainConfig[id] ?? 0.25;
        mediaEl.currentTime = 0;
        mediaEl.play().catch(() => {});
        return;
    }

    const osc = audioCtx.createOscillator();
    const gain = createGainNode(0.001);
    if (!gain) return;
    osc.connect(gain);

    if (id === 'impact' || id === 'warning') {
        osc.type = id === 'warning' ? 'square' : 'sawtooth';
        osc.frequency.setValueAtTime(id === 'warning' ? 340 : 100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(id === 'warning' ? 220 : 0.01, audioCtx.currentTime + 0.28);
        gain.gain.setValueAtTime(id === 'warning' ? 0.18 : 0.42, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
    } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(id === 'restart' ? 560 : 820, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(id === 'restart' ? 900 : 1240, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(id === 'restart' ? 0.22 : 0.28, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function stopBgm() {
    if (bgmSourceNode) {
        try { bgmSourceNode.stop(); } catch (e) {}
        bgmSourceNode.disconnect();
        bgmSourceNode = null;
    }
    bgmStarted = false;
}

function playBgm() {
    if (!audioCtx || !audioBuffers.bgm || bgmStarted || audioCtx.state === 'suspended') {
        if (bgmEl && !bgmStarted) {
            bgmEl.volume = 0.18;
            bgmEl.play().then(() => {
                bgmStarted = true;
            }).catch(() => {});
        }
        return;
    }
    const source = audioCtx.createBufferSource();
    const gain = createGainNode(0.18);
    if (!gain) return;
    source.buffer = audioBuffers.bgm;
    source.loop = true;
    source.connect(gain);
    source.start(0);
    bgmSourceNode = source;
    bgmStarted = true;
}

function unlockAudio() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => playBgm()).catch(() => {});
    } else {
        playBgm();
    }
}

function vibrate(style) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
            params: { style: style }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;
let lastTime = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER

// Config Parsing
let gameConfig = { heroSpeed: 6, trafficDensity: 2, gameSpeed: 1.2 };
try {
    const raw = JSON.parse(document.getElementById('game-config').text);
    for (let k in raw) gameConfig[k] = raw[k].value;
    window.gameConfigDefs = raw;
} catch(e) {}

// State
let score = 0;
let health = 100;
let speedMultiplier = 1;
let distance = 0;

// Entities
let player = { x: 0, y: 0, w: 60, h: 100, vx: 0, tilt: 0 };
let enemies = []; // Rogue targets (red)
let civilians = []; // Civilian traffic (white/yellow)
let particles = [];
let roadLines = [];

// Assets
const playerImg = document.getElementById('asset_player');

// Resize Observer
const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    const rect = entry.contentRect;
    
    // Set canvas dimensions
    dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    
    cw = rect.width;
    ch = rect.height;
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!initialized) {
        initGame();
        initialized = true;
        requestAnimationFrame(loop);
    } else {
        // Clamp player
        player.x = Math.max(player.w/2, Math.min(cw - player.w/2, player.x));
        player.y = ch - player.h - 50;
    }
});

function initGame() {
    score = 0;
    health = 100;
    speedMultiplier = 1;
    distance = 0;
    enemies = [];
    civilians = [];
    particles = [];
    roadLines = [];
    warningCooldown = 0;
    Object.values(feedbackEls).forEach(el => el?.classList.remove('is-active'));
    
    player.w = cw * 0.15;
    player.h = player.w * 1.8;
    player.x = cw / 2;
    player.y = ch - player.h - 50;
    player.vx = 0;
    player.tilt = 0;
    
    for(let i=0; i<10; i++) {
        roadLines.push({ y: i * (ch/5) });
    }
    
    setState('PLAYING');
    initAudio();
    playBgm();
}

function setState(state) {
    gameState = state;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    
    if (state === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        playBgm();
    } else {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        stopBgm();
        playSfx('warning');
        triggerFeedback('fail');
    }
}

function spawnEntity() {
    const laneWidth = cw / 4;
    const lanes = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5, laneWidth * 3.5];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    
    const type = Math.random() < 0.3 ? 'criminal' : 'civilian';
    const w = cw * 0.14;
    const h = w * 1.8;
    
    const entity = {
        x: lane,
        y: -h - 50,
        w: w,
        h: h,
        type: type,
        speed: type === 'criminal' ? gameConfig.gameSpeed * 200 : gameConfig.gameSpeed * 150,
        color: type === 'criminal' ? neonPalette.criminal : (Math.random() > 0.5 ? neonPalette.civilianAlt : neonPalette.civilian)
    };
    
    if (type === 'criminal') enemies.push(entity);
    else civilians.push(entity);
}

function createParticles(x, y, color, count, speed) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * speed,
            vy: (Math.random() - 0.5) * speed,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    const speedBase = 300 * gameConfig.gameSpeed * speedMultiplier;
    distance += speedBase * dt;
    if (warningCooldown > 0) warningCooldown -= dt;
    
    // Road Lines
    roadLines.forEach(line => {
        line.y += speedBase * dt;
        if (line.y > ch) line.y -= ch + (ch/5);
    });
    
    // Player Movement (Damped)
    player.x += player.vx * dt;
    player.x = Math.max(player.w/2 + 10, Math.min(cw - player.w/2 - 10, player.x));
    player.tilt = player.vx * 0.05; // Visual tilt
    player.vx *= 0.9; // Friction
    
    if (!isFinite(player.x)) player.x = cw/2;

    // Spawning
    if (Math.random() < 0.02 * gameConfig.trafficDensity) spawnEntity();
    
    // Update Entities
    const updateEntity = (arr, isEnemy) => {
        for (let i = arr.length - 1; i >= 0; i--) {
            let e = arr[i];
            // Relative speed: Player is faster than civilians, similar to criminals
            let relSpeed = speedBase - e.speed;
            e.y += relSpeed * dt;
            
            // Collision
            if (Math.abs(player.x - e.x) < (player.w + e.w)/2 * 0.8 && 
                Math.abs(player.y - e.y) < (player.h + e.h)/2 * 0.8) {
                
                if (isEnemy) {
                    // Takedown
                    score += 500;
                    createParticles(e.x, e.y, '#ef4444', 20, 300);
                    createParticles(e.x, e.y, '#ffffff', 10, 200);
                    playSfx('score');
                    triggerFeedback('score');
                    vibrate('heavy');
                    arr.splice(i, 1);
                    screenShake = 10;
                    continue;
                } else {
                    // Crash
                    health -= 20;
                    createParticles((player.x+e.x)/2, (player.y+e.y)/2, '#fbbf24', 15, 200);
                    playSfx('impact');
                    triggerFeedback('fail');
                    if (warningCooldown <= 0 && health <= 40 && health > 0) {
                        playSfx('warning');
                        warningCooldown = 1.6;
                    }
                    vibrate('medium');
                    arr.splice(i, 1);
                    screenShake = 20;
                    speedMultiplier = 0.5;
                    setTimeout(() => speedMultiplier = 1, 1000);
                    if (health <= 0) setState('GAMEOVER');
                    continue;
                }
            }
            
            if (e.y > ch + 100) arr.splice(i, 1);
        }
    };
    
    updateEntity(enemies, true);
    updateEntity(civilians, false);
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Update HUD
    document.getElementById('score-val').innerText = Math.floor(score);
    document.getElementById('health-val').innerText = Math.max(0, health) + '%';
    
    if (screenShake > 0) screenShake *= 0.9;
    if (screenShake < 0.5) screenShake = 0;
}

let screenShake = 0;
const neonPalette = {
    criminal: '#ff4d94',
    civilian: '#ffd166',
    civilianAlt: '#8af5ff',
    playerCore: '#7dd3fc',
    playerGlow: '#60f5ff',
    playerAccent: '#1d4ed8',
    playerHot: '#ff4d94'
};

function draw() {
    // Clear & Background
    const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    bgGradient.addColorStop(0, '#091124');
    bgGradient.addColorStop(0.55, '#08101e');
    bgGradient.addColorStop(1, '#03060f');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, cw, ch);
    
    const skylineGlow = ctx.createRadialGradient(cw / 2, ch * 0.2, 40, cw / 2, ch * 0.2, cw * 0.7);
    skylineGlow.addColorStop(0, 'rgba(96,245,255,0.22)');
    skylineGlow.addColorStop(1, 'rgba(96,245,255,0)');
    ctx.fillStyle = skylineGlow;
    ctx.fillRect(0, 0, cw, ch);
    
    // Shake
    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    }
    
    // Road Bed
    const roadGradient = ctx.createLinearGradient(0, 0, 0, ch);
    roadGradient.addColorStop(0, '#0e1938');
    roadGradient.addColorStop(0.5, '#091224');
    roadGradient.addColorStop(1, '#050a14');
    ctx.fillStyle = roadGradient;
    ctx.beginPath();
    ctx.moveTo(cw * 0.1, 0);
    ctx.lineTo(cw * 0.9, 0);
    ctx.lineTo(cw, ch);
    ctx.lineTo(0, ch);
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = 'rgba(96,245,255,0.12)';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(cw * 0.1, 0);
    ctx.lineTo(0, ch);
    ctx.moveTo(cw * 0.9, 0);
    ctx.lineTo(cw, ch);
    ctx.stroke();
    
    // Road Lines
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 4;
    ctx.setLineDash([36, 28]);
    roadLines.forEach(line => {
        // Draw 3 lane dividers
        for(let i=1; i<=3; i++) {
            let x = (cw / 4) * i;
            ctx.beginPath();
            ctx.moveTo(x, line.y - ch);
            ctx.lineTo(x, line.y + ch); // Draw long enough to cover
            ctx.stroke();
        }
    });
    ctx.setLineDash([]);
    
    // Draw Entities
    const drawCar = (e) => {
        ctx.save();
        ctx.translate(e.x, e.y);
        
        const bodyGradient = ctx.createLinearGradient(0, -e.h/2, 0, e.h/2);
        bodyGradient.addColorStop(0, e.type === 'criminal' ? '#ff7ab7' : '#fef3c7');
        bodyGradient.addColorStop(0.45, e.color);
        bodyGradient.addColorStop(1, e.type === 'criminal' ? '#7a123c' : '#145a76');
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        ctx.beginPath();
        ctx.roundRect(-e.w/2 + 4, -e.h/2 + 8, e.w, e.h, 10);
        ctx.fill();
        
        // Outer glow
        ctx.shadowColor = e.type === 'criminal' ? 'rgba(255,77,148,0.55)' : 'rgba(96,245,255,0.4)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 10);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Cockpit
        ctx.fillStyle = '#081222';
        ctx.beginPath();
        ctx.roundRect(-e.w/2 + 6, -e.h/2 + 10, e.w - 12, e.h * 0.22, 6);
        ctx.fill();
        ctx.fillRect(-e.w/2 + 7, e.h/2 - 22, e.w - 14, e.h * 0.12);
        
        // Accent striping
        ctx.fillStyle = e.type === 'criminal' ? '#1a1030' : 'rgba(255,255,255,0.72)';
        ctx.fillRect(-e.w * 0.1, -e.h * 0.18, e.w * 0.2, e.h * 0.56);
        
        if (e.type === 'criminal') {
            ctx.fillStyle = '#ff4d94';
            ctx.fillRect(-e.w/2 + 7, -e.h/2 + 30, e.w - 14, e.h * 0.35);
        } else {
            ctx.fillStyle = 'rgba(96,245,255,0.55)';
            ctx.fillRect(-e.w/2 + 7, -e.h/2 + 26, e.w - 14, 8);
        }
        
        // Head/tail highlights
        ctx.fillStyle = '#ff8fab';
        ctx.fillRect(-e.w/2 + 4, e.h/2 - 5, 10, 4);
        ctx.fillRect(e.w/2 - 14, e.h/2 - 5, 10, 4);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-e.w/2 + 4, -e.h/2 + 2, 10, 4);
        ctx.fillRect(e.w/2 - 14, -e.h/2 + 2, 10, 4);
        
        ctx.restore();
    };
    
    civilians.forEach(drawCar);
    enemies.forEach(drawCar);
    
    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt * 0.05); // Tilt
    
    const playerPulse = (Math.sin(Date.now() / 140) + 1) * 0.5;
    ctx.shadowColor = `rgba(96,245,255,${0.35 + playerPulse * 0.2})`;
    ctx.shadowBlur = 22;
    
    // Draw Player Sprite or Fallback
    if (playerImg && playerImg.complete && playerImg.naturalWidth > 0) {
        ctx.beginPath();
        ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 12);
        ctx.clip();
        ctx.drawImage(playerImg, -player.w/2, -player.h/2, player.w, player.h);
        
        const time = Date.now() / 100;
        ctx.globalCompositeOperation = 'screen';
        if (Math.floor(time) % 2 === 0) {
            ctx.fillStyle = 'rgba(45, 212, 255, 0.52)';
            ctx.fillRect(-player.w/2, -player.h/2, player.w/2, player.h);
            ctx.fillStyle = 'rgba(255, 77, 148, 0.28)';
            ctx.fillRect(0, -player.h/2, player.w/2, player.h);
        } else {
            ctx.fillStyle = 'rgba(255, 77, 148, 0.52)';
            ctx.fillRect(0, -player.h/2, player.w/2, player.h);
            ctx.fillStyle = 'rgba(45, 212, 255, 0.28)';
            ctx.fillRect(-player.w/2, -player.h/2, player.w/2, player.h);
        }
        ctx.globalCompositeOperation = 'source-over';
        
        ctx.strokeStyle = '#60f5ff';
        ctx.lineWidth = 3;
        ctx.stroke();
    } else {
        const shellGradient = ctx.createLinearGradient(0, -player.h/2, 0, player.h/2);
        shellGradient.addColorStop(0, '#c7f9ff');
        shellGradient.addColorStop(0.35, '#60a5fa');
        shellGradient.addColorStop(1, '#0f1d4d');
        ctx.fillStyle = shellGradient;
        ctx.beginPath();
        ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 10);
        ctx.fill();
        ctx.fillStyle = '#081222';
        ctx.fillRect(-player.w/2 + 6, -player.h/2 + 10, player.w - 12, player.h * 0.22);
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(-player.w/2 + 8, -player.h/4, player.w - 16, player.h/2);
        ctx.fillStyle = '#2dd4ff';
        ctx.fillRect(-player.w/2 + 4, -player.h/6, player.w/2 - 4, 10);
        ctx.fillStyle = '#ff4d94';
        ctx.fillRect(0, -player.h/6, player.w/2 - 4, 10);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-player.w/2 + 5, -player.h/2 + 3, 10, 4);
        ctx.fillRect(player.w/2 - 15, -player.h/2 + 3, 10, 4);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    
    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    
    // Speed Lines (Overlay effect)
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for(let i=0; i<5; i++) {
        let lx = (Date.now() / 2 + i * 100) % cw;
        let ly = (Date.now() * 2 + i * 200) % ch;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx, ly + 50);
        ctx.stroke();
    }
    
    // Neon grid horizon for world cohesion
    ctx.strokeStyle = 'rgba(96,245,255,0.14)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
        const y = ch * 0.14 + i * ch * 0.06;
        ctx.beginPath();
        ctx.moveTo(cw * 0.08, y);
        ctx.lineTo(cw * 0.92, y);
        ctx.stroke();
    }
    
    ctx.restore(); // End Shake
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    try {
        update(dt);
        draw();
    } catch (e) {
        console.error("Game Loop Error:", e);
    }
    
    requestAnimationFrame(loop);
}

// Input Handling
function handleInput(e) {
    unlockAudio();
    
    if (gameState === 'GAMEOVER') {
        const btn = document.getElementById('restart-btn');
        // Check if click is on button
        const rect = btn.getBoundingClientRect();
        const ex = e.clientX || e.touches?.[0]?.clientX;
        const ey = e.clientY || e.touches?.[0]?.clientY;
        
        if (ex >= rect.left && ex <= rect.right && ey >= rect.top && ey <= rect.bottom) {
            playSfx('restart');
            initGame();
        }
        return;
    }
    
    if (gameState === 'PLAYING') {
        const cx = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
        // Move towards touch
        const targetX = cx;
        const diff = targetX - player.x;
        player.vx = diff * gameConfig.heroSpeed;
    }
}

function handleMove(e) {
    if (gameState !== 'PLAYING') return;
    const cx = (e.clientX || e.touches[0].clientX) - canvas.getBoundingClientRect().left;
    const targetX = cx;
    const diff = targetX - player.x;
    player.vx = diff * gameConfig.heroSpeed;
    e.preventDefault();
}

// Event Listeners
// [agent-note][stage4] repaired: mobile-action-path | element: canvas/restart-btn | action: scoped gameplay gestures off global window listeners so UI taps keep native activation
canvas.addEventListener('pointerdown', handleInput, { passive: false });
canvas.addEventListener('pointermove', handleMove, { passive: false });
document.getElementById('restart-btn').addEventListener('click', () => {
    playSfx('restart');
    initGame();
});

// Init
document.addEventListener('DOMContentLoaded', () => {
    ro.observe(canvas);
});

</script>
