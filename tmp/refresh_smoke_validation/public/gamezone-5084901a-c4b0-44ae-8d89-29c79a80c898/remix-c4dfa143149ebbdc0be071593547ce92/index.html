<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Drift Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- [agent-note][stage4] repaired: font-remap | action: replaced Exo 2 -> Rajdhani and Orbitron -> Audiowide using catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-core: #040612;
            --bg-vignette: #02030a;
            --grid: rgba(95, 130, 255, 0.16);
            --grid-strong: rgba(85, 242, 255, 0.22);
            --hero-core: #6cf7ff;
            --hero-shell: #8b5cff;
            --hero-glow: rgba(108, 247, 255, 0.55);
            --enemy-core: #ff4d8d;
            --enemy-fast: #ff9c54;
            --bullet-core: #fff27a;
            --hud-bg: rgba(5, 10, 30, 0.76);
            --hud-border: rgba(127, 228, 255, 0.32);
            --hud-text: #eef6ff;
            --hud-muted: #99a7cc;
            --panel-shadow: 0 0 32px rgba(64, 163, 255, 0.18);
            --accent: #76f0ff;
            --accent-secondary: #b08cff;
        }

        /* Core Reset & Layout */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(81, 96, 255, 0.16), transparent 35%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 229, 0.08), transparent 30%),
                linear-gradient(180deg, var(--bg-core), var(--bg-vignette));
            touch-action: auto;
            font-family: 'Rajdhani', sans-serif;
            color: var(--hud-text);
            user-select: none;
            -webkit-user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(transparent 0 96%, rgba(118, 240, 255, 0.03) 96% 100%);
            background-size: 100% 5px;
            mix-blend-mode: screen;
            opacity: 0.45;
        }

        body::after {
            background:
                radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.42) 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI Styling */
        .glass {
            background:
                linear-gradient(180deg, rgba(11, 18, 44, 0.94), rgba(6, 10, 24, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid var(--hud-border);
            box-shadow:
                var(--panel-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(118, 240, 255, 0.08), transparent 40%, rgba(176, 140, 255, 0.08));
        }

        .neon-text {
            text-shadow:
                0 0 12px rgba(118, 240, 255, 0.55),
                0 0 28px rgba(139, 92, 255, 0.28);
        }

        .neon-text-yellow {
            text-shadow:
                0 0 12px rgba(255, 242, 122, 0.7),
                0 0 24px rgba(255, 191, 71, 0.32);
        }

        .brand-title {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
        }

        .hud-value,
        .hud-label,
        .screen-kicker,
        .btn-primary {
            font-family: 'Audiowide', sans-serif;
        }

        .screen-copy,
        #mute-btn,
        .reaction-caption {
            font-family: 'Rajdhani', sans-serif;
        }

        .reaction-overlay {
            position: absolute;
            right: 0.85rem;
            bottom: 7.25rem;
            width: min(28vw, 124px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .reaction-overlay.active {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .reaction-overlay img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(118, 240, 255, 0.35);
            box-shadow: 0 0 28px rgba(12, 20, 50, 0.5);
            background: rgba(5, 12, 30, 0.7);
        }

        .reaction-caption {
            width: 100%;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #d8e7ff;
            text-shadow: 0 0 14px rgba(118, 240, 255, 0.28);
        }

        /* Buttons */
        .btn-primary {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #74f0ff, #875dff 70%, #5b3dd1);
            color: #06111c;
            clip-path: polygon(9% 0, 100% 0, 100% 84%, 91% 100%, 0 100%, 0 16%);
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            box-shadow: 0 10px 24px rgba(99, 113, 255, 0.35);
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 25%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 0.25s ease;
        }

        .btn-primary:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }

        .btn-primary:hover::before,
        .btn-primary:focus-visible::before {
            transform: translateX(120%);
        }

        /* HUD */
        #hud {
            pointer-events: none;
        }

        .hud-card {
            position: relative;
            padding: 0.6rem 0.8rem 0.55rem;
            border-radius: 1rem;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(10px);
        }

        .hud-chip {
            border-radius: 999px;
            background: rgba(15, 24, 58, 0.84);
            border: 1px solid rgba(118, 240, 255, 0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .hud-label {
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--hud-muted);
        }

        .hud-value {
            line-height: 0.92;
        }

        #mute-btn {
            min-width: 90px;
            text-align: center;
            letter-spacing: 0.08em;
            color: var(--hud-text);
            background: rgba(9, 17, 37, 0.72);
        }

        .scanline-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(118, 240, 255, 0.5), transparent);
        }

        .modal-panel {
            position: relative;
            max-width: 24rem;
            width: calc(100% - 2rem);
            margin: 1rem;
            border-radius: 1.4rem;
        }

        .hero-emblem {
            width: 104px;
            height: 104px;
            border-radius: 999px;
            position: relative;
            background:
                radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(255,255,255,0.1) 18%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(118, 240, 255, 0.95), rgba(139, 92, 255, 0.84) 58%, rgba(4, 8, 28, 0.96) 72%);
            box-shadow:
                0 0 30px rgba(108, 247, 255, 0.42),
                inset 0 0 24px rgba(255,255,255,0.14);
        }

        .hero-emblem::before,
        .hero-emblem::after {
            content: "";
            position: absolute;
            inset: 50%;
            transform: translate(-50%, -50%);
            border-radius: 999px;
        }

        .hero-emblem::before {
            width: 62px;
            height: 62px;
            border: 3px solid rgba(255,255,255,0.56);
            box-shadow: 0 0 20px rgba(118, 240, 255, 0.34);
        }

        .hero-emblem::after {
            width: 18px;
            height: 18px;
            background: #fff;
            box-shadow:
                0 -24px 0 0 rgba(255, 242, 122, 0.9),
                0 24px 0 0 rgba(255, 77, 141, 0.75),
                -24px 0 0 0 rgba(118, 240, 255, 0.72),
                24px 0 0 0 rgba(176, 140, 255, 0.72);
        }

        .status-pill {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--hud-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            #hud {
                padding: 0.75rem;
            }

            .hud-card {
                padding: 0.5rem 0.65rem;
                border-radius: 0.9rem;
            }

            .hud-value {
                font-size: 1.8rem !important;
            }

            .modal-panel {
                width: calc(100% - 1.25rem);
                margin: 0.625rem;
            }

            .hero-emblem {
                width: 84px;
                height: 84px;
            }

            .hero-emblem::before {
                width: 50px;
                height: 50px;
            }

            .hero-emblem::after {
                width: 14px;
                height: 14px;
                box-shadow:
                    0 -20px 0 0 rgba(255, 242, 122, 0.9),
                    0 20px 0 0 rgba(255, 77, 141, 0.75),
                    -20px 0 0 0 rgba(118, 240, 255, 0.72),
                    20px 0 0 0 rgba(176, 140, 255, 0.72);
            }

            .reaction-overlay {
                right: 0.65rem;
                bottom: 6.7rem;
                width: min(30vw, 96px);
            }

            .reaction-caption {
                font-size: 0.62rem;
                letter-spacing: 0.11em;
            }
        }
    </style>
</head>

<script>
/**
 * Signal Drift Arena
 * Single-file arena survival implementation
 */

// --- Configuration ---
const CONFIG = {
    heroSpeed: 7,
    bulletSpeed: 14,
    spawnRate: 900,
    colors: {
        bg: '#040612',
        grid: 'rgba(95, 130, 255, 0.16)',
        hero: '#6cf7ff',
        heroShell: '#8b5cff',
        heroGlow: 'rgba(108, 247, 255, 0.55)',
        bullet: '#fff27a',
        bulletTrail: '#ffb347',
        enemy: '#ff4d8d',
        enemyFast: '#ff9c54',
        text: '#eef6ff'
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgm = document.getElementById('bgm_battle');
        this.sfxShoot = document.getElementById('sfx_shoot');
        this.sfxHit = document.getElementById('sfx_hit');
        this.sfxDefeat = document.getElementById('sfx_defeat');
        this.sfxUi = document.getElementById('sfx_ui');
        this.muted = false;
        this.unlocked = false;
        this.lastPlayedAt = new Map();
    }

    init() {
        if (this.unlocked) {
            this.resume();
            return;
        }
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            try {
                this.ctx = new AudioContext();
            } catch (e) {
                this.ctx = null;
            }
        }
        this.unlocked = true;
        this.resume();
    }

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        if (!this.muted && this.bgm) {
            this.bgm.volume = 0.34;
            this.bgm.play().catch(() => {});
        }
    }

    pauseLoop() {
        if (this.bgm) this.bgm.pause();
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.pauseLoop();
        } else {
            this.resume();
        }
        return this.muted;
    }

    playBuffer(audioEl, volume = 0.3, throttleMs = 0, key = '') {
        if (!audioEl || this.muted) return;
        const now = performance.now();
        const throttleKey = key || audioEl.id || audioEl.currentSrc;
        if (throttleMs > 0 && now - (this.lastPlayedAt.get(throttleKey) || 0) < throttleMs) return;
        this.lastPlayedAt.set(throttleKey, now);
        try {
            audioEl.pause();
            audioEl.currentTime = 0;
            audioEl.volume = volume;
            audioEl.play().catch(() => {});
        } catch (e) {}
    }

    playTone(freq, type, duration, vol = 0.1) {
        if (!this.ctx || this.muted) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration + 0.1);
        } catch (e) {}
    }

    playShoot() {
        this.playBuffer(this.sfxShoot, 0.18, 70, 'shoot');
        this.playTone(660, 'triangle', 0.07, 0.018);
    }

    playExplosion() {
        this.playBuffer(this.sfxDefeat, 0.28, 180, 'defeat');
        this.playTone(90, 'sawtooth', 0.22, 0.06);
    }

    playHit() {
        this.playBuffer(this.sfxHit, 0.22, 55, 'hit');
    }

    playUi() {
        this.playBuffer(this.sfxUi, 0.2, 80, 'ui');
    }
}

// --- Game Engine ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioManager();

// Game State
let state = {
    screen: 'START', // START, PLAY, GAMEOVER
    width: 0,
    height: 0,
    lastTime: 0,
    score: 0,
    wave: 1,
    time: 0,
    camera: { x: 0, y: 0 }
};

// Entities
let player = { x: 0, y: 0, angle: 0, recoil: 0, dead: false };
let bullets = [];
let enemies = [];
let particles = [];
let reactionState = { until: 0, src: '', caption: '' };

// Input State
const input = {
    joystick: {
        active: false,
        id: null,
        baseX: 0, baseY: 0, // Fixed position
        currX: 0, currY: 0,
        vecX: 0, vecY: 0
    },
    fireBtn: {
        active: false,
        id: null,
        x: 0, y: 0, r: 50,
        pressed: false // For visual feedback
    }
};

// --- Resize Handling ---
function resize() {
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = state.width * dpr;
    canvas.height = state.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    canvas.style.width = state.width + 'px';
    canvas.style.height = state.height + 'px';

    // Update Control Positions
    // Joystick Bottom Left
    const safeInsetBottom = Math.max(0, parseFloat(getComputedStyle(document.documentElement).getPropertyValue('env(safe-area-inset-bottom)')) || 0);
    const controlOffset = Math.min(96, Math.max(76, state.width * 0.12));
    input.joystick.baseX = controlOffset;
    input.joystick.baseY = state.height - controlOffset - safeInsetBottom;
    
    // Fire Button Bottom Right
    input.fireBtn.x = state.width - controlOffset;
    input.fireBtn.y = state.height - controlOffset - safeInsetBottom;

    if (!input.joystick.active) {
        input.joystick.currX = input.joystick.baseX;
        input.joystick.currY = input.joystick.baseY;
    }
}
window.addEventListener('resize', resize);

// --- Input Handling ---
function handleInputDown(e) {
    if (state.screen !== 'PLAY') return;
    e.preventDefault();
    audio.init();

    const x = e.clientX;
    const y = e.clientY;

    // Check Fire Button (Right side, circular zone)
    const dx = x - input.fireBtn.x;
    const dy = y - input.fireBtn.y;
    // Hitbox slightly larger than visual
    if (Math.sqrt(dx*dx + dy*dy) < 80) {
        if (!input.fireBtn.active) {
            input.fireBtn.active = true;
            input.fireBtn.id = e.pointerId;
            input.fireBtn.pressed = true;
            fireBullet(); // FIRE ONCE
        }
        return;
    }

    // Check Joystick (Left half of screen)
    if (x < state.width / 2 && !input.joystick.active) {
        input.joystick.active = true;
        input.joystick.id = e.pointerId;
        input.joystick.currX = x;
        input.joystick.currY = y;
        updateJoystickVector();
    }
}

function handleInputMove(e) {
    if (state.screen !== 'PLAY') return;
    e.preventDefault();

    if (e.pointerId === input.joystick.id) {
        input.joystick.currX = e.clientX;
        input.joystick.currY = e.clientY;
        updateJoystickVector();
    }
}

function handleInputUp(e) {
    e.preventDefault();
    if (e.pointerId === input.joystick.id) {
        input.joystick.active = false;
        input.joystick.vecX = 0;
        input.joystick.vecY = 0;
        input.joystick.id = null;
        // Reset knob to base
        input.joystick.currX = input.joystick.baseX;
        input.joystick.currY = input.joystick.baseY;
    }
    if (e.pointerId === input.fireBtn.id) {
        input.fireBtn.active = false;
        input.fireBtn.pressed = false;
        input.fireBtn.id = null;
    }
}

function updateJoystickVector() {
    const maxDist = 50;
    let dx = input.joystick.currX - input.joystick.baseX;
    let dy = input.joystick.currY - input.joystick.baseY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > maxDist) {
        const ratio = maxDist / dist;
        dx *= ratio;
        dy *= ratio;
        // Clamp visual knob
        input.joystick.currX = input.joystick.baseX + dx;
        input.joystick.currY = input.joystick.baseY + dy;
    }
    
    // Normalize vector
    input.joystick.vecX = dx / maxDist;
    input.joystick.vecY = dy / maxDist;
}

// Bind Events
canvas.addEventListener('pointerdown', handleInputDown, { passive: false });
canvas.addEventListener('pointermove', handleInputMove, { passive: false });
window.addEventListener('pointerup', handleInputUp, { passive: false });
window.addEventListener('pointercancel', handleInputUp, { passive: false });

// --- Game Logic ---
function resetGame() {
    player = { x: 0, y: 0, angle: 0, recoil: 0, dead: false };
    bullets = [];
    enemies = [];
    particles = [];
    state.score = 0;
    state.wave = 1;
    state.time = 0;
    state.camera = { x: 0, y: 0 };
    
    // Reset inputs
    input.joystick.active = false;
    input.joystick.vecX = 0;
    input.joystick.vecY = 0;
    input.joystick.currX = input.joystick.baseX;
    input.joystick.currY = input.joystick.baseY;
    
    document.getElementById('scoreVal').innerText = '0';
    document.getElementById('waveVal').innerText = '1';
    
    state.screen = 'PLAY';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    audio.init();
}

function fireBullet() {
    if (player.dead) return;
    
    let angle = player.angle;
    
    // Recoil push
    player.recoil = 8;
    
    bullets.push({
        x: player.x + Math.cos(angle) * 20,
        y: player.y + Math.sin(angle) * 20,
        vx: Math.cos(angle) * CONFIG.bulletSpeed,
        vy: Math.sin(angle) * CONFIG.bulletSpeed,
        life: 60
    });
    
    audio.playShoot();
    
    // Flash effect
    spawnParticles(player.x + Math.cos(angle)*20, player.y + Math.sin(angle)*20, '#fff6b3', 4, 3.4);
}

function spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(state.width, state.height) / 1.5 + 50; // Offscreen
    const type = Math.random() > 0.8 ? 'FAST' : 'NORMAL';
    
    enemies.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        size: type === 'FAST' ? 12 : 16,
        hp: type === 'FAST' ? 1 : 3,
        speed: (type === 'FAST' ? 3 : 1.5) + (state.score / 500), // Speed ramp
        type: type,
        phase: Math.random() * Math.PI * 2,
        spin: (Math.random() * 0.04 + 0.015) * (Math.random() > 0.5 ? 1 : -1)
    });
}

function spawnParticles(x, y, color, count, speedBase) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * speedBase;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 20,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function showReaction(src, caption, duration = 850) {
    reactionState.src = src;
    reactionState.caption = caption;
    reactionState.until = performance.now() + duration;
}

function update(dt) {
    if (state.screen !== 'PLAY') return;
    
    state.time += dt;

    // Movement
    if (Math.abs(input.joystick.vecX) > 0.1 || Math.abs(input.joystick.vecY) > 0.1) {
        player.x += input.joystick.vecX * CONFIG.heroSpeed;
        player.y += input.joystick.vecY * CONFIG.heroSpeed;
        player.angle = Math.atan2(input.joystick.vecY, input.joystick.vecX);
    }
    
    // Camera Follow
    state.camera.x += (player.x - state.camera.x) * 0.1;
    state.camera.y += (player.y - state.camera.y) * 0.1;
    
    // Recoil recovery
    player.recoil *= 0.8;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0) bullets.splice(i, 1);
    }

    // Enemies
    const spawnInterval = Math.max(300, CONFIG.spawnRate - (state.score * 2));
    if (Math.random() < (dt / spawnInterval)) spawnEnemy();

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // Move towards player
        if (dist > 0) {
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;
        }
        
        // Collision: Player
        if (dist < 20) {
            state.screen = 'GAMEOVER';
            audio.playExplosion();
            audio.pauseLoop();
            showReaction('https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp', 'signal crash', 1800);
            spawnParticles(player.x, player.y, '#ff4d8d', 50, 6);
            document.getElementById('finalScore').innerText = state.score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            return;
        }
        
        // Collision: Bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            const bdx = b.x - e.x;
            const bdy = b.y - e.y;
            if (bdx*bdx + bdy*bdy < (e.size + 6)*(e.size + 6)) {
                e.hp--;
                bullets.splice(j, 1);
                spawnParticles(b.x, b.y, '#fff', 5, 2.4);
                
                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                    state.score += 10;
                    document.getElementById('scoreVal').innerText = state.score;
                    audio.playHit();
                    if (state.score % 30 === 0) {
                        showReaction('https://i.giphy.com/1AjEBGWggGXh9onllB.webp', 'impact burst', 720);
                    }
                    spawnParticles(e.x, e.y, e.type === 'FAST' ? CONFIG.colors.enemyFast : CONFIG.colors.enemy, 12, 4.2);
                }
                break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.size *= 0.9;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// --- Rendering ---
function drawStarfield() {
    ctx.save();
    const parallaxX = state.camera.x * 0.08;
    const parallaxY = state.camera.y * 0.08;

    for (let i = 0; i < 26; i++) {
        const x = ((i * 137.5 - parallaxX) % (state.width + 120) + (state.width + 120)) % (state.width + 120) - 60;
        const y = ((i * 83.3 - parallaxY) % (state.height + 120) + (state.height + 120)) % (state.height + 120) - 60;
        const pulse = 0.35 + 0.35 * Math.sin((state.time * 0.002) + i);
        ctx.fillStyle = `rgba(118, 240, 255, ${0.15 + pulse * 0.28})`;
        ctx.beginPath();
        ctx.arc(x, y, (i % 3) + 1, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawArenaPulse() {
    const radius = Math.min(state.width, state.height) * 0.32 + Math.sin(state.time * 0.0014) * 12;
    const gradient = ctx.createRadialGradient(
        state.width / 2,
        state.height / 2,
        radius * 0.1,
        state.width / 2,
        state.height / 2,
        radius
    );
    gradient.addColorStop(0, 'rgba(118, 240, 255, 0.05)');
    gradient.addColorStop(0.55, 'rgba(139, 92, 255, 0.06)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, state.width, state.height);
}

function draw() {
    // Background
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, state.width, state.height);
    drawStarfield();
    drawArenaPulse();
    
    ctx.save();
    // Camera Transform
    ctx.translate(state.width/2 - state.camera.x, state.height/2 - state.camera.y);

    // Grid
    const gridSize = 100;
    const startX = Math.floor((state.camera.x - state.width/2) / gridSize) * gridSize - gridSize;
    const startY = Math.floor((state.camera.y - state.height/2) / gridSize) * gridSize - gridSize;
    const endX = startX + state.width + gridSize*2;
    const endY = startY + state.height + gridSize*2;
    
    ctx.beginPath();
    for (let x = startX; x < endX; x += gridSize) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
    }
    for (let y = startY; y < endY; y += gridSize) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
    }
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    for (let x = startX; x < endX; x += gridSize * 2) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
    }
    for (let y = startY; y < endY; y += gridSize * 2) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
    }
    ctx.strokeStyle = 'rgba(85, 242, 255, 0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 20);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // Bullets
    for (let b of bullets) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 179, 71, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx * 0.55, b.y - b.vy * 0.55);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        ctx.fillStyle = CONFIG.colors.bullet;
        ctx.shadowBlur = 12;
        ctx.shadowColor = CONFIG.colors.bullet;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Enemies
    for (let e of enemies) {
        const spin = state.time * e.spin;
        const pulse = 1 + Math.sin(state.time * 0.008 + e.phase) * 0.08;
        const fill = e.type === 'FAST' ? CONFIG.colors.enemyFast : CONFIG.colors.enemy;
        const outer = e.size * 1.22 * pulse;

        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(spin);

        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
            const a = (Math.PI / 2) * k;
            const px = Math.cos(a) * outer;
            const py = Math.sin(a) * outer;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = fill;
        ctx.shadowBlur = 16;
        ctx.shadowColor = fill;
        ctx.fillRect(-e.size, -e.size, e.size * 2, e.size * 2);

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.25;
        ctx.strokeRect(-e.size, -e.size, e.size * 2, e.size * 2);

        ctx.fillStyle = 'rgba(255,255,255,0.86)';
        ctx.fillRect(-2, -e.size * 0.8, 4, e.size * 1.6);

        ctx.restore();
    }

    // Player
    if (state.screen === 'PLAY') {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        
        const shellOffset = player.recoil;
        const idlePulse = 1 + Math.sin(state.time * 0.012) * 0.05;

        ctx.shadowBlur = 26;
        ctx.shadowColor = CONFIG.colors.heroGlow;

        // Rear trail fins
        ctx.fillStyle = 'rgba(139, 92, 255, 0.5)';
        ctx.beginPath();
        ctx.moveTo(-28 - shellOffset, -10);
        ctx.lineTo(-42 - shellOffset, 0);
        ctx.lineTo(-28 - shellOffset, 10);
        ctx.closePath();
        ctx.fill();

        // Outer shell
        ctx.fillStyle = CONFIG.colors.heroShell;
        ctx.beginPath();
        ctx.moveTo(24 - shellOffset, 0);
        ctx.lineTo(-6 - shellOffset, -20 * idlePulse);
        ctx.lineTo(-22 - shellOffset, -12);
        ctx.lineTo(-18 - shellOffset, 0);
        ctx.lineTo(-22 - shellOffset, 12);
        ctx.lineTo(-6 - shellOffset, 20 * idlePulse);
        ctx.closePath();
        ctx.fill();

        // Core body
        ctx.fillStyle = CONFIG.colors.hero;
        ctx.beginPath();
        ctx.moveTo(20 - shellOffset, 0);
        ctx.lineTo(-2 - shellOffset, -14);
        ctx.lineTo(-14 - shellOffset, 0);
        ctx.lineTo(-2 - shellOffset, 14);
        ctx.closePath();
        ctx.fill();

        // Canopy
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.88;
        ctx.beginPath();
        ctx.ellipse(2 - shellOffset, 0, 6, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Pulse cannon
        ctx.fillStyle = '#fff27a';
        ctx.fillRect(10 - shellOffset, -3, 18, 6);

        // Accent rings
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-6 - shellOffset, 0, 9, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    ctx.restore(); // End Camera

    const overlay = document.getElementById('reaction-overlay');
    const overlayImg = document.getElementById('reaction-gif');
    const overlayCaption = document.getElementById('reaction-caption');
    if (overlay && overlayImg && overlayCaption) {
        const isActive = performance.now() < reactionState.until;
        overlay.classList.toggle('active', isActive);
        if (reactionState.src && overlayImg.src !== reactionState.src) {
            overlayImg.src = reactionState.src;
        }
        overlayCaption.textContent = reactionState.caption || 'pulse sync';
    }

    // --- HUD / Controls Layer ---
    if (state.screen === 'PLAY') {
        // Joystick
        const j = input.joystick;
        ctx.save();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(118, 240, 255, 0.22)';
        ctx.lineWidth = 6;
        ctx.arc(j.baseX, j.baseY, 50, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(176, 140, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.arc(j.baseX, j.baseY, 32, 0, Math.PI * 2);
        ctx.stroke();

        const joyGradient = ctx.createRadialGradient(j.currX - 6, j.currY - 8, 4, j.currX, j.currY, 30);
        joyGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        joyGradient.addColorStop(0.35, j.active ? 'rgba(118, 240, 255, 0.95)' : 'rgba(170, 184, 220, 0.45)');
        joyGradient.addColorStop(1, 'rgba(11, 17, 36, 0.65)');
        ctx.beginPath();
        ctx.fillStyle = joyGradient;
        ctx.arc(j.currX, j.currY, 25, 0, Math.PI * 2);
        ctx.fill();

        // Fire Button
        const f = input.fireBtn;
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 242, 122, 0.32)';
        ctx.lineWidth = 6;
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 77, 141, 0.22)';
        ctx.lineWidth = 2;
        ctx.arc(f.x, f.y, f.r - 14, 0, Math.PI * 2);
        ctx.stroke();

        const fireGradient = ctx.createRadialGradient(f.x - 10, f.y - 12, 4, f.x, f.y, f.r);
        fireGradient.addColorStop(0, f.pressed ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.78)');
        fireGradient.addColorStop(0.32, f.pressed ? 'rgba(255, 242, 122, 0.92)' : 'rgba(255, 196, 87, 0.55)');
        fireGradient.addColorStop(1, 'rgba(50, 22, 45, 0.2)');
        ctx.beginPath();
        ctx.fillStyle = fireGradient;
        ctx.arc(f.x, f.y, f.r - 10, 0, Math.PI * 2);
        ctx.fill();
        
        // Labels
        ctx.fillStyle = 'rgba(232,240,255,0.62)';
        ctx.font = '600 15px "Rajdhani"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('DRIFT', j.baseX, j.baseY + 72);
        ctx.fillText('PULSE', f.x, f.y + 72);

        ctx.restore();
    }
}

// --- Loop ---
function loop(timestamp) {
    const dt = timestamp - state.lastTime;
    state.lastTime = timestamp;
    
    update(Math.min(dt, 50)); // Cap delta time
    draw();
    requestAnimationFrame(loop);
}

// --- Initialization ---
document.addEventListener('DOMContentLoaded', () => {
    resize();
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.init();
        audio.playUi();
        showReaction('https://i.giphy.com/1AjEBGWggGXh9onllB.webp', 'arena online', 900);
        resetGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.init();
        audio.playUi();
        showReaction('https://i.giphy.com/1AjEBGWggGXh9onllB.webp', 'resync live', 900);
        resetGame();
    });
    
    const muteBtn = document.getElementById('mute-btn');
    muteBtn.addEventListener('click', () => {
        audio.init();
        const isMuted = audio.toggleMute();
        if (!isMuted) audio.playUi();
        muteBtn.innerText = isMuted ? 'SOUND: OFF' : 'SOUND: ON';
        muteBtn.style.opacity = isMuted ? '0.45' : '0.8';
    });

    // Start Loop
    requestAnimationFrame(loop);
});

</script>
