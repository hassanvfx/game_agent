        :root {
            --bg-color: #0a0f1f;
            --panel-bg: linear-gradient(180deg, rgba(18, 28, 54, 0.9), rgba(9, 14, 31, 0.94));
            --panel-border: #4cc9f0;
            --btn-bg: linear-gradient(180deg, rgba(40, 24, 76, 0.94), rgba(17, 15, 45, 0.98));
            --btn-border: #f72585;
            --text-main: #f5fbff;
            --text-soft: #b8d8ff;
            --text-shadow: 0 2px 8px rgba(0,0,0,0.45);
            --font-ui: 'Orbitron', sans-serif;
            --font-display: 'Audiowide', cursive;
            --font-arcade: 'Orbitron', sans-serif;
            --border-radius: 18px;
            --btn-radius: 14px;
            --shadow: 0 12px 32px rgba(0,0,0,0.38);
            --blur: blur(8px);
            --panel-glow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 24px rgba(76, 201, 240, 0.18);
            --lane-highlight: rgba(255,255,255,0.04);
        }

        body.theme-rain {
            --bg-color: #0f172a;
        }

        body.theme-milkwaterfall {
            --bg-color: #fffdd0;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: #fbbf24;
            --btn-bg: #fef3c7;
            --btn-border: #f59e0b;
            --text-main: #b45309;
            --text-shadow: 0 2px 4px rgba(255,255,255,0.8);
            --border-radius: 24px;
            --btn-radius: 16px;
            --shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
            --blur: blur(6px);
        }

        body.theme-candy {
            --bg-color: #fce7f3;
            --panel-bg: rgba(253, 232, 232, 0.95);
            --panel-border: #fbcfe8;
            --btn-bg: #fbcfe8;
            --btn-border: #f9a8d4;
            --text-main: #be185d;
            --text-shadow: 0 2px 0px rgba(255,255,255,0.8);
            --border-radius: 20px;
            --btn-radius: 16px;
            --shadow: 0 8px 24px rgba(244, 114, 182, 0.3);
        }

        body.theme-arcade {
            --bg-color: #06030c;
            --panel-bg: linear-gradient(180deg, rgba(7, 7, 16, 0.96), rgba(0, 0, 0, 0.92));
            --panel-border: #00ffaa;
            --btn-bg: linear-gradient(180deg, rgba(27, 27, 35, 0.98), rgba(6, 6, 10, 0.98));
            --btn-border: #00ffaa;
            --text-main: #89ffef;
            --text-soft: #56cfe1;
            --text-shadow: 0 0 10px rgba(0,255,170,0.75);
            --font-ui: var(--font-arcade);
            --font-display: var(--font-arcade);
            --border-radius: 4px;
            --btn-radius: 4px;
            --shadow: 0 0 0 1px rgba(0,255,170,0.18), 0 0 18px rgba(0,255,170,0.2);
            --blur: none;
            --panel-glow: 0 0 0 1px rgba(0,255,170,0.2), 0 0 22px rgba(0,255,170,0.18);
            --lane-highlight: rgba(0,255,170,0.06);
        }

        body.theme-waterfall {
            --bg-color: #083344;
            --panel-bg: rgba(8, 145, 178, 0.8);
            --panel-border: #22d3ee;
            --btn-bg: rgba(6, 182, 212, 0.8);

        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background:

            repeating-linear-gradient(90deg, transparent 0 23.5%, rgba(255,255,255,0.045) 23.5% 24%, transparent 24% 49.5%, rgba(255,255,255,0.035) 49.5% 50%);

        .theme-text { font-family: var(--font-ui); font-weight: 700; letter-spacing: 1px; color: var(--text-main); text-shadow: var(--text-shadow); transition: all 0.3s; }

        .theme-panel { background: var(--panel-bg); border: 2px solid var(--panel-border); box-shadow: var(--shadow), var(--panel-glow); border-radius: var(--border-radius); backdrop-filter: var(--blur); transition: all 0.3s; }
        .theme-btn { border: 2px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); border-radius: var(--btn-radius); transition: transform 0.1s, all 0.3s; pointer-events: auto; cursor: pointer; font-family: var(--font-ui); font-weight: 700; backdrop-filter: var(--blur); text-transform: uppercase; box-shadow: 0 8px 18px rgba(0,0,0,0.2); }
        #builder-track-name { font-family: var(--font-ui); }
        #hud-score-text, #hud-combo-text, #miss-display, #score-display, #combo-display, #final-rank { font-family: var(--font-arcade); }
        #media-reaction-layer { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: max(4.5rem, env(safe-area-inset-top)) 1rem 1rem; gap: 0.75rem; pointer-events: none; }
        .reaction-gif-card { width: min(28vw, 120px); min-width: 80px; aspect-ratio: 1; border-radius: 16px; border: 2px solid rgba(255,255,255,0.18); background: rgba(5,10,24,0.45); box-shadow: 0 10px 24px rgba(0,0,0,0.28); overflow: hidden; opacity: 0; transform: translateY(-12px) scale(0.92); transition: opacity 0.22s ease, transform 0.22s ease; }
        .reaction-gif-card.show { opacity: 0.92; transform: translateY(0) scale(1); }
        .reaction-gif-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .reaction-gif-card.fail { align-self: flex-end; margin-bottom: max(5.5rem, env(safe-area-inset-bottom)); }
        .theme-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .theme-btn:active { transform: scale(0.95); filter: brightness(0.9); }
        .theme-btn.active-opt { background: var(--text-main); color: var(--bg-color); }
        #hud .theme-panel, #builder-track-name { box-shadow: var(--panel-glow); }
        #hud-score-text::before, #hud-combo-text::before { display: inline-block; margin-right: 0.35rem; }
        #hud-score-text::before { content: '😎'; }
        #hud-combo-text::before { content: '🔥'; }
        #track-list .theme-btn, #autoplay-btn, #settings-modal .theme-btn, #builder-ui .theme-btn, #builder-top-ui .theme-btn, #game-over-screen .theme-btn { min-height: 2.75rem; }
        .scrollable-list { touch-action: pan-y; overscroll-behavior-y: contain; }
        #settings-modal .theme-panel, #game-over-screen .theme-panel { max-height: min(82vh, 40rem); overflow-y: auto; }
        
        body.theme-milkwaterfall .text-blue-200, body.theme-milkwaterfall .text-blue-300, body.theme-milkwaterfall .text-pink-200 { color: #b45309; }
        body.theme-candy .text-blue-200, body.theme-candy .text-blue-300, body.theme-candy .text-pink-200 { color: #9d174d; }
        body.theme-arcade .text-blue-200, body.theme-arcade .text-blue-300, body.theme-arcade .text-pink-200 { color: #00aaff; }

            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none hidden">

                    <button onclick="window.initMenu()" class="theme-btn text-sm px-4 py-2">QUIT</button>
                </div>
            </div>

            <!-- TRACK SELECT -->
            <div id="track-select-screen" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-auto bg-black/20 backdrop-blur-sm hidden transition-colors duration-500">
                
                <button onclick="window.toggleSettings()" class="absolute top-6 right-6 p-3 theme-btn text-2xl" id="settings-icon">⚙️</button>

                <div id="track-list" class="flex flex-col gap-3 w-80 max-h-[40vh] overflow-y-auto px-2 pb-4 scrollable-list">
                </div>
                <div class="w-80 px-2 mt-4 flex flex-col gap-3">
                    <button onclick="window.toggleAutoplay()" id="autoplay-btn" class="theme-btn text-lg py-3 w-full">AUTOPLAY DJ: OFF</button>
                    <button onclick="window.enterBuilder()" class="theme-btn text-lg py-3 w-full">🛠️ CLIP BUILDER</button>
                </div>
            </div>

            <!-- SETTINGS MODAL -->
            <div id="settings-modal" class="absolute inset-0 bg-black/60 flex items-center justify-center pointer-events-auto hidden z-[60] backdrop-blur-md">
                <div class="theme-panel p-6 flex flex-col items-center w-80 max-w-[90%]">
                    <h2 class="theme-text text-2xl mb-6">SETTINGS</h2>
                    
                    <h3 class="theme-text text-sm mb-2 opacity-80">THEME</h3>
                    <div class="flex flex-wrap justify-center gap-2 mb-6" id="theme-options">
                    </div>

                    <h3 class="theme-text text-sm mb-2 opacity-80">INSTRUMENT</h3>
                    <div class="flex flex-wrap justify-center gap-2 mb-8" id="instrument-options">
                    </div>

                    <button onclick="window.toggleSettings()" class="theme-btn text-lg px-8 py-2">DONE</button>
                </div>
            </div>

            <!-- BUILDER TOP UI -->
            <div id="builder-top-ui" class="hidden absolute top-0 left-0 w-full p-2 flex justify-between items-start pointer-events-none">
                <div class="flex flex-col gap-2 pointer-events-auto">
                    <input type="text" id="builder-track-name" placeholder="Custom Clip Name" class="theme-panel px-3 py-2 text-sm w-56 outline-none" style="color: inherit; background: var(--panel-bg);" />
                    <div class="flex gap-2 w-56">
                        <button onclick="window.cycleBuilderSong()" id="btn-song-select" class="theme-btn text-sm px-2 py-2 flex-1 overflow-hidden whitespace-nowrap text-ellipsis">SONG: Candy Pop</button>
                        <button onclick="document.getElementById('audio-upload').click()" class="theme-btn text-sm px-3 py-2" title="Upload Song">📁</button>
                    </div>
                    <button onclick="window.toggleBuilderNoteType()" id="btn-note-type" class="theme-btn text-sm px-3 py-2 w-56">TYPE: TAP</button>
                </div>
                <div class="pointer-events-auto">
                    <button onclick="window.publishCustomTrack()" class="theme-btn text-sm px-4 py-2">PUBLISH</button>
                </div>
            </div>

            <!-- BUILDER BOTTOM UI -->
            <div id="builder-ui" class="hidden absolute bottom-0 left-0 w-full p-4 flex justify-between items-end pointer-events-none">
                <div class="flex flex-col gap-2 pointer-events-auto">
                    <button onclick="window.clearBuilder()" class="theme-btn text-sm px-4 py-2">CLEAR</button>
                    <button onclick="window.exitBuilder()" class="theme-btn text-sm px-4 py-2">EXIT</button>
                </div>
                <div class="pointer-events-auto">
                    <button onclick="window.playCustomTest()" class="theme-btn text-lg px-6 py-3">▶ TEST</button>
                </div>
            </div>

            <!-- GAME OVER -->
            <div id="game-over-screen" class="absolute inset-0 bg-black/80 flex items-center justify-center pointer-events-auto hidden backdrop-blur-md">
                <div class="theme-panel p-8 flex flex-col items-center max-w-[90%] text-center">

                    <p class="theme-text text-xl mt-4">HYPE: <span id="final-score">0</span></p>
                    <p class="theme-text text-xl mt-2">MAX STREAK: <span id="final-combo">0</span></p>
                    <p class="theme-text text-xl mt-2">DROPS MISSED: <span id="final-misses">0</span></p>
                    <p class="theme-text text-4xl my-6">RANK: <span id="final-rank">B</span></p>
                    <button onclick="window.initMenu()" class="theme-btn text-xl px-8 py-3 uppercase mt-2">Back to Menu</button>
                </div>
            </div>
            <!-- [agent-note][stage3] resolved-gif: streak/fail overlays -> catalogs/gifs.json -->

                <div id="reaction-success" class="reaction-gif-card">

                </div>

                    <img src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Miss reaction" loading="lazy" decoding="async">

            </div>
        </div>

    <audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_bonus" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3" preload="auto"></audio>
    <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3" preload="auto"></audio>
    <audio id="sfx_menu_open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>
    <audio id="sfx_menu_close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>
    <audio id="sfx_level_complete" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3" preload="auto"></audio>
    <input type="file" id="audio-upload" accept="audio/*" class="hidden" onchange="window.handleAudioUpload(event)">

    <script>
        let gameConfig = {};
        let gameState = 'INIT'; 
        let initialized = false;
        let cw = 0, ch = 0;
        let dpr = window.devicePixelRatio || 1;
        
        let score = 0, combo = 0, maxCombo = 0, missCount = 0;
        let notes = [], particles = [], bgShapes = [];
        let lastSpawnTime = 0, timeElapsed = 0, shakeTime = 0;
        let isAutoplay = false;
        let endbarSpawned = false;
        
        let totalNotesSpawned = 0;
        let maxNotesForTrack = 0;

        const HIT_ZONE_Y_RATIO = 0.85;
        const HIT_ZONE_HEIGHT_RATIO = 0.12;
        let laneWidth = 0, laneColors = [];

        let audioCtx = null, audioUnlocked = false;
        const activeSfxPlayers = new Map();
        let reactionSuccessTimeout = 0;
        let reactionFailTimeout = 0;
        
        const RAIN_SCALE = [261.63, 329.63, 392.00, 493.88]; 

        const baseTracks = [
            { name: "Soft Launch", bgm: "bgm_relax", bpm: 110, scale: RAIN_SCALE },
            { name: "Reaction Chain", bgm: "bgm_candy", bpm: 130, scale: RAIN_SCALE },
            { name: "Night Shift Feed", bgm: "bgm_cyber", bpm: 150, scale: RAIN_SCALE },
            { name: "Glitch Parade", bgm: "bgm_neon", bpm: 165, scale: RAIN_SCALE },
            { name: "Trend Surge", bgm: "bgm_custom_edm", bpm: 180, scale: RAIN_SCALE },
            { name: "Timeline Overload", bgm: "bgm_rush_e", bpm: 200, scale: RAIN_SCALE },
            { name: "Scrollbreaker", bgm: "bgm_fingerbreaker", bpm: 350, scale: RAIN_SCALE }
        ];
        let allTracks = [];
        let currentTrackIndex = 0;

        const THEMES = ['Rain', 'MilkWaterfall', 'Candy', 'Arcade', 'Waterfall', 'BlueHawaii'];
        let currentThemeIdx = 0;
        const INSTRUMENTS = ['8-bit', 'Piano', 'Organ', 'Harp', 'Guitar'];
        let currentInstrument = '8-bit';

        let builderNotes = []; 
        let builderScrollY = 0;
        const BEAT_HEIGHT = 100;
        let customBpm = 140;
        let customQueue = [];
        let dragStartY = 0;
        let dragStartScrollY = 0;
        let isDraggingBuilder = false;
        let builderSongIndex = 0;
        let builderNoteType = 'tap';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const uiTrackSelect = document.getElementById('track-select-screen');
        const uiHud = document.getElementById('hud');
        const uiGameOver = document.getElementById('game-over-screen');
        const uiBuilder = document.getElementById('builder-ui');
        const uiBuilderTop = document.getElementById('builder-top-ui');
        const uiSettings = document.getElementById('settings-modal');
        const reactionSuccess = document.getElementById('reaction-success');
        const reactionFail = document.getElementById('reaction-fail');
        
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const missDisplay = document.getElementById('miss-display');
        const autoplayIndicator = document.getElementById('autoplay-indicator');

        document.addEventListener('DOMContentLoaded', () => {
            parseConfig();
            setupCanvasInput();
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) resize(entry.contentRect.width, entry.contentRect.height);
            });
            ro.observe(canvas);
        });

        function parseConfig() {
            const configScript = document.getElementById('game-config');
            if (configScript) {
                try {
                    const defs = JSON.parse(configScript.textContent);
                    window.gameConfigDefs = defs;
                    for (let key in defs) gameConfig[key] = defs[key].value;
                } catch (e) {}
            }
            gameConfig.laneCount = 4;
            updateThemeColors();
        }

        function renderSettingsOptions() {
            const themeContainer = document.getElementById('theme-options');
            themeContainer.innerHTML = '';
            THEMES.forEach((theme, idx) => {
                const btn = document.createElement('button');
                btn.className = `theme-btn text-xs px-3 py-1 ${idx === currentThemeIdx ? 'active-opt' : ''}`;
                btn.textContent = theme;
                btn.onclick = () => { currentThemeIdx = idx; updateThemeColors(); renderSettingsOptions(); playInstrument(RAIN_SCALE[0], currentInstrument); };
                themeContainer.appendChild(btn);
            });

            const instContainer = document.getElementById('instrument-options');
            instContainer.innerHTML = '';
            INSTRUMENTS.forEach((inst) => {
                const btn = document.createElement('button');
                btn.className = `theme-btn text-xs px-3 py-1 ${inst === currentInstrument ? 'active-opt' : ''}`;
                btn.textContent = inst;
                btn.onclick = () => { currentInstrument = inst; renderSettingsOptions(); playInstrument(RAIN_SCALE[0], currentInstrument); };
                instContainer.appendChild(btn);
            });
        }

        function playSfx(id, { volume = 0.45, restart = true, debounceMs = 0 } = {}) {
            if (!audioUnlocked) return;
            const el = document.getElementById(id);
            if (!el) return;
            const now = performance.now();
            const lastPlayed = activeSfxPlayers.get(id) || 0;
            if (debounceMs && now - lastPlayed < debounceMs) return;
            activeSfxPlayers.set(id, now);
            try {
                el.pause();
                if (restart) el.currentTime = 0;
                el.volume = volume;
                el.play().catch(() => {});
            } catch (e) {}
        }

        function flashReaction(target, timeoutMs) {
            if (!target) return;
            target.classList.add('show');
            const timeoutKey = target === reactionSuccess ? 'success' : 'fail';
            if (timeoutKey === 'success' && reactionSuccessTimeout) clearTimeout(reactionSuccessTimeout);
            if (timeoutKey === 'fail' && reactionFailTimeout) clearTimeout(reactionFailTimeout);
            const timer = setTimeout(() => target.classList.remove('show'), timeoutMs);
            if (timeoutKey === 'success') reactionSuccessTimeout = timer;
            if (timeoutKey === 'fail') reactionFailTimeout = timer;
        }

        function hideReactions() {
            reactionSuccess?.classList.remove('show');
            reactionFail?.classList.remove('show');
        }

        function updateThemeColors() {
            const theme = THEMES[currentThemeIdx];
            document.body.className = `theme-${theme.toLowerCase()}`;
            
            if (theme === 'Rain') {
                laneColors = ['#1e3a8a', '#2563eb', '#3b82f6', '#60a5fa'];
                document.getElementById('main-title').innerHTML = 'MEME<br>DROP';
            } else if (theme === 'MilkWaterfall') {
                laneColors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6']; 
                document.getElementById('main-title').innerHTML = 'SNACK<br>CASCADE';
            } else if (theme === 'Candy') {
                laneColors = ['#ec4899', '#a855f7', '#06b6d4', '#eab308'];
                document.getElementById('main-title').innerHTML = 'VIRAL<br>CANDY';
            } else if (theme === 'Arcade') {
                laneColors = ['#ff0055', '#00ffaa', '#00aaff', '#ffaa00'];
                document.getElementById('main-title').innerHTML = 'MEME<br>ARCADE';
            } else if (theme === 'Waterfall') {
                laneColors = ['#06b6d4', '#0ea5e9', '#3b82f6', '#2dd4bf'];
                document.getElementById('main-title').innerHTML = 'STREAM<br>FALL';
            } else if (theme === 'BlueHawaii') {
                laneColors = ['#bae6fd', '#7dd3fc', '#38bdf8', '#0ea5e9'];
                document.getElementById('main-title').innerHTML = 'COOL<br>POOL';
            }
            
            if (initialized) generateBgShapes();
        }

        window.toggleSettings = function() {
            unlockAudio();
            const isHidden = uiSettings.classList.contains('hidden');
            if (isHidden) {
                renderSettingsOptions();
                uiSettings.classList.remove('hidden');
                playSfx('sfx_menu_open', { volume: 0.35, debounceMs: 80 });
            } else {
                uiSettings.classList.add('hidden');
                playSfx('sfx_menu_close', { volume: 0.35, debounceMs: 80 });
            }
        };

        function resize(width, height) {
            cw = width; ch = height;
            canvas.width = Math.floor(cw * dpr);
            canvas.height = Math.floor(ch * dpr);
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            laneWidth = cw / gameConfig.laneCount;
            if (!initialized) {
                initialized = true;
                generateBgShapes();
                initMenu();
                requestAnimationFrame(gameLoop);
            } else {
                notes.forEach(n => n.x = (n.lane * laneWidth) + (laneWidth / 2));
                generateBgShapes();
            }
        }

        function loadCustomTracks() {
            let saved = [];
            try {
                    const data = localStorage.getItem('meme_arcade_tracks_v1');
                if (data) saved = JSON.parse(data);
            } catch(e) {}
            allTracks = [...baseTracks, ...saved];
        }

        function renderTrackList() {
            const list = document.getElementById('track-list');
            list.innerHTML = '';
            allTracks.forEach((t, idx) => {
                const btn = document.createElement('button');
                btn.className = `theme-btn text-lg py-3 w-full`;
                btn.innerHTML = `${idx + 1}. ${t.name} ${t.isCustom ? '🌐' : ''}`;
                btn.onclick = () => window.playTrack(idx);
                list.appendChild(btn);
            });
        }

        window.initMenu = function() {
            unlockAudio();
            stopAllAudio();
            hideReactions();
            score = 0; combo = 0; maxCombo = 0; missCount = 0;
            notes = []; particles = []; 
            generateBgShapes();
            loadCustomTracks();
            renderTrackList();
            setState('TRACK_SELECT');
            playSfx('sfx_ui_click', { volume: 0.28, debounceMs: 120 });
        };

        window.playTrack = function(trackIdx) {
            unlockAudio();
            currentTrackIndex = trackIdx;
            startActualGame();
        };

        window.toggleAutoplay = function() {
            unlockAudio();
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('autoplay-btn');
            btn.textContent = `AUTOPLAY DJ: ${isAutoplay ? 'ON' : 'OFF'}`;
            if(isAutoplay) {
                btn.classList.add('active-opt');
            } else {
                btn.classList.remove('active-opt');
            }
        };

        window.enterBuilder = function() {
            unlockAudio();
            stopAllAudio();
            setState('BUILDER');
            builderScrollY = 0;
            document.getElementById('builder-track-name').value = '';
            updateBuilderTopUI();
            const bgm = document.getElementById('bgm_build');
            if (bgm) { bgm.volume = 0.3; bgm.loop = true; bgm.play().catch(()=>{}); }
        };

        window.exitBuilder = function() {
            window.initMenu();
        };

        window.clearBuilder = function() {
            unlockAudio();
            builderNotes = [];
        };

        window.cycleBuilderSong = function() {
            builderSongIndex = (builderSongIndex + 1) % baseTracks.length;
            updateBuilderTopUI();
        };

        window.handleAudioUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const dataUrl = ev.target.result;
                const trackName = file.name.replace(/\.[^/.]+$/, "").substring(0, 15);
                
                baseTracks.push({
                    name: trackName,
                    bgm: 'bgm_uploaded_dynamic',
                    audioData: dataUrl,
                    bpm: 140,
                    scale: RAIN_SCALE
                });
                builderSongIndex = baseTracks.length - 1;
                updateBuilderTopUI();
            };
            reader.readAsDataURL(file);
        };

        window.toggleBuilderNoteType = function() {
            if (builderNoteType === 'tap') builderNoteType = 'endbar';
            else builderNoteType = 'tap';

            const btn = document.getElementById('btn-note-type');
            btn.textContent = `TYPE: ${builderNoteType.toUpperCase()}`;
            if (builderNoteType === 'endbar') {
                btn.style.borderColor = '#ef4444';
                btn.style.color = '#ef4444';
            } else {
                btn.style.borderColor = '';
                btn.style.color = '';
            }
        };

        function updateBuilderTopUI() {
            document.getElementById('btn-song-select').textContent = `SONG: ${baseTracks[builderSongIndex].name}`;
        }

        window.publishCustomTrack = function() {
            if (builderNotes.length === 0) return;
            let saved = [];
            try {
                const data = localStorage.getItem('meme_arcade_tracks_v1');
                if (data) saved = JSON.parse(data);
            } catch(e) {}
            
            const selectedSong = baseTracks[builderSongIndex];
            const nameInput = document.getElementById('builder-track-name').value.trim();
            const trackName = nameInput ? nameInput : ("Community Track " + (saved.length + 1));

            const newTrack = {
                name: trackName,
                bgm: selectedSong.bgm,
                audioData: selectedSong.audioData,
                bpm: selectedSong.bpm,
                scale: selectedSong.scale,
                isCustom: true,
                notesData: JSON.parse(JSON.stringify(builderNotes))
            };
            
            saved.push(newTrack);
            try {
                localStorage.setItem('meme_arcade_tracks_v1', JSON.stringify(saved));
                localStorage.removeItem('rain_custom_tracks_v3'); 
                window.exitBuilder();
            } catch(e) {
                    alert("Storage limit reached!");
            }
        };

        window.playCustomTest = function() {
            unlockAudio();
            currentTrackIndex = -1; 
            customBpm = baseTracks[builderSongIndex].bpm;
            customQueue = JSON.parse(JSON.stringify(builderNotes)).sort((a, b) => a.beat - b.beat);
            startActualGame();
        };

        function startActualGame() {
            score = 0; combo = 0; maxCombo = 0; missCount = 0;
            notes = []; particles = [];
            timeElapsed = 0;
            endbarSpawned = false;
            totalNotesSpawned = 0;
            hideReactions();
            
            let track = currentTrackIndex >= 0 ? allTracks[currentTrackIndex] : null;
            let bpm = track ? track.bpm : customBpm;
            
            if ((track && track.isCustom) || currentTrackIndex === -1) {
                if (track && track.isCustom) {
                    customQueue = JSON.parse(JSON.stringify(track.notesData)).sort((a, b) => a.beat - b.beat);
                }
                
                let hasEndbar = customQueue.some(n => n.type === 'endbar');
                if (!hasEndbar) {
                    let lastBeat = customQueue.length > 0 ? customQueue[customQueue.length - 1].beat : 0;
                    customQueue.push({ beat: lastBeat + 4, lane: 0, type: 'endbar' });
                }

                customQueue.forEach(n => { n.hitTime = n.beat * (60 / bpm); });
                maxNotesForTrack = customQueue.filter(n => n.type !== 'endbar').length;
            } else if (track) {
                const beatInterval = 60 / bpm;
                lastSpawnTime = -beatInterval; 
                if (track.name === "Scrollbreaker") {
                    maxNotesForTrack = 100;
                } else {
                    maxNotesForTrack = Math.floor(Math.random() * 71) + 30; // 30 to 100 notes
                }
            }
            
            autoplayIndicator.classList.toggle('hidden', !isAutoplay);
            updateHUD();
            setState('PLAYING');
            
            stopAllAudio();
            let bgmId = track ? track.bgm : baseTracks[builderSongIndex].bgm;
            let audioData = track ? track.audioData : baseTracks[builderSongIndex].audioData;

            if (bgmId === 'bgm_uploaded_dynamic' && audioData) {
                const dynAudio = document.getElementById('bgm_uploaded_dynamic');
                if (dynAudio.src !== audioData) {
                    dynAudio.src = audioData;
                    dynAudio.load();
                }
            }

            const bgm = document.getElementById(bgmId);
            if (bgm) {
                bgm.currentTime = 0;
                bgm.volume = 0.38;
                bgm.loop = true; // Loop BGM so we can guarantee note count
                if (audioUnlocked) bgm.play().catch(() => {});
            }
            playSfx('sfx_start_game', { volume: 0.34, debounceMs: 120 });
        }

        function stopAllAudio() {
            baseTracks.forEach(t => {
                const el = document.getElementById(t.bgm);
                if (el) { el.pause(); el.currentTime = 0; }
            });
            ['bgm_result', 'bgm_build', 'bgm_uploaded_dynamic'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.pause(); el.currentTime = 0; }
            });
        }

        function endTrack() {
            stopAllAudio();
            
            const resultBgm = document.getElementById('bgm_result');
            if (resultBgm) {
                resultBgm.volume = 0.34;
                resultBgm.play().catch(() => {});
            }
            
            let rank = 'D';
            let trackName = currentTrackIndex >= 0 ? allTracks[currentTrackIndex].name : "";
            let isScrollbreaker = trackName === "Scrollbreaker";

            if (isAutoplay) rank = 'F (AUTOPLAY)';
            else if (totalNotesSpawned > 0 && missCount >= totalNotesSpawned) rank = 'F';
            else if (missCount === 0) {
                rank = isScrollbreaker ? 'A' : 'S';
            }
            else if (missCount <= 3) rank = 'A';
            else if (missCount <= 10) rank = 'B';
            else if (missCount <= 20) rank = 'C';
            else rank = 'D';
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-combo').textContent = maxCombo;
            document.getElementById('final-misses').textContent = missCount;
            document.getElementById('final-rank').textContent = rank;
            
            if (rank === 'F' || rank === 'F (AUTOPLAY)') {
                playSfx('sfx_game_over', { volume: 0.4, debounceMs: 200 });
                flashReaction(reactionFail, 1800);
            } else {
                playSfx('sfx_level_complete', { volume: 0.42, debounceMs: 200 });
                flashReaction(reactionSuccess, 1800);
            }
            vibrate('heavy');
            setState('GAMEOVER');
        }

        function setState(newState) {
            gameState = newState;
            uiTrackSelect.classList.toggle('hidden', gameState !== 'TRACK_SELECT');
            uiHud.classList.toggle('hidden', gameState !== 'PLAYING');
            uiGameOver.classList.toggle('hidden', gameState !== 'GAMEOVER');
            uiBuilder.classList.toggle('hidden', gameState !== 'BUILDER');
            uiBuilderTop.classList.toggle('hidden', gameState !== 'BUILDER');
            if(gameState !== 'TRACK_SELECT') uiSettings.classList.add('hidden');
        }

        function unlockAudio() {
            if (!audioUnlocked) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                audioUnlocked = true;
            }
        }

        function playInstrument(freq, instrument) {
            if (!audioCtx) return;
            try {
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (instrument === '8-bit') {
                    osc.type = 'square';
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.2, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                    osc.frequency.setValueAtTime(freq, t);
                    osc.start(t); osc.stop(t + 0.2);
                } else if (instrument === 'Piano') {
                    osc.type = 'triangle';
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
                    osc.frequency.setValueAtTime(freq, t);
                    osc.start(t); osc.stop(t + 1.1);
                } else if (instrument === 'Organ') {
                    osc.type = 'sine';
                    const osc2 = audioCtx.createOscillator();
                    osc2.type = 'square';
                    osc2.frequency.value = freq * 2;
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(gain);
                    gain2.gain.value = 0.1;
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.2, t + 0.05);
                    gain.gain.setValueAtTime(0.2, t + 0.2); 
                    gain.gain.linearRampToValueAtTime(0.001, t + 0.3);
                    osc.frequency.setValueAtTime(freq, t);
                    osc.start(t); osc.stop(t + 0.3);
                    osc2.start(t); osc2.stop(t + 0.3);
                } else if (instrument === 'Harp') {
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.5, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
                    osc.frequency.setValueAtTime(freq, t);
                    osc.start(t); osc.stop(t + 1.6);
                } else if (instrument === 'Guitar') {
                    osc.type = 'sawtooth';
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(freq * 3, t);
                    filter.frequency.exponentialRampToValueAtTime(freq, t + 0.5);
                    
                    osc.disconnect();
                    osc.connect(filter);
                    filter.connect(gain);

                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.3, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                    osc.frequency.setValueAtTime(freq, t);
                    osc.start(t); osc.stop(t + 0.9);
                }
            } catch(e) {}
        }

        function vibrate(style = 'light') {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
                });
            } catch (e) {}
        }

        function setupCanvasInput() {
            canvas.addEventListener('pointerdown', handleCanvasDown, { passive: false });
            canvas.addEventListener('pointermove', handleCanvasMove, { passive: false });
            canvas.addEventListener('pointerup', handleCanvasUp, { passive: false });
            canvas.addEventListener('pointercancel', handleCanvasUp, { passive: false });
        }

        function handleCanvasDown(e) {
            unlockAudio();
            if (gameState === 'PLAYING' || gameState === 'BUILDER') {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                if (gameState === 'PLAYING' && !isAutoplay) {
                    const lane = Math.floor(x / laneWidth);
                    if (lane >= 0 && lane < gameConfig.laneCount) {
                        checkHit(lane, y, true); 
                    }
                } else if (gameState === 'BUILDER') {
                    dragStartY = y;
                    dragStartScrollY = builderScrollY;
                    isDraggingBuilder = false;
                }
            }
        }

        function handleCanvasMove(e) {
            if (gameState === 'BUILDER' && dragStartY !== 0) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const y = e.clientY - rect.top;
                let dy = y - dragStartY;
                if (Math.abs(dy) > 10) isDraggingBuilder = true;
                if (isDraggingBuilder) {
                    builderScrollY = Math.max(0, dragStartScrollY + dy);
                }
            }
        }

        function handleCanvasUp(e) {
            if (gameState === 'PLAYING' && !isAutoplay) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const lane = Math.floor(x / laneWidth);
                if (lane >= 0 && lane < gameConfig.laneCount) {
                    checkHit(lane, 0, false); 
                }
            }

            if (gameState === 'BUILDER' && dragStartY !== 0) {
                if (!isDraggingBuilder) {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    let worldY = y - builderScrollY;
                    let hitZoneY = ch * HIT_ZONE_Y_RATIO;
                    let beat = Math.round((hitZoneY - worldY) / (BEAT_HEIGHT / 2)) * 0.5; 
                    let lane = Math.floor(x / laneWidth);
                    let screenY = hitZoneY - beat * BEAT_HEIGHT + builderScrollY;
                    let screenX = lane * laneWidth + laneWidth / 2;

                    if (beat >= 0) {
                        if (builderNoteType === 'endbar') {
                            let existingIdx = builderNotes.findIndex(n => n.beat === beat && n.type === 'endbar');
                            if (existingIdx >= 0) {
                                builderNotes.splice(existingIdx, 1);
                                playInstrument(200, '8-bit');
                                spawnParticles(cw/2, screenY, '#ff0055', 'cross');
                            } else {
                                builderNotes.push({ beat, lane: 0, type: 'endbar' });
                                playInstrument(500, 'Piano');
                                spawnParticles(cw/2, screenY, '#ff0055', 'burst');
                            }
                        } else if (lane >= 0 && lane < gameConfig.laneCount) {
                            let existingIdx = builderNotes.findIndex(n => n.beat === beat && n.lane === lane && n.type !== 'endbar');
                            if (existingIdx >= 0) {
                                builderNotes.splice(existingIdx, 1);
                                playInstrument(200, '8-bit');
                                spawnParticles(screenX, screenY, '#555', 'cross');
                            } else {
                                builderNotes.push({ beat, lane, type: builderNoteType });
                                let scale = baseTracks[builderSongIndex].scale;
                                playInstrument(scale[lane % 4], currentInstrument);
                                spawnParticles(screenX, screenY, '#60a5fa', 'burst');
                            }
                        }
                    }
                }
                dragStartY = 0;
            }
        }

        function checkHit(lane, y, isDown) {
            const hitZoneCenter = ch * HIT_ZONE_Y_RATIO;
            const hitThreshold = ch * HIT_ZONE_HEIGHT_RATIO * 1.2; 

            let targetNote = null;
            for (let i = 0; i < notes.length; i++) {
                const n = notes[i];
                if (n.active && n.type !== 'endbar' && n.lane === lane && n.y > hitZoneCenter - hitThreshold * 2) {
                    targetNote = n;
                    break;
                }
            }

            let track = currentTrackIndex >= 0 ? allTracks[currentTrackIndex] : baseTracks[builderSongIndex];
            let scale = track ? track.scale : RAIN_SCALE;

            if (targetNote) {
                if (isDown && Math.abs(targetNote.y - hitZoneCenter) < hitThreshold) {
                    targetNote.active = false;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    score += 10 + (combo * 2);
                    spawnParticles(targetNote.x, targetNote.y, targetNote.color, 'burst');
                    playInstrument(scale[lane % 4], currentInstrument);
                    playSfx(combo > 0 && combo % 8 === 0 ? 'sfx_bonus' : 'sfx_hit', {
                        volume: combo > 0 && combo % 8 === 0 ? 0.46 : 0.32,
                        debounceMs: 70
                    });
                    if (combo >= 5 && combo % 5 === 0) flashReaction(reactionSuccess, 900);
                    vibrate('light');
                    updateHUD();
                }
            } else {
                if (isDown && gameState === 'PLAYING') {
                   spawnParticles((lane * laneWidth) + laneWidth/2, hitZoneCenter, '#555', 'cross');
                   playSfx('sfx_fail', { volume: 0.28, debounceMs: 120 });
                   flashReaction(reactionFail, 900);
                }
            }
        }

        function spawnNote() {
            const lane = Math.floor(Math.random() * gameConfig.laneCount);
            const isChord = Math.random() > 0.8;
            let chordSize = isChord ? 2 : 1;
            
            if (totalNotesSpawned + chordSize > maxNotesForTrack) {
                chordSize = maxNotesForTrack - totalNotesSpawned;
            }
            
            if (chordSize <= 0) return;
            
            const rand = Math.random();
            let type = 'tap';
            if (rand > 0.6) type = 'slide';

            for (let i = 0; i < chordSize; i++) {
                let targetLane = lane + i;
                if (targetLane >= gameConfig.laneCount) targetLane = lane - i;
                if (targetLane < 0) targetLane = 0;

                notes.push({
                    x: (targetLane * laneWidth) + (laneWidth / 2), 
                    y: -50, 
                    lane: targetLane, 
                    active: true, 
                    color: laneColors[targetLane % laneColors.length],
                    type: type,
                    duration: 0,
                    state: 'waiting' 
                });
                totalNotesSpawned++;
            }
        }

        function registerMiss() {
            if (combo > 0) {
                shakeTime = 0.2; vibrate('medium');
            }
            combo = 0;
            missCount++;
            score = Math.max(0, score - 20);
            playSfx('sfx_fail', { volume: 0.24, debounceMs: 160 });
            flashReaction(reactionFail, 1000);
            updateHUD();
        }

        function updateHUD() {
            scoreDisplay.textContent = score;
            comboDisplay.textContent = combo;
            missDisplay.textContent = missCount;
        }

        function spawnParticles(x, y, color, type='burst') {
            for(let i=0; i<8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                const speed = 50 + Math.random() * 100;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.0, color, type });
            }
        }

        function generateBgShapes() {
            bgShapes = [];
            const theme = THEMES[currentThemeIdx];
            if (theme === 'Rain') {
                for(let i=0; i<120; i++) {
                    bgShapes.push({
                        x: Math.random() * cw,
                        y: Math.random() * ch,
                        length: 20 + Math.random() * 40,
                        vx: (Math.random() - 0.5) * 100,
                        vy: 600 + Math.random() * 600,
                        width: 1 + Math.random() * 2
                    });
                }
            } else if (theme === 'MilkWaterfall') {
                for(let i=0; i<40; i++) {
                    bgShapes.push({
                        x: Math.random() * cw,
                        y: Math.random() * ch,
                        size: 10 + Math.random() * 15,
                        vy: 100 + Math.random() * 200,
                        type: Math.random() > 0.5 ? 'berry' : 'cereal',
                        color: Math.random() > 0.5 ? '#e11d48' : '#1d4ed8',
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 5
                    });
                }
            } else if (theme === 'Waterfall') {
                for(let i=0; i<80; i++) {
                    bgShapes.push({
                        x: Math.random() * cw,
                        y: Math.random() * ch,
                        length: 50 + Math.random() * 100,
                        vy: 400 + Math.random() * 300,
                        width: 2 + Math.random() * 4,
                        alpha: 0.1 + Math.random() * 0.3
                    });
                }
            } else if (theme === 'BlueHawaii') {
                for(let i=0; i<60; i++) {
                    bgShapes.push({
                        type: 'water',
                        x: Math.random() * cw,
                        y: Math.random() * ch,
                        length: 40 + Math.random() * 80,
                        vy: 300 + Math.random() * 200,
                        width: 2 + Math.random() * 5,
                        alpha: 0.2 + Math.random() * 0.4
                    });
                }
                for(let i=0; i<15; i++) {
                    bgShapes.push({
                        type: Math.random() > 0.5 ? 'orange' : 'pineapple',
                        x: Math.random() * cw,
                        y: Math.random() * ch,
                        size: 15 + Math.random() * 20,
                        vy: 150 + Math.random() * 100,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 3
                    });
                }
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            try { update(dt, timestamp); draw(); } catch (e) {}
            requestAnimationFrame(gameLoop);
        }

        function update(dt, timestamp) {
            if (shakeTime > 0) shakeTime -= dt;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 3;
                if (p.life <= 0) particles.splice(i, 1);
            }

            bgShapes.forEach(s => {
                s.y += s.vy * dt;
                if (s.vx) s.x += s.vx * dt;
                if (s.rotSpeed) s.rotation += s.rotSpeed * dt;
                let fallLimit = s.length ? s.length : (s.size ? s.size : 100);
                if (s.y > ch + fallLimit) { 
                    s.y = -fallLimit; 
                    s.x = Math.random() * cw; 
                }
            });

            if (gameState !== 'PLAYING') return;

            timeElapsed += dt;
            
            let track = currentTrackIndex >= 0 ? allTracks[currentTrackIndex] : null;
            let currentBpm = track ? track.bpm : customBpm;
            let scale = track ? track.scale : RAIN_SCALE;
            const currentSpeed = ch * 0.6 * (currentBpm / 100) * gameConfig.speedMult;
            const hitZoneCenter = ch * HIT_ZONE_Y_RATIO;
            
            if (track && !track.isCustom) {
                const beatInterval = 60 / currentBpm;
                
                if (totalNotesSpawned < maxNotesForTrack) {
                    if (timeElapsed - lastSpawnTime >= beatInterval) {
                        spawnNote(); 
                        lastSpawnTime += beatInterval;
                    }
                } else if (!endbarSpawned) {
                    if (timeElapsed - lastSpawnTime >= beatInterval * 4) {
                        endbarSpawned = true;
                        notes.push({
                            x: cw/2, y: -50, lane: 0, active: true, type: 'endbar', state: 'waiting'
                        });
                    }
                }
            } else {
                const timeToReach = (hitZoneCenter + 50) / currentSpeed;
                while (customQueue.length > 0 && timeElapsed >= customQueue[0].hitTime - timeToReach) {
                    let n = customQueue.shift();
                    notes.push({
                        x: (n.lane * laneWidth) + (laneWidth / 2),
                        y: -50,
                        lane: n.lane,
                        active: true,
                        color: laneColors[n.lane % laneColors.length],
                        type: n.type || 'tap',
                        duration: 0,
                        state: 'waiting'
                    });
                    if (n.type !== 'endbar') totalNotesSpawned++;
                }
            }

            if (isAutoplay) {
                const autoHitThreshold = ch * 0.02;
                for (let i = notes.length - 1; i >= 0; i--) {
                    let n = notes[i];
                    if (!n.active) continue;
                    if (n.type === 'endbar') continue;

                    if (Math.abs(n.y - hitZoneCenter) < autoHitThreshold) {
                        n.active = false;
                        combo++; if (combo > maxCombo) maxCombo = combo;
                        score += 10 + (combo * 2);
                        spawnParticles(n.x, n.y, n.color, 'burst');
                        playInstrument(scale[n.lane % 4], currentInstrument);
                        updateHUD();
                    }
                }
            }

            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                if (!n.active) continue;
                
                n.y += currentSpeed * dt;
                
                if (!isFinite(n.x) || !isFinite(n.y)) { n.active = false; continue; }
                
                if (n.type === 'endbar') {
                    if (n.y >= hitZoneCenter) {
                        n.active = false;
                        endTrack();
                        return;
                    }
                } else {
                    if (n.y > ch + 50) { 
                        n.active = false; 
                        registerMiss();
                    }
                }
            }
            notes = notes.filter(n => n.active);
        }

        function drawNote(ctx, x, y, size, color, theme) {
            ctx.save();
            ctx.translate(x, y);
            
            if (theme === 'Rain') {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, -size/1.5);
                ctx.bezierCurveTo(size/2, -size/4, size/2, size/2, 0, size/2);
                ctx.bezierCurveTo(-size/2, size/2, -size/2, -size/4, 0, -size/1.5);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(-size/6, size/8, size/6, 0, Math.PI*2);
                ctx.fill();
            } else if (theme === 'MilkWaterfall') {
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.strokeStyle = color;
                ctx.lineWidth = size / 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, size/2, 0, Math.PI*2);
                ctx.stroke();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = size / 8;
                ctx.beginPath();
                ctx.arc(0, 0, size/2, -Math.PI/2, 0);
                ctx.stroke();
            } else if (theme === 'Candy') {
                ctx.shadowBlur = 8;
                ctx.shadowColor = color;
                ctx.fillStyle = color;
                const r = size/3;
                ctx.beginPath();
                ctx.moveTo(-size/2 + r, -size/2);
                ctx.lineTo(size/2 - r, -size/2); ctx.quadraticCurveTo(size/2, -size/2, size/2, -size/2 + r);
                ctx.lineTo(size/2, size/2 - r); ctx.quadraticCurveTo(size/2, size/2, size/2 - r, size/2);
                ctx.lineTo(-size/2 + r, size/2); ctx.quadraticCurveTo(-size/2, size/2, -size/2, size/2 - r);
                ctx.lineTo(-size/2, -size/2 + r); ctx.quadraticCurveTo(-size/2, -size/2, -size/2 + r, -size/2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.ellipse(-size/4, -size/4, size/6, size/10, -Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            } else if (theme === 'Arcade') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fillStyle = '#111';
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.fillRect(-size/2, -size/2, size, size);
                ctx.strokeRect(-size/2, -size/2, size, size);
                
                ctx.fillStyle = color;
                ctx.fillRect(-size/4, -size/4, size/2, size/2);
            } else if (theme === 'Waterfall') {
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size/2);
                grad.addColorStop(0, '#a5f3fc');
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, '#083344');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, size/2, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.ellipse(-size/6, -size/6, size/5, size/8, -Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            } else if (theme === 'BlueHawaii') {
                ctx.shadowBlur = 5;
                ctx.shadowColor = color;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, size/2, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(-size/6, -size/6, size/8, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function draw() {
            const theme = THEMES[currentThemeIdx];
            
            ctx.clearRect(0, 0, cw, ch); 
            
            ctx.save();
            
            if (shakeTime > 0) {
                const mag = 8 * (shakeTime / 0.2);
                ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
            }

            if (theme === 'Rain') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, cw, ch);
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
                ctx.lineCap = 'round';
                bgShapes.forEach(s => {
                    ctx.lineWidth = s.width;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x + s.vx * 0.1, s.y + s.length);
                    ctx.stroke();
                });
            } else if (theme === 'MilkWaterfall') {
                ctx.fillStyle = '#fffdd0'; 
                ctx.fillRect(0, 0, cw, ch);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 40;
                ctx.lineCap = 'round';
                let t = Date.now() / 1000;
                for(let i=0; i<6; i++) {
                    ctx.beginPath();
                    let x = (cw / 5) * i + Math.sin(t + i) * 30;
                    ctx.moveTo(x, -50);
                    ctx.lineTo(x, ch + 50);
                    ctx.stroke();
                }

                bgShapes.forEach(s => {
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.rotation || 0);
                    if (s.type === 'berry') {
                        ctx.fillStyle = s.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, s.size, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.arc(-s.size/3, -s.size/3, s.size/4, 0, Math.PI*2);
                        ctx.fill();
                    } else {
                        ctx.strokeStyle = '#d97706';
                        ctx.lineWidth = s.size / 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, s.size, 0, Math.PI*2);
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            } else if (theme === 'Candy') {
                ctx.fillStyle = '#fce7f3';
                ctx.fillRect(0, 0, cw, ch);
                let t = Date.now() / 800;
                ctx.save();
                ctx.translate(cw/2, ch/2);
                ctx.rotate(t * 0.3);
                const numArms = 5;
                const swirlColors = ['#fbcfe8', '#f9a8d4', '#f472b6', '#ec4899', '#db2777'];
                let maxR = Math.max(cw, ch) * 1.2;
                for (let i = 0; i < numArms; i++) {
                    ctx.fillStyle = swirlColors[i % swirlColors.length];
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    for (let r = 0; r < maxR; r += 15) {
                        let angle = r * 0.008 + (i * Math.PI * 2 / numArms);
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    for (let r = maxR; r >= 0; r -= 15) {
                        let angle = r * 0.008 + ((i + 1.2) * Math.PI * 2 / numArms);
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.fill();
                }
                ctx.restore();
            } else if (theme === 'Arcade') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, cw, ch);
            } else if (theme === 'Waterfall') {
                ctx.fillStyle = '#083344';
                ctx.fillRect(0, 0, cw, ch);
                ctx.lineCap = 'round';
                bgShapes.forEach(s => {
                    ctx.strokeStyle = `rgba(34, 211, 238, ${s.alpha})`;
                    ctx.lineWidth = s.width;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x, s.y + s.length);
                    ctx.stroke();
                });
            } else if (theme === 'BlueHawaii') {
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(0, 0, cw, ch);
                ctx.lineCap = 'round';
                bgShapes.forEach(s => {
                    if (s.type === 'water') {
                        ctx.strokeStyle = `rgba(186, 230, 253, ${s.alpha})`;
                        ctx.lineWidth = s.width;
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(s.x, s.y + s.length);
                        ctx.stroke();
                    } else {
                        ctx.save();
                        ctx.translate(s.x, s.y);
                        ctx.rotate(s.rotation || 0);
                        if (s.type === 'orange') {
                            ctx.fillStyle = '#f97316';
                            ctx.beginPath(); ctx.arc(0, 0, s.size, 0, Math.PI*2); ctx.fill();
                            ctx.fillStyle = '#fffbeb';
                            ctx.beginPath(); ctx.arc(0, 0, s.size*0.8, 0, Math.PI*2); ctx.fill();
                            ctx.fillStyle = '#f97316';
                            for(let j=0; j<6; j++) {
                                ctx.beginPath();
                                ctx.moveTo(0,0);
                                ctx.arc(0, 0, s.size*0.75, j*Math.PI/3 + 0.1, (j+1)*Math.PI/3 - 0.1);
                                ctx.fill();
                            }
                        } else if (s.type === 'pineapple') {
                            ctx.fillStyle = '#eab308';
                            ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size);
                            ctx.strokeStyle = '#ca8a04';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(-s.size/2, -s.size/2, s.size, s.size);
                        }
                        ctx.restore();
                    }
                });
            }
            
            ctx.globalAlpha = 1.0;

            if (gameState === 'PLAYING' || gameState === 'BUILDER') {
                if (gameState === 'PLAYING') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                    ctx.fillRect(0, 0, cw, ch);
                }

                ctx.lineWidth = 1; 
                ctx.strokeStyle = (theme === 'MilkWaterfall' || theme === 'Candy' || theme === 'BlueHawaii') ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.05)';
                if (theme === 'Arcade') ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                for (let i = 1; i < gameConfig.laneCount; i++) {
                    ctx.beginPath(); ctx.moveTo(i * laneWidth, 0); ctx.lineTo(i * laneWidth, ch); ctx.stroke();
                }

                const hitY = ch * HIT_ZONE_Y_RATIO, hitH = ch * HIT_ZONE_HEIGHT_RATIO;
                
                if (gameState === 'PLAYING') {
                    ctx.fillStyle = (theme === 'MilkWaterfall' || theme === 'Candy' || theme === 'BlueHawaii') ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.02)'; 
                    ctx.fillRect(0, hitY - hitH/2, cw, hitH);

                    if (theme === 'Rain') {
                        ctx.strokeStyle = 'rgba(96, 165, 250, 0.5)'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(0, hitY); ctx.lineTo(cw, hitY); ctx.stroke();
                        ctx.fillStyle = 'rgba(96, 165, 250, 0.3)';
                        for(let i=0; i<cw; i+=20) { ctx.beginPath(); ctx.arc(i, hitY, Math.random()*3, 0, Math.PI*2); ctx.fill(); }
                    } else if (theme === 'MilkWaterfall') {
                        ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(10, hitY); ctx.lineTo(cw-10, hitY); ctx.stroke();
                    } else if (theme === 'Candy') {
                        ctx.strokeStyle = '#fbcfe8'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(20, hitY); ctx.lineTo(cw-20, hitY); ctx.stroke();
                    } else if (theme === 'Arcade') {
                        ctx.strokeStyle = '#00ffaa'; ctx.lineWidth = 2;
                        for(let i=0; i<cw; i+=10) { ctx.fillRect(i, hitY-2, 5, 4); }
                    } else if (theme === 'Waterfall') {
                        ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(10, hitY); ctx.lineTo(cw-10, hitY); ctx.stroke();
                    } else if (theme === 'BlueHawaii') {
                        ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(10, hitY); ctx.lineTo(cw-10, hitY); ctx.stroke();
                    }
                }

                const noteSize = laneWidth * 0.6;

                if (gameState === 'BUILDER') {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(96, 165, 250, 0.8)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(0, hitY); ctx.lineTo(cw, hitY); ctx.stroke();
                    
                    let startBeat = Math.floor((-builderScrollY - (ch - hitY)) / BEAT_HEIGHT);
                    let endBeat = Math.ceil((-builderScrollY + hitY) / BEAT_HEIGHT);
                    
                    ctx.strokeStyle = (theme === 'MilkWaterfall' || theme === 'Candy' || theme === 'BlueHawaii') ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.1)';
                    for (let b = Math.max(0, startBeat); b <= endBeat + 50; b += 0.5) {
                        let y = hitY - b * BEAT_HEIGHT + builderScrollY;
                        if (y > 0 && y < ch) {
                            ctx.lineWidth = (b % 1 === 0) ? 2 : 1;
                            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
                            if (b % 1 === 0) {
                                ctx.fillStyle = (theme === 'MilkWaterfall' || theme === 'Candy' || theme === 'BlueHawaii') ? '#b45309' : '#94a3b8'; 
                                ctx.font = '12px ' + (theme === 'Arcade' ? '"Orbitron"' : '"Orbitron"');
                                ctx.fillText(b, 5, y - 5);
                            }
                        }
                    }

                    builderNotes.forEach(n => {
                        let y = hitY - n.beat * BEAT_HEIGHT + builderScrollY;
                        if (y > -150 && y < ch + 150) {
                            if (n.type === 'endbar') {
                                ctx.fillStyle = 'rgba(255, 0, 85, 0.4)';
                                ctx.fillRect(0, y - 5, cw, 10);
                                ctx.fillStyle = '#ff0055';
                                ctx.font = 'bold 16px ' + (theme === 'Arcade' ? '"Orbitron"' : '"Orbitron"');
                                ctx.textAlign = 'center';
                                ctx.fillText("FINISH", cw/2, y - 10);
                                ctx.textAlign = 'left';
                            } else {
                                let x = n.lane * laneWidth + laneWidth / 2;
                                drawNote(ctx, x, y, noteSize, n.color || laneColors[n.lane % laneColors.length], theme);
                            }
                        }
                    });
                    ctx.restore();
                }

                if (gameState === 'PLAYING') {
                    notes.forEach(n => {
                        ctx.save(); 
                        
                        if (n.type === 'endbar') {
                            ctx.fillStyle = 'rgba(255, 0, 85, 0.5)';
                            ctx.fillRect(0, n.y - 5, cw, 10);
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = '#ff0055';
                            ctx.strokeStyle = '#ff0055';
                            ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.moveTo(0, n.y); ctx.lineTo(cw, n.y); ctx.stroke();
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = (theme === 'MilkWaterfall' || theme === 'Candy' || theme === 'BlueHawaii' || theme === 'Waterfall') ? '#fff' : '#fff';
                            ctx.font = 'bold 24px ' + (theme === 'Arcade' ? '"Orbitron"' : '"Orbitron"');
                            ctx.textAlign = 'center';
                            ctx.fillText("FINISH", cw/2, n.y - 12);
                            ctx.textAlign = 'left';
                        } else if (n.type === 'tap' || n.type === 'slide') {
                            drawNote(ctx, n.x, n.y, noteSize, n.color, theme);
                        }
                        
                        ctx.restore();
                    });
                }
            }

            particles.forEach(p => {
                ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = Math.max(0, p.life);
                if (p.type === 'cross') {
                    ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); ctx.stroke();
                } else {
                    ctx.fillStyle = p.color; ctx.beginPath();
                    if (theme === 'Arcade') {
                        let s = Math.max(0, 4 * p.life);
                        ctx.fillRect(-s, -s, s*2, s*2);
                    } else {
                        ctx.arc(0, 0, Math.max(0, 4 * p.life), 0, Math.PI*2); ctx.fill();
                    }
                }
                ctx.restore();
            });
            
            ctx.restore();
        }
    </script>
