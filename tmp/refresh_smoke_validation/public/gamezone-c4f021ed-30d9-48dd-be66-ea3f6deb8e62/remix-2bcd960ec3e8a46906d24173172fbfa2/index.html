<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>VOXEL VECTOR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap');
        
        :root {
            --bg-core: #040816;
            --bg-deep: #09122d;
            --panel-top: rgba(14, 25, 58, 0.9);
            --panel-bottom: rgba(7, 12, 28, 0.86);
            --line: rgba(117, 225, 255, 0.28);
            --line-strong: rgba(117, 225, 255, 0.7);
            --accent-cyan: #75e1ff;
            --accent-blue: #68a7ff;
            --accent-pink: #ff4d95;
            --accent-gold: #ffd166;
            --text-main: #f4fbff;
            --text-soft: rgba(219, 239, 255, 0.78);
        }
        
        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            background:
                radial-gradient(circle at 50% 22%, rgba(104, 167, 255, 0.18), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(255, 77, 149, 0.14), transparent 34%),
                linear-gradient(180deg, var(--bg-deep), var(--bg-core) 42%, #02040b 100%);
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(117, 225, 255, 0.05) 50%, transparent 100%);
            opacity: 0.55;
            animation: drift 10s linear infinite;
        }

        body::after {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05), transparent 40%);
            opacity: 0.8;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none;
        }

        /* UI Styling */
        .glass-panel {
            position: relative;
            background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 16px 44px rgba(0, 0, 0, 0.5),
                0 0 26px rgba(104, 167, 255, 0.16);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 32%, transparent 68%, rgba(117,225,255,0.08));
            pointer-events: none;
        }

        .title-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
        }

        .hud-font {
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .neon-text-red {
            color: #ffeaf5;
            text-shadow:
                0 0 10px rgba(117, 225, 255, 0.7),
                0 0 24px rgba(255, 77, 149, 0.5),
                0 0 40px rgba(104, 167, 255, 0.28);
        }
        
        .neon-button {
            background: linear-gradient(135deg, #0f2557 0%, #1e3f87 48%, #2159c9 100%);
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
            border: 1px solid rgba(117, 225, 255, 0.7);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 10px 24px rgba(7, 18, 46, 0.65),
                0 0 18px rgba(104, 167, 255, 0.28);
        }
        
        .neon-button::after {
            content: '';
            position: absolute;
            top: 0; left: -120%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
            transition: 0.5s;
        }
        
        .neon-button:active {
            transform: scale(0.96);
            filter: brightness(1.1);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08) inset,
                0 0 18px rgba(117, 225, 255, 0.45);
        }

        .neon-button:hover::after {
            left: 120%;
        }

        /* Scanline Overlay */
        #scanlines {
            background:
                linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18)),
                linear-gradient(90deg, rgba(117,225,255,0.035), transparent 38%, rgba(255,77,149,0.035) 100%);
            background-size: 100% 4px, 100% 100%;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
        }

        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 46%, rgba(1, 3, 8, 0.92) 110%);
            pointer-events: none;
            z-index: 9;
        }

        .hidden { display: none !important; }
        
        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes drift {
            0% { transform: translateX(-8%); }
            100% { transform: translateX(8%); }
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(117, 225, 255, 0.16); }
            50% { box-shadow: 0 0 0 10px rgba(117, 225, 255, 0); }
        }

        .animate-float { animation: float 3s ease-in-out infinite; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .bottom-20 { bottom: 5rem; }
        .z-20 { z-index: 20; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-xs { max-width: 20rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .my-6 { margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .rounded { border-radius: 0.25rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; border-style: solid; }
        .border-t-4 { border-top-width: 4px; border-top-style: solid; }
        .border-b-4 { border-bottom-width: 4px; border-bottom-style: solid; }
        .border-t-neon-red, .border-b-neon-red { border-color: #ff0033; }
        .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
        .border-white\/20 { border-color: rgba(255, 255, 255, 0.2); }
        .bg-black\/40 { background: rgba(0, 0, 0, 0.4); }
        .bg-black\/50 { background: rgba(0, 0, 0, 0.5); }
        .bg-black\/60 { background: rgba(0, 0, 0, 0.6); }
        .bg-red-900 { background: rgba(84, 17, 48, 0.92); }
        .bg-neon-red { background: linear-gradient(135deg, #ff4d95, #ff7c5c); }
        .bg-white { background: #ffffff; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .text-white { color: var(--text-main); }
        .text-white\/80 { color: rgba(228, 244, 255, 0.84); }
        .text-gray-300 { color: var(--text-soft); }
        .text-gray-400 { color: rgba(176, 201, 223, 0.65); }
        .text-neon-red { color: var(--accent-pink); }
        .text-neon-blue { color: var(--accent-cyan); }
        .text-\[10px\], .text-xs { font-size: 0.625rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-6xl { font-size: 3.75rem; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'Orbitron', 'Courier New', monospace; }
        .italic { font-style: italic; }

        #fx-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 18;
            overflow: hidden;
        }

        .fx-badge {
            position: absolute;
            right: 1rem;
            width: min(26vw, 110px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(117, 225, 255, 0.45);
            background: rgba(5, 10, 22, 0.74);
            box-shadow: 0 0 18px rgba(104, 167, 255, 0.25);
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .fx-badge.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #warning-gif {
            top: max(4.75rem, calc(env(safe-area-inset-top) + 3.75rem));
        }

        #crash-gif {
            bottom: max(1rem, calc(env(safe-area-inset-bottom) + 0.5rem));
        }

        .status-chip {
            position: absolute;
            left: 50%;
            bottom: max(1rem, calc(env(safe-area-inset-bottom) + 0.5rem));
            transform: translateX(-50%);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(117, 225, 255, 0.35);
            background: rgba(3, 8, 20, 0.84);
            color: var(--text-main);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 0 16px rgba(104, 167, 255, 0.18);
        }

        .status-chip.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .fx-badge {
                width: min(24vw, 84px);
                right: 0.65rem;
            }
        }
        .uppercase { text-transform: uppercase; }
        .leading-none { line-height: 1; }
        .leading-relaxed { line-height: 1.625; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-wider { letter-spacing: 0.05em; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-\[0\.3em\] { letter-spacing: 0.3em; }
        .drop-shadow-md { text-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); }
        .shadow-lg { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35); }
        .overflow-hidden { overflow: hidden; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .space-x-1 > * + * { margin-left: 0.25rem; }
        .inline-block { display: inline-block; }
        .active\:bg-white\/20:active { background: rgba(255, 255, 255, 0.2); }
        .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
        .w-2 { width: 0.5rem; }
        .h-2 { height: 0.5rem; }
        .w-10 { width: 2.5rem; }
        .h-10 { height: 2.5rem; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
    </style>
</head>
<body>

    <!-- Game Layer -->
    <div id="game-container" class="relative w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="vignette"></div>
        <div id="scanlines"></div>
        <div id="fx-layer" aria-hidden="true">
            <!-- [agent-note][stage3] resolved-gif: warning/crash feedback -> catalogs/gifs.json | keep off playfield -->
            <img id="warning-gif" class="fx-badge" src="https://i.giphy.com/1qXINH0qhhsNDiu0T5.webp" alt="">
            <img id="crash-gif" class="fx-badge" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="">
            <div id="status-chip" class="status-chip">Neural sync online</div>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none z-20">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-8 rounded-2xl text-center pointer-events-auto max-w-xs w-full mx-4 border-t-4 border-t-neon-red animate-float">
                <div class="mb-2 text-neon-blue text-xs tracking-[0.3em] font-bold hud-font">CORE SIGNAL LOCKED</div>
                <h1 class="title-font text-6xl font-bold text-white mb-0 neon-text-red tracking-tighter leading-none">VOXEL<br><span class="text-neon-red">VECTOR</span></h1>
                <div class="my-6 flex justify-center space-x-1">
                    <div class="w-2 h-2 bg-neon-red rounded-full"></div>
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <div class="w-2 h-2 bg-neon-red rounded-full"></div>
                </div>
                <p class="text-gray-300 text-sm mb-8 leading-relaxed">
                    Guide the <strong class="text-white">Pulse Core</strong>.<br>
                    Slip past hostile cube swarms.<br>
                    Drag to move.
                </p>
                <button id="start-btn" class="neon-button w-full py-4 rounded font-bold text-xl tracking-widest text-white shadow-lg hud-font">INITIALIZE</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-8 rounded-2xl text-center pointer-events-auto max-w-xs w-full mx-4 border-b-4 border-b-neon-red">
                <h2 class="title-font text-4xl font-bold text-white mb-2 neon-text-red">SYSTEM CRASH</h2>
                <div class="text-neon-red text-sm font-mono mb-6 uppercase tracking-widest">Vector Link Lost</div>
                
                <div class="bg-black/40 rounded p-4 mb-8 border border-white/10">
                    <div class="text-xs text-gray-400 uppercase tracking-wider mb-1 hud-font">Distance</div>
                    <div class="text-4xl font-mono text-white" id="final-score">0000</div>
                </div>
                
                <button id="restart-btn" class="neon-button w-full py-4 rounded font-bold text-xl tracking-widest text-white shadow-lg hud-font">REBOOT</button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full p-4 pt-safe flex justify-between items-start hidden pointer-events-auto">
                <div class="text-left">
                    <div class="text-[10px] text-neon-red font-bold tracking-widest uppercase hud-font">Distance</div>
                    <div id="score-display" class="text-3xl font-mono text-white drop-shadow-md">0</div>
                </div>
                
                <!-- Sound Toggle -->
                <button id="sound-btn" class="w-10 h-10 bg-black/50 border border-white/20 rounded-full flex items-center justify-center text-white active:bg-white/20">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
            
            <!-- Tutorial Overlay -->
            <div id="tutorial" class="absolute bottom-20 w-full text-center hidden pointer-events-none">
                <div class="inline-block px-4 py-2 bg-black/60 rounded-full border border-white/10 text-white/80 text-sm font-bold tracking-widest animate-pulse hud-font">
                    DRAG TO EVADE
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        /* 
           VOXEL VECTOR - Single File HTML5 Game
           Concept: Tunnel runner where obstacles are "cubes made of cubes".
           Tech: Vanilla JS, Canvas 2D, Touch Optimized.
        */

        // --- CONSTANTS & CONFIG ---
        const CONFIG = {
            colors: {
                bg: '#040816',
                player: '#f8fdff',
                playerGlow: '#75e1ff',
                playerCore: '#ffd166',
                cubeStatic: '#68a7ff',
                cubeHunter: '#ff4d95',
                cubeStaticDark: '#204694',
                cubeHunterDark: '#7f1f59',
                grid: 'rgba(117, 225, 255, 0.16)'
            },
            audio: {
                bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
            }
        };

        // --- STATE MANAGEMENT ---
        const state = {
            active: false,
            score: 0,
            speed: 0,
            frame: 0,
            shake: 0,
            muted: false,
            width: 0,
            height: 0,
            cx: 0,
            cy: 0
        };

        const player = {
            x: 0, y: 0, z: 0,
            radius: 10,
            targetX: 0, targetY: 0,
            trail: []
        };

        let entities = [];
        let particles = [];
        let stars = [];
        let warningActive = false;
        let warningGifTimer = null;
        let crashGifTimer = null;
        let statusChipTimer = null;

        // --- AUDIO SYSTEM ---
        const audioSys = {
            bgm: new Audio(CONFIG.audio.bgm),
            sounds: {
                start: new Audio(CONFIG.audio.start),
                uiClick: new Audio(CONFIG.audio.uiClick),
                warning: new Audio(CONFIG.audio.warning),
                crash: new Audio(CONFIG.audio.crash)
            },
            lastPlay: {},
            init() {
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                Object.entries(this.sounds).forEach(([key, sound]) => {
                    sound.preload = 'auto';
                    sound.volume = key === 'warning' ? 0.28 : key === 'crash' ? 0.55 : 0.42;
                });
            },
            playBGM() {
                if (!state.muted) this.bgm.play().catch(() => {});
            },
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            },
            play(name, cooldown = 0) {
                if (state.muted) return;
                const now = performance.now();
                if (cooldown && this.lastPlay[name] && now - this.lastPlay[name] < cooldown) return;
                this.lastPlay[name] = now;
                const base = this.sounds[name];
                if (!base) return;
                const s = base.cloneNode();
                s.volume = base.volume;
                s.play().catch(() => {});
            },
            toggleMute() {
                state.muted = !state.muted;
                if (state.muted) this.bgm.pause();
                else if (state.active) this.bgm.play().catch(() => {});
                return state.muted;
            }
        };
        audioSys.init();

        // --- CANVAS SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const warningGif = document.getElementById('warning-gif');
        const crashGif = document.getElementById('crash-gif');
        const statusChip = document.getElementById('status-chip');

        function resize() {
            state.width = canvas.width = window.innerWidth;
            state.height = canvas.height = window.innerHeight;
            state.cx = state.width / 2;
            state.cy = state.height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- UTILS ---
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- CLASSES ---

        class Star {
            constructor() {
                this.reset(true);
            }
            reset(randomZ = false) {
                this.x = (Math.random() - 0.5) * state.width * 2;
                this.y = (Math.random() - 0.5) * state.height * 2;
                this.z = randomZ ? Math.random() * 2000 : 2000;
                this.size = Math.random() * 2;
            }
            update() {
                this.z -= (state.speed * 20);
                if (this.z <= 0) this.reset();
            }
            draw() {
                const scale = 300 / this.z;
                const sx = state.cx + this.x * scale;
                const sy = state.cy + this.y * scale;
                if (sx < 0 || sx > state.width || sy < 0 || sy > state.height) return;
                
                const alpha = Math.min(1, scale);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fillRect(sx, sy, this.size * scale, this.size * scale);
            }
        }

        class CompositeCube {
            constructor() {
                this.reset();
            }

            reset() {
                this.active = true;
                this.z = 2500;
                
                // Spawn Logic
                const angle = Math.random() * Math.PI * 2;
                const dist = rand(100, 800);
                this.x = Math.cos(angle) * dist;
                this.y = Math.sin(angle) * dist;
                
                this.type = Math.random() > 0.7 ? 'hunter' : 'static';
                this.color = this.type === 'hunter' ? CONFIG.colors.cubeHunter : CONFIG.colors.cubeStatic;
                this.shadow = this.type === 'hunter' ? CONFIG.colors.cubeHunterDark : CONFIG.colors.cubeStaticDark;
                
                // Rotation
                this.rotation = Math.random() * Math.PI;
                this.rotSpeed = rand(-0.05, 0.05);
                
                // Size
                this.baseSize = rand(80, 140);
            }

            update() {
                this.z -= state.speed * 25;
                this.rotation += this.rotSpeed;

                // Hunter tracking
                if (this.type === 'hunter' && this.z > 300) {
                    this.x += (player.x - this.x) * 0.02;
                    this.y += (player.y - this.y) * 0.02;
                }

                // Collision
                if (this.active && this.z < 200 && this.z > 50) {
                    const scale = 300 / this.z;
                    const screenX = state.cx + this.x * scale;
                    const screenY = state.cy + this.y * scale;
                    const screenR = (this.baseSize * 0.4) * scale;

                    const dx = screenX - (state.cx + player.x);
                    const dy = screenY - (state.cy + player.y);
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < screenR + player.radius) {
                        gameOver();
                    }
                }

                if (this.z <= 0) this.active = false;
            }

            draw() {
                if (!this.active || this.z < 10) return;

                const scale = 300 / this.z;
                const sx = state.cx + this.x * scale;
                const sy = state.cy + this.y * scale;
                const size = this.baseSize * scale;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(this.rotation);

                // Draw Composite Cube (3x3 Grid)
                // We draw two layers to simulate depth: Back (darker) and Front (lighter)
                
                const cellSize = size / 3;
                const gap = size * 0.05; // Gap between sub-cubes
                const depthOffset = size * 0.1; // Pseudo 3D depth

                // Layer 1: Back/Depth (Darker)
                ctx.fillStyle = this.shadow;
                ctx.globalAlpha = 0.58;
                for(let ix = -1; ix <= 1; ix++) {
                    for(let iy = -1; iy <= 1; iy++) {
                        // Skip center for ring look? Or keep solid. Let's keep solid.
                        // Actually, let's remove corners for a cooler shape sometimes
                        if (Math.abs(ix) + Math.abs(iy) === 2 && this.type === 'hunter') continue; 

                        const cx = ix * cellSize + depthOffset;
                        const cy = iy * cellSize + depthOffset;
                        ctx.fillRect(cx - (cellSize-gap)/2, cy - (cellSize-gap)/2, cellSize-gap, cellSize-gap);
                    }
                }

                // Layer 2: Front (Bright)
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = this.color;
                ctx.strokeStyle = 'rgba(248, 253, 255, 0.92)';
                ctx.lineWidth = Math.max(1, scale * 1.2);

                for(let ix = -1; ix <= 1; ix++) {
                    for(let iy = -1; iy <= 1; iy++) {
                        // Same shape logic
                        if (Math.abs(ix) + Math.abs(iy) === 2 && this.type === 'hunter') continue;

                        const cx = ix * cellSize;
                        const cy = iy * cellSize;
                        const s = cellSize - gap;
                        
                        // Fill
                        ctx.fillRect(cx - s/2, cy - s/2, s, s);
                        
                        // Inner detail (the "cube inside cube" look)
                        ctx.strokeRect(cx - s/2, cy - s/2, s, s);
                        
                        // Highlight dot
                        ctx.fillStyle = CONFIG.colors.playerCore;
                        ctx.fillRect(cx - 3, cy - 3, 6, 6);
                        ctx.fillStyle = this.color;
                    }
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const a = Math.random() * Math.PI * 2;
                const s = Math.random() * 8 + 2;
                this.vx = Math.cos(a) * s;
                this.vy = Math.sin(a) * s;
                this.life = 1.0;
                this.decay = rand(0.02, 0.05);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- GAMEPLAY FUNCTIONS ---

        function flashGif(element, duration = 900) {
            if (!element) return;
            element.classList.add('show');
            const timerName = element === warningGif ? 'warningGifTimer' : 'crashGifTimer';
            clearTimeout(timerName === 'warningGifTimer' ? warningGifTimer : crashGifTimer);
            const timeoutId = setTimeout(() => element.classList.remove('show'), duration);
            if (timerName === 'warningGifTimer') warningGifTimer = timeoutId;
            else crashGifTimer = timeoutId;
        }

        function showStatus(message, duration = 900) {
            statusChip.textContent = message;
            statusChip.classList.add('show');
            clearTimeout(statusChipTimer);
            statusChipTimer = setTimeout(() => statusChip.classList.remove('show'), duration);
        }

        function updateThreatFeedback() {
            const threat = entities.some((entity) => entity.active && entity.z < 520 && entity.z > 180);
            if (threat && !warningActive) {
                warningActive = true;
                flashGif(warningGif, 800);
                audioSys.play('warning', 1400);
                showStatus('Threat spike');
            } else if (!threat) {
                warningActive = false;
            }
        }

        function initGame() {
            state.score = 0;
            state.speed = 1.0;
            state.frame = 0;
            state.shake = 0;
            warningActive = false;
            
            player.x = 0;
            player.y = 0;
            player.targetX = 0;
            player.targetY = 0;
            player.trail = [];

            entities = [];
            particles = [];
            stars = Array(100).fill().map(() => new Star());
            warningGif.classList.remove('show');
            crashGif.classList.remove('show');
            statusChip.classList.remove('show');
            
            updateHUD();
        }

        function spawnEntities() {
            // Spawn rate gets faster as speed increases
            const rate = Math.max(15, 60 - Math.floor(state.speed * 10));
            if (state.frame % rate === 0) {
                entities.push(new CompositeCube());
            }
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = Math.floor(state.score);
        }

        function gameOver() {
            if (!state.active) return;
            state.active = false;
            state.shake = 25;
            
            // Explosion
            for(let i=0; i<40; i++) {
                particles.push(new Particle(state.cx + player.x, state.cy + player.y, CONFIG.colors.playerGlow));
                particles.push(new Particle(state.cx + player.x, state.cy + player.y, '#fff'));
            }

            audioSys.stopBGM();
            audioSys.play('crash', 0);
            flashGif(crashGif, 1800);
            showStatus('Vector link lost', 1800);

            setTimeout(() => {
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('tutorial').classList.add('hidden');
                document.getElementById('final-score').textContent = Math.floor(state.score);
            }, 800);
        }

        // --- INPUT ---
        function handleInput(e) {
            if (!state.active) return;
            e.preventDefault();
            
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }

            // Absolute mapping with sensitivity
            // 2.0 multiplier allows reaching corners comfortably
            player.targetX = (cx - state.cx) * 2.0;
            player.targetY = (cy - state.cy) * 2.0;
        }

        window.addEventListener('touchmove', handleInput, { passive: false });
        window.addEventListener('mousemove', handleInput);
        
        // --- LOOP ---

        function loop() {
            // Clear & Background
            ctx.fillStyle = CONFIG.colors.bg;
            ctx.fillRect(0, 0, state.width, state.height);

            // Shake
            let sx = 0, sy = 0;
            if (state.shake > 0) {
                sx = (Math.random() - 0.5) * state.shake;
                sy = (Math.random() - 0.5) * state.shake;
                state.shake *= 0.9;
                if (state.shake < 0.5) state.shake = 0;
            }
            
            ctx.save();
            ctx.translate(sx, sy);

            // Stars
            stars.forEach(s => {
                if (state.active) s.update();
                s.draw();
            });

            // Grid Tunnel (Perspective Lines)
            ctx.strokeStyle = CONFIG.colors.grid;
            ctx.lineWidth = 1;
            ctx.beginPath();
            const gridCount = 12;
            for(let i=0; i<gridCount; i++) {
                const a = (i/gridCount) * Math.PI * 2 + (state.frame * 0.005);
                ctx.moveTo(state.cx, state.cy);
                ctx.lineTo(state.cx + Math.cos(a) * state.width, state.cy + Math.sin(a) * state.width);
            }
            ctx.stroke();

            if (state.active) {
                state.frame++;
                state.score += state.speed;
                state.speed += 0.0005; // Gradual acceleration

                // Player Move
                player.x += (player.targetX - player.x) * 0.15;
                player.y += (player.targetY - player.y) * 0.15;

                // Bounds
                const maxR = Math.min(state.width, state.height) * 0.45;
                const d = Math.sqrt(player.x*player.x + player.y*player.y);
                if (d > maxR) {
                    const ang = Math.atan2(player.y, player.x);
                    player.x = Math.cos(ang) * maxR;
                    player.y = Math.sin(ang) * maxR;
                }
                
                // Trail
                if (state.frame % 3 === 0) {
                    player.trail.push({x: player.x, y: player.y, life: 1.0});
                }

                spawnEntities();
                updateThreatFeedback();
                if (state.frame % 10 === 0) updateHUD();
            }

            // Draw Trail
            player.trail.forEach((t, i) => {
                t.life -= 0.05;
                if (t.life <= 0) {
                    player.trail.splice(i, 1);
                    return;
                }
                const size = player.radius * t.life;
                ctx.fillStyle = `rgba(0, 243, 255, ${t.life * 0.5})`;
                ctx.beginPath();
                ctx.arc(state.cx + t.x, state.cy + t.y, size, 0, Math.PI*2);
                ctx.fill();
            });

            // Entities (Sort Z)
            entities.sort((a,b) => b.z - a.z);
            entities.forEach(e => {
                if (state.active) e.update();
                e.draw();
            });
            entities = entities.filter(e => e.active);

            // Particles
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Player Render
            if (state.active || particles.length > 0) {
                const px = state.cx + player.x;
                const py = state.cy + player.y;

                // Glow shell
                ctx.shadowBlur = 26;
                ctx.shadowColor = CONFIG.colors.playerGlow;
                ctx.fillStyle = 'rgba(117, 225, 255, 0.24)';
                ctx.beginPath();
                ctx.arc(px, py, player.radius * 1.95, 0, Math.PI * 2);
                ctx.fill();

                // Core ring
                ctx.shadowBlur = 16;
                ctx.strokeStyle = CONFIG.colors.playerGlow;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, player.radius * 1.45, 0, Math.PI * 2);
                ctx.stroke();

                // Main core
                ctx.shadowBlur = 22;
                ctx.shadowColor = CONFIG.colors.playerGlow;
                const coreGradient = ctx.createRadialGradient(px - 3, py - 4, 2, px, py, player.radius);
                coreGradient.addColorStop(0, '#ffffff');
                coreGradient.addColorStop(0.45, CONFIG.colors.playerCore);
                coreGradient.addColorStop(1, CONFIG.colors.playerGlow);
                ctx.fillStyle = coreGradient;
                ctx.beginPath();
                ctx.arc(px, py, player.radius, 0, Math.PI*2);
                ctx.fill();

                // Orbiting Bits (Data)
                ctx.shadowBlur = 0;
                const orbitTime = Date.now() * 0.005;
                for(let i=0; i<3; i++) {
                    const oa = orbitTime + (i * Math.PI * 2 / 3);
                    const ox = Math.cos(oa) * player.radius * 2.15;
                    const oy = Math.sin(oa) * player.radius * 2.15;
                    ctx.fillStyle = i === 1 ? CONFIG.colors.playerCore : CONFIG.colors.playerGlow;
                    ctx.fillRect(px + ox - 2.5, py + oy - 2.5, 5, 5);
                }
            }

            ctx.restore();
            requestAnimationFrame(loop);
        }

        // --- UI EVENTS ---
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            state.active = true;
            initGame();
            audioSys.play('start', 0);
            audioSys.playBGM();
            showStatus('Run initialized');
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            state.active = true;
            initGame();
            audioSys.play('uiClick', 0);
            audioSys.playBGM();
            showStatus('Reboot engaged');
        });

        document.getElementById('sound-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // prevent movement trigger
            const wasMuted = state.muted;
            const muted = audioSys.toggleMute();
            if (!wasMuted && muted) {
                showStatus('Audio muted');
            } else {
                audioSys.play('uiClick', 0);
                showStatus('Audio online');
            }
            document.getElementById('sound-icon').textContent = muted ? '🔇' : '🔊';
            document.getElementById('sound-btn').classList.toggle('bg-red-900', muted);
        });

        // Start Loop
        initGame(); // Pre-init for background visuals
        loop();

    </script>
</body>
