<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbital Scout: System Survey</title>
    <!-- [agent-note][stage4] remapped-font: title/display -> Audiowide | ui/body -> Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-bg: #060814;
            --space-bg-deep: #0f1730;
            --panel: rgba(10, 18, 40, 0.74);
            --panel-border: rgba(111, 240, 255, 0.24);
            --panel-shadow: rgba(0, 0, 0, 0.34);
            --text-main: #f4fbff;
            --text-dim: #8ca7cf;
            --signal: #73f4ff;
            --signal-strong: #39d8ff;
            --highlight: #ffd86f;
            --warning: #ff6b8f;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(57, 216, 255, 0.12), transparent 34%),
                radial-gradient(circle at 20% 80%, rgba(255, 216, 111, 0.1), transparent 28%),
                linear-gradient(180deg, var(--space-bg-deep) 0%, var(--space-bg) 62%, #04050d 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }
        body { color: var(--text-main); }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 18%, rgba(255,255,255,0.14) 0 1px, transparent 1.5px),
                radial-gradient(circle at 76% 26%, rgba(115,244,255,0.18) 0 1px, transparent 1.5px),
                radial-gradient(circle at 30% 72%, rgba(255,216,111,0.16) 0 1px, transparent 1.5px),
                radial-gradient(circle at 65% 78%, rgba(255,255,255,0.12) 0 1px, transparent 1.5px);
            opacity: 0.7;
        }
        canvas { display: block; touch-action: none; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .top-1\/4 { top: 25%; }
        .left-1\/2 { left: 50%; }
        .bottom-0 { bottom: 0; }
        .left-0 { left: 0; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .hidden { display: none !important; }
        .block { display: block; }
        .flex { display: flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }
        .flex-wrap { flex-wrap: wrap; }
        .items-start { align-items: flex-start; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .w-12 { width: 3rem; }
        .w-8 { width: 2rem; }
        .w-6 { width: 1.5rem; }
        .h-full { height: 100%; }
        .h-12 { height: 3rem; }
        .h-8 { height: 2rem; }
        .h-6 { height: 1.5rem; }
        .h-4 { height: 1rem; }
        .min-h-screen { min-height: 100vh; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .select-none { user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .cursor-pointer { cursor: pointer; }
        .transform { transform: translateZ(0); }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .-translate-y-1\/2 { margin-top: -25%; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-transparent { border-color: transparent; }
        .border-white { border-color: #fff; }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .bg-\[\#0f0f1a\] { background-color: #0f0f1a; }
        .bg-gray-800 { background-color: #1f2937; }
        .bg-black { background-color: #000; }
        .bg-white { background-color: #fff; }
        .bg-white\/10 { background-color: rgba(255,255,255,0.1); }
        .bg-cyan-500 { background: linear-gradient(135deg, var(--signal-strong), #3479ff); }
        .text-white { color: #fff; }
        .text-white\/50 { color: rgba(255,255,255,0.5); }
        .text-gray-300 { color: #cfe0ff; }
        .text-gray-400 { color: var(--text-dim); }
        .text-gray-500 { color: #6682af; }
        .text-cyan-400 { color: var(--signal); }
        .text-yellow-400 { color: var(--highlight); }
        .text-transparent { color: transparent; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-\[10px\] { font-size: 10px; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .font-bold { font-weight: 700; }
        .uppercase { text-transform: uppercase; }
        .tracking-wider { letter-spacing: 0.05em; }
        .tracking-widest { letter-spacing: 0.1em; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pb-24 { padding-bottom: 6rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2), 0 4px 6px -4px rgba(0,0,0,0.2); }
        .shadow-cyan-500\/30 { box-shadow: 0 16px 34px rgba(57, 216, 255, 0.24); }
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--signal), #7ba5ff); }
        .bg-gradient-to-t { background-image: linear-gradient(to top, rgba(6, 8, 20, 0.96), rgba(6, 8, 20, 0)); }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .opacity-80 { opacity: 0.8; }
        .glass {
            background:
                linear-gradient(180deg, rgba(20, 32, 68, 0.86), rgba(8, 15, 34, 0.82)),
                var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 12px 30px var(--panel-shadow);
        }
        .hud-card {
            position: relative;
            overflow: hidden;
        }
        .hud-card::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(115, 244, 255, 0.16), transparent 40%, rgba(255, 216, 111, 0.08));
            opacity: 0.85;
        }
        .status-hint {
            letter-spacing: 0.18em;
            text-shadow: 0 0 12px rgba(115, 244, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #42f2ff 0%, #4d9aff 52%, #7e6bff 100%);
            color: white;
            transition: transform 0.1s, box-shadow 0.18s ease, filter 0.18s ease;
            font-family: 'Audiowide', 'Rajdhani', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:hover {
            filter: brightness(1.06);
            box-shadow: 0 0 22px rgba(115, 244, 255, 0.32);
        }
        .planet-list::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        .drift-float { animation: driftFloat 3.4s ease-in-out infinite; }
        .scan-pulse { animation: scanPulse 2.6s ease-in-out infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes driftFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes scanPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(115, 244, 255, 0.08); }
            50% { box-shadow: 0 0 0 10px rgba(115, 244, 255, 0); }
        }
        #virtual-stick-base { border: 2px solid rgba(255,255,255,0.3); }
        #virtual-stick-knob { background: rgba(255,255,255,0.8); }
        #ui-title, #discovery-name { font-family: 'Audiowide', 'Rajdhani', sans-serif; }
        #hangar-screen {
            background:
                radial-gradient(circle at top center, rgba(57, 216, 255, 0.16), transparent 32%),
                linear-gradient(180deg, #09101f 0%, #060814 100%);
        }
        #astro-preview {
            box-shadow: 0 0 18px rgba(115, 244, 255, 0.24);
        }
    </style>
</head>
<body>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "shipSpeed": { "type": "number", "label": "Thruster Power", "value": 6, "min": 2, "max": 15 },
    "gravityStrength": { "type": "number", "label": "Gravity Assist", "value": 0.5, "min": 0, "max": 2 },
    "gameTitle": { "type": "text", "label": "Game Title", "value": "Orbital Scout" }
}
</script>

<!-- Audio Assets -->
<!-- [agent-note][stage3] resolved-audio: loop/ui/discovery/thruster -> catalogs/audios.json -->
<audio id="bgm_space" data-editable="audio" data-label="Deep Space Patrol Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
<audio id="sfx_discover" data-editable="audio" data-label="Survey Log Success" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx_launch" data-editable="audio" data-label="Launch Cue" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3" preload="auto"></audio>
<audio id="sfx_ui" data-editable="audio" data-label="Hangar UI Click" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
<audio id="sfx_boost" data-editable="audio" data-label="Thruster Burst" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_02.mp3" preload="auto"></audio>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none text-white">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (Flight Mode) -->
    <div id="hud" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-start">
            <div class="glass hud-card rounded-xl p-3 text-sm">
                <div class="text-cyan-400 font-bold">DRIFT</div>
                <div id="hud-vel">0 km/s</div>
                <div class="mt-2 text-cyan-400 font-bold">LOCKED ON</div>
                <div id="hud-near">Quiet Void</div>
            </div>
            <div class="glass hud-card rounded-xl p-3 text-right">
                <div class="text-xs text-gray-400">LOGGED</div>
                <div id="hud-progress" class="text-xl font-bold text-yellow-400">0 / 23</div>
            </div>
        </div>
        
        <!-- Controls Hint -->
        <div class="text-center text-white/50 text-sm mb-8 status-hint">
            Left Stick: Steer • Right Tap: Burst
        </div>
    </div>

    <!-- Discovery Popup -->
    <div id="discovery-popup" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass scan-pulse px-8 py-4 rounded-2xl text-center hidden z-50">
        <div class="text-cyan-400 text-sm font-bold tracking-widest uppercase mb-1">Survey Logged</div>
        <h2 id="discovery-name" class="text-3xl font-bold text-white">PLANET X</h2>
        <div id="discovery-desc" class="text-gray-300 text-xs mt-2">Outer-system anomaly with crossed rings</div>
    </div>

    <!-- [agent-note][stage3] resolved-gif: discovery/reentry overlays -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
    <div id="media-flare" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 pointer-events-none hidden z-50">
        <img id="media-flare-img" src="https://i.giphy.com/lQCWKamnWogIppnoob.webp" alt="Discovery flare" style="width:min(42vw,180px); border-radius:18px; border:1px solid rgba(115,244,255,0.45); box-shadow:0 10px 28px rgba(0,0,0,0.35);">
    </div>
    <div id="boost-flare" class="absolute bottom-0 left-1/2 transform -translate-x-1/2 pointer-events-none hidden z-40">
        <img id="boost-flare-img" src="https://i.giphy.com/1qXINH0qhhsNDiu0T5.webp" alt="Boost flare" style="width:min(34vw,140px); opacity:0.82; filter:saturate(1.1);">
    </div>

    <!-- Hangar / Main Menu -->
    <div id="hangar-screen" class="absolute inset-0 z-40 bg-[#0f0f1a] flex flex-col">
        <!-- Header -->
        <div class="p-6 text-center">
            <h1 id="ui-title" class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-600">ORBITAL SCOUT</h1>
            <p class="text-gray-400 text-sm mt-1">Tune • Launch • Survey</p>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-6 pb-24">
            <!-- Ship Selection -->
            <div class="mb-6">
                <h3 class="text-sm font-bold text-gray-500 mb-3 uppercase">Select Scout</h3>
                <div class="grid grid-cols-3 gap-3" id="ship-grid">
                    <!-- Generated via JS -->
                </div>
            </div>

            <!-- Astronaut Customization -->
            <div class="mb-6 glass rounded-xl p-4">
                <h3 class="text-sm font-bold text-gray-500 mb-3 uppercase">Pilot Badge</h3>
                <div class="flex items-center gap-4">
                    <div id="astro-preview" class="w-12 h-12 rounded-full border-2 border-white flex items-center justify-center bg-gray-800 drift-float">
                        <div class="w-8 h-8 rounded-full bg-white relative overflow-hidden">
                            <div class="absolute top-2 left-1 w-6 h-4 bg-black rounded-full opacity-80"></div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-400">Signal Color</label>
                        <div class="flex gap-2 mt-2" id="color-picker">
                            <!-- Generated via JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mission List -->
            <div class="glass rounded-xl p-4">
                <h3 class="text-sm font-bold text-gray-500 mb-2 uppercase">Survey Targets</h3>
                <p class="text-xs text-gray-400 mb-3">Sweep past each world to complete the system log.</p>
                <div class="flex flex-wrap gap-2" id="target-list">
                    <!-- Generated via JS -->
                </div>
            </div>
        </div>

        <!-- Launch Button -->
        <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#0f0f1a] to-transparent">
            <button id="launch-btn" class="btn-primary w-full py-4 rounded-xl text-xl font-bold shadow-lg shadow-cyan-500/30 tracking-wider">
                BEGIN SURVEY
            </button>
        </div>
    </div>
</div>

<script>
/** 
     * §2 Technical Contract & §3 Editable Protocol
     * [agent-note][stage1] role: future-audio | trigger: survey-log-popup | intent: reinforce each successful scan
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
let dpr = 1;

// Config
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if(window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if(key === 'gameTitle') document.getElementById('ui-title').innerText = val;
    }
};

// Audio Manager
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_space'),
    discover: document.getElementById('sfx_discover'),
    launch: document.getElementById('sfx_launch'),
    ui: document.getElementById('sfx_ui'),
    boost: document.getElementById('sfx_boost')
};
const soundLastPlayed = {};
let audioUnlocked = false;

Object.entries({
    bgm: 0.2,
    discover: 0.72,
    launch: 0.68,
    ui: 0.5,
    boost: 0.34
}).forEach(([name, volume]) => {
    if (sounds[name]) sounds[name].volume = volume;
});

const syncLoopState = () => {
    if (!sounds.bgm) return;
    if (!audioUnlocked || currentState !== STATE.FLIGHT || document.hidden) {
        sounds.bgm.pause();
        return;
    }
    if (sounds.bgm.paused) {
        sounds.bgm.play().catch(() => {});
    }
};

const unlockAudio = () => {
    if(audioUnlocked) return;
    audioCtx.resume().catch(() => {});
    audioUnlocked = true;
    syncLoopState();
    document.removeEventListener('pointerdown', unlockAudio);
    document.removeEventListener('keydown', unlockAudio);
};
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);
document.addEventListener('visibilitychange', syncLoopState);

const playSfx = (name, cooldown = 120) => {
    if(!audioUnlocked || !sounds[name]) return;
    const now = performance.now();
    if (soundLastPlayed[name] && now - soundLastPlayed[name] < cooldown) return;
    soundLastPlayed[name] = now;
    sounds[name].currentTime = 0;
    sounds[name].play().catch(()=>{});
};

/**
 * Game State & Data
 */
const STATE = {
    HANGAR: 0,
    FLIGHT: 1
};
let currentState = STATE.HANGAR;
let boostFxTimeout = 0;

// Celestial Bodies Database
const BODIES = [
    { name: "Sun", r: 100, color: "#FFD700", dist: 0, type: "star" },
    { name: "Mercury", r: 15, color: "#A5A5A5", dist: 200 },
    { name: "Venus", r: 25, color: "#E3BB76", dist: 350 },
    { name: "Earth", r: 26, color: "#22A6B3", dist: 500, ring: false, moon: true },
    { name: "Mars", r: 20, color: "#EB4D4B", dist: 650 },
    { name: "Ceres", r: 8, color: "#95A5A6", dist: 800 },
    { name: "Asteroid Belt", r: 0, color: "#555", dist: 900, type: "belt" },
    { name: "Jupiter", r: 60, color: "#E17055", dist: 1200, ring: true },
    { name: "Saturn", r: 55, color: "#F1C40F", dist: 1600, ring: true, ringSize: 2.2 },
    { name: "Uranus", r: 40, color: "#74B9FF", dist: 2000, ring: true, ringSize: 1.5 },
    { name: "Neptune", r: 38, color: "#0984E3", dist: 2400, ring: true, ringSize: 1.4 },
    { name: "Orcus", r: 12, color: "#6C5CE7", dist: 2700 },
    { name: "Pluto", r: 12, color: "#FAB1A0", dist: 2900 },
    { name: "Haumea", r: 14, color: "#DFE6E9", dist: 3100, oval: true },
    { name: "Makemake", r: 13, color: "#D35400", dist: 3300 },
    { name: "Kuiper Belt", r: 0, color: "#444", dist: 3500, type: "belt" },
    { name: "Eris", r: 15, color: "#FFF", dist: 3700 },
    { name: "Sedna", r: 16, color: "#C0392B", dist: 4000 },
    { name: "Planet X", r: 45, color: "#2D3436", dist: 4500, xRing: true },
    { name: "Oort Cloud", r: 0, color: "#333", dist: 5000, type: "cloud" }
];

// Vehicles
const SHIPS = [
    { id: 'rocket', name: 'Rocket', speedMod: 1.0, color: '#ecf0f1', shape: 'rocket' },
    { id: 'lander', name: 'Lander', speedMod: 0.8, color: '#f1c40f', shape: 'lander' },
    { id: 'rover', name: 'Rover', speedMod: 0.6, color: '#e67e22', shape: 'rover' }, // Flying rover? Why not
    { id: 'sat', name: 'Satellite', speedMod: 1.2, color: '#3498db', shape: 'sat' },
    { id: 'station', name: 'Station', speedMod: 0.5, color: '#95a5a6', shape: 'station' }
];

// Player State
let player = {
    x: 0,
    y: 500, // Start near Earth
    vx: 0,
    vy: 0,
    angle: 0,
    shipId: 0,
    color: '#ffffff',
    discovered: []
};

// Input
const input = {
    active: false,
    x: 0,
    y: 0,
    boost: false,
    stickX: 0,
    stickY: 0,
    stickActive: false,
    stickOrigin: {x:0, y:0}
};

// Camera
let cam = { x: 0, y: 0, zoom: 1 };

// Particles
let particles = [];
const discoveryGifEl = document.getElementById('media-flare');
const discoveryGifImg = document.getElementById('media-flare-img');
const boostGifEl = document.getElementById('boost-flare');

/**
 * Initialization
 */
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Setup Hangar UI
    setupHangar();
    
    // Input Listeners
    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    document.addEventListener('pointermove', onPointerMove, { passive: false });
    document.addEventListener('pointerup', onPointerUp, { passive: false });
    document.addEventListener('pointercancel', onPointerUp, { passive: false });

    // Start Loop
    requestAnimationFrame(gameLoop);
}

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setupHangar() {
    // Ship Grid
    const shipGrid = document.getElementById('ship-grid');
    SHIPS.forEach((ship, idx) => {
        const btn = document.createElement('div');
        btn.className = `glass rounded-lg p-2 flex flex-col items-center justify-center cursor-pointer border-2 ${idx===0 ? 'border-cyan-400' : 'border-transparent'}`;
        btn.innerHTML = `
            <div class="w-8 h-8 mb-1 rounded-full" style="background:${ship.color}"></div>
            <span class="text-[10px] uppercase font-bold">${ship.name}</span>
        `;
        btn.onclick = () => {
            player.shipId = idx;
            playSfx('ui', 70);
            Array.from(shipGrid.children).forEach(c => c.classList.replace('border-cyan-400', 'border-transparent'));
            btn.classList.replace('border-transparent', 'border-cyan-400');
        };
        shipGrid.appendChild(btn);
    });

    // Colors
    const colors = ['#ffffff', '#ff4757', '#2ed573', '#ffa502', '#1e90ff', '#a55eea'];
    const colorPick = document.getElementById('color-picker');
    colors.forEach(c => {
        const d = document.createElement('div');
        d.className = 'w-6 h-6 rounded-full cursor-pointer border border-white/20';
        d.style.backgroundColor = c;
        d.onclick = () => {
            player.color = c;
            playSfx('ui', 70);
            document.getElementById('astro-preview').style.backgroundColor = c;
        };
        colorPick.appendChild(d);
    });

    // Targets
    const targetList = document.getElementById('target-list');
    BODIES.forEach(b => {
        if(b.type === 'star' || b.type === 'belt' || b.type === 'cloud') return;
        const t = document.createElement('div');
        t.className = 'text-[10px] bg-white/10 px-2 py-1 rounded text-gray-400';
        t.innerText = b.name;
        t.id = `target-${b.name}`;
        targetList.appendChild(t);
    });

    // Launch
    document.getElementById('launch-btn').onclick = () => {
        playSfx('launch', 100);
        currentState = STATE.FLIGHT;
        document.getElementById('hangar-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        syncLoopState();
    };
}

function resetGame() {
    player.x = 0;
    player.y = 500; // Earth dist
    player.vx = 2; // Initial orbital velocity
    player.vy = 0;
    player.discovered = [];
    particles = [];
    
    // Mark Sun and Earth as discovered
    discover('Sun');
    discover('Earth');
}

/**
 * Input Handling (Virtual Joystick)
 */
function onPointerDown(e) {
    e.preventDefault();
    const x = e.clientX;
    const y = e.clientY;
    const w = window.innerWidth;

    if (x < w / 2) {
        // Left side: Joystick
        input.stickActive = true;
        input.stickOrigin = { x, y };
        input.stickX = 0;
        input.stickY = 0;
    } else {
        // Right side: Boost
        input.boost = true;
    }
}

function onPointerMove(e) {
    e.preventDefault();
    if (input.stickActive) {
        const maxDist = 50;
        const dx = e.clientX - input.stickOrigin.x;
        const dy = e.clientY - input.stickOrigin.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const clampedDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        
        input.stickX = (Math.cos(angle) * clampedDist) / maxDist;
        input.stickY = (Math.sin(angle) * clampedDist) / maxDist;
    }
}

function onPointerUp(e) {
    e.preventDefault();
    // Simple logic: if touch ended on left, reset stick. If on right, reset boost.
    // Since we don't track touch IDs strictly for simplicity in single file, reset based on area or just reset all if multi-touch gets complex.
    // Better: use changedTouches if available, but contract forbids.
    // Fallback: If no touches left, reset all.
    
    // For single pointer simplicity:
    input.stickActive = false;
    input.stickX = 0;
    input.stickY = 0;
    input.boost = false;
}

/**
 * Logic
 */
function update(dt) {
    if (currentState !== STATE.FLIGHT) return;

    const shipStats = SHIPS[player.shipId];
    const speed = window.gameConfig.shipSpeed * shipStats.speedMod;

    // Physics
    // Apply stick input to velocity (Arcade style)
    if (input.stickActive) {
        player.vx += input.stickX * speed * dt * 2;
        player.vy += input.stickY * speed * dt * 2;
        player.angle = Math.atan2(input.stickY, input.stickX);
    }

    // Boost
    if (input.boost) {
        player.vx += Math.cos(player.angle) * speed * dt * 4;
        player.vy += Math.sin(player.angle) * speed * dt * 4;
        playSfx('boost', 180);
        showBoostFlare();
        
        // Particles
        for(let i=0; i<3; i++) {
            particles.push({
                x: player.x - Math.cos(player.angle)*10,
                y: player.y - Math.sin(player.angle)*10,
                vx: -Math.cos(player.angle)*2 + (Math.random()-0.5),
                vy: -Math.sin(player.angle)*2 + (Math.random()-0.5),
                life: 1.0,
                color: i%2===0 ? '#00d2ff' : '#ffffff'
            });
        }
    }

    // Friction (Space drag for control)
    player.vx *= 0.98;
    player.vy *= 0.98;

    // Gravity from Sun
    const sunDist = Math.sqrt(player.x*player.x + player.y*player.y);
    const sunAngle = Math.atan2(-player.y, -player.x);
    // Very weak pull to keep you in system
    const gForce = 1000 / (sunDist * sunDist + 1000) * window.gameConfig.gravityStrength;
    player.vx += Math.cos(sunAngle) * gForce;
    player.vy += Math.sin(sunAngle) * gForce;

    // Position Update
    player.x += player.vx * dt * 60;
    player.y += player.vy * dt * 60;

    // Planet Interaction
    let nearestDist = Infinity;
    let nearestName = "Quiet Void";

    BODIES.forEach(b => {
        // Planets orbit sun (Visual only, static for gameplay simplicity or slow rotation)
        // Let's make them rotate slowly so the world feels alive
        const orbitSpeed = 50 / (b.dist + 1);
        const orbitAngle = Date.now() * 0.0001 * orbitSpeed + b.dist; // Random start pos based on dist
        
        // Calculate planet actual position
        let px = Math.cos(orbitAngle) * b.dist;
        let py = Math.sin(orbitAngle) * b.dist;
        
        if (b.dist === 0) { px = 0; py = 0; } // Sun

        b.currX = px;
        b.currY = py;

        // Distance to player
        const dx = player.x - px;
        const dy = player.y - py;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // Discovery Logic
        if (dist < b.r + 100 && !player.discovered.includes(b.name) && b.type !== 'belt' && b.type !== 'cloud') {
            discover(b.name);
        }

        // Gravity Assist (SOI)
        if (dist < b.r + 150 && b.dist > 0) {
            const pull = 50 / (dist + 10) * window.gameConfig.gravityStrength;
            const ang = Math.atan2(-dy, -dx);
            player.vx += Math.cos(ang) * pull * dt * 60;
            player.vy += Math.sin(ang) * pull * dt * 60;
        }

        if (dist < nearestDist) {
            nearestDist = dist;
            nearestName = b.name;
        }
    });

    // Update HUD
    const vTotal = Math.sqrt(player.vx*player.vx + player.vy*player.vy).toFixed(1);
    document.getElementById('hud-vel').innerText = vTotal + ' km/s';
    document.getElementById('hud-near').innerText = nearestName;

    // Camera follow
    // Smooth lerp
    cam.x += (player.x - cam.x) * 0.1;
    cam.y += (player.y - cam.y) * 0.1;
}

function showDiscoveryFlare(isRare) {
    if (!discoveryGifEl || !discoveryGifImg) return;
    discoveryGifImg.src = isRare
        ? 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
        : 'https://i.giphy.com/lQCWKamnWogIppnoob.webp';
    discoveryGifEl.classList.remove('hidden');
    clearTimeout(showDiscoveryFlare.hideTimer);
    showDiscoveryFlare.hideTimer = setTimeout(() => {
        discoveryGifEl.classList.add('hidden');
    }, isRare ? 2400 : 1800);
}

function showBoostFlare() {
    if (!boostGifEl) return;
    boostGifEl.classList.remove('hidden');
    clearTimeout(boostFxTimeout);
    boostFxTimeout = setTimeout(() => {
        boostGifEl.classList.add('hidden');
    }, 320);
}

function discover(name) {
    if(player.discovered.includes(name)) return;
    player.discovered.push(name);
    playSfx('discover', 90);
    
    // UI Update
    document.getElementById('hud-progress').innerText = `${player.discovered.length} / ${BODIES.filter(b=>!b.type).length}`;
    
    // Popup
    const popup = document.getElementById('discovery-popup');
    document.getElementById('discovery-name').innerText = name;
    
    // Find description
    const body = BODIES.find(b => b.name === name);
    let desc = "Mapped orbital body";
    if(body.ring) desc = "Ringed giant added to the survey log";
    if(name === 'Sun') desc = "Primary star anchoring the whole route";
    if(name === 'Earth') desc = "Home marker confirmed on the chart";
    if(name === 'Planet X') desc = "Outer-system anomaly with crossed rings";
    
    document.getElementById('discovery-desc').innerText = desc;
    showDiscoveryFlare(name === 'Planet X' || player.discovered.length >= BODIES.filter(b=>!b.type).length - 1);
    
    popup.classList.remove('hidden');
    popup.classList.add('fade-in');
    
    setTimeout(() => {
        popup.classList.add('hidden');
        popup.classList.remove('fade-in');
    }, 3000);

    // Update Hangar List
    const el = document.getElementById(`target-${name}`);
    if(el) {
        el.classList.remove('bg-white/10', 'text-gray-400');
        el.classList.add('bg-cyan-500', 'text-white');
    }
}

/**
 * Rendering
 */
function draw() {
    // Clear
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (currentState === STATE.FLIGHT) {
        ctx.save();
        
        // Camera Transform
        const cx = canvas.width / 2 / dpr;
        const cy = canvas.height / 2 / dpr;
        
        // Stars (Parallax)
        drawStars(cx, cy, 0.5);

        ctx.translate(cx, cy);
        ctx.scale(cam.zoom, cam.zoom);
        ctx.translate(-cam.x, -cam.y);

        // Draw Orbits (faint lines)
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        BODIES.forEach(b => {
            if (b.dist > 0 && b.type !== 'belt' && b.type !== 'cloud') {
                ctx.beginPath();
                ctx.arc(0, 0, b.dist, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        // Draw Bodies
        BODIES.forEach(b => {
            if (b.type === 'belt' || b.type === 'cloud') {
                drawBelt(b);
                return;
            }
            drawPlanet(b);
        });

        // Draw Particles
        particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if(p.life <= 0) particles.splice(i, 1);
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2 + p.life*2, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Draw Player
        drawPlayer();

        ctx.restore();

        // Virtual Stick UI
        if(input.stickActive) {
            const sx = input.stickOrigin.x;
            const sy = input.stickOrigin.y;
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 50, 0, Math.PI*2);
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(sx + input.stickX*50, sy + input.stickY*50, 20, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function drawStars(cx, cy, parallax) {
    // Deterministic random stars based on screen pos
    // Simple implementation: Static noise
    // For better effect, we'll just draw random dots that move opposite to cam
    const starOffX = cam.x * parallax;
    const starOffY = cam.y * parallax;
    
    ctx.fillStyle = 'white';
    for(let i=0; i<100; i++) {
        // Use pseudo random based on index
        let x = (Math.sin(i)*10000) % canvas.width;
        let y = (Math.cos(i)*10000) % canvas.height;
        // Wrap
        x = (x - starOffX) % (canvas.width/dpr);
        y = (y - starOffY) % (canvas.height/dpr);
        if(x<0) x += canvas.width/dpr;
        if(y<0) y += canvas.height/dpr;
        
        const size = (i % 3) + 1;
        ctx.globalAlpha = 0.3 + (Math.sin(Date.now()*0.005 + i)*0.2);
        ctx.fillRect(x, y, size, size);
    }
    ctx.globalAlpha = 1;
}

function drawPlanet(b) {
    const x = b.currX;
    const y = b.currY;

    // Rings
    if (b.ring) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 6);
        ctx.beginPath();
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = 0.4;
        ctx.lineWidth = b.r * 0.5;
        ctx.ellipse(0, 0, b.r * (b.ringSize || 1.8), b.r * 0.6, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    
    // Planet X Cross Ring
    if (b.xRing) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.6;
        
        ctx.beginPath();
        ctx.rotate(Math.PI/4);
        ctx.ellipse(0, 0, b.r * 2, b.r * 0.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.rotate(Math.PI/2);
        ctx.ellipse(0, 0, b.r * 2, b.r * 0.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // Body
    ctx.beginPath();
    ctx.arc(x, y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    
    // Shadow (Fake lighting from Sun at 0,0)
    const ang = Math.atan2(y, x);
    ctx.beginPath();
    ctx.arc(x, y, b.r, ang + Math.PI/2, ang - Math.PI/2, false);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Name Label (if close)
    if (Math.abs(player.x - x) < 300 && Math.abs(player.y - y) < 300) {
        ctx.fillStyle = 'white';
        ctx.font = '12px "Audiowide"';
        ctx.textAlign = 'center';
        ctx.fillText(b.name, x, y - b.r - 10);
    }
}

function drawBelt(b) {
    // Procedural asteroid belt
    const count = b.type === 'belt' ? 200 : 400;
    const width = b.type === 'belt' ? 100 : 500;
    
    ctx.fillStyle = b.color;
    for(let i=0; i<count; i++) {
        // Static seed based on index
        const ang = (i / count) * Math.PI * 2 + (Date.now()*0.00005 * (i%2===0?1:-1));
        const rad = b.dist + (Math.sin(i*132) * width);
        const size = (i%5) + 2;
        
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        
        // Optimization: Culling
        if (Math.abs(px - cam.x) > canvas.width && Math.abs(py - cam.y) > canvas.height) continue;
        
        ctx.fillRect(px, py, size, size);
    }
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    const ship = SHIPS[player.shipId];
    
    // Draw Ship
    ctx.fillStyle = ship.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    
    if (ship.shape === 'rocket') {
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-10, 10);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-10, -10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (ship.shape === 'sat') {
        ctx.fillRect(-10, -5, 20, 10);
        ctx.fillStyle = '#3498db';
        ctx.fillRect(-5, -15, 2, 30); // Solar panels
        ctx.fillRect(-15, -15, 10, 30);
        ctx.fillRect(5, -15, 10, 30);
    } else {
        // Generic Lander/Rover/Station boxy shape
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        // Legs
        ctx.beginPath();
        ctx.moveTo(5, 5); ctx.lineTo(10, 10);
        ctx.moveTo(-5, 5); ctx.lineTo(-10, 10);
        ctx.stroke();
    }
    
    // Cockpit / Astronaut
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

/**
 * Loop
 */
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

window.addEventListener('beforeunload', () => sounds.bgm?.pause());

// Start
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
