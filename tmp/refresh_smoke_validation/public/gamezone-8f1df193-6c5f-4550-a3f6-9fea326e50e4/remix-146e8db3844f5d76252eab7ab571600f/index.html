<script>
/** 
 * §3 Editable Protocol Implementation 
 */
window.gameConfigDefs = {
    keeperSpeed: { type: "number", label: "Keeper Difficulty", value: 3, min: 1, max: 10 },
    questionTime: { type: "number", label: "Time per Question (s)", value: 15, min: 5, max: 60 },

};

window.gameConfig = {
    keeperSpeed: 3,
    questionTime: 15,
    primaryColor: "#2ecc71"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        if (key === 'primaryColor') initBackground();
    }
};

function initBackground() {
    const primary = window.gameConfig.primaryColor || '#2ecc71';
    document.documentElement.style.setProperty('--pitch-light', primary);
}

/**
 * §A Audio Manager
 */
class AudioManager {
    constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioCtx ? new AudioCtx() : null;
        this.buffers = {};
        this.unlocked = false;
        this.cooldowns = {};
        this.masterGain = null;

        if (this.ctx) {
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.6;
            this.masterGain.connect(this.ctx.destination);
        }
    }

    async loadSound(id, fallbackType, volume = 0.7) {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.tagName === 'AUDIO') el.volume = volume;
        if (!this.ctx) {
            this.buffers[id] = fallbackType;
            return;
        }

        const src = el.currentSrc || el.src || '';
        if (!src) {
            this.buffers[id] = fallbackType;
            return;
        }

        const srcUrl = new URL(src, window.location.href);
        if (srcUrl.origin !== window.location.origin) {
            this.buffers[id] = fallbackType;
            return;
        }

        try {
            const res = await fetch(srcUrl.href);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed: ${id}, using fallback`);
            this.buffers[id] = fallbackType;
        }
    }

    unlock() {
        if (this.unlocked) {
            this.playBgm();
            return;
        }

        if (!this.ctx) {
            this.unlocked = true;
            this.playBgm();
            return;
        }

        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playBgm();
        }).catch(() => {
            this.unlocked = true;
            this.playBgm();
        });
    }

    playBgm() {
        const el = document.getElementById('bgm_stadium');
        if (!el || !this.unlocked) return;
        el.volume = 0.2;
        if (el.paused) {
            el.play().catch(() => {});
        }
    }

    pauseBgm() {
        const el = document.getElementById('bgm_stadium');
        if (el && !el.paused) el.pause();
    }

    playSfx(id, cooldownMs = 0) {
        if (!this.unlocked) return;
        const now = performance.now();
        if (cooldownMs && this.cooldowns[id] && now - this.cooldowns[id] < cooldownMs) return;
        this.cooldowns[id] = now;

        const el = document.getElementById(id);
        const buffer = this.buffers[id];

        if (buffer && typeof buffer !== 'string' && this.ctx && this.masterGain) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = el?.volume ?? 0.7;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(this.masterGain);
            source.start(0);
            return;
        }

        if (typeof buffer === 'string' && this.ctx && this.masterGain) {
            this.synthesize(buffer);
            return;
        }

        if (el) {
            try {
                el.currentTime = 0;
                el.play().catch(() => {});
            } catch (_) {}
        }
    }

    synthesize(type) {
        if (!this.ctx || !this.masterGain) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (type === 'whistle') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(2000, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'kick') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
}

    // Audio Preload
    audio.loadSound('sfx_start', 'whistle', 0.5);
    audio.loadSound('sfx_ui', 'kick', 0.38);
    audio.loadSound('sfx_kick', 'kick', 0.5);
    audio.loadSound('sfx_goal', 'whistle', 0.55);
    audio.loadSound('sfx_miss', 'whistle', 0.5);
    audio.loadSound('sfx_gameover', 'whistle', 0.55);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseBgm();
        } else if (state !== 'GAMEOVER') {
            audio.playBgm();
        }
    });
    
    // Loop
    requestAnimationFrame(gameLoop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Recalc positions
    const w = window.innerWidth;
    const h = window.innerHeight;
    
    goal.w = Math.min(w * 0.6, 400);
    goal.h = goal.w * 0.6;
    goal.x = w / 2 - goal.w / 2;
    goal.y = h * 0.25;
    
    resetBall();
}

function resetBall() {
    ball.x = window.innerWidth / 2;
    ball.y = window.innerHeight * 0.85;
    ball.z = 0;
    ball.scale = 1;
    ball.state = 'IDLE';
}

function startGame() {
    const isRestart = state === 'GAMEOVER';
    audio.unlock();
    audio.playSfx(isRestart ? 'sfx_ui' : 'sfx_start', 120);
    score = 0;
    lives = 3;
    hideReactionGif('goal');
    hideReactionGif('miss');
    updateHUD();
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    startRound();
}

function startRound() {
    if (lives <= 0) {
        gameOver();
        return;
    }
    
    state = 'TRIVIA';
    resetBall();
    
    // Pick Question
    currentQuestion = TRIVIA_DB[Math.floor(Math.random() * TRIVIA_DB.length)];
    showTriviaUI();
}

function showTriviaUI() {
    const overlay = document.getElementById('trivia-overlay');
    const qText = document.getElementById('question-text');
    const grid = document.getElementById('answers-grid');
    const timerDisplay = document.getElementById('timer-display');
    const qNum = document.getElementById('q-num');
    
    qNum.textContent = score + 1;
    qText.textContent = currentQuestion.q;
    grid.innerHTML = '';
    
    currentQuestion.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn btn-push';
        btn.textContent = ans;
        btn.onclick = () => handleAnswer(idx);
        grid.appendChild(btn);
    });
    
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    
    // Timer
    let timeLeft = window.gameConfig.questionTime;
    timerDisplay.textContent = timeLeft;
    timerDisplay.style.borderColor = 'white';
    
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (timeLeft <= 5) timerDisplay.style.borderColor = '#e74c3c';
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleAnswer(-1); // Timeout
        }
    }, 1000);
}

function handleAnswer(idx) {
    clearInterval(timerInterval);
    document.getElementById('trivia-overlay').classList.add('hidden');
    
    const correct = idx === currentQuestion.c;
    if (!correct) {
        audio.playSfx('sfx_ui', 80);
    }
    kickBall(correct);
}

function kickBall(isGoal) {
    state = 'KICK';
    audio.playSfx('sfx_kick');
    
    // Target calculation
    const targetX = isGoal 
        ? goal.x + Math.random() * goal.w * 0.8 + goal.w * 0.1 
        : (Math.random() > 0.5 ? goal.x - 50 : goal.x + goal.w + 50); // Miss target
        
    const targetY = goal.y + Math.random() * goal.h * 0.8;
    
    // Animation params
    ball.startX = ball.x;
    ball.startY = ball.y;
    ball.targetX = targetX;
    ball.targetY = targetY;
    ball.t = 0;
    ball.isGoal = isGoal;
    
    // Keeper logic
    keeper.tx = isGoal ? (Math.random() > 0.5 ? goal.x : goal.x + goal.w) : targetX; // Dive wrong way or to ball
}

function updateHUD() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('lives-display').textContent = '❤️'.repeat(Math.max(0, lives));
}

function showReactionGif(type) {
    const activeId = type === 'goal' ? 'goal-gif' : 'miss-gif';
    const inactiveId = type === 'goal' ? 'miss-gif' : 'goal-gif';
    const activeEl = document.getElementById(activeId);
    const inactiveEl = document.getElementById(inactiveId);
    if (!activeEl || !inactiveEl) return;

    inactiveEl.classList.remove('active');
    clearTimeout(reactionTimers[type]);
    activeEl.classList.add('active');
    reactionTimers[type] = setTimeout(() => {
        activeEl.classList.remove('active');
    }, 1500);
}

function hideReactionGif(type) {
    const el = document.getElementById(type === 'goal' ? 'goal-gif' : 'miss-gif');
    if (!el) return;
    clearTimeout(reactionTimers[type]);
    el.classList.remove('active');
}

function showFeedback(text, color) {
    const el = document.getElementById('feedback-text');
    const overlay = document.getElementById('feedback-overlay');
    el.textContent = text;
    el.style.color = color;
    overlay.classList.remove('hidden');
    
    // Pop animation
    requestAnimationFrame(() => {
        el.style.transform = 'scale(1.5) rotate(-5deg)';
        setTimeout(() => {
            el.style.transform = 'scale(0)';
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }, 1000);
    });
}

function gameOver() {
    state = 'GAMEOVER';
    audio.pauseBgm();
    audio.playSfx('sfx_gameover', 200);
    hideReactionGif('goal');
    hideReactionGif('miss');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;
}

function spawnParticles(x, y, color) {
    for(let i=0; i<30; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

function roundedRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
}

function drawGoalScene(timestamp) {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const horizonY = goal.y + goal.h;

    const skyGradient = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGradient.addColorStop(0, '#08111f');
    skyGradient.addColorStop(0.52, '#16386d');
    skyGradient.addColorStop(1, '#2f6ea8');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, horizonY);

    const glow = ctx.createRadialGradient(width * 0.5, horizonY * 0.16, 10, width * 0.5, horizonY * 0.16, width * 0.5);
    glow.addColorStop(0, 'rgba(255,255,255,0.30)');
    glow.addColorStop(0.4, 'rgba(125,211,252,0.18)');
    glow.addColorStop(1, 'rgba(125,211,252,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, horizonY);

    ctx.fillStyle = 'rgba(5, 10, 18, 0.62)';
    ctx.fillRect(0, 0, width, horizonY);

    crowdDots.forEach((dot, i) => {
        const cx = (Math.sin(dot.seedA + timestamp * 0.002) * 0.5 + 0.5) * width;
        const cy = (Math.cos(dot.seedB + timestamp * 0.003) * 0.5 + 0.5) * horizonY;
        const radius = i % 8 === 0 ? 3.4 : 2.4;
        ctx.fillStyle = `hsla(${dot.hue}, 90%, ${56 + (i % 5) * 4}%, 0.85)`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
    });

    const pitchGradient = ctx.createLinearGradient(0, horizonY, 0, height);
    pitchGradient.addColorStop(0, '#15905f');
    pitchGradient.addColorStop(1, '#0b5137');
    ctx.fillStyle = pitchGradient;
    ctx.fillRect(0, horizonY, width, height - horizonY);

    const stripeWidth = width / 8;
    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(i * stripeWidth, horizonY, stripeWidth, height - horizonY);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(width, horizonY);
    ctx.stroke();

    ctx.beginPath();
    ctx.rect(width / 2 - goal.w, horizonY, goal.w * 2, Math.min(200, height * 0.26));
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(width / 2, height * 0.76, Math.min(width * 0.14, 100), Math.PI, 0);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 209, 102, 0.95)';
    ctx.lineWidth = 8;
    ctx.shadowColor = 'rgba(255, 209, 102, 0.35)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(goal.x, goal.y + goal.h);
    ctx.lineTo(goal.x, goal.y);
    ctx.lineTo(goal.x + goal.w, goal.y);
    ctx.lineTo(goal.x + goal.w, goal.y + goal.h);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(205, 240, 255, 0.24)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=10; i++) {
        const x = goal.x + (goal.w * i / 10);
        ctx.moveTo(x, goal.y);
        ctx.lineTo(x, goal.y + goal.h);
    }
    for(let i=0; i<=5; i++) {
        const y = goal.y + (goal.h * i / 5);
        ctx.moveTo(goal.x, y);
        ctx.lineTo(goal.x + goal.w, y);
    }
    ctx.stroke();
}

function drawKeeper(kX, kY, kW, kH) {
    const diveOffset = state === 'KICK' ? (keeper.x - window.innerWidth / 2) * 0.05 : 0;
    ctx.save();
    ctx.translate(kX, kY + kH * 0.12 + Math.sin(performance.now() / 180) * 1.5);
    ctx.rotate(diveOffset * 0.01);

    ctx.shadowColor = 'rgba(46, 197, 255, 0.35)';
    ctx.shadowBlur = 18;

    ctx.fillStyle = '#122c52';
    roundedRectPath(-kW * 0.23, -kH * 0.04, kW * 0.46, kH * 0.56, 12);
    ctx.fill();

    ctx.fillStyle = '#2ec5ff';
    roundedRectPath(-kW * 0.18, kH * 0.06, kW * 0.36, kH * 0.3, 10);
    ctx.fill();

    ctx.fillStyle = '#7ed6ff';
    roundedRectPath(-kW * 0.48, kH * 0.08, kW * 0.22, kH * 0.12, 8);
    ctx.fill();
    roundedRectPath(kW * 0.26, kH * 0.08, kW * 0.22, kH * 0.12, 8);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd6a5';
    ctx.beginPath();
    ctx.arc(0, -kH * 0.16, kW * 0.18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0b1730';
    ctx.beginPath();
    ctx.arc(-kW * 0.06, -kH * 0.18, 2.2, 0, Math.PI * 2);
    ctx.arc(kW * 0.06, -kH * 0.18, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#0b1730';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -kH * 0.13, kW * 0.06, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.strokeStyle = '#173b6d';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-kW * 0.08, kH * 0.5);
    ctx.lineTo(-kW * 0.22, kH * 0.82);
    ctx.moveTo(kW * 0.08, kH * 0.5);
    ctx.lineTo(kW * 0.22, kH * 0.82);
    ctx.moveTo(-kW * 0.22, kH * 0.08);
    ctx.lineTo(-kW * 0.46, kH * 0.24);
    ctx.moveTo(kW * 0.22, kH * 0.08);
    ctx.lineTo(kW * 0.46, kH * 0.24);
    ctx.stroke();

    ctx.fillStyle = '#d4ff54';
    ctx.beginPath();
    ctx.arc(0, kH * 0.18, kW * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBallSprite(x, y, radius) {
    const ballGlow = ctx.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.15, x, y, radius * 1.25);
    ballGlow.addColorStop(0, 'rgba(255,255,255,0.98)');
    ballGlow.addColorStop(0.55, '#ffffff');
    ballGlow.addColorStop(1, '#bcc7d9');
    ctx.fillStyle = ballGlow;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#12233e';
    ctx.lineWidth = Math.max(1.2, radius * 0.12);
    ctx.stroke();

    const spots = [
        [0, -0.38], [-0.42, -0.05], [0.42, -0.02], [-0.24, 0.35], [0.26, 0.34]
    ];
    ctx.fillStyle = '#12233e';
    spots.forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.arc(x + sx * radius, y + sy * radius, radius * 0.18, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.strokeStyle = 'rgba(18,35,62,0.6)';
    ctx.lineWidth = Math.max(1, radius * 0.06);
    ctx.beginPath();
    ctx.moveTo(x, y - radius * 0.22);
    ctx.lineTo(x - radius * 0.24, y + radius * 0.02);
    ctx.lineTo(x - radius * 0.16, y + radius * 0.28);
    ctx.moveTo(x, y - radius * 0.22);
    ctx.lineTo(x + radius * 0.24, y + radius * 0.02);
    ctx.lineTo(x + radius * 0.16, y + radius * 0.28);
    ctx.stroke();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    // Update
    if (state === 'KICK') {
        ball.t += dt * 1.5; // Speed of kick
        
        if (ball.t >= 1) {
            ball.t = 1;
            state = 'RESULT';
            
            if (ball.isGoal) {
                score++;
                audio.playSfx('sfx_goal', 120);
                showFeedback('GOAL!', '#f1c40f');
                showReactionGif('goal');
                hideReactionGif('miss');
                spawnParticles(ball.targetX, ball.targetY, '#f1c40f');
            } else {
                lives--;
                audio.playSfx('sfx_miss', 120);
                showFeedback('SAVE!', '#e74c3c');
                showReactionGif('miss');
                hideReactionGif('goal');
                document.getElementById('game-container').classList.add('shake');
                setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 500);
            }
            updateHUD();
            
            setTimeout(() => {
                startRound();
            }, 2000);
        }
        
        // Ball lerp
        const ease = t => t * (2 - t);
        const f = ease(ball.t);
        ball.x = ball.startX + (ball.targetX - ball.startX) * f;
        ball.y = ball.startY + (ball.targetY - ball.startY) * f;
        ball.scale = 1 - (0.7 * f); // Shrink as it goes away
        
        // Keeper Move
        const kSpeed = window.gameConfig.keeperSpeed * 50 * dt;
        if (ball.isGoal) {
             // Keeper dives randomly/helplessly
        } else {
            // Keeper moves to block
            const dx = ball.targetX - keeper.x;
            keeper.x += Math.sign(dx) * Math.min(Math.abs(dx), kSpeed * 2); 
        }
    } else if (state === 'TRIVIA' || state === 'MENU') {
        // Idle keeper animation
        keeper.x = (window.innerWidth / 2) + Math.sin(timestamp / 500) * 50;
    }

    // Render
    drawGoalScene(timestamp);

    // Draw Keeper
    const kW = 60;
    const kH = 90;
    const kX = state === 'KICK' ? keeper.x : (window.innerWidth/2);
    const kY = goal.y + goal.h - kH;
    drawKeeper(kX, kY, kW, kH);

    // Draw Ball
    const bR = 20 * ball.scale;
    drawBallSprite(ball.x, ball.y, bR);

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt;
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    requestAnimationFrame(gameLoop);
}

// Init
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
