<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checkout Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');

        :root {
            --bg: #090d18;
            --bg-glow: #101b31;
            --panel: rgba(10, 16, 30, 0.88);
            --panel-border: rgba(110, 224, 255, 0.68);
            --panel-shadow: rgba(0, 0, 0, 0.42);
            --text: #eef7ff;
            --muted: #89a7c1;
            --danger: #ff5f7f;
            --danger-dark: #8d2140;
            --success: #72ffd2;
            --accent: #6ee0ff;
            --accent-strong: #8d8bff;
            --warning: #ffd166;
            --belt: #111c2f;
            --belt-line: #1d314c;
            --belt-edge: #2e4f77;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Orbitron', system-ui, sans-serif;
        }

        body {
            color: white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
                var(--panel);
            backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 14px 30px var(--panel-shadow),
                inset 0 0 0 1px rgba(255,255,255,0.05),
                0 0 20px rgba(110, 224, 255, 0.12);
        }

        .hidden { display: none !important; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(110, 224, 255, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-glow), var(--bg));
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            padding-bottom: max(32px, env(safe-area-inset-bottom));
            pointer-events: none;
        }

        #ui-layer > * { pointer-events: auto; }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 12px;
        }

        .hud-card {
            padding: 10px 16px;
            border-radius: 24px;
            display: flex;
            min-width: 108px;
            position: relative;
            overflow: hidden;
        }

        .hud-card.stack {
            flex-direction: column;
            align-items: center;
        }

        .hud-card.row {
            align-items: center;
            gap: 8px;
        }

        .hud-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(110, 224, 255, 0.15);
        }

        .hud-value {
            color: var(--text);
            line-height: 1;
        }

        #score-display,
        #final-score {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.03em;
            text-shadow: 0 0 20px rgba(114, 255, 210, 0.24);
        }

        #score-display {
            font-size: clamp(2rem, 5vw, 3rem);
        }

        #lives-display {
            display: flex;
            gap: 4px;
        }

        .life-dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            transition: background-color 0.3s ease;
        }

        .life-dot.active {
            background: var(--danger);
            box-shadow: 0 0 8px rgba(255,95,127,0.8);
        }

        .life-dot.inactive {
            background: #374151;
        }

        #controls {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 24px;
            pointer-events: none;
        }

        #feedback-gifs {
            position: absolute;
            inset: 0;
            z-index: 55;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: clamp(96px, 24vw, 148px);
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 16px 28px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            object-fit: cover;
            background: rgba(10, 16, 30, 0.8);
        }

        .feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #gif-success {
            top: 112px;
        }

        #gif-fail {
            bottom: 152px;
        }

        .feedback-caption {
            position: absolute;
            right: 18px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(8, 13, 25, 0.82);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--text);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #caption-success {
            top: calc(112px + clamp(96px, 24vw, 148px) + 8px);
        }

        #caption-fail {
            bottom: 124px;
        }

        /* Scan Button Styling */
        #scan-btn {
            width: 112px;
            height: 112px;
            border-radius: 999px;
            border: 4px solid rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.26), transparent 28%),
                linear-gradient(180deg, #ff7d96 0%, var(--danger) 52%, #d93f66 100%);
            box-shadow:
                0 8px 0 var(--danger-dark),
                0 16px 26px rgba(0,0,0,0.45),
                0 0 28px rgba(255,95,127,0.35);
            transition: transform 0.05s, box-shadow 0.05s, filter 0.2s;
        }

        #scan-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--danger-dark), 0 0 10px rgba(0,0,0,0.3);
        }

        #scan-btn.disabled { filter: grayscale(1); pointer-events: none; }

        #scan-btn span {
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            letter-spacing: 0.12em;
            text-shadow: 0 0 10px rgba(255,255,255,0.45);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 20px;
        }

        .game-over-card {
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 24px 40px rgba(0,0,0,0.35);
            border-top: 8px solid var(--danger);
        }

        .game-over-title {
            margin: 0 0 8px;
            color: var(--text);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(3rem, 9vw, 4.25rem);
            line-height: 0.92;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .game-over-copy {
            margin: 0 0 16px;
            color: var(--text);
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            line-height: 1.7;
        }

        .game-over-subcopy {
            margin: 0 0 24px;
            color: var(--muted);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            line-height: 1.8;
        }

        #final-score {
            font-size: clamp(3.5rem, 10vw, 4.5rem);
            color: var(--success);
            margin-bottom: 28px;
            line-height: 1;
        }

        #restart-btn {
            width: 100%;
            background: linear-gradient(180deg, #15233c, #0b1323);
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            padding: 18px 16px;
            border-radius: 14px;
            box-shadow: 0 10px 18px rgba(0,0,0,0.28);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        #restart-btn:hover { background: #000; }
        #restart-btn:active { transform: scale(0.97); }

        .sr-intro {
            position: absolute;
            left: 50%;
            top: 84px;
            transform: translateX(-50%);
            width: min(92vw, 420px);
            z-index: 60;
            text-align: center;
            padding: 14px 18px;
        }

        .sr-intro-title {
            margin: 0 0 8px;
            color: var(--text);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .sr-intro-copy {
            margin: 0;
            color: var(--text);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            line-height: 1.7;
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding: 12px;
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }

            .hud-card {
                min-width: 0;
                padding: 10px 12px;
            }

            .hud-label {
                font-size: 9px;
                letter-spacing: 0.12em;
            }

            #score-display {
                font-size: clamp(1.6rem, 8vw, 2.4rem);
            }

            #scan-btn {
                width: 96px;
                height: 96px;
            }

            #scan-btn span {
                font-size: 18px;
            }

            .game-over-card {
                padding: 24px 20px;
            }

            #restart-btn {
                font-size: 12px;
                padding: 16px 12px;
            }

            .sr-intro {
                top: 78px;
            }

            .feedback-gif {
                width: 92px;
                right: 10px;
            }

            #gif-success {
                top: 128px;
            }

            #gif-fail {
                bottom: 136px;
            }

            .feedback-caption {
                right: 12px;
                font-size: 7px;
            }

            #caption-success {
                top: 230px;
            }

            #caption-fail {
                bottom: 110px;
            }
        }

        /* Animations */
        .hud-card::before,
        .sr-intro::before,
        .game-over-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(110, 224, 255, 0.14), transparent 45%, rgba(141, 139, 255, 0.14));
            pointer-events: none;
        }

        .scanner-emoji {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 22px;
            filter: drop-shadow(0 0 8px rgba(110, 224, 255, 0.35));
        }

        .lane-subtitle {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        @keyframes pulse-line {
            0% { opacity: 0.6; box-shadow: 0 0 10px var(--danger); }
            50% { opacity: 1; box-shadow: 0 0 20px var(--danger), 0 0 40px var(--danger); }
            100% { opacity: 0.6; box-shadow: 0 0 10px var(--danger); }
        }
    </style>
</head>

<script>
/**
 * AUDIO SYSTEM (Web Audio API)
 * Catalog-backed loop + semantic SFX with silent fallbacks.
 */
const AudioSys = {
    ctx: null,
    buffers: {},
    masterGain: null,
    bgmEl: null,
    initialized: false,
    bgmStarted: false,
    loadingKeys: new Set(),
    lastPlayedAt: {},

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        try {
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.55;
            this.masterGain.connect(this.ctx.destination);
            this.bgmEl = document.getElementById('bgm_main');
            if (this.bgmEl) {
                this.bgmEl.volume = 0.2;
                this.bgmEl.crossOrigin = 'anonymous';
            }

            // [agent-note][stage3] resolved-audio: pickup/bonus/blocked/game-over/restart + arcade loop -> catalogs/audios.json
            const mappings = {
                scan: 'sfx_scan',
                bonus: 'sfx_bonus',
                error: 'sfx_error',
                gameover: 'sfx_gameover',
                restart: 'sfx_restart'
            };

            Object.entries(mappings).forEach(([key, id]) => {
                const el = document.getElementById(id);
                if (el && el.src) this.preloadBuffer(key, el.src);
            });

            this.initialized = true;
        } catch (e) {
            console.warn('Audio init failed', e);
        }
    },

    preloadBuffer(key, src) {
        if (!this.ctx || this.loadingKeys.has(key)) return;
        this.loadingKeys.add(key);
        fetch(src)
            .then(res => res.arrayBuffer())
            .then(data => this.ctx.decodeAudioData(data))
            .then(buffer => {
                this.buffers[key] = buffer;
                this.loadingKeys.delete(key);
            })
            .catch(err => {
                this.loadingKeys.delete(key);
                console.warn('SFX Load Failed', key, err);
            });
    },

    unlock() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.startLoop();
    },

    startLoop() {
        if (!this.bgmEl || this.bgmStarted) return;
        this.bgmStarted = true;
        this.bgmEl.currentTime = 0;
        this.bgmEl.play().catch(() => {
            this.bgmStarted = false;
        });
    },

    stopLoop(reset = false) {
        if (!this.bgmEl) return;
        this.bgmEl.pause();
        if (reset) this.bgmEl.currentTime = 0;
        this.bgmStarted = false;
    },

    play(key, { volume = 1, debounceMs = 0 } = {}) {
        if (!this.ctx || !this.masterGain) return;
        const now = performance.now();
        if (debounceMs && this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < debounceMs) return;
        this.lastPlayedAt[key] = now;

        if (this.buffers[key]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            src.buffer = this.buffers[key];
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);
        } else {
            this.synthesize(key, volume);
        }
    },

    synthesize(type, volume = 1) {
        if (!this.ctx || !this.masterGain) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (type === 'scan' || type === 'bonus' || type === 'restart') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(type === 'bonus' ? 1040 : 880, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'bonus' ? 1880 : 1560, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.16 * volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(type === 'gameover' ? 120 : 150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.35);
            gain.gain.setValueAtTime(0.2 * volume, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        }
    }
};

const GifFx = {
    timers: {},
    trigger(type, duration = 900) {
        const img = document.getElementById(`gif-${type}`);
        const caption = document.getElementById(`caption-${type}`);
        if (!img || !caption) return;
        clearTimeout(this.timers[type]);
        img.classList.add('visible');
        caption.classList.add('visible');
        this.timers[type] = window.setTimeout(() => {
            img.classList.remove('visible');
            caption.classList.remove('visible');
        }, duration);
    },
    reset() {
        ['success', 'fail'].forEach(type => {
            clearTimeout(this.timers[type]);
            document.getElementById(`gif-${type}`)?.classList.remove('visible');
            document.getElementById(`caption-${type}`)?.classList.remove('visible');
        });
    }
};

/**
 * HAPTICS
 */
const Haptics = {
    trigger(style) {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style }
            });
        } else if (navigator.vibrate) {
            navigator.vibrate(style === 'heavy' ? 200 : (style === 'medium' ? 100 : 50));
        }
    }
};

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;

// Config
let config = {
    baseSpeed: 350,
    spawnRate: 1000,
    laserColor: '#ef4444'
};

// State
let gameState = 'INIT';
let lastTime = 0;
let score = 0;
let lives = 3;
let speedMultiplier = 1;
let spawnTimer = 0;
let shakeTime = 0;
let scanLineY = 0;
let scanFlash = 0;

// Entities
let products = [];
let particles = [];
let floaters = [];
let beltOffset = 0;

// Config Loader
function loadConfig() {
    try {
        const raw = JSON.parse(document.getElementById('game-config').textContent);
        config.baseSpeed = raw.baseSpeed.value;
        config.spawnRate = raw.spawnRate.value;
        config.laserColor = raw.laserColor.value;
    } catch(e) {}

    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = config;
    window.updateGameConfig = (k, v) => { if(config[k] !== undefined) config[k] = v; };
}

class Product {
    constructor() {
        this.w = Math.min(cw * 0.25, 100);
        this.h = this.w * (0.8 + Math.random() * 0.4);
        this.x = (cw - this.w) / 2 + (Math.random() - 0.5) * 20;
        this.y = -this.h - 50;

        const types = [
            { color: '#ff6b8a', label: 'CEREAL', price: 4.50, face: '😎' },
            { color: '#57b7ff', label: 'MILK', price: 2.99, face: '🧊' },
            { color: '#72ffd2', label: 'SODA', price: 1.50, face: '⚡' },
            { color: '#ffd166', label: 'CHIPS', price: 3.25, face: '🌟' },
            { color: '#9b8cff', label: 'SOAP', price: 5.99, face: '🫧' },
            { color: '#ff86d3', label: 'CANDY', price: 1.25, face: '🍬' }
        ];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.scanned = false;
        this.rotation = (Math.random() - 0.5) * 0.1;
    }

    update(dt) {
        this.y += config.baseSpeed * speedMultiplier * dt;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.rotate(this.rotation);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-this.w/2 + 4, -this.h/2 + 8, this.w, this.h);

        // Body
        ctx.fillStyle = this.scanned ? '#b8ffe1' : this.type.color;
        ctx.beginPath();
        ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 16);
        ctx.fill();

        ctx.strokeStyle = this.scanned ? '#0b8f68' : 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Mascot badge
        ctx.fillStyle = 'rgba(8, 15, 30, 0.2)';
        ctx.beginPath();
        ctx.arc(0, -this.h / 2 + 22, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type.face, 0, -this.h / 2 + 23);

        // Label
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.fillRect(-this.w/2 + 10, -4, this.w - 20, 18);

        ctx.fillStyle = '#0f172a';
        ctx.font = '700 10px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type.label, 0, 5);

        // Barcode
        ctx.fillStyle = '#08101d';
        const bars = 8;
        const barW = (this.w - 28) / bars;
        for(let i=0; i<bars; i++) {
            if (i % 2 === 0 || i === 3) {
                ctx.fillRect(-this.w/2 + 14 + i*barW, this.h/2 - 26, barW*0.58, 14);
            }
        }

        ctx.restore();
    }
}

class Floater {
    constructor(x, y, text, color = '#10b981') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
        this.vy = -150;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = '700 28px Audiowide';
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function initGame() {
    score = 0;
    lives = 3;
    speedMultiplier = 1;
    products = [];
    particles = [];
    floaters = [];
    spawnTimer = 0;
    scanFlash = 0;
    GifFx.reset();
    AudioSys.init();
    AudioSys.stopLoop(true);
    updateHUD();
}

function updateHUD() {
    document.getElementById('score-display').textContent = '$' + score.toFixed(2);
    const livesEl = document.getElementById('lives-display');
    livesEl.innerHTML = '';
    for(let i=0; i<3; i++) {
        const dot = document.createElement('div');
        dot.className = `life-dot ${i < lives ? 'active' : 'inactive'}`;
        livesEl.appendChild(dot);
    }
}

function setState(state) {
    gameState = state;
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls');
    const gameOver = document.getElementById('game-over-screen');

    if (state === 'PLAYING') {
        hud.classList.remove('hidden');
        controls.classList.remove('hidden');
        gameOver.classList.add('hidden');
        AudioSys.startLoop();
    } else if (state === 'GAMEOVER') {
        document.getElementById('final-score').textContent = '$' + score.toFixed(2);
        gameOver.classList.remove('hidden');
        controls.classList.add('hidden');
        GifFx.trigger('fail', 1800);
        AudioSys.play('gameover', { volume: 0.9, debounceMs: 400 });
        AudioSys.stopLoop();
    }
}

function handleScan() {
    AudioSys.unlock();
    if (gameState !== 'PLAYING') return;

    const zoneTop = scanLineY - 60;
    const zoneBottom = scanLineY + 60;

    let hit = false;

    for (let p of products) {
        const pCenter = p.y + p.h/2;
        if (pCenter > zoneTop && pCenter < zoneBottom && !p.scanned) {
            hit = true;
            p.scanned = true;
            score += p.type.price;
            speedMultiplier += 0.01;

            AudioSys.play('scan', { volume: 0.9, debounceMs: 70 });
            AudioSys.play('bonus', { volume: 0.45, debounceMs: 140 });
            Haptics.trigger('light');
            GifFx.trigger('success', 700);
            floaters.push(new Floater(cw/2, scanLineY - 50, '+$' + p.type.price));

            scanFlash = 0.2;

            for(let i=0; i<8; i++) {
                particles.push({
                    x: p.x + p.w/2,
                    y: p.y + p.h/2,
                    vx: (Math.random()-0.5)*400,
                    vy: (Math.random()-0.5)*400,
                    life: 0.5,
                    color: '#fff'
                });
            }
            break;
        }
    }

    if (!hit) {
        AudioSys.play('error', { volume: 0.8, debounceMs: 150 });
        Haptics.trigger('medium');
        GifFx.trigger('fail', 850);
        floaters.push(new Floater(cw/2, scanLineY, 'MISSED BEAT!', '#ef4444'));
    }

    updateHUD();
}

function handleGlobalInput() {
    AudioSys.unlock();
}

// Bind Scan Button
document.getElementById('scan-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleScan();
});
document.getElementById('restart-btn').addEventListener('click', () => {
    AudioSys.unlock();
    AudioSys.play('restart', { volume: 0.75, debounceMs: 150 });
    initGame();
    setState('PLAYING');
});
window.addEventListener('pointerdown', handleGlobalInput, { passive: false });

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scanLineY = ch * 0.70;
}

function loop(timestamp) {
    requestAnimationFrame(loop);
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (gameState !== 'PLAYING') return;

    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        shakeTime -= dt;
        sx = (Math.random() - 0.5) * 15;
        sy = (Math.random() - 0.5) * 15;
    }

    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = '#1f2937';
    ctx.fillRect(0, 0, cw, ch);

    beltOffset = (beltOffset + config.baseSpeed * speedMultiplier * dt) % 60;
    ctx.fillStyle = '#111827';
    for (let y = -60; y < ch + 60; y += 60) {
        ctx.fillRect(0, y + beltOffset, cw, 2);
    }

    ctx.fillStyle = '#374151';
    ctx.fillRect(0, 0, 20, ch);
    ctx.fillRect(cw-20, 0, 20, ch);

    const laserAlpha = 0.5 + Math.sin(timestamp * 0.01) * 0.2;
    ctx.shadowBlur = 20;
    ctx.shadowColor = config.laserColor;
    ctx.fillStyle = config.laserColor;
    ctx.globalAlpha = laserAlpha;
    ctx.fillRect(20, scanLineY - 2, cw - 40, 4);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (scanFlash > 0) {
        scanFlash -= dt;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(0, scanLineY - 50, cw, 100);
    }

    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0) {
        products.push(new Product());
        spawnTimer = config.spawnRate / Math.sqrt(speedMultiplier);
    }

    for (let i = products.length - 1; i >= 0; i--) {
        let p = products[i];
        p.update(dt);
        p.draw(ctx);

        if (p.y > ch) {
            if (!p.scanned) {
                lives--;
                updateHUD();
                shakeTime = 0.4;
                Haptics.trigger('heavy');
                AudioSys.play('error', { volume: 0.85, debounceMs: 120 });
                GifFx.trigger('fail', 950);
                floaters.push(new Floater(cw/2, ch - 100, 'MISSED ITEM!', '#ef4444'));

                if (lives <= 0) setState('GAMEOVER');
            }
            products.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;

        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    for (let i = floaters.length - 1; i >= 0; i--) {
        floaters[i].update(dt);
        floaters[i].draw(ctx);
        if (floaters[i].life <= 0) floaters.splice(i, 1);
    }

    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = config.laserColor;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(20, scanLineY - 10, cw - 40, 20);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.restore();
}

// Init
window.addEventListener('DOMContentLoaded', () => {
    loadConfig();
    const ro = new ResizeObserver(entries => {
        if (!entries[0]) return;
        resize();
        if (gameState === 'INIT') {
            initGame();
            setState('PLAYING');
            requestAnimationFrame(loop);
        }
    });
    ro.observe(canvas);
});
</script>
</body>
