<style>
  :root {
    --bg-color: #07111f;
    --ui-font: 'Exo 2', system-ui, sans-serif;
    --display-font: 'Orbitron', 'Trebuchet MS', sans-serif;
    --panel-bg: linear-gradient(180deg, rgba(11, 21, 37, 0.9), rgba(8, 14, 27, 0.76));
    --panel-border: rgba(103, 224, 255, 0.32);
    --panel-glow: rgba(51, 177, 219, 0.28);
    --text-soft: #9cb8d2;
    --text-bright: #e6f7ff;
    --accent: #67e0ff;
    --accent-strong: #7ef7ca;
    --danger: #ff6f91;
    --shadow-deep: rgba(0, 0, 0, 0.45);
  }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background:
      radial-gradient(circle at top, rgba(28, 73, 116, 0.28), transparent 42%),
      linear-gradient(180deg, #0b1322 0%, #050913 100%);
    overflow: hidden; touch-action: manipulation; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: var(--ui-font);
    color: var(--text-bright);
  }
  #game-container {
    position: relative; width: 100%; height: 100%;
    background:
      radial-gradient(circle at 50% 24%, rgba(83, 207, 255, 0.16) 0%, rgba(9, 18, 32, 0) 30%),
      radial-gradient(circle at center, #14243a 0%, #04070d 100%);

  }
  #game-container::before,
  #game-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

  #game-container::before {
    background:
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: 0.26;
    mix-blend-mode: screen;
  }
  #game-container::after {
    background:
      radial-gradient(circle at 20% 15%, rgba(126, 247, 202, 0.12), transparent 18%),
      radial-gradient(circle at 80% 20%, rgba(103, 224, 255, 0.12), transparent 16%),
      radial-gradient(circle at 50% 85%, rgba(255, 111, 145, 0.08), transparent 22%);
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column;
    justify-content: space-between; padding: 18px; box-sizing: border-box;
    z-index: 20;
  }
  .hud-panel {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px;
  }
  .stat-box {
    position: relative;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 14px;
    border-radius: 14px;
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    box-shadow:
      0 10px 30px var(--shadow-deep),
      inset 0 0 0 1px rgba(255,255,255,0.05),
      0 0 18px var(--panel-glow);
  }
  .stat-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12px;
    right: 12px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  }
  #dna-display,
  #pop-display,
  #max-pop-display {
    color: var(--accent-strong);
    font-family: var(--display-font);
    font-size: 17px;
    text-shadow: 0 0 12px rgba(126, 247, 202, 0.4);
  }
  #hint-display {
    align-self: center;
    max-width: min(92vw, 440px);
    text-align: center;
    font-size: 12px;
    color: #b1c9dc;
    margin-bottom: 10px;
    opacity: 0.92;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border: 1px solid rgba(103, 224, 255, 0.16);
    border-radius: 999px;
    background: rgba(6, 13, 25, 0.72);
    letter-spacing: 1.1px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
  }
  #feedback-overlay {
    position: absolute;
    right: 18px;
    bottom: 82px;
    width: min(28vw, 120px);
    min-width: 84px;
    aspect-ratio: 1;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(126, 247, 202, 0.22);
    background: rgba(4, 12, 24, 0.55);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.32), 0 0 18px rgba(103, 224, 255, 0.18);
    opacity: 0;
    transform: translateY(12px) scale(0.92);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    z-index: 24;
  }
  #feedback-overlay.visible {
    opacity: 0.92;
    transform: translateY(0) scale(1);
  }
  #feedback-overlay img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.1) contrast(1.04);
  }
  #feedback-caption {
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translate(-50%, 100%);
    white-space: nowrap;
    font-family: var(--display-font);
    font-size: 10px;
    letter-spacing: 1.6px;
    color: var(--accent-strong);
    text-shadow: 0 0 10px rgba(126, 247, 202, 0.45);
  }
  #game-over-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(2, 6, 12, 0.84); display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: auto; visibility: hidden; opacity: 0;
    transition: opacity 0.3s;
    z-index: 50;
    padding: 20px;
    box-sizing: border-box;
  }
  #game-over-screen.visible {
    visibility: visible; opacity: 1;
  }
  button {
    background: linear-gradient(180deg, #1f698d, #103f5f);
    color: var(--text-bright);
    border: 1px solid rgba(126, 247, 202, 0.4);
    padding: 14px 34px;
    font-size: 17px;
    font-family: var(--display-font);
    cursor: pointer; border-radius: 999px; margin-top: 20px;
    letter-spacing: 2px;
    transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
    box-shadow: 0 10px 28px rgba(9, 27, 46, 0.45), 0 0 18px rgba(103, 224, 255, 0.22);
  }
  button:active { transform: scale(0.96); filter: brightness(1.08); }
  .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @media (max-width: 640px) {
    #ui-layer { padding: 12px; }
    .stat-box {
      padding: 8px 10px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 12px;
    }
    #dna-display,
    #pop-display,
    #max-pop-display {
      font-size: 14px;
    }
    #hint-display {
      width: calc(100% - 8px);
      max-width: 360px;
      font-size: 10px;
      margin-bottom: 4px;
    }
    #feedback-overlay {
      right: 12px;
      bottom: 74px;
      width: min(30vw, 100px);
      min-width: 76px;
      border-radius: 14px;
    }
    #feedback-caption {
      font-size: 8px;
      letter-spacing: 1.2px;
    }
    button {
      width: min(82vw, 280px);
      padding: 14px 20px;
      font-size: 16px;
    }
  }
  @keyframes shake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }

<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer">
    <div class="hud-panel">
      <div class="stat-box">DNA STOCK: <span id="dna-display">0</span></div>
      <div class="stat-box">PODS: <span id="pop-display">0</span>/<span id="max-pop-display">12</span></div>
    </div>

  </div>
  <!-- [agent-note][stage3] resolved-gif: merge/fail reactions -> catalogs/gifs.json -->
  <div id="feedback-overlay" aria-hidden="true">
    <img id="feedback-gif" alt="Reaction feedback" src="https://i.giphy.com/I4OBmAtUfI5MBOiSV5.webp">
    <div id="feedback-caption">MERGE BOOST</div>
  </div>
  <div id="game-over-screen">
    <h1 style="color:#e6f7ff; margin-bottom:10px; font-weight:normal; letter-spacing:4px; font-family: var(--display-font); text-shadow: 0 0 18px rgba(103,224,255,0.28); text-align:center;">LAB PAUSED</h1>
    <button id="restart-btn">CONTINUE</button>

<script>
/** 
 * §2 SYSTEM INVARIANTS & UTILS 
 */
const CONFIG_DEFAULT = { spawnCost: 25, dnaMultiplier: 1.5, maxOrganisms: 12 };
let gameConfig = { ...CONFIG_DEFAULT };

// Parse Config
try {
  const el = document.getElementById('game-config');
  if (el) {
    const parsed = JSON.parse(el.textContent);
    Object.keys(parsed).forEach(k => gameConfig[k] = parsed[k].value);
  }
} catch(e) { console.error('Config parse error', e); }

// Audio Context & Manager (Zero DOM Overhead)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let masterGain;
let musicGain;
let sfxGain;
let sfxBuffers = {};
let isAudioUnlocked = false;
let lastSfxAt = {};

const FEEDBACK_GIFS = {
  merge: {
    src: 'https://i.giphy.com/I4OBmAtUfI5MBOiSV5.webp',
    label: 'MERGE BOOST'
  },
  blocked: {
    src: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
    label: 'DNA JAM'
  }
};

function ensureAudioGraph() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    musicGain = audioCtx.createGain();
    sfxGain = audioCtx.createGain();
    musicGain.gain.value = 0.2;
    sfxGain.gain.value = 0.22;
    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }
}

async function initAudio() {
  ensureAudioGraph();

  const loadBuffer = async (id, url) => {
    try {
      const res = await fetch(url);
      const arrayBuffer = await res.arrayBuffer();
      sfxBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
    } catch(e) { console.warn('SFX load failed', id); }
  };

  await Promise.all([
    loadBuffer('evolve', document.getElementById('sfx_evolve').src),
    loadBuffer('spawn', document.getElementById('sfx_spawn').src),
    loadBuffer('collect', document.getElementById('sfx_collect').src),
    loadBuffer('blocked', document.getElementById('sfx_blocked').src),
    loadBuffer('resume', document.getElementById('sfx_resume').src)
  ]);
}

function attachBgmNode() {
  const bgm = document.getElementById('bgm_main');
  if (!bgm || bgm._connectedToWebAudio || !audioCtx) return;
  try {
    const srcNode = audioCtx.createMediaElementSource(bgm);
    srcNode.connect(musicGain);
    bgm._connectedToWebAudio = true;
  } catch (e) {
    bgm.volume = 0.2;
  }
}

function syncBgmState() {
  const bgm = document.getElementById('bgm_main');
  if (!bgm) return;
  bgm.volume = 0.2;
  if (gameState === 'PLAYING' && isAudioUnlocked) {
    bgm.play().catch(()=>{});
  } else {
    bgm.pause();
  }
}

function unlockAudio() {
  if (isAudioUnlocked) return;
  ensureAudioGraph();
  attachBgmNode();
  if (!sfxBuffers.collect) initAudio();
  if (audioCtx?.state === 'suspended') audioCtx.resume();
  isAudioUnlocked = true;
  syncBgmState();
}

function playSfx(id, pitch = 1.0, minGap = 80) {
  if (!audioCtx || !sfxGain) return;
  const now = performance.now();
  if (lastSfxAt[id] && now - lastSfxAt[id] < minGap) return;
  lastSfxAt[id] = now;

  const buf = sfxBuffers[id];
  if (buf) {
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = buf;
    src.playbackRate.value = pitch;
    gain.gain.value = 0.95;
    src.connect(gain);
    gain.connect(sfxGain);
    src.start(0);
  } else {
    // Fallback Oscillator
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.type = id === 'blocked' ? 'square' : 'sine';
    osc.frequency.setValueAtTime((id === 'blocked' ? 220 : 400) * pitch, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(id === 'blocked' ? 120 : 100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }
}

function showFeedback(type, timeout = 900) {
  const overlay = document.getElementById('feedback-overlay');
  const gif = document.getElementById('feedback-gif');
  const caption = document.getElementById('feedback-caption');
  const feedback = FEEDBACK_GIFS[type];
  if (!overlay || !gif || !caption || !feedback) return;

  gif.src = feedback.src;
  caption.textContent = feedback.label;
  overlay.classList.add('visible');

  clearTimeout(showFeedback._timer);
  showFeedback._timer = setTimeout(() => {
    overlay.classList.remove('visible');
  }, timeout);
}

function vibrate(type) {
  const style = type === 'heavy' ? 'heavy' : type === 'medium' ? 'medium' : 'light';
  window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
    action: 'vibrate',
    requestId: 'h5-' + Date.now(),
    version: '1.0',
    params: { style }
  });
}

/**
 * §3 GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let gameState = 'PLAYING';
let lastTime = 0;
let initialized = false;

// Game State
let dna = 100;
let organisms = [];
let particles = [];
let floaters = [];
let dragTarget = null; // { index, offsetX, offsetY }

// Resize Observer
const ro = new ResizeObserver(entries => {
  const r = entries[0].contentRect;
  // Logical size matches CSS pixels
  cw = r.width;
  ch = r.height;
  // Canvas internal buffer matches device pixels
  canvas.width = cw * window.devicePixelRatio;
  canvas.height = ch * window.devicePixelRatio;
  // Canvas CSS size matches logical size
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  
  if (!initialized) {
    initGame();
    initialized = true;
    requestAnimationFrame(gameLoop);
  }
});

function initGame() {
  organisms = [];
  particles = [];
  floaters = [];
  dna = 100;
  
  // Ambient dust
  for(let i=0; i<30; i++) {
    floaters.push({
      x: Math.random() * cw,
      y: Math.random() * ch,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.2 + 0.05,
      alpha: Math.random() * 0.5
    });
  }
  
  // Initial spawn
  spawnOrganism(cw * 0.5, ch * 0.5, 1);
  updateUI();
}

// Tiers Definition
  const TIERS = [
  { r: 25, color: '#67e0ff', glow: '#32c7ff', core: '#d6fbff', ring: '#78f4d0', label: 'I' },
  { r: 32, color: '#74b4ff', glow: '#5a91ff', core: '#e4efff', ring: '#8fd6ff', label: 'II' },
  { r: 40, color: '#9f8cff', glow: '#8366ff', core: '#f1e8ff', ring: '#caa8ff', label: 'III' },
  { r: 50, color: '#ff82b2', glow: '#ff5f91', core: '#ffe0f1', ring: '#ffb9d4', label: 'IV' },
  { r: 65, color: '#ffe277', glow: '#ffbc42', core: '#fff6d2', ring: '#fff0ab', label: 'V' }
];

function spawnOrganism(x, y, tier) {
  if (organisms.length >= gameConfig.maxOrganisms) return false;
  
  organisms.push({
    x, y,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    tier: tier,
    scale: 0,
    pulse: Math.random() * Math.PI * 2,
    dnaBuffer: 0
  });
  
  spawnParticles(x, y, 8, TIERS[tier-1].color);
  return true;
}

function spawnParticles(x, y, count, color) {
  for(let i=0; i<count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      color: color
    });
  }
}

function updateUI() {
  document.getElementById('dna-display').innerText = Math.floor(dna);
  document.getElementById('pop-display').innerText = organisms.length;
  document.getElementById('max-pop-display').innerText = gameConfig.maxOrganisms;
  document.getElementById('hint-display').innerText = 
    `DRAG MATCHING PODS TO MERGE • SPAWN COST: ${Math.floor(gameConfig.spawnCost)}`;
}

function gameLoop(time) {
  try {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    
    update(dt, time);
    draw();
    
    requestAnimationFrame(gameLoop);
  } catch (e) {
    console.error('Loop Error', e);
    requestAnimationFrame(gameLoop);
  }
}

function update(dt, time) {
  if (gameState !== 'PLAYING') return;

  // Floaters
  floaters.forEach(f => {
    f.y -= f.speed;
    if (f.y < -10) f.y = ch + 10;
    f.alpha = 0.2 + Math.sin(time * 0.0005 + f.x) * 0.1;
  });

  // Organisms
  organisms.forEach((o, i) => {
    // Physics
    if (dragTarget && dragTarget.index === i) {
      // Dragging physics handled in input, just apply slight damping here
      o.vx *= 0.8;
      o.vy *= 0.8;
    } else {
      // Drift
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.vx *= 0.95;
      o.vy *= 0.95;
      
      // Wall bounce
      const r = TIERS[o.tier-1].r;
      if (o.x < r) { o.x = r; o.vx *= -0.5; }
      if (o.x > cw - r) { o.x = cw - r; o.vx *= -0.5; }
      if (o.y < r) { o.y = r; o.vy *= -0.5; }
      if (o.y > ch - r) { o.y = ch - r; o.vy *= -0.5; }
      
      // Gentle wander
      o.vx += (Math.random() - 0.5) * 10 * dt;
      o.vy += (Math.random() - 0.5) * 10 * dt;
      
      // Repel others
      for (let j = i + 1; j < organisms.length; j++) {
        const other = organisms[j];
        if (dragTarget && dragTarget.index === j) continue; // Don't repel dragged
        
        const dx = o.x - other.x;
        const dy = o.y - other.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minDesc = TIERS[o.tier-1].r + TIERS[other.tier-1].r;
        
        if (dist < minDesc && dist > 0) {
          const force = (minDesc - dist) * 2;
          const nx = dx / dist;
          const ny = dy / dist;
          o.vx += nx * force;
          o.vy += ny * force;
          other.vx -= nx * force;
          other.vy -= ny * force;
        }
      }
    }

    // Growth / Animation
    if (o.scale < 1) o.scale += (1 - o.scale) * 5 * dt;
    o.pulse += dt * 2;
    
    // Passive DNA Gen
    o.dnaBuffer += dt * gameConfig.dnaMultiplier * o.tier;
    if (o.dnaBuffer >= 1) {
      dna += 1;
      o.dnaBuffer -= 1;
      updateUI();
    }
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.5;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

  function draw() {
  // Clear
  ctx.fillStyle = '#040812';
  ctx.fillRect(0, 0, cw, ch);
  
  // Radial BG
  const grad = ctx.createRadialGradient(cw/2, ch * 0.42, 0, cw/2, ch/2, ch);
  grad.addColorStop(0, '#17304a');
  grad.addColorStop(0.55, '#0b1728');
  grad.addColorStop(1, '#03060c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, cw, ch);

  // Reactor field lines
  ctx.save();
  ctx.strokeStyle = 'rgba(103, 224, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let y = 30; y < ch; y += 42) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.quadraticCurveTo(cw * 0.5, y - 8, cw, y + 2);
    ctx.stroke();
  }
  ctx.restore();

  // Floaters
  floaters.forEach(f => {
    const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 8);
    glow.addColorStop(0, `rgba(255,255,255,${Math.max(0.12, f.alpha)})`);
    glow.addColorStop(1, 'rgba(103,224,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 8, 0, Math.PI * 2);
    ctx.fill();
  });

  // Organisms
  organisms.forEach((o, i) => {
    const tierData = TIERS[o.tier - 1];
    const r = tierData.r * o.scale;
    const pulse = Math.sin(o.pulse) * 0.05 + 1;
    const isDragged = dragTarget && dragTarget.index === i;
    
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale(pulse, pulse);

    // Outer glow
    ctx.shadowBlur = isDragged ? 30 : 24;
    ctx.shadowColor = tierData.glow;

    // Shell
    const shell = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.1, 0, 0, r);
    shell.addColorStop(0, tierData.core);
    shell.addColorStop(0.45, tierData.color);
    shell.addColorStop(1, tierData.glow);
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Halo ring
    ctx.shadowBlur = 0;
    ctx.strokeStyle = tierData.ring;
    ctx.lineWidth = Math.max(2, r * 0.08);
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.83, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Core nucleus
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(r * 0.18, -r * 0.14, r * 0.18, 0, Math.PI * 2);
    ctx.fill();

    // Orbiting lobes to make the character more expressive
    ctx.fillStyle = 'rgba(255,255,255,0.24)';
    for (let j = 0; j < Math.min(o.tier + 1, 5); j++) {
      const angle = o.pulse * 0.9 + j * (Math.PI * 2 / Math.min(o.tier + 1, 5));
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r * 0.42, Math.sin(angle) * r * 0.42, r * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    // Directional shine
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = Math.max(1.5, r * 0.06);
    ctx.beginPath();
    ctx.arc(-r * 0.15, -r * 0.12, r * 0.56, Math.PI * 1.08, Math.PI * 1.72);
    ctx.stroke();

    // Tier label
    ctx.fillStyle = 'rgba(4, 16, 30, 0.7)';
    ctx.font = `700 ${12 + o.tier * 2}px ${getComputedStyle(document.documentElement).getPropertyValue('--display-font').trim()}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tierData.label, 0, 1);

    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    const particleGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7);
    particleGlow.addColorStop(0, p.color);
    particleGlow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = particleGlow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/**
 * §3.3 INPUT SYSTEM
 */
function handleGlobalInput(e) {
  e.preventDefault();
  unlockAudio();
  
  if (gameState === 'GAMEOVER') return;
  
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  if (e.type === 'pointerdown') {
    // Check hit organism
    for (let i = organisms.length - 1; i >= 0; i--) {
      const o = organisms[i];
      const r = TIERS[o.tier-1].r;
      const dx = x - o.x;
      const dy = y - o.y;
      if (dx*dx + dy*dy < r*r * 1.5) {
        dragTarget = { index: i, offsetX: dx, offsetY: dy };
        playSfx('collect', 1.4, 60);
        vibrate('light');
        // Lift effect
        o.scale = 1.2;
        return;
      }
    }
    
    // If background tap -> Spawn
    if (dna >= gameConfig.spawnCost) {
      if (spawnOrganism(x, y, 1)) {
        dna -= gameConfig.spawnCost;
        playSfx('spawn', 1.08, 90);
        vibrate('medium');
        updateUI();
      } else {
        // Max pop feedback
        const cont = document.getElementById('game-container');
        cont.classList.remove('shake');
        void cont.offsetWidth;
        cont.classList.add('shake');
        playSfx('blocked', 1, 140);
        showFeedback('blocked', 920);
        vibrate('heavy');
      }
    } else {
      // No DNA feedback
      const cont = document.getElementById('game-container');
      cont.classList.remove('shake');
      void cont.offsetWidth;
      cont.classList.add('shake');
      playSfx('blocked', 0.94, 140);
      showFeedback('blocked', 920);
      vibrate('heavy');
    }
  }
  
  else if (e.type === 'pointermove') {
    if (dragTarget) {
      const o = organisms[dragTarget.index];
      if (o) {
        o.x = x - dragTarget.offsetX;
        o.y = y - dragTarget.offsetY;
        o.vx = 0; o.vy = 0;
      }
    }
  }
  
  else if (e.type === 'pointerup' || e.type === 'pointercancel') {
    if (dragTarget) {
      const idx = dragTarget.index;
      const o1 = organisms[idx];
      
      // Check for merge
      let merged = false;
      if (o1) {
        o1.scale = 1.0; // Reset scale
        
        for (let i = 0; i < organisms.length; i++) {
          if (i === idx) continue;
          const o2 = organisms[i];
          const r = TIERS[o1.tier-1].r;
          const dx = o1.x - o2.x;
          const dy = o1.y - o2.y;
          
          // Merge condition: Overlap AND same tier AND not max tier
          if (Math.sqrt(dx*dx + dy*dy) < r * 1.5 && o1.tier === o2.tier && o1.tier < 5) {
            // MERGE!
            const newTier = o1.tier + 1;
            const mx = (o1.x + o2.x) / 2;
            const my = (o1.y + o2.y) / 2;
            
            // Remove both (careful with indices, remove higher first)
            const first = Math.max(idx, i);
            const second = Math.min(idx, i);
            organisms.splice(first, 1);
            organisms.splice(second, 1);
            
            spawnOrganism(mx, my, newTier);
            // Override spawn props for evolution feel
            const newOrg = organisms[organisms.length-1];
            newOrg.scale = 0;
            
            playSfx('evolve', 1, 150);
            showFeedback('merge', 820);
            vibrate('heavy');
            spawnParticles(mx, my, 20, '#fff');
            
            merged = true;
            break;
          }
        }
      }
      
      if (!merged && o1) {
        // Just release, maybe small push
        playSfx('collect', 0.82, 70);
      }
      
      dragTarget = null;
      updateUI();
    }
  }
}

canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
window.addEventListener('pointermove', handleGlobalInput, { passive: false });
window.addEventListener('pointerup', handleGlobalInput, { passive: false });
window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
// [agent-note][stage4] repaired: mobile-action-risk | element: #restart-btn | action: keep menu taps on native click path and scope gesture prevention to canvas
document.getElementById('restart-btn').addEventListener('click', () => {
  unlockAudio();
  if (gameState !== 'GAMEOVER') return;
  gameState = 'PLAYING';
  document.getElementById('game-over-screen').classList.remove('visible');
  playSfx('resume', 1, 120);
  syncBgmState();
});

document.addEventListener('visibilitychange', () => {
  if (!isAudioUnlocked) return;
  const bgm = document.getElementById('bgm_main');
  if (!bgm) return;
  if (document.hidden) {
    bgm.pause();
  } else {
    syncBgmState();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  ro.observe(canvas);
});

</script>
