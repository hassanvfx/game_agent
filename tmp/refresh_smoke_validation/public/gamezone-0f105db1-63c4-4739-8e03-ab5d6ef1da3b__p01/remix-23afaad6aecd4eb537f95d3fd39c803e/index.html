<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');
  :root {

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #040806; color: var(--text); font-family: Rajdhani, system-ui, sans-serif; }
  #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 50% 15%, rgba(115,255,47,.24), transparent 28%), linear-gradient(180deg, #102118 0%, #08100e 56%, #030605 100%); }

  #game-container::before { top: 0; }

  #brand-sub { margin-top: 3px; font-family: Orbitron, sans-serif; font-size: clamp(8px, 2.3vw, 11px); color: var(--muted); letter-spacing: .7px; }
  #score-display { flex: 0 0 auto; border-radius: 999px 16px 999px 999px; padding: 9px 13px; min-height: 42px; font-family: Orbitron, sans-serif; font-size: clamp(14px, 4vw, 21px); font-weight: 700; letter-spacing: 1px; color: #f6ffd5; text-shadow: 0 0 12px rgba(115,255,47,.5); }
  #score-display::before { content: "◌ "; color: var(--portal); animation: blink 1.1s infinite; }
  #story-text { width: fit-content; max-width: min(92vw, 520px); margin-top: 10px; padding: 8px 11px; border-radius: 10px 18px 18px 10px; font-size: clamp(13px, 3.6vw, 18px); color: var(--muted); line-height: 1.15; transition: opacity .25s ease; }
  #feedback-strip { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: min(92vw, 470px); margin-top: 9px; padding: 7px 11px; border-radius: 16px; font-size: clamp(12px, 3.3vw, 15px); color: #f5ffd8; }
  #feedback-strip.danger { outline-color: rgba(255,63,122,.56); box-shadow: 5px 6px 0 rgba(0,0,0,.36), 0 0 22px rgba(255,63,122,.18); }
  #feedback-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--portal); box-shadow: 0 0 14px var(--portal); flex: 0 0 auto; }
  #feedback-strip.danger #feedback-dot { background: var(--danger); box-shadow: 0 0 14px var(--danger); }
  #game-over-screen { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 50% 36%, rgba(115,255,47,.18), transparent 28%), rgba(2,5,4,.80); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  #game-over-screen.active { opacity: 1; pointer-events: auto; }
  .game-over-card { width: min(100%, 390px); max-height: min(90vh, 480px); overflow-y: auto; border-radius: 26px 16px 26px 16px; padding: 24px 18px; text-align: center; transform: rotate(.7deg); }
  h1 { margin: 0 0 8px; font-family: Bangers, Orbitron, sans-serif; font-size: clamp(38px, 12vw, 66px); line-height: .86; letter-spacing: 1.2px; color: #ffec58; text-shadow: 3px 3px 0 #0d100d, 0 0 20px rgba(255,63,122,.35); }
  p.final-score { margin: 0 0 18px; color: var(--muted); font-size: clamp(17px, 4.7vw, 22px); }
  #restart-btn { pointer-events: auto; width: 100%; min-height: 54px; border: 2px solid #0b1117; border-radius: 16px 999px 999px 16px; background: linear-gradient(180deg, #dfff42, #73ff2f); color: #07110f; font-family: Orbitron, sans-serif; font-size: clamp(15px, 4vw, 20px); font-weight: 700; text-transform: uppercase; letter-spacing: .8px; box-shadow: 5px 6px 0 rgba(0,0,0,.55), 0 0 22px rgba(115,255,47,.22); cursor: pointer; }
  #restart-btn:active { transform: translate(3px,3px); box-shadow: 2px 3px 0 rgba(0,0,0,.55); }
  #gif-overlay { position: absolute; right: 12px; bottom: max(78px, env(safe-area-inset-bottom) + 68px); width: min(31vw, 118px); aspect-ratio: 1; z-index: 4; pointer-events: none; opacity: 0; transform: translateY(10px) scale(.92) rotate(2deg); transition: opacity .22s ease, transform .22s ease; }
  #gif-overlay.active { opacity: .92; transform: translateY(0) scale(1) rotate(-1deg); }
  #gif-overlay img { width: 100%; height: 100%; object-fit: cover; border: 2px solid #0b1117; border-radius: 18px; box-shadow: 5px 6px 0 rgba(0,0,0,.38), 0 0 18px rgba(115,255,47,.24); background: rgba(8,16,14,.5); }

  @keyframes blink { 0%,100% { opacity:.55; transform: scale(.9); } 50% { opacity:1; transform: scale(1.15); } }
  @media (max-width: 480px) { #hud { padding-left: 10px; padding-right: 10px; } #brand-card { max-width: 48vw; padding: 6px 9px; } #score-display { padding: 8px 10px; min-height: 38px; letter-spacing: .4px; } #story-text { font-size: 13px; } #feedback-strip { padding: 7px 9px; } #gif-overlay { width: min(28vw, 104px); right: 9px; } }

<body>
<div id="game-container">
  <canvas id="gameCanvas" aria-label="Rift Hunter K-77 playfield"></canvas>
  <div id="vignette"></div>
  <div id="ui-layer">
    <div id="hud">
      <div class="hud-top">
        <div id="brand-card"><div id="brand-title">Rift Hunter K-77</div><div id="brand-sub">cinematic portal bounty sweep</div></div>

      </div>
      <div id="story-text">Drag the hunter through the rift lane. Capture green signatures. Dodge parasites.</div>

</div>
<script>
const defaultConfig = { playerSpeed: 6, obstacleSpeed: 4, themeColor: '#73ff2f' };
window.gameConfig = { ...defaultConfig };
function parseConfig() {
  const el = document.getElementById('game-config');
  if (!el) return;
  try { const parsed = JSON.parse(el.textContent); for (const key in parsed) { if (parsed[key].type === 'number') window.gameConfig[key] = Number(parsed[key].value); else if (parsed[key].type === 'color') window.gameConfig[key] = String(parsed[key].value); } } catch (e) { console.error('Config parse error', e); }
}
let rngSeed = 77077;
function rand() { rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0; return rngSeed / 4294967296; }
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sfxNodes = {}; const sfxBuffers = {}; const lastSfxAt = {}; let audioUnlocked = false;
const gifMap = { collect: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp', fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp' };
function registerAudioElements() { [['collect','sfx_collect'],['warning','sfx_warning'],['fail','sfx_fail'],['ui','sfx_ui']].forEach(([id, dom]) => { const el = document.getElementById(dom); if (el && el.src) { sfxNodes[id] = el; el.volume = id === 'fail' ? .42 : id === 'warning' ? .3 : id === 'ui' ? .22 : .28; loadSfx(id, el.src); } }); const bgm = document.getElementById('bgm_main'); if (bgm) bgm.volume = .18; }
async function loadSfx(id, url) { if (!audioCtx) return; try { const res = await fetch(url); const buf = await res.arrayBuffer(); sfxBuffers[id] = await audioCtx.decodeAudioData(buf); } catch(e) { console.warn('SFX load failed:', id, e); } }
function playTone(frequency=440, duration=.14, volume=.035, type='sine') { if (!audioCtx) return; try { if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(frequency, audioCtx.currentTime); gain.gain.setValueAtTime(volume, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e) {} }
function playSfx(id, options={}) { const now = performance.now(); const minGap = options.minGap ?? 80; if (lastSfxAt[id] && now - lastSfxAt[id] < minGap) return; lastSfxAt[id] = now; const el = sfxNodes[id]; if (audioUnlocked && el) { try { el.currentTime = 0; el.play().catch(()=>{}); return; } catch(e) {} } if (audioCtx && sfxBuffers[id]) { try { if (audioCtx.state === 'suspended') audioCtx.resume(); const src = audioCtx.createBufferSource(); const gain = audioCtx.createGain(); src.buffer = sfxBuffers[id]; gain.gain.value = options.volume ?? .3; src.connect(gain); gain.connect(audioCtx.destination); src.start(0); return; } catch(e) {} } if (id === 'fail') playTone(155,.32,.055,'sawtooth'); else if (id === 'warning') playTone(300,.16,.035,'triangle'); else if (id === 'ui') playTone(620,.08,.025,'square'); else playTone(510,.12,.035,'sine'); }
function unlockAudio() { audioUnlocked = true; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); startBgm(); }
function startBgm() { const bgm = document.getElementById('bgm_main'); if (!bgm || gameState !== 'PLAYING') return; bgm.play().catch(()=>{}); }
function pauseBgm() { const bgm = document.getElementById('bgm_main'); if (bgm) bgm.pause(); }
function syncBgmForState() { if (!audioUnlocked) return; if (gameState === 'PLAYING') startBgm(); else pauseBgm(); }
function vibrate(style) { if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 200 : 50); }
let feedbackTimeout = null;
function setFeedback(text, tone='success') { const strip = document.getElementById('feedback-strip'); const textEl = document.getElementById('feedback-text'); if (!strip || !textEl) return; strip.className = tone; textEl.textContent = text; }
function showGif(kind, duration=1000) { const overlay = document.getElementById('gif-overlay'); const image = document.getElementById('gif-image'); const src = gifMap[kind]; if (!overlay || !image || !src) return; overlay.className = kind; image.src = src; overlay.classList.add('active'); clearTimeout(feedbackTimeout); feedbackTimeout = setTimeout(() => overlay.classList.remove('active'), duration); }
let gameState = 'INIT'; let canvas, ctx, cw = 0, ch = 0, dpr = 1, lastTime = 0, score = 0, distance = 0, warningCooldown = 0, startCuePlayed = false;
const player = { x:0, y:0, r:12, targetX:0 };
const obstacles = [], particles = [], stars = [], planets = [];
const texts = [
  { d: 0, t: 'Drag the hunter through the rift lane. Capture green signatures. Dodge parasites.' },
  { d: 500, t: 'K-77 log: first escaped signatures are drifting into scanner range.' },
  { d: 1500, t: 'Do not pet the pink parasites. They are legally classified as explosions.' },
  { d: 3000, t: 'Portal aperture widening. The bounty trail is getting theatrical.' },
  { d: 4500, t: 'More signatures detected beyond the acid-green nebula curtain.' },
  { d: 6000, t: 'Hunter suit integrity nominal. Ego integrity: questionable.' },
  { d: 8000, t: 'Dense parasite swarm incoming. Swerve like the multiverse owes you rent.' },
  { d: 10000, t: 'Deep-rift sweep active. Keep K-77 intact and keep collecting bounties.' }
];
let currentTextIdx = 0;
window.addEventListener('DOMContentLoaded', () => {
  parseConfig(); canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d', { alpha: false }); registerAudioElements(); setFeedback('PORTAL LOCKED • tap or drag to steer the alien hunter.', 'success');
  const ro = new ResizeObserver(entries => { const rect = entries[0].contentRect; cw = rect.width; ch = rect.height; dpr = window.devicePixelRatio || 1; canvas.width = cw * dpr; canvas.height = ch * dpr; canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; ctx.setTransform(dpr,0,0,dpr,0,0); if (gameState === 'INIT') { initGame(); setState('PLAYING'); requestAnimationFrame(gameLoop); } else { player.x = Math.max(player.r, Math.min(cw - player.r, player.x)); player.y = ch * .8; } });
  ro.observe(canvas);
  canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
  canvas.addEventListener('pointermove', handleGameInput, { passive: false });
  canvas.addEventListener('pointerup', handleGameInput, { passive: false });
  canvas.addEventListener('pointercancel', handleGameInput, { passive: false });
  document.getElementById('restart-btn')?.addEventListener('click', handleRestartClick);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseBgm(); else syncBgmForState(); });
});
function setState(newState) { gameState = newState; const go = document.getElementById('game-over-screen'); const hud = document.getElementById('hud'); if (newState === 'PLAYING') { go.classList.remove('active'); hud.style.opacity = '1'; setFeedback(startCuePlayed ? 'HUNT ACTIVE • collect bounties, dodge parasites.' : 'PORTAL LOCKED • tap or drag to steer the alien hunter.', 'success'); syncBgmForState(); } else if (newState === 'GAMEOVER') { go.classList.add('active'); hud.style.opacity = '0'; document.getElementById('final-score').innerText = `Bounties Secured: ${score}`; pauseBgm(); } }
function initGame() { rngSeed = 77077; score = 0; distance = 0; warningCooldown = 0; currentTextIdx = 0; lastTime = 0; updateStoryText(texts[0].t); player.x = cw / 2; player.y = ch * .8; player.targetX = cw / 2; player.r = 13; obstacles.length = 0; particles.length = 0; stars.length = 0; planets.length = 0; for (let i=0;i<72;i++) stars.push({ x: rand()*cw, y: rand()*ch, size: rand()*2+.45, speed: rand()*.55+.12, alpha: rand()*.75+.2, hue: rand() }); for (let i=0;i<7;i++) planets.push({ x: rand()*cw, y: rand()*ch*.75, r: 16+rand()*38, speed: .05+rand()*.16, color: rand()>.5 ? '#8cff41' : '#2ce0ff', ring: rand()>.45 }); }
function restartGame() { startCuePlayed = true; initGame(); setState('PLAYING'); }
function handleRestartClick(e) { e.preventDefault(); unlockAudio(); playSfx('ui', { minGap: 40 }); restartGame(); }
function handleGlobalInput(e) { unlockAudio(); if (!startCuePlayed && gameState === 'PLAYING') { startCuePlayed = true; playSfx('ui', { minGap: 40 }); setFeedback('HUNT ACTIVE • collect bounties, dodge parasites.', 'success'); } if (gameState === 'PLAYING') handleGameInput(e); }
function handleGameInput(e) { if (gameState !== 'PLAYING') return; e.preventDefault(); if (e.type === 'pointerdown' || e.type === 'pointermove') { const rect = canvas.getBoundingClientRect(); const tx = e.clientX - rect.left; player.targetX = Math.max(player.r, Math.min(cw - player.r, tx)); } }
function updateStoryText(text) { const el = document.getElementById('story-text'); if (!el) return; el.style.opacity = 0; setTimeout(() => { el.innerText = text; el.style.opacity = 1; }, 180); }
function spawnObstacle() { const r = 15 + rand() * 20; const x = rand() * (cw - 2*r) + r; const type = rand() > .8 ? 'COLLECT' : 'AVOID'; obstacles.push({ x, y: -r-20, r, type, speed: window.gameConfig.obstacleSpeed * (1 + distance / 10000), angle: rand()*Math.PI*2, spin: (rand()-.5)*.1, wobble: rand()*Math.PI*2 }); }
function createExplosion(x,y,color,count) { for (let i=0;i<count;i++) particles.push({ x, y, vx: (rand()-.5)*10, vy: (rand()-.5)*10, life: 1, color, size: rand()*3+1 }); }
function gameLoop(timestamp) { if (!lastTime) lastTime = timestamp; const dt = Math.min((timestamp - lastTime)/1000, .05); lastTime = timestamp; try { if (gameState === 'PLAYING') update(dt); draw(); } catch(e) { console.error('Loop error', e); } requestAnimationFrame(gameLoop); }
function update(dt) { const speed = window.gameConfig.playerSpeed * 60 * dt; player.x += (player.targetX - player.x) * 5 * dt; distance += speed * dt; warningCooldown = Math.max(0, warningCooldown - dt); document.getElementById('score-display').innerText = `BOUNTIES: ${score}`; if (currentTextIdx < texts.length - 1 && distance > texts[currentTextIdx + 1].d) { currentTextIdx++; updateStoryText(texts[currentTextIdx].t); } if (rand() < .02 + (distance / 50000)) spawnObstacle(); stars.forEach(s => { s.y += s.speed * (1 + distance/5000); if (s.y > ch) { s.y = 0; s.x = rand()*cw; } }); planets.forEach(p => { p.y += p.speed * (1 + distance/8000); if (p.y - p.r > ch) { p.y = -p.r; p.x = rand()*cw; } }); for (let i=obstacles.length-1;i>=0;i--) { const o = obstacles[i]; o.y += o.speed * 60 * dt; o.angle += o.spin; o.wobble += dt * 3; const dx = player.x - o.x, dy = player.y - o.y; const dist = Math.sqrt(dx*dx + dy*dy); if (o.type === 'AVOID' && warningCooldown === 0 && o.y > ch*.55 && Math.abs(dx) < o.r + 34) { warningCooldown = .6; playSfx('warning', { minGap: 350 }); setFeedback('PARASITE CLOSE • swerve out of the splash zone.', 'danger'); } if (dist < player.r + o.r) { if (o.type === 'COLLECT') { score += 10; playSfx('collect', { minGap: 55 }); vibrate('light'); setFeedback('BOUNTY CAPTURED • portal signature banked.', 'success'); showGif('collect', 900); createExplosion(o.x, o.y, '#b7ff45', 10); obstacles.splice(i,1); continue; } else { vibrate('heavy'); playSfx('fail', { minGap: 120 }); setFeedback('CONTAINMENT BREACH • parasite impact detected.', 'danger'); showGif('fail', 1600); createExplosion(player.x, player.y, '#ff3f7a', 22); setState('GAMEOVER'); } } if (o.y > ch + o.r) obstacles.splice(i,1); } for (let i=particles.length-1;i>=0;i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= dt*2; if (p.life <= 0) particles.splice(i,1); } }
function draw() { drawBackground(); if (gameState === 'PLAYING') drawHunter(player.x, player.y, player.r); obstacles.forEach(drawObstacle); particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1; }
function drawBackground() { const t = performance.now()*.001; const bg = ctx.createLinearGradient(0,0,0,ch); bg.addColorStop(0,'#17291b'); bg.addColorStop(.55,'#07120f'); bg.addColorStop(1,'#030605'); ctx.fillStyle = bg; ctx.fillRect(0,0,cw,ch); const cx = cw*.5 + Math.sin(t*.45)*cw*.04; const cy = ch*.24; const maxR = Math.max(cw,ch)*.55; for (let i=5;i>=0;i--) { ctx.strokeStyle = `rgba(${110+i*12},255,${45+i*20},${.055+i*.026})`; ctx.lineWidth = 10 + i*7; ctx.beginPath(); ctx.ellipse(cx, cy, maxR*(.18+i*.09), maxR*(.06+i*.032), t*.18+i*.42, 0, Math.PI*2); ctx.stroke(); }
  planets.forEach(p => { ctx.globalAlpha = .2; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); if (p.ring) { ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*1.45,p.r*.42,-.35,0,Math.PI*2); ctx.stroke(); } ctx.globalAlpha = 1; });
  ctx.strokeStyle = 'rgba(183,255,69,.09)'; ctx.lineWidth = 1; for (let lane=1; lane<=3; lane++) { const x = (cw/4)*lane + Math.sin(t+lane)*8; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,ch); ctx.stroke(); }
  stars.forEach(s => { ctx.globalAlpha = s.alpha; ctx.fillStyle = s.hue > .72 ? '#b7ff45' : s.hue > .45 ? '#00f2ff' : '#fffbd5'; ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.035)'; for (let k=0;k<16;k++) { const y = (k*53 + (t*28 % 53)); ctx.fillRect(0,y,cw,1); }
}
