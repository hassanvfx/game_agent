<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Particle Lab</title>
    <!-- [agent-note][stage4] font-remap: preserve sci-fi title/UI fonts using approved catalogs/fonts.json families -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            color-scheme: dark;
            --bg: #06111d;
            --bg-deep: #02070f;
            --panel-bg: rgba(8, 18, 33, 0.82);
            --panel-border: rgba(111, 219, 255, 0.24);
            --text: #f5fbff;
            --muted: #b4d3e8;
            --accent-a: #72f1ff;
            --accent-b: #4b8dff;
            --accent-c: #8f5bff;
            --sand: #ffd36f;
            --water: #5bc0ff;
            --stone: #7d92b0;
            --acid: #73ff92;
            --danger: #ff5d83;
            --button-a: #22d3ee;
            --button-b: #7c3aed;
            --shadow-strong: 0 18px 36px rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(90, 169, 255, 0.2), transparent 36%),
                radial-gradient(circle at bottom, rgba(109, 40, 217, 0.18), transparent 30%),
                linear-gradient(180deg, var(--bg), var(--bg-deep));
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            image-rendering: pixelated;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(114, 241, 255, 0.08), transparent 35%),
                linear-gradient(180deg, #071320 0%, #030814 100%);
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                linear-gradient(rgba(114, 241, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(114, 241, 255, 0.06) 1px, transparent 1px);
            background-size: 100% 26px, 26px 100%;
            opacity: 0.22;
            mix-blend-mode: screen;
        }

        .game-container::after {
            background: radial-gradient(circle at center, transparent 55%, rgba(2, 7, 15, 0.55) 100%);
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .glass-panel {
            position: relative;
            background: linear-gradient(180deg, rgba(12, 26, 47, 0.92), rgba(7, 16, 30, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-strong);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.48rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(114, 241, 255, 0.28);
            background: rgba(3, 11, 23, 0.72);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            color: var(--text);
            text-shadow: 0 0 12px rgba(114, 241, 255, 0.35);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.16);
            pointer-events: none;
        }

        .hud-label {
            opacity: 0.78;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            pointer-events: auto;
            background:
                radial-gradient(circle at 50% 18%, rgba(114, 241, 255, 0.12), transparent 24%),
                rgba(1, 7, 14, 0.64);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .start-card {
            width: min(100%, 25rem);
            padding: 1.85rem;
            text-align: center;
            border-radius: 1.7rem;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .start-card:hover {
            transform: translateY(-2px) scale(1.015);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.52);
        }

        .lab-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.85rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(114, 241, 255, 0.22);
            background: rgba(114, 241, 255, 0.08);
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #d7faff;
        }

        .game-title {
            margin: 0 0 0.5rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(2.35rem, 8vw, 3.8rem);
            line-height: 0.94;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: transparent;
            background: linear-gradient(135deg, #f8feff 8%, var(--accent-a) 38%, #8dd0ff 62%, #c2a6ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        }

        .subtitle {
            margin: 0 0 0.55rem;
            color: var(--muted);
            font-size: 1.12rem;
            font-weight: 600;
        }

        .instructions {
            margin: 0 0 1.35rem;
            color: #e1f1ff;
            font-size: 0.98rem;
            line-height: 1.4;
        }

        .start-btn {
            border: 0;
            border-radius: 999px;
            padding: 0.9rem 2rem;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: 0.08em;
            color: #f8fdff;
            cursor: pointer;
            background: linear-gradient(90deg, var(--button-a), var(--button-b));
            box-shadow: 0 14px 28px rgba(11, 17, 34, 0.42);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .start-btn:hover {
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.42);
            filter: brightness(1.06);
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .tools-dock {
            position: absolute;
            left: 50%;
            bottom: 1.15rem;
            transform: translateX(-50%);
            display: none;
            gap: 0.65rem;
            align-items: center;
            width: max-content;
            max-width: calc(100% - 1rem);
            padding: 0.65rem 0.85rem;
            overflow-x: auto;
            border-radius: 1.35rem;
            pointer-events: auto;
            scrollbar-width: none;
        }

        .tools-dock::-webkit-scrollbar {
            display: none;
        }

        .tools-dock.flex {
            display: flex;
        }

        .tool-btn {
            width: 3rem;
            height: 3rem;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
        }

        .tool-btn.active {
            border-color: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px) scale(1.07);
            box-shadow: 0 0 0 2px rgba(114, 241, 255, 0.22), 0 0 14px rgba(114, 241, 255, 0.4);
        }

        .tool-btn:active {
            transform: scale(0.96);
        }

        .tool-sand { background: linear-gradient(180deg, #ffe084, var(--sand)); }
        .tool-water { background: linear-gradient(180deg, #89d8ff, var(--water)); }
        .tool-stone { background: linear-gradient(180deg, #9db0c6, var(--stone)); }
        .tool-acid { background: linear-gradient(180deg, #9cffb0, var(--acid)); }
        .tool-eraser {
            background: linear-gradient(180deg, #ff7a9d, var(--danger));
            border-color: rgba(255, 255, 255, 0.32);
            font-weight: 700;
        }

        .tool-divider {
            width: 1px;
            height: 2.6rem;
            flex: 0 0 auto;
            margin: 0 0.15rem;
            background: linear-gradient(180deg, transparent, rgba(114, 241, 255, 0.36), transparent);
        }

        .clear-btn {
            min-width: 3rem;
            background: linear-gradient(180deg, #ffffff, #d9efff);
            color: #03111f;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-layer {
            position: absolute;
            right: 1rem;
            top: 1rem;
            width: min(7.5rem, 24vw);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-end;
            pointer-events: none;
            z-index: 20;
        }

        .feedback-gif {
            width: 100%;
            max-width: 7rem;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1.1rem;
            border: 1px solid rgba(114, 241, 255, 0.28);
            background: rgba(5, 14, 29, 0.72);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(-0.35rem) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .status-toast {
            max-width: min(16rem, 56vw);
            padding: 0.55rem 0.8rem;
            border-radius: 0.95rem;
            border: 1px solid rgba(114, 241, 255, 0.22);
            background: rgba(3, 11, 23, 0.78);
            color: #f4fbff;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: 0.03em;
            opacity: 0;
            transform: translateY(-0.2rem);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .status-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .start-card {
                padding: 1.45rem;
                width: min(100%, 22.5rem);
            }

            .lab-badge {
                margin-bottom: 0.7rem;
                font-size: 0.66rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .instructions {
                font-size: 0.92rem;
            }

            .hud {
                font-size: 0.72rem;
                top: 0.72rem;
                left: 0.72rem;
                padding: 0.42rem 0.68rem;
            }

            .tools-dock {
                bottom: 0.9rem;
                padding: 0.58rem 0.72rem;
                gap: 0.55rem;
            }

            .tool-btn {
                width: 2.75rem;
                height: 2.75rem;
                font-size: 1.05rem;
            }

            .tool-divider {
                height: 2.35rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="ui-layer">
            
            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <span class="hud-label">Matter:</span> <span id="score">0</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: reaction overlays use catalogs/gifs.json and stay off the playfield -->
            <div class="feedback-layer" aria-hidden="true">
                <img id="combo-gif" class="feedback-gif" alt="" src="https://i.giphy.com/1zmG8avB83Uvm.webp">
                <img id="clear-gif" class="feedback-gif" alt="" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp">
                <div id="status-toast" class="status-toast">Reactor idle.</div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="start-screen">
                <div class="glass-panel start-card">
                    <div class="lab-badge">🧪 Neon Sandbox</div>
                    <h1 class="game-title">Particle Lab</h1>
                    <p class="subtitle">Command a glowing reactor of drifting elements.</p>
                    <p class="instructions">Drag to seed the chamber, swap matter tools below, and hit CLEAR to restart the experiment.</p>
                    <button id="start-btn" class="start-btn">BEGIN TEST</button>
                </div>
            </div>

            <!-- Tools Dock -->
            <div id="tools-dock" class="glass-panel tools-dock hidden">
                <button class="tool-btn tool-sand" data-tool="1" title="Sand" aria-label="Sand">🟡</button>
                <button class="tool-btn tool-water" data-tool="2" title="Water" aria-label="Water">💧</button>
                <button class="tool-btn tool-stone" data-tool="3" title="Stone" aria-label="Stone">🪨</button>
                <button class="tool-btn tool-acid" data-tool="4" title="Acid" aria-label="Acid">🧪</button>
                <button class="tool-btn tool-eraser" data-tool="0" title="Eraser" aria-label="Eraser">✕</button>
                <div class="tool-divider"></div>
                <button id="clear-btn" class="tool-btn clear-btn" aria-label="Clear chamber">CLR</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                switch: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                place: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                dissolve: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                clear: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            gifs: {
                combo: "https://i.giphy.com/1zmG8avB83Uvm.webp",
                clear: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            }
        };

        /** 2. AUDIO + FEEDBACK SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = this.createAudio(ASSETS.bgm, { loop: true, volume: 0.2 });
                this.sfx = {
                    start: this.createAudio(ASSETS.sfx.start, { volume: 0.55 }),
                    switch: this.createAudio(ASSETS.sfx.switch, { volume: 0.5 }),
                    place: this.createAudio(ASSETS.sfx.place, { volume: 0.34 }),
                    dissolve: this.createAudio(ASSETS.sfx.dissolve, { volume: 0.42 }),
                    clear: this.createAudio(ASSETS.sfx.clear, { volume: 0.48 })
                };
                this.lastPlayedAt = new Map();
            }

            createAudio(src, options = {}) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.crossOrigin = 'anonymous';
                audio.loop = Boolean(options.loop);
                audio.volume = options.volume ?? 0.5;
                return audio;
            }

            enable() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, cooldown = 0) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const lastTime = this.lastPlayedAt.get(key) ?? 0;
                if (now - lastTime < cooldown) return;
                this.lastPlayedAt.set(key, now);

                const sample = this.sfx[key].cloneNode();
                sample.volume = this.sfx[key].volume;
                sample.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.comboGif = document.getElementById('combo-gif');
                this.clearGif = document.getElementById('clear-gif');
                this.statusToast = document.getElementById('status-toast');
                this.timeouts = new Map();
            }

            flash(target, duration = 1200) {
                const node = target === 'combo' ? this.comboGif : this.clearGif;
                if (!node) return;
                node.classList.add('visible');
                window.clearTimeout(this.timeouts.get(target));
                const timeout = window.setTimeout(() => node.classList.remove('visible'), duration);
                this.timeouts.set(target, timeout);
            }

            setStatus(message, duration = 1400) {
                if (!this.statusToast) return;
                this.statusToast.textContent = message;
                this.statusToast.classList.add('visible');
                window.clearTimeout(this.timeouts.get('status'));
                const timeout = window.setTimeout(() => this.statusToast.classList.remove('visible'), duration);
                this.timeouts.set('status', timeout);
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        /** 3. GAME STATE & CONSTANTS */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let cols, rows;
        const scale = 8;
        let grid = [];
        let particleCount = 0;
        let gameActive = false;
        let currentTool = 1;
        let isDrawing = false;
        let mouseX = 0, mouseY = 0;
        let lastParticleCount = 0;

        // Colors for materials: 0:Empty, 1:Sand, 2:Water, 3:Stone, 4:Acid
        const colors = [
            '#111827',
            '#fcd34d',
            '#60a5fa',
            '#9ca3af',
            '#a3e635'
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            cols = Math.ceil(width / scale);
            rows = Math.ceil(height / scale);
            
            if (grid.length === 0 || grid.length !== cols * rows) {
                initGrid();
            }
        }

        function initGrid() {
            grid = new Array(cols * rows).fill(0);
        }

        window.addEventListener('resize', resize);
        resize();

        /** 4. SIMULATION LOGIC */
        function getIndex(x, y) {
            if (x < 0 || x >= cols || y < 0 || y >= rows) return -1;
            return x + y * cols;
        }

        function update() {
            const randomLeft = Math.random() > 0.5;

            for (let y = rows - 2; y >= 0; y--) {
                for (let i = 0; i < cols; i++) {
                    let x = randomLeft ? i : (cols - 1 - i);
                    
                    const idx = x + y * cols;
                    const type = grid[idx];
                    
                    if (type === 0 || type === 3) continue;

                    const belowIdx = x + (y + 1) * cols;
                    const belowLeftIdx = (x - 1) + (y + 1) * cols;
                    const belowRightIdx = (x + 1) + (y + 1) * cols;
                    const leftIdx = (x - 1) + y * cols;
                    const rightIdx = (x + 1) + y * cols;

                    if (type === 4) {
                        const neighbors = [belowIdx, belowLeftIdx, belowRightIdx, leftIdx, rightIdx];
                        let dissolved = false;
                        for (let n of neighbors) {
                            if (n >= 0 && n < grid.length) {
                                const neighborType = grid[n];
                                if (neighborType !== 0 && neighborType !== 4 && neighborType !== 3) { 
                                    if (neighborType !== 3) {
                                        grid[n] = 0;
                                        grid[idx] = 0;
                                        dissolved = true;
                                        break;
                                    }
                                }
                            }
                        }
                        if (dissolved) continue;
                    }

                    if (grid[belowIdx] === 0) {
                        grid[belowIdx] = type;
                        grid[idx] = 0;
                    } 
                    else if (x > 0 && grid[belowLeftIdx] === 0) {
                        grid[belowLeftIdx] = type;
                        grid[idx] = 0;
                    } else if (x < cols - 1 && grid[belowRightIdx] === 0) {
                        grid[belowRightIdx] = type;
                        grid[idx] = 0;
                    }
                    else if (type === 2 || type === 4) {
                        const canLeft = x > 0 && grid[leftIdx] === 0;
                        const canRight = x < cols - 1 && grid[rightIdx] === 0;

                        if (canLeft && canRight) {
                            if (Math.random() > 0.5) {
                                grid[leftIdx] = type;
                                grid[idx] = 0;
                            } else {
                                grid[rightIdx] = type;
                                grid[idx] = 0;
                            }
                        } else if (canLeft) {
                            grid[leftIdx] = type;
                            grid[idx] = 0;
                        } else if (canRight) {
                            grid[rightIdx] = type;
                            grid[idx] = 0;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = colors[0];
            ctx.fillRect(0, 0, width, height);

            let count = 0;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const type = grid[x + y * cols];
                    if (type !== 0) {
                        count++;
                        ctx.fillStyle = colors[type];
                        if (type === 1) {
                             ctx.fillStyle = Math.random() > 0.9 ? '#fbbf24' : colors[type];
                        } else if (type === 3) {
                             ctx.fillStyle = Math.random() > 0.9 ? '#6b7280' : colors[type];
                        }
                        ctx.fillRect(x * scale, y * scale, scale, scale);
                    }
                }
            }
            lastParticleCount = particleCount;
            particleCount = count;
            document.getElementById('score').innerText = particleCount;
        }

        function spawnParticles(cx, cy, radius, type) {
            const gx = Math.floor(cx / scale);
            const gy = Math.floor(cy / scale);
            const r = Math.floor(radius / scale);
            let changedCells = 0;

            for (let y = -r; y <= r; y++) {
                for (let x = -r; x <= r; x++) {
                    if (x*x + y*y <= r*r) {
                        const idx = getIndex(gx + x, gy + y);
                        if (idx !== -1) {
                            if (type === 0) {
                                if (grid[idx] !== 0) {
                                    grid[idx] = 0;
                                    changedCells++;
                                }
                            }
                            else if (grid[idx] === 0) {
                                grid[idx] = type;
                                changedCells++;
                            }
                        }
                    }
                }
            }

            if (changedCells > 0) {
                audio.playSFX('place', 90);
            }
        }

        function gameLoop() {
            if (!gameActive) return;
            
            if (isDrawing) {
                spawnParticles(mouseX, mouseY, 20, currentTool);
            }

            update();
            draw();

            if (lastParticleCount - particleCount >= 8) {
                audio.playSFX('dissolve', 260);
                feedback.flash('combo', 1000);
                feedback.setStatus('Reaction spike detected!', 1100);
            }

            requestAnimationFrame(gameLoop);
        }

        /** 5. INPUT HANDLING */
        function handleInput(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            mouseX = clientX - rect.left;
            mouseY = clientY - rect.top;
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; handleInput(e); });
        canvas.addEventListener('mousemove', (e) => { handleInput(e); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            handleInput(e);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e);
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDrawing = false;
        }, {passive: false});

        /** 6. UI CONTROLS */
        const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentTool = parseInt(btn.getAttribute('data-tool'));
                audio.playSFX('switch', 90);
                feedback.setStatus(`Tool armed: ${btn.getAttribute('aria-label')}.`, 900);
            });
        });

        document.querySelector('.tool-btn[data-tool="1"]').classList.add('active');

        document.getElementById('clear-btn').addEventListener('click', () => {
            initGrid();
            draw();
            audio.playSFX('clear', 200);
            feedback.flash('clear', 1300);
            feedback.setStatus('Chamber purged. Ready for a new reaction.', 1500);
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.enable();
            audio.playSFX('start', 0);
            audio.playBGM();
            feedback.setStatus('Reactor online. Seed particles to begin.', 1800);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tools-dock').classList.remove('hidden');
            document.getElementById('tools-dock').classList.add('flex');
            gameActive = true;
            resize();
            draw();
            gameLoop();
        });
    });
    </script>
</body>
</html>
