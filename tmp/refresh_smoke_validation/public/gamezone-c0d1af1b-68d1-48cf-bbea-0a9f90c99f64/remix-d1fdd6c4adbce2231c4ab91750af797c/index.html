<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jelly Chef: Chill Zone</title>
<!-- [agent-note][stage4] repaired-font-remap: display=Russo One, ui=Rajdhani via catalogs/fonts.json -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
<style>

    /* BASE RESET */
    :root {
        --bg-top: #180f36;
        --bg-bottom: #4b2b7f;
        --panel: rgba(31, 18, 67, 0.72);
        --panel-border: rgba(179, 241, 255, 0.7);
        --panel-shadow: rgba(16, 8, 38, 0.4);
        --text-main: #f7f3ff;
        --text-soft: #d7cbff;
        --accent-cyan: #8bf6ff;
        --accent-pink: #ff8bd1;
        --accent-gold: #ffd978;
        --accent-purple: #ab7dff;
        --danger-soft: #ffb0c8;
    }

    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        font-family: 'Rajdhani', Arial, sans-serif;
        touch-action: none;
        user-select: none; -webkit-user-select: none;
        color: var(--text-main);
    }

    /* CHILL AESTHETIC */
    .bg-gradient {
        position: absolute; inset: 0;
        background:
            radial-gradient(circle at 50% 18%, rgba(255, 228, 157, 0.22) 0%, rgba(255, 228, 157, 0) 24%),
            radial-gradient(circle at 20% 22%, rgba(139, 246, 255, 0.28) 0%, rgba(139, 246, 255, 0) 30%),
            radial-gradient(circle at 80% 15%, rgba(255, 139, 209, 0.2) 0%, rgba(255, 139, 209, 0) 28%),
            linear-gradient(180deg, #20124a 0%, #543097 55%, #7f58bf 100%);
        z-index: 0;
    }

    .floating-bubbles {
        position: absolute; inset: 0; opacity: 0.38;
        background-image:
            radial-gradient(rgba(255,255,255,0.28) 18%, transparent 19%),
            radial-gradient(rgba(139,246,255,0.18) 18%, transparent 19%),
            radial-gradient(rgba(255,217,120,0.18) 18%, transparent 19%);
        background-size: 72px 72px, 96px 96px, 128px 128px;
        background-position: 0 0, 24px 18px, 12px 36px;
        animation: drift 22s linear infinite;
    }

    .floating-bubbles::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 30% 70%, rgba(255,255,255,0.16) 0 3px, transparent 4px),
            radial-gradient(circle at 68% 62%, rgba(255,255,255,0.14) 0 4px, transparent 5px),
            radial-gradient(circle at 84% 28%, rgba(255,255,255,0.12) 0 2px, transparent 3px);
        animation: driftReverse 28s linear infinite;
    }

    @keyframes drift { from { background-position: 0 0, 24px 18px, 12px 36px; } to { background-position: 72px 72px, 120px 114px, 140px 164px; } }
    @keyframes driftReverse { from { transform: translateY(0); } to { transform: translateY(-28px); } }

    /* UI LAYERS */
    #game-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
        pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        padding: 1rem; box-sizing: border-box;
    }

    /* THE SIGN (Required) */
    .welcome-sign-container {
        position: absolute;
        top: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 15;
        pointer-events: none;
        animation: swing 3s ease-in-out infinite alternate;
        transform-origin: top center;
    }
    .welcome-sign {
        background: linear-gradient(180deg, rgba(43, 25, 88, 0.92), rgba(29, 17, 61, 0.94));
        border: 3px solid rgba(255, 217, 120, 0.9);
        border-radius: 18px;
        padding: 9px 18px;
        box-shadow:
            0 12px 24px rgba(12, 7, 31, 0.35),
            0 0 18px rgba(139, 246, 255, 0.18);
        text-align: center;
        position: relative;
    }
    .welcome-sign::before, .welcome-sign::after {
        content: ''; position: absolute; top: -20px; width: 4px; height: 20px; background: rgba(255, 217, 120, 0.9);
    }
    .welcome-sign::before { left: 20px; }
    .welcome-sign::after { right: 20px; }

    .sign-text-small {
        color: var(--text-soft); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
    }
    .sign-text-main {
        color: #fff8dd;
        font-family: 'Russo One', Impact, sans-serif;
        font-size: 1.3rem;
        text-shadow: 0 0 10px rgba(139, 246, 255, 0.35);
        letter-spacing: 2px;
    }

    @keyframes swing { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

    /* HUD */
    .counter-pill {
        background: linear-gradient(180deg, rgba(41, 25, 87, 0.88), rgba(26, 16, 55, 0.88));
        backdrop-filter: blur(8px);
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--text-main);
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.03em;
        border: 2px solid rgba(139, 246, 255, 0.45);
        box-shadow: 0 8px 18px rgba(16, 8, 38, 0.2);
        display: flex; align-items: center; gap: 8px;
    }

    /* SCREENS */
    .screen {
        position: absolute; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, rgba(23, 13, 48, 0.82), rgba(44, 25, 88, 0.78));
        backdrop-filter: blur(12px);
        pointer-events: auto;
        transition: opacity 0.5s;
        padding: 1.5rem;
        box-sizing: border-box;
    }
    .hidden { opacity: 0; pointer-events: none; }

    .btn-chill {
        background: linear-gradient(135deg, var(--accent-pink) 0%, #c59eff 55%, var(--accent-cyan) 100%);
        border: 2px solid rgba(255,255,255,0.58);
        color: #fffdfb;
        font-family: 'Russo One', Impact, sans-serif;
        font-size: clamp(1.1rem, 4.8vw, 1.55rem);
        padding: 0.95rem 1.6rem;
        min-width: min(78vw, 320px);
        border-radius: 999px;
        box-shadow: 0 14px 26px rgba(38, 17, 76, 0.34);
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        text-shadow: 0 1px 2px rgba(0,0,0,0.18);
        letter-spacing: 0.08em;
    }
    .btn-chill:active { transform: scale(0.97); box-shadow: 0 7px 14px rgba(38, 17, 76, 0.32); filter: brightness(1.06); }

    /* TUTORIAL TEXT */
    .tutorial-text {
        font-size: 1.05rem;
        color: var(--text-main);
        max-width: min(82vw, 420px);
        text-align: center;
        margin-bottom: 1.5rem;
        line-height: 1.55;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 24px;
        padding: 1rem 1rem 0.85rem;
        box-shadow: 0 10px 24px var(--panel-shadow);
    }

    /* FEEDBACK */
    #feedback-msg {
        pointer-events: none;
        position: absolute; top: 40%; left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
    }
    .feedback-txt {
        font-family: 'Russo One', Impact, sans-serif;
        font-size: clamp(1.8rem, 8vw, 3rem);
        color: #fffef8;
        text-shadow: 0 0 18px rgba(139, 246, 255, 0.45);
        -webkit-text-stroke: 2px rgba(255, 139, 209, 0.85);
        letter-spacing: 2px;
    }

    .game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    .counter-wrap {
        position: absolute;
        top: 5rem;
        left: 1rem;
    }

    .reset-wrap {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        pointer-events: auto;
    }

    .reset-btn {
        background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(221, 233, 255, 0.72));
        padding: 0.55rem 0.78rem;
        border-radius: 999px;
        font-size: 1.1rem;
        box-shadow: 0 8px 18px rgba(15, 8, 37, 0.18);
        transition: background 0.2s ease, transform 0.2s ease;
        color: #2c2450;
        border: 2px solid rgba(139, 246, 255, 0.35);
        cursor: pointer;
        font-family: 'Rajdhani', Arial, sans-serif;
        font-weight: 700;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.92); }
    .reset-btn:active { transform: scale(0.94); }

    .start-title {
        font-family: 'Russo One', Impact, sans-serif;
        font-size: clamp(2.7rem, 10vw, 4.8rem);
        color: #fff8de;
        margin: 0 0 0.65rem;
        text-shadow:
            0 0 18px rgba(139, 246, 255, 0.35),
            0 8px 18px rgba(8, 4, 20, 0.3);
        line-height: 0.92;
        text-align: center;
        letter-spacing: 3px;
    }

    .tutorial-note {
        font-size: 0.95rem;
        margin-top: 1rem;
        font-style: italic;
        color: #ffd978;
    }

    .tutorial-text p {
        margin: 0.3rem 0;
    }

    /* [agent-note][stage3] resolved-gif: success/fail feedback overlays via catalogs/gifs.json */
    .gif-overlay-stack {
        position: absolute;
        left: 50%;
        bottom: 4.8rem;
        transform: translateX(-50%);
        z-index: 22;
        width: min(42vw, 150px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        pointer-events: none;
    }

    .gif-badge {
        min-width: 100px;
        padding: 0.28rem 0.75rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(18, 10, 43, 0.78);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 8px 18px rgba(15, 8, 37, 0.22);
        text-align: center;
    }

    .gif-card {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 20px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(16px) scale(0.92);
        transition: opacity 0.25s ease, transform 0.25s ease;
        background: rgba(12, 8, 27, 0.4);
        border: 2px solid rgba(255,255,255,0.16);
        box-shadow: 0 14px 30px rgba(15, 8, 37, 0.28);
    }

    .gif-card.active {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    .gif-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }

    @media (max-width: 520px) {
        #ui-layer { padding: 0.85rem; }
        .welcome-sign-container { top: 12px; }
        .welcome-sign { padding: 7px 14px; }
        .counter-wrap { top: 4.35rem; left: 0.85rem; }
        .counter-pill { font-size: 0.95rem; padding: 7px 12px; }
        .tutorial-text { font-size: 0.98rem; }
        .feedback-txt { -webkit-text-stroke: 1.5px rgba(255, 139, 209, 0.85); }
        .gif-overlay-stack { width: min(34vw, 118px); bottom: 4.45rem; }
        .gif-badge { font-size: 0.62rem; min-width: 84px; }
    }
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-gradient"></div>
<div class="floating-bubbles"></div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas" class="game-canvas"></canvas>

<!-- UI LAYER -->
<div id="ui-layer">

    <!-- THE SIGN -->
    <div class="welcome-sign-container">
        <div class="welcome-sign">
            <div class="sign-text-small">welcome to</div>
            <div class="sign-text-main">JELLY ARCADE</div>
        </div>
    </div>

    <!-- Counters -->
    <div class="counter-wrap">
        <div class="counter-pill">
            <span>🍮</span> <span id="jelly-count">0</span>
        </div>
    </div>

    <!-- Feedback -->
    <div id="feedback-msg">
        <div class="feedback-txt">NICE MIX!</div>
    </div>

    <div class="gif-overlay-stack" aria-hidden="true">
        <div id="gif-badge" class="gif-badge">Chill combo</div>
        <div id="gif-success" class="gif-card">
            <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction">
        </div>
        <div id="gif-fail" class="gif-card">
            <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Funny fail reaction">
        </div>
    </div>

    <!-- Bottom Controls (Reset) -->
    <div class="reset-wrap">
        <button id="reset-btn" class="reset-btn" aria-label="Reset game">
            ↺
        </button>
    </div>
</div>

<!-- START SCREEN -->
<div id="start-screen" class="screen">
    <h1 class="start-title">
        JELLY<br>ARCADE
    </h1>

    <div class="tutorial-text">
        <p>1. Drag fruit into the bowl.</p>
        <p>2. Stir inside the bowl to finish the batch.</p>
        <p>3. Tap or drag the bouncing jelly blobs.</p>
        <p class="tutorial-note">Relax and keep mixing. No timer, just score.</p>
    </div>

    <button id="start-btn" class="btn-chill">START MIXING</button>
</div>

<script>
/**
 * AUDIO SYSTEM
 * [agent-note][stage3] resolved-audio: ui/pickup/success/blocked + ambient loop from catalogs/audios.json
 */
const AudioSys = {
    ctx: null,
    unlocked: false,
    lastPlayAt: new Map(),
    sfx: {
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
        ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        stir: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
        wobble: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3',
        success: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        reset: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3'
    },
    loopUrl: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
    instances: {},
    loopEl: null,
    ensureCtx() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },
    unlock() {
        this.ensureCtx();
        if (this.unlocked) return;
        Object.entries(this.sfx).forEach(([key, url]) => {
            const audio = new Audio(url);
            audio.preload = 'auto';
            audio.volume = key === 'success' ? 0.42 : key === 'stir' ? 0.12 : 0.24;
            this.instances[key] = audio;
        });
        this.loopEl = new Audio(this.loopUrl);
        this.loopEl.preload = 'auto';
        this.loopEl.loop = true;
        this.loopEl.volume = 0.18;
        this.unlocked = true;
    },
    play(name, debounceMs = 120) {
        if (!this.unlocked) return;
        const now = performance.now();
        const last = this.lastPlayAt.get(name) || 0;
        if (now - last < debounceMs) return;
        this.lastPlayAt.set(name, now);
        const base = this.instances[name];
        if (!base) return;
        const audio = base.cloneNode();
        audio.volume = base.volume;
        audio.play().catch(() => {});
    },
    startLoop() {
        if (!this.unlocked || !this.loopEl) return;
        this.loopEl.currentTime = 0;
        this.loopEl.play().catch(() => {});
    },
    stopLoop() {
        if (!this.loopEl) return;
        this.loopEl.pause();
        this.loopEl.currentTime = 0;
    }
};

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const feedbackEl = document.getElementById('feedback-msg');
const feedbackTextEl = feedbackEl.querySelector('.feedback-txt');
const successGifEl = document.getElementById('gif-success');
const failGifEl = document.getElementById('gif-fail');
const gifBadgeEl = document.getElementById('gif-badge');

// Config
const INGREDIENTS_TO_FILL = 3;
const MIX_EFFORT_REQUIRED = 400;

// Colors
const COLORS = {
    bowl: '#ffffff',
    bowlRim: '#e0e0e0',
    liquid: '#ffcdd2',
    jellyPalette: [
        { color: '#ef5350', name: 'Strawberry' },
        { color: '#ab47bc', name: 'Grape' },
        { color: '#42a5f5', name: 'Blueberry' },
        { color: '#66bb6a', name: 'Lime' },
        { color: '#ffa726', name: 'Orange' }
    ]
};

// State
let state = {
    running: false,
    jelliesMade: 0,
    ingredients: [],
    jellies: [],
    particles: [],
    bowl: {
        x: 0, y: 0, r: 90,
        contents: [],
        status: 'filling',
        mixProgress: 0,
        wobble: 0,
        liquidColor: '#ffcdd2'
    },
    dragTarget: null,
    dragOffset: {x:0, y:0},
    lastTouchPos: null,
    spawnTimer: 0,
    lastStirSfxAt: 0
};

// Classes
class Jelly {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 35;

        // Physics
        this.vx = (Math.random() - 0.5) * 100;
        this.vy = (Math.random() - 0.5) * 100;

        // Spring physics for wobble
        this.scaleX = 0.1;
        this.scaleY = 0.1;
        this.targetScale = 1.0;
        this.velScaleX = 0;
        this.velScaleY = 0;

        // Interaction
        this.isDragged = false;
    }

    update(dt) {
        const k = 150;
        const d = 10;

        const ax = (this.targetScale - this.scaleX) * k - this.velScaleX * d;
        this.velScaleX += ax * dt;
        this.scaleX += this.velScaleX * dt;

        const ay = (this.targetScale - this.scaleY) * k - this.velScaleY * d;
        this.velScaleY += ay * dt;
        this.scaleY += this.velScaleY * dt;

        if (!this.isDragged) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;

            const margin = this.radius;
            if (this.x < margin) { this.x = margin; this.vx *= -1; this.squish('x'); }
            if (this.x > canvas.width - margin) { this.x = canvas.width - margin; this.vx *= -1; this.squish('x'); }
            if (this.y < margin + 100) { this.y = margin + 100; this.vy *= -1; this.squish('y'); }
            if (this.y > canvas.height - margin) { this.y = canvas.height - margin; this.vy *= -1; this.squish('y'); }

            this.vx *= 0.99;
            this.vy *= 0.99;
        }
    }

    squish(axis) {
        if (axis === 'x') {
            this.velScaleX -= 5;
            this.velScaleY += 5;
        } else {
            this.velScaleY -= 5;
            this.velScaleX += 5;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX, this.scaleY);

        ctx.fillStyle = this.color + 'DD';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(-10, -10, 8, 5, -Math.PI/4, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-10, 2, 3, 0, Math.PI*2);
        ctx.arc(10, 2, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 8, 4, 0, Math.PI, false);
        ctx.stroke();

        ctx.restore();
    }
}

// Utils
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.bowl.x = canvas.width / 2;
    state.bowl.y = canvas.height * 0.35;
    state.bowl.r = Math.min(canvas.width, canvas.height) * 0.22;
}
window.addEventListener('resize', resize);

function spawnIngredient() {
    const type = COLORS.jellyPalette[Math.floor(Math.random() * COLORS.jellyPalette.length)];
    const size = 40;

    state.ingredients.push({
        ...type,
        x: Math.random() * (canvas.width - size),
        y: -50,
        w: size, h: size,
        vx: (Math.random() - 0.5) * 50,
        vy: 50 + Math.random() * 50,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 2
    });
}

function setGifMood(type, label, duration = 1400) {
    successGifEl.classList.toggle('active', type === 'success');
    failGifEl.classList.toggle('active', type === 'fail');
    gifBadgeEl.textContent = label;
    if (duration > 0) {
        clearTimeout(setGifMood.timer);
        setGifMood.timer = setTimeout(() => {
            successGifEl.classList.remove('active');
            failGifEl.classList.remove('active');
            gifBadgeEl.textContent = 'Chill combo';
        }, duration);
    }
}
setGifMood.timer = null;

function showFeedback(text, mode = 'success') {
    feedbackTextEl.innerText = text;
    feedbackEl.style.opacity = '1';
    feedbackEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
    setGifMood(mode, mode === 'fail' ? 'Oops splash' : 'Mix hype');
    setTimeout(() => {
        feedbackEl.style.opacity = '0';
        feedbackEl.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 1000);
}

// Logic Loop
function update(dt) {
    if (!state.running) return;

    if (state.bowl.status === 'filling') {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
            spawnIngredient();
            state.spawnTimer = 2.0;
        }
    }

    for (let i = state.ingredients.length - 1; i >= 0; i--) {
        const e = state.ingredients[i];
        if (e !== state.dragTarget) {
            e.x += e.vx * dt;
            e.y += e.vy * dt;
            e.rot += e.rotSpeed * dt;

            if (e.x < 0 || e.x + e.w > canvas.width) e.vx *= -1;

            if (e.y > canvas.height + 50) {
                state.ingredients.splice(i, 1);
            }
        }
    }

    state.jellies.forEach(j => j.update(dt));

    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
}

// Rendering
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const b = state.bowl;
    ctx.save();
    ctx.translate(b.x, b.y);

    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(0, b.r + 20, b.r * 0.8, 20, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    if (b.contents.length > 0 || b.status === 'mixing') {
        const fillRatio = b.status === 'mixing' ? 0.9 : (b.contents.length / INGREDIENTS_TO_FILL) * 0.8;
        const liquidR = b.r * 0.9;

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, liquidR, 0, Math.PI*2);
        ctx.clip();

        const level = liquidR - (liquidR * 2 * fillRatio) + 20;

        if (b.status === 'mixing') {
            const time = Date.now() / 200;
            ctx.fillStyle = b.liquidColor;
            ctx.fillRect(-liquidR, -liquidR, liquidR*2, liquidR*2);

            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 10;
            ctx.beginPath();
            const swirlR = (b.mixProgress / MIX_EFFORT_REQUIRED) * liquidR;
            ctx.arc(Math.sin(time)*10, Math.cos(time)*10, swirlR, 0, Math.PI*2);
            ctx.stroke();

            ctx.fillStyle = '#fff8de';
            ctx.font = '700 24px "Rajdhani", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("STIR NOW!", 0, 0);
        } else {
            ctx.fillStyle = b.liquidColor;
            ctx.fillRect(-liquidR, level, liquidR*2, liquidR*2);

            b.contents.forEach((c, i) => {
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(Math.cos(i)*20, level + 20 + Math.sin(i)*10, 10, 0, Math.PI*2);
                ctx.fill();
            });
        }
        ctx.restore();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.ellipse(-b.r*0.3, -b.r*0.3, b.r*0.2, b.r*0.1, -0.5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    state.ingredients.forEach(e => {
        ctx.save();
        ctx.translate(e.x + e.w/2, e.y + e.h/2);
        ctx.rotate(e.rot);
        if (e === state.dragTarget) ctx.scale(1.2, 1.2);

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(0, 0, e.w/2, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(-5, -5, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#66bb6a';
        ctx.fillRect(-2, -e.w/2 - 4, 4, 6);

        ctx.restore();
    });

    state.jellies.forEach(j => j.draw(ctx));

    state.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    requestAnimationFrame(loop);
}

function loop(timestamp) {
    const dt = 0.016;
    update(dt);
    draw();
}

/**
 * INPUT
 */
function getTouchPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches[0];
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function handleStart(e) {
    if (!state.running) return;
    e.preventDefault();
    const pos = getTouchPos(e);

    for (let i = state.jellies.length - 1; i >= 0; i--) {
        const j = state.jellies[i];
        const dx = pos.x - j.x;
        const dy = pos.y - j.y;
        if (dx*dx + dy*dy < j.radius*j.radius) {
            j.velScaleX -= 20;
            j.velScaleY += 20;
            j.vy -= 200;
            AudioSys.play('wobble', 180);

            state.dragTarget = j;
            j.isDragged = true;
            state.dragOffset = { x: pos.x - j.x, y: pos.y - j.y };
            return;
        }
    }

    if (state.bowl.status === 'mixing') {
        const dx = pos.x - state.bowl.x;
        const dy = pos.y - state.bowl.y;
        if (Math.sqrt(dx*dx + dy*dy) < state.bowl.r) {
            state.lastTouchPos = pos;
            return;
        }
        AudioSys.play('blocked', 300);
        setGifMood('fail', 'Missed bowl', 900);
        return;
    }

    if (state.bowl.status === 'filling') {
        for (let i = state.ingredients.length - 1; i >= 0; i--) {
            const ent = state.ingredients[i];
            if (pos.x > ent.x - 10 && pos.x < ent.x + ent.w + 10 &&
                pos.y > ent.y - 10 && pos.y < ent.y + ent.h + 10) {
                state.dragTarget = ent;
                state.dragOffset.x = pos.x - ent.x;
                state.dragOffset.y = pos.y - ent.y;
                AudioSys.play('ui', 120);
                return;
            }
        }
    }
}

function handleMove(e) {
    if (!state.running) return;
    e.preventDefault();
    const pos = getTouchPos(e);

    if (state.bowl.status === 'mixing' && state.lastTouchPos) {
        const dx = pos.x - state.lastTouchPos.x;
        const dy = pos.y - state.lastTouchPos.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist > 3) {
            state.bowl.mixProgress += dist;

            if (Math.random() < 0.1) {
                state.particles.push({
                    x: state.bowl.x + (Math.random()-0.5)*50,
                    y: state.bowl.y + (Math.random()-0.5)*50,
                    vx: (Math.random()-0.5)*100, vy: -100,
                    life: 0.5, size: 5, color: '#fff'
                });
            }

            const now = performance.now();
            if (now - state.lastStirSfxAt > 220) {
                AudioSys.play('stir', 200);
                state.lastStirSfxAt = now;
            }

            state.lastTouchPos = pos;

            if (state.bowl.mixProgress >= MIX_EFFORT_REQUIRED) {
                finishJelly();
            }
        }
        return;
    }

    if (state.dragTarget) {
        if (state.dragTarget instanceof Jelly) {
            state.dragTarget.x = pos.x - state.dragOffset.x;
            state.dragTarget.y = pos.y - state.dragOffset.y;
            state.dragTarget.vx = 0; state.dragTarget.vy = 0;
        } else {
            state.dragTarget.x = pos.x - state.dragOffset.x;
            state.dragTarget.y = pos.y - state.dragOffset.y;
        }
    }
}

function handleEnd(e) {
    if (!state.running) return;
    e.preventDefault();

    state.lastTouchPos = null;

    if (state.dragTarget) {
        if (!(state.dragTarget instanceof Jelly)) {
            const ent = state.dragTarget;
            const cx = ent.x + ent.w/2;
            const cy = ent.y + ent.h/2;
            const dx = cx - state.bowl.x;
            const dy = cy - state.bowl.y;

            if (Math.sqrt(dx*dx + dy*dy) < state.bowl.r) {
                addToBowl(ent);
            } else {
                AudioSys.play('blocked', 260);
                setGifMood('fail', 'Drop in bowl', 900);
            }
        } else {
            state.dragTarget.isDragged = false;
        }
        state.dragTarget = null;
    }
}

function addToBowl(ent) {
    if (state.bowl.status !== 'filling') return;

    state.bowl.contents.push({ color: ent.color });
    state.bowl.liquidColor = ent.color;

    const idx = state.ingredients.indexOf(ent);
    if (idx > -1) state.ingredients.splice(idx, 1);

    AudioSys.play('pickup', 120);

    for(let i=0; i<5; i++) {
        state.particles.push({
            x: state.bowl.x, y: state.bowl.y,
            vx: (Math.random()-0.5)*200, vy: -200 - Math.random()*100,
            life: 0.8, size: 6, color: ent.color
        });
    }

    if (state.bowl.contents.length >= INGREDIENTS_TO_FILL) {
        state.bowl.status = 'mixing';
        state.bowl.mixProgress = 0;
        showFeedback("STIR NOW!", 'success');
    }
}

function finishJelly() {
    state.bowl.status = 'cooldown';
    AudioSys.play('success', 300);

    const jelly = new Jelly(state.bowl.x, state.bowl.y, state.bowl.liquidColor);
    jelly.vy = -400;
    state.jellies.push(jelly);

    state.jelliesMade++;
    document.getElementById('jelly-count').innerText = state.jelliesMade;
    showFeedback("BLOB READY!", 'success');

    for(let i=0; i<20; i++) {
        state.particles.push({
            x: state.bowl.x, y: state.bowl.y,
            vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
            life: 1.0, size: 8, color: `hsl(${Math.random()*360}, 80%, 70%)`
        });
    }

    setTimeout(() => {
        state.bowl.status = 'filling';
        state.bowl.contents = [];
        state.bowl.mixProgress = 0;
        state.bowl.liquidColor = '#ffcdd2';
    }, 1000);
}

/**
 * FLOW
 */
function startGame() {
    AudioSys.unlock();
    AudioSys.play('start', 0);
    AudioSys.startLoop();
    document.getElementById('start-screen').classList.add('hidden');
    state.running = true;
    resize();
    requestAnimationFrame(loop);
}

function resetGame() {
    state.jellies = [];
    state.ingredients = [];
    state.jelliesMade = 0;
    state.bowl.contents = [];
    state.bowl.status = 'filling';
    state.bowl.mixProgress = 0;
    state.bowl.liquidColor = '#ffcdd2';
    document.getElementById('jelly-count').innerText = "0";
    AudioSys.play('reset', 0);
    setGifMood('fail', 'Fresh bowl', 800);
}

// Bindings
canvas.addEventListener('touchstart', handleStart, {passive: false});
canvas.addEventListener('touchmove', handleMove, {passive: false});
canvas.addEventListener('touchend', handleEnd, {passive: false});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('reset-btn').addEventListener('click', resetGame);

window.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        AudioSys.stopLoop();
    } else if (state.running) {
        AudioSys.startLoop();
    }
});

// Init
resize();

</script>
</body>
