<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neo-Tokyo Crowne: Chrome Drop Era</title>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | action: use approved font refs for title, UI, and retro HUD roles -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-core: #07020d;
            --bg-vignette: #110018;
            --panel: rgba(12, 18, 34, 0.82);
            --panel-strong: rgba(14, 24, 48, 0.94);
            --panel-soft: rgba(255, 255, 255, 0.05);
            --line: rgba(140, 201, 255, 0.2);
            --line-strong: rgba(120, 232, 255, 0.55);
            --text-main: #eef7ff;
            --text-soft: #93a8cb;
            --text-dim: #6980aa;
            --cyan: #6ff7ff;
            --teal: #a7ffef;
            --gold: #ffe36e;
            --pink: #ff2f8f;
            --danger: #ff315d;
            --ink: #05070f;
            --shadow-lg: 0 16px 42px rgba(0, 0, 0, 0.4);
            --glow-cyan: 0 0 22px rgba(86, 229, 255, 0.34);
            --glow-pink: 0 0 24px rgba(255, 90, 169, 0.28);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(44, 87, 164, 0.22), transparent 38%),
                radial-gradient(circle at bottom, rgba(255, 90, 169, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-core), var(--bg-vignette));
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.4;
            mix-blend-mode: screen;
        }

        body::after {
            background: radial-gradient(circle, transparent 50%, rgba(0, 0, 0, 0.42) 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        h1, h2, #toast-main, .screen-title, .screen-button, .action-btn {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        #score-display, #toast-sub, .hud-label, .index-item, #collection-count {
            font-family: 'Press Start 2P', 'Rajdhani', monospace;
        }

        /* Minimal utility classes replacing previous CDN-only styling */
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-1\/4 { top: 25%; }
        .left-1\/2 { left: 50%; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .z-50 { z-index: 50; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
        }

        .safe-area-inset-top {
            padding-top: max(24px, env(safe-area-inset-top));
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(7, 11, 22, 0.9), rgba(10, 15, 31, 0.78));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(133, 211, 255, 0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow-lg);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(123,255,217,0.08), transparent 22%, transparent 78%, rgba(255,90,169,0.08));
        }

        .neon-text {
            text-shadow: 0 0 12px currentColor, 0 0 26px currentColor;
        }

        .screen-panel {
            position: relative;
            width: min(100%, 430px);
            padding: 28px 22px 24px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(10, 17, 33, 0.92), rgba(8, 11, 22, 0.8));
            border: 1px solid rgba(132, 223, 255, 0.16);
            box-shadow: var(--shadow-lg), inset 0 0 40px rgba(86, 229, 255, 0.04);
            overflow: hidden;
        }

        .screen-panel::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .hero-emblem {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto 18px;
            border-radius: 26px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.2), transparent 34%),
                linear-gradient(160deg, rgba(86,229,255,0.22), rgba(255,90,169,0.12) 60%, rgba(255,215,111,0.16));
            border: 1px solid rgba(132, 223, 255, 0.25);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.03), var(--glow-cyan);
        }

        .hero-emblem::before,
        .hero-emblem::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-emblem::before {
            inset: -10px;
            border: 1px solid rgba(123,255,217,0.18);
            opacity: 0.8;
        }

        .hero-emblem::after {
            inset: 12px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        .hero-emblem span {
            font-size: 48px;
            filter: drop-shadow(0 0 10px rgba(86,229,255,0.45));
        }

        .screen-title {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 3.8rem);
            line-height: 0.9;
            color: var(--text-main);
            letter-spacing: 0.04em;
        }

        .screen-subtitle {
            margin: 10px 0 18px;
            color: rgba(123, 255, 217, 0.8);
            font-size: 0.92rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        .screen-copy {
            margin: 16px 0 0;
            color: var(--text-soft);
            font-size: 0.8rem;
            line-height: 1.45;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .accent-cyan { color: var(--cyan); }
        .accent-pink { color: var(--pink); }

        .screen-button {
            position: relative;
            width: 100%;
            min-height: 60px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 14px 18px;
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.22);
            font-size: clamp(1rem, 3.8vw, 1.35rem);
            letter-spacing: 0.08em;
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
        }

        .screen-button:active {
            transform: scale(0.97);
        }

        .screen-button.primary {
            background: linear-gradient(180deg, rgba(86,229,255,0.3), rgba(31, 124, 164, 0.54));
            border-color: rgba(116, 237, 255, 0.42);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), var(--glow-cyan);
        }

        .screen-button.secondary {
            color: #d2ddf5;
            background: linear-gradient(180deg, rgba(57, 65, 92, 0.52), rgba(22, 28, 44, 0.66));
        }

        .screen-button.danger {
            background: linear-gradient(180deg, rgba(255, 84, 122, 0.34), rgba(132, 22, 50, 0.66));
            border-color: rgba(255, 122, 150, 0.42);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), var(--glow-pink);
        }

        .stack-sm > * + * { margin-top: 12px; }
        .stack-md > * + * { margin-top: 16px; }

        /* HUD */
        #hud {
            z-index: 5;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)) 18px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            width: 100%;
        }

        .hud-card {
            position: relative;
            pointer-events: none;
            min-width: 0;
            padding: 12px 14px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(7, 13, 26, 0.88), rgba(13, 22, 42, 0.72));
            border: 1px solid rgba(120, 232, 255, 0.16);
            box-shadow: inset 0 0 24px rgba(86,229,255,0.04), 0 10px 24px rgba(0,0,0,0.22);
        }

        .hud-score-card { max-width: 180px; }
        .hud-signal-card { width: min(42vw, 170px); }

        #score-display {
            font-size: clamp(1.8rem, 8vw, 3rem);
            line-height: 1;
            color: var(--cyan);
            text-shadow: 0 0 14px rgba(86,229,255,0.8);
        }

        .hud-label {
            margin-top: 4px;
            color: var(--text-dim);
            font-size: 0.63rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .signal-bar {
            width: 100%;
            height: 12px;
            padding: 2px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .signal-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--teal), var(--cyan), #ffffff);
            box-shadow: 0 0 14px rgba(86,229,255,0.45);
            transition: width 0.2s linear;
        }

        #toast {
            width: min(100%, 360px);
            padding: 0 14px;
        }

        .feedback-gif {
            position: absolute;
            right: 16px;
            top: max(84px, env(safe-area-inset-top) + 54px);
            width: min(28vw, 108px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 12px 24px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(-10px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 6;
            object-fit: cover;
            background: rgba(8, 11, 22, 0.72);
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.secondary {
            top: auto;
            bottom: max(176px, env(safe-area-inset-bottom) + 140px);
            right: 18px;
            width: min(24vw, 92px);
        }

        .toast-shell {
            margin: 0 auto;
            padding: 14px 18px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(14, 18, 36, 0.95), rgba(8, 11, 22, 0.84));
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--shadow-lg);
        }

        #toast-sub {
            margin-bottom: 6px;
            font-size: 0.78rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        #toast-main {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            line-height: 1.05;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Controls */
        /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
        .control-zone {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.07);
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 55%, transparent 72%);
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-zone {
            left: 20px;
            box-shadow: inset 0 0 36px rgba(86,229,255,0.08), 0 0 0 1px rgba(86,229,255,0.05);
        }

        #joystick-zone::before,
        #joystick-zone::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            inset: 16px;
            border: 1px solid rgba(123,255,217,0.09);
            pointer-events: none;
        }

        #joystick-zone::after {
            inset: 36px;
            border-style: dashed;
            opacity: 0.7;
        }

        #joystick-knob {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), rgba(86,229,255,0.5) 28%, rgba(33,74,114,0.82) 72%);
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 0 18px rgba(86,229,255,0.35);
        }

        #action-zone {
            right: 20px;
            border: none;
            background: none;
            width: auto;
            height: auto;
            display: flex;
            gap: 14px;
            align-items: flex-end;
        }

        .action-btn {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 25%, rgba(255,255,255,0.2), rgba(255,255,255,0.08) 24%, rgba(255,255,255,0.03) 55%, rgba(4,7,18,0.92));
            border: 2px solid rgba(255,255,255,0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 16px;
            line-height: 1;
            color: white;
            transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.34);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .action-btn::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }

        .action-btn:active {
            background: rgba(255,255,255,0.18);
            transform: scale(0.92);
        }

        #btn-grab {
            border-color: rgba(255, 215, 111, 0.48);
            color: var(--gold);
            box-shadow: 0 0 18px rgba(255, 215, 111, 0.12), 0 8px 18px rgba(0,0,0,0.34);
        }

        #btn-attack {
            width: 96px;
            height: 96px;
            border-color: rgba(255, 90, 169, 0.52);
            color: #ff8abb;
            font-size: 18px;
            box-shadow: 0 0 22px rgba(255, 90, 169, 0.14), 0 8px 18px rgba(0,0,0,0.34);
        }

        /* Index Grid */
        .index-screen-shell {
            width: min(100%, 440px);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .index-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            min-height: 0;
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .index-item {
            aspect-ratio: 1;
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            color: #55627b;
            position: relative;
            overflow: hidden;
        }

        .index-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(86,229,255,0.05), transparent 50%, rgba(255,90,169,0.05));
            pointer-events: none;
        }

        .index-item.unlocked {
            background: linear-gradient(180deg, rgba(86,229,255,0.1), rgba(255,255,255,0.05));
            border-color: rgba(129, 224, 255, 0.22);
            color: white;
            box-shadow: inset 0 0 24px rgba(86,229,255,0.05);
        }

        .index-icon {
            font-size: 24px;
            margin-bottom: 3px;
        }

        .index-grid::-webkit-scrollbar { width: 4px; }
        .index-grid::-webkit-scrollbar-thumb { background: rgba(123,255,217,0.28); border-radius: 2px; }

        /* Screen wrappers */
        .screen-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)) 16px;
        }

        .screen-wrap.column {
            flex-direction: column;
            justify-content: flex-start;
        }

        .top-gap {
            padding-top: max(14px, env(safe-area-inset-top));
        }

        .menu-panel {
            max-width: 430px;
        }

        /* Text helpers */
        .muted { color: var(--text-soft); }
        .dim { color: var(--text-dim); }
        .count-highlight { color: var(--cyan); }
        .danger-highlight { color: var(--danger); }

        .modal-actions {
            margin-top: 14px;
        }

        button,
        .interactive,
        .action-btn,
        .control-zone {
            touch-action: manipulation;
        }

        @keyframes glitch {
            0% { transform: translate(0,0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0,0); }
        }

        .text-common { color: #c0c8d8; text-shadow: 0 0 6px rgba(192,200,216,0.55); }
        .text-uncommon { color: #72f3b3; text-shadow: 0 0 8px rgba(114,243,179,0.6); }
        .text-rare { color: #72b7ff; text-shadow: 0 0 10px rgba(114,183,255,0.6); }
        .text-epic { color: #cb8dff; text-shadow: 0 0 12px rgba(203,141,255,0.65); }
        .text-legendary { color: #ffd76f; text-shadow: 0 0 15px rgba(255,215,111,0.72); }
        .text-mythical { color: #ff5e95; text-shadow: 0 0 18px rgba(255,94,149,0.85); animation: glitch 0.2s infinite; }

        @media (max-width: 640px) {
            #hud { padding-left: 12px; padding-right: 12px; }
            .hud-top { gap: 10px; }
            .hud-card { padding: 10px 12px; border-radius: 16px; }
            .hud-score-card { max-width: 152px; }
            .hud-signal-card { width: min(42vw, 144px); }

            .control-zone {
                width: 124px;
                height: 124px;
            }

            #joystick-zone { left: 12px; }
            #action-zone { right: 12px; gap: 10px; }
            .action-btn {
                width: 72px;
                height: 72px;
                font-size: 14px;
            }
            #btn-attack {
                width: 88px;
                height: 88px;
                font-size: 16px;
            }

            .screen-panel {
                padding: 22px 16px 18px;
                border-radius: 20px;
            }

            .screen-copy {
                font-size: 0.74rem;
            }

            .feedback-gif {
                right: 12px;
                width: min(26vw, 84px);
                border-radius: 14px;
            }

            .feedback-gif.secondary {
                bottom: max(156px, env(safe-area-inset-bottom) + 122px);
                width: min(22vw, 76px);
            }

            .index-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>

<!-- Assets (Audio) -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: gameplay-loop + ui + combat + pickup via catalogs/audios.json -->
    <audio id="bgm_battle" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_hit" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>
    <audio id="sfx_interact" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_pickup" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_damage" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_game_over" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
    <audio id="sfx_menu_open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3" preload="auto"></audio>
    <audio id="sfx_menu_close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_02.mp3" preload="auto"></audio>
    <audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3" preload="auto"></audio>
</div>

<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: compact combat + relic feedback overlays from catalogs/gifs.json -->
    <img id="combat-gif" class="feedback-gif" src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" alt="Combat impact feedback" decoding="async" loading="eager">
    <img id="pickup-gif" class="feedback-gif secondary" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Relic unlock feedback" decoding="async" loading="eager">

    <!-- HUD -->

<script>
/*
 * SYSTEM CONFIG & UTILS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const ENABLE_ANIMATIONS = true;

// Game Constants
const WORLD_SIZE = 2500;
const CONFIG = {
    playerSpeed: 400,
    enemySpeed: 200,
    friction: 0.88,
    heavySpeedPenalty: 0.65
};

/*
 * DATA & SAVE SYSTEM
 */
const SaveSystem = {
    discovered: new Set(),
    init() {
        try {
            const data = localStorage.getItem('nt_royale_drops');
            if (data) {
                const arr = JSON.parse(data);
                arr.forEach(id => this.discovered.add(id));
            }
        } catch(e) { console.error('Save load failed', e); }
    },
    unlock(id) {
        if (!this.discovered.has(id)) {
            this.discovered.add(id);
            localStorage.setItem('nt_royale_drops', JSON.stringify([...this.discovered]));
            return true;
        }
        return false;
    },
    getCount() { return this.discovered.size; }
};
SaveSystem.init();

/*
 * WEAPON DATABASE
 */
const RARITIES = {
    COMMON:    { id: 'common',    color: '#c0c8d8', mult: 1.0,  label: 'COMMON', class: 'text-common' },
    UNCOMMON:  { id: 'uncommon',  color: '#72f3b3', mult: 1.3,  label: 'UNCOMMON', class: 'text-uncommon' },
    RARE:      { id: 'rare',      color: '#72b7ff', mult: 1.7,  label: 'RARE', class: 'text-rare' },
    EPIC:      { id: 'epic',      color: '#cb8dff', mult: 2.2,  label: 'EPIC', class: 'text-epic' },
    LEGENDARY: { id: 'legendary', color: '#ffd76f', mult: 3.0,  label: 'LEGENDARY', class: 'text-legendary' },
    MYTHIC:  { id: 'mythical',  color: '#ff5e95', mult: 5.0,  label: 'MYTHIC', class: 'text-mythical' }
};

const ARCHETYPES = [
    { type: 'dagger',    shape: 'dagger',    baseDmg: 20,  baseSpd: 0.2, reach: 60,  heavy: false, name: 'Micro Blade', throwType: 'normal' },
    { type: 'sword',     shape: 'rect',      baseDmg: 40,  baseSpd: 0.3, reach: 90,  heavy: false, name: 'Chrome Saber',  throwType: 'normal' },
    { type: 'spear',     shape: 'spear',     baseDmg: 35,  baseSpd: 0.3, reach: 130, heavy: false, name: 'Rail Lance',  throwType: 'straight' },
    { type: 'axe',       shape: 'axe',       baseDmg: 50,  baseSpd: 0.4, reach: 80,  heavy: false, name: 'Mono Axe',    throwType: 'normal' },
    { type: 'hammer',    shape: 'hammer',    baseDmg: 80,  baseSpd: 0.6, reach: 80,  heavy: true,  name: 'Gravity Mallet', throwType: 'normal' },
    { type: 'battleaxe', shape: 'battleaxe', baseDmg: 90,  baseSpd: 0.7, reach: 90,  heavy: true,  name: 'B.Mono Axe',  throwType: 'boomerang' },
    { type: 'mace',      shape: 'mace',      baseDmg: 60,  baseSpd: 0.5, reach: 70,  heavy: false, name: 'Pulse Mace',   throwType: 'normal' },
    { type: 'scythe',    shape: 'scythe',    baseDmg: 55,  baseSpd: 0.4, reach: 110, heavy: false, name: 'Laser Scythe', throwType: 'normal' },
    { type: 'katana',    shape: 'katana',    baseDmg: 45,  baseSpd: 0.2, reach: 95,  heavy: false, name: 'Neo Katana', throwType: 'normal' },
    { type: 'glaive',    shape: 'glaive',    baseDmg: 50,  baseSpd: 0.4, reach: 120, heavy: false, name: 'Shard Glaive', throwType: 'straight' }
];

const RARITY_PREFIXES = {
    COMMON:    ['Scuffed', 'Starter', 'Bootleg', 'Retro', 'Lobby', 'Patchy', 'Warmup', 'Low-Ping', 'Budget', 'Default'],
    UNCOMMON:  ['Chrome', 'Turbo', 'Mirror', 'Sweaty', 'Squad', 'Shielded', 'Tanky', 'Slide', 'Meta', 'Modded'],
    RARE:      ['Neon', 'Overclock', 'Rival', 'Crown', 'Anime', 'Compact', 'Tilted', 'Burst', 'Clean', 'No-Scope'],
    EPIC:      ['Ghost', 'Null', 'Holo', 'Tagged', 'Capsule', 'Lost', 'Doomscroll', 'Blessed', 'Thunder', 'Afterburn'],
    LEGENDARY: ['Redline', 'Oni', 'Angel', 'GOAT', 'Endgame', 'Skyline', 'Kaiju', 'Reboot', 'Satellite', 'Divine'],
    MYTHIC:  ['Goated', 'Zonebreaker', 'Main-Character', 'Infinite', 'Chaos', 'Era-Circle', 'Day-One', 'Void', 'Galaxy', 'Era']
};

const WEAPON_DB = [];

function initWeaponDB() {
    const rKeys = Object.keys(RARITIES);
    rKeys.forEach(rKey => {
        const rarity = RARITIES[rKey];
        ARCHETYPES.forEach((arch, index) => {
            const prefix = RARITY_PREFIXES[rKey][index];
            const uniqueId = `${rKey}_${arch.type}`;
            WEAPON_DB.push({
                uniqueId: uniqueId,
                name: `${prefix} ${arch.name}`,
                rarity: rarity,
                archetype: arch,
                damage: Math.floor(arch.baseDmg * rarity.mult),
                cooldown: arch.baseSpd,
                knockback: arch.heavy ? 600 * rarity.mult : 300 * rarity.mult,
                heavy: arch.heavy,
                shape: arch.shape,
                reach: arch.reach,
                color: rarity.color,
                throwType: arch.throwType
            });
        });
    });
}
initWeaponDB();

// State
let gameState = 'MENU';
let lastTime = 0;
let score = 0;
let camera = { x: 0, y: 0, shake: 0 };

// Entities
let player;
let enemies = [];
let weapons = [];
let particles = [];
let visualEffects = [];

// Input
const input = { x: 0, y: 0, attack: false, grab: false };

/*
 * AUDIO SYSTEM
 */
const audio = {
    ctx: null,
    buffers: {},
    gains: {},
    mediaEls: {},
    lastPlayed: {},
    loadQueue: [
        ['bgm', 'bgm_battle'],
        ['hit', 'sfx_hit'],
        ['interact', 'sfx_interact'],
        ['pickup', 'sfx_pickup'],
        ['damage', 'sfx_damage'],
        ['fail', 'sfx_fail'],
        ['gameOver', 'sfx_game_over'],
        ['menuOpen', 'sfx_menu_open'],
        ['menuClose', 'sfx_menu_close'],
        ['start', 'sfx_start']
    ],
    init() {
        try {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.loadQueue.forEach(([key, id]) => this.load(key, id));
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
        } catch (e) {
            this.ctx = null;
        }
    },
    load(key, elementId) {
        const mediaEl = document.getElementById(elementId);
        if (!mediaEl) return;
        this.mediaEls[key] = mediaEl;
        if (!this.ctx || !mediaEl.src) return;
        try {
            if (new URL(mediaEl.src, location.href).origin !== location.origin) return;
        } catch (e) { return; }
        fetch(mediaEl.src)
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.arrayBuffer();
            })
            .then(b => this.ctx.decodeAudioData(b))
            .then(buf => { this.buffers[key] = buf; })
            .catch(() => {});
    },
    play(key, vol = 0.5, pitchVar = 0, cooldown = 0) {
        const now = performance.now();
        if (cooldown > 0 && this.lastPlayed[key] && now - this.lastPlayed[key] < cooldown) return;
        this.lastPlayed[key] = now;

        if (this.ctx && this.buffers[key]) {
            const src = this.ctx.createBufferSource();
            src.buffer = this.buffers[key];
            if (pitchVar > 0) src.playbackRate.value = 1 + (Math.random() - 0.5) * pitchVar;
            const gain = this.ctx.createGain();
            gain.gain.value = vol;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
            return;
        }

        const mediaEl = this.mediaEls[key];
        if (!mediaEl) return;
        const oneShot = mediaEl.cloneNode(true);
        oneShot.volume = Math.max(0, Math.min(1, vol));
        oneShot.playbackRate = pitchVar > 0 ? 1 + (Math.random() - 0.5) * pitchVar : 1;
        oneShot.preload = 'auto';
        oneShot.play().catch(() => {});
    },
    bgmNode: null,
    playBgm() {
        if (this.bgmNode || !this.ctx || !this.buffers.bgm) return;
        this.bgmNode = this.ctx.createBufferSource();
        this.bgmNode.buffer = this.buffers.bgm;
        this.bgmNode.loop = true;
        const gain = this.ctx.createGain();
        gain.gain.value = 0.18;
        this.gains.bgm = gain;
        this.bgmNode.connect(gain);
        gain.connect(this.ctx.destination);
        this.bgmNode.start(0);
        this.bgmNode.onended = () => {
            this.bgmNode = null;
        };
    },
    stopBgm() {
        if (this.bgmNode) {
            this.bgmNode.stop();
            this.bgmNode = null;
        }
    }
};

/*
 * INPUT HANDLING
 */
function setupInputs() {
    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyId = null;
    let joyCenter = { x: 0, y: 0 };

    joyZone.addEventListener('pointerdown', e => {
        e.preventDefault();
        joyId = e.pointerId;
        const r = joyZone.getBoundingClientRect();
        joyCenter = { x: r.left + r.width/2, y: r.top + r.height/2 };
        updateJoy(e.clientX, e.clientY);
        joyKnob.style.transition = 'none';
        joyZone.setPointerCapture(e.pointerId);
    });

    const moveJoy = e => { if (e.pointerId === joyId) updateJoy(e.clientX, e.clientY); };
    const endJoy = e => {
        if (e.pointerId === joyId) {
            joyId = null;
            input.x = 0; input.y = 0;
            joyKnob.style.transform = 'translate(-50%, -50%)';
            joyKnob.style.transition = 'transform 0.2s ease-out';
        }
    };

    joyZone.addEventListener('pointermove', moveJoy);
    joyZone.addEventListener('pointerup', endJoy);
    joyZone.addEventListener('pointercancel', endJoy);

    function updateJoy(cx, cy) {
        const maxDist = 40;
        const dx = cx - joyCenter.x;
        const dy = cy - joyCenter.y;
        const dist = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx);
        const clamp = Math.min(dist, maxDist);
        const kx = Math.cos(angle) * clamp;
        const ky = Math.sin(angle) * clamp;
        joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
        input.x = kx / maxDist;
        input.y = ky / maxDist;
    }

    const bindBtn = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', e => { e.preventDefault(); input[key] = true; el.style.transform = 'scale(0.9)'; });
        el.addEventListener('pointerup', e => { e.preventDefault(); input[key] = false; el.style.transform = 'scale(1)'; });
        el.addEventListener('pointerleave', e => { e.preventDefault(); input[key] = false; el.style.transform = 'scale(1)'; });
    };
    bindBtn('btn-attack', 'attack');
    bindBtn('btn-grab', 'grab');
}

/*
 * VISUAL EFFECTS
 */
class VisualEffect {
    constructor(type, x, y, data) {
        this.type = type;
        this.x = x; this.y = y;
        this.data = data;
        this.life = 1.0;
    }
    update(dt) {
        this.life -= dt * (this.data.decay || 2);
        return this.life > 0;
    }
    draw(ctx) {
        if (this.type === 'swing') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.data.angle);
            const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, this.data.range || 70);
            grad.addColorStop(0, `rgba(255,255,255,${this.life * 0.45})`);
            grad.addColorStop(0.5, `rgba(86,229,255,${this.life * 0.45})`);
            grad.addColorStop(1, `rgba(255,90,169,0)`);
            ctx.beginPath();
            ctx.arc(0, 0, this.data.range || 70, -Math.PI/3, Math.PI/3);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 42 * this.life;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
        }
    }
}

const gifState = {
    timers: {},
    show(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('visible');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
    }
};

function showToast(weapon, isNew) {
    const el = document.getElementById('toast');
    const main = document.getElementById('toast-main');
    const sub = document.getElementById('toast-sub');

    main.innerText = weapon.name;
    main.style.color = weapon.color;
    main.style.textGhost = `0 0 15px ${weapon.color}`;

    if (isNew) {
        sub.innerText = "GOATED DROP!";
        sub.className = "text-legendary";
        gifState.show('pickup-gif', 1500);
    } else {
        sub.innerText = weapon.rarity.label;
        sub.className = weapon.rarity.class;
    }

    el.style.opacity = '1';
    el.style.transform = 'translate(-50%, 0) scale(1.05)';

    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, 20px) scale(0.92)';
    }, 2000);
}

/*
 * GAME CLASSES
 */
class Entity {
    constructor(x, y, r, color) {
        this.x = x; this.y = y; this.r = r; this.color = color;
        this.vx = 0; this.vy = 0;
        this.dead = false;
        this.bobPhase = Math.random() * Math.PI * 2;
        this.hitFlash = 0;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= Math.pow(CONFIG.friction, dt * 60);
        this.vy *= Math.pow(CONFIG.friction, dt * 60);
        this.bobPhase += dt * 5;
        if (this.hitFlash > 0) this.hitFlash -= dt * 5;

        if (this.x < this.r) { this.x = this.r; this.vx *= -0.5; }
        if (this.y < this.r) { this.y = this.r; this.vy *= -0.5; }
        if (this.x > WORLD_SIZE - this.r) { this.x = WORLD_SIZE - this.r; this.vx *= -0.5; }
        if (this.y > WORLD_SIZE - this.r) { this.y = WORLD_SIZE - this.r; this.vy *= -0.5; }
    }
    drawGhost(ctx) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        const scale = 1 + Math.sin(this.bobPhase) * 0.1;
        ctx.ellipse(this.x, this.y + this.r * 0.52, this.r * scale * 1.02, this.r * 0.46 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Player extends Entity {
    constructor() {
        super(WORLD_SIZE/2, WORLD_SIZE/2, 25, '#ffffff');
        this.hp = 100;
        this.facing = Math.PI/2;
        this.holding = null;
        this.atkTimer = 0;
        this.grabInputLocked = false;
    }

    update(dt) {
        let spd = CONFIG.playerSpeed;
        if (this.holding && this.holding.def.heavy) spd *= CONFIG.heavySpeedPenalty;

        const moving = Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1;
        if (moving) {
            this.vx += input.x * spd * 8 * dt;
            this.vy += input.y * spd * 8 * dt;
            this.facing = Math.atan2(input.y, input.x);
        }

        const v = Math.hypot(this.vx, this.vy);
        if (v > spd) {
            this.vx = (this.vx/v) * spd;
            this.vy = (this.vy/v) * spd;
        }

        super.update(dt);

        if (this.atkTimer > 0) this.atkTimer -= dt;

        if (input.grab) {
            if (!this.grabInputLocked) {
                if (this.holding) this.throwWeapon();
                else this.tryGrab();
                this.grabInputLocked = true;
            }
        } else {
            this.grabInputLocked = false;
        }

        if (input.attack && this.atkTimer <= 0) {
            this.meleeAttack();
        }

        if (this.holding) {
            const holdDist = 35;
            this.holding.x = this.x + Math.cos(this.facing) * holdDist;
            this.holding.y = this.y + Math.sin(this.facing) * holdDist;
            this.holding.z = 15 + Math.sin(this.bobPhase * 2) * 2;
            this.holding.vx = this.vx;
            this.holding.vy = this.vy;
            this.holding.rot = this.facing + Math.PI/2;
        }
    }

    tryGrab() {
        let target = null;
        let minD = 80;
        weapons.forEach(p => {
            if (p.state === 'IDLE') {
                const d = Math.hypot(p.x - this.x, p.y - this.y);
                if (d < minD) { minD = d; target = p; }
            }
        });
        if (target) {
            this.holding = target;
            target.state = 'HELD';
            audio.play('pickup', 0.52, 0.08, 90);
            gifState.show('pickup-gif', 1200);
            spawnParticles(target.x, target.y, '#dffcff', 5);

            const isNew = SaveSystem.unlock(target.def.uniqueId);
            showToast(target.def, isNew);
        }
    }

    throwWeapon() {
        if (!this.holding) return;
        const w = this.holding;
        w.state = 'THROWN';
        w.throwTime = 0;

        let throwAngle = this.facing;
        if (Math.hypot(input.x, input.y) > 0.1) throwAngle = Math.atan2(input.y, input.x);

        let speed = 1200;
        if (w.def.throwType === 'straight') speed = 1800;

        w.vx = Math.cos(throwAngle) * speed + this.vx * 0.5;
        w.vy = Math.sin(throwAngle) * speed + this.vy * 0.5;
        w.thrower = this;

        w.throwData = {
            startX: w.x,
            startY: w.y,
            returned: false,
            hitList: []
        };

        this.holding = null;
        audio.play('interact', 0.42, 0.05, 80);
        camera.shake = 5;
    }

    meleeAttack() {
        const weapon = this.holding ? this.holding.def : { damage: 15, reach: 50, cooldown: 0.3, knockback: 200 };
        const cd = this.holding ? weapon.cooldown : 0.3;

        this.atkTimer = cd;
        spawnParticles(this.x, this.y, '#dffcff', 3);
        audio.play('interact', 0.32, 0.16, 70);

        visualEffects.push(new VisualEffect('swing', this.x, this.y, {
            angle: this.facing,
            decay: 1.0 / cd,
            range: weapon.reach
        }));

        const arc = Math.PI / 1.5;
        let hitAny = false;

        enemies.forEach(e => {
            const dx = e.x - this.x;
            const dy = e.y - this.y;
            const dist = Math.hypot(dx, dy);
            if (dist < weapon.reach) {
                const angleToEnemy = Math.atan2(dy, dx);
                let angleDiff = angleToEnemy - this.facing;
                while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI*2;

                if (Math.abs(angleDiff) < arc / 2) {
                    const push = Math.atan2(dy, dx);
                    const kb = weapon.knockback || 300;
                    e.vx += Math.cos(push) * kb;
                    e.vy += Math.sin(push) * kb;
                    e.hit(weapon.damage);
                    hitAny = true;
                }
            }
        });

        if (hitAny) {
            camera.shake = weapon.heavy ? 10 : 4;
            audio.play('hit', 0.5, 0.06, 70);
            gifState.show('combat-gif', 820);
        } else {
            audio.play('fail', 0.22, 0, 140);
        }
    }

    hit(dmg) {
        this.hp -= dmg;
        this.hitFlash = 1.0;
        camera.shake = 8;
        audio.play('damage', 0.34, 0.08, 140);
        gifState.show('combat-gif', 960);
        spawnParticles(this.x, this.y, this.color, 6);
        document.getElementById('hp-bar').style.width = Math.max(0, this.hp) + '%';
        if (this.hp <= 0) endGame();
    }

    draw(ctx) {
        this.drawGhost(ctx);
        ctx.save();
        ctx.translate(this.x, this.y);
        const s = 1 + Math.sin(this.bobPhase) * 0.06;
        ctx.scale(s, s);

        const glow = ctx.createRadialGradient(0, 0, 6, 0, 0, this.r * 1.9);
        glow.addColorStop(0, this.hitFlash > 0.1 ? 'rgba(255,255,255,0.95)' : 'rgba(123,255,217,0.82)');
        glow.addColorStop(0.55, 'rgba(86,229,255,0.48)');
        glow.addColorStop(1, 'rgba(86,229,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, this.r * 1.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#7bffd9';
        ctx.shadowBlur = 24;

        ctx.rotate(this.facing);
        const bikeFlash = this.hitFlash > 0.1;
        ctx.fillStyle = bikeFlash ? '#ffffff' : '#ff315d';
        ctx.beginPath();
        ctx.roundRect(-25, -11, 50, 22, 10);
        ctx.fill();
        ctx.fillStyle = '#f7fbff';
        ctx.beginPath();
        ctx.roundRect(-5, -17, 28, 10, 5);
        ctx.fill();
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(-18, 14, 8, 0, Math.PI * 2);
        ctx.arc(20, 14, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6ff7ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-18, 14, 11, 0, Math.PI * 2);
        ctx.arc(20, 14, 11, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffe36e';
        ctx.beginPath();
        ctx.moveTo(28, -3); ctx.lineTo(45, 0); ctx.lineTo(28, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(167,255,239,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-28, -7); ctx.lineTo(-42, -16);
        ctx.moveTo(-28, 7); ctx.lineTo(-44, 18);
        ctx.stroke();

        ctx.restore();
    }
}

class Enemy extends Entity {
    constructor(x, y) {
        super(x, y, 24, '#ff5e95');
        this.hp = 80 + (score / 100);
        this.stun = 0;
        this.anim = Math.random() * 10;
    }
    update(dt) {
        if (this.stun > 0) { this.stun -= dt; super.update(dt); return; }

        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const d = Math.hypot(dx, dy);

        if (d > 40) {
            const a = Math.atan2(dy, dx);
            this.vx += Math.cos(a) * CONFIG.enemySpeed * 4 * dt;
            this.vy += Math.sin(a) * CONFIG.enemySpeed * 4 * dt;
        }

        if (d < 50) {
            player.hit(0.4);
            const push = Math.atan2(this.y - player.y, this.x - player.x);
            player.vx += Math.cos(push) * -80 * dt;
            player.vy += Math.sin(push) * -80 * dt;
        }

        this.anim += dt * 8;
        super.update(dt);
    }
    hit(dmg) {
        this.hp -= dmg;
        this.stun = 0.2;
        this.hitFlash = 1.0;
        spawnParticles(this.x, this.y, this.color, 5);
        if (this.hp <= 0) {
            this.dead = true;
            score += 100;
            document.getElementById('score-display').innerText = score;
            spawnParticles(this.x, this.y, this.color, 12);
            audio.play('hit', 0.55, 0.08, 70);
            gifState.show('combat-gif', 880);
        }
    }
    draw(ctx) {
        this.drawGhost(ctx);
        const scale = 1 + Math.sin(this.anim) * 0.08;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);

        const bodyGrad = ctx.createRadialGradient(-4, -6, 4, 0, 0, this.r * 1.4);
        bodyGrad.addColorStop(0, this.hitFlash > 0.1 ? '#ffffff' : '#ff8cbd');
        bodyGrad.addColorStop(0.65, this.color);
        bodyGrad.addColorStop(1, '#5c1433');

        ctx.shadowColor = this.color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = bodyGrad;
        ctx.rotate(Math.sin(this.anim * 0.35) * 0.18);
        ctx.beginPath();
        ctx.roundRect(-22, -14, 44, 28, 9);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#210617';
        ctx.beginPath();
        ctx.arc(-9, -2, 4, 0, Math.PI * 2);
        ctx.arc(9, -2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffe36e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-27, 0); ctx.lineTo(-38, -8); ctx.moveTo(-27, 0); ctx.lineTo(-38, 8);
        ctx.moveTo(27, 0); ctx.lineTo(38, -8); ctx.moveTo(27, 0); ctx.lineTo(38, 8);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,49,93,0.28)';
        ctx.beginPath();
        ctx.arc(0, 0, this.r + 10 + Math.sin(this.anim) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,49,93,0.5)';
        ctx.stroke();

        ctx.restore();
    }
}

class Weapon extends Entity {
    constructor(x, y, def) {
        super(x, y, 20, def.color);
        this.def = def;
        this.state = 'IDLE';
        this.rot = Math.random() * Math.PI * 2;
        this.throwTime = 0;
        this.z = 0;
        this.throwData = {};
    }
    update(dt) {
        if (this.state === 'HELD') return;

        if (this.state !== 'THROWN' || this.def.throwType !== 'straight') {
            super.update(dt);
        } else {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.bobPhase += dt * 5;
            if (this.x < this.r) { this.x = this.r; this.vx *= -0.5; this.state = 'IDLE'; }
            if (this.y < this.r) { this.y = this.r; this.vy *= -0.5; this.state = 'IDLE'; }
            if (this.x > WORLD_SIZE - this.r) { this.x = WORLD_SIZE - this.r; this.vx *= -0.5; this.state = 'IDLE'; }
            if (this.y > WORLD_SIZE - this.r) { this.y = WORLD_SIZE - this.r; this.vy *= -0.5; this.state = 'IDLE'; }
        }

        this.z *= 0.9;

        if (this.state === 'THROWN') {
            this.throwTime += dt;
            this.rot += dt * 20;

            if (this.def.throwType === 'boomerang') {
                if (this.throwTime > 0.6) {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    const speed = 900;
                    this.vx += (dx/dist) * speed * 2 * dt;
                    this.vy += (dy/dist) * speed * 2 * dt;

                    const v = Math.hypot(this.vx, this.vy);
                    if (v > speed) {
                        this.vx = (this.vx/v) * speed;
                        this.vy = (this.vy/v) * speed;
                    }

                    if (dist < 50 && !player.holding) {
                        player.holding = this;
                        this.state = 'HELD';
                        audio.play('interact', 1.5);
                        showToast(this.def, false);
                        return;
                    }
                }
            }

            const v = Math.hypot(this.vx, this.vy);

            if (v < 100 && this.def.throwType !== 'boomerang') {
                this.state = 'IDLE';
                this.thrower = null;
                return;
            }

            enemies.forEach(e => {
                if (Math.hypot(e.x - this.x, e.y - this.y) < this.r + e.r) {
                    if (this.def.throwType === 'straight' && this.throwData.hitList.includes(e)) return;

                    e.hit(this.def.damage * 1.5);
                    const kb = this.def.heavy ? 800 : 400;
                    e.vx += this.vx * (this.def.heavy ? 2 : 0.5);
                    e.vy += this.vy * (this.def.heavy ? 2 : 0.5);

                    audio.play('hit', 0.48, 0.08, 60);
                    gifState.show('combat-gif', 760);
                    spawnParticles(this.x, this.y, this.color, 8);
                    camera.shake = 6;

                    if (this.def.throwType === 'straight') {
                        this.throwData.hitList.push(e);
                    } else if (this.def.throwType === 'boomerang') {
                    } else {
                        this.vx *= -0.4;
                        this.vy *= -0.4;
                        this.state = 'IDLE';
                        camera.shake = this.def.heavy ? 12 : 6;
                    }
                }
            });
        }
    }

    draw(ctx) {
        const shadowY = this.y + 5 + this.z;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(this.x, shadowY, this.r, this.r * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(this.x, this.y - this.z);
        ctx.rotate(this.rot);

        ctx.shadowColor = this.def.color;
        ctx.shadowBlur = 10 + (this.def.rarity.mult * 5);
        const heavyScale = this.def.heavy ? 1.3 : 1.0;
        ctx.scale(heavyScale, heavyScale);

        const blade = this.def.color;
        const darkMetal = '#24324d';
        const trim = '#f2fbff';

        ctx.beginPath();
        if (this.def.shape === 'rect' || this.def.shape === 'katana') {
            const w = this.def.shape === 'katana' ? 6 : 10;
            const h = this.def.shape === 'katana' ? 70 : 60;
            ctx.fillStyle = blade;
            ctx.fillRect(-w/2, -h/2, w, h);
            ctx.fillStyle = trim;
            ctx.fillRect(-1, -h/2, 2, h - 16);
            ctx.fillStyle = darkMetal;
            ctx.fillRect(-w/2, h/2 - 15, w, 15);
        } else if (this.def.shape === 'dagger') {
            ctx.fillStyle = blade;
            ctx.moveTo(0, -25); ctx.lineTo(6, 0); ctx.lineTo(0, 6); ctx.lineTo(-6, 0);
            ctx.fill();
            ctx.fillStyle = trim;
            ctx.fillRect(-1, -14, 2, 18);
            ctx.fillStyle = darkMetal;
            ctx.fillRect(-3, 6, 6, 10);
        } else if (this.def.shape === 'spear' || this.def.shape === 'glaive') {
            ctx.fillStyle = '#5d6e8f'; ctx.fillRect(-2, -40, 4, 80);
            ctx.fillStyle = blade;
            if (this.def.shape === 'glaive') {
                ctx.moveTo(0, -40); ctx.lineTo(12, -60); ctx.lineTo(0, -72); ctx.lineTo(-5, -60);
            } else {
                ctx.moveTo(0, -40); ctx.lineTo(7, -62); ctx.lineTo(-7, -62);
            }
            ctx.fill();
        } else if (this.def.shape === 'axe' || this.def.shape === 'battleaxe') {
            ctx.fillStyle = '#5d6e8f'; ctx.fillRect(-3, -30, 6, 60);
            ctx.fillStyle = blade;
            ctx.moveTo(3, -20); ctx.quadraticCurveTo(22, -20, 20, 0); ctx.quadraticCurveTo(22, 20, 3, 20);
            if (this.def.shape === 'battleaxe') {
                ctx.moveTo(-3, -20); ctx.quadraticCurveTo(-22, -20, -20, 0); ctx.quadraticCurveTo(-22, 20, -3, 20);
            }
            ctx.fill();
        } else if (this.def.shape === 'hammer' || this.def.shape === 'mace') {
            ctx.fillStyle = '#415272'; ctx.fillRect(-4, -30, 8, 60);
            ctx.fillStyle = blade;
            if (this.def.shape === 'hammer') {
                ctx.fillRect(-20, -30, 40, 25);
            } else {
                ctx.arc(0, -25, 15, 0, Math.PI * 2);
            }
            ctx.fill();
        } else if (this.def.shape === 'scythe') {
            ctx.fillStyle = '#5d6e8f'; ctx.fillRect(-2, -40, 4, 80);
            ctx.fillStyle = blade;
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.quadraticCurveTo(30, -45, 40, -10);
            ctx.lineTo(35, -10);
            ctx.quadraticCurveTo(25, -35, 0, -25);
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 600,
            vy: (Math.random() - 0.5) * 600,
            life: 0.5 + Math.random() * 0.3,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

function spawnRandomWeapon() {
    const r = Math.random();
    let tier;
    if (r < 0.5) tier = 'COMMON';
    else if (r < 0.75) tier = 'UNCOMMON';
    else if (r < 0.88) tier = 'RARE';
    else if (r < 0.95) tier = 'EPIC';
    else if (r < 0.99) tier = 'LEGENDARY';
    else tier = 'MYTHIC';

    const pool = WEAPON_DB.filter(w => w.rarity.id === RARITIES[tier].id);
    const def = pool[Math.floor(Math.random() * pool.length)];

    weapons.push(new Weapon(
        Math.random() * (WORLD_SIZE - 100) + 50,
        Math.random() * (WORLD_SIZE - 100) + 50,
        def
    ));
}

/*
 * UI & INDEX LOGIC
 */
function renderIndex() {
    const grid = document.getElementById('index-grid');
    grid.innerHTML = '';

    document.getElementById('collection-count').innerText = SaveSystem.getCount();

    WEAPON_DB.forEach(w => {
        const unlocked = SaveSystem.discovered.has(w.uniqueId);
        const div = document.createElement('div');
        div.className = `index-item ${unlocked ? 'unlocked' : ''}`;

        if (unlocked) {
            div.innerHTML = `
                <div class="index-icon" style="color:${w.color}; text-shadow:0 0 10px ${w.color}">🏍️</div>
                <div style="line-height:1; color:${w.color}">${w.name.split(' ').join('<br>')}</div>
            `;
        } else {
            div.innerHTML = `<div style="font-size:20px; opacity:0.3">?</div>`;
        }
        grid.appendChild(div);
    });
}

function openIndex() {
    audio.init();
    audio.play('menuOpen', 0.36, 0.05, 120);
    renderIndex();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('index-screen').classList.remove('hidden');
}

function closeIndex() {
    audio.init();
    audio.play('menuClose', 0.32, 0.05, 120);
    document.getElementById('index-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
}

/*
 * MAIN LOOP
 */
function startGame() {
    audio.init();
    audio.play('start', 0.44, 0.06, 180);
    audio.playBgm();

    gameState = 'PLAYING';
    score = 0;
    document.getElementById('score-display').innerText = '0';
    document.getElementById('hp-bar').style.width = '100%';

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');

    player = new Player();
    enemies = [];
    weapons = [];
    particles = [];
    visualEffects = [];

    for (let i = 0; i < 20; i++) spawnRandomWeapon();

    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function endGame() {
    gameState = 'GAMEOVER';
    audio.stopBgm();
    audio.play('gameOver', 0.5, 0, 300);
    gifState.show('combat-gif', 1800);
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('final-score').innerText = score;
}

function goToMenu() {
    audio.init();
    audio.stopBgm();
    audio.play('menuClose', 0.34, 0.04, 120);
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    gameState = 'MENU';
}

let spawnTimer = 0;

function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.1);
    lastTime = t;

    if (gameState === 'PLAYING') {
        const btnGrab = document.getElementById('btn-grab');
        if (player.holding) {
            btnGrab.innerText = 'YEET';
            btnGrab.style.borderColor = 'rgba(255, 90, 169, 0.52)';
            btnGrab.style.color = '#ff8abb';
        } else {
            btnGrab.innerText = 'LOOT';
            btnGrab.style.borderColor = 'rgba(255, 215, 111, 0.48)';
            btnGrab.style.color = '#ffd76f';
        }

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            let ex, ey, d;
            let tries = 0;
            do {
                ex = Math.random() * WORLD_SIZE;
                ey = Math.random() * WORLD_SIZE;
                d = Math.hypot(ex - player.x, ey - player.y);
                tries++;
            } while (d < 600 && tries < 10);

            enemies.push(new Enemy(ex, ey));
            spawnTimer = Math.max(0.2, 1.5 - (score / 3000));
        }

        if (weapons.length < 15 && Math.random() < 0.02) spawnRandomWeapon();

        player.update(dt);
        enemies.forEach(e => e.update(dt));
        weapons.forEach(p => p.update(dt));

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = visualEffects.length - 1; i >= 0; i--) {
            if (!visualEffects[i].update(dt)) visualEffects.splice(i, 1);
        }

        enemies = enemies.filter(e => !e.dead);

        const targetX = player.x - canvas.width / 2;
        const targetY = player.y - canvas.height / 2;
        camera.x += (targetX - camera.x) * 10 * dt;
        camera.y += (targetY - camera.y) * 10 * dt;

        if (camera.shake > 0) {
            camera.x += (Math.random() - 0.5) * camera.shake;
            camera.y += (Math.random() - 0.5) * camera.shake;
            camera.shake *= 0.9;
            if (camera.shake < 0.5) camera.shake = 0;
        }
    }

    const backdrop = ctx.createLinearGradient(0, 0, 0, canvas.height);
    backdrop.addColorStop(0, '#21001f');
    backdrop.addColorStop(0.45, '#080b20');
    backdrop.addColorStop(1, '#02020b');
    ctx.fillStyle = backdrop;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    const worldGlow = ctx.createRadialGradient(
        player ? player.x : WORLD_SIZE / 2,
        player ? player.y : WORLD_SIZE / 2,
        60,
        player ? player.x : WORLD_SIZE / 2,
        player ? player.y : WORLD_SIZE / 2,
        900
    );
    worldGlow.addColorStop(0, 'rgba(86,229,255,0.08)');
    worldGlow.addColorStop(0.55, 'rgba(123,255,217,0.03)');
    worldGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = worldGlow;
    ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    ctx.strokeStyle = 'rgba(111, 247, 255, 0.18)';
    ctx.lineWidth = 2;
    const gridSize = 100;
    const startX = Math.floor(camera.x / gridSize) * gridSize;
    const startY = Math.floor(camera.y / gridSize) * gridSize;
    const endX = startX + canvas.width + gridSize;
    const endY = startY + canvas.height + gridSize;

    ctx.beginPath();
    for (let x = startX; x < endX; x += gridSize) {
        ctx.moveTo(x, camera.y);
        ctx.lineTo(x, camera.y + canvas.height);
    }
    for (let y = startY; y < endY; y += gridSize) {
        ctx.moveTo(camera.x, y);
        ctx.lineTo(camera.x + canvas.width, y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ff315d';
    ctx.lineWidth = 5;
    ctx.shadowColor = 'rgba(255,49,93,0.55)';
    ctx.shadowBlur = 18;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
    ctx.shadowBlur = 0;

    for (let i = 0; i < 78; i++) {
        const px = (i * 311) % WORLD_SIZE;
        const py = (i * 173) % WORLD_SIZE;
        const pulse = 0.18 + Math.sin((t * 0.0015) + i) * 0.08;
        ctx.fillStyle = i % 3 === 0 ? `rgba(255,49,143,${pulse})` : `rgba(111,247,255,${pulse})`;
        ctx.fillRect(px, py, i % 5 === 0 ? 32 : 3, i % 5 === 0 ? 8 : 3);
        if (i % 13 === 0) {
            ctx.strokeStyle = `rgba(255,227,110,${pulse})`;
            ctx.strokeRect(px - 12, py - 12, 24, 24);
        }
    }

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ff315d';
    for (let lane = 0; lane < 8; lane++) {
        const y = (lane * 340 + (t * 0.04)) % WORLD_SIZE;
        ctx.fillRect(0, y, WORLD_SIZE, 3);
    }
    ctx.restore();

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        weapons.forEach(p => p.draw(ctx));
        enemies.forEach(e => e.draw(ctx));
        if (gameState === 'PLAYING') player.draw(ctx);
        visualEffects.forEach(e => e.draw(ctx));
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// Init
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
window.dispatchEvent(new Event('resize'));

document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;
document.getElementById('index-btn').onclick = openIndex;
document.getElementById('close-index-btn').onclick = closeIndex;
document.getElementById('menu-btn').onclick = goToMenu;

setupInputs();
</script>
