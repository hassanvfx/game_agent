<script>
/** 
 * AUDIO SYSTEM 
 */
class AudioController {
    constructor() {
        this.ctx = null;
        this.bgm = document.getElementById('bgm_main');
        this.sounds = {
            catch: document.getElementById('sfx_catch'),
            upgrade: document.getElementById('sfx_upgrade'),
            fail: document.getElementById('sfx_fail'),
            over: document.getElementById('sfx_over'),
            ui: document.getElementById('sfx_ui')
        };
        this.initialized = false;
        this.lastPlayTimes = {};
    }

    init() {
        if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            return;
        }
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        this.ctx = new AudioContext();
        this.initialized = true;

        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        this.bgm.volume = 0.2;
        Object.values(this.sounds).forEach(sound => {
            if (sound) sound.volume = sound.id === 'sfx_over' ? 0.42 : 0.5;
        });
        this.startBgm();
    }

    startBgm() {
        if (!this.bgm) return;
        this.bgm.play().catch(() => {});
    }

    stopBgm() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }

    play(id, cooldown = 90) {
        if (!this.initialized) return;
        const nowMs = performance.now();
        if (this.lastPlayTimes[id] && nowMs - this.lastPlayTimes[id] < cooldown) return;
        this.lastPlayTimes[id] = nowMs;

        const sound = this.sounds[id];
        if (sound) {
            try {
                sound.pause();
                sound.currentTime = 0;
                sound.play().catch(() => this.synthesize(id));
            } catch (_) {
                this.synthesize(id);
            }
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'catch') {
            osc.frequency.setValueAtTime(640, now);
            osc.frequency.exponentialRampToValueAtTime(1240, now + 0.12);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'upgrade' || type === 'ui') {
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(860, now + 0.14);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'fail' || type === 'over') {
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.linearRampToValueAtTime(120, now + 0.24);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
        }
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioController();
const reactionEls = {
    catch: document.getElementById('catch-reaction'),
    fail: document.getElementById('fail-reaction')
};
let reactionTimer = null;

function showReaction(type, duration = 1200) {
    const target = reactionEls[type];
    if (!target) return;
    Object.values(reactionEls).forEach(el => el && el.classList.remove('visible'));
    clearTimeout(reactionTimer);
    target.classList.add('visible');
    reactionTimer = setTimeout(() => target.classList.remove('visible'), duration);
}

// Config Handling
window.gameConfigDefs = {
    "hookSpeed": { "type": "number", "label": "Hook Speed", "value": 8, "min": 2, "max": 20 },
    "spawnRate": { "type": "number", "label": "Fish Spawn Rate", "value": 60, "min": 10, "max": 200 },
    "dayDuration": { "type": "number", "label": "Day Duration (s)", "value": 90, "min": 30, "max": 300 },
    "themeColor": { "type": "color", "label": "UI Accent", "value": "#FFD700" }
};
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') {
            document.documentElement.style.setProperty('--accent', val);
            document.querySelectorAll('.text-yellow-300').forEach(el => el.style.color = val);
        }
    }
};

// Game State
let gameState = 'MENU'; // MENU, PLAY, GAMEOVER
let lastTime = 0;
let score = 0;
let money = 0;
let timeLeft = 0;
let width, height;

// Entities
let particles = [];
let fishes = [];
let floatingTexts = [];

// Player State
const player = {
    x: 0,
    y: 100, // Water surface level
    hookY: 100,
    hookState: 'IDLE', // IDLE, DOWN, UP
    caughtFish: null,
    // Upgrades
    speedLvl: 1,
    depthLvl: 1,
    speedCost: 50,
    depthCost: 50
};

// Input State
const input = {
    x: 0,
    y: 0,
    isDown: false
};

// Resize Handler
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    player.y = height * 0.25; // Water line at 25%
    if (player.hookState === 'IDLE') player.hookY = player.y;
}
window.addEventListener('resize', resize);

// Input Listeners
const handleStart = (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    input.x = (e.clientX || e.touches[0].clientX) - rect.left;
    input.y = (e.clientY || e.touches[0].clientY) - rect.top;
    input.isDown = true;
    
    // Audio unlock
    if (!audio.initialized) audio.init();
};

const handleMove = (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    input.x = (e.clientX || e.touches[0].clientX) - rect.left;
    input.y = (e.clientY || e.touches[0].clientY) - rect.top;
};

const handleEnd = (e) => {
    e.preventDefault();
    input.isDown = false;
};

canvas.addEventListener('pointerdown', handleStart, { passive: false });
canvas.addEventListener('pointermove', handleMove, { passive: false });
canvas.addEventListener('pointerup', handleEnd, { passive: false });
canvas.addEventListener('pointercancel', handleEnd, { passive: false });

// Classes
class Fish {
    constructor() {
        this.reset();
    }

    reset() {
        this.y = player.y + 50 + Math.random() * (height - player.y - 100);
        this.depthRatio = (this.y - player.y) / (height - player.y);
        
        // Deeper = Faster & More Valuable
        this.speed = (1 + Math.random() * 2 + this.depthRatio * 3) * (Math.random() < 0.5 ? 1 : -1);
        this.x = this.speed > 0 ? -50 : width + 50;
        this.size = 10 + Math.random() * 20;
        
        // Color based on value/depth
        const hue = this.depthRatio * 360; 
        this.color = `hsl(${hue}, 70%, 60%)`;
        this.value = Math.floor(10 + this.depthRatio * 100);
        this.active = true;
    }

    update(dt) {
        this.x += this.speed * (dt / 16);
        // Offscreen check
        if ((this.speed > 0 && this.x > width + 100) || (this.speed < 0 && this.x < -100)) {
            this.active = false;
        }
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Tail
        ctx.beginPath();
        const tailDir = this.speed > 0 ? -1 : 1;
        ctx.moveTo(this.x + (this.size * 0.8 * tailDir), this.y);
        ctx.lineTo(this.x + (this.size * 1.5 * tailDir), this.y - this.size * 0.5);
        ctx.lineTo(this.x + (this.size * 1.5 * tailDir), this.y + this.size * 0.5);
        ctx.fill();

        // Eye
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x + (this.size * 0.5 * -tailDir), this.y - this.size * 0.2, this.size * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(this.x + (this.size * 0.5 * -tailDir), this.y - this.size * 0.2, this.size * 0.1, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'bubble', 'splash', 'sparkle'
        this.life = 1.0;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        if (type === 'bubble') this.vy = -Math.random() * 2;
    }

    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.02;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.type === 'bubble') {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            ctx.fillStyle = this.type === 'splash' ? '#fff' : '#FFD700';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.type === 'splash' ? 3 : 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
        this.vy = -2;
    }

    update(dt) {
        this.y += this.vy * (dt/16);
        this.life -= 0.015;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = "700 20px 'Exo 2'";
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

// Logic
function spawnFish() {
    if (Math.random() * 1000 < window.gameConfig.spawnRate) {
        // Find inactive fish or create new
        let fish = fishes.find(f => !f.active);
        if (!fish) {
            fish = new Fish();
            fishes.push(fish);
        } else {
            fish.reset();
        }
    }
}

function checkCollision(x, y) {
    for (let f of fishes) {
        if (f.active) {
            const dx = x - f.x;
            const dy = y - f.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < f.size + 5) {
                return f;
            }
        }
    }
    return null;
}

function updateGame(dt) {
    if (gameState !== 'PLAY') return;

    // Time
    timeLeft -= dt / 1000;
    if (timeLeft <= 0) {
        endGame();
        return;
    }

    // Player Movement (Boat)
    const targetX = input.x;
    player.x += (targetX - player.x) * 0.1;

    // Hook Logic
    const baseSpeed = window.gameConfig.hookSpeed;
    const speed = baseSpeed + (player.speedLvl * 2);
    const maxDepth = height * (0.3 + player.depthLvl * 0.15);

    if (player.hookState === 'IDLE') {
        player.hookY = player.y;
        player.hookX = player.x; // Follow boat
        if (input.isDown) {
            player.hookState = 'DOWN';
            player.hookX = player.x; // Lock X
        }
    } else if (player.hookState === 'DOWN') {
        player.hookY += speed * (dt / 16);
        
        // Bubble trail
        if (Math.random() < 0.2) particles.push(new Particle(player.hookX, player.hookY, 'bubble'));

        // Check Hit
        const hitFish = checkCollision(player.hookX, player.hookY);
        if (hitFish) {
                player.caughtFish = hitFish;
                hitFish.active = false; // Hide from world, attach to hook
                player.hookState = 'UP';
                audio.play('catch', 110);
                showReaction('catch', 900);
                // Haptic
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Max Depth or Release
        if (player.hookY >= maxDepth || player.hookY >= height - 20 || !input.isDown) {
            player.hookState = 'UP';
        }
    } else if (player.hookState === 'UP') {
        player.hookY -= speed * 1.5 * (dt / 16); // Reel in faster
        
        if (player.hookY <= player.y) {
            // Reached Surface
            player.hookState = 'IDLE';
            player.hookY = player.y;
            
            if (player.caughtFish) {
                // Collect Reward
                const val = player.caughtFish.value;
                score += val;
                money += val;
                floatingTexts.push(new FloatingText(player.x, player.y - 40, `+$${val}`, '#FFFF00'));
                
                // Add time bonus slightly
                timeLeft = Math.min(window.gameConfig.dayDuration, timeLeft + 2);
                floatingTexts.push(new FloatingText(player.x + 30, player.y - 60, `+2s`, '#87CEEB'));

                // Splash particles
                for(let i=0; i<10; i++) particles.push(new Particle(player.x, player.y, 'splash'));
                
                player.caughtFish = null;
            }
        }
    }

    // Fish Update
    spawnFish();
    fishes.forEach(f => { if(f.active) f.update(dt); });

    // Particles Update
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);

    // Floating Text Update
    floatingTexts.forEach(t => t.update(dt));
    floatingTexts = floatingTexts.filter(t => t.life > 0);

    // Update UI
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('timeBar').style.width = (timeLeft / window.gameConfig.dayDuration * 100) + '%';
    
    // Update Shop UI
    const speedBtn = document.getElementById('upg-speed');
    const depthBtn = document.getElementById('upg-depth');
    
    speedBtn.style.opacity = score >= player.speedCost ? "1" : "0.5";
    depthBtn.style.opacity = score >= player.depthCost ? "1" : "0.5";
    
    document.getElementById('cost-speed').innerText = `$${player.speedCost}`;
    document.getElementById('cost-depth').innerText = `$${player.depthCost}`;
}

 function draw() {
     const timePct = gameState === 'PLAY' ? 1 - (timeLeft / window.gameConfig.dayDuration) : 0;
 
     // Sky
     const gd = ctx.createLinearGradient(0, 0, 0, player.y);
     gd.addColorStop(0, '#2b215e');
     gd.addColorStop(0.45, '#6b3fa0');
     gd.addColorStop(1, '#ff9a62');
     ctx.fillStyle = gd;
     ctx.fillRect(0, 0, width, player.y);
 
     // Harbor glow
     ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
     for (let i = 0; i < width; i += 28) {
         ctx.fillRect(i, player.y - 8 - Math.sin((Date.now() * 0.002) + i * 0.05) * 4, 12, 2);
     }
 
     // Ocean
     const wd = ctx.createLinearGradient(0, player.y, 0, height);
     wd.addColorStop(0, '#0d4570');
     wd.addColorStop(0.35, '#0a3054');
     wd.addColorStop(1, '#04111f');
     ctx.fillStyle = wd;
     ctx.fillRect(0, player.y, width, height - player.y);
 
     // Sun (moves with time)
     const sunX = width * 0.1 + (width * 0.8) * timePct;
     const sunY = height * 0.1 + (timePct * timePct) * 100;
     const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 68);
     sunGlow.addColorStop(0, 'rgba(255, 236, 139, 0.95)');
     sunGlow.addColorStop(0.45, 'rgba(255, 194, 76, 0.45)');
     sunGlow.addColorStop(1, 'rgba(255, 194, 76, 0)');
     ctx.fillStyle = sunGlow;
     ctx.beginPath();
     ctx.arc(sunX, sunY, 68, 0, Math.PI * 2);
     ctx.fill();
     ctx.fillStyle = '#FFD700';
     ctx.beginPath();
     ctx.arc(sunX, sunY, 30, 0, Math.PI * 2);
     ctx.fill();

    // Fish
    fishes.forEach(f => { if(f.active) f.draw(ctx); });

    // Line
    if (player.hookState !== 'IDLE') {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y); // From Boat
        ctx.lineTo(player.hookX, player.hookY); // To Hook
        ctx.stroke();
    }

    // Hook
    ctx.fillStyle = '#C0C0C0';
    ctx.beginPath();
    ctx.arc(player.hookX || player.x, player.hookY, 4, 0, Math.PI * 2);
    ctx.fill();

    // Caught Fish on Hook
    if (player.caughtFish) {
        const cf = player.caughtFish;
        // Temporarily override position to follow hook
        const oldX = cf.x;
        const oldY = cf.y;
        cf.x = player.hookX;
        cf.y = player.hookY + 10;
        ctx.save();
        ctx.translate(cf.x, cf.y);
        ctx.rotate(Math.PI / 2); // Dangle
        ctx.translate(-cf.x, -cf.y);
        cf.draw(ctx);
        ctx.restore();
        // Restore for logic safety (though it's inactive)
        cf.x = oldX;
        cf.y = oldY;
    }

     // Boat + captain silhouette
     ctx.save();
     ctx.translate(player.x, player.y - 18);
     ctx.fillStyle = '#4d2c1d';
     ctx.beginPath();
     ctx.moveTo(-34, 0);
     ctx.quadraticCurveTo(0, 16, 34, 0);
     ctx.lineTo(24, 12);
     ctx.lineTo(-24, 12);
     ctx.closePath();
     ctx.fill();
 
     ctx.strokeStyle = 'rgba(255, 240, 170, 0.45)';
     ctx.lineWidth = 2;
     ctx.beginPath();
     ctx.moveTo(-26, 2);
     ctx.lineTo(26, 2);
     ctx.stroke();
 
     ctx.fillStyle = '#ffe27a';
     ctx.beginPath();
     ctx.arc(0, -22, 9, 0, Math.PI * 2);
     ctx.fill();
 
     ctx.fillStyle = '#152649';
     ctx.beginPath();
     ctx.arc(0, -10, 12, Math.PI, 0);
     ctx.lineTo(12, 3);
     ctx.lineTo(-12, 3);
     ctx.closePath();
     ctx.fill();
 
     ctx.fillStyle = '#fff';
     ctx.fillRect(-4, -42, 8, 24);
     ctx.fillStyle = '#ff5f7a';
     ctx.beginPath();
     ctx.moveTo(4, -42);
     ctx.lineTo(25, -33);
     ctx.lineTo(4, -24);
     ctx.fill();
     ctx.restore();

    // Particles
    particles.forEach(p => p.draw(ctx));

    // Floating Text
    floatingTexts.forEach(t => t.draw(ctx));

    // Water Surface Waves
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.beginPath();
    for(let i=0; i<=width; i+=10) {
        ctx.lineTo(i, player.y + Math.sin(i * 0.05 + Date.now() * 0.005) * 5);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
}

function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    try {
        if (gameState === 'PLAY') {
            updateGame(dt);
        }
        draw();
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(gameLoop);
}

// Game Control
const game = {
    start: () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        
        score = 0;
        money = 0;
        timeLeft = window.gameConfig.dayDuration;
        player.speedLvl = 1;
        player.depthLvl = 1;
        player.speedCost = 50;
        player.depthCost = 50;
        fishes = [];
        particles = [];
        floatingTexts = [];
        
        gameState = 'PLAY';
        audio.init();
        audio.play('ui', 0);
    },
    
    upgrade: (type) => {
        if (gameState !== 'PLAY') return;
        
        if (type === 'speed' && score >= player.speedCost) {
            score -= player.speedCost;
            player.speedLvl++;
            player.speedCost = Math.floor(player.speedCost * 1.5);
            audio.play('upgrade', 110);
            showReaction('catch', 750);
            floatingTexts.push(new FloatingText(width/2, height/2, "FASTER REEL!", "#FFF"));
        } else if (type === 'depth' && score >= player.depthCost) {
            score -= player.depthCost;
            player.depthLvl++;
            player.depthCost = Math.floor(player.depthCost * 1.5);
            audio.play('upgrade', 110);
            showReaction('catch', 750);
            floatingTexts.push(new FloatingText(width/2, height/2, "LONGER LINE!", "#FFF"));
        } else {
            audio.play('fail', 140);
            showReaction('fail', 1000);
        }
    }
};

function endGame() {
    gameState = 'GAMEOVER';
    audio.stopBgm();
    audio.play('over', 0);
    showReaction('fail', 1400);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = '$' + score;
}

// Bind Buttons
document.getElementById('start-btn').addEventListener('click', game.start);
document.getElementById('restart-btn').addEventListener('click', game.start);

// Init
document.addEventListener('DOMContentLoaded', () => {
    resize();
    requestAnimationFrame(gameLoop);
});

</script>
