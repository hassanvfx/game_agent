<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbital Core: Signal Mining</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #120f25;
            --bg-mid: #1f1a44;
            --bg-soft: #2a2558;
            --panel: rgba(18, 16, 37, 0.8);
            --panel-strong: rgba(25, 22, 56, 0.94);
            --panel-soft: rgba(37, 31, 79, 0.66);
            --ink: #f5f8ff;
            --ink-soft: #c9d3f7;
            --ink-muted: #8f9ccb;
            --cyan: #59f0ff;
            --cyan-strong: #98fbff;
            --pink: #ff72bf;
            --pink-strong: #ffc4e7;
            --gold: #ffd86a;
            --line: rgba(137, 233, 255, 0.22);
            --shadow: rgba(0, 0, 0, 0.38);
        }
        html, body { 
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(89, 240, 255, 0.12), transparent 28%),
                radial-gradient(circle at 80% 18%, rgba(255, 114, 191, 0.18), transparent 24%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--ink);
            font-family: 'Orbitron', system-ui, sans-serif; 
            user-select: none; -webkit-user-select: none; touch-action: manipulation; 
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.16) 0 2px, transparent 3px),
                radial-gradient(circle at 80% 25%, rgba(255,255,255,0.22) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 60% 70%, rgba(89,240,255,0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 35% 80%, rgba(255,114,191,0.16) 0 1.5px, transparent 2.5px);
            opacity: 0.85;
        }
        canvas { display: block; touch-action: none; }
        
        /* Visual identity: cosmic pet cockpit while preserving layout */
        .glass { 
            background: linear-gradient(180deg, rgba(244, 246, 255, 0.88), rgba(221, 233, 255, 0.72));
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); 
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 -12px 36px rgba(4, 10, 30, 0.24);
        }
        .glass-dark {
            background: linear-gradient(180deg, rgba(49, 41, 97, 0.82), rgba(25, 22, 56, 0.92));
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--line);
            color: var(--ink);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px rgba(8, 10, 26, 0.22);
        }
        .glass-galaxy {
            background:
                radial-gradient(circle at top, rgba(137, 112, 255, 0.24), transparent 50%),
                linear-gradient(180deg, rgba(23, 16, 49, 0.96), rgba(11, 9, 31, 0.98));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(153, 122, 255, 0.4);
            color: #efe7ff;
            box-shadow: 0 14px 32px rgba(11, 9, 31, 0.34);
        }
        .glass-mining {
            background:
                radial-gradient(circle at top, rgba(89, 240, 255, 0.12), transparent 42%),
                linear-gradient(180deg, rgba(16, 33, 52, 0.96), rgba(9, 19, 33, 0.98));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(89, 240, 255, 0.24);
            color: #dff9ff;
            box-shadow: 0 14px 32px rgba(2, 12, 20, 0.35);
        }
        .glass-locked {
            background: rgba(13, 14, 27, 0.45);
            border: 1px dashed rgba(201, 211, 247, 0.2);
            color: #8d95b7;
            filter: grayscale(0.4);
        }
        .glass-dev {
            background: rgba(0, 20, 0, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #00FF00;
            color: #00FF00;
            font-family: 'VT323', monospace;
        }
        .hud-chip {
            background: rgba(13, 18, 39, 0.58);
            border: 1px solid rgba(89, 240, 255, 0.22);
            color: var(--ink-soft);
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }
        .panel-title {
            font-family: 'Audiowide', system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        /* Utilities */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-press:active { transform: scale(0.95); }
        .scroll-y { touch-action: pan-y; }
        
        /* Slide Up Animation */
        .slide-enter { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .slide-active { transform: translateY(0); }
        
        /* Animations */
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 10px #B5EAD7; } 50% { box-shadow: 0 0 20px #FFB7B2; } }
        .transcend-ready { animation: pulse-glow 2s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        .float-anim { animation: float 3s ease-in-out infinite; }
        @keyframes gem-shine { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        .gem-text { animation: gem-shine 2s infinite; color: var(--cyan); }
        @keyframes nebula-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(89, 240, 255, 0.18), 0 0 22px rgba(255, 114, 191, 0.1); }
            50% { box-shadow: 0 0 0 10px rgba(89, 240, 255, 0), 0 0 30px rgba(255, 114, 191, 0.2); }
        }
        .hero-core {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.18) 18%, transparent 19%),
                radial-gradient(circle at 50% 45%, var(--pink-strong), var(--pink) 28%, #7d4dff 68%, #23173f 100%);
            box-shadow:
                inset 0 10px 24px rgba(255,255,255,0.25),
                inset 0 -18px 28px rgba(42, 15, 71, 0.4),
                0 18px 42px rgba(17, 10, 31, 0.35),
                0 0 36px rgba(89, 240, 255, 0.24);
            animation: nebula-pulse 2.8s infinite;
        }
        .hero-core::before,
        .hero-core::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }
        .hero-core::before {
            inset: 16% 16% auto auto;
            width: 28%;
            height: 28%;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.1) 70%, transparent 72%);
        }
        .hero-core::after {
            inset: auto 18% 18% 18%;
            height: 18%;
            background: radial-gradient(circle at center, rgba(89, 240, 255, 0.55), transparent 68%);
            filter: blur(6px);
        }
        
        /* Mining Animations */
        @keyframes mine-swing {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-45deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-swing { animation: mine-swing 0.15s ease-in-out; }
        
        @keyframes float-up-fade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-30px) scale(1.2); opacity: 0; }
        }
        .floater-dom { position: absolute; pointer-events: none; animation: float-up-fade 0.8s ease-out forwards; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Keypad Grid */
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .keypad-btn { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; font-weight: bold; background: rgba(255,255,255,0.1); 
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); color: white;
            transition: background 0.2s;
        }
        .keypad-btn:active { background: rgba(255,255,255,0.3); }

        .feedback-overlay {
            position: absolute;
            right: 14px;
            bottom: 92px;
            width: min(34vw, 132px);
            min-width: 88px;
            padding: 10px 10px 8px;
            border-radius: 16px;
            background: rgba(9, 12, 28, 0.72);
            border: 1px solid rgba(89, 240, 255, 0.26);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 15;
        }
        .feedback-overlay.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-overlay img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06);
        }
        .feedback-label {
            margin-top: 6px;
            font-size: 10px;
            text-align: center;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--cyan-strong);
            font-family: 'VT323', monospace;
        }
    </style>
</head>

<script>
/** 
 * § Core Architecture
 */
const CONFIG = {
    colors: {
        bg: "#120f25",
        primary: "#ff72bf",
        accent: "#59f0ff",
        text: "#eef4ff",
        galaxy: "#2D1B4E",
        glow: "#ffc4e7"
    },
    physics: { gravity: 0.5 }
};

// State
let gameState = {
    score: 0,
    pps: 0,
    clickValue: 1,
    multiplier: 1,
    
    // Prestige
    prestigePoints: 0,
    prestigeMultiplier: 1,
    autoPrestigeEnabled: false,
    autoPrestigeThreshold: 1000000,
    
    // Transcension
    transcensionPoints: 0,
    totalTranscends: 0,
    transcensionCost: 5000, 
    
    // Mining
    miningUnlocked: false,
    gems: 0,
    gps: 0, 
    miningClickVal: 1,
    totalGemClicks: 0,
    miningUpgrades: {},
    
    // Upgrade Maps
    upgrades: {}, 
    prestigeUpgrades: {},
    transcensionUpgrades: {},
    
    lastTick: 0
};

// Assets
const assets = {
    bgm: document.getElementById('bgm_main'),
    sfxClick: document.getElementById('sfx_click'),
    sfxPrestige: document.getElementById('sfx_prestige'),
    sfxMine: document.getElementById('sfx_mine'),
    sfxBuy: document.getElementById('sfx_buy'),
    sfxError: document.getElementById('sfx_error'),
    sfxSuccess: document.getElementById('sfx_success'),
    sfxMenuOpen: document.getElementById('sfx_menu_open'),
    sfxMenuClose: document.getElementById('sfx_menu_close'),
    sfxStart: document.getElementById('sfx_start'),
    feedbackOverlay: document.getElementById('feedback-overlay'),
    feedbackGif: document.getElementById('feedback-gif'),
    feedbackLabel: document.getElementById('feedback-label')
};

// Audio Manager
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const audioBuffers = {};
const audioElements = {
    click: assets.sfxClick,
    prestige: assets.sfxPrestige,
    mine: assets.sfxMine,
    buy: assets.sfxBuy,
    error: assets.sfxError,
    success: assets.sfxSuccess,
    menuOpen: assets.sfxMenuOpen,
    menuClose: assets.sfxMenuClose,
    start: assets.sfxStart
};
let audioReady = false;
let feedbackTimer = null;

function showFeedback(type = 'idle', label = 'Sync Ready') {
    if (!assets.feedbackOverlay || !assets.feedbackGif || !assets.feedbackLabel) return;
    const gifMap = {
        idle: 'https://i.giphy.com/Er5Mkg8kxNKbz2HIgl.webp',
        collect: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
        fail: 'https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp',
        reset: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp'
    };
    assets.feedbackGif.src = gifMap[type] || gifMap.idle;
    assets.feedbackLabel.innerText = label;
    assets.feedbackOverlay.classList.add('is-visible');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
        assets.feedbackOverlay.classList.remove('is-visible');
    }, type === 'idle' ? 1200 : 1600);
}

async function initAudio() {
    if (audioReady) return;
    if (!audioCtx) {
        audioReady = true;
        return;
    }
    const load = async (el, id) => {
        if (!el || !el.src) return;
        try {
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) return;
            const res = await fetch(srcUrl.href);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const buf = await res.arrayBuffer();
            audioBuffers[id] = await audioCtx.decodeAudioData(buf);
        } catch(e) { console.warn('Audio load fail', id); }
    };
    await Promise.all(Object.entries(audioElements).map(([id, el]) => load(el, id)));
    audioReady = true;
}

function playSound(type) {
    if (type === 'bgm') {
        if (!assets.bgm) return;
        assets.bgm.volume = 0.2;
        assets.bgm.play().catch(() => {});
        return;
    }
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (audioBuffers[type]) {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        const volumeMap = {
            click: 0.22,
            mine: 0.18,
            buy: 0.2,
            prestige: 0.32,
            error: 0.18,
            success: 0.24,
            menuOpen: 0.16,
            menuClose: 0.16,
            start: 0.28
        };
        gain.gain.value = volumeMap[type] ?? 0.2;
        src.buffer = audioBuffers[type];
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        // Fallback
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'click' || type === 'menuOpen' || type === 'menuClose' || type === 'start') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        } else if (type === 'mine' || type === 'buy') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        } else if (type === 'prestige') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
        } else if (type === 'buy') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        }
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

/**
 * § Game Logic
 */
function getUpgradeCost(u, count) {
    if (u.id.startsWith('t_')) return u.cost;
    if (u.id.startsWith('m_')) {
        return Math.floor(u.baseCost * Math.pow(1.8, count));
    }
    return Math.floor(u.baseCost * Math.pow(u.costMult || 1.5, count));
}

function getPrestigeUpgradeCost(u, count) {
    return Math.floor(u.baseCost * Math.pow(2, count));
}

function buyUpgrade(id) {
    const u = UPGRADES_DATA.find(x => x.id === id);
    const count = gameState.upgrades[id] || 0;
    const cost = getUpgradeCost(u, count);
    
    if (gameState.score >= cost) {
        gameState.score -= cost;
        gameState.upgrades[id] = count + 1;
        recalcStats();
        if(currentTab === 'upgrades') renderMenu('upgrades');
        playSound('buy');
        showFeedback('collect', 'Upgrade Synced');
    }
}

function buyPrestigeUpgrade(id) {
    const u = PRESTIGE_UPGRADES_DATA.find(x => x.id === id);
    const count = gameState.prestigeUpgrades[id] || 0;
    const cost = getPrestigeUpgradeCost(u, count);
    
    if (gameState.prestigePoints >= cost) {
        gameState.prestigePoints -= cost;
        gameState.prestigeUpgrades[id] = count + 1;
        if (u.type === 'auto_prestige') gameState.autoPrestigeEnabled = true;
        recalcStats();
        if(currentTab === 'prestige') renderMenu('prestige');
        playSound('buy');
        showFeedback('collect', 'Upgrade Synced');
    }
}

function buyTranscensionUpgrade(id) {
    const u = TRANSCENSION_UPGRADES_DATA.find(x => x.id === id);
    const count = gameState.transcensionUpgrades[id] || 0;
    
    if (count > 0) return;
    
    if (gameState.transcensionPoints >= u.cost) {
        gameState.transcensionPoints -= u.cost;

function buyMiningUpgrade(id) {

function recalcStats() {
    let baseClick = 1;
    let basePPS = 0;
    
    // Transcension Multipliers
    let tpPointMult = 1;
    let tpPrestigeMult = 1;
    let tpGainMult = 1;

    TRANSCENSION_UPGRADES_DATA.forEach(u => {
        if (gameState.transcensionUpgrades[u.id]) {
            if (u.type && u.type.includes('point_boost')) tpPointMult *= (u.type.includes('mega') ? 3.0 : 1.5);
            if (u.type && u.type.includes('prestige_boost')) tpPrestigeMult *= (u.type.includes('mega') ? 3.0 : 1.25);
        }
    });

    // Prestige Multipliers
    let globalMult = 1 + (gameState.prestigePoints * 0.1); 
    PRESTIGE_UPGRADES_DATA.forEach(u => {
        const count = gameState.prestigeUpgrades[u.id] || 0;
        if (count > 0 && u.type !== 'auto_prestige') {
            globalMult += count * ((PRESTIGE_UPGRADES_DATA.indexOf(u)+1) * 0.05);
        }
    });
    
    // Mining Multipliers
    let miningPointMult = 1;
    let miningPrestigeMult = 1;
    let baseGPS = 0;
    let gemMult = 1;
    let miningClickBase = 1;
    let miningClickScale = 1;

    const applyMiningUpgrade = (u) => {
        const count = gameState.miningUpgrades[u.id] || 0;
        if (count > 0) {
            if (u.type === 'gps_flat') {
                baseGPS += u.val * count;
                if (u.id === 'm_0') miningClickBase += count;
            }
            if (u.type === 'gem_boost') gemMult *= (1 + u.val * count);
            if (u.type === 'point_boost') miningPointMult *= (1 + u.val * count);
            if (u.type === 'prestige_boost') miningPrestigeMult *= (1 + u.val * count);
            if (u.type === 'special_2x') gemMult *= Math.pow(u.val, count);
            if (u.type === 'point_boost_mega') miningPointMult *= (1 + u.val * count);
            if (u.type === 'prestige_boost_mega') miningPrestigeMult *= (1 + u.val * count);
            if (u.type === 'tp_mult') tpGainMult *= Math.pow(u.val, count);
            if (u.type === 'click_scale') {
                const chunks = Math.floor((gameState.totalGemClicks || 0) / 100);
                if (chunks > 0) miningClickScale *= Math.pow(1.1, chunks);
            }
        }
    };

    MINING_UPGRADES_RIGHT.forEach(applyMiningUpgrade);
    MINING_UPGRADES_LEFT.forEach(applyMiningUpgrade);
    
    gameState.gps = baseGPS * gemMult;
    gameState.miningClickVal = miningClickBase * gemMult * miningClickScale;
    
    globalMult *= tpPointMult * miningPointMult;
    tpPrestigeMult *= miningPrestigeMult;

    UPGRADES_DATA.forEach(u => {
        const count = gameState.upgrades[u.id] || 0;
        if (count > 0) {
            if (u.type === 'click_flat') baseClick += u.baseVal * count;
            if (u.type === 'auto_flat') basePPS += u.baseVal * count;
            if (u.type === 'click_mult') baseClick *= (1 + u.baseVal * count);
        }
    });

    gameState.clickValue = baseClick * globalMult;
    gameState.pps = basePPS * globalMult;
    gameState.prestigeMultiplier = globalMult;
    gameState.tpPrestigeMult = tpPrestigeMult;
    gameState.tpGainMult = tpGainMult;
}

function doPrestige() {
    const pending = getPendingPrestige();
    if (pending <= 0) return;

    gameState.prestigePoints += pending;
    gameState.score = 0;
    gameState.upgrades = {}; 
    gameState.multiplier = 1;
    
    recalcStats();
    saveGame();
    
    playSound('prestige');
    showFeedback('reset', 'Archive Reset');
    spawnParticles(canvas.width/2, canvas.height/2, 50, '#FFD700');
    toggleMenu(false);
}

function getPendingPrestige() {
    let base = Math.floor(Math.sqrt(gameState.score / 1000));
    if (gameState.tpPrestigeMult) base = Math.floor(base * gameState.tpPrestigeMult);
    return base;
}

function doTranscend() {
    if (gameState.prestigePoints < gameState.transcensionCost) return;
    
    let gain = 1;
    TRANSCENSION_UPGRADES_DATA.forEach(u => {
        if (gameState.transcensionUpgrades[u.id] && u.type && u.type.includes('tp_boost')) {
            gain += (u.type.includes('mega') ? 3 : 1);
        }
    });
    
    if (gameState.tpGainMult) gain = Math.floor(gain * gameState.tpGainMult);
    
    gameState.transcensionPoints += gain;
    gameState.totalTranscends++;
    
    gameState.score = 0;
    gameState.prestigePoints = 0;
    gameState.upgrades = {};
    gameState.prestigeUpgrades = {};
    gameState.autoPrestigeEnabled = false;
    
    gameState.gems = 0;
    gameState.miningUpgrades = {};
    gameState.miningUnlocked = false;
    gameState.totalGemClicks = 0;
    
    recalcStats();
    saveGame();
    
    playSound('prestige');
    showFeedback('reset', 'Transcendence');
    spawnParticles(canvas.width/2, canvas.height/2, 100, '#9F7AEA');
    toggleMenu(false);
    
    document.getElementById('tp-hud').classList.remove('hidden');
}

/**
 * § Visual Engine
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let particles = [];
let floaters = [];
let mochi = { x: 0, y: 0, r: 80, scaleX: 1, scaleY: 1 };
let starfield = [];

function createStarfield() {
    const count = Math.max(40, Math.floor((window.innerWidth * window.innerHeight) / 14000));
    starfield = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.8 + 0.6,
        drift: Math.random() * 0.18 + 0.04,
        alpha: Math.random() * 0.5 + 0.2
    }));
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    mochi.x = window.innerWidth / 2;
    mochi.y = window.innerHeight * 0.35; 
    mochi.r = Math.min(window.innerWidth, window.innerHeight) * 0.18;
    createStarfield();
}

function spawnParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: color || CONFIG.colors.primary,
            size: Math.random() * 6 + 2
        });
    }
}

function spawnFloater(x, y, text) {
    floaters.push({ x: x, y: y, text: text, life: 1.0, vy: -2 });
}

function drawStarfield(now) {
    starfield.forEach((star, index) => {
        const twinkle = 0.55 + Math.sin(now * 0.0015 + index) * 0.25;
        const driftY = (star.y + now * star.drift * 0.02) % window.innerHeight;
        ctx.globalAlpha = Math.max(0.15, star.alpha * twinkle);
        ctx.fillStyle = index % 7 === 0 ? "rgba(89,240,255,0.95)" : "rgba(255,255,255,0.92)";
        ctx.beginPath();
        ctx.arc(star.x, driftY, star.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawMochi(dt) {
    const k = 0.2; const damp = 0.85;
    mochi.scaleX += (1 - mochi.scaleX) * k;
    mochi.scaleY += (1 - mochi.scaleY) * k;
    mochi.scaleX = 1 + (mochi.scaleX - 1) * damp;
    mochi.scaleY = 1 + (mochi.scaleY - 1) * damp;

    ctx.save();
    ctx.translate(mochi.x, mochi.y);
    ctx.scale(mochi.scaleX, mochi.scaleY);
    
    const r = mochi.r;
    const shell = ctx.createRadialGradient(-r * 0.15, -r * 0.25, r * 0.18, 0, 0, r);
    shell.addColorStop(0, "#ffd3ee");
    shell.addColorStop(0.35, "#ff72bf");
    shell.addColorStop(0.72, "#8f62ff");
    shell.addColorStop(1, "#1b1237");

    const aura = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.5);
    aura.addColorStop(0, "rgba(89,240,255,0.18)");
    aura.addColorStop(1, "rgba(89,240,255,0)");

    ctx.beginPath();
    ctx.arc(0, 0, r * 1.16, 0, Math.PI * 2);
    ctx.fillStyle = aura;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = shell;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = r * 0.05;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-r * 0.36, -r * 0.92, r * 0.16, r * 0.42, -0.45, 0, Math.PI * 2);
    ctx.ellipse(r * 0.36, -r * 0.92, r * 0.16, r * 0.42, 0.45, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd7ef";
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.28, r * 0.16, r * 0.11, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.62)";
    ctx.fill();

    ctx.fillStyle = "#1b1237";
    ctx.beginPath();
    ctx.arc(-r * 0.26, -r * 0.02, r * 0.09, 0, Math.PI * 2);
    ctx.arc(r * 0.26, -r * 0.02, r * 0.09, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#59f0ff";
    ctx.beginPath();
    ctx.arc(-r * 0.24, -r * 0.02, r * 0.035, 0, Math.PI * 2);
    ctx.arc(r * 0.28, -r * 0.02, r * 0.03, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 176, 218, 0.35)";
    ctx.beginPath();
    ctx.arc(-r * 0.42, r * 0.18, r * 0.12, 0, Math.PI * 2);
    ctx.arc(r * 0.42, r * 0.18, r * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#f9f7ff";
    ctx.lineWidth = r * 0.045;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.04, r * 0.14, 0.12, Math.PI - 0.12, false);
    ctx.stroke();

    ctx.fillStyle = "rgba(255,216,106,0.95)";
    for (let i = 0; i < 3; i++) {
        const angle = -Math.PI / 2 + i * 0.35 - 0.35;
        const sx = Math.cos(angle) * r * 1.22;
        const sy = Math.sin(angle) * r * 1.12;
        ctx.beginPath();
        ctx.arc(sx, sy, r * 0.06, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function gameLoop() {
    const now = performance.now();
    const dt = (now - gameState.lastTick) / 1000;
    gameState.lastTick = now;
    
    if (gameState.pps > 0) gameState.score += gameState.pps * dt;
    if (gameState.gps > 0) gameState.gems += gameState.gps * dt;
    if (gameState.autoPrestigeEnabled && gameState.score >= gameState.autoPrestigeThreshold) doPrestige();

    const autoClicker = TRANSCENSION_UPGRADES_DATA.find(u => u.type === 'auto_click');
    if (gameState.transcensionUpgrades[autoClicker.id]) {
        if (Math.random() < 5 * dt) {
            gameState.score += gameState.clickValue;
            if (Math.random() < 0.2) spawnParticles(mochi.x, mochi.y, 1, CONFIG.colors.primary);
        }
    }
    
    const autoBuyPoint = TRANSCENSION_UPGRADES_DATA.find(u => u.type === 'auto_buy_point');
    if (gameState.transcensionUpgrades[autoBuyPoint.id]) {
        if (Math.random() < 2 * dt) {
            for(let u of UPGRADES_DATA) {
                if (u.req && !gameState.transcensionUpgrades[u.req]) continue;
                const cost = getUpgradeCost(u, gameState.upgrades[u.id]||0);
                if (gameState.score >= cost) {
                    buyUpgrade(u.id);
                    break;
                }
            }
        }
    }
    
    const autoBuyPrestige = TRANSCENSION_UPGRADES_DATA.find(u => u.type === 'auto_buy_prestige');
    if (gameState.transcensionUpgrades[autoBuyPrestige.id]) {
        if (Math.random() < 2 * dt) {
            for(let u of PRESTIGE_UPGRADES_DATA) {
                if (u.req && !gameState.transcensionUpgrades[u.req]) continue;
                const cost = getPrestigeUpgradeCost(u, gameState.prestigeUpgrades[u.id]||0);
                if (gameState.prestigePoints >= cost) {
                    buyPrestigeUpgrade(u.id);
                    break;
                }
            }
        }
    }

    const bgGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    bgGrad.addColorStop(0, "#211b49");
    bgGrad.addColorStop(0.6, "#151131");
    bgGrad.addColorStop(1, "#0d0b20");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const nebulaA = ctx.createRadialGradient(window.innerWidth * 0.28, window.innerHeight * 0.22, 10, window.innerWidth * 0.28, window.innerHeight * 0.22, window.innerWidth * 0.36);
    nebulaA.addColorStop(0, "rgba(89,240,255,0.16)");
    nebulaA.addColorStop(1, "rgba(89,240,255,0)");
    ctx.fillStyle = nebulaA;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const nebulaB = ctx.createRadialGradient(window.innerWidth * 0.76, window.innerHeight * 0.16, 10, window.innerWidth * 0.76, window.innerHeight * 0.16, window.innerWidth * 0.28);
    nebulaB.addColorStop(0, "rgba(255,114,191,0.18)");
    nebulaB.addColorStop(1, "rgba(255,114,191,0)");
    ctx.fillStyle = nebulaB;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    drawStarfield(now);
    drawMochi(dt);
    
    [particles, floaters].forEach(arr => {
        for(let i=arr.length-1; i>=0; i--) {
            let p = arr[i];
            if (p.vx !== undefined) {
                p.x += p.vx; p.y += p.vy; p.vy += CONFIG.physics.gravity; p.life -= dt * 1.5;
                if(p.life <= 0) { arr.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            } else {
                p.y += p.vy; p.life -= dt;
                if(p.life <= 0) { arr.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.font = "bold 24px Orbitron";
                ctx.textAlign = "center"; ctx.fillStyle = CONFIG.colors.text;
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
        }
    });
    
    updateHUD();
    requestAnimationFrame(gameLoop);
}

function updateHUD() {
    document.getElementById('score-display').innerText = formatNumber(gameState.score);
    document.getElementById('pps-display').innerText = formatNumber(gameState.pps) + " signal / sec";
    
    if (gameState.totalTranscends > 0) {
        document.getElementById('tp-hud').classList.remove('hidden');
        document.getElementById('tp-hud').innerText = formatNumber(gameState.transcensionPoints) + " TP";
    }
    
    if (gameState.miningUnlocked || gameState.gems > 0) {
        document.getElementById('gem-hud').classList.remove('hidden');
        document.getElementById('gem-hud').innerText = formatNumber(gameState.gems) + " Cores";
    }
}

function formatNumber(num) {
    if (num < 1000) return Math.floor(num);
    const suffixes = ["k", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
    const suffixNum = Math.floor(("" + Math.floor(num)).length / 3);
    let shortValue = parseFloat((suffixNum !== 0 ? (num / Math.pow(1000, suffixNum)) : num).toPrecision(3));
    if (shortValue % 1 !== 0) shortValue = shortValue.toFixed(1);
    return shortValue + (suffixes[suffixNum - 1] || "");
}

    document.getElementById('keypad-overlay').classList.add('hidden');

    const display = document.getElementById('keypad-display');

function keypadPress(key) {
    if (key === 'C') {
        keypadInput = "";
        playSound('click');
        showFeedback('idle', 'Keypad Input');
    } else if (key === 'OK') {
        if (keypadInput === '2525') {
            playSound('success');
            showFeedback('collect', 'Vault Open');
            closeKeypad();
            renderMenu('developer');
        } else {
            playSound('error');
            showFeedback('fail', 'Code Rejected');
            keypadInput = "";
            const display = document.getElementById('keypad-display');
            display.style.color = 'red';
            setTimeout(() => display.style.color = 'white', 500);
        }
    } else {
        if (keypadInput.length < 4) {
            keypadInput += key;
            playSound('click');
            showFeedback('collect', 'Signal Boost');
        showFeedback('idle', 'Keypad Input');
        }
    }
    updateKeypadDisplay();
}

// Event Bindings
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', () => {
    resize();
    
    canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const dx = x - mochi.x;
        const dy = y - mochi.y;
        if (Math.sqrt(dx*dx + dy*dy) < mochi.r * 1.2) {
            gameState.score += gameState.clickValue;
            mochi.scaleX = 1.2; mochi.scaleY = 0.8;
            spawnParticles(x, y, 8, CONFIG.colors.primary);
            spawnFloater(x, y - 50, "+" + formatNumber(gameState.clickValue));
            playSound('click');
        }
    }, { passive: false });
    
    document.getElementById('menu-btn').onclick = () => toggleMenu(true);
    document.getElementById('close-menu-btn').onclick = () => toggleMenu(false);
    document.getElementById('tab-upgrades').onclick = () => renderMenu('upgrades');
    document.getElementById('tab-prestige').onclick = () => renderMenu('prestige');
    
    document.getElementById('start-btn').onclick = async () => {
        await initAudio();
        playSound('start');
        playSound('bgm');
        showFeedback('idle', 'Signal Live');
        document.getElementById('start-screen').classList.add('hidden');
        gameState.lastTick = performance.now();
        requestAnimationFrame(gameLoop);
    };
});

// Save System
function saveGame() { localStorage.setItem('orbitalCoreSignalMining', JSON.stringify(gameState)); }
setInterval(saveGame, 10000);
try {
    const saved = localStorage.getItem('orbitalCoreSignalMining');
    if (saved) {
        const parsed = JSON.parse(saved);
        gameState = { ...gameState, ...parsed };
        ['upgrades', 'prestigeUpgrades', 'transcensionUpgrades', 'miningUpgrades'].forEach(k => {
            if(!gameState[k]) gameState[k] = {};
        });
        recalcStats();
    }
} catch(e) {}

</script>
