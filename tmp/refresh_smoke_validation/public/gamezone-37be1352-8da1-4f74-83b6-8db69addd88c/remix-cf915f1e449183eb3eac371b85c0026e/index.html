<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Courier Run</title>
    <!-- [agent-note][stage4] repaired: catalog-font-remap | roles: titles -> Orbitron, ui/body -> Rajdhani, terminal accent -> VT323 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=VT323&display=swap">
    <style>
        :root {
            --bg-top: #070b1f;
            --bg-bottom: #101a3f;
            --panel-bg: rgba(11, 16, 41, 0.78);
            --panel-border: rgba(111, 240, 255, 0.42);
            --panel-shadow: 0 20px 48px rgba(0, 0, 0, 0.46);
            --cyan: #6ff0ff;
            --cyan-strong: #20d8ff;
            --magenta: #ff5bbd;
            --violet: #8a6bff;
            --gold: #ffd66b;
            --lime: #7dff98;
            --danger: #ff6f7f;
            --text: #f5fbff;
            --muted: #b5c5f3;
            --shadow-dark: rgba(3, 7, 20, 0.8);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(111, 240, 255, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        }

        body {
            touch-action: auto;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            border: 0;
            margin: 0;
            font: inherit;
            color: inherit;
            background: none;
            cursor: pointer;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .w-full { width: 100%; }
        .h-full { width: 100%; height: 100%; }
        .select-none { user-select: none; }
        .hidden { display: none !important; }
        .group { position: relative; }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
        }

        .screen-card {
            position: relative;
            width: min(100%, 430px);
            margin-inline: auto;
            padding: 22px 18px;
            border-radius: 28px;
            pointer-events: auto;
            overflow: hidden;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 29, 70, 0.92), rgba(7, 11, 27, 0.88));
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .glass-panel::before,
        .glass-panel::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        .glass-panel::before {
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-panel::after {
            top: 10px;
            left: 18px;
            right: 18px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            opacity: 0.35;
        }

        .headline {
            margin: 0 0 8px;
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 0.95;
            letter-spacing: 0.08em;
            color: #fff3b0;
            text-shadow:
                0 0 18px rgba(255, 214, 107, 0.22),
                0 4px 0 rgba(16, 16, 35, 0.9);
        }

        .subline {
            margin: 0 0 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .subline strong {
            color: var(--gold);
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }

        .char-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-height: 108px;
            padding: 12px 10px;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .char-btn:hover { transform: translateY(-2px); }

        .char-btn.selected {
            border-color: var(--gold);
            box-shadow:
                0 0 0 1px rgba(255, 214, 107, 0.35),
                0 0 24px rgba(255, 214, 107, 0.18);
        }

        .char-btn.locked {
            opacity: 0.58;
            filter: grayscale(0.85);
            cursor: not-allowed;
        }

        .char-avatar {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.22), 0 0 14px rgba(0,0,0,0.24);
        }

        .char-avatar::after {
            content: "";
            position: absolute;
            inset: 7px 9px auto;
            height: 9px;
            border-radius: 999px;
            background: rgba(255,255,255,0.2);
        }

        .char-avatar.round { border-radius: 999px; }
        .char-noob { background: linear-gradient(180deg, #ffe86d, #f7bf1f); border: 2px solid #151515; }
        .char-pro { background: linear-gradient(180deg, #56c4ff, #2f64ff); border: 2px solid #e4f7ff; }
        .char-hacker {
            background: linear-gradient(180deg, #02170f, #000000);
            border: 2px solid #59ff8c;
            color: #59ff8c;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            letter-spacing: 0.12em;
        }
        .char-prime {
            background: radial-gradient(circle at 35% 30%, #ff8f9f, #c20f4f 70%);
            border: 2px solid var(--gold);
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.22), 0 0 16px rgba(255, 91, 189, 0.45);
        }

        .char-name {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text);
        }

        .char-meta {
            font-size: 0.64rem;
            line-height: 1.2;
            color: #ff9eb7;
            text-align: center;
        }

        .char-meta.unlocked {
            color: var(--lime);
        }

        .start-btn,
        .action-btn {
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            border-radius: 18px;
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: 1.02rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
            box-shadow: 0 10px 22px rgba(0,0,0,0.24);
        }

        .start-btn:hover,
        .action-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .start-btn:active,
        .action-btn:active {
            transform: scale(0.98);
        }

        .start-btn {
            background: linear-gradient(90deg, #6dff9f, #24c7ff);
            color: #061222;
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff7b7b, #ff5bbd);
            color: #1a0a17;
        }

        .btn-gold {
            background: linear-gradient(90deg, #ffe47b, #ffb547);
            color: #2b1804;
        }

        .event-icon {
            font-size: 3.2rem;
            line-height: 1;
            margin: 10px 0 12px;
            filter: drop-shadow(0 0 16px rgba(111, 240, 255, 0.2));
        }

        .event-title {
            margin: 0 0 8px;
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(1.8rem, 7vw, 2.8rem);
            line-height: 0.95;
            letter-spacing: 0.08em;
        }

        .event-copy {
            margin: 0 0 18px;
            font-size: 0.96rem;
            line-height: 1.5;
            color: var(--muted);
        }

        .rick-spin { animation: spin 2s linear infinite; }
        .rainbow-text { animation: rainbow 2s linear infinite; }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(5, 10, 25, 0.58);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .status-chip.route { color: var(--cyan); }
        .status-chip.score { color: var(--gold); }

        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .screen-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .tiny-note {
            margin-top: 10px;
            font-size: 0.68rem;
            line-height: 1.4;
            color: rgba(181, 197, 243, 0.84);
        }

        .feedback-gif {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: clamp(88px, 24vw, 122px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 14px 28px rgba(0,0,0,0.28);
            opacity: 0.9;
            pointer-events: none;
        }

        .feedback-gif.fail {
            width: clamp(96px, 26vw, 132px);
            filter: saturate(1.08) hue-rotate(-6deg);
        }

        .feedback-gif.win {
            width: clamp(92px, 25vw, 128px);
            filter: saturate(1.08) drop-shadow(0 0 14px rgba(255, 214, 107, 0.24));
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rainbow {
            0% { color: #ff5f7a; }
            20% { color: #ffd66b; }
            40% { color: #7dff98; }
            60% { color: #6ff0ff; }
            80% { color: #8a6bff; }
            100% { color: #ff5bbd; }
        }

        @media (max-width: 640px) {
            .ui-layer { padding: 12px; }
            .screen-card { padding: 18px 14px; border-radius: 24px; }
            .character-grid { gap: 8px; }
            .char-btn { min-height: 100px; padding: 10px 8px; }
            .char-avatar { width: 40px; height: 40px; }
            .hud {
                top: 12px;
                left: 12px;
                right: 12px;
                gap: 8px;
            }
            .status-chip {
                padding: 8px 12px;
                font-size: 0.66rem;
            }
            .feedback-gif {
                right: 10px;
                bottom: 10px;
                width: 88px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full select-none">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="ui-layer" class="ui-layer">

            <div id="start-screen" class="glass-panel screen-card screen-stack">
                <h1 class="headline">NEON COURIER</h1>
                <p class="subline">Route sync: <strong><span id="win-count">0</span>/100</strong> deliveries toward PRIME clearance.</p>

                <div class="character-grid">
                    <button class="char-btn selected" onclick="selectChar('noob')">
                        <div class="char-avatar char-noob"></div>
                        <span class="char-name">Rookie</span>
                    </button>
                    <button class="char-btn" onclick="selectChar('pro')">
                        <div class="char-avatar char-pro"></div>
                        <span class="char-name">Pilot</span>
                    </button>
                    <button class="char-btn" onclick="selectChar('hacker')">
                        <div class="char-avatar char-hacker">101</div>
                        <span class="char-name">Ghost</span>
                    </button>
                    <button id="john-btn" class="char-btn locked" onclick="selectChar('john')">
                        <div class="char-avatar char-prime round"></div>
                        <span class="char-name">Prime</span>
                        <span class="char-meta">(100 Deliveries)</span>
                    </button>
                </div>

                <button id="start-btn" class="start-btn">Start Run</button>
                <p class="tiny-note">Tap, click, or press space to jump. Auto-run mechanics stay unchanged.</p>
            </div>

            <div id="game-over-screen" class="hidden glass-panel screen-card screen-stack">
                <h2 class="event-title">SIGNAL LOST</h2>
                <div class="event-icon rick-spin">📡</div>
                <p class="event-copy rainbow-text">The courier dropped the package.</p>
                <!-- [agent-note][stage3] resolved-gif: fail-feedback -> catalogs/gifs.json funny animal fail reaction -->
                <img
                    class="feedback-gif fail"
                    src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.gif"
                    alt="Fail reaction feedback"
                    loading="lazy"
                    decoding="async"
                >
                <button id="restart-btn" class="action-btn btn-danger">Retry Route</button>
            </div>

            <div id="victory-screen" class="hidden glass-panel screen-card screen-stack">
                <h2 class="event-title" style="color: var(--gold);">DELIVERED!</h2>
                <div class="event-icon">📦</div>
                <p class="event-copy">+1 delivery logged into the city relay.</p>
                <!-- [agent-note][stage3] resolved-gif: win-feedback -> catalogs/gifs.json character dance emote celebration -->
                <img
                    class="feedback-gif win"
                    src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.gif"
                    alt="Victory celebration feedback"
                    loading="lazy"
                    decoding="async"
                >
                <button id="next-level-btn" class="action-btn btn-gold">Next Delivery</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="status-chip route">Route Progress</div>
                <div class="status-chip score">Deliveries: <span id="hud-wins">0</span></div>
            </div>
        </div>
    </div>

    <script>
    // --- GLOBAL VARIABLES & CONFIG ---
    let wins = parseInt(localStorage.getItem('obbyWins')) || 0;
    // wins = 99; localStorage.setItem('obbyWins', wins);

    let selectedCharId = 'noob';

    const CHARACTERS = {
        'noob': { color: '#facc15', type: 'rect', border: '#000', accent: '#ffe86d' },
        'pro': { color: '#3b82f6', type: 'rect', border: '#fff', accent: '#6ff0ff' },
        'hacker': { color: '#000000', type: 'rect', border: '#22c55e', text: '101', accent: '#59ff8c' },
        'john': { color: '#dc2626', type: 'circle', border: '#fcd34d', glow: true, accent: '#ff86af' }
    };

    document.getElementById('win-count').innerText = wins;
    document.getElementById('hud-wins').innerText = wins;

    if (wins >= 100) {
        const johnBtn = document.getElementById('john-btn');
        johnBtn.classList.remove('locked');
        johnBtn.querySelector('.char-meta').innerText = "UNLOCKED!";
        johnBtn.querySelector('.char-meta').classList.add('unlocked');
    }

    window.selectChar = (id) => {
        if (id === 'john' && wins < 100) return;
        selectedCharId = id;
        document.querySelectorAll('.char-btn').forEach(btn => btn.classList.remove('selected'));
        const btns = document.querySelectorAll('.char-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('onclick').includes(id)) btn.classList.add('selected');
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
            jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3",
            land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
            win: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
            locked: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
            unlock: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
            uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
        };

        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';

                this.sfx = {};
                this.lastPlayed = {};
                this.cooldowns = {
                    jump: 100,
                    land: 90,
                    locked: 180,
                    uiClick: 70
                };

                [
                    ['start', ASSETS.start, 0.55],
                    ['jump', ASSETS.jump, 0.42],
                    ['land', ASSETS.land, 0.28],
                    ['win', ASSETS.win, 0.5],
                    ['fail', ASSETS.fail, 0.5],
                    ['locked', ASSETS.locked, 0.45],
                    ['unlock', ASSETS.unlock, 0.46],
                    ['uiClick', ASSETS.uiClick, 0.34]
                ].forEach(([key, src, volume]) => {
                    const audio = new Audio(src);
                    audio.preload = 'auto';
                    audio.volume = volume;
                    this.sfx[key] = audio;
                });
            }

            enable() {
                this.enabled = true;
            }

            safePlay(audio, reset = false) {
                if (!this.enabled || !audio) return;
                try {
                    if (reset) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                    const promise = audio.play();
                    if (promise && typeof promise.catch === 'function') {
                        promise.catch(() => {});
                    }
                } catch (_) {}
            }

            playBGM() {
                this.enable();
                this.safePlay(this.bgm, false);
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const cooldown = this.cooldowns[key] || 0;
                if (cooldown && now - (this.lastPlayed[key] || 0) < cooldown) return;
                this.lastPlayed[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.preload = 'auto';
                this.safePlay(clone, true);
            }
        }

        const audio = new AudioController();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let prevGrounded = false;
        let unlockCuePlayed = wins >= 100;

        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const SPEED = 5;

        let player = { x: 100, y: 0, w: 40, h: 40, vy: 0, grounded: false };
        let platforms = [];
        let cameraX = 0;
        let levelLength = 2000;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function createLevel() {
            platforms = [];
            let currentX = 0;
            let currentY = height - 150;

            platforms.push({ x: 0, y: height - 100, w: 300, h: 100, type: 'start' });
            currentX = 300;

            const numPlatforms = 20 + Math.min(wins, 10);

            for (let i = 0; i < numPlatforms; i++) {
                const gap = 80 + Math.random() * 100;
                const w = 80 + Math.random() * 100;
                const yChange = (Math.random() - 0.5) * 150;

                currentX += gap;
                currentY += yChange;

                if (currentY > height - 100) currentY = height - 100;
                if (currentY < 200) currentY = 200;

                platforms.push({ x: currentX, y: currentY, w: w, h: 50, type: 'normal' });
            }

            currentX += 150;
            platforms.push({ x: currentX, y: currentY, w: 200, h: 50, type: 'finish' });
            levelLength = currentX + 200;
        }

        function initGame() {
            player.x = 50;
            player.y = height - 300;
            player.vy = 0;
            player.grounded = false;
            prevGrounded = false;
            cameraX = 0;
            createLevel();
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function getPlatformPalette(p) {
            if (p.type === 'finish') {
                return { face: '#6dff9f', edge: '#1c8a57', glow: 'rgba(109,255,159,0.32)' };
            }
            if (p.type === 'start') {
                return { face: '#6f87ff', edge: '#2a3a89', glow: 'rgba(111,135,255,0.22)' };
            }
            const hue = (p.x * 0.08) % 360;
            return {
                face: `hsl(${hue}, 82%, 64%)`,
                edge: `hsl(${hue}, 72%, 34%)`,
                glow: `hsla(${hue}, 90%, 68%, 0.18)`
            };
        }

        function update() {
            if (!gameActive) return;

            prevGrounded = player.grounded;

            player.vy += GRAVITY;
            player.y += player.vy;
            player.x += SPEED;

            player.grounded = false;
            for (let p of platforms) {
                if (player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h > p.y && player.y + player.h < p.y + p.h + 20 &&
                    player.vy >= 0) {
                        player.grounded = true;
                        player.vy = 0;
                        player.y = p.y - player.h;

                        if (!prevGrounded) {
                            audio.playSFX('land');
                        }

                        if (p.type === 'finish') {
                            doWin();
                        }
                }
            }

            cameraX = player.x - 100;

            if (player.y > height) {
                doGameOver();
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function drawSkyline() {
            ctx.save();
            ctx.fillStyle = 'rgba(8, 14, 34, 0.58)';
            for (let i = 0; i < 9; i++) {
                const towerWidth = 70 + (i % 3) * 18;
                const towerHeight = 120 + (i % 4) * 60;
                const x = ((i * 180) - cameraX * 0.22) % (width + 240);
                const drawX = x < -120 ? x + width + 240 : x;
                const y = height - towerHeight - 70;
                ctx.fillRect(drawX, y, towerWidth, towerHeight);
                ctx.fillStyle = 'rgba(111, 240, 255, 0.18)';
                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < 3; col++) {
                        ctx.fillRect(drawX + 10 + col * 16, y + 12 + row * 18, 7, 10);
                    }
                }
                ctx.fillStyle = 'rgba(8, 14, 34, 0.58)';
            }
            ctx.restore();
        }

        function drawCourier(playerX, playerY, char) {
            const bob = Math.sin(Date.now() * 0.012) * 1.5;
            const px = playerX;
            const py = playerY + bob;

            ctx.save();

            if (char.glow) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = char.color;
            }

            ctx.fillStyle = char.color;
            ctx.strokeStyle = char.border;
            ctx.lineWidth = 3;

            if (char.type === 'circle') {
                ctx.beginPath();
                ctx.arc(px + player.w / 2, py + player.h / 2, player.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.roundRect(px, py, player.w, player.h, 10);
                ctx.fill();
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = char.accent;
            ctx.fillRect(px + 8, py + player.h - 11, player.w - 16, 5);

            ctx.fillStyle = selectedCharId === 'hacker' ? '#59ff8c' : '#f8fbff';
            ctx.fillRect(px + 9, py + 11, 8, 8);
            ctx.fillRect(px + 23, py + 11, 8, 8);

            ctx.fillStyle = '#08101f';
            ctx.fillRect(px + 12, py + 14, 2, 3);
            ctx.fillRect(px + 26, py + 14, 2, 3);

            ctx.strokeStyle = '#08101f';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(px + player.w / 2, py + 25, 7, 0.15, Math.PI - 0.15);
            ctx.stroke();

            if (selectedCharId === 'hacker') {
                ctx.fillStyle = '#59ff8c';
                ctx.font = '18px VT323';
                ctx.fillText('101', px + 8, py + 34);
            }

            ctx.fillStyle = 'rgba(111, 240, 255, 0.28)';
            ctx.beginPath();
            ctx.ellipse(px + player.w / 2, py + player.h + 8, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#070b1f');
            bgGradient.addColorStop(0.55, '#101a3f');
            bgGradient.addColorStop(1, '#1c2550');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(111, 240, 255, 0.12)';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(width * (0.2 + i * 0.24), 80 + i * 18, 28 + i * 10, 0, Math.PI * 2);
                ctx.fill();
            }

            drawSkyline();

            ctx.save();
            for (let i = 0; i < 50; i++) {
                let px = (i * 100 - cameraX * 0.5) % width;
                if (px < 0) px += width;
                let py = (i * 137) % height;
                const size = (i % 3) + 1;
                ctx.fillStyle = i % 5 === 0 ? 'rgba(255, 214, 107, 0.72)' : 'rgba(255,255,255,0.35)';
                ctx.fillRect(px, py, size, size);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (let p of platforms) {
                const palette = getPlatformPalette(p);

                ctx.shadowBlur = 20;
                ctx.shadowColor = palette.glow;
                ctx.fillStyle = palette.glow;
                ctx.fillRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(2, 6, 20, 0.38)';
                ctx.fillRect(p.x + 8, p.y + 8, p.w, p.h);

                const faceGradient = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
                faceGradient.addColorStop(0, '#ffffff');
                faceGradient.addColorStop(0.02, palette.face);
                faceGradient.addColorStop(1, palette.edge);
                ctx.fillStyle = faceGradient;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 12);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(p.x + 10, p.y + 8, Math.max(0, p.w - 20), 8);

                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
            }

            drawCourier(player.x, player.y, CHARACTERS[selectedCharId]);

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function gameLoop() {
            if (gameActive) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        function maybeUnlockPrimeCue() {
            if (wins >= 100 && !unlockCuePlayed) {
                unlockCuePlayed = true;
                const johnBtn = document.getElementById('john-btn');
                johnBtn.classList.remove('locked');
                johnBtn.querySelector('.char-meta').innerText = "UNLOCKED!";
                johnBtn.querySelector('.char-meta').classList.add('unlocked');
                audio.playSFX('unlock');
            }
        }

        function doWin() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('win');

            wins++;
            localStorage.setItem('obbyWins', wins);
            document.getElementById('win-count').innerText = wins;
            document.getElementById('hud-wins').innerText = wins;

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');

            maybeUnlockPrimeCue();

            if (wins === 100) {
                alert("PRIME COURIER UNLOCKED!");
            }
        }

        function doGameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function jump() {
            if (gameActive && player.grounded) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
                audio.playSFX('jump');
                spawnParticles(player.x + player.w / 2, player.y + player.h, '#6ff0ff');
            }
        }

        window.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && gameActive) {
                e.preventDefault();
                jump();
            }
        });

        // [agent-note][stage4] repaired: mobile-tap-actionability | action: scoped gameplay touch suppression to canvas so menu buttons keep native tap/click behavior
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            jump();
        }, { passive: false });

        canvas.addEventListener('mousedown', () => {
            if (gameActive) jump();
        });

        document.querySelectorAll('.char-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                audio.enable();
                if (btn.classList.contains('locked')) {
                    audio.playSFX('locked');
                } else {
                    audio.playSFX('uiClick');
                }
            });
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.enable();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.enable();
            audio.playSFX('uiClick');
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            audio.enable();
            audio.playSFX('uiClick');
            audio.playBGM();
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
