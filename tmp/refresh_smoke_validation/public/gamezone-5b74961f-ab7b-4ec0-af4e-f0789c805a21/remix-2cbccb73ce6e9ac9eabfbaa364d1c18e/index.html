<script>
/** 
 * §2 SYSTEM INVARIANTS (L0)
 * Single Source: All state in `game` object.
 * Readiness: `initGame` runs immediately.
 * Loop Resilience: `update` wrapped in try-catch.
 * Unidirectional State: BOOT -> PLAYING -> GAMEOVER.
 */

// --- CONFIG & STATE ---
const CONFIG = {
    colors: {
        player: '#00ff41', // Matrix Green
        enemy: '#ff0055',  // Cyber Red
        minionP: '#88ffaa',
        minionE: '#ff88aa',
        lane: '#1a1a1a',
        text: ['DATA', 'BREACH', 'SURGE', 'LOCKED', 'CLEAR', 'CHAIN', 'PING', 'OVERLOAD', 'DOWN', 'SPIKE']
    },
    laneWidthRatio: 0.85
};

let gameConfig = {};
let canvas, ctx, cw, ch;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let audioCtx = null;

// Game State Object
const game = {
    hero: null,
    enemyHero: null,
    towers: [],
    minions: [],
    projectiles: [],
    particles: [],
    texts: [],
    score: 0,
    level: 1,
    spawnTimer: 0,
    camShake: 0,
    pointer: { x: 0, y: 0, down: false }
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    bgm: null,
    unlocked: false,
    lastPlayAt: {},
    clips: {},
    volumes: {
        bgm: 0.2,
        shoot: 0.34,
        hit: 0.38,
        coin: 0.42,
        explode: 0.46,
        win: 0.52,
        fail: 0.5
    },
    
    init() {
        this.bgm = document.getElementById('bgm_battle');
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        try {
            this.ctx = new AudioContext();
        } catch (_) {
            this.ctx = null;
        }
        this.clips = {
            shoot: document.getElementById('sfx_shoot'),
            hit: document.getElementById('sfx_hit'),
            coin: document.getElementById('sfx_collect'),
            explode: document.getElementById('sfx_explode'),
            win: document.getElementById('sfx_win'),
            fail: document.getElementById('sfx_fail')
        };
        if (this.bgm) this.bgm.volume = this.volumes.bgm;
        Object.entries(this.clips).forEach(([key, audio]) => {
            if (audio) audio.volume = this.volumes[key] ?? 0.4;
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) this.pauseLoop();
            else if (this.unlocked && gameState === 'PLAYING') this.startLoop();
        });
    },

    unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        this.ctx?.resume?.().catch(() => {});
        this.startLoop();
    },

    startLoop() {
        if (!this.bgm) return;
        this.bgm.play().catch(() => {});
    },

    pauseLoop() {
        this.bgm?.pause?.();
    },

    stopLoop(reset = false) {
        if (!this.bgm) return;
        this.bgm.pause();
        if (reset) this.bgm.currentTime = 0;
    },

    playClip(type, minGap = 80) {
        const audio = this.clips[type];
        if (!audio) return;
        const now = performance.now();
        if ((this.lastPlayAt[type] || 0) + minGap > now) return;
        this.lastPlayAt[type] = now;
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    },

    sfx(type) {
        if (!this.unlocked) return;
        if (type === 'hit') this.playClip('hit', 55);
        if (type === 'shoot') this.playClip('shoot', 70);
        if (type === 'coin') this.playClip('coin', 120);
        if (type === 'explode') this.playClip('explode', 180);
        if (type === 'win') this.playClip('win', 400);
        if (type === 'fail') this.playClip('fail', 400);
    }
};

const Vibe = {
    trigger(style) {
        if (window.webkit?.messageHandlers?.gamezoneBridge) {
            window.webkit.messageHandlers.gamezoneBridge.postMessage({
                action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style }
            });
        } else if (navigator.vibrate) {
            navigator.vibrate(style === 'heavy' ? 200 : 50);
        }
    }
};

// --- ENTITIES ---
class Entity {
    constructor(x, y, r, team, hp) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.team = team; // 0 = player, 1 = enemy
        this.maxHp = hp;
        this.hp = hp;
        this.dead = false;
        this.color = team === 0 ? CONFIG.colors.player : CONFIG.colors.enemy;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0, this.r), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // HP Bar
        const hpPct = this.hp / this.maxHp;
        ctx.fillStyle = '#333';
        ctx.fillRect(this.x - this.r, this.y - this.r - 8, this.r * 2, 4);
        ctx.fillStyle = hpPct > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(this.x - this.r, this.y - this.r - 8, this.r * 2 * hpPct, 4);
    }
}

class Hero extends Entity {
    constructor(x, y, team) {
        super(x, y, cw * 0.05, team, 500);
        this.range = cw * 0.35;
        this.dmg = 25 * gameConfig.damageScale;
        this.cd = 0;
        this.cdMax = 0.5;
        this.speed = gameConfig.heroSpeed * (cw / 100); // Scale with screen
    }
    update(dt) {
        if (this.team === 0) {
            // Player Control
            if (game.pointer.down) {
                const dx = game.pointer.x - this.x;
                const dy = game.pointer.y - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 5) {
                    const move = Math.min(dist, this.speed * 60 * dt);
                    this.x += (dx / dist) * move;
                    this.y += (dy / dist) * move;
                }
            }
        } else {
            // Enemy AI
            // Move towards nearest enemy or tower
            let target = getNearestTarget(this);
            if (target) {
                const dist = Math.hypot(target.x - this.x, target.y - this.y);
                if (dist > this.range * 0.8) {
                    const angle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.x += Math.cos(angle) * this.speed * 40 * dt;
                    this.y += Math.sin(angle) * this.speed * 40 * dt;
                }
            }
        }

        // Clamp to lane
        const laneW = cw * CONFIG.laneWidthRatio;
        const laneX = (cw - laneW) / 2;
        this.x = Math.max(laneX + this.r, Math.min(cw - laneX - this.r, this.x));
        this.y = Math.max(this.r, Math.min(ch - this.r, this.y));

        // Attack
        this.cd -= dt;
        if (this.cd <= 0) {
            const target = getNearestTarget(this);
            if (target && Math.hypot(target.x - this.x, target.y - this.y) < this.range) {
                shoot(this, target);
                this.cd = this.cdMax;
            }
        }
    }
    draw(ctx) {
        super.draw(ctx);
        // Hero Marker
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (this.team === 0) ctx.rect(this.x - this.r/2, this.y - this.r/2, this.r, this.r);
        else {
            ctx.moveTo(this.x, this.y - this.r/2);
            ctx.lineTo(this.x + this.r/2, this.y + this.r/2);
            ctx.lineTo(this.x - this.r/2, this.y + this.r/2);
            ctx.closePath();
        }
        ctx.stroke();
    }
}

class Minion extends Entity {
    constructor(x, y, team) {
        super(x, y, cw * 0.025, team, 60);
        this.speed = (cw * 0.15); // pixels per sec
        this.dmg = 5 * gameConfig.damageScale;
        this.range = cw * 0.15;
        this.cd = 0;
    }
    update(dt) {
        // Simple lane logic: Move forward until enemy in range
        const fwd = this.team === 0 ? -1 : 1;
        let target = getNearestTarget(this);
        let moving = true;

        if (target) {
            const dist = Math.hypot(target.x - this.x, target.y - this.y);
            if (dist < this.range) {
                moving = false;
                this.cd -= dt;
                if (this.cd <= 0) {
                    shoot(this, target);
                    this.cd = 1.0;
                }
            }
        }

        if (moving) {
            this.y += this.speed * fwd * dt;
        }
        
        // Bounds cleanup
        if (this.y < -50 || this.y > ch + 50) this.dead = true;
    }
}

class Tower extends Entity {
    constructor(x, y, team) {
        super(x, y, cw * 0.08, team, 2000);
        this.range = cw * 0.4;
        this.dmg = 40 * gameConfig.damageScale;
        this.cd = 0;
    }
    update(dt) {
        this.cd -= dt;
        if (this.cd <= 0) {
            const target = getNearestTarget(this);
            if (target && Math.hypot(target.x - this.x, target.y - this.y) < this.range) {
                shoot(this, target);
                this.cd = 0.8;
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.fillRect(-this.r, -this.r, this.r*2, this.r*2);
        ctx.restore();
        
        // HP Bar static
        const hpPct = this.hp / this.maxHp;
        ctx.fillStyle = '#333';
        ctx.fillRect(this.x - this.r, this.y - this.r - 15, this.r * 2, 6);
        ctx.fillStyle = hpPct > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(this.x - this.r, this.y - this.r - 15, this.r * 2 * hpPct, 6);
    }
}

class Projectile {
    constructor(x, y, target, dmg, color) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.dmg = dmg;
        this.color = color;
        this.speed = cw * 1.2;
        this.dead = false;
        this.r = 4;
    }
    update(dt) {
        if (this.target.dead) {
            this.dead = true;
            return;
        }
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist < 10) {
            this.target.hp -= this.dmg;
            this.dead = true;
            spawnParticle(this.target.x, this.target.y, this.color, 5);
            AudioSys.sfx('hit');
            showFeedbackGif('impact-gif', 480);
            if (this.target.hp <= 0) killEntity(this.target);
        } else {
            const move = this.speed * dt;
            this.x += (dx / dist) * move;
            this.y += (dy / dist) * move;
        }
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color, type = 'spark') {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * cw * 0.3;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = 2.0 + Math.random();
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= this.decay * dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class TextFloater {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1.0;
        this.vy = -cw * 0.1;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = `bold ${cw*0.06}px Audiowide`;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

// --- LOGIC ---

function getNearestTarget(source) {
    // Find enemy team entities
    const enemyTeam = source.team === 0 ? 1 : 0;
    let candidates = [];
    
    // Check hero
    const enemyHero = enemyTeam === 1 ? game.enemyHero : game.hero;
    if (enemyHero && !enemyHero.dead) candidates.push(enemyHero);
    
    // Check towers
    game.towers.forEach(t => { if (t.team === enemyTeam && !t.dead) candidates.push(t); });
    
    // Check minions
    game.minions.forEach(m => { if (m.team === enemyTeam && !m.dead) candidates.push(m); });
    
    let nearest = null;
    let minDst = Infinity;
    
    candidates.forEach(c => {
        const d = Math.hypot(c.x - source.x, c.y - source.y);
        if (d < minDst) {
            minDst = d;
            nearest = c;
        }
    });
    
    // Only return if within reasonable search range (lane length)
    if (minDst < ch * 0.6) return nearest;
    return null;
}

function shoot(source, target) {
    game.projectiles.push(new Projectile(source.x, source.y, target, source.dmg, source.color));
    AudioSys.sfx('shoot');
}

function spawnParticle(x, y, color, count) {
    for(let i=0; i<count; i++) {
        game.particles.push(new Particle(x, y, color));
    }
}

function spawnText(x, y, text, color) {
    game.texts.push(new TextFloater(x, y, text, color));
}

function killEntity(ent) {
    ent.dead = true;
    spawnParticle(ent.x, ent.y, ent.color, 20);
    AudioSys.sfx('explode');
    
        // Combat feedback text
    const word = CONFIG.colors.text[Math.floor(Math.random() * CONFIG.colors.text.length)];
    spawnText(ent.x, ent.y, word, '#fff');

    if (ent instanceof Tower) {
        game.camShake = 20;
        Vibe.trigger('heavy');
        if (ent.team === 1) endGame(true); // Player wins
        else endGame(false); // Player loses
    } else if (ent instanceof Hero) {
        game.camShake = 10;
        Vibe.trigger('medium');
        spawnText(ent.x, ent.y - 30, "DOWN", '#ff0');
        // Respawn logic could go here, but for simplicity let's say death is bad
        if (ent.team === 0) {
            // Player death penalty? Just wait to respawn
            setTimeout(() => {
                game.hero.x = cw/2; 
                game.hero.y = ch - cw*0.2; 
                game.hero.hp = game.hero.maxHp; 
                game.hero.dead = false;
            }, 3000);
        } else {
            setTimeout(() => {
                game.enemyHero.x = cw/2;
                game.enemyHero.y = cw*0.2;
                game.enemyHero.hp = game.enemyHero.maxHp;
                game.enemyHero.dead = false;
            }, 3000);
        }
    } else if (ent instanceof Minion) {
        if (ent.team === 1) {
            game.score += 10;
            updateHUD();
            Vibe.trigger('light');
            AudioSys.sfx('coin');
        }
    }
}

function updateHUD() {
    document.getElementById('score-val').innerText = game.score;
    // Update enemy tower HP bar
    const enemyTower = game.towers.find(t => t.team === 1);
    if (enemyTower) {
        const pct = Math.max(0, (enemyTower.hp / enemyTower.maxHp) * 100);
        document.getElementById('enemy-tower-hp').style.width = pct + '%';
    }
}

function showFeedbackGif(id, duration = 900) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(el._hideTimer);
    el.classList.add('show');
    el._hideTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function endGame(win) {
    if (gameState === 'GAMEOVER') return;
    gameState = 'GAMEOVER';
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');
    const screen = document.getElementById('game-over-screen');
    const resultGif = document.getElementById('result-gif');
    
    AudioSys.stopLoop();
    if (win) {
        title.innerText = "MISSION CLEAR";
        title.className = "text-6xl font-bold mb-2 text-green-400 neon-text";
        desc.innerText = "THE RIVAL CORE HAS COLLAPSED";
        if (resultGif) resultGif.src = 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp';
        AudioSys.sfx('win');
    } else {
        title.innerText = "SYSTEM FAILURE";
        title.className = "text-6xl font-bold mb-2 text-red-500 neon-text";
        desc.innerText = "YOUR CORE WAS OVERRUN";
        if (resultGif) resultGif.src = 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
        AudioSys.sfx('fail');
    }
    showFeedbackGif('result-gif', 2600);
    document.getElementById('final-score').innerText = game.score;
    screen.classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

// --- CORE LIFECYCLE ---

function initGame() {
    // Parse config
    const cfg = document.getElementById('game-config').text;
    try {
        const p = JSON.parse(cfg);
        gameConfig = {
            heroSpeed: p.heroSpeed.value,
            spawnRate: p.spawnRate.value,
            damageScale: p.damageScale.value
        };
    } catch(e) {
        gameConfig = { heroSpeed: 6, spawnRate: 2.5, damageScale: 1 };
    }

    // Reset State
    game.score = 0;
    game.towers = [];
    game.minions = [];
    game.projectiles = [];
    game.particles = [];
    game.texts = [];
    game.camShake = 0;
    
    // Create Entities
    // Towers
    game.towers.push(new Tower(cw/2, ch - cw*0.15, 0)); // Player Base
    game.towers.push(new Tower(cw/2, cw*0.15, 1));      // Enemy Base
    
    // Heroes
    game.hero = new Hero(cw/2, ch - cw*0.3, 0);
    game.enemyHero = new Hero(cw/2, cw*0.3, 1);
    
    game.spawnTimer = 0;
    
    updateHUD();
}

function setState(state) {
    gameState = state;
    if (state === 'PLAYING') {
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        if (AudioSys.unlocked) AudioSys.startLoop();
    } else if (state === 'GAMEOVER') {
        AudioSys.pauseLoop();
    }
}

function restartGame() {
    initGame();
    setState('PLAYING');
}

function resize() {
    cw = document.body.clientWidth;
    ch = document.body.clientHeight;
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    
    if (gameState === 'BOOT') {
        initGame();
        setState('PLAYING');
        requestAnimationFrame(loop);
    }
}

function handleInput(e) {
    e.preventDefault();
    if (!AudioSys.unlocked) AudioSys.unlock();
    
    if (gameState === 'GAMEOVER') {
        // Handled by button, but global click can also trigger if desired? 
        // Spec says button calls handleGlobalInput.
        return; 
    }
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    game.pointer.x = x;
    game.pointer.y = y;
    
    if (e.type === 'pointerdown') game.pointer.down = true;
    if (e.type === 'pointerup' || e.type === 'pointercancel') game.pointer.down = false;
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    try {
        if (gameState === 'PLAYING') {
            // Spawning
            game.spawnTimer -= dt;
            if (game.spawnTimer <= 0) {
                game.spawnTimer = gameConfig.spawnRate;
                game.minions.push(new Minion(cw/2 + (Math.random()*40-20), ch - cw*0.2, 0)); // Player minion
                game.minions.push(new Minion(cw/2 + (Math.random()*40-20), cw*0.2, 1));      // Enemy minion
            }

            // Updates
            if (!game.hero.dead) game.hero.update(dt);
            if (!game.enemyHero.dead) game.enemyHero.update(dt);
            
            game.towers.forEach(t => t.update(dt));
            game.minions.forEach(m => m.update(dt));
            game.projectiles.forEach(p => p.update(dt));
            game.particles.forEach(p => p.update(dt));
            game.texts.forEach(t => t.update(dt));

            // Cleanup
            game.minions = game.minions.filter(m => !m.dead);
            game.projectiles = game.projectiles.filter(p => !p.dead);
            game.particles = game.particles.filter(p => p.life > 0);
            game.texts = game.texts.filter(t => t.life > 0);
            game.towers = game.towers.filter(t => !t.dead);
            
            // Camera Shake Decay
            if (game.camShake > 0) game.camShake *= 0.9;
            if (game.camShake < 0.5) game.camShake = 0;
        }

        // Draw
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, cw, ch);
        
        ctx.save();
        // Shake
        if (game.camShake > 0) {
            ctx.translate((Math.random()-0.5)*game.camShake, (Math.random()-0.5)*game.camShake);
        }

        // Draw Lane
        const laneW = cw * CONFIG.laneWidthRatio;
        const laneX = (cw - laneW) / 2;
        
        // Grid floor
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=0; i<ch; i+=50) {
            ctx.moveTo(laneX, i);
            ctx.lineTo(cw - laneX, i);
        }
        ctx.stroke();
        
        // Lane Borders
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ff41';
        ctx.beginPath();
        ctx.moveTo(laneX, 0); ctx.lineTo(laneX, ch);
        ctx.moveTo(cw - laneX, 0); ctx.lineTo(cw - laneX, ch);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw Entities
        game.towers.forEach(t => t.draw(ctx));
        game.minions.forEach(m => m.draw(ctx));
        if (!game.hero.dead) game.hero.draw(ctx);
        if (!game.enemyHero.dead) game.enemyHero.draw(ctx);
        game.projectiles.forEach(p => p.draw(ctx));
        
        // FX
        ctx.globalCompositeOperation = 'lighter';
        game.particles.forEach(p => p.draw(ctx));
        game.texts.forEach(t => t.draw(ctx));
        ctx.globalCompositeOperation = 'source-over';

        ctx.restore();

    } catch (e) {
        console.error(e);
    }
    
    requestAnimationFrame(loop);
}

// --- BOOTSTRAP ---
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    AudioSys.init();
    
    // Config Defs
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').text);
    
    // Bind Inputs
    window.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('pointermove', handleInput, { passive: false });
    window.addEventListener('pointerup', handleInput, { passive: false });
    window.addEventListener('pointercancel', handleInput, { passive: false });
    
    const restartBtn = document.getElementById('restart-btn');
    if (restartBtn) restartBtn.addEventListener('click', (e) => {
        handleInput(e); // Unlock audio
        AudioSys.sfx('shoot');
        restartGame();
    });

    resize();
    window.addEventListener('resize', resize);
});

</script>
