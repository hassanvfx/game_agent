<script>
// §3 Editable Configuration
const gameConfigDefs = {
    heroSpeed: { type: "number", label: "Walk Speed", value: 4, min: 2, max: 10 },
    botCount: { type: "number", label: "Crowd Size", value: 12, min: 5, max: 50 },
    playerName: { type: "text", label: "Guest Name", value: "Guest" }
};
const gameConfig = {};
Object.keys(gameConfigDefs).forEach(k => gameConfig[k] = gameConfigDefs[k].value);

window.updateGameConfig = (key, val) => {
    if (gameConfigDefs[key]) {
        const def = gameConfigDefs[key];
        if (def.type === 'number') val = Math.max(def.min, Math.min(def.max, val));
        if (def.type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
        gameConfig[key] = val;
    }
};

// §2 Technical Core
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let dpr = 1;

function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('DOMContentLoaded', resize);

// Audio System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {};
let audioUnlocked = false;

function loadSound(id, fallbackType) {
    const el = document.getElementById(id);
    if (!el) return Promise.resolve();
    const src = el.src;
    return fetch(src)
        .then(r => r.arrayBuffer())
        .then(b => audioCtx.decodeAudioData(b))
        .then(d => sounds[id] = d)
        .catch(() => sounds[id] = fallbackType);
}

function playFallbackTone(type = 'beep', volume = 0.04) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    if (type === 'soft') {
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(760, audioCtx.currentTime + 0.14);
    } else if (type === 'bright') {
        osc.frequency.setValueAtTime(920, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.09);
    } else {
        osc.frequency.setValueAtTime(680, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(420, audioCtx.currentTime + 0.1);
    }
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.16);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.16);
}

function playSound(id, options = {}) {
    const { volume = 0.32, fallbackType = 'beep' } = options;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    const buffer = sounds[id];
    if (buffer && typeof buffer !== 'string') {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = buffer;
        gain.gain.value = volume;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
    } else {
        playFallbackTone(buffer === 'soft' || buffer === 'bright' ? buffer : fallbackType, Math.max(0.025, volume * 0.16));
    }
}

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    ['bgm_town', 'sfx_chat', 'sfx_join', 'sfx_swap', 'sfx_emote'].forEach(id => {
        const fallback = id === 'bgm_town' ? 'soft' : id === 'sfx_swap' ? 'bright' : 'beep';
        loadSound(id, fallback);
    });
}

function playBGM() {
    const el = document.getElementById('bgm_town');
    if (!el) return;
    el.volume = 0.2;
    el.play().catch(() => {});
}

function syncBGMPlayback() {
    const el = document.getElementById('bgm_town');
    if (!el) return;
    if (document.hidden || !isPlaying) {
        el.pause();
    } else if (audioUnlocked) {
        playBGM();
    }
}

function pulseGif(id, duration = 1800) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// Game State
let lastTime = 0;
let isPlaying = false;
let entities = [];
let particles = [];
let camera = { x: 0, y: 0 };
let joystick = { active: false, origin: {x:0, y:0}, current: {x:0, y:0}, vec: {x:0, y:0} };

// Classes
const CLASSES = [
    { name: "Coral", color: "#fab1a0" },
    { name: "Sunset", color: "#ff7675" },
    { name: "Sky", color: "#74b9ff" },
    { name: "Mint", color: "#55efc4" }
];

const BOT_NAMES = ["Alex", "Sarah", "Dr_Disrespect", "Ninja", "Kratos", "Zelda", "NoobMaster69", "Gandalf", "Guest_88", "CatLover", "Dev_Null", "Glitch"];
const BOT_PHRASES = [
    "Meet at the center circle!", "Anyone up for selfies?", "lol", "Love this plaza vibe.",
    "Where is everyone hanging out?", "Nice color!", "brb snacks", "lag?", "Hey everyone!",
    "Wave if you can see me!", "Follow me", "gg", "uwu", "Wait for me!"
];

class Entity {
    constructor(x, y, isPlayer = false) {
        this.x = x;
        this.y = y;
        this.isPlayer = isPlayer;
        this.radius = 12;
        this.color = isPlayer ? getComputedStyle(document.documentElement).getPropertyValue('--player-core').trim() || "#73e7ff" : CLASSES[Math.floor(Math.random() * CLASSES.length)].color;
        this.name = isPlayer ? gameConfig.playerName : BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
        this.targetX = x;
        this.targetY = y;
        this.speed = isPlayer ? gameConfig.heroSpeed : 2 + Math.random() * 2;
        this.state = 'idle'; // idle, walk
        this.stateTimer = Math.random() * 2000;
        this.chatMsg = null;
        this.chatTimer = 0;
        this.emote = null;
        this.emoteTimer = 0;
        this.jobIdx = 0;
    }

    update(dt) {
        // Chat timer
        if (this.chatTimer > 0) this.chatTimer -= dt;
        if (this.emoteTimer > 0) this.emoteTimer -= dt;

        if (this.isPlayer) {
            // Player Input
            if (joystick.active) {
                this.x += joystick.vec.x * gameConfig.heroSpeed * (dt/16);
                this.y += joystick.vec.y * gameConfig.heroSpeed * (dt/16);
                
                // Dust particles
                if (Math.random() < 0.1) spawnDust(this.x, this.y);
            }
        } else {
            // Bot AI
            this.stateTimer -= dt;
            if (this.stateTimer <= 0) {
                this.stateTimer = 1000 + Math.random() * 3000;
                if (Math.random() < 0.6) {
                    this.state = 'walk';
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 50 + Math.random() * 150;
                    this.targetX = this.x + Math.cos(angle) * dist;
                    this.targetY = this.y + Math.sin(angle) * dist;
                    // Keep in bounds
                    this.targetX = Math.max(-400, Math.min(400, this.targetX));
                    this.targetY = Math.max(-400, Math.min(400, this.targetY));
                } else {
                    this.state = 'idle';
                    // Random Chat
                    if (Math.random() < 0.1) {
                        this.say(BOT_PHRASES[Math.floor(Math.random() * BOT_PHRASES.length)]);
                    }
                }
            }

            if (this.state === 'walk') {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 5) {
                    this.state = 'idle';
                } else {
                    this.x += (dx/dist) * this.speed * (dt/16);
                    this.y += (dy/dist) * this.speed * (dt/16);
                    if (Math.random() < 0.05) spawnDust(this.x, this.y);
                }
            }
        }
    }

    draw(ctx) {
        // Shadow
        ctx.fillStyle = this.isPlayer ? "rgba(12, 22, 58, 0.42)" : "rgba(0,0,0,0.2)";
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 10, this.radius + (this.isPlayer ? 4 : 1), this.radius * 0.42, 0, 0, Math.PI*2);
        ctx.fill();

        if (this.isPlayer) {
            const halo = ctx.createRadialGradient(this.x, this.y, 4, this.x, this.y, this.radius + 16);
            halo.addColorStop(0, "rgba(115,231,255,0.22)");
            halo.addColorStop(1, "rgba(115,231,255,0)");
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 16, 0, Math.PI*2);
            ctx.fill();
        }

        // Body
        const bodyGradient = ctx.createLinearGradient(this.x, this.y - this.radius, this.x, this.y + this.radius);
        bodyGradient.addColorStop(0, this.isPlayer ? "#c6f6ff" : "#ffffff");
        bodyGradient.addColorStop(0.45, this.color);
        bodyGradient.addColorStop(1, this.isPlayer ? "#7669ff" : this.color);
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + (this.isPlayer ? 2 : 0), 0, Math.PI*2);
        ctx.fill();

        // Face trim / outline
        ctx.strokeStyle = this.isPlayer ? "rgba(255,121,200,0.82)" : "rgba(12,24,48,0.18)";
        ctx.lineWidth = this.isPlayer ? 3 : 2;
        ctx.stroke();

        // Highlight
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.beginPath();
        ctx.arc(this.x - 4, this.y - 4, 4, 0, Math.PI*2);
        ctx.fill();

        // Name
        ctx.fillStyle = this.isPlayer ? "#fff7d0" : "#e6f0ff";
        ctx.font = "600 11px 'Exo 2'";
        ctx.textAlign = "center";
        ctx.fillText(this.name, this.x, this.y - 20);

        // Emote
        if (this.emoteTimer > 0) {
            ctx.font = "20px 'Exo 2'";
            ctx.fillText(this.emote, this.x, this.y - 35);
        }

        // Chat Bubble
        if (this.chatTimer > 0) {
            this.drawBubble(ctx);
        }
    }

    drawBubble(ctx) {
        ctx.font = "600 12px 'Exo 2'";
        const width = ctx.measureText(this.chatMsg).width + 16;
        const height = 24;
        const bx = this.x - width/2;
        const by = this.y - 50;

        // Bubble bg
        ctx.fillStyle = "rgba(10, 18, 40, 0.92)";
        ctx.beginPath();
        ctx.roundRect(bx, by, width, height, 8);
        ctx.fill();
        ctx.strokeStyle = "rgba(115,231,255,0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Tail
        ctx.beginPath();
        ctx.moveTo(this.x, by + height);
        ctx.lineTo(this.x - 5, by + height + 5);
        ctx.lineTo(this.x + 5, by + height);
        ctx.fill();

        // Text
        ctx.fillStyle = "#eff6ff";
        ctx.fillText(this.chatMsg, this.x, by + 16);
    }

    say(msg) {
        this.chatMsg = msg;
        this.chatTimer = 3000;
        playSound('sfx_chat', { volume: 0.22, fallbackType: 'soft' });
        pulseGif('gif-chat', 1800);
        addLog(this.name, msg);
    }
}

function spawnDust(x, y) {
    particles.push({
        x: x, y: y + 10,
        vx: (Math.random() - 0.5) * 1,
        vy: (Math.random() - 0.5) * 1,
        life: 1.0,
        size: Math.random() * 4 + 2
    });
}

// Chat System
function addLog(name, msg) {
    const box = document.getElementById('chat-box');
    const line = document.createElement('div');
    line.innerHTML = `<span class="font-bold" style="color:${name === gameConfig.playerName ? '#73e7ff' : '#ffe27a'}">${name}:</span> ${msg}`;
    box.insertBefore(line, box.firstChild);
    if (box.children.length > 20) box.removeChild(box.lastChild);
}

// Initialization
function initGame() {
    entities = [];
    // Player
    entities.push(new Entity(0, 0, true));
    
    // Bots
    for (let i = 0; i < gameConfig.botCount; i++) {
        const x = (Math.random() - 0.5) * 600;
        const y = (Math.random() - 0.5) * 600;
        entities.push(new Entity(x, y));
    }
    
    document.getElementById('online-count').innerText = entities.length;
}

// Input Handling
const jZone = document.getElementById('joystick-zone');
const jRect = jZone.getBoundingClientRect();
const jCenter = { x: jRect.left + jRect.width/2, y: jRect.top + jRect.height/2 };

// Virtual Joystick Logic
// We attach listeners to the zone for start, but window for move/end to prevent drag loss
jZone.addEventListener('pointerdown', e => {
    e.preventDefault();
    joystick.active = true;
    joystick.origin = { x: e.clientX, y: e.clientY };
    joystick.current = { x: e.clientX, y: e.clientY };
    joystick.vec = { x: 0, y: 0 };
    jZone.setPointerCapture(e.pointerId);
});

jZone.addEventListener('pointermove', e => {
    if (!joystick.active) return;
    e.preventDefault();
    const maxDist = 40;
    let dx = e.clientX - joystick.origin.x;
    let dy = e.clientY - joystick.origin.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > maxDist) {
        dx = (dx/dist) * maxDist;
        dy = (dy/dist) * maxDist;
    }
    
    joystick.current = { x: joystick.origin.x + dx, y: joystick.origin.y + dy };
    joystick.vec = { x: dx/maxDist, y: dy/maxDist };
});

function endJoystick(e) {
    joystick.active = false;
    joystick.vec = { x: 0, y: 0 };
}
jZone.addEventListener('pointerup', endJoystick);
jZone.addEventListener('pointercancel', endJoystick);

// UI Buttons
function getPlayerEntity() {
    return entities.find(entity => entity.isPlayer) || null;
}

function submitChat() {
    const input = document.getElementById('chat-input');
    const player = getPlayerEntity();
    if (!player) return;
    const msg = input.value.trim();
    if (msg) {
        player.say(msg);
        input.value = '';
    }
}

document.getElementById('send-btn').addEventListener('click', submitChat);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        submitChat();
    }
});

document.getElementById('class-btn').addEventListener('click', () => {
    const p = getPlayerEntity();
    if (!p) return;
    p.jobIdx = (p.jobIdx + 1) % CLASSES.length;
    p.color = CLASSES[p.jobIdx].color;
    addLog("Host", `Changed color to ${CLASSES[p.jobIdx].name}`);
    playSound('sfx_swap', { volume: 0.26, fallbackType: 'bright' });
    pulseGif('gif-celebrate', 1600);
});

document.querySelectorAll('.emote-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const p = getPlayerEntity();
        if (!p) return;
        p.emote = btn.dataset.emote;
        p.emoteTimer = 2000;
        playSound('sfx_emote', { volume: 0.24, fallbackType: 'soft' });
        pulseGif('gif-celebrate', 2200);
        for(let i=0; i<5; i++) spawnDust(p.x, p.y);
    });
});

// Game Loop
function gameLoop(time) {
    if (!isPlaying) return;
    const dt = time - lastTime;
    lastTime = time;

    // Update
    entities.forEach(e => e.update(dt));
    
    // Sort by Y for depth
    entities.sort((a, b) => a.y - b.y);

    // Camera follow player
    const player = entities.find(e => e.isPlayer);
    if (player) {
        // Smooth camera
        camera.x += (player.x - camera.x) * 0.1;
        camera.y += (player.y - camera.y) * 0.1;
    }

    // Render
    const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / dpr);
    bgGradient.addColorStop(0, "#382670");
    bgGradient.addColorStop(0.55, "#1a2753");
    bgGradient.addColorStop(1, "#091224");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

    // Grid floor
    ctx.save();
    const cx = canvas.width/2/dpr;
    const cy = canvas.height/2/dpr;
    
    ctx.translate(cx - camera.x, cy - camera.y);

    // Draw grid
    ctx.strokeStyle = "rgba(115,231,255,0.14)";
    ctx.lineWidth = 1.5;
    const gridSize = 50;
    const startX = Math.floor((camera.x - cx) / gridSize) * gridSize;
    const startY = Math.floor((camera.y - cy) / gridSize) * gridSize;
    
    for (let x = startX; x < startX + canvas.width/dpr + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, camera.y - cy);
        ctx.lineTo(x, camera.y + cy + canvas.height/dpr);
        ctx.stroke();
    }
    for (let y = startY; y < startY + canvas.height/dpr + gridSize; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(camera.x - cx, y);
        ctx.lineTo(camera.x + cx + canvas.width/dpr, y);
        ctx.stroke();
    }

    // Town Square Center
    const plazaGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);
    plazaGlow.addColorStop(0, "rgba(255, 226, 122, 0.28)");
    plazaGlow.addColorStop(0.45, "rgba(115, 231, 255, 0.18)");
    plazaGlow.addColorStop(1, "rgba(115, 231, 255, 0.02)");
    ctx.fillStyle = plazaGlow;
    ctx.beginPath();
    ctx.arc(0, 0, 100, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,121,200,0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 76, 0, Math.PI*2);
    ctx.stroke();

    // Entities
    entities.forEach(e => e.draw(ctx));

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        ctx.fillStyle = `rgba(115,231,255,${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    }

    ctx.restore();

    // Joystick Debug Draw
    if (joystick.active) {
        const jX = joystick.origin.x;
        const jY = joystick.origin.y;
        const cX = joystick.current.x;
        const cY = joystick.current.y;

        // Convert to canvas coords
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0); // Reset for UI overlay
        
        // Base
        ctx.beginPath();
        ctx.arc(jX * dpr, jY * dpr, 40 * dpr, 0, Math.PI*2);
        ctx.fillStyle = "rgba(115,231,255,0.22)";
        ctx.fill();
        
        // Stick
        ctx.beginPath();
        ctx.arc(cX * dpr, cY * dpr, 20 * dpr, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fill();
        
        ctx.restore();
    }

    requestAnimationFrame(gameLoop);
}

// Start sequence
document.getElementById('start-btn').addEventListener('click', () => {
    unlockAudio();
    playSound('sfx_join', { volume: 0.3, fallbackType: 'bright' });

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('pointer-events-none');

    initGame();
    isPlaying = true;
    playBGM();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

document.addEventListener('visibilitychange', syncBGMPlayback);
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

</script>
