<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Courier Rush</title>
    <!-- [agent-note][stage3] resolved-font: title->Audiowide, ui->Exo 2, accent->Press Start 2P from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #04030d;
            --bg-mid: #0d1230;
            --panel-bg: rgba(10, 16, 37, 0.82);
            --panel-border: rgba(77, 214, 255, 0.35);
            --accent-cyan: #6cf4ff;
            --accent-blue: #5b87ff;
            --accent-pink: #ff4d8d;
            --accent-gold: #ffd96b;
            --text-main: #f7fbff;
            --text-soft: #b4c4ea;
            --text-dim: #7890c0;
            --shadow-glow: 0 0 24px rgba(108, 244, 255, 0.16);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(91, 135, 255, 0.22), transparent 38%),
                radial-gradient(circle at 80% 20%, rgba(255, 77, 141, 0.12), transparent 22%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 66%);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            color: var(--text-main);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(18, 29, 63, 0.96), rgba(6, 12, 28, 0.88)),
                rgba(5, 5, 16, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                var(--shadow-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.1), transparent 26%),
                repeating-linear-gradient(
                    90deg,
                    rgba(108, 244, 255, 0.05) 0 2px,
                    transparent 2px 16px
                );
            pointer-events: none;
            opacity: 0.72;
        }

        .glass > * {
            position: relative;
            z-index: 1;
        }

        .neon-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(108, 244, 255, 0.9);
        }

        .neon-red {
            color: var(--accent-pink);
            text-shadow: 0 0 10px rgba(255, 77, 141, 0.85);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.36rem 0.8rem;
            margin-bottom: 0.9rem;
            border: 1px solid rgba(255, 217, 107, 0.4);
            border-radius: 999px;
            background: rgba(255, 217, 107, 0.08);
            color: var(--accent-gold);
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 0 16px rgba(255, 217, 107, 0.12);
            font-family: 'Press Start 2P', system-ui, sans-serif;
            line-height: 1.5;
        }

        .ui-btn {
            background: linear-gradient(135deg, #143cff, #091128 72%);
            border: 2px solid var(--accent-cyan);
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
            clip-path: polygon(8% 0, 100% 0, 100% 78%, 92% 100%, 0 100%, 0 22%);
            cursor: pointer;
            width: 100%;
            padding: 0.95rem 1.25rem;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Audiowide', system-ui, sans-serif;
            box-shadow:
                0 0 20px rgba(91, 135, 255, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .ui-btn:active {
            transform: scale(0.96);
            filter: brightness(1.06);
            box-shadow: 0 0 14px rgba(108, 244, 255, 0.38);
        }

        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18));
            background-size: 100% 4px;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            opacity: 0.52;
            mix-blend-mode: screen;
        }

        .city-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background:
                linear-gradient(180deg, transparent 0%, transparent 60%, rgba(91, 135, 255, 0.12) 100%),
                radial-gradient(circle at 50% 120%, rgba(108, 244, 255, 0.22), transparent 40%);
        }

        .city-glow::before,
        .city-glow::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 96px;
            height: 90px;
            opacity: 0.34;
            background-repeat: repeat-x;
            background-size: 140px 90px;
            filter: drop-shadow(0 0 8px rgba(108, 244, 255, 0.16));
        }

        .city-glow::before {
            background-image:
                linear-gradient(90deg,
                    transparent 0 8%,
                    rgba(108, 244, 255, 0.18) 8% 14%,
                    transparent 14% 22%,
                    rgba(255, 77, 141, 0.16) 22% 28%,
                    transparent 28% 42%,
                    rgba(91, 135, 255, 0.2) 42% 52%,
                    transparent 52% 64%,
                    rgba(108, 244, 255, 0.18) 64% 72%,
                    transparent 72% 100%);
            transform: scaleY(0.9);
        }

        .city-glow::after {
            bottom: 72px;
            height: 40px;
            background-image:
                repeating-linear-gradient(
                    90deg,
                    rgba(108, 244, 255, 0.2) 0 2px,
                    transparent 2px 18px,
                    rgba(255, 77, 141, 0.16) 18px 20px,
                    transparent 20px 34px

            opacity: 0.2;
        }

        .hud-chip {
            background: rgba(7, 15, 35, 0.72);
            border: 1px solid rgba(108, 244, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
            padding: 0.45rem 0.7rem;
            border-radius: 0.7rem;
        }

        .status-copy {
            color: var(--text-soft);
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .text-center { text-align: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .z-50 { z-index: 50; }
        .bg-black { background: #000; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .ml-2 { margin-left: 0.5rem; }
        .max-w-md { max-width: 28rem; }
        .w-4\/5 { width: 80%; }
        .text-white { color: #fff; }
        .text-gray-300 { color: var(--text-soft); }
        .text-gray-400 { color: var(--text-dim); }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-5xl { font-size: 3rem; }
        .text-6xl { font-size: 3.75rem; }
        .font-bold { font-weight: 700; }
        .italic { font-style: italic; }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-widest { letter-spacing: 0.2em; }
        .transform { transform: translateZ(0); }
        .scale-95 { transform: scale(0.95); }
        .scale-100 { transform: scale(1); }
        .opacity-0 { opacity: 0; }
        .opacity-100 { opacity: 1; }
        .transition-all { transition-property: all; }
        .duration-300 { transition-duration: 300ms; }

        .feedback-gif {
            position: absolute;
            right: 0.85rem;
            bottom: 6rem;
            width: min(28vw, 120px);
            border-radius: 1rem;
            border: 1px solid rgba(108, 244, 255, 0.32);
            box-shadow: 0 0 20px rgba(108, 244, 255, 0.18);
            background: rgba(4, 7, 20, 0.68);
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 220ms ease, transform 220ms ease;
            pointer-events: none;
            z-index: 32;
            overflow: hidden;
        }

        .feedback-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-gif-label {
            padding: 0.32rem 0.45rem 0.45rem;
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(7, 15, 35, 0.16), rgba(7, 15, 35, 0.82));
            font-family: 'Press Start 2P', system-ui, sans-serif;
            line-height: 1.5;
        }

        .feedback-gif.fail {
            right: auto;
            left: 0.85rem;
            border-color: rgba(255, 77, 141, 0.38);
            box-shadow: 0 0 20px rgba(255, 77, 141, 0.2);
        }

        @media (max-width: 640px) {
            .p-8 { padding: 1.3rem; }
            .text-6xl { font-size: 2.45rem; }
            .text-5xl { font-size: 2.1rem; }
            .text-4xl { font-size: 1.7rem; }
            .text-3xl { font-size: 1.35rem; }
            .text-2xl { font-size: 1.06rem; }
            .text-xl { font-size: 0.95rem; }

            .ui-btn {
                padding: 0.88rem 1rem;
                font-size: 0.94rem;
            }

            .hero-badge {
                font-size: 0.72rem;
                letter-spacing: 0.16em;
            }

            .status-copy {
                font-size: 0.82rem;
            }

            .hud-chip {
                padding: 0.35rem 0.52rem;
            }

            .feedback-gif {
                width: min(31vw, 92px);
                bottom: 5.1rem;
            }

            .feedback-gif.fail {
                left: 0.6rem;
            }
        }
    </style>
</head>

<script id="game-config" type="application/x-game-config">

<script>
/**
 * NEON COURIER RUSH - Core Logic
 */

// --- Configuration ---
window.gameConfigDefs = {
    "baseSpeed": { "type": "number", "label": "Base Speed", "value": 12, "min": 5, "max": 25 },
    "jumpForce": { "type": "number", "label": "Jump Force", "value": 18, "min": 10, "max": 30 },
    "gravity": { "type": "number", "label": "Gravity", "value": 0.9, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Neon Color", "value": "#00f0ff" }
};

window.gameConfig = {
    baseSpeed: 12,
    jumpForce: 18,
    gravity: 0.9,
    themeColor: "#00f0ff"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
    }
};

// --- Audio System ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.isMuted = false;
        this.lastPlayedAt = {};
        this.soundVolumes = {
            bgm_main: 0.2,
            sfx_collect: 0.4,
            sfx_jump: 0.28,
            sfx_land: 0.22,
            sfx_die: 0.48
        };
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    async loadSound(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el || !el.src || !this.ctx) return;

        try {
            const res = await fetch(el.src);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn(`Audio load failed for ${id}, using fallback.`);
            this.buffers[id] = fallbackType;
            const el = document.getElementById(id);
            if (el) {
                el.dataset.loadFailed = 'true';
            }
        }
    }

    preload(ids) {
        ids.forEach(({ id, fallback }) => this.loadSound(id, fallback));
    }

    playBgm() {
        if (!this.ctx) return;
        this.ctx.resume().catch(() => {});
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = this.soundVolumes.bgm_main;
            el.currentTime = 0;
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id, cooldown = 0) {
        if (!this.ctx || this.ctx.state === 'suspended') return;

        const now = performance.now();
        if (cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) {
            return;
        }
        this.lastPlayedAt[id] = now;

        const buffer = this.buffers[id];
        const el = document.getElementById(id);
        if (buffer && typeof buffer !== 'string') {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = this.soundVolumes[id] ?? 0.3;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
        } else if (el && el.dataset.loadFailed === 'true') {
            const fallbackEl = el.cloneNode();
            fallbackEl.volume = this.soundVolumes[id] ?? 0.3;
            fallbackEl.play().catch(() => {
                this.synthesize(buffer || 'beep', this.soundVolumes[id] ?? 0.3);
            });
        } else {
            this.synthesize(buffer || 'beep', this.soundVolumes[id] ?? 0.3);
        }
    }

    synthesize(type, volume = 0.3) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.28);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.28);
        } else if (type === 'land') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(240, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

const audio = new AudioManager();

// --- Game Engine ---
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('score-display');
    const finalScoreDisplay = document.getElementById('final-score');
    const speedDisplay = document.getElementById('speed-display');
    const collectGif = document.getElementById('collect-gif');
    const failGif = document.getElementById('fail-gif');

    // State
    let gameState = 'MENU';
    let score = 0;
    let frames = 0;
    let gameSpeed = 0;
    let distance = 0;

    // Entities
    let player = {
        x: 100,
        y: 0,
        width: 40,
        height: 60,
        vy: 0,
        grounded: false,
        jumpCount: 0,
        angle: 0
    };

    let obstacles = [];
    let particles = [];
    let cameraShake = 0;
    let lastGroundedState = false;
    let gifTimers = {};

    // Constants
    const GROUND_HEIGHT = 100;
    
    // Resize Handler
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Input Handling
    function showGifFeedback(type) {
        const target = type === 'fail' ? failGif : collectGif;
        if (!target) return;
        target.classList.add('visible');
        clearTimeout(gifTimers[type]);
        gifTimers[type] = setTimeout(() => {
            target.classList.remove('visible');
        }, type === 'fail' ? 1600 : 1100);
    }

    function handleInput(e) {
        if (e.type !== 'keydown') e.preventDefault();

        if (gameState === 'MENU') {
            startGame();
            return;
        }

        if (gameState === 'GAMEOVER') {
            if (frames > 30) resetGame();
            return;
        }

        if (gameState === 'PLAYING') {
            if (player.grounded) {
                player.vy = -window.gameConfig.jumpForce;
                player.grounded = false;
                player.jumpCount = 1;
                spawnParticles(player.x, player.y + player.height, 10, '#fff');
                audio.playSfx('sfx_jump', 120);
            } else if (player.jumpCount < 2) {
                player.vy = -window.gameConfig.jumpForce * 0.8;
                player.jumpCount++;
                spawnParticles(player.x, player.y + player.height / 2, 8, window.gameConfig.themeColor);
                audio.playSfx('sfx_jump', 120);
            }
        }
    }

    // Event Listeners
    canvas.addEventListener('pointerdown', (e) => {
        audio.init();
        handleInput(e);
    }, { passive: false });
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            audio.init();
            handleInput(e);
        }
    });

    document.getElementById('start-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        audio.init();
        startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        resetGame();
    });

    // Game Logic
    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        distance = 0;
        frames = 0;
        gameSpeed = window.gameConfig.baseSpeed;
        
        player.y = canvas.height / window.devicePixelRatio - GROUND_HEIGHT - player.height;
        player.vy = 0;
        player.grounded = true;
        player.jumpCount = 0;
        
        obstacles = [];
        particles = [];
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        gameOverScreen.classList.remove('flex');
        hud.classList.remove('hidden');

        collectGif.classList.remove('visible');
        failGif.classList.remove('visible');
        lastGroundedState = true;

        audio.preload([
            { id: 'sfx_collect', fallback: 'beep' },
            { id: 'sfx_jump', fallback: 'beep' },
            { id: 'sfx_land', fallback: 'land' },
            { id: 'sfx_die', fallback: 'explosion' }
        ]);
        audio.playBgm();
    }

    function resetGame() {
        gameState = 'MENU';
        startScreen.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
        gameOverScreen.classList.remove('flex');
        hud.classList.add('hidden');
        collectGif.classList.remove('visible');
        failGif.classList.remove('visible');
        audio.stopBgm();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        audio.playSfx('sfx_die', 250);
        showGifFeedback('fail');
        cameraShake = 20;
        
        for (let i = 0; i < 30; i++) {
            spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 1, '#ff0000', 5);
        }

        setTimeout(() => {
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex', 'opacity-100', 'scale-100');
            finalScoreDisplay.innerText = Math.floor(score);
        }, 500);
    }

    function spawnParticles(x, y, count, color, speedMult = 1) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10 * speedMult,
                vy: (Math.random() - 0.5) * 10 * speedMult,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'AIR' : 'GROUND';
        const w = window.innerWidth;
        const h = window.innerHeight;
        
        let obs = {
            x: w + 100,
            y: 0,
            width: 40,
            height: 40,
            type: type,
            passed: false,
            isCoin: Math.random() > 0.8
        };

        if (obs.isCoin) {
            obs.width = 30;
            obs.height = 30;
            obs.y = h - GROUND_HEIGHT - 50 - Math.random() * 150;
        } else {
            if (type === 'GROUND') {
                obs.y = h - GROUND_HEIGHT - 40;
                obs.width = 50;
                obs.height = 50;
            } else {
                obs.y = h - GROUND_HEIGHT - 120 - Math.random() * 60;
                obs.width = 40;
                obs.height = 40;
            }
        }
        
        obstacles.push(obs);
    }

    // Drawing Helpers
    function drawNeo(ctx, x, y, w, h, angle) {
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        let tilt = angle + (player.vy * 0.02);
        ctx.rotate(tilt);

        const pulse = Math.sin(frames * 0.2);
        
        // Trail ribbon
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#081121';
        ctx.beginPath();
        ctx.moveTo(-6, 14);
        ctx.quadraticCurveTo(-34 - pulse * 10, 22, -48, 32 + Math.cos(frames * 0.18) * 6);
        ctx.lineTo(-12, 20);
        ctx.fill();

        ctx.strokeStyle = '#6cf4ff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.moveTo(-6, 2);
        ctx.quadraticCurveTo(-26 - pulse * 8, 0, -40, 9);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Booster glow
        ctx.fillStyle = '#ff4d8d';
        ctx.shadowColor = '#ff4d8d';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.ellipse(-16, 12, 5, 7 + Math.abs(pulse) * 2, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Main body
        ctx.fillStyle = '#1f49ff';
        ctx.shadowColor = '#1f49ff';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(-6, -22);
        ctx.quadraticCurveTo(16, -28, 22, -4);
        ctx.quadraticCurveTo(26, 16, 8, 25);
        ctx.quadraticCurveTo(-14, 24, -20, 4);
        ctx.quadraticCurveTo(-22, -14, -6, -22);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Helmet shell
        ctx.fillStyle = '#7bd0ff';
        ctx.globalAlpha = 0.96;
        ctx.beginPath();
        ctx.ellipse(5, -10, 13, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Visor
        ctx.fillStyle = '#0b1024';
        ctx.beginPath();
        ctx.moveTo(3, -14);
        ctx.quadraticCurveTo(15, -12, 16, -6);
        ctx.quadraticCurveTo(8, -2, -2, -6);
        ctx.quadraticCurveTo(-1, -12, 3, -14);
        ctx.fill();

        ctx.strokeStyle = '#ff4d8d';
        ctx.shadowColor = '#ff4d8d';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(1, -9);
        ctx.lineTo(13, -8);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Antenna fins
        ctx.fillStyle = '#4a67ff';
        ctx.beginPath();
        ctx.moveTo(-8, -16);
        ctx.lineTo(-24, -8);
        ctx.lineTo(-8, -2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-6, -4);
        ctx.lineTo(-24, 8);
        ctx.lineTo(-8, 12);
        ctx.fill();

        // Chest core
        ctx.fillStyle = '#ffd96b';
        ctx.shadowColor = '#ffd96b';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(2, 6, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    function drawGrid(ctx, w, h, speed) {
        const gridSize = 40;
        const offset = (distance * 0.8) % gridSize;
        
        ctx.strokeStyle = '#20338e';
        ctx.lineWidth = 1;
        
        const horizonY = h * 0.4;
        
        ctx.beginPath();
        for (let x = 0; x <= w; x += gridSize * 2) {
            ctx.moveTo(x + offset * 0, horizonY);
            ctx.lineTo((x - w / 2) * 4 + w / 2, h);
        }
        ctx.stroke();

        ctx.beginPath();
        for (let y = horizonY; y < h; y += gridSize) {
            let z = (y - horizonY) / (h - horizonY);
            let drawY = horizonY + Math.pow(z, 2) * (h - horizonY);
            ctx.moveTo(0, drawY);
            ctx.lineTo(w, drawY);
        }
        ctx.stroke();
    }

    // Main Loop
    function loop() {
        requestAnimationFrame(loop);
        
        const w = window.innerWidth;
        const h = window.innerHeight;

        if (gameState === 'PLAYING') {
            gameSpeed += 0.005;
            distance += gameSpeed;
            score += 0.1;
            
            player.vy += window.gameConfig.gravity;
            player.y += player.vy;
            
            const floorY = h - GROUND_HEIGHT - player.height;
            if (player.y > floorY) {
                player.y = floorY;
                player.vy = 0;
                player.grounded = true;
                player.jumpCount = 0;
            }

            if (player.grounded && !lastGroundedState && frames > 5) {
                audio.playSfx('sfx_land', 90);
            }
            lastGroundedState = player.grounded;

            if (frames % Math.floor(1000 / gameSpeed) === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    if (obs.isCoin) {
                        score += 50;
                        audio.playSfx('sfx_collect', 80);
                        showGifFeedback('collect');
                        spawnParticles(obs.x, obs.y, 5, '#00f0ff');
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        gameOver();
                    }
                }

                if (obs.x < -100) {
                    obstacles.splice(i, 1);
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }

        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, w, h);

        let shakeX = 0, shakeY = 0;
        if (cameraShake > 0) {
            shakeX = (Math.random() - 0.5) * cameraShake;
            shakeY = (Math.random() - 0.5) * cameraShake;
            cameraShake *= 0.9;
            if (cameraShake < 0.5) cameraShake = 0;
        }
        ctx.save();
        ctx.translate(shakeX, shakeY);

        const skyGlow = ctx.createLinearGradient(0, 0, 0, h);
        skyGlow.addColorStop(0, '#12183d');
        skyGlow.addColorStop(0.35, '#0a1230');
        skyGlow.addColorStop(1, '#04030d');
        ctx.fillStyle = skyGlow;
        ctx.fillRect(0, 0, w, h);

        const sunGlow = ctx.createRadialGradient(w * 0.55, h * 0.22, 20, w * 0.55, h * 0.22, 150);
        sunGlow.addColorStop(0, 'rgba(255, 217, 107, 0.9)');
        sunGlow.addColorStop(0.2, 'rgba(255, 143, 109, 0.5)');
        sunGlow.addColorStop(1, 'rgba(255, 143, 109, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(w * 0.55, h * 0.22, 150, 0, Math.PI * 2);
        ctx.fill();

        drawGrid(ctx, w, h, gameSpeed);

        ctx.fillStyle = 'rgba(11, 21, 58, 0.92)';
        ctx.beginPath();
        ctx.moveTo(0, h - GROUND_HEIGHT + 6);
        for (let x = 0; x <= w; x += 80) {
            const towerHeight = 20 + ((x / 80) % 4) * 18;
            ctx.lineTo(x, h - GROUND_HEIGHT - towerHeight);
            ctx.lineTo(x + 26, h - GROUND_HEIGHT - towerHeight);
            ctx.lineTo(x + 26, h - GROUND_HEIGHT + 6);
        }
        ctx.lineTo(w, h - GROUND_HEIGHT + 6);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = window.gameConfig.themeColor;
        ctx.shadowBlur = 20;
        ctx.shadowColor = window.gameConfig.themeColor;
        ctx.fillRect(0, h - GROUND_HEIGHT, w, 4);
        ctx.shadowBlur = 0;

        obstacles.forEach(obs => {
            if (obs.isCoin) {
                ctx.fillStyle = '#ffd96b';
                ctx.shadowColor = '#ffd96b';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff9d0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2 - 5, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#131726';
                ctx.strokeStyle = '#ff4d8d';
                ctx.shadowColor = '#ff4d8d';
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                if (obs.type === 'GROUND') {
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height / 2);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height / 2);
                    ctx.moveTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y + obs.height);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }
        });

        if (gameState !== 'GAMEOVER') {
            if (frames % 3 === 0) {
                particles.push({
                    x: player.x,
                    y: player.y + player.height / 2,
                    vx: -gameSpeed * 0.5,
                    vy: (Math.random() - 0.5) * 2,
                    life: 0.5,
                    color: '#00f0ff',
                    size: 2
                });
            }
            drawNeo(ctx, player.x, player.y, player.width, player.height, 0);
        }

        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();

        scoreDisplay.innerText = Math.floor(score);
        speedDisplay.innerText = Math.floor((gameSpeed / window.gameConfig.baseSpeed) * 100) + '%';
        
        frames++;
    }

    loop();
});
</script>
</body>
