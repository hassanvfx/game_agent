<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Glowling Family: Memory Merge</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sun-cream: #fff2cf;
      --story-rose: #ff6f8f;
      --hug-orange: #ffad5f;
      --memory-blue: #78d8ff;
      --twilight: #27396f;
      --ink: #24304f;
      --soft-panel: rgba(255, 250, 238, 0.82);
      --panel-line: rgba(255, 255, 255, 0.94);
      --shadow: rgba(41, 60, 117, 0.24);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8ed9ff;
      color: var(--ink);
      font-family: 'Rajdhani', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body.glow-finale {
      animation: finaleWarmth 9s linear infinite;
    }
    @keyframes finaleWarmth {
      0%,100% { background-color: #8ed9ff; }
      25% { background-color: #ffc3d3; }
      50% { background-color: #ffeaa4; }
      75% { background-color: #b9f6d1; }
    }
    #game-shell {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(255,255,255,0.95), rgba(255,255,255,0.0) 28%),
        linear-gradient(180deg, #9ee6ff 0%, #c4edff 34%, #ffd4ad 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .sky-motes, .lanterns {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
    }
    .sky-motes span {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 20px rgba(255,255,255,0.85), 0 0 36px rgba(255,180,114,0.35);
      animation: moteFloat 4.4s ease-in-out infinite;
    }
    .sky-motes span:nth-child(1) { left: 18%; top: 14%; }
    .sky-motes span:nth-child(2) { left: 78%; top: 20%; animation-delay: .8s; }
    .sky-motes span:nth-child(3) { left: 60%; top: 48%; animation-delay: 1.5s; }
    .sky-motes span:nth-child(4) { left: 28%; top: 62%; animation-delay: 2.2s; }
    @keyframes moteFloat {
      0%,100% { transform: translateY(0) scale(.75); opacity: .35; }
      50% { transform: translateY(-18px) scale(1.25); opacity: 1; }
    }
    .ui-layer {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .top-hud {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .story-card, .pill, .action-btn {
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,246,226,.80));
      border: 2px solid var(--panel-line);
      box-shadow: 0 14px 34px var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .story-card {
      border-radius: 24px;
      padding: 10px 13px;
      max-width: min(56vw, 230px);
    }
    .eyebrow {
      margin: 0 0 1px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #9b5e7a;
    }
    h1, .display {
      font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
      letter-spacing: .045em;
      text-transform: uppercase;
    }
    .hud-title {
      margin: 0;
      color: var(--twilight);
      line-height: .88;
      font-size: clamp(25px, 7.2vw, 38px);
      text-shadow: 0 3px 0 rgba(255,255,255,.85), 0 10px 24px rgba(80,81,142,.18);
    }
    .hud-actions {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .action-btn {
      pointer-events: auto;
      appearance: none;
      border-radius: 16px;
      color: var(--twilight);
      font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
      font-size: 16px;
      letter-spacing: .04em;
      border-bottom: 5px solid rgba(112,111,165,.42);
      min-width: 48px;
      min-height: 46px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .action-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    .bottom-hud {
      display: flex;
      justify-content: center;
      padding-bottom: 166px;
    }
    .pill {
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: clamp(13px, 3.6vw, 16px);
      color: #405078;
      text-align: center;
      max-width: min(92vw, 520px);
    }
    .progress-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      color: #ab5b70;
      font-weight: 700;
      font-size: 12px;
    }
    .feedback-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .gif-bubble {
      position: absolute;
      right: 12px;
      bottom: calc(172px + env(safe-area-inset-bottom));
      width: min(28vw, 108px);
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 26px;
      background: rgba(255,255,255,.75);
      border: 3px solid rgba(255,255,255,.94);
      box-shadow: 0 12px 30px rgba(75,66,125,.24);
      opacity: 0;
      transform: translateY(14px) scale(.78) rotate(3deg);
      transition: opacity .18s ease, transform .18s ease;
    }
    .gif-bubble.celebrate {
      left: 50%; right: auto; top: 96px; bottom: auto;
      width: min(34vw, 136px);
      transform: translateX(-50%) translateY(-10px) scale(.8) rotate(-2deg);
    }
    .gif-bubble.is-visible { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    .gif-bubble.celebrate.is-visible { transform: translateX(-50%) translateY(0) scale(1) rotate(0); }
    .gif-bubble img { width: 100%; height: 100%; object-fit: cover; }
    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.96), rgba(255,255,255,.55) 32%, rgba(151,218,255,.82) 100%),
        linear-gradient(180deg, rgba(255,240,205,.9), rgba(255,176,195,.85));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity .32s ease;
    }
    .start-screen.hidden { display: none; }
    .start-card {
      width: min(92vw, 390px);
      border-radius: 34px;
      padding: 24px 22px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .start-card::before, .start-card::after {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 999px;
      filter: blur(30px);
      opacity: .38;
      pointer-events: none;
    }
    .start-card::before { right: -50px; top: -50px; background: var(--story-rose); }
    .start-card::after { left: -50px; bottom: -60px; background: var(--memory-blue); }
    .cover-family {
      position: relative;
      z-index: 1;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
      animation: familyBreathe 3.2s ease-in-out infinite;
    }
    @keyframes familyBreathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .cover-glowling {
      width: 68px;
      height: 76px;
      border-radius: 34px 34px 24px 24px;
      box-shadow: inset 0 9px 0 rgba(255,255,255,.26), 0 16px 28px rgba(82,72,133,.22);
      border: 3px solid rgba(255,255,255,.72);
      position: relative;
      display: grid;
      place-items: start center;
      padding-top: 6px;
      color: white;
      font: 900 30px 'Bangers', sans-serif;
      text-shadow: 0 2px 0 rgba(0,0,0,.08);
    }
    .cover-glowling:nth-child(1) { background: linear-gradient(#ff6f8f,#ff9a67); transform: rotate(-7deg); }
    .cover-glowling:nth-child(2) { background: linear-gradient(#6fd7ff,#6889ff); width: 76px; height: 86px; transform: translateY(8px); }
    .cover-glowling:nth-child(3) { background: linear-gradient(#ffd765,#ff9ec7); transform: rotate(7deg); }
    .cover-glowling::before, .cover-glowling::after {
      content: '';
      position: absolute;
      top: 41px;
      width: 10px;
      height: 13px;
      border-radius: 999px;
      background: #2d2442;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,.55);
    }
    .cover-glowling::before { left: 19px; }
    .cover-glowling::after { right: 19px; }
    .mouth {
      position: absolute;
      left: 50%; bottom: 13px;
      width: 22px; height: 12px;
      border-bottom: 4px solid #2d2442;
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%);
    }
    .start-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 2px 0 9px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      font-weight: 700;
      color: #8e506f;
      font-size: 12px;
    }
    .start-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(38px, 12vw, 56px);
      color: var(--twilight);
      line-height: .9;
      text-shadow: 0 4px 0 rgba(255,255,255,.82), 0 14px 28px rgba(88,73,126,.22);
    }
    .start-copy {
      position: relative;
      z-index: 1;
      margin: 12px auto 20px;
      max-width: 300px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      color: #526184;
    }
    .primary-btn {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, #ff6f8f, #ff975f);
      color: white;
      border-bottom: 6px solid #cf5362;
      box-shadow: 0 18px 34px rgba(219,91,100,.34);
      font: 900 27px 'Bangers', 'Rajdhani', system-ui;
      letter-spacing: .05em;
      cursor: pointer;
    }
    .primary-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
    @media (min-aspect-ratio: 9/12) {
      .bottom-hud { padding-bottom: 150px; }
      .story-card { max-width: 280px; }
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="gameCanvas"></canvas>
    <div class="sky-motes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

    <div class="ui-layer" aria-label="Game HUD">
      <div class="top-hud">
        <section class="story-card" aria-live="polite">
          <p class="eyebrow">Togetherness</p>
          <h1 class="hud-title">Glowling<br>Family</h1>
          <div id="progress-chip" class="progress-chip">💛 Biggest memory: 1</div>
        </section>
        <div class="hud-actions">
          <button id="mute-btn" class="action-btn" aria-label="Toggle sound">🔊</button>
          <button id="clear-btn" class="action-btn" aria-label="Reset memories">RESET</button>
        </div>
      </div>
      <div class="bottom-hud">
        <div id="instruction-pill" class="pill">Drag matching Glowlings together to grow a bigger memory.</div>
      </div>
    </div>

    <div class="feedback-stage" aria-hidden="true">
      <div id="merge-gif-bubble" class="gif-bubble"><img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt=""></div>
      <div id="celebrate-gif-bubble" class="gif-bubble celebrate"><img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt=""></div>
    </div>

    <div id="start-screen" class="start-screen">
      <section class="story-card start-card">
        <div class="cover-family" aria-hidden="true">
          <div class="cover-glowling">1<span class="mouth"></span></div>
          <div class="cover-glowling">2<span class="mouth"></span></div>
          <div class="cover-glowling">3<span class="mouth"></span></div>
        </div>
        <div class="start-badge">🎬 Soft cinematic merge adventure</div>
        <h2 class="start-title display">Memory<br>Merge</h2>
        <p class="start-copy">Guide tiny feeling friends into matching hugs. Same numbers merge into a warmer family memory.</p>
        <button id="start-btn" class="primary-btn">BEGIN THE HUG</button>
      </section>
    </div>
  </div>

  <script>
    const MEDIA = {
      audio: {
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3',
        merge: 'https://gamezone-virid.vercel.app/assets/audios/sfx/forest_npc_01.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/forest_enemy_01.mp3',
        unlock: 'https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3',
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_02.mp3'
      }
    };

    const CONFIG = {
      gridBase: 80,
      inventoryHeight: 160,
      bpm: 92,
      blocks: {
        1:  { color: '#ff6f8f', dark: '#cf5362', oneEye: true, mood: 'Brave' },
        2:  { color: '#ffad5f', dark: '#d47241', glasses: true, mood: 'Funny' },
        3:  { color: '#ffd765', dark: '#c99930', buttons: true, mood: 'Sunny' },
        4:  { color: '#72d28b', dark: '#3e9c60', squareEyes: true, mood: 'Kind' },
        5:  { color: '#6fd7ff', dark: '#438fd0', starEye: true, mood: 'Dreamy' },
        6:  { color: '#a889ff', dark: '#7b61d6', mood: 'Wonder' },
        7:  { color: '#f69df2', dark: '#be6ec0', rainbow: true, mood: 'Family' },
        8:  { color: '#ff9ec7', dark: '#cc6295', tentacles: true, mood: 'Giggle' },
        9:  { color: '#a6b7d6', dark: '#6f82aa', mood: 'Memory' },
        10: { color: '#fff9ed', dark: '#ef6f7f', border: '#ef6f7f', mood: 'Home' }
      }
    };

    class AudioController {
      constructor() {
        this.muted = false;
        this.unlocked = false;
        this.cooldowns = new Map();
        this.bgm = new Audio(MEDIA.audio.bgm);
        this.bgm.loop = true;
        this.bgm.preload = 'auto';
        this.bgm.volume = 0.18;
        this.sfx = {
          pickup: this.createAudio(MEDIA.audio.pickup, 0.32),
          merge: this.createAudio(MEDIA.audio.merge, 0.36),
          blocked: this.createAudio(MEDIA.audio.blocked, 0.2),
          unlock: this.createAudio(MEDIA.audio.unlock, 0.32)
        };
      }
      createAudio(src, volume) {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        return audio;
      }
      unlock() {
        this.unlocked = true;
        try { this.bgm.load(); Object.values(this.sfx).forEach(a => a.load()); } catch (_) {}
      }
      startLoop() {
        if (!this.unlocked || this.muted) return;
        this.bgm.play().catch(() => {});
      }
      stopLoop() { try { this.bgm.pause(); } catch (_) {} }
      toggleMute() {
        this.muted = !this.muted;
        if (this.muted) this.stopLoop(); else this.startLoop();
        return this.muted;
      }
      play(name, cooldown = 90) {
        if (this.muted || !this.unlocked || !this.sfx[name]) return;
        const now = performance.now();
        const last = this.cooldowns.get(name) || 0;
        if (now - last < cooldown) return;
        this.cooldowns.set(name, now);
        const audio = this.sfx[name];
        try { audio.pause(); audio.currentTime = 0; audio.play().catch(() => {}); } catch (_) {}
      }
    }

    class Particle {
      constructor(x, y, color, heart = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.4 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1.2;
        this.life = 1;
        this.color = color;
        this.size = Math.random() * 8 + 5;
        this.heart = heart || Math.random() > 0.48;
        this.spin = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.32;
        this.vx *= 0.985;
        this.life -= 0.035;
        this.size *= 0.94;
        this.spin += 0.05;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.spin);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        if (this.heart) {
          const s = this.size;
          ctx.beginPath();
          ctx.moveTo(0, s * .42);
          ctx.bezierCurveTo(-s, -s * .18, -s * .75, -s, 0, -s * .45);
          ctx.bezierCurveTo(s * .75, -s, s, -s * .18, 0, s * .42);
          ctx.fill();
        } else {
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? this.size : this.size * .45;
            const a = -Math.PI / 2 + i * Math.PI / 5;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.audio = new AudioController();
        this.mergeGifBubble = document.getElementById('merge-gif-bubble');
        this.celebrateGifBubble = document.getElementById('celebrate-gif-bubble');
        this.gifTimers = {};
        this.blocks = [];
        this.particles = [];
        this.inventoryScroll = 0;
        this.dragItem = null;
        this.dragOffset = { x: 0, y: 0 };
        this.inventoryItems = [1, 2, 3, 4];
        this.isRainbowMode = false;
        this.touch = { active: false, startX: 0, startY: 0, scrollStart: 0, mode: 'none' };
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.canvas.addEventListener('pointerdown', e => this.onDown(e), { passive: false });
        window.addEventListener('pointermove', e => this.onMove(e), { passive: false });
        window.addEventListener('pointerup', e => this.onUp(e));
        window.addEventListener('pointercancel', e => this.onUp(e));
        document.getElementById('start-btn').addEventListener('click', () => {
          this.audio.unlock();
          this.audio.startLoop();
          document.getElementById('start-screen').classList.add('hidden');
          this.showGif('celebrate');
          this.spawnConfetti();
        });
        document.getElementById('clear-btn').addEventListener('click', () => {
          this.resetGame();
        });
        document.getElementById('mute-btn').addEventListener('click', e => {
          const muted = this.audio.toggleMute();
          e.currentTarget.innerText = muted ? '🔇' : '🔊';
          e.currentTarget.style.opacity = muted ? '0.58' : '1';
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) this.audio.stopLoop(); else this.audio.startLoop();
        });
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }
      resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        CONFIG.inventoryHeight = Math.max(136, Math.min(168, Math.floor(this.height * 0.21)));
        this.inventoryY = this.height - CONFIG.inventoryHeight;
        CONFIG.gridBase = Math.min(85, Math.max(58, Math.floor(this.width / 4.5)));
      }
      resetGame() {
        this.blocks = [];
        this.isRainbowMode = false;
        document.body.className = '';
        document.getElementById('instruction-pill').innerText = 'Drag matching Glowlings together to grow a bigger memory.';
        this.updateProgress();
        this.audio.play('blocked', 0);
        this.showGif('merge', 650);
        this.spawnConfetti();
      }
      showGif(type, duration = 1100) {
        const target = type === 'celebrate' ? this.celebrateGifBubble : this.mergeGifBubble;
        if (!target) return;
        clearTimeout(this.gifTimers[type]);
        target.classList.add('is-visible');
        this.gifTimers[type] = setTimeout(() => target.classList.remove('is-visible'), duration);
      }
      spawnConfetti() {
        for (let i = 0; i < 30; i++) this.particles.push(new Particle(this.width/2, this.height * .45, CONFIG.blocks[Math.floor(Math.random()*5)+1].color, true));
      }
      spawnParticles(x, y, color) {
        for (let i = 0; i < 18; i++) this.particles.push(new Particle(x, y, color));
      }
      updateProgress() {
        const maxLevel = this.blocks.reduce((max, b) => Math.max(max, b.id), 1);
        document.getElementById('progress-chip').innerText = `💛 Biggest memory: ${maxLevel}`;
      }
      checkRainbowMode() {
        const maxLevel = this.blocks.reduce((max, b) => Math.max(max, b.id), 0);
        this.updateProgress();
        if (maxLevel >= 7 && !this.isRainbowMode) {
          this.isRainbowMode = true;
          document.body.className = 'glow-finale';
          document.getElementById('instruction-pill').innerText = 'Family glow unlocked! Keep merging toward Home 10. 🌈';
          this.audio.play('unlock', 0);
          this.showGif('celebrate', 1600);
          this.spawnConfetti();
        }
      }
      getBlockDef(id) { return CONFIG.blocks[id] || CONFIG.blocks[1]; }
      getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }
      onDown(e) {
        e.preventDefault();
        const p = this.getPos(e);
        this.touch.active = true;
        this.touch.startX = p.x;
        this.touch.startY = p.y;
        this.touch.mode = 'none';
        for (let i = this.blocks.length - 1; i >= 0; i--) {
          const b = this.blocks[i];
          const size = CONFIG.gridBase;
          if (p.x >= b.x && p.x <= b.x + size && p.y >= b.y && p.y <= b.y + size) {
            this.dragItem = this.blocks.splice(i, 1)[0];
            this.dragOffset = { x: p.x - b.x, y: p.y - b.y };
            this.touch.mode = 'drag';
            this.audio.play('pickup');
            return;
          }
        }
        if (p.y > this.inventoryY) {
          let x = 20 + this.inventoryScroll;
          for (let id of this.inventoryItems) {
            const size = CONFIG.gridBase * 0.9;
            const y = this.inventoryY + (CONFIG.inventoryHeight - size)/2;
            if (p.x >= x && p.x <= x + size && p.y >= y && p.y <= y + size) {
              this.dragItem = { id, x: p.x - size/2, y: p.y - size/2 };
              this.dragOffset = { x: size/2, y: size/2 };
              this.touch.mode = 'drag';
              this.audio.play('pickup');
              return;
            }
            x += size + 20;
          }
          this.touch.mode = 'scroll';
          this.touch.scrollStart = this.inventoryScroll;
        }
      }
      onMove(e) {
        if (!this.touch.active) return;
        const p = this.getPos(e);
        if (this.touch.mode === 'none' && Math.hypot(p.x - this.touch.startX, p.y - this.touch.startY) > 5) this.touch.mode = 'none';
        if (this.touch.mode === 'drag' && this.dragItem) {
          this.dragItem.x = p.x - this.dragOffset.x;
          this.dragItem.y = p.y - this.dragOffset.y;
        } else if (this.touch.mode === 'scroll') {
          const dx = p.x - this.touch.startX;
          this.inventoryScroll = this.touch.scrollStart + dx;
          const maxW = this.inventoryItems.length * (CONFIG.gridBase * 0.9 + 20) + 100;
          const minScroll = Math.min(0, this.width - maxW);
          if (this.inventoryScroll > 20) this.inventoryScroll = 20;
          if (this.inventoryScroll < minScroll) this.inventoryScroll = minScroll;
        }
      }
      onUp() {
        this.touch.active = false;
        if (this.dragItem) {
          const g = CONFIG.gridBase;
          let merged = false;
          for (let i = 0; i < this.blocks.length; i++) {
            const target = this.blocks[i];
            const c1 = { x: this.dragItem.x + g/2, y: this.dragItem.y + g/2 };
            const c2 = { x: target.x + g/2, y: target.y + g/2 };
            const dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
            if (dist < g * 0.6 && target.id === this.dragItem.id && target.id < 10) {
              target.id++;
              const def = this.getBlockDef(target.id);
              this.spawnParticles(c2.x, c2.y, def.color);
              this.audio.play('merge', 120);
              this.showGif('merge');
              document.getElementById('instruction-pill').innerText = `${def.mood} memory ${target.id} found. Match another one!`;
              merged = true;
              break;
            }
          }
          if (!merged) {
            if (this.dragItem.y > this.inventoryY - 50) {
              this.spawnParticles(this.dragItem.x + g/2, this.dragItem.y + g/2, '#ffffff');
              this.audio.play('blocked', 0);
            } else {
              const snap = g/2;
              this.dragItem.x = Math.round(this.dragItem.x / snap) * snap;
              this.dragItem.y = Math.round(this.dragItem.y / snap) * snap;
              if (this.dragItem.x < 0) this.dragItem.x = 0;
              if (this.dragItem.y < 0) this.dragItem.y = 0;
              if (this.dragItem.x + g > this.width) this.dragItem.x = this.width - g;
              if (this.dragItem.y + g > this.inventoryY) this.dragItem.y = this.inventoryY - g;
              this.blocks.push(this.dragItem);
            }
          }
          this.dragItem = null;
          this.checkRainbowMode();
        }
      }
      loop() {
        const time = performance.now() / 1000;
        this.drawScene(time);
        const beatTime = time * (CONFIG.bpm / 60);
        const g = CONFIG.gridBase;
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255,255,255,0.26)';
        this.ctx.lineWidth = 1.5;
        this.ctx.beginPath();
        for (let x = 0; x < this.width; x += g/2) { this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.inventoryY); }
        for (let y = 96; y < this.inventoryY; y += g/2) { this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y); }
        this.ctx.stroke();
        this.ctx.restore();
        this.blocks.forEach(b => this.drawGlowling(b, beatTime));
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.update();
          p.draw(this.ctx);
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        this.drawInventory(beatTime);
        if (this.dragItem) {
          this.ctx.shadowColor = 'rgba(56,56,105,.26)';
          this.ctx.shadowBlur = 24;
          this.ctx.shadowOffsetY = 12;
          this.drawGlowling(this.dragItem, beatTime, 1.1, true);
          this.ctx.shadowBlur = 0;
          this.ctx.shadowOffsetY = 0;
        }
        requestAnimationFrame(this.loop);
      }
      drawScene(time) {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;
        const grd = ctx.createLinearGradient(0, 0, 0, h);
        grd.addColorStop(0, '#93e3ff');
        grd.addColorStop(.38, '#d8f6ff');
        grd.addColorStop(1, '#ffd0a4');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, w, h);
        const sun = ctx.createRadialGradient(w * .48, h * .13, 10, w * .48, h * .13, Math.max(w, h) * .55);
        sun.addColorStop(0, 'rgba(255,255,255,.92)');
        sun.addColorStop(.22, 'rgba(255,242,207,.46)');
        sun.addColorStop(1, 'rgba(255,242,207,0)');
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, w, h);
        this.drawCloud(w * .16 + Math.sin(time*.18)*24, h*.18, 78, 'rgba(255,255,255,.46)');
        this.drawCloud(w * .78 - Math.sin(time*.14)*22, h*.25, 102, 'rgba(255,255,255,.38)');
        this.drawCloud(w * .44 + Math.sin(time*.11)*28, h*.52, 92, 'rgba(255,246,226,.25)');
        this.drawHill(0, h*.72, w*.65, h*.22, '#8bd18d', .05, time);
        this.drawHill(w*.38, h*.76, w*.72, h*.24, '#6fb9a1', -.04, time);
        this.drawHill(-w*.18, h*.82, w*.9, h*.22, '#f8b978', .02, time);
        for (let i = 0; i < 7; i++) {
          const x = (i / 6) * w + Math.sin(time*.28 + i) * 5;
          const y = h*.61 + Math.sin(time*.5 + i) * 6;
          ctx.strokeStyle = 'rgba(255,255,255,.42)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 8*Math.sin(time+i), y + 30);
          ctx.stroke();
          ctx.fillStyle = i % 2 ? 'rgba(255,111,143,.56)' : 'rgba(255,215,101,.62)';
          ctx.beginPath();
          ctx.ellipse(x, y, 8, 11, Math.sin(time+i)*.25, 0, Math.PI*2);
          ctx.fill();
        }
      }
      drawCloud(x, y, s, color) {
        const ctx = this.ctx;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, s*.55, s*.18, 0, 0, Math.PI*2);
        ctx.ellipse(x-s*.25, y, s*.28, s*.2, 0, 0, Math.PI*2);
        ctx.ellipse(x+s*.2, y-s*.04, s*.35, s*.24, 0, 0, Math.PI*2);
        ctx.fill();
      }
      drawHill(x, y, w, h, color, sway, time) {
        const ctx = this.ctx;
        ctx.fillStyle = color;
        ctx.globalAlpha = .58;
        ctx.beginPath();
        ctx.moveTo(x, this.height);
        ctx.quadraticCurveTo(x + w*.5, y + Math.sin(time)*h*sway, x+w, this.height);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      drawInventory(beatTime) {
        const ctx = this.ctx;
        const grad = ctx.createLinearGradient(0, this.inventoryY, 0, this.height);
        grad.addColorStop(0, 'rgba(255,255,255,.62)');
        grad.addColorStop(1, 'rgba(255,241,213,.88)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, this.inventoryY, this.width, CONFIG.inventoryHeight);
        ctx.strokeStyle = 'rgba(255,255,255,.96)';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0, this.inventoryY); ctx.lineTo(this.width, this.inventoryY); ctx.stroke();
        ctx.fillStyle = '#7b6380';
        ctx.font = '700 13px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Hug tray: drag a Glowling into the story', this.width/2, this.inventoryY + 18);
        let x = 20 + this.inventoryScroll;
        for (let id of this.inventoryItems) {
          const size = CONFIG.gridBase * 0.9;
          const y = this.inventoryY + (CONFIG.inventoryHeight - size)/2 + 8;
          if (x + size > 0 && x < this.width) this.drawGlowling({ id, x, y }, beatTime, 0.9);
          x += size + 20;
        }
      }
      drawGlowling(obj, beatTime, scaleMult = 1, isDrag = false) {
        const def = this.getBlockDef(obj.id);
        const g = CONFIG.gridBase * scaleMult;
        const bounce = isDrag ? 0 : -Math.sin((beatTime % 1) * Math.PI) * 3;
        const cx = obj.x + g/2;
        const cy = obj.y + g/2 + bounce;
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.shadowColor = def.color;
        ctx.shadowBlur = isDrag ? 22 : 9;
        const bodyGrad = ctx.createLinearGradient(-g/2, -g/2, g/2, g/2);
        if (def.rainbow) {
          ['#ff6f8f','#ffad5f','#ffd765','#72d28b','#6fd7ff','#a889ff'].forEach((c, i) => bodyGrad.addColorStop(i/5, c));
        } else {
          bodyGrad.addColorStop(0, '#ffffff');
          bodyGrad.addColorStop(.08, def.color);
          bodyGrad.addColorStop(1, def.dark);
        }
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        const r = 24 * scaleMult;
        if (ctx.roundRect) ctx.roundRect(-g/2, -g/2, g, g, [r, r, r*.72, r*.72]); else ctx.rect(-g/2, -g/2, g, g);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-g*.36, -g*.4, g*.72, g*.18, 999); else ctx.rect(-g*.36, -g*.4, g*.72, g*.18);
        ctx.fill();
        ctx.strokeStyle = def.border || 'rgba(255,255,255,.62)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = obj.id === 10 ? '#ef6f7f' : '#fffdf6';
        ctx.font = `900 ${g * .33}px Bangers, Rajdhani, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(obj.id, 0, -g*.29);
        this.drawFace(def, g);
        ctx.restore();
      }
      drawFace(def, size) {
        const ctx = this.ctx;
        const eyeY = size * .02;
        const eyeX = size * .18;
        const eyeRad = size * .11;
        ctx.fillStyle = '#fffdf8';
        if (def.oneEye) {
          ctx.beginPath(); ctx.arc(0, eyeY, eyeRad * 1.45, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#2d2442'; ctx.beginPath(); ctx.arc(0, eyeY, eyeRad * .58, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(eyeRad*.35, eyeY-eyeRad*.35, eyeRad*.18, 0, Math.PI*2); ctx.fill();
        } else if (def.glasses) {
          ctx.strokeStyle = '#2d2442'; ctx.lineWidth = 4;
          ctx.fillStyle = 'rgba(255,255,255,.82)';
          ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeRad*1.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeRad*1.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-eyeX+eyeRad*1.1, eyeY); ctx.lineTo(eyeX-eyeRad*1.1, eyeY); ctx.stroke();
          ctx.fillStyle = '#2d2442'; ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeRad*.38, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeRad*.38, 0, Math.PI*2); ctx.fill();
        } else {
          if (def.squareEyes) { ctx.fillRect(-eyeX-eyeRad, eyeY-eyeRad, eyeRad*2, eyeRad*2); ctx.fillRect(eyeX-eyeRad, eyeY-eyeRad, eyeRad*2, eyeRad*2); }
          else { ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeRad, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeRad, 0, Math.PI*2); ctx.fill(); }
          ctx.fillStyle = '#2d2442'; ctx.beginPath(); ctx.arc(-eyeX, eyeY, eyeRad*.42, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeRad*.42, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,180,190,.62)';
        ctx.beginPath(); ctx.arc(-size*.25, size*.15, size*.065, 0, Math.PI*2); ctx.arc(size*.25, size*.15, size*.065, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#2d2442'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, size*.19, size*.14, 0.15, Math.PI - 0.15); ctx.stroke();
      }
    }

    window.addEventListener('load', () => { window.game = new Game(); });
  </script>
</body>
