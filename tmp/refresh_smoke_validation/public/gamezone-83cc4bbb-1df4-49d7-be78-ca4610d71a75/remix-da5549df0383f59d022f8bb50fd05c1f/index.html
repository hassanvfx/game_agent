<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Numberblocks Merge</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: #8fd7ff;
            --bg-rainbow: #fff0f5;
            --bg-deep: #1f4f9a;
            --panel-bg: rgba(255, 255, 255, 0.82);
            --panel-border: rgba(255, 255, 255, 0.95);
            --text-main: #17335d;
            --text-soft: #45638d;
            --hero-red: #ff5f6d;
            --hero-gold: #ffd166;
            --hero-blue: #67c7ff;
            --glow: rgba(255, 255, 255, 0.45);
        }
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.95), rgba(255,255,255,0) 28%),
                linear-gradient(180deg, #a6ebff 0%, var(--bg-sky) 36%, #7bc5ff 100%);
            font-family: 'Rajdhani', system-ui, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
            transition: background-color 1s ease;
        }
        
        /* Rainbow Mode Animation */
        @keyframes rainbow-bg {
            0% { background-color: #ffcccc; }
            20% { background-color: #ccffcc; }
            40% { background-color: #ccccff; }
            60% { background-color: #ffffcc; }
            80% { background-color: #ffccff; }
            100% { background-color: #ffcccc; }
        }
        body.rainbow-mode {
            animation: rainbow-bg 10s infinite linear;
        }

        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .glass-panel { 
            background: linear-gradient(180deg, var(--panel-bg), rgba(226, 244, 255, 0.92)); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid var(--panel-border);
            box-shadow: 0 14px 34px rgba(38, 77, 138, 0.18); 
            border-radius: 1.5rem;
        }
        
        .btn-push {
            background: linear-gradient(180deg, #ffffff, #dff2ff);
            border: none;
            border-bottom: 4px solid #8ab1db;
            color: #24436f;
            transition: transform 0.1s, border-width 0.1s, filter 0.15s ease, box-shadow 0.15s ease;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.04em;
            box-shadow: 0 8px 18px rgba(63, 108, 176, 0.18);
        }
        .btn-push:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
        }
        
        .btn-primary {
            background: linear-gradient(180deg, var(--hero-red), #ff8b54);
            color: white;
            border-bottom: 4px solid #d3473d;
            box-shadow: 0 12px 22px rgba(239, 92, 77, 0.35);
        }
        .btn-primary:active {
            border-bottom: 0px solid transparent;
        }

        .btn-push:hover,
        .btn-push:focus-visible {
            filter: brightness(1.04);
            box-shadow: 0 12px 22px rgba(63, 108, 176, 0.24);
            outline: none;
        }

        .safe-area {
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }

        .hidden { display: none !important; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .font-display {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .ui-badge {
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(227,244,255,0.88));
            border: 2px solid rgba(255,255,255,0.95);
            border-radius: 999px;
            box-shadow: 0 8px 18px rgba(58, 105, 167, 0.16);
        }
        .hero-frame {
            position: relative;
            isolation: isolate;
        }
        .hero-frame::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,209,102,0.42), rgba(103,199,255,0.4));
            filter: blur(14px);
            z-index: -1;
        }
        .hero-sparkles,
        .cloud-strip {
            pointer-events: none;
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .hero-sparkles span,
        .cloud-strip span {
            position: absolute;
            display: block;
        }
        .hero-sparkles span {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(255,255,255,0.8);
            animation: sparkle 2.8s ease-in-out infinite;
        }
        .hero-sparkles span:nth-child(1) { top: 14%; left: 16%; }
        .hero-sparkles span:nth-child(2) { top: 28%; right: 18%; animation-delay: 0.5s; }
        .hero-sparkles span:nth-child(3) { bottom: 21%; left: 24%; animation-delay: 1s; }
        .hero-sparkles span:nth-child(4) { bottom: 18%; right: 22%; animation-delay: 1.4s; }
        .cloud-strip span {
            width: 92px;
            height: 28px;
            border-radius: 999px;
            background: rgba(255,255,255,0.45);
            filter: blur(1px);
            animation: drift 14s linear infinite;
        }
        .cloud-strip span::before,
        .cloud-strip span::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: inherit;
        }
        .cloud-strip span::before {
            width: 44px;
            height: 44px;
            left: 12px;
            top: -18px;
        }
        .cloud-strip span::after {
            width: 36px;
            height: 36px;
            right: 12px;
            top: -12px;
        }
        .cloud-strip span:nth-child(1) { top: 9%; left: -8%; }
        .cloud-strip span:nth-child(2) { top: 18%; right: -12%; animation-duration: 18s; }
        .cloud-strip span:nth-child(3) { top: 56%; left: -16%; animation-duration: 20s; }
        .hero-title {
            color: var(--text-main);
            text-shadow: 0 3px 0 rgba(255,255,255,0.9), 0 10px 18px rgba(67, 112, 180, 0.18);
        }
        .instruction-chip {
            color: var(--text-soft);
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.04em;
        }
        @keyframes sparkle {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(-8px) scale(1.2); opacity: 1; }
        }
        @keyframes drift {
            0% { transform: translateX(0); opacity: 0.5; }
            50% { opacity: 0.9; }
            100% { transform: translateX(28vw); opacity: 0.45; }
        }
        .feedback-stage {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .feedback-bubble {
            position: absolute;
            right: 1rem;
            bottom: calc(11.5rem + env(safe-area-inset-bottom));
            width: min(28vw, 112px);
            aspect-ratio: 1;
            border-radius: 1.25rem;
            background: rgba(255,255,255,0.72);
            border: 3px solid rgba(255,255,255,0.95);
            box-shadow: 0 10px 22px rgba(34, 83, 145, 0.2);
            backdrop-filter: blur(8px);
            overflow: hidden;
            opacity: 0;
            transform: scale(0.8) translateY(12px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .feedback-bubble.is-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .feedback-bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .feedback-bubble--celebrate {
            left: 50%;
            top: 6.5rem;
            right: auto;
            bottom: auto;
            width: min(34vw, 136px);
            transform: translateX(-50%) scale(0.82);
        }
        .feedback-bubble--celebrate.is-visible {
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full">
    <div class="cloud-strip" aria-hidden="true">
        <span></span><span></span><span></span>
    </div>
    <div class="hero-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="feedback-stage" aria-hidden="true">
        <!-- [agent-note][stage3] resolved-gif: merge-feedback and rainbow-unlock -> catalogs/gifs.json -->
        <div id="merge-gif-bubble" class="feedback-bubble">
            <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="">
        </div>
        <div id="celebrate-gif-bubble" class="feedback-bubble feedback-bubble--celebrate">

            <!-- Decorative Blobs -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-red-400 rounded-full blur-3xl opacity-30 animate-pulse"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-yellow-400 rounded-full blur-3xl opacity-30 animate-pulse" style="animation-delay: 0.5s"></div>

            <div class="relative z-10">
                <div class="mb-6 flex justify-center gap-3 animate-float">
                    <!-- 1 Block -->
                    <div class="w-16 h-16 bg-red-500 rounded-2xl border-b-4 border-red-700 shadow-lg flex items-center justify-center text-white font-black text-4xl relative">
                        <span class="absolute inset-x-0 top-1 h-3 rounded-full bg-white/20"></span>
                        1
                        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-5 h-5 bg-white rounded-full flex items-center justify-center shadow-inner">
                            <div class="w-2 h-2 bg-black rounded-full"></div>

                    <!-- 2 Block -->
                    <div class="w-16 h-16 bg-orange-400 rounded-2xl border-b-4 border-orange-600 shadow-lg flex items-center justify-center text-white font-black text-4xl mt-4 relative">
                        <span class="absolute inset-x-0 top-1 h-3 rounded-full bg-white/20"></span>
                        2
                        <div class="absolute top-3 left-3 w-4 h-4 border-[3px] border-black rounded-full bg-white/80"></div>
                        <div class="absolute top-3 right-3 w-4 h-4 border-[3px] border-black rounded-full bg-white/80"></div>
                        <div class="absolute top-5 left-1/2 -translate-x-1/2 w-2 h-1 bg-black rounded-full"></div>
                        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-6 h-2 border-b-4 border-black rounded-full"></div>
                    </div>
                </div>
                
                <div class="ui-badge inline-flex items-center gap-2 px-4 py-2 mb-4 text-xs font-bold text-sky-700">
                    <span>⭐</span><span>Super cheerful merge puzzle</span>
                </div>
                <h1 class="font-display hero-title text-4xl font-black mb-2 tracking-tight">NUMBER<br>BLOCKS</h1>

                <button id="start-btn" class="pointer-events-auto btn-push btn-primary text-2xl px-12 py-4 font-black w-full shadow-xl rounded-2xl">

<script>
const MEDIA = {
    audio: {
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        merge: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
        blocked: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        unlock: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3'
    },
    gifs: {
        merge: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
        celebrate: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
    }
};

/** 
 * GAME CONFIGURATION 
 */
const CONFIG = {
    gridBase: 80,
    inventoryHeight: 160,
    bpm: 110,
    // Numberblocks Definitions
    blocks: {
        1:  { color: '#ef4444', dark: '#b91c1c', oneEye: true }, // Red
        2:  { color: '#f97316', dark: '#c2410c', glasses: true }, // Orange
        3:  { color: '#eab308', dark: '#a16207', buttons: true }, // Yellow
        4:  { color: '#22c55e', dark: '#15803d', squareEyes: true }, // Green
        5:  { color: '#3b82f6', dark: '#1d4ed8', starEye: true }, // Blue
        6:  { color: '#a855f7', dark: '#7e22ce' }, // Purple
        7:  { color: '#ec4899', dark: '#be185d', rainbow: true }, // Rainbow/Lucky
        8:  { color: '#f472b6', dark: '#db2777', tentacles: true }, // Pink
        9:  { color: '#94a3b8', dark: '#64748b' }, // Grey
        10: { color: '#ffffff', dark: '#ef4444', border: '#ef4444' } // Ten (White with Red)
    }
};

/**
 * AUDIO SYSTEM (Synthesizer)
 */
class AudioController {
    constructor() {
        this.muted = false;
        this.unlocked = false;
        this.cooldowns = new Map();
        this.bgm = new Audio(MEDIA.audio.bgm);
        this.bgm.loop = true;
        this.bgm.preload = 'auto';
        this.bgm.volume = 0.2;
        this.sfx = {
            uiClick: this.createAudio(MEDIA.audio.uiClick, 0.45),
            pickup: this.createAudio(MEDIA.audio.pickup, 0.35),
            merge: this.createAudio(MEDIA.audio.merge, 0.42),
            blocked: this.createAudio(MEDIA.audio.blocked, 0.34),
            unlock: this.createAudio(MEDIA.audio.unlock, 0.5)
        };
    }

    createAudio(src, volume) {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        return audio;
    }

    unlock() {
        this.unlocked = true;
        this.bgm.load();
        Object.values(this.sfx).forEach(audio => audio.load());
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.stopLoop();
        } else {
            this.startLoop();
        }
        return this.muted;
    }

    startLoop() {
        if (!this.unlocked || this.muted) return;
        this.bgm.currentTime = this.bgm.currentTime || 0;
        this.bgm.play().catch(() => {});
    }

    stopLoop() {
        this.bgm.pause();
    }

    play(name, cooldown = 90) {
        if (this.muted || !this.unlocked || !this.sfx[name]) return;
        const now = performance.now();
        const last = this.cooldowns.get(name) || 0;
        if (now - last < cooldown) return;
        this.cooldowns.set(name, now);

        const audio = this.sfx[name];
        try {
            audio.pause();
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    }
}

/**
 * PARTICLE SYSTEM
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 8 + 4;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.4; // Gravity
        this.life -= 0.04;
        this.size *= 0.92;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        
        // Star shape for particles
        const spikes = 5;
        const outer = this.size;
        const inner = this.size/2;
        let rot = Math.PI / 2 * 3;
        let x = this.x;
        let y = this.y;
        let step = Math.PI / spikes;

        ctx.moveTo(this.x, this.y - outer);
        for(let i=0; i<spikes; i++){
            x = this.x + Math.cos(rot) * outer;
            y = this.y + Math.sin(rot) * outer;
            ctx.lineTo(x, y);
            rot += step;

            x = this.x + Math.cos(rot) * inner;
            y = this.y + Math.sin(rot) * inner;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(this.x, this.y - outer);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

/**
 * MAIN GAME ENGINE
 */
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.audio = new AudioController();
        this.mergeGifBubble = document.getElementById('merge-gif-bubble');
        this.celebrateGifBubble = document.getElementById('celebrate-gif-bubble');
        this.gifTimers = {};
        
        this.blocks = [];
        this.particles = [];
        this.inventoryScroll = 0;
        this.dragItem = null;
        this.dragOffset = { x: 0, y: 0 };
        
        // Inventory offers 1, 2, 3, 4 (infinite source)
        this.inventoryItems = [1, 2, 3, 4]; 
        this.isRainbowMode = false;
        
        // Touch State
        this.touch = {
            active: false,
            startX: 0,
            startY: 0,
            scrollStart: 0,
            mode: 'none'
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input
        this.canvas.addEventListener('pointerdown', e => this.onDown(e), { passive: false });
        window.addEventListener('pointermove', e => this.onMove(e), { passive: false });
        window.addEventListener('pointerup', e => this.onUp(e));
        window.addEventListener('pointercancel', e => this.onUp(e));

        // UI
        document.getElementById('start-btn').addEventListener('click', () => {
            this.audio.unlock();
            this.audio.play('uiClick', 0);
            this.audio.startLoop();
            document.getElementById('start-screen').classList.add('hidden');
            this.showGif('celebrate');
            this.spawnConfetti();
        });
        document.getElementById('clear-btn').addEventListener('click', () => {
            this.audio.play('uiClick', 0);
            this.resetGame();
        });
        document.getElementById('mute-btn').addEventListener('click', (e) => {
            const muted = this.audio.toggleMute();
            e.target.innerText = muted ? '🔇' : '🔊';
            e.target.style.opacity = muted ? '0.5' : '1';
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) this.audio.stopLoop();
            else this.audio.startLoop();
        });

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.inventoryY = this.height - CONFIG.inventoryHeight;
        
        // Responsive Grid
        CONFIG.gridBase = Math.min(85, Math.floor(this.width / 4.5));
    }

    resetGame() {
        this.blocks = [];
        this.isRainbowMode = false;
        document.body.className = '';
        this.showGif('merge', 650);
        this.spawnConfetti();
    }

    showGif(type, duration = 1100) {
        const target = type === 'celebrate' ? this.celebrateGifBubble : this.mergeGifBubble;
        if (!target) return;
        clearTimeout(this.gifTimers[type]);
        target.classList.add('is-visible');
        this.gifTimers[type] = setTimeout(() => target.classList.remove('is-visible'), duration);
    }

    spawnConfetti() {
        for(let i=0; i<30; i++) {
            this.particles.push(new Particle(this.width/2, this.height/2, CONFIG.blocks[Math.floor(Math.random()*5)+1].color));
        }
    }

    checkRainbowMode() {
        const maxLevel = this.blocks.reduce((max, b) => Math.max(max, b.id), 0);
        // Trigger rainbow mode at 7
        if (maxLevel >= 7 && !this.isRainbowMode) {
            this.isRainbowMode = true;
            document.body.className = 'rainbow-mode';
            document.getElementById('instruction-pill').innerText = "Rainbow Magic Unlocked! 🌈";
            this.audio.play('unlock', 0);
            this.showGif('celebrate', 1600);
            this.spawnConfetti();
        }
    }

    getBlockDef(id) {
        return CONFIG.blocks[id] || CONFIG.blocks[1];
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    onDown(e) {
        e.preventDefault();
        const p = this.getPos(e);
        this.touch.active = true;
        this.touch.startX = p.x;
        this.touch.startY = p.y;
        this.touch.mode = 'none';

        // Check Board
        for (let i = this.blocks.length - 1; i >= 0; i--) {
            const b = this.blocks[i];
            const size = CONFIG.gridBase;
            if (p.x >= b.x && p.x <= b.x + size &&
                p.y >= b.y && p.y <= b.y + size) {
                
                this.dragItem = this.blocks.splice(i, 1)[0];
                this.dragOffset = { x: p.x - b.x, y: p.y - b.y };
                this.touch.mode = 'drag';
                this.audio.play('pickup');
                return;
            }
        }

        // Check Inventory
        if (p.y > this.inventoryY) {
            let x = 20 + this.inventoryScroll;
            for (let id of this.inventoryItems) {
                const size = CONFIG.gridBase * 0.9;
                const y = this.inventoryY + (CONFIG.inventoryHeight - size)/2;
                
                if (p.x >= x && p.x <= x + size && p.y >= y && p.y <= y + size) {
                    // Create new instance from inventory
                    this.dragItem = { id: id, x: p.x - size/2, y: p.y - size/2 };
                    this.dragOffset = { x: size/2, y: size/2 };
                    this.touch.mode = 'drag';
                    this.audio.play('pickup');
                    return;
                }
                x += size + 20;
            }
            this.touch.mode = 'scroll';
            this.touch.scrollStart = this.inventoryScroll;
        }
    }

    onMove(e) {
        if (!this.touch.active) return;
        const p = this.getPos(e);

        if (this.touch.mode === 'none') {
            if (Math.hypot(p.x - this.touch.startX, p.y - this.touch.startY) > 5) {
                this.touch.mode = 'none';
            }
        }

        if (this.touch.mode === 'drag' && this.dragItem) {
            this.dragItem.x = p.x - this.dragOffset.x;
            this.dragItem.y = p.y - this.dragOffset.y;
        } 
        else if (this.touch.mode === 'scroll') {
            const dx = p.x - this.touch.startX;
            this.inventoryScroll = this.touch.scrollStart + dx;
            // Clamp
            const maxW = this.inventoryItems.length * (CONFIG.gridBase * 0.9 + 20) + 100;
            const minScroll = Math.min(0, this.width - maxW);
            if (this.inventoryScroll > 20) this.inventoryScroll = 20;
            if (this.inventoryScroll < minScroll) this.inventoryScroll = minScroll;
        }
    }

    onUp(e) {
        this.touch.active = false;
        
        if (this.dragItem) {
            const g = CONFIG.gridBase;
            
            // Merge Check
            let merged = false;
            for (let i = 0; i < this.blocks.length; i++) {
                const target = this.blocks[i];
                const c1 = { x: this.dragItem.x + g/2, y: this.dragItem.y + g/2 };
                const c2 = { x: target.x + g/2, y: target.y + g/2 };
                const dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                
                // Merge if close and same ID
                if (dist < g * 0.6 && target.id === this.dragItem.id && target.id < 10) {
                    target.id++;
                    const def = this.getBlockDef(target.id);
                    this.spawnParticles(c2.x, c2.y, def.color);
                    this.audio.play('merge', 120);
                    this.showGif('merge');
                    merged = true;
                    break;
                }
            }

            if (!merged) {
                if (this.dragItem.y > this.inventoryY - 50) {
                    // Dropped back in inventory - delete
                    this.spawnParticles(this.dragItem.x + g/2, this.dragItem.y + g/2, '#ccc');
                    this.audio.play('blocked', 0);
                } else {
                    // Snap to Grid
                    const snap = g/2; // Half grid snap
                    this.dragItem.x = Math.round(this.dragItem.x / snap) * snap;
                    this.dragItem.y = Math.round(this.dragItem.y / snap) * snap;
                    
                    // Bounds
                    if (this.dragItem.x < 0) this.dragItem.x = 0;
                    if (this.dragItem.y < 0) this.dragItem.y = 0;
                    if (this.dragItem.x + g > this.width) this.dragItem.x = this.width - g;
                    if (this.dragItem.y + g > this.inventoryY) this.dragItem.y = this.inventoryY - g;
                    
                    this.blocks.push(this.dragItem);
                    this.audio.play('uiClick');
                }
            }
            
            this.dragItem = null;
            this.checkRainbowMode();
        }
    }

    spawnParticles(x, y, color) {
        for(let i=0; i<15; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    }

    loop() {
        // Clear
        // Background handled by CSS, just clear canvas
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        // Beat Pulse
        const time = Date.now() / 1000;
        const beatTime = time * (CONFIG.bpm / 60);
        
        // Draw Grid (Subtle)
        const g = CONFIG.gridBase;
        this.ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        for(let x=0; x<this.width; x+=g/2) {
            this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.inventoryY);
        }
        for(let y=0; y<this.inventoryY; y+=g/2) {
            this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y);
        }
        this.ctx.stroke();

        // Draw Blocks
        this.blocks.forEach(b => this.drawBlock(b, beatTime));

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.update();
            p.draw(this.ctx);
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Inventory
        this.drawInventory(beatTime);

        // Dragged
        if (this.dragItem) {
            this.ctx.shadowColor = 'rgba(0,0,0,0.2)';
            this.ctx.shadowBlur = 20;
            this.ctx.shadowOffsetY = 10;
            this.drawBlock(this.dragItem, beatTime, 1.1, true);
            this.ctx.shadowBlur = 0;
            this.ctx.shadowOffsetY = 0;
        }

        requestAnimationFrame(this.loop);
    }

    drawInventory(beatTime) {
        // Inventory Background
        this.ctx.fillStyle = 'rgba(255,255,255,0.6)';
        this.ctx.fillRect(0, this.inventoryY, this.width, CONFIG.inventoryHeight);
        this.ctx.strokeStyle = '#fff';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath(); this.ctx.moveTo(0, this.inventoryY); this.ctx.lineTo(this.width, this.inventoryY); this.ctx.stroke();

        let x = 20 + this.inventoryScroll;
        for (let id of this.inventoryItems) {
            const size = CONFIG.gridBase * 0.9;
            const y = this.inventoryY + (CONFIG.inventoryHeight - size)/2;
            
            if (x + size > 0 && x < this.width) {
                this.drawBlock({id, x, y}, beatTime, 0.9);
            }
            x += size + 20;
        }
    }

    drawBlock(obj, beatTime, scaleMult = 1, isDrag = false) {
        const def = this.getBlockDef(obj.id);
        const g = CONFIG.gridBase * scaleMult;
        
        let bounce = 0;
        if (!isDrag) {
            // Bop to beat
            const beatPhase = beatTime % 1; 
            const impact = Math.sin(beatPhase * Math.PI); 
            bounce = -impact * 3;
        }

        const cx = obj.x + g/2;
        const cy = obj.y + g/2 + bounce;

        this.ctx.save();
        this.ctx.translate(cx, cy);
        
        // Block Body
        const r = 14 * scaleMult;
        
        // Rainbow effect for 7
        if (def.rainbow) {
            const grad = this.ctx.createLinearGradient(-g/2, -g/2, g/2, g/2);
            grad.addColorStop(0, '#ef4444');
            grad.addColorStop(0.2, '#f97316');
            grad.addColorStop(0.4, '#eab308');
            grad.addColorStop(0.6, '#22c55e');
            grad.addColorStop(0.8, '#3b82f6');
            grad.addColorStop(1, '#a855f7');
            this.ctx.fillStyle = grad;
        } else {
            this.ctx.fillStyle = def.color;
        }
        
        this.ctx.beginPath();
        if (this.ctx.roundRect) this.ctx.roundRect(-g/2, -g/2, g, g, r);
        else this.ctx.rect(-g/2, -g/2, g, g);
        this.ctx.fill();

        // 3D Shadow Lip
        this.ctx.fillStyle = 'rgba(0,0,0,0.15)';
        this.ctx.beginPath();
        const lip = 6 * scaleMult;
        if (this.ctx.roundRect) this.ctx.roundRect(-g/2, g/2 - lip, g, lip, [0,0,r,r]);
        else this.ctx.fillRect(-g/2, g/2 - lip, g, lip);
        this.ctx.fill();

        // Border and top shine
        this.ctx.lineWidth = 3;
        this.ctx.strokeStyle = def.border || 'rgba(0,0,0,0.1)';
        this.ctx.stroke();

        this.ctx.fillStyle = 'rgba(255,255,255,0.18)';
        this.ctx.beginPath();
        if (this.ctx.roundRect) this.ctx.roundRect(-g/2 + 6, -g/2 + 5, g - 12, g * 0.18, 999);
        else this.ctx.fillRect(-g/2 + 6, -g/2 + 5, g - 12, g * 0.18);
        this.ctx.fill();

        // Number (Top Center)
        this.ctx.fillStyle = obj.id === 10 ? '#ef4444' : '#ffffff';
        this.ctx.font = `900 ${g * 0.33}px "Bangers", "Rajdhani", sans-serif`;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(obj.id, 0, -g * 0.3);

        // Face
        this.drawFace(def, g);

        this.ctx.restore();
    }

    drawFace(def, size) {
        const eyeY = 0;
        const eyeX = size * 0.18;
        const eyeRad = size * 0.12;
        const blushY = size * 0.12;
        
        // Eyes
        this.ctx.fillStyle = '#fff';
        
        if (def.oneEye) {
            // Cyclops (Number 1)
            this.ctx.beginPath(); 
            this.ctx.arc(0, eyeY, eyeRad * 1.5, 0, Math.PI * 2); 
            this.ctx.fill();
            
            // Pupil
            this.ctx.fillStyle = '#000';
            this.ctx.beginPath(); 
            this.ctx.arc(0, eyeY, eyeRad * 0.6, 0, Math.PI * 2); 
            this.ctx.fill();
            this.ctx.fillStyle = '#fff';
            this.ctx.beginPath(); 
            this.ctx.arc(eyeRad*0.4, eyeY-eyeRad*0.4, eyeRad * 0.2, 0, Math.PI * 2); 
            this.ctx.fill();
        } 
        else if (def.glasses) {
            // Glasses (Number 2)
            this.ctx.strokeStyle = '#000';
            this.ctx.lineWidth = 4;
            
            // Left Lens
            this.ctx.beginPath(); this.ctx.arc(-eyeX, eyeY, eyeRad*1.2, 0, Math.PI*2); 
            this.ctx.fillStyle = 'rgba(255,255,255,0.8)'; this.ctx.fill(); this.ctx.stroke();
            
            // Right Lens
            this.ctx.beginPath(); this.ctx.arc(eyeX, eyeY, eyeRad*1.2, 0, Math.PI*2); 
            this.ctx.fillStyle = 'rgba(255,255,255,0.8)'; this.ctx.fill(); this.ctx.stroke();
            
            // Bridge
            this.ctx.beginPath(); this.ctx.moveTo(-eyeX + eyeRad*1.2, eyeY); this.ctx.lineTo(eyeX - eyeRad*1.2, eyeY); this.ctx.stroke();

            // Pupils
            this.ctx.fillStyle = '#000';
            this.ctx.beginPath(); this.ctx.arc(-eyeX, eyeY, eyeRad*0.4, 0, Math.PI*2); this.ctx.fill();
            this.ctx.beginPath(); this.ctx.arc(eyeX, eyeY, eyeRad*0.4, 0, Math.PI*2); this.ctx.fill();
        }
        else {
            // Standard Eyes
            if (def.squareEyes) {
                // Square Eyes (Number 4)
                this.ctx.fillRect(-eyeX - eyeRad, eyeY - eyeRad, eyeRad*2, eyeRad*2);
                this.ctx.fillRect(eyeX - eyeRad, eyeY - eyeRad, eyeRad*2, eyeRad*2);
            } else {
                // Round Eyes
                this.ctx.beginPath(); this.ctx.arc(-eyeX, eyeY, eyeRad, 0, Math.PI*2); this.ctx.fill();
                this.ctx.beginPath(); this.ctx.arc(eyeX, eyeY, eyeRad, 0, Math.PI*2); this.ctx.fill();
            }

            // Pupils
            this.ctx.fillStyle = '#000';
            this.ctx.beginPath(); this.ctx.arc(-eyeX, eyeY, eyeRad*0.4, 0, Math.PI*2); this.ctx.fill();
            this.ctx.beginPath(); this.ctx.arc(eyeX, eyeY, eyeRad*0.4, 0, Math.PI*2); this.ctx.fill();
        }

        // Cheeks
        this.ctx.fillStyle = 'rgba(255, 214, 160, 0.55)';
        this.ctx.beginPath();
        this.ctx.arc(-size * 0.22, blushY, size * 0.07, 0, Math.PI * 2);
        this.ctx.arc(size * 0.22, blushY, size * 0.07, 0, Math.PI * 2);
        this.ctx.fill();

        // Mouth
        this.ctx.strokeStyle = '#000';
        this.ctx.lineWidth = 3;
        this.ctx.lineCap = 'round';
        this.ctx.beginPath();
        this.ctx.arc(0, size * 0.2, size * 0.15, 0.2, Math.PI - 0.2);
        this.ctx.stroke();
    }
}

// Init
window.onload = () => {
    window.game = new Game();
};
</script>
