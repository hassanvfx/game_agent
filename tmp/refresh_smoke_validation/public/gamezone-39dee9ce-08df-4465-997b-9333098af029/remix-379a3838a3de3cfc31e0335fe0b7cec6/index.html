<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Runway Rush: Match the Order</title>
    <!-- [agent-note][stage4] approved-fonts: title-display -> Audiowide, ui-body -> Rajdhani from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #12081c;
            --bg-mid: #2a1037;
            --bg-bottom: #4c174e;
            --panel: rgba(31, 16, 46, 0.76);
            --panel-border: rgba(255, 183, 230, 0.48);
            --text: #fff7fd;
            --muted: #efd7f6;
            --hot-pink: #ff5bbd;
            --laser-pink: #ff8be2;
            --violet: #8d5bff;
            --aqua: #75f6ff;
            --shadow: rgba(8, 2, 18, 0.55);
            --success: #6af7a4;
            --danger: #ff7a98;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(255, 119, 207, 0.24), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
        }

        body {
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text);
        }

        button { font: inherit; }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 8%, rgba(255,255,255,0.12), transparent 22%),
                linear-gradient(180deg, rgba(255, 137, 217, 0.06), transparent 26%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(117, 246, 255, 0.08) 48%, transparent 52%) center/18rem 100% no-repeat,
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) center/3rem 100%;
            opacity: 0.45;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 91, 189, 0.22), transparent 10%),
                radial-gradient(circle at 80% 12%, rgba(117, 246, 255, 0.16), transparent 10%),
                radial-gradient(circle at 50% 90%, rgba(255, 139, 226, 0.14), transparent 14%);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }

        .glass-panel {
            background: linear-gradient(180deg, rgba(47, 22, 66, 0.86), rgba(23, 10, 37, 0.8));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06) inset,
                0 12px 34px var(--shadow),
                0 0 24px rgba(255, 91, 189, 0.18);
        }

        .fashion-font {
            font-family: 'Audiowide', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .ui-font {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            overflow: hidden;
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            width: min(32vw, 118px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.22);
            box-shadow: 0 12px 24px rgba(0,0,0,0.22);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.24s ease, transform 0.24s ease;
            background: rgba(18, 8, 28, 0.4);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #success-gif {
            top: max(78px, env(safe-area-inset-top) + 60px);
        }

        #fail-gif {
            bottom: calc(116px + env(safe-area-inset-bottom));
        }

        #request-banner {
            position: absolute;
            left: 50%;
            top: max(74px, env(safe-area-inset-top) + 56px);
            transform: translateX(-50%);
            min-width: min(72vw, 250px);
            padding: 9px 16px;
            border-radius: 999px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff7fd;
            z-index: 22;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        #request-banner.visible {
            opacity: 1;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: max(14px, env(safe-area-inset-top)) 14px 0;
            gap: 10px;
        }

        .hud-pill {
            min-width: 108px;
            padding: 10px 14px;
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .hud-label {
            font-size: 0.68rem;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--muted);
            opacity: 0.95;
        }

        #score {
            font-size: clamp(1.55rem, 5vw, 2.15rem);
            line-height: 1;
            color: #fff0a5;
            text-shadow: 0 0 12px rgba(255, 214, 90, 0.48);
        }

        .time-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255,255,255,0.14);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        #time-bar {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--aqua), var(--hot-pink));
            box-shadow: 0 0 14px rgba(117, 246, 255, 0.55);
            transition: width 0.2s linear;
        }

        /* [agent-note][stage2] preserve: control-zone | reason: bottom-centered controls already mobile-safe */
        #controls {
            pointer-events: auto;
            padding: 0 14px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .controls-shell {
            width: min(100%, 420px);
            padding: 12px;
            border-radius: 28px;
        }

        .type-row,
        .color-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .type-btn {
            min-width: 94px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
            color: var(--text);
            font-weight: 700;
            font-size: 0.86rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.22);
        }

        .type-btn:active { transform: scale(0.96); }

        .type-btn.selected {
            background: linear-gradient(135deg, rgba(117, 246, 255, 0.95), rgba(141, 91, 255, 0.92));
            color: #14081d;
            box-shadow: 0 0 18px rgba(117, 246, 255, 0.42);
        }

        .color-row {
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }

        .color-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.92);
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.24);
        }

        .color-btn:active { transform: scale(0.92); }

        .color-btn.selected {
            border-color: #111827;
            transform: scale(1.08);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.14), 0 0 16px currentColor;
        }

        .swatch-red { background: linear-gradient(180deg, #ff8a96, #ff4e78); color: #ff8a96; }
        .swatch-blue { background: linear-gradient(180deg, #82d8ff, #4286ff); color: #82d8ff; }
        .swatch-green { background: linear-gradient(180deg, #87ffbf, #16c77a); color: #87ffbf; }

        #sell-btn,
        .primary-btn {
            border: 0;
            cursor: pointer;
            color: white;
            border-radius: 999px;
            transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
        }

        #sell-btn {
            margin-top: 2px;
            width: min(100%, 280px);
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--hot-pink), #ff7d6c 52%, #ffd35a);
            box-shadow: 0 14px 32px rgba(255, 91, 189, 0.32);
            font-size: 1.35rem;
            line-height: 1;
            text-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }

        #sell-btn:active,
        .primary-btn:active {
            transform: scale(0.97);
            filter: brightness(1.04);
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }

        #start-screen {
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 32%),
                rgba(7, 1, 15, 0.34);
            backdrop-filter: blur(4px);
        }

        #game-over-screen {
            background: rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(8px);
        }

        .screen-card {
            width: min(100%, 360px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px 22px 20px;
            border-radius: 28px;
            text-align: center;
            gap: 14px;
        }

        .screen-copy {
            overflow-y: auto;
        }

        .title-badge {
            display: inline-flex;
            align-self: center;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(117, 246, 255, 0.12);
            border: 1px solid rgba(117, 246, 255, 0.25);
            color: var(--aqua);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .screen h1,
        .screen h2 {
            margin: 0;
            line-height: 0.95;
            font-size: clamp(2.2rem, 9vw, 3.35rem);
            color: white;
            text-shadow: 0 0 14px rgba(255, 91, 189, 0.35);
        }

        .screen p,
        .screen .subline {
            margin: 0;
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.45;
        }

        .primary-btn {
            position: sticky;
            bottom: 0;
            align-self: center;
            min-width: 190px;
            padding: 14px 22px;
            background: linear-gradient(135deg, var(--violet), var(--hot-pink));
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 12px 26px rgba(141, 91, 255, 0.35);
        }

        #finalScore {
            color: #fff0a5;
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            text-shadow: 0 0 12px rgba(255, 214, 90, 0.4);
        }

        .screen-character {
            width: 88px;
            height: 88px;
            margin: 0 auto 4px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 50% 34%, #ffe4b9 0 22%, transparent 23%),
                radial-gradient(circle at 50% 28%, #3e2045 0 32%, transparent 33%),
                radial-gradient(circle at 50% 68%, #ff5bbd 0 28%, transparent 29%),
                radial-gradient(circle at 35% 72%, rgba(255,255,255,0.9) 0 4%, transparent 5%),
                radial-gradient(circle at 65% 72%, rgba(255,255,255,0.9) 0 4%, transparent 5%),
                radial-gradient(circle at 50% 50%, rgba(117,246,255,0.3), transparent 72%),
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            border: 2px solid rgba(255,255,255,0.16);
            box-shadow: 0 0 28px rgba(255, 91, 189, 0.28);
        }

        .screen-character::before,
        .screen-character::after {
            content: "";
            position: absolute;
            top: 38px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #231126;
        }

        .screen-character::before { left: 28px; }
        .screen-character::after { right: 28px; }

        .pulse-hit {
            animation: pulseHit 0.2s ease;
        }

        @keyframes pulseHit {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.01); filter: brightness(1.12); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @media (max-width: 520px) {
            .hud-pill {
                min-width: 94px;
                padding: 9px 12px;
            }

            .hud-label {
                font-size: 0.62rem;
                letter-spacing: 0.18em;
            }

            #controls {
                gap: 8px;
            }

            .controls-shell {
                padding: 10px;
                border-radius: 24px;
            }

            .type-btn {
                min-width: 82px;
                font-size: 0.78rem;
                padding: 9px 12px;
            }

            .color-btn {
                width: 42px;
                height: 42px;
            }

            #sell-btn {
                width: min(100%, 240px);
                padding: 13px 16px;
                font-size: 1.15rem;
            }

            .screen-card {
                padding: 20px 18px 18px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- [agent-note][stage3] resolved-gif: success/fail feedback overlays -> catalogs/gifs.json -->
        <div id="feedback-layer" aria-hidden="true">
            <img id="success-gif" class="feedback-gif" alt="" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
            <img id="fail-gif" class="feedback-gif" alt="" src="https://i.giphy.com/HdMNmMm7tHd1bs4VeQ.webp">
        </div>

        <div id="request-banner" class="glass-panel fashion-font" aria-live="polite"></div>

        <!-- UI Layer -->
        <div id="ui-layer">
            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="glass-panel hud-pill">
                    <span class="hud-label">Score</span>
                    <span id="score" class="fashion-font">0</span>
                </div>
                <div class="glass-panel hud-pill" style="width: 132px;">
                    <span class="hud-label">Rush</span>
                    <div class="time-track">
                        <div id="time-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls" class="hidden">
                <div class="glass-panel controls-shell">
                    <div class="type-row">
                        <button class="type-btn" data-type="dress">Dress</button>
                        <button class="type-btn" data-type="skirt">Skirt</button>
                        <button class="type-btn" data-type="pants">Pants</button>
                    </div>
                    <div class="color-row">
                        <button class="color-btn swatch-red" data-color="red" aria-label="Select red outfit"></button>
                        <button class="color-btn swatch-blue" data-color="blue" aria-label="Select blue outfit"></button>
                        <button class="color-btn swatch-green" data-color="green" aria-label="Select green outfit"></button>
                    </div>
                </div>
                <button id="sell-btn" class="fashion-font">Send Look</button>
            </div>

            <!-- Screens -->
            <div id="start-screen" class="screen">
                <div class="glass-panel screen-card">
                    <div class="screen-copy">
                        <div class="title-badge">Neon Runway Shift</div>
                        <div class="screen-character" aria-hidden="true"></div>
                        <h1 class="fashion-font">Runway Rush</h1>
                        <p>Build the requested look before your VIP client struts off the neon catwalk.</p>
                    </div>
                    <button id="start-btn" class="primary-btn">Start Shift</button>
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <div class="glass-panel screen-card">
                    <div class="screen-copy">
                        <div class="title-badge">Show Wrap</div>
                        <h2 class="fashion-font">Shift Complete!</h2>
                        <div class="subline">Style Score</div>
                        <div id="finalScore">$0</div>
                    </div>
                    <button id="restart-btn" class="primary-btn">Run Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                select: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                complete: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
                fail: "https://i.giphy.com/HdMNmMm7tHd1bs4VeQ.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.bgmStarted = false;
                this.sfx = {};
                this.sfxVolume = {
                    score: 0.8,
                    fail: 0.72,
                    select: 0.45,
                    start: 0.64,
                    complete: 0.82
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                if (this.ready) return;
                this.ready = true;
                try {
                    this.bgm.load();
                    Object.values(this.sfx).forEach(sound => sound.load());
                } catch (_) {}
            }

            playBGM(reset = false) {
                if (!this.ready) return;
                if (reset) {
                    this.bgm.currentTime = 0;
                }
                if (this.bgmStarted && !this.bgm.paused && !reset) return;
                this.bgmStarted = true;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.bgmStarted = false;
            }

            playSFX(key) {
                if (!this.ready || !this.sfx[key]) return;
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfxVolume[key] ?? 0.7;
                clone.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.banner = document.getElementById("request-banner");
                this.gifs = {
                    success: document.getElementById("success-gif"),
                    fail: document.getElementById("fail-gif")
                };
                this.hideTimers = {};
                this.setBanner("");
            }

            setBanner(text) {
                this.banner.textContent = text;
                this.banner.classList.toggle("visible", Boolean(text));
            }

            flash(type, duration = 950) {
                const node = this.gifs[type];
                if (!node) return;
                node.src = ASSETS.gifs[type];
                node.classList.add("show");
                clearTimeout(this.hideTimers[type]);
                this.hideTimers[type] = setTimeout(() => {
                    node.classList.remove("show");
                }, duration);
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let gameActive = false;
        let score = 0;
        let timeLeft = 100;
        let lastTime = 0;
        let difficultyMultiplier = 1.0;

        // Outfit State
        let currentOutfit = { type: 'dress', color: 'red' };
        let targetOutfit = { type: 'dress', color: 'red' };

        // Visual State
        let particles = [];
        let customerX = 2000;
        let customerTargetX = 0;
        let customerState = 'entering';

        const COLORS = {
            red: '#ff6788',
            blue: '#5ec8ff',
            green: '#4df0a3',
            skin: '#fde6b0'
        };

        const TYPES = ['dress', 'skirt', 'pants'];
        const COLOR_KEYS = ['red', 'blue', 'green'];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            customerTargetX = width * 0.75;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. GAME LOGIC HELPER */
        function generateRequest() {
            const type = TYPES[Math.floor(Math.random() * TYPES.length)];
            const color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
            targetOutfit = { type, color };

            customerX = width + 200;
            customerState = "entering";
            feedback.setBanner(`VIP wants ${color} ${type}`);
        }

        function spawnParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color
                });
            }
        }

        /** 5. DRAWING FUNCTIONS */
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#15081f');
            gradient.addColorStop(0.52, '#331245');
            gradient.addColorStop(1, '#4a1553');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const glow = ctx.createRadialGradient(width * 0.5, height * 0.22, 20, width * 0.5, height * 0.7, width * 0.45);
            glow.addColorStop(0, 'rgba(255, 232, 161, 0.18)');
            glow.addColorStop(0.35, 'rgba(255, 114, 200, 0.10)');
            glow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            const floorGradient = ctx.createLinearGradient(0, height * 0.72, 0, height);
            floorGradient.addColorStop(0, '#311033');
            floorGradient.addColorStop(1, '#110616');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, height * 0.78, width, height * 0.22);

            ctx.save();
            ctx.strokeStyle = 'rgba(117, 246, 255, 0.18)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 12; i++) {
                const y = height * 0.78 + i * ((height * 0.22) / 12);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const leftSpot = ctx.createRadialGradient(width * 0.28, 0, 30, width * 0.28, height * 0.78, 260);
            leftSpot.addColorStop(0, 'rgba(255,255,255,0.62)');
            leftSpot.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = leftSpot;
            ctx.beginPath();
            ctx.moveTo(width * 0.18, 0);
            ctx.lineTo(width * 0.38, 0);
            ctx.lineTo(width * 0.50, height);
            ctx.lineTo(width * 0.08, height);
            ctx.fill();

            const rightSpot = ctx.createRadialGradient(width * 0.76, 0, 30, width * 0.76, height * 0.78, 260);
            rightSpot.addColorStop(0, 'rgba(117,246,255,0.34)');
            rightSpot.addColorStop(1, 'rgba(117,246,255,0)');
            ctx.fillStyle = rightSpot;
            ctx.beginPath();
            ctx.moveTo(width * 0.68, 0);
            ctx.lineTo(width * 0.84, 0);
            ctx.lineTo(width * 0.94, height);
            ctx.lineTo(width * 0.58, height);
            ctx.fill();
            ctx.restore();
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            const step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawMannequin(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.shadowColor = 'rgba(255, 91, 189, 0.3)';
            ctx.shadowBlur = 26;

            ctx.fillStyle = '#8c8fa3';
            ctx.fillRect(-5, 300, 10, 100);
            ctx.beginPath();
            ctx.ellipse(0, 402, 66, 22, 0, 0, Math.PI * 2);
            ctx.fill();

            const bodyGradient = ctx.createLinearGradient(0, -70, 0, 230);
            bodyGradient.addColorStop(0, '#fff2ff');
            bodyGradient.addColorStop(1, '#d9d8e9');
            ctx.fillStyle = bodyGradient;
            ctx.strokeStyle = 'rgba(110, 92, 135, 0.7)';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.arc(0, -52, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-30, -20);
            ctx.lineTo(30, -20);
            ctx.lineTo(25, 100);
            ctx.lineTo(35, 200);
            ctx.lineTo(-35, 200);
            ctx.lineTo(-25, 100);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillRect(-30, 200, 25, 150);
            ctx.fillRect(5, 200, 25, 150);
            ctx.strokeRect(-30, 200, 25, 150);
            ctx.strokeRect(5, 200, 25, 150);

            const outfitGradient = ctx.createLinearGradient(0, -20, 0, 320);
            outfitGradient.addColorStop(0, COLORS[currentOutfit.color]);
            outfitGradient.addColorStop(1, 'rgba(255,255,255,0.15)');
            ctx.fillStyle = outfitGradient;
            ctx.shadowColor = COLORS[currentOutfit.color];
            ctx.shadowBlur = 20;

            if (currentOutfit.type === 'dress') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(60, 280);
                ctx.quadraticCurveTo(0, 300, -60, 280);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.moveTo(0, 4);
                ctx.lineTo(0, 248);
                ctx.stroke();
            } else if (currentOutfit.type === 'skirt') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-27, 100);
                ctx.lineTo(27, 100);
                ctx.lineTo(60, 240);
                ctx.quadraticCurveTo(0, 250, -60, 240);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.moveTo(-27, 100);
                ctx.lineTo(27, 100);
                ctx.stroke();
            } else if (currentOutfit.type === 'pants') {
                ctx.beginPath();
                ctx.moveTo(-32, -18);
                ctx.lineTo(32, -18);
                ctx.lineTo(27, 100);
                ctx.lineTo(-27, 100);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-27, 100);
                ctx.lineTo(27, 100);
                ctx.lineTo(35, 200);
                ctx.lineTo(30, 350);
                ctx.lineTo(5, 350);
                ctx.lineTo(0, 230);
                ctx.lineTo(-5, 350);
                ctx.lineTo(-30, 350);
                ctx.lineTo(-35, 200);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.moveTo(0, 100);
                ctx.lineTo(0, 340);
                ctx.stroke();
            }

            drawStar(-48, 10, 5, 12, 6, 'rgba(255,255,255,0.34)');
            drawStar(48, 34, 5, 10, 5, 'rgba(117,246,255,0.34)');

            ctx.restore();
        }

        function drawRequestIcon(cx, cy) {
            ctx.fillStyle = COLORS[targetOutfit.color];
            ctx.strokeStyle = 'rgba(19,10,28,0.18)';
            ctx.lineWidth = 2;

            if (targetOutfit.type === 'dress') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - 20);
                ctx.lineTo(cx + 17, cy + 30);
                ctx.lineTo(cx - 17, cy + 30);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (targetOutfit.type === 'skirt') {
                ctx.beginPath();
                ctx.moveTo(cx - 18, cy);
                ctx.lineTo(cx + 18, cy);
                ctx.lineTo(cx + 24, cy + 30);
                ctx.lineTo(cx - 24, cy + 30);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (targetOutfit.type === 'pants') {
                ctx.fillRect(cx - 12, cy - 10, 10, 40);
                ctx.fillRect(cx + 2, cy - 10, 10, 40);
                ctx.strokeRect(cx - 12, cy - 10, 10, 40);
                ctx.strokeRect(cx + 2, cy - 10, 10, 40);
            }
        }

        function drawCustomer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            const customerGradient = ctx.createLinearGradient(0, -110, 0, 220);
            customerGradient.addColorStop(0, '#74f3ff');
            customerGradient.addColorStop(1, '#7e52ff');
            ctx.fillStyle = customerGradient;
            ctx.shadowColor = 'rgba(117, 246, 255, 0.28)';
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.arc(0, -102, 35, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-20, -65);
            ctx.quadraticCurveTo(-44, -60, -52, 0);
            ctx.lineTo(-40, 200);
            ctx.lineTo(40, 200);
            ctx.lineTo(52, 0);
            ctx.quadraticCurveTo(44, -60, 20, -65);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath();
            ctx.arc(-10, -112, 8, 0, Math.PI * 2);
            ctx.fill();

            if (customerState === 'waiting' || customerState === 'entering') {
                ctx.save();
                ctx.translate(-114, -194);

                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath();
                ctx.moveTo(88, 82);
                ctx.lineTo(112, 104);
                ctx.lineTo(106, 72);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.97)';
                ctx.strokeStyle = 'rgba(117, 91, 155, 0.24)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(0, 0, 132, 88, 18);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#351741';
                ctx.font = '700 12px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('NEXT LOOK', 66, 18);

                drawRequestIcon(66, 50);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(p.x + 2, p.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.life -= 0.02;

                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;
        }

        /** 6. GAME LOOP */
        function initGame() {
            score = 0;
            timeLeft = 100;
            difficultyMultiplier = 1.0;
            particles = [];
            document.getElementById("score").innerText = score;
            document.getElementById("time-bar").style.width = "100%";
            generateRequest();

            document.querySelectorAll('.type-btn').forEach(b => {
                if (b.dataset.type === 'dress') b.classList.add('selected');
                else b.classList.remove('selected');
            });
            document.querySelectorAll('.color-btn').forEach(b => {
                if (b.dataset.color === 'red') b.classList.add('selected');
                else b.classList.remove('selected');
            });
            currentOutfit = { type: 'dress', color: 'red' };
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, width, height);
            drawBackground();
            drawMannequin(width * 0.3, height * 0.4, 0.8);

            if (customerState === 'entering') {
                customerX += (customerTargetX - customerX) * 0.05;
                if (Math.abs(customerX - customerTargetX) < 5) {
                    customerState = 'waiting';
                }
            } else if (customerState === 'leaving_happy') {
                customerX += 15;
                if (customerX > width + 200) generateRequest();
            } else if (customerState === 'leaving_sad') {
                customerX += 15;
                if (customerX > width + 200) generateRequest();
            }

            drawCustomer(customerX, height * 0.6);
            drawParticles();

            if (customerState === 'waiting') {
                timeLeft -= 0.05 * difficultyMultiplier;
                document.getElementById('time-bar').style.width = `${Math.max(0, timeLeft)}%`;

                if (timeLeft <= 0) {
                    gameOver();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function flashContainer() {
            const container = document.getElementById('game-container');
            container.classList.remove('pulse-hit');
            void container.offsetWidth;
            container.classList.add('pulse-hit');
            setTimeout(() => container.classList.remove('pulse-hit'), 220);
        }

        function checkMatch() {
            if (customerState !== 'waiting') return;

            if (currentOutfit.type === targetOutfit.type && currentOutfit.color === targetOutfit.color) {
                score += 100;
                timeLeft = Math.min(100, timeLeft + 15);
                difficultyMultiplier += 0.05;
                audio.playSFX("score");
                audio.playSFX("complete");
                document.getElementById("score").innerText = score;
                spawnParticles(width * 0.3, height * 0.4, COLORS[currentOutfit.color]);
                feedback.flash("success");
                customerState = "leaving_happy";
            } else {
                timeLeft -= 20;
                audio.playSFX("fail");
                feedback.flash("fail");
                flashContainer();
            }
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX("fail");
            feedback.flash("fail", 1200);
            feedback.setBanner("Last call on the runway");
            document.getElementById("hud").classList.add("hidden");
            document.getElementById("controls").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            document.getElementById("finalScore").innerText = `$${score}`;
        }

        /** 7. CONTROLS SETUP */
        document.getElementById("start-btn").addEventListener("click", () => {
            audio.unlock();
            audio.playSFX("start");
            audio.playBGM(true);
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            document.getElementById("controls").classList.remove("hidden");
            document.getElementById("controls").classList.add("flex");
            gameActive = true;
            initGame();
            lastTime = performance.now();
            gameLoop(lastTime);
        });

        document.getElementById("restart-btn").addEventListener("click", () => {
            audio.unlock();
            audio.playSFX("start");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            document.getElementById("controls").classList.remove("hidden");
            audio.playBGM(true);
            gameActive = true;
            initGame();
            lastTime = performance.now();
            gameLoop(lastTime);
        });

        document.querySelectorAll(".type-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                audio.playSFX("select");
                document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("selected"));
                e.currentTarget.classList.add("selected");
                currentOutfit.type = e.currentTarget.dataset.type;
            });
        });

        document.querySelectorAll(".color-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                audio.playSFX("select");
                document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
                e.currentTarget.classList.add("selected");
                currentOutfit.color = e.currentTarget.dataset.color;
            });
        });

        document.getElementById('sell-btn').addEventListener('click', checkMatch);
    });
    </script>
</body>
