<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Hex Ludo 6</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Orbitron + Exo 2) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #07111f;
            --bg-mid: #10233c;
            --panel: rgba(8, 18, 37, 0.78);
            --panel-strong: rgba(14, 30, 56, 0.92);
            --line: rgba(130, 227, 255, 0.34);
            --line-strong: rgba(130, 227, 255, 0.68);
            --text: #e9f7ff;
            --muted: rgba(219, 240, 255, 0.72);
            --glow: rgba(69, 211, 255, 0.36);
            --warm: #ffd166;
            --danger: #ff6b81;
            --success: #64f5b3;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Exo 2', sans-serif;
            background:
                radial-gradient(circle at top, rgba(54, 112, 206, 0.28), transparent 38%),
                radial-gradient(circle at bottom, rgba(91, 255, 211, 0.14), transparent 28%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            cursor: pointer;
        }

        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .z-50 { z-index: 50; }
        .select-none { user-select: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .text-center { text-align: center; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-4 { padding: 1rem; }

        #game-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at center, rgba(54, 112, 206, 0.16) 0, transparent 42%),
                linear-gradient(180deg, rgba(3, 8, 16, 0.18), rgba(3, 8, 16, 0.68));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, rgba(130, 227, 255, 0.045) 1px, transparent 1px),
                linear-gradient(0deg, rgba(130, 227, 255, 0.035) 1px, transparent 1px);
            background-size: 38px 38px;
            opacity: 0.45;
            mix-blend-mode: screen;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.18) 0 2px, transparent 3px),
                radial-gradient(circle at 75% 28%, rgba(255, 255, 255, 0.12) 0 1px, transparent 2px),
                radial-gradient(circle at 62% 76%, rgba(255, 255, 255, 0.16) 0 2px, transparent 3px);
            opacity: 0.55;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(15, 31, 58, 0.94), rgba(7, 18, 37, 0.86));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 12px 28px rgba(0, 0, 0, 0.42),
                0 0 20px rgba(69, 211, 255, 0.12);
        }

        .hud-card {
            min-width: 110px;
            padding: 0.7rem 0.9rem;
            border-radius: 1rem;
        }

        .hud-label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.63rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.2rem;
        }

        .hud-value {
            font-size: 1.28rem;
            font-weight: 600;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }

        #ui-layer {
            gap: 0.75rem;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            width: 100%;
            gap: 0.75rem;
        }

        #hud > .glass-panel {
            flex: 1 1 0;
        }

        #controls {
            width: 100%;
            margin-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        #dice-btn {
            width: 5.8rem;
            height: 5.8rem;
            border-radius: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 35% 28%, rgba(255,255,255,0.24), transparent 36%),
                linear-gradient(180deg, rgba(22, 54, 97, 0.96), rgba(10, 23, 46, 0.98));
            border: 1px solid rgba(157, 240, 255, 0.46);
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.38),
                0 0 22px rgba(77, 216, 255, 0.22),
                inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform 140ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        #dice-btn:hover {
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.42),
                0 0 28px rgba(77, 216, 255, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.15);
        }

        #dice-btn:active {
            transform: scale(0.95);
            filter: brightness(1.08);
        }

        #dice-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            color: #f3fdff;
            text-shadow:
                0 0 18px rgba(125, 234, 255, 0.38),
                0 0 4px rgba(255,255,255,0.28);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 1rem;
        }

        .feedback-gif {
            position: absolute;
            right: clamp(0.65rem, 2vw, 1rem);
            bottom: calc(max(6.6rem, env(safe-area-inset-bottom) + 6rem));
            width: clamp(4.6rem, 18vw, 7rem);
            aspect-ratio: 1;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(130, 227, 255, 0.28);
            background: rgba(4, 14, 29, 0.8);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(0.65rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 30;
        }

        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .feedback-caption {
            position: absolute;
            left: 50%;
            bottom: 0.3rem;
            transform: translateX(-50%);
            padding: 0.18rem 0.45rem;
            border-radius: 999px;
            background: rgba(2, 10, 22, 0.72);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.52rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #eafcff;
            white-space: nowrap;
        }

        .turn-banner {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 1rem);
            left: 50%;
            transform: translate(-50%, -1rem);
            min-width: min(70vw, 18rem);
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.74rem, 2.8vw, 0.95rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            color: #eafcff;
            background: rgba(6, 19, 38, 0.78);
            border: 1px solid rgba(130, 227, 255, 0.28);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 28;
        }

        .turn-banner.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .screen-shell {
            width: min(100%, 28rem);
            padding: 1.35rem;
            border-radius: 1.7rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .screen-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(130, 227, 255, 0.11), transparent 44%),
                radial-gradient(circle at top right, rgba(255, 209, 102, 0.2), transparent 28%);
            pointer-events: none;
        }

        .screen-inner {
            position: relative;
            z-index: 1;
        }

        .character-badge {
            width: 5.2rem;
            height: 5.2rem;
            margin: 0 auto 0.85rem;
            border-radius: 1.4rem;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.24), transparent 38%),
                linear-gradient(180deg, rgba(15, 54, 108, 1), rgba(6, 26, 56, 1));
            border: 1px solid rgba(150, 235, 255, 0.52);
            box-shadow:
                0 0 26px rgba(69, 211, 255, 0.24),
                inset 0 1px 0 rgba(255,255,255,0.14);
            animation: squadPulse 2.8s ease-in-out infinite;
        }

        .character-badge span {
            font-size: 2.7rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
        }

        .headline {
            margin: 0 0 0.35rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 6vw, 2.65rem);
            line-height: 1.04;
            letter-spacing: 0.06em;
            color: #d8f7ff;
            text-shadow: 0 0 18px rgba(69, 211, 255, 0.25);
        }

        .subhead {
            margin: 0 0 1.05rem;
            font-size: 1rem;
            line-height: 1.25;
            color: var(--muted);
        }

        .squad-strip {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.42rem;
            margin: 0 auto 1rem;
            max-width: 20rem;
        }

        .squad-chip {
            padding: 0.4rem 0;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.09);
            font-size: 0.92rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .action-btn {
            min-height: 3rem;
            padding: 0.95rem 1.2rem;
            border-radius: 999px;
            width: 100%;
            max-width: 15rem;
            background:
                linear-gradient(90deg, #1e69ff, #41d9ff 62%, #8affd5);
            color: #04111d;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 12px 26px rgba(9, 71, 168, 0.34),
                0 0 22px rgba(77, 216, 255, 0.24);
            transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
        }

        .action-btn:hover { filter: brightness(1.04); }
        .action-btn:active { transform: scale(0.97); }

        #start-screen {
            background: linear-gradient(180deg, rgba(2, 10, 20, 0.74), rgba(2, 8, 17, 0.92));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #game-over-screen {
            background: linear-gradient(180deg, rgba(2, 8, 16, 0.78), rgba(0, 0, 0, 0.92));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .victory-title {
            color: var(--warm);
        }

        .status-glow {
            color: var(--text);
        }

        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes squadPulse {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow:
                    0 0 20px rgba(69, 211, 255, 0.22),
                    inset 0 1px 0 rgba(255,255,255,0.14);
            }
            50% {
                transform: translateY(-3px) scale(1.03);
                box-shadow:
                    0 0 28px rgba(69, 211, 255, 0.32),
                    0 0 14px rgba(255, 209, 102, 0.18),
                    inset 0 1px 0 rgba(255,255,255,0.18);
            }
        }

        .rolling { animation: roll 0.2s linear infinite; }

        @media (max-width: 640px) {
            .hud-card { min-width: 0; padding: 0.68rem 0.8rem; }
            .hud-value { font-size: 1.05rem; }
            .hud-label { font-size: 0.58rem; }
            .screen-shell { padding: 1.1rem; border-radius: 1.35rem; }
            .subhead { font-size: 0.95rem; margin-bottom: 0.9rem; }
            .character-badge {
                width: 4.6rem;
                height: 4.6rem;
                margin-bottom: 0.7rem;
            }
            .character-badge span { font-size: 2.35rem; }
            #dice-btn {
                width: 5.3rem;
                height: 5.3rem;
                border-radius: 1.45rem;
            }
            #dice-val { font-size: 2.3rem; }
            .action-btn { font-size: 0.9rem; }
            .feedback-gif {
                right: 0.6rem;
                bottom: calc(max(6.1rem, env(safe-area-inset-bottom) + 5.8rem));
                width: 4.7rem;
            }
            .feedback-caption { font-size: 0.48rem; }
            .turn-banner { top: calc(env(safe-area-inset-top) + 0.8rem); min-width: 66vw; }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full select-none">
        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between pointer-events-none p-4">
            <!-- [agent-note][stage3] resolved-gif: clash+victory feedback -> catalogs/gifs.json -->
            <div id="turn-banner" class="turn-banner" aria-live="polite"></div>
            <div id="feedback-gif" class="feedback-gif" aria-hidden="true">
                <img id="feedback-gif-img" alt="Match reaction overlay">
                <div id="feedback-gif-caption" class="feedback-caption">Clash</div>
            </div>
            <!-- Top HUD -->
            <div id="hud" class="flex justify-between items-start hidden">
                <div class="glass-panel hud-card">
                    <span class="hud-label">Turn</span>
                    <div id="turn-indicator" class="hud-value">Player 1</div>
                </div>
                <div class="glass-panel hud-card">
                    <span class="hud-label">Action</span>
                    <div id="status-text" class="hud-value status-glow">Roll Dice</div>
                </div>
            </div>

            <!-- Bottom Controls (Dice) -->
            <div id="controls" class="flex justify-center hidden pointer-events-auto">
                <button id="dice-btn" aria-label="Roll dice">
                    <div id="dice-val">🎲</div>
                </button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen">
            <div class="glass-panel screen-shell">
                <div class="screen-inner">
                    <div class="character-badge" aria-hidden="true"><span>🛡️</span></div>
                    <h1 class="headline">Hex Command</h1>
                    <p class="subhead">Guide six neon squads around the command ring. Roll a 6 to deploy from base and outmaneuver rival captains.</p>
                    <div class="squad-strip" aria-hidden="true">
                        <div class="squad-chip">🔴</div>
                        <div class="squad-chip">🔵</div>
                        <div class="squad-chip">🟢</div>
                        <div class="squad-chip">🟡</div>
                        <div class="squad-chip">🔷</div>
                        <div class="squad-chip">🟣</div>
                    </div>
                    <button id="start-btn" class="action-btn">Start Match</button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden overlay-screen">
            <div class="glass-panel screen-shell">
                <div class="screen-inner">
                    <div class="character-badge" aria-hidden="true"><span>🏆</span></div>
                    <h2 class="headline victory-title">Mission Complete</h2>
                    <div class="subhead" id="winner-name">Red Squad</div>
                    <button id="restart-btn" class="action-btn">Run Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            victoryLoop: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                move: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                deploy: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3",
                kill: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
                blocked: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                turn: "https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3"
            },
            gifs: {
                clash: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp",
                victory: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
            }
        };

        const SQUAD_EMOJIS = ["🔴", "🔵", "🟢", "🟡", "🔷", "🟣"];
        const HAZARD_COLORS = ["#ff8aa1", "#8dc8ff", "#7dffc3", "#ffe087", "#90f3ff", "#c8a2ff"];

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.lastPlayedAt = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';

                this.victoryLoop = new Audio(ASSETS.victoryLoop);
                this.victoryLoop.loop = true;
                this.victoryLoop.volume = 0.2;
                this.victoryLoop.preload = 'auto';

                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                if (this.unlocked) return;
                this.unlocked = true;
                this.bgm.load();
                this.victoryLoop.load();
                Object.values(this.sfx).forEach(audio => audio.load());
            }
            startMatchLoop() {
                if (!this.unlocked) return;
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            stopAllLoops() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
            }
            playVictoryLoop() {
                if (!this.unlocked) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.victoryLoop.play().catch(() => {});
            }
            playSFX(key, options = {}) {
                if (!this.unlocked || !this.sfx[key]) return;
                const now = performance.now();
                const minGap = options.minGap ?? 120;
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < minGap) return;
                this.lastPlayedAt[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = options.volume ?? 0.62;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();

        /** 3. GAME CONSTANTS & STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let activePointerId = null;
        let width, height, centerX, centerY, scale;

        const PLAYERS = [
            { id: 0, name: "Red Squad", color: "#EF4444", glow: "#ff8a92", baseAngle: 0, emoji: "🔴" },
            { id: 1, name: "Blue Squad", color: "#3B82F6", glow: "#7db7ff", baseAngle: 60, emoji: "🔵" },
            { id: 2, name: "Green Squad", color: "#10B981", glow: "#78ffc3", baseAngle: 120, emoji: "🟢" },
            { id: 3, name: "Yellow Squad", color: "#F59E0B", glow: "#ffd97c", baseAngle: 180, emoji: "🟡" },
            { id: 4, name: "Cyan Squad", color: "#06B6D4", glow: "#7df4ff", baseAngle: 240, emoji: "🔷" },
            { id: 5, name: "Purple Squad", color: "#8B5CF6", glow: "#ceb2ff", baseAngle: 300, emoji: "🟣" }
        ];

        const STEPS_PER_ARM = 8;
        const TOTAL_STEPS = STEPS_PER_ARM * 6;
        const HOME_RUN_LENGTH = 5;

        let gameActive = false;
        let pieces = [];
        let currentPlayerIndex = 0;
        let diceValue = 1;
        let turnState = 'ROLL';
        let animationQueue = [];
        let parallaxOffset = 0;
        let feedbackTimer = null;
        let turnBannerTimer = null;

        /** 4. INITIALIZATION & RESIZE */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            scale = Math.min(width, height) / 800;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            pieces = [];
            for (let p = 0; p < 6; p++) {
                for (let i = 0; i < 4; i++) {
                    pieces.push({
                        playerId: p,
                        pieceId: i,
                        pos: -1,
                        state: 'BASE',
                        displayX: 0,
                        displayY: 0
                    });
                }
            }
            currentPlayerIndex = 0;
            turnState = 'ROLL';
            diceValue = 6;
            hideFeedbackGif();
            updateUI();
            showTurnBanner(`${PLAYERS[currentPlayerIndex].emoji} ${PLAYERS[currentPlayerIndex].name} online`);
        }

        /** 5. GEOMETRY HELPERS */
        function getBoardNode(type, index, playerId = 0) {
            const armRadius = 250 * scale;
            const innerRadius = 120 * scale;

            if (type === 'BASE') {
                const angle = (PLAYERS[playerId].baseAngle - 30) * (Math.PI / 180);
                const r = 320 * scale;
                const px = (index % 2 === 0 ? -15 : 15) * scale;
                const py = (index < 2 ? -15 : 15) * scale;
                return {
                    x: centerX + Math.cos(angle) * r + px,
                    y: centerY + Math.sin(angle) * r + py
                };
            }

            if (type === 'TRACK') {
                const angleStep = (360 / TOTAL_STEPS);
                const finalAngle = (index * angleStep);
                const rad = finalAngle * (Math.PI / 180);
                return {
                    x: centerX + Math.cos(rad) * innerRadius,
                    y: centerY + Math.sin(rad) * innerRadius
                };
            }

            if (type === 'HOME') {
                const pAngle = PLAYERS[playerId].baseAngle * (Math.PI / 180);
                const startR = innerRadius - (20 * scale);
                const endR = 20 * scale;
                const r = startR - (index * ((startR - endR) / (HOME_RUN_LENGTH - 1)));
                return {
                    x: centerX + Math.cos(pAngle) * r,
                    y: centerY + Math.sin(pAngle) * r
                };
            }
        }

        /** 6. GAME LOGIC METHODS */
        function showFeedbackGif(kind, caption) {
            const wrap = document.getElementById('feedback-gif');
            const img = document.getElementById('feedback-gif-img');
            const label = document.getElementById('feedback-gif-caption');
            if (!wrap || !img || !label || !ASSETS.gifs[kind]) return;

            img.src = ASSETS.gifs[kind];
            label.innerText = caption;
            wrap.classList.add('visible');

            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                wrap.classList.remove('visible');
            }, kind === 'victory' ? 3200 : 1600);
        }

        function hideFeedbackGif() {
            const wrap = document.getElementById('feedback-gif');
            if (wrap) wrap.classList.remove('visible');
            clearTimeout(feedbackTimer);
        }

        function showTurnBanner(text) {
            const banner = document.getElementById('turn-banner');
            if (!banner) return;
            banner.innerText = text;
            banner.classList.add('visible');
            clearTimeout(turnBannerTimer);
            turnBannerTimer = setTimeout(() => banner.classList.remove('visible'), 1500);
        }

        function rollDice() {
            if (turnState !== 'ROLL') return;

            const btn = document.getElementById('dice-btn');
            const valDiv = document.getElementById('dice-val');

            audio.playSFX('click', { volume: 0.42, minGap: 80 });
            btn.classList.add('pointer-events-none');
            valDiv.classList.add('rolling');

            setTimeout(() => {
                valDiv.classList.remove('rolling');
                diceValue = Math.floor(Math.random() * 6) + 1;
                valDiv.innerText = diceValue;

                if (canMove(currentPlayerIndex, diceValue)) {
                    turnState = 'SELECT';
                    document.getElementById('status-text').innerText = "Select Squad";
                    document.getElementById('status-text').style.color = "#64f5b3";
                } else {
                    audio.playSFX('blocked', { volume: 0.56, minGap: 200 });
                    document.getElementById('status-text').innerText = "No Route!";
                    document.getElementById('status-text').style.color = "#ff6b81";
                    showFeedbackGif('clash', 'Blocked');
                    setTimeout(nextTurn, 1000);
                }
                btn.classList.remove('pointer-events-none');
            }, 500);
        }

        function canMove(pId, roll) {
            const pPieces = pieces.filter(p => p.playerId === pId);
            for (let p of pPieces) {
                if (p.state === 'BASE') {
                    if (roll === 6) return true;
                } else if (p.state === 'TRACK') {
                    return true;
                } else if (p.state === 'HOME') {
                    if (p.pos + roll < HOME_RUN_LENGTH) return true;
                }
            }
            return false;
        }

        function getPieceScreenPos(piece) {
            if (piece.state === 'BASE') {
                return getBoardNode('BASE', piece.pieceId, piece.playerId);
            } else if (piece.state === 'TRACK') {
                return getBoardNode('TRACK', piece.pos);
            } else if (piece.state === 'HOME') {
                return getBoardNode('HOME', piece.pos, piece.playerId);
            }
            return {x: -1000, y: -1000};
        }

        function handlePieceClick(x, y) {
            if (turnState !== 'SELECT') return;

            const pPieces = pieces.filter(p => p.playerId === currentPlayerIndex && p.state !== 'DONE');

            for (let p of pPieces) {
                const pos = getPieceScreenPos(p);
                const dist = Math.hypot(pos.x - x, pos.y - y);

                if (dist < 30 * scale) {
                    attemptMove(p);
                    break;
                }
            }
        }

        function getEventCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function attemptMove(piece) {
            let moved = false;

            if (piece.state === 'BASE') {
                if (diceValue === 6) {
                    const startIndex = piece.playerId * STEPS_PER_ARM;
                    piece.state = 'TRACK';
                    piece.pos = startIndex;
                    moved = true;
                }
            }
            else if (piece.state === 'TRACK') {
                let currentPos = piece.pos;
                let targetPos = (currentPos + diceValue) % TOTAL_STEPS;

                const startIndex = piece.playerId * STEPS_PER_ARM;
                const entryPoint = (startIndex - 1 + TOTAL_STEPS) % TOTAL_STEPS;

                if (piece.stepsTaken === undefined) piece.stepsTaken = 0;

                if (piece.stepsTaken + diceValue > TOTAL_STEPS) {
                    const remaining = (piece.stepsTaken + diceValue) - TOTAL_STEPS - 1;
                    if (remaining < HOME_RUN_LENGTH) {
                        piece.state = 'HOME';
                        piece.pos = remaining;
                        piece.stepsTaken += diceValue;
                        moved = true;
                    }
                } else {
                    piece.pos = targetPos;
                    piece.stepsTaken += diceValue;
                    moved = true;
                }
            }
            else if (piece.state === 'HOME') {
                if (piece.pos + diceValue < HOME_RUN_LENGTH) {
                    piece.pos += diceValue;
                    moved = true;
                    if (piece.pos === HOME_RUN_LENGTH - 1) {
                        piece.state = 'DONE';
                        checkWin();
                    }
                }
            }

            if (moved) {
                const deployedFromBase = piece.state === 'TRACK' && piece.stepsTaken === undefined;
                audio.playSFX(deployedFromBase ? 'deploy' : 'move', {
                    volume: deployedFromBase ? 0.58 : 0.5,
                    minGap: 120
                });

                if (piece.state === 'TRACK') {
                    const collision = pieces.find(p =>
                        p.playerId !== piece.playerId &&
                        p.state === 'TRACK' &&
                        p.pos === piece.pos
                    );
                    if (collision) {
                        collision.state = 'BASE';
                        collision.stepsTaken = 0;
                        collision.pos = -1;
                        audio.playSFX('kill', { volume: 0.68, minGap: 180 });
                        showFeedbackGif('clash', 'Squad Clash');
                    }
                }

                if (piece.state === 'HOME' || piece.state === 'DONE') {
                    audio.playSFX('move', { volume: 0.58, minGap: 100 });
                }

                if (diceValue === 6) {
                    turnState = 'ROLL';
                    document.getElementById('status-text').innerText = "Roll Again!";
                } else {
                    nextTurn();
                }
            } else {
                audio.playSFX('blocked', { volume: 0.56, minGap: 180 });
            }
        }

        function nextTurn() {
            currentPlayerIndex = (currentPlayerIndex + 1) % 6;
            turnState = 'ROLL';
            updateUI();
        }

        function updateUI() {
            const p = PLAYERS[currentPlayerIndex];
            const turnInd = document.getElementById('turn-indicator');
            turnInd.innerText = `${p.emoji} ${p.name}`;
            turnInd.style.color = p.glow;

            const status = document.getElementById('status-text');
            status.innerText = "Roll Dice";
            status.style.color = "var(--text)";

            document.getElementById('dice-val').innerText = "🎲";
            showTurnBanner(`${p.emoji} ${p.name} turn`);
            audio.playSFX('turn', { volume: 0.3, minGap: 240 });
        }

        function checkWin() {
            const pPieces = pieces.filter(p => p.playerId === currentPlayerIndex);
            if (pPieces.every(p => p.state === 'DONE')) {
                gameActive = false;
                audio.playSFX('win', { volume: 0.68, minGap: 500 });
                audio.playVictoryLoop();
                showFeedbackGif('victory', 'Victory');
                document.getElementById('winner-name').innerText = `${PLAYERS[currentPlayerIndex].emoji} ${PLAYERS[currentPlayerIndex].name}`;
                document.getElementById('winner-name').style.color = PLAYERS[currentPlayerIndex].glow;
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('ui-layer').classList.add('hidden');
            }
        }

        /** 7. RENDER LOOP */
        function drawParallax() {
            parallaxOffset += 0.2;
            ctx.save();
            ctx.translate(centerX, centerY);

            const pulse = 0.5 + Math.sin(parallaxOffset * 0.03) * 0.5;

            ctx.strokeStyle = 'rgba(109, 216, 255, 0.08)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                ctx.rotate(Math.PI / 3);
                ctx.rect(-300 + parallaxOffset, -300, 100, 100);
            }
            ctx.stroke();

            ctx.rotate(parallaxOffset * 0.005);
            ctx.strokeStyle = `rgba(255, 209, 102, ${0.08 + pulse * 0.06})`;
            ctx.beginPath();
            ctx.arc(0, 0, 400 * scale, 0, Math.PI * 2);
            ctx.stroke();

            ctx.rotate(-parallaxOffset * 0.01);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                ctx.lineTo(450 * scale * Math.cos(i * Math.PI / 3), 450 * scale * Math.sin(i * Math.PI / 3));
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(125, 234, 255, 0.14)';
            ctx.stroke();

            for (let i = 0; i < 18; i++) {
                const angle = (Math.PI * 2 * i) / 18 + parallaxOffset * 0.004;
                const radius = 265 * scale + Math.sin(parallaxOffset * 0.02 + i) * 12 * scale;
                const sparkX = Math.cos(angle) * radius;
                const sparkY = Math.sin(angle) * radius;
                ctx.fillStyle = `rgba(255,255,255,${0.06 + (i % 3) * 0.05})`;
                ctx.beginPath();
                ctx.arc(sparkX, sparkY, (1.5 + (i % 2)) * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawBoard() {
            const ringGradient = ctx.createRadialGradient(centerX, centerY, 30 * scale, centerX, centerY, 170 * scale);
            ringGradient.addColorStop(0, 'rgba(19, 48, 88, 0.08)');
            ringGradient.addColorStop(1, 'rgba(125, 234, 255, 0.22)');
            ctx.strokeStyle = ringGradient;
            ctx.lineWidth = 22 * scale;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 120 * scale, 0, Math.PI * 2);
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.strokeStyle = 'rgba(125, 234, 255, 0.12)';
            ctx.lineWidth = 1.5 * scale;
            for (let i = 0; i < 6; i++) {
                const angle = (PLAYERS[i].baseAngle * Math.PI) / 180;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 36 * scale, Math.sin(angle) * 36 * scale);
                ctx.lineTo(Math.cos(angle) * 250 * scale, Math.sin(angle) * 250 * scale);
                ctx.stroke();
            }
            ctx.restore();

            for (let i = 0; i < 6; i++) {
                const p = PLAYERS[i];
                const angle = p.baseAngle * (Math.PI / 180);

                const bx = centerX + Math.cos(angle - 0.52) * 320 * scale;
                const by = centerY + Math.sin(angle - 0.52) * 320 * scale;

                const baseGradient = ctx.createRadialGradient(bx - 12 * scale, by - 12 * scale, 5 * scale, bx, by, 70 * scale);
                baseGradient.addColorStop(0, 'rgba(255,255,255,0.18)');
                baseGradient.addColorStop(1, 'rgba(8, 20, 40, 0.92)');
                ctx.fillStyle = baseGradient;
                ctx.beginPath();
                ctx.arc(bx, by, 60 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 4;
                ctx.strokeStyle = p.glow;
                ctx.shadowBlur = 14 * scale;
                ctx.shadowColor = p.color;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.font = `${18 * scale}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.emoji, bx, by - 1 * scale);

                for (let j = 0; j < HOME_RUN_LENGTH; j++) {
                    const pos = getBoardNode('HOME', j, i);
                    const isFinal = j === HOME_RUN_LENGTH - 1;
                    ctx.fillStyle = isFinal ? p.color : 'rgba(255,255,255,0.12)';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, (isFinal ? 9.5 : 8) * scale, 0, Math.PI * 2);
                    ctx.fill();

                    if (isFinal) {
                        ctx.strokeStyle = p.glow;
                        ctx.lineWidth = 2 * scale;
                        ctx.stroke();
                    }
                }

                const startNode = getBoardNode('TRACK', i * STEPS_PER_ARM);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(startNode.x, startNode.y, 6 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1.5 * scale;
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255, 209, 102, 0.85)';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 18 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2 * scale;
            ctx.stroke();
        }

        function drawPieces() {
            pieces.forEach(p => {
                if (p.state === 'DONE') return;

                const pos = getPieceScreenPos(p);
                const player = PLAYERS[p.playerId];
                const pulse = 0.75 + Math.sin((Date.now() / 180) + p.pieceId) * 0.25;

                ctx.save();
                ctx.translate(pos.x, pos.y);

                ctx.shadowBlur = 16 * scale;
                ctx.shadowColor = player.glow;

                const pieceGradient = ctx.createRadialGradient(-4 * scale, -5 * scale, 2 * scale, 0, 0, 18 * scale);
                pieceGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
                pieceGradient.addColorStop(0.3, player.glow);
                pieceGradient.addColorStop(1, player.color);

                ctx.fillStyle = pieceGradient;
                ctx.beginPath();
                ctx.arc(0, 0, 13 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 2 * scale;
                ctx.stroke();

                ctx.fillStyle = 'rgba(6, 18, 34, 0.9)';
                ctx.beginPath();
                ctx.arc(0, -2 * scale, 3.2 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(-4 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.arc(4 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(11, 26, 49, 0.9)';
                ctx.beginPath();
                ctx.arc(-4 * scale, -3 * scale, 0.9 * scale, 0, Math.PI * 2);
                ctx.arc(4 * scale, -3 * scale, 0.9 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1.2 * scale;
                ctx.beginPath();
                ctx.arc(0, 2.5 * scale, 4.5 * scale, 0.1, Math.PI - 0.1);
                ctx.stroke();

                if (turnState === 'SELECT' && p.playerId === currentPlayerIndex) {
                    if (canMove(p.playerId, diceValue)) {
                        ctx.strokeStyle = `rgba(255,255,255,${0.4 + pulse * 0.45})`;
                        ctx.lineWidth = 2.4 * scale;
                        ctx.beginPath();
                        ctx.arc(0, 0, (19 + pulse * 2) * scale, 0, Math.PI * 2);
                        ctx.stroke();

                        ctx.strokeStyle = `rgba(255, 209, 102, ${0.25 + pulse * 0.3})`;
                        ctx.lineWidth = 4 * scale;
                        ctx.beginPath();
                        ctx.arc(0, 0, (16 + pulse * 2) * scale, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, width);
            grad.addColorStop(0, '#17345f');
            grad.addColorStop(0.58, '#0f203b');
            grad.addColorStop(1, '#050d18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            drawParallax();

            if (gameActive) {
                drawBoard();
                drawPieces();
            }

            requestAnimationFrame(gameLoop);
        }

        /** 8. INPUT HANDLING */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', { volume: 0.64, minGap: 300 });
            audio.startMatchLoop();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', { volume: 0.52, minGap: 200 });
            audio.startMatchLoop();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            gameActive = true;
            initGame();
        });

        document.getElementById('dice-btn').addEventListener('click', rollDice);

        // [agent-note][stage4] repaired: mobile-piece-selection | action: pointer events scoped to canvas, UI buttons keep native tap/click
        canvas.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            if (e.pointerType === 'touch') {
                activePointerId = e.pointerId;
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!gameActive) return;
            if (e.pointerType === 'touch' && activePointerId !== null && e.pointerId !== activePointerId) return;
            if (e.pointerType === 'touch') {
                e.preventDefault();
                activePointerId = null;
            }
            const { x, y } = getEventCanvasCoords(e.clientX, e.clientY);
            handlePieceClick(x, y);
        });

        canvas.addEventListener('pointercancel', (e) => {
            if (e.pointerId === activePointerId) {
                activePointerId = null;
            }
        });

        canvas.addEventListener('click', (e) => {
            if (!gameActive || e.pointerType === 'touch') return;
            const { x, y } = getEventCanvasCoords(e.clientX, e.clientY);
            handlePieceClick(x, y);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.stopAllLoops();
            } else if (gameActive) {
                audio.startMatchLoop();
            }
        });

        gameLoop();
    });
    </script>
</body>
