<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Wall Run</title>
    <!-- [agent-note][stage4] repaired-font: title/hud -> Orbitron, ui/body -> Rajdhani via catalogs/fonts.json approved refs -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09061b;
            --bg-deep: #150f31;
            --panel: linear-gradient(180deg, rgba(25, 19, 60, 0.88), rgba(8, 10, 25, 0.82));
            --panel-border: rgba(122, 227, 255, 0.25);
            --text: #f6fbff;
            --muted: rgba(226, 239, 255, 0.72);
            --accent-a: #6df7c1;
            --accent-b: #50a6ff;
            --accent-c: #d86fff;
            --coin: #ffd75e;
            --danger: #ff4f78;
            --button-a: #ff4fa0;
            --button-b: #7f5cff;
            --button-text: #ffffff;
            --button-alt-text: #200f48;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(80, 166, 255, 0.18), transparent 35%),
                radial-gradient(circle at 20% 80%, rgba(216, 111, 255, 0.14), transparent 30%),
                linear-gradient(180deg, var(--bg-deep), var(--bg));
            color: var(--text);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .glass {
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 26px rgba(80, 166, 255, 0.12);
        }

        .hidden {
            display: none !important;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        .game-container::before,
        .game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(109, 247, 193, 0.14), transparent 20%),
                radial-gradient(circle at 80% 15%, rgba(216, 111, 255, 0.18), transparent 22%),
                radial-gradient(circle at 50% 85%, rgba(80, 166, 255, 0.14), transparent 28%);
            z-index: 0;
        }

        .game-container::after {
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.35), transparent 70%);
            z-index: 1;
            opacity: 0.6;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hud {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 0.65rem 0.9rem 0.55rem;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(12, 17, 37, 0.72), rgba(19, 11, 45, 0.48));
            border: 1px solid rgba(109, 247, 193, 0.18);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
        }

        .hud-score {
            font-family: 'Orbitron', sans-serif;
            color: var(--text);
            font-size: clamp(1.6rem, 4vw, 2.35rem);
            font-weight: 700;
            text-shadow: 0 0 18px rgba(109, 247, 193, 0.22);
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .hud-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--muted);
        }

        .panel {
            width: min(88vw, 360px);
            padding: 1.9rem 1.5rem 1.6rem;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(109, 247, 193, 0.12), transparent 30%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.07), transparent 42%);
            pointer-events: none;
        }

        .panel > * {
            position: relative;
            z-index: 1;
        }

        .start-screen {
            transform: translateZ(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .start-screen:hover {
            transform: scale(1.03);
        }

        .title {
            margin: 0 0 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 3.35rem);
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: transparent;
            background: linear-gradient(90deg, var(--accent-a), var(--accent-b), var(--accent-c));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 22px rgba(80, 166, 255, 0.25);
        }

        .subtitle {
            margin: 0 0 1rem;
            font-size: clamp(1rem, 3.6vw, 1.15rem);
            color: rgba(240, 248, 255, 0.9);
            letter-spacing: 0.04em;
        }

        .instructions {
            margin: 0 0 1.4rem;
            font-size: 1rem;
            line-height: 1.35;
            color: var(--muted);
            animation: pulse 1.7s ease-in-out infinite;
        }

        .action-button {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 0.9rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            color: var(--button-text);
            background: linear-gradient(90deg, var(--button-a), var(--button-b));
            box-shadow: 0 12px 30px rgba(127, 92, 255, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .action-button:hover {
            filter: brightness(1.06);
            box-shadow: 0 14px 34px rgba(236, 72, 153, 0.4);
        }

        .action-button:active {
            transform: scale(0.96);
        }

        .action-button.alt {
            background: linear-gradient(180deg, #f5fbff, #d4e8ff);
            color: var(--button-alt-text);
            box-shadow: 0 12px 28px rgba(212, 232, 255, 0.22);
        }

        .game-over-title {
            margin: 0 0 0.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 7vw, 2.9rem);
            letter-spacing: 0.08em;
        }

        .final-score {
            margin: 0 0 1.5rem;
            font-size: 1.3rem;
            color: var(--accent-a);
            font-weight: 600;
        }

        .feedback-gif {
            position: absolute;
            right: clamp(12px, 3vw, 28px);
            width: min(28vw, 124px);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(7, 9, 20, 0.55);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
        }

        .feedback-gif.show {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.collect {
            top: 96px;
        }

        .feedback-gif.fail {
            bottom: 28px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 1; }
        }

        @media (max-width: 480px) {
            .panel {
                padding: 1.5rem 1.25rem;
                border-radius: 20px;
            }

            .hud {
                top: 16px;
                left: 16px;
            }

            .action-button {
                width: 100%;
            }
        }
    </style>

<body>

    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: collect/fail reactions -> catalogs/gifs.json | caution: compact right-edge overlays keep playfield clear -->
        <img id="collect-gif" class="feedback-gif collect" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Reward reaction" loading="lazy" decoding="async">
        <img id="fail-gif" class="feedback-gif fail" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp" alt="Fail reaction" loading="lazy" decoding="async">
        
        <!-- UI Layer -->
        <div id="ui-layer" class="ui-layer">
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, only compact neon restyle applied -->
            <div id="hud" class="hud hidden">
                <div class="hud-label">Data</div>
                <div class="hud-score"><span id="score">0</span></div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="glass panel start-screen">
                <h1 class="title">Neon<br>Wall Run</h1>
                <p class="subtitle">Ride the tower stream.</p>
                <p class="instructions">Tap on each wall to kick off, dodge red hazards, and grab glowing data.</p>
                <button id="start-btn" class="action-button">START RUN</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass panel">
                <h2 class="game-over-title">SIGNAL LOST</h2>
                <div class="final-score">Data Collected: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="action-button alt">RUN AGAIN</button>
            </div>
        </div>
    </div>

<script>
/**
 * § Engine Core
 */
const CONFIG_DEFAULT = {
    jumpForce: 18,
    gravity: 0.8,
    gameSpeed: 4,
    heroColor: "#00ff88"
};

// Global State
let gameConfig = { ...CONFIG_DEFAULT };
const state = {
    playing: false,
    score: 0,
    time: 0,
    width: 0,
    height: 0,
    dpr: 1,
    collectGifTimer: 0,
    failGifTimer: 0
};

// Audio System
const audioSys = {
    ctx: null,
    sfxBuffers: {},
    initialized: false,
    lastPlayedAt: {},
    init: function() {
        if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            return;
        }
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.loadSfx('sfx_collect', 'beep');
            this.loadSfx('sfx_die', 'explosion');
            this.loadSfx('sfx_jump', 'beep');
            this.loadSfx('sfx_wall', 'thud');
            this.loadSfx('sfx_ui', 'beep');
            this.initialized = true;
        } catch (e) { console.warn('Audio init failed', e); }
    },
    loadSfx: function(id, fallback) {
        const el = document.getElementById(id);
        if(!el || !this.ctx) return;
        fetch(el.src)
            .then(r => r.arrayBuffer())
            .then(b => this.ctx.decodeAudioData(b))
            .then(d => this.sfxBuffers[id] = d)
            .catch(() => this.sfxBuffers[id] = fallback);
    },
    playBgm: function() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = 0.2;
        el.currentTime = 0;
        el.play().catch(() => {});
    },
    stopBgm: function() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    },
    playSfx: function(id, cooldown = 0) {
        const now = performance.now();
        if (cooldown && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        
        const buffer = this.sfxBuffers[id];
        if (buffer && typeof buffer !== 'string') {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = buffer;
            gain.gain.value = id === 'sfx_die' ? 0.4 : id === 'sfx_wall' ? 0.22 : 0.3;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(buffer || 'beep');
        }
    },
    synthesize: function(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'thud') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.12);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
};

/**
 * § Game Logic
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Entities
let player = {
    x: 0, y: 0, w: 40, h: 40,
    vx: 0, vy: 0,
    scaleX: 1, scaleY: 1,
    onWall: 0, // -1 left, 1 right, 0 air
    color: '#00ff88'
};

let walls = [];
let particles = [];
let cameraY = 0;
let shake = 0;
let lastWallContact = 0;

function initGame() {
    state.width = canvas.clientWidth;
    state.height = canvas.clientHeight;
    state.dpr = window.devicePixelRatio || 1;
    
    canvas.width = state.width * state.dpr;
    canvas.height = state.height * state.dpr;
    
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    
    resetLevel();
}

function resetLevel() {
    player.x = state.width / 2 - 20;
    player.y = state.height - 150;
    player.vx = 0;
    player.vy = 0;
    player.onWall = 0;
    player.scaleX = 1;
    player.scaleY = 1;
    
    cameraY = 0;
    state.score = 0;
    walls = [];
    particles = [];
    
    // Initial walls
    generateWalls(-200);
}

function generateWalls(minY) {
    const gap = 140; 
    const wallW = 30;
    
    // Ensure walls exist up to minY
    let highestY = walls.length > 0 ? walls[walls.length-1].y : state.height;
    
    while(highestY > minY) {
        highestY -= 80; // Distance between segments
        
        // Randomly place spikes
        const hasSpikeLeft = Math.random() < 0.3;
        const hasSpikeRight = Math.random() < 0.3;
        
        // Add wall segments (visual only, logic is boundary based)
        // But we add hazards here
        if(hasSpikeLeft) {
            walls.push({ type: 'spike', side: -1, x: 0, y: highestY, w: 40, h: 40 });
        }
        if(hasSpikeRight) {
            walls.push({ type: 'spike', side: 1, x: state.width - 40, y: highestY, w: 40, h: 40 });
        }
        
        // Collectibles
        if(Math.random() < 0.2) {
            walls.push({ type: 'coin', x: state.width/2 - 15 + (Math.random()*40 - 20), y: highestY, w: 30, h: 30, collected: false });
        }
    }
    
    // Cleanup old entities
    walls = walls.filter(w => w.y < cameraY + state.height + 100);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color
        });
    }
}

function setFeedbackGif(id, active) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('show', active);
}

function update(dt) {
    if(!state.playing) {
        setFeedbackGif('collect-gif', false);
        if (state.failGifTimer <= 0) setFeedbackGif('fail-gif', false);
        return;
    }

    state.collectGifTimer = Math.max(0, state.collectGifTimer - dt);
    state.failGifTimer = Math.max(0, state.failGifTimer - dt);
    setFeedbackGif('collect-gif', state.collectGifTimer > 0);
    setFeedbackGif('fail-gif', state.failGifTimer > 0);
    
    // Physics
    player.vy += gameConfig.gravity;
    player.x += player.vx;
    player.y += player.vy;
    
    // Squash/Stretch recovery
    player.scaleX += (1 - player.scaleX) * 0.2;
    player.scaleY += (1 - player.scaleY) * 0.2;
    
    // Wall Collisions
    const wallFriction = 0.8;
    
    // Left Wall
    if(player.x < 0) {
        player.x = 0;
        if(player.vx < 0) {
            player.vx = 0;
            player.onWall = -1;
            player.scaleX = 0.6; player.scaleY = 1.4; // Squish
            shake = 5;
            if (performance.now() - lastWallContact > 140) {
                audioSys.playSfx('sfx_wall', 120);
                lastWallContact = performance.now();
            }
            createParticles(player.x, player.y + 20, gameConfig.heroColor, 3);
        }
    } 
    // Right Wall
    else if(player.x + player.w > state.width) {
        player.x = state.width - player.w;
        if(player.vx > 0) {
            player.vx = 0;
            player.onWall = 1;
            player.scaleX = 0.6; player.scaleY = 1.4; // Squish
            shake = 5;
            if (performance.now() - lastWallContact > 140) {
                audioSys.playSfx('sfx_wall', 120);
                lastWallContact = performance.now();
            }
            createParticles(player.x + player.w, player.y + 20, gameConfig.heroColor, 3);
        }
    } else {
        player.onWall = 0;
    }
    
    // Wall Slide
    if(player.onWall !== 0 && player.vy > 2) {
        player.vy = 2; // Slide down slowly
        createParticles(player.onWall === -1 ? player.x : player.x+player.w, player.y + 40, '#fff', 1);
    }
    
    // Camera
    const targetY = player.y - state.height * 0.6;
    cameraY += (targetY - cameraY) * 0.1;
    
    // Death (Fall)
    if(player.y > cameraY + state.height + 100) {
        gameOver();
    }
    
    // Entity Collision
    walls.forEach(w => {
        // Simple AABB
        if (player.x < w.x + w.w && player.x + player.w > w.x &&
            player.y < w.y + w.h && player.y + player.h > w.y) {
            
            if(w.type === 'spike') {
                gameOver();
            } else if(w.type === 'coin' && !w.collected) {
                w.collected = true;
                state.score += 10;
                state.collectGifTimer = 900;
                document.getElementById('score').innerText = state.score;
                audioSys.playSfx('sfx_collect', 80);
                createParticles(w.x + w.w/2, w.y + w.h/2, '#ffcc00', 10);
                // Tiny bounce on collect
                player.vy = Math.min(player.vy, -5); 
            }
        }
    });
    
    // Generate more world
    generateWalls(cameraY - 100);
    
    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Shake decay
    if(shake > 0) shake *= 0.9;
    if(shake < 0.5) shake = 0;
}

function draw() {
    // Clear & Background
    const bgGradient = ctx.createLinearGradient(0, 0, 0, state.height);
    bgGradient.addColorStop(0, '#120d2f');
    bgGradient.addColorStop(0.45, '#0d1f48');
    bgGradient.addColorStop(1, '#070914');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, state.width, state.height);

    const glowLeft = ctx.createRadialGradient(state.width * 0.2, state.height * 0.15, 0, state.width * 0.2, state.height * 0.15, state.width * 0.4);
    glowLeft.addColorStop(0, 'rgba(109, 247, 193, 0.18)');
    glowLeft.addColorStop(1, 'rgba(109, 247, 193, 0)');
    ctx.fillStyle = glowLeft;
    ctx.fillRect(0, 0, state.width, state.height);

    const glowRight = ctx.createRadialGradient(state.width * 0.78, state.height * 0.2, 0, state.width * 0.78, state.height * 0.2, state.width * 0.45);
    glowRight.addColorStop(0, 'rgba(216, 111, 255, 0.16)');
    glowRight.addColorStop(1, 'rgba(216, 111, 255, 0)');
    ctx.fillStyle = glowRight;
    ctx.fillRect(0, 0, state.width, state.height);
    
    // Parallax Grid
    ctx.save();
    ctx.strokeStyle = 'rgba(95, 194, 255, 0.09)';
    ctx.lineWidth = 1.5;
    const gridOffset = (cameraY * 0.5) % 50;
    for(let i=0; i<state.width; i+=50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, state.height); ctx.stroke();
    }
    for(let i=-gridOffset; i<state.height; i+=50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(state.width, i); ctx.stroke();
    }
    ctx.restore();
    
    // Camera Transform
    ctx.save();
    const shakeX = (Math.random() - 0.5) * shake;
    const shakeY = (Math.random() - 0.5) * shake;
    ctx.translate(0 + shakeX, -cameraY + shakeY);
    
    // Draw Walls/Spikes
    walls.forEach(w => {
        if(w.type === 'spike') {
            const spikeGradient = ctx.createLinearGradient(w.side === -1 ? 0 : state.width - 40, w.y, w.side === -1 ? 40 : state.width, w.y + 40);
            spikeGradient.addColorStop(0, '#ff9a7d');
            spikeGradient.addColorStop(0.5, '#ff4f78');
            spikeGradient.addColorStop(1, '#7f0b44');
            ctx.fillStyle = spikeGradient;
            ctx.beginPath();
            if(w.side === -1) {
                ctx.moveTo(0, w.y); ctx.lineTo(40, w.y + 20); ctx.lineTo(0, w.y + 40);
            } else {
                ctx.moveTo(state.width, w.y); ctx.lineTo(state.width - 40, w.y + 20); ctx.lineTo(state.width, w.y + 40);
            }
            ctx.closePath();
            ctx.shadowColor = 'rgba(255, 79, 120, 0.95)';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 216, 224, 0.65)';
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else if(w.type === 'coin' && !w.collected) {
            const bob = Math.sin(Date.now() / 120 + w.y * 0.08) * 2;
            const cx = w.x + w.w / 2;
            const cy = w.y + w.h / 2 + bob;
            const coinGradient = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 14);
            coinGradient.addColorStop(0, '#fff7c8');
            coinGradient.addColorStop(0.45, '#ffd75e');
            coinGradient.addColorStop(1, '#ff9f1a');
            ctx.fillStyle = coinGradient;
            ctx.shadowColor = 'rgba(255, 215, 94, 0.95)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(cx, cy, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 246, 196, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 246, 196, 0.7)';
            ctx.fillRect(cx - 2, cy - 7, 4, 14);
        }
    });
    
    // Draw Player
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.scale(player.scaleX, player.scaleY);

    const heroGradient = ctx.createLinearGradient(0, -player.h / 2, 0, player.h / 2);
    heroGradient.addColorStop(0, '#b7ffe7');
    heroGradient.addColorStop(0.42, gameConfig.heroColor);
    heroGradient.addColorStop(1, '#178f72');
    ctx.fillStyle = heroGradient;
    ctx.shadowColor = gameConfig.heroColor;
    ctx.shadowBlur = 24;
    
    // Character core
    ctx.beginPath();
    ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 14);
    ctx.fill();

    // Faceplate shimmer
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.roundRect(-player.w/2 + 4, -player.h/2 + 4, player.w - 10, player.h * 0.35, 10);
    ctx.fill();

    // Cheek fins / silhouette accents
    ctx.fillStyle = 'rgba(109, 247, 193, 0.85)';
    ctx.beginPath();
    ctx.moveTo(-player.w/2, -4);
    ctx.lineTo(-player.w/2 - 8, 4);
    ctx.lineTo(-player.w/2, 10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(player.w/2, -4);
    ctx.lineTo(player.w/2 + 8, 4);
    ctx.lineTo(player.w/2, 10);
    ctx.closePath();
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = 'white';
    const lookDir = player.onWall !== 0 ? player.onWall * 5 : (player.vx > 0 ? 5 : -5);
    ctx.beginPath(); ctx.arc(-8 + lookDir, -4, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8 + lookDir, -4, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#101426';
    ctx.beginPath(); ctx.arc(-8 + lookDir, -4, 2.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8 + lookDir, -4, 2.3, 0, Math.PI*2); ctx.fill();

    // Mouth / expression
    ctx.strokeStyle = 'rgba(16, 20, 38, 0.82)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 7, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    
    ctx.restore();
    
    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    ctx.restore();
}

function gameLoop() {
    try {
        update(16);
        draw();
        requestAnimationFrame(gameLoop);
    } catch(e) {
        console.error("Game Loop Error:", e);
    }
}

function handleInput(e) {
    if(e.type !== 'pointerdown') return;
    e.preventDefault();
    
    if(!state.playing) return;
    
    // Jump Logic
    if(player.onWall !== 0) {
        // Wall Jump
        player.vy = -gameConfig.jumpForce;
        player.vx = -player.onWall * 10; // Jump away from wall
        player.scaleX = 0.5; player.scaleY = 1.5; // Stretch
        audioSys.playSfx('sfx_jump', 90);
        createParticles(player.x + player.w/2, player.y + player.h, '#fff', 5);
    } else {
        // Air Control (Double jump or push) - simplified to just wall interaction for now
        // Maybe small boost?
    }
}

function gameOver() {
    state.playing = false;
    state.failGifTimer = 1800;
    audioSys.stopBgm();
    audioSys.playSfx('sfx_die', 200);
    shake = 20;
    
    document.getElementById('finalScore').innerText = state.score;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    setFeedbackGif('fail-gif', true);
}

function startGame() {
    audioSys.init();
    audioSys.playSfx('sfx_ui', 120);
    audioSys.playBgm();
    
    resetLevel();
    state.playing = true;
    state.score = 0;
    state.collectGifTimer = 0;
    state.failGifTimer = 0;
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('score').innerText = '0';
    setFeedbackGif('collect-gif', false);
    setFeedbackGif('fail-gif', false);
    
    // Initial impulse
    player.vy = -15;
    player.vx = 5;
}

/**
 * § Lifecycle
 */
window.addEventListener('DOMContentLoaded', () => {
    // Config Parsing
    try {
        const configEl = document.getElementById('game-config');
        if(configEl) {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            for(let key in defs) {
                gameConfig[key] = defs[key].value;
            }
        }
    } catch(e) { console.error("Config parse error", e); }

    // Resize
    window.addEventListener('resize', initGame);
    initGame();
    
    // Input
    const container = document.getElementById('game-container');
    container.addEventListener('pointerdown', handleInput, { passive: false });
    
    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    
    // Start Loop
    requestAnimationFrame(gameLoop);
});

// Config Hot Reload
window.updateGameConfig = (key, val) => {
    if(gameConfig.hasOwnProperty(key)) {
        gameConfig[key] = val;
    }
};

</script>
