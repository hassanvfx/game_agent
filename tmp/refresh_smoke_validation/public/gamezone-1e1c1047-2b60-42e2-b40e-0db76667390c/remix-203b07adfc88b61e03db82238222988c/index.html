<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Relic Vault</title>
    <script src="./assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage3] resolved-font: title=Audiowide secondary=Exo 2 icons=Material Symbols Rounded via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        :root {
            --bg-top: #070312;
            --bg-bottom: #1a1040;
            --panel: rgba(16, 10, 31, 0.72);
            --panel-strong: rgba(10, 6, 24, 0.94);
            --line: rgba(151, 103, 255, 0.34);
            --line-soft: rgba(255, 255, 255, 0.12);
            --accent: #9f7bff;
            --accent-hot: #ff69d4;
            --accent-cyan: #7ee7ff;
            --text-main: #f8f6ff;
            --text-soft: #d6ccff;
            --success: #5cffb4;
            --danger: #ff677d;
        }

        /* Core Mobile Reset */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-top);
            font-family: 'Exo 2', sans-serif;
            color: var(--text-main);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #bgCanvas,
        #screen-game {
            touch-action: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 18%, rgba(159, 123, 255, 0.16), transparent 28%),
                radial-gradient(circle at 50% 82%, rgba(126, 231, 255, 0.08), transparent 24%);
            z-index: 0;
        }

        /* Typography */
        .teko {
            font-family: 'Audiowide', sans-serif;
            letter-spacing: 0.08em;
        }

        .body-ui {
            font-family: 'Exo 2', sans-serif;
        }

        /* Glass Panels */
        .glass {
            background: linear-gradient(180deg, rgba(24, 14, 43, 0.78), rgba(12, 8, 24, 0.66));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line-soft);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .glass-heavy {
            background:
                linear-gradient(180deg, rgba(7, 4, 16, 0.94), rgba(10, 6, 22, 0.98)),
                radial-gradient(circle at top, rgba(159, 123, 255, 0.15), transparent 40%);
            backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vault-frame {
            position: relative;
            border: 1px solid rgba(159, 123, 255, 0.28);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 28px rgba(126, 231, 255, 0.12);
        }

        /* 3D Card Flip */
        .perspective-1000 { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card-front {
            background:
                radial-gradient(circle at 50% 28%, rgba(126, 231, 255, 0.16), transparent 22%),
                linear-gradient(160deg, #271058 0%, #0b1127 55%, #060813 100%);
            border: 2px solid rgba(126, 231, 255, 0.18);
            box-shadow:
                0 0 22px rgba(159, 123, 255, 0.3),
                inset 0 0 18px rgba(255, 255, 255, 0.04);
        }
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(180deg, rgba(28, 20, 65, 0.98), rgba(12, 14, 29, 0.98));
            border: 2px solid rgba(255,255,255,0.2);
        }
        .flipped .card-inner { transform: rotateY(180deg); }

        .card-front::before,
        .card-back::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(130deg, transparent 0 28%, rgba(255,255,255,0.08) 45%, transparent 62%),
                radial-gradient(circle at 50% 12%, rgba(255,255,255,0.08), transparent 30%);
            pointer-events: none;
        }

        .vault-core {
            position: relative;
            width: 7rem;
            height: 7rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.26), rgba(126, 231, 255, 0.06) 38%, transparent 64%),
                radial-gradient(circle at 50% 50%, rgba(159, 123, 255, 0.25), transparent 70%);
            border: 1px solid rgba(126, 231, 255, 0.24);
            box-shadow:
                0 0 30px rgba(126, 231, 255, 0.14),
                inset 0 0 22px rgba(255,255,255,0.05);
        }

        .vault-core::before,
        .vault-core::after {
            content: "";
            position: absolute;
            inset: 1rem;
            border-radius: 999px;
            border: 1px solid rgba(126, 231, 255, 0.24);
            animation: spin 8s linear infinite;
        }

        .vault-core::after {
            inset: 1.8rem;
            border-color: rgba(255, 105, 212, 0.28);
            animation-direction: reverse;
            animation-duration: 4.5s;
        }

        .vault-face {
            position: relative;
            font-size: 3rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
            animation: floaty 2.2s ease-in-out infinite;
            z-index: 1;
        }

        .vault-sigil {
            position: absolute;
            inset: auto 50% 1rem auto;
            transform: translateX(50%);
            font-size: 0.7rem;
            color: rgba(214, 204, 255, 0.72);
            letter-spacing: 0.45em;
            text-transform: uppercase;
        }

        .card-scanner-lines {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(126, 231, 255, 0.12), transparent);
            background-size: 100% 32%;
            animation: scanline 3s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Rarity Glows */
        .glow-normal { box-shadow: 0 0 20px rgba(148, 163, 184, 0.2); border-color: #94a3b8; }
        .glow-uncommon { box-shadow: 0 0 30px rgba(74, 222, 128, 0.4); border-color: #4ade80; }
        .glow-rare { box-shadow: 0 0 40px rgba(96, 165, 250, 0.5); border-color: #60a5fa; }
        .glow-epic { box-shadow: 0 0 50px rgba(192, 132, 252, 0.6); border-color: #c084fc; }
        .glow-legendary { box-shadow: 0 0 80px rgba(251, 191, 36, 0.8); border-color: #fbbf24; animation: pulse-gold 2s infinite; }

        @keyframes pulse-gold { 0%, 100% { border-color: #fbbf24; } 50% { border-color: #fffbeb; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes floaty { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.03); } }
        @keyframes scanline { from { background-position: 0 -180%; } to { background-position: 0 220%; } }

        /* Animations */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .pressable {
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease, background 160ms ease;
        }
        .pressable:active {
            transform: scale(0.96);
            filter: brightness(1.05);
        }

        .chip {
            border: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        }

        /* Utility */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 20; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            font-size: 1.55rem;
            line-height: 1;
        }

        .feedback-gif {
            position: fixed;
            right: 0.8rem;
            width: min(30vw, 120px);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(18px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            object-fit: cover;
            z-index: 45;
            background: rgba(8, 8, 14, 0.7);
        }

        .feedback-gif.show {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #gif-rare {
            bottom: 7.25rem;
        }

        #gif-fail {
            bottom: 1.25rem;
        }

        @media (max-width: 420px) {
            #screen-start h1 { font-size: 3.5rem; }
            #card-container { width: 15rem; height: 22rem; }
        }
    </style>
</head>

/* =========================================
   APP CONTROLLER
   ========================================= */
const app = {
    state: {
        balance: 2000,
        unlocked: new Set(),
        rolling: false,
        history: ['start']
    },

    init() {
        this.load();
        this.updateBalanceUI();
        this.startLoop();

        const rollButton = document.getElementById('btn-roll');
        const handleRoll = (e) => {
            if (e) e.preventDefault();
            this.roll();
        };

        rollButton.addEventListener('pointerdown', handleRoll);
        rollButton.addEventListener('click', handleRoll);

        document.querySelectorAll('button').forEach((button) => {
            button.addEventListener('pointerdown', () => audio.onGesture());
            button.addEventListener('click', () => audio.play('ui', { cooldown: 90, volume: 0.4 }));
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) audio.stopLoop();
            else audio.ensureLoop();
        }, { passive: true });
    },

    nav(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));

        const target = document.getElementById(`screen-${screenId}`);
        if(target) {
            target.classList.add('active');
            if (screenId === 'start') this.state.history = ['start'];
            else if (this.state.history[this.state.history.length-1] !== screenId) {
                this.state.history.push(screenId);
            }
        }

        if (screenId === 'almanac') this.renderAlmanac();

        audio.onGesture();
        audio.ensureLoop();
    },

    back() {
        if (this.state.history.length > 1) {
            this.state.history.pop();
            const prev = this.state.history[this.state.history.length - 1];
            this.nav(prev);
            this.state.history.pop();
        } else {
            this.nav('start');
        }
    },

    updateBalanceUI() {
        const el = document.getElementById('ui-balance');
        el.innerText = `$${Math.floor(this.state.balance)}`;

        const btn = document.getElementById('btn-roll');
        if (this.state.balance < CONFIG.betCost) {
            btn.disabled = true;
            if (this.state.balance <= 10 && !this.state.rolling) {
                setTimeout(() => this.showGameOver(true), 1000);
            }
        } else {
            btn.disabled = false;
        }
    },

    roll() {
        if (this.state.rolling || this.state.balance < CONFIG.betCost) return;

        audio.onGesture();

        this.state.rolling = true;
        this.state.balance -= CONFIG.betCost;
        this.updateBalanceUI();
        audio.play('ui', { cooldown: 120, volume: 0.42 });

        const container = document.getElementById('card-container');
        const inner = document.getElementById('card-inner');
        const empty = document.getElementById('empty-state');
        const msg = document.getElementById('msg-box');

        empty.classList.add('hidden');
        container.classList.remove('hidden', 'pop-in');
        void container.offsetWidth;
        container.classList.add('pop-in', 'shake');
        inner.classList.remove('flipped');
        msg.style.opacity = '0';

        let r = Math.random() * TOTAL_WEIGHT;
        let item = RARITIES[0];
        for (let i of RARITIES) {
            if (r < i.weight) { item = i; break; }
            r -= i.weight;
        }

        setTimeout(() => {
            container.classList.remove('shake');
            this.reveal(item);
        }, 800);
    },

    reveal(item) {
        const inner = document.getElementById('card-inner');
        const back = document.getElementById('card-back');
        const art = document.getElementById('card-art');
        const title = document.getElementById('card-title');
        const rarity = document.getElementById('card-rarity');
        const value = document.getElementById('card-value');

        back.className = `card-back ${item.glow}`;
        const svg = SVG_GEN[item.type](item.color);
        art.innerHTML = `<img src="data:image/svg+xml;base64,${btoa(svg)}" class="w-full h-full object-cover" alt="${item.name}">`;

        title.innerText = item.name;
        title.style.color = item.color;

        rarity.innerText = item.type;
        rarity.style.color = item.color;
        rarity.style.borderColor = item.color;

        const winAmount = CONFIG.betCost * item.mult;
        value.innerText = winAmount > 0 ? `+ $${winAmount}` : "NO PAYOUT";
        value.className = winAmount > 0 ? "text-emerald-400 font-mono text-xl font-bold" : "text-slate-500 font-mono text-sm";

        inner.classList.add('flipped');

        if (item.mult >= 10) {
            audio.play('jackpot', { volume: 0.62 });
            this.flashGif('rare', 1800);
            particles.explode(window.innerWidth/2, window.innerHeight/2, item.color, 100);
        } else if (item.mult > 0) {
            audio.play(item.mult >= 3 ? 'bonus' : 'reveal', { volume: item.mult >= 3 ? 0.52 : 0.46 });
            if (item.mult >= 3) this.flashGif('rare', 1200);
            particles.explode(window.innerWidth/2, window.innerHeight/2, item.color, 30);
        } else {
            audio.play('loss', { volume: 0.48 });
        }

        this.state.balance += winAmount;
        this.state.unlocked.add(item.id);
        this.save();
        this.updateBalanceUI();

        setTimeout(() => {
            this.state.rolling = false;
            this.updateBalanceUI();
        }, 600);
    },

    showGameOver(show) {
        const ov = document.getElementById('overlay-gameover');
        if (show) {
            ov.classList.remove('hidden');
            setTimeout(() => ov.classList.remove('opacity-0'), 10);
            audio.play('gameover', { cooldown: 1200, volume: 0.56 });
            audio.stopLoop();
            this.flashGif('fail', 2200);
        } else {
            ov.classList.add('opacity-0');
            setTimeout(() => ov.classList.add('hidden'), 500);
            this.hideGif('fail');
            audio.ensureLoop();
        }
    },

    restart() {
        this.state.balance = CONFIG.startBalance;
        this.showGameOver(false);

        document.getElementById('card-container').classList.add('hidden');
        document.getElementById('empty-state').classList.remove('hidden');

        this.updateBalanceUI();
    },

    flashGif(kind, duration = 1200) {
        const el = document.getElementById(`gif-${kind}`);
        if (!el) return;
        clearTimeout(el._hideTimer);
        el.classList.add('show');
        el._hideTimer = setTimeout(() => el.classList.remove('show'), duration);
    },

    hideGif(kind) {
        const el = document.getElementById(`gif-${kind}`);
        if (!el) return;
        clearTimeout(el._hideTimer);
        el.classList.remove('show');
    },

    renderAlmanac() {
        const grid = document.getElementById('almanac-grid');
        grid.innerHTML = '';
        let count = 0;

        RARITIES.forEach(item => {
            const unlocked = this.state.unlocked.has(item.id);
            if(unlocked) count++;

            const el = document.createElement('div');
            el.className = `aspect-[3/4] rounded-xl overflow-hidden relative border ${unlocked ? 'border-violet-400/40 shadow-[0_0_18px_rgba(159,123,255,0.12)]' : 'border-white/5 bg-white/5'}`;

            if (unlocked) {
                const svg = SVG_GEN[item.type](item.color);
                el.innerHTML = `
                    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('data:image/svg+xml;base64,${btoa(svg)}')"></div>
                    <div class="absolute inset-x-0 top-2 flex justify-center">
                        <div class="chip rounded-full px-2 py-1 text-[10px] text-white/80">${item.glyph}</div>
                    </div>
                    <div class="absolute bottom-0 inset-x-0 bg-black/80 p-2 text-center">
                        <div class="text-white text-xs font-bold teko tracking-[0.18em]">${item.name}</div>
                    </div>
                `;
            } else {
                el.innerHTML = `<div class="w-full h-full flex items-center justify-center text-3xl opacity-20">🔒</div>`;
            }
            grid.appendChild(el);
        });

        document.getElementById('almanac-count').innerText = `${count}/${RARITIES.length}`;
    },

    save() {
        localStorage.setItem('neon_gacha_v2', JSON.stringify({
            unlocked: [...this.state.unlocked]
        }));
    },

    load() {
        try {
            const d = JSON.parse(localStorage.getItem('neon_gacha_v2'));
            if(d && d.unlocked) this.state.unlocked = new Set(d.unlocked);
        } catch(e){}
    },

    startLoop() {
        const loop = () => {
            particles.update();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }
};

/* =========================================
   AUDIO SYSTEM
   ========================================= */
const audio = {
    ctx: null,
    buffers: {},
    lastPlayAt: {},
    loopStarted: false,

    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();

        ['sfx_ui', 'sfx_reveal', 'sfx_bonus', 'sfx_jackpot', 'sfx_loss', 'sfx_gameover'].forEach(id => {
            const media = document.getElementById(id);
            if (!media) return;
            fetch(media.src)
                .then(r => r.arrayBuffer())
                .then(b => this.ctx.decodeAudioData(b))
                .then(d => {
                    this.buffers[id] = d;
                })
                .catch(() => {});
        });

        const bgm = document.getElementById('bgm');
        bgm.volume = 0.2;
    },

    onGesture() {
        if (!this.ctx) this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
        this.ensureLoop();
    },

    ensureLoop() {
        const bgm = document.getElementById('bgm');
        if (!bgm || document.hidden) return;
        if (!this.loopStarted) {
            bgm.currentTime = 0;
            this.loopStarted = true;
        }
        if (bgm.paused) {
            bgm.play().catch(() => {
                this.loopStarted = false;
            });
        }
    },

    stopLoop() {
        const bgm = document.getElementById('bgm');
        if (!bgm) return;
        bgm.pause();
    },

    play(key, options = {}) {
        if (!this.ctx) return;
        const {
            volume = 0.35,
            rate = 1,
            cooldown = 0
        } = options;
        const now = performance.now();
        if (cooldown && this.lastPlayAt[key] && now - this.lastPlayAt[key] < cooldown) return;
        this.lastPlayAt[key] = now;

        const id = `sfx_${key}`;
        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[id];
            src.playbackRate.value = rate;
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(key === 'loss' || key === 'gameover' ? 120 : 420, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(key === 'loss' || key === 'gameover' ? 58 : 860, this.ctx.currentTime + 0.2);
            g.gain.setValueAtTime(Math.min(volume, 0.12), this.ctx.currentTime);
            g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.22);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.22);
        }
    }
};

/* =========================================
   VISUALS (Canvas Background & Particles)
   ========================================= */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
}
window.addEventListener('resize', resize);
resize();

const particles = {
    pool: [],

    explode(x, y, color, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.pool.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                decay: Math.random() * 0.02 + 0.01,
                color,
                size: Math.random() * 3 + 1
            });
        }
    },

    update() {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#070312');
        grad.addColorStop(0.55, '#120a2e');
        grad.addColorStop(1, '#23114d');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,w,h);

        const glow = ctx.createRadialGradient(w * 0.5, h * 0.2, 0, w * 0.5, h * 0.2, Math.min(w, h) * 0.55);
        glow.addColorStop(0, 'rgba(126, 231, 255, 0.10)');
        glow.addColorStop(0.45, 'rgba(159, 123, 255, 0.08)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(139, 92, 246, 0.06)';
        ctx.lineWidth = 1;
        const t = Date.now() / 60;
        const gs = 40;
        const offY = t % gs;

        for(let x=0; x<w; x+=gs) {
            ctx.beginPath();
            ctx.moveTo(x,0);
            ctx.lineTo(x,h);
            ctx.stroke();
        }
        for(let y=offY; y<h; y+=gs) {
            ctx.beginPath();
            ctx.moveTo(0,y);
            ctx.lineTo(w,y);
            ctx.stroke();
        }

        for (let i = this.pool.length - 1; i >= 0; i--) {
            let p = this.pool[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life -= p.decay;

            if(p.life <= 0) {
                this.pool.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }
};

// Start
app.init();

</script>
