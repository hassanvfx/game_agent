<style>
:root{--void:#050615;--ink:#0b1028;--panel:rgba(10,16,42,.78);--cyan:#41f6ff;--pink:#ff4fd8;--violet:#8a6cff;--gold:#ffd166;--danger:#ff446d;--soft:#d7f9ff;--muted:#9aa7ce;--font-display:'Orbitron',sans-serif;--font-ui:'Rajdhani',sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--soft);font-family:var(--font-ui);touch-action:none}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 25% 12%,rgba(255,79,216,.22),transparent 25%),radial-gradient(circle at 80% 20%,rgba(65,246,255,.16),transparent 28%),linear-gradient(180deg,#090b22,#040511 72%);pointer-events:none}#game-container{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.gridfx{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(65,246,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,79,216,.07) 1px,transparent 1px);background-size:42px 42px;transform:perspective(360px) rotateX(62deg) translateY(20%);transform-origin:50% 100%;animation:gridDrift 5s linear infinite}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 5px);mix-blend-mode:screen}.rain{position:absolute;inset:-20%;pointer-events:none;background:repeating-linear-gradient(100deg,transparent 0 24px,rgba(65,246,255,.12) 25px 26px,transparent 27px 46px);animation:rain 1.8s linear infinite;opacity:.42}@keyframes gridDrift{to{background-position:0 42px,42px 0}}@keyframes rain{to{transform:translate3d(-36px,70px,0)}}#ui-layer{position:absolute;inset:0;z-index:5;pointer-events:none}#hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.stat-card,.tutorial-card,#game-over-panel{border:1px solid rgba(65,246,255,.32);background:linear-gradient(180deg,rgba(14,22,58,.86),rgba(6,9,28,.72));box-shadow:0 0 28px rgba(65,246,255,.12),inset 0 0 22px rgba(255,79,216,.08);backdrop-filter:blur(8px);border-radius:18px}.stat-card{min-width:112px;padding:10px 12px}.stat-card.right{text-align:right}.label{font-family:var(--font-display);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.value{font-family:var(--font-display);font-size:2rem;line-height:1;color:white;text-shadow:0 0 12px currentColor}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.gold{color:var(--gold)}.tutorial-wrap{display:flex;justify-content:center;padding-bottom:8px}.tutorial-card{position:relative;max-width:min(430px,calc(100vw - 22px));padding:10px 46px 11px 14px;text-align:center}.tutorial-card:after{content:"♥";position:absolute;right:16px;top:10px;color:var(--pink);font-family:var(--font-display);font-size:1.5rem;text-shadow:0 0 16px var(--pink)}.title-chip{font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);font-size:.76rem}.howto{font-size:.98rem;font-weight:600;line-height:1.15;color:#edf9ff}

.feedback-gif{position:absolute;z-index:7;width:clamp(78px,18vw,118px);aspect-ratio:1;object-fit:cover;border-radius:18px;border:2px solid rgba(65,246,255,.45);box-shadow:0 0 22px rgba(255,79,216,.26);opacity:0;transform:translateY(12px) scale(.92);transition:opacity .18s,transform .18s;pointer-events:none}.feedback-gif.visible{opacity:.9;transform:translateY(0) scale(1)}#celebration-gif{right:14px;bottom:126px}#fail-gif{left:14px;top:92px}#game-over-screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,2,10,.84);backdrop-filter:blur(10px);pointer-events:auto;z-index:10}#game-over-screen.show{display:flex}#game-over-panel{width:min(92vw,370px);max-height:88vh;overflow:auto;padding:26px 22px 22px;text-align:center}.monster-mark{width:92px;height:72px;margin:0 auto 12px;border-radius:34px 34px 26px 26px;background:linear-gradient(135deg,var(--pink),var(--violet) 55%,var(--cyan));box-shadow:0 0 26px rgba(255,79,216,.46);position:relative}.monster-mark:before,.monster-mark:after{content:"";position:absolute;top:25px;width:12px;height:12px;background:#061026;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.75)}.monster-mark:before{left:24px}.monster-mark:after{right:24px}.gameover-title{margin:0 0 6px;font-family:var(--font-display);font-size:1.7rem;color:#fff;text-shadow:0 0 18px var(--pink)}.gameover-copy{color:#dce8ff;font-weight:600;font-size:1.02rem}#restart-btn{margin-top:14px;width:100%;min-height:54px;border:0;border-radius:16px;color:#051126;background:linear-gradient(180deg,var(--cyan),#26b7ff);font-family:var(--font-display);font-weight:700;letter-spacing:.06em;font-size:1rem;box-shadow:0 0 24px rgba(65,246,255,.34);touch-action:manipulation}#restart-btn:active{transform:scale(.97)}@media(max-width:480px){.stat-card{min-width:96px;padding:9px}.value{font-size:1.65rem}.howto{font-size:.88rem}.tutorial-card{padding-right:40px}.label{font-size:.62rem}#fail-gif{top:104px}}
</style>
<script id="game-config" type="application/x-game-config">{"scrubSpeed":{"type":"number","label":"Soothing Speed","value":60,"min":20,"max":120},"patienceTime":{"type":"number","label":"Heart Buffer","value":8,"min":4,"max":15}}</script>

<body>
<div id="game-container"><canvas id="gameCanvas"></canvas><div class="gridfx"></div><div class="rain"></div><div class="scan"></div><div id="ui-layer"><div id="hud"><div class="toprow"><div class="stat-card"><div class="label cyan">Alerts Soothed</div><div id="score-display" class="value cyan">0</div></div><div class="stat-card right"><div class="label pink">Care Chain</div><div id="streak-display" class="value pink">0</div></div></div><div class="tutorial-wrap"><div class="tutorial-card"><div class="title-chip">How to Play</div><div class="howto">Swipe fast with Morrow to soothe each overloaded notification before its heart buffer empties.</div></div></div></div><img id="celebration-gif" class="feedback-gif" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="soft success reaction" loading="lazy" decoding="async"><img id="fail-gif" class="feedback-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="sad failure reaction" loading="lazy" decoding="async"><div id="game-over-screen"><div id="game-over-panel"><div class="monster-mark"></div><h1 class="gameover-title">THE INBOX CRIED</h1><p class="gameover-copy">Alerts soothed: <strong id="final-score" class="gold">0</strong></p><p class="gameover-copy">One signal burned out before Morrow could answer it gently.</p><button id="restart-btn">OPEN A NEW HEARTLINE</button></div></div></div></div>
<audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/bgm/scifi_bgm_01.mp3" preload="auto" loop></audio>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreDisplay=document.getElementById('score-display'),streakDisplay=document.getElementById('streak-display'),gameOverScreen=document.getElementById('game-over-screen'),finalScore=document.getElementById('final-score'),restartBtn=document.getElementById('restart-btn'),bgm=document.getElementById('bgm_main'),celebrationGif=document.getElementById('celebration-gif'),failGif=document.getElementById('fail-gif');
let cw=0,ch=0,dpr=1,initialized=false,lastTime=0,gameState='PLAYING',audioCtx,audioUnlocked=false,scrubCooldown=0,warningPlayedForCurrentAlert=false,activeGifTimeouts={};
let seed=1337;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const SFX_URLS={scrub:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_character_01.mp3',clean:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_01.mp3',fail:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_defeat_01.mp3',warning:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_enemy_01.mp3',ui:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_npc_01.mp3',start:'https://gamezone-virid.vercel.app/assets/audios/sfx/scifi_item_02.mp3'};
const configData=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=configData;window.gameConfig={};for(const k in configData)window.gameConfig[k]=configData[k].value;window.updateGameConfig=(k,v)=>{if(window.gameConfigDefs[k])window.gameConfig[k]=v};
const AudioManager={sfx:{},init(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(_){};Object.entries(SFX_URLS).forEach(([id,url])=>{const a=new Audio(url);a.preload='auto';this.sfx[id]=a});bgm.volume=.18},playSfx(id,vol=.45){const base=this.sfx[id];if(!base)return;try{const i=base.cloneNode();i.volume=vol;i.play().catch(()=>{})}catch(_){ }},playBgm(){bgm.volume=.18;bgm.play().catch(()=>{})},stopBgm(){bgm.pause();bgm.currentTime=0}};
function vibrate(style){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}});if(navigator.vibrate)navigator.vibrate(style==='heavy'?45:style==='medium'?28:12)}catch(_){}}
let alerts=[],particles=[],score=0,streak=0,inputPos={x:0,y:0},lastInputPos={x:0,y:0},tool={x:0,y:0,vx:0,vy:0,isScrubbing:false},spawnTimer=0;
const alertTypes=['lonely','urgent','memory','apology','overload'];
function showFeedbackGif(el,duration=1200){if(!el)return;el.classList.add('visible');clearTimeout(activeGifTimeouts[el.id]);activeGifTimeouts[el.id]=setTimeout(()=>el.classList.remove('visible'),duration)}
function setState(state){gameState=state;if(state==='PLAYING'){gameOverScreen.classList.remove('show');failGif.classList.remove('visible')}else if(state==='GAMEOVER'){gameOverScreen.classList.add('show');finalScore.textContent=score;showFeedbackGif(failGif,2400);AudioManager.playSfx('fail',.5);bgm.pause();vibrate('heavy')}}
function spawnAlert(){const margin=Math.min(70,Math.max(42,cw*.12));warningPlayedForCurrentAlert=false;alerts.push({type:alertTypes[Math.floor(rand()*alertTypes.length)],x:margin+rand()*Math.max(1,cw-margin*2),y:ch*.6,r:35,soothe:0,maxSoothe:100,timer:window.gameConfig.patienceTime||8,maxTimer:window.gameConfig.patienceTime||8,state:'raw',wobble:rand()*Math.PI*2,rot:(rand()-.5)*.18})}
function initGame(playStartCue=false){seed=1337;alerts=[];particles=[];score=0;streak=0;spawnTimer=0;scrubCooldown=0;warningPlayedForCurrentAlert=false;tool.x=cw/2;tool.y=ch*.72;lastInputPos.x=tool.x;lastInputPos.y=tool.y;inputPos.x=tool.x;inputPos.y=tool.y;scoreDisplay.textContent='0';streakDisplay.textContent='0';failGif.classList.remove('visible');celebrationGif.classList.remove('visible');spawnAlert();setState('PLAYING');AudioManager.playBgm();if(playStartCue)AudioManager.playSfx('start',.42)}
function resize(w,h){cw=w;ch=h;dpr=window.devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(initialized&&alerts.length)alerts.forEach(a=>a.x=Math.min(Math.max(a.x,a.r),cw-a.r))}
new ResizeObserver(entries=>{for(const e of entries){const cr=e.contentRect;resize(cr.width,cr.height);if(!initialized){AudioManager.init();initGame(false);initialized=true;requestAnimationFrame(loop)}}}).observe(canvas);
function unlockAudio(){if(!audioUnlocked){audioCtx?.resume?.().catch(()=>{});AudioManager.playBgm();audioUnlocked=true}}
function updateInputFromEvent(e){const r=canvas.getBoundingClientRect();inputPos.x=e.clientX-r.left;inputPos.y=e.clientY-r.top}
function handleCanvasInput(e){unlockAudio();if(gameState!=='PLAYING')return;e.preventDefault();updateInputFromEvent(e);if(e.type==='pointerdown'){lastInputPos.x=inputPos.x;lastInputPos.y=inputPos.y}}
canvas.addEventListener('pointerdown',handleCanvasInput,{passive:false});canvas.addEventListener('pointermove',e=>{if(gameState!=='PLAYING')return;e.preventDefault();updateInputFromEvent(e)},{passive:false});canvas.addEventListener('pointerup',handleCanvasInput,{passive:false});canvas.addEventListener('pointercancel',handleCanvasInput,{passive:false});
restartBtn.addEventListener('pointerdown',()=>{unlockAudio();if(audioUnlocked)AudioManager.playSfx('ui',.42)});restartBtn.addEventListener('click',()=>{unlockAudio();if(gameState==='GAMEOVER')initGame(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(audioUnlocked&&gameState==='PLAYING')AudioManager.playBgm()});


function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#090b24');g.addColorStop(.55,'#07091c');g.addColorStop(1,'#03040d');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);const t=performance.now()*.001;for(let i=0;i<9;i++){const x=(i*.137*cw+(t*18*(i%3+1)))%(cw+120)-60;const h=ch*(.14+.08*(i%4));ctx.fillStyle=i%2?'rgba(255,79,216,.10)':'rgba(65,246,255,.10)';ctx.fillRect(x,ch*.2-h*.2,42+i*8,h);ctx.strokeStyle=i%2?'rgba(255,79,216,.28)':'rgba(65,246,255,.24)';ctx.strokeRect(x,ch*.2-h*.2,42+i*8,h)}for(let i=0;i<7;i++){const y=ch*(.26+i*.07)+Math.sin(t+i)*4;ctx.strokeStyle=`rgba(65,246,255,${.08+i*.012})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(cw*.3,y-18,cw*.58,y+22,cw,y-10);ctx.stroke()}ctx.fillStyle='rgba(255,79,216,.08)';ctx.fillRect(0,ch*.67,cw,ch*.33)}
function drawAlert(a){const clean=a.soothe/a.maxSoothe,timer=a.timer/a.maxTimer;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot+Math.sin(a.wobble)*.025);const pulse=1+Math.sin(a.wobble*1.7)*.025;ctx.scale(pulse,pulse);ctx.shadowColor=timer<.25?'rgba(255,68,109,.72)':'rgba(65,246,255,.38)';ctx.shadowBlur=20;ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(0,a.r*.86,a.r*1.18,a.r*.32,0,0,Math.PI*2);ctx.fill();const body=ctx.createLinearGradient(-a.r,-a.r,a.r,a.r);body.addColorStop(0,clean>.92?'#9dffef':'#151d49');body.addColorStop(.55,clean>.92?'#41f6ff':'#23245d');body.addColorStop(1,clean>.92?'#ffecfb':'#4d1f68');ctx.fillStyle=body;roundRect(-a.r*1.08,-a.r*.78,a.r*2.16,a.r*1.5,14);ctx.fill();ctx.strokeStyle=timer<.25?'#ff446d':'#41f6ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=timer<.25?'#ff446d':'#ff4fd8';ctx.beginPath();ctx.arc(a.r*.82,-a.r*.58,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071026';ctx.font='700 15px Orbitron, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',a.r*.82,-a.r*.58+1);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-a.r*.52,-3);ctx.lineTo(-a.r*.18,10);ctx.lineTo(a.r*.13,-6);ctx.lineTo(a.r*.48,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='600 10px Rajdhani, sans-serif';ctx.fillText(a.type.toUpperCase(),0,a.r*.46);if(clean<1){ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(255,68,109,${.72*(1-clean)})`;ctx.fillRect(-a.r*1.2,-a.r,a.r*2.4,a.r*2);ctx.globalCompositeOperation='source-over'}ctx.globalAlpha=.22+(1-timer)*.28;ctx.strokeStyle=timer<.25?'#ff446d':'#ffd166';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,a.r+9,-Math.PI/2,-Math.PI/2+Math.PI*2*timer);ctx.stroke();ctx.globalAlpha=1;ctx.restore()}
function drawMonster(){ctx.save();ctx.translate(tool.x,tool.y);const bob=Math.sin(performance.now()*.01)*1.8;ctx.translate(0,bob);ctx.shadowColor='rgba(255,79,216,.5)';ctx.shadowBlur=22;ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,28,28,9,0,0,Math.PI*2);ctx.fill();const grad=ctx.createRadialGradient(-9,-12,4,0,0,33);grad.addColorStop(0,'#fff4ff');grad.addColorStop(.35,'#ff7ce5');grad.addColorStop(.72,'#8a6cff');grad.addColorStop(1,'#2a1766');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-23,-10);ctx.quadraticCurveTo(-20,-29,-6,-24);ctx.quadraticCurveTo(0,-34,8,-24);ctx.quadraticCurveTo(22,-29,24,-9);ctx.quadraticCurveTo(31,9,17,24);ctx.quadraticCurveTo(0,36,-18,24);ctx.quadraticCurveTo(-31,9,-23,-10);ctx.fill();ctx.strokeStyle='#41f6ff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-9,-6,6,0,Math.PI*2);ctx.arc(10,-6,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#061026';const off=tool.isScrubbing?2:0;ctx.beginPath();ctx.arc(-9+off,-5,2.4,0,Math.PI*2);ctx.arc(10+off,-5,2.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#061026';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.arc(1,6,tool.isScrubbing?8:6,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.strokeStyle='rgba(65,246,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-15,11);ctx.quadraticCurveTo(-22,18,-19,25);ctx.moveTo(17,11);ctx.quadraticCurveTo(24,18,20,25);ctx.stroke();if(tool.isScrubbing){for(let i=0;i<4;i++){ctx.strokeStyle=`rgba(65,246,255,${.5-i*.1})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(-28+i*8,-8-i*3,8+i*2,1.15*Math.PI,1.85*Math.PI);ctx.stroke()}}ctx.restore()}
function update(dt){if(gameState!=='PLAYING')return;scrubCooldown=Math.max(0,scrubCooldown-dt);const lerp=.2;tool.vx=(inputPos.x-tool.x)*lerp;tool.vy=(inputPos.y-tool.y)*lerp;tool.x+=tool.vx;tool.y+=tool.vy;const moveDist=Math.hypot(tool.x-lastInputPos.x,tool.y-lastInputPos.y);tool.isScrubbing=moveDist>5;if(tool.isScrubbing){const dx=tool.x-lastInputPos.x,dy=tool.y-lastInputPos.y,segs=Math.floor(moveDist/5);for(let i=0;i<segs;i++){const t=i/segs;particles.push({x:lastInputPos.x+dx*t,y:lastInputPos.y+dy*t,vx:(rand()-.5)*100,vy:-50-rand()*100,life:.3+rand()*.2,r:2+rand()*3,color:'#41f6ff'})}}lastInputPos.x=tool.x;lastInputPos.y=tool.y;const scrubSpeed=window.gameConfig.scrubSpeed||60;alerts.forEach((a,idx)=>{a.wobble+=dt*2;a.timer-=dt;if(a.state==='raw'){const d=Math.hypot(tool.x-a.x,tool.y-a.y);if(d<a.r+20&&tool.isScrubbing&&a.soothe<a.maxSoothe){a.soothe+=scrubSpeed*dt;vibrate('light');if(scrubCooldown<=0){AudioManager.playSfx('scrub',.16);scrubCooldown=.09}if(rand()<.1)particles.push({x:a.x+(rand()-.5)*a.r,y:a.y+(rand()-.5)*a.r,vx:(rand()-.5)*200,vy:(rand()-.5)*200,life:.4,r:4,color:'#ff4fd8'});if(a.soothe>=a.maxSoothe){a.soothe=a.maxSoothe;a.state='soft';AudioManager.playSfx('clean',.44);showFeedbackGif(celebrationGif,1100);vibrate('medium');score++;streak++;scoreDisplay.textContent=score;streakDisplay.textContent=streak;for(let i=0;i<14;i++)particles.push({x:a.x,y:a.y,vx:(rand()-.5)*320,vy:(rand()-.5)*320,life:.5,r:3+rand()*3,color:i%2?'#ffd166':'#41f6ff'});setTimeout(()=>{alerts.splice(idx,1);spawnAlert()},300)}}if(a.timer<=0){a.timer=0;setState('GAMEOVER')}else if(!warningPlayedForCurrentAlert&&a.timer/a.maxTimer<.28){warningPlayedForCurrentAlert=true;AudioManager.playSfx('warning',.34)}}});spawnTimer+=dt;particles.forEach((p,i)=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)});if(!isFinite(tool.x)||!isFinite(tool.y)){tool.x=cw/2;tool.y=ch/2}}
function draw(){drawBackground();alerts.forEach(a=>{drawAlert(a);const timerRatio=a.timer/a.maxTimer,barW=70,barH=9,barX=a.x-barW/2,barY=a.y-a.r-25;ctx.fillStyle='rgba(2,4,18,.55)';roundRect(barX-3,barY-3,barW+6,barH+6,6);ctx.fill();const bg=ctx.createLinearGradient(barX,barY,barX+barW,barY);if(timerRatio>.5){bg.addColorStop(0,'#41f6ff');bg.addColorStop(1,'#79fff0')}else if(timerRatio>.25){bg.addColorStop(0,'#ffd166');bg.addColorStop(1,'#ff9f1c')}else{bg.addColorStop(0,'#ff4fd8');bg.addColorStop(1,'#ff446d')}ctx.fillStyle=bg;roundRect(barX,barY,Math.max(0,barW*timerRatio),barH,5);ctx.fill();const clean=a.soothe/a.maxSoothe;ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(barX,barY+16);ctx.lineTo(barX+barW*clean,barY+16);ctx.stroke()});drawMonster();particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/.5);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0,p.r),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}
function loop(ts){try{const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;update(dt);draw();requestAnimationFrame(loop)}catch(e){console.error(e);requestAnimationFrame(loop)}}
window.__gameQA={getState:()=>({gameState,score,streak,alerts:alerts.map(a=>({x:a.x,y:a.y,r:a.r,soothe:a.soothe,timer:a.timer,type:a.type})),tool:{x:tool.x,y:tool.y,isScrubbing:tool.isScrubbing}}),forceGameOver:()=>setState('GAMEOVER'),restart:()=>initGame(true),config:window.gameConfig};
</script>
