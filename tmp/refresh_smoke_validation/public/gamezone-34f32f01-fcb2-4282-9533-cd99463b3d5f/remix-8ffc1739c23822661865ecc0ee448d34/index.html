<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Golden Signal Run</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <!-- [agent-note][stage4] repaired: font-remap | source: catalogs/fonts.json | removed: mirrored/non-catalog font refs -->
    <style>
        :root {
            --bg-deep: #060713;
            --bg-mid: #101632;
            --panel-bg: rgba(13, 19, 46, 0.86);
            --panel-edge: rgba(110, 239, 255, 0.58);
            --panel-shadow: rgba(74, 150, 255, 0.28);
            --text-main: #f5f7ff;
            --text-soft: #a6c3ff;
            --accent-gold: #ffd452;
            --accent-cyan: #67e8f9;
            --accent-pink: #ff5db1;
            --danger: #ff5a7a;
            --success: #60f78f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(87, 157, 255, 0.18), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 86, 167, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text-main);
            font-family: 'Exo 2', 'Rajdhani', system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 120%, rgba(255, 212, 82, 0.18), transparent 24%),
                linear-gradient(180deg, rgba(4, 7, 24, 0.4), rgba(4, 7, 24, 0.82));
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(103, 232, 249, 0.05) 50%, transparent 100%);
            opacity: 0.7;
            mix-blend-mode: screen;
        }

        #game-container::after {
            background:
                radial-gradient(circle at 20% 15%, rgba(255, 212, 82, 0.12), transparent 16%),
                radial-gradient(circle at 82% 20%, rgba(103, 232, 249, 0.1), transparent 14%),
                radial-gradient(circle at 75% 78%, rgba(255, 93, 177, 0.08), transparent 18%);
        }

        .crt-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0.2) 50%),
                linear-gradient(90deg, rgba(255, 0, 119, 0.05), rgba(0, 255, 255, 0.03), rgba(255, 224, 102, 0.04));
            background-size: 100% 3px, 4px 100%;
            opacity: 0.55;
        }

        .signal-pulse {
            position: absolute;
            inset: 0;
            z-index: 11;
            pointer-events: none;
            overflow: hidden;
        }

        .signal-pulse span {
            position: absolute;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 18px currentColor;
            animation: sparkFloat 3.4s ease-in-out infinite;
        }

        .signal-pulse span:nth-child(1) {
            left: 16%;
            top: 18%;
            color: var(--accent-cyan);
        }

        .signal-pulse span:nth-child(2) {
            left: 81%;
            top: 24%;
            color: var(--accent-gold);
            animation-delay: 0.8s;
        }

        .signal-pulse span:nth-child(3) {
            left: 72%;
            top: 70%;
            color: var(--accent-pink);
            animation-delay: 1.6s;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(18, 26, 61, 0.94), rgba(7, 12, 32, 0.9));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 2px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 16px 40px rgba(0, 0, 0, 0.42),
                0 0 24px var(--panel-shadow);
            color: var(--text-main);
            pointer-events: auto;
            text-align: center;
            width: min(92vw, 540px);
            padding: 1.5rem 1.2rem;
            box-sizing: border-box;
            border-radius: 18px;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 32%),
                linear-gradient(180deg, transparent, rgba(103, 232, 249, 0.06));
            pointer-events: none;
        }

        .panel-start {
            border-color: rgba(96, 247, 143, 0.62);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 16px 40px rgba(0, 0, 0, 0.42),
                0 0 26px rgba(96, 247, 143, 0.18);
        }

        .panel-game-over {
            border-color: rgba(255, 90, 122, 0.62);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 16px 40px rgba(0, 0, 0, 0.42),
                0 0 26px rgba(255, 90, 122, 0.16);
        }

        .screen-hidden {
            display: none;
        }

        .title-large {
            position: relative;
            z-index: 1;
            margin: 0 0 0.75rem;
            font-family: 'Audiowide', 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.9rem, 7vw, 3.6rem);
            line-height: 1.08;
            letter-spacing: 0.16rem;
            color: var(--text-main);
            text-shadow:
                0 0 8px rgba(103, 232, 249, 0.5),
                0 0 16px rgba(255, 93, 177, 0.22);
        }

        .subtitle,
        .support-copy,
        .result-copy {
            position: relative;
            z-index: 1;
            margin-left: auto;
            margin-right: auto;
            max-width: 28rem;
        }

        .subtitle {
            margin: 0 0 0.9rem;
            font-size: clamp(1rem, 3vw, 1.15rem);
            color: var(--accent-cyan);
            line-height: 1.35;
            font-weight: 600;
            letter-spacing: 0.05rem;
        }

        .support-copy {
            margin: 0 0 1.15rem;
            font-size: clamp(0.95rem, 2.7vw, 1.05rem);
            color: var(--text-soft);
            line-height: 1.35;
            text-wrap: balance;
        }

        .result-copy {
            margin: 0 0 1.1rem;
            font-size: clamp(1rem, 3vw, 1.3rem);
            line-height: 1.4;
            color: var(--text-main);
            font-weight: 600;
        }

        .callout-chip {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.95rem;
            padding: 0.42rem 0.72rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(103, 232, 249, 0.22);
            color: var(--accent-gold);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.52rem, 1.8vw, 0.66rem);
            letter-spacing: 0.08rem;
            text-transform: uppercase;
        }

        .arcade-button {
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            padding: 0.9rem 1.25rem;
            min-width: min(100%, 18rem);
            color: var(--bg-deep);
            font-family: 'Audiowide', 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.95rem, 2.8vw, 1.06rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12rem;
            border-radius: 999px;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
        }

        .arcade-button:hover {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.05);
        }

        .arcade-button:active,
        .arcade-button.is-pressed {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        .button-start {
            background: linear-gradient(135deg, var(--accent-gold), #fff0a5);
            box-shadow: 0 0 18px rgba(255, 212, 82, 0.4);
        }

        .button-restart {
            background: linear-gradient(135deg, #ff6b90, #ffb1c4);
            box-shadow: 0 0 18px rgba(255, 90, 122, 0.34);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            position: absolute;
            top: 0.9rem;
            left: 0.9rem;
            z-index: 21;
            min-width: 0;
            padding: 0.55rem 0.75rem;
            border-radius: 14px;
            border: 1px solid rgba(103, 232, 249, 0.24);
            background: rgba(8, 12, 29, 0.72);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.26),
                0 0 16px rgba(103, 232, 249, 0.1);
            color: var(--text-main);
            font-family: 'Exo 2', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(0.8rem, 2vw, 1rem);
            letter-spacing: 0.08rem;
            text-shadow: 0 0 10px rgba(103, 232, 249, 0.35);
        }

        .hud-label {
            display: block;
            margin-bottom: 0.2rem;
            color: var(--accent-cyan);
            font-size: 0.74em;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.08rem;
        }

        .hud-value {
            color: var(--accent-gold);
        }

        .retro-text {
            animation: titlePulse 2.2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% {
                opacity: 0.95;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-1px);
            }
        }

        @keyframes sparkFloat {
            0%, 100% {
                transform: translateY(0) scale(0.9);
                opacity: 0.2;
            }
            50% {
                transform: translateY(-12px) scale(1.2);
                opacity: 0.85;
            }
        }

        .feedback-gif {
            position: absolute;
            right: 0.9rem;
            bottom: 1rem;
            z-index: 18;
            width: min(30vw, 140px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            background: rgba(7, 12, 32, 0.78);
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            overflow: hidden;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .feedback-tag {
            position: absolute;
            left: 0.45rem;
            bottom: 0.45rem;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            background: rgba(6, 7, 19, 0.7);
            color: var(--text-main);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 0.45rem;
            letter-spacing: 0.05rem;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            .glass-panel {
                padding: 1.2rem 1rem;
                border-radius: 16px;
            }

            .callout-chip {
                margin-bottom: 0.8rem;
            }

            #hud {
                top: 0.7rem;
                left: 0.7rem;
                padding: 0.5rem 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="crt-overlay"></div>
        <div class="signal-pulse" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div id="ui-layer">
            <div id="start-screen" class="glass-panel panel-start">
                <div class="callout-chip">📡 idol signal live</div>
                <h1 class="title-large retro-text">SIGNAL STAR</h1>
                <p class="subtitle">Slide the mascot dish under the cleanest transmission drops.</p>
                <div class="support-copy">Catch glowing good channels, dodge corrupted broadcasts, and keep the remix feed sparkling.</div>
                <button id="start-btn" class="arcade-button button-start">Start Broadcast</button>
            </div>

            <div id="game-over-screen" class="glass-panel panel-game-over screen-hidden">
                <div class="callout-chip">⚠️ feed disrupted</div>
                <h2 class="title-large retro-text">SIGNAL LOST</h2>
                <div class="result-copy">Clean channels secured: <span id="finalScore">0</span></div>
                <button id="restart-btn" class="arcade-button button-restart">Retry Feed</button>
            </div>

            <div id="hud" class="screen-hidden">
                <span class="hud-label">clean feed</span>
                <span class="hud-value"><span id="score">0</span> pts</span>
            </div>

            <!-- [agent-note][stage3] resolved-gif: collect/fail feedback -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <div id="collect-gif" class="feedback-gif" aria-hidden="true">
                <img src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="">
                <span class="feedback-tag">clean catch</span>
            </div>
            <div id="fail-gif" class="feedback-gif" aria-hidden="true">
                <img src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="">
                <span class="feedback-tag">signal lost</span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const ENABLE_ANIMATIONS = true;
        const FEEDBACK_WEBP = true;

        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                collect: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                streak: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.cooldowns = {};
                this.sfxSettings = {
                    start: { volume: 0.55, cooldown: 180 },
                    collect: { volume: 0.52, cooldown: 70 },
                    streak: { volume: 0.58, cooldown: 150 },
                    fail: { volume: 0.6, cooldown: 250 },
                    danger: { volume: 0.48, cooldown: 300 }
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].preload = 'auto';
                }
            }

            unlock() {
                this.enabled = true;
                this.bgm.load();
                Object.values(this.sfx).forEach((clip) => clip.load());
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const { volume = 0.5, cooldown = 0 } = this.sfxSettings[key] || {};
                if (now - (this.cooldowns[key] || 0) < cooldown) return;
                this.cooldowns[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('start-btn');
        const restartButton = document.getElementById('restart-btn');
        const collectGif = document.getElementById('collect-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let frameCount = 0;
        let speedMultiplier = 1;
        let sparklePhase = 0;

        let player = {
            x: 0,
            y: 0,
            width: 80,
            height: 50,
            color: '#FFD700',
            targetX: 0
        };

        let drops = [];
        let particles = [];
        let collectCount = 0;
        let activeGifTimer = null;

        function bindButtonFeedback(button) {
            if (!button || !ENABLE_ANIMATIONS) return;
            const press = () => button.classList.add('is-pressed');
            const release = () => button.classList.remove('is-pressed');
            button.addEventListener('pointerdown', press);
            button.addEventListener('pointerup', release);
            button.addEventListener('pointerleave', release);
            button.addEventListener('pointercancel', release);
        }

        bindButtonFeedback(startButton);
        bindButtonFeedback(restartButton);

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            player.targetX = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function handleInput(e) {
            if (!gameActive) return;
            if (e.cancelable && e.type.startsWith('touch')) {
                e.preventDefault();
            }
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.targetX = clientX;
        }
        window.addEventListener('mousemove', handleInput);
        /* [agent-note][stage4] repaired: mobile-actionability | scope: gameplay-drag only | avoid: global touch suppression on buttons */
        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('touchmove', handleInput, { passive: false });

        /** 4. GAME LOGIC */
        function showFeedbackGif(target, duration = 900) {
            if (!target) return;
            clearTimeout(activeGifTimer);
            collectGif.classList.remove('is-visible');
            failGif.classList.remove('is-visible');
            target.classList.add('is-visible');
            activeGifTimer = setTimeout(() => target.classList.remove('is-visible'), duration);
        }

        function initGame() {
            score = 0;
            drops = [];
            particles = [];
            speedMultiplier = 1;
            frameCount = 0;
            sparklePhase = 0;
            collectCount = 0;
            player.x = width / 2;
            document.getElementById('score').innerText = score;
            collectGif.classList.remove('is-visible');
            failGif.classList.remove('is-visible');
        }

        function spawnDrop() {
            const isBad = Math.random() > 0.6;
            const size = 40 + Math.random() * 20;

            let type = 'food';
            if (isBad) {
                const badTypes = ['static', 'censored', 'annoying'];
                type = badTypes[Math.floor(Math.random() * badTypes.length)];
            }

            drops.push({
                x: Math.random() * (width - size),
                y: -50,
                size: size,
                speed: (3 + Math.random() * 3) * speedMultiplier,
                type: type,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function drawTVStatic(ctx) {
            if (frameCount % 4 === 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.04})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawBroadcastSky() {
            const skyGlow = ctx.createLinearGradient(0, 0, 0, height);
            skyGlow.addColorStop(0, '#111a3f');
            skyGlow.addColorStop(0.52, '#0a1129');
            skyGlow.addColorStop(1, '#05070f');
            ctx.fillStyle = skyGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.35;
            const horizon = ctx.createRadialGradient(width * 0.5, height * 0.92, 20, width * 0.5, height * 0.92, width * 0.58);
            horizon.addColorStop(0, 'rgba(255, 212, 82, 0.32)');
            horizon.addColorStop(0.5, 'rgba(103, 232, 249, 0.12)');
            horizon.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = horizon;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = 'rgba(103, 232, 249, 0.1)';
            ctx.lineWidth = 1;
            for (let y = height * 0.2; y < height; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer() {
            const pulse = ENABLE_ANIMATIONS ? Math.sin(sparklePhase) * 3 : 0;

            ctx.save();
            ctx.translate(player.x, player.y + pulse);

            ctx.shadowBlur = 26;
            ctx.shadowColor = '#ffd452';

            const shellGradient = ctx.createLinearGradient(-player.width / 2, -player.height / 2, player.width / 2, player.height / 2);
            shellGradient.addColorStop(0, '#fff0a6');
            shellGradient.addColorStop(0.48, '#ffd452');
            shellGradient.addColorStop(1, '#ff9a3d');

            ctx.fillStyle = shellGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, player.width / 2, player.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#1a1d32';
            ctx.beginPath();
            ctx.arc(-14, -4, 5, 0, Math.PI * 2);
            ctx.arc(14, -4, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#1a1d32';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-10, 12);
            ctx.quadraticCurveTo(0, 19, 10, 12);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
            ctx.beginPath();
            ctx.ellipse(-8, -10, 14, 6, -0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1a1d32';
            ctx.font = 'bold 10px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('DJ', 0, -1);

            ctx.restore();
        }

        function drawFoodDrop(d) {
            const glow = ctx.createRadialGradient(0, 0, d.size * 0.12, 0, 0, d.size * 0.55);
            glow.addColorStop(0, '#fffde8');
            glow.addColorStop(0.45, '#67e8f9');
            glow.addColorStop(1, '#3b82f6');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, d.size / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff7b2';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-d.size * 0.2, 0);
            ctx.lineTo(d.size * 0.2, 0);
            ctx.moveTo(0, -d.size * 0.2);
            ctx.lineTo(0, d.size * 0.2);
            ctx.stroke();

            ctx.fillStyle = '#ffd452';
            ctx.beginPath();
            ctx.arc(5, -5, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawStaticDrop(d) {
            ctx.fillStyle = '#1b2447';
            ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 2;
            ctx.strokeRect(-d.size / 2, -d.size / 2, d.size, d.size);

            ctx.fillStyle = '#f5f7ff';
            for (let k = 0; k < 6; k++) {
                ctx.fillRect((Math.random() - 0.5) * d.size, (Math.random() - 0.5) * d.size, 4, 4);
            }
        }

        function drawCensoredDrop(d) {
            ctx.fillStyle = '#2f153d';
            ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
            ctx.strokeStyle = '#ff5db1';
            ctx.lineWidth = 2;
            ctx.strokeRect(-d.size / 2, -d.size / 2, d.size, d.size);

            ctx.fillStyle = '#fff';
            ctx.fillRect(-d.size / 2, -d.size / 6, d.size, d.size / 3);

            ctx.fillStyle = '#2f153d';
            ctx.font = 'bold 12px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('###', 0, 0);
        }

        function drawAnnoyingDrop(d) {
            ctx.fillStyle = '#4b1020';
            ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
            ctx.strokeStyle = '#ff8ea6';
            ctx.lineWidth = 2;
            ctx.strokeRect(-d.size / 2, -d.size / 2, d.size, d.size);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px "Audiowide", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('TV', 0, -4);
            ctx.font = 'bold 10px "Exo 2", system-ui, sans-serif';
            ctx.fillText('NOISE', 0, 10);
        }

        function gameLoop() {
            if (!gameActive) return;

            drawBroadcastSky();
            drawTVStatic(ctx);

            player.x += (player.targetX - player.x) * 0.15;
            sparklePhase += 0.12;
            drawPlayer();

            if (frameCount % 40 === 0) spawnDrop();
            speedMultiplier = 1 + (score / 500);

            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                d.y += d.speed;
                d.rotation += d.rotSpeed;

                ctx.save();
                ctx.translate(d.x + d.size / 2, d.y + d.size / 2);
                ctx.rotate(d.rotation);

                if (d.type === 'food') {
                    drawFoodDrop(d);
                } else if (d.type === 'static') {
                    drawStaticDrop(d);
                } else if (d.type === 'censored') {
                    drawCensoredDrop(d);
                } else {
                    drawAnnoyingDrop(d);
                }
                ctx.restore();

                const dx = player.x - (d.x + d.size / 2);
                const dy = player.y - (d.y + d.size / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < (player.width / 2 + d.size / 2)) {
                    if (d.type === 'food') {
                        score += 10;
                        collectCount += 1;
                        document.getElementById('score').innerText = score;
                        audio.playSFX('collect');
                        if (collectCount % 5 === 0) {
                            audio.playSFX('streak');
                        }
                        createParticles(player.x, player.y, '#FFD700');
                        showFeedbackGif(collectGif, collectCount % 5 === 0 ? 1200 : 720);
                    } else {
                        audio.playSFX('danger');
                        gameOver();
                    }
                    drops.splice(i, 1);
                    continue;
                }

                if (d.y > height) {
                    drops.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');
            showFeedbackGif(failGif, 1800);
            document.getElementById('hud').classList.add('screen-hidden');
            document.getElementById('game-over-screen').classList.remove('screen-hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 5. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            document.getElementById('start-screen').classList.add('screen-hidden');
            document.getElementById('hud').classList.remove('screen-hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start');
            document.getElementById('game-over-screen').classList.add('screen-hidden');
            document.getElementById('hud').classList.remove('screen-hidden');
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
