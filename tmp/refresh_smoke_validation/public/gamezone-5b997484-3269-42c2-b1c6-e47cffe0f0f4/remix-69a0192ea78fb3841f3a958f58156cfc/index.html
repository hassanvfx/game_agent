<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] font-remap: title/buttons=Audiowide body-ui=Rajdhani retro-label=Press Start 2P via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Pulse: Reboot</title>
    <style>
        :root {
            --bg-deep: #070b18;
            --bg-mid: #101a31;
            --panel-fill: rgba(7, 13, 30, 0.88);
            --panel-border: rgba(120, 238, 255, 0.28);
            --text-main: #f5f7ff;
            --text-soft: #8fb7d6;
            --signal-cyan: #78eeff;
            --signal-pink: #ff5aa9;
            --signal-violet: #9d7dff;
            --signal-gold: #ffd36a;
            --shadow-glow: rgba(120, 238, 255, 0.24);
        }

        /* BASELINE */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top, rgba(120, 238, 255, 0.12), transparent 35%),
                radial-gradient(circle at bottom, rgba(255, 90, 169, 0.16), transparent 30%),
                linear-gradient(180deg, #040814, #070b18 40%, #02050d 100%);
            color: var(--text-main);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0%, rgba(120, 238, 255, 0.06) 50%, transparent 100%);
            opacity: 0.3;
            mix-blend-mode: screen;
        }

        body::after {
            background:
                radial-gradient(circle at 20% 20%, rgba(157, 125, 255, 0.12), transparent 18%),
                radial-gradient(circle at 80% 10%, rgba(255, 90, 169, 0.14), transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(120, 238, 255, 0.12), transparent 22%);
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; position: relative; z-index: 1; }

        /* UI OVERLAY */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .interactive { pointer-events: auto; cursor: pointer; }

        /* TYPOGRAPHY */
        .neon-text {
            color: var(--text-main);
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 0.88;
            text-align: center;
            text-shadow:
                0 0 10px rgba(120, 238, 255, 0.35),
                0 0 24px rgba(255, 90, 169, 0.42),
                0 6px 0 rgba(8, 11, 25, 0.7);
        }
        h1 { font-size: clamp(2.4rem, 8vw, 5.6rem); margin: 0; transform: rotate(-2deg); animation: glitch 2.6s infinite; }
        p {
            font-size: clamp(0.95rem, 2.9vw, 1.3rem);
            color: var(--signal-cyan);
            margin-top: 16px;
            text-shadow: 0 0 10px rgba(120, 238, 255, 0.28);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        /* PANELS */
        .panel {
            background:
                linear-gradient(180deg, rgba(15, 25, 48, 0.92), rgba(7, 12, 27, 0.94));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 28px 24px;
            width: min(88vw, 420px);
            text-align: center;
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.38),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 0 32px rgba(120, 238, 255, 0.12);
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            transform: scale(0.94) translateY(10px);
            pointer-events: none;
            position: relative;
            overflow: hidden;
        }
        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(120, 238, 255, 0.12), transparent 30%),
                linear-gradient(315deg, rgba(255, 90, 169, 0.12), transparent 35%);
            pointer-events: none;
        }
        .panel.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: max(12px, env(safe-area-inset-top)) 12px 0;
            box-sizing: border-box; display: flex; justify-content: space-between; gap: 10px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .hud-visible { opacity: 1 !important; }
        .score-box,
        .combo-box {
            text-align: left;
            min-width: 0;
            background: linear-gradient(180deg, rgba(8, 18, 36, 0.84), rgba(8, 14, 28, 0.62));
            border: 1px solid rgba(120, 238, 255, 0.2);
            border-radius: 14px;
            padding: 8px 10px 9px;
            box-shadow: 0 0 18px rgba(120, 238, 255, 0.08);
        }
        .combo-box { text-align: right; }
        .label {
            display: block;
            font-size: 10px;
            color: var(--text-soft);
            letter-spacing: 0.18em;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            margin-bottom: 6px;
        }
        .value {
            font-size: clamp(1.1rem, 4vw, 1.7rem);
            font-weight: bold;
            color: var(--text-main);
            text-shadow: 0 0 12px rgba(120, 238, 255, 0.35);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            line-height: 1;
        }

        /* BUTTONS */
        button {
            background: linear-gradient(135deg, var(--signal-pink), #ff8f5d);
            border: 1px solid rgba(255,255,255,0.14);
            color: white;
            padding: 13px 28px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-radius: 14px;
            margin-top: 22px;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(255, 90, 169, 0.28);
        }
        button:active { transform: scale(0.95); filter: brightness(1.14); }
        button:hover { box-shadow: 0 12px 24px rgba(255, 90, 169, 0.4); }

        @media (max-width: 640px) {
            h1 { font-size: clamp(2.2rem, 15vw, 4rem); }
            p { font-size: 0.95rem; margin-top: 12px; }
            .panel { width: min(90vw, 360px); padding: 24px 18px; }
            .label { font-size: 9px; }
        }

        /* ANIMATIONS */
        @keyframes glitch {
            0% { transform: skew(-10deg); }
            20% { transform: skew(-10deg) translate(-2px, 2px); }
            21% { transform: skew(-10deg) translate(2px, -2px); }
            22% { transform: skew(-10deg); }
            100% { transform: skew(-10deg); }
        }
        .feedback-gif {
            position: absolute;
            width: clamp(88px, 20vw, 140px);
            height: clamp(88px, 20vw, 140px);
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(120, 238, 255, 0.24);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 11;
            background: rgba(5, 10, 24, 0.7);
        }
        .feedback-gif.active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #combo-gif {
            right: 12px;
            bottom: max(120px, env(safe-area-inset-bottom) + 88px);
        }
        #danger-gif {
            left: 12px;
            bottom: max(120px, env(safe-area-inset-bottom) + 88px);
        }
        .hidden { display: none !important; }
    </style>
</head>

<!-- GAME DOM -->
<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="hud">
        <div class="score-box">
            <span class="label">SYNC</span>
            <span id="score-val" class="value">0</span>
        </div>

        <h1 class="neon-text" style="color:#ffd7f0; text-shadow:0 0 10px rgba(255,90,169,0.9), 0 0 24px rgba(255,90,169,0.45);">SIGNAL<br>LOST</h1>

        <p>BEST CHAIN: <span id="max-combo" style="color:white">0</span></p>

    </div>

    <!-- [agent-note][stage3] resolved-gif: combo-celebration + fail-warning via catalogs/gifs.json -->
    <img id="combo-gif" class="feedback-gif" alt="Combo celebration effect" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp">
    <img id="danger-gif" class="feedback-gif" alt="Miss warning effect" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">
</div>

<script>
/**
 * AUDIO SYSTEM V2 (Robust Fallback)
 * If assets fail to load, we synthesize sound so the game never breaks.
 */
const AudioSys = {
    ctx: null,
    bgm: null,
    buffers: {},
    unlocked: false,
    lastPlayedAt: {},

    init() {
        try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new Ctx();
        } catch (e) {
            console.warn("Audio context unavailable, using HTML audio and synth fallbacks.");
        }

        this.bgm = document.getElementById('bgm_main');
        ['hit', 'combo', 'fail', 'start'].forEach((key) => {
            const node = document.getElementById(`sfx_${key}`);
            if (node) this.loadSFX(key, node.src);
        });

        if (this.bgm) {
            this.bgm.volume = Math.min(0.2, window.gameConfig.musicVolume * 0.2);
            this.bgm.addEventListener('error', () => {
                console.warn("Looped BGM failed to load; gameplay continues silently.");
            });
        }
    },

    async loadSFX(key, url) {
        if (!this.ctx) {
            this.buffers[key] = 'html';
            return;
        }
        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error("404");
            const data = await resp.arrayBuffer();
            this.buffers[key] = await this.ctx.decodeAudioData(data);
        } catch (e) {
            console.warn(`SFX ${key} failed, using synth/html fallback.`);
            this.buffers[key] = 'synth';
        }
    },

    unlock() {
        if (!this.unlocked) this.unlocked = true;
        if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
        this.startLoop();
    },

    startLoop() {
        if (!this.bgm) return;
        this.bgm.volume = Math.min(0.2, window.gameConfig.musicVolume * 0.2);
        if (this.bgm.paused) {
            this.bgm.play().catch(() => {});
        }
    },

    pauseLoop() {
        if (this.bgm && !this.bgm.paused) this.bgm.pause();
    },

    stop() {
        if (this.bgm) {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }
    },

    canPlay(key, minGap = 80) {
        const now = performance.now();
        if ((this.lastPlayedAt[key] || 0) + minGap > now) return false;
        this.lastPlayedAt[key] = now;
        return true;
    },

    playBuffer(key, volume = 0.2, rate = 1) {
        if (!this.ctx || !this.buffers[key] || this.buffers[key] === 'synth' || this.buffers[key] === 'html') return false;
        const src = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        gain.gain.value = volume;
        src.buffer = this.buffers[key];
        src.playbackRate.value = rate;
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(0);
        return true;
    },

    playSynth(type, freqStart, freqEnd, duration = 0.12, volume = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    playCue(key, options = {}) {
        const {
            minGap = 90,
            volume = 0.2,
            rate = 1,
            synth = null
        } = options;
        if (!this.unlocked || !this.canPlay(key, minGap)) return;
        if (this.playBuffer(key, volume, rate)) return;
        if (synth) this.playSynth(synth.type, synth.from, synth.to, synth.duration, synth.volume);
    },

    playHit(pitch = 440) {
        this.playCue('hit', {
            minGap: 70,
            volume: 0.18,
            rate: Math.max(0.9, Math.min(1.18, pitch / 520)),
            synth: { type: 'triangle', from: pitch, to: 180, duration: 0.11, volume: 0.12 }
        });
    },

    playCombo() {
        this.playCue('combo', {
            minGap: 120,
            volume: 0.16,
            rate: 1,
            synth: { type: 'sine', from: 880, to: 1220, duration: 0.16, volume: 0.1 }
        });
    },

    playFail() {
        this.playCue('fail', {
            minGap: 120,
            volume: 0.18,
            rate: 1,
            synth: { type: 'sawtooth', from: 220, to: 90, duration: 0.18, volume: 0.08 }
        });
    },

    playStart() {
        this.playCue('start', {
            minGap: 200,
            volume: 0.15,
            rate: 1,
            synth: { type: 'square', from: 540, to: 760, duration: 0.13, volume: 0.08 }
        });
    }
};

/**
 * GAME ENGINE
 */
const CONFIG = {
    lanes: 4,
    colors: ['#ff5aa9', '#78eeff', '#9cffc7', '#ffd36a'], // Magenta, Cyan, Mint, Gold
    hitY: 0,
    perfect: 50,
    good: 120,
    miss: 180
};

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d', { alpha: false }),
    state: 'INIT', // INIT, PLAY, OVER
    width: 0, height: 0, laneW: 0,
    
    // Entities
    notes: [],
    particles: [],
    texts: [],
    
    // State
    score: 0, combo: 0, maxCombo: 0,
    time: 0, nextSpawn: 0,
    lanePress: [0,0,0,0],
    shake: 0,
    
    // Background
    stars: [],
    gridOffset: 0,
    comboGif: document.getElementById('combo-gif'),
    dangerGif: document.getElementById('danger-gif'),
    feedbackTimers: { combo: 0, danger: 0 },

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Generate Stars
        for(let i=0; i<60; i++) {
            this.stars.push({
                x: Math.random(), y: Math.random(),
                z: Math.random() * 2 + 0.5, // Depth/Speed
                sz: Math.random() * 2
            });
        }

        // Input Handling (Unified)
        const inputHandler = (e) => {
            if (e.type !== 'keydown') e.preventDefault();
            AudioSys.unlock();

            if (this.state === 'INIT') {
                this.startGame();
            } else if (this.state === 'OVER') {
                if (e.target.id === 'btn-restart') this.startGame();
            } else if (this.state === 'PLAY') {
                this.handleInput(e);
            }
        };

        window.addEventListener('pointerdown', inputHandler, { passive: false });
        window.addEventListener('keydown', inputHandler);

        // Loop
        let last = performance.now();
        const loop = (now) => {
            requestAnimationFrame(loop);
            const dt = Math.min((now - last) / 1000, 0.1);
            last = now;
            try { this.update(dt); this.render(); } 
            catch(e) { console.error("Game Loop Error", e); }
        };
        requestAnimationFrame(loop);
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        
        this.laneW = this.width / CONFIG.lanes;
        CONFIG.hitY = this.height - 120;
    },

    startGame() {
        this.state = 'PLAY';
        this.score = 0; this.combo = 0; this.maxCombo = 0;
        this.notes = []; this.particles = []; this.texts = [];
        this.time = 0; this.nextSpawn = 0;
        this.feedbackTimers.combo = 0;
        this.feedbackTimers.danger = 0;
        this.setGifState('combo', false);
        this.setGifState('danger', false);

        AudioSys.playStart();
        AudioSys.startLoop();
        
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('screen-gameover').classList.remove('active');
        document.getElementById('hud').classList.add('hud-visible');
        this.updateHUD();
    },

    gameOver() {
        this.state = 'OVER';
        AudioSys.stop();
        this.setGifState('combo', false);
        this.setGifState('danger', true, 1.4);
        document.getElementById('hud').classList.remove('hud-visible');
        document.getElementById('screen-gameover').classList.add('active');
        document.getElementById('final-score').innerText = this.score;
        document.getElementById('max-combo').innerText = this.maxCombo;
    },

    handleInput(e) {
        let lanes = [];
        if (e.type === 'keydown') {
            const map = { 'd':0, 'f':1, 'j':2, 'k':3, 'ArrowLeft':0, 'ArrowDown':1, 'ArrowUp':2, 'ArrowRight':3 };
            if (map[e.key] !== undefined) lanes.push(map[e.key]);
        } else {
            // Touch/Mouse
            const x = e.clientX;
            const l = Math.floor(x / this.laneW);
            if (l >= 0 && l < 4) lanes.push(l);
        }

        lanes.forEach(l => this.triggerLane(l));
    },

    triggerLane(lane) {
        this.lanePress[lane] = 1.0;
        
        // Hit Detection
        const hitY = CONFIG.hitY;
        let hitNote = null;
        let minDist = Infinity;

        // Find closest active note in lane
        for (let n of this.notes) {
            if (n.lane === lane && !n.hit) {
                const dist = Math.abs(n.y - hitY);
                if (dist < minDist) {
                    minDist = dist;
                    hitNote = n;
                }
            }
        }

        if (hitNote && minDist < CONFIG.miss) {
            hitNote.hit = true;
            let points = 0;
            let txt = "";
            let col = "#fff";

            if (minDist < CONFIG.perfect) {
                points = 300; txt = "LOCKED"; col = "#FFD700";
                this.shake = 10;
                this.spawnParticles(hitNote.lane * this.laneW + this.laneW/2, hitY, CONFIG.colors[lane], 15);
            } else if (minDist < CONFIG.good) {
                points = 100; txt = "STABLE"; col = "#00E5FF";
                this.spawnParticles(hitNote.lane * this.laneW + this.laneW/2, hitY, CONFIG.colors[lane], 5);
            } else {
                points = 50; txt = "DRIFT"; col = "#888";
                this.combo = 0;
            }

            if (points > 50) {
                this.combo++;
                if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                AudioSys.playHit(440 + lane * 100);
                if (points >= 300 || this.combo >= 6) {
                    AudioSys.playCombo();
                    this.setGifState('combo', true, 0.9);
                }
            }

            this.score += points;
            this.spawnText(txt, hitNote.lane * this.laneW + this.laneW/2, hitY - 50, col);
            this.updateHUD();
        }
    },

    update(dt) {
        if (this.state !== 'PLAY') return;

        this.time += dt;
        this.gridOffset = (this.gridOffset + dt * 100) % 100;

        // Shake Decay
        this.shake = Math.max(0, this.shake - dt * 30);
        
        // Lane Press Decay
        for(let i=0; i<4; i++) this.lanePress[i] = Math.max(0, this.lanePress[i] - dt * 5);

        // Spawner (BPM based)
        if (this.time > this.nextSpawn) {
            const lane = Math.floor(Math.random() * 4);
            this.notes.push({ lane, y: -100, hit: false });
            // Randomize rhythm slightly
            const beat = 60 / 140; // 140 BPM
            this.nextSpawn += Math.random() > 0.8 ? beat/2 : beat;
        }

        // Update Notes
        const speed = window.gameConfig.noteSpeed;
        for (let i = this.notes.length - 1; i >= 0; i--) {
            let n = this.notes[i];
            n.y += speed * dt;
            
            if (!n.hit && n.y > this.height + 50) {
                // Miss
                this.combo = 0;
                AudioSys.playFail();
                this.setGifState('danger', true, 1.1);
                this.updateHUD();
                this.spawnText("DROP", n.lane * this.laneW + this.laneW/2, this.height - 100, "#F00");
                this.notes.splice(i, 1);
            } else if (n.hit && n.y > this.height) {
                this.notes.splice(i, 1); // Remove hit notes that drift off
            }
        }

        this.tickFeedback(dt);

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= dt * 2;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Update Texts
        for (let i = this.texts.length - 1; i >= 0; i--) {
            let t = this.texts[i];
            t.y -= dt * 60;
            t.life -= dt * 1.5;
            if (t.life <= 0) this.texts.splice(i, 1);
        }
    },

    render() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // Clear & Background
            const horizon = ctx.createLinearGradient(0, 0, 0, h);
            horizon.addColorStop(0, '#0b1430');
            horizon.addColorStop(0.45, '#09101f');
            horizon.addColorStop(1, '#03060d');
            ctx.fillStyle = horizon;
            ctx.fillRect(0, 0, w, h);

            const glow = ctx.createRadialGradient(w * 0.5, h * 0.28, 20, w * 0.5, h * 0.28, Math.max(w, h) * 0.7);
            glow.addColorStop(0, 'rgba(120, 238, 255, 0.14)');
            glow.addColorStop(0.5, 'rgba(157, 125, 255, 0.08)');
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, w, h);

            // Shake
            ctx.save();
            if (this.shake > 0) {
                ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
            }

            // Horizon rings for character-first stage vibe
            ctx.strokeStyle = 'rgba(120, 238, 255, 0.11)';
            ctx.lineWidth = 2;
            for (let ring = 0; ring < 5; ring++) {
                const ringY = h * 0.2 + ring * 36 + (this.gridOffset * 0.18);
                ctx.beginPath();
                ctx.ellipse(w * 0.5, ringY, w * (0.14 + ring * 0.08), 16 + ring * 5, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Parallax Layer 1: Stars
            this.stars.forEach(s => {
                let y = (s.y + this.time * 0.1 * s.z) % 1;
                const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(this.time * (1.3 + s.z) + s.x * 12));
                ctx.fillStyle = `rgba(255,255,255,${0.2 + twinkle * 0.45})`;
                ctx.beginPath();
                ctx.arc(s.x * w, y * h, s.sz + twinkle * 0.6, 0, Math.PI*2);
                ctx.fill();
            });

            // Parallax Layer 2: Moving Grid Lines
            ctx.strokeStyle = 'rgba(120, 238, 255, 0.12)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=1; i<CONFIG.lanes; i++) {
                let x = i * this.laneW;
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
            }
            for(let y = this.gridOffset; y < h; y += 100) {
                ctx.moveTo(0, y); ctx.lineTo(w, y);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 90, 169, 0.1)';
            ctx.lineWidth = 1;
            for(let y = this.gridOffset * 0.5; y < h; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

        // Lanes & Notes
        for(let i=0; i<CONFIG.lanes; i++) {
            const cx = i * this.laneW + this.laneW/2;
            const press = this.lanePress[i];
            const color = CONFIG.colors[i];

            // Lane Beam
            if (press > 0) {
                const grad = ctx.createLinearGradient(0, h, 0, 0);
                grad.addColorStop(0, color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.globalAlpha = press * window.gameConfig.laneOpacity;
                ctx.fillRect(i * this.laneW, 0, this.laneW, h);
                ctx.globalAlpha = 1;
            }

            // Receptor
            this.drawArrow(cx, CONFIG.hitY, 60, press > 0 ? '#fff' : color, i, press > 0 ? 1.2 : 1);
        }

        // Notes
        this.notes.forEach(n => {
            if (n.hit) return;
            const cx = n.lane * this.laneW + this.laneW/2;
            this.drawArrow(cx, n.y, 60, CONFIG.colors[n.lane], n.lane, 1);
        });

        // Particles
        this.particles.forEach(p => {
            ctx.fillStyle = p.col;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

            // Floating Text
            this.texts.forEach(t => {
                ctx.save();
                ctx.translate(t.x, t.y);
                const s = 1 + (1 - t.life) * 0.5;
                ctx.scale(s, s);
                ctx.fillStyle = t.col;
                ctx.font = '700 24px "Audiowide"';
                ctx.textAlign = 'center';
                ctx.shadowColor = t.col;
                ctx.shadowBlur = 14;
                ctx.fillText(t.msg, 0, 0);
                ctx.restore();
            });

        ctx.restore();
    },

    drawArrow(x, y, size, color, dir, scale) {
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        // Directions: 0=Left, 1=Down, 2=Up, 3=Right
        const rots = [-Math.PI/2, Math.PI, 0, Math.PI/2];
        ctx.rotate(rots[dir]);

        const s = size / 2;
        const shell = ctx.createLinearGradient(0, -s, 0, s);
        shell.addColorStop(0, '#ffffff');
        shell.addColorStop(0.2, color);
        shell.addColorStop(1, 'rgba(6, 13, 28, 0.95)');

        ctx.shadowColor = color;
        ctx.shadowBlur = 18;

        ctx.fillStyle = 'rgba(8, 18, 36, 0.92)';
        ctx.beginPath();
        ctx.moveTo(0, -s - 8);
        ctx.lineTo(s + 8, s + 8);
        ctx.lineTo(0, s / 2 + 6);
        ctx.lineTo(-s - 8, s + 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s, s);
        ctx.lineTo(0, s / 2);
        ctx.lineTo(-s, s);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -s + 10);
        ctx.lineTo(s * 0.42, s * 0.35);
        ctx.lineTo(0, s * 0.08);
        ctx.lineTo(-s * 0.42, s * 0.35);
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.restore();
    },

    spawnParticles(x, y, col, count) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 5 + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                life: 1.0,
                col: col,
                sz: Math.random() * 3 + 1
            });
        }
    },

    spawnText(msg, x, y, col) {
        this.texts.push({ msg, x, y, col, life: 1.0 });
    },

    setGifState(key, active, duration = 0.8) {
        const node = key === 'combo' ? this.comboGif : this.dangerGif;
        if (!node) return;
        if (active) {
            node.classList.add('active');
            this.feedbackTimers[key] = duration;
        } else {
            node.classList.remove('active');
            this.feedbackTimers[key] = 0;
        }
    },

    tickFeedback(dt) {
        Object.keys(this.feedbackTimers).forEach((key) => {
            if (this.feedbackTimers[key] > 0) {
                this.feedbackTimers[key] = Math.max(0, this.feedbackTimers[key] - dt);
                if (this.feedbackTimers[key] === 0) this.setGifState(key, false);
            }
        });
    },

    updateHUD() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('combo-val').innerText = this.combo;
    }
};

// CONFIG INIT
window.gameConfigDefs = {
    "noteSpeed": { "type": "number", "label": "Note Speed", "value": 800, "min": 400, "max": 1500 },
    "musicVolume": { "type": "number", "label": "Music Volume", "value": 0.6, "min": 0, "max": 1 },
    "laneOpacity": { "type": "number", "label": "Lane Glow", "value": 0.3, "min": 0.1, "max": 0.8 }
};
window.gameConfig = { noteSpeed: 800, musicVolume: 0.6, laneOpacity: 0.3 };
window.updateGameConfig = (k, v) => {
    window.gameConfig[k] = v;
    if (k === 'musicVolume' && AudioSys.bgm) {
        AudioSys.bgm.volume = Math.min(0.2, v * 0.2);
    }
};

// BOOTSTRAP
document.addEventListener('DOMContentLoaded', () => {
    AudioSys.init();
    Game.init();
});
</script>
