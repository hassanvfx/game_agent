<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Drift</title>
    <!-- [agent-note][stage3] resolved-font: title-display=Audiowide, hud-ui=Orbitron from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #140522;
            --bg-bottom: #05010b;
            --panel: rgba(18, 10, 34, 0.72);
            --panel-border: rgba(109, 242, 255, 0.36);
            --text-main: #f7fbff;
            --text-soft: #9feaff;
            --accent: #61f0ff;
            --accent-strong: #9a7bff;
            --danger: #ff4f8b;
            --gold: #ffd84d;
            --hero-glow: rgba(97, 240, 255, 0.55);
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(90, 40, 140, 0.28), transparent 38%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Orbitron', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
        }
        canvas { display: block; width: 100%; height: 100%; }
        .glass {
            background:
                linear-gradient(180deg, rgba(29, 16, 49, 0.88), rgba(10, 6, 22, 0.82));
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 26px rgba(97, 240, 255, 0.14),
                0 18px 44px rgba(0, 0, 0, 0.35);
        }
        .neon-text {
            text-shadow:
                0 0 10px rgba(97, 240, 255, 0.72),
                0 0 24px rgba(97, 240, 255, 0.28);
        }
        .neon-danger {
            text-shadow: 0 0 10px rgba(255, 79, 139, 0.85);
            color: var(--danger);
        }
        .hidden { display: none !important; }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
            touch-action: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(97, 240, 255, 0.1), transparent 18%),
                radial-gradient(circle at 80% 20%, rgba(154, 123, 255, 0.14), transparent 24%);
        }
        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        #game-container::before {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 14%, transparent 86%, rgba(255, 255, 255, 0.03)),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
            opacity: 0.18;
            mix-blend-mode: screen;
        }
        #game-container::after {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(3, 1, 8, 0.38));
        }
        #skyline,
        #scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        #skyline {
            z-index: 2;
            opacity: 0.7;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent 26%),
                linear-gradient(0deg, rgba(97, 240, 255, 0.16), rgba(97, 240, 255, 0.02) 26%, transparent 26%) bottom left / 7% 26% no-repeat,
                linear-gradient(0deg, rgba(154, 123, 255, 0.14), rgba(154, 123, 255, 0.02) 34%, transparent 34%) bottom 12% left 8% / 9% 34% no-repeat,
                linear-gradient(0deg, rgba(97, 240, 255, 0.16), rgba(97, 240, 255, 0.02) 20%, transparent 20%) bottom 0 left 22% / 6% 20% no-repeat,
                linear-gradient(0deg, rgba(255, 79, 139, 0.15), rgba(255, 79, 139, 0.02) 28%, transparent 28%) bottom 0 left 31% / 8% 28% no-repeat,
                linear-gradient(0deg, rgba(97, 240, 255, 0.12), rgba(97, 240, 255, 0.02) 22%, transparent 22%) bottom 0 left 43% / 7% 22% no-repeat,
                linear-gradient(0deg, rgba(154, 123, 255, 0.18), rgba(154, 123, 255, 0.03) 38%, transparent 38%) bottom 0 left 54% / 10% 38% no-repeat,
                linear-gradient(0deg, rgba(97, 240, 255, 0.14), rgba(97, 240, 255, 0.02) 18%, transparent 18%) bottom 0 left 68% / 6% 18% no-repeat,
                linear-gradient(0deg, rgba(255, 79, 139, 0.13), rgba(255, 79, 139, 0.02) 30%, transparent 30%) bottom 0 left 76% / 8% 30% no-repeat,
                linear-gradient(0deg, rgba(97, 240, 255, 0.16), rgba(97, 240, 255, 0.02) 24%, transparent 24%) bottom 0 left 88% / 6% 24% no-repeat;
        }
        #scanlines {
            z-index: 3;
            background: repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 6px);
            opacity: 0.1;
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #start-screen,
        #game-over-screen {
            pointer-events: auto;
            text-align: center;
            border-radius: 1.25rem;
            padding: 1.5rem;
            width: min(88vw, 26rem);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            z-index: 6;
        }
        #start-screen {
            transform: scale(1);
            transition: transform 0.3s ease;
        }
        #start-screen:hover {
            transform: scale(1.03);
        }
        #ui-title,
        #game-over-screen h2 {
            margin: 0 0 0.5rem;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.22rem;
            line-height: 0.95;
        }
        #ui-title {
            font-size: clamp(2.8rem, 9vw, 4.5rem);
        }
        #start-tagline {
            margin: 0 0 0.9rem;
            color: var(--text-soft);
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.18rem;
            animation: pulse 1.8s infinite;
        }
        #start-hint,
        #best-line {
            margin: 0.85rem 0 0;
            font-size: 0.85rem;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.11rem;
        }
        #game-over-screen h2 {
            font-size: clamp(2.4rem, 8vw, 3.5rem);
        }
        #final-line {
            font-size: 1.35rem;
            color: #fff;
            margin-bottom: 0.4rem;
        }
        #best-line {
            margin: 0 0 1.5rem;
            color: #9ca3af;
            font-size: 1rem;
        }
        .game-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 0.85rem 1.2rem;
            font: inherit;
            font-weight: 700;
            font-size: clamp(1rem, 4vw, 1.2rem);
            letter-spacing: 0.08rem;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .game-btn:active {
            transform: scale(0.97);
        }
        #start-btn {
            background: linear-gradient(90deg, #61f0ff, #8f7cff);
            color: #09111a;
            box-shadow: 0 0 18px rgba(97, 240, 255, 0.45);
        }
        #start-btn:hover {
            background: linear-gradient(90deg, #8bf7ff, #b399ff);
            box-shadow: 0 0 22px rgba(97, 240, 255, 0.58);
        }
        #restart-btn {
            background: linear-gradient(90deg, #ff4f8b, #ff8f5b);
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 79, 139, 0.4);
        }
        #restart-btn:hover {
            background: linear-gradient(90deg, #ff76a5, #ffab74);
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            box-sizing: border-box;
            z-index: 7;
        }
        #score-wrap {
            font-size: clamp(1.35rem, 6vw, 2rem);

            font-family: 'Orbitron', system-ui, sans-serif;

            color: #b6f5ff;
            margin-bottom: 0.15rem;

            background: rgba(255, 216, 77, 0.12);

        .screen-eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-bottom: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(97, 240, 255, 0.28);
            background: rgba(97, 240, 255, 0.08);
            color: var(--text-soft);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16rem;
            text-transform: uppercase;
        }
        .screen-eyebrow::before,
        .screen-eyebrow::after {
            content: "✦";
            color: var(--accent);
            font-size: 0.75rem;
        }
        .screen-card-accent {
            position: absolute;
            inset: auto auto -1.8rem -1.8rem;
            width: 5rem;
            height: 5rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(97,240,255,0.35), rgba(97,240,255,0));
            pointer-events: none;
        }
        .screen-card-accent.right {
            inset: -1.5rem -1.5rem auto auto;
            background: radial-gradient(circle, rgba(255,79,139,0.28), rgba(255,79,139,0));
        }
        #start-ship {
            margin: 0 auto 1rem;
            width: 4.5rem;
            height: 4.5rem;
            position: relative;
            filter: drop-shadow(0 0 18px rgba(97, 240, 255, 0.45));
            animation: idleFloat 2.2s ease-in-out infinite;
        }
        #start-ship::before,
        #start-ship::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        #start-ship::before {
            top: 0.1rem;
            width: 2.6rem;
            height: 3.4rem;
            background: linear-gradient(180deg, #ffffff, #61f0ff 55%, #8f7cff);
            clip-path: polygon(50% 0%, 85% 36%, 68% 100%, 32% 100%, 15% 36%);
            border-radius: 1rem;
        }
        #start-ship::after {
            top: 2.6rem;
            width: 3.3rem;
            height: 1.3rem;
            background: linear-gradient(90deg, rgba(97,240,255,0), rgba(97,240,255,0.95), rgba(154,123,255,0));
            filter: blur(2px);
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        #feedback-stack {
            position: absolute;
            right: 0.8rem;
            bottom: max(0.8rem, env(safe-area-inset-bottom));
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
            pointer-events: none;
        }
        .feedback-badge {
            min-width: 7rem;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(97, 240, 255, 0.25);
            background: rgba(9, 17, 26, 0.75);
            box-shadow: 0 0 18px rgba(97, 240, 255, 0.16);
            color: #dffbff;
            font-size: 0.7rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .feedback-badge.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-badge.danger {
            border-color: rgba(255, 79, 139, 0.35);
            box-shadow: 0 0 18px rgba(255, 79, 139, 0.2);
        }
        .feedback-gif {
            width: min(24vw, 7rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 0 22px rgba(97, 240, 255, 0.16);
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .feedback-gif.visible {
            opacity: 0.94;
            transform: scale(1);
        }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>

<script>
/** 
 * §4 Iron Laws & Core Logic 
 */

// --- Global Config & State ---
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});

window.updateGameConfig = (key, val) => {
    if (window.gameConfigDefs[key]) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'gameTitle') {
            const el = document.getElementById('ui-title');
            if(el) el.innerText = val;
            document.title = val;
        }
    }
};

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.sfxBuffers = {};
        this.sfxElements = {};
        this.initialized = false;
        this.muted = false;
        this.bgmEl = null;
        this.lastPlayedAt = {};
        this.sfxConfig = {
            sfx_collect: { volume: 0.34, cooldown: 90 },
            sfx_die: { volume: 0.5, cooldown: 250 },
            sfx_start: { volume: 0.35, cooldown: 160 },
            sfx_score: { volume: 0.28, cooldown: 120 }
        };
    }

    init() {
        if (this.initialized) {
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            return;
        }
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        this.ctx = new AudioContext();
        this.initialized = true;
        
        const unlock = () => {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock);

        this.loadAssets();
    }

    loadAssets() {
        const bgmEl = document.getElementById('bgm_main');
        if (bgmEl) {
            this.bgmEl = bgmEl;
            this.bgmEl.volume = 0.38;
            this.bgmEl.loop = true;
        }

        ['sfx_collect', 'sfx_die', 'sfx_start', 'sfx_score'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            this.sfxElements[id] = el;
            if (el.src && this.ctx) {
                fetch(el.src, { mode: 'cors' })
                    .then(r => {
                        if (!r.ok) throw new Error('audio fetch failed');
                        return r.arrayBuffer();
                    })
                    .then(buf => this.ctx.decodeAudioData(buf))
                    .then(decoded => { this.sfxBuffers[id] = decoded; })
                    .catch(() => {});
            }
        });
    }

    playBgm() {
        if (!this.bgmEl) return;
        if (this.bgmEl.paused) {
            this.bgmEl.currentTime = 0;
        }
        this.bgmEl.play().catch(() => {});
    }

    stopBgm() {
        if (this.bgmEl) {
            this.bgmEl.pause();
            this.bgmEl.currentTime = 0;
        }
    }

    playSfx(id, fallbackType = 'beep') {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        const now = performance.now();
        const config = this.sfxConfig[id] || { volume: 0.28, cooldown: 80 };
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < config.cooldown) {
            return;
        }
        this.lastPlayedAt[id] = now;

        const buffer = this.sfxBuffers[id];
        if (buffer) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            source.buffer = buffer;
            gain.gain.value = config.volume;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
            return;
        }

        const mediaEl = this.sfxElements[id];
        if (mediaEl) {
            try {
                const sfxClone = mediaEl.cloneNode();
                sfxClone.volume = Math.min(config.volume, 1);
                sfxClone.play().catch(() => this.synthesize(fallbackType));
                sfxClone.addEventListener('ended', () => sfxClone.remove(), { once: true });
                document.body.appendChild(sfxClone);
                return;
            } catch (err) {}
        }

        this.synthesize(fallbackType);
    }

    synthesize(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.26, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1040, this.ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.14);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    }
}

// --- Game Engine ---
const audio = new AudioManager();

class FeedbackManager {
    constructor() {
        this.timers = new Map();
    }

    pulse(id, duration = 900) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('visible');
        window.clearTimeout(this.timers.get(id));
        const timer = window.setTimeout(() => {
            el.classList.remove('visible');
        }, duration);
        this.timers.set(id, timer);
    }

    pickup() {
        this.pulse('pickup-badge', 900);
        this.pulse('pickup-gif', 1200);
    }

    crash() {
        this.pulse('crash-badge', 1200);
        this.pulse('crash-gif', 1500);
    }
}

const feedback = new FeedbackManager();

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.width = 0;
        this.height = 0;
        this.dpr = 1;

        this.state = 'START'; // START, PLAYING, GAMEOVER
        this.score = 0;
        this.highScore = localStorage.getItem('dm_highscore') || 0;
        this.frames = 0;
        
        // Entities
        this.hero = { x: 0, y: 0, r: 10, tail: [], mood: 'steady' };
        this.targetY = 0;
        this.obstacles = [];
        this.particles = [];
        this.collects = [];
        this.bgBars = [];
        
        // Shake
        this.shake = 0;

        // Input
        this.pointerDown = false;
        
        this.bindEvents();
        this.resize();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    bindEvents() {
        window.addEventListener('resize', () => this.resize());
        
        const onPointerDown = (e) => {
            e.preventDefault();
            this.pointerDown = true;
            this.handleInput(e);
            
            if (this.state === 'START') {
                audio.init(); // Ensure audio context is ready
            }
        };

        const onPointerMove = (e) => {
            e.preventDefault();
            if (this.pointerDown) this.handleInput(e);
        };

        const onPointerUp = (e) => {
            e.preventDefault();
            this.pointerDown = false;
        };

        this.canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
        this.canvas.addEventListener('pointermove', onPointerMove, { passive: false });
        this.canvas.addEventListener('pointerup', onPointerUp, { passive: false });
        this.canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => this.startGame());
        document.getElementById('restart-btn').addEventListener('click', () => this.startGame());
    }

    handleInput(e) {
        const rect = this.canvas.getBoundingClientRect();
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if (clientY !== undefined) {
            this.targetY = (clientY - rect.top) * (this.height / rect.height);
        } else {
            // Mouse fallback
            this.targetY = (e.clientY - rect.top) * (this.height / rect.height);
        }
    }

    resize() {
        this.dpr = window.devicePixelRatio || 1;
        const rect = document.getElementById('game-container').getBoundingClientRect();
        this.width = rect.width;
        this.height = rect.height;
        
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

        // Reset hero position on resize if not playing
        if (this.state === 'START') {
            this.hero.x = this.width * 0.2;
            this.hero.y = this.height * 0.5;
            this.targetY = this.height * 0.5;
        }

        // Init BG bars
        this.bgBars = [];
        const barCount = 20;
        const barW = this.width / barCount;
        for(let i=0; i<barCount; i++) {
            this.bgBars.push({
                x: i * barW,
                w: barW - 2,
                h: Math.random() * this.height * 0.5,
                speed: Math.random() * 0.05 + 0.02
            });
        }
    }

    startGame() {
        this.state = 'PLAYING';
        this.score = 0;
        this.frames = 0;
        this.obstacles = [];
        this.collects = [];
        this.particles = [];
        this.hero.y = this.height * 0.5;
        this.hero.tail = [];
        this.targetY = this.height * 0.5;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('score').innerText = '0';

        feedback.pulse('pickup-badge', 0);
        feedback.pulse('crash-badge', 0);
        audio.init();
        audio.playSfx('sfx_start', 'success');
        audio.playBgm();
    }

    gameOver() {
        this.state = 'GAMEOVER';
        this.shake = 20;
        audio.stopBgm();
        audio.playSfx('sfx_die', 'explosion');
        feedback.crash();
        
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('dm_highscore', this.highScore);
        }

        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = Math.floor(this.score);
        document.getElementById('bestScore').innerText = Math.floor(this.highScore);
    }

    spawnObstacle() {
        const type = Math.random();
        const speed = window.gameConfig.baseSpeed;
        
        // 30% chance for collectible wave
        if (Math.random() < 0.3) {
            const y = Math.random() * (this.height - 100) + 50;
            this.collects.push({
                x: this.width + 50,
                y: y,
                r: 15,
                active: true,
                vx: -speed
            });
            return;
        }

        // Obstacles
        const gap = 200; // Gap size
        const yPos = Math.random() * (this.height - gap);
        
        this.obstacles.push({
            x: this.width + 50,
            w: 40,
            topH: yPos,
            botY: yPos + gap,
            botH: this.height - (yPos + gap),
            vx: -speed,
            passed: false
        });
    }

    createParticles(x, y, color, count = 10) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color
            });
        }
    }

    update(dt) {
        if (this.state !== 'PLAYING') return;

        // Hero Movement (Lerp)
        const lerp = window.gameConfig.sensitivity || 0.15;
        this.hero.y += (this.targetY - this.hero.y) * lerp;
        
        // Tail
        if (this.frames % 3 === 0) {
            this.hero.tail.push({x: this.hero.x, y: this.hero.y, life: 1});
        }
        this.hero.tail.forEach(t => t.life -= 0.05);
        this.hero.tail = this.hero.tail.filter(t => t.life > 0);

        // Spawning
        if (this.frames % 60 === 0) {
            this.spawnObstacle();
        }

        // Obstacles
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.x += ob.vx;

            // Collision
            // Top Bar
            if (this.checkRectCollide(this.hero.x, this.hero.y, this.hero.r, ob.x, 0, ob.w, ob.topH) ||
                this.checkRectCollide(this.hero.x, this.hero.y, this.hero.r, ob.x, ob.botY, ob.w, ob.botH)) {
                this.gameOver();
            }

            // Score
            if (!ob.passed && ob.x + ob.w < this.hero.x) {
                ob.passed = true;
                this.score += 10;
                document.getElementById('score').innerText = this.score;
                audio.playSfx('sfx_score', 'success');
            }

            if (ob.x < -100) this.obstacles.splice(i, 1);
        }

        // Collectibles
        for (let i = this.collects.length - 1; i >= 0; i--) {
            let c = this.collects[i];
            c.x += c.vx;
            
            // Wobble
            c.y += Math.sin(this.frames * 0.1) * 2;

            const dx = this.hero.x - c.x;
            const dy = this.hero.y - c.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < this.hero.r + c.r) {
                // Collect
                audio.playSfx('sfx_collect', 'success');
                feedback.pickup();
                this.createParticles(c.x, c.y, '#ffd700', 15);
                this.score += 50;
                document.getElementById('score').innerText = this.score;
                this.collects.splice(i, 1);
                // Visual Juice
                this.shake = 5;
            } else if (c.x < -50) {
                this.collects.splice(i, 1);
            }
        }

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Shake decay
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;

        this.frames++;
    }

    checkRectCollide(cx, cy, cr, rx, ry, rw, rh) {
        // Simple circle-rect collision
        const testX = cx < rx ? rx : (cx > rx + rw ? rx + rw : cx);
        const testY = cy < ry ? ry : (cy > ry + rh ? ry + rh : cy);
        const distX = cx - testX;
        const distY = cy - testY;
        return (distX*distX + distY*distY) <= (cr*cr);
    }

    draw() {
        // Clear
        this.ctx.fillStyle = '#090011';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Shake transform
        this.ctx.save();
        if (this.shake > 0) {
            const dx = (Math.random() - 0.5) * this.shake;
            const dy = (Math.random() - 0.5) * this.shake;
            this.ctx.translate(dx, dy);
        }

        // Background Equalizer
        this.ctx.fillStyle = 'rgba(20, 0, 40, 0.5)';
        this.bgBars.forEach((bar, i) => {
            // Animate height
            const h = bar.h + Math.sin(this.frames * bar.speed + i) * 50;
            const actualH = Math.max(10, h);
            this.ctx.fillRect(bar.x, this.height - actualH, bar.w, actualH);
        });

        // Draw Tail
        this.ctx.beginPath();
        this.hero.tail.forEach((t, i) => {
            if (i === 0) this.ctx.moveTo(t.x, t.y);
            else this.ctx.lineTo(t.x, t.y);
        });
        this.ctx.strokeStyle = window.gameConfig.heroColor;
        this.ctx.lineWidth = 5;
        this.ctx.lineCap = 'round';
        this.ctx.stroke();

        // Draw Hero - polished pulse rider silhouette, preserve hit radius
        const heroBob = Math.sin(this.frames * 0.16) * 1.8;
        const heroX = this.hero.x;
        const heroY = this.hero.y + heroBob;
        const wingSpread = this.hero.r * 1.55;
        const bodyH = this.hero.r * 2.35;

        this.ctx.save();
        this.ctx.translate(heroX, heroY);
        this.ctx.shadowBlur = 24;
        this.ctx.shadowColor = 'rgba(97, 240, 255, 0.85)';

        this.ctx.fillStyle = 'rgba(97, 240, 255, 0.22)';
        this.ctx.beginPath();
        this.ctx.moveTo(-wingSpread * 1.15, this.hero.r * 0.85);
        this.ctx.lineTo(0, bodyH * 1.25);
        this.ctx.lineTo(wingSpread * 1.15, this.hero.r * 0.85);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -bodyH * 0.7);
        this.ctx.lineTo(wingSpread * 0.55, this.hero.r * 0.2);
        this.ctx.lineTo(wingSpread * 0.22, bodyH * 0.72);
        this.ctx.lineTo(0, bodyH);
        this.ctx.lineTo(-wingSpread * 0.22, bodyH * 0.72);
        this.ctx.lineTo(-wingSpread * 0.55, this.hero.r * 0.2);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.fillStyle = window.gameConfig.heroColor;
        this.ctx.beginPath();
        this.ctx.moveTo(0, -bodyH * 0.45);
        this.ctx.lineTo(wingSpread * 0.26, this.hero.r * 0.3);
        this.ctx.lineTo(0, bodyH * 0.7);
        this.ctx.lineTo(-wingSpread * 0.26, this.hero.r * 0.3);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.fillStyle = '#09121d';
        this.ctx.beginPath();
        this.ctx.arc(0, -this.hero.r * 0.05, this.hero.r * 0.23, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.shadowBlur = 0;
        this.ctx.restore();

        // Draw Obstacles
        this.ctx.shadowBlur = 12;
        this.ctx.shadowColor = window.gameConfig.dangerColor;
        this.obstacles.forEach(ob => {
            const stripeOffset = (this.frames * 6) % 24;
            const obstacleGradient = this.ctx.createLinearGradient(ob.x, 0, ob.x + ob.w, 0);
            obstacleGradient.addColorStop(0, '#31071b');
            obstacleGradient.addColorStop(0.5, window.gameConfig.dangerColor);
            obstacleGradient.addColorStop(1, '#55102c');

            this.ctx.fillStyle = obstacleGradient;
            this.ctx.fillRect(ob.x, 0, ob.w, ob.topH);
            this.ctx.fillRect(ob.x, ob.botY, ob.w, ob.botH);

            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.rect(ob.x, 0, ob.w, ob.topH);
            this.ctx.rect(ob.x, ob.botY, ob.w, ob.botH);
            this.ctx.clip();
            this.ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            this.ctx.lineWidth = 2;
            for (let stripeY = -this.height; stripeY < this.height * 2; stripeY += 24) {
                this.ctx.beginPath();
                this.ctx.moveTo(ob.x - 6, stripeY + stripeOffset);
                this.ctx.lineTo(ob.x + ob.w + 6, stripeY + 12 + stripeOffset);
                this.ctx.stroke();
            }
            this.ctx.restore();

            this.ctx.strokeStyle = '#ffd3e2';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(ob.x, ob.topH);
            this.ctx.lineTo(ob.x + ob.w, ob.topH);
            this.ctx.stroke();

            this.ctx.beginPath();
            this.ctx.moveTo(ob.x, ob.botY);
            this.ctx.lineTo(ob.x + ob.w, ob.botY);
            this.ctx.stroke();
        });
        this.ctx.shadowBlur = 0;

        // Draw Collectibles
        this.collects.forEach(c => {
            const spin = this.frames * 0.12;
            this.ctx.save();
            this.ctx.translate(c.x, c.y);
            this.ctx.rotate(spin);
            this.ctx.fillStyle = '#ffd84d';
            this.ctx.shadowBlur = 18;
            this.ctx.shadowColor = '#ffd84d';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -c.r);
            this.ctx.lineTo(c.r * 0.72, 0);
            this.ctx.lineTo(0, c.r);
            this.ctx.lineTo(-c.r * 0.72, 0);
            this.ctx.closePath();
            this.ctx.fill();

            this.ctx.fillStyle = '#fff7bf';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -c.r * 0.5);
            this.ctx.lineTo(c.r * 0.34, 0);
            this.ctx.lineTo(0, c.r * 0.5);
            this.ctx.lineTo(-c.r * 0.34, 0);
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.restore();
        });
        this.ctx.shadowBlur = 0;

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = p.life;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1.0;
        });

        this.ctx.restore();
    }

    loop(timestamp) {
        try {
            const dt = 16.67; // Fixed step for simplicity
            this.update(dt);
            this.draw();
            requestAnimationFrame(this.loop);
        } catch (e) {
            console.error("Game Loop Error:", e);
        }
    }
}

// Start
document.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
});
