    .hidden { display: none !important; }
    #game-container::before {
        content: "";

        inset: 0;
        pointer-events: none;

            radial-gradient(circle at 50% 18%, rgba(116, 248, 255, 0.12), transparent 24%),

    /* Joystick */

        border-radius: 50%; border: 2px dashed rgba(116, 248, 255, 0.35);

        pointer-events: none; opacity: 0; transition: opacity 0.2s; 
        z-index: 20;
        box-shadow: 0 0 30px rgba(0, 243, 255, 0.14);
    }
    #joystick-knob { 
        position: absolute; top: 50%; left: 50%; 
        width: 50px; height: 50px; margin-left: -25px; margin-top: -25px; 
        background: radial-gradient(circle, #d9feff 0%, #5ccfff 55%, #132a4f 100%); 
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.35);
        box-shadow: 0 0 20px rgba(116,248,255,0.45);
    }
    
    /* Buttons */
    .action-btn {
        position: absolute; border-radius: 50%;
        display: flex; justify-content: center; align-items: center; 
        color: rgba(255,255,255,0.95); font-size: 14px; font-weight: 900; letter-spacing: 1px;
        touch-action: none; pointer-events: auto;
        border: 2px solid rgba(255,255,255,0.15);
        background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18), transparent 30%),
            linear-gradient(180deg, rgba(22, 35, 63, 0.96), rgba(10, 18, 34, 0.96));
        backdrop-filter: blur(4px);
        transition: transform 0.1s, background 0.1s, box-shadow 0.1s;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        box-shadow: 0 8px 18px rgba(0,0,0,0.44), 0 0 20px rgba(116,248,255,0.08);
        flex-direction: column;
    }
    .action-btn:active { 
        transform: scale(0.92); 
        background: rgba(80, 80, 90, 0.9);
    }

        border-color: rgba(0, 243, 255, 0.5);
        color: #00f3ff;
        font-size: 11px;
    }
    
    .cd-overlay {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
        background: rgba(0,0,0,0.6); pointer-events: none;
        transition: height 0.1s linear; border-radius: 50%; overflow: hidden;
    }

    /* Menu & Text */
    .menu-opt {
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
        border: 1px solid rgba(116,248,255,0.14);

        border-color: #d8fdff;

    .ts-btn {

        text-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    /* Animations */
    @keyframes fast-pulse {
        0% { transform: scale(1); opacity: 1; filter: brightness(1); }
        50% { transform: scale(1.05); opacity: 0.9; filter: brightness(1.2); }
        100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }
    .goal-anim { animation: fast-pulse 0.6s infinite ease-in-out; }
    
    @keyframes reset-pulse {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    .reset-anim { animation: reset-pulse 0.7s ease-out forwards; }
    
    @keyframes gold-pulse {
        0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(234, 179, 8, 0); }
        100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    .gold-glow { animation: gold-pulse 1.5s infinite; }

    @keyframes slide-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .slide-up-anim { animation: slide-up 0.5s ease-out forwards; animation-delay: 0.3s; opacity: 0; }

<script>
/**
 * TEAM DATA
 */
const TEAMS = [
    { id: 'boca', name: 'Boca Jrs', c1: '#0044ff', c2: '#ffcc00' },     // Blue/Gold
    { id: 'real', name: 'R. Madrid', c1: '#ffffff', c2: '#febe10' },    // White/Gold
    { id: 'juve', name: 'Juventus', c1: '#ffffff', c2: '#333333' },     // White/DarkGrey
    { id: 'river', name: 'River Plate', c1: '#ffffff', c2: '#ef3340' }, // White/Red
    { id: 'milan', name: 'AC Milan', c1: '#ff0000', c2: '#111111' },    // Red/Black
    { id: 'barca', name: 'Barcelona', c1: '#004d98', c2: '#a50044' },   // Blue/Garnet
    { id: 'bayern', name: 'Bayern', c1: '#dc052d', c2: '#ffffff' },     // Red/White
    { id: 'liver', name: 'Liverpool', c1: '#c8102e', c2: '#00b2a9' }    // Red/Teal
];

// Generic Names for Bots
const BOT_NAMES = [
    "Santos", "Rossi", "Silva", "Muller", "Diaz", "Kim", "Chen", "Popov", "Smith", "Jones", 
    "Kroos", "Modric", "Vini", "Salah", "Kane", "Son", "Pedri", "Gavi", "Jude", "Erling"
];

/**
 * BALL SKINS
 */
const BALL_STYLES = [
    { id: 'classic', name: 'CLASSIC', type: 'classic' },
    { id: 'champions', name: 'CHAMPIONS', type: 'stars' },
    { id: 'wc26', name: 'WC 2026', type: 'modern' },
    { id: 'wc22', name: 'WC 2022', type: 'speed' },
    { id: 'vintage', name: 'VINTAGE', type: 'leather' }
];

/**
 * PITCH SKINS
 */
const PITCH_STYLES = [
    { id: 'space', name: 'GALACTIC', type: 'space', lineAlpha: 0.15 },
    { id: 'grass', name: 'TURF', type: 'grass', lineAlpha: 0.7 },
    { id: 'cement', name: 'STREET', type: 'cement', lineAlpha: 0.8 }
];

let selectedHome = 0;
let selectedAway = 1;
let selectedBall = 0;
let selectedPitch = 0;

/**
 * AUDIO SYSTEM
 */
const MEDIA = {
    audio: {
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
        kick: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
        pass: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
        dash: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3',
        goal: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3',
        reset: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
        menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3',
        menuClose: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_02.mp3',
        uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3',
        finalWin: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3',
        finalDraw: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3'
    }
};

const AudioSys = {
    enabled: true,
    ready: false,
    poolSize: 3,
    sfxVolume: 0.42,
    musicVolume: 0.2,
    cooldownMs: {
        kick: 90,
        pass: 90,
        dash: 180,
        reset: 320,
        goal: 1000,
        uiClick: 80,
        menuOpen: 180,
        menuClose: 180,
        finalWin: 700,
        finalDraw: 700
    },
    lastPlayed: {},
    sfxPools: {},
    loopTracks: {},
    currentLoop: null,
    init() {
        if (this.ready) return;
        this.ready = true;

        const buildAudio = (src, { loop = false, volume = this.sfxVolume } = {}) => {
            const audio = new Audio(src);
            audio.preload = 'auto';
            audio.loop = loop;
            audio.volume = volume;
            audio.playsInline = true;
            return audio;
        };

        Object.entries(MEDIA.audio).forEach(([key, src]) => {
            if (key === 'bgm') {
                this.loopTracks[key] = buildAudio(src, { loop: true, volume: this.musicVolume });
            } else {
                this.sfxPools[key] = Array.from({ length: this.poolSize }, () => buildAudio(src));
            }
        });
    },
    unlock() {
        this.init();
        if (this.currentLoop) {
            this.currentLoop.muted = false;
        }
    },
    play(type) {
        if (!this.enabled) return;
        this.init();

        const now = performance.now();
        const cooldown = this.cooldownMs[type] ?? 0;
        if (cooldown && now - (this.lastPlayed[type] ?? 0) < cooldown) return;
        this.lastPlayed[type] = now;

        const pool = this.sfxPools[type];
        if (!pool || pool.length === 0) return;

        const audio = pool.find(item => item.paused || item.ended) ?? pool[0];
        try {
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    },
    startLoop(type = 'bgm') {
        if (!this.enabled) return;
        this.init();

        const track = this.loopTracks[type];
        if (!track) return;
        if (this.currentLoop === track && !track.paused) return;

        this.stopLoop();
        this.currentLoop = track;
        track.currentTime = 0;
        track.volume = this.musicVolume;
        try {
            const playPromise = track.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        } catch (_) {}
    },
    stopLoop() {
        if (!this.currentLoop) return;
        try {
            this.currentLoop.pause();
            this.currentLoop.currentTime = 0;
        } catch (_) {}
        this.currentLoop = null;
    }
};
/**
 * GAME CONFIGURATION
 */
const CONFIG = {
    playerSpeed: 4.5,
    shootForce: 15,
    passForce: 17,
    dashForce: 12,
    ballFriction: 0.985,  
    playerFriction: 0.88, 
    dashCooldownMs: 2000,
    botShootCooldown: 1200,
    controlRadius: 30,
    replayDurationFrames: 240,
    cornerSize: 75,
    supportAggression: 0.4 // How far ahead teammate runs
};

const SETTINGS = {
    format: '3v3',
    zoomMode: 'large'
};

let GAME_SIZES = {
    playerRadius: 22,
    ballRadius: 13,
    goalWidth: 240
};

// State
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let gameState = 'START'; 
let lastTime = 0;
let timeRemaining = 0;
let scores = { home: 0, away: 0 };
let shake = 0;
let slowMoTimer = 0;
let particles = [];
let bgParticles = []; 
let gameZoom = 1.0;
let ballStuckTimer = 0;
let matchTeams = { home: TEAMS[0], away: TEAMS[1] };
let isGoldenGoal = false;

// Replay System
let replayBuffer = [];
let replayIndex = 0;

// Entities
const ball = { 
    x: 0, y: 0, vx: 0, vy: 0, radius: 13,
    lastToucher: null,
    assistToucher: null
};
const player = { 
    x: 0, y: 0, vx: 0, vy: 0, 
    radius: 22, 
    teamId: 'home', 
    dashing: 0, 
    lastDash: -9999,
    role: 'captain',
    name: 'YOU'
};

let enemies = []; 
let teammates = []; 

const input = {
    joystick: { active: false, x: 0, y: 0, originX: 0, originY: 0, id: null },
    shoot: false,
    dash: false,
    callPass: false
};

/**
 * INIT & UI
 */
window.gameConfigDefs = {}; 

function showFeedbackGif(id, duration = 1800) {
    const el = document.getElementById(id);
    if (!el) return;
    clearTimeout(el._hideTimer);
    el.classList.add('is-visible');
    el._hideTimer = setTimeout(() => {
        el.classList.remove('is-visible');
    }, duration);
}

window.setOpt = function(type, val, btn) {
    if (type === 'format') SETTINGS.format = val;
    if (type === 'zoom') SETTINGS.zoomMode = val;
    const p = btn.parentElement;
    Array.from(p.children).forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
};

window.cycleTeam = function(side, dir) {
    if (side === 'home') {
        selectedHome = (selectedHome + dir + TEAMS.length) % TEAMS.length;
        if (selectedHome === selectedAway) selectedHome = (selectedHome + dir + TEAMS.length) % TEAMS.length;
        const t = TEAMS[selectedHome];
        const el = document.getElementById('ts-home-name');
        el.innerText = t.name;
        el.style.color = t.c1;
        el.style.textShadow = `0 0 15px ${t.c1}`;
    } else {
        selectedAway = (selectedAway + dir + TEAMS.length) % TEAMS.length;
        if (selectedAway === selectedHome) selectedAway = (selectedAway + dir + TEAMS.length) % TEAMS.length;
        const t = TEAMS[selectedAway];
        const el = document.getElementById('ts-away-name');
        el.innerText = t.name;
        el.style.color = t.c1;
        el.style.textShadow = `0 0 15px ${t.c1}`;
    }
};

window.cycleBall = function(dir) {
    selectedBall = (selectedBall + dir + BALL_STYLES.length) % BALL_STYLES.length;
    document.getElementById('ts-ball-name').innerText = BALL_STYLES[selectedBall].name;
};

window.cyclePitch = function(dir) {
    selectedPitch = (selectedPitch + dir + PITCH_STYLES.length) % PITCH_STYLES.length;
    document.getElementById('ts-pitch-name').innerText = PITCH_STYLES[selectedPitch].name;
};

function init() {
    // Parse Config
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfigDefs = cfg;
        if (cfg.matchTime) CONFIG.matchTime = cfg.matchTime.value;
        if (cfg.supportAggression) CONFIG.supportAggression = cfg.supportAggression.value;
    } catch(e){}

    resize();
    window.addEventListener('resize', resize);
    
    // Init Parallax Stars
    for(let i=0; i<80; i++) {
        bgParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            alpha: Math.random() * 0.6 + 0.2
        });
    }

    canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });
    canvas.addEventListener('pointermove', handlePointerMove, { passive: false });
    canvas.addEventListener('pointerup', handlePointerUp, { passive: false });
    canvas.addEventListener('pointercancel', handlePointerUp, { passive: false });

    bindButton('btn-shoot', 'shoot');
    bindButton('btn-dash', 'dash');
    bindButton('btn-pass', 'callPass');

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', showMenu); 
    document.getElementById('btn-golden-goal').addEventListener('click', startGoldenGoal);

    requestAnimationFrame(gameLoop);
}

function bindButton(id, action) {
    const el = document.getElementById(id);
    const set = (v) => { 
        input[action] = v; 
        if(action === 'callPass') {
            if(v) el.classList.add('calling-pass');
            else el.classList.remove('calling-pass');
        }
        if (v) {
            AudioSys.unlock();
            AudioSys.play(action === 'callPass' ? 'pass' : 'uiClick');
        }
    };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); set(true); });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); set(false); });
    el.addEventListener('pointerleave', (e) => { e.preventDefault(); set(false); });
}

function showMenu() {
    AudioSys.play('menuOpen');
    AudioSys.stopLoop();
    document.getElementById('result-gif').classList.remove('is-visible');
    gameState = 'START';
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls-ui').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
}

function startGame() {
    AudioSys.unlock();
    AudioSys.play('menuClose');
    AudioSys.startLoop('bgm');
    gameZoom = (SETTINGS.zoomMode === 'large') ? 0.55 : 1.0;
    
    matchTeams.home = TEAMS[selectedHome];
    matchTeams.away = TEAMS[selectedAway];
    isGoldenGoal = false;

    // UI Colors
    document.getElementById('name-home').innerText = matchTeams.home.name;
    document.getElementById('name-home').style.color = matchTeams.home.c1;
    document.getElementById('score-home').style.color = matchTeams.home.c1;
    
    document.getElementById('name-away').innerText = matchTeams.away.name;
    document.getElementById('name-away').style.color = matchTeams.away.c1;
    document.getElementById('score-away').style.color = matchTeams.away.c1;

    document.getElementById('btn-shoot').style.borderColor = matchTeams.home.c1;
    document.getElementById('btn-dash').style.borderColor = matchTeams.home.c2;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-ui').classList.remove('hidden');
    
    document.getElementById('timer').style.color = '';
    
    scores.home = 0;
    scores.away = 0;
    timeRemaining = window.gameConfigDefs.matchTime ? window.gameConfigDefs.matchTime.value : 90;
    ballStuckTimer = 0;
    replayBuffer = [];
    
    updateScoreUI();
    resetPositions();
    gameState = 'PLAYING';
}

function startGoldenGoal() {
    AudioSys.play('uiClick');
    AudioSys.startLoop('bgm');
    isGoldenGoal = true;
    gameState = 'PLAYING';
    
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-ui').classList.remove('hidden');
    
    const tEl = document.getElementById('timer');
    tEl.style.color = '#fbbf24';
    tEl.innerText = "NEXT SCORE WINS";
    
    resetPositions();
}

function getLogicSize() {
    const dpr = window.devicePixelRatio || 1;
    return {
        w: (canvas.width / dpr) / gameZoom,
        h: (canvas.height / dpr) / gameZoom
    };
}

function getRandomName() {
    return BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
}

function resetPositions() {
    const { w, h } = getLogicSize();
    
    ball.x = w / 2; ball.y = h / 2;
    ball.vx = 0; ball.vy = 0;
    ball.lastToucher = null;
    ball.assistToucher = null;

    player.x = w / 2; player.y = h * 0.7;
    player.vx = 0; player.vy = 0;
    player.teamId = 'home';
    player.name = 'YOU';

    enemies = [];
    teammates = [];
    
    let awayCount = 1;
    let homeBotCount = 0;
    
    if (SETTINGS.format === '2v2') { awayCount = 2; homeBotCount = 1; }
    else if (SETTINGS.format === '3v3') { awayCount = 3; homeBotCount = 2; }

    // --- AWAY TEAM (Top) ---
    for (let i = 0; i < awayCount; i++) {
        let role = 'striker';
        let sy = h * 0.35;
        let sx = w / 2;

        if (SETTINGS.format === '3v3') {
            if (i === 0) { role = 'goalie'; sy = h * 0.12; sx = w / 2; } 
            else if (i === 1) { role = 'defender'; sy = h * 0.3; sx = w * 0.5; } 
            else { role = 'striker'; sy = h * 0.45; sx = w * 0.25; }
        } else if (SETTINGS.format === '2v2') {
            if (i === 0) { role = 'goalie'; sy = h * 0.12; }
            else { role = 'striker'; sy = h * 0.35; sx = w * 0.3; }
        }
        
        enemies.push({ 
            x: sx, y: sy, vx: 0, vy: 0, 
            radius: GAME_SIZES.playerRadius, teamId: 'away', role: role, 
            shootTimer: Math.random() * 2000,
            name: getRandomName()
        });
    }

    // --- HOME TEAM (Bottom) ---
    for (let i = 0; i < homeBotCount; i++) {
        let role = 'striker';
        let sy = h * 0.6;
        let sx = w * 0.25;

        if (SETTINGS.format === '3v3') {
            if (i === 0) { role = 'goalie'; sy = h * 0.88; sx = w / 2; } 
            else { role = 'support'; sy = h * 0.6; sx = w * 0.75; }
        } else if (SETTINGS.format === '2v2') {
            role = 'goalie'; sy = h * 0.88; sx = w / 2;
        }

        teammates.push({
            x: sx, y: sy, vx: 0, vy: 0,
            radius: GAME_SIZES.playerRadius, teamId: 'home', role: role,
            shootTimer: Math.random() * 2000,
            name: getRandomName()
        });
    }
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
}

/**
 * REPLAY SYSTEM
 */
function recordFrame() {
    const frame = {
        ball: { x: ball.x, y: ball.y, radius: ball.radius },
        player: { x: player.x, y: player.y, radius: player.radius, teamId: player.teamId, role: player.role },
        enemies: enemies.map(e => ({ x: e.x, y: e.y, radius: e.radius, teamId: e.teamId, role: e.role })),
        teammates: teammates.map(t => ({ x: t.x, y: t.y, radius: t.radius, teamId: t.teamId, role: t.role }))
    };
    
    replayBuffer.push(frame);
    if (replayBuffer.length > CONFIG.replayDurationFrames) {
        replayBuffer.shift();
    }
}

function startReplay() {
    gameState = 'REPLAY';
    replayIndex = 0;
    document.getElementById('goal-overlay').classList.add('hidden');
    document.getElementById('replay-ui').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls-ui').classList.add('hidden');
}

function endReplay() {
    document.getElementById('replay-ui').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-ui').classList.remove('hidden');
    
    if (isGoldenGoal && scores.home !== scores.away) {
        endGame();
    } else {
        resetPositions();
        replayBuffer = [];
        gameState = 'PLAYING';
    }
}

/**
 * LOOP & LOGIC
 */
function gameLoop(timestamp) {
    try {
        if (!lastTime) lastTime = timestamp;
        let dt = timestamp - lastTime;
        lastTime = timestamp;
        if (dt > 50) dt = 50;

        update(dt);
        draw();
    } catch(e) {
        console.error(e);
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (gameState === 'REPLAY') {
        replayIndex++;
        if (replayIndex >= replayBuffer.length) {
            endReplay();
        }
        return;
    }

    if (slowMoTimer > 0) {
        slowMoTimer -= dt;
        dt *= 0.2;
    }

    if (gameState !== 'PLAYING' && gameState !== 'GOAL') {
        updateParticles();
        return;
    }

    if (gameState === 'PLAYING') {
        recordFrame();
        if (!isGoldenGoal) {
            timeRemaining -= dt / 1000;
            if (timeRemaining <= 0) { endGame(); return; }
            updateScoreUI();
        }
    }

    if (gameState === 'GOAL') {
        updateParticles();
        return;
    }

    const { w, h } = getLogicSize();

    checkBallStuck(dt, w, h);

    // Dash
    const now = Date.now();
    const dashElapsed = now - player.lastDash;
    const dashPct = Math.max(0, 1 - (dashElapsed / CONFIG.dashCooldownMs));
    document.getElementById('dash-cd').style.height = (dashPct * 100) + '%';
    
    if (input.dash && dashElapsed >= CONFIG.dashCooldownMs) {
        player.dashing = 10;
        player.lastDash = now;
        AudioSys.play('dash');
        createParticles(player.x, player.y, 8, matchTeams.home.c2);
        const dx = input.joystick.active ? input.joystick.x : 0;
        const dy = input.joystick.active ? input.joystick.y : -1;
        player.vx += dx * CONFIG.dashForce;
        player.vy += dy * CONFIG.dashForce;
    }
    if (player.dashing > 0) player.dashing--;

    // Movement
    if (input.joystick.active) {
        player.vx += input.joystick.x * 1.5;
        player.vy += input.joystick.y * 1.5;
        
        const speed = Math.hypot(player.vx, player.vy);
        const limit = CONFIG.playerSpeed + (player.dashing ? 5 : 0);
        if (speed > limit) {
            const scale = limit / speed;
            player.vx *= scale;
            player.vy *= scale;
        }
    }

    // AI
    const allBots = [...enemies, ...teammates];
    allBots.forEach(bot => { bot.shootTimer -= dt; });
    
    const ballCarrier = getBallCarrier();
    enemies.forEach(bot => updateAI(bot, ballCarrier, enemies));
    teammates.forEach(bot => updateAI(bot, ballCarrier, teammates));

    const allEntities = [player, ...enemies, ...teammates];

    // Physics
    allEntities.forEach(e => { applyFriction(e, CONFIG.playerFriction); moveEntity(e, w, h); });
    applyFriction(ball, CONFIG.ballFriction);
    moveEntity(ball, w, h);

    // Collisions
    allEntities.forEach(ent => {
        let isShooting = false;
        let shootTarget = null; 

        if (ent === player) {
            isShooting = input.shoot;
        } else {
            // Bot Logic
            if (ent.shootTimer <= 0) {
                if (ent.teamId === 'away') {
                    isShooting = true;
                    shootTarget = { x: w/2, y: h };
                } else if (ent.teamId === 'home') {
                    if (input.callPass) {
                        isShooting = true;
                        shootTarget = { x: player.x, y: player.y };
                    } else {
                        isShooting = true;
                        shootTarget = { x: w/2, y: 0 };
                    }
                }
            }
        }

        const hit = resolveCollision(ent, ball, isShooting, shootTarget);
        
        if (hit && isShooting) {
            const teamColor = ent.teamId === 'home' ? matchTeams.home.c1 : matchTeams.away.c1;
            if (ent === player) { 
                input.shoot = false; 
                shake = 4; 
                AudioSys.play('kick');
            } else { 
                ent.shootTimer = CONFIG.botShootCooldown; 
                AudioSys.play(ent.teamId === 'home' && input.callPass ? 'pass' : 'kick');
            }
            createParticles(ball.x, ball.y, 6, teamColor);
        }
    });

    for(let i=0; i<allEntities.length; i++) {
        for(let j=i+1; j<allEntities.length; j++) {
            resolveEntityCollision(allEntities[i], allEntities[j]);
        }
    }

    checkGoal(w, h);
    updateParticles();
}

function getBallCarrier() {
    const all = [player, ...enemies, ...teammates];
    for (let e of all) {
        const dist = Math.hypot(e.x - ball.x, e.y - ball.y);
        if (dist < CONFIG.controlRadius + 5) return e;
    }
    return null;
}

function updateAI(bot, carrier, myTeam) {
    const { w, h } = getLogicSize();
    const maxSpeed = CONFIG.playerSpeed * 0.95;
    let tx = ball.x;
    let ty = ball.y;

    if (bot.role === 'goalie') {
        tx = w/2;
        ty = (bot.teamId === 'away') ? h * 0.08 : h * 0.92;
        if (Math.abs(ball.y - ty) < h * 0.5) tx = ball.x;
        
        const halfGoal = GAME_SIZES.goalWidth / 2;
        tx = Math.max(w/2 - halfGoal, Math.min(w/2 + halfGoal, tx));
        
        moveTo(bot, tx, ty, maxSpeed);
        return;
    }

    if (bot.role === 'defender') {
        let defendY = ball.y * 0.4; 
        if (defendY > h * 0.45) defendY = h * 0.45; 
        tx = ball.x * 0.8 + w/2 * 0.2; 
        ty = defendY;
        if (ball.y < h * 0.4 && Math.hypot(ball.x - bot.x, ball.y - bot.y) < 100) {
            tx = ball.x; ty = ball.y;
        }
        moveTo(bot, tx, ty, maxSpeed);
        return;
    }

    if (bot.role === 'support') {
        if (bot.teamId === 'home' && input.callPass) {
            moveTo(bot, ball.x, ball.y, maxSpeed * 1.1);
            return;
        }

        if (carrier === player) {
            const playerYRatio = player.y / h;
            if (playerYRatio > 0.5) {
                ty = player.y - h * CONFIG.supportAggression; 
                if (ty < h * 0.1) ty = h * 0.1; 
            } else {
                if (playerYRatio < 0.2) {
                    ty = h * 0.35; 
                } else {
                    ty = h * 0.15;
                }
            }
            tx = (player.x < w/2) ? w * 0.75 : w * 0.25;
            tx = Math.max(40, Math.min(w-40, tx));
            ty = Math.max(50, Math.min(h-50, ty));
            moveTo(bot, tx, ty, maxSpeed);
            return;
        }
    }

    moveTo(bot, ball.x, ball.y, maxSpeed);
}

function moveTo(bot, tx, ty, maxSpeed) {
    let dx = tx - bot.x;
    let dy = ty - bot.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 5) {
        bot.vx += (dx/dist) * 0.8;
        bot.vy += (dy/dist) * 0.8;
        const speed = Math.hypot(bot.vx, bot.vy);
        if (speed > maxSpeed) {
            bot.vx = (bot.vx/speed) * maxSpeed;
            bot.vy = (bot.vy/speed) * maxSpeed;
        }
    }
}

function checkBallStuck(dt, w, h) {
    const cSize = CONFIG.cornerSize;
    const tl = (ball.x < cSize && ball.y < cSize);
    const tr = (ball.x > w - cSize && ball.y < cSize);
    const bl = (ball.x < cSize && ball.y > h - cSize);
    const br = (ball.x > w - cSize && ball.y > h - cSize);

    if (tl || tr || bl || br) {
        resetBallSafe(w, h, "SECTOR RESET");
        return;
    }

    const margin = 40; 
    const speedThreshold = 1.0;
    const nearWall = (ball.x < margin || ball.x > w - margin);
    const isSlow = Math.abs(ball.vx) < speedThreshold && Math.abs(ball.vy) < speedThreshold;
    
    if (nearWall && isSlow) {
        ballStuckTimer += dt;
        if (ballStuckTimer > 2000) {
            resetBallSafe(w, h, "CORE STALLED");
            ballStuckTimer = 0;
        }
    } else {
        ballStuckTimer = 0;
    }
}

function resetBallSafe(w, h, msgText) {
    createParticles(ball.x, ball.y, 10, '#ffffff');
    ball.x = w / 2; ball.y = h / 2; ball.vx = 0; ball.vy = 0;
    ball.lastToucher = null; ball.assistToucher = null;
    createParticles(w / 2, h / 2, 15, '#ffffff');
    AudioSys.play('reset');
    
    const msgEl = document.getElementById('reset-msg');
    const txtEl = document.getElementById('reset-text');
    txtEl.innerText = msgText || "BALL RESET";
    
    msgEl.classList.remove('hidden');
    msgEl.classList.add('reset-anim');
    setTimeout(() => {
        msgEl.classList.add('hidden');
        msgEl.classList.remove('reset-anim');
    }, 1000);
}

function applyFriction(ent, f) {
    ent.vx *= f; ent.vy *= f;
    if (Math.abs(ent.vx) < 0.01) ent.vx = 0;
    if (Math.abs(ent.vy) < 0.01) ent.vy = 0;
}

function moveEntity(ent, w, h) {
    ent.x += ent.vx; ent.y += ent.vy;
    if (ent.x - ent.radius < 0) { ent.x = ent.radius; ent.vx *= -0.5; }
    if (ent.x + ent.radius > w) { ent.x = w - ent.radius; ent.vx *= -0.5; }
    
    const inGoalX = (ent.x > w/2 - GAME_SIZES.goalWidth/2 && ent.x < w/2 + GAME_SIZES.goalWidth/2);
    if (!inGoalX) {
        if (ent.y - ent.radius < 0) { ent.y = ent.radius; ent.vy *= -0.5; }
        if (ent.y + ent.radius > h) { ent.y = h - ent.radius; ent.vy *= -0.5; }
    }
}

function resolveCollision(p, b, isShooting, shootTarget) {
    const dx = b.x - p.x;
    const dy = b.y - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const minDist = p.radius + b.radius;

    if (dist < minDist) {
        // --- Touch Logic ---
        if (b.lastToucher !== p) {
            b.assistToucher = b.lastToucher;
            b.lastToucher = p;
        }
        // -------------------

        const overlap = minDist - dist;
        const angle = Math.atan2(dy, dx);
        
        p.x -= Math.cos(angle) * overlap * 0.5;
        p.y -= Math.sin(angle) * overlap * 0.5;
        b.x += Math.cos(angle) * overlap * 0.5;
        b.y += Math.sin(angle) * overlap * 0.5;
        
        if (isShooting && shootTarget) {
            const tdx = shootTarget.x - b.x;
            const tdy = shootTarget.y - b.y;
            const tDist = Math.hypot(tdx, tdy);
            const force = (p.teamId === 'home' && input.callPass) ? CONFIG.passForce : CONFIG.shootForce;
            
            if (tDist > 0) {
                b.vx = (tdx / tDist) * force;
                b.vy = (tdy / tDist) * force;
            }
        } else {
            const force = isShooting ? CONFIG.shootForce : 1.5; 
            b.vx += Math.cos(angle) * force;
            b.vy += Math.sin(angle) * force;
        }
        return true;
    }
    return false;
}

function resolveEntityCollision(e1, e2) {
    const dx = e2.x - e1.x;
    const dy = e2.y - e1.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const minDist = e1.radius + e2.radius;
    if (dist < minDist) {
        const angle = Math.atan2(dy, dx);
        const overlap = minDist - dist;
        const tx = overlap * Math.cos(angle) * 0.5;
        const ty = overlap * Math.sin(angle) * 0.5;
        e1.x -= tx; e1.y -= ty;
        e2.x += tx; e2.y += ty;
        const v1 = Math.hypot(e1.vx, e1.vy);
        const v2 = Math.hypot(e2.vx, e2.vy);
        e1.vx -= Math.cos(angle) * v2 * 0.5;
        e1.vy -= Math.sin(angle) * v2 * 0.5;
        e2.vx += Math.cos(angle) * v1 * 0.5;
        e2.vy += Math.sin(angle) * v1 * 0.5;
    }
}

function checkGoal(w, h) {
    if (gameState !== 'PLAYING') return;
    const gxMin = w/2 - GAME_SIZES.goalWidth/2;
    const gxMax = w/2 + GAME_SIZES.goalWidth/2;

    if (ball.y < -ball.radius && ball.x > gxMin && ball.x < gxMax) score('home');
    else if (ball.y > h + ball.radius && ball.x > gxMin && ball.x < gxMax) score('away');
}

function score(side) {
    gameState = 'GOAL';
    scores[side]++;
    AudioSys.play('goal');
    showFeedbackGif('goal-gif', 2400);
    slowMoTimer = 1000;
    
    const banner = document.getElementById('goal-banner');
    const text = document.getElementById('goal-text');
    const color = (side === 'home') ? matchTeams.home.c1 : matchTeams.away.c1;
    
    banner.style.borderColor = color;
    text.style.color = color;
    text.style.textShadow = `0 0 30px ${color}`;
    
    // --- Determine Scorer & Assist ---
    let scorerName = "UNKNOWN";
    let assistName = null;
    let isOwnGoal = false;

    if (ball.lastToucher) {
        if (ball.lastToucher.teamId === side) {
            scorerName = ball.lastToucher.name;
            if (ball.assistToucher && ball.assistToucher.teamId === side && ball.assistToucher !== ball.lastToucher) {
                assistName = ball.assistToucher.name;
            }
        } else {
            scorerName = "OWN GOAL (" + ball.lastToucher.name + ")";
            isOwnGoal = true;
        }
    } else {
        scorerName = "DRIFT SCORE";
    }

    document.getElementById('scorer-name').innerText = scorerName;
    const assistRow = document.getElementById('assist-row');
    if (assistName && !isOwnGoal) {
        document.getElementById('assist-name').innerText = assistName;
        assistRow.classList.remove('hidden');
    } else {
        assistRow.classList.add('hidden');
    }
    
    // Trigger Animations
    const stats = document.getElementById('goal-stats');
    stats.classList.remove('slide-up-anim');
    void stats.offsetWidth; // Trigger reflow
    stats.classList.add('slide-up-anim');

    document.getElementById('goal-overlay').classList.remove('hidden');
    
    for(let i=0; i<80; i++) {
        particles.push({
            x: ball.x, y: ball.y,
            vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30,
            life: 80,
            color: color
        });
    }

    setTimeout(() => {
        startReplay();
    }, 2500); // Slightly longer to read text
}

function endGame() {
    AudioSys.stopLoop();
    showFeedbackGif('result-gif', 3200);
    gameState = 'END';
    const won = scores.home > scores.away;
    const txt = document.getElementById('winnerText');
    const btnGG = document.getElementById('btn-golden-goal');
    
    if (scores.home > scores.away) {
        txt.innerText = matchTeams.home.name + " TAKES THE CUP";
        txt.style.color = matchTeams.home.c1;
        btnGG.classList.add('hidden');
        AudioSys.play('finalWin');
    } else if (scores.away > scores.home) {
        txt.innerText = matchTeams.away.name + " TAKES THE CUP";
        txt.style.color = matchTeams.away.c1;
        btnGG.classList.add('hidden');
        AudioSys.play('finalWin');
    } else {
        txt.innerText = "DEADLOCK";
        AudioSys.play('finalDraw');
        txt.style.color = "#fff";
        btnGG.classList.remove('hidden');
    }

    document.getElementById('finalScore').innerText = `${scores.home} - ${scores.away}`;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls-ui').classList.add('hidden');
}

function updateScoreUI() {
    document.getElementById('score-home').innerText = scores.home;
    document.getElementById('score-away').innerText = scores.away;
    const mins = Math.floor(timeRemaining / 60);
    const secs = Math.floor(timeRemaining % 60);
    document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0'+secs : secs}`;
}

/**
 * RENDERING
 */
function draw() {
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr * gameZoom, 0, 0, dpr * gameZoom, 0, 0);

    const { w, h } = getLogicSize();
    const pitch = PITCH_STYLES[selectedPitch];

    // -- BACKGROUND --
    if (pitch.type === 'grass') {
        // Turf pattern
        ctx.fillStyle = '#2d5a27';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#356b2e';
        const stripeH = 100;
        for(let y = 0; y < h; y += stripeH * 2) {
            ctx.fillRect(0, y, w, stripeH);
        }
    } else if (pitch.type === 'cement') {
        // Street
        ctx.fillStyle = '#4a4a4a';
        ctx.fillRect(0, 0, w, h);
    } else {
        // Space
        ctx.fillStyle = '#050505'; 
        ctx.fillRect(0, 0, w, h);
    }
    
    // -- PARTICLES / ATMOSPHERE --
    bgParticles.forEach(p => {
        p.y += p.speed;
        if (p.y > h) p.y = 0;
        
        if (pitch.type === 'space') {
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        } else if (pitch.type === 'grass') {
            // Subtle pollen/dust
            ctx.fillStyle = `rgba(200, 255, 200, ${p.alpha * 0.3})`;
            ctx.fillRect(p.x, p.y, 2, 2);
        } else {
            // Street dust
            ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha * 0.2})`;
            ctx.fillRect(p.x, p.y, 2, 2);
        }
    });

    // -- STADIUM LIGHTS (Space only) --
    if (pitch.type === 'space') {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 2;
        const time = Date.now() * 0.0005;
        for (let i = 0; i < 6; i++) {
            const y = (time * 60 + i * 250) % (h + 200) - 100;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y + 80);
            ctx.stroke();
        }
        ctx.restore();
    }

    // Corner Danger Zones
    ctx.fillStyle = (pitch.type === 'grass') ? 'rgba(255, 255, 255, 0.1)' : 'rgba(255, 0, 0, 0.1)';
    const cS = CONFIG.cornerSize;
    ctx.fillRect(0, 0, cS, cS); 
    ctx.fillRect(w-cS, 0, cS, cS); 
    ctx.fillRect(0, h-cS, cS, cS); 
    ctx.fillRect(w-cS, h-cS, cS, cS); 

    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake *= 0.8;
    }

    // -- FIELD LINES --
    if (pitch.type === 'cement') {
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)'; // Yellow street markings
        ctx.setLineDash([15, 15]);
    } else {
        ctx.strokeStyle = `rgba(255, 255, 255, ${pitch.lineAlpha})`;
        ctx.setLineDash([]);
    }
    
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w/2, h/2, 60, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Goals (Dynamic Colors)
    const gw = GAME_SIZES.goalWidth;
    const cAway = matchTeams.away.c1;
    const cHome = matchTeams.home.c1;

    // Away Goal (Top)
    ctx.fillStyle = cAway + '22'; // Hex alpha
    ctx.fillRect(w/2 - gw/2, 0, gw, 20);
    ctx.shadowBlur = 15; ctx.shadowColor = cAway;
    ctx.strokeStyle = cAway; ctx.strokeRect(w/2 - gw/2, 0, gw, 20);
    
    // Home Goal (Bottom)
    ctx.shadowBlur = 0;
    ctx.fillStyle = cHome + '22';
    ctx.fillRect(w/2 - gw/2, h - 20, gw, 20);
    ctx.shadowBlur = 15; ctx.shadowColor = cHome;
    ctx.strokeStyle = cHome; ctx.strokeRect(w/2 - gw/2, h - 20, gw, 20);
    ctx.shadowBlur = 0;

    // Decide what to draw
    let stateToDraw = {
        ball: ball,
        player: player,
        enemies: enemies,
        teammates: teammates
    };

    if (gameState === 'REPLAY' && replayBuffer[replayIndex]) {
        stateToDraw = replayBuffer[replayIndex];
    }

    // Draw Entities
    drawEntity(stateToDraw.player, true);
    stateToDraw.teammates.forEach(e => drawEntity(e, false));
    stateToDraw.enemies.forEach(e => drawEntity(e, false));
    drawBall(stateToDraw.ball);
    
    drawParticles();

    ctx.restore();
}

function drawEntity(ent, isPlayer) {
    const team = (ent.teamId === 'home') ? matchTeams.home : matchTeams.away;
    const pulse = 0.5 + Math.sin(Date.now() * 0.01) * 0.5;
    const auraRadius = ent.radius + (isPlayer ? 11 : 7) + pulse * 1.5;

    ctx.save();

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.beginPath();
    ctx.ellipse(ent.x, ent.y + ent.radius * 0.95, ent.radius * 0.9, ent.radius * 0.42, 0, 0, Math.PI*2);
    ctx.fill();

    // Broadcast aura for readability
    const aura = ctx.createRadialGradient(ent.x, ent.y, ent.radius * 0.4, ent.x, ent.y, auraRadius + 10);
    aura.addColorStop(0, isPlayer ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)');
    aura.addColorStop(0.55, `${team.c1}33`);
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(ent.x, ent.y, auraRadius + 8, 0, Math.PI * 2);
    ctx.fill();

    // Base shell
    const shell = ctx.createRadialGradient(ent.x - ent.radius * 0.35, ent.y - ent.radius * 0.5, 2, ent.x, ent.y, ent.radius * 1.2);
    shell.addColorStop(0, '#ffffff');
    shell.addColorStop(0.16, team.c1);
    shell.addColorStop(0.17, team.c2);
    shell.addColorStop(1, '#080b18');
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI*2);
    ctx.fill();

    // Outer ring
    ctx.lineWidth = isPlayer ? 4 : 3;
    ctx.strokeStyle = team.c1;
    ctx.shadowBlur = isPlayer ? 20 : 12;
    ctx.shadowColor = team.c1;
    ctx.beginPath();
    ctx.arc(ent.x, ent.y, ent.radius - 1, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Face / visor
    ctx.fillStyle = isPlayer ? 'rgba(210,250,255,0.95)' : 'rgba(255,255,255,0.82)';
    ctx.beginPath();
    ctx.arc(ent.x, ent.y - ent.radius * 0.15, ent.radius * 0.46, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = isPlayer ? '#0ea5e9' : '#0f172a';
    ctx.beginPath();
    ctx.ellipse(ent.x, ent.y - ent.radius * 0.12, ent.radius * 0.3, ent.radius * 0.18, 0, 0, Math.PI*2);
    ctx.fill();

    // Role silhouette details
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    if (ent.role === 'goalie') {
        ctx.beginPath();
        ctx.arc(ent.x, ent.y, ent.radius + 4, 0, Math.PI*2);
        ctx.stroke();
    } else if (ent.role === 'support') {
        ctx.beginPath();
        ctx.moveTo(ent.x - 7, ent.y + ent.radius * 0.5);
        ctx.lineTo(ent.x, ent.y + ent.radius * 0.95);
        ctx.lineTo(ent.x + 7, ent.y + ent.radius * 0.5);
        ctx.stroke();
    } else if (ent.role === 'defender') {
        ctx.beginPath();
        ctx.rect(ent.x - 5, ent.y + ent.radius * 0.36, 10, 8);
        ctx.stroke();
    } else if (ent.role === 'striker' || ent.role === 'captain') {
        ctx.beginPath();
        ctx.moveTo(ent.x - 6, ent.y + ent.radius * 0.55);
        ctx.lineTo(ent.x, ent.y + ent.radius * 0.88);
        ctx.lineTo(ent.x + 6, ent.y + ent.radius * 0.55);
        ctx.closePath();
        ctx.stroke();
    }

    // Player highlight
    if (isPlayer) {
        ctx.strokeStyle = '#dffcff';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(ent.x, ent.y, ent.radius + 9 + pulse, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#dffcff';
        ctx.font = "10px 'Press Start 2P'";
        ctx.textAlign = 'center';
        ctx.fillText('ACE', ent.x, ent.y - ent.radius - 12);
    }

    ctx.restore();
}

function drawBall(b) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(b.x, b.y + 4, b.radius, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    const halo = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.radius + 12);
    halo.addColorStop(0, 'rgba(255,255,255,0.18)');
    halo.addColorStop(0.5, 'rgba(0,243,255,0.1)');
    halo.addColorStop(1, 'rgba(0,243,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius + 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    ctx.save();
    
    // Masking the ball sphere
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
    ctx.clip();

    // Draw Background Base
    const style = BALL_STYLES[selectedBall];
    
    // 3D Rolling Effect: Offset texture by ball position
    const tx = b.x * 0.8;
    const ty = b.y * 0.8;

    if (style.type === 'classic') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
        
        ctx.fillStyle = '#111';
        const spacing = 18;
        for(let ox = -spacing; ox < b.radius*2 + spacing; ox+=spacing) {
            for(let oy = -spacing; oy < b.radius*2 + spacing; oy+=spacing) {
                const px = (b.x - b.radius + ox) - (tx % spacing);
                const py = (b.y - b.radius + oy) - (ty % spacing);
                ctx.beginPath();
                ctx.moveTo(px, py - 4);
                ctx.lineTo(px + 4, py - 2);
                ctx.lineTo(px + 3, py + 3);
                ctx.lineTo(px - 3, py + 3);
                ctx.lineTo(px - 4, py - 2);
                ctx.fill();
            }
        }
    } 
    else if (style.type === 'stars') { // Champions
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
        
        ctx.fillStyle = '#001a57';
        const spacing = 22;
        for(let ox = -spacing; ox < b.radius*2 + spacing; ox+=spacing) {
            for(let oy = -spacing; oy < b.radius*2 + spacing; oy+=spacing) {
                const px = (b.x - b.radius + ox) - (tx % spacing);
                const py = (b.y - b.radius + oy) - (ty % spacing);
                drawStar(px, py, 5, 8, 4);
            }
        }
    }
    else if (style.type === 'modern') { // WC 2026
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
        
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        const spacing = 30;
        ctx.beginPath();
        for(let i=0; i<3; i++) {
            const offset = (tx + i*spacing) % (spacing*3);
            ctx.moveTo(b.x - b.radius + offset - 20, b.y - b.radius);
            ctx.bezierCurveTo(b.x, b.y, b.x + 10, b.y + 10, b.x + b.radius, b.y + b.radius);
        }
        ctx.stroke();
        
        ctx.fillStyle = '#d4af37'; // Gold
        ctx.beginPath();
        ctx.arc(b.x + Math.sin(tx*0.1)*5, b.y + Math.cos(ty*0.1)*5, 4, 0, Math.PI*2);
        ctx.fill();
    }
    else if (style.type === 'speed') { // WC 2022
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
        
        const spacing = 20;
        for(let ox = -spacing; ox < b.radius*2 + spacing; ox+=spacing) {
            for(let oy = -spacing; oy < b.radius*2 + spacing; oy+=spacing) {
                const px = (b.x - b.radius + ox) - (tx % spacing);
                const py = (b.y - b.radius + oy) - (ty % spacing);
                
                ctx.fillStyle = (ox % 40 === 0) ? '#00bfff' : '#ff0055';
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + 6, py + 3);
                ctx.lineTo(px, py + 6);
                ctx.fill();
            }
        }
    }
    else if (style.type === 'leather') { // Vintage
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
        
        ctx.strokeStyle = '#3e1c05';
        ctx.lineWidth = 2;
        // Horizontal lines
        const spacing = 12;
        for(let oy = -spacing; oy < b.radius*2 + spacing; oy+=spacing) {
            const py = (b.y - b.radius + oy) - (ty % spacing);
            ctx.beginPath();
            ctx.moveTo(b.x - b.radius, py);
            ctx.lineTo(b.x + b.radius, py);
            ctx.stroke();
        }
        // Vertical stitch
        const px = (b.x - b.radius + 15) - (tx % 30);
        ctx.beginPath();
        ctx.moveTo(px, b.y - b.radius);
        ctx.lineTo(px, b.y + b.radius);
        ctx.stroke();
    }

    // Sphere Shading (Radial Gradient)
    const grad = ctx.createRadialGradient(b.x - 4, b.y - 4, 2, b.x, b.y, b.radius);
    grad.addColorStop(0, 'rgba(255,255,255,0.3)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0)');
    grad.addColorStop(0.85, 'rgba(0,0,0,0.1)');
    grad.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = grad;
    ctx.fillRect(b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);

    ctx.restore();
    
    // Outline
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
    ctx.stroke();
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
}

function createParticles(x, y, count, color) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*10,
            vy: (Math.random()-0.5)*10,
            life: 30 + Math.random()*20,
            color: color
        });
    }
}

function updateParticles() {
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1;
}

/**
 * INPUT HANDLING
 */
function handlePointerDown(e) {
    e.preventDefault();
    AudioSys.unlock();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    if (x < rect.width * 0.5 && input.joystick.id === null) {
        input.joystick.id = e.pointerId;
        input.joystick.active = true;
        input.joystick.originX = x;
        input.joystick.originY = y;
        input.joystick.x = 0;
        input.joystick.y = 0;
        
        const zone = document.getElementById('joystick-zone');
        zone.style.opacity = '1';
        zone.style.left = (x - 70) + 'px';
        zone.style.top = (y - 70) + 'px';
        document.getElementById('joystick-knob').style.transform = `translate(0px, 0px)`;
    }
}

function handlePointerMove(e) {
    e.preventDefault();
    if (e.pointerId === input.joystick.id && input.joystick.active) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const dx = x - input.joystick.originX;
        const dy = y - input.joystick.originY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = 50;
        
        const clampedDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        
        input.joystick.x = (clampedDist / maxDist) * Math.cos(angle);
        input.joystick.y = (clampedDist / maxDist) * Math.sin(angle);
        
        const kx = Math.cos(angle) * clampedDist;
        const ky = Math.sin(angle) * clampedDist;
        document.getElementById('joystick-knob').style.transform = `translate(${kx}px, ${ky}px)`;
    }
}

function handlePointerUp(e) {
    e.preventDefault();
    if (e.pointerId === input.joystick.id) {
        input.joystick.active = false;
        input.joystick.id = null;
        input.joystick.x = 0; input.joystick.y = 0;
        document.getElementById('joystick-zone').style.opacity = '0';
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
