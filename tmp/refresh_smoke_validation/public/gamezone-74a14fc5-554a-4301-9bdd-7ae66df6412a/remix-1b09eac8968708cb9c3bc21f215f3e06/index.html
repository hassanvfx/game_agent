<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.isMuted = false;
        this.unlocked = false;
        this.initialized = false;
        this.lastPlayedAt = {};
        this.soundLevels = {
            bgm_main: 0.2,
            sfx_coin: 0.35,
            sfx_cook: 0.28,
            sfx_fail: 0.3,
            sfx_levelup: 0.34,
            sfx_ui: 0.24
        };
        this.sfxCooldowns = {
            sfx_coin: 90,
            sfx_cook: 110,
            sfx_fail: 140,
            sfx_levelup: 240,
            sfx_ui: 120
        };
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.initialized = true;
        
        const unlockHandler = () => {
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            this.unlocked = true;
            this.playBgm();
            ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlockHandler));
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlockHandler, { once: true }));
        
        this.loadAssets();
    }

    async loadAssets() {
        const sounds = [
            { id: 'sfx_coin', fallback: 'beep' },
            { id: 'sfx_cook', fallback: 'noise' },
            { id: 'sfx_fail', fallback: 'low' },
            { id: 'sfx_levelup', fallback: 'high' },
            { id: 'sfx_ui', fallback: 'click' }
        ];

        for (const s of sounds) {
            const el = document.getElementById(s.id);
            if (el && el.src) {
                try {
                    const res = await fetch(el.src);
                    const buf = await res.arrayBuffer();
                    this.buffers[s.id] = await this.ctx.decodeAudioData(buf);
                } catch (e) {
                    console.warn('Audio load failed, using fallback', s.id);
                }
            }
        }
    }

    playBgm() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.volume = this.soundLevels.bgm_main;
        if (this.bgmNode !== el) this.bgmNode = el;
        if (this.unlocked && el.paused) {
            el.play().catch(() => {});
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
        this.bgmNode = null;
    }

    playSfx(id) {
        if (!this.ctx || this.ctx.state === 'suspended') return;
        const nowMs = performance.now();
        const cooldown = this.sfxCooldowns[id] || 0;
        if (cooldown && this.lastPlayedAt[id] && nowMs - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = nowMs;

        if (this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = this.buffers[id];
            gain.gain.value = this.soundLevels[id] || 0.25;
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        const now = this.ctx.currentTime;
        if (type === 'sfx_coin') {
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'sfx_fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else {
            osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        }
    }
}

/**
 * GAME ENGINE
 */
const audio = new AudioManager();
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimization

// Config
window.gameConfigDefs = {
    difficultyBase: { type: "number", label: "Difficulty Factor", value: 1.0, min: 0.5, max: 2.0 },
    themeColor: { type: "color", label: "Accent Color", value: "#FF9F1C" },
    gameTitle: { type: "text", label: "Game Title", value: "Neon Courier Shift" }
};
window.gameConfig = {
    difficultyBase: 1.0,
    themeColor: "#FF9F1C",
    gameTitle: "Neon Courier Shift"
};

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'gameTitle') document.getElementById('ui-title').innerText = val;
    }
};

function showFeedback(kind, duration = 1400) {
    const id = kind === 'success' ? 'gif-success' : 'gif-fail';
    const el = document.getElementById(id);
    if (!el) return;
    feedbackTimers[kind] += 1;
    const token = feedbackTimers[kind];
    el.classList.add('visible');
    window.setTimeout(() => {
        if (feedbackTimers[kind] === token) {
            el.classList.remove('visible');
        }
    }, duration);
}

// Game State
let gameState = 'START'; // START, PLAY, GAMEOVER
let lastTime = 0;
let score = 0;
let level = 1;
let combo = 0;
let spawnTimer = 0;
let customers = [];
let particles = [];
let appliances = [];
let tray = [];
let shake = 0;
let gameOverTriggered = false;
let feedbackTimers = { success: 0, fail: 0 };

const FOOD_TYPES = {
    BURGER: { emoji: '🍔', color: '#8B4513', cookTime: 2000, score: 20 },
    FRIES: { emoji: '🍟', color: '#FFD700', cookTime: 1500, score: 10 },
    MOMO: { emoji: '🥟', color: '#F5F5DC', cookTime: 1800, score: 15 },
    DRINK: { emoji: '🥤', color: '#FF4500', cookTime: 500, score: 5 },
    PIZZA: { emoji: '🍕', color: '#FF6347', cookTime: 2500, score: 30 }
};

class Particle {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = -Math.random() * 5 - 3;
        this.life = 1.0;
        this.size = 20;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.text) {
            ctx.fillStyle = this.color || '#fff';
            ctx.font = `700 ${this.size}px Rajdhani`;
            ctx.fillText(this.text, this.x, this.y);
        } else {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size/4, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }
}

class Customer {
    constructor() {
        this.x = canvas.width / 2; // Start center
        this.targetX = 50 + Math.random() * (canvas.width - 100);
        this.y = 150; // Behind counter
        this.order = this.generateOrder();
        this.patience = 100;
        this.maxPatience = 100;
        this.state = 'ENTERING'; // ENTERING, WAITING, LEAVING
        this.emoji = ['👨', '👩', '👴', '👵', '🧑', '👧'][Math.floor(Math.random() * 6)];
        this.skinColor = ['#f8d9ce', '#e0ac69', '#8d5524', '#c68642'][Math.floor(Math.random() * 4)];
        this.offsetY = 0;
    }

    generateOrder() {
        const types = Object.keys(FOOD_TYPES);
        // Difficulty scales order complexity
        const keys = [];
        const count = 1 + (Math.random() < (level * 0.1) ? 1 : 0);
        for(let i=0; i<count; i++) {
            keys.push(types[Math.floor(Math.random() * (Math.min(level + 2, types.length)))]);
        }
        return keys;
    }

    update(dt) {
        if (this.state === 'ENTERING') {
            this.offsetY = (Math.sin(Date.now() / 200) * 5);
        } else if (this.state === 'WAITING') {
            this.patience -= dt * (5 + level * 0.5);
            this.offsetY = (Math.sin(Date.now() / 500) * 2);
            if (this.patience <= 0) {
                this.state = 'LEAVING';
                audio.playSfx('sfx_fail');
                showFeedback('fail', 1600);
                shake = 10;
                combo = 0;
                updateHUD();
                score = Math.max(0, score - 50);
            }
        } else if (this.state === 'LEAVING') {
            this.y -= 10; // Fly away
        }
        
        // Remove check handled in main loop
    }

    draw(ctx) {
        const x = this.targetX;
        const y = this.y + this.offsetY;

        // Body
        ctx.fillStyle = this.skinColor;
        ctx.beginPath();
        ctx.arc(x, y, 40, 0, Math.PI*2);
        ctx.fill();
        
        // Face
        ctx.font = "60px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, x, y);

        // Patience Bar
        if (this.state === 'WAITING') {
            const w = 80;
            const h = 10;
            const pct = Math.max(0, this.patience / this.maxPatience);
            ctx.fillStyle = "#333";
            ctx.fillRect(x - w/2, y - 60, w, h);
            ctx.fillStyle = pct < 0.3 ? "#ff0000" : (pct < 0.6 ? "#ffa500" : "#00ff00");
            ctx.fillRect(x - w/2 + 1, y - 59, (w-2) * pct, h-2);

            // Order Bubble
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.roundRect(x + 30, y - 100, 20 + (this.order.length * 40), 50, 10);
            ctx.fill();
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Order Items
            this.order.forEach((itemKey, i) => {
                ctx.font = "30px Arial";
                ctx.fillText(FOOD_TYPES[itemKey].emoji, x + 55 + (i * 40), y - 75);
            });
        }
    }
}

class Appliance {
    constructor(type, x, y, w, h) {
        this.type = type; // BURGER, FRIES, etc.
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.progress = 0;
        this.state = 'IDLE'; // IDLE, COOKING, READY
        this.scale = 1;
    }

    update(dt) {
        if (this.state === 'COOKING') {
            this.progress += dt * 1000;
            const maxTime = FOOD_TYPES[this.type].cookTime / (1 + (level * 0.1)); // Upgrades
            if (this.progress >= maxTime) {
                this.progress = maxTime;
                this.state = 'READY';
                audio.playSfx('sfx_cook');
                showFeedback('success', 900);
                this.scale = 1.2;
            }
        }
        // Elastic scale return
        this.scale += (1 - this.scale) * 0.2;
    }

    startCooking() {
        if (this.state === 'IDLE') {
            this.state = 'COOKING';
            this.progress = 0;
            this.scale = 0.9;
        }
    }

    collect() {
        if (this.state === 'READY') {
            if (tray.length < 3) {
                tray.push(this.type);
                this.state = 'IDLE';
                this.progress = 0;
                this.scale = 1.1;
                return true;
            } else {
                // Tray full feedback
                shake = 5;
            }
        }
        return false;
    }

    draw(ctx) {
        const cx = this.x + this.w/2;
        const cy = this.y + this.h/2;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(this.scale, this.scale);
        
        // Base
        ctx.fillStyle = '#eee';
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;
        ctx.beginPath();
        ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 15);
        ctx.fill();
        ctx.shadowColor = 'transparent';

        // Label/Icon
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(FOOD_TYPES[this.type].emoji, 0, -10);

        // Progress Bar or READY
        if (this.state === 'COOKING') {
            const maxTime = FOOD_TYPES[this.type].cookTime / (1 + (level * 0.1));
            const pct = this.progress / maxTime;
            ctx.fillStyle = "#ddd";
            ctx.fillRect(-this.w/2 + 10, 20, this.w - 20, 10);
            ctx.fillStyle = window.gameConfig.themeColor;
            ctx.fillRect(-this.w/2 + 10, 20, (this.w - 20) * pct, 10);
        } else if (this.state === 'READY') {
            ctx.fillStyle = "#4df6b2";
            ctx.font = "700 18px Rajdhani";
            ctx.fillText("LOAD", 0, 30);
            // Glow
            ctx.strokeStyle = "#4df6b2";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 15);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#9ab2df";
            ctx.font = "700 15px Rajdhani";
            ctx.fillText("TAP", 0, 30);
        }

        ctx.restore();
    }
}

function initGame() {
    resize();
    resetGame();
    audio.init();
    
    // Create Appliances Layout
    const margin = 20;
    const w = (canvas.width - margin * 4) / 3;
    const h = 120;
    const y = canvas.height - h - 30;
    
    appliances = [
        new Appliance('BURGER', margin, y, w, h),
        new Appliance('FRIES', margin*2 + w, y, w, h),
        new Appliance('DRINK', margin*3 + w*2, y, w, h)
    ];

    // Add more appliances based on level (simulated by just unlocking types in existing slots for simplicity in this layout, 
    // or we could add a second row. Let's stick to 3 slots but cycle types or add a 4th/5th slot if screen permits.)
    // For single file simplicity: The 3 slots are fixed, but maybe they cook faster.
}

function resetGame() {
    score = 0;
    level = 1;
    combo = 0;
    customers = [];
    tray = [];
    particles = [];
    spawnTimer = 0;
    shake = 0;
    gameOverTriggered = false;
    document.getElementById('gif-success')?.classList.remove('visible');
    document.getElementById('gif-fail')?.classList.remove('visible');
    audio.playBgm();
    updateHUD();
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Re-layout appliances on resize
    if(appliances.length > 0) {
        const margin = 20;
        const w = (window.innerWidth - margin * 4) / 3;
        const h = 120;
        const y = window.innerHeight - h - 30;
        appliances[0].x = margin; appliances[0].y = y; appliances[0].w = w;
        appliances[1].x = margin*2 + w; appliances[1].y = y; appliances[1].w = w;
        appliances[2].x = margin*3 + w*2; appliances[2].y = y; appliances[2].w = w;
    }
}
window.addEventListener('resize', resize);

function spawnCustomer() {
    if (customers.length < 4) {
        const c = new Customer();
        c.state = 'WAITING'; // Skip entering anim for logic simplicity
        customers.push(c);
    }
}

function updateHUD() {
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('levelVal').innerText = level;
    const cVal = document.getElementById('comboVal');
    cVal.innerText = combo;
    document.getElementById('comboContainer').style.display = combo > 1 ? 'block' : 'none';
}

function checkService(index) {
    // Check if item at tray[index] matches any customer's need
    // Logic: Customers have an order list. We need to match one item from their list.
    // Or do we fulfill the WHOLE order? 
    // "Assembly" usually means whole order. But "Rush" is better with single item serving.
    // Let's go with: Serve item to customer who wants it.
    
    const item = tray[index];
    let served = false;

    for (let c of customers) {
        if (c.state === 'WAITING') {
            const idx = c.order.indexOf(item);
            if (idx !== -1) {
                // Matched!
                c.order.splice(idx, 1); // Remove item from order
                
                // Visuals
                particles.push(new Particle(c.targetX, c.y, "+"+FOOD_TYPES[item].score, '#FFD700'));
                particles.push(new Particle(c.targetX, c.y, FOOD_TYPES[item].emoji, null));
                
                score += FOOD_TYPES[item].score + (combo * 5);
                combo++;
                audio.playSfx('sfx_coin');
                showFeedback('success');
                
                // If order complete
                if (c.order.length === 0) {
                    c.state = 'LEAVING';
                    score += 50; // Bonus for completion
                    particles.push(new Particle(c.targetX, c.y, "DELIVERED!", '#2EC4B6'));
                }
                
                served = true;
                break;
            }
        }
    }

    if (served) {
        tray.splice(index, 1);
        // Level up check
        if (score > level * 500) {
            level++;
            audio.playSfx('sfx_levelup');
            showFeedback('success', 1800);
            particles.push(new Particle(window.innerWidth/2, window.innerHeight/2, "ROUTE UP!", '#fff'));
        }
    } else {
        // Wasted food
        audio.playSfx('sfx_fail');
        showFeedback('fail');
        tray.splice(index, 1);
        combo = 0;
        shake = 5;
        score = Math.max(0, score - 10);
        particles.push(new Particle(window.innerWidth/2, window.innerHeight - 200, "MISROUTE!", '#ff0000'));
    }
    updateHUD();
}

function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (gameState === 'PLAY') {
        if (!gameOverTriggered && customers.length >= 4 && customers.every(c => c.state === 'LEAVING')) {
            gameOverTriggered = true;
            gameState = 'GAMEOVER';
            audio.stopBgm();
            audio.playSfx('sfx_fail');
            showFeedback('fail', 2000);
            document.getElementById('finalScore').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            return requestAnimationFrame(gameLoop);
        }
        // Shake decay
        if (shake > 0) {
            ctx.save();
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;
            ctx.translate(dx, dy);
            shake *= 0.9;
            if(shake < 0.5) shake = 0;
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw BG
        const bg = document.getElementById('asset_bg');
        if (bg) {
            // Cover fit
            const ratio = Math.max(canvas.width / bg.naturalWidth, canvas.height / bg.naturalHeight);
            const w = bg.naturalWidth * ratio;
            const h = bg.naturalHeight * ratio;
            ctx.drawImage(bg, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
            
            // Darken overlay
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Spawn Logic
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            spawnCustomer();
            // Spawn rate gets faster with level
            const base = 4.0;
            const factor = window.gameConfig.difficultyBase;
            spawnTimer = Math.max(1.0, (base / factor) - (level * 0.2)); 
        }

        // Draw Counter
        ctx.fillStyle = "rgba(94, 242, 255, 0.18)";
        ctx.fillRect(0, 300, canvas.width, 6); // Shelf line

        // Update & Draw Customers (behind counter)
        // Filter out fully left customers
        customers = customers.filter(c => c.y > -100);
        customers.forEach(c => {
            c.update(dt);
            c.draw(ctx);
        });

        // Draw Counter Top
        const counterGradient = ctx.createLinearGradient(0, 320, 0, canvas.height);
        counterGradient.addColorStop(0, "rgba(58, 36, 95, 0.98)");
        counterGradient.addColorStop(0.4, "rgba(28, 21, 55, 0.98)");
        counterGradient.addColorStop(1, "rgba(10, 14, 30, 0.98)");
        ctx.fillStyle = counterGradient;
        ctx.fillRect(0, 320, canvas.width, canvas.height - 320);
        
        // Draw Tray Area
        ctx.fillStyle = "rgba(9, 16, 36, 0.8)";
        const trayY = canvas.height - 280;
        ctx.roundRect(20, trayY, canvas.width - 40, 100, 20);
        ctx.fill();
        ctx.strokeStyle = "rgba(94, 242, 255, 0.28)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#ffd85c";
        ctx.font = "700 20px Rajdhani";
        ctx.textAlign = "left";
        ctx.fillText("DISPATCH BAY", 30, trayY - 10);

        // Draw Tray Items
        const trayW = (canvas.width - 40) / 3;
        tray.forEach((item, i) => {
            const tx = 20 + (i * trayW) + trayW/2;
            const ty = trayY + 50;
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(FOOD_TYPES[item].emoji, tx, ty);
        });

        // Update & Draw Appliances
        appliances.forEach(a => {
            a.update(dt);
            a.draw(ctx);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update(dt);
            p.draw(ctx);
            if (p.life <= 0) particles.splice(i, 1);
        });

        if (shake > 0) ctx.restore();

    } else if (gameState === 'GAMEOVER') {
        // Static render handled by HTML overlay
    }

    requestAnimationFrame(gameLoop);
}

// Input Handling
canvas.addEventListener('pointerdown', e => {
    if (gameState !== 'PLAY') return;
    e.preventDefault();
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Check Appliances
    for (let a of appliances) {
        if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) {
            if (a.state === 'IDLE') {
                a.startCooking();
                // Particle
                    particles.push(new Particle(x, y, "PACKING...", "#fff"));
            } else if (a.state === 'READY') {
                if(a.collect()) {
                    particles.push(new Particle(x, y, "READY!", "#fff"));
                }
            }
            return;
        }
    }

    // Check Tray
    const trayY = canvas.height - 280; // Hardcoded from draw logic
    if (y >= trayY && y <= trayY + 100) {
        const trayW = (canvas.width - 40) / 3;
        const idx = Math.floor((x - 20) / trayW);
        if (idx >= 0 && idx < tray.length) {
            checkService(idx);
        }
    }
}, { passive: false });

// UI Bindings
document.getElementById('start-btn').addEventListener('click', () => {
    audio.init();
    audio.playSfx('sfx_ui');
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    gameState = 'PLAY';
    resetGame();
    initGame();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

document.getElementById('restart-btn').addEventListener('click', () => {
    audio.playSfx('sfx_ui');
    document.getElementById('game-over-screen').classList.add('hidden');
    gameState = 'PLAY';
    resetGame();
    initGame();
    lastTime = performance.now();
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    resize();
    // Pre-draw bg
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});

</script>
</body>
