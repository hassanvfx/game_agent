<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Glow Mixer Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');

        :root {
            color-scheme: dark;
            --bg-top: #120d2f;
            --bg-mid: #2a1458;
            --bg-bottom: #7b1f67;
            --panel-fill: rgba(22, 19, 49, 0.72);
            --panel-stroke: rgba(133, 222, 255, 0.34);
            --hud-glow: rgba(65, 214, 255, 0.28);
            --text-main: #f7fbff;
            --text-soft: #b8d8ff;
            --accent-aqua: #72f2ff;
            --accent-lime: #d8ff72;
            --accent-pink: #ff72c8;
            --accent-gold: #ffe579;
            --danger: #6d4b3d;
            --shadow-deep: rgba(4, 4, 16, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Rajdhani', 'Trebuchet MS', sans-serif;
            background:
                radial-gradient(circle at 50% 18%, rgba(114, 242, 255, 0.16), transparent 24%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
            background-color: var(--bg-top);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .hidden { display: none !important; }
        .group { overflow: hidden; }
        .w-full { width: 100%; }
        .h-full { width: 100vw; height: 100vh; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-light { font-weight: 400; }
        .text-white { color: #fff; }
        .rounded-3xl { border-radius: 1.75rem; }
        .rounded-full { border-radius: 999px; }
        .drop-shadow-sm { filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.35)); }
        .transition {
            transition: transform 220ms ease, box-shadow 220ms ease, background-color 220ms ease, color 220ms ease;
        }
        .duration-500 { transition-duration: 500ms; }
        .ease-out { transition-timing-function: ease-out; }
        .transform { transform-origin: center; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:-translate-y-1:hover { transform: translateY(-0.25rem); }
        .hover\:bg-gray-100:hover { background-color: #f3f4f6; color: #db2777; }
        .shadow-lg { box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34); }
        .hover\:shadow-pink-500\/50:hover { box-shadow: 0 18px 38px rgba(236, 72, 153, 0.5); }

        .bg-gradient-to-b {
            background:
                radial-gradient(circle at top, rgba(114, 242, 255, 0.16), transparent 30%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
        }

        .bg-gradient-to-r {
            background: linear-gradient(90deg, var(--accent-aqua) 0%, var(--accent-pink) 100%);
        }

        .bg-white { background: linear-gradient(180deg, #fdf7ff 0%, #e4efff 100%); }
        .text-pink-600 { color: #7c2d92; }
        .text-pink-100 { color: var(--text-soft); }
        .text-pink-200 { color: #d9d8ff; }

        .p-10 { padding: 2.5rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }

        .text-6xl {
            font-size: clamp(2.8rem, 7vw, 5rem);
            line-height: 0.95;
        }

        .text-5xl {
            font-size: clamp(2.3rem, 6vw, 4rem);
            line-height: 1;
        }

        .text-2xl { font-size: clamp(1.3rem, 3vw, 1.6rem); }
        .text-xl { font-size: clamp(1.05rem, 2.7vw, 1.35rem); }

        .tracking-wide { letter-spacing: 0.08em; }

        button {
            border: 0;
            cursor: pointer;
            font-family: 'Rajdhani', 'Trebuchet MS', sans-serif;
            letter-spacing: 0.08em;
        }

        .glass-panel {
            position: relative;
            background:
                linear-gradient(180deg, rgba(31, 24, 65, 0.92) 0%, rgba(20, 17, 45, 0.82) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-stroke);
            box-shadow:
                0 18px 42px var(--shadow-deep),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 0 22px rgba(114, 242, 255, 0.14);
            max-width: min(92vw, 32rem);
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0.45rem;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        .gradient-text {
            background: linear-gradient(90deg, #ecffff 0%, var(--accent-aqua) 38%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', 'Arial Black', sans-serif;
            letter-spacing: 0.12em;
            text-shadow: 0 0 18px rgba(114, 242, 255, 0.18);
        }

        .screen-title {
            text-transform: uppercase;
            font-family: 'Orbitron', 'Arial Black', sans-serif;
            letter-spacing: 0.08em;
            color: var(--text-main);
            text-shadow: 0 0 18px rgba(114, 242, 255, 0.18);
        }

        .feedback-dock {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(34vw, 9rem);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6rem;
            z-index: 8;
        }

        .feedback-gif {
            width: 100%;
            max-width: 8.5rem;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 1.25rem;
            border: 1px solid rgba(114, 242, 255, 0.38);
            background: rgba(16, 18, 37, 0.62);
            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(1rem) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            max-width: 12rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(10, 14, 33, 0.74);
            border: 1px solid rgba(114, 242, 255, 0.24);
            color: var(--text-soft);
            font-family: 'Rajdhani', 'Trebuchet MS', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: translateY(0.5rem);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-caption.active {
            opacity: 1;
            transform: translateY(0);
        }

        .spark-strip {
            position: absolute;
            inset: auto 0 0 0;
            height: 3.5rem;
            overflow: hidden;
            pointer-events: none;
        }

        .spark-strip span {
            position: absolute;
            bottom: 0.2rem;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(114,242,255,0.2) 70%, transparent 100%);
            box-shadow: 0 0 10px rgba(114, 242, 255, 0.45);
            animation: sparkFloat 2.8s ease-in-out infinite;
        }

        .spark-strip span:nth-child(1) { left: 15%; animation-delay: 0s; }
        .spark-strip span:nth-child(2) { left: 36%; animation-delay: 0.5s; }
        .spark-strip span:nth-child(3) { left: 62%; animation-delay: 1.1s; }
        .spark-strip span:nth-child(4) { left: 82%; animation-delay: 1.7s; }

        .hud-pill {
            min-width: 7.2rem;
            border: 1px solid rgba(114, 242, 255, 0.28);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24), inset 0 0 12px rgba(114, 242, 255, 0.08);
        }

        .hud-label {
            display: block;
            font-size: 0.78rem;
            line-height: 1;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        .hud-value {
            display: block;
            margin-top: 0.2rem;
            font-size: 1.15rem;
            line-height: 1.05;
            font-weight: 700;
            color: var(--text-main);
        }

        .accent-button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #6ef4ff 0%, #ff78d0 100%);
            color: #0c1030;
            font-weight: 700;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32), 0 0 20px rgba(114, 242, 255, 0.24);
        }

        .accent-button::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.25) 48%, transparent 76%);
            transform: translateX(-115%);
            transition: transform 260ms ease;
        }

        .accent-button:hover::after,
        .accent-button:focus-visible::after {
            transform: translateX(115%);
        }

        .secondary-button {
            border: 1px solid rgba(124, 45, 146, 0.14);
            color: #46145d;
        }

        @keyframes sparkFloat {
            0%, 100% { transform: translateY(0) scale(0.85); opacity: 0.18; }
            55% { transform: translateY(-16px) scale(1.2); opacity: 0.92; }
        }

        @media (max-width: 640px) {
            .p-10 { padding: 1.5rem; }
            .top-6 { top: 1rem; }
            .left-6 { left: 1rem; }
            .gap-4 { gap: 0.6rem; }
            .text-xl { font-size: 1rem; }
            .hud-pill {
                min-width: 5.8rem;
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .feedback-dock {
                right: 0.75rem;
                bottom: 0.75rem;
                width: min(32vw, 6.25rem);
                gap: 0.45rem;
            }
            .feedback-caption {
                max-width: 9rem;
                padding: 0.4rem 0.55rem;
                font-size: 0.62rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full bg-gradient-to-b from-purple-900 via-pink-800 to-rose-400">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-3xl text-center pointer-events-auto hover:scale-105 transition duration-500 ease-out">
                <h1 class="text-6xl font-bold mb-2 gradient-text drop-shadow-sm">GLOW MIXER RUSH</h1>
                <p class="text-pink-100 text-xl mb-8 font-light tracking-wide">Guide the neon mixer.<br>Catch clean drops. Reject the sludge.</p>
                <button id="start-btn" class="accent-button font-bold py-4 px-10 rounded-full shadow-lg hover:shadow-pink-500/50 hover:-translate-y-1 transition transform">
                    START BATCH
                </button>
                <div class="spark-strip" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-3xl text-center pointer-events-auto">
                <h2 class="text-5xl font-bold mb-2 screen-title">MIXER JAMMED</h2>
                <div class="text-2xl text-pink-200 mb-6">Clean batches saved: <span id="finalScore" class="font-bold text-white">0</span></div>
                <button id="restart-btn" class="secondary-button bg-white text-pink-600 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-100 transition">
                    Retry Run
                </button>
                <div class="spark-strip" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
            
            <!-- HUD -->
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe top-left cluster -->
            <div id="hud" class="absolute top-6 left-6 flex gap-4 hidden">
                <div class="glass-panel hud-pill px-6 py-2 rounded-full text-white font-bold text-xl">
                    <span class="hud-label">Batches</span>
                    <span id="score" class="hud-value">0</span>
                </div>
                <div class="glass-panel hud-pill px-6 py-2 rounded-full text-white font-bold text-xl">
                    <span class="hud-label">Safety</span>
                    <span id="lives" class="hud-value">3</span>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: clean-catch + sludge-warning -> catalogs/gifs.json -->
            <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
            <div class="feedback-dock pointer-events-none" aria-live="polite">
                <img id="success-gif" class="feedback-gif" alt="Mixer success reaction" />
                <img id="fail-gif" class="feedback-gif" alt="Mixer danger reaction" />
                <div id="feedback-caption" class="feedback-caption">Mixer online</div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                catch: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
            },
            gifs: {
                success: "https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = this.createAudio(ASSETS.bgm, 0.28, true);
                this.sfx = {};
                for (const [key, value] of Object.entries(ASSETS.sfx)) {
                    this.sfx[key] = this.createAudio(value, this.getVolume(key), false);
                }
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                audio.playsInline = true;
                return audio;
            }

            getVolume(key) {
                const volumeMap = {
                    start: 0.55,
                    catch: 0.45,
                    score: 0.5,
                    fail: 0.58,
                    danger: 0.4,
                    gameOver: 0.62,
                    ui: 0.42
                };
                return volumeMap[key] ?? 0.5;
            }

            unlock() {
                if (this.unlocked) return Promise.resolve();
                const pending = [this.bgm, ...Object.values(this.sfx)].map((sound) => {
                    const playAttempt = sound.play()
                        .then(() => {
                            sound.pause();
                            sound.currentTime = 0;
                        })
                        .catch(() => {});
                    return playAttempt;
                });

                return Promise.all(pending).finally(() => {
                    this.unlocked = true;
                });
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, restart = true) {
                const sound = this.sfx[key];
                if (!sound || !this.unlocked) return;
                if (restart) {
                    sound.currentTime = 0;
                }
                sound.play().catch(() => {});
            }
        }
        
        const audio = new AudioController();
        const successGif = document.getElementById('success-gif');
        const failGif = document.getElementById('fail-gif');
        const feedbackCaption = document.getElementById('feedback-caption');
        successGif.src = ASSETS.gifs.success;
        failGif.src = ASSETS.gifs.fail;

        let feedbackTimer = null;
        let warningCooldown = false;

        function showFeedback(mode, message) {
            const isSuccess = mode === 'success';
            successGif.classList.toggle('active', isSuccess);
            failGif.classList.toggle('active', !isSuccess);
            feedbackCaption.textContent = message;
            feedbackCaption.classList.add('active');

            window.clearTimeout(feedbackTimer);
            feedbackTimer = window.setTimeout(() => {
                successGif.classList.remove('active');
                failGif.classList.remove('active');
                feedbackCaption.classList.remove('active');
            }, 1400);
        }

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let inputX = 0;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        // Entities
        let player = { x: 0, y: 0, width: 80, height: 50, color: '#E0E0E0', pulse: 0 };
        let items = []; // Falling ingredients
        let particles = []; // Visual effects
        let mixColor = { r: 255, g: 255, b: 255 }; // The color inside the bowl

        // Parallax State
        let bgBubbles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.y = height - 100;
            player.x = width / 2;
            inputX = width / 2;
            
            // Re-init background bubbles on resize
            bgBubbles = [];
            for(let i=0; i<20; i++) {
                bgBubbles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 20 + 5,
                    speed: Math.random() * 0.5 + 0.1,
                    alpha: Math.random() * 0.3
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** 4. INPUT HANDLING */
        const handleInput = (x) => {
            if (!gameActive) return;
            inputX = x;
            // Smooth lerp happens in update
        };

        canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 5. GAME LOGIC */
        function spawnItem() {
            const types = ['pigment', 'glitter', 'cream', 'sludge'];
            // Increase sludge chance as difficulty rises
            let rand = Math.random();
            let type = 'pigment';
            
            if (rand < 0.1 + (difficultyMultiplier * 0.05)) type = 'sludge';
            else if (rand < 0.4) type = 'glitter';
            else if (rand < 0.7) type = 'cream';
            
            const size = 15 + Math.random() * 10;
            items.push({
                x: Math.random() * (width - 40) + 20,
                y: -50,
                size: size,
                speed: (3 + Math.random() * 3) * difficultyMultiplier,
                type: type,
                angle: 0,
                rotSpeed: (Math.random() - 0.5) * 0.2
            });
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            // Difficulty ramp
            difficultyMultiplier = 1 + (score / 50);

            // Player Movement (Lerp)
            player.x += (inputX - player.x) * 0.15;
            player.pulse += 0.08;
            
            // Constrain player
            if (player.x < player.width/2) player.x = player.width/2;
            if (player.x > width - player.width/2) player.x = width - player.width/2;

            // Spawn items
            if (frameCount % Math.max(20, Math.floor(60 - difficultyMultiplier * 5)) === 0) {
                spawnItem();
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.angle += item.rotSpeed;

                // Collision Detection (Circle to Circle approx for bowl opening)
                // Bowl "hitbox" is near the top of the bowl sprite
                let dx = item.x - player.x;
                let dy = item.y - (player.y - 10);
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < item.size + 30) {
                    // Caught!
                    if (item.type === 'sludge') {
                        audio.playSFX('fail');
                        lives--;
                        createExplosion(item.x, item.y, '#5D4037');
                        document.getElementById('lives').innerText = lives;
                        showFeedback('fail', 'Sludge leak!');
                        if (!warningCooldown && lives === 1) {
                            warningCooldown = true;
                            audio.playSFX('danger');
                            window.setTimeout(() => {
                                warningCooldown = false;
                            }, 1200);
                        }
                        if (lives <= 0) gameOver();
                    } else {
                        audio.playSFX('catch');
                        audio.playSFX('score');
                        score++;
                        document.getElementById('score').innerText = score;
                        
                        // Visuals
                        let pColor = '#FFF';
                        if (item.type === 'pigment') { 
                            pColor = '#FF69B4'; 
                            mixColor.r = (mixColor.r + 255)/2; 
                            mixColor.g = (mixColor.g + 105)/2; 
                            mixColor.b = (mixColor.b + 180)/2; 
                        }
                        if (item.type === 'glitter') { 
                            pColor = '#FFD700';
                            mixColor.r = (mixColor.r + 255)/2; 
                            mixColor.g = (mixColor.g + 215)/2; 
                            mixColor.b = (mixColor.b + 0)/2; 
                        }
                        if (item.type === 'cream') {
                            pColor = '#FFFDD0';
                            mixColor.r = (mixColor.r + 255)/2; 
                            mixColor.g = (mixColor.g + 253)/2; 
                            mixColor.b = (mixColor.b + 208)/2; 
                        }
                        createExplosion(item.x, item.y, pColor);
                        showFeedback('success', `${item.type.toUpperCase()} secured`);
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Missed
                if (item.y > height + 50) {
                    items.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update Background Parallax
            bgBubbles.forEach(b => {
                b.y -= b.speed;
                if (b.y < -50) {
                    b.y = height + 50;
                    b.x = Math.random() * width;
                }
            });

            frameCount++;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Parallax Background
            ctx.save();
            bgBubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
                ctx.fill();
            });
            ctx.restore();

            // 2. Draw Player (Mixing Bowl)
            ctx.save();
            ctx.translate(player.x, player.y);
            
            const pulseGlow = 0.7 + Math.sin(player.pulse) * 0.12;
            const mixFill = `rgb(${Math.floor(mixColor.r)}, ${Math.floor(mixColor.g)}, ${Math.floor(mixColor.b)})`;

            // Neon aura
            const aura = ctx.createRadialGradient(0, -4, 8, 0, 10, 64);
            aura.addColorStop(0, 'rgba(114, 242, 255, 0.42)');
            aura.addColorStop(0.45, 'rgba(255, 114, 200, 0.18)');
            aura.addColorStop(1, 'rgba(114, 242, 255, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.ellipse(0, 10, 58, 34, 0, 0, Math.PI * 2);
            ctx.fill();

            // Mixer handle
            ctx.strokeStyle = `rgba(210, 250, 255, ${pulseGlow})`;
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(28, -2);
            ctx.quadraticCurveTo(52, 8, 44, 30);
            ctx.stroke();

            // Bowl Body
            const bowlGradient = ctx.createLinearGradient(0, -26, 0, 38);
            bowlGradient.addColorStop(0, '#eff9ff');
            bowlGradient.addColorStop(0.4, '#c3d9ff');
            bowlGradient.addColorStop(1, '#6878bd');
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI, false);
            ctx.fillStyle = bowlGradient;
            ctx.shadowColor = 'rgba(114, 242, 255, 0.38)';
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#e4f5ff';
            ctx.stroke();

            // Bowl contents
            const liquidGradient = ctx.createLinearGradient(0, -10, 0, 10);
            liquidGradient.addColorStop(0, 'rgba(255,255,255,0.95)');
            liquidGradient.addColorStop(1, mixFill);
            ctx.beginPath();
            ctx.ellipse(0, -1, 35, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = liquidGradient;
            ctx.fill();

            // Glow rings / faceplate
            ctx.strokeStyle = `rgba(114, 242, 255, ${pulseGlow})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, 40, 12, 0, 0, Math.PI, false);
            ctx.stroke();

            ctx.fillStyle = 'rgba(247, 251, 255, 0.92)';
            ctx.beginPath();
            ctx.arc(-12, 11, 4, 0, Math.PI * 2);
            ctx.arc(12, 11, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#7b1f67';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 18, 12, 0.08 * Math.PI, 0.92 * Math.PI, false);
            ctx.stroke();

            ctx.restore();

            // 3. Draw Items
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.angle);

                if (item.type === 'pigment') {
                    const pigmentGlow = ctx.createRadialGradient(-item.size * 0.25, -item.size * 0.3, 2, 0, 0, item.size * 1.2);
                    pigmentGlow.addColorStop(0, '#fff8ff');
                    pigmentGlow.addColorStop(0.55, '#ff72c8');
                    pigmentGlow.addColorStop(1, '#8f2df5');
                    ctx.beginPath();
                    ctx.arc(0, 0, item.size, 0, Math.PI * 2);
                    ctx.fillStyle = pigmentGlow;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.beginPath();
                    ctx.arc(-item.size*0.3, -item.size*0.3, item.size*0.26, 0, Math.PI*2);
                    ctx.fill();
                } else if (item.type === 'glitter') {
                    ctx.fillStyle = '#ffe579';
                    ctx.beginPath();
                    ctx.moveTo(0, -item.size);
                    ctx.lineTo(item.size, 0);
                    ctx.lineTo(0, item.size);
                    ctx.lineTo(-item.size, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#fff9d0';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath();
                    ctx.moveTo(0, -item.size * 0.75);
                    ctx.lineTo(0, item.size * 0.75);
                    ctx.moveTo(-item.size * 0.75, 0);
                    ctx.lineTo(item.size * 0.75, 0);
                    ctx.stroke();
                } else if (item.type === 'cream') {
                    const creamGlow = ctx.createRadialGradient(-item.size * 0.2, -item.size * 0.25, 1, 0, 0, item.size * 1.3);
                    creamGlow.addColorStop(0, '#ffffff');
                    creamGlow.addColorStop(0.7, '#fff7c8');
                    creamGlow.addColorStop(1, '#d5e8ff');
                    ctx.fillStyle = creamGlow;
                    ctx.beginPath();
                    ctx.arc(0, 0, item.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(240,252,255,0.75)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (item.type === 'sludge') {
                    ctx.fillStyle = '#5a4a35';
                    ctx.beginPath();
                    ctx.moveTo(-item.size, -item.size);
                    ctx.lineTo(item.size, -item.size/2);
                    ctx.lineTo(item.size/2, item.size);
                    ctx.lineTo(-item.size/2, item.size/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#2d2016';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.strokeStyle = '#c2ff54';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-item.size, -item.size - 5);
                    ctx.lineTo(-item.size + 3, -item.size - 15);
                    ctx.moveTo(item.size * 0.2, -item.size - 3);
                    ctx.lineTo(item.size * 0.45, -item.size - 13);
                    ctx.stroke();
                }

                ctx.restore();
            });

            // 4. Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function initGame() {
            score = 0;
            lives = 3;
            items = [];
            particles = [];
            mixColor = { r: 255, g: 255, b: 255 };
            difficultyMultiplier = 1;
            frameCount = 0;
            warningCooldown = false;
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            successGif.classList.remove('active');
            failGif.classList.remove('active');
            feedbackCaption.textContent = 'Mixer online';
            feedbackCaption.classList.remove('active');
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver');
            showFeedback('fail', 'Mixer jammed');
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('start');
            audio.playBGM();
            showFeedback('success', 'Batch rolling');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('ui');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            audio.playBGM();
            showFeedback('success', 'Mixer rebooted');
            gameActive = true;
            initGame();
            gameLoop();
        });
        
    });
    </script>
</body>
</html>
