<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Emoji Memory</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        :root {
            --bg-deep: #09111f;
            --bg-mid: #13233c;
            --panel: rgba(12, 22, 40, 0.72);
            --panel-strong: rgba(20, 37, 67, 0.92);
            --accent: #6ff5ff;
            --accent-2: #8f7bff;
            --danger: #ff5f86;
            --success: #5df2a4;
            --text-main: #f4f8ff;
            --text-soft: #b7c7df;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(143, 123, 255, 0.18), transparent 36%),
                radial-gradient(circle at bottom, rgba(111, 245, 255, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text-main);
            font-family: 'Rajdhani', system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            touch-action: none;
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 0 1px rgba(111, 245, 255, 0.16),
                0 0 28px rgba(143, 123, 255, 0.2);
            border-radius: 18px;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            padding: max(12px, env(safe-area-inset-top)) 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            font-size: clamp(12px, 2.8vw, 15px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.42);
        }

        .hud-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .hud-chip {
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(111, 245, 255, 0.3);
            background: linear-gradient(180deg, rgba(20, 37, 67, 0.92), rgba(8, 17, 31, 0.85));
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-weight: 600;
        }

        .status-chip {
            font-size: clamp(11px, 2.6vw, 13px);
            color: var(--text-soft);
        }

        .screen {
            position: absolute;
            inset: 0;
            padding: 24px 18px;
            box-sizing: border-box;
            background:
                radial-gradient(circle at top, rgba(111, 245, 255, 0.12), transparent 30%),
                rgba(3, 8, 18, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            transition: opacity 0.3s;
            text-align: center;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(28px, 8vw, 46px);
            line-height: 0.98;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'Orbitron', system-ui, sans-serif;
            color: var(--accent);
            text-shadow:
                0 0 18px rgba(111, 245, 255, 0.35),
                0 4px 0 rgba(7, 15, 26, 0.85);
        }

        p {
            margin: 0;
            max-width: 28ch;
            font-size: clamp(14px, 3.9vw, 18px);
            color: var(--text-soft);
            letter-spacing: 0.03em;
        }

        .btn {
            margin-top: 20px;
            min-width: min(260px, 82vw);
            padding: 14px 24px;
            font-size: clamp(16px, 4.2vw, 18px);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: 'Orbitron', system-ui, sans-serif;
            background: linear-gradient(180deg, #ff7198, var(--danger));
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            cursor: pointer;
            box-shadow:
                0 8px 20px rgba(255, 95, 134, 0.28),
                inset 0 -3px 0 rgba(116, 14, 39, 0.45);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }

        .btn:active {
            transform: translateY(2px) scale(0.985);
            box-shadow:
                0 3px 10px rgba(255, 95, 134, 0.22),
                inset 0 -1px 0 rgba(116, 14, 39, 0.4);
        }

        #mute-btn {
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(20, 37, 67, 0.92), rgba(8, 17, 31, 0.82));
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 1px solid rgba(111, 245, 255, 0.35);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }

        .screen-card {
            width: min(100%, 420px);
            padding: 24px 20px;
            border-radius: 24px;
            border: 1px solid rgba(111, 245, 255, 0.22);
            background: linear-gradient(180deg, rgba(19, 35, 60, 0.94), rgba(8, 17, 31, 0.92));
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.34);
        }

        .hero-badge {
            margin: 0 auto 16px;
            width: 92px;
            height: 92px;
            border-radius: 26px;
            display: grid;
            place-items: center;
            font-size: 48px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.34), transparent 30%),
                linear-gradient(180deg, rgba(111, 245, 255, 0.22), rgba(143, 123, 255, 0.28));
            border: 1px solid rgba(255, 255, 255, 0.24);
            box-shadow:
                inset 0 0 20px rgba(255, 255, 255, 0.08),
                0 0 24px rgba(111, 245, 255, 0.18);
            animation: floatBadge 2.4s ease-in-out infinite;
        }

        .accent-line {
            width: 92px;
            height: 4px;
            margin: 16px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--danger));
            box-shadow: 0 0 14px rgba(111, 245, 255, 0.28);
        }

        .reaction-overlay {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(18px) scale(0.92);
            bottom: max(16px, env(safe-area-inset-bottom));
            width: min(34vw, 160px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.22s ease, transform 0.22s ease;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
            z-index: 3;
        }

        .reaction-overlay img {
            width: 100%;
            display: block;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(8, 17, 31, 0.45);
        }

        .reaction-overlay.show {
            opacity: 0.96;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .reaction-overlay--top {
            bottom: auto;
            top: max(74px, calc(env(safe-area-inset-top) + 58px));
            left: auto;
            right: 12px;
            transform: translateY(-14px) scale(0.92);
            width: min(28vw, 132px);
        }

        .reaction-overlay--top.show {
            transform: translateY(0) scale(1);
        }

        .reaction-caption {
            margin-top: 6px;
            text-align: center;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(10px, 2.2vw, 12px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        @keyframes floatBadge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (max-width: 640px) {
            .reaction-overlay {
                width: min(38vw, 138px);
                bottom: max(12px, env(safe-area-inset-bottom));
            }

            .reaction-overlay--top {
                width: min(30vw, 110px);
                right: 10px;
                top: max(72px, calc(env(safe-area-inset-top) + 54px));
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-stack">
                    <span id="score-display" class="hud-chip">Scans: 0</span>
                    <span id="status-display" class="hud-chip status-chip">Tap start to boot the scanner.</span>
                </div>
                <div id="mute-btn" aria-label="Toggle sound">🔊</div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: mismatch + win feedback use catalogs/gifs.json -->
        <div id="fail-reaction" class="reaction-overlay reaction-overlay--top" aria-hidden="true">
            <img src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Confused reaction">
            <div class="reaction-caption">Signal Jam</div>
        </div>

        <div id="win-reaction" class="reaction-overlay" aria-hidden="true">
            <img src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp" alt="Celebration reaction">
            <div class="reaction-caption">Lab Hype</div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="screen-card">
                <div class="hero-badge" aria-hidden="true">🤖</div>
                <h1>Emoji Match Lab</h1>
                <p>Boot the scanner, flip two cards, and lock every matching signal pair.</p>
                <button class="btn" id="start-btn">Start Scan</button>
                <div class="accent-line" aria-hidden="true"></div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="screen-card">
                <div class="hero-badge" aria-hidden="true">🏆</div>
                <h1>Lab Complete!</h1>
                <p id="final-stats">Scans: 0</p>
                <button class="btn" id="restart-btn">Run Again</button>
                <div class="accent-line" aria-hidden="true"></div>
            </div>
        </div>
    </div>

    <script>
    const EMOJIS = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯'];
    const COLORS = {
        bg: '#09111f',
        cardBack: '#19345f',
        cardBackGlow: '#6ff5ff',
        cardFront: '#ff5f86',
        cardFrontAlt: '#8f7bff',
        text: '#ffffff',
        shadow: 'rgba(0, 0, 0, 0.28)'
    };

    const GRID_COLS = 4;
    const GRID_ROWS = 5;
    const CARD_GAP = 10;

    // [agent-note][stage3] resolved-audio: loop + ui + match/fail/win cues from catalogs/audios.json
    const AUDIO_TRACKS = {
        bgm: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
        flip: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
        match: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
        mismatch: 'https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3',
        win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3'
    };

    class AudioManager {
        constructor() {
            this.muted = false;
            this.enabled = false;
            this.bgm = null;
            this.sfx = {};
            this.lastPlayedAt = new Map();
            this.cooldowns = {
                flip: 70,
                match: 180,
                mismatch: 450,
                win: 800,
                start: 300
            };
            this.createAudioNodes();
        }

        createAudio(url, { loop = false, volume = 0.3 } = {}) {
            const audio = new Audio(url);
            audio.preload = 'auto';
            audio.loop = loop;
            audio.volume = volume;
            audio.playsInline = true;
            return audio;
        }

        createAudioNodes() {
            this.bgm = this.createAudio(AUDIO_TRACKS.bgm, { loop: true, volume: 0.18 });
            this.sfx.flip = this.createAudio(AUDIO_TRACKS.flip, { volume: 0.22 });
            this.sfx.match = this.createAudio(AUDIO_TRACKS.match, { volume: 0.28 });
            this.sfx.mismatch = this.createAudio(AUDIO_TRACKS.mismatch, { volume: 0.26 });
            this.sfx.win = this.createAudio(AUDIO_TRACKS.win, { volume: 0.36 });
            this.sfx.start = this.createAudio(AUDIO_TRACKS.start, { volume: 0.3 });
        }

        initFromGesture() {
            this.enabled = true;
            this.warmAudio(this.bgm);
            Object.values(this.sfx).forEach((sound) => this.warmAudio(sound));
        }

        warmAudio(audioEl) {
            try {
                audioEl.load();
            } catch (err) {
                // fail silently
            }
        }

        safePlay(audioEl, restart = false) {
            if (!this.enabled || this.muted || !audioEl) return;
            try {
                if (restart) {
                    audioEl.currentTime = 0;
                }
                const playPromise = audioEl.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            } catch (err) {
                // fail silently
            }
        }

        playSfx(name) {
            const audioEl = this.sfx[name];
            if (!audioEl) return;

            const now = performance.now();
            const cooldown = this.cooldowns[name] ?? 120;
            const lastAt = this.lastPlayedAt.get(name) ?? 0;
            if (now - lastAt < cooldown) return;
            this.lastPlayedAt.set(name, now);
            this.safePlay(audioEl, true);
        }

        startLoop() {
            if (!this.enabled || this.muted) return;
            this.safePlay(this.bgm, false);
        }

        stopLoop(reset = false) {
            if (!this.bgm) return;
            try {
                this.bgm.pause();
                if (reset) {
                    this.bgm.currentTime = 0;
                }
            } catch (err) {
                // fail silently
            }
        }

        setMuted(muted) {
            this.muted = muted;
            if (muted) {
                this.stopLoop(false);
            } else {
                this.startLoop();
            }
            return this.muted;
        }

        toggleMute() {
            return this.setMuted(!this.muted);
        }
    }

    const audio = new AudioManager();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const scoreDisplay = document.getElementById('score-display');
    const statusDisplay = document.getElementById('status-display');
    const finalStats = document.getElementById('final-stats');
    const failReaction = document.getElementById('fail-reaction');
    const winReaction = document.getElementById('win-reaction');

    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let isLocked = false;
    let lastTime = 0;
    let reactionTimer = null;
    let gameStarted = false;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function setStatus(text) {
        statusDisplay.textContent = text;
    }

    function showReaction(type) {
        clearTimeout(reactionTimer);
        failReaction.classList.remove('show');
        winReaction.classList.remove('show');

        const target = type === 'win' ? winReaction : failReaction;
        target.classList.add('show');

        reactionTimer = setTimeout(() => {
            target.classList.remove('show');
        }, type === 'win' ? 2400 : 1200);
    }

    class Card {
        constructor(emoji, gridIndex) {
            this.emoji = emoji;
            this.gridIndex = gridIndex;
            this.isMatched = false;
            this.isFlipped = false;
            this.scaleX = 1;
            this.animating = false;
            this.targetScale = 1;
            this.flipSpeed = 10;
        }

        getBounds() {
            const safeWidth = canvas.width - 40;
            const safeHeight = canvas.height - 100;
            const cellW = (safeWidth - (GRID_COLS - 1) * CARD_GAP) / GRID_COLS;
            const cellH = (safeHeight - (GRID_ROWS - 1) * CARD_GAP) / GRID_ROWS;
            const size = Math.min(cellW, cellH);
            const gridWidth = size * GRID_COLS + CARD_GAP * (GRID_COLS - 1);
            const gridHeight = size * GRID_ROWS + CARD_GAP * (GRID_ROWS - 1);
            const startX = (canvas.width - gridWidth) / 2;
            const startY = (canvas.height - gridHeight) / 2 + 30;
            const col = this.gridIndex % GRID_COLS;
            const row = Math.floor(this.gridIndex / GRID_COLS);

            return {
                x: startX + col * (size + CARD_GAP),
                y: startY + row * (size + CARD_GAP),
                w: size,
                h: size
            };
        }

        update(dt) {
            if (this.animating) {
                const diff = this.targetScale - this.scaleX;
                if (Math.abs(diff) < 0.05) {
                    this.scaleX = this.targetScale;
                    this.animating = false;
                    if (this.scaleX === 0) {
                        this.isFlipped = !this.isFlipped;
                        this.targetScale = 1;
                        this.animating = true;
                    }
                } else {
                    this.scaleX += Math.sign(diff) * this.flipSpeed * dt;
                }
            }
        }

        draw(ctx) {
            const b = this.getBounds();
            const centerX = b.x + b.w / 2;
            const centerY = b.y + b.h / 2;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(Math.abs(this.scaleX), 1);

            const radius = Math.max(12, b.w * 0.12);
            const isFaceUp = this.isFlipped || this.isMatched;

            ctx.shadowColor = isFaceUp ? 'rgba(255, 95, 134, 0.32)' : 'rgba(111, 245, 255, 0.24)';
            ctx.shadowBlur = b.w * 0.12;
            ctx.shadowOffsetY = b.h * 0.04;

            this.roundRect(ctx, -b.w / 2, -b.h / 2, b.w, b.h, radius);

            const fill = ctx.createLinearGradient(0, -b.h / 2, 0, b.h / 2);
            if (isFaceUp) {
                fill.addColorStop(0, COLORS.cardFrontAlt);
                fill.addColorStop(1, COLORS.cardFront);
            } else {
                fill.addColorStop(0, '#214577');
                fill.addColorStop(1, COLORS.cardBack);
            }

            ctx.fillStyle = fill;
            if (this.isMatched) ctx.globalAlpha = 0.72;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = 2;
            ctx.strokeStyle = isFaceUp ? 'rgba(255,255,255,0.28)' : 'rgba(111, 245, 255, 0.26)';
            ctx.stroke();

            ctx.save();
            ctx.globalAlpha = 0.16;
            this.roundRect(ctx, -b.w / 2 + 6, -b.h / 2 + 6, b.w - 12, b.h * 0.28, radius * 0.7);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();

            if (isFaceUp) {
                ctx.save();
                ctx.font = `${b.w * 0.58}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = 'rgba(7, 15, 26, 0.32)';
                ctx.lineWidth = 4;
                ctx.strokeText(this.emoji, 0, 6);
                ctx.fillText(this.emoji, 0, 6);
                ctx.restore();
            } else {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'rgba(111, 245, 255, 0.18)';
                ctx.lineWidth = Math.max(2, b.w * 0.025);

                const orbitR = b.w * 0.23;
                ctx.beginPath();
                ctx.arc(0, 0, orbitR, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-orbitR, 0);
                ctx.lineTo(orbitR, 0);
                ctx.moveTo(0, -orbitR);
                ctx.lineTo(0, orbitR);
                ctx.stroke();

                ctx.fillStyle = COLORS.cardBackGlow;
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(5, b.w * 0.045), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.restore();
        }

        roundRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        flip() {
            if (this.animating) return;
            this.targetScale = 0;
            this.animating = true;
            audio.playSfx('flip');
        }
    }

    function initGame() {
        cards = [];
        flippedCards = [];
        matchedPairs = 0;
        moves = 0;
        isLocked = false;
        scoreDisplay.innerText = 'Scans: 0';
        setStatus('Scanner online. Find every matching pair.');
        failReaction.classList.remove('show');
        winReaction.classList.remove('show');

        let deck = [...EMOJIS, ...EMOJIS];
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
            cards.push(new Card(deck[i], i));
        }
    }

    function checkMatch() {
        const [c1, c2] = flippedCards;

        if (c1.emoji === c2.emoji) {
            c1.isMatched = true;
            c2.isMatched = true;
            matchedPairs++;
            flippedCards = [];
            audio.playSfx('match');
            setStatus('Pair locked. Keep scanning.');
            if (matchedPairs === (GRID_COLS * GRID_ROWS) / 2) {
                setTimeout(gameWin, 500);
            }
        } else {
            isLocked = true;
            audio.playSfx('mismatch');
            setStatus('Signal mismatch. Recalibrating...');
            showReaction('fail');
            setTimeout(() => {
                c1.flip();
                c2.flip();
                flippedCards = [];
                isLocked = false;
                setStatus('Scanner online. Try a new pair.');
            }, 1000);
        }

        moves++;
        scoreDisplay.innerText = `Scans: ${moves}`;
    }

    function gameWin() {
        audio.playSfx('win');
        finalStats.innerText = `Total Scans: ${moves}`;
        setStatus('All pairs secured. Lab complete.');
        showReaction('win');
        gameoverScreen.classList.remove('hidden');
    }

    function handleInput(x, y) {
        if (isLocked || !gameStarted) return;

        for (const card of cards) {
            if (card.isMatched || card.isFlipped) continue;

            const b = card.getBounds();
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                card.flip();
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    checkMatch();
                }
                break;
            }
        }
    }

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        handleInput(e.clientX - rect.left, e.clientY - rect.top);
    });

    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const muteBtn = document.getElementById('mute-btn');

    startBtn.addEventListener('click', () => {
        audio.initFromGesture();
        audio.playSfx('start');
        audio.startLoop();
        startScreen.classList.add('hidden');
        gameStarted = true;
        initGame();
    });

    restartBtn.addEventListener('click', () => {
        audio.initFromGesture();
        audio.playSfx('start');
        audio.startLoop();
        gameoverScreen.classList.add('hidden');
        gameStarted = true;
        initGame();
    });

    muteBtn.addEventListener('click', () => {
        const isMuted = audio.toggleMute();
        muteBtn.innerText = isMuted ? '🔇' : '🔊';
        setStatus(isMuted ? 'Audio muted.' : 'Audio restored.');
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.stopLoop(false);
        } else if (gameStarted && !audio.muted) {
            audio.startLoop();
        }
    });

    function loop(timestamp) {
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (isNaN(dt)) dt = 0;

        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        cards.forEach(card => {
            card.update(dt);
            card.draw(ctx);
        });

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
    </script>
</body>
</html>
