<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Detention Breakout: The Escape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-deep: #030914;
            --panel: rgba(10, 19, 35, 0.9);
            --panel-strong: rgba(17, 31, 54, 0.95);
            --line: rgba(113, 228, 255, 0.24);
            --cyan: #71e4ff;
            --cyan-strong: #1ec8ff;
            --mint: #54f5b3;
            --gold: #ffd166;
            --danger: #ff667c;
            --danger-strong: #ff324d;
            --ink: #02060d;
            --text: #eef8ff;
            --muted: #b2c3dc;
            --shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(30, 200, 255, 0.16), transparent 30%),
                linear-gradient(180deg, #0b1424 0%, var(--bg) 45%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.025) 0 2px,
                    transparent 2px 6px
                );
            mix-blend-mode: soft-light;
            opacity: 0.24;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(84, 245, 179, 0.12), transparent 18%),
                radial-gradient(circle at 82% 10%, rgba(255, 209, 102, 0.14), transparent 20%),
                radial-gradient(circle at 50% 100%, rgba(30, 200, 255, 0.14), transparent 35%);
        }

        #game-container::after {
            background:
                linear-gradient(90deg, transparent 0%, rgba(113, 228, 255, 0.06) 49%, transparent 50%, transparent 100%),
                linear-gradient(0deg, transparent 0%, rgba(113, 228, 255, 0.05) 49%, transparent 50%, transparent 100%);
            background-size: 88px 88px;
            opacity: 0.18;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        .glass {
            position: relative;
            background: linear-gradient(180deg, rgba(12, 21, 39, 0.94), rgba(7, 12, 25, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .glass::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 26%, transparent 70%, rgba(30, 200, 255, 0.07));
        }

        .menu-card {
            pointer-events: auto;
            text-align: center;
            width: min(92vw, 430px);
            padding: 24px 20px 22px;
            border-radius: 24px;
            border-top: 4px solid var(--cyan);
        }

        .menu-card.lose {
            border-top-color: var(--danger);
        }

        .menu-card.win {
            border-top-color: var(--mint);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(113, 228, 255, 0.28);
            background: rgba(113, 228, 255, 0.08);
            font-size: 1rem;
            line-height: 1;
            letter-spacing: 0.14em;
            color: var(--cyan);
            text-transform: uppercase;
        }

        .hero-title,
        .result-title {
            margin: 0;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 0.88;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(30, 200, 255, 0.24);
        }

        .hero-title {
            font-size: clamp(2.8rem, 11vw, 4.8rem);
        }

        .hero-title .accent {
            color: var(--cyan);
        }

        .hero-title .sub {
            color: var(--text);
        }

        .hero-tagline,
        .result-message {
            margin: 10px 0 0;
            font-size: clamp(1rem, 4.5vw, 1.35rem);
            line-height: 1.1;
            color: var(--muted);
            letter-spacing: 0.03em;
        }

        .character-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 18px 0;
            font-size: clamp(1.8rem, 9vw, 2.8rem);
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.35));
        }

        .character-chip {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, rgba(113, 228, 255, 0.2), rgba(113, 228, 255, 0.06));
            border: 1px solid rgba(113, 228, 255, 0.24);
            box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.18);
        }

        .character-chip.guard {
            background: linear-gradient(180deg, rgba(255, 102, 124, 0.18), rgba(255, 102, 124, 0.06));
            border-color: rgba(255, 102, 124, 0.28);
        }

        .character-chip.goal {
            background: linear-gradient(180deg, rgba(84, 245, 179, 0.2), rgba(84, 245, 179, 0.06));
            border-color: rgba(84, 245, 179, 0.28);
        }

        .arcade-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            min-height: 52px;
            margin-top: 18px;
            padding: 14px 28px 12px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(180deg, #84f0ff 0%, var(--cyan-strong) 100%);
            color: var(--ink);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1.2rem, 5vw, 1.55rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            box-shadow: 0 0 0 3px rgba(113, 228, 255, 0.12), 0 10px 24px rgba(30, 200, 255, 0.32);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .arcade-btn:hover,
        .arcade-btn:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.04);
            box-shadow: 0 0 0 3px rgba(113, 228, 255, 0.18), 0 12px 28px rgba(30, 200, 255, 0.42);
            outline: none;
        }

        .arcade-btn:active,
        .arcade-btn.is-pressed {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .arcade-btn.restart {
            background: linear-gradient(180deg, #ffffff 0%, #d8e4f5 100%);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1), 0 10px 22px rgba(0, 0, 0, 0.26);
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
        }

        .hud-card {
            min-width: 0;
            max-width: min(48vw, 260px);
            padding: 10px 12px 8px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(7, 15, 28, 0.88), rgba(4, 10, 20, 0.92));
            border: 1px solid rgba(113, 228, 255, 0.24);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.26);
        }

        .hud-card.right {
            border-color: rgba(255, 209, 102, 0.24);
        }

        .hud-label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.82rem;
            line-height: 1;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(238, 248, 255, 0.72);
        }

        .hud-value {
            display: block;
            text-shadow: 2px 2px 0 #000;
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(1.1rem, 4.6vw, 1.75rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .hud-value.stage {
            color: var(--cyan);
        }

        #tutorial {
            position: absolute;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: calc(100% - 24px);
            display: flex;
            justify-content: center;
            pointer-events: none;
            animation: pulseGlow 1.6s ease-in-out infinite;
        }

        #tutorial-text {
            max-width: min(92vw, 420px);
            margin: 0;
            padding: 10px 14px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 209, 102, 0.36);
            background: rgba(2, 6, 13, 0.75);
            color: var(--gold);
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(1rem, 4.2vw, 1.35rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.08em;
            text-align: center;
            text-transform: uppercase;
            transform: translateX(-50%);
            box-shadow: 0 0 18px rgba(255, 209, 102, 0.16);
        }

        .result-title {
            font-size: clamp(2.8rem, 11vw, 4.4rem);
            margin-top: 4px;
        }

        .result-title.lose {
            color: var(--danger);
            text-shadow: 0 0 20px rgba(255, 50, 77, 0.3);
        }

        .result-title.win {
            color: var(--cyan);
            text-shadow: 0 0 20px rgba(30, 200, 255, 0.3);
        }

        #feedback-strip {
            position: absolute;
            left: 50%;
            top: calc(78px + env(safe-area-inset-top));
            transform: translateX(-50%);
            z-index: 55;
            width: min(78vw, 320px);
            min-height: 54px;
            padding: 8px 10px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(113, 228, 255, 0.24);
            background: rgba(3, 9, 20, 0.76);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        #feedback-strip.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .feedback-gif {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(113, 228, 255, 0.18);
            background: rgba(7, 17, 31, 0.85);
            flex: 0 0 auto;
        }

        #feedback-label {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.72rem, 3vw, 0.94rem);
            line-height: 1.15;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            text-align: left;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: translateY(0); opacity: 0.82; }
            50% { transform: translateY(-2px); opacity: 1; }
        }

        @media (max-width: 640px) {
            .menu-card {
                padding: 20px 16px 18px;
                border-radius: 22px;
            }

            .character-chip {
                width: 52px;
                height: 52px;
                border-radius: 16px;
            }

            .arcade-btn {
                min-width: 160px;
                width: min(100%, 260px);
            }

            .hud-card {
                max-width: 46vw;
                padding: 9px 10px 7px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<script>
/** 
 * §4 Iron Laws & Architecture 
 */
 
// --- CONFIGURATION ---
window.gameConfigDefs = {
    "playerSpeed": { "type": "number", "label": "Sneak Speed", "value": 180, "min": 100, "max": 400 },
    "bossHp": { "type": "number", "label": "Principal HP", "value": 20, "min": 5, "max": 100 },
    "trafficDensity": { "type": "number", "label": "Traffic Difficulty", "value": 1.5, "min": 0.5, "max": 3.0 }
};
window.gameConfig = {};
// Hydrate config
for (let key in window.gameConfigDefs) {
    window.gameConfig[key] = window.gameConfigDefs[key].value;
}
window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if (key === 'bossHp' && gameState === 'BOSS' && boss) {
            boss.maxHp = val;
            boss.hp = val;
        }
    }
};

// --- AUDIO MANAGER ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNodes = {};
        this.currentBgm = null;
        this.unlocked = false;
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.unlock();
    }

    unlock() {
        if (this.unlocked) return;
        const unlockHandler = () => {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            this.unlocked = true;
            ['bgm_stealth', 'bgm_boss', 'bgm_drive'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.volume = 0.2;
                    el.play().then(() => el.pause()).catch(() => {});
                }
            });
            window.removeEventListener('pointerdown', unlockHandler);
            window.removeEventListener('keydown', unlockHandler);
        };
        window.addEventListener('pointerdown', unlockHandler);
        window.addEventListener('keydown', unlockHandler);
    }

    playBgm(id) {
        if (this.currentBgm === id) return;
        
        // Stop current
        if (this.currentBgm) {
            const el = document.getElementById(this.currentBgm);
            if (el) {
                // fade out logic could go here
                el.pause();
                el.currentTime = 0;
            }
        }

        // Play new
        this.currentBgm = id;
        const el = document.getElementById(id);
        if (el) {
            if (id.startsWith('bgm_')) {
                el.volume = 0.2;
            }
            el.currentTime = 0;
            el.play().catch(e => console.log("Audio play failed", e));
        }
    }

    playSfx(id) {
        if (!this.unlocked) return;
        const el = document.getElementById(id);
        if (el) {
            el.currentTime = 0;
            el.play().catch(() => this.synthesizeFallback());
        } else {
            this.synthesizeFallback();
        }
    }

    stopAllBgm() {
        ['bgm_stealth', 'bgm_boss', 'bgm_drive', 'bgm_win', 'bgm_lose'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.pause();
                el.currentTime = 0;
            }
        });
        this.currentBgm = null;
    }

    synthesizeFallback() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }
}

const audio = new AudioManager();
const feedback = {
    timer: null,
    root: null,
    gif: null,
    label: null,
    gifs: {
        alert: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp',
        win: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
    }
};
const ENABLE_ANIMATIONS = true;

// --- GAME STATE ---
let canvas, ctx;
let lastTime = 0;
let gameState = 'MENU'; // MENU, STEALTH, LOCKPICK, BOSS, DRIVING, WIN, GAMEOVER
let input = { x: 0, y: 0, active: false, tapped: false };
let particles = [];
let shake = 0;

// Entities
let player = { x: 0, y: 0, w: 30, h: 30, hp: 100, maxHp: 100 };
let enemies = []; // Teachers
let boss = null;
let bullets = [];
let lock = { angle: 0, target: 0, speed: 2, level: 0 };
let car = { x: 0, y: 0, speed: 0 };
let roadObstacles = [];
let score = 0;
let stageTime = 0;

// --- INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    feedback.root = document.getElementById('feedback-strip');
    feedback.gif = document.getElementById('feedback-gif');
    feedback.label = document.getElementById('feedback-label');
    
    // Resize Handler
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // Input Binding
    const onPointerDown = (e) => {
        e.preventDefault();
        input.active = true;
        input.tapped = true;
        const rect = canvas.getBoundingClientRect();
        input.x = e.clientX - rect.left;
        input.y = e.clientY - rect.top;
        audio.init();
    };
    const onPointerMove = (e) => {
        e.preventDefault();
        if (input.active) {
            const rect = canvas.getBoundingClientRect();
            input.x = e.clientX - rect.left;
            input.y = e.clientY - rect.top;
        }
    };
    const onPointerUp = (e) => {
        e.preventDefault();
        input.active = false;
    };

    canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
    canvas.addEventListener('pointermove', onPointerMove, { passive: false });
    canvas.addEventListener('pointerup', onPointerUp, { passive: false });
    canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

    // UI Bindings
    document.getElementById('start-btn').addEventListener('click', () => {
        audio.init();
        audio.playSfx('sfx_start', 0);
        startGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.init();
        audio.playSfx('sfx_ui', 0);
        startGame();
    });

    document.querySelectorAll('.arcade-btn').forEach(button => {
        button.addEventListener('pointerdown', () => {
            if (ENABLE_ANIMATIONS) button.classList.add('is-pressed');
        });
        const release = () => button.classList.remove('is-pressed');
        button.addEventListener('pointerup', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('pointercancel', release);
    });

    // Loop Start
    requestAnimationFrame(gameLoop);
});

function showFeedback(message, tone = 'alert') {
    if (!feedback.root || !feedback.label) return;
    const gifUrl = feedback.gifs[tone];
    feedback.label.textContent = message;
    feedback.root.classList.remove('hidden');
    feedback.root.classList.add('active');
    if (gifUrl && feedback.gif) {
        feedback.gif.src = gifUrl;
        feedback.gif.alt = message;
        feedback.gif.classList.remove('hidden');
    } else if (feedback.gif) {
        feedback.gif.classList.add('hidden');
        feedback.gif.removeAttribute('src');
    }
    clearTimeout(feedback.timer);
    feedback.timer = setTimeout(() => {
        feedback.root.classList.remove('active');
        feedback.root.classList.add('hidden');
    }, 1800);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('tutorial').classList.remove('hidden');
    
    score = 0;
    startStealthStage();
}

function gameOver(win) {
    gameState = win ? 'WIN' : 'GAMEOVER';
    audio.stopAllBgm();
    const title = document.getElementById('go-title');
    const msg = document.getElementById('go-msg');
    const screen = document.getElementById('game-over-screen');
    
    if (win) {
        audio.playSfx('sfx_win', 0);
        audio.playBgm('bgm_win');
        showFeedback('Escape route clear!', 'win');
        title.innerText = "Escaped!";
        title.className = "result-title win";
        screen.className = "glass menu-card win";
        msg.innerText = "You are free! Score: " + Math.floor(score);
    } else {
        title.innerText = "Busted";
        title.className = "result-title lose";
        screen.className = "glass menu-card lose";
        msg.innerText = "Back to detention for you.";
    }
    
    screen.classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('tutorial').classList.add('hidden');
}

// --- STAGE SETUP ---

function startStealthStage() {
    gameState = 'STEALTH';
    audio.playBgm('bgm_stealth');
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight - 50;
    
    enemies = [];
    const rows = 4;
    for(let i=0; i<rows; i++) {
        enemies.push({
            y: 150 + i * 120,
            x: Math.random() * window.innerWidth,
            speed: (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 100),
            w: 40, h: 40,
            viewAngle: 0
        });
    }
    
    updateHud("STAGE 1: HALLWAY", "Reach the Office");
    showTutorial("HOLD TO SNEAK - AVOID TEACHERS");
    showFeedback("Stay low and dodge patrols", "alert");
}

function startLockpickStage() {
    gameState = 'LOCKPICK';
    lock.level = 0;
    resetLock();
    updateHud("STAGE 2: OFFICE", "Pick the Lock (3 Left)");
    showTutorial("TAP WHEN GREEN");
    showFeedback("Lock sequence unlocked", "win");
}

function resetLock() {
    lock.angle = 0;
    lock.target = Math.random() * Math.PI * 1.5 + 0.5; // Random position
    lock.speed = 2 + lock.level * 1.5;
    lock.width = 0.5 - (lock.level * 0.1); // Gets narrower
}

function startBossStage() {
    gameState = 'BOSS';
    audio.playBgm('bgm_boss');
    player.x = window.innerWidth / 2;
    player.y = window.innerHeight - 100;
    player.hp = 100;
    
    boss = {
        x: window.innerWidth / 2,
        y: 100,
        w: 80, h: 80,
        hp: window.gameConfig.bossHp,
        maxHp: window.gameConfig.bossHp,
        phase: 0,
        timer: 0
    };
    bullets = [];
    
    updateHud("STAGE 3: BOSS", "Defeat Principal");
    showTutorial("TAP TO SHOOT - DODGE CHALK");
    showFeedback("Boss room meltdown!", "alert");
}

function startDrivingStage() {
    gameState = 'DRIVING';
    audio.playBgm('bgm_drive');
    car.x = window.innerWidth / 2;
    car.y = window.innerHeight - 100;
    roadObstacles = [];
    stageTime = 0;
    
    updateHud("STAGE 4: ESCAPE", "Drive Away!");
    showTutorial("STEER TO AVOID TRAFFIC");
    showFeedback("Car hotwired — floor it!", "win");
}

function updateHud(stage, info) {
    document.getElementById('stage-ind').innerText = stage;
    document.getElementById('hud-info').innerText = info;
}

function showTutorial(text) {
    const el = document.getElementById('tutorial-text');
    el.innerText = text;
    // Hide after 3s
    setTimeout(() => {
        // Only hide if state hasn't changed drastically or something? 
        // Actually just keep it simple
    }, 3000);
}

// --- MAIN LOOP ---

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    update(dt);
    draw();
    
    input.tapped = false; // Reset tap frame
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (gameState === 'MENU' || gameState === 'GAMEOVER' || gameState === 'WIN') return;

    // Screenshake decay
    if (shake > 0) shake = Math.max(0, shake - dt * 20);

    // --- STEALTH LOGIC ---
    if (gameState === 'STEALTH') {
        // Player Move
        if (input.active) {
            const dx = input.x - player.x;
            const dy = input.y - player.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 5) {
                const move = window.gameConfig.playerSpeed * dt;
                player.x += (dx / dist) * move;
                player.y += (dy / dist) * move;
            }
        }
        
        // Enemy Logic
        enemies.forEach(e => {
            e.x += e.speed * dt;
            if (e.x < 0 || e.x > window.innerWidth) e.speed *= -1;
            
            // Vision Cone / Collision
            // Simple box collision for "Caught"
            const dist = Math.hypot(player.x - e.x, player.y - e.y);
            if (dist < 40) {
                audio.playSfx('sfx_hit');
                showFeedback('Caught by patrol!', 'alert');
                gameOver(false);
            }
        });
        
        // Win Condition
        if (player.y < 50) {
            audio.playSfx('sfx_unlock');
            showFeedback('Office lock cracked!', 'win');
            startLockpickStage();
        }
    }

    // --- LOCKPICK LOGIC ---
    else if (gameState === 'LOCKPICK') {
        lock.angle += lock.speed * dt;
        if (lock.angle > Math.PI * 2) lock.angle -= Math.PI * 2;
        
        if (input.tapped) {
            // Check hit
            const diff = Math.abs(lock.angle - lock.target);
            if (diff < lock.width || Math.abs(diff - Math.PI*2) < lock.width) {
                // Success
                lock.level++;
                createParticles(window.innerWidth/2, window.innerHeight/2, '#22d3ee', 20);
                audio.playSfx('sfx_unlock');
                showFeedback(lock.level >= 2 ? 'Office breach complete!' : 'Tumbler locked in!', 'win');
                if (lock.level >= 3) {
                    startBossStage();
                } else {
                    resetLock();
                    updateHud("STAGE 2: OFFICE", `Pick the Lock (${3 - lock.level} Left)`);
                }
            } else {
                // Fail
                shake = 10;
                audio.playSfx('sfx_fail');
                showFeedback('Bad tap — try again!', 'alert');
                lock.speed *= 1.2; // Punishment: faster
            }
        }
    }

    // --- BOSS LOGIC ---
    else if (gameState === 'BOSS') {
        // Player Move
        if (input.active) {
            const dx = input.x - player.x;
            const dy = input.y - player.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 5) {
                player.x += (dx/dist) * 300 * dt;
                player.y += (dy/dist) * 300 * dt;
            }
        }
        
        // Shoot
        if (input.tapped) {
            bullets.push({ x: player.x, y: player.y, vx: 0, vy: -600, type: 'player' });
            audio.playSfx('sfx_shoot', 55);
            // Recoil
            player.y += 5;
        }
        
        // Boss AI
        boss.timer += dt;
        boss.x = window.innerWidth/2 + Math.sin(boss.timer) * (window.innerWidth/2 - 50);
        
        // Boss Shoot
        if (Math.random() < 0.05) {
            bullets.push({ x: boss.x, y: boss.y + 40, vx: (Math.random()-0.5)*200, vy: 300, type: 'enemy' });
        }
        
        // Bullets Update
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            
            // Bounds
            if (b.y < 0 || b.y > window.innerHeight) {
                bullets.splice(i, 1);
                continue;
            }
            
            // Collisions
            if (b.type === 'player') {
                // Hit Boss
                if (Math.hypot(b.x - boss.x, b.y - boss.y) < 50) {
                    boss.hp--;
                    audio.playSfx('sfx_boss_hit', 45);
                    createParticles(b.x, b.y, '#ef4444', 5);
                    bullets.splice(i, 1);
                    if (boss.hp <= 0) {
                        createParticles(boss.x, boss.y, '#ef4444', 100);
                        shake = 20;
                        audio.playSfx('sfx_win', 0);
                        showFeedback('Principal stunned!', 'win');
                        startDrivingStage();
                    }
                }
            } else {
                // Hit Player
                if (Math.hypot(b.x - player.x, b.y - player.y) < 20) {
                    player.hp -= 10;
                    shake = 5;
                    createParticles(player.x, player.y, '#ffffff', 5);
                    audio.playSfx('sfx_hit');
                    showFeedback('Direct hit!', 'alert');
                    bullets.splice(i, 1);
                    if (player.hp <= 0) gameOver(false);
                }
            }
        }
    }

    // --- DRIVING LOGIC ---
    else if (gameState === 'DRIVING') {
        stageTime += dt;
        score += dt * 100;
        
        // Car Control
        if (input.active) {
            // Lerp towards x
            car.x += (input.x - car.x) * 5 * dt;
        }
        // Clamp
        car.x = Math.max(40, Math.min(window.innerWidth - 40, car.x));
        
        // Spawn Obstacles
        if (Math.random() < 0.02 * window.gameConfig.trafficDensity) {
            roadObstacles.push({
                x: Math.random() * (window.innerWidth - 60) + 30,
                y: -50,
                type: Math.random() > 0.5 ? 'bus' : 'cone'
            });
        }
        
        // Update Obstacles
        for (let i = roadObstacles.length - 1; i >= 0; i--) {
            let o = roadObstacles[i];
            o.y += 500 * dt; // Speed
            
            if (o.y > window.innerHeight + 50) {
                roadObstacles.splice(i, 1);
                continue;
            }
            
            // Collision
            if (Math.hypot(o.x - car.x, o.y - car.y) < 40) {
                shake = 20;
                audio.playSfx('sfx_hit');
                showFeedback('Caught by patrol!', 'alert');
                gameOver(false);
            }
        }
        
        // Win Condition (Survive 20s)
        if (stageTime > 20) {
            gameOver(true);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Clear & Shake
    ctx.save();
    drawBackground();
    
    if (shake > 0) {
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
    }

    if (gameState === 'STEALTH') drawStealth();
    else if (gameState === 'LOCKPICK') drawLockpick();
    else if (gameState === 'BOSS') drawBoss();
    else if (gameState === 'DRIVING') drawDriving();
    
    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.c;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    ctx.restore();
}

function drawBackground() {
    const bg = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    bg.addColorStop(0, '#0d1a2f');
    bg.addColorStop(0.55, '#08111f');
    bg.addColorStop(1, '#030914');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.save();
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < window.innerWidth; i += 48) {
        ctx.strokeStyle = i % 96 === 0 ? '#71e4ff' : '#1b3251';
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, window.innerHeight);
        ctx.stroke();
    }
    for (let i = 0; i < window.innerHeight; i += 48) {
        ctx.strokeStyle = i % 96 === 0 ? '#14304e' : '#0b1f35';
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(window.innerWidth, i);
        ctx.stroke();
    }
    ctx.restore();
}

function drawTeacher(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#14243a';
    ctx.beginPath();
    ctx.roundRect(-18, -16, 36, 34, 12);
    ctx.fill();

    ctx.fillStyle = '#ff667c';
    ctx.beginPath();
    ctx.roundRect(-15, -12, 30, 28, 10);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-5, -3, 3.5, 0, Math.PI * 2);
    ctx.arc(5, -3, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#04101c';
    ctx.beginPath();
    ctx.arc(-5, -2, 1.4, 0, Math.PI * 2);
    ctx.arc(5, -2, 1.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-9, 8);
    ctx.quadraticCurveTo(0, 13, 9, 8);
    ctx.stroke();

    ctx.fillStyle = '#f6c387';
    ctx.beginPath();
    ctx.arc(0, -1, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#263b5f';
    ctx.beginPath();
    ctx.moveTo(-14, 16);
    ctx.lineTo(14, 16);
    ctx.lineTo(8, 26);
    ctx.lineTo(-8, 26);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

    ctx.fill();

    ctx.fillStyle = '#6fe7ff';

    ctx.roundRect(-17, -14, 34, 32, 11);
    ctx.fill();

    ctx.fillStyle = '#ffd8a8';
    ctx.beginPath();
    ctx.arc(0, -2, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#09131f';
    ctx.beginPath();
    ctx.arc(-4, -2, 1.5, 0, Math.PI * 2);
    ctx.arc(4, -2, 1.5, 0, Math.PI * 2);

    ctx.lineTo(8, -17);
    ctx.lineTo(-17, -13);

    ctx.fillStyle = '#08111f';

}

    ctx.beginPath();
    ctx.arc(0, -4, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1b0a10';
    ctx.beginPath();
    ctx.arc(-7, -6, 3.2, 0, Math.PI * 2);

function drawObstacle(type, x, y) {
    ctx.save();
    ctx.translate(x, y);

    if (type === 'bus') {
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.roundRect(-24, -16, 48, 32, 8);
        ctx.fill();
        ctx.fillStyle = '#0d1a2f';
        ctx.fillRect(-16, -10, 10, 8);
        ctx.fillRect(-2, -10, 10, 8);
        ctx.fillRect(12, -10, 8, 8);
        ctx.fillStyle = '#08111f';
        ctx.fillRect(-16, 12, 10, 5);
        ctx.fillRect(6, 12, 10, 5);
    } else {
        ctx.fillStyle = '#ff8b4a';
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(14, 18);
        ctx.lineTo(-14, 18);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff1d0';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-5, 4);
        ctx.lineTo(5, 4);
        ctx.moveTo(-3, -4);
        ctx.lineTo(3, -4);
        ctx.stroke();
    }

    ctx.restore();
}

function drawStealth() {
    // Floor grid
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    for(let i=0; i<window.innerHeight; i+=50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(window.innerWidth, i); ctx.stroke();
    }

    // Goal
    const goalGradient = ctx.createLinearGradient(0, 0, 0, 50);
    goalGradient.addColorStop(0, '#54f5b3');
    goalGradient.addColorStop(1, '#198f64');
    ctx.fillStyle = goalGradient;
    ctx.fillRect(0, 0, window.innerWidth, 50);
    ctx.fillStyle = '#03111b';
     ctx.font = '700 24px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText("PRINCIPAL'S OFFICE", window.innerWidth/2, 33);

    // Enemies
    enemies.forEach(e => {
        // Vision Cone
        ctx.save();
        ctx.translate(e.x, e.y);
        const coneGradient = ctx.createLinearGradient(0, 0, 0, 100);
        coneGradient.addColorStop(0, 'rgba(255, 209, 102, 0.28)');
        coneGradient.addColorStop(1, 'rgba(255, 209, 102, 0.03)');
        ctx.fillStyle = coneGradient;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-40, 100);
        ctx.lineTo(40, 100);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        drawTeacher(e.x, e.y);
    });

    // Player
    drawHero(player.x, player.y);
}

function drawLockpick() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const r = 100;

    // Background Circle
    ctx.strokeStyle = '#24384f';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();

    // Outer ring glow
    ctx.strokeStyle = 'rgba(113, 228, 255, 0.18)';
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();

    // Target Zone
    ctx.strokeStyle = '#54f5b3';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.arc(cx, cy, r, lock.target - lock.width, lock.target + lock.width);
    ctx.stroke();

    // Cursor
    ctx.fillStyle = '#eef8ff';
    const px = cx + Math.cos(lock.angle) * r;
    const py = cy + Math.sin(lock.angle) * r;
    ctx.beginPath();
    ctx.arc(px, py, 15, 0, Math.PI*2);
    ctx.fill();
    
    // Center core
    const core = ctx.createRadialGradient(cx, cy, 6, cx, cy, 70);
    core.addColorStop(0, '#163353');
    core.addColorStop(1, '#08111f');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, 62, 0, Math.PI * 2);
    ctx.fill();

    // Center Text
    ctx.fillStyle = '#71e4ff';
    ctx.font = '700 36px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText("TAP!", cx, cy + 12);
}

function drawBoss() {
    // Arena accents
    const arenaGlow = ctx.createRadialGradient(window.innerWidth / 2, 120, 20, window.innerWidth / 2, 120, 220);
    arenaGlow.addColorStop(0, 'rgba(255, 102, 124, 0.18)');
    arenaGlow.addColorStop(1, 'rgba(255, 102, 124, 0)');
    ctx.fillStyle = arenaGlow;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // Boss
    const shakeX = Math.random() * (boss.maxHp - boss.hp); // Shake as damaged
    drawBossCharacter(boss.x, boss.y, shakeX);
    
    // Boss HP Bar
    ctx.fillStyle = '#24384f';
    ctx.fillRect(boss.x - 56, boss.y - 72, 112, 12);
    const hpGradient = ctx.createLinearGradient(boss.x - 56, boss.y - 72, boss.x + 56, boss.y - 72);
    hpGradient.addColorStop(0, '#ff667c');
    hpGradient.addColorStop(1, '#ff324d');
    ctx.fillStyle = hpGradient;
    ctx.fillRect(boss.x - 56, boss.y - 72, 112 * (boss.hp / boss.maxHp), 12);

    // Player
    drawHero(player.x, player.y);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(player.x - 4, player.y - 24, 8, 12);
    
    // Bullets
    bullets.forEach(b => {
        ctx.fillStyle = b.type === 'player' ? '#22d3ee' : '#fbbf24';
        ctx.shadowColor = b.type === 'player' ? 'rgba(34, 211, 238, 0.45)' : 'rgba(251, 191, 36, 0.45)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

function drawDriving() {
    // Road
    const roadGradient = ctx.createLinearGradient(20, 0, window.innerWidth - 20, 0);
    roadGradient.addColorStop(0, '#1b2432');
    roadGradient.addColorStop(0.5, '#2f3f54');
    roadGradient.addColorStop(1, '#1b2432');
    ctx.fillStyle = roadGradient;
    ctx.fillRect(20, 0, window.innerWidth - 40, window.innerHeight);

    ctx.fillStyle = 'rgba(84, 245, 179, 0.08)';
    ctx.fillRect(24, 0, 10, window.innerHeight);
    ctx.fillRect(window.innerWidth - 34, 0, 10, window.innerHeight);
    
    // Moving lines
    ctx.strokeStyle = '#eef8ff';
    ctx.setLineDash([40, 40]);
    ctx.lineDashOffset = -Date.now() / 2;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(window.innerWidth/2, 0);
    ctx.lineTo(window.innerWidth/2, window.innerHeight);
    ctx.stroke();
    ctx.setLineDash([]);

    // Car
    drawCarCharacter(car.x, car.y);

    // Obstacles
    roadObstacles.forEach(o => {
        drawObstacle(o.type, o.x, o.y);
    });
    
    // Progress
    ctx.fillStyle = '#eef8ff';
    ctx.font = '700 24px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText("ESCAPE: " + Math.floor(stageTime/20 * 100) + "%", window.innerWidth/2, 50);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300,
            life: 1.0,
            c: color,
            s: Math.random() * 5 + 2
        });
    }
}

</script>
