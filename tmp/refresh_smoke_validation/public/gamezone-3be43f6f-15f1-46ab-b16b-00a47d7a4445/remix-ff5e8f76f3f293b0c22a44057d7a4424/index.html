<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode 3: The Break</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070d;
      --panel: rgba(10, 14, 24, 0.7);
      --panel-strong: rgba(18, 24, 38, 0.92);
      --line: rgba(130, 228, 255, 0.34);
      --line-strong: rgba(149, 238, 255, 0.72);
      --text: #f6fbff;
      --text-muted: rgba(226, 241, 255, 0.72);
      --accent: #74f0ff;
      --accent-strong: #c88cff;
      --danger: #ff6b93;
      --shadow: 0 16px 38px rgba(0, 0, 0, 0.38);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: radial-gradient(circle at top, #15203a 0%, var(--bg) 48%, #020308 100%); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background:
      radial-gradient(circle at 18% 24%, rgba(200,140,255,0.16), transparent 24%),
      radial-gradient(circle at 82% 18%, rgba(116,240,255,0.16), transparent 20%),
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent 32%);
      pointer-events: none; z-index: 1; }
    body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 24px 24px; mix-blend-mode: screen; opacity: 0.16; pointer-events: none; z-index: 1; }
    #videoContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000000; display: flex; align-items: center; justify-content: center; isolation: isolate; }
    #videoContainer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 11, 18, 0.24) 0%, transparent 28%, transparent 72%, rgba(3, 5, 10, 0.48) 100%); pointer-events: none; z-index: 1; }
    #V { width: 100%; height: 100%; object-fit: contain; background: #000000; position: relative; z-index: 0; }
    #playGate { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background:
      linear-gradient(180deg, rgba(7,10,19,0.34) 0%, rgba(4,6,14,0.12) 28%, rgba(5,7,14,0.38) 58%, rgba(1,2,6,0.92) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 10%; z-index: 100; cursor: pointer; transition: opacity 0.3s ease; overflow: hidden; }
    #playGate::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('vn3_scenes/poster.jpg') center/cover no-repeat; z-index: -2; transform: scale(1.02); filter: saturate(1.1) contrast(1.06); }
    #playGate::after { content: ''; position: absolute; inset: 0; background:
      radial-gradient(circle at center, transparent 0 22%, rgba(116,240,255,0.08) 32%, transparent 46%),
      linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 48%, transparent 100%);
      opacity: 0.75; z-index: -1; }
    #playGate.hidden { pointer-events: none; opacity: 0; }
    .playGate-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(4, 9, 18, 0.62); box-shadow: var(--shadow); font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .playGate-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700; text-align: center; line-height: 0.95; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; text-shadow: 0 0 18px rgba(116,240,255,0.25); }
    .playGate-subtitle { max-width: 22rem; font-size: clamp(0.95rem, 3vw, 1.1rem); font-weight: 600; text-align: center; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 1.4rem; }
    .playGate-ring { position: relative; width: 88px; height: 88px; margin-bottom: 1.3rem; animation: pulse 2s infinite; filter: drop-shadow(0 0 18px rgba(116,240,255,0.18)); }
    .playGate-ring::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 76px; height: 76px; border: 2px solid var(--line-strong); border-radius: 50%; box-shadow: inset 0 0 18px rgba(200,140,255,0.16), 0 0 22px rgba(116,240,255,0.16); }
    .playGate-ring::after { content: '\25B6'; position: absolute; top: 50%; left: 54%; transform: translate(-50%,-50%); font-size: 1.6rem; color: rgba(255,255,255,0.92); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.72; transform: scale(0.97); } }
    .playGate-tap { font-family: 'Orbitron', sans-serif; font-size: 0.82rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.9; animation: pulse 2s infinite; color: var(--text); }
    #pauseBtn { position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: rgba(10,14,24,0.62); backdrop-filter: blur(10px); color: var(--text); cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease, border-color 0.2s ease; z-index: 50; opacity: 0; pointer-events: none; box-shadow: var(--shadow); }
    #pauseBtn.visible { opacity: 0.82; pointer-events: auto; }
    #pauseBtn:hover { background: rgba(18,24,38,0.92); border-color: var(--line-strong); opacity: 0.98; }
    #pauseBtn:active { transform: scale(0.95); }
    #progressBar { position: absolute; bottom: 82px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; background: rgba(8, 11, 19, 0.52); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    #progressBar.visible { opacity: 1; }
    .progress-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.24); transition: width 0.3s ease, opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease; }
    .progress-dot.current { width: 26px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); box-shadow: 0 0 14px rgba(116,240,255,0.35); }
    .progress-dot.completed { background: rgba(255,255,255,0.66); }
    /* [agent-note][stage2] preserve: choices-bottom-stack | reason: already mobile-safe for thumb reach */
    #choicesContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: auto; padding: 16px 16px max(20px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent 0%, rgba(2,4,10,0.42) 12%, rgba(3,5,10,0.94) 100%); display: flex; flex-direction: column; gap: 10px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #choicesContainer.visible { opacity: 1; pointer-events: auto; }
    .choice-btn { position: relative; padding: 14px 18px; border: 1px solid rgba(150,238,255,0.28); border-radius: 18px; background: linear-gradient(180deg, rgba(20,25,38,0.92), rgba(9,13,22,0.92)); backdrop-filter: blur(10px); color: var(--text); font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.04em; text-align: left; animation: slideUp 0.4s ease-out; animation-fill-mode: both; box-shadow: var(--shadow); }
    .choice-btn::before { content: '◆'; color: var(--accent); margin-right: 10px; }
    .choice-btn:nth-child(1) { animation-delay: 0.1s; }
    .choice-btn:nth-child(2) { animation-delay: 0.2s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .choice-btn:hover { background: linear-gradient(180deg, rgba(28,35,52,0.98), rgba(11,16,28,0.96)); border-color: rgba(150,238,255,0.54); transform: translateY(-1px); }
    .choice-btn:active { transform: scale(0.98); }
    #transitionFlash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(200,140,255,0.22), rgba(0,0,0,0.96)); opacity: 0; pointer-events: none; z-index: 60; transition: opacity 0.3s ease; }
    #transitionFlash.flash { opacity: 1; }
    #endScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 24px; background: linear-gradient(135deg, rgba(3,5,10,0.98), rgba(14,18,34,0.98)); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
    #endScreen.show { opacity: 1; pointer-events: auto; }
    .end-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 2.9rem); font-weight: 700; text-align: center; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em; }
    .end-subtitle { font-size: 1.1rem; font-weight: 600; text-align: center; color: var(--text-muted); margin-bottom: 2.2rem; text-transform: uppercase; letter-spacing: 0.2em; }
    .end-replay-btn { padding: 14px 34px; border: 1px solid rgba(150,238,255,0.32); border-radius: 18px; background: linear-gradient(180deg, rgba(20,25,38,0.94), rgba(8,11,19,0.94)); backdrop-filter: blur(10px); color: var(--text); font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 0.14em; box-shadow: var(--shadow); }
    .end-replay-btn:hover { background: linear-gradient(180deg, rgba(27,33,50,0.98), rgba(10,14,24,0.98)); border-color: var(--line-strong); }
    .end-replay-btn:active { transform: scale(0.97); }
    #feedbackHud { position: absolute; top: 16px; left: 16px; right: 76px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; z-index: 55; pointer-events: none; }
    #sceneLabel { max-width: 13rem; padding: 10px 14px; border: 1px solid rgba(150,238,255,0.22); border-radius: 16px; background: rgba(5, 10, 18, 0.62); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
    .scene-kicker { display: block; font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
    .scene-copy { display: block; font-size: 0.94rem; font-weight: 600; color: var(--text-muted); line-height: 1.2; }
    #reactionToast { margin-left: auto; min-height: 96px; padding: 10px; border: 1px solid rgba(150,238,255,0.2); border-radius: 18px; background: rgba(5, 10, 18, 0.5); box-shadow: var(--shadow); opacity: 0; transform: translateY(-8px) scale(0.98); transition: opacity 0.25s ease, transform 0.25s ease; overflow: hidden; width: min(34vw, 120px); }
    #reactionToast.show { opacity: 1; transform: translateY(0) scale(1); }
    #reactionToast img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 12px; }
    #reactionToast[data-tone="shock"] { box-shadow: 0 0 28px rgba(255, 107, 147, 0.18); }
    #reactionToast[data-tone="resolve"] { box-shadow: 0 0 28px rgba(116, 240, 255, 0.18); }
    @media (max-width: 640px) {
      .playGate-title { margin-bottom: 0.6rem; }
      .playGate-subtitle { margin-bottom: 1.15rem; }
      #progressBar { bottom: 88px; max-width: calc(100% - 32px); }
      .choice-btn { font-size: 0.98rem; padding: 13px 16px; }
      .end-title { font-size: 1.9rem; }
      .end-subtitle { font-size: 1rem; margin-bottom: 1.8rem; }
      #feedbackHud { top: 14px; left: 14px; right: 72px; gap: 8px; }
      #sceneLabel { max-width: 11rem; padding: 9px 12px; }
      .scene-copy { font-size: 0.82rem; }
      #reactionToast { width: 88px; min-height: 88px; padding: 8px; }
    }
  </style>
</head>
<body>
  <!--
    CUT MAP — Episode 3: The Break
    Source: 7624128819959565590.mp4 (62.74s)

    scene1 (0–9s)
      SHOWS: Studio. Grape counting money. Pumpkin girl watching, disappointed.
      LAST FRAME: Grape counting cash, girl watching. Ring lights. Text "GOOD".
      → CHOICES: "Ask for your fair share" / "Keep quiet and keep working"

    scene2 (9–21.5s)
      SHOWS: Girl confronts grape about money. Getting upset.
      LAST FRAME: Girl upset/crying, grape holding money. Text "THIS".
      → CHOICES: "Demand more money" / "Walk away from the deal"

    scene3 (21.5–32s)
      SHOWS: Girl throws water at grape, says "BYE", storms out.
      LAST FRAME: Water splashing on grape's face. Text "BYE".
      → CHOICES: "Go back and apologize" / "Leave and never look back"

    scene4 (32–42.5s)
      SHOWS: Grape disables access. Girl on street discovers "Access Denied" on phone.
      LAST FRAME: Girl on street in leopard coat, phone showing white screen, shocked. Text "WHAT".
      → CHOICES: "Call him and demand answers" / "Try to fix it yourself"

    scene5 (42.5–48.5s)
      SHOWS: Girl devastated, sits against wall in alley.
      LAST FRAME: Girl sitting against wall, defeated. Text "RUINED".
      → CHOICES: "Call someone for help" / "Figure it out on your own"

    scene6 (48.5–62.74s)
      SHOWS: Resolution. Grape on phone with banana character. Final scenes.
  -->

  <div id="videoContainer">
    <video id="V" playsinline preload="auto" poster="vn3_scenes/poster.jpg" src="vn3_scenes/scene1.mp4"></video>
  </div>

  <div id="playGate" role="button" tabindex="0" aria-label="Start Episode 3: The Break">
    <div class="playGate-badge">Break Mode // Live Cut</div>
    <div class="playGate-title">Episode 3: The Break</div>
    <div class="playGate-subtitle">Step into the fallout and steer each beat without changing the story's momentum.</div>
    <div class="playGate-ring"></div>
    <div class="playGate-tap">Tap To Play</div>
  </div>

  <div id="feedbackHud" aria-hidden="true">
    <div id="sceneLabel">
      <span class="scene-kicker">Decision Feed</span>
      <span class="scene-copy">The fallout is starting. Stay ready for the next beat.</span>
    </div>
    <!-- [agent-note][stage3] resolved-gif: story-feedback-overlay -> catalogs/gifs.json | keep compact to protect video and controls -->
    <div id="reactionToast" data-tone="resolve">
      <img id="reactionGif" alt="Story reaction feedback" src="https://i.giphy.com/14aUO0Mf7dWDXW.webp">
    </div>
  </div>

  <button id="pauseBtn">&#8214;</button>

  <div id="progressBar">
    <div class="progress-dot current" data-index="0"></div>
    <div class="progress-dot" data-index="1"></div>
    <div class="progress-dot" data-index="2"></div>
    <div class="progress-dot" data-index="3"></div>
    <div class="progress-dot" data-index="4"></div>
    <div class="progress-dot" data-index="5"></div>
  </div>

  <div id="choicesContainer"></div>
  <div id="transitionFlash"></div>

  <div id="endScreen">
    <div class="end-title">Episode 3 Complete</div>
    <div class="end-subtitle">The Break</div>
    <button class="end-replay-btn">Replay</button>
  </div>

  <script>
    var V = document.getElementById('V');
    var playGate = document.getElementById('playGate');
    var pauseBtn = document.getElementById('pauseBtn');
    var progressBar = document.getElementById('progressBar');
    var choicesContainer = document.getElementById('choicesContainer');
    var transitionFlash = document.getElementById('transitionFlash');
    var endScreen = document.getElementById('endScreen');
    var sceneLabel = document.getElementById('sceneLabel').querySelector('.scene-copy');
    var reactionToast = document.getElementById('reactionToast');
    var reactionGif = document.getElementById('reactionGif');

    var isPaused = false;
    var currentSceneIndex = 0;
    var audioUnlocked = false;
    var lastSfxAt = {};

    // [agent-note][stage4] remapped-fonts: title/ui -> Orbitron + Rajdhani from catalogs/fonts.json
    var sceneMeta = [
      { label: 'Studio tension spikes as the money split turns sour.', tone: 'shock', gif: 'https://i.giphy.com/MFPZ483I4x41W.webp' },
      { label: 'The confrontation sharpens and the room goes cold.', tone: 'shock', gif: 'https://i.giphy.com/5aLrlDiJPMPFS.webp' },
      { label: 'The break becomes final. No walking it back now.', tone: 'resolve', gif: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp' },
      { label: 'Access is gone. Every next move needs nerve.', tone: 'shock', gif: 'https://i.giphy.com/eRM47Z22ZXSNoVeM1c.webp' },
      { label: 'Regroup. Let the sting settle before the next call.', tone: 'shock', gif: 'https://i.giphy.com/3o7aTskHEUdgCQAXde.webp' },
      { label: 'A final connection lands and the fallout starts to clear.', tone: 'resolve', gif: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp' }
    ];

    // [agent-note][stage3] resolved-audio: start/ui/pause/resume/choice/end + ambient loop -> catalogs/audios.json
    var audioBank = {
      loop: createAudio('https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3', 0.2, true),
      start: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3', 0.45, false),
      click: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3', 0.38, false),
      blocked: createAudio('https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3', 0.36, false),
      pause: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3', 0.42, false),
      resume: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3', 0.42, false),
      success: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3', 0.38, false),
      finale: createAudio('https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3', 0.44, false)
    };

    function createAudio(src, volume, loop) {
      var audio = new Audio(src);
      audio.preload = 'auto';
      audio.volume = volume;
      audio.loop = !!loop;
      audio.crossOrigin = 'anonymous';
      return audio;
    }

    function safePlay(audio, key, minGap) {
      if (!audioUnlocked || !audio) return;
      var now = Date.now();
      if (key && lastSfxAt[key] && now - lastSfxAt[key] < (minGap || 120)) return;
      if (key) lastSfxAt[key] = now;
      try {
        audio.currentTime = 0;
      } catch (e) {}
      audio.play().catch(function() {});
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      Object.keys(audioBank).forEach(function(key) {
        var audio = audioBank[key];
        audio.load();
      });
    }

    function startLoop() {
      if (!audioUnlocked) return;
      audioBank.loop.play().catch(function() {});
    }

    function stopLoop() {
      audioBank.loop.pause();
      try { audioBank.loop.currentTime = 0; } catch (e) {}
    }

    function syncLoopState() {
      if (!audioUnlocked) return;
      if (V.paused || endScreen.classList.contains('show')) {
        audioBank.loop.pause();
      } else {
        audioBank.loop.play().catch(function() {});
      }
    }

    function setScene(index) {
      currentSceneIndex = index;
      var dots = progressBar.querySelectorAll('.progress-dot');
      dots.forEach(function(dot, i) {
        dot.classList.remove('current', 'completed');
        if (i < index) { dot.classList.add('completed'); }
        else if (i === index) { dot.classList.add('current'); }
      });
      updateReaction(index);
    }

    function updateReaction(index) {
      var meta = sceneMeta[index] || sceneMeta[0];
      sceneLabel.textContent = meta.label;
      reactionToast.dataset.tone = meta.tone;
      reactionGif.src = meta.gif;
      reactionToast.classList.add('show');
      clearTimeout(updateReaction.hideTimer);
      updateReaction.hideTimer = setTimeout(function() {
        if (!choicesContainer.classList.contains('visible') && !endScreen.classList.contains('show')) {
          reactionToast.classList.remove('show');
        }
      }, 2200);
    }

    function flashChoiceMoment(tone, gif) {
      reactionToast.dataset.tone = tone;
      reactionGif.src = gif;
      reactionToast.classList.add('show');
      clearTimeout(updateReaction.hideTimer);
      updateReaction.hideTimer = setTimeout(function() {
        if (!endScreen.classList.contains('show')) {
          reactionToast.classList.remove('show');
        }
      }, 1800);
    }

    function waitEnd(freeze) {
      return new Promise(function(resolve) {
        if (freeze) {
          function onTime() {
            if (V.duration > 0 && V.currentTime >= V.duration - 0.15) {
              V.pause();
              V.removeEventListener('timeupdate', onTime);
              resolve();
            }
          }
          V.addEventListener('timeupdate', onTime);
        } else {
          function onEnd() { V.removeEventListener('ended', onEnd); resolve(); }
          V.addEventListener('ended', onEnd);
        }
      });
    }

    function playClip(src, freeze, sceneIndex) {
      return new Promise(function(resolve) {
        transitionFlash.classList.add('flash');
        safePlay(audioBank.success, 'transition', 200);
        setTimeout(function() { transitionFlash.classList.remove('flash'); }, 300);
        setTimeout(function() {
          V.src = src;
          setScene(sceneIndex);
          V.load();
          var endP = waitEnd(freeze);
          function tryPlay() {
            V.play().catch(function() {});
            syncLoopState();
          }
          V.onloadeddata = tryPlay;
          V.onerror = resolve;
          if (V.readyState >= 2) tryPlay();
          endP.then(resolve);
        }, 300);
      });
    }

    function ask(choices) {
      return new Promise(function(resolve) {
        choicesContainer.innerHTML = '';
        progressBar.classList.remove('visible');
        choicesContainer.classList.add('visible');
        reactionToast.classList.add('show');
        choices.forEach(function(text, idx) {
          var btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = text;
          btn.addEventListener('pointerenter', function() {
            safePlay(audioBank.blocked, 'hover-' + idx, 160);
          });
          btn.addEventListener('click', function() {
            safePlay(audioBank.click, 'choice', 120);
            flashChoiceMoment(idx === 0 ? 'resolve' : 'shock', idx === 0 ? 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp' : 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp');
            choicesContainer.classList.remove('visible');
            progressBar.classList.add('visible');
            resolve();
          });
          choicesContainer.appendChild(btn);
        });
      });
    }

    function story() {
      progressBar.classList.add('visible');
      pauseBtn.classList.add('visible');
      setScene(0);
      startLoop();

      var scene1End = waitEnd(true);
      V.play().catch(function() {});
      syncLoopState();

      scene1End.then(function() {
        return ask(['Ask for your share', 'Something feels off']);
      }).then(function() {
        return playClip('vn3_scenes/scene2.mp4', true, 1);
      }).then(function() {
        return ask(['Press the issue', 'Walk away from the deal']);
      }).then(function() {
        return playClip('vn3_scenes/scene3.mp4', true, 2);
      }).then(function() {
        return ask(['Leave without looking back', 'Stand by your choice']);
      }).then(function() {
        return playClip('vn3_scenes/scene4.mp4', true, 3);
      }).then(function() {
        return ask(['Figure out what happened', 'Accept that it is over']);
      }).then(function() {
        return playClip('vn3_scenes/scene5.mp4', true, 4);
      }).then(function() {
        return ask(['Call for backup', 'Take a moment to regroup']);
      }).then(function() {
        return playClip('vn3_scenes/scene6.mp4', false, 5);
      }).then(function() {
        pauseBtn.classList.remove('visible');
        progressBar.classList.remove('visible');
        reactionToast.dataset.tone = 'resolve';
        reactionGif.src = 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp';
        reactionToast.classList.add('show');
        sceneLabel.textContent = 'The credits hit with a little relief and one last pulse of momentum.';
        audioBank.loop.pause();
        safePlay(audioBank.finale, 'finale', 100);
        endScreen.classList.add('show');
      });
    }

    function startExperience() {
      if (playGate.classList.contains('hidden')) return;
      unlockAudio();
      safePlay(audioBank.start, 'start', 100);
      playGate.classList.add('hidden');
      V.muted = false;
      V.removeAttribute('poster');
      story();
    }

    playGate.addEventListener('click', startExperience);
    playGate.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        startExperience();
      }
    });

    pauseBtn.addEventListener('click', function() {
      if (V.paused) {
        V.play().catch(function() {});
        pauseBtn.textContent = '\u2016';
        isPaused = false;
        safePlay(audioBank.resume, 'resume', 100);
      } else {
        V.pause();
        pauseBtn.textContent = '\u25B6';
        isPaused = true;
        safePlay(audioBank.pause, 'pause', 100);
      }
      syncLoopState();
    });

    endScreen.querySelector('.end-replay-btn').addEventListener('click', function() {
      safePlay(audioBank.click, 'replay', 100);
      location.reload();
    });

    V.addEventListener('play', function() {
      if (pauseBtn.classList.contains('visible')) pauseBtn.style.display = 'flex';
      syncLoopState();
    });
    V.addEventListener('pause', function() {
      if (!isPaused && pauseBtn.classList.contains('visible')) pauseBtn.style.display = 'flex';
      syncLoopState();
    });
    V.addEventListener('ended', syncLoopState);
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        audioBank.loop.pause();
      } else {
        syncLoopState();
      }
    });
  </script>
</body>
</html>
