<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena Legends</title>
    <style>
        /* [agent-note][stage4] repaired: font-remap | elements: body/display text | action: aligned required font vars with approved catalog-backed URLs */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        :root {
            --theme-color: #00F0FF;
            --bg-black: #000;
            --bg-panel: rgba(15, 18, 33, 0.82);
            --border-soft: rgba(164, 244, 255, 0.22);
            --text-white: #fff;
            --text-muted: #9ca3af;
            --text-cyan: #22d3ee;
            --text-red: #ef4444;
            --text-yellow: #facc15;
            --text-yellow-dim: #ca8a04;
            --bg-red-600: #dc2626;
            --border-red-500: #ef4444;
            --bg-yellow-900: #713f12;
            --bg-gray-800: #1f2937;
            --border-yellow-600: #ca8a04;
            --bg-cyan-500: #06b6d4;
            --bg-red-600-fill: #dc2626;
            --radius-xl: 0.75rem;
            --bg-deep: #05070f;
            --bg-ring: #11182b;
            --panel-edge: rgba(71, 232, 255, 0.55);
            --panel-shadow: 0 18px 45px rgba(0, 0, 0, 0.58);
            --hero-glow: 0 0 22px rgba(0, 240, 255, 0.28);
            --accent-hot: #ff4d8d;
            --accent-gold: #ffd84d;
            --body-font: 'Rajdhani', system-ui, sans-serif;
            --display-font: 'Russo One', Impact, sans-serif;
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 240, 255, 0.14), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 77, 141, 0.16), transparent 28%),
                linear-gradient(180deg, var(--bg-ring), var(--bg-deep) 60%, #020305);
            color: var(--text-white);
            font-family: var(--body-font);
        }
        body { -webkit-font-smoothing: antialiased; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button, input { font: inherit; }
        .font-display { font-family: var(--display-font); letter-spacing: 0.06em; }
        .uppercase { text-transform: uppercase; }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-full { max-width: 100%; }
        .select-none { user-select: none; }
        .bg-black { background: var(--bg-black); }
        .text-white { color: var(--text-white); }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .flex { display: flex; }
        .grid { display: grid; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .rounded-xl { border-radius: var(--radius-xl); }
        .rounded-full { border-radius: 9999px; }
        .rounded-tl-xl { border-top-left-radius: var(--radius-xl); }
        .rounded-tr-xl { border-top-right-radius: var(--radius-xl); }
        .rounded-bl-xl { border-bottom-left-radius: var(--radius-xl); }
        .rounded-br-xl { border-bottom-right-radius: var(--radius-xl); }
        .overflow-hidden { overflow: hidden; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-50 { z-index: 50; }
        .interactive { pointer-events: auto; }
        .glass {
            background:
                linear-gradient(180deg, rgba(25, 31, 55, 0.94), rgba(10, 13, 24, 0.9)),
                var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            box-shadow: var(--panel-shadow);
            position: relative;
            overflow: hidden;
        }
        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(0, 240, 255, 0.08);
            pointer-events: none;
        }
        .backdrop-blur { backdrop-filter: blur(12px); }
        .bg-black\/80 { background: rgba(0, 0, 0, 0.8); }
        .bg-black\/90 { background: rgba(0, 0, 0, 0.9); }
        .bg-black\/50 { background: rgba(0, 0, 0, 0.5); }
        .border { border: 1px solid currentColor; }
        .border-gray-600 { border-color: #4b5563; }
        .border-yellow-600 { border-color: var(--border-yellow-600); }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-2xl { font-size: 1.5rem; line-height: 1.35; }
        .text-3xl { font-size: 1.875rem; line-height: 1.25; }
        .text-4xl { font-size: 2.25rem; line-height: 1.2; }
        .text-5xl { font-size: clamp(2.25rem, 5vw, 3.25rem); line-height: 1.1; }
        .text-7xl { font-size: clamp(3rem, 8vw, 5rem); line-height: 1; }
        .text-8xl { font-size: clamp(3.5rem, 10vw, 6rem); line-height: 0.95; }
        .text-sm { font-size: 0.875rem; line-height: 1.4; }
        .font-bold { font-weight: 700; }
        .font-light { font-weight: 400; }
        .italic { font-style: italic; }
        .leading-relaxed { line-height: 1.6; }
        .tracking-widest { letter-spacing: 0.25em; }
        .tracking-tighter { letter-spacing: -0.04em; }
        .text-transparent { color: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .bg-gradient-to-b { background-image: linear-gradient(180deg, #fff, #6b7280); }
        .from-white, .to-gray-500 { color: transparent; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-300 { color: #d1d5db; }
        .text-gray-200 { color: #e5e7eb; }
        .text-yellow-500 { color: #eab308; }
        .text-yellow-400 { color: #facc15; }
        .text-cyan-400 { color: var(--text-cyan); }
        .text-red-500 { color: var(--text-red); }
        .bg-red-600 { background-color: var(--bg-red-600); }
        .border-red-500 { border-color: var(--border-red-500); }
        .bg-yellow-900 { background-color: var(--bg-yellow-900); }
        .text-yellow-500 { color: var(--text-yellow-dim); }
        .bg-gray-800 { background-color: var(--bg-gray-800); }
        .bg-yellow-500 { background-color: var(--text-yellow); }
        .bg-cyan-500 { background-color: var(--bg-cyan-500); }
        .bg-red-600-fill, .bg-red-600 { background-color: var(--bg-red-600-fill); }
        .float-right { float: right; }
        .opacity-50 { opacity: 0.5; }
        .transition-all { transition: all 0.3s ease; }
        .duration-300 { transition-duration: 0.3s; }
        .animate-pulse { animation: pulse 1.2s ease-in-out infinite; }
        .neon-text { text-shadow: 0 0 10px currentColor; }
        .health-bar-bg { background: #333; height: 100%; width: 100%; transform: skewX(-20deg); border: 2px solid #555; overflow: hidden; }
        .health-bar-fill { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #ui-layer { pointer-events: none; }
        #screen-menu .glass, #screen-story .max-w-md, #screen-result { width: 100%; }
        .w-80 { width: min(20rem, calc(100vw - 2rem)); }
        .max-w-md { max-width: 28rem; }
        .w-5\/12 { width: 41.666667%; }
        .h-4 { height: 1rem; }
        .h-6 { height: 1.5rem; }
        .h-8 { height: 2rem; }
        .w-12 { width: 3rem; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        .btn-action {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0)),
                linear-gradient(180deg, #2f385d, #11162b);
            border: 2px solid rgba(143, 236, 255, 0.38);
            color: white;
            text-transform: uppercase;
            font-family: var(--display-font);
            letter-spacing: 1.5px;
            transition: transform 0.1s ease, border-color 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 10px 24px rgba(0,0,0,0.35);
        }
        .btn-action:active { transform: scale(0.95); border-color: var(--theme-color); background: linear-gradient(180deg, #33406d, #171d35); box-shadow: 0 0 14px rgba(0, 240, 255, 0.28); }
        .btn-action:disabled { cursor: default; }
        #input-name {
            font-family: var(--display-font);
            width: 100%;
        }
        #input-color {
            border: 0;
            padding: 0;
            background: transparent;
        }
        .text-shadow { text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        .arena-stage {
            background:
                radial-gradient(circle at 50% 15%, rgba(255,255,255,0.08), transparent 18%),
                linear-gradient(180deg, rgba(8, 12, 24, 0.15), rgba(8, 12, 24, 0.78));
        }
        .hero-title {
            text-shadow:
                0 0 10px rgba(0, 240, 255, 0.35),
                0 0 24px rgba(255, 77, 141, 0.18);
        }
        .sub-banner {
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
        }
        .menu-card-title,
        .meter-label,
        .versus-mark {
            letter-spacing: 0.08em;
        }
        .hud-shell {
            padding-top: max(0.5rem, env(safe-area-inset-top));
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
        .health-bar-bg {
            background: linear-gradient(180deg, rgba(12,16,26,0.95), rgba(36,42,62,0.95));
            height: 100%;
            width: 100%;
            transform: skewX(-20deg);
            border: 2px solid #555;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.65), 0 0 12px rgba(0,0,0,0.3);
        }
        .health-bar-fill {
            height: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px currentColor;
        }
        .player-panel, .enemy-panel, .meter-panel {
            background: linear-gradient(180deg, rgba(8,12,26,0.84), rgba(18,24,42,0.76));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.95rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
            padding: 0.45rem 0.65rem 0.55rem;
        }
        .player-panel { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 18px rgba(0, 240, 255, 0.12); }
        .enemy-panel { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 18px rgba(255, 77, 141, 0.12); }
        .meter-panel { border-radius: 999px; padding: 0.45rem 0.85rem 0.65rem; }
        #combat-log {
            min-height: 2rem;
            color: #f8fbff;
            text-shadow: 0 0 12px rgba(0,240,255,0.18), 0 2px 6px rgba(0,0,0,0.9);
        }
        .feedback-layer {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: max(0.75rem, calc(env(safe-area-inset-top) + 0.75rem));
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }
        .feedback-gif {
            width: min(42vw, 180px);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
            background: rgba(6, 10, 20, 0.45);
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        .status-chip {
            position: absolute;
            left: 50%;
            top: max(0.75rem, calc(env(safe-area-inset-top) + 0.5rem));
            transform: translateX(-50%);
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            font-family: var(--display-font);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            color: #eafcff;
            background: rgba(7, 12, 24, 0.82);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 22px rgba(0,0,0,0.35);
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
        }
        .status-chip.is-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.85; } }
        .flash-anim { animation: flash 0.5s infinite; }

        @media (max-width: 640px) {
            .p-4 { padding: 0.75rem; }
            .text-2xl { font-size: 1.25rem; }
            .text-3xl { font-size: 1.5rem; }
            .text-4xl { font-size: 1.75rem; }
            .text-xl { font-size: 1.05rem; }
            #move-menu button { padding-top: 1rem; padding-bottom: 1rem; }
            .glass { box-shadow: 0 10px 28px rgba(0,0,0,0.52); }
            .player-panel, .enemy-panel { padding: 0.35rem 0.5rem 0.45rem; }
            .meter-panel { padding: 0.35rem 0.65rem 0.55rem; }
            .feedback-gif { width: min(38vw, 132px); }
            .status-chip { font-size: 0.78rem; max-width: calc(100vw - 2rem); text-align: center; }
        }
    </style>
</head>
<body>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "gameSpeed": { "type": "number", "label": "Game Speed", "value": 1.0, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Ring Color", "value": "#00F0FF" },
    "difficulty": { "type": "number", "label": "AI Difficulty", "value": 5, "min": 1, "max": 10 }
}
</script>

<!-- Assets -->
<div id="assets" style="display: none;">
    <!-- [agent-note][stage3] resolved-audio: loop/ui/hit/win/fail -> catalogs/audios.json -->
    <audio id="bgm_metal" data-editable="audio" data-label="Arena Rock BGM" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3" preload="auto" loop></audio>
    <audio id="sfx_hit" data-editable="audio" data-label="Impact SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
    <audio id="sfx_grapple" data-editable="audio" data-label="Heavy Grapple SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_02.mp3" preload="auto"></audio>
    <audio id="sfx_taunt" data-editable="audio" data-label="Hype SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
    <audio id="sfx_win" data-editable="audio" data-label="Victory SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
    <audio id="sfx_fail" data-editable="audio" data-label="Failure SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

    <!-- [agent-note][stage3] resolved-gif: impact/result feedback -> catalogs/gifs.json -->
    <img id="gif-impact" data-editable="gif" data-label="Impact Reaction Gif" src="https://i.giphy.com/27bKlOOHnifgoXkdui.webp" alt="Impact reaction" hidden>
    <img id="gif-victory" data-editable="gif" data-label="Victory Celebration Gif" src="https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp" alt="Victory celebration" hidden>

    <img id="asset_player" data-editable="image" data-label="Player Texture" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiM1NTUiLz48L3N2Zz4=" hidden>
</div>

<!-- Game Container -->
<div id="game-container" class="relative w-full h-full select-none bg-black text-white arena-stage">
    <canvas id="gameCanvas"></canvas>

    <div id="feedback-layer" class="absolute inset-0 z-50 pointer-events-none feedback-layer">
        <img id="feedback-gif" class="feedback-gif" alt="Match feedback overlay">
        <div id="status-chip" class="status-chip"></div>
    </div>
    
    <div id="ui-layer" class="absolute inset-0 z-50 flex flex-col justify-between p-4 hud-shell">
        
        <!-- Main Menu -->
        <div id="screen-menu" class="absolute inset-0 interactive flex flex-col items-center justify-center bg-black/80 backdrop-blur">
            <h1 class="text-8xl font-bold italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 neon-text mb-4 font-display hero-title" style="color: var(--theme-color, #00F0FF)">ARENA LEGENDS</h1>
            <div class="text-2xl text-gray-400 mb-8 tracking-widest font-display sub-banner">CARD CLIMB</div>
            
            <div class="glass p-6 rounded-xl w-80 max-w-full flex flex-col gap-4">
                <div class="text-xl font-bold text-center mb-2 font-display menu-card-title">CREATE CONTENDER</div>
                <input id="input-name" type="text" value="THE ROOKIE" class="bg-black/50 border border-gray-600 p-2 text-center text-xl font-bold text-white uppercase" maxlength="12">
                
                <div class="flex justify-between items-center">
                    <span class="font-bold tracking-widest">GEAR COLOR</span>
                    <input id="input-color" type="color" value="#FF0055" class="w-12 h-8">
                </div>
                
                <button id="btn-start" class="btn-action py-4 text-2xl font-bold mt-4 bg-red-600 border-red-500">START RUN</button>
            </div>
        </div>

        <!-- Story / Cutscene -->
        <div id="screen-story" class="absolute inset-0 interactive hidden flex flex-col items-center justify-center bg-black z-50">
            <div class="max-w-md text-center p-8">
                <h2 id="story-title" class="text-5xl font-bold text-yellow-500 mb-6 font-display">MATCH 1</h2>
                <p id="story-text" class="text-2xl text-gray-200 leading-relaxed font-light mb-8">The crowd barely knows your name. Beat the gatekeeper and claim the next slot on the card.</p>
                <button id="btn-fight" class="btn-action px-12 py-3 text-3xl font-bold animate-pulse">ENTER MATCH</button>
            </div>
        </div>

        <!-- Combat HUD -->
        <div id="screen-combat" class="absolute inset-0 hidden flex flex-col justify-between pointer-events-none">
            <!-- Top Bars -->
            <div class="flex justify-between items-start w-full mt-2 px-2">
                <div class="w-5/12">
                    <div class="player-panel">
                        <div class="flex justify-between text-xl font-bold mb-1">
                            <span id="hud-p-name" class="text-cyan-400">PLAYER</span>
                        </div>
                        <div class="health-bar-bg h-6">
                            <div id="hud-p-hp" class="health-bar-fill bg-cyan-500" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="text-4xl font-bold italic text-yellow-500 mt-2 font-display versus-mark">VS</div>

                <div class="w-5/12 text-right">
                    <div class="enemy-panel">
                        <div class="flex justify-between text-xl font-bold mb-1 flex-row-reverse">
                            <span id="hud-e-name" class="text-red-500">ENEMY</span>
                        </div>
                        <div class="health-bar-bg h-6">
                            <div id="hud-e-hp" class="health-bar-fill bg-red-600 float-right" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4 interactive pointer-events-auto">
                <div class="w-full max-w-md mx-auto mb-4 px-4">
                    <div class="meter-panel">
                        <div class="text-center text-yellow-400 font-bold tracking-widest text-sm mb-1 font-display meter-label">FINISHER CHARGE</div>
                        <div class="w-full h-4 bg-gray-800 border border-yellow-600 rounded-full overflow-hidden">
                            <div id="hud-finisher" class="h-full bg-yellow-500 transition-all duration-300" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>

                <div id="move-menu" class="grid grid-cols-2 gap-2 max-w-md mx-auto px-2">
                    <button data-move="strike" class="btn-action py-6 text-2xl font-bold rounded-tl-xl">STRIKE</button>
                    <button data-move="grapple" class="btn-action py-6 text-2xl font-bold rounded-tr-xl">GRAPPLE</button>
                    <button data-move="taunt" class="btn-action py-6 text-2xl font-bold rounded-bl-xl">TAUNT</button>
                    <button data-move="finisher" id="btn-finisher" class="btn-action py-6 text-2xl font-bold rounded-br-xl bg-yellow-900 border-yellow-600 text-yellow-500 opacity-50" disabled>FINISHER</button>
                </div>
                
                <div id="combat-log" class="text-center text-xl text-white mt-2 h-8 font-bold text-shadow"></div>
            </div>
        </div>

        <!-- Victory / Game Over -->
        <div id="screen-result" class="absolute inset-0 interactive hidden flex flex-col items-center justify-center bg-black/90 z-50">
            <h2 id="result-title" class="text-7xl font-bold mb-4 neon-text font-display">VICTORY</h2>
            <div id="result-stats" class="text-2xl text-gray-300 mb-8">FANS GAINED: 100</div>
            <button id="btn-next" class="btn-action px-10 py-4 text-2xl font-bold">CONTINUE</button>
        </div>
    </div>
</div>

<script>
/**
 * ARENA LEGENDS
 * A turn-based card-climb wrestling game
 */

window.gameConfigDefs = {
    "gameSpeed": { "type": "number", "label": "Game Speed", "value": 1.0, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Ring Color", "value": "#00F0FF" },
    "difficulty": { "type": "number", "label": "AI Difficulty", "value": 5, "min": 1, "max": 10 }
};
window.gameConfig = { gameSpeed: 1.0, themeColor: "#00F0FF", difficulty: 5 };

window.updateGameConfig = (key, val) => {
    if (window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        if (key === 'themeColor') document.documentElement.style.setProperty('--theme-color', val);
    }
};

class AudioManager {
    constructor() {
        this.ctx = null;
        this.buffers = {};
        this.unlocked = false;
        this.bgmNode = null;
        this.bgmGain = null;
        this.masterGain = null;
        this.cooldowns = new Map();
        this.lastBgmId = 'bgm_metal';
        this.createContext();
    }

    createContext() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.8;
            this.masterGain.connect(this.ctx.destination);
        } catch (error) {
            this.ctx = null;
        }
    }

    unlock() {
        if (!this.ctx || this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playLoop('bgm_metal', 0.22);
        }).catch(() => {});
    }

    async load(id, fallbackType) {
        const el = document.getElementById(id);
        if (!el || !this.ctx) return;
        try {
            const srcUrl = new URL(el.src, window.location.href);
            if (srcUrl.origin !== window.location.origin) {
                this.buffers[id] = fallbackType;
                return;
            }
            const res = await fetch(srcUrl.href);
            if (!res.ok) throw new Error(`Audio fetch failed: ${res.status}`);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(buf);
        } catch (e) {
            this.buffers[id] = fallbackType;
        }
    }

    stopLoop() {
        if (this.bgmNode) {
            try {
                this.bgmNode.stop();
            } catch (e) {}
            this.bgmNode.disconnect();
            this.bgmNode = null;
        }
        if (this.bgmGain) {
            this.bgmGain.disconnect();
            this.bgmGain = null;
        }
    }

    playLoop(id = 'bgm_metal', volume = 0.22) {
        if (!this.ctx || this.ctx.state === 'suspended') return;
        if (this.bgmNode && this.lastBgmId === id) return;

        this.stopLoop();
        this.lastBgmId = id;

        const buf = this.buffers[id];
        if (buf && typeof buf !== 'string') {
            const src = this.ctx.createBufferSource();
            src.buffer = buf;
            src.loop = true;
            const gain = this.ctx.createGain();
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);
            this.bgmNode = src;
            this.bgmGain = gain;
            return;
        }

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 72;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        this.bgmNode = osc;
        this.bgmGain = gain;
    }

    pauseLoop() {
        if (!this.ctx) return;
        if (this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
    }

    resumeLoop() {
        if (!this.ctx) return;
        this.ctx.resume().then(() => {
            if (this.unlocked) this.playLoop(this.lastBgmId, 0.22);
        }).catch(() => {});
    }

    playSfx(id, options = {}) {
        if (!this.ctx) return;
        const nowTime = performance.now();
        const cooldown = options.cooldown ?? 0;
        if (cooldown > 0) {
            const last = this.cooldowns.get(id) || 0;
            if (nowTime - last < cooldown) return;
            this.cooldowns.set(id, nowTime);
        }

        if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        const buf = this.buffers[id];
        if (buf && typeof buf !== 'string') {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            src.buffer = buf;
            gain.gain.value = options.volume ?? 0.55;
            src.connect(gain);
            gain.connect(this.masterGain);
            src.start(0);
        } else {
            this.synth(buf || 'beep');
        }
    }

    synth(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);
        const now = this.ctx.currentTime;

        if (type === 'bell') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start();
            osc.stop(now + 0.6);
        } else if (type === 'cheer') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(320, now + 0.35);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.45);
            osc.start();
            osc.stop(now + 0.45);
        } else if (type === 'error') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(120, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.24);
            osc.start();
            osc.stop(now + 0.24);
        } else {
            osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start();
            osc.stop(now + 0.1);
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new AudioManager();

    const screens = {
        menu: document.getElementById('screen-menu'),
        story: document.getElementById('screen-story'),
        combat: document.getElementById('screen-combat'),
        result: document.getElementById('screen-result')
    };
    const hud = {
        pName: document.getElementById('hud-p-name'),
        pHp: document.getElementById('hud-p-hp'),
        eName: document.getElementById('hud-e-name'),
        eHp: document.getElementById('hud-e-hp'),
        finisher: document.getElementById('hud-finisher'),
        btnFinisher: document.getElementById('btn-finisher'),
        log: document.getElementById('combat-log')
    };
    const feedbackGif = document.getElementById('feedback-gif');
    const statusChip = document.getElementById('status-chip');
    const gifAssets = {
        impact: document.getElementById('gif-impact').src,
        victory: document.getElementById('gif-victory').src
    };

    let width, height, dpr;
    let gameState = 'MENU';
    let shake = 0;
    let particles = [];
    let texts = [];
    let feedbackTimer = 0;
    let chipTimer = 0;

    const player = {
        name: "ROOKIE",
        color: "#FF0055",
        hp: 100,
        maxHp: 100,
        finisher: 0,
        pos: { x: -100, y: 0 }
    };
    
    const enemy = {
        name: "GATEKEEPER",
        color: "#555555",
        hp: 100,
        maxHp: 100,
        pos: { x: 100, y: 0 },
        aiTimer: 0
    };

    const storyChapters = [
        { title: "OPENING BOUT", text: "The opener is yours to steal. Outlast the gatekeeper and stay on the card.", enemy: "IRON MIKE", color: "#667788", hp: 80 },
        { title: "FEATURE MATCH", text: "The crowd is awake now. Drop the flashy rival and keep the momentum.", enemy: "NEON VIPER", color: "#00FF00", hp: 120 },
        { title: "MAIN EVENT", text: "One last showdown. Beat the champion and headline the whole night.", enemy: "GOLDEN KING", color: "#FFD700", hp: 200 }
    ];
    let currentChapter = 0;

    function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    audio.load('bgm_metal', 'drone');
    audio.load('sfx_hit', 'bell');
    audio.load('sfx_grapple', 'bell');
    audio.load('sfx_taunt', 'cheer');
    audio.load('sfx_ui', 'beep');
    audio.load('sfx_win', 'cheer');
    audio.load('sfx_fail', 'error');

    function showFeedback(type, label, duration = 850) {
        feedbackGif.src = gifAssets[type] || '';
        feedbackGif.classList.toggle('is-visible', Boolean(feedbackGif.src));
        statusChip.textContent = label || '';
        statusChip.classList.toggle('is-visible', Boolean(label));
        feedbackTimer = duration;
        chipTimer = duration;
    }

    function clearFeedback() {
        feedbackGif.classList.remove('is-visible');
        statusChip.classList.remove('is-visible');
    }

    let lastTime = 0;
    function loop(timestamp) {
        const dt = Math.min(64, (timestamp - lastTime) * window.gameConfig.gameSpeed);
        lastTime = timestamp;

        update(dt);
        draw();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function update(dt) {
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx * dt * 0.05;
            particles[i].y += particles[i].vy * dt * 0.05;
            particles[i].life -= dt * 0.002;
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = texts.length - 1; i >= 0; i--) {
            texts[i].y -= dt * 0.05;
            texts[i].life -= dt * 0.001;
            if (texts[i].life <= 0) texts.splice(i, 1);
        }

        feedbackTimer -= dt;
        chipTimer -= dt;
        if (feedbackTimer <= 0 && chipTimer <= 0) clearFeedback();

        if (gameState === 'COMBAT') {
            const breathe = Math.sin(lastTime * 0.005) * 2;
            player.pos.y = breathe;
            enemy.pos.y = breathe;

            enemy.aiTimer -= dt;
            if (enemy.aiTimer <= 0) {
                executeMove(enemy, player, 'random');
                enemy.aiTimer = 2000 + Math.random() * 1000;
            }
        }
    }

    function setLog(message) {
        hud.log.textContent = message;
    }

    function executeMove(attacker, defender, moveType) {
        if (gameState !== 'COMBAT' && gameState !== 'ANIMATING') return;
        
        let dmg = 0;
        let txt = "";
        let shakeAmt = 0;
        let color = attacker === player ? '#FFF' : '#F00';

        if (moveType === 'random') {
            const r = Math.random();
            if (r < 0.6) moveType = 'strike';
            else if (r < 0.9) moveType = 'grapple';
            else moveType = 'taunt';
        }

        switch(moveType) {
            case 'strike':
                dmg = 10 + Math.random() * 5;
                txt = "POW!";
                shakeAmt = 5;
                spawnParticles(defender.pos.x + width/2, height/2 - 50, 10, '#FFF');
                audio.playSfx('sfx_hit', { volume: 0.5, cooldown: 100 });
                showFeedback('impact', attacker === player ? 'CLEAN HIT' : 'YOU GOT TAGGED', 520);
                setLog(attacker === player ? 'Strike lands clean.' : `${enemy.name} answers with a strike.`);
                break;
            case 'grapple':
                dmg = 15 + Math.random() * 10;
                txt = "SLAM!";
                shakeAmt = 15;
                spawnParticles(defender.pos.x + width/2, height/2, 20, '#FF0');
                audio.playSfx('sfx_grapple', { volume: 0.62, cooldown: 140 });
                showFeedback('impact', attacker === player ? 'BIG SLAM' : 'RING SHAKEN', 700);
                setLog(attacker === player ? 'Grapple drives the crowd wild.' : `${enemy.name} muscles through a slam.`);
                break;
            case 'taunt':
                attacker.finisher = Math.min(100, attacker.finisher + 30);
                txt = "HYPE!";
                dmg = 0;
                spawnParticles(attacker.pos.x + width/2, height/2 - 100, 5, '#0FF');
                audio.playSfx('sfx_taunt', { volume: 0.5, cooldown: 180 });
                showFeedback('victory', attacker === player ? 'CROWD HYPE' : 'OPPONENT HYPES UP', 620);
                setLog(attacker === player ? 'Taunt builds finisher charge.' : `${enemy.name} plays to the crowd.`);
                break;
            case 'finisher':
                if (attacker.finisher < 100) {
                    audio.playSfx('sfx_fail', { volume: 0.4, cooldown: 150 });
                    showFeedback('impact', 'FINISHER NOT READY', 600);
                    setLog('Finisher meter is not ready.');
                    return;
                }
                dmg = 50;
                txt = "CRITICAL!";
                shakeAmt = 40;
                attacker.finisher = 0;
                spawnParticles(defender.pos.x + width/2, height/2, 50, '#F0F');
                audio.playSfx('sfx_grapple', { volume: 0.72, cooldown: 120 });
                showFeedback('impact', 'FINISHER CONNECTS', 900);
                setLog(attacker === player ? 'Massive finisher detonates the ring.' : `${enemy.name} unleashes a finisher!`);
                break;
        }

        if (dmg > 0) {
            defender.hp = Math.max(0, defender.hp - dmg);
            attacker.finisher = Math.min(100, attacker.finisher + 10);
            shake = shakeAmt;
        }

        if (txt) spawnText(txt, defender.pos.x + width/2, height/2 - 100, color);
        updateHUD();

        if (defender.hp <= 0) {
            endMatch(attacker === player);
        }
    }

    function spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                life: 1.0,
                color: color,
                size: Math.random() * 5 + 2
            });
        }
    }

    function spawnText(str, x, y, color) {
        texts.push({ text: str, x: x, y: y, color: color, life: 1.0 });
    }

    function updateHUD() {
        hud.pHp.style.width = (player.hp / player.maxHp * 100) + '%';
        hud.eHp.style.width = (enemy.hp / enemy.maxHp * 100) + '%';
        hud.finisher.style.width = player.finisher + '%';
        
        if (player.finisher >= 100) {
            hud.btnFinisher.disabled = false;
            hud.btnFinisher.classList.remove('opacity-50');
            hud.btnFinisher.classList.add('animate-pulse');
        } else {
            hud.btnFinisher.disabled = true;
            hud.btnFinisher.classList.add('opacity-50');
            hud.btnFinisher.classList.remove('animate-pulse');
        }
    }

    function endMatch(win) {
        gameState = 'RESULT';
        audio.stopLoop();

        setTimeout(() => {
            screens.combat.classList.add('hidden');
            screens.result.classList.remove('hidden');
            
            const title = document.getElementById('result-title');
            const stats = document.getElementById('result-stats');
            const btn = document.getElementById('btn-next');
            
            if (win) {
                title.innerText = "CARD ADVANCE";
                title.style.color = "#00F0FF";
                stats.innerText = "FANS GAINED: 500";
                btn.innerText = currentChapter < storyChapters.length - 1 ? "NEXT MATCH" : "NEW RUN";
                audio.playSfx('sfx_win', { volume: 0.65, cooldown: 250 });
                showFeedback('victory', 'VICTORY POP', 1400);
                setLog('The arena erupts for the winner.');
            } else {
                title.innerText = "KNOCKED BACK";
                title.style.color = "#FF0055";
                stats.innerText = "TAKE ANOTHER SHOT";
                btn.innerText = "REMATCH";
                audio.playSfx('sfx_fail', { volume: 0.56, cooldown: 250 });
                showFeedback('impact', 'TOUGH BREAK', 1100);
                setLog('The challenger gets sent back down the card.');
            }
        }, 1000);
    }

    function draw() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        
        if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        const cx = width / 2;
        const cy = height / 2;

        const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
        bgGrad.addColorStop(0, '#0d1730');
        bgGrad.addColorStop(0.5, '#090d19');
        bgGrad.addColorStop(1, '#020305');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        const crowdGlow = ctx.createRadialGradient(cx, cy * 0.45, 10, cx, cy * 0.45, width * 0.6);
        crowdGlow.addColorStop(0, 'rgba(255, 85, 155, 0.24)');
        crowdGlow.addColorStop(0.45, 'rgba(0, 240, 255, 0.12)');
        crowdGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = crowdGlow;
        ctx.fillRect(0, 0, width, height);

        ctx.globalCompositeOperation = 'screen';
        const time = Date.now() * 0.001;
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = `rgba(${40 + i*50}, ${110 + i*15}, 255, 0.1)`;
            ctx.beginPath();
            ctx.moveTo(cx, -100);
            ctx.lineTo(cx + Math.sin(time + i) * 300, height);
            ctx.lineTo(cx + Math.sin(time + i + 0.5) * 300, height);
            ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        for (let i = 0; i < 40; i++) {
            const px = (i / 39) * width;
            const pulse = 0.35 + Math.sin(time * 2 + i) * 0.15;
            ctx.fillStyle = i % 3 === 0 ? `rgba(255,216,77,${pulse})` : `rgba(125,225,255,${pulse * 0.8})`;
            ctx.fillRect(px, cy + 95 + Math.sin(time * 3 + i) * 2, 6, 8);
        }

        ctx.lineWidth = 4;
        for (let i = 0; i < 3; i++) {
            ctx.strokeStyle = window.gameConfig.themeColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = window.gameConfig.themeColor;
            const y = cy + 50 + i * 40;
            ctx.beginPath();
            ctx.moveTo(0, y - i*10);
            ctx.lineTo(width, y + i*10);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        if (gameState === 'COMBAT' || gameState === 'ANIMATING') {
            drawWrestler(player, cx - 100, cy + 100, 1);
            drawWrestler(enemy, cx + 100, cy + 100, -1);
        }

        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.font = `bold 40px ${JSON.stringify(varOrFallback('--display-font', '"Russo One", sans-serif'))}`;
        texts.forEach(t => {
            ctx.fillStyle = t.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.globalAlpha = t.life;
            ctx.strokeText(t.text, t.x, t.y);
            ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    function drawWrestler(char, x, y, dir) {
        ctx.save();
        ctx.translate(x, y + char.pos.y);
        ctx.scale(dir, 1);

        const accent = char.color;
        const skin = '#FFD0B0';
        const trim = '#f7f9ff';
        const shadow = 'rgba(0,0,0,0.45)';

        const aura = ctx.createRadialGradient(0, -40, 16, 0, -20, 90);
        aura.addColorStop(0, `${accent}88`);
        aura.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = aura;
        ctx.fillRect(-90, -140, 180, 220);

        ctx.fillStyle = accent;
        ctx.strokeStyle = '#05070f';
        ctx.lineWidth = 3;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 18;

        ctx.fillRect(-22, 4, 16, 42);
        ctx.fillRect(6, 4, 16, 42);
        ctx.fillStyle = '#0f1220';
        ctx.fillRect(-24, 40, 20, 10);
        ctx.fillRect(4, 40, 20, 10);

        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.roundRect(-27, -54, 54, 66, 14);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = trim;
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(13, -20);
        ctx.lineTo(0, -8);
        ctx.lineTo(-13, -20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#161b2f';
        ctx.fillRect(-24, -1, 48, 10);
        ctx.fillStyle = varOrFallback('--accent-gold', '#ffd84d');
        ctx.fillRect(-8, -1, 16, 10);

        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(0, -68, 17, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(0, -73, 18, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-14, -73, 28, 8);

        ctx.fillStyle = 'rgba(8,12,26,0.85)';
        ctx.fillRect(-11, -69, 22, 8);
        ctx.fillStyle = trim;
        ctx.fillRect(-8, -66, 6, 2);
        ctx.fillRect(2, -66, 6, 2);

        ctx.fillStyle = varOrFallback('--accent-hot', '#ff4d8d');
        ctx.beginPath();
        ctx.arc(-20, -36, 8, 0, Math.PI*2);
        ctx.arc(20, -36, 8, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.roundRect(-38, -45, 12, 34, 6);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(26, -45, 12, 34, 6);
        ctx.fill();

        ctx.fillStyle = accent;
        ctx.fillRect(-39, -17, 13, 10);
        ctx.fillRect(26, -17, 13, 10);

        ctx.fillStyle = shadow;
        ctx.beginPath();
        ctx.ellipse(0, 56, 32, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function varOrFallback(name, fallback) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
    }
    
    document.getElementById('btn-start').addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui', { volume: 0.45, cooldown: 120 });
        player.name = document.getElementById('input-name').value || "ROOKIE";
        player.color = document.getElementById('input-color').value;
        currentChapter = 0;
        startChapter();
    });

    function startChapter() {
        const ch = storyChapters[currentChapter];
        document.getElementById('story-title').innerText = ch.title;
        document.getElementById('story-text').innerText = ch.text;
        
        enemy.name = ch.enemy;
        enemy.color = ch.color;
        enemy.maxHp = ch.hp;
        enemy.hp = ch.hp;
        
        player.hp = player.maxHp;
        player.finisher = 0;
        setLog('Card set. Enter the ring.');
        clearFeedback();

        switchScreen('story');
    }

    document.getElementById('btn-fight').addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui', { volume: 0.42, cooldown: 120 });
        audio.playLoop('bgm_metal', 0.22);
        switchScreen('combat');
        hud.pName.innerText = player.name;
        hud.eName.innerText = enemy.name;
        updateHUD();
        enemy.aiTimer = 2000;
        gameState = 'COMBAT';
        showFeedback('impact', 'BELL RINGS', 700);
        setLog('The bell rings. Pick a move.');
    });

    document.querySelectorAll('#move-menu button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (gameState !== 'COMBAT') return;
            audio.unlock();
            const move = e.currentTarget.getAttribute('data-move');
            executeMove(player, enemy, move);
        });
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        audio.unlock();
        audio.playSfx('sfx_ui', { volume: 0.42, cooldown: 120 });
        audio.playLoop('bgm_metal', 0.2);

        if (document.getElementById('result-title').innerText === "CARD ADVANCE") {
            currentChapter++;
            if (currentChapter >= storyChapters.length) {
                currentChapter = 0;
                player.maxHp += 20;
            }
            startChapter();
        } else {
            startChapter();
        }
    });

    function switchScreen(id) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        screens[id].classList.remove('hidden');
        gameState = id.toUpperCase();

        if (id !== 'combat') {
            audio.stopLoop();
        }
    }

    window.addEventListener('pointerdown', () => audio.unlock(), { once: true });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            audio.pauseLoop();
        } else if (gameState === 'COMBAT') {
            audio.resumeLoop();
        }
    });
});
</script>
</body>
</html>
