<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Chef's Catch</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream-100: #fff7e8;
            --cream-200: #ffe7c2;
            --orange-400: #fb923c;
            --orange-500: #f97316;
            --orange-700: #c2410c;
            --gold-300: #fde68a;
            --green-400: #4ade80;
            --green-600: #16a34a;
            --red-400: #f87171;
            --red-500: #ef4444;
            --plum-700: #5b2141;
            --brown-900: #3b2416;
            --ink-700: #374151;
            --ink-900: #1f2937;
            --white: #ffffff;
            --shadow-soft: 0 14px 32px rgba(59, 36, 22, 0.2);
            --shadow-glow: 0 0 0 2px rgba(255, 248, 225, 0.55), 0 18px 36px rgba(194, 65, 12, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 243, 224, 0.95), rgba(255, 224, 178, 0.75) 40%, rgba(255, 183, 77, 0.4) 100%),
                linear-gradient(180deg, #fffaf0 0%, #ffe8bf 100%);
            color: var(--ink-900);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 15%, rgba(255, 255, 255, 0.48), transparent 22%),
                radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.42), transparent 18%),
                linear-gradient(90deg, transparent 0 7%, rgba(255, 255, 255, 0.08) 7% 8%, transparent 8% 100%);
            opacity: 0.85;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transition: transform 0.12s ease;
            touch-action: none;
        }

        button {
            font: inherit;
        }

        .screen-title,
        .cta-btn,
        .hud-value,
        .result-label {
            font-family: 'Bangers', 'Rajdhani', system-ui, sans-serif;
            letter-spacing: 0.04em;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay-card {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 252, 244, 0.92), rgba(255, 239, 205, 0.88));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: var(--shadow-glow);
            border-radius: 28px;
            text-align: center;
            pointer-events: auto;
            width: min(90vw, 460px);
            padding: 40px 32px;
            overflow: hidden;
        }

        .overlay-card::before,
        .overlay-card::after {
            content: '';
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .overlay-card::before {
            width: 120px;
            height: 120px;
            top: -40px;
            right: -36px;
            background: radial-gradient(circle, rgba(255, 221, 87, 0.95) 0%, rgba(249, 115, 22, 0.18) 68%, transparent 70%);
        }

        .overlay-card::after {
            width: 140px;
            height: 140px;
            bottom: -60px;
            left: -46px;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.28) 0%, rgba(74, 222, 128, 0.02) 66%, transparent 68%);
        }

        .overlay-card.start-card {
            transition: transform 0.3s ease;
        }

        .overlay-card.start-card:hover {
            transform: scale(1.05);
        }

        .emoji-hero {
            position: relative;
            font-size: clamp(4rem, 9vw, 5rem);
            margin-bottom: 18px;
            filter: drop-shadow(0 10px 12px rgba(194, 65, 12, 0.22));
            animation: chefBob 2.2s ease-in-out infinite;
        }

        .emoji-hero::after {
            content: '✨';
            position: absolute;
            top: -6px;
            right: -10px;
            font-size: 0.42em;
            animation: sparkleTwinkle 1.6s ease-in-out infinite;
        }

        .screen-title {
            position: relative;
            z-index: 1;
            margin: 0 0 8px;
            color: var(--orange-700);
            font-size: clamp(2.3rem, 7vw, 3.6rem);
            line-height: 0.95;
            text-shadow: 0 3px 0 rgba(255, 247, 232, 0.9), 0 8px 16px rgba(194, 65, 12, 0.22);
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--plum-700);
            font-size: clamp(1.1rem, 3.4vw, 1.45rem);
            font-weight: 600;
        }

        .helper-copy {
            margin: -6px 0 28px;
            color: var(--ink-900);
            font-size: clamp(1rem, 2.8vw, 1.15rem);
            line-height: 1.3;
        }

        .hero-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: -8px 0 24px;
        }

        .hero-badge {
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(194, 65, 12, 0.16);
            background: rgba(255, 255, 255, 0.68);
            color: var(--brown-900);
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 6px 12px rgba(194, 65, 12, 0.08);
        }

        .cta-btn {
            position: relative;
            z-index: 1;
            border: 0;
            border-radius: 999px;
            color: var(--white);
            cursor: pointer;
            padding: 14px 36px;
            font-size: clamp(1rem, 3vw, 1.35rem);
            box-shadow: 0 12px 22px rgba(59, 36, 22, 0.18);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .cta-btn:hover {
            filter: brightness(1.06);
            box-shadow: 0 16px 26px rgba(59, 36, 22, 0.22);
        }

        .cta-btn:active {
            transform: scale(0.95);
        }

        .cta-btn--start {
            background: linear-gradient(180deg, var(--orange-400), var(--orange-700));
        }

        .cta-btn--restart {
            background: linear-gradient(180deg, var(--green-400), var(--green-600));
        }

        .hidden {
            display: none !important;
        }

        .game-over-title {
            margin: 0 0 10px;
            color: var(--red-500);
            font-size: clamp(2.1rem, 7vw, 3.2rem);
            line-height: 1;
        }

        .result-line {
            margin: 0 0 24px;
            color: var(--ink-900);
            font-size: clamp(1.2rem, 3.6vw, 1.8rem);
            font-weight: 600;
        }

        .result-label {
            color: var(--orange-700);
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        .hud {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .hud-row {
            min-width: 134px;
            padding: 8px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.58);
            background: rgba(255, 251, 243, 0.7);
            box-shadow: var(--shadow-soft);
            font-size: clamp(0.95rem, 2.8vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            text-shadow: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hud-row--score {
            color: var(--orange-700);
        }

        .hud-row--lives {
            color: var(--red-500);
        }

        .hud-value {
            margin-left: 6px;
        }

        .feedback-gif {
            position: absolute;
            right: 18px;
            width: min(28vw, 130px);
            border-radius: 18px;
            box-shadow: 0 10px 18px rgba(31, 41, 55, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.65);
            opacity: 0;
            transform: translateY(8px) scale(0.9);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 3;
            background: rgba(255, 255, 255, 0.25);
        }

        .feedback-gif.is-visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .feedback-gif--celebrate {
            top: 18px;
        }

        .feedback-gif--danger {
            bottom: 24px;
        }

        @keyframes chefBob {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-6px) rotate(2deg);
            }
        }

        @keyframes sparkleTwinkle {
            0%, 100% {
                transform: scale(0.75);
                opacity: 0.45;
            }
            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        @media (max-width: 640px) {
            .overlay-card {
                padding: 32px 22px;
                width: min(92vw, 420px);
            }

            .hud {
                top: 16px;
                left: 16px;
            }

            .feedback-gif {
                right: 10px;
                width: min(26vw, 96px);
            }

            .feedback-gif--celebrate {
                top: 86px;
            }

            .feedback-gif--danger {
                bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: celebrate/fail overlays -> catalogs/gifs.json -->
            <img id="celebrate-gif" class="feedback-gif feedback-gif--celebrate" src="https://i.giphy.com/l4FGpPki5v2Bcd6Ss.webp" alt="Celebration reaction" aria-hidden="true">
            <img id="danger-gif" class="feedback-gif feedback-gif--danger" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Danger reaction" aria-hidden="true">

            <!-- Start Screen -->
            <div id="start-screen" class="overlay-card start-card">
                <div class="emoji-hero" aria-hidden="true">👨‍🍳</div>
                <h1 class="screen-title">CHEF'S CATCH</h1>
                <p class="subtitle">Slide the skillet and serve the dinner rush.</p>
                <div class="hero-badges" aria-hidden="true">
                    <span class="hero-badge">🥕 fresh</span>
                    <span class="hero-badge">🪰 dodge junk</span>
                    <span class="hero-badge">🔥 keep the kitchen alive</span>
                </div>
                <p class="helper-copy">Catch bright ingredients, dodge grimy hazards, and protect Chef Pepper's perfect service streak.</p>
                <button id="start-btn" class="cta-btn cta-btn--start">
                    START COOKING
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden overlay-card">
                <h2 class="screen-title game-over-title">KITCHEN CLOSED!</h2>
                <div class="result-line">Meals served:<span id="finalScore" class="result-label"> 0</span></div>
                <button id="restart-btn" class="cta-btn cta-btn--restart">
                    COOK AGAIN
                </button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="hud-row hud-row--score">
                    Score:<span id="score" class="hud-value">0</span>
                </div>
                <div class="hud-row hud-row--lives">
                    Lives:<span id="lives" class="hud-value">❤️❤️❤️</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/music_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                danger: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3",
                gameOver: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.ready = false;
                this.bgm = this.createAudio(ASSETS.bgm, 0.2, true);
                this.pools = Object.fromEntries(Object.entries(ASSETS.sfx).map(([key, url]) => [key, this.createAudio(url, this.volumeFor(key), false)]));
                this.cooldowns = { danger: 0, score: 0, fail: 0 };
            }

            createAudio(src, volume, loop) {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.volume = volume;
                audio.loop = loop;
                return audio;
            }

            volumeFor(key) {
                return {
                    start: 0.55,
                    score: 0.42,
                    danger: 0.3,
                    fail: 0.5,
                    gameOver: 0.5,
                    click: 0.38
                }[key] ?? 0.4;
            }

            async unlock() {
                if (this.ready) return;
                this.ready = true;
                try {
                    this.bgm.load();
                    Object.values(this.pools).forEach((audio) => audio.load());
                } catch (_) {}
            }

            playBGM() {
                if (!this.ready) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key) {
                if (!this.ready || !this.pools[key]) return;
                const now = performance.now();
                const cooldown = key === 'danger' ? 900 : key === 'score' ? 90 : key === 'fail' ? 220 : 0;
                if (cooldown && now - (this.cooldowns[key] || 0) < cooldown) return;
                this.cooldowns[key] = now;
                const clone = this.pools[key].cloneNode();
                clone.volume = this.pools[key].volume;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const celebrateGif = document.getElementById('celebrate-gif');
        const dangerGif = document.getElementById('danger-gif');
        let width, height;
        let gameActive = false;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let difficultyMultiplier = 1;
        let celebrationTimer = null;
        let dangerTimer = null;

        // Player (Pan)
        let player = {
            x: 0,
            y: 0,
            width: 80,
            height: 20,
            color: '#374151'
        };

        // Falling Items
        let items = [];
        const GOOD_ITEMS = ['🥦', '🥩', '🍅', '🥕', '🧀', '🍤', '🌽', '🌶️'];
        const BAD_ITEMS = ['🪰', '🦠', '🦴', '👞', '🕷️'];

        // Background Particles (Steam)
        let particles = [];

        function toggleGif(el, visible, timerName) {
            el.classList.toggle('is-visible', visible);
            if (timerName === 'celebrationTimer' && celebrationTimer) clearTimeout(celebrationTimer);
            if (timerName === 'dangerTimer' && dangerTimer) clearTimeout(dangerTimer);
            if (visible) {
                const timer = setTimeout(() => el.classList.remove('is-visible'), timerName === 'celebrationTimer' ? 950 : 1200);
                if (timerName === 'celebrationTimer') celebrationTimer = timer;
                if (timerName === 'dangerTimer') dangerTimer = timer;
            }
        }

        function showCelebrate() {
            toggleGif(celebrateGif, true, 'celebrationTimer');
        }

        function showDanger() {
            toggleGif(dangerGif, true, 'dangerTimer');
        }

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            player.y = height - 100;
            player.x = width / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        function handleInput(clientX) {
            if (!gameActive) return;
            player.x = clientX;
            if (player.x < player.width / 2) player.x = player.width / 2;
            if (player.x > width - player.width / 2) player.x = width - player.width / 2;
        }

        canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 4. GAME LOGIC */
        function spawnItem() {
            const isBad = Math.random() < 0.25;
            const content = isBad
                ? BAD_ITEMS[Math.floor(Math.random() * BAD_ITEMS.length)]
                : GOOD_ITEMS[Math.floor(Math.random() * GOOD_ITEMS.length)];

            items.push({
                x: Math.random() * (width - 40) + 20,
                y: -50,
                speed: (Math.random() * 2 + 3) * difficultyMultiplier,
                content: content,
                isBad: isBad,
                size: 40,
                rotation: Math.random() * Math.PI,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function createParticles() {
            if (frameCount % 20 === 0) {
                particles.push({
                    x: Math.random() * width,
                    y: height + 20,
                    size: Math.random() * 20 + 10,
                    speed: Math.random() * 1 + 0.5,
                    opacity: 0.5
                });
            }
        }

        function update() {
            frameCount++;
            difficultyMultiplier = 1 + (score / 50);

            if (frameCount % Math.max(20, Math.floor(60 - score / 2)) === 0) {
                spawnItem();
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.rotation += item.rotSpeed;

                const dx = item.x - player.x;
                const dy = item.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < (player.width / 2 + item.size / 2) && item.y < player.y + 20) {
                    if (item.isBad) {
                        audio.playSFX('fail');
                        lives--;
                        updateLivesDisplay();
                        showDanger();
                        if (lives === 1) {
                            audio.playSFX('danger');
                        }
                        canvas.style.transform = "translate(5px, 5px)";
                        setTimeout(() => canvas.style.transform = "none", 100);
                    } else {
                        audio.playSFX('score');
                        score++;
                        document.getElementById('score').innerText = score;
                        if (score % 3 === 0) {
                            showCelebrate();
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > height) {
                    items.splice(i, 1);
                }
            }

            createParticles();
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.y -= p.speed;
                p.x += Math.sin(frameCount * 0.01 + p.y * 0.01) * 0.5;
                p.opacity -= 0.002;
                if (p.opacity <= 0) particles.splice(i, 1);
            }

            if (lives <= 0) {
                gameOver();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#fff8ec');
            grad.addColorStop(0.55, '#ffe4b5');
            grad.addColorStop(1, '#ffbf69');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const stripeHeight = Math.max(48, height * 0.08);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            for (let y = 0; y < height; y += stripeHeight * 2) {
                ctx.fillRect(0, y, width, stripeHeight);
            }

            const floorGradient = ctx.createLinearGradient(0, height * 0.72, 0, height);
            floorGradient.addColorStop(0, 'rgba(168, 85, 247, 0.06)');
            floorGradient.addColorStop(1, 'rgba(91, 33, 65, 0.22)');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, height * 0.72, width, height * 0.28);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            particles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.save();
            ctx.translate(player.x, player.y);

            ctx.fillStyle = '#6b7280';
            ctx.beginPath();
            ctx.roundRect(26, -7, 58, 12, 6);
            ctx.fill();

            const panGradient = ctx.createLinearGradient(-42, -22, 42, 16);
            panGradient.addColorStop(0, '#9ca3af');
            panGradient.addColorStop(0.5, '#4b5563');
            panGradient.addColorStop(1, '#111827');
            ctx.fillStyle = panGradient;
            ctx.beginPath();
            ctx.arc(0, 0, 40, Math.PI, 0, false);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.ellipse(0, 0, 34, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            const foodGradient = ctx.createRadialGradient(-8, -10, 6, -6, -6, 28);
            foodGradient.addColorStop(0, '#fde68a');
            foodGradient.addColorStop(1, '#f97316');
            ctx.fillStyle = foodGradient;
            ctx.beginPath();
            ctx.ellipse(-6, -11, 17, 8, 0.18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.ellipse(8, -9, 10, 5, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-10, -7, 2.5, 0, Math.PI * 2);
            ctx.arc(9, -6, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3b2416';
            ctx.beginPath();
            ctx.arc(-10, -7, 1.1, 0, Math.PI * 2);
            ctx.arc(9, -6, 1.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#3b2416';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(-1, -1, 9, 0.2, Math.PI - 0.2, false);
            ctx.stroke();

            ctx.restore();

            ctx.font = "40px 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.rotate(item.rotation);
                ctx.shadowColor = item.isBad ? 'rgba(239, 68, 68, 0.35)' : 'rgba(249, 115, 22, 0.25)';
                ctx.shadowBlur = 10;
                ctx.fillText(item.content, 0, 0);
                ctx.restore();
            });
        }

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            for (let i = lives; i < 3; i++) hearts += '🖤';
            document.getElementById('lives').innerText = hearts;
        }

        function initGame() {
            score = 0;
            lives = 3;
            frameCount = 0;
            items = [];
            particles = [];
            difficultyMultiplier = 1;
            document.getElementById('score').innerText = score;
            updateLivesDisplay();
            celebrateGif.classList.remove('is-visible');
            dangerGif.classList.remove('is-visible');
            resize();
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startSession() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            audio.playBGM();
            gameLoop();
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('gameOver');
            showDanger();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 6. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('start');
            startSession();
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            await audio.unlock();
            audio.playSFX('click');
            startSession();
        });
    });
    </script>
</body>
</html>
