<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUARANTINE: SECURITY SWEEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #58f7ff;
            --danger-color: #ff5f7a;
            --warning-color: #ffd166;
            --bg-dark: #050817;
            --panel-dark: rgba(6, 10, 28, 0.88);
            --panel-mid: rgba(12, 20, 48, 0.74);
            --panel-soft: rgba(22, 36, 74, 0.4);
            --white-soft: rgba(227, 240, 255, 0.5);
            --text-main: #f5fbff;
            --font-display: 'Audiowide', 'Orbitron', system-ui, sans-serif;
            --font-ui: 'Exo 2', system-ui, sans-serif;
            --scanline: rgba(88, 247, 255, 0.08);
            --glow-soft: 0 0 20px rgba(88, 247, 255, 0.2);
            --glow-strong: 0 0 32px rgba(88, 247, 255, 0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(88, 247, 255, 0.16), transparent 34%),
                radial-gradient(circle at bottom, rgba(255, 95, 122, 0.12), transparent 32%),
                linear-gradient(180deg, #090d1f 0%, #050817 52%, #03040b 100%);
            overflow: hidden;
            font-family: var(--font-ui);
            color: var(--theme-color);
        }

        body {
            position: relative;
            letter-spacing: 0.04em;
        }

        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .glitch-text { animation: glitch 1s linear infinite; }

        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }

        .hidden { display: none !important; }
        input:focus { outline: none; }

        .screen-root {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .full-canvas {
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding:
                max(1rem, env(safe-area-inset-top))
                max(1rem, env(safe-area-inset-right))
                max(1.5rem, env(safe-area-inset-bottom))
                max(1rem, env(safe-area-inset-left));
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .status-panel {
            font-size: 1.2rem;
            letter-spacing: 0.18em;
            background: linear-gradient(180deg, rgba(10, 18, 42, 0.94), rgba(8, 12, 26, 0.82));
            padding: 0.75rem 0.9rem;
            border: 1px solid rgba(88, 247, 255, 0.7);
            border-radius: 0.8rem;
            color: var(--text-main);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), var(--glow-soft);
            backdrop-filter: blur(8px);
        }

        .timer-display {
            font-family: var(--font-display);
            font-size: 2.25rem;
            font-weight: 400;
            color: var(--danger-color);
            background: linear-gradient(180deg, rgba(27, 10, 24, 0.95), rgba(14, 6, 18, 0.88));
            padding: 0.45rem 1rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255, 95, 122, 0.8);
            box-shadow: inset 0 0 18px rgba(255, 95, 122, 0.14), 0 0 24px rgba(255, 95, 122, 0.24);
        }

        .input-area {
            pointer-events: auto;
            width: 100%;
            max-width: 32rem;
            margin: 0 auto 5rem;
            transition: opacity 300ms;
            background: linear-gradient(180deg, rgba(8, 14, 36, 0.9), rgba(5, 8, 22, 0.85));
            border: 1px solid rgba(88, 247, 255, 0.42);
            border-radius: 1rem;
            padding: 0.9rem;
            box-shadow: var(--glow-soft);
            backdrop-filter: blur(10px);
        }

        .input-label {
            display: inline-block;
            font-family: var(--font-display);
            font-size: 0.72rem;
            margin-bottom: 0.55rem;
            color: var(--warning-color);
            text-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        .password-input {
            width: 100%;
            background: rgba(0, 6, 18, 0.92);
            border: 2px solid rgba(88, 247, 255, 0.78);
            color: var(--text-main);
            padding: 0.9rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-family: var(--font-ui);
            border-radius: 0.8rem;
            box-shadow: inset 0 0 14px rgba(88, 247, 255, 0.12);
        }

        .password-input::placeholder {
            color: rgba(51, 255, 51, 0.35);
        }

        .submit-btn {
            background: linear-gradient(180deg, #78fbff, #3fd8ff);
            color: #031018;
            padding: 0 1.25rem;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            min-width: 3.75rem;
            border-radius: 0.8rem;
            box-shadow: 0 0 18px rgba(88, 247, 255, 0.28);
        }

        .submit-btn:hover,
        .primary-btn:hover,
        .secondary-btn:hover,
        .danger-btn:hover {
            filter: brightness(1.15);
        }

        .needle-app {
            position: absolute;
            top: 50%;
            right: 2rem;
            width: 5rem;
            height: 5rem;
            z-index: 40;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 150ms ease;
        }

        .needle-app:active { transform: scale(0.9); }

        .needle-shell {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(88, 247, 255, 0.55);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 30% 30%, rgba(88, 247, 255, 0.2), transparent 45%),
                linear-gradient(180deg, rgba(8, 16, 38, 0.95), rgba(5, 9, 24, 0.88));
            backdrop-filter: blur(8px);
            box-shadow: var(--glow-soft);
        }

        .needle-icon {
            width: 4rem;
            height: 4rem;
            object-fit: contain;
            opacity: 0.85;
        }

        .needle-label {
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.62rem;
            letter-spacing: 0.12em;
            margin-top: 0.35rem;
            background: rgba(7, 14, 30, 0.82);
            color: var(--text-main);
            padding: 0.2rem 0.35rem;
            border-radius: 999px;
            border: 1px solid rgba(88, 247, 255, 0.28);
        }

        .overlay,
        .start-screen,
        .end-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .overlay {
            background: rgba(2, 6, 18, 0.86);
            backdrop-filter: blur(10px);
        }

        .start-screen {
            background:
                radial-gradient(circle at center, rgba(88, 247, 255, 0.14), transparent 40%),
                rgba(1, 4, 14, 0.92);
            text-align: center;
            padding: 1.5rem;
        }

        .end-screen {
            background:
                radial-gradient(circle at top, rgba(255, 95, 122, 0.14), transparent 35%),
                #040612;
            text-align: center;
            padding: 1.5rem;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 12vw, 5.6rem);
            margin: 0 0 1rem;
            color: var(--text-main);
            line-height: 0.95;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(88, 247, 255, 0.45), 0 0 36px rgba(88, 247, 255, 0.22);
        }

        .hero-copy,
        .end-copy {
            font-size: 1.02rem;
            color: #d7e8f7;
            margin: 0 0 2rem;
            max-width: 40rem;
            line-height: 1.45;
        }

        .primary-btn,
        .secondary-btn,
        .danger-btn {
            cursor: pointer;
            transition: all 180ms ease;
            font-family: var(--font-ui);
        }

        .primary-btn {
            padding: 0.9rem 2rem;
            border: 2px solid rgba(88, 247, 255, 0.78);
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(12, 30, 64, 0.92), rgba(8, 15, 34, 0.92));
            font-size: 1.1rem;
            text-transform: uppercase;
            border-radius: 999px;
            box-shadow: var(--glow-soft);
        }

        .primary-btn:hover {
            background: linear-gradient(180deg, #6cfaff, #39dbff);
            color: #031018;
        }

        .secondary-btn {
            padding: 0.9rem 2rem;
            background: linear-gradient(180deg, #ffffff, #d8eefc);
            color: #06101e;
            font-size: 1rem;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            box-shadow: 0 0 18px rgba(216, 238, 252, 0.24);
        }

        .danger-btn {
            font-family: var(--font-display);
            background: linear-gradient(180deg, #ff6b86, #cf274d);
            color: #fff;
            font-size: clamp(1.7rem, 5vw, 2.35rem);
            padding: 1rem 2.2rem;
            border: 3px solid #fff;
            border-radius: 1.25rem;
            box-shadow: 0 0 30px rgba(255, 95, 122, 0.5);
            text-transform: uppercase;
        }

        .danger-btn:hover {
            background: #ef4444;
            transform: scale(1.05);
        }

        .end-image {
            width: 100%;
            max-width: 32rem;
            height: auto;
            object-fit: contain;
            margin-bottom: 1rem;
            border: 2px solid var(--danger-color);
            border-radius: 1rem;
            box-shadow: 0 0 28px rgba(255, 95, 122, 0.24);
        }

        .end-title {
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 10vw, 4.75rem);
            margin: 0 0 0.5rem;
            text-align: center;
            color: var(--danger-color);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 95, 122, 0.34);
        }

        .feedback-gif {
            position: absolute;
            z-index: 45;
            width: min(30vw, 10rem);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 24px rgba(88, 247, 255, 0.22);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            background: rgba(3, 7, 18, 0.7);
        }

        .feedback-gif.active {
            opacity: 0.94;
            transform: scale(1);
        }

        .feedback-gif--alert {
            top: 6.5rem;
            right: 1.25rem;
        }

        .feedback-gif--purge {
            left: 1.25rem;
            bottom: 8.25rem;
        }

        @media (max-width: 640px) {
            .ui-layer { padding:
                max(0.9rem, env(safe-area-inset-top))
                max(0.9rem, env(safe-area-inset-right))
                max(1rem, env(safe-area-inset-bottom))
                max(0.9rem, env(safe-area-inset-left)); }
            .hud-row { flex-direction: column; align-items: stretch; }
            .status-panel { font-size: 0.98rem; letter-spacing: 0.12em; }
            .timer-display { align-self: flex-end; font-size: 1.8rem; }
            .input-area { margin-bottom: 1rem; padding: 0.75rem; max-width: 100%; }
            .input-row { gap: 0.4rem; }
            .password-input { font-size: 1rem; padding: 0.8rem; letter-spacing: 0.14em; min-width: 0; }
            .submit-btn { padding: 0 1rem; flex: 0 0 auto; }
            .needle-app { right: max(1rem, env(safe-area-inset-right)); width: 4.5rem; height: 4.5rem; }
            .needle-icon { width: 3.2rem; height: 3.2rem; }
            .hero-copy, .end-copy { font-size: 0.96rem; }
            .feedback-gif {
                width: min(34vw, 7rem);
                border-radius: 0.8rem;
            }
            .feedback-gif--alert {
                top: auto;
                right: 1rem;
                bottom: 8rem;
            }
            .feedback-gif--purge {
                left: 1rem;
                bottom: 8rem;
            }
        }

        @media (max-width: 420px) {
            /* [agent-note][stage4] repaired: mobile actionability | element: .input-row | action: stacked controls to keep submit reachable above keyboard */
            .input-row {
                flex-direction: column;
            }

            .submit-btn,
            .primary-btn,
            .secondary-btn {
                min-height: 3rem;
                width: 100%;
            }

            .danger-btn {
                width: 100%;
                max-width: 18rem;
                font-size: clamp(1.35rem, 7vw, 1.9rem);
                padding: 0.9rem 1.2rem;
            }

            .start-screen,
            .end-screen {
                justify-content: flex-start;
                padding-top: max(2rem, env(safe-area-inset-top));
                overflow-y: auto;
            }
        }
    </style>
</head>

<script>
/** 
 * CORE ARCHITECTURE 
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = {
    start: document.getElementById('start-screen'),
    end: document.getElementById('end-screen'),
    hud: document.getElementById('ui-layer'),
    needle: document.getElementById('needle-app'),
    deleteOverlay: document.getElementById('delete-overlay'),
    passwordInput: document.getElementById('password-input'),
    timer: document.getElementById('timer-display'),
    status: document.getElementById('status-text'),
    endTitle: document.getElementById('end-title'),
    endDesc: document.getElementById('end-desc'),
    endImg: document.getElementById('end-img'),
    alertGif: document.getElementById('alert-gif'),
    purgeGif: document.getElementById('purge-gif')
};

// Config
let gameConfig = {
    patienceTime: 15,
    shakeIntensity: 5,
    themeColor: "#33ff33"
};

// State
let gameState = 'INIT'; // INIT, PLAYING, ENDED
let timeLeft = 0;
let needleTaps = 0;
let shake = 0;
let neopakMood = 0; // 0 = calm, 1 = angry
let particles = [];
let lastTime = 0;
let glitchIntensity = 0;

// Audio Context
let audioCtx;
let ambientNodes = null;
let lastWarningBucket = 3;
let activeGifTimer = 0;

/**
 * AUDIO SYSTEM
 */
const AudioSys = {
    init: async () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (e) {}
        }
    },
    playTone: (freq, type, duration, volume = 0.08) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    },
    playNoise: (duration, volume = 0.12) => {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.value = volume;
        noise.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    },
    playSample: (id, volume = 0.55) => {
        const el = document.getElementById(id);
        if (!el) return;
        try {
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            const playPromise = el.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    if (id === 'sfx_warning') {
                        AudioSys.playTone(220, 'triangle', 0.09, 0.04);
                    } else if (id === 'sfx_fail') {
                        AudioSys.playTone(110, 'sawtooth', 0.22, 0.05);
                    } else if (id === 'sfx_purge' || id === 'sfx_unlock') {
                        AudioSys.playTone(880, 'square', 0.08, 0.04);
                    } else {
                        AudioSys.playTone(520, 'sine', 0.05, 0.035);
                    }
                });
            }
        } catch (e) {
            AudioSys.playTone(520, 'sine', 0.05, 0.035);
        }
    },
    startLoop: () => {
        const el = document.getElementById('bgm_loop');
        if (!el) return;
        try {
            el.volume = 0.2;
            const playPromise = el.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    if (!audioCtx || ambientNodes) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const tremolo = audioCtx.createOscillator();
                    const tremoloGain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(72, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.018, audioCtx.currentTime);
                    tremolo.type = 'sine';
                    tremolo.frequency.setValueAtTime(0.18, audioCtx.currentTime);
                    tremoloGain.gain.setValueAtTime(0.006, audioCtx.currentTime);
                    tremolo.connect(tremoloGain);
                    tremoloGain.connect(gain.gain);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    tremolo.start();
                    ambientNodes = { osc, gain, tremolo, tremoloGain };
                });
            }
        } catch (e) {}
    },
    stopLoop: () => {
        const el = document.getElementById('bgm_loop');
        if (el) {
            try { el.pause(); } catch (e) {}
        }
        if (ambientNodes) {
            try { ambientNodes.osc.stop(); } catch (e) {}
            try { ambientNodes.tremolo.stop(); } catch (e) {}
            ambientNodes = null;
        }
    },
    pulseWarning: () => {
        AudioSys.playSample('sfx_warning', 0.35);
        AudioSys.playTone(220, 'triangle', 0.09, 0.04);
    }
};

function showFeedbackGif(target, duration = 1200) {
    if (!target) return;
    clearTimeout(activeGifTimer);
    [ui.alertGif, ui.purgeGif].forEach((gif) => {
        if (!gif) return;
        gif.hidden = true;
        gif.classList.remove('active');
    });
    target.hidden = false;
    requestAnimationFrame(() => target.classList.add('active'));
    activeGifTimer = window.setTimeout(() => {
        target.classList.remove('active');
        window.setTimeout(() => { target.hidden = true; }, 180);
    }, duration);
}

/**
 * GAME LOOP
 */
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function spawnParticles(x, y, color) {
    for(let i=0; i<30; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20,
            life: 1.0,
            color: color
        });
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Timer Logic
    timeLeft -= dt;
    if (timeLeft <= 0) {
        triggerEnding('DEATH');
        return;
    }

    // Mood Logic
    neopakMood = 1 - (timeLeft / gameConfig.patienceTime); // 0 to 1
    shake = neopakMood > 0.7 ? (neopakMood - 0.7) * 20 * Math.random() : 0;
    
    // UI Update
    ui.timer.innerText = timeLeft.toFixed(2);
    ui.timer.style.opacity = (timeLeft < 5 && Math.floor(Date.now() / 200) % 2 === 0) ? 0.2 : 1;

    if (timeLeft > gameConfig.patienceTime * 0.66) {
        ui.status.innerText = 'SCANNING SIGNAL';
    } else if (timeLeft > gameConfig.patienceTime * 0.33) {
        ui.status.innerText = 'THREAT ESCALATING';
    } else {
        ui.status.innerText = 'LOCKDOWN IMMINENT';
    }

    const warningBucket = timeLeft < gameConfig.patienceTime * 0.2 ? 0 : timeLeft < gameConfig.patienceTime * 0.45 ? 1 : timeLeft < gameConfig.patienceTime * 0.7 ? 2 : 3;
    if (warningBucket < lastWarningBucket) {
        AudioSys.pulseWarning();
        showFeedbackGif(ui.alertGif, 900);
        lastWarningBucket = warningBucket;
    }

    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
    });
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    // Clear
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, w, h);

    // Camera Shake
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // Draw Intruder
    ctx.fillStyle = 'rgba(88, 247, 255, 0.1)';
    ctx.beginPath();
    ctx.arc(w / 2, h / 2 + 40, Math.min(w, h) * 0.22, 0, Math.PI * 2);
    ctx.fill();

    const img = document.getElementById('asset_neopak');
    if (img && img.complete && img.naturalWidth > 0) {
        // Breathing effect
        const scale = 1 + Math.sin(Date.now() / 500) * 0.02 + (neopakMood * 0.1);
        const nw = Math.min(w, h * 0.8) * scale;
        const nh = (nw / img.naturalWidth) * img.naturalHeight;
        
        const baseX = (w - nw) / 2;
        const baseY = (h - nh) / 2 + 50;

        // Threat tint based on mood
        ctx.globalAlpha = 0.22 + (neopakMood * 0.78);
        ctx.drawImage(img, baseX, baseY, nw, nh);

        // Character-first framing aura
        ctx.globalAlpha = 1;
        ctx.strokeStyle = neopakMood > 0.6 ? 'rgba(255, 95, 122, 0.85)' : 'rgba(88, 247, 255, 0.8)';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 24;
        ctx.shadowColor = neopakMood > 0.6 ? 'rgba(255, 95, 122, 0.45)' : 'rgba(88, 247, 255, 0.4)';
        ctx.strokeRect(baseX - 10, baseY - 10, nw + 20, nh + 20);
        ctx.shadowBlur = 0;

        // Expressive scan visor
        const eyeY = baseY + nh * 0.24;
        const eyeLeftX = baseX + nw * 0.34;
        const eyeRightX = baseX + nw * 0.66;
        const eyeWidth = Math.max(18, nw * 0.08);
        const eyeHeight = Math.max(8, nh * 0.025);
        ctx.fillStyle = neopakMood > 0.55 ? '#ff5f7a' : '#58f7ff';
        ctx.fillRect(eyeLeftX - eyeWidth / 2, eyeY, eyeWidth, eyeHeight);
        ctx.fillRect(eyeRightX - eyeWidth / 2, eyeY, eyeWidth, eyeHeight);

        // Glitch slices
        if (neopakMood > 0.5 && Math.random() < neopakMood) {
            const sliceH = Math.random() * 50;
            const sliceY = Math.random() * nh;
            const offsetX = (Math.random() - 0.5) * 50;
            ctx.drawImage(img, 
                0, sliceY, img.naturalWidth, sliceH,
                (w - nw)/2 + offsetX, (h - nh)/2 + 50 + sliceY, nw, sliceH
            );
        }
    } else {
        // Fallback drawing
        ctx.strokeStyle = gameConfig.themeColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(w/2 - 100, h/2 - 100, 200, 200);
        ctx.fillText("THREAT_LOADING...", w/2 - 60, h/2);
    }

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

     // CRT Overlay Lines
     ctx.restore();
     ctx.fillStyle = "rgba(88, 247, 255, 0.06)";
     for (let y = 0; y < h; y += 4) {
         ctx.fillRect(0, y, w, 1);
     }

     // Scanner frame
     ctx.strokeStyle = "rgba(88, 247, 255, 0.16)";
     ctx.lineWidth = 2;
     ctx.strokeRect(14, 14, w - 28, h - 28);
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        update(dt);
        draw();
    } catch (e) {
        console.error(e);
    }
    requestAnimationFrame(loop);
}

/**
 * GAME LOGIC
 */
async function startGame() {
    await AudioSys.init();
    AudioSys.playSample('sfx_start', 0.5);
    AudioSys.playTone(440, 'sine', 0.08, 0.04);
    
    gameState = 'PLAYING';
    timeLeft = gameConfig.patienceTime;
    needleTaps = 0;
    neopakMood = 0;
    particles = [];
    lastWarningBucket = 3;
    ui.status.innerText = 'SCANNING SIGNAL';
    
    ui.start.classList.add('hidden');
    ui.end.classList.add('hidden');
    ui.needle.classList.remove('hidden');
    ui.deleteOverlay.classList.add('hidden');
    ui.endImg.classList.add('hidden');
    ui.passwordInput.value = '';
    ui.passwordInput.focus();
    showFeedbackGif(ui.alertGif, 1000);
    
    // Position Purge Tool randomly on right side
    ui.needle.style.top = (20 + Math.random() * 60) + '%';
    
    // Start ambient loop after user gesture
    AudioSys.startLoop();
}

function triggerEnding(type) {
    gameState = 'ENDED';
    AudioSys.stopLoop();
    ui.needle.classList.add('hidden');
    ui.deleteOverlay.classList.add('hidden');
    ui.end.classList.remove('hidden');
    
    const deathMeme = document.getElementById('asset_death');
    
    if (type === 'DEATH') {
        AudioSys.playSample('sfx_fail', 0.52);
        AudioSys.playTone(100, 'sawtooth', 0.4, 0.05);
        document.body.style.backgroundColor = '#500';
        ui.endTitle.innerText = "BREACH CONFIRMED";
        ui.endDesc.innerText = "The rogue signal fully breached the console before you responded.";
        ui.endTitle.style.color = "#ff0000";
        if (deathMeme.src) {
            ui.endImg.src = deathMeme.src;
            ui.endImg.classList.remove('hidden');
        }
        showFeedbackGif(ui.alertGif, 1800);
        setTimeout(() => document.body.style.backgroundColor = '#000', 200);
    } 
    else if (type === 'KNOCK') {
        AudioSys.playSample('sfx_submit', 0.5);
        AudioSys.playSample('sfx_fail', 0.48);
        ui.endTitle.innerText = "CODE FLAGGED";
        ui.endDesc.innerText = "Your clearance code exposed the signal and forced the scan to halt.";
        ui.endTitle.style.color = "#ffffff";
        ui.endImg.classList.add('hidden');
        showFeedbackGif(ui.alertGif, 1500);
    } 
    else if (type === 'GLITCH') {
        AudioSys.playSample('sfx_purge', 0.5);
        AudioSys.playSample('sfx_unlock', 0.36);
        AudioSys.playTone(880, 'square', 0.08, 0.045);
        AudioSys.playTone(1200, 'square', 0.08, 0.04);
        ui.endTitle.innerText = "THREAT PURGED";
        ui.endDesc.innerText = "Emergency wipe complete. The hostile process has been removed.";
        ui.endTitle.style.color = "#33ff33";
        ui.endImg.classList.add('hidden');
        showFeedbackGif(ui.purgeGif, 1800);
        spawnParticles(window.innerWidth/2, window.innerHeight/2, '#00ff00');
    }
}

/**
 * INPUT HANDLING
 */
// Purge Tool Interaction
ui.needle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    needleTaps++;
    AudioSys.playSample('sfx_tap', 0.35);
    AudioSys.playTone(600 + (needleTaps*200), 'sine', 0.04, 0.04);
    
    // Juice
    ui.needle.style.transform = `scale(0.9) rotate(${Math.random()*20-10}deg)`;
    setTimeout(() => ui.needle.style.transform = 'scale(1) rotate(0deg)', 100);

    if (needleTaps >= 2) {
        ui.deleteOverlay.classList.remove('hidden');
        AudioSys.playSample('sfx_unlock', 0.45);
        AudioSys.playNoise(0.15, 0.08);
        showFeedbackGif(ui.purgeGif, 1200);
    }
});

// Delete Button
document.getElementById('delete-btn').addEventListener('click', () => {
    triggerEnding('GLITCH');
});

// Password Input
ui.passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (ui.passwordInput.value.trim().length > 0) {
            triggerEnding('KNOCK');
        }
    }
});
document.getElementById('submit-btn').addEventListener('click', () => {
    if (ui.passwordInput.value.trim().length > 0) {
        triggerEnding('KNOCK');
    }
});

// Restart
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

/**
 * INIT
 */
window.addEventListener('DOMContentLoaded', () => {
    // Config Parsing
    try {
        const cfg = JSON.parse(document.getElementById('game-config').textContent);
        window.gameConfigDefs = cfg;
        window.gameConfig = {};
        for (let k in cfg) window.gameConfig[k] = cfg[k].value;
    } catch(e) { console.error("Config Parse Error", e); }

    // Editor Update Hook
    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
            if (key === 'themeColor') {
                document.documentElement.style.setProperty('--theme-color', val);
                document.body.style.color = val;
                ui.passwordInput.style.borderColor = val;
                ui.passwordInput.style.color = val;
            }
        }
    };

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(loop);
});

</script>
