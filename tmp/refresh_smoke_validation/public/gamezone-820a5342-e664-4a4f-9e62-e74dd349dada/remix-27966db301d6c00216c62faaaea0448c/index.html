<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Demolition Test Range</title>
    <!-- [agent-note][stage4] repaired: font-remap | title/display -> Orbitron, ui/body -> Rajdhani via catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #12081f;
            --bg-bottom: #2d0d1d;
            --panel: rgba(16, 10, 28, 0.86);
            --panel-strong: rgba(28, 14, 44, 0.92);
            --panel-border: rgba(255, 138, 76, 0.4);
            --panel-glow: rgba(255, 96, 122, 0.18);
            --text: #f7f4ff;
            --muted: #bbaecc;
            --accent: #ffb84d;
            --accent-strong: #ff6a3d;
            --danger: #ff5f7a;
            --highlight: #8cf3ff;
            --toxic: #39ff14;
            --ground: #12060a;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 106, 61, 0.12), transparent 28%),
                linear-gradient(180deg, #050308 0%, #120714 100%);
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
        }

        button {
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 1rem;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 132, 70, 0.12), transparent 36%), #06040a;
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 0 1px,
                    transparent 1px 56px
                );
            opacity: 0.3;
            pointer-events: none;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
            z-index: 2;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .neon-panel {
            background:
                linear-gradient(180deg, rgba(42, 20, 49, 0.95), rgba(16, 10, 28, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 160, 90, 0.24);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 16px 38px rgba(0, 0, 0, 0.42),
                0 0 28px var(--panel-glow);
        }

        .hud-card {
            min-width: 112px;
            padding: 12px 14px;
            border-left: 4px solid var(--accent);
            border-radius: 16px;
        }

        .hud-label {
            font-size: 11px;
            line-height: 1.1;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-bottom: 4px;
        }

        .hud-value {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.1rem);
            line-height: 1;
            color: #fff1d8;
            text-shadow: 0 0 14px rgba(255, 184, 77, 0.35);
        }

        .hud-value span {
            color: var(--accent);
        }

        .neon-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            pointer-events: auto;
        }

        .neon-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.16) 50%, transparent 100%);
            transform: translateX(-130%);
            transition: transform 0.35s ease;
            pointer-events: none;
        }

        .neon-btn:hover::after,
        .neon-btn:focus-visible::after {
            transform: translateX(130%);
        }

        .neon-btn:active {
            transform: scale(0.94);
        }

        .neon-btn.active {
            background: linear-gradient(180deg, rgba(255, 184, 77, 0.32), rgba(255, 106, 61, 0.18));
            border-color: rgba(255, 196, 97, 0.92);
            box-shadow: 0 0 18px rgba(255, 164, 78, 0.32);
            color: #fff5df;
        }

        .danger-btn {
            padding: 12px 16px;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(180deg, rgba(120, 12, 28, 0.56), rgba(62, 4, 16, 0.56));
            border-color: rgba(255, 95, 122, 0.45);
            color: #ffc8d2;
            align-self: flex-start;
        }

        .danger-btn:hover,
        .danger-btn:focus-visible {
            background: linear-gradient(180deg, rgba(255, 95, 122, 0.94), rgba(170, 28, 62, 0.94));
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 95, 122, 0.28);
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .screen-backdrop {
            background: radial-gradient(circle at top, rgba(255, 139, 93, 0.16), transparent 24%), rgba(5, 4, 10, 0.84);
            backdrop-filter: blur(12px);
        }

        .screen-card {
            position: relative;
            width: min(100%, 380px);
            padding: 28px 22px;
            border-radius: 26px;
            text-align: center;
            overflow: hidden;
        }

        .screen-card::before,
        .screen-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(6px);
            opacity: 0.8;
            pointer-events: none;
        }

        .screen-card::before {
            width: 110px;
            height: 110px;
            right: -22px;
            top: -22px;
            background: radial-gradient(circle, rgba(255, 184, 77, 0.34), transparent 70%);
        }

        .screen-card::after {
            width: 130px;
            height: 130px;
            left: -40px;
            bottom: -46px;
            background: radial-gradient(circle, rgba(140, 243, 255, 0.18), transparent 70%);
        }

        .glitch-text {
            margin: 0;
            position: relative;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.7rem, 12vw, 4.2rem);
            line-height: 0.9;
            letter-spacing: 0.02em;
            color: #fff8ec;
            text-shadow:
                0 0 12px rgba(255, 184, 77, 0.22),
                3px 3px 0 rgba(255, 106, 61, 0.88);
        }

        .glitch-text span {
            color: var(--accent);
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 3px 3px 0 rgba(255, 106, 61, 0.88); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); text-shadow: -3px 0 0 rgba(140, 243, 255, 0.78); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); text-shadow: 3px 3px 0 rgba(255, 106, 61, 0.88); }
        }

        .glitch-text:hover {
            animation: glitch 0.2s infinite;
        }

        .subtitle {
            margin: 10px 0 22px;
            color: #d9bfd0;
            font-size: 13px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .character-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .mascot-core {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            position: relative;
            background:
                radial-gradient(circle at 35% 30%, #fff3cf 0 10%, #ffcf78 18%, #ff8a4c 48%, #a0273f 100%);
            border: 2px solid rgba(255, 236, 194, 0.66);
            box-shadow:
                0 0 24px rgba(255, 128, 76, 0.42),
                inset 0 -10px 18px rgba(94, 8, 25, 0.32);
            animation: mascotPulse 2.8s ease-in-out infinite;
        }

        .mascot-core::before,
        .mascot-core::after {
            content: "";
            position: absolute;
            top: 28px;
            width: 14px;
            height: 18px;
            border-radius: 999px;
            background: #22040f;
            box-shadow: 0 0 12px rgba(255,255,255,0.08);
        }

        .mascot-core::before {
            left: 20px;
        }

        .mascot-core::after {
            right: 20px;
        }

        .mascot-mouth {
            position: absolute;
            left: 50%;
            bottom: 18px;
            width: 34px;
            height: 16px;
            transform: translateX(-50%);
            border-bottom: 4px solid #fff4d8;
            border-radius: 0 0 24px 24px;
            opacity: 0.92;
        }

        .mascot-spark {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: radial-gradient(circle, #fff8df 0%, #8cf3ff 40%, transparent 72%);
            box-shadow: 0 0 14px rgba(140, 243, 255, 0.6);
            animation: sparkOrbit 1.8s ease-in-out infinite;
        }

        .mascot-spark.delay {
            animation-delay: 0.45s;
        }

        @keyframes mascotPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.03); }
        }

        @keyframes sparkOrbit {
            0%, 100% { transform: translateY(0) scale(0.85); opacity: 0.55; }
            50% { transform: translateY(-7px) scale(1.15); opacity: 1; }
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            text-align: left;
            font-size: 13px;
            color: #f3dce4;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.28);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .tool-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tool-chip-icon {
            font-size: 20px;
            filter: drop-shadow(0 0 8px rgba(255, 184, 77, 0.22));
        }

        .start-btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 194, 108, 0.84);
            background: linear-gradient(180deg, rgba(255, 184, 77, 0.92), rgba(255, 106, 61, 0.92));
            color: #210610;
            font-weight: 700;
            font-size: clamp(1rem, 4vw, 1.2rem);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            box-shadow: 0 12px 28px rgba(255, 106, 61, 0.26);
        }

        .start-btn:hover,
        .start-btn:focus-visible {
            color: #12040b;
            box-shadow: 0 14px 34px rgba(255, 106, 61, 0.38);
        }

        #game-over-screen {
            background: radial-gradient(circle at top, rgba(255, 111, 92, 0.18), transparent 28%), rgba(3, 2, 6, 0.9);
            padding: 20px;
            text-align: center;
        }

        .over-title {
            margin: 0;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: clamp(2.3rem, 10vw, 3.7rem);
            line-height: 0.9;
            color: #fff6eb;
            text-shadow: 0 0 16px rgba(255, 184, 77, 0.18);
        }

        .over-title span {
            color: var(--accent);
        }

        .over-copy {
            margin: 12px 0 24px;
            font-size: 16px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .restart-btn {
            padding: 14px 26px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        #toolbar {
            width: 100%;
            max-width: 100%;
            padding: 8px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            pointer-events: auto;
            scroll-snap-type: x proximity;
            align-items: stretch;
        }

        #toolbar::-webkit-scrollbar {
            height: 4px;
        }

        #toolbar::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        .tool-btn {
            width: 56px;
            min-width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 24px;
        }

        .tool-btn span {
            transform: translateY(1px);
        }

        .tool-btn[data-tool="hammer"] { box-shadow: inset 0 0 0 1px rgba(255, 193, 96, 0.08); }
        .tool-btn[data-tool="tornado"] { box-shadow: inset 0 0 0 1px rgba(140, 243, 255, 0.08); }
        .tool-btn[data-tool="blackhole"] { box-shadow: inset 0 0 0 1px rgba(203, 137, 255, 0.08); }
        .tool-btn[data-tool="airstrike"] { box-shadow: inset 0 0 0 1px rgba(255, 116, 143, 0.08); }
        .tool-btn[data-tool="meteor"] { box-shadow: inset 0 0 0 1px rgba(255, 138, 76, 0.08); }
        .tool-btn[data-tool="lightning"] { box-shadow: inset 0 0 0 1px rgba(255, 244, 122, 0.08); }
        .tool-btn[data-tool="tsunami"] { box-shadow: inset 0 0 0 1px rgba(116, 218, 255, 0.08); }
        .tool-btn[data-tool="earthquake"] { box-shadow: inset 0 0 0 1px rgba(205, 158, 108, 0.08); }
        .tool-btn[data-tool="nuke"] { box-shadow: inset 0 0 0 1px rgba(120, 255, 145, 0.08); }

        @media (min-width: 640px) {
            #toolbar {
                width: auto;
            }
        }

        @media (max-width: 520px) {
            #ui-layer {
                padding-top: calc(10px + var(--safe-top));
                padding-left: calc(10px + var(--safe-left));
                padding-right: calc(10px + var(--safe-right));
                padding-bottom: calc(10px + var(--safe-bottom));
            }

            #hud {
                gap: 10px;
            }

            .hud-card {
                min-width: 96px;
                padding: 11px 12px;
            }

            .danger-btn {
                padding: 11px 13px;
                font-size: 11px;
            }

            .screen-card {
                padding: 24px 18px;
            }

            .tool-grid {
                font-size: 12px;
                gap: 8px;
                padding: 12px;
            }

            .tool-btn {
                width: 52px;
                min-width: 52px;
                height: 52px;
                font-size: 22px;
            }
        }

        #reaction-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            width: min(34vw, 144px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
            background: rgba(8, 6, 12, 0.68);
            opacity: 0;
            transform: translateY(8px) scale(0.96);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .reaction-gif.visible {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        #impact-gif {
            bottom: calc(88px + var(--safe-bottom));
        }

        #victory-gif {
            top: calc(92px + var(--safe-top));
        }

        @media (max-width: 520px) {
            .reaction-gif {
                width: min(38vw, 122px);
                right: 10px;
            }

            #impact-gif {
                bottom: calc(82px + var(--safe-bottom));
            }

            #victory-gif {
                top: calc(84px + var(--safe-top));
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <!-- [agent-note][stage3] resolved-gif: impact/victory overlays -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <div id="reaction-layer" aria-hidden="true">
            <img
                id="impact-gif"
                class="reaction-gif"
                src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
                alt=""
                decoding="async"
                loading="lazy"
            >
            <img
                id="victory-gif"
                class="reaction-gif"
                src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
                alt=""
                decoding="async"
                loading="lazy"
            >
        </div>

        <!-- UI Layer -->
        <div id="ui-layer">

            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="neon-panel hud-card">
                    <div class="hud-label">Cleared</div>
                    <div class="hud-value"><span id="score">0</span>%</div>
                </div>
                <button id="reset-sim-btn" class="neon-btn danger-btn">
                    Reset Range
                </button>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="screen screen-backdrop">
                <div class="neon-panel screen-card">
                    <div class="character-banner" aria-hidden="true">
                        <span class="mascot-spark"></span>
                        <div class="mascot-core">
                            <div class="mascot-mouth"></div>
                        </div>
                        <span class="mascot-spark delay"></span>
                    </div>
                    <h1 class="glitch-text">TEST<br><span>RANGE</span></h1>
                    <p class="subtitle">Pick a tool. Clear the structure.</p>

                    <div class="tool-grid">
                        <div class="tool-chip"><span class="tool-chip-icon">🔨</span> Smash</div>
                        <div class="tool-chip"><span class="tool-chip-icon">🌪️</span> Tornado</div>
                        <div class="tool-chip"><span class="tool-chip-icon">⚫</span> Void</div>
                        <div class="tool-chip"><span class="tool-chip-icon">✈️</span> Airstrike</div>
                        <div class="tool-chip"><span class="tool-chip-icon">☢️</span> Nuke</div>
                        <div class="tool-chip"><span class="tool-chip-icon">☄️</span> Meteor</div>
                    </div>

                    <button id="start-btn" class="neon-btn start-btn">
                        Begin Trial
                    </button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen hidden">
                <h2 class="over-title">RANGE<br><span>CLEARED</span></h2>
                <div class="over-copy">Structure Neutralized</div>
                <button id="restart-btn" class="neon-btn restart-btn">
                    Next Trial
                </button>
            </div>

            <!-- Toolbar -->
            <div id="toolbar" class="neon-panel hidden">
                <button class="neon-btn tool-btn active" data-tool="hammer" aria-label="Hammer">
                    <span>🔨</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="tornado" aria-label="Tornado">
                    <span>🌪️</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="blackhole" aria-label="Black hole">
                    <span>⚫</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="airstrike" aria-label="Airstrike">
                    <span>✈️</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="meteor" aria-label="Meteor">
                    <span>☄️</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="lightning" aria-label="Lightning">
                    <span>⚡</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="tsunami" aria-label="Tsunami">
                    <span>🌊</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="earthquake" aria-label="Earthquake">
                    <span>🌍</span>
                </button>
                <button class="neon-btn tool-btn" data-tool="nuke" aria-label="Nuke">
                    <span>☢️</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS & AUDIO */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                impact: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
                explosion: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_02.mp3",
                powerup: "https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3",
                click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                reset: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3"
            }
        };

        class AudioController {
            constructor() {
                this.enabled = true;
                this.started = false;
                this.cooldowns = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.started = true;
            }
            playBGM() {
                if (!this.enabled || !this.started) return;
                this.bgm.play().catch(() => {});
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, rate = 1.0, volume = 0.45, debounceMs = 80) {
                if (!this.enabled || !this.started || !this.sfx[key]) return;
                const now = performance.now();
                const lastTime = this.cooldowns.get(key) || 0;
                if (now - lastTime < debounceMs) return;
                this.cooldowns.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.playbackRate = rate;
                clone.play().catch(() => {});
            }
        }
        const audio = new AudioController();
        const impactGif = document.getElementById('impact-gif');
        const victoryGif = document.getElementById('victory-gif');
        let gifTimers = {};
        let hasWonRound = false;

        function showReactionGif(element, duration = 900) {
            if (!element) return;
            clearTimeout(gifTimers[element.id]);
            element.classList.add('visible');
            gifTimers[element.id] = setTimeout(() => {
                element.classList.remove('visible');
            }, duration);
        }

        /** 2. GAME ENGINE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // State
        let width, height;
        let gameActive = false;
        let currentTool = 'hammer';
        let frameCount = 0;
        let shakeIntensity = 0;

        // Entities
        let blocks = [];
        let debris = [];
        let particles = [];
        let disasters = []; // Active disasters (Meteors, Tornadoes, etc)

        // Constants
        const BLOCK_SIZE = 22;
        const GRAVITY = 0.4;

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(gameActive && blocks.length === 0) initLevel();
        }
        window.addEventListener('resize', resize);
        resize();

        function initLevel() {
            blocks = [];
            debris = [];
            particles = [];
            disasters = [];
            shakeIntensity = 0;
            hasWonRound = false;
            if (impactGif) impactGif.classList.remove('visible');
            if (victoryGif) victoryGif.classList.remove('visible');

            // Generate City
            const floors = 18;
            const roomsPerFloor = 10;
            const startX = (width - (roomsPerFloor * BLOCK_SIZE)) / 2;
            const groundY = height - 60;

            for (let y = 0; y < floors; y++) {
                for (let x = 0; x < roomsPerFloor; x++) {
                    // Procedural building generation
                    let type = 'concrete';
                    let color = '#6d556d';

                    // Windows
                    if (x > 0 && x < roomsPerFloor - 1 && y > 0 && y < floors - 1) {
                        if ((x + y) % 2 === 0) {
                            type = 'glass';
                            color = '#8cf3ff';
                        }
                    }
                    // Steel Beams
                    if (x === 0 || x === roomsPerFloor - 1) {
                        color = '#4d3658';
                    }

                    blocks.push({
                        x: startX + x * BLOCK_SIZE,
                        y: groundY - (y + 1) * BLOCK_SIZE,
                        w: BLOCK_SIZE,
                        h: BLOCK_SIZE,
                        color: color,
                        type: type,
                        vx: 0, vy: 0
                    });
                }
            }

            document.getElementById('score').innerText = '0';
        }

        /** 3. PHYSICS HELPERS */
        function spawnDebris(x, y, color, count = 1, force = 2) {
            for(let i=0; i<count; i++) {
                debris.push({
                    x: x + Math.random() * BLOCK_SIZE,
                    y: y + Math.random() * BLOCK_SIZE,
                    vx: (Math.random() - 0.5) * force * 2,
                    vy: (Math.random() - 0.5) * force * 2 - 2,
                    w: BLOCK_SIZE * 0.6,
                    h: BLOCK_SIZE * 0.6,
                    color: color,
                    life: 250,
                    angle: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function createExplosion(x, y, radius, force = 5) {
            audio.playSFX(
                radius > 100 ? 'explosion' : 'impact',
                0.92 + Math.random() * 0.18,
                radius > 100 ? 0.58 : 0.38,
                radius > 100 ? 120 : 45
            );
            if (radius >= 80) showReactionGif(impactGif, 720);
            shakeIntensity = Math.min(shakeIntensity + radius / 20, 20);

            // Visuals
            for(let i=0; i<5; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 20, color: '#fff0c6', size: radius/5
                });
            }

            // Destroy Blocks
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const dx = (b.x + b.w/2) - x;
                const dy = (b.y + b.h/2) - y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < radius) {
                    spawnDebris(b.x, b.y, b.color, 1, force);
                    blocks.splice(i, 1);
                }
            }

            // Push Debris
            for (let d of debris) {
                const dx = d.x - x;
                const dy = d.y - y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < radius * 1.5) {
                    const angle = Math.atan2(dy, dx);
                    const push = (radius * 1.5 - dist) / 20;
                    d.vx += Math.cos(angle) * push;
                    d.vy += Math.sin(angle) * push;
                }
            }
        }

        // Converts static blocks to dynamic debris if affected by forces
        function wakeUpBlocks(x, y, radius) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const dx = (b.x + b.w/2) - x;
                const dy = (b.y + b.h/2) - y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < radius) {
                    // Convert to debris without explosion
                    debris.push({
                        x: b.x, y: b.y,
                        vx: 0, vy: 0,
                        w: b.w, h: b.h,
                        color: b.color,
                        life: 300,
                        angle: 0,
                        rotSpeed: 0
                    });
                    blocks.splice(i, 1);
                }
            }
        }

        /** 4. DISASTER LOGIC */
        function triggerTool(x, y) {
            switch(currentTool) {
                case 'hammer':
                    createExplosion(x, y, 45, 3);
                    break;
                case 'nuke':
                    audio.playSFX('powerup', 0.8, 0.5, 140);
                    createExplosion(x, y, 350, 15);
                    // Fallout
                    for(let i=0; i<100; i++) {
                        particles.push({
                            x: x, y: y,
                            vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30,
                            life: 60, color: '#ffb84d', size: 4
                        });
                    }
                    break;
                case 'meteor':
                    disasters.push({
                        type: 'meteor',
                        x: x - 300, y: -200,
                        vx: 6, vy: 10,
                        targetY: y,
                        radius: 40
                    });
                    break;
                case 'lightning':
                    particles.push({ type: 'beam', x: x, life: 15 });
                    createExplosion(x, y, 70, 5);
                    for(let i=0; i<3; i++) createExplosion(x, y + (i-1)*60, 50, 2);
                    break;
                case 'tornado':
                    audio.playSFX('powerup', 1.15, 0.45, 140);
                    disasters.push({
                        type: 'tornado',
                        x: x, y: height - 50,
                        life: 300,
                        angle: 0
                    });
                    break;
                case 'blackhole':
                    audio.playSFX('powerup', 0.72, 0.42, 140);
                    disasters.push({
                        type: 'blackhole',
                        x: x, y: y,
                        life: 200,
                        size: 0
                    });
                    break;
                case 'airstrike':
                    audio.playSFX('powerup', 1.25, 0.48, 140);
                    disasters.push({
                        type: 'plane',
                        x: -100, y: 80,
                        vx: 8, vy: 0,
                        bombTimer: 0
                    });
                    break;
            }
        }

        function triggerGlobalTool() {
            if (currentTool === 'earthquake') {
                shakeIntensity = 30;
                audio.playSFX('explosion', 0.7, 0.5, 150);
                // Randomly break structure
                for (let i = blocks.length - 1; i >= 0; i--) {
                    if (Math.random() < 0.15) {
                        const b = blocks[i];
                        spawnDebris(b.x, b.y, b.color, 1, 2);
                        blocks.splice(i, 1);
                    }
                }
            } else if (currentTool === 'tsunami') {
                audio.playSFX('powerup', 0.9, 0.42, 150);
                disasters.push({
                    type: 'tsunami',
                    x: -200, y: 0,
                    particles: Array(300).fill().map(() => ({
                        x: -Math.random() * 400,
                        y: height - Math.random() * 300,
                        vx: 8 + Math.random() * 5,
                        vy: 0,
                        size: Math.random() * 15 + 5
                    }))
                });
            }
        }

        /** 5. UPDATE LOOP */
        function update() {
            if (!gameActive) return;

            // Shake Decay
            if (shakeIntensity > 0) shakeIntensity *= 0.9;
            if (shakeIntensity < 0.5) shakeIntensity = 0;

            // Update Disasters
            for (let i = disasters.length - 1; i >= 0; i--) {
                let d = disasters[i];

                if (d.type === 'meteor') {
                    d.x += d.vx;
                    d.y += d.vy;
                    particles.push({ x: d.x, y: d.y, vx: (Math.random()-0.5)*2, vy: -2, life: 10, color: '#ff8a4c', size: 5 });
                    if (d.y >= d.targetY || d.y > height) {
                        createExplosion(d.x, d.y, 180, 10);
                        disasters.splice(i, 1);
                    }
                }
                else if (d.type === 'tornado') {
                    d.life--;
                    d.angle += 0.2;
                    d.x += Math.sin(d.life * 0.05) * 2;

                    const range = 150;
                    wakeUpBlocks(d.x, d.y - 100, range);

                    for(let deb of debris) {
                        const dx = d.x - deb.x;
                        const dy = (d.y - 150) - deb.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < range + 50) {
                            deb.vx += (dx / dist) * 1.5 + (Math.random()-0.5)*5;
                            deb.vy -= 1.0;
                        }
                    }

                    if(frameCount % 2 === 0) {
                        particles.push({
                            x: d.x + (Math.random()-0.5)*40,
                            y: d.y,
                            vx: (Math.random()-0.5)*5, vy: -10 - Math.random()*5,
                            life: 40, color: '#f7d8d0', size: Math.random()*10
                        });
                    }

                    if(d.life <= 0) disasters.splice(i, 1);
                }
                else if (d.type === 'blackhole') {
                    d.life--;
                    d.size = Math.min(d.size + 1, 60);
                    const range = 250;
                    wakeUpBlocks(d.x, d.y, range);

                    for(let j = debris.length - 1; j >= 0; j--) {
                        let deb = debris[j];
                        const dx = d.x - deb.x;
                        const dy = d.y - deb.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist < range) {
                            const force = 500 / (dist * dist + 1);
                            deb.vx += (dx / dist) * force;
                            deb.vy += (dy / dist) * force;

                            if (dist < 20) debris.splice(j, 1);
                        }
                    }
                    if(d.life <= 0) disasters.splice(i, 1);
                }
                else if (d.type === 'plane') {
                    d.x += d.vx;
                    d.bombTimer++;
                    if(d.bombTimer > 15 && d.x > 0 && d.x < width) {
                        d.bombTimer = 0;
                        disasters.push({
                            type: 'bomb',
                            x: d.x, y: d.y + 20,
                            vx: 2, vy: 5
                        });
                    }
                    if(d.x > width + 200) disasters.splice(i, 1);
                }
                else if (d.type === 'bomb') {
                    d.x += d.vx;
                    d.y += d.vy;
                    d.vy += 0.5;
                    if(d.y > height - 50) {
                        createExplosion(d.x, d.y, 80, 6);
                        disasters.splice(i, 1);
                    }
                    for(let b of blocks) {
                        if(Math.abs(b.x - d.x) < 20 && Math.abs(b.y - d.y) < 20) {
                            createExplosion(d.x, d.y, 80, 6);
                            disasters.splice(i, 1);
                            break;
                        }
                    }
                }
                else if (d.type === 'tsunami') {
                    let active = false;
                    for(let p of d.particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += GRAVITY * 0.5;
                        if(p.y > height - 50) { p.y = height - 50; p.vy = 0; }

                        for(let j = blocks.length - 1; j >= 0; j--) {
                            let b = blocks[j];
                            if(p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
                                p.vx *= -0.5;
                                if(Math.random() < 0.1) {
                                    spawnDebris(b.x, b.y, b.color, 1, 4);
                                    blocks.splice(j, 1);
                                }
                            }
                        }
                        if(p.x < width + 100) active = true;
                    }
                    if(!active) disasters.splice(i, 1);
                }
            }

            // Update Debris
            for (let i = debris.length - 1; i >= 0; i--) {
                let d = debris[i];
                d.x += d.vx;
                d.y += d.vy;
                d.vy += GRAVITY;
                d.angle += d.rotSpeed;
                d.life--;

                if (d.y > height - 50) {
                    d.y = height - 50;
                    d.vy *= -0.5;
                    d.vx *= 0.8;
                }
                if (d.life <= 0) debris.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (p.type === 'beam') {
                    p.life--;
                    if(p.life <= 0) particles.splice(i, 1);
                    continue;
                }
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            const maxBlocks = 180;
            let destPct = Math.floor(((maxBlocks - blocks.length) / maxBlocks) * 100);
            destPct = Math.max(0, Math.min(100, destPct));
            document.getElementById('score').innerText = destPct;

            if (destPct >= 98 && gameActive) {
                setTimeout(() => {
                    if(gameActive) {
                        gameActive = false;
                        hasWonRound = true;
                        audio.stopBGM();
                        audio.playSFX('win', 1, 0.56, 400);
                        showReactionGif(victoryGif, 2600);
                        document.getElementById('hud').classList.add('hidden');
                        document.getElementById('toolbar').classList.add('hidden');
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    }
                }, 1000);
            }
        }

        /** 6. RENDER LOOP */
        function draw() {
            let sx = (Math.random() - 0.5) * shakeIntensity;
            let sy = (Math.random() - 0.5) * shakeIntensity;

            ctx.save();
            ctx.clearRect(0, 0, width, height);
            ctx.translate(sx, sy);

            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#12081f');
            grad.addColorStop(0.55, '#240c27');
            grad.addColorStop(1, '#45131c');
            ctx.fillStyle = grad;
            ctx.fillRect(-sx, -sy, width, height);

            const horizonGlow = ctx.createRadialGradient(width * 0.5, height * 0.2, 20, width * 0.5, height * 0.2, width * 0.75);
            horizonGlow.addColorStop(0, 'rgba(255, 158, 97, 0.18)');
            horizonGlow.addColorStop(1, 'rgba(255, 158, 97, 0)');
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(-sx, -sy, width, height);

            ctx.fillStyle = '#ffffff';
            for(let i=0; i<40; i++) {
                ctx.globalAlpha = Math.random() * 0.3 + 0.1;
                let px = (i * 97) % width;
                let py = (i * 61) % (height/1.5);
                ctx.fillRect(px, py, 2, 2);
            }
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(255, 184, 77, 0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 48) {
                ctx.beginPath();
                ctx.moveTo(x, height - 170);
                ctx.lineTo(x, height - 50);
                ctx.stroke();
            }

            ctx.fillStyle = '#12060a';
            ctx.fillRect(-sx, height - 50, width + sx*2, 50);
            ctx.fillStyle = '#ffb84d';
            ctx.fillRect(-sx, height - 50, width + sx*2, 2);

            for (let b of blocks) {
                const blockGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
                blockGrad.addColorStop(0, b.type === 'glass' ? '#dffcff' : '#86647f');
                blockGrad.addColorStop(1, b.color);
                ctx.fillStyle = blockGrad;
                ctx.fillRect(b.x, b.y, b.w, b.h);

                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.fillRect(b.x, b.y, b.w, 4);
                ctx.fillRect(b.x, b.y, 4, b.h);

                if (b.type === 'glass') {
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillRect(b.x + 5, b.y + 4, b.w - 10, 4);
                }
            }

            for (let d of debris) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.angle);
                ctx.fillStyle = d.color;
                ctx.fillRect(-d.w/2, -d.h/2, d.w, d.h);
                ctx.restore();
            }

            for (let d of disasters) {
                if (d.type === 'meteor') {
                    const meteorGlow = ctx.createRadialGradient(d.x, d.y, 10, d.x, d.y, d.radius + 20);
                    meteorGlow.addColorStop(0, 'rgba(255, 236, 173, 0.95)');
                    meteorGlow.addColorStop(0.55, 'rgba(255, 138, 76, 0.92)');
                    meteorGlow.addColorStop(1, 'rgba(255, 138, 76, 0)');
                    ctx.fillStyle = meteorGlow;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.radius + 16, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#ff8a4c';
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.radius, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255, 184, 77, 0.35)';
                    ctx.beginPath();
                    ctx.moveTo(d.x - d.radius, d.y);
                    ctx.lineTo(d.x, d.y - 150);
                    ctx.lineTo(d.x + d.radius, d.y);
                    ctx.fill();
                }
                else if (d.type === 'tornado') {
                    const tornadoGrad = ctx.createLinearGradient(d.x, d.y - 300, d.x, d.y);
                    tornadoGrad.addColorStop(0, 'rgba(255, 238, 215, 0.08)');
                    tornadoGrad.addColorStop(1, 'rgba(245, 197, 170, 0.28)');
                    ctx.fillStyle = tornadoGrad;
                    ctx.beginPath();
                    ctx.moveTo(d.x, d.y);
                    ctx.lineTo(d.x - 60, d.y - 300);
                    ctx.lineTo(d.x + 60, d.y - 300);
                    ctx.fill();
                }
                else if (d.type === 'blackhole') {
                    ctx.fillStyle = '#050106';
                    ctx.strokeStyle = '#d18fff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.stroke();
                }
                else if (d.type === 'plane') {
                    ctx.fillStyle = '#f4d9ce';
                    ctx.fillRect(d.x, d.y, 40, 10);
                    ctx.fillRect(d.x + 15, d.y - 10, 10, 20);
                }
                else if (d.type === 'bomb') {
                    ctx.fillStyle = '#ff5f7a';
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, 6, 0, Math.PI*2);
                    ctx.fill();
                }
                else if (d.type === 'tsunami') {
                    ctx.fillStyle = 'rgba(140, 243, 255, 0.62)';
                    for(let p of d.particles) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }

            for (let p of particles) {
                if(p.type === 'beam') {
                    ctx.fillStyle = '#fff7dc';
                    ctx.fillRect(p.x - 10, 0, 20, height);
                    ctx.fillStyle = '#ffb84d';
                    ctx.fillRect(p.x - 2, 0, 4, height);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 30;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            ctx.restore();
        }

        function gameLoop() {
            frameCount++;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        /** 7. INPUT HANDLERS */
        document.querySelectorAll('.neon-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                audio.unlock();
                audio.playSFX('click', 1, 0.22, 40);
                document.querySelectorAll('.neon-btn[data-tool]').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentTool = target.dataset.tool;

                if (['earthquake', 'tsunami'].includes(currentTool)) {
                    setTimeout(triggerGlobalTool, 50);
                }
            });
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (!['earthquake', 'tsunami'].includes(currentTool)) {
                triggerTool(x, y);
            }
        }, {passive: false});

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (!['earthquake', 'tsunami'].includes(currentTool)) {
                triggerTool(x, y);
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 1, 0.36, 150);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('toolbar').classList.remove('hidden');

            audio.playBGM();
            gameActive = true;
            initLevel();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('click', 1, 0.28, 100);
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('toolbar').classList.remove('hidden');
            audio.playBGM();
            gameActive = true;
            initLevel();
        });

        document.getElementById('reset-sim-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('reset', 1, 0.28, 100);
            initLevel();
            if (gameActive && !hasWonRound) {
                audio.playBGM();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.bgm.pause();
            } else if (gameActive && !hasWonRound) {
                audio.playBGM();
            }
        });
    });
    </script>
</body>
