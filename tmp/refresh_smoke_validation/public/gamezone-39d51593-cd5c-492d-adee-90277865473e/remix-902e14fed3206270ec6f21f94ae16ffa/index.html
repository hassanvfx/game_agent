<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Super Aventura: Core Breach</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --c-bg: #070b16;
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
        --font-display: 'Orbitron', sans-serif;
        --font-ui: 'Rajdhani', sans-serif;
        --panel-bg: rgba(9, 14, 31, 0.88);
        --panel-border: rgba(82, 222, 255, 0.45);
        --panel-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
        --text-main: #ecf7ff;
        --text-dim: #8db5d7;
        --accent-cyan: #6cecff;
        --accent-blue: #4b8cff;
        --accent-gold: #ffd166;
        --accent-red: #ff5d7c;
    }
    html, body { 
        width: 100%; height: 100%; margin: 0; padding: 0; 
        overflow: hidden; background:
            radial-gradient(circle at top, rgba(108, 236, 255, 0.08), transparent 38%),
            radial-gradient(circle at bottom, rgba(79, 70, 229, 0.16), transparent 45%),
            var(--c-bg); 
        font-family: var(--font-ui);
        -webkit-user-select: none; user-select: none;
        touch-action: auto; color: var(--text-main);
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.03), transparent 14%, transparent 86%, rgba(255,255,255,0.02)),
            repeating-linear-gradient(90deg, rgba(108, 236, 255, 0.035) 0 1px, transparent 1px 72px);
        opacity: 0.9;
        mix-blend-mode: screen;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    /* UI Components */
    .panel { 
        background:
            linear-gradient(180deg, rgba(23, 38, 76, 0.35), rgba(5, 11, 26, 0.1) 24%),
            var(--panel-bg); 
        border: 2px solid var(--panel-border); 
        box-shadow: var(--panel-shadow); 
        border-radius: 24px;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }
    .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(108,236,255,0.16), transparent 32%, transparent 66%, rgba(255,209,102,0.08));
    }
    .btn { 
        position: relative; border: none; outline: none;
        font-family: var(--font-display);
        font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), filter 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1); 
        cursor: pointer; touch-action: manipulation;
        display: flex; align-items: center; justify-content: center;
        text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .btn:active { transform: scale(0.96); filter: brightness(0.94); }
    
    .btn-primary {
        background: linear-gradient(180deg, #58e6ff, #2563eb 80%);
        color: white; border: 2px solid #99f6ff;
        box-shadow: 0 4px 0 #14327d, 0 0 20px rgba(88,230,255,0.25); border-radius: 16px;
    }
    .btn-accent {
        background: linear-gradient(180deg, #ff7a98, #d81b60);
        color: white; border: 2px solid #ffc0d0;
        box-shadow: 0 4px 0 #871447, 0 0 20px rgba(255,93,124,0.22); border-radius: 16px;
    }
    .btn-info {
        background: linear-gradient(180deg, #88f7cf, #0f9b7a);
        color: white; border: 2px solid #d1fae5;
        box-shadow: 0 4px 0 #0c5d4f, 0 0 20px rgba(136,247,207,0.2); border-radius: 16px;
    }
    .btn-icon {
        background: linear-gradient(180deg, rgba(49,68,118,0.95), rgba(17,24,39,0.95)); color: white; border: 2px solid rgba(124, 152, 255, 0.5);
        box-shadow: 0 4px 0 #0f172a, 0 0 16px rgba(108,236,255,0.12); border-radius: 12px;
    }
    
    .btn-level {
        position: relative; overflow: hidden; border-radius: 16px; height: 4.5rem;
        border-width: 0 0 4px 0; display: flex; align-items: center; padding: 0 1.25rem;
        color: white; text-align: left; transition: transform 0.1s, filter 0.1s;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 10px 20px rgba(0,0,0,0.22);
    }
    .btn-level::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent 45%, rgba(255,255,255,0.06));
        pointer-events: none;
    }
    .btn-level:active { transform: translateY(2px); border-bottom-width: 2px; }

    .hidden { display: none !important; }
    .anim-float { animation: float 6s ease-in-out infinite; }
    .hud-chip, .hud-pill, .hero-card {
        background: linear-gradient(180deg, rgba(21,30,61,0.88), rgba(8,12,26,0.88));
        border: 1px solid rgba(108,236,255,0.28);
        box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        backdrop-filter: blur(8px);
    }
    .hero-card {
        position: relative;
        overflow: hidden;
    }
    .hero-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top, rgba(255,255,255,0.24), transparent 48%);
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
    }
    .hero-card.active::before { opacity: 1; }
    .hero-card.active { opacity: 1 !important; transform: translateY(-2px) scale(1.04); }
    .hero-badge {
        position: absolute;
        left: 50%;
        bottom: 0.35rem;
        transform: translateX(-50%);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--accent-cyan);
    }
    .hero-sigil {
        width: 2.8rem;
        height: 2.8rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.12) 35%, transparent 36%), rgba(7,11,22,0.2);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    }
    .scanline-title {
        font-family: var(--font-display);
        letter-spacing: 0.08em;
        text-shadow: 0 0 12px rgba(108,236,255,0.3);
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    
    .safe-pt { padding-top: var(--safe-top); }
    .scroll-y { overflow-y: auto; max-height: 60vh; -webkit-overflow-scrolling: touch; }
    .feedback-gif {
        position: absolute;
        right: 0.9rem;
        bottom: calc(var(--safe-bottom) + 0.9rem);
        width: min(24vw, 110px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 18px;
        border: 2px solid rgba(108,236,255,0.34);
        background: rgba(7,11,22,0.78);
        box-shadow: 0 14px 24px rgba(0,0,0,0.32);
        opacity: 0;
        transform: translateY(12px) scale(0.92);
        transition: opacity 0.22s ease, transform 0.22s ease;
        pointer-events: none;
        z-index: 40;
    }
    .feedback-gif.show {
        opacity: 0.92;
        transform: translateY(0) scale(1);
    }
    .feedback-gif.fail {
        left: 0.9rem;
        right: auto;
        border-color: rgba(255,93,124,0.44);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
</style>

<!-- CONFIG PROTOCOL -->
<script id="game-config" type="application/x-game-config">
{ 
  "heroSpeed": { "type": "number", "label": "Hero Speed", "value": 6, "min": 1, "max": 20 },
  "themeColor": { "type": "color", "label": "Theme Color", "value": "#ef4444" },
  "gameTitle": { "type": "text", "label": "Game Title", "value": "Core Breach Run" } 
}
</script>
</head>
<body>

<!-- ASSETS -->
<div id="assets" style="display:none;">
    <img id="asset_bg_sunset" data-editable="image" data-label="Industrial Skyline BG" src="https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png">
    
    <!-- Audio Assets -->
    <audio id="bgm_menu" data-editable="audio" data-label="Menu Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3" loop></audio>
    <audio id="bgm_game" data-editable="audio" data-label="Standard Level Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3" loop></audio>
    <audio id="bgm_boss" data-editable="audio" data-label="Boss Music" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop></audio>
    
    <!-- [agent-note][stage3] resolved-audio: bgm/ui/sfx -> catalogs/audios.json -->
    <audio id="bgm_act6" data-editable="audio" data-label="Act 6 Core Theme" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3" loop></audio>
    <audio id="bgm_victory" data-editable="audio" data-label="Victory Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3" loop></audio>
    <audio id="bgm_defeat" data-editable="audio" data-label="Defeat Loop" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" loop></audio>

    <audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3"></audio>
    <audio id="sfx_coin" data-editable="audio" data-label="Data SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"></audio>
    <audio id="sfx_jump" data-editable="audio" data-label="Jump SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3"></audio>
    <audio id="sfx_land" data-editable="audio" data-label="Landing SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"></audio>
    <audio id="sfx_pause" data-editable="audio" data-label="Pause SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3"></audio>
    <audio id="sfx_resume" data-editable="audio" data-label="Resume SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3"></audio>
    <audio id="sfx_start" data-editable="audio" data-label="Start SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"></audio>
    <audio id="sfx_success" data-editable="audio" data-label="Success SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"></audio>
    <audio id="sfx_warning" data-editable="audio" data-label="Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3"></audio>
</div>

<!-- GAME CONTAINER -->
<div id="game-container" class="relative w-full h-full bg-slate-900 overflow-hidden">
    <canvas id="gameCanvas"></canvas>
    <!-- [agent-note][stage3] resolved-gif: win/fail feedback overlays -> catalogs/gifs.json -->
    <img id="gif-win" class="feedback-gif" alt="Victory reaction overlay" src="https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp">
    <img id="gif-fail" class="feedback-gif fail" alt="Failure reaction overlay" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp">

    <!-- UI LAYER -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center safe-pt">
        
        <!-- MAIN MENU -->
        <div id="menu-screen" class="panel p-8 text-center pointer-events-auto flex flex-col gap-4 w-80 max-w-[90%] anim-float relative">
            <div class="mb-2">
                <h1 id="title-display" class="scanline-title text-5xl text-transparent bg-clip-text bg-gradient-to-br from-cyan-300 via-sky-400 to-amber-300 drop-shadow-sm tracking-tight leading-tight">CORE BREACH</h1>
                <p id="ui-subtitle" class="text-sky-100/70 text-xs font-bold uppercase tracking-[0.3em] mt-1">RUN THE FIREWALL</p>
            </div>
            
            <button id="btn-play-menu" class="btn btn-primary py-4 text-xl w-full shadow-blue-900/50">DEPLOY</button>
            <button id="btn-info" class="btn btn-info py-3 text-lg w-full shadow-emerald-900/50">ℹ️ BRIEFING</button>
            
            <div class="flex gap-3 w-full mt-2">
                <button id="btn-chars" class="btn btn-icon flex-1 py-3 flex flex-col items-center gap-1"><span class="text-xl">🦸</span><span id="txt-hero" class="text-[10px] font-bold">AVATAR</span></button>
                <button id="btn-settings" class="btn btn-icon flex-1 py-3 flex flex-col items-center gap-1"><span class="text-xl">⚙️</span><span id="txt-settings" class="text-[10px] font-bold">SETTINGS</span></button>
            </div>
        </div>

        <!-- INFO / HOW TO PLAY SCREEN -->
        <div id="info-screen" class="hidden panel p-6 text-center pointer-events-auto w-80 max-w-[95%] border-emerald-500">
            <h2 id="txt-how-to" class="text-2xl font-black mb-4 text-emerald-400 uppercase tracking-wide">Mission Brief</h2>
            <div class="bg-slate-800/50 rounded-xl p-4 mb-4 text-left border border-slate-700 space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center text-xl">👆</div>
                    <div>
                        <div id="txt-tap" class="font-bold text-white">Tap</div>
                        <div id="txt-tap-desc" class="text-xs text-slate-400">Leap over firewall blocks</div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-yellow-500 rounded-lg flex items-center justify-center text-xl">🪙</div>
                    <div>
                        <div id="txt-collect" class="font-bold text-white">Collect</div>
                        <div id="txt-collect-desc" class="text-xs text-slate-400">Secure bonus data</div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-500 rounded-lg flex items-center justify-center text-xl">💀</div>
                    <div>
                        <div id="txt-dodge" class="font-bold text-white">Avoid</div>
                        <div id="txt-dodge-desc" class="text-xs text-slate-400">Red alerts crash the run</div>
                    </div>
                </div>
            </div>
            <button id="btn-close-info" class="btn btn-primary w-full py-3">ACKNOWLEDGED</button>
        </div>

        <!-- LEVEL SELECT -->
        <div id="level-screen" class="hidden panel p-6 text-center pointer-events-auto w-80 max-w-[95%] flex flex-col max-h-[85vh]">
            <h2 id="txt-select-act" class="text-2xl font-black mb-4 text-white uppercase">Select Sector</h2>
            <div class="grid grid-cols-1 gap-3 scroll-y px-1 pb-2">
                <button id="lvl-1" class="btn btn-level bg-sky-600 border-sky-800"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75">Sector 1</div><div id="lvl-txt-1" class="text-lg font-black">SKY GRID</div></div><span class="text-2xl">☀️</span></button>
                <button id="lvl-2" class="btn btn-level bg-orange-600 border-orange-800"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75">Sector 2</div><div id="lvl-txt-2" class="text-lg font-black">HEAT VEIL</div></div><span class="text-2xl">🌆</span></button>
                <button id="lvl-3" class="btn btn-level bg-indigo-900 border-indigo-950"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75">Sector 3</div><div id="lvl-txt-3" class="text-lg font-black">NIGHT LINK</div></div><span class="text-2xl">🌙</span></button>
                <button id="lvl-4" class="btn btn-level bg-red-800 border-red-950"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75 text-red-300">Sector 4</div><div id="lvl-txt-4" class="text-lg font-black">SENTINEL</div></div><span class="text-2xl">👺</span></button>
                <button id="lvl-5" class="btn btn-level bg-slate-600 border-slate-800"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75">Sector 5</div><div id="lvl-txt-5" class="text-lg font-black">FOUNDRY</div></div><span class="text-2xl">🏭</span></button>
                <!-- ACT 6: CORE -->
                <button id="lvl-6" class="btn btn-level bg-black border-red-900 ring-2 ring-red-500/50"><div class="flex-1"><div class="text-[10px] font-bold uppercase opacity-75 text-red-500 animate-pulse">Sector 6</div><div id="lvl-txt-6" class="text-lg font-black text-white">CORE</div></div><span class="text-2xl animate-spin">☢️</span></button>
            </div>
            <button id="btn-back-level" class="mt-4 text-slate-400 hover:text-white font-bold py-2 px-6 uppercase text-sm tracking-widest">Back</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex flex-col items-center pointer-events-none safe-pt">
            <div id="bar-container-normal" class="w-64 max-w-[80%] h-4 bg-slate-800/80 rounded-full overflow-hidden border border-slate-600 mb-3 backdrop-blur">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-yellow-400 to-orange-500 w-0 transition-all duration-100 ease-linear"></div>
            </div>
            <div id="bar-container-boss" class="hidden w-64 max-w-[80%] h-6 bg-slate-900/90 rounded-lg overflow-hidden border border-red-500 mb-3 relative">
                <div id="boss-fill" class="h-full bg-red-600 w-full transition-all duration-100 ease-linear"></div>
                <div class="absolute inset-0 flex items-center justify-center text-[10px] font-black text-white uppercase tracking-widest drop-shadow-md">SENTINEL HP</div>
            </div>
            <div class="flex justify-between w-full px-2 items-center">

                <button id="btn-pause" class="pointer-events-auto hud-pill text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg active:scale-90 transition hover:brightness-110">||</button>
            </div>
            <div id="boss-hint" class="hidden mt-24 bg-black/60 px-4 py-2 rounded-full text-white font-bold text-xs text-center animate-pulse backdrop-blur border border-white/10">Slide to steer • Tap to jump</div>
        </div>

        <!-- PAUSE / OVER / VICTORY SCREENS -->
        <div id="pause-screen" class="hidden panel p-8 text-center pointer-events-auto w-72">
            <h2 id="txt-pause" class="text-3xl font-black mb-6 text-white tracking-widest">PAUSED</h2>
            <div class="flex flex-col gap-4">
                <button id="btn-resume" class="btn btn-primary py-3 text-lg">Resume</button>
                <button id="btn-quit" class="btn btn-accent py-3 text-lg">Abort</button>
            </div>
        </div>

        <div id="game-over-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-red-500/50">
            <h2 id="txt-fail" class="text-4xl font-black text-red-500 mb-2 drop-shadow-sm">BREACH FAILED</h2>
            <div class="flex gap-4 justify-center mt-6">
                <button id="btn-home-fail" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-fail" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">↺</button>
            </div>
        </div>

        <div id="victory-screen" class="hidden panel p-8 text-center pointer-events-auto w-80 max-w-[90%] border-yellow-400/50">
            <div class="text-6xl mb-2 animate-bounce">🏆</div>
            <h2 id="txt-victory" class="text-4xl font-black text-yellow-400 mb-2">CORE SECURED</h2>
            <div class="flex gap-4 justify-center mt-6">
                <button id="btn-home-win" class="btn btn-icon w-16 h-16 rounded-full text-2xl">🏠</button>
                <button id="btn-restart-win" class="btn btn-primary w-24 h-16 rounded-full font-bold text-3xl">➜</button>
            </div>
        </div>
        
        <!-- SETTINGS -->
        <div id="settings-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 id="txt-config" class="text-2xl font-black mb-6 uppercase">Settings</h2>
            <div class="bg-slate-800 rounded-xl p-4 mb-4 border border-slate-700 space-y-3">
                <button id="btn-toggle-sound" class="btn w-full bg-emerald-500 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">
                    <span id="snd-icon">🔊</span> <span id="snd-text">Sound: ON</span>
                </button>
            </div>
            <button id="btn-back-settings" class="btn text-slate-400 hover:text-white font-bold py-2">Back</button>
        </div>

        <!-- CHARACTER SELECT -->
        <div id="char-screen" class="hidden panel p-6 text-center pointer-events-auto w-80">
            <h2 id="txt-choose-hero" class="text-2xl font-black mb-6 uppercase">Choose Avatar</h2>
            <div class="flex justify-center gap-4 mb-8">
                <div id="char-0" class="hero-card active w-20 h-20 rounded-2xl border-2 border-cyan-200 shadow-lg cursor-pointer transform transition flex items-center justify-center text-3xl">
                    <span class="hero-sigil">🟥</span><span class="hero-badge">TANK</span>
                </div>
                <div id="char-1" class="hero-card w-20 h-20 rounded-full border-2 border-transparent opacity-50 shadow-lg cursor-pointer transform transition flex items-center justify-center text-3xl">
                    <span class="hero-sigil">🔵</span><span class="hero-badge">ORB</span>
                </div>
                <div id="char-2" class="hero-card w-20 h-20 rounded-2xl border-2 border-transparent opacity-50 shadow-lg cursor-pointer transform transition rotate-6 flex items-center justify-center text-3xl">
                    <span class="hero-sigil">⭐</span><span class="hero-badge">SPIKE</span>
                </div>
            </div>
            <button id="btn-back-char" class="btn btn-primary px-8 py-3 w-full">Confirm</button>
        </div>
    </div>
</div>

<script>
/**

// --- LOCALIZATION DATA ---
const TEXTS = {
    en: {
        subtitle: "RUN THE FIREWALL",
        play: "DEPLOY",
        info: "ℹ️ BRIEFING",
        hero: "AVATAR",
        settings: "SETTINGS",
        howTo: "MISSION BRIEF",
        tap: "Tap",
        tapDesc: "Leap over firewall blocks",
        collect: "Collect",
        collectDesc: "Secure bonus data",
        dodge: "Avoid",
        dodgeDesc: "Red alerts crash the run",
        understood: "ACKNOWLEDGED",
        selectAct: "SELECT SECTOR",
        back: "BACK",
        pause: "PAUSED",
        resume: "RESUME",
        quit: "ABORT",
        fail: "BREACH FAILED",
        victory: "CORE SECURED",
        config: "SETTINGS",
        soundOn: "Sound: ON",
        soundOff: "Sound: OFF",
        chooseHero: "CHOOSE AVATAR",
        confirm: "CONFIRM",
        bossHint: "Slide to steer • Tap to jump",

// --- CONFIGURATION PARSER ---
window.gameConfigDefs = {};
window.gameConfig = {};

function parseConfig() {
    try {
        const el = document.getElementById('game-config');
        if (el) {
            const json = JSON.parse(el.textContent);
            window.gameConfigDefs = json;
            for (const key in json) {
                window.gameConfig[key] = json[key].value;
            }
        }
    } catch (e) { console.error("Config Parse Error", e); }
    
    if (window.gameConfig.gameTitle) {
        document.getElementById('title-display').innerText = window.gameConfig.gameTitle;
        document.title = window.gameConfig.gameTitle;
    }
}

window.updateGameConfig = function(key, val) {
    if (window.gameConfigDefs[key]) {
        if (window.gameConfigDefs[key].type === 'color' && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
        if (window.gameConfigDefs[key].type === 'number') val = parseFloat(val);
        window.gameConfig[key] = val;
        
        if (key === 'gameTitle') {
            document.getElementById('title-display').innerText = val;
            document.title = val;
        }
    }
};

// LEVEL CONFIG
const LEVEL_DATA = {
    1: { type: 'runner', goal: 2000, color: "#38bdf8", ground: "#166534", track: "game", rate: 1.0 },
    2: { type: 'runner', goal: 3000, color: "#1e1b4b", ground: "#451a03", track: "game", rate: 0.85 },
    3: { type: 'runner', goal: 4000, color: "#020617", ground: "#0f172a", track: "game", rate: 0.65 },
    4: { type: 'boss',   goal: 100,  color: "#450a0a", ground: "#7f1d1d", track: "boss", rate: 1.0 }, 
    5: { type: 'runner', goal: 4000, color: "#475569", ground: "#334155", track: "game", rate: 0.8 },
    6: { type: 'runner', goal: 5000, color: "#0f172a", ground: "#1e293b", track: "act6", rate: 1.0 } 
};

// --- STATE ---
const State = {
    screen: 'menu',
    level: 1,
    isPlaying: false,
    isPaused: false,
    score: 0,
    distance: 0,
    frames: 0,
    soundOn: true,
    language: 'en',
    hero: { type: 0, color: '#ef4444' },
    stars: [],
    rain: [],
    clouds: [],
    boss: { hp: 100, maxHp: 100, x: 0, y: 50, dir: 1 },
    dragX: null,
    shake: 0
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    tracks: {},
    factoryInterval: null,
    sfxCooldowns: {},
    
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        
        ['menu', 'game', 'boss', 'act6', 'victory', 'defeat'].forEach(k => {
            const el = document.getElementById(`bgm_${k}`);
            if (el) this.tracks[k] = el;
        });
        ['fail', 'coin', 'jump', 'land', 'ui', 'pause', 'resume', 'start', 'success', 'warning'].forEach(k => {
            const el = document.getElementById(`sfx_${k}`);
            if (el) this.tracks[k] = el;
        });
    },

    unlock() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    playBGM(type, rate = 1.0) {
        if (!State.soundOn) return;
        this.stopBGM();
        
        const track = this.tracks[type];
        if (track) {
            track.currentTime = 0;
            track.volume = type === 'menu' ? 0.38 : (type === 'victory' || type === 'defeat' ? 0.42 : 0.48);
            track.playbackRate = rate; 
            track.play().catch(() => {});
        }
        
        if ((State.level === 5 || State.level === 6) && ['game', 'act6'].includes(type)) this.startFactorySound();
    },

    stopBGM() {
        ['menu', 'game', 'boss', 'act6', 'victory', 'defeat'].forEach(k => {
            if (this.tracks[k]) {
                this.tracks[k].pause();
                this.tracks[k].currentTime = 0;
            }
        });
        this.stopFactorySound();
    },

    playSFX(type, options = {}) {
        if (!State.soundOn) return;
        const now = performance.now();
        const cooldown = options.cooldown ?? 0;
        if (cooldown && this.sfxCooldowns[type] && now - this.sfxCooldowns[type] < cooldown) return;
        this.sfxCooldowns[type] = now;

        const sfx = this.tracks[type];
        if (sfx) {
            sfx.pause();
            sfx.currentTime = 0;
            sfx.volume = options.volume ?? 0.62;
            sfx.playbackRate = options.rate ?? 1.0;
            sfx.play().catch(() => {});
        } else {
            this.synthTone(options.freq ?? 400, options.wave ?? 'sine');
        }
    },

    synthTone(freq, type='sine') {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        g.gain.setValueAtTime(0.08, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    startFactorySound() {
        if (!this.ctx || !State.soundOn) return;
        this.stopFactorySound();
        const playClank = () => {
            if(!State.isPlaying || State.isPaused) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(State.level === 6 ? 60 : 80, this.ctx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
        };
        this.factoryInterval = setInterval(playClank, State.level === 6 ? 800 : 1200); 
    },

    stopFactorySound() {
        if (this.factoryInterval) {
            clearInterval(this.factoryInterval);
            this.factoryInterval = null;
        }
    }
};

// --- GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    player: { x: 50, y: 0, w: 40, h: 40, vy: 0, grounded: false },
    obstacles: [],
    particles: [],
    finishLine: null,
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        const start = (e) => {
            AudioSys.unlock();
            if (State.screen === 'menu') return;
            if (State.isPlaying && !State.isPaused) {
                if (this.player.grounded) {
                    this.player.vy = -13; 
                    this.player.grounded = false;
                    const col = (State.level === 5 || State.level === 6) ? '#fbbf24' : '#fff';
                    this.spawnParticles(this.player.x + 20, this.player.y + 40, 10, col);
                    AudioSys.playSFX('jump', { volume: 0.5, cooldown: 100, rate: 1.03 }); 
                }
                if (LEVEL_DATA[State.level].type === 'boss') {
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    State.dragX = cx;
                }
            }
        };
        const move = (e) => {
            if (State.isPlaying && !State.isPaused && LEVEL_DATA[State.level].type === 'boss') {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                if (State.dragX !== null) {
                    const dx = cx - State.dragX;
                    this.player.x = Math.max(0, Math.min(this.width - 40, this.player.x + dx));
                    State.dragX = cx;
                }
            }
        };
        const end = () => { State.dragX = null; };

        this.canvas.addEventListener('pointerdown', start);
        this.canvas.addEventListener('pointermove', move);
        this.canvas.addEventListener('pointerup', end);
        this.canvas.addEventListener('pointercancel', end);

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    },

    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },

    reset(lvl) {
        State.level = lvl;
        State.score = 0;
        State.distance = 0;
        State.frames = 0;
        State.isPlaying = true;
        State.isPaused = false;
        State.shake = 0;
        
        const isBoss = LEVEL_DATA[lvl].type === 'boss';
        this.player.y = 0;
        this.player.vy = 0;
        this.player.x = isBoss ? this.width / 2 - 20 : 50; 
        
        this.obstacles = [];
        this.particles = [];
        this.finishLine = null;
        
        if (isBoss) {
            State.boss.hp = 100;
            State.boss.x = this.width / 2;
            State.boss.y = 80;
            State.boss.dir = 1;
            UI.toggleBossUI(true);
        } else {
            UI.toggleBossUI(false);
        }

        // Init level specific FX
        State.stars = Array.from({length: 50}, () => ({ x: Math.random()*this.width, y: Math.random()*(this.height-150), r: Math.random()*2, a: Math.random() }));
        State.rain = Array.from({length: 120}, () => ({ x: Math.random()*this.width, y: Math.random()*this.height, l: 15+Math.random()*25, s: 12+Math.random()*8 }));
        State.clouds = Array.from({length: 6}, () => ({ x: Math.random()*this.width, y: Math.random()*200, r: 40+Math.random()*40, s: 0.2+Math.random()*0.3 }));
        
        UI.updateHUD();
        const lvlCfg = LEVEL_DATA[lvl];
        AudioSys.playBGM(lvlCfg.track, lvlCfg.rate);
    },

    loop() {
        requestAnimationFrame(this.loop);
        const dt = 1; 
        if (State.isPlaying && !State.isPaused) {
            if (LEVEL_DATA[State.level].type === 'boss') this.updateBoss(dt);
            else this.updateRunner(dt);
        }
        if (State.shake > 0) State.shake *= 0.9;
        this.render();
    },

    updateRunner(dt) {
        State.frames++;
        const cfg = LEVEL_DATA[State.level];
        let baseSpeed = (window.gameConfig.heroSpeed || 6);
        if (State.level === 6) baseSpeed += 2;
        
        const speed = baseSpeed + (State.distance * 0.001);
        State.distance += speed * 0.1;
        
        if (State.distance >= cfg.goal && !this.finishLine) this.finishLine = { x: this.width + 100 };
        
        this.player.vy += 0.7; 
        this.player.y += this.player.vy;
        const groundY = this.height - 120;
        if (this.player.y + 40 > groundY) {
            this.player.y = groundY - 40;
            this.player.vy = 0;
            if (!this.player.grounded) {
                 AudioSys.playSFX('land', { volume: 0.4, cooldown: 120, rate: State.level >= 5 ? 0.92 : 1 });
            }
            this.player.grounded = true;
        }

        // Obstacle Spawning
        if (!this.finishLine && State.frames % Math.max(40, 100 - Math.floor(speed * 2)) === 0) {
            const chance = State.level === 6 ? 0.4 : 0.3; 
            if (Math.random() > (1-chance)) {
                const type = Math.random() > 0.6 ? 'bird' : 'box';
                this.obstacles.push({
                    x: this.width, y: type === 'bird' ? groundY - 110 : groundY - 50,
                    w: 50, h: 50, type: type, passed: false
                });
            }
        }

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.x -= speed;
            if (this.checkCollide(this.player, ob)) this.gameOver();
            if (!ob.passed && ob.x + ob.w < this.player.x) {
                State.score += 10; ob.passed = true;
                UI.updateHUD(); AudioSys.playSFX('coin', { volume: 0.55, cooldown: 90, rate: 1.06 });
            }
            if (ob.x < -100) this.obstacles.splice(i, 1);
        }

        if (this.finishLine) {
            this.finishLine.x -= speed;
            if (this.finishLine.x < this.player.x) this.victory();
        }

        this.updateFX();
        UI.updateProgress(State.distance / cfg.goal);
    },

    updateBoss(dt) {
        State.frames++;
        this.player.vy += 0.7;
        this.player.y += this.player.vy;
        const groundY = this.height - 120;
        if (this.player.y + 40 > groundY) {
            this.player.y = groundY - 40;
            this.player.vy = 0;
            this.player.grounded = true;
        }

        State.boss.x += 3 * State.boss.dir;
        if (State.boss.x < 50 || State.boss.x > this.width - 50) State.boss.dir *= -1;

        if (State.frames % 50 === 0) {
            this.obstacles.push({ x: State.boss.x, y: State.boss.y + 40, w: 40, h: 40, type: 'cube_bad', vy: 6 });
        }
        if (State.frames % 120 === 0) {
            this.obstacles.push({ x: Math.random() * (this.width - 60) + 30, y: -50, w: 30, h: 30, type: 'powerup', vy: 4 });
        }

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let ob = this.obstacles[i];
            ob.y += ob.vy;
            if (this.checkCollide(this.player, ob)) {
                if (ob.type === 'cube_bad') {
                    this.gameOver();
                } else if (ob.type === 'powerup') {
                    State.boss.hp -= 20; State.score += 50;
                    AudioSys.playSFX('success', { volume: 0.6, cooldown: 120, rate: 1 });
                    this.spawnParticles(ob.x, ob.y, 10, '#fbbf24');
                    this.obstacles.splice(i, 1);
                    FX.showGif('win', 1500);
                    UI.updateBossBar(); UI.updateHUD();
                    if (State.boss.hp <= 0) this.victory();
                    continue;
                }
            }
            if (ob.type === 'cube_bad' && ob.y > groundY && ob.y < groundY + 20) {
                 State.shake = 10;
                 this.spawnParticles(ob.x, groundY, 5, '#ef4444');
                 AudioSys.playSFX('warning', { volume: 0.38, cooldown: 250, rate: 0.96 });
            }
            if (ob.y > this.height) this.obstacles.splice(i, 1);
        }
        this.updateFX();
    },

    updateFX() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
        if (State.level === 5) {
            State.rain.forEach(r => {
                r.y += r.s;
                if (r.y > this.height) { r.y = -20; r.x = Math.random() * this.width; }
            });
            State.clouds.forEach(c => {
                c.x -= c.s;
                if (c.x < -100) c.x = this.width + 100;
            });
        }
    },

    render() {
        const w = this.width; const h = this.height;
        const lvl = State.level;
        
        this.ctx.save();
        if (State.shake > 0.5) {
            const dx = (Math.random() - 0.5) * State.shake;
            const dy = (Math.random() - 0.5) * State.shake;
            this.ctx.translate(dx, dy);
        }

        this.ctx.clearRect(0, 0, w, h);

        // --- BACKGROUNDS ---
        if (lvl === 1) {
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#bae6fd');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#fde047';
            this.ctx.beginPath(); this.ctx.arc(w - 60, 80, 40, 0, Math.PI*2); this.ctx.fill();
        } else if (lvl === 2) {
            const img = document.getElementById('asset_bg_sunset');
            if (img && img.complete && img.naturalWidth > 0) {
                 const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
                 const iw = img.naturalWidth * scale; const ih = img.naturalHeight * scale;
                 this.ctx.drawImage(img, (w - iw)/2, (h - ih)/2, iw, ih);
            } else {
                this.ctx.fillStyle = '#7c2d12'; this.ctx.fillRect(0, 0, w, h);
            }
        } else if (lvl === 3) {
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#020617'); grad.addColorStop(1, '#1e1b4b');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#fff';
            State.stars.forEach(s => {
                this.ctx.globalAlpha = s.a;
                this.ctx.beginPath(); this.ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); this.ctx.fill();
            });
            this.ctx.globalAlpha = 1;
        } else if (lvl === 4) { 
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#450a0a'); grad.addColorStop(1, '#000');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            const pulse = 1 + Math.sin(State.frames * 0.1) * 0.1;
            this.ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
            this.ctx.beginPath(); this.ctx.arc(w/2, h/2, w*0.8*pulse, 0, Math.PI*2); this.ctx.fill();
        } else if (lvl === 5) { 
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#64748b'); grad.addColorStop(1, '#334155');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            this.ctx.fillStyle = '#1e293b';
            for(let i=0; i<w+300; i+=150) {
                const x = (i - (State.distance * 0.2 % 300));
                const hStack = 200 + Math.sin(i)*50;
                this.ctx.fillRect(x, h - 120 - hStack, 40, hStack);
            }
        } else if (lvl === 6) { 
            const grad = this.ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#000000');
            this.ctx.fillStyle = grad; this.ctx.fillRect(0, 0, w, h);
            
            this.ctx.fillStyle = '#1e293b';
            const parallax1 = (State.distance * 0.1) % 200;
            for (let i = -200; i < w + 200; i += 200) {
                this.ctx.fillRect(i - parallax1, 0, 60, h);
            }

            this.ctx.fillStyle = '#334155';
            const gearRot = State.frames * 0.03;
            for (let i = 0; i < 3; i++) {
                const gx = (w * 0.25) + (i * w * 0.4);
                const gy = h * 0.4;
                this.ctx.save();
                this.ctx.translate(gx, gy);
                this.ctx.rotate(gearRot * (i % 2 === 0 ? 1 : -1));
                
                const teeth = 8;
                for (let j = 0; j < teeth; j++) {
                    this.ctx.rotate(Math.PI * 2 / teeth);
                    this.ctx.fillRect(-20, -100, 40, 30);
                }
                this.ctx.beginPath(); this.ctx.arc(0, 0, 80, 0, Math.PI * 2); this.ctx.fill();
                
                const corePulse = 1 + Math.sin(State.frames * 0.2) * 0.2;
                this.ctx.fillStyle = `rgba(239, 68, 68, ${0.5 + Math.sin(State.frames*0.1)*0.5})`; 
                this.ctx.beginPath(); this.ctx.arc(0, 0, 30 * corePulse, 0, Math.PI * 2); this.ctx.fill();
                
                this.ctx.restore();
                this.ctx.fillStyle = '#334155';
            }
            
            this.ctx.save();
            this.ctx.font = "900 120px monospace";
            this.ctx.fillStyle = "rgba(255, 0, 0, 0.05)";
            this.ctx.textAlign = "center";
            this.ctx.translate(w/2, h/2);
            this.ctx.rotate(-0.2);
            const warnX = (State.frames * 2) % (w * 2) - w;
            this.ctx.fillText("WARNING", warnX, 0);
            this.ctx.restore();

            this.ctx.fillStyle = `rgba(220, 38, 38, ${0.05 + Math.sin(State.frames * 0.05) * 0.05})`;
            this.ctx.fillRect(0, 0, w, h);
        }

        // --- GROUND ---
        this.ctx.fillStyle = LEVEL_DATA[lvl].ground;
        this.ctx.fillRect(0, h - 120, w, 120);
        
        if (lvl === 6) {
             this.ctx.fillStyle = '#f59e0b';
             const offset = (State.distance * 0.5) % 60;
             for(let i=-60; i<w+60; i+=60) {
                 this.ctx.beginPath();
                 this.ctx.moveTo(i - offset, h-120);
                 this.ctx.lineTo(i+30 - offset, h-120);
                 this.ctx.lineTo(i+10 - offset, h-110);
                 this.ctx.lineTo(i-20 - offset, h-110);
                 this.ctx.fill();
             }
        }

        if (State.isPlaying || State.screen === 'gameover' || State.screen === 'victory') {
            if (this.finishLine) {
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.finishLine.x, h - 300, 10, 180);
                this.ctx.fillRect(this.finishLine.x + 100, h - 300, 10, 180);
                this.ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#fbbf24' : '#000';
                this.ctx.fillRect(this.finishLine.x, h - 300, 110, 40);
            }

            if (lvl === 4) {
                const b = State.boss;
                this.drawTechHalo(b.x, b.y, 52, '#ff7a98', 0.28);
                this.ctx.fillStyle = '#8b102f';
                this.ctx.beginPath();
                this.ctx.roundRect(b.x - 42, b.y - 42, 84, 84, 18);
                this.ctx.fill();
                this.ctx.strokeStyle = '#ff8fab'; this.ctx.lineWidth = 4;
                this.ctx.stroke();
                this.ctx.fillStyle = '#1a0610';
                this.ctx.beginPath();
                this.ctx.arc(b.x - 16, b.y - 10, 9, 0, Math.PI * 2);
                this.ctx.arc(b.x + 16, b.y - 10, 9, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.fillStyle = '#ffd166';
                this.ctx.fillRect(b.x - 22, b.y + 16, 44, 8);
                this.ctx.fillRect(b.x - 6, b.y + 10, 12, 20);
            }

            this.ctx.save();
            this.ctx.translate(this.player.x + 20, this.player.y + 20);
            const bob = Math.sin(State.frames * 0.15) * 1.5;
            this.ctx.translate(0, bob);
            this.drawTechHalo(0, 0, 24, 'rgba(108,236,255,0.9)', 0.18);
            this.ctx.fillStyle = State.hero.color;
            
            if (State.hero.type === 1) {
                const orbGrad = this.ctx.createRadialGradient(-6, -8, 3, 0, 0, 22);
                orbGrad.addColorStop(0, '#ffffff');
                orbGrad.addColorStop(0.2, '#93c5fd');
                orbGrad.addColorStop(1, State.hero.color);
                this.ctx.fillStyle = orbGrad;
                this.ctx.beginPath(); this.ctx.arc(0, 0, 20, 0, Math.PI*2); this.ctx.fill();
                this.ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                this.ctx.fillStyle = '#07111f';
                this.ctx.beginPath(); this.ctx.arc(-6, -2, 3, 0, Math.PI*2); this.ctx.arc(6, -2, 3, 0, Math.PI*2); this.ctx.fill();
            } else if (State.hero.type === 2) {
                this.ctx.rotate(State.frames * 0.08);
                this.ctx.beginPath(); this.ctx.moveTo(0, -22); this.ctx.lineTo(16, -4); this.ctx.lineTo(24, 0); this.ctx.lineTo(16, 4); this.ctx.lineTo(0, 22); this.ctx.lineTo(-16, 4); this.ctx.lineTo(-24, 0); this.ctx.lineTo(-16, -4); this.ctx.closePath(); this.ctx.fill();
                this.ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                this.ctx.fillStyle = '#3b2300';
                this.ctx.fillRect(-4, -8, 8, 16);
            } else {
                this.ctx.beginPath();
                this.ctx.roundRect(-20, -20, 40, 40, 12);
                this.ctx.fill();
                this.ctx.fillStyle = 'rgba(255,255,255,0.2)';
                this.ctx.fillRect(-14, -14, 28, 10);
                this.ctx.fillStyle = '#08111d';
                this.ctx.fillRect(-11, -2, 8, 8);
                this.ctx.fillRect(3, -2, 8, 8);
                this.ctx.fillStyle = '#ffd166';
                this.ctx.fillRect(-8, 10, 16, 4);
            }
            this.ctx.restore();

            this.obstacles.forEach(ob => {
                if (ob.type === 'powerup') {
                    this.drawTechHalo(ob.x + 15, ob.y + 15, 20, '#6cecff', 0.22);
                    const pGrad = this.ctx.createRadialGradient(ob.x + 10, ob.y + 8, 3, ob.x + 15, ob.y + 15, 18);
                    pGrad.addColorStop(0, '#ffffff');
                    pGrad.addColorStop(0.35, '#7dd3fc');
                    pGrad.addColorStop(1, '#2563eb');
                    this.ctx.fillStyle = pGrad;
                    this.ctx.beginPath(); this.ctx.arc(ob.x + 15, ob.y + 15, 15, 0, Math.PI*2); this.ctx.fill();
                    this.ctx.strokeStyle = '#fff'; this.ctx.lineWidth = 2; this.ctx.stroke();
                } else if (ob.type === 'cube_bad') {
                    this.drawTechHalo(ob.x + ob.w / 2, ob.y + ob.h / 2, 24, '#ff5d7c', 0.14);
                    this.ctx.fillStyle = '#7f1d1d';
                    this.ctx.beginPath();
                    this.ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 8);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#fecdd3';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    this.ctx.fillStyle = '#1f060d';
                    this.ctx.fillRect(ob.x + 8, ob.y + 10, 8, 8);
                    this.ctx.fillRect(ob.x + ob.w - 16, ob.y + 10, 8, 8);
                } else if (ob.type === 'bird') {
                    this.ctx.fillStyle = '#ffb703';
                    this.ctx.beginPath();
                    this.ctx.moveTo(ob.x + 6, ob.y + 26);
                    this.ctx.quadraticCurveTo(ob.x + 20, ob.y + 6, ob.x + 34, ob.y + 26);
                    this.ctx.quadraticCurveTo(ob.x + 20, ob.y + 18, ob.x + 6, ob.y + 26);
                    this.ctx.fill();
                    this.ctx.fillStyle = '#fb8500';
                    this.ctx.fillRect(ob.x + 16, ob.y + 24, 14, 8);
                    this.ctx.fillStyle = '#111827';
                    this.ctx.fillRect(ob.x + 24, ob.y + 18, 4, 4);
                } else {
                    this.ctx.fillStyle = lvl === 6 ? '#f97316' : '#fbbf24';
                    this.ctx.beginPath();
                    this.ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 10);
                    this.ctx.fill();
                    this.ctx.fillStyle = 'rgba(255,255,255,0.16)';
                    this.ctx.fillRect(ob.x + 6, ob.y + 6, ob.w - 12, 10);
                    if (lvl === 6) {
                        this.ctx.strokeStyle = '#000';
                        this.ctx.lineWidth = 2;
                        this.ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
                    }
                }
            });

            this.particles.forEach(p => {
                this.ctx.fillStyle = p.color;
                this.ctx.globalAlpha = p.life / 20;
                this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); this.ctx.fill();
                this.ctx.globalAlpha = 1;
            });

            if (lvl === 5) {
                this.ctx.strokeStyle = 'rgba(200, 200, 220, 0.5)';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                State.rain.forEach(r => { this.ctx.moveTo(r.x, r.y); this.ctx.lineTo(r.x, r.y + r.l); });
                this.ctx.stroke();
            }
        }
        this.ctx.restore();
    },

    checkCollide(p, o) {
        return (p.x < o.x + o.w - 8 && p.x + p.w > o.x + 8 && p.y < o.y + o.h - 8 && p.y + p.h > o.y + 8);
    },

    spawnParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
                life: 20+Math.random()*10, color: color, r: 2+Math.random()*4
            });
        }
    },

    drawTechHalo(x, y, radius, color, alpha = 0.35) {
        this.ctx.save();
        this.ctx.globalAlpha = alpha;
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth = 3;
        this.ctx.beginPath();
        this.ctx.arc(x, y, radius, 0, Math.PI * 2);
        this.ctx.stroke();
        this.ctx.restore();
    },

    gameOver() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('fail', { volume: 0.68, cooldown: 200 });
        AudioSys.playBGM('defeat');
        FX.showGif('fail', 2200);
        UI.show('gameover');
    },

    victory() {
        State.isPlaying = false;
        AudioSys.stopBGM();
        AudioSys.playSFX('success', { volume: 0.68, cooldown: 200 });
        AudioSys.playBGM('victory');
        FX.showGif('win', 2400);
        UI.show('victory');
    }
};

const FX = {
    timers: {},
    showGif(type, duration = 1600) {
        const el = document.getElementById(`gif-${type}`);
        if (!el) return;
        clearTimeout(this.timers[type]);
        el.classList.add('show');
        this.timers[type] = setTimeout(() => el.classList.remove('show'), duration);
    },
    hideAll() {
        ['win', 'fail'].forEach(type => {
            const el = document.getElementById(`gif-${type}`);
            if (el) el.classList.remove('show');
            clearTimeout(this.timers[type]);
        });
    }
};

// --- UI ---
const UI = {
    screens: {
        menu: 'menu-screen', info: 'info-screen', level: 'level-screen',
        char: 'char-screen', settings: 'settings-screen', hud: 'hud',
        pause: 'pause-screen', gameover: 'game-over-screen', victory: 'victory-screen'
    },
    init() {
        const on = (id, fn) => {
            const el = document.getElementById(id);
            if (el) el.onclick = () => {
                AudioSys.unlock();
                if (id !== 'btn-resume') AudioSys.playSFX('ui', { volume: 0.34, cooldown: 60, rate: 1.04 });
                fn();
            };
        };
        on('btn-play-menu', () => this.show('level'));
        on('btn-info', () => this.show('info'));
        on('btn-close-info', () => this.show('menu'));
        on('btn-chars', () => this.show('char'));
        on('btn-settings', () => this.show('settings'));
        on('btn-back-level', () => this.show('menu'));
        on('btn-back-char', () => this.show('menu'));
        on('btn-back-settings', () => this.show('menu'));
        
        [1,2,3,4,5,6].forEach(i => on(`lvl-${i}`, () => this.start(i)));
        
        on('btn-pause', () => { State.isPaused = true; AudioSys.playSFX('pause', { volume: 0.5, cooldown: 100 }); this.show('pause'); });
        on('btn-resume', () => { State.isPaused = false; AudioSys.playSFX('resume', { volume: 0.5, cooldown: 100 }); this.show('hud'); });
        on('btn-quit', () => { AudioSys.playBGM('menu'); this.show('menu'); });
        
        on('btn-home-fail', () => { AudioSys.playBGM('menu'); this.show('menu'); });
        on('btn-home-win', () => { AudioSys.playBGM('menu'); this.show('menu'); });
        on('btn-restart-fail', () => this.start(State.level));
        on('btn-restart-win', () => this.start(State.level < 6 ? State.level + 1 : 1));

        [0,1,2].forEach(i => {
            document.getElementById(`char-${i}`).onclick = (e) => {
                State.hero.type = i;
                State.hero.color = i===0?'#ef4444':(i===1?'#3b82f6':'#facc15');
                document.querySelectorAll('#char-screen .hero-card').forEach(d => { d.style.opacity='0.5'; d.style.borderColor='transparent'; d.classList.remove('active'); });
                e.currentTarget.style.opacity='1'; e.currentTarget.style.borderColor='#d5f9ff'; e.currentTarget.classList.add('active');
            };
        });

        on('btn-toggle-sound', () => {
            State.soundOn = !State.soundOn;
            const t = State.soundOn;
            const txt = TEXTS[State.language];
            document.getElementById('snd-text').innerText = t ? txt.soundOn : txt.soundOff;
            document.getElementById('snd-icon').innerText = t ? "🔊" : "🔇";
            document.getElementById('btn-toggle-sound').className = `btn w-full text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 border-b-4 active:border-b-0 active:translate-y-1 ${t?'bg-emerald-500 border-emerald-700':'bg-red-500 border-red-700'}`;
            if(t) AudioSys.playBGM('menu'); else AudioSys.stopBGM();
        });

        this.setLanguage(State.language);
    },
    setLanguage(lang) {
        const t = TEXTS[lang];
        // Menu
        document.getElementById('ui-subtitle').innerText = t.subtitle;
        document.getElementById('btn-play-menu').innerText = t.play;
        document.getElementById('btn-info').innerText = t.info;
        document.getElementById('txt-hero').innerText = t.hero;
        document.getElementById('txt-settings').innerText = t.settings;
        
        // Info
        document.getElementById('txt-how-to').innerText = t.howTo;
        document.getElementById('txt-tap').innerText = t.tap;
        document.getElementById('txt-tap-desc').innerText = t.tapDesc;
        document.getElementById('txt-collect').innerText = t.collect;
        document.getElementById('txt-collect-desc').innerText = t.collectDesc;
        document.getElementById('txt-dodge').innerText = t.dodge;
        document.getElementById('txt-dodge-desc').innerText = t.dodgeDesc;
        document.getElementById('btn-close-info').innerText = t.understood;

        // Level Select
        document.getElementById('txt-select-act').innerText = t.selectAct;
        document.getElementById('btn-back-level').innerText = t.back;
        [1,2,3,4,5,6].forEach(i => {
            document.getElementById(`lvl-txt-${i}`).innerText = t[`act${i}`];
        });

        // Pause/Game Over/Victory
        document.getElementById('txt-pause').innerText = t.pause;
        document.getElementById('btn-resume').innerText = t.resume;
        document.getElementById('btn-quit').innerText = t.quit;
        document.getElementById('txt-fail').innerText = t.fail;
        document.getElementById('txt-victory').innerText = t.victory;

        // Settings
        document.getElementById('txt-config').innerText = t.config;
        document.getElementById('snd-text').innerText = State.soundOn ? t.soundOn : t.soundOff;
        document.getElementById('btn-back-settings').innerText = t.back;

        // Char
        document.getElementById('txt-choose-hero').innerText = t.chooseHero;
        document.getElementById('btn-back-char').innerText = t.confirm;

        // Boss Hint
        document.getElementById('boss-hint').innerText = t.bossHint;
    },
    show(id) {
        State.screen = id;
        if (id !== 'gameover' && id !== 'victory') FX.hideAll();
        Object.values(this.screens).forEach(sid => document.getElementById(sid).classList.add('hidden'));
        const el = document.getElementById(this.screens[id]);
        if(el) {
            el.classList.remove('hidden');
            if(id === 'hud') el.classList.add('flex');
        }
    },
    start(lvl) {
        AudioSys.unlock();
        FX.hideAll();
        AudioSys.playSFX('start', { volume: 0.46, cooldown: 100 });
        Game.reset(lvl);
        this.show('hud');
        const h = document.getElementById('boss-hint');
        if(lvl === 4) { h.classList.remove('hidden'); setTimeout(()=>h.classList.add('hidden'), 4000); }
        else h.classList.add('hidden');
    },
    toggleBossUI(show) {
        const n = document.getElementById('bar-container-normal');
        const b = document.getElementById('bar-container-boss');
        if(show) { n.classList.add('hidden'); b.classList.remove('hidden'); this.updateBossBar(); }
        else { n.classList.remove('hidden'); b.classList.add('hidden'); }
    },
    updateBossBar() {
        document.getElementById('boss-fill').style.width = `${Math.max(0, State.boss.hp)}%`;
    },
     updateHUD() {
         document.getElementById('score-display').innerText = State.score;
     },
    updateProgress(p) {
        document.getElementById('progress-fill').style.width = `${Math.min(Math.max(p,0),1)*100}%`;
    }
};

// --- INIT ---
document.addEventListener('DOMContentLoaded', () => {
    parseConfig();
    AudioSys.init();
    Game.init();
    UI.init();
    document.body.addEventListener('pointerdown', () => {
        AudioSys.unlock();
        if (!State.isPlaying && State.screen === 'menu') AudioSys.playBGM('menu');
    }, { once: true });
    document.body.addEventListener('keydown', () => AudioSys.unlock(), { once: true });
});
</script>
</body>
</html>
