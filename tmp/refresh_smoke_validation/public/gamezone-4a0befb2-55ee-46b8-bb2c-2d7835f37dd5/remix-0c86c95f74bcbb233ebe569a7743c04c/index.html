<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Titan City Destroyer</title>
    <!-- [agent-note][stage4] preserve: catalog-font pairing | title=Audiowide | ui=Exo 2 -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #14070a;
            --bg-mid: #3c0e12;
            --bg-bottom: #74191f;
            --panel-bg: rgba(13, 7, 12, 0.78);
            --panel-border: rgba(255, 112, 112, 0.42);
            --panel-highlight: rgba(255, 196, 130, 0.12);
            --text-main: #f4f5ff;
            --text-muted: #c8cad7;
            --text-dim: #9da1b3;
            --danger: #ff5757;
            --danger-deep: #8f1117;
            --warning: #ffb347;
            --success: #7cff84;
            --shadow-strong: rgba(0, 0, 0, 0.72);
            --glow-danger: rgba(255, 90, 90, 0.26);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 120, 78, 0.16), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, #1b0709 34%, var(--bg-mid) 72%, var(--bg-bottom) 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .display-font {
            font-family: 'Audiowide', system-ui, sans-serif;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 10%, rgba(255, 162, 110, 0.18), transparent 26%),
                linear-gradient(180deg, rgba(12, 8, 14, 0.26), rgba(0, 0, 0, 0.16));
        }

        .game-shell::before,
        .game-shell::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .game-shell::before {
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 100%);
            background-size: 42px 42px, 42px 42px;
            opacity: 0.18;
            mix-blend-mode: screen;
        }

        .game-shell::after {
            background:
                radial-gradient(circle at 50% 100%, rgba(255, 86, 86, 0.14), transparent 40%),
                linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.18));
        }

        .flash-overlay {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 75ms linear;
        }

        .gif-burst {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: min(30vw, 130px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.18);
            background: rgba(15, 7, 12, 0.7);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 2;
        }

        .gif-burst.show {
            opacity: 0.9;
            transform: translateY(0) scale(1);
        }

        .gif-burst.fail {
            left: 14px;
            right: auto;
            bottom: 14px;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 16px;
            z-index: 3;
        }

        .hidden {
            display: none !important;
        }

        .glass-panel {
            position: relative;
            width: min(100%, 420px);
            margin: 0 12px;
            padding: 24px 20px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(38, 16, 21, 0.9), rgba(14, 9, 18, 0.88)),
                rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 18px 50px var(--shadow-strong),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 0 0 1px rgba(255, 120, 120, 0.06);
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, var(--panel-highlight), transparent 36%),
                linear-gradient(180deg, transparent, rgba(255, 93, 93, 0.05));
        }

        .center-screen {
            text-align: center;
            pointer-events: auto;
        }

        .panel-title {
            margin: 0 0 14px;
            color: var(--danger);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2rem, 7vw, 3.1rem);
            line-height: 0.98;
            letter-spacing: 0.05em;
            text-shadow: 0 3px 0 rgba(45, 0, 0, 0.8), 0 0 24px var(--glow-danger);
        }

        .panel-subtitle {
            margin: 0 0 12px;
            color: var(--text-muted);
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .briefing {
            margin: 0 0 20px;
            padding: 12px 14px;
            list-style: none;
            text-align: left;
            color: var(--text-dim);
            font-size: 0.92rem;
            line-height: 1.45;
            background: rgba(0, 0, 0, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .briefing li + li {
            margin-top: 6px;
        }

        .strong-text {
            color: var(--text-main);
            font-weight: 700;
        }

        .action-button {
            width: 100%;
            min-height: 54px;
            border: 0;
            border-radius: 14px;
            padding: 14px 18px;
            background: linear-gradient(180deg, #e34747, #970d12);
            color: #fff;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow:
                0 6px 0 #4c080a,
                0 12px 24px rgba(0, 0, 0, 0.34),
                0 0 22px rgba(255, 87, 87, 0.22);
            transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
            cursor: pointer;
        }

        .action-button:hover,
        .action-button:focus-visible {
            filter: brightness(1.08);
            outline: none;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #4c080a,
                0 6px 14px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(255, 87, 87, 0.18);
        }

        .action-button.alt {
            background: linear-gradient(180deg, #ffffff, #d7d8de);
            color: #161616;
            box-shadow: 0 6px 0 #8f9198, 0 12px 24px rgba(0, 0, 0, 0.28);
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: none;
        }

        .hud-cluster {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: min(68vw, 300px);
        }

        .hud-cluster.right {
            align-items: flex-end;
            text-align: right;
            max-width: 38vw;
        }

        .hud-label {
            color: #ff7373;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(0.78rem, 2.6vw, 1.05rem);
            letter-spacing: 0.18em;
            text-shadow: 0 0 14px rgba(255, 82, 82, 0.26);
        }

        .health-track {
            position: relative;
            width: min(64vw, 260px);
            height: 24px;
            background: rgba(18, 19, 28, 0.88);
            border: 2px solid rgba(120, 16, 16, 0.95);
            border-radius: 999px;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.05),
                0 6px 16px rgba(0,0,0,0.3);
        }

        .health-bar {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ff4d4d, #ff7a5f);
            transition: width 100ms linear, background 100ms linear;
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.18);
        }

        .hud-meta {
            color: var(--text-main);
            font-size: clamp(0.82rem, 2.9vw, 0.95rem);
            letter-spacing: 0.05em;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            font-weight: 600;
        }

        .timer-readout {
            color: var(--text-main);
            font-family: 'Audiowide', system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(2rem, 7vw, 2.7rem);
            line-height: 1;
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.1);
        }

        .end-title {
            margin: 0 0 14px;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: clamp(2rem, 7vw, 3rem);
            line-height: 1;
            color: var(--text-main);
        }

        .end-title.success {
            color: #6cff90;
            text-shadow: 0 0 22px rgba(108, 255, 144, 0.26);
        }

        .end-title.fail {
            color: var(--danger);
            text-shadow: 0 0 22px rgba(255, 87, 87, 0.26);
        }

        .end-message {
            margin: 0 0 22px;
            color: var(--text-muted);
            font-size: clamp(0.98rem, 3.8vw, 1.18rem);
        }

        #sticker-67 {
            display: none;
            width: 132px;
            height: 132px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 5px solid #fff3c1;
            background:
                radial-gradient(circle at 32% 28%, #fff3a8 0 24%, #ffcc00 24% 72%, #e88a00 100%);
            color: #231100;
            font-family: 'Audiowide', system-ui, sans-serif;
            font-size: 52px;
            line-height: 122px;
            text-align: center;
            transform: rotate(-15deg);
            box-shadow:
                5px 5px 0 rgba(0,0,0,0.42),
                0 0 26px rgba(255, 204, 0, 0.26);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(0deg); }
            100% { transform: scale(1) rotate(-15deg); }
        }

        @media (max-width: 640px) {
            .ui-layer {
                padding: 12px;
            }

            .glass-panel {
                width: min(100%, 360px);
                padding: 20px 16px;
                margin: 0 6px;
                border-radius: 16px;
            }

            .hud {
                padding: 10px;
                gap: 10px;
            }

            .hud-cluster {
                gap: 5px;
                max-width: min(67vw, 228px);
            }

            .hud-cluster.right {
                max-width: 32vw;
            }

            .health-track {
                width: min(56vw, 205px);
                height: 20px;
            }

            #sticker-67 {
                width: 116px;
                height: 116px;
                font-size: 46px;
                line-height: 106px;
            }

            .gif-burst,
            .gif-burst.fail {
                width: 94px;
                right: 10px;
                left: auto;
                bottom: 10px;
            }

            .gif-burst.fail {
                left: 10px;
                right: auto;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <div id="flash-overlay" class="flash-overlay"></div>

        <!-- [agent-note][stage3] resolved-gif: hit + fail overlays from catalogs/gifs.json; kept compact to protect controls -->
        <img id="impact-gif" class="gif-burst" alt="Impact burst feedback">
        <img id="fail-gif" class="gif-burst fail" alt="Failure reaction feedback">

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
            <div id="hud" class="hud hidden">
                <div class="hud-cluster">
                    <span class="hud-label">SIGNAL STABILITY</span>
                    <div class="health-track">
                        <div id="health-bar" class="health-bar" style="width: 100%;"></div>
                    </div>
                    <span class="hud-meta"><span id="clicks-left">67</span> TAPS TO BREAK</span>
                </div>
                <div class="hud-cluster right">
                    <span class="hud-label">JAM WINDOW</span>
                    <div class="timer-readout" id="timer">67.0</div>
                </div>
            </div>

            <div id="start-screen" class="glass-panel center-screen">
                <h1 class="panel-title">MEGA SIGNAL BLACKOUT</h1>
                <p class="panel-subtitle">MISSION: CRASH THE BROADCAST CORE</p>
                <ul class="briefing">
                    <li>• TARGET: Rogue Broadcast Core</li>
                    <li>• REQUIRED TAPS: <span class="strong-text">67</span></li>
                    <li>• JAM WINDOW: <span class="strong-text">67 Seconds</span></li>
                </ul>
                <button id="start-btn" class="action-button">
                    START BLACKOUT
                </button>
            </div>

            <div id="game-over-screen" class="glass-panel center-screen hidden">
                <h2 id="end-title" class="end-title">MISSION STATUS</h2>

                <div id="sticker-67">67</div>

                <p id="end-message" class="end-message">Target Destroyed.</p>

                <button id="restart-btn" class="action-button alt">
                    Retry Jam
                </button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                hit: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                win: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"
            },
            image: "https://gamezone-virid.vercel.app/assets/images/sprites/tower/enemy_tank.png",
            gifs: {
                impact: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        const titanImage = new Image();
        titanImage.src = ASSETS.image;

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayTimes = {};

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    this.sfx[key] = audio;
                }

                this.sfx.hit.volume = 0.5;
                this.sfx.warning.volume = 0.52;
                this.sfx.start.volume = 0.55;
                this.sfx.restart.volume = 0.48;
                this.sfx.win.volume = 0.62;
                this.sfx.fail.volume = 0.58;
            }

            unlock() {
                this.unlocked = true;
            }

            playBGM() {
                if (!this.unlocked) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, options = {}) {
                if (!this.unlocked || !this.sfx[key]) return;

                const { debounceMs = 0, playbackRate } = options;
                const now = performance.now();
                if (debounceMs && this.lastPlayTimes[key] && now - this.lastPlayTimes[key] < debounceMs) {
                    return;
                }
                this.lastPlayTimes[key] = now;

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume ?? 0.6;
                if (playbackRate) clone.playbackRate = playbackRate;
                clone.play().catch(() => {});
            }
        }

        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const flash = document.getElementById('flash-overlay');
        const impactGif = document.getElementById('impact-gif');
        const failGif = document.getElementById('fail-gif');
        let width, height;
        let gameActive = false;

        // Game Mechanics
        const TOTAL_CLICKS = 67;
        const TIME_LIMIT = 67;

        let clicksRemaining = TOTAL_CLICKS;
        let timeLeft = TIME_LIMIT;
        let lastTime = 0;
        let warningTriggered = false;
        let impactGifTimeout = null;
        let failGifTimeout = null;

        // Visual State
        let shakeIntensity = 0;
        let particles = [];
        let cityBuildings = [];

        // Resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateCity();
        }
        window.addEventListener('resize', resize);

        /** 4. PARALLAX & VISUALS */
        function generateCity() {
            cityBuildings = [];
            const count = 25;
            const step = width / (count / 2);
            for (let i = 0; i < count; i++) {
                cityBuildings.push({
                    x: (i * step) - 100 + (Math.random() * 50),
                    w: 40 + Math.random() * 80,
                    h: 100 + Math.random() * (height * 0.4),
                    layer: i % 2 === 0 ? 1 : 2
                });
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1.0;
                this.color = Math.random() > 0.5 ? '#ff4400' : '#ffcc00';
                this.size = Math.random() * 5 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5;
                this.life -= 0.03;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        function showGif(target, src, duration = 900) {
            target.src = src;
            target.classList.add('show');

            const timeoutKey = target === impactGif ? 'impactGifTimeout' : 'failGifTimeout';
            clearTimeout(timeoutKey === 'impactGifTimeout' ? impactGifTimeout : failGifTimeout);
            const nextTimeout = setTimeout(() => {
                target.classList.remove('show');
            }, duration);

            if (timeoutKey === 'impactGifTimeout') impactGifTimeout = nextTimeout;
            else failGifTimeout = nextTimeout;
        }

        /** 5. GAME LOGIC */
        function initGame() {
            clicksRemaining = TOTAL_CLICKS;
            timeLeft = TIME_LIMIT;
            shakeIntensity = 0;
            particles = [];
            lastTime = performance.now();
            warningTriggered = false;
            flash.style.opacity = '0';
            impactGif.classList.remove('show');
            failGif.classList.remove('show');
            document.getElementById('sticker-67').style.display = 'none';
            updateHUD();
            generateCity();
        }

        function updateHUD() {
            document.getElementById('clicks-left').innerText = clicksRemaining;
            document.getElementById('timer').innerText = timeLeft.toFixed(1);

            const pct = (clicksRemaining / TOTAL_CLICKS) * 100;
            const healthBar = document.getElementById('health-bar');
            healthBar.style.width = `${pct}%`;

            if (pct < 30) healthBar.style.background = 'linear-gradient(90deg, #5d0000, #9e1717)';
            else if (pct < 60) healthBar.style.background = 'linear-gradient(90deg, #ff7d2e, #ffb347)';
            else healthBar.style.background = 'linear-gradient(90deg, #ff4d4d, #ff7a5f)';
        }

        function triggerAttack(x, y) {
            if (!gameActive) return;

            clicksRemaining--;
            audio.playSFX('hit', { debounceMs: 75, playbackRate: 0.92 + Math.random() * 0.16 });
            shakeIntensity = 15;

            flash.style.opacity = '0.3';
            setTimeout(() => { flash.style.opacity = '0'; }, 50);

            if (clicksRemaining % 8 === 0 || clicksRemaining <= 5) {
                showGif(impactGif, ASSETS.gifs.impact, 520);
            }

            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y));
            }

            updateHUD();

            if (!warningTriggered && (clicksRemaining <= 12 || timeLeft <= 12)) {
                warningTriggered = true;
                audio.playSFX('warning', { debounceMs: 500 });
            }

            if (clicksRemaining <= 0) {
                victory();
            }
        }

        function victory() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('win');

            document.getElementById('hud').classList.add('hidden');
            const endScreen = document.getElementById('game-over-screen');
            const endTitle = document.getElementById('end-title');
            endScreen.classList.remove('hidden');

            endTitle.innerText = "BLACKOUT CONFIRMED";
            endTitle.className = "end-title display-font success";
            document.getElementById('end-message').innerText = "Broadcast core crashed in " + (TIME_LIMIT - timeLeft).toFixed(2) + "s";

            document.getElementById('sticker-67').style.display = 'block';
            showGif(impactGif, ASSETS.gifs.impact, 1400);
        }

        function failure() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail');

            document.getElementById('hud').classList.add('hidden');
            const endScreen = document.getElementById('game-over-screen');
            const endTitle = document.getElementById('end-title');
            endScreen.classList.remove('hidden');

            endTitle.innerText = "JAM FAILED";
            endTitle.className = "end-title display-font fail";
            document.getElementById('end-message').innerText = "Time expired. The broadcast stayed live.";

            document.getElementById('sticker-67').style.display = 'none';
            showGif(failGif, ASSETS.gifs.fail, 1800);
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;

            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (dt < 1.0) {
                timeLeft -= dt;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    failure();
                    return;
                }
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);

            if (!warningTriggered && timeLeft <= 12) {
                warningTriggered = true;
                audio.playSFX('warning', { debounceMs: 500 });
            }

            ctx.clearRect(0, 0, width, height);

            const grd = ctx.createLinearGradient(0, 0, 0, height);
            grd.addColorStop(0, '#120406');
            grd.addColorStop(0.5, '#341015');
            grd.addColorStop(1, '#6e191c');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 18; i++) {
                const lineY = (height * 0.1) + i * (height * 0.045);
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 120, 120, 0.10)' : 'rgba(255, 180, 120, 0.05)';
                ctx.fillRect(0, lineY, width, 2);
            }
            ctx.restore();

            let sx = 0, sy = 0;
            if (shakeIntensity > 0) {
                sx = (Math.random() - 0.5) * shakeIntensity;
                sy = (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity *= 0.9;
                if (shakeIntensity < 0.5) shakeIntensity = 0;
            }

            ctx.save();
            ctx.translate(sx, sy);

            ctx.fillStyle = '#221111';
            cityBuildings.forEach(b => {
                if (b.layer === 1) {
                    ctx.fillRect(b.x, height - b.h * 0.7, b.w, b.h * 0.7);
                }
            });

            ctx.fillStyle = '#090909';
            cityBuildings.forEach(b => {
                if (b.layer === 2) {
                    ctx.fillRect(b.x, height - b.h, b.w, b.h);
                }
            });

            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = '#ff8e5d';
            cityBuildings.forEach(b => {
                if (b.layer === 2) {
                    const windowRows = Math.max(2, Math.floor((b.h - 20) / 24));
                    const cols = Math.max(1, Math.floor((b.w - 10) / 14));
                    for (let row = 0; row < windowRows; row++) {
                        for (let col = 0; col < cols; col++) {
                            if ((row + col + Math.floor(b.x)) % 3 === 0) {
                                ctx.fillRect(
                                    b.x + 6 + col * 12,
                                    height - b.h + 12 + row * 20,
                                    5,
                                    8
                                );
                            }
                        }
                    }
                }
            });
            ctx.restore();

            if (titanImage.complete) {
                const imgRatio = titanImage.width / titanImage.height;
                const drawH = height * 0.6;
                const drawW = drawH * imgRatio;
                const drawX = (width - drawW) / 2;
                const drawY = (height - drawH) / 2;

                const hoverY = Math.sin(timestamp / 500) * 10;

                ctx.save();
                ctx.shadowColor = 'rgba(255, 110, 90, 0.45)';
                ctx.shadowBlur = 28;
                ctx.drawImage(titanImage, drawX, drawY + hoverY, drawW, drawH);
                ctx.restore();

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = 'rgba(255, 112, 66, 0.14)';
                ctx.beginPath();
                ctx.ellipse(width / 2, drawY + drawH * 0.54 + hoverY, drawW * 0.25, drawH * 0.34, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        /** 6. CONTROLS */
        const handleInput = (e) => {
            if (!gameActive) return;
            e.preventDefault();

            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            triggerAttack(x, y);
        };

        function bootRun(startSfxKey) {
            audio.unlock();
            audio.playSFX(startSfxKey);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            resize();
            initGame();
            audio.playBGM();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            bootRun('start');
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            bootRun('restart');
        });

        resize();
    });
    </script>
</body>
</html>
