<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Discovery Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage4] repaired-font/mobile: title stays Orbitron, body/ui remapped to Rajdhani from catalogs/fonts.json; tap behavior restored for top controls -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg-deep: #090b1c;
            --bg-mid: #101936;
            --panel: rgba(11, 18, 42, 0.78);
            --panel-strong: rgba(13, 24, 56, 0.92);
            --line: rgba(130, 234, 255, 0.34);
            --glow: rgba(74, 222, 255, 0.38);
            --text: #eff7ff;
            --text-soft: rgba(231, 243, 255, 0.78);
            --accent-cyan: #6cecff;
            --accent-gold: #ffd36c;
            --accent-pink: #ff7ecf;
            --inventory-bg: rgba(238, 246, 255, 0.96);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(108, 236, 255, 0.16), transparent 34%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 70%);
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 211, 108, 0.18), transparent 20%),
                radial-gradient(circle at 82% 22%, rgba(255, 126, 207, 0.14), transparent 18%),
                radial-gradient(circle at 50% 78%, rgba(108, 236, 255, 0.12), transparent 24%);
        }

        body::after {
            opacity: 0.26;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mix-blend-mode: soft-light;
        }

        .bg-animated {
            background:
                radial-gradient(circle at 50% 30%, rgba(89, 220, 255, 0.2), transparent 26%),
                linear-gradient(135deg, rgba(12, 15, 32, 0.26), rgba(11, 18, 42, 0.08));
            animation: gradientBG 12s ease-in-out infinite;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @keyframes gradientBG {
            0%, 100% { transform: scale(1) translateY(0px); opacity: 0.92; }
            50% { transform: scale(1.04) translateY(-8px); opacity: 1; }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            padding: env(safe-area-inset-top) 16px 10px 16px;
            background:
                linear-gradient(180deg, rgba(13, 24, 56, 0.9), rgba(9, 13, 29, 0.76));
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            color: var(--text);
        }

        .title-block h1 {
            margin: 0;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            line-height: 1.05;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(108, 236, 255, 0.45);
        }

        .status-line,
        .instruction-line {
            font-size: 0.8rem;
            color: var(--text-soft);
        }

        .status-line {
            margin-top: 4px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .instruction-line {
            max-width: 34ch;
            margin-top: 4px;
            line-height: 1.1;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .inventory-bar {
            background:
                linear-gradient(180deg, rgba(245, 250, 255, 0.98), var(--inventory-bg));
            padding: 10px 10px env(safe-area-inset-bottom) 10px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            pointer-events: auto;
            box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.28);
            border-top: 1px solid rgba(108, 236, 255, 0.3);
            height: 100px;
            align-items: center;
        }

        .inventory-bar::-webkit-scrollbar {
            display: none;
        }

        .inv-item {
            min-width: 70px;
            height: 70px;
            border-radius: 24px;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(226, 242, 255, 0.92));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-radius 0.12s ease;
            border: 2px solid transparent;
            box-shadow: inset 0 -6px 12px rgba(109, 140, 180, 0.15), 0 8px 16px rgba(8, 16, 32, 0.14);
            position: relative;
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .inv-item::after {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.62);
            pointer-events: none;
        }

        .inv-item:active {
            transform: scale(0.92);
            border-radius: 20px;
        }

        .inv-item span.name {
            font-size: 10px;
            margin-top: 2px;
            color: #18314f;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .btn {
            background: linear-gradient(180deg, rgba(112, 242, 255, 0.24), rgba(95, 132, 255, 0.18));
            border: 1px solid rgba(152, 236, 255, 0.42);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: white;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.04);
        }

        .btn:active {
            background: linear-gradient(180deg, rgba(130, 248, 255, 0.36), rgba(126, 145, 255, 0.26));
            transform: scale(0.97);
        }

        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, rgba(11, 18, 42, 0.96), rgba(30, 18, 58, 0.88));
            color: #fff7d6;
            padding: 14px 24px;
            border-radius: 24px;
            border: 1px solid rgba(255, 211, 108, 0.5);
            box-shadow: 0 0 24px rgba(255, 211, 108, 0.2);
            font-size: 18px;
            font-weight: 700;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            letter-spacing: 0.05em;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            max-width: min(80vw, 320px);
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            width: 88px;
            height: 88px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.24);
            object-fit: cover;
            opacity: 0;
            transform: scale(0.88) translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            background: rgba(8, 14, 30, 0.55);
        }

        .reaction-gif.active {
            opacity: 0.96;
            transform: scale(1) translateY(0);
        }

        #successGif {
            top: calc(env(safe-area-inset-top) + 92px);
        }

        #failGif {
            top: calc(env(safe-area-inset-top) + 190px);
        }

        .audio-pill {
            position: absolute;
            left: 50%;
            top: calc(env(safe-area-inset-top) + 88px);
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 999px;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: rgba(7, 17, 36, 0.78);
            color: rgba(240, 247, 255, 0.92);
            border: 1px solid rgba(108, 236, 255, 0.28);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .audio-pill.ready {
            opacity: 1;
        }

        @media (max-width: 520px) {
            .top-bar {
                padding-right: 104px;
            }

            .button-group {
                flex-direction: column;
            }

            .reaction-gif {
                width: 72px;
                height: 72px;
                right: 8px;
            }

            #successGif {
                top: calc(env(safe-area-inset-top) + 102px);
            }

            #failGif {
                top: calc(env(safe-area-inset-top) + 182px);
            }

            #notification {
                font-size: 14px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <div class="bg-animated"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="title-block">
                <h1>Discovery Lab</h1>
                <div id="scoreDisplay" class="status-line">Clues logged: 4/24</div>
                <div class="instruction-line">Tap a clue to drop it, then drag two together to test a new theory.</div>
            </div>
            <div class="button-group">
                <button class="btn" id="clearBtn">Clear Board</button>
                <button class="btn" id="resetBtn">Reset Log</button>
            </div>
        </div>

        <div id="audioStatus" class="audio-pill">Tap any control to enable lab audio</div>

        <!-- [agent-note][stage3] resolved-gif: success/fail feedback -> catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <img
            id="successGif"
            class="reaction-gif"
            src="https://i.giphy.com/zPmxkHMk2Zseda3FIv.webp"
            alt="Discovery success reaction"
            loading="lazy"
            decoding="async"
        >
        <img
            id="failGif"
            class="reaction-gif"
            src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
            alt="Theory failed reaction"
            loading="lazy"
            decoding="async"
        >

        <!-- [agent-note][stage1] role: future-audio | trigger: discovery-toast | intent: reward successful clue combos -->
        <div id="notification">New clue logged!</div>

        <div class="inventory-bar" id="inventory"></div>
    </div>

<script>
/**
 * DISCOVERY LAB: IDEA-COMBINATION SANDBOX
 * Single-file Vanilla JS implementation
 */

const ELEMENTS = {
    "Fire": { color: "#ef4444", icon: "🔥", base: true },
    "Water": { color: "#3b82f6", icon: "💧", base: true },
    "Earth": { color: "#78350f", icon: "🪨", base: true },
    "Air": { color: "#a5f3fc", icon: "💨", base: true },
    "Steam": { color: "#d1d5db", icon: "🌫️" },
    "Lava": { color: "#ea580c", icon: "🌋" },
    "Mud": { color: "#573a25", icon: "💩" },
    "Energy": { color: "#eab308", icon: "⚡" },
    "Cloud": { color: "#f0f9ff", icon: "☁️" },
    "Dust": { color: "#d6d3d1", icon: "✨" },
    "Stone": { color: "#57534e", icon: "🗿" },
    "Rain": { color: "#6366f1", icon: "🌧️" },
    "Metal": { color: "#64748b", icon: "⚙️" },
    "Life": { color: "#22c55e", icon: "🦠" },
    "Explosion": { color: "#fca5a5", icon: "💥" },
    "Electricity": { color: "#8b5cf6", icon: "🔌" },
    "Plant": { color: "#15803d", icon: "🌳" },
    "Fish": { color: "#0ea5e9", icon: "🐟" },
    "Bird": { color: "#f472b6", icon: "🐦" },
    "Human": { color: "#fda4af", icon: "🧑" },
    "Glass": { color: "#e0f2fe", icon: "🥃" },
    "Robot": { color: "#10b981", icon: "🤖" },
    "Tool": { color: "#9ca3af", icon: "🔨" },
    "Tree": { color: "#14532d", icon: "🌲" },
    "Swamp": { color: "#3f6212", icon: "🐊" }
};

const RECIPES = [
    { in: ["Fire", "Water"], out: "Steam" },
    { in: ["Fire", "Earth"], out: "Lava" },
    { in: ["Water", "Earth"], out: "Mud" },
    { in: ["Air", "Fire"], out: "Energy" },
    { in: ["Air", "Water"], out: "Cloud" },
    { in: ["Air", "Earth"], out: "Dust" },
    { in: ["Lava", "Water"], out: "Stone" },
    { in: ["Lava", "Air"], out: "Stone" },
    { in: ["Cloud", "Water"], out: "Rain" },
    { in: ["Stone", "Fire"], out: "Metal" },
    { in: ["Fire", "Dust"], out: "Explosion" },
        { in: ["Dust", "Fire"], out: "Glass" },
    { in: ["Energy", "Metal"], out: "Electricity" },
    { in: ["Energy", "Water"], out: "Life" },
    { in: ["Energy", "Mud"], out: "Life" },
    { in: ["Life", "Earth"], out: "Plant" },
    { in: ["Life", "Water"], out: "Fish" },
    { in: ["Life", "Air"], out: "Bird" },
    { in: ["Life", "Stone"], out: "Human" },
    { in: ["Life", "Mud"], out: "Human" },
    { in: ["Human", "Metal"], out: "Tool" },
    { in: ["Human", "Electricity"], out: "Robot" },
    { in: ["Plant", "Water"], out: "Tree" },
    { in: ["Mud", "Plant"], out: "Swamp" }
];

// --- Catalog-mapped Audio System ---
// [agent-note][stage3] resolved-audio: spawn/merge/clear/fail/ui/loop -> catalogs/audios.json
const AUDIO_MAP = {
    spawn: "https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3",
    merge: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
    discover: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
    clear: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
    invalid: "https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3",
    click: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
    bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3"
};

const AudioSys = {
    ready: false,
    startedLoop: false,
    bgm: null,
    pools: {},
    lastPlayed: {},
    init() {
        if (this.ready) {
            this.ensureLoop();
            return;
        }

        Object.entries(AUDIO_MAP).forEach(([key, url]) => {
            if (key === 'bgm') {
                const loop = new Audio(url);
                loop.loop = true;
                loop.preload = 'auto';
                loop.volume = 0.2;
                this.bgm = loop;
            } else {
                this.pools[key] = Array.from({ length: 3 }, () => {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.volume = key === 'click' ? 0.3 : key === 'clear' ? 0.34 : 0.42;
                    return audio;
                });
            }
        });

        this.ready = true;
        updateAudioStatus('Lab audio active');
        this.ensureLoop();
    },
    ensureLoop() {
        if (!this.ready || !this.bgm || this.startedLoop) return;
        this.startedLoop = true;
        this.bgm.play().catch(() => {
            this.startedLoop = false;
            updateAudioStatus('Audio ready — interact again if muted');
        });
    },
    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
        this.startedLoop = false;
    },
    play(name, minGap = 90) {
        if (!this.ready || !this.pools[name]) return;
        const now = performance.now();
        if (this.lastPlayed[name] && now - this.lastPlayed[name] < minGap) return;
        this.lastPlayed[name] = now;

        const audio = this.pools[name].find((clip) => clip.paused || clip.ended) || this.pools[name][0];
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (err) {
            // fail silently
        }
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const inventoryEl = document.getElementById('inventory');
const scoreDisplay = document.getElementById('scoreDisplay');
const notificationEl = document.getElementById('notification');
const successGifEl = document.getElementById('successGif');
const failGifEl = document.getElementById('failGif');
const audioStatusEl = document.getElementById('audioStatus');

let width, height;
let entities = [];
let particles = [];
let discovered = [];
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let lastTime = 0;
let gifTimers = {};

const RADIUS = 35;
const BOUNCE = 0.6;
const FRICTION = 0.92;

function init() {
    resize();
    window.addEventListener('resize', resize);

    const saved = localStorage.getItem('oot_discovered');
    if (saved) {
        discovered = JSON.parse(saved);
    } else {
        discovered = ["Fire", "Water", "Earth", "Air"];
    }

    renderInventory();

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    canvas.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => onPointerDown(e.touches[0]), { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchend', (e) => onPointerUp(e.changedTouches[0]));

    document.getElementById('clearBtn').addEventListener('click', () => {
        armAudio();
        AudioSys.play('click', 50);
        clearBoard();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
        armAudio();
        AudioSys.play('click', 50);
        resetProgress();
    });

    ['click', 'touchstart', 'keydown'].forEach((eventName) => {
        document.body.addEventListener(eventName, armAudio, { once: true });
    });

    requestAnimationFrame(loop);
}

function armAudio() {
    AudioSys.init();
}

function updateAudioStatus(text, active = true) {
    audioStatusEl.textContent = text;
    audioStatusEl.classList.toggle('ready', active);
}

function showGif(el, duration = 1500) {
    clearTimeout(gifTimers[el.id]);
    el.classList.add('active');
    gifTimers[el.id] = setTimeout(() => {
        el.classList.remove('active');
    }, duration);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function spawnEntity(type, x, y, vx = 0, vy = 0) {
    if (x == null) x = width / 2 + (Math.random() - 0.5) * 50;
    if (y == null) y = height / 2 + (Math.random() - 0.5) * 50;

    entities.push({
        id: Date.now() + Math.random(),
        type,
        x,
        y,
        vx,
        vy,
        radius: 0,
        targetRadius: RADIUS,
        color: ELEMENTS[type].color,
        icon: ELEMENTS[type].icon
    });

    AudioSys.play('spawn', 70);
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color
        });
    }
}

function checkRecipes(a, b) {
    const ingredients = [a.type, b.type].sort();

    for (const r of RECIPES) {
        const recipeIng = [...r.in].sort();
        if (ingredients[0] === recipeIng[0] && ingredients[1] === recipeIng[1]) {
            return r.out;
        }
    }
    return null;
}

function discover(type) {
    if (!discovered.includes(type)) {
        discovered.push(type);
        renderInventory();
        showNotification(`New clue logged: ${type}!`);
        showGif(successGifEl, 1800);
        AudioSys.play('discover', 140);
        localStorage.setItem('oot_discovered', JSON.stringify(discovered));
    }
}

function clearBoard() {
    entities.forEach((e) => spawnParticles(e.x, e.y, e.color));
    entities = [];
    showNotification('Board cleared. Fresh theory space!');
    showGif(failGifEl, 1200);
    AudioSys.play('clear', 180);
}

function resetProgress() {
    if (confirm("Reset the entire discovery log?")) {
        AudioSys.stopLoop();
        localStorage.removeItem('oot_discovered');
        location.reload();
    }
}

function onPointerDown(e) {
    armAudio();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        const dist = Math.hypot(ent.x - x, ent.y - y);
        if (dist < ent.radius + 10) {
            dragging = ent;
            dragOffset.x = ent.x - x;
            dragOffset.y = ent.y - y;
            ent.vx = 0;
            ent.vy = 0;
            return;
        }
    }
}

function onPointerMove(e) {
    if (!dragging) return;
    const rect = canvas.getBoundingClientRect();
    dragging.x = (e.clientX - rect.left) + dragOffset.x;
    dragging.y = (e.clientY - rect.top) + dragOffset.y;
    dragging.vx = 0;
    dragging.vy = 0;
}

function onPointerUp() {
    if (!dragging) return;

    for (let i = 0; i < entities.length; i++) {
        const other = entities[i];
        if (other === dragging) continue;

        const dist = Math.hypot(dragging.x - other.x, dragging.y - other.y);
        if (dist < dragging.radius + other.radius) {
            const result = checkRecipes(dragging, other);
            if (result) {
                const midX = (dragging.x + other.x) / 2;
                const midY = (dragging.y + other.y) / 2;

                spawnParticles(midX, midY, "#fff");
                spawnEntity(result, midX, midY);
                discover(result);
                AudioSys.play('merge', 100);

                entities = entities.filter((ent) => ent !== dragging && ent !== other);
                dragging = null;
                return;
            }

            showNotification('No stable theory from that combo.');
            showGif(failGifEl, 1200);
            AudioSys.play('invalid', 120);
            dragging = null;
            return;
        }
    }

    dragging = null;
}

function renderInventory() {
    inventoryEl.innerHTML = '';
    discovered.forEach((type) => {
        const data = ELEMENTS[type];
        if (!data) return;

        const el = document.createElement('div');
        el.className = 'inv-item';
        el.style.borderColor = data.color;
        el.innerHTML = `<div>${data.icon}</div><span class="name">${type}</span>`;

        el.addEventListener('click', () => {
            armAudio();
            AudioSys.play('click', 45);
            spawnEntity(type);
        });

        inventoryEl.appendChild(el);
    });

    scoreDisplay.innerText = `Clues logged: ${discovered.length} / ${Object.keys(ELEMENTS).length}`;
}

function showNotification(text) {
    notificationEl.innerText = text;
    notificationEl.style.opacity = 1;
    clearTimeout(showNotification.hideTimer);
    showNotification.hideTimer = setTimeout(() => {
        notificationEl.style.opacity = 0;
    }, 1800);
}

function update(dt) {
    for (let i = 0; i < entities.length; i++) {
        const e = entities[i];

        if (e.radius < e.targetRadius) {
            e.radius += dt * 200;
            if (e.radius > e.targetRadius) e.radius = e.targetRadius;
        }

        if (e === dragging) continue;

        e.vx *= FRICTION;
        e.vy *= FRICTION;

        e.x += e.vx;
        e.y += e.vy;

        if (e.x < e.radius) { e.x = e.radius; e.vx *= -BOUNCE; }
        if (e.x > width - e.radius) { e.x = width - e.radius; e.vx *= -BOUNCE; }
        if (e.y < e.radius) { e.y = e.radius; e.vy *= -BOUNCE; }
        if (e.y > height - e.radius) { e.y = height - e.radius; e.vy *= -BOUNCE; }

        for (let j = i + 1; j < entities.length; j++) {
            const other = entities[j];
            if (other === dragging) continue;

            const dx = other.x - e.x;
            const dy = other.y - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = e.radius + other.radius;

            if (dist < minDist) {
                const angle = Math.atan2(dy, dx);
                const targetX = e.x + Math.cos(angle) * minDist;
                const targetY = e.y + Math.sin(angle) * minDist;
                const ax = (targetX - other.x) * 0.05;
                const ay = (targetY - other.y) * 0.05;

                e.vx -= ax;
                e.vy -= ay;
                other.vx += ax;
                other.vy += ay;
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    entities.forEach((e) => {
        ctx.save();
        ctx.translate(e.x, e.y);

        ctx.beginPath();
        ctx.arc(4, 4, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.stroke();

        ctx.font = `${e.radius}px 'Rajdhani', system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.fillText(e.icon, 0, 2);

        ctx.restore();
    });

    particles.forEach((p) => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
