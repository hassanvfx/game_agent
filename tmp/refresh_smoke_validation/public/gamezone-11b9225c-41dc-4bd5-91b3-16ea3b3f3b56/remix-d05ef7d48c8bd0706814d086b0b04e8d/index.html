<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hoop Rush: Neon Dunk</title>
    <!-- [agent-note][stage4] remapped-font: body/ui Exo 2 -> Rajdhani from catalogs/fonts.json; preserved Orbitron display + Material Symbols Sharp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Material+Symbols+Sharp&display=swap">
    <style>
        :root {
            --bg: #070b1f;
            --bg-secondary: #11183b;
            --panel: rgba(15, 25, 58, 0.72);
            --panel-border: rgba(96, 220, 255, 0.34);
            --panel-highlight: rgba(255, 255, 255, 0.07);
            --muted: rgba(216, 238, 255, 0.7);
            --muted-strong: rgba(240, 248, 255, 0.9);
            --subtle: rgba(188, 228, 255, 0.45);
            --accent: #68f7ff;
            --accent-strong: #8aff7a;
            --danger: #ff5d87;
            --danger-deep: #ff225b;
            --glow: rgba(104, 247, 255, 0.26);
            --glow-strong: rgba(138, 255, 122, 0.28);
            --shadow: rgba(6, 10, 30, 0.48);
            --hero-core: #8aff7a;
            --hero-rim: #68f7ff;
            --ball-main: #ffd56a;
            --ball-deep: #ff8f38;
            --ball-stripe: #7b2c12;
            --text: #f7fbff;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(87, 162, 255, 0.18), transparent 34%),
                radial-gradient(circle at bottom, rgba(104, 247, 255, 0.12), transparent 28%),
                linear-gradient(180deg, var(--bg) 0%, #080e24 48%, #050814 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        body {
            color: var(--text);
        }

        button {
            font: inherit;
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 40%),
                linear-gradient(180deg, rgba(18, 31, 73, 0.92), rgba(8, 14, 34, 0.82));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 18px 40px var(--shadow),
                0 0 24px var(--glow);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes haloPulse {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.06); }
        }

        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            isolation: isolate;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 20% 18%, rgba(104, 247, 255, 0.14), transparent 18%),
                radial-gradient(circle at 78% 14%, rgba(255, 213, 106, 0.12), transparent 16%),
                linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.12) 100%);
            z-index: 0;
        }

        #game-container::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 42px, 42px 100%;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.88), transparent 80%);
            opacity: 0.22;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        #ui-layer button,
        #ui-layer .interactive {
            pointer-events: auto;
        }

        #hud {
            width: 100%;
            box-sizing: border-box;
            padding: 18px 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-card {
            position: relative;
            min-width: 88px;
            padding: 9px 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .hud-card::before {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .hud-card::after {
            content: "";
            position: absolute;
            width: 48px;
            height: 48px;
            top: -10px;
            right: -6px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(104, 247, 255, 0.32), transparent 70%);
            animation: haloPulse 2.3s ease-in-out infinite;
            pointer-events: none;
        }

        .hud-label,
        .summary-label {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 700;
        }

        .hud-value {
            color: var(--text);
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 400;
            line-height: 1.05;
            text-shadow: 0 0 14px rgba(104, 247, 255, 0.25);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(2, 6, 20, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #game-over-screen.hidden {
            display: none;
        }

        .game-over-card {
            position: relative;
            width: 100%;
            max-width: 360px;
            max-height: min(90vh, 560px);
            padding: 28px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        .game-over-card::before {
            content: "💥";
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 1.2rem;
            opacity: 0.8;
            animation: badgeFloat 1.8s ease-in-out infinite;
        }

        .game-over-title {
            margin: 0 0 8px;
            color: var(--danger);
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2rem, 10vw, 3.25rem);
            line-height: 0.98;
            font-weight: 400;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(255, 93, 135, 0.2);
        }

        .game-over-copy {
            margin: 0 0 22px;
            color: var(--muted-strong);
            font-size: 1rem;
            line-height: 1.3;
            max-width: 24ch;
        }

        .summary-wrap {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .summary-value {
            color: var(--text);
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: clamp(2.7rem, 12vw, 4rem);
            line-height: 1;
            font-weight: 400;
            text-shadow: 0 0 14px rgba(138, 255, 122, 0.22);
        }

        #restart-btn {
            border: 0;
            border-radius: 999px;
            width: 100%;
            max-width: 260px;
            padding: 14px 20px;
            background:
                linear-gradient(180deg, #8aff7a 0%, #52e7ff 100%);
            color: #041020;
            font-family: 'Orbitron', 'Rajdhani', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
            box-shadow:
                0 12px 24px rgba(82, 231, 255, 0.25),
                0 0 18px rgba(138, 255, 122, 0.2);
        }

        #restart-btn:hover {
            filter: brightness(1.05);
        }

        #restart-btn:active {
            transform: scale(0.96);
        }

        #flavor-caption {
            position: absolute;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            transform: translateX(-50%);
            z-index: 20;
            padding: 7px 14px;
            border-radius: 999px;
            color: var(--subtle);
            font-size: 11px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            background: rgba(8, 14, 34, 0.45);
            border: 1px solid rgba(104, 247, 255, 0.14);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
        }

        #gif-layer {
            position: absolute;
            inset: 0;
            z-index: 24;
            pointer-events: none;
            overflow: hidden;
        }

        .reaction-gif {
            position: absolute;
            right: 12px;
            width: min(28vw, 112px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(8, 14, 34, 0.55);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.26);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .reaction-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #collect-gif {
            top: 92px;
        }

        #danger-gif {
            bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
        }

        #audio-pill {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--muted-strong);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: rgba(8, 14, 34, 0.58);
            border: 1px solid rgba(104, 247, 255, 0.22);
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        #audio-pill.ready {
            opacity: 1;
        }

        .material-symbols-sharp {
            font-family: 'Material Symbols Sharp';
            font-weight: normal;
            font-style: normal;
            font-size: 18px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        @media (max-width: 640px) {
            #hud {
                padding: 14px 14px 0;
            }

            .hud-card {
                min-width: 72px;
                padding: 8px 10px 9px;
            }

            .hud-label,
            .summary-label {
                font-size: 10px;
                letter-spacing: 0.22em;
            }

            .game-over-card {
                padding: 24px 18px 20px;
            }

            .game-over-copy {
                font-size: 0.95rem;
                margin-bottom: 18px;
            }

            #flavor-caption {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
                font-size: 10px;
                letter-spacing: 0.18em;
                padding: 6px 10px;
                max-width: calc(100vw - 32px);
                text-align: center;
            }

            .reaction-gif {
                width: 88px;
                right: 10px;
            }

            #collect-gif {
                top: 82px;
            }

            #danger-gif {
                bottom: calc(env(safe-area-inset-bottom, 0px) + 52px);
            }

            #audio-pill {
                top: 76px;
                font-size: 10px;
                letter-spacing: 0.14em;
                padding: 7px 10px;
            }
        }
    </style>
</head>

<script>
/**
 * Hoop Rush: Neon Dunk
 * Core Engine
 */

const CONFIG_DEFS = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = Object.keys(CONFIG_DEFS).reduce((acc, key) => {
    acc[key] = CONFIG_DEFS[key].value;
    return acc;
}, {});

// AudioManager
 class AudioManager {
     constructor() {
         this.ctx = new (window.AudioContext || window.webkitAudioContext)();
         this.bgm = document.getElementById('bgm_main');
         this.sfxCollect = document.getElementById('sfx_collect');
         this.sfxDeath = document.getElementById('sfx_death');
         this.sfxStart = document.getElementById('sfx_start');
         this.sfxButton = document.getElementById('sfx_button');
         this.unlocked = false;
         this.lastPlay = {};
         this.configureLevels();
     }

     configureLevels() {
         this.bgm.volume = 0.2;
         this.sfxCollect.volume = 0.5;
         this.sfxDeath.volume = 0.55;
         this.sfxStart.volume = 0.45;
         this.sfxButton.volume = 0.4;
     }

     async unlock() {
         if (this.unlocked) return;
         try {
             await this.ctx.resume();
         } catch (_) {}
         this.unlocked = true;
         this.startLoop();
     }

     startLoop() {
         if (!this.bgm) return;
         this.bgm.volume = 0.2;
         this.bgm.play().catch(() => {});
     }

     stopLoop() {
         if (!this.bgm) return;
         this.bgm.pause();
         this.bgm.currentTime = 0;
     }

     pauseLoop() {
         if (!this.bgm) return;
         this.bgm.pause();
     }

     resumeLoop() {
         if (!this.unlocked || !this.bgm) return;
         this.bgm.play().catch(() => {});
     }

     trigger(audio, fallback, key, reset = true, debounceMs = 80) {
         if (!audio) {
             if (fallback) this.synth(fallback);
             return;
         }

         const now = performance.now();
         if (this.lastPlay[key] && now - this.lastPlay[key] < debounceMs) return;
         this.lastPlay[key] = now;

         if (audio.readyState >= 2) {
             if (reset) audio.currentTime = 0;
             audio.play().catch(() => {
                 if (fallback) this.synth(fallback);
             });
         } else if (fallback) {
             this.synth(fallback);
         }
     }

     playCollect() {
         this.trigger(this.sfxCollect, 'beep', 'collect');
     }

     playDeath() {
         this.trigger(this.sfxDeath, 'explosion', 'death', true, 180);
     }

     playStart() {
         this.trigger(this.sfxStart, 'rise', 'start', true, 160);
     }

     playButton() {
         this.trigger(this.sfxButton, 'tick', 'button', true, 70);
     }

     synth(type) {
         const osc = this.ctx.createOscillator();
         const gain = this.ctx.createGain();
         osc.connect(gain);
         gain.connect(this.ctx.destination);

         if (type === 'beep') {
             osc.type = 'sine';
             osc.frequency.setValueAtTime(880, this.ctx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.12);
             gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
             gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.12);
             osc.start();
             osc.stop(this.ctx.currentTime + 0.12);
         } else if (type === 'tick') {
             osc.type = 'triangle';
             osc.frequency.setValueAtTime(620, this.ctx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(430, this.ctx.currentTime + 0.06);
             gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
             gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.06);
             osc.start();
             osc.stop(this.ctx.currentTime + 0.06);
         } else if (type === 'rise') {
             osc.type = 'square';
             osc.frequency.setValueAtTime(420, this.ctx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(760, this.ctx.currentTime + 0.14);
             gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
             gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.14);
             osc.start();
             osc.stop(this.ctx.currentTime + 0.14);
         } else {
             osc.type = 'sawtooth';
             osc.frequency.setValueAtTime(110, this.ctx.currentTime);
             osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.28);
             gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
             gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.28);
             osc.start();
             osc.stop(this.ctx.currentTime + 0.28);
         }
     }
 }

// Particle System
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.02;
        this.size = Math.random() * 4 + 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// Global State
let canvas, ctx, audioManager;
let cw, ch, dpr;
let gameState = 'BOOT';
let score = 0;
let bestScore = localStorage.getItem('hoop_rush_best') || 0;
let hero = { x: 0, y: 0, r: 0, targetX: 0 };
let entities = [];
let particles = [];
 let lastSpawn = 0;
 let lastTime = 0;
 let shakeTime = 0;
 let collectGifTimer = 0;
 let dangerGifTimer = 0;

 function setState(next) {
     const prev = gameState;
     gameState = next;
     document.getElementById('game-over-screen').classList.toggle('hidden', next !== 'GAMEOVER');

     if (next === 'PLAYING') {
         audioManager?.resumeLoop();
         if (prev !== 'PLAYING') {
             audioManager?.playStart();
             setAudioPill('crowd loop armed');
         }
     }

     if (next === 'GAMEOVER') {
         document.getElementById('final-score').textContent = score;
         if (score > bestScore) {
             bestScore = score;
             localStorage.setItem('hoop_rush_best', bestScore);
             document.getElementById('best-val').textContent = bestScore;
         }
         audioManager?.playDeath();
         audioManager?.pauseLoop();
         showGif('danger');
         setAudioPill('rim clash detected');
         vibrate('heavy');
         shakeTime = 0.4;
         document.getElementById('game-container').classList.add('shake');
         setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 400);
     }
 }

 function initGame() {
     score = 0;
     collectGifTimer = 0;
     dangerGifTimer = 0;
     document.getElementById('score-val').textContent = score;
     document.getElementById('best-val').textContent = bestScore;
     document.getElementById('collect-gif').classList.remove('visible');
     document.getElementById('danger-gif').classList.remove('visible');
     entities = [];
     particles = [];
     hero.r = window.gameConfig.heroSize;
     hero.x = cw / 2;
     hero.y = ch - 120;
     hero.targetX = cw / 2;
     lastSpawn = performance.now();
     lastTime = performance.now();
 }

function spawnEntity() {
    const isBomb = Math.random() < window.gameConfig.bombChance;
    const r = 25;
    entities.push({
        x: Math.random() * (cw - r * 2) + r,
        y: -r,
        r: r,
        type: isBomb ? 'bomb' : 'ball',
        speed: window.gameConfig.gravity * (1 + score * 0.02),
        rot: 0,
        rotV: (Math.random() - 0.5) * 0.2
    });
}

 function vibrate(style) {
     window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
         action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
         params: { style: style }
     });
 }

 function setAudioPill(message) {
     const pill = document.getElementById('audio-pill');
     const pillText = document.getElementById('audio-pill-text');
     pillText.textContent = message;
     pill.classList.add('ready');
 }

 function showGif(type) {
     if (type === 'collect') {
         collectGifTimer = 0.8;
         document.getElementById('collect-gif').classList.add('visible');
     } else {
         dangerGifTimer = 1.2;
         document.getElementById('danger-gif').classList.add('visible');
     }
 }

 function handleGlobalInput(e) {
     audioManager.unlock();

     if (gameState === 'GAMEOVER') {
         audioManager.playButton();
         initGame();
         setState('PLAYING');
         return;
     }

     const rect = canvas.getBoundingClientRect();
     const clientX = e.touches ? e.touches[0].clientX : e.clientX;
     hero.targetX = clientX - rect.left;
 }

 function update(dt) {
     if (collectGifTimer > 0) {
         collectGifTimer -= dt;
         if (collectGifTimer <= 0) document.getElementById('collect-gif').classList.remove('visible');
     }

     if (dangerGifTimer > 0) {
         dangerGifTimer -= dt;
         if (dangerGifTimer <= 0) document.getElementById('danger-gif').classList.remove('visible');
     }

     if (gameState !== 'PLAYING') return;

     // Hero movement
    hero.x += (hero.targetX - hero.x) * 0.2;
    hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));

    // Spawn
    const now = performance.now();
    if (now - lastSpawn > window.gameConfig.spawnRate) {
        spawnEntity();
        lastSpawn = now;
    }

    // Entities
    for (let i = entities.length - 1; i >= 0; i--) {
        const e = entities[i];
        e.y += e.speed * dt;
        e.rot += e.rotV;

        // Collision
        const dx = e.x - hero.x;
        const dy = e.y - hero.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < e.r + hero.r / 2) {
             if (e.type === 'ball') {
                 score++;
                 document.getElementById('score-val').textContent = score;
                 audioManager.playCollect();
                 showGif('collect');
                 setAudioPill(score > 0 && score % 5 === 0 ? 'combo lane hot' : 'pickup synced');
                 vibrate('light');
                 for (let j = 0; j < 12; j++) particles.push(new Particle(e.x, e.y, '#68F7FF'));
                 entities.splice(i, 1);
             } else {
                 setState('GAMEOVER');
             }
            continue;
        }

        if (e.y > ch + 50) entities.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function drawBackground(time) {
    const topGlow = ctx.createLinearGradient(0, 0, 0, ch);
    topGlow.addColorStop(0, '#0f1f52');
    topGlow.addColorStop(0.5, '#09132f');
    topGlow.addColorStop(1, '#050914');
    ctx.fillStyle = topGlow;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.globalAlpha = 0.22;
    for (let i = 0; i < 6; i++) {
        const x = (cw * 0.18 * i + time * 26) % (cw + 160) - 80;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(104, 247, 255, 0.16)' : 'rgba(138, 255, 122, 0.12)';
        ctx.beginPath();
        ctx.moveTo(x, ch);
        ctx.lineTo(x + 54, ch * 0.32);
        ctx.lineTo(x + 86, ch * 0.32);
        ctx.lineTo(x + 28, ch);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let y = ch * 0.52; y < ch; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(time * 0.8 + y * 0.02) * 4);
        ctx.lineTo(cw, y + Math.sin(time * 0.8 + y * 0.02) * 4);
        ctx.stroke();
    }
    for (let x = 0; x <= cw; x += 36) {
        ctx.beginPath();
        ctx.moveTo(x, ch * 0.52);
        ctx.lineTo(cw / 2 + (x - cw / 2) * 1.55, ch);
        ctx.stroke();
    }
    ctx.restore();

    for (let i = 0; i < 14; i++) {
        const starX = (i * 97 + time * (12 + i)) % cw;
        const starY = 32 + (i * 53) % Math.max(100, ch * 0.45);
        const radius = i % 3 === 0 ? 2.1 : 1.2;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(104, 247, 255, 0.75)' : 'rgba(255, 213, 106, 0.65)';
        ctx.beginPath();
        ctx.arc(starX, starY, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawHero() {
    ctx.save();
    ctx.translate(hero.x, hero.y);

    const aura = ctx.createRadialGradient(0, -4, 8, 0, 0, hero.r * 0.95);
    aura.addColorStop(0, 'rgba(138, 255, 122, 0.34)');
    aura.addColorStop(0.55, 'rgba(104, 247, 255, 0.22)');
    aura.addColorStop(1, 'rgba(104, 247, 255, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 8, hero.r * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 24;
    ctx.shadowColor = 'rgba(104, 247, 255, 0.45)';
    ctx.lineCap = 'round';
    ctx.lineWidth = 10;
    const rimGradient = ctx.createLinearGradient(-hero.r / 2, 0, hero.r / 2, 12);
    rimGradient.addColorStop(0, '#8aff7a');
    rimGradient.addColorStop(0.5, window.gameConfig.themeColor);
    rimGradient.addColorStop(1, '#c6fdff');
    ctx.strokeStyle = rimGradient;
    ctx.beginPath();
    ctx.arc(0, 0, hero.r / 2, 0.06, Math.PI - 0.06, false);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(210, 248, 255, 0.6)';
    ctx.lineWidth = 2.5;
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 9, 2);
        ctx.lineTo(i * 5.2, 39);
        ctx.stroke();
    }

    ctx.fillStyle = 'rgba(138, 255, 122, 0.9)';
    ctx.beginPath();
    ctx.arc(0, -4, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#05101f';
    ctx.beginPath();
    ctx.arc(-7, -2, 1.8, 0, Math.PI * 2);
    ctx.arc(7, -2, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(5, 16, 31, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 4, 8, 0.12, Math.PI - 0.12);
    ctx.stroke();

    ctx.restore();
}

function drawBall(entity) {
    const grad = ctx.createRadialGradient(-7, -8, 2, 0, 0, entity.r);
    grad.addColorStop(0, '#fff0a6');
    grad.addColorStop(0.5, getComputedStyle(document.documentElement).getPropertyValue('--ball-main').trim());
    grad.addColorStop(1, getComputedStyle(document.documentElement).getPropertyValue('--ball-deep').trim());
    ctx.fillStyle = grad;
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(255, 162, 56, 0.45)';
    ctx.beginPath();
    ctx.arc(0, 0, entity.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ball-stripe').trim();
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-entity.r, 0);
    ctx.lineTo(entity.r, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, entity.r * 0.98, -0.8, 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, entity.r * 0.98, Math.PI - 0.8, Math.PI + 0.8);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-7, -9, 6, 0, Math.PI * 1.15);
    ctx.stroke();
}

function drawBomb(entity, time) {
    const grad = ctx.createRadialGradient(-6, -8, 3, 0, 0, entity.r);
    grad.addColorStop(0, '#9ea6bf');
    grad.addColorStop(0.45, '#2a355d');
    grad.addColorStop(1, '#0a1022');
    ctx.fillStyle = grad;
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(255, 34, 91, 0.28)';
    ctx.beginPath();
    ctx.arc(0, 0, entity.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, entity.r * 0.92, 0, Math.PI * 2);
    ctx.stroke();

    const pulse = Math.sin(time * 4 + entity.x * 0.01) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 93, 135, ${0.45 + pulse * 0.55})`;
    ctx.beginPath();
    ctx.arc(0, -entity.r + 6, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffbfd0';
    ctx.beginPath();
    ctx.arc(0, -entity.r + 6, 2.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 186, 208, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -entity.r + 1);
    ctx.quadraticCurveTo(6, -entity.r - 9, 12, -entity.r - 12);
    ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, cw, ch);
    const time = performance.now() * 0.001;

    drawBackground(time);
    drawHero();

    entities.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);

        if (e.type === 'ball') {
            drawBall(e);
        } else {
            drawBomb(e, time);
        }
        ctx.restore();
    });

    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => p.draw(ctx));
    ctx.globalCompositeOperation = 'source-over';
}

function loop(now) {
    try {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
    } catch (e) {
        console.error('Loop Error:', e);
        requestAnimationFrame(loop);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (gameState === 'BOOT') {
        initGame();
        setState('PLAYING');
    }
}

// Lifecycle
window.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    audioManager = new AudioManager();

    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGlobalInput, { passive: false });
     document.getElementById('restart-btn').addEventListener('click', (e) => {
         e.stopPropagation();
         audioManager.playButton();
         handleGlobalInput(e);
     });

     document.addEventListener('visibilitychange', () => {
         if (document.hidden) {
             audioManager.pauseLoop();
         } else if (gameState === 'PLAYING') {
             audioManager.resumeLoop();
         }
     });

     resize();
     requestAnimationFrame(loop);
     setAudioPill('tap to drop the beat');
 });

// Hot Update Config
window.updateGameConfig = (key, val) => {
    window.gameConfig[key] = val;
    if (key === 'heroSize') hero.r = val;
};

</script>
