<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Captain Liora: Tear-Tide Companions</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top:#071a3a; --storm:#173e63; --sea:#061826; --moon:#ffd36e;
      --foam:#e8fbff; --heart:#ff6f9d; --curse:#201227; --panel:rgba(5,22,44,.78);
      --panel-border:rgba(255,211,110,.76); --ink:#081121; --gold:#ffd36e;
    }
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061826;color:var(--foam);font-family:'Rajdhani',system-ui,sans-serif;touch-action:none;}
    body{position:fixed;inset:0;}
    body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;}
    body::before{background:radial-gradient(circle at 50% 9%,rgba(255,211,110,.24),transparent 18%),radial-gradient(circle at 12% 70%,rgba(116,232,255,.10),transparent 22%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.16));}
    body::after{opacity:.42;background:repeating-linear-gradient(105deg,transparent 0 18px,rgba(232,251,255,.055) 19px 21px,transparent 22px 42px);animation:rainDrift 8s linear infinite;}
    @keyframes rainDrift{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
    canvas{display:block;width:100%;height:100%;touch-action:none;}
    #game-container{position:relative;width:100%;height:100%;user-select:none;isolation:isolate;}
    #ui-layer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));pointer-events:none;box-sizing:border-box;}
    #hud{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:.7rem;transition:opacity .25s ease;}
    .hidden{display:none!important}.interactive{pointer-events:auto}.opacity-0{opacity:0;}
    .glass{background:linear-gradient(180deg,rgba(9,35,68,.88),rgba(5,16,35,.84));border:2px solid var(--panel-border);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15),0 0 22px rgba(116,232,255,.12);backdrop-filter:blur(9px);}
    .hud-chip{min-width:7.4rem;border-radius:999px;padding:.72rem .95rem;color:var(--foam);text-shadow:0 2px 0 rgba(0,0,0,.26);}
    .hud-chip:last-child{text-align:right}.hud-label{display:block;font-family:'Bangers',Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#ffe49b;font-size:.77rem;line-height:1}.hud-value{display:block;margin-top:.14rem;font-size:1.45rem;line-height:1;font-weight:600}.heart-value{color:#ff93b7}
    .captain-ribbon{align-self:center;margin-top:.4rem;padding:.42rem .8rem;border-radius:999px;background:rgba(255,211,110,.13);border:1px solid rgba(255,211,110,.42);font-size:.82rem;letter-spacing:.05em;color:#fff3c7;box-shadow:0 8px 22px rgba(0,0,0,.18);}
    #feedback-banner{align-self:center;margin-bottom:5.2rem;width:min(78vw,21rem);padding:.62rem .9rem;border-radius:999px;text-align:center;font-family:'Bangers',Impact,sans-serif;letter-spacing:.075em;text-transform:uppercase;font-size:.82rem;color:#fff8d5;background:rgba(7,24,49,.84);border:2px solid rgba(255,211,110,.62);box-shadow:0 14px 28px rgba(0,0,0,.34);opacity:0;transform:translateY(1rem);transition:opacity .18s,transform .18s;}
    #feedback-banner.show{opacity:1;transform:translateY(0)}
    #game-over-screen{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(0,8,18,.48);padding:1rem;box-sizing:border-box;}
    .modal{width:min(92vw,24rem);padding:1.35rem;border-radius:1.5rem;text-align:center;}
    .badge{display:inline-flex;gap:.5rem;align-items:center;margin-bottom:.75rem;padding:.38rem .75rem;border-radius:999px;background:rgba(255,111,157,.12);border:1px solid rgba(255,211,110,.34);color:#ffe7a4;font-size:.92rem}.badge-emoji{font-size:1.2rem;filter:drop-shadow(0 0 8px rgba(255,211,110,.45))}
    h1{font-family:'Bangers',Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;line-height:.92;margin:.1rem 0 .45rem;color:#fff5c9;font-size:clamp(2.1rem,10vw,3.2rem);text-shadow:0 4px 0 rgba(27,12,47,.72),0 0 20px rgba(116,232,255,.25)}
    .copy{margin:.45rem auto 1rem;color:rgba(232,251,255,.88);font-size:1rem;max-width:19rem}.final-score{color:#ffd36e;font-weight:600}
    button{border:0;font-family:'Bangers',Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.restart-btn{width:100%;padding:1rem;border-radius:1rem;background:linear-gradient(180deg,#ffd36e,#ff6f9d);color:#171025;font-size:1.45rem;box-shadow:0 14px 25px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.38)}.restart-btn:active{transform:scale(.97)}
    .shake-screen{animation:shake .42s}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
    @media (min-width:700px){.hud-chip{min-width:9rem}.hud-label{font-size:.9rem}.hud-value{font-size:1.85rem}.captain-ribbon{font-size:.95rem}#feedback-banner{font-size:.95rem;margin-bottom:5.9rem}.modal{padding:2rem}}
  </style>
</head>
<body>
  <div id="assets" style="display:none">
    <audio id="bgm_main" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/bgm/ocean_bgm_01.mp3" preload="none" loop></audio>
    <audio id="sfx_rescue" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/sfx/ocean_item_01.mp3" preload="none"></audio>
    <audio id="sfx_curse" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/sfx/ocean_enemy_01.mp3" preload="none"></audio>
    <audio id="sfx_warning" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/sfx/ocean_wind_01.mp3" preload="none"></audio>
    <audio id="sfx_fail" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/sfx/melancholic_defeat_01.mp3" preload="none"></audio>
    <audio id="sfx_ui" data-approved-catalog-url="https://gamezone-virid.vercel.app/assets/audios/sfx/ocean_npc_01.mp3" preload="none"></audio>
  </div>
  <script id="game-config" type="application/x-game-config">{"baseSpeed":{"value":4},"spawnRate":{"value":800}}</script>
  <div id="game-container">
    <canvas id="gameCanvas" aria-label="Tap bright falling sea companions before they sink; avoid black tide curses."></canvas>
    <div id="ui-layer">
      <div>
        <div id="hud">
          <div class="glass hud-chip"><span class="hud-label">Bonds Saved</span><span id="score-val" class="hud-value">0</span></div>
          <div class="glass hud-chip"><span class="hud-label">Heart Anchors</span><span id="lives-val" class="hud-value heart-value">3</span></div>
        </div>
        <div class="captain-ribbon">☾ Captain Liora is calling the crew home</div>
      </div>
      <div id="feedback-banner">Tap bright companions, spare the cursed tide.</div>
      <div id="game-over-screen" class="hidden interactive" style="display:none">
        <div class="glass modal">
          <div class="badge"><span class="badge-emoji">☠︎💧</span><span>The Compass Still Remembers</span></div>
          <h1>Crew Signal Faded</h1>
          <p class="copy">Bonds Saved: <span id="final-score" class="final-score">0</span><br>Captain Liora wipes the rain from her eyes and vows to call again.</p>
          <button id="restart-btn" class="restart-btn">Raise the Vow Again</button>
        </div>
      </div>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  let cw = 0, ch = 0, initialized = false, lastTime = 0;
  let gameState = 'INIT', score = 0, lives = 3, entities = [], particles = [], spawnTimer = 0, difficultyMultiplier = 1, comboStreak = 0, feedbackTimer = null, userInteracted = false;
  let seed = 0x71a5c0de;
  const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
  const gameConfig = { baseSpeed: rawConfig.baseSpeed.value, spawnRate: rawConfig.spawnRate.value };
  const companionStyles = [
    {shell:'#74e8ff', fill:'#d8fbff', accent:'#12677b', glow:'rgba(116,232,255,.55)', motif:'fin'},
    {shell:'#ff8fc7', fill:'#ffe0ef', accent:'#8d245b', glow:'rgba(255,143,199,.50)', motif:'ear'},
    {shell:'#83f0a4', fill:'#e2ffe8', accent:'#146b38', glow:'rgba(131,240,164,.48)', motif:'leaf'},
    {shell:'#ffd36e', fill:'#fff2bd', accent:'#80500c', glow:'rgba(255,211,110,.48)', motif:'star'}
  ];
  const curseStyle = {shell:'#201227', fill:'#493052', accent:'#b8ff5f', glow:'rgba(32,18,39,.62)', motif:'curse'};
  const audioCtxCtor = window.AudioContext || window.webkitAudioContext;
  const audioCtx = audioCtxCtor ? new audioCtxCtor() : null;
  const bgmEl = document.getElementById('bgm_main');
  const sfxMap = {rescue:'sfx_rescue', curse:'sfx_curse', warning:'sfx_warning', fail:'sfx_fail', ui:'sfx_ui'};
  const cooldowns = {};
  function rand(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function resetSeed(){ seed = 0x71a5c0de; }
  function unlockAudio(){ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); }
  function setBgmForState(state){ void state; }
  function synth(kind){ if(!audioCtx || audioCtx.state === 'suspended') return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); const t=audioCtx.currentTime; if(kind==='rescue'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(900,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.01,t+.18);} else if(kind==='curse'||kind==='fail'){o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(70,t+.2);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.01,t+.22);} else {o.type='sine';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(180,t+.14);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.01,t+.16);} o.start(); o.stop(t+.24); }
  function playSfx(kind){ const now=performance.now(); if(cooldowns[kind] && now-cooldowns[kind]<120) return; cooldowns[kind]=now; synth(kind); }
  function vibrate(type){ if(userInteracted && navigator.vibrate) navigator.vibrate(type === 'heavy' ? 160 : 40); }
  function showFeedback(message, tone='neutral'){ const b=document.getElementById('feedback-banner'); b.textContent=message; b.style.borderColor = tone==='danger' ? 'rgba(255,111,157,.8)' : tone==='success' ? 'rgba(116,232,255,.78)' : 'rgba(255,211,110,.62)'; b.style.background = tone==='danger' ? 'rgba(42,16,48,.88)' : tone==='success' ? 'rgba(5,47,69,.86)' : 'rgba(7,24,49,.84)'; b.classList.add('show'); clearTimeout(feedbackTimer); feedbackTimer=setTimeout(()=>b.classList.remove('show'), 980); }
  class Particle{
    constructor(x,y,color){ this.x=x; this.y=y; this.color=color; const a=rand()*Math.PI*2, s=rand()*4+2; this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s; this.life=1; this.decay=rand()*.025+.018; this.size=rand()*5+3; }
    update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=.18; this.life-=this.decay; }
    draw(){ ctx.save(); ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  }
  class Companion{
    constructor(forcedType){ this.r=35; this.x=rand()*Math.max(1,(cw-this.r*2))+this.r; this.y=-this.r*2; this.type=forcedType || (rand()>.15?'companion':'curse'); this.style=this.type==='companion'? companionStyles[Math.floor(rand()*companionStyles.length)] : curseStyle; this.vy=gameConfig.baseSpeed*(1+rand()*.5)*difficultyMultiplier; this.rotation=rand()*Math.PI*2; this.rotSpeed=(rand()-.5)*.1; this.markedForDeletion=false; this.saved=false; }
    update(dt){ this.y += this.vy*(dt*60); this.rotation += this.rotSpeed; if(this.y > ch + this.r){ this.markedForDeletion=true; if(this.type==='companion' && !this.saved) loseLife('A companion sank beyond the deck!', true); } }
    checkTap(tx,ty){ const dx=tx-this.x, dy=ty-this.y; return (dx*dx+dy*dy) < (this.r*1.5)**2; }
    draw(){ const s=this.style; ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation); const halo=ctx.createRadialGradient(0,0,4,0,0,this.r*1.55); halo.addColorStop(0,s.glow); halo.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,this.r*1.55,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(0,5,15,.28)'; ctx.beginPath(); ctx.ellipse(7,10,this.r*.95,this.r*.72,0,0,Math.PI*2); ctx.fill(); if(this.type==='companion') this.drawCompanion(s); else this.drawCurse(s); ctx.restore(); }
    drawCompanion(s){ ctx.fillStyle=s.shell; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle=s.fill; ctx.beginPath(); ctx.ellipse(0,4,this.r*.72,this.r*.62,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-10,-13,this.r*.28,this.r*.17,-.55,0,Math.PI*2); ctx.fill(); ctx.fillStyle=s.shell; if(s.motif==='fin'){ ctx.beginPath(); ctx.moveTo(-this.r+5,2); ctx.quadraticCurveTo(-this.r-17,-11,-this.r-8,15); ctx.fill(); ctx.beginPath(); ctx.moveTo(this.r-5,2); ctx.quadraticCurveTo(this.r+17,-11,this.r+8,15); ctx.fill(); } else if(s.motif==='ear'){ ctx.beginPath(); ctx.moveTo(-16,-this.r+7); ctx.quadraticCurveTo(-24,-this.r-18,-3,-this.r+4); ctx.fill(); ctx.beginPath(); ctx.moveTo(16,-this.r+7); ctx.quadraticCurveTo(24,-this.r-18,3,-this.r+4); ctx.fill(); } else if(s.motif==='leaf'){ ctx.beginPath(); ctx.moveTo(0,-this.r+4); ctx.quadraticCurveTo(20,-this.r-18,16,-this.r+12); ctx.quadraticCurveTo(5,-this.r+4,0,-this.r+14); ctx.fill(); } else { drawStar(0,-this.r+5,9,5,s.shell); }
      ctx.fillStyle=s.accent; ctx.beginPath(); ctx.arc(-10,-4,3.2,0,Math.PI*2); ctx.arc(10,-4,3.2,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=s.accent; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,6,10,.2,Math.PI-.2); ctx.stroke(); ctx.strokeStyle='rgba(255,111,157,.82)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,18); ctx.bezierCurveTo(-10,10,-15,22,0,29); ctx.bezierCurveTo(15,22,10,10,0,18); ctx.stroke(); }
    drawCurse(s){ ctx.fillStyle=s.shell; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle=s.fill; ctx.beginPath(); ctx.ellipse(0,4,this.r*.70,this.r*.55,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#070511'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-20,-22); ctx.lineTo(-8,-7); ctx.lineTo(-17,-1); ctx.moveTo(18,-21); ctx.lineTo(5,-5); ctx.lineTo(16,1); ctx.stroke(); ctx.fillStyle=s.accent; ctx.beginPath(); ctx.ellipse(-10,-5,5,2.7,.35,0,Math.PI*2); ctx.ellipse(10,-5,5,2.7,-.35,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#c9ff77'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,12,11,Math.PI+.15,-.15); ctx.stroke(); for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+this.rotation; ctx.fillStyle='rgba(8,5,12,.8)'; ctx.beginPath(); ctx.arc(Math.cos(a)*this.r*.9,Math.sin(a)*this.r*.9,4,0,Math.PI*2); ctx.fill(); } }
  }
  function drawStar(x,y,r,points,color){ ctx.save(); ctx.fillStyle=color; ctx.beginPath(); for(let i=0;i<points*2;i++){ const a=-Math.PI/2+i*Math.PI/points, rr=i%2?r:r*.45; ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }
  function initGame(){ resetSeed(); score=0; lives=3; comboStreak=0; entities=[]; particles=[]; spawnTimer=0; difficultyMultiplier=1; lastTime=0; updateHUD(); showFeedback('Tap bright companions, spare the cursed tide.','neutral'); setState('PLAYING'); }
  function loseLife(message='A heart anchor cracked!', fromMissedTarget=false){ lives--; comboStreak=0; updateHUD(); playSfx(lives<=1 || fromMissedTarget ? 'warning' : 'curse'); showFeedback(lives<=1 ? 'Last heart anchor, Captain!' : message, 'danger'); vibrate('heavy'); document.body.classList.add('shake-screen'); setTimeout(()=>document.body.classList.remove('shake-screen'),430); if(lives<=0) setState('GAMEOVER'); }
  function addScore(val){ score+=val; comboStreak++; difficultyMultiplier=1+(score/500); showFeedback(comboStreak>=3 ? `Crew vow x${comboStreak}!` : 'A companion heard your heart!', 'success'); updateHUD(); }
  function updateHUD(){ document.getElementById('score-val').textContent=score; document.getElementById('lives-val').textContent=lives; document.getElementById('final-score').textContent=score; }
  function setState(newState){ gameState=newState; const hud=document.getElementById('hud'), over=document.getElementById('game-over-screen'); if(newState==='PLAYING'){ hud.classList.remove('opacity-0'); over.classList.add('hidden'); over.style.display='none'; setBgmForState('PLAYING'); } else if(newState==='GAMEOVER'){ hud.classList.add('opacity-0'); over.classList.remove('hidden'); over.style.display='flex'; showFeedback('The storm quiets around an unfinished promise.','danger'); playSfx('fail'); setBgmForState('GAMEOVER'); } }
  function spawnParticles(x,y,color,count=12){ for(let i=0;i<count;i++) particles.push(new Particle(x,y,color)); }
  function resize(){ const rect=canvas.getBoundingClientRect(); cw=Math.max(1,rect.width||window.innerWidth); ch=Math.max(1,rect.height||window.innerHeight); canvas.width=Math.floor(cw*dpr); canvas.height=Math.floor(ch*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); if(!initialized){ initialized=true; initGame(); requestAnimationFrame(loop); } }
  function update(dt){ spawnTimer += dt*1000; const currentSpawnRate=Math.max(300, gameConfig.spawnRate/difficultyMultiplier); if(spawnTimer>currentSpawnRate){ entities.push(new Companion()); spawnTimer=0; } entities.forEach(e=>e.update(dt)); entities=entities.filter(e=>!e.markedForDeletion); particles.forEach(p=>p.update()); particles=particles.filter(p=>p.life>0); }
  function drawBackground(){ const time=performance.now()/1000, storm=Math.min(1,score/160); const grad=ctx.createLinearGradient(0,0,0,ch); grad.addColorStop(0,'#071a3a'); grad.addColorStop(.46, storm>.55?'#1f3b68':'#173e63'); grad.addColorStop(1,'#061826'); ctx.fillStyle=grad; ctx.fillRect(0,0,cw,ch); const moonX=cw*.5+Math.sin(time*.17)*18, moonY=ch*.12; const moon=ctx.createRadialGradient(moonX,moonY,6,moonX,moonY,Math.min(cw,ch)*.28); moon.addColorStop(0,'rgba(255,239,174,.72)'); moon.addColorStop(.18,'rgba(255,211,110,.30)'); moon.addColorStop(1,'rgba(255,211,110,0)'); ctx.fillStyle=moon; ctx.fillRect(0,0,cw,ch*.5); ctx.fillStyle='rgba(255,237,177,.88)'; ctx.beginPath(); ctx.arc(moonX,moonY,22,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(7,26,58,.34)'; ctx.beginPath(); ctx.arc(moonX+9,moonY-4,22,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,211,110,.82)'; ctx.fillRect(cw*.78, ch*.22, 8, 60); ctx.fillStyle='rgba(255,211,110,.28)'; ctx.beginPath(); ctx.moveTo(cw*.78+4,ch*.22); ctx.lineTo(cw*.98,ch*.18); ctx.lineTo(cw*.78+4,ch*.30); ctx.fill(); drawRigging(time); drawWaves(time, storm); drawDeck(time); drawCaptainEmblem(time); }
  function drawRigging(time){ ctx.save(); ctx.strokeStyle='rgba(255,211,110,.18)'; ctx.lineWidth=2; for(let i=0;i<4;i++){ const x=(i+.5)*cw/4 + Math.sin(time+i)*4; ctx.beginPath(); ctx.moveTo(x,-10); ctx.lineTo(x-40,ch*.42); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+18,-10); ctx.lineTo(x+48,ch*.38); ctx.stroke(); } ctx.restore(); }
  function drawWaves(time, storm){ ctx.save(); for(let row=0;row<6;row++){ const y=ch*.43+row*34; ctx.strokeStyle=`rgba(232,251,255,${.10+row*.015+storm*.05})`; ctx.lineWidth=2; ctx.beginPath(); for(let x=-40;x<cw+50;x+=16){ const yy=y+Math.sin((x*.025)+time*(1.4+storm)+row)*7; if(x===-40) ctx.moveTo(x,yy); else ctx.lineTo(x,yy); } ctx.stroke(); } ctx.restore(); }
  function drawDeck(time){ const deckY=ch-76; const g=ctx.createLinearGradient(0,deckY,0,ch); g.addColorStop(0,'#6b3a28'); g.addColorStop(1,'#24131c'); ctx.fillStyle=g; ctx.fillRect(0,deckY,cw,ch-deckY); ctx.fillStyle='#ffd36e'; ctx.fillRect(0,deckY,cw,7); ctx.strokeStyle='rgba(255,226,166,.18)'; ctx.lineWidth=2; for(let x=-40+(time*18%88);x<cw+90;x+=88){ ctx.beginPath(); ctx.moveTo(x,deckY+10); ctx.lineTo(x+42,ch); ctx.stroke(); } ctx.fillStyle='rgba(255,255,255,.10)'; for(let x=28;x<cw;x+=84) ctx.fillRect(x,deckY+25,38,7); }
  function drawCaptainEmblem(time){ const x=cw*.5, y=ch-42; ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,12,75,15,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#271c36'; ctx.beginPath(); ctx.moveTo(-52,6); ctx.quadraticCurveTo(0,34,52,6); ctx.lineTo(38,24); ctx.quadraticCurveTo(0,45,-38,24); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#ffd36e'; ctx.lineWidth=3; ctx.stroke(); ctx.fillStyle='#ff6f9d'; ctx.beginPath(); ctx.moveTo(0,-6+Math.sin(time*2)*2); ctx.bezierCurveTo(-13,-18,-22,0,0,13); ctx.bezierCurveTo(22,0,13,-18,0,-6+Math.sin(time*2)*2); ctx.fill(); ctx.strokeStyle='rgba(232,251,255,.72)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,25,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#ffd36e'; ctx.beginPath(); ctx.moveTo(-35,-12); ctx.lineTo(0,-36); ctx.lineTo(35,-12); ctx.lineTo(19,-16); ctx.lineTo(12,-30); ctx.lineTo(0,-20); ctx.lineTo(-12,-30); ctx.lineTo(-19,-16); ctx.closePath(); ctx.fill(); ctx.restore(); }
  function draw(){ drawBackground(); entities.forEach(e=>e.draw()); particles.forEach(p=>p.draw()); }
  function loop(timestamp){ try{ if(!lastTime) lastTime=timestamp; const dt=Math.min((timestamp-lastTime)/1000,.05); lastTime=timestamp; if(gameState==='PLAYING') update(dt); draw(); requestAnimationFrame(loop); } catch(err){ console.error('Loop Error:',err); lastTime=timestamp; requestAnimationFrame(loop); } }
  function handleCanvasInput(e){ unlockAudio(); if(gameState!=='PLAYING') return; const rect=canvas.getBoundingClientRect(); const tx=e.clientX-rect.left, ty=e.clientY-rect.top; let hit=false; for(let i=entities.length-1;i>=0;i--){ const ent=entities[i]; if(ent.checkTap(tx,ty)){ hit=true; if(ent.type==='companion'){ ent.saved=true; playSfx('rescue'); vibrate('light'); spawnParticles(ent.x,ent.y,ent.style.shell,14); addScore(10); ent.markedForDeletion=true; } else { playSfx('curse'); loseLife('Black tide bit the compass!'); spawnParticles(ent.x,ent.y,'#201227',22); ent.markedForDeletion=true; } break; } } if(!hit){ playSfx('warning'); comboStreak=0; showFeedback('Only rain answered that call.','danger'); spawnParticles(tx,ty,'rgba(232,251,255,.25)',4); } }
  window.addEventListener('DOMContentLoaded', () => { const ro = new ResizeObserver(resize); ro.observe(canvas); resize(); canvas.addEventListener('pointerdown', e => { userInteracted = true; e.preventDefault(); handleCanvasInput(e); }, {passive:false}); document.getElementById('restart-btn').addEventListener('click', e => { userInteracted = true; e.stopPropagation(); unlockAudio(); playSfx('ui'); initGame(); }); });
  window.addEventListener('resize', resize);
  window.__gameDebug = { getState:()=>({gameState,score,lives,entities:entities.map(e=>({x:e.x,y:e.y,type:e.type,r:e.r})),difficultyMultiplier}), spawnCompanion:()=>{entities.push(new Companion('companion')); return entities[entities.length-1];}, spawnCurse:()=>{entities.push(new Companion('curse')); return entities[entities.length-1];}, forceGameOver:()=>{lives=1; loseLife('Debug storm closed in.');}, tapAt:(x,y)=>handleCanvasInput({clientX:x,clientY:y}) };
})();
</script>
