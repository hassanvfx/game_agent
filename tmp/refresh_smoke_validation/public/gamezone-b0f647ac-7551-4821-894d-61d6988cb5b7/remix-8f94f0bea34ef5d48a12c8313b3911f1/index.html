<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Stack Relay</title>
<script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600&family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
<style>
:root {
  --sky-top: #0f1739;
  --sky-mid: #203d7a;
  --sky-bottom: #7fe2ff;
  --panel: rgba(9, 20, 48, 0.8);
  --panel-strong: rgba(11, 27, 65, 0.96);
  --line: #7cf6ff;
  --line-soft: rgba(124, 246, 255, 0.42);
  --signal: #ff5fa3;
  --signal-strong: #ffd36b;
  --text: #ecf8ff;
  --text-dim: rgba(236, 248, 255, 0.75);
  --shadow: rgba(3, 7, 20, 0.4);
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 120%, rgba(255, 240, 187, 0.4), transparent 34%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 46%, var(--sky-bottom) 100%);
  font-family: 'Exo 2', sans-serif;
  color: var(--text);
}

body::before,
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
}

body::before {
  background:
    radial-gradient(circle at 15% 18%, rgba(124, 246, 255, 0.18), transparent 18%),
    radial-gradient(circle at 80% 20%, rgba(255, 95, 163, 0.16), transparent 20%),
    radial-gradient(circle at 50% 68%, rgba(255, 211, 107, 0.18), transparent 22%);
  opacity: 0.9;
}

body::after {
  background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 100% 6px;
  opacity: 0.2;
}

#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#game-container::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.16), transparent 22%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 25%);
  z-index: 0;
}

canvas {
  display: block;
  touch-action: none;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  position: relative;
  z-index: 1;
}

#ui-layer {
  position: relative;
  z-index: 3;
}

.toy-btn {
  font-family: 'Audiowide', sans-serif;
  transition: transform 0.08s ease, box-shadow 0.16s ease, filter 0.16s ease;
  border-radius: 16px;
  pointer-events: auto;
  box-shadow:
    0 8px 18px rgba(0, 0, 0, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.28);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.toy-btn:active {
  transform: translateY(2px) scale(0.98);
  box-shadow:
    0 4px 10px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.18);
  filter: brightness(1.05);
}

.arc-panel {
  background:
    linear-gradient(180deg, rgba(17, 35, 83, 0.97), rgba(7, 16, 42, 0.94));
  border: 2px solid var(--line);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.12),
    0 14px 32px rgba(2, 9, 26, 0.35),
    inset 0 0 0 1px rgba(124, 246, 255, 0.16);
  backdrop-filter: blur(8px);
}

.hud-chip {
  background:
    linear-gradient(180deg, rgba(11, 26, 62, 0.96), rgba(8, 18, 46, 0.96));
  color: var(--text);
  border: 2px solid rgba(124, 246, 255, 0.72);
  box-shadow:
    0 10px 22px rgba(4, 10, 30, 0.28),
    inset 0 0 0 1px rgba(255, 255, 255, 0.09);
}

.status-callout {
  font-family: 'Exo 2', sans-serif;
  font-weight: 600;
  color: var(--text);
  background: linear-gradient(180deg, rgba(255, 95, 163, 0.16), rgba(124, 246, 255, 0.16));
  border: 2px solid rgba(255, 95, 163, 0.62);
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
}

.panel-title,
.canvas-label,
.metric-title {
  font-family: 'Audiowide', sans-serif;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.panel-copy,
.metric-copy,
button,
label,
input {
  font-family: 'Exo 2', sans-serif;
}

.gif-overlay {
  position: absolute;
  width: clamp(84px, 22vw, 132px);
  height: clamp(84px, 22vw, 132px);
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid rgba(124, 246, 255, 0.68);
  box-shadow: 0 10px 26px rgba(2, 9, 26, 0.36);
  background: rgba(8, 18, 46, 0.78);
  opacity: 0;
  transform: scale(0.82);
  transition: opacity 0.22s ease, transform 0.22s ease;
  pointer-events: none;
  z-index: 4;
}

.gif-overlay.active {
  opacity: 0.96;
  transform: scale(1);
}

#merge-gif {
  left: 14px;
  bottom: 18px;
}

#danger-gif {
  right: 14px;
  top: 92px;
}

.material-symbols-rounded {
  font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
  font-size: 22px;
  line-height: 1;
  pointer-events: none;
}

.float-ui { animation: float 2.2s infinite ease-in-out; }
.bounce-ui { animation: bounce 0.32s ease-out; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes bounce {
  from { transform: scale(0.88); opacity: 0.6; }
  to { transform: scale(1); opacity: 1; }
}

#btn-settings {
  background: linear-gradient(180deg, #ff6bb0, #ff4f83);
  border-color: rgba(255,255,255,0.88);
  color: white;
}

#settings-panel {
  border-radius: 18px;
}

#settings-panel input[type="range"] {
  accent-color: #7cf6ff;
}

#hud .toy-btn,
#hud .status-callout {
  max-width: min(72vw, 280px);
}

#game-over-screen {
  padding: 20px;
}

#game-over-card {
  width: min(100%, 320px);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#game-over-content {
  overflow-y: auto;
}

#restart-btn,
#btn-close-settings {
  min-height: 46px;
}

.spark-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.spark {
  position: absolute;
  width: 0.36rem;
  height: 0.36rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 10px rgba(124, 246, 255, 0.75);
  animation: sparkFloat 3.2s ease-in-out infinite;
}

.spark:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
.spark:nth-child(2) { left: 24%; top: 72%; animation-delay: 0.6s; }
.spark:nth-child(3) { left: 52%; top: 12%; animation-delay: 1.1s; }
.spark:nth-child(4) { left: 68%; top: 74%; animation-delay: 1.7s; }
.spark:nth-child(5) { left: 86%; top: 26%; animation-delay: 2.2s; }

@keyframes sparkFloat {
  0%, 100% { transform: translateY(0) scale(0.85); opacity: 0.18; }
  50% { transform: translateY(-12px) scale(1.2); opacity: 0.82; }
}

@media (max-width: 640px) {
  #btn-settings {
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, calc(env(safe-area-inset-right) + 4px));
    width: 46px;
    height: 46px;
  }

  #hud {
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, calc(env(safe-area-inset-left) + 4px));
  }

  #settings-panel {
    top: calc(max(12px, env(safe-area-inset-top)) + 56px);
    right: max(12px, calc(env(safe-area-inset-right) + 4px));
    width: min(72vw, 270px);
    padding: 14px;
  }

  #game-over-screen {
    align-items: flex-end;
    padding: 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }

  .toy-btn {
    letter-spacing: 0.06em;
  }
}
</style>
</head>
<body>

<div id="game-container">
  <div class="spark-layer" aria-hidden="true">
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
  </div>

  <canvas id="gameCanvas"></canvas>
  <!-- [agent-note][stage3] resolved-gif: merge-feedback + danger-warning -> catalogs/gifs.json -->
  <img id="merge-gif" class="gif-overlay" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Merge celebration effect" loading="lazy" decoding="async">
  <img id="danger-gif" class="gif-overlay" src="https://i.giphy.com/MFPZ483I4x41W.webp" alt="Danger alert effect" loading="lazy" decoding="async">
  
  <div id="ui-layer" class="absolute inset-0 pointer-events-none z-50">
    <button id="btn-settings" class="absolute top-4 right-4 toy-btn w-12 h-12 border-2 text-xs flex items-center justify-center float-ui pointer-events-auto" aria-label="Settings"><span class="material-symbols-rounded" aria-hidden="true">settings</span></button>
    
    <div id="settings-panel" class="hidden absolute top-20 right-4 arc-panel p-4 z-50 pointer-events-auto w-64">
      <h3 class="panel-title text-[#7cf6ff] mb-4 text-xs text-center">Deck Setup</h3>
      <div class="space-y-4">
        <div>
          <label class="metric-title block text-[10px] text-[#ecf8ff] mb-1">Drop Speed</label>
          <input type="range" id="setting-speed" min="1" max="12" value="5" class="w-full h-2 bg-[#0d1c45]/80 appearance-none cursor-pointer rounded-full">
        </div>
        <div>
          <label class="metric-title block text-[10px] text-[#ecf8ff] mb-1">Deck Audio</label>
          <input type="range" id="setting-bgm" min="0" max="100" value="20" class="w-full h-2 bg-[#0d1c45]/80 appearance-none cursor-pointer rounded-full">
        </div>
        <button id="btn-close-settings" class="w-full toy-btn bg-[#7cf6ff] text-[#081126] py-3 text-xs border-2 border-white/70">Return</button>
      </div>
    </div>

    <div id="hud" class="absolute top-4 left-4 pointer-events-auto">
      <div class="space-y-2">
        <div class="toy-btn hud-chip px-4 py-3 text-xs">Stacks: <span id="score-display">0</span></div>
        <div class="status-callout px-3 py-2 text-[10px] tracking-[0.16em] rounded-2xl">Guide the mascot convoy. Slide to aim and tap to drop matching flyers.</div>
      </div>
    </div>

    <div id="game-over-screen" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-50 pointer-events-auto">
      <div id="game-over-card" class="arc-panel p-6 text-center mx-4 bounce-ui">
        <div id="game-over-content">
          <h2 class="panel-title text-lg text-[#ff8bc0] mb-4 leading-relaxed">Sky Lane<br>Jammed</h2>
          <p class="panel-copy text-[#ecf8ff] mb-6 text-sm">Relay score: <span id="final-score" class="text-[#ffd36b] text-lg font-bold">0</span></p>
        </div>
        <button id="restart-btn" class="toy-btn bg-[#ffd36b] text-[#081126] px-6 py-3 text-xs border-2 border-white/70 w-full">Relaunch</button>
      </div>
    </div>
  </div>
</div>

<!-- Assets -->
<img id="asset-blob-pink" data-editable="image" data-label="Scout" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_idle.png" class="hidden">
<img id="asset-blob-green" data-editable="image" data-label="Scout Leap" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_jump.png" class="hidden">
<img id="asset-pingu" data-editable="image" data-label="Beacon Slime" src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/slime.png" class="hidden">
<img id="asset-pingu-cool" data-editable="image" data-label="Tower Coin" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png" class="hidden">
<img id="asset-cat" data-editable="image" data-label="Runner" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/player_runner.png" class="hidden">
<img id="asset-dog" data-editable="image" data-label="Magnet Core" src="https://gamezone-virid.vercel.app/assets/images/sprites/runner/magnet.png" class="hidden">

<img id="asset-rooster" data-editable="image" data-label="Sniper Tower" src="https://gamezone-virid.vercel.app/assets/images/sprites/tower/tower_sniper.png" class="hidden">

<!-- [agent-note][stage3] resolved-audio: bgm/drop/merge/collision/warning/gameover/menu -> catalogs/audios.json -->
<audio id="bgm" data-editable="audio" data-label="BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" loop preload="auto"></audio>
<audio id="sfx-drop" src="https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3" preload="auto"></audio>
<audio id="sfx-merge" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>
<audio id="sfx-collision" src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3" preload="auto"></audio>
<audio id="sfx-warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3" preload="auto"></audio>
<audio id="sfx-gameover" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx-menu-open" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3" preload="auto"></audio>
<audio id="sfx-menu-close" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3" preload="auto"></audio>

<script>
window.gameConfigDefs = { heroSpeed: 5, bgmVolume: 20, sfxVolume: 70 };
window.gameConfig = { ...window.gameConfigDefs };

let audioCtx = null;
let sfxBuffers = {};
let audioUnlocked = false;
let lastSfxAt = {};
let dangerGifTimer = 0;
let mergeGifTimer = 0;
let warningPulseCooldown = 0;
let canvas, ctx, cw, ch, dpr = 1;
let initialized = false;
let gameState = 'PLAYING';
let lastTime = 0;
let floatTime = 0;
let particles = [];
let bgClouds = [];
let screenShake = 0;

// Game state
let entities = [];
const ENTITY_SIZES = [28, 38, 50, 65, 85, 105, 130, 160];
const ASSET_IDS = ['asset-blob-pink', 'asset-blob-green', 'asset-pingu', 'asset-pingu-cool', 'asset-cat', 'asset-dog', 'asset-cookie', 'asset-rooster'];
let currentX = 0;
let currentLevel = 0;
let nextLevel = 1;
let dropCooldown = 0;
let score = 0;
const DANGER_Y_PCT = 0.2;

const STYLE = {
  primary: '#7cf6ff',
  secondary: '#ff5fa3',
  accent: '#ffd36b',
  bgTop: '#0f1739',
  bgMid: '#203d7a',
  bgBottom: '#7fe2ff',
  text: '#ecf8ff',
  lineGlow: 'rgba(124, 246, 255, 0.35)',
  dangerGlow: 'rgba(255, 95, 163, 0.55)'
};

document.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  
  const ro = new ResizeObserver(entries => {
    const entry = entries[0];
    if (entry.contentRect.width > 0) {
      resize(entry.contentRect.width, entry.contentRect.height);
      if (!initialized) initGame();
    }
  });
  ro.observe(canvas);

  setupInputs();
});

function setupInputs() {
  const handleStart = (e) => {
    e.preventDefault();
    unlockAudio();
    if (gameState === 'PLAYING') dropEntity();
  };
  const handleMove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    currentX = Math.max(ENTITY_SIZES[currentLevel], Math.min(cw - ENTITY_SIZES[currentLevel], x));
  };

  canvas.addEventListener('pointerdown', handleStart, {passive: false});
  canvas.addEventListener('pointermove', handleMove, {passive: false});
  canvas.addEventListener('pointerup', () => {}, {passive: false});
  canvas.addEventListener('pointercancel', () => {}, {passive: false});
  
  document.getElementById('btn-settings').onclick = () => {
    const panel = document.getElementById('settings-panel');
    const willOpen = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    playSfx(willOpen ? 'menu-open' : 'menu-close', 'light');
  };
  document.getElementById('btn-close-settings').onclick = () => {
    document.getElementById('settings-panel').classList.add('hidden');
    playSfx('menu-close', 'light');
  };
  document.getElementById('restart-btn').onclick = () => restartGame();
  
  document.getElementById('setting-speed').oninput = (e) => window.gameConfig.heroSpeed = parseInt(e.target.value);
  document.getElementById('setting-bgm').oninput = (e) => { 
    window.gameConfig.bgmVolume = parseInt(e.target.value); 
    const bgm = document.getElementById('bgm');
    if(bgm) bgm.volume = window.gameConfig.bgmVolume / 100;
  };
}

function resize(w, h) {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = w; ch = h;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!initialized) currentX = cw / 2;
}

async function unlockAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sfxToLoad = ['drop', 'merge', 'collision', 'warning', 'gameover', 'menu-open', 'menu-close'];
    for (const id of sfxToLoad) {
      try {
        const el = document.getElementById('sfx-' + id);
        const res = await fetch(el.src);
        const buf = await res.arrayBuffer();
        sfxBuffers[id] = await audioCtx.decodeAudioData(buf);
      } catch(e) {}
    }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
  const bgm = document.getElementById('bgm');
  if (bgm && bgm.paused) {
    bgm.volume = window.gameConfig.bgmVolume / 100;
    bgm.play().catch(() => {});
  }
}

function playSfx(id, intensity = 'light') {
  if (!audioCtx || !sfxBuffers[id]) return;
  const now = performance.now();
  const minGap = {
    'collision': 140,
    'warning': 900,
    'drop': 90,
    'merge': 120,
    'gameover': 400,
    'menu-open': 120,
    'menu-close': 120
  }[id] ?? 80;
  if (lastSfxAt[id] && now - lastSfxAt[id] < minGap) return;
  lastSfxAt[id] = now;

  const source = audioCtx.createBufferSource();
  source.buffer = sfxBuffers[id];
  const gain = audioCtx.createGain();
  const volumeScale = {
    'bgm': 0.6,
    'collision': 0.4,
    'warning': 0.45,
    'drop': 0.5,
    'merge': 0.65,
    'gameover': 0.7,
    'menu-open': 0.3,
    'menu-close': 0.28
  }[id] ?? 0.5;
  gain.gain.value = (window.gameConfig.sfxVolume / 100) * volumeScale;
  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);
  
  window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0', params: { style: intensity }
  });
}

function setState(s) {
  gameState = s;
  const bgm = document.getElementById('bgm');
  if (s === 'GAMEOVER') {
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;
    showGif('danger');
    playSfx('gameover', 'heavy');
    if (bgm) bgm.pause();
  } else {
    document.getElementById('game-over-screen').classList.add('hidden');
    hideGif('danger');
    if (bgm && audioUnlocked) bgm.play().catch(() => {});
  }
}

function initGame() {
  initialized = true;
  entities = [];
  score = 0;
  currentLevel = 0;
  nextLevel = Math.floor(Math.random() * 3);
  dropCooldown = 0;
  screenShake = 0;
  document.getElementById('score-display').textContent = '0';
  
  bgClouds = Array.from({length: 8}, () => ({
    x: Math.random() * cw,
    y: Math.random() * ch * 0.62,
    size: 36 + Math.random() * 52,
    speed: 10 + Math.random() * 18,
    alpha: 0.12 + Math.random() * 0.16
  }));
  
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function restartGame() {
  initGame();
  setState('PLAYING');
}
 
function showGif(type) {
  const el = document.getElementById(type + '-gif');
  if (!el) return;
  el.classList.add('active');
  if (type === 'merge') {
    mergeGifTimer = 1.1;
  } else if (type === 'danger') {
    dangerGifTimer = 1.6;
  }
}

function hideGif(type) {
  const el = document.getElementById(type + '-gif');
  if (!el) return;
  el.classList.remove('active');
}

function dropEntity() {
  if (dropCooldown > 0 || gameState !== 'PLAYING') return;
  
  entities.push({
    x: currentX, 
    y: ch * 0.1, 
    vx: 0, 
    vy: 0, 
    level: currentLevel, 
    r: ENTITY_SIZES[currentLevel], 
    merged: false,
    squash: 1,
    settled: false
  });
  
  currentLevel = nextLevel;
  nextLevel = Math.floor(Math.random() * Math.min(4, 1 + Math.floor(score / 500)));
  dropCooldown = 0.5;
  playSfx('drop', 'light');
}

function loop(t) {
  try {
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    floatTime += dt;

    drawBackdrop();
    update(dt);
    draw();
  } catch(e) {}
  requestAnimationFrame(loop);
}

function update(dt) {
  if (mergeGifTimer > 0) {
    mergeGifTimer -= dt;
    if (mergeGifTimer <= 0) hideGif('merge');
  }
  if (dangerGifTimer > 0 && gameState !== 'GAMEOVER') {
    dangerGifTimer -= dt;
    if (dangerGifTimer <= 0) hideGif('danger');
  }

  if (gameState !== 'PLAYING') return;
  if (dropCooldown > 0) dropCooldown -= dt;
  if (screenShake > 0) {
    screenShake -= dt * 20;
    if (screenShake < 0) screenShake = 0;
  }

  const floor = ch * 0.9;
  const gravity = 1200;

  bgClouds.forEach(c => {
    c.x += c.speed * dt;
    if (c.x - c.size > cw) c.x = -c.size;
  });

  entities.forEach(p => {
    if (!isFinite(p.x) || !isFinite(p.y)) return;
    p.vy += gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    
    if (p.x - p.r < 0) { p.x = p.r; p.vx *= -0.4; }
    if (p.x + p.r > cw) { p.x = cw - p.r; p.vx *= -0.4; }
    
    if (p.y + p.r > floor) {
      p.y = floor - p.r;
      p.vy *= -0.3;
      p.vx *= 0.9;
      if (Math.abs(p.vy) < 20) p.settled = true;
    }
    
    if (p.squash < 1) p.squash += dt * 6;
    else p.squash = 1;
  });

  for (let i = 0; i < entities.length; i++) {
    for (let j = i + 1; j < entities.length; j++) {
      let a = entities[i], b = entities[j];
      if (a.merged || b.merged) continue;
      
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let min = a.r + b.r;
      
      if (dist < min) {
        if (a.level === b.level && a.level < ENTITY_SIZES.length - 1) {
          a.merged = b.merged = true;
          const newLevel = a.level + 1;
          entities.push({
            x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
            vx: 0, vy: -80,
            level: newLevel, r: ENTITY_SIZES[newLevel],
            merged: false, squash: 0.8, settled: false
          });
          score += (newLevel + 1) * 10;
          screenShake = 12;
          document.getElementById('score-display').textContent = score;
          playSfx('merge', 'medium');
          showGif('merge');
          spawnParticles((a.x+b.x)/2, (a.y+b.y)/2, STYLE.accent);
        } else {
          let nx = dx / dist, ny = dy / dist;
          let overlap = min - dist;
          a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
          b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
          let relativeVelocity = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (relativeVelocity < 0) {
            let impulse = -1.2 * relativeVelocity;
            a.vx -= impulse * nx * 0.5; a.vy -= impulse * ny * 0.5;
            b.vx += impulse * nx * 0.5; b.vy += impulse * ny * 0.5;
            playSfx('collision', 'light');
          }
        }
      }
    }
  }
  entities = entities.filter(e => !e.merged);

  const dangerY = ch * DANGER_Y_PCT;
  const highestStack = entities.reduce((minY, e) => Math.min(minY, e.y - e.r), ch);
  if (highestStack < dangerY + 80) {
    showGif('danger');
    if (warningPulseCooldown <= 0) {
      playSfx('warning', 'medium');
      warningPulseCooldown = 1.2;
    }
  } else if (dangerGifTimer <= 0) {
    hideGif('danger');
  }
  if (warningPulseCooldown > 0) warningPulseCooldown -= dt;

  const isOver = entities.some(e => e.settled && (e.y - e.r) < dangerY);
  if (isOver) {
    setState('GAMEOVER');
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawBackdrop() {
  const gradient = ctx.createLinearGradient(0, 0, 0, ch);
  gradient.addColorStop(0, STYLE.bgTop);
  gradient.addColorStop(0.5, STYLE.bgMid);
  gradient.addColorStop(1, STYLE.bgBottom);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, cw, ch);

  const sunX = cw * 0.72;
  const sunY = ch * 0.2;
  const sunRadius = Math.min(cw, ch) * 0.12;

  const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 1.9);
  glow.addColorStop(0, 'rgba(255, 211, 107, 0.9)');
  glow.addColorStop(0.45, 'rgba(255, 168, 109, 0.26)');
  glow.addColorStop(1, 'rgba(255, 168, 109, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunRadius * 1.9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 214, 126, 0.92)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 7; i++) {
    const bandY = ch * (0.22 + i * 0.08);
    ctx.fillRect(0, bandY, cw, 2);
  }

  bgClouds.forEach(c => {
    ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
    ctx.beginPath();
    ctx.roundRect(c.x - c.size, c.y - c.size * 0.26, c.size * 1.8, c.size * 0.52, c.size * 0.26);
    ctx.fill();
  });

  const floorY = ch * 0.9;
  const floorGradient = ctx.createLinearGradient(0, floorY - 30, 0, ch);
  floorGradient.addColorStop(0, 'rgba(10, 22, 54, 0.18)');
  floorGradient.addColorStop(1, 'rgba(6, 11, 28, 0.9)');
  ctx.fillStyle = floorGradient;
  ctx.fillRect(0, floorY - 18, cw, ch - floorY + 18);

  ctx.strokeStyle = 'rgba(124, 246, 255, 0.1)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= cw; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x, floorY - 16);
    ctx.lineTo(x, ch);
    ctx.stroke();
  }
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  const floor = ch * 0.9;
  const dangerY = ch * DANGER_Y_PCT;

  ctx.strokeStyle = STYLE.dangerGlow;
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(0, dangerY);
  ctx.lineTo(cw, dangerY);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(255, 95, 163, 0.14)';
  ctx.fillRect(0, 0, cw, dangerY);

  entities.forEach(p => {
    const img = document.getElementById(ASSET_IDS[p.level]);
    if (!img) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.squash, 2 - p.squash);

    const aura = ctx.createRadialGradient(0, 0, p.r * 0.15, 0, 0, p.r * 1.2);
    aura.addColorStop(0, 'rgba(255,255,255,0.32)');
    aura.addColorStop(0.45, 'rgba(124, 246, 255, 0.16)');
    aura.addColorStop(1, 'rgba(124, 246, 255, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 1.18, 0, Math.PI * 2);
    ctx.fill();

    ctx.drawImage(img, -p.r, -p.r, p.r * 2, p.r * 2);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 0.92, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });

  if (gameState === 'PLAYING' && dropCooldown <= 0) {
    const img = document.getElementById(ASSET_IDS[currentLevel]);
    const r = ENTITY_SIZES[currentLevel];
    const hoverY = ch * 0.1 + Math.sin(floatTime * 6) * 4;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(currentX, hoverY);

    const hoverGlow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.25);
    hoverGlow.addColorStop(0, 'rgba(255,255,255,0.3)');
    hoverGlow.addColorStop(0.5, 'rgba(124, 246, 255, 0.18)');
    hoverGlow.addColorStop(1, 'rgba(124, 246, 255, 0)');
    ctx.fillStyle = hoverGlow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.24, 0, Math.PI * 2);
    ctx.fill();

    ctx.drawImage(img, -r, -r, r * 2, r * 2);
    ctx.restore();
    
    ctx.strokeStyle = STYLE.lineGlow;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(currentX, ch * 0.15);
    ctx.lineTo(currentX, floor);
    ctx.stroke();

    ctx.fillStyle = 'rgba(124, 246, 255, 0.26)';
    ctx.beginPath();
    ctx.ellipse(currentX, floor + 4, r * 0.82, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const nextImg = document.getElementById(ASSET_IDS[nextLevel]);
  ctx.save();
  ctx.translate(cw - 58, 106);
  const nextPanel = ctx.createLinearGradient(-40, -46, 40, 44);
  nextPanel.addColorStop(0, 'rgba(11, 27, 65, 0.92)');
  nextPanel.addColorStop(1, 'rgba(8, 18, 46, 0.92)');
  ctx.fillStyle = nextPanel;
  ctx.strokeStyle = 'rgba(124, 246, 255, 0.68)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-40, -42, 80, 88, 18);
  ctx.fill();
  ctx.stroke();
  ctx.drawImage(nextImg, -25, -8, 50, 50);
  ctx.fillStyle = STYLE.text;
  ctx.font = '400 10px "Audiowide"';
  ctx.textAlign = 'center';
  ctx.fillText('ON DECK', 0, -18);
  ctx.restore();

  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    const s = 4 * p.life;
    ctx.fillRect(p.x - s, p.y - s, s * 2, s * 2);
  });
  ctx.globalAlpha = 1;
  
  ctx.restore();
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 80 + Math.random() * 120;
    particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.5, color
    });
  }
}
