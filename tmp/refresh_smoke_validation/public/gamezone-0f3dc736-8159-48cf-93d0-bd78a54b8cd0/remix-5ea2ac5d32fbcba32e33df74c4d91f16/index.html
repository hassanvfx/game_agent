<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Hogwarts Spell-Bubble Relay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][world-design] resolved-fonts: Cinzel for wizard-school identity, Exo 2 for readable HUD/body -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Exo+2:wght@400;600&family=Material+Symbols+Sharp" rel="stylesheet">
    <style>
        :root {
            --bg-top: #100818;
            --bg-bottom: #39220f;
            --panel: rgba(45, 30, 18, 0.84);
            --panel-strong: rgba(62, 40, 20, 0.94);
            --line: rgba(213, 166, 66, 0.45);
            --glow: rgba(255, 216, 121, 0.34);
            --text: #fff3d0;
            --muted: #e8c98b;
            --accent: #ffd879;
            --accent-strong: #d5a642;
            --warning: #c289ff;
            --hud-bg: rgba(43, 27, 18, 0.78);
            --shadow: 0 16px 38px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 216, 121, 0.18), transparent 32%),
                radial-gradient(circle at 12% 18%, rgba(104, 183, 255, 0.08), transparent 28%),
                radial-gradient(circle at 86% 20%, rgba(194, 137, 255, 0.08), transparent 30%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.18) 0 1px, transparent 2px),
                radial-gradient(circle at 72% 24%, rgba(255,255,255,0.14) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 58% 78%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
                radial-gradient(circle at 85% 60%, rgba(124, 233, 255, 0.12) 0 2px, transparent 3px),
                radial-gradient(circle at 10% 70%, rgba(124, 233, 255, 0.1) 0 2px, transparent 3px);
            opacity: 0.9;
            animation: ceilingTwinkle 9s ease-in-out infinite alternate;
        }

        body::after {
            background:
                repeating-linear-gradient(90deg, transparent 0 78px, rgba(213, 166, 66, 0.045) 79px 81px, transparent 82px 156px),
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 14%, transparent 86%, rgba(0,0,0,0.22));
        }

        @keyframes ceilingTwinkle {
            from { opacity: 0.62; transform: translate3d(0, 0, 0) scale(1); }
            to { opacity: 0.96; transform: translate3d(0, -8px, 0) scale(1.015); }
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.28);
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: max(14px, env(safe-area-inset-top)) max(14px, calc(env(safe-area-inset-right) + 14px)) max(14px, calc(env(safe-area-inset-bottom) + 14px)) max(14px, calc(env(safe-area-inset-left) + 14px));
        }

        .screen {
            pointer-events: auto;
            width: min(92vw, 420px);
            max-height: min(86vh, 560px);
            overflow-y: auto;
            background:
                radial-gradient(circle at 50% -12%, rgba(255, 255, 255, 0.7), transparent 28%),
                linear-gradient(180deg, rgba(244, 223, 173, 0.97), rgba(199, 154, 76, 0.95));
            padding: 1.25rem 1.05rem;
            border-radius: 1.1rem;
            text-align: center;
            color: #2b1b12;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(93, 56, 22, 0.55);
            box-shadow: var(--shadow), 0 0 0 2px rgba(213, 166, 66, 0.2) inset, 0 0 34px rgba(255, 216, 121, 0.18);
            position: relative;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 16%, rgba(125, 44, 255, 0.12), transparent 18%),
                radial-gradient(circle at 84% 22%, rgba(104, 183, 255, 0.14), transparent 20%),
                linear-gradient(135deg, rgba(255, 248, 206, 0.44), transparent 30%, transparent 70%, rgba(108, 67, 25, 0.15));
            opacity: 0.9;
        }

        .screen > * {
            position: relative;
            z-index: 1;
        }

        #start-screen { display: block; }

        h1 {
            margin: 0 0 0.9rem 0;
            font-size: clamp(1.8rem, 7vw, 2.35rem);
            line-height: 1.05;
            color: #2b1b12;
            text-shadow: 0 2px 0 rgba(255,255,255,0.28), 0 0 18px rgba(213, 166, 66, 0.28);
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.08em;
        }

        p {
            color: #4b2d19;
            margin: 0 0 1.05rem;
            font-size: clamp(0.92rem, 3.5vw, 1rem);
            line-height: 1.45;
        }

        .screen-copy-strong {
            color: #6c4116;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.78rem;
            margin-bottom: 0.65rem;
            display: block;
        }

        button {
            background:
                radial-gradient(circle at 30% 20%, rgba(255,255,255,0.62), transparent 24%),
                linear-gradient(180deg, #ffe7a0, #d5a642);
            border: 1px solid rgba(93, 56, 22, 0.38);
            padding: 0.9rem 1.15rem;
            min-height: 48px;
            font-size: 0.98rem;
            color: #2b1b12;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 24px rgba(213, 166, 66, 0.28), inset 0 1px 0 rgba(255,255,255,0.42);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            width: min(100%, 252px);
        }

        button:hover,
        button:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow: 0 12px 26px rgba(213, 166, 66, 0.36), inset 0 1px 0 rgba(255,255,255,0.5);
            outline: none;
        }

        button:active {
            transform: scale(0.97);
        }

        #hud {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            color: var(--text);
            font-size: clamp(0.72rem, 2.8vw, 0.92rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.48);
            pointer-events: none;
            display: none;
            font-family: 'Exo 2', system-ui, sans-serif;
            text-transform: uppercase;
            background:
                radial-gradient(circle at 12% 50%, rgba(255, 216, 121, 0.18), transparent 25%),
                var(--hud-bg);
            border: 1px solid rgba(213, 166, 66, 0.48);
            border-radius: 999px;
            padding: 0.55rem 0.8rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24);
        }

        #scoreVal {
            color: var(--accent);
        }

        #controls {
            position: absolute;
            right: max(14px, calc(env(safe-area-inset-right) + 10px));
            bottom: max(16px, calc(env(safe-area-inset-bottom) + 12px));
            pointer-events: auto;
            z-index: 100;
        }

        .icon-btn {
            background: var(--panel);
            border: 1px solid rgba(213, 166, 66, 0.35);
            color: var(--text);
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            backdrop-filter: blur(8px);
        }

        .icon-btn .material-symbols-sharp {
            font-size: 24px;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        #feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 40;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 22vw, 132px);
            opacity: 0;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.35));
            transition: opacity 0.2s ease, transform 0.2s ease;
            will-change: opacity, transform;
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
        }

        .feedback-gif-top {
            top: max(70px, calc(env(safe-area-inset-top) + 56px));
            right: max(12px, calc(env(safe-area-inset-right) + 14px));
            transform: translateY(-8px) scale(0.96);
        }

        .feedback-gif-bottom {
            left: max(12px, calc(env(safe-area-inset-left) + 14px));
            bottom: max(90px, calc(env(safe-area-inset-bottom) + 82px));
            transform: translateY(8px) scale(0.96);
        }

        .feedback-gif-top.is-visible,
        .feedback-gif-bottom.is-visible {
            transform: translateY(0) scale(1);
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.42rem 0.7rem;
            border-radius: 999px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            color: var(--accent);
            background: rgba(43, 27, 18, 0.1);
            border: 1px solid rgba(93, 56, 22, 0.18);
            margin-bottom: 0.72rem;
        }

        .status-chip::before,
        .status-chip::after {
            content: "✦";
            color: #d5a642;
            font-size: 0.76rem;
        }

        @media (max-width: 480px) {
            .screen {
                padding: 1.1rem 0.95rem;
                border-radius: 1rem;
            }

            .feedback-gif {
                width: clamp(76px, 26vw, 104px);
            }

            .feedback-gif-top {
                top: max(76px, calc(env(safe-area-inset-top) + 64px));
            }

            .feedback-gif-bottom {
                bottom: max(94px, calc(env(safe-area-inset-bottom) + 86px));
            }

            p br {
                display: none;
            }

            button {
                width: 100%;
                font-size: 0.96rem;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- [agent-note][world-design] preserve: hud-layout | reason: House Points is copy-only and keeps scoring semantics unchanged -->
    <div id="hud">House Points: <span id="scoreVal">0</span></div>
    
    <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
    <div id="controls">
        <button id="muteBtn" class="icon-btn" aria-label="Toggle audio">
            <span class="material-symbols-sharp">volume_up</span>
        </button>
    </div>

    <!-- [agent-note][stage3] resolved-gif: combo/game-over feedback -> catalogs/gifs.json -->
    <div id="feedback-layer" aria-hidden="true">
        <img id="combo-gif" class="feedback-gif feedback-gif-top" alt="House Cup charm burst">
        <img id="danger-gif" class="feedback-gif feedback-gif-bottom" alt="Cursed charm cloud warning">
    </div>

    <div id="ui-layer">
        <div id="start-screen" class="screen">
            <span class="screen-copy-strong">Great Hall Lesson</span>
            <h1>HOGWARTS SPELL-BUBBLE RELAY</h1>
            <div class="status-chip">Enchanted Ceiling Ready</div>
            <p>Drag to aim. Release to cast.<br>Match 3 spell bubbles to earn House Points.</p>
            <button id="startBtn">START LESSON</button>
        </div>
        <div id="game-over-screen" class="screen">
            <span class="screen-copy-strong">Curse Cloud Breach</span>
            <h1 id="go-title">LESSON LOST</h1>
            <p>House Points: <span id="finalScore">0</span></p>
            <button id="restartBtn">RETRY LESSON</button>
        </div>
    </div>
</div>

<script>
/**
 * 1. ASSET CONFIGURATION
 */
const ASSETS = {
    images: {
        bubble: "https://gamezone-virid.vercel.app/assets/images/sprites/runner/coin.png",
        background: "https://gamezone-virid.vercel.app/assets/images/backgrounds/runner/city.png"
    },
    audio: {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
        throw: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3",
        pop: "https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3",
        combo: "https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3",
        fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
        ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
        start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3",
        restart: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3"
    },
    gifs: {
        combo: "https://i.giphy.com/2Pw6NK0XrHTiNnUbPv.webp",
        danger: "https://i.giphy.com/9npIiZIdldtWYhGztn.webp"
    }
};

const COLORS = [
    { name: 'gryffindor', hex: '#ff6b7d', deep: '#7a1628', glow: 'rgba(255, 107, 125, 0.45)', rune: '♌' },
    { name: 'ravenclaw', hex: '#68b7ff', deep: '#183f75', glow: 'rgba(104, 183, 255, 0.45)', rune: '✦' },
    { name: 'hufflepuff', hex: '#ffd65c', deep: '#7a5612', glow: 'rgba(255, 214, 92, 0.45)', rune: '◆' },
    { name: 'slytherin', hex: '#c289ff', deep: '#442060', glow: 'rgba(194, 137, 255, 0.45)', rune: '☾' }
];

/**
 * 2. AUDIO MANAGER SYSTEM
 */
class AudioManager {
    constructor() {
        this.sounds = {};
        this.cooldowns = new Map();
        this.muted = false;
        this.ready = false;
    }

    preload() {
        if (this.ready) return;
        Object.entries(ASSETS.audio).forEach(([key, url]) => {
            if (!url) return;
            const audio = new Audio(url);
            audio.preload = 'auto';
            if (key === 'bgm') {
                audio.loop = true;
                audio.volume = 0.2;
            } else if (key === 'pop') {
                audio.volume = 0.5;
            } else if (key === 'throw') {
                audio.volume = 0.38;
            } else {
                audio.volume = 0.44;
            }
            this.sounds[key] = audio;
        });
        this.ready = true;
    }

    unlock() {
        this.preload();
        if (this.muted || !this.sounds.bgm) return;
        const bgm = this.sounds.bgm;
        bgm.play().then(() => {
            bgm.pause();
            bgm.currentTime = 0;
        }).catch(() => {});
    }

    play(key, options = {}) {
        if (this.muted || !this.sounds[key]) return;
        const { restart = false, cooldown = 0 } = options;
        const now = performance.now();

        if (cooldown > 0) {
            const nextAllowedAt = this.cooldowns.get(key) || 0;
            if (now < nextAllowedAt) return;
            this.cooldowns.set(key, now + cooldown);
        }

        if (key === 'bgm') {
            const bgm = this.sounds[key];
            if (restart) {
                bgm.currentTime = 0;
            }
            bgm.play().catch(() => {});
            return;
        }

        const base = this.sounds[key];
        if (restart) {
            base.pause();
            base.currentTime = 0;
            base.play().catch(() => {});
            return;
        }

        const sfx = base.cloneNode();
        sfx.volume = base.volume;
        sfx.play().catch(() => {});
    }

    stop(key) {
        if (!this.sounds[key]) return;
        this.sounds[key].pause();
        this.sounds[key].currentTime = 0;
    }

    toggleMute() {
        this.muted = !this.muted;
        const btnIcon = document.querySelector('#muteBtn .material-symbols-sharp');
        if (btnIcon) {
            btnIcon.textContent = this.muted ? 'volume_off' : 'volume_up';
        }

        if (!this.sounds.bgm) return;
        if (this.muted) {
            this.sounds.bgm.pause();
        } else {
            this.play('bgm');
        }
    }
}

/**
 * 3. GAME LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioManager = new AudioManager();
const comboGif = document.getElementById('combo-gif');
const dangerGif = document.getElementById('danger-gif');

// Game State
let gameState = 'START'; // START, PLAY, GAMEOVER
let score = 0;
let lastTime = 0;

// Grid Config
const GRID_COLS = 8;
const GRID_ROWS = 12; // Visible rows
let TILE_SIZE = 40; // Calculated dynamically
let OFFSET_X = 0;
let OFFSET_Y = 0;

// Entities
let grid = []; // 2D array
let particles = [];
let projectile = null;
let nextBubbleType = 0;
let animationId;

// Images
const imgBubble = new Image();
const imgBg = new Image();
let assetsLoaded = 0;

function checkAssets() {
    assetsLoaded++;
    if (assetsLoaded === 2) {
        console.log("Assets Loaded");
        draw(); // Initial draw
    }
}

imgBubble.src = ASSETS.images.bubble;
imgBubble.onload = checkAssets;
imgBg.src = ASSETS.images.background;
imgBg.onload = checkAssets;
comboGif.src = ASSETS.gifs.combo;
dangerGif.src = ASSETS.gifs.danger;

// Input
let aimAngle = -Math.PI / 2;
let isDragging = false;

// --- Core Classes ---

class Bubble {
    constructor(r, c, type) {
        this.r = r;
        this.c = c;
        this.type = type; // Index in COLORS
        this.x = 0;
        this.y = 0;
        this.active = true;
        this.updatePos();
    }

    updatePos() {
        // Hex grid math
        // Odd rows offset by half width
        const offsetX = (this.r % 2 === 1) ? TILE_SIZE / 2 : 0;
        this.x = OFFSET_X + this.c * TILE_SIZE + TILE_SIZE / 2 + offsetX;
        this.y = OFFSET_Y + this.r * (TILE_SIZE * 0.866) + TILE_SIZE / 2; // 0.866 is sin(60deg) approx
    }

    draw(context) {
        if (!this.active) return;
        
        const radius = TILE_SIZE / 2 - 2;
        const color = COLORS[this.type];
        
        context.save();
        context.translate(this.x, this.y);
        drawRunedSpellOrb(context, radius, color, false);
        context.restore();
    }
}

class Projectile {
    constructor(type) {
        this.type = type;
        this.x = canvas.width / 2;
        this.y = canvas.height - TILE_SIZE * 2;
        this.vx = 0;
        this.vy = 0;
        this.radius = TILE_SIZE / 2 - 2;
        this.active = true;
        this.moving = false;
    }

    shoot(angle) {
        const speed = TILE_SIZE * 0.5; // Speed relative to screen size
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.moving = true;
        audioManager.play('throw');
    }

    update() {
        if (!this.moving) return;

        this.x += this.vx;
        this.y += this.vy;

        // Wall collisions
        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        }
        if (this.x + this.radius > canvas.width) {
            this.x = canvas.width - this.radius;
            this.vx *= -1;
        }
        
        // Ceiling collision
        if (this.y - this.radius < 0) {
            this.snapToGrid();
        }
    }

    draw(context) {
        if (!this.active) return;
        
        const color = COLORS[this.type];

        context.save();
        context.translate(this.x, this.y);
        drawRunedSpellOrb(context, this.radius, color, true);
        context.restore();
    }

    snapToGrid() {
        this.moving = false;
        
        // Find nearest grid coordinate
        // Inverse of updatePos logic
        const gridY = (this.y - OFFSET_Y - TILE_SIZE / 2) / (TILE_SIZE * 0.866);
        let r = Math.round(gridY);
        
        // Handle X based on row parity
        const offsetX = (r % 2 === 1) ? TILE_SIZE / 2 : 0;
        const gridX = (this.x - OFFSET_X - TILE_SIZE / 2 - offsetX) / TILE_SIZE;
        let c = Math.round(gridX);

        // Clamp
        if (r < 0) r = 0;
        if (c < 0) c = 0;
        if (c >= GRID_COLS - (r % 2)) c = GRID_COLS - (r % 2) - 1;

        // Check if occupied, if so, move to neighbor closest to entry vector
        // Simple fallback: if occupied, just search neighbors
        while (grid[r] && grid[r][c]) {
            r++;
        }

        // Expand grid if necessary
        if (!grid[r]) grid[r] = [];

        const newBubble = new Bubble(r, c, this.type);
        grid[r][c] = newBubble;

        // Check Matches
        handleLanding(newBubble);
        
        // Reset Projectile
        spawnProjectile();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        drawSparkStar(ctx, 0, 0, 4.8, 2.1);
        ctx.restore();
        ctx.globalAlpha = 1.0;
    }
}

// --- Game Functions ---

function drawSparkStar(context, x, y, outer, inner) {
    context.beginPath();
    for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const radius = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) context.moveTo(px, py);
        else context.lineTo(px, py);
    }
    context.closePath();
    context.fill();
}

function drawRunedSpellOrb(context, radius, color, isProjectile) {
    const aura = context.createRadialGradient(0, 0, radius * 0.15, 0, 0, radius * (isProjectile ? 1.75 : 1.45));
    aura.addColorStop(0, color.glow);
    aura.addColorStop(0.62, color.glow.replace('0.45', isProjectile ? '0.22' : '0.16'));
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    context.fillStyle = aura;
    context.beginPath();
    context.arc(0, 0, radius * (isProjectile ? 1.55 : 1.33), 0, Math.PI * 2);
    context.fill();

    const shell = context.createRadialGradient(-radius * 0.35, -radius * 0.42, radius * 0.08, 0, 0, radius);
    shell.addColorStop(0, 'rgba(255,255,255,0.98)');
    shell.addColorStop(0.18, color.hex);
    shell.addColorStop(0.72, color.deep);
    shell.addColorStop(1, '#100818');
    context.fillStyle = shell;
    context.beginPath();
    context.arc(0, 0, radius, 0, Math.PI * 2);
    context.fill();

    context.strokeStyle = 'rgba(255, 243, 208, 0.86)';
    context.lineWidth = Math.max(1.4, radius * 0.13);
    context.beginPath();
    context.arc(0, 0, radius - context.lineWidth * 0.45, 0, Math.PI * 2);
    context.stroke();

    context.strokeStyle = 'rgba(255, 216, 121, 0.46)';
    context.lineWidth = Math.max(1, radius * 0.055);
    context.beginPath();
    context.arc(0, 0, radius * 0.58, -Math.PI * 0.15, Math.PI * 1.12);
    context.stroke();

    context.fillStyle = 'rgba(255, 243, 208, 0.82)';
    context.font = `${Math.max(10, radius * 0.78)}px Cinzel, Georgia, serif`;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText(color.rune, 0, radius * 0.04);

    context.fillStyle = 'rgba(255,255,255,0.72)';
    context.beginPath();
    context.ellipse(-radius * 0.32, -radius * 0.38, radius * 0.2, radius * 0.11, -0.6, 0, Math.PI * 2);
    context.fill();

    if (isProjectile) {
        context.strokeStyle = 'rgba(255, 216, 121, 0.65)';
        context.lineWidth = Math.max(1, radius * 0.05);
        context.beginPath();
        context.moveTo(-radius * 1.15, radius * 0.8);
        context.quadraticCurveTo(0, radius * 1.16, radius * 1.15, radius * 0.8);
        context.stroke();
    }
}

function showGifFeedback(element, duration = 1200) {
    if (!element) return;
    element.classList.add('is-visible');
    clearTimeout(element._hideTimer);
    element._hideTimer = setTimeout(() => {
        element.classList.remove('is-visible');
    }, duration);
}

function initGame() {
    resize();
    score = 0;
    particles = [];
    document.getElementById('scoreVal').innerText = score;
    
    // Build Level
    grid = [];
    for (let r = 0; r < 5; r++) {
        grid[r] = [];
        let cols = GRID_COLS - (r % 2);
        for (let c = 0; c < cols; c++) {
            grid[r][c] = new Bubble(r, c, Math.floor(Math.random() * COLORS.length));
        }
    }

    spawnProjectile();
    gameState = 'PLAY';
    showGifFeedback(comboGif, 900);
    audioManager.play('bgm');
}

function spawnProjectile() {
    // Determine next type
    // Simple random for MVP
    let nextType = Math.floor(Math.random() * COLORS.length);
    projectile = new Projectile(nextType);
}

function handleLanding(bubble) {
    // 1. Find Matches (BFS)
    let matches = findMatches(bubble);
    
    if (matches.length >= 3) {
        // Pop
        audioManager.play('pop', { cooldown: 90 });
        if (matches.length >= 4) {
            audioManager.play('combo', { cooldown: 300 });
            showGifFeedback(comboGif, 1300);
        }
        score += matches.length * 10;
        document.getElementById('scoreVal').innerText = score;

        matches.forEach(b => {
            grid[b.r][b.c] = null;
            createExplosion(b.x, b.y, COLORS[b.type].hex);
        });

        // 2. Drop Floating Clusters
        dropFloatingBubbles();
    } else {
        audioManager.play('fail', { cooldown: 260 });
        if (bubble.r >= GRID_ROWS - 3) {
            showGifFeedback(dangerGif, 1100);
        }
        // Check Loss Condition (if bubble is too low)
        if (bubble.r >= GRID_ROWS - 2) {
            gameOver();
        }
    }
    
    // Check Win (Empty Grid)
    let count = 0;
    for (let r in grid) {
        for (let c in grid[r]) {
            if (grid[r][c]) count++;
        }
    }
    if (count === 0) {
        audioManager.play('combo', { restart: true });
        showGifFeedback(comboGif, 1500);
        // Win/Reset
        initGame(); // Loop for MVP
    }
}

function findMatches(startNode) {
    let visited = new Set();
    let queue = [startNode];
    let matches = [];
    let targetType = startNode.type;

    visited.add(`${startNode.r},${startNode.c}`);
    matches.push(startNode);

    while (queue.length > 0) {
        let current = queue.shift();
        let neighbors = getNeighbors(current);

        for (let n of neighbors) {
            let key = `${n.r},${n.c}`;
            if (!visited.has(key) && n.type === targetType) {
                visited.add(key);
                matches.push(n);
                queue.push(n);
            }
        }
    }
    return matches;
}

function dropFloatingBubbles() {
    // Find all bubbles connected to roof (row 0)
    let visited = new Set();
    let queue = [];

    // Add all top row bubbles
    if (grid[0]) {
        for (let c = 0; c < grid[0].length; c++) {
            if (grid[0][c]) {
                queue.push(grid[0][c]);
                visited.add(`0,${c}`);
            }
        }
    }

    // BFS from roof
    while (queue.length > 0) {
        let current = queue.shift();
        let neighbors = getNeighbors(current);
        for (let n of neighbors) {
            let key = `${n.r},${n.c}`;
            if (!visited.has(key)) {
                visited.add(key);
                queue.push(n);
            }
        }
    }

    // Remove anything not visited
    let dropped = 0;
    for (let r = 0; r < grid.length; r++) {
        if (!grid[r]) continue;
        for (let c = 0; c < grid[r].length; c++) {
            let b = grid[r][c];
            if (b && !visited.has(`${r},${c}`)) {
                grid[r][c] = null;
                createExplosion(b.x, b.y, COLORS[b.type].hex);
                dropped++;
            }
        }
    }
    if (dropped > 0) {
        score += dropped * 20;
        document.getElementById('scoreVal').innerText = score;
        audioManager.play('combo', { cooldown: 180 });
        showGifFeedback(comboGif, 1200);
    }
}

function getNeighbors(node) {
    let neighbors = [];
    let directions = [
        {r:0, c:-1}, {r:0, c:1},
        {r:-1, c:0}, {r:-1, c:1},
        {r:1, c:0}, {r:1, c:1}
    ];

    // Adjust for Odd Rows
    if (node.r % 2 !== 0) {
        directions = [
            {r:0, c:-1}, {r:0, c:1},
            {r:-1, c:-1}, {r:-1, c:0},
            {r:1, c:-1}, {r:1, c:0}
        ];
    }

    for (let d of directions) {
        let nr = node.r + d.r;
        let nc = node.c + d.c;
        if (grid[nr] && grid[nr][nc]) {
            neighbors.push(grid[nr][nc]);
        }
    }
    return neighbors;
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 5; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    audioManager.stop('bgm');
    audioManager.play('fail', { restart: true });
    showGifFeedback(dangerGif, 1800);
    document.getElementById('finalScore').innerText = score;
    document.getElementById('game-over-screen').style.display = 'block';
    document.getElementById('hud').style.display = 'none';
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Calculate Grid Metrics based on screen width
    // We want GRID_COLS to fit width
    TILE_SIZE = Math.min(canvas.width / (GRID_COLS + 1), 60);
    
    // Center the grid
    let gridWidth = GRID_COLS * TILE_SIZE;
    OFFSET_X = (canvas.width - gridWidth) / 2;
    OFFSET_Y = 50; // Top padding

    // Re-calc positions of existing bubbles
    if (grid) {
        for (let r in grid) {
            for (let c in grid[r]) {
                if (grid[r][c]) grid[r][c].updatePos();
            }
        }
    }
    if (projectile) {
        projectile.radius = TILE_SIZE / 2 - 2;
        if (!projectile.moving) {
            projectile.x = canvas.width / 2;
            projectile.y = canvas.height - TILE_SIZE * 2;
        }
    }
}

// --- Loop ---

function update() {
    if (gameState !== 'PLAY') return;

    // Update Projectile
    if (projectile) {
        projectile.update();
        // Check collision with bubbles
        if (projectile.moving) {
            let hit = false;
            for (let r = 0; r < grid.length; r++) {
                if (!grid[r]) continue;
                for (let c = 0; c < grid[r].length; c++) {
                    let b = grid[r][c];
                    if (b) {
                        let dx = projectile.x - b.x;
                        let dy = projectile.y - b.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < (projectile.radius + TILE_SIZE / 2 - 4)) {
                            projectile.snapToGrid();
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit) break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function drawSkyOverlay() {
    // [agent-note][visuals-unified] authored-bg: procedural Hogwarts scene fully replaces the generic city image while preserving game loop/mechanics.
    const now = performance.now() * 0.001;
    const visualPhase = Math.min(4, Math.floor(score / 120));
    const phaseGlow = ['rgba(255,216,121,0.08)', 'rgba(104,183,255,0.09)', 'rgba(255,214,92,0.09)', 'rgba(215,236,255,0.10)', 'rgba(194,137,255,0.12)'][visualPhase];

    const hallGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    hallGradient.addColorStop(0, '#100818');
    hallGradient.addColorStop(0.42, visualPhase >= 3 ? '#151b2b' : '#1f1230');
    hallGradient.addColorStop(1, visualPhase >= 4 ? '#1c1025' : '#39220f');
    ctx.fillStyle = hallGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const ceilingGlow = ctx.createRadialGradient(canvas.width / 2, canvas.height * 0.08, 10, canvas.width / 2, canvas.height * 0.08, canvas.width * 0.7);
    ceilingGlow.addColorStop(0, phaseGlow);
    ceilingGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ceilingGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.globalAlpha = 0.58;
    for (let i = 0; i < 42; i++) {
        const px = (i * 83 + Math.sin(now * 0.15 + i) * 8) % canvas.width;
        const py = 20 + ((i * 37) % Math.max(120, canvas.height * 0.46));
        const twinkle = 0.35 + Math.sin(now * 1.4 + i * 0.7) * 0.22;
        ctx.fillStyle = `rgba(255, 232, 150, ${Math.max(0.12, twinkle)})`;
        if (i % 7 === 0) {
            drawSparkStar(ctx, px, py, 3.6, 1.4);
        } else {
            ctx.beginPath();
            ctx.arc(px, py, 1 + (i % 3) * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.strokeStyle = 'rgba(213, 166, 66, 0.16)';
    ctx.lineWidth = 1;
    for (let i = -1; i < 8; i++) {
        const x = (i * canvas.width / 6) + Math.sin(now * 0.24) * 8;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.quadraticCurveTo(x + canvas.width * 0.08, canvas.height * 0.22, x + canvas.width * 0.04, canvas.height * 0.48);
        ctx.stroke();
    }

    for (let i = 0; i < 9; i++) {
        const x = ((i + 0.45) * canvas.width) / 9.4;
        const y = 54 + Math.sin(now + i) * 5 + (i % 3) * 16;
        ctx.strokeStyle = 'rgba(255, 216, 121, 0.32)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, y - 12);
        ctx.stroke();

        const flame = ctx.createRadialGradient(x, y, 0, x, y, 18);
        flame.addColorStop(0, 'rgba(255, 245, 180, 0.78)');
        flame.addColorStop(0.42, 'rgba(255, 180, 68, 0.28)');
        flame.addColorStop(1, 'rgba(255, 180, 68, 0)');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 223, 173, 0.78)';
        ctx.fillRect(x - 3, y + 4, 6, 16);
    }

    const archBase = canvas.height * 0.72;
    ctx.fillStyle = 'rgba(18, 11, 20, 0.68)';
    for (let i = -1; i < 5; i++) {
        const x = i * canvas.width / 4;
        ctx.beginPath();
        ctx.moveTo(x, canvas.height);
        ctx.lineTo(x, archBase);
        ctx.quadraticCurveTo(x + canvas.width / 8, archBase - 126, x + canvas.width / 4, archBase);
        ctx.lineTo(x + canvas.width / 4, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    const bannerColors = ['#7a1628', '#183f75', '#7a5612', '#244c36'];
    for (let i = 0; i < 4; i++) {
        const bannerX = 16 + i * 30;
        ctx.fillStyle = bannerColors[i];
        ctx.globalAlpha = 0.34;
        ctx.fillRect(bannerX, canvas.height * 0.34, 14, 92);
        ctx.beginPath();
        ctx.moveTo(bannerX, canvas.height * 0.34 + 92);
        ctx.lineTo(bannerX + 7, canvas.height * 0.34 + 78);
        ctx.lineTo(bannerX + 14, canvas.height * 0.34 + 92);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(canvas.width - bannerX - 14, canvas.height * 0.34, 14, 92);
    }

    if (visualPhase >= 2) {
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = '#ffd65c';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const hoopX = canvas.width * (0.18 + i * 0.32);
            const hoopY = canvas.height * 0.58 + Math.sin(now * 0.7 + i) * 4;
            ctx.beginPath();
            ctx.arc(hoopX, hoopY, 18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(hoopX, hoopY + 18);
            ctx.lineTo(hoopX, canvas.height);
            ctx.stroke();
        }
    }

    if (visualPhase >= 3) {
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#d7ecff';
        for (let i = 0; i < 5; i++) {
            const fogY = canvas.height * (0.58 + i * 0.06) + Math.sin(now * 0.35 + i) * 7;
            ctx.beginPath();
            ctx.ellipse(canvas.width * 0.5, fogY, canvas.width * 0.6, 18, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (visualPhase >= 4) {
        ctx.globalAlpha = 0.24 + Math.sin(now * 1.6) * 0.06;
        ctx.strokeStyle = '#c289ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height * 0.5, Math.min(canvas.width, canvas.height) * 0.42, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
    }
    ctx.restore();

    const vignette = ctx.createRadialGradient(canvas.width / 2, canvas.height * 0.38, canvas.width * 0.12, canvas.width / 2, canvas.height * 0.55, canvas.width * 0.78);
    vignette.addColorStop(0, 'rgba(255, 216, 121, 0.035)');
    vignette.addColorStop(1, 'rgba(0, 0, 0, 0.44)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawLauncherBase() {
    if (!projectile) return;

    const baseY = canvas.height - TILE_SIZE * 1.1;
    const baseRadius = TILE_SIZE * 0.9;

    ctx.save();
    ctx.translate(canvas.width / 2, baseY);

    const baseGlow = ctx.createRadialGradient(0, 0, 4, 0, 0, baseRadius * 1.45);
    baseGlow.addColorStop(0, 'rgba(255, 216, 121, 0.22)');
    baseGlow.addColorStop(1, 'rgba(255, 216, 121, 0)');
    ctx.fillStyle = baseGlow;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 1.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(43, 27, 18, 0.86)';
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(213, 166, 66, 0.6)';
    ctx.lineWidth = Math.max(2, TILE_SIZE * 0.06);
    ctx.stroke();

    ctx.fillStyle = 'rgba(16, 8, 24, 0.72)';
    ctx.beginPath();
    ctx.moveTo(-TILE_SIZE * 0.42, TILE_SIZE * 0.42);
    ctx.quadraticCurveTo(0, TILE_SIZE * 0.08, TILE_SIZE * 0.42, TILE_SIZE * 0.42);
    ctx.lineTo(TILE_SIZE * 0.24, TILE_SIZE * 0.82);
    ctx.lineTo(-TILE_SIZE * 0.24, TILE_SIZE * 0.82);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(213, 166, 66, 0.5)';
    ctx.lineWidth = Math.max(1, TILE_SIZE * 0.035);
    ctx.beginPath();
    ctx.moveTo(-TILE_SIZE * 0.24, TILE_SIZE * 0.5);
    ctx.lineTo(TILE_SIZE * 0.24, TILE_SIZE * 0.5);
    ctx.stroke();

    ctx.rotate(aimAngle + Math.PI / 2);
    const wandGradient = ctx.createLinearGradient(0, -TILE_SIZE * 1.18, 0, TILE_SIZE * 0.04);
    wandGradient.addColorStop(0, '#9a6130');
    wandGradient.addColorStop(0.58, '#5a2f15');
    wandGradient.addColorStop(1, '#2b1b12');
    ctx.fillStyle = wandGradient;
    ctx.fillRect(-TILE_SIZE * 0.07, -TILE_SIZE * 1.12, TILE_SIZE * 0.14, TILE_SIZE * 1.16);
    ctx.fillStyle = '#d5a642';
    ctx.fillRect(-TILE_SIZE * 0.14, -TILE_SIZE * 0.22, TILE_SIZE * 0.28, TILE_SIZE * 0.2);
    ctx.beginPath();
    ctx.arc(0, -TILE_SIZE * 1.14, TILE_SIZE * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 216, 121, 0.92)';
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 243, 208, 0.85)';
    drawSparkStar(ctx, 0, -TILE_SIZE * 1.14, TILE_SIZE * 0.2, TILE_SIZE * 0.08);

    ctx.restore();
}

function draw() {
    // Clear
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw authored procedural Hogwarts background; stock background image is intentionally not drawn.
    drawSkyOverlay();

    // Draw Grid
    for (let r in grid) {
        for (let c in grid[r]) {
            if (grid[r][c]) grid[r][c].draw(ctx);
        }
    }

    drawLauncherBase();

    // Draw Projectile
    if (projectile) projectile.draw(ctx);

    // Draw Particles
    particles.forEach(p => p.draw(ctx));

    // Draw Aim Line
    if (gameState === 'PLAY' && projectile && !projectile.moving) {
        ctx.beginPath();
        ctx.moveTo(projectile.x, projectile.y);
        ctx.lineTo(projectile.x + Math.cos(aimAngle) * 110, projectile.y + Math.sin(aimAngle) * 110);
        ctx.strokeStyle = 'rgba(255, 216, 121, 0.9)';
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    animationId = requestAnimationFrame(loop);
}

function loop(timestamp) {
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    
    update(dt);
    draw();
}

// --- Event Listeners ---

window.addEventListener('resize', resize);

// Input Handling
function handleInputStart(e) {
    if (gameState !== 'PLAY') return;
    if (e.target.closest('button')) return;
    isDragging = true;
    updateAim(e);
}

function handleInputMove(e) {
    if (!isDragging) return;
    updateAim(e);
}

function handleInputEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    if (projectile && !projectile.moving) {
        projectile.shoot(aimAngle);
    }
}

function updateAim(e) {
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    // Aim based on angle from shooter
    if (projectile) {
        let dx = clientX - projectile.x;
        let dy = clientY - projectile.y;
        aimAngle = Math.atan2(dy, dx);
        
        // Clamp angle to upward direction only
        if (aimAngle > -0.2) aimAngle = -0.2;
        if (aimAngle < -Math.PI + 0.2) aimAngle = -Math.PI + 0.2;
    }
}

window.addEventListener('mousedown', handleInputStart);
window.addEventListener('mousemove', handleInputMove);
window.addEventListener('mouseup', handleInputEnd);

/* [agent-note][stage4] repaired: mobile-cta-actionability | action: scope touch suppression to game surface so menu buttons keep native tap/click */
canvas.addEventListener('touchstart', handleInputStart, { passive: false });
canvas.addEventListener('touchmove', (e) => {
    if (!isDragging || gameState !== 'PLAY') return;
    e.preventDefault();
    handleInputMove(e);
}, { passive: false });
canvas.addEventListener('touchend', handleInputEnd);
canvas.addEventListener('touchcancel', handleInputEnd);

// UI Buttons
document.getElementById('startBtn').addEventListener('click', () => {
    audioManager.unlock();
    audioManager.play('start', { restart: true });
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    initGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    audioManager.play('restart', { restart: true });
    document.getElementById('game-over-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    initGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
    e.stopPropagation(); // prevent shooting
    audioManager.play('ui', { restart: true });
    audioManager.toggleMute();
});

// Start Loop
requestAnimationFrame(loop);
