<script>
/**
 * AUDIO MANAGER
 */
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.buffers = {};
        this.mediaElements = {};
        this.unlocked = false;
        this.lastPlayTimes = {};
        this.debounceMs = 90;
    }

    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.playLoop();
        }).catch(() => {});
    }

    async loadSound(id, src) {
        const mediaEl = document.getElementById(id);
        if (mediaEl) {
            this.mediaElements[id] = mediaEl;
            mediaEl.preload = mediaEl.loop ? 'metadata' : 'auto';
        }

        try {
            const res = await fetch(src, { mode: 'cors' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const arrayBuffer = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed', id, e);
        }
    }

    playLoop() {
        const el = document.getElementById('bgm_main');
        if (!el || !this.unlocked) return;
        el.volume = 0.2;
        el.play().catch(() => {});
    }

    pauseLoop() {
        const el = document.getElementById('bgm_main');
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    }

    playSfx(id, type = 'pop', options = {}) {
        if (!this.unlocked) return;
        const nowMs = performance.now();
        const minGap = options.minGap ?? this.debounceMs;
        if (this.lastPlayTimes[id] && nowMs - this.lastPlayTimes[id] < minGap) return;
        this.lastPlayTimes[id] = nowMs;

        const buffer = this.buffers[id];
        if (buffer) {
            const source = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = options.volume ?? 0.35;
            source.buffer = buffer;
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start(0);
            return;
        }

        const mediaEl = this.mediaElements[id];
        if (mediaEl) {
            mediaEl.pause();
            mediaEl.currentTime = 0;
            mediaEl.volume = Math.min(options.volume ?? 0.35, 1);
            mediaEl.play().catch(() => {});
            return;
        }

        this.synthesize(type, options.volume);
    }

    synthesize(type, volume = 0.18) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }
}

/**
 * SUDOKU LOGIC
 */
class SudokuGenerator {
    constructor() {
        this.grid = Array(9).fill().map(() => Array(9).fill(0));
    }

    isValid(grid, row, col, num) {
        for (let x = 0; x < 9; x++) if (grid[row][x] === num) return false;
        for (let x = 0; x < 9; x++) if (grid[x][col] === num) return false;
        const startRow = row - row % 3, startCol = col - col % 3;
        for (let i = 0; i < 3; i++)
            for (let j = 0; j < 3; j++)
                if (grid[i + startRow][j + startCol] === num) return false;
        return true;
    }

    fillDiagonal() {
        for (let i = 0; i < 9; i = i + 3) this.fillBox(i, i);
    }

    fillBox(row, col) {
        let num;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                do {
                    num = Math.floor(Math.random() * 9) + 1;
                } while (!this.isSafeInBox(row, col, num));
                this.grid[row + i][col + j] = num;
            }
        }
    }

    isSafeInBox(rowStart, colStart, num) {
        for (let i = 0; i < 3; i++)
            for (let j = 0; j < 3; j++)
                if (this.grid[rowStart + i][colStart + j] === num) return false;
        return true;
    }

    solve(grid) {
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                if (grid[i][j] === 0) {
                    for (let num = 1; num <= 9; num++) {
                        if (this.isValid(grid, i, j, num)) {
                            grid[i][j] = num;
                            if (this.solve(grid)) return true;
                            grid[i][j] = 0;
                        }
                    }
                    return false;
                }
            }
        }
        return true;
    }

    generate(holes) {
        this.grid = Array(9).fill().map(() => Array(9).fill(0));
        this.fillDiagonal();
        this.solve(this.grid);
        
        // Deep copy solution
        const solution = this.grid.map(row => [...row]);
        
        // Remove elements
        let attempts = holes;
        while (attempts > 0) {
            let row = Math.floor(Math.random() * 9);
            let col = Math.floor(Math.random() * 9);
            while (this.grid[row][col] === 0) {
                row = Math.floor(Math.random() * 9);
                col = Math.floor(Math.random() * 9);
            }
            this.grid[row][col] = 0;
            attempts--;
        }
        return { puzzle: this.grid, solution: solution };
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audio = new AudioManager();
const sudoku = new SudokuGenerator();

// Game State

    screen: 'START', // START, PLAY, OVER
    puzzle: [],
    solution: [],
    userGrid: [], // Stores user inputs: { val: 0, isFixed: false, isError: false }
    selected: { r: -1, c: -1 },
    difficulty: 'Easy',
    startTime: 0,
    elapsed: 0,
    particles: []
};

// Config

// Layout Metrics

// Config Handling
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').text);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => {
    window.gameConfig[k] = window.gameConfigDefs[k].value;
});
window.updateGameConfig = (k, v) => {
    if (window.gameConfig[k] !== undefined) {
        window.gameConfig[k] = v;
        if (k === 'themeColor') config.themeColor = v;
        if (k === 'showErrors') config.showErrors = v;
        if (k === 'gameTitle') {
            document.getElementById('ui-title').innerText = v;
            document.getElementById('game-title-hud').innerText = v;
        }
    }
};

// Resize
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Calculate Layout
    const w = window.innerWidth;
    const h = window.innerHeight;
    const margin = 20;
    
    // Grid
    const maxGridW = Math.min(w - margin * 2, 600);
    const maxGridH = h * 0.55; 
    layout.gridSize = Math.min(maxGridW, maxGridH);
    layout.cellSize = layout.gridSize / 9;
    layout.offsetX = (w - layout.gridSize) / 2;
    layout.offsetY = h * 0.15; // Top margin for HUD

    // Keypad
    layout.keypadY = layout.offsetY + layout.gridSize + 30;
    const remainingH = h - layout.keypadY - 20;
    layout.keypadSize = Math.min((w - 40) / 5, remainingH / 2.5);
}

window.addEventListener('resize', resize);

// Input Handling
let isPointerDown = false;
canvas.addEventListener('pointerdown', e => {
    isPointerDown = true;
    audio.unlock();
    handleInput(e);
}, { passive: false });

canvas.addEventListener('pointerup', () => isPointerDown = false);
canvas.addEventListener('pointercancel', () => isPointerDown = false);

function handleInput(e) {
    e.preventDefault();
    if (gameState.screen !== 'PLAY') return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Grid Interaction
    if (x >= layout.offsetX && x <= layout.offsetX + layout.gridSize &&
        y >= layout.offsetY && y <= layout.offsetY + layout.gridSize) {
        
        const c = Math.floor((x - layout.offsetX) / layout.cellSize);
        const r = Math.floor((y - layout.offsetY) / layout.cellSize);
        
        if (r >= 0 && r < 9 && c >= 0 && c < 9) {
            gameState.selected = { r, c };
            audio.playSfx('sfx_ui', 'pop', { volume: 0.18, minGap: 45 });
        }
    }

    // Keypad Interaction
    const kpSize = layout.keypadSize;
    const gap = 8;
    const kpStartX = (window.innerWidth - (5 * kpSize + 4 * gap)) / 2;
    
    // Row 1: 1-5
    for (let i = 0; i < 5; i++) {
        const bx = kpStartX + i * (kpSize + gap);
        const by = layout.keypadY;
        if (x >= bx && x <= bx + kpSize && y >= by && y <= by + kpSize) {
            inputNumber(i + 1);
        }
    }
    // Row 2: 6-9, Delete
    for (let i = 0; i < 5; i++) {
        const bx = kpStartX + i * (kpSize + gap);
        const by = layout.keypadY + kpSize + gap;
        if (x >= bx && x <= bx + kpSize && y >= by && y <= by + kpSize) {
            if (i < 4) inputNumber(i + 6);
            else inputNumber(0); // Clear
        }
    }
}

function inputNumber(num) {
    const { r, c } = gameState.selected;
    if (r === -1 || c === -1) return;
    
    // Cannot edit fixed cells
    if (gameState.userGrid[r][c].isFixed) {
        audio.playSfx('sfx_locked', 'error', { volume: 0.22, minGap: 120 });
        showFeedbackGif('fail', 900);
        shakeScreen();
        return;
    }

    gameState.userGrid[r][c].val = num;
    
    // Validate
    if (num !== 0) {
        const isCorrect = num === gameState.solution[r][c];
        gameState.userGrid[r][c].isError = !isCorrect;
        
        if (!isCorrect && config.showErrors) {
            audio.playSfx('sfx_error', 'error', { volume: 0.26, minGap: 120 });
            showFeedbackGif('fail', 1100);
        } else {
            audio.playSfx('sfx_place', 'pop', { volume: 0.2, minGap: 70 });
            // Check Win
            checkWin();
        }
    } else {
        gameState.userGrid[r][c].isError = false;
        audio.playSfx('sfx_ui', 'pop', { volume: 0.16, minGap: 70 });
    }
}

function checkWin() {
    let complete = true;
    let error = false;
    for(let i=0; i<9; i++) {
        for(let j=0; j<9; j++) {
            if (gameState.userGrid[i][j].val === 0) complete = false;
            if (gameState.userGrid[i][j].val !== gameState.solution[i][j]) error = true;
        }
    }

    if (complete && !error) {
        endGame();
    }
}

// Particle System
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 5 + 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

function spawnConfetti() {
    for(let i=0; i<100; i++) {
        gameState.particles.push(new Particle(
            canvas.width/2, 
            canvas.height/2, 
            ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'][Math.floor(Math.random()*5)]
        ));
    }
}

let shake = 0;
let feedbackTimer = null;
function shakeScreen() {
    shake = 10;
}

function showFeedbackGif(type, duration = 1400) {
    const failGif = document.getElementById('fail-gif');
    const winGif = document.getElementById('win-gif');
    if (!failGif || !winGif) return;

    failGif.classList.remove('show');
    winGif.classList.remove('show');
    clearTimeout(feedbackTimer);

    const target = type === 'win' ? winGif : failGif;
    target.classList.remove('hidden');
    requestAnimationFrame(() => target.classList.add('show'));
    feedbackTimer = setTimeout(() => {
        target.classList.remove('show');
    }, duration);
}

// Rendering
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (shake > 0) {
        ctx.save();
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    if (gameState.screen === 'PLAY') {
        drawGrid();
        drawKeypad();
        drawParticles();
    }

    if (shake > 0) ctx.restore();

    requestAnimationFrame(draw);
}

function drawGrid() {
    const { gridSize, cellSize, offsetX, offsetY } = layout;
    
    // Background
    const panelGradient = ctx.createLinearGradient(offsetX, offsetY, offsetX, offsetY + gridSize);
    panelGradient.addColorStop(0, '#fafdff');
    panelGradient.addColorStop(1, '#dfefff');
    ctx.fillStyle = panelGradient;
    ctx.fillRect(offsetX, offsetY, gridSize, gridSize);

    const aura = ctx.createRadialGradient(
        offsetX + gridSize * 0.5,
        offsetY + gridSize * 0.24,
        gridSize * 0.08,
        offsetX + gridSize * 0.5,
        offsetY + gridSize * 0.24,
        gridSize * 0.7
    );
    aura.addColorStop(0, 'rgba(255, 211, 110, 0.16)');
    aura.addColorStop(1, 'rgba(255, 211, 110, 0)');
    ctx.fillStyle = aura;
    ctx.fillRect(offsetX, offsetY, gridSize, gridSize);
    
    // Highlight Selected & Related
    const { r: selR, c: selC } = gameState.selected;
    if (selR !== -1) {
        // Highlight Row/Col
        ctx.fillStyle = 'rgba(88, 183, 255, 0.14)';
        ctx.fillRect(offsetX, offsetY + selR * cellSize, gridSize, cellSize);
        ctx.fillRect(offsetX + selC * cellSize, offsetY, cellSize, gridSize);
        
        // Highlight Subgrid
        const startR = Math.floor(selR/3)*3;
        const startC = Math.floor(selC/3)*3;
        ctx.fillRect(offsetX + startC*cellSize, offsetY + startR*cellSize, cellSize*3, cellSize*3);

        // Highlight Same Numbers
        const selVal = gameState.userGrid[selR][selC].val;
        if (selVal !== 0) {
            ctx.fillStyle = 'rgba(255, 211, 110, 0.26)';
            for(let i=0; i<9; i++) {
                for(let j=0; j<9; j++) {
                    if (gameState.userGrid[i][j].val === selVal) {
                        ctx.fillRect(offsetX + j*cellSize, offsetY + i*cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        // Highlight Selection
        ctx.fillStyle = config.themeColor;
        ctx.globalAlpha = 0.38;
        ctx.fillRect(offsetX + selC * cellSize, offsetY + selR * cellSize, cellSize, cellSize);
        ctx.globalAlpha = 1.0;
    }

    // Grid Lines
    ctx.beginPath();
    for (let i = 0; i <= 9; i++) {
        const pos = i * cellSize;
        ctx.lineWidth = i % 3 === 0 ? 3 : 1;
        ctx.strokeStyle = i % 3 === 0 ? '#29549a' : '#adc9ee';
        
        // Vertical
        ctx.moveTo(offsetX + pos, offsetY);
        ctx.lineTo(offsetX + pos, offsetY + gridSize);
        // Horizontal
        ctx.moveTo(offsetX, offsetY + pos);
        ctx.lineTo(offsetX + gridSize, offsetY + pos);
    }
    ctx.stroke();

    // Numbers
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${cellSize * 0.56}px "Rajdhani"`;

    for (let i = 0; i < 9; i++) {
        for (let j = 0; j < 9; j++) {
            const cell = gameState.userGrid[i][j];
            if (cell.val !== 0) {
                const x = offsetX + j * cellSize + cellSize / 2;
                const y = offsetY + i * cellSize + cellSize / 2 + 2; // +2 for visual centering
                
                if (cell.isFixed) {
                    ctx.fillStyle = '#17315f';
                } else if (cell.isError && config.showErrors) {
                    ctx.fillStyle = '#e64d71';
                } else {
                    ctx.fillStyle = '#1684da';
                }
                ctx.fillText(cell.val, x, y);
            }
        }
    }
}

function drawKeypad() {
    const kpSize = layout.keypadSize;
    const gap = 8;
    const kpStartX = (window.innerWidth - (5 * kpSize + 4 * gap)) / 2;
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${kpSize * 0.44}px "Rajdhani"`;

    const drawBtn = (label, i, row) => {
        const x = kpStartX + i * (kpSize + gap);
        const y = layout.keypadY + row * (kpSize + gap);
        
        // Shadow
        ctx.fillStyle = 'rgba(7, 19, 42, 0.35)';
        ctx.beginPath();
        ctx.roundRect(x, y + 4, kpSize, kpSize, 10);
        ctx.fill();

        // Body
        const keyGradient = ctx.createLinearGradient(x, y, x, y + kpSize);
        keyGradient.addColorStop(0, '#fefeff');
        keyGradient.addColorStop(1, '#d9ebff');
        ctx.fillStyle = keyGradient;
        ctx.beginPath();
        ctx.roundRect(x, y, kpSize, kpSize, 10);
        ctx.fill();

        ctx.strokeStyle = 'rgba(88, 183, 255, 0.45)';
        ctx.lineWidth = 1.25;
        ctx.stroke();
        
        // Text
        ctx.fillStyle = label === '✕' ? '#db4a74' : '#234675';
        ctx.fillText(label, x + kpSize/2, y + kpSize/2 + 2);
    };

    for(let i=0; i<5; i++) drawBtn(i+1, i, 0);
    for(let i=0; i<4; i++) drawBtn(i+6, i, 1);
    drawBtn('✕', 4, 1);
}

function drawParticles() {
    gameState.particles.forEach((p, i) => {
        p.update();
        p.draw(ctx);
        if (p.life <= 0) gameState.particles.splice(i, 1);
    });
}

// Game Logic Control
function startGame(difficulty) {
    gameState.difficulty = difficulty;
    gameState.screen = 'PLAY';
    gameState.selected = { r: -1, c: -1 };
    gameState.startTime = Date.now();
    gameState.elapsed = 0;
    gameState.particles = [];
    showFeedbackGif('fail', 10);

    // Map difficulty to holes
    const holesMap = {
        'Easy': 30, 'Medium': 40, 'Hard': 45, 
        'Advanced': 50, 'Expert': 54, 'Master': 58, 'Extreme': 62
    };
    const holes = holesMap[difficulty] || 30;

    const data = sudoku.generate(holes);
    gameState.puzzle = data.puzzle;
    gameState.solution = data.solution;
    
    // Init User Grid
    gameState.userGrid = gameState.puzzle.map(row => 
        row.map(val => ({
            val: val,
            isFixed: val !== 0,
            isError: false
        }))
    );

    // UI
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('difficulty-display').innerText = difficulty.toUpperCase();
    
    audio.unlock();
    audio.playSfx('sfx_start', 'pop', { volume: 0.24, minGap: 140 });
    audio.playLoop();
}

function endGame() {
    gameState.screen = 'OVER';
    audio.pauseLoop();
    audio.playSfx('sfx_win', 'pop', { volume: 0.3, minGap: 300 });
    showFeedbackGif('win', 2600);
    spawnConfetti();
    
    const timeStr = document.getElementById('timer').innerText;
    document.getElementById('finalTime').innerText = timeStr;
    document.getElementById('finalDiff').innerText = gameState.difficulty;
    
    setTimeout(() => {
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('game-over-screen').classList.remove('scale-90');
        document.getElementById('game-over-screen').classList.add('scale-100');
    }, 1000);
}

// Timer
setInterval(() => {
    if (gameState.screen === 'PLAY') {
        gameState.elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        const m = Math.floor(gameState.elapsed / 60).toString().padStart(2, '0');
        const s = (gameState.elapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }
}, 1000);

// UI Bindings
document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('pointerdown', () => { // Changed to pointerdown for consistency
        startGame(btn.dataset.diff);
    });
});

document.getElementById('restart-btn').addEventListener('click', () => {
    audio.playSfx('sfx_ui', 'pop', { volume: 0.18, minGap: 80 });
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
});

document.getElementById('back-btn').addEventListener('click', () => {
    audio.playSfx('sfx_ui', 'pop', { volume: 0.18, minGap: 80 });
    audio.pauseLoop();
    gameState.screen = 'START';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
});

// Init
window.addEventListener('DOMContentLoaded', () => {
    ['sfx_win', 'sfx_ui', 'sfx_start', 'sfx_place', 'sfx_error', 'sfx_locked'].forEach(id => {
        const el = document.getElementById(id);
        if (el) audio.loadSound(id, el.src);
    });
    resize();
    draw();
});

</script>
