<style>
:root{--red:#ff174d;--deep:#09070d;--ink:#151018;--black:#050509;--cream:#ffeef2;--gold:#ffd166;--cyan:#56f5ff;--green:#73ff9b;--danger:#8f1028;--panel:rgba(13,10,18,.82);--line:rgba(255,23,77,.72)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050509;color:var(--cream);font-family:Rajdhani,system-ui,sans-serif;touch-action:none}body{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,23,77,.28),transparent 38%),linear-gradient(180deg,#09070d 0%,#18101f 48%,#330b18 100%)}body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1}body:before{background:repeating-linear-gradient(105deg,rgba(255,255,255,.035) 0 2px,transparent 2px 28px),radial-gradient(circle at 18% 24%,rgba(86,245,255,.12),transparent 19%),radial-gradient(circle at 90% 75%,rgba(255,209,102,.10),transparent 24%);mix-blend-mode:screen}body:after{background:linear-gradient(90deg,rgba(255,23,77,.05),transparent 18%,transparent 82%,rgba(86,245,255,.04)),repeating-linear-gradient(0deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.12) 7px 8px);opacity:.65}#game-container{position:relative;width:100%;height:100%;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none;position:absolute;inset:0;z-index:2}#ui-layer{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,4vw,24px);pointer-events:none}.hud{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:12px;transition:opacity .25s}.glass{background:linear-gradient(180deg,rgba(24,16,29,.92),rgba(7,6,10,.86));border:2px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.13),0 0 22px rgba(255,23,77,.22);backdrop-filter:blur(8px)}.hud-chip{min-width:8.2rem;border-radius:999px;padding:.72rem 1rem;color:var(--cream)}.hud-chip:last-child{text-align:right;border-color:rgba(86,245,255,.65)}.hud-label{display:block;font-family:Bangers,Impact,sans-serif;font-size:.88rem;letter-spacing:.09em;text-transform:uppercase;color:#ffd2dc;text-shadow:2px 2px 0 #050509}.hud-chip:last-child .hud-label{color:#b9fbff}.hud-value{font-size:1.85rem;line-height:.95;font-weight:600}.brand-card{align-self:center;margin-top:.35rem;max-width:min(92vw,520px);padding:.55rem .9rem;border-radius:18px;text-align:center;transform:rotate(-1deg)}.brand-kicker{font-family:Bangers,Impact,sans-serif;letter-spacing:.08em;color:var(--gold);font-size:1rem}.brand-title{font-family:Bangers,Impact,sans-serif;font-size:clamp(2.1rem,10vw,4.8rem);line-height:.82;margin:.05rem 0;text-transform:uppercase;text-shadow:4px 4px 0 #050509,0 0 18px rgba(255,23,77,.65)}.brand-copy{margin:0;color:rgba(255,238,242,.88);font-size:clamp(.9rem,3.2vw,1.06rem)}.hidden{display:none!important}.interactive{pointer-events:auto}.opacity-0{opacity:0}.feedback-banner{position:absolute;left:50%;bottom:5.6rem;transform:translateX(-50%) translateY(14px) rotate(-1deg);width:min(78vw,22rem);padding:.64rem .9rem;border-radius:999px;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:.96rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(16,11,20,.88);border:2px solid rgba(255,23,77,.72);box-shadow:0 14px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .16s ease,transform .16s ease}.feedback-banner.show{opacity:1;transform:translateX(-50%) translateY(0) rotate(-1deg)}#game-over-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.48);padding:1.15rem}.modal{width:min(92vw,25rem);padding:1.45rem;border-radius:28px;text-align:center}.ninja-badge{display:inline-flex;align-items:center;gap:.55rem;margin-bottom:.75rem;padding:.46rem .85rem;border-radius:999px;background:rgba(255,23,77,.14);border:1px solid rgba(255,23,77,.45);font-weight:600;color:#ffd2dc}.arcade-title{font-family:Bangers,Impact,sans-serif;letter-spacing:.05em;line-height:.92;margin:.25rem 0;color:#fff;text-transform:uppercase;text-shadow:4px 4px 0 #050509,0 0 20px rgba(255,23,77,.55)}.arcade-copy{font-size:1.1rem;color:rgba(255,238,242,.9);margin:.45rem 0 1rem}.restart-btn{width:100%;border:0;border-radius:16px;padding:1rem 1.1rem;background:linear-gradient(180deg,#ff2a58,#9b1029);color:white;font-family:Bangers,Impact,sans-serif;font-size:1.75rem;letter-spacing:.07em;box-shadow:0 12px 24px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.28);cursor:pointer}.restart-btn:active{transform:scale(.97)}.reaction-gif{position:absolute;z-index:4;width:clamp(82px,22vw,142px);aspect-ratio:1/1;object-fit:cover;border-radius:20px;border:2px solid rgba(255,255,255,.72);box-shadow:0 14px 30px rgba(0,0,0,.42);background:rgba(0,0,0,.3);opacity:0;transform:scale(.8) rotate(-3deg);transition:opacity .16s,transform .16s;pointer-events:none}.reaction-gif.show{opacity:.96;transform:scale(1) rotate(-3deg)}#combo-gif{right:1rem;bottom:6rem}#danger-gif{left:1rem;top:6rem}.shake-screen{animation:shake .48s steps(5,end)}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,2px)}}@media (max-width:520px){.hud-chip{min-width:6.6rem;padding:.6rem .75rem}.hud-value{font-size:1.55rem}.brand-card{margin-top:.15rem}.feedback-banner{bottom:4.75rem;font-size:.82rem}#combo-gif{right:.75rem;bottom:5.2rem}#danger-gif{left:.75rem;top:5.35rem}}
</style>

</div>

<script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});const dpr=window.devicePixelRatio||1;let cw=0,ch=0;let gameState='INIT',lastTime=0,initialized=false,score=0,lives=3,entities=[],particles=[],spawnTimer=0,difficultyMultiplier=1,comboStreak=0,feedbackTimer=null;const reactionTimers={};let rngSeed=1337;function rand(){rngSeed=(rngSeed*1664525+1013904223)>>>0;return rngSeed/4294967296}const rawConfig=JSON.parse(document.getElementById('game-config').textContent);const gameConfig={};for(const k in rawConfig)gameConfig[k]=rawConfig[k].value;const palette={good:[{shell:'#ff174d',fill:'#1a1018',accent:'#ffffff',garnish:'#ffd166',kind:'tag'},{shell:'#111',fill:'#ff174d',accent:'#fff',garnish:'#56f5ff',kind:'star'},{shell:'#ffd166',fill:'#171018',accent:'#ff174d',garnish:'#fff',kind:'spray'}],bad:{shell:'#0b0b11',fill:'#5b1022',accent:'#56f5ff',garnish:'#9cffb7',kind:'skull'}};const AudioContextCtor=window.AudioContext||window.webkitAudioContext;const audioCtx=AudioContextCtor?new AudioContextCtor():null;const audioBuffers={};const bgmEl=document.getElementById('bgm_main');const sfxGainMap={sfx_chop:.26,sfx_score:.22,sfx_warning:.18,sfx_fail:.22,sfx_ui:.2};const sfxCooldowns={sfx_warning:0,sfx_fail:0,sfx_ui:0};bgmEl.volume=.18;
async function initAudio(){if(!audioCtx)return;const ids=['sfx_chop','sfx_score','sfx_warning','sfx_fail','sfx_ui'];await Promise.all(ids.map(async id=>{const el=document.getElementById(id);try{const res=await fetch(el.src);const buf=await res.arrayBuffer();audioBuffers[id]=await audioCtx.decodeAudioData(buf)}catch(e){console.warn('SFX fallback enabled for '+id)}}))}
function unlockAudio(){if(!audioCtx)return;if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(bgmEl.paused&&(gameState==='PLAYING'||gameState==='INIT'))bgmEl.play().catch(()=>{})}
function setBgmForState(s){if(s==='PLAYING'){if(bgmEl.paused){bgmEl.currentTime=0;bgmEl.play().catch(()=>{})}}else{bgmEl.pause();if(s==='GAMEOVER')bgmEl.currentTime=0}}
function playSfx(id){if(!audioCtx||audioCtx.state==='suspended')return;const now=performance.now();const cd=sfxCooldowns[id]||0;if(cd&&now-cd<140)return;sfxCooldowns[id]=now;if(audioBuffers[id]){const src=audioCtx.createBufferSource();const gain=audioCtx.createGain();src.buffer=audioBuffers[id];gain.gain.value=sfxGainMap[id]??.2;src.connect(gain);gain.connect(audioCtx.destination);src.start(0)}else synthesizeSfx(id)}
function synthesizeSfx(type){if(!audioCtx)return;const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);if(type==='sfx_chop'){osc.type='square';osc.frequency.setValueAtTime(170,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(48,audioCtx.currentTime+.1);gain.gain.setValueAtTime(.16,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);osc.start();osc.stop(audioCtx.currentTime+.1)}else if(type==='sfx_warning'||type==='sfx_fail'){osc.type='triangle';osc.frequency.setValueAtTime(220,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(88,audioCtx.currentTime+.18);gain.gain.setValueAtTime(.16,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.2);osc.start();osc.stop(audioCtx.currentTime+.2)}else{osc.type='sine';osc.frequency.setValueAtTime(420,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(860,audioCtx.currentTime+.11);gain.gain.setValueAtTime(.14,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.18);osc.start();osc.stop(audioCtx.currentTime+.18)}}
function vibrate(type){if(window.webkit?.messageHandlers?.gamezoneBridge){window.webkit.messageHandlers.gamezoneBridge.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style:type}})}else if(navigator.vibrate)navigator.vibrate(type==='heavy'?200:50)}
function showFeedback(msg,tone='neutral'){const b=document.getElementById('feedback-banner');b.textContent=msg;b.style.borderColor=tone==='danger'?'rgba(86,245,255,.78)':tone==='success'?'rgba(115,255,155,.78)':'rgba(255,23,77,.72)';b.style.background=tone==='danger'?'rgba(8,9,18,.92)':tone==='success'?'rgba(17,68,39,.88)':'rgba(16,11,20,.88)';b.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>b.classList.remove('show'),900)}
function pulseReaction(id,duration=1100){const el=document.getElementById(id);if(!el)return;el.classList.add('show');clearTimeout(reactionTimers[id]);reactionTimers[id]=setTimeout(()=>el.classList.remove('show'),duration)}
class Particle{constructor(x,y,color){this.x=x;this.y=y;this.color=color;const a=rand()*Math.PI*2;const s=rand()*4+2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=1;this.decay=rand()*.03+.02;this.size=rand()*6+3;this.spin=rand()*6}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.2;this.spin+=.2;this.life-=this.decay}draw(c){c.save();c.globalAlpha=Math.max(0,this.life);c.translate(this.x,this.y);c.rotate(this.spin);c.fillStyle=this.color;c.fillRect(-this.size/2,-this.size/2,this.size,this.size*.6);c.restore()}}
class RivalMark{constructor(){this.r=35;this.x=rand()*(cw-this.r*2)+this.r;this.y=-this.r*2;this.type=rand()>.15?'food':'rotten';this.style=this.type==='food'?palette.good[Math.floor(rand()*palette.good.length)]:palette.bad;this.vy=gameConfig.baseSpeed*(1+rand()*.5)*difficultyMultiplier;this.rotation=rand()*Math.PI*2;this.rotSpeed=(rand()-.5)*.1;this.markedForDeletion=false;this.chopped=false}update(dt){this.y+=this.vy*(dt*60);this.rotation+=this.rotSpeed;if(this.y>ch+this.r){this.markedForDeletion=true;if(this.type==='food'&&!this.chopped)loseLife()}}draw(c){c.save();c.translate(this.x,this.y);c.rotate(this.rotation);c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(7,9,this.r*1.0,this.r*.75,0,0,Math.PI*2);c.fill();if(this.type==='food')drawGoodMark(c,this.r,this.style);else drawBadMark(c,this.r,this.style);c.restore()}checkTap(tx,ty){const dx=tx-this.x,dy=ty-this.y;return dx*dx+dy*dy<(this.r*1.5)**2}}
function drawGoodMark(c,r,s){c.lineJoin='round';c.lineCap='round';c.fillStyle=s.shell;c.strokeStyle='#050509';c.lineWidth=5;if(s.kind==='star'){star(c,0,0,r,5);c.fill();c.stroke();c.fillStyle=s.fill;c.beginPath();c.arc(0,0,r*.55,0,Math.PI*2);c.fill()}else if(s.kind==='spray'){c.beginPath();c.roundRect(-r*.65,-r*.75,r*1.3,r*1.5,12);c.fill();c.stroke();c.fillStyle=s.fill;c.fillRect(-r*.32,-r*.52,r*.64,r*.78);c.strokeRect(-r*.32,-r*.52,r*.64,r*.78)}else{c.beginPath();c.moveTo(-r*.9,-r*.35);c.quadraticCurveTo(0,-r*1.02,r*.9,-r*.35);c.lineTo(r*.58,r*.72);c.quadraticCurveTo(0,r*1.02,-r*.58,r*.72);c.closePath();c.fill();c.stroke();c.fillStyle=s.fill;c.beginPath();c.arc(0,0,r*.66,0,Math.PI*2);c.fill()}c.strokeStyle=s.accent;c.lineWidth=4;c.beginPath();c.moveTo(-r*.45,-r*.1);c.lineTo(r*.45,-r*.1);c.moveTo(-r*.28,r*.25);c.quadraticCurveTo(0,r*.43,r*.3,r*.25);c.stroke();c.fillStyle=s.garnish;c.beginPath();c.moveTo(r*.48,-r*.72);c.lineTo(r*.75,-r*.15);c.lineTo(r*.23,-r*.3);c.closePath();c.fill()}
function drawBadMark(c,r,s){c.fillStyle=s.shell;c.strokeStyle=s.accent;c.lineWidth=4;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();c.stroke();c.fillStyle=s.fill;c.beginPath();c.arc(0,0,r*.72,0,Math.PI*2);c.fill();c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.moveTo(-r*.42,-r*.3);c.lineTo(-r*.12,0);c.moveTo(-r*.12,-r*.3);c.lineTo(-r*.42,0);c.moveTo(r*.12,-r*.3);c.lineTo(r*.42,0);c.moveTo(r*.42,-r*.3);c.lineTo(r*.12,0);c.arc(0,r*.32,r*.28,Math.PI+.15,-.15);c.stroke();c.fillStyle=s.garnish;c.beginPath();c.arc(0,-r*.88,r*.13,0,Math.PI*2);c.fill()}
function star(c,x,y,r,pts){c.beginPath();for(let i=0;i<pts*2;i++){const a=-Math.PI/2+i*Math.PI/pts;const rr=i%2?r:r*.42;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function initGame(){rngSeed=1337;score=0;lives=3;comboStreak=0;entities=[];particles=[];spawnTimer=0;difficultyMultiplier=1;updateHUD();showFeedback('Tap the red rival marks!', 'neutral');setState('PLAYING');initAudio()}
function loseLife(){lives--;comboStreak=0;updateHUD();playSfx(lives<=1?'sfx_warning':'sfx_fail');showFeedback(lives<=1?'Last mask crack!':'Rival clipped you!', 'danger');pulseReaction('danger-gif',1250);vibrate('heavy');document.body.classList.add('shake-screen');setTimeout(()=>document.body.classList.remove('shake-screen'),500);if(lives<=0)setState('GAMEOVER')}
function addScore(v){score+=v;comboStreak++;difficultyMultiplier=1+(score/500);if(comboStreak>=3){showFeedback('Combo slash x'+comboStreak+'!', 'success');pulseReaction('combo-gif',1100)}else showFeedback('Tag cleaned!', 'success');updateHUD()}
function updateHUD(){document.getElementById('score-val').textContent=score;document.getElementById('lives-val').textContent=lives;document.getElementById('final-score').textContent=score}
function setState(s){gameState=s;const hud=document.getElementById('hud'),over=document.getElementById('game-over-screen'),entry=document.getElementById('entry-card');if(s==='PLAYING'){hud.classList.remove('opacity-0');over.classList.add('hidden');entry.style.opacity='0';entry.style.transform='translateY(-10px) rotate(-1deg)';setBgmForState('PLAYING')}else if(s==='GAMEOVER'){hud.classList.add('opacity-0');over.classList.remove('hidden');entry.style.opacity='1';entry.style.transform='rotate(-1deg)';showFeedback('Block lost — run it back.', 'danger');pulseReaction('danger-gif',1600);playSfx('sfx_fail');setBgmForState('GAMEOVER')}}
function spawnParticles(x,y,color,count=10){for(let i=0;i<count;i++)particles.push(new Particle(x,y,color))}
function resize(){const rect=canvas.getBoundingClientRect();cw=rect.width;ch=rect.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized){initialized=true;initGame();requestAnimationFrame(loop)}}
function update(dt){spawnTimer+=dt*1000;const rate=Math.max(300,gameConfig.spawnRate/difficultyMultiplier);if(spawnTimer>rate){entities.push(new RivalMark());spawnTimer=0}entities.forEach(e=>e.update(dt));entities=entities.filter(e=>!e.markedForDeletion);particles.forEach(p=>p.update(dt));particles=particles.filter(p=>p.life>0)}
function draw(){drawBackground(ctx);entities.forEach(e=>e.draw(ctx));particles.forEach(p=>p.draw(ctx))}
function drawBackground(c){const t=Date.now()/1000;const grad=c.createLinearGradient(0,0,0,ch);grad.addColorStop(0,'#07070d');grad.addColorStop(.48,'#17101e');grad.addColorStop(1,'#360a17');c.fillStyle=grad;c.fillRect(0,0,cw,ch);c.save();c.fillStyle='rgba(255,23,77,.16)';c.beginPath();c.ellipse(cw*.5,ch*.16,cw*.32,90+Math.sin(t)*10,0,0,Math.PI*2);c.fill();for(let i=0;i<7;i++){const bx=(i/6)*cw+Math.sin(t+i)*8;const bw=cw/8;const bh=ch*(.18+.08*((i*3)%5));c.fillStyle=i%2?'rgba(10,9,16,.92)':'rgba(17,13,22,.88)';c.fillRect(bx-bw/2,ch-bh,bw,bh);c.fillStyle='rgba(255,23,77,.18)';for(let y=ch-bh+24;y<ch-80;y+=38)c.fillRect(bx-bw/2+12,y,bw-24,5)}c.strokeStyle='rgba(86,245,255,.16)';c.lineWidth=2;const grid=64,off=(Date.now()/60)%grid;for(let y=off-grid;y<ch;y+=grid){c.beginPath();c.moveTo(0,y);c.lineTo(cw,y+ch*.12);c.stroke()}for(let x=-grid;x<cw+grid;x+=grid){c.beginPath();c.moveTo(x+Math.sin(t)*8,0);c.lineTo(x-80,ch);c.stroke()}drawRivalMural(c,t);const roofY=ch-72;const rg=c.createLinearGradient(0,roofY,0,ch);rg.addColorStop(0,'#20101a');rg.addColorStop(1,'#07060a');c.fillStyle=rg;c.fillRect(0,roofY,cw,ch-roofY);c.fillStyle='#ff174d';c.fillRect(0,roofY,cw,7);c.fillStyle='rgba(255,255,255,.08)';for(let x=24;x<cw;x+=88)c.fillRect(x,roofY+18,46,7);c.restore()}
function drawRivalMural(c,t){const x=cw*.5,y=ch*.33,scale=Math.min(cw,ch)/390;c.save();c.translate(x,y);c.scale(scale,scale);c.globalAlpha=.8;c.fillStyle='rgba(0,0,0,.42)';c.beginPath();c.moveTo(-90,-35);c.quadraticCurveTo(0,-115,90,-35);c.lineTo(55,90);c.quadraticCurveTo(0,126,-55,90);c.closePath();c.fill();c.strokeStyle='rgba(255,23,77,.82)';c.lineWidth=8;c.stroke();c.fillStyle='rgba(255,23,77,.92)';c.beginPath();c.moveTo(-72,-24);c.quadraticCurveTo(0,-82,72,-24);c.lineTo(43,58);c.quadraticCurveTo(0,82,-43,58);c.closePath();c.fill();c.fillStyle='#08070d';c.fillRect(-58,-9,116,26);c.fillStyle='#fff';c.beginPath();c.moveTo(-47,-6);c.lineTo(-10,0);c.lineTo(-47,8);c.moveTo(47,-6);c.lineTo(10,0);c.lineTo(47,8);c.fill();c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.beginPath();c.moveTo(-88,103+Math.sin(t*2)*4);c.quadraticCurveTo(0,128,88,103+Math.cos(t*2)*4);c.stroke();c.restore()}
function loop(ts){try{if(!lastTime)lastTime=ts;const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;if(gameState==='PLAYING')update(dt);draw();requestAnimationFrame(loop)}catch(e){console.error('Loop Error:',e);lastTime=ts;requestAnimationFrame(loop)}}
function handleGlobalInput(e){unlockAudio();if(gameState==='GAMEOVER')return;if(gameState==='PLAYING'){const rect=canvas.getBoundingClientRect();const tx=e.clientX-rect.left,ty=e.clientY-rect.top;let hit=false;for(let i=entities.length-1;i>=0;i--){const ent=entities[i];if(ent.checkTap(tx,ty)){hit=true;if(ent.type==='food'){ent.chopped=true;playSfx('sfx_chop');playSfx('sfx_score');vibrate('light');spawnParticles(ent.x,ent.y,ent.style.shell);addScore(10);ent.markedForDeletion=true}else{playSfx('sfx_fail');loseLife();spawnParticles(ent.x,ent.y,'#56f5ff',20);ent.markedForDeletion=true}break}}if(!hit){playSfx('sfx_warning');comboStreak=0;showFeedback('Air slash! Find the mark.', 'danger');pulseReaction('danger-gif',900);spawnParticles(tx,ty,'rgba(255,23,77,.35)',3)}}}
window.__gameQA={state:()=>({gameState,score,lives,entityCount:entities.length,firstGood:entities.find(e=>e.type==='food')?{x:entities.find(e=>e.type==='food').x,y:entities.find(e=>e.type==='food').y}:null,firstBad:entities.find(e=>e.type==='rotten')?{x:entities.find(e=>e.type==='rotten').x,y:entities.find(e=>e.type==='rotten').y}:null}),forceLifeLoss:loseLife};
window.addEventListener('DOMContentLoaded',()=>{const ro=new ResizeObserver(()=>resize());ro.observe(canvas);window.addEventListener('pointerdown',e=>{if(e.target===canvas)e.preventDefault();handleGlobalInput(e)},{passive:false});document.getElementById('restart-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();playSfx('sfx_ui');initGame()})});
</script>
