<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neon Lane Courier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title/ui -> Orbitron + Rajdhani from catalogs/fonts.json -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050816;
            --bg-deep: #0a1030;
            --panel-bg: rgba(10, 16, 40, 0.72);
            --panel-border: rgba(106, 227, 255, 0.24);
            --panel-highlight: rgba(255, 255, 255, 0.08);
            --cyan-400: #5ce1ff;
            --cyan-500: #1cc7f4;
            --cyan-300: #b0f5ff;
            --slate-900: #09111f;
            --slate-300: #d6e6ff;
            --red-500: #ff5f6d;
            --yellow-400: #ffd95e;
            --white: #ffffff;
            --gray-200: #e5f3ff;
            --magenta-400: #ff78f2;
            --lane-glow: rgba(92, 225, 255, 0.26);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Rajdhani', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(28, 199, 244, 0.16), transparent 35%),
                radial-gradient(circle at 80% 20%, rgba(255, 120, 242, 0.14), transparent 22%),
                linear-gradient(180deg, var(--bg-deep), var(--bg));
            background-color: var(--bg);
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-6 { top: 1.5rem; }
        .left-6 { left: 1.5rem; }
        .w-full { width: 100%; }
        .h-full { width: 100vw; height: 100vh; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .text-center { text-align: center; }
        .transform { transform: translateZ(0); }
        .transition { transition: all 0.25s ease; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .duration-300 { transition-duration: 0.3s; }
        .active\:scale-95:active { transform: scale(0.95); }
        .p-10 { padding: 2.5rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-5xl { font-size: clamp(2.5rem, 8vw, 3rem); }
        .text-6xl { font-size: clamp(3rem, 10vw, 4rem); }
        .font-light { font-weight: 400; }
        .font-bold { font-weight: 700; }
        .tracking-wider { letter-spacing: 0.08em; }
        .drop-shadow-md { text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35); }
        .text-cyan-400 { color: var(--cyan-400); }
        .text-slate-300 { color: var(--slate-300); }
        .text-slate-900 { color: var(--slate-900); }
        .text-red-500 { color: var(--red-500); }
        .text-yellow-400 { color: var(--yellow-400); }
        .text-white { color: var(--white); }
        .bg-cyan-500 { background: var(--cyan-500); }
        .bg-white { background: var(--white); }
        .hover\:bg-cyan-400:hover { background: var(--cyan-400); }
        .hover\:bg-gray-200:hover { background: var(--gray-200); }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .shadow-\[0_0_20px_rgba\(34\,211\,238\,0\.6\)\] { box-shadow: 0 0 20px rgba(34, 211, 238, 0.6); }
        .shadow-lg { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
        button {
            border: 0;
            cursor: pointer;
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.04em;
        }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 35%),
                var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 24px rgba(28, 199, 244, 0.14);
        }
        .neon-text {
            font-family: 'Orbitron', system-ui, sans-serif;
            text-shadow: 0 0 10px rgba(92, 225, 255, 0.9), 0 0 24px rgba(255, 120, 242, 0.35);
        }
        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        #game-container::before {
            background:
                radial-gradient(circle at 20% 15%, rgba(92, 225, 255, 0.12), transparent 14rem),
                radial-gradient(circle at 80% 18%, rgba(255, 120, 242, 0.12), transparent 12rem);
        }
        #game-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 16%),
                repeating-linear-gradient(
                    180deg,
                    rgba(255,255,255,0.03) 0,
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px,
                    transparent 6px
                );
            mix-blend-mode: screen;
            opacity: 0.22;
        }
        #start-screen,
        #game-over-screen {
            position: relative;
            width: min(92vw, 28rem);
            overflow: hidden;
        }
        #start-screen::before,
        #game-over-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, rgba(92, 225, 255, 0.12), transparent 45%, rgba(255, 120, 242, 0.12));
            pointer-events: none;
        }
        #hud .text-white {
            font-family: 'Orbitron', system-ui, sans-serif;
            font-size: clamp(0.92rem, 3vw, 1.2rem);
            letter-spacing: 0.06em;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            background: rgba(6, 12, 32, 0.54);
            border: 1px solid rgba(92, 225, 255, 0.2);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        }
        .hud-label {
            color: #eefbff;
            opacity: 0.92;
        }
        .hud-emoji,
        .title-emoji {
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(255, 217, 94, 0.45));
        }
        .title-emoji {
            margin-right: 0.35rem;
        }
        .sub-copy {
            max-width: 22rem;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.35;
        }
        .feedback-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .feedback-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: min(40vw, 12rem);
            padding: 0.6rem 0.8rem;
            border-radius: 1rem;
            border: 1px solid rgba(92, 225, 255, 0.26);
            background: rgba(7, 13, 31, 0.78);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            font-family: 'Orbitron', system-ui, sans-serif;
            z-index: 4;
        }
        .feedback-badge.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .feedback-badge img {
            width: 3rem;
            height: 3rem;
            border-radius: 0.7rem;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .feedback-copy {
            color: var(--white);
            font-size: 0.88rem;
            line-height: 1.1;
            letter-spacing: 0.04em;
        }
        .feedback-copy small {
            display: block;
            color: var(--cyan-300);
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
        }
        .impact-flash {
            position: absolute;
            inset: auto 50% 18vh auto;
            width: clamp(5rem, 18vw, 7rem);
            aspect-ratio: 1;
            transform: translateX(50%) scale(0.65);
            opacity: 0;
            filter: drop-shadow(0 0 18px rgba(255, 95, 109, 0.5));
            transition: opacity 0.14s ease, transform 0.14s ease;
            z-index: 3;
        }
        .impact-flash.visible {
            opacity: 0.95;
            transform: translateX(50%) scale(1);
        }
        @media (max-width: 640px) {
            .p-10 { padding: 1.75rem; }
            .top-6 { top: 1rem; }
            .left-6 { left: 1rem; }
            .text-xl { font-size: 1rem; }
            .text-2xl { font-size: 1.2rem; }
            .px-10 { padding-left: 1.75rem; padding-right: 1.75rem; }
            .feedback-badge {
                top: auto;
                right: 0.8rem;
                bottom: 0.9rem;
                min-width: 10.5rem;
                max-width: calc(100vw - 1.6rem);
                padding: 0.55rem 0.7rem;
            }
            .impact-flash {
                right: 50%;
                bottom: 22vh;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
            
            <!-- Start Screen -->
            <div id="start-screen" class="glass-panel p-10 rounded-2xl text-center pointer-events-auto transform transition hover:scale-105 duration-300">
                <h1 class="text-6xl font-bold text-cyan-400 mb-4 neon-text tracking-wider"><span class="title-emoji" aria-hidden="true">🛸</span>NEON LANE COURIER</h1>
                <p class="text-slate-300 text-xl mb-8 font-light sub-copy">Guide the glow-run courier through freight lanes and keep the energy crate clear of incoming cargo blocks.</p>
                <button id="start-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.6)] transition transform active:scale-95">
                    START DELIVERY
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden glass-panel p-10 rounded-2xl text-center pointer-events-auto">
                <h2 class="text-5xl font-bold text-red-500 mb-4 drop-shadow-md"><span class="title-emoji" aria-hidden="true">💥</span>DELIVERY LOST</h2>
                <div class="text-2xl text-white mb-2">Packages Routed</div>
                <div class="text-6xl font-bold text-yellow-400 mb-8" id="finalScore">0</div>
                <button id="restart-btn" class="bg-white text-slate-900 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-200 transition transform active:scale-95">
                    RETRY SHIFT
                </button>
            </div>
            
            <!-- HUD -->
            <div id="hud" class="absolute top-6 left-6 hidden">
                <div class="text-white text-2xl font-bold drop-shadow-md">
                    <span class="hud-label"><span class="hud-emoji" aria-hidden="true">📦</span> ROUTED:</span> <span id="score" class="text-cyan-400">0</span>
                </div>
            </div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: score/fail feedback overlays -> catalogs/gifs.json -->
        <div class="feedback-layer" aria-hidden="true">
            <div id="feedback-badge" class="feedback-badge">
                <img id="feedback-gif" src="https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp" alt="">
                <div class="feedback-copy" id="feedback-copy">Courier ready<small>Tap to launch the run</small></div>
            </div>
            <img id="impact-flash" class="impact-flash" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
                ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_01.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3"
            },
            gifs: {
                reward: "https://i.giphy.com/Y4nmq4GOnLf4XIgALX.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp",
                impact: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlay = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    sample.volume = k === 'warning' ? 0.42 : 0.52;
                    this.sfx[k] = sample;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, minGap = 120) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (now - (this.lastPlay.get(key) || 0) < minGap) return;
                this.lastPlay.set(key, now);
                const clone = this.sfx[key].cloneNode();
                clone.volume = this.sfx[key].volume;
                clone.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.badge = document.getElementById('feedback-badge');
                this.gif = document.getElementById('feedback-gif');
                this.copy = document.getElementById('feedback-copy');
                this.impact = document.getElementById('impact-flash');
                this.badgeTimer = null;
                this.impactTimer = null;
            }

            showBadge(gifSrc, title, subtitle, duration = 1300) {
                this.gif.src = gifSrc;
                this.copy.innerHTML = `${title}<small>${subtitle}</small>`;
                this.badge.classList.add('visible');
                clearTimeout(this.badgeTimer);
                this.badgeTimer = setTimeout(() => {
                    this.badge.classList.remove('visible');
                }, duration);
            }

            showImpact(duration = 520) {
                this.impact.src = ASSETS.gifs.impact;
                this.impact.classList.add('visible');
                clearTimeout(this.impactTimer);
                this.impactTimer = setTimeout(() => {
                    this.impact.classList.remove('visible');
                }, duration);
            }

            reset() {
                this.badge.classList.remove('visible');
                this.impact.classList.remove('visible');
            }
        }
        
        const audio = new AudioController();
        const feedback = new FeedbackController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let gameSpeed = 5;
        
        // Player
        let player = {
            x: 0,
            y: 0,
            width: 50,
            height: 50,
            color: '#5ce1ff',
            trail: [],
            pulse: 0
        };

        // Input
        let inputX = 0;
        let isDragging = false;

        // Obstacles
        let obstacles = [];
        
        // Background Grid
        let gridOffsetY = 0;

        /** RESIZE HANDLER */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!gameActive) {
                player.x = width / 2 - player.width / 2;
                player.y = height - 150;
                inputX = width / 2;
            } else {
                player.y = height - 150;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        /** INPUT HANDLERS */
        function handleInputStart(e) {
            if (!gameActive) return;
            if (e.cancelable) e.preventDefault();
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            inputX = clientX;
        }

        function handleInputMove(e) {
            if (!gameActive || !isDragging) return;
            if (e.cancelable) e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            inputX = clientX;
        }

        function handleInputEnd() {
            isDragging = false;
        }

        // [agent-note][stage4] repaired: mobile-action-path | element: #gameCanvas | action: scope gesture suppression to play surface so menu buttons keep native tap/click behavior
        canvas.addEventListener('mousedown', handleInputStart);
        canvas.addEventListener('touchstart', handleInputStart, {passive: false});
        window.addEventListener('mousemove', handleInputMove);
        canvas.addEventListener('touchmove', handleInputMove, {passive: false});
        window.addEventListener('mouseup', handleInputEnd);
        window.addEventListener('touchend', handleInputEnd);
        window.addEventListener('touchcancel', handleInputEnd);

        /** 4. GAME LOGIC */
        function initGame() {
            score = 0;
            frames = 0;
            gameSpeed = 6;
            obstacles = [];
            player.x = width / 2 - player.width / 2;
            player.y = height - 150;
            player.trail = [];
            inputX = width / 2;
            gridOffsetY = 0;
            feedback.reset();
            document.getElementById('score').innerText = score;
        }

        function spawnObstacle() {
            const size = Math.random() * 40 + 40;
            const laneCount = 5;
            const laneWidth = width / laneCount;
            const lane = Math.floor(Math.random() * laneCount);
            const x = (lane * laneWidth) + (laneWidth / 2) - (size / 2);
            
            obstacles.push({
                x: x,
                y: -100,
                width: size,
                height: size,
                color: '#ff5f6d',
                passed: false
            });
        }

        function update() {
            if (frames % 600 === 0) {
                gameSpeed += 0.5;
                audio.playSFX('warning', 800);
            }

            const targetX = inputX - player.width / 2;
            const clampedTargetX = Math.max(0, Math.min(width - player.width, targetX));
            player.x += (clampedTargetX - player.x) * 0.15;

            if (frames % 3 === 0) {
                player.trail.push({x: player.x, y: player.y, alpha: 0.6});
                if (player.trail.length > 8) player.trail.shift();
            }
            player.pulse += 0.14;

            gridOffsetY = (gridOffsetY + gameSpeed) % 100;

            const spawnRate = Math.max(20, 60 - Math.floor(gameSpeed * 2));
            if (frames % spawnRate === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                    return;
                }

                if (!obs.passed && obs.y > player.y + player.height) {
                    obs.passed = true;
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX(score % 10 === 0 ? 'bonus' : 'score', score % 10 === 0 ? 180 : 90);

                    if (score % 10 === 0) {
                        feedback.showBadge(ASSETS.gifs.reward, 'Checkpoint Crate!', `Routed ${score} packages cleanly`, 1500);
                    } else if (score <= 3) {
                        feedback.showBadge(ASSETS.gifs.reward, 'Lane Locked', 'Clean dodge. Keep the flow moving.', 900);
                    }
                }

                if (obs.y > height) {
                    obstacles.splice(i, 1);
                }
            }
            
            frames++;
        }

        function draw() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#0a1030');
            bgGradient.addColorStop(1, '#050816');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            const skylineGlow = ctx.createRadialGradient(width * 0.5, height * 0.18, 20, width * 0.5, height * 0.18, width * 0.55);
            skylineGlow.addColorStop(0, 'rgba(92, 225, 255, 0.12)');
            skylineGlow.addColorStop(1, 'rgba(92, 225, 255, 0)');
            ctx.fillStyle = skylineGlow;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(92, 225, 255, 0.14)';
            ctx.lineWidth = 2;

            const laneWidth = width / 5;
            for (let i = 0; i <= 5; i++) {
                const x = i * laneWidth;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();

                if (i < 5) {
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 120, 242, 0.03)' : 'rgba(92, 225, 255, 0.025)';
                    ctx.fillRect(x, 0, laneWidth, height);
                }
            }

            for (let y = gridOffsetY - 100; y < height; y += 100) {
                ctx.strokeStyle = y % 200 === 0 ? 'rgba(255, 120, 242, 0.18)' : 'rgba(92, 225, 255, 0.12)';
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            for (let i = 0; i < 5; i++) {
                const beaconX = i * laneWidth + laneWidth / 2;
                const beaconY = (gridOffsetY * 0.8 + i * 120) % (height + 120) - 120;
                ctx.fillStyle = 'rgba(255, 217, 94, 0.22)';
                ctx.beginPath();
                ctx.arc(beaconX, beaconY, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            player.trail.forEach(t => {
                ctx.fillStyle = `rgba(92, 225, 255, ${t.alpha})`;
                ctx.fillRect(t.x + 6, t.y + 10, player.width - 12, player.height - 20);
                t.alpha -= 0.05;
            });

            const bob = Math.sin(player.pulse) * 2;
            const px = player.x;
            const py = player.y + bob;
            const pw = player.width;
            const ph = player.height;

            ctx.save();
            ctx.shadowBlur = 26;
            ctx.shadowColor = '#5ce1ff';

            ctx.fillStyle = 'rgba(92, 225, 255, 0.16)';
            ctx.beginPath();
            ctx.ellipse(px + pw / 2, py + ph * 0.72, pw * 0.5, ph * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(px + 5, py + 12, pw - 10, ph - 18, 14);
            ctx.fill();

            const canopy = ctx.createLinearGradient(px, py + 6, px + pw, py + ph * 0.55);
            canopy.addColorStop(0, '#f9feff');
            canopy.addColorStop(1, '#9ae8ff');
            ctx.fillStyle = canopy;
            ctx.beginPath();
            ctx.roundRect(px + 10, py + 6, pw - 20, ph * 0.42, 12);
            ctx.fill();

            ctx.fillStyle = '#08233f';
            ctx.beginPath();
            ctx.arc(px + pw * 0.38, py + ph * 0.27, 2.5, 0, Math.PI * 2);
            ctx.arc(px + pw * 0.62, py + ph * 0.27, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#08233f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(px + pw / 2, py + ph * 0.33, 8, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();

            ctx.fillStyle = '#ffd95e';
            ctx.beginPath();
            ctx.roundRect(px + pw * 0.34, py + ph * 0.62, pw * 0.32, ph * 0.14, 6);
            ctx.fill();
            ctx.restore();

            obstacles.forEach(obs => {
                ctx.save();
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff5f6d';
                ctx.fillStyle = obs.color;
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 10);
                ctx.fill();

                ctx.fillStyle = '#ffc1c7';
                ctx.beginPath();
                ctx.roundRect(obs.x + 5, obs.y + 5, obs.width - 10, obs.height * 0.26, 8);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 217, 94, 0.8)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(obs.x + 8, obs.y + obs.height - 12);
                ctx.lineTo(obs.x + obs.width - 8, obs.y + 12);
                ctx.stroke();
                ctx.restore();
            });
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            if (gameActive) {
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        function startRun() {
            audio.unlock();
            audio.playBGM();
            audio.playSFX('start', 0);
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameActive = true;
            initGame();
            feedback.showBadge(ASSETS.gifs.reward, 'Courier Online', 'Arcade loop synced. Dodge incoming freight.', 1200);
            gameLoop();
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0);
            feedback.showImpact();
            feedback.showBadge(ASSETS.gifs.fail, 'Courier Down', `Shift ended at ${score} routed packages`, 1800);
            
            canvas.style.transform = "translate(5px, 5px)";
            setTimeout(() => canvas.style.transform = "translate(-5px, -5px)", 50);
            setTimeout(() => canvas.style.transform = "translate(0, 0)", 100);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 5. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.playSFX('ui', 0);
            startRun();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('ui', 0);
            startRun();
        });
    });
    </script>
</body>
</html>
