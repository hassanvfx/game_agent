<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Digital Circus Card Duel</title>
    <!-- [agent-note][stage4] resolved-font: title=Audiowide, ui=Exo 2 -> catalogs/fonts.json approved URLs -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-top: #130826;
            --bg-bottom: #2c0d43;
            --panel: rgba(16, 10, 36, 0.84);
            --panel-border: #8df6ff;
            --panel-shadow: rgba(0, 0, 0, 0.35);
            --ring-gold: #ffe45e;
            --spotlight-pink: #ff4f8d;
            --spark-cyan: #5cf3ff;
            --hazard-violet: #904dff;
            --text-main: #f6fbff;
            --text-dark: #1b1331;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #462169 0%, #1d0c34 38%, #090312 100%);
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
            color: var(--text-main);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            user-select: none;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 228, 94, 0.28), transparent 32%),
                radial-gradient(circle at 15% 20%, rgba(255, 79, 141, 0.12), transparent 24%),
                radial-gradient(circle at 85% 78%, rgba(92, 243, 255, 0.14), transparent 26%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 100%),
                linear-gradient(rgba(255,255,255,0.03) 0 2px, transparent 2px 100%);
            background-size: 56px 56px;
            opacity: 0.28;
            mix-blend-mode: screen;
        }

        #game-container::after {
            inset: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            box-shadow:
                0 0 0 1px rgba(92, 243, 255, 0.18),
                inset 0 0 36px rgba(255, 255, 255, 0.04);
        }

        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        #ui-layer.pointer-events-none {
            pointer-events: none;
        }

        #hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        #feedback-layer {
            position: absolute;
            inset: auto 0 1rem 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        #feedback-badge {
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(11, 8, 24, 0.78);
            border: 2px solid rgba(255, 228, 94, 0.5);
            color: var(--ring-gold);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        }

        #reaction-gif {
            width: min(34vw, 130px);
            max-height: 96px;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.28);
            background: rgba(7, 4, 18, 0.72);
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .font-display {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
        }

        .memphis-border {
            border: 3px solid rgba(6, 4, 16, 0.92);
            box-shadow:
                0 12px 24px var(--panel-shadow),
                0 0 0 2px rgba(255, 228, 94, 0.2);
        }

        #dialogue-box {
            margin-top: max(0.35rem, env(safe-area-inset-top));
            max-width: min(82%, 34rem);
            background:
                linear-gradient(180deg, rgba(37, 24, 73, 0.96), rgba(15, 11, 32, 0.92));
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 1.1rem;
            position: relative;
            text-align: center;
            pointer-events: auto;
            box-shadow:
                0 16px 36px rgba(0, 0, 0, 0.28),
                0 0 28px rgba(92, 243, 255, 0.16);
            transition: transform 0.1s ease-in-out, box-shadow 0.2s ease;
            backdrop-filter: blur(8px);
        }

        #dialogue-box::before {
            content: "★ SHOWTIME";
            display: inline-block;
            margin-bottom: 0.35rem;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--ring-gold), #fff0a8);
            color: var(--text-dark);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
        }

        #dialogue-text {
            margin: 0;
            font-weight: 700;
            font-size: 0.88rem;
            line-height: 1.35;
            text-shadow: 0 0 10px rgba(92, 243, 255, 0.12);
        }

        .caine-counter {
            margin-top: 6rem;
            background:
                linear-gradient(180deg, rgba(23, 18, 44, 0.95), rgba(9, 7, 21, 0.95));
            color: var(--text-main);
            padding: 0.42rem 0.9rem;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.72);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            letter-spacing: 0.08em;
            font-size: 0.88rem;
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.28),
                0 0 18px rgba(255, 79, 141, 0.18);
            text-align: center;
        }

        .game-over-card {
            background:
                linear-gradient(180deg, rgba(30, 18, 60, 0.96), rgba(11, 8, 24, 0.96));
            padding: 1.4rem;
            border-radius: 1.1rem;
            max-width: min(82%, 24rem);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            box-shadow:
                0 18px 44px rgba(0,0,0,0.35),
                0 0 34px rgba(92, 243, 255, 0.12);
        }

        #end-title {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 7vw, 3rem);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            color: var(--ring-gold);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow:
                0 3px 0 rgba(0,0,0,0.8),
                0 0 16px rgba(255, 228, 94, 0.28);
        }

        #end-desc {
            margin: 0 0 1.2rem;
            color: rgba(246, 251, 255, 0.9);
            font-weight: 700;
            font-size: 0.98rem;
            line-height: 1.45;
        }

        #restart-btn {
            background: linear-gradient(180deg, var(--spark-cyan), #27b7ff);
            color: var(--text-dark);
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 1.45rem;
            padding: 0.8rem 1.6rem;
            border-radius: 0.85rem;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease, filter 0.15s ease;
            min-width: min(100%, 15rem);
            touch-action: manipulation;
        }

        #restart-btn:hover {
            background: linear-gradient(180deg, #fff08f, #ffd84b);
            filter: brightness(1.05);
        }

        #restart-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .dialogue-tail {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(15, 11, 32, 0.96);
            z-index: 10;
        }

        .dialogue-tail-border {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 14px solid rgba(6, 4, 16, 0.92);
            z-index: 9;
        }

        #restart-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        .shake {
            animation: shake 0.3s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @media (max-width: 480px) {
            #dialogue-box {
                max-width: calc(100% - 1rem);
                padding: 0.7rem 0.85rem;
            }

            .caine-counter {
                margin-top: 5.35rem;
                padding-inline: 0.7rem;
            }

            .game-over-card {
                max-width: calc(100% - 1.25rem);
                padding: 1.2rem;
            }

            #reaction-gif {
                width: min(44vw, 120px);
            }
        }

        @media (min-width: 768px) {
            #dialogue-box {
                margin-top: 0.55rem;
            }

            #dialogue-text {
                font-size: 1rem;
            }

            .caine-counter {
                font-size: 0.96rem;
            }
        }
    </style>
    <script id="game-config" type="application/x-game-config">
    {
        "startingCards": { "type": "number", "label": "Starting Cards", "value": 5, "min": 3, "max": 7 },
        "themeColor": { "type": "color", "label": "Theme Color", "value": "#FFE600" },
        "gameSpeed": { "type": "number", "label": "Animation Speed", "value": 8, "min": 1, "max": 12 }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="pointer-events-none">
            <div id="feedback-layer" aria-live="polite">
                <!-- [agent-note][stage3] resolved-gif: win/fail reactions -> catalogs/gifs.json -->
                <div id="feedback-badge" class="font-display hidden">SHOWTIME</div>
                <img
                    id="reaction-gif"
                    class="hidden"
                    alt="Round reaction"
                    src="https://i.giphy.com/roB5nN2qNNfhUKcprN.webp"
                >
            </div>
            <div id="hud">
                <div id="dialogue-box" class="memphis-border">
                    <p id="dialogue-text">Match the color or number to outplay the ringmaster.</p>
                    <div class="dialogue-tail"></div>
                    <div class="dialogue-tail-border"></div>
                </div>

                <div class="caine-counter">
                    RINGMASTER: <span id="caine-count">0</span> CARDS
                </div>
            </div>

            <div id="game-over-screen" class="hidden">
                <div class="game-over-card memphis-border">
                    <h2 id="end-title">DUEL OVER</h2>
                    <p id="end-desc">The spotlight moves to the next round.</p>
                    <button id="restart-btn" class="memphis-border">PLAY AGAIN</button>
                </div>
            </div>
        </div>
    </div>

    <!-- [agent-note][stage3] resolved-audio: bgm+sfx mapped through catalogs/audios.json -->
    <audio id="bgm_main" data-editable="audio" data-label="Gameplay BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="auto" loop></audio>
    <audio id="bgm_victory" data-editable="audio" data-label="Victory BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_02.mp3" preload="auto"></audio>
    <audio id="bgm_defeat" data-editable="audio" data-label="Defeat BGM" src="https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3" preload="auto"></audio>

    <audio id="sfx_play" data-editable="audio" data-label="Card Match SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/success_02.mp3" preload="auto"></audio>
    <audio id="sfx_draw" data-editable="audio" data-label="Draw Card SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3" preload="auto"></audio>
    <audio id="sfx_invalid" data-editable="audio" data-label="Invalid Play SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
    <audio id="sfx_restart" data-editable="audio" data-label="Restart Button SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3" preload="auto"></audio>
    <audio id="sfx_win" data-editable="audio" data-label="Win Cue SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
    <audio id="sfx_lose" data-editable="audio" data-label="Lose Cue SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>

    <script>
        // --- Configuration & Initialization ---
        window.gameConfigDefs = {};
        window.gameConfig = {};

        function parseConfig() {
            try {
                const script = document.getElementById('game-config');
                if (script) {
                    window.gameConfigDefs = JSON.parse(script.textContent);
                    for (const key in window.gameConfigDefs) {
                        window.gameConfig[key] = window.gameConfigDefs[key].value;
                    }
                }
            } catch (e) { console.error("Config parse error", e); }
        }

        window.updateGameConfig = (key, val) => {
            if (window.gameConfigDefs[key]) {
                if (window.gameConfigDefs[key].type === 'number') val = Number(val);
                window.gameConfig[key] = val;
            }
        };

        // --- Core System Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
        let initialized = false;
        let lastTime = 0;

        // --- Game State ---
        let gameState = 'INIT'; // INIT, PLAYING, GAMEOVER
        let turnState = 'PLAYER'; // PLAYER, RINGMASTER, ANIMATING
        let deck = [];
        let playerHand = [];
        let caineHand = [];
        let discardPile = [];
        let currentBet = "";
        let actionTimer = 0;
        let screenShakeTime = 0;

        const COLORS = ['#FF3366', '#33CCFF', '#33FF99', '#FFFF33'];
        const BETS = [
            "front-row bragging rights", "a backstage snack pass", "a chrome confetti badge",
            "a spotlight coupon", "a glowing ticket stub", "a neon foam crown",
            "one mystery prize from the prop cart"
        ];

        // --- Audio System ---
        let audioCtx = null;
        let audioUnlocked = false;
        const bgmMain = document.getElementById('bgm_main');
        const bgmVictory = document.getElementById('bgm_victory');
        const bgmDefeat = document.getElementById('bgm_defeat');
        const audioPlayers = {
            play: document.getElementById('sfx_play'),
            draw: document.getElementById('sfx_draw'),
            invalid: document.getElementById('sfx_invalid'),
            restart: document.getElementById('sfx_restart'),
            win: document.getElementById('sfx_win'),
            lose: document.getElementById('sfx_lose')
        };
        const sfxCooldowns = new Map();
        const reactionGif = document.getElementById('reaction-gif');
        const feedbackBadge = document.getElementById('feedback-badge');
        const GIFS = {
            impact: 'https://i.giphy.com/roB5nN2qNNfhUKcprN.webp',
            win: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp',
            fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
        };

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function setAudioLevels() {
            bgmMain.volume = 0.2;
            bgmVictory.volume = 0.2;
            bgmDefeat.volume = 0.2;
            Object.values(audioPlayers).forEach(player => {
                player.volume = 0.55;
            });
            audioPlayers.invalid.volume = 0.45;
            audioPlayers.restart.volume = 0.4;
        }

        function stopAllMusic() {
            [bgmMain, bgmVictory, bgmDefeat].forEach(track => {
                track.pause();
                track.currentTime = 0;
            });
        }

        function playLoop(track) {
            if (!audioUnlocked || !track) return;
            [bgmMain, bgmVictory, bgmDefeat].forEach(candidate => {
                if (candidate !== track) {
                    candidate.pause();
                    candidate.currentTime = 0;
                }
            });
            track.play().catch(() => {});
        }

        function playCatalogSfx(type, cooldown = 90) {
            if (!audioUnlocked) return;
            const now = performance.now();
            const previous = sfxCooldowns.get(type) || 0;
            if (now - previous < cooldown) return;
            const player = audioPlayers[type];
            if (!player) return;
            sfxCooldowns.set(type, now);
            try {
                player.pause();
                player.currentTime = 0;
                player.play().catch(() => {});
            } catch (e) {}
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            setAudioLevels();
            audioUnlocked = true;
            playLoop(bgmMain);
        }

        function showReaction(kind, label) {
            if (!reactionGif || !feedbackBadge) return;
            const gifSrc = GIFS[kind];
            if (gifSrc) {
                reactionGif.src = gifSrc;
            }
            reactionGif.classList.remove('hidden');
            feedbackBadge.textContent = label;
            feedbackBadge.classList.remove('hidden');

            clearTimeout(showReaction.hideTimer);
            showReaction.hideTimer = setTimeout(() => {
                reactionGif.classList.add('hidden');
                feedbackBadge.classList.add('hidden');
            }, kind === 'impact' ? 900 : 2200);
        }

        function vibrate(style = 'light') {
            try {
                window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
                    action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
                    params: { style: style }
                });
            } catch (e) {}
        }

        // --- UI System ---
        function setState(newState) {
            gameState = newState;
            const uiLayer = document.getElementById('ui-layer');
            const hud = document.getElementById('hud');
            const gameOverScreen = document.getElementById('game-over-screen');

            if (gameState === 'PLAYING') {
                hud.classList.remove('hidden');
                gameOverScreen.classList.add('hidden');
                uiLayer.classList.add('pointer-events-none');
            } else if (gameState === 'GAMEOVER') {
                hud.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                uiLayer.classList.remove('pointer-events-none');
            }
        }

        function updateDialogue(text) {
            document.getElementById('dialogue-text').innerText = text;
        }

        function updateCaineCount() {
            document.getElementById('caine-count').innerText = caineHand.length;
        }

        function triggerShake() {
            screenShakeTime = 0.3;
            const box = document.getElementById('dialogue-box');
            box.classList.remove('shake');
            void box.offsetWidth;
            box.classList.add('shake');
        }

        // --- Game Logic ---
        class Card {
            constructor(color, value) {
                this.color = color;
                this.value = value;
                this.x = cw / 2;
                this.y = ch / 2;
                this.targetX = this.x;
                this.targetY = this.y;
                this.isFaceUp = false;
                this.scale = 1;
                this.width = 0;
                this.height = 0;
            }

            updateSize() {
                this.width = Math.min(cw * 0.18, 80);
                this.height = this.width * 1.5;
            }

            draw() {
                this.updateSize();
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.roundRect(4, 4, this.width, this.height, 8);
                ctx.fill();

                ctx.fillStyle = this.isFaceUp ? '#FFF' : '#222';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(0, 0, this.width, this.height, 8);
                ctx.fill();
                ctx.stroke();

                if (this.isFaceUp) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.roundRect(4, 4, this.width - 8, this.height - 8, 4);
                    ctx.fill();

                    ctx.fillStyle = '#FFF8DA';
                    ctx.beginPath();
                    ctx.ellipse(this.width / 2, this.height / 2, this.width * 0.35, this.height * 0.25, -Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = this.color;
                    ctx.font = `bold ${this.width * 0.6}px Audiowide`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.value, this.width / 2, this.height / 2 + 2);

                    ctx.font = `bold ${this.width * 0.23}px "Exo 2"`;
                    ctx.fillStyle = '#FFF';
                    ctx.fillText(this.value, 12, 14);

                    ctx.save();
                    ctx.translate(this.width - 12, this.height - 14);
                    ctx.rotate(Math.PI);
                    ctx.fillText(this.value, 0, 0);
                    ctx.restore();
                } else {
                    const backGradient = ctx.createLinearGradient(0, 0, this.width, this.height);
                    backGradient.addColorStop(0, '#ff4f8d');
                    backGradient.addColorStop(1, '#6e32ff');
                    ctx.fillStyle = backGradient;
                    ctx.beginPath();
                    ctx.roundRect(4, 4, this.width - 8, this.height - 8, 4);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(8, 8, this.width - 16, this.height - 16, 4);
                    ctx.stroke();

                    ctx.fillStyle = '#FFF8DA';
                    ctx.font = `bold ${this.width * 0.3}px Audiowide`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("DUEL", this.width / 2, this.height / 2);

                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(this.width * 0.3, this.height * 0.28, this.width * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            contains(px, py) {
                return px >= this.x && px <= this.x + this.width &&
                       py >= this.y && py <= this.y + this.height;
            }
        }

        function createDeck() {
            deck = [];
            for (let color of COLORS) {
                for (let i = 1; i <= 9; i++) {
                    deck.push(new Card(color, i));
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            deck.forEach(c => {
                c.x = cw / 2 - c.width / 2;
                c.y = ch / 2 - c.height / 2;
                c.isFaceUp = false;
            });
        }

        function positionHands() {
            const margin = 10;
            const pWidth = playerHand.length > 0 ? playerHand[0].width : 60;
            const pHeight = playerHand.length > 0 ? playerHand[0].height : 90;
            const startX = Math.max(margin, cw / 2 - (playerHand.length * pWidth * 0.6) / 2);

            playerHand.forEach((card, i) => {
                card.targetX = startX + i * (pWidth * 0.6);
                card.targetY = ch - pHeight - margin - 20;
                card.isFaceUp = true;
            });

            caineHand.forEach((card, i) => {
                card.targetX = cw / 2 - pWidth / 2 + (i * 2);
                card.targetY = 120;
                card.isFaceUp = false;
            });

            discardPile.forEach((card) => {
                card.targetX = cw / 2 - pWidth / 2 + 40;
                card.targetY = ch / 2 - pHeight / 2;
                card.isFaceUp = true;
            });

            deck.forEach((card, i) => {
                card.targetX = cw / 2 - pWidth / 2 - 40;
                card.targetY = ch / 2 - pHeight / 2 - (i * 0.5);
                card.isFaceUp = false;
            });
        }

        function isValidPlay(card) {
            if (discardPile.length === 0) return true;
            const topCard = discardPile[discardPile.length - 1];
            return card.color === topCard.color || card.value === topCard.value;
        }

        function playCard(cardIndex, isPlayer) {
            const hand = isPlayer ? playerHand : caineHand;
            const card = hand.splice(cardIndex, 1)[0];
            discardPile.push(card);
            playCatalogSfx(isPlayer ? 'play' : 'draw', isPlayer ? 120 : 180);
            if (isPlayer) showReaction('impact', 'MATCH!');
            vibrate('light');

            if (isPlayer) {
                updateDialogue("Clean play. Keep the combo going.");
            } else {
                updateDialogue("The ringmaster steals the beat!");
            }

            positionHands();
            updateCaineCount();
            checkWinCondition();
        }

        function drawCard(isPlayer) {
            if (deck.length === 0) {
                if (discardPile.length > 1) {
                    const top = discardPile.pop();
                    deck = discardPile;
                    discardPile = [top];
                    deck.forEach(c => c.isFaceUp = false);
                    for (let i = deck.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [deck[i], deck[j]] = [deck[j], deck[i]];
                    }
                    updateDialogue("Deck reset. The crowd wants more.");
                    showReaction('impact', 'RESHUFFLE');
                } else {
                    updateDialogue("No cards left in the stack!");
                    return false;
                }
            }

            const card = deck.pop();
            if (isPlayer) {
                playerHand.push(card);
            } else {
                caineHand.push(card);
            }
            playCatalogSfx('draw', 120);
            positionHands();
            updateCaineCount();
            return true;
        }

        function checkWinCondition() {
            if (playerHand.length === 0) {
                turnState = 'ANIMATING';
                updateDialogue(`Showstopper! You win ${currentBet}.`);
                setTimeout(() => endGame(true), 2000);
            } else if (caineHand.length === 0) {
                turnState = 'ANIMATING';
                updateDialogue("House win. The ringmaster keeps the spotlight.");
                setTimeout(() => endGame(false), 2000);
            } else {
                turnState = turnState === 'PLAYER' ? 'CAINE' : 'PLAYER';
                if (turnState === 'CAINE') {
                    actionTimer = 1.0;
                    updateDialogue("Ringmaster is choosing a card...");
                } else {
                    updateDialogue("Your turn. Match color or number.");
                }
            }
        }

        function caineTurn() {
            let validIdx = -1;
            for (let i = 0; i < caineHand.length; i++) {
                if (isValidPlay(caineHand[i])) {
                    validIdx = i;
                    break;
                }
            }

            if (validIdx !== -1) {
                playCard(validIdx, false);
            } else {
                updateDialogue("Ringmaster draws a card.");
                drawCard(false);
                turnState = 'PLAYER';
                updateDialogue("Your turn. Match color or number.");
            }
        }

        function endGame(playerWon) {
            setState('GAMEOVER');
            stopAllMusic();
            if (playerWon) {
                document.getElementById('end-title').innerText = "YOU STOLE THE SHOW!";
                document.getElementById('end-desc').innerText = `Prize claimed: ${currentBet}`;
                playCatalogSfx('win', 0);
                playLoop(bgmVictory);
                showReaction('win', 'YOU WIN!');
                vibrate('heavy');
            } else {
                document.getElementById('end-title').innerText = "RINGMASTER WINS!";
                document.getElementById('end-desc').innerText = "The act ends. Tap play again for a rematch.";
                playCatalogSfx('lose', 0);
                playLoop(bgmDefeat);
                showReaction('fail', 'ROUGH ROUND');
                vibrate('heavy');
            }
        }

        function initGame() {
            parseConfig();
            createDeck();
            playerHand = [];
            caineHand = [];
            discardPile = [];

            const startCount = window.gameConfig.startingCards || 5;
            for (let i = 0; i < startCount; i++) {
                drawCard(true);
                drawCard(false);
            }

            let firstCard = deck.pop();
            firstCard.isFaceUp = true;
            discardPile.push(firstCard);

            currentBet = BETS[Math.floor(Math.random() * BETS.length)];
            updateDialogue(`Opening deal: match color or number before the ringmaster does.`);
            updateCaineCount();

            positionHands();

            turnState = 'PLAYER';
            setState('PLAYING');

            [...playerHand, ...caineHand, ...discardPile, ...deck].forEach(c => {
                c.x = cw / 2;
                c.y = ch / 2;
            });

            stopAllMusic();
            if (audioUnlocked) {
                playLoop(bgmMain);
                playCatalogSfx('restart', 0);
            }
        }

        function restartGame() {
            initGame();
        }

        // --- Input Handling ---
        function handleGlobalInput(e) {
            unlockAudio();
            if (gameState === 'GAMEOVER') return;
            if (gameState === 'PLAYING' && turnState === 'PLAYER') {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                for (let i = playerHand.length - 1; i >= 0; i--) {
                    if (playerHand[i].contains(x, y)) {
                        if (isValidPlay(playerHand[i])) {
                            playCard(i, true);
                        } else {
                            playCatalogSfx('invalid', 160);
                            showReaction('fail', 'NO MATCH');
                            triggerShake();
                            vibrate('heavy');
                            updateDialogue("That card does not match. Draw or try another.");
                        }
                        return;
                    }
                }

                if (deck.length > 0) {
                    const topDraw = deck[deck.length - 1];
                    if (topDraw.contains(x, y)) {
                        drawCard(true);
                        turnState = 'CAINE';
                        actionTimer = 1.0;
                        return;
                    }
                }
            }
        }

        window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
        document.getElementById('restart-btn').addEventListener('click', () => {
            unlockAudio();
            restartGame();
        });

        // --- Main Loop & Rendering ---
        function resize(entries) {
            for (let entry of entries) {
                const { width, height } = entry.contentRect;
                if (width === 0 || height === 0) continue;

                cw = width;
                ch = height;
                canvas.width = cw * dpr;
                canvas.height = ch * dpr;
                canvas.style.width = cw + 'px';
                canvas.style.height = ch + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (!initialized) {
                    initialized = true;
                    initGame();
                    requestAnimationFrame(gameLoop);
                } else {
                    positionHands();
                }
            }
        }

        const ro = new ResizeObserver(resize);

        function drawBackground() {
            const base = window.gameConfig.themeColor || '#FFE600';
            const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
            bgGradient.addColorStop(0, '#1b0c34');
            bgGradient.addColorStop(0.52, '#351255');
            bgGradient.addColorStop(1, '#090312');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, cw, ch);

            const spotlight = ctx.createRadialGradient(cw * 0.5, ch * 0.04, 10, cw * 0.5, ch * 0.04, ch * 0.75);
            spotlight.addColorStop(0, 'rgba(255,245,196,0.42)');
            spotlight.addColorStop(0.25, 'rgba(255,228,94,0.14)');
            spotlight.addColorStop(1, 'rgba(255,228,94,0)');
            ctx.fillStyle = spotlight;
            ctx.fillRect(0, 0, cw, ch);

            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            const dotSpacing = Math.max(30, Math.floor(cw / 10));
            for (let x = 0; x < cw; x += dotSpacing) {
                for (let y = 0; y < ch; y += dotSpacing) {
                    if ((x + y) % (dotSpacing * 2) === 0) {
                        ctx.beginPath();
                        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            ctx.strokeStyle = 'rgba(255, 79, 141, 0.55)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cw * 0.08, ch * 0.2);
            ctx.lineTo(cw * 0.2, ch * 0.3);
            ctx.lineTo(cw * 0.13, ch * 0.43);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(92, 243, 255, 0.65)';
            ctx.beginPath();
            ctx.arc(cw * 0.82, ch * 0.79, Math.min(cw, ch) * 0.055, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(18, 18, cw - 36, ch - 36);

            ctx.fillStyle = base;
            ctx.globalAlpha = 0.16;
            ctx.fillRect(cw * 0.12, ch * 0.62, cw * 0.18, 8);
            ctx.fillRect(cw * 0.7, ch * 0.18, cw * 0.14, 8);
            ctx.globalAlpha = 1;
        }

        function drawCaineAvatar() {
            const size = Math.min(cw * 0.25, 108);
            const ax = cw / 2;
            const ay = 60 + Math.sin(performance.now() / 320) * 2;

            ctx.save();
            ctx.translate(ax, ay);

            const halo = ctx.createRadialGradient(0, 0, size * 0.12, 0, 0, size * 0.8);
            halo.addColorStop(0, 'rgba(255,228,94,0.5)');
            halo.addColorStop(0.45, 'rgba(255,79,141,0.18)');
            halo.addColorStop(1, 'rgba(255,79,141,0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.82, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#09040f';
            ctx.beginPath();
            ctx.arc(0, 0, size / 2 + 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
            ctx.clip();

            const faceGradient = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
            faceGradient.addColorStop(0, '#ff8ab5');
            faceGradient.addColorStop(0.55, '#ff4f8d');
            faceGradient.addColorStop(1, '#cb2268');
            ctx.fillStyle = faceGradient;
            ctx.fillRect(-size / 2, -size / 2, size, size);

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.ellipse(-size * 0.12, -size * 0.28, size * 0.38, size * 0.18, -0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-size / 4, -size / 10, size / 5.4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size / 4, -size / 10, size / 5.4, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#08050f';
            ctx.beginPath(); ctx.arc(-size / 4, -size / 10, size / 10.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size / 4, -size / 10, size / 10.5, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#fff0b2';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, size * 0.08, size * 0.18, 0.15, Math.PI - 0.15);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.fillRect(-size / 3.1, size / 9, size * 0.62, size / 4.2);
            ctx.strokeStyle = '#08050f';
            ctx.lineWidth = 2;
            ctx.strokeRect(-size / 3.1, size / 9, size * 0.62, size / 4.2);
            ctx.beginPath();
            ctx.moveTo(0, size / 9);
            ctx.lineTo(0, size / 9 + size / 4.2);
            ctx.stroke();

            ctx.fillStyle = '#ffe45e';
            ctx.beginPath();
            ctx.moveTo(-size * 0.58, -size * 0.52);
            ctx.lineTo(-size * 0.22, -size * 0.66);
            ctx.lineTo(-size * 0.12, -size * 0.5);
            ctx.lineTo(-size * 0.44, -size * 0.34);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#5cf3ff';
            ctx.beginPath();
            ctx.moveTo(size * 0.58, -size * 0.52);
            ctx.lineTo(size * 0.22, -size * 0.66);
            ctx.lineTo(size * 0.12, -size * 0.5);
            ctx.lineTo(size * 0.44, -size * 0.34);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            try {
                const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
                lastTime = timestamp;

                let dx = 0, dy = 0;
                if (screenShakeTime > 0) {
                    screenShakeTime -= dt;
                    dx = (Math.random() - 0.5) * 10;
                    dy = (Math.random() - 0.5) * 10;
                }

                if (gameState === 'PLAYING' && turnState === 'CAINE') {
                    actionTimer -= dt;
                    if (actionTimer <= 0) {
                        caineTurn();
                    }
                }

                ctx.save();
                ctx.translate(dx, dy);

                drawBackground();
                drawCaineAvatar();

                const speed = window.gameConfig.gameSpeed || 8;
                const allCards = [...deck, ...discardPile, ...caineHand, ...playerHand];

                allCards.forEach(c => {
                    if (isFinite(c.x) && isFinite(c.y)) {
                        c.x += (c.targetX - c.x) * speed * dt;
                        c.y += (c.targetY - c.y) * speed * dt;
                    } else {
                        c.x = cw / 2;
                        c.y = ch / 2;
                    }
                    c.draw();
                });

                ctx.restore();
            } catch (e) {
                console.error("Loop error", e);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                [bgmMain, bgmVictory, bgmDefeat].forEach(track => track.pause());
            } else if (audioUnlocked && gameState === 'PLAYING') {
                playLoop(bgmMain);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            parseConfig();
            setAudioLevels();
            ro.observe(canvas);
        });
    </script>
</body>
