<head>

<title>Wilderness Survivor</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600&display=swap">
<style>

        --sky-top: #08141a;
        --sky-bottom: #16352d;
        --panel-bg: rgba(11, 28, 22, 0.78);
        --panel-border: rgba(141, 221, 165, 0.3);

        --text-main: #f4ffe9;
        --text-muted: #b7d0ba;
        --accent-sun: #ffd166;

        --accent-danger: #ff6b6b;
        --accent-wood: #a56a43;
        --shadow-deep: rgba(0, 0, 0, 0.38);
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(255, 209, 102, 0.16), transparent 28%),
            linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
    }
    body { position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .glass {
        background:
            linear-gradient(180deg, rgba(29, 57, 43, 0.86), rgba(13, 26, 21, 0.9));
        backdrop-filter: blur(10px);
        border: 1px solid var(--panel-border);
        box-shadow:
            0 10px 28px var(--shadow-deep),
            inset 0 1px 0 var(--panel-highlight);
    }

        transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
        cursor: pointer;
        border: 0;
    }
    .btn:active { transform: scale(0.95); }
    .font-display {
        font-family: 'Cinzel', Georgia, serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .top-4 { top: 1rem; }
    .left-4 { left: 1rem; }
    .z-50 { z-index: 50; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .w-32 { width: 8rem; }
    .h-3 { height: 0.75rem; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .rounded-lg { border-radius: 0.75rem; }
    .rounded { border-radius: 0.5rem; }
    .overflow-hidden { overflow: hidden; }
    .text-white { color: var(--text-main); }
    .text-black { color: #08110b; }
    .text-red-500 { color: var(--accent-danger); }
    .text-yellow-400 { color: var(--accent-sun); }
    .text-gray-300 { color: #d6e3d4; }
    .text-gray-400 { color: var(--text-muted); }
    .text-xs { font-size: 0.75rem; letter-spacing: 0.08em; }
    .text-sm { font-size: 0.95rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.75rem; }
    .text-5xl { font-size: clamp(2.5rem, 6vw, 4rem); }
    .text-6xl { font-size: clamp(3rem, 9vw, 5.5rem); }
    .font-bold { font-weight: 700; }
    .tracking-widest { letter-spacing: 0.18em; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-4 { margin-top: 1rem; }
    .border-b { border-bottom: 1px solid rgba(255,255,255,0.2); }
    .border-gray-600 { border-color: rgba(75, 85, 99, 0.8); }
    .pb-2 { padding-bottom: 0.5rem; }
    .bg-gray-700 { background: rgba(67, 86, 74, 0.9); }
    .bg-white { background: linear-gradient(180deg, #fff2cc, #ffd166); }
    .bg-green-700 { background: linear-gradient(180deg, #5dbc77, #2c7a46); }
    .hover\:bg-green-600:hover { background: linear-gradient(180deg, #70d58b, #349957); }
    .hover\:bg-gray-600:hover { background: rgba(92, 110, 100, 0.95); }
    .shadow-lg { box-shadow: 0 10px 24px rgba(0,0,0,0.35), 0 0 24px rgba(116, 209, 140, 0.1); }
    .transition-all { transition: all 0.3s ease; }
    .duration-300 { transition-duration: 0.3s; }
    .animate-pulse { animation: pulse 1.8s ease-in-out infinite; }
    .font-mono { font-family: 'Rajdhani', system-ui, sans-serif; letter-spacing: 0.05em; font-weight: 600; }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
    }
    
    #hud .glass {
        min-width: 9.5rem;
        border-radius: 1rem;
    }
    #hud .text-xs {
        font-family: 'Cinzel', Georgia, serif;
        font-size: 0.68rem;
        letter-spacing: 0.16em;
    }
    #bar-health {
        background: linear-gradient(90deg, #ff7b54, #ff4d6d);
        box-shadow: 0 0 14px rgba(255, 107, 107, 0.3);
    }
    #bar-hunger {
        background: linear-gradient(90deg, #ffd166, #7ddf64);

    #joystick-zone {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid rgba(220, 255, 209, 0.24);
        background:
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 45%),

        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 10px 18px rgba(0,0,0,0.2);
    }
    #joystick-knob {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        background: radial-gradient(circle at 35% 35%, #f4ffe9, #6ac17a 70%);
        border-radius: 50%;
        transform: translate(-50%, -50%);

        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28);

    /* Action Buttons */
    .action-btn {

        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.65);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 0.8rem;

        touch-action: none;

    #btn-craft { bottom: 140px; right: 40px; background: radial-gradient(circle at 30% 30%, #fff1a1, #d89b18); color: #1b1400; }

    #craft-menu {

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(80%, 400px);

    .feedback-overlay img {
        width: 100%;

    .feedback-caption {

        left: 0;

    #feedback-success { bottom: 14.9rem; }
    #feedback-fail { bottom: 8.2rem; }
    .status-chip {

        top: 1rem;
        right: 1rem;
        min-width: 8.5rem;
        padding: 0.65rem 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(9, 20, 15, 0.74);
        box-shadow: 0 10px 24px rgba(0,0,0,0.22);
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-align: center;
        opacity: 0;

        transition: opacity 0.2s ease, transform 0.2s ease;

    .status-chip.visible {
        opacity: 1;

    .status-chip.is-danger {
        color: #ffd7d7;
        border-color: rgba(255, 107, 107, 0.35);
        background: rgba(54, 14, 18, 0.82);
    }
    .status-chip.is-good {
        color: #eaffd9;
        border-color: rgba(116, 209, 140, 0.35);
        background: rgba(17, 48, 27, 0.82);
    }
    @media (max-width: 640px) {

            left: max(0.7rem, env(safe-area-inset-left));

        #hud .glass {
            min-width: 7.8rem;
        }
        #hud .w-32 {
            width: 6.4rem;
        }
        #hud #inv-display {
            font-size: 0.82rem;
            line-height: 1.15;
        }
        #joystick-zone {
            left: max(0.8rem, env(safe-area-inset-left));
            bottom: max(0.9rem, env(safe-area-inset-bottom));
            width: 104px;
            height: 104px;
        }
        #joystick-knob {
            width: 44px;
            height: 44px;
        }
        .action-btn {
            width: 60px;
            height: 60px;
            font-size: 0.68rem;
        }
        #btn-action {
            right: max(0.8rem, env(safe-area-inset-right));
            bottom: max(0.95rem, env(safe-area-inset-bottom));
        }
        #btn-craft {
            right: max(0.8rem, env(safe-area-inset-right));
            bottom: calc(max(0.95rem, env(safe-area-inset-bottom)) + 78px);
        }
        #btn-eat {
            right: calc(max(0.8rem, env(safe-area-inset-right)) + 78px);
            bottom: max(0.95rem, env(safe-area-inset-bottom));
        }
        #craft-menu {
            width: min(92vw, 400px);
            max-height: min(72vh, 80%);
            padding: 16px;
        }
        #start-screen h1,
        #game-over-screen h2 {
            line-height: 0.96;
        }
        #start-screen p,
        #game-over-screen p {
            max-width: 22rem;
            margin-left: auto;
            margin-right: auto;
        }
        .feedback-overlay {
            right: max(0.65rem, env(safe-area-inset-right));
            width: 72px;
            height: 72px;
        }
        #feedback-success { bottom: calc(max(0.95rem, env(safe-area-inset-bottom)) + 154px); }
        #feedback-fail { bottom: calc(max(0.95rem, env(safe-area-inset-bottom)) + 88px); }
        .status-chip {
            right: max(0.65rem, env(safe-area-inset-right));
            top: max(0.7rem, env(safe-area-inset-top));
            min-width: 7.25rem;
            padding: 0.5rem 0.7rem;
            font-size: 0.82rem;
        }
    }
</style>

<script>
// §3.2 Config
window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
window.gameConfig = {};
Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);
window.updateGameConfig = (k, v) => { if(window.gameConfig.hasOwnProperty(k)) window.gameConfig[k] = v; };

// §A.2 Audio Manager
class AudioManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.bgm = document.getElementById('bgm_main');
        this.buffers = {};
        this.unlocked = false;
        this.lastPlayedAt = {};
        this.sfxConfig = {
            sfx_hit: { volume: 0.3, cooldown: 80, fallback: 'noise' },
            sfx_collect: { volume: 0.38, cooldown: 110, fallback: 'beep' },
            sfx_hurt: { volume: 0.28, cooldown: 180, fallback: 'alarm' },
            sfx_ui: { volume: 0.22, cooldown: 90, fallback: 'blip' },
            sfx_fail: { volume: 0.25, cooldown: 140, fallback: 'alarm' }
        };
        this.bgm.volume = 0.2;
    }
    unlock() {
        if (this.unlocked) return;
        this.ctx.resume().then(() => {
            this.unlocked = true;
            this.startLoop();
        }).catch(() => {});
    }
    startLoop() {
        if (!this.bgm) return;
        this.bgm.currentTime = 0;
        this.bgm.play().catch(() => {});
    }
    stopLoop() {
        if (!this.bgm) return;
        this.bgm.pause();
        this.bgm.currentTime = 0;
    }
    setLoopState(shouldPlay) {
        if (!this.unlocked || !this.bgm) return;
        if (shouldPlay) {
            if (this.bgm.paused) this.bgm.play().catch(() => {});
        } else if (!this.bgm.paused) {
            this.bgm.pause();
        }
    }
    async loadSound(id) {
        const el = document.getElementById(id);
        if(!el) return;
        try {
            const res = await fetch(el.src);
            const buf = await res.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(buf);
        } catch(e) { console.warn('Audio load fail', id); }
    }
    playSfx(id) {
        if(!this.unlocked) return;
        const config = this.sfxConfig[id] || { volume: 0.22, cooldown: 100, fallback: 'beep' };
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < config.cooldown) return;
        this.lastPlayedAt[id] = now;

        if(this.buffers[id]) {
            const src = this.ctx.createBufferSource();
            const gain = this.ctx.createGain();
            gain.gain.value = config.volume;
            src.buffer = this.buffers[id];
            src.connect(gain);
            gain.connect(this.ctx.destination);
            src.start(0);
        } else {
            this.synthesize(config.fallback, config.volume);
        }
    }
    synthesize(type, volume = 0.15) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        if (type === 'noise') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        } else if (type === 'alarm') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
        } else if (type === 'blip') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(720, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume * 0.85, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(560, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        }
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
    }
}

// Game State
const STATE = {
    MENU: 0,
    PLAYING: 1,
    GAMEOVER: 2,
    CRAFTING: 3
};

let currentState = STATE.MENU;
let audioManager;
let canvas, ctx;
let lastTime = 0;
let camera = { x: 0, y: 0 };
let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0, ptrId: null };
let input = { action: false, eat: false };
let statusChipEl;
let successOverlayEl;
let failOverlayEl;
let overlayTimers = {};
let lowHealthWarned = false;

// Game Entities
const WORLD_SIZE = 2000;
let player = { x: 1000, y: 1000, hp: 100, maxHp: 100, hunger: 100, angle: 0, inv: { wood: 0, stone: 0, meat: 0 } };
let entities = [];
let particles = [];
let dayTime = 0;

// Recipes
const RECIPES = [
    { id: 'wall', name: 'Wood Wall', cost: { wood: 5 }, type: 'build' },
    { id: 'fire', name: 'Campfire', cost: { wood: 3, stone: 2 }, type: 'build' },
    { id: 'heal', name: 'Bandage', cost: { wood: 2 }, type: 'item', effect: (p) => p.hp = Math.min(p.hp + 20, p.maxHp) }
];

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    audioManager = new AudioManager();
    statusChipEl = document.getElementById('status-chip');
    successOverlayEl = document.getElementById('feedback-success');
    failOverlayEl = document.getElementById('feedback-fail');
    
    // Preload SFX
    ['sfx_hit', 'sfx_collect', 'sfx_hurt', 'sfx_ui', 'sfx_fail'].forEach(id => audioManager.loadSound(id));

    resize();
    window.addEventListener('resize', resize);
    
    // Input Listeners
    setupInputs();
    setupUI();

    requestAnimationFrame(gameLoop);
});

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function setupInputs() {
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    const actionBtn = document.getElementById('btn-action');
    const eatBtn = document.getElementById('btn-eat');
    const craftBtn = document.getElementById('btn-craft');

    // Joystick
    zone.addEventListener('pointerdown', e => {
        e.preventDefault();
        joystick.active = true;
        joystick.ptrId = e.pointerId;
        joystick.originX = e.clientX;
        joystick.originY = e.clientY;
        zone.setPointerCapture(e.pointerId);
    }, { passive: false });

    zone.addEventListener('pointermove', e => {
        if (!joystick.active || e.pointerId !== joystick.ptrId) return;
        e.preventDefault();
        const dx = e.clientX - joystick.originX;
        const dy = e.clientY - joystick.originY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = 35;
        const angle = Math.atan2(dy, dx);
        
        const clampedDist = Math.min(dist, maxDist);
        const kx = Math.cos(angle) * clampedDist;
        const ky = Math.sin(angle) * clampedDist;
        
        knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
        
        joystick.dx = kx / maxDist;
        joystick.dy = ky / maxDist;
    }, { passive: false });

    const endJoystick = (e) => {
        if (e.pointerId !== joystick.ptrId) return;
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        knob.style.transform = `translate(-50%, -50%)`;
    };
    zone.addEventListener('pointerup', endJoystick);
    zone.addEventListener('pointercancel', endJoystick);

    // Buttons
    const bindBtn = (el, key) => {
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (key === 'craft') {
                toggleCrafting();
            } else {
                input[key] = true;
            }
        });
        el.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (key !== 'craft') input[key] = false;
        });
    };

    bindBtn(actionBtn, 'action');
    bindBtn(eatBtn, 'eat');
    bindBtn(craftBtn, 'craft');

    // Global unlock
    window.addEventListener('pointerdown', () => audioManager.unlock(), { once: true });
}

function setupUI() {
    // [agent-note][stage4] repaired: mobile-cta-safety | action: keep native tap lifecycle for menu buttons by avoiding global touch suppression
    document.getElementById('start-btn').onclick = () => {
        audioManager.playSfx('sfx_ui');
        startGame();
    };
    document.getElementById('restart-btn').onclick = () => {
        audioManager.playSfx('sfx_ui');
        startGame();
    };
    document.getElementById('close-craft').onclick = () => {
        audioManager.playSfx('sfx_ui');
        toggleCrafting();
    };
    
    // Build Crafting Menu
    const list = document.getElementById('recipe-list');
    RECIPES.forEach(r => {
        const div = document.createElement('div');
        div.className = 'recipe-item';
        let costStr = Object.entries(r.cost).map(([k,v]) => `${k}:${v}`).join(' ');
        div.innerHTML = `
            <div>
                <div class="font-bold text-yellow-400">${r.name}</div>
                <div class="text-xs text-gray-400">${costStr}</div>
            </div>
             <button class="recipe-btn font-display" id="craft-btn-${r.id}">BUILD</button>
        `;
        list.appendChild(div);
        div.querySelector('button').onclick = () => craftItem(r);
    });
}

function startGame() {
    currentState = STATE.PLAYING;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    hideOverlay('success');
    hideOverlay('fail');
    showStatus('camp live', 'is-good', 1400);
    lowHealthWarned = false;
    
    // Reset World
    player = { x: WORLD_SIZE/2, y: WORLD_SIZE/2, hp: 100, maxHp: 100, hunger: 100, angle: 0, inv: { wood: 0, stone: 0, meat: 0 } };
    entities = [];
    particles = [];
    dayTime = 0;
    
    // Gen Trees
    for(let i=0; i<80; i++) {
        entities.push({ type: 'tree', x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, hp: 3 });
    }
    // Gen Rocks
    for(let i=0; i<40; i++) {
        entities.push({ type: 'rock', x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, hp: 4 });
    }
    // Gen Mobs
    for(let i=0; i<15; i++) {
        entities.push({ type: 'wolf', x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, hp: 20, timer: 0 });
    }
    for(let i=0; i<20; i++) {
        entities.push({ type: 'rabbit', x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, hp: 5, timer: 0 });
    }

    audioManager.unlock();
    audioManager.setLoopState(true);
}

function toggleCrafting() {
    if (currentState === STATE.PLAYING) {
        currentState = STATE.CRAFTING;
        document.getElementById('craft-menu').style.display = 'block';
        updateCraftUI();
        audioManager.playSfx('sfx_ui');
        audioManager.setLoopState(false);
        showStatus('crafting', 'is-good', 1000);
    } else if (currentState === STATE.CRAFTING) {
        currentState = STATE.PLAYING;
        document.getElementById('craft-menu').style.display = 'none';
        audioManager.playSfx('sfx_ui');
        audioManager.setLoopState(true);
    }
}

function updateCraftUI() {
    RECIPES.forEach(r => {
        const btn = document.getElementById(`craft-btn-${r.id}`);
        const canAfford = Object.entries(r.cost).every(([k,v]) => player.inv[k] >= v);
        btn.disabled = !canAfford;
        btn.style.opacity = canAfford ? '1' : '0.3';
    });
}

function craftItem(r) {
    const canAfford = Object.entries(r.cost).every(([k,v]) => player.inv[k] >= v);
    if (!canAfford) {
        audioManager.playSfx('sfx_fail');
        flashOverlay('fail');
        showStatus('need supplies', 'is-danger');
        return;
    }

    Object.entries(r.cost).forEach(([k,v]) => player.inv[k] -= v);

    if (r.type === 'build') {
        const dist = 40;
        entities.push({
            type: r.id,
            x: player.x + Math.cos(player.angle) * dist,
            y: player.y + Math.sin(player.angle) * dist,
            hp: 50
        });
        spawnParticles(player.x, player.y, '#fff', 10);
        audioManager.playSfx('sfx_collect');
        flashOverlay('success');
        showStatus(`${r.name} built`, 'is-good');
    } else if (r.effect) {
        r.effect(player);
        audioManager.playSfx('sfx_collect');
        flashOverlay('success');
        showStatus(`${r.name} used`, 'is-good');
    }

    updateCraftUI();
    toggleCrafting();
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap dt
    lastTime = timestamp;

    if (currentState === STATE.PLAYING) {
        update(dt);
    }
    draw();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Player Move
    if (joystick.active) {
        player.x += joystick.dx * window.gameConfig.heroSpeed;
        player.y += joystick.dy * window.gameConfig.heroSpeed;
        player.angle = Math.atan2(joystick.dy, joystick.dx);
        
        // Boundaries
        player.x = Math.max(0, Math.min(WORLD_SIZE, player.x));
        player.y = Math.max(0, Math.min(WORLD_SIZE, player.y));
    }

    // Camera follow
    camera.x = player.x - canvas.width / (2 * window.devicePixelRatio);
    camera.y = player.y - canvas.height / (2 * window.devicePixelRatio);

    // Survival time / score timer
    dayTime += dt;

    // Hunger
    player.hunger -= window.gameConfig.hungerRate * dt;
    if (player.hunger <= 0) {
        player.hunger = 0;
        player.hp -= 1 * dt;
        if (player.hp <= 0) gameOver();
    }

    // Input Actions
    if (input.eat) {
        if (player.inv.meat > 0 && player.hunger < 100) {
            player.inv.meat--;
            player.hunger = Math.min(100, player.hunger + 20);
            player.hp = Math.min(player.maxHp, player.hp + 5);
            audioManager.playSfx('sfx_collect');
            spawnParticles(player.x, player.y, '#4caf50', 5);
            flashOverlay('success');
            showStatus('rations restored', 'is-good');
            input.eat = false; // Trigger once
        } else {
            audioManager.playSfx('sfx_fail');
            flashOverlay('fail');
            showStatus('no ration to eat', 'is-danger');
            input.eat = false;
        }
    }

    if (input.action) {
        // Find nearest entity
        let target = null;
        let minDist = 60;
        entities.forEach(e => {
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) {
                target = e;
                minDist = d;
            }
        });

        if (target) {
            target.hp -= 10 * dt * 5; // Damage per second
            target.hitTimer = 0.1;
            if (Math.random() < 0.1) {
                audioManager.playSfx('sfx_hit');
                spawnParticles(target.x, target.y, '#fff', 2);
            }
            if (target.hp <= 0) destroyEntity(target);
        } else {
            audioManager.playSfx('sfx_fail');
            showStatus('nothing nearby', 'is-danger', 600);
            input.action = false;
        }
    }

    // Entities Logic
    entities.forEach(e => {
        if (e.hitTimer > 0) e.hitTimer -= dt;
        
        if (e.type === 'wolf') {
            const dist = Math.hypot(player.x - e.x, player.y - e.y);
            if (dist < 200) {
                // Chase
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * 2; // Speed
                e.y += Math.sin(angle) * 2;
                if (dist < 30) {
                    player.hp -= 10 * dt;
                    audioManager.playSfx('sfx_hurt');
                    if (Math.random() < 0.08) {
                        flashOverlay('fail');
                        showStatus('wolf bite', 'is-danger', 700);
                    }
                }
            } else {
                // Wander
                e.timer -= dt;
                if (e.timer <= 0) {
                    e.angle = Math.random() * Math.PI * 2;
                    e.timer = 2 + Math.random() * 3;
                }
                e.x += Math.cos(e.angle) * 0.5;
                e.y += Math.sin(e.angle) * 0.5;
            }
        } else if (e.type === 'rabbit') {
            e.timer -= dt;
            if (e.timer <= 0) {
                e.angle = Math.random() * Math.PI * 2;
                e.timer = 1 + Math.random() * 2;
            }
            e.x += Math.cos(e.angle) * 0.8;
            e.y += Math.sin(e.angle) * 0.8;
        }
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx;
        p.y += p.vy;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (player.hp < 30 && !lowHealthWarned) {
        lowHealthWarned = true;
        audioManager.playSfx('sfx_fail');
        flashOverlay('fail');
        showStatus('critical health', 'is-danger', 1200);
    } else if (player.hp >= 30) {
        lowHealthWarned = false;
    }

    // UI Update
    document.getElementById('bar-health').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('bar-hunger').style.width = player.hunger + '%';
    document.getElementById('inv-display').innerText = `Wood: ${Math.floor(player.inv.wood)} | Stone: ${Math.floor(player.inv.stone)} | Meat: ${Math.floor(player.inv.meat)}`;
}

function destroyEntity(e) {
    const idx = entities.indexOf(e);
    if (idx > -1) entities.splice(idx, 1);
    
    // Loot
    if (e.type === 'tree') {
        player.inv.wood += 2;
        spawnParticles(e.x, e.y, '#8d6e63', 8);
    } else if (e.type === 'rock') {
        player.inv.stone += 2;
        spawnParticles(e.x, e.y, '#9e9e9e', 8);
    } else if (e.type === 'wolf' || e.type === 'rabbit') {
        player.inv.meat += 1;
        spawnParticles(e.x, e.y, '#f44336', 10);
    }
    audioManager.playSfx('sfx_collect');
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 0.5 + Math.random() * 0.5,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

function gameOver() {
    currentState = STATE.GAMEOVER;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('final-score').innerText = Math.floor(dayTime / window.gameConfig.dayCycleDuration);
    audioManager.setLoopState(false);
    audioManager.playSfx('sfx_fail');
    flashOverlay('fail');
    showStatus('expedition lost', 'is-danger', 1500);
}

function flashOverlay(type) {
    const el = type === 'success' ? successOverlayEl : failOverlayEl;
    if (!el) return;
    clearTimeout(overlayTimers[type]);
    el.classList.add('visible');
    overlayTimers[type] = setTimeout(() => el.classList.remove('visible'), 1150);
}

function hideOverlay(type) {
    const el = type === 'success' ? successOverlayEl : failOverlayEl;
    if (!el) return;
    clearTimeout(overlayTimers[type]);
    el.classList.remove('visible');
}

function showStatus(message, mode = 'is-good', duration = 900) {
    if (!statusChipEl) return;
    statusChipEl.textContent = message;
    statusChipEl.className = `status-chip pointer-events-none visible ${mode}`;
    clearTimeout(overlayTimers.status);
    overlayTimers.status = setTimeout(() => {
        statusChipEl.className = 'status-chip pointer-events-none';
    }, duration);
}

function draw() {
    // Clear
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0b1820');
    skyGrad.addColorStop(1, '#294130');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // Camera Transform
    ctx.translate(-camera.x, -camera.y);

    // Draw terrain bands and subtle path grid
    for (let y = 0; y < WORLD_SIZE; y += 160) {
        ctx.fillStyle = y % 320 === 0 ? 'rgba(132, 181, 96, 0.08)' : 'rgba(39, 73, 45, 0.12)';
        ctx.fillRect(0, y, WORLD_SIZE, 140);
    }
    ctx.strokeStyle = 'rgba(255, 244, 196, 0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0; x<WORLD_SIZE; x+=100) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); }
    for(let y=0; y<WORLD_SIZE; y+=100) { ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); }
    ctx.stroke();

    // Draw Entities
    // Sort by Y for simple depth
    const renderList = [...entities, { type: 'player', x: player.x, y: player.y }];
    renderList.sort((a,b) => a.y - b.y);

    renderList.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        
        if (e.hitTimer > 0) {
            ctx.scale(1.1, 1.1); // Hit wobble
            ctx.fillStyle = '#fff';
        }

        if (e.type === 'player') {
            const bodyGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
            bodyGlow.addColorStop(0, 'rgba(255, 245, 201, 0.9)');
            bodyGlow.addColorStop(1, 'rgba(255, 245, 201, 0)');
            ctx.fillStyle = bodyGlow;
            ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();

            // Ranger cloak
            ctx.fillStyle = '#24553f';
            ctx.beginPath();
            ctx.moveTo(-16, 8);
            ctx.quadraticCurveTo(0, 28, 16, 8);
            ctx.quadraticCurveTo(8, -6, -8, -6);
            ctx.closePath();
            ctx.fill();

            // Body
            ctx.fillStyle = '#ffd8a8';
            ctx.beginPath(); ctx.arc(0, -2, 12, 0, Math.PI*2); ctx.fill();

            // Hood
            ctx.fillStyle = '#7ddf64';
            ctx.beginPath(); ctx.arc(0, -6, 14, Math.PI, Math.PI * 2); ctx.fill();

            // Face mark
            ctx.fillStyle = '#112019';
            ctx.beginPath(); ctx.arc(-4, -3, 1.6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -3, 1.6, 0, Math.PI*2); ctx.fill();

            // Hands/tool direction
            ctx.rotate(player.angle);
            ctx.fillStyle = '#ffe7c7';
            ctx.beginPath(); ctx.arc(13, 6, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(13, -6, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcf5a';
            ctx.fillRect(8, -2, 18, 4);
        } else if (e.type === 'tree') {
            ctx.fillStyle = '#2d4a28';
            ctx.beginPath(); ctx.arc(0, -12, 30, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#69b85f';
            ctx.beginPath(); ctx.arc(-10, -18, 18, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -22, 16, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, -30, 14, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#5c3d22';
            ctx.fillRect(-6, 0, 12, 14);
        } else if (e.type === 'rock') {
            ctx.fillStyle = '#7f8f91';
            ctx.beginPath();
            ctx.moveTo(-18, 10); ctx.lineTo(-13, -8); ctx.lineTo(-4, -16); ctx.lineTo(12, -12); ctx.lineTo(17, 8);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(230,255,255,0.18)';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else if (e.type === 'wolf') {
            ctx.fillStyle = '#48362f';
            ctx.beginPath(); ctx.ellipse(0, 1, 14, 11, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-8, -6); ctx.lineTo(-2, -16); ctx.lineTo(1, -5);
            ctx.moveTo(8, -6); ctx.lineTo(2, -16); ctx.lineTo(-1, -5);
            ctx.fill();
            ctx.fillStyle = '#ff765e';
            ctx.beginPath(); ctx.arc(-4, -2, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -2, 2, 0, Math.PI*2); ctx.fill();
        } else if (e.type === 'rabbit') {
            ctx.fillStyle = '#f8f4ec';
            ctx.beginPath(); ctx.ellipse(0, 2, 9, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(-5, -14, 3, 11);
            ctx.fillRect(2, -14, 3, 11);
            ctx.fillStyle = '#f4b4c0';
            ctx.fillRect(-4, -13, 1, 9);
            ctx.fillRect(3, -13, 1, 9);
        } else if (e.type === 'wall') {
            ctx.fillStyle = '#8a5b3a';
            ctx.fillRect(-15, -15, 30, 30);
            ctx.strokeStyle = '#50311c';
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -15, 30, 30);
            ctx.beginPath();
            ctx.moveTo(-15, -3); ctx.lineTo(15, -3);
            ctx.moveTo(-15, 8); ctx.lineTo(15, 8);
            ctx.stroke();
        } else if (e.type === 'fire') {
            ctx.fillStyle = '#7a5030';
            ctx.fillRect(-10, 6, 20, 4);
            ctx.fillRect(-6, 2, 12, 4);
            ctx.fillStyle = '#ff7b54';
            ctx.beginPath(); ctx.arc(0, 0, 10 + Math.sin(Date.now()/100)*2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffe066';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        }

        ctx.restore();
    });

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });

    ctx.restore();

    // Vignette
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/2, canvas.width/2, canvas.height/2, canvas.height);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}
