<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Sky Snakes: Party Edition</title>
    <!-- [agent-note][stage4] remapped-font: title=Orbitron body=Rajdhani from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --bg-top: #140f2f;
            --bg-mid: #23145a;
            --bg-low: #090613;
            --panel-fill: rgba(18, 16, 44, 0.72);
            --panel-strong: rgba(36, 24, 82, 0.88);
            --glass-border: rgba(132, 244, 255, 0.24);
            --glass-shadow: 0 18px 40px rgba(1, 4, 20, 0.46);
            --accent-cyan: #84f4ff;
            --accent-pink: #ff6dcf;
            --accent-gold: #ffd166;
            --text-main: #f8fbff;
            --text-soft: #c7d2fe;
            --danger: #ff5b7f;
            --success: #73f7c1;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            font-family: 'Rajdhani', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(132, 244, 255, 0.12), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(255, 109, 207, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg-top), var(--bg-mid) 52%, var(--bg-low)); 
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .safe-area-padding {
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }


        .theme-title {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .theme-body {
            font-family: 'Rajdhani', system-ui, sans-serif;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(30, 26, 71, 0.9), rgba(13, 12, 38, 0.74));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .hud-pill {
            position: relative;
            overflow: hidden;
            border-radius: 1.25rem;
        }

        .hud-pill::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(132, 244, 255, 0.12), rgba(255, 109, 207, 0.06));
            pointer-events: none;
        }

        .sky-card {
            position: relative;
            overflow: hidden;
        }

        .sky-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 22%, transparent 78%, rgba(132,244,255,0.08));
            pointer-events: none;
        }

        .glow-ring {
            box-shadow: 0 0 0 1px rgba(132, 244, 255, 0.25), 0 0 20px rgba(132, 244, 255, 0.18);
        }

        .action-badge {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(8, 10, 26, 0.5);
            color: var(--text-soft);
        }

        .arcade-btn {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .feedback-gif {
            position: absolute;
            width: clamp(88px, 22vw, 132px);
            height: clamp(88px, 22vw, 132px);
            object-fit: cover;
            border-radius: 1.25rem;
            border: 1px solid rgba(255,255,255,0.24);
            box-shadow: 0 16px 34px rgba(6, 8, 22, 0.42);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 18;
            background: rgba(8, 10, 26, 0.56);
        }

        .feedback-gif.is-visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #snake-gif {
            left: 1rem;
            bottom: calc(max(6.5rem, env(safe-area-inset-bottom) + 5rem));
        }

        #victory-gif {
            right: 1rem;
            top: calc(max(5.5rem, env(safe-area-inset-top) + 4.75rem));
        }

        .arcade-btn:active {
            transform: scale(0.96);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent-pink), #9f59ff 52%, #4cc8ff);
            color: white;
            box-shadow: 0 12px 30px rgba(159, 89, 255, 0.34);
        }

        .secondary-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(207,232,255,0.88));
            color: #1e1b4b;
            box-shadow: 0 10px 24px rgba(132, 244, 255, 0.18);
        }

        .danger-btn {
            background: linear-gradient(180deg, rgba(255, 91, 127, 0.22), rgba(127, 18, 39, 0.24));
            border: 1px solid rgba(255, 91, 127, 0.38);
            color: #ffd4df;
        }

        .counter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(132, 244, 255, 0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .dialogue-icon {
            background: radial-gradient(circle at 30% 30%, #fff1f8, #ff97d8 60%, #ff5b7f);
            color: #651433;
            box-shadow: 0 10px 18px rgba(255, 91, 127, 0.35);
        }

        .start-orb {
            width: 5.25rem;
            height: 5.25rem;
            border-radius: 999px;
            display: grid;
            place-items: center;
            margin: 0 auto 0.75rem;
            background: radial-gradient(circle at 30% 30%, #fff6b8, #ffd166 35%, #ff7ef5 72%, #5cc9ff);
            box-shadow: 0 0 28px rgba(255, 209, 102, 0.32);
        }

        .modal-shell {
            overflow: hidden;
        }

        .modal-content {
            overflow-y: auto;
            flex: 1;
            padding-right: 0.15rem;
        }

        .modal-actions {
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, rgba(12,12,30,0), rgba(12,12,30,0.96) 24%);
            padding-top: 1rem;
        }

        .player-color-frame {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08), 0 0 18px rgba(132, 244, 255, 0.2);
        }

        .starfield {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 24%, rgba(255,255,255,0.18) 0 1px, transparent 1px),
                radial-gradient(circle at 78% 14%, rgba(132,244,255,0.22) 0 1px, transparent 1px),
                radial-gradient(circle at 68% 76%, rgba(255,255,255,0.16) 0 1.2px, transparent 1.2px),
                radial-gradient(circle at 35% 82%, rgba(255,109,207,0.18) 0 1px, transparent 1px);
            background-size: 180px 180px, 240px 240px, 210px 210px, 260px 260px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            #hud { gap: 0.5rem; padding-left: 0.25rem; padding-right: 0.25rem; }
            #action-area { gap: 0.75rem; }
            #message-toast { max-width: 90vw; text-align: center; }
            .feedback-gif {
                width: 76px;
                height: 76px;
                border-radius: 1rem;
            }
            #snake-gif { left: 0.5rem; bottom: calc(max(7rem, env(safe-area-inset-bottom) + 5.5rem)); }
            #victory-gif { right: 0.5rem; top: calc(max(5.5rem, env(safe-area-inset-top) + 4.5rem)); }
        }

        .snake-bubble {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, 20px) scale(0); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }

        .dice-anim { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
            background: none;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; }

        .toggle-checkbox:checked { right: 0; border-color: #d946ef; }
        .toggle-checkbox:checked + .toggle-label { background-color: #d946ef; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: transparent; }
        
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        select {
            appearance: none;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem 2rem 0.5rem 1rem;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            width: 140px;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
        <div id="game-container" class="theme-body relative w-full h-full overflow-hidden">
            <div class="starfield"></div>
            <!-- [agent-note][stage3] resolved-gif: snake fail and victory celebration overlays from catalogs/gifs.json; kept off playfield to protect controls -->
            <img id="snake-gif" class="feedback-gif" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Snake reaction overlay" aria-hidden="true">
            <img id="victory-gif" class="feedback-gif" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp" alt="Victory celebration overlay" aria-hidden="true">
            <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col justify-between items-center pointer-events-none safe-area-padding z-10">
            
            <!-- HUD: Top Bar -->
            <div id="hud" class="w-full flex justify-between items-start hidden pointer-events-auto px-4 gap-3 pt-2">
                
                <!-- Turn Info -->
                <div class="glass-panel hud-pill px-4 py-2 rounded-2xl flex flex-col items-center min-w-[90px]">
                    <div id="lbl-turn" class="text-[10px] uppercase tracking-widest text-purple-200 opacity-80">Turn</div>
                    <div id="turn-indicator" class="text-xl font-bold text-white truncate max-w-[100px]">P1</div>
                </div>

                <!-- Tile Info -->
                <div class="glass-panel hud-pill px-4 py-2 rounded-2xl flex flex-col items-center flex-1 mx-2 border-white/20 glow-ring">
                    <div id="lbl-tile" class="text-[10px] uppercase tracking-widest text-purple-200 opacity-80">Tile</div>
                    <div id="tile-indicator" class="text-2xl font-bold text-white">1</div>
                </div>

                <!-- Settings Btn -->
                <button id="settings-btn" class="glass-panel glow-ring w-12 h-12 rounded-full flex items-center justify-center text-white active:scale-90 transition hover:bg-white/10">
                    <svg xmlns="assets/www.w3.org/2000/svg.html" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>

            <!-- Snake Dialogue Box -->
            <div id="snake-dialogue" class="hidden absolute top-1/2 left-1/2 glass-panel bg-rose-600/90 border-rose-400 px-6 py-4 rounded-2xl text-white text-center w-[85%] max-w-sm snake-bubble z-30 shadow-xl pointer-events-none sky-card">
                <div class="absolute -top-4 -left-2 dialogue-icon rounded-full p-2 border-2 border-rose-300 shadow-lg">
                    <span class="text-2xl block leading-none">🐍</span>
                </div>
                <div id="lbl-snake-says" class="theme-title text-[10px] font-bold uppercase tracking-widest text-rose-100 mb-1">Snake Says</div>
                <div id="snake-text" class="text-xl font-bold italic">"Slithering down!"</div>
            </div>

            <!-- Action Area -->
            <div id="action-area" class="pointer-events-auto hidden flex flex-col items-center gap-4 w-full max-w-sm z-20 pb-4">
                <div id="message-toast" class="action-badge text-white font-bold text-sm tracking-wide drop-shadow-md py-1 px-6 rounded-full backdrop-blur-md flex items-center justify-center transition-all">
                    Your Turn!
                </div>
                
                <div class="flex items-center gap-6">
                    <div id="dice-display" class="w-20 h-20 glass-panel glow-ring bg-indigo-500/20 rounded-2xl flex items-center justify-center text-5xl font-bold text-white shadow-lg border-white/20 theme-title">?</div>
                    <button id="roll-btn" class="arcade-btn primary-btn text-white font-bold py-4 px-12 rounded-full shadow-lg active:scale-95 transition-all text-2xl border border-white/20 tracking-wider">
                        ROLL
                    </button>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-xl pointer-events-auto z-50 transition-opacity duration-500">
            <div class="glass-panel sky-card p-8 rounded-[2rem] text-center w-[85%] max-w-sm border-t-4 border-fuchsia-500 shadow-2xl">
                <div class="start-orb"><span class="text-5xl leading-none">🐍</span></div>
                <h1 id="main-title" class="theme-title text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-200 via-fuchsia-200 to-amber-200 mb-1">SKY SNAKES</h1>
                <h2 id="sub-title" class="text-sm text-cyan-100/90 mb-8 font-semibold tracking-[0.28em] uppercase">Cloudrail Party Edition</h2>
                
                <!-- Config Controls -->
                <div class="space-y-5 mb-8">
                    <!-- Player Count -->
                    <div class="flex items-center justify-between bg-white/5 rounded-xl p-3 border border-cyan-200/10">
                        <span id="lbl-players" class="text-sm font-bold text-indigo-100 uppercase tracking-wide">Players</span>
                        <div class="flex items-center gap-3">
                            <button id="p-minus" class="w-8 h-8 rounded-full counter-btn hover:bg-white/20 text-white font-bold">-</button>
                            <span id="p-count-display" class="text-xl font-bold w-4 text-center">4</span>
                            <button id="p-plus" class="w-8 h-8 rounded-full counter-btn hover:bg-white/20 text-white font-bold">+</button>
                        </div>
                    </div>

                    <!-- Color Picker -->
                    <div class="flex items-center justify-between bg-white/5 rounded-xl p-3 border border-cyan-200/10">
                        <span id="lbl-color" class="text-sm font-bold text-indigo-100 uppercase tracking-wide">Your Color</span>
                        <div class="relative">
                            <input type="color" id="p-color" value="#d946ef">
                            <div class="absolute inset-0 rounded-full border-2 border-white/20 pointer-events-none"></div>
                        </div>
                    </div>
                </div>

                <button id="start-btn" class="w-full arcade-btn secondary-btn font-extrabold py-4 rounded-xl shadow-xl hover:scale-[1.02] active:scale-95 transition text-lg uppercase tracking-wide">
                    Start Game
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/90 backdrop-blur-lg pointer-events-auto z-50">
            <div class="glass-panel sky-card p-8 rounded-3xl text-center max-w-xs mx-4 border-2 border-white/10">
                <h2 id="result-title" class="theme-title text-4xl font-bold text-white mb-4">FINISHED!</h2>
                <p id="result-msg" class="text-lg text-indigo-200 mb-8">You placed #1</p>
                <button id="restart-btn" class="arcade-btn primary-btn text-white font-bold py-3 px-8 rounded-full shadow-lg hover:scale-105 transition">
                    Play Again
                </button>
            </div>
        </div>

        <!-- Options Modal -->
        <div id="options-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center pointer-events-auto">
            <div class="glass-panel modal-shell w-[90%] max-w-sm rounded-3xl p-6 shadow-2xl border border-white/20 modal-enter flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="lbl-options" class="text-2xl font-bold text-white">Options</h2>
                    <button id="close-options" class="text-white/70 hover:text-white p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <div class="space-y-4 flex-1 modal-content">
                    <!-- Language Selector -->
                    <div class="flex items-center justify-between">
                        <span id="lbl-language" class="text-indigo-100 font-medium">Language</span>
                        <div class="relative">
                            <select id="opt-lang" class="bg-slate-800 text-white border border-slate-600 rounded px-2 py-1">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                    </div>

                    <!-- Music -->
                    <div class="flex items-center justify-between">
                        <span id="lbl-music" class="text-indigo-100 font-medium">Music</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="opt-music" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-6"/>
                            <label for="opt-music" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer border border-slate-500"></label>
                        </div>
                    </div>

                    <!-- Sound FX -->
                    <div class="flex items-center justify-between">
                        <span id="lbl-sfx" class="text-indigo-100 font-medium">Sound FX</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="opt-sfx" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-6"/>
                            <label for="opt-sfx" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer border border-slate-500"></label>
                        </div>
                    </div>

                    <!-- Fast Mode -->
                    <div class="flex items-center justify-between">
                        <span id="lbl-speed" class="text-indigo-100 font-medium">Fast Mode</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="opt-speed" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-6"/>
                            <label for="opt-speed" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer border border-slate-500"></label>
                        </div>
                    </div>

                    <!-- Haptics -->
                    <div class="flex items-center justify-between">
                        <span id="lbl-haptics" class="text-indigo-100 font-medium">Vibration</span>
                        <div class="relative inline-block w-12 align-middle select-none">
                            <input type="checkbox" id="opt-haptics" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 left-0 checked:left-6"/>
                            <label for="opt-haptics" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer border border-slate-500"></label>
                        </div>
                    </div>
                </div>

                <!-- Exit/Resume Actions -->
                <div class="mt-8 flex flex-col gap-3 pt-4 border-t border-white/10 modal-actions">
                    <button id="resume-btn" class="w-full arcade-btn secondary-btn font-bold py-3 rounded-xl shadow-lg active:scale-95 transition text-lg uppercase">
                        Resume Game
                    </button>
                    <button id="quit-btn" class="w-full arcade-btn danger-btn font-bold py-3 rounded-xl active:scale-95 transition text-sm uppercase">
                        Quit to Menu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. LOCALIZATION SYSTEM (45 LANGUAGES) */
        const LANGUAGES = [
            {code:'en', name:'🇺🇸 English'}, {code:'es', name:'🇪🇸 Español'}, {code:'fr', name:'🇫🇷 Français'}, {code:'de', name:'🇩🇪 Deutsch'},
            {code:'it', name:'🇮🇹 Italiano'}, {code:'pt', name:'🇧🇷 Português'}, {code:'ru', name:'🇷🇺 Русский'}, {code:'zh', name:'🇨🇳 中文'},
            {code:'ja', name:'🇯🇵 日本語'}, {code:'ko', name:'🇰🇷 한국어'}, {code:'ar', name:'🇸🇦 العربية'}, {code:'hi', name:'🇮🇳 हिन्दी'},
            {code:'tr', name:'🇹🇷 Türkçe'}, {code:'nl', name:'🇳🇱 Nederlands'}, {code:'sv', name:'🇸🇪 Svenska'}, {code:'pl', name:'🇵🇱 Polski'},
            {code:'vi', name:'🇻🇳 Tiếng Việt'}, {code:'th', name:'🇹🇭 ไทย'}, {code:'id', name:'🇮🇩 Indonesia'}, {code:'da', name:'🇩🇰 Dansk'},

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.audioUnlocked = false;
                this.lastPlayedAt = {};
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.victoryLoop = new Audio(ASSETS.victoryLoop);
                this.victoryLoop.loop = true;
                this.victoryLoop.volume = 0.2;
                this.sfx = {};
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(v);
                    audio.preload = 'auto';
                    this.sfx[k] = audio;
                }
            }
            unlock() {
                this.audioUnlocked = true;
            }
            stopAllLoops() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
            }
            playBGM() {
                if (!this.audioUnlocked || !SETTINGS.music) return;
                this.victoryLoop.pause();
                this.victoryLoop.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            playVictoryLoop() {
                if (!this.audioUnlocked || !SETTINGS.music) return;
                this.bgm.pause();
                this.bgm.currentTime = 0;
                this.victoryLoop.play().catch(() => {});
            }
            toggleBGM(isOn) {
                if (!isOn) {
                    this.stopAllLoops();
                    return;
                }
                if (STATE.gameActive) this.playBGM();
            }
            playSFX(key, volume = 0.6, cooldownMs = 90) {
                if (!this.audioUnlocked || !SETTINGS.sfx || !this.sfx[key]) return;
                const now = performance.now();
                if (this.lastPlayedAt[key] && now - this.lastPlayedAt[key] < cooldownMs) return;
                this.lastPlayedAt[key] = now;
                const clone = this.sfx[key].cloneNode();
                clone.volume = volume;
                clone.play().catch(() => {});
            }
            vibrate(pattern) {
                if (SETTINGS.haptics && navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            }
        }

        function showGifFeedback(id, duration = 1600) {
            const el = document.getElementById(id);

            const timerKey = `${id}Timer`;
            if (FEEDBACK[timerKey]) clearTimeout(FEEDBACK[timerKey]);
            el.classList.add('is-visible');
            FEEDBACK[timerKey] = setTimeout(() => {
                el.classList.remove('is-visible');
            }, duration);
        }

        function hideGifFeedback(id) {
            const el = document.getElementById(id);

        function initUI() {
            // Populate Language Dropdown
            const langSelect = document.getElementById('opt-lang');

                opt.text = l.name;

            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            const hudHeight = 80 + (parseInt(getComputedStyle(document.body).paddingTop) || 0);
            const actionHeight = 140 + (parseInt(getComputedStyle(document.body).paddingBottom) || 0);
            
            const availableH = height - hudHeight - actionHeight;
            const availableW = width - 32;

            boardSize = Math.min(availableW, availableH);
            tileSize = boardSize / GRID_SIZE;
            
            boardX = (width - boardSize) / 2;
            boardY = hudHeight + (availableH - boardSize) / 2;

            if (STATE.gameActive) recalculateTilePositions();
        }
        window.addEventListener('resize', resize);

        /** 5. VISUALS */
        function initBackground() {
            bgParticles = [];
            for(let i=0; i<60; i++) {
                bgParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.3 + 0.1,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#120d2b'); 
            grad.addColorStop(0.45, '#24145a'); 
            grad.addColorStop(1, '#070511'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#fff';
            bgParticles.forEach(p => {
                p.y -= p.speed;
                if (p.y < -5) p.y = height + 5;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        /** 6. BOARD LOGIC */
        function getTilePos(index) {
            const row = Math.floor(index / GRID_SIZE);
            let col = index % GRID_SIZE;
            if (row % 2 === 1) col = (GRID_SIZE - 1) - col;
            
            const x = boardX + col * tileSize;
            const y = (boardY + boardSize) - (row + 1) * tileSize;
            return { x: x + tileSize/2, y: y + tileSize/2 };
        }

        function recalculateTilePositions() {
            tiles.forEach(t => {
                const pos = getTilePos(t.index);
                t.x = pos.x;
                t.y = pos.y;
            });
        }

        function generateBoard() {
            tiles = [];
            connections = [];
            for (let i = 0; i < TOTAL_TILES; i++) {
                tiles.push({ index: i, type: 'normal', target: null });
            }
            recalculateTilePositions();

            const usedStarts = new Set();
            const usedEnds = new Set();

            function addConnection(type, count) {
                for (let k = 0; k < count; k++) {
                    let start, end, attempts = 0;
                    do {
                        start = Math.floor(Math.random() * (TOTAL_TILES - 15)) + 5; 
                        const length = Math.floor(Math.random() * 25) + 10;
                        end = type === 'ladder' ? start + length : start - length;
                        attempts++;
                    } while (
                        attempts < 200 &&
                        (end <= 0 || end >= TOTAL_TILES - 1 || 
                         usedStarts.has(start) || usedStarts.has(end) || 
                         usedEnds.has(start) || usedEnds.has(end))
                    );

                    if (attempts < 200) {
                        usedStarts.add(start);
                        usedEnds.add(end);
                        tiles[start].type = type;
                        tiles[start].target = end;
                        connections.push({ startIdx: start, endIdx: end, type: type });
                    }
                }
            }
            addConnection('ladder', 5);
            addConnection('snake', 6);
        }

        function generateCPUColors(count, userColor) {
            const colors = [];
            for (let i = 0; i < count; i++) {
                const hue = (i * (360 / (count + 1)) + 45) % 360;
                colors.push(`hsl(${hue}, 80%, 60%)`);
            }
            return colors;
        }

        function initPlayers() {
            players = [];
            const cpuColors = generateCPUColors(STATE.playerCount, STATE.userColor);
            
            for(let i=0; i<STATE.playerCount; i++) {
                const startPos = getTilePos(0);
                const isHuman = (i === 0);
                players.push({
                    id: i,
                    isHuman: isHuman,
                    tileIndex: 0,
                    x: startPos.x,
                    y: startPos.y,
                    color: isHuman ? STATE.userColor : cpuColors[i-1]
                });
            }
            STATE.currentPlayerIndex = 0;
        }

        function getPlayerName(p) {
            return p.isHuman ? getText('you') : `${getText('cpu')} ${p.id}`;
        }

        /** 7. RENDER */
        function drawBoard() {
            const boardGradient = ctx.createLinearGradient(boardX, boardY, boardX + boardSize, boardY + boardSize);
            boardGradient.addColorStop(0, 'rgba(17, 24, 62, 0.86)');
            boardGradient.addColorStop(0.55, 'rgba(31, 22, 85, 0.76)');
            boardGradient.addColorStop(1, 'rgba(9, 11, 34, 0.9)');
            ctx.fillStyle = boardGradient;
            ctx.fillRect(boardX, boardY, boardSize, boardSize);
            ctx.strokeStyle = 'rgba(132, 244, 255, 0.24)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boardX, boardY, boardSize, boardSize);

            for (let i = 0; i < TOTAL_TILES; i++) {
                const pos = tiles[i];
                const row = Math.floor(i / GRID_SIZE);
                const col = (row % 2 === 0) ? (i % GRID_SIZE) : (GRID_SIZE - 1 - (i % GRID_SIZE));
                
                if ((row + col) % 2 === 0) {
                    ctx.fillStyle = 'rgba(132, 244, 255, 0.06)';
                    ctx.fillRect(pos.x - tileSize/2, pos.y - tileSize/2, tileSize, tileSize);
                }

                const activePlayer = players[STATE.currentPlayerIndex];
                if (STATE.gameActive && activePlayer.tileIndex === i) {
                    ctx.strokeStyle = activePlayer.color;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pos.x - tileSize/2 + 2, pos.y - tileSize/2 + 2, tileSize - 4, tileSize - 4);
                }

                ctx.fillStyle = 'rgba(233, 240, 255, 0.62)';
                ctx.font = `600 ${Math.floor(tileSize * 0.23)}px Rajdhani`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(i + 1, pos.x - tileSize/2 + 3, pos.y - tileSize/2 + 3);

                if (i === TOTAL_TILES - 1) {
                    ctx.fillStyle = 'rgba(255, 209, 102, 0.18)';
                    ctx.fillRect(pos.x - tileSize/2, pos.y - tileSize/2, tileSize, tileSize);
                    ctx.fillStyle = '#ffd166';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `700 ${Math.floor(tileSize * 0.27)}px Orbitron`;
                    ctx.fillText('WIN', pos.x, pos.y);
                }
            }

            connections.forEach(conn => {
                const start = tiles[conn.startIdx];
                const end = tiles[conn.endIdx];

                if (conn.type === 'ladder') {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'butt';
                    const angle = Math.atan2(end.y - start.y, end.x - start.x);
                    const px = Math.cos(angle + Math.PI/2) * (tileSize * 0.15);
                    const py = Math.sin(angle + Math.PI/2) * (tileSize * 0.15);
                    
                    ctx.beginPath();
                    ctx.moveTo(start.x - px, start.y - py);
                    ctx.lineTo(end.x - px, end.y - py);
                    ctx.moveTo(start.x + px, start.y + py);
                    ctx.lineTo(end.x + px, end.y + py);
                    ctx.stroke();

                    const dist = Math.hypot(end.x - start.x, end.y - start.y);
                    const steps = Math.floor(dist / (tileSize * 0.4));
                    ctx.lineWidth = 2;
                    for(let j=1; j<steps; j++) {
                        const t = j/steps;
                        const mx = start.x + (end.x - start.x) * t;
                        const my = start.y + (end.y - start.y) * t;
                        ctx.beginPath();
                        ctx.moveTo(mx - px, my - py);
                        ctx.lineTo(mx + px, my + py);
                        ctx.stroke();
                    }
                } else {
                    ctx.strokeStyle = '#ff6dcf';
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    
                    const midX = (start.x + end.x) / 2;
                    const midY = (start.y + end.y) / 2;
                    const angle = Math.atan2(end.y - start.y, end.x - start.x);
                    const cp1x = midX + Math.cos(angle + Math.PI/2) * tileSize * 1.5;
                    const cp1y = midY + Math.sin(angle + Math.PI/2) * tileSize * 1.5;
                    
                    ctx.quadraticCurveTo(cp1x, cp1y, end.x, end.y);
                    ctx.stroke();

                    ctx.fillStyle = '#ff5b7f';
                    ctx.beginPath();
                    ctx.arc(start.x, start.y, tileSize * 0.22, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(start.x - 3, start.y - 3, 2, 0, Math.PI*2);
                    ctx.arc(start.x + 3, start.y - 3, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            });
        }

        function drawPlayers() {
            const tileGroups = {};
            players.forEach(p => {
                if(!tileGroups[p.tileIndex]) tileGroups[p.tileIndex] = [];
                tileGroups[p.tileIndex].push(p);
            });

            players.forEach((p) => {
                const group = tileGroups[p.tileIndex];
                let offsetX = 0, offsetY = 0;
                
                if (group.length > 1) {
                    const idxInGroup = group.indexOf(p);
                    const angle = (idxInGroup / group.length) * Math.PI * 2 - Math.PI/2;
                    const radius = tileSize * 0.2;
                    offsetX = Math.cos(angle) * radius;
                    offsetY = Math.sin(angle) * radius;
                }

                const px = p.x + offsetX;
                const py = p.y + offsetY;

                const bodyRadius = tileSize * 0.15;
                const headRadius = tileSize * 0.11;
                const bob = Math.sin((performance.now() / 180) + p.id) * tileSize * 0.015;

                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(px, py + bodyRadius * 0.7, bodyRadius, 0, Math.PI*2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(px, py - headRadius * 0.85 + bob, headRadius, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.95)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py + bodyRadius * 0.7, bodyRadius, 0, Math.PI*2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(px, py - headRadius * 0.85 + bob, headRadius, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px - headRadius * 0.35, py - headRadius + bob, Math.max(1.5, tileSize * 0.018), 0, Math.PI * 2);
                ctx.arc(px + headRadius * 0.35, py - headRadius + bob, Math.max(1.5, tileSize * 0.018), 0, Math.PI * 2);
                ctx.fill();

                if (p.id === STATE.currentPlayerIndex && STATE.gameActive) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.moveTo(px, py - tileSize*0.4);
                    ctx.lineTo(px - 5, py - tileSize*0.55);
                    ctx.lineTo(px + 5, py - tileSize*0.55);
                    ctx.fill();
                }
            });
        }

        function update() {
            if (!STATE.gameActive) return;

            const speedFactor = SETTINGS.fastMode ? 0.35 : 0.15;

            players.forEach(p => {
                const target = tiles[p.tileIndex];
                const dx = target.x - p.x;
                const dy = target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 1) {
                    p.x += dx * speedFactor;
                    p.y += dy * speedFactor;
                } else {
                    p.x = target.x;
                    p.y = target.y;
                }
            });

            const curr = players[STATE.currentPlayerIndex];
            const target = tiles[curr.tileIndex];
            const dist = Math.hypot(target.x - curr.x, target.y - curr.y);

            if (STATE.isMoving && dist < 2) {
                STATE.isMoving = false;
                checkTileEffect(curr);
            }
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);
            drawBackground();
            if (STATE.gameActive) {
                drawBoard();
                drawPlayers();
                update();
            }
            requestAnimationFrame(loop);
        }

        /** 8. GAMEPLAY */
        function nextTurn() {
            if (!STATE.gameActive) return;

            if (players.some(p => p.tileIndex >= TOTAL_TILES - 1)) {
                endGame();
                return;
            }

            STATE.currentPlayerIndex = (STATE.currentPlayerIndex + 1) % players.length;
            updateHUD();

            const p = players[STATE.currentPlayerIndex];
            const turnWait = SETTINGS.fastMode ? 300 : 600;

            if (p.isHuman) {
                enableControls(true);
                document.getElementById('message-toast').innerText = getText('yourturn');
                document.getElementById('dice-display').innerText = "?";
                audio.vibrate(50);
            } else {
                enableControls(false);
                document.getElementById('message-toast').innerText = `${getPlayerName(p)} ${getText('rolling')}`;
                setTimeout(rollDice, turnWait + Math.random() * 300);
            }
        }

        function rollDice() {
            if (STATE.isRolling || STATE.isMoving) {
                audio.playSFX('fail', 0.34, 150);
                return;
            }
            STATE.isRolling = true;
            audio.playSFX('roll', 0.42, 120);

            const diceEl = document.getElementById('dice-display');
            diceEl.classList.add('dice-anim');
            
            let rolls = 0;
            const rollInterval = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
                rolls++;
                if (rolls > 10) {
                    clearInterval(rollInterval);
                    diceEl.classList.remove('dice-anim');
                    
                    const val = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = val;
                    
                    const p = players[STATE.currentPlayerIndex];
                    let next = p.tileIndex + val;
                    if (next >= TOTAL_TILES) next = TOTAL_TILES - 1; 
                    
                    p.tileIndex = next;
                    STATE.isMoving = true;
                    STATE.isRolling = false;
                    audio.playSFX('step');
                    updateHUD();
                }
            }, SETTINGS.fastMode ? 30 : 50);
        }

        function checkTileEffect(player) {
            const tile = tiles[player.tileIndex];
            const effectDelay = SETTINGS.fastMode ? 600 : 1200;
            const stepDelay = SETTINGS.fastMode ? 200 : 500;

            updateHUD();

            if (player.tileIndex === TOTAL_TILES - 1) {
                audio.playSFX('win', 0.72, 200);
                showGifFeedback('victory-gif', 2600);
                endGame();
                return;
            }

            if (tile.type === 'snake') {
                const quotes = getText('quote');
                const quote = quotes[Math.floor(Math.random() * quotes.length)];
                showSnakeDialogue(quote);
                
                setTimeout(() => {
                    player.tileIndex = tile.target;
                    STATE.isMoving = true;
                    audio.playSFX('snake', 0.6, 150);
                    audio.playSFX('fail', 0.32, 150);
                    showGifFeedback('snake-gif', effectDelay);
                    audio.vibrate([50, 50, 50]);
                    hideSnakeDialogue();
                }, effectDelay);
            } 
            else if (tile.type === 'ladder') {
                document.getElementById('message-toast').innerText = getText('lad');
                audio.playSFX('ladder', 0.52, 150);
                setTimeout(() => {
                    player.tileIndex = tile.target;
                    STATE.isMoving = true;
                }, stepDelay);
            } 
            else {
                setTimeout(nextTurn, stepDelay);
            }
        }

        function showSnakeDialogue(text) {
            const el = document.getElementById('snake-dialogue');
            document.getElementById('snake-text').innerText = `"${text}"`;
            el.classList.remove('hidden');
        }

        function hideSnakeDialogue() {
            document.getElementById('snake-dialogue').classList.add('hidden');
        }

        function updateHUD() {
            const p = players[STATE.currentPlayerIndex];
            const hudName = document.getElementById('turn-indicator');
            hudName.innerText = getPlayerName(p);
            hudName.style.color = p.color;

            const tileInd = document.getElementById('tile-indicator');
            tileInd.innerText = p.tileIndex + 1;
            tileInd.style.color = p.color;
        }

        function enableControls(enabled) {
            const btn = document.getElementById('roll-btn');
            if (enabled) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('active:scale-95');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('active:scale-95');
            }
        }

        function endGame() {
            STATE.gameActive = false;
            audio.stopAllLoops();
            const sorted = [...players].sort((a,b) => b.tileIndex - a.tileIndex);
            const winner = sorted[0];
            const userRank = sorted.findIndex(p => p.id === 0) + 1;

            document.getElementById('game-over-screen').classList.remove('hidden');
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');

            if (winner.id === 0) {
                title.innerText = getText('win');
                title.className = "text-5xl font-bold text-yellow-400 mb-4";
                msg.innerText = getText('msg_win');
                audio.playVictoryLoop();
            } else {
                title.innerText = getText('fin');
                title.className = "text-5xl font-bold text-white mb-4";
                msg.innerText = getText('msg_lose').replace('{n}', getPlayerName(winner)).replace('{rank}', userRank);
            }
        }

        function exitGame() {
            STATE.gameActive = false;
            audio.stopAllLoops();
            hideGifFeedback('snake-gif');
            hideGifFeedback('victory-gif');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('action-area').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
        }

        /** 9. HANDLERS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0.5, 150);
            audio.playBGM();
            hideGifFeedback('snake-gif');
            hideGifFeedback('victory-gif');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('action-area').classList.remove('hidden');
            
            resize();
            initBackground();
            generateBoard();
            initPlayers();
            STATE.gameActive = true;
            updateHUD();
            // Trigger first turn logic
            STATE.currentPlayerIndex = -1;
            nextTurn();
            loop();
        });

        document.getElementById('roll-btn').addEventListener('click', () => {
            if (players[STATE.currentPlayerIndex].isHuman) rollDice();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.stopAllLoops();
            hideGifFeedback('snake-gif');
            hideGifFeedback('victory-gif');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('action-area').classList.add('hidden');
            STATE.gameActive = false;
        });

        // Init
        resize();
        initBackground();
        loop(); 
    });
    </script>
</body>
</html>
