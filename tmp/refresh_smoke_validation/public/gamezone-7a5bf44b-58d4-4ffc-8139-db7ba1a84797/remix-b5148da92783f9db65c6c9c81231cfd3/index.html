<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
<title>Neon Circuit - Signal Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Press+Start+2P&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --brand-purple: #6a0dad;
        --brand-yellow: #ffd700;
        --brand-blue: #00bfff;
        --bg-dark: #111;
        --bg-deep: #050816;
        --panel-bg: rgba(7, 12, 27, 0.74);
        --panel-border: rgba(111, 241, 255, 0.38);
        --panel-shadow: rgba(0, 191, 255, 0.18);
        --text-main: #f7fbff;
        --text-soft: #b6d2f6;
        --danger: #ff5378;
    }
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(0, 191, 255, 0.16), transparent 32%),
            radial-gradient(circle at bottom, rgba(106, 13, 173, 0.24), transparent 35%),
            linear-gradient(180deg, var(--bg-deep), var(--bg-dark));
        font-family: 'Rajdhani', system-ui, sans-serif;
        color: var(--text-main);
    }
    #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }
    body::before,
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }
    body::before {
        background:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 28px 28px;
        mix-blend-mode: screen;
        opacity: 0.18;
    }
    body::after {
        background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.48) 100%);
    }
    /* UI Overlay */
    #uiLayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    
    /* Screens */
    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 24px 18px;
        background: rgba(3, 8, 19, 0.86);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        pointer-events: auto;
        transition: opacity 0.3s;
        text-align: center;
    }
    .hidden {
        opacity: 0;
        pointer-events: none;
    }
    
    /* Start Screen */
    .signal-avatar {
        width: 124px;
        height: 124px;
        margin-bottom: 18px;
        border-radius: 28px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        background:
            radial-gradient(circle at 35% 35%, #fff6b0 0 10%, transparent 11%),
            radial-gradient(circle at 65% 65%, rgba(255,255,255,0.92) 0 7%, transparent 8%),
            linear-gradient(145deg, rgba(255, 215, 0, 0.92), rgba(0, 191, 255, 0.92) 55%, rgba(106, 13, 173, 0.92));
        box-shadow:
            0 0 0 4px rgba(255, 255, 255, 0.04),
            0 0 24px rgba(0, 191, 255, 0.28),
            0 0 40px rgba(106, 13, 173, 0.3);
        position: relative;
        overflow: hidden;
    }
    .signal-avatar::before,
    .signal-avatar::after {
        content: "";
        position: absolute;
        inset: auto;
        background: #08101f;
    }
    .signal-avatar::before {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        left: 30px;
        top: 33px;
        box-shadow: 44px 0 0 #08101f;
    }
    .signal-avatar::after {
        width: 52px;
        height: 12px;
        left: 36px;
        bottom: 30px;
        border-radius: 999px;
        box-shadow: 0 0 16px rgba(255, 215, 0, 0.5);
    }
    .spark-ring {
        position: absolute;
        inset: -10px;
        border: 1px solid rgba(111, 241, 255, 0.4);
        border-radius: 32px;
        animation: pulseRing 2.2s ease-in-out infinite;
    }
    h1 {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: clamp(2rem, 7vw, 2.8rem);
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: linear-gradient(to right, #fff0a6, #63e8ff 55%, #ca85ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 16px rgba(99, 232, 255, 0.2);
    }
    p {
        color: var(--text-soft);
        font-size: 1rem;
        margin-top: 10px;
        text-align: center;
        max-width: 320px;
        line-height: 1.3;
    }
    .subtitle-chip {
        margin-top: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: #dcecff;
        font-family: 'Press Start 2P', 'Audiowide', monospace;
        font-size: 0.58rem;
        line-height: 1.5;
        letter-spacing: 0.08em;
    }
    .btn {
        margin-top: 26px;
        min-width: 200px;
        padding: 15px 24px;
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: 1rem;
        letter-spacing: 0.08em;
        color: #08101f;
        background: linear-gradient(180deg, #fff094, var(--brand-yellow));
        border: none;
        border-radius: 999px;
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.34);
        cursor: pointer;
        transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    }
    .btn:active {
        transform: scale(0.95);
        filter: brightness(1.06);
    }

    /* HUD */
    /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
    #hud {
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
    }
    .score-box {
        background: var(--panel-bg);
        padding: 8px 14px;
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 24px var(--panel-shadow), inset 0 0 0 1px rgba(255,255,255,0.03);
        font-family: 'Press Start 2P', 'Audiowide', monospace;
        font-size: 0.72rem;
        line-height: 1.5;
        text-transform: uppercase;
    }
    /* [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction */
    #boostBtn {
        position: absolute;
        bottom: 24px;
        right: 24px;
        width: 82px;
        height: 82px;
        border-radius: 50%;
        background:
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.22), rgba(255,255,255,0.06) 35%, rgba(3, 8, 19, 0.76) 100%);
        border: 2px solid rgba(111, 241, 255, 0.46);
        box-shadow: 0 10px 26px rgba(0,0,0,0.32), 0 0 18px rgba(0, 191, 255, 0.18);
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Press Start 2P', 'Audiowide', monospace;
        font-size: 0.62rem;
        line-height: 1.4;
        text-align: center;
        color: var(--text-main);
        backdrop-filter: blur(8px);
        touch-action: none;
    }
    #boostBtn.active {
        background: radial-gradient(circle, #63e8ff 0%, var(--brand-blue) 55%, #0a3a69 100%);
        box-shadow: 0 0 22px rgba(0, 191, 255, 0.66);
        color: #07111b;
    }
    
    /* Leaderboard */
    #leaderboard {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--panel-bg);
        padding: 10px 11px;
        border-radius: 14px;
        border: 1px solid rgba(202, 133, 255, 0.25);
        box-shadow: 0 10px 24px rgba(5, 8, 22, 0.32);
        font-family: 'Rajdhani', system-ui, sans-serif;
        font-size: 0.9rem;
        text-align: right;
        color: #d9e7fb;
        min-width: 122px;
    }
    #leaderboard div:first-child {
        color: var(--brand-yellow);
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: 0.85rem;
        margin-bottom: 4px;
    }

    #gameOverScreen h2 {
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: clamp(1.7rem, 7vw, 2.2rem);
        color: var(--danger);
        text-shadow: 0 0 14px rgba(255, 83, 120, 0.45);
        margin-bottom: 0;
    }
    #gameOverScreen p {
        margin-bottom: 0;
    }
    @keyframes pulseRing {
        0%, 100% { transform: scale(0.96); opacity: 0.6; }
        50% { transform: scale(1.04); opacity: 1; }
    }
    #feedbackTray {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 118px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
        pointer-events: none;
        z-index: 6;
    }
    .reaction-card {
        width: min(26vw, 112px);
        min-width: 80px;
        padding: 6px;
        border-radius: 18px;
        border: 1px solid rgba(111, 241, 255, 0.28);
        background: rgba(6, 10, 24, 0.74);
        box-shadow: 0 10px 24px rgba(4, 10, 22, 0.35);
        opacity: 0;
        transform: translateY(12px) scale(0.94);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .reaction-card.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    .reaction-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 12px;
    }
    .reaction-card span {
        display: block;
        margin-top: 6px;
        font-family: 'Press Start 2P', 'Audiowide', monospace;
        font-size: 0.5rem;
        line-height: 1.5;
        color: #f5fbff;
        text-align: center;
        text-transform: uppercase;
    }
    #statusBanner {
        position: absolute;
        left: 50%;
        top: 88px;
        transform: translateX(-50%) translateY(-10px);
        min-width: min(68vw, 260px);
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(7, 12, 27, 0.82);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 26px rgba(0,0,0,0.28);
        text-align: center;
        font-family: 'Audiowide', 'Rajdhani', sans-serif;
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        color: #eef7ff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 7;
    }
    #statusBanner.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    #statusBanner.alert {
        border-color: rgba(255, 83, 120, 0.4);
        color: #ffd4de;
    }
    @media (max-width: 640px) {
        .screen {
            justify-content: center;
        }
        #hud {
            padding: 12px;
        }
        .score-box {
            max-width: 46vw;
            font-size: 0.62rem;
            padding: 8px 10px;
        }
        #leaderboard {
            top: 12px;
            right: 12px;
            font-size: 0.82rem;
            min-width: 112px;
            padding: 8px 9px;
        }
        #boostBtn {
            right: 18px;
            bottom: 18px;
            width: 76px;
            height: 76px;
            font-size: 0.56rem;
        }
    }
</style>
</head>
<body>

<!-- Game Canvas -->
<canvas id="gameCanvas"></canvas>

<!-- UI Layer -->
<div id="uiLayer">
    <div id="hud" class="hidden">
        <div class="score-box">Signal: <span id="scoreVal">10</span></div>
        <div id="leaderboard">
            <div>TOP SIGNALS</div>
            <div id="lbList"></div>
        </div>
    </div>
    <!-- [agent-note][stage3] resolved-gif: burst-hit-and-fail-feedback -> catalogs/gifs.json -->
    <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
    <div id="statusBanner" aria-live="polite"></div>
    <div id="feedbackTray" aria-hidden="true">
        <div class="reaction-card" id="burstReaction">
            <img id="burstReactionImg" alt="Burst reaction loop" loading="lazy">
            <span>burst sync</span>
        </div>
        <div class="reaction-card" id="dangerReaction">
            <img id="dangerReactionImg" alt="Danger reaction loop" loading="lazy">
            <span>signal panic</span>
        </div>
    </div>
    <div id="boostBtn" class="hidden">BURST</div>
</div>

<!-- Start Screen -->
<div id="startScreen" class="screen">
    <div class="signal-avatar" aria-hidden="true">
        <div class="spark-ring"></div>
    </div>
    <h1>Neon Circuit</h1>
    <div class="subtitle-chip">SPARK EEL ONLINE</div>
    <p>Guide the prism runner, harvest live sparks, and sever rival trails inside the neon lattice.</p>
    <button class="btn" id="startBtn">ENTER GRID</button>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen" class="screen hidden">
    <h2>SIGNAL LOST</h2>
    <p>Final Signal: <span id="finalScore">0</span></p>
    <button class="btn" id="restartBtn">RE-ENTER</button>
</div>

<script>
/**
 * Neon Circuit - Single File HTML5 Game
 * No external libraries. Mobile optimized.
 */

// --- Configuration ---
const CONFIG = {
    mapWidth: 2000,
    mapHeight: 2000,
    baseSpeed: 3,
    boostSpeed: 6,
    turnSpeed: 0.08,
    startLength: 10,
    foodValue: 1,
    foodCount: 300,
    botCount: 8,
    colors: ['#FF0055', '#00FF55', '#00CCFF', '#FF9900', '#AA00FF', '#FFFF00'],
    brandPurple: '#6a0dad',
    brandYellow: '#ffd700'
};

// --- Global State ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
let animationId;
let lastTime = 0;
let gameState = 'start'; // start, playing, gameover

// Input State
const input = {
    x: 0,
    y: 0,
    active: false,
    boosting: false
};

// Game Objects
let player;
let bots = [];
let foods = [];
let particles = [];
let camera = { x: 0, y: 0 };

const MEDIA = {
    gifs: {
        burst: 'https://i.giphy.com/1zmG8avB83Uvm.webp',
        danger: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp'
    },
    audio: {
        loop: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3',
        pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3',
        boost: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
        impact: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3',
        defeat: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3',
        start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3'
    }
};

const ui = {
    statusBanner: document.getElementById('statusBanner'),
    burstReaction: document.getElementById('burstReaction'),
    burstReactionImg: document.getElementById('burstReactionImg'),
    dangerReaction: document.getElementById('dangerReaction'),
    dangerReactionImg: document.getElementById('dangerReactionImg')
};

const feedbackTimers = {
    status: null,
    burst: null,
    danger: null
};

const audioState = {
    unlocked: false,
    masterEnabled: true,
    bgm: null,
    sfx: {},
    lastPlayed: new Map()
};

function setupMedia() {
    ui.burstReactionImg.src = MEDIA.gifs.burst;
    ui.dangerReactionImg.src = MEDIA.gifs.danger;
    // [agent-note][stage4] resolved-font: primary=Audiowide secondary=Rajdhani accent=Press Start 2P via catalogs/fonts.json
}

function unlockAudio() {
    if (audioState.unlocked) return;
    audioState.unlocked = true;
    try {
        audioState.bgm = new Audio(MEDIA.audio.loop);
        audioState.bgm.loop = true;
        audioState.bgm.volume = 0.2;
        audioState.bgm.preload = 'auto';
        audioState.sfx = {
            pickup: createSfx(MEDIA.audio.pickup, 0.42),
            boost: createSfx(MEDIA.audio.boost, 0.38),
            impact: createSfx(MEDIA.audio.impact, 0.48),
            defeat: createSfx(MEDIA.audio.defeat, 0.45),
            start: createSfx(MEDIA.audio.start, 0.4)
        };
    } catch (err) {
        audioState.masterEnabled = false;
    }
}

function createSfx(src, volume) {
    const audio = new Audio(src);
    audio.preload = 'auto';
    audio.volume = volume;
    return audio;
}

function playSfx(name, cooldown = 0) {
    if (!audioState.masterEnabled || !audioState.unlocked) return;
    const audio = audioState.sfx[name];
    if (!audio) return;
    const now = performance.now();
    const last = audioState.lastPlayed.get(name) || 0;
    if (cooldown && now - last < cooldown) return;
    audioState.lastPlayed.set(name, now);
    try {
        audio.pause();
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch (err) {}
}

function syncBgm(shouldPlay) {
    if (!audioState.masterEnabled || !audioState.unlocked || !audioState.bgm) return;
    try {
        if (shouldPlay) {
            audioState.bgm.play().catch(() => {});
        } else {
            audioState.bgm.pause();
        }
    } catch (err) {}
}

function showStatus(message, tone = 'info', duration = 1200) {
    ui.statusBanner.textContent = message;
    ui.statusBanner.classList.toggle('alert', tone === 'alert');
    ui.statusBanner.classList.add('visible');
    clearTimeout(feedbackTimers.status);
    feedbackTimers.status = setTimeout(() => {
        ui.statusBanner.classList.remove('visible');
    }, duration);
}

function showReaction(kind, duration = 1400) {
    const card = kind === 'danger' ? ui.dangerReaction : ui.burstReaction;
    clearTimeout(feedbackTimers[kind]);
    card.classList.add('visible');
    feedbackTimers[kind] = setTimeout(() => {
        card.classList.remove('visible');
    }, duration);
}

    function handleFirstGesture() {
        unlockAudio();
        if (gameState === 'playing') syncBgm(true);
    }

    // [agent-note][stage4] repaired: mobile-tap-safety | element: global-ui | action: native tap lifecycle preserved outside gameplay surface

// --- Utilities ---
function random(min, max) { return Math.random() * (max - min) + min; }
function randomInt(min, max) { return Math.floor(random(min, max)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

// --- Classes ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = random(2, 5);
        this.life = 1.0;
        const angle = random(0, Math.PI * 2);
        const speed = random(1, 4);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.03;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Food {
    constructor(x, y, val = 1) {
        this.x = x || random(0, CONFIG.mapWidth);
        this.y = y || random(0, CONFIG.mapHeight);
        this.val = val;
        this.color = CONFIG.colors[randomInt(0, CONFIG.colors.length)];
        this.size = val > 1 ? 6 : 3;
        // Animation offset
        this.animOffset = random(0, Math.PI * 2);
    }
    draw(ctx, time) {
        const pulse = Math.sin(time * 0.005 + this.animOffset) * 1 + this.size;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 5;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Snake {
    constructor(isPlayer = false) {
        this.isPlayer = isPlayer;
        this.x = random(200, CONFIG.mapWidth - 200);
        this.y = random(200, CONFIG.mapHeight - 200);
        this.angle = random(0, Math.PI * 2);
        this.targetAngle = this.angle;
        this.speed = CONFIG.baseSpeed;
        this.radius = 10;
        this.color = isPlayer ? CONFIG.brandYellow : CONFIG.colors[randomInt(0, CONFIG.colors.length)];
        this.headColor = isPlayer ? CONFIG.brandPurple : '#FFFFFF';
        this.glowColor = isPlayer ? '#63e8ff' : this.color;
        
        // Body mechanics
        // Instead of storing every point, we store a path history
        // The body segments are placed at fixed distances along this path
        this.path = []; // {x, y}
        this.length = CONFIG.startLength;
        this.gap = 4; // Distance between segments in path indices
        
        // Initialize path
        for(let i=0; i < this.length * this.gap; i++) {
            this.path.push({ x: this.x, y: this.y });
        }
        
        this.dead = false;
        this.name = isPlayer ? "You" : "Node " + randomInt(100, 999);
        
        // AI Logic
        this.aiTimer = 0;
        this.aiState = 'wander'; // wander, turn
    }

    update() {
        if (this.dead) return;

        // Steering
        if (this.isPlayer) {
            // Player steering via input
            if (input.active) {
                // Calculate angle from center of screen (where snake head is visually) to touch
                // Actually, in .io games, usually it's angle from center of screen to mouse
                // OR angle from snake position to world touch position.
                // Since camera centers on player, center of screen is player.
                const dx = input.x - window.innerWidth / 2;
                const dy = input.y - window.innerHeight / 2;
                this.targetAngle = Math.atan2(dy, dx);
            }
            
            // Boost logic
            if (input.boosting && this.length > 5) {
                this.speed = CONFIG.boostSpeed;
                // Cost: drop food occasionally
                if (Math.random() < 0.1) {
                    this.length--;
                    this.path.splice(0, this.gap); // Remove tail
                    // Drop food behind
                    const tail = this.path[0];
                    if(tail) foods.push(new Food(tail.x, tail.y, 1));
                }
            } else {
                this.speed = CONFIG.baseSpeed;
            }
        } else {
            // AI Steering
            this.aiBehavior();
        }

        // Smooth rotation
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += clamp(diff, -CONFIG.turnSpeed, CONFIG.turnSpeed);

        // Move Head
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Wall collisions
        if (this.x < 0 || this.x > CONFIG.mapWidth || this.y < 0 || this.y > CONFIG.mapHeight) {
            this.die();
            return;
        }

        // Update Path
        // We push new head position to end of array
        // We shift from start if array is too long for current length
        // To make speed changes look good, we push points based on distance traveled?
        // Simple approach: Push every frame. If boosting, we push points further apart?
        // Better: Push every frame. The "gap" defines how many frames back a segment is.
        // If speed doubles, points are further apart physically.
        this.path.push({x: this.x, y: this.y});
        
        // Maintain path length
        const requiredPathLength = this.length * this.gap;
        while (this.path.length > requiredPathLength) {
            this.path.shift();
        }
    }

    aiBehavior() {
        this.aiTimer--;
        if (this.aiTimer <= 0) {
            this.aiTimer = randomInt(30, 100);
            
            // Simple logic: Avoid edges
            const margin = 100;
            if (this.x < margin) this.targetAngle = 0;
            else if (this.x > CONFIG.mapWidth - margin) this.targetAngle = Math.PI;
            else if (this.y < margin) this.targetAngle = Math.PI / 2;
            else if (this.y > CONFIG.mapHeight - margin) this.targetAngle = -Math.PI / 2;
            else {
                // Random wander
                this.targetAngle = random(0, Math.PI * 2);
            }
        }
        // AI Boost rarely
        this.speed = (Math.random() < 0.01 && this.length > 10) ? CONFIG.boostSpeed : CONFIG.baseSpeed;
    }

    draw(ctx) {
        if (this.dead) return;

        // Draw Body
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Draw from tail to head
        // We iterate backwards through segments
        for (let i = 0; i < this.length; i++) {
            const index = this.path.length - 1 - (i * this.gap);
            if (index < 0) break;
            const pt = this.path[index];
            const ratio = 1 - (i / Math.max(this.length, 1));
            const size = this.radius * (1 - (i / (this.length * 1.5))); 
            const drawSize = Math.max(size, 4);

            ctx.shadowBlur = this.isPlayer ? 18 : 10;
            ctx.shadowColor = this.glowColor;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, drawSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = `rgba(255,255,255,${this.isPlayer ? 0.12 : 0.08 + ratio * 0.08})`;
            ctx.beginPath();
            ctx.arc(pt.x - drawSize * 0.22, pt.y - drawSize * 0.22, Math.max(drawSize * 0.32, 1.8), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Draw Head
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.isPlayer) {
            ctx.shadowBlur = 18;
            ctx.shadowColor = this.glowColor;
            ctx.fillStyle = '#fff2ad';
            ctx.beginPath();
            ctx.moveTo(16, 0);
            ctx.lineTo(-2, -13);
            ctx.lineTo(-15, -8);
            ctx.lineTo(-15, 8);
            ctx.lineTo(-2, 13);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = this.headColor;
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(-3, -9);
            ctx.lineTo(-11, -5);
            ctx.lineTo(-11, 5);
            ctx.lineTo(-3, 9);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#08101f';
            ctx.beginPath();
            ctx.arc(4, -4.5, 2.8, 0, Math.PI * 2);
            ctx.arc(4, 4.5, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#63e8ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(-17, 0);
            ctx.stroke();
        } else {
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.headColor;
            ctx.fillStyle = this.headColor;
            ctx.fillRect(-12, -12, 24, 24);

            ctx.fillStyle = '#09111f';
            ctx.fillRect(1, -8, 7, 6);
            ctx.fillRect(1, 2, 7, 6);
        }

        ctx.restore();
        ctx.shadowBlur = 0;
    }

    checkCollisions(allSnakes) {
        if (this.dead) return;

        // 1. Food Collision
        for (let i = foods.length - 1; i >= 0; i--) {
            const f = foods[i];
            if (dist(this.x, this.y, f.x, f.y) < this.radius + f.size + 5) {
                // Eat
                this.length += 1; // Grow slower? Or 1 length per food?
                // Create particle
                // particles.push(new Particle(f.x, f.y, f.color));
                foods.splice(i, 1);
                if (this.isPlayer) {
                    playSfx('pickup', 70);
                    if (f.val > 1) {
                        showStatus('MEGA SPARK', 'info', 800);
                        showReaction('burst', 950);
                    }
                }
                // Respawn food elsewhere to keep map busy
                if (Math.random() < 0.5) foods.push(new Food());
            }
        }

        // 2. Snake Collision (Head vs Body)
        for (let other of allSnakes) {
            if (other === this || other.dead) continue;

            // Check head against other's body points
            // Optimization: Only check every nth point
            let hit = false;
            // Iterate body segments
            for (let i = 0; i < other.length; i++) {
                const index = other.path.length - 1 - (i * other.gap);
                if (index < 0) break;
                const pt = other.path[index];
                
                if (dist(this.x, this.y, pt.x, pt.y) < this.radius + other.radius - 2) {
                    hit = true;
                    break;
                }
            }

            if (hit) {
                this.die();
                return; // Dead, stop checking
            }
        }
    }

    die() {
        this.dead = true;
        
        // Spawn food from body
        // Drop ~50% of mass as food
        for (let i = 0; i < this.length; i+=2) {
            const index = this.path.length - 1 - (i * this.gap);
            if (index >= 0) {
                const pt = this.path[index];
                foods.push(new Food(pt.x, pt.y, 2));
            }
        }
        
        // Visual explosion
        for(let k=0; k<10; k++) {
            particles.push(new Particle(this.x, this.y, this.color));
        }

        if (this.isPlayer) {
            playSfx('impact', 0);
        } else {
            playSfx('impact', 120);
        }

        if (this.isPlayer) {
            endGame();
        } else {
            // Respawn bot after delay
            setTimeout(() => {
                const newBot = new Snake(false);
                // Find empty slot in bots array or push
                const idx = bots.indexOf(this);
                if(idx !== -1) bots[idx] = newBot;
            }, 2000);
        }
    }
}

// --- Engine ---

function init() {
    setupMedia();
    resize();
    window.addEventListener('resize', resize);
    
    // Bind Controls
    const touchArea = document.getElementById('uiLayer');
    
    // Touch/Mouse Move
    const handleMove = (e) => {
        if (gameState !== 'playing') return;
        e.preventDefault();
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        input.x = clientX;
        input.y = clientY;
        input.active = true;
    };

    document.addEventListener('pointerdown', handleFirstGesture, { passive: true });
    document.addEventListener('keydown', handleFirstGesture, { passive: true });
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('touchmove', handleMove, { passive: false });
    document.addEventListener('touchstart', (e) => {
        if(e.target.id !== 'boostBtn') handleMove(e);
    }, { passive: false });
    
    // Boost Button
    const boostBtn = document.getElementById('boostBtn');
    const startBoost = (e) => {
        e.preventDefault();
        e.stopPropagation();
        handleFirstGesture();
        input.boosting = true;
        boostBtn.classList.add('active');
        playSfx('boost', 180);
        showStatus('BURST CHANNEL OPEN', 'info', 900);
        showReaction('burst', 900);
    };
    const endBoost = (e) => {
        e.preventDefault();
        e.stopPropagation();
        input.boosting = false;
        boostBtn.classList.remove('active');
    };
    
    boostBtn.addEventListener('mousedown', startBoost);
    boostBtn.addEventListener('touchstart', startBoost, { passive: false });
    boostBtn.addEventListener('mouseup', endBoost);
    boostBtn.addEventListener('touchend', endBoost);
    
    // UI Buttons
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            syncBgm(false);
        } else if (gameState === 'playing') {
            syncBgm(true);
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function resetGame() {
    player = new Snake(true);
    bots = [];
    foods = [];
    particles = [];
    
    // Init Bots
    for(let i=0; i<CONFIG.botCount; i++) {
        bots.push(new Snake(false));
    }
    
    // Init Food
    for(let i=0; i<CONFIG.foodCount; i++) {
        foods.push(new Food());
    }
}

function startGame() {
    handleFirstGesture();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('boostBtn').classList.remove('hidden');
    
    resetGame();
    gameState = 'playing';
    lastTime = performance.now();
    playSfx('start', 0);
    showStatus('GRID LIVE', 'info', 1100);
    syncBgm(true);
}

function endGame() {
    gameState = 'gameover';
    syncBgm(false);
    playSfx('defeat', 0);
    showStatus('SIGNAL LOST', 'alert', 1800);
    showReaction('danger', 1800);
    document.getElementById('finalScore').innerText = player.length;
    setTimeout(() => {
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('boostBtn').classList.add('hidden');
    }, 1000); // Slight delay to see death
}

function drawGrid(ctx) {
    const gridSize = 50;
    const offsetX = -camera.x % gridSize;
    const offsetY = -camera.y % gridSize;
    
    ctx.strokeStyle = 'rgba(99, 232, 255, 0.12)';
    ctx.lineWidth = 1;
    
    ctx.beginPath();
    // Vertical lines
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
    }
    // Horizontal lines
    for (let y = offsetY; y < canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // Draw Map Borders
    ctx.strokeStyle = 'rgba(255, 83, 120, 0.75)';
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(255, 83, 120, 0.35)';
    ctx.lineWidth = 4;
    ctx.strokeRect(-camera.x, -camera.y, CONFIG.mapWidth, CONFIG.mapHeight);
    ctx.shadowBlur = 0;
}

function updateLeaderboard() {
    // Combine player and bots
    let all = [...bots];
    if (!player.dead) all.push(player);
    
    // Sort by length
    all.sort((a, b) => b.length - a.length);
    
    // Take top 5
    const top = all.slice(0, 5);
    const list = document.getElementById('lbList');
    list.innerHTML = top.map((s, i) => {
        const color = s.isPlayer ? CONFIG.brandYellow : '#fff';
        return `<div style="color:${color}">${i+1}. ${s.name} (${s.length})</div>`;
    }).join('');
}

function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;

    // Clear Screen
    const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGradient.addColorStop(0, '#040813');
    bgGradient.addColorStop(1, '#0d1326');
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'playing' || gameState === 'gameover') {
        
        // Update Logic
        if (gameState === 'playing') {
            player.update();
            player.checkCollisions(bots);
            
            // Camera follows player
            // Smooth camera?
            const targetCamX = player.x - canvas.width / 2;
            const targetCamY = player.y - canvas.height / 2;
            // Lerp camera
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;
            
            // Update UI
            document.getElementById('scoreVal').innerText = player.length;
            if (time % 60 === 0) updateLeaderboard(); // Update periodically
        }

        bots.forEach(bot => {
            bot.update();
            bot.checkCollisions([...bots, player]);
        });
        
        particles.forEach((p, i) => {
            p.update();
            if(p.life <= 0) particles.splice(i, 1);
        });

        // Render World
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        
        // Draw Grid
        // We need to pass camera transform manually to grid or draw it before translate?
        // Actually grid moves with camera. But infinite grid effect is handled in drawGrid using modulus.
        // So we should NOT translate grid context if we use the modulus trick.
        // Let's pop context for grid.
        ctx.restore();
        drawGrid(ctx);
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw Food
        foods.forEach(f => f.draw(ctx, time));
        
        // Draw Bots
        bots.forEach(b => b.draw(ctx));
        
        // Draw Player
        player.draw(ctx);
        
        // Draw Particles
        particles.forEach(p => p.draw(ctx));

        ctx.restore();
    }

    requestAnimationFrame(gameLoop);
}

// Start
init();

</script>
