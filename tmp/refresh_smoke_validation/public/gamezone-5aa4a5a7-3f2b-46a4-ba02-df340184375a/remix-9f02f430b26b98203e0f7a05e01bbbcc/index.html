<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Neural Dive FPV</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');

        :root {
            --cyan-100: rgba(224, 255, 255, 0.8);
            --cyan-300: #67e8f9;
            --cyan-400: #22d3ee;
            --cyan-500: #06b6d4;
            --cyan-600: #0891b2;
            --blue-600: #2563eb;
            --purple-300: #c4b5fd;
            --purple-400: rgba(196, 181, 253, 0.5);
            --purple-500-5: rgba(168, 85, 247, 0.05);
            --purple-500-30: rgba(168, 85, 247, 0.3);
            --red-300-50: rgba(252, 165, 165, 0.5);
            --red-500: #ef4444;
            --red-500-40: rgba(239, 68, 68, 0.4);
            --red-950-90: rgba(69, 10, 10, 0.9);
            --black-80: rgba(0, 0, 0, 0.8);
            --black-90: rgba(0, 0, 0, 0.9);
            --white-5: rgba(255, 255, 255, 0.05);
            --white: #ffffff;
            --bg-deep: #020617;
            --bg-mid: #071629;
            --panel-edge: rgba(103, 232, 249, 0.28);
            --glow-soft: rgba(34, 211, 238, 0.22);
            --glow-hot: rgba(167, 139, 250, 0.3);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            touch-action: manipulation; 
            font-family: 'Exo 2', system-ui, sans-serif; 
            background:
                radial-gradient(circle at top, rgba(6, 182, 212, 0.16), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 55%);
            color: var(--cyan-400);
            user-select: none;
            -webkit-user-select: none;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none;
        }

        /* UI Elements */
        .hud-text {
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8);
            letter-spacing: 0.04em;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(7, 22, 41, 0.9), rgba(2, 6, 23, 0.92));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 30px var(--glow-soft),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(103, 232, 249, 0.08), transparent 45%),
                linear-gradient(315deg, rgba(167, 139, 250, 0.08), transparent 50%);
            pointer-events: none;
        }

        .btn-touch {
            background: linear-gradient(180deg, rgba(8, 30, 54, 0.9), rgba(6, 10, 24, 0.96));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 22px rgba(0, 255, 255, 0.08);
        }
        .btn-touch:active, .btn-touch.pressed {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.8);
            transform: scale(0.96);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        .btn-touch::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        /* CRT/Scanline Effects */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.3;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .inset-0 { inset: 0; }
        .top-0 { top: 0; }
        .left-0 { left: 0; }
        .bottom-0 { bottom: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .bottom-24 { bottom: 6rem; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .w-32 { width: 8rem; }
        .h-20 { height: 5rem; }
        .h-32 { height: 8rem; }
        .w-12 { width: 3rem; }
        .h-1 { height: 0.25rem; }
        .w-0 { width: 0; }
        .max-w-xs { max-width: 20rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }
        .ml-1 { margin-left: 0.25rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .items-baseline { align-items: baseline; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .rounded { border-radius: 0.25rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-tl-lg { border-top-left-radius: 0.5rem; }
        .rounded-tr-lg { border-top-right-radius: 0.5rem; }
        .rounded-bl-lg { border-bottom-left-radius: 0.5rem; }
        .rounded-br-lg { border-bottom-right-radius: 0.5rem; }
        .border-l-2 { border-left: 2px solid currentColor; }
        .border-r-2 { border-right: 2px solid currentColor; }
        .border-t-2 { border-top: 2px solid currentColor; }
        .border-b-2 { border-bottom: 2px solid currentColor; }
        .border-cyan-500 { color: var(--cyan-500); }
        .border-cyan-500\/30 { border-color: rgba(6, 182, 212, 0.3); }
        .border-purple-500\/30 { border-color: var(--purple-500-30); }
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-6xl { font-size: 3.75rem; }
        .text-\[10px\] { font-size: 10px; }
        .font-bold { font-weight: 700; }
        .font-display { font-family: 'Orbitron', 'Exo 2', system-ui, sans-serif; }
        .font-ui { font-family: 'Exo 2', system-ui, sans-serif; }
        .text-transparent { color: transparent; }
        .text-white { color: var(--white); }
        .text-black { color: #000; }
        .text-cyan-100\/80 { color: var(--cyan-100); }
        .text-cyan-300 { color: var(--cyan-300); }
        .text-cyan-400 { color: var(--cyan-400); }
        .text-cyan-600 { color: var(--cyan-600); }
        .text-purple-300 { color: var(--purple-300); }
        .text-purple-400\/50 { color: var(--purple-400); }
        .text-red-300\/50 { color: var(--red-300-50); }
        .text-red-500 { color: var(--red-500); }
        .tracking-tighter { letter-spacing: -0.05em; }
        .tracking-widest { letter-spacing: 0.25em; }
        .tracking-\[0\.3em\] { letter-spacing: 0.3em; }
        .opacity-50 { opacity: 0.5; }
        .opacity-70 { opacity: 0.7; }
        .bg-black\/80 { background: var(--black-80); }
        .bg-red-950\/90 { background: var(--red-950-90); }
        .bg-white { background: var(--white); }
        .bg-white\/5 { background: var(--white-5); }
        .bg-cyan-700 { background: #0e7490; }
        .hover\:bg-cyan-600:hover { background: #0891b2; }
        .bg-purple-500\/5 { background: var(--purple-500-5); }
        .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--tw-gradient-from), var(--tw-gradient-to)); }
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-from), var(--tw-gradient-via), var(--tw-gradient-to)); }
        .bg-gradient-to-t { background-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .from-cyan-300 { --tw-gradient-from: var(--cyan-300); }
        .to-blue-600 { --tw-gradient-to: var(--blue-600); }
        .from-transparent { --tw-gradient-from: transparent; }
        .via-cyan-500 { --tw-gradient-via: var(--cyan-500); }
        .to-transparent { --tw-gradient-to: transparent; }
        .bg-clip-text { -webkit-background-clip: text; background-clip: text; }
        .cursor-pointer { cursor: pointer; }
        .overflow-hidden { overflow: hidden; }
        .shadow-lg { box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .shadow-\[0_0_15px_rgba\(0\,255\,255\,0\.3\)\] { box-shadow: 0 0 15px rgba(0,255,255,0.3); }
        .shadow-\[0_0_50px_rgba\(255\,0\,0\,0\.2\)\] { box-shadow: 0 0 50px rgba(255,0,0,0.2); }
        .transition { transition: all 0.15s ease; }
        .transition-all { transition: all 0.075s ease; }
        .duration-75 { transition-duration: 75ms; }
        .active\:scale-95:active { transform: scale(0.95); }
        .space-y-4 > * + * { margin-top: 1rem; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-30 { z-index: 30; }
        .z-50 { z-index: 50; }

    </style>
</head>
<body>
    <div id="game-container" class="relative w-full h-full text-cyan-400">
        <canvas id="gameCanvas"></canvas>
        <div class="vignette"></div>
        <div class="scanlines"></div>
        
        <!-- HUD Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none z-30">
            
            <!-- Top HUD -->
            <div id="hud" class="absolute top-0 left-0 w-full flex justify-between p-4 pt-safe hud-text hidden">
                <div class="flex flex-col">
                    <span class="text-xs text-cyan-600 tracking-widest">SYNC RATE</span>
                    <span class="text-3xl font-bold" id="score">0</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-xs text-cyan-600 tracking-widest">VELOCITY</span>
                    <div class="flex items-baseline">
                        <span class="text-3xl font-bold" id="speed-display">0</span>
                        <span class="text-sm ml-1 opacity-70">MB/s</span>
                    </div>
                </div>
            </div>

            <!-- Visor Overlay (Corners) -->
            <div class="absolute inset-0 pointer-events-none opacity-50 hidden" id="visor-overlay">
                <div class="absolute top-4 left-4 w-16 h-16 border-l-2 border-t-2 border-cyan-500 rounded-tl-lg"></div>
                <div class="absolute top-4 right-4 w-16 h-16 border-r-2 border-t-2 border-cyan-500 rounded-tr-lg"></div>
                <div class="absolute bottom-24 left-4 w-16 h-16 border-l-2 border-b-2 border-cyan-500 rounded-bl-lg"></div>
                <div class="absolute bottom-24 right-4 w-16 h-16 border-r-2 border-b-2 border-cyan-500 rounded-br-lg"></div>
            </div>

            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-auto bg-black/80 z-50">
                <div class="glass-panel p-8 rounded-2xl text-center max-w-xs w-full mx-4 border-cyan-500/30">
                    <h1 class="text-4xl font-bold font-display text-transparent bg-clip-text bg-gradient-to-b from-cyan-300 to-blue-600 mb-2 tracking-tighter">NEURAL DIVE</h1>
                    <div class="text-xs text-purple-300 tracking-widest mb-2 font-display">GLITCH FOX // SYNTH-RUNNER</div>
                    <div class="h-px w-full bg-gradient-to-r from-transparent via-cyan-500 to-transparent mb-6"></div>
                    
                        <div class="space-y-4 mb-8 text-sm text-cyan-100/80 font-ui">
                            <div class="flex items-center justify-between bg-white/5 p-3 rounded">
                                <span>HOLD <b class="text-cyan-300">RUN</b></span>
                                <span class="text-xs opacity-50">BUILD SPEED</span>
                            </div>
                            <div class="flex items-center justify-between bg-white/5 p-3 rounded">
                                <span>TAP <b class="text-purple-300">JUMP</b></span>
                                <span class="text-xs opacity-50">CLEAR BARRIERS</span>
                            </div>
                        </div>

                    <button id="start-btn" class="w-full bg-cyan-700 hover:bg-cyan-600 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(0,255,255,0.3)] transition active:scale-95 tracking-widest">
                        JACK IN
                    </button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col justify-center items-center pointer-events-auto bg-red-950/90 z-50">
                <div class="glass-panel p-8 rounded-2xl text-center w-full max-w-xs border-red-500/40 shadow-[0_0_50px_rgba(255,0,0,0.2)]">
                    <h2 class="text-3xl font-bold text-red-500 mb-2 tracking-widest animate-pulse-fast">SIGNAL LOST</h2>
                    <div class="text-6xl font-bold text-white mb-2" id="finalScore">0</div>
                    <div class="text-xs text-red-300/50 tracking-[0.3em] mb-8">TOTAL SYNC RATE BANKED</div>
                    
                    <button id="restart-btn" class="w-full bg-white text-black font-bold py-4 rounded-xl shadow-lg active:scale-95 transition tracking-widest">
                        REBOOT SYSTEM
                    </button>
                </div>
            </div>

            <!-- [agent-note][stage3] resolved-gif: jump/crash feedback -> catalogs/gifs.json -->
            <div id="feedback-layer" class="hidden absolute top-4 right-4 pointer-events-none z-30">
                <img id="feedback-gif" class="w-16 h-16 rounded-xl shadow-[0_0_15px_rgba(0,255,255,0.3)]" alt="Reaction feedback">
            </div>

            <!-- Controls (Bottom) -->
            <div id="controls" class="absolute bottom-0 w-full h-32 pb-safe flex justify-between items-center px-6 pointer-events-auto hidden bg-gradient-to-t from-black/80 to-transparent">
                <div id="btn-run" class="btn-touch w-32 h-20 flex flex-col items-center justify-center cursor-pointer">
                    <span class="text-xl font-bold text-cyan-300">RUN</span>
                    <div class="w-12 h-1 bg-cyan-500/30 mt-1 rounded-full overflow-hidden">
                        <div id="run-bar" class="h-full bg-cyan-400 w-0 transition-all duration-75"></div>
                    </div>
                </div>
                
                <div id="btn-jump" class="btn-touch w-32 h-20 flex flex-col items-center justify-center cursor-pointer border-purple-500/30 bg-purple-500/5">
                    <span class="text-xl font-bold text-purple-300">JUMP</span>
                    <span class="text-[10px] text-purple-400/50">SPACE / UP</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    /* 
       Architecture:
       - Single-file module pattern
       - First-Person View logic in project()
       - Strict anti-spam logic in update()
    */
    
    document.addEventListener('DOMContentLoaded', () => {
        // --- ASSETS & MEDIA ---
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_02.mp3",
                jump: "https://gamezone-virid.vercel.app/assets/audios/sfx/jump_02.mp3",
                land: "https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3",
                speed: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3",
                restart: "https://gamezone-virid.vercel.app/assets/audios/ui/resume_02.mp3"
            },
            gifs: {
                jump: "https://i.giphy.com/3o6YgaiHLlJ9020xUc.webp",
                crash: "https://i.giphy.com/roB5nN2qNNfhUKcprN.webp"
            }
        };

        const VISUAL_THEME = {
            runnerCore: '#67e8f9',
            runnerGlow: '#a78bfa',
            hazardCore: '#fb7185',
            hazardEdge: '#f43f5e',
            laneGlow: 'rgba(34, 211, 238, 0.14)'
        };

        class AudioSystem {
            constructor() {
                this.enabled = true;
                this.unlocked = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.lastPlayed = {};
                const volumes = {
                    start: 0.45,
                    jump: 0.45,
                    land: 0.28,
                    speed: 0.18,
                    crash: 0.6,
                    restart: 0.4
                };
                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    this.sfx[k] = new Audio(v);
                    this.sfx[k].volume = volumes[k] ?? 0.4;
                    this.sfx[k].preload = 'auto';
                }
            }
            unlock() {
                this.unlocked = true;
            }
            playBGM() {
                if (this.enabled && this.unlocked) {
                    this.bgm.play().catch(() => {});
                }
            }
            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }
            playSFX(key, debounceMs = 0) {
                if (!this.enabled || !this.unlocked) return;
                const now = performance.now();
                if (debounceMs && this.lastPlayed[key] && now - this.lastPlayed[key] < debounceMs) return;
                this.lastPlayed[key] = now;
                const s = this.sfx[key];
                if (s) {
                    s.currentTime = 0;
                    s.play().catch(() => {});
                }
            }
        }
        const audio = new AudioSystem();

        const feedbackLayer = document.getElementById('feedback-layer');
        const feedbackGif = document.getElementById('feedback-gif');
        let feedbackTimer = null;
        function showFeedback(type, duration = 900) {
            const src = ASSETS.gifs[type];
            if (!src || !feedbackLayer || !feedbackGif) return;
            feedbackGif.src = src;
            feedbackGif.alt = type === 'crash' ? 'Impact reaction' : 'Jump reaction';
            feedbackLayer.classList.remove('hidden');
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(() => {
                feedbackLayer.classList.add('hidden');
            }, duration);
        }

        // --- GAME CONSTANTS ---
        const CANVAS = document.getElementById('gameCanvas');
        const CTX = CANVAS.getContext('2d', { alpha: false }); // Optimize
        
        // World Physics
        const GRAVITY = 0.9;
        const JUMP_FORCE = 16;
        const MAX_SPEED = 1.2;
        const ACCEL = 0.02;
        const DECEL = 0.04;
        const BASE_EYE_HEIGHT = 120; // Camera height from ground when standing
        
        // State
        let state = {
            active: false,
            score: 0,
            width: 0,
            height: 0,
            frameCount: 0,
            
            // Player
            y: 0,       // Height off ground
            vy: 0,      // Vertical velocity
            grounded: true,
            
            // World
            speed: 0,   // Current forward speed (0 to MAX_SPEED)
            distance: 0, // Total distance traveled
            lastSpawnZ: 0, // Z position where last obstacle was spawned
            
            // Objects
            obstacles: [], // { z, width, height, type }
            particles: []  // { x, y, z, speed } for speed lines
        };

        // Inputs
        let input = { run: false, jump: false };

        // --- RESIZE ---
        function resize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            CANVAS.width = state.width;
            CANVAS.height = state.height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- INPUT HANDLERS ---
        const btnRun = document.getElementById('btn-run');
        const btnJump = document.getElementById('btn-jump');
        const runBar = document.getElementById('run-bar');

        const setRun = (val) => {
            input.run = val;
            if (val) {
                btnRun.classList.add('pressed');
                runBar.style.width = '100%';
            } else {
                btnRun.classList.remove('pressed');
                runBar.style.width = '0%';
            }
        };

        const doJump = () => {
            if (!state.active) return;
            if (state.grounded) {
                state.vy = JUMP_FORCE;
                state.grounded = false;
                audio.playSFX('jump');
                showFeedback('jump', 720);
                btnJump.classList.add('pressed');
                setTimeout(() => btnJump.classList.remove('pressed'), 150);
            }
        };

        // Touch
        btnRun.addEventListener('touchstart', (e) => { e.preventDefault(); setRun(true); });
        btnRun.addEventListener('touchend', (e) => { e.preventDefault(); setRun(false); });
        btnRun.addEventListener('mousedown', (e) => { setRun(true); });
        btnRun.addEventListener('mouseup', (e) => { setRun(false); });
        
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        btnJump.addEventListener('mousedown', (e) => { doJump(); });

        // Keyboard (Backup)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') doJump();
            if (e.code === 'ArrowRight' || e.code === 'KeyD') setRun(true);
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') setRun(false);
        });

        // --- CORE LOGIC ---
        function resetGame() {
            state.active = true;
            state.score = 0;
            state.y = 0;
            state.vy = 0;
            state.grounded = true;
            state.speed = 0;
            state.distance = 0;
            state.lastSpawnZ = -1000;
            state.obstacles = [];
            state.particles = [];
            
            document.getElementById('score').innerText = '0';
            document.getElementById('speed-display').innerText = '0';
        }

        function update() {
            if (!state.active) return;

            // 1. Speed Physics
            if (input.run) {
                const wasBoosting = state.speed > 0.7;
                state.speed = Math.min(state.speed + ACCEL, MAX_SPEED);
                if (!wasBoosting && state.speed > 0.7) {
                    audio.playSFX('speed', 240);
                }
            } else {
                state.speed = Math.max(state.speed - DECEL, 0);
            }

            // 2. Movement
            const moveSpeed = state.speed * 40; // World units per frame
            state.distance += moveSpeed;
            state.score += Math.floor(state.speed * 10);

            // 3. Player Physics (Jump)
            if (!state.grounded) {
                state.y += state.vy;
                state.vy -= GRAVITY;
                
                    if (state.y <= 0) {
                        state.y = 0;
                        state.vy = 0;
                        state.grounded = true;
                        audio.playSFX('land', 120);
                    }
            }

            // 4. Obstacle Spawning (Anti-Spam Logic)
            // Calculate safe gap based on physics
            // Time to jump and land = (2 * JUMP_FORCE) / GRAVITY approx 35 frames
            // Distance covered = moveSpeed * 35
            // We add a safety buffer of 400 units + speed scaling
            const jumpDuration = (2 * JUMP_FORCE) / GRAVITY; 
            const safeJumpDist = jumpDuration * moveSpeed;
            const minGap = safeJumpDist + 600; // Base safety buffer

            // Only spawn if we have moved enough past the last spawn
            // And only if we are moving fast enough to make it interesting
            if (state.speed > 0.2) {
                // Determine current world Z position (conceptually)
                // We track relative distance. 
                // Let's say we spawn at Z=2500 relative to camera.
                // We need to know if the LAST spawned object is far enough away.
                // Since we move obstacles towards us, we can check the Z of the last obstacle in the array.
                
                let lastObsZ = 0;
                if (state.obstacles.length > 0) {
                    // The newest obstacle is at the end of the array
                    lastObsZ = state.obstacles[state.obstacles.length - 1].z;
                } else {
                    lastObsZ = -9999;
                }

                // The new spawn would be at Z = 2500
                const spawnZ = 2500;
                
                // Distance between new spawn and last spawn must be > minGap
                if ((spawnZ - lastObsZ) > minGap) {
                    // Random chance to spawn, but guaranteed if gap gets huge
                    if (Math.random() < 0.1) {
                        spawnObstacle(spawnZ);
                    }
                }
            }

            // 5. Update Obstacles
            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                let obs = state.obstacles[i];
                obs.z -= moveSpeed;

                // Collision Logic (First Person)
                // Player is at Z=0 (camera).
                // Obstacle depth is approx 100.
                // If obstacle Z crosses 0, check height.
                
                const obsDepth = 80;
                const obsWidth = 100;
                const playerWidth = 60;

                // Check Z overlap
                if (obs.z < 50 && obs.z > -50) {
                    // Check Y overlap
                    // Obstacle is on ground (0 to obs.height)
                    // Player is at state.y
                    // To be safe, player bottom must be > obs height
                    if (state.y < obs.height) {
                        gameOver();
                    }
                }

                // Remove passed
                if (obs.z < -200) {
                    state.obstacles.splice(i, 1);
                }
            }

            // 6. Update Particles (Speed Lines)
            if (state.frameCount % 5 === 0 && state.speed > 0.5) {
                state.particles.push({
                    x: (Math.random() - 0.5) * state.width * 2,
                    y: (Math.random() - 0.5) * state.height * 2,
                    z: 2000,
                    speed: 20 + Math.random() * 50
                });
            }
            for (let i = state.particles.length - 1; i >= 0; i--) {
                let p = state.particles[i];
                p.z -= (moveSpeed + p.speed); // Move faster than world
                if (p.z < 10) state.particles.splice(i, 1);
            }

            // 7. UI Updates
            if (state.frameCount % 10 === 0) {
                document.getElementById('score').innerText = state.score;
                document.getElementById('speed-display').innerText = Math.floor(state.speed * 100);
            }
            state.frameCount++;
        }

        function spawnObstacle(z) {
            // Types: Low Block (Jump), High Block (Too risky for now, stick to jumpables)
            state.obstacles.push({
                z: z,
                width: 120,
                height: 70, // Jumpable
                type: 'block'
            });
        }

        function gameOver() {
            state.active = false;
            audio.stopBGM();
            audio.playSFX('crash');
            showFeedback('crash', 1400);
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('visor-overlay').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = state.score;
        }

        // --- RENDERER (FPV) ---
        // Project 3D point to 2D screen
        // x,y,z are world coordinates relative to camera Z position (camera is at z=0)
        function project(x, y, z) {
            const fov = 400;
            // Camera Height Logic:
            // Base height + Jump height + slight bob based on speed
            const bob = Math.sin(state.distance * 0.05) * (state.speed * 5);
            const camY = BASE_EYE_HEIGHT + state.y + bob;
            
            const scale = fov / (fov + z);
            
            // X: Standard projection centered on screen width
            const x2d = (x * scale) + (state.width / 2);
            
            // Y: 
            // World Y is UP. Screen Y is DOWN.
            // Center of view (Horizon) is at roughly 40% screen height.
            // Formula: HorizonY - (WorldY - CameraY) * scale
            // If WorldY (0) < CameraY (100), term is negative (-100). 
            // Minus negative = Plus. So Ground is Horizon + 100*scale (Lower on screen). Correct.
            
            const horizonY = state.height * 0.45;
            const y2d = horizonY - ((y - camY) * scale);

            return { x: x2d, y: y2d, scale: scale };
        }

        function draw() {
            // 1. Clear & Sky
            CTX.fillStyle = '#000510';
            CTX.fillRect(0, 0, state.width, state.height);

            // Horizon gradient
            const horizonY = state.height * 0.45;
            const gradSky = CTX.createLinearGradient(0, 0, 0, horizonY);
            gradSky.addColorStop(0, '#000011');
            gradSky.addColorStop(1, '#001133');
            CTX.fillStyle = gradSky;
            CTX.fillRect(0, 0, state.width, horizonY);

            // Sun / Moon / Data Core
            CTX.save();
            CTX.globalCompositeOperation = 'screen';
            const sunY = horizonY - 100;
            const sunGrad = CTX.createRadialGradient(state.width/2, sunY, 10, state.width/2, sunY, 120);
            sunGrad.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
            sunGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
            CTX.fillStyle = sunGrad;
            CTX.beginPath();
            CTX.arc(state.width/2, sunY, 120, 0, Math.PI*2);
            CTX.fill();
            CTX.restore();

            // Character visor pulse - preserve gameplay, presentation only
            CTX.save();
            CTX.globalCompositeOperation = 'screen';
            const faceY = state.height * 0.72 - state.y * 2;
            const pulse = 0.75 + Math.sin(state.frameCount * 0.12) * 0.08;
            const coreGrad = CTX.createRadialGradient(state.width / 2, faceY, 8, state.width / 2, faceY, 60);
            coreGrad.addColorStop(0, `rgba(103, 232, 249, ${0.7 * pulse})`);
            coreGrad.addColorStop(0.55, `rgba(167, 139, 250, ${0.28 * pulse})`);
            coreGrad.addColorStop(1, 'rgba(167, 139, 250, 0)');
            CTX.fillStyle = coreGrad;
            CTX.beginPath();
            CTX.arc(state.width / 2, faceY, 60, 0, Math.PI * 2);
            CTX.fill();

            CTX.strokeStyle = `rgba(103, 232, 249, ${0.9 * pulse})`;
            CTX.lineWidth = 3;
            CTX.beginPath();
            CTX.moveTo(state.width / 2 - 48, faceY + 4);
            CTX.lineTo(state.width / 2 - 12, faceY - 10);
            CTX.lineTo(state.width / 2 + 12, faceY - 10);
            CTX.lineTo(state.width / 2 + 48, faceY + 4);
            CTX.stroke();

            CTX.strokeStyle = `rgba(167, 139, 250, ${0.45 * pulse})`;
            CTX.beginPath();
            CTX.arc(state.width / 2, faceY + 10, 24, Math.PI * 0.1, Math.PI * 0.9);
            CTX.stroke();
            CTX.restore();

            // 2. Ground Grid (Infinite scrolling)
            CTX.lineWidth = 1;
            CTX.strokeStyle = 'rgba(0, 255, 255, 0.15)';
            CTX.beginPath();

            // Vertical lines (Perspective)
            for (let x = -800; x <= 800; x += 100) {
                const p1 = project(x, 0, 10); // Near
                const p2 = project(x, 0, 2000); // Far
                if (p1.y > horizonY) { // Only draw if below horizon
                    CTX.moveTo(p1.x, p1.y);
                    CTX.lineTo(p2.x, p2.y);
                }
            }
            
            // Horizontal lines (Moving)
            // Offset by distance to create movement illusion
            const gridSize = 100;
            const offset = state.distance % gridSize;
            
            for (let z = 2000; z >= 0; z -= gridSize) {
                const drawZ = z - offset;
                if (drawZ < 10) continue;

                const pLeft = project(-1000, 0, drawZ);
                const pRight = project(1000, 0, drawZ);

                // Fade out near horizon
                const alpha = Math.min(1, (drawZ / 2000)); 
                // Actually fade out in distance, fade IN near? 
                // Usually fog makes distance faded.
                // Let's make distance darker.
                CTX.globalAlpha = 1 - (drawZ / 2000);
                
                CTX.moveTo(pLeft.x, pLeft.y);
                CTX.lineTo(pRight.x, pRight.y);
            }
            CTX.stroke();
            CTX.globalAlpha = 1;

            // 3. Obstacles
            // Sort back-to-front (Painter's algo)
            state.obstacles.sort((a, b) => b.z - a.z);

            state.obstacles.forEach(obs => {
                if (obs.z < 10) return;

                const hw = obs.width / 2;
                
                // Front Face
                const pBL = project(-hw, 0, obs.z);
                const pBR = project(hw, 0, obs.z);
                const pTL = project(-hw, obs.height, obs.z);
                const pTR = project(hw, obs.height, obs.z);

                // Top Face (Depth)
                const depth = 50;
                const pTL_Back = project(-hw, obs.height, obs.z + depth);
                const pTR_Back = project(hw, obs.height, obs.z + depth);

                // Draw
                CTX.lineWidth = 2;
                
                // Fill Front
                CTX.fillStyle = VISUAL_THEME.hazardCore;
                CTX.strokeStyle = VISUAL_THEME.hazardEdge;
                
                CTX.beginPath();
                CTX.moveTo(pBL.x, pBL.y);
                CTX.lineTo(pBR.x, pBR.y);
                CTX.lineTo(pTR.x, pTR.y);
                CTX.lineTo(pTL.x, pTL.y);
                CTX.closePath();
                CTX.fill();
                CTX.stroke();

                // Fill Top
                CTX.fillStyle = 'rgba(127, 29, 29, 0.88)';
                CTX.beginPath();
                CTX.moveTo(pTL.x, pTL.y);
                CTX.lineTo(pTR.x, pTR.y);
                CTX.lineTo(pTR_Back.x, pTR_Back.y);
                CTX.lineTo(pTL_Back.x, pTL_Back.y);
                CTX.closePath();
                CTX.fill();
                CTX.stroke();
            });

            // 4. Speed Particles (Starfield effect for speed)
            CTX.fillStyle = '#ffffff';
            state.particles.forEach(p => {
                const proj = project(p.x, p.y, p.z);
                const size = 2 * proj.scale;
                if (size > 0) {
                    CTX.globalAlpha = Math.min(1, size);
                    CTX.fillRect(proj.x, proj.y, size * 20, size); // Stretch horizontal
                }
            });
            CTX.globalAlpha = 1;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- INIT ---
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        const controls = document.getElementById('controls');
        const visor = document.getElementById('visor-overlay');
        let loopStarted = false;

        function beginGame() {
            if (startScreen.classList.contains('hidden')) return;
            audio.unlock();
            audio.playSFX('start');
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            controls.classList.remove('hidden');
            visor.classList.remove('hidden');
            audio.playBGM();
            resetGame();
            if (!loopStarted) {
                loopStarted = true;
                loop();
            }
        }

        function restartGame() {
            if (gameOverScreen.classList.contains('hidden')) return;
            audio.unlock();
            audio.playSFX('restart');
            gameOverScreen.classList.add('hidden');
            feedbackLayer.classList.add('hidden');
            hud.classList.remove('hidden');
            controls.classList.remove('hidden');
            visor.classList.remove('hidden');
            audio.playBGM();
            resetGame();
        }

        // [agent-note][stage4] repaired: mobile-actionability | element: start/restart buttons | action: use click only to avoid duplicate pointer/click activation on mobile
        startBtn.addEventListener('click', beginGame);
        restartBtn.addEventListener('click', restartGame);

        // Start loop immediately for background render if desired, but let's wait for start
        // Draw one frame for background
        resetGame();
        draw();
    });
    </script>
