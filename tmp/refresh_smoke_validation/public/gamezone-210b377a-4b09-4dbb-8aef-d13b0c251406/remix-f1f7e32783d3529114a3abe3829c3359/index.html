<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Rescue Rush: Clinic Catch</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Audiowide&display=swap">
    <style>
        :root {
            --bg-top: #120f24;
            --bg-bottom: #1d1840;
            --brand: #6cf7ff;
            --brand-dark: #3ac7ff;
            --brand-soft: rgba(17, 27, 60, 0.86);
            --brand-ink: #0a1026;
            --danger: #ff5f7a;
            --danger-dark: #ff3158;
            --warning: #ffd166;
            --text-main: #f3f7ff;
            --text-soft: #bdd3ff;
            --panel-border: rgba(136, 229, 255, 0.4);
            --panel-shadow: 0 20px 50px -16px rgba(4, 10, 30, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            touch-action: auto;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(108, 247, 255, 0.1), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            width: min(28vw, 7rem);
            opacity: 0;
            transform: scale(0.88) translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 11;
            filter: drop-shadow(0 10px 16px rgba(4, 10, 30, 0.45));
        }

        .feedback-gif.visible {
            opacity: 0.9;
            transform: scale(1) translateY(0);
        }

        .feedback-gif-success {
            top: 5rem;
        }

        .feedback-gif-danger {
            bottom: 8rem;
            width: min(30vw, 7.5rem);
        }

        .overlay-card {
            background:
                linear-gradient(180deg, rgba(18, 24, 52, 0.96), rgba(11, 17, 38, 0.94));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            border-radius: 1.75rem;
            padding: 2rem;
            text-align: center;
            pointer-events: auto;
            width: min(90%, 22rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .overlay-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 18%, rgba(108, 247, 255, 0.32), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(255, 95, 122, 0.22), transparent 24%);
            pointer-events: none;
        }

        .overlay-card > * {
            position: relative;
            z-index: 1;
        }

        .hidden {
            display: none !important;
        }

        .hero-emoji {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 0 18px rgba(108, 247, 255, 0.35));
        }

        .headline {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.15rem);
            line-height: 0.95;
            letter-spacing: 0.08em;
            color: var(--text-main);
            text-shadow: 0 0 18px rgba(108, 247, 255, 0.28);
        }

        .headline-danger {
            color: var(--danger);
        }

        .subcopy {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.96rem;
            line-height: 1.45;
            font-weight: 700;
        }

        .stat-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(12, 24, 59, 0.95), rgba(20, 38, 79, 0.88));
            border: 1px solid rgba(108, 247, 255, 0.24);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .stat-label {
            color: #99b6f7;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
            margin: 0 0 0.35rem;
        }

        .stat-value {
            margin: 0;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 0.08em;
            color: var(--warning);
            line-height: 1;
        }

        .action-btn {
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            color: #fff;
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            padding: 0.95rem 2rem;
            box-shadow: 0 14px 26px rgba(2, 8, 24, 0.35);
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn-primary {
            background: linear-gradient(90deg, #ff7b94, #7d63ff 56%, #35d7ff);
        }

        .action-btn-primary:hover {
            background: linear-gradient(90deg, #ff6b87, #6f55f2 56%, #27c8ff);
            filter: brightness(1.05);
        }

        .hud {
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .hud-score {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            padding: 0.7rem 0.95rem 0.8rem;
            border-radius: 1.1rem;
            background: rgba(8, 16, 40, 0.68);
            border: 1px solid rgba(108, 247, 255, 0.2);
            box-shadow: 0 10px 22px rgba(2, 8, 24, 0.24);
        }

        .hud-label {
            color: rgba(189, 211, 255, 0.82);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .hud-value {
            font-family: 'Audiowide', 'Exo 2', sans-serif;
            font-size: clamp(2rem, 5vw, 2.6rem);
            letter-spacing: 0.08em;
            color: var(--warning);
        }

        .text-outline {
            text-shadow:
                0 0 10px rgba(255, 209, 102, 0.35),
                0 0 22px rgba(255, 209, 102, 0.2);
        }

        .sound-btn {
            pointer-events: auto;
            border: 1px solid rgba(108, 247, 255, 0.24);
            width: 3rem;
            height: 3rem;
            border-radius: 999px;
            background: rgba(8, 16, 40, 0.76);
            color: var(--text-main);
            box-shadow: 0 10px 22px rgba(2, 8, 24, 0.24);
            font-size: 1.2rem;
            cursor: pointer;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        @media (max-width: 480px) {
            .feedback-gif {
                right: 0.35rem;
                width: min(24vw, 5.25rem);
            }

            .feedback-gif-success {
                top: 4.5rem;
            }

            .feedback-gif-danger {
                bottom: 7rem;
            }

            .overlay-card {
                padding: 1.5rem 1.25rem;
                gap: 0.85rem;
            }

            .hero-emoji {
                font-size: 3.8rem;
            }

            .headline {
                font-size: clamp(2rem, 11vw, 2.5rem);
            }

            .hud {
                padding: 1rem;
            }

            .hud-score {
                padding: 0.62rem 0.8rem 0.72rem;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-shell">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <!-- [agent-note][stage3] resolved-gif: rescue/fail feedback -> catalogs/gifs.json -->
            <img id="success-gif" class="feedback-gif feedback-gif-success" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp" alt="Rescue streak celebration animation">
            <img id="danger-gif" class="feedback-gif feedback-gif-danger" src="https://i.giphy.com/3O4qbhHu6KACE8lkOT.webp" alt="Clinic breach warning animation">
            <div id="start-screen" class="overlay-card">
                <div class="hero-emoji">🚑🐶✨</div>
                <h1 class="headline">PET PANIC<br>PATROL</h1>
                <p class="subcopy">
                    Glide the rescue pod under every falling patient.<br>Avoid the infected virus cores.
                </p>
                <button id="start-btn" class="action-btn action-btn-primary pulse-soft">
                    START RESCUE
                </button>
            </div>

            <div id="game-over-screen" class="overlay-card hidden">
                <div class="hero-emoji">🦠💥</div>
                <h2 class="headline headline-danger">CLINIC BREACH!</h2>
                <p class="subcopy">An infected core slipped past your rescue lane.</p>
                <div class="stat-card">
                    <p class="stat-label">Patients Saved</p>
                    <p class="stat-value" id="finalScore">0</p>
                </div>
                <button id="restart-btn" class="action-btn action-btn-primary">
                    RESTART SHIFT
                </button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="hud-score">
                    <span class="hud-label">Saved</span>
                    <span id="score" class="hud-value text-outline">0</span>
                </div>
                <button id="sound-btn" class="sound-btn">🔊</button>
            </div>
        </div>
    </div>

    <script>
    /**
     * Rescue Rush: Clinic Catch
     * Catch pets and avoid virus hazards.
     */

    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3",
        sfx: {
            score: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
            nearMiss: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
            fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
            ui: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"
        }
    };

    class AudioSystem {
        constructor() {
            this.enabled = true;
            this.started = false;
            this.bgm = this.createAudio(ASSETS.bgm, 0.22, true);
            this.sfx = {
                score: this.createAudio(ASSETS.sfx.score, 0.48),
                nearMiss: this.createAudio(ASSETS.sfx.nearMiss, 0.35),
                fail: this.createAudio(ASSETS.sfx.fail, 0.62),
                ui: this.createAudio(ASSETS.sfx.ui, 0.4)
            };
            this.cooldowns = {};
        }

        createAudio(src, volume, loop = false) {
            const audio = new Audio(src);
            audio.preload = 'auto';
            audio.loop = loop;
            audio.volume = volume;
            return audio;
        }

        prime() {
            if (this.started) return;
            this.started = true;
            this.bgm.load();
            Object.values(this.sfx).forEach(sound => sound.load());
        }

        toggle() {
            this.enabled = !this.enabled;
            if (this.enabled) {
                if (gameActive) this.playBGM();
                return '🔊';
            }

            this.stopBGM();
            return '🔇';
        }

        playBGM() {
            if (!this.enabled) return;
            this.prime();
            if (this.bgm.paused) {
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
        }

        stopBGM() {
            this.bgm.pause();
            this.bgm.currentTime = 0;
        }

        playSFX(key, { restart = true, debounceMs = 0 } = {}) {
            if (!this.enabled || !this.sfx[key]) return;
            const now = performance.now();
            const lastPlayed = this.cooldowns[key] ?? -Infinity;
            if (now - lastPlayed < debounceMs) return;
            this.cooldowns[key] = now;

            const sound = this.sfx[key];
            if (restart) sound.currentTime = 0;
            sound.play().catch(() => {});
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new AudioSystem();
    const successGif = document.getElementById('success-gif');
    const dangerGif = document.getElementById('danger-gif');

    let width, height;
    let gameActive = false;
    let score = 0;
    let frame = 0;
    let speedMultiplier = 1;
    let difficultyTimer = 0;

    const player = {
        x: 0,
        y: 0,
        targetX: 0,
        radius: 35,
        color: '#ffffff'
    };

    let entities = [];
    let particles = [];
    let bgParticles = [];
    let nearMissCooldown = 0;
    let feedbackTimeout = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        player.y = height - 120;
        if (!gameActive) player.x = width / 2;
    }
    window.addEventListener('resize', resize);
    resize();
    player.x = width / 2;
    player.targetX = width / 2;

    function handleInput(e) {
        if (!gameActive) return;
        e.preventDefault();

        let clientX;
        if (e.type.includes('touch')) {
            clientX = e.touches[0].clientX;
        } else {
            clientX = e.clientX;
        }
        player.targetX = clientX;
    }

    canvas.addEventListener('mousemove', handleInput);
    canvas.addEventListener('touchmove', handleInput, { passive: false });
    canvas.addEventListener('touchstart', handleInput, { passive: false });

    function spawnEntity() {
        const isVirus = Math.random() > 0.65;
        const radius = isVirus ? 25 : 28;
        const x = Math.random() * (width - radius * 2) + radius;

        entities.push({
            x,
            y: -50,
            radius,
            type: isVirus ? 'virus' : 'pet',
            subtype: isVirus ? 0 : (Math.random() > 0.5 ? 'dog' : 'cat'),
            speed: (Math.random() * 2 + 4) * speedMultiplier,
            rotation: 0,
            rotSpeed: (Math.random() - 0.5) * 0.1
        });
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) {
            particles.push({
                x,
                y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1.0,
                color,
                size: Math.random() * 6 + 2
            });
        }
    }

    function initBackground() {
        bgParticles = [];
        for (let i = 0; i < 20; i++) {
            bgParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 40 + 10,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.15
            });
        }
    }

    function showGif(element, duration = 900) {
        clearTimeout(feedbackTimeout);
        successGif.classList.remove('visible');
        dangerGif.classList.remove('visible');

        if (!element) return;
        element.classList.add('visible');
        feedbackTimeout = window.setTimeout(() => {
            element.classList.remove('visible');
        }, duration);
    }

    function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#120f24');
        grad.addColorStop(0.55, '#1c1841');
        grad.addColorStop(1, '#0a1026');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        const laneGlow = ctx.createRadialGradient(width * 0.5, height * 0.82, 40, width * 0.5, height * 0.82, width * 0.65);
        laneGlow.addColorStop(0, 'rgba(58, 199, 255, 0.16)');
        laneGlow.addColorStop(1, 'rgba(58, 199, 255, 0)');
        ctx.fillStyle = laneGlow;
        ctx.fillRect(0, 0, width, height);

        bgParticles.forEach(p => {
            p.y += p.speed * speedMultiplier * 0.5;
            if (p.y > height + p.size) p.y = -p.size;

            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = '#7ceeff';
            ctx.beginPath();
            const s = p.size;
            const t = s / 3;
            ctx.roundRect(p.x - t / 2, p.y - s / 2, t, s, t);
            ctx.roundRect(p.x - s / 2, p.y - t / 2, s, t, t);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawPlayer() {
        player.x += (player.targetX - player.x) * 0.15;

        if (player.x < player.radius) player.x = player.radius;
        if (player.x > width - player.radius) player.x = width - player.radius;

        ctx.save();
        ctx.translate(player.x, player.y);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
        ctx.beginPath();
        ctx.ellipse(0, 42, player.radius * 1.1, player.radius * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        const podGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, player.radius * 1.2);
        podGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        podGlow.addColorStop(0.65, 'rgba(91, 213, 255, 0.95)');
        podGlow.addColorStop(1, 'rgba(90, 99, 255, 0.78)');
        ctx.fillStyle = podGlow;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#c8fbff';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#0d1636';
        ctx.beginPath();
        ctx.arc(0, -2, player.radius * 0.58, Math.PI, Math.PI * 2);
        ctx.quadraticCurveTo(player.radius * 0.5, 10, 0, 14);
        ctx.quadraticCurveTo(-player.radius * 0.5, 10, -player.radius * 0.58, -2);
        ctx.fill();

        ctx.fillStyle = '#ff6f8f';
        const s = player.radius * 0.58;
        const t = s / 2.6;
        ctx.beginPath();
        ctx.roundRect(-t, -s * 0.96, t * 2, s * 1.92, 3);
        ctx.roundRect(-s, -t, s * 2, t * 2, 3);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-player.radius * 0.48, player.radius * 0.54);
        ctx.lineTo(player.radius * 0.48, player.radius * 0.54);
        ctx.stroke();

        ctx.fillStyle = '#ffe082';
        ctx.beginPath();
        ctx.arc(player.radius * 0.68, -player.radius * 0.68, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff3b0';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
    }

    function drawEntity(e) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rotation);

        if (e.type === 'virus') {
            ctx.fillStyle = '#ff5f7a';
            ctx.beginPath();
            const spikes = 8;
            for (let i = 0; i < spikes * 2; i++) {
                const r = (i % 2 === 0) ? e.radius : e.radius * 0.62;
                const a = (Math.PI * 2 * i) / (spikes * 2);
                ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#c9284f';
            ctx.beginPath();
            ctx.arc(0, 0, e.radius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.rotate(-e.rotation);
            ctx.fillStyle = '#3e0d18';
            ctx.beginPath();
            ctx.arc(-5, -5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(5, -5, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#3e0d18';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 5, 7, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
        } else {
            const isDog = e.subtype === 'dog';
            ctx.fillStyle = isDog ? '#ffd9b3' : '#ffe38a';

            ctx.beginPath();
            if (isDog) {
                ctx.ellipse(-12, -12, 8, 14, -0.5, 0, Math.PI * 2);
                ctx.ellipse(12, -12, 8, 14, 0.5, 0, Math.PI * 2);
            } else {
                ctx.moveTo(-10, -10);
                ctx.lineTo(-20, -28);
                ctx.lineTo(0, -18);
                ctx.moveTo(10, -10);
                ctx.lineTo(20, -28);
                ctx.lineTo(0, -18);
            }
            ctx.fill();

            const faceGlow = ctx.createRadialGradient(0, -6, 4, 0, 0, e.radius);
            faceGlow.addColorStop(0, isDog ? '#fff3e0' : '#fff7bf');
            faceGlow.addColorStop(1, isDog ? '#ffb974' : '#ffcf57');
            ctx.fillStyle = faceGlow;
            ctx.beginPath();
            ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#3e2723';
            ctx.beginPath();
            ctx.arc(-7, -2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(7, -2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, 6, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 8, 7, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            ctx.fillRect(-11, -21, 22, 7);
            ctx.fillStyle = '#ff5277';
            ctx.font = "10px Audiowide";
            ctx.fillText('+', -3.5, -13.5);
        }
        ctx.restore();
    }

    function update() {
        difficultyTimer++;
        if (difficultyTimer % 600 === 0) {
            speedMultiplier += 0.1;
        }

        if (frame % Math.floor(50 / speedMultiplier) === 0) {
            spawnEntity();
        }
        frame++;
        nearMissCooldown = Math.max(0, nearMissCooldown - 1);


        for (let i = entities.length - 1; i >= 0; i--) {
            const e = entities[i];
            e.y += e.speed;
            e.rotation += e.rotSpeed;

            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const dist = Math.hypot(dx, dy);

            if (dist < player.radius + e.radius) {
                if (e.type === 'virus') {
                    gameOver();
                    return;
                } else {
                    score++;
                    document.getElementById('score').innerText = score;
                    audio.playSFX('score', { debounceMs: 80 });
                    showGif(successGif, 700);
                    createExplosion(e.x, e.y, '#ff4081');
                    entities.splice(i, 1);
                    continue;
                }
            }

            if (e.type === 'virus' && e.y > height - 220 && nearMissCooldown === 0) {
                nearMissCooldown = 22;
                audio.playSFX('nearMiss', { restart: true, debounceMs: 250 });
            }

            if (e.y > height + 50) {
                entities.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function render() {
        drawBackground();

        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        entities.forEach(drawEntity);
        drawPlayer();
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    function initGame() {
        score = 0;
        speedMultiplier = 1;
        frame = 0;
        difficultyTimer = 0;
        entities = [];
        particles = [];
        nearMissCooldown = 0;
        showGif(null);

        document.getElementById('score').innerText = '0';
        player.x = width / 2;
        player.targetX = width / 2;

        initBackground();
    }

    function gameOver() {
        gameActive = false;
        audio.stopBGM();
        audio.playSFX('fail', { debounceMs: 250 });
        showGif(dangerGif, 1400);

        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = score;
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        audio.prime();
        audio.playSFX('ui');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        audio.playBGM();
        gameActive = true;
        initGame();
        gameLoop();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        audio.prime();
        audio.playSFX('ui');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        audio.playBGM();
        gameActive = true;
        initGame();
        gameLoop();
    });

    document.getElementById('sound-btn').addEventListener('click', (e) => {
        audio.playSFX('ui', { debounceMs: 80 });
        const icon = audio.toggle();
        e.target.innerText = icon;
        e.stopPropagation();
    });
    </script>
</body>
</html>
