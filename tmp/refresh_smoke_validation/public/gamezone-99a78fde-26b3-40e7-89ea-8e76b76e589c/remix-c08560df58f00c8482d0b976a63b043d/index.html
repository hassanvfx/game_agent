<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Caller ID: Final Cut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- [agent-note][stage3] resolved-font: title -> Audiowide, hud/body -> Rajdhani, retro accent -> Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        window.tailwind = {
            config: {
                theme: {
                    extend: {
                        colors: { void: '#050208', curse: '#e11d48', sorcerer: '#f8fafc', energy: '#7f1d1d' },
                        fontFamily: {
                            display: ['"Audiowide"', 'system-ui', 'sans-serif'],
                            mono: ['"Press Start 2P"', 'ui-monospace', 'monospace'],
                            body: ['"Rajdhani"', 'system-ui', 'sans-serif'],
                            accent: ['"Press Start 2P"', 'ui-monospace', 'monospace']
                        },
                        animation: { 'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                    }
                }
            }
        };
    </script>
    <script src="assets/cdn.tailwindcss.com/3.4.17_old.js"></script>
    <style>
        body {
            background-color: #020617; color: white; overflow: hidden;
            touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
            font-family: "Rajdhani", system-ui, sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; touch-action: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; background: #e2e8f0;
            border-radius: 50%; margin-top: -10px; box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #334155; border-radius: 2px; }
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none; position: absolute; inset: 0; z-index: 50; opacity: 0.6;
        }
        .vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 40;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
        }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 29, 58, 0.92), rgba(8, 15, 34, 0.86));
            border: 1px solid rgba(108, 231, 255, 0.18);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 10px 25px rgba(0, 0, 0, 0.35),
                0 0 18px rgba(108, 231, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .btn-active:active { transform: scale(0.95); }
        button { touch-action: manipulation; font-family: "Rajdhani", system-ui, sans-serif; }
        .safe-area {
            padding-top: env(safe-area-inset-top, 24px); padding-bottom: env(safe-area-inset-bottom, 24px);
        }
        @keyframes flash { 0% { background-color: white; opacity: 0.8; } 100% { background-color: transparent; opacity: 0; } }
        .flash-fx { position: absolute; inset: 0; pointer-events: none; z-index: 100; animation: flash 0.15s ease-out forwards; }
        :root {
            --arena-bg: #040816;
            --panel-bg: rgba(8, 15, 34, 0.86);
            --panel-border: rgba(108, 231, 255, 0.18);
            --cyan-glow: #6ce7ff;
            --violet-glow: #9f7bff;
            --red-glow: #ff5f7d;
            --gold-glow: #ffd166;
            --text-main: #eef7ff;
            --text-dim: #97a9c6;
        }
        .roster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; padding-bottom: 2rem; }
        .arcade-shell {
            background:
                radial-gradient(circle at top, rgba(108, 231, 255, 0.08), transparent 40%),
                linear-gradient(180deg, #0a1026 0%, #040816 48%, #02050f 100%);
        }
        .hero-logo {
            font-family: "Audiowide", system-ui, sans-serif;
            text-shadow:
                0 0 12px rgba(108, 231, 255, 0.35),
                0 0 24px rgba(159, 123, 255, 0.25);
        }
        .accent-badge {
            font-family: "Press Start 2P", ui-monospace, monospace;
            letter-spacing: 0.14em;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
        }
        .team-card-blue,
        .team-card-red {
            position: relative;
            isolation: isolate;
        }
        .team-card-blue::before,
        .team-card-red::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.7;
            background:
                radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 30%),
                linear-gradient(135deg, transparent, rgba(255,255,255,0.04));
        }
        .team-card-blue { box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.14), 0 0 28px rgba(59, 130, 246, 0.12); }
        .team-card-red { box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.14), 0 0 28px rgba(239, 68, 68, 0.12); }
        .roster-unit {
            background:
                linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(2, 6, 23, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 0.7rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .roster-unit .unit-icon {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.18));
            transform: scale(1.06);
        }
        .hud-orb { box-shadow: 0 0 15px currentColor; }
        .control-fab { box-shadow: 0 0 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08); }
        .battle-overlay {
            background:
                radial-gradient(circle at center, transparent 0 52%, rgba(4, 8, 22, 0.45) 100%);
        }
        .result-frame {
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 0 36px rgba(108, 231, 255, 0.08);
        }
        .feedback-gif {
            position: absolute;
            width: min(30vw, 132px);
            height: min(30vw, 132px);
            object-fit: cover;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 22px rgba(108, 231, 255, 0.15);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 45;
            background: rgba(2, 6, 23, 0.7);
        }
        .feedback-gif.active {
            opacity: 0.88;
            transform: translateY(0) scale(1);
        }
        .feedback-gif-impact { left: 0.65rem; bottom: calc(env(safe-area-inset-bottom, 0px) + 5.3rem); }
        .feedback-gif-win { right: 0.65rem; top: calc(env(safe-area-inset-top, 0px) + 5rem); }
        @media (min-width: 640px) {
            .roster-grid { grid-template-columns: repeat(5, 1fr); }
            .feedback-gif-impact { left: 1rem; bottom: 1rem; }
            .feedback-gif-win { right: 1rem; top: 6.25rem; }
        }

        /* v5 authored meta-horror layer */
        :root {
            --blood: #e11d48;
            --knife: #f8fafc;
            --phone: #22c55e;
            --cassette: #fb7185;
            --midnight: #050208;
            --suburb: #111827;
        }
        body { background: var(--midnight); }
        .arcade-shell {
            background:
                radial-gradient(circle at 18% 10%, rgba(225,29,72,.22), transparent 22%),
                radial-gradient(circle at 78% 18%, rgba(248,250,252,.08), transparent 18%),
                linear-gradient(180deg, #120611 0%, #050208 45%, #020104 100%) !important;
        }
        .arcade-shell::before {
            content:""; position:absolute; inset:0; pointer-events:none; opacity:.42;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 20px),
                repeating-linear-gradient(0deg, rgba(225,29,72,.035) 0 1px, transparent 1px 28px);
            mask-image: radial-gradient(circle at center, #000, transparent 80%);
        }
        .hero-logo { color:#fff; letter-spacing:-.07em; text-shadow:0 0 10px rgba(225,29,72,.9),0 0 34px rgba(225,29,72,.42); }
        .accent-badge { color:#fb7185 !important; text-shadow:0 0 12px rgba(225,29,72,.9); }
        .glass-panel {
            background: linear-gradient(180deg, rgba(24,6,18,.88), rgba(5,2,8,.9)) !important;
            border-color: rgba(251,113,133,.2) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 30px rgba(0,0,0,.48), 0 0 28px rgba(225,29,72,.1) !important;
        }
        .team-card-blue { box-shadow: 0 0 0 1px rgba(248,250,252,.14), 0 0 28px rgba(248,250,252,.08) !important; }
        .team-card-red { box-shadow: 0 0 0 1px rgba(225,29,72,.18), 0 0 32px rgba(225,29,72,.16) !important; }
        .roster-unit { background: linear-gradient(180deg, rgba(17,24,39,.78), rgba(9,3,8,.92)) !important; border-radius: .95rem !important; }
        .roster-unit::after { content:""; position:absolute; inset:auto 10% 0 10%; height:2px; background:linear-gradient(90deg, transparent, rgba(251,113,133,.8), transparent); opacity:.55; }
        #start-btn { background:linear-gradient(135deg,#f8fafc,#fb7185) !important; color:#050208 !important; border-color:#fff !important; text-shadow:none; }
        .scanlines { opacity:.75; background-size:100% 3px, 5px 100%; }
        .vignette { background: radial-gradient(circle, transparent 42%, rgba(0,0,0,.82) 100%), linear-gradient(120deg, rgba(225,29,72,.18), transparent 45%, rgba(255,255,255,.04)); }
        .control-fab { border-color:rgba(251,113,133,.35) !important; background:rgba(5,2,8,.72) !important; }
        #domain-text { font-family:"Audiowide", system-ui, sans-serif; color:#fff; text-shadow:0 0 6px #fff, 0 0 24px #e11d48, 0 0 52px #e11d48; }
        .feedback-gif { border-color:rgba(251,113,133,.5); box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 28px rgba(225,29,72,.28); filter:saturate(.75) contrast(1.1); }
        @media (max-width: 430px) {
            .roster-grid { gap:.3rem; }
            .hero-logo { font-size:1.85rem !important; }
            .glass-panel { padding:.65rem !important; }
        }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="arcade-shell absolute inset-0 flex flex-col z-20 bg-slate-950 transition-opacity duration-500">
        <div class="safe-area px-4 pb-2 bg-gradient-to-b from-slate-900 to-slate-950 border-b border-white/5 relative overflow-hidden shrink-0">
            <div class="absolute inset-0 bg-gradient-to-r from-blue-900/20 via-purple-900/20 to-red-900/20 opacity-50"></div>
            <div class="relative flex justify-between items-center mt-2">
                <div></div>
                <h1 class="hero-logo text-3xl font-display tracking-tighter italic text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">
                    CALLER<span class="text-red-500">ID</span>
                </h1>
                <button onclick="toggleInfo()" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 text-white flex items-center justify-center text-lg hover:bg-white/20 active:scale-90 transition-transform touch-manipulation z-50">ℹ️</button>
            </div>
            <p class="accent-badge relative text-center text-[10px] text-yellow-400 uppercase -mt-1">META-HORROR MYSTERY</p>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-2 space-y-4 pb-32">
            <div class="glass-panel team-card-blue rounded-xl p-3 border-l-4 border-l-blue-500 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-2 opacity-10 text-6xl">📼</div>
                <div class="flex justify-between items-center mb-3 relative z-10">
                    <h2 class="text-blue-400 font-bold tracking-wider text-sm flex items-center gap-2">
                        <span class="hud-orb w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> FINAL CUT (MAX)
                    </h2>
                    <span id="total-blue" class="text-xs font-mono text-slate-400">0/15</span>
                </div>
                <div id="blue-roster" class="roster-grid relative z-10"></div>
            </div>

            <div class="glass-panel team-card-red rounded-xl p-3 border-l-4 border-l-red-500 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-2 opacity-10 text-6xl">🔪</div>
                <div class="flex justify-between items-center mb-3 relative z-10">
                    <h2 class="text-red-400 font-bold tracking-wider text-sm flex items-center gap-2">
                        <span class="hud-orb w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> COPYCAT ALIBI (MAX)
                    </h2>
                    <span id="total-red" class="text-xs font-mono text-slate-400">0/15</span>
                </div>
                <div id="red-roster" class="roster-grid relative z-10"></div>
            </div>

            <div class="glass-panel rounded-xl p-4">
                <div class="flex justify-between text-xs text-slate-400 font-bold mb-2">
                    <span>TENSION SCALE</span> <span id="disp-hp" class="text-white">STANDARD</span>
                </div>
                <div class="px-2">
                    <input type="range" id="input-hp" min="0" max="6" value="0" step="1" oninput="updateHpDisplay(this.value)">
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-slate-950 via-slate-900 to-transparent safe-area z-30">
            <button id="start-btn" onclick="startGame()" class="w-full py-4 bg-white text-black font-display text-2xl italic tracking-widest rounded-lg shadow-[0_0_25px_rgba(255,255,255,0.4)] btn-active disabled:opacity-50 disabled:shadow-none transition-all border-2 border-white">
                ANSWER THE CALL
            </button>
        </div>
    </div>

    <!-- INFO SCREEN -->
    <div id="info-screen" class="absolute inset-0 z-40 bg-slate-950/95 backdrop-blur-xl transform translate-y-full transition-transform duration-300 flex flex-col">
        <div class="safe-area px-4 py-4 border-b border-white/10 flex justify-between items-center bg-slate-900">
            <h2 class="text-xl font-display italic tracking-wider text-white">SUSPECT BOARD</h2>
            <button onclick="toggleInfo()" class="px-4 py-2 bg-white/10 rounded text-xs font-bold hover:bg-white/20">CLOSE</button>
        </div>
        <div id="info-list" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="absolute inset-0 z-10 opacity-0 pointer-events-none transition-opacity duration-500 bg-black">
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>
        <div class="vignette battle-overlay"></div>
        <!-- [agent-note][stage3] resolved-gif: combat impact + victory reaction from catalogs/gifs.json; anchored off playfield edges to protect controls -->
        <img id="impact-gif" class="feedback-gif feedback-gif-impact" src="https://i.giphy.com/1zmG8avB83Uvm.webp" alt="Combat impact reaction overlay">
        <img id="win-gif" class="feedback-gif feedback-gif-win" src="https://i.giphy.com/DOZGL2rx0qJAFu0Zx6.webp" alt="Victory celebration overlay">
        <div id="flash-layer"></div>
        
        <div class="absolute top-0 left-0 w-full px-2 pt-2 safe-area flex justify-between items-start pointer-events-none z-50">
            <div class="w-[35%] flex flex-col gap-1">
                <div class="flex justify-between text-[9px] font-bold text-blue-400 tracking-widest"><span>FINAL CUT</span> <span id="hp-val-blue">100%</span></div>
                <div class="h-3 bg-slate-900/80 rounded skew-x-[-10deg] overflow-hidden border border-blue-500/30">
                    <div id="bar-blue" class="h-full bg-gradient-to-r from-blue-600 to-blue-400 shadow-[0_0_15px_#3b82f6] transition-all duration-300 w-full"></div>
                </div>
            </div>
            <div class="text-white/20 font-display text-2xl pt-1 italic w-[10%] text-center">☎</div>
            <div class="w-[35%] flex flex-col gap-1">
                <div class="flex justify-between text-[9px] font-bold text-red-400 tracking-widest"><span id="hp-val-red">100%</span> <span>COPYCATS</span></div>
                <div class="h-3 bg-slate-900/80 rounded skew-x-[10deg] overflow-hidden border border-red-500/30">
                    <div id="bar-red" class="h-full bg-gradient-to-l from-red-600 to-red-400 shadow-[0_0_15px_#ef4444] transition-all duration-300 w-full ml-auto"></div>
                </div>
            </div>
        </div>

        <div class="absolute top-0 right-2 mt-16 flex flex-col gap-3 pointer-events-auto z-50">
             <button onclick="toggleAudio()" id="btn-audio" class="control-fab w-10 h-10 rounded-full bg-black/40 border border-white/20 text-white flex items-center justify-center backdrop-blur text-sm hover:bg-white/10 active:scale-90 transition-transform touch-manipulation">🔊</button>
            <button onclick="togglePause()" class="control-fab w-10 h-10 rounded-full bg-slate-800/60 border border-white/20 text-white flex items-center justify-center backdrop-blur text-lg hover:bg-white/10 active:scale-90 transition-transform touch-manipulation">⏸️</button>
            <button onclick="toMenu()" class="control-fab w-10 h-10 rounded-full bg-red-900/80 border border-white/20 text-white flex items-center justify-center backdrop-blur text-sm hover:bg-red-700 active:scale-90 transition-transform touch-manipulation shadow-lg">🏠</button>
        </div>
        
        <div id="domain-popup" class="absolute top-1/4 left-0 w-full text-center pointer-events-none opacity-0 transition-all duration-500 transform scale-150 z-40 px-2">
            <h2 id="domain-text" class="text-4xl md:text-5xl font-display text-white drop-shadow-[0_0_10px_#fff] italic tracking-tighter break-words"></h2>
        </div>
    </div>

    <!-- PAUSE & RESULT -->
    <div id="pause-screen" class="absolute inset-0 z-[60] bg-black/80 backdrop-blur-md hidden flex-col items-center justify-center transition-opacity duration-200">
        <h2 class="text-5xl font-display text-white italic tracking-tighter mb-8 drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">CALL ON HOLD</h2>
        <div class="flex flex-col gap-4 w-64">
            <button onclick="togglePause()" class="py-4 bg-white text-black font-display text-xl tracking-widest rounded skew-x-[-10deg] hover:bg-gray-200 active:scale-95 transition-transform">KEEP RUNNING</button>
            <button onclick="toMenu()" class="py-4 bg-transparent border border-red-500/50 text-red-400 font-bold tracking-widest rounded skew-x-[-10deg] hover:bg-red-900/20 active:scale-95 transition-transform">HANG UP</button>
        </div>
    </div>

    <div id="result-screen" class="result-frame absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md hidden transition-all duration-300">
        <h2 id="result-title" class="text-6xl md:text-7xl font-display mb-2 text-white drop-shadow-[0_0_25px_rgba(255,255,255,0.6)] scale-110 italic text-center px-4">SURVIVED</h2>
        <div id="result-msg" class="text-[10px] md:text-xs font-mono text-slate-300 tracking-[0.3em] mb-12 uppercase border-t border-b border-white/10 py-2 text-center px-4"></div>
        <div class="flex flex-col gap-4 w-64 md:w-72">
            <button onclick="restartGame()" class="py-5 bg-white text-black font-display text-xl tracking-widest rounded skew-x-[-10deg] hover:bg-gray-200 btn-active shadow-[0_0_20px_rgba(255,255,255,0.4)]">REDIAL</button>
            <button onclick="toMenu()" class="py-5 bg-transparent border border-white/20 text-slate-400 font-bold tracking-widest rounded skew-x-[-10deg] hover:bg-white/5 btn-active hover:text-white">BACK TO SUSPECTS</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        // [agent-note][stage3] resolved-audio: bgm/action loop + hit/block/ui/start/pause/resume/win/game-over mapped from catalogs/audios.json with synth fallback
        class MediaAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.masterGain = null;
                this.musicGain = null;
                this.musicOsc = null;
                this.buffers = {};
                this.cooldowns = new Map();
                this.activeMusicMode = 'menu';
                this.isMusicRunning = false;
                this.urls = {
                    hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
                    block: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
                    slash: 'https://gamezone-virid.vercel.app/assets/audios/sfx/projectile_01.mp3',
                    blast: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3',
                    arise: 'https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_01.mp3',
                    teleport: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
                    debuff: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3',
                    domain: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3',
                    ui: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                    pause: 'https://gamezone-virid.vercel.app/assets/audios/ui/pause_01.mp3',
                    resume: 'https://gamezone-virid.vercel.app/assets/audios/ui/resume_01.mp3',
                    win: 'https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3',
                    lose: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
                    menuOpen: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3',
                    menuClose: 'https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3'
                };
                this.musicCatalog = {
                    gameplay: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3',
                    ambient: 'https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3',
                    victory: 'https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3',
                    defeat: 'https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3'
                };
                Object.values({ ...this.urls, ...this.musicCatalog }).forEach(url => this.preload(url));
            }
            init() {
                if (this.ctx) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                this.ctx = new AC();
                this.masterGain = this.ctx.createGain();

                            e.state = 'CAST'; e.cd.skill1 = 100; e.vx = 0; createProjectile(e, target, 'RASENGAN'); return;
                        }
                        break;
                    case 'sasuke':
                        if (dist > 200 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 100; e.x = target.x - (e.facing*50); audio.play('teleport');
                            setTimeout(() => dealDamage(e, target, 2.5, 'CHIDORI'), 100); return;
                        }
                        break;
                    case 'itachi':
                        if (e.cd.ult <= 0 && Math.random() < 0.2) { castDomain(e, 'RED LIGHT DREAM'); return; }
                        if (dist < 400 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 120; e.vx = 0; createProjectile(e, target, 'AMATERASU'); return;
                        }
                        break;
                    case 'pain':
                        if (dist < 300 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 150; e.vx = 0; showPopup("EVERYBODY SPLIT UP"); audio.play('blast');
                            entities.forEach(o => {
                                if(o.team !== e.team && Math.abs(o.x - e.x) < 300) {
                                    o.vx = e.facing * 20; o.vy = 0; dealDamage(e, o, 2.0, 'MAGIC');
                                }
                            }); return;
                        }
                        break;
                    case 'obito':
                        if (Math.random() < 0.1) { e.invuln = 20; }
                        break;
                    case 'madara':
                        if (e.cd.ult <= 0 && Math.random() < 0.2) {
                            e.state = 'CAST'; e.cd.ult = 999; e.vx = 0; showPopup("TRUE CRIME MONOLOGUE");
                            setTimeout(() => {
                                screenFlash(); shake=30; pulseGif('impact', 1100);
                                entities.forEach(o => { if(o.team !== e.team) dealDamage(e, o, 5.0, 'SMASH'); });
                            }, 1000); return;
                        }
                        break;
                    case 'gon':
                        if (dist < 80 && e.cd.skill1 <= 0) {
                            e.state = 'CAST'; e.cd.skill1 = 150; e.vx = 0; showPopup("RULE ONE...");
                            setTimeout(() => {
                                showPopup("NEVER SAY BACK!"); audio.play('blast');
                                dealDamage(e, target, 4.0, 'SMASH'); shake=20;
                            }, 800); return;
                        }
                        break;
                    case 'killua':
                        if (dist < 100 && e.cd.skill1 <= 0) {
                            e.state = 'ATTACK'; e.cd.skill1 = 60; e.vx = 0; audio.play('debuff');
                            target.stun = 60; dealDamage(e, target, 1.5, 'LIGHTNING'); return;
                        }
                        break;
                    case 'sungjinwo':
                         if (e.cd.skill2 <= 0 && entities.filter(ent => ent.team === e.team).length < 25) {
                            e.state = 'CAST'; e.cd.skill2 = 100; e.vx = 0; audio.play('arise');
                            createEntity(e.team, 'yuji', e.x, true); return;
                        }
                        break;
                }

                if (dist < 60 && e.cd.atk <= 0) {
                    e.state = 'ATTACK'; e.cd.atk = 15; e.vx = 0;
                    setTimeout(() => dealDamage(e, target, 1.0, 'MELEE'), 100);
                } else if (dist > 50) {
                    e.state = 'MOVE'; e.vx = e.facing * e.spd;
                } else {
                    e.state = 'IDLE'; e.vx = 0;
                }
            });
        }

        function createProjectile(owner, target, type) {
            const py = owner.y + 20;
            const px = owner.x + owner.w/2 + (owner.facing * 20);

            if (type === 'PURPLE') {
                audio.play('blast'); showPopup("THE RULES CHANGED");
                setTimeout(() => {
                    screenFlash(); shake = 30; freezeFrames = 5; pulseGif('impact', 950);
                    particles.push({ x: px, y: py, vx: owner.facing * 15, vy: 0, life: 3, color: '#a855f7', size: 100, type: 'projectile', damage: 15000, owner: owner, pierce: true });
                }, 500);
            } else if (type === 'RASENGAN') {
                audio.play('slash');
                particles.push({ x: px, y: py, vx: owner.facing * 12, vy: 0, life: 1, color: '#3b82f6', size: 30, type: 'projectile', damage: 400, owner: owner, effect: 'knockback' });
            } else if (type === 'AMATERASU') {
                audio.play('domain');
                particles.push({ x: target.x, y: target.y, vx: 0, vy: 0, life: 2, color: '#000', size: 40, type: 'projectile', damage: 200, owner: owner, pierce: true });
            } else if (type === 'SLASH_WAVE') {
                audio.play('slash');
                particles.push({ x: px, y: py, vx: owner.facing * 20, vy: 0, life: 0.5, color: '#15803d', size: 50, type: 'projectile', damage: 300, owner: owner, pierce: true });
            }
        }

        function dealDamage(att, def, mult, type) {
            if (def.hp <= 0 || def.invuln > 0) return;

            if (def.state === 'BLOCK') {
                audio.play('block');
                particles.push({x: def.x + def.w/2, y: def.y, vx: 0, vy: -1, life: 0.8, color: '#fff', size: 14, type: 'text', text: 'MISDIRECT'});
                return;
            }

            if (def.cd.block <= 0 && def.stun <= 0 && def.state !== 'CAST' && type !== 'DOMAIN_HIT' && type !== 'WORLD') {
                const blockChance = (def.type === 'venom' || def.type === 'pain') ? 0.3 : 0.15;
                if (Math.random() < blockChance) {
                    def.state = 'BLOCK';
                    def.blockTimer = 20;
                    def.cd.block = 120;
                    audio.play('block');
                    particles.push({x: def.x + def.w/2, y: def.y, vx: 0, vy: -1, life: 0.8, color: '#fff', size: 14, type: 'text', text: 'MISDIRECT!'});
                    return;
                }
            }

            if (def.type === 'sorcerer' && type !== 'WORLD' && type !== 'DOMAIN_HIT') {
                if (Math.random() < 0.9) {
                    particles.push({x: def.x+def.w/2, y: def.y+def.h/2, vx:0, vy:0, life:0.5, color:'#3b82f6', size:40, type:'shield'});
                    return;
                }
            }

            if (type === 'WORLD') {
                def.hp -= 5000;
                audio.play('blast');
                pulseGif('impact', 1000);
                particles.push({x: def.x+def.w/2, y: def.y+def.h/2, vx:0, vy:0, life:0.5, color:'#000', size:60, type:'slash_anim'});
                return;
            }

            const dmg = att.pwr * 2.5 * mult;
            def.hp -= dmg;

            audio.play('hit');
            if (mult >= 1.5 || type !== 'MELEE') pulseGif('impact', 650);
            if (type === 'FIRE_KICK' || type === 'AMATERASU') {
                particles.push({x:def.x, y:def.y, vx:0, vy:-2, life:0.5, color:'#f97316', size:30, type:'smoke'});
            } else if (type === 'LIGHTNING' || type === 'CHIDORI') {
                particles.push({x:def.x, y:def.y, vx:0, vy:0, life:0.3, color:'#fff', size:40, type:'spark'});
            }

            def.vx = att.facing * 5 * mult; def.vy = 0;
            if (mult > 2.0) { shake = 5; freezeFrames = 2; }
        }

        function castDomain(owner, type) {
            domain = { type, owner: owner.id, time: 600 };
            owner.cd.ult = 9999; audio.play('domain'); screenFlash(); shake = 10; pulseGif('impact', 1200);
            let name = "PHONE CALL EVENT";
            if (type === 'VOID') name = "NO SIGNAL BLACKOUT";
            else if (type === 'SHRINE') name = "GARAGE DOOR SETPIECE";
            else if (type === 'RED LIGHT DREAM') name = "RED LIGHT DREAM";
            showPopup(name);
            if (type === 'VOID' || type === 'RED LIGHT DREAM') entities.forEach(e => { if (e.id !== owner.id && e.type !== 'sukuna') e.stun = 600; });
        }

        function showPopup(text) {
            const p = document.getElementById('domain-popup'); const t = document.getElementById('domain-text');
            t.innerText = text; p.style.opacity = '1'; p.style.transform = 'scale(1)';
            setTimeout(() => { p.style.opacity = '0'; p.style.transform = 'scale(1.5)'; }, 2000);
        }

        function updateDomain() {
            if (!domain) return;
            domain.time--;
            const owner = entities.find(e => e.id === domain.owner);
            if (!owner) { domain = null; return; }

            if (domain.type === 'SHRINE' && domain.time % 5 === 0) {
                entities.forEach(e => {
                    if (e.team !== owner.team) {
                        dealDamage(owner, e, 0.5, 'DOMAIN_HIT');
                        particles.push({x:e.x+Math.random()*20, y:e.y+Math.random()*40, vx:0, vy:0, life:0.2, color:'#fff', size:20, type:'slash_anim'});
                    }
                });
                shake = 2;
            } else if ((domain.type === 'VOID' || domain.type === 'RED LIGHT DREAM') && domain.time % 30 === 0) {
                 entities.forEach(e => { if (e.team !== owner.team) dealDamage(owner, e, 0.3, 'MAGIC'); });
            }
            if (domain.time <= 0) domain = null;
        }

        function screenFlash() {
            const f = document.createElement('div'); f.className = 'flash-fx';
            document.getElementById('flash-layer').appendChild(f); setTimeout(() => f.remove(), 200);
        }

        // --- DRAWING ---

        function drawHorrorBackdrop() {
            const t = performance.now() * 0.001;
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#08020a');
            grad.addColorStop(0.48, '#160612');
            grad.addColorStop(1, '#020104');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Suburban slasher skyline: houses, windows, phone wires, and police tape.
            const horizon = height - 170;
            ctx.fillStyle = 'rgba(15,23,42,0.88)';
            for (let x = -40; x < width + 60; x += 86) {
                const y = horizon + Math.sin((x * 0.02) + t) * 4;
                ctx.beginPath();
                ctx.moveTo(x, y + 40); ctx.lineTo(x + 43, y); ctx.lineTo(x + 86, y + 40); ctx.closePath(); ctx.fill();
                ctx.fillRect(x + 10, y + 38, 64, 48);
                ctx.fillStyle = (Math.sin(t * 2 + x) > 0.45) ? 'rgba(251,113,133,0.5)' : 'rgba(248,250,252,0.14)';
                ctx.fillRect(x + 30, y + 55, 10, 14); ctx.fillRect(x + 52, y + 55, 10, 14);
                ctx.fillStyle = 'rgba(15,23,42,0.88)';
            }
            ctx.strokeStyle = 'rgba(248,250,252,0.18)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 70 + i * 28 + Math.sin(t + i) * 4);
                ctx.bezierCurveTo(width * .32, 105 + i * 20, width * .62, 35 + i * 28, width, 74 + i * 20);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(225,29,72,0.09)';
            for (let i = 0; i < 7; i++) {
                const x = (i * 73 + (t * 16)) % (width + 80) - 40;
                ctx.save(); ctx.translate(x, 110 + (i % 3) * 65); ctx.rotate(-0.18);
                ctx.fillRect(-30, -4, 98, 8);
                ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.font = 'bold 8px Rajdhani, sans-serif'; ctx.fillText('DO NOT SPLIT UP', -24, 3);
                ctx.restore(); ctx.fillStyle = 'rgba(225,29,72,0.09)';
            }
            const floorY = height - 80;
            ctx.fillStyle = '#09060a'; ctx.fillRect(0, floorY, width, 80);
            ctx.fillStyle = '#1f1017'; ctx.fillRect(0, floorY, width, 12);
            ctx.strokeStyle = 'rgba(251,113,133,.35)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, floorY + 15); ctx.lineTo(width, floorY + 54); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,.06)';
            for (let x = 18; x < width; x += 46) ctx.fillRect(x, floorY + 24, 18, 5);
        }

        function draw() {
            if (domain) {
                if (domain.type === 'VOID') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height); ctx.fillStyle = '#000'; for(let i=0;i<50;i++) ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2); }
                else if (domain.type === 'SHRINE') { ctx.fillStyle = '#450a0a'; ctx.fillRect(0,0,width,height); }
                else if (domain.type === 'RED LIGHT DREAM') { ctx.fillStyle = '#000'; ctx.fillRect(0,0,width,height); ctx.fillStyle = '#b91c1c'; ctx.fillRect(0,0,width,height/2); ctx.globalAlpha=0.5; }
            } else {
                drawHorrorBackdrop();
            }
            ctx.globalAlpha=1;

            ctx.save();
            if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

            entities.sort((a,b) => a.y - b.y);
            entities.forEach(e => { if(e.hp > 0) drawEntity(e); });

            particles.forEach(p => {
                if (p.type === 'text') {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.font = `bold ${p.size}px "Press Start 2P", monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y);
                    ctx.globalAlpha = 1;
                } else if (p.type === 'projectile') {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    entities.forEach(e => {
                        if (e.team !== p.owner.team && Math.abs(e.x+e.w/2 - p.x) < p.size + e.w/2 && Math.abs(e.y+e.h/2 - p.y) < 50) {
                            dealDamage(p.owner, e, 1.0, 'MAGIC');
                            if (!p.pierce) p.life = 0;
                        }
                    });
                } else {
                    ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
                }
            });
            ctx.restore(); updateHUD();
        }

        function drawEntity(e) {
            ctx.save(); ctx.translate(Math.floor(e.x + e.w/2), Math.floor(e.y + e.h)); ctx.scale(e.facing, 1);
            const bob = Math.abs(e.vx) > 0.1 ? Math.sin(Date.now()/100)*2 : 0; ctx.translate(0, bob);

            if (['sorcerer','sukuna','naruto','madara'].includes(e.type)) {
                ctx.shadowBlur = 20; ctx.shadowColor = e.color; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.ellipse(0, -e.h/2, e.w/1.5, e.h/1.5, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            }
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 0, e.w/2, 5, 0, 0, Math.PI*2); ctx.fill();

            drawHumanoid(e);

            if (e.state === 'BLOCK') {
                ctx.strokeStyle = '#93c5fd';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(15, -30, 30, -Math.PI/3, Math.PI/3);
                ctx.stroke();
                ctx.fillStyle = 'rgba(147, 197, 253, 0.2)';
                ctx.fill();
            }

            if (e.stun > 0) { ctx.fillStyle = '#fbbf24'; ctx.font = '20px serif'; ctx.fillText("💫", -10, -e.h - 20); }

            ctx.scale(e.facing, 1); ctx.fillStyle = '#000'; ctx.fillRect(-15, -e.h - 15, 30, 4);
            ctx.fillStyle = e.team === 'blue' ? '#3b82f6' : '#ef4444'; ctx.fillRect(-15, -e.h - 15, 30 * (e.hp/e.maxHp), 4);
            ctx.restore();
        }

        function drawHumanoid(e) {
            const t = e.type;
            const isKiller = e.team === 'red';
            const coat = isKiller ? '#111827' : e.color;
            const accent = isKiller ? '#e11d48' : '#f8fafc';

            // legs / frantic run pose
            ctx.fillStyle = isKiller ? '#020617' : '#0f172a';
            ctx.save();
            const stride = Math.sin(e.frame * 0.24) * (e.state === 'MOVE' ? 5 : 1.5);
            ctx.translate(0, stride * 0.15);
            ctx.fillRect(-11, -25, 8, 25);
            ctx.fillRect(3, -25, 8, 25);
            ctx.restore();

            // torso: survivors wear suspect-board colors; killers are black robes.
            ctx.fillStyle = coat;
            if (t === 'sorcerer') ctx.fillStyle = '#f8fafc';
            if (t === 'sukuna') ctx.fillStyle = '#050208';
            if (t === 'ben10') ctx.fillStyle = '#14532d';
            if (t === 'itachi') ctx.fillStyle = '#111827';
            ctx.fillRect(-13, -56, 26, 32);
            ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(-10, -52, 20, 3);

            // head / mask.
            if (isKiller || t === 'sukuna' || t === 'obito') {
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.ellipse(0, -65, 10, 15, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#020104';
                ctx.beginPath(); ctx.ellipse(-4, -68, 2.4, 5, -0.35, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(4, -68, 2.4, 5, 0.35, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(0, -59, 3, 6, 0, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = '#ffedd5';
                ctx.beginPath(); ctx.arc(0, -63, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = (t === 'killua') ? '#cbd5e1' : (t === 'naruto' || t === 'sanji') ? '#facc15' : '#0f172a';
                ctx.beginPath(); ctx.arc(0, -66, 12, Math.PI, 0); ctx.fill();
                if (t === 'sorcerer') { ctx.fillStyle = '#e11d48'; ctx.fillRect(-9, -71, 18, 3); }
                if (t === 'ben10') { ctx.fillStyle = '#22c55e'; ctx.fillRect(-7, -55, 14, 5); }
            }

            // arms, props, and slasher-rule silhouettes.
            ctx.strokeStyle = accent;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            if (e.state === 'ATTACK' || e.state === 'CAST') {
                ctx.moveTo(11, -49); ctx.lineTo(28, -60);
            } else {
                ctx.moveTo(11, -49); ctx.lineTo(17, -34);
            }
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-11, -48); ctx.lineTo(-18, -35); ctx.stroke();

            if (isKiller || t === 'zoro' || t === 'sukuna') {
                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(25, -61); ctx.lineTo(43, -72); ctx.stroke();
                ctx.fillStyle = '#e11d48'; ctx.beginPath(); ctx.arc(42, -72, 2.5, 0, Math.PI * 2); ctx.fill();
            } else if (t === 'ben10' || t === 'sorcerer') {
                ctx.fillStyle = '#22c55e'; ctx.fillRect(15, -38, 8, 12);
                ctx.fillStyle = '#f8fafc'; ctx.font = '8px sans-serif'; ctx.fillText('☎', 15, -29);
            } else if (t === 'madara') {
                ctx.fillStyle = '#f8fafc'; ctx.font = '16px serif'; ctx.fillText('🎙', 12, -35);
            } else if (t === 'gon') {
                ctx.fillStyle = '#f8fafc'; ctx.font = '15px serif'; ctx.fillText('📕', 10, -34);
            }

            if (e.state === 'CAST') {
                ctx.strokeStyle = 'rgba(34,197,94,.8)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(0, -42, 28 + Math.sin(e.frame*.4)*3, 0, Math.PI*2); ctx.stroke();
            }
        }

        function updateHUD() {
            let bHp=0, bMax=0, rHp=0, rMax=0;
            entities.forEach(e => {
                if (e.isSummon) return;
                if (e.team === 'blue') { bHp+=Math.max(0,e.hp); bMax+=e.maxHp; }
                else { rHp+=Math.max(0,e.hp); rMax+=e.maxHp; }
            });
            document.getElementById('bar-blue').style.width = `${bMax>0?(bHp/bMax)*100:0}%`;
            document.getElementById('bar-red').style.width = `${rMax>0?(rHp/rMax)*100:0}%`;
            document.getElementById('hp-val-blue').innerText = Math.ceil(bHp);
            document.getElementById('hp-val-red').innerText = Math.ceil(rHp);
        }

        function checkWinCondition() {
            const bAlive = entities.some(e => e.team === 'blue' && e.hp > 0 && !e.isSummon);
            const rAlive = entities.some(e => e.team === 'red' && e.hp > 0 && !e.isSummon);
            if (!bAlive || !rAlive) {
                gameActive = false;
                const rs = document.getElementById('result-screen'), rt = document.getElementById('result-title'), rm = document.getElementById('result-msg');
                rs.classList.remove('hidden'); rs.classList.add('flex');
                pulseGif('win', 4000);
                if (!bAlive && !rAlive) {
                    audio.play('lose');
                    audio.ensureMusic('defeat');
                    rt.innerText = "DRAW"; rt.className = "text-6xl md:text-7xl font-display mb-2 text-white text-center"; rm.innerText = "THE THIRD ACT ATE BOTH CASTS";
                }
                else if (bAlive) {
                    audio.play('win');
                    audio.ensureMusic('victory');
                    rt.innerText = "FINAL CUT SURVIVES"; rt.className = "text-5xl md:text-6xl font-display mb-2 text-blue-500 drop-shadow-[0_0_15px_#3b82f6] text-center"; rm.innerText = "THE RULES WERE BROKEN ON PURPOSE";
                }
                else {
                    audio.play('lose');
                    audio.ensureMusic('defeat');
                    rt.innerText = "COPYCAT REVEALED"; rt.className = "text-5xl md:text-6xl font-display mb-2 text-red-500 drop-shadow-[0_0_15px_#ef4444] text-center"; rm.innerText = "THE PHONE CALL CAME FROM INSIDE THE LOOP";
                }
            }
        }

        function restartGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('flex');
            audio.play('ui');
            startGame();
        }
        function toMenu() {
            gameActive = false; isPaused = false;
            clearFeedbackGifs();
            audio.ensureMusic('ambient');
            document.getElementById('pause-screen').classList.add('hidden'); document.getElementById('pause-screen').classList.remove('flex');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('flex');
            document.getElementById('game-screen').style.opacity = '0'; document.getElementById('game-screen').style.pointerEvents = 'none';
            document.getElementById('setup-screen').style.opacity = '1'; document.getElementById('setup-screen').style.pointerEvents = 'auto';
        }
        function toggleAudio() {
            const isOn = audio.toggle();
            document.getElementById('btn-audio').innerText = isOn ? '🔊' : '🔇';
        }

        initSetup();
    </script>
</body>
</html>
