<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050915;color:#f8fbff;font-family:Rajdhani,system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:none}.screen{position:absolute;inset:0}.safe{padding-top:env(safe-area-inset-top,14px);padding-bottom:env(safe-area-inset-bottom,14px)}

#info{z-index:44;transform:translateY(105%);transition:.28s transform;background:rgba(3,7,17,.96);backdrop-filter:blur(16px);display:flex;flex-direction:column}.infoOpen{transform:translateY(0)!important}.drawerTop{display:flex;align-items:center;justify-content:space-between;padding:18px 14px;border-bottom:1px solid var(--line)}.drawerTop h2{margin:0;font-family:Bangers;font-size:34px}.drawerTop button,.ghost{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.infoList{overflow:auto;padding:12px}.intel{display:flex;gap:10px;margin-bottom:10px;padding:11px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.055)}.intel .big{font-size:32px;width:48px;height:48px;display:grid;place-items:center;background:rgba(255,255,255,.07);border-radius:13px}.intel h3{margin:0;font-size:17px}.intel p{margin:2px 0 0;color:#c7d5ec;font-size:12px;line-height:1.25}
#game{z-index:10;opacity:0;pointer-events:none;background:#000;transition:.35s opacity}.gameHud{position:absolute;left:0;right:0;top:0;z-index:30;padding:calc(env(safe-area-inset-top,8px) + 8px) 8px 0;pointer-events:none;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}.vital{min-width:0}.tag{display:flex;justify-content:space-between;font:700 10px Rajdhani;letter-spacing:.12em}.vital.blue .tag{color:#7dd3fc}.vital.red .tag{color:#fda4af}.barBox{height:16px;background:rgba(2,7,19,.76);border:1px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.35)}.barFill{height:100%;width:100%;transition:width .2s}.barFill.blue{background:linear-gradient(90deg,#075985,var(--blue),#e0f2fe)}.barFill.red{margin-left:auto;background:linear-gradient(270deg,#7f1d1d,var(--red),#ffe4e6)}.vs{font-family:Bangers;font-size:34px;line-height:.9;color:var(--gold);text-shadow:3px 3px 0 #000}.fabCol{position:absolute;right:9px;top:calc(env(safe-area-inset-top,8px) + 62px);z-index:34;display:flex;flex-direction:column;gap:9px}.fab{width:45px;height:45px;border-radius:50%;border:1px solid var(--line);background:rgba(5,10,20,.72);color:#fff;backdrop-filter:blur(9px);font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.35)}#callout{position:absolute;left:4vw;right:4vw;top:24%;z-index:32;text-align:center;pointer-events:none;opacity:0;transform:scale(1.25);transition:.24s}.callText{display:inline-block;padding:8px 14px;border:3px solid #fff;border-radius:16px;background:rgba(3,7,17,.68);font-family:Bangers;font-size:clamp(34px,11vw,70px);line-height:.9;letter-spacing:.04em;text-shadow:3px 3px 0 #000,0 0 18px rgba(255,255,255,.4)}.scan{position:absolute;inset:0;z-index:28;pointer-events:none;opacity:.3;background:linear-gradient(rgba(255,255,255,0) 50%,rgba(0,0,0,.3) 50%);background-size:100% 3px}.overlay{z-index:60;background:rgba(1,3,9,.86);backdrop-filter:blur(11px);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}.overlay.show{display:flex}.overlay h2{margin:0 0 8px;font-family:Bangers;font-size:clamp(52px,15vw,92px);line-height:.86;text-shadow:4px 4px 0 #000}.overlay p{font:10px 'Press Start 2P';color:#d6e2f6;line-height:1.7;letter-spacing:.08em}.stack{display:flex;flex-direction:column;gap:12px;width:min(300px,82vw);margin-top:24px}.stack button{min-height:56px;border-radius:16px;border:1px solid var(--line);font-weight:900;letter-spacing:.08em}.stack button:first-child{background:#fff;color:#07101f}.stack button:last-child{background:rgba(255,255,255,.08);color:#fff}.flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:80;animation:flash .16s ease-out forwards}@keyframes flash{to{opacity:0}}@media(min-width:650px){.roster{grid-template-columns:repeat(6,1fr)}.draftScroll{max-width:760px;margin:0 auto;width:100%}.startDock{left:50%;transform:translateX(-50%);max-width:760px}.unitCard{min-height:105px}}
</style>

<body>
<section id="setup" class="screen">
  <div class="topCard safe"><button id="infoBtn" class="infoBtn" aria-label="Open fighter intel">?</button><div class="brand"><div class="kicker">GLOBAL TOURNAMENT // PORTRAIT ARCADE</div><h1><span>WORLD CIRCUIT</span><br><span>RIVALS</span></h1></div></div>
  <div class="draftScroll">
    <div class="corner blue"><div class="cornerHead"><b>BLUE CORNER DRAFT</b><span id="total-blue" class="count">0/15</span></div><div id="blue-roster" class="roster"></div></div>
    <div class="corner red"><div class="cornerHead"><b>RED CORNER DRAFT</b><span id="total-red" class="count">0/15</span></div><div id="red-roster" class="roster"></div></div>
    <div class="sliderPanel"><div class="sliderLabel"><span>ROUND STAMINA SCALE</span><span id="disp-hp">STANDARD</span></div><input id="input-hp" type="range" min="0" max="6" value="0" step="1"></div>
  </div>
  <div class="startDock safe"><button id="start-btn" class="primary">RING THE BELL</button></div>
</section>
<section id="info" class="screen"><div class="drawerTop safe"><h2>Fighter Intel</h2><button id="closeInfo">CLOSE</button></div><div id="info-list" class="infoList"></div></section>
<section id="game" class="screen"><canvas id="gameCanvas"></canvas><div class="scan"></div><div class="gameHud"><div class="vital blue"><div class="tag"><span>BLUE CORNER</span><span id="hp-val-blue">100%</span></div><div class="barBox"><div id="bar-blue" class="barFill blue"></div></div></div><div class="vs">VS</div><div class="vital red"><div class="tag"><span id="hp-val-red">100%</span><span>RED CORNER</span></div><div class="barBox"><div id="bar-red" class="barFill red"></div></div></div></div><div class="fabCol"><button id="btn-audio" class="fab" aria-label="Toggle audio">🔊</button><button id="btn-pause" class="fab" aria-label="Pause">⏸</button><button id="btn-menu" class="fab" aria-label="Return to bracket">⌂</button></div><div id="callout"><span id="calloutText" class="callText"></span></div><div id="flash-layer"></div></section>
<section id="pause-screen" class="screen overlay"><h2>Corner Break</h2><p>THE ROUND IS FROZEN. TAP RESUME TO CONTINUE THE DUEL.</p><div class="stack"><button id="resumeBtn">RESUME</button><button id="pauseMenuBtn">RETURN TO BRACKET</button></div></section>
<section id="result-screen" class="screen overlay"><h2 id="result-title">VICTORY</h2><p id="result-msg"></p><div class="stack"><button id="restartBtn">RUNBACK</button><button id="resultMenuBtn">RETURN TO BRACKET</button></div></section>
<script>
const TEAM_LIMIT=15;
const UNITS={
 dragon:{name:'Dragon Shot',icon:'🐉',hp:6000,spd:3.5,pwr:120,cost:10,color:'#38bdf8',iq:1,desc:'Blue anchor. Focus dash, vacuum burst, elite screen control.'},
 tiger:{name:'Tiger King',icon:'🐯',hp:6000,spd:3.5,pwr:120,cost:10,color:'#fb4566',iq:1,desc:'Red anchor. Razor super, pressure field, brutal corner damage.'},
 grappler:{name:'Iron Grappler',icon:'🤼',hp:4500,spd:2.8,pwr:65,cost:6,color:'#a3a3a3',iq:1,desc:'Heavy protector. Clinch bite, lifesteal, rage guard.'},
 gadget:{name:'Gadget Prodigy',icon:'⌚',hp:4000,spd:3,pwr:70,cost:6,color:'#22c55e',iq:1,desc:'Switcher. Form change, screen stun, alien blast.'},
 cyclone:{name:'Cyclone Kid',icon:'🌪️',hp:4200,spd:3.5,pwr:75,cost:7,color:'#fb923c',iq:1,desc:'Rushdown hero. Clone feints and spinning projectile.'},
 volt:{name:'Volt Rival',icon:'⚡',hp:4100,spd:3.8,pwr:75,cost:7,color:'#818cf8',iq:1,desc:'Precision rival. Flash step and piercing counter strike.'},
 emperor:{name:'Fallen Emperor',icon:'☄️',hp:5000,spd:3.2,pwr:90,cost:8,color:'#991b1b',iq:1,desc:'Boss presence. Meteor super and armor aura.'},
 gravity:{name:'Gravity Monk',icon:'🧲',hp:4000,spd:2.5,pwr:85,cost:7,color:'#f97316',iq:1,desc:'Space control. Push burst and guard discipline.'},
 dancer:{name:'Flame Dancer',icon:'🦵',hp:3500,spd:4.5,pwr:60,cost:5,color:'#facc15',iq:1,desc:'Kicking specialist. Flying flame kick and speed blitz.'},
 blade:{name:'Blade Ronin',icon:'⚔️',hp:3800,spd:3.2,pwr:75,cost:6,color:'#16a34a',iq:1,desc:'Weapon stance. Long slash wave and high damage pokes.'},
 illusion:{name:'Illusion Master',icon:'👁️',hp:3000,spd:3.5,pwr:80,cost:6,color:'#b91c1c',iq:1,desc:'Mind-game fighter. Red moon super and black flame.'},
 mask:{name:'Mask Phantom',icon:'🎭',hp:3500,spd:3,pwr:65,cost:6,color:'#7c3aed',iq:1,desc:'Phase trickster. Periodic invulnerability and misdirection.'},
 hammer:{name:'Limit Hammer',icon:'👊',hp:3500,spd:4,pwr:100,cost:7,color:'#22c55e',iq:.8,desc:'All-in striker. Charged haymaker with huge freeze-frame.'},
 spark:{name:'Spark Assassin',icon:'💥',hp:3200,spd:5,pwr:60,cost:6,color:'#c084fc',iq:1,desc:'Stun specialist. Lightning tap and fast close-range tempo.'},
 rookie:{name:'Rookie Flash',icon:'🥊',hp:2500,spd:2.5,pwr:50,cost:4,color:'#f59e0b',iq:1,desc:'Budget brawler. Honest jab chain and comeback grit.'},
 shadow:{name:'Shadow Coach',icon:'👤',hp:3500,spd:3,pwr:65,cost:5,color:'#4c1d95',iq:1,desc:'Summoner. Calls rookie shadows when the corner has space.'},
 rubber:{name:'Rubber Champ',icon:'👒',hp:4000,spd:2.8,pwr:55,cost:5,color:'#ef4444',iq:1,desc:'Loose-limb trickster. Bouncy pressure and awkward timing.'},
 immortal:{name:'Monkey Immortal',icon:'🐵',hp:4500,spd:3,pwr:60,cost:5,color:'#eab308',iq:1,desc:'Veteran. Revives once with half vitality and crowd heat.'}
};
let teams={blue:{},red:{}};['blue','red'].forEach(t=>Object.keys(UNITS).forEach(k=>teams[t][k]=0));teams.blue.dragon=1;teams.red.tiger=1;let hpMult=1;
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let width=0,height=0,shake=0,freezeFrames=0,gameActive=false,isPaused=false,entities=[],particles=[],domain=null,roundStart=0;
class FightAudio{constructor(){this.enabled=true;this.ctx=null;this.master=null;this.music=null;this.osc=null;this.cool=new Map()}init(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.enabled ? .58 : 0;this.master.connect(this.ctx.destination);this.music=this.ctx.createGain();this.music.gain.value=0;this.music.connect(this.master);this.ensure('ambient')}resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}toggle(){this.enabled=!this.enabled;if(this.master)this.master.gain.value=this.enabled ? .58 : 0;if(!this.enabled&&this.music)this.music.gain.value=0;return this.enabled}throttle(k,g=70){const n=performance.now(),l=this.cool.get(k)||0;if(n-l<g)return true;this.cool.set(k,n);return false}tone(k){if(!this.enabled)return;this.init();this.resume();if(!this.ctx)return;const map={hit:[150,.07,'square'],block:[260,.08,'triangle'],slash:[900,.12,'sawtooth'],blast:[75,.28,'sawtooth'],arise:[220,.32,'triangle'],teleport:[520,.14,'triangle'],debuff:[330,.18,'square'],domain:[95,.55,'sine'],ui:[600,.05,'triangle'],start:[420,.16,'triangle'],pause:[180,.09,'square'],resume:[440,.1,'triangle'],win:[720,.5,'triangle'],lose:[105,.55,'sawtooth']};const [f,d,w]=map[k]||map.ui;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=w;o.frequency.value=f;o.connect(g);g.connect(this.master);const t=this.ctx.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}play(k){if(this.throttle(k,k==='hit'?60:35))return;this.tone(k)}ensure(mode='ambient'){this.init();if(!this.ctx||!this.music||!this.enabled)return;if(!this.osc){this.osc=this.ctx.createOscillator();this.osc.type='triangle';this.osc.connect(this.music);this.osc.start()}const t=this.ctx.currentTime,settings={ambient:[86,.025],gameplay:[118,.05],victory:[148,.045],defeat:[65,.04]}[mode]||[90,.03];this.osc.frequency.setTargetAtTime(settings[0],t,.2);this.music.gain.setTargetAtTime(settings[1],t,.25)}}
const audio=new FightAudio();
function resize(){width=canvas.width=innerWidth; height=canvas.height=innerHeight}addEventListener('resize',resize);resize();
function $(id){return document.getElementById(id)}
function initSetup(){renderRoster('blue');renderRoster('red');renderInfo();updateCounts();bindUI()}function bindUI(){ $('infoBtn').onclick=toggleInfo;$('closeInfo').onclick=toggleInfo;$('input-hp').oninput=e=>updateHpDisplay(e.target.value);$('start-btn').onclick=startGame;$('btn-audio').onclick=()=>{$('btn-audio').textContent=audio.toggle()?'🔊':'🔇'};$('btn-pause').onclick=togglePause;$('btn-menu').onclick=toMenu;$('resumeBtn').onclick=togglePause;$('pauseMenuBtn').onclick=toMenu;$('restartBtn').onclick=restartGame;$('resultMenuBtn').onclick=toMenu;}
function renderRoster(team){const c=$(team+'-roster');c.innerHTML='';Object.keys(UNITS).forEach(k=>{const u=UNITS[k],d=document.createElement('div');d.id=`card-${team}-${k}`;d.className='unitCard';d.style.color=u.color;d.innerHTML=`<div class="unitIcon">${u.icon}</div><div class="unitName">${u.name}</div><div class="stepper"><button aria-label="Remove ${u.name}">−</button><span id="count-${team}-${k}">0</span><button aria-label="Add ${u.name}">+</button></div>`;const [minus,plus]=d.querySelectorAll('button');minus.onclick=()=>modUnit(team,k,-1);plus.onclick=()=>modUnit(team,k,1);c.appendChild(d)})}
function renderInfo(){const l=$('info-list');l.innerHTML='';Object.keys(UNITS).forEach(k=>{const u=UNITS[k],d=document.createElement('div');d.className='intel';d.innerHTML=`<div class="big">${u.icon}</div><div><h3>${u.name}</h3><p><b>COST ${u.cost}</b> // HP ${u.hp} // POWER ${u.pwr}</p><p>${u.desc}</p></div>`;l.appendChild(d)})}
function toggleInfo(){audio.play('ui');$('info').classList.toggle('infoOpen')}
function modUnit(t,k,d){const tot=Object.values(teams[t]).reduce((a,b)=>a+b,0);if(d>0&&tot<TEAM_LIMIT){teams[t][k]++;audio.play('ui')}else if(d<0&&teams[t][k]>0){teams[t][k]--;audio.play('ui')}updateCounts()}
function updateCounts(){let bt=0,rt=0;['blue','red'].forEach(t=>{let tc=0;Object.keys(UNITS).forEach(k=>{const c=teams[t][k];tc+=c;$(`count-${t}-${k}`).textContent=c;const card=$(`card-${t}-${k}`);card.classList.toggle('selected',c>0);card.style.background=c>0?(t==='blue'?'rgba(56,189,248,.16)':'rgba(251,69,102,.16)'):'rgba(2,7,19,.56)'});$(`total-${t}`).textContent=`${tc}/${TEAM_LIMIT}`;if(t==='blue')bt=tc;else rt=tc});$('start-btn').disabled=bt===0||rt===0}
function updateHpDisplay(v){const o=['STANDARD','LOW 50%','HIGH 200%','BOSS 500%','RAID 1000%','ENDLESS','GLASS'],m=[1,.5,2,5,10,9999,.01];$('disp-hp').textContent=o[v];hpMult=m[v];audio.play('ui')}
function startGame(){audio.init();audio.play('start');audio.play('domain');audio.ensure('gameplay');$('setup').style.opacity='0';$('setup').style.pointerEvents='none';$('pause-screen').classList.remove('show');$('result-screen').classList.remove('show');$('game').style.opacity='1';$('game').style.pointerEvents='auto';gameActive=true;isPaused=false;entities=[];particles=[];domain=null;shake=0;freezeFrames=0;roundStart=performance.now();spawnTeam('blue',width*.15);spawnTeam('red',width*.85);requestAnimationFrame(gameLoop)}
function togglePause(){if(!gameActive)return;isPaused=!isPaused;if(isPaused){audio.play('pause');audio.ensure('ambient');$('pause-screen').classList.add('show')}else{audio.play('resume');audio.ensure('gameplay');$('pause-screen').classList.remove('show');requestAnimationFrame(gameLoop)}}
function toMenu(){gameActive=false;isPaused=false;audio.ensure('ambient');$('pause-screen').classList.remove('show');$('result-screen').classList.remove('show');$('game').style.opacity='0';$('game').style.pointerEvents='none';$('setup').style.opacity='1';$('setup').style.pointerEvents='auto'}
function restartGame(){audio.play('ui');$('result-screen').classList.remove('show');startGame()}
function spawnTeam(t,sx){let off=0;Object.keys(UNITS).forEach(k=>{for(let i=0;i<teams[t][k];i++){createEntity(t,k,sx+(Math.random()*40-20)+(t==='blue'?-off:off));off+=15}})}
function createEntity(team,type,x,isSummon=false){const s=UNITS[type];let hp=isSummon?s.hp:Math.floor(s.hp*hpMult);if(hpMult<.1&&!isSummon)hp=1;entities.push({id:Math.random().toString(36),team,type,x,y:height-100-Math.random()*20,vx:0,vy:0,w:30,h:60,hp,maxHp:hp,spd:s.spd*2,pwr:s.pwr,iq:s.iq||1,color:s.color,facing:team==='blue'?1:-1,state:'IDLE',frame:Math.floor(Math.random()*100),cd:{atk:0,skill1:0,skill2:0,skill3:0,ult:0,block:0},blockTimer:0,target:null,isSummon,life:isSummon?600:999999,stun:0,invuln:0,mode:'normal',revived:false,clones:0});for(let i=0;i<10;i++)particles.push({x,y:height-100,vx:(Math.random()-.5)*10,vy:-Math.random()*10,life:1,color:team==='blue'?'#7dd3fc':'#fda4af',size:3,type:'spark'})}
function gameLoop(){if(!gameActive||isPaused)return;if(freezeFrames>0){freezeFrames--;draw();requestAnimationFrame(gameLoop);return}updatePhysics();updateAI();updateDomain();draw();checkWinCondition();requestAnimationFrame(gameLoop)}
function updatePhysics(){if(shake>0)shake*=.9;entities.forEach(e=>{if(e.hp<=0&&!e.revived&&e.type==='immortal'){e.hp=e.maxHp*.5;e.revived=true;e.mode='immortal';e.invuln=60;showPopup('IMMORTAL RUNBACK');audio.play('domain')}if(e.type==='grappler'&&e.hp>0&&e.hp<e.maxHp&&e.frame%60===0)e.hp+=e.maxHp*.01;if((e.type==='dragon'||e.type==='tiger')&&e.hp<e.maxHp&&e.hp>0&&e.frame%60===0)e.hp+=e.maxHp*.005;if(e.hp<=0)return;e.vy+=.8;if(e.state==='BLOCK'||e.state==='CAST')e.vx*=.8;if(e.state==='BLOCK'){e.blockTimer--;if(e.blockTimer<=0){e.state='IDLE';e.cd.block=120}}e.x+=e.vx;e.y+=e.vy;e.frame++;const floor=height-80;if(e.y+e.h>floor){e.y=floor-e.h;e.vy=0;e.vx*=.8}if(e.x<0){e.x=0;e.vx*=-.5}if(e.x>width-e.w){e.x=width-e.w;e.vx*=-.5}if(e.stun>0){e.stun--;e.vx*=.9}if(e.invuln>0)e.invuln--;Object.keys(e.cd).forEach(k=>{if(e.cd[k]>0)e.cd[k]--});if(e.isSummon)e.life--});for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;if(!['beam','projectile','text'].includes(p.type))p.vy+=.1;if(p.type==='text')p.vy=-.5;p.life-=p.decay||.02;if(p.life<=0)particles.splice(i,1)}}
function updateAI(){entities.forEach(e=>{if(e.hp<=0||e.stun>0||e.state==='BLOCK')return;if(e.isSummon&&e.life<=0){e.hp=0;return}let target=null,minDist=Infinity;entities.forEach(o=>{if(o.team!==e.team&&o.hp>0){const d=Math.abs(e.x+e.w/2-(o.x+o.w/2));if(d<minDist){minDist=d;target=o}}});e.target=target;if(!target){e.state='IDLE';if(Math.abs(e.vx)>.1)e.vx*=.9;return}const dist=minDist;e.facing=target.x>e.x?1:-1;switch(e.type){case'dragon':if(e.cd.ult<=0&&Math.random()<.1){castDomain(e,'VOID');return}if(dist<800&&e.cd.skill1<=0&&Math.random()<.3){e.state='CAST';e.cd.skill1=120;e.vx=0;createProjectile(e,target,'PURPLE');return}break;case'tiger':if(e.cd.ult<=0&&Math.random()<.1){castDomain(e,'SHRINE');return}if(dist<800&&e.cd.skill1<=0&&Math.random()<.3){e.state='CAST';e.cd.skill1=120;e.vx=0;showPopup('WORLD RAZOR');setTimeout(()=>{audio.play('slash');shake=20;entities.forEach(o=>{if(o.team!==e.team)dealDamage(e,o,5,'WORLD')})},500);return}break;case'grappler':if(dist<100&&e.cd.skill1<=0){e.state='ATTACK';e.cd.skill1=80;e.vx=0;audio.play('blast');dealDamage(e,target,2,'BITE');e.hp+=200;particles.push({x:e.x,y:e.y,vx:0,vy:-2,life:1,color:'#10b981',size:5,type:'spark'});return}break;case'gadget':if(e.cd.skill1<=0&&Math.random()<.2){e.state='CAST';e.cd.skill1=150;e.vx=0;audio.play('arise');showPopup('FORM BREAK');screenFlash();shake=15;entities.forEach(o=>{if(o.team!==e.team){o.stun=60;dealDamage(e,o,3,'MAGIC')}});return}break;case'dancer':if(dist<200&&e.cd.skill1<=0){e.state='ATTACK';e.cd.skill1=60;e.vx=e.facing*15;particles.push({x:e.x,y:e.y,vx:0,vy:0,life:.5,color:'#facc15',size:30,type:'spark'});setTimeout(()=>dealDamage(e,target,2,'FIRE_KICK'),200);return}break;case'blade':if(dist<300&&e.cd.skill1<=0){e.state='ATTACK';e.cd.skill1=80;e.vx=0;audio.play('slash');createProjectile(e,target,'SLASH_WAVE');return}break;case'cyclone':if(e.cd.skill2<=0&&e.clones<3){e.state='CAST';e.cd.skill2=200;e.vx=0;audio.play('arise');createEntity(e.team,'cyclone',e.x+(Math.random()*40-20),true);e.clones++;return}if(dist<400&&e.cd.skill1<=0){e.state='CAST';e.cd.skill1=100;e.vx=0;createProjectile(e,target,'RASENGAN');return}break;case'volt':if(dist>200&&e.cd.skill1<=0){e.state='ATTACK';e.cd.skill1=100;e.x=target.x-(e.facing*50);audio.play('teleport');setTimeout(()=>dealDamage(e,target,2.5,'CHIDORI'),100);return}break;case'illusion':if(e.cd.ult<=0&&Math.random()<.2){castDomain(e,'TSUKUYOMI');return}if(dist<400&&e.cd.skill1<=0){e.state='CAST';e.cd.skill1=120;e.vx=0;createProjectile(e,target,'AMATERASU');return}break;case'gravity':if(dist<300&&e.cd.skill1<=0){e.state='CAST';e.cd.skill1=150;e.vx=0;showPopup('RING PUSH');audio.play('blast');entities.forEach(o=>{if(o.team!==e.team&&Math.abs(o.x-e.x)<300){o.vx=e.facing*20;o.vy=0;dealDamage(e,o,2,'MAGIC')}});return}break;case'mask':if(Math.random()<.1)e.invuln=20;break;case'emperor':if(e.cd.ult<=0&&Math.random()<.2){e.state='CAST';e.cd.ult=999;e.vx=0;showPopup('METEOR FINISH');setTimeout(()=>{screenFlash();shake=30;entities.forEach(o=>{if(o.team!==e.team)dealDamage(e,o,5,'SMASH')})},1000);return}break;case'hammer':if(dist<80&&e.cd.skill1<=0){e.state='CAST';e.cd.skill1=150;e.vx=0;showPopup('CHARGE...');setTimeout(()=>{showPopup('HAYMAKER!');audio.play('blast');dealDamage(e,target,4,'SMASH');shake=20},800);return}break;case'spark':if(dist<100&&e.cd.skill1<=0){e.state='ATTACK';e.cd.skill1=60;e.vx=0;audio.play('debuff');target.stun=60;dealDamage(e,target,1.5,'LIGHTNING');return}break;case'shadow':if(e.cd.skill2<=0&&entities.filter(ent=>ent.team===e.team).length<25){e.state='CAST';e.cd.skill2=100;e.vx=0;audio.play('arise');createEntity(e.team,'rookie',e.x,true);return}break}if(dist<60&&e.cd.atk<=0){e.state='ATTACK';e.cd.atk=15;e.vx=0;setTimeout(()=>dealDamage(e,target,1,'MELEE'),100)}else if(dist>50){e.state='MOVE';e.vx=e.facing*e.spd}else{e.state='IDLE';e.vx=0}})}
function createProjectile(owner,target,type){const py=owner.y+20,px=owner.x+owner.w/2+owner.facing*20;if(type==='PURPLE'){audio.play('blast');showPopup('FOCUS FIREBALL');setTimeout(()=>{screenFlash();shake=30;freezeFrames=5;particles.push({x:px,y:py,vx:owner.facing*15,vy:0,life:3,color:'#a855f7',size:100,type:'projectile',damage:15000,owner,pierce:true})},500)}else if(type==='RASENGAN'){audio.play('slash');particles.push({x:px,y:py,vx:owner.facing*12,vy:0,life:1,color:'#38bdf8',size:30,type:'projectile',damage:400,owner,effect:'knockback'})}else if(type==='AMATERASU'){audio.play('domain');particles.push({x:target.x,y:target.y,vx:0,vy:0,life:2,color:'#020617',size:40,type:'projectile',damage:200,owner,pierce:true})}else if(type==='SLASH_WAVE'){audio.play('slash');particles.push({x:px,y:py,vx:owner.facing*20,vy:0,life:.5,color:'#16a34a',size:50,type:'projectile',damage:300,owner,pierce:true})}}
function dealDamage(att,def,mult,type){if(def.hp<=0||def.invuln>0)return;if(def.state==='BLOCK'){audio.play('block');particles.push({x:def.x+def.w/2,y:def.y,vx:0,vy:-1,life:.8,color:'#fff',size:14,type:'text',text:'BLOCKED'});return}if(def.cd.block<=0&&def.stun<=0&&def.state!=='CAST'&&type!=='DOMAIN_HIT'&&type!=='WORLD'){const chance=(def.type==='grappler'||def.type==='gravity') ? .3 : .15;if(Math.random()<chance){def.state='BLOCK';def.blockTimer=20;def.cd.block=120;audio.play('block');particles.push({x:def.x+def.w/2,y:def.y,vx:0,vy:-1,life:.8,color:'#fff',size:14,type:'text',text:'GUARD!'});return}}if(def.type==='dragon'&&type!=='WORLD'&&type!=='DOMAIN_HIT'){if(Math.random()<.9){particles.push({x:def.x+def.w/2,y:def.y+def.h/2,vx:0,vy:0,life:.5,color:'#38bdf8',size:40,type:'shield'});return}}if(type==='WORLD'){def.hp-=5000;audio.play('blast');particles.push({x:def.x+def.w/2,y:def.y+def.h/2,vx:0,vy:0,life:.5,color:'#000',size:60,type:'slash_anim'});return}const dmg=att.pwr*2.5*mult;def.hp-=dmg;audio.play('hit');if(type==='FIRE_KICK'||type==='AMATERASU')particles.push({x:def.x,y:def.y,vx:0,vy:-2,life:.5,color:'#f97316',size:30,type:'smoke'});else if(type==='LIGHTNING'||type==='CHIDORI')particles.push({x:def.x,y:def.y,vx:0,vy:0,life:.3,color:'#fff',size:40,type:'spark'});else particles.push({x:def.x+def.w/2,y:def.y+def.h/2,vx:(Math.random()-.5)*4,vy:-2,life:.45,color:att.team==='blue'?'#7dd3fc':'#fda4af',size:10,type:'spark'});def.vx=att.facing*5*mult;def.vy=0;if(mult>2){shake=5;freezeFrames=2}}
function castDomain(owner,type){domain={type,owner:owner.id,time:600};owner.cd.ult=9999;audio.play('domain');screenFlash();shake=10;let name='SUPER ARENA';if(type==='VOID')name='BLUE FOCUS ARENA';else if(type==='SHRINE')name='RED RAZOR ARENA';else if(type==='TSUKUYOMI')name='RED MOON ARENA';showPopup(name);if(type==='VOID'||type==='TSUKUYOMI')entities.forEach(e=>{if(e.id!==owner.id&&e.type!=='tiger')e.stun=600})}
function showPopup(text){$('calloutText').textContent=text;$('callout').style.opacity='1';$('callout').style.transform='scale(1)';clearTimeout(showPopup.t);showPopup.t=setTimeout(()=>{$('callout').style.opacity='0';$('callout').style.transform='scale(1.25)'},1900)}
function updateDomain(){if(!domain)return;domain.time--;const owner=entities.find(e=>e.id===domain.owner);if(!owner){domain=null;return}if(domain.type==='SHRINE'&&domain.time%5===0){entities.forEach(e=>{if(e.team!==owner.team){dealDamage(owner,e,.5,'DOMAIN_HIT');particles.push({x:e.x+Math.random()*20,y:e.y+Math.random()*40,vx:0,vy:0,life:.2,color:'#fff',size:20,type:'slash_anim'})}});shake=2}else if((domain.type==='VOID'||domain.type==='TSUKUYOMI')&&domain.time%30===0){entities.forEach(e=>{if(e.team!==owner.team)dealDamage(owner,e,.3,'MAGIC')})}if(domain.time<=0)domain=null}
function screenFlash(){const f=document.createElement('div');f.className='flash';$('flash-layer').appendChild(f);setTimeout(()=>f.remove(),200)}
function draw(){drawStage();ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);entities.sort((a,b)=>a.y-b.y);entities.forEach(e=>{if(e.hp>0)drawEntity(e)});particles.forEach(drawParticle);ctx.restore();updateHUD()}
function drawStage(){const t=performance.now()/1000,floor=height-80;let grad=ctx.createLinearGradient(0,0,0,height);grad.addColorStop(0,'#07101f');grad.addColorStop(.55,'#111827');grad.addColorStop(1,'#02040b');ctx.fillStyle=grad;ctx.fillRect(0,0,width,height);if(domain){if(domain.type==='VOID'){ctx.fillStyle='#eff6ff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#07101f'}else if(domain.type==='SHRINE'){ctx.fillStyle='#450a0a';ctx.fillRect(0,0,width,height);ctx.fillStyle='#fff'}else{ctx.fillStyle='#020617';ctx.fillRect(0,0,width,height);ctx.fillStyle='#b91c1c';ctx.fillRect(0,0,width,height/2)}for(let i=0;i<42;i++){ctx.globalAlpha=.35;ctx.fillRect((i*61+t*80)%width,Math.random()*height,2,8)}ctx.globalAlpha=1}else{ctx.globalAlpha=.7;for(let i=0;i<9;i++){const x=(i/8)*width;ctx.strokeStyle=i%2?'rgba(56,189,248,.22)':'rgba(251,69,102,.2)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(width/2,70);ctx.lineTo(x,floor);ctx.stroke()}ctx.globalAlpha=1;for(let i=0;i<24;i++){const x=(i*53+t*12)%width,y=105+Math.sin(t+i)*18;ctx.fillStyle=i%2?'rgba(56,189,248,.35)':'rgba(251,69,102,.32)';ctx.beginPath();ctx.arc(x,y,3+(i%3),0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.08)';ctx.font='700 18px Rajdhani';ctx.textAlign='center';ctx.fillText('TOKYO • RIO • METRO CITY • CAIRO • SEOUL',width/2,Math.max(92,height*.14))}ctx.fillStyle='#2b160b';ctx.fillRect(0,floor,width,80);const floorGrad=ctx.createLinearGradient(0,floor,0,height);floorGrad.addColorStop(0,'#f59e0b');floorGrad.addColorStop(.12,'#8b5a2b');floorGrad.addColorStop(1,'#180c05');ctx.fillStyle=floorGrad;ctx.fillRect(0,floor,width,80);ctx.strokeStyle='rgba(255,255,255,.18)';for(let x=-width;x<width*2;x+=38){ctx.beginPath();ctx.moveTo(x+Math.sin(t)*15,floor);ctx.lineTo(x+120,height);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(width*.5-2,floor,4,80);ctx.fillStyle='rgba(56,189,248,.4)';ctx.fillRect(0,floor,8,80);ctx.fillStyle='rgba(251,69,102,.4)';ctx.fillRect(width-8,floor,8,80)}
function drawEntity(e){ctx.save();ctx.translate(Math.floor(e.x+e.w/2),Math.floor(e.y+e.h));ctx.scale(e.facing,1);const bob=Math.abs(e.vx)>.1?Math.sin(Date.now()/100)*2:0;ctx.translate(0,bob);if(['dragon','tiger','cyclone','emperor'].includes(e.type)){ctx.shadowBlur=20;ctx.shadowColor=e.color;ctx.globalAlpha=.3;ctx.beginPath();ctx.ellipse(0,-e.h/2,e.w/1.5,e.h/1.5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0}ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.ellipse(0,0,e.w/2,5,0,0,Math.PI*2);ctx.fill();drawFighter(e);if(e.state==='BLOCK'){ctx.strokeStyle='#e0f2fe';ctx.lineWidth=3;ctx.beginPath();ctx.arc(15,-30,30,-Math.PI/3,Math.PI/3);ctx.stroke();ctx.fillStyle='rgba(147,197,253,.2)';ctx.fill()}if(e.stun>0){ctx.fillStyle='#fbbf24';ctx.font='20px serif';ctx.fillText('✦',-9,-e.h-20)}ctx.scale(e.facing,1);ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(-16,-e.h-16,32,5);ctx.fillStyle=e.team==='blue'?'#38bdf8':'#fb4566';ctx.fillRect(-16,-e.h-16,32*Math.max(0,e.hp/e.maxHp),5);ctx.restore()}
function drawFighter(e){const t=e.type;ctx.fillStyle='#101827';if(t==='rubber')ctx.fillStyle='#2563eb';if(t==='cyclone')ctx.fillStyle='#f97316';if(t==='dancer')ctx.fillStyle='#09090b';if(t==='hammer')ctx.fillStyle='#16a34a';ctx.fillRect(-10,-25,8,25);ctx.fillRect(2,-25,8,25);ctx.fillStyle=e.color;if(t==='dragon')ctx.fillStyle='#075985';if(t==='tiger')ctx.fillStyle='#fff7ed';if(t==='illusion')ctx.fillStyle='#020617';if(t==='dancer')ctx.fillStyle='#1e293b';ctx.fillRect(-13,-56,26,31);ctx.fillStyle=e.team==='blue'?'#7dd3fc':'#fda4af';ctx.fillRect(-13,-39,26,5);ctx.fillStyle=t==='grappler'?'#111':(t==='mask'?'#fde68a':'#ffedd5');ctx.beginPath();ctx.arc(0,-63,10,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.color;if(t==='dragon'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-66,14,Math.PI,0);ctx.fill()}else if(t==='tiger'){ctx.fillStyle='#fb7185';ctx.beginPath();ctx.moveTo(-12,-67);ctx.lineTo(0,-81);ctx.lineTo(12,-67);ctx.fill()}else if(t==='cyclone'||t==='dancer'){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,-66,12,Math.PI,0);ctx.fill()}else if(t==='blade'){ctx.fillStyle='#16a34a';ctx.beginPath();ctx.arc(0,-66,12,Math.PI,0);ctx.fill()}else if(t==='volt'||t==='emperor'||t==='illusion'){ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(0,-66,13,Math.PI,0);ctx.fill()}else if(t==='hammer'){ctx.fillStyle='#020617';ctx.beginPath();ctx.moveTo(-10,-65);ctx.lineTo(0,-91);ctx.lineTo(10,-65);ctx.fill()}else if(t==='spark'){ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(0,-66,13,Math.PI,0);ctx.fill()}ctx.fillStyle=e.color;if(t==='tiger')ctx.fillStyle='#fff7ed';if(e.state==='ATTACK'||e.state==='CAST'){ctx.save();ctx.translate(10,-50);ctx.rotate(-Math.PI/4);ctx.fillRect(0,0,18,7);ctx.fillStyle=e.team==='blue'?'#7dd3fc':'#fda4af';ctx.beginPath();ctx.arc(20,3,7,0,Math.PI*2);ctx.fill();if(t==='blade'||t==='volt'){ctx.fillStyle='#e5e7eb';ctx.fillRect(10,-2,31,4)}ctx.restore()}else{ctx.fillRect(10,-50,7,20);ctx.beginPath();ctx.arc(14,-31,5,0,Math.PI*2);ctx.fill()}}
function drawParticle(p){if(p.type==='text'){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px 'Press Start 2P'`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}else if(p.type==='projectile'){p.x+=p.vx;p.y+=p.vy;p.life-=.02;ctx.fillStyle=p.color;ctx.shadowBlur=18;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;entities.forEach(e=>{if(e.team!==p.owner.team&&Math.abs(e.x+e.w/2-p.x)<p.size+e.w/2&&Math.abs(e.y+e.h/2-p.y)<50){dealDamage(p.owner,e,1,'MAGIC');if(!p.pierce)p.life=0}})}else if(p.type==='slash_anim'){ctx.globalAlpha=p.life;ctx.strokeStyle=p.color;ctx.lineWidth=Math.max(2,p.size/8);ctx.beginPath();ctx.arc(p.x,p.y,p.size,-.6,.6);ctx.stroke();ctx.globalAlpha=1}else{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function updateHUD(){let bHp=0,bMax=0,rHp=0,rMax=0;entities.forEach(e=>{if(e.isSummon)return;if(e.team==='blue'){bHp+=Math.max(0,e.hp);bMax+=e.maxHp}else{rHp+=Math.max(0,e.hp);rMax+=e.maxHp}});$('bar-blue').style.width=`${bMax>0?(bHp/bMax)*100:0}%`;$('bar-red').style.width=`${rMax>0?(rHp/rMax)*100:0}%`;$('hp-val-blue').textContent=Math.ceil(bHp);$('hp-val-red').textContent=Math.ceil(rHp)}
function checkWinCondition(){const bAlive=entities.some(e=>e.team==='blue'&&e.hp>0&&!e.isSummon),rAlive=entities.some(e=>e.team==='red'&&e.hp>0&&!e.isSummon);if(!bAlive||!rAlive){gameActive=false;const rt=$('result-title'),rm=$('result-msg');$('result-screen').classList.add('show');if(!bAlive&&!rAlive){audio.play('lose');audio.ensure('defeat');rt.textContent='DOUBLE KO';rt.style.color='#fff';rm.textContent='BOTH CORNERS HIT THE CANVAS.'}else if(bAlive){audio.play('win');audio.ensure('victory');rt.textContent='BLUE CORNER WINS';rt.style.color='#38bdf8';rm.textContent='BLUE CONTROL HOLDS THE WORLD CIRCUIT.'}else{audio.play('lose');audio.ensure('defeat');rt.textContent='RED CORNER WINS';rt.style.color='#fb4566';rm.textContent='RED PRESSURE TAKES THE FINALS.'}}}
initSetup();
