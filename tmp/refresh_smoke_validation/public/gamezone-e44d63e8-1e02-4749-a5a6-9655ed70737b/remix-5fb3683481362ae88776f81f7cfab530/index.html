<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Starter Trail: Element Dex Rally</title><link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--sky:#78d8ff;--leaf:#7ee081;--ink:#18304b;--card:rgba(255,255,255,.86);--red:#ff6876;--gold:#ffd86d;--blue:#42c6ff;--green:#51d77a;--violet:#8b78ff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:linear-gradient(#76d8ff,#ffe9a8 58%,#7ee081);font-family:Rajdhani,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}#game{position:relative;width:100%;height:100%;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:3;inset:env(safe-area-inset-top) 0 auto 0;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.stack{display:flex;flex-direction:column;gap:8px}.badge{min-width:86px;padding:8px 10px;border:2px solid #fff;border-radius:18px;background:var(--card);box-shadow:0 7px 0 rgba(24,48,75,.13),0 10px 25px rgba(41,78,117,.18);font-weight:700;line-height:1}.badge b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#3477ac;margin-bottom:4px}.lives b{color:#d7405b}.team b{color:#299b5b}.brand{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-family:Bangers,cursive;font-size:clamp(25px,7vw,42px);letter-spacing:.04em;color:#fff;text-shadow:0 3px 0 #3173a8,0 6px 14px rgba(25,74,112,.25);white-space:nowrap;pointer-events:none}.hint{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:4;padding:10px 15px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.82);font-family:Bangers,cursive;font-size:clamp(18px,5vw,28px);color:#24517b;text-align:center;box-shadow:0 8px 22px rgba(31,79,118,.2);animation:pulse 1.25s infinite;pointer-events:none}.modal{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(24,48,75,.28);backdrop-filter:blur(5px)}.modal.show{display:flex}.card{width:min(92vw,420px);padding:22px;border:3px solid #fff;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(229,248,255,.96));text-align:center;box-shadow:0 20px 45px rgba(24,48,75,.25)}h1{font-family:Bangers,cursive;line-height:.95;margin:0 0 10px;font-size:clamp(38px,12vw,60px);color:#ff6876;text-shadow:0 3px 0 #fff,0 6px 0 rgba(24,48,75,.16)}p{margin:8px 0;font-weight:600}.final{margin:16px 0;font-family:Bangers,cursive;font-size:30px;color:#2279b5}.btn{width:100%;min-height:58px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffdd62,#ff9d42);color:#633512;font-family:Bangers,cursive;font-size:28px;box-shadow:0 8px 0 #c56e25,0 14px 22px rgba(99,53,18,.22);touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #c56e25}.toast{position:absolute;z-index:5;right:12px;bottom:12px;max-width:190px;padding:10px 12px;border-radius:18px;border:2px solid #fff;background:rgba(255,255,255,.9);font-weight:700;box-shadow:0 10px 24px rgba(24,48,75,.2);opacity:0;transform:translateY(18px);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}.dexbar{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);width:min(86vw,360px);height:12px;border:2px solid #fff;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(23,48,74,.14);overflow:hidden;pointer-events:none}.dexfill{height:100%;width:0;background:linear-gradient(90deg,#ff7043,#ffd74b,#41d873,#42c6ff);transition:width .2s}.dexlabel{position:absolute;z-index:3;left:50%;bottom:32px;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#24517b;text-shadow:0 1px 0 #fff;pointer-events:none}.brand small{display:block;font-family:Rajdhani,sans-serif;font-weight:700;font-size:clamp(10px,2.8vw,13px);letter-spacing:.18em;color:#24517b;text-shadow:0 1px 0 #fff;background:rgba(255,255,255,.72);border:2px solid #fff;border-radius:999px;padding:2px 10px;margin-top:5px}@media(max-width:430px){.hud{padding:9px}.badge{min-width:76px;padding:7px 8px}.brand{top:52px;font-size:clamp(24px,7vw,36px)}.hint{bottom:76px;font-size:18px}.toast{font-size:14px;max-width:160px}.dexbar{bottom:14px}.dexlabel{bottom:28px}}
</style></head><body><div id="game"><canvas id="c"></canvas><div class="brand">Starter Trail<small>Element Dex Rally</small></div><div id="hud" class="hud"><div class="stack"><div class="badge"><b>Bond XP</b>⚡ <span id="score">0</span></div><div class="badge team"><b>Squad</b>🌟 <span id="team">0</span></div></div><div class="badge lives"><b>Resolve</b>❤️ <span id="lives">3</span></div></div><div id="hint" class="hint">Drag your rookie trainer through the route!</div><div id="over" class="modal"><div class="card"><h1>Rival Takes the Route!</h1><p>Your starter is safe, but the route got too wild. Rally the team and try the trail again.</p><div class="final">Bond XP: <span id="final">0</span></div><button id="restart" class="btn">Restart Journey</button></div></div><div id="toast" class="toast">New companion joined!</div><div class="dexlabel">Starter evolution charge</div><div class="dexbar"><div id="dexfill" class="dexfill"></div></div></div>
<audio id="bgm" src="https://gamezone-virid.vercel.app/assets/audios/bgm/forest_bgm_01.mp3" loop preload="auto"></audio><audio id="ok" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_item_01.mp3" preload="auto"></audio><audio id="bad" src="https://gamezone-virid.vercel.app/assets/audios/sfx/forest_enemy_01.mp3" preload="auto"></audio>
<script>
'use strict';
const config={heroSpeed:.15,spawnRate:45,baseSpeed:300};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);const els={score:$('score'),team:$('team'),lives:$('lives'),over:$('over'),final:$('final'),hint:$('hint'),toast:$('toast'),restart:$('restart'),bgm:$('bgm'),ok:$('ok'),bad:$('bad'),dexfill:$('dexfill')};
let cw=0,ch=0,dpr=devicePixelRatio||1,last=0,state='PLAYING',frame=0,score=0,lives=3,bgIndex=0,difficulty=1,flash=0,shake=0,hintTimer=0,toastTimer=0,audio=false;
let hero={x:0,y:0,r:30,targetX:0,evo:0};let items=[],team=[],particles=[];
const kinds={mote:[['Ember Mote','#ff7043','fire'],['Sprout Mote','#41d873','leaf'],['Tide Mote','#32c6ff','water'],['Spark Mote','#ffd74b','bolt']],creature:[['Flameling','#ff784e','fire'],['Leafkit','#59d577','leaf'],['Bubblit','#56caff','water'],['Voltick','#ffe15a','bolt']],trap:[['Rival Net','#ff5570','net'],['Mud Snare','#9b7653','mud'],['Static Thorn','#995cff','thorn']],scan:[['Dex Star','#fff4a0','star']]};
function resize(){const b=canvas.getBoundingClientRect();cw=b.width;ch=b.height;canvas.width=cw*dpr;canvas.height=ch*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!hero.x)hero.x=cw/2;hero.x=Math.max(hero.r,Math.min(cw-hero.r,hero.x));hero.targetX=hero.x;hero.y=ch-115}
function reset(){score=0;lives=3;items=[];team=[];particles=[];frame=0;bgIndex=0;difficulty=1;flash=0;shake=0;hero.x=cw/2;hero.targetX=cw/2;hero.evo=0;setState('PLAYING');hud();}
function setState(s){state=s;if(s==='PLAYING'){els.over.classList.remove('show');els.hint.style.display='block';clearTimeout(hintTimer);hintTimer=setTimeout(()=>els.hint.style.display='none',3200)}else{els.final.textContent=score;els.over.classList.add('show');play('bad');}}
function unlock(){if(audio)return;audio=true;els.bgm.volume=.16;els.bgm.play().catch(()=>{})}
function play(t){const a=t==='bad'?els.bad:els.ok;try{a.currentTime=0;a.volume=t==='bad'?.5:.42;a.play().catch(()=>tone(t==='bad'?150:760,t==='bad'?'sawtooth':'triangle',.12))}catch(e){tone(t==='bad'?150:760,'sine',.1)}}
function tone(f,type,d){try{const ac=window._ac||(window._ac=new (AudioContext||webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=.07;g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function input(e){unlock();if(state!=='PLAYING')return;const r=canvas.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;hero.targetX=Math.max(hero.r,Math.min(cw-hero.r,x));}
canvas.addEventListener('pointerdown',input,{passive:true});canvas.addEventListener('pointermove',e=>{if(e.buttons>0)input(e)},{passive:true});canvas.addEventListener('touchstart',input,{passive:true});canvas.addEventListener('touchmove',input,{passive:true});els.restart.addEventListener('click',e=>{e.stopPropagation();unlock();reset();els.bgm.currentTime=0;els.bgm.play().catch(()=>{})});
function spawn(){let r=Math.random(),type='mote',set=kinds.mote,size=24;if(r<.05){type='scan';set=kinds.scan;size=28}else if(r<.15){type='creature';set=kinds.creature;size=27}else if(r<.35){type='trap';set=kinds.trap;size=26}let pick=set[Math.floor(Math.random()*set.length)];items.push({x:Math.random()*(cw-60)+30,y:-50,r:size,type,name:pick[0],color:pick[1],icon:pick[2],speed:config.baseSpeed*(.8+Math.random()*.4),angle:0,spin:(Math.random()-.5)*2})}
function collide(it){if(it.type==='mote'){score+=100;play('ok');burst(it.x,it.y,it.color,8,'+100')}else if(it.type==='creature'){score+=500;team.push({x:hero.x,y:ch+80,name:it.name,color:it.color,icon:it.icon});play('ok');toast(it.name+' joined the squad!');burst(it.x,it.y,it.color,14,'JOIN!')}else if(it.type==='scan'){score+=1000;flash=1;play('ok');toast('Dex scan complete!');burst(cw/2,ch/2,'#fff4a0',24,'DEX +1000')}else{lives--;shake=18;play('bad');burst(it.x,it.y,'#ff5570',12,'RIVAL HIT');if(lives<=0)setState('GAMEOVER')}if(score>2000)bgIndex=1;if(score>5000)bgIndex=2;if(score>8000)bgIndex=3;hero.evo=Math.min(3,Math.floor(score/2500));hud()}
function hud(){els.score.textContent=score;els.team.textContent=team.length;els.lives.textContent=lives;els.dexfill.style.width=(Math.min(100,(score%2500)/25)||0)+'%'}
function toast(t){els.toast.textContent=t;els.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1500)}
function burst(x,y,color,n,text){if(text)particles.push({x,y,vx:0,vy:-105,life:.8,text,color});for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*280,vy:(Math.random()-1)*260,life:.8,color})}
function update(dt){frame++;difficulty=1+score/5000;hero.x+=(hero.targetX-hero.x)*(config.heroSpeed*60*dt);if(!isFinite(hero.x))hero.x=cw/2;let px=hero.x,py=hero.y;team.forEach(p=>{let a=Math.atan2(py-p.y,px-p.x),tx=px-Math.cos(a)*36,ty=py-Math.sin(a)*36;p.x+=(tx-p.x)*5*dt;p.y+=(ty-p.y)*5*dt;px=p.x;py=p.y});let rate=Math.max(12,Math.floor(config.spawnRate/difficulty));if(frame%rate===0)spawn();for(let i=items.length-1;i>=0;i--){let it=items[i];it.y+=it.speed*difficulty*dt;it.angle+=it.spin*dt;let dx=hero.x-it.x,dy=hero.y-30-it.y;if(Math.hypot(dx,dy)<hero.r+it.r){collide(it);items.splice(i,1)}else if(it.y>ch+50)items.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy=(p.vy||0)+500*dt;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-10*dt);flash=Math.max(0,flash-2*dt)}
function bg(){let tops=['#74d8ff','#ffc07d','#9adfff','#c9a5ff'],bots=['#82df86','#56d2a4','#5fa7ff','#ff89bb'];let g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,tops[bgIndex]);g.addColorStop(.50,'#fff0b4');g.addColorStop(1,bots[bgIndex]);ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);let t=Date.now()/1200;ctx.globalAlpha=.22;for(let i=-1;i<8;i++){let y=(i*115+(t*35)%115);ctx.fillStyle=i%2?'#ffffff':'#3db56d';ctx.beginPath();ctx.ellipse((i*97+t*40)%cw,y,70,22,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,232,137,.68)';ctx.beginPath();ctx.moveTo(cw*.5-54,0);ctx.lineTo(cw*.5+54,0);ctx.lineTo(cw*.69,ch);ctx.lineTo(cw*.31,ch);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.setLineDash([20,18]);ctx.beginPath();ctx.moveTo(cw*.5,24);ctx.bezierCurveTo(cw*.45,ch*.3,cw*.58,ch*.58,cw*.5,ch+30);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(255,255,255,.42)';for(let x=30;x<cw;x+=78){let y=96+Math.sin(t+x)*20;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.strokeStyle='rgba(42,125,96,.34)';for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(x+k*6,y+34);ctx.quadraticCurveTo(x+k*8,y+10,x+Math.sin(t+x+k)*18,y-14);ctx.stroke()}}}
function iconMark(icon,r){ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();if(icon==='fire'){ctx.moveTo(0,-r*.48);ctx.bezierCurveTo(r*.34,-r*.05,r*.22,r*.45,0,r*.48);ctx.bezierCurveTo(-r*.34,r*.2,-r*.22,-r*.08,0,-r*.48)}else if(icon==='leaf'){ctx.ellipse(0,0,r*.22,r*.5,.55,0,7)}else if(icon==='water'){ctx.moveTo(0,-r*.5);ctx.bezierCurveTo(r*.34,-r*.06,r*.3,r*.42,0,r*.5);ctx.bezierCurveTo(-r*.3,r*.22,-r*.32,-r*.08,0,-r*.5)}else if(icon==='bolt'){ctx.moveTo(-2,-r*.5);ctx.lineTo(r*.24,-4);ctx.lineTo(2,-2);ctx.lineTo(r*.08,r*.5);ctx.lineTo(-r*.24,2);ctx.lineTo(-2,0)}else{for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.22:r*.5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}}ctx.closePath();ctx.fill()}
function creature(x,y,r,color,name,icon='leaf'){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(0,0,r+8,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,1,r*.96,r,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(-r*.52,-r*.42,r*.22,0,7);ctx.arc(r*.52,-r*.42,r*.22,0,7);ctx.fill();iconMark(icon,r);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*.32,-r*.12,r*.16,0,7);ctx.arc(r*.32,-r*.12,r*.16,0,7);ctx.fill();ctx.fillStyle='#17304a';ctx.beginPath();ctx.arc(-r*.32,-r*.12,r*.07,0,7);ctx.arc(r*.32,-r*.12,r*.07,0,7);ctx.fill();ctx.strokeStyle='#17304a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.14,r*.32,.15,Math.PI-.15);ctx.stroke();if(name){ctx.font='700 10px Rajdhani';ctx.fillStyle='#17304a';ctx.textAlign='center';ctx.fillText(name,0,r+16)}ctx.restore()}
function item(it){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.angle);if(it.type==='trap'){ctx.strokeStyle=it.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(18,18);ctx.moveTo(18,-18);ctx.lineTo(-18,18);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle=it.color;ctx.font='bold 15px Rajdhani';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('R',0,1)}else if(it.type==='scan'){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.rect(-18,-18,36,36);ctx.stroke();ctx.fillStyle=it.color;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill()}else creature(0,0,it.r,it.color,it.type==='creature'?it.name:'',it.icon);ctx.restore()}
function heroDraw(){ctx.save();ctx.translate(hero.x,hero.y+Math.sin(Date.now()/150)*4);let aura=['rgba(255,112,67,.22)','rgba(65,216,115,.22)','rgba(50,198,255,.24)','rgba(255,215,75,.28)'][hero.evo];ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,-18,45+hero.evo*4,0,7);ctx.fill();creature(0,-58,18+hero.evo*2,['#ff7043','#51d77a','#42c6ff','#ffd86d'][hero.evo],'',['fire','leaf','water','bolt'][hero.evo]);ctx.fillStyle='#24517b';ctx.beginPath();ctx.roundRect(-16,-4,32,34,12);ctx.fill();ctx.fillStyle='#ffcf9d';ctx.beginPath();ctx.arc(0,-30,17,0,7);ctx.fill();ctx.fillStyle=['#ff6876','#51d77a','#42c6ff','#ffd86d'][hero.evo];ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(-29,31);ctx.lineTo(29,31);ctx.closePath();ctx.fill();ctx.fillStyle='#17304a';ctx.beginPath();ctx.arc(-6,-31,2.2,0,7);ctx.arc(6,-31,2.2,0,7);ctx.fill();ctx.strokeStyle='#17304a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-25,6,.1,Math.PI-.1);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-18,37,-.5,.9);ctx.stroke();ctx.restore()}
function draw(){bg();ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);team.forEach(p=>creature(p.x,p.y,18,p.color,'',p.icon));heroDraw();items.forEach(item);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);if(p.text){ctx.font='24px Bangers';ctx.fillStyle=p.color;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y)}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}ctx.globalAlpha=1});ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,cw,ch)}}
function loop(ts){let dt=Math.min((ts-last)/1000,.05)||0;last=ts;if(state==='PLAYING')update(dt);draw();requestAnimationFrame(loop)}
window.__dexDashTest={snapshot:()=>({state,score,lives,team:team.length,items:items.length,heroX:hero.x,targetX:hero.targetX,bgIndex,evo:hero.evo,gameOver:els.over.classList.contains('show')}),force:(type)=>{if(state!=='PLAYING')setState('PLAYING');collide({type,x:hero.x,y:hero.y-30,r:24,color:type==='trap'?'#ff5570':type==='scan'?'#fff4a0':'#41d873',name:type==='creature'?'Leafkit':type});return window.__dexDashTest.snapshot();},spawn:()=>{spawn();return window.__dexDashTest.snapshot();}};
addEventListener('resize',resize);resize();hud();requestAnimationFrame(loop);
</script></body></html>
