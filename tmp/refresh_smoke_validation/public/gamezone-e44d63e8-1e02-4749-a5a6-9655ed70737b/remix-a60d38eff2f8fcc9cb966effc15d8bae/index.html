            </div>

        <!-- GAME OVER -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm pointer-events-auto">

<script>
// §0 PRELUDE & CONSTANTS
const CONFIG = {
    colors: {
        bg: [
            ['#120f25', '#2f1850'],
            ['#10243a', '#173d65'],
            ['#14322f', '#1d534b'],
            ['#382025', '#61323b']
        ],
        star: ['#79f0ff', '#ff5ebc', '#ffd36e'],
        hero: '#FF69B4',
        text: '#f8f2ff'
    },
    emojis: {
        food: ['🍔', '🍟', '🍦', '🍩', '🥤', '🍰', '🍪', '🍱'],
        pets: ['🐶', '🐱', '🐰', '🐼', '🦊', '🐨'],
        traps: ['❄️', '🔥', '🚧', '💣', '🌵'],
        camera: '📸'
    }
};

let canvas, ctx;
let cw, ch;
let dpr = window.devicePixelRatio || 1;
let lastTime = 0;
let gameState = 'BOOT'; // BOOT, PLAYING, GAMEOVER
let gameConfig = {}; // Populated from DOM

// §1 AUDIO SYSTEM
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
    bgm: document.getElementById('bgm_main'),
    collect: document.getElementById('sfx_collect'),
    fail: document.getElementById('sfx_fail'),
    bonus: document.getElementById('sfx_bonus'),
    ui: document.getElementById('sfx_ui')
};
const gifEls = {
    pet: document.getElementById('pet-reaction'),
    fail: document.getElementById('fail-reaction')
};
let audioUnlocked = false;
let activeGifTimer = 0;
const soundCooldowns = {
    collect: 0,
    fail: 0,
    bonus: 0,
    ui: 0
};

function unlockAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (!audioUnlocked) {
        sounds.bgm.volume = 0.2;
        sounds.bgm.play().then(() => {
            audioUnlocked = true;
        }).catch(() => {});
    }
}

function replayAudio(el, volume) {
    if (!el) return false;
    try {
        if (volume != null) el.volume = volume;
        if (el.readyState >= 2) {
            el.pause();
            el.currentTime = 0;
            el.play().catch(() => {});
            return true;
        }
    } catch (_) {}
    return false;
}

function playSound(type) {
    const now = performance.now();
    if (soundCooldowns[type] && now - soundCooldowns[type] < 120) return;
    soundCooldowns[type] = now;

    if (type === 'collect') {
        if (!replayAudio(sounds.collect, 0.45)) synthTone(800, 'sine', 0.1);
    } else if (type === 'fail') {
        if (!replayAudio(sounds.fail, 0.5)) synthTone(150, 'sawtooth', 0.3);
    } else if (type === 'bonus') {
        if (!replayAudio(sounds.bonus, 0.5)) synthTone(980, 'triangle', 0.18);
    } else if (type === 'ui') {
        if (!replayAudio(sounds.ui, 0.38)) synthTone(620, 'square', 0.06);
    } else if (type === 'camera') {
        synthTone(1200, 'square', 0.05); // Shutter sound
    }
}

function showReaction(type) {
    Object.values(gifEls).forEach((el) => el?.classList.remove('visible'));
    if (activeGifTimer) clearTimeout(activeGifTimer);
    const target = gifEls[type];
    if (!target) return;
    target.classList.add('visible');
    activeGifTimer = setTimeout(() => target.classList.remove('visible'), 1400);
}

function synthTone(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function vibrate(style) {
    if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(style === 'heavy' ? 200 : 50);
    }
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: style }
    });
}

// §2 GAME STATE
let hero = { x: 0, y: 0, r: 30, targetX: 0, outfit: 0 };
let items = [];
let particles = [];
let pets = [];
let score = 0;
let lives = 3;
let frameCount = 0;
let difficultyMultiplier = 1;
let flashOpacity = 0;
let shakeAmount = 0;
let bgIndex = 0;

// §3 LIFECYCLE
document.addEventListener('DOMContentLoaded', () => {
    // Parse Config
    try {
        const rawConfig = JSON.parse(document.getElementById('game-config').textContent);
        for (let k in rawConfig) gameConfig[k] = rawConfig[k].value;
    } catch(e) {
        console.error("Config Parse Error", e);
        gameConfig = { heroSpeed: 0.15, spawnRate: 45, baseSpeed: 300 };
    }

    // Setup
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    // Resize & Init
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    setupInput();
    
    // Start
    initGame();
    setState('PLAYING');
    
    // Loop
    requestAnimationFrame(loop);
});

function resize() {
    const box = canvas.getBoundingClientRect();
    cw = box.width;
    ch = box.height;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // Re-clamp hero if OOB
    if (hero.x === 0) hero.x = cw / 2;
    hero.x = Math.max(hero.r, Math.min(cw - hero.r, hero.x));
    hero.y = ch - 120; // Fixed Y position
    hero.targetX = hero.x;
}

function initGame() {
    score = 0;
    lives = 3;
    items = [];
    particles = [];
    pets = [];
    difficultyMultiplier = 1;
    flashOpacity = 0;
    shakeAmount = 0;
    bgIndex = 0;
    
    hero.x = cw / 2;
    hero.targetX = cw / 2;
    hero.outfit = 0;
    
    updateHUD();
}

function setState(s) {
    gameState = s;
    const hud = document.getElementById('hud');
    const gameOver = document.getElementById('game-over-screen');
    const tutorial = document.getElementById('tutorial');
    
    if (s === 'PLAYING') {
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        tutorial.classList.remove('hidden');
        setTimeout(() => tutorial.classList.add('hidden'), 3000);
        gifEls.pet?.classList.remove('visible');
        gifEls.fail?.classList.remove('visible');
    } else if (s === 'GAMEOVER') {
        hud.classList.add('hidden');
        gameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        playSound('ui');
        showReaction('fail');
        sounds.bgm.pause();
    }
}

function restartGame() {
    playSound('ui');
    initGame();
    setState('PLAYING');
    if (audioUnlocked) {
        sounds.bgm.currentTime = 0;
        sounds.bgm.play().catch(() => {});
    }
}

// §4 INPUT
function setupInput() {
    const handler = (e) => {
        unlockAudio();
        if (gameState === 'GAMEOVER') {
            // Only restart if clicking the button, but button has its own listener.
            // Global click outside button shouldn't restart immediately to prevent accidental restarts
            return; 
        }
        
        if (gameState === 'PLAYING') {
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            hero.targetX = Math.max(hero.r, Math.min(cw - hero.r, cx));
        }
    };

    window.addEventListener('pointerdown', handler, { passive: false });
    window.addEventListener('pointermove', (e) => {
        if (gameState === 'PLAYING' && e.buttons > 0) handler(e);
    }, { passive: false });
    
    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        unlockAudio();
        restartGame();
    });
}

// §5 GAME LOGIC
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap dt
    lastTime = timestamp;

    if (gameState === 'PLAYING') {
        update(dt);
    }
    draw();
    requestAnimationFrame(loop);
}

function update(dt) {
    frameCount++;
    
    // Difficulty Ramp
    difficultyMultiplier = 1 + (score / 5000);
    
    // Hero Move (Lerp)
    const moveSpeed = gameConfig.heroSpeed * 60 * dt; // Normalize
    hero.x += (hero.targetX - hero.x) * moveSpeed;
    
    // Safety Check
    if (!isFinite(hero.x)) hero.x = cw / 2;
    
    // Pet Follow Logic
    let prevX = hero.x;
    let prevY = hero.y;
    pets.forEach((p, i) => {
        const dist = 35;
        const dx = prevX - p.x;
        const dy = prevY - p.y;
        const angle = Math.atan2(dy, dx);
        const tx = prevX - Math.cos(angle) * dist;
        const ty = prevY - Math.sin(angle) * dist;
        
        p.x += (tx - p.x) * 5 * dt;
        p.y += (ty - p.y) * 5 * dt;
        
        prevX = p.x;
        prevY = p.y;
    });

    // Spawner
    if (frameCount % Math.floor(gameConfig.spawnRate / difficultyMultiplier) === 0) {
        spawnItem();
    }
    
    // Update Items
    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed * difficultyMultiplier * dt;
        it.angle += it.spin * dt;
        
        // Collision
        const dx = hero.x - it.x;
        const dy = hero.y - 30 - it.y; // Adjust hitbox slightly up
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < hero.r + it.r) {
            resolveCollision(it);
            items.splice(i, 1);
            continue;
        }
        
        // OOB
        if (it.y > ch + 50) {
            items.splice(i, 1);
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 500 * dt; // Gravity
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Effects
    if (shakeAmount > 0) shakeAmount = Math.max(0, shakeAmount - 10 * dt);
    if (flashOpacity > 0) flashOpacity = Math.max(0, flashOpacity - 2 * dt);
}

function spawnItem() {
    const r = Math.random();
    let type = 'food';
    let content = CONFIG.emojis.food[Math.floor(Math.random() * CONFIG.emojis.food.length)];
    let size = 25;
    
    if (r < 0.05) { // 5% Camera
        type = 'camera';
        content = CONFIG.emojis.camera;
    } else if (r < 0.15) { // 10% Pet
        type = 'pet';
        content = CONFIG.emojis.pets[Math.floor(Math.random() * CONFIG.emojis.pets.length)];
    } else if (r < 0.35) { // 20% Trap
        type = 'trap';
        content = CONFIG.emojis.traps[Math.floor(Math.random() * CONFIG.emojis.traps.length)];
    }
    
    items.push({
        x: Math.random() * (cw - 60) + 30,
        y: -50,
        r: size,
        type: type,
        content: content,
        speed: gameConfig.baseSpeed * (0.8 + Math.random() * 0.4),
        angle: 0,
        spin: (Math.random() - 0.5) * 2
    });
}

function resolveCollision(it) {
    if (it.type === 'food') {
        score += 100;
        playSound('collect');
        vibrate('light');
        spawnParticles(it.x, it.y, it.content, 3);
        spawnFloatingText(it.x, it.y, "+100 SNACKS");
    } else if (it.type === 'pet') {
        score += 500;
        pets.push({ x: hero.x, y: ch + 100, content: it.content }); // Spawn offscreen, will lerp
        playSound('collect');
        playSound('bonus');
        showReaction('pet');
        spawnParticles(it.x, it.y, '❤️', 5);
        spawnFloatingText(it.x, it.y, "NEW STRAY!");
    } else if (it.type === 'camera') {
        score += 1000;
        flashOpacity = 1.0;
        playSound('camera');
        playSound('bonus');
        vibrate('medium');
        spawnFloatingText(cw/2, ch/2, "BONUS DROP!", 40);
    } else if (it.type === 'trap') {
        lives--;
        shakeAmount = 20;
        playSound('fail');
        showReaction('fail');
        vibrate('heavy');
        spawnParticles(it.x, it.y, '💔', 5);
        if (lives <= 0) {
            setState('GAMEOVER');
        }
    }
    
    // Progression
    if (score > 2000) bgIndex = 1;
    if (score > 5000) bgIndex = 2;
    if (score > 8000) bgIndex = 3;
    
    // Outfit Evolution
    hero.outfit = Math.min(3, Math.floor(score / 2500));
    
    updateHUD();
}

function spawnParticles(x, y, char, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 1) * 300,
            life: 1.0,
            char: char,
            scale: 0.5 + Math.random() * 0.5
        });
    }
}

function spawnFloatingText(x, y, text, size=20) {
    particles.push({
        x: x, y: y,
        vx: 0, vy: -100,
        life: 0.8,
        text: text,
        size: size,
        isText: true
    });
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('pets-display').innerText = pets.length;
    document.getElementById('lives-display').innerText = lives;
}

// §6 RENDER
function draw() {
    // Clear & BG
    const bgColor = CONFIG.colors.bg[bgIndex % CONFIG.colors.bg.length];
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, bgColor[0]);
    sky.addColorStop(1, bgColor[1]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);
    
    // Shake
    ctx.save();
    if (shakeAmount > 0) {
        ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
    }
    
    // Background Pattern (Parallax-ish)
    ctx.globalAlpha = 0.16;
    const offset = (Date.now() / 50) % 100;
    for (let x = 0; x < cw; x += 100) {
        for (let y = -100; y < ch; y += 100) {
            ctx.beginPath();
            ctx.fillStyle = CONFIG.colors.star[(x / 100 + y / 100 + bgIndex) % CONFIG.colors.star.length];
            if (bgIndex === 0) ctx.arc(x + 50, y + offset, 20, 0, Math.PI*2);
            else if (bgIndex === 1) ctx.fillRect(x + 25, y + offset, 50, 50);
            else {
                ctx.moveTo(x, y + offset);
                ctx.lineTo(x + 50, y + offset + 50);
                ctx.strokeStyle = ctx.fillStyle;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1.0;
    
    // Draw Pets (Behind Hero)
    pets.forEach(p => {
        ctx.font = "30px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.content, p.x, p.y);
    });
    
    // Draw Hero
    drawHero(hero.x, hero.y);
    
    // Draw Items
    items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.angle);
        ctx.font = "40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(it.content, 0, 0);
        ctx.restore();
    });
    
    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.isText) {
            ctx.font = `700 ${p.size}px 'Russo One'`;
            ctx.fillStyle = '#ff7dd0';
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.font = `${30 * p.scale}px sans-serif`;
            ctx.fillText(p.char, p.x, p.y);
        }
        ctx.globalAlpha = 1.0;
    });
    
    ctx.restore();
    
    // Flash Effect
    if (flashOpacity > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
        ctx.fillRect(0, 0, cw, ch);
    }
}

function drawHero(x, y) {
    ctx.save();
    ctx.translate(x, y);
    
    const bob = Math.sin(Date.now() / 150) * 5;
    ctx.translate(0, bob);

    const dressColors = ['#ff5ebc', '#9d7bff', '#ffd36e', '#69ecff'];
    const auraColors = ['rgba(255,94,188,0.25)', 'rgba(157,123,255,0.25)', 'rgba(255,211,110,0.25)', 'rgba(105,236,255,0.25)'];
    const dressColor = dressColors[hero.outfit];

    ctx.beginPath();
    ctx.fillStyle = auraColors[hero.outfit];
    ctx.arc(0, -5, 34, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#241045';
    ctx.beginPath();
    ctx.roundRect(-20, -8, 40, 34, 14);
    ctx.fill();

    ctx.fillStyle = dressColor;
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-28, 28);
    ctx.lineTo(28, 28);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffe0bd';
    ctx.beginPath();
    ctx.arc(0, -37, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5f2d91';
    ctx.beginPath();
    ctx.arc(0, -40, 22, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-18, -40, 36, 8);

    ctx.strokeStyle = '#3a1846';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-15, -4);
    ctx.lineTo(-24, 12);
    ctx.moveTo(15, -4);
    ctx.lineTo(24, 12);
    ctx.moveTo(-10, 26);
    ctx.lineTo(-10, 38);
    ctx.moveTo(10, 26);
    ctx.lineTo(10, 38);
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-7, -36, 2.2, 0, Math.PI * 2);
    ctx.arc(7, -36, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#8b335b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -30, 6, 0.15, Math.PI - 0.15);
    ctx.stroke();

    ctx.fillStyle = '#79f0ff';
    ctx.beginPath();
    ctx.arc(-14, -8, 4, 0, Math.PI * 2);
    ctx.arc(14, -8, 4, 0, Math.PI * 2);
    ctx.fill();

    if (hero.outfit >= 1) {
        ctx.fillStyle = '#1e1e2c';
        ctx.fillRect(-13, -39, 26, 7);
        ctx.strokeStyle = '#79f0ff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-13, -39, 26, 7);
    }
    if (hero.outfit >= 2) {
        ctx.fillStyle = '#ffd36e';
        ctx.beginPath();
        ctx.moveTo(-15, -52);
        ctx.lineTo(-8, -41);
        ctx.lineTo(0, -56);
        ctx.lineTo(8, -41);
        ctx.lineTo(15, -52);
        ctx.lineTo(15, -42);
        ctx.lineTo(-15, -42);
        ctx.closePath();
        ctx.fill();
    }
    if (hero.outfit >= 3) {
        ctx.strokeStyle = '#79f0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -5, 31, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
    }
    
    ctx.restore();
}
