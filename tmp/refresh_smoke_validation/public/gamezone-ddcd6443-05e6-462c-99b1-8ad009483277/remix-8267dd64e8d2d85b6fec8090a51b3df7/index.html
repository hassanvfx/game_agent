<style>

        radial-gradient(circle at top, rgba(255, 214, 92, 0.18), transparent 32%),

        font-family: var(--ui-font); }
    body { color: var(--text-main); position: relative; font-family: var(--ui-font); touch-action: manipulation; }

    .hidden { display: none !important; }

    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .bottom-8 { bottom: 2rem; }

    .overflow-hidden { overflow: hidden; }

    .overflow-y-auto { overflow-y: auto; }

    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-8 { margin-bottom: 2rem; }
    .ml-1 { margin-left: 0.25rem; }
    .mt-4 { margin-top: 1rem; }
    .p-1 { padding: 0.25rem; }
    .p-2 { padding: 0.5rem; }
    .p-4 { padding: 1rem; }
    .pb-2 { padding-bottom: 0.5rem; }
    .pb-6 { padding-bottom: 1.5rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .px-12 { padding-left: 3rem; padding-right: 3rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    .rounded { border-radius: 0.25rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-xl { border-radius: 0.75rem; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-lg { font-size: 0.95rem; }
    .text-xl { font-size: 1.1rem; }
    .text-2xl { font-size: 1.35rem; }
    .text-3xl { font-size: 1.6rem; }
    .text-6xl { font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.15; }
    .font-ui { font-family: var(--ui-font); }
    .font-display { font-family: var(--display-font); }
    .font-bold { font-weight: 700; }
    .tracking-tighter { letter-spacing: -0.08em; }
    .tracking-widest { letter-spacing: 0.12em; }
    .text-center { text-align: center; }
    .text-black { color: #000; }
    .text-white { color: #fff; }
    .text-white\/50 { color: rgba(255,255,255,0.5); }
    .text-white\/80 { color: rgba(255,255,255,0.8); }
    .text-gray-200 { color: #e5e7eb; }
    .text-gray-400 { color: #9ca3af; }
    .text-green-500 { color: #22c55e; }
    .text-yellow-200 { color: #fef08a; }
    .text-yellow-300 { color: #fde047; }
    .text-red-300 { color: #fca5a5; }
    .bg-black\/30 { background: rgba(0,0,0,0.3); }
    .bg-black\/90 { background: rgba(0,0,0,0.9); }
    .bg-red-900\/90 { background: rgba(127,29,29,0.9); }
    .bg-blue-900\/80 { background: rgba(30,58,138,0.8); }
    .bg-green-900\/80 { background: rgba(20,83,45,0.8); }
    .bg-green-900\/40 { background: rgba(20,83,45,0.4); }
    .bg-green-600 { background: #16a34a; }
    .bg-gray-600 { background: #4b5563; }
    .bg-white { background: #fff; }
    .bg-\[\#222\]\/90 { background: rgba(34,34,34,0.9); }
    .bg-\[\#7CFC00\] { background: #7CFC00; }
    .border-2 { border: 2px solid currentColor; }
    .border-b-0 { border-bottom-width: 0; }
    .border-b-2 { border-bottom: 2px solid currentColor; }
    .border-b-8 { border-bottom: 8px solid currentColor; }
    .border-\[\#555\] { border-color: #555; }
    .border-\[\#228B22\] { border-color: #228B22; }
    .border-gray-600 { border-color: #4b5563; }
    .drop-shadow-md, .drop-shadow-lg, .shadow-xl, .shadow-2xl, .shadow-lg { box-shadow: 0 4px 0 rgba(0,0,0,0.45), 0 10px 24px rgba(0,0,0,0.35); }
    .transition-opacity { transition: opacity 1s; }
    .transition-transform { transition: transform 0.1s; }
    .duration-1000 { transition-duration: 1s; }
    .active\:scale-95:active { transform: scale(0.95); }
    .active\:translate-y-2:active { transform: translateY(0.5rem); }
    .active\:border-b-0:active { border-bottom-width: 0; }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
    .safe-area-inset { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .opacity-20 { opacity: 0.2; }
    .opacity-50 { opacity: 0.5; }
    .grayscale { filter: grayscale(1); }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: .8; } }

    /* UI Elements */
    .glass {
        background: linear-gradient(180deg, rgba(17, 31, 47, 0.94), rgba(9, 18, 30, 0.88));
        border: 2px solid var(--panel-border);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 8px 20px rgba(0,0,0,0.45), 0 0 20px var(--panel-glow);
        backdrop-filter: blur(6px);
    }
    .btn { transition: transform 0.1s, filter 0.18s, box-shadow 0.18s; active: scale(0.95); user-select: none; }
    .btn:active { transform: scale(0.95); }
    #game-container::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 18% 22%, rgba(255,255,255,0.16), transparent 18%),
            radial-gradient(circle at 82% 14%, rgba(255,214,92,0.14), transparent 12%),
            linear-gradient(180deg, rgba(255,255,255,0.08), transparent 24%, transparent 76%, rgba(0,0,0,0.18));
        mix-blend-mode: screen;
        opacity: 0.8;
    }
    #game-container::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 100% 4px, 4px 100%;
        opacity: 0.22;
    }
    #hud { max-width: 100%; }
    #health-bar, #hotbar, #crafting-menu, #game-over-screen, #start-screen, #message-log, #day-indicator { position: relative; }
    #health-bar {
        border: 2px solid rgba(255,255,255,0.1);
        background: linear-gradient(180deg, rgba(9, 18, 30, 0.78), rgba(25, 12, 8, 0.66));
        box-shadow: var(--hud-shadow);
    }
    #day-indicator {
        display: inline-flex;
        width: fit-content;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        border: 2px solid rgba(255, 214, 92, 0.35);
        background: rgba(10, 15, 24, 0.52);
        color: var(--forge-gold);
        text-shadow: 0 0 10px rgba(255, 214, 92, 0.35);
        box-shadow: 0 8px 16px rgba(0,0,0,0.24);
    }
    #message-log {
        color: var(--text-dim);
        text-shadow: 0 2px 0 rgba(0,0,0,0.8);
        letter-spacing: 0.04em;
    }
    #start-screen {
        background:
            radial-gradient(circle at top, rgba(255, 214, 92, 0.14), transparent 26%),
            linear-gradient(180deg, rgba(3, 8, 16, 0.72), rgba(3, 8, 16, 0.12)),
            linear-gradient(180deg, #221406, #35200d 45%, #533b1d 100%);
    }
    #start-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 38%, rgba(255, 184, 77, 0.2), transparent 24%),
            linear-gradient(transparent 0%, rgba(255, 255, 255, 0.04) 50%, transparent 100%);
        pointer-events: none;
    }
    #start-screen h1, #crafting-menu h2, #game-over-screen h1 {
        font-family: var(--display-font);
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }
    #start-screen p {
        max-width: min(28rem, calc(100vw - 2rem));
        color: var(--text-dim);
        text-align: center;
        line-height: 1.5;
    }
    #start-btn, #respawn-btn, #close-craft, .recipe-row button, #craft-btn, #mode-btn {
        cursor: pointer;
    }
    #start-btn {
        background: linear-gradient(180deg, #ffe48d, var(--forge-gold));
        border-color: #cc7b29;
        box-shadow: 0 6px 0 #8a4c1a, 0 18px 30px rgba(0,0,0,0.35), 0 0 22px rgba(255, 214, 92, 0.32);
        font-family: var(--display-font);
        letter-spacing: 0.08em;
    }
    #craft-btn, #mode-btn, #close-craft, .recipe-row button, #respawn-btn {
        font-family: var(--display-font);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    #game-over-screen {
        background:
            radial-gradient(circle at top, rgba(255, 112, 67, 0.25), transparent 25%),
            linear-gradient(180deg, rgba(56, 8, 10, 0.9), rgba(18, 3, 5, 0.92));
    }
    #crafting-menu {
        background:
            linear-gradient(180deg, rgba(5, 10, 18, 0.92), rgba(7, 12, 18, 0.95)),
            rgba(0,0,0,0.92);
    }
    #recipe-list {
        background: rgba(255,255,255,0.03);
        border: 2px solid rgba(255,255,255,0.08);
        border-radius: 1rem;
        padding: 0.75rem;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* Slots & Items */
    .slot {
        position: relative;
        width: 3.5rem; height: 3.5rem;
        background: linear-gradient(180deg, rgba(12, 22, 36, 0.92), rgba(6, 12, 20, 0.88));
        border: 3px solid rgba(255, 214, 92, 0.25);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 6px 14px rgba(0,0,0,0.3);
        image-rendering: pixelated;
        display: flex; align-items: center; justify-content: center;
    }
    .slot-active { border: 3px solid var(--forge-gold); background: rgba(255,255,255,0.12); transform: translateY(-2px) scale(1.08); z-index: 10; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 16px rgba(255,214,92,0.35); }
    .slot-count { position: absolute; bottom: 2px; right: 4px; color: var(--text-main); font-size: 0.85rem; text-shadow: 1px 1px 0 #000; pointer-events: none; }

    /* Procedural Icons */
    .icon-wood { background: repeating-linear-gradient(90deg, #5D4037 0, #5D4037 4px, #4E342E 4px, #4E342E 8px); width: 60%; height: 80%; border: 1px solid #3E2723; }
    .icon-planks { background: repeating-linear-gradient(90deg, #8D6E63 0, #8D6E63 8px, #795548 8px, #795548 9px); width: 70%; height: 70%; border: 2px solid #5D4037; }
    .icon-stick { background: #8D6E63; width: 10%; height: 80%; transform: rotate(45deg); box-shadow: 1px 1px 0 #3E2723; }
    .icon-table {
        background:
            linear-gradient(#8D6E63 50%, transparent 50%) 0 0 / 100% 100%,
            linear-gradient(90deg, transparent 30%, #3E2723 30%, #3E2723 70%, transparent 70%);
        background-color: #5D4037;
        width: 80%; height: 80%; border: 2px solid #3E2723;
    }
    .icon-pickaxe {
        width: 80%; height: 80%; position: relative;
    }
    .icon-pickaxe::before { /* Handle */
        content: ''; position: absolute; left: 50%; top: 20%; width: 4px; height: 80%;
        background: #8D6E63; transform: translateX(-50%); box-shadow: 1px 1px 0 #000;
    }
    .icon-pickaxe::after { /* Head */
        content: ''; position: absolute; top: 0; left: 10%; width: 80%; height: 8px;
        background: #8D6E63; border-radius: 4px; box-shadow: 0 2px 0 #5D4037;
    }
    .icon-stone { background: #757575; width: 70%; height: 70%; border: 2px solid #424242; }
    .icon-dirt { background: #5D4037; width: 70%; height: 70%; border: 2px solid #3E2723; }
    .icon-grass { background: linear-gradient(#4CAF50 50%, #5D4037 50%); width: 70%; height: 70%; border: 2px solid #33691E; }

    /* Hearts */
    .heart { color: #ff6b5e; text-shadow: 0 0 10px rgba(255,107,94,0.45), 2px 2px 0 #000; font-size: 1.45rem; }

    /* Dirt Background */
    .dirt-bg {
        background-color: #2b1d0e;
        background-image:
            radial-gradient(circle, rgba(255, 214, 92, 0.08) 1px, transparent 1px),
            radial-gradient(circle, #3d2914 2px, transparent 2px);
        background-size: 32px 32px, 16px 16px;
    }

    .recipe-row {
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
        padding: 0.7rem; margin-bottom: 0.35rem; border-radius: 0.75rem;
        border: 1px solid rgba(255,255,255,0.08);
        gap: 0.75rem;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    .recipe-req { font-size: 0.8rem; color: rgba(247, 243, 222, 0.6); }
    #feedback-layer {
        position: absolute;
        top: 5.5rem;
        right: 0.75rem;
        z-index: 45;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.6rem;
        pointer-events: none;
        max-width: min(42vw, 10rem);
    }
    .feedback-badge {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.35rem 0.55rem;
        border-radius: 999px;
        border: 2px solid rgba(255,255,255,0.14);
        background: rgba(7, 13, 22, 0.84);
        box-shadow: 0 10px 20px rgba(0,0,0,0.28);
        opacity: 0;
        transform: translateY(-10px) scale(0.96);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .feedback-badge.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    .feedback-badge img {
        width: 2.6rem;
        height: 2.6rem;
        object-fit: cover;
        border-radius: 0.6rem;
        border: 2px solid rgba(255, 214, 92, 0.28);
        background: rgba(255,255,255,0.06);
        flex-shrink: 0;
    }
    .feedback-copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .feedback-label {
        font-family: var(--display-font);
        font-size: 0.74rem;
        color: var(--forge-gold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    .feedback-text {
        font-size: 0.88rem;
        color: var(--text-main);
        line-height: 1.1;
    }

    @media (max-width: 640px) {
        .text-3xl { font-size: 1.25rem; }
        .text-xl { font-size: 0.95rem; }
        .text-lg { font-size: 0.85rem; }
        .slot { width: 3rem; height: 3rem; }
        #start-screen { padding: 1rem; }
        #start-btn { width: min(16rem, calc(100vw - 2rem)); padding-left: 1rem; padding-right: 1rem; }
        #craft-btn, #mode-btn { padding-left: 0.65rem; padding-right: 0.65rem; }
        #day-indicator { font-size: 0.8rem; }
        .recipe-row { align-items: flex-start; }
        .recipe-row button { flex-shrink: 0; }
        #feedback-layer {
            top: auto;
            bottom: 8.25rem;
            right: 0.5rem;
            max-width: min(52vw, 9rem);
        }
        .feedback-badge {
            padding: 0.3rem 0.45rem;
            gap: 0.35rem;
        }
        .feedback-badge img {
            width: 2rem;
            height: 2rem;
        }
        .feedback-label { font-size: 0.62rem; }
        .feedback-text { font-size: 0.72rem; }
    }
</style>
</head>

<!-- UI Layer -->
<div id="game-container" class="relative w-full h-full select-none overflow-hidden">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="ui-layer" class="absolute inset-0 z-40 pointer-events-none flex flex-col justify-between p-2 safe-area-inset">
        <!-- Top Bar -->
        <div id="hud" class="hidden flex-col w-full gap-2 pointer-events-auto">

                <div id="health-bar" class="flex gap-1 bg-black/30 p-1 rounded"></div>

                    <button id="craft-btn" class="glass px-3 py-2 rounded text-yellow-300 text-lg font-bold tracking-widest active:scale-95 transition-transform">
                        FORGE
                    </button>
                    <button id="mode-btn" class="glass px-3 py-2 rounded text-white text-lg font-bold tracking-widest bg-blue-900/80 w-20">

            <div id="day-indicator" class="text-yellow-300 text-xl drop-shadow-md font-bold ml-1">Day 1</div>

        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center dirt-bg z-50 pointer-events-auto">
            <h1 class="text-6xl text-gray-200 mb-2 font-bold tracking-tighter" style="text-shadow: 4px 4px 0 #000;">BLOCKFORGE<br><span class="text-green-500">SURVIVAL</span></h1>
            <p class="text-gray-400 text-xl mb-8">🛡️ Gear up, harvest the frontier, and outlast the emberwild.</p>
            <button id="start-btn" class="bg-[#7CFC00] border-b-8 border-[#228B22] text-black font-bold text-3xl py-4 px-12 rounded shadow-xl active:border-b-0 active:translate-y-2">
                PLAY
            </button>
        </div>

        <!-- Crafting Menu -->
        <div id="crafting-menu" class="hidden absolute inset-0 bg-black/90 z-50 pointer-events-auto flex flex-col p-4 items-center justify-center">
            <h2 class="text-3xl text-white mb-4 border-b-2 border-gray-600 w-full text-center pb-2">FIELD WORKBENCH</h2>
            <div id="recipe-list" class="w-full max-w-md overflow-y-auto max-h-[70vh] flex flex-col gap-2">
                <!-- Recipes injected via JS -->
            </div>
            <button id="close-craft" class="mt-4 glass px-8 py-3 text-red-300 font-bold text-xl rounded">CLOSE</button>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 z-50 pointer-events-auto">
            <h1 class="text-6xl text-white mb-4 font-bold drop-shadow-lg">EXPEDITION LOST</h1>
            <button id="respawn-btn" class="bg-white text-black text-2xl py-3 px-8 rounded font-bold shadow-lg active:scale-95">REDEPLOY</button>
        </div>

        <!-- [agent-note][stage3] resolved-gif: gather/craft/fail overlays -> catalogs/gifs.json -->
        <div id="feedback-layer" aria-live="polite">
            <div id="gather-feedback" class="feedback-badge hidden" role="status">
                <img src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Gather impact reaction">
                <div class="feedback-copy">
                    <span class="feedback-label">Harvest</span>
                    <span class="feedback-text">Forge sparks fly</span>
                </div>
            </div>
            <div id="craft-feedback" class="feedback-badge hidden" role="status">
                <img src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Craft success reaction">
                <div class="feedback-copy">
                    <span class="feedback-label">Forged</span>
                    <span class="feedback-text">Blueprint complete</span>
                </div>
            </div>
            <div id="fail-feedback" class="feedback-badge hidden" role="status">
                <img src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp" alt="Action blocked reaction">
                <div class="feedback-copy">
                    <span class="feedback-label">Blocked</span>
                    <span class="feedback-text">Need a better setup</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls" class="hidden w-full flex-col items-center pointer-events-auto pb-6">
            <!-- Hotbar -->
            <div id="hotbar" class="flex gap-2 mb-4 p-2 bg-[#222]/90 border-2 border-[#555] rounded-xl shadow-2xl overflow-x-auto max-w-full">
                <!-- Slots injected via JS -->
            </div>

            <!-- Joystick Zone -->
            <div class="absolute bottom-8 left-8 w-32 h-32 opacity-20 bg-white rounded-full pointer-events-none"></div>
            <div class="absolute bottom-24 right-8 text-white/50 text-sm font-bold animate-pulse pointer-events-none">
                TAP TO GATHER / BUILD
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Config & Utils ---
    const config = JSON.parse(document.getElementById('game-config').textContent);
    const getCfg = (k) => config[k].value;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // --- Audio ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let audioUnlocked = false;
    const sfxLastPlayed = new Map();
    const feedbackTimers = new Map();
    const sfxVolumes = {
        bgm_main: 0.18,
        sfx_start: 0.55,
        sfx_click: 0.42,
        sfx_menu_open: 0.4,
        sfx_menu_close: 0.4,
        sfx_collect: 0.45,
        sfx_place: 0.45,
        sfx_craft: 0.5,
        sfx_fail: 0.42,
        sfx_jump: 0.35,
        sfx_damage: 0.46
    };

    Object.entries(sfxVolumes).forEach(([id, volume]) => {
        const media = document.getElementById(id);
        if (media) media.volume = volume;
    });

    function playSfx(id, cooldown = 0) {
        if (!audioUnlocked) return;
        const now = performance.now();
        const last = sfxLastPlayed.get(id) || 0;
        if (now - last < cooldown) return;
        const audio = document.getElementById(id);
        if (!audio) return;
        sfxLastPlayed.set(id, now);
        try {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } catch (_) {}
    }

    function syncBgm({ playing = isPlaying, defeat = false } = {}) {
        const bgm = document.getElementById('bgm_main');
        if (!bgm || !audioUnlocked) return;
        bgm.volume = defeat ? 0.1 : sfxVolumes.bgm_main;
        if (playing) bgm.play().catch(() => {});
        else bgm.pause();
    }

    function flashFeedback(id, text, duration = 1400) {
        const el = document.getElementById(id);
        if (!el) return;
        const textNode = el.querySelector('.feedback-text');
        if (textNode && text) textNode.textContent = text;
        el.classList.remove('hidden');
        requestAnimationFrame(() => el.classList.add('visible'));
        clearTimeout(feedbackTimers.get(id));
        feedbackTimers.set(id, setTimeout(() => {
            el.classList.remove('visible');
            setTimeout(() => el.classList.add('hidden'), 220);
        }, duration));
    }

    // --- Game Data ---
    const BLOCK_SIZE = 32;
    const CHUNK_HEIGHT = 64;
    const WORLD_WIDTH = getCfg('worldWidth');

    const ITEMS = {
        0: { name: 'Air', type: 'none' },
        1: { name: 'Moss Block', type: 'block', color: '#567d46', icon: 'icon-grass', drop: 2 },
        2: { name: 'Soil', type: 'block', color: '#593d29', icon: 'icon-dirt', drop: 2 },
        3: { name: 'Stone', type: 'block', color: '#757575', icon: 'icon-stone', drop: 3, hard: true },
        4: { name: 'Timber', type: 'block', color: '#4a331c', icon: 'icon-wood', drop: 4 },
        5: { name: 'Canopy', type: 'block', color: '#2d5a27', icon: 'icon-grass', drop: null }, // No drop for now
        6: { name: 'Bedrock', type: 'block', color: '#000', icon: '', drop: null },
        7: { name: 'Boards', type: 'block', color: '#9c6a46', icon: 'icon-planks', drop: 7 },
        8: { name: 'Workbench', type: 'block', color: '#8D6E63', icon: 'icon-table', drop: 8 },
        100: { name: 'Handle', type: 'item', icon: 'icon-stick' },
        101: { name: 'Field Pick', type: 'tool', icon: 'icon-pickaxe', power: 1 }
    };

    const RECIPES = [
        { out: 7, count: 4, cost: { 4: 1 }, name: "Boards (x4)" },
        { out: 100, count: 4, cost: { 7: 2 }, name: "Handles (x4)" },
        { out: 8, count: 1, cost: { 7: 4 }, name: "Workbench" },
        { out: 101, count: 1, cost: { 7: 3, 100: 3 }, name: "Field Pick", reqTable: true }
    ];

    // State
    let world = [];
    let mobs = [];
    let particles = [];
    let camera = { x: 0, y: 0 };
    let player = { x: 0, y: 0, vx: 0, vy: 0, w: 20, h: 30, grounded: false, health: 5, maxHealth: 5, invincible: 0, facing: 1 };
    let inventory = {}; // { id: count }
    let selectedSlot = 0; // Index in hotbar
    let hotbarItems = []; // Array of Item IDs currently in hotbar
    let gameTime = 0.2;
    let dayCount = 1;
    let mode = 'GATHER';
    let isPlaying = false;
    let lastTime = 0;

    // Input
    const pointers = new Map();
    const joystick = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };

    // --- Inventory System ---
    function addToInventory(id, amount) {
        if (!id) return;
        if (!inventory[id]) inventory[id] = 0;
        inventory[id] += amount;
        updateHotbar();
        showMessage(`+${amount} ${ITEMS[id].name}`);
        playSfx('sfx_collect', 80);
        flashFeedback('gather-feedback', `+${amount} ${ITEMS[id].name}`);
    }

    function removeFromInventory(id, amount) {
        if (inventory[id] && inventory[id] >= amount) {
            inventory[id] -= amount;
            if (inventory[id] <= 0) delete inventory[id];
            updateHotbar();
            return true;
        }
        return false;
    }

    function updateHotbar() {
        // Collect all held items
        const heldIds = Object.keys(inventory).map(Number).sort((a,b) => a-b);
        hotbarItems = heldIds;

        // Ensure selected slot is valid
        if (selectedSlot >= hotbarItems.length) selectedSlot = Math.max(0, hotbarItems.length - 1);

        const container = document.getElementById('hotbar');
        container.innerHTML = '';

        if (hotbarItems.length === 0) {
            const el = document.createElement('div');
            el.className = 'slot slot-active';
            el.innerHTML = '<span class="text-white/50 text-xs">EMPTY</span>';
            container.appendChild(el);
            return;
        }

        hotbarItems.forEach((id, index) => {
            const item = ITEMS[id];
            const el = document.createElement('div');
            el.className = `slot ${index === selectedSlot ? 'slot-active' : ''}`;
            el.onclick = (e) => {
                e.stopPropagation();
                selectedSlot = index;
                updateHotbar();
                if (item.type === 'tool') setMode('GATHER');
                else if (item.type === 'block') setMode('BUILD');
            };

            const icon = document.createElement('div');
            icon.className = item.icon || '';
            if (item.type === 'tool') icon.style.backgroundColor = '#8D6E63';
            el.appendChild(icon);

            const count = document.createElement('div');
            count.className = 'slot-count';
            count.innerText = inventory[id];
            el.appendChild(count);

            container.appendChild(el);
        });
    }

    function getSelectedItem() {
        if (hotbarItems.length === 0) return null;
        return hotbarItems[selectedSlot];
    }

    function showMessage(msg) {
        const log = document.getElementById('message-log');
        log.innerText = msg;
        log.style.opacity = '1';
        setTimeout(() => log.style.opacity = '0', 2000);
    }

    // --- Crafting System ---
    function renderCraftingMenu() {
        const list = document.getElementById('recipe-list');
        list.innerHTML = '';

        const px = Math.floor(player.x / BLOCK_SIZE);
        const py = Math.floor(player.y / BLOCK_SIZE);
        let tableNearby = false;
        for(let x = px - 2; x <= px + 2; x++) {
            for(let y = py - 2; y <= py + 2; y++) {
                if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < CHUNK_HEIGHT) {
                    if (world[x][y] === 8) tableNearby = true;
                }
            }
        }

        RECIPES.forEach(r => {
            const canCraft = checkCanCraft(r);
            const locked = r.reqTable && !tableNearby;

            const div = document.createElement('div');
            div.className = `recipe-row ${locked ? 'opacity-50 grayscale' : ''} ${canCraft && !locked ? 'bg-green-900/40' : ''}`;

            let reqText = Object.entries(r.cost).map(([id, amt]) => `${amt} ${ITEMS[id].name}`).join(', ');
            if (r.reqTable) reqText += " (Needs Workbench)";

            div.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-yellow-200 font-bold text-lg">${r.name}</span>
                    <span class="recipe-req">${reqText}</span>
                </div>
                <button class="glass px-3 py-1 text-white ${canCraft && !locked ? 'bg-green-600' : 'bg-gray-600'}"
                    onclick="tryCraft(${RECIPES.indexOf(r)})">FORGE</button>
            `;
            list.appendChild(div);
        });
    }

    function checkCanCraft(recipe) {
        for (let [id, amt] of Object.entries(recipe.cost)) {
            if (!inventory[id] || inventory[id] < amt) return false;
        }
        return true;
    }

    window.tryCraft = (idx) => {
        const r = RECIPES[idx];

        if (r.reqTable) {
            const px = Math.floor(player.x / BLOCK_SIZE);
            const py = Math.floor(player.y / BLOCK_SIZE);
            let tableNearby = false;
            for(let x = px - 2; x <= px + 2; x++) {
                for(let y = py - 2; y <= py + 2; y++) {
                    if (world[x][y] === 8) tableNearby = true;
                }
            }
            if (!tableNearby) {
                playSfx('sfx_fail', 180);
                flashFeedback('fail-feedback', 'Workbench required');
                showMessage("Need a workbench!");
                return;
            }
        }

        if (checkCanCraft(r)) {
            for (let [id, amt] of Object.entries(r.cost)) {
                removeFromInventory(id, amt);
            }
            addToInventory(r.out, r.count);
            playSfx('sfx_craft', 160);
            flashFeedback('craft-feedback', `${ITEMS[r.out].name} forged`);
            renderCraftingMenu();
        } else {
            playSfx('sfx_fail', 180);
            flashFeedback('fail-feedback', 'Missing materials');
        }
    };

    // --- World Gen ---
    function initWorld() {
        world = [];
        mobs = [];
        particles = [];
        inventory = {};
        hotbarItems = [];
        selectedSlot = 0;
        updateHotbar();
        player.health = player.maxHealth;
        updateHealthUI();
        dayCount = 1;
        gameTime = 0.2;

        const heights = [];
        let y = CHUNK_HEIGHT / 2;
        for (let x = 0; x < WORLD_WIDTH; x++) {
            y += (Math.random() - 0.5) * 2;
            heights[x] = Math.floor(y);
        }

        for (let x = 0; x < WORLD_WIDTH; x++) {
            world[x] = [];
            let h = heights[x];
            let tree = Math.random() < 0.1 && x > 5 && x < WORLD_WIDTH - 5;

            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                if (y === CHUNK_HEIGHT - 1) world[x][y] = 6;
                else if (y > h + 6) world[x][y] = 3;
                else if (y > h) world[x][y] = 2;
                else if (y === h) world[x][y] = 1;
                else world[x][y] = 0;
            }

            if (tree) {
                let th = Math.floor(Math.random() * 3) + 3;
                for (let i = 1; i <= th; i++) world[x][h - i] = 4;
                for(let lx = -1; lx <= 1; lx++) {
                    for(let ly = -2; ly <= 0; ly++) {
                        if (world[x+lx] && world[x+lx][h-th+ly] === 0) world[x+lx][h-th+ly] = 5;
                    }
                }
            }
        }

        player.x = (WORLD_WIDTH * BLOCK_SIZE) / 2;
        player.y = (heights[Math.floor(WORLD_WIDTH/2)] - 5) * BLOCK_SIZE;
        player.vx = 0; player.vy = 0;
    }

    // --- Logic ---
    function update(dt) {
        if (!isPlaying || player.health <= 0) return;

        gameTime += dt / (getCfg('dayDuration') * 60);
        if (gameTime >= 1) { gameTime = 0; dayCount++; document.getElementById('day-indicator').innerText = `Day ${dayCount}`; }

        let moveDir = 0;
        if (joystick.active) {
            moveDir = joystick.dx / 40;
            if (Math.abs(moveDir) < 0.1) moveDir = 0; else moveDir = Math.sign(moveDir);
            if (moveDir !== 0) player.facing = moveDir;
            if (joystick.dy < -20 && player.grounded) {
                player.vy = -getCfg('jumpForce');
                player.grounded = false;
                playSfx('sfx_jump', 120);
            }
        }
        player.vx = moveDir * getCfg('moveSpeed');
        player.vy += getCfg('gravity');

        moveEntity(player);
        if (player.y > CHUNK_HEIGHT * BLOCK_SIZE) takeDamage(999);

        camera.x += (player.x - canvas.width/2 - camera.x) * 0.1;
        camera.y += (player.y - canvas.height/2 - camera.y) * 0.1;
        camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH * BLOCK_SIZE - canvas.width));
        camera.y = Math.max(-200, Math.min(camera.y, CHUNK_HEIGHT * BLOCK_SIZE - canvas.height));

        if (Math.random() < 0.01 && mobs.length < 5 && (gameTime > 0.5 || Math.random() < 0.1)) {
            // Spawn logic omitted for brevity, just keeping array clean
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life -= dt; p.x += p.vx; p.y += p.vy; p.vy += 0.2;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function moveEntity(e) {
        e.x += e.vx; checkCol(e, true);
        e.y += e.vy; e.grounded = false; checkCol(e, false);
    }

    function checkCol(e, horiz) {
        const sx = Math.floor(e.x/BLOCK_SIZE), ex = Math.floor((e.x+e.w)/BLOCK_SIZE);
        const sy = Math.floor(e.y/BLOCK_SIZE), ey = Math.floor((e.y+e.h)/BLOCK_SIZE);
        for(let x=sx; x<=ex; x++) {
            for(let y=sy; y<=ey; y++) {
                if (x>=0 && x<WORLD_WIDTH && y>=0 && y<CHUNK_HEIGHT && world[x][y] && ITEMS[world[x][y]].type === 'block') {
                    if (horiz) {
                        if (e.vx > 0) e.x = x*BLOCK_SIZE - e.w - 0.01;
                        else if (e.vx < 0) e.x = (x+1)*BLOCK_SIZE + 0.01;
                        e.vx = 0;
                    } else {
                        if (e.vy > 0) { e.y = y*BLOCK_SIZE - e.h - 0.01; e.grounded = true; }
                        else if (e.vy < 0) e.y = (y+1)*BLOCK_SIZE + 0.01;
                        e.vy = 0;
                    }
                    return;
                }
            }
        }
    }

    function interact(sx, sy) {
        const wx = Math.floor((sx + camera.x) / BLOCK_SIZE);
        const wy = Math.floor((sy + camera.y) / BLOCK_SIZE);
        if (wx < 0 || wx >= WORLD_WIDTH || wy < 0 || wy >= CHUNK_HEIGHT) return;

        const dist = Math.hypot(player.x - wx*BLOCK_SIZE, player.y - wy*BLOCK_SIZE);
        if (dist > BLOCK_SIZE * 4) {
            playSfx('sfx_fail', 180);
            flashFeedback('fail-feedback', 'Move closer');
            showMessage("Move closer!");
            return;
        }

        const blockId = world[wx][wy];
        const heldId = getSelectedItem();
        const heldItem = heldId ? ITEMS[heldId] : null;

        if (mode === 'GATHER') {
            if (blockId !== 0 && blockId !== 6) {
                const blockDef = ITEMS[blockId];

                if (blockDef.hard) {
                    if (!heldItem || heldItem.type !== 'tool') {
                        playSfx('sfx_fail', 180);
                        flashFeedback('fail-feedback', 'Field pick required');
                        showMessage("Field pick required!");
                        return;
                    }
                }

                spawnParticles(wx, wy, blockDef.color);
                world[wx][wy] = 0;
                if (blockDef.drop) addToInventory(blockDef.drop, 1);
                else flashFeedback('gather-feedback', `${blockDef.name} cleared`);
            }
        } else {
            if (blockId === 0) {
                if (heldItem && heldItem.type === 'block') {
                    const pRect = {x: player.x, y: player.y, w: player.w, h: player.h};
                    const bRect = {x: wx*BLOCK_SIZE, y: wy*BLOCK_SIZE, w: BLOCK_SIZE, h: BLOCK_SIZE};

                    if (!(pRect.x < bRect.x + bRect.w && pRect.x + pRect.w > bRect.x &&
                          pRect.y < bRect.y + bRect.h && pRect.y + pRect.h > bRect.y)) {

                        world[wx][wy] = heldId;
                        removeFromInventory(heldId, 1);
                        spawnParticles(wx, wy, ITEMS[heldId].color);
                        playSfx('sfx_place', 100);
                        flashFeedback('craft-feedback', `${ITEMS[heldId].name} placed`);
                    } else {
                        playSfx('sfx_fail', 180);
                        flashFeedback('fail-feedback', 'No room to place');
                        showMessage("No room to place");
                    }
                } else {
                    playSfx('sfx_fail', 180);
                    flashFeedback('fail-feedback', 'Select a block');
                    showMessage("Select a building block");
                }
            } else if (blockId === 8) {
                playSfx('sfx_menu_open', 120);
                document.getElementById('crafting-menu').classList.remove('hidden');
                renderCraftingMenu();
            }
        }
    }

    function spawnParticles(bx, by, color) {
        for(let i=0; i<5; i++) {
            particles.push({
                x: bx*BLOCK_SIZE + 16, y: by*BLOCK_SIZE + 16,
                vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                life: 20, color: color, size: Math.random()*4+2
            });
        }
    }

    function takeDamage(amt) {
        if (player.invincible > 0) return;
        player.health -= amt;
        player.invincible = 60;
        playSfx('sfx_damage', 220);
        if (player.health > 0) flashFeedback('fail-feedback', 'Expedition hit');
        updateHealthUI();
        if (player.health <= 0) {
            flashFeedback('fail-feedback', 'Expedition lost', 1800);
            document.getElementById('game-over-screen').classList.remove('hidden');
            isPlaying = false;
            syncBgm({ playing: false, defeat: true });
        }
    }

    function updateHealthUI() {
        const bar = document.getElementById('health-bar');
        bar.innerHTML = '';
        for(let i=0; i<player.maxHealth; i++) {
            bar.innerHTML += `<span class="heart">${i < player.health ? '♥' : '♡'}</span>`;
        }
    }

    function setMode(m) {
        mode = m;
        const btn = document.getElementById('mode-btn');
        btn.innerText = mode;
        btn.className = `glass px-3 py-2 rounded text-white text-lg font-bold tracking-widest w-20 ${mode === 'GATHER' ? 'bg-blue-900/80' : 'bg-green-900/80'}`;
    }

    // --- Rendering ---
    function draw() {
        let t = gameTime;
        let r, g, b;
        if (t < 0.3) { r = 135; g = 206; b = 235; }
        else if (t < 0.5) { r = 255; g = 140; b = 0; }
        else if (t < 0.9) { r = 20; g = 20; b = 40; }
        else { r = 255; g = 160; b = 100; }
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sc = Math.floor(camera.x/BLOCK_SIZE), ec = sc + Math.ceil(canvas.width/BLOCK_SIZE)+1;
        const sr = Math.floor(camera.y/BLOCK_SIZE), er = sr + Math.ceil(canvas.height/BLOCK_SIZE)+1;

        for(let x = sc; x <= ec; x++) {
            for(let y = sr; y <= er; y++) {
                if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < CHUNK_HEIGHT && world[x][y]) {
                    const id = world[x][y];
                    const bx = x*BLOCK_SIZE - camera.x;
                    const by = y*BLOCK_SIZE - camera.y;

                    ctx.fillStyle = ITEMS[id].color;
                    ctx.fillRect(Math.floor(bx), Math.floor(by), BLOCK_SIZE, BLOCK_SIZE);

                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.fillRect(bx, by+BLOCK_SIZE-4, BLOCK_SIZE, 4);
                    ctx.fillRect(bx+BLOCK_SIZE-4, by, 4, BLOCK_SIZE);

                    if (id === 8) {
                        ctx.fillStyle = '#5D4037';
                        ctx.fillRect(bx+4, by+4, 10, 10);
                        ctx.fillRect(bx+18, by+4, 10, 10);
                        ctx.fillRect(bx+4, by+18, 10, 10);
                        ctx.fillRect(bx+18, by+18, 10, 10);
                    }
                }
            }
        }

        const px = player.x - camera.x, py = player.y - camera.y;
        if (player.invincible % 10 < 5) {
            ctx.fillStyle = '#1d2634'; ctx.fillRect(px+2, py+26, 5, 4); ctx.fillRect(px+13, py+26, 5, 4);
            ctx.fillStyle = '#202733'; ctx.fillRect(px+1, py+11, player.w-2, player.h-9);
            ctx.fillStyle = '#ff9f43'; ctx.fillRect(px+4, py+11, player.w-8, 5);
            ctx.fillStyle = '#f6d8a8'; ctx.fillRect(px+3, py+1, player.w-6, 10);
            ctx.fillStyle = '#5e3a20'; ctx.fillRect(px+2, py, player.w-4, 3);
            ctx.fillStyle = '#101923'; ctx.fillRect(px+6, py+5, 3, 2); ctx.fillRect(px+11, py+5, 3, 2);
            ctx.fillStyle = '#7d4f2d'; ctx.fillRect(px+8, py+7, 4, 2);
            ctx.fillStyle = '#2d7a4c'; ctx.fillRect(px+3, py+14, player.w-6, 8);
            ctx.fillStyle = '#3c9e62'; ctx.fillRect(px+5, py+14, player.w-10, 4);
            ctx.fillStyle = '#0f1724'; ctx.fillRect(px+4, py+21, 4, 5); ctx.fillRect(px+12, py+21, 4, 5);
            ctx.fillStyle = 'rgba(255, 214, 92, 0.42)';
            ctx.fillRect(px + player.facing * 2 + 8, py + 11, 6, 12);

            const held = getSelectedItem();
            if (held) {
                const item = ITEMS[held];
                ctx.save();
                ctx.translate(px + (player.facing > 0 ? 20 : -5), py + 15);
                if (player.facing < 0) ctx.scale(-1, 1);

                if (item.type === 'tool') {
                    ctx.fillStyle = '#8D6E63';
                    ctx.fillRect(0, 0, 4, 15);
                    ctx.fillRect(-6, -2, 16, 4);
                } else {
                    ctx.fillStyle = item.color;
                    ctx.fillRect(0, 0, 10, 10);
                }
                ctx.restore();
            }
        }

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x-camera.x, p.y-camera.y, p.size, p.size);
        });

        if (joystick.active) {
            ctx.beginPath(); ctx.arc(joystick.ox, joystick.oy, 40, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(joystick.ox + joystick.dx, joystick.oy + joystick.dy, 20, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
        }
    }

    function loop(ts) {
        const dt = (ts - lastTime) / 16.67;
        lastTime = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
    }

    // --- Inputs ---
    const handleDown = (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;

        if (x < canvas.width/2 && y > canvas.height/3) {
            joystick.active = true; joystick.id = e.pointerId;
            joystick.ox = x; joystick.oy = y; joystick.dx = 0; joystick.dy = 0;
        } else {
            if (isPlaying) interact(x, y);
        }
    };

    const handleMove = (e) => {
        e.preventDefault();
        if (joystick.active && joystick.id === e.pointerId) {
            const rect = canvas.getBoundingClientRect();
            let dx = (e.clientX - rect.left) - joystick.ox;
            let dy = (e.clientY - rect.top) - joystick.oy;
            const dist = Math.hypot(dx, dy);
            if (dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
            joystick.dx = dx; joystick.dy = dy;
        }
    };

    const handleUp = (e) => {
        e.preventDefault();
        if (joystick.id === e.pointerId) {
            joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0;
        }
    };

    canvas.addEventListener('pointerdown', handleDown, {passive:false});
    canvas.addEventListener('pointermove', handleMove, {passive:false});
    canvas.addEventListener('pointerup', handleUp, {passive:false});
    canvas.addEventListener('pointercancel', handleUp, {passive:false});

    // --- UI Events ---
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden'); document.getElementById('hud').classList.add('flex');
        document.getElementById('controls').classList.remove('hidden'); document.getElementById('controls').classList.add('flex');

        if (!audioUnlocked) {
            audioCtx.resume().catch(() => {});
            audioUnlocked = true;
        }

        playSfx('sfx_start', 120);
        initWorld();
        isPlaying = true;
        syncBgm({ playing: true });
        requestAnimationFrame(loop);
    };

    document.getElementById('respawn-btn').onclick = () => {
        playSfx('sfx_click', 80);
        document.getElementById('game-over-screen').classList.add('hidden');
        initWorld();
        isPlaying = true;
        syncBgm({ playing: true });
    };

    document.getElementById('mode-btn').onclick = () => {
        playSfx('sfx_click', 80);
        setMode(mode === 'GATHER' ? 'BUILD' : 'GATHER');
    };

    document.getElementById('craft-btn').onclick = () => {
        playSfx('sfx_menu_open', 120);
        document.getElementById('crafting-menu').classList.remove('hidden');
        renderCraftingMenu();
    };

    document.getElementById('close-craft').onclick = () => {
        playSfx('sfx_menu_close', 120);
        document.getElementById('crafting-menu').classList.add('hidden');
    };

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
});
</script>
</body>
</html>
