<body>
    <div id="game-container" class="relative group w-full h-full">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Layer -->
        <div id="ui-layer" class="absolute inset-0 flex flex-col pointer-events-none">
            
            <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
            <!-- Top HUD -->
            <div id="hud" class="w-full flex justify-between items-start p-6 hidden">
                <div class="glass-panel px-6 py-3 rounded-full flex flex-col items-center">
                    <span class="text-gray-400 text-xs uppercase tracking-widest">Viewers</span>
                    <span id="score" class="text-2xl font-bold text-white">0</span>
                </div>
                
                <div class="glass-panel px-6 py-3 rounded-full flex flex-col items-center" style="width: 33.3333%;">
                    <span class="text-gray-400 text-xs uppercase tracking-widest mb-1">Chat Anger</span>
                    <div class="w-full h-4 bg-gray-700 rounded-full overflow-hidden relative" style="height: 1rem; border: 1px solid rgba(255,255,255,0.08);">
                        <div id="anger-bar" class="h-full w-0 transition duration-200"></div>
                    </div>
                </div>
            </div>

            <!-- [agent-note][stage2] preserve: control-zone | reason: avoid thumb obstruction -->
            <!-- Bottom Controls -->
            <div id="controls" class="mt-auto mb-8 w-full flex justify-center gap-4 px-4 pointer-events-auto hidden">
                <button class="trigger-btn glass-panel text-white p-4 rounded-xl flex flex-col items-center transition" data-mode="0">
                    <div class="text-2xl mb-1">👆</div>
                    <span class="text-xs font-bold mode-label">Tapping</span>
                </button>
                <button class="trigger-btn glass-panel text-white p-4 rounded-xl flex flex-col items-center transition" data-mode="1">
                    <div class="text-2xl mb-1">💅</div>
                    <span class="text-xs font-bold mode-label">Scratch</span>
                </button>
                <button class="trigger-btn glass-panel text-white p-4 rounded-xl flex flex-col items-center transition" data-mode="2">
                    <div class="text-2xl mb-1">🖌️</div>
                    <span class="text-xs font-bold mode-label">Brush</span>
                </button>
                <button class="trigger-btn glass-panel text-white p-4 rounded-xl flex flex-col items-center transition" data-mode="3">
                    <div class="text-2xl mb-1">🎤</div>
                    <span class="text-xs font-bold mode-label">Whisper</span>
                </button>
            </div>

            <!-- [agent-note][stage3] resolved-gif: calm/fail reactions -> catalogs/gifs.json -->
            <img id="reaction-gif" class="reaction-overlay hidden" alt="Chat reaction overlay">
            <div id="reaction-caption" class="overlay-caption hidden">CHAT MOOD</div>

            <!-- Screens -->
            <div id="start-screen" class="absolute inset-0 flex flex-col justify-center items-center bg-black/60 backdrop-blur-sm pointer-events-auto z-50">
                <div class="glass-panel p-10 rounded-3xl text-center max-w-md mx-4 transition hover:scale-105 border-t-4 border-purple-500">
                    <h1 class="text-5xl font-bold mb-4" style="color: #f4e6ff;">ASMR STREAM CONTROL</h1>
                    <p class="text-gray-300 text-lg mb-8 leading-relaxed">
                        Keep viewers calm by matching the right trigger. <br>
                        When chat says <span class="text-red-400 font-bold">"I hate this!"</span>, switch modes fast.
                    </p>
                    <button id="start-btn" class="font-bold py-4 px-10 rounded-full shadow-lg transition hover:shadow-purple-500/50 hover:scale-105 transform">START STREAM</button>
                </div>
            </div>

            <div id="game-over-screen" class="absolute inset-0 flex flex-col justify-center items-center bg-black/80 backdrop-blur-md pointer-events-auto hidden z-50">
                <div class="glass-panel p-10 rounded-3xl text-center max-w-md mx-4 border-t-4 border-red-500">
                    <h2 class="text-4xl font-bold text-red-400 mb-2">STREAM OFFLINE</h2>
                    <p class="text-gray-400 mb-6">You stayed on the wrong trigger too long.</p>
                    <div class="text-3xl text-white mb-8" style="font-family: 'Audiowide', system-ui, sans-serif;">Viewers Held: <span id="finalScore">0</span></div>
                    <button id="restart-btn" class="text-gray-900 font-bold py-3 px-8 rounded-full shadow-lg transition">Restart Stream</button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_02.mp3",
            sfx: {
                mode: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                score: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                alert: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"
            },
            gifs: {
                calm: "https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp",
                anger: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.22;
                this.bgm.preload = 'auto';

                this.sfx = {};
                this.lastPlayed = {};

                const volumes = {
                    mode: 0.4,
                    score: 0.42,
                    alert: 0.32,
                    fail: 0.5,
                    start: 0.46
                };

                for (const [key, url] of Object.entries(ASSETS.sfx)) {
                    const audio = new Audio(url);
                    audio.preload = 'auto';
                    audio.volume = volumes[key] ?? 0.4;
                    this.sfx[key] = audio;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.currentTime = 0;
                this.bgm.play().catch(() => {});
            }
            
            stopBGM() { 
                this.bgm.pause(); 
                this.bgm.currentTime = 0; 
            }

            playSFX(key, minGap = 0) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                if (minGap > 0 && this.lastPlayed[key] && now - this.lastPlayed[key] < minGap) return;
                this.lastPlayed[key] = now;

                try {
                    const clone = this.sfx[key].cloneNode();
                    clone.volume = this.sfx[key].volume;
                    clone.play().catch(() => {});
                } catch {
                    // fail silently to preserve gameplay
                }
            }
        }
        
        const audio = new AudioController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const reactionGif = document.getElementById('reaction-gif');
        const reactionCaption = document.getElementById('reaction-caption');

        let width, height;
        
        let gameActive = false;
        let score = 0;
        let anger = 0;
        let currentMode = 0;
        let hatedMode = -1;
        let lastHateSwitchTime = 0;
        let hateInterval = 5000;
        let frameCount = 0;
        let mouseX = 0;
        let mouseY = 0;
        let lastPositiveGifTime = 0;
        let lastAlertGifTime = 0;

        // Entities
        let chatMessages = [];
        let particles = [];
        
        // Config
        const MODES = ['Tapping', 'Scratching', 'Brushing', 'Whispering'];
        const POSITIVE_TEXTS = ["So tingly!", "Love this <3", "More pls", "Sleepy...", "Zzz...", "Nice sounds", "Relaxing", "Good vibes"];
        const NEGATIVE_TEXTS = ["I HATE THIS", "STOP!!", "MY EARS", "BORING", "CHANGE IT", "BAD ASMR", "Unsubbed", "Loud!!"];
        const MODE_COLORS = ['#9d7aff', '#ff73ce', '#8cf0ff', '#6ab6ff'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function showReaction(type, caption) {
            reactionGif.src = ASSETS.gifs[type];
            reactionGif.classList.remove('hidden', 'calm', 'anger');
            reactionGif.classList.add('visible', type);
            reactionCaption.textContent = caption;
            reactionCaption.classList.remove('hidden');
            reactionCaption.classList.add('visible');
        }

        function hideReaction() {
            reactionGif.classList.remove('visible', 'calm', 'anger');
            reactionCaption.classList.remove('visible');
            setTimeout(() => {
                if (!reactionGif.classList.contains('visible')) reactionGif.classList.add('hidden');
                if (!reactionCaption.classList.contains('visible')) reactionCaption.classList.add('hidden');
            }, 180);
        }

        // Button Listeners
        document.querySelectorAll('.trigger-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = parseInt(btn.getAttribute('data-mode'));
                setMode(mode);
            });
        });

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.trigger-btn').forEach(b => {
                b.classList.remove('active-mode');
                if (parseInt(b.getAttribute('data-mode')) === mode) {
                    b.classList.add('active-mode');
                }
            });

            audio.playSFX('mode', 90);
            
            for (let i = 0; i < 10; i++) {
                createParticle(width / 2, height / 2 + 50, MODE_COLORS[mode]);
            }
        }

        /** 4. GAME LOGIC HELPERS */
        function createChatMessage(isAngry) {
            const textArray = isAngry ? NEGATIVE_TEXTS : POSITIVE_TEXTS;
            const text = textArray[Math.floor(Math.random() * textArray.length)];
            chatMessages.push({
                text: text,
                x: width * 0.7 + (Math.random() * width * 0.22),
                y: height,
                speed: 1 + Math.random() * 2,
                color: isAngry ? '#ff7b97' : '#7df0be',
                alpha: 1,
                isAngry: isAngry,
                scale: isAngry ? 1.2 : 1
            });
        }

        function createParticle(x, y, color) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 1,
                color: color,
                size: Math.random() * 5 + 2
            });
        }

        function switchHatedMode() {
            hatedMode = Math.floor(Math.random() * 4);
            chatMessages.push({
                text: `I hate ${MODES[hatedMode]}!`,
                x: width * 0.76,
                y: height,
                speed: 3,
                color: '#ff73ce',
                alpha: 1,
                isAngry: true,
                scale: 1.35,
                bold: true
            });
            hateInterval = Math.max(2000, 5000 - (score * 5)); 
        }

        /** 5. RENDER FUNCTIONS */
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#090d1d');
            grad.addColorStop(0.55, '#16122d');
            grad.addColorStop(1, '#050913');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const bloom = ctx.createRadialGradient(width * 0.5, height * 0.28, 40, width * 0.5, height * 0.28, width * 0.45);
            bloom.addColorStop(0, 'rgba(140, 240, 255, 0.15)');
            bloom.addColorStop(0.6, 'rgba(157, 122, 255, 0.08)');
            bloom.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bloom;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(mouseX * 0.02, mouseY * 0.02);
            ctx.strokeStyle = 'rgba(140, 240, 255, 0.07)';
            ctx.lineWidth = 1;
            for (let i = -60; i < width + 60; i += 60) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 80, height);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let i = 0; i < width; i += 80) {
                for (let j = 0; j < height; j += 80) {
                    if ((i + j) % 160 === 0) {
                        ctx.beginPath();
                        ctx.arc(i, j, 2 + ((i + j) % 5), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        function drawMic() {
            const centerX = width / 2;
            const centerY = height / 2 + 50;
            
            const offX = mouseX * 0.05;
            const offY = mouseY * 0.05;

            ctx.save();
            ctx.translate(centerX - offX, centerY - offY);

            const halo = ctx.createRadialGradient(0, -10, 10, 0, 0, 160);
            halo.addColorStop(0, 'rgba(140, 240, 255, 0.18)');
            halo.addColorStop(0.55, 'rgba(157, 122, 255, 0.08)');
            halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, 160, 0, Math.PI * 2);
            ctx.fill();

            const standGrad = ctx.createLinearGradient(0, 100, 0, 300);
            standGrad.addColorStop(0, '#39445f');
            standGrad.addColorStop(1, '#12182a');
            ctx.fillStyle = standGrad;
            ctx.fillRect(-10, 100, 20, 200);

            ctx.strokeStyle = 'rgba(140, 240, 255, 0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 70, 55, 0, Math.PI * 2);
            ctx.stroke();

            const micGrad = ctx.createLinearGradient(-40, -80, 40, 100);
            micGrad.addColorStop(0, '#e9f7ff');
            micGrad.addColorStop(0.18, '#93b7d8');
            micGrad.addColorStop(0.55, '#334161');
            micGrad.addColorStop(1, '#12182a');
            ctx.fillStyle = micGrad;
            ctx.beginPath();
            ctx.roundRect(-40, -80, 80, 180, 30);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(140, 240, 255, 0.38)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-23, -62);
            ctx.lineTo(-23, 82);
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(-40, -80, 80, 180, 30);
            ctx.clip();
            ctx.strokeStyle = 'rgba(13, 18, 29, 0.6)';
            ctx.lineWidth = 1;
            for (let i = -80; i < 104; i += 8) {
                ctx.beginPath();
                ctx.moveTo(-40, i);
                ctx.lineTo(40, i);
                ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let i = -40; i <= 40; i += 8) {
                ctx.beginPath();
                ctx.moveTo(i, -80);
                ctx.lineTo(i, 100);
                ctx.stroke();
            }
            ctx.restore();

            ctx.fillStyle = '#0c1020';
            ctx.beginPath();
            ctx.arc(-12, -8, 6, 0, Math.PI * 2);
            ctx.arc(12, -8, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(140, 240, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 20, 16, 0.2, Math.PI - 0.2);
            ctx.stroke();

            ctx.fillStyle = currentMode === hatedMode ? 'rgba(255, 95, 122, 0.95)' : MODE_COLORS[currentMode];
            ctx.beginPath();
            ctx.arc(0, 58, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = currentMode === hatedMode ? '#ff5f7a' : MODE_COLORS[currentMode];
            ctx.shadowBlur = 18;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();

            drawModeEffect(centerX - offX, centerY - offY);
        }

        function drawModeEffect(x, y) {
            ctx.save();
            ctx.translate(x, y);
            const time = Date.now() / 200;

            if (currentMode === 0) {
                ctx.strokeStyle = 'rgba(157, 122, 255, 0.55)';
                ctx.lineWidth = 3;
                for (let i = 0; i < 3; i++) {
                    const r = (Date.now() / 10 % 100) + (i * 30);
                    const alpha = 1 - (r / 130);
                    if (alpha > 0) {
                        ctx.globalAlpha = alpha;
                        ctx.beginPath();
                        ctx.arc(0, 0, 40 + r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            } else if (currentMode === 1) {
                ctx.strokeStyle = 'rgba(255, 115, 206, 0.75)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = -50; i < 50; i += 10) {
                    ctx.moveTo(i, -60 + Math.sin(time + i) * 10);
                    ctx.lineTo(i + 5, -40 + Math.cos(time + i) * 10);
                }
                ctx.stroke();
            } else if (currentMode === 2) {
                const grad = ctx.createRadialGradient(Math.sin(time) * 30, 0, 0, 0, 0, 100);
                grad.addColorStop(0, 'rgba(140, 240, 255, 0.42)');
                grad.addColorStop(1, 'rgba(140, 240, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 120, 0, Math.PI * 2);
                ctx.fill();
            } else if (currentMode === 3) {
                ctx.strokeStyle = 'rgba(106, 182, 255, 0.7)';
                ctx.lineWidth = 4;
                for (let i = 1; i < 4; i++) {
                    ctx.beginPath();
                    ctx.arc(0, -20, 40 + (i * 15) + Math.sin(time) * 5, -Math.PI / 4, -3 * Math.PI / 4, true);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, -20, 40 + (i * 15) + Math.sin(time) * 5, Math.PI / 4, 3 * Math.PI / 4, false);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawChat() {
            ctx.font = "600 16px 'Rajdhani', sans-serif";
            for (let i = chatMessages.length - 1; i >= 0; i--) {
                const msg = chatMessages[i];
                msg.y -= msg.speed;
                msg.alpha -= 0.005;

                if (msg.alpha <= 0) {
                    chatMessages.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = msg.alpha;
                ctx.fillStyle = 'rgba(10, 16, 31, 0.78)';
                ctx.strokeStyle = msg.color;
                
                const textWidth = ctx.measureText(msg.text).width;
                const padding = 10;
                
                ctx.beginPath();
                ctx.roundRect(msg.x, msg.y - 20, textWidth + padding * 2, 30, 15);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#f8fbff';
                ctx.shadowColor = msg.color;
                ctx.shadowBlur = msg.bold ? 14 : 8;
                if (msg.bold) {
                    ctx.font = "700 18px 'Audiowide', sans-serif";
                } else {
                    ctx.font = "600 16px 'Rajdhani', sans-serif";
                }
                ctx.fillText(msg.text, msg.x + padding, msg.y);
                
                ctx.restore();
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /** 6. GAME LOOP */
        function initGame() {
            score = 0;
            anger = 0;
            chatMessages = [];
            particles = [];
            currentMode = 0;
            hatedMode = -1;
            frameCount = 0;
            lastHateSwitchTime = Date.now();
            lastPositiveGifTime = 0;
            lastAlertGifTime = 0;
            hideReaction();
            setMode(0);
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(score);
            const bar = document.getElementById('anger-bar');
            bar.style.width = `${anger}%`;
            
            if (anger > 80) {
                bar.classList.add('animate-pulse');
            } else {
                bar.classList.remove('animate-pulse');
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            const now = Date.now();
            frameCount++;

            if (now - lastHateSwitchTime > hateInterval) {
                switchHatedMode();
                lastHateSwitchTime = now;
            }

            if (currentMode === hatedMode) {
                anger += 0.3;
                if (frameCount % 20 === 0) {
                    createChatMessage(true);
                    audio.playSFX('alert', 180);
                    if (now - lastAlertGifTime > 1500) {
                        showReaction('anger', 'CHAT RAGING');
                        lastAlertGifTime = now;
                    }
                }
            } else {
                anger = Math.max(0, anger - 0.1);
                score += 0.1;
                if (frameCount % 60 === 0) {
                    createChatMessage(false);
                    audio.playSFX('score', 220);
                    if (Math.random() > 0.45 && now - lastPositiveGifTime > 2800) {
                        showReaction('calm', 'TINGLES LANDED');
                        lastPositiveGifTime = now;
                    }
                }
            }

            if (now - Math.max(lastPositiveGifTime, lastAlertGifTime) > 1200) {
                hideReaction();
            }

            if (anger >= 100) {
                gameOver();
                return;
            }

            updateUI();

            ctx.clearRect(0, 0, width, height);
            
            if (currentMode === hatedMode) {
                const shakeX = (Math.random() - 0.5) * (anger / 10);
                const shakeY = (Math.random() - 0.5) * (anger / 10);
                ctx.save();
                ctx.translate(shakeX, shakeY);
            }

            drawBackground();
            drawMic();
            drawParticles();
            drawChat();

            if (currentMode === hatedMode) ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 0);
            showReaction('anger', 'STREAM MELTDOWN');
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = Math.floor(score);
        }

        /** 7. CONTROLS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 0);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            audio.playSFX('start', 0);
            audio.playBGM();
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
