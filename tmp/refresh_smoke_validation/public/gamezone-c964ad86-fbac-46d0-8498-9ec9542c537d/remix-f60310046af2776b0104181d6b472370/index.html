<script>
document.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),bgm=document.getElementById('bgm-main'),comboGif=document.getElementById('combo-gif'),dangerGif=document.getElementById('danger-gif');
const sfxNodes={hit:by('sfx-hit'),loot:by('sfx-loot'),hurt:by('sfx-hurt'),roll:by('sfx-roll'),upgrade:by('sfx-upgrade'),menuOpen:by('sfx-menu-open'),menuClose:by('sfx-menu-close'),blocked:by('sfx-blocked'),gameOver:by('sfx-game-over')};
const statsLeft=by('stats-left'),statsRight=by('stats-right'),joystick=by('joystick'),stick=by('stick'),btnHeavy=by('btnHeavy'),btnRoll=by('btnRoll'),btnInv=by('btnInv'),inventoryPanel=by('inventory-panel'),invFang=by('inv-fang'),invEssence=by('inv-essence'),invRune=by('inv-rune'),wpnSteel=by('wpn-steel'),wpnSilver=by('wpn-silver'),wpnLongsword=by('wpn-longsword'),wpnAxe=by('wpn-axe'),wpnMace=by('wpn-mace'),gameOverScreen=by('game-over-screen'),gameOverText=by('game-over-text'),restartBtn=by('restart-btn');
function by(id){return document.getElementById(id)}; window.gameConfigDefs={heroSpeed:{type:'number',min:2,max:12,value:6.8},accentColor:{type:'color',value:'#ffd75e'},titleText:{type:'text',value:'Vice Grid: Heat Run'}}; window.gameConfig={heroSpeed:6.8,accentColor:'#ffd75e',titleText:'Vice Grid: Heat Run'}; window.updateGameConfig=(k,v)=>{const d=window.gameConfigDefs[k];if(!d)return;if(d.type==='number'){const n=Number(v);if(Number.isFinite(n)){d.value=Math.max(d.min,Math.min(d.max,n));window.gameConfig[k]=d.value}}else if(d.type==='color'&&/^#[0-9a-fA-F]{6}$/.test(String(v))){d.value=String(v);window.gameConfig[k]=d.value;document.documentElement.style.setProperty('--amber',d.value)}else if(d.type==='text'){d.value=String(v);window.gameConfig[k]=d.value;document.title=d.value;by('inventory-title').textContent=String(v).toUpperCase()+' - GARAGE'}};
const GAME_STATES={PLAYING:'PLAYING',GAMEOVER:'GAMEOVER'};let gameState=GAME_STATES.PLAYING,initialized=false,firstInteraction=false,cw=360,ch=640,dpr=1,canvasRect={left:0,top:0,width:360,height:640};
const weaponDefs={'Steel Sword':{ui:'BUMPER RAM',light:{dmg:18,rangeMul:.24,rangeMin:68,cd:.26,offset:62,arc:.08,vib:'light',style:'steel'},heavy:{dmg:30,rangeMul:.30,rangeMin:92,cd:.62,offset:74,arc:-.04,vib:'medium',style:'silver'}},'Silver Sword':{ui:'SPIKE RAIL',light:{dmg:16,rangeMul:.27,rangeMin:76,cd:.24,offset:64,arc:.06,vib:'light',style:'steel'},heavy:{dmg:42,rangeMul:.36,rangeMin:110,cd:.8,offset:78,arc:-.1,vib:'medium',style:'silver'}},'Longsword':{ui:'LONG RAM',light:{dmg:22,rangeMul:.30,rangeMin:86,cd:.31,offset:70,arc:.02,vib:'light',style:'steel'},heavy:{dmg:36,rangeMul:.38,rangeMin:120,cd:.9,offset:82,arc:-.08,vib:'medium',style:'silver'}},'Axe':{ui:'WRECK BAR',light:{dmg:26,rangeMul:.23,rangeMin:66,cd:.36,offset:60,arc:-.02,vib:'medium',style:'axe'},heavy:{dmg:56,rangeMul:.28,rangeMin:90,cd:1.02,offset:70,arc:-.18,vib:'heavy',style:'axe'}},'Mace':{ui:'JAMMER PULSE',light:{dmg:24,rangeMul:.21,rangeMin:62,cd:.34,offset:58,arc:-.04,vib:'medium',style:'mace'},heavy:{dmg:52,rangeMul:.25,rangeMin:84,cd:1,offset:68,arc:-.2,vib:'heavy',style:'mace'}}};
const monsterDefs={ghoul:{name:'Patrol Cruiser',hpMul:1,spdMul:1,rMul:1,color:'#2a54ff',behavior:'chase',damageMul:1,worthMul:1},hound:{name:'Bike Unit',hpMul:.75,spdMul:1.35,rMul:.82,color:'#40d9ff',behavior:'charger',damageMul:.85,worthMul:.95},wraith:{name:'News Drone',hpMul:.92,spdMul:1.12,rMul:.95,color:'#b66bff',behavior:'drifter',damageMul:1.05,worthMul:1.15},brute:{name:'SWAT Van',hpMul:1.7,spdMul:.72,rMul:1.24,color:'#ff496d',behavior:'tank',damageMul:1.35,worthMul:1.35},leech:{name:'Tow Swarm',hpMul:.88,spdMul:1.08,rMul:.9,color:'#ff9c40',behavior:'zig',damageMul:.9,worthMul:1}};
const state={time:0,wave:1,spawnTimer:0,kills:0,gold:0,lootLevel:1,shake:0,popups:[],slashes:[],monsters:[],feedbackTimers:{combo:0,danger:0},lowHealthWarningCd:0,heavyHeld:false,tapAttackQueued:false,rollQueued:false,joy:{active:false,x:0,y:0,id:null},inventoryOpen:false,inventory:{items:{Fang:0,Essence:0,Rune:0},equipped:'Fang'},armory:{equipped:'Steel Sword',unlocked:{'Steel Sword':true,'Silver Sword':true,'Longsword':false,'Axe':false,'Mace':false}},player:null}; window.__gameState=state;
const audioEngine={ctx:null,unlocked:false,lastPlayed:{},async init(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)()},async unlock(){if(!this.ctx)await this.init();try{if(this.ctx.state==='suspended')await this.ctx.resume()}catch(_){}this.unlocked=true},playClip(n,v,cd=0){const el=sfxNodes[n];if(!el)return false;const now=performance.now();if(cd&&this.lastPlayed[n]&&now-this.lastPlayed[n]<cd)return false;this.lastPlayed[n]=now;try{el.pause();el.currentTime=0;el.volume=v;el.play().catch(()=>{});return true}catch(_){return false}},beep(f,d,t,v){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+d);o.stop(this.ctx.currentTime+d)},sfx(k){if(['steel','silver','axe','mace'].includes(k)){if(!this.playClip('hit',.22,70)&&this.ctx)this.beep(k==='mace'?130:k==='axe'?170:240,.09,k==='steel'?'square':'sawtooth',.04)}else if(k==='loot'){if(!this.playClip('loot',.24,60)&&this.ctx)this.beep(760,.05,'sine',.04)}else if(k==='hurt'){if(!this.playClip('hurt',.22,90)&&this.ctx)this.beep(140,.08,'square',.06)}else if(k==='upgrade'){if(!this.playClip('upgrade',.25,120)&&this.ctx)this.beep(920,.1,'sine',.05)}else if(k==='roll'){if(!this.playClip('roll',.18,90)&&this.ctx)this.beep(480,.06,'triangle',.045)}else if(k==='menuOpen')this.playClip('menuOpen',.2,90);else if(k==='menuClose')this.playClip('menuClose',.18,90);else if(k==='blocked'){if(!this.playClip('blocked',.18,120)&&this.ctx)this.beep(180,.06,'square',.045)}else if(k==='gameOver')this.playClip('gameOver',.28,400)}};
function vibrate(style){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style}})}catch(_){} if(navigator.vibrate)navigator.vibrate(style==='heavy'?28:style==='medium'?18:12)} function rand(a,b){return Math.random()*(b-a)+a} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setState(next){gameState=next;const over=next===GAME_STATES.GAMEOVER;gameOverScreen.style.display=over?'flex':'none';if(over){try{bgm.pause()}catch(_){}audioEngine.sfx('gameOver')}else if(firstInteraction)bgm.play().catch(()=>{})}
function getWeaponButtonMap(){return {'Steel Sword':wpnSteel,'Silver Sword':wpnSilver,'Longsword':wpnLongsword,'Axe':wpnAxe,'Mace':wpnMace}} function formatHeavyButton(){const label=weaponDefs[state.armory.equipped].ui.split(' ');btnHeavy.innerHTML=label.length>1?label[0]+'<br>'+label.slice(1).join(' '):label[0]}
function updateInventoryUI(){inventoryPanel.classList.toggle('open',state.inventoryOpen);btnInv.textContent=state.inventoryOpen?'CLOSE':'GARAGE';const eq=state.inventory.equipped,i=state.inventory.items;invFang.classList.toggle('active',eq==='Fang');invEssence.classList.toggle('active',eq==='Essence');invRune.classList.toggle('active',eq==='Rune');invFang.textContent='LOOSE CASH x'+i.Fang;invEssence.textContent='BRIBE CHIP x'+i.Essence;invRune.textContent='HEAT SPOOFER x'+i.Rune;const map=getWeaponButtonMap();for(const key of Object.keys(map)){const el=map[key],u=!!state.armory.unlocked[key];el.classList.toggle('active',state.armory.equipped===key);el.classList.toggle('locked',!u);el.textContent=weaponDefs[key].ui+(u?'':' (IMPOUNDED)')}formatHeavyButton()}
function getHeroPxSpeed(){return Math.min(cw,ch)*.45*window.gameConfig.heroSpeed} function getAttackProfile(type){const b=weaponDefs[state.armory.equipped][type==='light'?'light':'heavy'];return{dmg:b.dmg+state.lootLevel*(type==='light'?2:3),range:Math.max(b.rangeMin,cw*b.rangeMul),cd:b.cd,offset:b.offset,arc:b.arc,vib:b.vib,style:b.style}}

function initGame(){Object.assign(state,{time:0,wave:1,spawnTimer:.3,kills:0,gold:0,lootLevel:1,shake:0,popups:[],slashes:[],monsters:[],lowHealthWarningCd:0,heavyHeld:false,tapAttackQueued:false,rollQueued:false,inventoryOpen:false});state.feedbackTimers={combo:0,danger:0};state.joy={active:false,x:0,y:0,id:null};state.inventory.items={Fang:0,Essence:0,Rune:0};state.inventory.equipped='Fang';state.armory.equipped='Steel Sword';state.armory.unlocked={'Steel Sword':true,'Silver Sword':true,'Longsword':false,'Axe':false,'Mace':false};state.player={x:clamp(cw*.5,80,cw-80),y:clamp(ch*.56,120,ch-120),r:Math.max(20,Math.min(30,cw*.06)),hp:100,maxHp:100,speedPx:getHeroPxSpeed(),dir:{x:1,y:0},attackTimers:{light:0,heavy:0},roll:{cd:1,t:0,dist:Math.max(86,cw*.26)},invuln:0};for(let i=0;i<4;i++)spawnMonster();setState(GAME_STATES.PLAYING);updateInventoryUI();bgm.volume=.18;bgm.loop=true;if(firstInteraction)bgm.play().catch(()=>{})} function restartGame(){initGame()}

function spawnMonster(){const edge=Math.floor(Math.random()*4);let x=40,y=40;if(edge===0){x=rand(40,Math.max(41,cw-40));y=-40}if(edge===1){x=cw+40;y=rand(40,Math.max(41,ch-40))}if(edge===2){x=rand(40,Math.max(41,cw-40));y=ch+40}if(edge===3){x=-40;y=rand(40,Math.max(41,ch-40))}const kind=chooseMonsterKind(),def=monsterDefs[kind],hp=Math.floor(rand(28,40)*(1+state.wave*.18)*def.hpMul),rr=rand(20,30)*def.rMul;state.monsters.push({x,y,r:rr,hp,maxHp:hp,spd:(rand(85,125)+state.wave*6)*def.spdMul,hitCd:rand(.6,1.1),hitT:0,flash:0,driftSeed:rand(0,10),burstT:rand(.5,1.2),zigSide:Math.random()>.5?1:-1,kind})}
function inventoryAttackBonus(type){const eq=state.inventory.equipped;if(eq==='Fang')return type==='light'?4:2;if(eq==='Essence')return type==='heavy'?7:2;if(eq==='Rune')return 5;return 0}
function doAttack(type){const p=state.player,prof=getAttackProfile(type);if(p.attackTimers[type]>0)return;p.attackTimers[type]=prof.cd;const cx=p.x+p.dir.x*prof.offset,cy=p.y+p.dir.y*prof.offset;state.slashes.push({x:cx,y:cy,life:.14,max:.14,range:prof.range,type:prof.style});const base=prof.dmg+inventoryAttackBonus(type);let hits=0;for(const m of state.monsters){const dx=m.x-p.x,dy=m.y-p.y,dist=Math.hypot(dx,dy);if(dist<=prof.range+m.r){const dot=(dx*p.dir.x+dy*p.dir.y)/Math.max(1,dist);if(dot>prof.arc){const dmg=Math.floor(base*rand(.85,1.18));m.hp-=dmg;m.flash=.12;state.popups.push({x:m.x,y:m.y-10,text:'-'+dmg,color:'#ffb5b5',life:.6});hits++}}}if(hits>0){audioEngine.sfx(prof.style);triggerFeedback('combo',type==='heavy'?.85:.55);if(type==='heavy')state.shake=Math.max(7,state.shake);vibrate(prof.vib)}else audioEngine.beep(type==='light'?500:300,.04,'triangle',.03)}
function doRoll(){const p=state.player;if(!p||p.roll.t>0)return;p.roll.t=p.roll.cd;const mag=Math.hypot(p.dir.x,p.dir.y)||1,nx=p.dir.x/mag,ny=p.dir.y/mag;p.x=clamp(p.x+nx*p.roll.dist,p.r,cw-p.r);p.y=clamp(p.y+ny*p.roll.dist,p.r,ch-p.r);p.invuln=Math.max(p.invuln,.24);state.slashes.push({x:p.x,y:p.y,life:.11,max:.11,range:p.roll.dist*.45,type:'roll'});state.popups.push({x:p.x,y:p.y-22,text:'BOOST',color:'#baf8ff',life:.45});audioEngine.sfx('roll');vibrate('medium')}
function maybeUnlockWeapon(){const thresholds={Longsword:10,Axe:20,Mace:32};for(const w of ['Longsword','Axe','Mace'])if(!state.armory.unlocked[w]&&state.kills>=thresholds[w]){state.armory.unlocked[w]=true;state.popups.push({x:state.player.x,y:state.player.y-34,text:'GARAGE UNLOCK '+weaponDefs[w].ui,color:'#ffe08a',life:1.05});audioEngine.sfx('upgrade');vibrate('medium')}}
function dropLoot(m){const r=Math.random();let name='Fang';if(r>.85)name='Rune';else if(r>.55)name='Essence';state.inventory.items[name]++;state.popups.push({x:m.x,y:m.y-28,text:'+'+(name==='Fang'?'Loose Cash':name==='Essence'?'Bribe Chip':'Heat Spoofer'),color:'#85ffae',life:.8});const i=state.inventory.items;state.inventory.equipped=i.Rune>0?'Rune':i.Essence>0?'Essence':'Fang';maybeUnlockWeapon();updateInventoryUI()}
function killMonster(i){const m=state.monsters[i],def=monsterDefs[m.kind]||monsterDefs.ghoul,gain=Math.floor((rand(6,12)+state.wave*1.5)*def.worthMul);state.gold+=gain;state.kills++;state.popups.push({x:m.x,y:m.y-16,text:'+$'+gain,color:'#ffe08a',life:.8});dropLoot(m);audioEngine.sfx('loot');vibrate('light');state.monsters.splice(i,1);const nl=1+Math.floor(state.gold/80);if(nl>state.lootLevel){state.lootLevel=nl;state.player.maxHp+=5;state.player.hp=Math.min(state.player.maxHp,state.player.hp+12);state.popups.push({x:state.player.x,y:state.player.y-24,text:'STREET REP UP!',color:'#7cff9b',life:1.1});audioEngine.sfx('upgrade')}}
function drawFloor(){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#111827');g.addColorStop(.55,'#0b1020');g.addColorStop(1,'#070911');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);const glow=ctx.createRadialGradient(cw*.5,ch*.34,15,cw*.5,ch*.34,Math.max(cw,ch)*.7);glow.addColorStop(0,'rgba(255,73,109,.18)');glow.addColorStop(.42,'rgba(64,217,255,.12)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.globalAlpha=.55;for(let x=-80;x<cw+120;x+=82){ctx.fillStyle=x%164?'#151c2d':'#111827';ctx.fillRect(x+(state.time*18%82),0,50,ch);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.moveTo(x+(state.time*18%82)+55,0);ctx.lineTo(x+(state.time*18%82)+55,ch);ctx.stroke()}for(let y=-60;y<ch+90;y+=94){ctx.fillStyle='#0d1424';ctx.fillRect(0,y+(state.time*24%94),cw,38);ctx.strokeStyle='rgba(255,215,94,.18)';ctx.setLineDash([18,14]);ctx.beginPath();ctx.moveTo(0,y+(state.time*24%94)+19);ctx.lineTo(cw,y+(state.time*24%94)+19);ctx.stroke();ctx.setLineDash([])}ctx.restore();for(let i=0;i<18;i++){const x=(i*47+Math.sin(state.time+i)*12)%cw,y=(i*113+state.time*(12+i%3*8))%(ch+60)-30;ctx.fillStyle=i%3?'rgba(64,217,255,.28)':'rgba(255,73,109,.28)';ctx.fillRect(x,y,18+(i%4)*5,4)}ctx.fillStyle='rgba(0,0,0,.28)';for(let i=0;i<9;i++){const side=i%2?cw-26:12,w=14+(i%3)*8,h=46+(i%4)*18,y=(i*79+state.time*10)%(ch+80)-40;ctx.fillRect(side,y,w,h);ctx.fillStyle=i%2?'rgba(255,73,109,.22)':'rgba(64,217,255,.22)';ctx.fillRect(side+2,y+8,w-4,5);ctx.fillStyle='rgba(0,0,0,.28)'}}
function updateHud(){const p=state.player,i=state.inventory.items,rollReady=p.roll.t<=0?'READY':p.roll.t.toFixed(1)+'s';statsLeft.innerHTML='Integrity: <span style="color:'+(p.hp<35?'#ff6a6a':'#8dffad')+'">'+p.hp+'/'+p.maxHp+'</span><br>Heat: '+state.wave+'★<br>Cops Shaken: '+state.kills;statsRight.innerHTML='Cash: <span style="color:#ffe08a">$'+state.gold+'</span><br>Rep: '+state.lootLevel+' | Rig: '+weaponDefs[state.armory.equipped].ui+'<br><span id="inventory-line">Mods C:'+i.Fang+' B:'+i.Essence+' S:'+i.Rune+' | Boost '+rollReady+'</span>';btnRoll.style.opacity=p.roll.t<=0?'1':'.6'}
function updateMonsterMotion(m,p,dt){const def=monsterDefs[m.kind]||monsterDefs.ghoul,dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||.001;let nx=dx/d,ny=dy/d,sm=1;if(def.behavior==='charger'){m.burstT-=dt;if(m.burstT<=0)m.burstT=rand(.5,1.2);sm=m.burstT<.2?1.75:1}else if(def.behavior==='drifter'){const ox=-ny,oy=nx;nx=clamp(nx*.75+ox*.45*Math.sin(state.time*3+m.driftSeed),-1,1);ny=clamp(ny*.75+oy*.45*Math.sin(state.time*2.6+m.driftSeed),-1,1)}else if(def.behavior==='zig'){const ox=-ny*m.zigSide,oy=nx*m.zigSide;nx=clamp(nx+ox*.42*Math.sin(state.time*5+m.driftSeed),-1,1);ny=clamp(ny+oy*.42*Math.sin(state.time*5+m.driftSeed),-1,1)}else if(def.behavior==='tank')sm=.86;m.x+=nx*m.spd*sm*dt;m.y+=ny*m.spd*sm*dt;return d}
function refreshFeedbackLayer(dt){state.feedbackTimers.combo=Math.max(0,state.feedbackTimers.combo-dt);state.feedbackTimers.danger=Math.max(0,state.feedbackTimers.danger-dt);setGifState(comboGif,state.feedbackTimers.combo>0);setGifState(dangerGif,state.feedbackTimers.danger>0)}
function update(dt){if(gameState!==GAME_STATES.PLAYING)return;const p=state.player;if(!p)return;state.time+=dt;state.wave=1+Math.floor(state.time/22);p.speedPx=getHeroPxSpeed();p.attackTimers.light=Math.max(0,p.attackTimers.light-dt);p.attackTimers.heavy=Math.max(0,p.attackTimers.heavy-dt);p.roll.t=Math.max(0,p.roll.t-dt);p.invuln=Math.max(0,p.invuln-dt);state.lowHealthWarningCd=Math.max(0,state.lowHealthWarningCd-dt);const mag=Math.hypot(state.joy.x,state.joy.y);if(mag>.05){const nx=state.joy.x/mag,ny=state.joy.y/mag;p.dir.x=nx;p.dir.y=ny;p.x+=nx*p.speedPx*Math.min(1,mag)*dt;p.y+=ny*p.speedPx*Math.min(1,mag)*dt}p.x=clamp(p.x,p.r,cw-p.r);p.y=clamp(p.y,p.r,ch-p.r);if(state.rollQueued){doRoll();state.rollQueued=false}if(state.tapAttackQueued){doAttack('light');state.tapAttackQueued=false}if(state.heavyHeld)doAttack('heavy');state.spawnTimer-=dt;if(state.spawnTimer<=0){spawnMonster();const base=1.12-Math.min(.8,state.wave*.055);state.spawnTimer=Math.max(.2,rand(base*.72,base*1.16))}for(let i=state.monsters.length-1;i>=0;i--){const m=state.monsters[i],def=monsterDefs[m.kind]||monsterDefs.ghoul;m.flash=Math.max(0,m.flash-dt);m.hitT=Math.max(0,m.hitT-dt);const d=updateMonsterMotion(m,p,dt);if(d<p.r+m.r-4&&m.hitT<=0){m.hitT=m.hitCd;if(p.invuln<=0){const hurt=Math.floor((rand(6,11)+state.wave*.7)*def.damageMul);p.hp-=hurt;p.invuln=.22;state.popups.push({x:p.x,y:p.y-16,text:'-'+hurt,color:'#ff6a6a',life:.65});state.shake=Math.max(state.shake,5);triggerFeedback('danger',1.1);audioEngine.sfx('hurt');vibrate('medium');if(p.hp>0&&p.hp/p.maxHp<.35&&state.lowHealthWarningCd<=0){state.lowHealthWarningCd=4;triggerFeedback('danger',1.6)}if(p.hp<=0){p.hp=0;gameOverText.innerHTML='Busted on the boulevard.<br>Cops shaken: <b>'+state.kills+'</b> | Cash stashed: <b>$'+state.gold+'</b><br>Rig: '+weaponDefs[state.armory.equipped].ui+' | Mods: Cash '+state.inventory.items.Fang+', Bribes '+state.inventory.items.Essence+', Spoofers '+state.inventory.items.Rune;setState(GAME_STATES.GAMEOVER);vibrate('heavy')}}}if(m.hp<=0)killMonster(i)}for(let i=state.popups.length-1;i>=0;i--){const pop=state.popups[i];pop.life-=dt;pop.y-=26*dt;if(pop.life<=0)state.popups.splice(i,1)}for(let i=state.slashes.length-1;i>=0;i--){state.slashes[i].life-=dt;if(state.slashes[i].life<=0)state.slashes.splice(i,1)}state.shake=Math.max(0,state.shake-22*dt);refreshFeedbackLayer(dt);updateHud()}
function renderSlash(s){const t=s.life/s.max;ctx.strokeStyle=s.type==='roll'?'rgba(64,217,255,'+.8*t+')':s.type==='axe'?'rgba(255,156,64,'+.78*t+')':s.type==='mace'?'rgba(180,240,255,'+.76*t+')':s.type==='steel'?'rgba(255,255,255,'+.62*t+')':'rgba(255,215,94,'+.72*t+')';ctx.lineWidth=s.type==='mace'?11:s.type==='axe'?10:s.type==='roll'?7:8;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(0,s.range*.38),-.8,.8);ctx.stroke()}
function drawCar(p,rot){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot);ctx.fillStyle='rgba(255,215,94,.18)';ctx.beginPath();ctx.arc(0,0,p.r*1.52,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff496d';roundRect(-p.r*.74,-p.r*1.18,p.r*1.48,p.r*2.15,p.r*.22);ctx.fill();ctx.fillStyle='#ffd75e';roundRect(-p.r*.48,-p.r*.85,p.r*.96,p.r*.72,p.r*.12);ctx.fill();ctx.fillStyle='#07101c';ctx.fillRect(-p.r*.56,-p.r*.08,p.r*1.12,p.r*.42);ctx.fillStyle='#40d9ff';ctx.fillRect(-p.r*.62,p.r*.66,p.r*.32,p.r*.2);ctx.fillRect(p.r*.3,p.r*.66,p.r*.32,p.r*.2);ctx.fillStyle='#111';ctx.fillRect(-p.r*.9,-p.r*.65,p.r*.22,p.r*.5);ctx.fillRect(p.r*.68,-p.r*.65,p.r*.22,p.r*.5);ctx.fillRect(-p.r*.9,p.r*.38,p.r*.22,p.r*.5);ctx.fillRect(p.r*.68,p.r*.38,p.r*.22,p.r*.5);if(p.invuln>0){ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r*1.28,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function renderMonster(m,p){const def=monsterDefs[m.kind]||monsterDefs.ghoul,rot=p?Math.atan2(p.y-m.y,p.x-m.x)+Math.PI/2:0,pulse=.9+Math.sin(state.time*4+m.driftSeed)*.08;ctx.save();ctx.globalAlpha=.25;ctx.fillStyle=def.behavior==='tank'?'rgba(255,73,109,.34)':def.behavior==='drifter'?'rgba(182,107,255,.3)':'rgba(42,84,255,.28)';ctx.beginPath();ctx.arc(m.x,m.y,m.r*1.35*pulse,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(m.x,m.y);ctx.rotate(rot);ctx.fillStyle=m.flash>0?'#fff':def.color;roundRect(-m.r*.78,-m.r*1.12,m.r*1.56,m.r*2.05,m.r*.2);ctx.fill();ctx.fillStyle=def.behavior==='tank'?'#111':'#dfefff';ctx.fillRect(-m.r*.5,-m.r*.82,m.r, m.r*.42);ctx.fillStyle=state.time%0.4<.2?'#ff496d':'#2a54ff';ctx.fillRect(-m.r*.6,m.r*.55,m.r*.45,m.r*.18);ctx.fillStyle=state.time%0.4<.2?'#2a54ff':'#ff496d';ctx.fillRect(m.r*.15,m.r*.55,m.r*.45,m.r*.18);ctx.restore();ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(m.x-20,m.y-m.r-16,40,5);ctx.fillStyle='#ff6d6d';ctx.fillRect(m.x-20,m.y-m.r-16,40*(m.hp/m.maxHp),5)}
function render(){ctx.clearRect(0,0,cw,ch);let sx=0,sy=0;if(state.shake>0){sx=rand(-state.shake,state.shake);sy=rand(-state.shake,state.shake)}ctx.save();ctx.translate(sx,sy);drawFloor();for(const s of state.slashes)renderSlash(s);const p=state.player;if(p){const prot=Math.atan2(p.dir.y,p.dir.x)+Math.PI/2;ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='rgba(64,217,255,.34)';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.42+Math.sin(state.time*6)*.06),0,Math.PI*2);ctx.fill();ctx.restore();drawCar(p,prot)}for(const m of state.monsters)renderMonster(m,p);for(const pop of state.popups){ctx.globalAlpha=clamp(pop.life/.8,0,1);ctx.fillStyle=pop.color;ctx.font='700 20px "Russo One"';ctx.textAlign='center';ctx.fillText(pop.text,pop.x,pop.y);ctx.globalAlpha=1}ctx.restore()}
function routePrimaryInput(action,e){unlockAudio();if(e)e.preventDefault();if(gameState===GAME_STATES.PLAYING){if(action==='tapAttack')state.tapAttackQueued=true;else if(action==='roll')state.rollQueued=true;else if(action==='toggleInventory'){state.inventoryOpen=!state.inventoryOpen;audioEngine.sfx(state.inventoryOpen?'menuOpen':'menuClose');updateInventoryUI()}else if(action==='equipFang'){state.inventory.equipped='Fang';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action==='equipEssence'&&state.inventory.items.Essence>0){state.inventory.equipped='Essence';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action==='equipRune'&&state.inventory.items.Rune>0){state.inventory.equipped='Rune';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action.indexOf('weapon:')===0){const w=action.slice(7);if(state.armory.unlocked[w]){state.armory.equipped=w;state.popups.push({x:state.player.x,y:state.player.y-20,text:weaponDefs[w].ui,color:'#ffe6bb',life:.55});audioEngine.sfx('menuOpen');updateInventoryUI()}else audioEngine.sfx('blocked')}}else if(gameState===GAME_STATES.GAMEOVER)restartGame()}
function unlockAudio(){if(!firstInteraction)firstInteraction=true;audioEngine.unlock().catch(()=>{});bgm.play().catch(()=>{})}
function joyMove(clientX,clientY){const rect=joystick.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2;let dx=clientX-rect.left-cx,dy=clientY-rect.top-cy;const max=42,d=Math.hypot(dx,dy)||.001;if(d>max){dx=dx/d*max;dy=dy/d*max}stick.style.left=(cx-29+dx)+'px';stick.style.top=(cy-29+dy)+'px';state.joy.x=dx/max;state.joy.y=dy/max}function joyReset(){state.joy.active=false;state.joy.id=null;state.joy.x=0;state.joy.y=0;stick.style.left='37px';stick.style.top='37px'}
function resize(rect){cw=Math.max(1,rect.width);ch=Math.max(1,rect.height);dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));canvas.style.width=cw+'px';canvas.style.height=ch+'px';canvas.width=Math.floor(cw*dpr);canvas.height=Math.floor(ch*dpr);canvasRect={left:0,top:0,width:cw,height:ch};ctx.setTransform(dpr,0,0,dpr,0,0)}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();state.joy.active=true;state.joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);joyMove(e.clientX,e.clientY)},{passive:false});joystick.addEventListener('pointermove',e=>{e.preventDefault();if(state.joy.active&&e.pointerId===state.joy.id)joyMove(e.clientX,e.clientY)},{passive:false});joystick.addEventListener('pointerup',e=>{e.preventDefault();if(e.pointerId===state.joy.id)joyReset()},{passive:false});joystick.addEventListener('pointercancel',e=>{e.preventDefault();joyReset()},{passive:false});btnHeavy.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();state.heavyHeld=true;btnHeavy.style.transform='scale(.95)'},{passive:false});function heavyUp(e){if(e)e.preventDefault();state.heavyHeld=false;btnHeavy.style.transform='scale(1)'}btnHeavy.addEventListener('pointerup',heavyUp,{passive:false});btnHeavy.addEventListener('pointercancel',heavyUp,{passive:false});btnRoll.addEventListener('pointerdown',e=>{btnRoll.style.transform='scale(.95)';routePrimaryInput('roll',e)},{passive:false});function rollUp(e){if(e)e.preventDefault();btnRoll.style.transform='scale(1)'}btnRoll.addEventListener('pointerup',rollUp,{passive:false});btnRoll.addEventListener('pointercancel',rollUp,{passive:false});btnInv.addEventListener('pointerdown',e=>routePrimaryInput('toggleInventory',e),{passive:false});invFang.addEventListener('pointerdown',e=>routePrimaryInput('equipFang',e),{passive:false});invEssence.addEventListener('pointerdown',e=>routePrimaryInput('equipEssence',e),{passive:false});invRune.addEventListener('pointerdown',e=>routePrimaryInput('equipRune',e),{passive:false});wpnSteel.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Steel Sword',e),{passive:false});wpnSilver.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Silver Sword',e),{passive:false});wpnLongsword.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Longsword',e),{passive:false});wpnAxe.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Axe',e),{passive:false});wpnMace.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Mace',e),{passive:false});canvas.addEventListener('pointerdown',e=>{const x=e.clientX-canvasRect.left,y=e.clientY-canvasRect.top;if(x>=0&&x<=cw&&y>=0&&y<=ch)routePrimaryInput('tapAttack',e)},{passive:false});canvas.addEventListener('pointermove',e=>e.preventDefault(),{passive:false});canvas.addEventListener('pointerup',e=>e.preventDefault(),{passive:false});canvas.addEventListener('pointercancel',e=>e.preventDefault(),{passive:false});restartBtn.addEventListener('click',e=>routePrimaryInput('restart',e));restartBtn.addEventListener('pointerdown',e=>routePrimaryInput('restart',e),{passive:false});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlockAudio();state.heavyHeld=true}else if(e.code==='ShiftLeft'||e.code==='ShiftRight'){e.preventDefault();routePrimaryInput('roll',e)}else if(e.code==='KeyI'){e.preventDefault();routePrimaryInput('toggleInventory',e)}});window.addEventListener('keyup',e=>{if(e.code==='Space')state.heavyHeld=false});let last=performance.now();function gameLoop(now){try{const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render()}catch(err){console.error(err);render()}requestAnimationFrame(gameLoop)}const observer=new ResizeObserver(entries=>{const entry=entries[0];if(!entry)return;resize(entry.contentRect);if(!initialized){initialized=true;initGame();audioEngine.init().catch(()=>{})}});observer.observe(document.getElementById('game-container'));requestAnimationFrame(gameLoop);
});
