<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>Relic Sweep: Vault Breakout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- [agent-note][stage3] resolved-font: title=Audiowide | ui=Exo 2 via catalogs/fonts.json -->
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg0:#060816; --bg1:#12172e; --bg2:#1e1138; --panel:rgba(16,22,40,.78); --panel-b:rgba(118,138,255,.36);
      --text:#eef5ff; --accent:#7cf6ff; --accent-2:#8f7bff; --accent-warm:#ffcf74; --danger:#ff6a8f; --good:#7cffc9;
      --shadow:rgba(0,0,0,.38);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body{
      background:
        radial-gradient(circle at 50% 18%, rgba(124,246,255,.18), transparent 26%),
        radial-gradient(circle at 80% 0%, rgba(143,123,255,.2), transparent 30%),
        radial-gradient(circle at 30% 20%, var(--bg1), var(--bg0) 70%);
      color:var(--text); font-family:'Exo 2', sans-serif;
    }
    #game-container{position:fixed;inset:0}
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    #ui-layer{position:fixed;inset:0;pointer-events:none}
    #hud{
      position:absolute;
      left:max(10px, env(safe-area-inset-left));
      right:max(10px, env(safe-area-inset-right));
      top:max(10px, env(safe-area-inset-top));
      display:flex;justify-content:space-between;gap:8px;z-index:5;
      text-shadow:0 2px 10px rgba(0,0,0,.62);font-size:12px;font-weight:700;
    }
    .panel{
      background:
        linear-gradient(180deg, rgba(20,27,48,.92), rgba(9,14,28,.88)),
        var(--panel);
      border:1px solid var(--panel-b); border-radius:14px; padding:8px 10px; backdrop-filter:blur(5px);
      min-width:140px;
      box-shadow:0 10px 24px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04);
    }
    #inventory-line{color:#cce8ff}
    /* [agent-note][stage4] repaired: mobile-safe-area | elements: hud, controls, inventory, game-over | action: inset interactive UI away from notches/home indicator */
    #controls{
      position:absolute;
      inset:max(env(safe-area-inset-top), 0px) max(env(safe-area-inset-right), 0px) max(env(safe-area-inset-bottom), 0px) max(env(safe-area-inset-left), 0px);
      z-index:6
    }
    #joystick{
      position:absolute;left:18px;bottom:18px;width:132px;height:132px;border-radius:50%;
      border:2px solid rgba(124,246,255,.28);
      background:
        radial-gradient(circle at 50% 50%, rgba(124,246,255,.12), rgba(255,255,255,.04) 58%, rgba(255,255,255,.02) 70%);
      box-shadow:inset 0 0 24px rgba(124,246,255,.12), 0 0 18px rgba(4,10,24,.4);
      pointer-events:auto;touch-action:none;
    }
    #stick{
      position:absolute;left:37px;top:37px;width:58px;height:58px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #fff6c9, var(--accent-warm) 35%, #7a52ff 100%);
      border:2px solid rgba(255,240,200,.7);
      box-shadow:0 0 14px rgba(143,123,255,.35);
    }
    #btnHeavy{
      position:absolute;right:20px;bottom:34px;width:90px;height:90px;border-radius:50%;
      border:2px solid rgba(255,246,209,.45);background:radial-gradient(circle at 35% 28%, #fff6cf, #ffcf74 34%, #ff7f6b 72%, #6319a6 100%);
      color:#14091d;font-size:12px;font-weight:900;line-height:1.02;display:grid;place-items:center;text-align:center;
      pointer-events:auto;touch-action:none;user-select:none;padding:0 8px;
      font-family:'Audiowide', sans-serif; letter-spacing:.5px;
      box-shadow:0 0 18px rgba(255,127,107,.28), inset 0 -8px 16px rgba(0,0,0,.18);
    }
    #btnRoll{
      position:absolute;right:120px;bottom:56px;width:76px;height:76px;border-radius:50%;
      border:2px solid rgba(120,240,255,.45);background:radial-gradient(circle at 35% 30%, #d8ffff, #7cf6ff 34%, #3568d8 82%);
      color:#051019;font-size:13px;font-weight:900;line-height:1.1;display:grid;place-items:center;
      pointer-events:auto;touch-action:none;user-select:none;
      font-family:'Audiowide', sans-serif;
      box-shadow:0 0 14px rgba(124,246,255,.28), inset 0 -6px 12px rgba(0,0,0,.16);
    }
    #btnInv{
      position:absolute;right:16px;top:74px;min-width:108px;height:46px;border-radius:12px;
      border:1px solid rgba(124,246,255,.28);background:linear-gradient(180deg, rgba(20,27,48,.94), rgba(9,14,28,.9));color:#dff7ff;font-size:13px;font-weight:800;
      pointer-events:auto;touch-action:none;user-select:none;padding:0 10px;
      font-family:'Audiowide', sans-serif; letter-spacing:.5px;
      box-shadow:0 10px 18px rgba(0,0,0,.24);
    }
    #inventory-panel{
      position:absolute;
      left:max(10px, env(safe-area-inset-left));
      right:max(10px, env(safe-area-inset-right));
      top:calc(max(10px, env(safe-area-inset-top)) + 118px);
      z-index:8;pointer-events:auto;display:none;
      border:1px solid rgba(143,123,255,.34);border-radius:16px;background:linear-gradient(180deg, rgba(9,14,28,.96), rgba(20,14,42,.95));backdrop-filter:blur(6px);
      box-shadow:0 14px 34px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.03);padding:10px;
    }
    #inventory-panel.open{display:block}
    #inventory-title{font-size:14px;font-weight:900;color:#ffe0a5;letter-spacing:.8px;margin-bottom:8px;font-family:'Audiowide', sans-serif}
    .inv-row{display:flex;gap:8px;flex-wrap:wrap}
    .inv-item{
      flex:1;min-height:46px;border-radius:12px;border:1px solid rgba(124,246,255,.18);background:linear-gradient(180deg, #16223a, #11192d);color:#dbe6f3;
      font-size:13px;font-weight:800;pointer-events:auto;min-width:92px;
      font-family:'Exo 2', sans-serif; letter-spacing:.5px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    }
    .inv-item.active{border-color:var(--accent-warm);background:linear-gradient(180deg, rgba(73,47,13,.96), rgba(38,24,8,.94));color:#ffe6bb;box-shadow:0 0 14px rgba(255,207,116,.16)}
    .inv-item.locked{opacity:.5}
    #game-over-screen{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:10;
      background:rgba(5,8,12,.52);
    }
    #game-over-panel{
      width:min(calc(100vw - max(24px, env(safe-area-inset-left) + env(safe-area-inset-right) + 24px)),420px);
      border:1px solid rgba(124,246,255,.25);border-radius:16px;
      padding:16px 16px calc(16px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(10,14,18,.94), rgba(22,13,37,.92));text-align:center;
      box-shadow:0 14px 36px rgba(0,0,0,.45);
    }
    #restart-btn{
      margin-top:12px;width:100%;height:48px;border-radius:12px;border:1px solid rgba(124,246,255,.24);background:linear-gradient(180deg, #202f44, #162132);color:#ecf0f1;
      font-size:16px;font-weight:800;pointer-events:auto;
      font-family:'Audiowide', sans-serif; letter-spacing:.5px;
    }
    #restart-btn:active{transform:scale(.98)}
    #hud strong, #game-over-text b{color:var(--accent-warm)}
    #feedback-layer{
      position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden;
    }
    .feedback-gif{
      position:absolute;opacity:0;transform:translate(-50%, -50%) scale(.78);
      transition:opacity .18s ease, transform .18s ease;
      max-width:min(30vw, 132px);max-height:min(24vw, 110px);
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
      border-radius:12px;
    }
    .feedback-gif.active{opacity:.92;transform:translate(-50%, -50%) scale(1)}
    #combo-gif{left:76%;bottom:150px}
    #danger-gif{left:50%;top:26%}
    @media (max-width: 640px){
      .feedback-gif{max-width:92px;max-height:76px}
      #combo-gif{left:72%;bottom:152px}
      #danger-gif{top:22%}
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" aria-label="Arcade relic survival game"></canvas>

    <img id="hunter-img" data-editable="true" data-label="Runner Sprite" alt="" crossorigin="anonymous"
      src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/player_idle.png" style="display:none" />
    <img id="ghoul-img" data-editable="true" data-label="Slime Sprite" alt="" crossorigin="anonymous"
      src="https://gamezone-virid.vercel.app/assets/images/sprites/platformer/slime.png" style="display:none" />

    <!-- [agent-note][stage3] resolved-audio: bgm+sfx mapped from catalogs/audios.json -->
    <audio id="bgm-main" data-editable="true" data-label="Main BGM" preload="auto" loop
      src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3"></audio>
    <audio id="sfx-hit" data-editable="true" data-label="Hit SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3"></audio>
    <audio id="sfx-loot" data-editable="true" data-label="Loot SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3"></audio>
    <audio id="sfx-hurt" data-editable="true" data-label="Hurt SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3"></audio>
    <audio id="sfx-roll" data-editable="true" data-label="Dash SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3"></audio>
    <audio id="sfx-upgrade" data-editable="true" data-label="Upgrade SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/sfx/powerup_02.mp3"></audio>
    <audio id="sfx-menu-open" data-editable="true" data-label="Menu Open SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3"></audio>
    <audio id="sfx-menu-close" data-editable="true" data-label="Menu Close SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3"></audio>
    <audio id="sfx-blocked" data-editable="true" data-label="Blocked SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_02.mp3"></audio>
    <audio id="sfx-game-over" data-editable="true" data-label="Game Over SFX" preload="auto"
      src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"></audio>

    <div id="ui-layer">
      <!-- [agent-note][stage3] resolved-gif: combo-hit + danger-warning via catalogs/gifs.json -->
      <div id="feedback-layer" aria-hidden="true">
        <img id="combo-gif" class="feedback-gif" alt=""
          src="https://i.giphy.com/1AjEBGWggGXh9onllB.webp" />
        <img id="danger-gif" class="feedback-gif" alt=""
          src="https://i.giphy.com/MFPZ483I4x41W.webp" />
      </div>
      <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
      <div id="hud">
        <div class="panel" id="stats-left"></div>
        <div class="panel" id="stats-right"></div>
      </div>

      <div id="inventory-panel">
        <div id="inventory-title">LOADOUT - TAP TO ARM</div>
        <div class="inv-row" style="margin-bottom:8px;">
          <button id="inv-fang" class="inv-item">SPARK CHIP</button>
          <button id="inv-essence" class="inv-item">CORE CELL</button>
          <button id="inv-rune" class="inv-item">RELIC CODEX</button>
        </div>
        <div class="inv-row">
          <button id="wpn-steel" class="inv-item">PULSE BATON</button>
          <button id="wpn-silver" class="inv-item">ARC SABER</button>
          <button id="wpn-longsword" class="inv-item">BREACH BLADE</button>
          <button id="wpn-axe" class="inv-item">IMPACT AXE</button>
          <button id="wpn-mace" class="inv-item">GRAV HAMMER</button>
        </div>
      </div>

      <div id="controls">
        <div id="joystick"><div id="stick"></div></div>
        <button id="btnInv">LOADOUT</button>
        <div id="btnRoll">DASH</div>
        <div id="btnHeavy">ARC<br/>SABER</div>
      </div>

      <div id="game-over-screen">
        <div id="game-over-panel">
          <div id="game-over-text"></div>
          <button id="restart-btn">Sweep Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const hunterImg = document.getElementById('hunter-img');
      const ghoulImg = document.getElementById('ghoul-img');
      const bgm = document.getElementById('bgm-main');
      const comboGif = document.getElementById('combo-gif');
      const dangerGif = document.getElementById('danger-gif');
      const sfxNodes = {
        hit: document.getElementById('sfx-hit'),
        loot: document.getElementById('sfx-loot'),
        hurt: document.getElementById('sfx-hurt'),
        roll: document.getElementById('sfx-roll'),
        upgrade: document.getElementById('sfx-upgrade'),
        menuOpen: document.getElementById('sfx-menu-open'),
        menuClose: document.getElementById('sfx-menu-close'),
        blocked: document.getElementById('sfx-blocked'),
        gameOver: document.getElementById('sfx-game-over')
      };

      const statsLeft = document.getElementById('stats-left');
      const statsRight = document.getElementById('stats-right');
      const joystick = document.getElementById('joystick');
      const stick = document.getElementById('stick');
      const btnHeavy = document.getElementById('btnHeavy');
      const btnRoll = document.getElementById('btnRoll');
      const btnInv = document.getElementById('btnInv');
      const inventoryPanel = document.getElementById('inventory-panel');
      const invFang = document.getElementById('inv-fang');
      const invEssence = document.getElementById('inv-essence');
      const invRune = document.getElementById('inv-rune');
      const wpnSteel = document.getElementById('wpn-steel');
      const wpnSilver = document.getElementById('wpn-silver');
      const wpnLongsword = document.getElementById('wpn-longsword');
      const wpnAxe = document.getElementById('wpn-axe');
      const wpnMace = document.getElementById('wpn-mace');
      const gameOverScreen = document.getElementById('game-over-screen');
      const gameOverText = document.getElementById('game-over-text');
      const restartBtn = document.getElementById('restart-btn');

      window.gameConfigDefs = {
        heroSpeed: { type: 'number', min: 2, max: 12, value: 6.8 },
        accentColor: { type: 'color', value: '#d9b25f' },
        titleText: { type: 'text', value: 'Relic Sweep: Vault Breakout' }
      };
      window.gameConfig = {
        heroSpeed: window.gameConfigDefs.heroSpeed.value,
        accentColor: window.gameConfigDefs.accentColor.value,
        titleText: window.gameConfigDefs.titleText.value
      };
      window.updateGameConfig = (key, val) => {
        if (!Object.prototype.hasOwnProperty.call(window.gameConfigDefs, key)) return;
        const def = window.gameConfigDefs[key];
        if (def.type === 'number') {
          const n = Number(val);
          if (!Number.isFinite(n)) return;
          const clamped = Math.max(def.min, Math.min(def.max, n));
          def.value = clamped;
          window.gameConfig[key] = clamped;
        } else if (def.type === 'color') {
          if (!/^#[0-9a-fA-F]{6}$/.test(String(val))) return;
          def.value = String(val);
          window.gameConfig[key] = def.value;
          document.documentElement.style.setProperty('--accent', def.value);
        } else if (def.type === 'text') {
          def.value = String(val);
          window.gameConfig[key] = def.value;
          document.title = def.value;
          document.getElementById('inventory-title').textContent = String(def.value).toUpperCase() + ' - TAP TO ARM';
        }
      };

      const GAME_STATES = { PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER' };
      let gameState = GAME_STATES.PLAYING;
      let initialized = false;
      let firstInteraction = false;
      let cw = 360;
      let ch = 640;
      let dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      let canvasRect = { left: 0, top: 0, width: 360, height: 640 };

      const weaponDefs = {
        'Steel Sword': {
          ui: 'PULSE BATON',
          light: { dmg: 18, rangeMul: 0.24, rangeMin: 68, cd: 0.26, offset: 62, arc: 0.08, vib: 'light', style: 'steel' },
          heavy: { dmg: 30, rangeMul: 0.30, rangeMin: 92, cd: 0.62, offset: 74, arc: -0.04, vib: 'medium', style: 'silver' }
        },
        'Silver Sword': {
          ui: 'ARC SABER',
          light: { dmg: 16, rangeMul: 0.27, rangeMin: 76, cd: 0.24, offset: 64, arc: 0.06, vib: 'light', style: 'steel' },
          heavy: { dmg: 42, rangeMul: 0.36, rangeMin: 110, cd: 0.8, offset: 78, arc: -0.1, vib: 'medium', style: 'silver' }
        },
        'Longsword': {
          ui: 'BREACH BLADE',
          light: { dmg: 22, rangeMul: 0.30, rangeMin: 86, cd: 0.31, offset: 70, arc: 0.02, vib: 'light', style: 'steel' },
          heavy: { dmg: 36, rangeMul: 0.38, rangeMin: 120, cd: 0.9, offset: 82, arc: -0.08, vib: 'medium', style: 'silver' }
        },
        'Axe': {
          ui: 'IMPACT AXE',
          light: { dmg: 26, rangeMul: 0.23, rangeMin: 66, cd: 0.36, offset: 60, arc: -0.02, vib: 'medium', style: 'axe' },
          heavy: { dmg: 56, rangeMul: 0.28, rangeMin: 90, cd: 1.02, offset: 70, arc: -0.18, vib: 'heavy', style: 'axe' }
        },
        'Mace': {
          ui: 'GRAV HAMMER',
          light: { dmg: 24, rangeMul: 0.21, rangeMin: 62, cd: 0.34, offset: 58, arc: -0.04, vib: 'medium', style: 'mace' },
          heavy: { dmg: 52, rangeMul: 0.25, rangeMin: 84, cd: 1.0, offset: 68, arc: -0.2, vib: 'heavy', style: 'mace' }
        }
      };

      const monsterDefs = {
        ghoul: { name: 'Crawler Drone', hpMul: 1.0, spdMul: 1.0, rMul: 1.0, color: 'rgba(95,150,110,0.35)', behavior: 'chase', damageMul: 1.0, worthMul: 1.0 },
        hound: { name: 'Rush Drone', hpMul: 0.75, spdMul: 1.35, rMul: 0.82, color: 'rgba(170,120,95,0.35)', behavior: 'charger', damageMul: 0.85, worthMul: 0.95 },
        wraith: { name: 'Phase Drone', hpMul: 0.92, spdMul: 1.12, rMul: 0.95, color: 'rgba(130,160,230,0.35)', behavior: 'drifter', damageMul: 1.05, worthMul: 1.15 },
        brute: { name: 'Bulwark Drone', hpMul: 1.7, spdMul: 0.72, rMul: 1.24, color: 'rgba(220,120,110,0.4)', behavior: 'tank', damageMul: 1.35, worthMul: 1.35 },
        leech: { name: 'Skitter Drone', hpMul: 0.88, spdMul: 1.08, rMul: 0.9, color: 'rgba(140,210,170,0.32)', behavior: 'zig', damageMul: 0.9, worthMul: 1.0 }
      };

      const state = {
        time: 0,
        wave: 1,
        spawnTimer: 0,
        kills: 0,
        gold: 0,
        lootLevel: 1,
        shake: 0,
        popups: [],
        slashes: [],
        monsters: [],
        feedbackTimers: { combo: 0, danger: 0 },
        lowHealthWarningCd: 0,
        heavyHeld: false,
        tapAttackQueued: false,
        rollQueued: false,
        joy: { active: false, x: 0, y: 0, id: null },
        inventoryOpen: false,
        inventory: {
          items: { Fang: 0, Essence: 0, Rune: 0 },
          equipped: 'Fang'
        },
        armory: {
          equipped: 'Steel Sword',
          unlocked: {
            'Steel Sword': true,
            'Silver Sword': true,
            'Longsword': false,
            'Axe': false,
            'Mace': false
          }
        },
        player: null
      };

      const audioEngine = {
        ctx: null,
        unlocked: false,
        lastPlayed: {},
        async init() {
          if (this.ctx) return;
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        async unlock() {
          if (!this.ctx) await this.init();
          if (this.ctx && this.ctx.state === 'suspended') {
            try { await this.ctx.resume(); } catch (_) {}
          }
          this.unlocked = true;
        },
        playClip(name, volume, cooldown = 0) {
          const el = sfxNodes[name];
          if (!el) return false;
          const now = performance.now();
          if (cooldown && this.lastPlayed[name] && now - this.lastPlayed[name] < cooldown) return false;
          this.lastPlayed[name] = now;
          try {
            el.pause();
            el.currentTime = 0;
            el.volume = volume;
            el.play().catch(() => {});
            return true;
          } catch (_) {
            return false;
          }
        },
        beep(freq, dur, type, vol) {
          if (!this.ctx) return;
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.value = freq;
          g.gain.value = vol;
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          o.stop(this.ctx.currentTime + dur);
        },
        sfx(kind) {
          if (kind === 'steel' || kind === 'silver' || kind === 'axe' || kind === 'mace') {
            if (!this.playClip('hit', kind === 'steel' ? 0.18 : kind === 'silver' ? 0.22 : 0.24, 70) && this.ctx) {
              this.beep(kind === 'mace' ? 130 : kind === 'axe' ? 170 : 240, 0.09, kind === 'steel' ? 'square' : 'sawtooth', 0.04);
            }
          } else if (kind === 'loot') {
            if (!this.playClip('loot', 0.24, 60) && this.ctx) this.beep(760, 0.05, 'sine', 0.04);
          } else if (kind === 'hurt') {
            if (!this.playClip('hurt', 0.22, 90) && this.ctx) this.beep(140, 0.08, 'square', 0.06);
          } else if (kind === 'upgrade') {
            if (!this.playClip('upgrade', 0.25, 120) && this.ctx) this.beep(920, 0.1, 'sine', 0.05);
          } else if (kind === 'roll') {
            if (!this.playClip('roll', 0.18, 90) && this.ctx) this.beep(480, 0.06, 'triangle', 0.045);
          } else if (kind === 'menuOpen') {
            this.playClip('menuOpen', 0.2, 90);
          } else if (kind === 'menuClose') {
            this.playClip('menuClose', 0.18, 90);
          } else if (kind === 'blocked') {
            if (!this.playClip('blocked', 0.18, 120) && this.ctx) this.beep(180, 0.06, 'square', 0.045);
          } else if (kind === 'gameOver') {
            this.playClip('gameOver', 0.28, 400);
          }
        }
      };

      function vibrate(style) {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
          action: 'vibrate',
          requestId: 'h5-' + Date.now(),
          version: '1.0',
          params: { style }
        });
        if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 28 : style === 'medium' ? 18 : 12);
      }

      function rand(a, b) { return Math.random() * (b - a) + a; }
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function setState(next) {
        gameState = next;
        const over = next === GAME_STATES.GAMEOVER;
        gameOverScreen.style.display = over ? 'flex' : 'none';
        if (over) {
          try { bgm.pause(); } catch (_) {}
          audioEngine.sfx('gameOver');
        } else if (firstInteraction) {
          bgm.play().catch(() => {});
        }
      }

      function getWeaponButtonMap() {
        return {
          'Steel Sword': wpnSteel,
          'Silver Sword': wpnSilver,
          'Longsword': wpnLongsword,
          'Axe': wpnAxe,
          'Mace': wpnMace
        };
      }

      function formatHeavyButton() {
        const label = weaponDefs[state.armory.equipped].ui;
        const split = label.split(' ');
        if (split.length > 1) {
          btnHeavy.innerHTML = split[0] + '<br/>' + split.slice(1).join(' ');
        } else {
          btnHeavy.textContent = label;
        }
      }

      function updateInventoryUI() {
        inventoryPanel.classList.toggle('open', state.inventoryOpen);
        btnInv.textContent = state.inventoryOpen ? 'CLOSE KIT' : 'LOADOUT';
        const eq = state.inventory.equipped;
        invFang.classList.toggle('active', eq === 'Fang');
        invEssence.classList.toggle('active', eq === 'Essence');
        invRune.classList.toggle('active', eq === 'Rune');
        const i = state.inventory.items;
        invFang.textContent = 'SPARK CHIP x' + i.Fang;
        invEssence.textContent = 'CORE CELL x' + i.Essence;
        invRune.textContent = 'RELIC CODEX x' + i.Rune;

        const map = getWeaponButtonMap();
        const equippedWeapon = state.armory.equipped;
        const unlocked = state.armory.unlocked;
        const keys = Object.keys(map);
        for (let j = 0; j < keys.length; j++) {
          const key = keys[j];
          const el = map[key];
          const isUnlocked = !!unlocked[key];
          el.classList.toggle('active', equippedWeapon === key);
          el.classList.toggle('locked', !isUnlocked);
          el.textContent = weaponDefs[key].ui + (isUnlocked ? '' : ' (SEALED)');
        }
        formatHeavyButton();
      }

      function getHeroPxSpeed() {
        return Math.min(cw, ch) * 0.45 * window.gameConfig.heroSpeed;
      }

      function getAttackProfile(type) {
        const w = weaponDefs[state.armory.equipped];
        const base = type === 'light' ? w.light : w.heavy;
        return {
          dmg: base.dmg + state.lootLevel * (type === 'light' ? 2 : 3),
          range: Math.max(base.rangeMin, cw * base.rangeMul),
          cd: base.cd,
          offset: base.offset,
          arc: base.arc,
          vib: base.vib,
          style: base.style
        };
      }

      function setGifState(el, active) {
        if (!el) return;
        el.classList.toggle('active', !!active);
      }

      function triggerFeedback(kind, duration = 0.9) {
        state.feedbackTimers[kind] = Math.max(state.feedbackTimers[kind] || 0, duration);
      }

      function initGame() {
        state.time = 0;
        state.wave = 1;
        state.spawnTimer = 0.3;
        state.kills = 0;
        state.gold = 0;
        state.lootLevel = 1;
        state.shake = 0;
        state.popups = [];
        state.slashes = [];
        state.monsters = [];
        state.feedbackTimers.combo = 0;
        state.feedbackTimers.danger = 0;
        state.lowHealthWarningCd = 0;
        state.heavyHeld = false;
        state.tapAttackQueued = false;
        state.rollQueued = false;
        state.inventoryOpen = false;
        state.joy.active = false;
        state.joy.x = 0;
        state.joy.y = 0;
        state.inventory.items = { Fang: 0, Essence: 0, Rune: 0 };
        state.inventory.equipped = 'Fang';
        state.armory.equipped = 'Steel Sword';
        state.armory.unlocked = {
          'Steel Sword': true,
          'Silver Sword': true,
          'Longsword': false,
          'Axe': false,
          'Mace': false
        };

        const px = Math.max(80, Math.min(cw - 80, cw * 0.5));
        const py = Math.max(120, Math.min(ch - 120, ch * 0.56));
        state.player = {
          x: px,
          y: py,
          r: Math.max(20, Math.min(30, cw * 0.06)),
          hp: 100,
          maxHp: 100,
          speedPx: getHeroPxSpeed(),
          dir: { x: 1, y: 0 },
          attackTimers: { light: 0, heavy: 0 },
          roll: { cd: 1.0, t: 0, dist: Math.max(86, cw * 0.26) },
          invuln: 0
        };

        for (let i = 0; i < 4; i++) spawnMonster();
        setState(GAME_STATES.PLAYING);
        updateInventoryUI();

        bgm.volume = 0.2;
        bgm.loop = true;
        if (firstInteraction) bgm.play().catch(() => {});
      }

      function restartGame() {
        initGame();
      }

      function chooseMonsterKind() {
        const w = state.wave;
        const roll = Math.random();
        if (w < 3) return roll < 0.7 ? 'ghoul' : 'hound';
        if (w < 6) {
          if (roll < 0.45) return 'ghoul';
          if (roll < 0.7) return 'hound';
          if (roll < 0.9) return 'wraith';
          return 'leech';
        }
        if (roll < 0.25) return 'ghoul';
        if (roll < 0.45) return 'hound';
        if (roll < 0.65) return 'wraith';
        if (roll < 0.84) return 'leech';
        return 'brute';
      }

      function spawnMonster() {
        const edge = Math.floor(Math.random() * 4);
        let x = 40, y = 40;
        if (edge === 0) { x = rand(40, Math.max(41, cw - 40)); y = -40; }
        if (edge === 1) { x = cw + 40; y = rand(40, Math.max(41, ch - 40)); }
        if (edge === 2) { x = rand(40, Math.max(41, cw - 40)); y = ch + 40; }
        if (edge === 3) { x = -40; y = rand(40, Math.max(41, ch - 40)); }

        const kind = chooseMonsterKind();
        const def = monsterDefs[kind];
        const hpScale = 1 + state.wave * 0.18;
        const hp = Math.floor(rand(28, 40) * hpScale * def.hpMul);
        const r = rand(20, 30) * def.rMul;
        state.monsters.push({
          x, y,
          r,
          hp: hp,
          maxHp: hp,
          spd: (rand(85, 125) + state.wave * 6) * def.spdMul,
          hitCd: rand(0.6, 1.1),
          hitT: 0,
          flash: 0,
          driftSeed: rand(0, 10),
          burstT: rand(0.5, 1.2),
          zigSide: Math.random() > 0.5 ? 1 : -1,
          kind
        });
      }

      function inventoryAttackBonus(type) {
        const eq = state.inventory.equipped;
        if (eq === 'Fang') return type === 'light' ? 4 : 2;
        if (eq === 'Essence') return type === 'heavy' ? 7 : 2;
        if (eq === 'Rune') return 5;
        return 0;
      }

      function doAttack(type) {
        const p = state.player;
        const profile = getAttackProfile(type);
        if (p.attackTimers[type] > 0) return;
        p.attackTimers[type] = profile.cd;

        const dir = p.dir;
        const cx = p.x + dir.x * profile.offset;
        const cy = p.y + dir.y * profile.offset;
        state.slashes.push({ x: cx, y: cy, life: 0.14, max: 0.14, range: profile.range, type: profile.style });

        const base = profile.dmg + inventoryAttackBonus(type);
        let hitCount = 0;
        for (let i = 0; i < state.monsters.length; i++) {
          const m = state.monsters[i];
          const dx = m.x - p.x;
          const dy = m.y - p.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= profile.range + m.r) {
            const dot = (dx * dir.x + dy * dir.y) / Math.max(1, dist);
            if (dot > profile.arc) {
              const dmg = Math.floor(base * rand(0.85, 1.18));
              m.hp -= dmg;
              m.flash = 0.12;
              state.popups.push({ x: m.x, y: m.y - 10, text: '-' + dmg, color: '#ffb5b5', life: 0.6 });
              hitCount++;
            }
          }
        }

        if (hitCount > 0) {
          audioEngine.sfx(profile.style);
          triggerFeedback('combo', type === 'heavy' ? 0.85 : 0.55);
          if (type === 'heavy') state.shake = Math.max(7, state.shake);
          vibrate(profile.vib);
        } else {
          audioEngine.beep(type === 'light' ? 500 : 300, 0.04, 'triangle', 0.03);
        }
      }

      function doRoll() {
        const p = state.player;
        if (!p || p.roll.t > 0) return;
        p.roll.t = p.roll.cd;
        const mag = Math.hypot(p.dir.x, p.dir.y) || 1;
        const nx = p.dir.x / mag;
        const ny = p.dir.y / mag;
        p.x = clamp(p.x + nx * p.roll.dist, p.r, cw - p.r);
        p.y = clamp(p.y + ny * p.roll.dist, p.r, ch - p.r);
        p.invuln = Math.max(p.invuln, 0.24);
        state.slashes.push({ x: p.x, y: p.y, life: 0.11, max: 0.11, range: p.roll.dist * 0.45, type: 'roll' });
        state.popups.push({ x: p.x, y: p.y - 22, text: 'DASH', color: '#baf8ff', life: 0.45 });
        audioEngine.sfx('roll');
        vibrate('medium');
      }

      function maybeUnlockWeapon() {
        const unlockOrder = ['Longsword', 'Axe', 'Mace'];
        const kills = state.kills;
        const thresholds = { Longsword: 10, Axe: 20, Mace: 32 };
        for (let i = 0; i < unlockOrder.length; i++) {
          const w = unlockOrder[i];
          if (!state.armory.unlocked[w] && kills >= thresholds[w]) {
            state.armory.unlocked[w] = true;
            state.popups.push({ x: state.player.x, y: state.player.y - 34, text: 'ARMED ' + weaponDefs[w].ui, color: '#ffe08a', life: 1.05 });
            audioEngine.sfx('upgrade');
            vibrate('medium');
          }
        }
      }

      function dropLoot(m) {
        const roll = Math.random();
        let name = 'Fang';
        if (roll > 0.85) name = 'Rune';
        else if (roll > 0.55) name = 'Essence';
        state.inventory.items[name] += 1;
          state.popups.push({ x: m.x, y: m.y - 28, text: '+' + (name === 'Fang' ? 'Spark Chip' : name === 'Essence' ? 'Core Cell' : 'Relic Codex'), color: '#b3ffd2', life: 0.8 });

        const i = state.inventory.items;
        const best = i.Rune > 0 ? 'Rune' : i.Essence > 0 ? 'Essence' : 'Fang';
        state.inventory.equipped = best;
        maybeUnlockWeapon();
        updateInventoryUI();
      }

      function killMonster(i) {
        const m = state.monsters[i];
        const def = monsterDefs[m.kind] || monsterDefs.ghoul;
        const gain = Math.floor((rand(6, 12) + state.wave * 1.5) * def.worthMul);
        state.gold += gain;
        state.kills++;
        state.popups.push({ x: m.x, y: m.y - 16, text: '+' + gain + 'g', color: '#ffe08a', life: 0.8 });
        dropLoot(m);
        audioEngine.sfx('loot');
        vibrate('light');
        state.monsters.splice(i, 1);

        const newLootLevel = 1 + Math.floor(state.gold / 80);
        if (newLootLevel > state.lootLevel) {
          state.lootLevel = newLootLevel;
          state.player.maxHp += 5;
          state.player.hp = Math.min(state.player.maxHp, state.player.hp + 12);
          state.popups.push({ x: state.player.x, y: state.player.y - 24, text: 'RELIC BOOST!', color: '#7cff9b', life: 1.1 });
          audioEngine.sfx('upgrade');
        }
      }

      function drawEntity(img, x, y, r, rot, tint) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, -r * 1.1, -r * 1.1, r * 2.2, r * 2.2);
          if (tint) {
            ctx.fillStyle = tint;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * 2.4);
            ctx.globalAlpha = 1;
          }
        } else {
          ctx.fillStyle = '#8ca0b3';
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0, r), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFloor() {
        const grad = ctx.createLinearGradient(0, 0, 0, ch);
        grad.addColorStop(0, '#0a1021');
        grad.addColorStop(0.55, '#11172b');
        grad.addColorStop(1, '#090d18');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, cw, ch);

        const beam = ctx.createRadialGradient(cw * 0.5, ch * 0.28, 30, cw * 0.5, ch * 0.28, Math.max(cw, ch) * 0.7);
        beam.addColorStop(0, 'rgba(124,246,255,0.16)');
        beam.addColorStop(0.35, 'rgba(143,123,255,0.09)');
        beam.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = beam;
        ctx.fillRect(0, 0, cw, ch);

        ctx.globalAlpha = 0.22;
        for (let y = 0; y < ch; y += 64) {
          for (let x = 0; x < cw; x += 64) {
            ctx.fillStyle = ((x + y) / 64) % 2 === 0 ? '#17203a' : '#10182d';
            ctx.fillRect(x, y, 64, 64);
          }
        }
        ctx.globalAlpha = 1;

        ctx.strokeStyle = 'rgba(124,246,255,0.08)';
        ctx.lineWidth = 1;
        for (let x = -40; x < cw + 40; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x + Math.sin(state.time + x * 0.02) * 6, 0);
          ctx.lineTo(x - 28 + Math.sin(state.time * 0.7 + x * 0.018) * 6, ch);
          ctx.stroke();
        }

        const fogY = ch * 0.74 + Math.sin(state.time * 1.2) * 10;
        const fog = ctx.createLinearGradient(0, fogY, 0, ch);
        fog.addColorStop(0, 'rgba(10,14,20,0)');
        fog.addColorStop(1, 'rgba(65,28,110,0.24)');
        ctx.fillStyle = fog;
        ctx.fillRect(0, fogY, cw, ch - fogY);
      }

      function updateHud() {
        const p = state.player;
        const i = state.inventory.items;
        statsLeft.innerHTML =
          'Hull: <span style="color:' + (p.hp < 35 ? '#ff7b7b' : '#bafcc8') + '">' + p.hp + '/' + p.maxHp + '</span><br>' +
          'Alert: ' + state.wave + '<br>Drones: ' + state.kills;

        const rollReady = p.roll.t <= 0 ? 'READY' : p.roll.t.toFixed(1) + 's';
        statsRight.innerHTML =
          'Credits: <span style="color:#ffe08a">' + state.gold + '</span><br>' +
          'Relic Lv: ' + state.lootLevel + ' | Tool: ' + weaponDefs[state.armory.equipped].ui + '<br>' +
          '<span id="inventory-line">Kit S:' + i.Fang + ' C:' + i.Essence + ' R:' + i.Rune + ' | Dash ' + rollReady + '</span>';
        btnRoll.style.opacity = p.roll.t <= 0 ? '1' : '0.6';
      }

      function updateMonsterMotion(m, p, dt) {
        const def = monsterDefs[m.kind] || monsterDefs.ghoul;
        const dx = p.x - m.x;
        const dy = p.y - m.y;
        const d = Math.hypot(dx, dy) || 0.001;
        let nx = dx / d;
        let ny = dy / d;
        let speedMul = 1;

        if (def.behavior === 'charger') {
          m.burstT -= dt;
          if (m.burstT <= 0) m.burstT = rand(0.5, 1.2);
          speedMul = m.burstT < 0.2 ? 1.75 : 1.0;
        } else if (def.behavior === 'drifter') {
          const ox = -ny;
          const oy = nx;
          nx = clamp(nx * 0.75 + ox * 0.45 * Math.sin(state.time * 3 + m.driftSeed), -1, 1);
          ny = clamp(ny * 0.75 + oy * 0.45 * Math.sin(state.time * 2.6 + m.driftSeed), -1, 1);
        } else if (def.behavior === 'zig') {
          const ox = -ny * m.zigSide;
          const oy = nx * m.zigSide;
          nx = clamp(nx + ox * 0.42 * Math.sin(state.time * 5 + m.driftSeed), -1, 1);
          ny = clamp(ny + oy * 0.42 * Math.sin(state.time * 5 + m.driftSeed), -1, 1);
        } else if (def.behavior === 'tank') {
          speedMul = 0.86;
        }

        m.x += nx * m.spd * speedMul * dt;
        m.y += ny * m.spd * speedMul * dt;
        return d;
      }

      function refreshFeedbackLayer(dt) {
        state.feedbackTimers.combo = Math.max(0, state.feedbackTimers.combo - dt);
        state.feedbackTimers.danger = Math.max(0, state.feedbackTimers.danger - dt);
        setGifState(comboGif, state.feedbackTimers.combo > 0);
        setGifState(dangerGif, state.feedbackTimers.danger > 0);
      }

      function update(dt) {
        if (gameState !== GAME_STATES.PLAYING) return;
        const p = state.player;
        if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return;

        state.time += dt;
        state.wave = 1 + Math.floor(state.time / 22);

        p.speedPx = getHeroPxSpeed();
        p.attackTimers.light = Math.max(0, p.attackTimers.light - dt);
        p.attackTimers.heavy = Math.max(0, p.attackTimers.heavy - dt);
        p.roll.t = Math.max(0, p.roll.t - dt);
        p.invuln = Math.max(0, p.invuln - dt);
        state.lowHealthWarningCd = Math.max(0, state.lowHealthWarningCd - dt);

        const mvx = state.joy.x;
        const mvy = state.joy.y;
        const mag = Math.hypot(mvx, mvy);
        if (mag > 0.05) {
          const nx = mvx / mag;
          const ny = mvy / mag;
          p.dir.x = nx;
          p.dir.y = ny;
          p.x += nx * p.speedPx * Math.min(1, mag) * dt;
          p.y += ny * p.speedPx * Math.min(1, mag) * dt;
        }

        p.x = clamp(p.x, p.r, cw - p.r);
        p.y = clamp(p.y, p.r, ch - p.r);

        if (state.rollQueued) {
          doRoll();
          state.rollQueued = false;
        }
        if (state.tapAttackQueued) {
          doAttack('light');
          state.tapAttackQueued = false;
        }
        if (state.heavyHeld) doAttack('heavy');

        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnMonster();
          const base = 1.12 - Math.min(0.8, state.wave * 0.055);
          state.spawnTimer = Math.max(0.2, rand(base * 0.72, base * 1.16));
        }

        for (let i = state.monsters.length - 1; i >= 0; i--) {
          const m = state.monsters[i];
          const def = monsterDefs[m.kind] || monsterDefs.ghoul;
          m.flash = Math.max(0, m.flash - dt);
          m.hitT = Math.max(0, m.hitT - dt);

          const d = updateMonsterMotion(m, p, dt);
          if (d < p.r + m.r - 4 && m.hitT <= 0) {
            m.hitT = m.hitCd;
            if (p.invuln <= 0) {
              const hurt = Math.floor((rand(6, 11) + state.wave * 0.7) * def.damageMul);
              p.hp -= hurt;
              p.invuln = 0.22;
              state.popups.push({ x: p.x, y: p.y - 16, text: '-' + hurt, color: '#ff6a6a', life: 0.65 });
              state.shake = Math.max(state.shake, 5);
              triggerFeedback('danger', 1.1);
              audioEngine.sfx('hurt');
              vibrate('medium');

              if (p.hp > 0 && p.hp / p.maxHp < 0.35 && state.lowHealthWarningCd <= 0) {
                state.lowHealthWarningCd = 4;
                triggerFeedback('danger', 1.6);
              }

              if (p.hp <= 0) {
                p.hp = 0;
                gameOverText.innerHTML =
                  'Vault breach failed.<br>Drones cleared: <b>' + state.kills + '</b> | Credits banked: <b>' + state.gold + '</b><br>' +
                  'Tool: ' + weaponDefs[state.armory.equipped].ui + ' | Relics: Spark Chips ' + state.inventory.items.Fang + ', Core Cells ' + state.inventory.items.Essence + ', Relic Codices ' + state.inventory.items.Rune;
                setState(GAME_STATES.GAMEOVER);
                vibrate('heavy');
              }
            }
          }

          if (m.hp <= 0) killMonster(i);
        }

        for (let i = state.popups.length - 1; i >= 0; i--) {
          const pop = state.popups[i];
          pop.life -= dt;
          pop.y -= 26 * dt;
          if (pop.life <= 0) state.popups.splice(i, 1);
        }
        for (let i = state.slashes.length - 1; i >= 0; i--) {
          const s = state.slashes[i];
          s.life -= dt;
          if (s.life <= 0) state.slashes.splice(i, 1);
        }

        state.shake = Math.max(0, state.shake - 22 * dt);
        refreshFeedbackLayer(dt);
        updateHud();
      }

      function renderSlash(s) {
        const t = s.life / s.max;
        if (s.type === 'roll') {
          ctx.strokeStyle = 'rgba(150,240,255,' + (0.8 * t) + ')';
          ctx.lineWidth = 7;
        } else if (s.type === 'axe') {
          ctx.strokeStyle = 'rgba(255,170,120,' + (0.78 * t) + ')';
          ctx.lineWidth = 10;
        } else if (s.type === 'mace') {
          ctx.strokeStyle = 'rgba(210,210,230,' + (0.76 * t) + ')';
          ctx.lineWidth = 11;
        } else {
          ctx.strokeStyle = s.type === 'steel' ? 'rgba(200,220,255,' + (0.6 * t) + ')' : 'rgba(255,225,170,' + (0.7 * t) + ')';
          ctx.lineWidth = s.type === 'steel' ? 6 : 9;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, Math.max(0, s.range * 0.38), -0.8, 0.8);
        ctx.stroke();
      }

      function renderMonster(m, p) {
        const def = monsterDefs[m.kind] || monsterDefs.ghoul;
        const mrot = p ? Math.atan2(p.y - m.y, p.x - m.x) + Math.PI / 2 : 0;
        const pulse = 0.88 + Math.sin(state.time * 4 + m.driftSeed) * 0.08;

        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = def.behavior === 'tank' ? 'rgba(255,130,120,0.3)' : def.behavior === 'drifter' ? 'rgba(155,205,255,0.28)' : 'rgba(124,246,255,0.2)';
        ctx.beginPath();
        ctx.arc(m.x, m.y, Math.max(0, m.r * 1.28 * pulse), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        drawEntity(ghoulImg, m.x, m.y, m.r, mrot, m.flash > 0 ? 'rgba(255,80,80,0.7)' : def.color);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, Math.max(0, m.r * 0.92), 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,90,120,0.85)';
        ctx.beginPath();
        ctx.arc(m.x - m.r * 0.18, m.y - m.r * 0.12, Math.max(1.5, m.r * 0.12), 0, Math.PI * 2);
        ctx.arc(m.x + m.r * 0.18, m.y - m.r * 0.12, Math.max(1.5, m.r * 0.12), 0, Math.PI * 2);
        ctx.fill();

        if (def.behavior === 'tank') {
          ctx.fillStyle = 'rgba(255,180,170,0.26)';
          ctx.fillRect(m.x - m.r * 0.5, m.y - m.r - 6, m.r, 4);
        } else if (def.behavior === 'drifter') {
          ctx.fillStyle = 'rgba(160,200,255,0.24)';
          ctx.beginPath();
          ctx.arc(m.x + Math.sin(state.time * 4 + m.driftSeed) * 3, m.y - m.r - 4, Math.max(0, m.r * 0.2), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.fillRect(m.x - 20, m.y - m.r - 16, 40, 5);
        ctx.fillStyle = '#ff6d6d';
        ctx.fillRect(m.x - 20, m.y - m.r - 16, 40 * (m.hp / m.maxHp), 5);
      }

      function render() {
        ctx.clearRect(0, 0, cw, ch);

        let sx = 0, sy = 0;
        if (state.shake > 0) {
          sx = rand(-state.shake, state.shake);
          sy = rand(-state.shake, state.shake);
        }

        ctx.save();
        ctx.translate(sx, sy);
        drawFloor();

        for (let i = 0; i < state.slashes.length; i++) renderSlash(state.slashes[i]);

        const p = state.player;
        if (p) {
          const prot = Math.atan2(p.dir.y, p.dir.x) + Math.PI / 2;

          ctx.save();
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = 'rgba(124,246,255,0.34)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1.42 + Math.sin(state.time * 6) * 0.06), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          drawEntity(hunterImg, p.x, p.y, p.r, prot, p.invuln > 0 ? 'rgba(255,255,255,0.5)' : null);

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(prot);
          ctx.fillStyle = 'rgba(255,240,190,0.95)';
          ctx.beginPath();
          ctx.arc(-p.r * 0.22, -p.r * 0.16, Math.max(2, p.r * 0.12), 0, Math.PI * 2);
          ctx.arc(p.r * 0.22, -p.r * 0.16, Math.max(2, p.r * 0.12), 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(124,246,255,0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-p.r * 0.45, p.r * 0.1);
          ctx.lineTo(0, p.r * 0.34);
          ctx.lineTo(p.r * 0.45, p.r * 0.1);
          ctx.stroke();
          ctx.restore();
        }

        for (let i = 0; i < state.monsters.length; i++) renderMonster(state.monsters[i], p);

        for (let i = 0; i < state.popups.length; i++) {
          const pop = state.popups[i];
          ctx.globalAlpha = clamp(pop.life / 0.8, 0, 1);
          ctx.fillStyle = pop.color;
          ctx.font = '700 20px "Audiowide"';
          ctx.textAlign = 'center';
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      function routePrimaryInput(action, e) {
        unlockAudio();
        if (e) e.preventDefault();
        if (gameState === GAME_STATES.PLAYING) {
          if (action === 'tapAttack') state.tapAttackQueued = true;
          else if (action === 'roll') state.rollQueued = true;
          else if (action === 'toggleInventory') {
            state.inventoryOpen = !state.inventoryOpen;
            audioEngine.sfx(state.inventoryOpen ? 'menuOpen' : 'menuClose');
            updateInventoryUI();
          } else if (action === 'equipFang') {
            state.inventory.equipped = 'Fang';
            audioEngine.sfx('menuOpen');
            updateInventoryUI();
          } else if (action === 'equipEssence' && state.inventory.items.Essence > 0) {
            state.inventory.equipped = 'Essence';
            audioEngine.sfx('menuOpen');
            updateInventoryUI();
          } else if (action === 'equipRune' && state.inventory.items.Rune > 0) {
            state.inventory.equipped = 'Rune';
            audioEngine.sfx('menuOpen');
            updateInventoryUI();
          } else if (action.indexOf('weapon:') === 0) {
            const w = action.slice(7);
            if (state.armory.unlocked[w]) {
              state.armory.equipped = w;
              state.popups.push({ x: state.player.x, y: state.player.y - 20, text: weaponDefs[w].ui, color: '#ffe6bb', life: 0.55 });
              audioEngine.sfx('menuOpen');
              updateInventoryUI();
            } else {
              audioEngine.sfx('blocked');
            }
          }
        } else if (gameState === GAME_STATES.GAMEOVER) {
          restartGame();
        }
      }

      function unlockAudio() {
        if (!firstInteraction) firstInteraction = true;
        audioEngine.unlock().catch(() => {});
        bgm.play().catch(() => {});
      }

      function joyMove(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        let dx = clientX - rect.left - cx;
        let dy = clientY - rect.top - cy;
        const max = 42;
        const d = Math.hypot(dx, dy) || 0.001;
        if (d > max) { dx = (dx / d) * max; dy = (dy / d) * max; }
        stick.style.left = (cx - 29 + dx) + 'px';
        stick.style.top = (cy - 29 + dy) + 'px';
        state.joy.x = dx / max;
        state.joy.y = dy / max;
      }

      function joyReset() {
        state.joy.active = false;
        state.joy.id = null;
        state.joy.x = 0;
        state.joy.y = 0;
        stick.style.left = '37px';
        stick.style.top = '37px';
      }

      function resize(contentRect) {
        cw = Math.max(1, contentRect.width);
        ch = Math.max(1, contentRect.height);
        dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = Math.floor(cw * dpr);
        canvas.height = Math.floor(ch * dpr);
        canvasRect = { left: 0, top: 0, width: cw, height: ch };
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      joystick.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        unlockAudio();
        state.joy.active = true;
        state.joy.id = e.pointerId;
        joystick.setPointerCapture(e.pointerId);
        joyMove(e.clientX, e.clientY);
      }, { passive: false });

      joystick.addEventListener('pointermove', (e) => {
        e.preventDefault();
        if (!state.joy.active || e.pointerId !== state.joy.id) return;
        joyMove(e.clientX, e.clientY);
      }, { passive: false });

      joystick.addEventListener('pointerup', (e) => {
        e.preventDefault();
        if (e.pointerId === state.joy.id) joyReset();
      }, { passive: false });

      joystick.addEventListener('pointercancel', (e) => {
        e.preventDefault();
        joyReset();
      }, { passive: false });

      btnHeavy.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        unlockAudio();
        state.heavyHeld = true;
        btnHeavy.style.transform = 'scale(0.95)';
      }, { passive: false });

      function heavyUp(e) {
        if (e) e.preventDefault();
        state.heavyHeld = false;
        btnHeavy.style.transform = 'scale(1)';
      }
      btnHeavy.addEventListener('pointerup', heavyUp, { passive: false });
      btnHeavy.addEventListener('pointercancel', heavyUp, { passive: false });

      btnRoll.addEventListener('pointerdown', (e) => {
        btnRoll.style.transform = 'scale(0.95)';
        routePrimaryInput('roll', e);
      }, { passive: false });
      function rollUp(e) {
        if (e) e.preventDefault();
        btnRoll.style.transform = 'scale(1)';
      }
      btnRoll.addEventListener('pointerup', rollUp, { passive: false });
      btnRoll.addEventListener('pointercancel', rollUp, { passive: false });

      btnInv.addEventListener('pointerdown', (e) => routePrimaryInput('toggleInventory', e), { passive: false });
      btnInv.addEventListener('click', (e) => routePrimaryInput('toggleInventory', e));

      invFang.addEventListener('pointerdown', (e) => routePrimaryInput('equipFang', e), { passive: false });
      invEssence.addEventListener('pointerdown', (e) => routePrimaryInput('equipEssence', e), { passive: false });
      invRune.addEventListener('pointerdown', (e) => routePrimaryInput('equipRune', e), { passive: false });

      wpnSteel.addEventListener('pointerdown', (e) => routePrimaryInput('weapon:Steel Sword', e), { passive: false });
      wpnSilver.addEventListener('pointerdown', (e) => routePrimaryInput('weapon:Silver Sword', e), { passive: false });
      wpnLongsword.addEventListener('pointerdown', (e) => routePrimaryInput('weapon:Longsword', e), { passive: false });
      wpnAxe.addEventListener('pointerdown', (e) => routePrimaryInput('weapon:Axe', e), { passive: false });
      wpnMace.addEventListener('pointerdown', (e) => routePrimaryInput('weapon:Mace', e), { passive: false });

      canvas.addEventListener('pointerdown', (e) => {
        const x = e.clientX - canvasRect.left;
        const y = e.clientY - canvasRect.top;
        if (x >= 0 && x <= cw && y >= 0 && y <= ch) routePrimaryInput('tapAttack', e);
      }, { passive: false });
      canvas.addEventListener('pointermove', (e) => { e.preventDefault(); }, { passive: false });
      canvas.addEventListener('pointerup', (e) => { e.preventDefault(); }, { passive: false });
      canvas.addEventListener('pointercancel', (e) => { e.preventDefault(); }, { passive: false });

      restartBtn.addEventListener('click', (e) => routePrimaryInput('restart', e));
      restartBtn.addEventListener('pointerdown', (e) => routePrimaryInput('restart', e), { passive: false });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          unlockAudio();
          state.heavyHeld = true;
        } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
          e.preventDefault();
          routePrimaryInput('roll', e);
        } else if (e.code === 'KeyI') {
          e.preventDefault();
          routePrimaryInput('toggleInventory', e);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') state.heavyHeld = false;
      });

      let last = performance.now();
      function gameLoop(now) {
        try {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          update(dt);
          render();
        } catch (_) {
          render();
        }
        requestAnimationFrame(gameLoop);
      }

      const observer = new ResizeObserver((entries) => {
        const entry = entries[0];
        if (!entry) return;
        resize(entry.contentRect);
        if (!initialized) {
          initialized = true;
          initGame();
          audioEngine.init().catch(() => {});
        }
      });
      observer.observe(document.getElementById('game-container'));

      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
