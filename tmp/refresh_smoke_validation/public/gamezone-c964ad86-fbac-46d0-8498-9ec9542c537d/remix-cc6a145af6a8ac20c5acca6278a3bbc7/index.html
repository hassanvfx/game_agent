  const audioEngine={ctx:null,unlocked:false,lastPlayed:{},async init(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)()},async unlock(){if(!this.ctx)await this.init();if(this.ctx&&this.ctx.state==='suspended')try{await this.ctx.resume()}catch(_){}this.unlocked=true},playClip(name,volume,cooldown=0){const el=sfxNodes[name];if(!el||(!el.getAttribute('src')&&!el.currentSrc))return false;const now=performance.now();if(cooldown&&this.lastPlayed[name]&&now-this.lastPlayed[name]<cooldown)return false;this.lastPlayed[name]=now;try{el.pause();el.currentTime=0;el.volume=volume;el.play().catch(()=>{});return true}catch(_){return false}},beep(freq,dur,type,vol){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(this.ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+dur);o.stop(this.ctx.currentTime+dur)},sfx(kind){if(['steel','silver','axe','mace'].includes(kind)){if(!this.playClip('hit',.2,70)&&this.ctx)this.beep(kind==='mace'?130:kind==='axe'?170:240,.09,kind==='steel'?'square':'sawtooth',.04)}else if(kind==='loot'){if(!this.playClip('loot',.24,60)&&this.ctx)this.beep(760,.05,'sine',.04)}else if(kind==='hurt'){if(!this.playClip('hurt',.22,90)&&this.ctx)this.beep(140,.08,'square',.06)}else if(kind==='upgrade'){if(!this.playClip('upgrade',.25,120)&&this.ctx)this.beep(920,.1,'sine',.05)}else if(kind==='roll'){if(!this.playClip('roll',.18,90)&&this.ctx)this.beep(480,.06,'triangle',.045)}else if(kind==='menuOpen')this.playClip('menuOpen',.2,90);else if(kind==='menuClose')this.playClip('menuClose',.18,90);else if(kind==='blocked'){if(!this.playClip('blocked',.18,120)&&this.ctx)this.beep(180,.06,'square',.045)}else if(kind==='gameOver')this.playClip('gameOver',.28,400)}};

  function routePrimaryInput(action,e){unlockAudio();if(e)e.preventDefault();if(gameState===GAME_STATES.PLAYING){if(action==='tapAttack')state.tapAttackQueued=true;else if(action==='roll')state.rollQueued=true;else if(action==='toggleInventory'){state.inventoryOpen=!state.inventoryOpen;audioEngine.sfx(state.inventoryOpen?'menuOpen':'menuClose');updateInventoryUI()}else if(action==='equipFang'){state.inventory.equipped='Fang';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action==='equipEssence'&&state.inventory.items.Essence>0){state.inventory.equipped='Essence';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action==='equipRune'&&state.inventory.items.Rune>0){state.inventory.equipped='Rune';audioEngine.sfx('menuOpen');updateInventoryUI()}else if(action.indexOf('weapon:')===0){const w=action.slice(7);if(state.armory.unlocked[w]){state.armory.equipped=w;state.popups.push({x:state.player.x,y:state.player.y-20,text:weaponDefs[w].ui,color:'#b52984',life:.55});audioEngine.sfx('menuOpen');updateInventoryUI()}else audioEngine.sfx('blocked')}}else if(gameState===GAME_STATES.GAMEOVER)initGame()}
  function unlockAudio(){if(!firstInteraction)firstInteraction=true;audioEngine.unlock().catch(()=>{});if(bgm.getAttribute('src'))bgm.play().catch(()=>{})}
  function joyMove(clientX,clientY){const rect=joystick.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2;let dx=clientX-rect.left-cx,dy=clientY-rect.top-cy;const max=42,d=Math.hypot(dx,dy)||.001;if(d>max){dx=dx/d*max;dy=dy/d*max}stick.style.left=(cx-29+dx)+'px';stick.style.top=(cy-29+dy)+'px';state.joy.x=dx/max;state.joy.y=dy/max}function joyReset(){state.joy.active=false;state.joy.id=null;state.joy.x=0;state.joy.y=0;stick.style.left='37px';stick.style.top='37px'}
  function resize(contentRect){cw=Math.max(1,contentRect.width);ch=Math.max(1,contentRect.height);dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));canvas.style.width=cw+'px';canvas.style.height=ch+'px';canvas.width=Math.floor(cw*dpr);canvas.height=Math.floor(ch*dpr);canvasRect={left:0,top:0,width:cw,height:ch};ctx.setTransform(dpr,0,0,dpr,0,0)}
  joystick.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();state.joy.active=true;state.joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);joyMove(e.clientX,e.clientY)},{passive:false});joystick.addEventListener('pointermove',e=>{e.preventDefault();if(!state.joy.active||e.pointerId!==state.joy.id)return;joyMove(e.clientX,e.clientY)},{passive:false});joystick.addEventListener('pointerup',e=>{e.preventDefault();if(e.pointerId===state.joy.id)joyReset()},{passive:false});joystick.addEventListener('pointercancel',e=>{e.preventDefault();joyReset()},{passive:false});btnHeavy.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();state.heavyHeld=true;btnHeavy.style.transform='scale(.95)'},{passive:false});function heavyUp(e){if(e)e.preventDefault();state.heavyHeld=false;btnHeavy.style.transform='scale(1)'}btnHeavy.addEventListener('pointerup',heavyUp,{passive:false});btnHeavy.addEventListener('pointercancel',heavyUp,{passive:false});btnRoll.addEventListener('pointerdown',e=>{btnRoll.style.transform='scale(.95)';routePrimaryInput('roll',e)},{passive:false});function rollUp(e){if(e)e.preventDefault();btnRoll.style.transform='scale(1)'}btnRoll.addEventListener('pointerup',rollUp,{passive:false});btnRoll.addEventListener('pointercancel',rollUp,{passive:false});btnInv.addEventListener('pointerdown',e=>routePrimaryInput('toggleInventory',e),{passive:false});invFang.addEventListener('pointerdown',e=>routePrimaryInput('equipFang',e),{passive:false});invEssence.addEventListener('pointerdown',e=>routePrimaryInput('equipEssence',e),{passive:false});invRune.addEventListener('pointerdown',e=>routePrimaryInput('equipRune',e),{passive:false});wpnSteel.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Steel Sword',e),{passive:false});wpnSilver.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Silver Sword',e),{passive:false});wpnLongsword.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Longsword',e),{passive:false});wpnAxe.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Axe',e),{passive:false});wpnMace.addEventListener('pointerdown',e=>routePrimaryInput('weapon:Mace',e),{passive:false});canvas.addEventListener('pointerdown',e=>{const x=e.clientX-canvasRect.left,y=e.clientY-canvasRect.top;if(x>=0&&x<=cw&&y>=0&&y<=ch)routePrimaryInput('tapAttack',e)},{passive:false});['pointermove','pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>e.preventDefault(),{passive:false}));restartBtn.addEventListener('click',e=>routePrimaryInput('restart',e));restartBtn.addEventListener('pointerdown',e=>routePrimaryInput('restart',e),{passive:false});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlockAudio();state.heavyHeld=true}else if(e.code==='ShiftLeft'||e.code==='ShiftRight'){e.preventDefault();routePrimaryInput('roll',e)}else if(e.code==='KeyI'){e.preventDefault();routePrimaryInput('toggleInventory',e)}});window.addEventListener('keyup',e=>{if(e.code==='Space')state.heavyHeld=false});
  let last=performance.now();function gameLoop(now){try{const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render()}catch(err){console.error('runtime-loop',err);render()}requestAnimationFrame(gameLoop)}const observer=new ResizeObserver(entries=>{const entry=entries[0];if(!entry)return;resize(entry.contentRect);if(!initialized){initialized=true;initGame();audioEngine.init().catch(()=>{})}});observer.observe(gid('game-container'));requestAnimationFrame(gameLoop);
});
