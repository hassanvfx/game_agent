<!DOCTYPE html>
<html lang="en">

<title>Royal VHS Ghost: Archive Court</title>

<style>
:root{
  --void:#070215; --midnight:#12072c; --royal:#35105d; --violet:#6d3cff; --tape:#23ffd8;
  --gold:#ffd56a; --rose:#ff4fa7; --danger:#ff304f; --panel:rgba(15,7,35,.82);
  --glass:rgba(255,255,255,.11); --text:#fff7dc; --soft:#d9c6ff;
}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05010d;color:var(--text);font-family:'VT323',monospace;user-select:none;-webkit-user-select:none;touch-action:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 12%,rgba(255,213,106,.15),transparent 32%);mix-blend-mode:screen;opacity:.62;z-index:2}
body:after{content:"";position:fixed;inset:-6%;pointer-events:none;background:linear-gradient(90deg,transparent 0 18%,rgba(35,255,216,.035) 19%,transparent 20% 60%,rgba(255,79,167,.035) 61%,transparent 62%);animation:vhsDrift 4s steps(7,end) infinite;z-index:3}
@keyframes vhsDrift{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}}
#game-container{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(#080116,#13032b 52%,#271044)}
canvas{display:block;width:100%;height:100%;touch-action:none;position:absolute;inset:0;z-index:1}
#ui-layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;pointer-events:none;z-index:10}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.chip,.royal-badge,.modal-card{background:linear-gradient(180deg,rgba(45,18,82,.88),rgba(9,3,23,.84));border:1px solid rgba(255,213,106,.48);box-shadow:0 0 0 1px rgba(35,255,216,.12) inset,0 10px 30px rgba(0,0,0,.36),0 0 28px rgba(109,60,255,.18);backdrop-filter:blur(10px)}.chip{border-radius:18px;padding:8px 12px;min-width:104px;pointer-events:auto}.label{display:block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);line-height:1}.value{display:block;font-size:28px;line-height:.95;text-shadow:2px 0 rgba(255,79,167,.75),-2px 0 rgba(35,255,216,.65)}.levelchip{text-align:right}.bottom-controls{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto}.royal-badge{border-radius:999px;padding:6px 13px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.07em;color:#fff0b6;text-align:center}.btn{width:min(92vw,340px);border:2px solid rgba(255,245,197,.88);border-radius:999px;padding:13px 16px;color:#21070f;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.045em;text-transform:uppercase;box-shadow:0 8px 0 rgba(55,19,79,.95),0 0 22px rgba(255,213,106,.3);transform:translateY(0);transition:transform .12s,filter .12s;touch-action:manipulation}.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(55,19,79,.95);filter:brightness(1.1)}#build-btn{background:linear-gradient(180deg,#fff2a6,#f2a736)}#build-vault-btn{background:linear-gradient(180deg,#8fffee,#7d58ff);color:#120628}.hidden{display:none!important}.hint{font-size:14px;color:#d9c6ff;text-shadow:0 2px 5px #000}.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,1,12,.58);backdrop-filter:blur(5px);z-index:50;padding:16px}.modal-card{width:min(92vw,430px);border-radius:28px;padding:20px;pointer-events:auto}.modal-title{font-family:'Cinzel',serif;color:var(--gold);font-size:27px;margin:5px 0 6px}.modal-card p{margin:0 0 16px;color:var(--soft);font-size:18px}.modal-actions{display:flex;flex-direction:column;gap:10px}.modal-btn{width:100%;border:1px solid rgba(255,213,106,.55);border-radius:15px;padding:13px 14px;background:linear-gradient(90deg,rgba(109,60,255,.85),rgba(255,79,167,.72));color:white;font-family:'Cinzel',serif;font-weight:700;display:flex;justify-content:space-between}.close{margin-top:12px;background:rgba(255,255,255,.08);color:#fff7dc}.toast{position:absolute;right:13px;bottom:148px;width:min(30vw,112px);border-radius:18px;border:1px solid rgba(255,213,106,.55);background:rgba(9,3,23,.86);box-shadow:0 0 24px rgba(255,79,167,.28);padding:9px;text-align:center;opacity:0;transform:translateY(12px) scale(.94);transition:.2s;pointer-events:none;z-index:18}.toast.active{opacity:1;transform:translateY(0) scale(1)}.cassette-icon{height:52px;border-radius:9px;background:linear-gradient(135deg,#25114d,#6d3cff);border:2px solid #ffd56a;position:relative;margin-bottom:5px}.cassette-icon:before,.cassette-icon:after{content:"";position:absolute;top:18px;width:14px;height:14px;border-radius:50%;background:#080116;border:3px solid #23ffd8}.cassette-icon:before{left:14px}.cassette-icon:after{right:14px}.toast span{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.08em}.sr-only{position:absolute;left:-9999px}@media(max-width:420px){.chip{padding:7px 10px}.value{font-size:25px}.btn{padding:12px}.toast{bottom:152px}}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas" aria-label="Royal VHS Ghost idle tower game"></canvas>
<div id="ui-layer">
  <div class="topbar">
    <div class="chip"><span class="label">Royal Gil</span><span id="score-display" class="value">300</span></div>
    <div class="chip levelchip"><span class="label">Court Lv <span id="level-display">1</span></span><span id="next-unlock" class="hint">Next: Cursed Echoes Lv 25</span></div>
  </div>
  <div class="bottom-controls">
    <div class="royal-badge">♛ The Crowned VHS Ghost Archive ♛</div>
    <button id="build-btn" class="btn">Summon Seance Chamber <span id="build-cost">(100g)</span></button>
    <button id="build-vault-btn" class="btn hidden">Open Crown Vault <span id="build-vault-cost">(500g)</span></button>
    <div class="hint">Drag the haunted tower · tap chambers to enchant</div>
  </div>
</div>
<div id="toast-calm" class="toast" aria-hidden="true"><div class="cassette-icon"></div><span>ROYAL TUNE</span></div>
<div id="toast-alert" class="toast" aria-hidden="true"><div class="cassette-icon"></div><span>CURSE SURGE</span></div>
<div id="upgrade-modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="royal-badge">✦ Chamber Enchantment ✦</div>
    <h2 id="modal-title" class="modal-title">Seance Chamber</h2>
    <p id="modal-desc">Imbue this chamber with faster ritual tape or richer royal tribute.</p>
    <div class="modal-actions">
      <button id="upgrade-speed-btn" class="modal-btn"><span>Haste Sigil Lv <span id="lvl-speed">1</span></span><span id="cost-speed">75g</span></button>
      <button id="upgrade-value-btn" class="modal-btn"><span>Tribute Sigil Lv <span id="lvl-value">1</span></span><span id="cost-value">75g</span></button>
      <button id="close-modal-btn" class="modal-btn close">Return to Court</button>
    </div>
  </div>
</div>
</div>
<audio id="bgm_main" loop preload="none"></audio>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d',{alpha:false});let cw=0,ch=0,dpr=1,lastTime=0,initialized=false,gameState='PLAYING';
const gameConfig={baseTreatmentTime:3,patientSpawnRate:2,mentalUnlockLevel:25,paddedUnlockLevel:28};
const world={money:300,rooms:[],patients:[],particles:[],cameraY:0,targetCameraY:0,maxScroll:0,nextPatientTime:0,selectedRoom:null,mentalUnlocked:false,paddedUnlocked:false};
const FLOOR_HEIGHT=120,ROOM_WIDTH=140;let audioUnlocked=false,lastSfxAt=0,toastTimer=0;const bgm=document.getElementById('bgm_main');
class Room{constructor(id,type,floor,side){this.id=id;this.type=type;this.floor=floor;this.side=side;this.levelSpeed=1;this.levelValue=1;this.state='IDLE';this.timer=0;this.patient=null;this.doctorAnim=0}get x(){return cw/2+this.side*(cw/2.2)}get y(){return ch-80-(this.floor*FLOOR_HEIGHT)}get treatmentTime(){return Math.max(.5,gameConfig.baseTreatmentTime*Math.pow(.9,this.levelSpeed-1))}get value(){const base=this.type==='padded'?25:10;return Math.floor(base*Math.pow(1.2,this.levelValue-1))}get upgradeCostSpeed(){return Math.floor(50*Math.pow(1.5,this.levelSpeed))}get upgradeCostValue(){return Math.floor(50*Math.pow(1.5,this.levelValue))}}
class Patient{constructor(isMental=false){this.x=cw/2;this.y=ch+20;this.targetRoom=null;this.state='ENTERING';this.hp=100;this.speed=100;this.type=isMental?'mental':'normal';this.sanity=100;this.mentalState='GREEN';this.attackTarget=null;this.shake=0}get color(){if(this.type==='mental'){if(this.mentalState==='RED')return'#ff304f';if(this.mentalState==='YELLOW')return'#ffd56a';return'#23ffd8'}return'#b38cff'}}
class Particle{constructor(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color;this.life=1;this.vy=-50}}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;bgm.volume=.18;if(bgm.currentSrc||bgm.src)bgm.play().catch(()=>{})}function tone(freq,dur=.1,type='sine'){if(!audioUnlocked)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=unlockAudio.ac||(unlockAudio.ac=new A());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function playSfx(id){const now=performance.now();if(now-lastSfxAt<70&&id==='click')return;lastSfxAt=now;const map={money:880,click:520,attack:120,calm:660,fail:180,modal_open:440,modal_close:330};tone(map[id]||400,id==='attack'?.18:.1,id==='attack'?'sawtooth':'sine')}function setBgmState(v){if(!audioUnlocked)return;if(v&&(bgm.currentSrc||bgm.src))bgm.play().catch(()=>{});else bgm.pause()}function vibrate(type){if(navigator.vibrate)navigator.vibrate(type==='heavy'?40:15)}
function showToast(kind){const a=document.getElementById('toast-calm'),b=document.getElementById('toast-alert'),n=kind==='alert'?b:a;a.classList.remove('active');b.classList.remove('active');n.classList.add('active');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('active'),1200)}
function initGame(){if(initialized)return;world.rooms.push(new Room(0,'reception',0,0));updateUI();requestAnimationFrame(loop);initialized=true}function spawnPatient(){if(world.patients.length>25)return;world.patients.push(new Patient(world.mentalUnlocked&&Math.random()<.3))}
function getBuildCost(type){if(type==='padded'){const count=world.rooms.filter(r=>r.type==='padded').length;return Math.floor(500*Math.pow(1.5,count))}const count=world.rooms.filter(r=>r.type==='general').length;return Math.floor(100*Math.pow(1.4,count))}
function buildRoom(type='general'){const cost=getBuildCost(type);if(world.money>=cost){world.money-=cost;playSfx('click');vibrate('medium');const count=world.rooms.filter(r=>r.type!=='reception').length,floor=Math.floor(count/2)+1,side=count%2===0?-1:1;const r=new Room(Date.now(),type,floor,side);world.rooms.push(r);spawnParticles(r.x,r.y-world.cameraY,type==='padded'?'CROWN VAULT!':'NEW CHAMBER!','#fff7dc');showToast('calm');updateUI()}else{playSfx('fail')}}
function upgradeRoom(type){if(!world.selectedRoom)return;const r=world.selectedRoom,cost=type==='speed'?r.upgradeCostSpeed:r.upgradeCostValue;if(world.money>=cost){world.money-=cost;if(type==='speed')r.levelSpeed++;else r.levelValue++;playSfx('calm');vibrate('light');spawnParticles(r.x,r.y-world.cameraY,'ENCHANTED','#ffd56a');showToast('calm')}else playSfx('fail');updateModal();updateUI()}function spawnParticles(x,y,text,color){world.particles.push(new Particle(x,y,text,color))}
function update(dt){const lvl=world.rooms.length;if(lvl>=gameConfig.mentalUnlockLevel)world.mentalUnlocked=true;if(lvl>=gameConfig.paddedUnlockLevel)world.paddedUnlocked=true;world.nextPatientTime-=dt;if(world.nextPatientTime<=0){spawnPatient();world.nextPatientTime=gameConfig.patientSpawnRate}world.cameraY+=(world.targetCameraY-world.cameraY)*10*dt;const maxFloor=Math.max(...world.rooms.map(r=>r.floor));world.maxScroll=Math.max(0,maxFloor*FLOOR_HEIGHT+300-ch);world.targetCameraY=Math.max(0,Math.min(world.targetCameraY,world.maxScroll));
world.rooms.forEach(r=>{if(r.state==='TREATING'){r.timer-=dt;r.doctorAnim+=dt*10;if(r.timer<=0){if(r.patient){const p=r.patient;p.state='LEAVING';if(r.type==='padded'){p.sanity=100;p.mentalState='GREEN';playSfx('calm');spawnParticles(r.x,r.y-world.cameraY,'CROWNED','#23ffd8')}else{playSfx('money');spawnParticles(r.x,r.y-world.cameraY,`+${r.value}g`,'#ffd56a')}world.money+=r.value;vibrate('light');updateUI()}r.patient=null;r.state='IDLE'}}});
for(let i=world.patients.length-1;i>=0;i--){const p=world.patients[i];if(p.type==='mental'&&p.state!=='TREATING'&&p.state!=='LEAVING'){p.sanity-=dt*5;if(p.sanity<=0){p.mentalState='RED';if(p.state!=='ATTACKING'){p.state='ATTACKING';if(p.targetRoom){p.targetRoom.patient=null;p.targetRoom=null}}}else if(p.sanity<50){p.mentalState='YELLOW';if(p.state==='WAITING'||(p.state==='WALKING_TO'&&p.targetRoom?.type==='general')){const padded=world.rooms.find(r=>r.type==='padded'&&r.state==='IDLE'&&!r.patient);if(padded){if(p.targetRoom)p.targetRoom.patient=null;p.targetRoom=padded;padded.patient=p;p.state='WALKING_TO'}}}else p.mentalState='GREEN'}
if(p.state==='ATTACKING'){if(!p.attackTarget||!world.patients.includes(p.attackTarget))p.attackTarget=world.patients.find(v=>v!==p&&v.state!=='LEAVING'&&v.state!=='ATTACKING');if(p.attackTarget){moveTo(p,p.attackTarget.x,p.attackTarget.y,dt*1.5);if(dist(p.x,p.y,p.attackTarget.x,p.attackTarget.y)<10){playSfx('attack');vibrate('heavy');spawnParticles(p.x,p.y-world.cameraY,'STATIC CUT','#ff304f');showToast('alert');const idx=world.patients.indexOf(p.attackTarget);if(idx>-1)world.patients.splice(idx,1);world.patients.splice(i,1);continue}}else p.x+=(Math.random()-.5)*2}else if(p.state==='ENTERING'){const r=world.rooms[0];moveTo(p,r.x,r.y,dt);if(dist(p.x,p.y,r.x,r.y)<5)assignRoom(p)}else if(p.state==='WAITING')assignRoom(p);else if(p.state==='WALKING_TO'){if(!p.targetRoom){p.state='WAITING';continue}moveTo(p,p.targetRoom.x,p.targetRoom.y,dt);if(dist(p.x,p.y,p.targetRoom.x,p.targetRoom.y)<5){p.state='TREATING';p.targetRoom.state='TREATING';p.targetRoom.timer=p.targetRoom.treatmentTime}}else if(p.state==='LEAVING'){moveTo(p,cw/2,ch+50,dt);if(p.y>ch+40)world.patients.splice(i,1)}}
for(let i=world.particles.length-1;i>=0;i--){const p=world.particles[i];p.life-=dt;p.y+=p.vy*dt;if(p.life<=0)world.particles.splice(i,1)}}
function assignRoom(p){let type='general';if(p.type==='mental'&&p.mentalState==='YELLOW')type='padded';const room=world.rooms.find(r=>r.type===type&&r.state==='IDLE'&&!r.patient);if(room){p.targetRoom=room;room.patient=p;p.state='WALKING_TO'}else p.state='WAITING'}function moveTo(e,tx,ty,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d>1){const m=Math.min(d,e.speed*dt);e.x+=dx/d*m;e.y+=dy/d*m}}function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}
function drawCrown(x,y,s){ctx.fillStyle='#ffd56a';ctx.beginPath();ctx.moveTo(x-12*s,y+5*s);ctx.lineTo(x-8*s,y-8*s);ctx.lineTo(x-2*s,y+1*s);ctx.lineTo(x+4*s,y-10*s);ctx.lineTo(x+9*s,y+2*s);ctx.lineTo(x+13*s,y-7*s);ctx.lineTo(x+12*s,y+5*s);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke()}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#070215');g.addColorStop(.48,'#170834');g.addColorStop(1,'#35105d');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.save();ctx.globalAlpha=.28;for(let i=0;i<9;i++){const x=(i/8)*cw+(Math.sin(lastTime*.0004+i)*12);const h=110+(i%4)*52;ctx.fillStyle=i%2?'#19082f':'#260c47';ctx.beginPath();ctx.moveTo(x-34,ch);ctx.lineTo(x-24,ch-h);ctx.lineTo(x,ch-h-38);ctx.lineTo(x+24,ch-h);ctx.lineTo(x+34,ch);ctx.fill();ctx.fillStyle='rgba(255,213,106,.25)';ctx.fillRect(x-4,ch-h-18,8,22)}ctx.restore();ctx.strokeStyle='rgba(35,255,216,.1)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<cw;i+=44){ctx.moveTo(i+Math.sin(lastTime*.001)*5,0);ctx.lineTo(i,ch)}for(let y=0;y<ch;y+=44){ctx.moveTo(0,y);ctx.lineTo(cw,y)}ctx.stroke();for(let i=0;i<18;i++){ctx.fillStyle=i%2?'rgba(255,79,167,.14)':'rgba(35,255,216,.14)';ctx.beginPath();ctx.arc((i*71+lastTime*.018)%cw,70+(Math.sin(lastTime*.001+i)*45)+i*11%220,1.5+(i%3),0,Math.PI*2);ctx.fill()}}
function drawRoom(r){const rw=r.type==='reception'?204:ROOM_WIDTH,rh=80,rx=r.x-rw/2,ry=r.y-rh/2;ctx.shadowColor=world.selectedRoom===r?'rgba(255,213,106,.9)':'rgba(0,0,0,.45)';ctx.shadowBlur=world.selectedRoom===r?24:10;const grad=ctx.createLinearGradient(rx,ry,rx,ry+rh);if(r.type==='padded'){grad.addColorStop(0,'#30206d');grad.addColorStop(1,'#113d51')}else if(r.type==='reception'){grad.addColorStop(0,'#4a1b70');grad.addColorStop(1,'#1a0b35')}else{grad.addColorStop(0,'#2d145f');grad.addColorStop(1,'#14072b')}ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,12);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=r.type==='padded'?'#23ffd8':'#ffd56a';ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(rx+9,ry+9,rw-18,7);ctx.fillStyle=r.type==='padded'?'rgba(35,255,216,.65)':'rgba(255,213,106,.68)';ctx.fillRect(rx,ry+rh-11,rw,11);ctx.fillStyle='#fff7dc';ctx.font='17px VT323';ctx.textAlign='center';let label=r.type==='reception'?'ROYAL VHS THRONE':`SEANCE ${r.floor}`;if(r.type==='padded')label=`CROWN VAULT ${r.floor}`;ctx.fillText(label,r.x,r.y-10);ctx.fillStyle='#ffd56a';ctx.font='700 15px Cinzel';ctx.fillText(`✦ ${r.levelSpeed+r.levelValue-1}`,r.x,r.y+22);if(r.type!=='reception'){const sy=Math.sin(r.doctorAnim)*3;ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(r.x+36,r.y+5+sy,12,18,0,0,Math.PI*2);ctx.fill();drawCrown(r.x+36,r.y-14+sy,.45);ctx.fillStyle=r.type==='padded'?'#23ffd8':'#ff4fa7';ctx.fillRect(r.x+28,r.y+4+sy,16,5)}}
function drawPatient(p){let px=p.x,py=p.y;if(p.mentalState==='YELLOW')px+=(Math.random()-.5)*2;if(p.mentalState==='RED')px+=(Math.random()-.5)*5;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(px,py+16,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.color;ctx.globalAlpha=.82;ctx.beginPath();ctx.moveTo(px,py-18);ctx.bezierCurveTo(px-18,py-13,px-14,py+14,px-7,py+16);ctx.quadraticCurveTo(px,py+9,px+7,py+16);ctx.bezierCurveTo(px+15,py+12,px+17,py-13,px,py-18);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();ctx.fillStyle='#05010d';ctx.fillRect(px-6,py-5,4,4);ctx.fillRect(px+3,py-5,4,4);ctx.fillStyle='rgba(5,1,13,.55)';ctx.fillRect(px-9,py+3,18,6);ctx.strokeStyle='#23ffd8';ctx.strokeRect(px-8,py+4,16,4);if(p.type==='mental'){ctx.fillStyle=p.mentalState==='RED'?'#ff304f':p.mentalState==='YELLOW'?'#ffd56a':'#23ffd8';ctx.beginPath();ctx.arc(px+13,py-14,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#06020d';ctx.fillRect(px-12,py-24,24,4);ctx.fillStyle=p.color;ctx.fillRect(px-11,py-23,22*(p.sanity/100),2)}if(p.type==='mental'||p.state==='ATTACKING')drawCrown(px,py-24,.34)}
function draw(){drawBackground();ctx.save();ctx.translate(0,world.cameraY);const maxFloor=Math.max(...world.rooms.map(r=>r.floor)),shaftHeight=maxFloor*FLOOR_HEIGHT+205;const sg=ctx.createLinearGradient(cw/2-22,ch-80-shaftHeight,cw/2+22,ch-80);sg.addColorStop(0,'#33105d');sg.addColorStop(.5,'#14072b');sg.addColorStop(1,'#4a1b70');ctx.fillStyle=sg;ctx.fillRect(cw/2-22,ch-80-shaftHeight,44,shaftHeight);ctx.fillStyle='rgba(35,255,216,.17)';ctx.fillRect(cw/2-6,ch-80-shaftHeight,12,shaftHeight);ctx.strokeStyle='rgba(255,213,106,.32)';ctx.strokeRect(cw/2-22,ch-80-shaftHeight,44,shaftHeight);drawCrown(cw/2,ch-80-shaftHeight-18,1);if(world.rooms.length<gameConfig.mentalUnlockLevel){const lockY=ch-80-((world.rooms.length+2)*FLOOR_HEIGHT);ctx.fillStyle='rgba(7,2,21,.38)';ctx.fillRect(0,lockY-98,cw,98);ctx.fillStyle='#ffd56a';ctx.font='700 16px Cinzel';ctx.textAlign='center';ctx.fillText('CURSED ECHOES AWAKEN AT COURT LV 25',cw/2,lockY-40)}world.rooms.forEach(drawRoom);world.patients.forEach(drawPatient);world.particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.font='24px VT323';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1});ctx.restore()}
function loop(time){const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;if(gameState==='PLAYING')update(dt);draw();requestAnimationFrame(loop)}
let isDragging=false,startY=0,startCameraY=0,clickStartTime=0;function handleCanvasInput(e){unlockAudio();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(e.type==='pointerdown'){isDragging=true;startY=y;startCameraY=world.targetCameraY;clickStartTime=Date.now()}else if(e.type==='pointermove'){if(isDragging){const dy=y-startY;world.targetCameraY=startCameraY+dy;if(Math.abs(dy)>10)clickStartTime=0}}else if(e.type==='pointerup'||e.type==='pointercancel'){isDragging=false;if(Date.now()-clickStartTime<200&&clickStartTime!==0)handleTap(x,y)}}
function handleTap(x,y){const worldY=y-world.cameraY;let clickedRoom=null;world.rooms.forEach(r=>{const rw=r.type==='reception'?204:ROOM_WIDTH,rh=80;if(x>=r.x-rw/2&&x<=r.x+rw/2&&worldY>=r.y-rh/2&&worldY<=r.y+rh/2)clickedRoom=r});if(clickedRoom&&clickedRoom.type!=='reception'){world.selectedRoom=clickedRoom;openModal()}else world.selectedRoom=null}
function updateUI(){document.getElementById('score-display').textContent=world.money;document.getElementById('level-display').textContent=world.rooms.length;document.getElementById('build-cost').textContent=`(${getBuildCost('general')}g)`;const lvl=world.rooms.length,next=document.getElementById('next-unlock');if(lvl<25)next.textContent='Next: Cursed Echoes Lv 25';else if(lvl<28)next.textContent='Next: Crown Vault Lv 28';else next.textContent='Archive Complete';if(world.paddedUnlocked){document.getElementById('build-vault-btn').classList.remove('hidden');document.getElementById('build-vault-cost').textContent=`(${getBuildCost('padded')}g)`}}
function openModal(){const r=world.selectedRoom,modal=document.getElementById('upgrade-modal');modal.classList.remove('hidden');document.getElementById('modal-title').textContent=r.type==='padded'?`Crown Vault ${r.floor}`:`Seance Chamber ${r.floor}`;playSfx('modal_open');updateModal();gameState='MODAL';setBgmState(false)}function updateModal(){const r=world.selectedRoom;if(!r)return;document.getElementById('lvl-speed').textContent=r.levelSpeed;document.getElementById('cost-speed').textContent=`${r.upgradeCostSpeed}g`;document.getElementById('lvl-value').textContent=r.levelValue;document.getElementById('cost-value').textContent=`${r.upgradeCostValue}g`;document.getElementById('upgrade-speed-btn').style.opacity=world.money>=r.upgradeCostSpeed?'1':'.52';document.getElementById('upgrade-value-btn').style.opacity=world.money>=r.upgradeCostValue?'1':'.52'}function closeModal(){document.getElementById('upgrade-modal').classList.add('hidden');playSfx('modal_close');world.selectedRoom=null;gameState='PLAYING';setBgmState(true)}
canvas.addEventListener('pointerdown',handleCanvasInput,{passive:true});canvas.addEventListener('pointermove',handleCanvasInput,{passive:true});canvas.addEventListener('pointerup',handleCanvasInput,{passive:true});canvas.addEventListener('pointercancel',handleCanvasInput,{passive:true});
document.getElementById('build-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();buildRoom('general')});document.getElementById('build-vault-btn').addEventListener('click',e=>{e.stopPropagation();unlockAudio();buildRoom('padded')});document.getElementById('upgrade-speed-btn').addEventListener('click',e=>{e.stopPropagation();upgradeRoom('speed')});document.getElementById('upgrade-value-btn').addEventListener('click',e=>{e.stopPropagation();upgradeRoom('value')});document.getElementById('close-modal-btn').addEventListener('click',e=>{e.stopPropagation();closeModal()});
window.__royalVhsQA={world,buildRoom,spawnPatient,updateUI,Room,Patient};
const ro=new ResizeObserver(entries=>{const rect=entries[0].contentRect;canvas.width=rect.width*window.devicePixelRatio;canvas.height=rect.height*window.devicePixelRatio;canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';cw=rect.width;ch=rect.height;dpr=window.devicePixelRatio;ctx.setTransform(dpr,0,0,dpr,0,0);if(!initialized)initGame()});document.addEventListener('DOMContentLoaded',()=>ro.observe(canvas));
</script>
