<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Bloom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap');
        :root {
            --bg-top: #060816;
            --bg-bottom: #020617;
            --panel: rgba(11, 18, 39, 0.62);
            --panel-edge: rgba(129, 246, 255, 0.22);
            --text-main: rgba(244, 250, 255, 0.96);
            --text-soft: rgba(196, 214, 255, 0.76);
            --signal: #67e8f9;
            --signal-strong: #22d3ee;
            --petal: #f472b6;
            --petal-soft: #c084fc;
            --shadow: rgba(5, 10, 24, 0.55);
            --success-glow: rgba(244, 114, 182, 0.4);
            --impact-glow: rgba(103, 232, 249, 0.34);
        }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background:
            radial-gradient(circle at top, rgba(34, 211, 238, 0.16), transparent 34%),
            radial-gradient(circle at 80% 20%, rgba(244, 114, 182, 0.16), transparent 24%),
            linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            overflow: hidden; user-select: none; -webkit-user-select: none; font-family: 'Rajdhani', system-ui, sans-serif; }
        body { color: var(--text-main); }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        .glass { background: linear-gradient(180deg, rgba(11, 18, 39, 0.7), rgba(15, 23, 42, 0.46)); backdrop-filter: blur(12px); border: 1px solid var(--panel-edge); box-shadow: 0 12px 30px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08); }

            0% { opacity: 0; transform: translate(-50%, 12px) scale(0.86); }
            20% { opacity: 1; transform: translate(-50%, 0) scale(1); }

        #start-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(2, 6, 23, 0.52); backdrop-filter: blur(8px); transition: opacity 1s; }

            transition: opacity 0.22s ease, transform 0.22s ease;
            box-shadow: 0 10px 28px rgba(3, 7, 18, 0.45);

        .feedback-card.active {
            opacity: 1;
            transform: translateY(0);

        .feedback-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1.25;

            background: rgba(15, 23, 42, 0.65);
        }
        .feedback-label {
            padding: 0.5rem 0.75rem;

        #combo-badge {

<script>
/**
 * AUDIO SYSTEM
 * Catalog-backed media playback with gesture-safe unlock
 */
class AudioSys {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.unlocked = false;
        this.muted = false;
        this.buffers = {};
        this.activeSources = new Set();
        this.loopEl = document.getElementById('bgm_main');
        this.loopStarted = false;
        this.lastPlayedAt = {};
        this.sfxVolumes = {
            pulse: 0.34,
            hit: 0.26,
            collect: 0.4,
            start: 0.42,
            ui: 0.24
        };
    }

    ensureContext() {
        if (this.ctx) return;
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) return;
        this.ctx = new AudioContextCtor();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.58;
        this.masterGain.connect(this.ctx.destination);
    }

    async init() {
        this.ensureContext();
        const ids = ['sfx_pulse', 'sfx_hit', 'sfx_collect', 'sfx_start', 'sfx_ui'];
        await Promise.all(ids.map(async (id) => {
            const el = document.getElementById(id);
            if (!el || !el.src || !this.ctx) return;
            try {
                const res = await fetch(el.src);
                const buf = await res.arrayBuffer();
                this.buffers[id] = await this.ctx.decodeAudioData(buf);
            } catch (e) {
                console.log('Audio buffer fallback', id);
            }
        }));

        if (this.loopEl) {
            this.loopEl.volume = 0.18;
            this.loopEl.preload = 'auto';
            this.loopEl.loop = true;
            this.loopEl.muted = false;
        }
    }

    async unlock() {
        this.ensureContext();
        if (this.unlocked) return;
        try {
            if (this.ctx && this.ctx.state === 'suspended') {
                await this.ctx.resume();
            }
            this.unlocked = true;
            this.playLoop();
        } catch (e) {
            console.log('Audio unlock skipped');
        }
    }

    playLoop() {
        if (!this.loopEl || this.muted) return;
        this.loopStarted = true;
        this.loopEl.volume = 0.18;
        this.loopEl.play().catch(() => {});
    }

    pauseLoop() {
        if (!this.loopEl) return;
        this.loopEl.pause();
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.masterGain) {
            this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.58, this.ctx.currentTime, 0.08);
        }
        if (this.loopEl) {
            this.loopEl.muted = this.muted;
            if (this.muted) this.loopEl.pause();
            else if (this.unlocked && this.loopStarted) this.loopEl.play().catch(() => {});
        }
        return this.muted;
    }

    playSfx(id, cooldown = 80) {
        if (this.muted) return;
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;

        this.ensureContext();
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }

        const buffer = this.buffers[id];
        if (this.ctx && this.masterGain && buffer) {
            try {
                const source = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                const volumeKey = id.replace('sfx_', '');
                gain.gain.value = this.sfxVolumes[volumeKey] ?? 0.3;
                source.buffer = buffer;
                source.connect(gain);
                gain.connect(this.masterGain);
                source.start();
                this.activeSources.add(source);
                source.onended = () => this.activeSources.delete(source);
                return;
            } catch (e) {
                console.log('Audio buffer play fallback', id);
            }
        }

        const el = document.getElementById(id);
        if (!el) return;
        try {
            el.currentTime = 0;
            el.volume = this.sfxVolumes[id.replace('sfx_', '')] ?? 0.3;
            el.play().catch(() => {});
        } catch (e) {
            console.log('Audio element play skipped', id);
        }
    }
}

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const audio = new AudioSys();
const comboBadge = document.getElementById('combo-badge');
const comboCard = document.getElementById('combo-card');
const impactCard = document.getElementById('impact-card');
const comboGifDisplay = document.getElementById('combo-gif-display');
const impactGifDisplay = document.getElementById('impact-gif-display');

// [agent-note][stage4] repaired-font/mobile: display/title -> Audiowide, UI/body -> Rajdhani, icons -> Material Symbols Rounded from catalogs/fonts.json; scoped gameplay pointer input to canvas so mobile CTA taps keep native click behavior

// Configuration
let config = {
    orbCount: 12,
    rippleSpeed: 3,
    baseColor: '#2dd4bf',
    gameTitle: 'Signal Bloom'
};

// State
let gameState = 'MENU'; // MENU, PLAY
let lastTime = 0;
let time = 0;
let score = 0;
let bestCombo = 0;
let comboHits = 0;
let comboWindowUntil = 0;
let impactFeedbackTimeout = null;
let comboFeedbackTimeout = null;

// Entities
const orbs = [];
const ripples = [];
const particles = [];
const bgDust = [];

// Init Background Parallax
for (let i = 0; i < 50; i++) {
    bgDust.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.02 + 0.005,
        alpha: Math.random() * 0.3 + 0.1
    });
}

function showImpactFeedback() {
    clearTimeout(impactFeedbackTimeout);
    impactCard.classList.add('active');
    impactFeedbackTimeout = setTimeout(() => {
        impactCard.classList.remove('active');
    }, 900);
}

function showComboFeedback(text) {
    comboBadge.textContent = text;
    comboBadge.classList.remove('active');
    void comboBadge.offsetWidth;
    comboBadge.classList.add('active');
    clearTimeout(comboFeedbackTimeout);
    comboCard.classList.add('active');
    comboFeedbackTimeout = setTimeout(() => {
        comboCard.classList.remove('active');
        comboBadge.classList.remove('active');
    }, 1450);
}

function registerHitFeedback() {
    const now = performance.now();
    if (now <= comboWindowUntil) comboHits += 1;
    else comboHits = 1;
    comboWindowUntil = now + 1150;
    bestCombo = Math.max(bestCombo, comboHits);

    showImpactFeedback();

    if (comboHits >= 3) {
        audio.playSfx('sfx_collect', 140);
        showComboFeedback(`Bloom Combo x${comboHits}`);
    } else {
        audio.playSfx('sfx_hit', 70);
    }
}

class Orb {
    constructor() {
        this.reset();
        this.y = Math.random() * window.innerHeight;
        this.phase = Math.random() * Math.PI * 2;
    }
    
    reset() {
        this.x = Math.random() * window.innerWidth;
        this.y = window.innerHeight + 50;
        this.radius = Math.random() * 15 + 10;
        this.baseY = this.y;
        this.floatSpeed = Math.random() * 0.5 + 0.2;
        this.driftSpeed = (Math.random() - 0.5) * 0.5;
        this.hue = Math.random() > 0.5 ? config.baseColor : '#c084fc';
        this.noteIndex = Math.floor(Math.random() * 8);
        this.pulse = 0;
    }

    update(dt) {
        this.phase += dt;
        this.y -= this.floatSpeed * (dt * 60);
        this.x += Math.sin(this.phase * 0.5) * 0.5;
        
        if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt * 2);

        if (this.y < -50) {
            this.y = window.innerHeight + 50;
            this.x = Math.random() * window.innerWidth;
        }
    }

    draw(ctx) {
        const scale = 1 + this.pulse * 0.5;
        const glowRadius = this.radius * (1.85 + this.pulse * 0.25);
        const ringRadius = this.radius * (1.25 + this.pulse * 0.14);

        ctx.save();

        const aura = ctx.createRadialGradient(this.x, this.y, this.radius * 0.15, this.x, this.y, glowRadius);
        aura.addColorStop(0, 'rgba(255,255,255,0.95)');
        aura.addColorStop(0.18, this.hue);
        aura.addColorStop(0.5, `${this.hue}55`);
        aura.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = aura;
        ctx.globalAlpha = 0.6 + this.pulse * 0.15;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 1.2;
        ctx.arc(this.x, this.y, ringRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.shadowBlur = 26 + this.pulse * 18;
        ctx.shadowColor = this.hue;
        ctx.fillStyle = this.hue;
        ctx.globalAlpha = 0.88 + this.pulse * 0.12;
        ctx.arc(this.x, this.y, this.radius * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.arc(this.x - this.radius * 0.26, this.y - this.radius * 0.24, this.radius * 0.28 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = '#ffffff';
        ctx.arc(this.x, this.y, (this.radius * 0.32) * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
    
    hit() {
        if (this.pulse > 0.5) return;
        this.pulse = 1.0;
        score++;
        document.getElementById('score-val').innerText = score;
        
        for (let i = 0; i < 5; i++) {
            particles.push(new Particle(this.x, this.y, this.hue));
        }
        
        registerHitFeedback();
    }
}

class Ripple {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.life = 1.0;
        this.maxRadius = Math.max(window.innerWidth, window.innerHeight) * 0.4;
    }

    update(dt) {
        this.radius += config.rippleSpeed * (dt * 60);
        this.life -= 0.008 * (dt * 60);
    }

    draw(ctx) {
        if (this.life <= 0) return;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.life * 0.5})`;
        ctx.lineWidth = 2;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 2 + 1;
        this.vx = Math.cos(a) * s;
        this.vy = Math.sin(a) * s;
        this.life = 1.0;
    }
    update(dt) {
        this.x += this.vx * (dt * 60);
        this.y += this.vy * (dt * 60);
        this.life -= 0.02 * (dt * 60);
        this.vx *= 0.95;
        this.vy *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// Input Handling
function handleInput(e) {
    if (e.type !== 'pointerdown' || gameState !== 'PLAY') return;

    e.preventDefault();
    audio.unlock();

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    ripples.push(new Ripple(x, y));
    audio.playSfx('sfx_pulse', 90);
}

canvas.addEventListener('pointerdown', handleInput, { passive: false });

// Main Loop
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (orbs.length < config.orbCount) {
        while (orbs.length < config.orbCount) orbs.push(new Orb());
    } else if (orbs.length > config.orbCount) {
        orbs.length = config.orbCount;
    }
}
window.addEventListener('resize', resize);

function update(dt) {
    time += dt;

    bgDust.forEach(p => {
        p.y -= p.speed * (dt * 60);
        if (p.y < 0) p.y = 1;
    });

    if (performance.now() > comboWindowUntil && comboHits !== 0) {
        comboHits = 0;
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.update(dt);
        
        if (r.life > 0) {
            orbs.forEach(o => {
                const dist = Math.sqrt((r.x - o.x) ** 2 + (r.y - o.y) ** 2);
                if (Math.abs(dist - r.radius) < o.radius + 10) {
                    o.hit();
                }
            });
        }
        
        if (r.life <= 0) ripples.splice(i, 1);
    }

    orbs.forEach(o => o.update(dt));

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height, 0,
        canvas.width / 2, canvas.height / 2, canvas.width
    );
    grad.addColorStop(0, '#1e1b4b');
    grad.addColorStop(1, '#020617');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    bgDust.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ripples.forEach(r => r.draw(ctx));
    orbs.forEach(o => o.draw(ctx));

    ctx.globalCompositeOperation = 'screen';
    particles.forEach(p => p.draw(ctx));
    ctx.globalCompositeOperation = 'source-over';
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    try {
        if (gameState === 'PLAY') {
            update(dt);
        } else {
            time += dt;
            bgDust.forEach(p => {
                p.y -= p.speed * (dt * 60);
                if (p.y < 0) p.y = 1;
            });
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            bgDust.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }
        draw();
    } catch (e) {
        console.error(e);
    }

    requestAnimationFrame(loop);
}

// UI Logic
document.getElementById('start-btn').addEventListener('click', () => {
    gameState = 'PLAY';
    document.getElementById('start-screen').classList.add('fade-out');
    document.getElementById('start-screen').style.opacity = 0;
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').style.opacity = 1;
    }, 1000);
    audio.unlock();
    audio.playSfx('sfx_start', 200);
    
    orbs.length = 0;
    for (let i = 0; i < config.orbCount; i++) orbs.push(new Orb());
});

document.getElementById('mute-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const isMuted = audio.toggleMute();
    audio.playSfx('sfx_ui', 120);
    e.currentTarget.innerHTML = `<span class="material-symbols-rounded" aria-hidden="true">${isMuted ? 'volume_off' : 'volume_up'}</span>`;
});

// Init
window.gameConfigDefs = {
    orbCount: { type: "number", label: "Orb Density", value: 12, min: 5, max: 25 },
    rippleSpeed: { type: "number", label: "Ripple Speed", value: 3, min: 1, "max": 8 },
    baseColor: { type: "color", label: "Glow Color", value: "#2dd4bf" },
    gameTitle: { type: "text", label: "Title", value: "Signal Bloom" }
};

window.updateGameConfig = (key, val) => {
    if (config.hasOwnProperty(key)) {
        config[key] = val;
        if (key === 'orbCount') {
            if (orbs.length < val) {
                while (orbs.length < val) orbs.push(new Orb());
            } else {
                orbs.length = val;
            }
        }
        if (key === 'gameTitle') {
            document.querySelector('#main-title').innerHTML = val.replace(' ', '<br><span class="font-thin opacity-70">') + '</span>';
        }
    }
};

document.addEventListener('visibilitychange', () => {
    if (document.hidden) audio.pauseLoop();
    else if (!audio.muted && audio.unlocked && gameState === 'PLAY') audio.playLoop();
});

document.addEventListener('DOMContentLoaded', () => {
    const comboGifAsset = document.getElementById('gif_combo');
    const impactGifAsset = document.getElementById('gif_impact');
    if (comboGifAsset && comboGifAsset.src) comboGifDisplay.src = comboGifAsset.src;
    if (impactGifAsset && impactGifAsset.src) impactGifDisplay.src = impactGifAsset.src;

    if (window.gameConfig) Object.assign(config, window.gameConfig);
    resize();
    audio.init();
    requestAnimationFrame(loop);
});
</script>
