<style>

.hud-row{display:flex;justify-content:space-between;gap:.65rem;align-items:flex-start}.hud-col{display:flex;flex-direction:column}.hud-right{text-align:right;align-items:flex-end}
.hud-card{min-width:7.4rem;max-width:45vw;padding:.48rem .62rem;border:1px dashed var(--line);border-radius:.85rem;background:linear-gradient(180deg,rgba(42,18,61,.82),rgba(5,2,9,.76));box-shadow:0 0 1.2rem rgba(103,215,255,.11),inset 0 0 .8rem rgba(255,255,255,.04)}

#control-deck{pointer-events:auto;width:100%;max-width:33rem;margin:0 auto;display:flex;flex-direction:column;gap:.72rem;transition:opacity .25s,transform .25s}.is-transparent{opacity:0;transform:translateY(1rem);pointer-events:none!important}.is-hidden{display:none!important}
.panel{position:relative;border:1px solid rgba(255,231,194,.46);border-radius:1.05rem;background:linear-gradient(180deg,rgba(54,26,72,.91),rgba(15,7,25,.94));box-shadow:0 .8rem 2.2rem rgba(0,0,0,.42),inset 0 0 1.2rem rgba(103,215,255,.06);overflow:hidden}.panel:before{content:"";position:absolute;inset:.34rem;border:1px dashed rgba(148,255,224,.24);border-radius:.78rem;pointer-events:none}.dialogue-panel{min-height:8.9rem;padding:.88rem .92rem 1.28rem}.speaker{font-size:clamp(.86rem,3.2vw,1.05rem);color:var(--safe);border-bottom:1px dashed rgba(148,255,224,.26);padding-bottom:.28rem;margin-bottom:.42rem;letter-spacing:.18em;text-transform:uppercase}.term-text{font-size:clamp(1.12rem,4.35vw,1.42rem);line-height:1.22;margin:0;text-shadow:0 0 .35rem rgba(103,215,255,.18)}
.caret{position:absolute;right:1rem;bottom:.45rem;font-size:1.25rem;color:#ffd976;animation:pulse 1s infinite}.choice-list{display:flex;flex-direction:column;gap:.62rem}.stitch-btn{min-height:3rem;padding:.74rem .9rem;border:1px solid rgba(148,255,224,.65);border-radius:.9rem;background:linear-gradient(180deg,rgba(55,24,74,.96),rgba(14,6,23,.96));box-shadow:0 0 1rem rgba(103,215,255,.12);text-align:left;font-size:clamp(1.02rem,4vw,1.24rem);letter-spacing:.08em}.stitch-btn:active{transform:scale(.985);background:linear-gradient(180deg,rgba(244,201,79,.96),rgba(137,82,34,.94));color:#1b0c22;box-shadow:0 0 1.2rem rgba(244,201,79,.35)}
#notify-area{position:absolute;inset:0;z-index:36;display:flex;align-items:center;justify-content:center;pointer-events:none}.notify-title{font-family:'Creepster',fantasy;font-weight:400;font-size:clamp(2.4rem,9vw,5.5rem);color:var(--danger);text-align:center;margin:0;padding:.78rem 1rem;border:1px solid rgba(255,95,157,.62);border-radius:1rem;background:rgba(12,2,14,.86);box-shadow:0 0 1.5rem rgba(255,95,157,.28);text-shadow:.08em .05em 0 #08030d,0 0 1rem rgba(255,95,157,.55)}
#start-screen{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:1.35rem;pointer-events:auto;background:radial-gradient(circle at 50% 18%,rgba(244,201,79,.12),transparent 23%),linear-gradient(180deg,rgba(21,8,31,.96),rgba(2,1,5,.99))}.door-card{width:min(28rem,92vw);padding:1rem .95rem 1.15rem;text-align:center}.start-title{font-family:'Creepster',fantasy;font-size:clamp(3rem,13vw,6.8rem);font-weight:400;line-height:.88;margin:.3rem 0 .4rem;color:#ffd66f;text-shadow:.06em .05em 0 #2b1536,0 0 1.1rem rgba(244,201,79,.28)}.start-subtitle{color:var(--safe);font-size:clamp(1rem,4vw,1.24rem);letter-spacing:.18em;text-transform:uppercase;margin:0 0 1rem}.door-figure{width:7.2rem;height:9.5rem;margin:0 auto .5rem;position:relative;border-radius:4rem 4rem .8rem .8rem;background:linear-gradient(180deg,#39214b,#130919);border:2px solid rgba(255,231,194,.35);box-shadow:inset 0 0 1.1rem rgba(0,0,0,.55),0 0 2rem rgba(103,215,255,.14)}.door-figure:before{content:"";position:absolute;left:50%;top:17%;width:2.5rem;height:2.5rem;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffd976,#b96645 63%,#211020 64%)}.door-figure:after{content:"✕   ✕";position:absolute;left:0;right:0;top:25%;color:#08030d;font-size:1.1rem;letter-spacing:.75rem;text-indent:.72rem}.start-actions{display:flex;flex-direction:column;gap:.75rem;margin-top:.85rem}.menu-btn{text-align:center;justify-content:center;font-size:clamp(1.12rem,4vw,1.38rem);letter-spacing:.14em;text-transform:uppercase}.clear-btn{background:transparent;border:0;text-decoration:underline;color:#c79bea;opacity:.82;margin-top:.25rem;font-size:1rem}
.child{position:absolute;left:50%;bottom:20.4%;z-index:10;width:min(27vw,7.8rem);height:min(42vw,12rem);transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 .5rem .85rem rgba(0,0,0,.62));transition:bottom .4s,opacity .4s,transform .4s}.child .head{position:absolute;left:50%;top:0;width:34%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:#ffd7a8}.child .hair{position:absolute;left:27%;top:1%;width:46%;height:16%;border-radius:50% 50% 24% 24%;background:#253e9e}.child .body{position:absolute;left:31%;top:17%;width:38%;height:58%;clip-path:polygon(50% 0,76% 16%,100% 100%,0 100%,24% 16%);background:linear-gradient(180deg,#ffe36e,#d8942f)}.child .needle{position:absolute;left:70%;top:29%;width:2px;height:42%;background:var(--safe);box-shadow:0 0 .7rem var(--safe);transform:rotate(-18deg)}.child .leg{position:absolute;top:72%;width:7%;height:22%;background:#161018}.child .leg.l{left:40%;transform:rotate(6deg)}.child .leg.r{right:40%;transform:rotate(-8deg)}.child--hole{bottom:13%;transform:translateX(-50%) scale(.88)}.child--falling{bottom:43%;transform:translateX(-50%) rotate(-12deg) scale(.93);animation:fallSway 1.6s ease-in-out infinite}.child--reflection{bottom:17%;transform:translateX(-50%) scaleY(-1);opacity:.38;filter:blur(.04rem) drop-shadow(0 0 .8rem rgba(103,215,255,.25))}
@keyframes fallSway{50%{transform:translateX(-50%) rotate(14deg) scale(1)}}@keyframes pulse{50%{opacity:.45;transform:scale(1.03)}}
@media (min-aspect-ratio: 9/13){#game-root{max-width:520px;margin:0 auto}.term-text{font-size:1.2rem}.dialogue-panel{min-height:8rem}}@media (max-width:360px){.hud-card{min-width:6.6rem;padding:.42rem}.dialogue-panel{min-height:8.2rem}.child{width:6rem;height:9.4rem}.start-title{font-size:2.65rem}}

<body>
<div id="game-root">
  <canvas id="worldCanvas"></canvas>
  <div class="wallpaper" aria-hidden="true"></div><div class="stitches" aria-hidden="true"></div>
  <div id="scene-child" class="child" aria-hidden="true"><span class="head"></span><span class="hair"></span><span class="body"></span><span class="needle"></span><span class="leg l"></span><span class="leg r"></span></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="notify-area" class="is-hidden"><h1 id="notify-text" class="notify-title">BUTTON BLINK</h1></div>
  <div id="ui-layer">
    <div class="hud-row">
      <div class="hud-col hud-card"><span class="hud-label">STITCH ● 00:0<span id="timer-sec">0</span></span><span id="depth-display" class="hud-value is-hidden">DEPTH <span id="depth-val">0</span>0m</span></div>
      <div class="hud-col hud-right hud-card" id="bravery-display"><span id="sanity-display" class="hud-value is-hidden">BRAVERY <span id="sanity-val">100</span>%</span><div id="inventory-list" class="inv-list"></div></div>
    </div>
    <div id="control-deck" class="is-transparent">
      <div class="panel dialogue-panel" id="dialogue-box"><div id="speaker-label" class="speaker">HOUSE</div><p id="main-text" class="term-text"></p><div id="continue-caret" class="caret is-hidden">▼</div></div>
      <div id="choices-area" class="choice-list is-hidden"></div>
    </div>
  </div>
  <div id="start-screen">
    <div class="panel door-card"><div class="door-figure"></div><h1 class="start-title" id="start-title">THE BUTTON DOOR</h1><p class="start-subtitle">Other-house bravery file #<span id="tape-num">402</span></p><div class="start-actions"><button id="btn-continue" class="stitch-btn menu-btn is-hidden">RESUME THE THREAD</button><button id="btn-new" class="stitch-btn menu-btn">OPEN THE LITTLE DOOR</button><button id="btn-clear" class="clear-btn">UNPICK SAVED THREAD</button></div></div>
  </div>
</div>
<script>
const CONFIG={textSpeed:20,maxDepth:10,startSanity:100};
const STORAGE_KEY='button_door_stitch_loop_v1';
let state={depth:0,sanity:100,inventory:[],sceneId:'START',loopCount:1,flags:{}};
const audio={ctx:null,enabled:false,last:{},async init(){this.enabled=true;if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')await this.ctx.resume();},tone(freq=440,dur=.08,type='sine',gain=.035){if(!this.enabled||!this.ctx)return;const now=this.ctx.currentTime;const o=this.ctx.createOscillator();const g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(gain,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g).connect(this.ctx.destination);o.start(now);o.stop(now+dur+.02)},playSfx(kind){const t=performance.now();if(this.last[kind]&&t-this.last[kind]<70)return;this.last[kind]=t;if(kind==='blip')this.tone(720,.045,'triangle',.018);else if(kind==='collect'){this.tone(660,.08,'sine',.032);setTimeout(()=>this.tone(990,.1,'sine',.028),60)}else if(kind==='scare'){this.tone(96,.22,'sawtooth',.045);setTimeout(()=>this.tone(47,.28,'square',.03),70)}else if(kind==='fail')this.tone(155,.32,'sawtooth',.04);else if(kind==='rewind'){for(let i=0;i<5;i++)setTimeout(()=>this.tone(820-i*110,.055,'triangle',.025),i*58)}}};
const visual={canvas:document.getElementById('worldCanvas'),ctx:document.getElementById('worldCanvas').getContext('2d'),width:0,height:0,time:0,shake:0,glitchIntensity:0,mode:'STATIC',resize(){const dpr=Math.min(devicePixelRatio||1,2);this.width=innerWidth;this.height=innerHeight;this.canvas.width=Math.floor(this.width*dpr);this.canvas.height=Math.floor(this.height*dpr);this.ctx.setTransform(dpr,0,0,dpr,0,0)},update(dt){this.time+=dt;if(this.shake>0)this.shake=Math.max(0,this.shake-5*dt);if(this.glitchIntensity>0)this.glitchIntensity=Math.max(0,this.glitchIntensity-1*dt)},render(){const c=this.ctx,w=this.width,h=this.height;c.clearRect(0,0,w,h);c.fillStyle='#07020b';c.fillRect(0,0,w,h);const dx=(Math.random()-.5)*this.shake*18,dy=(Math.random()-.5)*this.shake*18;c.save();c.translate(dx,dy);if(this.mode==='ROOM')this.drawRoom(c,w,h);else if(this.mode==='YARD')this.drawYard(c,w,h);else if(this.mode==='HOLE')this.drawTunnel(c,w,h);else if(this.mode==='FALLING')this.drawFalling(c,w,h);else if(this.mode==='REFLECTION')this.drawReflection(c,w,h);else this.drawStatic(c,w,h);this.drawThreads(c,w,h);this.drawNoise(c,w,h);c.restore()},bg(c,w,h,a,b){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,w,h)},button(c,x,y,r,color='#ffd976'){c.save();c.fillStyle=color;c.strokeStyle='rgba(10,3,14,.85)';c.lineWidth=Math.max(1,r*.13);c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='rgba(10,3,14,.8)';for(const a of [Math.PI*.25,Math.PI*.75,Math.PI*1.25,Math.PI*1.75]){c.beginPath();c.arc(x+Math.cos(a)*r*.34,y+Math.sin(a)*r*.34,r*.09,0,Math.PI*2);c.fill()}c.restore()},drawRoom(c,w,h){this.bg(c,w,h,'#241036','#07030b');c.strokeStyle='rgba(255,231,194,.2)';c.lineWidth=2;for(let x=w*.12;x<w;x+=w*.19){c.beginPath();c.moveTo(x,h*.08);c.lineTo(x+Math.sin(this.time+x)*8,h*.9);c.stroke()}c.fillStyle='rgba(255,231,194,.08)';c.fillRect(w*.12,h*.18,w*.76,h*.56);c.strokeStyle='rgba(103,215,255,.32)';c.strokeRect(w*.12,h*.18,w*.76,h*.56);c.fillStyle='#0b0410';c.fillRect(w*.34,h*.48,w*.32,h*.24);c.strokeStyle='rgba(255,231,194,.5)';c.strokeRect(w*.34,h*.48,w*.32,h*.24);this.button(c,w*.5,h*.59,Math.min(w,h)*.032,'#5ed8ff');c.fillStyle='rgba(244,201,79,.2)';c.fillRect(w*.25,h*.76,w*.5,h*.035)},drawYard(c,w,h){this.bg(c,w,h,'#160c29','#08030d');c.fillStyle='rgba(8,3,13,.75)';c.fillRect(0,h*.43,w,h*.57);for(let i=0;i<7;i++){const x=(i/6)*w; c.fillStyle=i%2?'rgba(47,26,67,.62)':'rgba(31,16,47,.72)';c.beginPath();c.moveTo(x-w*.12,h*.43);c.lineTo(x,h*.22+Math.sin(i)*22);c.lineTo(x+w*.12,h*.43);c.closePath();c.fill()}c.fillStyle='rgba(0,0,0,.86)';c.beginPath();c.ellipse(w/2,h*.62,w*.34,h*.105,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(148,255,224,.36)';c.lineWidth=2;c.stroke();this.button(c,w*.79,h*.17,Math.min(w,h)*.05,'#ead08a');c.fillStyle='rgba(103,215,255,.16)';c.beginPath();c.arc(w*.5,h*.62,w*.13,0,Math.PI*2);c.fill()},drawTunnel(c,w,h){this.bg(c,w,h,'#12081c','#020104');const off=(this.time*120)%80;c.strokeStyle='rgba(148,255,224,.27)';c.lineWidth=1.4;for(let y=-80;y<h+80;y+=80){let yy=y+off;c.beginPath();c.moveTo(w*.18,yy);c.quadraticCurveTo(w*.5,yy+18*Math.sin(this.time+yy),w*.82,yy);c.stroke();for(let x=w*.22;x<w*.82;x+=w*.16)this.button(c,x,yy+Math.sin(x+this.time)*6,4,'#835f8c')}c.strokeStyle='rgba(244,201,79,.5)';c.lineWidth=4;c.beginPath();c.moveTo(w*.5,0);c.bezierCurveTo(w*.47,h*.25,w*.55,h*.62,w*.49,h);c.stroke();c.strokeStyle='rgba(255,95,157,.22)';for(let x of [w*.18,w*.82]){c.beginPath();c.moveTo(x,0);c.lineTo(x+Math.sin(this.time*2)*12,h);c.stroke()}},drawFalling(c,w,h){this.bg(c,w,h,'#21071e','#030104');const speed=720;for(let i=0;i<16;i++){const y=(h-((this.time*speed+i*85)% (h+120)));c.fillStyle=i%2?'rgba(103,215,255,.16)':'rgba(255,95,157,.12)';c.fillRect(0,y,w,10)}for(let i=0;i<12;i++){const x=(i/11)*w;c.strokeStyle='rgba(255,231,194,.16)';c.beginPath();c.moveTo(x,0);c.lineTo(w/2,h*.55);c.stroke()}},drawReflection(c,w,h){this.bg(c,w,h,'#081427','#020309');c.fillStyle='rgba(103,215,255,.11)';for(let y=h*.42;y<h;y+=18){c.fillRect(0,y+Math.sin(this.time*3+y)*3,w,1)}c.save();c.translate(w/2,h*.43);if(Math.random()<.08)c.translate((Math.random()-.5)*16,0);c.strokeStyle='rgba(148,255,224,.72)';c.lineWidth=2;c.beginPath();c.ellipse(0,0,58,72,0,0,Math.PI*2);c.stroke();this.button(c,-22,-10,10,'#101018');this.button(c,22,-10,10,'#101018');c.beginPath();c.arc(0,35,16,Math.PI,0);c.stroke();c.restore()},drawStatic(c,w,h){this.bg(c,w,h,'#08030d','#000');for(let i=0;i<170;i++){c.fillStyle=Math.random()>.5?'rgba(255,231,194,.34)':'rgba(103,215,255,.22)';c.fillRect(Math.random()*w,Math.random()*h,Math.random()*3+1,2)}},drawThreads(c,w,h){c.strokeStyle='rgba(148,255,224,.06)';for(let i=0;i<8;i++){c.beginPath();const x=(i+.5)*w/8+Math.sin(this.time+i)*10;c.moveTo(x,0);c.bezierCurveTo(x+30,h*.28,x-28,h*.62,x+8,h);c.stroke()}},drawNoise(c,w,h){const a=.025+this.glitchIntensity*.01;c.fillStyle=`rgba(255,95,157,${a})`;c.fillRect(0,(this.time*70)%(h+80)-40,w,28)}};
const SCENES={START:{text:['The little door is awake.','Mother is downstairs. The Other Mother is smiling behind the wallpaper.','Objective: find the missing child-thread before the house sews you in.','Stitch depth: 0m'],speaker:'THE HOUSE',bg:'ROOM',next:'YARD_1'},YARD_1:{text:['The hallway smells like warm cake and old dust.','A button-shaped moon watches through the parlor window.','The tiny door yawns open in the skirting board.'],speaker:'YOU',bg:'YARD',choices:[{label:'Check the little door',target:'EDGE_LOOK'},{label:'Refuse the invitation',target:'GAME_OVER_COWARD'}]},EDGE_LOOK:{text:['A tunnel of blue thread drops beyond the frame.','Something below pulls at your coat hem.','It feels like a promise pretending to be gravity.'],speaker:'YOU',bg:'YARD',choices:[{label:'Climb into the thread tunnel',target:'DESCEND_START'}]},DESCEND_START:{text:['You crawl past the threshold.','The real house folds shut behind you.','Bravery log begins.'],speaker:'THE HOUSE',bg:'HOLE',action:()=>{state.depth=1;updateHUD();saveGame()},next:'DEPTH_LOOP'},DEPTH_LOOP:{dynamic:true,bg:'HOLE'},EVENT_FIND_TOY:{text:['A blue spool is caught in a seam of dirt.','It hums like a lullaby you half remember.','You pocket it before the walls can take it back.'],speaker:'YOU',bg:'HOLE',action:()=>{if(!state.inventory.includes('blue spool'))state.inventory.push('blue spool');updateHUD();audio.playSfx('collect');},choices:[{label:'Keep the spool close',target:'DEPTH_LOOP_NEXT'}]},EVENT_WHISPERS:{text:["'Stay, brave little one...'",'The wallpaper whispers in Mother\'s voice.','Its stitched flowers lean toward your eyes.'],speaker:'OTHER MOTHER',bg:'HOLE',effect:'SCARE',action:()=>{state.sanity-=10;updateHUD()} ,choices:[{label:'Hold your bravery',target:'DEPTH_LOOP_NEXT'},{label:'Whisper back',target:'ANSWER_WHISPER'}]},ANSWER_WHISPER:{text:['You answer the wall.','Every button in the tunnel clicks once.','A little bravery unravels.'],speaker:'YOU',bg:'HOLE',action:()=>{state.sanity-=5;updateHUD()},next:'DEPTH_LOOP_NEXT'},EVENT_ENTITY:{text:['Someone hangs below you on the thread.','She wears your yellow coat. Her eyes are black buttons.'],speaker:'BUTTON GIRL',bg:'HOLE',effect:'SCARE',choices:[{label:'Call to her',target:'ENTITY_IGNORE'},{label:'Kick through the doll-shadow',target:'ENTITY_FADE'}]},ENTITY_IGNORE:{text:['She does not answer.','She lets go of the thread.','The house swallows her without a thud.'],speaker:'YOU',bg:'HOLE',next:'DEPTH_LOOP_NEXT'},ENTITY_FADE:{text:['Your boot passes through cotton and cold air.','Not a girl. Not exactly a ghost.','Bravery dropping.'],speaker:'THE HOUSE',bg:'HOLE',action:()=>{state.sanity-=15;updateHUD()},next:'DEPTH_LOOP_NEXT'},BOTTOM_REACHED:{text:['Stitch depth 100m.','The thread ladder ends.','A nursery floor waits under the world.','A basin of black button-water reflects the ceiling.'],speaker:'THE HOUSE',bg:'HOLE',next:'REVELATION_1'},REVELATION_1:{text:['You look into the water.','You expect to see a rescuer.','But the reflection wears your coat.'],speaker:'YOU',bg:'REFLECTION',effect:'SCARE',next:'REVELATION_2'},REVELATION_2:{text:['The missing child-thread is yours.','The Other House has been practicing your face.','It only needs your eyes.'],speaker:'YOU',bg:'REFLECTION',next:'THE_FALL'},THE_FALL:{text:['You remember the invitation.','The cakes. The games. The shining buttons.','The fall into wanting.'],speaker:'YOU',bg:'FALLING',effect:'SCARE',action:()=>{visual.shake=5;visual.glitchIntensity=10},next:'THE_FALL_2'},THE_FALL_2:{text:['No.','Brave children do not stay sewn.','Unpick the night again.'],speaker:'YOU',bg:'FALLING',next:'ENDING_LOOP'},ENDING_LOOP:{text:['UNSTITCHING...','PLEASE HOLD THE THREAD','ERROR: DOOR LOOP REOPENED'],speaker:'THE DOOR',bg:'STATIC',isEnd:true,action:()=>{audio.playSfx('rewind');state.loopCount++}},GAME_OVER_COWARD:{text:['You shut the little door.','All night, buttons click in the walls.','The invitation waits under your pillow.'],speaker:'THE HOUSE',bg:'STATIC',isEnd:true},GAME_OVER_INSANITY:{text:['The whispers climb inside your ears.','You let go of the thread.','The Other Mother opens her sewing box.','BAD END.'],speaker:'THE HOUSE',bg:'STATIC',isEnd:true}};
const ui={root:document.getElementById('game-root'),figure:document.getElementById('scene-child'),start:document.getElementById('start-screen'),deck:document.getElementById('control-deck'),box:document.getElementById('dialogue-box'),text:document.getElementById('main-text'),speaker:document.getElementById('speaker-label'),choices:document.getElementById('choices-area'),caret:document.getElementById('continue-caret'),notify:document.getElementById('notify-area'),notifyText:document.getElementById('notify-text'),depth:document.getElementById('depth-val'),sanity:document.getElementById('sanity-val'),depthDisplay:document.getElementById('depth-display'),sanityDisplay:document.getElementById('sanity-display'),braveryDisplay:document.getElementById('bravery-display'),inv:document.getElementById('inventory-list'),typeTimer:null,isTyping:false,fullText:'',showText(text,speaker){this.speaker.textContent=speaker||'THE HOUSE';this.fullText=text;this.text.textContent='';this.isTyping=true;this.caret.classList.add('is-hidden');let i=0;clearInterval(this.typeTimer);this.typeTimer=setInterval(()=>{this.text.textContent+=this.fullText.charAt(i);i++;if(i%2===0)audio.playSfx('blip');if(i>=this.fullText.length)this.finishTyping()},CONFIG.textSpeed)},finishTyping(){clearInterval(this.typeTimer);this.text.textContent=this.fullText;this.isTyping=false;this.caret.classList.remove('is-hidden')},showNotify(msg){this.notifyText.textContent=msg;this.notify.classList.remove('is-hidden');clearTimeout(this._n);this._n=setTimeout(()=>this.notify.classList.add('is-hidden'),1800)}};
let textQueue=[],currentSceneData=null,lastTime=0,loopStarted=false;
function startGame(load=false){ui.start.classList.add('is-hidden');ui.depthDisplay.classList.remove('is-hidden');ui.sanityDisplay.classList.remove('is-hidden');ui.deck.classList.remove('is-transparent');if(load)loadGame();else{const loops=state.loopCount;resetState();state.loopCount=loops;runScene('START')}visual.mode='ROOM';if(!loopStarted){loopStarted=true;requestAnimationFrame(gameLoop)}}
function resetState(){state={depth:0,sanity:100,inventory:[],sceneId:'START',loopCount:state.loopCount||1,flags:{}};updateHUD()}
function updateFigure(mode){ui.figure.className='child';if(mode==='HOLE')ui.figure.classList.add('child--hole');else if(mode==='FALLING')ui.figure.classList.add('child--falling');else if(mode==='REFLECTION')ui.figure.classList.add('child--reflection')}
function updateHUD(){ui.depth.textContent=state.depth;ui.sanity.textContent=Math.max(0,state.sanity);ui.inv.innerHTML=state.inventory.map(i=>`<span>[${i.toUpperCase()}]</span>`).join(' ');ui.braveryDisplay.classList.toggle('warning',state.sanity<30);if(state.sanity<30)visual.glitchIntensity=2}
function runScene(id){if(id==='DEPTH_LOOP_NEXT'){state.depth++;updateHUD();saveGame();id='DEPTH_LOOP'}if(id==='DEPTH_LOOP'){if(state.sanity<=0){runScene('GAME_OVER_INSANITY');return}if(state.depth>=CONFIG.maxDepth){runScene('BOTTOM_REACHED');return}const roll=Math.random();if(state.depth===3&&!state.inventory.includes('blue spool')){runScene('EVENT_FIND_TOY');return}if(state.depth===7){runScene('EVENT_ENTITY');return}if(roll<.3){runScene('EVENT_WHISPERS');return}currentSceneData={text:[`Stitch depth ${state.depth}0m.`,'The tunnel tightens like a sleeve.','Keep descending?'],speaker:'THE HOUSE',bg:'HOLE',choices:[{label:'Descend another stitch',target:'DEPTH_LOOP_NEXT'}]}}else currentSceneData=SCENES[id];state.sceneId=id;if(currentSceneData.bg)visual.mode=currentSceneData.bg;updateFigure(visual.mode);if(currentSceneData.action)currentSceneData.action();if(currentSceneData.effect==='SCARE'){visual.shake=2;visual.glitchIntensity=5;audio.playSfx('scare');ui.showNotify('BUTTON BLINK')}textQueue=[...currentSceneData.text];advanceText()}
function advanceText(){ui.choices.classList.add('is-hidden');if(textQueue.length>0){ui.showText(textQueue.shift(),currentSceneData.speaker)}else{if(currentSceneData.isEnd){if(state.sceneId!=='ENDING_LOOP')audio.playSfx('fail');setTimeout(()=>{ui.start.classList.remove('is-hidden');ui.deck.classList.add('is-transparent');if(state.loopCount>1){document.getElementById('tape-num').textContent=402+state.loopCount;document.getElementById('start-title').textContent='THE LOOP DOOR'}updateFigure('YARD');checkSave()},3000)}else if(currentSceneData.choices)renderChoices(currentSceneData.choices);else if(currentSceneData.next)runScene(currentSceneData.next)}}
function renderChoices(choices){ui.choices.innerHTML='';ui.choices.classList.remove('is-hidden');ui.caret.classList.add('is-hidden');choices.forEach(c=>{if(c.req&&!state.inventory.includes(c.req))return;const b=document.createElement('button');b.className='stitch-btn';b.textContent=`> ${c.label}`;b.addEventListener('click',e=>{e.stopPropagation();audio.playSfx('blip');runScene(c.target)});ui.choices.appendChild(b)})}
ui.deck.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;if(ui.isTyping)ui.finishTyping();else if(ui.choices.classList.contains('is-hidden'))advanceText()});
function saveGame(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function loadGame(){const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{state=JSON.parse(raw)}catch(e){resetState()}updateHUD();runScene(state.sceneId)}else runScene('START')}function checkSave(){document.getElementById('btn-continue').classList.toggle('is-hidden',!localStorage.getItem(STORAGE_KEY))}
document.getElementById('btn-new').addEventListener('click',async()=>{await audio.init();audio.playSfx('blip');startGame(false)});document.getElementById('btn-continue').addEventListener('click',async()=>{await audio.init();audio.playSfx('blip');startGame(true)});document.getElementById('btn-clear').addEventListener('click',()=>{localStorage.removeItem(STORAGE_KEY);audio.playSfx('fail');checkSave()});
function gameLoop(ts){const dt=((ts-lastTime)||16)/1000;lastTime=ts;visual.update(dt);visual.render();document.getElementById('timer-sec').textContent=Math.floor(ts/1000)%10;requestAnimationFrame(gameLoop)}
function setVh(){document.documentElement.style.setProperty('--vh',`${innerHeight*.01}px`)}window.addEventListener('resize',()=>{setVh();visual.resize()});window.addEventListener('load',()=>{setVh();visual.resize();updateFigure('YARD');checkSave();visual.render()});
</script>
