<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE HOLE: LOOP RECORDING</title>
    <!-- [agent-note][stage4] repaired-fonts: title/display kept on catalog Creepster; UI/body remapped to catalog VT323 to remove non-catalog candidates -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --crt-green: #7dff88;
            --crt-green-deep: #1f8c4c;
            --crt-red: #ff5c70;
            --crt-amber: #ffd06b;
            --crt-bg: #020907;
            --panel-bg: rgba(5, 18, 12, 0.82);
            --panel-border: rgba(125, 255, 136, 0.72);
            --panel-glow: 0 0 0.8rem rgba(125, 255, 136, 0.18), inset 0 0 1.2rem rgba(125, 255, 136, 0.08);
            --shadow-abyss: rgba(0, 0, 0, 0.78);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(23, 73, 43, 0.28), transparent 38%),
                linear-gradient(180deg, #04110b 0%, #010403 48%, #000 100%);
            overflow: hidden;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: var(--crt-green);
            letter-spacing: 0.03em;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: saturate(1.05) contrast(1.08);
            touch-action: none;
        }

        button {
            font: inherit;
        }

        /* CRT Effects */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,1) 100%);
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 11;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            position: absolute;
            inset: 0;
            background: rgba(51, 255, 0, 0.02);
            z-index: 12;
        }

        @keyframes flicker {
            0% { opacity: 0.9; }
            50% { opacity: 1.0; }
            100% { opacity: 0.95; }
        }

        /* UI Components */
        .term-box {
            background:
                linear-gradient(180deg, rgba(18, 38, 29, 0.92), rgba(5, 15, 10, 0.94)),
                var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 1rem;
            box-shadow: var(--panel-glow);
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
        }

        .term-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 22%, transparent 70%, rgba(125,255,136,0.07));
            pointer-events: none;
        }

        .term-text {
            text-shadow: 0 0 5px rgba(125, 255, 136, 0.45);
            font-size: clamp(1.05rem, 3vw, 1.35rem);
            line-height: 1.28;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: 600;
        }

        .term-btn {
            background: linear-gradient(180deg, rgba(17, 44, 24, 0.95), rgba(6, 17, 10, 0.95));
            border: 1px solid rgba(125, 255, 136, 0.8);
            color: #d9ffe0;
            text-transform: uppercase;
            text-shadow: 0 0 0.2rem rgba(125, 255, 136, 0.45);
            box-shadow: 0 0 0.7rem rgba(125, 255, 136, 0.12);
            transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
        }
        .term-btn:active {
            background: var(--crt-green);
            color: black;
            box-shadow: 0 0 15px var(--crt-green);
            transform: scale(0.98);
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .glitch-text {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(80px, 9999px, 100px, 0); }
            100% { clip: rect(20px, 9999px, 60px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 80px, 0); }
            20% { clip: rect(10px, 9999px, 40px, 0); }
            100% { clip: rect(90px, 9999px, 110px, 0); }
        }

        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 20px); }

        #game-root {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(52, 127, 78, 0.2), transparent 28%),
                linear-gradient(180deg, #04100b 0%, #010403 100%);
        }

        #game-root::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 78%, rgba(0, 0, 0, 0.62), transparent 28%),
                linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.18));
            z-index: 1;
            pointer-events: none;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.85rem;
            pointer-events: none;
            box-sizing: border-box;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            opacity: 0.95;
            gap: 0.75rem;
        }

        .hud-col {
            display: flex;
            flex-direction: column;
        }

        .hud-col-right {
            align-items: flex-end;
            text-align: right;
        }

        .recording-label {
            font-size: 0.95rem;
            letter-spacing: 0.24em;
            color: var(--crt-amber);
            text-shadow: 0 0 0.35rem rgba(255, 208, 107, 0.38);
            animation: pulse 1.5s infinite;
        }

        .status-secondary {
            color: #8ef0a6;
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .warning-text {
            color: var(--crt-red) !important;
            text-shadow: 0 0 0.45rem rgba(255, 92, 112, 0.38);
        }

        #inventory-list {
            font-size: 0.95rem;
            color: #d2ffc8;
            margin-top: 0.25rem;
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 14rem;
        }

        #notify-area {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 30;
        }

        .notify-title {
            font-family: 'Creepster', fantasy;
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: 0.05em;
            text-align: center;
            color: #ff7c89;
            font-weight: 400;
            padding: 1rem 1.2rem;
            background: rgba(6, 0, 0, 0.82);
            border: 1px solid rgba(255, 92, 112, 0.68);
            border-radius: 1rem;
            box-shadow: 0 0 1.2rem rgba(255, 92, 112, 0.16);
            margin: 0;
        }

        #reaction-gif {
            position: absolute;
            right: 0.8rem;
            bottom: calc(13rem + env(safe-area-inset-bottom, 0px));
            width: min(30vw, 7rem);
            opacity: 0;
            transform: translateY(0.6rem) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 32;
            filter: drop-shadow(0 0 1rem rgba(0, 0, 0, 0.55));
        }

        #reaction-gif.is-active {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        #ending-gif {
            position: absolute;
            left: 50%;
            top: 20%;
            width: min(58vw, 14rem);
            transform: translateX(-50%) scale(0.94);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            z-index: 31;
            border-radius: 1rem;
            box-shadow: 0 0 1.5rem rgba(255, 124, 137, 0.18);
        }

        #ending-gif.is-active {
            opacity: 0.85;
            transform: translateX(-50%) scale(1);
        }

        #control-deck {
            width: 100%;
            max-width: 32rem;
            margin: 0 auto 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .is-hidden {
            display: none !important;
        }

        .is-transparent {
            opacity: 0;
        }

        .dialogue-panel {
            padding: 0.95rem 1rem 1.25rem;
            min-height: 140px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .speaker-tag {
            font-size: 0.95rem;
            color: #9affaf;
            font-weight: 600;
            margin-bottom: 0.35rem;
            border-bottom: 1px solid rgba(125, 255, 136, 0.28);
            padding-bottom: 0.3rem;
            letter-spacing: 0.18em;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        #choices-area {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            background:
                radial-gradient(circle at 50% 18%, rgba(53, 115, 72, 0.22), transparent 28%),
                linear-gradient(180deg, rgba(1, 9, 5, 0.94), rgba(0, 0, 0, 0.98));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .start-title-wrap {
            position: relative;
            margin-bottom: 2rem;
            text-align: center;
        }

        .start-title {
            font-family: 'Creepster', fantasy;
            font-size: clamp(3.2rem, 12vw, 7rem);
            color: #abffb5;
            font-weight: 400;
            line-height: 0.92;
            letter-spacing: 0.03em;
            text-shadow: 0 0 0.8rem rgba(125, 255, 136, 0.35), 0 0 1.8rem rgba(0, 0, 0, 0.95);
            margin: 0;
        }

        .start-subtitle {
            color: #d4ff98;
            font-size: 0.95rem;
            letter-spacing: 0.32em;
            text-align: center;
            margin-top: 0.6rem;
            text-shadow: 0 0 0.35rem rgba(212, 255, 152, 0.3);
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 20rem;
            z-index: 50;
        }

        .start-clear {
            font-size: 0.85rem;
            color: #7fd49b;
            margin-top: 1.35rem;
            text-decoration: underline;
            opacity: 0.7;
            background: transparent;
            border: 0;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: 600;
        }

        .menu-btn {
            padding: 0.9rem 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            letter-spacing: 0.14em;
        }

        .choice-btn {
            padding: 0.75rem 0.9rem;
            text-align: left;
            width: 100%;
            font-size: 1.05rem;
            font-family: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            letter-spacing: 0.08em;
        }

        .scene-figure {
            position: absolute;
            left: 50%;
            bottom: 21%;
            width: min(24vw, 9rem);
            aspect-ratio: 1 / 1.55;
            transform: translateX(-50%);
            z-index: 6;
            pointer-events: none;
            opacity: 0.72;
            filter: drop-shadow(0 0 1rem rgba(125, 255, 136, 0.18));
        }

        .scene-figure::before,
        .scene-figure::after {
            content: "";
            position: absolute;
            inset: auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .scene-figure::before {
            top: 0;
            width: 27%;
            height: 17%;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 35%, rgba(191, 255, 199, 0.95), rgba(75, 165, 92, 0.76) 48%, rgba(4, 12, 8, 0.95) 76%);
            box-shadow: 0 0 1rem rgba(125, 255, 136, 0.2);
        }

        .scene-figure::after {
            top: 12%;
            width: 62%;
            height: 68%;
            clip-path: polygon(50% 0%, 74% 14%, 82% 45%, 100% 100%, 0% 100%, 18% 45%, 26% 14%);
            background:
                linear-gradient(180deg, rgba(145, 255, 160, 0.95), rgba(36, 92, 55, 0.78) 42%, rgba(5, 10, 8, 0.96) 100%);
            border-radius: 28% 28% 14% 14% / 22% 22% 8% 8%;
            box-shadow: inset 0 -0.5rem 0.9rem rgba(0, 0, 0, 0.6);
        }

        .scene-figure__eye {
            position: absolute;
            top: 16%;
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 999px;
            background: #f7fff8;
            box-shadow: 0 0 0.65rem rgba(247, 255, 248, 0.95);
            animation: eyePulse 2.8s ease-in-out infinite;
        }

        .scene-figure__eye--left {
            left: calc(50% - 0.9rem);
        }

        .scene-figure__eye--right {
            left: calc(50% + 0.35rem);
        }

        .scene-figure__ripple {
            position: absolute;
            left: 50%;
            bottom: -8%;
            width: 88%;
            height: 16%;
            transform: translateX(-50%);
            border-radius: 50%;
            border: 1px solid rgba(125, 255, 136, 0.22);
            box-shadow: 0 0 1.2rem rgba(125, 255, 136, 0.12);
            animation: ripplePulse 2.2s ease-in-out infinite;
        }

        .scene-figure--yard {
            bottom: 16%;
            opacity: 0.6;
        }

        .scene-figure--hole {
            bottom: 11%;
            transform: translateX(-50%) scale(0.82);
            opacity: 0.84;
        }

        .scene-figure--falling {
            bottom: 50%;
            transform: translateX(-50%) rotate(-12deg) scale(0.95);
            opacity: 0.78;
            animation: fallingSway 1.8s ease-in-out infinite;
        }

        .scene-figure--reflection {
            bottom: 18%;
            transform: translateX(-50%) scaleY(-1);
            opacity: 0.42;
            filter: blur(0.04rem) drop-shadow(0 0 0.8rem rgba(125, 255, 136, 0.12));
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        @keyframes eyePulse {
            0%, 100% { opacity: 0.55; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        @keyframes ripplePulse {
            0%, 100% { opacity: 0.2; transform: translateX(-50%) scale(0.95); }
            50% { opacity: 0.7; transform: translateX(-50%) scale(1.04); }
        }

        @keyframes fallingSway {
            0%, 100% { transform: translateX(-50%) rotate(-12deg) scale(0.95); }
            50% { transform: translateX(-50%) rotate(12deg) scale(1.02); }
        }

        @media (max-width: 520px) {
            #ui-layer {
                padding: 0.7rem;
            }

            .scene-figure {
                width: min(32vw, 7.2rem);
                bottom: 19%;
            }

            .notify-title {
                padding: 0.85rem 1rem;
            }
        }
    </style>
</head>

<!-- Audio Assets -->
<!-- [agent-note][stage3] resolved-audio: loop/ui/fail/collect/signal -> catalogs/audios.json -->
<!-- [agent-note][playwright-fix] disabled broken ambient loop URL after confirmed 404 during browser pass; keep working one-shot catalog audio -->
<audio id="bgm_loop" loop preload="none"></audio>
<audio id="sfx_ui" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>

<script>
/* 
   ENGINE: VHS-LOOP-CORE 
   "The Hole" Remake - Loop Ending Edition
*/

// --- Constants & Config ---
const CONFIG = {
    textSpeed: 20,
    maxDepth: 10,
    startSanity: 100
};

const STORAGE_KEY = 'hole_vhs_loop_v2';

// --- State Management ---
let state = {
    depth: 0,
    sanity: 100,
    inventory: [], 
    sceneId: 'START',
    loopCount: 1,
    flags: {}
};

// --- Audio System ---
const audio = {
    ctx: null,
    enabled: false,
    lastPlayed: {},
    musicEl: document.getElementById('bgm_loop'),
    sfxEls: {
        ui: document.getElementById('sfx_ui'),
        collect: document.getElementById('sfx_collect'),
        signal: document.getElementById('sfx_signal'),
        fail: document.getElementById('sfx_fail')
    },

    async init() {
        this.enabled = true;
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            await this.ctx.resume();
        }
        this.playLoop();
    },

    playLoop() {
        const el = this.musicEl;
        if (!el || !el.getAttribute('src')) return;
        el.volume = 0.2;
        if (el.paused) {
            el.currentTime = 0;
            el.play().catch(() => {});
        }
    },

    stopLoop() {
        const el = this.musicEl;
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    },

    playElement(name, volume = 0.4, debounce = 100) {
        if (!this.enabled) return;
        const now = performance.now();
        if (this.lastPlayed[name] && now - this.lastPlayed[name] < debounce) return;
        this.lastPlayed[name] = now;
        const el = this.sfxEls[name];
        if (!el) return;
        el.pause();
        el.currentTime = 0;
        el.volume = volume;
        el.play().catch(() => {});
    },

    playSfx(type) {
        if (type === 'blip') {
            this.playElement('ui', 0.28, 70);
        } else if (type === 'scare') {
            this.playElement('signal', 0.5, 350);
        } else if (type === 'collect') {
            this.playElement('collect', 0.42, 180);
        } else if (type === 'fail') {
            this.playElement('fail', 0.45, 250);
        } else if (type === 'rewind') {
            this.playElement('signal', 0.55, 500);
        }
    }
};

// --- Visual Engine (Canvas) ---
const visual = {
    canvas: document.getElementById('worldCanvas'),
    ctx: document.getElementById('worldCanvas').getContext('2d'),
    width: 0,
    height: 0,
    time: 0,
    
    // Visual State
    shake: 0,
    glitchIntensity: 0,
    mode: 'STATIC', // STATIC, ROOM, YARD, HOLE, FALLING, REFLECTION
    
    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    },

    update(dt) {
        this.time += dt;
        if (this.shake > 0) this.shake = Math.max(0, this.shake - 5 * dt);
        if (this.glitchIntensity > 0) this.glitchIntensity = Math.max(0, this.glitchIntensity - 1 * dt);
    },

    render() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // Base Clear
        ctx.fillStyle = '#000500';
        ctx.fillRect(0, 0, w, h);

        // Shake
        const dx = (Math.random() - 0.5) * this.shake * 20;
        const dy = (Math.random() - 0.5) * this.shake * 20;
        ctx.save();
        ctx.translate(dx, dy);

        // Render Scene
        switch(this.mode) {
            case 'ROOM': this.drawRoom(ctx, w, h); break;
            case 'YARD': this.drawYard(ctx, w, h); break;
            case 'HOLE': this.drawHole(ctx, w, h); break;
            case 'FALLING': this.drawFalling(ctx, w, h); break;
            case 'REFLECTION': this.drawReflection(ctx, w, h); break;
            default: this.drawStatic(ctx, w, h); break;
        }

        // Global Noise/Glitch
        this.drawNoise(ctx, w, h);

        ctx.restore();
    },

    drawRoom(ctx, w, h) {
        ctx.strokeStyle = '#154415';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.rect(w*0.1, h*0.2, w*0.8, h*0.6);
        ctx.stroke();
        
        // TV Stand
        ctx.fillStyle = '#0a1a0a';
        ctx.fillRect(w*0.3, h*0.4, w*0.4, h*0.2);
        
        // Static on TV
        ctx.fillStyle = Math.random() > 0.5 ? '#222' : '#111';
        ctx.fillRect(w*0.32, h*0.42, w*0.36, h*0.16);
    },

    drawYard(ctx, w, h) {
        ctx.fillStyle = '#051105';
        ctx.fillRect(0, h*0.4, w, h*0.6);
        
        // The Hole
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(w/2, h*0.6, w*0.35, h*0.12, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Moon/Light source
        ctx.fillStyle = 'rgba(51, 255, 0, 0.1)';
        ctx.beginPath();
        ctx.arc(w*0.8, h*0.2, 30, 0, Math.PI*2);
        ctx.fill();
    },

    drawHole(ctx, w, h) {
        const speed = 100;
        const offset = (this.time * speed) % 100;
        
        ctx.strokeStyle = '#0f2f0f';
        ctx.lineWidth = 1;
        
        // Walls
        ctx.beginPath();
        ctx.moveTo(w*0.15, 0); ctx.lineTo(w*0.15, h);
        ctx.moveTo(w*0.85, 0); ctx.lineTo(w*0.85, h);
        ctx.stroke();

        // Moving ribs
        for(let y = -100; y < h + 100; y+=80) {
            let ry = y + offset;
            ctx.beginPath();
            ctx.moveTo(w*0.15, ry);
            ctx.lineTo(w*0.85, ry);
            ctx.stroke();
        }
        
        // Rope
        ctx.strokeStyle = '#3f2f1f';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(w/2, 0);
        ctx.lineTo(w/2 + Math.sin(this.time)*5, h);
        ctx.stroke();
    },

    drawFalling(ctx, w, h) {
        // High speed walls
        const speed = 800;
        const offset = (this.time * speed) % 200;
        
        ctx.strokeStyle = '#1f4f1f';
        ctx.lineWidth = 2;
        
        // Speed lines
        for(let x=0; x<w; x+=w/10) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
        }

        // Horizontal rush
        for(let y = -200; y < h + 200; y+=100) {
            let ry = y + offset; // Moving DOWN fast means we are falling UP? No, walls move UP.
            // Actually walls move UP to simulate falling DOWN.
            // So offset should decrease or wrap positively.
            let wallY = (h - (this.time * speed) % h + y) % h;
            
            ctx.fillStyle = 'rgba(0, 50, 0, 0.5)';
            ctx.fillRect(0, wallY, w, 10);
        }

        // The Girl (Silhouette)
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.rotate(this.time * 0.5); // Spinning
        ctx.scale(0.5 + Math.sin(this.time*5)*0.1, 0.5); // Distorting
        
        ctx.fillStyle = '#000';
        ctx.strokeStyle = '#3f0';
        ctx.lineWidth = 2;
        
        // Dress/Body
        ctx.beginPath();
        ctx.moveTo(-30, 40);
        ctx.lineTo(30, 40);
        ctx.lineTo(20, -20);
        ctx.lineTo(-20, -20);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Head
        ctx.beginPath();
        ctx.arc(0, -40, 20, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        
        // Arms flailing
        ctx.beginPath();
        ctx.moveTo(-20, -20);
        ctx.lineTo(-50 + Math.sin(this.time*10)*10, -50);
        ctx.moveTo(20, -20);
        ctx.lineTo(50 + Math.cos(this.time*10)*10, -50);
        ctx.stroke();
        
        ctx.restore();
    },

    drawReflection(ctx, w, h) {
        // Watery surface at bottom
        ctx.fillStyle = '#001100';
        ctx.fillRect(0, 0, w, h);
        
        // Reflection Face
        ctx.save();
        ctx.translate(w/2, h/2);
        
        // Glitch offset
        if (Math.random() > 0.9) ctx.translate((Math.random()-0.5)*20, 0);
        
        ctx.strokeStyle = '#3f0';
        ctx.lineWidth = 2;
        
        // Face Outline
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 80, 0, 0, Math.PI*2);
        ctx.stroke();
        
        // Eyes (Empty)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-20, -10, 10, 0, Math.PI*2);
        ctx.arc(20, -10, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        
        // Mouth (Sad/Screaming)
        ctx.beginPath();
        ctx.arc(0, 40, 15, Math.PI, 0);
        ctx.stroke();
        
        // Static overlay on face
        for(let i=0; i<20; i++) {
            ctx.fillStyle = '#3f0';
            ctx.fillRect((Math.random()-0.5)*100, (Math.random()-0.5)*120, 2, 2);
        }
        
        ctx.restore();
    },

    drawStatic(ctx, w, h) {
        for(let i=0; i<200; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
            ctx.fillRect(Math.random()*w, Math.random()*h, Math.random()*3, 2);
        }
    },

    drawNoise(ctx, w, h) {
        const barY = (this.time * 60) % (h + 100) - 50;
        ctx.fillStyle = 'rgba(50, 255, 0, 0.03)';
        ctx.fillRect(0, barY, w, 40);
    }
};

// --- Engine Core ---
const ui = {
    root: document.getElementById('game-root'),
    figure: document.getElementById('scene-figure'),
    start: document.getElementById('start-screen'),
    deck: document.getElementById('control-deck'),
    box: document.getElementById('dialogue-box'),
    text: document.getElementById('main-text'),
    speaker: document.getElementById('speaker-label'),
    choices: document.getElementById('choices-area'),
    caret: document.getElementById('continue-caret'),
    notify: document.getElementById('notify-area'),
    notifyText: document.getElementById('notify-text'),
    reactionGif: document.getElementById('reaction-gif'),
    endingGif: document.getElementById('ending-gif'),
    
    // HUD
    depth: document.getElementById('depth-val'),
    sanity: document.getElementById('sanity-val'),
    depthDisplay: document.getElementById('depth-display'),
    sanityDisplay: document.getElementById('sanity-display'),
    inv: document.getElementById('inventory-list'),
    
    typeTimer: null,
    isTyping: false,
    fullText: "",
    
    showText(text, speaker) {
        this.speaker.textContent = speaker || "SYSTEM";
        this.fullText = text;
        this.text.innerHTML = "";
        this.isTyping = true;
        this.caret.classList.add('is-hidden');
        
        let i = 0;
        clearInterval(this.typeTimer);
        
        this.typeTimer = setInterval(() => {
            this.text.innerHTML += this.fullText.charAt(i);
            i++;
            if (i % 2 === 0) audio.playSfx('blip');
            if (i >= this.fullText.length) {
                this.finishTyping();
            }
        }, CONFIG.textSpeed);
    },
    
    finishTyping() {
        clearInterval(this.typeTimer);
        this.text.innerHTML = this.fullText;
        this.isTyping = false;
        this.caret.classList.remove('is-hidden');
    },
    
    showNotify(msg) {
        this.notifyText.textContent = msg;
        this.notifyText.setAttribute('data-text', msg);
        this.notify.classList.remove('is-hidden');
        setTimeout(() => this.notify.classList.add('is-hidden'), 2000);
    },

    flashGif(el, duration = 1800) {
        if (!el) return;
        el.classList.add('is-active');
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => el.classList.remove('is-active'), duration);
    }
};

// --- Logic Control ---
let textQueue = [];
let currentSceneData = null;

function startGame(load = false) {
    ui.start.classList.add('is-hidden');
    document.getElementById('depth-display').classList.remove('is-hidden');
    document.getElementById('sanity-display').classList.remove('is-hidden');
    ui.deck.classList.remove('is-transparent');
    
    if (load) {
        loadGame();
    } else {
        // Keep loop count if restarting from end
        let loops = state.loopCount;
        resetState();
        state.loopCount = loops;
        runScene('START');
    }
    
    visual.mode = 'ROOM';
    requestAnimationFrame(gameLoop);
}

function resetState() {
    state = {
        depth: 0,
        sanity: 100,
        inventory: [],
        sceneId: 'START',
        loopCount: state.loopCount || 1,
        flags: {}
    };
    updateHUD();
}

function updateFigure(mode) {
    if (!ui.figure) return;
    ui.figure.className = 'scene-figure';
    if (mode === 'YARD') {
        ui.figure.classList.add('scene-figure--yard');
    } else if (mode === 'HOLE') {
        ui.figure.classList.add('scene-figure--hole');
    } else if (mode === 'FALLING') {
        ui.figure.classList.add('scene-figure--falling');
    } else if (mode === 'REFLECTION') {
        ui.figure.classList.add('scene-figure--reflection');
    } else {
        ui.figure.classList.add('scene-figure--yard');
    }
}

function updateHUD() {
    ui.depth.textContent = state.depth;
    ui.sanity.textContent = Math.max(0, state.sanity);
    ui.inv.innerHTML = state.inventory.map(i => `[${i.toUpperCase()}]`).join(' ');
    
    ui.sanityDisplay.classList.toggle('warning-text', state.sanity < 30);

    if (state.sanity < 30) {
        visual.glitchIntensity = 2.0;
    }
}

function runScene(id) {
    if (id === 'DEPTH_LOOP_NEXT') {
        state.depth++;
        updateHUD();
        saveGame();
        id = 'DEPTH_LOOP';
    }

    if (id === 'DEPTH_LOOP') {
        // Sanity Check
        if (state.sanity <= 0) {
            runScene('GAME_OVER_INSANITY');
            return;
        }
        // Win/Loop Check
        if (state.depth >= CONFIG.maxDepth) {
            runScene('BOTTOM_REACHED');
            return;
        }
        
        // Random Event Router
        const roll = Math.random();
        
        // Scripted events by depth
        if (state.depth === 3 && !state.inventory.includes('hairclip')) {
            runScene('EVENT_FIND_TOY');
            return;
        }
        if (state.depth === 7) {
            runScene('EVENT_ENTITY');
            return;
        }
        
        if (roll < 0.3) {
            runScene('EVENT_WHISPERS');
            return;
        }
        
        // Normal Descent
        currentSceneData = {
            text: [`Depth ${state.depth}0m.`, "The shaft tightens around the signal.", "Keep descending?"],
            speaker: "SYSTEM",
            bg: 'HOLE',
            choices: [{ label: "Descend", target: "DEPTH_LOOP_NEXT" }]
        };
    } else {
        currentSceneData = SCENES[id];
    }
    
    state.sceneId = id;
    
    // Apply Effects
    if (currentSceneData.bg) visual.mode = currentSceneData.bg;
    updateFigure(visual.mode);
    if (currentSceneData.action) currentSceneData.action();
    if (currentSceneData.effect === 'SCARE') {
        visual.shake = 2.0;
        visual.glitchIntensity = 5.0;
        audio.playSfx('scare');
        ui.showNotify("SIGNAL SPIKE");
        ui.flashGif(ui.reactionGif, 1900);
    }

    textQueue = [...currentSceneData.text];
    advanceText();
}

function advanceText() {
    ui.choices.classList.add('is-hidden');
    
        if (textQueue.length > 0) {
            const txt = textQueue.shift();
            ui.showText(txt, currentSceneData.speaker);
        } else {
            if (currentSceneData.isEnd) {
                if (state.sceneId === 'ENDING_LOOP') {
                    ui.flashGif(ui.endingGif, 2600);
                } else {
                    ui.flashGif(ui.reactionGif, 1800);
                    audio.playSfx('fail');
                }
                setTimeout(() => {
                    // Return to start with loop effect
                    ui.start.classList.remove('is-hidden');
                    ui.deck.classList.add('is-transparent');
                
                 if (state.loopCount > 1) {
                     document.getElementById('tape-num').textContent = 402 + state.loopCount;
                     document.querySelector('#start-screen h1').setAttribute('data-text', "THE LOOP");
                     document.querySelector('#start-screen h1').textContent = "THE LOOP";
                 }
                 
                 updateFigure('YARD');
                 checkSave();
            }, 3000);
        } else if (currentSceneData.choices) {
            renderChoices(currentSceneData.choices);
        } else if (currentSceneData.next) {
            runScene(currentSceneData.next);
        }
    }
}

function renderChoices(choices) {
    ui.choices.innerHTML = '';
    ui.choices.classList.remove('is-hidden');
    ui.caret.classList.add('is-hidden');
    
    choices.forEach(c => {
        if (c.req && !state.inventory.includes(c.req)) return;
        
        const btn = document.createElement('button');
        btn.className = "term-btn choice-btn";
        btn.textContent = `> ${c.label}`;
        btn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            audio.playSfx('blip');
            runScene(c.target);
        });
        ui.choices.appendChild(btn);
    });
}

// --- Input Handling ---
ui.deck.addEventListener('pointerdown', (e) => {
    // Prevent double firing if clicking a button
    if (e.target.tagName === 'BUTTON') return;
    
    if (ui.isTyping) {
        ui.finishTyping();
    } else if (ui.choices.classList.contains('is-hidden')) {
        advanceText();
    }
});

// --- Save System ---
function saveGame() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadGame() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        state = JSON.parse(raw);
        updateHUD();
        runScene(state.sceneId);
    }
}

function checkSave() {
    const hasSave = !!localStorage.getItem(STORAGE_KEY);
    if (hasSave) {
        document.getElementById('btn-continue').classList.remove('is-hidden');
    } else {
        document.getElementById('btn-continue').classList.add('is-hidden');
    }
}

document.getElementById('btn-new').addEventListener('click', async () => {
    await audio.init();
    audio.playSfx('blip');
    startGame(false);
});

document.getElementById('btn-continue').addEventListener('click', async () => {
    await audio.init();
    audio.playSfx('blip');
    startGame(true);
});

document.getElementById('btn-clear').addEventListener('click', () => {
    audio.playSfx('fail');
    localStorage.removeItem(STORAGE_KEY);
    checkSave();
});

// --- Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    
    visual.update(dt);
    visual.render();
    
    // Timer Effect
    document.getElementById('timer-sec').textContent = Math.floor(timestamp / 1000) % 10;
    
    requestAnimationFrame(gameLoop);
}

// --- Init ---
window.addEventListener('resize', () => visual.resize());
window.onload = () => {
    visual.resize();
    updateFigure('YARD');
    checkSave();
    
    // Mobile height fix
    const setVh = () => {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    };
    window.addEventListener('resize', setVh);
    setVh();
};
