<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Work All Day: The Grind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #12081f;
            --bg-bottom: #221039;
            --panel: rgba(21, 18, 42, 0.84);
            --panel-strong: rgba(28, 24, 56, 0.94);
            --panel-edge: rgba(120, 250, 255, 0.28);
            --text: #f5f4ff;
            --muted: #b5b6d8;
            --money: #7dff87;
            --money-glow: rgba(125, 255, 135, 0.5);
            --danger: #ff6487;
            --danger-glow: rgba(255, 100, 135, 0.5);
            --warning: #ffb84d;
            --cyan: #6df6ff;
            --shadow: rgba(0, 0, 0, 0.42);
            --font-display: 'Audiowide', 'Trebuchet MS', sans-serif;
            --font-ui: 'Rajdhani', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(109, 246, 255, 0.08), transparent 34%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--text);
            font-family: var(--font-ui);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 16%),
                radial-gradient(circle at 80% 18%, rgba(125, 255, 135, 0.12), transparent 18%),
                radial-gradient(circle at 50% 82%, rgba(109, 246, 255, 0.1), transparent 26%);
            opacity: 0.9;
        }

        body::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 16%, transparent 84%, rgba(255,255,255,0.04));
            mix-blend-mode: screen;
            opacity: 0.35;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-shell {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        .glass {
            background:
                linear-gradient(180deg, rgba(28, 24, 56, 0.86), rgba(17, 14, 35, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 20px 40px var(--shadow);
        }

        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0.24;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.01) 50%, rgba(0,0,0,0.12) 100%);
            background-size: 100% 6px;
            mix-blend-mode: screen;
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle, transparent 45%, rgba(0, 0, 0, 0.32) 100%);
        }

        #player-sprite {
            position: absolute;
            width: 94px;
            height: 94px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border-radius: 28px;
            border: 2px solid rgba(109, 246, 255, 0.34);
            background:
                radial-gradient(circle at 50% 35%, rgba(255,255,255,0.16), transparent 40%),
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.1));
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow:
                0 0 0 4px rgba(255,255,255,0.04),
                0 0 28px rgba(109, 246, 255, 0.18),
                0 0 46px rgba(125, 255, 135, 0.22);
            filter: drop-shadow(0 0 16px rgba(125, 255, 135, 0.32));
        }

        #player-sprite::before,
        #player-sprite::after {
            content: "";
            position: absolute;
            pointer-events: none;
        }

        #player-sprite::before {
            inset: -10px 14px auto 14px;
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(109,246,255,0.2), rgba(255,255,255,0.7), rgba(125,255,135,0.2));
            filter: blur(2px);
            opacity: 0.85;
        }

        #player-sprite::after {
            left: 50%;
            bottom: -12px;
            width: 78%;
            height: 16px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(125, 255, 135, 0.34), transparent 70%);
        }

        .hidden { display: none !important; }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(12px, env(safe-area-inset-top)) 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
            z-index: 20;
        }

        .hud-cluster {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .hud-cluster.right {
            align-items: flex-end;
            width: min(38vw, 180px);
        }

        .hud-card {
            min-width: 120px;
            padding: 10px 12px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(13, 16, 34, 0.8), rgba(28, 24, 56, 0.92));
            border: 1px solid var(--panel-edge);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 10px 24px rgba(0,0,0,0.25);
        }

        .hud-label {
            font-size: 11px;
            letter-spacing: 0.28em;
            color: var(--muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .hud-value {
            font-family: var(--font-display);
            font-size: clamp(28px, 6vw, 42px);
            line-height: 0.95;
            letter-spacing: 0.05em;
            color: var(--money);
            text-shadow: 0 0 12px var(--money-glow);
        }

        .meter-track {
            width: 100%;
            height: 16px;
            margin-top: 2px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(9, 11, 25, 0.82);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #62ffa7, #d2ff72);
            box-shadow: 0 0 12px rgba(210,255,114,0.35);
            transition: width 200ms ease;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)) 18px;
        }

        .menu-panel {
            width: min(100%, 420px);
            max-height: min(90vh, 720px);
            padding: 22px 18px 18px;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .menu-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(109,246,255,0.18), transparent 35%),
                radial-gradient(circle at bottom, rgba(125,255,135,0.14), transparent 32%);
            pointer-events: none;
        }

        .menu-content {
            position: relative;
            z-index: 1;
            width: 100%;
            overflow-y: auto;
        }

        .character-badge {
            width: 104px;
            height: 104px;
            margin: 0 auto 14px;
            border-radius: 28px;
            display: grid;
            place-items: center;
            font-size: 54px;
            border: 1px solid rgba(255,255,255,0.16);
            background:
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.2), transparent 34%),
                linear-gradient(180deg, rgba(109,246,255,0.18), rgba(125,255,135,0.1) 55%, rgba(255,100,135,0.12));
            box-shadow:
                0 0 0 6px rgba(255,255,255,0.03),
                0 0 24px rgba(109,246,255,0.24);
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.34em;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .title {
            margin: 0 0 8px;
            font-family: var(--font-display);
            font-size: clamp(44px, 14vw, 82px);
            line-height: 0.9;
            letter-spacing: 0.04em;
            color: #fff7cf;
            text-shadow:
                0 3px 0 rgba(0, 0, 0, 0.35),
                0 0 18px rgba(255, 184, 77, 0.22);
        }

        .title-accent { color: var(--money); }

        .subtitle {
            margin: 0 0 18px;
            font-size: 14px;
            letter-spacing: 0.26em;
            color: var(--muted);
            text-transform: uppercase;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .brief-card {
            margin: 0 0 18px;
            padding: 16px 14px;
            border-radius: 22px;
            background: rgba(8, 10, 23, 0.58);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .brief-label {
            margin: 0 0 8px;
            color: var(--cyan);
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .brief-line {
            margin: 0 0 8px;
            font-size: 16px;
            line-height: 1.4;
            color: var(--text);
            font-family: var(--font-ui);
        }

        .brief-line:last-child { margin-bottom: 0; }

        .money-text { color: var(--money); }
        .danger-text { color: #ff90a7; }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 18px;
        }

        .chip {
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            font-family: var(--font-ui);
            font-weight: 600;
        }

        .primary-btn,
        .secondary-btn {
            appearance: none;
            border: none;
            width: 100%;
            max-width: 280px;
            padding: 15px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-family: var(--font-display);
            letter-spacing: 0.07em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease, background 160ms ease, color 160ms ease;
        }

        .primary-btn {
            background: linear-gradient(180deg, #c8ff63, #62ff94);
            color: #1a102f;
            font-size: clamp(22px, 6vw, 30px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.18) inset,
                0 12px 24px rgba(98,255,148,0.22),
                0 0 24px rgba(125,255,135,0.34);
        }

        .secondary-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            font-size: clamp(20px, 5.2vw, 26px);
            border: 1px solid rgba(255,255,255,0.16);
        }

        .primary-btn:hover,
        .secondary-btn:hover,
        .primary-btn:focus-visible,
        .secondary-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.04);
            outline: none;
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.98);
        }

        .feedback-gif {
            position: absolute;
            right: 12px;
            bottom: max(14px, env(safe-area-inset-bottom));
            width: min(28vw, 116px);
            height: min(28vw, 116px);
            border-radius: 18px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(10, 10, 18, 0.42);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3),
                0 0 22px rgba(109, 246, 255, 0.18);
            z-index: 18;
            pointer-events: none;
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            left: 12px;
            right: auto;
            border-color: rgba(255,100,135,0.35);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.34),
                0 0 22px rgba(255,100,135,0.2);
        }

        .feedback-caption {
            position: absolute;
            bottom: calc(max(14px, env(safe-area-inset-bottom)) + min(28vw, 116px) + 8px);
            right: 12px;
            z-index: 19;
            max-width: min(38vw, 170px);
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(15, 18, 37, 0.75);
            color: var(--text);
            font-family: var(--font-ui);
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-caption.fail {
            right: auto;
            left: 12px;
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @media (max-width: 640px) {
            #player-sprite {
                width: 82px;
                height: 82px;
                border-radius: 24px;
            }

            .hud {
                padding-left: 10px;
                padding-right: 10px;
                gap: 8px;
            }

            .hud-card {
                min-width: 0;
                padding: 9px 10px;
                border-radius: 16px;
            }

            .hud-label {
                font-size: 10px;
                letter-spacing: 0.22em;
            }

            .meter-track { height: 14px; }

            .menu-panel {
                padding: 18px 14px 14px;
                border-radius: 24px;
            }

            .brief-line { font-size: 15px; }

            .feedback-gif {
                width: min(26vw, 92px);
                height: min(26vw, 92px);
                border-radius: 14px;
            }

            .feedback-caption {
                bottom: calc(max(14px, env(safe-area-inset-bottom)) + min(26vw, 92px) + 6px);
                max-width: 42vw;
                font-size: 10px;
                letter-spacing: 0.1em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .shake,
            .primary-btn,
            .secondary-btn,
            .meter-fill,
            .feedback-gif,
            .feedback-caption {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<div id="assets" style="display: none;">
    <img id="asset_player" data-editable="image" data-label="Streamer Avatar (GIF)" src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.gif" alt="">
    <img id="gif_hype" data-editable="image" data-label="Hype Reaction GIF" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif" alt="">
    <img id="gif_fail" data-editable="image" data-label="Fail Reaction GIF" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.gif" alt="">
    <audio id="bgm_main" data-editable="audio" data-label="BGM (Gameplay Loop)" src="https://gamezone-virid.vercel.app/assets/audios/music/music_loop_02.mp3" loop preload="auto"></audio>
    <audio id="sfx_coin" data-editable="audio" data-label="SFX (Pickup)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
    <audio id="sfx_hit" data-editable="audio" data-label="SFX (Damage)" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
    <audio id="sfx_ui" data-editable="audio" data-label="SFX (UI Start)" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
    <!-- [agent-note][stage3] resolved-audio: pickup/damage/ui/bgm -> catalogs/audios.json -->
    <!-- [agent-note][stage3] resolved-gif: reward/fail feedback -> catalogs/gifs.json -->
    <!-- [agent-note][stage3] resolved-font: title-display/ui-body -> catalogs/fonts.json -->
</div>

<!-- Config -->
<script id="game-config" type="application/x-game-config">
{
    "heroSpeed": { "type": "number", "label": "Move Sensitivity", "value": 1.5, "min": 0.5, "max": 3 },
    "spawnRate": { "type": "number", "label": "Workload Intensity", "value": 1.0, "min": 0.5, "max": 2.0 },
    "themeColor": { "type": "color", "label": "Money Color", "value": "#48bb78" }
}
</script>

<!-- UI -->
<div id="game-container" class="game-shell">
    <canvas id="gameCanvas"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <!-- Player DOM Overlay (for GIF support) -->
    <div id="player-sprite" class="hidden"></div>

    <!-- HUD -->
    <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled without moving gameplay blocks -->
    <div id="hud" class="hud hidden">
        <div class="hud-cluster">
            <div class="hud-card">
                <span class="hud-label">Hype Bank</span>
                <span id="score-display" class="hud-value">$0</span>
            </div>
        </div>
        <div class="hud-cluster right">
            <div class="hud-card" style="width:100%;">
                <span class="hud-label">Drama</span>
                <div class="meter-track">
                    <div id="health-bar" class="meter-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <img id="success-gif" class="feedback-gif hidden" src="https://i.giphy.com/B2sgQeOCaBDnMfMgXy.gif" alt="Reward reaction">
    <div id="success-caption" class="feedback-caption hidden">Hype spike!</div>
    <img id="fail-gif" class="feedback-gif fail hidden" src="https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.gif" alt="Fail reaction">
    <div id="fail-caption" class="feedback-caption fail hidden">Inbox meltdown!</div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen glass">
        <div class="menu-panel">
            <div class="menu-content">
                <div class="character-badge" aria-hidden="true">😎</div>
                <p class="eyebrow">Stream Hustle Hero</p>
                <h1 class="title">Go <span class="title-accent">Viral</span></h1>
                <p class="subtitle">Meme arcade meltdown</p>

                <div class="brief-card">
                    <p class="brief-label">Brief</p>
                    <p class="brief-line">Drag your avatar to catch <span class="money-text">hype drops</span>.</p>
                    <p class="brief-line">Dodge <span class="danger-text">doom emails</span> and <span class="danger-text">calendar traps</span>.</p>
                </div>

                <div class="chip-row" aria-hidden="true">
                    <span class="chip">💸 cash combo</span>
                    <span class="chip">📧 inbox panic</span>
                    <span class="chip">📅 crunch mode</span>
                </div>

                <button id="start-btn" class="primary-btn">Start Stream</button>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay-screen glass hidden">
        <div class="menu-panel">
            <div class="menu-content">
                <div class="character-badge" aria-hidden="true">😵</div>
                <p class="eyebrow" style="color:#ff90a7;">Public collapse</p>
                <h2 class="title" style="font-size:clamp(40px,12vw,72px); color:#ff8ca4;">Cancelled</h2>
                <div class="brief-card" style="margin-bottom:18px;">
                    <p class="brief-label">Final hype bank</p>
                    <span id="final-score" class="hud-value" style="display:block; color:#fff;">$0</span>
                </div>
                <button id="restart-btn" class="secondary-btn">Go Live Again</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * Core Game Logic
 */
document.addEventListener('DOMContentLoaded', () => {
    const ENABLE_ANIMATIONS = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // --- Config & State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const playerSprite = document.getElementById('player-sprite');
    const gameContainer = document.getElementById('game-container');
    const successGif = document.getElementById('success-gif');
    const failGif = document.getElementById('fail-gif');
    const successCaption = document.getElementById('success-caption');
    const failCaption = document.getElementById('fail-caption');

    // Editable Config
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    Object.keys(window.gameConfigDefs).forEach(k => window.gameConfig[k] = window.gameConfigDefs[k].value);

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    // Game State
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let health = 0; // 0 to 100 (Stress)
    let lastTime = 0;

    // Physics
    const physics = {
        playerX: 0.5, // 0 to 1
        targetX: 0.5,
        items: [],
        particles: [],
        spawnTimer: 0,
        difficulty: 1
    };

    // Assets
    const assets = {
        playerImg: document.getElementById('asset_player'),
        gifHype: document.getElementById('gif_hype'),
        gifFail: document.getElementById('gif_fail'),
        bgm: document.getElementById('bgm_main'),
        sfxCoin: document.getElementById('sfx_coin'),
        sfxHit: document.getElementById('sfx_hit'),
        sfxUi: document.getElementById('sfx_ui')
    };

    // --- Audio System ---
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContextClass ? new AudioContextClass() : null;
    const sounds = {};
    const sfxCooldowns = {};
    let bgmStarted = false;

    if (assets.bgm) {
        assets.bgm.volume = 0.2;
    }

    async function loadSound(id, element) {
        if (!audioCtx || !element) return;
        try {
            const response = await fetch(element.src);
            const arrayBuffer = await response.arrayBuffer();
            sounds[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, fallback enabled', e);
            sounds[id] = 'fallback';
        }
    }

    function playFallback(type = 'beep') {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(780, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1180, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.055, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.14);
        } else if (type === 'ui') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(640, audioCtx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.24);
            gain.gain.setValueAtTime(0.065, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.24);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.24);
        }
    }

    function playSound(id, type = 'beep', cooldownMs = 0, volume = 0.28) {
        if (gameState === 'START' && id !== 'ui') return;
        const now = performance.now();
        if (cooldownMs > 0 && sfxCooldowns[id] && now - sfxCooldowns[id] < cooldownMs) return;
        sfxCooldowns[id] = now;

        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }

        if (sounds[id] && sounds[id] !== 'fallback') {
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            gain.gain.value = volume;
            source.buffer = sounds[id];
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(0);
        } else {
            playFallback(type);
        }
    }

    function ensureBgm() {
        if (!assets.bgm || bgmStarted) return;
        bgmStarted = true;
        assets.bgm.currentTime = 0;
        assets.bgm.play().catch(() => {
            bgmStarted = false;
        });
    }

    function stopBgm() {
        if (!assets.bgm) return;
        assets.bgm.pause();
        assets.bgm.currentTime = 0;
        bgmStarted = false;
    }

    function unlockAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        ensureBgm();
    }

    Promise.all([
        loadSound('coin', assets.sfxCoin),
        loadSound('hit', assets.sfxHit),
        loadSound('ui', assets.sfxUi)
    ]);

    // --- Feedback GIFs ---
    let feedbackTimeout = null;

    function hideFeedback() {
        [successGif, failGif, successCaption, failCaption].forEach(el => {
            el.classList.remove('visible');
            el.classList.add('hidden');
        });
    }

    function showFeedback(type) {
        clearTimeout(feedbackTimeout);
        const gifEl = type === 'success' ? successGif : failGif;
        const captionEl = type === 'success' ? successCaption : failCaption;
        const otherGif = type === 'success' ? failGif : successGif;
        const otherCaption = type === 'success' ? failCaption : successCaption;

        otherGif.classList.remove('visible');
        otherGif.classList.add('hidden');
        otherCaption.classList.remove('visible');
        otherCaption.classList.add('hidden');

        gifEl.classList.remove('hidden');
        captionEl.classList.remove('hidden');

        requestAnimationFrame(() => {
            gifEl.classList.add('visible');
            captionEl.classList.add('visible');
        });

        feedbackTimeout = setTimeout(() => {
            gifEl.classList.remove('visible');
            captionEl.classList.remove('visible');
            gifEl.classList.add('hidden');
            captionEl.classList.add('hidden');
        }, type === 'success' ? 900 : 1100);
    }

    // --- Resize Handling ---
    let cw, ch;
    function resize() {
        cw = window.innerWidth;
        ch = window.innerHeight;
        canvas.width = cw * window.devicePixelRatio;
        canvas.height = ch * window.devicePixelRatio;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const rect = canvas.getBoundingClientRect();
        const x = (clientX - rect.left) / cw;
        physics.targetX = Math.max(0.1, Math.min(0.9, x));
    }

    canvas.addEventListener('pointerdown', (e) => {
        unlockAudio();
        canvas.setPointerCapture(e.pointerId);
        handleInput(e);
    }, { passive: false });

    canvas.addEventListener('pointermove', handleInput, { passive: false });

    // --- Game Objects ---
    class Item {
        constructor() {
            this.x = Math.random() * 0.8 + 0.1;
            this.y = -0.1;
            this.type = Math.random() > 0.3 ? 'money' : 'hazard';
            this.speed = (Math.random() * 0.2 + 0.3) * physics.difficulty;
            this.size = 0.06;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 5;

            if (this.type === 'money') {
                this.val = 100;
                this.color = window.gameConfig.themeColor;
                this.symbol = '$';
            } else {
                this.val = -20;
                this.color = '#f56565';
                this.symbol = Math.random() > 0.5 ? '📧' : '📅';
            }
        }

        update(dt) {
            this.y += this.speed * dt;
            this.rotation += this.rotSpeed * dt;
        }

        draw(ctx, cw, ch) {
            ctx.save();
            ctx.translate(this.x * cw, this.y * ch);
            ctx.rotate(this.rotation);

            if (this.type === 'money') {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 18;
                ctx.font = `bold ${ch * 0.05}px Audiowide`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.beginPath();
                ctx.roundRect(-ch * 0.022, -ch * 0.03, ch * 0.044, ch * 0.06, 10);
                ctx.fillStyle = 'rgba(20, 28, 26, 0.82)';
                ctx.fill();

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = this.color;
                ctx.fillText('$', 0, 0);
            } else {
                ctx.font = `${ch * 0.05}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.beginPath();
                ctx.arc(0, 0, ch * 0.028, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 10, 20, 0.78)';
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 100, 135, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillText(this.symbol, 0, 0);
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, text = null) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.text = text;
            this.life = 1.0;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = text ? -0.5 : (Math.random() - 0.5) * 0.5;
        }

        update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= dt * 1.5;
        }

        draw(ctx, cw, ch) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life);
            if (this.text) {
                ctx.fillStyle = this.color;
                ctx.font = `bold ${ch * 0.032}px Audiowide`;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x * cw, this.y * ch);
            } else {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x * cw, this.y * ch, cw * 0.005, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    // --- Core Loop ---
    function gameLoop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;

        if (gameState === 'PLAYING') {
            update(dt);
        }
        draw(time);
        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        const lerpFactor = Math.min(1, window.gameConfig.heroSpeed * dt * 5);
        physics.playerX += (physics.targetX - physics.playerX) * lerpFactor;

        physics.difficulty = 1 + (score / 5000);

        physics.spawnTimer += dt;
        const spawnInterval = 0.8 / (window.gameConfig.spawnRate * Math.sqrt(physics.difficulty));
        if (physics.spawnTimer > spawnInterval) {
            physics.items.push(new Item());
            physics.spawnTimer = 0;
        }

        for (let i = physics.items.length - 1; i >= 0; i--) {
            const item = physics.items[i];
            item.update(dt);

            const dx = (item.x - physics.playerX) * cw;
            const dy = (item.y - 0.85) * ch;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < cw * 0.08) {
                if (item.type === 'money') {
                    score += item.val;
                    playSound('coin', 'coin', 80, 0.22);
                    physics.particles.push(new Particle(item.x, item.y, '#7dff87', '+$100'));
                    showFeedback('success');
                } else {
                    health += 25;
                    playSound('hit', 'hit', 140, 0.26);
                    if (ENABLE_ANIMATIONS) {
                        gameContainer.classList.add('shake');
                        setTimeout(() => gameContainer.classList.remove('shake'), 500);
                    }
                    physics.particles.push(new Particle(item.x, item.y, '#ff6487', 'DRAMA!'));
                    showFeedback('fail');
                }
                physics.items.splice(i, 1);
                updateHUD();
            } else if (item.y > 1.1) {
                physics.items.splice(i, 1);
            }
        }

        for (let i = physics.particles.length - 1; i >= 0; i--) {
            physics.particles[i].update(dt);
            if (physics.particles[i].life <= 0) physics.particles.splice(i, 1);
        }

        if (health >= 100) {
            gameOver();
        }

        playerSprite.style.left = (physics.playerX * 100) + '%';
        playerSprite.style.top = '85%';

        if (assets.playerImg.src && playerSprite.style.backgroundImage !== `url("${assets.playerImg.src}")`) {
            playerSprite.style.backgroundImage = `url("${assets.playerImg.src}")`;
        }
    }

    function draw(time) {
        const pulse = (Math.sin(time * 0.002) + 1) * 0.5;

        const bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
        bgGradient.addColorStop(0, '#12081f');
        bgGradient.addColorStop(0.5, '#1b1031');
        bgGradient.addColorStop(1, '#26133f');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, cw, ch);

        const horizonGlow = ctx.createRadialGradient(cw * 0.5, ch * 0.12, 10, cw * 0.5, ch * 0.12, ch * 0.9);
        horizonGlow.addColorStop(0, 'rgba(109,246,255,0.16)');
        horizonGlow.addColorStop(0.4, 'rgba(109,246,255,0.05)');
        horizonGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = horizonGlow;
        ctx.fillRect(0, 0, cw, ch);

        ctx.strokeStyle = 'rgba(109,246,255,0.10)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        const gridSize = Math.max(38, Math.min(60, cw * 0.08));
        const offset = (time / 38) % gridSize;
        for (let y = offset; y < ch; y += gridSize) {
            ctx.moveTo(0, y);
            ctx.lineTo(cw, y);
        }
        for (let x = 0; x <= cw; x += cw / 10) {
            ctx.moveTo(x, 0);
            ctx.lineTo((x - cw / 2) * 4 + cw / 2, ch);
        }
        ctx.stroke();

        ctx.fillStyle = `rgba(255, 184, 77, ${0.05 + pulse * 0.05})`;
        ctx.beginPath();
        ctx.arc(cw * 0.18, ch * 0.16, Math.min(cw, ch) * 0.08, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(125, 255, 135, ${0.04 + pulse * 0.06})`;
        ctx.beginPath();
        ctx.arc(cw * 0.82, ch * 0.22, Math.min(cw, ch) * 0.06, 0, Math.PI * 2);
        ctx.fill();

        physics.items.forEach(item => item.draw(ctx, cw, ch));
        physics.particles.forEach(p => p.draw(ctx, cw, ch));

        if (gameState === 'PLAYING') {
            const footerGlow = ctx.createLinearGradient(0, ch * 0.68, 0, ch);
            footerGlow.addColorStop(0, 'rgba(0,0,0,0)');
            footerGlow.addColorStop(1, 'rgba(0,0,0,0.26)');
            ctx.fillStyle = footerGlow;
            ctx.fillRect(0, ch * 0.68, cw, ch * 0.32);
        }
    }

    function updateHUD() {
        document.getElementById('score-display').innerText = '$' + score.toLocaleString();
        const healthBar = document.getElementById('health-bar');
        healthBar.style.width = health + '%';

        if (health > 70) {
            healthBar.style.background = 'linear-gradient(90deg, #ff6487, #ff8f68)';
            healthBar.style.boxShadow = '0 0 12px rgba(255,100,135,0.5)';
        } else if (health > 40) {
            healthBar.style.background = 'linear-gradient(90deg, #ffb84d, #ffd56a)';
            healthBar.style.boxShadow = '0 0 12px rgba(255,184,77,0.45)';
        } else {
            healthBar.style.background = 'linear-gradient(90deg, #62ffa7, #d2ff72)';
            healthBar.style.boxShadow = '0 0 12px rgba(125,255,135,0.38)';
        }
    }

    function startGame() {
        score = 0;
        health = 0;
        physics.items = [];
        physics.particles = [];
        physics.playerX = 0.5;
        physics.targetX = 0.5;
        physics.difficulty = 1;
        gameState = 'PLAYING';

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        playerSprite.classList.remove('hidden');
        hideFeedback();
        unlockAudio();
        playSound('ui', 'ui', 120, 0.22);

        updateHUD();
        ensureBgm();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        playerSprite.classList.add('hidden');
        document.getElementById('final-score').innerText = '$' + score.toLocaleString();
        stopBgm();
        playSound('hit', 'hit', 0, 0.3);
        showFeedback('fail');
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        playSound('ui', 'ui', 120, 0.18);
        startGame();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (assets.bgm) assets.bgm.pause();
        } else if (gameState === 'PLAYING') {
            ensureBgm();
        }
    });

    hideFeedback();
    requestAnimationFrame(gameLoop);
});
</script>
</body>
</html>
