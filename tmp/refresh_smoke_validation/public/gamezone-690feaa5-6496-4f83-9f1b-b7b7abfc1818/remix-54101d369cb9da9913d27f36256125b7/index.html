<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Skyway Rush 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600;700&display=swap');

        :root {
            --panel-bg: rgba(10, 18, 38, 0.72);
            --panel-border: rgba(125, 211, 252, 0.35);
            --text-main: #ffffff;
            --text-soft: #dbeafe;
            --accent-cyan: #67e8f9;
            --accent-blue: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-red: #fb7185;
            --accent-yellow: #fde047;
            --shadow-heavy: 0 12px 38px rgba(2, 6, 23, 0.55);
            --runway-glow: rgba(103, 232, 249, 0.24);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(circle at top, #0f3a68 0%, #081222 38%, #030712 100%);
            color: var(--text-main);
            font-family: "Exo 2", Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .glass-panel {
            background:
                linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(8, 15, 31, 0.78));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow-heavy);
        }

        .modal {
            width: min(92vw, 540px);
            padding: 2.5rem 2rem;
            border-radius: 2rem;
            text-align: center;
            pointer-events: auto;
            transition: transform 300ms ease, box-shadow 300ms ease;
            position: relative;
            overflow: hidden;
        }

        .modal::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(103, 232, 249, 0.2), transparent 45%),
                linear-gradient(135deg, rgba(129, 140, 248, 0.12), transparent 55%);
            pointer-events: none;
        }

        .modal > * {
            position: relative;
            z-index: 1;
        }

        .modal:hover {
            transform: translateY(-4px) scale(1.01);
        }

        .hidden {
            display: none !important;
        }

        .hero-icon {
            margin-bottom: 1rem;
            font-size: clamp(3rem, 8vw, 4.5rem);
            filter: drop-shadow(0 0 14px rgba(103, 232, 249, 0.5));
            animation: hoverBob 2.2s ease-in-out infinite;
        }

        .title {
            margin: 0 0 0.5rem;
            font-family: "Orbitron", "Exo 2", sans-serif;
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            line-height: 0.95;
            letter-spacing: 0.12em;
            text-shadow: 0 6px 24px rgba(8, 15, 31, 0.52);
        }

        .text-gradient {
            background: linear-gradient(to bottom, #ffffff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 0 0 1.25rem;
            color: var(--text-soft);
            font-size: clamp(1rem, 3vw, 1.25rem);
            letter-spacing: 0.08em;
            opacity: 0.95;
            text-transform: uppercase;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .instruction {
            margin: 0 0 1.75rem;
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .flight-badges {
            display: flex;
            justify-content: center;
            gap: 0.65rem;
            flex-wrap: wrap;
            margin: 0 0 1.4rem;
        }

        .flight-badge {
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(125, 211, 252, 0.25);
            background: rgba(14, 116, 144, 0.18);
            color: #e0f2fe;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .primary-btn, .secondary-btn {
            border: 0;
            border-radius: 999px;
            font-family: "Exo 2", Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, filter 180ms ease;
        }

        .primary-btn {
            padding: 1rem 2.5rem;
            color: #fff;
            font-size: 1.05rem;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-cyan));
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.25);
        }

        .secondary-btn {
            padding: 0.9rem 2rem;
            color: #f8fafc;
            font-size: 1rem;
            background: linear-gradient(90deg, #1e293b, #334155);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
        }

        .primary-btn:hover, .secondary-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .game-over-title {
            margin: 0 0 0.5rem;
            color: var(--accent-red);
            font-family: "Orbitron", "Exo 2", sans-serif;
            font-size: clamp(2rem, 7vw, 3.5rem);
            letter-spacing: 0.08em;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
        }

        .score-summary {
            margin: 0 0 1.75rem;
            font-size: 1.35rem;
            color: #fff;
        }

        .score-summary strong {
            color: var(--accent-yellow);
        }

        .hud {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .hud-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem 1.2rem;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 1.45rem);
            box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.15), 0 0 22px rgba(56, 189, 248, 0.18);
        }

        .tutorial {
            position: absolute;
            left: 50%;
            bottom: max(1.5rem, calc(env(safe-area-inset-bottom) + 0.75rem));
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 12px rgba(103, 232, 249, 0.28);
            animation: bounce 1.1s ease-in-out infinite;
        }

        .feedback-gif {
            position: absolute;
            right: max(0.85rem, env(safe-area-inset-right));
            bottom: max(5.4rem, calc(env(safe-area-inset-bottom) + 1rem));
            width: min(30vw, 140px);
            border-radius: 1rem;
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: var(--shadow-heavy);
            background: rgba(8, 15, 31, 0.7);
            object-fit: cover;
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 5;
        }

        .feedback-gif.visible {
            opacity: 0.95;
            transform: translateY(0) scale(1);
        }

        .feedback-caption {
            position: absolute;
            right: max(1rem, env(safe-area-inset-right));
            bottom: max(3.3rem, calc(env(safe-area-inset-bottom) + 0.4rem));
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            background: rgba(8, 15, 31, 0.78);
            border: 1px solid rgba(125, 211, 252, 0.25);
            font-family: "Orbitron", "Exo 2", sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #dbeafe;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
            z-index: 5;
        }

        .feedback-caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.68; }
            50% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-7px); }
        }

        @keyframes hoverBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (max-width: 640px) {
            .modal {
                padding: 2rem 1.25rem;
                border-radius: 1.5rem;
            }

            .instruction {
                font-size: 0.92rem;
            }

            .primary-btn, .secondary-btn {
                width: 100%;
            }

            .score-summary {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="ui-layer">
            <div id="start-screen" class="glass-panel modal">
                <div class="hero-icon">✈️</div>
                <h1 class="title text-gradient">SKYWAY RUSH</h1>
                <p class="subtitle">Jetstream Ace briefing</p>
                <p class="instruction">Slide left or right to steer. Dodge service carts and scoop up mile markers.</p>
                <div class="flight-badges" aria-hidden="true">
                    <span class="flight-badge">Sky Ace</span>
                    <span class="flight-badge">Neon Runway</span>
                    <span class="flight-badge">Bonus Miles</span>
                </div>
                <button id="start-btn" class="primary-btn">Take Off</button>
            </div>

            <div id="game-over-screen" class="hidden glass-panel modal">
                <h2 class="game-over-title">RUNWAY CLOSED</h2>
                <div class="score-summary">Miles banked: <strong id="finalScore">0</strong></div>
                <button id="restart-btn" class="secondary-btn">Launch Again</button>
            </div>

            <div id="hud" class="hud hidden">
                <div class="glass-panel hud-pill">
                    <span>🏆</span> <span id="score">0</span>
                </div>
            </div>

            <div id="tutorial" class="tutorial hidden">
                Slide to steer
            </div>

            <!-- [agent-note][stage3] resolved-gif: coin-burst + runway-loss feedback via catalogs/gifs.json -->
            <img id="feedback-gif" class="feedback-gif" alt="" aria-hidden="true">
            <div id="feedback-caption" class="feedback-caption" aria-hidden="true"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /** 1. ASSETS */
        // [agent-note][stage4] resolved-font: primary Orbitron, secondary Exo 2 from catalogs/fonts.json
        // [agent-note][stage3] resolved-audio: loop/ui/pickup/fail/warning from catalogs/audios.json
        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            sfx: {
                pickup: "https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3",
                bonus: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3",
                warning: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
                fail: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3",
                start: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
                uiClick: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_02.mp3"
            },
            gifs: {
                pickup: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                fail: "https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp"
            }
        };

        /** 2. AUDIO SYSTEM */
        class AudioController {
            constructor() {
                this.enabled = false;
                this.lastPlayedAt = new Map();
                this.bgm = new Audio(ASSETS.bgm);
                this.bgm.loop = true;
                this.bgm.volume = 0.2;
                this.bgm.preload = 'auto';
                this.sfx = {};
                this.volumes = {
                    pickup: 0.45,
                    bonus: 0.52,
                    warning: 0.38,
                    fail: 0.55,
                    start: 0.42,
                    uiClick: 0.32
                };

                for (const [k, v] of Object.entries(ASSETS.sfx)) {
                    const sample = new Audio(v);
                    sample.preload = 'auto';
                    this.sfx[k] = sample;
                }
            }

            unlock() {
                this.enabled = true;
            }

            playBGM() {
                if (!this.enabled) return;
                this.bgm.play().catch(() => {});
            }

            stopBGM() {
                this.bgm.pause();
                this.bgm.currentTime = 0;
            }

            playSFX(key, debounceMs = 0) {
                if (!this.enabled || !this.sfx[key]) return;
                const now = performance.now();
                const lastTime = this.lastPlayedAt.get(key) || 0;
                if (debounceMs && now - lastTime < debounceMs) return;
                this.lastPlayedAt.set(key, now);

                const clone = this.sfx[key].cloneNode();
                clone.volume = this.volumes[key] ?? 0.45;
                clone.play().catch(() => {});
            }
        }

        class FeedbackController {
            constructor() {
                this.image = document.getElementById('feedback-gif');
                this.caption = document.getElementById('feedback-caption');
                this.hideTimer = null;
            }

            show(type, label) {
                const src = ASSETS.gifs[type];
                if (!src || !this.image || !this.caption) return;
                this.image.src = src;
                this.image.alt = label;
                this.caption.textContent = label;
                this.image.classList.add('visible');
                this.caption.classList.add('visible');
                clearTimeout(this.hideTimer);
                this.hideTimer = setTimeout(() => this.hide(), 1500);
            }

            hide() {
                this.image.classList.remove('visible');
                this.caption.classList.remove('visible');
            }
        }

        const audio = new AudioController();
        const feedback = new FeedbackController();

        /** 3. GAME STATE */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Game Variables
        let gameActive = false;
        let score = 0;
        let speed = 0;
        let frameCount = 0;

        // Player
        let player = {
            x: 0,
            tilt: 0,
            targetX: 0
        };

        // Pseudo-3D Objects
        let objects = [];
        let runwayOffset = 0;
        let lastWarningTime = 0;

        // Configuration
        const HORIZON_Y_RATIO = 0.4;
        const RUNWAY_BOTTOM_WIDTH_RATIO = 1.2;
        const RUNWAY_TOP_WIDTH_RATIO = 0.1;

        /** 4. RESIZE HANDLER */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        /** 5. INPUT HANDLING */
        function handleInput(clientX) {
            if (!gameActive) return;
            const normalized = (clientX / width) * 2 - 1;
            player.targetX = Math.max(-1, Math.min(1, normalized));
        }

        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('touchstart', e => {
            if (gameActive) handleInput(e.touches[0].clientX);
        }, { passive: false });

        /** 6. GAME LOGIC */
        function initGame() {
            score = 0;
            speed = 0.005;
            objects = [];
            player.x = 0;
            player.tilt = 0;
            player.targetX = 0;
            frameCount = 0;
            lastWarningTime = 0;
            feedback.hide();
            document.getElementById('score').innerText = score;
        }

        function spawnObject() {
            const typeRand = Math.random();
            const type = typeRand > 0.3 ? 'obstacle' : 'coin';
            const lane = (Math.random() * 1.6) - 0.8;

            objects.push({
                type: type,
                x: lane,
                z: 0.01,
                active: true
            });
        }

        function update() {
            speed = 0.005 + (score * 0.00005);
            if (speed > 0.015) speed = 0.015;

            const dx = player.targetX - player.x;
            player.x += dx * 0.1;
            player.tilt = dx * -30;

            if (frameCount % Math.floor(60 / (speed * 150)) === 0) {
                spawnObject();
            }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                obj.z += speed * (1 + obj.z * 2);

                if (obj.type === 'obstacle' && obj.active) {
                    const inDangerZone = obj.z > 0.72 && obj.z < 0.84;
                    const closeToPlayerLane = Math.abs(player.x - obj.x) < 0.18;
                    if (inDangerZone && closeToPlayerLane && performance.now() - lastWarningTime > 700) {
                        lastWarningTime = performance.now();
                        audio.playSFX('warning', 700);
                    }
                }

                if (obj.z > 0.85 && obj.z < 0.95 && obj.active) {
                    const playerWidth = 0.15;
                    const objWidth = 0.15;

                    if (Math.abs(player.x - obj.x) < (playerWidth + objWidth) / 2) {
                        if (obj.type === 'coin') {
                            score += 100;
                            document.getElementById('score').innerText = score;
                            audio.playSFX(score % 500 === 0 ? 'bonus' : 'pickup', 90);
                            if (score % 500 === 0) {
                                feedback.show('pickup', 'Bonus miles');
                            } else {
                                feedback.show('pickup', 'Clean pickup');
                            }
                            obj.active = false;
                        } else if (obj.type === 'obstacle') {
                            gameOver();
                        }
                    }
                }

                if (obj.z > 1.2) {
                    objects.splice(i, 1);
                }
            }

            runwayOffset = (runwayOffset + speed * 10) % 1;
            frameCount++;
        }

        /** 7. RENDERER */
        function draw() {
            ctx.clearRect(0, 0, width, height);

            const horizonY = height * HORIZON_Y_RATIO;
            const groundHeight = height - horizonY;
            const centerX = width / 2;

            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, '#09111f');
            skyGrad.addColorStop(0.55, '#13376b');
            skyGrad.addColorStop(1, '#7dd3fc');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, horizonY);

            for (let i = 0; i < 12; i++) {
                const starX = (i / 12) * width + ((frameCount * 0.2) % 28);
                const starY = 28 + (i % 4) * 26;
                ctx.fillStyle = i % 3 === 0 ? 'rgba(255,255,255,0.9)' : 'rgba(186,230,253,0.7)';
                ctx.beginPath();
                ctx.arc(starX % width, starY, i % 3 === 0 ? 1.6 : 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            groundGrad.addColorStop(0, '#14532d');
            groundGrad.addColorStop(1, '#052e16');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, horizonY, width, groundHeight);

            const runwayTopW = width * RUNWAY_TOP_WIDTH_RATIO;
            const runwayBottomW = width * RUNWAY_BOTTOM_WIDTH_RATIO;

            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.moveTo(centerX - runwayTopW / 2, horizonY);
            ctx.lineTo(centerX + runwayTopW / 2, horizonY);
            ctx.lineTo(centerX + runwayBottomW / 2, height);
            ctx.lineTo(centerX - runwayBottomW / 2, height);
            ctx.fill();

            const runwayGlow = ctx.createLinearGradient(0, horizonY, 0, height);
            runwayGlow.addColorStop(0, 'rgba(103, 232, 249, 0.12)');
            runwayGlow.addColorStop(1, 'rgba(59, 130, 246, 0.02)');
            ctx.fillStyle = runwayGlow;
            ctx.fill();

            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 4;
            ctx.setLineDash([40, 60]);
            ctx.lineDashOffset = -runwayOffset * 100;
            ctx.beginPath();
            ctx.moveTo(centerX, horizonY);
            ctx.lineTo(centerX, height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX - runwayTopW / 2, horizonY);
            ctx.lineTo(centerX - runwayBottomW / 2, height);
            ctx.moveTo(centerX + runwayTopW / 2, horizonY);
            ctx.lineTo(centerX + runwayBottomW / 2, height);
            ctx.stroke();

            for (let i = 1; i < 6; i++) {
                const y = horizonY + (groundHeight * i) / 6;
                const alpha = 0.08 + (i * 0.04);
                ctx.strokeStyle = `rgba(103, 232, 249, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - (runwayTopW / 2 + ((runwayBottomW - runwayTopW) * i) / 12), y);
                ctx.lineTo(centerX + (runwayTopW / 2 + ((runwayBottomW - runwayTopW) * i) / 12), y);
                ctx.stroke();
            }

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                if (!obj.active) continue;

                const scale = Math.pow(obj.z, 2) * 1.5 + 0.1;
                const screenY = horizonY + (obj.z * groundHeight);
                const currentRunwayWidth = runwayTopW + (obj.z * (runwayBottomW - runwayTopW));
                const screenX = centerX + (obj.x * currentRunwayWidth * 0.5);
                const size = 60 * scale;

                if (obj.type === 'obstacle') {
                    ctx.fillStyle = '#fb7185';
                    ctx.beginPath();
                    ctx.roundRect(screenX - size / 2, screenY - size, size, size, 10 * scale);
                    ctx.fill();

                    ctx.fillStyle = '#be123c';
                    ctx.fillRect(screenX - size / 2, screenY - size / 2, size, size / 4);

                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(screenX - size / 2 + 5, screenY, size / 5, 0, Math.PI * 2);
                    ctx.arc(screenX + size / 2 - 5, screenY, size / 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 2 * scale;
                    ctx.strokeRect(screenX - size / 2, screenY - size, size, size);
                } else {
                    const coinGrad = ctx.createRadialGradient(screenX, screenY - size / 2, size * 0.12, screenX, screenY - size / 2, size / 2);
                    coinGrad.addColorStop(0, '#fef08a');
                    coinGrad.addColorStop(1, '#f59e0b');
                    ctx.fillStyle = coinGrad;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY - size / 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 3 * scale;
                    ctx.stroke();

                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.beginPath();
                    ctx.arc(screenX - size / 6, screenY - size / 1.5, size / 7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 1.5 * scale;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY - size / 2, size / 3.1, 0.3, Math.PI + 0.45);
                    ctx.stroke();
                }
            }

            const playerY = height - 100;
            const playerScreenX = centerX + (player.x * width * 0.3);

            ctx.save();
            ctx.translate(playerScreenX, playerY);
            ctx.rotate(player.tilt * Math.PI / 180);

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 64, 48, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            const fuselageGrad = ctx.createLinearGradient(0, -60, 0, 60);
            fuselageGrad.addColorStop(0, '#f8fafc');
            fuselageGrad.addColorStop(1, '#cbd5e1');
            ctx.fillStyle = fuselageGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(-60, 10);
            ctx.lineTo(0, -12);
            ctx.lineTo(60, 10);
            ctx.lineTo(0, 30);
            ctx.fill();

            ctx.fillStyle = '#818cf8';
            ctx.beginPath();
            ctx.moveTo(-15, -8);
            ctx.lineTo(0, -56);
            ctx.lineTo(15, -8);
            ctx.fill();

            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.moveTo(-22, 40);
            ctx.lineTo(0, 64);
            ctx.lineTo(22, 40);
            ctx.fill();

            ctx.fillStyle = '#e0f2fe';
            ctx.beginPath();
            ctx.ellipse(0, -30, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(103, 232, 249, 0.65)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-9, 32);
            ctx.lineTo(-22, 82);
            ctx.moveTo(9, 32);
            ctx.lineTo(22, 82);
            ctx.stroke();

            ctx.fillStyle = 'rgba(103, 232, 249, 0.35)';
            ctx.beginPath();
            ctx.ellipse(-18, 74, 7, 20, 0.2, 0, Math.PI * 2);
            ctx.ellipse(18, 74, 7, 20, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopBGM();
            audio.playSFX('fail', 250);
            feedback.show('fail', 'Runway blocked');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('tutorial').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        /** 8. CONTROLS & EVENTS */
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('start', 120);
            audio.playBGM();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.unlock();
            audio.playSFX('uiClick', 120);
            audio.playBGM();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('tutorial').classList.remove('hidden');
            gameActive = true;
            initGame();
            gameLoop();
        });
    });
    </script>
</body>
</html>
