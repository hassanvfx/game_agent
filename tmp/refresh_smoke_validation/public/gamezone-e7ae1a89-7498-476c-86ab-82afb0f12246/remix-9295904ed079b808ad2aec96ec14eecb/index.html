    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #150f29;
            --bg-bottom: #2f215f;
            --panel: rgba(26, 18, 54, 0.82);

            --belt-mid: #233163;

            --character-main: #5ef2ff;
            --character-accent: #ffde59;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

                radial-gradient(circle at top, rgba(114, 219, 255, 0.2), transparent 28%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));

            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(255, 222, 89, 0.16), transparent 22%),
                radial-gradient(circle at 82% 12%, rgba(94, 242, 255, 0.18), transparent 18%),

            backdrop-filter: blur(12px);

            min-width: 88px;

        }
        .energy-fill.low {
            background: linear-gradient(90deg, #ff4d6d, var(--energy-low));
            box-shadow: 0 0 16px rgba(255, 93, 115, 0.45);
        }
        .energy-label {
            font-size: 11px;
            letter-spacing: 0.28em;
            color: #fff9ef;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);

        .btn-push { transition: transform 0.05s, filter 0.18s ease, box-shadow 0.18s ease; }
        .btn-push:active { transform: scale(0.95); }
        .btn-push:hover { filter: brightness(1.04); box-shadow: 0 10px 18px rgba(7, 12, 28, 0.22); }
        .shop-panel {
            max-height: 90vh;
            display: flex;
            flex-direction: column;

        .shop-scroll {
            overflow-y: auto;
        }
        .shop-actions {
            position: sticky;
            bottom: 0;
            padding-top: 0.25rem;
            background: linear-gradient(180deg, rgba(20, 14, 41, 0), rgba(20, 14, 41, 0.9) 30%);
        }
        .headline-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.05em;
        }
        .score-pop-font {
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            letter-spacing: 0.04em;

        #ui-layer { pointer-events: none; }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        .feedback-strip {
            position: absolute;
            left: 50%;
            bottom: 5.5rem;
            transform: translateX(-50%);
            width: min(220px, 52vw);
            pointer-events: none;
            opacity: 0;
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 45;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.35));

        .feedback-strip.active {

        .feedback-strip.fail {
            bottom: auto;

        .feedback-caption {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);

            pointer-events: none;
            z-index: 46;
            padding: 0.35rem 0.8rem;

            background: rgba(18, 11, 43, 0.75);

        @media (max-width: 640px) {

<script>
/** 
 * SYSTEM INVARIANTS & UTILS 
 */
const CONFIG = {
    // Loaded from DOM later
    baseSpeed: 250,
    dayDuration: 20,
    salaryPerScan: 5,
    starvationRate: 2
};

// State
let gameState = 'INIT'; // INIT, PLAYING, SHOP, GAMEOVER
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let lastTime = 0;
let initialized = false;

// Game Data
let money = 0;
let energy = 100;
let day = 1;
let dayTime = 0;
let dailyEarnings = 0;
let salaryMultiplier = 1.0;
let decoCost = 100;
let warningTriggered = false;

// Entities
let items = [];
let particles = [];
let scannerLineY = 0;

// Audio Context
let audioCtx;
let sfxBuffers = {};
let sfxMediaEls = {};
let audioReady = false;
let activeLoopEl = null;
let lastPlayedAt = {};
let bgmEl = document.getElementById('bgm_main');
let shopBgmEl = document.getElementById('bgm_shop');

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const hudMoney = document.getElementById('score-display');
const hudTime = document.getElementById('time-display');
const hudHungerBar = document.getElementById('hunger-bar');
const shopScreen = document.getElementById('shop-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const dailyEarningsEl = document.getElementById('daily-earnings');
const successOverlay = document.getElementById('success-overlay');
const failOverlay = document.getElementById('fail-overlay');
const successCaption = document.getElementById('success-caption');
const failCaption = document.getElementById('fail-caption');
const successGif = document.getElementById('gif-success');
const failGif = document.getElementById('gif-fail');
const assetAudioEls = Array.from(document.querySelectorAll('#assets audio'));
const uiButtons = Array.from(document.querySelectorAll('button'));

if (successGif?.src) successOverlay.src = successGif.src;
if (failGif?.src) failOverlay.src = failGif.src;

/**
 * AUDIO SYSTEM (Catalog-backed and gesture-safe)
 */
async function initAudio() {
    if (audioReady) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    audioCtx = audioCtx || new AudioContext();
    const sfxList = [
        { id: 'collect', el: 'sfx_collect', volume: 0.45 },
        { id: 'success', el: 'sfx_success', volume: 0.4 },
        { id: 'upgrade', el: 'sfx_upgrade', volume: 0.42 },
        { id: 'click', el: 'sfx_click', volume: 0.35 },
        { id: 'blocked', el: 'sfx_blocked', volume: 0.45 },
        { id: 'fail', el: 'sfx_fail', volume: 0.42 },
        { id: 'gameover', el: 'sfx_gameover', volume: 0.46 },
        { id: 'win', el: 'sfx_win', volume: 0.48 }
    ];

    for (const sfx of sfxList) {
        const el = document.getElementById(sfx.el);
        if (!el?.src) continue;
        sfxMediaEls[sfx.id] = el;
        try {
            const response = await fetch(el.src);
            const arrayBuffer = await response.arrayBuffer();
            const buffer = await audioCtx.decodeAudioData(arrayBuffer);
            sfxBuffers[sfx.id] = { buffer, volume: sfx.volume };
        } catch (e) {
            console.warn('SFX load failed', sfx.id);
        }
    }

    assetAudioEls.forEach((el) => {
        if (el.id === 'bgm_main') el.volume = 0.22;
        else if (el.id === 'bgm_shop') el.volume = 0.18;
        else el.volume = 0.5;
    });

    audioReady = true;
}

function unlockAudio() {
    if (!audioReady) {
        initAudio().catch(() => {});
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    syncLoopAudio();
}

function stopAllLoops() {
    [bgmEl, shopBgmEl].forEach((el) => {
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    });
    activeLoopEl = null;
}

function playLoop(targetEl) {
    if (!targetEl) return;
    if (activeLoopEl === targetEl && !targetEl.paused) return;

    [bgmEl, shopBgmEl].forEach((el) => {
        if (!el || el === targetEl) return;
        el.pause();
        el.currentTime = 0;
    });

    activeLoopEl = targetEl;
    targetEl.play().catch(() => {});
}

function syncLoopAudio() {
    if (!audioReady && !audioCtx) return;
    if (gameState === 'PLAYING') {
        playLoop(bgmEl);
    } else if (gameState === 'SHOP') {
        playLoop(shopBgmEl);
    } else {
        stopAllLoops();
    }
}

function playSfx(id, options = {}) {
    const { cooldown = 0 } = options;
    const nowMs = performance.now();
    if (cooldown && lastPlayedAt[id] && nowMs - lastPlayedAt[id] < cooldown) return;
    lastPlayedAt[id] = nowMs;

    const entry = sfxBuffers[id];
    if (audioCtx && entry?.buffer) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = entry.volume ?? 0.4;
        source.buffer = entry.buffer;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
        return;
    }

    const mediaEl = sfxMediaEls[id];
    if (mediaEl?.src) {
        const clone = mediaEl.cloneNode();
        clone.volume = Math.min(mediaEl.volume || 0.5, 0.5);
        clone.currentTime = 0;
        clone.play().catch(() => {});
    }
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'beep') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    }
}

function vibrate(type) {
    if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(10);
        if (type === 'heavy') navigator.vibrate([50, 50, 50]);
    }
    // Bridge fallback
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: type }
    });
}

let overlayTimeout = 0;
function showOverlay(kind, captionText) {
    const isSuccess = kind === 'success';
    const imgEl = isSuccess ? successOverlay : failOverlay;
    const captionEl = isSuccess ? successCaption : failCaption;

    window.clearTimeout(overlayTimeout);

    [successOverlay, failOverlay, successCaption, failCaption].forEach((el) => {
        el.classList.add('hidden');
        el.classList.remove('active');
    });

    captionEl.textContent = captionText;
    imgEl.classList.remove('hidden');
    captionEl.classList.remove('hidden');

    requestAnimationFrame(() => {
        imgEl.classList.add('active');
        captionEl.classList.add('active');
    });

    overlayTimeout = window.setTimeout(() => {
        imgEl.classList.remove('active');
        captionEl.classList.remove('active');
        window.setTimeout(() => {
            imgEl.classList.add('hidden');
            captionEl.classList.add('hidden');
        }, 180);
    }, isSuccess ? 850 : 950);
}

/**
 * GAME LOGIC
 */
class Item {
    constructor() {
        this.r = 30 + Math.random() * 20; // Radius
        this.x = Math.random() * (cw - 2 * this.r) + this.r;
        this.y = -this.r * 2;
        this.type = Math.floor(Math.random() * 3); // 0: Circle, 1: Box, 2: Triangle
        this.color = ['#ff7a90', '#5ef2ff', '#ffde59'][this.type];
        this.scanned = false;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 2;
    }

    update(dt, speed) {
        this.y += speed * dt;
        this.rotation += this.rotSpeed * dt;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#1b1235';
        ctx.lineWidth = 3;

        if (this.type === 0) { // Circle
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.arc(-this.r*0.3, -this.r*0.3, this.r*0.2, 0, Math.PI*2);
            ctx.fill();
        } else if (this.type === 1) { // Box
            ctx.fillRect(-this.r, -this.r, this.r*2, this.r*2);
            ctx.strokeRect(-this.r, -this.r, this.r*2, this.r*2);
            // Label
            ctx.fillStyle = 'rgba(27,18,53,0.2)';
            ctx.fillRect(-this.r*0.5, -this.r*0.2, this.r, this.r*0.4);
        } else { // Triangle
            ctx.beginPath();
            ctx.moveTo(0, -this.r);
            ctx.lineTo(this.r, this.r);
            ctx.lineTo(-this.r, this.r);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    contains(mx, my) {
        const dx = mx - this.x;
        const dy = my - this.y;
        return (dx*dx + dy*dy) < (this.r * 1.5) ** 2; // Generous hit box
    }
}

class Particle {
    constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.life = 1.0;
        this.vy = -100;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = '700 24px Orbitron';
        ctx.fillStyle = '#8dff8f';
        ctx.strokeStyle = '#f8f1ff';
        ctx.lineWidth = 3;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function initGame() {
    // Parse Config
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const defs = JSON.parse(configEl.textContent);
            CONFIG.baseSpeed = defs.baseSpeed.value;
            CONFIG.dayDuration = defs.dayDuration.value;
            CONFIG.salaryPerScan = defs.salaryPerScan.value;
            CONFIG.starvationRate = defs.starvationRate.value;
        } catch(e) { console.error('Config parse error', e); }
    }

    // Reset State
    money = 20; // Start with some lunch money
    energy = 100;
    day = 1;
    salaryMultiplier = 1.0;
    decoCost = 100;
    warningTriggered = false;
    startDay();
    
    // UI Update
    updateHUD();
    
    // Loop
    if (!initialized) {
        initialized = true;
        requestAnimationFrame(loop);
    }
}

function startDay() {
    gameState = 'PLAYING';
    dayTime = 0;
    dailyEarnings = 0;
    items = [];
    particles = [];
    warningTriggered = false;
    shopScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    syncLoopAudio();
    
    // Tutorial hint first time
    if (day === 1) {
        particles.push(new Particle(cw/2, ch/2, "TAP ITEMS TO SCAN"));
    }
}

function endDay() {
    gameState = 'SHOP';
    shopScreen.classList.remove('hidden');
    dailyEarningsEl.textContent = `+$${dailyEarnings}`;
    playSfx('click', { cooldown: 120 });
    showOverlay('success', 'Shift Wrap');
    syncLoopAudio();
    
    // Update Shop UI
    document.getElementById('deco-price').textContent = `-$${Math.floor(decoCost)}`;
}

function gameOver(reason) {
    gameState = 'GAMEOVER';
    document.getElementById('go-title').textContent = reason === 'WIN' ? 'YOU OWN THE STORE!' : 'SHIFT OVER';
    document.getElementById('go-reason').textContent = reason === 'WIN' ? 'Your checkout grind paid off.' : (reason === 'STARVED' ? 'You burned through your shift energy.' : 'Too many items slipped past the scanner.');
    document.getElementById('go-title').className = reason === 'WIN' ? 'headline-font text-5xl mb-4 text-green-300' : 'headline-font text-5xl mb-4 text-red-400';
    gameOverScreen.classList.remove('hidden');
    playSfx(reason === 'WIN' ? 'win' : 'gameover', { cooldown: 250 });
    showOverlay(reason === 'WIN' ? 'success' : 'fail', reason === 'WIN' ? 'Store Bought!' : 'Shift Over');
    syncLoopAudio();
    vibrate('heavy');
}

function updateHUD() {
    hudMoney.textContent = `$${Math.floor(money)}`;
    
    // Time format 08:00 -> 17:00 (9 hours shift)
    // dayTime goes 0 -> CONFIG.dayDuration
    const shiftProgress = Math.min(1, dayTime / CONFIG.dayDuration);
    const startHour = 9;
    const endHour = 17; // 5 PM
    const currentHour = startHour + (endHour - startHour) * shiftProgress;
    const h = Math.floor(currentHour);
    const m = Math.floor((currentHour % 1) * 60);
    hudTime.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;

    hudHungerBar.style.width = `${Math.max(0, energy)}%`;
    hudHungerBar.className = `absolute left-0 top-0 bottom-0 w-full transition-all duration-300 energy-fill ${energy < 30 ? 'low' : ''}`;
}

function spawnItem() {
    // Spawn rate increases with day
    const spawnChance = 0.02 + (day * 0.005);
    if (Math.random() < spawnChance) {
        // Ensure no overlap at spawn (simple check)
        const newItem = new Item();
        let overlap = false;
        for (let i of items) {
            if (i.y < newItem.r * 2 && Math.abs(i.x - newItem.x) < (i.r + newItem.r)) {
                overlap = true;
                break;
            }
        }
        if (!overlap) items.push(newItem);
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Time
    dayTime += dt;
    if (dayTime >= CONFIG.dayDuration) {
        endDay();
        return;
    }

    // Hunger
    energy -= CONFIG.starvationRate * dt;
    if (!warningTriggered && energy < 28) {
        warningTriggered = true;
        playSfx('fail', { cooldown: 500 });
        showOverlay('fail', 'Low Energy');
    }
    if (energy > 35) {
        warningTriggered = false;
    }
    if (energy <= 0) {
        gameOver('STARVED');
        return;
    }

    // Spawning
    spawnItem();

    // Items
    const speed = CONFIG.baseSpeed * (1 + (day * 0.1));
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.update(dt, speed);

        // Missed item
        if (item.y > ch + item.r) {
            items.splice(i, 1);
            playSfx('fail', { cooldown: 120 });
            playSfx('blocked', { cooldown: 120 });
            showOverlay('fail', 'Missed Item');
            canvas.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
            setTimeout(() => canvas.style.transform = 'none', 50);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    updateHUD();
}

function draw() {
    // Clear
    const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
    bgGrad.addColorStop(0, '#150f29');
    bgGrad.addColorStop(1, '#2f215f');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.fillStyle = 'rgba(94, 242, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(cw * 0.2, ch * 0.15, Math.min(cw, ch) * 0.18, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 222, 89, 0.06)';
    ctx.beginPath();
    ctx.arc(cw * 0.82, ch * 0.12, Math.min(cw, ch) * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // Draw Conveyor Belt Background
    const beltW = cw * 0.8;
    const beltX = (cw - beltW) / 2;

    const beltGrad = ctx.createLinearGradient(beltX, 0, beltX + beltW, 0);
    beltGrad.addColorStop(0, '#141b35');
    beltGrad.addColorStop(0.5, '#233163');
    beltGrad.addColorStop(1, '#141b35');
    ctx.fillStyle = beltGrad;
    ctx.fillRect(beltX, 0, beltW, ch);

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 4;
    ctx.strokeRect(beltX + 2, 2, beltW - 4, ch - 4);

    // Moving stripes
    ctx.strokeStyle = '#33498d';
    ctx.lineWidth = 20;
    const offset = (Date.now() / 1000 * CONFIG.baseSpeed) % 100;
    for (let y = -100; y < ch + 100; y += 100) {
        ctx.beginPath();
        ctx.moveTo(beltX, y + offset);
        ctx.lineTo(beltX + beltW, y + offset);
        ctx.stroke();
    }

    scannerLineY = ch * 0.7;
    ctx.strokeStyle = 'rgba(255, 90, 165, 0.95)';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ff5aa5';
    ctx.beginPath();
    ctx.moveTo(beltX, scannerLineY);
    ctx.lineTo(beltX + beltW, scannerLineY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 90, 165, 0.14)';
    ctx.fillRect(beltX, scannerLineY - 14, beltW, 28);
    ctx.shadowBlur = 0;

    // Cashier mascot / scanner hub
    const mascotX = cw * 0.12;
    const mascotY = scannerLineY - 44;
    ctx.save();
    ctx.translate(mascotX, mascotY);
    ctx.fillStyle = '#5ef2ff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(94, 242, 255, 0.55)';
    ctx.beginPath();
    ctx.roundRect(-30, -22, 60, 56, 18);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#16203e';
    ctx.beginPath();
    ctx.arc(-10, -2, 6, 0, Math.PI * 2);
    ctx.arc(10, -2, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffde59';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 8, 12, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = '#ffde59';
    ctx.fillRect(18, 10, 34, 10);
    ctx.fillStyle = '#f8f1ff';
    ctx.fillRect(48, 6, 14, 18);
    ctx.restore();

    // Items
    items.forEach(item => item.draw(ctx));

    // Particles
    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

/**
 * INPUT & EVENTS
 */
function handleInput(e) {
    unlockAudio(); // L2 Unlock

    if (gameState === 'GAMEOVER') return; // Handled by button
    if (gameState === 'SHOP') return; // Handled by DOM buttons

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Check hits
        let hit = false;
        for (let i = items.length - 1; i >= 0; i--) {
            if (items[i].contains(mx, my)) {
                // Scan success
                const earn = Math.ceil(CONFIG.salaryPerScan * salaryMultiplier);
                money += earn;
                dailyEarnings += earn;
                
                // FX
                playSfx('collect', { cooldown: 80 });
                playSfx('success', { cooldown: 80 });
                synthesizeSfx('beep');
                vibrate('light');
                showOverlay('success', `Scan +$${earn}`);
                particles.push(new Particle(items[i].x, items[i].y, `+$${earn}`));
                
                // Flash effect
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(items[i].x, items[i].y, items[i].r * 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                items.splice(i, 1);
                hit = true;
                break; // One per tap
            }
        }

        if (!hit) {
            playSfx('blocked', { cooldown: 140 });
        }
    }
}

function handleUIButtonPress(e) {
    e.stopPropagation();
    unlockAudio();
    playSfx('click', { cooldown: 90 });
}

// Event Listeners
window.addEventListener('pointerdown', handleInput, { passive: false });
uiButtons.forEach((button) => button.addEventListener('pointerdown', handleUIButtonPress, { passive: true }));

// Shop Buttons
document.getElementById('btn-buy-food').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= 20 && energy < 100) {
        money -= 20;
        energy = Math.min(100, energy + 50);
        playSfx('upgrade', { cooldown: 140 });
        showOverlay('success', 'Snack Break');
        updateHUD();
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Need More Cash');
    }
});

document.getElementById('btn-buy-deco').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= decoCost) {
        money -= decoCost;
        salaryMultiplier += 0.2;
        decoCost *= 1.5;
        playSfx('upgrade', { cooldown: 140 });
        showOverlay('success', 'Scanner Boost');
        updateHUD();
        document.getElementById('deco-price').textContent = `-$${Math.floor(decoCost)}`;
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Upgrade Locked');
    }
});

document.getElementById('btn-buy-store').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= 5000) {
        money -= 5000;
        playSfx('win', { cooldown: 160 });
        gameOver('WIN');
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Store Too Pricey');
    }
});

document.getElementById('btn-next-day').addEventListener('click', (e) => {
    e.stopPropagation();
    day++;
    startDay();
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    initGame();
});

// Resize Observer
const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
        const { width, height } = entry.contentRect;
        cw = width;
        ch = height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) initGame();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopAllLoops();
    } else {
        syncLoopAudio();
    }
});

window.addEventListener('blur', stopAllLoops);
window.addEventListener('focus', syncLoopAudio);

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
});

</script>
