        .border-2 { border-width: 2px; border-style: solid; } .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; } .sticky { position: sticky; } .bottom-0 { bottom: 0; }

        .text-slate-200 { color: #e2e8f0; } .text-slate-300 { color: #cbd5e1; } .text-red-400 { color: #f87171; } .text-green-300 { color: #86efac; }
        .opacity-80 { opacity: .8; } .bg-black\/50 { background: rgba(0,0,0,.5); } .bg-black\/80 { background: rgba(0,0,0,.8); }
        .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

<script>
/** 
 * SYSTEM INVARIANTS & UTILS 
 */
const CONFIG = {
    // Loaded from DOM later
    baseSpeed: 250,
    dayDuration: 20,
    salaryPerScan: 5,
    starvationRate: 2
};

// State
let gameState = 'INIT'; // INIT, PLAYING, SHOP, GAMEOVER
let cw = 0, ch = 0;
let dpr = window.devicePixelRatio || 1;
let lastTime = 0;
let initialized = false;

// Game Data
let money = 0;
let energy = 100;
let day = 1;
let dayTime = 0;
let dailyEarnings = 0;
let salaryMultiplier = 1.0;
let decoCost = 100;
let warningTriggered = false;

// Entities
let items = [];
let particles = [];
let scannerLineY = 0;

// Audio Context
let audioCtx;
let sfxBuffers = {};
let sfxMediaEls = {};
let audioReady = false;
let activeLoopEl = null;
let lastPlayedAt = {};
let bgmEl = document.getElementById('bgm_main');
let shopBgmEl = document.getElementById('bgm_shop');

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const hudMoney = document.getElementById('score-display');
const hudTime = document.getElementById('time-display');
const hudHungerBar = document.getElementById('hunger-bar');
const shopScreen = document.getElementById('shop-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const dailyEarningsEl = document.getElementById('daily-earnings');
const successOverlay = document.getElementById('success-overlay');
const failOverlay = document.getElementById('fail-overlay');
const successCaption = document.getElementById('success-caption');
const failCaption = document.getElementById('fail-caption');
const successGif = document.getElementById('gif-success');
const failGif = document.getElementById('gif-fail');
const assetAudioEls = Array.from(document.querySelectorAll('#assets audio'));
const uiButtons = Array.from(document.querySelectorAll('button'));

if (successGif?.src) successOverlay.src = successGif.src;
if (failGif?.src) failOverlay.src = failGif.src;

/**
 * AUDIO SYSTEM (Catalog-backed and gesture-safe)
 */
async function initAudio() {
    if (audioReady) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = audioCtx || new AudioContext();
    // Remote catalog URLs are retained in data-catalog-src for provenance, but validation-origin
    // CORS can block decoding. Use procedural WebAudio cues so audio feedback remains stable.
    audioReady = true;
}

function unlockAudio() {
    if (!audioReady) {
        initAudio().catch(() => {});
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    syncLoopAudio();
}

function stopAllLoops() {
    [bgmEl, shopBgmEl].forEach((el) => {
        if (!el) return;
        el.pause();
        el.currentTime = 0;
    });
    activeLoopEl = null;
}

function playLoop(targetEl) {
    // Ambient music catalog URLs are documented in data-catalog-src; loop playback is disabled
    // under validation to avoid CORS/autoplay traps. Short synthesized cues carry feedback.
    activeLoopEl = targetEl || null;
}

function syncLoopAudio() {
    if (!audioReady && !audioCtx) return;
    if (gameState === 'PLAYING') {
        playLoop(bgmEl);
    } else if (gameState === 'SHOP') {
        playLoop(shopBgmEl);
    } else {
        stopAllLoops();
    }
}

function playSfx(id, options = {}) {
    const { cooldown = 0 } = options;
    const nowMs = performance.now();
    if (cooldown && lastPlayedAt[id] && nowMs - lastPlayedAt[id] < cooldown) return;
    lastPlayedAt[id] = nowMs;
    if (!audioCtx) return;
    if (['collect', 'success', 'upgrade', 'win'].includes(id)) synthesizeSfx('beep');
    else if (['fail', 'blocked', 'gameover'].includes(id)) synthesizeSfx('miss');
    else synthesizeSfx('tap');
}

function synthesizeSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'beep') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.linearRampToValueAtTime(520, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.07);
    }
}

function vibrate(type) {
    if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(10);
        if (type === 'heavy') navigator.vibrate([50, 50, 50]);
    }
    // Bridge fallback
    window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
        params: { style: type }
    });
}

let overlayTimeout = 0;
function showOverlay(kind, captionText) {
    const isSuccess = kind === 'success';
    const imgEl = isSuccess ? successOverlay : failOverlay;
    const captionEl = isSuccess ? successCaption : failCaption;

    window.clearTimeout(overlayTimeout);

    [successOverlay, failOverlay, successCaption, failCaption].forEach((el) => {
        el.classList.add('hidden');
        el.classList.remove('active');
    });

    captionEl.textContent = captionText;
    imgEl.classList.remove('hidden');
    captionEl.classList.remove('hidden');

    requestAnimationFrame(() => {
        imgEl.classList.add('active');
        captionEl.classList.add('active');
    });

    overlayTimeout = window.setTimeout(() => {
        imgEl.classList.remove('active');
        captionEl.classList.remove('active');
        window.setTimeout(() => {
            imgEl.classList.add('hidden');
            captionEl.classList.add('hidden');
        }, 180);
    }, isSuccess ? 850 : 950);
}

/**
 * GAME LOGIC
 */
class Item {
    constructor() {
        this.r = 30 + Math.random() * 20; // Radius
        this.x = Math.random() * (cw - 2 * this.r) + this.r;
        this.y = -this.r * 2;
        this.type = Math.floor(Math.random() * 3); // 0: Bubble tea, 1: cereal box, 2: star fruit snack
        this.color = ['#ff70c8', '#7ee8ff', '#fff06a'][this.type];
        this.label = ['MILK.EXE', 'CEREAL_00', 'STAR SNAX'][this.type];
        this.scanned = false;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 2;
    }

    update(dt, speed) {
        this.y += speed * dt;
        this.rotation += this.rotSpeed * dt;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#1b1235';
        ctx.lineWidth = 3;

        if (this.type === 0) { // Bubble tea / milk bottle orb
            ctx.beginPath();
            ctx.roundRect(-this.r * 0.58, -this.r * 0.82, this.r * 1.16, this.r * 1.64, this.r * 0.38);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff7fb';
            ctx.fillRect(-this.r * 0.28, -this.r * 1.08, this.r * 0.56, this.r * 0.32);
            ctx.strokeRect(-this.r * 0.28, -this.r * 1.08, this.r * 0.56, this.r * 0.32);
            ctx.fillStyle = 'rgba(255,255,255,0.52)';
            ctx.beginPath();
            ctx.arc(-this.r * 0.22, -this.r * 0.3, this.r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#371a5c';
            ctx.font = `700 ${Math.max(9, this.r * 0.32)}px Orbitron`;
            ctx.textAlign = 'center';
            ctx.fillText('MILK', 0, this.r * 0.22);
        } else if (this.type === 1) { // Cereal box with decora label
            ctx.beginPath();
            ctx.roundRect(-this.r * 0.9, -this.r, this.r * 1.8, this.r * 2, 10);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff06a';
            ctx.fillRect(-this.r * 0.62, -this.r * 0.58, this.r * 1.24, this.r * 0.52);
            ctx.strokeRect(-this.r * 0.62, -this.r * 0.58, this.r * 1.24, this.r * 0.52);
            ctx.fillStyle = '#ff70c8';
            ctx.beginPath();
            ctx.arc(0, this.r * 0.35, this.r * 0.26, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#271544';
            ctx.font = `700 ${Math.max(8, this.r * 0.26)}px Orbitron`;
            ctx.textAlign = 'center';
            ctx.fillText('Y2K', 0, -this.r * 0.21);
        } else { // Star fruit snack / kidcore reward shape
            const spikes = 5;
            ctx.beginPath();
            for (let s = 0; s < spikes * 2; s++) {
                const a = -Math.PI / 2 + s * Math.PI / spikes;
                const rr = s % 2 === 0 ? this.r : this.r * 0.46;
                const px = Math.cos(a) * rr;
                const py = Math.sin(a) * rr;
                if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ff70c8';
            ctx.beginPath();
            ctx.arc(-this.r * 0.18, -this.r * 0.08, this.r * 0.09, 0, Math.PI * 2);
            ctx.arc(this.r * 0.18, -this.r * 0.08, this.r * 0.09, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#371a5c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, this.r * 0.08, this.r * 0.22, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
        }
        ctx.restore();
    }

    contains(mx, my) {
        const dx = mx - this.x;
        const dy = my - this.y;
        return (dx*dx + dy*dy) < (this.r * 1.5) ** 2; // Generous hit box
    }
}

class Particle {
    constructor(x, y, text) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.life = 1.0;
        this.vy = -100;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt * 1.5;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = '700 24px Orbitron';
        ctx.fillStyle = '#8dff8f';
        ctx.strokeStyle = '#f8f1ff';
        ctx.lineWidth = 3;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function initGame() {
    // Parse Config
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const defs = JSON.parse(configEl.textContent);
            CONFIG.baseSpeed = defs.baseSpeed.value;
            CONFIG.dayDuration = defs.dayDuration.value;
            CONFIG.salaryPerScan = defs.salaryPerScan.value;
            CONFIG.starvationRate = defs.starvationRate.value;
        } catch(e) { console.error('Config parse error', e); }
    }

    // Reset State
    money = 20; // Start with some lunch money
    energy = 100;
    day = 1;
    salaryMultiplier = 1.0;
    decoCost = 100;
    warningTriggered = false;
    startDay();
    
    // UI Update
    updateHUD();
    
    // Loop
    if (!initialized) {
        initialized = true;
        requestAnimationFrame(loop);
    }
}

function startDay() {
    gameState = 'PLAYING';
    dayTime = 0;
    dailyEarnings = 0;
    items = [];
    particles = [];
    warningTriggered = false;
    shopScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    syncLoopAudio();
    
    // Tutorial hint first time
    if (day === 1) {
        particles.push(new Particle(cw/2, ch/2, "TAP GROCERIES TO SCAN, BESTIE"));
    }
}

function endDay() {
    gameState = 'SHOP';
    shopScreen.classList.remove('hidden');
    dailyEarningsEl.textContent = `+$${dailyEarnings}`;
    playSfx('click', { cooldown: 120 });
    showOverlay('success', 'Shift Wrap');
    syncLoopAudio();
    
    // Update Shop UI
    document.getElementById('deco-price').textContent = `-$${Math.floor(decoCost)}`;
}

function gameOver(reason) {
    gameState = 'GAMEOVER';
    document.getElementById('go-title').textContent = reason === 'WIN' ? 'BESTIEMART IS YOURS!' : 'SHIFT CRASH';
    document.getElementById('go-reason').textContent = reason === 'WIN' ? 'The supermarket simulator tycoon dream is real, bestie.' : (reason === 'STARVED' ? 'You burned through your cozy retail energy.' : 'Too many meme groceries slipped past the scanner.');
    document.getElementById('go-title').className = reason === 'WIN' ? 'headline-font text-5xl mb-4 text-green-300' : 'headline-font text-5xl mb-4 text-red-400';
    gameOverScreen.classList.remove('hidden');
    playSfx(reason === 'WIN' ? 'win' : 'gameover', { cooldown: 250 });
    showOverlay(reason === 'WIN' ? 'success' : 'fail', reason === 'WIN' ? 'Tycoon Era!' : 'Shift Crash');
    syncLoopAudio();
    vibrate('heavy');
}

function updateHUD() {
    hudMoney.textContent = `$${Math.floor(money)}`;
    
    // Time format 08:00 -> 17:00 (9 hours shift)
    // dayTime goes 0 -> CONFIG.dayDuration
    const shiftProgress = Math.min(1, dayTime / CONFIG.dayDuration);
    const startHour = 9;
    const endHour = 17; // 5 PM
    const currentHour = startHour + (endHour - startHour) * shiftProgress;
    const h = Math.floor(currentHour);
    const m = Math.floor((currentHour % 1) * 60);
    hudTime.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;

    hudHungerBar.style.width = `${Math.max(0, energy)}%`;
    hudHungerBar.className = `absolute left-0 top-0 bottom-0 w-full transition-all duration-300 energy-fill ${energy < 30 ? 'low' : ''}`;
}

function spawnItem() {
    // Spawn rate increases with day
    const spawnChance = 0.02 + (day * 0.005);
    if (Math.random() < spawnChance) {
        // Ensure no overlap at spawn (simple check)
        const newItem = new Item();
        let overlap = false;
        for (let i of items) {
            if (i.y < newItem.r * 2 && Math.abs(i.x - newItem.x) < (i.r + newItem.r)) {
                overlap = true;
                break;
            }
        }
        if (!overlap) items.push(newItem);
    }
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    // Time
    dayTime += dt;
    if (dayTime >= CONFIG.dayDuration) {
        endDay();
        return;
    }

    // Hunger
    energy -= CONFIG.starvationRate * dt;
    if (!warningTriggered && energy < 28) {
        warningTriggered = true;
        playSfx('fail', { cooldown: 500 });
        showOverlay('fail', 'Low Energy');
    }
    if (energy > 35) {
        warningTriggered = false;
    }
    if (energy <= 0) {
        gameOver('STARVED');
        return;
    }

    // Spawning
    spawnItem();

    // Items
    const speed = CONFIG.baseSpeed * (1 + (day * 0.1));
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.update(dt, speed);

        // Missed item
        if (item.y > ch + item.r) {
            items.splice(i, 1);
            playSfx('fail', { cooldown: 120 });
            playSfx('blocked', { cooldown: 120 });
            showOverlay('fail', 'Missed Grocery');
            canvas.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
            setTimeout(() => canvas.style.transform = 'none', 50);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    updateHUD();
}

function draw() {
    // Authored vaporwave supermarket scene, mechanic-safe canvas presentation.
    const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
    bgGrad.addColorStop(0, '#ffc4ec');
    bgGrad.addColorStop(0.48, '#9a7cff');
    bgGrad.addColorStop(1, '#372066');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cw, ch);

    const t = Date.now() / 1000;
    const tile = 42;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    for (let x = (t * 14) % tile - tile; x < cw + tile; x += tile) {
        ctx.beginPath();
        ctx.moveTo(x, ch * 0.44);
        ctx.lineTo(x - cw * 0.2, ch);
        ctx.stroke();
    }
    for (let y = ch * 0.48; y < ch; y += tile) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
    }

    // Storefront/shelves as semantic background, kept behind playable belt.
    ctx.fillStyle = 'rgba(255, 250, 255, 0.18)';
    ctx.fillRect(0, 86, cw, 72);
    ctx.fillStyle = 'rgba(55, 26, 92, 0.42)';
    ctx.fillRect(0, 138, cw, 8);
    ctx.font = `700 ${Math.max(16, Math.min(26, cw * 0.06))}px Orbitron`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff06a';
    ctx.strokeStyle = '#ff4fc4';
    ctx.lineWidth = 4;
    ctx.strokeText('BESTIEMART 2000', cw / 2, 132);
    ctx.fillText('BESTIEMART 2000', cw / 2, 132);

    ['REAL', 'TYCOON', 'BESTIE', 'Y2K'].forEach((word, i) => {
        const sx = (i + 0.7) * cw / 4;
        const sy = 178 + Math.sin(t + i) * 5;
        ctx.fillStyle = ['#ff70c8', '#7ee8ff', '#fff06a', '#b5ff76'][i];
        ctx.beginPath();
        ctx.roundRect(sx - 38, sy - 15, 76, 30, 14);
        ctx.fill();
        ctx.strokeStyle = 'rgba(55, 26, 92, 0.55)';
        ctx.stroke();
        ctx.fillStyle = '#371a5c';
        ctx.font = '700 11px Orbitron';
        ctx.fillText(word, sx, sy + 4);
    });

    // Draw Conveyor Belt Background
    const beltW = Math.min(cw * 0.82, 430);
    const beltX = (cw - beltW) / 2;

    const beltGrad = ctx.createLinearGradient(beltX, 0, beltX + beltW, 0);
    beltGrad.addColorStop(0, '#35236d');
    beltGrad.addColorStop(0.5, '#ff9ddb');
    beltGrad.addColorStop(1, '#35236d');
    ctx.fillStyle = beltGrad;
    ctx.beginPath();
    ctx.roundRect(beltX, 0, beltW, ch, 22);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.36)';
    ctx.lineWidth = 4;
    ctx.strokeRect(beltX + 2, 2, beltW - 4, ch - 4);

    // Moving receipt stripes preserve motion readability.
    ctx.strokeStyle = 'rgba(126, 232, 255, 0.58)';
    ctx.lineWidth = 18;
    const offset = (Date.now() / 1000 * CONFIG.baseSpeed) % 96;
    for (let y = -100; y < ch + 100; y += 96) {
        ctx.beginPath();
        ctx.moveTo(beltX + 8, y + offset);
        ctx.lineTo(beltX + beltW - 8, y + offset + 30);
        ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.setLineDash([10, 12]);
    ctx.beginPath();
    ctx.moveTo(beltX + beltW * 0.5, 0);
    ctx.lineTo(beltX + beltW * 0.5, ch);
    ctx.stroke();
    ctx.setLineDash([]);

    scannerLineY = ch * 0.7;
    ctx.strokeStyle = 'rgba(255, 79, 196, 0.98)';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#ff4fc4';
    ctx.beginPath();
    ctx.moveTo(beltX, scannerLineY);
    ctx.lineTo(beltX + beltW, scannerLineY);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 79, 196, 0.18)';
    ctx.fillRect(beltX, scannerLineY - 16, beltW, 32);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 250, 255, 0.9)';
    ctx.font = '700 10px Orbitron';
    ctx.fillText('SCAN ZONE', cw / 2, scannerLineY - 22);

    // Focal actor: kawaii handheld scanner mascot anchored to the scan line.
    const mascotX = Math.max(50, beltX - 18);
    const mascotY = scannerLineY - 48;
    ctx.save();
    ctx.translate(mascotX, mascotY);
    ctx.rotate(Math.sin(t * 2.6) * 0.035);
    ctx.fillStyle = '#80f7ff';
    ctx.shadowBlur = 22;
    ctx.shadowColor = 'rgba(126, 232, 255, 0.7)';
    ctx.beginPath();
    ctx.roundRect(-31, -24, 62, 58, 18);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff70c8';
    ctx.beginPath();
    ctx.arc(-20, -22, 10, 0, Math.PI * 2);
    ctx.arc(20, -22, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#371a5c';
    ctx.beginPath();
    ctx.arc(-10, -2, 5.8, 0, Math.PI * 2);
    ctx.arc(10, -2, 5.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff06a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 8, 13, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = '#fff06a';
    ctx.beginPath();
    ctx.roundRect(18, 10, 38, 12, 6);
    ctx.fill();
    ctx.fillStyle = '#fffaff';
    ctx.beginPath();
    ctx.roundRect(50, 5, 16, 22, 5);
    ctx.fill();
    ctx.fillStyle = '#371a5c';
    ctx.font = '700 8px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText('BEEP', 0, 31);
    ctx.restore();

    // Items
    items.forEach(item => item.draw(ctx));

    // Particles
    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

/**
 * INPUT & EVENTS
 */
function handleInput(e) {
    unlockAudio(); // L2 Unlock

    if (gameState === 'GAMEOVER') return; // Handled by button
    if (gameState === 'SHOP') return; // Handled by DOM buttons

    if (gameState === 'PLAYING') {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Check hits
        let hit = false;
        for (let i = items.length - 1; i >= 0; i--) {
            if (items[i].contains(mx, my)) {
                // Scan success
                const earn = Math.ceil(CONFIG.salaryPerScan * salaryMultiplier);
                money += earn;
                dailyEarnings += earn;
                
                // FX
                playSfx('collect', { cooldown: 80 });
                playSfx('success', { cooldown: 80 });
                synthesizeSfx('beep');
                vibrate('light');
                showOverlay('success', `Scan +$${earn}`);
                particles.push(new Particle(items[i].x, items[i].y, `+$${earn}`));
                
                // Flash effect
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(items[i].x, items[i].y, items[i].r * 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                items.splice(i, 1);
                hit = true;
                break; // One per tap
            }
        }

        if (!hit) {
            playSfx('blocked', { cooldown: 140 });
        }
    }
}

function handleUIButtonPress(e) {
    e.stopPropagation();
    unlockAudio();
    playSfx('click', { cooldown: 90 });
}

// Event Listeners
window.addEventListener('pointerdown', handleInput, { passive: false });
uiButtons.forEach((button) => button.addEventListener('pointerdown', handleUIButtonPress, { passive: true }));

// Shop Buttons
document.getElementById('btn-buy-food').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= 20 && energy < 100) {
        money -= 20;
        energy = Math.min(100, energy + 50);
        playSfx('upgrade', { cooldown: 140 });
        showOverlay('success', 'Snack Break');
        updateHUD();
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Need More Cash');
    }
});

document.getElementById('btn-buy-deco').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= decoCost) {
        money -= decoCost;
        salaryMultiplier += 0.2;
        decoCost *= 1.5;
        playSfx('upgrade', { cooldown: 140 });
        showOverlay('success', 'Scanner Boost');
        updateHUD();
        document.getElementById('deco-price').textContent = `-$${Math.floor(decoCost)}`;
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Upgrade Locked');
    }
});

document.getElementById('btn-buy-store').addEventListener('click', (e) => {
    e.stopPropagation();
    if (money >= 5000) {
        money -= 5000;
        playSfx('win', { cooldown: 160 });
        gameOver('WIN');
    } else {
        playSfx('blocked', { cooldown: 140 });
        showOverlay('fail', 'Store Too Pricey');
    }
});

document.getElementById('btn-next-day').addEventListener('click', (e) => {
    e.stopPropagation();
    day++;
    startDay();
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    initGame();
});

// Resize Observer
const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
        const { width, height } = entry.contentRect;
        cw = width;
        ch = height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        
        if (!initialized) initGame();
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        stopAllLoops();
    } else {
        syncLoopAudio();
    }
});

window.addEventListener('blur', stopAllLoops);
window.addEventListener('focus', syncLoopAudio);

document.addEventListener('DOMContentLoaded', () => {
    ro.observe(document.getElementById('game-container'));
});

</script>
