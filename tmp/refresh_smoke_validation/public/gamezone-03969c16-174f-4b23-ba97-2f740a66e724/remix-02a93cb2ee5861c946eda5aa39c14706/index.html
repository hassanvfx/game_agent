<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Frontier Collapse</title>
    <!-- [agent-note][stage3] resolved-font: title -> Creepster | ui -> Rajdhani | accent -> Press Start 2P from catalogs/fonts.json -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rajdhani:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-white: #fff;
            --color-black: #000;
            --color-red-600: #dc2626;
            --color-red-500: #ef4444;
            --color-red-800: #991b1b;
            --color-red-900: #7f1d1d;
            --color-blue-500: #3b82f6;
            --color-blue-800: #1e40af;
            --color-blue-900: #1e3a8a;
            --color-yellow-300: #fde047;
            --color-yellow-500: #eab308;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-600: #4b5563;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;
            --color-purple-900: #581c87;
            --color-orange-900: #7c2d12;
            --color-green-400: #4ade80;
            --sky-top: #110f25;
            --sky-bottom: #35214f;
            --dust-glow: rgba(255, 191, 71, 0.18);
            --panel-bg: rgba(9, 12, 24, 0.8);
            --panel-border: rgba(119, 205, 255, 0.32);
            --panel-highlight: rgba(255, 214, 102, 0.38);
            --hud-glow: 0 0 18px rgba(69, 197, 255, 0.14);
            --accent-cyan: #6be8ff;
            --accent-gold: #ffd166;
            --accent-amber: #ff9f43;
            --danger-glow: rgba(255, 83, 83, 0.3);
            --safe-glow: rgba(57, 255, 20, 0.22);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            background:
                radial-gradient(circle at top, rgba(255, 181, 71, 0.1), transparent 32%),
                linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 55%, #0b0c16 100%);
            font-family: 'Rajdhani', system-ui, sans-serif;
            color: #eee;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .font-horror { font-family: 'Creepster', fantasy; }
        .font-retro { font-family: 'Rajdhani', system-ui, sans-serif; }
        .font-pixel { font-family: 'Press Start 2P', monospace; }

        /* Minimal utility layer replacing removed Tailwind runtime */
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .top-0 { top: 0; }
        .top-1\/4 { top: 25%; }
        .left-0 { left: 0; }
        .right-0 { right: 0; }
        .bottom-0 { bottom: 0; }
        .bottom-6 { bottom: 1.5rem; }
        .left-30px { left: 30px; }
        .w-full { width: 100%; }
        .w-1\/2 { width: 50%; }
        .w-40 { width: 10rem; }
        .h-full { height: 100%; }
        .h-px { height: 1px; }
        .h-2 { height: 0.5rem; }
        .h-3 { height: 0.75rem; }
        .h-24 { height: 6rem; }
        .max-w-sm { max-width: 24rem; }
        .overflow-hidden { overflow: hidden; }
        .rounded { border-radius: 0.25rem; }
        .flex { display: flex; }
        .hidden { display: none !important; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .p-1 { padding: 0.25rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-4 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .my-2 { margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .text-\[10px\] { font-size: 10px; }
        .tracking-widest { letter-spacing: 0.1em; }
        .uppercase { text-transform: uppercase; }
        .outline-none { outline: none; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .opacity-50 { opacity: 0.5; }
        .cursor-not-allowed { cursor: not-allowed; }
        .ring-4 { box-shadow: 0 0 0 4px rgba(255,255,255,0.75); }
        .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.35); }

        .text-white { color: var(--color-white); }
        .text-white\/80 { color: rgba(255,255,255,0.8); }
        .text-red-500 { color: var(--color-red-500); }
        .text-red-600 { color: var(--color-red-600); }
        .text-yellow-300 { color: var(--color-yellow-300); }
        .text-yellow-500 { color: var(--color-yellow-500); }
        .text-yellow-400 { color: #facc15; }
        .text-gray-400 { color: var(--color-gray-400); }
        .text-gray-500 { color: var(--color-gray-500); }
        .text-gray-600 { color: var(--color-gray-600); }
        .text-gray-700 { color: var(--color-gray-700); }
        .bg-black { background: var(--color-black); }
        .bg-black\/95 { background: rgba(0,0,0,0.95); }
        .bg-black\/70 { background: rgba(0,0,0,0.7); }
        .bg-black\/50 { background: rgba(0,0,0,0.5); }
        .bg-white\/20 { background: rgba(255,255,255,0.2); }
        .bg-gray-700 { background: var(--color-gray-700); }
        .bg-gray-800 { background: var(--color-gray-800); }
        .bg-blue-900 { background: var(--color-blue-900); }
        .bg-blue-800 { background: var(--color-blue-800); }
        .bg-purple-900 { background: var(--color-purple-900); }
        .bg-orange-900 { background: var(--color-orange-900); }
        .bg-red-900 { background: var(--color-red-900); }
        .bg-yellow-600 { background: #ca8a04; }
        .border { border-width: 1px; border-style: solid; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-3 { border-width: 3px; border-style: solid; }
        .border-gray-500 { border-color: #6b7280; }
        .border-gray-600 { border-color: var(--color-gray-600); }
        .border-gray-700 { border-color: var(--color-gray-700); }
        .border-blue-500 { border-color: var(--color-blue-500); }
        .border-blue-400 { border-color: #60a5fa; }
        .border-red-500 { border-color: #ef4444; }
        .border-red-600 { border-color: var(--color-red-600); }
        .border-white\/20 { border-color: rgba(255,255,255,0.2); }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .text-shadow {
            text-shadow: 0 2px 4px rgba(0,0,0,0.85);
        }

        /* UI Elements */
        .ui-panel {
            background:
                linear-gradient(180deg, rgba(15, 22, 39, 0.95), rgba(11, 11, 18, 0.88)),
                radial-gradient(circle at top, rgba(107, 232, 255, 0.12), transparent 50%);
            border: 2px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 12px 28px rgba(0,0,0,0.45),
                var(--hud-glow);
            backdrop-filter: blur(8px);
        }
        .btn-game {
            background: linear-gradient(180deg, rgba(36, 49, 74, 0.96), rgba(18, 24, 36, 0.96));
            border: 2px solid rgba(125, 190, 255, 0.38);
            color: white;
            text-transform: uppercase;
            font-family: 'Rajdhani', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,0,0,0.28);
        }
        .btn-game:active { transform: scale(0.95); filter: brightness(1.08); background: linear-gradient(180deg, rgba(24, 32, 49, 0.98), rgba(10, 14, 22, 0.98)); }
        .btn-red { background: linear-gradient(180deg, #7a2737, #45141b); border-color: rgba(255, 109, 109, 0.4); }
        .btn-green { background: linear-gradient(180deg, #185b57, #123330); border-color: rgba(88, 255, 198, 0.32); }
        .panel-badge {
            background: linear-gradient(180deg, rgba(255, 209, 102, 0.18), rgba(255, 159, 67, 0.08));
            border: 1px solid rgba(255, 209, 102, 0.32);
            box-shadow: 0 0 10px rgba(255, 209, 102, 0.12);
        }
        .lobby-shell {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 162, 0, 0.18), transparent 32%),
                linear-gradient(180deg, rgba(2, 3, 9, 0.84), rgba(0, 0, 0, 0.96));
        }
        .hud-card {
            background: linear-gradient(180deg, rgba(8, 13, 26, 0.82), rgba(5, 7, 14, 0.86));
            border: 1px solid rgba(104, 183, 255, 0.24);
            box-shadow: var(--hud-glow);
            backdrop-filter: blur(6px);
        }
        .resource-pill {
            padding: 0.2rem 0.4rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .action-stack {
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
        }

        #game-container { touch-action: none; }
        input, button { touch-action: manipulation; }

        /* Joystick */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 20; }
        .joystick-base { width: 100%; height: 100%; background: radial-gradient(circle, rgba(107, 232, 255, 0.14), rgba(255,255,255,0.04)); border-radius: 50%; border: 2px solid rgba(107, 232, 255, 0.24); position: relative; box-shadow: inset 0 0 24px rgba(107, 232, 255, 0.08), 0 0 18px rgba(0,0,0,0.3); }
        .joystick-stick { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(107, 232, 255, 0.45) 40%, rgba(24, 33, 53, 0.95)); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 12px rgba(107, 232, 255, 0.25); }

        /* Action Buttons */
        .action-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.22);
            background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.2), rgba(0,0,0,0.58));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
            color: white;
            box-shadow: 0 0 16px rgba(0,0,0,0.28);
        }
        .action-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }

        /* Animations */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
        .animate-pulse-red { animation: pulse-red 2s infinite; }
        .dust-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 8%),
                radial-gradient(circle at 80% 20%, rgba(255,209,102,0.09), transparent 10%),
                radial-gradient(circle at 55% 75%, rgba(107,232,255,0.07), transparent 8%);
            mix-blend-mode: screen;
            opacity: 0.7;
        }
        .feedback-gif-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }
        .feedback-gif {
            position: absolute;
            width: min(28vw, 144px);
            max-width: 38vw;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 28px rgba(0,0,0,0.34);
            background: rgba(7, 10, 18, 0.5);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            object-fit: cover;
        }
        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }
        #combat-gif {
            right: 12px;
            top: 88px;
        }
        #relic-gif {
            left: 12px;
            top: 88px;
        }
        .hud-tag {
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.08em;
        }
        @media (max-width: 640px) {
            .feedback-gif {
                width: min(30vw, 110px);
            }
            #combat-gif, #relic-gif {
                top: 118px;
            }
        }
    </style>
</head>
<body>

    <!-- GAME CANVAS -->
    <div id="game-container" class="relative w-full h-full overflow-hidden">
        <canvas id="gameCanvas"></canvas>

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="absolute inset-0 flex flex-col items-center justify-center lobby-shell z-50 p-4">
            <div class="dust-overlay" aria-hidden="true"></div>
            <h1 class="text-5xl text-red-600 font-horror mb-2 text-center tracking-widest text-shadow">FRONTIER<br>COLLAPSE</h1>
            <div class="panel-badge px-4 py-1 mb-4 text-xs text-yellow-300 uppercase tracking-widest">Warden Signal // Frontier Survival</div>

            <div class="ui-panel p-4 w-full max-w-sm rounded flex flex-col gap-4">
                <!-- Name Input -->
                <div class="flex flex-col gap-1">
                    <label class="text-gray-400 text-lg">CALLSIGN</label>
                    <input type="text" id="player-name" placeholder="Scout Name..." class="bg-black border border-gray-600 p-2 text-xl text-white outline-none font-retro uppercase" maxlength="12">
                </div>

                <!-- Team Select -->
                <div class="flex flex-col gap-2">
                    <label class="text-gray-400 text-lg">CHOOSE YOUR ROLE</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="btn-game btn-green py-3" onclick="selectTeam('HUMAN', event)">SETTLER</button>
                        <button class="btn-game bg-gray-700 py-3" onclick="selectTeam('MILITARY', event)">RANGER</button>
                        <button class="btn-game btn-red py-3" onclick="selectTeam('ZOMBIE', event)">RAIDER</button>
                        <button class="btn-game bg-orange-900 py-3" onclick="selectTeam('TANKER', event)">BRUTE</button>
                    </div>
                    <button class="btn-game bg-purple-900 w-full mt-1 py-3" onclick="selectTeam('SPECTATOR', event)">SCOUT DRONE (FLY)</button>

                    <!-- Hero Locked -->
                    <button id="hero-btn" class="btn-game bg-yellow-900 w-full mt-1 opacity-50 cursor-not-allowed relative py-3" onclick="trySelectHero()">
                        WARDEN (LOCKED) 🔒
                        <div class="text-[10px] absolute bottom-0 right-2 text-yellow-300">FIND RELIC</div>
                    </button>
                </div>

                <div class="h-px bg-gray-700 my-2"></div>

                <button id="start-btn" class="btn-game bg-blue-900 border-blue-500 py-4 text-2xl tracking-widest shadow-lg animate-pulse">
                    DEPLOY
                </button>
            </div>

                <div class="mt-4 text-center text-gray-500 text-sm font-retro">
                    <p>Move, strike, gather, and hold out as long as you can.</p>
                </div>
        </div>

        <!-- HUD (Gameplay) -->
        <div id="hud-layer" class="absolute inset-0 pointer-events-none hidden">
            <!-- [agent-note][stage3] resolved-gif: combat-hit + relic-unlock overlays from catalogs/gifs.json -->
            <div class="feedback-gif-layer" aria-hidden="true">
                <img id="combat-gif" class="feedback-gif" alt="combat feedback overlay">
                <img id="relic-gif" class="feedback-gif" alt="relic unlock feedback overlay">
            </div>


            <!-- Top Bar -->
            <div class="absolute top-0 left-0 right-0 p-2 flex justify-between items-start pointer-events-auto">
                <!-- Stats -->
                <div class="flex flex-col gap-1 w-1/2">
                    <!-- HP -->
                    <div class="flex items-center gap-2 hud-card p-1 rounded border border-gray-700">
                        <span class="text-red-500 text-xl">♥</span>
                        <div class="w-full h-3 bg-gray-800 rounded overflow-hidden">
                            <div id="hp-bar" class="h-full bg-red-600 transition-all duration-200" style="width: 100%"></div>
                        </div>
                    </div>
                    <!-- Age -->
                    <div class="flex items-center gap-2 hud-card p-1 rounded border border-gray-700">
                        <span class="text-gray-400 text-sm">TIME</span>
                        <div class="w-full h-2 bg-gray-800 rounded overflow-hidden">
                            <div id="age-bar" class="h-full bg-yellow-600 transition-all duration-1000" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Resources -->
                    <div class="flex gap-2 text-sm text-shadow mt-1">
                        <span class="text-yellow-400 resource-pill">🪵 <span id="wood-count">0</span></span>
                        <span class="text-gray-400 resource-pill">🪨 <span id="stone-count">0</span></span>
                    </div>
                </div>

                <!-- Chat/System Log -->
                <div class="w-40 flex flex-col items-end">
                    <button id="menu-btn" class="hud-card bg-gray-800 border border-gray-600 text-white px-2 py-1 text-xs mb-2">MENU</button>
                    <div id="chat-box" class="hud-card w-full h-24 overflow-hidden text-right text-xs text-white/80 font-retro flex flex-col justify-end pointer-events-none text-shadow"></div>
                </div>
            </div>

            <!-- Controls -->
            <div id="controls-area" class="absolute inset-0 pointer-events-none">
                <!-- Joystick -->
                <div id="joystick-zone" class="pointer-events-auto">
                    <div class="joystick-base">
                        <div class="joystick-stick" id="joystick-stick"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="absolute bottom-6 right-6 flex flex-col gap-4 items-end pointer-events-auto action-stack">

                    <!-- Build Button (Human Only) -->
                    <div id="build-controls" class="hidden flex flex-col gap-2 items-end">
                        <div id="build-menu" class="hidden flex flex-col gap-2 mb-2">
                            <button onclick="setBuildMode('WALL')" class="bg-gray-700 text-white p-2 rounded text-xs border border-gray-500">🧱 BARRICADE (5 Wood)</button>
                            <button onclick="setBuildMode('FLAG')" class="bg-blue-900 text-white p-2 rounded text-xs border border-blue-500">🚩 BEACON (20 Stone)</button>
                        </div>
                        <button id="btn-build" class="action-btn bg-blue-800 border-blue-400" onclick="toggleBuildMenu()">🔨</button>
                    </div>

                    <div class="flex gap-4">
                        <button id="btn-jump" class="action-btn bg-gray-700">⬆️</button>
                        <button id="btn-action" class="action-btn bg-red-800 border-red-500 animate-pulse-red">⚔️</button>
                    </div>
                </div>
            </div>

            <!-- Notification Overlay -->
            <div id="notification" class="absolute top-1/4 w-full text-center pointer-events-none hidden">
                        <span class="bg-black/70 text-white text-xl px-4 py-2 rounded border border-white/20 font-pixel tracking-widest" id="notif-text"></span>
            </div>
        </div>

        <!-- DEATH SCREEN -->
        <div id="death-screen" class="hidden absolute inset-0 bg-black/95 z-50 flex flex-col items-center justify-center text-center p-6">
            <h2 class="text-6xl text-red-600 font-horror mb-4">RUN OVER</h2>
            <p id="death-reason" class="text-gray-400 text-xl font-retro mb-8">Time ran out.</p>
            <div class="text-yellow-500 text-2xl mb-8">SURVIVAL: <span id="final-score">0</span> CYCLES</div>
            <button onclick="resetGame()" class="btn-game bg-red-900 px-8 py-4 text-2xl border-red-600">REDEPLOY</button>
        </div>

    </div>

    <script type="module">
        /* --- CORE CONFIG & STATE --- */
        const CONFIG = {
            teams: {
                HUMAN: { hp: 100, speed: 3, color: '#3b82f6', size: 12, damage: 10 },
                MILITARY: { hp: 150, speed: 3.5, color: '#2f855a', size: 12, damage: 25 },
                ZOMBIE: { hp: 120, speed: 4, color: '#39FF14', size: 12, damage: 15 },
                TANKER: { hp: 300, speed: 2, color: '#742a2a', size: 20, damage: 30 },
                SPECTATOR: { hp: 9999, speed: 8, color: '#ffffff', size: 5, damage: 0 },
                HERO: { hp: 200, speed: 5, color: '#ecc94b', size: 14, damage: 50 } // Unlockable
            },
            resources: {
                TREE: { hp: 30, color: '#22543d', drop: 'wood', amount: 5, size: 20 },
                ROCK: { hp: 50, color: '#4a5568', drop: 'stone', amount: 3, size: 18 },
                KEY: { hp: 1, color: '#ecc94b', drop: 'key', amount: 1, size: 8 }
            }
        };

        const STATE = {
            running: false,
            width: 0, height: 0,
            camera: { x: 0, y: 0 },
            frame: 0,
            buildMode: null, // 'WALL', 'FLAG'
            hasKey: false
        };

        const PLAYER = {
            id: 'local',
            name: 'Scout',
            team: 'HUMAN',
            x: 0, y: 0,
            z: 0, // Jump height
            vx: 0, vy: 0, vz: 0,
            angle: 0,
            hp: 100, maxHp: 100,
            age: 0, maxAge: 10000, // Frames until death (~3 mins)
            inventory: { wood: 0, stone: 0 },
            family: false,
            score: 0
        };

        let entities = [];
        let particles = [];
        let floatText = [];

        const MEDIA = {
            audio: {
                uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
                start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
                swing: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3',
                hit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/hit_01.mp3',
                pickup: 'https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3',
                build: 'https://gamezone-virid.vercel.app/assets/audios/ui/success_01.mp3',
                deny: 'https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3',
                damage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_01.mp3',
                gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
                bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
            },
            gifs: {
                combat: 'https://i.giphy.com/1AjEBGWggGXh9onllB.webp',
                relic: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
            }
        };

        const audioBank = {};
        let audioUnlocked = false;
        let bgmStarted = false;
        let bgmTrack = null;
        let lastSoundAt = {};
        let gifTimers = {};

        function primeAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            Object.entries(MEDIA.audio).forEach(([key, src]) => {
                const audio = new Audio(src);
                audio.preload = 'auto';
                audio.crossOrigin = 'anonymous';
                if (key === 'bgm') {
                    audio.loop = true;
                    audio.volume = 0.2;
                    bgmTrack = audio;
                } else {
                    audio.volume = ({
                        uiClick: 0.4,
                        start: 0.5,
                        swing: 0.38,
                        hit: 0.42,
                        pickup: 0.48,
                        build: 0.42,
                        deny: 0.45,
                        damage: 0.4,
                        gameOver: 0.55
                    })[key] ?? 0.45;
                    audioBank[key] = audio;
                }
            });
        }

        function ensureMediaReady() {
            if (!audioUnlocked) {
                primeAudio();
            }
            if (!bgmStarted && bgmTrack) {
                bgmStarted = true;
                bgmTrack.currentTime = 0;
                bgmTrack.play().catch(() => {
                    bgmStarted = false;
                });
            }
        }

        function stopBgm() {
            if (!bgmTrack) return;
            bgmTrack.pause();
            bgmTrack.currentTime = 0;
            bgmStarted = false;
        }

        /* --- DOM ELEMENTS --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        const combatGif = document.getElementById('combat-gif');
        const relicGif = document.getElementById('relic-gif');

        combatGif.src = MEDIA.gifs.combat;
        relicGif.src = MEDIA.gifs.relic;

        /* --- INITIALIZATION --- */
        function resize() {
            STATE.width = canvas.width = window.innerWidth;
            STATE.height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Team Selection
        window.selectTeam = (team, evt) => {
            primeAudio();
            playSound('uiClick', 120);
            PLAYER.team = team;
            // Visual feedback
            document.querySelectorAll('#lobby-screen button').forEach(b => b.classList.remove('ring-4', 'ring-white'));
            evt?.currentTarget?.classList.add('ring-4', 'ring-white');
        };

        window.trySelectHero = () => {
            if(STATE.hasKey) {
                selectTeam('HERO');
            } else {
                playSound('deny');
                alert("You need a relic to unlock the Warden. Find it in the field.");
            }
        };

        document.getElementById('start-btn').onclick = () => {
            primeAudio();
            playSound('start', 300);
            const name = document.getElementById('player-name').value.trim() || "Scout";
            PLAYER.name = name;
            startGame();
        };

        function startGame() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('hud-layer').classList.remove('hidden');
            ensureMediaReady();

            // Apply Team Stats
            const stats = CONFIG.teams[PLAYER.team];
            PLAYER.hp = PLAYER.maxHp = stats.hp;
            PLAYER.speedBase = stats.speed;
            PLAYER.damage = stats.damage;
            PLAYER.size = stats.size;
            PLAYER.age = 0;
            PLAYER.inventory = { wood: 0, stone: 0 };
            PLAYER.x = (Math.random()-0.5)*1000;
            PLAYER.y = (Math.random()-0.5)*1000;

            // Reset World
            entities = [];
            generateWorld();

            // UI Setup
            if (['HUMAN', 'MILITARY', 'HERO'].includes(PLAYER.team)) {
                document.getElementById('build-controls').classList.remove('hidden');
                document.getElementById('btn-action').innerHTML = '🪓'; // Gather/Attack
                document.getElementById('btn-action').classList.remove('hidden');
            } else if (PLAYER.team === 'SPECTATOR') {
                document.getElementById('build-controls').classList.add('hidden');
                document.getElementById('btn-action').classList.add('hidden');
            } else {
                // Zombie
                document.getElementById('build-controls').classList.add('hidden');
                document.getElementById('btn-action').innerHTML = '🦷'; // Bite
                document.getElementById('btn-action').classList.remove('hidden');
            }

            STATE.running = true;
            STATE.frame = 0;
            loop();

            addChat("System", `Welcome ${PLAYER.name}. Hold the frontier.`);
        }

        function generateWorld() {
            // Trees & Rocks
            for(let i=0; i<100; i++) {
                spawnEntity('resource', (Math.random()-0.5)*3000, (Math.random()-0.5)*3000, {
                    subtype: Math.random() > 0.3 ? 'TREE' : 'ROCK'
                });
            }
            // Key (Rare)
            spawnEntity('resource', (Math.random()-0.5)*2000, (Math.random()-0.5)*2000, { subtype: 'KEY' });

            // AI Bots
            for(let i=0; i<15; i++) {
                spawnEntity('bot', (Math.random()-0.5)*2000, (Math.random()-0.5)*2000, {
                    team: Math.random() > 0.7 ? 'ZOMBIE' : 'HUMAN'
                });
            }
        }

        /* --- INPUT --- */
        const joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };

        joystickZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.changedTouches[0];
            joystick.active = true;
            joystick.originX = t.clientX;
            joystick.originY = t.clientY;
            joystickStick.style.transition = 'none';
        }, {passive: false});

        joystickZone.addEventListener('touchmove', e => {
            e.preventDefault();
            if(!joystick.active) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - joystick.originX;
            const dy = t.clientY - joystick.originY;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            joystick.dx = Math.cos(angle) * (dist/40);
            joystick.dy = Math.sin(angle) * (dist/40);

            joystickStick.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
        }, {passive: false});

        const resetJoystick = () => {
            joystick.active = false;
            joystick.dx = 0; joystick.dy = 0;
            joystickStick.style.transform = `translate(-50%, -50%)`;
            joystickStick.style.transition = 'transform 0.2s';
        };
        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        // Buttons
        const jumpButton = document.getElementById('btn-jump');
        const actionButton = document.getElementById('btn-action');
        const menuButton = document.getElementById('menu-btn');

        const triggerJump = (e) => {
            e?.preventDefault?.();
            if (PLAYER.z === 0) PLAYER.vz = 8;
        };

        const triggerAction = (e) => {
            e?.preventDefault?.();
            handleAction();
        };

        jumpButton.addEventListener('touchstart', triggerJump, { passive: false });
        jumpButton.addEventListener('click', triggerJump);

        actionButton.addEventListener('touchstart', triggerAction, { passive: false });
        actionButton.addEventListener('click', triggerAction);

        menuButton.addEventListener('click', () => {
            if (!STATE.running) return;
            playSound('uiClick', 120);
            STATE.running = false;
            stopBgm();
            document.getElementById('hud-layer').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            addChat("System", "Transmission paused. Back in lobby.");
        });

        /* --- GAME LOGIC --- */
        function spawnEntity(type, x, y, props={}) {
            const id = Math.random().toString(36).substr(2, 9);
            const ent = { id, type, x, y, z: 0, hp: 10, ...props };

            if(type === 'resource') {
                const data = CONFIG.resources[props.subtype];
                ent.color = data.color;
                ent.size = data.size;
                ent.hp = data.hp;
            } else if (type === 'bot') {
                const data = CONFIG.teams[props.team];
                ent.color = data.color;
                ent.size = data.size;
                ent.hp = data.hp;
                ent.speed = data.speed * 0.8; // Bots slightly slower
                ent.name = props.team === 'ZOMBIE' ? 'Raider' : 'Settler ' + Math.floor(Math.random()*100);
            }

            entities.push(ent);
            return ent;
        }

        function handleAction() {
            // Build Logic
            if (STATE.buildMode) {
                placeBuilding();
                return;
            }

            // Attack / Gather Logic
            // Create a hit area in front of player
            const reach = 40;
            const hx = PLAYER.x + Math.cos(PLAYER.angle) * reach;
            const hy = PLAYER.y + Math.sin(PLAYER.angle) * reach;

            // Visual Swipe
            particles.push({ x: hx, y: hy, vx: 0, vy: 0, life: 10, type: 'swipe', angle: PLAYER.angle });
            playSound('swing');

            let hit = false;
            entities.forEach(e => {
                const dist = Math.hypot(e.x - hx, e.y - hy);
                if (dist < e.size + 20) {
                    hit = true;
                    // Damage
                    e.hp -= PLAYER.damage;
                    spawnFloatText(e.x, e.y, `-${PLAYER.damage}`, '#fff');
                    playSound('hit');

                    // Resource Gather
                    if (e.type === 'resource' && e.hp <= 0) {
                        const r = CONFIG.resources[e.subtype];
                        if (r.drop === 'key') {
                            STATE.hasKey = true;
                            showNotification("RELIC FOUND! WARDEN READY!");
                            playSound('pickup', 180);
                            triggerGif('relic');
                            document.getElementById('hero-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                            document.getElementById('hero-btn').innerHTML = "WARDEN (READY) 🔓";
                        } else {
                            PLAYER.inventory[r.drop] = (PLAYER.inventory[r.drop] || 0) + r.amount;
                            spawnFloatText(PLAYER.x, PLAYER.y - 30, `+${r.amount} ${r.drop}`, '#ffff00');
                            playSound('pickup', 110);
                        }
                        killEntity(e);
                    }
                    // Combat
                    else if (e.type === 'bot' && e.hp <= 0) {
                        killEntity(e);
                        triggerGif('combat');
                        spawnFloatText(PLAYER.x, PLAYER.y, "DOWN!", "red");
                    }
                }
            });
        }

        window.toggleBuildMenu = () => {
            const menu = document.getElementById('build-menu');
            menu.classList.toggle('hidden');
            STATE.buildMode = null;
        };

        window.setBuildMode = (mode) => {
            STATE.buildMode = mode;
            showNotification(`MODE: BUILD ${mode}`);
            document.getElementById('build-menu').classList.add('hidden');
        };

        function placeBuilding() {
            const cost = STATE.buildMode === 'WALL' ? { wood: 5 } : { stone: 20 };
            const canAfford = PLAYER.inventory.wood >= (cost.wood||0) && PLAYER.inventory.stone >= (cost.stone||0);

            if (canAfford) {
                PLAYER.inventory.wood -= (cost.wood||0);
                PLAYER.inventory.stone -= (cost.stone||0);

                const bx = PLAYER.x + Math.cos(PLAYER.angle) * 40;
                const by = PLAYER.y + Math.sin(PLAYER.angle) * 40;

                entities.push({
                    type: 'building',
                    subtype: STATE.buildMode,
                    x: bx, y: by,
                    hp: STATE.buildMode === 'WALL' ? 100 : 50,
                    size: STATE.buildMode === 'WALL' ? 20 : 10,
                    color: STATE.buildMode === 'WALL' ? '#718096' : '#3182ce'
                });

                spawnFloatText(bx, by, "PLACED!", "#39FF14");
                playSound('build', 160);
                STATE.buildMode = null;
            } else {
                showNotification("MORE SUPPLIES NEEDED!");
                playSound('deny');
            }
        }

        function killEntity(e) {
            entities = entities.filter(ent => ent !== e);
            // Particles
            for(let i=0; i<5; i++) {
                particles.push({
                    x: e.x, y: e.y,
                    vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                    life: 30,
                    color: e.color,
                    type: 'debris'
                });
            }
        }

        function update() {
            if (!STATE.running) return;
            STATE.frame++;

            // Player Physics
            if (PLAYER.team !== 'SPECTATOR') {
                PLAYER.x += joystick.dx * PLAYER.speedBase;
                PLAYER.y += joystick.dy * PLAYER.speedBase;
                if (joystick.dx || joystick.dy) PLAYER.angle = Math.atan2(joystick.dy, joystick.dx);

                // Jump
                PLAYER.z += PLAYER.vz;
                PLAYER.vz -= 0.5; // Gravity
                if (PLAYER.z < 0) { PLAYER.z = 0; PLAYER.vz = 0; }

                // Aging
                PLAYER.age++;
                if (PLAYER.age >= PLAYER.maxAge) {
                    die("YOU LASTED UNTIL DUSK");
                }

                // Family
                if (PLAYER.age === Math.floor(PLAYER.maxAge * 0.3) && !PLAYER.family) {
                    PLAYER.family = true;
                    spawnEntity('bot', PLAYER.x, PLAYER.y, { team: PLAYER.team, size: 8 }); // Child
                    showNotification("A NEW CREW JOINS YOU!");
                }
            } else {
                // Spectator Flight
                PLAYER.x += joystick.dx * 10;
                PLAYER.y += joystick.dy * 10;
            }

            // Camera Follow
            STATE.camera.x += (PLAYER.x - STATE.camera.x) * 0.1;
            STATE.camera.y += (PLAYER.y - STATE.camera.y) * 0.1;

            // Entities Update
            entities.forEach(e => {
                // Bot AI
                if (e.type === 'bot') {
                    // Simple wander/chase
                    let target = null;
                    let minDist = 300;

                    // Zombies chase Humans
                    if (e.team === 'ZOMBIE') {
                        // Find nearest human
                        if (PLAYER.team !== 'ZOMBIE' && PLAYER.team !== 'SPECTATOR') {
                            const d = Math.hypot(PLAYER.x - e.x, PLAYER.y - e.y);
                            if (d < minDist) { target = PLAYER; minDist = d; }
                        }
                    }

                    if (target) {
                        const angle = Math.atan2(target.y - e.y, target.x - e.x);
                        e.x += Math.cos(angle) * e.speed;
                        e.y += Math.sin(angle) * e.speed;

                        // Attack Player
                        if (minDist < 30 && STATE.frame % 60 === 0) {
                            PLAYER.hp -= 10;
                            spawnFloatText(PLAYER.x, PLAYER.y, "-10 HP", "red");
                            playSound('damage', 250);
                            if (PLAYER.hp <= 0) die("OVERRUN BY RAIDERS");
                        }
                    } else {
                        // Wander
                        if (STATE.frame % 60 === 0) {
                            e.vx = (Math.random()-0.5)*2;
                            e.vy = (Math.random()-0.5)*2;
                        }
                        e.x += (e.vx||0); e.y += (e.vy||0);
                    }
                }
            });

            // Particles
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);

            // Float Text
            floatText.forEach(t => { t.y -= 1; t.life--; });
            floatText = floatText.filter(t => t.life > 0);

            // UI Updates
            const agePct = (PLAYER.age / PLAYER.maxAge) * 100;
            document.getElementById('age-bar').style.width = `${agePct}%`;
            document.getElementById('hp-bar').style.width = `${(PLAYER.hp/PLAYER.maxHp)*100}%`;
            document.getElementById('wood-count').innerText = PLAYER.inventory.wood;
            document.getElementById('stone-count').innerText = PLAYER.inventory.stone;

            // Random Chat
            if (Math.random() < 0.005) {
                const msgs = [
                    "Barricade going up...", "Raiders near the ridge!", "Need supplies!",
                    "Beacon is still standing.", "Need wood!", "They're pushing in...", "Found a relic!"
                ];
                const names = ["Mara", "Jace", "Ranger07", "HeavyRam", "ScoutX"];
                addChat(names[Math.floor(Math.random()*names.length)], msgs[Math.floor(Math.random()*msgs.length)]);
            }
        }

        function draw() {
            // Clear
            const skyGradient = ctx.createLinearGradient(0, 0, 0, STATE.height);
            skyGradient.addColorStop(0, '#120f27');
            skyGradient.addColorStop(0.55, '#2d2445');
            skyGradient.addColorStop(1, '#0b0d17');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            const vignette = ctx.createRadialGradient(
                STATE.width * 0.5,
                STATE.height * 0.42,
                STATE.width * 0.12,
                STATE.width * 0.5,
                STATE.height * 0.5,
                STATE.width * 0.72
            );
            vignette.addColorStop(0, 'rgba(255, 183, 77, 0.08)');
            vignette.addColorStop(0.45, 'rgba(18, 29, 44, 0.04)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.36)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            ctx.save();
            ctx.translate(STATE.width/2 - STATE.camera.x, STATE.height/2 - STATE.camera.y);

            // Draw Ground Grid (Grass/Dirt)
            const gridSize = 200;
            const startX = Math.floor((STATE.camera.x - STATE.width/2)/gridSize)*gridSize;
            const startY = Math.floor((STATE.camera.y - STATE.height/2)/gridSize)*gridSize;

            ctx.lineWidth = 1;
            ctx.strokeStyle = '#2d3748';

            for(let x=startX; x<startX+STATE.width+gridSize*2; x+=gridSize) {
                for(let y=startY; y<startY+STATE.height+gridSize*2; y+=gridSize) {
                    // Procedural ground detail
                    const noise = Math.sin(x*0.01) + Math.cos(y*0.01);
                    ctx.fillStyle = noise > 0 ? '#1d2731' : '#171c29';
                    ctx.fillRect(x, y, gridSize, gridSize);

                    if (noise > 0.35) {
                        ctx.fillStyle = 'rgba(255, 170, 58, 0.05)';
                        ctx.fillRect(x, y, gridSize, gridSize);
                    }

                    ctx.strokeStyle = 'rgba(101, 141, 187, 0.16)';
                    ctx.strokeRect(x, y, gridSize, gridSize);
                }
            }

            // Draw Entities (Sort by Y for pseudo-3D)
            const drawList = [...entities, { ...PLAYER, type: 'player' }];
            drawList.sort((a, b) => a.y - b.y);

            drawList.forEach(e => {
                const z = e.z || 0;
                const shadowScale = 1 - (z/100);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.ellipse(e.x, e.y, e.size * shadowScale, e.size * 0.5 * shadowScale, 0, 0, Math.PI*2);
                ctx.fill();

                // Body
                const drawY = e.y - z;

                if (e.type === 'resource') {
                    if (e.subtype === 'TREE') {
                        ctx.fillStyle = '#1a6a52';
                        ctx.beginPath(); ctx.moveTo(e.x, drawY-42); ctx.lineTo(e.x+17, drawY-2); ctx.lineTo(e.x-17, drawY-2); ctx.fill();
                        ctx.fillStyle = '#2dc18f';
                        ctx.beginPath(); ctx.moveTo(e.x, drawY-28); ctx.lineTo(e.x+12, drawY+4); ctx.lineTo(e.x-12, drawY+4); ctx.fill();
                        ctx.fillStyle = '#5d4037'; ctx.fillRect(e.x-4, drawY, 8, 10);
                    } else if (e.subtype === 'KEY') {
                        ctx.fillStyle = '#ffd166';
                        ctx.beginPath();
                        ctx.arc(e.x, drawY - 8, 7, 0, Math.PI*2);
                        ctx.strokeStyle = '#ffd166';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.fillRect(e.x + 4, drawY - 10, 16, 4);
                        ctx.fillRect(e.x + 12, drawY - 10, 4, 10);
                        ctx.fillRect(e.x + 18, drawY - 10, 4, 7);
                    } else {
                        // Rock
                        ctx.fillStyle = '#6f7f95';
                        ctx.beginPath(); ctx.arc(e.x, drawY, 15, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                        ctx.stroke();
                    }
                } else if (e.type === 'building') {
                    if (e.subtype === 'WALL') {
                        ctx.fillStyle = '#48596d';
                        ctx.fillRect(e.x-10, drawY-20, 20, 20);
                        ctx.strokeStyle = '#d3dae4'; ctx.strokeRect(e.x-10, drawY-20, 20, 20);
                    } else {
                        // FLAG
                        ctx.fillStyle = '#fff'; ctx.fillRect(e.x-2, drawY-40, 4, 40);
                        ctx.fillStyle = '#6be8ff'; ctx.fillRect(e.x, drawY-40, 20, 15);
                        ctx.fillStyle = 'rgba(107,232,255,0.12)'; ctx.beginPath(); ctx.arc(e.x, e.y, 100, 0, Math.PI*2); ctx.fill();
                    }
                } else {
                    // Units (Player/Bots)
                    const bodyGradient = ctx.createRadialGradient(e.x - e.size * 0.35, drawY - e.size * 1.45, 1, e.x, drawY - e.size, e.size * 1.4);
                    bodyGradient.addColorStop(0, '#ffffff');
                    bodyGradient.addColorStop(0.15, e.type === 'player' ? '#ffd166' : e.color);
                    bodyGradient.addColorStop(1, e.color);
                    ctx.fillStyle = bodyGradient;
                    ctx.beginPath(); ctx.arc(e.x, drawY - e.size, e.size, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    ctx.beginPath();
                    ctx.arc(e.x - e.size * 0.25, drawY - e.size * 1.25, Math.max(2, e.size * 0.16), 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = e.type === 'player' ? 'rgba(255, 209, 102, 0.85)' : 'rgba(255,255,255,0.14)';
                    ctx.lineWidth = e.type === 'player' ? 2 : 1;
                    ctx.beginPath();
                    ctx.arc(e.x, drawY - e.size, e.size + (e.type === 'player' ? 3 : 1), 0, Math.PI * 2);
                    ctx.stroke();

                    if (e.type === 'player') {
                        ctx.strokeStyle = 'rgba(255, 209, 102, 0.35)';
                        ctx.beginPath();
                        ctx.arc(e.x, drawY - e.size, e.size + 8 + Math.sin(STATE.frame * 0.08) * 2, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Name
                    if (e.name) {
                        ctx.fillStyle = '#fff'; ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'center';
                        ctx.fillText(e.name, e.x, drawY - e.size - 12);
                    }

                    // Health bar for units
                    if (e.hp < 100) {
                        ctx.fillStyle = 'red'; ctx.fillRect(e.x-10, drawY-e.size-8, 20, 3);
                        ctx.fillStyle = '#39FF14'; ctx.fillRect(e.x-10, drawY-e.size-8, 20 * (e.hp/100), 3);
                    }
                }
            });

            // Particles
            particles.forEach(p => {
                if (p.type === 'swipe') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(0, 0, 30, -0.5, 0.5); ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 30;
                    ctx.fillRect(p.x, p.y, 4, 4);
                    ctx.globalAlpha = 1;
                }
            });

            // Float Text
            ctx.font = 'bold 16px Rajdhani';
            ctx.textAlign = 'center';
            floatText.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);
            });

            ctx.restore();
        }

        function loop() {
            if (!STATE.running) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function die(reason) {
            STATE.running = false;
            playSound('gameOver', 600);
            stopBgm();
            document.getElementById('hud-layer').classList.add('hidden');
            document.getElementById('death-screen').classList.remove('hidden');
            document.getElementById('death-reason').innerText = reason;
            document.getElementById('final-score').innerText = Math.floor(PLAYER.age / 60);
        }

        window.resetGame = () => {
            stopBgm();
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        };

        /* --- UTILS --- */
        function spawnFloatText(x, y, text, color) {
            floatText.push({ x, y, text, color, life: 40 });
        }

        function showNotification(msg) {
            const el = document.getElementById('notif-text');
            const box = document.getElementById('notification');
            el.innerText = msg;
            box.classList.remove('hidden');
            box.classList.add('animate-pulse');
            setTimeout(() => { box.classList.add('hidden'); }, 2000);
        }

        function addChat(name, msg) {
            const box = document.getElementById('chat-box');
            const line = document.createElement('div');
            line.innerHTML = `<span class="text-yellow-500">${name}:</span> ${msg}`;
            box.appendChild(line);
            if (box.children.length > 5) box.removeChild(box.firstChild);
        }

        function triggerGif(type) {
            const target = type === 'relic' ? relicGif : combatGif;
            if (!target) return;
            target.classList.add('visible');
            clearTimeout(gifTimers[type]);
            gifTimers[type] = setTimeout(() => target.classList.remove('visible'), type === 'relic' ? 2200 : 900);
        }

        function playSound(type, minInterval = 0) {
            if (!audioUnlocked) return;
            const now = performance.now();
            if (minInterval && now - (lastSoundAt[type] || 0) < minInterval) return;
            lastSoundAt[type] = now;

            if (type === 'bgm') {
                ensureMediaReady();
                return;
            }

            const source = audioBank[type];
            if (!source) return;

            try {
                source.pause();
                source.currentTime = 0;
                source.play().catch(() => {});
            } catch (_) {}
        }

    </script>
</body>
