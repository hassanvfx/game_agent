<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Sprint Relay</title>
    <!-- [agent-note][stage3] resolved-font: title/ui -> catalogs/fonts.json (Orbitron + Exo 2) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1024;
            --bg-mid: #13265b;
            --sky-top: #4c7cff;
            --sky-bottom: #8fd8ff;
            --panel-bg: rgba(13, 22, 49, 0.82);
            --panel-border: rgba(150, 238, 255, 0.38);
            --panel-glow: rgba(79, 214, 255, 0.28);
            --text-main: #f6fbff;
            --text-dim: #b8d8ff;
            --accent-cyan: #76f7ff;
            --accent-gold: #ffd85f;
            --accent-orange: #ff9d57;
            --accent-pink: #ff6f8d;
            --hero-core: #3df0ff;
            --hero-shadow: #1e4be0;
            --hazard: #ff526e;
            --grass-top: #7df36b;
            --grass-main: #3daf57;
            --ground-low: #49345f;
            --ground-high: #7a56a2;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(168, 246, 255, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            color: var(--text-main);
            font-family: 'Exo 2', system-ui, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 18%, rgba(153, 235, 255, 0.22), transparent 28%),
                linear-gradient(180deg, #18306e 0%, #132455 35%, #090f21 100%);
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-container::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.22) 0 2px, transparent 3px),
                radial-gradient(circle at 75% 14%, rgba(255,255,255,0.18) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 60% 32%, rgba(255,255,255,0.14) 0 1.2px, transparent 2px),
                radial-gradient(circle at 82% 28%, rgba(255,255,255,0.16) 0 1.4px, transparent 2px);
            opacity: 0.8;
            animation: driftStars 16s linear infinite;
        }

        #game-container::after {
            background: linear-gradient(180deg, transparent 0%, rgba(8, 18, 45, 0.18) 50%, rgba(5, 10, 24, 0.42) 100%);
        }

        @keyframes driftStars {
            from { transform: translateX(0); }
            to { transform: translateX(-24px); }
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel {
            position: relative;
            max-width: min(92vw, 420px);
            padding: 22px 20px 20px;
            border-radius: 24px;
            text-align: center;
            pointer-events: auto;
            background:
                linear-gradient(180deg, rgba(21, 35, 77, 0.92), rgba(11, 18, 42, 0.92));
            border: 1px solid var(--panel-border);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.42),
                0 0 0 1px rgba(255,255,255,0.06) inset,
                0 0 24px var(--panel-glow);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.14), transparent 30%),
                radial-gradient(circle at 50% 0%, rgba(118, 247, 255, 0.16), transparent 45%);
            pointer-events: none;
        }

        .panel-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(10, 18, 40, 0.72);
            border: 1px solid rgba(118, 247, 255, 0.28);
        }

        .title {
            margin: 0 0 10px;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(28px, 8vw, 46px);
            line-height: 0.94;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow:
                0 0 18px rgba(118, 247, 255, 0.55),
                0 0 32px rgba(61, 240, 255, 0.24),
                0 3px 0 rgba(0, 0, 0, 0.45);
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: clamp(14px, 3.7vw, 18px);
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent-gold);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
            animation: panelPulse 1.6s ease-in-out infinite;
        }

        @keyframes panelPulse {
            0%, 100% { opacity: 0.78; }
            50% { opacity: 1; }
        }

        .character-chip {
            position: relative;
            width: 94px;
            height: 94px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 30%, #ffffff 0 10%, rgba(255,255,255,0.28) 12%, transparent 20%),
                radial-gradient(circle at 50% 45%, #73feff 0%, #31d2ff 58%, #2446db 100%);
            box-shadow:
                0 0 0 4px rgba(255,255,255,0.07),
                0 0 26px rgba(61, 240, 255, 0.42),
                inset 0 -10px 18px rgba(0, 0, 0, 0.26);
            animation: hoverBob 1.9s ease-in-out infinite;
        }

        .character-chip::before,
        .character-chip::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 3px dashed rgba(255,255,255,0.18);
            animation: orbitSpin 8s linear infinite;
        }

        .character-chip::after {
            inset: -8px;
            border-width: 2px;
            border-style: solid;
            border-color: rgba(118, 247, 255, 0.22) transparent rgba(255, 216, 95, 0.3) transparent;
            animation-direction: reverse;
            animation-duration: 5.5s;
        }

        .chip-face {
            position: absolute;
            inset: 0;
        }

        .chip-eye {
            position: absolute;
            top: 34px;
            width: 12px;
            height: 16px;
            border-radius: 999px;
            background: #0f1735;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.16);
        }

        .chip-eye.left { left: 28px; }
        .chip-eye.right { right: 28px; }

        .chip-smile {
            position: absolute;
            left: 50%;
            bottom: 22px;
            width: 28px;
            height: 14px;
            transform: translateX(-50%);
            border-bottom: 4px solid #0f1735;
            border-radius: 0 0 20px 20px;
        }

        @keyframes hoverBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .action-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            min-height: 50px;
            padding: 12px 24px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: clamp(16px, 4.5vw, 22px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #0b1432;
            background: linear-gradient(180deg, #ffe685, #ffb84d);
            box-shadow:
                0 10px 22px rgba(255, 181, 78, 0.34),
                inset 0 1px 0 rgba(255,255,255,0.68);
            transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            transform: translateY(-1px) scale(1.02);
            filter: brightness(1.04);
            box-shadow:
                0 14px 28px rgba(255, 181, 78, 0.42),
                inset 0 1px 0 rgba(255,255,255,0.72);
            outline: none;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn.secondary {
            background: linear-gradient(180deg, #eaf6ff, #bfd9ff);
            box-shadow:
                0 10px 22px rgba(111, 175, 255, 0.24),
                inset 0 1px 0 rgba(255,255,255,0.8);
            color: #14326c;
        }

        .hud {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 8px 10px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(12, 20, 46, 0.86), rgba(9, 14, 30, 0.84));
            border: 1px solid rgba(118, 247, 255, 0.28);
            box-shadow:
                0 8px 22px rgba(0,0,0,0.34),
                0 0 20px rgba(118, 247, 255, 0.16);
        }

        .hud.visible {
            display: inline-flex;
        }

        .token-orb {
            position: relative;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 32%, #fff2b6 0 16%, #ffd85f 20%, #ff8b3d 100%);
            box-shadow:
                0 0 0 2px rgba(255, 230, 133, 0.24),
                0 0 18px rgba(255, 177, 64, 0.34);
        }

        .token-orb::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 6px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
        }

        .hud-score {
            font-size: clamp(24px, 6vw, 36px);
            line-height: 1;
            color: var(--accent-gold);
            font-weight: 700;
            text-shadow:
                0 0 10px rgba(255, 216, 95, 0.32),
                0 2px 0 rgba(0, 0, 0, 0.5);
            font-variant-numeric: tabular-nums;
        }

        .end-title {
            margin: 0 0 12px;
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: clamp(26px, 8vw, 42px);
            color: #ffd3d9;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-shadow: 0 0 18px rgba(255, 111, 141, 0.36);
        }

        .score-line {
            margin: 0 0 18px;
            font-size: clamp(20px, 6vw, 30px);
            font-weight: 600;
            color: var(--text-main);
        }

        .status-banner {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 55;
            min-width: 118px;
            padding: 8px 12px;
            border-radius: 16px;
            background: rgba(8, 14, 32, 0.78);
            border: 1px solid rgba(118, 247, 255, 0.22);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            font-family: 'Orbitron', 'Exo 2', sans-serif;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .status-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-gif {
            position: absolute;
            z-index: 54;
            right: max(10px, env(safe-area-inset-right));
            width: clamp(96px, 24vw, 144px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.18);
            background: rgba(11, 18, 42, 0.72);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.28);
            pointer-events: none;
            opacity: 0;
            transform: scale(0.92) translateY(14px);
            transition: opacity 220ms ease, transform 220ms ease;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: scale(1) translateY(0);
        }

        #combo-gif {
            bottom: max(18px, calc(env(safe-area-inset-bottom) + 110px));
        }

        #danger-gif {
            top: 74px;
        }

        .score-value {
            color: var(--accent-gold);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 12px rgba(255, 216, 95, 0.32);
        }

        @media (max-width: 640px) {
            .panel {
                padding: 18px 16px 16px;
                border-radius: 20px;
            }

            .subtitle {
                margin-bottom: 16px;
                letter-spacing: 0.14em;
            }

            .character-chip {
                width: 82px;
                height: 82px;
                margin-bottom: 14px;
            }

            .chip-eye {
                top: 29px;
                width: 10px;
                height: 14px;
            }

            .chip-eye.left { left: 24px; }
            .chip-eye.right { right: 24px; }

            .hud {
                gap: 8px;
                padding: 7px 12px 7px 9px;
            }

            .hud-score {
                font-size: clamp(22px, 8vw, 30px);
            }

            .action-btn {
                min-width: 164px;
                min-height: 46px;
                padding: 11px 20px;
            }
        }
    </style>
</head>

<script>
/**
 * §2 Technical Contract & §4 Iron Laws Implementation
 */

// --- Audio Manager ---
class AudioManager {
    constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.buffers = {};
        this.isUnlocked = false;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.unlockListener = () => {
                this.ctx.resume().then(() => {
                    this.isUnlocked = true;
                    this.playBgm();
                    window.removeEventListener('pointerdown', this.unlockListener);
                    window.removeEventListener('keydown', this.unlockListener);
                });
            };
            window.addEventListener('pointerdown', this.unlockListener);
            window.addEventListener('keydown', this.unlockListener);
        }
    }

    async loadSound(id, elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;
        try {
            const response = await fetch(el.src, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[id] = await this.ctx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.warn('Audio load failed, fallback enabled for', id, e && e.message ? e.message : e);
        }
        if (el) {
            el.addEventListener('error', () => {
                console.warn('Element audio load failed, fallback enabled for', id);
            }, { once: true });
        }
    }

    playBgm() {
        if (!this.ctx || this.muted) return;
        const el = document.getElementById('bgm_main');
        if (el) {
            el.volume = 0.2;
            el.play().catch(() => console.log('BGM autoplay prevented'));
        }
    }

    stopBgm() {
        const el = document.getElementById('bgm_main');
        if (el) {
            el.pause();
            el.currentTime = 0;
        }
    }

    playSfx(id) {
        if (!this.ctx || this.muted || this.ctx.state !== 'running') return;

        if (this.buffers[id]) {
            const source = this.ctx.createBufferSource();
            source.buffer = this.buffers[id];
            source.connect(this.ctx.destination);
            source.start(0);
        } else {
            this.synthesize(id);
        }
    }

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2000, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.5);
        }
    }
}

// --- Game Logic ---
document.addEventListener('DOMContentLoaded', () => {
    // Config Init
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    window.gameConfig = {};
    for (let key in window.gameConfigDefs) {
        window.gameConfig[key] = window.gameConfigDefs[key].value;
    }

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const uiStart = document.getElementById('start-screen');
    const uiGameOver = document.getElementById('game-over-screen');
    const uiHud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('finalScore');
    const btnStart = document.getElementById('start-btn');
    const btnRestart = document.getElementById('restart-btn');
    const statusBanner = document.getElementById('status-banner');
    const comboGif = document.getElementById('combo-gif');
    const dangerGif = document.getElementById('danger-gif');

    const audio = new AudioManager();
    audio.init();
    audio.loadSound('coin', 'sfx_coin');
    audio.loadSound('die', 'sfx_die');
    audio.loadSound('jump', 'sfx_jump');
    audio.loadSound('land', 'sfx_land');
    audio.loadSound('start', 'sfx_start');

    // State
    let gameState = 'START'; // START, PLAY, GAME_OVER
    let lastTime = 0;
    let score = 0;
    let speedMultiplier = 1;
    let distance = 0;

    // Entities
    let hero = {
        x: 100, y: 0, vy: 0, r: 20,
        grounded: false,
        rotation: 0,
        canDoubleJump: false,
        trail: []
    };

    let platforms = [];
    let rings = [];
    let spikes = [];
    let particles = [];
    let bgOffsets = [0, 0];
    let cloudBands = [];
    let lastLandingAt = 0;
    let comboGifTimer = null;
    let dangerGifTimer = null;
    let statusTimer = null;

    function showStatus(message, tone = 'info') {
        if (!statusBanner) return;
        statusBanner.textContent = message;
        statusBanner.style.color = tone === 'warn' ? '#ffd85f' : tone === 'danger' ? '#ff9d57' : '#76f7ff';
        statusBanner.classList.add('visible');
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => statusBanner.classList.remove('visible'), 1400);
    }

    function flashGif(el, duration = 1400) {
        if (!el) return;
        el.classList.add('visible');
        const timerRef = el === comboGif ? 'comboGifTimer' : 'dangerGifTimer';
        clearTimeout(timerRef === 'comboGifTimer' ? comboGifTimer : dangerGifTimer);
        const nextTimer = setTimeout(() => el.classList.remove('visible'), duration);
        if (timerRef === 'comboGifTimer') comboGifTimer = nextTimer;
        else dangerGifTimer = nextTimer;
    }

    function buildCloudBands() {
        cloudBands = [];
        const bands = 9;
        for (let i = 0; i < bands; i++) {
            cloudBands.push({
                x: (i / bands) * W,
                y: H * (0.12 + (i % 4) * 0.08),
                w: 80 + (i % 3) * 42,
                h: 24 + (i % 2) * 10,
                speed: 0.12 + (i % 3) * 0.08,
                alpha: 0.12 + (i % 2) * 0.05
            });
        }
    }

    // Resize
    let W, H, scale;
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        scale = window.devicePixelRatio || 1;
        canvas.width = W * scale;
        canvas.height = H * scale;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        buildCloudBands();

        if (gameState === 'START') {
            platforms = [{ x: 0, y: H - 100, w: W * 2, h: 100 }];
            hero.y = H - 200;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Input
    function handleJump() {
        if (gameState !== 'PLAY') return;

        if (hero.grounded) {
            hero.vy = -window.gameConfig.jumpForce;
            hero.grounded = false;
            hero.canDoubleJump = true;
            createDust(hero.x, hero.y + hero.r);
            audio.playSfx('jump');
            showStatus('Lift off', 'info');
        } else if (hero.canDoubleJump) {
            hero.vy = -window.gameConfig.jumpForce * 0.8;
            hero.canDoubleJump = false;
            createExplosion(hero.x, hero.y, 5, '#ffffff');
            audio.playSfx('jump');
            showStatus('Double boost', 'info');
        }
    }

    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleJump();
    }, { passive: false });

    // Game Functions
    function startGame() {
        gameState = 'PLAY';
        score = 0;
        speedMultiplier = 1;
        distance = 0;
        scoreEl.innerText = '0';

        hero.y = H - 200;
        hero.vy = 0;
        hero.grounded = false;
        hero.rotation = 0;
        hero.trail = [];

        platforms = [];
        rings = [];
        spikes = [];
        particles = [];

        platforms.push({ x: 0, y: H - 100, w: W * 1.5, h: 100 });

        uiStart.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        uiHud.classList.add('visible');
        comboGif.classList.remove('visible');
        dangerGif.classList.remove('visible');
        showStatus('Relay live', 'info');

        audio.playSfx('start');
        audio.playBgm();
    }

    function gameOver() {
        gameState = 'GAME_OVER';
        finalScoreEl.innerText = score;
        uiGameOver.classList.remove('hidden');
        uiHud.classList.remove('visible');

        const shake = 20;
        canvas.style.transform = `translate(${Math.random() * shake - shake / 2}px, ${Math.random() * shake - shake / 2}px)`;
        setTimeout(() => canvas.style.transform = 'none', 200);

        flashGif(dangerGif, 1900);
        showStatus('Run over', 'danger');
        audio.stopBgm();
        audio.playSfx('die');
    }

    function spawnSegment() {
        const lastPlat = platforms[platforms.length - 1];
        const spawnX = lastPlat ? lastPlat.x + lastPlat.w : W;

        if (spawnX < W + 200) {
            const gap = 100 + Math.random() * 100 * speedMultiplier;
            const yVar = (Math.random() - 0.5) * 150;
            let y = lastPlat ? lastPlat.y + yVar : H - 100;

            y = Math.max(H * 0.4, Math.min(H - 50, y));

            const w = 400 + Math.random() * 600;

            platforms.push({ x: spawnX + gap, y: y, w: w, h: 200 });

            if (Math.random() > 0.3) {
                const ringCount = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < ringCount; i++) {
                    rings.push({
                        x: spawnX + gap + 50 + i * 60,
                        y: y - 60 - (Math.sin(i) * 20),
                        r: 15,
                        collected: false
                    });
                }
            }

            if (Math.random() > 0.5 && distance > 1000) {
                spikes.push({
                    x: spawnX + gap + w * 0.5 + (Math.random() * 100),
                    y: y,
                    w: 30,
                    h: 30
                });
            }
        }
    }

    function createDust(x, y) {
        for (let i = 0; i < 5; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4 - 2,
                vy: (Math.random() - 1) * 2,
                life: 1.0,
                color: '#b5fbff',
                type: 'dust'
            });
        }
    }

    function createSparkle(x, y) {
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: '#ffd85f',
                type: 'sparkle'
            });
        }
    }

    function createExplosion(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 1.0,
                color: color,
                type: 'debris'
            });
        }
    }

    function update(dt) {
        if (gameState !== 'PLAY') return;

        speedMultiplier += 0.0005;
        const currentSpeed = window.gameConfig.gameSpeed * speedMultiplier;
        const moveStep = currentSpeed * (dt / 16);

        distance += moveStep;

        const wasGrounded = hero.grounded;
        hero.vy += window.gameConfig.gravity;
        hero.y += hero.vy;

        hero.rotation += (hero.grounded ? 0.3 : 0.1) * speedMultiplier;

        hero.grounded = false;
        const feetX = hero.x;
        const feetY = hero.y + hero.r;

        for (let p of platforms) {
            if (feetX + hero.r * 0.5 > p.x && feetX - hero.r * 0.5 < p.x + p.w) {
                if (feetY >= p.y && feetY <= p.y + p.h + hero.vy + 20 && hero.vy >= 0) {
                    hero.y = p.y - hero.r;
                    hero.vy = 0;
                    hero.grounded = true;
                    hero.canDoubleJump = false;
                }
            }
        }

        if (hero.grounded && !wasGrounded && performance.now() - lastLandingAt > 180) {
            lastLandingAt = performance.now();
            audio.playSfx('land');
        }

        if (hero.y > H + 100) {
            gameOver();
        }

        for (let p of platforms) p.x -= moveStep;
        for (let r of rings) r.x -= moveStep;
        for (let s of spikes) s.x -= moveStep;

        platforms = platforms.filter(p => p.x + p.w > -100);
        rings = rings.filter(r => r.x > -100 && !r.collected);
        spikes = spikes.filter(s => s.x > -100);

        for (let r of rings) {
            const dx = hero.x - r.x;
            const dy = hero.y - r.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < hero.r + r.r) {
                r.collected = true;
                score++;
                scoreEl.innerText = score;
                createSparkle(r.x, r.y);
                if (score % 3 === 0) {
                    flashGif(comboGif, 1500);
                    showStatus('Token streak', 'warn');
                }
                audio.playSfx('coin');
            }
        }

        for (let s of spikes) {
            const dx = hero.x - (s.x);
            const dy = hero.y - (s.y - s.h / 2);
            if (Math.abs(dx) < 20 && Math.abs(dy) < 30) {
                createExplosion(hero.x, hero.y, 20, window.gameConfig.themeColor);
                gameOver();
            }
        }

        spawnSegment();

        for (let p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
        }
        particles = particles.filter(p => p.life > 0);

        if (hero.trail.length > 5) hero.trail.shift();
        hero.trail.push({ x: hero.x, y: hero.y });
    }

    function drawBackground() {
        const speed = window.gameConfig.gameSpeed * speedMultiplier;
        bgOffsets[0] -= speed * 0.08;
        bgOffsets[1] -= speed * 0.34;

        const skyGradient = ctx.createLinearGradient(0, 0, 0, H);
        skyGradient.addColorStop(0, '#4f7dff');
        skyGradient.addColorStop(0.44, '#6bbcff');
        skyGradient.addColorStop(1, '#091022');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, W, H);

        const sunGlow = ctx.createRadialGradient(W * 0.5, H * 0.18, 10, W * 0.5, H * 0.18, H * 0.22);
        sunGlow.addColorStop(0, 'rgba(255,255,255,0.56)');
        sunGlow.addColorStop(0.16, 'rgba(134, 245, 255, 0.34)');
        sunGlow.addColorStop(1, 'rgba(134, 245, 255, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(W * 0.5, H * 0.18, H * 0.22, 0, Math.PI * 2);
        ctx.fill();

        cloudBands.forEach((cloud, index) => {
            const wrappedX = (cloud.x + bgOffsets[0] * cloud.speed) % (W + 180);
            const drawX = wrappedX < -120 ? wrappedX + W + 180 : wrappedX;
            ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
            ctx.beginPath();
            ctx.ellipse(drawX, cloud.y, cloud.w * 0.5, cloud.h, 0, 0, Math.PI * 2);
            ctx.ellipse(drawX - cloud.w * 0.2, cloud.y + 6, cloud.w * 0.22, cloud.h * 0.7, 0, 0, Math.PI * 2);
            ctx.ellipse(drawX + cloud.w * 0.18, cloud.y + 4, cloud.w * 0.28, cloud.h * 0.82, 0, 0, Math.PI * 2);
            ctx.fill();

            if (index % 3 === 0) {
                ctx.strokeStyle = 'rgba(255,255,255,0.07)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(drawX - 60, cloud.y + 24);
                ctx.lineTo(drawX + 60, cloud.y + 24);
                ctx.stroke();
            }
        });

        ctx.fillStyle = '#1b3f7f';
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i <= W / 60 + 2; i++) {
            const x = (i * 60 + bgOffsets[0]) % (W + 120);
            const ridge = H - 180 - Math.sin(i * 0.8) * 34;
            ctx.lineTo(x, ridge);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#10284f';
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i <= W / 40 + 2; i++) {
            const x = (i * 40 + bgOffsets[1]) % (W + 80);
            const ridge = H - 120 - Math.cos(i * 0.9) * 22;
            ctx.lineTo(x, ridge);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const y = (Date.now() / 7 + i * 86) % H;
            const x = (Date.now() * (i + 1) / 11) % W;
            ctx.moveTo(x, y);
            ctx.lineTo(x + 90, y - 8);
        }
        ctx.stroke();
    }

    function drawPlatforms() {
        platforms.forEach(p => {
            const groundGradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            groundGradient.addColorStop(0, '#6ef06a');
            groundGradient.addColorStop(0.12, '#3eae55');
            groundGradient.addColorStop(0.58, '#7d58a6');
            groundGradient.addColorStop(1, '#392649');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(p.x, p.y, p.w, p.h);

            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.fillRect(p.x, p.y, p.w, 8);

            ctx.fillStyle = '#95ff8f';
            ctx.fillRect(p.x, p.y, p.w, 14);

            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i < p.w; i += 48) {
                ctx.beginPath();
                ctx.moveTo(p.x + i, p.y + 18);
                ctx.lineTo(p.x + i + 20, p.y + p.h);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(23, 12, 42, 0.24)';
            for (let cy = p.y + 28; cy < p.y + p.h; cy += 34) {
                ctx.fillRect(p.x, cy, p.w, 10);
            }
        });
    }

    function drawSpikes() {
        spikes.forEach(s => {
            const hazardGradient = ctx.createLinearGradient(s.x, s.y - 42, s.x, s.y);
            hazardGradient.addColorStop(0, '#ffc0d0');
            hazardGradient.addColorStop(0.34, '#ff6987');
            hazardGradient.addColorStop(1, '#921533');

            ctx.fillStyle = hazardGradient;
            ctx.beginPath();
            ctx.moveTo(s.x - 15, s.y);
            ctx.lineTo(s.x, s.y - 40);
            ctx.lineTo(s.x + 15, s.y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(s.x - 3, s.y - 8);
            ctx.lineTo(s.x, s.y - 32);
            ctx.stroke();
        });
    }

    function drawRings() {
        rings.forEach(r => {
            const scaleX = Math.max(0.18, Math.abs(Math.sin(Date.now() / 100)));
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffd85f';
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.r * scaleX, r.r, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.48)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, r.r * scaleX * 0.62, r.r * 0.62, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(r.x - 5, r.y - 5, 2.4, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawHeroTrail() {
        if (gameState !== 'PLAY') return;

        hero.trail.forEach((pos, i) => {
            ctx.globalAlpha = i / 10;
            ctx.fillStyle = window.gameConfig.themeColor;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, hero.r * (i / 5), 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    function drawHero() {
        if (gameState === 'GAME_OVER') return;

        ctx.save();
        ctx.translate(hero.x, hero.y);
        ctx.rotate(hero.rotation);

        const coreGradient = ctx.createRadialGradient(-5, -8, 4, 0, 0, hero.r + 12);
        coreGradient.addColorStop(0, '#ffffff');
        coreGradient.addColorStop(0.18, '#8bfaff');
        coreGradient.addColorStop(0.58, window.gameConfig.themeColor);
        coreGradient.addColorStop(1, '#2846da');

        ctx.shadowBlur = 26;
        ctx.shadowColor = 'rgba(61, 240, 255, 0.5)';
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(0, 0, hero.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#1d3ec4';
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const sx = Math.cos(angle) * hero.r;
            const sy = Math.sin(angle) * hero.r;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx * 1.42, sy * 1.42);
            ctx.lineTo(Math.cos(angle + 0.2) * hero.r, Math.sin(angle + 0.2) * hero.r);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = '#0f1735';
        ctx.beginPath();
        ctx.arc(-6, -2, 2.8, 0, Math.PI * 2);
        ctx.arc(7, -2, 2.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#0f1735';
        ctx.beginPath();
        ctx.arc(0, 5, 8, 0.24, Math.PI - 0.24);
        ctx.stroke();

        if (!hero.grounded) {
            ctx.strokeStyle = 'rgba(255,255,255,0.42)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, hero.r + 6, -0.8, 0.8);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            if (p.type === 'sparkle') {
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            } else if (p.type === 'debris') {
                ctx.fillRect(p.x, p.y, 5, 5);
            } else {
                ctx.fillRect(p.x, p.y, 4, 4);
            }
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    function draw() {
        drawBackground();
        drawPlatforms();
        drawSpikes();
        drawRings();
        drawHeroTrail();
        drawHero();
        drawParticles();
    }

    function loop(now) {
        const dt = now - lastTime;
        lastTime = now;

        try {
            update(Math.min(dt, 50));
            draw();
        } catch (e) {
            console.error(e);
        }

        requestAnimationFrame(loop);
    }

    btnStart.addEventListener('click', () => {
        startGame();
    });

    btnRestart.addEventListener('click', () => {
        startGame();
    });

    requestAnimationFrame(loop);
});
</script>
</body>
