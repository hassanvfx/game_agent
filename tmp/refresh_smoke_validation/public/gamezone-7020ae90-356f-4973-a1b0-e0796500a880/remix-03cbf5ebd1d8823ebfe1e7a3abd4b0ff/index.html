<script>
const CONFIG={upgrades:[{id:'u1',name:'Tiny Coin Charm',cost:15,type:'click',val:1,desc:'+1 tap'},{id:'u2',name:'Soot Sprite Side Hustle',cost:50,type:'auto',val:2,desc:'+2/sec'},{id:'u3',name:'Decora Receipt Wand',cost:150,type:'click',val:5,desc:'+5 tap'},{id:'u4',name:'Tea Cart Passive Income',cost:500,type:'auto',val:10,desc:'+10/sec'},{id:'u5',name:'Labubu Luxury Ledger',cost:2000,type:'click',val:50,desc:'+50 tap'},{id:'u6',name:'Sky Shop Franchise',cost:5000,type:'auto',val:100,desc:'+100/sec'}]};

const phaseCopy=['🌿 calm capitalism','🎀 trend inflation','🧾 tax audit glitterstorm'];
const AudioSys={ctx:null,bgm:{},sfx:{},init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.bgm={0:document.getElementById('bgm_happy'),1:document.getElementById('bgm_mad'),2:document.getElementById('bgm_horror')};this.sfx={tap:document.getElementById('sfx_click'),upgrade:document.getElementById('sfx_upgrade'),fail:document.getElementById('sfx_fail'),phase:document.getElementById('sfx_phase'),scare:document.getElementById('sfx_scare')}},unlock(){if(!this.ctx)this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},playBgm(p){this.unlock();[0,1,2].forEach(k=>{const a=this.bgm[k];if(k!==p&&a&&!a.paused){a.pause();a.currentTime=0}});const t=this.bgm[p];if(t){t.volume=p===2?.18:p===1?.16:.14;t.play().catch(()=>{})}},playSfx(n,fb){this.unlock();const a=this.sfx[n];if(a){a.pause();a.currentTime=0;a.volume=n==='scare'?.55:.38;a.playbackRate=n==='tap'?.96+Math.random()*.09:1;a.play().catch(()=>fb&&fb.call(this))}else if(fb)fb.call(this)},tone(f,d,type='sine',v=.08){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.45,this.ctx.currentTime+d*.75);g.gain.setValueAtTime(v,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d)},playTap(){this.playSfx('tap',function(){this.tone(620,.08,'triangle',.06)})},playUpgrade(){this.playSfx('upgrade',function(){this.tone(440,.18,'sine',.09);setTimeout(()=>this.tone(880,.16,'sine',.07),65)})},playFail(){this.playSfx('fail',function(){this.tone(180,.12,'square',.05)})},playPhaseShift(){this.playSfx('phase',function(){this.tone(300,.24,'triangle',.08)})},playScare(){this.playSfx('scare',function(){this.tone(120,.28,'sawtooth',.2)})}};
function initGame(){try{const defs=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=defs;window.gameConfig={};for(const k in defs)window.gameConfig[k]=defs[k].value}catch(e){window.gameConfig={madnessThreshold:100,horrorThreshold:500,baseClickPower:1}}state.clickPower=window.gameConfig.baseClickPower;CONFIG.upgrades.forEach(u=>{const b=document.createElement('button');b.id=`btn-${u.id}`;b.className='upgrade-btn press';b.innerHTML=`<div class="upgrade-copy"><strong>${u.name}</strong><span>${u.desc}</span></div><div class="upgrade-cost">${u.cost}</div>`;b.addEventListener('click',()=>buyUpgrade(u));upgradesList.appendChild(b)});resize();window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',handleInput,{passive:false});document.getElementById('start-btn').addEventListener('click',startGame);menuBtn.addEventListener('click',toggleUpgradeMenu);updateUI();requestAnimationFrame(loop)}
function toggleUpgradeMenu(){const c=upgradeMenu.classList.toggle('is-collapsed');menuBtn.setAttribute('aria-expanded',String(!c))}function startGame(){state.started=true;AudioSys.init();AudioSys.unlock();AudioSys.playPhaseShift();AudioSys.playBgm(0);document.getElementById('start-screen').classList.add('hidden');state.lastTick=performance.now()}function resize(){const dpr=window.devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function handleInput(e){e.preventDefault();if(!state.started)startGame();if(state.phase===2&&Math.random()<.05)triggerAudit();state.faceScale=1.18;state.faceShake=Math.max(state.faceShake,4);AudioSys.playTap();addScore(state.clickPower);showFeedback(`+${state.clickPower} slay`);const r=canvas.getBoundingClientRect();spawnParticles(e.clientX-r.left,e.clientY-r.top,7)}function addScore(a){state.score+=a;checkPhase();updateUI()}function buyUpgrade(u){if(state.score>=u.cost){state.score-=u.cost;u.cost=Math.floor(u.cost*1.5);if(u.type==='click')state.clickPower+=u.val;if(u.type==='auto')state.autoPower+=u.val;document.getElementById(`btn-${u.id}`).querySelector('.upgrade-cost').innerText=u.cost;updateUI();AudioSys.playUpgrade();showFeedback('receipt slay ✨',760);spawnParticles(innerWidth/2,innerHeight*.55,18)}else{AudioSys.playFail();upgradeMenu.classList.add('shake');setTimeout(()=>upgradeMenu.classList.remove('shake'),430)}}
function checkPhase(){const old=state.phase;if(state.score>=window.gameConfig.horrorThreshold)state.phase=2;else if(state.score>=window.gameConfig.madnessThreshold)state.phase=1;else state.phase=0;if(old!==state.phase){document.body.dataset.phase=state.phase;phaseLabel.textContent=phaseCopy[state.phase];AudioSys.playPhaseShift();AudioSys.playBgm(state.phase);state.faceShake=18;showFeedback(state.phase===1?'viral rent arc 🎀':'audit glitterstorm 🧾',900)}}function updateUI(){scoreEl.textContent=Math.floor(state.score);cpsEl.textContent=`${state.autoPower} / sec idle coins`;tapPowerEl.textContent=`tap power ${state.clickPower}`;phaseLabel.textContent=phaseCopy[state.phase];CONFIG.upgrades.forEach(u=>{const b=document.getElementById(`btn-${u.id}`);if(b)b.disabled=state.score<u.cost})}function showFeedback(text,dur=420){feedbackPop.textContent=text;feedbackPop.classList.add('visible');clearTimeout(showFeedback.t);showFeedback.t=setTimeout(()=>feedbackPop.classList.remove('visible'),dur)}function triggerAudit(){scareOverlay.classList.remove('hidden');AudioSys.playScare();setTimeout(()=>scareOverlay.classList.add('hidden'),240)}
function spawnParticles(x,y,c){const pal=['#ffd75e','#ff6fa9','#97ffd5','#b89cff','#fff8dc'];for(let i=0;i<c;i++)state.particles.push({x,y,vx:(Math.random()-.5)*8,vy:-2-Math.random()*7,life:.75+Math.random()*.35,color:pal[Math.floor(Math.random()*pal.length)],size:3+Math.random()*5})}function loop(now){if(!state.lastTick)state.lastTick=now;const dt=(now-state.lastTick)/1000;state.lastTick=now;if(state.started&&state.autoPower>0){state.score+=state.autoPower*dt;checkPhase();updateUI()}state.faceScale+=(1-state.faceScale)*.12;state.faceShake*=.88;draw(now);requestAnimationFrame(loop)}
function draw(t){const w=canvas.width/(devicePixelRatio||1),h=canvas.height/(devicePixelRatio||1),cx=w/2,cy=h*.43;drawScene(w,h,t);let sx=0,sy=0;if(state.faceShake>.2){sx=(Math.random()-.5)*state.faceShake;sy=(Math.random()-.5)*state.faceShake}ctx.save();ctx.translate(cx+sx,cy+sy);ctx.scale(state.faceScale,state.faceScale);drawMuncher(0,0,Math.min(106,w*.26),state.phase,t);ctx.restore();drawParticles(ctx);drawRing(cx,cy,Math.min(128,w*.31),t)}
function drawScene(w,h,t){const g=ctx.createLinearGradient(0,0,0,h);if(state.phase===0){g.addColorStop(0,'#fff2b8');g.addColorStop(.5,'#ffd8ef');g.addColorStop(1,'#9ee7ff')}else if(state.phase===1){g.addColorStop(0,'#ffe2fb');g.addColorStop(.48,'#ffb0d8');g.addColorStop(1,'#bda7ff')}else{g.addColorStop(0,'#372057');g.addColorStop(.48,'#ff8bd0');g.addColorStop(1,'#6ff6ff')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<18;i++){const x=(i*73+t/(state.phase+2))%(w+120)-60,y=(i*97%h);ctx.globalAlpha=.16+(i%4)*.04;ctx.fillStyle=i%3?'#fff':'#ffd75e';drawStar(ctx,x,y,4+(i%5),4)}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.38)';for(let i=0;i<5;i++){const y=h*.16+i*h*.12+Math.sin(t/800+i)*8;ctx.beginPath();ctx.ellipse((i*120+t/50)%(w+200)-100,y,70,18,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle=state.phase===2?'rgba(57,30,83,.42)':'rgba(255,255,255,.28)';ctx.beginPath();ctx.moveTo(0,h*.78);for(let x=0;x<=w;x+=30)ctx.lineTo(x,h*.78+Math.sin(x*.03+t/500)*14);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='rgba(74,48,62,.18)';for(let x=18;x<w;x+=58){ctx.fillRect(x,h*.76,10,42);ctx.beginPath();ctx.arc(x+5,h*.75,18,0,Math.PI*2);ctx.fill()}}
function drawMuncher(x,y,r,p,t){ctx.save();ctx.shadowBlur=28;ctx.shadowColor=p===0?'#fff':p===1?'#ff5fa9':'#80f7ff';const body=ctx.createLinearGradient(-r,-r,r,r);body.addColorStop(0,p===2?'#231a45':'#fff59b');body.addColorStop(.52,p===1?'#ff7fbd':'#ffb1d2');body.addColorStop(1,p===2?'#7ef7ff':'#a6ffd9');ctx.fillStyle=body;roundBlob(x,y,r);ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=5;ctx.strokeStyle='rgba(63,43,61,.68)';ctx.stroke();ctx.fillStyle='#684050';ctx.beginPath();ctx.moveTo(-r*.54,-r*.62);ctx.quadraticCurveTo(-r*.72,-r*1.13,-r*.23,-r*.9);ctx.moveTo(r*.54,-r*.62);ctx.quadraticCurveTo(r*.72,-r*1.13,r*.23,-r*.9);ctx.fill();ctx.fillStyle='#3f2b3d';const blink=Math.sin(t/650)>0.92?.12:1;ctx.beginPath();ctx.ellipse(-r*.34,-r*.22,r*.095,r*.13*blink,0,0,Math.PI*2);ctx.ellipse(r*.34,-r*.22,r*.095,r*.13*blink,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.86)';ctx.beginPath();ctx.arc(-r*.37,-r*.26,r*.03,0,Math.PI*2);ctx.arc(r*.31,-r*.26,r*.03,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3f2b3d';ctx.lineWidth=5;ctx.beginPath();if(p===0)ctx.arc(0,r*.05,r*.42,.17*Math.PI,.83*Math.PI);else if(p===1){ctx.moveTo(-r*.36,r*.24);for(let i=0;i<5;i++)ctx.lineTo(-r*.36+i*r*.18,r*.24+(i%2?-8:8))}else ctx.ellipse(0,r*.27,r*.22,r*.3,0,0,Math.PI*2);ctx.stroke();ctx.font=`${r*.34}px serif`;ctx.fillText('💸',-r*.24,r*.72);ctx.font=`${r*.22}px serif`;ctx.fillText('✨',r*.42,-r*.48);ctx.restore()}function roundBlob(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r*.86);ctx.bezierCurveTo(x+r*.7,y-r*.9,x+r*.98,y-r*.42,x+r*.9,y+r*.08);ctx.bezierCurveTo(x+r*.82,y+r*.82,x+r*.32,y+r*.98,x,y+r*.92);ctx.bezierCurveTo(x-r*.42,y+r*1.02,x-r*.92,y+r*.72,x-r*.9,y+r*.03);ctx.bezierCurveTo(x-r*1,-r*.48,x-r*.62,y-r*.9,x,y-r*.86)}
function drawStar(c,x,y,r,pts){c.save();c.translate(x,y);c.rotate((x+y)/60);c.beginPath();for(let i=0;i<pts*2;i++){const rr=i%2?r:r*.42,ang=i*Math.PI/pts;c.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}c.closePath();c.fill();c.restore()}function drawRing(x,y,r,t){ctx.save();ctx.globalAlpha=.42;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.lineDashOffset=-t/70;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore()}function drawParticles(c){for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=.026;if(p.life<=0)state.particles.splice(i,1);else{c.save();c.globalAlpha=p.life;c.fillStyle=p.color;c.translate(p.x,p.y);drawStar(c,0,0,p.size,4);c.restore()}}}
window.addEventListener('DOMContentLoaded',initGame);window.updateGameConfig=(key,val)=>{if(window.gameConfig)window.gameConfig[key]=val;state.clickPower=window.gameConfig.baseClickPower||1;checkPhase();updateUI()};
