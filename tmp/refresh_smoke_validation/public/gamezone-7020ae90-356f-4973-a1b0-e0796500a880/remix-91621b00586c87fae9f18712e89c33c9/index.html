<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smile Spiral</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='0.9em' font-size='52'%3E%F0%9F%98%8A%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- [agent-note][stage4] resolved-font: title -> Creepster, ui/body -> Rajdhani, counters -> VT323 from catalogs/fonts.json -->
    <style>
        :root {
            --bg-deep: #080a16;
            --bg-panel: rgba(13, 18, 40, 0.76);
            --bg-panel-strong: rgba(16, 22, 50, 0.92);
            --line-soft: rgba(170, 224, 255, 0.24);
            --text-main: #f5fbff;
            --text-dim: #9fb4d1;
            --phase0-main: #ffd84d;
            --phase0-accent: #7ef9ff;
            --phase1-main: #ff7b54;
            --phase1-accent: #ff3d81;
            --phase2-main: #ff5c8a;
            --phase2-accent: #8c6bff;
            --button-text: #07111f;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.34);
            --safe-top: max(16px, env(safe-area-inset-top));
            --safe-right: max(16px, env(safe-area-inset-right));
            --safe-bottom: max(16px, env(safe-area-inset-bottom));
            --safe-left: max(16px, env(safe-area-inset-left));
            --ui-font: 'Rajdhani', system-ui, sans-serif;
            --display-font: 'Creepster', 'Rajdhani', sans-serif;
            --mono-font: 'VT323', 'Rajdhani', ui-monospace, monospace;
            --phase-main: var(--phase0-main);
            --phase-accent: var(--phase0-accent);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(126, 249, 255, 0.12), transparent 38%),
                linear-gradient(180deg, #08101d 0%, #05070f 100%);
            color: var(--text-main);
        }

        body {
            font-family: var(--ui-font);
            letter-spacing: 0.02em;
        }

        body[data-phase="0"] {
            --phase-main: var(--phase0-main);
            --phase-accent: var(--phase0-accent);
        }

        body[data-phase="1"] {
            --phase-main: var(--phase1-main);
            --phase-accent: var(--phase1-accent);
        }

        body[data-phase="2"] {
            --phase-main: var(--phase2-main);
            --phase-accent: var(--phase2-accent);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .hidden { display: none !important; }

        .glass {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
                var(--bg-panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line-soft);
            box-shadow: var(--shadow-soft);
        }

        .btn-press {
            transition: transform 0.08s ease, filter 0.16s ease, box-shadow 0.16s ease;
        }

        .btn-press:active {
            transform: scale(0.95);
            filter: brightness(1.08);
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 216, 77, 0.15), transparent 20%),
                linear-gradient(180deg, rgba(17, 25, 54, 0.7), rgba(3, 5, 10, 0.88));
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%);
            background-size: 28px 28px;
            opacity: 0.2;
            mix-blend-mode: screen;
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-card {
            min-width: 0;
            max-width: min(220px, 58vw);
            padding: 12px 14px;
            border-radius: 18px;
        }

        .hud-label {
            font-size: 11px;
            line-height: 1.2;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-bottom: 6px;
        }

        #score-display {
            font-family: var(--display-font);
            font-size: clamp(28px, 6vw, 42px);
            line-height: 0.95;
            color: var(--phase-main);
            text-shadow: 0 0 18px color-mix(in srgb, var(--phase-main) 45%, transparent);
        }

        #cps-display {
            margin-top: 4px;
            font-size: 13px;
            color: #bfd0e8;
        }

        .menu-button {
            width: 48px;
            height: 48px;
            border-radius: 999px;
            border: 1px solid var(--line-soft);
            color: var(--text-main);
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow-soft);
        }

        #upgrade-menu.is-collapsed {
            opacity: 0;
            transform: translateY(calc(100% + 18px));
            pointer-events: none;
        }

        /* [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe */
        #upgrade-menu {
            pointer-events: auto;
            border-radius: 24px 24px 0 0;
            padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
            max-height: min(50%, 360px);
            overflow-y: auto;
            transition: opacity 0.3s, transform 0.3s;
            background:
                linear-gradient(180deg, rgba(22, 30, 60, 0.96), rgba(8, 11, 24, 0.98)),
                var(--bg-panel-strong);
        }

        .sheet-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.14);
            font-family: var(--display-font);
            font-size: clamp(24px, 5vw, 30px);
            letter-spacing: 0.04em;
            color: var(--phase-main);
        }

        .sheet-title::before {
            content: "✦";
            color: var(--phase-accent);
            text-shadow: 0 0 12px color-mix(in srgb, var(--phase-accent) 55%, transparent);
        }

        #upgrades-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            text-align: left;
            color: var(--text-main);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
                rgba(10, 14, 31, 0.84);
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
        }

        .upgrade-btn:not(:disabled):active {
            transform: scale(0.985);
        }

        .upgrade-btn:not(:disabled):hover {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03)),
                rgba(14, 19, 42, 0.92);
            border-color: color-mix(in srgb, var(--phase-accent) 35%, rgba(255,255,255,0.14));
        }

        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-copy strong {
            display: block;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .upgrade-copy span {
            font-size: 12px;
            color: var(--text-dim);
        }

        .upgrade-cost {
            font-family: var(--mono-font);
            font-size: 24px;
            line-height: 1;
            color: var(--phase-main);
            text-shadow: 0 0 14px color-mix(in srgb, var(--phase-main) 40%, transparent);
            white-space: nowrap;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 28px 20px;
            background:
                radial-gradient(circle at center, rgba(255, 216, 77, 0.16), transparent 22%),
                rgba(0, 0, 0, 0.84);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            text-align: center;
        }

        .title-wrap {
            position: relative;
            padding: 18px 20px 16px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            background: linear-gradient(180deg, rgba(17, 26, 52, 0.88), rgba(8, 12, 24, 0.88));
            box-shadow: 0 20px 60px rgba(0,0,0,0.42);
        }

        .title-wrap::before,
        .title-wrap::after {
            content: "😊";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(28px, 8vw, 40px);
            filter: drop-shadow(0 0 10px rgba(255, 216, 77, 0.4));
        }

        .title-wrap::before { left: -10px; }
        .title-wrap::after { right: -10px; }

        #start-screen h1 {
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(40px, 12vw, 74px);
            line-height: 0.92;
            letter-spacing: 0.06em;
            color: var(--phase-main);
            text-shadow:
                0 0 16px rgba(255, 216, 77, 0.45),
                0 4px 0 rgba(0,0,0,0.35);
        }

        .tagline {
            margin: 0;
            max-width: 280px;
            color: #cad7ea;
            font-size: 15px;
            line-height: 1.35;
        }

        #start-btn {
            border: 0;
            border-radius: 999px;
            padding: 15px 26px;
            min-height: 52px;
            background: linear-gradient(180deg, var(--phase-main), color-mix(in srgb, var(--phase-main) 78%, #ff9a3d));
            color: var(--button-text);
            font-family: var(--ui-font);
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow:
                0 12px 30px color-mix(in srgb, var(--phase-main) 35%, transparent),
                inset 0 -4px 0 rgba(0,0,0,0.15);
        }

        #feedback-gif,
        #scare-overlay {
            position: absolute;
            pointer-events: none;
        }

        #feedback-gif {
            right: clamp(10px, 4vw, 24px);
            bottom: calc(118px + env(safe-area-inset-bottom));
            z-index: 82;
            width: min(26vw, 120px);
            aspect-ratio: 1;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(8, 11, 24, 0.72);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        #feedback-gif.visible {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        #feedback-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.05) contrast(1.05);
        }

        /* [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls */
        #scare-overlay {
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #scare-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.56;
            mix-blend-mode: screen;
        }

        @media (max-width: 480px) {
            .hud-card {
                padding: 10px 12px;
                max-width: min(190px, 62vw);
            }

            .hud-label {
                font-size: 10px;
            }

            #cps-display {
                font-size: 12px;
            }

            .sheet-title {
                font-size: 24px;
            }

            .upgrade-copy strong {
                font-size: 13px;
            }

            .upgrade-copy span {
                font-size: 11px;
            }
        }
    </style>
</head>

<script>
/**
 * § Core Architecture
 */
const CONFIG = {
    upgrades: [
        { id: 'u1', name: 'Camera Smile', cost: 15, type: 'click', val: 1, desc: '+1 tap' },
        { id: 'u2', name: 'Crowd Chant', cost: 50, type: 'auto', val: 2, desc: '+2/sec' },
        { id: 'u3', name: 'Stage Lights', cost: 150, type: 'click', val: 5, desc: '+5 tap' },
        { id: 'u4', name: 'Looped Applause', cost: 500, type: 'auto', val: 10, desc: '+10/sec' },
        { id: 'u5', name: 'Broadcast Glare', cost: 2000, type: 'click', val: 50, desc: '+50 tap' },
        { id: 'u6', name: 'Final Encore', cost: 5000, type: 'auto', val: 100, desc: '+100/sec' }
    ]
};

// Global State
let gameConfig = {};
let state = {
    score: 0,
    clickPower: 1,
    autoPower: 0,
    phase: 0, // 0: perform, 1: crack, 2: spiral
    lastTick: 0,
    faceScale: 1,
    faceShake: 0,
    bgOffset: 0,
    particles: [],
    upgradesBought: {}
};

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const scoreEl = document.getElementById('score-display');
const cpsEl = document.getElementById('cps-display');
const upgradesList = document.getElementById('upgrades-list');
const scareOverlay = document.getElementById('scare-overlay');
const feedbackGif = document.getElementById('feedback-gif');
const feedbackGifImg = document.getElementById('feedback-gif-img');
const upgradeMenu = document.getElementById('upgrade-menu');
const menuBtn = document.getElementById('menu-btn');

/**
 * § Audio System
 */
const AudioSys = {
    ctx: null,
    bgm: { 0: null, 1: null, 2: null },
    sfx: {},
    currentBgm: null,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        this.bgm[0] = document.getElementById('bgm_happy');
        this.bgm[1] = document.getElementById('bgm_mad');
        this.bgm[2] = document.getElementById('bgm_horror');
        this.sfx = {
            tap: document.getElementById('sfx_click'),
            upgrade: document.getElementById('sfx_upgrade'),
            fail: document.getElementById('sfx_fail'),
            phase: document.getElementById('sfx_phase'),
            scare: document.getElementById('sfx_scare')
        };
    },

    unlock() {
        if (!this.ctx) this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
        }
    },

    playBgm(phase) {
        this.unlock();
        [0, 1, 2].forEach(p => {
            if (p !== phase && this.bgm[p] && !this.bgm[p].paused) {
                this.bgm[p].pause();
                this.bgm[p].currentTime = 0;
            }
        });

        const target = this.bgm[phase];
        if (target && target !== this.currentBgm) {
            this.currentBgm = target;
            target.volume = phase === 2 ? 0.2 : (phase === 1 ? 0.18 : 0.16);
            target.currentTime = 0;
            target.play().catch(() => {});
        } else if (target && target.paused) {
            target.play().catch(() => {});
        }
    },

    playSfx(name, fallback) {
        this.unlock();
        const el = this.sfx[name];
        if (el) {
            el.pause();
            el.currentTime = 0;
            el.volume = name === 'scare' ? 0.85 : 0.45;
            el.playbackRate = name === 'tap' ? 0.96 + (Math.random() * 0.08) : 1;
            el.play().catch(() => fallback && fallback.call(this));
        } else if (fallback) {
            fallback.call(this);
        }
    },

    playTap() {
        this.playSfx('tap', this.synthClick);
    },

    playUpgrade() {
        this.playSfx('upgrade', this.synthUpgrade);
    },

    playFail() {
        this.playSfx('fail', this.synthFail);
    },

    playPhaseShift() {
        this.playSfx('phase', this.synthPhase);
    },

    playScare() {
        this.playSfx('scare', this.synthScare);
    },

    synthClick() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(680, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1180, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
    },

    synthUpgrade() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(980, this.ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
    },

    synthFail() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(140, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.07, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
    },

    synthPhase() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(640, this.ctx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.28);
    },

    synthScare() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(110, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(860, this.ctx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.32, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.46);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.46);
    }
};

/**
 * § Game Logic
 */
function initGame() {
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const defs = JSON.parse(configEl.textContent);
            window.gameConfigDefs = defs;
            window.gameConfig = {};
            for (let k in defs) window.gameConfig[k] = defs[k].value;
        } catch (e) {
            console.error('Config Error', e);
            window.gameConfig = { madnessThreshold: 100, horrorThreshold: 500, baseClickPower: 1 };
        }
    }

    state.clickPower = window.gameConfig.baseClickPower;

    CONFIG.upgrades.forEach(u => {
        const btn = document.createElement('button');
        btn.className = 'upgrade-btn';
        btn.id = `btn-${u.id}`;
        btn.innerHTML = `
            <div class="upgrade-copy">
                <strong>${u.name}</strong>
                <span>${u.desc}</span>
            </div>
            <div class="upgrade-cost">${u.cost}</div>
        `;
        btn.onclick = () => buyUpgrade(u);
        upgradesList.appendChild(btn);
    });

    resize();
    window.addEventListener('resize', resize);

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    document.getElementById('start-btn').addEventListener('click', startGame);
    menuBtn.addEventListener('click', toggleUpgradeMenu);

    requestAnimationFrame(loop);
}

function toggleUpgradeMenu() {
    const collapsed = upgradeMenu.classList.toggle('is-collapsed');
    menuBtn.setAttribute('aria-expanded', String(!collapsed));
}

function startGame() {
    AudioSys.init();
    AudioSys.unlock();
    AudioSys.playPhaseShift();
    AudioSys.playBgm(0);
    document.getElementById('start-screen').classList.add('hidden');
    state.lastTick = performance.now();
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function handleInput(e) {
    e.preventDefault();
    if (state.phase === 2 && Math.random() < 0.05) triggerJumpscare();

    state.faceScale = 1.2;
    AudioSys.playTap();

    addScore(state.clickPower);
    if (state.clickPower >= 5 || Math.random() < 0.18) {
        showFeedbackGif('https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp', 380);
    }

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnParticles(x, y, 5);
}

function addScore(amount) {
    state.score += amount;
    checkPhase();
    updateUI();
}

function buyUpgrade(u) {
    if (state.score >= u.cost) {
        state.score -= u.cost;
        u.cost = Math.floor(u.cost * 1.5);

        if (u.type === 'click') state.clickPower += u.val;
        if (u.type === 'auto') state.autoPower += u.val;

        const btn = document.getElementById(`btn-${u.id}`);
        btn.querySelector('.upgrade-cost').innerText = u.cost;

        updateUI();
        AudioSys.playUpgrade();
        showFeedbackGif('https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp', 700);
    } else {
        AudioSys.playFail();
    }
}

function checkPhase() {
    const oldPhase = state.phase;
    if (state.score >= window.gameConfig.horrorThreshold) {
        state.phase = 2;
    } else if (state.score >= window.gameConfig.madnessThreshold) {
        state.phase = 1;
    } else {
        state.phase = 0;
    }

    if (state.phase !== oldPhase) {
        document.body.setAttribute('data-phase', state.phase);
        AudioSys.playPhaseShift();
        AudioSys.playBgm(state.phase);
        state.faceShake = 20;
        if (state.phase === 1) {
            showFeedbackGif('https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp', 900);
        } else if (state.phase === 2) {
            showFeedbackGif('https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp', 900);
        }
    }
}

function updateUI() {
    scoreEl.innerText = Math.floor(state.score);
    cpsEl.innerText = `${state.autoPower} / sec`;

    CONFIG.upgrades.forEach(u => {
        const btn = document.getElementById(`btn-${u.id}`);
        if (btn) btn.disabled = state.score < u.cost;
    });
}

function showFeedbackGif(src, duration = 600) {
    if (!feedbackGif || !feedbackGifImg) return;
    feedbackGifImg.src = src;
    feedbackGif.classList.remove('hidden');
    requestAnimationFrame(() => feedbackGif.classList.add('visible'));
    clearTimeout(showFeedbackGif.hideTimer);
    showFeedbackGif.hideTimer = setTimeout(() => {
        feedbackGif.classList.remove('visible');
        setTimeout(() => feedbackGif.classList.add('hidden'), 220);
    }, duration);
}

function triggerJumpscare() {
    scareOverlay.classList.remove('hidden');
    AudioSys.playScare();
    showFeedbackGif('https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp', 500);
    setTimeout(() => {
        scareOverlay.classList.add('hidden');
    }, 240);
}

/**
 * § Render & Loop
 */
function spawnParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: state.phase === 0 ? '#FFD700' : (state.phase === 1 ? '#FF4500' : '#FFF')
        });
    }
}

function loop(now) {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;

    if (state.autoPower > 0) {
        addScore(state.autoPower * dt);
    }

    state.faceScale += (1 - state.faceScale) * 10 * dt;
    state.faceShake *= 0.9;
    state.bgOffset += dt * (state.phase === 0 ? 20 : 100);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const cx = w / 2;
    const cy = h / 2 - 50;

    drawBackground(ctx, w, h, now);

    let shakeX = 0, shakeY = 0;
    if (state.phase > 0 || state.faceShake > 0.1) {
        const intensity = (state.phase * 2) + state.faceShake;
        shakeX = (Math.random() - 0.5) * intensity;
        shakeY = (Math.random() - 0.5) * intensity;
    }

    ctx.save();
    ctx.translate(cx + shakeX, cy + shakeY);
    ctx.scale(state.faceScale, state.faceScale);
    drawFace(ctx, 0, 0, 100, state.phase, now);
    ctx.restore();

    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) {
            state.particles.splice(i, 1);
        } else {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;

    if (state.phase === 2 && Math.random() < 0.1) {
        ctx.fillStyle = `rgba(${Math.random() * 255},0,0,0.1)`;
        ctx.fillRect(0, 0, w, h);
    }

    requestAnimationFrame(loop);
}

function drawBackground(ctx, w, h, time) {
    if (state.phase === 0) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#65c9ff');
        grad.addColorStop(0.55, '#213d7f');
        grad.addColorStop(1, '#070d1d');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        const spotlight = ctx.createRadialGradient(w * 0.5, h * 0.22, 10, w * 0.5, h * 0.22, w * 0.55);
        spotlight.addColorStop(0, 'rgba(255, 232, 134, 0.34)');
        spotlight.addColorStop(1, 'rgba(255, 232, 134, 0)');
        ctx.fillStyle = spotlight;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(126, 249, 255, 0.16)';
        for (let i = 0; i < 7; i++) {
            const bandY = (i * h / 6 + (time / 40)) % (h + 40) - 20;
            ctx.fillRect(0, bandY, w, 3);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        const offset = (time / 50) % (w + 100) - 50;
        ctx.beginPath();
        ctx.arc(offset, 100, 40, 0, Math.PI * 2);
        ctx.arc(offset + 50, 110, 50, 0, Math.PI * 2);
        ctx.arc(offset - 40, 110, 30, 0, Math.PI * 2);
        ctx.fill();
    } else if (state.phase === 1) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#31081a');
        grad.addColorStop(0.45, '#7f122d');
        grad.addColorStop(1, '#1a070f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(255, 61, 129, 0.18)';
        for (let i = 0; i < 12; i++) {
            const stripeX = (i * 60 + (time / 8)) % (w + 120) - 120;
            ctx.fillRect(stripeX, 0, 18, h);
        }

        ctx.fillStyle = '#12020a';
        ctx.beginPath();
        for (let i = 0; i < w; i += 20) {
            ctx.lineTo(i, h);
            ctx.lineTo(i + 10, h - 50 + Math.random() * 20);
        }
        ctx.lineTo(w, h);
        ctx.fill();
    } else {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#03030a');
        grad.addColorStop(1, '#120716');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(140, 107, 255, 0.12)';
        ctx.fillRect(0, h * 0.12, w, 10);

        for (let i = 0; i < 50; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#ff4d73';
            ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 50, 2);
        }
    }
}

function drawFace(ctx, x, y, r, phase, time) {
    const pulse = 1 + Math.sin(time / 220) * 0.03;

    ctx.save();
    ctx.scale(pulse, pulse);

    const faceFill = phase === 0 ? '#ffd84d' : (phase === 1 ? '#ff8b5c' : '#181127');
    const faceGlow = phase === 0 ? '#7ef9ff' : (phase === 1 ? '#ff3d81' : '#ff5c8a');

    ctx.shadowBlur = phase === 2 ? 28 : 20;
    ctx.shadowColor = faceGlow;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = faceFill;
    ctx.fill();

    const ring = ctx.createRadialGradient(x - r * 0.2, y - r * 0.3, r * 0.15, x, y, r);
    ring.addColorStop(0, 'rgba(255,255,255,0.26)');
    ring.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = ring;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.lineWidth = 5;
    ctx.strokeStyle = phase === 2 ? '#ff4d73' : '#0f1325';
    ctx.stroke();

    const eyeOffset = r * 0.35;
    const eyeSize = r * 0.15;

    if (phase === 0) {
        ctx.fillStyle = '#08111f';
        ctx.beginPath();
        ctx.arc(x - eyeOffset, y - eyeOffset, eyeSize, 0, Math.PI * 2);
        ctx.arc(x + eyeOffset, y - eyeOffset, eyeSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(x - eyeOffset - 4, y - eyeOffset - 4, eyeSize * 0.28, 0, Math.PI * 2);
        ctx.arc(x + eyeOffset - 4, y - eyeOffset - 4, eyeSize * 0.28, 0, Math.PI * 2);
        ctx.fill();
    } else if (phase === 1) {
        ctx.strokeStyle = '#2b0712';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x - eyeOffset - 15, y - eyeOffset - 12);
        ctx.lineTo(x - eyeOffset + 17, y - eyeOffset + 8);
        ctx.moveTo(x + eyeOffset + 15, y - eyeOffset - 12);
        ctx.lineTo(x + eyeOffset - 17, y - eyeOffset + 8);
        ctx.stroke();

        ctx.fillStyle = '#15040c';
        ctx.beginPath();
        ctx.arc(x - eyeOffset, y - eyeOffset + 5, eyeSize / 1.5, 0, Math.PI * 2);
        ctx.arc(x + eyeOffset, y - eyeOffset + 5, eyeSize / 1.5, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillStyle = '#050208';
        ctx.beginPath();
        ctx.arc(x - eyeOffset, y - eyeOffset, eyeSize * 1.5, 0, Math.PI * 2);
        ctx.arc(x + eyeOffset, y - eyeOffset, eyeSize * 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ff4d73';
        ctx.beginPath();
        ctx.arc(x - eyeOffset + Math.sin(time / 100) * 5, y - eyeOffset, 3, 0, Math.PI * 2);
        ctx.arc(x + eyeOffset + Math.sin(time / 100) * 5, y - eyeOffset, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.beginPath();
    ctx.lineWidth = 5;
    ctx.strokeStyle = phase === 2 ? '#ff86a4' : '#0f1325';

    if (phase === 0) {
        ctx.arc(x, y + 2, r * 0.6, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
    } else if (phase === 1) {
        const mw = r * 0.6;
        const my = y + r * 0.4;
        ctx.moveTo(x - mw, my);
        for (let i = 1; i <= 5; i++) {
            ctx.lineTo(x - mw + (mw * 2 / 5) * i, my + (i % 2 === 0 ? 10 : -10));
        }
        ctx.stroke();
    } else {
        ctx.fillStyle = '#050208';
        ctx.moveTo(x - 30, y + 20);
        ctx.quadraticCurveTo(x, y + 80 + Math.random() * 10, x + 30, y + 20);
        ctx.quadraticCurveTo(x, y + 10, x - 30, y + 20);
        ctx.fill();
        ctx.stroke();
    }

    if (phase === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(x - 30, y - 40, 14, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

window.addEventListener('DOMContentLoaded', initGame);

window.updateGameConfig = (key, val) => {
    if (window.gameConfig) window.gameConfig[key] = val;
    state.clickPower = window.gameConfig.baseClickPower || 1;
    checkPhase();
};
</script>
