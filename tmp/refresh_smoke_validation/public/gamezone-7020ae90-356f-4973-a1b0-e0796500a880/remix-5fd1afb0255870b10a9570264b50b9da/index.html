<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coven Cozy Clicker</title>
<meta name="description" content="A pastel witchy clicker idle tap game about stirring cozy bedtime vibes in a main character cauldron.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='0.9em' font-size='52'%3E%F0%9F%AB%A7%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff7ec;--ink:#47233f;--berry:#c6428a;--pink:#ff9bd2;--rose:#ffd1e8;--lav:#bca7ff;--mint:#a6f3d1;--moon:#fff1a8;--panel:rgba(255,247,252,.76);--safe-t:max(14px,env(safe-area-inset-top));--safe-b:max(14px,env(safe-area-inset-bottom));--safe-l:max(14px,env(safe-area-inset-left));--safe-r:max(14px,env(safe-area-inset-right));--display:'Creepster','Rajdhani',cursive;--ui:'Rajdhani',system-ui,sans-serif;--mono:'VT323',monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21132e;color:var(--ink);font-family:var(--ui);touch-action:manipulation}button{font:inherit}canvas{display:block;touch-action:none}.hidden{display:none!important}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 8%,#fff6c9 0 9%,transparent 24%),linear-gradient(180deg,#f7bfdf 0%,#d7bdff 42%,#645082 100%)}
#game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.38) 0 2px,transparent 3px),radial-gradient(circle at 82% 28%,rgba(255,255,255,.34) 0 1px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:88px 92px,124px 112px,34px 34px;animation:drift 18s linear infinite;pointer-events:none}@keyframes drift{to{background-position:120px -160px,-80px 140px,34px 34px}}
#ui{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);pointer-events:none}.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.card,.sheet{pointer-events:auto;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,224,244,.72));border:2px solid rgba(255,255,255,.68);box-shadow:0 12px 35px rgba(74,35,86,.22),inset 0 0 0 1px rgba(198,66,138,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px}.card{padding:10px 13px;max-width:min(230px,64vw)}.label{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:#7e4b73;font-weight:600}.score{font-family:var(--display);font-size:clamp(34px,9vw,54px);line-height:.9;color:var(--berry);text-shadow:0 3px 0 #fff,0 0 18px rgba(255,155,210,.7)}.income{font-size:13px;font-weight:600;color:#6b4270}.menu{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:linear-gradient(#fff7fb,#ffc3e5);box-shadow:0 8px 22px rgba(74,35,86,.22);font-size:24px}.sheet{padding:13px 13px calc(13px + env(safe-area-inset-bottom));max-height:min(49vh,365px);overflow:auto;transition:.25s transform,.25s opacity}.sheet.closed{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}.sheet h2{margin:0 0 10px;font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--berry);text-shadow:0 2px #fff}.upgrades{display:flex;flex-direction:column;gap:9px}.upgrade{width:100%;min-height:58px;border:1px solid rgba(198,66,138,.25);border-radius:18px;background:linear-gradient(135deg,#fffafc,#ffd8ed);display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;color:var(--ink);padding:10px 12px;box-shadow:0 6px 14px rgba(111,63,112,.12)}.upgrade:disabled{opacity:.48}.upgrade:active,.menu:active,#startBtn:active{transform:scale(.96)}.upgrade strong{display:block;font-size:15px}.upgrade span{font-size:12px;color:#78516d}.cost{font-family:var(--mono);font-size:25px;color:#a92978;white-space:nowrap}
#start{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:radial-gradient(circle at 50% 26%,rgba(255,242,175,.9),rgba(255,198,231,.86) 34%,rgba(72,41,89,.74));backdrop-filter:blur(8px);pointer-events:auto}.titleBox{position:relative;background:linear-gradient(180deg,#fff9fd,#ffd6ee);border:2px solid #fff;border-radius:34px;padding:18px 18px 16px;box-shadow:0 20px 70px rgba(72,41,89,.34)}h1{margin:0;font-family:var(--display);font-size:clamp(48px,14vw,82px);line-height:.82;color:#bb2d85;text-shadow:0 4px #fff,0 0 18px rgba(255,255,255,.8)}.tag{max-width:330px;margin:14px 0 18px;color:#583151;font-size:17px;line-height:1.3;font-weight:600}#startBtn{border:0;border-radius:999px;min-height:56px;padding:16px 28px;background:linear-gradient(180deg,#fff1a8,#ff93cf);color:#50203f;font-weight:700;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 14px 30px rgba(164,47,125,.28),inset 0 -4px rgba(87,34,75,.12)}.hint{margin-top:10px;font-size:12px;color:#6a4062}.toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-8px);z-index:18;opacity:0;background:#fff8fc;border:2px solid #fff;border-radius:999px;padding:9px 14px;color:#a92978;font-weight:700;box-shadow:0 8px 26px rgba(77,36,81,.24);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}#gif{position:absolute;right:12px;bottom:calc(118px + env(safe-area-inset-bottom));z-index:19;width:min(27vw,112px);aspect-ratio:1;border-radius:22px;overflow:hidden;border:2px solid #fff;background:#fff;opacity:0;transform:translateY(12px) scale(.94);transition:.22s;pointer-events:none;box-shadow:0 10px 25px rgba(63,32,74,.24)}#gif.show{opacity:.96;transform:none}#gif img{width:100%;height:100%;object-fit:cover}.flash{position:absolute;inset:0;z-index:21;display:grid;place-items:center;background:rgba(68,24,74,.54);color:#fff;font-family:var(--display);font-size:clamp(46px,13vw,82px);text-shadow:0 4px #9e2a74;pointer-events:none}.phase1{--berry:#c6428a}.phase2{--berry:#8334c7}.phase3{--berry:#5b247a}@media(max-width:420px){.sheet h2{font-size:26px}.upgrade strong{font-size:14px}.upgrade span{font-size:11px}.card{padding:9px 11px}.menu{width:48px;height:48px}}
</style>
</head>
<body class="phase1">
<script id="game-config" type="application/x-game-config">{
  "madnessThreshold":{"type":"number","label":"Moon Drama Threshold","value":100,"min":50,"max":500},
  "horrorThreshold":{"type":"number","label":"Midnight Main Character Threshold","value":500,"min":200,"max":1000},
  "baseClickPower":{"type":"number","label":"Base Stir Power","value":1,"min":1,"max":10}
}</script>
<!-- Synthesized WebAudio SFX are used because approved catalog audio URLs were unavailable at validation time. -->
<div id="game">
  <canvas id="c" aria-label="Tap the main character cauldron to earn vibes"></canvas>
  <div id="ui">
    <div class="top">
      <div class="card"><div class="label">Bedtime Vibes</div><div id="score" class="score">0</div><div id="income" class="income">0 / sec idle cozy</div></div>
      <button id="menu" class="menu" aria-label="Toggle coven upgrades" aria-controls="sheet" aria-expanded="true">🕯️</button>
    </div>
    <div id="sheet" class="sheet"><h2>Cozy Coven Cart</h2><div id="upgrades" class="upgrades"></div></div>
  </div>
  <div id="toast" class="toast">+1 vibe</div>
  <div id="gif"><img id="gifImg" alt=""></div>
  <div id="start"><div class="titleBox"><h1>Coven Cozy Clicker</h1></div><p class="tag">Tap the moon-pink cauldron, farm idle vibes, and become the sleepy cottagecore main character before bed.</p><button id="startBtn">Start Tap Game</button><div class="hint">One thumb. Big target. Cozy chaos only.</div></div>
</div>
<script>
const CONFIG={upgrades:[
{id:'u1',name:'Glitter Stir Spoon',cost:15,type:'click',val:1,desc:'+1 vibe per tap'},
{id:'u2',name:'Frog Familiar ASMR',cost:50,type:'auto',val:2,desc:'+2 vibes/sec'},
{id:'u3',name:'Barbiecore Candle Circle',cost:150,type:'click',val:5,desc:'+5 tap sparkle'},
{id:'u4',name:'Lo-fi Moon Broom',cost:500,type:'auto',val:10,desc:'+10 sleepy idle/sec'},
{id:'u5',name:'Main Character Hat Tilt',cost:2000,type:'click',val:50,desc:'+50 tap drama'},
{id:'u6',name:'Cottagecore Coven Group Chat',cost:5000,type:'auto',val:100,desc:'+100 vibes/sec'}]};
const state={score:0,clickPower:1,autoPower:0,phase:0,lastTick:0,pulse:1,shake:0,bg:0,particles:[],bought:{},started:false};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.getElementById('score'),incomeEl=document.getElementById('income'),upgradesEl=document.getElementById('upgrades'),sheet=document.getElementById('sheet'),menu=document.getElementById('menu'),toast=document.getElementById('toast'),gif=document.getElementById('gif'),gifImg=document.getElementById('gifImg');
let gameConfig={madnessThreshold:100,horrorThreshold:500,baseClickPower:1};
const AudioSys={ctx:null,init(){this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)()},unlock(){if(!this.ctx)this.init();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},playBgm(){this.unlock();this.pad()},play(name){this.unlock();this.synth(name)},pad(){if(!this.ctx)return;let o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(164+state.phase*48,this.ctx.currentTime);o.connect(g);g.connect(this.ctx.destination);g.gain.setValueAtTime(.018,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.7);o.start();o.stop(this.ctx.currentTime+.72)},synth(name){if(!this.ctx)return;let o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);o.type=name==='fail'?'square':name==='phase'?'triangle':'sine';let f=name==='upgrade'?760:name==='phase'?420:name==='fail'?150:980;o.frequency.setValueAtTime(f,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(name==='fail'?90:f*1.4,this.ctx.currentTime+.12);g.gain.setValueAtTime(name==='phase'?.055:.08,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.16);o.start();o.stop(this.ctx.currentTime+.17)}};
function init(){try{const defs=JSON.parse(document.getElementById('game-config').textContent);window.gameConfigDefs=defs;gameConfig={};for(const k in defs)gameConfig[k]=defs[k].value}catch(e){}window.gameConfig=gameConfig;state.clickPower=gameConfig.baseClickPower||1;CONFIG.upgrades.forEach(u=>{const b=document.createElement('button');b.className='upgrade';b.id='btn-'+u.id;b.innerHTML=`<div><strong>${u.name}</strong><span>${u.desc}</span></div><div class="cost">${u.cost}</div>`;b.addEventListener('click',()=>buyUpgrade(u));upgradesEl.appendChild(b)});resize();addEventListener('resize',resize);canvas.addEventListener('pointerdown',tap,{passive:false});document.getElementById('startBtn').addEventListener('click',start);menu.addEventListener('click',()=>{const closed=sheet.classList.toggle('closed');menu.setAttribute('aria-expanded',String(!closed))});updateUI();requestAnimationFrame(loop)}
function start(){AudioSys.init();AudioSys.unlock();AudioSys.play('phase');AudioSys.playBgm(0);document.getElementById('start').classList.add('hidden');state.started=true;state.lastTick=performance.now()}
function resize(){const dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function tap(e){e.preventDefault();state.pulse=1.17;state.shake=8;addScore(state.clickPower);AudioSys.play('tap');const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;spawnParticles(x,y,7);showToast('+'+Math.floor(state.clickPower)+' sleepy vibe');if(state.clickPower>=5||Math.random()<.16)showGif('https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',420);if(state.phase===2&&Math.random()<.05)flash('too iconic')}
function addScore(n){state.score+=n;checkPhase();updateUI()}
function buyUpgrade(u){if(state.score>=u.cost){state.score-=u.cost;u.cost=Math.floor(u.cost*1.5);if(u.type==='click')state.clickPower+=u.val;if(u.type==='auto')state.autoPower+=u.val;document.querySelector('#btn-'+u.id+' .cost').textContent=u.cost;AudioSys.play('upgrade');showToast(u.name+' unlocked');showGif('https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',760);updateUI()}else{AudioSys.play('fail');showToast('need more vibes')}}
function checkPhase(){const old=state.phase;state.phase=state.score>=gameConfig.horrorThreshold?2:state.score>=gameConfig.madnessThreshold?1:0;if(old!==state.phase){document.body.className='phase'+(state.phase+1);state.shake=22;AudioSys.play('phase');if(state.started)AudioSys.playBgm(state.phase);showToast(state.phase===1?'coven is giving drama':'midnight main character');showGif(state.phase===2?'https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp':'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp',900)}}
function updateUI(){scoreEl.textContent=Math.floor(state.score);incomeEl.textContent=state.autoPower+' / sec idle cozy';CONFIG.upgrades.forEach(u=>{const b=document.getElementById('btn-'+u.id);if(b)b.disabled=state.score<u.cost})}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),650)}
function showGif(src,d=600){gifImg.src=src;gif.classList.add('show');clearTimeout(showGif.t);showGif.t=setTimeout(()=>gif.classList.remove('show'),d)}
function flash(t){const f=document.createElement('div');f.className='flash';f.textContent=t;document.getElementById('game').appendChild(f);AudioSys.play('fail');setTimeout(()=>f.remove(),260)}
function spawnParticles(x,y,n){const palette=state.phase===0?['#fff1a8','#ff9bd2','#a6f3d1']:state.phase===1?['#ff76be','#bca7ff','#fff']:['#ffd1e8','#7f4bd8','#fff1a8'];for(let i=0;i<n;i++)state.particles.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7-1,life:1,c:palette[i%palette.length],s:3+Math.random()*4})}
function loop(now){const dt=((now-state.lastTick)||0)/1000;state.lastTick=now;if(state.started&&state.autoPower>0)addScore(state.autoPower*dt);state.pulse+=(1-state.pulse)*Math.min(1,dt*9);state.shake*=.9;state.bg+=dt;draw(now);requestAnimationFrame(loop)}
function draw(now){const w=innerWidth,h=innerHeight,cx=w/2,cy=h*.44;drawRoom(w,h,now);let sx=(Math.random()-.5)*state.shake,sy=(Math.random()-.5)*state.shake;ctx.save();ctx.translate(cx+sx,cy+sy);ctx.scale(state.pulse,state.pulse);drawCauldron(now);ctx.restore();drawParticles();}
function drawRoom(w,h,t){let g=ctx.createLinearGradient(0,0,0,h);if(state.phase===0){g.addColorStop(0,'#ffd1e8');g.addColorStop(.5,'#cbb7ff');g.addColorStop(1,'#755b8a')}else if(state.phase===1){g.addColorStop(0,'#ffb2df');g.addColorStop(.5,'#a987ff');g.addColorStop(1,'#5c3974')}else{g.addColorStop(0,'#3a244f');g.addColorStop(.48,'#7e3d8e');g.addColorStop(1,'#2d1a3d')}ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(255,247,236,.75)';ctx.beginPath();ctx.arc(w*.5,h*.13,48+Math.sin(t/700)*4,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(82,42,75,.22)';for(let i=0;i<5;i++){let x=(i*.23*w+(t/90)%w)%w;ctx.fillRect(x,h*.72+Math.sin(t/400+i)*12,70,8)}ctx.fillStyle='rgba(255,255,255,.38)';for(let i=0;i<22;i++){let x=(i*61+(t/40))%(w+80)-40,y=80+(i*97)%Math.max(100,h*.56);star(x,y,3+(i%3))}ctx.fillStyle='rgba(95,50,84,.5)';ctx.fillRect(0,h*.75,w,h*.25);ctx.fillStyle='rgba(255,235,246,.45)';ctx.fillRect(w*.1,h*.2,w*.8,8);['🕯️','🌿','📖','🐸','✨'].forEach((e,i)=>{ctx.font='24px serif';ctx.fillText(e,w*.16+i*w*.16,h*.19)})}
function star(x,y,r){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-r/2,-r/2,r,r);ctx.rotate(Math.PI/4);ctx.fillRect(-r/2,-r/2,r,r);ctx.restore()}
function drawCauldron(t){ctx.save();ctx.shadowBlur=28;ctx.shadowColor=state.phase===2?'#fff1a8':'#ff9bd2';ctx.fillStyle='#3b2545';ctx.beginPath();ctx.ellipse(0,60,118,72,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#57345f';ctx.beginPath();ctx.ellipse(0,28,132,42,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=state.phase===0?'#ff9bd2':state.phase===1?'#bca7ff':'#a6f3d1';ctx.beginPath();ctx.ellipse(0,20,105,27,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-70+i*28,12+Math.sin(t/260+i)*7,9+(i%2)*4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#2b1734';ctx.fillRect(-82,90,26,30);ctx.fillRect(56,90,26,30);ctx.fillStyle='#ff77bd';ctx.beginPath();ctx.ellipse(0,62,38,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1a8';ctx.font='26px serif';ctx.fillText('✦',-9,70);ctx.fillStyle='#3d2348';ctx.beginPath();ctx.moveTo(-70,-22);ctx.quadraticCurveTo(-22,-132,66,-34);ctx.lineTo(42,-19);ctx.quadraticCurveTo(-12,-70,-70,-22);ctx.fill();ctx.fillStyle='#ff9bd2';ctx.fillRect(-60,-28,112,16);ctx.fillStyle='#fff1a8';ctx.beginPath();ctx.arc(12,-22,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#201226';ctx.beginPath();ctx.arc(-35,35,9,0,Math.PI*2);ctx.arc(35,35,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#201226';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,42,38,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.fillStyle='#ffd1e8';ctx.beginPath();ctx.moveTo(-116,26);ctx.quadraticCurveTo(-147,42,-122,60);ctx.quadraticCurveTo(-94,44,-116,26);ctx.fill();ctx.beginPath();ctx.moveTo(116,26);ctx.quadraticCurveTo(147,42,122,60);ctx.quadraticCurveTo(94,44,116,26);ctx.fill();ctx.restore()}
function drawParticles(){for(let i=state.particles.length-1;i>=0;i--){let p=state.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025;if(p.life<=0)state.particles.splice(i,1);else{ctx.globalAlpha=p.life;ctx.fillStyle=p.c;star(p.x,p.y,p.s)}}ctx.globalAlpha=1}
window.updateGameConfig=(k,v)=>{gameConfig[k]=v;state.clickPower=gameConfig.baseClickPower||1;checkPhase();updateUI()};
addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
