<script>
// --- CONFIGURATION ---
window.gameConfig = {
    growthSpeed: 5,
    decayRate: 8,
    themeColor: "#FFDEE9"
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    master: null,
    sfxGain: null,
    bgmStarted: false,
    pools: {},
    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.8;
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = 0.6;
            this.sfxGain.connect(this.master);
            this.master.connect(this.ctx.destination);
        }

        ['sfx_ui', 'sfx_care', 'sfx_blocked', 'sfx_warning', 'sfx_win', 'sfx_fail'].forEach(id => {
            this.preparePool(id, id === 'sfx_warning' ? 2 : 3);
        });

        const unlock = () => {
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
            this.startBgm();
            document.removeEventListener('pointerdown', unlock);
            document.removeEventListener('keydown', unlock);
        };

        document.addEventListener('pointerdown', unlock);
        document.addEventListener('keydown', unlock, { once: true });
    },
    preparePool: function(id, count = 3) {
        if (this.pools[id]) return;
        const source = document.getElementById(id);
        if (!source) return;
        this.pools[id] = Array.from({ length: count }, () => {
            const clone = source.cloneNode();
            clone.preload = 'auto';
            clone.volume = source.volume || 1;
            return clone;
        });
    },
    play: function(id, options = {}) {
        const pool = this.pools[id];
        if (!pool || !pool.length) {
            this.beep(options.pitch || 1);
            return;
        }

        const clip = pool.find(audio => audio.paused || audio.ended) || pool[0];
        try {
            clip.pause();
            clip.currentTime = 0;
            clip.playbackRate = options.pitch || 1;
            clip.volume = options.volume ?? 0.55;
            clip.play().catch(() => this.beep(options.pitch || 1));
        } catch (_) {
            this.beep(options.pitch || 1);
        }
    },
    startBgm: function() {
        const bgm = document.getElementById('bgm_main');
        if (!bgm) return;
        bgm.volume = 0.22;
        if (!this.bgmStarted) {
            this.bgmStarted = true;
        }
        bgm.play().catch(() => {});
    },
    pauseBgm: function() {
        const bgm = document.getElementById('bgm_main');
        if (bgm) bgm.pause();
    },
    syncBgmForState: function() {
        if (gameState === 'PLAY' || gameState === 'SLEEP') this.startBgm();
        else this.pauseBgm();
    },
    beep: function(pitch) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.sfxGain || this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.value = 360 * pitch;
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
};

const GifFeedback = {
    timers: {},
    show(id, duration = 1400) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add('show');
        clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => {
            el.classList.remove('show');
        }, duration);
    },
    hide(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('show');
        clearTimeout(this.timers[id]);
    }
};

// --- GAME ENGINE ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Game State
let gameState = 'START'; // START, PLAY, SLEEP, END
let lastTime = 0;
let pet = {
    hunger: 100,
    fun: 100,
    energy: 100,
    growth: 0,
    scale: 1.0,
    bounce: 0,
    img: document.getElementById('asset_pet')
};
let particles = [];
let texts = [];

// Resize
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- LOGIC ---

function spawnParticles(x, y, type) {
    const count = 8;
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300 - 100,
            life: 1.0,
            type: type,
            size: Math.random() * 10 + 5
        });
    }
}

function spawnText(x, y, str, color) {
    texts.push({ x, y, text: str, life: 1.0, color });
}

function update(dt) {
    if (gameState !== 'PLAY' && gameState !== 'SLEEP') return;

    // Companion animation (breathing)
    const time = Date.now() / 1000;
    pet.bounce = Math.sin(time * 4) * 0.05;

    // Decay logic
    const decay = window.gameConfig.decayRate * dt * (1 + pet.growth/100); // Harder as care score rises

    if (gameState === 'SLEEP') {
        // Recover energy, hunger decays slower
        pet.energy = Math.min(100, pet.energy + 20 * dt);
        pet.hunger = Math.max(0, pet.hunger - (decay * 0.2));
        // Wake up if full
        if (pet.energy >= 100) {
            wakeUp();
        }
    } else {
        // Normal decay
        pet.hunger -= decay;
        pet.fun -= decay;
        pet.energy -= decay * 0.5;
    }

    // Care progress: only rises if all stats are healthy
    if (pet.hunger > 50 && pet.fun > 50 && pet.energy > 20) {
        pet.growth += window.gameConfig.growthSpeed * dt * 0.5;
    }

    // Clamp stats
    if (pet.hunger < 0) pet.hunger = 0;
    if (pet.fun < 0) pet.fun = 0;
    if (pet.energy < 0) pet.energy = 0;

    // Check win/loss
    if (pet.growth >= 100) {
        endGame(true);
    } else if (pet.hunger <= 0 || pet.fun <= 0 || pet.energy <= 0) {
        endGame(false);
    }

    // Update UI bars
    updateUI();

    // Physics
    updateParticles(dt);
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) {
        let t = texts[i];
        t.y -= 50 * dt;
        t.life -= dt;
        if (t.life <= 0) texts.splice(i, 1);
    }
}

function updateUI() {
    document.getElementById('bar-hunger').style.width = pet.hunger + '%';
    document.getElementById('bar-fun').style.width = pet.fun + '%';
    document.getElementById('bar-energy').style.width = pet.energy + '%';
    document.getElementById('bar-growth').style.width = Math.min(100, pet.growth) + '%';
    document.getElementById('score-val').innerText = Math.floor(pet.growth) + '%';

    const moodEl = document.getElementById('pet-mood');
    if (moodEl) {
        if (gameState === 'SLEEP') moodEl.textContent = '🌙 Recharging';
        else if (pet.hunger < 30 || pet.fun < 30 || pet.energy < 30) moodEl.textContent = '⚠️ Needs care';
        else if (pet.growth >= 75) moodEl.textContent = '🌈 Thriving';
        else if (pet.growth >= 35) moodEl.textContent = '✨ Blooming';
        else moodEl.textContent = '💫 Ready';
    }

    // Color feedback
    document.getElementById('bar-hunger').className = `bar-fill ${pet.hunger < 30 ? 'bg-red-500' : 'bg-orange-500'}`;
    document.getElementById('bar-fun').className = `bar-fill ${pet.fun < 30 ? 'bg-red-500' : 'bg-blue-500'}`;
    document.getElementById('bar-energy').className = `bar-fill ${pet.energy < 30 ? 'bg-red-500' : 'bg-yellow-500'}`;
}

function draw() {
    // Clear
    const bgGradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    if (gameState === 'SLEEP') {
        bgGradient.addColorStop(0, '#141936');
        bgGradient.addColorStop(1, '#070b17');
    } else {
        bgGradient.addColorStop(0, '#1b2058');
        bgGradient.addColorStop(0.55, '#121a43');
        bgGradient.addColorStop(1, '#070c18');
    }
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2 + 50;
    const growthScale = 1.0 + (pet.growth / 100) * 1.5;
    const auraRadius = 140 * growthScale;

    // Ambient glow
    const aura = ctx.createRadialGradient(cx, cy - 40, 24, cx, cy, auraRadius);
    aura.addColorStop(0, gameState === 'SLEEP' ? 'rgba(156,140,255,0.3)' : 'rgba(143,255,232,0.3)');
    aura.addColorStop(0.5, 'rgba(112,214,255,0.16)');
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(cx, cy, auraRadius, 0, Math.PI * 2);
    ctx.fill();

    // Draw floor shadow
    ctx.fillStyle = "rgba(3,6,18,0.45)";
    ctx.beginPath();
    const shadowSize = 60 * (1 + pet.growth/100);
    ctx.ellipse(cx, cy + shadowSize, shadowSize * 1.18, shadowSize/2.8, 0, 0, Math.PI*2);
    ctx.fill();

    // Draw companion
    ctx.save();
    ctx.translate(cx, cy);
    
    // Scale based on care progress (1.0 to 2.5x)
    const breathe = 1.0 + pet.bounce;
    ctx.scale(growthScale * breathe, growthScale * (2 - breathe));

    // Halo ring behind character
    ctx.strokeStyle = gameState === 'SLEEP' ? 'rgba(156,140,255,0.5)' : 'rgba(143,255,232,0.65)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, 42, 0, Math.PI * 2);
    ctx.stroke();

    // Draw sprite or fallback
    const size = 100;
    if (pet.img && pet.img.complete && pet.img.naturalWidth > 0) {
        ctx.save();
        ctx.shadowColor = gameState === 'SLEEP' ? 'rgba(156,140,255,0.65)' : 'rgba(143,255,232,0.65)';
        ctx.shadowBlur = 26;
        ctx.drawImage(pet.img, -size/2, -size/2, size, size);
        ctx.restore();
    } else {
        // Procedural cute blob
        const body = ctx.createRadialGradient(-10, -16, 12, 0, 0, 64);
        body.addColorStop(0, "#ffd8f0");
        body.addColorStop(0.55, "#ff82b2");
        body.addColorStop(1, "#7c67ff");
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.arc(0, 0, size/2, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.beginPath();
        ctx.ellipse(-12, -18, 18, 11, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(-15, -10, 10, 0, Math.PI*2);
        ctx.arc(15, -10, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#1e244f";
        ctx.beginPath();
        ctx.arc(-15, -8, 4, 0, Math.PI*2);
        ctx.arc(15, -8, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-13, -10, 1.5, 0, Math.PI*2);
        ctx.arc(17, -10, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Cheeks
        ctx.fillStyle = "rgba(255, 214, 232, 0.85)";
        ctx.beginPath();
        ctx.arc(-25, 2, 6, 0, Math.PI*2);
        ctx.arc(25, 2, 6, 0, Math.PI*2);
        ctx.fill();

        // Smile
        ctx.strokeStyle = "#1e244f";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 6, 10, 0.1, Math.PI - 0.1, false);
        ctx.stroke();

        // Tiny ears
        ctx.fillStyle = "#9c8cff";
        ctx.beginPath();
        ctx.moveTo(-26, -28);
        ctx.lineTo(-10, -44);
        ctx.lineTo(-4, -22);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(26, -28);
        ctx.lineTo(10, -44);
        ctx.lineTo(4, -22);
        ctx.fill();
    }
    
    // Sleep Zzz
    if (gameState === 'SLEEP') {
        ctx.fillStyle = "white";
        ctx.font = "bold 40px 'Orbitron'";
        const zOffset = (Date.now() / 500) % 3;
        ctx.fillText("Z", 40, -40 - zOffset*10);
        ctx.fillText("z", 60, -60 - zOffset*10);
    }

    ctx.restore();

    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.type === 'food' ? '#FFA500' : (p.type === 'fun' ? '#4FD1C5' : '#FFF');
        ctx.beginPath();
        if (p.type === 'food') {
            ctx.fillText("🍔", 0, 0);
        } else if (p.type === 'fun') {
            ctx.fillText("✨", 0, 0);
        } else {
            ctx.arc(0, 0, p.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    });

    // Floating text
    texts.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.life;
        ctx.font = "bold 24px 'Orbitron'";
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
    });
    
    ctx.globalAlpha = 1.0;
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// --- ACTIONS ---

function wakeUp() {
    gameState = 'PLAY';
    document.getElementById('btn-sleep').classList.remove('bg-indigo-300');
    document.getElementById('btn-sleep').classList.add('bg-indigo-100');
    spawnText(window.innerWidth/2, window.innerHeight/2 - 100, "BACK ON DUTY!", "#FFF");
    AudioSys.play('sfx_ui', { pitch: 1.12, volume: 0.42 });
    AudioSys.syncBgmForState();
}

function interact(type) {
    if (gameState === 'SLEEP') {
        // Tapping anything wakes up? No, sleep button wakes the companion
        if (type === 'sleep') wakeUp();
        return;
    }
    if (gameState !== 'PLAY') return;

    const cx = window.innerWidth/2;
    const cy = window.innerHeight/2;

    if (type === 'feed') {
        if (pet.hunger >= 100) {
            spawnText(cx, cy - 100, "ALL SET!", "#FFA500");
            AudioSys.play('sfx_blocked', { pitch: 1.05, volume: 0.42 });
            return;
        }
        pet.hunger = Math.min(100, pet.hunger + 20);
        pet.growth += 0.5; // Small progress boost
        spawnParticles(cx, cy, 'food');
        spawnText(cx, cy - 120, "NICE!", "#FFA500");
        GifFeedback.show('gif-feedback-good', 1200);
        AudioSys.play('sfx_care', { pitch: 0.96, volume: 0.5 });
    }
    else if (type === 'play') {
        if (pet.energy <= 10) {
            spawnText(cx, cy - 100, "LOW BATTERY...", "#888");
            AudioSys.play('sfx_warning', { pitch: 0.92, volume: 0.5 });
            return;
        }
        if (pet.fun >= 100) {
            spawnText(cx, cy - 100, "ALL GOOD!", "#4FD1C5");
            AudioSys.play('sfx_blocked', { pitch: 1.18, volume: 0.42 });
            return;
        }
        pet.fun = Math.min(100, pet.fun + 25);
        pet.energy = Math.max(0, pet.energy - 15); // Playing uses energy
        spawnParticles(cx, cy, 'fun');
        spawnText(cx, cy - 120, "BOOST!", "#4FD1C5");
        GifFeedback.show('gif-feedback-good', 1400);
        AudioSys.play('sfx_care', { pitch: 1.08, volume: 0.5 });
    }
    else if (type === 'sleep') {
        gameState = 'SLEEP';
        document.getElementById('btn-sleep').classList.remove('bg-indigo-100');
        document.getElementById('btn-sleep').classList.add('bg-indigo-300');
        AudioSys.play('sfx_ui', { pitch: 0.88, volume: 0.42 });
        AudioSys.syncBgmForState();
    }
}

function endGame(win) {
    gameState = 'END';
    AudioSys.syncBgmForState();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = Math.floor(pet.growth);
    
    if (win) {
        document.getElementById('end-title').innerText = "CARE COMPLETE!";
        document.getElementById('end-title').className = "ui-title text-5xl text-green-400 mb-4";
        document.getElementById('end-reason').innerText = "You kept the companion thriving!";
        document.getElementById('gif-feedback-end').src = document.getElementById('gif_celebrate').src;
        GifFeedback.show('gif-feedback-end', 5000);
        AudioSys.play('sfx_win', { pitch: 1.02, volume: 0.6 });
    } else {
        document.getElementById('end-title').innerText = "SHIFT MISSED";
        document.getElementById('end-title').className = "ui-title text-5xl text-red-500 mb-4";
        if (pet.hunger <= 0) document.getElementById('end-reason').innerText = "Meals ran out.";
        else if (pet.fun <= 0) document.getElementById('end-reason').innerText = "Morale dropped too low.";
        else document.getElementById('end-reason').innerText = "Energy hit empty.";
        document.getElementById('gif-feedback-end').src = document.getElementById('gif_cheer').src;
        GifFeedback.show('gif-feedback-end', 4200);
        AudioSys.play('sfx_fail', { pitch: 0.96, volume: 0.58 });
    }
}

// --- INPUTS ---

document.getElementById('btn-feed').addEventListener('click', () => interact('feed'));
document.getElementById('btn-play').addEventListener('click', () => interact('play'));
document.getElementById('btn-sleep').addEventListener('click', () => interact('sleep'));

// Tap companion to cheer it up
canvas.addEventListener('pointerdown', (e) => {
    if (gameState !== 'PLAY') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Check click near center (companion)
    const cx = window.innerWidth/2;
    const cy = window.innerHeight/2 + 50;
    const size = 150 * (1 + pet.growth/100);
    
    if (Math.abs(x - cx) < size/2 && Math.abs(y - cy) < size/2) {
        pet.fun = Math.min(100, pet.fun + 5);
        spawnText(cx, cy - 150, "♥", "#FF0055");
        spawnParticles(x, y, 'fun');
        GifFeedback.show('gif-feedback-good', 1000);
        AudioSys.play('sfx_care', { pitch: 1.18, volume: 0.42 });
    }
});

document.getElementById('start-btn').addEventListener('click', () => {
    AudioSys.init();
    AudioSys.play('sfx_ui', { pitch: 1.05, volume: 0.46 });
    resetGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
    resetGame();
});

function resetGame() {
    pet.hunger = 100;
    pet.fun = 100;
    pet.energy = 100;
    pet.growth = 0;
    particles = [];
    texts = [];
    gameState = 'PLAY';

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    GifFeedback.hide('gif-feedback-good');
    GifFeedback.hide('gif-feedback-end');
    AudioSys.syncBgmForState();
    
    // Reset button styles
    document.getElementById('btn-sleep').classList.remove('bg-indigo-300');
    document.getElementById('btn-sleep').classList.add('bg-indigo-100');
}

// Start loop
requestAnimationFrame(gameLoop);

</script>
