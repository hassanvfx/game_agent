<style>
    :root {
        --bg-top: #0e1730;
        --bg-mid: #16345f;
        --bg-bottom: #d7f3ff;
        --panel: rgba(7, 18, 38, 0.72);
        --panel-border: rgba(130, 225, 255, 0.48);
        --panel-highlight: rgba(255, 255, 255, 0.12);
        --text-main: #eef9ff;
        --text-soft: #a8d9f0;
        --accent-cyan: #72f0ff;
        --accent-blue: #5ea7ff;
        --accent-gold: #ffd86b;
        --accent-rose: #ff718f;
        --accent-mint: #70f1c1;
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at top, rgba(114, 240, 255, 0.18), transparent 30%),
            linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
        font-family: 'Rajdhani', sans-serif;
        color: var(--text-main);
        -webkit-user-select: none;
        user-select: none;
    }

        min-height: 100vh;
        min-height: 100dvh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.16), transparent 18%),

        position: relative;

        background: linear-gradient(180deg, #ffd86b, #ffae3d);

    .btn-bounce {
        transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
    }
    .btn-bounce:active { transform: scale(0.95); filter: brightness(1.06); }
    ::-webkit-scrollbar { display: none; }
    .hidden { display: none !important; }
    .modal-shell {
        display: flex;
        flex-direction: column;
        max-height: min(90vh, 42rem);
    }
    .modal-content {
        overflow-y: auto;
    }
    .modal-actions {
        position: sticky;
        bottom: 0;
        background: linear-gradient(180deg, rgba(9, 20, 39, 0), rgba(9, 20, 39, 0.96) 28%);
        padding-top: 1rem;

    .clinic-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        border-radius: 999px;
        background: rgba(114, 240, 255, 0.12);

    .gif-badge {
        position: absolute;
        right: 0.9rem;
        bottom: 7.7rem;
        z-index: 18;
        width: min(26vw, 6.75rem);
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 26px rgba(8, 16, 30, 0.3);
        overflow: hidden;
        opacity: 0;
        transform: translateY(10px) scale(0.92);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
        background: rgba(8, 19, 42, 0.82);
    }
    .gif-badge.active {
        opacity: 0.96;
        transform: translateY(0) scale(1);
    }
    .gif-badge img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
    }
    .gif-badge span {
        display: block;
        padding: 0.4rem 0.55rem 0.5rem;
        font-family: 'Audiowide', sans-serif;
        font-size: 0.62rem;

        text-align: center;
        color: #dffaff;
        background: linear-gradient(180deg, rgba(114,240,255,0.15), rgba(10,23,45,0.88));
    }
    @media (max-width: 640px) {
        #ui-layer { padding: 0.85rem; }
        .gif-badge {
            right: 0.7rem;
            bottom: 8.75rem;
            width: min(28vw, 5.6rem);
        }
    }
    
    /* Custom Animations */
    @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } }
    .animate-pulse-red { animation: pulse-red 2s infinite; }
</style>

<div id="game-container" class="relative w-full h-full">

    <!-- UI Layer -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, styling-only refresh -->

<script>
/**
 * §0 Core Architecture & Invariants
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let cw = 0, ch = 0;
let dpr = 1;
let lastTime = 0;
let initialized = false;
let gameState = 'PLAYING'; // PLAYING, MODAL

// Config & State
const gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
const gameConfig = Object.fromEntries(Object.entries(gameConfigDefs).map(([k,v]) => [k, v.value]));

const world = {
    money: 300,
    rooms: [],
    patients: [],
    particles: [],
    cameraY: 0,
    targetCameraY: 0,
    maxScroll: 0,
    nextPatientTime: 0,
    selectedRoom: null,
    mentalUnlocked: false,
    paddedUnlocked: false
};

// Audio System
const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
const sfxBuffers = {};
const bgm = document.getElementById('bgm_main');
const audioLevels = {
    bgm: 0.2,
    money: 0.24,
    click: 0.16,
    attack: 0.22,
    calm: 0.2,
    fail: 0.18,
    modal_open: 0.18,
    modal_close: 0.16
};
let audioUnlocked = false;
let lastSfxAt = 0;
const gifCalm = document.getElementById('gif-calm');
const gifAlert = document.getElementById('gif-alert');
let gifTimer = 0;
let lastAlertAt = 0;
let lastCalmAt = 0;

// Constants
const FLOOR_HEIGHT = 120;
const ROOM_WIDTH = 140;

/**
 * §1 Audio System
 */
async function initAudio() {
    if (!audioCtx) return;
    const loadBuffer = async (id, url) => {
        try {
            const res = await fetch(url);
            const arrayBuffer = await res.arrayBuffer();
            sfxBuffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.warn('SFX Load Fail', id); }
    };
    bgm.volume = audioLevels.bgm;
    await Promise.all([
        loadBuffer('money', document.getElementById('sfx_money').src),
        loadBuffer('click', document.getElementById('sfx_click').src),
        loadBuffer('attack', document.getElementById('sfx_attack').src),
        loadBuffer('calm', document.getElementById('sfx_calm').src),
        loadBuffer('fail', document.getElementById('sfx_fail').src),
        loadBuffer('modal_open', document.getElementById('sfx_modal_open').src),
        loadBuffer('modal_close', document.getElementById('sfx_modal_close').src)
    ]);
}

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (audioCtx?.state === 'suspended') audioCtx.resume().catch(() => {});
    bgm.play().catch(() => {});
}

function playSfx(id, { throttleMs = 80 } = {}) {
    if (!audioUnlocked || !audioCtx) return;
    const now = performance.now();
    if (now - lastSfxAt < throttleMs && id === 'click') return;
    lastSfxAt = now;

    if (sfxBuffers[id]) {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = sfxBuffers[id];
        gain.gain.value = audioLevels[id] ?? 0.18;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(0);
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(id === 'money' ? 800 : 220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
}

function setBgmState(shouldPlay) {
    if (!audioUnlocked) return;
    if (shouldPlay) bgm.play().catch(() => {});
    else bgm.pause();
}

function showGif(kind) {
    const now = performance.now();
    if (kind === 'alert' && now - lastAlertAt < 900) return;
    if (kind === 'calm' && now - lastCalmAt < 1100) return;
    if (kind === 'alert') lastAlertAt = now;
    if (kind === 'calm') lastCalmAt = now;

    gifCalm.classList.remove('active');
    gifAlert.classList.remove('active');
    const node = kind === 'calm' ? gifCalm : gifAlert;
    node.classList.add('active');
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => {
        node.classList.remove('active');
    }, 1300);
}

function vibrate(type) {
    if (window.webkit?.messageHandlers?.gamezoneBridge) {
        window.webkit.messageHandlers.gamezoneBridge.postMessage({
            action: 'vibrate', requestId: 'h5-'+Date.now(), version: '1.0', params: { style: type }
        });
    } else if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? 40 : 15);
    }
}

/**
 * §2 Entity System
 */
class Room {
    constructor(id, type, floor, side) {
        this.id = id;
        this.type = type; // 'reception', 'general', 'padded'
        this.floor = floor;
        this.side = side; // -1 (left), 0 (center), 1 (right)
        this.levelSpeed = 1;
        this.levelValue = 1;
        this.state = 'IDLE'; // IDLE, TREATING
        this.timer = 0;
        this.patient = null;
        this.doctorAnim = 0;
    }

    get x() { return cw/2 + this.side * (cw/2.2); }
    get y() { return ch - 80 - (this.floor * FLOOR_HEIGHT); }
    
    get treatmentTime() { return Math.max(0.5, gameConfig.baseTreatmentTime * Math.pow(0.9, this.levelSpeed - 1)); }
    get value() { 
        let base = this.type === 'padded' ? 25 : 10;
        return Math.floor(base * Math.pow(1.2, this.levelValue - 1)); 
    }
    
    get upgradeCostSpeed() { return Math.floor(50 * Math.pow(1.5, this.levelSpeed)); }
    get upgradeCostValue() { return Math.floor(50 * Math.pow(1.5, this.levelValue)); }
}

class Patient {
    constructor(isMental = false) {
        this.x = cw/2;
        this.y = ch + 20;
        this.targetRoom = null;
        this.state = 'ENTERING'; // ENTERING, WAITING, WALKING_TO, TREATING, LEAVING, ATTACKING
        this.hp = 100;
        this.speed = 100; 
        
        // Mental Attributes
        this.type = isMental ? 'mental' : 'normal';
        this.sanity = 100;
        this.mentalState = 'GREEN'; // GREEN, YELLOW, RED
        this.attackTarget = null;
        this.shake = 0;
    }

    get color() {
        if (this.type === 'mental') {
            if (this.mentalState === 'RED') return '#E74C3C'; // Red
            if (this.mentalState === 'YELLOW') return '#F1C40F'; // Yellow
            return '#2ECC71'; // Green
        }
        return '#3498DB'; // Normal Blue
    }
}

class Particle {
    constructor(x, y, text, color) {
        this.x = x; y; this.y = y; this.text = text; this.color = color;
        this.life = 1.0; this.vy = -50;
    }
}

/**
 * §3 Game Logic
 */
function initGame() {
    if (initialized) return;
    world.rooms.push(new Room(0, 'reception', 0, 0));
    initAudio();
    // [agent-note][stage3] resolved-audio: loop + semantic ui/collect/fail/impact cues from catalogs/audios.json
    updateUI();
    requestAnimationFrame(loop);
    initialized = true;
}

function spawnPatient() {
    if (world.patients.length > 25) return;
    
    const isMental = world.mentalUnlocked && Math.random() < 0.3; // 30% chance after unlock
    world.patients.push(new Patient(isMental));
}

function getBuildCost(type) {
    if (type === 'padded') {
        const count = world.rooms.filter(r => r.type === 'padded').length;
        return Math.floor(500 * Math.pow(1.5, count));
    }
    const count = world.rooms.filter(r => r.type === 'general').length;
    return Math.floor(100 * Math.pow(1.4, count));
}

function buildRoom(type = 'general') {
    const cost = getBuildCost(type);
    if (world.money >= cost) {
        world.money -= cost;
        playSfx('click');
        vibrate('medium');
        
        const count = world.rooms.filter(r => r.type !== 'reception').length;
        const floor = Math.floor(count / 2) + 1;
        const side = (count % 2 === 0) ? -1 : 1;
        
        const newRoom = new Room(Date.now(), type, floor, side);
        world.rooms.push(newRoom);
        
        spawnParticles(newRoom.x, newRoom.y - world.cameraY, type === 'padded' ? "PADDED!" : "NEW ROOM!", "#FFF");
        showGif('calm');
        updateUI();
    } else {
        playSfx('fail', { throttleMs: 180 });
    }
}

function upgradeRoom(type) {
    if (!world.selectedRoom) return;
    const r = world.selectedRoom;
    const cost = type === 'speed' ? r.upgradeCostSpeed : r.upgradeCostValue;
    
    if (world.money >= cost) {
        world.money -= cost;
        if (type === 'speed') r.levelSpeed++; else r.levelValue++;
        playSfx('calm');
        vibrate('light');
        spawnParticles(r.x, r.y - world.cameraY, "UPGRADE!", "#F1C40F");
        showGif('calm');
    } else {
        playSfx('fail', { throttleMs: 180 });
    }
    updateModal();
    updateUI();
}

function spawnParticles(x, y, text, color) {
    world.particles.push(new Particle(x, y, text, color));
}

function update(dt) {
    // Unlocks
    const lvl = world.rooms.length;
    if (lvl >= gameConfig.mentalUnlockLevel) world.mentalUnlocked = true;
    if (lvl >= gameConfig.paddedUnlockLevel) world.paddedUnlocked = true;

    // Spawner
    world.nextPatientTime -= dt;
    if (world.nextPatientTime <= 0) {
        spawnPatient();
        world.nextPatientTime = gameConfig.patientSpawnRate;
    }

    // Camera
    world.cameraY += (world.targetCameraY - world.cameraY) * 10 * dt;
    const maxFloor = Math.max(...world.rooms.map(r => r.floor));
    world.maxScroll = Math.max(0, (maxFloor * FLOOR_HEIGHT) + 300 - ch);
    world.targetCameraY = Math.max(0, Math.min(world.targetCameraY, world.maxScroll));

    // Rooms
    world.rooms.forEach(r => {
        if (r.state === 'TREATING') {
            r.timer -= dt;
            r.doctorAnim += dt * 10;
            if (r.timer <= 0) {
                // Treatment Complete
                if (r.patient) {
                    const p = r.patient;
                    p.state = 'LEAVING';
                    
                    if (r.type === 'padded') {
                        p.sanity = 100;
                        p.mentalState = 'GREEN';
                        playSfx('calm');
                        spawnParticles(r.x, r.y - world.cameraY, "CALMED", "#2ECC71");
                    } else {
                        playSfx('money');
                        spawnParticles(r.x, r.y - world.cameraY, `+$${r.value}`, "#F1C40F");
                    }
                    
                    world.money += r.value;
                    vibrate('light');
                    updateUI();
                }
                r.patient = null;
                r.state = 'IDLE';
            }
        }
    });

    // Patients
    for (let i = world.patients.length - 1; i >= 0; i--) {
        const p = world.patients[i];
        
        // Mental Logic
        if (p.type === 'mental' && p.state !== 'TREATING' && p.state !== 'LEAVING') {
            p.sanity -= dt * 5; // Decay
            if (p.sanity <= 0) {
                p.mentalState = 'RED';
                if (p.state !== 'ATTACKING') {
                    p.state = 'ATTACKING';
                    // Leave queues
                    if (p.targetRoom) {
                        p.targetRoom.patient = null;
                        p.targetRoom = null;
                    }
                }
            } else if (p.sanity < 50) {
                p.mentalState = 'YELLOW';
                // If waiting for general, switch to padded if possible
                if (p.state === 'WAITING' || (p.state === 'WALKING_TO' && p.targetRoom?.type === 'general')) {
                    const padded = world.rooms.find(r => r.type === 'padded' && r.state === 'IDLE' && !r.patient);
                    if (padded) {
                        if (p.targetRoom) p.targetRoom.patient = null; // Free old room
                        p.targetRoom = padded;
                        padded.patient = p;
                        p.state = 'WALKING_TO';
                    }
                }
            } else {
                p.mentalState = 'GREEN';
            }
        }

        // State Machine
        if (p.state === 'ATTACKING') {
            // Find victim
            if (!p.attackTarget || !world.patients.includes(p.attackTarget)) {
                p.attackTarget = world.patients.find(v => v !== p && v.state !== 'LEAVING' && v.state !== 'ATTACKING');
            }
            
            if (p.attackTarget) {
                moveTo(p, p.attackTarget.x, p.attackTarget.y, dt * 1.5); // Fast
                if (dist(p.x, p.y, p.attackTarget.x, p.attackTarget.y) < 10) {
                    // ATTACK!
                    playSfx('attack', { throttleMs: 260 });
                    vibrate('heavy');
                    spawnParticles(p.x, p.y - world.cameraY, "POW!", "#E74C3C");
                    showGif('alert');
                    
                    // Kill victim
                    const idx = world.patients.indexOf(p.attackTarget);
                    if (idx > -1) world.patients.splice(idx, 1);
                    
                    // Sedate attacker (remove)
                    world.patients.splice(i, 1);
                    continue;
                }
            } else {
                // No targets, wander
                p.x += (Math.random()-0.5)*2;
            }
        } 
        else if (p.state === 'ENTERING') {
            const r = world.rooms[0];
            moveTo(p, r.x, r.y, dt);
            if (dist(p.x, p.y, r.x, r.y) < 5) {
                assignRoom(p);
            }
        } 
        else if (p.state === 'WAITING') {
            assignRoom(p);
        } 
        else if (p.state === 'WALKING_TO') {
            if (!p.targetRoom) { p.state = 'WAITING'; continue; }
            moveTo(p, p.targetRoom.x, p.targetRoom.y, dt);
            if (dist(p.x, p.y, p.targetRoom.x, p.targetRoom.y) < 5) {
                p.state = 'TREATING';
                p.targetRoom.state = 'TREATING';
                p.targetRoom.timer = p.targetRoom.treatmentTime;
            }
        } 
        else if (p.state === 'LEAVING') {
            moveTo(p, cw/2, ch + 50, dt);
            if (p.y > ch + 40) world.patients.splice(i, 1);
        }
    }

    // Particles
    for (let i = world.particles.length - 1; i >= 0; i--) {
        const pt = world.particles[i];
        pt.life -= dt;
        pt.y += pt.vy * dt;
        if (pt.life <= 0) world.particles.splice(i, 1);
    }
}

function assignRoom(p) {
    let type = 'general';
    if (p.type === 'mental' && p.mentalState === 'YELLOW') type = 'padded';
    
    const room = world.rooms.find(r => r.type === type && r.state === 'IDLE' && !r.patient);
    if (room) {
        p.targetRoom = room;
        room.patient = p;
        p.state = 'WALKING_TO';
    } else {
        p.state = 'WAITING';
    }
}

function moveTo(e, tx, ty, dt) {
    const dx = tx - e.x;
    const dy = ty - e.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 1) {
        const move = Math.min(d, e.speed * dt);
        e.x += (dx/d) * move;
        e.y += (dy/d) * move;
    }
}

function dist(x1, y1, x2, y2) { return Math.hypot(x1-x2, y1-y2); }

/**
 * §4 Rendering
 */
function draw() {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
        bgGrad.addColorStop(0, '#0c1530');
        bgGrad.addColorStop(0.45, '#19406b');
        bgGrad.addColorStop(1, '#c9f4ff');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);

        const glowGrad = ctx.createRadialGradient(cw * 0.2, ch * 0.1, 10, cw * 0.2, ch * 0.1, cw * 0.6);
        glowGrad.addColorStop(0, 'rgba(114, 240, 255, 0.18)');
        glowGrad.addColorStop(1, 'rgba(114, 240, 255, 0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, cw, ch);
        
        // Grid
        ctx.strokeStyle = 'rgba(209, 240, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i=0; i<cw; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,ch); }
        for (let i=0; i<ch; i+=40) { ctx.moveTo(0,i); ctx.lineTo(cw,i); }
        ctx.stroke();

        for (let i = 0; i < 12; i++) {
            const pulseX = (i / 11) * cw;
            const pulseY = (Math.sin((lastTime * 0.0015) + i) * 18) + (ch * 0.18);
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath();
            ctx.arc(pulseX, pulseY, 2 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
        }

    ctx.save();
    ctx.translate(0, world.cameraY);

    // Shaft
    const maxFloor = Math.max(...world.rooms.map(r => r.floor));
    const shaftHeight = (maxFloor * FLOOR_HEIGHT) + 200;
        const shaftGrad = ctx.createLinearGradient(cw/2 - 20, ch - 80 - shaftHeight, cw/2 + 20, ch - 80);
        shaftGrad.addColorStop(0, '#12284d');
        shaftGrad.addColorStop(0.5, '#285a8d');
        shaftGrad.addColorStop(1, '#15335f');
        ctx.fillStyle = shaftGrad;
        ctx.fillRect(cw/2 - 20, ch - 80 - shaftHeight, 40, shaftHeight);
        ctx.fillStyle = 'rgba(114, 240, 255, 0.16)';
        ctx.fillRect(cw/2 - 6, ch - 80 - shaftHeight, 12, shaftHeight);

    // Locked Area Indicator
    if (world.rooms.length < gameConfig.mentalUnlockLevel) {
        const lockY = ch - 80 - ((world.rooms.length + 2) * FLOOR_HEIGHT);
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0, lockY - 100, cw, 100);
        ctx.fillStyle = '#d3f7ff';
        ctx.font = '700 18px "Audiowide"';
        ctx.textAlign = 'center';
        ctx.fillText("🔒 CALM CARE OPENS AT LV 25", cw/2, lockY - 40);
    }

    // Rooms
    world.rooms.forEach(r => {
        const rw = (r.type === 'reception') ? 200 : ROOM_WIDTH;
        const rh = 80;
        const rx = r.x - rw/2;
        const ry = r.y - rh/2;
        
        // Base
        ctx.shadowColor = world.selectedRoom === r ? 'rgba(46, 204, 113, 0.6)' : 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = world.selectedRoom === r ? 20 : 10;
        ctx.shadowOffsetY = 4;
        
        // Room Color
        let roomGrad = ctx.createLinearGradient(rx, ry, rx, ry + rh);
        if (r.type === 'padded') {
            roomGrad.addColorStop(0, '#ecfffb');
            roomGrad.addColorStop(1, '#b9f8e2');
        } else if (r.type === 'reception') {
            roomGrad.addColorStop(0, '#f7feff');
            roomGrad.addColorStop(1, '#d7efff');
        } else {
            roomGrad.addColorStop(0, '#ffffff');
            roomGrad.addColorStop(1, '#d8f2ff');
        }
        ctx.fillStyle = roomGrad;

        ctx.beginPath();
        ctx.roundRect(rx, ry, rw, rh, 10);
        ctx.fill();

        ctx.strokeStyle = world.selectedRoom === r ? '#72f1c8' : 'rgba(31, 88, 137, 0.26)';
        ctx.lineWidth = world.selectedRoom === r ? 3 : 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(rx + 8, ry + 8, rw - 16, 5);
        ctx.shadowBlur = 0;

        // Floor Strip
        if (r.type === 'padded') ctx.fillStyle = '#2fbf98';
        else if (r.type === 'reception') ctx.fillStyle = '#204a7a';
        else ctx.fillStyle = '#2b8fff';
        
        ctx.beginPath();
        ctx.roundRect(rx, ry + rh - 10, rw, 10, [0,0,10,10]);
        ctx.fill();

        // Label
        ctx.fillStyle = '#21415d';
        ctx.font = '600 13px "Rajdhani"';
        ctx.textAlign = 'center';
        let label = r.type === 'reception' ? 'CHECK-IN' : `CLINIC ${r.floor}`;
        if (r.type === 'padded') label = `CALM SUITE ${r.floor}`;
        ctx.fillText(label, r.x, r.y - 12);
        
        // Stars
        ctx.fillStyle = '#ffbf4d';
        ctx.font = '700 14px "Audiowide"';
        ctx.fillText(`★ ${r.levelSpeed + r.levelValue - 1}`, r.x, r.y + 20);

        // Doctor
        if (r.type !== 'reception') {
            const docY = r.y + Math.sin(r.doctorAnim) * 3;
            ctx.fillStyle = '#ffe3c2';
            ctx.beginPath(); ctx.arc(r.x + 35, docY, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = r.type === 'padded' ? '#46c7a6' : '#377df4';
            ctx.beginPath(); ctx.arc(r.x + 35, docY + 12, 8, 0, Math.PI, true); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(r.x + 31, docY + 10, 8, 2);
        }
    });

    // Patients
    world.patients.forEach(p => {
        let px = p.x;
        let py = p.y;
        
        // Shake if crazy
        if (p.mentalState === 'YELLOW') px += (Math.random()-0.5)*2;
        if (p.mentalState === 'RED') px += (Math.random()-0.5)*5;

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.ellipse(px, py + 12, 9, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffd9bd';
        ctx.beginPath();
        ctx.arc(px, py - 2, 7.5, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.roundRect(px - 7, py + 4, 14, 11, 5);
        ctx.fill();
        
        // Mask/Face
        if (p.mentalState === 'RED') {
            ctx.fillStyle = '#120505';
            ctx.fillRect(px - 4, py - 4, 2, 2);
            ctx.fillRect(px + 2, py - 4, 2, 2);
            ctx.fillRect(px - 2, py, 4, 1);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(px - 4, py - 1, 8, 4);
            ctx.fillStyle = '#204a7a';
            ctx.fillRect(px - 3, py - 5, 1.5, 1.5);
            ctx.fillRect(px + 1.5, py - 5, 1.5, 1.5);
        }

        if (p.type === 'mental') {
            ctx.fillStyle = p.mentalState === 'RED' ? '#ff718f' : (p.mentalState === 'YELLOW' ? '#ffd86b' : '#70f1c1');
            ctx.beginPath();
            ctx.arc(px + 10, py - 8, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Sanity Bar
        if (p.type === 'mental') {
            ctx.fillStyle = '#10233e';
            ctx.fillRect(px - 10, py - 18, 20, 4);
            ctx.fillStyle = p.color;
            ctx.fillRect(px - 9, py - 17, 18 * (p.sanity/100), 2);
        }
    });

    // Particles
    world.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.font = '700 18px "Audiowide"';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
    });

    ctx.restore();
}

function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    if (gameState === 'PLAYING') update(dt);
    draw();
    requestAnimationFrame(loop);
}

/**
 * §5 Input & UI
 */
let isDragging = false, startY = 0, startCameraY = 0, clickStartTime = 0;

function handleGlobalInput(e) {
    unlockAudio();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (e.type === 'pointerdown') {
        isDragging = true;
        startY = y;
        startCameraY = world.targetCameraY;
        clickStartTime = Date.now();
    } else if (e.type === 'pointermove') {
        if (isDragging) {
            const dy = y - startY;
            world.targetCameraY = startCameraY + dy;
            if (Math.abs(dy) > 10) clickStartTime = 0;
        }
    } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        isDragging = false;
        if (Date.now() - clickStartTime < 200 && clickStartTime !== 0) handleTap(x, y);
    }
}

function handleTap(x, y) {
    const worldY = y - world.cameraY;
    let clickedRoom = null;
    
    world.rooms.forEach(r => {
        const rw = (r.type === 'reception') ? 200 : ROOM_WIDTH;
        const rh = 80;
        if (x >= r.x - rw/2 && x <= r.x + rw/2 && worldY >= r.y - rh/2 && worldY <= r.y + rh/2) {
            clickedRoom = r;
        }
    });

    if (clickedRoom && clickedRoom.type !== 'reception') {
        world.selectedRoom = clickedRoom;
        openModal();
    } else {
        world.selectedRoom = null;
    }
}

// UI Updates
function updateUI() {
    document.getElementById('score-display').textContent = world.money;
    document.getElementById('level-display').textContent = world.rooms.length;
    document.getElementById('build-cost').textContent = `($${getBuildCost('general')})`;
    
    // Unlocks UI
    const lvl = world.rooms.length;
    const nextElem = document.getElementById('next-unlock');
    if (lvl < 25) nextElem.textContent = "Next: Calm Care (Lv 25)";
    else if (lvl < 28) nextElem.textContent = "Next: Calm Suite (Lv 28)";
    else nextElem.textContent = "";

    // Build Buttons
    if (world.paddedUnlocked) {
        document.getElementById('build-padded-btn').classList.remove('hidden');
        document.getElementById('build-padded-cost').textContent = `($${getBuildCost('padded')})`;
    }
}

function openModal() {
    const r = world.selectedRoom;
    const modal = document.getElementById('upgrade-modal');
    modal.classList.remove('hidden');
    document.getElementById('modal-title').textContent = r.type === 'padded' ? `Calm Suite ${r.floor}` : `Clinic ${r.floor}`;
    playSfx('modal_open', { throttleMs: 120 });
    updateModal();
    gameState = 'MODAL';
    setBgmState(false);
}

function updateModal() {
    const r = world.selectedRoom;
    document.getElementById('lvl-speed').textContent = r.levelSpeed;
    document.getElementById('cost-speed').textContent = `$${r.upgradeCostSpeed}`;
    document.getElementById('lvl-value').textContent = r.levelValue;
    document.getElementById('cost-value').textContent = `$${r.upgradeCostValue}`;
    
    document.getElementById('upgrade-speed-btn').style.opacity = world.money >= r.upgradeCostSpeed ? '1' : '0.5';
    document.getElementById('upgrade-value-btn').style.opacity = world.money >= r.upgradeCostValue ? '1' : '0.5';
}

function closeModal() {
    document.getElementById('upgrade-modal').classList.add('hidden');
    playSfx('modal_close', { throttleMs: 120 });
    world.selectedRoom = null;
    gameState = 'PLAYING';
    setBgmState(true);
}

// Bindings
// [agent-note][stage4] repaired: mobile-action-path | element: canvas input | action: scoped gameplay drag/tap handlers away from window so HUD/modal taps don't trigger world input behind UI
canvas.addEventListener('pointerdown', handleGlobalInput, { passive: false });
canvas.addEventListener('pointermove', handleGlobalInput, { passive: false });
canvas.addEventListener('pointerup', handleGlobalInput, { passive: false });
canvas.addEventListener('pointercancel', handleGlobalInput, { passive: false });

document.getElementById('build-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); buildRoom('general'); });
document.getElementById('build-padded-btn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); buildRoom('padded'); });
document.getElementById('upgrade-speed-btn').addEventListener('click', (e) => { e.stopPropagation(); upgradeRoom('speed'); });
document.getElementById('upgrade-value-btn').addEventListener('click', (e) => { e.stopPropagation(); upgradeRoom('value'); });
document.getElementById('close-modal-btn').addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });

// Resize
const ro = new ResizeObserver(entries => {
    const rect = entries[0].contentRect;
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    cw = rect.width; ch = rect.height;
    dpr = window.devicePixelRatio;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!initialized) initGame();
});
document.addEventListener('DOMContentLoaded', () => ro.observe(canvas));

</script>
