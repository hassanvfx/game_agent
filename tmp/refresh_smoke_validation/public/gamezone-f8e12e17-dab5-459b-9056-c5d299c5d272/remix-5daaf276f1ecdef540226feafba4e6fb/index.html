<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>METAL RUSH: FRONTIER PATROL</title>
    <!-- [agent-note][stage4] repaired-font: removed non-catalog remote font refs and kept approved local retro font asset -->
    <link href="assets/fonts.googleapis.com/css2-family_Black_Ops_One_family_Press_Start_2P_display_swap.css" rel="stylesheet">
    <style>
        /* Base Reset & Mobile Optimization */
        :root {
            --bg-deep: #08111f;
            --bg-mid: #102847;
            --bg-glow: #16d4ff;
            --panel-bg: rgba(7, 17, 33, 0.84);
            --panel-line: rgba(110, 233, 255, 0.42);
            --panel-edge: rgba(255, 209, 102, 0.7);
            --hero-glow: rgba(255, 213, 74, 0.35);
            --danger-glow: rgba(255, 94, 126, 0.28);
            --text-main: #f4fbff;
            --text-soft: #8cb8d9;
        }

        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            background:
                radial-gradient(circle at top, rgba(22, 212, 255, 0.12), transparent 35%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep) 65%);
            overflow: hidden;
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
            font-family: system-ui, sans-serif;
            color: var(--text-main);
        }

        * { box-sizing: border-box; }

        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-12 { width: 3rem; }
        .w-16 { width: 4rem; }
        .w-20 { width: 5rem; }
        .w-24 { width: 6rem; }
        .w-28 { width: 7rem; }
        .h-3 { height: 0.75rem; }
        .h-12 { height: 3rem; }
        .h-16 { height: 4rem; }
        .h-20 { height: 5rem; }
        .h-24 { height: 6rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .items-start { align-items: flex-start; }
        .items-end { align-items: flex-end; }
        .items-center { align-items: center; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .pt-8 { padding-top: 2rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-10 { margin-bottom: 2.5rem; }
        .mt-1 { margin-top: 0.25rem; }
        .bottom-6 { bottom: 1.5rem; }
        .right-6 { right: 1.5rem; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .border { border: 1px solid transparent; }
        .border-white { border-color: #fff; }
        .border-blue-400 { border-color: #60a5fa; }
        .border-green-400 { border-color: #4ade80; }
        .border-red-400 { border-color: #f87171; }
        .border-b-4 { border-bottom: 4px solid transparent; }
        .border-yellow-800 { border-bottom-color: #92400e; }
        .border-gray-400 { border-bottom-color: #9ca3af; }
        .bg-gray-800 { background: #1f2937; }
        .bg-green-500 { background: #22c55e; }
        .bg-yellow-600 { background: #ca8a04; }
        .bg-white { background: #fff; }
        .bg-blue-600 { background: #2563eb; }
        .bg-green-600 { background: #16a34a; }
        .bg-red-600 { background: #dc2626; }
        .text-white { color: #fff; }
        .text-black { color: #000; }
        .text-yellow-400 { color: #facc15; }
        .text-yellow-500 { color: #eab308; }
        .text-gray-400 { color: #9ca3af; }
        .text-cyan-400 { color: #22d3ee; }
        .text-red-600 { color: #dc2626; }
        .text-5xl { font-size: clamp(2.5rem, 9vw, 3.75rem); line-height: 0.95; }
        .text-4xl { font-size: clamp(2rem, 8vw, 3rem); line-height: 1; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-\[10px\] { font-size: 10px; }
        .tracking-tighter { letter-spacing: -0.04em; }
        .tracking-widest { letter-spacing: 0.18em; }
        .uppercase { text-transform: uppercase; }
        .drop-shadow-lg { filter: drop-shadow(0 10px 8px rgba(0,0,0,0.45)); }
        .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
        .object-contain { object-fit: contain; }
        .pixelated { image-rendering: pixelated; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .z-50 { z-index: 50; }
        .safe-area-top { padding-top: max(2rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
        .pr-safe { padding-right: max(0px, env(safe-area-inset-right)); }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        button { font-family: 'Press Start 2P', system-ui, sans-serif; font-size: inherit; cursor: pointer; }

        /* Game Canvas */
        canvas {
            display: block;
            image-rendering: pixelated; /* Sharp pixels */
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* UI Layer */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
        
        .pixel-text { text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.9), 0 0 10px rgba(34, 211, 238, 0.15); }
        .title-font { font-family: 'Press Start 2P', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }

        #game-container {
            touch-action: none;
        }

        #game-container::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 213, 74, 0.12), transparent 20%),
                radial-gradient(circle at 82% 24%, rgba(22, 212, 255, 0.14), transparent 22%),
                linear-gradient(180deg, rgba(255,255,255,0.03), transparent 30%);
            z-index: 1;
        }

        #hud {
            position: relative;
            z-index: 60;
        }

        #hud > div {
            background: var(--panel-bg);
            border: 1px solid var(--panel-line);
            border-radius: 0.75rem;
            padding: 0.45rem 0.55rem;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 10px 24px rgba(0,0,0,0.24);
            backdrop-filter: blur(4px);
        }

        #hud .text-xs,
        #hud .text-\[10px\] {
            line-height: 1.4;
        }

        #hp-bar {
            background: linear-gradient(90deg, #34d399, #fde047 60%, #fb7185);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.35);
        }

        /* Controls */
        .control-btn {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(11, 24, 43, 0.88));
            border: 2px solid rgba(255,255,255,0.24);
            box-shadow: 0 6px 0 rgba(0,0,0,0.4), 0 0 16px rgba(34, 211, 238, 0.14);
            border-radius: 50%;
            touch-action: none;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 10px;
            pointer-events: auto;
            backdrop-filter: blur(6px);
            transition: transform 0.05s, background 0.1s, box-shadow 0.15s ease, filter 0.15s ease;
        }
        .control-btn:active { transform: translateY(4px) scale(0.98); box-shadow: 0 0 0 rgba(0,0,0,0.5); background: rgba(255,255,255,0.3); filter: brightness(1.1); }
        
        /* Joystick - Fixed Bottom Left */
        #joystick-zone {
            position: absolute; 
            bottom: max(20px, env(safe-area-inset-bottom)); 
            left: max(20px, env(safe-area-inset-left));
            width: 120px; height: 120px;
            background: radial-gradient(circle at center, rgba(22, 212, 255, 0.12), rgba(0,0,0,0.24));
            border: 2px solid rgba(110, 233, 255, 0.16);
            border-radius: 50%;
            pointer-events: auto;
            z-index: 100;
            box-shadow: inset 0 0 20px rgba(22, 212, 255, 0.08), 0 8px 24px rgba(0,0,0,0.26);
        }
        #joystick-knob {
            position: absolute; width: 50px; height: 50px;
            background: radial-gradient(circle at 30% 30%, #ffe27a, #f59e0b);
            border: 3px solid #b45309;
            border-radius: 50%;
            top: 35px; left: 35px;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4), 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(22, 212, 255, 0.16), transparent 35%),
                linear-gradient(180deg, rgba(6, 13, 28, 0.92), rgba(5, 10, 22, 0.98));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            padding: 1.25rem;
        }
        .hidden { display: none !important; }
        
        .ui-copy {
            font-family: system-ui, sans-serif;
            letter-spacing: 0.08em;
        }

        .feedback-overlay {
            position: absolute;
            top: max(0.75rem, env(safe-area-inset-top));
            right: max(0.75rem, env(safe-area-inset-right));
            width: min(34vw, 8rem);
            padding: 0.35rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(7, 17, 33, 0.72);
            box-shadow: 0 10px 24px rgba(0,0,0,0.24);
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
            z-index: 85;
        }

        .feedback-overlay.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-overlay img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.55rem;
            display: block;
        }

        .feedback-caption {
            margin-top: 0.3rem;
            text-align: center;
            color: #d7f7ff;
            font-size: 0.68rem;
        }

        .status-chip {
            position: absolute;
            left: max(0.75rem, env(safe-area-inset-left));
            bottom: calc(max(96px, env(safe-area-inset-bottom)) + 4.75rem);
            max-width: min(48vw, 12rem);
            padding: 0.45rem 0.6rem;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(7, 17, 33, 0.84);
            color: #dff9ff;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 82;
        }

        .status-chip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Char Select Cards */
        .char-card {
            transition: all 0.2s ease;
            border: 3px solid rgba(110, 233, 255, 0.14);
            background: linear-gradient(180deg, rgba(18, 37, 66, 0.9), rgba(8, 16, 30, 0.95));
            box-shadow: 0 8px 20px rgba(0,0,0,0.28);
            min-width: 0;
        }
        .char-card.selected {
            border-color: #fbbf24;
            background: linear-gradient(180deg, rgba(43, 66, 102, 0.95), rgba(15, 31, 58, 0.98));
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 0 0 1px rgba(255, 213, 74, 0.28), 0 12px 24px rgba(0,0,0,0.35), 0 0 18px rgba(251, 191, 36, 0.18);
        }

        .mission-subtitle {
            color: var(--text-soft);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.9rem;
            padding: 0.35rem 0.55rem;
            border: 1px solid rgba(110, 233, 255, 0.32);
            border-radius: 999px;
            background: rgba(8, 17, 31, 0.7);
            color: #9ae6ff;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            box-shadow: 0 0 16px rgba(22, 212, 255, 0.12);
        }

        .hero-badge::before {
            content: "★";
            color: #ffd54a;
            font-size: 0.8rem;
        }

        .screen-panel {
            width: min(100%, 28rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 1rem 1.2rem;
            border-radius: 1.25rem;
            border: 1px solid rgba(110, 233, 255, 0.22);
            background: linear-gradient(180deg, rgba(10, 21, 40, 0.82), rgba(5, 10, 22, 0.92));
            box-shadow: 0 14px 36px rgba(0,0,0,0.4);
        }

        .screen-actions {
            width: min(100%, 18rem);
        }

        .screen-btn {
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.22);
            border-left: 1px solid rgba(255,255,255,0.18);
            border-right: 1px solid rgba(0,0,0,0.35);
            background: linear-gradient(180deg, #ffd54a, #d97706);
            color: #08111f;
            box-shadow: 0 6px 0 #92400e, 0 0 18px rgba(251, 191, 36, 0.18);
        }

        .screen-btn.alt {
            background: linear-gradient(180deg, #ecf8ff, #b6d8ea);
            box-shadow: 0 6px 0 #64748b;
        }

        .preview-frame {
            position: relative;
            padding: 0.25rem;
            border-radius: 0.9rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(10,18,30,0.45));
        }

        .preview-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }

        /* CRT Scanlines */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            position: absolute; inset: 0; z-index: 40;
            opacity: 0.65;
        }

        @media (max-width: 480px) {
            .screen-panel {
                width: min(100%, 22rem);
                padding: 0.9rem 0.8rem 1rem;
            }

            .hero-badge {
                font-size: 0.62rem;
            }

            .char-card {
                padding: 0.65rem;
            }
        }
    </style>
</head>
<body>

<div id="game-container" class="relative w-full h-full">
    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="z-50">
        
        <!-- HUD -->
        <div id="hud" class="hidden w-full p-4 pt-8 flex justify-between items-start safe-area-top">
            <div class="flex flex-col gap-1">
                <div class="pixel-text text-yellow-400 text-xs">SECTOR SCORE <span id="score-display">0</span></div>
                <div class="w-28 h-3 bg-gray-800 border border-white relative mt-1">
                    <div id="hp-bar" class="h-full bg-green-500 w-full transition-all duration-100"></div>
                </div>
            </div>
            <div class="flex flex-col items-end gap-1">
                <div id="weapon-name" class="pixel-text text-cyan-400 text-xs">SIDEARM</div>
                <div id="ammo-display" class="pixel-text text-white text-[10px]">INF</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <div class="screen-panel">
                <div class="hero-badge">Neon Patrol Unit</div>
                <h1 class="text-5xl text-yellow-500 mb-2 title-font text-center drop-shadow-lg tracking-tighter">FRONTIER<br>RUSH</h1>
                <p class="mission-subtitle text-[10px] mb-8 tracking-widest uppercase text-center">Patrol Strike Edition</p>
                
                <div class="flex gap-6 mb-10">
                    <!-- Generated dynamically -->
                    <button class="char-card p-3 flex flex-col items-center gap-2 rounded-lg" onclick="selectChar(0)" id="char-btn-0">
                        <div class="preview-frame">
                            <img id="preview-0" class="w-16 h-24 object-contain pixelated" />
                        </div>
                        <span class="text-[10px] text-white font-bold">SCOUT</span>
                    </button>
                    <button class="char-card p-3 flex flex-col items-center gap-2 rounded-lg" onclick="selectChar(1)" id="char-btn-1">
                        <div class="preview-frame">
                            <img id="preview-1" class="w-16 h-24 object-contain pixelated" />
                        </div>
                        <span class="text-[10px] text-white font-bold">RANGER</span>
                    </button>
                </div>

                <div class="screen-actions">
                    <button id="start-btn" class="screen-btn px-8 py-4 border-b-4 border-yellow-800 text-xs rounded animate-pulse font-bold">START PATROL</button>
                </div>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="screen hidden">
            <div class="screen-panel">
                <div class="hero-badge">Signal Lost</div>
                <h2 class="text-4xl text-red-600 mb-4 title-font text-center">PATROL DOWN</h2>
                <div class="text-white mb-8 text-sm text-center">SECTOR SCORE: <span id="final-score">0</span></div>
                <div class="screen-actions">
                    <button id="restart-btn" class="screen-btn alt px-6 py-3 border-b-4 border-gray-400 text-black text-xs font-bold rounded">RUN IT BACK</button>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <!-- [agent-note][stage3] resolved-gif: combat-hit + game-over reaction overlays from catalogs/gifs.json -->
        <div id="feedback-overlay" class="feedback-overlay" aria-hidden="true">
            <img id="feedback-gif" src="https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp" alt="Combat feedback reaction">
            <div id="feedback-caption" class="feedback-caption ui-copy">Impact spike</div>
        </div>

        <div id="status-chip" class="status-chip ui-copy" aria-live="polite">AUDIO ONLINE</div>

        <div id="mobile-controls" class="hidden w-full h-full pointer-events-none absolute inset-0">
            <!-- Joystick Zone (Bottom Left) -->
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
            
            <!-- Action Buttons (Bottom Right) -->
            <div class="absolute bottom-6 right-6 flex gap-4 items-end pointer-events-auto pb-safe pr-safe">
                <button id="btn-swap" class="control-btn w-12 h-12 bg-blue-600 border-blue-400 mb-2">KIT</button>
                <button id="btn-jump" class="control-btn w-16 h-16 bg-green-600 border-green-400">JUMP</button>
                <button id="btn-fire" class="control-btn w-20 h-20 bg-red-600 border-red-400">FIRE</button>
            </div>
        </div>
    </div>
</div>

<script>
/*
   FRONTIER RUSH: PATROL STRIKE
   Mobile-first side-scrolling patrol run.
*/

// --- 1. CONFIGURATION ---
const CONFIG = {
    renderWidth: 360, // Wider internal resolution for better detail
    gravity: 1500,
    heroSpeed: 180,
    jumpForce: 550, // Higher jump for bigger characters
    floorY: 0,
    scale: 2 // Global visual scale for entities (Big Pixels)
};

const PALETTE = {
    skyTop: '#08111f', skyBot: '#163768',
    grass: '#0f766e', dirt: '#3b2a19',
    skin: '#fca5a5',
    red: '#ff5e7e', blue: '#38bdf8', yellow: '#ffd54a', white: '#ffffff', black: '#000000',
    grey: '#4b5563', darkGrey: '#1f2937',
    glowCyan: '#67e8f9', glowGold: '#fcd34d', neonMint: '#5eead4'
};

const WEAPONS = [
    { name: 'SIDEARM', auto: false, delay: 250, speed: 500, color: '#fbbf24', size: 4, ammo: -1, dmg: 10 },
    { name: 'AUTO',    auto: true,  delay: 90,  speed: 550, color: '#f59e0b', size: 5, ammo: 150, dmg: 6 },
    { name: 'BURST',   auto: false, delay: 600, speed: 400, color: '#ef4444', size: 6, ammo: 30, count: 6, spread: 0.25, dmg: 15 },
    { name: 'BEAM',    auto: true,  delay: 60,  speed: 800, color: '#06b6d4', size: 3, ammo: 80, dmg: 12 }
];

let state = {
    mode: 'START',
    time: 0,
    score: 0,
    camera: { x: 0, y: 0 },
    shake: 0,
    entities: [],
    particles: [],
    platforms: [],
    nextSpawnX: 0,
    selectedCharIdx: 0
};

let player = null;
let sprites = {};
let ctx, canvas;
let feedbackTimer = 0;
let statusTimer = 0;

const AUDIO_TRACKS = {
    jump: 'https://gamezone-virid.vercel.app/assets/audios/sfx/jump_01.mp3',
    land: 'https://gamezone-virid.vercel.app/assets/audios/sfx/land_02.mp3',
    shoot: 'https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_02.mp3',
    enemyHit: 'https://gamezone-virid.vercel.app/assets/audios/sfx/enemy_hit_01.mp3',
    damage: 'https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3',
    explosion: 'https://gamezone-virid.vercel.app/assets/audios/sfx/explosion_01.mp3',
    uiClick: 'https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3',
    start: 'https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3',
    gameOver: 'https://gamezone-virid.vercel.app/assets/audios/ui/game_over_01.mp3',
    bgm: 'https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3'
};

const GIF_TRACKS = {
    hit: {
        src: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp',
        label: 'Impact spike'
    },
    gameOver: {
        src: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp',
        label: 'Patrol down'
    }
};

// --- 2. ASSET GENERATION (High Res Pixel Art) ---

function createPixelCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
}

function generateSprite(w, h, map, colors) {
    const c = createPixelCanvas(w, h);
    const x = c.getContext('2d');
    for(let i=0; i<map.length; i++) {
        const char = map[i];
        if(char !== '.') {
            const col = i % w;
            const row = Math.floor(i / w);
            x.fillStyle = colors[char] || '#f0f';
            x.fillRect(col, row, 1, 1);
        }
    }
    return c;
}

function initSprites() {
    // 1. Player (Marco/Tarma) - 16x24 (Bigger Base)
    // r=red, s=skin, w=white, g=green, b=black, y=yellow, d=darkgreen
    const pTemplate = (hair, band, pants) => {
        let s = "";
        // Head (6 rows)
        s += "....." + band + band + band + band + band + "......";
        s += "...." + band + band + band + band + band + band + band + "....";
        s += "...." + hair + hair + "ssss" + hair + "....";
        s += "...." + hair + "ssssss" + hair + "....";
        s += ".....ssssss.....";
        s += ".....ssssss.....";
        // Torso (8 rows)
        s += "....wwwwww......";
        s += "...wwwwwwww.....";
        s += "..bwwwwwwwwb....";
        s += "..bwwwwwwwwb....";
        s += "..wwwwwwwwww....";
        s += "..wwwwwwwwww....";
        s += "..bbwwwwwwbb...."; // Belt
        s += "..bbwwwwwwbb....";
        // Legs (6 rows)
        s += "..."+pants+pants+pants+pants+pants+pants+"....";
        s += "..."+pants+pants+pants+pants+pants+pants+"....";
        s += "..."+pants+pants+".."+pants+pants+"....";
        s += "..."+pants+pants+".."+pants+pants+"....";
        s += "..."+pants+pants+".."+pants+pants+"....";
        s += "..."+pants+pants+".."+pants+pants+"....";
        // Boots (4 rows)
        s += "...bb....bb.....";
        s += "...bb....bb.....";
        s += ".bbbb....bbbb...";
        s += ".bbbb....bbbb...";
        return s;
    };

    // Marco: Red Bandana, Blond Hair, Green Pants
    sprites.marco = generateSprite(16, 24, pTemplate('y', 'r', 'g'), {
        r: '#ef4444', y: '#fcd34d', s: PALETTE.skin, w: '#f8fafc', g: '#15803d', b: '#1e293b'
    });

    // Tarma: Blue Bandana, Brown Hair, Camo Pants
    sprites.tarma = generateSprite(16, 24, pTemplate('o', 'u', 'd'), {
        u: '#3b82f6', o: '#78350f', s: PALETTE.skin, w: '#f1f5f9', d: '#3f6212', b: '#1e293b'
    });

    // Soldier: 16x24
    const sMap = 
        ".....ggggg......" +
        "....ggggggg....." +
        "....ggggggg....." +
        "....vvvvvvv....." + // Visor
        "....sssssss....." +
        "....sssssss....." +
        "....uuuuuuu....." +
        "...uuuuuuuuu...." +
        "..buuuuuuuuub..." +
        "..buuuuuuuuub..." +
        "..uuuuuuuuuu...." +
        "..uuuuuuuuuu...." +
        "..bbuuuuuubb...." +
        "..bbuuuuuubb...." +
        "...gggggggg....." +
        "...gggggggg....." +
        "...ggg..ggg....." +
        "...ggg..ggg....." +
        "...ggg..ggg....." +
        "...ggg..ggg....." +
        "...bb....bb....." +
        "...bb....bb....." +
        ".bbbb....bbbb..." +
        ".bbbb....bbbb...";
    sprites.soldier = generateSprite(16, 24, sMap, {
        g: '#3f6212', v: '#000', s: PALETTE.skin, u: '#4b5563', b: '#111'
    });

    // Tank: 32x24 (Wide)
    let tMap = "";
    for(let y=0; y<24; y++) {
        for(let x=0; x<32; x++) {
            if(y < 8 && x > 10 && x < 22) tMap += "g"; // Turret
            else if (y === 8 && x > 14 && x < 32) tMap += "b"; // Barrel
            else if (y > 8 && y < 18) tMap += "G"; // Body
            else if (y >= 18) { // Treads
                tMap += (x%4===0 || y===18 || y===23) ? "b" : "d"; 
            } else tMap += ".";
        }
    }
    sprites.tank = generateSprite(32, 24, tMap, {
        g: '#374151', G: '#4b5563', b: '#000', d: '#9ca3af'
    });

    // Environment
    const platC = createPixelCanvas(16, 16);
    const px = platC.getContext('2d');
    px.fillStyle = '#334155'; px.fillRect(0,0,16,16);
    px.fillStyle = '#0f172a'; px.fillRect(0,0,16,2); px.fillRect(0,14,16,2); // Bevel
    px.fillStyle = '#94a3b8'; px.fillRect(0,0,2,16); px.fillRect(14,0,2,16); // Bolts
    sprites.platform = platC;

    const gC = createPixelCanvas(16, 16);
    const gx = gC.getContext('2d');
    gx.fillStyle = '#78350f'; gx.fillRect(0,0,16,16);
    gx.fillStyle = '#16a34a'; gx.fillRect(0,0,16,6); // Grass
    gx.fillStyle = '#14532d'; gx.fillRect(0,5,16,2); // Shadow
    sprites.ground = gC;
}

function generatePreviews() {
    // Render sprites to data URLs for the start screen
    const makePreview = (sprite) => {
        const c = document.createElement('canvas');
        c.width = sprite.width * 4;
        c.height = sprite.height * 4;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprite, 0, 0, c.width, c.height);
        return c.toDataURL();
    };
    document.getElementById('preview-0').src = makePreview(sprites.marco);
    document.getElementById('preview-1').src = makePreview(sprites.tarma);
}

// --- 3. AUDIO SYSTEM ---
const Audio = {
    enabled: false,
    initialized: false,
    buffers: new Map(),
    channels: new Map(),
    bgm: null,
    lastPlayed: {},
    init: () => {
        if (Audio.initialized) {
            Audio.resume();
            return;
        }
        Audio.initialized = true;
        Audio.enabled = true;
        Audio.primeChannel('jump', AUDIO_TRACKS.jump, 0.35);
        Audio.primeChannel('land', AUDIO_TRACKS.land, 0.22);
        Audio.primeChannel('shoot', AUDIO_TRACKS.shoot, 0.18);
        Audio.primeChannel('enemyHit', AUDIO_TRACKS.enemyHit, 0.28);
        Audio.primeChannel('damage', AUDIO_TRACKS.damage, 0.3);
        Audio.primeChannel('explosion', AUDIO_TRACKS.explosion, 0.32);
        Audio.primeChannel('uiClick', AUDIO_TRACKS.uiClick, 0.28);
        Audio.primeChannel('start', AUDIO_TRACKS.start, 0.32);
        Audio.primeChannel('gameOver', AUDIO_TRACKS.gameOver, 0.34);
        Audio.bgm = new Audio(AUDIO_TRACKS.bgm);
        Audio.bgm.loop = true;
        Audio.bgm.preload = 'auto';
        Audio.bgm.volume = 0.18;
    },
    primeChannel: (key, src, volume) => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        Audio.channels.set(key, audio);
    },
    safePlay: (key, cooldown = 0) => {
        if (!Audio.enabled) return;
        const now = performance.now();
        if (cooldown && Audio.lastPlayed[key] && now - Audio.lastPlayed[key] < cooldown) return;
        Audio.lastPlayed[key] = now;
        const base = Audio.channels.get(key);
        if (!base) return;
        try {
            const clone = base.cloneNode();
            clone.volume = base.volume;
            const playPromise = clone.play();
            if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        } catch (_) {}
    },
    playLoop: () => {
        if (!Audio.enabled || !Audio.bgm) return;
        try {
            const playPromise = Audio.bgm.play();
            if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
        } catch (_) {}
    },
    stopLoop: () => {
        if (!Audio.bgm) return;
        try {
            Audio.bgm.pause();
            Audio.bgm.currentTime = 0;
        } catch (_) {}
    },
    pauseLoop: () => {
        if (!Audio.bgm) return;
        try { Audio.bgm.pause(); } catch (_) {}
    },
    resume: () => {
        if (!Audio.enabled) return;
        Audio.playLoop();
    },
    uiClick: () => Audio.safePlay('uiClick', 60),
    start: () => Audio.safePlay('start', 100),
    jump: () => Audio.safePlay('jump', 120),
    land: () => Audio.safePlay('land', 80),
    shoot: () => Audio.safePlay('shoot', 50),
    enemyHit: () => Audio.safePlay('enemyHit', 70),
    damage: () => Audio.safePlay('damage', 180),
    explode: () => Audio.safePlay('explosion', 120),
    gameOver: () => Audio.safePlay('gameOver', 250)
};

// --- 4. GAME ENGINE ---

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d', { alpha: false });
    
    const resize = () => {
        const aspect = window.innerHeight / window.innerWidth;
        canvas.width = CONFIG.renderWidth;
        canvas.height = CONFIG.renderWidth * aspect;
        CONFIG.floorY = canvas.height - 40;
        ctx.imageSmoothingEnabled = false;
    };
    window.addEventListener('resize', resize);
    resize();

    initSprites();
    generatePreviews();
    setupControls();
    
    // Default char selection
    selectChar(0);

    let lastTime = 0;
    const loop = (timestamp) => {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
}

// Global char selection
window.selectChar = (idx) => {
    state.selectedCharIdx = idx;
    Audio.uiClick();
    showStatus(idx === 0 ? 'SCOUT LINKED' : 'RANGER LINKED', 700);
    document.querySelectorAll('.char-card').forEach((btn, i) => {
        if(i === idx) btn.classList.add('selected');
        else btn.classList.remove('selected');
    });
};

const input = { x: 0, jump: false, fire: false };

function setupControls() {
    // Joystick
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    let joyStart = { x:0, y:0 };
    let dragging = false;
    
    const handleJoy = (x, y) => {
        const dx = x - joyStart.x;
        const dy = y - joyStart.y;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
        const angle = Math.atan2(dy, dx);
        
        const kx = Math.cos(angle) * dist;
        const ky = Math.sin(angle) * dist;
        knob.style.transform = `translate(${kx}px, ${ky}px)`;
        
        // Deadzone
        input.x = kx / 35;
        if(Math.abs(input.x) < 0.2) input.x = 0;
    };

    zone.addEventListener('touchstart', e => {
        e.preventDefault();
        dragging = true;
        const t = e.touches[0];
        joyStart = { x: t.clientX, y: t.clientY };
        knob.style.transition = 'none';
    }, {passive:false});
    
    zone.addEventListener('touchmove', e => {
        e.preventDefault();
        if(!dragging) return;
        const t = e.touches[0];
        handleJoy(t.clientX, t.clientY);
    }, {passive:false});
    
    const endJoy = (e) => {
        e.preventDefault();
        dragging = false;
        input.x = 0;
        knob.style.transform = `translate(0px, 0px)`;
        knob.style.transition = 'transform 0.1s';
    };
    zone.addEventListener('touchend', endJoy);
    zone.addEventListener('touchcancel', endJoy);
    
    // Buttons
    const bind = (id, k) => {
        const b = document.getElementById(id);
        b.addEventListener('touchstart', e => { 
            e.preventDefault(); 
            if(k === 'swap') swapWeapon();
            else input[k] = true; 
            b.style.transform = "scale(0.9)";
        }, {passive:false});
        b.addEventListener('touchend', e => { 
            e.preventDefault(); 
            if(k !== 'swap') input[k] = false; 
            b.style.transform = "scale(1)";
        });
    };
    bind('btn-jump', 'jump');
    bind('btn-fire', 'fire');
    bind('btn-swap', 'swap');
}

function showFeedback(type, duration = 900) {
    const overlay = document.getElementById('feedback-overlay');
    const gif = document.getElementById('feedback-gif');
    const caption = document.getElementById('feedback-caption');
    const picked = GIF_TRACKS[type];
    if (!overlay || !gif || !caption || !picked) return;
    gif.src = picked.src;
    caption.textContent = picked.label;
    overlay.classList.add('visible');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => overlay.classList.remove('visible'), duration);
}

function showStatus(text, duration = 1200) {
    const chip = document.getElementById('status-chip');
    if (!chip) return;
    chip.textContent = text;
    chip.classList.add('visible');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => chip.classList.remove('visible'), duration);
}

function startGame() {
    Audio.init();
    Audio.start();
    Audio.playLoop();
    showStatus('PATROL LIVE', 1100);
    state.mode = 'PLAY';
    state.score = 0;
    state.entities = [];
    state.particles = [];
    state.platforms = [];
    state.camera.x = 0;
    state.nextSpawnX = 0;
    
    // Player Init (32x48 Logic Size)
    player = {
        x: 50, y: 0, 
        w: 32, h: 48, // 2x Scale of 16x24
        vx: 0, vy: 0,
        hp: 100, maxHp: 100,
        grounded: false,
        facing: 1,
        weaponIdx: 0,
        ammo: -1,
        lastFire: 0,
        invuln: 0,
        sprite: state.selectedCharIdx === 0 ? sprites.marco : sprites.tarma
    };
    
    generateLevel(600);

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('mobile-controls').classList.remove('hidden');
    updateHUD();
}

function swapWeapon() {
    if(state.mode !== 'PLAY') return;
    player.weaponIdx = (player.weaponIdx + 1) % WEAPONS.length;
    const w = WEAPONS[player.weaponIdx];
    player.ammo = w.ammo;
    Audio.uiClick();
    showStatus(`${w.name} READY`, 900);
    updateHUD();
}

function updateHUD() {
    document.getElementById('score-display').textContent = Math.floor(state.score);
    const hpPct = Math.max(0, player.hp);
    const hpBar = document.getElementById('hp-bar');
    hpBar.style.width = `${hpPct}%`;
    hpBar.style.filter = hpPct < 35 ? 'saturate(1.2) brightness(1.05)' : 'none';
    const w = WEAPONS[player.weaponIdx];
    const wn = document.getElementById('weapon-name');
    wn.textContent = w.name;
    wn.style.color = w.color;
    wn.style.textShadow = `0 0 12px ${w.color}`;
    document.getElementById('ammo-display').textContent = player.ammo < 0 ? 'INF' : player.ammo;
}

// --- 5. GAME LOGIC ---

function generateLevel(lookAheadX) {
    while(state.nextSpawnX < lookAheadX) {
        // Gap logic
        if(Math.random() > 0.85 && state.nextSpawnX > 300) {
            state.nextSpawnX += 60 + Math.random() * 50;
        }
        
        const w = 100 + Math.random() * 150;
        // Ground
        state.platforms.push({
            x: state.nextSpawnX,
            y: CONFIG.floorY,
            w: w, h: 40,
            type: 'ground'
        });

        // Elevated Platforms
        if(Math.random() > 0.3) {
            const pw = 60 + Math.random() * 60;
            const ph = 40 + Math.random() * 50;
            const px = state.nextSpawnX + Math.random() * (w - pw);
            state.platforms.push({
                x: px,
                y: CONFIG.floorY - ph,
                w: pw, h: 16,
                type: 'plat'
            });
            
            if(Math.random() > 0.5) spawnEnemy(px + pw/2, CONFIG.floorY - ph - 48, true);
        } else {
            if(Math.random() > 0.4) spawnEnemy(state.nextSpawnX + w/2, CONFIG.floorY - 48, false);
        }

        state.nextSpawnX += w;
    }
}

function spawnEnemy(x, y, patrol) {
    const isTank = Math.random() > 0.85;
    const e = {
        type: isTank ? 'TANK' : 'SOLDIER',
        x: x, y: y,
        w: isTank ? 64 : 32, h: 48, // 2x Scale
        vx: 0, vy: 0,
        hp: isTank ? 120 : 30,
        patrolOrigin: x,
        patrolRadius: patrol ? 30 : 80,
        facing: -1,
        lastFire: 0,
        sprite: isTank ? sprites.tank : sprites.soldier
    };
    if(isTank) e.y = y + 0; // Adjust if needed
    state.entities.push(e);
}

let wasGrounded = false;

function update(dt) {
    if(state.mode !== 'PLAY') return;

    // Camera
    const targetCam = player.x - CONFIG.renderWidth * 0.25;
    state.camera.x += (targetCam - state.camera.x) * 4 * dt;
    if(state.camera.x < 0) state.camera.x = 0;
    
    generateLevel(state.camera.x + CONFIG.renderWidth + 300);

    // Player Physics
    const prevY = player.y;
    player.vx = input.x * CONFIG.heroSpeed;
    player.vy += CONFIG.gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    
    if(input.x !== 0) player.facing = Math.sign(input.x);

    // Collisions
    player.grounded = false;
    for(const p of state.platforms) {
        if(player.x + player.w*0.5 > p.x && player.x + player.w*0.5 < p.x + p.w) {
            if(prevY + player.h <= p.y + 5 && player.y + player.h >= p.y) {
                if(player.vy > 0) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        }
    }
    
    if(player.grounded && !wasGrounded) {
        Audio.land();
    }

    if(input.jump && player.grounded) {
        player.vy = -CONFIG.jumpForce;
        player.grounded = false;
        Audio.jump();
    }
    
    if(player.y > canvas.height + 100) hurtPlayer(200);

    // Shooting
    if(input.fire && state.time - player.lastFire > WEAPONS[player.weaponIdx].delay/1000) {
        if(player.ammo !== 0) {
            fireBullet(player, WEAPONS[player.weaponIdx]);
            player.lastFire = state.time;
            if(player.ammo > 0) player.ammo--;
            updateHUD();
        }
    }
    state.time += dt;

    wasGrounded = player.grounded;

    updateEntities(dt);

    // Cleanup
    state.platforms = state.platforms.filter(p => p.x + p.w > state.camera.x - 100);
    if(state.shake > 0) state.shake -= dt * 2;
}

function updateEntities(dt) {
    for(let i=state.entities.length-1; i>=0; i--) {
        const e = state.entities[i];
        
        if(e.type === 'BULLET') {
            e.x += e.vx * dt;
            e.y += e.vy * dt;
            e.life -= dt;
            
            if(e.isPlayer) {
                for(let j=state.entities.length-1; j>=0; j--) {
                    const t = state.entities[j];
                    if(t.type === 'SOLDIER' || t.type === 'TANK') {
                        if(rectIntersect(e, t)) {
                            t.hp -= e.dmg;
                            e.life = 0;
                            Audio.enemyHit();
                            spawnParticle(e.x, e.y, '#fff', 4);
                            if(t.hp <= 0) killEnemy(t, j);
                            break;
                        }
                    }
                }
            } else {
                if(rectIntersect(e, player)) {
                    hurtPlayer(10);
                    e.life = 0;
                }
            }
            if(e.life <= 0) state.entities.splice(i, 1);
        } 
        else if(e.type === 'SOLDIER' || e.type === 'TANK') {
            // AI
            if(e.x > e.patrolOrigin + e.patrolRadius) { e.vx = -40; e.facing = -1; }
            else if(e.x < e.patrolOrigin - e.patrolRadius) { e.vx = 40; e.facing = 1; }
            else if(e.vx === 0) e.vx = 40;
            
            e.x += e.vx * dt;
            
            const dist = Math.abs(player.x - e.x);
            if(dist < 200 && state.time - e.lastFire > 1.5) {
                e.facing = player.x < e.x ? -1 : 1;
                state.entities.push({
                    type: 'BULLET', x: e.x + e.w/2, y: e.y + e.h/3,
                    vx: e.facing * 200, vy: 0,
                    w: 6, h: 6, color: '#f00', life: 2, isPlayer: false
                });
                e.lastFire = state.time;
            }
            
            if(e.x < state.camera.x - 150) state.entities.splice(i, 1);
        }
    }
    
    for(let i=state.particles.length-1; i>=0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if(p.life <= 0) state.particles.splice(i, 1);
    }
    
    if(player.invuln > 0) player.invuln -= dt;
}

function fireBullet(actor, weapon) {
    const count = weapon.count || 1;
    Audio.shoot();
    showFeedback('hit', 420);
    
    for(let i=0; i<count; i++) {
        const spread = weapon.spread ? (Math.random()-0.5)*weapon.spread*150 : 0;
        state.entities.push({
            type: 'BULLET',
            x: actor.x + (actor.facing===1 ? actor.w : 0),
            y: actor.y + actor.h/2 - 4,
            vx: actor.facing * weapon.speed,
            vy: spread,
            w: weapon.size * 1.5, h: weapon.size * 1.5,
            color: weapon.color,
            life: 0.8,
            dmg: weapon.dmg,
            isPlayer: true
        });
    }
}

function hurtPlayer(dmg) {
    if(player.invuln > 0 || state.mode !== 'PLAY') return;
    player.hp -= dmg;
    player.invuln = 1.0;
    state.shake = 0.4;
    Audio.damage();
    showStatus(player.hp > 0 ? 'ARMOR HIT' : 'CRITICAL LOSS', 950);
    updateHUD();
    
    if(player.hp <= 0) {
        state.mode = 'GAMEOVER';
        Audio.explode();
        Audio.gameOver();
        Audio.stopLoop();
        showFeedback('gameOver', 1800);
        document.getElementById('final-score').textContent = Math.floor(state.score);
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('mobile-controls').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
    }
}

function killEnemy(e, idx) {
    state.entities.splice(idx, 1);
    state.score += (e.type === 'TANK' ? 500 : 100);
    Audio.explode();
    spawnExplosion(e.x + e.w/2, e.y + e.h/2);
    updateHUD();
}

function spawnParticle(x, y, c, count) {
    for(let i=0; i<count; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*150, vy: (Math.random()-0.5)*150,
            life: 0.3 + Math.random()*0.3, color: c
        });
    }
}

function spawnExplosion(x, y) {
    state.shake = 0.5;
    spawnParticle(x, y, '#f59e0b', 15);
    spawnParticle(x, y, '#ef4444', 15);
    spawnParticle(x, y, '#fff', 8);
}

function rectIntersect(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

// --- 6. RENDERER ---

function draw() {
    ctx.fillStyle = '#1e3a8a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    drawBackground();

    ctx.save();
    let sx = (Math.random()-0.5) * state.shake * 15;
    let sy = (Math.random()-0.5) * state.shake * 15;
    ctx.translate(-state.camera.x + sx, sy);

    // Platforms
    for(const p of state.platforms) {
        const sprite = p.type === 'ground' ? sprites.ground : sprites.platform;
        const tilesX = Math.ceil(p.w / 16);
        for(let i=0; i<tilesX; i++) {
            const dw = (i === tilesX-1) ? (p.w % 16 || 16) : 16;
            ctx.drawImage(sprite, 0, 0, dw, 16, p.x + i*16, p.y, dw, 16);
        }
    }

    // Entities (Draw scaled 2x to hit logic size)
    for(const e of state.entities) {
        if(e.type === 'BULLET') {
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x, e.y, e.w, e.h);
        } else {
            // Draw logic: sprite is 16x24, entity is 32x48
            // We draw the sprite scaled up to fit entity w/h
            drawSprite(e.sprite, e.x, e.y, e.w, e.h, e.facing);
            if(e.hp < 15) {
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = `rgba(255,255,255,${Math.random()})`;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.globalCompositeOperation = 'source-over';
            }
        }
    }

    // Player
    if(state.mode === 'PLAY' || state.mode === 'GAMEOVER') {
        if(player.invuln <= 0 || Math.floor(state.time * 20)%2===0) {
            drawSprite(player.sprite, player.x, player.y, player.w, player.h, player.facing);
        }
    }

    // Particles
    for(const p of state.particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    }

    ctx.restore();
}

function drawSprite(img, x, y, w, h, facing) {
    ctx.save();
    // Center pivot
    ctx.translate(x + w/2, y + h/2);
    ctx.scale(facing, 1);
    // Draw image stretched to w/h
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
}

function drawBackground() {
    const h = canvas.height;
    const w = canvas.width;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
    skyGrad.addColorStop(0, '#07101d');
    skyGrad.addColorStop(0.45, '#153865');
    skyGrad.addColorStop(1, '#0b1626');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, h);

    const cx = -(state.camera.x * 0.1) % w;
    ctx.fillStyle = 'rgba(103, 232, 249, 0.08)';
    ctx.fillRect(cx + 40, 54, 92, 18);
    ctx.fillRect(cx + 220, 86, 112, 22);
    ctx.fillRect(cx + w + 40, 54, 92, 18);

    for (let i = 0; i < 18; i++) {
        const starX = (i * 59 - (state.camera.x * 0.05)) % (w + 40);
        const x = starX < 0 ? starX + w + 40 : starX;
        const y = 24 + (i % 6) * 16;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 213, 74, 0.95)' : 'rgba(255,255,255,0.8)';
        ctx.fillRect(x, y, 2, 2);
    }

    const mx = -(state.camera.x * 0.2) % w;
    ctx.fillStyle = '#0d1b30';
    for(let i=0; i<2; i++) {
        const ox = mx + i*w;
        ctx.beginPath();
        ctx.moveTo(ox, h);
        ctx.lineTo(ox + 100, h - 120);
        ctx.lineTo(ox + 250, h - 60);
        ctx.lineTo(ox + 360, h - 180);
        ctx.lineTo(ox + w, h);
        ctx.fill();
    }

    const cityX = -(state.camera.x * 0.35) % (w + 80);
    ctx.fillStyle = '#09111e';
    for (let i = 0; i < 9; i++) {
        const x = cityX + i * 52;
        const bH = 44 + (i % 4) * 14;
        ctx.fillRect(x, h - 120 - bH, 28, bH);
        ctx.fillStyle = 'rgba(103, 232, 249, 0.24)';
        ctx.fillRect(x + 6, h - 114 - bH, 4, 4);
        ctx.fillRect(x + 16, h - 98 - bH, 4, 4);
        ctx.fillStyle = '#09111e';
    }

    ctx.fillStyle = 'rgba(103, 232, 249, 0.08)';
    ctx.fillRect(0, h - 124, w, 4);
}

window.onload = init;

</script>
