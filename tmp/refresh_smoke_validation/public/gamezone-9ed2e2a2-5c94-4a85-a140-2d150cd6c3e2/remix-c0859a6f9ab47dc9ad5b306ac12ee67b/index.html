<title>Good Guy Gone Bad: Toybox Terror</title>

<style>
  :root{
    --blood:#ff2f55; --blood-dark:#8d0621; --plastic:#f0c06a; --overalls:#2774d9;
    --den:#12070b; --den2:#2a1116; --toy-yellow:#ffcf4d; --mint:#83ffd0;
    --paper:#fff0bf; --text:#fff8e7; --muted:#d9b9a6; --panel:rgba(28,8,13,.86);

  body{background:radial-gradient(circle at 50% 0%,rgba(255,47,85,.22),transparent 34%),linear-gradient(180deg,#210910 0%,#090205 58%,#020102 100%)}

  .wallpaper{position:absolute;inset:0;pointer-events:none;opacity:.72;background-image:radial-gradient(circle at 18% 16%,rgba(255,207,77,.17) 0 2px,transparent 3px),radial-gradient(circle at 82% 28%,rgba(131,255,208,.12) 0 2px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:46px 46px,58px 58px,18px 100%;mix-blend-mode:screen;animation:wallCrawl 18s linear infinite}
  @keyframes wallCrawl{from{transform:translate3d(0,0,0)}to{transform:translate3d(-46px,24px,0)}}
  .vignette{position:absolute;inset:-2%;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0 42%,rgba(0,0,0,.58) 72%,#000 100%);z-index:4}

  #ui-layer{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column}
  #hud{pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:.55rem;padding:max(.65rem,env(safe-area-inset-top) + .2rem) max(.7rem,env(safe-area-inset-right) + .35rem) 0 max(.7rem,env(safe-area-inset-left) + .35rem)}
  .badge{min-width:5.6rem;border:1px solid rgba(255,207,77,.26);background:linear-gradient(180deg,rgba(50,13,20,.82),rgba(18,5,9,.78));border-radius:1rem;padding:.42rem .56rem;box-shadow:0 10px 24px rgba(0,0,0,.38),0 0 20px rgba(255,47,85,.13);backdrop-filter:blur(7px)}
  .badge.right{text-align:right}.label{font:400 .58rem/1 var(--comic);letter-spacing:.12em;text-transform:uppercase;color:var(--toy-yellow);opacity:.95;text-shadow:0 0 12px rgba(255,47,85,.42)}
  #pages-counter,#threat-indicator{font-weight:700;font-size:1rem;line-height:1.1;letter-spacing:.04em}#threat-indicator.quiet{color:var(--mint)}#threat-indicator.stalked{color:#ffd36e}#threat-indicator.close{color:#ff6b7d}#threat-indicator.contact{color:#ff2f55;text-shadow:0 0 14px #ff2f55}
  #title-chip{position:absolute;left:50%;top:max(.62rem,env(safe-area-inset-top) + .22rem);transform:translateX(-50%);font-family:var(--title);font-size:clamp(1rem,5.4vw,1.65rem);letter-spacing:.06em;color:#fff2bb;text-shadow:0 2px 0 #650016,0 0 20px rgba(255,47,85,.75);white-space:nowrap;pointer-events:none;max-width:48vw;text-align:center}
  .guidance{position:absolute;left:max(.78rem,env(safe-area-inset-left) + .25rem);right:max(.78rem,env(safe-area-inset-right) + .25rem);bottom:max(.75rem,env(safe-area-inset-bottom) + .3rem);text-align:center;font-weight:600;font-size:clamp(.68rem,3vw,.86rem);line-height:1.25;color:#ffe6b1;background:rgba(12,3,7,.62);border:1px solid rgba(255,207,77,.18);border-radius:999px;padding:.45rem .7rem;box-shadow:0 0 18px rgba(0,0,0,.52);backdrop-filter:blur(5px)}
  #game-over-screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;pointer-events:auto;background:radial-gradient(circle at 50% 35%,rgba(255,47,85,.2),rgba(0,0,0,.78) 72%);z-index:50}#game-over-screen.visible{display:flex}
  #game-over-panel{width:min(91vw,360px);border:2px solid rgba(255,207,77,.35);border-radius:1.15rem;background:linear-gradient(180deg,rgba(58,10,19,.96),rgba(10,3,7,.96));box-shadow:0 28px 80px rgba(0,0,0,.78),0 0 38px rgba(255,47,85,.25);padding:1.1rem;text-align:center;position:relative;overflow:hidden}
  #game-over-panel:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,207,77,.08),transparent,rgba(255,47,85,.12),transparent);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  #game-over-panel>*{position:relative}.panel-kicker{font-family:var(--comic);font-size:.72rem;letter-spacing:.17em;color:var(--toy-yellow);text-transform:uppercase}.panel-title{font-family:var(--title);font-size:clamp(1.55rem,8vw,2.3rem);line-height:.95;margin:.15rem 0 .5rem;color:#fff6c7;text-shadow:0 3px 0 var(--blood-dark),0 0 18px rgba(255,47,85,.7)}#game-over-sub{font-size:.92rem;color:#f4d8c1;line-height:1.35;margin:.45rem auto .75rem;max-width:18rem}.final-row{display:flex;justify-content:space-between;gap:1rem;color:#ffd88d;font-weight:700;border-top:1px dashed rgba(255,207,77,.32);border-bottom:1px dashed rgba(255,207,77,.32);padding:.52rem .1rem;margin:.75rem 0}#restart-btn{width:100%;min-height:46px;border:0;border-radius:.85rem;background:linear-gradient(180deg,#ffcf4d,#ff8a21 48%,#bd2a10);color:#350005;font-family:var(--comic);font-size:1.05rem;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 5px 0 #5d1408,0 0 22px rgba(255,47,85,.28);cursor:pointer;touch-action:manipulation}#restart-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5d1408}
  #jumpscare-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:45;pointer-events:auto}#jumpscare-overlay.visible{display:flex}.doll-scare{width:min(74vw,340px);aspect-ratio:.72;border-radius:42% 42% 20% 20%;background:radial-gradient(circle at 36% 30%,#fff4ca 0 5%,transparent 6%),radial-gradient(circle at 64% 30%,#fff4ca 0 5%,transparent 6%),linear-gradient(180deg,#f6b764 0 44%,#2879df 45% 100%);box-shadow:0 0 0 26px #b9471c inset,0 0 90px #ff002f;position:relative;animation:jump .35s infinite alternate}.doll-scare:before{content:"";position:absolute;left:24%;right:24%;top:43%;height:11%;border-bottom:7px solid #650016;border-radius:50%;transform:rotate(-4deg)}.doll-scare:after{content:"PLAYTIME IS OVER";position:absolute;bottom:-3.2rem;left:50%;transform:translateX(-50%);font-family:var(--title);font-size:1.8rem;color:#ff2f55;text-shadow:0 0 18px #ff2f55;white-space:nowrap}@keyframes jump{from{transform:scale(1) rotate(-1deg)}to{transform:scale(1.08) rotate(1.8deg)}}
  .feedback-gif{position:absolute;right:max(.72rem,env(safe-area-inset-right) + .25rem);width:min(25vw,96px);aspect-ratio:1;object-fit:cover;border-radius:1rem;border:1px solid rgba(255,207,77,.28);background:rgba(18,3,7,.76);box-shadow:0 10px 28px rgba(0,0,0,.44),0 0 22px rgba(255,47,85,.2);opacity:0;transform:translate3d(12px,0,0) scale(.94);transition:opacity .16s ease,transform .16s ease;pointer-events:none;z-index:42}.feedback-gif.visible{opacity:.82;transform:translate3d(0,0,0) scale(1)}#collect-gif{top:max(4.4rem,env(safe-area-inset-top) + 3.7rem)}#danger-gif{bottom:max(4.8rem,env(safe-area-inset-bottom) + 4.1rem)}
  .shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}@keyframes shake{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-8px,0,0)}40%,60%{transform:translate3d(8px,0,0)}}
  @media (max-width:390px){.badge{min-width:5rem;padding:.35rem .46rem}.label{font-size:.52rem}#pages-counter,#threat-indicator{font-size:.9rem}#title-chip{top:max(2.85rem,env(safe-area-inset-top) + 2.25rem);max-width:86vw;font-size:1.15rem}.feedback-gif{width:min(23vw,78px)}}
</style>

<body>
<div id="game-container">
  <canvas id="gameCanvas" width="720" height="1280" aria-label="Tap and drag to guide the babysitter through the cursed toy room"></canvas>
  <div class="wallpaper"></div><div class="vignette"></div><div class="scanlines"></div><div id="red-flash"></div>
  <img id="collect-gif" class="feedback-gif" src="https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp" alt="Charm collected feedback" aria-hidden="true">
  <img id="danger-gif" class="feedback-gif" src="https://i.giphy.com/3bzB1rHg6g9Cp06acA.webp" alt="Cursed doll danger feedback" aria-hidden="true">
  <div id="jumpscare-overlay"><div class="doll-scare" role="img" aria-label="Killer doll jumpscare"></div></div>
  <div id="ui-layer">
    <div id="hud">
      <div class="badge"><div class="label">Hex Notes</div><div id="pages-counter">0 / 8</div></div>
      <div id="title-chip">Toybox Terror</div>
      <div class="badge right"><div class="label">Doll Mood</div><div id="threat-indicator" class="quiet">Giggles</div></div>
    </div>
    <div id="game-over-screen">
      <div id="game-over-panel">
        <div class="panel-kicker">Possession Report</div>
        <div id="game-over-title" class="panel-title">Charms Sealed!</div>
        <div id="game-over-sub">The babysitter stuffs every hex note back into the toy chest before the doll finishes monologuing.</div>
        <div class="final-row"><span>Recovered</span><span id="final-pages">8 / 8</span></div>
        <button id="restart-btn" type="button">Reset the Playdate</button>
      </div>
    </div>
    <div class="guidance">Tap / drag to sweep the toy room. Grab every hex note before the tiny menace gets close.</div>
  </div>
  <audio id="bgm_main" data-editable="audio" data-label="Background Music" src="https://gamezone-virid.vercel.app/assets/audios/ambience/ambience_loop_02.mp3" preload="auto" loop></audio>
  <audio id="sfx_collect" data-editable="audio" data-label="Collect Hex SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_02.mp3" preload="auto"></audio>
  <audio id="sfx_hit" data-editable="audio" data-label="Doll Hit SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/damage_02.mp3" preload="auto"></audio>
  <audio id="sfx_warning" data-editable="audio" data-label="Threat Warning SFX" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
  <audio id="sfx_fail" data-editable="audio" data-label="Fail SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_02.mp3" preload="auto"></audio>
  <audio id="sfx_win" data-editable="audio" data-label="Win SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_02.mp3" preload="auto"></audio>
  <audio id="sfx_ui" data-editable="audio" data-label="UI Click SFX" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
</div>
<script id="game-config" type="application/x-game-config">{"heroSpeed":{"type":"number","label":"Babysitter Speed","value":7,"min":1,"max":12},"themeColor":{"type":"color","label":"Blood Plastic Accent","value":"#ff2f55"},"pagesToCollect":{"type":"number","label":"Hex Notes","value":8,"min":3,"max":12}}</script>
<script>
(function(){'use strict';
  window.gameConfigDefs={}; window.gameConfig={};
  function parseGameConfig(){const script=document.getElementById('game-config'); if(!script)return; try{const raw=JSON.parse(script.textContent.trim()); window.gameConfigDefs=raw; const values={}; for(const [key,def] of Object.entries(raw)){if(def.type==='number'){let v=Number(def.value); if(!Number.isFinite(v))v=Number(def.min)||0; if(typeof def.min==='number')v=Math.max(def.min,v); if(typeof def.max==='number')v=Math.min(def.max,v); values[key]=v}else if(def.type==='color'){const val=String(def.value||'').trim(); values[key]=/^#[0-9a-f]{6}$/i.test(val)?val:'#ff2f55'}else values[key]=def.value} window.gameConfig=values}catch(e){console.error('Config parse error',e); window.gameConfig={heroSpeed:7,themeColor:'#ff2f55',pagesToCollect:8}}}
  window.updateGameConfig=function(key,val){const def=window.gameConfigDefs[key]; if(!def)return; if(def.type==='number'){let v=Number(val); if(!Number.isFinite(v))return; if(typeof def.min==='number')v=Math.max(def.min,v); if(typeof def.max==='number')v=Math.min(def.max,v); window.gameConfig[key]=v}else if(def.type==='color'){if(/^#[0-9a-f]{6}$/i.test(String(val)))window.gameConfig[key]=val}else window.gameConfig[key]=val};
  const AudioManager=(function(){let audioCtx=null,unlocked=false,bgmEl=null; const sfxElements={},lastPlayAt=Object.create(null); function init(){bgmEl=document.getElementById('bgm_main'); ['collect','hit','warning','fail','win','ui'].forEach(id=>{const el=document.getElementById('sfx_'+id); if(el)sfxElements[id]=el}); try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}} function unlock(){if(unlocked)return; unlocked=true; if(audioCtx)audioCtx.resume().catch(()=>{}); if(bgmEl){bgmEl.volume=.18; bgmEl.muted=false; bgmEl.play().catch(()=>{})}} function playBgm(){if(bgmEl){bgmEl.volume=.18; bgmEl.play().catch(()=>{})}} function synthFallback(id){if(!audioCtx)return; try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime; o.type=id==='hit'||id==='fail'?'sawtooth':'triangle'; o.frequency.setValueAtTime(id==='hit'?120:id==='warning'?260:620,now); o.frequency.exponentialRampToValueAtTime(id==='hit'?42:id==='warning'?95:920,now+(id==='hit'?.32:.1)); g.gain.setValueAtTime(id==='hit'?.38:.16,now); g.gain.exponentialRampToValueAtTime(.001,now+(id==='hit'?.36:.13)); o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+(id==='hit'?.38:.15))}catch(e){}} function playSfx(id,cooldownMs){const now=performance.now(); if(cooldownMs&&lastPlayAt[id]&&now-lastPlayAt[id]<cooldownMs)return; lastPlayAt[id]=now; const el=sfxElements[id]; if(el){try{el.currentTime=0; el.volume=id==='hit'?.65:.36; el.play().catch(()=>synthFallback(id)); return}catch(e){}} synthFallback(id)} return{init,unlock,playBgm,playSfx}})();
  let canvas,ctx,cw=0,ch=0,dpr=window.devicePixelRatio||1,initialized=false,gameState='PLAYING';
  const state={player:null,pages:[],collected:0,threatLevel:0,shadow:null,lastTime:0,touchTarget:null,gameOverReason:'vanish',jumpscarePlaying:false,chaseWarmup:0,_closeTimer:0,crumbs:[]};
  const ui={};
  function setState(next){gameState=next; if(ui.hud&&ui.gameOverScreen){ui.hud.style.display=next==='PLAYING'?'flex':'none'; ui.gameOverScreen.classList.toggle('visible',next==='GAMEOVER')}}
  function resize(width,height){if(!canvas||!ctx)return; cw=width; ch=height; dpr=window.devicePixelRatio||1; canvas.width=Math.max(1,Math.floor(width*dpr)); canvas.height=Math.max(1,Math.floor(height*dpr)); canvas.style.width=width+'px'; canvas.style.height=height+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); if(initialized){if(state.player){const r=state.player.r; state.player.x=Math.min(Math.max(r,state.player.x),cw-r); state.player.y=Math.min(Math.max(r,state.player.y),ch-r)} state.pages.forEach(p=>{p.x=Math.min(Math.max(p.r,p.x),cw-p.r); p.y=Math.min(Math.max(p.r,p.y),ch-p.r)}); if(state.shadow){state.shadow.x=Math.min(Math.max(0,state.shadow.x),cw); state.shadow.y=Math.min(Math.max(0,state.shadow.y),ch)}}}
  function initGame(){const radius=Math.max(10,Math.min(cw,ch)*.035); state.player={x:cw*.5,y:ch*.8,r:radius,angle:-Math.PI/2}; state.pages=[]; state.collected=0; state.threatLevel=0; state.shadow={x:cw*.5,y:-ch*.2,speed:18,active:false}; state.lastTime=performance.now(); state.touchTarget=null; state.gameOverReason='vanish'; state.jumpscarePlaying=false; state.chaseWarmup=0; state._closeTimer=0; state.crumbs=[]; spawnPages(window.gameConfig.pagesToCollect||8); updateHud(); ui.container.classList.remove('shake'); ui.redFlash.classList.remove('visible'); ui.jumpscareOverlay.classList.remove('visible'); setState('PLAYING'); AudioManager.playBgm(); exposeDebug()}
  function restartGame(){AudioManager.playSfx('ui',120); initGame()}
  function spawnPages(count){state.pages.length=0; const minMarginX=cw*.12,minMarginY=ch*.18,r=Math.max(7,Math.min(cw,ch)*.024); for(let i=0;i<count;i++){const lane=Math.random()<.5?.35:.65; let x=cw*lane+(Math.random()-.5)*cw*.06; let y=minMarginY+(ch-minMarginY*1.4)*(i/count)+(Math.random()-.5)*ch*.05; x=Math.min(Math.max(minMarginX,x),cw-minMarginX); y=Math.min(Math.max(r,y),ch-r); state.pages.push({x,y,r,collected:false,pulse:Math.random()*Math.PI*2,rot:(Math.random()-.5)*.5})}}
  function unlockAudio(){AudioManager.unlock()} function handleGameInput(e){if(state.jumpscarePlaying||gameState!=='PLAYING')return; const rect=canvas.getBoundingClientRect(); state.touchTarget={x:e.clientX-rect.left,y:e.clientY-rect.top}} function handlePointerEnd(){state.touchTarget=null} function isCanvasPointerEvent(e){return e&&e.target===canvas}
  function handleGlobalInput(e){unlockAudio(); if(state.jumpscarePlaying&&ui.jumpscareOverlay.classList.contains('visible')){if(e.preventDefault)e.preventDefault(); finishJumpscare(); return} if(gameState==='PLAYING'){const type=e.type; if(!isCanvasPointerEvent(e)){if(type==='pointerup'||type==='pointercancel')handlePointerEnd(); return} if(type==='pointerdown'||type==='pointermove'){if(e.preventDefault)e.preventDefault(); handleGameInput(e)}else if(type==='pointerup'||type==='pointercancel'){if(e.preventDefault)e.preventDefault(); handlePointerEnd()}}}
  function setupInput(){window.addEventListener('pointerdown',handleGlobalInput,{passive:false}); window.addEventListener('pointermove',handleGlobalInput,{passive:false}); window.addEventListener('pointerup',handleGlobalInput,{passive:false}); window.addEventListener('pointercancel',handleGlobalInput,{passive:false}); ui.restartBtn.addEventListener('click',restartGame); ui.jumpscareOverlay.addEventListener('pointerdown',handleGlobalInput,{passive:false})}
  function updateHud(){const total=window.gameConfig.pagesToCollect||8; ui.pagesCounter.textContent=state.collected+' / '+total; const lvl=state.threatLevel; let label='Giggles',cls='quiet'; if(lvl>1.5&&lvl<=3){label='Peeking';cls='stalked'}else if(lvl>3&&lvl<=4.5){label='Scuttling';cls='close'}else if(lvl>4.5){label='Knife Hug';cls='contact'} ui.threatIndicator.textContent=label; ui.threatIndicator.className=cls; exposeDebug()}
  function showRedFlash(){ui.redFlash.classList.add('visible'); setTimeout(()=>ui.redFlash.classList.remove('visible'),190)} function vibrate(style){try{window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({action:'vibrate',requestId:'h5-'+Date.now(),version:'1.0',params:{style:style||'light'}})}catch(e){}} function showFeedbackGif(el,duration){if(!el)return; el.classList.add('visible'); clearTimeout(el._hideTimer); el._hideTimer=setTimeout(()=>el.classList.remove('visible'),duration||900)} function triggerHitFeedback(){showRedFlash(); ui.container.classList.remove('shake'); void ui.container.offsetWidth; ui.container.classList.add('shake'); showFeedbackGif(ui.dangerGif,1100); vibrate('heavy'); AudioManager.playSfx('hit',180)} function triggerCollectFeedback(){showFeedbackGif(ui.collectGif,850); vibrate('light'); AudioManager.playSfx('collect',100)} function maybeTriggerThreatWarning(){if(state.threatLevel>=3.4&&!state.jumpscarePlaying){showFeedbackGif(ui.dangerGif,950); AudioManager.playSfx('warning',1400)}}
  function playJumpscareAndEnd(){if(state.jumpscarePlaying)return; state.jumpscarePlaying=true; ui.jumpscareOverlay.classList.add('visible'); vibrate('heavy'); const bgm=document.getElementById('bgm_main'); if(bgm)try{bgm.pause()}catch(e){} setTimeout(()=>{if(state.jumpscarePlaying)finishJumpscare()},900)} function finishJumpscare(){if(!state.jumpscarePlaying&&gameState==='GAMEOVER')return; state.jumpscarePlaying=false; ui.jumpscareOverlay.classList.remove('visible'); endGame('caught')}
  function endGame(reason){state.gameOverReason=reason; const total=window.gameConfig.pagesToCollect||8; ui.finalPages.textContent=state.collected+' / '+total; if(reason==='escape'){ui.gameOverTitle.textContent='Charms Sealed!'; ui.gameOverSub.textContent='The babysitter stuffs every hex note back into the toy chest before the doll finishes monologuing.'; showFeedbackGif(ui.collectGif,1600); AudioManager.playSfx('win',300)}else if(reason==='caught'){ui.gameOverTitle.textContent='Tiny Menace Wins'; ui.gameOverSub.textContent='The cursed doll lands a sneaky close-quarters attack and cackles about sequel rights.'; showFeedbackGif(ui.dangerGif,1600); AudioManager.playSfx('fail',300)}else{ui.gameOverTitle.textContent='Playdate Cancelled'; ui.gameOverSub.textContent='The toy room eats the route. The remaining hex notes keep whispering under the sofa.'; AudioManager.playSfx('fail',300)} setState('GAMEOVER'); exposeDebug()}
  function update(dt){if(!state.player)return; const safeDt=Math.min(dt,.05),speed=(window.gameConfig.heroSpeed||7)*32; if(state.touchTarget&&!state.jumpscarePlaying){const dx=state.touchTarget.x-state.player.x,dy=state.touchTarget.y-state.player.y,dist=Math.hypot(dx,dy); if(dist>1){const step=speed*safeDt,tt=Math.min(1,step/dist); state.player.x+=dx*tt; state.player.y+=dy*tt; state.player.angle=Math.atan2(dy,dx); state.crumbs.push({x:state.player.x,y:state.player.y,a:.7}); if(state.crumbs.length>34)state.crumbs.shift()}} const pr=state.player.r; state.player.x=Math.min(Math.max(pr,state.player.x),cw-pr); state.player.y=Math.min(Math.max(pr,state.player.y),ch-pr); const total=window.gameConfig.pagesToCollect||8; let spike=0; for(const p of state.pages){p.pulse+=safeDt*2; if(!p.collected){const dist=Math.hypot(p.x-state.player.x,p.y-state.player.y); if(dist<p.r*2.3){p.collected=true; state.collected++; triggerCollectFeedback(); spike+=.5; if(state.collected>=total)endGame('escape')}}} state.threatLevel+=safeDt*(.06+state.collected*.06)+spike; if(state.threatLevel>6)state.threatLevel=6; maybeTriggerThreatWarning(); if(state.threatLevel>1.5){if(!state.shadow.active)state.chaseWarmup=0; state.shadow.active=true} if(state.shadow&&state.shadow.active&&!state.jumpscarePlaying){state.chaseWarmup+=safeDt; const s=state.shadow,dx=state.player.x-s.x,dy=state.player.y-s.y,dist=Math.hypot(dx,dy)||1,warmup=Math.min(1,Math.max(0,state.chaseWarmup/2)),step=s.speed*(.7+state.threatLevel*.5)*safeDt*warmup; s.x+=dx/dist*step+(Math.random()-.5)*.6*safeDt; s.y+=dy/dist*step+(Math.random()-.5)*.6*safeDt; const catchDist=Math.min(cw,ch)*.08; if(dist<catchDist){state._closeTimer+=safeDt; if(state._closeTimer>.18){triggerHitFeedback(); playJumpscareAndEnd()}}else state._closeTimer=0} state.crumbs.forEach(c=>c.a-=safeDt*.8); state.crumbs=state.crumbs.filter(c=>c.a>0); updateHud()}
  function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function drawRoom(){const t=performance.now()*.001; const wall=ctx.createLinearGradient(0,0,0,ch); wall.addColorStop(0,'#300d16'); wall.addColorStop(.42,'#19070d'); wall.addColorStop(1,'#050103'); ctx.fillStyle=wall; ctx.fillRect(0,0,cw,ch); const floorY=ch*.48; ctx.fillStyle='rgba(0,0,0,.18)'; for(let i=0;i<9;i++){const y=floorY+i*ch*.07; ctx.strokeStyle='rgba(255,207,77,.06)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cw,y+ch*.06); ctx.stroke()} ctx.fillStyle='rgba(80,25,18,.7)'; ctx.fillRect(0,floorY,cw,ch-floorY); const rugG=ctx.createRadialGradient(cw*.5,ch*.71,10,cw*.5,ch*.72,cw*.46); rugG.addColorStop(0,'rgba(255,47,85,.2)'); rugG.addColorStop(1,'rgba(60,2,14,.0)'); ctx.fillStyle=rugG; ctx.beginPath(); ctx.ellipse(cw*.5,ch*.72,cw*.42,ch*.16,0,0,Math.PI*2); ctx.fill(); ctx.save(); ctx.globalAlpha=.45; ctx.fillStyle='#ffcf4d'; for(let i=0;i<14;i++){const x=(i*83+Math.sin(t+i)*12)%cw,y=ch*.12+(i%5)*ch*.067; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t+i)*.15); roundedRect(-12,-7,24,14,4); ctx.fill(); ctx.fillStyle='#2774d9'; ctx.fillRect(-8,-3,16,6); ctx.restore()} ctx.restore(); ctx.fillStyle='rgba(7,2,4,.75)'; roundedRect(cw*.08,ch*.13,cw*.24,ch*.09,8); ctx.fill(); ctx.fillStyle='rgba(255,240,191,.7)'; ctx.font=Math.max(10,cw*.026)+'px Bangers'; ctx.textAlign='center'; ctx.fillText('Good Guy!',cw*.2,ch*.185); ctx.fillStyle='rgba(34,9,13,.78)'; roundedRect(cw*.68,ch*.14,cw*.22,ch*.12,12); ctx.fill(); ctx.strokeStyle='rgba(255,47,85,.28)'; ctx.stroke(); ctx.fillStyle='rgba(255,207,77,.55)'; ctx.font=Math.max(9,cw*.022)+'px Rajdhani'; ctx.fillText('SOUL REFUND',cw*.79,ch*.19)}
  function drawPages(){const accent=window.gameConfig.themeColor||'#ff2f55'; for(const p of state.pages){if(p.collected)continue; const pulse=1+.14*Math.sin(p.pulse*3),r=p.r*pulse,w=r*1.45,h=r*1.85; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+Math.sin(p.pulse)*.09); ctx.shadowColor=accent; ctx.shadowBlur=r*1.4; ctx.fillStyle='#fff0bf'; roundedRect(-w/2,-h/2,w,h,Math.max(2,r*.18)); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(70,0,10,.75)'; ctx.lineWidth=1; ctx.stroke(); ctx.strokeStyle=accent; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(-w*.28,-h*.16); ctx.quadraticCurveTo(0,-h*.32,w*.26,-h*.08); ctx.moveTo(-w*.25,h*.04); ctx.lineTo(w*.22,h*.14); ctx.stroke(); ctx.fillStyle='rgba(141,6,33,.9)'; ctx.beginPath(); ctx.arc(w*.23,-h*.24,r*.16,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='screen'; const g=ctx.createRadialGradient(0,0,0,0,0,r*3); g.addColorStop(0,accent+'44'); g.addColorStop(1,accent+'00'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*3,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.globalCompositeOperation='source-over'}}
  function drawPlayer(){if(!state.player)return; const p=state.player,r=p.r,accent=window.gameConfig.themeColor||'#ff2f55'; ctx.save(); ctx.translate(p.x,p.y); const coneLen=Math.min(cw,ch)*.66,coneAngle=Math.PI*.55,g=ctx.createRadialGradient(0,0,0,0,0,coneLen); g.addColorStop(0,'rgba(255,244,196,.55)'); g.addColorStop(.18,'rgba(255,207,77,.24)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,coneLen,p.angle-coneAngle/2,p.angle+coneAngle/2); ctx.closePath(); ctx.fillStyle=g; ctx.globalCompositeOperation='lighter'; ctx.fill(); ctx.restore(); ctx.globalCompositeOperation='source-over'; ctx.save(); ctx.translate(p.x,p.y); for(const c of state.crumbs){/* drawn elsewhere */} ctx.rotate(p.angle+Math.PI/2); ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,r*.72,r*.85,r*.32,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2879df'; roundedRect(-r*.55,-r*.2,r*1.1,r*1.25,r*.22); ctx.fill(); ctx.fillStyle='#ffe0a0'; ctx.beginPath(); ctx.arc(0,-r*.45,r*.64,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#4b2112'; ctx.beginPath(); ctx.arc(0,-r*.58,r*.7,Math.PI*.05,Math.PI*.95,true); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-r*.22,-r*.5,r*.09,0,Math.PI*2); ctx.arc(r*.22,-r*.5,r*.09,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=accent; ctx.lineWidth=Math.max(1,r*.11); ctx.beginPath(); ctx.moveTo(-r*.65,r*.18); ctx.lineTo(-r*1.05,r*.6); ctx.moveTo(r*.65,r*.18); ctx.lineTo(r*1.05,r*.6); ctx.stroke(); ctx.fillStyle='#ffcf4d'; ctx.beginPath(); ctx.arc(r*.88,r*.66,r*.14,0,Math.PI*2); ctx.fill(); ctx.restore();}
  function drawDoll(){if(!state.shadow||!state.shadow.active)return; const s=state.shadow,baseR=Math.min(cw,ch)*.088,time=performance.now()*.002,pulse=1+Math.sin(time*3)*.045,r=baseR*pulse; ctx.save(); ctx.translate(s.x,s.y); if(state.player)ctx.rotate(Math.atan2(state.player.y-s.y,state.player.x-s.x)+Math.PI/2); const halo=ctx.createRadialGradient(0,0,0,0,0,r*4); halo.addColorStop(0,'rgba(255,47,85,.2)'); halo.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,r*4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#b9481c'; ctx.beginPath(); ctx.arc(0,-r*.52,r*.82,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#f1b565'; ctx.beginPath(); ctx.arc(0,-r*.38,r*.62,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#2879df'; roundedRect(-r*.52,r*.16,r*1.04,r*1.22,r*.2); ctx.fill(); ctx.fillStyle='#ffcf4d'; roundedRect(-r*.42,r*.22,r*.84,r*.2,r*.06); ctx.fill(); ctx.strokeStyle='rgba(255,240,191,.9)'; ctx.lineWidth=r*.09; ctx.lineCap='round'; const sway=Math.sin(time*4)*.22; ctx.beginPath(); ctx.moveTo(-r*.5,r*.42); ctx.lineTo(-r*1.25,r*.82+sway*r); ctx.lineTo(-r*1.55,r*1.1); ctx.moveTo(r*.5,r*.42); ctx.lineTo(r*1.25,r*.82-sway*r); ctx.lineTo(r*1.55,r*1.1); ctx.stroke(); ctx.strokeStyle='#d7d7de'; ctx.lineWidth=r*.08; for(const side of [-1,1]){ctx.beginPath(); ctx.moveTo(side*r*1.55,r*1.1); ctx.lineTo(side*r*1.85,r*1.18); ctx.moveTo(side*r*1.55,r*1.1); ctx.lineTo(side*r*1.76,r*.9); ctx.stroke()} ctx.fillStyle='#fff4ca'; ctx.beginPath(); ctx.arc(-r*.22,-r*.46,r*.12,0,Math.PI*2); ctx.arc(r*.22,-r*.46,r*.12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#101'; ctx.beginPath(); ctx.arc(-r*.22,-r*.46,r*.06,0,Math.PI*2); ctx.arc(r*.22,-r*.46,r*.06,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#650016'; ctx.lineWidth=r*.06; ctx.beginPath(); ctx.arc(0,-r*.23,r*.24,.1,Math.PI-.1); ctx.stroke(); ctx.restore()}
  function drawCrumbs(){ctx.save(); for(const c of state.crumbs){ctx.globalAlpha=Math.max(0,c.a*.45); ctx.fillStyle='#ffcf4d'; ctx.beginPath(); ctx.arc(c.x,c.y,Math.max(1.5,Math.min(cw,ch)*.006),0,Math.PI*2); ctx.fill()} ctx.restore(); ctx.globalAlpha=1}
  function draw(){if(!ctx)return; drawRoom(); drawCrumbs(); drawPages(); drawDoll(); drawPlayer()}
  function loop(now){try{const dt=(now-state.lastTime)/1000; state.lastTime=now; if(gameState==='PLAYING')update(dt); draw()}catch(e){console.error('Loop error',e)} requestAnimationFrame(loop)}
  function exposeDebug(){window.__gameDebug={gameState,initialized,collected:state.collected,total:window.gameConfig.pagesToCollect||8,threatLevel:state.threatLevel,shadowActive:!!(state.shadow&&state.shadow.active),pages:state.pages.map(p=>({x:p.x,y:p.y,collected:p.collected})),player:state.player?{x:state.player.x,y:state.player.y,r:state.player.r}:null,reason:state.gameOverReason}}
  document.addEventListener('DOMContentLoaded',function(){parseGameConfig(); canvas=document.getElementById('gameCanvas'); ctx=canvas.getContext('2d'); ui.container=document.getElementById('game-container'); ui.pagesCounter=document.getElementById('pages-counter'); ui.threatIndicator=document.getElementById('threat-indicator'); ui.hud=document.getElementById('hud'); ui.gameOverScreen=document.getElementById('game-over-screen'); ui.gameOverTitle=document.getElementById('game-over-title'); ui.gameOverSub=document.getElementById('game-over-sub'); ui.finalPages=document.getElementById('final-pages'); ui.restartBtn=document.getElementById('restart-btn'); ui.redFlash=document.getElementById('red-flash'); ui.jumpscareOverlay=document.getElementById('jumpscare-overlay'); ui.collectGif=document.getElementById('collect-gif'); ui.dangerGif=document.getElementById('danger-gif'); AudioManager.init(); setupInput(); const ro=new ResizeObserver(entries=>{for(const entry of entries){if(entry.target===canvas){const cr=entry.contentRect; resize(cr.width,cr.height); if(!initialized){initialized=true; initGame(); state.lastTime=performance.now(); requestAnimationFrame(loop)}}}}); ro.observe(canvas)});
})();
