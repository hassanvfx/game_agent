<style>
:root {
  --bg-night: #04050b;
  --bg-hall: #0a1020;
  --mist: rgba(125, 207, 255, 0.12);
  --specter-cyan: #9ce9ff;
  --specter-cyan-strong: #58d5ff;
  --alarm-rose: #ff5f86;
  --alarm-amber: #ffc866;
  --text-main: #eff8ff;
  --text-muted: #94a8c9;
  --panel-fill: rgba(7, 13, 24, 0.82);
  --panel-border: rgba(152, 220, 255, 0.28);
  --font-primary: 'Creepster', 'Cinzel', serif;
  --font-secondary: 'Exo 2', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at top, rgba(88, 213, 255, 0.08), transparent 30%),
    linear-gradient(180deg, var(--bg-hall) 0%, var(--bg-night) 58%, #010104 100%);
  color: var(--text-main);
  font-family: var(--font-secondary);
}
#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  isolation: isolate;
}
#game-container::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(156, 233, 255, 0.08), transparent 20%),
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.02) 0 2px,
      transparent 2px 8px
    );
  mix-blend-mode: screen;
  opacity: 0.45;
}
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 50% 14%, rgba(120, 220, 255, 0.12) 0, transparent 24%),
      radial-gradient(circle at 50% 10%, #162033 0, #050711 58%, #000000 100%);
  }
#ui-layer {
  pointer-events: none;
}
#hud, #game-over-screen, #game-over-screen * {
  pointer-events: auto;
}
.film-grain-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.32;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255,255,255,0.04) 0, transparent 40%),
    radial-gradient(circle at 80% 0%, rgba(255,255,255,0.03) 0, transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(255,255,255,0.03) 0, transparent 55%);
  background-size: 220px 220px, 260px 260px, 300px 300px;
  animation: grainShift 12s infinite linear;
}
@keyframes grainShift {
  0% { transform: translate3d(0,0,0); }
  50% { transform: translate3d(-15px, 10px, 0); }
  100% { transform: translate3d(0,0,0); }
}
.vignette::before {
  content: "";
  position: absolute;
  inset: -10%;
  pointer-events: none;
  background: radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.8) 100%);
}
.noir-panel {
  background:
    linear-gradient(180deg, rgba(13, 24, 39, 0.96), rgba(5, 10, 20, 0.96)),
    rgba(5,5,10,0.95);
  border: 1px solid var(--panel-border);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.85),
    0 0 32px rgba(88, 213, 255, 0.12),
    0 24px 40px rgba(0,0,0,0.9);
  backdrop-filter: blur(8px);
}
.noir-title {
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-family: var(--font-primary);
  color: var(--specter-cyan);
  text-shadow: 0 0 18px rgba(88, 213, 255, 0.35);
}
.red-flash {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 95, 134, 0.55), rgba(0,0,0,0.95)),
    linear-gradient(180deg, rgba(255, 200, 102, 0.06), transparent);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out;
}
.red-flash.visible {
  opacity: 1;
}
.shake {
  animation: shakeScreen 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes shakeScreen {
  10%, 90% { transform: translate3d(-2px, 0, 0); }
  20%, 80% { transform: translate3d(4px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
  40%, 60% { transform: translate3d(8px, 0, 0); }
}
.page-glow {
  animation: pageGlow 0.4s ease-out;
}
@keyframes pageGlow {
  0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
  60% { transform: scale(1.25); filter: drop-shadow(0 0 18px rgba(255,255,255,0.9)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
}
.hud-text-shadow {
  text-shadow: 0 0 12px rgba(0,0,0,0.9);
}
.ward-badge {
  padding: 0.35rem 0.55rem;
  border: 1px solid rgba(152, 220, 255, 0.18);
  border-radius: 0.85rem;
  background: linear-gradient(180deg, rgba(12, 22, 38, 0.8), rgba(8, 14, 26, 0.6));
  box-shadow: 0 0 18px rgba(88, 213, 255, 0.08);
  backdrop-filter: blur(6px);
}
.ward-badge strong,
.ward-badge span:last-child,
.ward-badge div:last-child {
  text-shadow: 0 0 10px rgba(88, 213, 255, 0.18);
}
.hud-guidance {
  padding: 0.42rem 0.8rem;

  border-radius: 999px;
  background: rgba(5, 11, 21, 0.78);
  box-shadow: 0 0 24px rgba(88, 213, 255, 0.1);

  animation: breathing 4s ease-in-out infinite;
}
@keyframes breathing {
  0%, 100% { opacity: 0.5; letter-spacing: 0.2em; }
  50% { opacity: 0.9; letter-spacing: 0.25em; }

<script>
(function() {
  'use strict';

  // ===== Config Parsing =====
  window.gameConfigDefs = {};
  window.gameConfig = {};
  function parseGameConfig() {
    const script = document.getElementById('game-config');
    if (!script) return;
    try {
      const raw = JSON.parse(script.textContent.trim());
      window.gameConfigDefs = raw;
      const values = {};
      for (const [key, def] of Object.entries(raw)) {
        if (def.type === 'number') {
          let v = Number(def.value);
          if (!Number.isFinite(v)) v = Number(def.min) || 0;
          if (typeof def.min === 'number') v = Math.max(def.min, v);
          if (typeof def.max === 'number') v = Math.min(def.max, v);
          values[key] = v;
        } else if (def.type === 'color') {
          const val = String(def.value || '').trim();
          const re = /^#[0-9a-fa-f]{6}$/i;
          values[key] = re.test(val) ? val : '#ffffff';
        } else {
          values[key] = def.value;
        }
      }
      window.gameConfig = values;
    } catch (e) {
      console.error('Config parse error', e);
      window.gameConfigDefs = {};
      window.gameConfig = { heroSpeed: 5, themeColor: '#d7263d', pagesToCollect: 8 };
    }
  }
  window.updateGameConfig = function(key, val) {
    if (!Object.prototype.hasOwnProperty.call(window.gameConfigDefs, key)) return;
    const def = window.gameConfigDefs[key];
    if (def.type === 'number') {
      let v = Number(val);
      if (!Number.isFinite(v)) return;
      if (typeof def.min === 'number') v = Math.max(def.min, v);
      if (typeof def.max === 'number') v = Math.min(def.max, v);
      window.gameConfig[key] = v;
    } else if (def.type === 'color') {
      const re = /^#[0-9a-fA-F]{6}$/;
      if (!re.test(String(val))) return;
      window.gameConfig[key] = val;
    } else {
      window.gameConfig[key] = val;
    }
  };

  // ===== Audio Manager =====
  const AudioManager = (function() {
    let audioCtx = null;
    let unlocked = false;
    let bgmEl = null;
    const sfxBuffers = {};
    const sfxElements = {};
    const lastPlayAt = Object.create(null);

    function init() {
      bgmEl = document.getElementById('bgm_main');
      const collectEl = document.getElementById('sfx_collect');
      const hitEl = document.getElementById('sfx_hit');
      const warningEl = document.getElementById('sfx_warning');
      const failEl = document.getElementById('sfx_fail');
      const winEl = document.getElementById('sfx_win');
      const uiEl = document.getElementById('sfx_ui');
      if (collectEl) sfxElements.collect = collectEl;
      if (hitEl) sfxElements.hit = hitEl;
      if (warningEl) sfxElements.warning = warningEl;
      if (failEl) sfxElements.fail = failEl;
      if (winEl) sfxElements.win = winEl;
      if (uiEl) sfxElements.ui = uiEl;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.warn('Web Audio not available', e);
        return;
      }

      Object.keys(sfxElements).forEach(id => {
        const el = sfxElements[id];
        const src = el.getAttribute('src');
        if (!src) return;
        fetch(src).then(r => r.arrayBuffer())
          .then(buf => audioCtx.decodeAudioData(buf))
          .then(audioBuffer => { sfxBuffers[id] = audioBuffer; })
          .catch(err => {
            console.warn('SFX decode fail, using synth fallback for', id, err);
          });
      });
    }

    function unlock() {
      if (!audioCtx || unlocked) return;
      unlocked = true;
      audioCtx.resume().catch(()=>{});
      if (bgmEl) {
        bgmEl.muted = false;
        bgmEl.play().catch(()=>{});
      }
      const vid = document.getElementById('jumpscare-video');
      if (vid) {
        vid.muted = false;
        vid.play().then(()=>{ vid.pause(); }).catch(()=>{});
      }
    }

    function playBgm() {
      if (!bgmEl) return;
      bgmEl.volume = 0.2;
      bgmEl.muted = false;
      bgmEl.play().catch(()=>{});
    }

    function synthFallback(type) {
      if (!audioCtx) return;
      try {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        if (type === 'hit') {
          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';
          osc1.frequency.setValueAtTime(120, now);
          osc2.frequency.setValueAtTime(128, now);
          osc1.frequency.exponentialRampToValueAtTime(40, now + 0.35);
          osc2.frequency.exponentialRampToValueAtTime(45, now + 0.35);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.4);
          osc2.stop(now + 0.4);
        } else {
          osc1.type = 'triangle';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(520, now);
          osc2.frequency.setValueAtTime(550, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.09);
          osc2.frequency.exponentialRampToValueAtTime(920, now + 0.09);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.12);
          osc2.stop(now + 0.12);
        }
      } catch (e) {
        console.warn('Synth fallback error', e);
      }
    }

    function playSfx(id, cooldownMs) {
      if (!audioCtx) return;
      const nowMs = performance.now();
      const lockMs = typeof cooldownMs === 'number' ? cooldownMs : 0;
      if (lockMs > 0 && lastPlayAt[id] && nowMs - lastPlayAt[id] < lockMs) return;
      lastPlayAt[id] = nowMs;
      const buffer = sfxBuffers[id];
      if (buffer) {
        try {
          const src = audioCtx.createBufferSource();
          src.buffer = buffer;
          const gain = audioCtx.createGain();
          gain.gain.value = id === 'hit' ? 0.7 : 0.35;
          src.connect(gain);
          gain.connect(audioCtx.destination);
          src.start();
        } catch (e) {
          console.warn('SFX play error', e);
        }
      } else {
        synthFallback(id);
      }
    }

    return {
      init,
      unlock,
      playBgm,
      playSfx
    };
  })();

  // ===== Game State =====
  let canvas, ctx;
  let cw = 0, ch = 0;
  let dpr = window.devicePixelRatio || 1;

  let initialized = false;
  let gameState = 'PLAYING'; // PLAYING | GAMEOVER

  const state = {
    player: null,
    pages: [],
    collected: 0,
    threatLevel: 0,
    shadow: null,
    lastTime: 0,
    touchTarget: null,
    gameOverReason: 'vanish',
    jumpscarePlaying: false,
    chaseWarmup: 0
  };

  const ui = {
    pagesCounter: null,
    threatIndicator: null,
    hud: null,
    gameOverScreen: null,
    gameOverTitle: null,
    gameOverSub: null,
    finalPages: null,
    restartBtn: null,
    redFlash: null,
    container: null,
    jumpscareOverlay: null,
    jumpscareVideo: null,
    collectGif: null,
    dangerGif: null
  };

  function setState(next) {
    gameState = next;
    if (!ui.hud || !ui.gameOverScreen) return;
    if (next === 'PLAYING') {
      ui.hud.classList.remove('hidden');
      ui.gameOverScreen.classList.add('hidden');
    } else if (next === 'GAMEOVER') {
      ui.hud.classList.add('hidden');
      ui.gameOverScreen.classList.remove('hidden');
    }
  }

  // ===== Resize Handling =====
  function resize(width, height) {
    if (!canvas || !ctx) return;
    cw = width;
    ch = height;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (initialized) {
      if (state.player) {
        const r = state.player.r;
        state.player.x = Math.min(Math.max(r, state.player.x), cw - r);
        state.player.y = Math.min(Math.max(r, state.player.y), ch - r);
      }
      const pages = state.pages;
      for (let i = 0; i < pages.length; i++) {
        const p = pages[i];
        const r = p.r;
        p.x = Math.min(Math.max(r, p.x), cw - r);
        p.y = Math.min(Math.max(r, p.y), ch - r);
      }
      if (state.shadow) {
        state.shadow.x = Math.min(Math.max(0, state.shadow.x), cw);
        state.shadow.y = Math.min(Math.max(0, state.shadow.y), ch);
      }
    }
  }

  // ===== Init Game =====
  function initGame() {
    const radius = Math.max(2, Math.min(cw, ch) * 0.035);
    state.player = {
      x: cw * 0.5,
      y: ch * 0.8,
      r: radius,
      angle: -Math.PI / 2
    };
    state.pages = [];
    state.collected = 0;
    state.threatLevel = 0;
    state.shadow = {
      x: cw * 0.5,
      y: -ch * 0.2,
      speed: 18,         // slightly slower base to avoid instant catch
      active: false
    };
    state.lastTime = performance.now();
    state.touchTarget = null;
    state.gameOverReason = 'vanish';
    state.jumpscarePlaying = false;
    state.chaseWarmup = 0; // time since chase started

    const targetCount = window.gameConfig.pagesToCollect || 8;
    spawnPages(targetCount);
    updateHud();

    if (ui.container) {
      ui.container.classList.remove('shake');
    }
    if (ui.redFlash) {
      ui.redFlash.classList.remove('visible');
    }
    if (ui.jumpscareOverlay) {
      ui.jumpscareOverlay.classList.remove('visible');
    }
    if (ui.jumpscareVideo) {
      try {
        ui.jumpscareVideo.pause();
        ui.jumpscareVideo.currentTime = 0;
        ui.jumpscareVideo.muted = true;
      } catch(e) {}
    }

    setState('PLAYING');
    AudioManager.playBgm();
  }

  function restartGame() {
    AudioManager.playSfx('ui', 120);
    initGame();
  }

  function spawnPages(count) {
    state.pages.length = 0;
    const minMarginX = cw * 0.12;
    const minMarginY = ch * 0.18;
    const r = Math.max(1.5, Math.min(cw, ch) * 0.024);
    for (let i = 0; i < count; i++) {
      const lane = Math.random() < 0.5 ? 0.35 : 0.65;
      const offsetX = (Math.random() - 0.5) * cw * 0.06;
      const offsetY = (Math.random() - 0.5) * ch * 0.05;
      let x = cw * lane + offsetX;
      let y = minMarginY + (ch - minMarginY * 1.4) * (i / count) + offsetY;
      x = Math.min(Math.max(minMarginX, x), cw - minMarginX);
      y = Math.min(Math.max(r, y), ch - r);
      state.pages.push({
        x,
        y,
        r,
        collected: false,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }

  // ===== Input Handling =====
  function unlockAudio() {
    AudioManager.unlock();
  }

  function handleGameInput(e) {
    if (state.jumpscarePlaying) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    state.touchTarget = { x, y };
  }

  function handlePointerEnd() {
    state.touchTarget = null;
  }

  function isCanvasPointerEvent(e) {
    return !!(e && e.target === canvas);
  }

  function handleGlobalInput(e) {
    unlockAudio();

    if (state.jumpscarePlaying && ui.jumpscareOverlay && ui.jumpscareOverlay.classList.contains('visible')) {
      if (e && e.preventDefault) e.preventDefault();
      finishJumpscare();
      return;
    }

    if (gameState === 'PLAYING') {
      const type = e.type;
      if (!isCanvasPointerEvent(e)) {
        if (type === 'pointerup' || type === 'pointercancel') {
          handlePointerEnd();
        }
        return;
      }
      if (type === 'pointerdown' || type === 'pointermove') {
        if (e && e.preventDefault) e.preventDefault();
        handleGameInput(e);
      } else if (type === 'pointerup' || type === 'pointercancel') {
        if (e && e.preventDefault) e.preventDefault();
        handlePointerEnd();
      }
    }
  }

  function setupInput() {
    // [agent-note][stage4] repaired: mobile-action-path | element: gameplay canvas + restart button | action: scoped pointer suppression to canvas so taps on overlays/buttons still produce native activation
    window.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    window.addEventListener('pointermove', handleGlobalInput, { passive: false });
    window.addEventListener('pointerup', handleGlobalInput, { passive: false });
    window.addEventListener('pointercancel', handleGlobalInput, { passive: false });
    if (ui.restartBtn) {
      ui.restartBtn.addEventListener('click', restartGame);
    }
    if (ui.jumpscareOverlay) {
      ui.jumpscareOverlay.addEventListener('pointerdown', handleGlobalInput, { passive: false });
    }
  }

  // ===== HUD =====
  function updateHud() {
    const total = window.gameConfig.pagesToCollect || 8;
    if (ui.pagesCounter) {
      ui.pagesCounter.textContent = state.collected + ' / ' + total;
    }
    if (ui.threatIndicator) {
      const lvl = state.threatLevel;
      let label = 'Quiet';
      let colorClass = 'text-emerald-300';
      if (lvl > 1.5 && lvl <= 3) {
        label = 'Tracked';
        colorClass = 'text-amber-300';
      } else if (lvl > 3 && lvl <= 4.5) {
        label = 'Closing In';
        colorClass = 'text-rose-400';
      } else if (lvl > 4.5) {
        label = 'Contact';
        colorClass = 'text-rose-400';
      }
      ui.threatIndicator.textContent = label;
      ui.threatIndicator.className = 'text-[0.8rem] ' + colorClass;
    }
  }

  function showRedFlash() {
    if (!ui.redFlash) return;
    ui.redFlash.classList.add('visible');
    setTimeout(() => {
      if (ui.redFlash) ui.redFlash.classList.remove('visible');
    }, 200);
  }

  function vibrate(style) {
    try {
      window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
        action: 'vibrate',
        requestId: 'h5-' + Date.now(),
        version: '1.0',
        params: { style: style || 'light' }
      });
    } catch (e) {
      // silent fallback
    }
  }

  function showFeedbackGif(el, duration) {
    if (!el) return;
    el.classList.add('visible');
    clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(() => {
      el.classList.remove('visible');
    }, duration || 900);
  }

  function triggerHitFeedback() {
    showRedFlash();
    if (ui.container) {
      ui.container.classList.remove('shake');
      void ui.container.offsetWidth;
      ui.container.classList.add('shake');
    }
    showFeedbackGif(ui.dangerGif, 1100);
    vibrate('heavy');
    AudioManager.playSfx('hit', 180);
  }

  function triggerCollectFeedback() {
    showFeedbackGif(ui.collectGif, 850);
    vibrate('light');
    AudioManager.playSfx('collect', 100);
  }

  function maybeTriggerThreatWarning() {
    if (state.threatLevel >= 3.4 && !state.jumpscarePlaying) {
      showFeedbackGif(ui.dangerGif, 950);
      AudioManager.playSfx('warning', 1400);
    }
  }

  // ===== Jumpscare =====
  function playJumpscareAndEnd() {
    if (!ui.jumpscareOverlay || !ui.jumpscareVideo) {
      endGame('caught');
      return;
    }
    if (state.jumpscarePlaying) return;
    state.jumpscarePlaying = true;

    ui.jumpscareOverlay.classList.add('visible');
    vibrate('heavy');
    const bgmEl = document.getElementById('bgm_main');
    if (bgmEl) {
      try { bgmEl.pause(); } catch (e) {}
    }

    try {
      ui.jumpscareVideo.currentTime = 0;
      ui.jumpscareVideo.muted = false;
      ui.jumpscareVideo.play().catch(() => {
        // wait for user tap if autoplay blocked
      });
    } catch (e) {
      console.warn('Jumpscare play error', e);
      endGame('caught');
      state.jumpscarePlaying = false;
      return;
    }

    ui.jumpscareVideo.onended = function() {
      finishJumpscare();
    };
  }

  function finishJumpscare() {
    if (!state.jumpscarePlaying) {
      if (gameState !== 'GAMEOVER') {
        endGame('caught');
      }
      return;
    }
    state.jumpscarePlaying = false;
    if (ui.jumpscareOverlay) {
      ui.jumpscareOverlay.classList.remove('visible');
    }
    if (ui.jumpscareVideo) {
      try {
        ui.jumpscareVideo.pause();
        ui.jumpscareVideo.currentTime = 0;
        ui.jumpscareVideo.muted = true;
        ui.jumpscareVideo.onended = null;
      } catch (e) {}
    }
    endGame('caught');
  }

  // ===== Game Over =====
  function endGame(reason) {
    state.gameOverReason = reason;
    const total = window.gameConfig.pagesToCollect || 8;
    if (ui.finalPages) {
      ui.finalPages.textContent = state.collected + ' / ' + total;
    }
    if (ui.gameOverTitle && ui.gameOverSub) {
      if (reason === 'escape') {
         ui.gameOverTitle.textContent = 'You Secured the Files';
         ui.gameOverSub.textContent = 'The ward fades behind you as the last case file snaps shut in your grip.';
         showFeedbackGif(ui.collectGif, 1600);
         AudioManager.playSfx('win', 300);
       } else if (reason === 'caught') {
         ui.gameOverTitle.textContent = 'The Ward Caught Up';
         ui.gameOverSub.textContent = 'A shadow closes the hall before you can finish the collection run.';
         showFeedbackGif(ui.dangerGif, 1600);
         AudioManager.playSfx('fail', 300);
       } else {
         ui.gameOverTitle.textContent = 'Shift Lost';
         ui.gameOverSub.textContent = 'The ward swallowed your route. The remaining case files stay scattered.';
         showFeedbackGif(ui.dangerGif, 1200);
         AudioManager.playSfx('fail', 300);
      }
    }
    setState('GAMEOVER');
  }

  // ===== Game Loop & Rendering =====
  function update(dt) {
    if (!state.player) return;
    const safeDt = Math.min(dt, 0.05);
    const speed = (window.gameConfig.heroSpeed || 5) * 32;

    if (state.touchTarget && !state.jumpscarePlaying) {
      const dx = state.touchTarget.x - state.player.x;
      const dy = state.touchTarget.y - state.player.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1) {
        const step = speed * safeDt;
        const t = step / dist;
        const tt = t > 1 ? 1 : t;
        state.player.x += dx * tt;
        state.player.y += dy * tt;
        state.player.angle = Math.atan2(dy, dx);
      }
    }

    if (!isFinite(state.player.x) || !isFinite(state.player.y)) {
      state.player.x = cw * 0.5;
      state.player.y = ch * 0.8;
    }
    const pr = state.player.r;
    state.player.x = Math.min(Math.max(pr, state.player.x), cw - pr);
    state.player.y = Math.min(Math.max(pr, state.player.y), ch - pr);

    const total = window.gameConfig.pagesToCollect || 8;
    let newThreatFromCollect = 0;
    const pages = state.pages;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      p.pulse += safeDt * 2;
      if (!p.collected) {
        const dx = p.x - state.player.x;
        const dy = p.y - state.player.y;
        const dist = Math.hypot(dx, dy);
        const collectRadius = p.r * 2.3;
        if (dist < collectRadius) {
          p.collected = true;
          state.collected += 1;
          triggerCollectFeedback();
          newThreatFromCollect += 0.5; // slightly softer spike
          if (state.collected >= total) {
            endGame('escape');
          }
        }
      }
    }

    // threat builds a bit slower so monster doesn't immediately snap
    state.threatLevel += safeDt * (0.06 + state.collected * 0.06) + newThreatFromCollect;
    if (state.threatLevel > 6) state.threatLevel = 6;
    maybeTriggerThreatWarning();

    if (state.threatLevel > 1.5) {
      if (!state.shadow.active) {
        state.chaseWarmup = 0;
      }
      state.shadow.active = true;
    }

    if (state.shadow && state.shadow.active && !state.jumpscarePlaying) {
      state.chaseWarmup += safeDt;
      const s = state.shadow;
      const dx = state.player.x - s.x;
      const dy = state.player.y - s.y;
      const dist = Math.hypot(dx, dy) || 1;

      // warmup period before full-speed chase, to avoid 1-frame grab
      const warmupTime = 2.0; // seconds to ramp up
      const warmupFactor = Math.min(1, Math.max(0, state.chaseWarmup / warmupTime));

      const baseSpeed = s.speed;
      const chaseFactor = 0.7 + state.threatLevel * 0.5;
      const step = baseSpeed * chaseFactor * safeDt * warmupFactor;

      const invDist = 1 / dist;
      s.x += dx * invDist * step;
      s.y += dy * invDist * step;

      const jitterScale = 0.6 * safeDt;
      s.x += (Math.random() - 0.5) * jitterScale;
      s.y += (Math.random() - 0.5) * jitterScale;

      const catchDist = Math.min(cw, ch) * 0.08;
      // require monster to be close for a small continuous time instead of 1 frame
      if (!state._closeTimer) state._closeTimer = 0;
      if (dist < catchDist) {
        state._closeTimer += safeDt;
        if (state._closeTimer > 0.18) { // ~10 frames at 60fps
          triggerHitFeedback();
          playJumpscareAndEnd();
        }
      } else {
        state._closeTimer = 0;
      }
    }

    updateHud();
  }

  function drawCorridor() {
    const gTop = ctx.createLinearGradient(0, 0, 0, ch);
    gTop.addColorStop(0, '#050509');
    gTop.addColorStop(0.45, '#070711');
    gTop.addColorStop(1, '#000000');
    ctx.fillStyle = gTop;
    ctx.fillRect(0, 0, cw, ch);

    const floorH = ch * 0.55;
    ctx.save();
    ctx.translate(0, ch - floorH);
    const gFloor = ctx.createLinearGradient(0, 0, 0, floorH);
    gFloor.addColorStop(0, '#05050b');
    gFloor.addColorStop(0.4, '#050509');
    gFloor.addColorStop(1, '#000000');
    ctx.fillStyle = gFloor;
    ctx.fillRect(0, 0, cw, floorH);

    ctx.strokeStyle = 'rgba(200,200,220,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cw * 0.2, 0);
    ctx.lineTo(0, floorH);
    ctx.moveTo(cw * 0.8, 0);
    ctx.lineTo(cw, floorH);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(180,180,210,0.06)';
    const rows = 8;
    for (let i = 1; i < rows; i++) {
      const t = i / rows;
      const y = floorH * t;
      const xLeft = cw * (0.2 - 0.2 * t);
      const xRight = cw * (0.8 + 0.2 * t);
      ctx.beginPath();
      ctx.moveTo(xLeft, y);
      ctx.lineTo(xRight, y);
      ctx.stroke();
    }
    ctx.restore();

    const lightCount = 3;
    for (let i = 0; i < lightCount; i++) {
      const y = ch * 0.12 + (i / (lightCount - 0.1)) * ch * 0.5;
      const g = ctx.createRadialGradient(cw * 0.5, y, 0, cw * 0.5, y, ch * 0.18);
      g.addColorStop(0, 'rgba(240,240,255,0.24)');
      g.addColorStop(0.3, 'rgba(200,200,250,0.16)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cw, ch);
    }
  }

  function drawPages() {
    const accent = window.gameConfig.themeColor || '#d7263d';
    const pages = state.pages;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      if (p.collected) continue;
      const pulse = 0.14 * Math.sin(p.pulse * 3) + 1;
      const r = Math.max(0, p.r * pulse);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.pulse) * 0.1);
      ctx.fillStyle = 'rgba(245,245,250,0.95)';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 1;
      const w = r * 1.3;
      const h = r * 1.7;
      ctx.beginPath();
      ctx.rect(-w / 2, -h / 2, w, h);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = accent + 'aa';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(-w * 0.35, -h * 0.2);
      ctx.quadraticCurveTo(0, -h * 0.1, w * 0.35, -h * 0.05);
      ctx.moveTo(-w * 0.3, 0);
      ctx.lineTo(w * 0.2, h * 0.05);
      ctx.stroke();

      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3);
      g.addColorStop(0, accent + '33');
      g.addColorStop(1, accent + '00');
      ctx.fillStyle = g;
      ctx.globalCompositeOperation = 'screen';
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0, r * 3), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawPlayer() {
    if (!state.player) return;
    const p = state.player;
    const r = Math.max(0, p.r);
    const accent = window.gameConfig.themeColor || '#d7263d';

    ctx.save();
    ctx.translate(p.x, p.y);
    const coneAngle = Math.PI * 0.55;
    const dir = p.angle;
    const coneLen = Math.min(cw, ch) * 0.7;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, coneLen);
    g.addColorStop(0, 'rgba(255,255,255,0.78)');
    g.addColorStop(0.15, 'rgba(210,210,230,0.45)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, coneLen, dir - coneAngle / 2, dir + coneAngle / 2);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.globalCompositeOperation = 'lighten';
    ctx.fill();
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = '#050509';
    ctx.strokeStyle = 'rgba(230,230,240,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    const nr = r * 0.6;
    ctx.arc(0, 0, nr, p.angle - 0.5, p.angle + 0.5);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.0;
    ctx.stroke();
    ctx.restore();
  }

  function drawSirenHead() {
    if (!state.shadow || !state.shadow.active) return;
    const s = state.shadow;
    const baseR = Math.min(cw, ch) * 0.09;
    const time = performance.now() * 0.002;
    const pulse = 1 + Math.sin(time * 2) * 0.05;
    const r = Math.max(0, baseR * pulse);

    ctx.save();
    ctx.translate(s.x, s.y);

    const bodyH = r * 2.6;
    const bodyW = r * 0.4;
    const bodyGrad = ctx.createLinearGradient(0, -bodyH * 0.2, 0, bodyH * 0.8);
    bodyGrad.addColorStop(0, 'rgba(190,190,195,0.16)');
    bodyGrad.addColorStop(0.4, 'rgba(120,120,130,0.38)');
    bodyGrad.addColorStop(1, 'rgba(40,40,45,0.95)');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.7, 0);
    ctx.quadraticCurveTo(-bodyW, bodyH * 0.2, -bodyW * 0.6, bodyH);
    ctx.lineTo(bodyW * 0.6, bodyH);
    ctx.quadraticCurveTo(bodyW, bodyH * 0.2, bodyW * 0.7, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(50,50,55,0.9)';
    ctx.lineWidth = r * 0.16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-bodyW * 0.3, bodyH);
    ctx.lineTo(-bodyW * 0.5, bodyH + r * 0.9);
    ctx.moveTo(bodyW * 0.3, bodyH);
    ctx.lineTo(bodyW * 0.5, bodyH + r * 0.9);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(170,170,178,0.8)';
    ctx.lineWidth = r * 0.18;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -r * 0.9);
    ctx.stroke();

    const headY = -r * 1.1;
    const armLen = r * 0.7;
    ctx.strokeStyle = 'rgba(180,180,190,0.9)';
    ctx.lineWidth = r * 0.12;
    ctx.beginPath();
    ctx.moveTo(0, headY);
    ctx.lineTo(-armLen, headY - r * 0.1);
    ctx.moveTo(0, headY);
    ctx.lineTo(armLen, headY - r * 0.1);
    ctx.stroke();

    const sirenR = r * 0.45;
    function drawSingleSiren(side) {
      ctx.save();
      const offsetX = armLen * side;
      const offsetY = headY - r * 0.1;
      ctx.translate(offsetX, offsetY);
      ctx.rotate(side * 0.6);

      const shellGrad = ctx.createRadialGradient(-sirenR * 0.3, -sirenR * 0.1, sirenR * 0.2, 0, 0, sirenR);
      shellGrad.addColorStop(0, 'rgba(230,230,235,0.8)');
      shellGrad.addColorStop(0.4, 'rgba(160,160,170,0.95)');
      shellGrad.addColorStop(1, 'rgba(50,50,55,1)');
      ctx.fillStyle = shellGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, sirenR, sirenR * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(10,10,12,0.95)';
      ctx.beginPath();
      ctx.ellipse(0, 0, sirenR * 0.55, sirenR * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      const spin = (performance.now() * 0.007 * (side > 0 ? 1 : -1)) % (Math.PI * 2);
      ctx.save();
      ctx.rotate(spin);
      ctx.strokeStyle = 'rgba(210,210,220,0.7)';
      ctx.lineWidth = sirenR * 0.12;
      ctx.beginPath();
      ctx.arc(0, 0, sirenR * 0.33, 0, Math.PI * 1.4);
      ctx.stroke();
      ctx.restore();

      const eyeR = sirenR * 0.18;
      ctx.fillStyle = 'rgba(230,230,235,0.95)';
      ctx.beginPath();
      ctx.arc(0, -eyeR * 0.2, eyeR, 0, Math.PI * 2);
      ctx.fill();

      const blink = (Math.sin(performance.now() * 0.006 + side) + 1) * 0.5;
      const pupilR = eyeR * (0.25 + 0.25 * blink);
      ctx.fillStyle = '#050509';
      ctx.beginPath();
      ctx.arc(0, -eyeR * 0.2, pupilR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    drawSingleSiren(-1);
    drawSingleSiren(1);

    if (state.player) {
      const p = state.player;
      const playerDX = p.x - s.x;
      const playerDY = p.y - s.y;

      const baseArmLen = r * 2.4;
      const extraReach = Math.min(r * 1.4, (6 - Math.max(0, 6 - state.threatLevel * 1.2)) * r * 0.15);
      const totalArmLen = baseArmLen + extraReach;

      const dirAngle = Math.atan2(playerDY, playerDX);
      const sway = Math.sin(performance.now() * 0.004) * 0.18;
      const armAngleLeft = dirAngle + 0.3 + sway;
      const armAngleRight = dirAngle - 0.3 - sway;

      function drawArm(sideSign, baseAngle) {
        const shoulderY = r * 0.3;
        const shoulderX = bodyW * 0.8 * sideSign;

        const segments = 3;
        const segLen = totalArmLen / segments;
        const elbowBend = 0.35 * sideSign;
        const handTwitch = Math.sin(performance.now() * 0.006 + sideSign) * 0.08;

        ctx.strokeStyle = 'rgba(170,170,178,0.85)';
        ctx.lineWidth = r * 0.12;
        ctx.lineCap = 'round';
        ctx.beginPath();

        let x0 = shoulderX;
        let y0 = shoulderY;

        ctx.moveTo(x0, y0);

        for (let i = 0; i < segments; i++) {
          const t = i / (segments - 1);
          const bend = elbowBend * (i === 1 ? 1 : 0.4);
          const a = baseAngle + bend + handTwitch * t;
          const len = segLen * (1 + 0.08 * (Math.sin(time * 3 + i) ));
          const x1 = x0 + Math.cos(a) * len;
          const y1 = y0 + Math.sin(a) * len;
          ctx.lineTo(x1, y1);
          x0 = x1;
          y0 = y1;
        }
        ctx.stroke();

        const handLen = segLen * 0.35;
        const clawCount = 3;
        ctx.lineWidth = r * 0.07;
        ctx.strokeStyle = 'rgba(210,210,220,0.9)';
        for (let c = 0; c < clawCount; c++) {
          const spread = (c - (clawCount - 1) / 2) * 0.4;
          const ca = baseAngle + spread + handTwitch;
          const hx0 = x0;
          const hy0 = y0;
          const hx1 = hx0 + Math.cos(ca) * handLen;
          const hy1 = hy0 + Math.sin(ca) * handLen;
          ctx.beginPath();
          ctx.moveTo(hx0, hy0);
          ctx.lineTo(hx1, hy1);
          ctx.stroke();
        }
      }

      drawArm(-1, armAngleLeft);
      drawArm(1, armAngleRight);
    }

    const haloR = r * 3.0;
    const haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
    haloGrad.addColorStop(0, 'rgba(180,180,190,0.06)');
    haloGrad.addColorStop(0.45, 'rgba(120,120,130,0.12)');
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0, haloR), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
  }

  function draw() {
    if (!ctx) return;
    drawCorridor();
    drawPages();
    drawSirenHead();
    drawPlayer();
  }

  function loop(now) {
    try {
      const dt = (now - state.lastTime) / 1000;
      state.lastTime = now;
      if (gameState === 'PLAYING') {
        update(dt);
      }
      draw();
    } catch (e) {
      console.error('Loop error', e);
      if (state.player && (!isFinite(state.player.x) || !isFinite(state.player.y))) {
        state.player.x = cw * 0.5;
        state.player.y = ch * 0.5;
      }
    }
    requestAnimationFrame(loop);
  }

  // ===== DOM Ready =====
  document.addEventListener('DOMContentLoaded', function() {
    parseGameConfig();

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    ui.pagesCounter = document.getElementById('pages-counter');
    ui.threatIndicator = document.getElementById('threat-indicator');
    ui.hud = document.getElementById('hud');
    ui.gameOverScreen = document.getElementById('game-over-screen');
    ui.gameOverTitle = document.getElementById('game-over-title');
    ui.gameOverSub = document.getElementById('game-over-sub');
    ui.finalPages = document.getElementById('final-pages');
    ui.restartBtn = document.getElementById('restart-btn');
    ui.redFlash = document.getElementById('red-flash');
    ui.container = document.getElementById('game-container');
    ui.jumpscareOverlay = document.getElementById('jumpscare-overlay');
    ui.jumpscareVideo = document.getElementById('jumpscare-video');
    ui.collectGif = document.getElementById('collect-gif');
    ui.dangerGif = document.getElementById('danger-gif');

    AudioManager.init();
    setupInput();

    const ro = new ResizeObserver(entries => {
      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i];
        if (entry.target === canvas) {
          const cr = entry.contentRect;
          resize(cr.width, cr.height);
          if (!initialized) {
            initialized = true;
            initGame();
            state.lastTime = performance.now();
            requestAnimationFrame(loop);
          }
        }
      }
    });
    ro.observe(canvas);
  });
})();
</script>
