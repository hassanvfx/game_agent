<script>
/**
 * CORE SYSTEMS
 */

// --- CONFIGURATION ---
window.gameConfigDefs = {
    heroName: { type: "text", label: "Rocker Name", value: "Bonnie", min: 1, max: 20 },
    themeColor: { type: "color", label: "Neon Color", value: "#ff00ff" },
    shakeIntensity: { type: "number", label: "Impact Shake", value: 15, "min": 0, "max": 50 }
};
window.gameConfig = {
    heroName: "Bonnie",
    themeColor: "#ff00ff",
    shakeIntensity: 15
};
window.updateGameConfig = (key, val) => {
    if(window.gameConfig.hasOwnProperty(key)) {
        window.gameConfig[key] = val;
        // Hot reload logic
        if(key === 'themeColor') {
            document.documentElement.style.setProperty('--theme-color', val);
        }
    }
};

// --- AUDIO MANAGER ---
const AudioSys = {
    ctx: null,
    unlocked: false,
    bgmStarted: false,
    bgmEl: null,
    sfxEls: {},
    lastPlayedAt: {},
    
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        this.bgmEl = document.getElementById('bgm_main');
        this.sfxEls = {
            sfx_reward: document.getElementById('sfx_reward'),
            sfx_hit: document.getElementById('sfx_hit'),
            sfx_hype: document.getElementById('sfx_hype'),
            sfx_start: document.getElementById('sfx_start')
        };
        
        const unlock = () => {
            if (this.unlocked) return;
            this.ctx.resume().then(() => {
                this.unlocked = true;
                this.playBgm();
                ['pointerdown', 'keydown'].forEach(e => window.removeEventListener(e, unlock));
            }).catch(() => {});
        };
        ['pointerdown', 'keydown'].forEach(e => window.addEventListener(e, unlock, { passive: false }));
    },

    playBgm() {
        const el = this.bgmEl || document.getElementById('bgm_main');
        if (!el || this.bgmStarted) return;
        this.bgmStarted = true;
        el.volume = 0.2;
        el.currentTime = 0;
        el.play().catch(() => {
            this.bgmStarted = false;
        });
    },

    playSfx(id, fallbackType = 'beep', cooldown = 90) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        const now = performance.now();
        if (this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < cooldown) return;
        this.lastPlayedAt[id] = now;
        
        const el = this.sfxEls[id] || document.getElementById(id);
        if (el) {
            try {
                const clone = el.cloneNode();
                clone.volume = 0.55;
                clone.play().catch(() => this.synthesize(fallbackType));
                return;
            } catch (e) {
                this.synthesize(fallbackType);
                return;
            }
        }
        this.synthesize(fallbackType);
    },

    synthesize(type) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.sfxGainNode || this.ctx.destination);

        if (type === 'kiss') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
    }
};

const Game = {
    gifMap: {
        kiss: 'https://i.giphy.com/B2sgQeOCaBDnMfMgXy.webp',
        hit: 'https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp',
        crazy: 'https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp'
    },
    feedbackTimer: null,
    reactionOverlay: null,
    reactionGif: null,
    reactionChip: null,
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    
    // State
    obsession: 0,
    shake: 0,
    particles: [],
    hero: {
        img: null,
        x: 0, 
        y: 0,
        baseY: 0,
        scale: 1,
        rotation: 0,
        floatOffset: 0
    },
    
    init() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        
        // Resize Handler
        const resize = () => {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            this.canvas.width = this.width * dpr;
            this.canvas.height = this.height * dpr;
            this.canvas.style.width = this.width + 'px';
            this.canvas.style.height = this.height + 'px';
            this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            // Re-center hero
            this.hero.x = this.width / 2;
            this.hero.baseY = this.height * 0.55; // Slightly lower center
            // Scale based on screen width
            const scaleBase = Math.min(this.width, this.height);
            this.hero.scale = (scaleBase / 800) * 0.8; 
        };
        window.addEventListener('resize', resize);
        resize();

        // Load Asset
        const imgEl = document.getElementById('asset_player');
        if (imgEl && imgEl.src) {
            this.hero.img = imgEl;
        }
        this.reactionOverlay = document.getElementById('reaction-overlay');
        this.reactionGif = document.getElementById('reaction-gif');
        this.reactionChip = document.getElementById('reaction-chip');

        // Start Loop
        requestAnimationFrame(t => this.loop(t));
    },

    spawnParticle(x, y, type) {
        const count = type === 'hit' ? 20 : 10;
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - (type === 'kiss' ? 2 : 0), // Float up for kiss
                life: 1.0,
                color: type === 'kiss' ? '#ff00ff' : (type === 'hit' ? '#ff0000' : '#00ffff'),
                type: type,
                size: Math.random() * 5 + 2
            });
        }
    },

    showReaction(type, label) {
        if (!this.reactionOverlay || !this.reactionGif || !this.reactionChip) return;
        const src = this.gifMap[type] || this.gifMap.crazy;
        this.reactionGif.src = src;
        this.reactionChip.textContent = label;
        this.reactionOverlay.classList.add('active');
        this.reactionChip.classList.add('active');
        if (this.feedbackTimer) clearTimeout(this.feedbackTimer);
        this.feedbackTimer = setTimeout(() => {
            this.reactionOverlay.classList.remove('active');
            this.reactionChip.classList.remove('active');
        }, 1400);
    },

    triggerAction(action) {
        // Update State
        this.obsession = Math.min(100, this.obsession + 5);
        document.getElementById('score-display').innerText = this.obsession + "%";
        document.getElementById('meter-bar').style.width = this.obsession + "%";

        // Visual Feedback
        if (action === 'kiss') {
            this.spawnParticle(this.width/2, this.height/2, 'kiss');
            AudioSys.playSfx('sfx_reward', 'kiss', 110);
            this.hero.scale *= 1.1; // Pulse
            this.showReaction('kiss', 'Starry Charm');
        } else if (action === 'bite' || action === 'hit') {
            this.shake = window.gameConfig.shakeIntensity;
            this.spawnParticle(this.width/2, this.height/2, 'hit');
            AudioSys.playSfx('sfx_hit', 'hit', 120);
            this.showReaction('hit', action === 'hit' ? 'Amp Smash' : 'Static Tease');
            // Flash red background
            this.ctx.fillStyle = 'rgba(255,0,0,0.3)';
            this.ctx.fillRect(0,0,this.width, this.height);
        } else {
            this.spawnParticle(this.width/2, this.height/2, 'spark');
            AudioSys.playSfx('sfx_hype', 'kiss', 100);
            this.showReaction('crazy', 'Crowd Pop');
        }

        // Dialogue
        const lines = DIALOGUE[action];
        const text = lines[Math.floor(Math.random() * lines.length)];
        this.showDialogue(text);
    },

    showDialogue(text) {
        const bubble = document.getElementById('speech-bubble');
        const p = document.getElementById('dialogue-text');
        
        // Reset animation
        bubble.classList.remove('visible');
        
        setTimeout(() => {
            p.innerText = text;
            bubble.classList.add('visible');
        }, 50);

        // Auto hide after 3s
        if(this.dialogueTimer) clearTimeout(this.dialogueTimer);
        this.dialogueTimer = setTimeout(() => {
            bubble.classList.remove('visible');
        }, 3500);
    },

    update(dt) {
        // Shake decay
        if (this.shake > 0) {
            this.shake -= dt * 60;
            if (this.shake < 0) this.shake = 0;
        }

        // Hero Float Animation
        this.hero.floatOffset += dt * 2;
        const hoverY = Math.sin(this.hero.floatOffset) * 10;
        
        // Scale return to normal
        const targetScale = (Math.min(this.width, this.height) / 800) * 0.8; 
        this.hero.scale += (targetScale - this.hero.scale) * dt * 5;

        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt * 1.5;
            p.vy += 0.1; // Gravity
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    draw() {
        // Clear Background with trail effect
        this.ctx.fillStyle = '#090011';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Draw Grid (Floor)
        this.ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for(let x=0; x<=this.width; x+=50) {
            this.ctx.moveTo(x, this.height/2);
            this.ctx.lineTo(x - (this.width/2 - x)*2, this.height);
        }
        this.ctx.stroke();

        // Apply Shake
        const shakeX = (Math.random() - 0.5) * this.shake;
        const shakeY = (Math.random() - 0.5) * this.shake;
        this.ctx.save();
        this.ctx.translate(shakeX, shakeY);

        // Draw Hero
        if (this.hero.img) {
            const h = this.hero.img.naturalHeight;
            const w = this.hero.img.naturalWidth;
            const aspect = w / h;
            
            // Calculate draw dimensions
            const drawH = this.height * 0.7 * this.hero.scale * 2; // Make him big
            const drawW = drawH * aspect;
            
            const drawX = this.hero.x - drawW / 2;
            const drawY = this.hero.baseY - drawH / 2 + Math.sin(this.hero.floatOffset) * 10;

            // Character-first hero stage lighting
            const backGlow = this.ctx.createRadialGradient(this.hero.x, this.hero.baseY - drawH * 0.1, 10, this.hero.x, this.hero.baseY, drawW * 0.85);
            backGlow.addColorStop(0, 'rgba(255, 110, 207, 0.3)');
            backGlow.addColorStop(0.45, 'rgba(109, 248, 255, 0.12)');
            backGlow.addColorStop(1, 'rgba(0,0,0,0)');
            this.ctx.fillStyle = backGlow;
            this.ctx.fillRect(0, 0, this.width, this.height);

            const halo = this.ctx.createLinearGradient(this.hero.x, drawY, this.hero.x, drawY + drawH);
            halo.addColorStop(0, 'rgba(255,255,255,0.18)');
            halo.addColorStop(0.35, 'rgba(255,255,255,0)');
            halo.addColorStop(1, 'rgba(255,255,255,0)');
            this.ctx.fillStyle = halo;
            this.ctx.beginPath();
            this.ctx.ellipse(this.hero.x, this.hero.baseY - drawH * 0.08, drawW * 0.28, drawH * 0.36, 0, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.save();
            this.ctx.shadowColor = 'rgba(255, 110, 207, 0.28)';
            this.ctx.shadowBlur = 26;
            this.ctx.drawImage(this.hero.img, drawX, drawY, drawW, drawH);
            this.ctx.restore();

            // Micro spotlight accents
            this.ctx.strokeStyle = 'rgba(255, 209, 102, 0.3)';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(this.hero.x - drawW * 0.18, drawY + drawH * 0.18);
            this.ctx.lineTo(this.hero.x - drawW * 0.12, drawY + drawH * 0.34);
            this.ctx.lineTo(this.hero.x - drawW * 0.02, drawY + drawH * 0.2);
            this.ctx.moveTo(this.hero.x + drawW * 0.18, drawY + drawH * 0.18);
            this.ctx.lineTo(this.hero.x + drawW * 0.12, drawY + drawH * 0.34);
            this.ctx.lineTo(this.hero.x + drawW * 0.02, drawY + drawH * 0.2);
            this.ctx.stroke();
        }

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            
            if (p.type === 'kiss') {
                // Heart shape approx
                this.ctx.font = `${p.size * 4}px Arial`;
                this.ctx.fillText('♥', p.x, p.y);
            } else {
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                this.ctx.fill();
            }
        });
        this.ctx.globalAlpha = 1;

        // Scanlines overlay
        this.ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for(let y=0; y<this.height; y+=4) {
            this.ctx.fillRect(0, y, this.width, 1);
        }

        this.ctx.restore();
    },

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        try {
            this.update(dt);
            this.draw();
        } catch(e) {
            console.error(e);
        }

        requestAnimationFrame(t => this.loop(t));
    }
};

// --- INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
    // Config Parsing
    const configEl = document.getElementById('game-config');
    if (configEl) {
        try {
            const parsed = JSON.parse(configEl.textContent);
            for(let key in parsed) {
                if(window.gameConfig.hasOwnProperty(key)) {
                    window.gameConfig[key] = parsed[key].value;
                }
            }
        } catch(e) { console.error("Config parse error", e); }
    }

    // Bind UI
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const actionBar = document.getElementById('action-bar');
    
    let gameStarted = false;
    const startGame = () => {
        if (gameStarted) return;
        gameStarted = true;
        AudioSys.init();
        AudioSys.playSfx('sfx_start', 'kiss', 0);
        startScreen.style.opacity = 0;
        setTimeout(() => startScreen.style.display = 'none', 500);
        actionBar.style.opacity = 1;
        Game.init();
    };

    // [agent-note][stage4] repaired: mobile-start-action | element: #start-btn | action: keep native tap/click path and share pointer/click start handler
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('pointerup', startGame);

    // Action Buttons
    document.querySelectorAll('.btn-action').forEach(btn => {
        const handler = (e) => {
            e.preventDefault();
            const action = btn.dataset.action;
            Game.triggerAction(action);
            
            // Button feedback
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 100);
        };
        
        btn.addEventListener('pointerdown', handler);
    });
    
    // Audio buffers are fetched after the first user gesture via AudioSys.init().
});

</script>
