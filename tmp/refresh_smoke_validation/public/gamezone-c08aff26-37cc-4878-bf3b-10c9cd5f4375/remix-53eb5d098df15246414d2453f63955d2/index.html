<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Rope Rush</title>
    <!-- [agent-note][stage4] preserve: font-role-map | title/hud -> Orbitron, body -> Exo 2 from catalogs/fonts.json -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap">
    <style>
        :root {
            --bg-deep: #090814;
            --bg-mid: #14122a;
            --panel: rgba(16, 15, 37, 0.72);
            --panel-border: rgba(102, 247, 255, 0.38);
            --accent-pink: #ff4fb3;
            --accent-cyan: #66f7ff;
            --accent-green: #7dffb3;
            --sand: #f0dfb0;
            --danger: #ff5b71;
            --text-main: #f8fbff;
            --text-soft: #b8c7e6;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(102, 247, 255, 0.14), transparent 32%),
                radial-gradient(circle at bottom, rgba(255, 79, 179, 0.12), transparent 30%),
                linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
            font-family: 'Exo 2', system-ui, sans-serif;
        }
        body {
            color: var(--text-main);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 100%),
                linear-gradient(rgba(255,255,255,0.03) 0 1px, transparent 1px 100%);
            background-size: 22px 22px;
            opacity: 0.28;
            mix-blend-mode: screen;
        }
        canvas { display: block; touch-action: none; }
        .glass {
            background: linear-gradient(180deg, rgba(21, 20, 47, 0.88), rgba(8, 9, 22, 0.8));
            backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 12px 30px rgba(0, 0, 0, 0.45),
                0 0 24px rgba(102, 247, 255, 0.14);
        }
        .pink-glow { text-shadow: 0 0 10px rgba(255, 79, 179, 0.85), 0 0 20px rgba(255, 79, 179, 0.35); }
        .green-glow { text-shadow: 0 0 10px rgba(125, 255, 179, 0.9), 0 0 22px rgba(125, 255, 179, 0.3); }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { inset: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .z-50 { z-index: 50; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-center { justify-content: center; }
        .items-center { align-items: center; }
        .select-none { user-select: none; -webkit-user-select: none; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .max-w-md { max-width: 28rem; }
        .w-90\% { width: 90%; }
        .p-8 { padding: 2rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .px-8 { padding-left: 2rem; padding-right: 2rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .gap-4 { gap: 1rem; }
        .rounded-xl { border-radius: 1rem; }
        .rounded { border-radius: 0.5rem; }
        .text-center { text-align: center; }
        .text-white { color: var(--text-main); }
        .text-black { color: #09111b; }
        .text-gray-300 { color: var(--text-soft); }
        .text-red-500 { color: var(--danger); }
        .text-\[\#00A86B\] { color: var(--accent-green); }
        .bg-\[\#FF0087\] {
            background: linear-gradient(135deg, #ff5cc0, #ff2b96);
            color: var(--text-main);
        }
        .bg-\[\#00A86B\] {
            background: linear-gradient(135deg, #20cf89, #0fae72);
            color: var(--text-main);
        }
        .bg-white {
            background: linear-gradient(135deg, #eef7ff, #cfe3ff);
        }
        .font-bold { font-weight: 700; }
        .tracking-widest { letter-spacing: 0.2em; }
        .text-lg { font-size: 1.125rem; line-height: 1.4; }
        .text-xl { font-size: 1.25rem; line-height: 1.4; }
        .text-2xl { font-size: 1.5rem; line-height: 1.3; }

        .runner-preview {
            display: flex;

            width: 112px;

            filter: drop-shadow(0 0 20px rgba(102, 247, 255, 0.28));
        }
        .runner-preview::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 68px;
            height: 14px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            filter: blur(5px);
        }
        .runner-preview .preview-head {
            position: absolute;
            top: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffcfb3;
            border: 2px solid rgba(255,255,255,0.55);
            z-index: 2;
        }
        .runner-preview .preview-body {
            position: absolute;
            top: 40px;
            width: 54px;
            height: 52px;
            border-radius: 18px 18px 12px 12px;
            background: var(--runner-color, #00A86B);
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08);
        }
        .runner-preview .preview-body::before,
        .runner-preview .preview-body::after {
            content: '';
            position: absolute;
            top: 8px;
            width: 5px;
            height: 34px;
            background: rgba(255,255,255,0.9);
            border-radius: 999px;
        }
        .runner-preview .preview-body::before { left: 9px; }
        .runner-preview .preview-body::after { right: 9px; }
        .runner-preview .preview-leg {
            position: absolute;
            bottom: 14px;
            width: 12px;
            height: 34px;
            border-radius: 999px;
            background: #1c2233;
        }
        .runner-preview .preview-leg.left { left: 42px; transform: rotate(8deg); }
        .runner-preview .preview-leg.right { right: 42px; transform: rotate(-8deg); }

        /* Dress Up Color Options */
        .color-opt {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.92);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: 0 0 0 3px rgba(8, 12, 25, 0.72);
        }
        .color-opt:active { transform: scale(0.9); }
        .color-opt.selected {
            box-shadow: 0 0 0 3px rgba(8, 12, 25, 0.72), 0 0 18px rgba(255,255,255,0.72);
            transform: scale(1.1);
            border-color: var(--accent-cyan);

        #win-meme-container img,

            min-height: 112px;

        @media (max-width: 640px) {
            .p-8 { padding: 1.25rem; }

            .text-3xl { font-size: 1.4rem; }

                margin-bottom: 0.75rem;
            }
            .hud-badge {
                padding: 0.36rem 0.7rem;
                max-width: calc(100vw - 2rem);
            }
        }
    </style>
</head>

<script>
/**
 * §4 Iron Laws & Logic
 */
document.addEventListener('DOMContentLoaded', () => {
    // --- Config System ---
    window.gameConfig = {
        jumpForce: 16,
        gravity: 0.8,
        ropeSpeedBase: 0.08,
        winScore: 1000,
        playerColor: '#00A86B' // Default Green
    };

    try {
        const configElement = document.getElementById('game-config');
        if (configElement) {
            const parsed = JSON.parse(configElement.textContent);
            for (const key in parsed) {
                window.gameConfig[key] = parsed[key].value;
            }
        }
    } catch (e) { console.error("Config parse error", e); }

    window.gameConfigDefs = {
        "jumpForce": { "type": "number", "label": "Jump Force", "value": 16, "min": 10, "max": 25 },
        "gravity": { "type": "number", "label": "Gravity", "value": 0.8, "min": 0.4, "max": 1.5 },
        "ropeSpeedBase": { "type": "number", "label": "Rope Speed", "value": 0.08, "min": 0.01, "max": 0.2 },
        "winScore": { "type": "number", "label": "Win Score", "value": 1000, "min": 100, "max": 5000 }
    };

    window.updateGameConfig = (key, val) => {
        if (window.gameConfig.hasOwnProperty(key)) {
            window.gameConfig[key] = val;
        }
    };

    // --- Audio System ---
    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
    const sounds = {
        bgm: document.getElementById('bgm_tense'),
        collect: document.getElementById('sfx_collect'),
        fail: document.getElementById('sfx_fail'),
        jump: document.getElementById('sfx_jump'),
        land: document.getElementById('sfx_land'),
        start: document.getElementById('sfx_start'),
        ui: document.getElementById('sfx_ui'),
        win: document.getElementById('sfx_win')
    };
    const soundVolumes = {
        bgm: 0.2,
        collect: 0.45,
        fail: 0.55,
        jump: 0.35,
        land: 0.28,
        start: 0.4,
        ui: 0.3,
        win: 0.5
    };
    const soundCooldowns = {
        collect: 90,
        jump: 90,
        land: 110,
        ui: 120
    };
    const lastSoundTimes = {};

    Object.entries(sounds).forEach(([id, el]) => {
        if (el) {
            el.volume = soundVolumes[id] ?? 0.4;
            el.preload = 'auto';
        }
    });

    const tryResumeAudio = () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
    };

    const playSound = (id) => {
        const now = performance.now();
        const cooldown = soundCooldowns[id] ?? 0;
        if (cooldown && now - (lastSoundTimes[id] || 0) < cooldown) return;
        lastSoundTimes[id] = now;

        tryResumeAudio();
        const el = sounds[id];
        if (el) {
            try {
                el.pause();
                el.currentTime = 0;
            } catch (_) {}
            el.play().catch(() => synthesizeSound(id));
        } else {
            synthesizeSound(id);
        }
    };

    const synthesizeSound = (type) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'collect' || type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(type === 'win' ? 720 : 800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'win' ? 1220 : 1200, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(330, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'land' || type === 'ui' || type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(type === 'land' ? 180 : 460, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(type === 'land' ? 120 : 320, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }
    };

    const syncGifFeedback = (containerId, assetId) => {
        const container = document.getElementById(containerId);
        const assetImg = document.getElementById(assetId);
        if (!container) return;
        container.innerHTML = '';
        if (assetImg) {
            const imgClone = assetImg.cloneNode();
            imgClone.hidden = false;
            imgClone.loading = 'lazy';
            imgClone.decoding = 'async';
            container.appendChild(imgClone);
        }
    };

    // --- Game State & Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'MENU'; // MENU, PLAY, GAMEOVER, WIN
    let score = 0;
    let frames = 0;
    let lastTime = 0;

    // Physics
    let player = {
        y: 0,
        vy: 0,
        onGround: true,
        width: 40,
        height: 80,
        color: window.gameConfig.playerColor
    };

    // Rope
    let rope = {
        angle: 0,
        speed: 0.05,
        z: 0 // Visual depth simulation
    };

    // Items
    let items = [];
    let particles = [];
    let shake = 0;

    // --- Resize Handling ---
    const resize = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    const handleInput = (e) => {
        if (e.type !== 'keydown') e.preventDefault();
        
        if (gameState === 'PLAY' && player.onGround) {
            player.vy = -window.gameConfig.jumpForce;
            player.onGround = false;
            playSound('jump');
            createParticles(window.innerWidth/2, window.innerHeight - 100, 10, '#fff');
        }
    };

    canvas.addEventListener('pointerdown', handleInput, { passive: false });
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') handleInput(e);
    });

    // --- Game Logic ---
    const startGame = () => {
        gameState = 'PLAY';
        score = 0;
        rope.angle = 0;
        rope.speed = window.gameConfig.ropeSpeedBase;
        items = [];
        particles = [];
        player.y = 0;
        player.vy = 0;
        player.onGround = true;
        player.color = window.gameConfig.playerColor;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        
        playSound('start');
        if (sounds.bgm) {
            sounds.bgm.volume = soundVolumes.bgm;
            sounds.bgm.currentTime = 0;
            sounds.bgm.play().catch(() => {});
        }
    };

    const gameOver = () => {
        gameState = 'GAMEOVER';
        shake = 20;
        playSound('fail');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        syncGifFeedback('fail-meme-container', 'asset_fail_meme');
        if (sounds.bgm) sounds.bgm.pause();
    };

    const gameWin = () => {
        gameState = 'WIN';
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('win-screen').classList.remove('hidden');
        document.getElementById('win-score').innerText = Math.floor(score);
        
        syncGifFeedback('win-meme-container', 'asset_win_meme');

        if (sounds.bgm) sounds.bgm.pause();
        playSound('win');
    };

    const spawnItem = () => {
        // Items "walk" towards player (scroll from right)
        // Or float by. Let's make them float from right to left at jump height
        items.push({
            x: window.innerWidth + 50,
            y: window.innerHeight - 150 - Math.random() * 100, // Jump height
            r: 15,
            active: true,
            type: Math.random() > 0.8 ? 'OP' : 'COIN'
        });
    };

    const createParticles = (x, y, count, color) => {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color
            });
        }
    };

    const update = (dt) => {
        if (gameState !== 'PLAY') return;

        // Physics
        if (!player.onGround) {
            player.vy += window.gameConfig.gravity;
            player.y += player.vy;
            if (player.y >= 0) {
                player.y = 0;
                player.vy = 0;
                player.onGround = true;
                // Landing particles
                createParticles(window.innerWidth/2, window.innerHeight - 100, 5, '#F5DEB3');
                playSound('land');
            }
        }

        // Rope Logic
        // Rope swings in a circle in 3D space (projected to 2D)
        // Angle 0 = Top (far), PI = Bottom (near/hit zone)
        // We actually want it to swing under feet.
        // Let's map angle 0..2PI.
        // Hit zone is around 3*PI/2 (270 deg) if we rotate clockwise?
        // Let's say Angle increases.
        // Visual: Ellipse.
        // Collision: When rope is "in front" and low.
        
        rope.angle += rope.speed;
        if (rope.angle > Math.PI * 2) {
            rope.angle -= Math.PI * 2;
            score += 10;
            // Speed up slightly
            rope.speed = Math.min(0.2, rope.speed + 0.001);
        }

        // Collision Check (Rope)
        // Rope hits when angle is near PI/2 (Bottom of screen/Front) AND player is on ground
        // Let's define "Hit Zone" as angle between 1.4 and 1.7 rad (approx PI/2)
        // Actually PI/2 is 1.57.
        const ropeY = Math.sin(rope.angle); // -1 to 1
        const ropeZ = Math.cos(rope.angle); // Depth
        
        // If rope is "close" (Z > 0) and Y is low (near ground)
        if (ropeZ > 0.8 && ropeY > 0.8) {
            // Check player height
            // Player Y is offset from ground (negative is up)
            // If player is not high enough (e.g. y > -20) -> Hit
            if (player.y > -20) {
                gameOver();
            }
        }

        // Items
        if (frames % 120 === 0) spawnItem();
        
        items.forEach(item => {
            item.x -= 5; // Move left
            
            // Collision Player vs Item
            const dx = item.x - window.innerWidth/2;
            const dy = item.y - (window.innerHeight - 100 + player.y - 40); // Center of player
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 40 && item.active) {
                item.active = false;
                playSound('collect');
                score += (item.type === 'OP' ? 100 : 50);
                createParticles(item.x, item.y, 10, '#FFD700');
                // Floating text
            }
        });
        
        // Cleanup
        items = items.filter(i => i.x > -50 && i.active);
        
        // Particles
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
        });
        particles = particles.filter(p => p.life > 0);

        // Score Update
        document.getElementById('score-display').innerText = Math.floor(score);
        if (score >= window.gameConfig.winScore) gameWin();
        
        frames++;
        if (shake > 0) shake *= 0.9;
        if (shake < 0.5) shake = 0;
    };

    const draw = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        
        // Clear
        ctx.fillStyle = '#2D2D2D'; // Dark wall
        ctx.fillRect(0, 0, w, h);

        // Shake
        ctx.save();
        if (shake > 0) {
            ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        }

        // Background (Squid Game Arena)
        // Floor
        ctx.fillStyle = '#F5DEB3';
        ctx.fillRect(0, h * 0.6, w, h * 0.4);
        
        // Wall Shapes
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(w*0.2, h*0.3, 40, 0, Math.PI*2); ctx.stroke(); // Circle
        ctx.strokeRect(w*0.5 - 40, h*0.3 - 40, 80, 80); // Square
        ctx.beginPath(); ctx.moveTo(w*0.8, h*0.3-40); ctx.lineTo(w*0.8-40, h*0.3+40); ctx.lineTo(w*0.8+40, h*0.3+40); ctx.closePath(); ctx.stroke(); // Triangle

        // Draw Items (Behind rope if z is far, but items are 2D overlay mostly)
        items.forEach(item => {
            ctx.fillStyle = item.type === 'OP' ? '#00FFFF' : '#FFD700';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.r, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#08111b';
            ctx.font = '700 12px "Exo 2"';
            ctx.fillText(item.type, item.x-8, item.y+4);
        });

        // Rope Logic for Drawing
        // We simulate a 3D swinging rope.
        // It's an ellipse that changes height based on sin(angle).
        // Actually, simpler: Quadratic Curve from Left to Right.
        // Control point moves up and down.
        
        const ropeY = Math.sin(rope.angle) * (h * 0.3); // Swing amplitude
        const ropeZ = Math.cos(rope.angle);
        
        // Draw Back part of rope (if behind player)
        const ropeColor = '#FF0087';
        
        if (ropeZ < 0) {
            drawRope(ctx, w, h, ropeY, ropeColor, 2);
        }

        // Player
        const px = w/2;
        const py = h - 100 + player.y; // Ground level is h-100
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(px, h - 90, 30 * (1 - player.y/-200), 10, 0, 0, Math.PI*2);
        ctx.fill();

        // Body
        ctx.fillStyle = player.color;
        ctx.fillRect(px - 20, py - 80, 40, 50); // Jacket
        ctx.fillStyle = '#1a1a1a'; // Pants
        ctx.fillRect(px - 20, py - 30, 40, 30);
        
        // Head
        ctx.fillStyle = '#ffccaa';
        ctx.beginPath();
        ctx.arc(px, py - 95, 15, 0, Math.PI*2);
        ctx.fill();
        
        // Tracksuit Stripe
        ctx.fillStyle = '#fff';
        ctx.fillRect(px - 18, py - 80, 5, 50);
        ctx.fillRect(px + 13, py - 80, 5, 50);

        // Draw Front part of rope
        if (ropeZ >= 0) {
            drawRope(ctx, w, h, ropeY, ropeColor, 4);
        }

        // Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
        });

        ctx.restore();
    };

    const drawRope = (ctx, w, h, offset, color, width) => {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        // Anchor points: Left and Right off screen
        // Control point: Center, moves up/down
        // Ground line is roughly h-100. Center of rope swing is h-150.
        const groundY = h - 100;
        const midY = h - 250;
        
        // When offset is positive (rope down), cpY is low.
        // When offset is negative (rope up), cpY is high.
        // We map sin wave to Y.
        
        const cpY = midY + offset * 2.5; // Amplify swing
        
        ctx.moveTo(0, midY);
        ctx.quadraticCurveTo(w/2, cpY, w, midY);
        ctx.stroke();
    };

    const loop = (timestamp) => {
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        
        update(dt);
        draw();
        requestAnimationFrame(loop);
    };

    // --- UI Event Listeners ---
    document.getElementById('start-btn').addEventListener('click', () => {
        // Unlock Audio
        tryResumeAudio();
        startGame();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        playSound('ui');
        startGame();
    });
    document.getElementById('win-restart-btn').addEventListener('click', () => {
        playSound('ui');
        startGame();
    });

    // Dress Up Logic
    const colorOpts = document.querySelectorAll('.color-opt');
    const runnerPreview = document.getElementById('runner-preview');
    const syncRunnerPreview = (color) => {
        if (runnerPreview) {
            runnerPreview.style.setProperty('--runner-color', color);
        }
    };
    syncRunnerPreview(window.gameConfig.playerColor);

    colorOpts.forEach(opt => {
        opt.addEventListener('click', (e) => {
            colorOpts.forEach(o => o.classList.remove('selected'));
            e.target.classList.add('selected');
            window.gameConfig.playerColor = e.target.dataset.color;
            player.color = window.gameConfig.playerColor;
            syncRunnerPreview(window.gameConfig.playerColor);
        });
    });

    requestAnimationFrame(loop);
});
</script>
</body>
</html>
