        button {
            font: inherit;

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .relative { position: relative; }

        .inset-0 { inset: 0; }
        .z-20 { z-index: 20; }
        .z-30 { z-index: 30; }

        .h-full { height: 100%; }

        .bg-black { background: #000; }
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .flex { display: flex; }
        .hidden { display: none; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .rounded { border-radius: 0.5rem; }
        .rounded-lg { border-radius: 0.75rem; }
        .rounded-xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .opacity-0 { opacity: 0; }
        .transition-opacity { transition: opacity 0.5s; }
        .transition-transform { transition: transform 0.15s; }
        .duration-300 { transition-duration: 0.3s; }
        .duration-500 { transition-duration: 0.5s; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-12 { padding-left: 3rem; padding-right: 3rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-5 { padding-top: 1.25rem; padding-bottom: 1.25rem; }
        .pb-8 { padding-bottom: 2rem; }
        .min-w-\[240px\] { min-width: 240px; }
        .max-w-xs { max-width: 20rem; }
        .w-12 { width: 3rem; }
        .h-12 { height: 3rem; }
        .w-16 { width: 4rem; }
        .h-16 { height: 4rem; }
        .text-\[10px\] { font-size: 10px; line-height: 1.2; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.5rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-4xl { font-size: 2.25rem; line-height: 1; }
        .text-5xl { font-size: clamp(2.8rem, 10vw, 4rem); line-height: 0.95; }
        .text-6xl { font-size: clamp(3.2rem, 12vw, 4.5rem); line-height: 0.95; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        .tracking-widest { letter-spacing: 0.2em; }
        .tracking-\[0\.4em\] { letter-spacing: 0.4em; }
        .text-white { color: #fff; }
        .text-gray-400 { color: #9ca3af; }
        .text-cyan-300 { color: #67e8f9; }
        .text-cyan-400 { color: #22d3ee; }
        .text-pink-300 { color: #f9a8d4; }
        .text-pink-500 { color: #ec4899; }
        .text-red-400 { color: #f87171; }
        .text-red-600 { color: #dc2626; }
        .border-2 { border-width: 2px; border-style: solid; }
        .border-cyan-500 { border-color: rgba(6, 182, 212, 0.85); }
        .border-pink-500 { border-color: rgba(236, 72, 153, 0.85); }
        .border-red-500\/30 { border-color: rgba(239, 68, 68, 0.3); }
        .bg-cyan-500\/20 { background-color: rgba(6, 182, 212, 0.2); }
        .bg-pink-500\/20 { background-color: rgba(236, 72, 153, 0.2); }
        .bg-black\/70 { background-color: rgba(0, 0, 0, 0.7); }
        .bg-black\/85 { background-color: rgba(0, 0, 0, 0.85); }

        .active\:scale-95:active { transform: scale(0.95); }

        .drop-shadow-\[0_0_25px_rgba\(255\,0\,0\,0\.8\)\] { filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.8)); }
        .skew-x-\[-10deg\] { transform: skewX(-10deg); }
        .skew-x-\[10deg\] { transform: skewX(10deg); }

        .backdrop-blur-sm,
        .backdrop-blur-md {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .bg-clip-text {
            -webkit-background-clip: text;
            background-clip: text;
        }

        .text-transparent {
            color: transparent;
        }

        .bg-gradient-to-b {
            background-image: linear-gradient(to bottom, #fff, #ec4899);
        }

        .glass-panel {

        }

        .hud-panel {
            position: relative;
            overflow: hidden;
        }

        .hud-panel::after {
            content: "";
            position: absolute;
            inset: auto 8% 0.2rem 8%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--laser-cyan), transparent);
            opacity: 0.75;

            font-size: 1.35rem;
            letter-spacing: 0.04em;
        }

        .hud-unit {
            font-size: 0.7rem;
            color: #f9a8d4;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        .title-font {
            font-family: 'Audiowide', 'Exo 2', system-ui, sans-serif;
            letter-spacing: 0.08em;

        .subtitle-chip {
            display: inline-block;
            padding: 0.35rem 0.8rem;

            border: 1px solid rgba(255,255,255,0.12);

            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;

            box-shadow: 0 4px 0 #55228f, 0 0 24px rgba(255, 0, 170, 0.28);
        }

        .btn-action::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.16) 35%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.35s ease;
        }

        .btn-action:hover::before,
        .btn-action:focus-visible::before {
            transform: translateX(100%);
        }

        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #55228f;
            filter: brightness(1.05);
        }

        .flash-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.1));
            opacity: 0;
            transition: opacity 0.1s;
        }

        .flash-left {
            left: 0;
            background: linear-gradient(90deg, rgba(0,255,255,0.2), transparent);
        }

        .flash-right {
            right: 0;
            background: linear-gradient(-90deg, rgba(255,0,255,0.2), transparent);
        }

        .flash-active { opacity: 1; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .scanlines::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        .tap-hint {
            animation: pulse 1.5s infinite;

        .control-card {
            position: relative;
            background: linear-gradient(180deg, rgba(10, 20, 38, 0.85), rgba(34, 11, 62, 0.9));
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.15);

        .control-card span[aria-hidden="true"] {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
        }

        .objective-card {
            max-width: min(20rem, calc(100vw - 2rem));
            background:
                linear-gradient(180deg, rgba(29, 14, 55, 0.95), rgba(11, 11, 30, 0.94)),
                var(--night-panel-strong);
            border: 1px solid rgba(255, 122, 24, 0.25);
            box-shadow: 0 0 20px rgba(255, 122, 24, 0.16);
        }

        .objective-title {
            color: #ffbf80;
        }

        .objective-copy {
            font-family: 'Exo 2', system-ui, sans-serif;
            font-size: 0.95rem;
            line-height: 1.35;
        }

        .feedback-banner {
            position: absolute;
            left: 50%;
            bottom: 8.5rem;
            transform: translateX(-50%) translateY(0.8rem);
            width: min(16rem, calc(100vw - 2rem));
            padding: 0.55rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(139, 246, 255, 0.38);
            background: rgba(7, 14, 31, 0.82);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.18);
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .feedback-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reaction-gif {
            position: absolute;
            right: 0.75rem;
            top: 5.4rem;
            width: min(30vw, 108px);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(3, 8, 22, 0.72);
            box-shadow: 0 0 18px rgba(255, 0, 170, 0.2);
            opacity: 0;
            transform: translateY(-0.5rem) scale(0.92);
            transition: opacity 0.25s ease, transform 0.25s ease;
            overflow: hidden;
        }

        .reaction-gif.show {
            opacity: 0.96;
            transform: translateY(0) scale(1);
        }

        .reaction-gif img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .reaction-gif-label {
            padding: 0.25rem 0.45rem 0.45rem;
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #f9a8d4;
            text-align: center;
        }

        @media (max-width: 640px) {
            .feedback-banner {
                bottom: 7.2rem;
                font-size: 0.74rem;
            }

            .reaction-gif {
                top: auto;
                bottom: 10.75rem;
                width: min(28vw, 92px);
            }
        }

        .screen-shell {
            background:
                radial-gradient(circle at center, rgba(255, 0, 170, 0.12), transparent 25%),
                rgba(0, 0, 0, 0.72);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div id="game-container" class="relative w-full h-full overflow-hidden bg-black scanlines">
        <canvas id="gameCanvas"></canvas>

        <div id="flash-left" class="flash-overlay flash-left"></div>
        <div id="flash-right" class="flash-overlay flash-right"></div>

            <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 pb-8">
                <!-- [agent-note][stage3] resolved-gif: danger + crash feedback use approved catalogs/gifs.json overlays kept off playfield -->
                <div id="feedback-banner" class="feedback-banner">Neon Drift</div>
                <div id="reaction-gif" class="reaction-gif" aria-live="polite">
                    <img id="reaction-gif-image" alt="Reaction effect" src="https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp">
                    <div id="reaction-gif-label" class="reaction-gif-label">Turbo Alert</div>
                </div>

            <div id="hud" class="flex justify-between items-start opacity-0 transition-opacity duration-500">
                <div class="glass-panel hud-panel px-4 py-2 rounded skew-x-[-10deg]">
                    <div class="text-[10px] text-pink-300 tracking-widest">ESCAPE</div>
                    <div class="hud-value font-bold text-white text-glow"><span id="score-val">0</span><span class="hud-unit">m</span></div>
                </div>

                <button id="sound-btn" class="pointer-events-auto glass-panel w-12 h-12 rounded-full flex items-center justify-center text-xl hover:bg-white/10 active:scale-95 transition-transform">
                    🔊
                </button>

                <div class="glass-panel hud-panel px-4 py-2 rounded skew-x-[10deg] text-right">
                    <div class="text-[10px] text-cyan-300 tracking-widest">PACE</div>
                    <div class="hud-value font-bold text-white text-glow"><span id="speed-val">0</span></div>

            <div id="start-screen" class="screen-shell absolute inset-0 flex flex-col items-center justify-center bg-black/70 backdrop-blur-sm pointer-events-auto transition-opacity duration-300 z-30">

                    <h2 class="subtitle-chip text-cyan-400 text-sm tracking-[0.4em] mb-2 font-bold">MIDNIGHT RUN</h2>
                    <h1 class="title-font text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b drop-shadow-[0_0_15px_rgba(255,0,255,0.5)] italic">
                        NEON<br>ESCAPE

                <div class="flex w-full max-w-xs justify-between px-4 mb-8">

                            <span class="text-2xl" aria-hidden="true">👈</span>

                    <div class="flex flex-col items-center tap-hint">
                        <div class="control-card w-16 h-16 border-2 border-pink-500 rounded-lg flex items-center justify-center bg-pink-500/20 mb-2">
                            <span class="text-2xl" aria-hidden="true">👉</span>

                        <span class="text-[10px] text-pink-300 tracking-widest">SWIPE RIGHT</span>

    <script type="module">
        /*
         * NEON ESCAPE
         * Mobile portrait endless lane dodger
         */

        const ASSETS = {
            bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3",
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3",
            laneMove: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            nearMiss: "https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3",
            crash: "https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3"
        };

        const GIFS = {
            warning: {
                src: "https://i.giphy.com/09YpqSjkbY8DrZXgQz.webp",
                label: "Turbo Alert"
            },
            crash: {
                src: "https://i.giphy.com/Ijdp1ho01IDHdPVJf0.webp",
                label: "Crash Burst"
            }
        };

        const AudioSys = {
            ctx: null,
            masterGain: null,
            bgmGain: null,
            sfxGain: null,
            bgmNode: null,
            muted: false,
            unlocked: false,
            activeSources: new Set(),
            sfxCooldowns: {},

            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();

                this.masterGain = this.ctx.createGain();
                this.bgmGain = this.ctx.createGain();
                this.sfxGain = this.ctx.createGain();

                this.bgmGain.gain.value = 0.22;
                this.sfxGain.gain.value = 0.55;
                this.masterGain.gain.value = this.muted ? 0 : 1;

                this.bgmGain.connect(this.masterGain);
                this.sfxGain.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);
            },

            async unlock() {
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') {
                        await this.ctx.resume();
                    }
                    this.unlocked = true;
                } catch (_) {}
            },

            toggle() {
                this.muted = !this.muted;
                if (this.masterGain) {
                    this.masterGain.gain.value = this.muted ? 0 : 1;
                }
                if (this.bgmNode) {
                    this.syncMuteState(this.bgmNode, 0.2);
                }
                if (!this.muted) {
                    this.unlock();
                }
                return this.muted;
            },

            createManagedAudio(url, loop = false) {
                const audio = new Audio(url);
                audio.loop = loop;
                audio.preload = "auto";
                return audio;
            },

            syncMuteState(audio, volume) {
                audio.volume = this.muted ? 0 : volume;
            },

            async playBGM() {
                await this.unlock();
                if (this.muted) return;

                if (!this.bgmNode) {
                    this.bgmNode = this.createManagedAudio(ASSETS.bgm, true);
                    this.syncMuteState(this.bgmNode, 0.2);
                }

                try {
                    this.bgmNode.currentTime = 0;
                } catch (_) {}

                this.syncMuteState(this.bgmNode, 0.2);
                this.bgmNode.play().catch(() => {});
            },

            stopBGM() {
                if (this.bgmNode) {
                    this.bgmNode.pause();
                }
            },

            playSFX(type) {
                if (!this.ctx || this.muted) return;

                const soundMap = {
                    start: { url: ASSETS.start, volume: 0.45, cooldown: 250 },
                    laneMove: { url: ASSETS.laneMove, volume: 0.28, cooldown: 70 },
                    nearMiss: { url: ASSETS.nearMiss, volume: 0.35, cooldown: 700 },
                    crash: { url: ASSETS.crash, volume: 0.5, cooldown: 400 }
                };

                const config = soundMap[type];
                if (!config) return;

                const now = performance.now();
                if ((this.sfxCooldowns[type] || 0) > now) return;
                this.sfxCooldowns[type] = now + config.cooldown;

                try {
                    const audio = this.createManagedAudio(config.url);
                    this.syncMuteState(audio, config.volume);

                    const cleanup = () => {
                        audio.removeEventListener('ended', cleanup);
                        audio.removeEventListener('error', cleanup);
                        this.activeSources.delete(audio);
                    };

                    audio.addEventListener('ended', cleanup, { once: true });
                    audio.addEventListener('error', cleanup, { once: true });
                    this.activeSources.add(audio);
                    audio.play().catch(cleanup);
                } catch (_) {}
            }
        };

        const CONFIG = {
            laneWidth: 260,
            roadWidth: 1000,
            cameraHeight: 1000,
            drawDistance: 15000,
            fov: 600,
            playerZ: 600,
            segmentLength: 200,
            colors: {
                skyTop: '#0f0518',
                skyBottom: '#4a0e36',
                grid: '#ff00ff',
                ground: '#120b1f',
                road: '#1a1a2e'
            }
        };

        let state = {
            active: false,
            width: 0,
            height: 0,
            lastTime: 0,
            score: 0,
            speed: 0,
            maxSpeed: 1800,
            position: 0,
            nearMissScoreGate: 0,
            feedbackTimer: null,
            reactionTimer: null,
            player: {
                x: 0,
                lane: 0,
                targetX: 0
            },
            obstacles: [],
            scenery: []
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const feedbackBanner = document.getElementById('feedback-banner');
        const reactionGif = document.getElementById('reaction-gif');
        const reactionGifImage = document.getElementById('reaction-gif-image');
        const reactionGifLabel = document.getElementById('reaction-gif-label');

        function showFeedback(message) {
            feedbackBanner.textContent = message;
            feedbackBanner.classList.add('show');
            clearTimeout(state.feedbackTimer);
            state.feedbackTimer = setTimeout(() => feedbackBanner.classList.remove('show'), 900);
        }

        function showReactionGif(type) {
            const gif = GIFS[type];
            if (!gif) return;
            reactionGifImage.src = gif.src;
            reactionGifLabel.textContent = gif.label;
            reactionGif.classList.add('show');
            clearTimeout(state.reactionTimer);
            state.reactionTimer = setTimeout(() => reactionGif.classList.remove('show'), type === 'crash' ? 1800 : 1000);
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            state.width = canvas.width;
            state.height = canvas.height;
        }
        window.addEventListener('resize', resize);
        resize();

        function setLane(dir) {
            if (!state.active) return;

            const newLane = state.player.lane + dir;
            if (newLane >= -1 && newLane <= 1) {
                state.player.lane = newLane;
                AudioSys.playSFX('laneMove');
                showFeedback(dir === -1 ? 'Lane Shift Left' : 'Lane Shift Right');

                const flashId = dir === -1 ? 'flash-left' : 'flash-right';
                const el = document.getElementById(flashId);
                el.classList.add('flash-active');
                setTimeout(() => el.classList.remove('flash-active'), 150);
            }
        }

        const container = document.getElementById('game-container');

        container.addEventListener('touchstart', (e) => {
            if (!state.active) return;
            if (e.cancelable) e.preventDefault();

            const touch = e.changedTouches[0];
            const halfWidth = window.innerWidth / 2;

            if (touch.clientX < halfWidth) {
                setLane(-1);
            } else {
                setLane(1);
            }
        }, { passive: false });

        container.addEventListener('mousedown', (e) => {
            if (!state.active) return;
            if (e.target.tagName === 'BUTTON') return;

            const halfWidth = window.innerWidth / 2;
            if (e.clientX < halfWidth) {
                setLane(-1);
            } else {
                setLane(1);
            }
        });

        function resetGame() {
            state.score = 0;
            state.speed = 0;
            state.position = 0;
            state.player.lane = 0;
            state.player.x = 0;
            state.player.targetX = 0;
            state.obstacles = [];
            state.scenery = [];
            state.nearMissScoreGate = 0;
            clearTimeout(state.feedbackTimer);
            clearTimeout(state.reactionTimer);
            feedbackBanner.classList.remove('show');
            reactionGif.classList.remove('show');

            for (let i = 0; i < 5; i++) {
                spawnObstacle(3000 + i * 2500);
            }
            for (let z = 0; z < CONFIG.drawDistance; z += 800) {
                spawnScenery(z);
            }

            document.getElementById('score-val').innerText = '0';
            document.getElementById('speed-val').innerText = '0';
        }

        function spawnObstacle(zOffset) {
            const lane = Math.floor(Math.random() * 3) - 1;
            const z = (zOffset !== undefined) ? zOffset : (state.position + CONFIG.drawDistance);

            const tooClose = state.obstacles.some(o => Math.abs(o.z - z) < 1000);
            if (!tooClose) {
                state.obstacles.push({
                    lane: lane,
                    x: lane * CONFIG.laneWidth,
                    z: z,
                    type: Math.random() > 0.7 ? 'truck' : 'car'
                });
            }
        }

        function spawnScenery(z) {
            state.scenery.push({ x: -CONFIG.roadWidth / 2 - 200, z: z });
            state.scenery.push({ x: CONFIG.roadWidth / 2 + 200, z: z });
        }

        function gameOver() {
            state.active = false;
            AudioSys.stopBGM();
            AudioSys.playSFX('crash');
            showFeedback('Crash Detected');
            showReactionGif('crash');

            document.getElementById('hud').classList.add('opacity-0');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(state.score);
        }

        function project(x, y, z) {
            const scale = CONFIG.fov / (CONFIG.fov + z);
            const x2d = (x * scale) + (state.width / 2);
            const y2d = (y * scale) + (state.height / 2);
            return { x: x2d, y: y2d, scale: scale };
        }

        function update(dt) {
            const targetSpeed = state.maxSpeed;
            if (state.speed < targetSpeed) {
                state.speed += dt * 300;
            }

            const moveDist = state.speed * dt;
            state.position += moveDist;
            state.score += moveDist / 100;

            state.player.targetX = state.player.lane * CONFIG.laneWidth;
            const lerpFactor = 10 * dt;
            state.player.x += (state.player.targetX - state.player.x) * lerpFactor;

            if (state.position % 1500 < moveDist) {
                if (Math.random() < 0.65) spawnObstacle();
            }
            if (state.position % 800 < moveDist) {
                spawnScenery(state.position + CONFIG.drawDistance);
            }

            const trafficSpeed = state.speed * 0.3;

            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obs = state.obstacles[i];
                obs.z += trafficSpeed * dt;

                if (obs.z < state.position - 500) {
                    state.obstacles.splice(i, 1);
                    continue;
                }

                const relZ = obs.z - state.position;
                const laneDelta = Math.abs(state.player.x - obs.x);
                if (relZ > CONFIG.playerZ + 180 && relZ < CONFIG.playerZ + 340 && laneDelta < 215 && state.score > state.nearMissScoreGate) {
                    state.nearMissScoreGate = state.score + 10;
                    AudioSys.playSFX('nearMiss');
                    showFeedback('Near Miss!');
                    showReactionGif('warning');
                }
                if (Math.abs(relZ - CONFIG.playerZ) < 250) {
                    if (laneDelta < 150) {
                        gameOver();
                    }
                }
            }

            for (let i = state.scenery.length - 1; i >= 0; i--) {
                if (state.scenery[i].z < state.position - 500) {
                    state.scenery.splice(i, 1);
                }
            }

            if (state.active) {
                document.getElementById('score-val').innerText = Math.floor(state.score);
                document.getElementById('speed-val').innerText = Math.floor(state.speed / 10);
            }
        }

        function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }

        function drawCar(x, z, scale, type) {
            const p = project(x, CONFIG.cameraHeight, z);
            const w = (type === 'player' ? 140 : 130) * scale;
            const h = (type === 'player' ? 70 : 80) * scale;
            const y = p.y - h;

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, w / 1.8, w / 4, 0, 0, Math.PI * 2);
            ctx.fill();

            if (type === 'player') {
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(p.x - w / 2, y, w, h);

                ctx.fillStyle = '#220011';
                ctx.fillRect(p.x - w * 0.35, y - h * 0.6, w * 0.7, h * 0.6);

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0000';
                ctx.fillStyle = '#ff5555';
                ctx.fillRect(p.x - w * 0.4, y + h * 0.2, w * 0.25, h * 0.3);
                ctx.fillRect(p.x + w * 0.15, y + h * 0.2, w * 0.25, h * 0.3);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(p.x - w * 0.15, y + h * 0.6, w * 0.3, h * 0.2);

            } else {
                ctx.fillStyle = type === 'truck' ? '#4444ff' : '#cccccc';
                ctx.fillRect(p.x - w / 2, y, w, h);

                ctx.fillStyle = '#111';
                ctx.fillRect(p.x - w * 0.4, y - h * 0.4, w * 0.8, h * 0.4);

                ctx.fillStyle = '#880000';
                ctx.fillRect(p.x - w * 0.4, y + h * 0.2, w * 0.2, h * 0.2);
                ctx.fillRect(p.x + w * 0.2, y + h * 0.2, w * 0.2, h * 0.2);
            }
        }

        function drawScenery(obj) {
            const relZ = obj.z - state.position;
            if (relZ < 100 || relZ > CONFIG.drawDistance) return;

            const p = project(obj.x, CONFIG.cameraHeight, relZ);
            const w = 20 * p.scale;
            const h = 400 * p.scale;

            ctx.fillStyle = '#2a1f3d';
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);

            ctx.shadowBlur = 15;
            ctx.shadowColor = CONFIG.colors.grid;
            ctx.fillStyle = CONFIG.colors.grid;
            ctx.beginPath();
            ctx.arc(p.x, p.y - h, w * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function draw() {
            const horizonY = state.height / 2;
            const grad = ctx.createLinearGradient(0, 0, 0, horizonY);
            grad.addColorStop(0, CONFIG.colors.skyTop);
            grad.addColorStop(1, CONFIG.colors.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, state.width, horizonY);

            ctx.fillStyle = '#ffaa00';
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.arc(state.width / 2, horizonY - 40, state.width * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = CONFIG.colors.ground;
            ctx.fillRect(0, horizonY, state.width, state.height - horizonY);

            const pTL = project(-CONFIG.roadWidth / 2, CONFIG.cameraHeight, CONFIG.drawDistance);
            const pTR = project(CONFIG.roadWidth / 2, CONFIG.cameraHeight, CONFIG.drawDistance);
            const pBL = project(-CONFIG.roadWidth / 2, CONFIG.cameraHeight, 100);
            const pBR = project(CONFIG.roadWidth / 2, CONFIG.cameraHeight, 100);

            drawPolygon(pTL.x, horizonY, pTR.x, horizonY, pBR.x, state.height, pBL.x, state.height, CONFIG.colors.road);

            const offset = -(state.position % CONFIG.segmentLength);
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();

            for (let z = 100; z < CONFIG.drawDistance; z += CONFIG.segmentLength) {
                const rZ = z + offset;
                if (rZ < 100) continue;
                const p1 = project(-CONFIG.roadWidth, CONFIG.cameraHeight, rZ);
                const p2 = project(CONFIG.roadWidth, CONFIG.cameraHeight, rZ);
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let z = 100; z < CONFIG.drawDistance; z += CONFIG.segmentLength * 2) {
                const rZ = z + offset;
                if (rZ > CONFIG.drawDistance) break;

                const l1 = project(-CONFIG.laneWidth / 2 - 5, CONFIG.cameraHeight, rZ);
                const l2 = project(-CONFIG.laneWidth / 2 + 5, CONFIG.cameraHeight, rZ);
                const l3 = project(-CONFIG.laneWidth / 2 + 5, CONFIG.cameraHeight, rZ + 100);
                const l4 = project(-CONFIG.laneWidth / 2 - 5, CONFIG.cameraHeight, rZ + 100);
                drawPolygon(l1.x, l1.y, l2.x, l2.y, l3.x, l3.y, l4.x, l4.y, '#fff');

                const r1 = project(CONFIG.laneWidth / 2 - 5, CONFIG.cameraHeight, rZ);
                const r2 = project(CONFIG.laneWidth / 2 + 5, CONFIG.cameraHeight, rZ);
                const r3 = project(CONFIG.laneWidth / 2 + 5, CONFIG.cameraHeight, rZ + 100);
                const r4 = project(CONFIG.laneWidth / 2 - 5, CONFIG.cameraHeight, rZ + 100);
                drawPolygon(r1.x, r1.y, r2.x, r2.y, r3.x, r3.y, r4.x, r4.y, '#fff');
            }

            const renderList = [];
            state.scenery.forEach(s => renderList.push({ ...s, type: 'scenery' }));
            state.obstacles.forEach(o => renderList.push({ ...o, type: o.type }));
            renderList.push({ x: state.player.x, z: state.position + CONFIG.playerZ, type: 'player' });

            renderList.sort((a, b) => b.z - a.z);

            renderList.forEach(obj => {
                const relZ = obj.z - state.position;
                if (relZ > 50 && relZ < CONFIG.drawDistance) {
                    const scale = project(obj.x, CONFIG.cameraHeight, relZ).scale;
                    if (obj.type === 'scenery') {
                        drawScenery(obj);
                    } else {
                        drawCar(obj.x, relZ, scale, obj.type);
                    }
                }
            });
        }

        function loop(timestamp) {
            if (!state.active) return;
            const dt = Math.min((timestamp - state.lastTime) / 1000, 0.1);
            state.lastTime = timestamp;

            update(dt);
            ctx.clearRect(0, 0, state.width, state.height);
            draw();

            requestAnimationFrame(loop);
        }

        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-screen').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('hud').classList.remove('opacity-0');

            await AudioSys.unlock();
            AudioSys.playSFX('start');
            AudioSys.playBGM();
            showFeedback('Run Started');
            state.active = true;
            state.lastTime = performance.now();
            resetGame();
            requestAnimationFrame(loop);
        });

        document.getElementById('restart-btn').addEventListener('click', async () => {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('opacity-0');

            await AudioSys.unlock();
            AudioSys.playSFX('start');
            AudioSys.playBGM();
            showFeedback('Run Restarted');
            state.active = true;
            state.lastTime = performance.now();
            resetGame();
            requestAnimationFrame(loop);
        });

        const soundBtn = document.getElementById('sound-btn');
        soundBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const isMuted = AudioSys.toggle();
            if (!isMuted) {
                await AudioSys.unlock();
                AudioSys.playSFX('laneMove');
                if (state.active) {
                    AudioSys.playBGM();
                }
                showFeedback('Audio Online');
            } else {
                AudioSys.stopBGM();
                showFeedback('Audio Muted');
            }
            soundBtn.innerText = isMuted ? '🔇' : '🔊';
        });
    </script>
</body>
</html>
