<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sudoku</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="../../../../../../../../../../../games_top_gameplays/assets/cdn.tailwindcss.com/3.4.17.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- [agent-note][stage3] resolved-font: title -> Cinzel, ui/body -> Orbitron via catalogs/fonts.json -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #160922;
      --bg-bottom: #060816;
      --panel: rgba(28, 15, 48, 0.88);
      --panel-border: #7df9ff;
      --panel-shadow: rgba(0, 0, 0, 0.45);
      --text-main: #f5ecff;
      --text-soft: #c8c6ff;
      --accent: #7df9ff;
      --accent-strong: #37d2ff;
      --violet: #a855f7;
      --gold: #ffe27a;
      --danger: #ff5d8f;
      --ink: #120818;
      --success: #76ffb4;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(125, 249, 255, 0.18), transparent 28%),
        radial-gradient(circle at bottom, rgba(168, 85, 247, 0.2), transparent 32%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text-main);
    }

    body {
      font-family: "Orbitron", "Exo 2", sans-serif;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(168, 85, 247, 0.18), transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    }

    #game-container::before,
    #game-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #game-container::before {
      background:
        linear-gradient(rgba(125, 249, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 249, 255, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.35;
    }

    #game-container::after {
      background: radial-gradient(circle at center, transparent 55%, rgba(4, 6, 16, 0.5) 100%);
    }

    canvas { display: block; touch-action: none; width: 100%; height: 100%; position: relative; z-index: 0; }
    .font-cinzel { font-family: "Cinzel", serif; letter-spacing: 1.5px; text-transform: uppercase; }
    .font-exo { font-family: "Orbitron", "Exo 2", sans-serif; letter-spacing: 0.06em; }

    .hud-pill {
      background: linear-gradient(180deg, rgba(34, 20, 58, 0.94), rgba(17, 10, 32, 0.94));
      border: 2px solid var(--panel-border);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 18px var(--panel-shadow),
        0 0 14px rgba(125, 249, 255, 0.18);
      border-radius: 14px;
      padding: 7px 12px;
      color: var(--text-main);
      backdrop-filter: blur(6px);
      min-width: 82px;
    }

    .game-over-panel {
      background: linear-gradient(180deg, rgba(25, 14, 43, 0.98), rgba(10, 7, 25, 0.98));
      border: 2px solid var(--panel-border);
      box-shadow:
        0 22px 40px rgba(0, 0, 0, 0.42),
        0 0 24px rgba(125, 249, 255, 0.18);
      border-radius: 22px;
      padding: 24px;
      width: min(90vw, 360px);
      text-align: center;
      color: var(--text-main);
    }

    .btn-pop {
      background: linear-gradient(180deg, var(--gold), #ffb84d);
      border: 2px solid #fff4c3;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      padding: 12px 20px;
      font-weight: 700;
      color: var(--ink);
      min-width: 44px;
      min-height: 44px;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
      cursor: pointer;
    }

    .btn-pop:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.24);
      filter: brightness(0.96);
    }

    .hidden { display: none !important; }

    #keypad-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 0 12px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .keypad-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 400px;
      width: 100%;
      pointer-events: auto;
      padding: 10px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(23, 14, 39, 0.88), rgba(10, 8, 22, 0.88));
      border: 1px solid rgba(125, 249, 255, 0.28);
      box-shadow: 0 18px 26px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
    }

    .key-btn {
      background: linear-gradient(180deg, rgba(246, 238, 255, 0.97), rgba(193, 236, 255, 0.92));
      border: 2px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.22),
        0 0 0 1px rgba(125, 249, 255, 0.16) inset;
      border-radius: 14px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Orbitron", "Exo 2", sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.05s, background 0.12s;
    }

    .key-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    .key-btn.active {
      background: linear-gradient(180deg, var(--accent), var(--violet));
      color: #ffffff;
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 8px rgba(55, 210, 255, 0.32);
    }

    #game-over-screen {
      background: rgba(7, 8, 21, 0.72);
      backdrop-filter: blur(6px);
    }

    .feedback-gif {
      position: absolute;
      right: 12px;
      width: min(22vw, 110px);
      max-height: 110px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(125, 249, 255, 0.35);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateY(8px) scale(0.94);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
      z-index: 40;
      background: rgba(10, 8, 22, 0.8);
    }

    .feedback-gif.visible {
      opacity: 0.92;
      transform: translateY(0) scale(1);
    }

    #combo-gif {
      top: 74px;
    }

    #fail-gif {
      top: 194px;
    }

    .gif-label {
      position: absolute;
      right: 18px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-main);
      background: rgba(10, 8, 22, 0.82);
      border: 1px solid rgba(125, 249, 255, 0.26);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 41;
      letter-spacing: 0.08em;
    }

    .gif-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #combo-label {
      top: 50px;
    }

    #fail-label {
      top: 170px;
    }

    @media (max-width: 640px) {
      .feedback-gif {
        width: 74px;
        max-height: 74px;
        right: 10px;
        border-radius: 12px;
      }

      #combo-gif { top: 78px; }
      #fail-gif { top: 160px; }
      #combo-label { top: 58px; }
      #fail-label { top: 140px; }

      .gif-label {
        font-size: 9px;
        right: 12px;
      }
    }

    @media (max-width: 480px) {
      .hud-pill { padding: 6px 10px; min-width: 74px; }
      .keypad-inner { gap: 7px; padding: 8px; }
      .key-btn { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="game-container" class="select-none">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none">
      <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe, restyled only -->
      <div id="hud" class="absolute top-4 left-0 right-0 px-4 flex items-center justify-between pointer-events-auto">
        <div class="hud-pill font-exo text-sm">Points: <span id="scoreText">0</span></div>
        <div class="font-cinzel text-2xl text-center text-cyan-200 drop-shadow-[0_0_12px_rgba(125,249,255,0.45)]">Rune Grid</div>
        <div class="hud-pill font-exo text-sm">Streak: <span id="comboText">0</span></div>
      </div>

      <!-- [agent-note][stage3] resolved-gif: combo/fail feedback overlays -> catalogs/gifs.json -->
      <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
      <div id="combo-label" class="gif-label font-exo">ARCANE FLOW</div>
      <img
        id="combo-gif"
        class="feedback-gif"
        src="https://i.giphy.com/dNLrXbRlB5wKNB3z57.webp"
        alt="Combo feedback"
        decoding="async"
        loading="lazy"
      >
      <div id="fail-label" class="gif-label font-exo">RUNE JAM</div>
      <img
        id="fail-gif"
        class="feedback-gif"
        src="https://i.giphy.com/3o7aTskHEUdgCQAXde.webp"
        alt="Fail feedback"
        decoding="async"
        loading="lazy"
      >

      <div id="keypad-container">
        <div id="keypad" class="keypad-inner pointer-events-auto">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key="0" style="font-size: 14px;">CLR</button>
        </div>
      </div>

      <div id="game-over-screen" class="hidden absolute inset-0 flex items-center justify-center bg-white/80 pointer-events-auto">
        <div id="game-over-panel" class="game-over-panel">
          <div class="font-cinzel text-5xl text-black">GRID SEALED</div>
          <div class="mt-4 font-exo text-black text-xl">Final Points: <span id="finalScoreText">0</span></div>
          <button id="restart-btn" class="btn-pop mt-6 font-exo text-xl w-full">NEW GRID</button>
        </div>
      </div>
    </div>

    <!-- [agent-note][stage3] resolved-audio: ui/correct/error/win + ambience loop -> catalogs/audios.json -->
    <audio id="bgm-loop" preload="none" loop crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ambience/arcade_loop_01.mp3"></audio>
    <audio id="sfx-ui-click" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_01.mp3"></audio>
    <audio id="sfx-blocked" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/blocked_01.mp3"></audio>
    <audio id="sfx-clear" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/menu_close_01.mp3"></audio>
    <audio id="sfx-correct" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/pickup_01.mp3"></audio>
    <audio id="sfx-bonus" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_01.mp3"></audio>
    <audio id="sfx-fail" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3"></audio>
    <audio id="sfx-win" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/level_complete_01.mp3"></audio>
    <audio id="sfx-restart" preload="none" crossorigin="anonymous" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3"></audio>

    <script id="game-config" type="application/x-game-config">
    {
      "themeColor": { "type": "color", "label": "Theme Color", "value": "#000000" },
      "difficulty": { "type": "number", "label": "Clue Density", "value": 0.3, "min": 0.0, "max": 0.6 }
    }
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreText = document.getElementById('scoreText');
      const comboText = document.getElementById('comboText');
      const finalScoreText = document.getElementById('finalScoreText');
      const gameOverScreen = document.getElementById('game-over-screen');
      const restartBtn = document.getElementById('restart-btn');
      const keypad = document.getElementById('keypad');
      const keyButtons = Array.from(keypad.querySelectorAll('.key-btn'));
      const comboGif = document.getElementById('combo-gif');
      const failGif = document.getElementById('fail-gif');
      const comboLabel = document.getElementById('combo-label');
      const failLabel = document.getElementById('fail-label');

      let cw = 0, ch = 0, dpr = window.devicePixelRatio || 1;
      let initialized = false;
      let gameState = 'PLAYING';

      let audioCtx = null;
      let audioUnlocked = false;

      // Config Sync
      const configEl = document.getElementById('game-config');
      const defs = JSON.parse(configEl.textContent);
      window.gameConfig = Object.keys(defs).reduce((acc, k) => ({...acc, [k]: defs[k].value}), {});

      const audioEls = {
        loop: document.getElementById('bgm-loop'),
        ui: document.getElementById('sfx-ui-click'),
        blocked: document.getElementById('sfx-blocked'),
        clear: document.getElementById('sfx-clear'),
        correct: document.getElementById('sfx-correct'),
        bonus: document.getElementById('sfx-bonus'),
        fail: document.getElementById('sfx-fail'),
        win: document.getElementById('sfx-win'),
        restart: document.getElementById('sfx-restart')
      };

      const feedbackTimers = {
        combo: 0,
        fail: 0
      };

      const audioState = {
        lastPlay: {},
        loopStarted: false
      };

      const state = {
        board: [],
        rows: 9,
        cols: 9,
        cell: 0,
        offsetX: 0,
        offsetY: 0,
        activeNumber: 1,
        score: 0,
        combo: 0,
        particles: [],
        shake: 0,
        cellAnims: Array.from({length: 81}, () => ({ scale: 1 }))
      };

      function configureAudio() {
        audioEls.loop.volume = 0.17;
        audioEls.ui.volume = 0.3;
        audioEls.blocked.volume = 0.34;
        audioEls.clear.volume = 0.24;
        audioEls.correct.volume = 0.26;
        audioEls.bonus.volume = 0.28;
        audioEls.fail.volume = 0.34;
        audioEls.win.volume = 0.42;
        audioEls.restart.volume = 0.3;
      }

      function initAudio() {
        if (!audioUnlocked) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioUnlocked = true;
          } catch (e) {
            console.warn('Audio context failed', e);
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        startLoop();
      }

      function startLoop() {
        if (audioState.loopStarted) return;
        const loop = audioEls.loop;
        if (!loop) return;
        loop.play().then(() => {
          audioState.loopStarted = true;
        }).catch(() => {});
      }

      function pauseLoop() {
        const loop = audioEls.loop;
        if (!loop) return;
        loop.pause();
        audioState.loopStarted = false;
      }

      function playAudio(name, debounceMs = 80, reset = true) {
        const el = audioEls[name];
        if (!el) return;
        const now = performance.now();
        if ((audioState.lastPlay[name] || 0) + debounceMs > now) return;
        audioState.lastPlay[name] = now;
        try {
          if (reset) el.currentTime = 0;
          const playPromise = el.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
        } catch (e) {}
      }

      function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      function triggerFeedback(kind, duration = 1200) {
        if (kind === 'combo') {
          comboGif.classList.add('visible');
          comboLabel.classList.add('visible');
          clearTimeout(feedbackTimers.combo);
          feedbackTimers.combo = setTimeout(() => {
            comboGif.classList.remove('visible');
            comboLabel.classList.remove('visible');
          }, duration);
          return;
        }
        failGif.classList.add('visible');
        failLabel.classList.add('visible');
        clearTimeout(feedbackTimers.fail);
        feedbackTimers.fail = setTimeout(() => {
          failGif.classList.remove('visible');
          failLabel.classList.remove('visible');
        }, duration);
      }

      function vibrate(style) {
        window.webkit?.messageHandlers?.gamezoneBridge?.postMessage({
          action: 'vibrate', requestId: 'h5-' + Date.now(), version: '1.0',
          params: { style }
        });
        if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 50 : 15);
      }

      function setState(s) {
        gameState = s;
        gameOverScreen.classList.toggle('hidden', s === 'PLAYING');
        if (s === 'GAMEOVER') {
          finalScoreText.textContent = state.score;
          vibrate('heavy');
          playAudio('win', 150, true);
          playTone(400, 'sine', 0.2, 0.12);
          setTimeout(() => playTone(600, 'sine', 0.4, 0.14), 200);
          triggerFeedback('combo', 1800);
          pauseLoop();
        } else if (s === 'PLAYING') {
          startLoop();
        }
      }

      function resize() {
        cw = window.innerWidth;
        ch = window.innerHeight;
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const boardSize = Math.min(cw * 0.95, ch * 0.55, 500);
        state.cell = boardSize / 9;
        state.offsetX = (cw - boardSize) / 2;
        state.offsetY = Math.max(80, ch * 0.15);
      }

      function generatePuzzle() {
        let tempBoard = Array(9).fill().map(() => Array(9).fill(0));

        function isValidTemp(board, r, c, n) {
          for (let i = 0; i < 9; i++) {
            if (board[r][i] === n) return false;
            if (board[i][c] === n) return false;
          }
          let br = Math.floor(r / 3) * 3;
          let bc = Math.floor(c / 3) * 3;
          for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
              if (board[br + i][bc + j] === n) return false;
            }
          }
          return true;
        }

        function fill(board) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (board[r][c] === 0) {
                let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                for (let n of nums) {
                  if (isValidTemp(board, r, c, n)) {
                    board[r][c] = n;
                    if (fill(board)) return true;
                    board[r][c] = 0;
                  }
                }
                return false;
              }
            }
          }
          return true;
        }

        fill(tempBoard);

        let density = Math.max(0, Math.min(0.6, window.gameConfig.difficulty || 0.3));
        let cluesToKeep = Math.floor(25 + (density / 0.6) * 30);
        let cellsToRemove = 81 - cluesToKeep;

        let removed = 0;
        while(removed < cellsToRemove) {
          let r = Math.floor(Math.random() * 9);
          let c = Math.floor(Math.random() * 9);
          if (tempBoard[r][c] !== 0) {
            tempBoard[r][c] = 0;
            removed++;
          }
        }

        state.board = [];
        for (let r = 0; r < 9; r++) {
          let row = [];
          for (let c = 0; c < 9; c++) {
            row.push({
              value: tempBoard[r][c],
              given: tempBoard[r][c] !== 0
            });
          }
          state.board.push(row);
        }
      }

      function isPlacementValid(r, c, n) {
        if (n === 0) return true;
        for (let i = 0; i < 9; i++) {
          if (i !== c && state.board[r][i].value === n) return false;
          if (i !== r && state.board[i][c].value === n) return false;
        }
        const br = Math.floor(r / 3) * 3;
        const bc = Math.floor(c / 3) * 3;
        for (let i = br; i < br + 3; i++) {
          for (let j = bc; j < bc + 3; j++) {
            if ((i !== r || j !== c) && state.board[i][j].value === n) return false;
          }
        }
        return true;
      }

      function initGame() {
        state.score = 0;
        state.combo = 0;
        state.particles = [];
        state.shake = 0;
        state.cellAnims.forEach(a => a.scale = 1);
        generatePuzzle();
        updateHUD();
        updateKeypad();
        comboGif.classList.remove('visible');
        failGif.classList.remove('visible');
        comboLabel.classList.remove('visible');
        failLabel.classList.remove('visible');
      }

      function updateHUD() {
        scoreText.textContent = state.score;
        comboText.textContent = state.combo;
      }

      function updateKeypad() {
        keyButtons.forEach(btn => {
          const k = parseInt(btn.dataset.key);
          btn.classList.toggle('active', k === state.activeNumber);
        });
      }

      function spawnParticles(x, y) {
        for (let i = 0; i < 12; i++) {
          state.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 1.0,
            size: Math.random() * 4 + 2
          });
        }
      }

      function handleInput(e) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const c = Math.floor((x - state.offsetX) / state.cell);
        const r = Math.floor((y - state.offsetY) / state.cell);

        if (r >= 0 && r < 9 && c >= 0 && c < 9) {
          const cell = state.board[r][c];

          if (cell.given) {
            state.shake = 3;
            vibrate('light');
            playAudio('blocked', 110);
            playTone(150, 'square', 0.08, 0.03);
            triggerFeedback('fail', 900);
            return;
          }

          const val = state.activeNumber;

          if (val === 0) {
            if (cell.value !== 0) {
              cell.value = 0;
              vibrate('light');
              playAudio('clear', 90);
              playTone(300, 'triangle', 0.08, 0.05);
              state.cellAnims[r * 9 + c].scale = 0.5;
            }
            return;
          }

          if (cell.value === val) return;

          const isValid = isPlacementValid(r, c, val);
          cell.value = val;
          state.cellAnims[r * 9 + c].scale = 1.4;

          if (isValid) {
            state.score += 10 + (state.combo * 5);
            state.combo++;
            spawnParticles(state.offsetX + (c + 0.5) * state.cell, state.offsetY + (r + 0.5) * state.cell);
            vibrate('light');
            playAudio(state.combo >= 3 ? 'bonus' : 'correct', 70);
            playTone(600 + state.combo * 50, 'sine', 0.12, 0.06);
            if (state.combo >= 2) {
              triggerFeedback('combo', 1000);
            }
          } else {
            state.combo = 0;
            state.shake = 10;
            vibrate('medium');
            playAudio('fail', 120);
            playTone(200, 'sawtooth', 0.16, 0.06);
            triggerFeedback('fail', 1100);
          }
          updateHUD();
          checkWin();
        }
      }

      function checkWin() {
        let full = true;
        let valid = true;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (state.board[r][c].value === 0) full = false;
            else if (!isPlacementValid(r, c, state.board[r][c].value)) valid = false;
          }
        }
        if (full && valid) setState('GAMEOVER');
      }

      function update(dt) {
        state.shake *= 0.9;
        state.particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt * 2;
        });
        state.particles = state.particles.filter(p => p.life > 0);
        state.cellAnims.forEach(a => a.scale += (1 - a.scale) * 0.2);
      }

       function draw() {
         ctx.clearRect(0, 0, cw, ch);

         const boardWidth = state.cell * 9;
         const boardHeight = state.cell * 9;
         const glowPad = Math.max(22, state.cell * 0.35);

         const shakeX = (Math.random() - 0.5) * state.shake;
         const shakeY = (Math.random() - 0.5) * state.shake;
         ctx.save();
         ctx.translate(shakeX, shakeY);

         const boardGradient = ctx.createLinearGradient(state.offsetX, state.offsetY, state.offsetX, state.offsetY + boardHeight);
         boardGradient.addColorStop(0, '#211338');
         boardGradient.addColorStop(1, '#0f1024');

         ctx.save();
         ctx.shadowColor = 'rgba(125, 249, 255, 0.22)';
         ctx.shadowBlur = 28;
         ctx.fillStyle = 'rgba(14, 9, 30, 0.98)';
         ctx.fillRect(state.offsetX - glowPad * 0.35, state.offsetY - glowPad * 0.35, boardWidth + glowPad * 0.7, boardHeight + glowPad * 0.7);
         ctx.restore();

         ctx.fillStyle = 'rgba(9, 6, 20, 0.82)';
         ctx.fillRect(state.offsetX + 10, state.offsetY + 12, boardWidth, boardHeight);

         ctx.fillStyle = boardGradient;
         ctx.strokeStyle = '#7df9ff';
         ctx.lineWidth = 3;
         ctx.fillRect(state.offsetX, state.offsetY, boardWidth, boardHeight);
         ctx.strokeRect(state.offsetX, state.offsetY, boardWidth, boardHeight);

         for (let boxR = 0; boxR < 3; boxR++) {
           for (let boxC = 0; boxC < 3; boxC++) {
             const x = state.offsetX + boxC * state.cell * 3;
             const y = state.offsetY + boxR * state.cell * 3;
             ctx.fillStyle = (boxR + boxC) % 2 === 0 ? 'rgba(125, 249, 255, 0.05)' : 'rgba(168, 85, 247, 0.07)';
             ctx.fillRect(x, y, state.cell * 3, state.cell * 3);
           }
         }

         for (let i = 0; i <= 9; i++) {
           ctx.lineWidth = i % 3 === 0 ? 3 : 1;
           ctx.strokeStyle = i % 3 === 0 ? 'rgba(125, 249, 255, 0.95)' : 'rgba(220, 232, 255, 0.22)';
           ctx.beginPath();
           ctx.moveTo(state.offsetX + i * state.cell, state.offsetY);
           ctx.lineTo(state.offsetX + i * state.cell, state.offsetY + boardHeight);
           ctx.stroke();
           ctx.beginPath();
           ctx.moveTo(state.offsetX, state.offsetY + i * state.cell);
           ctx.lineTo(state.offsetX + boardWidth, state.offsetY + i * state.cell);
           ctx.stroke();
         }

         ctx.textAlign = 'center';
         ctx.textBaseline = 'middle';
         for (let r = 0; r < 9; r++) {
           for (let c = 0; c < 9; c++) {
             const cell = state.board[r][c];
             if (cell.value !== 0) {
               const anim = state.cellAnims[r * 9 + c];
               const cx = state.offsetX + (c + 0.5) * state.cell;
               const cy = state.offsetY + (r + 0.5) * state.cell;
               const valid = isPlacementValid(r, c, cell.value);

               ctx.save();
               ctx.translate(cx, cy);
               ctx.scale(anim.scale, anim.scale);

               if (!valid) {
                 ctx.fillStyle = 'rgba(255, 93, 143, 0.24)';
                 ctx.fillRect(-state.cell/2 + 2, -state.cell/2 + 2, state.cell - 4, state.cell - 4);
                 ctx.shadowColor = 'rgba(255, 93, 143, 0.34)';
                 ctx.shadowBlur = 14;
                 ctx.fillStyle = '#ff8bb0';
               } else if (!cell.given) {
                 ctx.beginPath();
                 ctx.fillStyle = 'rgba(125, 249, 255, 0.12)';
                 ctx.arc(0, 0, state.cell * 0.29, 0, Math.PI * 2);
                 ctx.fill();
                 ctx.shadowColor = 'rgba(125, 249, 255, 0.28)';
                 ctx.shadowBlur = 10;
                 ctx.fillStyle = '#7df9ff';
               } else {
                 ctx.shadowColor = 'rgba(255, 226, 122, 0.18)';
                 ctx.shadowBlur = 8;
                 ctx.fillStyle = '#ffe27a';
               }

               ctx.font = `${cell.given ? '700' : '600'} ${Math.floor(state.cell * 0.5)}px "Orbitron", sans-serif`;
               if (isFinite(cx) && isFinite(cy)) {
                 ctx.fillText(cell.value, 0, 2);
               }
               ctx.restore();
             }
           }
         }

         state.particles.forEach(p => {
           ctx.fillStyle = `rgba(125,249,255,${Math.max(0, p.life) * 0.9})`;
           ctx.beginPath();
           ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
           ctx.fill();

           ctx.fillStyle = `rgba(255,226,122,${Math.max(0, p.life) * 0.5})`;
           ctx.beginPath();
           ctx.arc(p.x - 2, p.y + 1, Math.max(0, p.size * 0.45), 0, Math.PI * 2);
           ctx.fill();
         });

         ctx.restore();
       }

      function loop(now) {
        try {
          const dt = Math.min(0.05, (now - (loop.last || now)) / 1000);
          loop.last = now;
          update(dt);
          draw();
        } catch (e) {
          console.error("Loop error", e);
        }
        requestAnimationFrame(loop);
      }

      const ro = new ResizeObserver((entries) => {
        if (entries.length === 0) return;
        resize();
        if (!initialized) {
          configureAudio();
          initGame();
          initialized = true;
          requestAnimationFrame(loop);
        }
      });
      ro.observe(document.body);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) pauseLoop();
        else if (audioUnlocked && gameState === 'PLAYING') startLoop();
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        handleInput(e);
      }, { passive: false });

      keyButtons.forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          initAudio();
          state.activeNumber = parseInt(btn.dataset.key);
          updateKeypad();
          vibrate('light');
          playAudio('ui', 70);
          playTone(400, 'triangle', 0.08, 0.04);
        }, { passive: false });
      });

      restartBtn.addEventListener('click', () => {
        initAudio();
        playAudio('restart', 120);
        initGame();
        setState('PLAYING');
      });
    });
    </script>
  </div>
</body>
