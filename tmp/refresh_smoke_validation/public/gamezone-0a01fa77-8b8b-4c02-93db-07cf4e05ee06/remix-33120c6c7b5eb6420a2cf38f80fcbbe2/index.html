<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Courier: Data Run</title>
    <script src="assets/cdn.tailwindcss.com/3.4.17.js"></script>
    <!-- [agent-note][stage4] repaired: font-remap | action: switched ui/body away from prior Exo stack using catalog-approved Orbitron + Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060814;
            --bg-deep: #02030a;
            --panel: rgba(8, 15, 34, 0.78);
            --panel-edge: rgba(105, 224, 255, 0.42);
            --glow: #69e0ff;
            --glow-soft: rgba(105, 224, 255, 0.28);
            --accent: #7b7dff;
            --danger: #ff4d8d;
            --danger-soft: rgba(255, 77, 141, 0.32);
            --text: #eefbff;
            --muted: #8ea1c5;
            --gold: #ffd166;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(123, 125, 255, 0.18), transparent 36%),
                radial-gradient(circle at 20% 80%, rgba(105, 224, 255, 0.14), transparent 24%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            touch-action: manipulation;
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                linear-gradient(90deg, transparent 0 48%, rgba(105, 224, 255, 0.035) 50%, transparent 52%),
                linear-gradient(transparent 0 48%, rgba(123, 125, 255, 0.035) 50%, transparent 52%);
            background-size: 72px 72px;
            opacity: 0.55;
        }

        body::after {
            background:
                radial-gradient(circle at 15% 18%, rgba(255, 209, 102, 0.12), transparent 18%),
                radial-gradient(circle at 84% 24%, rgba(105, 224, 255, 0.1), transparent 16%),
                radial-gradient(circle at 50% 76%, rgba(255, 77, 141, 0.1), transparent 18%);
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .font-teko {
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .glass {
            position: relative;
            background:
                linear-gradient(180deg, rgba(15, 24, 52, 0.9), rgba(6, 10, 24, 0.92));
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                0 18px 40px rgba(0, 0, 0, 0.42),
                0 0 24px var(--glow-soft);
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 25%),
                linear-gradient(180deg, transparent, rgba(105, 224, 255, 0.08));
            pointer-events: none;
        }

        .neon-text {
            text-shadow:
                0 0 10px rgba(105, 224, 255, 0.88),
                0 0 24px rgba(105, 224, 255, 0.35);
        }

        .neon-danger {
            text-shadow:
                0 0 10px rgba(255, 77, 141, 0.88),
                0 0 22px rgba(255, 77, 141, 0.4);
        }

        .subcopy {
            font-family: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .signal-bar {
            position: relative;
            overflow: hidden;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(105, 224, 255, 0.3), rgba(123, 125, 255, 0.82), rgba(255, 77, 141, 0.52));
            box-shadow: 0 0 14px rgba(105, 224, 255, 0.35);
        }

        .signal-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: translateX(-100%);
            animation: sweep 3.2s linear infinite;
        }

        .action-btn {
            position: relative;
            overflow: hidden;
            font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.12em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .feedback-gif {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            width: min(26vw, 132px);
            border-radius: 1rem;
            border: 1px solid rgba(105, 224, 255, 0.4);
            background: rgba(3, 7, 18, 0.78);
            box-shadow: 0 0 22px rgba(105, 224, 255, 0.2);
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px) scale(0.94);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }

        .feedback-gif img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feedback-gif.visible {
            opacity: 0.92;
            transform: translateY(0) scale(1);
        }

        .feedback-gif.fail {
            border-color: rgba(255, 77, 141, 0.48);
            box-shadow: 0 0 24px rgba(255, 77, 141, 0.24);
        }

        .feedback-gif.success {
            border-color: rgba(255, 209, 102, 0.48);
            box-shadow: 0 0 24px rgba(255, 209, 102, 0.24);
        }

        .action-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0 30%, rgba(255, 255, 255, 0.2) 50%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 220ms ease;
        }

        .action-btn:hover::after,
        .action-btn:focus-visible::after {
            transform: translateX(120%);
        }

        .action-btn:active {
            transform: scale(0.96);
            filter: brightness(1.08);
        }

        .hud-chip {
            background: rgba(7, 14, 30, 0.78);
            border: 1px solid rgba(105, 224, 255, 0.28);
            border-radius: 999px;
            box-shadow: 0 0 14px rgba(105, 224, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        /* Pulse animation for "Speed Up" warning */
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; text-shadow: 0 0 10px rgba(255, 77, 141, 0.9); }
            50% { transform: scale(1.12); opacity: 0.84; text-shadow: 0 0 20px rgba(255, 77, 141, 1); }
        }

        @keyframes sweep {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        .animate-pulse-fast { animation: pulse-red 0.5s infinite; }

        @media (max-width: 640px) {
            .font-teko { letter-spacing: 0.05em; }
            .glass { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42), 0 0 18px rgba(105, 224, 255, 0.18); }
            .feedback-gif {
                width: min(30vw, 104px);
                right: 0.75rem;
                bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>

<!-- Assets -->
<!-- [agent-note][stage3] resolved-audio: bgm/ui/fail/warning -> catalogs/audios.json -->
<audio id="bgm_main" src="https://gamezone-virid.vercel.app/assets/audios/music/action_loop_02.mp3" preload="none" loop></audio>
<audio id="sfx_dead" src="https://gamezone-virid.vercel.app/assets/audios/ui/game_over_02.mp3" preload="auto"></audio>
<audio id="sfx_start" src="https://gamezone-virid.vercel.app/assets/audios/ui/start_game_01.mp3" preload="auto"></audio>
<audio id="sfx_restart" src="https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3" preload="auto"></audio>
<audio id="sfx_warning" src="https://gamezone-virid.vercel.app/assets/audios/sfx/warning_02.mp3" preload="auto"></audio>
<audio id="sfx_score" src="https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3" preload="auto"></audio>

<!-- UI Structure -->
<div id="game-container" class="relative w-full h-full select-none overflow-hidden">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-50 pointer-events-none flex flex-col justify-center items-center">
        
        <!-- Start Screen -->
        <div id="start-screen" class="glass p-6 sm:p-8 rounded-[1.75rem] text-center pointer-events-auto transition-all duration-300 w-11/12 max-w-md">
            <div class="flex items-center justify-center gap-3 mb-4 text-3xl" aria-hidden="true">
                <span>🛸</span><span>📡</span><span>⚡</span>
            </div>
            <h1 class="text-5xl sm:text-7xl font-teko text-white neon-text mb-1 leading-[0.9]">NEON<br>COURIER</h1>
            <div class="signal-bar w-full h-2 my-4"></div>
            <p class="text-cyan-100 font-teko text-2xl sm:text-3xl mb-2">DATA RUN</p>
            <p class="text-slate-300 subcopy text-sm sm:text-lg mb-3">Hold to climb, release to drop</p>
            <p class="text-slate-400 subcopy text-sm sm:text-base mb-7">Thread the firewall as the stream accelerates</p>
            <button id="start-btn" class="action-btn w-full py-4 bg-gradient-to-r from-cyan-500 via-sky-500 to-indigo-500 text-white font-teko text-2xl sm:text-4xl rounded-xl shadow-[0_0_24px_rgba(105,224,255,0.36)] border border-cyan-200/70">
                Deploy ✦
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden glass p-6 sm:p-8 rounded-[1.75rem] text-center pointer-events-auto w-11/12 max-w-md border border-rose-400/45">
            <div class="flex items-center justify-center gap-3 mb-4 text-3xl" aria-hidden="true">
                <span>💥</span><span>🧠</span><span>🔌</span>
            </div>
            <h2 class="text-5xl sm:text-7xl font-teko text-rose-400 neon-danger mb-2 leading-[0.9]">LINK<br>DROPPED</h2>
            <div class="text-3xl sm:text-5xl font-teko text-white mb-2">PACKETS: <span id="finalScore" class="text-cyan-300">0</span></div>
            <div class="text-lg sm:text-2xl subcopy text-slate-300 mb-8">Best run: <span id="bestScore" class="text-amber-300">0</span></div>
            <button id="restart-btn" class="action-btn w-full py-4 bg-gradient-to-r from-rose-500 via-pink-500 to-fuchsia-500 text-white font-teko text-2xl sm:text-4xl rounded-xl shadow-[0_0_24px_rgba(255,77,141,0.34)] border border-rose-200/70">
                Relink ✦
            </button>
        </div>

        <!-- HUD -->
        <!-- [agent-note][stage2] preserve: hud-layout | reason: already mobile-safe -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden">
            <div class="hud-chip px-4 py-2 text-2xl sm:text-5xl font-teko text-white neon-text drop-shadow-md">PACKETS <span id="score" class="text-amber-300">0</span></div>
            <div id="speed-indicator" class="hud-chip px-3 py-2 text-lg sm:text-3xl font-teko text-rose-400 neon-danger opacity-0 transition-opacity duration-300">TRACE SPIKE!</div>
        </div>

        <!-- [agent-note][stage3] resolved-gif: fail/warning feedback -> catalogs/gifs.json -->
        <!-- [agent-note][stage3] caution: keep-gif-off-playfield | reason: protect controls -->
        <div id="feedback-gif" class="feedback-gif" aria-hidden="true">
            <img id="feedback-gif-img" src="https://i.giphy.com/TSgSiHvrPYL7YNydFD.webp" alt="">
        </div>
    </div>
</div>

<script>
/**
 * Neon Courier: Data Run
 */

// --- Configuration & State ---
const CONFIG = {
    baseScrollSpeed: 11,     // Faster start (was 8)
    maxScrollSpeed: 22,      // Cap
    basePlayerSpeed: 11,     // Faster vertical (was 9)
    baseGapSize: 220,        // Tighter start (was 250)
    minGapSize: 150,         // Claustrophobic
    themeColor: "#69e0ff",
    accentColor: "#7b7dff",
    dangerColor: "#ff4d8d",
    goldColor: "#ffd166",
    accelerationRate: 0.001, // Speed increase per frame
    gapShrinkRate: 0.005     // Gap decrease per frame
};

// Game State
let state = {
    isPlaying: false,
    isGameOver: false,
    score: 0,
    highScore: 0,
    scrollSpeed: CONFIG.baseScrollSpeed,
    gapSize: CONFIG.baseGapSize,
    shake: 0,
    distance: 0,
    tunnelY: 0,
    mode: 'normal', // normal, jagged, tight
    modeTimer: 0
};

// Input
let input = {
    holding: false
};

// Entities
const player = {
    x: 0, y: 0, vy: 0,
    radius: 8,
    angle: 0,
    trail: []
};

let obstacles = []; // {x, y, w, h, type}
let particles = []; // {x, y, vx, vy, life, color}
let bgOffset = 0;
let lastMilestoneBucket = 0;
let lastWarningBucket = 0;
let gameOverTimeoutId = null;

// System
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let lastTime = 0;

// --- Audio System ---
const AudioSys = {
    ctx: null,
    enabled: false,
    lastPlayedAt: {},
    init: function() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.enabled = true;
    },
    resume: function() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        const bgm = document.getElementById('bgm_main');
        if (bgm && bgm.paused) {
            bgm.volume = 0.2;
            bgm.play().catch(() => {});
        }
    },
    stopLoop: function() {
        const bgm = document.getElementById('bgm_main');
        if (bgm && !bgm.paused) bgm.pause();
    },
    play: function(id, options = {}) {
        const el = document.getElementById(id);
        if (!el) return;
        const now = performance.now();
        const debounce = options.debounce ?? 120;
        if (debounce && this.lastPlayedAt[id] && now - this.lastPlayedAt[id] < debounce) return;
        this.lastPlayedAt[id] = now;
        el.volume = options.volume ?? 0.6;
        if (typeof options.currentTime === 'number') el.currentTime = options.currentTime;
        else el.currentTime = 0;
        el.play().catch(() => {});
    },
    playCrash: function() {
        this.play('sfx_dead', { volume: 0.82, debounce: 250 });
        this.synthCrash();
    },
    playWarning: function() {
        this.play('sfx_warning', { volume: 0.42, debounce: 1200 });
    },
    playScore: function() {
        this.play('sfx_score', { volume: 0.28, debounce: 180 });
    },
    playUi: function(id) {
        this.play(id, { volume: 0.5, debounce: 140 });
    },
    synthCrash: function() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }
};

const GifSys = {
    el: null,
    img: null,
    timeoutId: null,
    init: function() {
        this.el = document.getElementById('feedback-gif');
        this.img = document.getElementById('feedback-gif-img');
    },
    show: function(kind) {
        if (!this.el || !this.img) return;
        const gifMap = {
            fail: 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp',
            success: 'https://i.giphy.com/8Adr5r4FEMTqj5tU23.webp'
        };
        this.img.src = gifMap[kind] || gifMap.success;
        this.el.classList.remove('fail', 'success', 'visible');
        this.el.classList.add(kind);
        requestAnimationFrame(() => this.el.classList.add('visible'));
        clearTimeout(this.timeoutId);
        this.timeoutId = setTimeout(() => this.hide(), kind === 'fail' ? 1800 : 1200);
    },
    hide: function() {
        if (!this.el) return;
        this.el.classList.remove('visible');
    }
};

// --- Core Functions ---

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    if (!state.isPlaying) {
        player.x = window.innerWidth * 0.2;
        player.y = window.innerHeight * 0.5;
        state.tunnelY = window.innerHeight * 0.5;
    }
}

function init() {
    window.addEventListener('resize', resize);
    resize();
    GifSys.init();
    
    // Input Handling
    const onDown = (e) => {
        if (e.cancelable) e.preventDefault();
        input.holding = true;
        AudioSys.resume();
    };
    const onUp = (e) => {
        if (e.cancelable) e.preventDefault();
        input.holding = false;
    };

    // Touch & Mouse
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchend', onUp, { passive: false });
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mouseup', onUp);
    
    // UI Buttons
    document.getElementById('start-btn').addEventListener('click', () => {
        AudioSys.resume();
        AudioSys.playUi('sfx_start');
        GifSys.show('success');
        startGame();
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
        AudioSys.resume();
        AudioSys.playUi('sfx_restart');
        GifSys.show('success');
        resetGame();
        startGame();
    });

    requestAnimationFrame(loop);
}

function startGame() {
    clearTimeout(gameOverTimeoutId);
    state.isPlaying = true;
    state.isGameOver = false;
    state.score = 0;
    state.scrollSpeed = CONFIG.baseScrollSpeed;
    state.gapSize = CONFIG.baseGapSize;
    state.distance = 0;
    state.mode = 'normal';
    state.modeTimer = 0;
    
    obstacles = [];
    particles = [];
    player.trail = [];
    player.y = canvas.height / window.devicePixelRatio * 0.5;
    player.vy = 0;
    player.angle = 0;
    lastMilestoneBucket = 0;
    lastWarningBucket = 0;
    GifSys.hide();
    
    // Reset Tunnel
    state.tunnelY = canvas.height / window.devicePixelRatio * 0.5;
    
    // UI
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    AudioSys.resume();
    lastTime = performance.now();
}

function resetGame() {
    state.isPlaying = false;
    AudioSys.stopLoop();
    GifSys.hide();
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function gameOver() {
    if (state.isGameOver) return;
    state.isPlaying = false;
    state.isGameOver = true;
    state.shake = 25;
    AudioSys.stopLoop();
    AudioSys.playCrash();
    GifSys.show('fail');
    
    if (state.score > state.highScore) state.highScore = Math.floor(state.score);
    
    // Explosion particles
    for(let i=0; i<40; i++) {
        particles.push({
            x: player.x,
            y: player.y,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() - 0.5) * 20,
            life: 1.0,
            color: CONFIG.themeColor
        });
    }

    gameOverTimeoutId = setTimeout(() => {
        document.getElementById('finalScore').innerText = Math.floor(state.score);
        document.getElementById('bestScore').innerText = state.highScore;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
    }, 600);
}

// --- Game Loop ---

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.06);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function update(dt) {
    // Screen Shake Decay
    if (state.shake > 0) state.shake *= 0.9;
    if (state.shake < 0.5) state.shake = 0;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2.5;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (!state.isPlaying) return;

    const canvasH = canvas.height / window.devicePixelRatio;
    const canvasW = canvas.width / window.devicePixelRatio;

    // Progression
    state.scrollSpeed = Math.min(state.scrollSpeed + CONFIG.accelerationRate, CONFIG.maxScrollSpeed);
    state.gapSize = Math.max(state.gapSize - CONFIG.gapShrinkRate, CONFIG.minGapSize);
    
    // Show Speed Up indicator periodically
    const speedInt = Math.floor(state.scrollSpeed);
    const speedEl = document.getElementById('speed-indicator');
    if (speedInt > 12 && speedInt % 3 === 0 && (state.scrollSpeed - Math.floor(state.scrollSpeed)) < 0.1) {
        speedEl.classList.remove('opacity-0');
        speedEl.classList.add('animate-pulse-fast');
        if (lastWarningBucket !== speedInt) {
            lastWarningBucket = speedInt;
            AudioSys.playWarning();
            GifSys.show('fail');
        }
    } else {
        speedEl.classList.add('opacity-0');
        speedEl.classList.remove('animate-pulse-fast');
    }

    // Player Physics
    // Scale vertical speed with scroll speed to maintain dodgeability
    const currentVertSpeed = CONFIG.basePlayerSpeed * (state.scrollSpeed / 8) * 60; 
    
    player.vy = input.holding ? -currentVertSpeed : currentVertSpeed;
    player.y += player.vy * dt;
    
    // Angle
    const targetAngle = input.holding ? -Math.PI / 3.5 : Math.PI / 3.5; // Steeper angle (was /4)
    player.angle += (targetAngle - player.angle) * 18 * dt;

    // Bounds
    if (player.y < 0 || player.y > canvasH) gameOver();

    // Trail
    player.trail.push({x: player.x, y: player.y});
    if (player.trail.length > 25) player.trail.shift();
    const moveX = state.scrollSpeed * 60 * dt;
    for (let p of player.trail) p.x -= moveX;
    
    // Score
    state.score += moveX * 0.05;
    state.distance += moveX;
    const scoreInt = Math.floor(state.score);
    document.getElementById('score').innerText = scoreInt;
    const milestoneBucket = Math.floor(scoreInt / 25);
    if (milestoneBucket > 0 && milestoneBucket !== lastMilestoneBucket) {
        lastMilestoneBucket = milestoneBucket;
        AudioSys.playScore();
        GifSys.show('success');
    }

    // --- Obstacle Spawning (Procedural) ---
    bgOffset += moveX * 0.3; // Parallax

    const lastObs = obstacles[obstacles.length - 1];
    const spawnX = lastObs ? lastObs.x + 40 : canvasW; // 40px width segments

    // Fill screen with obstacles ahead
    if (spawnX < canvasW + 200) {
        // Mode Switching Logic
        state.modeTimer--;
        if (state.modeTimer <= 0) {
            const r = Math.random();
            if (r < 0.5) {
                state.mode = 'normal';
                state.modeTimer = 50; // 50 blocks
            } else if (r < 0.8) {
                state.mode = 'jagged'; // Sawtooth
                state.modeTimer = 30;
            } else {
                state.mode = 'tight'; // Flat but narrow
                state.modeTimer = 40;
            }
        }

        // Calculate Y change based on mode
        let change = 0;
        const margin = 100;
        
        if (state.mode === 'normal') {
            change = (Math.random() - 0.5) * 80;
        } else if (state.mode === 'jagged') {
            // Rapid zig zag
            change = (Math.random() > 0.5 ? 1 : -1) * 120;
        } else if (state.mode === 'tight') {
            // Slow drift
            change = (Math.random() - 0.5) * 20;
        }

        state.tunnelY += change;
        
        // Clamp
        if (state.tunnelY < margin) state.tunnelY = margin;
        if (state.tunnelY > canvasH - margin) state.tunnelY = canvasH - margin;

        // Effective Gap
        let currentGap = state.gapSize;
        if (state.mode === 'tight') currentGap *= 0.8; // Extra tight in tunnel mode

        const w = 40;
        
        // Push Blocks
        obstacles.push({
            x: spawnX, y: 0, w: w, h: state.tunnelY - currentGap / 2, type: 'block'
        });
        obstacles.push({
            x: spawnX, y: state.tunnelY + currentGap / 2, w: w, h: canvasH, type: 'block'
        });

        // Spikes
        if (state.score > 300 && Math.random() < 0.15) {
            obstacles.push({
                x: spawnX + w/2,
                y: state.tunnelY,
                w: 24, h: 24, type: 'spike'
            });
        }
    }

    // Update Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= moveX;

        if (checkCollision(player, obs)) gameOver();
        if (obs.x + obs.w < -100) obstacles.splice(i, 1);
    }
}

function checkCollision(p, obs) {
    // Player Hitbox (smaller than visual)
    const pr = 4; 
    
    if (obs.type === 'block') {
        return (p.x + pr > obs.x && p.x - pr < obs.x + obs.w &&
                p.y + pr > obs.y && p.y - pr < obs.y + obs.h);
    } else if (obs.type === 'spike') {
        // Diamond shape approx
        const dx = Math.abs(p.x - obs.x);
        const dy = Math.abs(p.y - obs.y);
        return (dx + dy < obs.w * 0.7); // Simple Manhattan distance check for diamond
    }
    return false;
}

function draw() {
    const canvasW = canvas.width / window.devicePixelRatio;
    const canvasH = canvas.height / window.devicePixelRatio;
    
    ctx.save();
    
    if (state.shake > 0) {
        ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
    }

    // BG
    const bgGradient = ctx.createLinearGradient(0, 0, 0, canvasH);
    bgGradient.addColorStop(0, "#090f24");
    bgGradient.addColorStop(0.5, "#050812");
    bgGradient.addColorStop(1, "#02030a");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvasW, canvasH);

    ctx.save();
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 3; i++) {
        const waveY = (Math.sin((bgOffset * 0.01) + i * 2.1) * 40) + canvasH * (0.25 + i * 0.24);
        const waveGradient = ctx.createLinearGradient(0, waveY - 40, 0, waveY + 40);
        waveGradient.addColorStop(0, "rgba(123, 125, 255, 0)");
        waveGradient.addColorStop(0.5, i === 1 ? "rgba(105, 224, 255, 0.08)" : "rgba(123, 125, 255, 0.08)");
        waveGradient.addColorStop(1, "rgba(123, 125, 255, 0)");
        ctx.fillStyle = waveGradient;
        ctx.fillRect(0, waveY - 50, canvasW, 100);
    }
    ctx.restore();

    // Grid Effect (Moving)
    ctx.strokeStyle = "rgba(105, 224, 255, 0.06)";
    ctx.lineWidth = 1;
    const gridSize = 50;
    const gridOff = bgOffset % gridSize;

    ctx.beginPath();
    for (let x = -gridOff; x < canvasW; x += gridSize) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvasH);
    }
    for (let y = 0; y < canvasH; y += gridSize) {
        ctx.moveTo(0, y); ctx.lineTo(canvasW, y);
    }
    ctx.stroke();

    ctx.strokeStyle = "rgba(123, 125, 255, 0.12)";
    ctx.beginPath();
    for (let x = -gridOff * 1.5; x < canvasW; x += gridSize * 2) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 90, canvasH);
    }
    ctx.stroke();

    // Obstacles
    for (let obs of obstacles) {
        if (obs.type === 'block') {
            const wallGradient = ctx.createLinearGradient(obs.x, 0, obs.x + obs.w, 0);
            wallGradient.addColorStop(0, "#2f193f");
            wallGradient.addColorStop(0.5, CONFIG.dangerColor);
            wallGradient.addColorStop(1, "#ff9a6c");
            ctx.fillStyle = wallGradient;
            ctx.shadowBlur = 18;
            ctx.shadowColor = CONFIG.dangerColor;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

            ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
            for (let notch = obs.y + 10; notch < obs.y + obs.h; notch += 22) {
                ctx.fillRect(obs.x + 6, notch, obs.w - 12, 3);
            }
        } else if (obs.type === 'spike') {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            ctx.rotate(bgOffset * 0.02);
            const spikeGradient = ctx.createRadialGradient(0, 0, 2, 0, 0, obs.w);
            spikeGradient.addColorStop(0, "#fff4cf");
            spikeGradient.addColorStop(0.35, CONFIG.goldColor);
            spikeGradient.addColorStop(1, CONFIG.dangerColor);
            ctx.fillStyle = spikeGradient;
            ctx.shadowBlur = 16;
            ctx.shadowColor = CONFIG.goldColor;
            ctx.beginPath();
            ctx.moveTo(0, -obs.h / 2);
            ctx.lineTo(obs.w / 2, 0);
            ctx.lineTo(0, obs.h / 2);
            ctx.lineTo(-obs.w / 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }
    ctx.shadowBlur = 0;

    // Trail
    if (player.trail.length > 1) {
        ctx.strokeStyle = CONFIG.themeColor;
        ctx.lineWidth = 5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = CONFIG.themeColor;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(player.trail[0].x, player.trail[0].y);
        for (let i = 1; i < player.trail.length; i++) {
            ctx.lineTo(player.trail[i].x, player.trail[i].y);
        }
        ctx.lineTo(player.x, player.y);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 0;
        ctx.stroke();
    }

    // Player
    if (state.isPlaying) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        ctx.shadowBlur = 24;
        ctx.shadowColor = CONFIG.themeColor;

        // Courier core
        const shipGradient = ctx.createLinearGradient(-12, 0, 14, 0);
        shipGradient.addColorStop(0, "#f9fbff");
        shipGradient.addColorStop(0.45, CONFIG.themeColor);
        shipGradient.addColorStop(1, CONFIG.accentColor);
        ctx.fillStyle = shipGradient;

        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.quadraticCurveTo(4, -10, -6, -7);
        ctx.lineTo(-12, -2);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-12, 2);
        ctx.lineTo(-6, 7);
        ctx.quadraticCurveTo(4, 10, 14, 0);
        ctx.closePath();
        ctx.fill();

        // Canopy
        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        ctx.beginPath();
        ctx.ellipse(1, 0, 5, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Thruster flare
        const thruster = input.holding ? CONFIG.goldColor : CONFIG.dangerColor;
        ctx.fillStyle = thruster;
        ctx.shadowColor = thruster;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(-18, -4 - (input.holding ? 3 : 1));
        ctx.lineTo(-16, 0);
        ctx.lineTo(-18, 4 + (input.holding ? 3 : 1));
        ctx.closePath();
        ctx.fill();

        // Wing fins
        ctx.shadowBlur = 10;
        ctx.shadowColor = CONFIG.accentColor;
        ctx.fillStyle = CONFIG.accentColor;
        ctx.beginPath();
        ctx.moveTo(-2, -5);
        ctx.lineTo(-9, -11);
        ctx.lineTo(-6, -3);
        ctx.closePath();
        ctx.moveTo(-2, 5);
        ctx.lineTo(-9, 11);
        ctx.lineTo(-6, 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.random()*3+1, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

document.addEventListener('DOMContentLoaded', init);

</script>
