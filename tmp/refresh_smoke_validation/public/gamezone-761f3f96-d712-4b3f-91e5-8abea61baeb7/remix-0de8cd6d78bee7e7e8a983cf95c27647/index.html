<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, viewport-fit=cover">
    <title>Arcade Striker 7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-dark: #07111f;
            --bg-deep: #020814;
            --panel: rgba(10, 22, 39, 0.78);
            --panel-border: rgba(120, 229, 255, 0.32);
            --panel-highlight: rgba(255, 255, 255, 0.12);
            --blue: #57b9ff;
            --red: #ff6e6e;
            --yellow: #ffd54a;
            --green-field: #11824b;
            --green-field-dark: #0a4b34;
            --white: #ffffff;
            --ui-text: #ecf7ff;
            --neon-cyan: #78e5ff;
            --neon-lime: #8dff88;
            --goal-glow: #ffe166;
            --shadow-deep: rgba(0, 0, 0, 0.42);
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Exo 2', system-ui, sans-serif;
            background:
                radial-gradient(circle at top, rgba(120, 229, 255, 0.15), transparent 30%),
                linear-gradient(180deg, var(--bg-dark), var(--bg-deep));
            color: var(--ui-text);
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        button { font: inherit; cursor: pointer; border: 0; }
        .font-display { font-family: 'Audiowide', 'Trebuchet MS', sans-serif; }
        .font-ui { font-family: 'Exo 2', system-ui, sans-serif; }
        .font-mono { font-family: 'Press Start 2P', system-ui, sans-serif; }
        .screen-fill { position: absolute; inset: 0; }
        .hidden { display: none !important; }
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(18, 36, 60, 0.92), rgba(7, 19, 34, 0.88)),
                var(--panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            box-shadow:
                inset 0 1px 0 var(--panel-highlight),
                0 10px 28px var(--shadow-deep);
        }
        .text-shadow { text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), 0 0 16px rgba(120, 229, 255, 0.16); }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 50% 18%, rgba(120, 229, 255, 0.15), transparent 22%),
                linear-gradient(180deg, #0c4932, #093323);
            overflow: hidden;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .score-card {
            min-width: 86px;
            padding: 0.5rem 0.9rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .score-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
        }
        .score-label.blue { color: #93c5fd; }
        .score-label.red { color: #fca5a5; }
        .score-value {
            color: var(--white);
            font-size: 2rem;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            line-height: 1;
            letter-spacing: 0.04em;
        }
        .timer-pill {
            margin-top: 0.5rem;
            padding: 0.25rem 1rem;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #timer {
            color: var(--goal-glow);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        #controls-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 1.5rem 2rem;
        }
        .controls-row {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .control-zone { pointer-events: auto; }
        #joystick-zone {
            position: relative;
            width: 10rem;
            height: 10rem;
            touch-action: none;
        }
        #joystick-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 8rem;
            height: 8rem;
            background:
                radial-gradient(circle at 30% 30%, rgba(120, 229, 255, 0.2), rgba(255, 255, 255, 0.04)),
                rgba(3, 15, 29, 0.52);
            border-radius: 999px;
            border: 2px solid rgba(120, 229, 255, 0.28);
            box-shadow: inset 0 0 0 8px rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #joystick-stick {
            position: absolute;
            width: 3.5rem;
            height: 3.5rem;
            background: radial-gradient(circle at 35% 35%, #faffff, #8dddf9 70%, #54a6c6);
            border-radius: 999px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25), 0 0 20px rgba(120, 229, 255, 0.35);
            transform: translate(-50%, -50%);
            transition: transform 75ms;
            display: none;
        }
        .button-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 0.5rem;
        }
        #kick-btn {
            width: 6rem;
            height: 6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: 2px solid #ffe7a3;
            color: #1e1200;
            font-family: 'Press Start 2P', system-ui, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            background: radial-gradient(circle at 30% 30%, #ffe166, #ff8f1f 70%);
            box-shadow: 0 4px 0 #b45309, 0 12px 20px rgba(0,0,0,0.42), 0 0 24px rgba(255, 212, 74, 0.25);
            transition: transform 0.1s, filter 0.1s;
            touch-action: manipulation;
        }
        #kick-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 0 0 #b45309, 0 4px 5px rgba(0,0,0,0.4);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .dark-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark-overlay-heavy {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .menu-card {
            width: min(100%, 24rem);
            margin: 0 1rem;
            padding: 1.85rem;
            border-radius: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .menu-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(120, 229, 255, 0.16), transparent 35%),
                linear-gradient(135deg, rgba(255,255,255,0.06), transparent 45%);
            pointer-events: none;
        }
        .start-card { border-top: 4px solid #57b9ff; }
        .end-card { border-top: 4px solid #ffd54a; }
        .hero-icon {
            margin-bottom: 0.75rem;
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 0 12px rgba(255, 224, 102, 0.35));
        }
        .headline {
            margin: 0 0 0.25rem;
            color: var(--white);
            font-size: clamp(2.4rem, 8vw, 3.4rem);
            line-height: 0.95;
            font-style: italic;
        }
        .subhead {
            margin: 0 0 1.2rem;
            color: #9fe8ff;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .instruction-box {
            margin-bottom: 1.25rem;
            padding: 1rem;
            border-radius: 0.9rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(4, 15, 28, 0.55));
            border: 1px solid rgba(120, 229, 255, 0.16);
            text-align: left;
            color: #d7ebf6;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .instruction-box p { margin: 0 0 0.55rem; }
        .instruction-box p:last-child { margin-bottom: 0; }
        .primary-btn {
            width: 100%;
            padding: 0.95rem;
            border-radius: 0.9rem;
            color: var(--white);
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            background: linear-gradient(90deg, #1397ff, #4e5cff);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25), 0 0 20px rgba(87, 185, 255, 0.18);
        }
        .primary-btn:active { transform: scale(0.98); }
        .secondary-btn {
            width: 100%;
            padding: 0.95rem;
            border-radius: 0.9rem;
            color: #10263d;
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            background: linear-gradient(180deg, #fff7d8, #ffd54a);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        .end-title {
            margin: 0 0 0.5rem;
            color: var(--white);
            font-size: clamp(2.3rem, 8vw, 3.2rem);
        }
        .end-scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
        .end-team-name {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .end-team-name.blue { color: var(--blue); }
        .end-team-name.red { color: var(--red); }
        .end-score {
            color: var(--white);
            font-size: 3rem;
            line-height: 1;
            font-family: 'Press Start 2P', system-ui, sans-serif;
        }
        .dash {
            color: #9ca3af;
            font-size: 2rem;
            font-weight: 700;
        }

        #goal-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .goal-text {
            color: var(--goal-glow);
            font-size: clamp(3rem, 14vw, 5.2rem);
            font-family: 'Audiowide', 'Trebuchet MS', sans-serif;
            font-style: italic;
            letter-spacing: 0.08em;
            transform: scale(1.25);
            text-shadow: 0 0 10px rgba(255, 224, 102, 0.5), 0 0 28px rgba(255, 224, 102, 0.3);
            animation: pulse 1s infinite;
        }

        .feedback-gif {
            position: absolute;
            right: 0.75rem;
            bottom: 7.5rem;
            z-index: 18;
            width: min(34vw, 9rem);
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.32);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            object-fit: cover;
            background: rgba(5, 14, 28, 0.72);
            opacity: 0;
            transform: translateY(12px) scale(0.92);
            transition: opacity 180ms ease, transform 180ms ease;
            pointer-events: none;
        }
        .feedback-gif.visible {
            opacity: 0.94;
            transform: translateY(0) scale(1);
        }
        #result-gif {
            top: 1rem;
            right: 1rem;
            bottom: auto;
            width: min(40vw, 10rem);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1.35); }
            50% { transform: scale(1.45); }
        }

        @media (max-width: 640px) {
            .menu-card { padding: 1.35rem; }
            .instruction-box { font-size: 0.9rem; }
            .end-scoreboard { gap: 1rem; }
            .score-value { font-size: 1.75rem; }
            #timer { font-size: 0.82rem; }
            #kick-btn { width: 5.5rem; height: 5.5rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="glass-panel score-card">
                <span class="score-label blue font-display">YOU</span>
                <span id="score-blue" class="score-value text-shadow">0</span>
            </div>
            <div class="glass-panel timer-pill">
                <span id="timer" class="font-mono">2:00</span>
            </div>
            <div class="glass-panel score-card">
                <span class="score-label red font-display">RIVAL</span>
                <span id="score-red" class="score-value text-shadow">0</span>
            </div>
        </div>

        <!-- Touch Controls Layer -->
        <div id="controls-layer" class="hidden">
            <div class="controls-row">
                <!-- Joystick Zone -->
                <div id="joystick-zone" class="control-zone">
                    <div id="joystick-base"></div>
                    <div id="joystick-stick" style="left: 64px; top: 64px;"></div>
                </div>
                
                <!-- Buttons Zone -->
                <div class="control-zone button-zone">
                    <button id="kick-btn">
                        KICK
                    </button>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen dark-overlay">
            <div class="glass-panel menu-card start-card">
                <div class="hero-icon">⚽🔥</div>
                <h1 class="headline font-display text-shadow">ARCADE<br>STRIKER 7</h1>
                <p class="subhead">Neon turf. Rival heat. Fast 7v7 showdown.</p>
                <div class="instruction-box">
                    <p>🕹️ <b>Left Stick:</b> Move the nearest player to the ball</p>
                    <p>👟 <b>Right Button:</b> Kick when you reach the ball</p>
                    <p>🥅 <b>Goal:</b> Score in the top net before time runs out</p>
                </div>
                <button id="start-btn" class="primary-btn">
                    START MATCH
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden overlay-screen dark-overlay-heavy">
            <div class="glass-panel menu-card end-card">
                <h2 id="end-title" class="end-title font-display text-shadow">FULL TIME!</h2>
                <div class="end-scoreboard">
                    <div class="text-center">
                        <div class="end-team-name blue font-display">YOU</div>
                        <div id="end-score-blue" class="end-score">2</div>
                    </div>
                    <div class="dash">-</div>
                    <div class="text-center">
                        <div class="end-team-name red font-display">RIVAL</div>
                        <div id="end-score-red" class="end-score">1</div>
                    </div>
                </div>
                <button id="restart-btn" class="secondary-btn">
                    PLAY AGAIN
                </button>
            </div>
        </div>
        
        <!-- Goal Overlay -->
        <div id="goal-overlay" class="hidden">
            <h1 class="goal-text text-shadow">GOAL!</h1>
        </div>

        <!-- [agent-note][stage3] resolved-gif: goal/result-feedback -> catalogs/gifs.json | caution: keep-gif-off-playfield -->
        <img id="goal-gif" class="feedback-gif hidden" alt="Goal celebration reaction" src="https://i.giphy.com/ye080RbECtcCnkrSyD.webp">
        <img id="result-gif" class="feedback-gif hidden" alt="Match result reaction" src="https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp">
    </div>

    <script>
    /**
     * SUPER STRIKER 7 - Single File Remake
     * 7v7 Casual Soccer
     */

    // --- AUDIO SYSTEM ---
    const ASSETS = {
        bgm: "https://gamezone-virid.vercel.app/assets/audios/music/action_loop_01.mp3",
        resultLoops: {
            win: "https://gamezone-virid.vercel.app/assets/audios/music/victory_loop_01.mp3",
            lose: "https://gamezone-virid.vercel.app/assets/audios/music/defeat_loop_01.mp3"
        },
        sfx: {
            start: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
            kickoff: "https://gamezone-virid.vercel.app/assets/audios/ui/ui_click_02.mp3",
            kick: "https://gamezone-virid.vercel.app/assets/audios/sfx/shoot_01.mp3",
            dribble: "https://gamezone-virid.vercel.app/assets/audios/sfx/hit_02.mp3",
            goal: "https://gamezone-virid.vercel.app/assets/audios/sfx/bonus_02.mp3",
            win: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3",
            lose: "https://gamezone-virid.vercel.app/assets/audios/ui/fail_01.mp3",
            draw: "https://gamezone-virid.vercel.app/assets/audios/ui/menu_open_01.mp3"
        }
    };

    class AudioController {
        constructor() {
            this.enabled = true;
            this.started = false;
            this.sfxLastPlayed = {};
            this.bgm = this.createLoop(ASSETS.bgm, 0.2);
            this.resultLoops = {
                win: this.createLoop(ASSETS.resultLoops.win, 0.2),
                lose: this.createLoop(ASSETS.resultLoops.lose, 0.2)
            };
            this.sfx = {};
            for (const [key, url] of Object.entries(ASSETS.sfx)) {
                const audio = new Audio(url);
                audio.preload = 'auto';
                this.sfx[key] = audio;
            }
        }
        createLoop(url, volume) {
            const track = new Audio(url);
            track.loop = true;
            track.volume = volume;
            track.preload = 'auto';
            return track;
        }
        prime() {
            if (this.started) return;
            this.started = true;
            this.bgm.load();
            Object.values(this.resultLoops).forEach(track => track.load());
            Object.values(this.sfx).forEach(sound => sound.load());
        }
        stopLoop(track) {
            if (!track) return;
            track.pause();
            track.currentTime = 0;
        }
        stopAllLoops() {
            this.stopLoop(this.bgm);
            Object.values(this.resultLoops).forEach(track => this.stopLoop(track));
        }
        playBGM() {
            if (!this.enabled) return;
            this.stopAllLoops();
            this.bgm.play().catch(() => {});
        }
        playResultLoop(kind) {
            if (!this.enabled || !this.resultLoops[kind]) return;
            this.stopAllLoops();
            this.resultLoops[kind].play().catch(() => {});
        }
        stopBGM() {
            this.stopAllLoops();
        }
        playSFX(key, { volume = 0.55, debounceMs = 90 } = {}) {
            if (!this.enabled || !this.sfx[key]) return;
            const now = performance.now();
            if ((this.sfxLastPlayed[key] || 0) + debounceMs > now) return;
            this.sfxLastPlayed[key] = now;
            const clone = this.sfx[key].cloneNode();
            clone.volume = volume;
            clone.play().catch(() => {});
        }
    }
    const audio = new AudioController();

    // --- GAME CONSTANTS ---
    const PITCH_WIDTH = 600;
    const PITCH_HEIGHT = 1000;
    const GOAL_WIDTH = 180;
    const PLAYER_RADIUS = 18;
    const BALL_RADIUS = 10;
    const MATCH_TIME = 120; // seconds

    // --- INPUT SYSTEM ---
    const Input = {
        joystick: { active: false, x: 0, y: 0, originX: 0, originY: 0, id: null },
        kick: false,
        
        init() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const base = document.getElementById('joystick-base');
            const kickBtn = document.getElementById('kick-btn');

            // Joystick Touch
            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                this.joystick.id = touch.identifier;
                this.joystick.active = true;
                this.joystick.originX = touch.clientX;
                this.joystick.originY = touch.clientY;
                
                // Visuals
                const rect = zone.getBoundingClientRect();
                base.style.left = (touch.clientX - rect.left - 64) + 'px';
                base.style.top = (touch.clientY - rect.top - 64) + 'px';
                stick.style.display = 'block';
                stick.style.left = (touch.clientX - rect.left) + 'px';
                stick.style.top = (touch.clientY - rect.top) + 'px';
                stick.style.transform = `translate(-50%, -50%)`;
            }, {passive: false});

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let i=0; i<e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === this.joystick.id) {
                        const touch = e.changedTouches[i];
                        const dx = touch.clientX - this.joystick.originX;
                        const dy = touch.clientY - this.joystick.originY;
                        const dist = Math.hypot(dx, dy);
                        const maxDist = 50;
                        
                        const angle = Math.atan2(dy, dx);
                        const clampedDist = Math.min(dist, maxDist);
                        
                        this.joystick.x = Math.cos(angle) * (clampedDist / maxDist);
                        this.joystick.y = Math.sin(angle) * (clampedDist / maxDist);

                        // Visuals
                        const rect = zone.getBoundingClientRect();
                        const stickX = (this.joystick.originX - rect.left) + Math.cos(angle) * clampedDist;
                        const stickY = (this.joystick.originY - rect.top) + Math.sin(angle) * clampedDist;
                        stick.style.left = stickX + 'px';
                        stick.style.top = stickY + 'px';
                    }
                }
            }, {passive: false});

            const endJoystick = (e) => {
                for (let i=0; i<e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === this.joystick.id) {
                        this.joystick.active = false;
                        this.joystick.x = 0;
                        this.joystick.y = 0;
                        this.joystick.id = null;
                        stick.style.display = 'none';
                    }
                }
            };
            zone.addEventListener('touchend', endJoystick);
            zone.addEventListener('touchcancel', endJoystick);

            // Kick Button
            const handleKick = (e) => {
                if (e.cancelable) e.preventDefault();
                this.kick = true;
                setTimeout(() => this.kick = false, 100); // Pulse
            };
            kickBtn.addEventListener('touchstart', handleKick, {passive: false});
            kickBtn.addEventListener('pointerdown', handleKick);
            
            // Desktop Joystick Debug
            window.addEventListener('keydown', e => {
                if(e.key === 'ArrowUp') this.joystick.y = -1;
                if(e.key === 'ArrowDown') this.joystick.y = 1;
                if(e.key === 'ArrowLeft') this.joystick.x = -1;
                if(e.key === 'ArrowRight') this.joystick.x = 1;
                if(e.key === ' ') this.kick = true;
                this.joystick.active = (this.joystick.x !==0 || this.joystick.y !== 0);
            });
            window.addEventListener('keyup', e => {
                if(['ArrowUp','ArrowDown'].includes(e.key)) this.joystick.y = 0;
                if(['ArrowLeft','ArrowRight'].includes(e.key)) this.joystick.x = 0;
                if(e.key === ' ') this.kick = false;
                this.joystick.active = (this.joystick.x !==0 || this.joystick.y !== 0);
            });
        }
    };

    // --- GAME LOGIC ---
    class FeedbackController {
        constructor() {
            this.goalGif = document.getElementById('goal-gif');
            this.resultGif = document.getElementById('result-gif');
            this.goalTimer = null;
            this.resultTimer = null;
        }
        showGoal() {
            this.goalGif.classList.remove('hidden');
            requestAnimationFrame(() => this.goalGif.classList.add('visible'));
            clearTimeout(this.goalTimer);
            this.goalTimer = setTimeout(() => this.hideGoal(), 1800);
        }
        hideGoal() {
            this.goalGif.classList.remove('visible');
            clearTimeout(this.goalTimer);
            this.goalTimer = setTimeout(() => this.goalGif.classList.add('hidden'), 180);
        }
        showResult(isWin) {
            this.resultGif.src = isWin
                ? 'https://i.giphy.com/BfOcbEYf0YLZ0czxGF.webp'
                : 'https://i.giphy.com/NP6vhfTYwxlV4Wc7ms.webp';
            this.resultGif.alt = isWin ? 'Victory reaction' : 'Defeat reaction';
            this.resultGif.classList.remove('hidden');
            requestAnimationFrame(() => this.resultGif.classList.add('visible'));
            clearTimeout(this.resultTimer);
        }
        hideResult() {
            this.resultGif.classList.remove('visible');
            clearTimeout(this.resultTimer);
            this.resultTimer = setTimeout(() => this.resultGif.classList.add('hidden'), 180);
        }
    }

    class Game {
        constructor() {
            this.canvas = document.getElementById('gameCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            
            this.state = 'start'; // start, play, goal, end
            this.timer = MATCH_TIME;
            this.scores = { blue: 0, red: 0 };
            
            this.entities = [];
            this.ball = null;
            this.camera = { x: 0, y: 0 };
            this.feedback = new FeedbackController();
            this.lastDribbleSoundAt = 0;

            this.resize();
            window.addEventListener('resize', () => this.resize());
            
            Input.init();
        }

        resize() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.canvas.width = this.width;
            this.canvas.height = this.height;
        }

        startMatch() {
            this.state = 'play';
            this.timer = MATCH_TIME;
            this.scores = { blue: 0, red: 0 };
            this.updateUI();
            this.resetPositions('kickoff');
            this.feedback.hideResult();
            audio.playSFX('start', { volume: 0.55, debounceMs: 120 });
            audio.playBGM();
            audio.playSFX('kickoff', { volume: 0.4, debounceMs: 120 });
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-layer').classList.remove('hidden');
            
            this.loop();
        }

        resetPositions(mode = 'kickoff') {
            this.entities = [];
            
            // Ball
            this.ball = { 
                x: PITCH_WIDTH/2, y: PITCH_HEIGHT/2, 
                vx: 0, vy: 0, 
                radius: BALL_RADIUS, type: 'ball',
                friction: 0.97
            };
            this.entities.push(this.ball);

            // Formations (7v7)
            // Blue (User) - Attacks Up (Goal at 0)
            // Red (Enemy) - Attacks Down (Goal at Height)
            // Note: Canvas Y=0 is top. 
            // Let's say: User defends Bottom (Y=Height), Attacks Top (Y=0).
            // So Blue Goal is at PITCH_HEIGHT, Red Goal is at 0.
            
            const formations = {
                blue: [
                    {x: 0.5, y: 0.95, role: 'gk'}, // GK
                    {x: 0.3, y: 0.8}, {x: 0.7, y: 0.8}, // DEF
                    {x: 0.2, y: 0.6}, {x: 0.8, y: 0.6}, // MID
                    {x: 0.45, y: 0.48}, {x: 0.55, y: 0.48} // FWD (Near center)
                ],
                red: [
                    {x: 0.5, y: 0.05, role: 'gk'}, // GK
                    {x: 0.3, y: 0.2}, {x: 0.7, y: 0.2}, // DEF
                    {x: 0.2, y: 0.4}, {x: 0.8, y: 0.4}, // MID
                    {x: 0.45, y: 0.52}, {x: 0.55, y: 0.52} // FWD
                ]
            };

            // Spawn Blue
            formations.blue.forEach((p, i) => {
                this.entities.push({
                    x: p.x * PITCH_WIDTH,
                    y: p.y * PITCH_HEIGHT,
                    vx: 0, vy: 0,
                    radius: PLAYER_RADIUS,
                    team: 'blue',
                    role: p.role || 'field',
                    id: i,
                    speed: 3.5,
                    angle: -Math.PI/2 // Facing Up
                });
            });

            // Spawn Red
            formations.red.forEach((p, i) => {
                this.entities.push({
                    x: p.x * PITCH_WIDTH,
                    y: p.y * PITCH_HEIGHT,
                    vx: 0, vy: 0,
                    radius: PLAYER_RADIUS,
                    team: 'red',
                    role: p.role || 'field',
                    id: i,
                    speed: 3.2, // Slightly slower than player
                    angle: Math.PI/2 // Facing Down
                });
            });
        }

        update() {
            if (this.state !== 'play') return;

            // Timer
            if (Math.random() < 0.016) { // Approx every second
                this.timer -= 1/60;
                if (this.timer <= 0) this.endGame();
                this.updateUI();
            }

            // 1. Determine Active Player (Blue team closest to ball)
            let closestDist = Infinity;
            let activePlayer = null;
            this.entities.filter(e => e.team === 'blue').forEach(p => {
                const d = Math.hypot(p.x - this.ball.x, p.y - this.ball.y);
                if (d < closestDist) {
                    closestDist = d;
                    activePlayer = p;
                }
                p.controlled = false;
            });
            if (activePlayer) activePlayer.controlled = true;

            // 2. Entity Logic
            this.entities.forEach(e => {
                if (e.type === 'ball') this.updateBall(e);
                else this.updatePlayer(e, activePlayer);
            });

            // 3. Camera Follow
            // Target is midpoint between active player and ball
            let targetX, targetY;
            if (activePlayer) {
                targetX = (activePlayer.x + this.ball.x) / 2;
                targetY = (activePlayer.y + this.ball.y) / 2;
            } else {
                targetX = this.ball.x;
                targetY = this.ball.y;
            }

            // Smooth camera
            this.camera.x += (targetX - this.width/2 - this.camera.x) * 0.1;
            this.camera.y += (targetY - this.height/2 - this.camera.y) * 0.1;

            // Clamp Camera
            this.camera.x = Math.max(0, Math.min(this.camera.x, PITCH_WIDTH - this.width));
            this.camera.y = Math.max(0, Math.min(this.camera.y, PITCH_HEIGHT - this.height));
            
            // If screen is wider than pitch, center it
            if (this.width > PITCH_WIDTH) this.camera.x = -(this.width - PITCH_WIDTH)/2;
        }

        updatePlayer(p, activePlayer) {
            // Physics
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.8; // Friction
            p.vy *= 0.8;

            // Movement Logic
            let dx = 0, dy = 0;

            if (p.controlled && Input.joystick.active) {
                // User Control
                dx = Input.joystick.x * p.speed;
                dy = Input.joystick.y * p.speed;
                p.angle = Math.atan2(dy, dx);
            } else {
                // AI Logic
                const distToBall = Math.hypot(this.ball.x - p.x, this.ball.y - p.y);
                const isGK = p.role === 'gk';
                
                // Simple AI:
                // 1. If very close to ball, chase it.
                // 2. If GK, stay near goal x, track ball y (clamped).
                // 3. Else, maintain formation relative to ball y.

                if (isGK) {
                    const goalY = p.team === 'blue' ? PITCH_HEIGHT - 50 : 50;
                    const idealX = Math.max(PITCH_WIDTH/2 - 50, Math.min(PITCH_WIDTH/2 + 50, this.ball.x));
                    dx = (idealX - p.x) * 0.05;
                    dy = (goalY - p.y) * 0.05;
                } else {
                    // Field Player
                    let targetX = p.x;
                    let targetY = p.y;
                    
                    // Attack Vector
                    const attackY = p.team === 'blue' ? 0 : PITCH_HEIGHT;
                    
                    // If team has ball (ball moving in attack dir), move up.
                    // If enemy has ball, retreat.
                    
                    // Simpler: Move towards ball if within range, else return to formation
                    const range = 200;
                    if (distToBall < range) {
                        const angle = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
                        dx = Math.cos(angle) * p.speed * 0.8;
                        dy = Math.sin(angle) * p.speed * 0.8;
                    } else {
                        // Return to relative home
                        // We don't have stored home, just drift to center Y based on ball
                        const ballYFactor = this.ball.y / PITCH_HEIGHT;
                        // Blue attacks UP (0). If ball is at 0, blue should be high.
                        // Red attacks DOWN (H). If ball is at H, red should be high.
                        
                        // Just drift towards ball slowly
                        dx = (this.ball.x - p.x) * 0.01;
                        dy = (this.ball.y - p.y) * 0.01;
                    }
                }
                
                // Facing
                if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) p.angle = Math.atan2(dy, dx);
            }

            // Apply Move
            p.x += dx;
            p.y += dy;

            // Bounds
            p.x = Math.max(PLAYER_RADIUS, Math.min(PITCH_WIDTH - PLAYER_RADIUS, p.x));
            p.y = Math.max(PLAYER_RADIUS, Math.min(PITCH_HEIGHT - PLAYER_RADIUS, p.y));

            // Ball Interaction (Dribble / Kick)
            const dist = Math.hypot(this.ball.x - p.x, this.ball.y - p.y);
            if (dist < PLAYER_RADIUS + BALL_RADIUS + 5) {
                // Collision/Dribble
                if (p.controlled && Input.kick) {
                    // KICK!
                    const kickPower = 15;
                    this.ball.vx = Math.cos(p.angle) * kickPower;
                    this.ball.vy = Math.sin(p.angle) * kickPower;
                    audio.playSFX('kick', { volume: 0.6, debounceMs: 110 });
                    // Push player back slightly
                    p.vx -= Math.cos(p.angle) * 2;
                    p.vy -= Math.sin(p.angle) * 2;
                } else {
                    // Dribble (Nudge ball)
                    const angle = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
                    const force = 0.5;
                    this.ball.vx += Math.cos(angle) * force;
                    this.ball.vy += Math.sin(angle) * force;

                    const now = performance.now();
                    if (now - this.lastDribbleSoundAt > 280) {
                        this.lastDribbleSoundAt = now;
                        audio.playSFX('dribble', { volume: 0.25, debounceMs: 220 });
                    }
                    
                    // AI Kick
                    if (!p.controlled && p.team === 'red') {
                        // Red shoots DOWN (Positive Y)
                        // If close to goal, shoot
                        if (p.y > PITCH_HEIGHT * 0.7) {
                            if (Math.random() < 0.05) {
                                this.ball.vx = (Math.random()-0.5) * 5;
                                this.ball.vy = 12; // Shoot down
                                audio.playSFX('kick', { volume: 0.52, debounceMs: 110 });
                            }
                        } else {
                            // Pass/Dribble down
                            this.ball.vy += 0.5;
                        }
                    }
                }
            }
        }

        updateBall(b) {
            b.x += b.vx;
            b.y += b.vy;
            b.vx *= b.friction;
            b.vy *= b.friction;

            // Wall Bounces
            if (b.x < b.radius) { b.x = b.radius; b.vx *= -0.8; }
            if (b.x > PITCH_WIDTH - b.radius) { b.x = PITCH_WIDTH - b.radius; b.vx *= -0.8; }
            
            // Goal Logic
            // Top Goal (Blue Attacks Here) -> y < 0
            // Bottom Goal (Red Attacks Here) -> y > HEIGHT
            
            // Check if within goal width
            const inGoalWidth = b.x > (PITCH_WIDTH - GOAL_WIDTH)/2 && b.x < (PITCH_WIDTH + GOAL_WIDTH)/2;

            if (b.y < 0) {
                if (inGoalWidth) this.scoreGoal('blue');
                else { b.y = 0; b.vy *= -0.8; }
            }
            if (b.y > PITCH_HEIGHT) {
                if (inGoalWidth) this.scoreGoal('red');
                else { b.y = PITCH_HEIGHT; b.vy *= -0.8; }
            }
        }

        scoreGoal(team) {
            this.state = 'goal';
            this.scores[team]++;
            this.updateUI();
            this.feedback.showGoal();
            audio.playSFX('goal', { volume: 0.62, debounceMs: 250 });
            
            const overlay = document.getElementById('goal-overlay');
            overlay.classList.remove('hidden');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                if (this.timer > 0) {
                    this.resetPositions();
                    this.state = 'play';
                } else {
                    this.endGame();
                }
            }, 2000);
        }

        endGame() {
            this.state = 'end';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls-layer').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            document.getElementById('end-score-blue').innerText = this.scores.blue;
            document.getElementById('end-score-red').innerText = this.scores.red;
            
            let title = "DRAW!";
            let resultAudio = 'draw';
            if (this.scores.blue > this.scores.red) {
                title = "MATCH WON!";
                resultAudio = 'win';
                this.feedback.showResult(true);
                audio.playResultLoop('win');
            } else if (this.scores.blue < this.scores.red) {
                title = "MATCH LOST!";
                resultAudio = 'lose';
                this.feedback.showResult(false);
                audio.playResultLoop('lose');
            } else {
                this.feedback.showResult(true);
                audio.playSFX('draw', { volume: 0.5, debounceMs: 200 });
            }
            audio.playSFX(resultAudio, { volume: 0.6, debounceMs: 180 });
            const endTitle = document.getElementById('end-title');
            endTitle.innerText = title;
            endTitle.className = 'end-title font-display text-shadow';
            endTitle.style.color = this.scores.blue > this.scores.red ? '#60a5fa' : (this.scores.blue < this.scores.red ? '#ef4444' : '#ffffff');
        }

        updateUI() {
            document.getElementById('score-blue').innerText = this.scores.blue;
            document.getElementById('score-red').innerText = this.scores.red;
            const mins = Math.floor(Math.max(0, this.timer) / 60);
            const secs = Math.floor(Math.max(0, this.timer) % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        draw() {
            // Clear
            this.ctx.fillStyle = '#06111e';
            this.ctx.fillRect(0, 0, this.width, this.height);

            this.ctx.save();
            this.ctx.translate(-this.camera.x, -this.camera.y);

            // Draw Pitch
            this.drawPitch();

            // Draw Entities
            // Shadows first
            this.entities.forEach(e => {
                this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this.ctx.beginPath();
                this.ctx.ellipse(e.x, e.y + e.radius*0.5, e.radius, e.radius*0.4, 0, 0, Math.PI*2);
                this.ctx.fill();
            });

            // Bodies
            this.entities.forEach(e => {
                if (e.type === 'ball') this.drawBall(e);
                else this.drawPlayerEntity(e);
            });
            
            // Indicator for active player
            const active = this.entities.find(e => e.controlled);
            if (active) {
                this.ctx.strokeStyle = '#fbbf24';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(active.x, active.y, active.radius + 5, 0, Math.PI*2);
                this.ctx.stroke();
            }

            this.ctx.restore();
        }

        drawPitch() {
            const fieldGradient = this.ctx.createLinearGradient(0, 0, 0, PITCH_HEIGHT);
            fieldGradient.addColorStop(0, '#0b5b3b');
            fieldGradient.addColorStop(0.55, '#12824e');
            fieldGradient.addColorStop(1, '#0a4f35');
            this.ctx.fillStyle = fieldGradient;
            this.ctx.fillRect(0, 0, PITCH_WIDTH, PITCH_HEIGHT);

            this.ctx.fillStyle = 'rgba(255,255,255,0.045)';
            for (let x = 0; x < PITCH_WIDTH; x += 60) {
                this.ctx.fillRect(x, 0, 28, PITCH_HEIGHT);
            }

            this.ctx.fillStyle = 'rgba(14, 43, 26, 0.18)';
            const stripeH = 84;
            for(let y=0; y<PITCH_HEIGHT; y+=stripeH*2) {
                this.ctx.fillRect(0, y, PITCH_WIDTH, stripeH);
            }

            this.ctx.strokeStyle = 'rgba(214,255,242,0.78)';
            this.ctx.lineWidth = 4;
            this.ctx.beginPath();
            
            // Outer
            this.ctx.strokeRect(0, 0, PITCH_WIDTH, PITCH_HEIGHT);
            
            // Center Line
            this.ctx.moveTo(0, PITCH_HEIGHT/2);
            this.ctx.lineTo(PITCH_WIDTH, PITCH_HEIGHT/2);
            
            // Center Circle
            this.ctx.moveTo(PITCH_WIDTH/2 + 70, PITCH_HEIGHT/2);
            this.ctx.arc(PITCH_WIDTH/2, PITCH_HEIGHT/2, 70, 0, Math.PI*2);
            
            // Penalty Areas
            const boxW = 300;
            const boxH = 120;
            // Top
            this.ctx.strokeRect((PITCH_WIDTH-boxW)/2, 0, boxW, boxH);
            // Bottom
            this.ctx.strokeRect((PITCH_WIDTH-boxW)/2, PITCH_HEIGHT-boxH, boxW, boxH);
            
            this.ctx.stroke();

            this.ctx.fillStyle = 'rgba(255,255,255,0.34)';
            this.ctx.fillRect((PITCH_WIDTH-GOAL_WIDTH)/2, -30, GOAL_WIDTH, 30);
            this.ctx.fillRect((PITCH_WIDTH-GOAL_WIDTH)/2, PITCH_HEIGHT, GOAL_WIDTH, 30);

            this.ctx.strokeStyle = 'rgba(255, 224, 102, 0.35)';
            this.ctx.lineWidth = 6;
            this.ctx.strokeRect((PITCH_WIDTH-GOAL_WIDTH)/2 - 3, -3, GOAL_WIDTH + 6, 6);
            this.ctx.strokeRect((PITCH_WIDTH-GOAL_WIDTH)/2 - 3, PITCH_HEIGHT - 3, GOAL_WIDTH + 6, 6);
        }

        drawBall(b) {
            const ballGlow = this.ctx.createRadialGradient(b.x - 2, b.y - 2, 2, b.x, b.y, b.radius + 3);
            ballGlow.addColorStop(0, '#ffffff');
            ballGlow.addColorStop(0.65, '#fff6d5');
            ballGlow.addColorStop(1, '#d4d9e8');
            this.ctx.fillStyle = ballGlow;
            this.ctx.beginPath();
            this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
            this.ctx.fill();

            this.ctx.strokeStyle = 'rgba(17, 24, 39, 0.35)';
            this.ctx.lineWidth = 1.5;
            this.ctx.stroke();

            this.ctx.fillStyle = '#1b2130';
            this.ctx.beginPath();
            this.ctx.arc(b.x, b.y, b.radius/2.4, 0, Math.PI*2);
            this.ctx.fill();
        }

        drawPlayerEntity(p) {
            const baseColor = p.team === 'blue' ? '#3fb4ff' : '#ff5f67';
            const trimColor = p.team === 'blue' ? '#d5f7ff' : '#ffd6d8';
            const glowColor = p.team === 'blue' ? 'rgba(63, 180, 255, 0.28)' : 'rgba(255, 95, 103, 0.24)';
            const bodyGradient = this.ctx.createRadialGradient(p.x - 6, p.y - 7, 2, p.x, p.y, p.radius + 4);
            bodyGradient.addColorStop(0, trimColor);
            bodyGradient.addColorStop(0.35, baseColor);
            bodyGradient.addColorStop(1, p.team === 'blue' ? '#0c6fcc' : '#cc3942');

            this.ctx.fillStyle = glowColor;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius + (p.controlled ? 8 : 4), 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.fillStyle = bodyGradient;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            this.ctx.fill();

            this.ctx.strokeStyle = p.controlled ? '#ffe166' : 'rgba(255,255,255,0.35)';
            this.ctx.lineWidth = p.controlled ? 3 : 1.5;
            this.ctx.stroke();

            this.ctx.fillStyle = 'rgba(255,255,255,0.26)';
            this.ctx.beginPath();
            this.ctx.arc(p.x - 5, p.y - 7, 5, 0, Math.PI*2);
            this.ctx.fill();

            this.ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            this.ctx.lineWidth = 2.5;
            this.ctx.beginPath();
            this.ctx.moveTo(p.x, p.y);
            this.ctx.lineTo(p.x + Math.cos(p.angle)*p.radius, p.y + Math.sin(p.angle)*p.radius);
            this.ctx.stroke();

            this.ctx.fillStyle = '#081420';
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y + 2, 6.5, 0, Math.PI * 2);
            this.ctx.fill();

            if (p.role !== 'gk') {
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = 'bold 10px "Press Start 2P"';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(p.id + 1, p.x, p.y + 2);
            } else {
                this.ctx.fillStyle = '#ffe166';
                this.ctx.fillRect(p.x-8, p.y-4, 16, 8);
            }
        }

        loop() {
            if (!this.state) return;
            this.update();
            this.draw();
            requestAnimationFrame(() => this.loop());
        }
    }

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        audio.prime();
        const game = new Game();

        const bindPress = (element, handler) => {
            let touchTriggered = false;
            element.addEventListener('touchend', (e) => {
                // [agent-note][stage4] repaired: mobile-cta-actionability | scope: menu buttons only | reason: preserve native tap flow outside gameplay gestures
                if (e.cancelable) e.preventDefault();
                touchTriggered = true;
                handler();
                setTimeout(() => { touchTriggered = false; }, 350);
            }, { passive: false });
            element.addEventListener('click', () => {
                if (touchTriggered) return;
                handler();
            });
        };

        bindPress(document.getElementById('start-btn'), () => {
            game.startMatch();
        });

        bindPress(document.getElementById('restart-btn'), () => {
            game.startMatch();
        });
    });
